<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提示</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            color: #495057;
        }
        .message {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        .message h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .message p {
            font-size: 1.1rem;
            color: #6c757d;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="message">
        <div class="icon">👋</div>
        <h1>您已登出</h1>
        <p>请点击右上角用户图标登录，或刷新页面，进入游客模式。</p>
    </div>
</body>
</html>
