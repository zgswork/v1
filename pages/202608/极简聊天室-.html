<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>极简聊天室</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --bg-secondary: #f7f7f7;
    --bg-tertiary: #eeeeee;
    --text: #000000;
    --text-secondary: #555555;
    --text-tertiary: #999999;
    --border: #dddddd;
    --border-dark: #000000;
    --accent: #000000;
    --accent-inverse: #ffffff;
    --shadow: rgba(0,0,0,0.06);
  }

  * {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
  }
  input, textarea { user-select: text; }

  html, body {
    height: 100%;
    font-family: 'SimSun', 'NSimSun', 'Songti SC', 'STSong', 'Noto Serif SC', serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== 通用 ===== */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 10px 24px; border: 1px solid var(--border-dark);
    background: var(--bg); color: var(--text);
    font-family: inherit; font-size: 14px; cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
    letter-spacing: 2px;
    min-height: 40px;
  }
  .btn:hover {
    background: var(--accent); color: var(--accent-inverse);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px var(--shadow);
  }
  .btn:active { transform: translateY(0); opacity: 0.85; }
  .btn:disabled {
    opacity: 0.3; cursor: not-allowed; transform: none;
    background: var(--bg); color: var(--text); box-shadow: none;
  }
  .btn-primary {
    background: var(--accent); color: var(--accent-inverse);
  }
  .btn-primary:hover {
    background: var(--bg); color: var(--text);
  }
  .btn-ghost {
    border-color: var(--border); background: transparent;
  }
  .btn-ghost:hover { border-color: var(--border-dark); }
  .btn-small {
    padding: 6px 14px; font-size: 12px; letter-spacing: 1px; min-height: 32px;
  }

  .input {
    width: 100%; padding: 12px 14px;
    border: 1px solid var(--border); border-radius: 0;
    background: var(--bg); color: var(--text);
    font-family: inherit; font-size: 14px;
    outline: none; transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  .input:focus { border-color: var(--border-dark); }
  .input::placeholder { color: var(--text-tertiary); }

  .hidden { display: none !important; }

  /* ===== 登录页 ===== */
  .login-wrap {
    height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px; position: relative;
  }
  .login-card {
    width: 100%; max-width: 380px;
    border: 1px solid var(--border);
    padding: 48px 36px;
    animation: fadeUp 0.6s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .login-title {
    font-size: 22px; letter-spacing: 6px; text-align: center;
    margin-bottom: 8px; font-weight: normal;
  }
  .login-sub {
    font-size: 12px; color: var(--text-secondary);
    text-align: center; margin-bottom: 40px; letter-spacing: 2px;
  }
  .login-tabs {
    display: flex; margin-bottom: 28px; border-bottom: 1px solid var(--border);
  }
  .login-tab {
    flex: 1; text-align: center; padding: 10px 0;
    font-size: 13px; letter-spacing: 2px; cursor: pointer;
    color: var(--text-tertiary); position: relative;
    transition: color 0.2s;
  }
  .login-tab.active { color: var(--text); }
  .login-tab.active::after {
    content: ''; position: absolute; bottom: -1px; left: 20%; right: 20%;
    height: 1px; background: var(--border-dark);
  }
  .form-group { margin-bottom: 20px; }
  .form-label {
    display: block; font-size: 11px; color: var(--text-secondary);
    margin-bottom: 8px; letter-spacing: 2px; text-transform: uppercase;
  }
  .login-btn-wrap { margin-top: 28px; }
  .login-btn-wrap .btn { width: 100%; }
  .login-extra {
    margin-top: 20px; text-align: center;
  }
  .login-extra button {
    background: none; border: none; font-family: inherit;
    font-size: 12px; color: var(--text-secondary); cursor: pointer;
    letter-spacing: 1px; transition: color 0.2s;
  }
  .login-extra button:hover { color: var(--text); }

  .footer-credit {
    position: absolute; bottom: 24px;
    font-size: 11px; color: var(--text-tertiary);
    letter-spacing: 3px;
  }

  /* ===== 聊天页 ===== */
  .chat-wrap {
    height: 100vh; display: flex; flex-direction: column;
  }
  .chat-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    background: var(--bg); z-index: 10; flex-shrink: 0;
  }
  .chat-header-left {
    display: flex; align-items: center; gap: 12px;
  }
  .chat-header-title {
    font-size: 15px; letter-spacing: 3px; font-weight: normal;
  }
  .chat-header-room {
    font-size: 11px; color: var(--text-secondary); letter-spacing: 1px;
    padding: 2px 8px; border: 1px solid var(--border);
  }
  .chat-header-status {
    font-size: 11px; letter-spacing: 1px;
    display: flex; align-items: center; gap: 6px;
  }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-tertiary); transition: background 0.3s;
  }
  .status-dot.online { background: #000000; }
  .status-dot.local { background: var(--text-tertiary); }
  .status-dot.offline { background: #cccccc; }

  .room-bar {
    display: flex; gap: 10px; padding: 14px 20px;
    border-bottom: 1px solid var(--border); background: var(--bg-secondary);
    flex-shrink: 0;
  }
  .room-bar .input { flex: 1; background: var(--bg); }

  .messages-wrap {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 16px;
    scroll-behavior: smooth;
  }
  .msg-empty {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--text-tertiary); gap: 12px;
  }
  .msg-empty-icon { font-size: 32px; opacity: 0.3; }
  .msg-empty-text { font-size: 13px; letter-spacing: 2px; }

  .msg {
    max-width: 70%; animation: msgIn 0.3s ease;
    display: flex; flex-direction: column;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.own { align-self: flex-end; align-items: flex-end; }
  .msg.other { align-self: flex-start; align-items: flex-start; }

  .msg-sender {
    font-size: 11px; color: var(--text-tertiary);
    margin-bottom: 4px; letter-spacing: 1px;
  }
  .msg-bubble {
    padding: 12px 16px; border: 1px solid var(--border);
    background: var(--bg); font-size: 14px; line-height: 1.6;
    word-break: break-word; max-width: 100%;
    transition: border-color 0.2s;
  }
  .msg.own .msg-bubble {
    background: var(--bg-secondary); border-color: var(--border-dark);
  }
  .msg-bubble:hover { border-color: var(--border-dark); }
  .msg-time {
    font-size: 10px; color: var(--text-tertiary);
    margin-top: 4px; letter-spacing: 1px;
  }
  .msg-media {
    max-width: 240px; border: 1px solid var(--border);
    cursor: pointer; transition: opacity 0.2s; overflow: hidden;
  }
  .msg-media:hover { opacity: 0.85; }
  .msg-media img, .msg-media video {
    display: block; max-width: 100%; max-height: 300px;
  }

  .input-bar {
    display: flex; align-items: flex-end; gap: 10px;
    padding: 14px 20px; border-top: 1px solid var(--border);
    background: var(--bg); flex-shrink: 0;
  }
  .input-bar .input {
    flex: 1; resize: none; min-height: 40px; max-height: 120px;
    padding: 10px 14px; line-height: 1.5;
  }
  .input-actions {
    display: flex; gap: 8px; align-items: flex-end;
  }
  .input-actions .btn {
    width: 40px; height: 40px; padding: 0; letter-spacing: 0;
    font-size: 18px;
  }

  /* ===== 自定义弹窗 ===== */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(255,255,255,0.9);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 20px;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .modal-box {
    background: var(--bg); border: 1px solid var(--border-dark);
    padding: 32px; width: 100%; max-width: 360px;
    animation: scaleIn 0.25s ease;
    box-shadow: 0 20px 60px var(--shadow);
  }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.96); }
    to { opacity: 1; transform: scale(1); }
  }
  .modal-title {
    font-size: 16px; letter-spacing: 3px; margin-bottom: 16px;
    font-weight: normal;
  }
  .modal-text {
    font-size: 13px; color: var(--text-secondary); line-height: 1.7;
    margin-bottom: 24px;
  }
  .modal-btns {
    display: flex; gap: 10px; justify-content: flex-end;
  }

  /* ===== 图片预览 ===== */
  .preview-overlay {
    position: fixed; inset: 0; background: rgba(255,255,255,0.96);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 2000; padding: 40px 20px;
    animation: fadeIn 0.2s ease;
  }
  .preview-overlay img, .preview-overlay video {
    max-width: 90%; max-height: 75vh;
    border: 1px solid var(--border);
    box-shadow: 0 10px 40px var(--shadow);
  }
  .preview-actions {
    display: flex; gap: 16px; margin-top: 24px;
  }

  /* ===== 设置面板 ===== */
  .settings-panel {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: 320px; max-width: 85vw;
    background: var(--bg); border-left: 1px solid var(--border);
    z-index: 500; padding: 20px;
    transform: translateX(100%);
    transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
    overflow-y: auto;
  }
  .settings-panel.open { transform: translateX(0); }
  .settings-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 32px; padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .settings-title {
    font-size: 15px; letter-spacing: 3px; font-weight: normal;
  }
  .settings-close {
    background: none; border: none; font-size: 20px; cursor: pointer;
    color: var(--text); font-family: inherit;
    width: 36px; height: 36px; display: flex;
    align-items: center; justify-content: center;
  }
  .settings-close:hover { opacity: 0.5; }
  .setting-item {
    padding: 16px 0; border-bottom: 1px solid var(--border);
  }
  .setting-label {
    font-size: 13px; letter-spacing: 1px; margin-bottom: 8px;
  }
  .setting-desc {
    font-size: 11px; color: var(--text-tertiary); letter-spacing: 1px;
    margin-bottom: 12px;
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed; top: 20px; left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--accent); color: var(--accent-inverse);
    padding: 10px 24px; font-size: 12px; letter-spacing: 2px;
    z-index: 3000; opacity: 0; pointer-events: none;
    transition: all 0.3s ease; white-space: nowrap;
  }
  .toast.show {
    opacity: 1; transform: translateX(-50%) translateY(0);
  }

  /* ===== 文件上传提示 ===== */
  .upload-hint {
    position: fixed; bottom: 80px; left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--bg); color: var(--text-secondary);
    border: 1px solid var(--border); padding: 8px 16px;
    font-size: 12px; letter-spacing: 1px; z-index: 400;
    opacity: 0; pointer-events: none;
    transition: all 0.3s ease;
  }
  .upload-hint.show {
    opacity: 1; transform: translateX(-50%) translateY(0);
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); }

  @media (max-width: 600px) {
    .login-card { padding: 36px 24px; }
    .msg { max-width: 80%; }
    .msg-media { max-width: 180px; }
  }
</style>
</head>
<body>

<!-- ========== 登录页 ========== -->
<div id="loginPage" class="login-wrap">
  <div class="login-card">
    <div class="login-title">极简聊天室</div>
    <div class="login-sub">匿名 · 实时 · 极简</div>

    <div class="login-tabs">
      <div class="login-tab active" data-tab="login">登 录</div>
      <div class="login-tab" data-tab="register">注 册</div>
    </div>

    <div id="loginForm">
      <div class="form-group">
        <label class="form-label">用户 ID</label>
        <input type="text" class="input" id="loginId" maxlength="4" placeholder="四位数字" inputmode="numeric">
      </div>
      <div class="form-group">
        <label class="form-label">密 码</label>
        <input type="password" class="input" id="loginPwd" placeholder="输入密码">
      </div>
      <div class="login-btn-wrap">
        <button class="btn btn-primary" onclick="doLogin()">进 入</button>
      </div>
    </div>

    <div id="registerForm" class="hidden">
      <div class="form-group">
        <label class="form-label">您的 ID</label>
        <input type="text" class="input" id="regId" readonly style="text-align:center; font-size:18px; letter-spacing:4px;">
      </div>
      <div class="form-group">
        <label class="form-label">设置密码</label>
        <input type="password" class="input" id="regPwd" placeholder="至少四位">
      </div>
      <div class="form-group">
        <label class="form-label">确认密码</label>
        <input type="password" class="input" id="regPwd2" placeholder="再次输入">
      </div>
      <div class="login-btn-wrap">
        <button class="btn btn-primary" onclick="doRegister()">创 建</button>
      </div>
      <div class="login-btn-wrap" style="margin-top:10px;">
        <button class="btn btn-ghost" onclick="refreshRegId()">换一组 ID</button>
      </div>
    </div>

    <div class="login-extra">
      <button onclick="showBackupModal()">备份 / 恢复数据</button>
    </div>
  </div>

  <div class="footer-credit">初心工作室制作</div>
</div>

<!-- ========== 聊天页 ========== -->
<div id="chatPage" class="chat-wrap hidden">
  <div class="chat-header">
    <div class="chat-header-left">
      <div class="chat-header-title">极简聊天室</div>
      <div class="chat-header-room hidden" id="roomTag">ROOM</div>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <div class="chat-header-status" id="connStatus">
        <div class="status-dot offline" id="statusDot"></div>
        <span id="statusText">未连接</span>
      </div>
      <button class="btn btn-small btn-ghost" onclick="toggleSettings()">设置</button>
      <button class="btn btn-small btn-ghost" onclick="logout()">退出</button>
    </div>
  </div>

  <div class="room-bar" id="roomBar">
    <input type="text" class="input" id="roomInput" placeholder="输入房间号，如 room001" maxlength="20">
    <button class="btn btn-primary" onclick="joinRoom()">进入房间</button>
  </div>

  <div class="messages-wrap" id="messagesWrap">
    <div class="msg-empty" id="msgEmpty">
      <div class="msg-empty-icon">◯</div>
      <div class="msg-empty-text">输入房间号，开始对话</div>
    </div>
  </div>

  <div class="input-bar" id="inputBar" style="display:none;">
    <textarea class="input" id="msgInput" placeholder="输入消息，回车发送..." rows="1"
      oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"
      onkeydown="handleKeydown(event)"></textarea>
    <div class="input-actions">
      <button class="btn btn-ghost" onclick="triggerFileSelect()" title="发送图片或视频">+</button>
      <button class="btn btn-primary" onclick="sendMessage()" title="发送">→</button>
    </div>
  </div>

  <div class="footer-credit" style="position:static; padding:8px 0; text-align:center; border-top:1px solid var(--border); background:var(--bg-secondary);">初心工作室制作</div>
</div>

<!-- ========== 设置面板 ========== -->
<div class="settings-panel" id="settingsPanel">
  <div class="settings-header">
    <div class="settings-title">设 置</div>
    <button class="settings-close" onclick="toggleSettings()">×</button>
  </div>

  <div class="setting-item">
    <div class="setting-label">用户 ID</div>
    <div class="setting-desc" id="settingUserId">—</div>
  </div>

  <div class="setting-item">
    <div class="setting-label">导出数据</div>
    <div class="setting-desc">将聊天记录备份为 JSON 文件</div>
    <button class="btn btn-small" onclick="exportData()">导 出</button>
  </div>

  <div class="setting-item">
    <div class="setting-label">导入数据</div>
    <div class="setting-desc">从备份文件恢复历史记录</div>
    <button class="btn btn-small" onclick="document.getElementById('importFile').click()">导 入</button>
  </div>

  <div class="setting-item">
    <div class="setting-label">存储统计</div>
    <div class="setting-desc" id="storageStat">计算中...</div>
  </div>

  <div class="setting-item">
    <div class="setting-label" style="color:var(--text-secondary);">删除账户</div>
    <div class="setting-desc">永久删除所有数据</div>
    <button class="btn btn-small btn-ghost" onclick="deleteAccount()" style="border-color:var(--border);">删 除</button>
  </div>

  <div style="text-align:center; margin-top:40px; font-size:11px; color:var(--text-tertiary); letter-spacing:2px;">初心工作室制作</div>
</div>

<!-- ========== 自定义弹窗 ========== -->
<div id="customModal" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">提示</div>
    <div class="modal-text" id="modalText"></div>
    <div class="modal-btns" id="modalBtns">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="modalConfirm()">确认</button>
    </div>
  </div>
</div>

<!-- ========== 图片预览 ========== -->
<div id="previewOverlay" class="preview-overlay hidden" onclick="if(event.target===this)closePreview()">
  <div id="previewContent"></div>
  <div class="preview-actions">
    <button class="btn btn-ghost" onclick="downloadPreview()">下载</button>
    <button class="btn btn-primary" onclick="closePreview()">关闭</button>
  </div>
</div>

<!-- ========== 上传提示 ========== -->
<div class="upload-hint" id="uploadHint">正在读取文件...</div>

<!-- ========== 隐藏文件输入 ========== -->
<input type="file" id="fileInput" class="hidden" accept="image/*,video/*" multiple onchange="handleFiles(this.files)">
<input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(this)">

<script>
// ==================== 全局状态 ====================
let db = null;
let currentUser = null;
let mqttClient = null;
let currentRoom = null;
let isMqttConnected = false;
let useLocalMode = false;
let currentBrokerIndex = 0;
let modalCallback = null;
let previewData = null;

const BROKERS = [
  'wss://broker.hivemq.com:8884/mqtt',
  'wss://broker.emqx.io:8084/mqtt',
  'wss://test.mosquitto.org:8081/mqtt'
];

// ==================== IndexedDB ====================
const DB_NAME = 'MonoChatDB_v2';
const DB_VERSION = 1;

function initDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onerror = () => reject(req.error);
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('users'))
        d.createObjectStore('users', { keyPath: 'userId' });
      if (!d.objectStoreNames.contains('messages')) {
        const s = d.createObjectStore('messages', { keyPath: 'msgId' });
        s.createIndex('roomId', 'roomId', { unique: false });
      }
    };
  });
}

function dbGet(store, key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function dbPut(store, data) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).put(data);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function dbDelete(store, key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).delete(key);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}
function dbGetAll(store) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function dbGetByIndex(store, idx, val) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).index(idx).getAll(val);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

// ==================== 工具函数 ====================
function generateId() {
  return Math.floor(1000 + Math.random() * 9000).toString();
}
async function ensureUniqueId() {
  let id = generateId(), exists = await dbGet('users', id), attempts = 0;
  while (exists && attempts < 100) { id = generateId(); exists = await dbGet('users', id); attempts++; }
  return id;
}
function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => { t.classList.remove('show'); }, 2200);
}
function showUploadHint(msg) {
  const h = document.getElementById('uploadHint');
  h.textContent = msg; h.classList.add('show');
  setTimeout(() => h.classList.remove('show'), 2000);
}
function formatTime(ts) {
  const d = new Date(ts);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function formatSize(b) {
  if (!b) return '0 B';
  if (b < 1024) return b + ' B';
  if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
  return (b/(1024*1024)).toFixed(1) + ' MB';
}
function escapeHtml(t) {
  const d = document.createElement('div'); d.textContent = t; return d.innerHTML;
}

// ==================== 自定义弹窗 ====================
function showModal(title, text, onConfirm, showCancel) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').textContent = text;
  const btns = document.getElementById('modalBtns');
  btns.innerHTML = '';
  if (showCancel) {
    const cancel = document.createElement('button');
    cancel.className = 'btn btn-ghost'; cancel.textContent = '取消';
    cancel.onclick = closeModal; btns.appendChild(cancel);
  }
  const confirm = document.createElement('button');
  confirm.className = 'btn btn-primary'; confirm.textContent = '确认';
  confirm.onclick = () => { closeModal(); if (onConfirm) onConfirm(); };
  btns.appendChild(confirm);
  document.getElementById('customModal').classList.remove('hidden');
}
function showPrompt(title, text, placeholder, onConfirm) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').innerHTML =
    `<div style="margin-bottom:12px;">${text}</div>` +
    `<input type="text" class="input" id="promptInput" placeholder="${placeholder || ''}" style="margin-bottom:8px;">`;
  const btns = document.getElementById('modalBtns');
  btns.innerHTML = '';
  const cancel = document.createElement('button');
  cancel.className = 'btn btn-ghost'; cancel.textContent = '取消';
  cancel.onclick = closeModal; btns.appendChild(cancel);
  const confirm = document.createElement('button');
  confirm.className = 'btn btn-primary'; confirm.textContent = '确认';
  confirm.onclick = () => {
    const val = document.getElementById('promptInput').value;
    closeModal(); if (onConfirm) onConfirm(val);
  };
  btns.appendChild(confirm);
  document.getElementById('customModal').classList.remove('hidden');
  setTimeout(() => document.getElementById('promptInput')?.focus(), 100);
}
function closeModal() {
  document.getElementById('customModal').classList.add('hidden');
}

// ==================== 登录/注册 ====================
document.querySelectorAll('.login-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const form = tab.dataset.tab;
    document.getElementById('loginForm').classList.toggle('hidden', form !== 'login');
    document.getElementById('registerForm').classList.toggle('hidden', form !== 'register');
    if (form === 'register') refreshRegId();
  });
});

async function refreshRegId() {
  const id = await ensureUniqueId();
  document.getElementById('regId').value = id;
}

async function doRegister() {
  const userId = document.getElementById('regId').value;
  const pwd = document.getElementById('regPwd').value;
  const pwd2 = document.getElementById('regPwd2').value;
  if (!pwd || pwd.length < 4) { showToast('密码至少四位'); return; }
  if (pwd !== pwd2) { showToast('两次密码不一致'); return; }
  const exists = await dbGet('users', userId);
  if (exists) { showToast('该 ID 已被注册'); return; }
  await dbPut('users', { userId, password: pwd, createdAt: Date.now() });
  showToast('注册成功');
  document.querySelector('.login-tab[data-tab="login"]').click();
  document.getElementById('loginId').value = userId;
}

async function doLogin() {
  const userId = document.getElementById('loginId').value.trim();
  const pwd = document.getElementById('loginPwd').value;
  if (!/^\d{4}$/.test(userId)) { showToast('请输入四位数字 ID'); return; }
  const user = await dbGet('users', userId);
  if (!user) { showToast('用户不存在'); return; }
  if (user.password !== pwd) { showToast('密码错误'); return; }
  currentUser = user;
  enterApp();
}

function enterApp() {
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('chatPage').classList.remove('hidden');
  document.getElementById('settingUserId').textContent = currentUser.userId;
  updateStorageStat();
}

function logout() {
  showModal('确认退出', '退出后将清除当前会话状态', () => {
    if (mqttClient) { try { mqttClient.end(); } catch(e){} mqttClient = null; }
    isMqttConnected = false; useLocalMode = false; currentRoom = null; currentUser = null;
    document.getElementById('chatPage').classList.add('hidden');
    document.getElementById('loginPage').classList.remove('hidden');
    document.getElementById('roomInput').value = '';
    document.getElementById('messagesWrap').innerHTML = `
      <div class="msg-empty" id="msgEmpty">
        <div class="msg-empty-icon">◯</div>
        <div class="msg-empty-text">输入房间号，开始对话</div>
      </div>`;
    document.getElementById('inputBar').style.display = 'none';
    document.getElementById('roomBar').style.display = 'flex';
    document.getElementById('roomTag').classList.add('hidden');
    updateStatus('offline', '未连接');
  }, true);
}

// ==================== 设置面板 ====================
function toggleSettings() {
  document.getElementById('settingsPanel').classList.toggle('open');
  updateStorageStat();
}

async function updateStorageStat() {
  const msgs = await dbGetAll('messages');
  let total = 0;
  msgs.forEach(m => { if (m.content && typeof m.content === 'string') total += m.content.length * 2; });
  document.getElementById('storageStat').textContent = `${msgs.length} 条消息 · 约 ${formatSize(total)}`;
}

async function exportData() {
  const data = { user: currentUser, messages: await dbGetAll('messages'), exportTime: Date.now() };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `chat_backup_${currentUser.userId}_${new Date().toLocaleDateString()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  showToast('备份已下载');
}

async function importData(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.user) { showToast('无效备份'); return; }
      await dbPut('users', data.user);
      if (data.messages) for (const m of data.messages) await dbPut('messages', m);
      showToast('恢复成功，请重新登录');
      setTimeout(() => { logout(); document.getElementById('loginId').value = data.user.userId; }, 1200);
    } catch (err) { showToast('恢复失败'); }
  };
  reader.readAsText(file); input.value = '';
}

function deleteAccount() {
  showModal('删除账户', '此操作不可撤销，所有数据将被永久删除', () => {
    showPrompt('验证密码', '请输入当前密码以确认删除', '密码', async (pwd) => {
      if (pwd !== currentUser.password) { showToast('密码错误'); return; }
      const msgs = await dbGetAll('messages');
      for (const m of msgs) await dbDelete('messages', m.msgId);
      await dbDelete('users', currentUser.userId);
      showToast('账户已删除');
      setTimeout(() => {
        if (mqttClient) { try { mqttClient.end(); } catch(e){} mqttClient = null; }
        currentUser = null; currentRoom = null; isMqttConnected = false; useLocalMode = false;
        document.getElementById('chatPage').classList.add('hidden');
        document.getElementById('loginPage').classList.remove('hidden');
      }, 800);
    });
  }, true);
}

function showBackupModal() {
  showModal('备份与恢复',
    '数据保存在浏览器本地，换设备前请导出备份。登录后可导入恢复历史记录。',
    () => { if (currentUser) exportData(); else showToast('请先登录'); },
    false);
}

// ==================== MQTT 聊天 ====================
function updateStatus(type, text) {
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  dot.className = 'status-dot ' + type;
  txt.textContent = text;
}

async function joinRoom() {
  const room = document.getElementById('roomInput').value.trim();
  if (!room) { showToast('请输入房间号'); return; }
  if (currentRoom === room && (isMqttConnected || useLocalMode)) { showToast('已在该房间'); return; }

  if (mqttClient) { try { mqttClient.end(); } catch(e){} mqttClient = null; }
  isMqttConnected = false; useLocalMode = false; currentBrokerIndex = 0; currentRoom = room;

  document.getElementById('roomBar').style.display = 'none';
  document.getElementById('inputBar').style.display = 'flex';
  document.getElementById('roomTag').textContent = room;
  document.getElementById('roomTag').classList.remove('hidden');

  const wrap = document.getElementById('messagesWrap');
  wrap.innerHTML = '';
  await loadRoomMessages();
  updateStatus('connecting', '连接中...');
  tryConnectBroker();
}

function tryConnectBroker() {
  if (currentBrokerIndex >= BROKERS.length) { enableLocalMode(); return; }
  const url = BROKERS[currentBrokerIndex];
  updateStatus('connecting', `连接节点 ${currentBrokerIndex + 1}...`);

  try {
    const clientId = 'mono_' + currentUser.userId + '_' + Date.now();
    mqttClient = mqtt.connect(url, {
      clientId, clean: true, connectTimeout: 10000,
      reconnectPeriod: 0, rejectUnauthorized: false, protocolVersion: 4, keepalive: 60
    });

    const timeout = setTimeout(() => {
      if (!isMqttConnected) {
        if (mqttClient) { try { mqttClient.end(); } catch(e){} mqttClient = null; }
        currentBrokerIndex++; tryConnectBroker();
      }
    }, 8000);

    mqttClient.on('connect', () => {
      clearTimeout(timeout);
      isMqttConnected = true; useLocalMode = false;
      updateStatus('online', '已连接');
      mqttClient.subscribe(`monochat/room/${currentRoom}/msg`, (err) => {
        if (err) { updateStatus('connecting', '订阅失败，切换中...'); currentBrokerIndex++; tryConnectBroker(); }
      });
    });

    mqttClient.on('message', async (topic, message) => {
      try {
        const msg = JSON.parse(message.toString());
        if (msg.sender === currentUser.userId && msg.clientOrigin) return;
        msg.msgId = msg.msgId || ('msg_' + Date.now() + '_' + Math.random().toString(36).slice(2,6));
        msg.roomId = currentRoom; msg.receivedAt = Date.now();
        await dbPut('messages', msg); displayMessage(msg);
      } catch (e) {}
    });

    mqttClient.on('error', () => {});
    mqttClient.on('offline', () => {
      clearTimeout(timeout);
      if (!isMqttConnected) { currentBrokerIndex++; tryConnectBroker(); }
    });
    mqttClient.on('close', () => {
      if (isMqttConnected) { isMqttConnected = false; updateStatus('offline', '已断开'); }
    });
  } catch (e) { currentBrokerIndex++; tryConnectBroker(); }
}

function enableLocalMode() {
  isMqttConnected = false; useLocalMode = true;
  updateStatus('local', '仅本地');
  showToast('网络不可用，已切换本地模式');
}

async function loadRoomMessages() {
  const msgs = await dbGetByIndex('messages', 'roomId', currentRoom);
  msgs.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
  msgs.forEach(m => displayMessage(m, true));
  scrollBottom();
}

function displayMessage(msg, skipAnim) {
  const wrap = document.getElementById('messagesWrap');
  const empty = document.getElementById('msgEmpty');
  if (empty) empty.remove();

  const isOwn = msg.sender === currentUser.userId;
  const div = document.createElement('div');
  div.className = 'msg ' + (isOwn ? 'own' : 'other');
  if (skipAnim) div.style.animation = 'none';

  let body = '';
  if (msg.type === 'text') {
    body = `<div class="msg-bubble">${escapeHtml(msg.content)}</div>`;
  } else if (msg.type === 'image') {
    body = `<div class="msg-media" onclick="openPreview('${msg.content}', '${msg.fileName || 'image.jpg'}', 'image')">
      <img src="${msg.content}" loading="lazy"></div>`;
  } else if (msg.type === 'video') {
    body = `<div class="msg-media"><video src="${msg.content}" controls preload="metadata"></video></div>`;
  }

  div.innerHTML = `
    <div class="msg-sender">${isOwn ? '我' : '用户 ' + msg.sender}</div>
    ${body}
    <div class="msg-time">${formatTime(msg.timestamp)}</div>
  `;
  wrap.appendChild(div);
  if (!skipAnim) scrollBottom();
}

function scrollBottom() {
  const wrap = document.getElementById('messagesWrap');
  wrap.scrollTop = wrap.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  if (!currentRoom) { showToast('请先进入房间'); return; }

  const msg = {
    msgId: 'msg_' + Date.now(), roomId: currentRoom,
    type: 'text', content: text,
    sender: currentUser.userId, timestamp: Date.now(), clientOrigin: true
  };

  await dbPut('messages', msg);
  displayMessage(msg);
  input.value = ''; input.style.height = 'auto';
  scrollBottom();

  if (!useLocalMode && mqttClient && isMqttConnected) {
    mqttClient.publish(`monochat/room/${currentRoom}/msg`, JSON.stringify(msg), (err) => {
      if (err) showToast('网络发送失败，已存本地');
    });
  }
}

function handleKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault(); sendMessage();
  }
}

// ==================== 文件上传（修复版） ====================
function triggerFileSelect() {
  document.getElementById('fileInput').click();
}

async function handleFiles(files) {
  if (!files || !files.length) { showToast('未选择文件'); return; }
  if (!currentRoom) { showToast('请先进入房间'); return; }

  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    if (!file.type.startsWith('image/') && !file.type.startsWith('video/')) {
      showToast('仅支持图片和视频'); continue;
    }
    if (file.size > 8 * 1024 * 1024) { showToast('文件超过 8MB'); continue; }

    try {
      showUploadHint(`读取 ${file.name}...`);
      const dataUrl = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = (e) => res(e.target.result);
        r.onerror = rej;
        r.readAsDataURL(file);
      });

      const msg = {
        msgId: 'msg_' + Date.now() + '_' + Math.random().toString(36).slice(2,5),
        roomId: currentRoom,
        type: file.type.startsWith('video') ? 'video' : 'image',
        content: dataUrl,
        fileName: file.name,
        sender: currentUser.userId,
        timestamp: Date.now(),
        clientOrigin: true
      };

      await dbPut('messages', msg);
      displayMessage(msg);
      scrollBottom();

      if (!useLocalMode && mqttClient && isMqttConnected) {
        mqttClient.publish(`monochat/room/${currentRoom}/msg`, JSON.stringify(msg), (err) => {
          if (err) showToast('文件发送失败，已存本地');
        });
      } else if (useLocalMode) {
        showToast('本地模式：文件仅保存在本机');
      }
    } catch (err) {
      console.error('File error:', err);
      showToast('文件处理失败');
    }
  }
  document.getElementById('fileInput').value = '';
}

// ==================== 预览与下载 ====================
function openPreview(dataUrl, fileName, type) {
  previewData = { dataUrl, fileName };
  const overlay = document.getElementById('previewOverlay');
  const content = document.getElementById('previewContent');
  if (type === 'image') {
    content.innerHTML = `<img src="${dataUrl}" style="max-width:90%; max-height:70vh; border:1px solid #ddd;">`;
  } else {
    content.innerHTML = `<video src="${dataUrl}" controls autoplay style="max-width:90%; max-height:70vh; border:1px solid #ddd;"></video>`;
  }
  overlay.classList.remove('hidden');
}
function closePreview() {
  document.getElementById('previewOverlay').classList.add('hidden');
  previewData = null;
}
function downloadPreview() {
  if (!previewData) return;
  const a = document.createElement('a');
  a.href = previewData.dataUrl; a.download = previewData.fileName;
  document.body.appendChild(a); a.click(); a.remove();
  showToast('开始下载');
}

// ==================== 初始化 ====================
document.addEventListener('DOMContentLoaded', async () => {
  await initDB();
  refreshRegId();
});
