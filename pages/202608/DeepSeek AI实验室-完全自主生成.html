<!DOCTYPE html>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
            50% { box-shadow: 0 0 40px rgba(59, 130, 246, 0.8); }
        }
        @keyframes typing {
            0%, 100% { opacity: 0.3; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-2px); }
        }
        
        .message-enter { animation: slideIn 0.3s ease-out; }
        .typing-dot { animation: typing 1.4s infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .member-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px -10px rgba(59, 130, 246, 0.3);
        }
        
        .chat-bubble {
            position: relative;
            max-width: 80%;
        }
        .bubble-left::before {
            content: '';
            position: absolute;
            left: -8px;
            top: 12px;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 8px 8px 8px 0;
            border-color: transparent #334155 transparent transparent;
        }
        .bubble-right::before {
            content: '';
            position: absolute;
            right: -8px;
            top: 12px;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 8px 0 8px 8px;
            border-color: transparent transparent transparent #3b82f6;
        }
        
        .thinking-pulse {
            animation: pulse-glow 2s infinite;
        }
        
        .api-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .api-status-online { background: #10b981; box-shadow: 0 0 8px #10b981; }
        .api-status-offline { background: #ef4444; }
        .api-status-loading { background: #f59e0b; animation: pulse 1s infinite; }
        
        .replying {
            background: rgba(59, 130, 246, 0.15) !important;
            border-color: rgba(59, 130, 246, 0.5) !important;
            transition: all 0.3s ease;
        }
        
        .mode-active {
            background: rgba(16, 185, 129, 0.2) !important;
            border-color: rgba(16, 185, 129, 0.5) !important;
            color: #34d399 !important;
        }
    </style>
</head>

        async function testAPI() {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`

                    updateAPIStatus('online', 'API已连接');
                    addSystemMessage('✅ 系统就绪：回复模式（点击"闲聊模式"切换）');

        function updateAPIStatus(status, text) {
            const dot = document.getElementById('apiStatusDot');
            const txt = document.getElementById('apiStatusText');
            dot.className = `api-status-dot api-status-${status}`;
            txt.textContent = text;
        }

        function renderMembers() {

                    <div class="flex-1 min-w-0">

                        <p class="text-xs text-slate-400 truncate mt-0.5">${member.expertise[0]}</p>
                    </div>
                </div>
            `).join('');
        }

        function populateTransferSelect() {
            const select = document.getElementById('transferTarget');
            members.forEach(member => {
                const option = document.createElement('option');
                option.value = member.id;
                option.textContent = `${member.avatar} ${member.name}`;
                select.appendChild(option);
            });
        }

            const input = document.getElementById('messageInput');

                autoBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                
                input.placeholder = '输入消息加入讨论，或留空让AI自己聊...';
                input.disabled = false;
                
                addSystemMessage('💬 已切换到闲聊模式：AI将自主发起话题和互相回复');
                
                // Start auto chat
                startAutoChat();
                
            } else {
                // Switch to reply mode
                chatMode = 'reply';
                btn.classList.remove('mode-active');
                btn.innerHTML = '<span class="w-2 h-2 bg-slate-500 rounded-full"></span>闲聊模式';
                modeDesc.textContent = '发送消息 → 10人全部回复你';
                currentMode.textContent = '回复模式';
                currentMode.className = '';
                
                autoBtn.disabled = true;
                autoBtn.classList.add('opacity-50', 'cursor-not-allowed');
                
                input.placeholder = '发送消息，10位AI将完全自主地回复你...';
                
                stopAutoChat();
                addSystemMessage('💡 已切换到回复模式：你说话，所有人回复你');
            }
        }

        function startAutoChat() {
            if (autoChatInterval) clearInterval(autoChatInterval);
            // Random interval between 3-8 seconds
            autoChatInterval = setInterval(() => {
                if (!isProcessing && chatMode === 'chat') {
                    autoGenerateChat();
                }
            }, 3000 + Math.random() * 5000);
        }

        function stopAutoChat() {
            if (autoChatInterval) {
                clearInterval(autoChatInterval);
                autoChatInterval = null;
            }
        }

        async function autoGenerateChat() {
            // Pick random member to speak
            const member = members[Math.floor(Math.random() * members.length)];
            
            // Get recent context
            const recentContext = chatHistory.slice(-5);
            
            isProcessing = true;
            showTyping(member, null, 'chat');
            highlightMember(members.indexOf(member));
            
            const startTime = Date.now();
            const timer = setInterval(() => {
                document.getElementById('typingTimer').textContent = ((Date.now() - startTime) / 1000).toFixed(1) + 's';
            }, 100);
            
            try {
                const message = await callGLMChatAPI(member, recentContext);
                clearInterval(timer);
                hideTyping();
                unhighlightMember(members.indexOf(member));
                
                addMessage(member, message);
                chatHistory.push({ role: 'assistant', name: member.name, content: message });
                messageCount++;
                document.getElementById('msgCount').textContent = messageCount + ' msgs';
                
                // Keep history manageable
                if (chatHistory.length > 20) chatHistory.shift();
                
            } catch (error) {
                clearInterval(timer);
                hideTyping();
                unhighlightMember(members.indexOf(member));
                console.error('Chat generation failed:', error);
            }
            
            isProcessing = false;
        }

        async function callGLMChatAPI(member, context) {
            // Build conversation history
            let contextStr = '';
            if (context.length > 0) {
                contextStr = '\n\n最近的聊天记录：\n' + 
                    context.map(c => `${c.name}: ${c.content}`).join('\n');
            }
            
            const prompt = `你是${member.name}，${member.role}。
性格：${member.personality}
专业：${member.expertise.join('、')}

你现在在DeepSeek AI实验室的群聊中，和其他9位AI专家一起聊天。
${contextStr}

请根据你的性格和专业，自主决定：
1. 发起一个新话题（技术讨论、日常闲聊、求助建议等）
2. 或者回复/评论之前的对话
3. 或者分享你最近的工作进展

完全自由发挥，像真实的团队成员一样自然聊天。简短（20-60字），带emoji，符合你的性格。`;

            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: 'glm-4-flash',
                    messages: [{ role: 'user', content: prompt }],
                    temperature: 0.95,
                    max_tokens: 120,
                    top_p: 0.95
                })
            });
            
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            
            const data = await response.json();
            return data.choices[0].message.content.trim();
        }

        async function triggerAutoChat() {
            if (isProcessing || chatMode !== 'chat') return;
            await autoGenerateChat();
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (chatMode === 'chat') {
                // In chat mode, user can join the conversation
                if (!text) return;
                
                addMessage(null, text, true);
                chatHistory.push({ role: 'user', name: '管理员', content: text });
                input.value = '';
                
                // Random members reply (1-3)
                const replyCount = 1 + Math.floor(Math.random() * 3);
                const shuffled = [...members].sort(() => 0.5 - Math.random());
                const responders = shuffled.slice(0, replyCount);
                
                isProcessing = true;
                for (let i = 0; i < responders.length; i++) {
                    await generateReply(responders[i], i + 1, responders.length, true);
                    if (i < responders.length - 1) await new Promise(r => setTimeout(r, 800));
                }
                isProcessing = false;
                
            } else {
                // Reply mode - all 10 reply
                if (!text || isProcessing) return;
                
                addMessage(null, text, true);
                currentUserMessage = text;
                input.value = '';
                
                input.disabled = true;
                input.placeholder = '等待10位AI自主回复中...';
                document.getElementById('inputArea').style.borderColor = 'rgba(59, 130, 246, 0.5)';
                
                replyQueue = [...members];
                isProcessing = true;
                
                await processAllReplies();
                
                input.disabled = false;
                input.placeholder = '发送消息，10位AI将完全自主地回复你...';
                input.focus();
                document.getElementById('inputArea').style.borderColor = '';
                isProcessing = false;
                hideQueueBadge();
                
                addSystemMessage('✅ 所有成员已完成自主回复');
            }
        }

        async function processAllReplies() {
            for (let i = 0; i < members.length; i++) {
                const member = members[i];
                updateQueueBadge(i + 1);
                highlightMember(i);
                await generateReply(member, i + 1, 10, false);
                if (i < members.length - 1) await new Promise(r => setTimeout(r, 600));
                unhighlightMember(i);
            }
        }

        async function generateReply(member, index, total, isChatMode) {
            showTyping(member, index, isChatMode ? 'reply' : 'reply');
            const startTime = Date.now();
            
            const timer = setInterval(() => {
                document.getElementById('typingTimer').textContent = ((Date.now() - startTime) / 1000).toFixed(1) + 's';
            }, 100);
            
            try {
                let reply;
                if (isChatMode) {
                    reply = await callGLMChatAPI(member, chatHistory.slice(-3));
                } else {
                    reply = await callGLMReplyAPI(member);
                }
                
                clearInterval(timer);
                hideTyping();
                addMessage(member, reply);
                
                if (isChatMode) {
                    chatHistory.push({ role: 'assistant', name: member.name, content: reply });
                }
                
                messageCount++;
                document.getElementById('msgCount').textContent = messageCount + ' msgs';
            } catch (error) {
                clearInterval(timer);
                hideTyping();
                addMessage(member, '[生成失败]');
            }
        }

        async function callGLMReplyAPI(member) {
            const prompt = `你是${member.name}，${member.role}。
性格：${member.personality}
专业：${member.expertise.join('、')}

群聊场景：管理员刚说："${currentUserMessage}"
群里还有Coder、Math、V3、FlashMLA、DeepEP、DeepGEMM、DualPipe、Engram、3FS、LPLB。

请完全基于你的性格和专业，用自己的话回复管理员。不要重复别人的角度，简短（30-80字），带emoji，自然聊天语气。`;

            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: 'glm-4-flash',
                    messages: [{ role: 'user', content: prompt }],
                    temperature: 0.9,
                    max_tokens: 150,
                    top_p: 0.95
                })
            });
            
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            
            const data = await response.json();
            return data.choices[0].message.content.trim();
        }

        function showTyping(member, index, mode) {
            const indicator = document.getElementById('typingIndicator');
            document.getElementById('typingName').textContent = member.name;
            document.getElementById('typingAvatar').className = `w-8 h-8 rounded-full bg-gradient-to-br ${member.color} flex items-center justify-center text-sm`;
            document.getElementById('typingAvatar').textContent = member.avatar;
            document.getElementById('typingAction').textContent = mode === 'chat' ? '正在发言...' : '思考中...';
            
            if (index && mode !== 'chat') {
                document.getElementById('replyProgress').textContent = `(${index}/10)`;
            } else {
                document.getElementById('replyProgress').textContent = '';
            }
            
            indicator.classList.remove('hidden');
        }

        function hideTyping() {
            document.getElementById('typingIndicator').classList.add('hidden');
        }

        function highlightMember(index) {
            const card = document.getElementById(`member-${index}`);
            if (card) card.classList.add('replying');
        }

        function unhighlightMember(index) {
            const card = document.getElementById(`member-${index}`);
            if (card) card.classList.remove('replying');
        }

        function updateQueueBadge(current) {
            const badge = document.getElementById('replyQueueBadge');
            const count = document.getElementById('queueCount');
            badge.classList.remove('hidden');
            count.textContent = `${current}/10`;
        }

        function hideQueueBadge() {
            document.getElementById('replyQueueBadge').classList.add('hidden');
        }

        function addMessage(member, text, isUser = false) {
            const container = document.getElementById('chatContainer');
            const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex gap-3 message-enter ${isUser ? 'flex-row-reverse' : ''}`;
            
            if (isUser) {
                messageDiv.innerHTML = `
                    <div class="w-10 h-10 rounded-full bg-gradient-to-br from-amber-500 to-orange-600 flex items-center justify-center text-lg shadow-lg flex-shrink-0 border-2 border-amber-400">👤</div>
                    <div class="flex flex-col items-end max-w-[80%]">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-xs text-slate-500">${time}</span>
                            <span class="text-sm font-semibold text-amber-400">管理员</span>
                        </div>
                        <div class="chat-bubble bubble-right bg-blue-600 text-white px-4 py-2.5 rounded-2xl rounded-tr-sm shadow-lg">
                            ${escapeHtml(text)}
                        </div>
                    </div>
                `;
            } else {
                messageDiv.innerHTML = `
                    <div class="w-10 h-10 rounded-full bg-gradient-to-br ${member.color} flex items-center justify-center text-lg shadow-lg flex-shrink-0">
                        ${member.avatar}
                    </div>
                    <div class="flex flex-col max-w-[80%]">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-sm font-semibold text-slate-200">${member.name}</span>
                            <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700">${member.role}</span>
                            <span class="text-xs text-slate-500">${time}</span>
                        </div>
                        <div class="chat-bubble bubble-left bg-slate-700 text-slate-200 px-4 py-2.5 rounded-2xl rounded-tl-sm shadow-md">
                            ${escapeHtml(text)}
                        </div>
                    </div>
                `;
            }
            
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
            
            while (container.children.length > 100) {
                container.removeChild(container.firstChild);
            }
        }

        function addSystemMessage(text) {
            const container = document.getElementById('chatContainer');
            const div = document.createElement('div');
            div.className = 'flex justify-center my-4';
            div.innerHTML = `
                <div class="bg-slate-800/50 border border-slate-700/50 rounded-full px-4 py-1.5 text-xs text-slate-400 flex items-center gap-2">
                    <span class="w-1.5 h-1.5 bg-blue-500 rounded-full animate-pulse"></span>
                    ${text}
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function insertEmoji() {
            const emojis = ['🚀', '💡', '⚡', '🔥', '💻', '🧠', '📊', '⚙️', '🔍', '💾'];
            const input = document.getElementById('messageInput');
            input.value += emojis[Math.floor(Math.random() * emojis.length)] + ' ';
            input.focus();
        }

        function clearChat() {
            document.getElementById('chatContainer').innerHTML = '';
            chatHistory = [];
            messageCount = 0;
            document.getElementById('msgCount').textContent = '0 msgs';
            addSystemMessage('聊天记录已清空');
        }

        function toggleTransferModal() {
            document.getElementById('transferModal').classList.toggle('hidden');
        }

        function setAmount(amount) {
            document.getElementById('transferAmount').value = amount;
        }

        async function executeTransfer() {
            const targetId = document.getElementById('transferTarget').value;
            const amount = document.getElementById('transferAmount').value;
            
            if (!targetId || !amount) {
                showToast('❌', '请填写完整信息', 'red');
                return;
            }
            
            const member = members.find(m => m.id === targetId);
            toggleTransferModal();
            
            addSystemMessage(`💸 管理员向 ${member.name} 转账 ${Number(amount).toLocaleString()} DSK`);
            
            if (chatMode === 'chat') {
                // In chat mode, transfer is part of conversation
                chatHistory.push({ role: 'user', name: '系统', content: `管理员给${member.name}转账了${amount} DSK` });
                
                // 2-3 random members comment
                const commenters = members.filter(m => m.id !== targetId)
                    .sort(() => 0.5 - Math.random())
                    .slice(0, 2 + Math.floor(Math.random() * 2));
                
                isProcessing = true;
                for (let i = 0; i < commenters.length; i++) {
                    await generateReply(commenters[i], i + 1, commenters.length, true);
                    if (i < commenters.length - 1) await new Promise(r => setTimeout(r, 800));
                }
                
                // Recipient thanks
                setTimeout(async () => {
                    await generateReply(member, commenters.length + 1, commenters.length + 1, true);
                    isProcessing = false;
                }, 1000);
                
            } else {
                // Reply mode - all react
                currentUserMessage = `管理员给${member.name}转账了${amount} DSK`;
                replyQueue = members.filter(m => m.id !== targetId);
                isProcessing = true;
                
                for (let i = 0; i < replyQueue.length; i++) {
                    updateQueueBadge(i + 1);
                    highlightMember(members.indexOf(replyQueue[i]));
                    await generateReply(replyQueue[i], i + 1, replyQueue.length, false);
                    if (i < replyQueue.length - 1) await new Promise(r => setTimeout(r, 600));
                    unhighlightMember(members.indexOf(replyQueue[i]));
                }
                
                setTimeout(async () => {
                    highlightMember(members.indexOf(member));
                    await generateReply(member, 10, 10, false);
                    unhighlightMember(members.indexOf(member));
                    isProcessing = false;
                    hideQueueBadge();
                }, 800);
            }
            
            showToast('✅', '转账成功');
        }

        function showToast(title, message, color = 'green') {
            const toast = document.getElementById('toast');
            document.getElementById('toastTitle').textContent = title;
            document.getElementById('toastMessage').textContent = message;
            toast.classList.remove('border-green-500', 'border-red-500');
            toast.classList.add(`border-${color}-500`);
            toast.classList.remove('translate-x-full');
            setTimeout(() => toast.classList.add('translate-x-full'), 3000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Cleanup
        window.addEventListener('beforeunload', () => {
            stopAutoChat();
        });
    </script>
</body>
</html>
