<!DOCTYPE html>
<html lang="zh">
<head>
        <script src="../static/js/runtime.js?v=20260827p"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f5f7fa; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; border-radius: 8px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #2c3e50; }
        .message { padding: 10px; border-radius: 4px; margin: 8px 0; display: none; }
        .error { background: #fee; border: 1px solid #f5c6cb; color: #721c24; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }

        /* 选项卡样式 */
        .tabs {
            display: flex;
            border-bottom: 2px solid #e8e8e8;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 10px 20px;
            border: none;
            background: transparent;
            font-size: 16px;
            cursor: pointer;
            color: #555;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: 0.2s;
        }
        .tab-btn:hover { color: #000; }
        .tab-btn.active {
            color: #3498db;
            border-bottom-color: #3498db;
            font-weight: 600;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* 原有表单样式 */
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 4px; }
        .form-group input[type="text"], .form-group input[type="password"] {
            width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
            max-width: 400px;
        }
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
        .checkbox-group label { font-weight: normal; background: #f0f2f5; padding: 4px 12px; border-radius: 20px; cursor: pointer; }
        .btn { padding: 8px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn-primary { background: #3498db; color: #fff; }
        .btn-primary:hover { background: #2980b9; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-danger:hover { background: #c0392b; }
        .btn-success { background: #2ecc71; color: #fff; }
        .btn-success:hover { background: #27ae60; }
        .btn-warning { background: #f39c12; color: #fff; }
        .btn-warning:hover { background: #e67e22; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { padding: 8px 12px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #f8f9fa; font-weight: 600; }
        .badge { background: #e6f7ff; border: 1px solid #91d5ff; border-radius: 4px; padding: 2px 8px; font-size: 12px; margin: 2px; display: inline-block; }
        .action-btns button { margin-right: 4px; }

        /* 弹窗 */
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; }
        .modal-content { background:#fff; padding:24px; border-radius:8px; width:500px; max-width:90%; }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚙️ 设置</h2>
        <div id="message" class="message"></div>

        <!-- 当前用户信息 -->
        <div class="section" style="margin-bottom:10px;">
            <p><strong>当前用户：</strong><span id="currentUsername"></span></p>
        </div>

        <!-- 选项卡导航 -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="changePwd">🔑 修改密码</button>
            <button class="tab-btn" data-tab="createUser" id="createTabBtn" style="display:none;">➕ 创建新用户</button>
            <button class="tab-btn" data-tab="userManage" id="manageTabBtn" style="display:none;">👑 用户管理</button>
        </div>

        <!-- 选项卡内容 -->
        <div class="tab-content active" id="tab-changePwd">
            <h3>修改密码</h3>
            <div class="form-group">
                <label>旧密码</label>
                <input type="password" id="oldPassword" placeholder="输入旧密码" />
            </div>
            <div class="form-group">
                <label>新密码</label>
                <input type="password" id="newPassword" placeholder="输入新密码" />
            </div>
            <div class="form-group">
                <label>确认新密码</label>
                <input type="password" id="confirmPassword" placeholder="再次输入新密码" />
            </div>
            <button id="changePwdBtn" class="btn btn-primary">修改密码</button>
        </div>

        <div class="tab-content" id="tab-createUser">
            <h3>创建新用户</h3>
            <div class="form-group">
                <label>新用户名</label>
                <input type="text" id="newUsername" placeholder="输入用户名" />
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="newUserPassword" placeholder="输入密码" />
            </div>
            <div class="form-group">
                <label>权限选择（可多选，默认全选当前用户拥有的权限）</label>
                <div id="menuCheckboxes" class="checkbox-group"></div>
            </div>
            <button id="createUserBtn" class="btn btn-success">创建用户</button>
        </div>

        <div class="tab-content" id="tab-userManage">
            <h3>用户管理</h3>
            <div id="userListContainer">
                <table>
                    <thead><tr><th>用户名</th><th>权限</th><th>操作</th></tr></thead>
                    <tbody id="userTableBody"><tr><td colspan="3">加载中...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 弹窗：修改权限 -->
    <div id="permModal" class="modal">
        <div class="modal-content">
            <h3>修改权限 - <span id="permModalUsername"></span></h3>
            <div id="permModalCheckboxes" class="checkbox-group"></div>
            <button id="permSaveBtn" class="btn btn-primary">保存</button>
            <button id="permCancelBtn" class="btn" style="background:#ccc;">取消</button>
        </div>
    </div>

    <script>
        // ========== 全局 ==========
        let currentUser = null;
        let currentMenus = [];
        let allMenus = [];

        // ========== DOM 引用 ==========
        const msgDiv = document.getElementById('message');
        const currentUsernameSpan = document.getElementById('currentUsername');

        const oldPassword = document.getElementById('oldPassword');
        const newPassword = document.getElementById('newPassword');
        const confirmPassword = document.getElementById('confirmPassword');
        const changePwdBtn = document.getElementById('changePwdBtn');

        const createTabBtn = document.getElementById('createTabBtn');
        const manageTabBtn = document.getElementById('manageTabBtn');
        const newUsername = document.getElementById('newUsername');
        const newUserPassword = document.getElementById('newUserPassword');
        const menuCheckboxes = document.getElementById('menuCheckboxes');
        const createUserBtn = document.getElementById('createUserBtn');

        const userTableBody = document.getElementById('userTableBody');

        const permModal = document.getElementById('permModal');
        const permModalUsername = document.getElementById('permModalUsername');
        const permModalCheckboxes = document.getElementById('permModalCheckboxes');
        const permSaveBtn = document.getElementById('permSaveBtn');
        const permCancelBtn = document.getElementById('permCancelBtn');

        // ========== 选项卡切换 ==========
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // 移除所有激活状态
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                const tabId = this.dataset.tab;
                document.getElementById('tab-' + tabId).classList.add('active');
            });
        });

        // ========== 工具 ==========
        function showMessage(msg, type = 'success') {
            msgDiv.style.display = 'block';
            msgDiv.textContent = msg;
            msgDiv.className = 'message ' + type;
            setTimeout(() => { msgDiv.style.display = 'none'; }, 5000);
        }

        // ========== 获取数据 ==========
        async function fetchUser() {
            try {
                const res = await fetch('/auth/user');
                return await res.json();
            } catch {
                return { logged_in: false };
            }
        }

        async function fetchMenus() {
            try {
                const res = await fetch('/auth/menus');
                return await res.json();
            } catch {
                return [];
            }
        }

        async function fetchUsers() {
            try {
                const res = await fetch('/auth/list_users');
                if (!res.ok) {
                    const err = await res.json();
                    showMessage(err.message || '获取用户列表失败', 'error');
                    return [];
                }
                return await res.json();
            } catch {
                showMessage('网络错误', 'error');
                return [];
            }
        }

        // ========== 渲染权限复选框（用于创建用户） ==========
        function renderCreatePermCheckboxes(allowedIds) {
            const available = allMenus.filter(item => allowedIds.includes(item.id));
            if (available.length === 0) {
                menuCheckboxes.innerHTML = '<span style="color:#e67e22;">您没有任何可分配的权限</span>';
                return;
            }
            menuCheckboxes.innerHTML = available.map(item => `
                <label>
                    <input type="checkbox" name="createPerm" value="${item.id}" checked />
                    ${item.title}
                </label>
            `).join('');
        }

        // ========== 渲染用户表格（管理） ==========
        function renderUserTable(users) {
            if (users.length === 0) {
                userTableBody.innerHTML = '<tr><td colspan="3">暂无用户</td></tr>';
                return;
            }
            userTableBody.innerHTML = users.map(u => {
                const menuLabels = u.menus.map(id => {
                    const item = allMenus.find(m => m.id === id);
                    return item ? `<span class="badge">${item.title}</span>` : `<span class="badge">${id}</span>`;
                }).join(' ');
                return `<tr>
                    <td><strong>${u.username}</strong></td>
                    <td>${menuLabels}</td>
                    <td class="action-btns">
                        <button class="btn btn-warning btn-sm" data-username="${u.username}" data-action="edit-perm">修改权限</button>
                        <button class="btn btn-warning btn-sm" data-username="${u.username}" data-action="edit-pwd">修改密码</button>
                        ${u.username !== currentUser && u.username !== 'guest' ? `<button class="btn btn-danger btn-sm" data-username="${u.username}" data-action="delete">删除</button>` : ''}
                    </td>
                </tr>`;
            }).join('');

            userTableBody.querySelectorAll('[data-action]').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const username = this.dataset.username;
                    const action = this.dataset.action;
                    if (action === 'edit-perm') openPermModal(username);
                    else if (action === 'edit-pwd') changeUserPassword(username);
                    else if (action === 'delete') deleteUser(username);
                });
            });
        }

        // ========== 修改密码（自己） ==========
        changePwdBtn.addEventListener('click', async function() {
            const old = oldPassword.value.trim();
            const newPwd = newPassword.value.trim();
            const confirm = confirmPassword.value.trim();
            if (!old || !newPwd || !confirm) {
                showMessage('请填写完整信息', 'error');
                return;
            }
            if (newPwd !== confirm) {
                showMessage('两次输入的新密码不一致', 'error');
                return;
            }
            try {
                const res = await fetch('/auth/change_password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ old_password: old, new_password: newPwd })
                });
                const data = await res.json();
                if (data.success) {
                    showMessage('密码修改成功', 'success');
                    oldPassword.value = '';
                    newPassword.value = '';
                    confirmPassword.value = '';
                } else {
                    showMessage(data.message || '修改失败', 'error');
                }
            } catch {
                showMessage('网络错误', 'error');
            }
        });

        // ========== 创建用户（创建或管理权限） ==========
        createUserBtn.addEventListener('click', async function() {
            const username = newUsername.value.trim();
            const password = newUserPassword.value.trim();
            if (!username || !password) {
                showMessage('请输入用户名和密码', 'error');
                return;
            }
            const checkboxes = document.querySelectorAll('input[name="createPerm"]:checked');
            const menus = Array.from(checkboxes).map(cb => cb.value);
            if (menus.length === 0) {
                showMessage('请至少选择一项权限', 'error');
                return;
            }
            try {
                const res = await fetch('/auth/create_user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ new_username: username, password, menus })
                });
                const data = await res.json();
                if (data.success) {
                    showMessage(data.message, 'success');
                    newUsername.value = '';
                    newUserPassword.value = '';
                    if (currentMenus.includes('管理')) {
                        loadUserList();
                    }
                } else {
                    showMessage(data.message || '创建失败', 'error');
                }
            } catch {
                showMessage('网络错误', 'error');
            }
        });

        // ========== 管理功能 ==========
        async function openPermModal(username) {
            const users = await fetchUsers();
            const user = users.find(u => u.username === username);
            if (!user) {
                showMessage('未找到该用户', 'error');
                return;
            }
            permModalUsername.textContent = username;
            const myMenus = currentMenus;
            const available = allMenus.filter(item => myMenus.includes(item.id));
            permModalCheckboxes.innerHTML = available.map(item => `
                <label>
                    <input type="checkbox" value="${item.id}" ${user.menus.includes(item.id) ? 'checked' : ''} />
                    ${item.title}
                </label>
            `).join('');
            permModal.style.display = 'flex';
            permSaveBtn.dataset.username = username;
        }

        permSaveBtn.addEventListener('click', async function() {
            const username = this.dataset.username;
            const checkboxes = document.querySelectorAll('#permModalCheckboxes input[type="checkbox"]:checked');
            const menus = Array.from(checkboxes).map(cb => cb.value);
            if (menus.length === 0) {
                showMessage('请至少选择一项权限', 'error');
                return;
            }
            try {
                const res = await fetch('/auth/update_user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, menus })
                });
                const data = await res.json();
                if (data.success) {
                    showMessage('权限修改成功', 'success');
                    permModal.style.display = 'none';
                    loadUserList();
                } else {
                    showMessage(data.message || '修改失败', 'error');
                }
            } catch {
                showMessage('网络错误', 'error');
            }
        });

        permCancelBtn.addEventListener('click', () => { permModal.style.display = 'none'; });
        permModal.addEventListener('click', function(e) { if (e.target === this) this.style.display = 'none'; });

        async function changeUserPassword(username) {
            const newPwd = prompt(`请输入用户 "${username}" 的新密码：`);
            if (newPwd === null) return;
            if (!newPwd.trim()) {
                showMessage('密码不能为空', 'error');
                return;
            }
            try {
                const res = await fetch('/auth/update_user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password: newPwd.trim() })
                });
                const data = await res.json();
                if (data.success) {
                    showMessage('密码修改成功', 'success');
                } else {
                    showMessage(data.message || '修改失败', 'error');
                }
            } catch {
                showMessage('网络错误', 'error');
            }
        }

        async function deleteUser(username) {
            if (!confirm(`确定删除用户 "${username}" 吗？此操作不可撤销！`)) return;
            try {
                const res = await fetch('/auth/delete_user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });
                const data = await res.json();
                if (data.success) {
                    showMessage(data.message, 'success');
                    loadUserList();
                } else {
                    showMessage(data.message || '删除失败', 'error');
                }
            } catch {
                showMessage('网络错误', 'error');
            }
        }

        async function loadUserList() {
            try {
                const users = await fetchUsers();
                if (Array.isArray(users)) {
                    renderUserTable(users);
                }
            } catch {
                showMessage('加载用户列表失败', 'error');
            }
        }

        // ========== 初始化 ==========
        async function init() {
            const userData = await fetchUser();
            if (!userData.logged_in) {
                document.querySelector('.container').innerHTML = '<h2>请先登录</h2>';
                return;
            }
            currentUser = userData.username;
            currentMenus = userData.menus || [];
            currentUsernameSpan.textContent = currentUser;

            allMenus = await fetchMenus();

            // 判断权限：拥有"创建"或"管理"均显示创建用户选项卡
            const hasCreate = currentMenus.includes('创建');
            const hasManage = currentMenus.includes('管理');

            if (hasCreate || hasManage) {
                createTabBtn.style.display = 'inline-block';
                // 如果拥有创建权限，则默认激活创建选项卡（可选），但保留当前激活状态
                renderCreatePermCheckboxes(currentMenus);
            }

            if (hasManage) {
                manageTabBtn.style.display = 'inline-block';
                await loadUserList();
                // 如果当前选项卡是"用户管理"，点击后自动加载
            }

            // 如果既没有创建也没有管理，只显示修改密码
            if (!hasCreate && !hasManage) {
                // 只保留修改密码选项卡
                document.querySelectorAll('.tab-btn').forEach(b => {
                    if (b.dataset.tab !== 'changePwd') b.style.display = 'none';
                });
            }
        }

        init();
    </script>
</body>
</html>
