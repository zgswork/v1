<!DOCTYPE html>
<html lang="zh-CN">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>弧形计算器 · 专业版</title>
        <style>
            :root {
                --theme-1: #0f172a;
                --theme-2: #1e293b;
                --theme-3: #38bdf8;
                --theme-4: #7dd3fc;
                --theme-5: rgba(2, 132, 199, 0.3);
                --theme-6: rgba(94, 234, 212, 0.2);
                --theme-7: rgba(56, 189, 248, 0.5);
                --theme-8: rgba(56, 189, 248, 0.3);
                --radius: 16px;
                --shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
                --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
                background: linear-gradient(145deg, var(--theme-1), var(--theme-2));
                color: var(--theme-4);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 20px;
                padding-top: 20px;
            }

            .box {
                width: 100%;
                max-width: 880px;
                background: rgba(15, 23, 42, 0.7);
                backdrop-filter: blur(12px);
                border-radius: var(--radius);
                box-shadow: var(--shadow);
                border: 1px solid var(--theme-6);
                padding: 24px 28px 28px;
            }

            .header-area {
                text-align: center;
                margin-bottom: 18px;
            }

            .header-area h2 {
                font-size: 2rem;
                font-weight: 700;
                color: var(--theme-3);
                text-shadow: 0 0 20px var(--theme-7);
                letter-spacing: 0.5px;
            }

            .header-area .sub {
                font-size: 0.85rem;
                color: #94a3b8;
                margin-top: 2px;
            }

            .main-layout {
                display: flex;
                gap: 28px;
                align-items: stretch;
            }

            .left-panel {
                flex: 0 0 50%;
                display: flex;
                justify-content: center;
                align-items: center;
                min-width: 0;
            }

            .left-panel canvas {
                width: 100%;
                max-width: 420px;
                height: auto;
                aspect-ratio: 1/1;
                border-radius: 12px;
                background: rgba(2, 6, 23, 0.5);
                border: 1px solid var(--theme-6);
                box-shadow: 0 4px 30px rgba(2, 132, 199, 0.15);
                display: block;
            }

            .right-panel {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 6px;
                min-width: 0;
            }

            .radio-row {
                display: flex;
                justify-content: center;
                gap: 28px;
                font-size: 15px;
                padding: 4px 0 6px;
                flex-wrap: wrap;
                align-items: center;
                min-height: 38px;
                transition: all 0.3s;
            }

            .radio-row.hidden {
                display: none;
            }

            .radio-row label {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                cursor: pointer;
                color: var(--theme-4);
                font-weight: 500;
                transition: color 0.2s;
            }

            .radio-row label:hover {
                color: #fff;
            }

            .radio-row input[type="radio"] {
                accent-color: var(--theme-3);
                width: 16px;
                height: 16px;
                cursor: pointer;
            }

            .radio-row .hint-text {
                font-size: 13px;
                color: #fbbf24;
                font-weight: 400;
                background: rgba(251, 191, 36, 0.12);
                padding: 2px 14px;
                border-radius: 20px;
                border: 1px solid rgba(251, 191, 36, 0.2);
            }

            .radio-row .hint-text.hidden {
                display: none;
            }

            .row {
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .row label {
                width: 90px;
                flex-shrink: 0;
                font-weight: 600;
                color: #f0f9ff;
                font-size: 15px;
                letter-spacing: 0.3px;
            }

            .row input[type="number"] {
                flex: 1;
                padding: 9px 12px;
                background: rgba(2, 6, 23, 0.6);
                border: 1px solid var(--theme-6);
                border-radius: 10px;
                color: #f0f9ff;
                font-size: 15px;
                transition: all var(--transition);
                min-width: 0;
                width: 0;
                outline: none;
            }

            .row input[type="number"]:focus {
                border-color: var(--theme-3);
                box-shadow: 0 0 0 3px var(--theme-8);
                background: rgba(2, 6, 23, 0.8);
            }

            .row input[type="number"]::placeholder {
                color: #475569;
                font-size: 14px;
            }

            .row input[type="number"]::-webkit-inner-spin-button,
            .row input[type="number"]::-webkit-outer-spin-button {
                -webkit-appearance: none;
                margin: 0;
            }

            .row input[type="number"] {
                -moz-appearance: textfield;
                appearance: textfield;
            }

            .hint-box {
                background: rgba(56, 189, 248, 0.06);
                border-left: 3px solid var(--theme-3);
                border-radius: 6px;
                padding: 8px 14px;
                margin: 4px 0 2px;
            }

            .hint-box p {
                font-size: 13px;
                color: #94a3b8;
                line-height: 1.5;
                margin: 0;
            }

            .hint-box p strong {
                color: var(--theme-4);
            }

            .fixed-chord-result {
                background: rgba(34, 197, 94, 0.08);
                border-left: 3px solid #22c55e;
                border-radius: 6px;
                padding: 8px 14px;
                margin: 2px 0;
                display: none;
            }

            .fixed-chord-result p {
                font-size: 13px;
                color: #86efac;
                line-height: 1.6;
                margin: 0;
            }

            .fixed-chord-result p strong {
                color: #4ade80;
            }

            .btn-row {
                display: flex;
                gap: 12px;
                margin-top: 8px;
            }

            .btn-row button {
                flex: 1;
                padding: 11px 14px;
                background: linear-gradient(135deg, var(--theme-3), #06b6d4);
                border: none;
                border-radius: 10px;
                color: #fff;
                font-size: 16px;
                font-weight: 700;
                cursor: pointer;
                transition: all var(--transition);
                box-shadow: 0 4px 20px rgba(8, 145, 178, 0.35);
                letter-spacing: 0.5px;
            }

            .btn-row button:hover {
                transform: translateY(-2px) scale(1.01);
                box-shadow: 0 8px 30px rgba(8, 145, 178, 0.5);
            }

            .btn-row button:active {
                transform: scale(0.97);
            }

            .btn-row button.btn-secondary {
                background: rgba(255, 255, 255, 0.08);
                backdrop-filter: blur(4px);
                box-shadow: none;
                border: 1px solid var(--theme-6);
            }

            .btn-row button.btn-secondary:hover {
                background: rgba(255, 255, 255, 0.15);
                transform: translateY(-2px);
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            }

            .error {
                color: #f87171;
                font-size: 15px;
                margin-top: 6px;
                text-align: center;
                min-height: 1.6em;
                font-weight: 500;
                background: rgba(248, 113, 113, 0.08);
                border-radius: 6px;
                padding: 4px 8px;
                transition: all 0.3s;
            }

            .error:empty {
                display: none;
            }

            @media (max-width: 720px) {
                .main-layout {
                    flex-wrap: wrap;
                    gap: 18px;
                }

                .left-panel {
                    flex: 1 1 100%;
                    max-width: 100%;
                }

                .left-panel canvas {
                    max-width: 100%;
                }

                .right-panel {
                    flex: 1 1 100%;
                }

                .box {
                    padding: 16px;
                }

                .row label {
                    width: 66px;
                    font-size: 14px;
                }

                .row input[type="number"] {
                    font-size: 15px;
                    padding: 7px 10px;
                }

                .header-area h2 {
                    font-size: 1.5rem;
                }

                .radio-row {
                    gap: 12px;
                    font-size: 14px;
                }
            }

            @media (max-width: 440px) {
                body {
                    padding: 10px;
                    padding-top: 10px;
                }

                .box {
                    padding: 12px;
                }

                .row label {
                    width: 56px;
                    font-size: 13px;
                }

                .row input[type="number"] {
                    font-size: 14px;
                    padding: 6px 8px;
                }

                .btn-row button {
                    font-size: 14px;
                    padding: 8px 10px;
                }

                .header-area h2 {
                    font-size: 1.25rem;
                }

                .hint-box p {
                    font-size: 12px;
                }
            }

            ::-webkit-scrollbar {
                width: 4px;
            }

            ::-webkit-scrollbar-track {
                background: transparent;
            }

            ::-webkit-scrollbar-thumb {
                background: var(--theme-3);
                border-radius: 4px;
            }
        </style>
    </head>

    <body>
        <div class="box">
            <div class="header-area">
                <h2>📐 弧形计算器 <span style="font-size: .5em; font-weight: bold;">V1.12.2</span> </h2>
                <div class="sub">已知任意 2 个量 · 自动求解全参数 · 支持优/劣弧双解</div>
            </div>
            <div class="main-layout">
                <div class="left-panel">
                    <canvas id="cv" width="420" height="420"></canvas>
                </div>
                <div class="right-panel">
                    <!-- 劣弧 / 优弧 单选（默认隐藏） -->
                    <div class="radio-row hidden" id="arcRadioRow">
                        <label><input type="radio" name="arc" value="minor" checked /> 劣弧 (θ ≤ 180°)</label>
                        <label><input type="radio" name="arc" value="major" /> 优弧 (θ &gt; 180°)</label>
                        <span class="hint-text" id="arcHint">✨ 该参数组合存在双解，请选择</span>
                    </div>
                    <div class="row"><label>弧长 s</label><input id="s" type="number" step="any" min="0"
                            placeholder="mm" /></div>
                    <div class="row"><label>半径 r</label><input id="r" type="number" step="any" min="0"
                            placeholder="mm" /></div>
                    <div class="row"><label>弦长 c</label><input id="c" type="number" step="any" min="0"
                            placeholder="mm" /></div>
                    <div class="row"><label>拱高 h</label><input id="h" type="number" step="any" min="0"
                            placeholder="mm" /></div>
                    <div class="row"><label>圆心角 θ</label><input id="theta" type="number" step="any" min="0"
                            placeholder="度" /></div>
                    <div class="hint-box">
                        <p>💡 任意填写 <strong>2 个</strong> 非空值 · 双解时自动提示切换 · 所有值 ≥ 0</p>
                    </div>
                    <div class="row"><label>定弦长 L</label><input id="L" type="number" step="any" min="0"
                            placeholder="mm（可选）" /></div>
                    <div class="fixed-chord-result" id="fixedChordResult"></div>
                    <div class="btn-row">
                        <button id="calcBtn">⚡ 计算</button>
                        <button class="btn-secondary" onclick="resetAll()">✕ 清空</button>
                    </div>
                    <div id="err" class="error"></div>
                </div>
            </div>
        </div>
        <script>
            // ================================================================
            //  常量 & DOM 引用
            // ================================================================
            const DEG = Math.PI / 180;
            const IDS = ['s', 'r', 'c', 'h', 'theta'];
            const PI2 = 2 * Math.PI;
            const $ = id => document.getElementById(id);
            const sEl = $('s'),
                rEl = $('r'),
                cEl = $('c'),
                hEl = $('h'),
                thetaEl = $('theta');
            const LEl = $('L');
            const errEl = $('err');
            const cv = $('cv');
            const ctx = cv.getContext('2d');
            const arcRow = $('arcRadioRow');
            const arcHint = $('arcHint');
            const fixedResult = $('fixedChordResult');
            let lastSolutions = [];
            let currentSolution = null;
            // ================================================================
            //  工具：读取输入
            // ================================================================
            function readInputs() {
                const val = {};
                let count = 0;
                for (const id of IDS) {
                    const el = $(id);
                    const v = parseFloat(el.value);
                    if (!isNaN(v)) {
                        if (v < 0) throw new Error('填写已知量必须大于 0 ');
                        val[id] = v;
                        count++;
                    }
                }
                if (count < 2) throw new Error('请至少填写 2 个已知量');
                if (val.theta !== undefined) {
                    val.thetaRad = val.theta * DEG;
                    if (val.thetaRad > PI2) throw new Error('圆心角不能超过 360°');
                }
                return val;
            }
            // ================================================================
            //  几何算法
            // ================================================================
            function makeResult(s, r, c, h, thetaDeg) {
                return { s, r, c, h, theta: thetaDeg };
            }
            function fromThetaR(thetaRad, r) {
                const s = r * thetaRad;
                const c = 2 * r * Math.sin(thetaRad / 2);
                const h = r * (1 - Math.cos(thetaRad / 2));
                return makeResult(s, r, c, h, thetaRad / DEG);
            }
            // --- 各组合求解器，均返回数组 ---
            function solveSR(s, r) {
                if (s > PI2 * r + 1e-9) throw new Error('弧长不能超过周长');
                const theta = s / r;
                if (theta <= 0 || theta > PI2) throw new Error('圆心角必须在 (0, 360°]');
                return [fromThetaR(theta, r)];
            }
            function solveSTheta(s, thetaRad) {
                if (thetaRad <= 0 || thetaRad > PI2) throw new Error('圆心角必须在 (0, 360°]');
                const r = s / thetaRad;
                return [fromThetaR(thetaRad, r)];
            }
            function solveSC(s, c) {
                if (c >= s) throw new Error('弦长必须小于弧长');
                const k = c / s;
                const f = (x) => Math.sin(x) - k * x;
                const df = (x) => Math.cos(x) - k;
                const solutions = [];
                const candidates = [0.8, 2.5];
                for (const x0 of candidates) {
                    const sol = newton(f, df, x0, 80, 1e-14);
                    if (sol !== null && sol > 0 && sol < Math.PI) {
                        const theta = 2 * sol;
                        const r = s / theta;
                        const cCalc = 2 * r * Math.sin(sol);
                        if (Math.abs(cCalc - c) < 1e-6) {
                            let dup = false;
                            for (const existing of solutions) {
                                if (Math.abs(existing - theta) < 1e-8) { dup = true; break; }
                            }
                            if (!dup) solutions.push(theta);
                        }
                    }
                }
                solutions.sort((a, b) => a - b);
                return solutions.map(theta => fromThetaR(theta, s / theta));
            }
            function solveSH(s, h) {
                const k = 2 * h / s;
                const f = (x) => 1 - Math.cos(x) - k * x;
                const df = (x) => Math.sin(x) - k;
                const solutions = [];
                const candidates = [0.8, 2.5];
                for (const x0 of candidates) {
                    const sol = newton(f, df, x0, 80, 1e-14);
                    if (sol !== null && sol > 0 && sol < Math.PI) {
                        const theta = 2 * sol;
                        const r = s / theta;
                        const hCalc = r * (1 - Math.cos(sol));
                        if (Math.abs(hCalc - h) < 1e-6) {
                            let dup = false;
                            for (const existing of solutions) {
                                if (Math.abs(existing - theta) < 1e-8) { dup = true; break; }
                            }
                            if (!dup) solutions.push(theta);
                        }
                    }
                }
                solutions.sort((a, b) => a - b);
                return solutions.map(theta => fromThetaR(theta, s / theta));
            }
            function solveRTheta(r, thetaRad) {
                if (thetaRad <= 0 || thetaRad > PI2) throw new Error('圆心角必须在 (0, 360°]');
                return [fromThetaR(thetaRad, r)];
            }
            function solveRC(r, c) {
                if (c > 2 * r + 1e-9) throw new Error('弦长不能大于直径');
                const thetaMinor = 2 * Math.asin(Math.min(c / (2 * r), 1));
                const resMinor = fromThetaR(thetaMinor, r);
                const thetaMajor = PI2 - thetaMinor;
                const resMajor = fromThetaR(thetaMajor, r);
                return [resMinor, resMajor];
            }
            function solveRH(r, h) {
                if (h >= 2 * r) throw new Error('拱高必须在 [0, 2r) 内');
                const ratio = 1 - h / r; // 范围 [-1, 1)
                const theta = 2 * Math.acos(Math.max(-1, Math.min(1, ratio)));
                return [fromThetaR(theta, r)];
            }
            function solveCH(c, h) {
                const r = (c * c / 4 + h * h) / (2 * h);
                if (c > 2 * r + 1e-9) throw new Error('弦长不能大于直径');
                const thetaMinor = 2 * Math.asin(Math.min(c / (2 * r), 1));
                const resMinor = fromThetaR(thetaMinor, r);
                const thetaMajor = PI2 - thetaMinor;
                const resMajor = fromThetaR(thetaMajor, r);
                return [resMinor, resMajor];
            }
            function solveCTheta(c, thetaRad) {
                if (thetaRad <= 0 || thetaRad > PI2) throw new Error('圆心角必须在 (0, 360°]');
                const r = c / (2 * Math.sin(thetaRad / 2));
                if (c > 2 * r + 1e-9) throw new Error('弦长不能大于直径');
                return [fromThetaR(thetaRad, r)];
            }
            function solveHTheta(h, thetaRad) {
                if (thetaRad <= 0 || thetaRad > PI2) throw new Error('圆心角必须在 (0, 360°]');
                const denom = 1 - Math.cos(thetaRad / 2);
                if (Math.abs(denom) < 1e-15) throw new Error('圆心角不能为 0');
                const r = h / denom;
                if (h < 0 || h >= 2 * r) throw new Error('拱高必须在 [0, 2r) 内');
                return [fromThetaR(thetaRad, r)];
            }
            // ================================================================
            //  数值工具（牛顿迭代）
            // ================================================================
            function newton(f, df, x0, maxIter = 80, tol = 1e-14) {
                let x = x0;
                for (let i = 0; i < maxIter; i++) {
                    const fx = f(x);
                    if (Math.abs(fx) < tol) return x;
                    const dx = df(x);
                    if (Math.abs(dx) < 1e-15) break;
                    x = x - fx / dx;
                    if (x < 0 || x > Math.PI) break;
                }
                return null;
            }
            // ================================================================
            //  主求解器
            // ================================================================
            function solve() {
                const v = readInputs();
                const has = (k) => k in v;
                let solutions = [];
                if (has('s') && has('r')) {
                    solutions = solveSR(v.s, v.r);
                } else if (has('s') && has('thetaRad')) {
                    solutions = solveSTheta(v.s, v.thetaRad);
                } else if (has('s') && has('c')) {
                    solutions = solveSC(v.s, v.c);
                } else if (has('s') && has('h')) {
                    solutions = solveSH(v.s, v.h);
                } else if (has('r') && has('thetaRad')) {
                    solutions = solveRTheta(v.r, v.thetaRad);
                } else if (has('r') && has('c')) {
                    solutions = solveRC(v.r, v.c);
                } else if (has('r') && has('h')) {
                    solutions = solveRH(v.r, v.h);
                } else if (has('c') && has('h')) {
                    solutions = solveCH(v.c, v.h);
                } else if (has('c') && has('thetaRad')) {
                    solutions = solveCTheta(v.c, v.thetaRad);
                } else if (has('h') && has('thetaRad')) {
                    solutions = solveHTheta(v.h, v.thetaRad);
                } else {
                    throw new Error('不支持的参数组合');
                }
                // 过滤无效解
                solutions = solutions.filter(sol => {
                    if (!sol || !isFinite(sol.s) || !isFinite(sol.r)) return false;
                    if (sol.s < 0 || sol.r < 0 || sol.c < 0 || sol.h < 0) return false;
                    if (sol.s > PI2 * sol.r + 1e-6) return false;
                    if (sol.c > 2 * sol.r + 1e-6) return false;
                    if (sol.h > sol.r + 1e-6 && sol.theta < 180) return false;
                    if (sol.theta > 360 + 1e-6) return false;
                    return true;
                });
                const unique = [];
                for (const sol of solutions) {
                    let dup = false;
                    for (const existing of unique) {
                        if (Math.abs(existing.theta - sol.theta) < 1e-6 &&
                            Math.abs(existing.r - sol.r) < 1e-6) {
                            dup = true;
                            break;
                        }
                    }
                    if (!dup) unique.push(sol);
                }
                if (unique.length === 0) throw new Error('无有效解，请检查参数');
                return unique;
            }
            // ================================================================
            //  定弦长计算
            // ================================================================
            function calcFixedChord(out) {
                const L = parseFloat(LEl.value);
                fixedResult.style.display = 'none';
                fixedResult.innerHTML = '';
                if (isNaN(L) || L <= 0) return;
                const r = out.r;
                const thetaRad = out.theta * DEG;
                const deltaRad = 2 * Math.asin(Math.min(L / (2 * r), 1));
                const deltaDeg = deltaRad / DEG;
                const n = Math.floor(thetaRad / deltaRad);
                if (n < 1) {
                    fixedResult.innerHTML = `<p>⚠ 定弦长 L = ${L.toFixed(4)} 大于该弧的弦长，无法容纳</p>`;
                    fixedResult.style.display = 'block';
                    return;
                }
                const segArc = r * deltaRad;
                const remainRad = thetaRad - n * deltaRad;
                const remainArc = r * remainRad;
                let html = `<p><strong>定弦长段数：</strong>${n} 段</p>`;
                html += `<p><strong>每段定弦长：</strong>L = ${L.toFixed(4)} mm</p>`;
                html += `<p><strong>相邻定弦长夹角：</strong>δ = ${deltaDeg.toFixed(4)}°</p>`;
                html += `<p><strong>每段对应弧长：</strong>${segArc.toFixed(4)} mm</p>`;
                if (remainRad > 1e-9) {
                    html += `<p><strong>剩余弧长：</strong>${remainArc.toFixed(4)} mm（夹角 ${(remainRad / DEG).toFixed(4)}°）</p>`;
                } else {
                    html += `<p><strong>恰好整除，无剩余弧长</strong></p>`;
                }
                fixedResult.innerHTML = html;
                fixedResult.style.display = 'block';
            }
            // ================================================================
            //  绘图
            // ================================================================
            function draw(res) {
                const W = cv.width,
                    H = cv.height;
                const cx = W / 2,
                    cy = H / 2;
                const margin = 50;
                const maxDim = Math.min(W, H) - margin;
                const scale = maxDim / (2 * (res.r || 1) + 0.01);
                const rPix = (res.r || 1) * scale;
                ctx.clearRect(0, 0, W, H);
                const toX = (mm) => cx + mm * scale;
                const toY = (mm) => cy - mm * scale;
                // 网格
                ctx.save();
                ctx.strokeStyle = 'rgba(255,255,255,0.04)';
                ctx.lineWidth = 0.5;
                for (let i = -10; i <= 10; i++) {
                    if (i === 0) continue;
                    const p = i * (res.r / 4);
                    ctx.beginPath();
                    ctx.moveTo(toX(p), 0);
                    ctx.lineTo(toX(p), H);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, toY(p));
                    ctx.lineTo(W, toY(p));
                    ctx.stroke();
                }
                ctx.restore();
                // 整圆
                ctx.save();
                ctx.beginPath();
                ctx.arc(cx, cy, rPix, 0, PI2);
                ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([4, 6]);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.restore();
                // 扇形
                const thetaRad = (res.theta || 0) * DEG;
                const startAngle = -thetaRad / 2;
                const endAngle = thetaRad / 2;
                const fillColor = getComputedStyle(document.documentElement).getPropertyValue('--theme-3').trim() || '#38bdf8';
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, rPix, startAngle, endAngle, false);
                ctx.closePath();
                ctx.fillStyle = fillColor + '25';
                ctx.fill();
                ctx.strokeStyle = fillColor + '80';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.restore();
                // 弧线
                ctx.save();
                ctx.beginPath();
                ctx.arc(cx, cy, rPix, startAngle, endAngle, false);
                ctx.strokeStyle = fillColor;
                ctx.lineWidth = 3.5;
                ctx.shadowColor = fillColor + '60';
                ctx.shadowBlur = 12;
                ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.restore();
                // 半径线
                const x1 = res.r * Math.cos(startAngle),
                    y1 = res.r * Math.sin(startAngle);
                const x2 = res.r * Math.cos(endAngle),
                    y2 = res.r * Math.sin(endAngle);
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(toX(x1), toY(y1));
                ctx.moveTo(cx, cy);
                ctx.lineTo(toX(x2), toY(y2));
                ctx.strokeStyle = '#fbbf24';
                ctx.lineWidth = 2;
                ctx.setLineDash([3, 4]);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.restore();
                // 弦
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(toX(x1), toY(y1));
                ctx.lineTo(toX(x2), toY(y2));
                ctx.strokeStyle = '#f472b6';
                ctx.lineWidth = 2.5;
                ctx.shadowColor = '#f472b640';
                ctx.shadowBlur = 8;
                ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.restore();
                // 拱高标注
                const midX = (x1 + x2) / 2,
                    midY = (y1 + y2) / 2;
                const hEndX = 0,
                    hEndY = res.r * Math.cos(thetaRad / 2);
                ctx.save();
                ctx.setLineDash([3, 4]);
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(toX(midX), toY(midY));
                ctx.lineTo(toX(hEndX), toY(hEndY));
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.restore();
                // 定弦长分段
                const L = parseFloat(LEl.value);
                if (!isNaN(L) && L > 0) {
                    const deltaRad = 2 * Math.asin(Math.min(L / (2 * res.r), 1));
                    const n = Math.floor(thetaRad / deltaRad);
                    if (n >= 1) {
                        const angles = [startAngle];
                        for (let i = 1; i <= n; i++) {
                            const angle = startAngle + i * deltaRad;
                            if (angle > endAngle + 1e-9) break;
                            angles.push(angle);
                        }
                        ctx.save();
                        ctx.strokeStyle = '#4ade80';
                        ctx.lineWidth = 2;
                        ctx.setLineDash([6, 4]);
                        ctx.shadowColor = '#4ade8060';
                        ctx.shadowBlur = 6;
                        for (let i = 0; i < angles.length - 1; i++) {
                            const px1 = res.r * Math.cos(angles[i]);
                            const py1 = res.r * Math.sin(angles[i]);
                            const px2 = res.r * Math.cos(angles[i + 1]);
                            const py2 = res.r * Math.sin(angles[i + 1]);
                            ctx.beginPath();
                            ctx.moveTo(toX(px1), toY(py1));
                            ctx.lineTo(toX(px2), toY(py2));
                            ctx.stroke();
                        }
                        if (angles[angles.length - 1] < endAngle - 1e-9) {
                            const px1 = res.r * Math.cos(angles[angles.length - 1]);
                            const py1 = res.r * Math.sin(angles[angles.length - 1]);
                            const px2 = res.r * Math.cos(endAngle);
                            const py2 = res.r * Math.sin(endAngle);
                            ctx.beginPath();
                            ctx.moveTo(toX(px1), toY(py1));
                            ctx.lineTo(toX(px2), toY(py2));
                            ctx.stroke();
                        }
                        ctx.setLineDash([]);
                        ctx.shadowBlur = 0;
                        ctx.restore();
                        for (const angle of angles) {
                            const px = res.r * Math.cos(angle);
                            const py = res.r * Math.sin(angle);
                            ctx.save();
                            ctx.beginPath();
                            ctx.arc(toX(px), toY(py), 4, 0, PI2);
                            ctx.fillStyle = '#4ade80';
                            ctx.shadowColor = '#4ade8080';
                            ctx.shadowBlur = 8;
                            ctx.fill();
                            ctx.shadowBlur = 0;
                            ctx.restore();
                        }
                    }
                }
                // 端点
                const dotColor = getComputedStyle(document.documentElement).getPropertyValue('--theme-4').trim() || '#7dd3fc';
                for (const [px, py] of [
                    [x1, y1],
                    [x2, y2]
                ]) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(toX(px), toY(py), 5, 0, PI2);
                    ctx.fillStyle = dotColor;
                    ctx.shadowColor = dotColor + '80';
                    ctx.shadowBlur = 10;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.restore();
                }
                // 圆心
                ctx.save();
                ctx.beginPath();
                ctx.arc(cx, cy, 4, 0, PI2);
                ctx.fillStyle = '#fbbf24';
                ctx.shadowColor = '#fbbf2480';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.restore();
                // 文字信息
                const txtColor = getComputedStyle(document.documentElement).getPropertyValue('--theme-4').trim() || '#7dd3fc';
                ctx.save();
                ctx.fillStyle = txtColor;
                ctx.font = '13px "Segoe UI", system-ui, sans-serif';
                ctx.shadowColor = 'rgba(0,0,0,0.6)';
                ctx.shadowBlur = 6;
                const lines = [
                    `r = ${(res.r || 0).toFixed(2)}`,
                    `θ = ${(res.theta || 0).toFixed(2)}°`,
                    `s = ${(res.s || 0).toFixed(2)}`,
                    `c = ${(res.c || 0).toFixed(2)}`,
                    `h = ${(res.h || 0).toFixed(2)}`
                ];
                lines.forEach((text, i) => {
                    ctx.fillText(text, 14, 24 + i * 20);
                });
                ctx.shadowBlur = 0;
                ctx.restore();
                // 图例
                ctx.save();
                const legendY = H - 28;
                ctx.font = '12px "Segoe UI", system-ui, sans-serif';
                ctx.fillStyle = fillColor;
                ctx.fillText('● 弧', 12, legendY);
                ctx.fillStyle = '#fbbf24';
                ctx.fillText('━ 半径', 72, legendY);
                ctx.fillStyle = '#f472b6';
                ctx.fillText('━ 弦', 142, legendY);
                const LVal = parseFloat(LEl.value);
                if (!isNaN(LVal) && LVal > 0) {
                    ctx.fillStyle = '#4ade80';
                    ctx.fillText('● 定弦长分段', 212, legendY);
                }
                ctx.restore();
            }
            // ================================================================
            //  UI 控制
            // ================================================================
            function updateUI(solutions) {
                arcRow.classList.add('hidden');
                arcHint.classList.add('hidden');
                if (!solutions || solutions.length === 0) {
                    currentSolution = null;
                    return;
                }
                if (solutions.length === 1) {
                    currentSolution = solutions[0];
                    document.querySelector('input[name="arc"][value="minor"]').checked = true;
                    return;
                }
                // 多解
                arcRow.classList.remove('hidden');
                arcHint.classList.remove('hidden');
                solutions.sort((a, b) => a.theta - b.theta);
                const minorRadio = document.querySelector('input[name="arc"][value="minor"]');
                const majorRadio = document.querySelector('input[name="arc"][value="major"]');
                const currentArc = document.querySelector('input[name="arc"]:checked');
                if (!currentArc || currentArc.value === 'major') {
                    minorRadio.checked = true;
                    currentSolution = solutions[0];
                } else {
                    currentSolution = solutions[0];
                }
                const t1 = solutions[0] ? solutions[0].theta.toFixed(2) : '?';
                const t2 = solutions[1] ? solutions[1].theta.toFixed(2) : '?';
                arcHint.textContent = `✨ 双解：劣弧 ${t1}°  /  优弧 ${t2}°，请选择`;
            }
            function applyCurrentSolution() {
                if (!currentSolution) return;
                IDS.forEach(id => {
                    const el = $(id);
                    if (currentSolution[id] !== undefined) {
                        el.value = Math.max(0, currentSolution[id]).toFixed(4);
                    }
                });
                draw(currentSolution);
                calcFixedChord(currentSolution);
            }
            // ================================================================
            //  计算入口（错误显示增强）
            // ================================================================
            function calc() {
                errEl.textContent = '';    // 清空旧错误
                let solutions;
                try {
                    solutions = solve();
                } catch (e) {
                    // 显示错误信息，并清空界面状态
                    errEl.textContent = '⚠ ' + e.message;
                    // 同时把错误输出到控制台以便调试
                    console.error('弧形计算器错误:', e);
                    // 清空画布和输入（但保留错误信息）
                    resetAll(true); // 传入 true 表示静默清空（不清除错误信息）
                    return;
                }
                lastSolutions = solutions;
                updateUI(solutions);
                applyCurrentSolution();
            }
            // 单选切换
            document.querySelectorAll('input[name="arc"]').forEach(el => {
                el.addEventListener('change', function () {
                    if (!lastSolutions || lastSolutions.length < 2) return;
                    const idx = this.value === 'minor' ? 0 : 1;
                    if (idx < lastSolutions.length) {
                        currentSolution = lastSolutions[idx];
                        applyCurrentSolution();
                    }
                });
            });
            // 回车触发
            document.querySelectorAll('.row input').forEach(el => {
                el.addEventListener('keydown', (e) => { if (e.key === 'Enter') calc(); });
            });
            // 计算按钮
            $('calcBtn').addEventListener('click', calc);
            // ================================================================
            //  重置（支持静默模式）
            // ================================================================
            function resetAll(silent = false) {
                IDS.forEach(id => $(id).value = '');
                LEl.value = '';
                if (!silent) {
                    errEl.textContent = '';
                }
                fixedResult.style.display = 'none';
                fixedResult.innerHTML = '';
                arcRow.classList.add('hidden');
                arcHint.classList.add('hidden');
                document.querySelector('input[name="arc"][value="minor"]').checked = true;
                lastSolutions = [];
                currentSolution = null;
                ctx.clearRect(0, 0, 420, 420);
                ctx.save();
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.font = '16px "Segoe UI", system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('请填写参数后点击计算', 210, 210);
                ctx.restore();
            }
            // ================================================================
            //  初始化
            // ================================================================
            resetAll();
            window.calc = calc;
            window.resetAll = resetAll;
        </script>
    </body>

</html>
