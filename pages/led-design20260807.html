<!DOCTYPE html>
<html lang="zh-CN">

    <head>
        <script src="../static/js/runtime.js?v=20260827r"></script>
        <meta charset="utf-8">
        <title>LED显示屏 模组 安装结构设计 — 3D多标签版</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            /* ===== 全局重置 & 布局 ===== */
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
                background: #1a1a2e;
                color: #eee;
                overflow: hidden;
                height: 100vh;
            }

            #app {
                display: flex;
                height: 100vh;
                width: 100vw;
            }

            /* ===== 左侧面板（可折叠） ===== */
            #panel {
                position: relative;
                width: 480px;
                min-width: 0;
                background: #16213e;
                border-right: 1px solid #0f3460;
                display: flex;
                flex-direction: column;
                z-index: 100;
                transition: width .3s cubic-bezier(.4, 0, .2, 1), min-width .3s cubic-bezier(.4, 0, .2, 1);
                overflow: hidden;
                flex-shrink: 0;
            }

            #panel.collapsed-h {
                width: 0 !important;
                min-width: 0 !important;
                border-right: none;
            }

            #panel-body {
                flex: 1;
                overflow-y: auto;
                overflow-x: hidden;
                padding: 10px 12px 16px;
                transition: opacity .25s;
            }

            #panel.collapsed-v #panel-body {
                display: none;
            }

            #panel-body::-webkit-scrollbar {
                width: 4px;
            }

            #panel-body::-webkit-scrollbar-thumb {
                background: #0f3460;
                border-radius: 3px;
            }

            /* 面板头部 */
            #panel-header {
                height: 36px;
                min-height: 36px;
                background: linear-gradient(135deg, #0f3460, #16213e);
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 8px;
                cursor: pointer;
                user-select: none;
                border-bottom: 1px solid #0f3460;
                flex-shrink: 0;
            }

            #panel-header .title {
                font-size: 13px;
                font-weight: bold;
                color: #e94560;
                display: flex;
                align-items: center;
                gap: 6px;
            }

            #panel-header .title .dot {
                width: 7px;
                height: 7px;
                background: #e94560;
                border-radius: 50%;
                animation: pulse 2s infinite;
            }

            @keyframes pulse {

                0%,
                100% {
                    opacity: 1;
                }

                50% {
                    opacity: .4;
                }
            }

            .panel-btns {
                display: flex;
                gap: 3px;
            }

            .panel-btns button {
                width: 26px;
                height: 24px;
                border: none;
                border-radius: 4px;
                background: #1a1a3e;
                color: #aaa;
                cursor: pointer;
                font-size: 13px;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all .2s;
            }

            .panel-btns button:hover {
                background: #e94560;
                color: #fff;
            }

            .panel-btns button.active {
                background: #e94560;
                color: #fff;
            }

            /* 悬浮按钮 */
            #floating-btn {
                position: fixed;
                top: 50%;
                left: 0;
                transform: translateY(-50%);
                z-index: 200;
                display: none;
                flex-direction: column;
                gap: 3px;
            }

            #floating-btn.show {
                display: flex;
            }

            #floating-btn button {
                width: 26px;
                height: 46px;
                border: 1px solid #0f3460;
                border-left: none;
                border-radius: 0 6px 6px 0;
                background: #16213e;
                color: #e94560;
                cursor: pointer;
                font-size: 14px;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 2px 0 8px rgba(0, 0, 0, .3);
                transition: all .2s;
            }

            #floating-btn button:hover {
                background: #e94560;
                color: #fff;
            }

            #floating-btn .fb-updown {
                width: 26px;
                height: 30px;
                font-size: 12px;
            }

            /* ===== Tab 栏 ===== */
            .tab-bar {
                display: flex;
                gap: 2px;
                margin-bottom: 10px;
                border-bottom: 1px solid #0f3460;
                padding-bottom: 0;
            }

            .tab-btn {
                padding: 5px 10px;
                border: none;
                border-bottom: 2px solid transparent;
                background: none;
                color: #888;
                font-size: 12px;
                cursor: pointer;
                transition: all .2s;
                white-space: nowrap;
            }

            .tab-btn:hover {
                color: #ccc;
            }

            .tab-btn.active {
                color: #e94560;
                border-bottom-color: #e94560;
                font-weight: bold;
            }

            .tab-panel {
                display: none;
            }

            .tab-panel.active {
                display: block;
            }

            /* ===== 表单样式 ===== */
            .section {
                margin-bottom: 8px;
                padding: 6px 8px;
                background: #1a1a3e;
                border-radius: 6px;
                border: 1px solid #0f3460;
            }

            .section h3 {
                font-size: 11px;
                color: #4fc3f7;
                margin-bottom: 4px;
                display: flex;
                align-items: center;
                gap: 4px;
            }

            .section h3 .badge {
                background: #e94560;
                color: #fff;
                font-size: 9px;
                padding: 0 5px;
                border-radius: 8px;
            }

            .subtitle {
                font-size: 9px;
                color: #777;
                margin-bottom: 6px;
            }

            .row {
                display: flex;
                align-items: center;
                width: 100%;
                gap: 4px;
                margin-bottom: 4px;
                padding: 0 2px;
            }

            .row label {
                flex: 0 0 52px;
                text-align: left;
                font-weight: 400;
                color: #7dd3fc;
                white-space: nowrap;
                font-size: 11px;
            }

            .row input,
            .row select {
                flex: 1;
                min-width: 30px;
                height: 30px;
                padding: 4px 6px;
                background: rgba(2, 6, 23, .6);
                border: 1px solid rgba(94, 234, 212, .3);
                border-radius: 4px;
                color: #f0f9ff;
                font-size: 12px;
                transition: all .3s ease;
            }

            .row input:focus,
            .row select:focus {
                outline: none;
                border-color: #38bdf8;
                box-shadow: 0 0 0 3px rgba(56, 189, 248, .3);
            }

            .row input.readonly,
            .row select.readonly {
                background: #2a2a3a !important;
                color: #888 !important;
                cursor: not-allowed;
            }

            .row2 {
                display: flex;
                gap: 4px;
            }

            .row2>* {
                flex: 1;
            }

            .row3 {
                display: flex;
                gap: 4px;
            }

            .row3>* {
                flex: 1;
            }

            .checkbox-row {
                display: flex;
                flex-wrap: wrap;
                gap: 4px 10px;
                align-items: center;
                padding: 2px 0;
            }

            .checkbox-row .steel-label {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                cursor: pointer;
                user-select: none;
                white-space: nowrap;
                font-size: 11px;
                color: #cbd5e1;
            }

            .checkbox-row .steel-label input[type="checkbox"] {
                width: 14px;
                height: 14px;
                accent-color: #06b6d4;
                cursor: pointer;
            }

            .btn-row {
                display: flex;
                width: 100%;
                margin-top: 8px;
                flex-wrap: nowrap;
                gap: 6px;
            }

            .btn-row button {
                flex: 1;
                min-width: 0;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                padding: 6px 10px;
                background: linear-gradient(45deg, #0ea5e9, #06b6d4);
                border: none;
                border-radius: 6px;
                color: #fff;
                font-size: 12px;
                font-weight: 600;
                cursor: pointer;
                transition: all .3s ease;
                box-shadow: 0 4px 15px rgba(8, 145, 178, .4);
            }

            .btn-row button:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(8, 145, 178, .6);
            }

            .btn-row button:last-child {
                background: linear-gradient(45deg, #555, #333);
            }

            .btn {
                display: block;
                width: 100%;
                padding: 5px;
                margin-top: 4px;
                border: none;
                border-radius: 6px;
                color: #fff;
                font-size: 12px;
                font-weight: bold;
                cursor: pointer;
                transition: all .2s;
            }

            .btn-red {
                background: linear-gradient(135deg, #e94560, #c0392b);
            }

            .btn-red:hover {
                transform: translateY(-1px);
                box-shadow: 0 3px 10px rgba(233, 69, 96, .4);
            }

            .btn-blue {
                background: linear-gradient(135deg, #2980b9, #1a5276);
            }

            .btn-blue:hover {
                box-shadow: 0 3px 10px rgba(41, 128, 185, .4);
            }

            .btn-gray {
                background: linear-gradient(135deg, #555, #333);
            }

            .btn-gray:hover {
                box-shadow: 0 3px 10px rgba(100, 100, 100, .3);
            }

            .preset-group {
                display: flex;
                gap: 3px;
                flex-wrap: wrap;
                margin-top: 3px;
            }

            .preset-btn {
                padding: 4px 6px;
                border: 1px solid #0f3460;
                border-radius: 4px;
                background: #0d1b2a;
                color: #4fc3f7;
                font-size: 12px;
                cursor: pointer;
                transition: all .15s;
            }

            .preset-btn:hover {
                background: #0f3460;
                color: #fff;
            }

            .divider-line {
                width: 100%;
                height: 1px;
                border-bottom: 1px dashed rgba(94, 234, 212, 0.3);
                margin: 8px 0;
            }

            /* 颜色选择器 */
            input[type="color"] {
                width: 100%;
                height: 32px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                padding: 0;
                background: transparent;
            }

            input[type="range"] {
                width: 100%;
                height: 16px;
                cursor: pointer;
            }

            .hidden {
                display: none !important;
            }

            #msg a {
                color: #38bdf8;
                text-decoration: underline;
                cursor: pointer;
            }

            #msg a:hover {
                color: #7dd3fc;
            }

            /* 弹窗 */
            .alert-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.7);
                display: none;
                justify-content: center;
                align-items: center;
                z-index: 1000;
                backdrop-filter: blur(5px);
            }

            .alert-box {
                background: rgba(15, 23, 42, 0.95);
                border-radius: 16px;
                padding: 24px 28px;
                max-width: 500px;
                width: 90%;
                border: 1px solid rgba(94, 234, 212, 0.3);
                box-shadow: 0 10px 40px rgba(2, 132, 199, 0.4);
                animation: fadeIn 0.3s ease;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(-20px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .alert-title {
                color: #38bdf8;
                text-align: center;
                margin-bottom: 16px;
                font-size: 1.3rem;
            }

            .alert-content {
                color: #cbd5e1;
                line-height: 1.6;
                margin-bottom: 20px;
                font-size: 13px;
            }

            .alert-footer {
                display: flex;
                justify-content: center;
            }

            .alert-button {
                padding: 8px 28px;
                background: linear-gradient(45deg, #0ea5e9, #06b6d4);
                border: none;
                border-radius: 8px;
                color: white;
                font-weight: 600;
                cursor: pointer;
                font-size: 14px;
            }

            .alert-button:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(8, 145, 178, 0.6);
            }

            /* 3D 视口 */
            #viewport {
                flex: 1;
                position: relative;
                min-width: 0;
                background: #0a0a1a;
            }

            #canvas-container {
                width: 100%;
                height: 100%;
            }

            .overlay {
                position: absolute;
                background: rgba(15, 52, 96, .85);
                padding: 6px 12px;
                border-radius: 6px;
                font-size: 11px;
                pointer-events: none;
                z-index: 50;
                border: 1px solid #0f3460;
                color: #ddd;
            }

            #info-overlay {
                top: 10px;
                left: 10px;
            }

            #info-overlay .title {
                color: #e94560;
                font-weight: bold;
                font-size: 12px;
                margin-bottom: 2px;
            }

            #info-overlay .hint {
                color: #888;
                font-size: 9px;
                margin-top: 2px;
            }

            #status-bar {
                bottom: 10px;
                right: 10px;
                font-size: 10px;
                color: #888;
                background: rgba(15, 52, 96, .7);
            }

            .toast {
                position: fixed;
                bottom: 60px;
                left: 50%;
                transform: translateX(-50%) translateY(20px);
                background: rgba(233, 69, 96, .95);
                color: #fff;
                padding: 6px 18px;
                border-radius: 6px;
                font-size: 13px;
                z-index: 999;
                opacity: 0;
                pointer-events: none;
                transition: all .3s;
            }

            .toast.show {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }

            /* 响应式 */
            @media (max-width: 768px) {
                #panel {
                    width: 360px;
                }

                .row label {
                    flex: 0 0 44px;
                    font-size: 10px;
                }

                .row input,
                .row select {
                    font-size: 11px;
                    height: 28px;
                    padding: 3px 5px;
                }

                #panel-body {
                    padding: 6px 8px;
                }

                .checkbox-row .steel-label {
                    font-size: 10px;
                }

                .checkbox-row .steel-label input[type="checkbox"] {
                    width: 13px;
                    height: 13px;
                }
            }

            @media (max-width: 480px) {
                #panel {
                    width: 280px;
                }

                .row {
                    flex-wrap: wrap;
                    gap: 3px;
                }

                .row label {
                    flex: 0 0 100%;
                    font-size: 10px;
                }

                .row input,
                .row select {
                    flex: 1 1 45%;
                    min-width: 0;
                }

                .row2,
                .row3 {
                    flex-wrap: wrap;
                }

                .row2>*,
                .row3>* {
                    flex: 1 1 45%;
                    min-width: 0;
                }
            }
        </style>
    </head>

    <body>
        <div id="app">
            <!-- ===== 左侧面板 ===== -->
            <div id="panel">
                <div id="panel-header" title="双击恢复全部展开">
                    <div class="title"><span class="dot"></span>LED设计面板</div>
                    <div class="panel-btns">
                        <button id="btnToggleH" title="左右折叠 (←/→)" style="font-size:15px;">◀</button>
                        <button id="btnToggleV" title="上下折叠 (↑/↓)" style="font-size:12px;">▼</button>
                    </div>
                </div>
                <div id="panel-body">
                    <div class="subtitle">LED 模组安装结构 · 3D 实时预览</div>
                    <!-- Tab 栏 -->
                    <div class="tab-bar">
                        <button class="tab-btn active" data-tab="tab-params">📐 屏体参数</button>
                        <button class="tab-btn" data-tab="tab-steel">🔧 钢结构</button>
                        <button class="tab-btn" data-tab="tab-appearance">🎨 外观</button>
                        <button class="tab-btn" data-tab="tab-about">ℹ️ 关于</button>
                    </div>
                    <!-- ===== Tab 1: 屏体参数 ===== -->
                    <div class="tab-panel active" id="tab-params">
                        <form id="designForm">
                            <div class="section">
                                <h3>型号与排列</h3>
                                <div class="row">
                                    <label>室内户外</label><select id="snhw" name="snhw"></select>
                                    <label>安装样式</label><select id="azys" name="azys"></select>
                                </div>
                                <div class="row">
                                    <label>产品系列</label><select id="cpxl" name="cpxl"></select>
                                    <label>产品型号</label><select id="cpxh" name="cpxh"></select>
                                </div>
                                <div class="row">
                                    <label>单元长度</label><input id="dycd" name="dycd" type="number">
                                    <label>单元高度</label><input id="dygd" name="dygd" type="number">
                                </div>
                                <div class="row">
                                    <label>排列列数</label><input id="plls" name="plls" type="number" min="1" step="1"
                                        value="10">
                                    <label>排列行数</label><input id="plhs" name="plhs" type="number" min="1" step="1"
                                        value="10">
                                </div>
                                <div class="row">
                                    <label>单元厚度</label><input id="dyhd" name="dyhd" type="number">
                                    <label>屏体厚度</label><input id="pthd" name="pthd" type="number" value="100">
                                </div>
                                <div class="row">
                                    <label>包边上边</label><input id="bbsb" name="bbsb" type="number">
                                    <label>包边下边</label><input id="bbxb" name="bbxb" type="number">
                                </div>
                                <div class="row">
                                    <label>包边侧边</label><input id="bbcb" name="bbcb" type="number">
                                    <label>留空间隙</label><input id="lkjx" name="lkjx" type="number">
                                </div>
                                <div class="row">
                                    <label>离地高度</label><input id="ldgd" name="ldgd" type="number">
                                    <label>距离屋顶</label><input id="jlwd" name="jlwd" type="number">
                                </div>
                                <div class="row">
                                    <label>显示长度</label><input id="xscd" name="xscd" type="number" readonly
                                        class="readonly">
                                    <label>显示高度</label><input id="xsgd" name="xsgd" type="number" readonly
                                        class="readonly">
                                </div>
                            </div>
                            <div class="section">
                                <div class="row">
                                    <label>屏点间距</label><input id="pdjj" name="pdjj" type="number" readonly
                                        class="readonly">
                                    <label>项目区域</label><select id="xmqy" name="xmqy"></select>
                                </div>
                            </div>
                        </form>
                    </div>
                    <!-- ===== Tab 2: 钢结构参数 ===== -->
                    <div class="tab-panel" id="tab-steel">
                        <div class="section">
                            <h3>型材规格</h3>
                            <div class="row">
                                <label>单元背条</label><input id="dybt" name="dybt" type="text">
                                <label>背条横杆</label><input id="bthg" name="bthg" type="text">
                            </div>
                            <div class="row">
                                <label>牛腿连杆</label><input id="ntlg" name="ntlg" type="text">
                                <label>水平横杆</label><input id="sphg" name="sphg" type="text">
                            </div>
                            <div class="row">
                                <label>主承竖杆</label><input id="zcsg" name="zcsg" type="text">
                                <label>法兰埋件</label><select id="flmj" name="flmj"></select>
                            </div>
                            <div class="row">
                                <label>埋件横距</label><input id="mjhj" name="mjhj" type="number" value="1216">
                                <label>埋件竖距</label><input id="mjsj" name="mjsj" type="number" value="1500">
                            </div>
                        </div>
                        <div class="section">
                            <h3>图纸选项</h3>
                            <div class="checkbox-row">
                                <label class="steel-label"><input type="checkbox" id="psyt" name="psyt"
                                        checked>屏示意图</label>
                                <label class="steel-label"><input type="checkbox" id="pggt" name="pggt"
                                        checked>屏钢构图</label>
                            </div>
                            <div class="checkbox-row">
                                <label class="steel-label"><input type="checkbox" id="zdtj" name="zdtj"
                                        checked>自动推荐</label>
                                <label class="steel-label"><input type="checkbox" id="cltj" name="cltj"
                                        checked>材料统计</label>
                            </div>
                            <div class="checkbox-row">
                                <label class="steel-label"><input type="checkbox" id="dxft" name="dxft"
                                        checked>DXF图纸</label>
                                <label class="steel-label"><input type="checkbox" id="pdft" name="pdft"
                                        disabled>PDF图纸</label>
                            </div>
                        </div>
                        <div class="btn-row">
                            <button id="drawBtn" name="drawBtn" onclick="drawDxf()">绘图</button>
                            <button onclick="closePage()">取消</button>
                        </div>
                        <div id="msg" name="msg" class="hidden"></div>
                    </div>
                    <!-- ===== Tab 3: 外观设置 ===== -->
                    <div class="tab-panel" id="tab-appearance">
                        <div class="section">
                            <h3>材质与颜色</h3>
                            <div class="row">
                                <div style="flex:1;">
                                    <label>钢材颜色</label>
                                    <input type="color" id="steelColor" value="#8899aa" style="width:100%;height:30px;">
                                </div>
                                <div style="flex:1;">
                                    <label>背景色</label>
                                    <input type="color" id="bgColor" value="#1a1a2e" style="width:100%;height:30px;">
                                </div>
                            </div>
                            <div class="row">
                                <div style="flex:1;">
                                    <label>金属度 <span id="metalVal">0.70</span></label>
                                    <input type="range" id="metalness" min="0" max="1" step="0.05" value="0.70">
                                </div>
                                <div style="flex:1;">
                                    <label>粗糙度 <span id="roughVal">0.35</span></label>
                                    <input type="range" id="roughness" min="0" max="1" step="0.05" value="0.35">
                                </div>
                            </div>
                            <button class="btn btn-blue" onclick="applyAppearance()" style="margin-top:6px;">✓
                                应用外观</button>
                        </div>
                        <div class="section">
                            <h3>显示选项</h3>
                            <div class="row">
                                <div style="flex:1;">
                                    <label>显示边线</label>
                                    <select id="showEdges">
                                        <option value="1" selected>是</option>
                                        <option value="0">否</option>

        <script>
            /* =======================
               LED显示屏 主逻辑 (原有，适配新布局)
               ======================= */
            const $id = id => document.getElementById(id);
            function getEls(ids) {
                const r = {};
                ids.forEach(id => { r[id] = $id(id); });
                return r;
            }
            const els = getEls([
                'snhw', 'cpxl', 'cpxh', 'pdjj',
                'dycd', 'dygd', 'bbsb', 'azys',
                'plls', 'plhs', 'bbxb', 'bbcb',
                'dyhd', 'pthd', 'ldgd', 'jlwd',
                'xscd', 'xsgd', 'lkjx', 'xmqy',
                'dybt', 'bthg', 'ntlg', 'sphg',
                'zcsg', 'mjhj', 'mjsj', 'flmj',
                'psyt', 'pggt', 'zdtj', 'cltj', 'dxft', 'pdft',
                'drawBtn', 'msg', 'designForm'
            ]);
            const {
                snhw: snhwEl, cpxl: cpxlEl, cpxh: cpxhEl, pdjj: pdjjEl,
                dycd: dycdEl, dygd: dygdEl, bbsb: bbsbEl, azys: azysEl,
                plls: pllsEl, plhs: plhsEl, bbxb: bbxbEl, bbcb: bbcbEl,
                dyhd: dyhdEl, pthd: pthdEl, ldgd: ldgdEl, jlwd: jlwdEl,
                xscd: xscdEl, xsgd: xsgdEl, lkjx: lkjxEl, xmqy: xmqyEl,
                dybt: dybtEl, bthg: bthgEl, ntlg: ntlgEl, sphg: sphgEl,
                zcsg: zcsgEl, mjhj: mjhjEl, mjsj: mjsjEl, flmj: flmjEl,
                psyt: psytEl, pggt: pggtEl, zdtj: zdtjEl, cltj: cltjEl, dxft: dxftEl, pdft: pdftEl,
                drawBtn: drawBtnEl, msg: msgEl, designForm: designFormEl
            } = els;
            // ---- 工具 ----
            function evalExpr(expr) {
                try { if (!/^[\d\s+\-*/().]+$/.test(expr)) return 0; return Function('"use strict";return (' + expr + ')')(); } catch (
                e) { return 0; }
            }
            function normalizePositiveInt(el) {
                const v = Math.max(1, Math.trunc(Number(el.value)) || 1);
                if (String(el.value) !== String(v)) el.value = v;
                return v;
            }
            function swapFirstTwo(str) {
                const list = str.split('*');
                if (list.length >= 3) { [list[0], list[1]] = [list[1], list[0]]; }
                return list.join('*');
            }
            // ---- 初始化下拉 ----
            function initSelect(selectId, dataKey, defaultValue) {
                const sel = document.getElementById(selectId);
                if (!sel) return;
                const list = LED_DATA[dataKey];
                if (!Array.isArray(list)) return;
                sel.innerHTML = '';
                list.forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item;
                    opt.textContent = item;
                    sel.appendChild(opt);
                });
                if (defaultValue !== undefined) { sel.value = defaultValue; }
                updateProductSeries();
                updateSnhwState();
            }
            // ---- 级联 ----
            function updateProductSeries() {
                const snhw = snhwEl.value;
                const seriesMap = productData[snhw] || {};
                cpxlEl.innerHTML = '';
                cpxhEl.innerHTML = '';
                Object.keys(seriesMap).forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s;
                    opt.textContent = s;
                    cpxlEl.appendChild(opt);
                });
                updateProductModels();
            }
            function updateProductModels() {
                const snhw = snhwEl.value;
                const series = cpxlEl.value;
                const models = (productData[snhw] && productData[snhw][series]) || [];
                cpxhEl.innerHTML = '';
                models.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m;
                    opt.textContent = m;
                    cpxhEl.appendChild(opt);
                });
                updateCombos();
            }
            function updateCombos() {
                const v = cpxhEl.value;
                const settings = cpxhSettings[v];
                if (settings) {
                    dycdEl.value = settings.dycd;
                    dygdEl.value = settings.dygd;
                    pdjjEl.value = settings.pdjj;
                } else {
                    if (v.startsWith('Q') || v.startsWith('CC') || v.startsWith('R')) {
                        dycdEl.value = 320;
                        dygdEl.value = 160;
                        dyhdEl.value = (snhwEl.value == '户外') ? 26 : 22.5;
                    } else if (v.startsWith('XS')) {
                        dycdEl.value = 320;
                        dygdEl.value = 240;
                        dyhdEl.value = 20.6;
                    } else if (v.startsWith('XC')) {
                        dycdEl.value = 600;
                        dygdEl.value = 337.5;
                        dyhdEl.value = 39.8;
                    } else if (v.startsWith('YK')) {
                        dycdEl.value = 600;
                        dygdEl.value = 337.5;
                        dyhdEl.value = 37.4;
                    } else if (v.startsWith('VK')) {
                        dycdEl.value = 600;
                        dygdEl.value = 337.5;
                        dyhdEl.value = 53;
                    } else if (v.startsWith('DM')) {
                        dycdEl.value = 500;
                        dygdEl.value = 500;
                        dyhdEl.value = 68;
                    } else if (v.startsWith('HY')) {
                        dycdEl.value = 500;
                        dygdEl.value = 500;
                        dyhdEl.value = 68;
                    } else if (v.startsWith('LY')) {
                        dycdEl.value = 500;
                        dygdEl.value = 500;
                        dyhdEl.value = 88;
                    } else if (v.startsWith('CG')) {
                        dycdEl.value = 500;
                        dygdEl.value = 500;
                        dyhdEl.value = 72;
                    } else if (v.startsWith('EM')) {
                        dycdEl.value = 500;
                        dygdEl.value = 500;
                        dyhdEl.value = 20.6;
                    } else if (v.startsWith('CS')) {
                        dycdEl.value = 640;
                        dygdEl.value = 480;
                        dyhdEl.value = 39;
                    } else if (v.startsWith('DW')) {
                        dycdEl.value = 640;
                        dygdEl.value = 343;
                        dyhdEl.value = 59.5;
                    } else if (v.startsWith('GS')) {
                        dycdEl.value = 1000;
                        dygdEl.value = 1000;
                        dyhdEl.value = 77;
                    } else if (v.startsWith('TS')) {
                        dycdEl.value = 1000;
                        dygdEl.value = 1000;
                        dyhdEl.value = 28;
                    } else if (v.startsWith('UTS')) {
                        dycdEl.value = 1000;
                        dygdEl.value = 500;
                        dyhdEl.value = 78;
                    } else {
                        dycdEl.value = defaultQSettings.dycd;
                        dygdEl.value = defaultQSettings.dygd;
                    }
                }
                xscdEl.value = (+dycdEl.value || 0) * normalizePositiveInt(pllsEl);
                xsgdEl.value = (+dygdEl.value || 0) * normalizePositiveInt(plhsEl);
                scheduleUpdate3D();
            }
            function updateSnhwState() {
                const s = snhwSettings[snhwEl.value];
                if (s) {
                    dybtEl.value = s.dybt;
                    bthgEl.value = swapFirstTwo(s.dybt);
                    ntlgEl.value = swapFirstTwo(s.dybt);
                    sphgEl.value = LED_DATA['材料列表'][1] || '';
                    flmjEl.value = LED_DATA['法兰埋件'][1] || '';
                    if (dycdEl.value > 320) {
                        dybtEl.value = "40*40*3方管";
                        bthgEl.value = "40*40*3方管";
                        ntlgEl.value = "40*40*3方管";
                    }
                }
                updatezcsgState();
                updateSteelFieldsState();
                applyPthdLimit();
                scheduleUpdate3D();
            }
            function updatezcsgState() {
                zcsgEl.value = "";
                if (['吊装', '顶天立地'].includes(azysEl.value)) {
                    const lsztH = [xsgdEl, bbsbEl, jlwdEl, bbxbEl, ldgdEl].reduce((sum, el) => sum + (parseFloat(el?.value) || 0),
                        0);
                    if (lsztH < 2000) zcsgEl.value = "40*40*3方管";
                    else if (lsztH < 3000) zcsgEl.value = "40*60*3方管";
                    else if (lsztH < 4000) zcsgEl.value = "40*80*4方管";
                    else if (lsztH < 5000) zcsgEl.value = "50*100*5方管";
                    else zcsgEl.value = "60*120*5方管";
                }
                scheduleUpdate3D();
            }
            function updateLdgdState() {
                const v = azysEl.value;
                const ldgdEdit = (v === '落地拉墙' || v === '顶天立地');
                const jlwdEdit = (v === '吊装' || v === '顶天立地');
                const lkjxEdit = (v === '嵌入');
                ldgdEl.readOnly = !ldgdEdit;
                ldgdEl.classList.toggle('readonly', !ldgdEdit);
                jlwdEl.readOnly = !jlwdEdit;
                jlwdEl.classList.toggle('readonly', !jlwdEdit);
                lkjxEl.readOnly = !lkjxEdit;
                lkjxEl.classList.toggle('readonly', !lkjxEdit);
                if (!ldgdEdit) ldgdEl.value = 0;
                else if (!ldgdEl.value || +ldgdEl.value === 0) ldgdEl.value = 500;
                if (!jlwdEdit) jlwdEl.value = 0;
                else if (!jlwdEl.value || +jlwdEl.value === 0) jlwdEl.value = 500;
                if (!lkjxEdit) lkjxEl.value = 0;
                else if (!lkjxEl.value || +lkjxEl.value === 0) lkjxEl.value = 0;
                updateBbsbState();
                updateHorizontalBeam();
                applyPthdLimit();
                scheduleUpdate3D();
            }
            function updateBbsbState() {
                const e = azysEl.value === '嵌入';
                [bbcbEl, bbsbEl, bbxbEl].forEach(el => {
                    el.readOnly = e;
                    el.classList.toggle('readonly', e);
                });
                if (e) {
                    bbsbEl.value = 0;
                    bbxbEl.value = 0;
                    bbcbEl.value = 0
                } else if (!bbsbEl.value || +bbsbEl.value === 0) {
                    bbsbEl.value = 50;
                    bbxbEl.value = 50;
                    bbcbEl.value = 50
                }
                updateSteelFieldsState();
                updateHorizontalBeam();
                scheduleUpdate3D();
            }
            function applyPthdLimit() {
                if (!pggtEl.checked) return;
                const dybtStr = dybtEl.value.trim();
                const bthgStr = bthgEl.value.trim();
                const zcsgStr = zcsgEl.value.trim();
                const dyhdVal = parseFloat(dyhdEl.value) || 0;
                let minThick = dyhdVal;
                const parts1 = dybtStr.split('*');
                if (parts1.length >= 2) { const wall = parseFloat(parts1[1]); if (!isNaN(wall)) minThick += wall }
                const parts2 = bthgStr.split('*');
                if (parts2.length >= 2) { const h = parseFloat(parts2[0]); if (!isNaN(h)) minThick += h }
                const parts3 = zcsgStr.split('*');
                if (parts3.length >= 2) { const h0 = parseFloat(parts3[1]); if (!isNaN(h0)) minThick += h0 }
                const current = parseFloat(pthdEl.value) || 0;
                if (current < minThick) { pthdEl.value = minThick }
                scheduleUpdate3D();
            }
            function updateSteelFieldsState() {
                const currentChecked = pggtEl.checked;
                if (currentChecked && !(pggtEl.dataset.prevChecked === 'true')) { zdtjEl.checked = true }
                pggtEl.dataset.prevChecked = currentChecked;
                const currentChecked0 = psytEl.checked;
                if (currentChecked0 && !(psytEl.dataset.prevChecked === 'true')) { dxftEl.checked = true }
                psytEl.dataset.prevChecked = currentChecked0;
                const psytC = psytEl.checked;
                const pggtC = pggtEl.checked;
                const zdtjC = zdtjEl.checked;
                const dxftC = dxftEl.checked;
                if (!psytC) { [pggtEl, cltjEl, dxftEl, pdftEl].forEach(el => el.checked = false) }
                const active = pggtEl.checked;
                const disable = !active || zdtjC;
                [dybtEl, bthgEl, ntlgEl, sphgEl, dycdEl, dygdEl, dyhdEl, mjhjEl, mjsjEl].forEach(f => {
                    f.readOnly = disable;
                    f.classList.toggle('readonly', disable);
                });
                if (!active) {
                    pthdEl.value = 100;
                    pthdEl.readOnly = true;
                    pthdEl.classList.add('readonly');
                } else {
                    pthdEl.readOnly = false;
                    pthdEl.classList.remove('readonly');
                    applyPthdLimit();
                }
                if (!active) {

        <script>
            (function () {

                function parseSpec(spec) {
                    if (!spec) return null;
                    const parts = spec.replace(/\s/g, '').split('*');

                            const y = -halfH + row * unitH + unitH / 2;

                            screenGroup.add(mesh);
                            const edgeMesh = new THREE.Mesh(edgeGeo, edgeMat);

                        const roofMat = new THREE.MeshStandardMaterial({
                            color: 0x3a4a5a,
                            transparent: true,
                            opacity: 0.2,
                            side: THREE.DoubleSide,
                        });
                        const rGeo = new THREE.BoxGeometry(totalW + bbcb * 2 + 200, jlwd, 20);
                        const roof = new THREE.Mesh(rGeo, roofMat);
                        roof.position.set(0, halfH + bbsb + jlwd / 2, -10);
                        modelGroup.add(roof);
                    }
                    // ----- 4. 钢结构 -----
                    if (pggt && dybt) {
                        // 背条
                        const btInfo = parseSpec(dybt);
                        let btW = 40,
                            btH = 20;
                        if (btInfo && btInfo.nums.length >= 2) {
                            btW = btInfo.nums[0];
                            btH = btInfo.nums.length >= 2 ? btInfo.nums[1] : btInfo.nums[0];
                        }
                        const numBars = Math.max(2, Math.floor(plls / 2) + 1);
                        const barSpacing = totalW / (numBars - 1 || 1);
                        for (let i = 0; i < numBars; i++) {
                            const x = -halfW + i * barSpacing;
                            const barGeo = new THREE.BoxGeometry(btW, totalH + bbsb + bbxb, btH);
                            const bar = new THREE.Mesh(barGeo, steelMat);
                            bar.position.set(x, (bbsb - bbxb) / 2, -depth / 2 - btH / 2);
                            bar.castShadow = true;
                            modelGroup.add(bar);
                        }
                        // 水平横杆
                        if (sphg) {
                            const hgInfo = parseSpec(sphg);
                            let hgW = 40,
                                hgH = 20;
                            if (hgInfo && hgInfo.nums.length >= 2) {
                                hgW = hgInfo.nums[0];
                                hgH = hgInfo.nums.length >= 2 ? hgInfo.nums[1] : hgInfo.nums[0];
                            }
                            const numHg = Math.max(2, Math.floor(plhs / 2) + 1);
                            const hgSpacing = totalH / (numHg - 1 || 1);
                            for (let i = 0; i < numHg; i++) {
                                const y = -halfH + i * hgSpacing;
                                const hgGeo = new THREE.BoxGeometry(totalW + bbcb * 2, hgW, hgH);
                                const hg = new THREE.Mesh(hgGeo, steelMat);
                                hg.position.set(0, y, -depth / 2 - hgH / 2);
                                hg.castShadow = true;
                                modelGroup.add(hg);
                            }
                        }
                        // 主承竖杆
                        if (zcsg) {
                            const zcInfo = parseSpec(zcsg);
                            let zcW = 60,
                                zcH = 120;
                            if (zcInfo && zcInfo.nums.length >= 2) {
                                zcW = zcInfo.nums[0];
                                zcH = zcInfo.nums.length >= 2 ? zcInfo.nums[1] : zcInfo.nums[0];
                            }
                            const zcPositions = [-halfW - bbcb, 0, halfW + bbcb];
                            zcPositions.forEach(x => {
                                const zcGeo = new THREE.BoxGeometry(zcW, totalH + bbsb + bbxb + ldgd + jlwd, zcH);
                                const zc = new THREE.Mesh(zcGeo, steelMat);
                                zc.position.set(x, (bbsb - bbxb - ldgd + jlwd) / 2, -depth / 2 - zcH / 2);
                                zc.castShadow = true;
                                modelGroup.add(zc);
                            });
                        }
                        // 法兰埋件
                        if (flmj) {
                            const flMat = new THREE.MeshStandardMaterial({
                                color: 0xcc8844,
                                metalness: 0.9,
                                roughness: 0.3,
                            });
                            const flInfo = parseSpec(flmj);
                            let flW = 150,
                                flH = 150,
                                flT = 8;
                            if (flInfo && flInfo.nums.length >= 2) {
                                flW = flInfo.nums[0];
                                flH = flInfo.nums.length >= 2 ? flInfo.nums[1] : flInfo.nums[0];
                                flT = flInfo.nums.length >= 3 ? flInfo.nums[2] : 8;
                            }
                            if (ldgd > 0) {
                                const flGeo = new THREE.BoxGeometry(flW, flT, flH);
                                const fl = new THREE.Mesh(flGeo, flMat);
                                fl.position.set(0, -halfH - bbxb - ldgd, -depth / 2);
                                fl.castShadow = true;
                                modelGroup.add(fl);
                            }
                            if (jlwd > 0) {
                                const flGeo = new THREE.BoxGeometry(flW, flT, flH);
                                const fl = new THREE.Mesh(flGeo, flMat);
                                fl.position.set(0, halfH + bbsb + jlwd, -depth / 2);
                                fl.castShadow = true;
                                modelGroup.add(fl);
                            }
                        }
                    }
                    // 自动聚焦
                    const size = Math.max(totalW, totalH, depth + ldgd + jlwd);
                    const dist = size * 1.2 + 2000;
                    camera.position.set(dist * 0.6, dist * 0.5, dist * 0.7);
                    controls.target.set(0, (bbsb - bbxb - ldgd + jlwd) / 2, 0);
                    controls.update();
                    document.getElementById('statusText').textContent =
                        `${plls}×${plhs} 单元 | ${totalW}×${totalH}mm | ${cpxh} | ${snhw}`;
                }
                // ---- 更新场景 ----
                window.update3DScene = function () {
                    const params = {
                        dycd: parseFloat(document.getElementById('dycd')?.value) || 320,
                        dygd: parseFloat(document.getElementById('dygd')?.value) || 160,
                        plls: parseInt(document.getElementById('plls')?.value) || 10,
                        plhs: parseInt(document.getElementById('plhs')?.value) || 10,
                        xscd: parseFloat(document.getElementById('xscd')?.value) || 3200,
                        xsgd: parseFloat(document.getElementById('xsgd')?.value) || 1600,
                        bbcb: parseFloat(document.getElementById('bbcb')?.value) || 50,
                        bbsb: parseFloat(document.getElementById('bbsb')?.value) || 50,
                        bbxb: parseFloat(document.getElementById('bbxb')?.value) || 50,
                        pthd: parseFloat(document.getElementById('pthd')?.value) || 100,
                        dyhd: parseFloat(document.getElementById('dyhd')?.value) || 22.5,
                        ldgd: parseFloat(document.getElementById('ldgd')?.value) || 0,
                        jlwd: parseFloat(document.getElementById('jlwd')?.value) || 0,
                        azys: document.getElementById('azys')?.value || '壁挂',
                        dybt: document.getElementById('dybt')?.value || '40*20*2方管',
                        bthg: document.getElementById('bthg')?.value || '',
                        zcsg: document.getElementById('zcsg')?.value || '',
                        flmj: document.getElementById('flmj')?.value || '',
                        sphg: document.getElementById('sphg')?.value || '',
                        ntlg: document.getElementById('ntlg')?.value || '',
                        mjhj: parseFloat(document.getElementById('mjhj')?.value) || 1216,
                        mjsj: parseFloat(document.getElementById('mjsj')?.value) || 1500,
                        pggt: document.getElementById('pggt')?.checked || false,
                        snhw: document.getElementById('snhw')?.value || '室内',
                        cpxh: document.getElementById('cpxh')?.value || 'Q2.5',
                    };
                    buildLEDModel(params);
                };
                // ---- 窗口自适应 ----
                function resizeRenderer() {
                    const w = container.clientWidth;
                    const h = container.clientHeight;
                    if (w > 0 && h > 0) {
                        camera.aspect = w / h;
                        camera.updateProjectionMatrix();
                        renderer.setSize(w, h);
                    }
                }
                window.addEventListener('resize', resizeRenderer);
                window._resizeRenderer3D = resizeRenderer;
                // ---- 相机控制 ----
                window._setCamera3D = function (x, y, z) {
                    camera.position.set(x, y, z);
                    controls.update();
                };
                window._focusAll3D = function () {
                    const size = 4000;
                    camera.position.set(size * 0.6, size * 0.5, size * 0.7);
                    controls.target.set(0, 0, 0);
                    controls.update();
                };
                // ---- 渲染循环 ----
                let fpsCount = 0,
                    fpsTime = performance.now();
                function animate() {
                    requestAnimationFrame(animate);
                    controls.update();
                    renderer.render(scene, camera);
                    fpsCount++;
                    const now = performance.now();
                    if (now - fpsTime >= 1000) {
                        document.getElementById('fpsCounter').textContent = fpsCount;
                        fpsCount = 0;
                        fpsTime = now;
                    }
                }
                animate();
                // ---- 初始渲染 ----
                setTimeout(window.update3DScene, 200);
                // ---- 监听表单变化 ----
                document.addEventListener('change', function (e) {
                    const targets = ['snhw', 'cpxl', 'cpxh', 'azys', 'plls', 'plhs', 'pggt', 'zdtj', 'psyt'];
                    if (targets.includes(e.target.id)) {
                        setTimeout(window.update3DScene, 100);
                    }
                });
                document.addEventListener('input', function (e) {
                    const targets = ['dycd', 'dygd', 'bbcb', 'bbsb', 'bbxb', 'pthd', 'dyhd', 'ldgd', 'jlwd',
                        'dybt', 'bthg', 'zcsg', 'sphg', 'ntlg', 'mjhj', 'mjsj'
                    ];
                    if (targets.includes(e.target.id)) {
                        clearTimeout(window._inputUpdateTimer);
                        window._inputUpdateTimer = setTimeout(window.update3DScene, 200);
                    }
                });
                console.log('3D 预览引擎已启动 (外观增强版)');
            })();
        </script>
    </body>

</html>
