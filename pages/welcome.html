<!DOCTYPE html>
<html lang="zh-CN">
<head>
        <script src="../static/js/runtime.js?v=20260827r"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>首页概览</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../static/css/welcome.css">
</head>
<body>
    <div class="page-welcome">
        <h1>LED显示屏设计工具集</h1>
        <p class="subtitle">一站式LED显示屏设计解决方案，涵盖结构设计、模组排列、弧形计算、应用模型等功能，助力工程师高效完成项目设计与实施。</p>

        <div class="stats">
            <div class="stat-card"><div class="stat-value">N+</div><div class="stat-label">专业工具</div></div>
            <div class="stat-card"><div class="stat-value">100%</div><div class="stat-label">设计精度</div></div>
            <div class="stat-card"><div class="stat-value">50+</div><div class="stat-label">支持型号</div></div>
            <div class="stat-card"><div class="stat-value">24/7</div><div class="stat-label">技术支持</div></div>
        </div>

        <div>
            <h2 class="section-title">常用工具</h2>
            <div class="tools-grid" id="toolsGrid">
                <!-- JS 动态渲染，加载中提示 -->
                <p style="grid-column:1/-1; text-align:center; color:#94a3b8;">加载中...</p>
            </div>
        </div>
    </div>

    <script>
        // ---------- 卡片配置（id 必须与 menus.json 一致） ----------
        const CARD_CONFIG = [
            {
                id: 'led-design',
                icon: 'fa-palette',
                title: '结构设计',
                desc: '支持Q系列/S系列多种型号，自动计算显示尺寸，提供多种安装样式和结构截面选择。',
                tags: ['室内/户外', '多种型号', '自动计算']
            },
            {
                id: 'module-padding',
                icon: 'fa-cubes-stacked',
                title: '填充矩形',
                desc: '规则图形内模组的排列，包含圆形、梯形、三角形、椭圆、扇形、弓形、圆环、扇环、正多边形。',
                tags: ['大小模组', '规则轮廓', '排列计算']
            },
            {
                id: 'arc-calculator',
                icon: 'fa-calculator',
                title: '弧形计算',
                desc: '已知弧长、半径、弦长、弦高、圆心角中的2个值,进而计算出其余3个参数值。',
                tags: ['弦长拱高', '优弧劣弧', '求三用二']
            },
            {
                id: 'steel-calibration',
                icon: 'fa-folder-open',
                title: '钢材校核',
                desc: '方管、圆管的长细比 & 压力校核工具，由长细比计算理论最大允许长度；轴心承压验算；压弯验算。',
                tags: ['长细比', '轴心承压', '压弯校核']
            },
            {
                id: 'search',
                icon: 'fa-list-alt',
                title: '标底搜索',
                desc: '竞品标底参数超级搜索助手。',
                tags: ['标底参数', '行业竞品', '毫秒搜索']
            },
            {
                id: 'display-application-3d',
                icon: 'fa-cubes',
                title: '应用模型',
                desc: '各种样式的显示屏三维模型结构展示，包含常规异形、机械结构、箱体结构、包材工具等。',
                tags: ['屏钢结构', '箱体结构', '其他工具']
            }
        ];

        // ---------- 渲染工具卡片（基于用户权限） ----------
        async function renderTools() {
            const grid = document.getElementById('toolsGrid');
            try {
                const res = await fetch('/auth/user');
                const data = await res.json();
                const userMenus = data.menus || [];  // 未登录时返回 guest 权限

                const allowed = CARD_CONFIG.filter(card => userMenus.includes(card.id));

                if (allowed.length === 0) {
                    grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:#94a3b8;">暂无可用工具</p>';
                    return;
                }

                grid.innerHTML = allowed.map(card => `
                    <div class="tool-card" data-page="${card.id}">
                        <div class="tool-icon"><i class="fa-solid ${card.icon}"></i></div>
                        <div class="tool-title">${card.title}</div>
                        <div class="tool-desc">${card.desc}</div>
                        <div class="tool-tags">${card.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
                    </div>
                `).join('');

                // 点击卡片跳转（调用父窗口的切换函数）
                document.querySelectorAll('.tool-card').forEach(card => {
                    card.addEventListener('click', function() {
                        const page = this.dataset.page;
                        if (page && window.parent && typeof window.parent.switchPage === 'function') {
                            window.parent.switchPage(page);
                        } else {
                            console.warn('父窗口 switchPage 方法未定义');
                        }
                    });
                });

            } catch (e) {
                console.error('加载工具列表失败', e);
                grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:#e74c3c;">加载失败，请刷新页面</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', renderTools);
    </script>
</body>
</html>
