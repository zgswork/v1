<!DOCTYPE html>
<html>

    <head>
        <script src="../static/js/runtime.js?v=20260827p"></script>
        <meta charset="UTF-8">
        <title>超级搜索助手</title>
        <style>
            /* ========== 全局深色主题适配 ========== */
            * {
                box-sizing: border-box;
            }

            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 20px;
                /* 背景透明，让主框架黑色背景透出 */
                background: linear-gradient(145deg, var(--theme-1), var(--theme-2));
                /*transparent;*/
                /* 文字使用浅色，保证在黑色背景下清晰 */
                color: #e8e8e8;
                min-height: 100vh;
            }

            /* 主标题区域 */
            .heading-wrapper {
                text-align: center;
                margin: 10px 0 20px 0;
            }

            .main-heading {
                display: block;
                margin: 0 0 4px 0;
                color: #ffffff;
                font-weight: 700;
                letter-spacing: 0.5px;
            }

            .sub-heading {
                display: block;
                margin: 0;
                color: #aaaaaa;
                font-size: 14px;
            }

            #configNotice {
                display: none;
            }

            /* ========== 表格样式 - 深色适配 ========== */
            #result,
            #testResult {
                margin-top: 20px;
                overflow-x: auto;
                display: block;
                width: 100%;
                box-sizing: border-box;
            }

            table {
                border-collapse: collapse;
                width: 100%;
                font-size: 16px;
                table-layout: auto;
                background: linear-gradient(145deg, var(--theme-1), var(--theme-2));
                border-radius: 6px;
                overflow: hidden;
                border: 1px solid #3a3a3f;
            }

            th,
            td {
                border: 1px solid #3a3a3f;
                padding: 6px 8px;
                text-align: left;
                vertical-align: top;
                word-wrap: break-word;
                word-break: break-all;
                white-space: normal;
                resize: horizontal;
                overflow: hidden;
                line-height: 1.4;
                color: #e8e8e8;
            }

            th {
                background-color: #2a2a30;
                position: sticky;
                top: 0;
                font-weight: 700;
                color: #ffffff;
                border-bottom: 2px solid #4a4a52;
            }

            /* 标底内容列 - 宽 */
            td:nth-child(4),
            th:nth-child(4) {
                min-width: 350px;
                width: 60%;
                max-width: 900px;
            }

            /* 工作表列 */
            td:nth-child(1),
            th:nth-child(1) {
                min-width: 70px;
                max-width: 100px;
                width: auto;
            }

            /* 产品型号列 */
            td:nth-child(2),
            th:nth-child(2) {
                min-width: 60px;
                max-width: 120px;
                width: auto;
            }

            /* 封装方式列 */
            td:nth-child(3),
            th:nth-child(3) {
                min-width: 60px;
                max-width: 100px;
                width: auto;
            }

            /* 信息来源列 */
            td:nth-child(5),
            th:nth-child(5) {
                min-width: 70px;
                max-width: 150px;
                width: auto;
            }

            /* 收集人列 */
            td:nth-child(6),
            th:nth-child(6) {
                min-width: 70px;
                max-width: 120px;
                width: auto;
            }

            /* 备注列 - 极窄 */
            td.remark-col,
            th.remark-col {
                min-width: 50px;
                max-width: 80px;
                width: auto;
            }

            /* 表格行 hover 效果 */
            tbody tr:hover {
                background-color: rgba(60, 60, 70, 0.5);
            }

            /* 表格内辅助文字 */
            .sub-text {
                color: #999999;
                font-size: 12px;
                display: block;
                margin-left: 2px;
            }

            /* 关键词高亮 - 亮红色，深色背景下醒目 */
            .highlight-keyword {
                color: #ff6b6b;
                font-weight: 700;
                background: rgba(255, 107, 107, 0.15);
                padding: 0 2px;
                border-radius: 2px;
            }

            /* ========== 悬浮搜索框 - 深色适配 ========== */
            .search-float-window {
                position: fixed;
                top: 20px;
                right: 20px;
                background: linear-gradient(145deg, var(--theme-1), var(--theme-2));
                padding: 10px 16px;
                border: 1px solid #4a4a52;
                border-radius: 8px;
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
                z-index: 9999;
                display: flex;
                align-items: center;
                gap: 10px;
                min-width: 360px;
                backdrop-filter: blur(4px);
            }

            .search-float-window h3 {
                margin: 0;
                font-size: 15px;
                white-space: nowrap;
                color: #ffffff;
                font-weight: 600;
            }

            .search-float-window input {
                padding: 6px 10px;
                font-size: 14px;
                width: 180px;
                border: 1px solid #4a4a52;
                border-radius: 4px;
                background: linear-gradient(145deg, var(--theme-1), var(--theme-2));
                color: #e8e8e8;
                outline: none;
                transition: border-color 0.2s;
            }

            .search-float-window input:focus {
                border-color: #7a7a8a;
            }

            .search-float-window input::placeholder {
                color: #777777;
            }

            .search-float-window button {
                padding: 6px 16px;
                font-size: 14px;
                cursor: pointer;
                border: 1px solid #4a4a52;
                border-radius: 4px;
                background: linear-gradient(145deg, var(--theme-1), var(--theme-2));
                color: #ffffff;
                font-weight: 600;
                transition: background 0.2s, border-color 0.2s;
            }

            .search-float-window button:hover {
                background: #4d4d5a;
                border-color: #5a5a6a;
            }

            .search-float-window button:active {
                background: #2d2d38;
            }

            /* ========== 自定义右键菜单 - 深色适配 ========== */
            #customContextMenu {
                position: fixed;
                background: #ffffff;
                border: 1px solid #4a4a52;
                border-radius: 6px;
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
                z-index: 99999;
                display: none;
                min-width: 100px;
                padding: 4px 0;
            }

            #customContextMenu div {
                padding: 8px 16px;
                cursor: pointer;
                font-size: 16px;
                color: #000000;
                transition: background 0.15s;
            }

            #customContextMenu div:hover {
                background: #3d3d4a;
            }

            /* ========== 提示文字 ========== */
            #testResult p,
            #result p {
                color: #cccccc;
            }

            #testResult p[style*='color:red'],
            #result p[style*='color:red'] {
                color: #ff6b6b !important;
            }

            /* ========== 滚动条美化（深色） ========== */
            ::-webkit-scrollbar {
                width: 8px;
                height: 8px;
            }

            ::-webkit-scrollbar-track {
                background: rgba(30, 30, 36, 0.6);
                border-radius: 4px;
            }

            ::-webkit-scrollbar-thumb {
                background: #4a4a52;
                border-radius: 4px;
            }

            ::-webkit-scrollbar-thumb:hover {
                background: #5a5a6a;
            }

            /* ========== 响应式微调 ========== */
            @media (max-width: 600px) {
                .search-float-window {
                    top: 10px;
                    right: 10px;
                    left: 10px;
                    min-width: unset;
                    flex-wrap: wrap;
                    justify-content: center;
                    padding: 10px 12px;
                }

                .search-float-window input {
                    width: 120px;
                    flex: 1;
                }

                body {
                    padding: 12px;
                }

                td,
                th {
                    padding: 4px 5px;
                    font-size: 12px;
                }

                td:nth-child(4),
                th:nth-child(4) {
                    min-width: 200px;
                    width: 50%;
                }
            }

            /* ========== 可选：浅色主题覆盖（通过添加 .light-theme 到 body 切换） ========== */
            body.light-theme {
                color: #222222;
            }

            body.light-theme .main-heading {
                color: #111111;
            }

            body.light-theme .sub-heading {
                color: #555555;
            }

            body.light-theme table {
                background: rgba(255, 255, 255, 0.95);
                border-color: #cccccc;
            }

            body.light-theme th {
                background: #f0f0f0;
                color: #111111;
                border-bottom-color: #bbbbbb;
            }

            body.light-theme td {
                border-color: #cccccc;
                color: #222222;
            }

            body.light-theme .sub-text {
                color: #666666;
            }

            body.light-theme .highlight-keyword {
                color: #cc0000;
                background: rgba(204, 0, 0, 0.10);
            }

            body.light-theme .search-float-window {
                background: #f8f8f8;
                border-color: #cccccc;
                box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            }

            body.light-theme .search-float-window h3 {
                color: #222222;
            }

            body.light-theme .search-float-window input {
                background: #ffffff;
                color: #222222;
                border-color: #cccccc;
            }

            body.light-theme .search-float-window input:focus {
                border-color: #888888;
            }

            body.light-theme .search-float-window button {
                background: #e0e0e0;
                color: #222222;
                border-color: #cccccc;
            }

            body.light-theme .search-float-window button:hover {
                background: #d0d0d0;
            }

            body.light-theme #customContextMenu {
                background: #f8f8f8;
                border-color: #cccccc;
                box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            }

            body.light-theme #customContextMenu div {
                color: #222222;
            }

            body.light-theme #customContextMenu div:hover {
                background: #e8e8e8;
            }

            body.light-theme #testResult p,
            body.light-theme #result p {
                color: #444444;
            }

            body.light-theme #testResult p[style*='color:red'],
            body.light-theme #result p[style*='color:red'] {
                color: #cc0000 !important;
            }

            body.light-theme ::-webkit-scrollbar-track {
                background: rgba(200, 200, 200, 0.4);
            }

            body.light-theme ::-webkit-scrollbar-thumb {
                background: #bbbbbb;
            }

            body.light-theme ::-webkit-scrollbar-thumb:hover {
                background: #aaaaaa;
            }

            body.light-theme tbody tr:hover {
                background-color: rgba(0, 0, 0, 0.04);
            }
        </style>
    </head>

    <body>
        <!-- ===== 标题区域 ===== 
        <div class="heading-wrapper">
            <h1 class="main-heading">竞品标底参数超级搜索助手<span style="font-size: .5em;">(V1.2.0 by 笙)</span></h1>
            <div><span class="sub-heading">(数据库更新截止到2026.03.10)</span></div>
        </div>
        -->
        <div id="configNotice"></div>
        <!-- ===== 悬浮搜索框 ===== -->
        <div class="search-float-window">
            <h3>🔍 搜索词组<span style="font-size: .8em;"><br>更新2026.03.10</span></h3>
            <input type="text" id="testInput" placeholder="输入关键词">
            <button onclick="testSearch()">搜索</button>
        </div>
        <!-- ===== 自定义右键菜单 ===== -->
        <div id="customContextMenu">
            <div id="ctxSuperSearch">标底搜索</div>
        </div>
        <!-- ===== 搜索结果展示区 ===== -->
        <div id="testResult"></div>
        <div id="result" style="display:none;"></div>
        <script>
            // ============================================================
            //  工具函数
            // ============================================================
            function escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
            function cleanText(str) {
                if (str == null) return '';
                return String(str)
                    .replace(/\r/g, '')
                    .replace(/\n+/g, '\n')
                    .replace(/[ \t]+/g, ' ')
                    .trim();
            }
            // ============================================================
            //  渲染表格（支持关键词高亮）
            // ============================================================
            function displayResultsAsTable(results, containerId, keyword) {
                const container = document.getElementById(containerId);
                if (!container) return;
                container.innerHTML = '';
                container.scrollLeft = 0;
                container.scrollTop = 0;
                container.className = '';
                if (!Array.isArray(results)) {
                    container.innerHTML = "<p style='color:#ff6b6b'>数据格式错误</p>";
                    return;
                }
                if (results.length === 0) {
                    container.innerHTML = "<p>未找到匹配内容</p>";
                    return;
                }
                const hasRemarkContent = results.some(r => { return cleanText(r.备注 || '').length > 0; });
                const regex = keyword ? new RegExp('(' + escapeRegExp(keyword) + ')', 'gi') : null;
                let columns = [
                    { field: 'sheet_row', label: '工作表', className: '' },
                    { field: '产品型号', label: '产品型号', className: '' },
                    { field: '封装方式', label: '封装方式', className: '' },
                    { field: '标底内容', label: '标底内容', className: '' },
                    { field: '信息来源', label: '信息来源', className: '' },
                    { field: 'collector_date', label: '收集人', className: '' }
                ];
                if (hasRemarkContent) { columns.push({ field: '备注', label: '备注', className: 'remark-col' }); }
                let html = '<table><thead><tr>';
                columns.forEach(col => { html += `<th class="${col.className}">${col.label}</th>`; });
                html += '</tr></thead><tbody>';
                results.forEach(r => {
                    html += '<tr>';
                    columns.forEach(col => {
                        let val = '';
                        if (col.field === 'sheet_row') {
                            const sheet = cleanText(r.sheet || '');
                            const row = cleanText(r.row_index || '');
                            val = sheet;
                            if (row) val += `<br><span class="sub-text">(${row})</span>`;
                        } else if (col.field === 'collector_date') {
                            const name = cleanText(r.收集人姓名 || '');
                            const date = cleanText(r.登记日期 || '');
                            val = name;
                            if (date) val += `<br><span class="sub-text">(${date})</span>`;
                        } else {
                            val = cleanText(r[col.field] || '');
                            if (regex && val) { val = val.replace(regex, '<span class="highlight-keyword">$1</span>'); }
                        }
                        html += `<td class="${col.className}">${val}</td>`;
                    });
                    html += '</tr>';
                });
                html += '</tbody></table>';
                container.innerHTML = html;
                // 滚动复位
                setTimeout(() => {
                    container.style.overflow = 'hidden';
                    container.offsetHeight;
                    container.style.overflow = 'auto';
                    container.scrollLeft = 0;
                }, 0);
            }
            // ============================================================
            //  搜索请求（对接后端 API）
            // ============================================================
            function testSearch() {
                const q = document.getElementById('testInput').value.trim();
                if (!q) return;
                window.scrollTo(0, 0);
                const testResult = document.getElementById('testResult');
                testResult.innerHTML = '<p>正在搜索...</p>';
                testResult.scrollLeft = 0;
                testResult.scrollTop = 0;
                fetch(`/search/api/search?q=${encodeURIComponent(q)}`)
                    .then(res => res.ok ? res.json() : Promise.reject(res.status))
                    .then(data => { displayResultsAsTable(data, 'testResult', q); })
                    .catch(err => { testResult.innerHTML = `<p style='color:#ff6b6b'>搜索失败：${err}</p>`; });
            }
            // ============================================================
            //  回车触发搜索
            // ============================================================
            document.getElementById('testInput').addEventListener('keypress', e => { if (e.key === 'Enter') testSearch(); });
            // ============================================================
            //  自定义右键菜单 - 仅当选中文字时出现「超级搜索」
            // ============================================================
            const ctxMenu = document.getElementById('customContextMenu');
            const ctxItem = document.getElementById('ctxSuperSearch');
            let currentSelectedText = '';
            document.addEventListener('contextmenu', function (e) {
                const sel = window.getSelection().toString().trim();
                currentSelectedText = sel;
                if (sel) {
                    e.preventDefault();
                    // 防止菜单超出屏幕
                    let x = e.clientX;
                    let y = e.clientY;
                    const winW = window.innerWidth;
                    const winH = window.innerHeight;
                    const menuW = 160;
                    const menuH = 50;
                    if (x + menuW > winW) x = winW - menuW - 10;
                    if (y + menuH > winH) y = winH - menuH - 10;
                    ctxMenu.style.left = x + 'px';
                    ctxMenu.style.top = y + 'px';
                    ctxMenu.style.display = 'block';
                } else { ctxMenu.style.display = 'none'; }
            });
            ctxItem.addEventListener('click', function () {
                if (currentSelectedText) {
                    document.getElementById('testInput').value = currentSelectedText;
                    testSearch();
                }
                ctxMenu.style.display = 'none';
            });
            document.addEventListener('click', function () { ctxMenu.style.display = 'none'; });
            // ============================================================
            //  可选：通过 URL 参数 ?theme=light 切换浅色主题
            // ============================================================
            (function initTheme() {
                const params = new URLSearchParams(window.location.search);
                const theme = params.get('theme');
                if (theme === 'light') { document.body.classList.add('light-theme'); }
                // 默认就是深色主题（无类名）
            })();
            // 暴露给控制台，方便调试
            window.testSearch = testSearch;
            console.log('🔍 超级搜索助手已加载 (深色主题)');
            console.log('💡 如需切换浅色主题，请在 URL 后添加 ?theme=light');
        </script>
    </body>

</html>
