            /* ---------- 声音模板下拉（右上角；默认男播音） ---------- */
            function initVoiceTemplates() {
                VOICE_TEMPLATES.forEach((t) => {
                    const opt = document.createElement("option");
                    opt.value = t.id;
                    opt.textContent = t.label;
                    voiceSelect.appendChild(opt);
                });
                const defId = NARRATION_DATA.defaultTemplate || "male";
                const tpl = VOICE_TEMPLATES.find((t) => t.id === defId) || VOICE_TEMPLATES[0];
                state.template = tpl;
                voiceSelect.value = tpl.id;
            }

            /* 切换后停止当前朗读，下次触发按新模板发声 */
            voiceSelect.addEventListener("change", () => {
                state.template = VOICE_TEMPLATES.find((t) => t.id === voiceSelect.value) || VOICE_TEMPLATES[0];
                pickVoice();
                stopSpeech();
            });

            /* ---------- 自动巡讲翻页（V0.1.0，V0.5.0 强化） ----------
             * 点击后：自动勾选语音说明 → 从当前页第一个触点开始依次展示弹窗并朗读；
             * 当前触点解说完毕 2 秒后进入下一个触点；
             * 【关键】当前页**最后一段语音确实播放完毕**之后，才会翻到下一页
             *   —— 翻页动作只可能由 tourContinue() 里"本段播完"的回调链路进入 tourStep(idx+1)
             *      触发（见 tourStep 的翻页分支）。语音没播完、被取代、引擎报错抢先返回等
             *      情况都不会翻页，避免"上一段还在播就跳到下一页"。
             * 直至全部内容解说完毕或点击"停止翻页"。 */
            const TOUR_GAP = 2000;                     /* 解说完毕到下一触点的间隔（毫秒） */

            function startTour() {
                if (!pageTotal()) return;                /* 内容未显示时不可开启巡讲（V0.4.0：图片条目同样适用） */
                state.autoOn = true;
                btnAuto.classList.add("active");
                btnAuto.textContent = "⏹ 停止巡讲";
                /* 自动选中语音说明 */
                state.voiceOn = true;
                chkVoice.checked = true;
                warnIfNoTts();                           /* V0.2.2：巡讲前先体检一次语音引擎 */
                stopSpeech();
                tourStep(0);                             /* 从当前页第一个触点开始 */
            }

            function stopTour() {
                state.autoOn = false;
                clearTimeout(state.tourTimer);
                btnAuto.classList.remove("active");
                btnAuto.textContent = "▶ 自动巡讲";
                stopSpeech();
                deactivateHotspot();                     /* 收起弹窗与字幕条 */
            }

            /* 巡讲续播回调：本段朗读结束后 2 秒进入下一触点。
             * 该回调只在"本段确实播完"时才被调用（speak / playVoiceFile / speakByEstimate
             * 内部都用 speakSeq 保证被取代或被打断的朗读不会触发它），因此它同时也是
             * "本页最后一段播完才翻页"的保证点。 */
            function tourContinue(el, idx) {
                return () => {
                    if (!state.autoOn) return;
                    state.tourTimer = setTimeout(() => tourStep(idx + 1), TOUR_GAP);
                };
            }

            /* 等待热点层渲染完成（换页后热点层为异步重建） */
            function waitHotspotsReady() {
                return new Promise((resolve) => {
                    let tries = 0;
                    const check = () => {
                        const data = currentPages()[state.pageNum - 1];
                        const expect = (data && data.hotspots) ? data.hotspots.length : 0;
                        if (hotspotLayer.childElementCount >= expect || ++tries > 100) resolve();
                        else setTimeout(check, 100);
                    };
                    check();
                });
            }

            /* 巡讲主流程：解说当前页第 idx 个触点 */
            async function tourStep(idx) {
                if (!state.autoOn) return;
                const total = pageTotal();               /* V0.4.0：各类型条目共用 */
                const pageData = currentPages()[state.pageNum - 1];
                const hotspots = (pageData && pageData.hotspots) ? pageData.hotspots : [];

                if (idx >= hotspots.length) {
                    /* === 本页最后一段已播完 → 翻下一页继续；全部解说完毕则自动停止 ===
                     * 该分支的正常入口只有一个：上一段的"播放结束"回调 → tourContinue → tourStep(idx+1)，
                     * 因此天然满足"只有当前页最后一段语音播放完毕后才能翻页"。
                     * （另两个入口 startTour / 手动翻页 只会传 idx=0，只有在本页没有任何触点时
                     *   才会走到这里，此时确实没有语音需要等待。） */
                    if (state.pageNum >= total) { stopTour(); return; }
                    diag("第 " + state.pageNum + " 页最后一段解说已播完 → 翻到下一页");
                    showPage(state.pageNum + 1);
                    await waitHotspotsReady();
                    if (!state.autoOn) return;
                    tourStep(0);
                    return;
                }

                /* 热点层.children 顺序与 narration_data.js 中 hotspots 数组顺序一致 */
                const el = hotspotLayer.children[idx];
                const hs = hotspots[idx];
                if (!el) { tourStep(idx + 1); return; }   /* 兜底：触点缺失则跳过 */
                activateHotspot(el, hs, tourContinue(el, idx));
            }

            btnAuto.addEventListener("click", () => { state.autoOn ? stopTour() : startTour(); });

            /* ============================================================
             * 启动
             * ============================================================ */
            initVoiceTemplates();                 /* 先建声音模板下拉并选中默认（男播音） */
            /* V0.5.0：默认开启「语音说明」（数据文件里把 defaultVoiceOn 设为 false 可改为默认关闭）。
             * 直接赋值 checked 不会触发 change，因此这里同步 state，避免状态不一致。 */
            state.voiceOn = NARRATION_DATA.defaultVoiceOn !== false;
            chkVoice.checked = state.voiceOn;
            /* 【V1.1.0】「在线语音」默认勾选（HTML checked 属性）→ 默认使用网站提供的语音文件
             * （file/voice/）；按 chkVoice / chkOnline 的默认状态刷新显示与可用性、同步发声模式。 */
            state.onlineVoice = !!(chkOnline && chkOnline.checked);
            state.voiceMode = state.onlineVoice ? "file" : "tts";
            refreshVoiceUI();
            setControlsEnabled(false);            /* 内容显示出来之前，按钮与复选框不可用 */
            buildCascadeSelects();                /* 【V1.2.0】先建两级筛选下拉（联动设定在 narration_data.js） */
            loadPdf(buildPdfSelect());            /* 再建文件下拉并加载默认条目第 1 页 */

        </script>

    </body>

</html>
