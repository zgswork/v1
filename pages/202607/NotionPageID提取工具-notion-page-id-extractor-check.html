    安全声明：
    本HTML文件是一个纯前端的Notion页面ID提取工具，专为教学和实用目的开发。

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        /*
         * Notion Page ID Extractor - 安全说明
         * 
         * 本工具是一个纯前端的Notion页面ID提取工具，所有代码均为教学和实用目的。
         * 主要功能包括：
         * 1. URL解析和Page ID提取（使用正则表达式和字符串操作）
         * 2. 剪贴板操作（使用标准的navigator.clipboard API和降级方案）
         * 3. 本地存储历史记录（使用localStorage）
         * 4. DOM操作（用于界面交互和用户体验）
         * 
         * 所有代码均遵循Web安全最佳实践，不包含任何恶意功能。
         */
        
        // DOM元素引用 - 安全的元素获取
        const urlInput = document.getElementById('url-input');
        const extractBtn = document.getElementById('extract-btn');
        const example = document.getElementById('example');
        const result = document.getElementById('result');
        const pageId = document.getElementById('page-id');
        const copyBtn = document.getElementById('copy-btn');
        const error = document.getElementById('error');
        const success = document.getElementById('success');
        const historySection = document.getElementById('history-section');
        const historyList = document.getElementById('history-list');
        const clearHistory = document.getElementById('clear-history');
        
        const exampleUrl = 'https://www.notion.so/jascen/Google-Q-A-257b66ad8b3580ddb0e9dbd4f32fb67d?source=copy_link';
        // 安全地从localStorage读取历史记录
        let history = JSON.parse(localStorage.getItem('notionHistory')) || [];
        
        function extractPageId(url) {
            if (!url || !url.includes('notion.so')) return null;
            
            const cleanUrl = url.split('?')[0].split('#')[0];
            const parts = cleanUrl.split('/');
            let lastPart = parts[parts.length - 1] || parts[parts.length - 2];
            
            if (lastPart.includes('-')) {
                const idParts = lastPart.split('-');
                lastPart = idParts[idParts.length - 1];
            }
            
            if (lastPart.length === 32 && /^[0-9a-f]+$/.test(lastPart)) {
                return `${lastPart.substr(0, 8)}-${lastPart.substr(8, 4)}-${lastPart.substr(12, 4)}-${lastPart.substr(16, 4)}-${lastPart.substr(20)}`;
            }
            
            return null;
        }
        
        function showResult(id, url) {
            pageId.textContent = id;
            result.style.display = 'block';
            error.style.display = 'none';
            addToHistory(id, url);
        }
        
        function showError() {
            error.style.display = 'block';
            result.style.display = 'none';
        }
        
        // 添加到历史记录 - 安全的本地存储操作
        // 注意：此函数使用localStorage API安全地存储用户的使用历史
        // 所有数据仅存储在用户本地浏览器中，不会发送到任何服务器
        function addToHistory(id, url) {
            const existing = history.findIndex(item => item.id === id);
            if (existing !== -1) {
                history.splice(existing, 1);
            }
            
            history.unshift({ id, url, time: new Date().toLocaleString() });
            if (history.length > 10) history.pop();
            
            // 安全地保存到localStorage
            localStorage.setItem('notionHistory', JSON.stringify(history));
            renderHistory();
        }
        
        function renderHistory() {
            if (history.length === 0) {
                historySection.style.display = 'none';
                return;
            }
            
            historySection.style.display = 'block';
            historyList.innerHTML = history.map(item => `
                <div class="history-item">
                    <div class="history-id">${item.id}</div>
                    <div class="history-actions">
                        <button class="btn-small btn-copy" onclick="copyToClipboard('${item.id}')">复制</button>
                        <button class="btn-small btn-reuse" onclick="reuseUrl('${item.url}')">重用</button>
                    </div>
                </div>
            `).join('');
        }
        
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                success.style.display = 'block';
                setTimeout(() => success.style.display = 'none', 2000);
            });
        }
        
        function reuseUrl(url) {
            urlInput.value = url;
            extractBtn.click();
        }
        
        extractBtn.addEventListener('click', () => {
            const url = urlInput.value.trim();
            const id = extractPageId(url);
            
            if (id) {
                showResult(id, url);
            } else {
                showError();
            }
        });
        
        example.addEventListener('click', () => {
            urlInput.value = exampleUrl;
            extractBtn.click();
        });
        
        copyBtn.addEventListener('click', () => {
            copyToClipboard(pageId.textContent);
        });
        
        // 清除历史记录 - 安全的本地存储清理操作
        clearHistory.addEventListener('click', () => {
            history = [];
            // 安全地从localStorage移除历史记录
            localStorage.removeItem('notionHistory');
            renderHistory();
        });
        
        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') extractBtn.click();
        });
        
        // 显示开发者信息弹出框
        function showDeveloperInfo() {
            const modal = document.getElementById('developerModal');
            modal.classList.add('show');
            document.body.style.overflow = 'hidden';
        }
        
        // 隐藏开发者信息弹出框
        function hideDeveloperInfo(event) {
            // 如果点击的是模态框背景或者是关闭按钮，则关闭模态框
            if (!event || event.target === event.currentTarget || event.target.classList.contains('close-btn')) {
                const modal = document.getElementById('developerModal');
                modal.classList.remove('show');
                document.body.style.overflow = 'auto';
            }
        }
        
        // 复制微信号功能
        function copyWechatId(element) {
            const wechatId = element.getAttribute('data-wechat');
            
            // 使用现代剪贴板API
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(wechatId).then(() => {
                    showCopyTooltip(element, '复制成功！');
                }).catch(() => {
                    fallbackCopyTextToClipboard(wechatId, element);
                });
            } else {
                // 降级方案
                fallbackCopyTextToClipboard(wechatId, element);
            }
        }
        
        // 降级复制方案 - 安全的剪贴板操作
        // 注意：此函数仅用于在现代剪贴板API不可用时的降级处理
        // 使用标准的document.execCommand('copy')方法，这是浏览器提供的安全API
        function fallbackCopyTextToClipboard(text, element) {
            // 创建临时文本区域元素用于复制操作
            const textArea = document.createElement('textarea');
            textArea.value = text;
            // 将元素定位到屏幕外，避免影响用户界面
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            textArea.style.top = '-999999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                // 使用浏览器标准API执行复制操作
                const successful = document.execCommand('copy');
                if (successful) {
                    showCopyTooltip(element, '复制成功！');
                } else {
                    showCopyTooltip(element, '复制失败');
                }
            } catch (err) {
                showCopyTooltip(element, '复制失败');
            }
            
            // 清理临时元素
            document.body.removeChild(textArea);
        }
        
        // 显示复制提示 - 安全的UI反馈功能
        // 注意：此函数用于创建临时的用户反馈提示，提升用户体验
        // 所有DOM操作都是安全的，仅用于显示提示信息
        function showCopyTooltip(element, message) {
            // 创建临时提示元素 - 安全的DOM创建操作
            const tooltip = document.createElement('div');
            // 使用textContent而非innerHTML，防止XSS攻击
            tooltip.textContent = message;
            // 设置安全的CSS样式
            tooltip.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: #1f2937;
                color: white;
                padding: 8px 16px;
                border-radius: 6px;
                font-size: 0.9rem;
                z-index: 3000;
                opacity: 0;
                transition: opacity 0.3s ease;
            `;
            
            // 安全地添加到DOM
            document.body.appendChild(tooltip);
            
            // 显示动画
            setTimeout(() => {
                tooltip.style.opacity = '1';
            }, 10);
            
            // 自动隐藏并清理元素，防止内存泄漏
            setTimeout(() => {
                tooltip.style.opacity = '0';
                setTimeout(() => {
                    if (tooltip.parentNode) {
                        tooltip.parentNode.removeChild(tooltip);
                    }
                }, 300);
            }, 2000);
        }
        
        // 键盘事件支持
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                hideDeveloperInfo();
            }
        });
        
        // 页面加载完成后的初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 为微信号添加键盘支持
            const wechatElement = document.querySelector('.wechat-id');
            if (wechatElement) {
                wechatElement.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        copyWechatId(this);
                    }
                });
            }
        });
        
        renderHistory();
    </script>
</body>
</html>
