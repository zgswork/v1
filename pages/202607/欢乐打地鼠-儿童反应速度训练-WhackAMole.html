<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>欢乐打地鼠 - 儿童反应速度训练</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Marker Felt', 'Chalkboard SE', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6ecbf5 0%, #c2e9fb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }
        
        .game-container {
            width: 100%;
            max-width: 500px;
            background-color: #fff9e6;
            border-radius: 25px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            padding: 20px;
            text-align: center;
            border: 8px solid #ff9a8b;
            position: relative;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(90deg, #ff9a8b 0%, #ff6a88 100%);
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 20px;
            color: white;
            position: relative;
            box-shadow: 0 5px 15px rgba(255, 105, 135, 0.3);
        }
        
        h1 {
            font-size: 2.2rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            margin-bottom: 5px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #e8f4fc;
            padding: 12px 20px;
            border-radius: 50px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
        }
        
        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ff6a88;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #5a7d9a;
        }
        
        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .hole {
            background: #8b4513;
            border-radius: 50%;
            height: 110px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 8px 15px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: transform 0.1s;
        }
        
        .hole:after {
            content: '';
            position: absolute;
            width: 100%;
            height: 30px;
            background: #5d2906;
            border-radius: 50%;
            bottom: -15px;
        }
        
        .mole {
            width: 80px;
            height: 80px;
            background: #ff6a88;
            border-radius: 50%;
            position: absolute;
            bottom: -80px;
            transition: bottom 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 2rem;
        }
        
        .mole.visible {
            bottom: 10px;
        }
        
        .mole.hit {
            background: #ff3d6d;
            transform: scale(0.9);
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(90deg, #ff9a8b 0%, #ff6a88 100%);
            color: white;
        }
        
        .btn-secondary {
            background: #4facfe;
            color: white;
        }
        
        .btn:active {
            transform: scale(0.95);
        }
        
        .difficulty-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .difficulty-btn {
            padding: 10px 20px;
            border-radius: 30px;
            background: #e0e0e0;
            border: 2px solid transparent;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .difficulty-btn.active {
            background: #ffd166;
            border-color: #ff9a8b;
            box-shadow: 0 0 10px rgba(255, 154, 139, 0.5);
        }
        
        .achievements {
            background: #e8f4fc;
            border-radius: 20px;
            padding: 15px;
            margin-top: 20px;
        }
        
        .achievements h3 {
            color: #5a7d9a;
            margin-bottom: 12px;
        }
        
        .badges {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        
        .badge {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #ffd166;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            position: relative;
            opacity: 0.3;
        }
        
        .badge.unlocked {
            opacity: 1;
            transform: scale(1.1);
            box-shadow: 0 0 15px gold;
        }
        
        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            z-index: 10;
            color: white;
            padding: 20px;
            text-align: center;
            display: none;
        }
        
        .game-over h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #ffd166;
        }
        
        .final-score {
            font-size: 3rem;
            font-weight: bold;
            margin: 20px 0;
            color: #ff6a88;
        }
        
        .rest-time {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            z-index: 5;
            font-size: 2.5rem;
            font-weight: bold;
            color: #ff6a88;
            display: none;
        }
        
        .hit-effect {
            position: absolute;
            font-size: 2.5rem;
            color: gold;
            font-weight: bold;
            animation: floatUp 1s forwards;
            pointer-events: none;
            z-index: 2;
        }
        
        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-50px); opacity: 0; }
        }
        
        .vibrate {
            animation: vibrate 0.3s linear;
        }
        
        @keyframes vibrate {
            0% { transform: translateX(0); }
            20% { transform: translateX(-5px); }
            40% { transform: translateX(5px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
            100% { transform: translateX(0); }
        }
        
        @media (max-width: 500px) {
            .game-container {
                padding: 15px;
            }
            
            .hole {
                height: 90px;
            }
            
            .mole {
                width: 65px;
                height: 65px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .stat-value {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>欢乐打地鼠</h1>
            <div class="subtitle">反应速度训练营 - 儿童版</div>
        </div>
        
        <div class="stats-bar">
            <div class="stat">
                <div class="stat-value" id="timer">60</div>
                <div class="stat-label">剩余时间</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="score">0</div>
                <div class="stat-label">当前得分</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="high-score">0</div>
                <div class="stat-label">最高分</div>
            </div>
        </div>
        
        <div class="difficulty-selector">
            <div class="difficulty-btn active" data-level="easy">初级</div>
            <div class="difficulty-btn" data-level="medium">中级</div>
            <div class="difficulty-btn" data-level="hard">高级</div>
        </div>
        
        <div class="game-board" id="game-board">
            <!-- 9个洞将由JS生成 -->
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="start-btn">
                <i class="fas fa-play"></i> 开始游戏
            </button>
            <button class="btn btn-secondary" id="sound-btn">
                <i class="fas fa-volume-up"></i> 音效
            </button>
        </div>
        
        <div class="achievements">
            <h3>成就徽章</h3>
            <div class="badges">
                <div class="badge" id="badge1">🥉</div>
                <div class="badge" id="badge2">🥈</div>
                <div class="badge" id="badge3">🥇</div>
            </div>
        </div>
        
        <div class="rest-time" id="rest-time">
            <div>休息一下！</div>
            <div>让眼睛休息20秒</div>
        </div>
        
        <div class="game-over" id="game-over">
            <h2>游戏结束！</h2>
            <div>你的最终得分是：</div>
            <div class="final-score" id="final-score">0</div>
            <button class="btn btn-primary" id="restart-btn">
                <i class="fas fa-redo"></i> 再玩一次
            </button>
        </div>
    </div>

    <audio id="hit-sound" src="https://assets.mixkit.co/sfx/preview/mixkit-unlock-game-notification-253.mp3"></audio>
    <audio id="miss-sound" src="https://assets.mixkit.co/sfx/preview/mixkit-game-show-wrong-answer-buzz-950.mp3"></audio>
    <audio id="bg-music" loop src="https://assets.mixkit.co/music/preview/mixkit-game-show-suspense-waiting-667.mp3"></audio>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 游戏元素
            const gameBoard = document.getElementById('game-board');
            const timerDisplay = document.getElementById('timer');
            const scoreDisplay = document.getElementById('score');
            const highScoreDisplay = document.getElementById('high-score');
            const startBtn = document.getElementById('start-btn');
            const soundBtn = document.getElementById('sound-btn');
            const restartBtn = document.getElementById('restart-btn');
            const gameOverScreen = document.getElementById('game-over');
            const finalScoreDisplay = document.getElementById('final-score');
            const restTimeScreen = document.getElementById('rest-time');
            const difficultyButtons = document.querySelectorAll('.difficulty-btn');
            
            // 音效元素
            const hitSound = document.getElementById('hit-sound');
            const missSound = document.getElementById('miss-sound');
            const bgMusic = document.getElementById('bg-music');
            
            // 游戏状态
            let gameActive = false;
            let timer;
            let gameTimer;
            let score = 0;
            let timeLeft = 60;
            let highScore = localStorage.getItem('moleHighScore') || 0;
            let soundOn = true;
            let difficulty = 'easy';
            let restTimer;
            let lastPlayTime = 0;
            let gameStartTime = 0;
            
            // 难度设置
            const difficultySettings = {
                easy: { showTime: 1200, interval: 1000 },
                medium: { showTime: 800, interval: 700 },
                hard: { showTime: 500, interval: 400 }
            };
            
            // 成就设置
            const achievements = {
                badge1: 30,
                badge2: 60,
                badge3: 90
            };
            
            // 初始化游戏
            function initGame() {
                // 创建9个洞
                gameBoard.innerHTML = '';
                for (let i = 0; i < 9; i++) {
                    const hole = document.createElement('div');
                    hole.className = 'hole';
                    hole.innerHTML = '<div class="mole"></div>';
                    hole.addEventListener('click', hitMole);
                    gameBoard.appendChild(hole);
                }
                
                // 显示最高分
                highScoreDisplay.textContent = highScore;
                
                // 更新成就徽章
                updateBadges();
            }
            
            // 开始游戏
            function startGame() {
                if (gameActive) return;
                
                gameActive = true;
                score = 0;
                timeLeft = 60;
                scoreDisplay.textContent = score;
                timerDisplay.textContent = timeLeft;
                gameStartTime = Date.now();
                lastPlayTime = gameStartTime;
                
                // 隐藏游戏结束界面
                gameOverScreen.style.display = 'none';
                
                // 播放背景音乐
                if (soundOn) {
                    bgMusic.currentTime = 0;
                    bgMusic.play().catch(e => console.log("音频播放被阻止:", e));
                }
                
                // 更新按钮状态
                startBtn.innerHTML = '<i class="fas fa-pause"></i> 暂停游戏';
                
                // 开始计时器
                timer = setInterval(() => {
                    timeLeft--;
                    timerDisplay.textContent = timeLeft;
                    
                    if (timeLeft <= 0) {
                        endGame();
                    }
                    
                    // 每15分钟提醒休息
                    const playDuration = (Date.now() - gameStartTime) / 1000;
                    if (playDuration > 15 * 60 && playDuration % (15 * 60) < 1) {
                        showRestScreen();
                    }
                }, 1000);
                
                // 开始地鼠出现
                startMoles();
            }
            
            // 暂停游戏
            function pauseGame() {
                if (!gameActive) return;
                
                gameActive = false;
                clearInterval(timer);
                clearInterval(gameTimer);
                
                // 暂停背景音乐
                bgMusic.pause();
                
                // 更新按钮状态
                startBtn.innerHTML = '<i class="fas fa-play"></i> 继续游戏';
            }
            
            // 开始地鼠出现
            function startMoles() {
                const settings = difficultySettings[difficulty];
                
                gameTimer = setInterval(() => {
                    if (!gameActive) return;
                    
                    // 随机选择一个洞
                    const holes = document.querySelectorAll('.hole');
                    const randomIndex = Math.floor(Math.random() * holes.length);
                    const selectedHole = holes[randomIndex];
                    const mole = selectedHole.querySelector('.mole');
                    
                    // 显示地鼠
                    mole.classList.add('visible');
                    
                    // 设置地鼠消失时间
                    setTimeout(() => {
                        if (mole.classList.contains('visible') && !mole.classList.contains('hit')) {
                            mole.classList.remove('visible');
                            mole.classList.add('missed');
                            
                            // 播放错过音效
                            if (soundOn) {
                                missSound.currentTime = 0;
                                missSound.play().catch(e => console.log("音频播放被阻止:", e));
                            }
                            
                            // 震动效果
                            selectedHole.classList.add('vibrate');
                            setTimeout(() => {
                                selectedHole.classList.remove('vibrate');
                            }, 300);
                            
                            setTimeout(() => {
                                mole.classList.remove('missed');
                            }, 500);
                        }
                    }, settings.showTime);
                }, settings.interval);
            }
            
            // 打中地鼠
            function hitMole(e) {
                if (!gameActive) return;
                
                // 防误触机制（300ms冷却）
                const now = Date.now();
                if (now - lastPlayTime < 300) return;
                lastPlayTime = now;
                
                const mole = e.currentTarget.querySelector('.mole');
                
                if (mole.classList.contains('visible') && !mole.classList.contains('hit')) {
                    // 标记为击中
                    mole.classList.add('hit');
                    
                    // 增加分数
                    score++;
                    scoreDisplay.textContent = score;
                    
                    // 显示击中效果
                    showHitEffect(e.currentTarget, '+1');
                    
                    // 播放击中音效
                    if (soundOn) {
                        hitSound.currentTime = 0;
                        hitSound.play().catch(e => console.log("音频播放被阻止:", e));
                    }
                    
                    // 更新最高分
                    if (score > highScore) {
                        highScore = score;
                        highScoreDisplay.textContent = highScore;
                        localStorage.setItem('moleHighScore', highScore);
                    }
                    
                    // 更新成就徽章
                    updateBadges();
                    
                    // 短暂延迟后重置地鼠
                    setTimeout(() => {
                        mole.classList.remove('visible', 'hit');
                    }, 300);
                }
            }
            
            // 显示击中效果
            function showHitEffect(element, text) {
                const rect = element.getBoundingClientRect();
                const effect = document.createElement('div');
                effect.className = 'hit-effect';
                effect.textContent = text;
                effect.style.left = `${rect.left + rect.width/2}px`;
                effect.style.top = `${rect.top}px`;
                document.body.appendChild(effect);
                
                // 动画结束后移除元素
                setTimeout(() => {
                    effect.remove();
                }, 1000);
            }
            
            // 结束游戏
            function endGame() {
                gameActive = false;
                clearInterval(timer);
                clearInterval(gameTimer);
                
                // 停止背景音乐
                bgMusic.pause();
                
                // 显示游戏结束界面
                finalScoreDisplay.textContent = score;
                gameOverScreen.style.display = 'flex';
                
                // 重置按钮状态
                startBtn.innerHTML = '<i class="fas fa-play"></i> 开始游戏';
            }
            
            // 切换音效
            function toggleSound() {
                soundOn = !soundOn;
                if (soundOn) {
                    soundBtn.innerHTML = '<i class="fas fa-volume-up"></i> 音效';
                    if (gameActive) {
                        bgMusic.play().catch(e => console.log("音频播放被阻止:", e));
                    }
                } else {
                    soundBtn.innerHTML = '<i class="fas fa-volume-mute"></i> 音效';
                    bgMusic.pause();
                }
            }
            
            // 更新成就徽章
            function updateBadges() {
                for (let i = 1; i <= 3; i++) {
                    const badge = document.getElementById(`badge${i}`);
                    if (score >= achievements[`badge${i}`]) {
                        badge.classList.add('unlocked');
                    } else {
                        badge.classList.remove('unlocked');
                    }
                }
            }
            
            // 显示休息屏幕
            function showRestScreen() {
                if (!gameActive) return;
                
                pauseGame();
                restTimeScreen.style.display = 'flex';
                
                let restTime = 20;
                restTimeScreen.innerHTML = `<div>休息一下！</div><div>让眼睛休息${restTime}秒</div>`;
                
                restTimer = setInterval(() => {
                    restTime--;
                    restTimeScreen.innerHTML = `<div>休息一下！</div><div>让眼睛休息${restTime}秒</div>`;
                    
                    if (restTime <= 0) {
                        clearInterval(restTimer);
                        restTimeScreen.style.display = 'none';
                        startGame();
                    }
                }, 1000);
            }
            
            // 设置难度
            function setDifficulty(level) {
                difficulty = level;
                difficultyButtons.forEach(btn => {
                    if (btn.dataset.level === level) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
            }
            
            // 事件监听
            startBtn.addEventListener('click', () => {
                if (gameActive) {
                    pauseGame();
                } else {
                    startGame();
                }
            });
            
            soundBtn.addEventListener('click', toggleSound);
            
            restartBtn.addEventListener('click', () => {
                gameOverScreen.style.display = 'none';
                startGame();
            });
            
            difficultyButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    setDifficulty(btn.dataset.level);
                });
            });
            
            // 初始化游戏
            initGame();
            setDifficulty('easy');
        });
    </script>
</body>
</html>
