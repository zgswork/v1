<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SBTI 人格测试</title>
    <style>
        :root {
            --xhs-red: #ff2442;
            --bg-color: #fcfcfc;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-sub: #999999;
            --btn-hover: #e0203a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        #app {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-color);
            position: relative;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            min-height: 100vh;
        }

        /* 页面切换动画 */
        .page {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 100vh;
            padding: 2rem;
            text-align: center;
            animation: fadeIn 0.4s ease-out;
        }
        .page.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 首页样式 */
        .title {
            font-size: 1.8rem;
            font-weight: 800;
            line-height: 1.4;
            margin-bottom: 3rem;
            color: var(--text-main);
        }
        .title span {
            color: var(--xhs-red);
        }

        .btn {
            background-color: var(--xhs-red);
            color: white;
            border: none;
            border-radius: 100px;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 85%;
            max-width: 300px;
            box-shadow: 0 8px 15px rgba(255, 36, 66, 0.2);
            transition: all 0.2s;
            margin-bottom: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
        }
        .btn:active {
            transform: scale(0.96);
            background-color: var(--btn-hover);
        }
        .btn-outline {
            background-color: transparent;
            color: var(--text-sub);
            border: 1px solid #ddd;
            box-shadow: none;
            margin-top: 10px;
        }

        /* 答题页样式 */
        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: #eee;
            border-radius: 3px;
            margin-bottom: 2rem;
            overflow: hidden;
            position: absolute;
            top: 0;
            left: 0;
        }
        .progress-inner {
            height: 100%;
            background-color: var(--xhs-red);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 2rem 1.5rem;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            margin-bottom: 2rem;
        }
        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 2rem;
            line-height: 1.5;
            text-align: left;
        }

        .option-btn {
            background-color: #f8f8f8;
            color: var(--text-main);
            border: 2px solid transparent;
            border-radius: 15px;
            padding: 15px;
            font-size: 1rem;
            width: 100%;
            margin-bottom: 12px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }
        .option-btn:active, .option-btn.selected {
            background-color: #fff0f2;
            border-color: var(--xhs-red);
            color: var(--xhs-red);
            font-weight: 600;
        }

        /* 结果页样式 */
        .result-title { font-size: 1.2rem; margin-bottom: 1rem; color: var(--text-sub); }
        .result-type { font-size: 3rem; font-weight: 900; color: var(--xhs-red); margin-bottom: 1rem; }
        .result-desc { font-size: 1rem; line-height: 1.6; margin-bottom: 1.5rem; padding: 0 1rem; color: var(--text-main);}

        /* 转发引导纯文字样式 */
        .share-prompt-pure {
            margin: 1rem 0 2rem 0;
            width: 100%;
            text-align: center;
        }
        .share-prompt-pure .highlight {
            color: var(--text-main);
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 1.1rem;
        }
        .share-prompt-pure .pure-text {
            font-size: 1rem;
            color: var(--text-sub);
            letter-spacing: 1px;
        }

        /* 副业引导卡片样式 */
        .side-hustle-card {
            background: #fff8f8;
            border: 1px dashed rgba(255, 36, 66, 0.4);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            width: 100%;
            text-align: center;
        }
        .side-hustle-text {
            font-size: 0.95rem;
            color: #555;
            line-height: 1.6;
            margin-bottom: 1.2rem;
            text-align: justify;
        }
        .btn-xingqiu {
            background-color: #ff9900; 
            background: linear-gradient(135deg, #ff5e3a, var(--xhs-red));
            width: 100%;
            max-width: 100%;
            padding: 12px 20px;
            font-size: 1.05rem;
            box-shadow: 0 6px 12px rgba(255, 36, 66, 0.15);
        }
        .wechat-tip {
            font-size: 0.85rem;
            color: #888;
            margin-top: 12px;
            line-height: 1.4;
        }
        .wechat-tip strong {
            color: var(--xhs-red);
            font-weight: 600;
        }

    </style>
</head>
<body>

<div id="app">
    <div id="page-home" class="page active">
        <h1 class="title">MBTI已经过时，<br><span>SBTI来了。</span></h1>
        <button class="btn" onclick="startTest()">开始测试</button>
    </div>

    <div id="page-question" class="page" style="justify-content: flex-start; padding-top: 4rem;">
        <div class="progress-bar"><div class="progress-inner" id="progress"></div></div>
        
        <div class="question-card">
            <p style="color:var(--xhs-red); font-weight:bold; margin-bottom:15px; text-align:left;" id="q-number">1 / 50</p>
            <div class="question-text" id="q-text">题目加载中...</div>
            <div id="options-container">
                </div>
        </div>
    </div>

    <div id="page-result" class="page" style="padding-top: 3rem; justify-content: flex-start;">
        <h2 class="result-title">你的SBTI人格是：</h2>
        <div class="result-type" id="res-type">吗喽</div>
        <p class="result-desc" id="res-desc">天选打工人，每天的早起都是一次违背生物本能的酷刑。嘴上说辞职，身体却诚实地打卡。</p>
        
        <div class="share-prompt-pure">
            <p class="highlight">独疯疯不如众疯疯 🤪</p>
            <p class="pure-text">邀请朋友测一测</p>
        </div>

        <div class="side-hustle-card">
            <p class="side-hustle-text" id="side-hustle-text">文案加载中...</p>
            
            <a href="https://t.zsxq.com/1kmtZ" class="btn btn-xingqiu">点击进入副业搞钱星球</a>
            
            <p class="wechat-tip">💡 提示：加入前可先加微信 <strong>97350510</strong><br>领取 <strong>25元专属立减优惠券</strong> 再上车哦！</p>
        </div>

        <button class="btn btn-outline" onclick="location.reload()">再测一次</button>
    </div>
</div>

<script>
    // 50道赛博发疯测试题
    const questions = [
        { q: "1. 早上闹钟响了，你的第一反应是：", options: ["A. 弹射起步，元气满满", "B. 闭眼重开，在心里把公司炸了"] },
        { q: "2. 挤地铁时不小心被踩了一脚，你会：", options: ["A. 微笑说没关系", "B. 脑内已经上演了甄嬛传级别的复仇大戏"] },
        { q: "3. 老板在群里发了“辛苦了”，你会回复：", options: ["A. 收到，应该的！[玫瑰]", "B. 假装没看见，已读不回是最后的倔强"] },
        { q: "4. 中午点外卖纠结时，你的最终选择通常是：", options: ["A. 尝试新口味，探索美食", "B. 又是那家吃了一百遍的盖饭，懒得挑"] },
        { q: "5. 开会时领导开始画大饼，你的状态是：", options: ["A. 认真做笔记，眼神坚定", "B. 灵魂出窍，开始思考宇宙的尽头"] },
        { q: "6. 下班前一分钟，同事甩来个紧急需求：", options: ["A. 加班搞定，责任心爆棚", "B. 电脑一盖，天王老子来了也明天再说"] },
        { q: "7. 看到朋友圈有人在秀恩爱，你会：", options: ["A. 点赞祝福", "B. 默默计算他们什么时候分手"] },
        { q: "8. 晚上熬夜的主要原因是：", options: ["A. 工作没做完/有正经事", "B. 纯粹想把白天失去的自由补回来"] },
        { q: "9. 休息日最好的度过方式是：", options: ["A. 出去city walk，特种兵打卡", "B. 在床上长蘑菇，与被子焊死"] },
        { q: "10. 如果给你100万，条件是断网一个月：", options: ["A. 绝对不行，没网会死", "B. 请问哪里可以报名？我可以断一年"] },
        { q: "11. 遇到喜欢推卸责任的同事，你会：", options: ["A. 委曲求全，自己默默做完", "B. 收集证据，阴阳怪气地怼回去"] },
        { q: "12. 走在路上看到一只流浪猫冲你叫：", options: ["A. 蹲下来试图摸摸它", "B. 警惕地走开，怕被碰瓷"] },
        { q: "13. 突然停电了，你的感受是：", options: ["A. 焦虑，事情还没做完", "B. 狂喜，终于有合法理由不干活了"] },
        { q: "14. 买衣服时，你更看重：", options: ["A. 紧跟潮流，设计感强", "B. 只要是黑白灰且宽松舒服就行"] },
        { q: "15. 对待减肥的态度是：", options: ["A. 严格控制饮食，坚持运动", "B. 只要我不上秤，我就没胖"] },
        { q: "16. 听音乐时的习惯：", options: ["A. 喜欢听最新最热的打榜歌", "B. 一个歌单循环三年，听到包浆"] },
        { q: "17. 遇到发传单的人：", options: ["A. 礼貌摆手拒绝", "B. 假装打电话，加快脚步逃离"] },
        { q: "18. 被拉进一个不认识的微信群：", options: ["A. 观望一下，看看是干嘛的", "B. 只要没艾特我，直接开启免打扰并折叠"] },
        { q: "19. 面对长辈的催婚/催生：", options: ["A. 耐心解释自己的想法", "B. 左耳进右耳出，主打一个敷衍"] },
        { q: "20. 你认为打工的本质是：", options: ["A. 实现自我价值", "B. 出卖灵魂换取活命的窝囊费"] },
        { q: "21. 去理发店，最怕理发师：", options: ["A. 剪坏我的头发", "B. 疯狂跟我聊天并推销办卡"] },
        { q: "22. 洗澡时最常做的事：", options: ["A. 专心洗澡", "B. 开演唱会或跟假想敌辩论（并取得胜利）"] },
        { q: "23. 看到银行卡余额时：", options: ["A. 规划下个月的理财", "B. 怀疑自己是不是遭遇了电信诈骗，钱去哪了？"] },
        { q: "24. 对于“内卷”，你的态度是：", options: ["A. 不得不加入，害怕被淘汰", "B. 只要我躺得够平，镰刀就割不到我"] },
        { q: "25. 收到很久不联系的同学发来消息：", options: ["A. 热情回复，叙叙旧", "B. 心里一惊：不是借钱就是结婚发请柬"] },
        { q: "26. 坐电梯时只有你和老板两个人：", options: ["A. 抓住机会汇报工作", "B. 盯着楼层数字，祈祷电梯快点到"] },
        { q: "27. 你觉得人生的终极奥义是：", options: ["A. 不断拼搏，攀登高峰", "B. 搞钱，然后退休"] },
        { q: "28. 看到网红店排长队：", options: ["A. 凑个热闹，排队去买", "B. 鄙视一眼，转头去吃隔壁不需要排队的老店"] },
        { q: "29. 每天最开心的时刻：", options: ["A. 攻克了一个工作难题", "B. 脱下鞋子瘫在沙发上的那一秒"] },
        { q: "30. 对你来说，一杯奶茶意味着：", options: ["A. 摄入过量糖分罪恶", "B. 续命的仙丹，枯燥生活的唯一救赎"] },
        { q: "31. 在大街上不小心摔了一跤：", options: ["A. 赶紧看看有没有受伤", "B. 只要没人看见，我就没摔；有人看见，立马装死"] },
        { q: "32. 辅导小孩写作业（或想象这个场景）：", options: ["A. 循循善诱，父慈子孝", "B. 鸡飞狗跳，心梗前兆"] },
        { q: "33. 面对网上的杠精：", options: ["A. 摆事实讲道理，必须说服他", "B. 回复“你说得对”，然后拉黑，不浪费一秒钟"] },
        { q: "34. 你理想的社交距离是：", options: ["A. 亲密无间，大家都是好朋友", "B. 保持退路，随时可以断联隐身"] },
        { q: "35. 看到别人发大段的语音消息：", options: ["A. 耐心听完", "B. 眉头一皱，直接转文字，转不准就算了"] },
        { q: "36. 你的桌面（物理或电脑）状态：", options: ["A. 井井有条，分类清晰", "B. 乱中有序，我知道东西在哪，但别人找不到"] },
        { q: "37. 睡前最后一件事：", options: ["A. 调好闹钟，闭眼睡觉", "B. 再刷5分钟手机（结果刷了2小时）"] },
        { q: "38. 面对突如其来的降温：", options: ["A. 立刻翻出秋裤穿上", "B. 靠一身浩然正气硬抗，绝不妥协"] },
        { q: "39. 你的消费观更偏向：", options: ["A. 精打细算，货比三家", "B. 几十块的运费嫌贵，几千块的东西眼都不眨就买"] },
        { q: "40. 对于未来，你常感到：", options: ["A. 充满希望和干劲", "B. 走一步看一步，活在当下最重要"] },
        { q: "41. 工作中出错被批评时：", options: ["A. 虚心接受，积极改正", "B. 表面疯狂点头，内心疯狂吐槽"] },
        { q: "42. 参加团建活动：", options: ["A. 积极表现，融入集体", "B. 找个角落默默吃东西，祈祷不要被点名"] },
        { q: "43. 你的记性如何：", options: ["A. 过目不忘，细节控", "B. 鱼的记忆，转头就忘"] },
        { q: "44. 面对别人的夸奖：", options: ["A. 大方接受并道谢", "B. 浑身不自在，开始脚趾抠地"] },
        { q: "45. 当你需要做一个重大决定时：", options: ["A. 列出优缺点，理性分析", "B. 抛硬币，或者转发锦鲤求保佑"] },
        { q: "46. 你觉得谈恋爱麻烦吗？", options: ["A. 不麻烦，享受甜蜜", "B. 极度麻烦，不如养只猫/狗"] },
        { q: "47. 去KTV时的状态：", options: ["A. 麦霸，从头唱到尾", "B. 专职摇沙锤和吃果盘的氛围组"] },
        { q: "48. 遇到不顺心的事，最有效的解压方式：", options: ["A. 找人倾诉，大哭一场", "B. 暴饮暴食或疯狂购物"] },
        { q: "49. 你对“早睡早起”的看法：", options: ["A. 极度自律的生活方式，值得提倡", "B. 听说过，没见过，属于都市传说"] },
        { q: "50. 做完这50道题，你现在的心情是：", options: ["A. 意犹未尽，还想再测", "B. 终于点完了，手指头都酸了，赶紧给我结果！"] }
    ];

    // SBTI 抽象人格结果库
    const results = [
        { type: "吗喽", desc: "天选打工人，每天的早起都是一次违背生物本能的酷刑。精通各种打工糊弄学，精神状态极度不稳定，但仍保持着对香蕉（工资）的渴望。" },
        { type: "死者", desc: "由于长期遭受社会的毒打，你的灵魂已经进入了休眠状态。无论外界发生什么，你的内心都毫无波澜，主打一个“随缘、看淡、都可以”。" },
        { type: "愤世者", desc: "在你眼里，“这个世界，就是构石一坨”。你拥有极其敏锐的吐槽雷达，对一切虚伪和套路深恶痛绝，是你朋友圈里的阴阳怪气大师。" },
        { type: "草者", desc: "生命力极其顽强，像野草一样春风吹又生。虽然经常被生活踩在脚下，但只要给点阳光（和八卦），你又能瞬间支棱起来。" },
        { type: "酒鬼", desc: "日咖夜酒，你是靠液体续命的当代神仙。酒精是你对抗焦虑的最佳武器，虽然清醒后问题依然存在，但在微醺的那一刻，你就是世界的王。" }
    ];

    // 随机副业引导文案库
    const hustleCopies = [
        "🔥 主业让人发疯，副业让人回血！与其内耗生气，不如把赛博精神状态拿来搞钱。加入AI私域搞钱圈子，解锁让你真正支棱起来的变现新玩法👇",
        "🔥 测出来的结果很扎心？没关系，兜里有钱什么人格都能治愈。加入我们的副业特训营，把虚拟产品做成实打实的零花钱，用副业收入暴击打工的窝囊气👇",
        "🔥 只有搞钱才是治愈当代人精神状态的唯一解药。加入专属知识星球，一起探索从0到1的商业变现路，不为老板画的饼拼命，只为自己的钱包努力👇"
    ];

    let currentIndex = 0;

    function switchPage(hideId, showId) {
        document.getElementById(hideId).classList.remove('active');
        document.getElementById(showId).classList.add('active');
        window.scrollTo(0, 0); 
    }

    function startTest() {
        currentIndex = 0;
        renderQuestion();
        switchPage('page-home', 'page-question');
    }

    function renderQuestion() {
        const q = questions[currentIndex];
        document.getElementById('q-number').innerText = `${currentIndex + 1} / ${questions.length}`;
        document.getElementById('q-text').innerText = q.q;
        
        const progress = ((currentIndex) / questions.length) * 100;
        document.getElementById('progress').style.width = `${progress}%`;

        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        q.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => handleAnswer(btn);
            container.appendChild(btn);
        });
    }

    function handleAnswer(btn) {
        if(btn.classList.contains('selected')) return;

        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');

        setTimeout(() => {
            currentIndex++;
            if (currentIndex < questions.length) {
                renderQuestion();
            } else {
                showResult();
            }
        }, 250);
    }

    function showResult() {
        document.getElementById('progress').style.width = '100%';
        
        setTimeout(() => {
            const randomResult = results[Math.floor(Math.random() * results.length)];
            document.getElementById('res-type').innerText = randomResult.type;
            document.getElementById('res-desc').innerText = randomResult.desc;
            
            const randomCopy = hustleCopies[Math.floor(Math.random() * hustleCopies.length)];
            document.getElementById('side-hustle-text').innerText = randomCopy;

            switchPage('page-question', 'page-result');
        }, 300);
    }
</script>
