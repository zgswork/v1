<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毛玻璃图片生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .title {
            color: white;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
            margin-bottom: 25px;
            font-weight: 400;
        }

        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 14px;
            padding: 40px 20px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .upload-area:hover {
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.05);
        }

        .upload-area.dragover {
            border-color: #007AFF;
            background: rgba(0, 122, 255, 0.1);
        }

        .upload-icon {
            font-size: 2.5rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 15px;
        }

        .upload-text {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
            margin-bottom: 8px;
        }

        .upload-hint {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
        }

        #fileInput {
            display: none;
        }

        .controls {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 14px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .controls h3 {
            color: white;
            font-size: 1.1rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        .control-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        .control-value {
            color: #007AFF;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #007AFF;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 122, 255, 0.3);
        }

        .slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #007AFF;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px rgba(0, 122, 255, 0.3);
        }

        .slider:hover::-webkit-slider-thumb {
            background: #0056CC;
        }

        .slider:hover::-moz-range-thumb {
            background: #0056CC;
        }

        .btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 25px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .result-container {
            margin-top: 20px;
            display: none;
        }

        .result-image {
            max-width: 100%;
            border-radius: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            margin-bottom: 15px;
        }

        .download-btn {
            background: #007AFF;
            border: none;
            color: white;
            padding: 10px 25px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            background: #0056CC;
            transform: translateY(-2px);
        }

        .loading {
            display: none;
            color: rgba(255, 255, 255, 0.8);
            margin: 15px 0;
        }

        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
            margin: 0 auto 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .container {
                padding: 25px 15px;
            }
            
            .title {
                font-size: 1.8rem;
            }
            
            .upload-area {
                padding: 30px 15px;
            }
            
            .controls {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">毛玻璃图片生成器</h1>
        <p class="subtitle">上传图片，一键生成苹果官网风格的毛玻璃效果</p>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📷</div>
            <div class="upload-text">点击或拖拽图片到此处</div>
            <div class="upload-hint">支持 JPG、PNG、WebP 格式</div>
            <input type="file" id="fileInput" accept="image/*">
        </div>
        
        <button class="btn" onclick="document.getElementById('fileInput').click()">
            选择图片
        </button>
        
        <div class="controls" id="controls" style="display: none;">
            <h3>毛玻璃参数调整</h3>
            
            <div class="control-group">
                <div class="control-label">
                    <span>模糊强度</span>
                    <span class="control-value" id="blurValue">3</span>
                </div>
                <input type="range" class="slider" id="blurSlider" min="1" max="10" value="3" step="1">
            </div>
            
            <div class="control-group">
                <div class="control-label">
                    <span>透明度</span>
                    <span class="control-value" id="opacityValue">0.1</span>
                </div>
                <input type="range" class="slider" id="opacitySlider" min="0" max="0.5" value="0.1" step="0.05">
            </div>
            
            <div class="control-group">
                <div class="control-label">
                    <span>纹理密度</span>
                    <span class="control-value" id="textureValue">1000</span>
                </div>
                <input type="range" class="slider" id="textureSlider" min="0" max="2000" value="1000" step="100">
            </div>
            
            <div class="control-group">
                <div class="control-label">
                    <span>亮度调整</span>
                    <span class="control-value" id="brightnessValue">1.0</span>
                </div>
                <input type="range" class="slider" id="brightnessSlider" min="0.5" max="1.5" value="1.0" step="0.1">
            </div>
            
            <button class="btn" id="applyBtn" style="margin-top: 8px;">
                应用效果
            </button>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>正在生成毛玻璃效果...</div>
        </div>
        
        <div class="result-container" id="resultContainer">
            <img id="resultImage" class="result-image" alt="毛玻璃效果图片">
            <button class="download-btn" id="downloadBtn">下载图片</button>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const loading = document.getElementById('loading');
        const resultContainer = document.getElementById('resultContainer');
        const resultImage = document.getElementById('resultImage');
        const downloadBtn = document.getElementById('downloadBtn');
        const controls = document.getElementById('controls');
        const applyBtn = document.getElementById('applyBtn');

        // 参数控制元素
        const blurSlider = document.getElementById('blurSlider');
        const blurValue = document.getElementById('blurValue');
        const opacitySlider = document.getElementById('opacitySlider');
        const opacityValue = document.getElementById('opacityValue');
        const textureSlider = document.getElementById('textureSlider');
        const textureValue = document.getElementById('textureValue');
        const brightnessSlider = document.getElementById('brightnessSlider');
        const brightnessValue = document.getElementById('brightnessValue');

        // 全局变量
        let originalImageSrc = null;
        let currentParams = {
            blur: 3,
            opacity: 0.1,
            texture: 1000,
            brightness: 1.0
        };

        // 拖拽上传
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        // 点击上传
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        // 参数滑块事件监听
        blurSlider.addEventListener('input', (e) => {
            currentParams.blur = parseInt(e.target.value);
            blurValue.textContent = e.target.value;
        });

        opacitySlider.addEventListener('input', (e) => {
            currentParams.opacity = parseFloat(e.target.value);
            opacityValue.textContent = e.target.value;
        });

        textureSlider.addEventListener('input', (e) => {
            currentParams.texture = parseInt(e.target.value);
            textureValue.textContent = e.target.value;
        });

        brightnessSlider.addEventListener('input', (e) => {
            currentParams.brightness = parseFloat(e.target.value);
            brightnessValue.textContent = e.target.value;
        });

        // 应用效果按钮
        applyBtn.addEventListener('click', () => {
            if (originalImageSrc) {
                createGlassEffect(originalImageSrc);
            }
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('请选择图片文件！');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                originalImageSrc = e.target.result;
                createGlassEffect(e.target.result);
                controls.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        function createGlassEffect(imageSrc) {
            loading.style.display = 'block';
            resultContainer.style.display = 'none';

            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // 设置画布尺寸
                canvas.width = img.width;
                canvas.height = img.height;
                
                // 绘制原图
                ctx.drawImage(img, 0, 0);
                
                // 创建毛玻璃效果
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                
                // 应用毛玻璃模糊效果
                applyGlassEffect(data, canvas.width, canvas.height);
                
                ctx.putImageData(imageData, 0, 0);
                
                // 添加额外的毛玻璃叠加层
                addGlassOverlay(ctx, canvas.width, canvas.height);
                
                // 应用亮度调整
                applyBrightness(ctx, canvas.width, canvas.height);
                
                // 显示结果
                const resultUrl = canvas.toDataURL('image/png');
                resultImage.src = resultUrl;
                
                loading.style.display = 'none';
                resultContainer.style.display = 'block';
                
                // 设置下载功能
                downloadBtn.onclick = () => {
                    const link = document.createElement('a');
                    link.download = 'glass-effect-image.png';
                    link.href = resultUrl;
                    link.click();
                };
            };
            img.src = imageSrc;
        }

        function applyGlassEffect(data, width, height) {
            // 使用当前参数的模糊算法
            const radius = currentParams.blur;
            const tempData = new Uint8ClampedArray(data);
            
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    let r = 0, g = 0, b = 0, a = 0, count = 0;
                    
                    for (let dy = -radius; dy <= radius; dy++) {
                        for (let dx = -radius; dx <= radius; dx++) {
                            const nx = x + dx;
                            const ny = y + dy;
                            
                            if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                                const index = (ny * width + nx) * 4;
                                r += tempData[index];
                                g += tempData[index + 1];
                                b += tempData[index + 2];
                                a += tempData[index + 3];
                                count++;
                            }
                        }
                    }
                    
                    const index = (y * width + x) * 4;
                    data[index] = r / count;
                    data[index + 1] = g / count;
                    data[index + 2] = b / count;
                    data[index + 3] = a / count;
                }
            }
        }

        function addGlassOverlay(ctx, width, height) {
            // 创建半透明的毛玻璃叠加层
            const gradient = ctx.createLinearGradient(0, 0, width, height);
            gradient.addColorStop(0, `rgba(255, 255, 255, ${currentParams.opacity})`);
            gradient.addColorStop(0.5, `rgba(255, 255, 255, ${currentParams.opacity * 0.5})`);
            gradient.addColorStop(1, `rgba(255, 255, 255, ${currentParams.opacity})`);
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
            
            // 添加细微的纹理效果
            if (currentParams.texture > 0) {
                ctx.globalCompositeOperation = 'overlay';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
                for (let i = 0; i < currentParams.texture; i++) {
                    const x = Math.random() * width;
                    const y = Math.random() * height;
                    const size = Math.random() * 2;
                    ctx.fillRect(x, y, size, size);
                }
                ctx.globalCompositeOperation = 'source-over';
            }
        }

        function applyBrightness(ctx, width, height) {
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            
            for (let i = 0; i < data.length; i += 4) {
                data[i] = Math.min(255, data[i] * currentParams.brightness);     // R
                data[i + 1] = Math.min(255, data[i + 1] * currentParams.brightness); // G
                data[i + 2] = Math.min(255, data[i + 2] * currentParams.brightness); // B
            }
            
            ctx.putImageData(imageData, 0, 0);
        }
    </script>
</body>
</html>
