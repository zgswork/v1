<body>
<div class="app">
<h1><span>✦</span> 待办清单</h1>
<div class="cal-nav">
<button id="prevMonth">‹</button>
<span class="title" id="calTitle">2026年 1月</span>
<button id="nextMonth">›</button>
<div class="view-toggle">
<button id="monthViewBtn" class="active">月</button>
<button id="weekViewBtn">周</button>
</div>
</div>
<div class="cal-grid month-view" id="calGrid"></div>
<div class="input-row">
<input id="todoInput" placeholder="添加新待办..." autofocus>
<button id="addBtn">添加</button>
</div>
<div class="filters">
<button class="active" data-filter="all">全部</button>
<button data-filter="star">星标</button>
<button data-filter="done">已完成</button>
<button data-filter="active">未完成</button>
</div>
<ul class="todo-list" id="todoList"></ul>
<div class="footer"><span>© 2026 紫色待办</span><span id="countInfo">0 项</span></div>
</div>
<script>
(function(){'use strict';
let todos=JSON.parse(localStorage.getItem('todos'))||[];
let currentDate=new Date();
let selectedDate=null;
let filter='all';
let viewMode='month';
const todoInput=document.getElementById('todoInput');
const addBtn=document.getElementById('addBtn');
const todoList=document.getElementById('todoList');
const calGrid=document.getElementById('calGrid');
const calTitle=document.getElementById('calTitle');
const prevMonth=document.getElementById('prevMonth');
const nextMonth=document.getElementById('nextMonth');
const monthViewBtn=document.getElementById('monthViewBtn');
const weekViewBtn=document.getElementById('weekViewBtn');
function save(){localStorage.setItem('todos',JSON.stringify(todos));}
function formatDate(d){const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,'0');const day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day;}
function getTodayStr(){return formatDate(new Date());}
function getWeekStart(date){const d=new Date(date);const day=d.getDay();const diff=d.getDate()-day+(day===0?-6:1);d.setDate(diff);return d;}
function getWeekDates(start){const dates=[];for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);dates.push(d);}return dates;}
function renderCalendar(){
const year=currentDate.getFullYear();
const month=currentDate.getMonth();
calTitle.textContent=year+'年 '+(month+1)+'月';
calGrid.className='cal-grid '+(viewMode==='month'?'month-view':'week-view');
let html='<div class="day-name">一</div><div class="day-name">二</div><div class="day-name">三</div><div class="day-name">四</div><div class="day-name">五</div><div class="day-name">六</div><div class="day-name">日</div>';
if(viewMode==='month'){
const firstDay=new Date(year,month,1).getDay();
const startOffset=firstDay===0?6:firstDay-1;
const daysInMonth=new Date(year,month+1,0).getDate();
const prevDays=new Date(year,month,0).getDate();
const todayStr=getTodayStr();
for(let i=0;i<startOffset;i++){
const day=prevDays-startOffset+i+1;
const d=new Date(year,month-1,day);
const dateStr=formatDate(d);
const cls='day other'+(dateStr===todayStr?' today':'')+(selectedDate&&dateStr===formatDate(selectedDate)?' selected':'');
html+='<div class="'+cls+'" data-date="'+dateStr+'">'+day+'</div>';
}
for(let i=1;i<=daysInMonth;i++){
const d=new Date(year,month,i);
const dateStr=formatDate(d);
let cls='day'+(dateStr===todayStr?' today':'')+(selectedDate&&dateStr===formatDate(selectedDate)?' selected':'');
html+='<div class="'+cls+'" data-date="'+dateStr+'">'+i+'</div>';
}
const totalCells=startOffset+daysInMonth;
const remaining=(7-totalCells%7)%7;
for(let i=1;i<=remaining;i++){
const d=new Date(year,month+1,i);
const dateStr=formatDate(d);
const cls='day other'+(dateStr===todayStr?' today':'')+(selectedDate&&dateStr===formatDate(selectedDate)?' selected':'');
html+='<div class="'+cls+'" data-date="'+dateStr+'">'+i+'</div>';
}
}else{
const weekStart=getWeekStart(currentDate);
const weekDates=getWeekDates(weekStart);
const todayStr=getTodayStr();
weekDates.forEach(d=>{
const dateStr=formatDate(d);
let cls='day'+(dateStr===todayStr?' today':'')+(selectedDate&&dateStr===formatDate(selectedDate)?' selected':'');
if(d.getMonth()!==month)cls+=' other';
html+='<div class="'+cls+'" data-date="'+dateStr+'">'+d.getDate()+'</div>';
});
}
calGrid.innerHTML=html;
calGrid.querySelectorAll('.day').forEach(el=>{
el.addEventListener('click',function(){
const dateStr=this.dataset.date;
selectedDate=new Date(dateStr);
renderCalendar();
render();
});
});
}
function getFiltered(){
let list=todos;
if(filter==='star')list=list.filter(t=>t.star);
else if(filter==='done')list=list.filter(t=>t.done);
else if(filter==='active')list=list.filter(t=>!t.done);
if(selectedDate){
const sy=selectedDate.getFullYear();
const sm=selectedDate.getMonth();
const sd=selectedDate.getDate();
list=list.filter(t=>{const d=new Date(t.date);return d.getFullYear()===sy&&d.getMonth()===sm&&d.getDate()===sd;});
}
return list;
}
function render(){
const filtered=getFiltered();
if(filtered.length===0){todoList.innerHTML='<li class="empty">✨ 暂无待办</li>';}
else{
let html='';
filtered.forEach((t,i)=>{
const idx=todos.indexOf(t);
const starCls=t.star?'active':'';
const doneCls=t.done?'checked':'';
const textCls=t.done?'text done':'text';
html+='<li class="todo-item" data-index="'+idx+'"><div class="check '+doneCls+'" data-action="toggle"></div><span class="star '+starCls+'" data-action="star">★</span><span class="'+textCls+'">'+t.text+'</span><button class="del" data-action="del">✕</button></li>';
});
todoList.innerHTML=html;
}
const total=todos.length;
const done=todos.filter(t=>t.done).length;
document.getElementById('countInfo').textContent=total+' 项，已完成 '+done;
}
todoList.addEventListener('click',function(e){
const item=e.target.closest('.todo-item');
if(!item)return;
const idx=parseInt(item.dataset.index);
const action=e.target.dataset.action;
if(action==='toggle'){
todos[idx].done=!todos[idx].done;
save();
render();
}else if(action==='star'){
todos[idx].star=!todos[idx].star;
save();
render();
}else if(action==='del'){
todos.splice(idx,1);
save();
render();
}
});
addBtn.addEventListener('click',function(){
const text=todoInput.value.trim();
if(!text)return;
const date=selectedDate?formatDate(selectedDate):getTodayStr();
todos.push({text:text,done:false,star:false,date:date});
save();
todoInput.value='';
render();
renderCalendar();
});
todoInput.addEventListener('keydown',function(e){if(e.key==='Enter')addBtn.click();});
document.querySelectorAll('.filters button').forEach(btn=>{
btn.addEventListener('click',function(){
document.querySelector('.filters .active').classList.remove('active');
this.classList.add('active');
filter=this.dataset.filter;
render();
});
});
prevMonth.addEventListener('click',function(){
currentDate.setMonth(currentDate.getMonth()-1);
renderCalendar();
});
nextMonth.addEventListener('click',function(){
currentDate.setMonth(currentDate.getMonth()+1);
renderCalendar();
});
monthViewBtn.addEventListener('click',function(){
viewMode='month';
monthViewBtn.classList.add('active');
weekViewBtn.classList.remove('active');
renderCalendar();
});
weekViewBtn.addEventListener('click',function(){
viewMode='week';
weekViewBtn.classList.add('active');
monthViewBtn.classList.remove('active');
renderCalendar();
});
renderCalendar();
render();
})();
</script>
