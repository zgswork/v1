<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专业图片水印工具</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 30px 0;
            margin-bottom: 30px;
        }
        
        header h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        header p {
            font-size: 1.2rem;
            max-width: 700px;
            margin: 0 auto;
            opacity: 0.9;
        }
        
        .main-content {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            margin-bottom: 40px;
        }
        
        .preview-section {
            flex: 1;
            min-width: 300px;
            background: rgba(25, 25, 50, 0.7);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }
        
        .preview-section h2 {
            margin-bottom: 20px;
            color: #ff7e5f;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .image-container {
            width: 100%;
            height: 400px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            border: 2px dashed rgba(255,255,255,0.2);
            margin-bottom: 20px;
        }
        
        .image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        .image-placeholder {
            text-align: center;
            color: rgba(255,255,255,0.6);
        }
        
        .image-placeholder i {
            font-size: 60px;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        
        .upload-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        
        .upload-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 126, 95, 0.4);
        }
        
        .controls-section {
            flex: 1;
            min-width: 300px;
            background: rgba(25, 25, 50, 0.7);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }
        
        .controls-section h2 {
            margin-bottom: 20px;
            color: #ff7e5f;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .control-group {
            margin-bottom: 25px;
        }
        
        .control-group h3 {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #feb47b;
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }
        
        label {
            font-weight: 600;
            font-size: 0.95rem;
        }
        
        input[type="text"], 
        input[type="number"], 
        input[type="color"],
        select {
            padding: 12px 15px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
        }
        
        input[type="range"] {
            width: 100%;
            height: 8px;
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #ff7e5f;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .position-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        
        .position-btn {
            padding: 12px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        
        .position-btn:hover {
            background: rgba(255,126,95,0.2);
        }
        
        .position-btn.active {
            background: #ff7e5f;
            border-color: #ff7e5f;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        
        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(to right, #4facfe, #00f2fe);
            color: white;
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        footer {
            text-align: center;
            padding: 30px 0;
            font-size: 0.9rem;
            opacity: 0.7;
        }
        
        .watermark-preview {
            position: absolute;
            padding: 5px 15px;
            background: rgba(0,0,0,0.5);
            border-radius: 5px;
            pointer-events: none;
            user-select: none;
            transform-origin: center;
        }
        
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            header h1 {
                font-size: 2.2rem;
            }
            
            .image-container {
                height: 300px;
            }
            
            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-water"></i> 专业图片水印工具</h1>
            <p>为您的图片添加自定义水印，保护版权并提升专业形象。支持所有主流图片格式，完全在浏览器中处理，保障您的隐私安全。</p>
        </header>
        
        <div class="main-content">
            <div class="preview-section">
                <h2><i class="fas fa-image"></i> 图片预览</h2>
                <div class="image-container" id="imageContainer">
                    <div class="image-placeholder">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <p>上传图片以添加水印</p>
                    </div>
                </div>
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
                <button class="upload-btn" id="uploadBtn">
                    <i class="fas fa-upload"></i> 选择图片
                </button>
                <div class="action-buttons">
                    <button class="btn btn-primary" id="downloadBtn">
                        <i class="fas fa-download"></i> 下载图片
                    </button>
                    <button class="btn btn-secondary" id="resetBtn">
                        <i class="fas fa-redo"></i> 重置设置
                    </button>
                </div>
            </div>
            
            <div class="controls-section">
                <h2><i class="fas fa-sliders-h"></i> 水印设置</h2>
                
                <div class="control-group">
                    <h3><i class="fas fa-font"></i> 文字设置</h3>
                    <div class="input-group">
                        <label for="watermarkText">水印文字</label>
                        <input type="text" id="watermarkText" value="示例水印" placeholder="输入水印文字">
                    </div>
                    
                    <div class="input-group">
                        <label for="fontSize">字体大小</label>
                        <input type="range" id="fontSize" min="10" max="100" value="30">
                        <span id="fontSizeValue">30px</span>
                    </div>
                    
                    <div class="input-group">
                        <label for="textColor">文字颜色</label>
                        <input type="color" id="textColor" value="#ffffff">
                    </div>
                    
                    <div class="input-group">
                        <label for="opacity">不透明度</label>
                        <input type="range" id="opacity" min="0" max="100" value="70">
                        <span id="opacityValue">70%</span>
                    </div>
                </div>
                
                <div class="control-group">
                    <h3><i class="fas fa-arrows-alt"></i> 位置与旋转</h3>
                    <div class="input-group">
                        <label>水印位置</label>
                        <div class="position-grid">
                            <div class="position-btn active" data-position="top-left">↖</div>
                            <div class="position-btn" data-position="top-center">↑</div>
                            <div class="position-btn" data-position="top-right">↗</div>
                            <div class="position-btn" data-position="center-left">←</div>
                            <div class="position-btn" data-position="center-center">⦿</div>
                            <div class="position-btn" data-position="center-right">→</div>
                            <div class="position-btn" data-position="bottom-left">↙</div>
                            <div class="position-btn" data-position="bottom-center">↓</div>
                            <div class="position-btn" data-position="bottom-right">↘</div>
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label for="rotation">旋转角度</label>
                        <input type="range" id="rotation" min="0" max="360" value="0">
                        <span id="rotationValue">0°</span>
                    </div>
                </div>
                
                <div class="control-group">
                    <h3><i class="fas fa-layer-group"></i> 样式设置</h3>
                    <div class="input-group">
                        <label for="fontFamily">字体</label>
                        <select id="fontFamily">
                            <option value="Arial">Arial</option>
                            <option value="Verdana">Verdana</option>
                            <option value="Tahoma">Tahoma</option>
                            <option value="Georgia">Georgia</option>
                            <option value="Times New Roman">Times New Roman</option>
                            <option value="Courier New">Courier New</option>
                            <option value="Microsoft YaHei" selected>微软雅黑</option>
                            <option value="SimSun">宋体</option>
                        </select>
                    </div>
                    
                    <div class="input-group">
                        <label for="bgColor">背景颜色</label>
                        <input type="color" id="bgColor" value="#000000">
                    </div>
                    
                    <div class="input-group">
                        <label for="bgOpacity">背景不透明度</label>
                        <input type="range" id="bgOpacity" min="0" max="100" value="30">
                        <span id="bgOpacityValue">30%</span>
                    </div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>© 2023 专业图片水印工具 | 所有图片处理均在浏览器中完成，不会上传到任何服务器</p>
        </footer>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const fileInput = document.getElementById('fileInput');
            const uploadBtn = document.getElementById('uploadBtn');
            const imageContainer = document.getElementById('imageContainer');
            const watermarkText = document.getElementById('watermarkText');
            const fontSize = document.getElementById('fontSize');
            const fontSizeValue = document.getElementById('fontSizeValue');
            const textColor = document.getElementById('textColor');
            const opacity = document.getElementById('opacity');
            const opacityValue = document.getElementById('opacityValue');
            const rotation = document.getElementById('rotation');
            const rotationValue = document.getElementById('rotationValue');
            const fontFamily = document.getElementById('fontFamily');
            const bgColor = document.getElementById('bgColor');
            const bgOpacity = document.getElementById('bgOpacity');
            const bgOpacityValue = document.getElementById('bgOpacityValue');
            const downloadBtn = document.getElementById('downloadBtn');
            const resetBtn = document.getElementById('resetBtn');
            const positionBtns = document.querySelectorAll('.position-btn');
            
            // 状态变量
            let currentImage = null;
            let watermarkPosition = 'top-left';
            
            // 事件监听器
            uploadBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', handleImageUpload);
            watermarkText.addEventListener('input', updateWatermark);
            fontSize.addEventListener('input', updateWatermark);
            textColor.addEventListener('input', updateWatermark);
            opacity.addEventListener('input', updateWatermark);
            rotation.addEventListener('input', updateWatermark);
            fontFamily.addEventListener('change', updateWatermark);
            bgColor.addEventListener('input', updateWatermark);
            bgOpacity.addEventListener('input', updateWatermark);
            downloadBtn.addEventListener('click', downloadImage);
            resetBtn.addEventListener('click', resetSettings);
            
            positionBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    positionBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    watermarkPosition = btn.dataset.position;
                    updateWatermark();
                });
            });
            
            // 初始化滑块值显示
            fontSizeValue.textContent = fontSize.value + 'px';
            opacityValue.textContent = opacity.value + '%';
            rotationValue.textContent = rotation.value + '°';
            bgOpacityValue.textContent = bgOpacity.value + '%';
            
            // 更新滑块值显示
            fontSize.addEventListener('input', () => {
                fontSizeValue.textContent = fontSize.value + 'px';
            });
            
            opacity.addEventListener('input', () => {
                opacityValue.textContent = opacity.value + '%';
            });
            
            rotation.addEventListener('input', () => {
                rotationValue.textContent = rotation.value + '°';
            });
            
            bgOpacity.addEventListener('input', () => {
                bgOpacityValue.textContent = bgOpacity.value + '%';
            });
            
            // 处理图片上传
            function handleImageUpload(e) {
                const file = e.target.files[0];
                if (!file || !file.type.match('image.*')) return;
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    // 清除容器
                    imageContainer.innerHTML = '';
                    
                    // 创建图片元素
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        currentImage = img;
                        imageContainer.appendChild(img);
                        updateWatermark();
                    };
                };
                reader.readAsDataURL(file);
            }
            
            // 更新水印
            function updateWatermark() {
                if (!currentImage) return;
                
                // 移除旧的水印预览
                const oldWatermark = document.querySelector('.watermark-preview');
                if (oldWatermark) oldWatermark.remove();
                
                // 创建水印预览
                const watermark = document.createElement('div');
                watermark.className = 'watermark-preview';
                watermark.textContent = watermarkText.value || '示例水印';
                
                // 应用样式
                watermark.style.fontSize = fontSize.value + 'px';
                watermark.style.color = textColor.value;
                watermark.style.fontFamily = fontFamily.value;
                watermark.style.opacity = opacity.value / 100;
                watermark.style.transform = `rotate(${rotation.value}deg)`;
                
                // 添加背景
                const bgOpacityValue = bgOpacity.value / 100;
                const bgColorValue = hexToRgba(bgColor.value, bgOpacityValue);
                watermark.style.backgroundColor = bgColorValue;
                
                // 设置位置
                applyPosition(watermark, watermarkPosition);
                
                imageContainer.appendChild(watermark);
            }
            
            // 应用水印位置
            function applyPosition(element, position) {
                element.style.position = 'absolute';
                element.style.margin = '10px';
                
                switch(position) {
                    case 'top-left':
                        element.style.top = '0';
                        element.style.left = '0';
                        break;
                    case 'top-center':
                        element.style.top = '0';
                        element.style.left = '50%';
                        element.style.transform += ' translateX(-50%)';
                        break;
                    case 'top-right':
                        element.style.top = '0';
                        element.style.right = '0';
                        break;
                    case 'center-left':
                        element.style.top = '50%';
                        element.style.left = '0';
                        element.style.transform += ' translateY(-50%)';
                        break;
                    case 'center-center':
                        element.style.top = '50%';
                        element.style.left = '50%';
                        element.style.transform += ' translate(-50%, -50%)';
                        break;
                    case 'center-right':
                        element.style.top = '50%';
                        element.style.right = '0';
                        element.style.transform += ' translateY(-50%)';
                        break;
                    case 'bottom-left':
                        element.style.bottom = '0';
                        element.style.left = '0';
                        break;
                    case 'bottom-center':
                        element.style.bottom = '0';
                        element.style.left = '50%';
                        element.style.transform += ' translateX(-50%)';
                        break;
                    case 'bottom-right':
                        element.style.bottom = '0';
                        element.style.right = '0';
                        break;
                }
            }
            
            // 下载图片
            function downloadImage() {
                if (!currentImage) {
                    alert('请先上传图片！');
                    return;
                }
                
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // 设置canvas尺寸
                canvas.width = currentImage.naturalWidth;
                canvas.height = currentImage.naturalHeight;
                
                // 绘制原始图片
                ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);
                
                // 准备水印样式
                ctx.font = `${fontSize.value}px ${fontFamily.value}`;
                ctx.fillStyle = textColor.value;
                ctx.globalAlpha = opacity.value / 100;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // 计算水印位置
                const padding = 20;
                let x, y;
                
                switch(watermarkPosition) {
                    case 'top-left':
                        x = padding;
                        y = padding;
                        ctx.textAlign = 'left';
                        ctx.textBaseline = 'top';
                        break;
                    case 'top-center':
                        x = canvas.width / 2;
                        y = padding;
                        ctx.textBaseline = 'top';
                        break;
                    case 'top-right':
                        x = canvas.width - padding;
                        y = padding;
                        ctx.textAlign = 'right';
                        ctx.textBaseline = 'top';
                        break;
                    case 'center-left':
                        x = padding;
                        y = canvas.height / 2;
                        ctx.textAlign = 'left';
                        break;
                    case 'center-center':
                        x = canvas.width / 2;
                        y = canvas.height / 2;
                        break;
                    case 'center-right':
                        x = canvas.width - padding;
                        y = canvas.height / 2;
                        ctx.textAlign = 'right';
                        break;
                    case 'bottom-left':
                        x = padding;
                        y = canvas.height - padding;
                        ctx.textAlign = 'left';
                        ctx.textBaseline = 'bottom';
                        break;
                    case 'bottom-center':
                        x = canvas.width / 2;
                        y = canvas.height - padding;
                        ctx.textBaseline = 'bottom';
                        break;
                    case 'bottom-right':
                        x = canvas.width - padding;
                        y = canvas.height - padding;
                        ctx.textAlign = 'right';
                        ctx.textBaseline = 'bottom';
                        break;
                }
                
                // 绘制水印背景
                if (bgOpacity.value > 0) {
                    const textMetrics = ctx.measureText(watermarkText.value);
                    const textWidth = textMetrics.width;
                    const textHeight = parseInt(fontSize.value) * 1.2;
                    
                    ctx.fillStyle = hexToRgba(bgColor.value, bgOpacity.value / 100);
                    ctx.globalAlpha = 1;
                    
                    // 根据位置调整背景位置
                    let bgX = x;
                    let bgY = y;
                    let bgWidth = textWidth + 20;
                    let bgHeight = textHeight + 10;
                    
                    switch(watermarkPosition) {
                        case 'top-left':
                            bgX = x - 10;
                            bgY = y - 5;
                            break;
                        case 'top-center':
                            bgX = x - textWidth/2 - 10;
                            bgY = y - 5;
                            break;
                        case 'top-right':
                            bgX = x - textWidth - 10;
                            bgY = y - 5;
                            break;
                        case 'center-left':
                            bgX = x - 10;
                            bgY = y - textHeight/2 - 5;
                            break;
                        case 'center-center':
                            bgX = x - textWidth/2 - 10;
                            bgY = y - textHeight/2 - 5;
                            break;
                        case 'center-right':
                            bgX = x - textWidth - 10;
                            bgY = y - textHeight/2 - 5;
                            break;
                        case 'bottom-left':
                            bgX = x - 10;
                            bgY = y - textHeight - 5;
                            break;
                        case 'bottom-center':
                            bgX = x - textWidth/2 - 10;
                            bgY = y - textHeight - 5;
                            break;
                        case 'bottom-right':
                            bgX = x - textWidth - 10;
                            bgY = y - textHeight - 5;
                            break;
                    }
                    
                    ctx.fillRect(bgX, bgY, bgWidth, bgHeight);
                }
                
                // 绘制水印文字
                ctx.fillStyle = textColor.value;
                ctx.globalAlpha = opacity.value / 100;
                
                // 保存当前状态，应用旋转，然后恢复
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(parseInt(rotation.value) * Math.PI / 180);
                ctx.fillText(watermarkText.value || '示例水印', 0, 0);
                ctx.restore();
                
                // 创建下载链接
                const link = document.createElement('a');
                link.download = 'watermarked-image.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }
            
            // 重置设置
            function resetSettings() {
                watermarkText.value = '示例水印';
                fontSize.value = 30;
                fontSizeValue.textContent = '30px';
                textColor.value = '#ffffff';
                opacity.value = 70;
                opacityValue.textContent = '70%';
                rotation.value = 0;
                rotationValue.textContent = '0°';
                fontFamily.value = 'Microsoft YaHei';
                bgColor.value = '#000000';
                bgOpacity.value = 30;
                bgOpacityValue.textContent = '30%';
                
                // 重置位置按钮
                positionBtns.forEach(btn => btn.classList.remove('active'));
                document.querySelector('.position-btn[data-position="top-left"]').classList.add('active');
                watermarkPosition = 'top-left';
                
                updateWatermark();
            }
            
            // 辅助函数：将十六进制颜色转换为RGBA
            function hexToRgba(hex, opacity) {
                hex = hex.replace('#', '');
                const r = parseInt(hex.substring(0, 2), 16);
                const g = parseInt(hex.substring(2, 4), 16);
                const b = parseInt(hex.substring(4, 6), 16);
                
                return `rgba(${r}, ${g}, ${b}, ${opacity})`;
            }
        });
    </script>
</body>
</html>
