<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英语单词探险家 - 儿童英语学习游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Marker Felt', 'Arial Rounded MT Bold', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6ecbf5 0%, #c2e9fb 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 100, 0.2);
            overflow: hidden;
            position: relative;
        }
        
        .header {
            background: linear-gradient(to right, #ff6b6b, #ff8e53);
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
            border-bottom: 5px solid #ffd166;
        }
        
        .title {
            font-size: 2.2rem;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            letter-spacing: 1px;
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .screen {
            padding: 25px;
            min-height: 500px;
            display: none;
        }
        
        .active {
            display: block;
        }
        
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        
        .theme-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 4px solid transparent;
            position: relative;
        }
        
        .theme-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        
        .theme-card.active-theme {
            border-color: #ff9e6d;
        }
        
        .theme-icon {
            height: 120px;
            background-size: cover;
            background-position: center;
        }
        
        .theme-name {
            padding: 15px 10px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: #333;
            background: #f8f9fa;
        }
        
        .progress-bar {
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            margin-top: 5px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: #4cc9f0;
            border-radius: 4px;
            width: 0%;
            transition: width 0.5s ease;
        }
        
        /* Card Flip Styling */
        .card-container {
            perspective: 1000px;
            width: 220px;
            height: 280px;
            margin: 20px auto;
        }
        
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s;
            cursor: pointer;
        }
        
        .card.flipped {
            transform: rotateY(180deg);
        }
        
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .card-front {
            background: linear-gradient(135deg, #72EDF2 0%, #5151E5 100%);
            color: white;
        }
        
        .card-back {
            background: linear-gradient(135deg, #FF9D6C 0%, #BB4E75 100%);
            color: white;
            transform: rotateY(180deg);
        }
        
        .word {
            font-size: 2.8rem;
            font-weight: bold;
            margin: 10px 0;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .meaning {
            font-size: 1.4rem;
            margin: 10px 0;
            text-align: center;
        }
        
        .example {
            font-size: 1.1rem;
            font-style: italic;
            text-align: center;
            margin-top: 15px;
            line-height: 1.4;
        }
        
        .sound-btn {
            background: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 15px;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
            border: none;
        }
        
        .sound-btn i {
            font-size: 1.5rem;
            color: #5151E5;
        }
        
        /* Game Controls */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }
        
        .btn {
            padding: 12px 25px;
            font-size: 1.1rem;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        .btn-primary {
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            color: white;
        }
        
        .btn-secondary {
            background: linear-gradient(to right, #ff9a9e 0%, #fad0c4 100%);
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.25);
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        /* Navigation */
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.9);
            border-top: 2px solid #f1f1f1;
        }
        
        .star-bank {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #FFD700;
        }
        
        .star {
            font-size: 1.8rem;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        
        /* Level Selection */
        .level-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }
        
        .level-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid #e9ecef;
        }
        
        .level-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        
        .level-card.completed {
            border-color: #4cc9f0;
            background: #f0f9ff;
        }
        
        .level-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #6ecbf5;
        }
        
        .level-name {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .level-desc {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 15px;
        }
        
        .medal {
            font-size: 1.5rem;
            color: #FFD700;
            margin-top: 10px;
        }
        
        /* Game Screen */
        .game-container {
            text-align: center;
            padding: 20px;
        }
        
        .game-title {
            font-size: 1.8rem;
            color: #ff6b6b;
            margin-bottom: 20px;
        }
        
        .question {
            font-size: 1.4rem;
            margin-bottom: 30px;
            color: #333;
            min-height: 70px;
        }
        
        .options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .option {
            background: white;
            border: 3px solid #e9ecef;
            border-radius: 15px;
            padding: 15px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .option:hover {
            background: #f8f9fa;
            border-color: #6ecbf5;
        }
        
        .option.correct {
            background: #c8f7c5;
            border-color: #2ecc71;
        }
        
        .option.incorrect {
            background: #ffdede;
            border-color: #e74c3c;
        }
        
        /* Feedback Animation */
        .feedback {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            z-index: 100;
            animation: fadeOut 1.5s forwards;
            text-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
        }
        
        @keyframes fadeOut {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            70% { opacity: 1; transform: translate(-50%, -50%) scale(1.3); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
        }
        
        .correct-feedback {
            color: #2ecc71;
        }
        
        .incorrect-feedback {
            color: #e74c3c;
        }
        
        /* Achievement Screen */
        .achievement-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }
        
        .achievement-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border: 3px solid #e9ecef;
        }
        
        .achievement-card.unlocked {
            border-color: #FFD700;
            background: #fffdf0;
        }
        
        .achievement-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #6ecbf5;
        }
        
        .achievement-icon.unlocked {
            color: #FFD700;
            animation: spin 2s ease;
        }
        
        @keyframes spin {
            0% { transform: rotateY(0) scale(0.5); opacity: 0; }
            100% { transform: rotateY(360deg) scale(1); opacity: 1; }
        }
        
        .achievement-name {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
        
        .achievement-desc {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 15px;
        }
        
        /* Responsive Design */
        @media (max-width: 600px) {
            .theme-grid, .level-container, .options, .achievement-grid {
                grid-template-columns: 1fr;
            }
            
            .card-container {
                width: 200px;
                height: 260px;
            }
            
            .word {
                font-size: 2.2rem;
            }
        }
        
        /* Game Image */
        .game-image {
            max-width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            margin: 0 auto 20px;
            display: block;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">英语单词探险家</h1>
            <div class="subtitle">快乐学单词，轻松记英语！</div>
        </div>
        
        <!-- Navigation Bar -->
        <div class="nav">
            <div class="star-bank">
                <i class="fas fa-star star"></i>
                <span id="star-count">0</span>
            </div>
            <button class="btn btn-secondary" onclick="showScreen('home')">
                <i class="fas fa-home"></i> 主页
            </button>
        </div>
        
        <!-- Home Screen -->
        <div id="home-screen" class="screen active">
            <h2 style="text-align: center; color: #ff6b6b; margin-bottom: 20px;">选择学习主题</h2>
            <div class="theme-grid">
                <div class="theme-card" onclick="selectTheme('animals')">
                    <div class="theme-icon" style="background: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)), url('https://images.unsplash.com/photo-1546182990-dffeafbe841d?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80');"></div>
                    <div class="theme-name">动物世界</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="animals-progress" style="width: 0%"></div>
                    </div>
                </div>
                
                <div class="theme-card" onclick="selectTheme('food')">
                    <div class="theme-icon" style="background: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)), url('https://images.unsplash.com/photo-1490818387583-1baba5e638af?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80');"></div>
                    <div class="theme-name">美食天地</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="food-progress" style="width: 0%"></div>
                    </div>
                </div>
                
                <div class="theme-card" onclick="selectTheme('school')">
                    <div class="theme-icon" style="background: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)), url('https://images.unsplash.com/photo-1523050854058-8df90110c9f1?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80');"></div>
                    <div class="theme-name">学校生活</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="school-progress" style="width: 0%"></div>
                    </div>
                </div>
                
                <div class="theme-card" onclick="selectTheme('family')">
                    <div class="theme-icon" style="background: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)), url('https://images.unsplash.com/photo-1519327232521-1ea2c736d34d?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80');"></div>
                    <div class="theme-name">我的家庭</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="family-progress" style="width: 0%"></div>
                    </div>
                </div>
                
                <div class="theme-card" onclick="selectTheme('colors')">
                    <div class="theme-icon" style="background: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)), url('https://images.unsplash.com/photo-1493246507139-91e8fad9978e?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80');"></div>
                    <div class="theme-name">缤纷色彩</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="colors-progress" style="width: 0%"></div>
                    </div>
                </div>
                
                <div class="theme-card" onclick="selectTheme('actions')">
                    <div class="theme-icon" style="background: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)), url('https://images.unsplash.com/photo-1518611012118-696072aa579a?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80');"></div>
                    <div class="theme-name">动作词汇</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="actions-progress" style="width: 0%"></div>
                    </div>
                </div>
            </div>
            
            <div class="controls" style="margin-top: 40px;">
                <button class="btn btn-primary" onclick="showScreen('achievements')">
                    <i class="fas fa-trophy"></i> 查看成就
                </button>
            </div>
        </div>
        
        <!-- Theme Learning Screen -->
        <div id="theme-screen" class="screen">
            <h2 id="theme-title" style="text-align: center; color: #ff6b6b; margin-bottom: 20px;">动物世界</h2>
            
            <div class="card-container">
                <div class="card" id="word-card">
                    <div class="card-face card-front">
                        <div class="word" id="word-text">Lion</div>
                        <div class="sound-btn" onclick="playSound()">
                            <i class="fas fa-volume-up"></i>
                        </div>
                    </div>
                    <div class="card-face card-back">
                        <div class="meaning" id="word-meaning">狮子</div>
                        <div class="example" id="word-example">The lion has big teeth!</div>
                        <div class="sound-btn" onclick="playSound()">
                            <i class="fas fa-volume-up"></i>
                        </div>
                    </div>
                </div>
            </div>
            
            <p style="text-align: center; margin-top: 15px; color: #666;">点击卡片查看中文意思</p>
            
            <div class="controls">
                <button class="btn btn-secondary" onclick="prevCard()">
                    <i class="fas fa-arrow-left"></i> 上一个
                </button>
                <span id="card-count" style="font-size: 1.2rem; font-weight: bold;">1/8</span>
                <button class="btn btn-secondary" onclick="nextCard()">
                    下一个 <i class="fas fa-arrow-right"></i>
                </button>
            </div>
            
            <div class="controls" style="margin-top: 20px;">
                <button class="btn btn-primary" onclick="showLevels()">
                    <i class="fas fa-play"></i> 开始闯关
                </button>
            </div>
        </div>
        
        <!-- Level Selection Screen -->
        <div id="level-screen" class="screen">
            <h2 id="level-theme-title" style="text-align: center; color: #ff6b6b; margin-bottom: 20px;">动物世界 - 闯关挑战</h2>
            
            <div class="level-container">
                <div class="level-card" id="level-1" onclick="startGame(1)">
                    <div class="level-icon">
                        <i class="fas fa-image"></i>
                    </div>
                    <div class="level-name">看图识词</div>
                    <div class="level-desc">根据图片选择正确的单词</div>
                    <div id="level-1-medal" class="medal">
                        <i class="fas fa-medal"></i>
                    </div>
                </div>
                
                <div class="level-card" id="level-2" onclick="startGame(2)">
                    <div class="level-icon">
                        <i class="fas fa-headphones"></i>
                    </div>
                    <div class="level-name">听音辨词</div>
                    <div class="level-desc">听发音拼出正确的单词</div>
                    <div id="level-2-medal" class="medal">
                        <i class="fas fa-medal"></i>
                    </div>
                </div>
                
                <div class="level-card" id="level-3" onclick="startGame(3)">
                    <div class="level-icon">
                        <i class="fas fa-brain"></i>
                    </div>
                    <div class="level-name">记忆挑战</div>
                    <div class="level-desc">根据中文拼写英文单词</div>
                    <div id="level-3-medal" class="medal">
                        <i class="fas fa-medal"></i>
                    </div>
                </div>
            </div>
            
            <div class="controls" style="margin-top: 30px;">
                <button class="btn btn-secondary" onclick="showScreen('theme')">
                    <i class="fas fa-book"></i> 返回学习
                </button>
            </div>
        </div>
        
        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <div class="game-container">
                <h2 class="game-title" id="game-title">看图识词</h2>
                
                <div class="question" id="game-question">
                    <!-- 图片将在这里动态加载 -->
                </div>
                
                <div class="options" id="game-options">
                    <!-- 选项将在这里动态加载 -->
                </div>
                
                <div id="level-2-game" style="display: none;">
                    <div class="sound-btn" style="margin: 0 auto 30px; width: 70px; height: 70px;" onclick="playSound()">
                        <i class="fas fa-volume-up" style="font-size: 2rem;"></i>
                    </div>
                    <div style="font-size: 1.5rem; margin-bottom: 20px; letter-spacing: 5px;" id="word-blank">_ _ _ _</div>
                </div>
                
                <div id="level-3-game" style="display: none;">
                    <div class="question" style="font-size: 1.8rem; margin-bottom: 30px;" id="chinese-meaning">狮子</div>
                    <div style="font-size: 1.8rem; margin-bottom: 20px; letter-spacing: 5px;" id="word-blank-2">L _ _ _</div>
                </div>
                
                <div class="controls">
                    <button class="btn btn-primary" id="next-btn" style="display: none;" onclick="nextQuestion()">
                        下一题 <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Achievements Screen -->
        <div id="achievements-screen" class="screen">
            <h2 style="text-align: center; color: #ff6b6b; margin-bottom: 20px;">我的成就</h2>
            
            <div class="achievement-grid">
                <div class="achievement-card" id="first-medal">
                    <div class="achievement-icon">
                        <i class="fas fa-medal"></i>
                    </div>
                    <div class="achievement-name">初露锋芒</div>
                    <div class="achievement-desc">完成第一个主题</div>
                </div>
                
                <div class="achievement-card" id="all-levels">
                    <div class="achievement-icon">
                        <i class="fas fa-trophy"></i>
                    </div>
                    <div class="achievement-name">闯关达人</div>
                    <div class="achievement-desc">完成所有关卡</div>
                </div>
                
                <div class="achievement-card" id="star-collector">
                    <div class="achievement-icon">
                        <i class="fas fa-star"></i>
                    </div>
                    <div class="achievement-name">星星收藏家</div>
                    <div class="achievement-desc">收集50颗星星</div>
                </div>
                
                <div class="achievement-card" id="animal-expert">
                    <div class="achievement-icon">
                        <i class="fas fa-paw"></i>
                    </div>
                    <div class="achievement-name">动物专家</div>
                    <div class="achievement-desc">完美完成动物主题</div>
                </div>
                
                <div class="achievement-card" id="food-expert">
                    <div class="achievement-icon">
                        <i class="fas fa-utensils"></i>
                    </div>
                    <div class="achievement-name">美食专家</div>
                    <div class="achievement-desc">完美完成美食主题</div>
                </div>
                
                <div class="achievement-card" id="master">
                    <div class="achievement-icon">
                        <i class="fas fa-crown"></i>
                    </div>
                    <div class="achievement-name">单词大师</div>
                    <div class="achievement-desc">完成所有主题</div>
                </div>
            </div>
            
            <div class="controls" style="margin-top: 30px;">
                <button class="btn btn-primary" onclick="showScreen('home')">
                    <i class="fas fa-arrow-left"></i> 返回主页
                </button>
            </div>
        </div>
    </div>
    
    <div id="feedback" class="feedback" style="display: none;"></div>
    
    <script>
        // Game Data
        const gameData = {
            currentTheme: 'animals',
            currentCard: 0,
            currentLevel: 1,
            stars: 0,
            progress: {
                animals: { cards: 0, level1: false, level2: false, level3: false },
                food: { cards: 0, level1: false, level2: false, level3: false },
                school: { cards: 0, level1: false, level2: false, level3: false },
                family: { cards: 0, level1: false, level2: false, level3: false },
                colors: { cards: 0, level1: false, level2: false, level3: false },
                actions: { cards: 0, level1: false, level2: false, level3: false }
            },
            themes: {
                animals: {
                    name: '动物世界',
                    words: [
                        { word: 'Lion', meaning: '狮子', example: 'The lion has big teeth!', image: 'https://images.unsplash.com/photo-1546182990-dffeafbe841d?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80' },
                        { word: 'Tiger', meaning: '老虎', example: 'The tiger has orange and black stripes.', image: 'https://images.unsplash.com/photo-1550358864-518f202c02ba?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80' },
                        { word: 'Elephant', meaning: '大象', example: 'The elephant has a long trunk.', image: 'https://images.unsplash.com/photo-1557050543-4d5f4e07ef46?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80' },
                        { word: 'Giraffe', meaning: '长颈鹿', example: 'The giraffe has a very long neck.', image: 'https://images.unsplash.com/photo-1590424748468-9a8c1068a154?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80' },
                        { word: 'Monkey', meaning: '猴子', example: 'The monkey likes to eat bananas.', image: 'https://images.unsplash.com/photo-1540573133985-87b6da6d54a9?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80' },
                        { word: 'Zebra', meaning: '斑马', example: 'The zebra has black and white stripes.', image: 'https://images.unsplash.com/photo-1574873346832-76360f9c34a8?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80' },
                        { word: 'Bear', meaning: '熊', example: 'The bear sleeps in a cave.', image: 'https://images.unsplash.com/photo-1530595467537-0b5996c41f2d?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80' },
                        { word: 'Kangaroo', meaning: '袋鼠', example: 'The kangaroo has a pouch for its baby.', image: 'https://images.unsplash.com/photo-1589652045522-488b3bcc0cd0?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80' }
                    ]
                },
                food: {
                    name: '美食天地',
                    words: [
                        { word: 'Apple', meaning: '苹果', example: 'I eat an apple every day.', image: 'https://images.unsplash.com/photo-1568702846914-96b305d2aaeb?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80' },
                        { word: 'Banana', meaning: '香蕉', example: 'Monkeys love bananas.', image: 'https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80' },
                        { word: 'Pizza', meaning: '披萨', example: 'We had pizza for dinner.', image: 'https://images.unsplash.com/photo-1513104890138-7c749659a591?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80' },
                        { word: 'Ice Cream', meaning: '冰淇淋', example: 'Ice cream is cold and sweet.', image: 'https://images.unsplash.com/photo-1497034825429-c343d7c6a68f?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80' },
                        { word: 'Bread', meaning: '面包', example: 'I eat bread for breakfast.', image: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80' },
                        { word: 'Egg', meaning: '鸡蛋', example: 'Chickens lay eggs.', image: 'https://images.unsplash.com/photo-1587620962725-abab7fe55159?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80' },
                        { word: 'Milk', meaning: '牛奶', example: 'I drink milk every morning.', image: 'https://images.unsplash.com/photo-1550583724-b2692b85b150?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80' },
                        { word: 'Rice', meaning: '米饭', example: 'We eat rice with every meal.', image: 'https://images.unsplash.com/photo-1547496502-affa22d38842?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80' }
                    ]
                },
                school: {
                    name: '学校生活',
                    words: [
                        { word: 'Book', meaning: '书', example: 'I read a book every night.', image: 'https://images.unsplash.com/photo-1495446815901-a7297e633e8d?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80' },
                        { word: 'Pencil', meaning: '铅笔', example: 'I write with a pencil.', image: 'https://images.unsplash.com/photo-1583485088034-697b5bc54ccd?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80' },
                        { word: 'Teacher', meaning: '老师', example: 'Our teacher is very kind.', image: 'https://images.unsplash.com/photo-1577896851231-70ef18881754?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80' },
                        { word: 'Student', meaning: '学生', example: 'I am a student.', image: 'https://images.unsplash.com/photo-1523050854058-8df90110c9f1?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80' }
                    ]
                }
            }
        };
        
        // DOM Elements
        const screens = {
            home: document.getElementById('home-screen'),
            theme: document.getElementById('theme-screen'),
            level: document.getElementById('level-screen'),
            game: document.getElementById('game-screen'),
            achievements: document.getElementById('achievements-screen')
        };
        
        // Initialize game
        function initGame() {
            loadProgress();
            updateStarDisplay();
            updateProgressBars();
        }
        
        // Screen navigation
        function showScreen(screenName) {
            // Hide all screens
            for (const screen in screens) {
                screens[screen].classList.remove('active');
            }
            // Show requested screen
            screens[screenName].classList.add('active');
            
            // Additional setup for specific screens
            if (screenName === 'theme') {
                setupThemeScreen();
            } else if (screenName === 'level') {
                setupLevelScreen();
            } else if (screenName === 'game') {
                setupGameScreen();
            }
        }
        
        // Theme selection
        function selectTheme(theme) {
            gameData.currentTheme = theme;
            showScreen('theme');
        }
        
        // Theme screen setup
        function setupThemeScreen() {
            const theme = gameData.themes[gameData.currentTheme];
            document.getElementById('theme-title').textContent = theme.name;
            gameData.currentCard = 0;
            showCard();
        }
        
        // Show current card
        function showCard() {
            const theme = gameData.themes[gameData.currentTheme];
            const wordData = theme.words[gameData.currentCard];
            
            document.getElementById('word-text').textContent = wordData.word;
            document.getElementById('word-meaning').textContent = wordData.meaning;
            document.getElementById('word-example').textContent = wordData.example;
            document.getElementById('card-count').textContent = `${gameData.currentCard + 1}/${theme.words.length}`;
            
            // Reset card flip
            const card = document.getElementById('word-card');
            card.classList.remove('flipped');
        }
        
        // Next card
        function nextCard() {
            const theme = gameData.themes[gameData.currentTheme];
            if (gameData.currentCard < theme.words.length - 1) {
                gameData.currentCard++;
                showCard();
            }
        }
        
        // Previous card
        function prevCard() {
            if (gameData.currentCard > 0) {
                gameData.currentCard--;
                showCard();
            }
        }
        
        // Flip card
        document.getElementById('word-card').addEventListener('click', function() {
            this.classList.toggle('flipped');
        });
        
        // Play sound
        function playSound() {
            const theme = gameData.themes[gameData.currentTheme];
            const wordData = theme.words[gameData.currentCard];
            
            // Using Web Speech API for text-to-speech
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(wordData.word);
                utterance.rate = 0.8; // Slower speed for children
                utterance.pitch = 1.2; // Higher pitch for child-friendly voice
                speechSynthesis.speak(utterance);
            } else {
                alert('您的浏览器不支持语音功能，请使用Chrome或Edge浏览器。');
            }
        }
        
        // Show level selection
        function showLevels() {
            showScreen('level');
        }
        
        // Level screen setup
        function setupLevelScreen() {
            const theme = gameData.themes[gameData.currentTheme];
            document.getElementById('level-theme-title').textContent = `${theme.name} - 闯关挑战`;
            
            // Update level completion indicators
            const progress = gameData.progress[gameData.currentTheme];
            document.getElementById('level-1').classList.toggle('completed', progress.level1);
            document.getElementById('level-2').classList.toggle('completed', progress.level2);
            document.getElementById('level-3').classList.toggle('completed', progress.level3);
            
            document.getElementById('level-1-medal').style.display = progress.level1 ? 'block' : 'none';
            document.getElementById('level-2-medal').style.display = progress.level2 ? 'block' : 'none';
            document.getElementById('level-3-medal').style.display = progress.level3 ? 'block' : 'none';
        }
        
        // Start game level
        function startGame(level) {
            gameData.currentLevel = level;
            showScreen('game');
        }
        
        // Game screen setup
        function setupGameScreen() {
            const level = gameData.currentLevel;
            const theme = gameData.themes[gameData.currentTheme];
            
            // 随机选择一个单词作为当前问题
            const randomIndex = Math.floor(Math.random() * theme.words.length);
            const wordData = theme.words[randomIndex];
            gameData.currentWord = wordData; // 保存当前单词
            
            // Set game title based on level
            const levelTitles = ['', '看图识词', '听音辨词', '记忆挑战'];
            document.getElementById('game-title').textContent = levelTitles[level];
            
            // Hide all game types
            document.getElementById('game-options').style.display = 'none';
            document.getElementById('level-2-game').style.display = 'none';
            document.getElementById('level-3-game').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            
            // Show appropriate game type
            if (level === 1) {
                setupLevel1(wordData);
            } else if (level === 2) {
                setupLevel2(wordData);
            } else if (level === 3) {
                setupLevel3(wordData);
            }
        }
        
        // Setup Level 1: Picture to Word
        function setupLevel1(wordData) {
            const gameOptions = document.getElementById('game-options');
            gameOptions.style.display = 'grid';
            
            const questionDiv = document.getElementById('game-question');
            // 使用当前单词对应的图片
            questionDiv.innerHTML = `<img src="${wordData.image}" alt="${wordData.word}" class="game-image">`;
            
            // Get 4 random words including the correct one
            const options = getRandomOptions(wordData.word, 4);
            
            // Set options text
            gameOptions.innerHTML = ''; // 清除现有选项
            
            options.forEach(option => {
                const optionElement = document.createElement('div');
                optionElement.className = 'option';
                optionElement.textContent = option;
                optionElement.onclick = function() { 
                    checkAnswer(this, wordData.word); 
                };
                gameOptions.appendChild(optionElement);
            });
        }
        
        // Setup Level 2: Sound to Word
        function setupLevel2(wordData) {
            const level2Game = document.getElementById('level-2-game');
            level2Game.style.display = 'block';
            
            // Set blank word
            const blank = '_ '.repeat(wordData.word.length).trim();
            document.getElementById('word-blank').textContent = blank;
            
            // Play the word sound
            setTimeout(() => {
                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(wordData.word);
                    utterance.rate = 0.8;
                    utterance.pitch = 1.2;
                    speechSynthesis.speak(utterance);
                }
            }, 500);
        }
        
        // Setup Level 3: Meaning to Word
        function setupLevel3(wordData) {
            const level3Game = document.getElementById('level-3-game');
            level3Game.style.display = 'block';
            
            // Set meaning
            document.getElementById('chinese-meaning').textContent = wordData.meaning;
            
            // Set blank word with first letter shown
            const blank = wordData.word.split('').map((char, i) => i === 0 ? char : '_').join(' ');
            document.getElementById('word-blank-2').textContent = blank;
        }
        
        // Get random options for multiple choice
        function getRandomOptions(correct, count) {
            const options = [correct];
            const theme = gameData.themes[gameData.currentTheme];
            
            // Add random words until we have enough options
            while (options.length < count) {
                const randomIndex = Math.floor(Math.random() * theme.words.length);
                const randomWord = theme.words[randomIndex].word;
                if (!options.includes(randomWord)) {
                    options.push(randomWord);
                }
            }
            
            // Shuffle options
            return shuffleArray(options);
        }
        
        // Shuffle array
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }
        
        // Check answer
        function checkAnswer(element, correctAnswer) {
            const userAnswer = element.textContent;
            const isCorrect = userAnswer === correctAnswer;
            
            if (isCorrect) {
                element.classList.add('correct');
                showFeedback('✓ 太棒了！', 'correct');
                addStars(2);
                
                // Mark level as completed
                gameData.progress[gameData.currentTheme][`level${gameData.currentLevel}`] = true;
                saveProgress();
                updateProgressBars();
                
                // Show next button
                document.getElementById('next-btn').style.display = 'block';
            } else {
                element.classList.add('incorrect');
                showFeedback('✗ 再试一次！', 'incorrect');
            }
        }
        
        // Show feedback animation
        function showFeedback(text, type) {
            const feedback = document.getElementById('feedback');
            feedback.textContent = text;
            feedback.className = `feedback ${type}-feedback`;
            feedback.style.display = 'block';
            
            setTimeout(() => {
                feedback.style.display = 'none';
            }, 1500);
        }
        
        // Next question
        function nextQuestion() {
            setupGameScreen();
        }
        
        // Add stars to bank
        function addStars(amount) {
            gameData.stars += amount;
            updateStarDisplay();
            saveProgress();
        }
        
        // Update star display
        function updateStarDisplay() {
            document.getElementById('star-count').textContent = gameData.stars;
        }
        
        // Update progress bars
        function updateProgressBars() {
            for (const theme in gameData.progress) {
                const progress = gameData.progress[theme];
                const completedLevels = [progress.level1, progress.level2, progress.level3].filter(Boolean).length;
                const progressPercent = (completedLevels / 3) * 100;
                document.getElementById(`${theme}-progress`).style.width = `${progressPercent}%`;
            }
        }
        
        // Save progress to localStorage
        function saveProgress() {
            localStorage.setItem('wordGameProgress', JSON.stringify(gameData.progress));
            localStorage.setItem('wordGameStars', gameData.stars);
        }
        
        // Load progress from localStorage
        function loadProgress() {
            const savedProgress = localStorage.getItem('wordGameProgress');
            const savedStars = localStorage.getItem('wordGameStars');
            
            if (savedProgress) {
                gameData.progress = JSON.parse(savedProgress);
            }
            
            if (savedStars) {
                gameData.stars = parseInt(savedStars);
            }
        }
        
        // Initialize game when page loads
        window.onload = initGame;
    </script>

</html>
