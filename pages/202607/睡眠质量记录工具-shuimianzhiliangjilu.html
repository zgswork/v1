<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>睡眠质量记录工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366F1',
                        secondary: '#10B981',
                        accent: '#F59E0B',
                        danger: '#EF4444',
                        dark: '#1E293B',
                        light: '#F8FAFC',
                        night: '#0F172A'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .card-shadow {
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            }
            .input-focus {
                @apply focus:ring-2 focus:ring-primary/50 focus:border-primary focus:outline-none;
            }
            .slide-in {
                animation: slideIn 0.3s ease-out forwards;
            }
            .fade-in {
                animation: fadeIn 0.5s ease-out forwards;
            }
            .pulse-gentle {
                animation: pulseGentle 3s infinite;
            }
        }

        @keyframes slideIn {
            from { transform: translateY(10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes pulseGentle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans text-dark min-h-screen flex flex-col">
    <!-- 顶部导航 -->
    <header class="bg-gradient-to-r from-night to-primary py-4 shadow-md">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <i class="fa fa-moon-o text-white text-2xl pulse-gentle"></i>
                    <h1 class="text-xl font-bold text-white">睡眠质量记录工具</h1>
                </div>
                <div class="text-sm text-white/80 flex items-center gap-1">
                    <i class="fa fa-bar-chart"></i>
                    <span>追踪规律，改善睡眠</span>
                </div>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="flex-grow container mx-auto px-4 py-6">
        <!-- 介绍部分 -->
        <section class="mb-8 text-center max-w-2xl mx-auto">
            <p class="text-gray-600">
                记录您的入睡和起床时间，评价睡眠质量，我们将为您分析睡眠规律，助您改善睡眠。
            </p>
        </section>

        <!-- 数据输入区 -->
        <section class="max-w-2xl mx-auto mb-8">
            <div class="bg-white rounded-xl shadow-md p-6 card-shadow">
                <h2 class="text-lg font-semibold mb-4 pb-2 border-b border-gray-100 flex items-center">
                    <i class="fa fa-pencil-square-o text-primary mr-2"></i>
                    记录今日睡眠
                </h2>
                
                <form id="sleep-form" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="sleep-time" class="block text-sm font-medium text-gray-700 mb-1">入睡时间</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                                    <i class="fa fa-bed"></i>
                                </span>
                                <input type="datetime-local" id="sleep-time" 
                                       class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg input-focus"
                                       required>
                            </div>
                        </div>
                        
                        <div>
                            <label for="wake-time" class="block text-sm font-medium text-gray-700 mb-1">起床时间</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                                    <i class="fa fa-sun-o"></i>
                                </span>
                                <input type="datetime-local" id="wake-time" 
                                       class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg input-focus"
                                       required>
                            </div>
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">睡眠感受 (1-5分)</label>
                        <div class="flex items-center justify-between">
                            <div class="flex gap-2">
                                <button type="button" class="quality-rating w-10 h-10 rounded-full border-2 border-gray-300 flex items-center justify-center text-gray-500 hover:border-primary hover:text-primary transition-colors" data-rating="1">1</button>
                                <button type="button" class="quality-rating w-10 h-10 rounded-full border-2 border-gray-300 flex items-center justify-center text-gray-500 hover:border-primary hover:text-primary transition-colors" data-rating="2">2</button>
                                <button type="button" class="quality-rating w-10 h-10 rounded-full border-2 border-gray-300 flex items-center justify-center text-gray-500 hover:border-primary hover:text-primary transition-colors" data-rating="3">3</button>
                                <button type="button" class="quality-rating w-10 h-10 rounded-full border-2 border-gray-300 flex items-center justify-center text-gray-500 hover:border-primary hover:text-primary transition-colors" data-rating="4">4</button>
                                <button type="button" class="quality-rating w-10 h-10 rounded-full border-2 border-gray-300 flex items-center justify-center text-gray-500 hover:border-primary hover:text-primary transition-colors" data-rating="5">5</button>
                            </div>
                            <div class="text-sm text-gray-500">
                                <span>差</span>
                                <span class="mx-4">一般</span>
                                <span>好</span>
                            </div>
                        </div>
                        <input type="hidden" id="quality-rating" required>
                    </div>
                    
                    <div>
                        <label for="notes" class="block text-sm font-medium text-gray-700 mb-1">备注 (可选)</label>
                        <textarea id="notes" rows="2" 
                                  class="w-full px-3 py-2 border border-gray-300 rounded-lg input-focus"
                                  placeholder="记录影响睡眠的因素，如：饮酒、压力大等"></textarea>
                    </div>
                    
                    <button type="submit" class="w-full bg-primary hover:bg-primary/90 text-white font-medium py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2">
                        <i class="fa fa-save"></i>
                        <span>保存睡眠记录</span>
                    </button>
                </form>
            </div>
        </section>
        
        <!-- 数据展示区 -->
        <section class="max-w-4xl mx-auto">
            <!-- 睡眠统计摘要 -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div class="bg-white rounded-xl shadow-md p-5 card-shadow fade-in">
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="font-medium text-gray-600">平均睡眠时长</h3>
                        <i class="fa fa-clock-o text-primary"></i>
                    </div>
                    <p id="avg-sleep-duration" class="text-2xl font-bold">0小时0分</p>
                </div>
                
                <div class="bg-white rounded-xl shadow-md p-5 card-shadow fade-in" style="animation-delay: 0.1s">
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="font-medium text-gray-600">平均睡眠质量</h3>
                        <i class="fa fa-star text-accent"></i>
                    </div>
                    <p id="avg-sleep-quality" class="text-2xl font-bold">0.0 / 5</p>
                </div>
                
                <div class="bg-white rounded-xl shadow-md p-5 card-shadow fade-in" style="animation-delay: 0.2s">
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="font-medium text-gray-600">记录天数</h3>
                        <i class="fa fa-calendar text-secondary"></i>
                    </div>
                    <p id="record-days" class="text-2xl font-bold">0天</p>
                </div>
            </div>
            
            <!-- 趋势图表 -->
            <div class="bg-white rounded-xl shadow-md p-6 card-shadow mb-6">
                <h2 class="text-lg font-semibold mb-4 pb-2 border-b border-gray-100 flex items-center">
                    <i class="fa fa-line-chart text-primary mr-2"></i>
                    睡眠趋势分析
                </h2>
                
                <div class="mb-4">
                    <div class="flex flex-wrap gap-2 mb-4">
                        <button class="chart-tab active px-4 py-1.5 rounded-full text-sm font-medium bg-primary text-white" data-chart="duration">睡眠时长趋势</button>
                        <button class="chart-tab px-4 py-1.5 rounded-full text-sm font-medium bg-gray-100 text-gray-700 hover:bg-gray-200 transition-colors" data-chart="quality">睡眠质量趋势</button>
                    </div>
                    
                    <div class="h-80">
                        <canvas id="sleep-chart"></canvas>
                    </div>
                </div>
            </div>
            
            <!-- 睡眠记录列表 -->
            <div class="bg-white rounded-xl shadow-md p-6 card-shadow">
                <h2 class="text-lg font-semibold mb-4 pb-2 border-b border-gray-100 flex items-center">
                    <i class="fa fa-history text-primary mr-2"></i>
                    睡眠记录历史
                </h2>
                
                <div id="records-empty" class="py-12 text-center text-gray-500">
                    <i class="fa fa-moon-o text-4xl mb-3 opacity-30"></i>
                    <p>还没有睡眠记录，开始记录您的第一晚睡眠吧！</p>
                </div>
                
                <div id="records-list" class="hidden">
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200 text-sm">
                            <thead>
                                <tr>
                                    <th class="px-3 py-3 bg-gray-50 text-left font-medium text-gray-500 rounded-tl-lg">日期</th>
                                    <th class="px-3 py-3 bg-gray-50 text-left font-medium text-gray-500">入睡时间</th>
                                    <th class="px-3 py-3 bg-gray-50 text-left font-medium text-gray-500">起床时间</th>
                                    <th class="px-3 py-3 bg-gray-50 text-left font-medium text-gray-500">睡眠时长</th>
                                    <th class="px-3 py-3 bg-gray-50 text-left font-medium text-gray-500">睡眠质量</th>
                                    <th class="px-3 py-3 bg-gray-50 text-center font-medium text-gray-500 rounded-tr-lg">操作</th>
                                </tr>
                            </thead>
                            <tbody id="records-items" class="divide-y divide-gray-100">
                                <!-- 记录项目将在这里动态生成 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer class="bg-dark text-white/70 py-6 px-4 text-center text-sm mt-12">
        <p class="mb-2">本工具由 邓文涛(AI版) 制作</p>
        <p class="mb-2">微信：707547441</p>
        <p>QQ邮箱：<a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="aa9d9a9d9f9e9d9e9e9beadbdb84c9c5c7">[email&#160;protected]</a></p>
    </footer>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const sleepForm = document.getElementById('sleep-form');
            const sleepTimeInput = document.getElementById('sleep-time');
            const wakeTimeInput = document.getElementById('wake-time');
            const qualityRatingInput = document.getElementById('quality-rating');
            const qualityRatingButtons = document.querySelectorAll('.quality-rating');
            const notesInput = document.getElementById('notes');
            const recordsList = document.getElementById('records-list');
            const recordsEmpty = document.getElementById('records-empty');
            const recordsItems = document.getElementById('records-items');
            const avgSleepDuration = document.getElementById('avg-sleep-duration');
            const avgSleepQuality = document.getElementById('avg-sleep-quality');
            const recordDays = document.getElementById('record-days');
            const chartTabs = document.querySelectorAll('.chart-tab');
            
            // 初始化日期时间选择器，默认值为昨天晚上和今天早上
            const now = new Date();
            const sleepTime = new Date(now);
            sleepTime.setDate(now.getDate() - 1);
            sleepTime.setHours(23, 0, 0, 0);
            
            const wakeTime = new Date(now);
            wakeTime.setHours(7, 0, 0, 0);
            
            // 设置默认值
            sleepTimeInput.value = formatDateTimeForInput(sleepTime);
            wakeTimeInput.value = formatDateTimeForInput(wakeTime);
            
            // 存储睡眠记录的数组
            let sleepRecords = JSON.parse(localStorage.getItem('sleepRecords')) || [];
            
            // 初始化评分按钮
            let selectedRating = null;
            qualityRatingButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const rating = this.getAttribute('data-rating');
                    selectedRating = rating;
                    qualityRatingInput.value = rating;
                    
                    // 更新按钮样式
                    qualityRatingButtons.forEach(btn => {
                        if (btn.getAttribute('data-rating') <= rating) {
                            btn.classList.remove('border-gray-300', 'text-gray-500');
                            btn.classList.add('border-primary', 'bg-primary/10', 'text-primary');
                        } else {
                            btn.classList.remove('border-primary', 'bg-primary/10', 'text-primary');
                            btn.classList.add('border-gray-300', 'text-gray-500');
                        }
                    });
                });
            });
            
            // 表单提交处理
            sleepForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // 验证评分是否已选择
                if (!selectedRating) {
                    alert('请评价您的睡眠质量');
                    return;
                }
                
                // 获取表单数据
                const sleepTime = new Date(sleepTimeInput.value);
                const wakeTime = new Date(wakeTimeInput.value);
                
                // 验证时间逻辑
                if (sleepTime >= wakeTime) {
                    // 检查是否跨天（例如晚上10点睡到早上6点）
                    const nextDay = new Date(sleepTime);
                    nextDay.setDate(sleepTime.getDate() + 1);
                    if (wakeTime < nextDay) {
                        // 跨天情况是允许的
                    } else {
                        alert('起床时间必须晚于入睡时间');
                        return;
                    }
                }
                
                // 计算睡眠时长
                let durationMs = wakeTime - sleepTime;
                // 如果是跨天，加上一天的毫秒数
                if (durationMs < 0) {
                    durationMs += 24 * 60 * 60 * 1000;
                }
                
                // 创建新记录
                const newRecord = {
                    id: Date.now(),
                    sleepTime: sleepTime.toISOString(),
                    wakeTime: wakeTime.toISOString(),
                    durationMs: durationMs,
                    quality: parseInt(selectedRating),
                    notes: notesInput.value.trim(),
                    date: new Date(Math.min(sleepTime.getTime(), wakeTime.getTime())).toISOString().split('T')[0]
                };
                
                // 添加到记录列表
                sleepRecords.unshift(newRecord);
                
                // 保存到本地存储
                localStorage.setItem('sleepRecords', JSON.stringify(sleepRecords));
                
                // 更新界面
                updateRecordsList();
                updateStatistics();
                updateChart();
                
                // 重置表单
                sleepForm.reset();
                qualityRatingButtons.forEach(btn => {
                    btn.classList.remove('border-primary', 'bg-primary/10', 'text-primary');
                    btn.classList.add('border-gray-300', 'text-gray-500');
                });
                selectedRating = null;
                qualityRatingInput.value = '';
                
                // 设置默认值为当前时间
                sleepTimeInput.value = formatDateTimeForInput(new Date());
                
                // 显示成功提示
                showToast('睡眠记录已保存');
            });
            
            // 图表切换
            let activeChart = 'duration';
            chartTabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    const chartType = this.getAttribute('data-chart');
                    if (chartType !== activeChart) {
                        activeChart = chartType;
                        
                        // 更新标签样式
                        chartTabs.forEach(t => {
                            t.classList.remove('active', 'bg-primary', 'text-white');
                            t.classList.add('bg-gray-100', 'text-gray-700');
                        });
                        this.classList.remove('bg-gray-100', 'text-gray-700');
                        this.classList.add('active', 'bg-primary', 'text-white');
                        
                        // 更新图表
                        updateChart();
                    }
                });
            });
            
            // 初始化图表
            let sleepChart;
            function initChart() {
                const ctx = document.getElementById('sleep-chart').getContext('2d');
                sleepChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: [],
                        datasets: [{
                            label: '睡眠时长 (小时)',
                            data: [],
                            borderColor: '#6366F1',
                            backgroundColor: 'rgba(99, 102, 241, 0.1)',
                            tension: 0.3,
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'top',
                            },
                            tooltip: {
                                mode: 'index',
                                intersect: false,
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: false,
                                min: 4,
                                title: {
                                    display: true,
                                    text: '小时'
                                }
                            }
                        }
                    }
                });
            }
            
            // 更新图表
            function updateChart() {
                // 如果没有记录，不更新图表
                if (sleepRecords.length === 0) return;
                
                // 确保图表已初始化
                if (!sleepChart) {
                    initChart();
                }
                
                // 取最近7条记录
                const recentRecords = [...sleepRecords].slice(0, 7).reverse();
                
                // 准备数据
                const labels = recentRecords.map(record => {
                    const date = new Date(record.date);
                    return `${date.getMonth() + 1}/${date.getDate()}`;
                });
                
                if (activeChart === 'duration') {
                    // 睡眠时长图表
                    sleepChart.data.labels = labels;
                    sleepChart.data.datasets = [{
                        label: '睡眠时长 (小时)',
                        data: recentRecords.map(record => (record.durationMs / (1000 * 60 * 60)).toFixed(1)),
                        borderColor: '#6366F1',
                        backgroundColor: 'rgba(99, 102, 241, 0.1)',
                        tension: 0.3,
                        fill: true
                    }];
                    sleepChart.options.scales.y.min = 4;
                    sleepChart.options.scales.y.title.text = '小时';
                } else {
                    // 睡眠质量图表
                    sleepChart.data.labels = labels;
                    sleepChart.data.datasets = [{
                        label: '睡眠质量 (1-5)',
                        data: recentRecords.map(record => record.quality),
                        borderColor: '#F59E0B',
                        backgroundColor: 'rgba(245, 158, 11, 0.1)',
                        tension: 0.3,
                        fill: true
                    }];
                    sleepChart.options.scales.y.min = 0;
                    sleepChart.options.scales.y.max = 5;
                    sleepChart.options.scales.y.title.text = '评分 (1-5)';
                }
                
                sleepChart.update();
            }
            
            // 更新记录列表
            function updateRecordsList() {
                if (sleepRecords.length === 0) {
                    recordsList.classList.add('hidden');
                    recordsEmpty.classList.remove('hidden');
                    return;
                }
                
                recordsList.classList.remove('hidden');
                recordsEmpty.classList.add('hidden');
                recordsItems.innerHTML = '';
                
                // 只显示最近10条记录
                const displayRecords = sleepRecords.slice(0, 10);
                
                displayRecords.forEach(record => {
                    const sleepTime = new Date(record.sleepTime);
                    const wakeTime = new Date(record.wakeTime);
                    const duration = formatDuration(record.durationMs);
                    
                    const row = document.createElement('tr');
                    row.className = 'hover:bg-gray-50 transition-colors slide-in';
                    row.setAttribute('data-id', record.id);
                    
                    // 格式化日期显示
                    const date = new Date(record.date);
                    const formattedDate = `${date.getFullYear()}-${(date.getMonth() + 1).toString().padStart(2, '0')}-${date.getDate().toString().padStart(2, '0')}`;
                    
                    // 格式化时间显示
                    const formattedSleepTime = `${sleepTime.getHours().toString().padStart(2, '0')}:${sleepTime.getMinutes().toString().padStart(2, '0')}`;
                    const formattedWakeTime = `${wakeTime.getHours().toString().padStart(2, '0')}:${wakeTime.getMinutes().toString().padStart(2, '0')}`;
                    
                    // 生成星级评分
                    let qualityStars = '';
                    for (let i = 1; i <= 5; i++) {
                        if (i <= record.quality) {
                            qualityStars += '<i class="fa fa-star text-accent"></i>';
                        } else {
                            qualityStars += '<i class="fa fa-star-o text-gray-300"></i>';
                        }
                    }
                    
                    row.innerHTML = `
                        <td class="px-3 py-3 text-left">${formattedDate}</td>
                        <td class="px-3 py-3 text-left">${formattedSleepTime}</td>
                        <td class="px-3 py-3 text-left">${formattedWakeTime}</td>
                        <td class="px-3 py-3 text-left font-medium">${duration}</td>
                        <td class="px-3 py-3 text-left">
                            <div class="flex items-center">
                                <div class="flex mr-2">${qualityStars}</div>
                                <span class="text-sm text-gray-500">${record.quality}/5</span>
                            </div>
                        </td>
                        <td class="px-3 py-3 text-center">
                            <button class="delete-record text-red-500 hover:text-red-700 transition-colors" data-id="${record.id}">
                                <i class="fa fa-trash-o"></i>
                            </button>
                        </td>
                    `;
                    
                    recordsItems.appendChild(row);
                });
                
                // 添加删除事件
                document.querySelectorAll('.delete-record').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = parseInt(this.getAttribute('data-id'));
                        deleteRecord(id);
                    });
                });
            }
            
            // 更新统计信息
            function updateStatistics() {
                if (sleepRecords.length === 0) {
                    avgSleepDuration.textContent = '0小时0分';
                    avgSleepQuality.textContent = '0.0 / 5';
                    recordDays.textContent = '0天';
                    return;
                }
                
                // 计算平均睡眠时长
                const totalDurationMs = sleepRecords.reduce((sum, record) => sum + record.durationMs, 0);
                const avgDurationMs = totalDurationMs / sleepRecords.length;
                avgSleepDuration.textContent = formatDuration(avgDurationMs);
                
                // 计算平均睡眠质量
                const totalQuality = sleepRecords.reduce((sum, record) => sum + record.quality, 0);
                const avgQuality = (totalQuality / sleepRecords.length).toFixed(1);
                avgSleepQuality.textContent = `${avgQuality} / 5`;
                
                // 记录天数
                recordDays.textContent = `${sleepRecords.length}天`;
            }
            
            // 删除记录
            function deleteRecord(id) {
                if (confirm('确定要删除这条睡眠记录吗？')) {
                    const recordIndex = sleepRecords.findIndex(record => record.id === id);
                    if (recordIndex !== -1) {
                        const deletedRecord = sleepRecords.splice(recordIndex, 1)[0];
                        
                        // 保存到本地存储
                        localStorage.setItem('sleepRecords', JSON.stringify(sleepRecords));
                        
                        // 更新界面
                        updateRecordsList();
                        updateStatistics();
                        updateChart();
                        
                        // 显示提示
                        showToast('睡眠记录已删除');
                    }
                }
            }
            
            // 格式化时长（毫秒 -> 小时:分钟）
            function formatDuration(durationMs) {
                const totalMinutes = Math.floor(durationMs / (1000 * 60));
                const hours = Math.floor(totalMinutes / 60);
                const minutes = totalMinutes % 60;
                return `${hours}小时${minutes}分`;
            }
            
            // 格式化日期时间为input所需格式
            function formatDateTimeForInput(date) {
                const year = date.getFullYear();
                const month = (date.getMonth() + 1).toString().padStart(2, '0');
                const day = date.getDate().toString().padStart(2, '0');
                const hours = date.getHours().toString().padStart(2, '0');
                const minutes = date.getMinutes().toString().padStart(2, '0');
                return `${year}-${month}-${day}T${hours}:${minutes}`;
            }
            
            // 显示提示消息
            function showToast(message) {
                // 检查是否已有toast
                let toast = document.getElementById('toast-message');
                if (toast) {
                    toast.remove();
                }
                
                // 创建新toast
                toast = document.createElement('div');
                toast.id = 'toast-message';
                toast.className = 'fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-dark text-white px-4 py-2 rounded-lg shadow-lg z-50 fade-in';
                toast.textContent = message;
                document.body.appendChild(toast);
                
                // 3秒后移除
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transition = 'opacity 0.3s ease';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }
            
            // 初始化页面
            updateRecordsList();
            updateStatistics();
            updateChart();
        });
    </script>
</body>
</html>
