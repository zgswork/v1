<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>井字棋游戏</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
            color: #333;
            padding: 20px;
        }
        
        h1 {
            margin-bottom: 20px;
            color: #2c3e50;
            text-align: center;
        }
        
        .game-container {
            width: 100%;
            max-width: 400px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .status {
            margin-bottom: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            color: #2c3e50;
            height: 30px;
        }
        
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 10px;
            margin: 0 auto;
            width: 100%;
            aspect-ratio: 1/1;
        }
        
        .cell {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ecf0f1;
            border-radius: 5px;
            font-size: 3rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
        }
        
        .cell:hover {
            background-color: #d6eaf8;
        }
        
        .cell.x {
            color: #e74c3c;
        }
        
        .cell.o {
            color: #3498db;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #2980b9;
        }
        
        .winning-cell {
            background-color: #a9dfbf;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        @media (max-width: 480px) {
            .cell {
                font-size: 2.5rem;
            }
            
            .status {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <h1>井字棋游戏</h1>
    
    <div class="game-container">
        <div class="status" id="status">轮到 X 下棋</div>
        
        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        
        <div class="controls">
            <button id="reset">重新开始</button>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const board = document.getElementById('board');
            const cells = document.querySelectorAll('.cell');
            const status = document.getElementById('status');
            const resetButton = document.getElementById('reset');
            
            let currentPlayer = 'X';
            let gameState = ['', '', '', '', '', '', '', '', ''];
            let gameActive = true;
            
            const winningConditions = [
                [0, 1, 2], // 第一行
                [3, 4, 5], // 第二行
                [6, 7, 8], // 第三行
                [0, 3, 6], // 第一列
                [1, 4, 7], // 第二列
                [2, 5, 8], // 第三列
                [0, 4, 8], // 主对角线
                [2, 4, 6]  // 副对角线
            ];
            
            // 处理单元格点击
            function handleCellClick(e) {
                const clickedCell = e.target;
                const clickedCellIndex = parseInt(clickedCell.getAttribute('data-index'));
                
                // 如果单元格已被占用或游戏已结束，则忽略点击
                if (gameState[clickedCellIndex] !== '' || !gameActive) {
                    return;
                }
                
                // 更新游戏状态和UI
                gameState[clickedCellIndex] = currentPlayer;
                clickedCell.classList.add(currentPlayer.toLowerCase());
                clickedCell.textContent = currentPlayer;
                
                // 检查胜利条件
                checkResult();
            }
            
            // 检查游戏结果
            function checkResult() {
                let roundWon = false;
                
                for (let i = 0; i < winningConditions.length; i++) {
                    const [a, b, c] = winningConditions[i];
                    
                    if (gameState[a] === '' || gameState[b] === '' || gameState[c] === '') {
                        continue;
                    }
                    
                    if (gameState[a] === gameState[b] && gameState[b] === gameState[c]) {
                        roundWon = true;
                        
                        // 高亮显示获胜的单元格
                        cells[a].classList.add('winning-cell');
                        cells[b].classList.add('winning-cell');
                        cells[c].classList.add('winning-cell');
                        break;
                    }
                }
                
                if (roundWon) {
                    status.textContent = `玩家 ${currentPlayer} 获胜!`;
                    gameActive = false;
                    return;
                }
                
                // 检查平局
                if (!gameState.includes('')) {
                    status.textContent = '游戏结束，平局!';
                    gameActive = false;
                    return;
                }
                
                // 切换玩家
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                status.textContent = `轮到 ${currentPlayer} 下棋`;
            }
            
            // 重置游戏
            function resetGame() {
                currentPlayer = 'X';
                gameState = ['', '', '', '', '', '', '', '', ''];
                gameActive = true;
                status.textContent = `轮到 ${currentPlayer} 下棋`;
                
                cells.forEach(cell => {
                    cell.textContent = '';
                    cell.className = 'cell';
                });
            }
            
            // 添加事件监听器
            cells.forEach(cell => {
                cell.addEventListener('click', handleCellClick);
            });
            
            resetButton.addEventListener('click', resetGame);
            
            // 触摸设备支持
            cells.forEach(cell => {
                cell.addEventListener('touchstart', handleCellClick, { passive: true });
            });
        });
    </script>
</body>
</html>
