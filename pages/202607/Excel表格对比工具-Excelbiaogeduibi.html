<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel表格对比工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- SheetJS库用于解析Excel文件 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6', // 主色调：蓝色，代表专业和可靠
                        added: '#10b981',   // 新增内容：绿色
                        removed: '#ef4444', // 删除内容：红色
                        modified: '#f59e0b',// 修改内容：黄色
                        neutral: '#f8fafc',
                    },
                    fontFamily: {
                        inter: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    boxShadow: {
                        'card': '0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.03)',
                        'hover': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)',
                    }
                },
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .cell-added {
                @apply bg-added/20 border-added;
            }
            .cell-removed {
                @apply bg-removed/20 border-removed line-through;
            }
            .cell-modified {
                @apply bg-modified/20 border-modified;
            }
            .table-container {
                @apply overflow-x-auto max-h-[600px] overflow-y-auto border border-gray-200 rounded-lg;
            }
            .diff-indicator {
                @apply absolute w-3 h-3 rounded-full -left-1.5 top-1/2 transform -translate-y-1/2;
            }
            .btn-active {
                @apply bg-primary text-white;
            }
            .card-transition {
                @apply transition-all duration-300 ease-in-out;
            }
        }
    </style>
</head>
<body class="font-inter bg-gradient-to-br from-neutral to-blue-50 min-h-screen text-gray-800">
    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <!-- 页面头部 -->
        <header class="text-center mb-10">
            <div class="inline-block p-4 bg-primary/10 rounded-full mb-6">
                <i class="fa fa-table text-3xl text-primary"></i>
            </div>
            <h1 class="text-[clamp(1.8rem,5vw,2.5rem)] font-bold text-gray-800 mb-3">Excel表格对比工具</h1>
            <p class="text-gray-600 max-w-2xl mx-auto">
                上传两个Excel文件，自动对比并高亮显示差异内容，告别繁琐的人工比对
            </p>
        </header>
        
        <!-- 主内容区 -->
        <main class="space-y-8">
            <!-- 文件上传区域 -->
            <section class="bg-white rounded-2xl shadow-card p-6 md:p-8 card-transition hover:shadow-hover">
                <h2 class="text-xl font-semibold mb-6 flex items-center">
                    <i class="fa fa-upload text-primary mr-2"></i> 上传Excel文件
                </h2>
                
                <div class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- 第一个文件上传 -->
                        <div class="relative">
                            <label for="file1" class="block text-sm font-medium text-gray-700 mb-2">原始表格 <span class="text-red-500">*</span></label>
                            <div class="flex items-center justify-between p-4 border-2 border-dashed border-gray-300 rounded-lg hover:border-primary card-transition bg-gray-50">
                                <div class="flex items-center">
                                    <i class="fa fa-file-excel-o text-green-600 text-2xl mr-3"></i>
                                    <div>
                                        <p id="file1Name" class="text-sm text-gray-500">未选择文件</p>
                                        <p class="text-xs text-gray-400 mt-1">支持 .xlsx 格式</p>
                                    </div>
                                </div>
                                <button type="button" class="text-primary hover:text-primary/80 text-sm font-medium">
                                    选择文件
                                </button>
                            </div>
                            <input type="file" id="file1" accept=".xlsx" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                        </div>
                        
                        <!-- 第二个文件上传 -->
                        <div class="relative">
                            <label for="file2" class="block text-sm font-medium text-gray-700 mb-2">对比表格 <span class="text-red-500">*</span></label>
                            <div class="flex items-center justify-between p-4 border-2 border-dashed border-gray-300 rounded-lg hover:border-primary card-transition bg-gray-50">
                                <div class="flex items-center">
                                    <i class="fa fa-file-excel-o text-green-600 text-2xl mr-3"></i>
                                    <div>
                                        <p id="file2Name" class="text-sm text-gray-500">未选择文件</p>
                                        <p class="text-xs text-gray-400 mt-1">支持 .xlsx 格式</p>
                                    </div>
                                </div>
                                <button type="button" class="text-primary hover:text-primary/80 text-sm font-medium">
                                    选择文件
                                </button>
                            </div>
                            <input type="file" id="file2" accept=".xlsx" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                        </div>
                    </div>
                    
                    <!-- 工作表选择 -->
                    <div id="sheetSelection" class="grid grid-cols-1 md:grid-cols-2 gap-6 hidden">
                        <div>
                            <label for="sheet1" class="block text-sm font-medium text-gray-700 mb-2">选择原始表格工作表</label>
                            <select id="sheet1" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary focus:outline-none card-transition">
                                <!-- 动态填充工作表选项 -->
                            </select>
                        </div>
                        <div>
                            <label for="sheet2" class="block text-sm font-medium text-gray-700 mb-2">选择对比表格工作表</label>
                            <select id="sheet2" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary focus:outline-none card-transition">
                                <!-- 动态填充工作表选项 -->
                            </select>
                        </div>
                    </div>
                    
                    <!-- 对比按钮 -->
                    <div class="pt-4 text-center">
                        <button id="compareBtn" disabled 
                            class="px-8 py-3 bg-gray-300 text-gray-500 font-medium rounded-lg card-transition flex items-center justify-center mx-auto">
                            <i class="fa fa-exchange mr-2"></i> 开始对比
                        </button>
                    </div>
                </div>
            </section>
            
            <!-- 加载状态 -->
            <section id="loadingSection" class="bg-white rounded-2xl shadow-card p-8 hidden">
                <div class="flex flex-col items-center justify-center py-10">
                    <div class="w-16 h-16 border-4 border-primary/30 border-t-primary rounded-full animate-spin mb-6"></div>
                    <h3 class="text-lg font-medium mb-2 text-gray-800">正在对比表格数据</h3>
                    <p class="text-gray-500 text-center max-w-md">
                        请稍候，正在解析并对比两个表格的内容...
                    </p>
                </div>
            </section>
            
            <!-- 对比结果区域 -->
            <section id="resultsSection" class="hidden">
                <div class="bg-white rounded-2xl shadow-card p-6 md:p-8 card-transition">
                    <div class="flex flex-col md:flex-row md:items-center justify-between mb-6">
                        <h2 class="text-xl font-semibold flex items-center">
                            <i class="fa fa-bar-chart text-primary mr-2"></i> 对比结果
                        </h2>
                        
                        <div class="flex flex-wrap gap-3 mt-4 md:mt-0">
                            <div class="flex items-center text-sm">
                                <span class="w-3 h-3 bg-added rounded-sm mr-2"></span>
                                <span>新增内容</span>
                            </div>
                            <div class="flex items-center text-sm">
                                <span class="w-3 h-3 bg-removed rounded-sm mr-2"></span>
                                <span>删除内容</span>
                            </div>
                            <div class="flex items-center text-sm">
                                <span class="w-3 h-3 bg-modified rounded-sm mr-2"></span>
                                <span>修改内容</span>
                            </div>
                            <button id="newComparisonBtn" 
                                class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-lg card-transition flex items-center">
                                <i class="fa fa-refresh mr-2"></i> 重新对比
                            </button>
                        </div>
                    </div>
                    
                    <!-- 差异统计 -->
                    <div id="diffStats" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                        <!-- 动态填充差异统计 -->
                    </div>
                    
                    <!-- 表格对比视图 -->
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <!-- 原始表格 -->
                        <div>
                            <h3 class="text-lg font-medium mb-3 flex items-center">
                                <i class="fa fa-file-text-o text-gray-500 mr-2"></i> 原始表格
                                <span id="originalSheetName" class="ml-2 text-sm font-normal text-gray-500"></span>
                            </h3>
                            <div class="table-container relative" id="originalTableContainer">
                                <!-- 原始表格将动态生成 -->
                            </div>
                        </div>
                        
                        <!-- 对比表格 -->
                        <div>
                            <h3 class="text-lg font-medium mb-3 flex items-center">
                                <i class="fa fa-file-text-o text-gray-500 mr-2"></i> 对比表格
                                <span id="compareSheetName" class="ml-2 text-sm font-normal text-gray-500"></span>
                            </h3>
                            <div class="table-container relative" id="compareTableContainer">
                                <!-- 对比表格将动态生成 -->
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        
        <!-- 页脚信息 -->
        <footer class="mt-16 pt-8 border-t border-gray-200 text-center text-gray-600">
            <p class="mb-3">本工具由 邓文涛(AI版) 制作</p>
            <p class="mb-3">微信：707547441</p>
            <p class="mb-6">QQ邮箱：<a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="6c5b5c5b59585b58585d2c1d1d420f0301">[email&#160;protected]</a></p>
        </footer>
    </div>
    
    <!-- 提示弹窗 -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-300 flex items-center px-4 py-3 rounded-lg shadow-lg z-50 max-w-xs">
        <i class="fa fa-check-circle mr-2"></i>
        <span id="toastMessage"></span>
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 全局变量存储解析后的Excel数据
        let workbook1 = null;
        let workbook2 = null;
        let worksheet1 = null;
        let worksheet2 = null;
        let file1Info = null;
        let file2Info = null;
        
        // DOM元素
        const file1Input = document.getElementById('file1');
        const file2Input = document.getElementById('file2');
        const file1Name = document.getElementById('file1Name');
        const file2Name = document.getElementById('file2Name');
        const sheet1Select = document.getElementById('sheet1');
        const sheet2Select = document.getElementById('sheet2');
        const sheetSelection = document.getElementById('sheetSelection');
        const compareBtn = document.getElementById('compareBtn');
        const loadingSection = document.getElementById('loadingSection');
        const resultsSection = document.getElementById('resultsSection');
        const originalTableContainer = document.getElementById('originalTableContainer');
        const compareTableContainer = document.getElementById('compareTableContainer');
        const diffStats = document.getElementById('diffStats');
        const originalSheetName = document.getElementById('originalSheetName');
        const compareSheetName = document.getElementById('compareSheetName');
        const newComparisonBtn = document.getElementById('newComparisonBtn');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        
        // 初始化页面
        function init() {
            // 绑定文件上传事件
            file1Input.addEventListener('change', handleFile1Upload);
            file2Input.addEventListener('change', handleFile2Upload);
            
            // 绑定工作表选择事件
            sheet1Select.addEventListener('change', handleSheetChange);
            sheet2Select.addEventListener('change', handleSheetChange);
            
            // 绑定对比按钮事件
            compareBtn.addEventListener('click', startComparison);
            
            // 绑定重新对比按钮事件
            newComparisonBtn.addEventListener('click', resetComparison);
        }
        
        // 处理第一个文件上传
        function handleFile1Upload(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            // 验证文件类型
            if (file.name.indexOf('.xlsx') === -1) {
                showToast('请上传.xlsx格式的Excel文件', 'error');
                file1Input.value = '';
                return;
            }
            
            // 显示文件名
            file1Name.textContent = file.name;
            file1Info = file;
            
            // 解析Excel文件
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    workbook1 = XLSX.read(data, { type: 'array' });
                    
                    // 填充工作表选择下拉框
                    populateSheetOptions(sheet1Select, workbook1);
                    
                    // 检查是否可以启用对比按钮
                    checkCompareButton();
                    
                    showToast(`已加载文件: ${file.name}`);
                } catch (error) {
                    console.error('解析Excel文件失败:', error);
                    showToast('文件解析失败，请检查文件是否损坏', 'error');
                    workbook1 = null;
                    file1Input.value = '';
                    file1Name.textContent = '未选择文件';
                }
            };
            reader.readAsArrayBuffer(file);
        }
        
        // 处理第二个文件上传
        function handleFile2Upload(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            // 验证文件类型
            if (file.name.indexOf('.xlsx') === -1) {
                showToast('请上传.xlsx格式的Excel文件', 'error');
                file2Input.value = '';
                return;
            }
            
            // 显示文件名
            file2Name.textContent = file.name;
            file2Info = file;
            
            // 解析Excel文件
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    workbook2 = XLSX.read(data, { type: 'array' });
                    
                    // 填充工作表选择下拉框
                    populateSheetOptions(sheet2Select, workbook2);
                    
                    // 检查是否可以启用对比按钮
                    checkCompareButton();
                    
                    showToast(`已加载文件: ${file.name}`);
                } catch (error) {
                    console.error('解析Excel文件失败:', error);
                    showToast('文件解析失败，请检查文件是否损坏', 'error');
                    workbook2 = null;
                    file2Input.value = '';
                    file2Name.textContent = '未选择文件';
                }
            };
            reader.readAsArrayBuffer(file);
        }
        
        // 填充工作表选择下拉框
        function populateSheetOptions(selectElement, workbook) {
            // 清空现有选项
            selectElement.innerHTML = '';
            
            // 添加工作表选项
            workbook.SheetNames.forEach(sheetName => {
                const option = document.createElement('option');
                option.value = sheetName;
                option.textContent = sheetName;
                selectElement.appendChild(option);
            });
            
            // 显示工作表选择区域
            sheetSelection.classList.remove('hidden');
            
            // 触发工作表选择事件
            selectElement.dispatchEvent(new Event('change'));
        }
        
        // 处理工作表选择变化
        function handleSheetChange() {
            if (workbook1 && sheet1Select.value) {
                worksheet1 = workbook1.Sheets[sheet1Select.value];
            }
            if (workbook2 && sheet2Select.value) {
                worksheet2 = workbook2.Sheets[sheet2Select.value];
            }
            
            // 检查是否可以启用对比按钮
            checkCompareButton();
        }
        
        // 检查是否可以启用对比按钮
        function checkCompareButton() {
            if (workbook1 && workbook2 && worksheet1 && worksheet2) {
                compareBtn.disabled = false;
                compareBtn.className = 'px-8 py-3 bg-primary hover:bg-primary/90 text-white font-medium rounded-lg card-transition flex items-center justify-center mx-auto';
            } else {
                compareBtn.disabled = true;
                compareBtn.className = 'px-8 py-3 bg-gray-300 text-gray-500 font-medium rounded-lg card-transition flex items-center justify-center mx-auto';
            }
        }
        
        // 开始对比表格
        function startComparison() {
            // 显示加载状态
            loadingSection.classList.remove('hidden');
            resultsSection.classList.add('hidden');
            
            // 模拟处理时间
            setTimeout(() => {
                try {
                    // 转换工作表为JSON数据
                    const json1 = XLSX.utils.sheet_to_json(worksheet1, { header: 1 });
                    const json2 = XLSX.utils.sheet_to_json(worksheet2, { header: 1 });
                    
                    // 对比两个表格数据
                    const { diffData1, diffData2, stats } = compareTables(json1, json2);
                    
                    // 显示工作表名称
                    originalSheetName.textContent = sheet1Select.value;
                    compareSheetName.textContent = sheet2Select.value;
                    
                    // 生成并显示表格
                    generateTable(originalTableContainer, diffData1);
                    generateTable(compareTableContainer, diffData2);
                    
                    // 显示差异统计
                    displayDiffStats(stats);
                    
                    // 隐藏加载状态，显示结果
                    loadingSection.classList.add('hidden');
                    resultsSection.classList.remove('hidden');
                    
                    // 滚动到结果区域
                    resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    
                    showToast('表格对比完成，已高亮显示差异内容');
                } catch (error) {
                    console.error('表格对比失败:', error);
                    showToast('表格对比失败，请重试', 'error');
                    loadingSection.classList.add('hidden');
                }
            }, 1500);
        }
        
        // 对比两个表格数据
        function compareTables(data1, data2) {
            // 记录差异统计
            const stats = {
                added: 0,
                removed: 0,
                modified: 0,
                totalCells: 0
            };
            
            // 找出最大的行数和列数
            const maxRows = Math.max(data1.length, data2.length);
            let maxCols = 0;
            
            // 计算最大列数
            data1.forEach(row => maxCols = Math.max(maxCols, row.length));
            data2.forEach(row => maxCols = Math.max(maxCols, row.length));
            
            // 准备差异数据结构
            const diffData1 = [];
            const diffData2 = [];
            
            // 遍历每一行
            for (let i = 0; i < maxRows; i++) {
                const row1 = data1[i] || [];
                const row2 = data2[i] || [];
                
                diffData1.push([]);
                diffData2.push([]);
                
                // 遍历每一列
                for (let j = 0; j < maxCols; j++) {
                    stats.totalCells++;
                    
                    const cell1 = row1[j] !== undefined ? row1[j] : null;
                    const cell2 = row2[j] !== undefined ? row2[j] : null;
                    
                    // 单元格状态：null=无差异，'added'=新增，'removed'=删除，'modified'=修改
                    let status1 = null;
                    let status2 = null;
                    
                    // 对比单元格内容
                    if (cell1 === null && cell2 !== null) {
                        // 新增的单元格
                        status1 = 'added';
                        status2 = 'added';
                        stats.added++;
                    } else if (cell1 !== null && cell2 === null) {
                        // 删除的单元格
                        status1 = 'removed';
                        status2 = 'removed';
                        stats.removed++;
                    } else if (cell1 !== null && cell2 !== null && cell1.toString() !== cell2.toString()) {
                        // 修改的单元格
                        status1 = 'modified';
                        status2 = 'modified';
                        stats.modified++;
                    }
                    
                    // 存储带有状态的单元格数据
                    diffData1[i].push({ value: cell1, status: status1 });
                    diffData2[i].push({ value: cell2, status: status2 });
                }
            }
            
            return { diffData1, diffData2, stats };
        }
        
        // 生成表格HTML
        function generateTable(container, data) {
            // 清空容器
            container.innerHTML = '';
            
            // 如果没有数据
            if (data.length === 0 || (data.length === 1 && data[0].length === 0 && data[0][0].value === null)) {
                container.innerHTML = `
                    <div class="p-8 text-center text-gray-500">
                        <i class="fa fa-file-o text-4xl mb-3"></i>
                        <p>表格中没有数据</p>
                    </div>
                `;
                return;
            }
            
            // 创建表格
            const table = document.createElement('table');
            table.className = 'min-w-full divide-y divide-gray-200';
            
            // 创建表头行（显示行号）
            const headerRow = document.createElement('tr');
            headerRow.className = 'bg-gray-50 sticky top-0 z-10';
            headerRow.innerHTML = '<th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider border-r border-gray-200 w-10">行号</th>';
            table.appendChild(headerRow);
            
            // 遍历数据行
            data.forEach((row, rowIndex) => {
                // 创建数据行
                const tr = document.createElement('tr');
                tr.className = rowIndex % 2 === 0 ? 'bg-white' : 'bg-gray-50';
                
                // 添加行号单元格
                const rowNumCell = document.createElement('td');
                rowNumCell.className = 'px-3 py-2 text-sm text-gray-500 border-r border-gray-200 font-medium sticky left-0 z-10 bg-inherit';
                rowNumCell.textContent = rowIndex + 1;
                tr.appendChild(rowNumCell);
                
                // 添加数据单元格
                row.forEach((cell, colIndex) => {
                    const td = document.createElement('td');
                    td.className = 'px-3 py-2 text-sm text-gray-800 border-b border-gray-200 min-w-[100px]';
                    
                    // 设置单元格内容
                    td.textContent = cell.value !== null ? cell.value : '';
                    
                    // 根据状态添加样式
                    if (cell.status === 'added') {
                        td.classList.add('cell-added');
                    } else if (cell.status === 'removed') {
                        td.classList.add('cell-removed');
                    } else if (cell.status === 'modified') {
                        td.classList.add('cell-modified');
                    }
                    
                    tr.appendChild(td);
                });
                
                table.appendChild(tr);
            });
            
            container.appendChild(table);
        }
        
        // 显示差异统计
        function displayDiffStats(stats) {
            diffStats.innerHTML = `
                <div class="bg-gray-50 rounded-lg p-4 border border-gray-200">
                    <div class="flex items-center justify-between">
                        <span class="text-gray-600">总单元格数</span>
                        <span class="font-semibold">${stats.totalCells}</span>
                    </div>
                </div>
                <div class="bg-added/10 rounded-lg p-4 border border-added/20">
                    <div class="flex items-center justify-between">
                        <span class="text-added">新增单元格</span>
                        <span class="font-semibold">${stats.added} (${((stats.added / stats.totalCells) * 100).toFixed(1)}%)</span>
                    </div>
                </div>
                <div class="bg-removed/10 rounded-lg p-4 border border-removed/20">
                    <div class="flex items-center justify-between">
                        <span class="text-removed">删除单元格</span>
                        <span class="font-semibold">${stats.removed} (${((stats.removed / stats.totalCells) * 100).toFixed(1)}%)</span>
                    </div>
                </div>
                <div class="bg-modified/10 rounded-lg p-4 border border-modified/20 hidden md:block">
                    <div class="flex items-center justify-between">
                        <span class="text-modified">修改单元格</span>
                        <span class="font-semibold">${stats.modified} (${((stats.modified / stats.totalCells) * 100).toFixed(1)}%)</span>
                    </div>
                </div>
            `;
        }
        
        // 重置对比
        function resetComparison() {
            // 清空文件选择
            file1Input.value = '';
            file2Input.value = '';
            file1Name.textContent = '未选择文件';
            file2Name.textContent = '未选择文件';
            
            // 重置工作簿和工作表
            workbook1 = null;
            workbook2 = null;
            worksheet1 = null;
            worksheet2 = null;
            file1Info = null;
            file2Info = null;
            
            // 隐藏工作表选择和结果区域
            sheetSelection.classList.add('hidden');
            resultsSection.classList.add('hidden');
            
            // 清空工作表选择下拉框
            sheet1Select.innerHTML = '';
            sheet2Select.innerHTML = '';
            
            // 禁用对比按钮
            checkCompareButton();
            
            // 滚动到上传区域
            file1Input.scrollIntoView({ behavior: 'smooth', block: 'start' });
            
            showToast('已重置，可上传新文件进行对比');
        }
        
        // 显示提示信息
        function showToast(message, type = 'success') {
            toastMessage.textContent = message;
            
            // 设置提示样式
            if (type === 'success') {
                toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-3 rounded-lg shadow-lg z-50 max-w-xs bg-green-500 text-white';
                toast.querySelector('i').className = 'fa fa-check-circle mr-2';
            } else {
                toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-3 rounded-lg shadow-lg z-50 max-w-xs bg-red-500 text-white';
                toast.querySelector('i').className = 'fa fa-exclamation-circle mr-2';
            }
            
            // 3秒后隐藏提示
            setTimeout(() => {
                toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-300 flex items-center px-4 py-3 rounded-lg shadow-lg z-50 max-w-xs';
            }, 3000);
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
