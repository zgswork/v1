<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>网格布局生成器</title>
  <style>
    :root {
      --bg: #f7f7f8;
      --text: #1f2328;
      --muted: #6b7280;
      --panel: #ffffff;
      --border: #e5e7eb;
      --accent: #3b82f6;
      --accent-contrast: #fff;
      --input-bg: #ffffff;
      --code-bg: #0f172a;
      --code-text: #e2e8f0;
    }
    [data-theme="dark"] {
      --bg: #0b0f14;
      --text: #e5e7eb;
      --muted: #a1a1aa;
      --panel: #121821;
      --border: #1f2937;
      --accent: #60a5fa;
      --accent-contrast: #0b0f14;
      --input-bg: #0d131b;
      --code-bg: #0d131b;
      --code-text: #e5e7eb;
    }
    *{box-sizing:border-box}
    body{
      margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,"Noto Sans",sans-serif;
    }
    .header{
      display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--border); position:sticky; top:0; backdrop-filter:saturate(150%) blur(6px); background:color-mix(in oklab, var(--bg) 85%, transparent);
    }
    .title{ font-weight:600; }
    .theme-toggle{ display:flex; align-items:center; gap:8px; }
    .toggle-btn{
      cursor:pointer; border:1px solid var(--border); background:var(--panel); width:48px; height:28px; border-radius:999px; position:relative; transition:background .2s,border-color .2s;
    }
    .toggle-btn .dot{ position:absolute; top:2px; left:2px; width:24px; height:24px; border-radius:50%; background:var(--accent); transition:left .2s; }
    [data-theme="dark"] .toggle-btn .dot{ left:22px; }

    .main{ display:grid; grid-template-columns: 1.1fr 1fr; gap:16px; padding:16px; max-width:1200px; margin:0 auto; }
    @media (max-width: 900px){ .main{ grid-template-columns: 1fr; } }
    .panel{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; box-shadow: 0 1px 8px color-mix(in oklab, var(--bg) 90%, #000 10%); }
    .panel h2{ margin:0 0 12px; font-size:18px; }
    .form-grid{ display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:12px; }
    .form-grid .full{ grid-column: 1 / -1; }
    label{ font-size:12px; color:var(--muted); display:block; margin-bottom:6px; }
    input[type="number"], select, input[type="text"]{ width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:var(--input-bg); color:var(--text); }
    input[type="range"]{ width: 100%; }
    .button-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
    button{ cursor:pointer; border:1px solid var(--border); background:var(--panel); color:var(--text); padding:10px 14px; border-radius:8px; transition: border-color .2s, background .2s, transform .02s; }
    button.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-contrast); }
    button:active{ transform: translateY(1px); }

    .preview-wrap{ display:flex; flex-direction:column; gap:12px; }
    .preview-area{ border:1px dashed var(--border); border-radius:12px; padding:12px; background: color-mix(in oklab, var(--panel) 92%, var(--bg) 8%); }
    .grid-container{
      display:grid; width:100%; max-width: var(--max-w, 100%); margin:0 auto;
      grid-template-columns: repeat(var(--cols, 3), 1fr);
      grid-template-rows: repeat(var(--rows, 3), minmax(var(--item-min-h, 60px), auto));
      gap: var(--gap, 10px);
      padding: var(--pad, 8px);
      background: color-mix(in oklab, var(--panel) 95%, var(--bg) 5%);
      border:1px solid var(--border); border-radius:8px;
    }
    .grid-item{
      display:flex; align-items:center; justify-content:center; font-weight:600;
      background: var(--item-bg, linear-gradient(135deg, color-mix(in oklab, var(--accent) 20%, #873eff 25%), color-mix(in oklab, var(--accent) 15%, #00ccff 15%)));
      border-radius: var(--radius, 8px);
      color:white; min-height: var(--item-min-h, 60px);
      box-shadow: 0 1px 4px color-mix(in oklab, #000 12%, transparent);
    }

    .code-block{ background: var(--code-bg); color: var(--code-text); border-radius:8px; padding:12px; overflow:auto; border:1px solid var(--border); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 13px; line-height: 1.5; }
    .copy-row{ display:flex; justify-content:flex-end; }
    .footer-note{ text-align:center; color:var(--muted); font-size:12px; padding:12px 16px; }
  </style>
</head>
<body>
  <header class="header">
    <div class="title">网格布局生成器</div>
    <div class="theme-toggle">
      <span style="font-size:12px;color:var(--muted)">主题</span>
      <div class="toggle-btn" id="themeToggle" role="button" aria-label="切换主题"><div class="dot"></div></div>
    </div>
  </header>

  <main class="main">
    <section class="panel">
      <h2>参数配置</h2>
      <div class="form-grid">
        <div>
          <label>列数 (1–12)</label>
          <input type="number" id="cols" min="1" max="12" value="3">
        </div>
        <div>
          <label>行数 (1–12)</label>
          <input type="number" id="rows" min="1" max="12" value="3">
        </div>
        <div>
          <label>项目数量</label>
          <input type="number" id="items" min="1" max="144" value="9">
        </div>
        <div>
          <label>间距 (px)</label>
          <input type="number" id="gap" min="0" max="64" value="12">
        </div>
        <div>
          <label>容器内边距 (px)</label>
          <input type="number" id="pad" min="0" max="64" value="8">
        </div>
        <div>
          <label>容器最大宽度 (px)</label>
          <input type="number" id="maxw" min="200" max="2000" value="1000">
        </div>
        <div>
          <label>项目最小高度 (px)</label>
          <input type="number" id="itemh" min="40" max="240" value="80">
        </div>
        <div>
          <label>列模式</label>
          <select id="colMode">
            <option value="fixed">固定列数</option>
            <option value="auto">自动适配列 (auto-fit)</option>
          </select>
        </div>
        <div>
          <label>最小列宽 (px)</label>
          <input type="number" id="minColWidth" min="80" max="600" value="160">
        </div>
        <div>
          <label>项目水平对齐</label>
          <select id="justifyItems">
            <option value="stretch">stretch</option>
            <option value="start">start</option>
            <option value="center">center</option>
            <option value="end">end</option>
          </select>
        </div>
        <div>
          <label>项目垂直对齐</label>
          <select id="alignItems">
            <option value="stretch">stretch</option>
            <option value="start">start</option>
            <option value="center">center</option>
            <option value="end">end</option>
          </select>
        </div>
        <div>
          <label>容器水平分布</label>
          <select id="justifyContent">
            <option value="start">start</option>
            <option value="center">center</option>
            <option value="end">end</option>
            <option value="space-between">space-between</option>
            <option value="space-around">space-around</option>
            <option value="space-evenly">space-evenly</option>
          </select>
        </div>
        <div>
          <label>容器垂直分布</label>
          <select id="alignContent">
            <option value="start">start</option>
            <option value="center">center</option>
            <option value="end">end</option>
            <option value="stretch">stretch</option>
            <option value="space-between">space-between</option>
            <option value="space-around">space-around</option>
            <option value="space-evenly">space-evenly</option>
          </select>
        </div>
        <div>
          <label>项目背景样式</label>
          <select id="itemStyle">
            <option value="gradient">渐变</option>
            <option value="accent">主题色</option>
            <option value="custom">自定义颜色</option>
          </select>
        </div>
        <div>
          <label>自定义颜色</label>
          <input type="text" id="itemColor" value="#3b82f6" placeholder="#RRGGBB 或 rgb(...)">
        </div>
        <div>
          <label>圆角 (px)</label>
          <input type="number" id="radius" min="0" max="32" value="8">
        </div>
        <div>
          <label>编号样式</label>
          <select id="labelType">
            <option value="num">数字编号</option>
            <option value="alpha">字母编号</option>
            <option value="none">不显示</option>
          </select>
        </div>
        <div class="full button-row">
          <button class="primary" id="applyBtn">应用更改</button>
          <button id="resetBtn">重置默认</button>
          <button id="copyCodeBtn">复制代码</button>
          <button id="downloadBtn">下载HTML</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>实时预览</h2>
      <div class="preview-wrap">
        <div class="preview-area">
          <div class="grid-container" id="gridPreview">
            <!-- items injected by JS -->
          </div>
        </div>
        <div>
          <h2 style="margin:0 0 8px">生成的代码</h2>
          <div class="copy-row">
            <button id="copyCodeBtn2">复制代码</button>
          </div>
          <pre class="code-block" id="codeBlock"></pre>
        </div>
      </div>
    </section>
  </main>

  <div class="footer-note">响应式支持：容器宽度为 100%，受最大宽度限制。手机上各面板会自动叠放。</div>

  <script>
    (function(){
      const root = document.documentElement;
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const savedTheme = localStorage.getItem('grid_theme');
      function setTheme(t){
        document.documentElement.setAttribute('data-theme', t);
        localStorage.setItem('grid_theme', t);
      }
      setTheme(savedTheme ? savedTheme : (prefersDark ? 'dark' : 'light'));
      document.getElementById('themeToggle').addEventListener('click', () => {
        const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        setTheme(t);
      });

      const els = {
        cols: document.getElementById('cols'),
        rows: document.getElementById('rows'),
        items: document.getElementById('items'),
        gap: document.getElementById('gap'),
        pad: document.getElementById('pad'),
        maxw: document.getElementById('maxw'),
        itemh: document.getElementById('itemh'),
        colMode: document.getElementById('colMode'),
        minColWidth: document.getElementById('minColWidth'),
        justifyItems: document.getElementById('justifyItems'),
        alignItems: document.getElementById('alignItems'),
        justifyContent: document.getElementById('justifyContent'),
        alignContent: document.getElementById('alignContent'),
        itemStyle: document.getElementById('itemStyle'),
        itemColor: document.getElementById('itemColor'),
        radius: document.getElementById('radius'),
        labelType: document.getElementById('labelType'),
        grid: document.getElementById('gridPreview'),
        code: document.getElementById('codeBlock'),
        apply: document.getElementById('applyBtn'),
        reset: document.getElementById('resetBtn'),
        copy1: document.getElementById('copyCodeBtn'),
        copy2: document.getElementById('copyCodeBtn2'),
        download: document.getElementById('downloadBtn'),
      };

      function clamp(n, min, max){ n = Number(n || 0); return Math.min(Math.max(n, min), max); }
      function genItems(count, labelType){
        const frag = document.createDocumentFragment();
        for(let i=0;i<count;i++){
          const div = document.createElement('div');
          div.className = 'grid-item';
          let label = '';
          if(labelType === 'num') label = String(i+1);
          else if(labelType === 'alpha') label = String.fromCharCode(65 + (i % 26));
          div.textContent = label;
          frag.appendChild(div);
        }
        return frag;
      }
      function updatePreview(){
        const cols = clamp(els.cols.value, 1, 12);
        const rows = clamp(els.rows.value, 1, 12);
        const items = clamp(els.items.value, 1, 144);
        const gap = clamp(els.gap.value, 0, 64);
        const pad = clamp(els.pad.value, 0, 64);
        const maxw = clamp(els.maxw.value, 200, 2000);
        const itemh = clamp(els.itemh.value, 40, 240);
        const colMode = els.colMode.value;
        const minColWidth = clamp(els.minColWidth.value, 80, 600);
        const justifyItems = els.justifyItems.value;
        const alignItems = els.alignItems.value;
        const justifyContent = els.justifyContent.value;
        const alignContent = els.alignContent.value;
        const itemStyle = els.itemStyle.value;
        const itemColor = els.itemColor.value.trim();
        const radius = clamp(els.radius.value, 0, 32);
        const labelType = els.labelType.value;

        els.cols.value = cols;
        els.rows.value = rows;
        els.items.value = items;
        els.gap.value = gap;
        els.pad.value = pad;
        els.maxw.value = maxw;
        els.itemh.value = itemh;
        els.minColWidth.value = minColWidth;
        els.radius.value = radius;

        const grid = els.grid;
        grid.style.setProperty('--cols', cols);
        grid.style.setProperty('--rows', rows);
        grid.style.setProperty('--gap', gap + 'px');
        grid.style.setProperty('--pad', pad + 'px');
        grid.style.setProperty('--max-w', maxw + 'px');
        grid.style.setProperty('--item-min-h', itemh + 'px');

        if(colMode === 'auto'){
          grid.style.gridTemplateColumns = `repeat(auto-fit, minmax(${minColWidth}px, 1fr))`;
        } else {
          grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        }
        grid.style.justifyItems = justifyItems;
        grid.style.alignItems = alignItems;
        grid.style.justifyContent = justifyContent;
        grid.style.alignContent = alignContent;

        let bg = '';
        if(itemStyle === 'accent'){
          bg = 'var(--accent)';
        } else if(itemStyle === 'custom' && itemColor){
          bg = itemColor;
        } else {
          bg = 'linear-gradient(135deg, color-mix(in oklab, var(--accent) 20%, #873eff 25%), color-mix(in oklab, var(--accent) 15%, #00ccff 15%))';
        }
        grid.style.setProperty('--item-bg', bg);
        grid.style.setProperty('--radius', radius + 'px');

        grid.innerHTML = '';
        grid.appendChild(genItems(items, labelType));
        updateCode({cols, rows, items, gap, pad, maxw, itemh, colMode, minColWidth, justifyItems, alignItems, justifyContent, alignContent, itemStyle, itemColor, radius, labelType});
      }

      function codeHTML(items, labelType){
        const labels = [];
        for(let i=0;i<items;i++){
          if(labelType === 'num') labels.push(String(i+1));
          else if(labelType === 'alpha') labels.push(String.fromCharCode(65+(i%26)));
          else labels.push('');
        }
        const itemDivs = labels.map(l => '  <div class="grid-item">' + (l ? l : '') + '</div>').join('\n');
        return [
'<!-- HTML -->',
'<div class="grid">', 
itemDivs,
'</div>'
        ].join('\n');
      }
      function codeCSS(params){
        const {cols, rows, gap, pad, maxw, itemh, colMode, minColWidth, justifyItems, alignItems, justifyContent, alignContent, itemStyle, itemColor, radius} = params;
        const colLine = colMode === 'auto' ? `repeat(auto-fit, minmax(${minColWidth}px, 1fr))` : `repeat(${cols}, 1fr)`;
        const itemBG = itemStyle === 'accent' ? 'var(--accent, #3b82f6)' : (itemStyle === 'custom' && itemColor ? itemColor : '#3b82f6');
        return [
'/* CSS */',
'.grid{',
'  display: grid;',
'  width: 100%;',
'  max-width: '+maxw+'px;',
'  grid-template-columns: '+colLine+';',
'  grid-template-rows: repeat('+rows+', minmax('+itemh+'px, auto));',
'  gap: '+gap+'px;',
'  padding: '+pad+'px;',
'  border: 1px solid #e5e7eb;',
'  border-radius: 8px;',
'  justify-items: '+justifyItems+';',
'  align-items: '+alignItems+';',
'  justify-content: '+justifyContent+';',
'  align-content: '+alignContent+';',
'}',
'.grid-item{',
'  display: flex;',
'  align-items: center;',
'  justify-content: center;',
'  min-height: '+itemh+'px;',
'  background: '+itemBG+';',
'  color: white;',
'  border-radius: '+radius+'px;',
'}'
        ].join('\n');
      }
      function updateCode(params){
        const {items, labelType} = params;
        const code = codeHTML(items, labelType) + '\n\n' + codeCSS(params);
        els.code.textContent = code;
      }

      function copyCode(){
        const params = {
          cols: Number(els.cols.value),
          rows: Number(els.rows.value),
          items: Number(els.items.value),
          gap: Number(els.gap.value),
          pad: Number(els.pad.value),
          maxw: Number(els.maxw.value),
          itemh: Number(els.itemh.value),
          colMode: els.colMode.value,
          minColWidth: Number(els.minColWidth.value),
          justifyItems: els.justifyItems.value,
          alignItems: els.alignItems.value,
          justifyContent: els.justifyContent.value,
          alignContent: els.alignContent.value,
          itemStyle: els.itemStyle.value,
          itemColor: els.itemColor.value.trim(),
          radius: Number(els.radius.value),
          labelType: els.labelType.value,
        };
        const text = codeHTML(params.items, params.labelType) + '\n\n' + codeCSS(params);
        navigator.clipboard.writeText(text).then(()=>{
          toast('已复制生成代码到剪贴板');
        }).catch(()=>{
          alert('复制失败：浏览器未授权剪贴板');
        });
      }

      function downloadHTML(){
        const params = {
          cols: Number(els.cols.value),
          rows: Number(els.rows.value),
          items: Number(els.items.value),
          gap: Number(els.gap.value),
          pad: Number(els.pad.value),
          maxw: Number(els.maxw.value),
          itemh: Number(els.itemh.value),
          colMode: els.colMode.value,
          minColWidth: Number(els.minColWidth.value),
          justifyItems: els.justifyItems.value,
          alignItems: els.alignItems.value,
          justifyContent: els.justifyContent.value,
          alignContent: els.alignContent.value,
          itemStyle: els.itemStyle.value,
          itemColor: els.itemColor.value.trim(),
          radius: Number(els.radius.value),
          labelType: els.labelType.value,
        };
        const html = `<!doctype html>\n<html lang="zh-CN">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>导出的网格</title>\n<style>\nbody{font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,\"Noto Sans\",sans-serif;margin:24px;background:#f7f7f8;color:#1f2328}\n` + codeCSS(params) + `\n</style>\n</head>\n<body>\n` + codeHTML(params.items, params.labelType) + `\n</body>\n</html>`;
        const blob = new Blob([html], {type:'text/html'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'grid_export.html';
        document.body.appendChild(a);
        a.click();
        setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 0);
      }

      function toast(msg){
        let t = document.getElementById('toast');
        if(!t){
          t = document.createElement('div');
          t.id = 'toast';
          Object.assign(t.style,{
            position:'fixed',left:'50%',top:'16px',transform:'translateX(-50%)',
            background:'var(--panel)',border:'1px solid var(--border)',color:'var(--text)',
            borderRadius:'8px',padding:'8px 12px',boxShadow:'0 2px 10px rgba(0,0,0,.12)',zIndex:9999
          });
          document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.display='block';
        setTimeout(()=>{ t.style.display='none'; }, 1600);
      }

      els.apply.addEventListener('click', updatePreview);
      els.reset.addEventListener('click', ()=>{
        els.cols.value = 3;
        els.rows.value = 3;
        els.items.value = 9;
        els.gap.value = 12;
        els.pad.value = 8;
        els.maxw.value = 1000;
        els.itemh.value = 80;
        els.colMode.value = 'fixed';
        els.minColWidth.value = 160;
        els.justifyItems.value = 'stretch';
        els.alignItems.value = 'stretch';
        els.justifyContent.value = 'start';
        els.alignContent.value = 'start';
        els.itemStyle.value = 'gradient';
        els.itemColor.value = '#3b82f6';
        els.radius.value = 8;
        els.labelType.value = 'num';
        updatePreview();
      });
      els.copy1.addEventListener('click', copyCode);
      els.copy2.addEventListener('click', copyCode);
      els.download.addEventListener('click', downloadHTML);

      // Live update on input for quick feedback (debounced)
      let timer = null;
      document.querySelectorAll('input,select').forEach(el=>{
        el.addEventListener('input', ()=>{
          clearTimeout(timer);
          timer = setTimeout(updatePreview, 80);
        });
      });

      updatePreview();
    })();
  </script>
</body>
</html>
