<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>行动营 · 上岸光荣榜</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #fef9e6 0%, #fff3e0 50%, #ffe6d5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            padding: 2rem 1.5rem;
        }

        .app-container {
            max-width: 1100px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
        }

        #captureArea {
            background: #fff8ef;
            border-radius: 64px 48px 72px 48px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            border: 1px solid #ffebc2;
        }

        .hero {
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .badge-icon {
            font-size: 3.6rem;
            display: inline-block;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0px); }
        }

        /* 标题样式：增加极高特异性 + !important 确保不被覆盖 */
        .hero h1 {
            font-size: 2.4rem !important;
            font-weight: 800 !important;
            color: #c95f1d !important;
            text-align: center !important;
            letter-spacing: 2px !important;
            margin: 0.5rem 0 0.25rem !important;
        }

        .subhead {
            font-size: 1.05rem;
            color: #b45f2b;
            background: #fff0e0;
            display: inline-block;
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            font-weight: 500;
            margin-top: 6px;
        }

        .motivation-line {
            margin-top: 1rem;
            font-size: 1rem;
            color: #d67a2e;
            font-weight: 500;
            background: #ffe8d4;
            display: inline-block;
            padding: 0.3rem 1.2rem;
            border-radius: 30px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin: 1rem 0 1.2rem;
            border-bottom: 2px dashed #ffd7a5;
            padding-bottom: 0.75rem;
        }

        .counter {
            background: #fff2e2;
            border-radius: 60px;
            padding: 0.3rem 1rem;
            font-weight: 700;
            color: #c45c1a;
            font-size: 1.1rem;
        }

        .counter span {
            font-size: 1.7rem;
            font-weight: 800;
            color: #e67e22;
            margin: 0 4px;
        }

        .slogan {
            font-size: 0.95rem;
            background: #ffefe2;
            padding: 0.3rem 1rem;
            border-radius: 60px;
            color: #b96326;
            font-weight: 500;
        }

        .honor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.2rem;
            margin: 1.8rem 0 1.5rem;
        }

        .honor-card {
            background: #ffffff;
            border-radius: 48px 24px 48px 24px;
            padding: 1rem 0.8rem;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.08);
            border: 1px solid #ffddb0;
            position: relative;
            transition: transform 0.2s;
        }

        .honor-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 22px rgba(0, 0, 0, 0.12);
        }

        .trophy-icon {
            font-size: 2.2rem;
            display: block;
            margin-bottom: 0.3rem;
        }

        .nickname {
            font-size: 1.5rem;
            font-weight: 800;
            color: #d4661a;
            letter-spacing: 1px;
        }

        .remove-btn {
            position: absolute;
            top: 8px;
            right: 12px;
            background: rgba(0,0,0,0.06);
            border: none;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 30px;
            width: 26px;
            height: 26px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #b45f2b;
            transition: 0.2s;
        }

        .remove-btn:hover {
            background: #ff8a5c;
            color: white;
        }

        .footer-inspire {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            color: #d46b20;
            border-top: 1px solid #ffddb5;
            padding-top: 1.2rem;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .foot-note {
            background: #ffefdf;
            padding: 0.3rem 0.9rem;
            border-radius: 60px;
            font-size: 0.85rem;
            font-weight: normal;
            color: #b76129;
        }

        .generation-date {
            text-align: right;
            font-size: 0.7rem;
            color: #c9a87b;
            margin-top: 0.8rem;
            padding-top: 0.5rem;
            border-top: 1px dashed #ffd8b5;
        }

        .management-module {
            background: #fffaf0;
            border-radius: 48px;
            padding: 1.4rem 1.8rem;
            border: 1px solid #ffdead;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.05);
        }

        .management-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 1.2rem;
            border-bottom: 1px solid #ffd8b0;
            padding-bottom: 0.6rem;
        }

        .management-title {
            font-weight: 700;
            font-size: 1.2rem;
            color: #b55a24;
        }

        .download-btn {
            background: #e67e22;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .download-btn:hover {
            background: #cf711f;
            transform: translateY(-2px);
        }

        .batch-area {
            margin-bottom: 1rem;
        }

        .batch-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #b55a24;
            margin-bottom: 6px;
        }

        .batch-textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 24px;
            border: 1px solid #ffcf9a;
            background: white;
            font-family: inherit;
            resize: vertical;
            font-size: 0.9rem;
        }

        .batch-actions, .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 8px;
            margin-bottom: 1rem;
        }

        .input-group input {
            flex: 2;
            min-width: 160px;
            padding: 12px 18px;
            border-radius: 60px;
            border: 1px solid #ffcf9a;
            background: white;
            font-size: 1rem;
        }

        .btn {
            border: none;
            padding: 0 1.5rem;
            border-radius: 60px;
            font-weight: 600;
            background: #f2c94c;
            color: #7a4316;
            cursor: pointer;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: #e67e22;
            color: white;
        }
        .btn-primary:hover { background: #cf711f; transform: translateY(-2px); }
        .reset-btn {
            background: #fff1e0;
            border: 1px solid #ffcb93;
            color: #c06725;
        }
        .clear-all-btn {
            background: #ffe0b5;
            border: 1px solid #ffb97a;
            color: #b0450c;
        }
        .helper-tip {
            font-size: 0.8rem;
            color: #c9752e;
            background: #fff3e6;
            display: inline-block;
            padding: 0.2rem 1rem;
            border-radius: 30px;
        }

        .member-list-panel {
            background: #fff6ea;
            border-radius: 28px;
            padding: 0.8rem 1rem;
            margin-top: 1rem;
            border: 1px solid #ffdead;
        }
        .member-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .member-list-title {
            font-weight: 600;
            color: #b55a24;
            font-size: 0.9rem;
        }
        .copy-list-btn {
            background: #e67e22;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            cursor: pointer;
        }
        .member-list-content {
            background: #fffdf9;
            border-radius: 20px;
            padding: 8px 12px;
            font-size: 0.85rem;
            color: #b45a26;
            word-break: break-all;
            max-height: 100px;
            overflow-y: auto;
            border: 1px solid #ffebcc;
        }
        .empty-list-hint {
            color: #c99f73;
            font-style: italic;
        }

        @media (max-width: 680px) {
            .honor-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
            .nickname { font-size: 1.2rem; }
            .management-module { padding: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div id="captureArea">
        <div class="hero">
            <div class="badge-icon">🏆✨🎯</div>
            <!-- 标题增加内联样式，双重保险 -->
            <h1 style="color: #c95f1d !important; text-align: center !important;">上岸光荣榜</h1>
            <div class="subhead">行动营 · 战神</div>
            <div class="motivation-line">⭐ 坚持即胜利 · 自律者上岸 ⭐</div>
        </div>
        <div class="stats">
            <div class="counter">🏅 已上岸勇士 · <span id="countDisplay">0</span> 人</div>
            <div class="slogan">🔥 下一批上岸者就是你 🔥</div>
        </div>
        <div id="honorListContainer" class="honor-grid"></div>
        <div class="footer-inspire">
            <span>⚡ 没有白流的汗水，只有更耀眼的勋章 ⚡</span>
            <span class="foot-note">🎯 坚持每日打卡，下期光荣榜等你登顶</span>
        </div>
        <div class="generation-date" id="generationDate"></div>
    </div>

    <div class="management-module">
        <div class="management-header">
            <div class="management-title">✏️ 光荣榜管理 · 批量增删</div>
            <button id="downloadImageBtn" class="download-btn">📸 下载光荣榜图片</button>
        </div>
        <div class="batch-area">
            <div class="batch-label">📋 批量添加昵称（每行一个 / 逗号分隔）</div>
            <textarea id="batchNicknames" class="batch-textarea" rows="3" placeholder="林小溪&#10;阿哲勇士&#10;晴天蜗牛,追光小鱼"></textarea>
            <div class="batch-actions">
                <button id="batchAddBtn" class="btn btn-primary">➕ 批量添加上岸</button>
                <button id="clearBatchBtn" class="btn">🗑️ 清空输入框</button>
            </div>
        </div>
        <div class="input-group">
            <input type="text" id="newNickname" placeholder="单个昵称" maxlength="16">
            <button id="addSingleBtn" class="btn btn-primary">➕ 添加上岸同学</button>
            <button id="resetDemoBtn" class="btn reset-btn">🔄 重置示例名单</button>
            <button id="clearAllBtn" class="btn clear-all-btn">🗑️ 清空示例名单</button>
        </div>
        <div class="member-list-panel">
            <div class="member-list-header">
                <span class="member-list-title">📋 当前光荣榜全体名单</span>
                <button id="copyMemberListBtn" class="copy-list-btn">📋 一键复制</button>
            </div>
            <div id="memberListContent" class="member-list-content"></div>
        </div>
        <div class="helper-tip">💡 点击卡片右上角「✖」可移除；下载图片会自动隐藏删除按钮。</div>
    </div>
</div>

<script>
    let上岸同学列表 = [];
    const DEFAULT_NAMES = ["林小溪", "阿哲勇士", "晴天蜗牛", "追光小鱼", "静水深流", "星野大熊"];
    function generateId() { return Date.now() + '-' + Math.random().toString(36).substr(2, 8); }
    function loadDefaultList() { return DEFAULT_NAMES.map(name => ({ id: generateId(), name: name.trim() })); }
    function escapeHtml(str) { return str.replace(/[&<>]/g, function(m) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]; }); }
    
    function updateStats() { document.getElementById('countDisplay').innerText = 上岸同学列表.length; }
    function updateDateFooter() {
        const dateDiv = document.getElementById('generationDate');
        if (dateDiv) {
            const now = new Date();
            const formatted = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
            dateDiv.innerText = `榜单生成时间：${formatted}`;
        }
    }
    function updateMemberListDisplay() {
        const container = document.getElementById('memberListContent');
        if (!container) return;
        if (上岸同学列表.length === 0) { container.innerHTML = '<span class="empty-list-hint">暂无上岸成员，请添加~</span>'; return; }
        container.innerHTML = 上岸同学列表.map(item => item.name).join('、');
    }
    function renderHonorBoard() {
        const container = document.getElementById('honorListContainer');
        if (!container) return;
        if (上岸同学列表.length === 0) {
            container.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:2rem; background:#fff2e4; border-radius:48px;"><span style="font-size:2rem;">🌟</span><p style="margin-top:12px; color:#c26a28;">暂无上岸名单，请添加~</p></div>`;
            updateStats(); updateMemberListDisplay(); updateDateFooter(); return;
        }
        let html = '';
        for (let item of 上岸同学列表) {
            html += `<div class="honor-card" data-id="${item.id}"><button class="remove-btn" data-id="${item.id}">✖</button><div class="trophy-icon">🏆⭐</div><div class="nickname">${escapeHtml(item.name)}</div></div>`;
        }
        container.innerHTML = html;
        updateStats(); updateMemberListDisplay(); updateDateFooter();
    }
    function addNicknamesBatch(namesArr) {
        let added = 0;
        for (let raw of namesArr) {
            let name = raw.trim();
            if (!name || name.length>16) continue;
            if (!上岸同学列表.some(i=>i.name===name)) { 上岸同学列表.push({ id: generateId(), name }); added++; }
        }
        if (added) { renderHonorBoard(); showTip(`✅ 成功添加 ${added} 位上岸同学`); } else showTip(`⚠️ 没有新增成员`, 1500);
    }
    function parseBatchInput(txt) {
        let lines = txt.split(/\r?\n/);
        let res = [];
        for (let line of lines) {
            line = line.trim();
            if (!line) continue;
            if (line.includes(',') || line.includes('，')) {
                let parts = line.split(/[,，]+/);
                for (let p of parts) if(p.trim()) res.push(p.trim());
            } else res.push(line);
        }
        return [...new Map(res.map(n=>[n,n])).values()];
    }
    function batchAdd() { let raw = document.getElementById('batchNicknames').value; let list = parseBatchInput(raw); if(list.length) addNicknamesBatch(list); else showTip("请输入昵称", 1200); }
    function addSingle() {
        let name = document.getElementById('newNickname').value.trim();
        if(!name) return alert("请输入昵称");
        if(name.length>16) return alert("昵称过长");
        if(上岸同学列表.some(i=>i.name===name)) return alert("已存在");
        上岸同学列表.push({ id: generateId(), name });
        renderHonorBoard();
        document.getElementById('newNickname').value = '';
        showTip(`🎉 ${name} 上榜！`);
    }
    function removeById(id) { 上岸同学列表 = 上岸同学列表.filter(i=>i.id!==id); renderHonorBoard(); showTip("已移除", 1200); }
    function resetDefault() { 上岸同学列表 = loadDefaultList(); renderHonorBoard(); showTip("已重置为示例名单"); }
    function clearAllMembers() { if (上岸同学列表.length === 0) { showTip("榜单已是空的", 1200); return; } if (confirm("清空所有成员？")) { 上岸同学列表 = []; renderHonorBoard(); showTip("已清空", 1500); } }
    function copyMemberList() {
        if (上岸同学列表.length === 0) { showTip("没有成员可复制", 1200); return; }
        const text = 上岸同学列表.map(i=>i.name).join('\n');
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(()=> showTip(`✅ 已复制 ${上岸同学列表.length} 位成员（一行一个）`,1500)).catch(()=> fallbackCopy(text));
        } else { fallbackCopy(text); }
    }
    function fallbackCopy(text) {
        const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.top='-9999px'; document.body.appendChild(ta); ta.select();
        let ok = false; try { ok = document.execCommand('copy'); } catch(e) {}
        document.body.removeChild(ta);
        if(ok) showTip(`✅ 已复制 ${上岸同学列表.length} 位成员`,1500); else alert("复制失败，请手动复制");
    }
    let tipTimer; function showTip(msg,dur=2000) {
        let tip = document.getElementById('dynamicTip');
        if(!tip) { tip = document.createElement('div'); tip.id='dynamicTip'; tip.style.cssText='position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#e67e22; color:white; padding:8px 24px; border-radius:60px; z-index:999; font-size:0.9rem;'; document.body.appendChild(tip); }
        tip.innerText = msg; tip.style.opacity='1'; if(tipTimer) clearTimeout(tipTimer); tipTimer = setTimeout(()=>{ tip.style.opacity='0'; setTimeout(()=>tip.remove(),300); }, dur);
    }
    async function downloadImage() {
        const el = document.getElementById('captureArea');
        const btns = document.querySelectorAll('#honorListContainer .remove-btn');
        const orig = []; btns.forEach((btn,i)=>{ orig[i]=btn.style.display; btn.style.display='none'; });
        try {
            const canvas = await html2canvas(el, { scale: 2.8, backgroundColor: '#fff8ef', logging: false, allowTaint: false, useCORS: true });
            btns.forEach((btn,i)=> btn.style.display = orig[i]);
            const link = document.createElement('a'); link.download = '行动营_上岸光荣榜.png'; link.href = canvas.toDataURL(); link.click(); showTip("图片已保存！",2000);
        } catch(e) { btns.forEach((btn,i)=> btn.style.display = orig[i]); alert("截图失败，请重试"); }
    }
    document.getElementById('honorListContainer')?.addEventListener('click', (e) => { let btn = e.target.closest('.remove-btn'); if(btn && btn.dataset.id && confirm("移除该同学？")) removeById(btn.dataset.id); });
    document.getElementById('batchAddBtn')?.addEventListener('click', batchAdd);
    document.getElementById('clearBatchBtn')?.addEventListener('click', ()=> { document.getElementById('batchNicknames').value = ''; showTip("已清空",1000); });
    document.getElementById('addSingleBtn')?.addEventListener('click', addSingle);
    document.getElementById('resetDemoBtn')?.addEventListener('click', resetDefault);
    document.getElementById('clearAllBtn')?.addEventListener('click', clearAllMembers);
    document.getElementById('copyMemberListBtn')?.addEventListener('click', copyMemberList);
    document.getElementById('downloadImageBtn')?.addEventListener('click', downloadImage);
    document.getElementById('newNickname')?.addEventListener('keypress', e=>{ if(e.key==='Enter') addSingle(); });
    function initList() { 上岸同学列表 = loadDefaultList(); renderHonorBoard(); }
    initList();
</script>
</body>
</html>
