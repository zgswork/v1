<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>万能生图工具</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    .header {
      padding: 20px 16px 10px;
      text-align: center;
    }
    .header h1 {
      font-size: 24px;
      background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #54a0ff);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradient 4s ease infinite;
    }
    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .header p { color: #888; font-size: 13px; margin-top: 4px; }
    .main {
      flex: 1;
      padding: 0 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .input-box {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .input-box textarea {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 15px;
      resize: none;
      outline: none;
      min-height: 60px;
      width: 100%;
      font-family: inherit;
    }
    .input-box textarea::placeholder { color: #666; }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tag {
      background: #2a2a4a;
      color: #aaa;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .tag:hover, .tag.active {
      background: #4a4a8a;
      color: #fff;
    }
    .btn-generate {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      color: #fff;
      padding: 16px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-generate:active { transform: scale(0.97); }
    .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-generate svg { width: 20px; height: 20px; }
    .image-area {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 16px;
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .image-area img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
    }
    .placeholder {
      color: #555;
      text-align: center;
      padding: 40px;
    }
    .placeholder svg { width: 64px; height: 64px; margin-bottom: 12px; opacity: 0.3; }
    .loading {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 40px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid #2a2a4a;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { color: #888; font-size: 14px; }
    .progress-bar {
      width: 200px;
      height: 4px;
      background: #2a2a4a;
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-bar .fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      width: 0%;
      animation: progress 8s ease-in-out forwards;
    }
    @keyframes progress { 0% { width: 0%; } 100% { width: 100%; } }
    .actions {
      display: none;
      gap: 10px;
      padding: 0 16px 20px;
    }
    .actions.show { display: flex; }
    .actions button {
      flex: 1;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      color: #fff;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
    }
    .actions button:active { background: #2a2a4a; }
    .history {
      padding: 0 16px 20px;
    }
    .history-title {
      color: #888;
      font-size: 13px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .history-title button {
      background: none;
      border: none;
      color: #667eea;
      font-size: 13px;
      cursor: pointer;
    }
    .history-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .history-item {
      aspect-ratio: 1;
      border-radius: 10px;
      overflow: hidden;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      cursor: pointer;
      position: relative;
    }
    .history-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .history-item .del {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 20px;
      height: 20px;
      background: rgba(0,0,0,0.7);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #ff6b6b;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎨 万能生图工具</h1>
    <p>描述你想要的画面，AI 为你绘制</p>
  </div>

  <div class="main">
    <div class="input-box">
      <textarea id="prompt" placeholder="例如：一只穿着宇航服的猫在月球上弹吉他，赛博朋克风格，高清画质..."></textarea>
      <div class="tags">
        <button class="tag" onclick="addTag('高清画质')">高清画质</button>
        <button class="tag" onclick="addTag('赛博朋克')">赛博朋克</button>
        <button class="tag" onclick="addTag('宫崎骏风格')">宫崎骏风格</button>
        <button class="tag" onclick="addTag('3D渲染')">3D渲染</button>
        <button class="tag" onclick="addTag('水墨画')">水墨画</button>
        <button class="tag" onclick="addTag('像素风')">像素风</button>
      </div>
    </div>

    <button class="btn-generate" id="generateBtn" onclick="generate()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
      </svg>
      开始生成
    </button>

    <div class="image-area" id="imageArea">
      <div class="placeholder" id="placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <div>输入描述，点击生成<br>图片将显示在这里</div>
      </div>
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>AI 正在绘制中...</p>
        <div class="progress-bar"><div class="fill"></div></div>
      </div>
      <img id="resultImg" style="display:none;" alt="生成的图片">
    </div>
  </div>

  <div class="actions" id="actions">
    <button onclick="download()">📥 保存图片</button>
    <button onclick="share()">🔗 分享链接</button>
    <button onclick="regenerate()">🔄 重新生成</button>
  </div>

  <div class="history" id="historyBox" style="display:none;">
    <div class="history-title">
      <span>📚 历史记录</span>
      <button onclick="clearHistory()">清空</button>
    </div>
    <div class="history-grid" id="historyGrid"></div>
  </div>

  <script>
    let currentPrompt = '';
    let currentUrl = '';
    let history = JSON.parse(localStorage.getItem('ai_img_history') || '[]');

    function addTag(tag) {
      const ta = document.getElementById('prompt');
      const val = ta.value.trim();
      ta.value = val ? val + '，' + tag : tag;
      ta.focus();
    }

    function generate() {
      const prompt = document.getElementById('prompt').value.trim();
      if (!prompt) {
        alert('请先输入图片描述！');
        return;
      }
      currentPrompt = prompt;

      const btn = document.getElementById('generateBtn');
      const placeholder = document.getElementById('placeholder');
      const loading = document.getElementById('loading');
      const img = document.getElementById('resultImg');
      const actions = document.getElementById('actions');

      btn.disabled = true;
      placeholder.style.display = 'none';
      img.style.display = 'none';
      loading.style.display = 'flex';
      actions.classList.remove('show');

      // 使用 Pollinations.ai 免费API
      const encoded = encodeURIComponent(prompt);
      const seed = Math.floor(Math.random() * 999999);
      const url = `https://image.pollinations.ai/prompt/${encoded}?width=1024&height=1024&seed=${seed}&nologo=true&enhance=true`;

      const imgObj = new Image();
      imgObj.crossOrigin = 'anonymous';
      imgObj.onload = () => {
        img.src = url;
        img.style.display = 'block';
        loading.style.display = 'none';
        btn.disabled = false;
        actions.classList.add('show');
        currentUrl = url;

        // 保存历史
        history.unshift({ prompt, url, time: Date.now() });
        if (history.length > 30) history = history.slice(0, 30);
        localStorage.setItem('ai_img_history', JSON.stringify(history));
        renderHistory();
      };
      imgObj.onerror = () => {
        loading.style.display = 'none';
        placeholder.style.display = 'flex';
        placeholder.innerHTML = '<div style="color:#ff6b6b;">生成失败，请重试</div>';
        btn.disabled = false;
      };
      imgObj.src = url;
    }

    function download() {
      if (!currentUrl) return;
      const a = document.createElement('a');
      a.href = currentUrl;
      a.download = 'AI生成图片_' + Date.now() + '.png';
      a.target = '_blank';
      a.click();
    }

    function share() {
      if (!currentUrl) return;
      if (navigator.share) {
        navigator.share({ title: 'AI生成的图片', text: currentPrompt, url: currentUrl });
      } else {
        navigator.clipboard.writeText(currentUrl).then(() => alert('图片链接已复制到剪贴板！'));
      }
    }

    function regenerate() {
      generate();
    }

    function renderHistory() {
      const box = document.getElementById('historyBox');
      const grid = document.getElementById('historyGrid');
      if (history.length === 0) { box.style.display = 'none'; return; }
      box.style.display = 'block';
      grid.innerHTML = history.map((h, i) => `
        <div class="history-item" onclick="loadHistory(${i})">
          <img src="${h.url}" alt="" loading="lazy">
          <div class="del" onclick="event.stopPropagation();deleteHistory(${i})">×</div>
        </div>
      `).join('');
    }

    function loadHistory(i) {
      const h = history[i];
      document.getElementById('prompt').value = h.prompt;
      const img = document.getElementById('resultImg');
      img.src = h.url;
      img.style.display = 'block';
      document.getElementById('placeholder').style.display = 'none';
      document.getElementById('actions').classList.add('show');
      currentUrl = h.url;
      currentPrompt = h.prompt;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteHistory(i) {
      history.splice(i, 1);
      localStorage.setItem('ai_img_history', JSON.stringify(history));
      renderHistory();
    }

    function clearHistory() {
      if (!confirm('确定清空所有历史记录？')) return;
      history = [];
      localStorage.removeItem('ai_img_history');
      renderHistory();
    }

    // 回车生成
    document.getElementById('prompt').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        generate();
      }
    });

    renderHistory();
  </script>
</body>
</html>
