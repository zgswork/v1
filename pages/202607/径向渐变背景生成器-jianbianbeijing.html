<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>径向渐变背景生成器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --dark-color: #0c0f1c;
            --light-color: #f8f9fa;
            --gray-color: #6c757d;
            --success-color: #4cc9f0;
            --card-bg: rgba(255, 255, 255, 0.1);
            --border-radius: 12px;
            --box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: var(--light-color);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 30px;
        }
        
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, var(--success-color), #7209b7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 800;
        }
        
        header p {
            font-size: 1.1rem;
            color: #a5b4fc;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .app-container {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 25px;
            height: 70vh;
        }
        
        @media (max-width: 992px) {
            .app-container {
                grid-template-columns: 1fr;
                height: auto;
            }
        }
        
        .panel {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            padding: 25px;
            box-shadow: var(--box-shadow);
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: auto;
        }
        
        .controls-panel {
            display: flex;
            flex-direction: column;
        }
        
        .preview-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            overflow: hidden;
            position: relative;
        }
        
        .preview-area {
            width: 100%;
            height: 100%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            background: radial-gradient(circle, #4361ee, #3a0ca3);
        }
        
        .preview-label {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.9rem;
            color: #fff;
        }
        
        .code-panel {
            display: flex;
            flex-direction: column;
        }
        
        .panel-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--primary-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .panel-title i {
            color: var(--success-color);
        }
        
        .control-group {
            margin-bottom: 20px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #cbd5e1;
        }
        
        .color-picker-container {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .color-picker {
            flex: 1;
        }
        
        .color-input {
            width: 100%;
            height: 40px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .slider-container {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin-top: 5px;
        }
        
        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: linear-gradient(to right, var(--primary-color), var(--success-color));
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--light-color);
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }
        
        .value-display {
            text-align: right;
            font-size: 0.9rem;
            color: var(--success-color);
            margin-top: 5px;
        }
        
        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 10px;
        }
        
        .radio-option {
            flex: 1;
            min-width: 120px;
        }
        
        .radio-option input[type="radio"] {
            display: none;
        }
        
        .radio-option label {
            display: block;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }
        
        .radio-option input[type="radio"]:checked + label {
            background: var(--primary-color);
            box-shadow: 0 0 10px rgba(67, 97, 238, 0.5);
        }
        
        textarea {
            width: 100%;
            height: 200px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--success-color);
            padding: 15px;
            font-family: monospace;
            resize: none;
            margin-top: 10px;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: var(--primary-color);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        button:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
        }
        
        button.copy-btn {
            background: #10b981;
        }
        
        button.copy-btn:hover {
            background: #059669;
        }
        
        button.reset-btn {
            background: var(--gray-color);
        }
        
        button.reset-btn:hover {
            background: #5a6268;
        }
        
        .gradient-info {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #94a3b8;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }
            
            .color-picker-container {
                flex-direction: column;
            }
            
            .radio-group {
                flex-direction: column;
                gap: 10px;
            }
            
            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-palette"></i> 径向渐变背景生成器</h1>
            <p>自定义您的径向渐变背景，实时预览并获取CSS代码</p>
        </header>
        
        <div class="app-container">
            <div class="panel controls-panel">
                <h2 class="panel-title"><i class="fas fa-sliders-h"></i> 渐变控制</h2>
                
                <div class="color-picker-container">
                    <div class="color-picker">
                        <label for="color1">起始颜色</label>
                        <input type="color" id="color1" class="color-input" value="#4361ee">
                    </div>
                    <div class="color-picker">
                        <label for="color2">结束颜色</label>
                        <input type="color" id="color2" class="color-input" value="#3a0ca3">
                    </div>
                </div>
                
                <div class="control-group">
                    <label for="positionX">中心位置 X: <span id="positionXValue">50%</span></label>
                    <div class="slider-container">
                        <input type="range" id="positionX" min="0" max="100" value="50">
                    </div>
                </div>
                
                <div class="control-group">
                    <label for="positionY">中心位置 Y: <span id="positionYValue">50%</span></label>
                    <div class="slider-container">
                        <input type="range" id="positionY" min="0" max="100" value="50">
                    </div>
                </div>
                
                <div class="control-group">
                    <label for="size">渐变大小: <span id="sizeValue">farthest-corner</span></label>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" id="size1" name="size" value="closest-side" checked>
                            <label for="size1">最近边</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="size2" name="size" value="farthest-side">
                            <label for="size2">最远边</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="size3" name="size" value="closest-corner">
                            <label for="size3">最近角</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="size4" name="size" value="farthest-corner">
                            <label for="size4">最远角</label>
                        </div>
                    </div>
                </div>
                
                <div class="control-group">
                    <label for="shape">渐变形状:</label>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" id="shape1" name="shape" value="circle" checked>
                            <label for="shape1">圆形</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="shape2" name="shape" value="ellipse">
                            <label for="shape2">椭圆形</label>
                        </div>
                    </div>
                </div>
                
                <div class="btn-group">
                    <button class="reset-btn" id="resetBtn">
                        <i class="fas fa-redo"></i> 重置
                    </button>
                </div>
            </div>
            
            <div class="panel preview-panel">
                <div id="previewArea" class="preview-area">
                    <div class="preview-label">实时预览区域</div>
                </div>
            </div>
            
            <div class="panel code-panel">
                <h2 class="panel-title"><i class="fas fa-code"></i> CSS 代码</h2>
                <textarea id="cssCode" readonly>background: radial-gradient(circle farthest-corner at 50% 50%, #4361ee, #3a0ca3);</textarea>
                <div class="btn-group">
                    <button class="copy-btn" id="copyBtn">
                        <i class="far fa-copy"></i> 复制代码
                    </button>
                </div>
                <div class="gradient-info">
                    <span>格式: radial-gradient()</span>
                    <span id="cssSupport">支持: Chrome 10+, Firefox 3.6+, IE 10+</span>
                </div>
            </div>
        </div>
        
        <footer>
            <p>© 2023 径向渐变背景生成器 | 完全免费使用</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const color1 = document.getElementById('color1');
            const color2 = document.getElementById('color2');
            const positionX = document.getElementById('positionX');
            const positionY = document.getElementById('positionY');
            const positionXValue = document.getElementById('positionXValue');
            const positionYValue = document.getElementById('positionYValue');
            const sizeValue = document.getElementById('sizeValue');
            const previewArea = document.getElementById('previewArea');
            const cssCode = document.getElementById('cssCode');
            const copyBtn = document.getElementById('copyBtn');
            const resetBtn = document.getElementById('resetBtn');
            
            // 初始值
            let shape = 'circle';
            let size = 'farthest-corner';
            
            // 更新预览
            function updatePreview() {
                const gradient = `radial-gradient(${shape} ${size} at ${positionX.value}% ${positionY.value}%, ${color1.value}, ${color2.value})`;
                previewArea.style.background = gradient;
                
                // 更新CSS代码
                cssCode.value = `background: ${gradient};`;
            }
            
            // 事件监听
            color1.addEventListener('input', updatePreview);
            color2.addEventListener('input', updatePreview);
            
            positionX.addEventListener('input', function() {
                positionXValue.textContent = `${this.value}%`;
                updatePreview();
            });
            
            positionY.addEventListener('input', function() {
                positionYValue.textContent = `${this.value}%`;
                updatePreview();
            });
            
            // 渐变大小选择
            const sizeRadios = document.querySelectorAll('input[name="size"]');
            sizeRadios.forEach(radio => {
                radio.addEventListener('change', function() {
                    if (this.checked) {
                        size = this.value;
                        sizeValue.textContent = this.value;
                        updatePreview();
                    }
                });
            });
            
            // 渐变形状选择
            const shapeRadios = document.querySelectorAll('input[name="shape"]');
            shapeRadios.forEach(radio => {
                radio.addEventListener('change', function() {
                    if (this.checked) {
                        shape = this.value;
                        updatePreview();
                    }
                });
            });
            
            // 复制代码
            copyBtn.addEventListener('click', function() {
                cssCode.select();
                document.execCommand('copy');
                
                // 显示复制成功反馈
                const originalText = copyBtn.innerHTML;
                copyBtn.innerHTML = '<i class="fas fa-check"></i> 已复制!';
                setTimeout(() => {
                    copyBtn.innerHTML = originalText;
                }, 2000);
            });
            
            // 重置
            resetBtn.addEventListener('click', function() {
                color1.value = '#4361ee';
                color2.value = '#3a0ca3';
                positionX.value = 50;
                positionY.value = 50;
                positionXValue.textContent = '50%';
                positionYValue.textContent = '50%';
                
                // 重置单选按钮
                document.getElementById('size1').checked = false;
                document.getElementById('size4').checked = true;
                document.getElementById('shape1').checked = true;
                size = 'farthest-corner';
                shape = 'circle';
                sizeValue.textContent = 'farthest-corner';
                
                updatePreview();
            });
            
            // 初始化
            updatePreview();
        });
    </script>
</body>
</html>
