<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电影字幕拼图工具</title>
    <style>
        :root {
            --primary-color: #0071e3;
            --secondary-color: #f5f5f7;
            --text-color: #1d1d1f;
            --light-text: #86868b;
            --border-color: #d2d2d7;
            --white: #ffffff;
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            --spacing-xl: 48px;
            --border-radius: 12px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        body {
            background-color: var(--secondary-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-md);
        }

        header {
            text-align: center;
            padding: var(--spacing-xl) 0;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: var(--spacing-sm);
        }

        .subtitle {
            color: var(--light-text);
            font-size: 1.1rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .main-content {
            background-color: var(--white);
            border-radius: var(--border-radius);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
        }

        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: var(--border-radius);
            padding: var(--spacing-xl);
            text-align: center;
            margin-bottom: var(--spacing-lg);
            transition: var(--transition);
        }

        .upload-area:hover {
            border-color: var(--primary-color);
            background-color: rgba(0, 113, 227, 0.05);
        }

        .upload-icon {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: var(--spacing-sm);
        }

        .upload-text {
            margin-bottom: var(--spacing-sm);
        }

        .upload-btn {
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            border-radius: 20px;
            padding: 8px 20px;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .upload-btn:hover {
            background-color: #0063cc;
        }

        .settings-area {
            margin-bottom: var(--spacing-lg);
        }

        .setting-item {
            margin-bottom: var(--spacing-md);
        }

        .setting-label {
            display: block;
            margin-bottom: var(--spacing-xs);
            font-weight: 500;
        }

        .slider {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            appearance: none;
            background: var(--secondary-color);
            outline: none;
            border-radius: 4px;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
        }

        .slider-value {
            display: inline-block;
            margin-left: var(--spacing-sm);
            font-weight: 500;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-lg);
        }

        .action-btn {
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            border-radius: 20px;
            padding: 10px 24px;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .action-btn:hover {
            background-color: #0063cc;
        }

        .action-btn.secondary {
            background-color: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
        }

        .action-btn.secondary:hover {
            background-color: rgba(0, 113, 227, 0.05);
        }

        .preview-area {
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: var(--spacing-md);
            overflow-x: auto;
            background-color: var(--secondary-color);
        }

        .preview-container {
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .preview-image {
            max-width: 100%;
            border-radius: var(--border-radius);
            margin-bottom: var(--spacing-sm);
        }

        .no-image {
            color: var(--light-text);
            text-align: center;
        }

        .image-list {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-lg);
        }

        .image-item {
            position: relative;
            width: 150px;
            height: 100px;
            border-radius: var(--border-radius);
            overflow: hidden;
            cursor: move;
        }

        .image-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .remove-image {
            position: absolute;
            top: 4px;
            right: 4px;
            background-color: rgba(0, 0, 0, 0.5);
            color: var(--white);
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .how-to-use {
            background-color: var(--white);
            border-radius: var(--border-radius);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
        }

        .how-to-use h2 {
            margin-bottom: var(--spacing-md);
        }

        .steps {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-md);
        }

        .step {
            flex: 1 1 300px;
            padding: var(--spacing-md);
            border-radius: var(--border-radius);
            background-color: var(--secondary-color);
        }

        .step-number {
            display: inline-block;
            width: 30px;
            height: 30px;
            background-color: var(--primary-color);
            color: var(--white);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: var(--spacing-xs);
        }

        footer {
            text-align: center;
            padding: var(--spacing-lg) 0;
            color: var(--light-text);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .main-content,
            .how-to-use {
                padding: var(--spacing-md);
            }

            .upload-area {
                padding: var(--spacing-md);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>电影字幕拼图工具</h1>
            <p class="subtitle">将带对白台词的电影截图拼接成一张只保留字幕的长图片，实现电影拼字幕效果。</p>
        </header>

        <main>
            <section class="main-content">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">+</div>
                    <p class="upload-text">点击或拖拽图片到这里上传</p>
                    <p class="upload-text">支持JPG、PNG格式</p>
                    <button class="upload-btn" id="uploadBtn">选择图片</button>
                    <input type="file" id="fileInput" multiple accept="image/*" style="display: none;">
                </div>

                <div class="image-list" id="imageList"></div>

                <div class="settings-area">
                    <div class="setting-item">
                        <label class="setting-label" for="spacingSlider">字幕间距 (px): <span class="slider-value" id="spacingValue">20</span></label>
                        <input type="range" min="0" max="100" value="20" class="slider" id="spacingSlider">
                    </div>

                    <div class="setting-item">
                        <label class="setting-label" for="cropSlider">字幕区域高度比例 (%): <span class="slider-value" id="cropValue">30</span></label>
                        <input type="range" min="10" max="90" value="30" class="slider" id="cropSlider">
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="action-btn" id="generateBtn">生成拼图</button>
                    <button class="action-btn secondary" id="clearBtn">清空</button>
                </div>

                <div class="preview-area">
                    <div class="preview-container" id="previewContainer">
                        <div class="no-image">
                            <p>拼图预览将在这里显示</p>
                        </div>
                    </div>
                </div>
            </section>

            <section class="how-to-use">
                <h2>如何使用</h2>
                <div class="steps">
                    <div class="step">
                        <div class="step-number">1</div>
                        <h3>上传图片</h3>
                        <p>点击或拖拽电影截图到上传区域，支持多张图片同时上传。</p>
                    </div>
                    <div class="step">
                        <div class="step-number">2</div>
                        <h3>调整设置</h3>
                        <p>根据需要调整字幕间距和字幕区域高度比例。</p>
                    </div>
                    <div class="step">
                        <div class="step-number">3</div>
                        <h3>生成拼图</h3>
                        <p>点击生成拼图按钮，等待处理完成后即可查看结果。</p>
                    </div>
                    <div class="step">
                        <div class="step-number">4</div>
                        <h3>保存图片</h3>
                        <p>右键点击预览区域的图片，选择"保存图片"即可下载到本地。</p>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>© 2023 电影字幕拼图工具 | 一款免费的在线字幕拼接工具</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const uploadArea = document.getElementById('uploadArea');
            const uploadBtn = document.getElementById('uploadBtn');
            const fileInput = document.getElementById('fileInput');
            const imageList = document.getElementById('imageList');
            const spacingSlider = document.getElementById('spacingSlider');
            const spacingValue = document.getElementById('spacingValue');
            const cropSlider = document.getElementById('cropSlider');
            const cropValue = document.getElementById('cropValue');
            const generateBtn = document.getElementById('generateBtn');
            const clearBtn = document.getElementById('clearBtn');
            const previewContainer = document.getElementById('previewContainer');

            // 图片数组
            let images = [];

            // 上传按钮点击事件
            uploadBtn.addEventListener('click', function() {
                fileInput.click();
            });

            // 文件选择事件
            fileInput.addEventListener('change', function(e) {
                handleFiles(e.target.files);
            });

            // 拖拽上传事件
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                uploadArea.addEventListener(eventName, preventDefaults, false);
            });

            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }

            ['dragenter', 'dragover'].forEach(eventName => {
                uploadArea.addEventListener(eventName, highlight, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                uploadArea.addEventListener(eventName, unhighlight, false);
            });

            function highlight() {
                uploadArea.style.backgroundColor = 'rgba(0, 113, 227, 0.1)';
            }

            function unhighlight() {
                uploadArea.style.backgroundColor = 'transparent';
            }

            uploadArea.addEventListener('drop', function(e) {
                const dt = e.dataTransfer;
                const files = dt.files;
                handleFiles(files);
            });

            // 处理上传的文件
            function handleFiles(files) {
                [...files].forEach(file => {
                    if (file.type.match('image.*')) {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            const img = new Image();
                            img.onload = function() {
                                images.push({
                                    src: e.target.result,
                                    width: img.width,
                                    height: img.height
                                });
                                updateImageList();
                            };
                            img.src = e.target.result;
                        };
                        reader.readAsDataURL(file);
                    }
                });
            }

            // 更新图片列表
            function updateImageList() {
                imageList.innerHTML = '';
                images.forEach((image, index) => {
                    const imageItem = document.createElement('div');
                    imageItem.className = 'image-item';
                    imageItem.setAttribute('data-index', index);

                    const img = document.createElement('img');
                    img.src = image.src;
                    img.alt = `图片 ${index + 1}`;

                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'remove-image';
                    removeBtn.innerHTML = '×';
                    removeBtn.addEventListener('click', function() {
                        images.splice(index, 1);
                        updateImageList();
                    });

                    imageItem.appendChild(img);
                    imageItem.appendChild(removeBtn);
                    imageList.appendChild(imageItem);
                });
            }

            // 滑块事件
            spacingSlider.addEventListener('input', function() {
                spacingValue.textContent = this.value;
            });

            cropSlider.addEventListener('input', function() {
                cropValue.textContent = this.value;
            });

            // 生成拼图按钮事件
            generateBtn.addEventListener('click', function() {
                if (images.length === 0) {
                    alert('请先上传图片');
                    return;
                }

                generatePuzzle();
            });

            // 清空按钮事件
            clearBtn.addEventListener('click', function() {
                images = [];
                updateImageList();
                previewContainer.innerHTML = '<div class="no-image"><p>拼图预览将在这里显示</p></div>';
            });

            // 生成拼图
            function generatePuzzle() {
                // 显示加载状态
                previewContainer.innerHTML = '<div class="no-image"><p>正在生成拼图...</p></div>';

                // 获取设置值
                const spacing = parseInt(spacingSlider.value);
                const cropRatio = parseInt(cropSlider.value) / 100;

                // 创建画布
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                // 计算画布尺寸
                let maxWidth = 0;
                let totalHeight = 0;

                images.forEach((image, index) => {
                    if (index === 0) {
                        // 第一张图保留完整
                        maxWidth = Math.max(maxWidth, image.width);
                        totalHeight += image.height;
                    } else {
                        // 其余图只保留底部的字幕区域
                        const cropHeight = Math.floor(image.height * cropRatio);
                        maxWidth = Math.max(maxWidth, image.width);
                        totalHeight += cropHeight;
                    }

                    // 添加间距
                    if (index > 0) {
                        totalHeight += spacing;
                    }
                });

                // 设置画布尺寸
                canvas.width = maxWidth;
                canvas.height = totalHeight;

                // 绘制图片
                let currentY = 0;

                images.forEach((image, index) => {
                    const img = new Image();
                    img.onload = function() {
                        if (index === 0) {
                            // 绘制第一张完整图片
                            ctx.drawImage(
                                img,
                                0, 0, image.width, image.height,
                                0, currentY, image.width, image.height
                            );
                            currentY += image.height;
                        } else {
                            // 只保留底部的字幕区域
                            const cropHeight = Math.floor(image.height * cropRatio);
                            const cropY = image.height - cropHeight;

                            // 绘制图片
                            ctx.drawImage(
                                img,
                                0, cropY, image.width, cropHeight,
                                0, currentY, image.width, cropHeight
                            );

                            currentY += cropHeight;
                        }

                        // 添加间距
                        if (index < images.length - 1) {
                            currentY += spacing;
                        }

                        // 所有图片绘制完成后
                        if (index === images.length - 1) {
                            // 显示结果
                            const previewImage = document.createElement('img');
                            previewImage.className = 'preview-image';
                            previewImage.src = canvas.toDataURL('image/png');
                            previewContainer.innerHTML = '';
                            previewContainer.appendChild(previewImage);
                        }
                    };
                    img.src = image.src;
                });
            }
        });
    </script>
</body>
</html>
