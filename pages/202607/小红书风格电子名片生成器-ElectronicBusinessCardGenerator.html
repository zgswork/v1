<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小红书风格电子名片生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #f9f7ff, #f0edff);
        }
        .color-option {
            width: 30px;
            height: 30px;
            display: inline-block;
            margin-right: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 50%;
        }
        .color-option.selected {
            border-color: #333;
            transform: scale(1.1);
        }
        #preview-container {
            width: 350px;
            height: 200px;
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        #logo-preview {
            max-width: 60px;
            max-height: 60px;
            border-radius: 50%;
            border: 2px solid white;
        }
        .template-card {
            transition: all 0.3s ease;
            border-radius: 12px;
            overflow: hidden;
        }
        .template-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }
        .step-indicator {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            background: #e0e7ff;
            color: #4f46e5;
            transition: all 0.3s ease;
        }
        .step-indicator.active {
            background: #4f46e5;
            color: white;
        }
        .btn-primary {
            background: #4f46e5;
            color: white;
            border-radius: 9999px;
            padding: 10px 24px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        .btn-primary:hover {
            background: #4338ca;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        .btn-outline {
            background: white;
            color: #4f46e5;
            border: 2px solid #4f46e5;
            border-radius: 9999px;
            padding: 10px 24px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .btn-outline:hover {
            background: #f5f3ff;
            transform: translateY(-2px);
        }
        .card-preview {
            transition: all 0.3s ease;
            transform-origin: center;
        }
        .card-preview:hover {
            transform: scale(1.03);
        }
        .header-gradient {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <div class="container mx-auto px-4 py-8 flex-grow">
        <div class="max-w-3xl mx-auto text-center mb-10">
            <h1 class="text-4xl font-bold mb-3 header-gradient">电子名片生成器</h1>
            <p class="text-lg text-gray-600">打造你的专属小红书风格名片，轻松展示个人品牌</p>
        </div>
        
        <!-- 步骤指示器 -->
        <div class="flex justify-center mb-10">
            <div class="flex items-center">
                <div class="step-indicator active" data-step="1">1</div>
                <div class="h-1 w-16 bg-gray-300 mx-2"></div>
                <div class="step-indicator" data-step="2">2</div>
                <div class="h-1 w-16 bg-gray-300 mx-2"></div>
                <div class="step-indicator" data-step="3">3</div>
            </div>
        </div>
        
        <!-- 步骤1: 选择模板 -->
        <div id="step1" class="step-content active">
            <div class="bg-white rounded-2xl shadow-lg p-6 mb-8">
                <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">选择名片模板</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <!-- 模板1 -->
                    <div class="template-card cursor-pointer" data-template="1">
                        <div class="bg-gradient-to-r from-pink-400 to-pink-600 h-40 flex items-center justify-center">
                            <div class="text-white text-center px-4">
                                <p class="text-xl font-bold">姓名</p>
                                <p class="text-sm mt-1">职位/公司</p>
                            </div>
                        </div>
                        <div class="p-4 bg-white">
                            <p class="text-gray-700 font-medium">简约粉色</p>
                            <p class="text-gray-500 text-sm mt-1">小红书博主最爱</p>
                        </div>
                    </div>
                    
                    <!-- 模板2 -->
                    <div class="template-card cursor-pointer" data-template="2">
                        <div class="bg-gradient-to-r from-gray-800 to-gray-900 h-40 flex items-center justify-center">
                            <div class="text-white text-center px-4">
                                <p class="text-xl font-bold">姓名</p>
                                <p class="text-sm mt-1">职位/公司</p>
                            </div>
                        </div>
                        <div class="p-4 bg-white">
                            <p class="text-gray-700 font-medium">商务黑色</p>
                            <p class="text-gray-500 text-sm mt-1">专业职场人士</p>
                        </div>
                    </div>
                    
                    <!-- 模板3 -->
                    <div class="template-card cursor-pointer" data-template="3">
                        <div class="bg-gradient-to-r from-blue-400 to-purple-500 h-40 flex items-center justify-center">
                            <div class="text-white text-center px-4">
                                <p class="text-xl font-bold">姓名</p>
                                <p class="text-sm mt-1">职位/公司</p>
                            </div>
                        </div>
                        <div class="p-4 bg-white">
                            <p class="text-gray-700 font-medium">渐变蓝紫</p>
                            <p class="text-gray-500 text-sm mt-1">创意工作者</p>
                        </div>
                    </div>
                </div>
                
                <div class="text-center">
                    <button id="customDesignBtn" class="btn-outline">
                        <i class="fas fa-paint-brush mr-2"></i>自定义设计
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 步骤2: 填写信息 -->
        <div id="step2" class="step-content hidden">
            <div class="bg-white rounded-2xl shadow-lg p-6">
                <div class="flex flex-col md:flex-row gap-8">
                    <div class="md:w-1/2">
                        <h2 class="text-2xl font-bold text-gray-800 mb-6">填写个人信息</h2>
                        <form id="infoForm" class="space-y-5">
                            <div>
                                <label class="block text-gray-700 mb-2 font-medium">姓名 <span class="text-red-500">*</span></label>
                                <input type="text" id="name" class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-indigo-300 focus:border-indigo-500" required>
                            </div>
                            <div>
                                <label class="block text-gray-700 mb-2 font-medium">职位 <span class="text-red-500">*</span></label>
                                <input type="text" id="title" class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-indigo-300 focus:border-indigo-500" required>
                            </div>
                            <div>
                                <label class="block text-gray-700 mb-2 font-medium">公司</label>
                                <input type="text" id="company" class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-indigo-300 focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="block text-gray-700 mb-2 font-medium">电话</label>
                                <input type="tel" id="phone" class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-indigo-300 focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="block text-gray-700 mb-2 font-medium">邮箱</label>
                                <input type="email" id="email" class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-indigo-300 focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="block text-gray-700 mb-2 font-medium">小红书账号</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">@</span>
                                    <input type="text" id="xiaohongshu" class="w-full pl-8 px-4 py-3 border rounded-xl focus:ring-2 focus:ring-indigo-300 focus:border-indigo-500" placeholder="username">
                                </div>
                            </div>
                            <div>
                                <label class="block text-gray-700 mb-2 font-medium">个人简介 (100字以内)</label>
                                <textarea id="bio" rows="3" maxlength="100" class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-indigo-300 focus:border-indigo-500"></textarea>
                                <p class="text-right text-sm text-gray-500 mt-1"><span id="bio-counter">0</span>/100</p>
                            </div>
                            <div>
                                <label class="block text-gray-700 mb-2 font-medium">上传LOGO/头像</label>
                                <div class="flex items-center">
                                    <label for="logoUpload" class="cursor-pointer bg-gray-100 hover:bg-gray-200 rounded-xl px-4 py-2 transition">
                                        <i class="fas fa-cloud-upload-alt mr-2 text-indigo-600"></i>选择图片
                                    </label>
                                    <input type="file" id="logoUpload" accept="image/*" class="hidden">
                                    <span id="fileName" class="ml-3 text-sm text-gray-500 truncate max-w-xs">未选择文件</span>
                                </div>
                            </div>
                        </form>
                        
                        <div class="mt-8 flex justify-between">
                            <button id="backToStep1" class="btn-outline">
                                <i class="fas fa-arrow-left mr-2"></i>上一步
                            </button>
                            <button id="goToStep3" class="btn-primary">
                                下一步 <i class="fas fa-arrow-right ml-2"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="md:w-1/2">
                        <h2 class="text-2xl font-bold text-gray-800 mb-6">名片预览</h2>
                        <div class="flex justify-center mb-6">
                            <div id="preview-container" class="card-preview">
                                <div id="preview-background" class="h-full w-full p-6 flex flex-col justify-between">
                                    <div id="preview-header" class="flex justify-between items-start">
                                        <div>
                                            <h3 id="preview-name" class="text-2xl font-bold text-white">姓名</h3>
                                            <p id="preview-title" class="text-white mt-1">职位</p>
                                            <p id="preview-company" class="text-white opacity-80 mt-1">公司</p>
                                        </div>
                                        <img id="logo-preview" src="" alt="LOGO" class="rounded-full border-2 border-white">
                                    </div>
                                    <div id="preview-footer" class="text-white text-sm">
                                        <p id="preview-phone" class="mb-2"><i class="fas fa-phone-alt mr-2"></i> <span>电话</span></p>
                                        <p id="preview-email" class="mb-2"><i class="fas fa-envelope mr-2"></i> <span>邮箱</span></p>
                                        <p id="preview-xiaohongshu" class="mb-2"><i class="fab fa-weixin mr-2"></i> <span>小红书</span></p>
                                        <p id="preview-bio" class="mt-3 opacity-90 border-t border-white border-opacity-30 pt-3">个人简介将显示在这里...</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 自定义设计选项 -->
                        <div id="custom-design-options" class="bg-gray-50 rounded-xl p-5">
                            <h3 class="font-bold text-lg text-gray-800 mb-4">自定义设计</h3>
                            <div class="space-y-5">
                                <div>
                                    <label class="block text-gray-700 mb-3 font-medium">背景颜色</label>
                                    <div class="flex flex-wrap gap-3">
                                        <div class="color-option selected" style="background-color: #EC4899;" data-color="#EC4899"></div>
                                        <div class="color-option" style="background-color: #4F46E5;" data-color="#4F46E5"></div>
                                        <div class="color-option" style="background-color: #10B981;" data-color="#10B981"></div>
                                        <div class="color-option" style="background-color: #F59E0B;" data-color="#F59E0B"></div>
                                        <div class="color-option" style="background-color: #111827;" data-color="#111827"></div>
                                        <div class="color-option" style="background-color: #8B5CF6;" data-color="#8B5CF6"></div>
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-gray-700 mb-3 font-medium">文字颜色</label>
                                    <div class="flex flex-wrap gap-3">
                                        <div class="color-option selected" style="background-color: #FFFFFF;" data-text-color="#FFFFFF"></div>
                                        <div class="color-option" style="background-color: #F3F4F6;" data-text-color="#F3F4F6"></div>
                                        <div class="color-option" style="background-color: #FDE68A;" data-text-color="#FDE68A"></div>
                                        <div class="color-option" style="background-color: #000000;" data-text-color="#000000"></div>
                                        <div class="color-option" style="background-color: #DBEAFE;" data-text-color="#DBEAFE"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 步骤3: 导出名片 -->
        <div id="step3" class="step-content hidden">
            <div class="bg-white rounded-2xl shadow-lg p-8 max-w-3xl mx-auto">
                <div class="text-center">
                    <h2 class="text-3xl font-bold text-gray-800 mb-2">你的名片已准备好!</h2>
                    <p class="text-gray-600 mb-8">选择下面的方式保存或分享你的名片</p>
                    
                    <div class="flex justify-center mb-10">
                        <div id="final-preview" class="card-preview shadow-xl rounded-xl overflow-hidden transform scale-110">
                            <!-- 预览内容将通过JS动态插入 -->
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-8">
                        <button id="download-png" class="btn-primary flex flex-col items-center justify-center py-5">
                            <i class="fas fa-download text-2xl mb-2"></i>
                            下载PNG图片
                        </button>
                        
                        <button id="copy-to-clipboard" class="btn-outline flex flex-col items-center justify-center py-5">
                            <i class="far fa-copy text-2xl mb-2"></i>
                            复制到剪贴板
                        </button>
                        
                        <button id="share-xiaohongshu" class="btn-primary bg-pink-500 border-pink-500 flex flex-col items-center justify-center py-5">
                            <i class="fab fa-weixin text-2xl mb-2"></i>
                            小红书分享
                        </button>
                    </div>
                    
                    <div id="share-text" class="hidden bg-pink-50 border border-pink-200 rounded-xl p-5 text-left mb-6">
                        <p class="font-bold text-pink-700 mb-3">复制以下文案分享到小红书:</p>
                        <div id="share-content" class="bg-white p-4 rounded-lg text-sm mb-3 leading-relaxed"></div>
                        <button id="copy-share-text" class="text-pink-600 font-medium hover:text-pink-800">
                            <i class="far fa-copy mr-2"></i>复制文案
                        </button>
                    </div>
                    
                    <button id="backToStep2" class="btn-outline mt-4">
                        <i class="fas fa-edit mr-2"></i>返回修改
                    </button>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-white py-6 border-t border-gray-200">
        <div class="container mx-auto px-4 text-center">
            <p class="text-gray-600">© 2023 小红书电子名片生成器 | 轻松打造个人品牌</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 全局变量
            let currentStep = 1;
            let selectedTemplate = null;
            let isCustomDesign = false;
            let cardBackgroundColor = '#EC4899';
            let textColor = '#FFFFFF';
            let logoUrl = '';
            
            // DOM元素
            const step1 = document.getElementById('step1');
            const step2 = document.getElementById('step2');
            const step3 = document.getElementById('step3');
            const stepIndicators = document.querySelectorAll('.step-indicator');
            const templateCards = document.querySelectorAll('.template-card');
            const customDesignBtn = document.getElementById('customDesignBtn');
            const backToStep1 = document.getElementById('backToStep1');
            const goToStep3 = document.getElementById('goToStep3');
            const backToStep2 = document.getElementById('backToStep2');
            const infoForm = document.getElementById('infoForm');
            const finalPreview = document.getElementById('final-preview');
            const downloadPngBtn = document.getElementById('download-png');
            const copyToClipboardBtn = document.getElementById('copy-to-clipboard');
            const shareXiaohongshuBtn = document.getElementById('share-xiaohongshu');
            const shareText = document.getElementById('share-text');
            const shareContent = document.getElementById('share-content');
            const copyShareTextBtn = document.getElementById('copy-share-text');
            const customDesignOptions = document.getElementById('custom-design-options');
            const colorOptions = document.querySelectorAll('.color-option');
            const logoUpload = document.getElementById('logoUpload');
            const fileName = document.getElementById('fileName');
            const bioTextarea = document.getElementById('bio');
            const bioCounter = document.getElementById('bio-counter');
            
            // 模板选择
            templateCards.forEach(card => {
                card.addEventListener('click', function() {
                    templateCards.forEach(c => c.classList.remove('ring-2', 'ring-indigo-500'));
                    this.classList.add('ring-2', 'ring-indigo-500');
                    selectedTemplate = this.getAttribute('data-template');
                    isCustomDesign = false;
                    customDesignOptions.classList.add('hidden');
                    
                    // 根据模板设置背景色
                    switch(selectedTemplate) {
                        case '1':
                            cardBackgroundColor = '#EC4899';
                            break;
                        case '2':
                            cardBackgroundColor = '#111827';
                            break;
                        case '3':
                            cardBackgroundColor = '#4F46E5';
                            break;
                    }
                    
                    updatePreview();
                });
            });
            
            // 自定义设计
            customDesignBtn.addEventListener('click', function() {
                selectedTemplate = null;
                isCustomDesign = true;
                customDesignOptions.classList.remove('hidden');
                updatePreview();
                goToStep(2);
            });
            
            // 颜色选择
            colorOptions.forEach(option => {
                option.addEventListener('click', function() {
                    if (this.hasAttribute('data-color')) {
                        // 背景颜色选择
                        document.querySelectorAll('.color-option[data-color]').forEach(opt => {
                            opt.classList.remove('selected');
                        });
                        cardBackgroundColor = this.getAttribute('data-color');
                    } else if (this.hasAttribute('data-text-color')) {
                        // 文字颜色选择
                        document.querySelectorAll('.color-option[data-text-color]').forEach(opt => {
                            opt.classList.remove('selected');
                        });
                        textColor = this.getAttribute('data-text-color');
                    }
                    this.classList.add('selected');
                    updatePreview();
                });
            });
            
            // LOGO上传
            logoUpload.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    fileName.textContent = file.name;
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        logoUrl = event.target.result;
                        document.getElementById('logo-preview').src = logoUrl;
                    };
                    reader.readAsDataURL(file);
                }
            });
            
            // 个人简介字数统计
            bioTextarea.addEventListener('input', function() {
                const count = this.value.length;
                bioCounter.textContent = count;
                document.getElementById('preview-bio').textContent = this.value;
            });
            
            // 表单输入实时预览
            infoForm.addEventListener('input', function(e) {
                const id = e.target.id;
                const value = e.target.value;
                
                switch(id) {
                    case 'name':
                        document.getElementById('preview-name').textContent = value || '姓名';
                        break;
                    case 'title':
                        document.getElementById('preview-title').textContent = value || '职位';
                        break;
                    case 'company':
                        document.getElementById('preview-company').textContent = value || '公司';
                        break;
                    case 'phone':
                        document.getElementById('preview-phone').innerHTML = value ? 
                            `<i class="fas fa-phone-alt mr-2"></i> ${value}` : 
                            '<i class="fas fa-phone-alt mr-2"></i> 电话';
                        break;
                    case 'email':
                        document.getElementById('preview-email').innerHTML = value ? 
                            `<i class="fas fa-envelope mr-2"></i> ${value}` : 
                            '<i class="fas fa-envelope mr-2"></i> 邮箱';
                        break;
                    case 'xiaohongshu':
                        document.getElementById('preview-xiaohongshu').innerHTML = value ? 
                            `<i class="fab fa-weixin mr-2"></i> ${value.startsWith('@') ? value : '@' + value}` : 
                            '<i class="fab fa-weixin mr-2"></i> 小红书';
                        break;
                }
            });
            
            // 更新预览样式
            function updatePreview() {
                const previewBackground = document.getElementById('preview-background');
                previewBackground.style.backgroundColor = cardBackgroundColor;
                
                // 应用文字颜色到所有文本元素
                const textElements = previewBackground.querySelectorAll('h3, p, i, span');
                textElements.forEach(el => {
                    el.style.color = textColor;
                });
                
                // 更新LOGO边框颜色
                const logoPreview = document.getElementById('logo-preview');
                if (logoPreview) {
                    logoPreview.style.borderColor = textColor;
                }
            }
            
            // 生成最终预览
            function generateFinalPreview() {
                // 直接复制预览容器，保持样式一致
                const previewContainer = document.getElementById('preview-container');
                finalPreview.innerHTML = previewContainer.outerHTML;
                
                // 调整尺寸以适应第三步的显示
                finalPreview.firstElementChild.style.transform = 'scale(1)';
                finalPreview.firstElementChild.style.margin = '0 auto';
            }
            
            // 下载PNG
            downloadPngBtn.addEventListener('click', function() {
                const element = finalPreview.firstElementChild;
                
                // 显示加载提示
                const originalText = downloadPngBtn.innerHTML;
                downloadPngBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>生成中...';
                downloadPngBtn.disabled = true;
                
                // 添加一个小延迟确保DOM更新
                setTimeout(() => {
                    html2canvas(element, {
                        scale: 3,
                        logging: true,
                        useCORS: true,
                        allowTaint: true,
                        backgroundColor: null
                    }).then(canvas => {
                        try {
                            const link = document.createElement('a');
                            link.download = '我的电子名片.png';
                            link.href = canvas.toDataURL('image/png');
                            link.click();
                        } catch (err) {
                            console.error('下载失败:', err);
                            alert('下载失败，请重试');
                        } finally {
                            // 恢复按钮状态
                            downloadPngBtn.innerHTML = originalText;
                            downloadPngBtn.disabled = false;
                        }
                    }).catch(err => {
                        console.error('生成图片失败:', err);
                        alert('生成图片失败: ' + err.message);
                        downloadPngBtn.innerHTML = originalText;
                        downloadPngBtn.disabled = false;
                    });
                }, 100);
            });
            
            // 复制到剪贴板
            copyToClipboardBtn.addEventListener('click', function() {
                const element = finalPreview.firstElementChild;
                
                // 显示加载提示
                const originalText = copyToClipboardBtn.innerHTML;
                copyToClipboardBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>复制中...';
                copyToClipboardBtn.disabled = true;
                
                html2canvas(element, {
                    scale: 2,
                    logging: false,
                    useCORS: true,
                    backgroundColor: cardBackgroundColor
                }).then(canvas => {
                    canvas.toBlob(function(blob) {
                        const item = new ClipboardItem({ 'image/png': blob });
                        navigator.clipboard.write([item]).then(function() {
                            alert('名片已复制到剪贴板!');
                            
                            // 恢复按钮文本
                            copyToClipboardBtn.innerHTML = originalText;
                            copyToClipboardBtn.disabled = false;
                        });
                    });
                }).catch(err => {
                    console.error('复制失败:', err);
                    alert('复制失败，请重试');
                    copyToClipboardBtn.innerHTML = originalText;
                    copyToClipboardBtn.disabled = false;
                });
            });
            
            // 生成小红书分享文案
            shareXiaohongshuBtn.addEventListener('click', function() {
                const name = document.getElementById('name').value || '姓名';
                const title = document.getElementById('title').value || '职位';
                const company = document.getElementById('company').value;
                const xiaohongshu = document.getElementById('xiaohongshu').value;
                
                let text = `✨ 刚刚创建了我的专属电子名片 ✨\n\n`;
                text += `👤 ${name} | ${title}${company ? ` @ ${company}` : ''}\n\n`;
                text += `用这个超方便的小工具制作你的专属名片吧~ 支持多种风格模板和自定义设计，一键导出分享超方便！\n\n`;
                text += `#电子名片 #职场工具 #个人品牌 #小红书创作 #职场必备`;
                
                if (xiaohongshu) {
                    text += ` ${xiaohongshu.startsWith('@') ? xiaohongshu : '@' + xiaohongshu}`;
                }
                
                shareContent.textContent = text;
                shareText.classList.remove('hidden');
            });
            
            // 复制分享文案
            copyShareTextBtn.addEventListener('click', function() {
                const textArea = document.createElement('textarea');
                textArea.value = shareContent.textContent;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                
                const originalText = copyShareTextBtn.textContent;
                copyShareTextBtn.innerHTML = '<i class="fas fa-check mr-2"></i>已复制!';
                setTimeout(() => {
                    copyShareTextBtn.innerHTML = originalText;
                }, 2000);
            });
            
            // 步骤导航
            function goToStep(step) {
                currentStep = step;
                
                // 更新步骤指示器
                stepIndicators.forEach(indicator => {
                    if (parseInt(indicator.getAttribute('data-step')) <= step) {
                        indicator.classList.add('active');
                    } else {
                        indicator.classList.remove('active');
                    }
                });
                
                // 显示/隐藏步骤内容
                step1.classList.toggle('hidden', step !== 1);
                step2.classList.toggle('hidden', step !== 2);
                step3.classList.toggle('hidden', step !== 3);
                
                // 如果是第三步，生成最终预览
                if (step === 3) {
                    generateFinalPreview();
                }
            }
            
            // 导航按钮事件
            backToStep1.addEventListener('click', () => goToStep(1));
            goToStep3.addEventListener('click', () => {
                if (infoForm.checkValidity()) {
                    goToStep(3);
                } else {
                    alert('请填写必填信息（姓名和职位）');
                }
            });
            backToStep2.addEventListener('click', () => goToStep(2));
            
            // 初始化
            updatePreview();
        });
    </script>
</body>
</html>
