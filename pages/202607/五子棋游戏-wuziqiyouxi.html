<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋游戏</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#8B4513',
                        secondary: '#D2B48C',
                        board: '#DEB887',
                        highlight: '#FFD700',
                        success: '#10B981',
                        warning: '#F59E0B',
                        dark: '#1F2937',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .board-grid {
                background-image: linear-gradient(#000 1px, transparent 1px),
                                linear-gradient(90deg, #000 1px, transparent 1px);
            }
            .piece-shadow {
                filter: drop-shadow(0 4px 3px rgb(0 0 0 / 0.07)) drop-shadow(0 2px 2px rgb(0 0 0 / 0.06));
            }
            .win-line {
                animation: pulse 1.5s infinite;
            }
            @keyframes pulse {
                0%, 100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.5;
                }
            }
            .piece-appear {
                animation: appear 0.3s ease-out;
            }
            @keyframes appear {
                0% {
                    transform: scale(0);
                    opacity: 0;
                }
                70% {
                    transform: scale(1.1);
                }
                100% {
                    transform: scale(1);
                    opacity: 1;
                }
            }
            .btn-hover {
                @apply transition-all duration-150 hover:scale-105 active:scale-95;
            }
            .panel-transition {
                @apply transition-all duration-300 ease-in-out;
            }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-4 md:p-6">
    <!-- 游戏标题 -->
    <header class="w-full max-w-5xl mb-6 text-center">
        <h1 class="text-[clamp(1.8rem,5vw,2.8rem)] font-bold text-primary mb-2">五子棋游戏</h1>
        <p class="text-gray-600 text-sm md:text-base">经典对弈策略游戏，先形成五子连线者获胜</p>
    </header>

    <!-- 主要内容区 -->
    <main class="w-full max-w-5xl flex flex-col lg:flex-row gap-6 items-center lg:items-start">
        <!-- 游戏区域 -->
        <div class="w-full lg:w-2/3 flex flex-col items-center">
            <!-- 游戏控制区 -->
            <div class="w-full flex flex-wrap justify-between items-center mb-4 gap-2">
                <div class="flex items-center gap-3">
                    <button id="startBtn" class="bg-primary text-white px-4 py-2 rounded-md shadow-md btn-hover flex items-center gap-1">
                        <i class="fa fa-play"></i>
                        <span>开始游戏</span>
                    </button>
                    <button id="restartBtn" class="bg-gray-600 text-white px-4 py-2 rounded-md shadow-md btn-hover flex items-center gap-1">
                        <i class="fa fa-refresh"></i>
                        <span>重新开始</span>
                    </button>
                    <button id="undoBtn" class="bg-gray-600 text-white px-4 py-2 rounded-md shadow-md btn-hover flex items-center gap-1" disabled>
                        <i class="fa fa-undo"></i>
                        <span>悔棋</span>
                    </button>
                </div>
                <div class="flex items-center gap-3">
                    <select id="modeSelect" class="bg-white border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary/50">
                        <option value="pvp">双人对战</option>
                        <option value="ai">人机对战</option>
                    </select>
                    <select id="difficultySelect" class="bg-white border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary/50" disabled>
                        <option value="easy">简单</option>
                        <option value="medium">中等</option>
                        <option value="hard">困难</option>
                    </select>
                </div>
            </div>

            <!-- 棋盘容器 -->
            <div class="relative">
                <div id="boardContainer" class="bg-board rounded-lg shadow-lg overflow-hidden board-grid">
                    <canvas id="gameCanvas" class="block"></canvas>
                </div>
                <!-- 游戏状态覆盖层 -->
                <div id="gameStatusOverlay" class="absolute inset-0 bg-black/50 flex flex-col items-center justify-center opacity-0 pointer-events-none panel-transition">
                    <div id="statusMessage" class="text-white text-xl md:text-2xl font-bold mb-4 text-center px-4"></div>
                    <button id="overlayRestartBtn" class="bg-success text-white px-6 py-3 rounded-md shadow-lg btn-hover">
                        再来一局
                    </button>
                </div>
            </div>

            <!-- 当前玩家指示器 -->
            <div class="mt-4 w-full flex justify-center items-center gap-3">
                <div id="currentPlayerIndicator" class="flex items-center gap-2 bg-white px-4 py-2 rounded-full shadow-md">
                    <div id="playerPiece" class="w-6 h-6 rounded-full bg-black piece-shadow"></div>
                    <span id="playerTurnText" class="font-medium">黑方回合</span>
                </div>
                <div id="gameStatus" class="text-success font-medium hidden">
                    <i class="fa fa-check-circle"></i> 游戏进行中
                </div>
            </div>
        </div>

        <!-- 游戏信息侧边栏 -->
        <aside class="w-full lg:w-1/3 bg-white rounded-lg shadow-md p-4 panel-transition">
            <h2 class="text-lg font-bold text-dark mb-3 flex items-center">
                <i class="fa fa-info-circle text-primary mr-2"></i>
                游戏信息
            </h2>
            
            <!-- 游戏统计 -->
            <div class="mb-4">
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-gray-50 p-3 rounded-md">
                        <p class="text-sm text-gray-500">黑方胜场</p>
                        <p id="blackWins" class="text-xl font-bold text-black">0</p>
                    </div>
                    <div class="bg-gray-50 p-3 rounded-md">
                        <p class="text-sm text-gray-500">白方胜场</p>
                        <p id="whiteWins" class="text-xl font-bold text-white border border-gray-200 rounded-full inline-block w-10 h-10 flex items-center justify-center piece-shadow">0</p>
                    </div>
                </div>
            </div>
            
            <!-- 游戏规则 -->
            <div class="mb-4">
                <h3 class="text-md font-semibold text-dark mb-2">游戏规则</h3>
                <ul class="text-sm text-gray-600 space-y-1">
                    <li class="flex items-start gap-2">
                        <i class="fa fa-circle-o text-xs mt-1 text-primary"></i>
                        <span>黑方先手，双方轮流落子</span>
                    </li>
                    <li class="flex items-start gap-2">
                        <i class="fa fa-circle-o text-xs mt-1 text-primary"></i>
                        <span>先在一条直线上形成五子连线者获胜</span>
                    </li>
                    <li class="flex items-start gap-2">
                        <i class="fa fa-circle-o text-xs mt-1 text-primary"></i>
                        <span>支持横、竖、斜四个方向的连线</span>
                    </li>
                </ul>
            </div>
            
            <!-- 操作说明 -->
            <div>
                <h3 class="text-md font-semibold text-dark mb-2">操作说明</h3>
                <ul class="text-sm text-gray-600 space-y-1">
                    <li class="flex items-start gap-2">
                        <i class="fa fa-mouse-pointer text-xs mt-1 text-primary"></i>
                        <span>点击棋盘交叉点落子</span>
                    </li>
                    <li class="flex items-start gap-2">
                        <i class="fa fa-undo text-xs mt-1 text-primary"></i>
                        <span>悔棋：撤销上一步操作</span>
                    </li>
                    <li class="flex items-start gap-2">
                        <i class="fa fa-refresh text-xs mt-1 text-primary"></i>
                        <span>重新开始：清空棋盘重新对局</span>
                    </li>
                </ul>
            </div>
        </aside>
    </main>

    <!-- 移动设备控制按钮 -->
    <div class="lg:hidden fixed bottom-6 left-0 right-0 flex justify-center gap-2 px-4">
        <button id="mobileUndoBtn" class="bg-gray-600 text-white px-4 py-3 rounded-md shadow-lg btn-hover flex-1 max-w-[20%]">
            <i class="fa fa-undo"></i>
        </button>
        <div class="flex flex-col gap-2 flex-2 max-w-[40%]">
            <button id="mobileUpBtn" class="bg-primary text-white px-4 py-3 rounded-md shadow-lg btn-hover">
                <i class="fa fa-chevron-up"></i>
            </button>
            <div class="flex gap-2">
                <button id="mobileLeftBtn" class="bg-primary text-white px-4 py-3 rounded-md shadow-lg btn-hover flex-1">
                    <i class="fa fa-chevron-left"></i>
                </button>
                <button id="mobileRightBtn" class="bg-primary text-white px-4 py-3 rounded-md shadow-lg btn-hover flex-1">
                    <i class="fa fa-chevron-right"></i>
                </button>
            </div>
            <button id="mobileDownBtn" class="bg-primary text-white px-4 py-3 rounded-md shadow-lg btn-hover">
                <i class="fa fa-chevron-down"></i>
            </button>
        </div>
        <button id="mobileRestartBtn" class="bg-gray-600 text-white px-4 py-3 rounded-md shadow-lg btn-hover flex-1 max-w-[20%]">
            <i class="fa fa-refresh"></i>
        </button>
    </div>

    <!-- 页脚 -->
    <footer class="mt-12 w-full text-center text-gray-500 text-sm">
        <p>本工具由幸川制作</p>
        <p>微信号stevexing</p>
        <p>QQ邮箱<a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="99abadadaeacafafaeafd9e8e8b7faf6f4">[email&#160;protected]</a></p>
    </footer>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        document.addEventListener('DOMContentLoaded', () => {
            // 游戏常量
            const BOARD_SIZE = 15; // 15x15棋盘
            const EMPTY = 0;
            const BLACK = 1;
            const WHITE = 2;
            const CELL_SIZE = 24; // 每个格子的大小(px)
            const MARGIN = 20; // 边距(px)
            
            // 游戏状态
            let gameBoard = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(EMPTY));
            let currentPlayer = BLACK;
            let gameActive = false;
            let moveHistory = [];
            let gameMode = 'pvp';
            let aiDifficulty = 'medium';
            let winLine = [];
            let stats = {
                blackWins: 0,
                whiteWins: 0
            };
            
            // 获取DOM元素
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const startBtn = document.getElementById('startBtn');
            const restartBtn = document.getElementById('restartBtn');
            const undoBtn = document.getElementById('undoBtn');
            const modeSelect = document.getElementById('modeSelect');
            const difficultySelect = document.getElementById('difficultySelect');
            const currentPlayerIndicator = document.getElementById('currentPlayerIndicator');
            const playerPiece = document.getElementById('playerPiece');
            const playerTurnText = document.getElementById('playerTurnText');
            const gameStatus = document.getElementById('gameStatus');
            const gameStatusOverlay = document.getElementById('gameStatusOverlay');
            const statusMessage = document.getElementById('statusMessage');
            const overlayRestartBtn = document.getElementById('overlayRestartBtn');
            const blackWinsEl = document.getElementById('blackWins');
            const whiteWinsEl = document.getElementById('whiteWins');
            
            // 移动设备控制按钮
            const mobileUndoBtn = document.getElementById('mobileUndoBtn');
            const mobileRestartBtn = document.getElementById('mobileRestartBtn');
            
            // 初始化棋盘大小
            function initCanvasSize() {
                // 计算棋盘尺寸
                const totalSize = CELL_SIZE * (BOARD_SIZE - 1) + MARGIN * 2;
                
                // 设置canvas尺寸
                canvas.width = totalSize;
                canvas.height = totalSize;
                
                // 设置容器尺寸
                const boardContainer = document.getElementById('boardContainer');
                boardContainer.style.width = `${totalSize}px`;
                boardContainer.style.height = `${totalSize}px`;
                boardContainer.style.backgroundSize = `${CELL_SIZE}px ${CELL_SIZE}px`;
                boardContainer.style.backgroundPosition = `${MARGIN - 1}px ${MARGIN - 1}px`;
                
                // 根据屏幕尺寸调整棋盘大小
                const maxWidth = window.innerWidth * 0.9;
                const maxHeight = window.innerHeight * 0.7;
                const scale = Math.min(1, maxWidth / totalSize, maxHeight / totalSize);
                
                if (scale < 1) {
                    canvas.style.transform = `scale(${scale})`;
                    canvas.style.transformOrigin = 'top left';
                    boardContainer.style.width = `${totalSize * scale}px`;
                    boardContainer.style.height = `${totalSize * scale}px`;
                } else {
                    canvas.style.transform = 'none';
                }
            }
            
            // 初始化游戏
            function initGame() {
                // 重置游戏状态
                gameBoard = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(EMPTY));
                currentPlayer = BLACK;
                gameActive = true;
                moveHistory = [];
                winLine = [];
                
                // 更新UI状态
                updatePlayerIndicator();
                gameStatus.textContent = '游戏进行中';
                gameStatus.classList.remove('hidden', 'text-warning', 'text-success');
                gameStatus.classList.add('text-success');
                undoBtn.disabled = false;
                startBtn.disabled = true;
                startBtn.innerHTML = '<i class="fa fa-pause"></i><span>暂停游戏</span>';
                
                // 渲染棋盘
                renderBoard();
                
                // 如果是人机对战且轮到AI先手，AI下棋
                if (gameMode === 'ai' && currentPlayer === WHITE) {
                    setTimeout(aiMove, 500);
                }
            }
            
            // 渲染棋盘
            function renderBoard() {
                // 清空画布
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // 绘制棋盘背景和网格已经由CSS完成
                
                // 绘制棋子
                for (let i = 0; i < BOARD_SIZE; i++) {
                    for (let j = 0; j < BOARD_SIZE; j++) {
                        if (gameBoard[i][j] !== EMPTY) {
                            drawPiece(i, j, gameBoard[i][j]);
                        }
                    }
                }
                
                // 绘制最后落子的位置标记
                if (moveHistory.length > 0) {
                    const lastMove = moveHistory[moveHistory.length - 1];
                    drawLastMoveMarker(lastMove.row, lastMove.col);
                }
                
                // 绘制胜利连线
                if (winLine.length > 0) {
                    drawWinLine();
                }
            }
            
            // 绘制棋子
            function drawPiece(row, col, player) {
                const x = MARGIN + col * CELL_SIZE;
                const y = MARGIN + row * CELL_SIZE;
                const radius = CELL_SIZE / 2 - 2;
                
                // 绘制棋子主体
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.closePath();
                
                // 创建径向渐变，使棋子有立体感
                const gradient = ctx.createRadialGradient(
                    x - 3, y - 3, radius,
                    x + 2, y + 2, 0
                );
                
                if (player === BLACK) {
                    gradient.addColorStop(0, '#0A0A0A');
                    gradient.addColorStop(1, '#636766');
                } else {
                    gradient.addColorStop(0, '#D1D1D1');
                    gradient.addColorStop(1, '#F9F9F9');
                }
                
                ctx.fillStyle = gradient;
                ctx.fill();
                
                // 添加阴影效果
                ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
                ctx.shadowBlur = 5;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 2;
                
                // 绘制棋子边框
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.closePath();
                ctx.lineWidth = 1;
                ctx.strokeStyle = player === BLACK ? '#000' : '#A0A0A0';
                ctx.stroke();
                
                // 重置阴影
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;
            }
            
            // 绘制最后落子位置的标记
            function drawLastMoveMarker(row, col) {
                const x = MARGIN + col * CELL_SIZE;
                const y = MARGIN + row * CELL_SIZE;
                const radius = 4;
                
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fillStyle = '#FFD700';
                ctx.fill();
            }
            
            // 绘制胜利连线
            function drawWinLine() {
                ctx.beginPath();
                
                // 从第一个点开始
                const firstPoint = winLine[0];
                const startX = MARGIN + firstPoint.col * CELL_SIZE;
                const startY = MARGIN + firstPoint.row * CELL_SIZE;
                ctx.moveTo(startX, startY);
                
                // 连接所有胜利点
                for (let i = 1; i < winLine.length; i++) {
                    const point = winLine[i];
                    const x = MARGIN + point.col * CELL_SIZE;
                    const y = MARGIN + point.row * CELL_SIZE;
                    ctx.lineTo(x, y);
                }
                
                // 设置线条样式
                ctx.strokeStyle = '#FF0000';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                // 添加脉冲动画效果
                ctx.stroke();
            }
            
            // 更新当前玩家指示器
            function updatePlayerIndicator() {
                if (currentPlayer === BLACK) {
                    playerPiece.className = 'w-6 h-6 rounded-full bg-black piece-shadow';
                    playerTurnText.textContent = '黑方回合';
                    currentPlayerIndicator.className = 'flex items-center gap-2 bg-white px-4 py-2 rounded-full shadow-md';
                } else {
                    playerPiece.className = 'w-6 h-6 rounded-full bg-white border border-gray-200 piece-shadow';
                    playerTurnText.textContent = '白方回合';
                    currentPlayerIndicator.className = 'flex items-center gap-2 bg-white px-4 py-2 rounded-full shadow-md';
                }
            }
            
            // 切换玩家
            function switchPlayer() {
                currentPlayer = currentPlayer === BLACK ? WHITE : BLACK;
                updatePlayerIndicator();
                
                // 如果是人机对战且轮到AI
                if (gameMode === 'ai' && currentPlayer === WHITE) {
                    setTimeout(aiMove, 500);
                }
            }
            
            // 检查胜负
            function checkWin(row, col, player) {
                const directions = [
                    [0, 1],   // 水平
                    [1, 0],   // 垂直
                    [1, 1],   // 对角线
                    [1, -1]   // 反对角线
                ];
                
                for (const [dx, dy] of directions) {
                    let count = 1;
                    let line = [{row, col}];
                    
                    // 检查正方向
                    for (let i = 1; i <= 4; i++) {
                        const newRow = row + i * dx;
                        const newCol = col + i * dy;
                        
                        if (newRow < 0 || newRow >= BOARD_SIZE || newCol < 0 || newCol >= BOARD_SIZE || 
                            gameBoard[newRow][newCol] !== player) {
                            break;
                        }
                        
                        count++;
                        line.push({row: newRow, col: newCol});
                    }
                    
                    // 检查反方向
                    for (let i = 1; i <= 4; i++) {
                        const newRow = row - i * dx;
                        const newCol = col - i * dy;
                        
                        if (newRow < 0 || newRow >= BOARD_SIZE || newCol < 0 || newCol >= BOARD_SIZE || 
                            gameBoard[newRow][newCol] !== player) {
                            break;
                        }
                        
                        count++;
                        line.unshift({row: newRow, col: newCol});
                    }
                    
                    // 如果连成五子，游戏结束
                    if (count >= 5) {
                        winLine = line;
                        return true;
                    }
                }
                
                return false;
            }
            
            // 处理落子
            function placePiece(row, col) {
                // 检查位置是否合法
                if (!gameActive || gameBoard[row][col] !== EMPTY) {
                    return false;
                }
                
                // 记录历史
                moveHistory.push({row, col, player: currentPlayer});
                
                // 落子
                gameBoard[row][col] = currentPlayer;
                renderBoard();
                
                // 检查胜负
                if (checkWin(row, col, currentPlayer)) {
                    endGame(currentPlayer);
                    return true;
                }
                
                // 检查平局
                if (moveHistory.length === BOARD_SIZE * BOARD_SIZE) {
                    endGame(0); // 0表示平局
                    return true;
                }
                
                // 切换玩家
                switchPlayer();
                return true;
            }
            
            // 游戏结束
            function endGame(winner) {
                gameActive = false;
                undoBtn.disabled = true;
                startBtn.disabled = false;
                startBtn.innerHTML = '<i class="fa fa-play"></i><span>开始游戏</span>';
                
                if (winner === 0) {
                    // 平局
                    statusMessage.textContent = '平局！势均力敌的对局！';
                    gameStatus.textContent = '游戏已结束：平局';
                    gameStatus.classList.remove('text-success');
                    gameStatus.classList.add('text-warning');
                } else {
                    // 有赢家
                    const winnerText = winner === BLACK ? '黑方' : '白方';
                    statusMessage.textContent = `${winnerText}获胜！恭喜！`;
                    gameStatus.textContent = `游戏已结束：${winnerText}获胜`;
                    gameStatus.classList.remove('text-success');
                    gameStatus.classList.add('text-warning');
                    
                    // 更新统计
                    if (winner === BLACK) {
                        stats.blackWins++;
                        blackWinsEl.textContent = stats.blackWins;
                    } else {
                        stats.whiteWins++;
                        whiteWinsEl.textContent = stats.whiteWins;
                    }
                    
                    // 保存统计到本地存储
                    saveStats();
                }
                
                // 显示胜利连线
                renderBoard();
                
                // 显示游戏结束覆盖层
                setTimeout(() => {
                    gameStatusOverlay.classList.remove('opacity-0', 'pointer-events-none');
                }, 500);
            }
            
            // 悔棋
            function undoMove() {
                if (!gameActive || moveHistory.length === 0) {
                    return;
                }
                
                const lastMove = moveHistory.pop();
                gameBoard[lastMove.row][lastMove.col] = EMPTY;
                currentPlayer = lastMove.player; // 回到上一个玩家
                updatePlayerIndicator();
                renderBoard();
                
                // 如果是人机对战，再悔一步（AI的步）
                if (gameMode === 'ai' && moveHistory.length > 0) {
                    const aiMove = moveHistory.pop();
                    gameBoard[aiMove.row][aiMove.col] = EMPTY;
                    currentPlayer = aiMove.player; // 回到玩家
                    updatePlayerIndicator();
                    renderBoard();
                }
            }
            
            // 保存统计数据到本地存储
            function saveStats() {
                localStorage.setItem('gomokuStats', JSON.stringify(stats));
            }
            
            // 从本地存储加载统计数据
            function loadStats() {
                const savedStats = localStorage.getItem('gomokuStats');
                if (savedStats) {
                    stats = JSON.parse(savedStats);
                    blackWinsEl.textContent = stats.blackWins;
                    whiteWinsEl.textContent = stats.whiteWins;
                }
            }
            
            // 棋盘坐标转换为画布坐标
            function boardToCanvas(row, col) {
                return {
                    x: MARGIN + col * CELL_SIZE,
                    y: MARGIN + row * CELL_SIZE
                };
            }
            
            // 画布坐标转换为棋盘坐标
            function canvasToBoard(x, y) {
                // 计算最近的交叉点
                const col = Math.round((x - MARGIN) / CELL_SIZE);
                const row = Math.round((y - MARGIN) / CELL_SIZE);
                
                // 检查是否在有效范围内
                if (row < 0 || row >= BOARD_SIZE || col < 0 || col >= BOARD_SIZE) {
                    return null;
                }
                
                // 检查是否足够接近交叉点
                const {x: boardX, y: boardY} = boardToCanvas(row, col);
                const distance = Math.sqrt(Math.pow(x - boardX, 2) + Math.pow(y - boardY, 2));
                
                if (distance < CELL_SIZE / 2) {
                    return {row, col};
                }
                
                return null;
            }
            
            // AI走子（简单实现）
            function aiMove() {
                if (!gameActive || currentPlayer !== WHITE) {
                    return;
                }
                
                let move;
                
                // 根据难度选择不同的AI策略
                switch (aiDifficulty) {
                    case 'easy':
                        move = findRandomMove();
                        break;
                    case 'medium':
                        // 中等难度：尝试进攻，否则防守，否则随机
                        move = findWinningMove(WHITE) || findWinningMove(BLACK) || findRandomMove();
                        break;
                    case 'hard':
                        // 困难难度：优先进攻，然后防守，然后寻找双三、双四等有利局面
                        move = findWinningMove(WHITE) || findWinningMove(BLACK) || 
                               findForkMove(WHITE) || findForkMove(BLACK) || 
                               findCenterMove() || findRandomMove();
                        break;
                }
                
                if (move) {
                    setTimeout(() => {
                        placePiece(move.row, move.col);
                    }, 300);
                }
            }
            
            // 寻找随机空位
            function findRandomMove() {
                const emptyPositions = [];
                
                for (let i = 0; i < BOARD_SIZE; i++) {
                    for (let j = 0; j < BOARD_SIZE; j++) {
                        if (gameBoard[i][j] === EMPTY) {
                            emptyPositions.push({row: i, col: j});
                        }
                    }
                }
                
                if (emptyPositions.length > 0) {
                    const randomIndex = Math.floor(Math.random() * emptyPositions.length);
                    return emptyPositions[randomIndex];
                }
                
                return null;
            }
            
            // 寻找中心区域的位置
            function findCenterMove() {
                const centerRow = Math.floor(BOARD_SIZE / 2);
                const centerCol = Math.floor(BOARD_SIZE / 2);
                const searchRadius = 2;
                
                // 优先选择中心区域
                for (let i = centerRow - searchRadius; i <= centerRow + searchRadius; i++) {
                    for (let j = centerCol - searchRadius; j <= centerCol + searchRadius; j++) {
                        if (i >= 0 && i < BOARD_SIZE && j >= 0 && j < BOARD_SIZE && gameBoard[i][j] === EMPTY) {
                            return {row: i, col: j};
                        }
                    }
                }
                
                // 如果中心区域没有空位，返回随机位置
                return findRandomMove();
            }
            
            // 寻找获胜的一步
            function findWinningMove(player) {
                for (let i = 0; i < BOARD_SIZE; i++) {
                    for (let j = 0; j < BOARD_SIZE; j++) {
                        if (gameBoard[i][j] === EMPTY) {
                            // 模拟落子
                            gameBoard[i][j] = player;
                            
                            // 检查是否会获胜
                            if (checkWin(i, j, player)) {
                                gameBoard[i][j] = EMPTY; // 撤销模拟
                                return {row: i, col: j};
                            }
                            
                            // 撤销模拟
                            gameBoard[i][j] = EMPTY;
                        }
                    }
                }
                
                return null;
            }
            
            // 寻找可以形成双三或双四的位置（叉子）
            function findForkMove(player) {
                for (let i = 0; i < BOARD_SIZE; i++) {
                    for (let j = 0; j < BOARD_SIZE; j++) {
                        if (gameBoard[i][j] === EMPTY) {
                            // 模拟落子
                            gameBoard[i][j] = player;
                            
                            // 检查是否形成了多个威胁
                            let threatCount = 0;
                            const directions = [
                                [0, 1], [1, 0], [1, 1], [1, -1]
                            ];
                            
                            for (const [dx, dy] of directions) {
                                // 检查在当前方向上是否形成了威胁
                                if (checkThreat(i, j, player, dx, dy)) {
                                    threatCount++;
                                }
                            }
                            
                            // 撤销模拟
                            gameBoard[i][j] = EMPTY;
                            
                            // 如果形成了多个威胁，这是一个好的叉子位置
                            if (threatCount >= 2) {
                                return {row: i, col: j};
                            }
                        }
                    }
                }
                
                return null;
            }
            
            // 检查在某个方向上是否形成了威胁（三或四）
            function checkThreat(row, col, player, dx, dy) {
                // 这个函数是简化的威胁检查，实际的AI会更复杂
                // 这里只是一个简单的示例
                
                let count = 1;
                
                // 检查正方向
                for (let i = 1; i <= 4; i++) {
                    const newRow = row + i * dx;
                    const newCol = col + i * dy;
                    
                    if (newRow < 0 || newRow >= BOARD_SIZE || newCol < 0 || newCol >= BOARD_SIZE || 
                        gameBoard[newRow][newCol] !== player) {
                        break;
                    }
                    
                    count++;
                }
                
                // 检查反方向
                for (let i = 1; i <= 4; i++) {
                    const newRow = row - i * dx;
                    const newCol = col - i * dy;
                    
                    if (newRow < 0 || newRow >= BOARD_SIZE || newCol < 0 || newCol >= BOARD_SIZE || 
                        gameBoard[newRow][newCol] !== player) {
                        break;
                    }
                    
                    count++;
                }
                
                // 三或四都被视为威胁
                return count === 3 || count === 4;
            }
            
            // 事件监听
            canvas.addEventListener('click', (e) => {
                if (!gameActive || (gameMode === 'ai' && currentPlayer === WHITE)) {
                    return;
                }
                
                // 获取点击位置
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                
                const x = (e.clientX - rect.left) * scaleX;
                const y = (e.clientY - rect.top) * scaleY;
                
                // 转换为棋盘坐标
                const boardPos = canvasToBoard(x, y);
                
                if (boardPos) {
                    placePiece(boardPos.row, boardPos.col);
                }
            });
            
            startBtn.addEventListener('click', () => {
                if (gameActive) {
                    // 暂停游戏
                    gameActive = false;
                    startBtn.innerHTML = '<i class="fa fa-play"></i><span>继续游戏</span>';
                    gameStatus.textContent = '游戏已暂停';
                    gameStatus.classList.remove('text-success');
                    gameStatus.classList.add('text-warning');
                } else {
                    // 开始或继续游戏
                    if (moveHistory.length === 0) {
                        // 新游戏
                        initGame();
                    } else {
                        // 继续游戏
                        gameActive = true;
                        startBtn.innerHTML = '<i class="fa fa-pause"></i><span>暂停游戏</span>';
                        gameStatus.textContent = '游戏进行中';
                        gameStatus.classList.remove('text-warning');
                        gameStatus.classList.add('text-success');
                        
                        // 如果是人机对战且轮到AI
                        if (gameMode === 'ai' && currentPlayer === WHITE) {
                            setTimeout(aiMove, 500);
                        }
                    }
                }
            });
            
            restartBtn.addEventListener('click', () => {
                // 重置游戏状态覆盖层
                gameStatusOverlay.classList.add('opacity-0', 'pointer-events-none');
                
                // 初始化新游戏
                initGame();
            });
            
            overlayRestartBtn.addEventListener('click', () => {
                // 重置游戏状态覆盖层
                gameStatusOverlay.classList.add('opacity-0', 'pointer-events-none');
                
                // 初始化新游戏
                initGame();
            });
            
            undoBtn.addEventListener('click', undoMove);
            
            modeSelect.addEventListener('change', () => {
                gameMode = modeSelect.value;
                
                if (gameMode === 'ai') {
                    difficultySelect.disabled = false;
                } else {
                    difficultySelect.disabled = true;
                }
                
                // 重置游戏
                initGame();
            });
            
            difficultySelect.addEventListener('change', () => {
                aiDifficulty = difficultySelect.value;
            });
            
            // 移动设备控制按钮
            mobileUndoBtn.addEventListener('click', undoMove);
            mobileRestartBtn.addEventListener('click', () => {
                gameStatusOverlay.classList.add('opacity-0', 'pointer-events-none');
                initGame();
            });
            
            // 窗口大小变化时重新调整棋盘大小
            window.addEventListener('resize', () => {
                initCanvasSize();
                renderBoard();
            });
            
            // 初始化
            initCanvasSize();
            loadStats();
            renderBoard();
            updatePlayerIndicator();
        });
    </script>
</body>
</html>
