                nameText.textContent = name;
                
                const detailBtn = document.createElement('button');
                detailBtn.className = 'name-detail-btn';
                detailBtn.textContent = '查看详情';
                detailBtn.addEventListener('click', () => showNameDetail(name));
                
                nameCard.appendChild(nameText);
                nameCard.appendChild(detailBtn);
                nameListDiv.appendChild(nameCard);
            });
        }

        // 显示名字详情弹窗
        function showNameDetail(fullName) {
            const surname = fullName[0];
            const givenName = fullName.slice(1);
            
            modalName.textContent = fullName;
            
            // 设置名字含义
            if (nameMeanings[givenName]) {
                nameMeaning.textContent = `含义: ${nameMeanings[givenName]}`;
            } else {
                nameMeaning.textContent = `含义: ${givenName}寓意美好，象征幸福与成功。`;
            }
            
            // 设置五行分析
            const elements = ["金", "木", "水", "火", "土"];
            const randomElement = elements[Math.floor(Math.random() * elements.length)];
            nameAnalysis.textContent = `五行分析: 名字中包含${randomElement}元素，与生辰八字相合，有助于运势发展。`;
            
            // 设置生肖运势
            const zodiac = zodiacSelect.value;
            nameLuck.textContent = `生肖${zodiac}运势: 此名符合${zodiac}生肖特点，包含${zodiacLuckyWords[zodiac]}等吉祥寓意。`;
            
            // 显示弹窗
            modal.style.display = 'flex';
        }

        // 关闭弹窗
        closeBtn.addEventListener('click', function() {
            modal.style.display = 'none';
        });

        // 点击弹窗外部关闭
        window.addEventListener('click', function(event) {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
