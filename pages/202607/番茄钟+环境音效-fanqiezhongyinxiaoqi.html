<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄钟 + 环境音效</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.8;
            margin-bottom: 30px;
        }

        .timer-display {
            font-size: 4em;
            font-weight: bold;
            margin: 30px 0;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            font-family: 'Courier New', monospace;
        }

        .session-info {
            font-size: 1.3em;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .work-session {
            background: linear-gradient(45deg, rgba(255, 107, 107, 0.3), rgba(255, 107, 107, 0.1));
            border-color: rgba(255, 107, 107, 0.5);
        }

        .break-session {
            background: linear-gradient(45deg, rgba(78, 205, 196, 0.3), rgba(78, 205, 196, 0.1));
            border-color: rgba(78, 205, 196, 0.5);
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 25px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 120px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            color: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .settings {
            margin: 30px 0;
            text-align: left;
        }

        .setting-group {
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .setting-group h3 {
            margin-bottom: 15px;
            color: #4ecdc4;
            font-size: 1.2em;
            text-align: center;
        }

        .time-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .time-control {
            text-align: center;
        }

        .time-control label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            opacity: 0.9;
        }

        .time-input {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .time-btn {
            width: 35px;
            height: 35px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .time-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .time-value {
            font-size: 18px;
            font-weight: bold;
            min-width: 40px;
        }

        .sound-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }

        .sound-btn {
            padding: 12px 15px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .sound-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .sound-btn.active {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border-color: transparent;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .sound-icon {
            font-size: 24px;
        }

        .volume-control {
            margin-top: 15px;
        }

        .volume-slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
            -webkit-appearance: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .stats {
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 15px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #4ecdc4;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .progress-ring {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 20px auto;
        }

        .progress-ring svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .progress-ring-circle {
            fill: none;
            stroke-width: 8;
            stroke-linecap: round;
        }

        .progress-ring-bg {
            stroke: rgba(255, 255, 255, 0.2);
        }

        .progress-ring-progress {
            stroke: url(#gradient);
            stroke-dasharray: 565.48;
            stroke-dashoffset: 565.48;
            transition: stroke-dashoffset 1s ease;
        }

        .timer-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5em;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            font-family: 'Courier New', monospace;
            margin: 0;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            color: white;
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .notification.show {
            transform: translateX(0);
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
            
            .timer-display {
                font-size: 3em;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .time-controls {
                grid-template-columns: 1fr;
            }
            
            .sound-options {
                grid-template-columns: repeat(2, 1fr);
            }
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>🍅 番茄钟</h1>
        <p class="subtitle">专注工作，高效休息</p>

        <div class="progress-ring">
            <svg>
                <defs>
                    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#ff6b6b"/>
                        <stop offset="100%" style="stop-color:#4ecdc4"/>
                    </linearGradient>
                </defs>
                <circle class="progress-ring-circle progress-ring-bg" cx="100" cy="100" r="90"/>
                <circle class="progress-ring-circle progress-ring-progress" cx="100" cy="100" r="90" id="progressCircle"/>
            </svg>
            <div class="timer-display" id="timerDisplay">25:00</div>
        </div>

        <div class="session-info work-session" id="sessionInfo">
            🎯 工作时间 - 保持专注！
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="startBtn" onclick="toggleTimer()">开始</button>
            <button class="btn btn-secondary" onclick="resetTimer()">重置</button>
            <button class="btn btn-secondary" onclick="skipSession()">跳过</button>
        </div>

        <div class="settings">
            <div class="setting-group">
                <h3>⏰ 时间设置</h3>
                <div class="time-controls">
                    <div class="time-control">
                        <label>工作时间</label>
                        <div class="time-input">
                            <button class="time-btn" onclick="adjustTime('work', -1)">-</button>
                            <span class="time-value" id="workTime">25</span>
                            <button class="time-btn" onclick="adjustTime('work', 1)">+</button>
                        </div>
                    </div>
                    <div class="time-control">
                        <label>休息时间</label>
                        <div class="time-input">
                            <button class="time-btn" onclick="adjustTime('break', -1)">-</button>
                            <span class="time-value" id="breakTime">5</span>
                            <button class="time-btn" onclick="adjustTime('break', 1)">+</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="setting-group">
                <h3>🎵 背景音乐</h3>
                <div class="sound-options">
                    <button class="sound-btn" data-sound="none" onclick="selectSound('none')">
                        <span class="sound-icon">🔇</span>
                        <span>静音</span>
                    </button>
                    <button class="sound-btn active" data-sound="piano" onclick="selectSound('piano')">
                        <span class="sound-icon">🎹</span>
                        <span>钢琴曲</span>
                    </button>
                    <button class="sound-btn" data-sound="classical" onclick="selectSound('classical')">
                        <span class="sound-icon">🎼</span>
                        <span>古典乐</span>
                    </button>
                    <button class="sound-btn" data-sound="ambient" onclick="selectSound('ambient')">
                        <span class="sound-icon">🎵</span>
                        <span>氛围音乐</span>
                    </button>
                    <button class="sound-btn" data-sound="meditation" onclick="selectSound('meditation')">
                        <span class="sound-icon">🧘</span>
                        <span>冥想音乐</span>
                    </button>
                    <button class="sound-btn" data-sound="lofi" onclick="selectSound('lofi')">
                        <span class="sound-icon">🎧</span>
                        <span>Lo-Fi音乐</span>
                    </button>
                </div>
                <div class="volume-control">
                    <label>音量: <span id="volumeValue">50</span>%</label>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="50">
                </div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-number" id="completedSessions">0</div>
                <div class="stat-label">完成番茄</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="totalTime">0</div>
                <div class="stat-label">总时长(分)</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="currentStreak">0</div>
                <div class="stat-label">连续天数</div>
            </div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        // 全局变量
        let timer = null;
        let timeLeft = 25 * 60; // 25分钟，以秒为单位
        let isRunning = false;
        let isWorkSession = true;
        let workDuration = 25;
        let breakDuration = 5;
        let currentSound = 'piano';
        let audioContext = null;
        let currentAudioSource = null;
        let gainNode = null;
        let volume = 0.5;

        // 统计数据
        let stats = {
            completedSessions: 0,
            totalTime: 0,
            currentStreak: 0
        };

        // 音频数据 - 使用Web Audio API生成轻音乐
        const soundGenerators = {
            piano: () => generatePianoMusic(),
            classical: () => generateClassicalMusic(),
            ambient: () => generateAmbientMusic(),
            meditation: () => generateMeditationMusic(),
            lofi: () => generateLoFiMusic()
        };

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initializeAudio();
            loadStats();
            updateDisplay();
            updateStats();
            
            // 音量控制
            document.getElementById('volumeSlider').addEventListener('input', function() {
                volume = this.value / 100;
                document.getElementById('volumeValue').textContent = this.value;
                if (gainNode) {
                    gainNode.gain.value = volume;
                }
            });

            // 页面可见性变化时的处理
            document.addEventListener('visibilitychange', function() {
                if (document.hidden && isRunning) {
                    // 页面隐藏时继续计时
                } else if (!document.hidden && isRunning) {
                    // 页面显示时更新显示
                    updateDisplay();
                }
            });
        });

        // 初始化音频上下文
        function initializeAudio() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                gainNode = audioContext.createGain();
                gainNode.connect(audioContext.destination);
                gainNode.gain.value = volume;
            } catch (e) {
                console.log('Web Audio API not supported');
            }
        }

        // 生成钢琴音乐
        function generatePianoMusic() {
            if (!audioContext) return;
            
            const bufferSize = audioContext.sampleRate * 8;
            const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
            const data = buffer.getChannelData(0);
            
            // 钢琴和弦进行：C-Am-F-G
            const chords = [
                [261.63, 329.63, 392.00], // C major
                [220.00, 261.63, 329.63], // A minor
                [174.61, 220.00, 261.63], // F major
                [196.00, 246.94, 293.66]  // G major
            ];
            
            for (let i = 0; i < bufferSize; i++) {
                const t = i / audioContext.sampleRate;
                const chordIndex = Math.floor((t * 0.5) % 4);
                const chord = chords[chordIndex];
                
                let sample = 0;
                chord.forEach(freq => {
                    sample += Math.sin(2 * Math.PI * freq * t) * 0.1 * Math.exp(-t % 2);
                });
                
                data[i] = sample * 0.3;
            }
            
            const source = audioContext.createBufferSource();
            source.buffer = buffer;
            source.loop = true;
            source.connect(gainNode);
            source.start();
            
            return source;
        }

        // 生成古典音乐
        function generateClassicalMusic() {
            if (!audioContext) return;
            
            const bufferSize = audioContext.sampleRate * 6;
            const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
            const data = buffer.getChannelData(0);
            
            // 简单的古典旋律
            const melody = [523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 987.77, 1046.50];
            
            for (let i = 0; i < bufferSize; i++) {
                const t = i / audioContext.sampleRate;
                const noteIndex = Math.floor((t * 2) % melody.length);
                const freq = melody[noteIndex];
                
                data[i] = Math.sin(2 * Math.PI * freq * t) * 0.2 * Math.exp(-(t % 0.5) * 2);
            }
            
            const source = audioContext.createBufferSource();
            source.buffer = buffer;
            source.loop = true;
            source.connect(gainNode);
            source.start();
            
            return source;
        }

        // 生成氛围音乐
        function generateAmbientMusic() {
            if (!audioContext) return;
            
            const bufferSize = audioContext.sampleRate * 10;
            const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
            const data = buffer.getChannelData(0);
            
            for (let i = 0; i < bufferSize; i++) {
                const t = i / audioContext.sampleRate;
                data[i] = Math.sin(2 * Math.PI * 220 * t) * 0.1 * Math.sin(t * 0.5) +
                         Math.sin(2 * Math.PI * 330 * t) * 0.08 * Math.sin(t * 0.3) +
                         Math.sin(2 * Math.PI * 440 * t) * 0.06 * Math.sin(t * 0.7);
            }
            
            const source = audioContext.createBufferSource();
            source.buffer = buffer;
            source.loop = true;
            source.connect(gainNode);
            source.start();
            
            return source;
        }

        // 生成冥想音乐
        function generateMeditationMusic() {
            if (!audioContext) return;
            
            const bufferSize = audioContext.sampleRate * 12;
            const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
            const data = buffer.getChannelData(0);
            
            for (let i = 0; i < bufferSize; i++) {
                const t = i / audioContext.sampleRate;
                // 使用低频率创造平静的感觉
                data[i] = Math.sin(2 * Math.PI * 110 * t) * 0.15 * Math.sin(t * 0.2) +
                         Math.sin(2 * Math.PI * 165 * t) * 0.1 * Math.sin(t * 0.15) +
                         Math.sin(2 * Math.PI * 220 * t) * 0.08 * Math.sin(t * 0.1);
            }
            
            const source = audioContext.createBufferSource();
            source.buffer = buffer;
            source.loop = true;
            source.connect(gainNode);
            source.start();
            
            return source;
        }

        // 生成Lo-Fi音乐
        function generateLoFiMusic() {
            if (!audioContext) return;
            
            const bufferSize = audioContext.sampleRate * 4;
            const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
            const data = buffer.getChannelData(0);
            
            // Lo-Fi风格的简单节拍和旋律
            for (let i = 0; i < bufferSize; i++) {
                const t = i / audioContext.sampleRate;
                const beat = Math.floor(t * 2) % 4;
                
                let sample = 0;
                // 鼓点
                if (beat === 0 || beat === 2) {
                    sample += Math.sin(2 * Math.PI * 60 * t) * 0.3 * Math.exp(-(t % 0.5) * 10);
                }
                
                // 旋律
                const melodyFreq = [220, 246.94, 261.63, 293.66][Math.floor((t * 0.5) % 4)];
                sample += Math.sin(2 * Math.PI * melodyFreq * t) * 0.15 * (1 + Math.sin(t * 0.1) * 0.3);
                
                // 添加一些"脏"的感觉
                sample += (Math.random() * 2 - 1) * 0.02;
                
                data[i] = sample * 0.4;
            }
            
            const source = audioContext.createBufferSource();
            source.buffer = buffer;
            source.loop = true;
            source.connect(gainNode);
            source.start();
            
            return source;
        }

        // 选择声音
        function selectSound(soundType) {
            currentSound = soundType;
            
            // 更新按钮状态
            document.querySelectorAll('.sound-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.sound === soundType);
            });
            
            // 停止当前音频
            if (currentAudioSource) {
                currentAudioSource.stop();
                currentAudioSource = null;
            }
            
            // 播放新音频
            if (soundType !== 'none' && isRunning) {
                playAmbientSound();
            }
        }

        // 播放环境音
        function playAmbientSound() {
            if (currentSound === 'none' || !audioContext) return;
            
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            
            if (currentAudioSource) {
                currentAudioSource.stop();
            }
            
            if (soundGenerators[currentSound]) {
                currentAudioSource = soundGenerators[currentSound]();
            }
        }

        // 停止环境音
        function stopAmbientSound() {
            if (currentAudioSource) {
                currentAudioSource.stop();
                currentAudioSource = null;
            }
        }

        // 切换计时器
        function toggleTimer() {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        // 开始计时器
        function startTimer() {
            isRunning = true;
            document.getElementById('startBtn').textContent = '暂停';
            
            // 播放轻音乐
            playAmbientSound();
            
            timer = setInterval(() => {
                timeLeft--;
                updateDisplay();
                updateProgress();
                
                if (timeLeft <= 0) {
                    completeSession();
                }
            }, 1000);
        }

        // 暂停计时器
        function pauseTimer() {
            isRunning = false;
            document.getElementById('startBtn').textContent = '开始';
            
            if (timer) {
                clearInterval(timer);
                timer = null;
            }
            
            // 停止轻音乐
            stopAmbientSound();
        }

        // 重置计时器
        function resetTimer() {
            pauseTimer();
            timeLeft = isWorkSession ? workDuration * 60 : breakDuration * 60;
            updateDisplay();
            updateProgress();
        }

        // 跳过当前会话
        function skipSession() {
            completeSession();
        }

        // 完成会话
        function completeSession() {
            pauseTimer();
            
            if (isWorkSession) {
                stats.completedSessions++;
                stats.totalTime += workDuration;
                showNotification('🎉 工作时间完成！开始休息吧~');
            } else {
                showNotification('⏰ 休息结束！准备开始新的工作~');
            }
            
            // 切换会话类型
            isWorkSession = !isWorkSession;
            timeLeft = isWorkSession ? workDuration * 60 : breakDuration * 60;
            
            updateSessionInfo();
            updateDisplay();
            updateProgress();
            updateStats();
            saveStats();
            
            // 播放提示音
            playNotificationSound();
        }

        // 调整时间
        function adjustTime(type, delta) {
            if (isRunning) return;
            
            if (type === 'work') {
                workDuration = Math.max(1, Math.min(60, workDuration + delta));
                document.getElementById('workTime').textContent = workDuration;
                if (isWorkSession) {
                    timeLeft = workDuration * 60;
                    updateDisplay();
                    updateProgress();
                }
            } else {
                breakDuration = Math.max(1, Math.min(30, breakDuration + delta));
                document.getElementById('breakTime').textContent = breakDuration;
                if (!isWorkSession) {
                    timeLeft = breakDuration * 60;
                    updateDisplay();
                    updateProgress();
                }
            }
        }

        // 更新显示
        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timerDisplay').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        // 更新会话信息
        function updateSessionInfo() {
            const sessionInfo = document.getElementById('sessionInfo');
            if (isWorkSession) {
                sessionInfo.textContent = '🎯 工作时间 - 保持专注！';
                sessionInfo.className = 'session-info work-session';
            } else {
                sessionInfo.textContent = '☕ 休息时间 - 放松一下~';
                sessionInfo.className = 'session-info break-session';
            }
        }

        // 更新进度环
        function updateProgress() {
            const totalTime = isWorkSession ? workDuration * 60 : breakDuration * 60;
            const progress = (totalTime - timeLeft) / totalTime;
            const circumference = 2 * Math.PI * 90;
            const offset = circumference - (progress * circumference);
            
            document.getElementById('progressCircle').style.strokeDashoffset = offset;
        }

        // 更新统计
        function updateStats() {
            document.getElementById('completedSessions').textContent = stats.completedSessions;
            document.getElementById('totalTime').textContent = stats.totalTime;
            document.getElementById('currentStreak').textContent = stats.currentStreak;
        }

        // 显示通知
        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // 播放提示音
        function playNotificationSound() {
            if (!audioContext) return;
            
            const oscillator = audioContext.createOscillator();
            const envelope = audioContext.createGain();
            
            oscillator.connect(envelope);
            envelope.connect(audioContext.destination);
            
            oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
            oscillator.frequency.setValueAtTime(600, audioContext.currentTime + 0.1);
            
            envelope.gain.setValueAtTime(0, audioContext.currentTime);
            envelope.gain.linearRampToValueAtTime(0.2, audioContext.currentTime + 0.01);
            envelope.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.5);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
        }

        // 保存统计数据
        function saveStats() {
            localStorage.setItem('pomodoroStats', JSON.stringify(stats));
        }

        // 加载统计数据
        function loadStats() {
            const saved = localStorage.getItem('pomodoroStats');
            if (saved) {
                stats = JSON.parse(saved);
            }
        }

        // 初始化显示
        updateSessionInfo();
        updateProgress();
    </script>
</body>
</html>
