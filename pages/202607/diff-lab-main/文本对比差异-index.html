<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diff Lab · 文本对比</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; }
.container { max-width: 1400px; margin: 0 auto; padding: 20px; }
header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
h1 { font-size: 24px; font-weight: 600; color: #e0e0e0; }
h1 span { color: #64b5f6; }
.subtitle { color: #888; font-size: 14px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { padding: 8px 16px; border: 1px solid #2a2a4a; border-radius: 6px; background: #16213e; color: #e0e0e0; cursor: pointer; font-size: 14px; transition: all .15s; }
.btn:hover { background: #1a1a4e; border-color: #64b5f6; }
.btn-primary { background: #1a3a5c; border-color: #64b5f6; color: #64b5f6; }
.btn-primary:hover { background: #1a4a6c; }
.btn-success { background: #1a3a2c; border-color: #4caf50; color: #4caf50; }
.btn-danger { border-color: #e57373; color: #e57373; }
.btn-danger:hover { background: #3a1a1a; }
.main { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid #2a2a4a; border-radius: 12px; overflow: hidden; }
.panel { display: flex; flex-direction: column; }
.panel:first-child { border-right: 1px solid #2a2a4a; }
.panel-header { padding: 10px 14px; background: #16213e; font-size: 13px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #2a2a4a; display: flex; justify-content: space-between; align-items: center; }
.panel-header .label { display: flex; align-items: center; gap: 6px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.status-dot.original { background: #e57373; }
.status-dot.modified { background: #ffd54f; }
.status-dot.new { background: #4caf50; }
textarea { width: 100%; height: 350px; background: #0f0f23; border: none; color: #e0e0e0; font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; font-size: 13px; padding: 12px; resize: vertical; line-height: 1.6; outline: none; }
textarea::placeholder { color: #444; }
.diff-output { display: none; margin-top: 20px; border: 1px solid #2a2a4a; border-radius: 12px; overflow: hidden; }
.diff-output.show { display: block; }
.diff-header { padding: 10px 14px; background: #16213e; font-size: 13px; color: #888; border-bottom: 1px solid #2a2a4a; display: flex; justify-content: space-between; align-items: center; }
.diff-stats { display: flex; gap: 16px; font-size: 13px; }
.diff-stats span { display: flex; align-items: center; gap: 4px; }
.stat-add { color: #4caf50; }
.stat-del { color: #e57373; }
.stat-mod { color: #ffd54f; }
.diff-table { width: 100%; border-collapse: collapse; font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; font-size: 13px; }
.diff-table td { padding: 2px 8px; vertical-align: top; line-height: 1.6; white-space: pre-wrap; word-break: break-all; }
.diff-table .lineno { width: 50px; text-align: right; color: #555; user-select: none; font-size: 12px; }
.diff-table .line-add { background: rgba(76, 175, 80, 0.12); }
.diff-table .line-del { background: rgba(229, 115, 115, 0.12); }
.diff-table .line-mod { background: rgba(255, 213, 79, 0.08); }
.diff-table .line-ctx { background: transparent; }
.diff-table .char-add { background: rgba(76, 175, 80, 0.35); border-radius: 2px; }
.diff-table .char-del { background: rgba(229, 115, 115, 0.35); border-radius: 2px; }
.diff-table .char-mod { background: rgba(255, 213, 79, 0.3); border-radius: 2px; }
.diff-table .line-add .lineno { color: #4caf50; }
.diff-table .line-del .lineno { color: #e57373; }
.diff-table .line-mod .lineno { color: #ffd54f; }
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; color: #555; text-align: center; }
.empty-state .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
.empty-state p { font-size: 14px; line-height: 1.8; }
.empty-state .shortcut { display: inline-block; background: #16213e; border: 1px solid #2a2a4a; padding: 2px 8px; border-radius: 4px; font-size: 12px; color: #888; margin: 0 2px; }
.stats-summary { padding: 12px 20px; background: #16213e; border-top: 1px solid #2a2a4a; font-size: 13px; color: #888; text-align: center; }
.stats-summary strong { color: #aaa; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>
<div class="container">
<header>
  <div>
    <h1><span>Diff</span> Lab</h1>
    <div class="subtitle">粘贴两段文本，对比差异</div>
  </div>
  <div class="toolbar">
    <button class="btn btn-primary" onclick="runDiff()" id="btnCompare">▸ 对比</button>
    <button class="btn" onclick="swapText()" id="btnSwap">⇄ 交换</button>
    <button class="btn btn-danger" onclick="clearAll()">✕ 清空</button>
  </div>
</header>

<div class="main">
  <div class="panel">
    <div class="panel-header">
      <span class="label"><span class="status-dot original"></span> 原文本</span>
      <span style="font-size:11px;color:#555;">左侧</span>
    </div>
    <textarea id="textA" placeholder="在此粘贴原文本…"></textarea>
  </div>
  <div class="panel">
    <div class="panel-header">
      <span class="label"><span class="status-dot new"></span> 新文本</span>
      <span style="font-size:11px;color:#555;">右侧</span>
    </div>
    <textarea id="textB" placeholder="在此粘贴新文本…"></textarea>
  </div>
</div>

<div class="diff-output" id="diffOutput">
  <div class="diff-header">
    <span>差异结果</span>
    <div class="diff-stats" id="diffStats"></div>
  </div>
  <div id="diffContent"><div class="empty-state"><div class="icon">⚡</div><p>点击 <span class="shortcut">对比</span> 查看差异<br>或按 <span class="shortcut">Alt+Enter</span> 快速对比</p></div></div>
  <div class="stats-summary" id="statsSummary"></div>
</div>
</div>

<script>
// LCS-based diff
function lcs(a, b) {
  const m = a.length, n = b.length;
  const dp = Array(m + 1).fill(null).map(() => Array(n + 1).fill(0));
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] + 1 : Math.max(dp[i-1][j], dp[i][j-1]);
  const result = [];
  let i = m, j = n;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && a[i-1] === b[j-1]) { result.push({ type: 'same', line: a[i-1] }); i--; j--; }
    else if (j > 0 && (i === 0 || dp[i][j-1] >= dp[i-1][j])) { result.push({ type: 'add', line: b[j-1] }); j--; }
    else { result.push({ type: 'del', line: a[i-1] }); i--; }
  }
  return result.reverse();
}

// Character-level diff within a single line
function charDiff(oldStr, newStr) {
  const m = oldStr.length, n = newStr.length;
  const dp = Array(m + 1).fill(null).map(() => Array(n + 1).fill(0));
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      dp[i][j] = oldStr[i-1] === newStr[j-1] ? dp[i-1][j-1] + 1 : Math.max(dp[i-1][j], dp[i][j-1]);
  const ops = [];
  let i = m, j = n;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && oldStr[i-1] === newStr[j-1]) { ops.push({ t: '=', c: oldStr[i-1] }); i--; j--; }
    else if (j > 0 && (i === 0 || dp[i][j-1] >= dp[i-1][j])) { ops.push({ t: '+', c: newStr[j-1] }); j--; }
    else { ops.push({ t: '-', c: oldStr[i-1] }); i--; }
  }
  return ops.reverse();
}

function renderCharDiff(ops, type) {
  return ops.map(op => {
    if (op.t === '=') return escHtml(op.c);
    const cls = type === 'add' ? 'char-add' : type === 'del' ? 'char-del' : 'char-mod';
    return '<span class="' + cls + '">' + escHtml(op.c) + '</span>';
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function runDiff() {
  const textA = document.getElementById('textA');
  const textB = document.getElementById('textB');
  const linesA = textA.value.split('\n');
  const linesB = textB.value.split('\n');
  if (linesA.length > 0 && linesA[linesA.length-1] === '' && !textA.value.endsWith('\n')) linesA.pop();
  if (linesB.length > 0 && linesB[linesB.length-1] === '' && !textB.value.endsWith('\n')) linesB.pop();

  const output = document.getElementById('diffOutput');
  const contentDiv = document.getElementById('diffContent');
  const statsDiv = document.getElementById('diffStats');
  const summaryDiv = document.getElementById('statsSummary');

  if (textA.value === '' && textB.value === '') {
    contentDiv.innerHTML = '<div class="empty-state"><div class="icon">📝</div><p>两侧都空空的，贴点文本再试</p></div>';
    statsDiv.innerHTML = '';
    summaryDiv.textContent = '';
    output.classList.add('show');
    return;
  }

  const ops = lcs(linesA, linesB);

  // First pass: classify ops and detect modified line pairs (adjacent del+add)
  const classified = [];
  let i = 0;
  while (i < ops.length) {
    if (i + 1 < ops.length && ops[i].type === 'del' && ops[i+1].type === 'add') {
      classified.push({ kind: 'mod', oldLine: ops[i].line, newLine: ops[i+1].line });
      i += 2;
    } else {
      classified.push({ kind: ops[i].type, line: ops[i].line });
      i++;
    }
  }

  // Count stats
  let addCount = 0, delCount = 0, modCount = 0;
  for (const c of classified) {
    if (c.kind === 'add') addCount++;
    else if (c.kind === 'del') delCount++;
    else if (c.kind === 'mod') modCount++;
  }

  // Render
  let html = '<table class="diff-table"><tbody>';
  let aLineNum = 0, bLineNum = 0;
  for (const c of classified) {
    if (c.kind === 'same') {
      const ctx = escHtml(c.line);
      const displayLine = ctx.length > 120 ? ctx.slice(0, 120) + '…' : ctx;
      html += '<tr class="line-ctx"><td class="lineno">' + (++aLineNum) + '</td><td class="lineno">' + (++bLineNum) + '</td><td>' + displayLine + '</td></tr>';
    } else if (c.kind === 'add') {
      html += '<tr class="line-add"><td class="lineno"></td><td class="lineno">' + (++bLineNum) + '</td><td>' + escHtml(c.line) + '</td></tr>';
    } else if (c.kind === 'del') {
      html += '<tr class="line-del"><td class="lineno">' + (++aLineNum) + '</td><td class="lineno"></td><td>' + escHtml(c.line) + '</td></tr>';
    } else if (c.kind === 'mod') {
      const chars = charDiff(c.oldLine, c.newLine);
      html += '<tr class="line-mod"><td class="lineno">' + (++aLineNum) + '</td><td class="lineno">' + (++bLineNum) + '</td><td>' + escHtml(c.oldLine) + '</td></tr>';
      html += '<tr class="line-mod"><td class="lineno"></td><td class="lineno"></td><td>' + escHtml(c.newLine) + '</td></tr>';
    }
  }
  html += '</tbody></table>';

  contentDiv.innerHTML = html;

  let statsHtml = '';
  if (addCount > 0) statsHtml += '<span class="stat-add">+ ' + addCount + '</span>';
  if (delCount > 0) statsHtml += '<span class="stat-del">- ' + delCount + '</span>';
  if (modCount > 0) statsHtml += '<span class="stat-mod">~ ' + modCount + '</span>';
  if (!statsHtml) statsHtml = '<span style="color:#4caf50;">✓ 两侧完全一致</span>';
  statsDiv.innerHTML = statsHtml;

  const total = addCount + delCount + modCount;
  summaryDiv.textContent = total === 0 ? '两侧文本完全一样，没有差异' : '共 ' + total + ' 处差异';

  output.classList.add('show');

  localStorage.setItem('diffLab_textA', textA.value);
  localStorage.setItem('diffLab_textB', textB.value);
}

function swapText() {
  const a = document.getElementById('textA');
  const b = document.getElementById('textB');
  const tmp = a.value;
  a.value = b.value;
  b.value = tmp;
  runDiff();
}

function clearAll() {
  document.getElementById('textA').value = '';
  document.getElementById('textB').value = '';
  document.getElementById('diffOutput').classList.remove('show');
  localStorage.removeItem('diffLab_textA');
  localStorage.removeItem('diffLab_textB');
}

// Keyboard shortcut
document.addEventListener('keydown', function(e) {
  if (e.altKey && e.key === 'Enter') {
    e.preventDefault();
    runDiff();
  }
});

// Auto-save on input
let saveTimer;
document.getElementById('textA').addEventListener('input', function() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    localStorage.setItem('diffLab_textA', this.value);
  }, 500);
});
document.getElementById('textB').addEventListener('input', function() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    localStorage.setItem('diffLab_textB', this.value);
  }, 500);
});

// Restore saved content
window.addEventListener('DOMContentLoaded', function() {
  const savedA = localStorage.getItem('diffLab_textA');
  const savedB = localStorage.getItem('diffLab_textB');
  if (savedA) document.getElementById('textA').value = savedA;
  if (savedB) document.getElementById('textB').value = savedB;
  if (savedA || savedB) runDiff();
});
</script>
</body>
</html>
