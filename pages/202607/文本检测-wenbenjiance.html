<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>文本检测</title>
  <style>
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --text: #0f172a;
      --muted: #64748b;
      --card: #ffffff;
      --border: #e2e8f0;
      --accent: #3b82f6;
      --accent-contrast: #ffffff;
      --input: #ffffff;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }
    :root[data-theme="dark"] {
      --bg: #0b1220;
      --text: #e2e8f0;
      --muted: #93a4b8;
      --card: #111827;
      --border: #1f2937;
      --accent: #60a5fa;
      --accent-contrast: #0b1220;
      --input: #0f172a;
      --shadow: 0 10px 28px rgba(2, 6, 23, 0.35);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
        Ubuntu, Cantarell, "Helvetica Neue", "Noto Sans SC", "PingFang SC",
        "Microsoft YaHei", Arial, sans-serif;
      line-height: 1.5;
    }
    .container {
      max-width: 1000px; margin: 0 auto; padding: 20px;
    }
    .header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 16px;
    }
    .title {
      font-size: 24px; font-weight: 700;
      letter-spacing: .02em;
    }
    .desc { color: var(--muted); font-size: 14px; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    }
    .btn {
      appearance: none; border: 1px solid var(--border); background: var(--card);
      color: var(--text); padding: 8px 12px; border-radius: 10px; cursor: pointer;
      transition: all .18s ease; font-size: 14px;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
    .btn.primary { background: var(--accent); color: var(--accent-contrast); border-color: transparent; }
    .btn.ghost { background: transparent; }

    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; box-shadow: var(--shadow);
    }
    .editor {
      display: grid; gap: 12px; padding: 16px; margin-bottom: 16px;
    }
    .textarea {
      width: 100%; min-height: 200px; height: 30vh; resize: vertical;
      background: var(--input); color: var(--text);
      border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 14px; font-size: 16px; line-height: 1.6;
      outline: none; transition: border-color .18s ease, box-shadow .18s ease;
    }
    .textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 25%, transparent);
    }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px; padding: 16px; margin-bottom: 16px;
    }
    @media (min-width: 640px) {
      .stats { grid-template-columns: repeat(3, 1fr); }
    }
    @media (min-width: 960px) {
      .stats { grid-template-columns: repeat(4, 1fr); }
    }
    .stat {
      background: var(--input); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px; display: grid; gap: 4px;
    }
    .stat .label { font-size: 12px; color: var(--muted); }
    .stat .value { font-size: 20px; font-weight: 700; }

    .footer { color: var(--muted); font-size: 12px; padding: 8px 16px 16px; }
    .switch {
      display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px;
      border: 1px solid var(--border); border-radius: 20px; background: var(--card);
    }
    .switch input { width: 0; height: 0; opacity: 0; position: absolute; }
    .switch .dot {
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--accent);
      transform: translateX(0); transition: transform .18s ease;
    }
    .switch .track { position: relative; width: 40px; height: 22px; border-radius: 22px; background: var(--input); border: 1px solid var(--border); }
    .switch input:checked ~ .dot { transform: translateX(22px); }

    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <div class="title">文本检测</div>
        <div class="desc">实时统计字数与字符信息，支持浅/深主题与移动端自适应。</div>
      </div>
      <label class="switch" title="切换主题">
        <div class="track"></div>
        <input id="themeToggle" type="checkbox" />
        <div class="dot" aria-hidden="true"></div>
      </label>
    </div>

    <section class="card editor">
      <textarea id="input" class="textarea" placeholder="在此输入或粘贴需要检测的文本…"></textarea>
      <div class="controls">
        <button id="btnClear" class="btn ghost">清空</button>
        <button id="btnPaste" class="btn ghost">粘贴</button>
        <label class="btn ghost" for="fileInput">导入文本文件</label>
        <input id="fileInput" class="hidden" type="file" accept=".txt,.md,.csv,.log,.html" />
        <button id="btnSample" class="btn">示例文本</button>
        <button id="btnCopyStats" class="btn">复制统计</button>
      </div>
    </section>

    <section class="card stats" id="stats">
      <div class="stat"><div class="label">总字符数（含空格）</div><div id="totalChars" class="value">0</div></div>
      <div class="stat"><div class="label">字数（不含空格）</div><div id="noSpaceChars" class="value">0</div></div>
      <div class="stat"><div class="label">中文字符数</div><div id="chChars" class="value">0</div></div>
      <div class="stat"><div class="label">英文字符数</div><div id="enChars" class="value">0</div></div>
      <div class="stat"><div class="label">英文单词数</div><div id="enWords" class="value">0</div></div>
      <div class="stat"><div class="label">数字字符数</div><div id="digits" class="value">0</div></div>
      <div class="stat"><div class="label">标点符号数</div><div id="puncts" class="value">0</div></div>
      <div class="stat"><div class="label">行数</div><div id="lines" class="value">0</div></div>
    </section>

    <div class="footer">
      说明：中文“字数”通常指不含空格的字符数；“英文单词数”按连续英文字母统计。统计为近似值，遇到特殊符号或混合语言可能略有偏差。
    </div>
  </div>

  <script>
    (function() {
      const root = document.documentElement;
      const textarea = document.getElementById('input');
      const themeToggle = document.getElementById('themeToggle');

      const el = id => document.getElementById(id);
      const out = {
        totalChars: el('totalChars'),
        noSpaceChars: el('noSpaceChars'),
        chChars: el('chChars'),
        enChars: el('enChars'),
        enWords: el('enWords'),
        digits: el('digits'),
        puncts: el('puncts'),
        lines: el('lines'),
      };

      function initTheme() {
        const saved = localStorage.getItem('textcheck-theme');
        if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          root.setAttribute('data-theme', 'dark');
          themeToggle.checked = true;
        } else {
          root.setAttribute('data-theme', 'light');
          themeToggle.checked = false;
        }
      }

      function toggleTheme() {
        const next = themeToggle.checked ? 'dark' : 'light';
        root.setAttribute('data-theme', next);
        localStorage.setItem('textcheck-theme', next);
      }

      function countStats(text) {
        const totalChars = text.length;
        const noSpaceChars = text.replace(/[\s\u00A0\u2000-\u200B\u202F\u205F\u3000]/g, '').length;
        const chChars = (text.match(/[\u4E00-\u9FFF]/g) || []).length; // 基本汉字范围
        const enChars = (text.match(/[A-Za-z]/g) || []).length;
        const enWords = (text.match(/[A-Za-z]+(?:'[A-Za-z]+)?/g) || []).length;
        const digits = (text.match(/[0-9]/g) || []).length;
        const puncts = (text.match(/[，,。．\.!?！？；;：:、…\-—_\(\)（）“”"'‘’《》〈〉【】\[\]\{\}<>·]/g) || []).length;
        const lines = text.length ? text.split(/\r?\n/).length : 0;
        return { totalChars, noSpaceChars, chChars, enChars, enWords, digits, puncts, lines };
      }

      function renderStats(s) {
        out.totalChars.textContent = s.totalChars;
        out.noSpaceChars.textContent = s.noSpaceChars;
        out.chChars.textContent = s.chChars;
        out.enChars.textContent = s.enChars;
        out.enWords.textContent = s.enWords;
        out.digits.textContent = s.digits;
        out.puncts.textContent = s.puncts;
        out.lines.textContent = s.lines;
      }

      function update() {
        renderStats(countStats(textarea.value));
      }

      function attachControls() {
        document.getElementById('btnClear').addEventListener('click', () => { textarea.value = ''; update(); textarea.focus(); });
        document.getElementById('btnPaste').addEventListener('click', async () => {
          try { const t = await navigator.clipboard.readText(); textarea.value = t; update(); }
          catch { alert('无法读取剪贴板内容，请手动粘贴。'); }
        });
        document.getElementById('btnSample').addEventListener('click', () => {
          const sample = `在这片文本中，我们会统计：\n- 中文字符与英文字符；\n- 英文单词数与数字字符；\n- 以及行数与标点符号。\n\nHello, world! JavaScript counts words, digits: 12345.`;
          textarea.value = sample; update();
        });
        document.getElementById('btnCopyStats').addEventListener('click', async () => {
          const s = countStats(textarea.value);
          const lines = [
            `总字符数（含空格）：${s.totalChars}`,
            `字数（不含空格）：${s.noSpaceChars}`,
            `中文字符数：${s.chChars}`,
            `英文字符数：${s.enChars}`,
            `英文单词数：${s.enWords}`,
            `数字字符数：${s.digits}`,
            `标点符号数：${s.puncts}`,
            `行数：${s.lines}`
          ];
          try { await navigator.clipboard.writeText(lines.join('\n')); }
          catch { /* ignore */ }
        });
        document.getElementById('fileInput').addEventListener('change', async (e) => {
          const f = e.target.files && e.target.files[0]; if (!f) return;
          try { const t = await f.text(); textarea.value = t; update(); }
          catch { alert('读取文件失败'); }
        });
      }

      // 初始化
      initTheme(); update(); attachControls();
      themeToggle.addEventListener('change', toggleTheme);
      textarea.addEventListener('input', update);
    })();
  </script>
</body>
</html>
