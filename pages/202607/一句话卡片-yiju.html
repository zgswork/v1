<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一句话卡片</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            padding: 20px;
        }
        
        .card-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            padding: 20px;
        }
        
        .card {
            background: linear-gradient(145deg, #ffffff, #f0f9f5);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 
                0 10px 30px rgba(16, 185, 129, 0.1),
                0 1px 8px rgba(16, 185, 129, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(16, 185, 129, 0.1);
        }
        
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 
                0 20px 40px rgba(16, 185, 129, 0.15),
                0 5px 15px rgba(16, 185, 129, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #10b981, #059669);
        }
        
        .quote-icon {
            font-size: 48px;
            color: #10b981;
            opacity: 0.2;
            margin-bottom: 20px;
            line-height: 1;
        }
        
        .quote-text {
            font-size: 28px;
            line-height: 1.6;
            color: #1f2937;
            font-weight: 500;
            margin-bottom: 30px;
            text-align: center;
            position: relative;
            padding: 0 10px;
        }
        
        .author {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #059669;
            font-size: 18px;
            font-weight: 600;
        }
        
        .author::before {
            content: '—';
            opacity: 0.5;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }
        
        .btn-secondary {
            background: white;
            color: #059669;
            border: 2px solid rgba(16, 185, 129, 0.2);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .card-footer {
            text-align: center;
            margin-top: 30px;
            color: #6b7280;
            font-size: 14px;
            opacity: 0.7;
        }

        .hosted-note {
            text-align: center;
            margin-top: 14px;
            font-size: 13px;
            color: #6b7280;
            line-height: 1.55;
            opacity: 0.85;
        }

        .hosted-note a {
            color: #059669;
            text-decoration: none;
            font-weight: 600;
        }

        .hosted-note a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .card-container {
                padding: 10px;
                gap: 20px;
            }
            
            .card {
                padding: 30px 25px;
                border-radius: 20px;
            }
            
            .quote-text {
                font-size: 22px;
                line-height: 1.5;
            }
            
            .quote-icon {
                font-size: 40px;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 280px;
                justify-content: center;
            }
        }
        
        @media (max-width: 480px) {
            .card {
                padding: 25px 20px;
            }
            
            .quote-text {
                font-size: 20px;
            }
            
            .quote-icon {
                font-size: 36px;
            }
            
            .author {
                font-size: 16px;
            }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(16, 185, 129, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="card pulse">
            <div class="quote-icon">"</div>
            <div class="quote-text" id="quoteText">加载中…</div>
            <div class="author" id="quoteAuthor">—</div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="newQuoteBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
                </svg>
                新的一句话
            </button>
            
            <button class="btn btn-secondary" id="shareBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="18" cy="5" r="3"/>
                    <circle cx="6" cy="12" r="3"/>
                    <circle cx="18" cy="19" r="3"/>
                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                </svg>
                分享这句话
            </button>
        </div>
        
        <div class="card-footer" id="cardFooter">
            正在加载语录数据…
        </div>

        <p class="hosted-note">
            语录内容由 DKFile
            <a href="https://dkfile.net/hosted-data" target="_blank" rel="noopener noreferrer">数据托管</a>
            提供，在线维护、刷新即更新。
        </p>
    </div>

    <script>
        (function () {
            var DATA_URL =
                'https://dkfile.net/dkfile-data/pub/122a6338a311b944b43e9fcb76470b0d';

            function dataUrlWithBust(u) {
                var sep = u.indexOf('?') === -1 ? '?' : '&';
                return u + sep + 't=' + Date.now();
            }

            var quoteText = document.getElementById('quoteText');
            var quoteAuthor = document.getElementById('quoteAuthor');
            var newQuoteBtn = document.getElementById('newQuoteBtn');
            var shareBtn = document.getElementById('shareBtn');
            var card = document.querySelector('.card');
            var cardFooter = document.getElementById('cardFooter');

            var quotes = [];
            var currentQuoteIndex = 0;

            function quoteKey(q) {
                return (q.text || '') + '\0' + (q.author || '');
            }

            function buildQuoteList(data) {
                var list = [];
                var seen = {};
                if (data.daily && data.daily.text) {
                    list.push({ text: data.daily.text, author: data.daily.author || '' });
                    seen[quoteKey(list[0])] = true;
                }
                var extra = data.quotes || [];
                for (var i = 0; i < extra.length; i++) {
                    var item = extra[i];
                    if (!item || !item.text) continue;
                    var k = quoteKey(item);
                    if (seen[k]) continue;
                    seen[k] = true;
                    list.push({ text: item.text, author: item.author || '' });
                }
                return list;
            }

            function setFooter() {
                if (!cardFooter) return;
                cardFooter.textContent = '点击「新的一句话」获取更多灵感';
            }

            function applyQuote(quote, skipAnim) {
                if (!quote) return;
                var idx = quotes.indexOf(quote);
                if (idx >= 0) currentQuoteIndex = idx;

                if (skipAnim) {
                    quoteText.textContent = quote.text;
                    quoteAuthor.textContent = quote.author;
                    return;
                }

                quoteText.style.opacity = '0.5';
                quoteAuthor.style.opacity = '0.5';

                setTimeout(function () {
                    quoteText.textContent = quote.text;
                    quoteAuthor.textContent = quote.author;
                    quoteText.style.opacity = '1';
                    quoteAuthor.style.opacity = '1';
                    card.classList.remove('pulse');
                    void card.offsetWidth;
                    card.classList.add('pulse');
                }, 300);
            }

            function getRandomQuote() {
                if (!quotes.length) return null;
                var newIndex;
                if (quotes.length === 1) {
                    newIndex = 0;
                } else {
                    do {
                        newIndex = Math.floor(Math.random() * quotes.length);
                    } while (newIndex === currentQuoteIndex);
                }
                currentQuoteIndex = newIndex;
                return quotes[currentQuoteIndex];
            }

            function updateQuote() {
                applyQuote(getRandomQuote());
            }

            function shareQuote() {
                var quote = quotes[currentQuoteIndex];
                if (!quote) return;
                var text = '"' + quote.text + '" — ' + quote.author;

                if (navigator.share) {
                    navigator.share({
                        title: '一句话卡片',
                        text: text,
                        url: window.location.href
                    });
                } else if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(function () {
                        var originalText = shareBtn.innerHTML;
                        shareBtn.innerHTML =
                            '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
                            '<path d="M20 6L9 17l-5-5"/></svg>已复制！';
                        setTimeout(function () {
                            shareBtn.innerHTML = originalText;
                        }, 2000);
                    });
                }
            }

            function fetchQuotesData(url) {
                return fetch(dataUrlWithBust(url), { cache: 'no-store' }).then(function (res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                });
            }

            function applyPayload(data) {
                quotes = buildQuoteList(data);
                if (!quotes.length) {
                    quoteText.textContent = '暂无语录数据，请检查在线 JSON 内容。';
                    quoteAuthor.textContent = '';
                    if (cardFooter) cardFooter.textContent = '在线语录数据为空或格式异常';
                    return false;
                }
                setFooter();
                currentQuoteIndex = 0;
                applyQuote(quotes[0], true);
                return true;
            }

            function loadData() {
                fetchQuotesData(DATA_URL)
                    .then(function (data) {
                        applyPayload(data);
                    })
                    .catch(function () {
                        quoteText.textContent = '语录加载失败，请确认网络与在线数据可访问。';
                        quoteAuthor.textContent = '';
                        if (cardFooter) {
                            cardFooter.textContent =
                                '在线：dkfile.net/dkfile-data/pub/122a6338a311b944b43e9fcb76470b0d';
                        }
                    });
            }

            newQuoteBtn.addEventListener('click', updateQuote);
            shareBtn.addEventListener('click', shareQuote);

            card.addEventListener('click', function (e) {
                if (!e.target.closest('.btn')) {
                    updateQuote();
                }
            });

            document.addEventListener('DOMContentLoaded', loadData);
        })();
    </script>
