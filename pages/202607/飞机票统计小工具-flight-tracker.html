<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飞机票统计小工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/date-fns@2.29.3/index.min.js"></script>
    <style>
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <!-- 标题 -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">✈️ 飞机票统计小工具</h1>
            <p class="text-gray-600">记录和分析你的飞行数据</p>
        </div>

        <!-- 主要内容区域 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- 左侧：录入表单 -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-lg shadow-lg p-6">
                    <h2 class="text-2xl font-semibold text-gray-800 mb-6">📝 添加飞行记录</h2>
                    <form id="flightForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">出发地</label>
                            <input type="text" id="departure" required 
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                   placeholder="如：北京">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">目的地</label>
                            <input type="text" id="destination" required 
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                   placeholder="如：上海">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">航空公司</label>
                            <input type="text" id="airline" required 
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                   placeholder="如：中国国航">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">航班号（可选）</label>
                            <input type="text" id="flightNumber" 
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                   placeholder="如：CA1234">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">票价（人民币）</label>
                            <input type="number" id="price" required min="0" step="0.01"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                   placeholder="如：1200.50">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">乘机人姓名</label>
                            <input type="text" id="passenger" required 
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                   placeholder="如：张三">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">出发日期</label>
                            <input type="date" id="date" required 
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">项目/出差标签（可选）</label>
                            <input type="text" id="project" 
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                   placeholder="如：北京出差">
                        </div>
                        
                        <button type="submit" 
                                class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition duration-200 font-medium">
                            ➕ 添加记录
                        </button>
                    </form>
                </div>

                <!-- 操作按钮 -->
                <div class="mt-6 space-y-3">
                    <button id="exportBtn" 
                            class="w-full bg-green-600 text-white py-2 px-4 rounded-md hover:bg-green-700 transition duration-200 font-medium">
                        📥 导出为 CSV
                    </button>
                    <button id="clearBtn" 
                            class="w-full bg-red-600 text-white py-2 px-4 rounded-md hover:bg-red-700 transition duration-200 font-medium">
                        🗑️ 清空所有数据
                    </button>
                </div>
            </div>

            <!-- 右侧：统计信息和图表 -->
            <div class="lg:col-span-2 space-y-6">
                <!-- 统计概览 -->
                <div class="bg-white rounded-lg shadow-lg p-6">
                    <h2 class="text-2xl font-semibold text-gray-800 mb-6">📊 统计概览</h2>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="text-center p-4 bg-blue-50 rounded-lg">
                            <div class="text-2xl font-bold text-blue-600" id="totalFlights">0</div>
                            <div class="text-sm text-gray-600">总飞行次数</div>
                        </div>
                        <div class="text-center p-4 bg-green-50 rounded-lg">
                            <div class="text-2xl font-bold text-green-600" id="totalCost">¥0</div>
                            <div class="text-sm text-gray-600">总花费</div>
                        </div>
                        <div class="text-center p-4 bg-purple-50 rounded-lg">
                            <div class="text-2xl font-bold text-purple-600" id="avgCost">¥0</div>
                            <div class="text-sm text-gray-600">平均票价</div>
                        </div>
                        <div class="text-center p-4 bg-orange-50 rounded-lg">
                            <div class="text-2xl font-bold text-orange-600" id="topAirline">-</div>
                            <div class="text-sm text-gray-600">最常用航司</div>
                        </div>
                    </div>
                </div>

                <!-- 排行榜 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-white rounded-lg shadow-lg p-6">
                        <h3 class="text-lg font-semibold text-gray-800 mb-4">👥 乘机人排行</h3>
                        <div id="passengerRanking" class="space-y-2"></div>
                    </div>
                    <div class="bg-white rounded-lg shadow-lg p-6">
                        <h3 class="text-lg font-semibold text-gray-800 mb-4">🛫 热门航线</h3>
                        <div id="routeRanking" class="space-y-2"></div>
                    </div>
                </div>

                <!-- 图表区域 -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="bg-white rounded-lg shadow-lg p-6">
                        <h3 class="text-lg font-semibold text-gray-800 mb-4">📈 月度支出趋势</h3>
                        <canvas id="monthlyChart" width="400" height="300"></canvas>
                    </div>
                    <div class="bg-white rounded-lg shadow-lg p-6">
                        <h3 class="text-lg font-semibold text-gray-800 mb-4">🥧 航司使用占比</h3>
                        <canvas id="airlineChart" width="400" height="300"></canvas>
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow-lg p-6">
                    <h3 class="text-lg font-semibold text-gray-800 mb-4">📊 城市航线频率</h3>
                    <canvas id="routeChart" width="800" height="400"></canvas>
                </div>
            </div>
        </div>

        <!-- 记录列表 -->
        <div class="mt-8 bg-white rounded-lg shadow-lg p-6">
            <h2 class="text-2xl font-semibold text-gray-800 mb-6">📋 飞行记录</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full table-auto">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-2 text-left text-sm font-medium text-gray-700">日期</th>
                            <th class="px-4 py-2 text-left text-sm font-medium text-gray-700">航线</th>
                            <th class="px-4 py-2 text-left text-sm font-medium text-gray-700">航司</th>
                            <th class="px-4 py-2 text-left text-sm font-medium text-gray-700">航班号</th>
                            <th class="px-4 py-2 text-left text-sm font-medium text-gray-700">乘机人</th>
                            <th class="px-4 py-2 text-left text-sm font-medium text-gray-700">票价</th>
                            <th class="px-4 py-2 text-left text-sm font-medium text-gray-700">项目</th>
                            <th class="px-4 py-2 text-left text-sm font-medium text-gray-700">操作</th>
                        </tr>
                    </thead>
                    <tbody id="recordsTable" class="divide-y divide-gray-200">
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 页脚 -->
        <div class="mt-8 text-center text-gray-500 text-sm">
            <p>有任何问题请联系作者微信：xd13531</p>
        </div>
    </div>

    <!-- 编辑模态框 -->
    <div id="editModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 w-full max-w-md mx-4">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">编辑飞行记录</h3>
            <form id="editForm" class="space-y-4">
                <input type="hidden" id="editIndex">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">出发地</label>
                    <input type="text" id="editDeparture" required 
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">目的地</label>
                    <input type="text" id="editDestination" required 
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">航空公司</label>
                    <input type="text" id="editAirline" required 
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">航班号</label>
                    <input type="text" id="editFlightNumber" 
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">票价</label>
                    <input type="number" id="editPrice" required min="0" step="0.01"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">乘机人</label>
                    <input type="text" id="editPassenger" required 
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">出发日期</label>
                    <input type="date" id="editDate" required 
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">项目标签</label>
                    <input type="text" id="editProject" 
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex space-x-3">
                    <button type="submit" class="flex-1 bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition duration-200">
                        保存
                    </button>
                    <button type="button" id="cancelEdit" class="flex-1 bg-gray-600 text-white py-2 px-4 rounded-md hover:bg-gray-700 transition duration-200">
                        取消
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        class FlightTracker {
            constructor() {
                this.flights = JSON.parse(localStorage.getItem('flights')) || [];
                this.charts = {};
                this.init();
            }

            init() {
                this.bindEvents();
                this.updateDisplay();
                this.initCharts();
            }

            bindEvents() {
                document.getElementById('flightForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.addFlight();
                });

                document.getElementById('editForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.updateFlight();
                });

                document.getElementById('cancelEdit').addEventListener('click', () => {
                    this.closeEditModal();
                });

                document.getElementById('exportBtn').addEventListener('click', () => {
                    this.exportToCSV();
                });

                document.getElementById('clearBtn').addEventListener('click', () => {
                    if (confirm('确定要清空所有数据吗？此操作不可恢复！')) {
                        this.clearAllData();
                    }
                });

                // 设置默认日期为今天
                document.getElementById('date').valueAsDate = new Date();
            }

            addFlight() {
                const flight = {
                    id: Date.now(),
                    departure: document.getElementById('departure').value,
                    destination: document.getElementById('destination').value,
                    airline: document.getElementById('airline').value,
                    flightNumber: document.getElementById('flightNumber').value,
                    price: parseFloat(document.getElementById('price').value),
                    passenger: document.getElementById('passenger').value,
                    date: document.getElementById('date').value,
                    project: document.getElementById('project').value
                };

                this.flights.push(flight);
                this.saveToStorage();
                this.updateDisplay();
                this.resetForm();
                this.showNotification('飞行记录添加成功！', 'success');
            }

            updateFlight() {
                const index = parseInt(document.getElementById('editIndex').value);
                const flight = {
                    ...this.flights[index],
                    departure: document.getElementById('editDeparture').value,
                    destination: document.getElementById('editDestination').value,
                    airline: document.getElementById('editAirline').value,
                    flightNumber: document.getElementById('editFlightNumber').value,
                    price: parseFloat(document.getElementById('editPrice').value),
                    passenger: document.getElementById('editPassenger').value,
                    date: document.getElementById('editDate').value,
                    project: document.getElementById('editProject').value
                };

                this.flights[index] = flight;
                this.saveToStorage();
                this.updateDisplay();
                this.closeEditModal();
                this.showNotification('飞行记录更新成功！', 'success');
            }

            deleteFlight(index) {
                if (confirm('确定要删除这条记录吗？')) {
                    this.flights.splice(index, 1);
                    this.saveToStorage();
                    this.updateDisplay();
                    this.showNotification('飞行记录删除成功！', 'success');
                }
            }

            editFlight(index) {
                const flight = this.flights[index];
                document.getElementById('editIndex').value = index;
                document.getElementById('editDeparture').value = flight.departure;
                document.getElementById('editDestination').value = flight.destination;
                document.getElementById('editAirline').value = flight.airline;
                document.getElementById('editFlightNumber').value = flight.flightNumber;
                document.getElementById('editPrice').value = flight.price;
                document.getElementById('editPassenger').value = flight.passenger;
                document.getElementById('editDate').value = flight.date;
                document.getElementById('editProject').value = flight.project;
                
                document.getElementById('editModal').classList.remove('hidden');
                document.getElementById('editModal').classList.add('flex');
            }

            closeEditModal() {
                document.getElementById('editModal').classList.add('hidden');
                document.getElementById('editModal').classList.remove('flex');
            }

            saveToStorage() {
                localStorage.setItem('flights', JSON.stringify(this.flights));
            }

            resetForm() {
                document.getElementById('flightForm').reset();
                document.getElementById('date').valueAsDate = new Date();
            }

            updateDisplay() {
                this.updateStatistics();
                this.updateRankings();
                this.updateRecordsTable();
                this.updateCharts();
            }

            updateStatistics() {
                const totalFlights = this.flights.length;
                const totalCost = this.flights.reduce((sum, flight) => sum + flight.price, 0);
                const avgCost = totalFlights > 0 ? totalCost / totalFlights : 0;
                
                // 最常用航司
                const airlineCount = {};
                this.flights.forEach(flight => {
                    airlineCount[flight.airline] = (airlineCount[flight.airline] || 0) + 1;
                });
                const topAirline = Object.keys(airlineCount).reduce((a, b) => 
                    airlineCount[a] > airlineCount[b] ? a : b, '-');

                document.getElementById('totalFlights').textContent = totalFlights;
                document.getElementById('totalCost').textContent = `¥${totalCost.toLocaleString()}`;
                document.getElementById('avgCost').textContent = `¥${avgCost.toLocaleString()}`;
                document.getElementById('topAirline').textContent = totalFlights > 0 ? topAirline : '-';
            }

            updateRankings() {
                // 乘机人排行
                const passengerStats = {};
                this.flights.forEach(flight => {
                    if (!passengerStats[flight.passenger]) {
                        passengerStats[flight.passenger] = { count: 0, cost: 0 };
                    }
                    passengerStats[flight.passenger].count++;
                    passengerStats[flight.passenger].cost += flight.price;
                });

                const passengerRanking = Object.entries(passengerStats)
                    .sort((a, b) => b[1].count - a[1].count)
                    .slice(0, 5);

                const passengerHtml = passengerRanking.map(([name, stats], index) => `
                    <div class="flex justify-between items-center p-2 bg-gray-50 rounded">
                        <span class="font-medium">${index + 1}. ${name}</span>
                        <span class="text-sm text-gray-600">${stats.count}次 / ¥${stats.cost.toLocaleString()}</span>
                    </div>
                `).join('');

                document.getElementById('passengerRanking').innerHTML = passengerHtml || '<p class="text-gray-500">暂无数据</p>';

                // 航线排行
                const routeStats = {};
                this.flights.forEach(flight => {
                    const route = `${flight.departure} → ${flight.destination}`;
                    routeStats[route] = (routeStats[route] || 0) + 1;
                });

                const routeRanking = Object.entries(routeStats)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 5);

                const routeHtml = routeRanking.map(([route, count], index) => `
                    <div class="flex justify-between items-center p-2 bg-gray-50 rounded">
                        <span class="font-medium">${index + 1}. ${route}</span>
                        <span class="text-sm text-gray-600">${count}次</span>
                    </div>
                `).join('');

                document.getElementById('routeRanking').innerHTML = routeHtml || '<p class="text-gray-500">暂无数据</p>';
            }

            updateRecordsTable() {
                const tbody = document.getElementById('recordsTable');
                const sortedFlights = [...this.flights].sort((a, b) => new Date(b.date) - new Date(a.date));
                
                const html = sortedFlights.map((flight, index) => `
                    <tr class="hover:bg-gray-50">
                        <td class="px-4 py-2 text-sm">${flight.date}</td>
                        <td class="px-4 py-2 text-sm">${flight.departure} → ${flight.destination}</td>
                        <td class="px-4 py-2 text-sm">${flight.airline}</td>
                        <td class="px-4 py-2 text-sm">${flight.flightNumber || '-'}</td>
                        <td class="px-4 py-2 text-sm">${flight.passenger}</td>
                        <td class="px-4 py-2 text-sm font-medium">¥${flight.price.toLocaleString()}</td>
                        <td class="px-4 py-2 text-sm">${flight.project || '-'}</td>
                        <td class="px-4 py-2 text-sm">
                            <button onclick="flightTracker.editFlight(${this.flights.indexOf(flight)})" 
                                    class="text-blue-600 hover:text-blue-800 mr-2">编辑</button>
                            <button onclick="flightTracker.deleteFlight(${this.flights.indexOf(flight)})" 
                                    class="text-red-600 hover:text-red-800">删除</button>
                        </td>
                    </tr>
                `).join('');

                tbody.innerHTML = html || '<tr><td colspan="8" class="px-4 py-8 text-center text-gray-500">暂无飞行记录</td></tr>';
            }

            initCharts() {
                // 月度支出趋势图
                const monthlyCtx = document.getElementById('monthlyChart').getContext('2d');
                this.charts.monthly = new Chart(monthlyCtx, {
                    type: 'line',
                    data: {
                        labels: [],
                        datasets: [{
                            label: '月度支出',
                            data: [],
                            borderColor: 'rgb(59, 130, 246)',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            tension: 0.4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    callback: function(value) {
                                        return '¥' + value.toLocaleString();
                                    }
                                }
                            }
                        }
                    }
                });

                // 航司占比饼图
                const airlineCtx = document.getElementById('airlineChart').getContext('2d');
                this.charts.airline = new Chart(airlineCtx, {
                    type: 'pie',
                    data: {
                        labels: [],
                        datasets: [{
                            data: [],
                            backgroundColor: [
                                '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0',
                                '#9966FF', '#FF9F40', '#FF6384', '#C9CBCF'
                            ]
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false
                    }
                });

                // 航线频率柱状图
                const routeCtx = document.getElementById('routeChart').getContext('2d');
                this.charts.route = new Chart(routeCtx, {
                    type: 'bar',
                    data: {
                        labels: [],
                        datasets: [{
                            label: '飞行次数',
                            data: [],
                            backgroundColor: 'rgba(59, 130, 246, 0.8)'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    stepSize: 1
                                }
                            }
                        }
                    }
                });
            }

            updateCharts() {
                this.updateMonthlyChart();
                this.updateAirlineChart();
                this.updateRouteChart();
            }

            updateMonthlyChart() {
                const monthlyData = {};
                this.flights.forEach(flight => {
                    const month = flight.date.substring(0, 7); // YYYY-MM
                    monthlyData[month] = (monthlyData[month] || 0) + flight.price;
                });

                const sortedMonths = Object.keys(monthlyData).sort();
                const labels = sortedMonths.map(month => {
                    const [year, monthNum] = month.split('-');
                    return `${year}年${monthNum}月`;
                });
                const data = sortedMonths.map(month => monthlyData[month]);

                this.charts.monthly.data.labels = labels;
                this.charts.monthly.data.datasets[0].data = data;
                this.charts.monthly.update();
            }

            updateAirlineChart() {
                const airlineData = {};
                this.flights.forEach(flight => {
                    airlineData[flight.airline] = (airlineData[flight.airline] || 0) + 1;
                });

                const labels = Object.keys(airlineData);
                const data = Object.values(airlineData);

                this.charts.airline.data.labels = labels;
                this.charts.airline.data.datasets[0].data = data;
                this.charts.airline.update();
            }

            updateRouteChart() {
                const routeData = {};
                this.flights.forEach(flight => {
                    const route = `${flight.departure} → ${flight.destination}`;
                    routeData[route] = (routeData[route] || 0) + 1;
                });

                const sortedRoutes = Object.entries(routeData)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 10); // 显示前10条航线

                const labels = sortedRoutes.map(([route]) => route);
                const data = sortedRoutes.map(([, count]) => count);

                this.charts.route.data.labels = labels;
                this.charts.route.data.datasets[0].data = data;
                this.charts.route.update();
            }

            exportToCSV() {
                if (this.flights.length === 0) {
                    this.showNotification('没有数据可导出', 'error');
                    return;
                }

                const headers = ['日期', '出发地', '目的地', '航空公司', '航班号', '票价', '乘机人', '项目标签'];
                const csvContent = [
                    headers.join(','),
                    ...this.flights.map(flight => [
                        flight.date,
                        flight.departure,
                        flight.destination,
                        flight.airline,
                        flight.flightNumber || '',
                        flight.price,
                        flight.passenger,
                        flight.project || ''
                    ].join(','))
                ].join('\n');

                const blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `飞行记录_${new Date().toISOString().split('T')[0]}.csv`;
                link.click();

                this.showNotification('CSV文件导出成功！', 'success');
            }

            clearAllData() {
                this.flights = [];
                this.saveToStorage();
                this.updateDisplay();
                this.showNotification('所有数据已清空', 'success');
            }

            showNotification(message, type = 'info') {
                const notification = document.createElement('div');
                notification.className = `fixed top-4 right-4 px-6 py-3 rounded-lg text-white z-50 fade-in ${
                    type === 'success' ? 'bg-green-500' : 
                    type === 'error' ? 'bg-red-500' : 'bg-blue-500'
                }`;
                notification.textContent = message;
                
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.remove();
                }, 3000);
            }
        }

        // 初始化应用
        const flightTracker = new FlightTracker();
    </script>
</body>
</html>
