<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄手账 - 专注计时器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        
        :root {
            --primary: #FF7F9D;
            --secondary: #FFD166;
            --accent: #A1DE93;
            --background: #FFF9F9;
            --card-bg: #FFFFFF;
            --text: #333333;
            --text-light: #777777;
            --shadow: rgba(255, 127, 157, 0.15);
        }
        
        body {
            background-color: var(--background);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(var(--shadow) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 127, 157, 0.2);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
        }
        
        .logo h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .nav-buttons {
            display: flex;
            gap: 15px;
        }
        
        .btn {
            padding: 10px 20px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 10px rgba(255, 127, 157, 0.3);
        }
        
        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 30px;
        }
        
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .card-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
        }
        
        .timer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        
        .timer-display {
            font-size: 72px;
            font-weight: 800;
            color: var(--primary);
            margin: 10px 0;
            text-shadow: 0 4px 10px rgba(255, 127, 157, 0.2);
            transition: color 0.3s;
        }
        
        .rest-mode {
            color: var(--accent);
        }
        
        .timer-label {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-light);
            background: rgba(255, 127, 157, 0.1);
            padding: 8px 25px;
            border-radius: 50px;
            transition: all 0.3s;
        }
        
        .rest-label {
            background: rgba(161, 222, 147, 0.1);
            color: var(--accent);
        }
        
        .timer-controls {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
        
        .btn-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-icon.primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 10px rgba(255, 127, 157, 0.3);
        }
        
        .btn-icon.secondary {
            background: rgba(255, 127, 157, 0.1);
            color: var(--primary);
        }
        
        .btn-icon.accent {
            background: rgba(161, 222, 147, 0.1);
            color: var(--accent);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        
        .stat-card {
            background: rgba(255, 127, 157, 0.05);
            border-radius: 18px;
            padding: 20px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 14px;
            color: var(--text-light);
        }
        
        .chart-container {
            height: 200px;
            margin-top: 15px;
        }
        
        .interruptions {
            margin-top: 20px;
        }
        
        .interruption-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background: rgba(255, 127, 157, 0.05);
            border-radius: 15px;
            margin-bottom: 10px;
        }
        
        .interruption-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 127, 157, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            color: var(--primary);
            font-size: 18px;
        }
        
        .interruption-info {
            flex: 1;
        }
        
        .interruption-title {
            font-weight: 600;
            margin-bottom: 3px;
        }
        
        .interruption-time {
            font-size: 13px;
            color: var(--text-light);
        }
        
        .achievements-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
        }
        
        .achievement-badge {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            text-align: center;
            padding: 10px;
            box-shadow: 0 4px 10px rgba(255, 127, 157, 0.3);
        }
        
        .achievement-badge i {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .share-card {
            position: relative;
            background: linear-gradient(135deg, #FFD1DC, #FFECF1);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            overflow: hidden;
        }
        
        .share-card::before {
            content: "";
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            top: -50px;
            right: -50px;
        }
        
        .share-card::after {
            content: "";
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            bottom: -40px;
            left: -40px;
        }
        
        .share-content {
            position: relative;
            z-index: 2;
        }
        
        .share-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 15px;
        }
        
        .share-stats {
            font-size: 48px;
            font-weight: 800;
            color: var(--primary);
            margin: 20px 0;
        }
        
        .share-text {
            font-size: 18px;
            color: var(--text);
            margin-bottom: 25px;
            font-style: italic;
        }
        
        .share-footer {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        
        .watermark {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: rgba(255, 127, 157, 0.3);
            font-weight: 800;
            font-size: 18px;
        }
        
        .tomato-icon {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
        }
        
        footer {
            text-align: center;
            padding: 30px 0 20px;
            color: var(--text-light);
            font-size: 14px;
        }
        
        .online-counter {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 127, 157, 0.1);
            padding: 8px 15px;
            border-radius: 50px;
            margin-top: 10px;
        }
        
        .pulse {
            width: 12px;
            height: 12px;
            background: var(--accent);
            border-radius: 50%;
            position: relative;
        }
        
        .pulse::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--accent);
            border-radius: 50%;
            z-index: -1;
            animation: pulse 1.5s infinite;
        }
        
        .settings-panel {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(0,0,0,0.05);
        }
        
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .setting-label {
            font-size: 16px;
            color: var(--text);
        }
        
        .setting-input {
            width: 80px;
            padding: 8px 12px;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 8px;
            text-align: center;
            font-size: 16px;
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.7;
            }
            100% {
                transform: scale(2.5);
                opacity: 0;
            }
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .timer-display {
                font-size: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-apple-alt"></i>
                </div>
                <h1>番茄手账</h1>
            </div>
            <div class="nav-buttons">
                <button class="btn btn-outline">
                    <i class="fas fa-chart-pie"></i> 数据统计
                </button>
                <button class="btn btn-primary">
                    <i class="fas fa-crown"></i> 成就墙
                </button>
            </div>
        </header>
        
        <div class="main-content">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">专注计时器</h2>
                    <div class="timer-label" id="timerMode">专注中</div>
                </div>
                <div class="timer-container">
                    <div class="timer-display" id="timer">25:00</div>
                    <div class="timer-controls">
                        <div class="btn-icon secondary" id="pauseBtn">
                            <i class="fas fa-pause"></i>
                        </div>
                        <div class="btn-icon primary" id="startBtn">
                            <i class="fas fa-play"></i>
                        </div>
                        <div class="btn-icon secondary" id="resetBtn">
                            <i class="fas fa-redo"></i>
                        </div>
                    </div>
                </div>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="todayCount">0</div>
                        <div class="stat-label">今日番茄</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="totalCount">0</div>
                        <div class="stat-label">累计番茄</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="streakCount">0</div>
                        <div class="stat-label">连续天数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="focusTime">0</div>
                        <div class="stat-label">小时</div>
                    </div>
                </div>
                
                <div class="settings-panel">
                    <div class="setting-row">
                        <div class="setting-label">专注时间（分钟）</div>
                        <input type="number" min="1" max="60" value="25" class="setting-input" id="workTime">
                    </div>
                    <div class="setting-row">
                        <div class="setting-label">休息时间（分钟）</div>
                        <input type="number" min="1" max="30" value="5" class="setting-input" id="breakTime">
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">专注数据</h2>
                    <i class="fas fa-ellipsis-h"></i>
                </div>
                <div class="chart-container">
                    <canvas id="focusChart"></canvas>
                </div>
                
                <div class="interruptions">
                    <h3 style="margin-bottom: 15px; color: var(--text-light);">今日中断记录</h3>
                    <div class="interruption-item">
                        <div class="interruption-icon">
                            <i class="fas fa-mobile-alt"></i>
                        </div>
                        <div class="interruption-info">
                            <div class="interruption-title">查看手机消息</div>
                            <div class="interruption-time">11:25 AM · 持续2分钟</div>
                        </div>
                    </div>
                    <div class="interruption-item">
                        <div class="interruption-icon">
                            <i class="fas fa-coffee"></i>
                        </div>
                        <div class="interruption-info">
                            <div class="interruption-title">咖啡休息</div>
                            <div class="interruption-time">10:45 AM · 持续5分钟</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">成就徽章</h2>
                    <i class="fas fa-medal"></i>
                </div>
                <div class="achievements-container">
                    <div class="achievement-badge">
                        <i class="fas fa-seedling"></i>
                        <span>新芽学者</span>
                    </div>
                    <div class="achievement-badge">
                        <i class="fas fa-fire"></i>
                        <span>专注达人</span>
                    </div>
                    <div class="achievement-badge">
                        <i class="fas fa-calendar-check"></i>
                        <span>7日连击</span>
                    </div>
                    <div class="achievement-badge">
                        <i class="fas fa-crown"></i>
                        <span>番茄大师</span>
                    </div>
                </div>
            </div>
            
            <div class="card share-card">
                <div class="tomato-icon">
                    <i class="fas fa-apple-alt"></i>
                </div>
                <div class="watermark">番茄手账</div>
                
                <div class="share-content">
                    <h3 class="share-title">本周专注报告</h3>
                    <div class="share-stats">0</div>
                    <div class="share-text">驯服了0个番茄！专注是浪漫的生产力 🍅</div>
                    
                    <div class="share-footer">
                        <button class="btn btn-primary" id="shareBtn">
                            <i class="fab fa-reddit-alien"></i> 分享到小红书
                        </button>
                        <button class="btn btn-outline">
                            <i class="fas fa-download"></i> 保存图片
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>让每一次专注都值得记录 · 番茄手账 v1.0</p>
            <div class="online-counter">
                <div class="pulse"></div>
                <span>128人正在专注中</span>
            </div>
        </footer>
    </div>

    <!-- 音频元素 -->
    <audio id="startSound" src="https://assets.mixkit.co/sfx/preview/mixkit-select-click-1109.mp3"></audio>
    <audio id="endSound" src="https://assets.mixkit.co/sfx/preview/mixkit-alarm-digital-clock-beep-989.mp3"></audio>

    <script>
        // 初始化变量
        let timer;
        let isRunning = false;
        let isWorkTime = true;
        let workDuration = 25 * 60; // 25分钟
        let breakDuration = 5 * 60; // 5分钟
        let timeLeft = workDuration;
        let tomatoCount = 0;
        let totalTomatoCount = 0;
        let streakCount = 0;
        
        // DOM元素
        const timerDisplay = document.getElementById('timer');
        const timerMode = document.getElementById('timerMode');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const todayCount = document.getElementById('todayCount');
        const totalCount = document.getElementById('totalCount');
        const streakCountEl = document.getElementById('streakCount');
        const focusTime = document.getElementById('focusTime');
        const workTimeInput = document.getElementById('workTime');
        const breakTimeInput = document.getElementById('breakTime');
        const shareBtn = document.getElementById('shareBtn');
        const startSound = document.getElementById('startSound');
        const endSound = document.getElementById('endSound');
        
        // 更新计时器显示
        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }
        
        // 开始计时器
        function startTimer() {
            if (!isRunning) {
                isRunning = true;
                playSound('start');
                
                timer = setInterval(() => {
                    timeLeft--;
                    updateTimerDisplay();
                    
                    if (timeLeft <= 0) {
                        clearInterval(timer);
                        isRunning = false;
                        
                        if (isWorkTime) {
                            // 完成一个番茄钟
                            tomatoCount++;
                            totalTomatoCount++;
                            todayCount.textContent = tomatoCount;
                            totalCount.textContent = totalTomatoCount;
                            focusTime.textContent = (tomatoCount * 25 / 60).toFixed(1);
                            
                            // 切换到休息时间
                            isWorkTime = false;
                            timeLeft = breakDuration;
                            timerMode.textContent = "休息中";
                            timerMode.className = "timer-label rest-label";
                            timerDisplay.className = "timer-display rest-mode";
                            
                            // 播放提示音
                            playSound('end');
                        } else {
                            // 休息结束，切换回工作时间
                            isWorkTime = true;
                            timeLeft = workDuration;
                            timerMode.textContent = "专注中";
                            timerMode.className = "timer-label";
                            timerDisplay.className = "timer-display";
                            
                            // 播放提示音
                            playSound('start');
                        }
                        
                        updateTimerDisplay();
                        startTimer(); // 自动开始下一轮
                    }
                }, 1000);
            }
        }
        
        // 暂停计时器
        function pauseTimer() {
            if (isRunning) {
                clearInterval(timer);
                isRunning = false;
                playSound('start');
            }
        }
        
        // 重置计时器
        function resetTimer() {
            clearInterval(timer);
            isRunning = false;
            isWorkTime = true;
            timeLeft = workDuration;
            timerMode.textContent = "专注中";
            timerMode.className = "timer-label";
            timerDisplay.className = "timer-display";
            updateTimerDisplay();
            playSound('start');
        }
        
        // 播放提示音
        function playSound(type) {
            if (type === 'start') {
                startSound.currentTime = 0;
                startSound.play();
            } else if (type === 'end') {
                endSound.currentTime = 0;
                endSound.play();
            }
        }
        
        // 更新工作时间设置
        function updateWorkTime() {
            const minutes = parseInt(workTimeInput.value) || 25;
            if (minutes < 1) workTimeInput.value = 1;
            if (minutes > 60) workTimeInput.value = 60;
            workDuration = minutes * 60;
            
            if (!isRunning && isWorkTime) {
                timeLeft = workDuration;
                updateTimerDisplay();
            }
        }
        
        // 更新休息时间设置
        function updateBreakTime() {
            const minutes = parseInt(breakTimeInput.value) || 5;
            if (minutes < 1) breakTimeInput.value = 1;
            if (minutes > 30) breakTimeInput.value = 30;
            breakDuration = minutes * 60;
            
            if (!isRunning && !isWorkTime) {
                timeLeft = breakDuration;
                updateTimerDisplay();
            }
        }
        
        // 初始化图表
        function initChart() {
            const ctx = document.getElementById('focusChart').getContext('2d');
            const focusChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'],
                    datasets: [{
                        label: '番茄数量',
                        data: [5, 7, 4, 6, 8, 3, 2],
                        backgroundColor: [
                            'rgba(255, 127, 157, 0.7)',
                            'rgba(255, 127, 157, 0.7)',
                            'rgba(255, 127, 157, 0.7)',
                            'rgba(255, 127, 157, 0.7)',
                            'rgba(255, 127, 157, 0.7)',
                            'rgba(255, 127, 157, 0.3)',
                            'rgba(255, 127, 157, 0.3)'
                        ],
                        borderColor: [
                            'rgba(255, 127, 157, 1)',
                            'rgba(255, 127, 157, 1)',
                            'rgba(255, 127, 157, 1)',
                            'rgba(255, 127, 157, 1)',
                            'rgba(255, 127, 157, 1)',
                            'rgba(255, 127, 157, 0.5)',
                            'rgba(255, 127, 157, 0.5)'
                        ],
                        borderWidth: 1,
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 10,
                            ticks: {
                                stepSize: 2
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }
        
        // 事件监听
        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resetBtn.addEventListener('click', resetTimer);
        workTimeInput.addEventListener('change', updateWorkTime);
        breakTimeInput.addEventListener('change', updateBreakTime);
        shareBtn.addEventListener('click', () => {
            alert('分享功能已触发！在小红书应用中，这将打开分享对话框');
        });
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initChart();
            updateTimerDisplay();
        });
    </script>
</body>
</html>
