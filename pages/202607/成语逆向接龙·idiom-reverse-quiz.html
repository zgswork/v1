<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>成语逆向接龙 · DKFile</title>
  <meta name="description" content="已知当前环，在末字相同的候选里点选链上的上一环。">
  <style>
    :root {
      --green: #059669;
      --green-mid: #10b981;
      --green-soft: #d1fae5;
      --green-faint: #ecfdf5;
      --ink: #0f172a;
      --ink-soft: #475569;
      --muted: #94a3b8;
      --line: #e2e8f0;
      --card: #ffffff;
      --shadow-lg: 0 22px 50px -12px rgba(15, 23, 42, 0.12);
      --radius: 16px;
      --radius-sm: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      line-height: 1.55;
      background: linear-gradient(165deg, var(--green-faint) 0%, #f8fafc 42%, #ffffff 100%);
      background-attachment: fixed;
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: clamp(20px, 4vw, 40px) clamp(16px, 4vw, 28px) 48px; }
    .hero { text-align: center; margin-bottom: clamp(18px, 3vw, 28px); }
    .hero-badge {
      display: inline-block; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--green); background: rgba(16, 185, 129, 0.12); padding: 6px 12px; border-radius: 999px; margin-bottom: 12px;
    }
    .hero-title { margin: 0; font-size: clamp(1.45rem, 4vw, 1.8rem); font-weight: 700; color: var(--ink); }
    .hero-desc { margin: 10px auto 0; max-width: 440px; font-size: 0.9rem; color: var(--ink-soft); }
    .hero-hosted { margin: 14px auto 0; max-width: 480px; font-size: 0.86rem; color: var(--ink-soft); line-height: 1.55; }
    .hero-hosted a { color: var(--green); font-weight: 600; text-decoration: none; }
    .hero-hosted a:hover { text-decoration: underline; }
    .card {
      background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow-lg);
      border: 1px solid rgba(226, 232, 240, 0.85); padding: clamp(22px, 4vw, 32px);
    }
    .status { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; margin-bottom: 16px; font-size: 0.85rem; color: var(--ink-soft); }
    .status strong { color: var(--green); font-weight: 700; }
    .load-panel { text-align: center; padding: 28px 12px; color: var(--ink-soft); font-size: 0.95rem; }
    .load-panel.err { color: #b91c1c; }
    .spinner {
      width: 36px; height: 36px; border: 3px solid var(--line); border-top-color: var(--green-mid);
      border-radius: 50%; margin: 0 auto 14px; animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
    .curr-box {
      text-align: center; padding: 18px 16px; border-radius: var(--radius-sm);
      background: linear-gradient(180deg, rgba(236, 253, 245, 0.9) 0%, rgba(248, 250, 252, 0.5) 100%);
      border: 1px solid rgba(16, 185, 129, 0.22); margin-bottom: 14px;
    }
    .curr-label { font-size: 0.78rem; font-weight: 600; color: var(--green); margin-bottom: 8px; }
    .curr-idiom { font-size: clamp(1.5rem, 6vw, 2rem); font-weight: 800; letter-spacing: 0.12em; }
    .rule-line { text-align: center; font-size: 0.88rem; color: var(--ink-soft); margin-bottom: 18px; }
    .rule-line strong { color: var(--green); font-weight: 700; }
    .choices { display: flex; flex-direction: column; gap: 10px; }
    .choice {
      font-family: inherit; font-size: 1.05rem; font-weight: 700; letter-spacing: 0.08em; padding: 16px 18px;
      border-radius: var(--radius-sm); border: 2px solid var(--line); background: #fafafa; color: var(--ink);
      cursor: pointer; text-align: center; transition: border-color 0.15s ease, background 0.15s ease;
    }
    .choice:hover:not(:disabled) { border-color: rgba(16, 185, 129, 0.45); background: var(--green-faint); }
    .choice:disabled { cursor: default; opacity: 0.92; }
    .choice.is-correct { border-color: var(--green-mid); background: var(--green-soft); }
    .choice.is-wrong { border-color: #fdba74; background: #fff7ed; color: var(--ink-soft); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 16px; }
    button.nav-btn {
      font-family: inherit; font-size: 0.95rem; font-weight: 600; padding: 12px 22px; border-radius: 999px;
      border: none; cursor: pointer; transition: transform 0.12s ease;
    }
    button.nav-btn:active { transform: scale(0.98); }
    .btn-primary {
      background: linear-gradient(135deg, var(--green-mid), var(--green)); color: #fff;
      box-shadow: 0 8px 20px rgba(5, 150, 105, 0.28);
    }
    .btn-ghost { background: #fff; color: var(--ink-soft); border: 1px solid var(--line); }
    .feedback { min-height: 1.5em; text-align: center; font-size: 0.95rem; font-weight: 600; margin-top: 12px; }
    .feedback.ok { color: var(--green); }
    .feedback.bad { color: #b45309; }
    .hint {
      margin-top: 16px; padding: 12px 14px; border-radius: var(--radius-sm);
      background: rgba(236, 253, 245, 0.9); border: 1px solid rgba(16, 185, 129, 0.2);
      font-size: 0.82rem; color: var(--ink-soft); line-height: 1.5;
    }
    .footer-note { margin-top: 28px; text-align: center; font-size: 0.78rem; color: var(--muted); }
    .footer-note a { color: var(--green); text-decoration: none; }
    .footer-note a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="hero-badge">DKFile · 静态小工具</div>
      <h1 class="hero-title">成语逆向接龙</h1>
      <p class="hero-desc">正向接龙是「看上一环猜下一环」。这里是反过来的：给出当前环，你要在四个「末字相同」的成语里，点中链上紧挨着它的上一环。</p>
      <p class="hero-hosted">
        在线词库见
        <a href="https://dkfile.net/hosted-data" target="_blank" rel="noopener noreferrer">数据托管</a>
        ，维护一次，全站演示页热更新。
      </p>
    </header>

    <main class="card">
      <div id="loadPanel" class="load-panel">
        <div class="spinner" aria-hidden="true"></div>
        <div>正在加载词库…</div>
      </div>

      <div id="gamePanel" class="hidden">
        <div class="status">
          <span>链长：<strong id="chainLen">—</strong></span>
          <span>连续答对：<strong id="streak">0</strong></span>
        </div>

        <div class="curr-box">
          <div class="curr-label">当前环（接在后面的一环）</div>
          <div class="curr-idiom" id="currIdiom">—</div>
        </div>
        <p class="rule-line" id="ruleLine">上一环末字须为 <strong>—</strong>（即当前环首字）。</p>

        <div class="choices" id="choices" role="group" aria-label="候选上一环"></div>
        <div class="feedback" id="feedback" aria-live="assertive"></div>
        <div class="actions">
          <button type="button" class="nav-btn btn-primary hidden" id="btnNext">下一题</button>
          <button type="button" class="nav-btn btn-ghost" id="btnSkip">换一题</button>
        </div>
        <div class="hint">四个选项末字相同（都等于当前环首字）；真正上一环需与词库长链一致。与「接龙抢答」一正一反，可换着练。</div>
      </div>
    </main>

    <p class="footer-note">
      词库：<a href="https://dkfile.net/dkfile-data/pub/f5d8d830b8487f558005acca25e705e6" target="_blank" rel="noopener noreferrer">dkfile 公开数据</a>
    </p>
  </div>

  <script>
(function () {
  var DATA_URL = 'https://dkfile.net/dkfile-data/pub/f5d8d830b8487f558005acca25e705e6';

  var loadPanel = document.getElementById('loadPanel');
  var gamePanel = document.getElementById('gamePanel');
  var currIdiomEl = document.getElementById('currIdiom');
  var ruleLine = document.getElementById('ruleLine');
  var choicesEl = document.getElementById('choices');
  var feedbackEl = document.getElementById('feedback');
  var streakEl = document.getElementById('streak');
  var chainLenEl = document.getElementById('chainLen');
  var btnNext = document.getElementById('btnNext');
  var btnSkip = document.getElementById('btnSkip');

  var words = [];
  var byLast = {};
  var streak = 0;
  var current = null;
  var locked = false;

  function isFourHan(s) {
    return typeof s === 'string' && /^[\u4e00-\u9fff]{4}$/.test(s);
  }

  function shuffleInPlace(a) {
    var i = a.length;
    while (i > 1) {
      i -= 1;
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i];
      a[i] = a[j];
      a[j] = t;
    }
    return a;
  }

  function showLoadError(msg) {
    loadPanel.classList.add('err');
    loadPanel.innerHTML = '<div style="margin-bottom:10px;font-weight:600;">' + (msg || '加载失败') + '</div>' +
      '<button type="button" class="nav-btn btn-primary" id="btnRetry" style="margin-top:6px;">重试</button>';
    document.getElementById('btnRetry').addEventListener('click', function () {
      loadPanel.classList.remove('err');
      loadPanel.innerHTML = '<div class="spinner" aria-hidden="true"></div><div>正在加载词库…</div>';
      fetchWords();
    });
  }

  function buildIndex() {
    byLast = {};
    for (var j = 0; j < words.length; j++) {
      var w = words[j];
      var c3 = w.charAt(3);
      if (!byLast[c3]) byLast[c3] = [];
      byLast[c3].push(w);
    }
  }

  function fetchWords() {
    fetch(DATA_URL, { credentials: 'omit' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        var raw = (data && data.words) ? data.words : [];
        words = raw.filter(isFourHan);
        if (words.length < 4) {
          showLoadError('有效成语不足');
          return;
        }
        buildIndex();
        loadPanel.classList.add('hidden');
        gamePanel.classList.remove('hidden');
        chainLenEl.textContent = String(words.length);
        newRound();
      })
      .catch(function () {
        showLoadError('无法拉取词库。请在本站域名下打开，或稍后重试。');
      });
  }

  function linkOk(i) {
    if (i < 1) return false;
    return words[i].charAt(0) === words[i - 1].charAt(3);
  }

  function pickRoundIndex() {
    for (var t = 0; t < 220; t++) {
      var i = 1 + Math.floor(Math.random() * (words.length - 1));
      if (!linkOk(i)) continue;
      var head = words[i].charAt(0);
      if (byLast[head] && byLast[head].length >= 4) return i;
    }
    return -1;
  }

  function buildOptions(correct) {
    var tail = correct.charAt(3);
    var pool = (byLast[tail] || []).filter(function (w) { return w !== correct; });
    shuffleInPlace(pool);
    var out = [correct];
    for (var i = 0; i < pool.length && out.length < 4; i++) {
      out.push(pool[i]);
    }
    shuffleInPlace(out);
    return out;
  }

  function renderChoices(options) {
    choicesEl.innerHTML = '';
    for (var i = 0; i < options.length; i++) {
      (function (text) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'choice';
        btn.textContent = text;
        btn.addEventListener('click', function () { onPick(text, btn); });
        choicesEl.appendChild(btn);
      })(options[i]);
    }
  }

  function newRound() {
    locked = false;
    feedbackEl.textContent = '';
    feedbackEl.className = 'feedback';
    btnNext.classList.add('hidden');

    var idx = pickRoundIndex();
    if (idx < 0) {
      feedbackEl.textContent = '当前词库不足以出逆向四选一，请刷新或更换词库。';
      feedbackEl.className = 'feedback bad';
      return;
    }

    var prev = words[idx - 1];
    var curr = words[idx];
    current = { correct: prev, curr: curr };
    currIdiomEl.textContent = curr;
    ruleLine.innerHTML = '上一环末字须为 <strong>' + curr.charAt(0) + '</strong>（即当前环首字）。';
    renderChoices(buildOptions(prev));
  }

  function onPick(text, btn) {
    if (locked || !current) return;
    locked = true;
    var correct = current.correct;
    var nodes = choicesEl.querySelectorAll('.choice');
    for (var i = 0; i < nodes.length; i++) nodes[i].disabled = true;

    if (text === correct) {
      streak += 1;
      streakEl.textContent = String(streak);
      btn.classList.add('is-correct');
      feedbackEl.textContent = '对，上一环是「' + correct + '」。';
      feedbackEl.className = 'feedback ok';
    } else {
      streak = 0;
      streakEl.textContent = '0';
      btn.classList.add('is-wrong');
      for (var j = 0; j < nodes.length; j++) {
        if (nodes[j].textContent === correct) nodes[j].classList.add('is-correct');
      }
      feedbackEl.textContent = '应为「' + correct + '」。';
      feedbackEl.className = 'feedback bad';
    }
    btnNext.classList.remove('hidden');
  }

  btnNext.addEventListener('click', newRound);
  btnSkip.addEventListener('click', newRound);

  fetchWords();
})();
  </script>
</body>
</html>
