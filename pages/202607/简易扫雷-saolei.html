<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>简易扫雷</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
            padding: 10px;
            min-height: 100vh;
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.8rem;
        }

        .game-container {
            width: 100%;
            max-width: 500px;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding: 10px;
            background-color: #ddd;
            border-radius: 5px;
        }

        .counter {
            background-color: #000;
            color: #f00;
            padding: 5px 10px;
            font-family: monospace;
            border-radius: 3px;
            min-width: 60px;
            text-align: center;
        }

        button {
            padding: 8px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 1rem;
        }

        button:hover {
            background-color: #45a049;
        }

        .game-board {
            display: grid;
            gap: 2px;
            background-color: #bbb;
            padding: 5px;
            border-radius: 5px;
            overflow: hidden;
        }

        .cell {
            aspect-ratio: 1 / 1;
            background-color: #ccc;
            border: 2px solid;
            border-color: #fff #888 #888 #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
        }

        .cell.revealed {
            border: 1px solid #999;
            background-color: #eee;
            cursor: default;
        }

        .cell.flagged {
            background-color: #ff9800;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white"><path d="M12,1L3,5V11C3,16.55 6.84,21.74 12,23C17.16,21.74 21,16.55 21,11V5L12,1M12,5.6L16.4,7.8L17.2,9.8L15.2,11.2L16.4,13.2L12,11.6L7.6,13.2L8.8,11.2L6.8,9.8L7.6,7.8L12,5.6Z" /></svg>');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 70%;
        }

        .cell.question {
            background-color: #90caf9;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="black"><path d="M15.07,11.25L14.17,12.17C13.45,12.89 13,13.5 13,15H11V14.5C11,13.39 11.45,12.39 12.17,11.67L13.41,10.41C13.78,10.05 14,9.55 14,9C14,7.89 13.1,7 12,7A2,2 0 0,0 10,9H8A4,4 0 0,1 12,5A4,4 0 0,1 16,9C16,9.88 15.64,10.67 15.07,11.25M13,19H11V17H13M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z" /></svg>');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 70%;
        }

        .cell.mine {
            background-color: #f44336;
        }

        .cell.mine.revealed {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="black"><path d="M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2M12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4M11,9H13V11H11V9M11,13H13V17H11V13Z" /></svg>');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 70%;
        }

        .cell.exploded-mine {
            background-color: #ff0000;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { background-color: #ff0000; }
            50% { background-color: #ff6666; }
            100% { background-color: #ff0000; }
        }

        .cell.number-1 {
            color: #0000ff;
        }

        .cell.number-2 {
            color: #008000;
        }

        .cell.number-3 {
            color: #ff0000;
        }

        .cell.number-4 {
            color: #000080;
        }

        .cell.number-5 {
            color: #800000;
        }

        .cell.number-6 {
            color: #008080;
        }

        .cell.number-7 {
            color: #000000;
        }

        .cell.number-8 {
            color: #808080;
        }

        .game-message {
            margin-top: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            min-height: 24px;
        }

        /* 适配不同屏幕尺寸 */
        @media (max-width: 320px) {
            h1 {
                font-size: 1.5rem;
            }
            .cell {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <h1>简易扫雷</h1>
    <div class="game-container">
        <div class="game-info">
            <div class="counter" id="mines-counter">0</div>
            <button id="restart-btn">重新开始</button>
            <div class="counter" id="time-counter">0</div>
        </div>
        <div class="game-board" id="game-board"></div>
        <div class="game-message" id="game-message"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 游戏配置
            const config = {
                easy: { rows: 8, cols: 8, mines: 10 },
                medium: { rows: 16, cols: 16, mines: 40 },
                hard: { rows: 16, cols: 30, mines: 99 }
            };

            // 当前游戏状态
            let gameState = {
                board: [],
                rows: config.easy.rows,
                cols: config.easy.cols,
                mines: config.easy.mines,
                revealed: 0,
                flags: 0,
                questions: 0,
                gameOver: false,
                gameWon: false,
                startTime: null,
                timerInterval: null,
                explodedMine: null,
                maxFlags: 10 // 新增：最大标记数量限制
            };

            // DOM 元素
            const gameBoard = document.getElementById('game-board');
            const minesCounter = document.getElementById('mines-counter');
            const timeCounter = document.getElementById('time-counter');
            const restartBtn = document.getElementById('restart-btn');
            const gameMessage = document.getElementById('game-message');

            // 初始化游戏
            initGame();

            // 重新开始按钮点击事件
            restartBtn.addEventListener('click', initGame);

            // 初始化游戏
            function initGame() {
                // 清除之前的计时器
                if (gameState.timerInterval) {
                    clearInterval(gameState.timerInterval);
                }

                // 重置游戏状态
                gameState = {
                    board: [],
                    rows: gameState.rows,
                    cols: gameState.cols,
                    mines: gameState.mines,
                    revealed: 0,
                    flags: 0,
                    questions: 0,
                    gameOver: false,
                    gameWon: false,
                    startTime: null,
                    timerInterval: null,
                    explodedMine: null,
                    maxFlags: 10
                };

                // 清空游戏板
                gameBoard.innerHTML = '';
                gameMessage.textContent = '';

                // 设置游戏板网格
                gameBoard.style.gridTemplateColumns = `repeat(${gameState.cols}, 1fr)`;

                // 创建游戏板数据
                createBoard();

                // 渲染游戏板
                renderBoard();

                // 更新计数器
                updateCounters();
            }

            // 创建游戏板数据
            function createBoard() {
                // 初始化空棋盘
                for (let i = 0; i < gameState.rows; i++) {
                    gameState.board[i] = [];
                    for (let j = 0; j < gameState.cols; j++) {
                        gameState.board[i][j] = {
                            isMine: false,
                            isRevealed: false,
                            isFlagged: false,
                            isQuestion: false,
                            neighborMines: 0
                        };
                    }
                }

                // 随机放置地雷
                let minesPlaced = 0;
                while (minesPlaced < gameState.mines) {
                    const row = Math.floor(Math.random() * gameState.rows);
                    const col = Math.floor(Math.random() * gameState.cols);

                    if (!gameState.board[row][col].isMine) {
                        gameState.board[row][col].isMine = true;
                        minesPlaced++;
                    }
                }

                // 计算每个单元格周围的地雷数
                for (let i = 0; i < gameState.rows; i++) {
                    for (let j = 0; j < gameState.cols; j++) {
                        if (!gameState.board[i][j].isMine) {
                            gameState.board[i][j].neighborMines = countNeighborMines(i, j);
                        }
                    }
                }
            }

            // 计算周围地雷数
            function countNeighborMines(row, col) {
                let count = 0;
                for (let i = -1; i <= 1; i++) {
                    for (let j = -1; j <= 1; j++) {
                        if (i === 0 && j === 0) continue;

                        const newRow = row + i;
                        const newCol = col + j;

                        if (newRow >= 0 && newRow < gameState.rows && newCol >= 0 && newCol < gameState.cols) {
                            if (gameState.board[newRow][newCol].isMine) {
                                count++;
                            }
                        }
                    }
                }
                return count;
            }

            // 渲染游戏板
            function renderBoard() {
                gameBoard.innerHTML = '';

                for (let i = 0; i < gameState.rows; i++) {
                    for (let j = 0; j < gameState.cols; j++) {
                        const cell = document.createElement('div');
                        cell.classList.add('cell');
                        cell.dataset.row = i;
                        cell.dataset.col = j;

                        // 为单元格添加事件监听
                        if (!gameState.gameOver) {
                            cell.addEventListener('click', () => handleCellClick(i, j));
                            cell.addEventListener('contextmenu', (e) => {
                                e.preventDefault();
                                handleRightClick(i, j);
                            });

                            // 移动设备长按标记功能
                            let pressTimer;
                            cell.addEventListener('touchstart', (e) => {
                                pressTimer = setTimeout(() => {
                                    handleRightClick(i, j);
                                }, 500);
                            });

                            cell.addEventListener('touchend', () => {
                                clearTimeout(pressTimer);
                            });

                            cell.addEventListener('touchmove', () => {
                                clearTimeout(pressTimer);
                            });
                        }

                        // 更新单元格显示
                        updateCellDisplay(cell, i, j);

                        gameBoard.appendChild(cell);
                    }
                }
            }

            // 更新单元格显示
            function updateCellDisplay(cell, row, col) {
                const cellData = gameState.board[row][col];

                // 重置单元格样式
                cell.className = 'cell';
                cell.textContent = '';

                if (cellData.isRevealed) {
                    cell.classList.add('revealed');

                    if (cellData.isMine) {
                        cell.classList.add('mine');
                        // 确保显示地雷图案
                        cell.classList.add('revealed');
                        // 标记爆炸的地雷
                        if (gameState.explodedMine && gameState.explodedMine.row === row && gameState.explodedMine.col === col) {
                            cell.classList.add('exploded-mine');
                        }
                    } else if (cellData.neighborMines > 0) {
                        cell.classList.add(`number-${cellData.neighborMines}`);
                        cell.textContent = cellData.neighborMines;
                    }
                } else if (cellData.isFlagged) {
                    cell.classList.add('flagged');
                } else if (cellData.isQuestion) {
                    cell.classList.add('question');
                }
            }

            // 处理单元格点击
            function handleCellClick(row, col) {
                // 如果游戏结束或单元格已被揭示或标记，则不执行操作
                if (gameState.gameOver || gameState.board[row][col].isRevealed || 
                    gameState.board[row][col].isFlagged || gameState.board[row][col].isQuestion) {
                    return;
                }

                // 开始计时
                if (!gameState.startTime) {
                    gameState.startTime = Date.now();
                    gameState.timerInterval = setInterval(updateTimer, 1000);
                }

                const cell = gameState.board[row][col];

                // 如果点击到地雷
                if (cell.isMine) {
                    // 记录爆炸的地雷位置
                    gameState.explodedMine = { row, col };
                    revealAllMines();
                    gameState.gameOver = true;
                    gameMessage.textContent = '游戏结束！你踩到地雷了！';
                    clearInterval(gameState.timerInterval);
                    return;
                }

                // 揭示单元格
                revealCell(row, col);

                // 检查是否获胜
                checkWinCondition();

                // 更新游戏板
                renderBoard();
            }

            // 揭示单元格
            function revealCell(row, col) {
                // 检查边界条件
                if (row < 0 || row >= gameState.rows || col < 0 || col >= gameState.cols) {
                    return;
                }

                const cell = gameState.board[row][col];

                // 如果单元格已被揭示或标记，则不执行操作
                if (cell.isRevealed || cell.isFlagged) {
                    return;
                }

                // 揭示单元格
                cell.isRevealed = true;
                cell.isQuestion = false; // 清除疑问标记
                gameState.revealed++;

                // 如果是空白单元格（周围没有地雷），则递归揭示周围的单元格
                if (cell.neighborMines === 0 && !cell.isMine) {
                    for (let i = -1; i <= 1; i++) {
                        for (let j = -1; j <= 1; j++) {
                            if (i === 0 && j === 0) continue;
                            revealCell(row + i, col + j);
                        }
                    }
                }
            }

            // 揭示所有地雷
            function revealAllMines() {
                for (let i = 0; i < gameState.rows; i++) {
                    for (let j = 0; j < gameState.cols; j++) {
                        const cell = gameState.board[i][j];
                        if (cell.isMine) {
                            // 确保所有地雷都被揭示
                            cell.isRevealed = true;
                        } else if (cell.isFlagged && !cell.isMine) {
                            // 错误标记的单元格
                            cell.isRevealed = true;
                            cell.isFlagged = false;
                        } else if (cell.isQuestion) {
                            // 清除疑问标记
                            cell.isQuestion = false;
                        }
                    }
                }
                // 强制渲染以确保所有地雷图案显示
                renderBoard();
            }

            // 处理右键点击（标记/取消标记地雷）
            function handleRightClick(row, col) {
                // 如果游戏结束或单元格已被揭示，则不执行操作
                if (gameState.gameOver || gameState.board[row][col].isRevealed) {
                    return;
                }

                // 开始计时
                if (!gameState.startTime) {
                    gameState.startTime = Date.now();
                    gameState.timerInterval = setInterval(updateTimer, 1000);
                }

                const cell = gameState.board[row][col];

                // 切换标记状态：无标记 -> 旗帜 -> 问号 -> 无标记
                if (!cell.isFlagged && !cell.isQuestion) {
                    // 检查是否已达到最大标记数量
                    if (gameState.flags >= gameState.maxFlags) {
                        gameMessage.textContent = `已达到最大标记数量(${gameState.maxFlags})`;
                        setTimeout(() => {
                            gameMessage.textContent = '';
                        }, 2000);
                        return;
                    }
                    
                    // 第一次右键点击：添加旗帜
                    cell.isFlagged = true;
                    gameState.flags++;
                } else if (cell.isFlagged) {
                    // 第二次右键点击：移除旗帜，添加问号
                    cell.isFlagged = false;
                    cell.isQuestion = true;
                    gameState.flags--;
                    gameState.questions++;
                } else if (cell.isQuestion) {
                    // 第三次右键点击：移除问号
                    cell.isQuestion = false;
                    gameState.questions--;
                }

                // 更新计数器
                updateCounters();

                // 检查是否获胜
                checkWinCondition();

                // 更新游戏板
                renderBoard();
            }

            // 更新计数器
            function updateCounters() {
                minesCounter.textContent = Math.max(0, gameState.mines - gameState.flags);
                timeCounter.textContent = gameState.startTime ? Math.floor((Date.now() - gameState.startTime) / 1000) : 0;
            }

            // 更新计时器
            function updateTimer() {
                timeCounter.textContent = Math.floor((Date.now() - gameState.startTime) / 1000);
            }

            // 检查胜利条件
            function checkWinCondition() {
                // 检查是否所有非地雷单元格都已揭示
                const totalNonMineCells = gameState.rows * gameState.cols - gameState.mines;
                if (gameState.revealed === totalNonMineCells) {
                    gameState.gameOver = true;
                    gameState.gameWon = true;
                    gameMessage.textContent = '恭喜你，获胜了！';
                    clearInterval(gameState.timerInterval);

                    // 标记所有剩余地雷
                    for (let i = 0; i < gameState.rows; i++) {
                        for (let j = 0; j < gameState.cols; j++) {
                            const cell = gameState.board[i][j];
                            if (cell.isMine && !cell.isFlagged) {
                                cell.isFlagged = true;
                                gameState.flags++;
                            }
                        }
                    }

                    updateCounters();
                }
            }
        });
    </script>
</body>
</html>
