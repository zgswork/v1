<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字顺序记忆游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #fff;
            margin-bottom: 20px;
            font-size: 2em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .info-panel {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px 25px;
            border-radius: 10px;
            color: #fff;
            min-width: 100px;
        }

        .info-item .label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .info-item .value {
            font-size: 1.5em;
            font-weight: bold;
        }

        .countdown-display {
            font-size: 3em;
            color: #ffd700;
            font-weight: bold;
            margin: 20px 0;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            min-height: 60px;
        }

        .status-message {
            font-size: 1.2em;
            color: #fff;
            margin-bottom: 20px;
            min-height: 30px;
        }

        .grid-container {
            display: grid;
            gap: 10px;
            margin: 20px auto;
            justify-content: center;
        }

        .cell {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8em;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.3);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .cell:hover:not(.clicked) {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .cell:active:not(.clicked) {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.4);
        }

        .cell.show-number {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: #fff;
        }

        .cell.hidden {
            background: rgba(255, 255, 255, 0.15);
            color: transparent;
        }

        .cell.correct {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            animation: correctPulse 0.5s ease;
        }

        .cell.wrong {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            animation: wrongShake 0.5s ease;
        }

        .cell.clicked {
            cursor: default;
        }

        @keyframes correctPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.2em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
            font-weight: bold;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .errors-display {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
        }

        .error-heart {
            font-size: 1.5em;
            transition: all 0.3s ease;
        }

        .error-heart.lost {
            opacity: 0.3;
            transform: scale(0.8);
        }

        .level-fails-display {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            margin: 10px 0;
            color: #fff;
            font-size: 0.95em;
        }

        .level-fail-label {
            opacity: 0.8;
            margin-right: 5px;
        }

        .level-heart {
            font-size: 1.2em;
            transition: all 0.3s ease;
        }

        .level-heart.lost {
            opacity: 0.3;
            transform: scale(0.8);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            color: #fff;
            max-width: 400px;
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-content h2 {
            font-size: 2em;
            margin-bottom: 20px;
        }

        .modal-content p {
            font-size: 1.2em;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .next-number-hint {
            background: rgba(255, 215, 0, 0.2);
            padding: 10px 20px;
            border-radius: 10px;
            color: #ffd700;
            font-size: 1.1em;
            margin-bottom: 15px;
        }

        .rules {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: left;
            color: #fff;
        }

        .rules h3 {
            margin-bottom: 10px;
            text-align: center;
        }

        .rules ul {
            padding-left: 20px;
        }

        .rules li {
            margin: 8px 0;
            opacity: 0.9;
        }

        @media (max-width: 500px) {
            .game-container {
                padding: 15px;
            }
            
            .cell {
                width: 55px;
                height: 55px;
                font-size: 1.4em;
            }
            
            h1 {
                font-size: 1.5em;
            }
            
            .info-item {
                padding: 10px 15px;
                min-width: 80px;
            }
            
            .info-item .value {
                font-size: 1.3em;
            }
            
            .countdown-display {
                font-size: 2.5em;
            }
            
            .status-message {
                font-size: 1em;
            }
            
            .btn {
                padding: 12px 30px;
                font-size: 1em;
            }
            
            .rules {
                padding: 15px;
                font-size: 0.9em;
            }
            
            .modal-content {
                padding: 25px;
                margin: 15px;
            }
            
            .modal-content h2 {
                font-size: 1.5em;
            }
            
            .modal-content p {
                font-size: 1em;
            }
        }

        @media (max-width: 360px) {
            .cell {
                width: 48px;
                height: 48px;
                font-size: 1.2em;
            }
            
            .grid-container {
                gap: 6px;
            }
        }

        @media (hover: none) and (pointer: coarse) {
            .cell:hover:not(.clicked) {
                transform: none;
                background: rgba(255, 255, 255, 0.2);
            }
            
            .cell:active:not(.clicked) {
                transform: scale(0.92);
                background: rgba(255, 255, 255, 0.35);
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>数字顺序记忆</h1>
        
        <div class="info-panel">
            <div class="info-item">
                <div class="label">当前关卡</div>
                <div class="value" id="level">1</div>
            </div>
            <div class="info-item">
                <div class="label">数字个数</div>
                <div class="value" id="numbers">3</div>
            </div>
            <div class="info-item">
                <div class="label">记忆时间</div>
                <div class="value" id="memTime">3秒</div>
            </div>
        </div>

        <div class="errors-display" id="errorsDisplay">
            <span class="error-heart">❤️</span>
            <span class="error-heart">❤️</span>
            <span class="error-heart">❤️</span>
        </div>

        <div class="level-fails-display">
            <span class="level-fail-label">关卡机会：</span>
            <span class="level-heart">⭐</span>
            <span class="level-heart">⭐</span>
            <span class="level-heart">⭐</span>
        </div>

        <div class="countdown-display" id="countdown"></div>
        
        <div class="status-message" id="statusMessage">点击开始游戏</div>
        
        <div class="next-number-hint" id="nextHint" style="display: none;">
            请点击数字: <strong id="nextNumber">1</strong>
        </div>

        <div class="grid-container" id="grid"></div>

        <div id="startArea">
            <button class="btn btn-primary" id="startBtn">开始游戏</button>
        </div>

        <div class="rules">
            <h3>游戏规则</h3>
            <ul>
                <li>每关先在倒计时内看清 1~N 的位置</li>
                <li>倒计时结束后数字全部隐藏</li>
                <li>凭记忆按 1-2-3... 依次点击对应格子</li>
                <li>点错计错误，满3次本关失败</li>
                <li>累计失败3关才需从第一关重新开始</li>
                <li>通过任意关卡后，失败次数清零</li>
                <li>最高10级，挑战你的记忆力！</li>
            </ul>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="modalTitle">游戏结束</h2>
            <p id="modalMessage">你已通过所有关卡！</p>
            <div class="modal-buttons">
                <button class="btn btn-primary" id="modalBtn">再来一次</button>
                <button class="btn btn-secondary" id="modalBtn2" style="display: none;">结束挑战</button>
            </div>
        </div>
    </div>

    <script>
        const Game = {
            level: 1,
            maxLevel: 10,
            errors: 0,
            maxErrors: 3,
            levelFails: 0,
            maxLevelFails: 3,
            currentNumber: 1,
            totalNumbers: 3,
            memoryTime: 3,
            numbers: [],
            gamePhase: 'idle',
            timer: null,

            init() {
                this.bindEvents();
                this.updateDisplay();
            },

            bindEvents() {
                document.getElementById('startBtn').addEventListener('click', () => this.startGame());
                document.getElementById('modalBtn').addEventListener('click', () => this.restartGame());
                document.getElementById('modalBtn2').addEventListener('click', () => this.endGame());
            },

            getLevelConfig(level) {
                const configs = {
                    1: { numbers: 3, time: 3 },
                    2: { numbers: 4, time: 4 },
                    3: { numbers: 5, time: 5 },
                    4: { numbers: 6, time: 5 },
                    5: { numbers: 7, time: 6 },
                    6: { numbers: 8, time: 6 },
                    7: { numbers: 9, time: 7 },
                    8: { numbers: 10, time: 7 },
                    9: { numbers: 11, time: 8 },
                    10: { numbers: 12, time: 8 }
                };
                return configs[level] || configs[10];
            },

            updateDisplay() {
                document.getElementById('level').textContent = this.level;
                document.getElementById('numbers').textContent = this.totalNumbers;
                document.getElementById('memTime').textContent = this.memoryTime + '秒';
                this.updateErrorsDisplay();
            },

            updateErrorsDisplay() {
                const hearts = document.querySelectorAll('.error-heart');
                hearts.forEach((heart, index) => {
                    if (index < this.maxErrors - this.errors) {
                        heart.classList.remove('lost');
                    } else {
                        heart.classList.add('lost');
                    }
                });
            },

            startGame() {
                const config = this.getLevelConfig(this.level);
                this.totalNumbers = config.numbers;
                this.memoryTime = config.time;
                this.errors = 0;
                this.currentNumber = 1;
                this.updateDisplay();
                this.generateNumbers();
                this.showMemoryPhase();
            },

            generateNumbers() {
                const grid = document.getElementById('grid');
                const cols = Math.ceil(Math.sqrt(this.totalNumbers + 2));
                const rows = Math.ceil((this.totalNumbers + 2) / cols);
                
                const cellSize = window.innerWidth <= 360 ? 48 : (window.innerWidth <= 500 ? 55 : 70);
                grid.style.gridTemplateColumns = `repeat(${cols}, ${cellSize}px)`;
                grid.innerHTML = '';

                const positions = [];
                const totalCells = cols * rows;
                
                for (let i = 0; i < totalCells; i++) {
                    positions.push(i);
                }
                
                for (let i = positions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [positions[i], positions[j]] = [positions[j], positions[i]];
                }

                this.numbers = [];
                const numberPositions = positions.slice(0, this.totalNumbers);

                for (let i = 0; i < totalCells; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    
                    const numberIndex = numberPositions.indexOf(i);
                    if (numberIndex !== -1) {
                        const num = numberIndex + 1;
                        cell.textContent = num;
                        cell.dataset.number = num;
                        this.numbers.push({ element: cell, number: num, position: i });
                    } else {
                        cell.dataset.number = '0';
                    }
                    
                    grid.appendChild(cell);
                }
            },

            showMemoryPhase() {
                this.gamePhase = 'memory';
                document.getElementById('startArea').style.display = 'none';
                document.getElementById('nextHint').style.display = 'none';
                document.getElementById('statusMessage').textContent = '记住数字位置！';
                
                this.numbers.forEach(item => {
                    const cell = item.element;
                    cell.classList.add('show-number');
                    cell.classList.remove('hidden', 'correct', 'wrong', 'clicked');
                });

                let countdown = this.memoryTime;
                document.getElementById('countdown').textContent = countdown;

                this.timer = setInterval(() => {
                    countdown--;
                    if (countdown > 0) {
                        document.getElementById('countdown').textContent = countdown;
                    } else {
                        clearInterval(this.timer);
                        this.showPlayPhase();
                    }
                }, 1000);
            },

            showPlayPhase() {
                this.gamePhase = 'play';
                document.getElementById('countdown').textContent = '';
                document.getElementById('statusMessage').textContent = '按顺序点击数字！';
                document.getElementById('nextHint').style.display = 'block';
                document.getElementById('nextNumber').textContent = this.currentNumber;

                const allCells = document.querySelectorAll('.cell');
                allCells.forEach(cell => {
                    cell.classList.remove('show-number');
                    cell.classList.add('hidden');
                    cell.classList.remove('clicked');
                    cell.addEventListener('click', (e) => this.handleCellClick(e));
                });
            },

            handleCellClick(e) {
                if (this.gamePhase !== 'play') return;
                
                const cell = e.target;
                if (cell.classList.contains('clicked')) return;

                const clickedNumber = parseInt(cell.dataset.number);

                if (clickedNumber === this.currentNumber) {
                    cell.classList.remove('hidden');
                    cell.classList.add('correct', 'clicked');
                    cell.textContent = clickedNumber;
                    this.currentNumber++;

                    if (this.currentNumber > this.totalNumbers) {
                        this.levelComplete();
                    } else {
                        document.getElementById('nextNumber').textContent = this.currentNumber;
                    }
                } else {
                    cell.classList.add('wrong');
                    this.errors++;
                    this.updateErrorsDisplay();

                    setTimeout(() => {
                        cell.classList.remove('wrong');
                    }, 500);

                    if (this.errors >= this.maxErrors) {
                        this.gameOver();
                    }
                }
            },

            levelComplete() {
                this.gamePhase = 'complete';
                document.getElementById('statusMessage').textContent = '太棒了！关卡通过！';
                document.getElementById('nextHint').style.display = 'none';
                
                this.levelFails = 0;
                this.updateLevelFailsDisplay();

                setTimeout(() => {
                    if (this.level >= this.maxLevel) {
                        this.showModal('恭喜通关！', `你已完成全部 ${this.maxLevel} 关！记忆力超群！`, '再玩一次');
                    } else {
                        this.level++;
                        const config = this.getLevelConfig(this.level);
                        this.totalNumbers = config.numbers;
                        this.memoryTime = config.time;
                        this.updateDisplay();
                        this.showModal('关卡通过！', `进入第 ${this.level} 关\n数字个数: ${this.totalNumbers}，记忆时间: ${this.memoryTime}秒`, '继续挑战', '结束挑战');
                    }
                }, 1000);
            },

            gameOver() {
                this.gamePhase = 'over';
                document.getElementById('statusMessage').textContent = '本关失败';
                document.getElementById('nextHint').style.display = 'none';
                
                this.levelFails++;
                this.updateLevelFailsDisplay();
                
                if (this.levelFails >= this.maxLevelFails) {
                    this.showModal('游戏结束', `累计失败 ${this.maxLevelFails} 次\n需要从第一关重新开始`, '重新开始');
                } else {
                    const remaining = this.maxLevelFails - this.levelFails;
                    this.showModal('本关失败', `还有 ${remaining} 次机会\n点击重试当前关卡`, '重试本关');
                }
            },

            showModal(title, message, btnText, btnText2 = null) {
                document.getElementById('modalTitle').textContent = title;
                document.getElementById('modalMessage').textContent = message;
                document.getElementById('modalBtn').textContent = btnText;
                
                const btn2 = document.getElementById('modalBtn2');
                if (btnText2) {
                    btn2.textContent = btnText2;
                    btn2.style.display = 'inline-block';
                } else {
                    btn2.style.display = 'none';
                }
                
                document.getElementById('modal').classList.add('show');
            },

            restartGame() {
                document.getElementById('modal').classList.remove('show');
                
                const modalBtn = document.getElementById('modalBtn').textContent;
                
                if (modalBtn === '再玩一次' || modalBtn === '重新开始') {
                    this.level = 1;
                    this.levelFails = 0;
                    const config = this.getLevelConfig(1);
                    this.totalNumbers = config.numbers;
                    this.memoryTime = config.time;
                } else if (modalBtn === '重试本关') {
                    // 保持当前关卡
                } else if (modalBtn === '继续挑战') {
                    // 关卡已在 levelComplete 中更新
                }
                
                this.errors = 0;
                this.currentNumber = 1;
                this.updateDisplay();
                this.updateLevelFailsDisplay();
                this.startGame();
            },

            updateLevelFailsDisplay() {
                const hearts = document.querySelectorAll('.level-heart');
                hearts.forEach((heart, index) => {
                    if (index < this.maxLevelFails - this.levelFails) {
                        heart.classList.remove('lost');
                    } else {
                        heart.classList.add('lost');
                    }
                });
            },

            endGame() {
                document.getElementById('modal').classList.remove('show');
                this.gamePhase = 'idle';
                document.getElementById('startArea').style.display = 'block';
                document.getElementById('statusMessage').textContent = `恭喜完成第 ${this.level - 1} 关！点击开始新游戏`;
                document.getElementById('nextHint').style.display = 'none';
                document.getElementById('countdown').textContent = '';
                document.getElementById('grid').innerHTML = '';
                
                this.level = 1;
                this.levelFails = 0;
                this.errors = 0;
                const config = this.getLevelConfig(1);
                this.totalNumbers = config.numbers;
                this.memoryTime = config.time;
                this.updateDisplay();
                this.updateLevelFailsDisplay();
            }
        };

        Game.init();
    </script>
</body>
</html>
