<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>姨妈日历</title>
    <style>
        :root {
            --period-color: #ff6b9d;
            --prediction-color: #ff9ec6;
            --ovulation-color: #c77dff;
            --bg-color: #fff5f9;
            --text-color: #555;
        }
        
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            max-width: 100%;
            box-sizing: border-box;
            line-height: 1.6;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            padding: 25px;
            position: relative;
            overflow: hidden;
        }
        
        h1 {
            color: var(--period-color);
            text-align: center;
            margin-bottom: 30px;
            font-weight: 300;
            font-size: 2.2em;
        }
        
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .month-nav {
            display: flex;
            align-items: center;
        }
        
        .month-nav button {
            background: none;
            border: none;
            font-size: 1.2em;
            cursor: pointer;
            color: var(--period-color);
            padding: 5px 10px;
            border-radius: 5px;
        }
        
        .month-nav button:hover {
            background-color: rgba(255, 107, 157, 0.1);
        }
        
        .current-month {
            font-size: 1.3em;
            margin: 0 15px;
            min-width: 150px;
            text-align: center;
        }
        
        .settings-btn {
            background-color: var(--period-color);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
        }
        
        .settings-btn:hover {
            background-color: #e05d8a;
        }
        
        .days-of-week {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }
        
        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        
        .calendar-day:hover {
            background-color: rgba(255, 107, 157, 0.1);
        }
        
        .calendar-day.empty {
            background-color: transparent;
            cursor: default;
        }
        
        .calendar-day.empty:hover {
            background-color: transparent;
        }
        
        .day-number {
            font-size: 1.1em;
            font-weight: bold;
        }
        
        .day-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-top: 3px;
        }
        
        .period-day {
            background-color: rgba(255, 107, 157, 0.2);
        }
        
        .period-dot {
            background-color: var(--period-color);
        }
        
        .prediction-day {
            background-color: rgba(255, 158, 198, 0.2);
        }
        
        .prediction-dot {
            background-color: var(--prediction-color);
        }
        
        .ovulation-day {
            background-color: rgba(199, 125, 255, 0.2);
        }
        
        .ovulation-dot {
            background-color: var(--ovulation-color);
        }
        
        .today {
            border: 2px solid var(--period-color);
        }
        
        .legend {
            display: flex;
            justify-content: center;
            margin: 25px 0;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            font-size: 0.9em;
        }
        
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .stat-box {
            background-color: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
            flex: 1;
            min-width: 150px;
            text-align: center;
        }
        
        .stat-title {
            color: var(--period-color);
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 1.3em;
            font-weight: bold;
        }
        
        .settings-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        
        .settings-content {
            background-color: white;
            padding: 25px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
        }
        
        .settings-title {
            color: var(--period-color);
            margin-top: 0;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-color);
        }
        
        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        
        .settings-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        
        .settings-actions button {
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            border: none;
        }
        
        .cancel-btn {
            background-color: #f0f0f0;
        }
        
        .save-btn {
            background-color: var(--period-color);
            color: white;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.9em;
            color: #888;
            line-height: 1.8;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            
            h1 {
                font-size: 1.8em;
                margin-bottom: 20px;
            }
            
            .calendar-day {
                border-radius: 8px;
            }
            
            .day-number {
                font-size: 1em;
            }
            
            .legend {
                gap: 10px;
            }
            
            .stat-box {
                min-width: 120px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>姨妈日历</h1>
        
        <div class="calendar-header">
            <div class="month-nav">
                <button id="prev-month">&lt;</button>
                <div class="current-month" id="current-month">2023年10月</div>
                <button id="next-month">&gt;</button>
            </div>
            <button class="settings-btn" id="settings-btn">设置</button>
        </div>
        
        <div class="days-of-week">
            <div>日</div>
            <div>一</div>
            <div>二</div>
            <div>三</div>
            <div>四</div>
            <div>五</div>
            <div>六</div>
        </div>
        
        <div class="calendar-grid" id="calendar-grid">
            <!-- Calendar days will be generated by JavaScript -->
        </div>
        
        <div class="legend">
            <div class="legend-item">
                <div class="legend-dot period-dot"></div>
                <span>经期</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot prediction-dot"></div>
                <span>预测经期</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot ovulation-dot"></div>
                <span>排卵期</span>
            </div>
        </div>
        
        <div class="stats">
            <div class="stat-box">
                <div class="stat-title">下次经期</div>
                <div class="stat-value" id="next-period">11月5日</div>
            </div>
            <div class="stat-box">
                <div class="stat-title">排卵期</div>
            <div class="stat-value" id="ovulation-period">10月21日</div>
            </div>
            <div class="stat-box">
                <div class="stat-title">周期长度</div>
                <div class="stat-value" id="cycle-length">28天</div>
            </div>
        </div>
        
        <div class="footer">
            <div>本工具由叁贰壹制作</div>
            <div>微信 coolman88886666</div>
            <div>QQ邮箱 <a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="a1999592939397989195e1d0d08fc2cecc">[email&#160;protected]</a></div>
            <div>gmail <a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="d5a6ede1e6e7e7e3ece5e195b2b8b4bcb9fbb6bab8">[email&#160;protected]</a></div>
        </div>
    </div>
    
    <div class="settings-modal" id="settings-modal">
        <div class="settings-content">
            <h2 class="settings-title">设置周期</h2>
            <div class="form-group">
                <label for="last-period-date">上次经期开始日期</label>
                <input type="date" id="last-period-date">
            </div>
            <div class="form-group">
                <label for="cycle-length-input">周期长度（天）</label>
                <input type="number" id="cycle-length-input" min="21" max="45" value="28">
            </div>
            <div class="form-group">
                <label for="period-length">经期长度（天）</label>
                <input type="number" id="period-length" min="2" max="10" value="5">
            </div>
            <div class="settings-actions">
                <button class="cancel-btn" id="cancel-settings">取消</button>
                <button class="save-btn" id="save-settings">保存</button>
            </div>
        </div>
    </div>
    
    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 初始化数据
        let currentDate = new Date();
        let lastPeriodDate = new Date();
        lastPeriodDate.setDate(lastPeriodDate.getDate() - 28); // 默认28天前
        let cycleLength = 28;
        let periodLength = 5;
        
        // DOM元素
        const calendarGrid = document.getElementById('calendar-grid');
        const currentMonthElement = document.getElementById('current-month');
        const prevMonthBtn = document.getElementById('prev-month');
        const nextMonthBtn = document.getElementById('next-month');
        const settingsBtn = document.getElementById('settings-btn');
        const settingsModal = document.getElementById('settings-modal');
        const cancelSettingsBtn = document.getElementById('cancel-settings');
        const saveSettingsBtn = document.getElementById('save-settings');
        const lastPeriodDateInput = document.getElementById('last-period-date');
        const cycleLengthInput = document.getElementById('cycle-length-input');
        const periodLengthInput = document.getElementById('period-length');
        const nextPeriodElement = document.getElementById('next-period');
        const ovulationPeriodElement = document.getElementById('ovulation-period');
        const cycleLengthElement = document.getElementById('cycle-length');
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 设置默认日期为今天减去28天（模拟上次经期）
            const defaultLastPeriodDate = new Date();
            defaultLastPeriodDate.setDate(defaultLastPeriodDate.getDate() - 28);
            
            // 格式化日期为YYYY-MM-DD
            const formatDateForInput = (date) => {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };
            
            lastPeriodDateInput.value = formatDateForInput(defaultLastPeriodDate);
            updateCalendar();
            updateStats();
        });
        
        // 更新日历
        function updateCalendar() {
            calendarGrid.innerHTML = '';
            
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            currentMonthElement.textContent = `${year}年${month + 1}月`;
            
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            
            const firstDayOfWeek = firstDay.getDay();
            const daysInMonth = lastDay.getDate();
            
            // 添加空白格子
            for (let i = 0; i < firstDayOfWeek; i++) {
                const emptyDay = document.createElement('div');
                emptyDay.className = 'calendar-day empty';
                calendarGrid.appendChild(emptyDay);
            }
            
            // 添加日期格子
            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(year, month, day);
                const dayElement = document.createElement('div');
                dayElement.className = 'calendar-day';
                dayElement.dataset.date = date.toISOString().split('T')[0];
                
                const dayNumber = document.createElement('div');
                dayNumber.className = 'day-number';
                dayNumber.textContent = day;
                dayElement.appendChild(dayNumber);
                
                // 检查是否是今天
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const currentDateWithoutTime = new Date(date);
                currentDateWithoutTime.setHours(0, 0, 0, 0);
                
                if (currentDateWithoutTime.getTime() === today.getTime()) {
                    dayElement.classList.add('today');
                }
                
                // 检查是否是经期、预测经期或排卵期
                const periodInfo = getPeriodInfo(date);
                if (periodInfo.isPeriod) {
                    dayElement.classList.add('period-day');
                    const dot = document.createElement('div');
                    dot.className = 'day-dot period-dot';
                    dayElement.appendChild(dot);
                } else if (periodInfo.isPrediction) {
                    dayElement.classList.add('prediction-day');
                    const dot = document.createElement('div');
                    dot.className = 'day-dot prediction-dot';
                    dayElement.appendChild(dot);
                } else if (periodInfo.isOvulation) {
                    dayElement.classList.add('ovulation-day');
                    const dot = document.createElement('div');
                    dot.className = 'day-dot ovulation-dot';
                    dayElement.appendChild(dot);
                }
                
                calendarGrid.appendChild(dayElement);
            }
        }
        
        // 获取日期信息（经期、预测经期、排卵期）
        function getPeriodInfo(date) {
            const result = {
                isPeriod: false,
                isPrediction: false,
                isOvulation: false
            };
            
            const dateStr = date.toISOString().split('T')[0];
            const lastPeriodStr = lastPeriodDate.toISOString().split('T')[0];
            
            // 检查是否是上次经期
            const lastPeriodEnd = new Date(lastPeriodDate);
            lastPeriodEnd.setDate(lastPeriodEnd.getDate() + periodLength - 1);
            const lastPeriodEndStr = lastPeriodEnd.toISOString().split('T')[0];
            
            if (dateStr >= lastPeriodStr && dateStr <= lastPeriodEndStr) {
                result.isPeriod = true;
                return result;
            }
            
            // 检查是否是预测经期
            const nextPeriodDate = new Date(lastPeriodDate);
            nextPeriodDate.setDate(nextPeriodDate.getDate() + cycleLength);
            const nextPeriodEnd = new Date(nextPeriodDate);
            nextPeriodEnd.setDate(nextPeriodEnd.getDate() + periodLength - 1);
            
            const nextPeriodStr = nextPeriodDate.toISOString().split('T')[0];
            const nextPeriodEndStr = nextPeriodEnd.toISOString().split('T')[0];
            
            if (dateStr >= nextPeriodStr && dateStr <= nextPeriodEndStr) {
                result.isPrediction = true;
                return result;
            }
            
            // 检查是否是排卵期（预测经期前14天±2天）
            const ovulationStart = new Date(nextPeriodDate);
            ovulationStart.setDate(ovulationStart.getDate() - 16);
            const ovulationEnd = new Date(nextPeriodDate);
            ovulationEnd.setDate(ovulationEnd.getDate() - 12);
            
            const ovulationStartStr = ovulationStart.toISOString().split('T')[0];
            const ovulationEndStr = ovulationEnd.toISOString().split('T')[0];
            
            if (dateStr >= ovulationStartStr && dateStr <= ovulationEndStr) {
                result.isOvulation = true;
                return result;
            }
            
            return result;
        }
        
        // 更新统计信息
        function updateStats() {
            // 下次经期
            const nextPeriodDate = new Date(lastPeriodDate);
            nextPeriodDate.setDate(nextPeriodDate.getDate() + cycleLength);
            nextPeriodElement.textContent = `${nextPeriodDate.getMonth() + 1}月${nextPeriodDate.getDate()}日`;
            
            // 排卵期（下次经期前14天）
            const ovulationDate = new Date(nextPeriodDate);
            ovulationDate.setDate(ovulationDate.getDate() - 14);
            ovulationPeriodElement.textContent = `${ovulationDate.getMonth() + 1}月${ovulationDate.getDate()}日`;
            
            // 周期长度
            cycleLengthElement.textContent = `${cycleLength}天`;
            
            // 更新设置表单中的日期
            const formatDateForInput = (date) => {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };
            
            lastPeriodDateInput.value = formatDateForInput(lastPeriodDate);
        }
        
        // 事件监听器
        prevMonthBtn.addEventListener('click', function() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            updateCalendar();
        });
        
        nextMonthBtn.addEventListener('click', function() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            updateCalendar();
        });
        
        settingsBtn.addEventListener('click', function() {
            settingsModal.style.display = 'flex';
        });
        
        cancelSettingsBtn.addEventListener('click', function() {
            settingsModal.style.display = 'none';
        });
        
        saveSettingsBtn.addEventListener('click', function() {
            if (lastPeriodDateInput.value) {
                lastPeriodDate = new Date(lastPeriodDateInput.value);
            }
            
            if (cycleLengthInput.value) {
                cycleLength = parseInt(cycleLengthInput.value);
            }
            
            if (periodLengthInput.value) {
                periodLength = parseInt(periodLengthInput.value);
            }
            
            settingsModal.style.display = 'none';
            updateCalendar();
            updateStats();
        });
        
        // 点击日历日期可以标记/取消标记经期
        calendarGrid.addEventListener('click', function(e) {
            const dayElement = e.target.closest('.calendar-day');
            if (!dayElement || dayElement.classList.contains('empty')) return;
            
            const dateStr = dayElement.dataset.date;
            const clickedDate = new Date(dateStr);
            
            // 如果点击的是今天之前的日期，可以标记为实际经期
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            clickedDate.setHours(0, 0, 0, 0);
            
            if (clickedDate <= today) {
                // 将点击的日期设为上次经期开始日期
                lastPeriodDate = new Date(clickedDate);
                
                // 更新日历和统计信息
                updateCalendar();
                updateStats();
                
                // 更新设置表单中的日期
                const formatDateForInput = (date) => {
                    const year = date.getFullYear();
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const day = String(date.getDate()).padStart(2, '0');
                    return `${year}-${month}-${day}`;
                };
                
                lastPeriodDateInput.value = formatDateForInput(lastPeriodDate);
            }
        });
    </script>
</body>
</html>
