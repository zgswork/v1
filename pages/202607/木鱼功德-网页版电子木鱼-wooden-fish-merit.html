<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>木鱼功德 - 网页版电子木鱼</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            user-select: none;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            color: #333;
            padding: 30px;
            text-align: center;
            position: relative;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="2" fill="rgba(255,255,255,0.3)"/><circle cx="80" cy="30" r="1.5" fill="rgba(255,255,255,0.2)"/><circle cx="40" cy="70" r="1" fill="rgba(255,255,255,0.4)"/><circle cx="90" cy="80" r="2.5" fill="rgba(255,255,255,0.2)"/></svg>');
            pointer-events: none;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
            position: relative;
            z-index: 1;
        }

        .header p {
            opacity: 0.8;
            font-size: 1.1em;
            position: relative;
            z-index: 1;
        }

        .content {
            padding: 40px 30px;
        }

        .wooden-fish-container {
            text-align: center;
            margin-bottom: 40px;
        }

        .wooden-fish {
            width: 200px;
            height: 200px;
            margin: 0 auto 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            border-radius: 50%;
            background: linear-gradient(145deg, #8B4513, #A0522D);
            box-shadow:
                0 10px 30px rgba(139, 69, 19, 0.3),
                inset 0 5px 10px rgba(255, 255, 255, 0.2),
                inset 0 -5px 10px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4em;
            animation: float 3s ease-in-out infinite;
        }

        .wooden-fish:hover {
            transform: scale(1.05);
            box-shadow:
                0 15px 40px rgba(139, 69, 19, 0.4),
                inset 0 5px 10px rgba(255, 255, 255, 0.3),
                inset 0 -5px 10px rgba(0, 0, 0, 0.3);
        }

        .wooden-fish:active {
            transform: scale(0.95);
            animation: tap 0.3s ease;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes tap {
            0% {
                transform: scale(0.95);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes ripple {
            0% {
                transform: scale(0);
                opacity: 1;
            }

            100% {
                transform: scale(4);
                opacity: 0;
            }
        }

        .ripple-effect {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 215, 0, 0.6);
            transform: scale(0);
            animation: ripple 0.6s linear;
            pointer-events: none;
        }

        .merit-display {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
        }

        .merit-count {
            font-size: 3em;
            font-weight: bold;
            color: #8B4513;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .merit-label {
            font-size: 1.2em;
            color: #8B4513;
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #e9ecef;
        }

        .stat-number {
            font-size: 1.8em;
            font-weight: bold;
            color: #8B4513;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .control-group {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #e9ecef;
        }

        .control-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #4CAF50;
        }

        input:checked+.slider:before {
            transform: translateX(26px);
        }

        .volume-control {
            margin-top: 10px;
        }

        .volume-slider {
            width: 100%;
            height: 5px;
            border-radius: 5px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #4CAF50;
            cursor: pointer;
        }

        .volume-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #4CAF50;
            cursor: pointer;
            border: none;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn {
            padding: 15px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .blessing-text {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #ffeaa7, #fab1a0);
            border-radius: 10px;
            font-style: italic;
            color: #8B4513;
            font-size: 1.1em;
            line-height: 1.6;
        }

        .floating-merit {
            position: absolute;
            color: #FFD700;
            font-weight: bold;
            font-size: 1.5em;
            pointer-events: none;
            animation: floatUp 2s ease-out forwards;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0);
            }

            100% {
                opacity: 0;
                transform: translateY(-100px);
            }
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
            }

            .content {
                padding: 30px 20px;
            }

            .wooden-fish {
                width: 150px;
                height: 150px;
                font-size: 3em;
            }

            .merit-count {
                font-size: 2.5em;
            }

            .controls {
                grid-template-columns: 1fr;
            }
        }

        .footer {
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
            padding: 30px;
            text-align: center;
        }

        .developer-info {
            max-width: 500px;
            margin: 0 auto;
        }

        .developer-title {
            font-size: 1.2em;
            color: #8B4513;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .contact-item {
            background: white;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #e9ecef;
            transition: all 0.3s;
        }

        .contact-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .contact-icon {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .contact-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 1.1em;
        }

        .contact-subtitle {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .qr-code {
            width: 100px;
            height: 100px;
            margin: 0 auto 10px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            color: #999;
            font-size: 12px;
        }

        .qr-code img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 6px;
        }

        .wechat-name {
            font-weight: 600;
            color: #FFD700;
            margin-top: 8px;
            font-size: 1.1em;
        }

        .wechat-id {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #8B4513;
            padding: 8px 15px;
            border-radius: 20px;
            font-family: 'Courier New', monospace;
            font-weight: 600;
            display: inline-block;
            margin-top: 5px;
        }

        .contact-note {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
        }

        .footer-note {
            color: #666;
            font-size: 0.9em;
            margin-top: 20px;
            line-height: 1.5;
        }

        .footer-note .highlight {
            color: #FFD700;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .contact-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .footer {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🪵 木鱼功德</h1>
            <p>敲击木鱼，积累功德，净化心灵</p>
        </div>

        <div class="content">
            <!-- 木鱼主体 -->
            <div class="wooden-fish-container">
                <div class="wooden-fish" id="woodenFish" onclick="tapWoodenFish()">
                    🪵
                </div>
            </div>

            <!-- 功德显示 -->
            <div class="merit-display">
                <div class="merit-count" id="meritCount">0</div>
                <div class="merit-label">功德值</div>
            </div>

            <!-- 统计信息 -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="todayCount">0</div>
                    <div class="stat-label">今日敲击</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalCount">0</div>
                    <div class="stat-label">总计敲击</div>
                </div>
            </div>

            <!-- 控制面板 -->
            <div class="controls">
                <div class="control-group">
                    <div class="control-title">
                        💾 数据存储
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="saveDataToggle" checked onchange="toggleSaveData()">
                        <span class="slider"></span>
                    </label>
                    <div style="margin-top: 10px; font-size: 12px; color: #666;">
                        开启后会保存您的功德记录
                    </div>
                </div>

                <div class="control-group">
                    <div class="control-title">
                        🔊 音效设置
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="soundToggle" checked onchange="toggleSound()">
                        <span class="slider"></span>
                    </label>
                    <div class="volume-control">
                        <input type="range" min="0" max="100" value="50" class="volume-slider" id="volumeSlider"
                            oninput="adjustVolume()">
                        <div style="font-size: 12px; color: #666; margin-top: 5px;">音量: <span
                                id="volumeDisplay">50</span>%</div>
                    </div>
                </div>
            </div>

            <!-- 操作按钮 -->
            <div class="action-buttons">
                <button class="btn btn-secondary" onclick="resetMerit()">
                    🔄 重置功德
                </button>
                <button class="btn btn-primary" onclick="exportData()">
                    📊 导出数据
                </button>
            </div>

            <!-- 祝福语 -->
            <div class="blessing-text" id="blessingText">
                点击木鱼开始积累功德，愿您心想事成，万事如意！
            </div>
        </div>

        <!-- 开发者联系方式 -->
        <div class="footer">
            <div class="developer-info">
                <div class="developer-title">🙏 开发者联系方式</div>

                <div class="contact-grid">
                    <div class="contact-item">
                        <div class="contact-icon">📱</div>
                        <div class="contact-title">关注公众号</div>
                        <div class="contact-subtitle">获取更多实用工具和AI资讯</div>
                        <div class="qr-code" id="qrCode">

    <script>
        // 全局变量
        let meritCount = 0;
        let todayCount = 0;
        let totalCount = 0;
        let saveDataEnabled = true;
        let soundEnabled = true;
        let volume = 0.5;
        let audioContext = null;

        // 祝福语数组
        const blessings = [
            "功德+1，愿您心想事成！",
            "南无阿弥陀佛，功德无量！",
            "积善成德，福报自来！",
            "一声木鱼一份功德，善哉善哉！",
            "敲击木鱼，净化心灵，功德圆满！",
            "功德累积，智慧增长！",
            "木鱼声声，消除业障！",
            "善念一起，功德千倍！",
            "敲响木鱼，敲响希望！",
            "功德如海，智慧如山！"
        ];

        // 初始化
        function init() {
            loadData();
            updateDisplay();
            initAudio();
        }

        // 初始化音频
        function initAudio() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {
                console.log('音频上下文初始化失败');
            }
        }

        // 生成木鱼音效
        function playWoodenFishSound() {
            if (!soundEnabled || !audioContext) return;

            try {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                // 木鱼音效参数
                oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(200, audioContext.currentTime + 0.1);

                gainNode.gain.setValueAtTime(volume, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);

                oscillator.type = 'triangle';
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.3);
            } catch (e) {
                console.log('音效播放失败');
            }
        }

        // 敲击木鱼
        function tapWoodenFish() {
            // 增加功德
            meritCount++;
            todayCount++;
            totalCount++;

            // 播放音效
            playWoodenFishSound();

            // 创建波纹效果
            createRippleEffect();

            // 创建浮动功德文字
            createFloatingMerit();

            // 更新显示
            updateDisplay();

            // 更新祝福语
            updateBlessing();

            // 保存数据
            if (saveDataEnabled) {
                saveData();
            }
        }

        // 创建波纹效果
        function createRippleEffect() {
            const fish = document.getElementById('woodenFish');
            const ripple = document.createElement('div');
            ripple.className = 'ripple-effect';

            const rect = fish.getBoundingClientRect();
            const size = 50;

            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (rect.width / 2 - size / 2) + 'px';
            ripple.style.top = (rect.height / 2 - size / 2) + 'px';

            fish.appendChild(ripple);

            setTimeout(() => {
                ripple.remove();
            }, 600);
        }

        // 创建浮动功德文字
        function createFloatingMerit() {
            const container = document.querySelector('.wooden-fish-container');
            const floatingText = document.createElement('div');
            floatingText.className = 'floating-merit';
            floatingText.textContent = '+1 功德';

            // 随机位置
            const randomX = Math.random() * 200 - 100;
            floatingText.style.left = `calc(50% + ${randomX}px)`;
            floatingText.style.top = '50%';

            container.appendChild(floatingText);

            setTimeout(() => {
                floatingText.remove();
            }, 2000);
        }

        // 更新显示
        function updateDisplay() {
            document.getElementById('meritCount').textContent = meritCount.toLocaleString();
            document.getElementById('todayCount').textContent = todayCount.toLocaleString();
            document.getElementById('totalCount').textContent = totalCount.toLocaleString();
        }

        // 更新祝福语
        function updateBlessing() {
            const blessingElement = document.getElementById('blessingText');
            const randomBlessing = blessings[Math.floor(Math.random() * blessings.length)];
            blessingElement.textContent = randomBlessing;

            // 添加闪烁效果
            blessingElement.style.animation = 'none';
            setTimeout(() => {
                blessingElement.style.animation = 'pulse 0.5s ease-in-out';
            }, 10);
        }

        // 切换数据保存
        function toggleSaveData() {
            saveDataEnabled = document.getElementById('saveDataToggle').checked;
            if (saveDataEnabled) {
                saveData();
            }
        }

        // 切换音效
        function toggleSound() {
            soundEnabled = document.getElementById('soundToggle').checked;
        }

        // 调整音量
        function adjustVolume() {
            const slider = document.getElementById('volumeSlider');
            volume = slider.value / 100;
            document.getElementById('volumeDisplay').textContent = slider.value;
        }

        // 重置功德
        function resetMerit() {
            if (confirm('确定要重置所有功德记录吗？此操作不可恢复！')) {
                meritCount = 0;
                todayCount = 0;
                totalCount = 0;
                updateDisplay();

                if (saveDataEnabled) {
                    saveData();
                }

                document.getElementById('blessingText').textContent = '功德已重置，重新开始积累吧！';
            }
        }

        // 导出数据
        function exportData() {
            const data = {
                meritCount: meritCount,
                todayCount: todayCount,
                totalCount: totalCount,
                exportDate: new Date().toISOString(),
                exportTime: new Date().toLocaleString('zh-CN')
            };

            const dataStr = JSON.stringify(data, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });

            const link = document.createElement('a');
            link.href = URL.createObjectURL(dataBlob);
            link.download = `木鱼功德记录_${new Date().toISOString().split('T')[0]}.json`;
            link.click();

            document.getElementById('blessingText').textContent = '功德数据已导出，善行永存！';
        }

        // 保存数据到本地存储
        function saveData() {
            if (!saveDataEnabled) return;

            const data = {
                meritCount: meritCount,
                todayCount: todayCount,
                totalCount: totalCount,
                lastSaveDate: new Date().toDateString(),
                saveTime: Date.now()
            };

            localStorage.setItem('woodenFishMerit', JSON.stringify(data));
        }

        // 从本地存储加载数据
        function loadData() {
            if (!saveDataEnabled) return;

            const savedData = localStorage.getItem('woodenFishMerit');
            if (savedData) {
                try {
                    const data = JSON.parse(savedData);
                    const today = new Date().toDateString();

                    // 如果是新的一天，重置今日计数
                    if (data.lastSaveDate !== today) {
                        todayCount = 0;
                    } else {
                        todayCount = data.todayCount || 0;
                    }

                    meritCount = data.meritCount || 0;
                    totalCount = data.totalCount || 0;
                } catch (e) {
                    console.log('数据加载失败');
                }
            }
        }

        // 添加键盘支持
        document.addEventListener('keydown', function (event) {
            if (event.code === 'Space' || event.code === 'Enter') {
                event.preventDefault();
                tapWoodenFish();
            }
        });

        // 添加CSS动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes pulse {
                0% { transform: scale(1); }
                50% { transform: scale(1.05); }
                100% { transform: scale(1); }
            }
        `;
        document.head.appendChild(style);

        // 页面加载完成后初始化
        window.addEventListener('load', init);

        // 页面卸载前保存数据
        window.addEventListener('beforeunload', function () {
            if (saveDataEnabled) {
                saveData();
            }
        });
    </script>
