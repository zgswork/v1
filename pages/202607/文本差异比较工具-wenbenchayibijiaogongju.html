<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>文本差异比较工具</title>
    <style>
      :root {
        --bg: #f7f7fa;
        --panel: #ffffff;
        --text: #222;
        --muted: #666;
        --primary: #2962ff;
        --border: #e2e2e8;
        --ins-bg: #e6ffed;
        --ins-text: #127a2e;
        --del-bg: #ffeef0;
        --del-text: #b31d28;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; padding: 0; background: var(--bg); color: var(--text);
        font: 14px/1.6 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Microsoft Yahei", "PingFang SC", sans-serif;
      }
      header {
        position: sticky; top: 0; z-index: 10;
        background: var(--panel); border-bottom: 1px solid var(--border);
        padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
      }
      header h1 { font-size: 18px; margin: 0; }
      header .sub { color: var(--muted); font-size: 12px; }

      .container { max-width: 1100px; margin: 0 auto; padding: 16px; }
      .inputs { display: flex; gap: 12px; flex-wrap: wrap; }
      .panel {
        background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px;
        box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      }
      .inputs .panel { flex: 1 1 420px; min-width: 280px; }
      .inputs label { display: block; font-weight: 600; margin-bottom: 6px; }
      textarea {
        width: 100%; min-height: 180px; resize: vertical;
        padding: 10px; border-radius: 8px; border: 1px solid var(--border);
        font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        background: #fcfcff;
      }

      .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
      .select, .checkbox { display: flex; align-items: center; gap: 6px; }
      select, input[type="checkbox"] { font-size: 13px; }
      .btn {
        padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
        background: var(--panel); cursor: pointer; transition: background 0.15s ease;
      }
      .btn.primary { background: var(--primary); color: white; border-color: var(--primary); }
      .btn:hover { background: #f0f2ff; }
      .btn.primary:hover { background: #1241d7; }

      .result { margin-top: 16px; }
      .stats { display: flex; gap: 12px; color: var(--muted); font-size: 12px; margin-bottom: 8px; }

      /* Unified diff blocks for line mode */
      .diff-block { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
      .line { padding: 6px 10px; white-space: pre-wrap; word-wrap: break-word; border-bottom: 1px dashed #eee; }
      .line:last-child { border-bottom: none; }
      .line.equal { background: #fff; }
      .line.ins { background: var(--ins-bg); color: var(--ins-text); }
      .line.del { background: var(--del-bg); color: var(--del-text); }

      /* Inline diff for word/char */
      .diff-inline { border: 1px solid var(--border); border-radius: 10px; padding: 10px; background: #fff; }
      .tok-ins { background: var(--ins-bg); color: var(--ins-text); border-radius: 4px; padding: 0 2px; }
      .tok-del { background: var(--del-bg); color: var(--del-text); border-radius: 4px; padding: 0 2px; text-decoration: line-through; }

      footer { color: var(--muted); font-size: 12px; text-align: center; margin: 18px 0; }

      @media (max-width: 720px) {
        header h1 { font-size: 16px; }
        textarea { min-height: 150px; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>文本差异比较工具</h1>
      <div class="sub">支持电脑与手机，自适应布局</div>
    </header>
    <div class="container">
      <div class="inputs">
        <div class="panel">
          <label for="a">文本 A</label>
          <textarea id="a" placeholder="在此粘贴或输入左侧文本..."></textarea>
        </div>
        <div class="panel">
          <label for="b">文本 B</label>
          <textarea id="b" placeholder="在此粘贴或输入右侧文本..."></textarea>
        </div>
      </div>

      <div class="panel">
        <div class="controls">
          <div class="select">
            <label for="mode">比较粒度</label>
            <select id="mode">
              <option value="line">按行</option>
              <option value="word">按词</option>
              <option value="char">按字符</option>
            </select>
          </div>
          <div class="checkbox">
            <label for="ignoreCase">忽略大小写</label>
            <input type="checkbox" id="ignoreCase" />
          </div>
          <div class="checkbox">
            <label for="inlineChange">变更行内高亮</label>
            <input type="checkbox" id="inlineChange" checked />
          </div>
          <button class="btn primary" id="btnCompare">比较差异</button>
          <button class="btn" id="btnSwap">交换 A/B</button>
          <button class="btn" id="btnClear">清空</button>
          <button class="btn" id="btnSample">示例</button>
        </div>
        <div class="result" id="result">
          <div class="stats" id="stats"></div>
          <div id="diffView"></div>
        </div>
      </div>

      <footer>提示：按行展示使用统一视图，高亮新增与删除；按词/字符展示为行内高亮。</footer>
    </div>

    <script>
      // Utility: escape HTML
      function escapeHtml(str) {
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      // Tokenization based on mode
      function tokenize(text, mode) {
        if (mode === 'line') {
          // Keep trailing empty line if present to reflect line changes
          const lines = text.replace(/\r/g, '').split('\n');
          return lines;
        }
        if (mode === 'word') {
          // Split into words and whitespace tokens to preserve spacing
          return text.split(/(\s+)/);
        }
        // char mode
        return Array.from(text);
      }

      // Equality comparator with ignoreCase
      function eq(a, b, ignoreCase) {
        if (ignoreCase) {
          return String(a).toLowerCase() === String(b).toLowerCase();
        }
        return a === b;
      }

      // LCS dynamic programming-based diff
      function computeDiff(aTokens, bTokens, ignoreCase) {
        const n = aTokens.length, m = bTokens.length;
        const dp = new Array(n + 1);
        for (let i = 0; i <= n; i++) {
          dp[i] = new Array(m + 1).fill(0);
        }
        for (let i = 1; i <= n; i++) {
          for (let j = 1; j <= m; j++) {
            if (eq(aTokens[i - 1], bTokens[j - 1], ignoreCase)) {
              dp[i][j] = dp[i - 1][j - 1] + 1;
            } else {
              dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
            }
          }
        }
        const ops = [];
        let i = n, j = m;
        while (i > 0 || j > 0) {
          if (i > 0 && j > 0 && eq(aTokens[i - 1], bTokens[j - 1], ignoreCase)) {
            ops.push({ type: 'equal', a: aTokens[i - 1], b: bTokens[j - 1] });
            i--; j--;
          } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
            ops.push({ type: 'insert', b: bTokens[j - 1] });
            j--;
          } else if (i > 0 && (j === 0 || dp[i][j - 1] < dp[i - 1][j])) {
            ops.push({ type: 'delete', a: aTokens[i - 1] });
            i--;
          }
        }
        ops.reverse();
        return ops;
      }

      function renderStats(ops) {
        let ins = 0, del = 0, eqc = 0;
        for (const op of ops) {
          if (op.type === 'insert') ins++;
          else if (op.type === 'delete') del++;
          else eqc++;
        }
        const statsEl = document.getElementById('stats');
        statsEl.innerHTML = `新增: ${ins} · 删除: ${del} · 不变: ${eqc}`;
      }

      function renderUnifiedLine(ops) {
        const container = document.createElement('div');
        container.className = 'diff-block';
        for (const op of ops) {
          const div = document.createElement('div');
          div.className = 'line ' + (op.type === 'equal' ? 'equal' : (op.type === 'insert' ? 'ins' : 'del'));
          if (op.type === 'equal') {
            div.textContent = String(op.a ?? op.b);
          } else if (op.type === 'insert') {
            div.textContent = '+ ' + String(op.b);
          } else {
            div.textContent = '- ' + String(op.a);
          }
          container.appendChild(div);
        }
        return container;
      }

      // Inline highlight for changed lines (delete followed by insert)
      function renderUnifiedLineEnhanced(ops, ignoreCase) {
        const container = document.createElement('div');
        container.className = 'diff-block';
        for (let i = 0; i < ops.length; i++) {
          const op = ops[i];
          const next = ops[i + 1];
          // Detect a changed line: delete followed by insert
          if (op && next && op.type === 'delete' && next.type === 'insert') {
            const oldLine = String(op.a ?? '');
            const newLine = String(next.b ?? '');
            const inlineOps = computeDiff(tokenize(oldLine, 'word'), tokenize(newLine, 'word'), ignoreCase);

            // Old (deleted) line with inline deletions
            const delDiv = document.createElement('div');
            delDiv.className = 'line del';
            delDiv.appendChild(document.createTextNode('- '));
            for (const tok of inlineOps) {
              if (tok.type === 'equal') {
                const span = document.createElement('span');
                span.innerHTML = escapeHtml(String(tok.a ?? tok.b));
                delDiv.appendChild(span);
              } else if (tok.type === 'delete') {
                const span = document.createElement('span');
                span.className = 'tok-del';
                span.innerHTML = escapeHtml(String(tok.a ?? ''));
                delDiv.appendChild(span);
              }
              // inserts are not shown in deleted line
            }
            container.appendChild(delDiv);

            // New (inserted) line with inline insertions
            const insDiv = document.createElement('div');
            insDiv.className = 'line ins';
            insDiv.appendChild(document.createTextNode('+ '));
            for (const tok of inlineOps) {
              if (tok.type === 'equal') {
                const span = document.createElement('span');
                span.innerHTML = escapeHtml(String(tok.a ?? tok.b));
                insDiv.appendChild(span);
              } else if (tok.type === 'insert') {
                const span = document.createElement('span');
                span.className = 'tok-ins';
                span.innerHTML = escapeHtml(String(tok.b ?? ''));
                insDiv.appendChild(span);
              }
              // deletions are not shown in inserted line
            }
            container.appendChild(insDiv);
            i++; // skip the next since we've consumed it
            continue;
          }

          // Fallback to basic rendering for equal, standalone ins/del
          const div = document.createElement('div');
          div.className = 'line ' + (op.type === 'equal' ? 'equal' : (op.type === 'insert' ? 'ins' : 'del'));
          if (op.type === 'equal') {
            div.textContent = String(op.a ?? op.b);
          } else if (op.type === 'insert') {
            div.textContent = '+ ' + String(op.b);
          } else {
            div.textContent = '- ' + String(op.a);
          }
          container.appendChild(div);
        }
        return container;
      }

      function renderInline(ops) {
        const container = document.createElement('div');
        container.className = 'diff-inline';
        for (const op of ops) {
          if (op.type === 'equal') {
            const span = document.createElement('span');
            span.innerHTML = escapeHtml(String(op.a ?? op.b));
            container.appendChild(span);
          } else if (op.type === 'insert') {
            const span = document.createElement('span');
            span.className = 'tok-ins';
            span.innerHTML = escapeHtml(String(op.b));
            container.appendChild(span);
          } else {
            const span = document.createElement('span');
            span.className = 'tok-del';
            span.innerHTML = escapeHtml(String(op.a));
            container.appendChild(span);
          }
        }
        return container;
      }

      function compare() {
        const a = document.getElementById('a').value;
        const b = document.getElementById('b').value;
        const mode = document.getElementById('mode').value;
        const ignoreCase = document.getElementById('ignoreCase').checked;

        const aTokens = tokenize(a, mode);
        const bTokens = tokenize(b, mode);
        const ops = computeDiff(aTokens, bTokens, ignoreCase);

        renderStats(ops);
        const view = document.getElementById('diffView');
        view.innerHTML = '';
        if (mode === 'line') {
          const useInlineChange = document.getElementById('inlineChange').checked;
          view.appendChild(useInlineChange ? renderUnifiedLineEnhanced(ops, ignoreCase) : renderUnifiedLine(ops));
        } else {
          view.appendChild(renderInline(ops));
        }
      }

      function swap() {
        const aEl = document.getElementById('a');
        const bEl = document.getElementById('b');
        const tmp = aEl.value; aEl.value = bEl.value; bEl.value = tmp;
      }

      function clearAll() {
        document.getElementById('a').value = '';
        document.getElementById('b').value = '';
        document.getElementById('stats').innerHTML = '';
        document.getElementById('diffView').innerHTML = '';
      }

      function sample() {
        const a = '今天天气很好，我们去公园散步。\n然后吃冰淇淋。';
        const b = '今天天气很好，我们去公园跑步。\n然后吃冰淇淋！';
        document.getElementById('a').value = a;
        document.getElementById('b').value = b;
      }

      // Bind events
      document.getElementById('btnCompare').addEventListener('click', compare);
      document.getElementById('btnSwap').addEventListener('click', swap);
      document.getElementById('btnClear').addEventListener('click', clearAll);
      document.getElementById('btnSample').addEventListener('click', sample);
    </script>
  </body>
</html>
