<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件重命名工具 - 批量重命名文件，支持正则表达式</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid #f1f3f4;
        }

        .tab {
            padding: 15px 25px;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            color: #666;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .file-input-area {
            border: 2px dashed #d1d5db;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            background: #f9fafb;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .file-input-area:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .file-input-area.dragover {
            border-color: #667eea;
            background: #e0e7ff;
        }

        .file-input {
            display: none;
        }

        .file-list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #e1e5e9;
            border-radius: 8px;
            margin: 20px 0;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #f1f3f4;
            background: white;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-item:nth-child(even) {
            background: #f9fafb;
        }

        .file-name {
            font-weight: 500;
            color: #333;
            flex: 1;
            margin-right: 15px;
        }

        .new-name {
            color: #667eea;
            font-weight: 600;
            flex: 1;
        }

        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-danger {
            background: #dc3545;
        }

        .preview-section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
        }

        .preview-section h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .regex-help {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            margin: 15px 0;
            border-radius: 0 8px 8px 0;
        }

        .regex-help h4 {
            color: #1976d2;
            margin-bottom: 10px;
        }

        .regex-example {
            font-family: 'Courier New', monospace;
            background: #f5f5f5;
            padding: 8px;
            border-radius: 4px;
            margin: 5px 0;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            border-left: 4px solid #f44336;
        }

        .success-message {
            background: #e8f5e8;
            color: #2e7d32;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            border-left: 4px solid #4caf50;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .content {
                padding: 20px;
            }
            
            .tabs {
                flex-direction: column;
            }
            
            .tab {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📁 文件重命名工具</h1>
            <p>批量重命名文件，支持正则表达式和多种命名规则</p>
        </div>
        
        <div class="content">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('simple')">简单重命名</button>
                <button class="tab" onclick="switchTab('regex')">正则表达式</button>
                <button class="tab" onclick="switchTab('sequence')">序号命名</button>
            </div>
            
            <!-- 文件选择区域 -->
            <div class="file-input-area" onclick="document.getElementById('fileInput').click()">
                <div style="font-size: 48px; margin-bottom: 15px;">📁</div>
                <h3>点击选择文件或拖拽文件到此处</h3>
                <p style="color: #666; margin-top: 10px;">支持多文件选择</p>
                <input type="file" id="fileInput" class="file-input" multiple>
            </div>
            
            <!-- 简单重命名 -->
            <div id="simple" class="tab-content active">
                <div class="input-group">
                    <label for="prefix">前缀：</label>
                    <input type="text" id="prefix" placeholder="文件名前缀（可选）">
                </div>
                
                <div class="input-group">
                    <label for="suffix">后缀：</label>
                    <input type="text" id="suffix" placeholder="文件名后缀（可选）">
                </div>
                
                <div class="input-group">
                    <label for="replaceFrom">替换文本：</label>
                    <input type="text" id="replaceFrom" placeholder="要替换的文本">
                </div>
                
                <div class="input-group">
                    <label for="replaceTo">替换为：</label>
                    <input type="text" id="replaceTo" placeholder="替换后的文本">
                </div>
                
                <button class="btn" onclick="applySimpleRename()">预览重命名</button>
            </div>
            
            <!-- 正则表达式重命名 -->
            <div id="regex" class="tab-content">
                <div class="input-group">
                    <label for="regexPattern">正则表达式：</label>
                    <input type="text" id="regexPattern" placeholder="例如：^(.+)\.(\w+)$">
                </div>
                
                <div class="input-group">
                    <label for="regexReplace">替换模式：</label>
                    <input type="text" id="regexReplace" placeholder="例如：new_$1.$2">
                </div>
                
                <div class="regex-help">
                    <h4>正则表达式帮助：</h4>
                    <div class="regex-example">^(.+)\.(\w+)$ → new_$1.$2</div>
                    <p>将 "file.txt" 重命名为 "new_file.txt"</p>
                    <div class="regex-example">^(\d+)_(.+)$ → $2_$1</div>
                    <p>将 "001_photo.jpg" 重命名为 "photo_001.jpg"</p>
                </div>
                
                <button class="btn" onclick="applyRegexRename()">预览重命名</button>
            </div>
            
            <!-- 序号命名 -->
            <div id="sequence" class="tab-content">
                <div class="input-group">
                    <label for="baseName">基础名称：</label>
                    <input type="text" id="baseName" placeholder="例如：photo" value="file">
                </div>
                
                <div class="input-group">
                    <label for="startNumber">起始序号：</label>
                    <input type="number" id="startNumber" value="1" min="0">
                </div>
                
                <div class="input-group">
                    <label for="numberPadding">序号位数：</label>
                    <select id="numberPadding">
                        <option value="1">1位 (1, 2, 3...)</option>
                        <option value="2">2位 (01, 02, 03...)</option>
                        <option value="3" selected>3位 (001, 002, 003...)</option>
                        <option value="4">4位 (0001, 0002, 0003...)</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label for="keepExtension">保持原扩展名：</label>
                    <select id="keepExtension">
                        <option value="true" selected>是</option>
                        <option value="false">否</option>
                    </select>
                </div>
                
                <button class="btn" onclick="applySequenceRename()">预览重命名</button>
            </div>
            
            <!-- 预览区域 -->
            <div id="previewSection" class="preview-section" style="display: none;">
                <h3>重命名预览</h3>
                <div id="fileList" class="file-list"></div>
                <button class="btn" onclick="downloadRenameScript()">下载重命名脚本</button>
                <button class="btn btn-secondary" onclick="clearFiles()">清空文件</button>
            </div>
            
            <div id="messageArea"></div>
        </div>
    </div>

    <script>
        let selectedFiles = [];
        let renamePreview = [];
        
        // 文件选择处理
        document.getElementById('fileInput').addEventListener('change', function(e) {
            handleFiles(e.target.files);
        });
        
        // 拖拽处理
        const fileInputArea = document.querySelector('.file-input-area');
        
        fileInputArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.classList.add('dragover');
        });
        
        fileInputArea.addEventListener('dragleave', function(e) {
            e.preventDefault();
            this.classList.remove('dragover');
        });
        
        fileInputArea.addEventListener('drop', function(e) {
            e.preventDefault();
            this.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });
        
        function handleFiles(files) {
            selectedFiles = Array.from(files);
            showMessage(`已选择 ${selectedFiles.length} 个文件`, 'success');
            
            // 自动预览当前选项卡的重命名
            const activeTab = document.querySelector('.tab.active').textContent;
            if (activeTab === '简单重命名') {
                applySimpleRename();
            } else if (activeTab === '正则表达式') {
                applyRegexRename();
            } else if (activeTab === '序号命名') {
                applySequenceRename();
            }
        }
        
        function switchTab(tabName) {
            // 切换标签页
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
        }
        
        function applySimpleRename() {
            if (selectedFiles.length === 0) {
                showMessage('请先选择文件', 'error');
                return;
            }
            
            const prefix = document.getElementById('prefix').value;
            const suffix = document.getElementById('suffix').value;
            const replaceFrom = document.getElementById('replaceFrom').value;
            const replaceTo = document.getElementById('replaceTo').value;
            
            renamePreview = selectedFiles.map(file => {
                let newName = file.name;
                
                // 替换文本
                if (replaceFrom) {
                    newName = newName.replace(new RegExp(escapeRegex(replaceFrom), 'g'), replaceTo);
                }
                
                // 添加前缀和后缀
                const lastDotIndex = newName.lastIndexOf('.');
                if (lastDotIndex > 0) {
                    const nameWithoutExt = newName.substring(0, lastDotIndex);
                    const extension = newName.substring(lastDotIndex);
                    newName = prefix + nameWithoutExt + suffix + extension;
                } else {
                    newName = prefix + newName + suffix;
                }
                
                return {
                    original: file.name,
                    new: newName
                };
            });
            
            displayPreview();
        }
        
        function applyRegexRename() {
            if (selectedFiles.length === 0) {
                showMessage('请先选择文件', 'error');
                return;
            }
            
            const pattern = document.getElementById('regexPattern').value;
            const replacement = document.getElementById('regexReplace').value;
            
            if (!pattern) {
                showMessage('请输入正则表达式', 'error');
                return;
            }
            
            try {
                const regex = new RegExp(pattern);
                
                renamePreview = selectedFiles.map(file => {
                    const newName = file.name.replace(regex, replacement);
                    return {
                        original: file.name,
                        new: newName
                    };
                });
                
                displayPreview();
            } catch (error) {
                showMessage('正则表达式格式错误：' + error.message, 'error');
            }
        }
        
        function applySequenceRename() {
            if (selectedFiles.length === 0) {
                showMessage('请先选择文件', 'error');
                return;
            }
            
            const baseName = document.getElementById('baseName').value || 'file';
            const startNumber = parseInt(document.getElementById('startNumber').value) || 1;
            const padding = parseInt(document.getElementById('numberPadding').value);
            const keepExtension = document.getElementById('keepExtension').value === 'true';
            
            renamePreview = selectedFiles.map((file, index) => {
                const number = (startNumber + index).toString().padStart(padding, '0');
                let newName = baseName + number;
                
                if (keepExtension) {
                    const lastDotIndex = file.name.lastIndexOf('.');
                    if (lastDotIndex > 0) {
                        newName += file.name.substring(lastDotIndex);
                    }
                }
                
                return {
                    original: file.name,
                    new: newName
                };
            });
            
            displayPreview();
        }
        
        function displayPreview() {
            const fileList = document.getElementById('fileList');
            const previewSection = document.getElementById('previewSection');
            
            fileList.innerHTML = renamePreview.map(item => `
                <div class="file-item">
                    <span class="file-name">${item.original}</span>
                    <span style="color: #666;">→</span>
                    <span class="new-name">${item.new}</span>
                </div>
            `).join('');
            
            previewSection.style.display = 'block';
        }
        
        function downloadRenameScript() {
            if (renamePreview.length === 0) {
                showMessage('没有重命名预览数据', 'error');
                return;
            }
            
            // 生成批处理脚本
            let script = '@echo off\necho 文件重命名脚本\necho 请确保此脚本与要重命名的文件在同一目录下\necho.\npause\necho.\n\n';
            
            renamePreview.forEach(item => {
                if (item.original !== item.new) {
                    script += `ren "${item.original}" "${item.new}"\n`;
                }
            });
            
            script += '\necho.\necho 重命名完成！\npause';
            
            // 下载脚本文件
            const blob = new Blob([script], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'rename_files.bat';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showMessage('重命名脚本已下载，请将脚本放在文件所在目录并运行', 'success');
        }
        
        function clearFiles() {
            selectedFiles = [];
            renamePreview = [];
            document.getElementById('fileInput').value = '';
            document.getElementById('previewSection').style.display = 'none';
            showMessage('已清空文件列表', 'success');
        }
        
        function escapeRegex(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }
        
        function showMessage(message, type) {
            const messageArea = document.getElementById('messageArea');
            const className = type === 'error' ? 'error-message' : 'success-message';
            
            messageArea.innerHTML = `<div class="${className}">${message}</div>`;
            
            setTimeout(() => {
                messageArea.innerHTML = '';
            }, 5000);
        }
    </script>
</body>
</html>
