<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日期计算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #34C759 0%, #248A3D 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
        }
        
        .container {
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 600;
            font-size: 2.2rem;
        }
        
        .date-inputs {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .date-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        label {
            font-size: 1rem;
            font-weight: 500;
        }
        
        input[type="date"] {
            background-color: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 1rem;
            color: #333;
            outline: none;
        }
        
        button {
            background-color: #fff;
            color: #34C759;
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        
        button:hover {
            background-color: #f5f5f5;
            transform: translateY(-2px);
        }
        
        .result {
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            font-size: 1.2rem;
            display: none;
        }
        
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            input[type="date"] {
                padding: 10px 12px;
            }
            
            button {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>日期计算器</h1>
        
        <div class="date-inputs">
            <div class="date-group">
                <label for="start-date">开始日期</label>
                <input type="date" id="start-date" required>
            </div>
            
            <div class="date-group">
                <label for="end-date">结束日期</label>
                <input type="date" id="end-date" required>
            </div>
        </div>
        
        <button id="calculate-btn">计算天数</button>
        
        <div class="result" id="result">
            两个日期之间相差 <span id="days-count">0</span> 天
        </div>
    </div>
    
    <div class="footer">
        由 兔子先生 用 DeepSeek 1分钟生成，你也可以去尝试制作
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 设置默认日期为今天
            const today = new Date();
            const formatDate = (date) => {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };
            
            document.getElementById('start-date').value = formatDate(today);
            document.getElementById('end-date').value = formatDate(today);
            
            // 计算按钮点击事件
            document.getElementById('calculate-btn').addEventListener('click', calculateDays);
            
            function calculateDays() {
                const startDateInput = document.getElementById('start-date').value;
                const endDateInput = document.getElementById('end-date').value;
                
                if (!startDateInput || !endDateInput) {
                    alert('请选择开始和结束日期');
                    return;
                }
                
                const startDate = new Date(startDateInput);
                const endDate = new Date(endDateInput);
                
                // 计算天数差
                const timeDiff = endDate.getTime() - startDate.getTime();
                const dayDiff = Math.abs(Math.ceil(timeDiff / (1000 * 60 * 60 * 24)));
                
                // 显示结果
                document.getElementById('days-count').textContent = dayDiff;
                document.getElementById('result').style.display = 'block';
            }
        });
    </script>
</body>
</html>
