<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文本格式转换工具 · 大小写/内容提取</title>
  <meta name="description" content="大小写转换、文本反转、内容提取（数字/字母/中文），支持多步骤组合，全部在本地浏览器处理。">
  <style>
    :root{
      --bg: #f6f8fb;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e5e7eb;
      --primary: #4f46e5;
      --accent: #22c55e;
      --shadow: 0 10px 30px rgba(2, 6, 23, 0.08);
      --ring: 0 0 0 4px rgba(79,70,229,.12);
      --radius: 14px;
      --radius-sm: 10px;
    }
    .dark{
      --bg: #0b1220;
      --surface: #0f172a;
      --text: #e5e7eb;
      --muted: #9aa4b2;
      --border: #1f2937;
      --primary: #7c9cff;
      --accent: #34d399;
      --shadow: 0 12px 30px rgba(0,0,0,.35);
      --ring: 0 0 0 4px rgba(124,156,255,.18);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(80rem 40rem at 90% -10%, rgba(34,197,94,.08), transparent 60%),
        radial-gradient(60rem 30rem at -10% -10%, rgba(79,70,229,.10), transparent 60%),
        var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .container{
      max-width:1100px;
      margin: 40px auto;
      padding: 0 20px 48px;
    }
    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      margin-bottom: 12px;
    }
    .title{display:flex;align-items:center;gap:12px}
    .logo{
      width:42px;height:42px;border-radius:12px;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      display:grid;place-items:center;color:white;font-size:14px;font-weight:700;
      letter-spacing:.5px;
      box-shadow: 0 10px 24px rgba(79,70,229,.35);
      user-select:none;
    }
    h1{margin:0;font-size:22px;letter-spacing:.2px}
    .sub{margin:4px 0 0;color:var(--muted);font-size:13px}
    .right-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    
    /* 移动端优化 */
    @media (max-width: 640px) {
      header{
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }
      .title{
        justify-content: center;
        text-align: center;
      }
      .right-controls{
        justify-content: center;
        gap: 8px;
      }
      .mode{
        padding: 8px 12px;
        font-size: 13px;
      }
      .mode .label{
        font-size: 13px;
      }
    }
    .icon-btn{
      border:1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      height:40px; width:40px; border-radius:12px;
      display:grid;place-items:center;
      cursor:pointer; box-shadow: var(--shadow);
      transition: transform .08s ease, background .2s ease;
      font-size:18px; line-height:1;
    }
    .icon-btn:hover{transform: translateY(-1px)}
    .icon-btn:active{transform: translateY(0)}

    /* 开关（组合模式） */
    .mode{
      display:flex; align-items:center; gap:8px;
      padding:6px 10px; border:1px solid var(--border); border-radius:999px;
      background: var(--surface); color: var(--muted); font-size:12px;
      box-shadow: var(--shadow);
    }
    .switch{position:relative; display:inline-block; width:44px; height:24px}
    .switch input{opacity:0; width:0; height:0}
    .switch .slider{
      position:absolute; inset:0; background:#e5e7eb; border:1px solid var(--border);
      border-radius:999px; transition: .2s;
    }
    .switch .slider:before{
      content:""; position:absolute; left:2px; top:2px; width:18px; height:18px; background:#fff;
      border-radius:50%; transition:.2s; box-shadow: 0 1px 2px rgba(0,0,0,.15);
    }
    .switch input:checked + .slider{
      background: linear-gradient(135deg, var(--primary), #8b5cf6); border-color: transparent;
    }
    .switch input:checked + .slider:before{ transform: translateX(20px) }
    .mode .label{font-size:12px; color:var(--muted)}

    .card{
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .io{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items:stretch;
      position:relative;
    }
    @media (max-width: 980px){
      .io{grid-template-columns:1fr}
    }

    .pane label{
      display:flex;align-items:center;justify-content:space-between;
      font-size:13px;color:var(--muted);margin-bottom:8px
    }
    textarea{
      width:100%;
      min-height: 220px;
      padding:14px 14px 44px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      outline: none;
      resize: vertical;
      font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      transition: box-shadow .15s ease, border-color .15s ease, background .2s ease;
    }
    textarea:focus{box-shadow: var(--ring); border-color: #c7d2fe}
    .toolbar{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap}
    .btn{
      border:1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding:10px 12px;
      border-radius: 12px;
      font-size: 13px;
      cursor:pointer;
      transition: transform .08s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease;
      position: relative;
      user-select: none;
    }
    .btn:hover{transform: translateY(-1px)}
    .btn:active{transform: translateY(0)}
    .btn.primary{
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      color:#fff; border-color: transparent;
      box-shadow: 0 10px 22px rgba(79,70,229,.35);
    }
    .btn.soft{
      background: rgba(79,70,229,.08);
      border-color: rgba(79,70,229,.35);
      color: #2b2f77;
    }
    .btn.ghost{background: transparent}
    /* 选中态（单次应用与组合模式通用） */
    .btn.active{
      background: rgba(79,70,229,.08);
      border-color:#c7d2fe;
      box-shadow: var(--ring);
    }
    /* 组合模式的顺序角标 */
    body.multi .btn.active::after{
      content: attr(data-order);
      position:absolute; top:-8px; right:-8px;
      width:20px; height:20px; border-radius:50%;
      background: var(--primary); color:#fff;
      display:grid; place-items:center; font-size:12px; font-weight:700;
      border: 2px solid var(--surface);
    }

    .stats{
      font-size:12px;color:var(--muted);
      margin-top:6px;display:flex;gap:10px;flex-wrap:wrap
    }

    .swap{
      position:absolute; inset: 0; margin:auto; width:44px;height:44px; z-index:3;
      display:none; border:1px solid var(--border); border-radius:12px; background: var(--surface);
      box-shadow: var(--shadow); cursor:pointer;
    }
    @media (min-width: 981px){
      .swap{display:grid;place-items:center}
    }

    .sections{margin-top:12px}
    .section{
      margin-top:16px;
      padding: 14px;
      border:1px dashed var(--border);
      border-radius: 14px;
      background: var(--surface);
    }
    .section h2{
      margin:0 0 10px;
      font-size: 14px; font-weight: 600;
      display:flex; align-items:center; gap:8px
    }
    .hint{color:var(--muted); font-size:12px}
    .grid{
      display:grid; gap:8px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    @media (min-width: 720px){
      .grid{grid-template-columns: repeat(3, minmax(0, 1fr))}
    }
    .grid .btn{width:100%}

    /* 组合模式控制条 */
    .combobar{
      margin-top: 10px;
      padding: 10px 14px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      background: var(--surface);
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px; flex-wrap: wrap;
    }
    body.multi .combobar{ display: flex }
    .pipeline{ font-size:12px; color: var(--muted) }
    .pipeline strong{ color: var(--text) }

    .footer {
        margin-top: 50px;
        padding: 20px 0;
        text-align: center;
        font-size: 14px;
        color: #333;  /* 深灰接近黑色，更清晰 */
    }

    .footer a {
        color: #0066cc;  /* 更深的蓝色，对比度更高 */
        text-decoration: none;
    }

    .footer a:hover {
        text-decoration: underline;
    }

    /* 深色背景自动适配 */
    @media (prefers-color-scheme: dark) {
        .footer {
            color: #f0f0f0;  /* 接近白色，更清晰 */
        }
        .footer a {
            color: #4da6ff;  /* 亮蓝色，在深色背景下更清晰 */
        }
    }

    /* 如果页面背景是深色，手动添加这个类 */
    .dark-theme .footer {
        color: #f0f0f0;
    }

    .dark-theme .footer a {
        color: #4da6ff;
    }

    .toast{
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 14px; border-radius: 12px;
      box-shadow: var(--shadow);
      opacity: 0; pointer-events: none;
      transition: opacity .25s ease, transform .25s ease;
      z-index: 9999;
    }
    .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0) }

    .badge{
      padding:2px 8px; border-radius:999px; font-size:11px;
      color:#fff; background: var(--accent);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="title">
        <div class="logo" aria-hidden="true">TXT</div>
        <div>
          <h1>文本格式转换工具</h1>
          <p class="sub">大小写转换 · 文本反转 · 内容提取（数字/字母/中文）</p>
        </div>
      </div>
      <div class="right-controls">
        <div class="mode" title="开启后可多选按钮并按顺序执行">
          <span class="label">组合模式</span>
          <label class="switch" aria-label="切换组合模式">
            <input type="checkbox" id="multiToggle">
            <span class="slider"></span>
          </label>
        </div>
        <button id="themeToggle" class="icon-btn" title="切换主题（浅色/深色）" aria-label="切换主题">🌙</button>
      </div>
    </header>

    <div class="combobar card" id="combobar" aria-live="polite">
      <div class="pipeline">当前步骤：<strong id="pipelineSummary">未选择任何步骤</strong></div>
      <div class="toolbar">
        <button class="btn primary" id="runPipeline" disabled title="按所选顺序开始处理">开始处理</button>
        <button class="btn ghost" id="clearSelection" disabled>清空选择</button>
      </div>
    </div>

    <div class="io">
      <button class="swap" id="swapBtn" title="交换输入/输出" aria-label="交换输入/输出">⇄</button>

      <div class="pane card">
        <label for="input">
          <span>输入文本</span>
          <span class="hint">支持粘贴/拖入文件</span>
        </label>
        <textarea id="input" placeholder="在此粘贴或输入文本..."></textarea>
        <div class="toolbar">
          <button class="btn ghost" id="pasteBtn">粘贴</button>
          <button class="btn ghost" id="clearBtn">清空</button>
        </div>
        <div class="stats" id="inStats">0 字符 · 0 单词 · 0 行</div>
      </div>

      <div class="pane card">
        <label for="output">
          <span>输出结果</span>
          <span class="badge">只读</span>
        </label>
        <textarea id="output" readonly placeholder="点击下方功能按钮或在组合模式下选择多个操作，结果将显示在此"></textarea>
        <div class="toolbar">
          <button class="btn soft" id="copyBtn">复制结果</button>
          <button class="btn ghost" id="applyBackBtn" title="将结果回填到输入框继续处理">应用到输入</button>
          <button class="btn ghost" id="downloadBtn">下载 TXT</button>
        </div>
        <div class="stats" id="outStats">0 字符 · 0 单词 · 0 行</div>
      </div>
    </div>

    <div class="sections">
      <div class="section">
        <h2>🔠 大小写系列转换 <span class="hint">英文适用</span></h2>
        <div class="grid">
          <button class="btn" data-action="upper">全大写</button>
          <button class="btn" data-action="lower">全小写</button>
          <button class="btn" data-action="title">每个单词首字母大写</button>
          <button class="btn" data-action="sentence">句子首字母大写</button>
        </div>
      </div>

      <div class="section">
        <h2>🔁 文本内容变换</h2>
        <div class="grid">
          <button class="btn" data-action="reverseAll">文本整体反转</button>
          <button class="btn" data-action="reversePerLine">逐行反转</button>
        </div>
      </div>

      <div class="section">
        <h2>🧲 内容提取 / 清理</h2>
        <div class="grid">
          <button class="btn" data-action="onlyDigits">提取纯数字</button>
          <button class="btn" data-action="onlyLetters">提取纯字母</button>
          <button class="btn" data-action="onlyChinese">提取纯中文</button>
          <button class="btn" data-action="removeDigits">移除数字</button>
          <button class="btn" data-action="removeLetters">移除字母</button>
          <button class="btn" data-action="removeChinese">移除中文</button>
        </div>
      </div>
    </div>

    <div style="margin-top: 20px; padding: 12px 16px; background: rgba(79,70,229,.04); border: 1px solid rgba(79,70,229,.15); border-radius: 12px; color: var(--muted); font-size: 13px; line-height: 1.5;">
      <span style="color: var(--text); font-weight: 500;">💡 使用说明：</span>默认为单次应用；开启"组合模式"可多选并按顺序执行。处理均在本地浏览器完成，不会上传任何内容。
    </div>

  </div>

  <footer class="footer">
      <p>© 2025 文本格式转换工具 | <a href="https://t.zsxq.com/MlnIL" target="_blank">联系作者</a></p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // 基础选择器
    const $ = s => document.querySelector(s);
    const $$ = s => document.querySelectorAll(s);

    const inputEl = $('#input');
    const outputEl = $('#output');
    const inStats = $('#inStats');
    const outStats = $('#outStats');
    const toastEl = $('#toast');
    const themeBtn = $('#themeToggle');

    const multiToggle = $('#multiToggle');
    const pipelineSummary = $('#pipelineSummary');
    const runPipelineBtn = $('#runPipeline');
    const clearSelectionBtn = $('#clearSelection');

    const actionButtons = Array.from(document.querySelectorAll('.grid .btn[data-action]'));
    const btnByAction = Object.fromEntries(actionButtons.map(b => [b.dataset.action, b]));

    // 文案映射
    const LABELS = {
      upper:'全大写', lower:'全小写', capfirst:'首字母大写', title:'每个单词首字母大写', sentence:'句子首字母大写',
      reverseAll:'文本整体反转', reversePerLine:'逐行反转',
      onlyDigits:'提取纯数字', onlyLetters:'提取纯字母', onlyChinese:'提取纯中文',
      removeDigits:'移除数字', removeLetters:'移除字母', removeChinese:'移除中文'
    };

    let multiMode = false;
    let pipeline = [];
    let singleActiveBtn = null; // 单次应用下的选中按钮

    // 检测浏览器是否支持 Unicode 属性类
    const supportsUnicodeProps = (() => {
      try { new RegExp('\\p{L}', 'u'); return true } catch { return false }
    })();

    // 正则集合及回退
    const RX = {
      digits: supportsUnicodeProps ? /\p{Nd}/gu : /[0-9]/g,
      notDigits: supportsUnicodeProps ? /[^\p{Nd}]/gu : /[^0-9]/g,
      letters: /[A-Za-z]/g,
      notLetters: /[^A-Za-z]/g,
      han: supportsUnicodeProps ? /\p{Script=Han}/gu : /[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]/g,
      notHan: supportsUnicodeProps ? /[^\p{Script=Han}]/gu : /[^\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]/g
    };

    // 字素级分割与反转
    const graphemeSegments = (str) => {
      if (window.Intl && Intl.Segmenter) {
        const seg = new Intl.Segmenter('zh-CN', { granularity: 'grapheme' });
        return Array.from(seg.segment(str), s => s.segment);
      }
      return Array.from(str);
    };
    const reverseGraphemes = (str) => graphemeSegments(str).reverse().join('');

    // 统计
    function updateStats() {
      const [ic, iw, il] = calcStats(inputEl.value);
      inStats.textContent = `${ic} 字符 · ${iw} 单词 · ${il} 行`;
      const [oc, ow, ol] = calcStats(outputEl.value);
      outStats.textContent = `${oc} 字符 · ${ow} 单词 · ${ol} 行`;
    }
    function calcStats(text) {
      const chars = graphemeSegments(text).length;
      const words = (text.match(/[A-Za-z0-9]+/g) || []).length;
      const lines = text.length ? text.split(/\r\n|\r|\n/).length : 0;
      return [chars, words, lines];
    }

    // 转换函数
    const transforms = {
      upper: (s) => s.toUpperCase(),
      lower: (s) => s.toLowerCase(),
      capfirst: (s) => s.replace(/^[A-Za-z]/, c => c.toUpperCase()),
      title: (s) => s.toLowerCase().replace(/\b([a-z])/g, (_, c) => c.toUpperCase()),
      sentence: (s) => {
        const lower = s.toLowerCase();
        let out = '';
        let capNext = true;
        for (let i = 0; i < lower.length; i++) {
          let ch = lower[i];
          if (capNext && /[a-z]/.test(ch)) {
            ch = ch.toUpperCase();
            capNext = false;
          }
          out += ch;
          if (/[.!?。！？]/.test(ch) || ch === '\n' || ch === '\r') capNext = true;
        }
        return out;
      },
      reverseAll: (s) => reverseGraphemes(s),
      reversePerLine: (s) => s.split(/\r?\n/).map(line => reverseGraphemes(line)).join('\n'),
      onlyDigits: (s) => s.replace(RX.notDigits, ''),
      onlyLetters: (s) => s.replace(RX.notLetters, ''),
      onlyChinese: (s) => s.replace(RX.notHan, ''),
      removeDigits: (s) => s.replace(RX.digits, ''),
      removeLetters: (s) => s.replace(RX.letters, ''),
      removeChinese: (s) => s.replace(RX.han, '')
    };

    // 应用单个转换
    function applyTransform(action) {
      const src = inputEl.value ?? '';
      if (!src.length) return toast('请输入要处理的文本');
      const fn = transforms[action];
      if (!fn) return;
      const result = fn(src);
      outputEl.value = result;
      updateStats();
      pulse(outputEl);
    }

    // 单次应用：设置持久选中样式
    function setSingleActive(btn){
      if (singleActiveBtn && singleActiveBtn !== btn){
        singleActiveBtn.classList.remove('active');
        singleActiveBtn.removeAttribute('data-order');
      }
      singleActiveBtn = btn;
      btn.classList.add('active');
      btn.removeAttribute('data-order');
    }

    // 组合模式
    function setMultiMode(flag){
      multiMode = flag;
      document.body.classList.toggle('multi', flag);
      // 切到组合模式时，清掉单选高亮
      if (flag && singleActiveBtn){
        singleActiveBtn.classList.remove('active');
        singleActiveBtn.removeAttribute('data-order');
        singleActiveBtn = null;
      }
      // 退出组合模式时，清空多选
      if (!flag) clearSelections(true);
      updatePipelineUI();
      toast(flag ? '组合模式已开启：可多选按钮并按顺序执行' : '已切换至单次应用模式');
    }

    // 多选切换
    function toggleSelection(btn){
      const action = btn.dataset.action;
      const idx = pipeline.indexOf(action);
      if (idx >= 0){
        pipeline.splice(idx, 1);
        btn.classList.remove('active');
        btn.removeAttribute('data-order');
      }else{
        pipeline.push(action);
        btn.classList.add('active');
        btn.dataset.order = pipeline.length;
      }
      // 重排角标
      pipeline.forEach((a, i) => {
        const b = btnByAction[a];
        if (b) b.dataset.order = i + 1;
      });
      updatePipelineUI();
    }

    function updatePipelineUI(){
      const text = pipeline.length ? pipeline.map(a => LABELS[a]).join(' → ') : '未选择任何步骤';
      pipelineSummary.textContent = text;
      runPipelineBtn.disabled = pipeline.length === 0;
      clearSelectionBtn.disabled = pipeline.length === 0;
    }

    function clearSelections(silent=false){
      pipeline.splice(0, pipeline.length);
      actionButtons.forEach(b => { b.classList.remove('active'); b.removeAttribute('data-order'); });
      updatePipelineUI();
      if (!silent) toast('已清空选择');
    }

    function runPipeline(){
      const src = inputEl.value ?? '';
      if (!src.length) return toast('请输入要处理的文本');
      let result = src;
      for (const act of pipeline){
        result = transforms[act](result);
      }
      outputEl.value = result;
      updateStats();
      pulse(outputEl);
      toast('已按顺序完成处理');
    }

    // 事件绑定
    themeBtn.addEventListener('click', toggleTheme);
    multiToggle.addEventListener('change', () => setMultiMode(multiToggle.checked));

    actionButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        if (multiMode) {
          toggleSelection(btn);
        } else {
          setSingleActive(btn);
          applyTransform(btn.dataset.action);
        }
      });
    });

    runPipelineBtn.addEventListener('click', runPipeline);
    clearSelectionBtn.addEventListener('click', () => clearSelections(false));

    $('#copyBtn').addEventListener('click', async () => {
      if (!outputEl.value) return toast('暂无可复制的内容');
      try {
        await navigator.clipboard.writeText(outputEl.value);
        toast('已复制到剪贴板 ✅');
      } catch {
        fallbackCopy(outputEl);
      }
    });
    $('#applyBackBtn').addEventListener('click', () => {
      inputEl.value = outputEl.value;
      outputEl.value = '';
      updateStats();
      pulse(inputEl);
      toast('结果已回填到输入框');
    });
    $('#downloadBtn').addEventListener('click', () => downloadText(outputEl.value || '', 'converted.txt'));
    $('#swapBtn').addEventListener('click', () => {
      const a = inputEl.value, b = outputEl.value;
      inputEl.value = b; outputEl.value = a;
      updateStats();
      pulse(inputEl);
      toast('已交换输入与输出');
    });
    $('#pasteBtn').addEventListener('click', async () => {
      try{
        const text = await navigator.clipboard.readText();
        if (!text) return toast('剪贴板为空');
        inputEl.value = text;
        updateStats();
        pulse(inputEl);
      }catch{
        toast('无法读取剪贴板，请手动粘贴');
      }
    });
    $('#clearBtn').addEventListener('click', () => {
      inputEl.value = ''; updateStats(); pulse(inputEl);
    });

    inputEl.addEventListener('input', updateStats);

    // 拖拽文本文件
    ['dragenter','dragover'].forEach(evt=>{
      inputEl.addEventListener(evt, e => { e.preventDefault(); inputEl.style.boxShadow='var(--ring)' }, false)
    });
    ['dragleave','drop'].forEach(evt=>{
      inputEl.addEventListener(evt, e => { e.preventDefault(); inputEl.style.boxShadow='' }, false)
    });
    inputEl.addEventListener('drop', async (e) => {
      const file = e.dataTransfer.files?.[0];
      if (!file) return;
      if (!file.type.startsWith('text') && !/\.(txt|csv|md|log|json|xml)$/i.test(file.name)) {
        return toast('仅支持文本文件');
      }
      const text = await file.text();
      inputEl.value = text;
      updateStats();
      pulse(inputEl);
      toast(`已载入：${file.name}`);
    });

    // 快捷键：Ctrl/Cmd + U/L/R/B
    document.addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey){
        const k = e.key.toLowerCase();
        if (k === 'b') { e.preventDefault(); setSingleActive(btnByAction['title']); applyTransform('title'); }
        if (k === 'u') { e.preventDefault(); setSingleActive(btnByAction['upper']); applyTransform('upper'); }
        if (k === 'l') { e.preventDefault(); setSingleActive(btnByAction['lower']); applyTransform('lower'); }
        if (k === 'r') { e.preventDefault(); setSingleActive(btnByAction['reverseAll']); applyTransform('reverseAll'); }
      }
    });

    // 主题切换（仅图标）
    function setThemeIcon(){
      themeBtn.textContent = document.body.classList.contains('dark') ? '🌞' : '🌙';
    }
    function toggleTheme(){
      document.body.classList.toggle('dark');
      const dark = document.body.classList.contains('dark');
      localStorage.setItem('tt-theme', dark ? 'dark' : 'light');
      setThemeIcon();
    }
    (function initTheme(){
      const pref = localStorage.getItem('tt-theme');
      const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (pref === 'dark' || (!pref && systemDark)) document.body.classList.add('dark');
      setThemeIcon();
    })();

    // 辅助函数
    function toast(msg, timeout=1800){
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastEl._t);
      toastEl._t = setTimeout(()=> toastEl.classList.remove('show'), timeout);
    }
    function pulse(el){
      el.style.transition = 'background .25s ease';
      el.style.background = 'rgba(125, 211, 252, .18)';
      setTimeout(()=>{ el.style.background = ''; }, 160);
    }
    function fallbackCopy(textarea){
      const wasReadonly = textarea.hasAttribute('readonly');
      if (wasReadonly) textarea.removeAttribute('readonly');
      textarea.select();
      const ok = document.execCommand('copy');
      if (wasReadonly) textarea.setAttribute('readonly', 'true');
      toast(ok ? '已复制到剪贴板 ✅' : '复制失败');
      window.getSelection().removeAllRanges();
    }
    function downloadText(text, filename='text.txt'){
      const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      URL.revokeObjectURL(a.href);
      a.remove();
    }

    // 初始化统计
    updateStats();
  </script>
</body>
</html>
