<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>PDF脱敏 - 多模块版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #2e5a2e;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .app-container {
            width: 100%;
            max-width: 1200px;
            background-color: #f5f5dc;
            border-radius: 36px 36px 24px 24px;
            box-shadow: 0 20px 40px rgba(0, 30, 0, 0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 2px solid #3c6e3c;
        }

        .app-header {
            padding: 20px 24px 8px 24px;
            text-align: center;
        }

        .app-header h1 {
            font-size: 2.2rem;
            font-weight: 600;
            color: #1c3e1c;
            text-shadow: 2px 2px 0 #b0d2a0;
            margin-bottom: 4px;
        }

        .toolbar {
            background-color: #528a52;
            padding: 16px 20px;
            border-radius: 48px;
            margin: 12px 20px 8px 20px;
            color: white;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px 12px;
            box-shadow: inset 0 2px 5px #2d512d, 0 4px 6px rgba(0,0,0,0.2);
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #6da56d;
            padding: 8px 14px;
            border-radius: 40px;
            flex-wrap: wrap;
            flex: 1 1 0;
            min-width: 140px;
            justify-content: center;
            box-shadow: inset 0 1px 4px #2e6b2e;
        }

        .tool-group label {
            font-weight: 600;
            font-size: 0.95rem;
            color: #fff9d7;
            white-space: nowrap;
        }

        .tool-group input[type="color"] {
            width: 48px;
            height: 40px;
            border: 2px solid white;
            border-radius: 30px;
            background: white;
            cursor: pointer;
            padding: 2px;
        }

        .size-control {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .size-control input[type="range"] {
            width: 90px;
            height: 8px;
            border-radius: 10px;
            background: #dcdcdc;
            -webkit-appearance: none;
            appearance: none;
        }

        .size-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            background: #f9f9b2;
            border-radius: 50%;
            border: 2px solid #1f4f1f;
            cursor: grab;
            box-shadow: 0 2px 6px black;
        }

        .size-control input[type="number"] {
            width: 65px;
            padding: 6px 4px;
            border-radius: 30px;
            border: 2px solid #1f4f1f;
            background: #fefed0;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
            color: #1d3e1d;
            -moz-appearance: textfield;
        }

        .size-control input[type="number"]::-webkit-outer-spin-button,
        .size-control input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .size-control .percent-suffix {
            font-weight: 700;
            color: #fff9b0;
            margin-left: -4px;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            flex: 2 1 auto;
            justify-content: flex-end;
        }

        .drag-hint {
            background: #b3b36b;
            color: #1d3d1d;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .delete-btn {
            background-color: #d32f2f;
            box-shadow: 0 5px 0 #8b1e1e;
            border-color: #b71c1c;
            color: white;
        }

        .reset-btn {
            background-color: #ff9800;
            box-shadow: 0 5px 0 #b26a00;
            border-color: #ed6c02;
            color: white;
        }

        .unify-btn {
            background-color: #2196f3;
            box-shadow: 0 5px 0 #0b5e9e;
            border-color: #1976d2;
            color: white;
        }

        .add-btn {
            background-color: #4caf50;
            box-shadow: 0 5px 0 #2e7d32;
            border-color: #2e7d5e;
            color: white;
        }

        .page-indicator {
            background: #2e5a2e;
            color: #f9f0b5;
            padding: 5px 15px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }

        .module-indicator {
            background: #4a784a;
            color: #f9f0b5;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .download-section {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            background: #4f8a4f;
            padding: 6px 15px;
            border-radius: 40px;
            border: 2px solid #c3e0a0;
        }

        .filename-input {
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-weight: 500;
        }

        .filename-input input {
            background: #fefed0;
            border: 2px solid #1f4f1f;
            border-radius: 30px;
            padding: 6px 12px;
            width: 150px;
            font-weight: 600;
            color: #1d3e1d;
        }

        .filename-input input:focus {
            outline: 3px solid #f7e05e;
        }

        button {
            background-color: #f7e05e;
            border: none;
            color: #1d4a1d;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 8px 14px;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 5px 0 #8f7230, 0 6px 12px black;
            transition: 0.08s linear;
            border: 1px solid #dbb446;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-width: 70px;
            justify-content: center;
            white-space: nowrap;
        }

        button:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #8f7230, 0 6px 12px black;
        }

        button:disabled {
            opacity: 0.5;
            transform: none;
            box-shadow: 0 3px 0 #6b541f;
            pointer-events: none;
        }

        .download-btn {
            background-color: #4caf7a;
            box-shadow: 0 5px 0 #1b5e3f;
            border-color: #2e7d5e;
            color: white;
            min-width: 100px;
        }

        .pdf-workzone {
            background: #367a36;
            margin: 8px 20px 20px 20px;
            border-radius: 40px;
            padding: 20px;
            box-shadow: inset 0 0 0 2px #1f4f1f, 0 10px 15px -5px #0a300a;
        }

        .pdf-mask-container {
            position: relative;
            width: 100%;
            min-height: 420px;
            background-color: #d9e8d0;
            border-radius: 28px;
            overflow: hidden;
            border: 4px solid #c3b875;
            box-shadow: 0 0 0 3px #294f29;
            user-select: none;
        }

        #pdf-renderer {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
        }

        #overlay-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            cursor: grab;
            z-index: 20;
        }

        #overlay-canvas.dragging {
            cursor: grabbing;
        }

        .file-info {
            margin-top: 12px;
            color: #faffd2;
            font-weight: 500;
            text-align: center;
            background: #285e28;
            padding: 8px 16px;
            border-radius: 60px;
            font-size: 0.95rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .file-info label {
            background: #113311;
            padding: 6px 18px;
            border-radius: 40px;
            color: #fee48a;
            cursor: pointer;
            border: 1px solid #f5e56b;
            white-space: nowrap;
        }

        .file-info input[type="file"] {
            display: none;
        }

        .file-size-info {
            background: #1f4f1f;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.85rem;
            color: #e0f0c0;
            white-space: nowrap;
        }

        .page-control {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1f4f1f;
            padding: 5px 15px;
            border-radius: 40px;
        }

        .page-control input {
            width: 60px;
            text-align: center;
            background: #fefed0;
            border: 2px solid #8f7230;
            border-radius: 30px;
            padding: 6px 0;
            font-weight: 600;
        }

        .page-control span {
            color: #f9f0b5;
            font-weight: 600;
            white-space: nowrap;
        }

        .app-footer {
            background-color: #336633;
            color: #f9f0b5;
            text-align: center;
            padding: 18px 10px;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 2px;
            border-top: 3px solid #9bb86b;
            text-shadow: 2px 2px 0 #1f3f1f;
            box-shadow: 0 -6px 0 #1f4f1f;
            word-break: keep-all;
        }

        .app-footer span {
            background: #225522;
            padding: 5px 25px;
            border-radius: 60px;
            display: inline-block;
        }

        .module-list {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin: 0 20px 10px 20px;
            padding: 8px 15px;
            background: #3f6f3f;
            border-radius: 40px;
            align-items: center;
        }

        .module-list-label {
            color: #e0f0c0;
            font-weight: 500;
            margin-right: 10px;
            white-space: nowrap;
        }

        .module-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            flex: 1;
        }

        .module-tag {
            background: #4a784a;
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .module-tag.selected {
            border-color: #f7e05e;
            background: #2e5a2e;
        }

        .module-tag button {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            padding: 0 5px;
            box-shadow: none;
            min-width: auto;
            margin: 0;
        }

        .module-tag button:active {
            transform: none;
        }

        .module-tag button:hover {
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
        }

        @media (max-width: 900px) {
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .action-buttons {
                justify-content: center;
            }
            .download-section {
                flex-direction: column;
                align-items: stretch;
            }
            .filename-input {
                flex-direction: column;
                align-items: stretch;
            }
            .filename-input input {
                width: 100%;
            }
        }
    </style>
    <!-- PDF.js 库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- PDF-LIB 库 -->
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
<div class="app-container">
    <div class="app-header">
        <h1>PDF脱敏</h1>
    </div>

    <!-- 控制栏 - 第一行：颜色、宽度、高度、页码指示器、拖拽提示 -->
    <div class="toolbar">
        <div class="tool-group">
            <label>🎨 颜色</label>
            <input type="color" id="maskColor" value="#000000">
        </div>

        <div class="tool-group">
            <label>📏 宽度</label>
            <div class="size-control">
                <input type="range" id="maskWidth" min="0.1" max="100" value="30" step="0.1">
                <input type="number" id="widthInput" min="0.1" max="100" value="30" step="0.1">
                <span class="percent-suffix">%</span>
            </div>
        </div>

        <div class="tool-group">
            <label>📐 高度</label>
            <div class="size-control">
                <input type="range" id="maskHeight" min="0.1" max="100" value="18" step="0.1">
                <input type="number" id="heightInput" min="0.1" max="100" value="18" step="0.1">
                <span class="percent-suffix">%</span>
            </div>
        </div>

        <div class="page-indicator">
            <span id="pageIndicator">第 1 页</span>
            <span class="module-indicator" id="moduleCount">0 个</span>
        </div>

        <div class="drag-hint">
            ⚡ 按住拖拽
        </div>
    </div>

    <!-- 控制栏 - 第二行：新增模块、删除当前、统一设置、一键恢复、下载区域（铺满整行） -->
    <div class="toolbar" style="margin-top: 0; justify-content: space-between;">
        <div style="display: flex; gap: 8px; flex-wrap: wrap; flex: 1;">
            <button id="addModuleBtn" class="add-btn" disabled style="flex: 1; min-width: 100px;">➕ 新增模块</button>
            <button id="deleteModuleBtn" class="delete-btn" disabled style="flex: 1; min-width: 100px;">🗑️ 删除当前</button>
            <button id="unifyBtn" class="unify-btn" disabled style="flex: 1; min-width: 100px;">🔄 统一设置</button>
            <button id="resetAllBtn" class="reset-btn" disabled style="flex: 1; min-width: 100px;">↺ 一键恢复</button>
        </div>
        
        <div class="download-section" style="flex: 1; justify-content: flex-end;">
            <div class="filename-input">
                <span>📝 文件名</span>
                <input type="text" id="filenameInput" value="脱敏后文档" placeholder="输入文件名">
            </div>
            <button id="downloadPdfBtn" class="download-btn" disabled style="min-width: 100px;">⬇️ 下载PDF</button>
        </div>
    </div>

    <!-- 模块列表 - 独立一行显示 -->
    <div class="module-list">
        <span class="module-list-label">当前页模块：</span>
        <div id="moduleTags" class="module-tags"></div>
    </div>

    <!-- 工作区 -->
    <div class="pdf-workzone">
        <div class="pdf-mask-container" id="pdfMaskContainer">
            <div id="pdf-renderer"></div>
            <canvas id="overlay-canvas"></canvas>
        </div>

        <div class="file-info">
            <label for="fileInput">📂 打开PDF文件</label>
            <input type="file" id="fileInput" accept="application/pdf" />
            <span id="fileSizeDisplay" class="file-size-info"></span>
            
            <!-- 手动页码输入 -->
            <div class="page-control">
                <button id="firstPage" disabled title="首页">⏮</button>
                <button id="prevPage" disabled>◀</button>
                <input type="number" id="gotoPageInput" min="1" value="1" step="1">
                <span id="totalPagesSpan">/ 0</span>
                <button id="nextPage" disabled>▶</button>
                <button id="lastPage" disabled title="末页">⏭</button>
            </div>
        </div>
    </div>

    <div class="app-footer">
        <span>JA伙伴-阿记在做一件事</span>
    </div>
</div>

<script>
    (function() {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        // DOM
        const fileInput = document.getElementById('fileInput');
        const pdfRendererDiv = document.getElementById('pdf-renderer');
        const overlayCanvas = document.getElementById('overlay-canvas');
        const maskContainer = document.getElementById('pdfMaskContainer');
        const pageIndicator = document.getElementById('pageIndicator');
        const moduleCount = document.getElementById('moduleCount');
        const moduleTags = document.getElementById('moduleTags');
        
        // 翻页按钮
        const firstPageBtn = document.getElementById('firstPage');
        const prevBtn = document.getElementById('prevPage');
        const nextBtn = document.getElementById('nextPage');
        const lastPageBtn = document.getElementById('lastPage');
        const gotoPageInput = document.getElementById('gotoPageInput');
        const totalPagesSpan = document.getElementById('totalPagesSpan');
        const fileSizeDisplay = document.getElementById('fileSizeDisplay');
        
        const downloadBtn = document.getElementById('downloadPdfBtn');
        const filenameInput = document.getElementById('filenameInput');
        const addModuleBtn = document.getElementById('addModuleBtn');
        const deleteModuleBtn = document.getElementById('deleteModuleBtn');
        const resetAllBtn = document.getElementById('resetAllBtn');
        const unifyBtn = document.getElementById('unifyBtn');
        
        const colorPicker = document.getElementById('maskColor');
        const widthRange = document.getElementById('maskWidth');
        const widthInput = document.getElementById('widthInput');
        const heightRange = document.getElementById('maskHeight');
        const heightInput = document.getElementById('heightInput');

        // 状态
        let pdfDoc = null;
        let currentPageNum = 1;
        let totalPages = 0;
        let renderTask = null;
        let originalFileData = null;
        let originalFileSize = 0;
        let nextModuleId = 1;

        // 每页的遮挡模块设置
        let pageModules = new Map(); // key: 页码, value: 模块数组

        // 当前选中的模块ID (用于当前页)
        let selectedModuleId = null;

        // 默认模块参数
        function createDefaultModule() {
            return {
                id: nextModuleId++,
                color: '#000000',
                widthPercent: 15,
                heightPercent: 10,
                xPercent: 20 + Math.random() * 40,
                yPercent: 20 + Math.random() * 40,
                deleted: false
            };
        }

        // 获取当前页的模块数组
        function getCurrentPageModules() {
            if (!pageModules.has(currentPageNum)) {
                pageModules.set(currentPageNum, []);
            }
            return pageModules.get(currentPageNum);
        }

        // 保存当前页的模块数组
        function saveCurrentPageModules(modules) {
            pageModules.set(currentPageNum, modules);
        }

        // 获取当前选中的模块
        function getSelectedModule() {
            const modules = getCurrentPageModules();
            return modules.find(m => m.id === selectedModuleId);
        }

        // 更新UI控件以匹配选中的模块
        function updateUIFromSelectedModule() {
            const selected = getSelectedModule();
            if (selected) {
                colorPicker.value = selected.color;
                widthRange.value = selected.widthPercent.toFixed(1);
                widthInput.value = selected.widthPercent.toFixed(1);
                heightRange.value = selected.heightPercent.toFixed(1);
                heightInput.value = selected.heightPercent.toFixed(1);
                deleteModuleBtn.disabled = false;
            } else {
                // 没有选中模块时，清空控件（或保留默认值）
                colorPicker.value = '#000000';
                widthRange.value = '15.0';
                widthInput.value = '15.0';
                heightRange.value = '10.0';
                heightInput.value = '10.0';
                deleteModuleBtn.disabled = true;
            }
            drawMaskOverlay();
            updateModuleTags();
        }

        // 更新模块标签列表
        function updateModuleTags() {
            const modules = getCurrentPageModules();
            moduleCount.textContent = `${modules.length} 个`;
            
            if (modules.length === 0) {
                moduleTags.innerHTML = '<span style="color: #a0c0a0;">暂无模块</span>';
                return;
            }
            
            let html = '';
            modules.forEach((module, index) => {
                const isSelected = (module.id === selectedModuleId);
                const selectedClass = isSelected ? 'selected' : '';
                html += `<div class="module-tag ${selectedClass}" data-module-id="${module.id}">
                    <span>模块${index + 1}</span>
                    <button class="delete-module-btn" data-module-id="${module.id}">✕</button>
                </div>`;
            });
            moduleTags.innerHTML = html;
            
            // 绑定点击事件
            document.querySelectorAll('.module-tag').forEach(tag => {
                tag.addEventListener('click', (e) => {
                    if (e.target.classList.contains('delete-module-btn')) return;
                    const moduleId = parseInt(tag.dataset.moduleId);
                    selectedModuleId = moduleId;
                    updateUIFromSelectedModule();
                    updateModuleTags();
                });
            });
            
            // 绑定删除按钮事件
            document.querySelectorAll('.delete-module-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const moduleId = parseInt(btn.dataset.moduleId);
                    deleteModule(moduleId);
                });
            });
        }

        // 删除指定模块
        function deleteModule(moduleId) {
            let modules = getCurrentPageModules();
            modules = modules.filter(m => m.id !== moduleId);
            saveCurrentPageModules(modules);
            
            if (selectedModuleId === moduleId) {
                selectedModuleId = modules.length > 0 ? modules[0].id : null;
            }
            
            updateUIFromSelectedModule();
        }

        // 新增模块
        function addNewModule() {
            const modules = getCurrentPageModules();
            const newModule = createDefaultModule();
            modules.push(newModule);
            saveCurrentPageModules(modules);
            
            selectedModuleId = newModule.id;
            updateUIFromSelectedModule();
        }

        // 更新当前选中模块的属性
        function updateSelectedModule(updates) {
            const selected = getSelectedModule();
            if (selected) {
                Object.assign(selected, updates);
                saveCurrentPageModules(getCurrentPageModules());
                drawMaskOverlay();
                updateModuleTags();
            }
        }

        // 事件绑定
        addModuleBtn.addEventListener('click', addNewModule);

        deleteModuleBtn.addEventListener('click', () => {
            if (selectedModuleId) {
                deleteModule(selectedModuleId);
            }
        });

        widthRange.addEventListener('input', (e) => {
            let v = parseFloat(e.target.value);
            v = Math.min(100, Math.max(0.1, v));
            updateSelectedModule({ widthPercent: v });
        });

        widthInput.addEventListener('input', (e) => {
            let val = parseFloat(e.target.value) || 0;
            val = Math.min(100, Math.max(0.1, val));
            updateSelectedModule({ widthPercent: val });
        });

        heightRange.addEventListener('input', (e) => {
            let v = parseFloat(e.target.value);
            v = Math.min(100, Math.max(0.1, v));
            updateSelectedModule({ heightPercent: v });
        });

        heightInput.addEventListener('input', (e) => {
            let val = parseFloat(e.target.value) || 0;
            val = Math.min(100, Math.max(0.1, val));
            updateSelectedModule({ heightPercent: val });
        });

        colorPicker.addEventListener('input', (e) => {
            updateSelectedModule({ color: e.target.value });
        });

        // ---------- 画布尺寸调整 ----------
        function resizeOverlayCanvas() {
            const rect = maskContainer.getBoundingClientRect();
            if (rect.width > 0 && rect.height > 0) {
                overlayCanvas.width = rect.width;
                overlayCanvas.height = rect.height;
            } else {
                overlayCanvas.width = 800;
                overlayCanvas.height = 1000;
            }
            drawMaskOverlay();
        }

        // ---------- 绘制所有遮挡模块 ----------
        function drawMaskOverlay() {
            const ctx = overlayCanvas.getContext('2d');
            const w = overlayCanvas.width;
            const h = overlayCanvas.height;
            if (w === 0 || h === 0) return;

            ctx.clearRect(0, 0, w, h);

            const modules = getCurrentPageModules();
            
            modules.forEach(module => {
                if (module.deleted) return;
                
                const blockWidth = (module.widthPercent / 100) * w;
                const blockHeight = (module.heightPercent / 100) * h;

                let x = (module.xPercent / 100) * w;
                let y = (module.yPercent / 100) * h;

                // 边界限制
                x = Math.max(0, Math.min(x, w - blockWidth));
                y = Math.max(0, Math.min(y, h - blockHeight));

                // 保存精确的百分比（保留4位小数）
                module.xPercent = parseFloat((x / w * 100).toFixed(4));
                module.yPercent = parseFloat((y / h * 100).toFixed(4));

                ctx.fillStyle = module.color;
                ctx.fillRect(x, y, blockWidth, blockHeight);

                // 如果是选中的模块，绘制金色边框
                if (module.id === selectedModuleId) {
                    ctx.strokeStyle = '#FFD700';
                    ctx.lineWidth = 4;
                    ctx.setLineDash([]);
                } else {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                }
                ctx.strokeRect(x, y, blockWidth, blockHeight);
                ctx.setLineDash([]);

                // 四个小圆点
                ctx.fillStyle = 'white';
                const dotPositions = [
                    [x + 6, y + 6],
                    [x + blockWidth - 6, y + 6],
                    [x + 6, y + blockHeight - 6],
                    [x + blockWidth - 6, y + blockHeight - 6]
                ];
                dotPositions.forEach(([px, py]) => {
                    ctx.beginPath();
                    ctx.arc(px, py, 4, 0, 2 * Math.PI);
                    ctx.fill();
                });
            });
            
            // 保存当前页模块（更新了位置）
            saveCurrentPageModules(modules);
        }

        // ---------- 遮挡统一 ----------
        function unifySettings() {
            if (!pdfDoc) return;
            
            const currentModules = getCurrentPageModules();
            
            for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
                if (pageNum === currentPageNum) continue;
                
                // 复制当前页的所有模块到其他页面
                const modulesCopy = currentModules.map(m => ({
                    ...m,
                    id: nextModuleId++  // 确保ID唯一
                }));
                
                pageModules.set(pageNum, modulesCopy);
            }
            
            drawMaskOverlay();
            updateModuleTags();
            
            unifyBtn.textContent = '✓ 已统一';
            setTimeout(() => {
                unifyBtn.textContent = '🔄 统一设置';
            }, 1000);
        }

        unifyBtn.addEventListener('click', unifySettings);

        // ---------- 一键恢复 ----------
        async function resetToOriginal() {
            if (!originalFileData) return;
            
            try {
                resetAllBtn.textContent = '⏳ 恢复中...';
                resetAllBtn.disabled = true;
                
                const arrayBuffer = originalFileData.slice(0);
                pdfDoc = await pdfjsLib.getDocument(new Uint8Array(arrayBuffer)).promise;
                totalPages = pdfDoc.numPages;
                currentPageNum = 1;
                
                // 清空所有模块
                pageModules.clear();
                selectedModuleId = null;
                nextModuleId = 1;
                
                await renderPage(currentPageNum);
                
                resetAllBtn.textContent = '↺ 一键恢复';
                resetAllBtn.disabled = false;
                
            } catch (error) {
                console.error('恢复失败:', error);
                alert('恢复失败：' + error.message);
                resetAllBtn.textContent = '↺ 一键恢复';
                resetAllBtn.disabled = false;
            }
        }

        resetAllBtn.addEventListener('click', resetToOriginal);

        // ---------- 更新按钮状态 ----------
        function updateNavButtons() {
            if (!pdfDoc) {
                firstPageBtn.disabled = true;
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                lastPageBtn.disabled = true;
                downloadBtn.disabled = true;
                addModuleBtn.disabled = true;
                resetAllBtn.disabled = true;
                unifyBtn.disabled = true;
                totalPagesSpan.textContent = '/ 0';
                gotoPageInput.value = 1;
                gotoPageInput.max = 0;
                return;
            }
            firstPageBtn.disabled = (currentPageNum <= 1);
            prevBtn.disabled = (currentPageNum <= 1);
            nextBtn.disabled = (currentPageNum >= totalPages);
            lastPageBtn.disabled = (currentPageNum >= totalPages);
            downloadBtn.disabled = false;
            addModuleBtn.disabled = false;
            resetAllBtn.disabled = false;
            unifyBtn.disabled = false;
            
            totalPagesSpan.textContent = `/ ${totalPages}`;
            gotoPageInput.value = currentPageNum;
            gotoPageInput.max = totalPages;
            pageIndicator.textContent = `第 ${currentPageNum} 页`;
        }

        // ---------- 跳转到指定页码 ----------
        function goToPage(pageNum) {
            if (!pdfDoc) return;
            pageNum = Math.max(1, Math.min(totalPages, pageNum));
            if (pageNum !== currentPageNum) {
                currentPageNum = pageNum;
                selectedModuleId = null;
                renderPage(currentPageNum);
            }
        }

        gotoPageInput.addEventListener('change', () => {
            let page = parseInt(gotoPageInput.value);
            if (isNaN(page)) page = 1;
            goToPage(page);
        });

        // ---------- PDF渲染 ----------
        async function renderPage(pageNum) {
            if (!pdfDoc) return;
            if (renderTask) {
                try { await renderTask; } catch (e) {}
            }
            try {
                const page = await pdfDoc.getPage(pageNum);
                const containerWidth = maskContainer.clientWidth;
                const viewport = page.getViewport({ scale: 1.0 });
                const scale = (containerWidth - 20) / viewport.width;
                const scaledViewport = page.getViewport({ scale });

                while (pdfRendererDiv.firstChild) {
                    pdfRendererDiv.removeChild(pdfRendererDiv.firstChild);
                }
                const canvas = document.createElement('canvas');
                canvas.className = 'pdf-page-canvas';
                pdfRendererDiv.appendChild(canvas);

                const context = canvas.getContext('2d');
                canvas.width = scaledViewport.width;
                canvas.height = scaledViewport.height;

                const renderContext = {
                    canvasContext: context,
                    viewport: scaledViewport
                };
                renderTask = page.render(renderContext);
                await renderTask;
                renderTask = null;

                updateNavButtons();
                updateUIFromSelectedModule();
                resizeOverlayCanvas();

            } catch (err) {
                console.error('渲染失败', err);
            }
        }

        // 加载PDF
        async function loadPdf(file) {
            const reader = new FileReader();
            reader.onload = async function(e) {
                const arrayBuffer = e.target.result;
                originalFileData = arrayBuffer;
                originalFileSize = arrayBuffer.byteLength;
                
                const sizeInKB = (originalFileSize / 1024).toFixed(2);
                fileSizeDisplay.textContent = `原始大小: ${sizeInKB} KB`;
                
                try {
                    pdfDoc = await pdfjsLib.getDocument(new Uint8Array(arrayBuffer)).promise;
                    totalPages = pdfDoc.numPages;
                    currentPageNum = 1;
                    
                    pageModules.clear();
                    selectedModuleId = null;
                    nextModuleId = 1;
                    
                    await renderPage(currentPageNum);
                    
                    const defaultName = file.name.replace('.pdf', '').replace('.PDF', '') + '_脱敏';
                    filenameInput.value = defaultName;
                    
                } catch (error) {
                    alert('PDF加载失败：' + error.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file && file.type === 'application/pdf') {
                loadPdf(file);
            } else {
                alert('请选择有效的PDF文件');
            }
        });

        firstPageBtn.addEventListener('click', () => goToPage(1));
        prevBtn.addEventListener('click', () => goToPage(currentPageNum - 1));
        nextBtn.addEventListener('click', () => goToPage(currentPageNum + 1));
        lastPageBtn.addEventListener('click', () => goToPage(totalPages));

        // ---------- 下载PDF (修复X轴偏移问题) ----------
        downloadBtn.addEventListener('click', async () => {
            if (!pdfDoc || !originalFileData) {
                alert('请先加载PDF文件');
                return;
            }

            try {
                downloadBtn.textContent = '⏳ 生成中...';
                downloadBtn.disabled = true;

                let fileName = filenameInput.value.trim();
                if (!fileName) fileName = '脱敏后文档';
                if (!fileName.toLowerCase().endsWith('.pdf')) {
                    fileName += '.pdf';
                }

                const { PDFDocument, rgb } = PDFLib;
                const pdfDoc_orig = await PDFDocument.load(originalFileData.slice(0));
                const pages = pdfDoc_orig.getPages();

                for (let i = 0; i < pages.length; i++) {
                    const pageNum = i + 1;
                    const modules = pageModules.get(pageNum) || [];
                    
                    const page = pages[i];
                    const { width, height } = page.getSize();
                    
                    for (const module of modules) {
                        if (module.deleted) continue;
                        
                        const blockWidth = (module.widthPercent / 100) * width;
                        const blockHeight = (module.heightPercent / 100) * height;
                        
                        // X坐标直接使用保存的百分比（与预览完全一致）
                        let x = (module.xPercent / 100) * width;
                        
                        // Y坐标转换：预览使用从顶部向下的坐标，PDF-LIB使用从底部向上的坐标
                        // 公式：pdfY = height - (module.yPercent / 100) * height - blockHeight
                        let y = height - (module.yPercent / 100) * height - blockHeight;
                        
                        // 边界限制（与预览保持一致）
                        x = Math.max(0, Math.min(x, width - blockWidth));
                        y = Math.max(0, Math.min(y, height - blockHeight));
                        
                        const hex = module.color.replace('#', '');
                        const r = parseInt(hex.substring(0, 2), 16) / 255;
                        const g = parseInt(hex.substring(2, 4), 16) / 255;
                        const b = parseInt(hex.substring(4, 6), 16) / 255;
                        
                        page.drawRectangle({
                            x: x,
                            y: y,
                            width: blockWidth,
                            height: blockHeight,
                            color: rgb(r, g, b),
                            opacity: 1.0
                        });
                    }
                }
                
                const pdfBytes = await pdfDoc_orig.save({
                    useObjectStreams: true,
                    addDefaultPage: false
                });
                
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                
                downloadBtn.textContent = '⬇️ 下载PDF';
                downloadBtn.disabled = false;

            } catch (error) {
                console.error('生成PDF失败:', error);
                alert('生成PDF失败：' + error.message);
                downloadBtn.textContent = '⬇️ 下载PDF';
                downloadBtn.disabled = false;
            }
        });

        // 窗口自适应
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (pdfDoc) {
                    renderPage(currentPageNum);
                } else {
                    resizeOverlayCanvas();
                }
            }, 100);
        });

        const resizeObserver = new ResizeObserver(() => {
            if (pdfDoc) {
                renderPage(currentPageNum);
            } else {
                resizeOverlayCanvas();
            }
        });
        resizeObserver.observe(maskContainer);

        // ---------- 拖拽实现 ----------
        let isDragging = false;
        let dragStartX = 0, dragStartY = 0;
        let startXPercent = 0, startYPercent = 0;
        let draggedModuleId = null;

        function handleDragStart(e) {
            const modules = getCurrentPageModules();
            if (modules.length === 0) return;
            
            e.preventDefault();
            const rect = overlayCanvas.getBoundingClientRect();
            const scaleX = overlayCanvas.width / rect.width;
            const scaleY = overlayCanvas.height / rect.height;

            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const canvasX = (clientX - rect.left) * scaleX;
            const canvasY = (clientY - rect.top) * scaleY;

            const w = overlayCanvas.width;
            const h = overlayCanvas.height;
            
            // 从后往前遍历，优先选中上层模块
            for (let i = modules.length - 1; i >= 0; i--) {
                const module = modules[i];
                if (module.deleted) continue;
                
                const blockWidth = (module.widthPercent / 100) * w;
                const blockHeight = (module.heightPercent / 100) * h;
                const currentX = (module.xPercent / 100) * w;
                const currentY = (module.yPercent / 100) * h;

                if (canvasX >= currentX && canvasX <= currentX + blockWidth &&
                    canvasY >= currentY && canvasY <= currentY + blockHeight) {
                    
                    isDragging = true;
                    draggedModuleId = module.id;
                    overlayCanvas.classList.add('dragging');

                    startXPercent = module.xPercent;
                    startYPercent = module.yPercent;
                    dragStartX = canvasX;
                    dragStartY = canvasY;
                    
                    // 选中拖动的模块
                    if (selectedModuleId !== module.id) {
                        selectedModuleId = module.id;
                        updateUIFromSelectedModule();
                        updateModuleTags();
                    }

                    e.preventDefault();
                    return;
                }
            }
        }

        function handleDragMove(e) {
            if (!isDragging || !draggedModuleId) return;
            e.preventDefault();

            const modules = getCurrentPageModules();
            const module = modules.find(m => m.id === draggedModuleId);
            if (!module) {
                isDragging = false;
                return;
            }

            const rect = overlayCanvas.getBoundingClientRect();
            const scaleX = overlayCanvas.width / rect.width;
            const scaleY = overlayCanvas.height / rect.height;

            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const currentCanvasX = (clientX - rect.left) * scaleX;
            const currentCanvasY = (clientY - rect.top) * scaleY;

            const deltaX = currentCanvasX - dragStartX;
            const deltaY = currentCanvasY - dragStartY;

            const w = overlayCanvas.width;
            const h = overlayCanvas.height;
            const deltaXPercent = (deltaX / w) * 100;
            const deltaYPercent = (deltaY / h) * 100;

            module.xPercent = startXPercent + deltaXPercent;
            module.yPercent = startYPercent + deltaYPercent;
            
            saveCurrentPageModules(modules);
            drawMaskOverlay();
        }

        function handleDragEnd(e) {
            if (isDragging) {
                isDragging = false;
                draggedModuleId = null;
                overlayCanvas.classList.remove('dragging');
                e.preventDefault();
            }
        }

        overlayCanvas.addEventListener('mousedown', handleDragStart);
        overlayCanvas.addEventListener('mousemove', handleDragMove);
        overlayCanvas.addEventListener('mouseup', handleDragEnd);
        overlayCanvas.addEventListener('mouseleave', handleDragEnd);

        overlayCanvas.addEventListener('touchstart', handleDragStart, { passive: false });
        overlayCanvas.addEventListener('touchmove', handleDragMove, { passive: false });
        overlayCanvas.addEventListener('touchend', handleDragEnd);
        overlayCanvas.addEventListener('touchcancel', handleDragEnd);

        resizeOverlayCanvas();
    })();
</script>
</body>
