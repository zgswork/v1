    function init() {
      renderGames(games);
      setupEventListeners();
      checkThemePreference();
    }
    
    // 设置事件监听器
    function setupEventListeners() {
      // 关闭模态框
      closeModal.addEventListener('click', () => {
        gameModal.classList.add('hidden');
      });
      
      // 点击模态框外部关闭
      gameModal.addEventListener('click', (e) => {
        if (e.target === gameModal) {
          gameModal.classList.add('hidden');
        }
      });
      
      // 开始游戏
      startGame.addEventListener('click', () => {
        gameModal.classList.add('hidden');
        startSelectedGame();
      });
      
      // 退出游戏
      exitGame.addEventListener('click', () => {
        stopGameTimer();
        gameContainer.classList.add('hidden');
      });
      
      // 重新开始游戏
      restartGame.addEventListener('click', () => {
        stopGameTimer();
        startSelectedGame();
      });
      
      // 主题切换
      themeToggle.addEventListener('click', toggleTheme);
      
      // 移动端菜单切换
      mobileMenuButton.addEventListener('click', () => {
        mobileMenu.classList.toggle('hidden');
      });
      
      // 筛选按钮
      filterButtons.forEach(button => {
        button.addEventListener('click', () => {
          // 更新按钮状态
          filterButtons.forEach(btn => {
            btn.classList.remove('active', 'bg-primary/10', 'text-primary', 'dark:bg-primary/20');
            btn.classList.add('bg-gray-100', 'dark:bg-gray-800');
          });
          button.classList.add('active', 'bg-primary/10', 'text-primary', 'dark:bg-primary/20');
          button.classList.remove('bg-gray-100', 'dark:bg-gray-800');
          
          // 筛选游戏
          const category = button.dataset.category;
          filterGames(category);
        });
      });
      
      // 搜索功能
      searchInput.addEventListener('input', (e) => {
        const searchTerm = e.target.value.toLowerCase();
        searchGames(searchTerm);
      });
    }
    
    // 渲染游戏列表
    function renderGames(gamesToRender) {

      if (gamesToRender.length === 0) {

          <div class="col-span-full text-center py-12 text-gray-500 dark:text-gray-400">

              <h3 class="text-lg font-bold">${game.name}</h3>

                ${game.difficulty}
              </span>
            </div>
            <p class="text-sm text-gray-600 dark:text-gray-400 mb-4 line-clamp-2">${game.description}</p>
            <div class="flex justify-between items-center">
              <span class="text-xs px-2 py-1 bg-gray-100 dark:bg-gray-700 rounded-full ${getCategoryColor(game.category)}">
                ${getCategoryName(game.category)}
              </span>
              <button class="view-details text-primary hover:text-primary/80 font-medium" data-id="${game.id}">
                查看详情 <i class="fa fa-arrow-right ml-1"></i>
              </button>
            </div>
          </div>

        // 查看详情按钮事件
        gameCard.querySelector('.view-details').addEventListener('click', () => {

    // 根据难度获取颜色类
    function getDifficultyColor(difficulty) {
      switch(difficulty) {
        case '初级': return 'bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-400';
        case '中级': return 'bg-yellow-100 text-yellow-800 dark:bg-yellow-900/30 dark:text-yellow-400';
        case '高级': return 'bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-400';
        default: return 'bg-gray-100 text-gray-800 dark:bg-gray-700 dark:text-gray-400';
      }
    }
    
    // 根据分类获取颜色类
    function getCategoryColor(category) {
      const colors = {
        'logic': 'text-blue-800 dark:text-blue-400',
        'math': 'text-purple-800 dark:text-purple-400',
        'memory': 'text-green-800 dark:text-green-400',
        'spatial': 'text-yellow-800 dark:text-yellow-400',
        'word': 'text-red-800 dark:text-red-400'

      return colors[category] || 'text-gray-800 dark:text-gray-400';
    }
    
    // 根据分类获取名称
    function getCategoryName(category) {
      const names = {
        'logic': '逻辑思维',

        'spatial': '空间想象',

    // 显示游戏详情
    function showGameDetails(gameId) {
      const game = games.find(g => g.id === gameId);
      if (!game) return;
      
      currentGame = game;
      modalTitle.textContent = game.name;
      
      let detailsHTML = `
        <div class="space-y-4">
          <div class="flex items-center space-x-3">
            <span class="px-3 py-1 bg-gray-100 dark:bg-gray-700 rounded-full text-sm ${getCategoryColor(game.category)}">
              ${getCategoryName(game.category)}
            </span>
            <span class="px-3 py-1 rounded-full text-sm ${getDifficultyColor(game.difficulty)}">
              ${game.difficulty}
            </span>
          </div>
          
          <div>
            <h4 class="text-lg font-medium mb-2">游戏介绍</h4>
            <p class="text-gray-700 dark:text-gray-300">${game.description}</p>
          </div>
          
          <div>
            <h4 class="text-lg font-medium mb-2">玩法说明</h4>
            <p class="text-gray-700 dark:text-gray-300">${game.howToPlay}</p>
          </div>
        </div>
      `;
      
      modalContent.innerHTML = detailsHTML;
      gameModal.classList.remove('hidden');

    // 开始选中的游戏
    function startSelectedGame() {
      if (!currentGame) return;
      
      gameTitle.textContent = currentGame.name;
      gameContent.innerHTML = '';
      gameState.moves = 0;
      movesCount.textContent = `步数: ${gameState.moves}`;
      
      // 根据游戏ID加载不同的游戏
      switch(currentGame.id) {
        case 1:
          initNumberMaze();
          break;
        case 2:
          initLogicPuzzle();
          break;
        case 3:
          initReverseOrder();
          break;
        case 4:
          initSymbolCode();
          break;
        case 5:
          initTimeChallenge();
          break;
        default:
          gameContent.innerHTML = `
            <div class="text-center py-10">
              <i class="fa fa-gamepad text-4xl mb-4 text-gray-400"></i>
              <p class="text-xl">这个游戏正在开发中，敬请期待！</p>
            </div>
          `;
      }
      
      gameContainer.classList.remove('hidden');
      startGameTimer();
    }
    
    // 开始游戏计时器
    function startGameTimer() {
      stopGameTimer();
      gameState.startTime = new Date().getTime();
      gameState.timerInterval = setInterval(() => {
        const elapsedTime = Math.floor((new Date().getTime() - gameState.startTime) / 1000);
        timer.textContent = `时间: ${elapsedTime}s`;
      }, 1000);
    }
    
    // 停止游戏计时器
    function stopGameTimer() {
      if (gameState.timerInterval) {
        clearInterval(gameState.timerInterval);
        gameState.timerInterval = null;
      }
    }
    
    // 增加步数
    function incrementMoves() {
      gameState.moves++;
      movesCount.textContent = `步数: ${gameState.moves}`;
    }
    
    // 检查游戏是否完成
    function checkGameCompletion(condition) {
      if (condition) {
        stopGameTimer();
        setTimeout(() => {
          alert(`恭喜你完成了游戏！\n步数: ${gameState.moves}\n时间: ${timer.textContent.split(': ')[1]}`);
        }, 500);
      }
    }
    
    // 初始化数字迷宫游戏
    function initNumberMaze() {
      const size = 4; // 4x4网格
      const grid = Array(size).fill().map(() => Array(size).fill(0));
      
      // 生成一个简单的数字迷宫
      let num = 1;
      let row = 0, col = 0;
      const directions = [[0, 1], [1, 0], [0, -1], [-1, 0]];
      let dirIndex = 0;
      
      while (num <= size * size) {
        grid[row][col] = num++;
        let nextRow = row + directions[dirIndex][0];
        let nextCol = col + directions[dirIndex][1];
        
        if (nextRow < 0 || nextRow >= size || nextCol < 0 || nextCol >= size || grid[nextRow][nextCol] !== 0) {
          dirIndex = (dirIndex + 1) % 4;
        }
        
        row += directions[dirIndex][0];
        col += directions[dirIndex][1];
      }
      
      // 随机移除一些数字
      const emptyCells = Math.floor(size * size * 0.4);
      for (let i = 0; i < emptyCells; i++) {
        const r = Math.floor(Math.random() * size);
        const c = Math.floor(Math.random() * size);
        if (grid[r][c] !== 1 && grid[r][c] !== size * size) {
          grid[r][c] = 0;
        }
      }
      
      // 保存游戏状态
      gameState.data = {
        size,
        grid,
        selectedCell: null,
        numbers: Array.from({length: size * size}, (_, i) => i + 1)
      };
      
      // 渲染游戏界面
      renderNumberMaze();
    }
    
    // 渲染数字迷宫游戏
    function renderNumberMaze() {
      const { size, grid, numbers } = gameState.data;
      
      let html = `
        <div class="mb-4">
          <p class="mb-2">请将数字填入空白格子，使数字从1到${size * size}按顺序连接。</p>
          <div class="flex flex-wrap gap-2 mb-4">
            ${numbers.map(num => `
              <button class="number-btn px-3 py-1 rounded border border-gray-300 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-800" data-num="${num}">
                ${num}
              </button>
            `).join('')}
          </div>
        </div>
        <div class="grid gap-1" style="grid-template-columns: repeat(${size}, 1fr);">
          ${grid.map((row, rowIndex) => row.map((cell, colIndex) => `
            <div class="cell border border-gray-300 dark:border-gray-700 ${cell === 0 ? 'bg-gray-50 dark:bg-gray-800' : 'bg-white dark:bg-gray-900'}" data-row="${rowIndex}" data-col="${colIndex}">
              ${cell !== 0 ? cell : ''}
            </div>
          `).join('')).join('')}
        </div>
      `;
      
      gameContent.innerHTML = html;
      
      // 添加事件监听
      document.querySelectorAll('.number-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.number-btn').forEach(b => b.classList.remove('bg-primary/20'));
          btn.classList.add('bg-primary/20');
          gameState.data.selectedNumber = parseInt(btn.dataset.num);
        });
      });
      
      document.querySelectorAll('.cell').forEach(cell => {
        cell.addEventListener('click', () => {
          const row = parseInt(cell.dataset.row);
          const col = parseInt(cell.dataset.col);
          const { grid, selectedNumber } = gameState.data;
          
          if (grid[row][col] === 0 && selectedNumber) {
            grid[row][col] = selectedNumber;
            incrementMoves();
            renderNumberMaze();
            
            // 检查游戏是否完成
            const isComplete = grid.flat().every(cell => cell !== 0);
            if (isComplete) {
              // 检查是否按顺序连接
              let current = 1;
              let found = true;
              
              for (let i = 0; i < grid.length && found; i++) {
                for (let j = 0; j < grid[i].length && found; j++) {
                  if (grid[i][j] === current) {
                    current++;
                  } else if (grid[i][j] !== 0) {
                    found = false;
                  }
                }
              }
              
              checkGameCompletion(found);
            }
          }
        });
      });
    }
    
    // 初始化逻辑拼图游戏
    function initLogicPuzzle() {
      const pieces = [
        { id: 1, shape: 'square', color: 'red', width: 60, height: 60 },
        { id: 2, shape: 'circle', color: 'blue', width: 60, height: 60 },
        { id: 3, shape: 'triangle', color: 'green', width: 60, height: 60 }
      ];
      
      // 随机打乱拼图
      const shuffledPieces = [...pieces].sort(() => Math.random() - 0.5);
      
      // 保存游戏状态
      gameState.data = {
        pieces,
        shuffledPieces,
        selectedPiece: null
      };
      
      // 渲染游戏界面
      renderLogicPuzzle();
    }
    
    // 渲染逻辑拼图游戏
    function renderLogicPuzzle() {
      const { pieces, shuffledPieces } = gameState.data;
      
      let html = `
        <div class="mb-4">
          <p class="mb-2">请根据形状和颜色将拼图放置到正确的位置。</p>
        </div>
        <div class="flex flex-col md:flex-row gap-8">
          <div class="flex-1">
            <h4 class="text-lg font-medium mb-2">目标图形</h4>
            <div class="grid grid-cols-3 gap-4 p-4 border border-gray-300 dark:border-gray-700 rounded-lg">
              ${pieces.map(piece => `
                <div class="flex items-center justify-center h-20 border border-dashed border-gray-300 dark:border-gray-700 rounded-lg" data-id="${piece.id}">
                  <div class="puzzle-placeholder ${getShapeClass(piece.shape)} ${getColorClass(piece.color)}" style="width: ${piece.width}px; height: ${piece.height}px;"></div>
                </div>
              `).join('')}
            </div>
          </div>
          <div class="flex-1">
            <h4 class="text-lg font-medium mb-2">可用拼图</h4>
            <div class="grid grid-cols-3 gap-4 p-4 border border-gray-300 dark:border-gray-700 rounded-lg">
              ${shuffledPieces.map(piece => `
                <div class="flex items-center justify-center h-20" data-id="${piece.id}">
                  <div class="puzzle-piece ${getShapeClass(piece.shape)} ${getColorClass(piece.color)} cursor-move" 
                       style="width: ${piece.width}px; height: ${piece.height}px;"
                       draggable="true"
                       data-id="${piece.id}">
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
      
      gameContent.innerHTML = html;
      
      // 添加拖放事件
      const draggables = document.querySelectorAll('.puzzle-piece');
      const dropzones = document.querySelectorAll('.grid > div');
      
      draggables.forEach(draggable => {
        draggable.addEventListener('dragstart', () => {
          draggable.classList.add('opacity-50');
          gameState.data.selectedPiece = draggable;
        });
        
        draggable.addEventListener('dragend', () => {
          draggable.classList.remove('opacity-50');
          gameState.data.selectedPiece = null;
        });
      });
      
      dropzones.forEach(zone => {
        zone.addEventListener('dragover', e => {
          e.preventDefault();
        });
        
        zone.addEventListener('drop', e => {
          e.preventDefault();
          const selectedPiece = gameState.data.selectedPiece;
          if (selectedPiece && zone.dataset.id === selectedPiece.dataset.id) {
            zone.innerHTML = '';
            zone.appendChild(selectedPiece);
            incrementMoves();
            
            // 检查游戏是否完成
            const isComplete = document.querySelectorAll('.puzzle-piece').every(piece => {
              return piece.parentNode.classList.contains('border-dashed');
            });
            
            checkGameCompletion(isComplete);
          }
        });
      });
    }
    
    // 获取形状类
    function getShapeClass(shape) {
      const classes = {
        'square': 'rounded-none',
        'circle': 'rounded-full',
        'triangle': 'triangle'
      };
      return classes[shape] || '';
    }
    
    // 获取颜色类
    function getColorClass(color) {
      const classes = {
        'red': 'bg-red-500',
        'blue': 'bg-blue-500',
        'green': 'bg-green-500'
      };
      return classes[color] || '';
    }
    
    // 初始化反序排列游戏
    function initReverseOrder() {
      const numbers = Array.from({length: 5}, (_, i) => i + 1);
      const shuffledNumbers = [...numbers].sort(() => Math.random() - 0.5);
      
      // 保存游戏状态
      gameState.data = {
        numbers,
        currentOrder: shuffledNumbers,
        selectedIndices: []
      };
      
      // 渲染游戏界面
      renderReverseOrder();
    }
    
    // 渲染反序排列游戏
    function renderReverseOrder() {
      const { currentOrder, selectedIndices } = gameState.data;
      
      let html = `
        <div class="mb-4">
          <p class="mb-2">请通过交换数字的位置，将它们按从小到大的顺序排列。</p>
          <p class="mb-2">每次点击两个数字进行交换。</p>
        </div>
        <div class="flex flex-wrap justify-center gap-4">
          ${currentOrder.map((num, index) => `
            <div class="cell w-16 h-16 text-xl border border-gray-300 dark:border-gray-700 rounded-lg ${selectedIndices.includes(index) ? 'selected' : 'bg-white dark:bg-gray-900'}" data-index="${index}">
              ${num}
            </div>
          `).join('')}
        </div>
      `;
      
      gameContent.innerHTML = html;
      
      // 添加事件监听
      document.querySelectorAll('.cell').forEach(cell => {
        cell.addEventListener('click', () => {
          const index = parseInt(cell.dataset.index);
          const { selectedIndices, currentOrder, numbers } = gameState.data;
          
          if (selectedIndices.includes(index)) {
            // 取消选择
            gameState.data.selectedIndices = selectedIndices.filter(i => i !== index);
          } else if (selectedIndices.length < 2) {
            // 添加选择
            selectedIndices.push(index);
            gameState.data.selectedIndices = selectedIndices;
            
            // 如果选择了两个数字，交换它们
            if (selectedIndices.length === 2) {
              const [index1, index2] = selectedIndices;
              [currentOrder[index1], currentOrder[index2]] = [currentOrder[index2], currentOrder[index1]];
              gameState.data.currentOrder = currentOrder;
              gameState.data.selectedIndices = [];
              incrementMoves();
              
              // 检查游戏是否完成
              const isComplete = JSON.stringify(currentOrder) === JSON.stringify(numbers);
              checkGameCompletion(isComplete);
            }
          }
          
          renderReverseOrder();
        });
      });
    }
    
    // 初始化符号密码游戏
    function initSymbolCode() {
      // 生成一个简单的符号密码问题
      const symbols = ['★', '△', '□'];
      const a = Math.floor(Math.random() * 9) + 1;
      const b = Math.floor(Math.random() * 9) + 1;
      const c = Math.floor(Math.random() * 9) + 1;
      
      // 保存游戏状态
      gameState.data = {
        symbols,
        values: { '★': a, '△': b, '□': c },
        equations: [
          `${symbols[0]} + ${symbols[1]} = ${a + b}`,
          `${symbols[1]} + ${symbols[2]} = ${b + c}`,
          `${symbols[0]} + ${symbols[2]} = ${a + c}`
        ],
        userAnswers: { '★': '', '△': '', '□': '' }
      };
      
      // 渲染游戏界面
      renderSymbolCode();
    }
    
    // 渲染符号密码游戏
    function renderSymbolCode() {
      const { symbols, equations, userAnswers } = gameState.data;
      
      let html = `
        <div class="mb-4">
          <p class="mb-2">根据以下等式，找出每个符号代表的数字（1-9之间的整数）。</p>
          <div class="space-y-2 mb-4">
            ${equations.map((eq, i) => `
              <div class="p-3 border border-gray-300 dark:border-gray-700 rounded-lg">
                ${eq}
              </div>
            `).join('')}
          </div>
        </div>
        <div class="grid grid-cols-3 gap-4 mb-4">
          ${symbols.map(symbol => `
            <div class="flex flex-col items-center">
              <div class="text-2xl mb-2">${symbol}</div>
              <input type="number" min="1" max="9" class="w-16 p-2 text-center border border-gray-300 dark:border-gray-700 rounded-lg" data-symbol="${symbol}" value="${userAnswers[symbol]}">
            </div>
          `).join('')}
        </div>
        <div class="text-center">
          <button id="check-solution" class="bg-primary hover:bg-primary/90 text-white px-6 py-3 rounded-lg transition-colors">
            检查答案
          </button>
        </div>
      `;
      
      gameContent.innerHTML = html;
      
      // 添加事件监听
      document.querySelectorAll('input[data-symbol]').forEach(input => {
        input.addEventListener('input', (e) => {
          const symbol = e.target.dataset.symbol;
          gameState.data.userAnswers[symbol] = e.target.value;
        });
      });
      
      document.getElementById('check-solution').addEventListener('click', () => {
        const { values, userAnswers } = gameState.data;
        let isCorrect = true;
        
        for (const symbol in values) {
          if (parseInt(userAnswers[symbol]) !== values[symbol]) {
            isCorrect = false;
            break;
          }
        }
        
        incrementMoves();
        
        if (isCorrect) {
          checkGameCompletion(true);
        } else {
          alert('答案不正确，请再试一次！');
        }
      });
    }
    
    // 初始化时间挑战游戏
    function initTimeChallenge() {
      const items = ['🍎', '🍐', '🍊', '🍋', '🍌', '🍉', '🍇', '🍓'];
      const displayCount = 4;
      const displayTime = 3000; // 3秒
      
      // 随机选择要显示的项目
      const displayItems = [...items].sort(() => Math.random() - 0.5).slice(0, displayCount);
      
      // 保存游戏状态
      gameState.data = {
        items,
        displayItems,
        userSelections: [],
        phase: 'display' // display, selection, result
      };
      
      // 渲染游戏界面
      renderTimeChallenge();
      
      // 显示一段时间后切换到选择阶段
      setTimeout(() => {
        gameState.data.phase = 'selection';
        renderTimeChallenge();
      }, displayTime);
    }
    
    // 渲染时间挑战游戏
    function renderTimeChallenge() {
      const { phase, displayItems, items, userSelections } = gameState.data;
      
      let html = '';
      
      switch(phase) {
        case 'display':
          html = `
            <div class="text-center py-10">
              <p class="text-xl mb-6">记住以下物品，时间有限！</p>
              <div class="flex flex-wrap justify-center gap-4">
                ${displayItems.map(item => `
                  <div class="text-4xl p-4">${item}</div>
                `).join('')}
              </div>
            </div>
          `;
          break;
          
        case 'selection':
          html = `
            <div class="mb-4">
              <p class="mb-2">请从下方选择你刚才看到的物品。</p>
            </div>
            <div class="grid grid-cols-4 gap-4 mb-4">
              ${items.map(item => `
                <div class="cell text-3xl border border-gray-300 dark:border-gray-700 rounded-lg ${userSelections.includes(item) ? 'selected' : 'bg-white dark:bg-gray-900'}" data-item="${item}">
                  ${item}
                </div>
              `).join('')}
            </div>
            <div class="text-center">
              <button id="submit-selection" class="bg-primary hover:bg-primary/90 text-white px-6 py-3 rounded-lg transition-colors">
                提交答案
              </button>
            </div>
          `;
          break;
          
        case 'result':
          const correctCount = displayItems.filter(item => userSelections.includes(item)).length;
          html = `
            <div class="text-center py-10">
              <h4 class="text-xl font-medium mb-4">结果</h4>
              <p class="text-lg mb-2">你记住了 ${correctCount} 个物品，共 ${displayItems.length} 个。</p>
              <div class="mt-6">
                <h5 class="font-medium mb-2">正确答案：</h5>
                <div class="flex flex-wrap justify-center gap-2 mb-4">
                  ${displayItems.map(item => `
                    <div class="text-2xl p-2">${item}</div>
                  `).join('')}
                </div>
              </div>
            </div>
          `;
          break;
      }
      
      gameContent.innerHTML = html;
      
      // 添加事件监听
      if (phase === 'selection') {
        document.querySelectorAll('.cell[data-item]').forEach(cell => {
          cell.addEventListener('click', () => {
            const item = cell.dataset.item;
            const index = userSelections.indexOf(item);
            
            if (index === -1) {
              userSelections.push(item);
            } else {
              userSelections.splice(index, 1);
            }
            
            gameState.data.userSelections = userSelections;
            renderTimeChallenge();
          });
        });
        
        document.getElementById('submit-selection').addEventListener('click', () => {
          gameState.data.phase = 'result';
          incrementMoves();
          renderTimeChallenge();
          checkGameCompletion(true);
        });
      }
    }
    
    // 筛选游戏
    function filterGames(category) {
      if (category === 'all') {
        renderGames(games);
        return;
      }
      
      const filteredGames = games.filter(game => game.category === category);
      renderGames(filteredGames);
    }
    
    // 搜索游戏
    function searchGames(term) {
      if (!term) {
        // 如果搜索词为空，显示当前筛选条件下的游戏
        const activeFilter = document.querySelector('.filter-btn.active');
        if (activeFilter) {
          const category = activeFilter.dataset.category;
          filterGames(category);
        } else {
          renderGames(games);
        }
        return;
      }
      
      const searchResults = games.filter(game => 
        game.name.toLowerCase().includes(term) || 
        game.description.toLowerCase().includes(term) ||
        game.howToPlay.toLowerCase().includes(term)
      );
      renderGames(searchResults);
    }
    
    // 切换主题
    function toggleTheme() {
      const isDarkMode = document.documentElement.classList.toggle('dark');
      localStorage.setItem('darkMode', isDarkMode);
    }
    
    // 检查主题偏好
    function checkThemePreference() {
      if (localStorage.getItem('darkMode') === 'true' || 
          (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }
    
    // 添加三角形样式
    const style = document.createElement('style');
    style.textContent = `
      .triangle {
        width: 0;
        height: 0;
        border-left: 30px solid transparent;
        border-right: 30px solid transparent;
        border-bottom: 60px solid currentColor;
      }
    `;
    document.head.appendChild(style);
    
    // 初始化应用
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
