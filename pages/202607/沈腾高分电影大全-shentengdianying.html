        // 获取DOM元素
        const recommendBtn = document.getElementById('recommendBtn');
        const changeBtn = document.getElementById('changeBtn');
        const movieDisplay = document.getElementById('movieDisplay');
        const initialMessage = document.getElementById('initialMessage');
        const movieTitle = document.getElementById('movieTitle');
        const movieStars = document.getElementById('movieStars');
        const ratingText = document.getElementById('ratingText');
        const movieDescription = document.getElementById('movieDescription');
        const movieReason = document.getElementById('movieReason');

        // 记录已推荐的电影，避免重复
        let recommendedMovies = [];

        // 随机推荐电影
        function recommendRandomMovie() {
            // 隐藏初始消息
            initialMessage.style.display = 'none';
            
            // 显示电影信息区域
            movieDisplay.style.display = 'block';
            
            // 如果所有电影都已推荐过，重置列表
            if (recommendedMovies.length >= movies.length) {
                recommendedMovies = [];
            }
            
            // 过滤出未推荐过的电影
            const availableMovies = movies.filter(movie => !recommendedMovies.includes(movie.title));
            
            // 随机选择一部电影
            const randomIndex = Math.floor(Math.random() * availableMovies.length);
            const movie = availableMovies[randomIndex];
            
            // 记录已推荐的电影
            recommendedMovies.push(movie.title);
            
            // 更新页面内容
            movieTitle.textContent = movie.title;
            movieDescription.textContent = movie.description;
            movieReason.textContent = movie.reason;
            ratingText.textContent = `豆瓣评分: ${movie.rating}`;
            
            // 计算星星数量（每1分=半颗星，10分=5颗星）
            const starCount = Math.round(movie.rating / 2);
            movieStars.textContent = '★'.repeat(starCount) + '☆'.repeat(5 - starCount);
            
            // 显示"换一部电影"按钮
            changeBtn.classList.remove('hidden');
        }

        // 事件监听
        recommendBtn.addEventListener('click', recommendRandomMovie);
        changeBtn.addEventListener('click', recommendRandomMovie);

        // 初始加载时推荐一部电影
        window.addEventListener('load', function() {
            // 不自动推荐，等待用户点击
        });
    </script>
