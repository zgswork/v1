<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF压缩工具</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
        
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --accent: #4895ef;
            --light: #f8f9fa;
            --dark: #212529;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
            color: var(--dark);
        }
        
        h1, h2, h3 {
            color: var(--primary);
        }
        
        .container {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            margin: 2rem auto;
            max-width: 800px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
        
        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }
        
        .btn {
            background: var(--primary);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin-right: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .upload-area {
            border: 2px dashed var(--primary);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            margin: 1.5rem 0;
            transition: all 0.3s ease;
        }
        
        .upload-area.highlight {
            border-color: var(--accent);
            background-color: rgba(72, 149, 239, 0.1);
        }
        
        .upload-area p {
            margin: 1rem 0;
            color: #6c757d;
        }
        
        .upload-area .hint {
            font-size: 0.8rem;
            color: #adb5bd;
        }
        
        .btn:hover {
            background: var(--secondary);
            transform: translateY(-2px);
            box-shadow: 0 7px 14px rgba(0, 0, 0, 0.1);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        #clearBtn {
            background: #e63946;
        }
        
        #clearBtn:hover {
            background: #d62839;
        }
        
        .progress {
            margin: 2rem 0;
            display: none;
        }
        
        .result {
            margin: 2rem 0;
            display: none;
            animation: fadeIn 0.5s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .file-info {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .file-icon {
            font-size: 2rem;
            margin-right: 1rem;
            color: var(--accent);
        }
        
        .compression-options {
            display: flex;
            gap: 1rem;
            margin: 1.5rem 0;
        }
        
        .compression-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            flex: 1;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
        }
        
        .compression-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(0, 0, 0, 0.1);
        }
        
        .compression-card.selected {
            border-color: var(--accent);
            background: #f0f7ff;
        }
        
        .compression-card h4 {
            color: var(--primary);
            margin-top: 0;
        }
        
        .compression-card p {
            color: #6c757d;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center; margin-bottom: 2rem;">PDF压缩工具</h1>
    <div class="container">
        <div class="upload-area" id="dropArea">
            <h2>上传PDF文件</h2>
            <p>拖放文件到此处或</p>
            <label for="pdfFile" class="btn">浏览文件</label>
            <input type="file" id="pdfFile" accept=".pdf" style="display: none;">
            <p class="hint">支持单个PDF文件</p>
        </div>
        <h3>压缩选项</h3>
        <div class="file-info">
            <div class="file-icon">📄</div>
            <div>
                <h3 id="fileName">未选择文件</h3>
                <p id="fileSize">0 KB</p>
            </div>
        </div>
        
        <div class="compression-options">
            <div class="compression-card" id="basicOption">
                <h4>基本压缩</h4>
                <p>保留高质量，适度减小文件大小</p>
                <button id="basicCompress" class="btn">选择</button>
            </div>
            
            <div class="compression-card" id="strongOption">
                <h4>强力压缩</h4>
                <p>最大程度减小文件大小</p>
                <button id="strongCompress" class="btn">选择</button>
            </div>
        </div>
        
        <button id="clearBtn" class="btn">清除</button>
        
        <div class="progress" id="progress">
            <p>正在处理中，请稍候...</p>
            <progress value="0" max="100"></progress>
        </div>
        
        <div class="result" id="result">
            <h3>压缩结果</h3>
            <p>原始大小: <span id="originalSize"></span></p>
            <p>压缩后大小: <span id="compressedSize"></span></p>
            <p>压缩率: <span id="compressionRate"></span></p>
            <a id="downloadLink" href="#" download="compressed.pdf">下载压缩后的PDF</a>
        </div>
    </div>

    <script>
        document.getElementById('basicCompress').addEventListener('click', function() {
            compressPDF('basic');
        });
        
        document.getElementById('strongCompress').addEventListener('click', function() {
            compressPDF('strong');
        });
        
        // 显示文件信息
function showFileInfo(file) {
    document.getElementById('fileName').textContent = file.name;
    document.getElementById('fileSize').textContent = formatFileSize(file.size);
}

// 清除所有内容
function clearAll() {
    document.getElementById('pdfFile').value = '';
    document.getElementById('fileName').textContent = '未选择文件';
    document.getElementById('fileSize').textContent = '0 KB';
    document.getElementById('result').style.display = 'none';
    document.getElementById('basicOption').classList.remove('selected');
    document.getElementById('strongOption').classList.remove('selected');
}

// 处理拖放事件
function handleDragEvents() {
    const dropArea = document.getElementById('dropArea');
    
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropArea.addEventListener(eventName, preventDefaults, false);
    });
    
    function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
    }
    
    ['dragenter', 'dragover'].forEach(eventName => {
        dropArea.addEventListener(eventName, highlight, false);
    });
    
    ['dragleave', 'drop'].forEach(eventName => {
        dropArea.addEventListener(eventName, unhighlight, false);
    });
    
    function highlight() {
        dropArea.classList.add('highlight');
    }
    
    function unhighlight() {
        dropArea.classList.remove('highlight');
    }
    
    dropArea.addEventListener('drop', handleDrop, false);
    
    function handleDrop(e) {
        const dt = e.dataTransfer;
        const files = dt.files;
        
        if (files.length > 0 && files[0].type === 'application/pdf') {
            document.getElementById('pdfFile').files = files;
            showFileInfo(files[0]);
        }
    }
}

// 初始化事件监听
function initEvents() {
    handleDragEvents();
    document.getElementById('pdfFile').addEventListener('change', function(e) {
        if (e.target.files.length > 0) {
            showFileInfo(e.target.files[0]);
        }
    });
    
    document.getElementById('clearBtn').addEventListener('click', clearAll);
    
    document.getElementById('basicOption').addEventListener('click', function() {
        this.classList.add('selected');
        document.getElementById('strongOption').classList.remove('selected');
    });
    
    document.getElementById('strongOption').addEventListener('click', function() {
        this.classList.add('selected');
        document.getElementById('basicOption').classList.remove('selected');
    });
}

// 页面加载完成后初始化
window.addEventListener('DOMContentLoaded', initEvents);

function compressPDF(mode) {
            const fileInput = document.getElementById('pdfFile');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('请先选择PDF文件');
                return;
            }
            
            const progressDiv = document.getElementById('progress');
            progressDiv.style.display = 'block';
            
            // 模拟压缩过程
            setTimeout(() => {
                // 这里应该是实际的PDF压缩逻辑
                // 为了演示，我们使用模拟数据
                const originalSize = file.size;
                let compressedSize;
                
                if (mode === 'basic') {
                    compressedSize = originalSize * 0.7; // 模拟基本压缩效果
                } else {
                    compressedSize = originalSize * 0.4; // 模拟强力压缩效果
                }
                
                const compressionRate = ((originalSize - compressedSize) / originalSize * 100).toFixed(2);
                
                // 显示结果
                document.getElementById('originalSize').textContent = formatFileSize(originalSize);
                document.getElementById('compressedSize').textContent = formatFileSize(compressedSize);
                document.getElementById('compressionRate').textContent = compressionRate + '%';
                
                // 模拟下载链接
                document.getElementById('downloadLink').href = URL.createObjectURL(file);
                
                progressDiv.style.display = 'none';
                document.getElementById('result').style.display = 'block';
            }, 2000);
        }
        
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
    </script>
</body>
</html>
