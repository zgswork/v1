<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>联系人.vcf文件生成器</title>
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Helvetica,Arial,'Apple Color Emoji','Segoe UI Emoji';line-height:1.55;background:#f6f7f9;color:#222;transition:background .2s,color .2s}
    .dark{background:#0f1216;color:#e6e6e6}
    .container{max-width:980px;margin:0 auto;padding:20px}
    .header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
    .title{font-weight:700;font-size:18px}
    .status{font-size:12px;opacity:.8}
    .row{display:flex;gap:12px}
    .col{flex:1;display:flex;flex-direction:column;gap:12px}
    .panel{border:1px dashed #d0d7de;border-radius:10px;padding:12px;background:#fff}
    .panel .panel-title{font-weight:600;margin-bottom:8px}
    .dark .panel{border-color:#2b3647;background:#10151b;color:#e6e6e6}
    .tools{display:flex;gap:8px;flex-wrap:wrap}
    .btn{padding:8px 12px;border:1px solid #d0d7de;border-radius:10px;background:#fff;color:#111;cursor:pointer;transition:background .2s,border .2s,color .2s}
    .btn:hover{background:#f1f5f9}
    .dark .btn{background:#10151b;color:#e6e6e6;border-color:#2b3647}
    .dark .btn:hover{background:#18202b}
    .select,.input{padding:8px 12px;border:1px solid #d0d7de;border-radius:10px;background:#fff;color:#111;width:100%}
    .dark .select,.dark .input{background:#10151b;color:#e6e6e6;border-color:#2b3647}
    .area{width:100%;min-height:260px;resize:vertical;padding:12px;border:1px solid #d0d7de;border-radius:10px;background:#fff;color:#111;outline:none;transition:border .2s,background .2s,color .2s}
    .dark .area{background:#0c0f13;border-color:#263041;color:#e6e6e6}
    .kv{display:grid;grid-template-columns:140px 1fr;gap:8px;align-items:center}
    .kv .label{font-size:13px;opacity:.8}
    .list{display:flex;flex-direction:column;gap:8px}
    .item{display:flex;gap:8px;align-items:center}
    .item .grow{flex:1}
    .pill{display:inline-block;padding:4px 8px;border:1px solid #d0d7de;border-radius:999px;background:#fff;color:#111;margin-right:6px;font-size:12px}
    .dark .pill{background:#10151b;color:#e6e6e6;border-color:#2b3647}
    .footer{margin-top:16px;font-size:12px;opacity:.7}
    @media (max-width:860px){.row{flex-direction:column}.header{flex-direction:column;align-items:flex-start;gap:6px}.kv{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">联系人.vcf文件生成器 · 单文件版</div>
      <div class="status" id="status">就绪</div>
      <div style="display:flex;gap:8px;align-items:center">
        <button id="themeToggle" class="btn" aria-label="切换主题">🌞 浅色</button>
        <span class="pill" id="fileNamePill">文件名：联系人.vcf</span>
      </div>
    </div>

    <div class="row">
      <div class="col">
        <div class="panel">
          <div class="panel-title">基本信息</div>
          <div class="kv" style="margin-bottom:8px">
            <div class="label">显示名（FN）</div>
            <input id="fn" class="input" placeholder="如：张三" />
          </div>
          <div class="kv">
            <div class="label">姓（N:姓）</div>
            <input id="family" class="input" placeholder="如：张" />
          </div>
          <div class="kv">
            <div class="label">名（N:名）</div>
            <input id="given" class="input" placeholder="如：三" />
          </div>
          <div class="kv">
            <div class="label">昵称（NICKNAME）</div>
            <input id="nickname" class="input" placeholder="可选" />
          </div>
          <div class="kv">
            <div class="label">组织（ORG）</div>
            <input id="org" class="input" placeholder="公司/组织" />
          </div>
          <div class="kv">
            <div class="label">职位（TITLE）</div>
            <input id="title" class="input" placeholder="职务" />
          </div>
          <div class="kv">
            <div class="label">网址（URL）</div>
            <input id="url" class="input" placeholder="https://example.com" />
          </div>
        </div>

        <div class="panel">
          <div class="panel-title">电话（TEL）</div>
          <div id="phones" class="list"></div>
          <div class="tools" style="margin-top:8px">
            <button id="addPhone" class="btn">添加电话</button>
          </div>
        </div>

        <div class="panel">
          <div class="panel-title">邮箱（EMAIL）</div>
          <div id="emails" class="list"></div>
          <div class="tools" style="margin-top:8px">
            <button id="addEmail" class="btn">添加邮箱</button>
          </div>
        </div>

        <div class="panel">
          <div class="panel-title">地址（ADR）</div>
          <div id="addrs" class="list"></div>
          <div class="tools" style="margin-top:8px">
            <button id="addAddr" class="btn">添加地址</button>
          </div>
        </div>
      </div>

      <div class="col">
        <div class="panel">
          <div class="tools" style="margin-bottom:8px">
            <button id="demo" class="btn">填充示例</button>
            <button id="clear" class="btn">清空</button>
            <button id="copy" class="btn">复制 vcf 文本</button>
            <button id="download" class="btn">下载 .vcf 文件</button>
          </div>
          <textarea id="preview" class="area" aria-label="vcf 预览" placeholder="生成的 vCard 将显示在这里…"></textarea>
        </div>
        <div class="status">说明：采用 vCard 3.0 格式，UTF-8 编码；支持多电话、多邮箱与多地址。</div>
      </div>
    </div>

    <div class="footer">• 单文件 · 支持浅色/深色 · 响应式设计 •<br/>• 快捷键：Ctrl+Shift+C 复制，Ctrl+Shift+D 下载，Ctrl+Shift+L 切主题 •</div>
  </div>

  <script>
    const elTheme = document.getElementById('themeToggle');
    const elStatus = document.getElementById('status');
    const elFileNamePill = document.getElementById('fileNamePill');
    const elFn = document.getElementById('fn');
    const elFamily = document.getElementById('family');
    const elGiven = document.getElementById('given');
    const elNickname = document.getElementById('nickname');
    const elOrg = document.getElementById('org');
    const elTitle = document.getElementById('title');
    const elUrl = document.getElementById('url');
    const elPhones = document.getElementById('phones');
    const elEmails = document.getElementById('emails');
    const elAddrs = document.getElementById('addrs');
    const elAddPhone = document.getElementById('addPhone');
    const elAddEmail = document.getElementById('addEmail');
    const elAddAddr = document.getElementById('addAddr');
    const elPreview = document.getElementById('preview');
    const elCopy = document.getElementById('copy');
    const elDownload = document.getElementById('download');
    const elClear = document.getElementById('clear');
    const elDemo = document.getElementById('demo');

    // 主题
    if (localStorage.getItem('vcf_theme') === 'dark') {
      document.body.classList.add('dark');
      elTheme.textContent = '🌙 深色';
    }
    elTheme.onclick = () => {
      document.body.classList.toggle('dark');
      const dark = document.body.classList.contains('dark');
      elTheme.textContent = dark ? '🌙 深色' : '🌞 浅色';
      localStorage.setItem('vcf_theme', dark ? 'dark' : 'light');
    };

    // 工具函数
    function escV(s){
      return (s||'')
        .replace(/\\/g,'\\\\')
        .replace(/\r?\n/g,'\\n')
        .replace(/,/g,'\\,')
        .replace(/;/g,'\\;')
        .trim();
    }
    function line(name, value){
      if (!value) return '';
      return name+':'+value+'\r\n';
    }
    function fileName(){
      const name = (elFn.value||'').trim() || ((elFamily.value||'')+(elGiven.value||'')) || '联系人';
      const safe = name.replace(/[\\/:*?"<>|]/g,'_');
      return safe + '.vcf';
    }
    function setStatus(t){ elStatus.textContent = t; }

    // 动态行
    function phoneTypes(){ return [
      {val:'CELL', label:'手机'},
      {val:'WORK', label:'工作'},
      {val:'HOME', label:'家庭'},
      {val:'FAX', label:'传真'},
      {val:'OTHER', label:'其他'}
    ]; }
    function emailTypes(){ return [
      {val:'WORK', label:'工作'},
      {val:'HOME', label:'家庭'},
      {val:'OTHER', label:'其他'}
    ]; }
    function addrTypes(){ return [
      {val:'WORK', label:'工作'},
      {val:'HOME', label:'家庭'}
    ]; }

    function addPhoneRow(num='', type='CELL'){
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = `
        <select class="select" aria-label="电话类型">
          ${phoneTypes().map(t=>`<option value="${t.val}" ${t.val===type?'selected':''}>${t.label}</option>`).join('')}
        </select>
        <input class="input grow" placeholder="电话号码" value="${num}" />
        <button class="btn" aria-label="删除">删除</button>
      `;
      const btn = div.querySelector('button');
      btn.onclick = () => { div.remove(); update(); };
      const sel = div.querySelector('select');
      const input = div.querySelector('input');
      sel.onchange = update; input.oninput = update;
      elPhones.appendChild(div);
    }

    function addEmailRow(addr='', type='WORK'){
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = `
        <select class="select" aria-label="邮箱类型">
          ${emailTypes().map(t=>`<option value="${t.val}" ${t.val===type?'selected':''}>${t.label}</option>`).join('')}
        </select>
        <input class="input grow" placeholder="邮箱地址" value="${addr}" />
        <button class="btn" aria-label="删除">删除</button>
      `;
      const btn = div.querySelector('button');
      btn.onclick = () => { div.remove(); update(); };
      const sel = div.querySelector('select');
      const input = div.querySelector('input');
      sel.onchange = update; input.oninput = update;
      elEmails.appendChild(div);
    }

    function addAddrRow(street='', city='', region='', postal='', country='', type='HOME'){
      const wrap = document.createElement('div');
      wrap.className = 'addr-item item';
      wrap.style.flexDirection = 'column';
      wrap.style.alignItems = 'stretch';
      wrap.innerHTML = `
        <div class="item">
          <select class="select" aria-label="地址类型">
            ${addrTypes().map(t=>`<option value="${t.val}" ${t.val===type?'selected':''}>${t.label}</option>`).join('')}
          </select>
          <button class="btn" aria-label="删除">删除</button>
        </div>
        <div class="item">
          <input class="input grow" placeholder="街道" value="${street}" />
          <input class="input grow" placeholder="城市" value="${city}" />
        </div>
        <div class="item">
          <input class="input grow" placeholder="省/州" value="${region}" />
          <input class="input grow" placeholder="邮编" value="${postal}" />
          <input class="input grow" placeholder="国家/地区" value="${country}" />
        </div>
      `;
      const delBtn = wrap.querySelector('button');
      delBtn.onclick = () => { wrap.remove(); update(); };
      wrap.querySelectorAll('input,select').forEach(el=>{
        el.addEventListener('input', update);
        el.addEventListener('change', update);
      });
      elAddrs.appendChild(wrap);
    }

    // 生成 vCard
    function generate(){
      const lines = [];
      lines.push('BEGIN:VCARD\r\n');
      lines.push('VERSION:3.0\r\n');
      const fn = (elFn.value||'').trim();
      const family = (elFamily.value||'').trim();
      const given = (elGiven.value||'').trim();
      const nickname = (elNickname.value||'').trim();
      const org = (elOrg.value||'').trim();
      const title = (elTitle.value||'').trim();
      const url = (elUrl.value||'').trim();

      // N / FN
      const nValue = [escV(family), escV(given), '', '', ''].join(';');
      lines.push(line('N', nValue));
      const fnVal = escV( fn || (family+given) );
      lines.push(line('FN', fnVal));
      if (nickname) lines.push(line('NICKNAME', escV(nickname)));
      if (org) lines.push(line('ORG', escV(org)));
      if (title) lines.push(line('TITLE', escV(title)));
      if (url) lines.push(line('URL', escV(url)));

      // TEL
      elPhones.querySelectorAll('.item').forEach(item=>{
        const type = item.querySelector('select').value || 'CELL';
        const num = (item.querySelector('input').value||'').trim();
        if (!num) return;
        const val = escV(num);
        lines.push(line('TEL;TYPE='+type, val));
      });

      // EMAIL
      elEmails.querySelectorAll('.item').forEach(item=>{
        const type = item.querySelector('select').value || 'WORK';
        const addr = (item.querySelector('input').value||'').trim();
        if (!addr) return;
        const val = escV(addr);
        // vCard 3.0 常见写法：EMAIL;TYPE=INTERNET;TYPE=WORK
        lines.push(line('EMAIL;TYPE=INTERNET;TYPE='+type, val));
      });

      // ADR
      elAddrs.querySelectorAll('.addr-item').forEach(wrap=>{
        const type = wrap.querySelector('select').value || 'HOME';
        const inputs = wrap.querySelectorAll('input');
        const street = escV(inputs[0].value||'');
        const city = escV(inputs[1].value||'');
        const region = escV(inputs[2].value||'');
        const postal = escV(inputs[3].value||'');
        const country = escV(inputs[4].value||'');
        const adrVal = ['','',street,city,region,postal,country].join(';');
        lines.push(line('ADR;TYPE='+type, adrVal));
      });

      const note = (document.getElementById('note')?.value||'').trim();
      if (note) lines.push(line('NOTE', escV(note)));

      lines.push('END:VCARD\r\n');
      return lines.join('');
    }

    function update(){
      const v = generate();
      elPreview.value = v;
      elFileNamePill.textContent = '文件名：' + fileName();
    }

    // 按钮
    elCopy.onclick = async () => {
      const t = elPreview.value||'';
      if (!t) { setStatus('无可复制内容'); return; }
      try { await navigator.clipboard.writeText(t); setStatus('已复制 vcf 文本'); }
      catch { setStatus('复制失败'); }
    };
    elDownload.onclick = () => {
      const text = elPreview.value||generate();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], {type:'text/vcard;charset=utf-8'}));
      a.download = fileName();
      document.body.appendChild(a);
      a.click();
      setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },0);
      setStatus('已下载 .vcf 文件');
    };
    elClear.onclick = () => {
      [elFn, elFamily, elGiven, elNickname, elOrg, elTitle, elUrl].forEach(el=>el.value='');
      elPhones.innerHTML=''; elEmails.innerHTML=''; elAddrs.innerHTML='';
      addPhoneRow(); addEmailRow(); addAddrRow();
      const noteEl = document.getElementById('note'); if (noteEl) noteEl.value='';
      update(); setStatus('已清空');
    };
    elDemo.onclick = () => {
      elFn.value = '张三';
      elFamily.value = '张';
      elGiven.value = '三';
      elNickname.value = '小张';
      elOrg.value = '示例科技有限公司';
      elTitle.value = '研发工程师';
      elUrl.value = 'https://example.com';
      elPhones.innerHTML='';
      addPhoneRow('13800001234','CELL');
      addPhoneRow('010-88886666','WORK');
      elEmails.innerHTML='';
      addEmailRow('zhangsan@example.com','WORK');
      addEmailRow('zhangsan_home@example.com','HOME');
      elAddrs.innerHTML='';
      addAddrRow('北京市海淀区中关村大街1号','北京市','北京','100080','中国','HOME');
      const noteEl = document.getElementById('note'); if (noteEl) noteEl.value='关键客户，偏好电话联系。';
      update(); setStatus('已填充示例');
    };

    // 备注单独面板（为了更高的可读性放在右列下方）
    const notePanel = document.createElement('div');
    notePanel.className = 'panel';
    notePanel.innerHTML = `
      <div class="panel-title">备注（NOTE）</div>
      <textarea id="note" class="area" style="min-height:120px" placeholder="可选：输入备注信息…"></textarea>
    `;
    document.querySelector('.row .col:last-child').appendChild(notePanel);

    // 初始化列表与事件
    elAddPhone.onclick = () => { addPhoneRow(); };
    elAddEmail.onclick = () => { addEmailRow(); };
    elAddAddr.onclick = () => { addAddrRow(); };
    [elFn, elFamily, elGiven, elNickname, elOrg, elTitle, elUrl].forEach(el=>{
      el.addEventListener('input', update);
    });

    // 快捷键
    document.addEventListener('keydown', e => {
      if (e.ctrlKey && e.shiftKey) {
        const k = e.key.toLowerCase();
        if (k==='c'){ elCopy.click(); e.preventDefault(); }
        else if (k==='d'){ elDownload.click(); e.preventDefault(); }
        else if (k==='l'){ elTheme.click(); e.preventDefault(); }
      }
    });

    // 启动默认行并首次渲染
    addPhoneRow();
    addEmailRow();
    addAddrRow();
    update();
  </script>
</body>
</html>
