        const displayElement = document.getElementById('twister-display');
        const actionBtn = document.getElementById('action-btn');
        const downloadBtn = document.getElementById('download-btn');
        const modal = document.getElementById('download-modal');
        const copyBtn = document.getElementById('copy-btn');
        const downloadLink = document.getElementById('download-link');
        
        let currentIndex = -1;
        let previousIndex = -1;
        
        // 获取随机绕口令索引
        function getRandomIndex() {
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * tongueTwisters.length);
            } while (newIndex === previousIndex && tongueTwisters.length > 1);
            
            previousIndex = currentIndex;
            currentIndex = newIndex;
            return newIndex;
        }
        
        // 显示绕口令
        function showTongueTwister() {
            const index = getRandomIndex();
            displayElement.textContent = tongueTwisters[index];
            actionBtn.textContent = '换个绕口令';
        }
        
        // 显示下载弹窗
        function showDownloadModal() {
            modal.style.display = 'flex';

        // 隐藏下载弹窗
        function hideDownloadModal() {
            modal.style.display = 'none';
        }
        
        // 复制链接到剪贴板
        function copyLink() {
            const text = downloadLink.textContent;
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    alert('链接已复制到剪贴板');
                } else {
                    alert('复制失败，请手动复制链接');
                }
            } catch (err) {
                alert('复制失败，请手动复制链接');
                console.error('复制失败:', err);
            }
            
            document.body.removeChild(textarea);
            hideDownloadModal();
        }

        actionBtn.addEventListener('click', showTongueTwister);

        copyBtn.addEventListener('click', copyLink);

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                hideDownloadModal();
            }
        });
