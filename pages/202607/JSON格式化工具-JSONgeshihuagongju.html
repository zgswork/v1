<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON格式化工具</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: #f0f2f5;
            color: #1f2328;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 30px 0;
            color: #1f2328;
        }
        
        header h1 {
            font-size: 2.2rem;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #0969da, #8250df);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }
        
        header p {
            font-size: 1rem;
            color: #656d76;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.5;
        }
        
        .card {
            background: #ffffff;
            border: 1px solid #d1d9e0;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(16, 24, 40, 0.12), 0 1px 3px rgba(16, 24, 40, 0.08);
            overflow: hidden;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-1px);
            border-color: #0969da;
            box-shadow: 0 4px 16px rgba(16, 24, 40, 0.16), 0 2px 6px rgba(16, 24, 40, 0.12);
        }
        
        .card-header {
            background: #f8f9fa;
            border-bottom: 1px solid #d1d9e0;
            color: #1f2328;
            padding: 14px 20px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }
        
        .card-body {
            padding: 20px;
        }
        
        .input-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        textarea {
            width: 100%;
            height: 200px;
            padding: 14px;
            background: #ffffff;
            border: 1.5px solid #d1d9e0;
            border-radius: 6px;
            resize: vertical;
            font-size: 13px;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', monospace;
            color: #1f2328;
            transition: all 0.2s ease;
            line-height: 1.4;
        }
        
        textarea:focus {
            outline: none;
            border-color: #0969da;
            box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.12);
        }
        
        textarea::placeholder {
            color: #656d76;
        }
        
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }
        
        button {
            padding: 10px 20px;
            border: 1.5px solid transparent;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
        }
        
        .btn-primary {
            background: #0969da;
            color: white;
            border-color: #0969da;
        }
        
        .btn-primary:hover {
            background: #0550ae;
            border-color: #0550ae;
            transform: translateY(-1px);
            box-shadow: 0 3px 8px rgba(9, 105, 218, 0.25);
        }
        
        .btn-secondary {
            background: #ffffff;
            color: #1f2328;
            border-color: #d1d9e0;
        }
        
        .btn-secondary:hover {
            background: #f6f8fa;
            border-color: #8c959f;
            transform: translateY(-1px);
            box-shadow: 0 3px 8px rgba(16, 24, 40, 0.15);
        }
        
        .btn-success {
            background: #1a7f37;
            color: white;
            border-color: #1a7f37;
        }
        
        .btn-success:hover {
            background: #116329;
            border-color: #116329;
            transform: translateY(-1px);
            box-shadow: 0 3px 8px rgba(26, 127, 55, 0.25);
        }
        
        #output {
            background: #f8f9fa;
            border: 1.5px solid #d1d9e0;
            border-radius: 6px;
            padding: 14px;
            min-height: 200px;
            max-height: 400px;
            overflow: auto;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            line-height: 1.4;
            color: #1f2328;
        }
        
        .error {
            color: #d1242f;
            font-weight: 500;
            padding: 10px 14px;
            background: #ffebe9;
            border: 1.5px solid #fd8c73;
            border-radius: 6px;
            margin-top: 12px;
            display: none;
            font-family: 'Segoe UI', sans-serif;
            font-size: 13px;
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin-top: 24px;
        }
        
        .feature {
            background: #ffffff;
            border: 1px solid #d1d9e0;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(16, 24, 40, 0.12), 0 1px 3px rgba(16, 24, 40, 0.08);
            transition: all 0.2s ease;
        }
        
        .feature:hover {
            border-color: #0969da;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(16, 24, 40, 0.16), 0 2px 6px rgba(16, 24, 40, 0.12);
        }
        
        .feature i {
            font-size: 2rem;
            background: linear-gradient(135deg, #0969da, #8250df);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
        }
        
        .feature h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: #1f2328;
            font-weight: 600;
        }
        
        .feature p {
            color: #656d76;
            line-height: 1.4;
            font-size: 13px;
        }
        
        .footer {
            margin-top: 30px;
            padding: 16px 0;
            text-align: center;
            font-size: 13px;
            color: #656d76;
        }

        .footer a {
            color: #0969da;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }
            
            .card-header {
                padding: 12px 16px;
                font-size: 1rem;
            }
            
            .card-body {
                padding: 16px;
            }
            
            textarea, #output {
                height: 180px;
                font-size: 12px;
            }
            
            button {
                padding: 10px 16px;
                font-size: 13px;
                flex: 1;
                min-width: 100px;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 15px;
            }
            
            header h1 {
                font-size: 1.8rem;
            }
            
            header p {
                font-size: 0.9rem;
            }
            
            .card-header {
                padding: 10px 14px;
            }
            
            textarea, #output {
                height: 160px;
            }
            
            button {
                width: 100%;
            }
            
            .feature {
                padding: 16px 12px;
            }
        }
        
        /* JSON Syntax Highlighting */
        .json-key {
            color: #0969da;
            font-weight: 600;
        }
        
        .json-string {
            color: #1a7f37;
        }
        
        .json-number {
            color: #8250df;
        }
        
        .json-boolean {
            color: #d1242f;
        }
        
        .json-null {
            color: #bc4c00;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-code"></i> JSON 格式化工具</h1>
            <p>快速格式化、验证和美化 JSON 数据，支持语法高亮显示</p>
        </header>
        
        <main>
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-keyboard"></i> JSON 输入
                </div>
                <div class="card-body">
                    <div class="input-area">
                        <textarea id="json-input" placeholder='在此处粘贴您的 JSON 数据...&#10;例如：{"name": "John", "age": 30, "city": "New York"}'></textarea>
                        
                        <div class="controls">
                            <button id="format-btn" class="btn-primary">
                                <i class="fas fa-magic"></i> 格式化
                            </button>
                            <button id="minify-btn" class="btn-secondary">
                                <i class="fas fa-compress"></i> 压缩
                            </button>
                            <button id="clear-btn" class="btn-secondary">
                                <i class="fas fa-broom"></i> 清除
                            </button>
                            <button id="copy-btn" class="btn-success">
                                <i class="fas fa-copy"></i> 复制结果
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-file-code"></i> 格式化结果
                </div>
                <div class="card-body">
                    <div id="output">格式化后的 JSON 将显示在这里...</div>
                    <div id="error" class="error"></div>
                </div>
            </div>
            
            <div class="features">
                <div class="feature">
                    <i class="fas fa-bolt"></i>
                    <h3>快速格式化</h3>
                    <p>一键美化 JSON 数据，提高可读性，便于查看和调试</p>
                </div>
                
                <div class="feature">
                    <i class="fas fa-mobile-alt"></i>
                    <h3>响应式设计</h3>
                    <p>在桌面、平板和手机上均可完美使用，随时随地格式化 JSON</p>
                </div>
                
                <div class="feature">
                    <i class="fas fa-paint-brush"></i>
                    <h3>语法高亮</h3>
                    <p>使用颜色区分 JSON 中的键、值和数据类型，更直观清晰</p>
                </div>
            </div>
        </main>
    </div>
    
    <footer class="footer">
        <p>© 2025 JSON格式化工具 | <a href="https://t.zsxq.com/MlnIL" target="_blank">联系作者</a></p>
    </footer>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const jsonInput = document.getElementById('json-input');
            const output = document.getElementById('output');
            const errorDiv = document.getElementById('error');
            const formatBtn = document.getElementById('format-btn');
            const minifyBtn = document.getElementById('minify-btn');
            const clearBtn = document.getElementById('clear-btn');
            const copyBtn = document.getElementById('copy-btn');
            
            // 格式化 JSON
            function formatJson() {
                try {
                    errorDiv.style.display = 'none';
                    const inputText = jsonInput.value.trim();
                    
                    if (!inputText) {
                        output.textContent = '格式化后的 JSON 将显示在这里...';
                        return;
                    }
                    
                    const parsedJson = JSON.parse(inputText);
                    const formattedJson = JSON.stringify(parsedJson, null, 4);
                    
                    // 应用语法高亮
                    output.innerHTML = syntaxHighlight(formattedJson);
                } catch (err) {
                    showError('无效的 JSON 格式: ' + err.message);
                }
            }
            
            // 压缩 JSON
            function minifyJson() {
                try {
                    errorDiv.style.display = 'none';
                    const inputText = jsonInput.value.trim();
                    
                    if (!inputText) {
                        output.textContent = '压缩后的 JSON 将显示在这里...';
                        return;
                    }
                    
                    const parsedJson = JSON.parse(inputText);
                    const minifiedJson = JSON.stringify(parsedJson);
                    
                    output.textContent = minifiedJson;
                } catch (err) {
                    showError('无效的 JSON 格式: ' + err.message);
                }
            }
            
            // 清除输入和输出
            function clearAll() {
                jsonInput.value = '';
                output.textContent = '格式化后的 JSON 将显示在这里...';
                errorDiv.style.display = 'none';
            }
            
            // 复制结果
            function copyResult() {
                if (output.textContent === '格式化后的 JSON 将显示在这里...') {
                    return;
                }
                
                const textarea = document.createElement('textarea');
                textarea.value = output.textContent;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                
                // 显示复制成功反馈
                const originalText = copyBtn.innerHTML;
                copyBtn.innerHTML = '<i class="fas fa-check"></i> 已复制';
                
                setTimeout(() => {
                    copyBtn.innerHTML = originalText;
                }, 2000);
            }
            
            // 显示错误信息
            function showError(message) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = message;
                output.textContent = '格式化失败，请检查输入...';
            }
            
            // JSON 语法高亮
            function syntaxHighlight(json) {
                json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                    let cls = 'json-number';
                    if (/^"/.test(match)) {
                        if (/:$/.test(match)) {
                            cls = 'json-key';
                        } else {
                            cls = 'json-string';
                        }
                    } else if (/true|false/.test(match)) {
                        cls = 'json-boolean';
                    } else if (/null/.test(match)) {
                        cls = 'json-null';
                    }
                    return '<span class="' + cls + '">' + match + '</span>';
                });
            }
            
            // 事件监听
            formatBtn.addEventListener('click', formatJson);
            minifyBtn.addEventListener('click', minifyJson);
            clearBtn.addEventListener('click', clearAll);
            copyBtn.addEventListener('click', copyResult);
            
            // 示例 JSON
            jsonInput.value = JSON.stringify({
                "tool": "JSON Formatter",
                "description": "A simple JSON formatting tool",
                "features": [
                    "Format JSON",
                    "Minify JSON",
                    "Syntax Highlighting",
                    "Copy to Clipboard"
                ],
                "author": "John Doe",
                "website": "https://example.com",
                "version": 1.2,
                "active": true,
                "tags": ["json", "formatter", "web", "tool"],
                "metadata": {
                    "created": "2023-07-14",
                    "last_updated": "2023-08-01"
                }
            }, null, 2);
        });
    </script>
</body>
</html>
