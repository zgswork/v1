<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机数据集生成器</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e8f5e9;
            margin: 0;
            padding: 20px;
            color: #2e7d32;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #2e7d32;
        }
        .control-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            min-width: 150px;
        }
        label {
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            padding: 8px;
            border: 1px solid #a5d6a7;
            border-radius: 4px;
        }
        button {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #388e3c;
        }
        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #a5d6a7;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #c8e6c9;
        }
        tr:nth-child(even) {
            background-color: #f1f8e9;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #2e7d32;
        }
        a {
            color: #2e7d32;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        @media (max-width: 600px) {
            .control-panel {
                flex-direction: column;
            }
            .control-group {
                width: 100%;
            }
            .buttons {
                flex-direction: column;
            }
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>随机数据集生成器</h1>
        
        <div class="control-panel">
            <div class="control-group">
                <label for="recordCount">记录数量</label>
                <input type="number" id="recordCount" min="1" max="1000" value="10">
            </div>
            
            <div class="control-group">
                <label for="nameType">姓名类型</label>
                <select id="nameType">
                    <option value="chinese">中文名</option>
                    <option value="english">英文名</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="minAge">最小年龄</label>
                <input type="number" id="minAge" min="1" max="120" value="18">
            </div>
            
            <div class="control-group">
                <label for="maxAge">最大年龄</label>
                <input type="number" id="maxAge" min="1" max="120" value="60">
            </div>
            
            <div class="control-group">
                <label for="country">国家</label>
                <select id="country">
                    <option value="china">中国</option>
                    <option value="usa">美国</option>
                    <option value="uk">英国</option>
                    <option value="japan">日本</option>
                </select>
            </div>
        </div>
        
        <div class="buttons">
            <button id="generateBtn">生成数据</button>
            <button id="exportBtn">导出Excel</button>
            <button id="clearBtn">清除数据</button>
        </div>
        
        <div id="tableContainer">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>姓名</th>
                        <th>年龄</th>
                        <th>性别</th>
                        <th>地址</th>
                        <th>邮箱</th>
                        <th>电话</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- 数据将在这里动态生成 -->
                </tbody>
            </table>
        </div>
        
        <div class="footer">
            本工具由兔子先生用deepseek开发，技术支持：<a href="https://t.zsxq.com/y1934" target="_blank">https://t.zsxq.com/y1934</a>
        </div>
    </div>

    <script>
        // 中文姓氏
        const chineseSurnames = [
            '李', '王', '张', '刘', '陈', '杨', '赵', '黄', '周', '吴',
            '徐', '孙', '胡', '朱', '高', '林', '何', '郭', '马', '罗'
        ];
        
        // 中文名字
        const chineseGivenNames = [
            '伟', '芳', '娜', '秀英', '敏', '静', '丽', '强', '磊', '军',
            '洋', '勇', '艳', '杰', '娟', '涛', '明', '超', '秀兰', '霞',
            '平', '刚', '桂英', '玉兰', '萍', '毅', '浩', '宇', '建国', '建军'
        ];
        
        // 英文名
        const englishFirstNames = [
            'James', 'John', 'Robert', 'Michael', 'William',
            'David', 'Richard', 'Charles', 'Joseph', 'Thomas',
            'Mary', 'Patricia', 'Linda', 'Barbara', 'Elizabeth',
            'Jennifer', 'Maria', 'Susan', 'Margaret', 'Dorothy'
        ];
        
        const englishLastNames = [
            'Smith', 'Johnson', 'Williams', 'Brown', 'Jones',
            'Miller', 'Davis', 'Garcia', 'Rodriguez', 'Wilson',
            'Martinez', 'Anderson', 'Taylor', 'Thomas', 'Hernandez',
            'Moore', 'Martin', 'Jackson', 'Thompson', 'White'
        ];
        
        // 中国城市
        const chineseCities = ['北京', '上海', '广州', '深圳', '成都', '杭州', '武汉', '西安', '南京', '重庆'];
        // 美国城市
        const usCities = ['New York', 'Los Angeles', 'Chicago', 'Houston', 'Phoenix', 'Philadelphia', 'San Antonio', 'San Diego', 'Dallas', 'San Jose'];
        // 英国城市
        const ukCities = ['London', 'Birmingham', 'Manchester', 'Liverpool', 'Leeds', 'Sheffield', 'Bristol', 'Newcastle', 'Nottingham', 'Leicester'];
        // 日本城市
        const japanCities = ['Tokyo', 'Osaka', 'Nagoya', 'Yokohama', 'Sapporo', 'Kobe', 'Kyoto', 'Fukuoka', 'Kawasaki', 'Hiroshima'];
        
        // 生成随机中文名
        function generateChineseName() {
            const surname = chineseSurnames[Math.floor(Math.random() * chineseSurnames.length)];
            const givenName1 = chineseGivenNames[Math.floor(Math.random() * chineseGivenNames.length)];
            const givenName2 = chineseGivenNames[Math.floor(Math.random() * chineseGivenNames.length)];
            
            // 随机决定是一个字还是两个字的名字
            return Math.random() > 0.3 ? surname + givenName1 : surname + givenName1 + givenName2;
        }
        
        // 生成随机英文名
        function generateEnglishName() {
            const firstName = englishFirstNames[Math.floor(Math.random() * englishFirstNames.length)];
            const lastName = englishLastNames[Math.floor(Math.random() * englishLastNames.length)];
            return firstName + ' ' + lastName;
        }
        
        // 生成随机地址
        function generateAddress(country) {
            let city, street, building;
            
            switch(country) {
                case 'china':
                    city = chineseCities[Math.floor(Math.random() * chineseCities.length)];
                    street = ['中山路', '人民路', '解放路', '建设路', '新华路'][Math.floor(Math.random() * 5)];
                    building = Math.floor(Math.random() * 100) + 1 + '号';
                    return city + '市' + street + building;
                case 'usa':
                    city = usCities[Math.floor(Math.random() * usCities.length)];
                    street = ['Main St', 'Oak St', 'Elm St', 'Pine St', 'Maple St'][Math.floor(Math.random() * 5)];
                    building = Math.floor(Math.random() * 1000) + 1;
                    return building + ' ' + street + ', ' + city;
                case 'uk':
                    city = ukCities[Math.floor(Math.random() * ukCities.length)];
                    street = ['High St', 'Church St', 'Park Rd', 'London Rd', 'Victoria St'][Math.floor(Math.random() * 5)];
                    building = Math.floor(Math.random() * 100) + 1;
                    return building + ' ' + street + ', ' + city;
                case 'japan':
                    city = japanCities[Math.floor(Math.random() * japanCities.length)];
                    street = ['中央通', '银座', '新宿通', '道顿堀', '心斋桥'][Math.floor(Math.random() * 5)];
                    building = Math.floor(Math.random() * 100) + 1 + '丁目';
                    return city + ' ' + street + building;
                default:
                    return '';
            }
        }
        
        // 生成随机邮箱
        function generateEmail(name, country) {
            const domains = {
                'china': ['qq.com', '163.com', 'sina.com', 'gmail.com', 'outlook.com'],
                'usa': ['gmail.com', 'yahoo.com', 'hotmail.com', 'outlook.com', 'aol.com'],
                'uk': ['gmail.com', 'yahoo.co.uk', 'hotmail.co.uk', 'outlook.com', 'btinternet.com'],
                'japan': ['gmail.com', 'yahoo.co.jp', 'hotmail.com', 'outlook.com', 'docomo.ne.jp']
            };
            
            const namePart = name.replace(/\s+/g, '.').toLowerCase();
            const domain = domains[country][Math.floor(Math.random() * domains[country].length)];
            return namePart + '@' + domain;
        }
        
        // 生成随机电话号码
        function generatePhoneNumber(country) {
            switch(country) {
                case 'china':
                    return '1' + [3,5,7,8,9][Math.floor(Math.random() * 5)] + 
                           Math.random().toString().slice(2, 11);
                case 'usa':
                    return '+1 (' + Math.random().toString().slice(2, 5) + ') ' + 
                           Math.random().toString().slice(5, 8) + '-' + 
                           Math.random().toString().slice(8, 12);
                case 'uk':
                    return '+44 ' + Math.random().toString().slice(2, 6) + ' ' + 
                           Math.random().toString().slice(6, 10);
                case 'japan':
                    return '+81 ' + Math.random().toString().slice(2, 6) + '-' + 
                           Math.random().toString().slice(6, 10) + '-' + 
                           Math.random().toString().slice(10, 14);
                default:
                    return '';
            }
        }
        
        // 生成随机性别
        function generateGender() {
            return Math.random() > 0.5 ? '男' : '女';
        }
        
        // 生成随机年龄
        function generateAge(minAge, maxAge) {
            return Math.floor(Math.random() * (maxAge - minAge + 1)) + parseInt(minAge);
        }
        
        // 生成数据
        function generateData() {
            const recordCount = parseInt(document.getElementById('recordCount').value);
            const nameType = document.getElementById('nameType').value;
            const minAge = document.getElementById('minAge').value;
            const maxAge = document.getElementById('maxAge').value;
            const country = document.getElementById('country').value;
            
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';
            
            for (let i = 1; i <= recordCount; i++) {
                const name = nameType === 'chinese' ? generateChineseName() : generateEnglishName();
                const age = generateAge(minAge, maxAge);
                const gender = generateGender();
                const address = generateAddress(country);
                const email = generateEmail(name, country);
                const phone = generatePhoneNumber(country);
                
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${i}</td>
                    <td>${name}</td>
                    <td>${age}</td>
                    <td>${gender}</td>
                    <td>${address}</td>
                    <td>${email}</td>
                    <td>${phone}</td>
                `;
                
                tableBody.appendChild(row);
            }
        }
        
        // 导出Excel
        function exportToExcel() {
            const table = document.getElementById('dataTable');
            const workbook = XLSX.utils.table_to_book(table);
            XLSX.writeFile(workbook, '随机用户数据.xlsx');
        }
        
        // 清除数据
        function clearData() {
            document.getElementById('tableBody').innerHTML = '';
        }
        
        // 事件监听
        document.getElementById('generateBtn').addEventListener('click', generateData);
        document.getElementById('exportBtn').addEventListener('click', exportToExcel);
        document.getElementById('clearBtn').addEventListener('click', clearData);
    </script>
</body>
</html>
