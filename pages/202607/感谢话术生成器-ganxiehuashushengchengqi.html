<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>感谢话术生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    
    <!-- Tailwind 配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981',
                        accent: '#8B5CF6',
                        neutral: '#F3F4F6',
                        dark: '#1F2937'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .shadow-soft {
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            }
            .transition-custom {
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-50 min-h-screen font-sans text-dark">
    <!-- 页面容器 -->
    <div class="container mx-auto px-4 py-8 max-w-4xl flex flex-col min-h-screen">
        
        <!-- 标题区域 -->
        <header class="text-center mb-10 mt-6">
            <div class="inline-block p-3 bg-primary/10 rounded-full mb-4">
                <i class="fa fa-heart text-3xl text-primary"></i>
            </div>
            <h1 class="text-[clamp(2rem,5vw,3rem)] font-bold text-dark mb-3 bg-clip-text text-transparent bg-gradient-to-r from-primary to-accent">感谢话术生成器</h1>
            <p class="text-gray-600 max-w-2xl mx-auto text-[clamp(1rem,2vw,1.1rem)]">轻松生成得体的感谢语，让每一份感激都恰到好处</p>
        </header>
        
        <!-- 主要内容区 -->
        <main class="flex-grow">
            <div class="bg-white rounded-2xl shadow-soft p-6 md:p-8 mb-8 transform hover:shadow-lg transition-custom">
                <!-- 选择区域 -->
                <div class="grid md:grid-cols-2 gap-6 mb-8">
                    <!-- 选择感谢对象 -->
                    <div class="space-y-3">
                        <label for="recipient" class="block text-gray-700 font-medium">感谢对象</label>
                        <div class="relative">
                            <select id="recipient" class="w-full px-4 py-3 bg-neutral rounded-lg border border-gray-200 appearance-none focus:outline-none focus:ring-2 focus:ring-primary/50 transition-custom">
                                <option value="interviewer">面试官</option>
                                <option value="colleague">同事帮忙</option>
                                <option value="friend">朋友</option>
                                <option value="teacher">老师</option>
                                <option value="client">客户</option>
                                <option value="leader">领导</option>
                            </select>
                            <div class="absolute right-3 top-1/2 transform -translate-y-1/2 pointer-events-none">
                                <i class="fa fa-chevron-down text-gray-400"></i>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 选择感谢语长度 -->
                    <div class="space-y-3">
                        <label for="length" class="block text-gray-700 font-medium">感谢语长度</label>
                        <div class="grid grid-cols-3 gap-3">
                            <button class="length-btn px-4 py-3 bg-primary text-white rounded-lg transition-custom hover:bg-primary/90 active" data-length="short">简短</button>
                            <button class="length-btn px-4 py-3 bg-neutral text-gray-700 rounded-lg transition-custom hover:bg-gray-200" data-length="medium">中等</button>
                            <button class="length-btn px-4 py-3 bg-neutral text-gray-700 rounded-lg transition-custom hover:bg-gray-200" data-length="long">详细</button>
                        </div>
                    </div>
                </div>
                
                <!-- 生成按钮 -->
                <div class="text-center mb-8">
                    <button id="generate-btn" class="px-8 py-4 bg-gradient-to-r from-primary to-accent text-white rounded-full font-medium shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-custom focus:outline-none focus:ring-4 focus:ring-primary/20">
                        <i class="fa fa-magic mr-2"></i>生成感谢语
                    </button>
                </div>
                
                <!-- 结果展示区域 -->
                <div id="result-container" class="relative mt-6 p-6 bg-neutral rounded-xl min-h-[150px]">
                    <div id="result-content" class="text-gray-700 leading-relaxed">
                        选择感谢对象和长度，点击生成按钮获取合适的感谢话术...
                    </div>
                    
                    <!-- 复制按钮 -->
                    <button id="copy-btn" class="absolute top-4 right-4 p-2 bg-white/80 hover:bg-white text-gray-700 rounded-full shadow-sm transition-custom opacity-0 invisible" aria-label="复制内容">
                        <i class="fa fa-copy"></i>
                    </button>
                    
                    <!-- 复制成功提示 -->
                    <div id="copy-success" class="absolute top-4 right-4 px-3 py-1 bg-secondary text-white text-sm rounded-full shadow-sm transition-custom opacity-0 invisible">
                        <i class="fa fa-check mr-1"></i>已复制
                    </div>
                </div>
            </div>
            
            <!-- 提示卡片 -->
            <div class="bg-white/80 backdrop-blur-sm rounded-xl shadow-soft p-5 mb-8 border border-gray-100">
                <div class="flex items-start">
                    <div class="text-amber-500 mr-3 mt-1">
                        <i class="fa fa-lightbulb-o text-xl"></i>
                    </div>
                    <div>
                        <h3 class="font-medium text-gray-800 mb-1">使用提示</h3>
                        <p class="text-gray-600 text-sm">生成的感谢语可根据实际情况进行修改，加入具体事例会让感谢更加真诚动人。</p>
                    </div>
                </div>
            </div>
        </main>
        
        <!-- 页脚 -->
        <footer class="mt-auto py-6 text-center text-gray-500 text-sm">
            <p>
                邓文涛(AI版) | <a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="9cabacaba9a8aba8a8addcededb2fff3f1">[email&#160;protected]</a> | VX：707547441 | 更多点击➡️
                <a href="https://dkfile.com/Dx25214" target="_blank" rel="noopener" class="text-primary hover:underline inline-flex items-center">
                    <i class="fa fa-globe ml-1"></i>
                </a>
            </p>
        </footer>
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 感谢话术模板库
        const thankYouTemplates = {
            // 面试官
            interviewer: {
                short: "非常感谢您今天给予的面试机会，我从中收获良多，期待能有机会加入贵团队。",
                medium: "感谢您今天抽出宝贵时间进行面试，通过与您的交流，我对贵公司和这个职位有了更深入的了解，也更加期待能有机会为团队贡献力量。",
                long: "非常感谢您今天给予的面试机会以及详细的讲解。通过这次面试，我不仅对贵公司的文化和发展前景有了更清晰的认识，也从您的专业见解中获得了很多启发。无论结果如何，这次经历都让我受益匪浅。再次感谢您的时间和指导，期待未来能有合作的机会。"
            },
            // 同事帮忙
            colleague: {
                short: "太感谢你了！这次多亏有你的帮忙，不然我真不知道该怎么办。",
                medium: "非常感谢你的帮助！这次的事情比较棘手，幸亏有你出手相助，不仅帮我解决了问题，还节省了很多时间。真的太感谢了，以后有需要我的地方尽管开口。",
                long: "真心感谢你这次的大力帮忙！当我面对那个难题手足无措的时候，你主动伸出援手，不仅耐心指导我解决问题的思路，还牺牲了自己的休息时间协助我完成工作。你的专业能力和乐于助人的态度让我非常敬佩和感动。这份情谊我记在心里，以后如果有任何我能帮上忙的地方，请一定告诉我，我会尽力而为。"
            },
            // 朋友
            friend: {
                short: "谢啦，兄弟/姐妹！这次真的多亏了你，改天我请你吃饭！",
                medium: "太感谢你了！在我最需要帮助的时候，你毫不犹豫地伸出援手，这份情谊我会一直记在心里。真的不知道该怎么表达我的感激之情，改天一定要好好谢谢你，请你吃顿大餐！",
                long: "亲爱的朋友，千言万语都难以表达我的感激之情。当我遇到困难向你求助时，你不仅没有丝毫犹豫，还尽心尽力地帮我想办法、解决问题，甚至牺牲了自己的时间和精力。有你这样的朋友是我最大的幸运，这份深厚的情谊比什么都珍贵。我已经约好了我们常去的那家餐厅，这周末一定要赏光，让我好好谢谢你！"
            },
            // 老师
            teacher: {
                short: "感谢老师的悉心指导，您的教诲让我受益匪浅。",
                medium: "尊敬的老师，非常感谢您一直以来的悉心教导和耐心指导。您不仅传授了专业知识，更教会了我很多为人处世的道理，这些都让我受益匪浅。衷心感谢您的付出！",
                long: "尊敬的老师，衷心感谢您一直以来对我的关心和指导。在我学习遇到瓶颈时，是您耐心点拨，为我指明方向；在我迷茫困惑时，是您循循善诱，给予我信心和力量。您不仅传授了扎实的专业知识，更以身作则地教会了我严谨的治学态度和为人处世的道理。这些宝贵的财富将伴随我的一生，影响我的成长。再次衷心感谢您的辛勤付出和无私奉献！"
            },
            // 客户
            client: {
                short: "感谢您的信任与支持，我们会继续努力提供更优质的服务。",
                medium: "非常感谢您对我们的信任和支持！您的满意是我们前进的最大动力，我们会继续努力，为您提供更优质的产品和服务。期待与您的长期合作！",
                long: "尊敬的客户，衷心感谢您选择我们的产品/服务以及一直以来的信任与支持。您的认可是对我们工作最大的肯定，也是我们不断进步的动力。我们深知，每一次合作都来之不易，所以会倍加珍惜与您的合作机会。未来，我们将继续提升产品质量和服务水平，力求为您创造更大的价值。期待与您保持长期稳定的合作关系，共同发展，实现共赢！"
            },
            // 领导
            leader: {
                short: "感谢领导的指导和栽培，我会继续努力，不辜负您的期望。",
                medium: "非常感谢领导给予我的机会和信任，以及在工作中给予的悉心指导和支持。您的教诲让我受益匪浅，也让我对工作有了更深刻的理解。我会继续努力，不辜负您的期望。",
                long: "尊敬的领导，衷心感谢您一直以来对我的关心、指导和培养。感谢您给予我成长的机会和展示的平台，让我在工作中不断学习、进步。在我遇到困难时，您总能给予及时的指导和支持；在我取得成绩时，您也给予了肯定和鼓励。您的领导风范和专业素养一直是我学习的榜样。我会将这份感激化为工作的动力，更加努力地完成各项任务，不辜负您的信任和期望，为团队的发展贡献自己的力量。"
            }
        };

        // DOM 元素
        const recipientSelect = document.getElementById('recipient');
        const lengthBtns = document.querySelectorAll('.length-btn');
        const generateBtn = document.getElementById('generate-btn');
        const resultContent = document.getElementById('result-content');
        const resultContainer = document.getElementById('result-container');
        const copyBtn = document.getElementById('copy-btn');
        const copySuccess = document.getElementById('copy-success');

        // 当前选择的长度
        let currentLength = 'short';

        // 长度选择按钮点击事件
        lengthBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // 移除所有按钮的active状态
                lengthBtns.forEach(b => {
                    b.classList.remove('active', 'bg-primary', 'text-white');
                    b.classList.add('bg-neutral', 'text-gray-700');
                });
                
                // 设置当前按钮为active状态
                btn.classList.add('active', 'bg-primary', 'text-white');
                btn.classList.remove('bg-neutral', 'text-gray-700');
                
                // 更新当前选择的长度
                currentLength = btn.dataset.length;
            });
        });

        // 生成感谢语
        function generateThankYou() {
            const recipient = recipientSelect.value;
            const thankYouText = thankYouTemplates[recipient][currentLength];
            
            // 添加淡入效果
            resultContent.style.opacity = '0';
            setTimeout(() => {
                resultContent.textContent = thankYouText;
                resultContent.style.opacity = '1';
                // 显示复制按钮
                copyBtn.classList.remove('opacity-0', 'invisible');
                copyBtn.classList.add('opacity-100', 'visible');
            }, 300);
            
            // 添加容器动画效果
            resultContainer.classList.add('ring-2', 'ring-primary/30');
            setTimeout(() => {
                resultContainer.classList.remove('ring-2', 'ring-primary/30');
            }, 600);
        }

        // 生成按钮点击事件
        generateBtn.addEventListener('click', generateThankYou);

        // 复制功能
        copyBtn.addEventListener('click', () => {
            // 复制内容到剪贴板
            navigator.clipboard.writeText(resultContent.textContent)
                .then(() => {
                    // 显示成功提示
                    copyBtn.classList.add('opacity-0', 'invisible');
                    copyBtn.classList.remove('opacity-100', 'visible');
                    
                    copySuccess.classList.remove('opacity-0', 'invisible');
                    copySuccess.classList.add('opacity-100', 'visible');
                    
                    // 3秒后隐藏成功提示，显示复制按钮
                    setTimeout(() => {
                        copySuccess.classList.add('opacity-0', 'invisible');
                        copySuccess.classList.remove('opacity-100', 'visible');
                        
                        copyBtn.classList.remove('opacity-0', 'invisible');
                        copyBtn.classList.add('opacity-100', 'visible');
                    }, 3000);
                })
                .catch(err => {
                    console.error('无法复制内容: ', err);
                    alert('复制失败，请手动复制');
                });
        });

        // 初始生成一个感谢语
        window.addEventListener('load', () => {
            // 添加页面加载动画
            document.body.classList.add('opacity-0');
            setTimeout(() => {
                document.body.classList.remove('opacity-0');
                document.body.classList.add('transition-opacity', 'duration-500', 'opacity-100');
                generateThankYou();
            }, 300);
        });
    </script>
</body>
</html>
