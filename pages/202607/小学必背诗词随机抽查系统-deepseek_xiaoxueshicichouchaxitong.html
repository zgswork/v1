<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小学必背诗词随机抽查系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #2ecc71, #1abc9c, #16a085);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #333;
            overflow-x: hidden;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            padding: 25px;
            margin: 20px 0;
            position: relative;
            overflow: hidden;
        }
        
        .container::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            z-index: 0;
        }
        
        header {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
            z-index: 1;
        }
        
        h1 {
            color: #2c3e50;
            font-size: 2.2rem;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            position: relative;
            display: inline-block;
        }
        
        h1::after {
            content: "";
            display: block;
            width: 100%;
            height: 4px;
            background: linear-gradient(to right, #27ae60, #2ecc71);
            border-radius: 2px;
            margin-top: 8px;
        }
        
        .subtitle {
            color: #7f8c8d;
            font-size: 1rem;
            margin-top: 8px;
        }
        
        .poem-display {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px 15px;
            margin: 15px 0;
            min-height: 130px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            border: 2px dashed #2ecc71;
            position: relative;
            z-index: 1;
        }
        
        .poem-title {
            font-size: 2rem;
            font-weight: bold;
            color: #27ae60;
            text-align: center;
            transition: all 0.3s ease;
            min-height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
        }
        
        .rolling {
            animation: roll 0.2s infinite alternate;
        }
        
        @keyframes roll {
            from { transform: translateY(-5px); }
            to { transform: translateY(5px); }
        }
        
        .poem-author {
            font-size: 1.1rem;
            color: #7f8c8d;
            margin-top: 8px;
            font-style: italic;
        }
        
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin: 25px 0;
            position: relative;
            z-index: 1;
        }
        
        .btn {
            padding: 12px 24px;
            font-size: 1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            flex: 1;
            min-width: 140px;
        }
        
        .btn i {
            font-size: 1rem;
        }
        
        .btn-start {
            background: linear-gradient(to right, #27ae60, #2ecc71);
            color: white;
        }
        
        .btn-pause {
            background: linear-gradient(to right, #e67e22, #f39c12);
            color: white;
        }
        
        .btn-answer {
            background: linear-gradient(to right, #3498db, #2980b9);
            color: white;
        }
        
        .btn-voice {
            background: linear-gradient(to right, #9b59b6, #8e44ad);
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .counter {
            text-align: center;
            font-size: 1rem;
            color: #7f8c8d;
            margin: 12px 0;
            position: relative;
            z-index: 1;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background: white;
            width: 90%;
            max-width: 700px;
            max-height: 80vh;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            overflow-y: auto;
            position: relative;
            animation: modalAppear 0.4s ease;
        }
        
        @keyframes modalAppear {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .modal-title {
            font-size: 1.8rem;
            color: #27ae60;
            text-align: center;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 2px solid #eee;
        }
        
        .poem-content {
            font-size: 1.3rem;
            line-height: 2;
            text-align: center;
            white-space: pre-line;
            color: #2c3e50;
            font-family: 'KaiTi', '楷体', serif;
            padding: 15px 0;
        }
        
        .poem-content p {
            margin: 8px 0;
        }
        
        .btn-close {
            position: absolute;
            bottom: 15px;
            right: 15px;
            padding: 8px 20px;
            background: linear-gradient(to right, #e74c3c, #c0392b);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .btn-close:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        footer {
            text-align: center;
            color: white;
            padding: 15px;
            font-size: 0.9rem;
            position: relative;
            z-index: 1;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        
        footer a {
            color: #f1c40f;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        footer a:hover {
            color: #e67e22;
            text-decoration: underline;
        }
        
        .decoration {
            position: absolute;
            z-index: 0;
            font-size: 4rem;
            opacity: 0.05;
            color: #2c3e50;
            pointer-events: none;
        }
        
        .dec-1 { top: 15px; left: 20px; }
        .dec-2 { top: 80px; right: 40px; }
        .dec-3 { bottom: 120px; left: 30px; }
        .dec-4 { bottom: 60px; right: 50px; }
        
        .voice-control {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }
        
        .voice-toggle {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #f1f2f6;
            padding: 8px 15px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        
        .voice-toggle:hover {
            background: #dfe4ea;
        }
        
        .voice-status {
            font-size: 0.85rem;
            color: #7f8c8d;
            text-align: center;
        }
        
        .voice-alert {
            background: #ffebee;
            border-radius: 10px;
            padding: 10px;
            margin-top: 10px;
            font-size: 0.85rem;
            color: #c62828;
            text-align: center;
            display: none;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 15px;
                margin: 15px 0;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .poem-title {
                font-size: 1.6rem;
            }
            
            .btn {
                padding: 12px 15px;
                font-size: 0.95rem;
                min-width: 120px;
            }
            
            .controls {
                gap: 8px;
            }
            
            .poem-content {
                font-size: 1.2rem;
                line-height: 1.8;
            }
            
            .modal-title {
                font-size: 1.5rem;
            }
            
            .decoration {
                font-size: 3rem;
            }
        }
        
        @media (max-width: 480px) {
            .controls {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
                max-width: 300px;
            }
            
            h1 {
                font-size: 1.6rem;
            }
            
            .poem-title {
                font-size: 1.4rem;
            }
            
            .poem-author {
                font-size: 1rem;
            }
        }
        
        /* iOS 兼容性调整 */
        @supports (-webkit-touch-callout: none) {
            .btn {
                padding: 14px 24px;
            }
            
            .voice-toggle {
                padding: 10px 18px;
            }
        }
        
        /* 鸿蒙系统兼容 */
        @media (-harmony) {
            .btn {
                transform: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="decoration dec-1">诗</div>
    <div class="decoration dec-2">词</div>
    <div class="decoration dec-3">韵</div>
    <div class="decoration dec-4">律</div>
    
    <div class="container">
        <header>
            <h1>小学必背诗词随机抽查系统</h1>
            <p class="subtitle">涵盖小学1-6年级100首必背古诗词</p>
        </header>
        
        <div class="poem-display">
            <div class="poem-title" id="poemTitle">点击开始按钮随机抽查诗词</div>
            <div class="poem-author" id="poemAuthor"></div>
        </div>
        
        <div class="counter">
            已收录诗词: <span id="poemCount">100</span> 首
        </div>
        
        <div class="controls">
            <button class="btn btn-start" id="btnStart">
                <i class="fas fa-play"></i> 开始随机抽查
            </button>
            <button class="btn btn-pause" id="btnPause" disabled>
                <i class="fas fa-pause"></i> 暂停
            </button>
            <button class="btn btn-answer" id="btnAnswer" disabled>
                <i class="fas fa-book-open"></i> 查看诗词
            </button>
            <button class="btn btn-voice" id="btnVoice" disabled>
                <i class="fas fa-volume-up"></i> 朗读题目
            </button>
        </div>
        
        <div class="voice-control">
            <div class="voice-toggle" id="voiceToggle">
                <i class="fas fa-volume-up"></i>
                <span>语音播报已启用</span>
            </div>
            <div class="voice-status" id="voiceStatus">语音功能已准备就绪</div>
            <div class="voice-alert" id="voiceAlert">
                <i class="fas fa-exclamation-triangle"></i> 
                您的设备可能限制了语音功能，请确保在系统设置中允许浏览器使用麦克风权限
            </div>
        </div>
    </div>
    
    <div class="modal" id="answerModal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle"></div>
            <div class="poem-content" id="poemContent"></div>
            <button class="btn-close" id="btnClose">
                <i class="fas fa-times"></i> 关闭弹窗
            </button>
        </div>
    </div>
    
    <footer>
        <p>由 <span style="color:#f1c40f">哪儿都火</span> 用 <span style="color:#3498db">DeepSeek</span> 1分钟生成，<a href="#" id="tryLink">你也试试吧</a></p>
    </footer>

    <script>
        // 小学必背诗词数据库（100首）
        const poems = [
            { title: "静夜思", author: "唐·李白", content: "床前明月光，疑是地上霜。\n举头望明月，低头思故乡。" },
            { title: "春晓", author: "唐·孟浩然", content: "春眠不觉晓，处处闻啼鸟。\n夜来风雨声，花落知多少。" },
            { title: "咏鹅", author: "唐·骆宾王", content: "鹅，鹅，鹅，曲项向天歌。\n白毛浮绿水，红掌拨清波。" },
            { title: "登鹳雀楼", author: "唐·王之涣", content: "白日依山尽，黄河入海流。\n欲穷千里目，更上一层楼。" },
            { title: "悯农(其一)", author: "唐·李绅", content: "锄禾日当午，汗滴禾下土。\n谁知盘中餐，粒粒皆辛苦。" },
            { title: "悯农(其二)", author: "唐·李绅", content: "春种一粒粟，秋收万颗子。\n四海无闲田，农夫犹饿死。" },
            { title: "江南", author: "汉乐府", content: "江南可采莲，莲叶何田田。\n鱼戏莲叶间。\n鱼戏莲叶东，鱼戏莲叶西，\n鱼戏莲叶南，鱼戏莲叶北。" },
            { title: "风", author: "唐·李峤", content: "解落三秋叶，能开二月花。\n过江千尺浪，入竹万竿斜。" },
            { title: "咏柳", author: "唐·贺知章", content: "碧玉妆成一树高，万条垂下绿丝绦。\n不知细叶谁裁出，二月春风似剪刀。" },
            { title: "回乡偶书", author: "唐·贺知章", content: "少小离家老大回，乡音无改鬓毛衰。\n儿童相见不相识，笑问客从何处来。" },
            { title: "凉州词", author: "唐·王之涣", content: "黄河远上白云间，一片孤城万仞山。\n羌笛何须怨杨柳，春风不度玉门关。" },
            { title: "鹿柴", author: "唐·王维", content: "空山不见人，但闻人语响。\n返景入深林，复照青苔上。" },
            { title: "送元二使安西", author: "唐·王维", content: "渭城朝雨浥轻尘，客舍青青柳色新。\n劝君更尽一杯酒，西出阳关无故人。" },
            { title: "九月九日忆山东兄弟", author: "唐·王维", content: "独在异乡为异客，每逢佳节倍思亲。\n遥知兄弟登高处，遍插茱萸少一人。" },
            { title: "望庐山瀑布", author: "唐·李白", content: "日照香炉生紫烟，遥看瀑布挂前川。\n飞流直下三千尺，疑是银河落九天。" },
            { title: "赠汪伦", author: "唐·李白", content: "李白乘舟将欲行，忽闻岸上踏歌声。\n桃花潭水深千尺，不及汪伦送我情。" },
            { title: "黄鹤楼送孟浩然之广陵", author: "唐·李白", content: "故人西辞黄鹤楼，烟花三月下扬州。\n孤帆远影碧空尽，唯见长江天际流。" },
            { title: "早发白帝城", author: "唐·李白", content: "朝辞白帝彩云间，千里江陵一日还。\n两岸猿声啼不住，轻舟已过万重山。" },
            { title: "望天门山", author: "唐·李白", content: "天门中断楚江开，碧水东流至此回。\n两岸青山相对出，孤帆一片日边来。" },
            { title: "别董大", author: "唐·高适", content: "千里黄云白日曛，北风吹雁雪纷纷。\n莫愁前路无知己，天下谁人不识君？" },
            { title: "绝句", author: "唐·杜甫", content: "两个黄鹂鸣翠柳，一行白鹭上青天。\n窗含西岭千秋雪，门泊东吴万里船。" },
            { title: "春夜喜雨", author: "唐·杜甫", content: "好雨知时节，当春乃发生。\n随风潜入夜，润物细无声。\n野径云俱黑，江船火独明。\n晓看红湿处，花重锦官城。" },
            { title: "绝句", author: "唐·杜甫", content: "迟日江山丽，春风花草香。\n泥融飞燕子，沙暖睡鸳鸯。" },
            { title: "江畔独步寻花", author: "唐·杜甫", content: "黄师塔前江水东，春光懒困倚微风。\n桃花一簇开无主，可爱深红爱浅红？" },
            { title: "枫桥夜泊", author: "唐·张继", content: "月落乌啼霜满天，江枫渔火对愁眠。\n姑苏城外寒山寺，夜半钟声到客船。" },
            { title: "滁州西涧", author: "唐·韦应物", content: "独怜幽草涧边生，上有黄鹂深树鸣。\n春潮带雨晚来急，野渡无人舟自横。" },
            { title: "游子吟", author: "唐·孟郊", content: "慈母手中线，游子身上衣。\n临行密密缝，意恐迟迟归。\n谁言寸草心，报得三春晖。" },
            { title: "早春呈水部张十八员外", author: "唐·韩愈", content: "天街小雨润如酥，草色遥看近却无。\n最是一年春好处，绝胜烟柳满皇都。" },
            { title: "渔歌子", author: "唐·张志和", content: "西塞山前白鹭飞，桃花流水鳜鱼肥。\n青箬笠，绿蓑衣，斜风细雨不须归。" },
            { title: "塞下曲", author: "唐·卢纶", content: "月黑雁飞高，单于夜遁逃。\n欲将轻骑逐，大雪满弓刀。" },
            { title: "望洞庭", author: "唐·刘禹锡", content: "湖光秋月两相和，潭面无风镜未磨。\n遥望洞庭山水翠，白银盘里一青螺。" },
            { title: "浪淘沙", author: "唐·刘禹锡", content: "九曲黄河万里沙，浪淘风簸自天涯。\n如今直上银河去，同到牵牛织女家。" },
            { title: "赋得古原草送别", author: "唐·白居易", content: "离离原上草，一岁一枯荣。\n野火烧不尽，春风吹又生。\n远芳侵古道，晴翠接荒城。\n又送王孙去，萋萋满别情。" },
            { title: "池上", author: "唐·白居易", content: "小娃撑小艇，偷采白莲回。\n不解藏踪迹，浮萍一道开。" },
            { title: "忆江南", author: "唐·白居易", content: "江南好，风景旧曾谙。\n日出江花红胜火，春来江水绿如蓝。\n能不忆江南？" },
            { title: "小儿垂钓", author: "唐·胡令能", content: "蓬头稚子学垂纶，侧坐莓苔草映身。\n路人借问遥招手，怕得鱼惊不应人。" },
            { title: "山行", author: "唐·杜牧", content: "远上寒山石径斜，白云生处有人家。\n停车坐爱枫林晚，霜叶红于二月花。" },
            { title: "清明", author: "唐·杜牧", content: "清明时节雨纷纷，路上行人欲断魂。\n借问酒家何处有？牧童遥指杏花村。" },
            { title: "江南春", author: "唐·杜牧", content: "千里莺啼绿映红，水村山郭酒旗风。\n南朝四百八十寺，多少楼台烟雨中。" },
            { title: "蜂", author: "唐·罗隐", content: "不论平地与山尖，无限风光尽被占。\n采得百花成蜜后，为谁辛苦为谁甜？" },
            { title: "江上渔者", author: "宋·范仲淹", content: "江上往来人，但爱鲈鱼美。\n君看一叶舟，出没风波里。" },
            { title: "元日", author: "宋·王安石", content: "爆竹声中一岁除，春风送暖入屠苏。\n千门万户曈曈日，总把新桃换旧符。" },
            { title: "泊船瓜洲", author: "宋·王安石", content: "京口瓜洲一水间，钟山只隔数重山。\n春风又绿江南岸，明月何时照我还？" },
            { title: "书湖阴先生壁", author: "宋·王安石", content: "茅檐长扫净无苔，花木成畦手自栽。\n一水护田将绿绕，两山排闼送青来。" },
            { title: "六月二十七日望湖楼醉书", author: "宋·苏轼", content: "黑云翻墨未遮山，白雨跳珠乱入船。\n卷地风来忽吹散，望湖楼下水如天。" },
            { title: "饮湖上初晴后雨", author: "宋·苏轼", content: "水光潋滟晴方好，山色空蒙雨亦奇。\n欲把西湖比西子，淡妆浓抹总相宜。" },
            { title: "惠崇春江晚景", author: "宋·苏轼", content: "竹外桃花三两枝，春江水暖鸭先知。\n蒌蒿满地芦芽短，正是河豚欲上时。" },
            { title: "题西林壁", author: "宋·苏轼", content: "横看成岭侧成峰，远近高低各不同。\n不识庐山真面目，只缘身在此山中。" },
            { title: "夏日绝句", author: "宋·李清照", content: "生当作人杰，死亦为鬼雄。\n至今思项羽，不肯过江东。" },
            { title: "示儿", author: "宋·陆游", content: "死去元知万事空，但悲不见九州同。\n王师北定中原日，家祭无忘告乃翁。" },
            { title: "秋夜将晓出篱门迎凉有感", author: "宋·陆游", content: "三万里河东入海，五千仞岳上摩天。\n遗民泪尽胡尘里，南望王师又一年。" },
            { title: "四时田园杂兴(其一)", author: "宋·范成大", content: "昼出耘田夜绩麻，村庄儿女各当家。\n童孙未解供耕织，也傍桑阴学种瓜。" },
            { title: "四时田园杂兴(其二)", author: "宋·范成大", content: "梅子金黄杏子肥，麦花雪白菜花稀。\n日长篱落无人过，惟有蜻蜓蛱蝶飞。" },
            { title: "小池", author: "宋·杨万里", content: "泉眼无声惜细流，树阴照水爱晴柔。\n小荷才露尖尖角，早有蜻蜓立上头。" },
            { title: "晓出净慈寺送林子方", author: "宋·杨万里", content: "毕竟西湖六月中，风光不与四时同。\n接天莲叶无穷碧，映日荷花别样红。" },
            { title: "春日", author: "宋·朱熹", content: "胜日寻芳泗水滨，无边光景一时新。\n等闲识得东风面，万紫千红总是春。" },
            { title: "题临安邸", author: "宋·林升", content: "山外青山楼外楼，西湖歌舞几时休？\n暖风熏得游人醉，直把杭州作汴州。" },
            { title: "游园不值", author: "宋·叶绍翁", content: "应怜屐齿印苍苔，小扣柴扉久不开。\n春色满园关不住，一枝红杏出墙来。" },
            { title: "乡村四月", author: "宋·翁卷", content: "绿遍山原白满川，子规声里雨如烟。\n乡村四月闲人少，才了蚕桑又插田。" },
            { title: "墨梅", author: "元·王冕", content: "我家洗砚池头树，朵朵花开淡墨痕。\n不要人夸好颜色，只留清气满乾坤。" },
            { title: "石灰吟", author: "明·于谦", content: "千锤万凿出深山，烈火焚烧若等闲。\n粉骨碎身浑不怕，要留清白在人间。" },
            { title: "竹石", author: "清·郑燮", content: "咬定青山不放松，立根原在破岩中。\n千磨万击还坚劲，任尔东西南北风。" },
            { title: "所见", author: "清·袁枚", content: "牧童骑黄牛，歌声振林樾。\n意欲捕鸣蝉，忽然闭口立。" },
            { title: "村居", author: "清·高鼎", content: "草长莺飞二月天，拂堤杨柳醉春烟。\n儿童散学归来早，忙趁东风放纸鸢。" },
            { title: "己亥杂诗", author: "清·龚自珍", content: "九州生气恃风雷，万马齐喑究可哀。\n我劝天公重抖擞，不拘一格降人才。" },
            { title: "长歌行", author: "汉乐府", content: "青青园中葵，朝露待日晞。\n阳春布德泽，万物生光辉。\n常恐秋节至，焜黄华叶衰。\n百川东到海，何时复西归？\n少壮不努力，老大徒伤悲！" },
            { title: "七步诗", author: "三国·曹植", content: "煮豆燃豆萁，豆在釜中泣。\n本是同根生，相煎何太急？" },
            { title: "敕勒歌", author: "北朝民歌", content: "敕勒川，阴山下。\n天似穹庐，笼盖四野。\n天苍苍，野茫茫，\n风吹草低见牛羊。" },
            { title: "出塞", author: "唐·王昌龄", content: "秦时明月汉时关，万里长征人未还。\n但使龙城飞将在，不教胡马度阴山。" },
            { title: "芙蓉楼送辛渐", author: "唐·王昌龄", content: "寒雨连江夜入吴，平明送客楚山孤。\n洛阳亲友如相问，一片冰心在玉壶。" },
            { title: "古朗月行", author: "唐·李白", content: "小时不识月，呼作白玉盘。\n又疑瑶台镜，飞在青云端。\n仙人垂两足，桂树何团团。\n白兔捣药成，问言与谁餐？" },
            { title: "江雪", author: "唐·柳宗元", content: "千山鸟飞绝，万径人踪灭。\n孤舟蓑笠翁，独钓寒江雪。" },
            { title: "寻隐者不遇", author: "唐·贾岛", content: "松下问童子，言师采药去。\n只在此山中，云深不知处。" },
            { title: "画", author: "唐·王维", content: "远看山有色，近听水无声。\n春去花还在，人来鸟不惊。" },
            { title: "相思", author: "唐·王维", content: "红豆生南国，春来发几枝。\n愿君多采撷，此物最相思。" },
            { title: "鸟鸣涧", author: "唐·王维", content: "人闲桂花落，夜静春山空。\n月出惊山鸟，时鸣春涧中。" },
            { title: "夜宿山寺", author: "唐·李白", content: "危楼高百尺，手可摘星辰。\n不敢高声语，恐惊天上人。" },
            { title: "秋浦歌", author: "唐·李白", content: "白发三千丈，缘愁似个长。\n不知明镜里，何处得秋霜。" },
            { title: "赠花卿", author: "唐·杜甫", content: "锦城丝管日纷纷，半入江风半入云。\n此曲只应天上有，人间能得几回闻。" },
            { title: "逢雪宿芙蓉山主人", author: "唐·刘长卿", content: "日暮苍山远，天寒白屋贫。\n柴门闻犬吠，风雪夜归人。" },
            { title: "寒食", author: "唐·韩翃", content: "春城无处不飞花，寒食东风御柳斜。\n日暮汉宫传蜡烛，轻烟散入五侯家。" },
            { title: "竹枝词", author: "唐·刘禹锡", content: "杨柳青青江水平，闻郎江上唱歌声。\n东边日出西边雨，道是无晴却有晴。" },
            { title: "乌衣巷", author: "唐·刘禹锡", content: "朱雀桥边野草花，乌衣巷口夕阳斜。\n旧时王谢堂前燕，飞入寻常百姓家。" },
            { title: "秋夕", author: "唐·杜牧", content: "银烛秋光冷画屏，轻罗小扇扑流萤。\n天阶夜色凉如水，坐看牵牛织女星。" },
            { title: "乐游原", author: "唐·李商隐", content: "向晚意不适，驱车登古原。\n夕阳无限好，只是近黄昏。" },
            { title: "梅花", author: "宋·王安石", content: "墙角数枝梅，凌寒独自开。\n遥知不是雪，为有暗香来。" },
            { title: "三衢道中", author: "宋·曾几", content: "梅子黄时日日晴，小溪泛尽却山行。\n绿阴不减来时路，添得黄鹂四五声。" },
            { title: "舟夜书所见", author: "清·查慎行", content: "月黑见渔灯，孤光一点萤。\n微微风簇浪，散作满河星。" },
            { title: "题秋江独钓图", author: "清·王士祯", content: "一蓑一笠一扁舟，一丈丝纶一寸钩。\n一曲高歌一樽酒，一人独钓一江秋。" },
            { title: "论诗", author: "清·赵翼", content: "李杜诗篇万口传，至今已觉不新鲜。\n江山代有才人出，各领风骚数百年。" },
            { title: "春夜洛城闻笛", author: "唐·李白", content: "谁家玉笛暗飞声，散入春风满洛城。\n此夜曲中闻折柳，何人不起故园情。" },
            { title: "月夜忆舍弟", author: "唐·杜甫", content: "戍鼓断人行，边秋一雁声。\n露从今夜白，月是故乡明。\n有弟皆分散，无家问死生。\n寄书长不达，况乃未休兵。" },
            { title: "蜀相", author: "唐·杜甫", content: "丞相祠堂何处寻，锦官城外柏森森。\n映阶碧草自春色，隔叶黄鹂空好音。\n三顾频烦天下计，两朝开济老臣心。\n出师未捷身先死，长使英雄泪满襟。" },
            { title: "过故人庄", author: "唐·孟浩然", content: "故人具鸡黍，邀我至田家。\n绿树村边合，青山郭外斜。\n开轩面场圃，把酒话桑麻。\n待到重阳日，还来就菊花。" },
            { title: "送杜少府之任蜀州", author: "唐·王勃", content: "城阙辅三秦，风烟望五津。\n与君离别意，同是宦游人。\n海内存知己，天涯若比邻。\n无为在歧路，儿女共沾巾。" },
            { title: "望月怀远", author: "唐·张九龄", content: "海上生明月，天涯共此时。\n情人怨遥夜，竟夕起相思。\n灭烛怜光满，披衣觉露滋。\n不堪盈手赠，还寝梦佳期。" },
            { title: "春望", author: "唐·杜甫", content: "国破山河在，城春草木深。\n感时花溅泪，恨别鸟惊心。\n烽火连三月，家书抵万金。\n白头搔更短，浑欲不胜簪。" },
            { title: "钱塘湖春行", author: "唐·白居易", content: "孤山寺北贾亭西，水面初平云脚低。\n几处早莺争暖树，谁家新燕啄春泥。\n乱花渐欲迷人眼，浅草才能没马蹄。\n最爱湖东行不足，绿杨阴里白沙堤。" },
            { title: "使至塞上", author: "唐·王维", content: "单车欲问边，属国过居延。\n征蓬出汉塞，归雁入胡天。\n大漠孤烟直，长河落日圆。\n萧关逢候骑，都护在燕然。" },
            { title: "黄鹤楼", author: "唐·崔颢", content: "昔人已乘黄鹤去，此地空余黄鹤楼。\n黄鹤一去不复返，白云千载空悠悠。\n晴川历历汉阳树，芳草萋萋鹦鹉洲。\n日暮乡关何处是？烟波江上使人愁。" }
        ];

        // 获取DOM元素
        const poemTitle = document.getElementById('poemTitle');
        const poemAuthor = document.getElementById('poemAuthor');
        const btnStart = document.getElementById('btnStart');
        const btnPause = document.getElementById('btnPause');
        const btnAnswer = document.getElementById('btnAnswer');
        const btnVoice = document.getElementById('btnVoice');
        const answerModal = document.getElementById('answerModal');
        const modalTitle = document.getElementById('modalTitle');
        const poemContent = document.getElementById('poemContent');
        const btnClose = document.getElementById('btnClose');
        const voiceToggle = document.getElementById('voiceToggle');
        const voiceStatus = document.getElementById('voiceStatus');
        const voiceAlert = document.getElementById('voiceAlert');
        const tryLink = document.getElementById('tryLink');

        let currentPoemIndex = -1;
        let isRolling = false;
        let rollInterval;
        let voiceEnabled = true;
        let speechSupported = true;
        let firstInteraction = false;

        // 页面加载时检查语音支持
        window.onload = function() {
            if (!('speechSynthesis' in window)) {
                speechSupported = false;
                voiceEnabled = false;
                voiceStatus.textContent = "您的浏览器不支持语音合成功能";
                voiceStatus.style.color = "#c62828";
                voiceToggle.style.display = 'none';
                btnVoice.style.display = 'none';
            } else {
                // 初始化语音引擎
                initSpeechSynthesis();
            }
        };

        // 初始化语音合成
        function initSpeechSynthesis() {
            // 检查中文语音支持
            const voices = speechSynthesis.getVoices();
            const hasChineseVoice = voices.some(voice => voice.lang.startsWith('zh'));
            
            if (!hasChineseVoice) {
                voiceStatus.textContent = "未找到中文语音引擎，语音功能可能受限";
                voiceStatus.style.color = "#e65100";
            } else {
                voiceStatus.textContent = "语音功能已准备就绪";
                voiceStatus.style.color = "#7f8c8d";
            }
        }

        // 随机选择一首诗
        function getRandomPoem() {
            return Math.floor(Math.random() * poems.length);
        }

        // 开始滚动诗词标题
        function startRolling() {
            if (isRolling) return;
            
            isRolling = true;
            poemTitle.classList.add('rolling');
            btnStart.disabled = true;
            btnPause.disabled = false;
            btnAnswer.disabled = true;
            btnVoice.disabled = true;
            
            rollInterval = setInterval(() => {
                currentPoemIndex = getRandomPoem();
                poemTitle.textContent = poems[currentPoemIndex].title;
                poemAuthor.textContent = poems[currentPoemIndex].author;
            }, 100);
        }

        // 暂停滚动
        function pauseRolling() {
            if (!isRolling) return;
            
            isRolling = false;
            clearInterval(rollInterval);
            poemTitle.classList.remove('rolling');
            btnStart.disabled = false;
            btnPause.disabled = true;
            btnAnswer.disabled = false;
            btnVoice.disabled = false;
            
            // 暂停时语音播报
            if (voiceEnabled && speechSupported) {
                speakPoemTitle();
            }
        }

        // 语音播报诗词标题
        function speakPoemTitle() {
            if (!speechSupported || !voiceEnabled) return;
            
            // 确保用户已经与页面交互过（iOS要求）
            if (!firstInteraction) {
                voiceStatus.textContent = "请先点击页面任意位置激活语音功能";
                voiceStatus.style.color = "#e65100";
                voiceAlert.style.display = 'block';
                return;
            }
            
            try {
                // 停止当前正在进行的任何语音
                window.speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(poems[currentPoemIndex].title);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.9;
                utterance.pitch = 1.1;
                utterance.volume = 1;
                
                // 选择中文语音
                const voices = speechSynthesis.getVoices();
                const chineseVoices = voices.filter(voice => voice.lang.startsWith('zh'));
                if (chineseVoices.length > 0) {
                    utterance.voice = chineseVoices[0];
                }
                
                utterance.onstart = () => {
                    voiceStatus.textContent = "正在朗读题目...";
                    voiceStatus.style.color = "#2e7d32";
                };
                
                utterance.onend = () => {
                    voiceStatus.textContent = "语音功能已准备就绪";
                    voiceStatus.style.color = "#7f8c8d";
                };
                
                utterance.onerror = (event) => {
                    console.error('语音播报错误:', event.error);
                    voiceStatus.textContent = "语音播报失败: " + event.error;
                    voiceStatus.style.color = "#c62828";
                };
                
                window.speechSynthesis.speak(utterance);
            } catch (e) {
                console.error('语音播报失败:', e);
                voiceStatus.textContent = "语音播报失败: " + e.message;
                voiceStatus.style.color = "#c62828";
            }
        }

        // 显示诗词答案
        function showAnswer() {
            if (isRolling || currentPoemIndex === -1) return;
            
            modalTitle.textContent = poems[currentPoemIndex].title;
            poemContent.innerHTML = formatPoemContent(poems[currentPoemIndex].content);
            answerModal.style.display = 'flex';
        }

        // 格式化诗词内容
        function formatPoemContent(content) {
            return content.split('\n').map(line => {
                return `<p>${line}</p>`;
            }).join('');
        }

        // 关闭弹窗
        function closeModal() {
            answerModal.style.display = 'none';
        }

        // 切换语音功能
        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            const icon = voiceToggle.querySelector('i');
            const text = voiceToggle.querySelector('span');
            
            if (voiceEnabled) {
                icon.className = 'fas fa-volume-up';
                text.textContent = '语音播报已启用';
                voiceToggle.style.background = '#f1f2f6';
                voiceStatus.textContent = "语音功能已启用";
                voiceStatus.style.color = "#7f8c8d";
            } else {
                icon.className = 'fas fa-volume-mute';
                text.textContent = '语音播报已禁用';
                voiceToggle.style.background = '#e0e0e0';
                voiceStatus.textContent = "语音功能已禁用";
                voiceStatus.style.color = "#7f8c8d";
            }
        }

        // 事件监听
        btnStart.addEventListener('click', startRolling);
        btnPause.addEventListener('click', pauseRolling);
        btnAnswer.addEventListener('click', showAnswer);
        btnVoice.addEventListener('click', speakPoemTitle);
        btnClose.addEventListener('click', closeModal);
        voiceToggle.addEventListener('click', toggleVoice);
        tryLink.addEventListener('click', function(e) {
            e.preventDefault();
            alert('访问 https://deepseek.com 创建你自己的AI应用吧！');
        });

        // 用户第一次交互时激活语音功能
        document.body.addEventListener('click', function() {
            if (!firstInteraction && speechSupported) {
                firstInteraction = true;
                voiceStatus.textContent = "语音功能已激活";
                voiceStatus.style.color = "#2e7d32";
                voiceAlert.style.display = 'none';
                
                // 尝试预加载语音引擎
                if (speechSynthesis.getVoices().length === 0) {
                    speechSynthesis.addEventListener('voiceschanged', initSpeechSynthesis);
                }
            }
        });

        // 点击模态框外部关闭
        window.addEventListener('click', (e) => {
            if (e.target === answerModal) {
                closeModal();
            }
        });

        // 初始化显示一首诗
        currentPoemIndex = getRandomPoem();
        poemTitle.textContent = poems[currentPoemIndex].title;
        poemAuthor.textContent = poems[currentPoemIndex].author;
    </script>
