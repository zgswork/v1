<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown 在线编辑器</title>
    <style>
        :root {
            --primary-color: #FF4081; /* 亮粉色 */
            --secondary-color: #00E5FF; /* 亮青色 */
            --accent-color: #FFEB3B; /* 亮黄色 */
            --border-color: #F8BBD0;
            --bg-color: #FFF3E0;
            --text-color: #4A148C; /* 深紫色 */
            --card-bg: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Comic Sans MS", "Chalkboard SE", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            color: var(--text-color);
            background: linear-gradient(135deg, #FFDEE9 0%, #B5FFFC 100%); /* 糖果渐变 */
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* 顶部标题栏 */
        .app-header {
            background-color: transparent;
            border: none;
            padding: 20px 0 30px;
            text-align: center;
        }

        .app-header h1 {
            font-size: 36px;
            margin: 0 0 10px 0;
            font-weight: 800;
            color: #FF4081;
            text-shadow: 2px 2px 0px #FFEB3B;
            letter-spacing: 1px;
        }

        .app-header p {
            font-size: 16px;
            color: #7B1FA2;
            font-weight: 500;
        }

        /* 居中卡片容器 */
        .editor-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(255, 64, 129, 0.2);
            width: 100%;
            max-width: 1200px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 4px solid #B2EBF2;
        }

        /* 文件操作栏 */
        .file-actions {
            padding: 15px 20px;
            border-bottom: 2px dashed #F8BBD0;
            display: flex;
            gap: 12px;
            align-items: center;
            background-color: #FFFDE7;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 4px 6px rgba(255, 64, 129, 0.3);
            transition: transform 0.1s;
        }
        
        .btn-primary:hover {
            background-color: #F50057;
            transform: scale(1.05);
        }

        .btn-outline {
            background-color: white;
            color: #00BCD4;
            border: 2px solid #00E5FF;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            transition: transform 0.1s;
        }

        .btn-outline:hover {
            background-color: #E0F7FA;
            color: #0097A7;
            transform: scale(1.05);
        }

        /* 顶部工具栏 */
        .toolbar {
            background-color: #F3E5F5;
            border-bottom: 2px solid #E1BEE7;
            padding: 10px 15px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn-group {
            display: flex;
            gap: 4px;
            padding-right: 12px;
            border-right: 2px dashed #CE93D8;
            margin-right: 4px;
        }

        .btn-group:last-child {
            border-right: none;
        }

        button {
            background: white;
            border: 1px solid #E1BEE7;
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            color: #8E24AA;
            font-size: 14px;
            transition: all 0.2s;
            min-width: 30px;
            text-align: center;
            font-weight: 600;
        }

        button:hover {
            background-color: #FF80AB;
            color: white;
            border-color: #FF4081;
            transform: translateY(-2px);
        }

        /* 主体编辑区域 */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            height: 100%;
        }

        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0; 
        }

        .pane-header {
            display: none; 
        }

        #editor {
            flex: 1;
            width: 100%;
            border: none;
            border-right: 2px dashed #F8BBD0;
            padding: 30px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
            font-size: 15px;
            line-height: 1.7;
            resize: none;
            outline: none;
            background-color: #fff;
            color: #4A148C;
        }

        #preview {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            background-color: #FAFAFA;
            line-height: 1.7;
            color: #4A148C;
        }

        /* 底部版权 */
        .footer {
            text-align: center;
            padding: 20px;
            background-color: transparent;
            border-top: none;
            font-size: 12px;
            color: #7B1FA2;
            margin-top: 10px;
            font-weight: 600;
        }

        /* Markdown 预览样式 (多巴胺风格) */
        #preview h1, #preview h2, #preview h3 {
            margin-top: 24px;
            margin-bottom: 16px;
            font-weight: 700;
            line-height: 1.25;
            color: #D81B60;
        }
        #preview h1 { font-size: 2em; border-bottom: 2px solid #F8BBD0; padding-bottom: 0.3em; }
        #preview h2 { font-size: 1.5em; border-bottom: 2px solid #F8BBD0; padding-bottom: 0.3em; }
        #preview p { margin-bottom: 16px; }
        #preview code {
            padding: 0.2em 0.4em;
            margin: 0;
            font-size: 85%;
            background-color: #FCE4EC;
            color: #C2185B;
            border-radius: 6px;
        }
        #preview pre {
            padding: 16px;
            overflow: auto;
            font-size: 85%;
            line-height: 1.45;
            background-color: #E0F7FA;
            border-radius: 10px;
            margin-bottom: 16px;
            border: 1px solid #B2EBF2;
        }
        #preview pre code {
            background-color: transparent;
            color: #006064;
        }
        #preview blockquote {
            padding: 0 1em;
            color: #8E24AA;
            border-left: 0.25em solid #E1BEE7;
            margin: 0 0 16px 0;
            background-color: #F3E5F5;
            border-radius: 0 8px 8px 0;
        }
        #preview ul, #preview ol { padding-left: 2em; margin-bottom: 16px; }
        #preview img { max-width: 100%; box-sizing: content-box; background-color: #fff; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        #preview table {
            border-spacing: 0;
            border-collapse: collapse;
            margin-bottom: 16px;
            width: 100%;
        }
        #preview table th, #preview table td {
            padding: 6px 13px;
            border: 1px solid #E1BEE7;
        }
        #preview table tr:nth-child(2n) { background-color: #F3E5F5; }
        #preview table th { background-color: #E1BEE7; color: white; }
    </style>
</head>
<body>

    <!-- 标题栏 -->
    <header class="app-header">
        <h1>专业 Markdown 在线编辑器</h1>
        <p>为作家和开发人员提供强大而优雅的在线 Markdown 编辑体验</p>
    </header>

    <!-- 居中卡片 -->
    <div class="editor-card">
        
        <!-- 文件操作栏 -->
        <div class="file-actions">
            <button class="btn-primary" onclick="createNew()">新建文档</button>
            <button class="btn-primary" onclick="downloadMarkdown()">导出 .md</button>
            <button class="btn-outline" onclick="exportHTML()">导出 HTML</button>
            <button class="btn-outline" onclick="document.getElementById('file-input').click()">加载文件</button>
            <button class="btn-outline" onclick="toggleFullScreen()">全屏</button>
            <input type="file" id="file-input" style="display: none;" accept=".md,.txt" onchange="loadFile(this)">
        </div>

        <!-- 工具栏 -->
        <div class="toolbar">
            <div class="btn-group">
                <button onclick="undo()" title="撤销">↩</button>
                <button onclick="redo()" title="重做">↪</button>
            </div>
            <div class="btn-group">
                <button onclick="insertText('**', '**')" title="粗体" style="font-weight:bold">B</button>
                <button onclick="insertText('~~', '~~')" title="删除线" style="text-decoration: line-through">S</button>
                <button onclick="insertText('*', '*')" title="斜体" style="font-style:italic">I</button>
            </div>
            <div class="btn-group">
                <button onclick="insertHeader(1)" title="H1">H1</button>
                <button onclick="insertHeader(2)" title="H2">H2</button>
                <button onclick="insertHeader(3)" title="H3">H3</button>
            </div>
            <div class="btn-group">
                <button onclick="insertBlock('- ', '')" title="无序列表">• List</button>
                <button onclick="insertBlock('1. ', '')" title="有序列表">1. List</button>
                <button onclick="insertBlock('- [ ] ', '')" title="任务列表">☑ Task</button>
            </div>
            <div class="btn-group">
                <button onclick="insertLink()" title="链接">🔗</button>
                <button onclick="insertImage()" title="图片">🖼️</button>
                <button onclick="insertText('`', '`')" title="行内代码">&lt;/&gt;</button>
                <button onclick="insertBlock('```\n', '\n```')" title="代码块">Code</button>
                <button onclick="insertTable()" title="表格">📅</button>
                <button onclick="insertDate()" title="日期时间">🕒</button>
            </div>
            <div class="btn-group" style="border:none; margin-left: auto;">
                 <!-- 右侧功能预留，如预览切换等 -->
                 <button onclick="clearEditor()" title="清空">�️</button>
            </div>
        </div>

        <!-- 主体区域 -->
        <div class="main-container">
            <!-- 左侧编辑 -->
            <div class="pane">
                <textarea id="editor" placeholder="在此输入 Markdown 文本...">
# 欢迎使用 MarkdownPro

## 功能特点

- **实时预览**: 支持实时Markdown预览
- **语法高亮**: 完整的语法高亮支持
- **多种导出**: 支持HTML等格式导出
- **响应式设计**: 完美适配各种设备
- **多语言支持**: 中英文界面切换

## 快速开始

开始编写您的Markdown文档吧！
                </textarea>
            </div>
            <!-- 右侧预览 -->
            <div class="pane">
                <div id="preview"></div>
            </div>
        </div>
    </div>

    <!-- 底部 -->
    <div class="footer">
        © 2025 Markdown 在线编辑器 | 公众号：小李时光
    </div>

    <!-- 引入 Marked.js 解析库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');

        // 初始化
        function init() {
            // 配置 marked
            marked.setOptions({
                breaks: true, // 启用换行符
                gfm: true     // 启用 GitHub 风格
            });

            // 监听输入
            editor.addEventListener('input', updatePreview);
            
            // 初始渲染
            updatePreview();
        }

        // 更新预览
        function updatePreview() {
            const markdownText = editor.value;
            try {
                const htmlContent = marked.parse(markdownText);
                preview.innerHTML = htmlContent;
            } catch (e) {
                console.error('Markdown 解析错误:', e);
            }
        }

        // 插入文本工具函数
        function insertText(before, after) {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const text = editor.value;
            const selectedText = text.substring(start, end);
            
            const newText = text.substring(0, start) + before + selectedText + after + text.substring(end);
            
            editor.value = newText;
            editor.focus();
            
            // 恢复选区或光标位置
            const newCursorPos = start + before.length + selectedText.length + after.length;
            if (selectedText.length === 0) {
                 // 如果没选中文本，光标放在中间
                editor.setSelectionRange(start + before.length, start + before.length);
            } else {
                editor.setSelectionRange(newCursorPos, newCursorPos);
            }
            
            updatePreview();
        }

        // 插入块级元素（如引用、列表）
        function insertBlock(prefix, suffix) {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const text = editor.value;
            
            // 找到当前行的起始位置
            let lineStart = text.lastIndexOf('\n', start - 1) + 1;
            
            const beforeText = text.substring(0, lineStart);
            const selectedText = text.substring(lineStart, end);
            const afterText = text.substring(end);
            
            const newText = beforeText + prefix + selectedText + suffix + afterText;
            
            editor.value = newText;
            editor.focus();
            updatePreview();
        }

        // 插入标题
        function insertHeader(level) {
            const hashes = '#'.repeat(level) + ' ';
            insertBlock(hashes, '');
        }

        // 插入链接
        function insertLink() {
            const url = prompt("请输入链接地址:", "https://");
            if (url) {
                insertText("[链接文本](", url + ")");
            }
        }

        // 插入图片
        function insertImage() {
            const url = prompt("请输入图片地址:", "https://");
            if (url) {
                insertText("![图片描述](", url + ")");
            }
        }

        // 下载 Markdown 文件
        function downloadMarkdown() {
            let filename = prompt("请输入文件名:", "document");
            if (filename === null) return; // 用户取消
            if (!filename) filename = "document"; // 空名默认

            // 自动补全 .md 后缀
            if (!filename.toLowerCase().endsWith('.md')) {
                filename += '.md';
            }

            const text = editor.value;
            const blob = new Blob([text], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // 导出 HTML 文件
        function exportHTML() {
            const style = document.querySelector('style').innerHTML;
            const content = preview.innerHTML;
            
            const htmlTemplate = `
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Markdown 导出文档</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; 
            line-height: 1.6; 
            padding: 80px; 
            margin: 0; 
            color: #2c3e50;
            background-color: #f0f4f8; /* 灰色背景 */
            width: 100%;
            box-sizing: border-box;
            min-height: 100vh;
        }
        ${style}
        /* 覆盖部分编辑器特定样式 */
        #preview { 
            padding: 50px; 
            overflow: visible; 
            width: 100%; 
            max-width: 100%; 
            background-color: #fff; /* 白色内容卡片 */
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            border-radius: 8px;
        }
        /* 确保内容本身也利用全屏宽度，但保留适当的可读性（可选）*/
        #preview > * { max-width: 100%; }
    </style>
</head>
<body>
    <div id="preview">
        ${content}
    </div>
    <div style="margin-top: 60px; text-align: center; font-size: 12px; color: #95a5a6; border-top: 1px solid #e1e4e8; padding-top: 20px;">
        © 2025 Markdown 在线编辑器 | 公众号：小李时光
    </div>
</body>
</html>`;

            const blob = new Blob([htmlTemplate], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'exported-document.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // 启动
        if (typeof marked !== 'undefined') {
            init();
        } else {
            // 如果 CDN 加载慢，等待 onload
            window.onload = init;
        }

        // 新建文档
        function createNew() {
            if(confirm('确定要新建文档吗？当前未保存的内容将丢失。')) {
                editor.value = '';
                updatePreview();
                editor.focus();
            }
        }

        // 加载文件
        function loadFile(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                editor.value = e.target.result;
                updatePreview();
                // 清空 input 避免无法重复选择同一文件
                input.value = '';
            };
            reader.readAsText(file);
        }

        // 全屏切换
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // 插入表格
        function insertTable() {
            const tableTemplate = 
`| 列 1 | 列 2 | 列 3 |
| :--- | :---: | ---: |
| 文本 | 文本 | 文本 |
| 文本 | 文本 | 文本 |
`;
            insertBlock(tableTemplate, '');
        }

        // 插入日期
        function insertDate() {
            const now = new Date();
            const dateStr = now.toLocaleDateString() + ' ' + now.toLocaleTimeString();
            insertText(dateStr, '');
        }

        // 简单的撤销/重做支持 (利用浏览器原生能力)
        function undo() {
            document.execCommand('undo');
        }

        function redo() {
            document.execCommand('redo');
        }

        function clearEditor() {
             if(confirm('确定要清空编辑器吗？')) {
                editor.value = '';
                updatePreview();
                editor.focus();
            }
        }
    </script>
</body>
</html>
