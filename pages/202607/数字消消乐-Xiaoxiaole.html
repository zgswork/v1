<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字消消乐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            padding: 20px;
        }
        
        .game-container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            padding: 25px;
        }
        
        header {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            color: #2575fc;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .stats-container {
            display: flex;
            justify-content: space-between;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .stat-box {
            text-align: center;
            flex: 1;
            padding: 10px;
        }
        
        .stat-label {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
        }
        
        .game-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 6px;
            background-color: #2575fc;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.2);
        }
        
        .cell {
            aspect-ratio: 1/1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.8rem;
            font-weight: 700;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, background-color 0.2s;
            user-select: none;
        }
        
        .cell:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        
        .cell.selected {
            transform: scale(0.95);
            background-color: #ffd166;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.2);
        }
        
        .cell.removing {
            animation: removeAnimation 0.4s forwards;
        }
        
        @keyframes removeAnimation {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(0); opacity: 0; }
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        
        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        #start-btn {
            background: linear-gradient(to right, #00b09b, #96c93d);
            color: white;
            flex: 1;
        }
        
        #start-btn:hover {
            background: linear-gradient(to right, #009a86, #83b42d);
            transform: translateY(-3px);
        }
        
        #reset-btn {
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            color: white;
            flex: 1;
        }
        
        #reset-btn:hover {
            background: linear-gradient(to right, #e03a5f, #e04427);
            transform: translateY(-3px);
        }
        
        .instructions {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-top: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }
        
        .instructions h2 {
            color: #2575fc;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }
        
        .instructions ul {
            padding-left: 20px;
        }
        
        .instructions li {
            margin-bottom: 10px;
            line-height: 1.5;
        }
        
        .game-message {
            text-align: center;
            font-size: 1.4rem;
            font-weight: 700;
            color: #ff416c;
            min-height: 30px;
            margin-top: 15px;
            transition: all 0.3s;
        }
        
        @media (max-width: 768px) {
            .game-board {
                grid-template-columns: repeat(6, 1fr);
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .stat-value {
                font-size: 1.6rem;
            }
            
            .cell {
                font-size: 1.4rem;
            }
        }
        
        @media (max-width: 480px) {
            .game-board {
                grid-template-columns: repeat(5, 1fr);
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .stat-label {
                font-size: 0.9rem;
            }
            
            .stat-value {
                font-size: 1.4rem;
            }
            
            button {
                padding: 12px 20px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <header>
            <h1>数字消消乐</h1>
            <p>匹配相邻相同数字，获得高分！</p>
        </header>
        
        <div class="stats-container">
            <div class="stat-box">
                <div class="stat-label">分数</div>
                <div id="score" class="stat-value">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">剩余时间</div>
                <div id="timer" class="stat-value">60</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">移动次数</div>
                <div id="moves" class="stat-value">0</div>
            </div>
        </div>
        
        <div class="game-board" id="game-board"></div>
        
        <div class="game-message" id="message"></div>
        
        <div class="controls">
            <button id="start-btn">开始游戏</button>
            <button id="reset-btn">重新开始</button>
        </div>
        
        <div class="instructions">
            <h2>游戏规则：</h2>
            <ul>
                <li>点击两个相邻（上下左右）的相同数字，它们会被消除</li>
                <li>消除后，上方的数字会下落填补空缺</li>
                <li>每消除一对数字得10分，连续消除获得额外分数</li>
                <li>游戏时间60秒，时间用完游戏结束</li>
                <li>尽可能获得高分！</li>
            </ul>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameBoard = document.getElementById('game-board');
            const scoreDisplay = document.getElementById('score');
            const timerDisplay = document.getElementById('timer');
            const movesDisplay = document.getElementById('moves');
            const messageDisplay = document.getElementById('message');
            const startBtn = document.getElementById('start-btn');
            const resetBtn = document.getElementById('reset-btn');
            
            const BOARD_SIZE = 8;
            const COLORS = {
                1: '#FF6B6B',
                2: '#4ECDC4',
                3: '#FFD166',
                4: '#118AB2',
                5: '#6A4C93'
            };
            
            let board = [];
            let score = 0;
            let timeLeft = 60;
            let moves = 0;
            let timer;
            let gameActive = false;
            let firstSelected = null;
            let comboCount = 0;
            let lastMoveTime = 0;
            
            // 初始化游戏板
            function initBoard() {
                gameBoard.innerHTML = '';
                board = [];
                
                for (let i = 0; i < BOARD_SIZE; i++) {
                    board[i] = [];
                    for (let j = 0; j < BOARD_SIZE; j++) {
                        const value = Math.floor(Math.random() * 5) + 1;
                        board[i][j] = value;
                        
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.dataset.row = i;
                        cell.dataset.col = j;
                        cell.textContent = value;
                        cell.style.backgroundColor = COLORS[value];
                        
                        cell.addEventListener('click', handleCellClick);
                        gameBoard.appendChild(cell);
                    }
                }
            }
            
            // 处理格子点击
            function handleCellClick(e) {
                if (!gameActive) return;
                
                const row = parseInt(e.target.dataset.row);
                const col = parseInt(e.target.dataset.col);
                
                // 如果没有选中第一个格子
                if (firstSelected === null) {
                    firstSelected = { row, col, element: e.target };
                    e.target.classList.add('selected');
                    return;
                }
                
                // 如果点击了同一个格子
                if (firstSelected.row === row && firstSelected.col === col) {
                    e.target.classList.remove('selected');
                    firstSelected = null;
                    return;
                }
                
                // 检查是否相邻
                const isAdjacent = 
                    (Math.abs(firstSelected.row - row) === 1 && firstSelected.col === col) ||
                    (Math.abs(firstSelected.col - col) === 1 && firstSelected.row === row);
                
                // 检查数字是否相同
                const sameValue = board[firstSelected.row][firstSelected.col] === board[row][col];
                
                if (isAdjacent && sameValue) {
                    // 计算这次移动的时间差（用于连击）
                    const currentTime = Date.now();
                    const timeDiff = currentTime - lastMoveTime;
                    
                    // 如果是短时间内连续消除，增加连击数
                    if (timeDiff < 2000) {
                        comboCount++;
                        showMessage(`连击 x${comboCount}！`);
                    } else {
                        comboCount = 1;
                    }
                    
                    lastMoveTime = currentTime;
                    
                    // 计算得分（连击有加成）
                    const points = 10 + (comboCount - 1) * 5;
                    updateScore(points);
                    moves++;
                    movesDisplay.textContent = moves;
                    
                    // 移除格子
                    removeCells([
                        { row: firstSelected.row, col: firstSelected.col },
                        { row, col }
                    ]);
                    
                    // 重置选择
                    firstSelected.element.classList.remove('selected');
                    firstSelected = null;
                } else {
                    // 重置选择
                    firstSelected.element.classList.remove('selected');
                    firstSelected = { row, col, element: e.target };
                    e.target.classList.add('selected');
                }
            }
            
            // 移除格子
            function removeCells(cells) {
                cells.forEach(cell => {
                    // 标记为移除状态
                    const cellElement = document.querySelector(`.cell[data-row="${cell.row}"][data-col="${cell.col}"]`);
                    cellElement.classList.add('removing');
                    
                    // 从数组中移除
                    board[cell.row][cell.col] = 0;
                });
                
                // 动画结束后重新填充
                setTimeout(() => {
                    fillEmptySpaces();
                    renderBoard();
                }, 400);
            }
            
            // 填充空格
            function fillEmptySpaces() {
                // 从下往上处理每一列
                for (let col = 0; col < BOARD_SIZE; col++) {
                    let emptySpaces = 0;
                    
                    // 从底部向上扫描
                    for (let row = BOARD_SIZE - 1; row >= 0; row--) {
                        if (board[row][col] === 0) {
                            emptySpaces++;
                        } else if (emptySpaces > 0) {
                            // 移动数字到空位
                            board[row + emptySpaces][col] = board[row][col];
                            board[row][col] = 0;
                        }
                    }
                    
                    // 在顶部生成新数字
                    for (let i = 0; i < emptySpaces; i++) {
                        board[i][col] = Math.floor(Math.random() * 5) + 1;
                    }
                }
            }
            
            // 渲染游戏板
            function renderBoard() {
                const cells = document.querySelectorAll('.cell');
                
                cells.forEach(cell => {
                    const row = parseInt(cell.dataset.row);
                    const col = parseInt(cell.dataset.col);
                    
                    cell.textContent = board[row][col];
                    cell.style.backgroundColor = COLORS[board[row][col]];
                    cell.classList.remove('removing', 'selected');
                });
            }
            
            // 更新分数
            function updateScore(points) {
                score += points;
                scoreDisplay.textContent = score;
            }
            
            // 显示消息
            function showMessage(msg) {
                messageDisplay.textContent = msg;
                messageDisplay.style.opacity = 1;
                
                setTimeout(() => {
                    messageDisplay.style.opacity = 0;
                }, 1500);
            }
            
            // 开始游戏
            function startGame() {
                if (gameActive) return;
                
                initBoard();
                score = 0;
                timeLeft = 60;
                moves = 0;
                comboCount = 0;
                gameActive = true;
                firstSelected = null;
                
                scoreDisplay.textContent = '0';
                timerDisplay.textContent = '60';
                movesDisplay.textContent = '0';
                messageDisplay.textContent = '';
                
                // 启动计时器
                timer = setInterval(() => {
                    timeLeft--;
                    timerDisplay.textContent = timeLeft;
                    
                    if (timeLeft <= 0) {
                        endGame();
                    }
                }, 1000);
            }
            
            // 结束游戏
            function endGame() {
                gameActive = false;
                clearInterval(timer);
                showMessage(`游戏结束！最终得分: ${score}`);
            }
            
            // 重新开始游戏
            function resetGame() {
                clearInterval(timer);
                startGame();
            }
            
            // 事件监听
            startBtn.addEventListener('click', startGame);
            resetBtn.addEventListener('click', resetGame);
            
            // 初始化
            initBoard();
        });
    </script>
</body>
</html>
