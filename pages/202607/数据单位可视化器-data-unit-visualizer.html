            box-sizing: border-box;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);

        .input-group {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .input-field {
            flex: 1;
            min-width: 200px;
        }

        .input-field label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .input-field input, .input-field select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .input-field input:focus, .input-field select:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }

            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 120px;
        }

        .convert-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .results-section {
            display: none;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .comparison-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .comparison-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border-left: 5px solid #4facfe;
            transition: all 0.3s ease;
        }

        .comparison-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        .comparison-card h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .comparison-card .icon {
            font-size: 1.5rem;
        }

        .comparison-value {
            font-size: 2rem;
            font-weight: 700;
            color: #4facfe;
            margin-bottom: 10px;
        }

        .comparison-description {
            color: #666;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .visual-bar {
            background: #e9ecef;
            height: 20px;
            border-radius: 10px;
            margin: 15px 0;
            overflow: hidden;
            position: relative;
        }

        .visual-fill {
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            height: 100%;
            border-radius: 10px;
            transition: width 1s ease;
            position: relative;
        }

        .visual-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.3) 50%, transparent 100%);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            border-left: 5px solid #c33;

            margin-bottom: 20px;
            border-left: 5px solid #4facfe;
        }

        .unit-info h3 {

            margin-bottom: 10px;
        }

            font-size: clamp(0.9rem, 2vw, 1.1rem);

        function formatNumber(num) {
            if (num >= 1e12) return (num / 1e12).toFixed(2) + '万亿';
            if (num >= 1e8) return (num / 1e8).toFixed(2) + '亿';
            if (num >= 1e4) return (num / 1e4).toFixed(2) + '万';
            if (num >= 1000) return (num / 1000).toFixed(2) + '千';
            if (num < 1 && num > 0) return num.toFixed(4);
            return Math.round(num).toString();
        }

        function formatBytes(bytes) {
            const units = ['B', 'KB', 'MB', 'GB', 'TB', 'PB'];
            let size = bytes;
            let unitIndex = 0;
            
            while (size >= 1024 && unitIndex < units.length - 1) {
                size /= 1024;
                unitIndex++;
            }
            
            return `${size.toFixed(2)} ${units[unitIndex]}`;
        }

                    </h3>
                    <div class="comparison-value">${formatNumber(ratio)}</div>
                    <div class="comparison-description">${cloud.description}</div>
                    <div class="visual-bar">
                        <div class="visual-fill" style="width: ${Math.min(percentage, 100)}%"></div>
                    </div>
                    <div class="responsive-text">
                        ${ratio >= 1 ? 
                            `相当于 <strong>${formatNumber(ratio)}</strong> 个${cloud.name.replace(/[☁️📧📱📂💾]/g, '')}容量` :
                            `占用 <strong>${(ratio * 100).toFixed(2)}%</strong> 的${cloud.name.replace(/[☁️📧📱📂💾]/g, '')}空间`
                        }
                    </div>
                </div>
            `;
        }

        function createTimeCard(timeComp, time, totalBytes) {
            const timeStr = time < 60 ? 
                `${time.toFixed(1)}秒` : 
                time < 3600 ? 
                    `${(time/60).toFixed(1)}分钟` : 
                    time < 86400 ?
                        `${(time/3600).toFixed(1)}小时` :
                        `${(time/86400).toFixed(1)}天`;
            
            const percentage = Math.min((time / 3600) * 100, 100); // 以1小时为100%
            
            return `
                <div class="comparison-card">
                    <h3>
                        <span class="icon">${timeComp.icon}</span>
                        ${timeComp.name}
                    </h3>
                    <div class="comparison-value">${timeStr}</div>
                    <div class="comparison-description">${timeComp.description}</div>
                    <div class="visual-bar">
                        <div class="visual-fill" style="width: ${percentage}%"></div>
                    </div>
                    <div class="responsive-text">
                        需要 <strong>${timeStr}</strong> 完成传输
                    </div>
                </div>
            `;
        }

        function createPhysicalCard(physical, ratio, totalBytes) {
            const totalCapacity = physical.capacity * physical.unitSize;
            const percentage = Math.min((totalBytes / totalCapacity) * 100, 100);
            
            return `
                <div class="comparison-card">
                    <h3>
                        <span class="icon">${physical.icon}</span>
                        ${physical.name}
                    </h3>
                    <div class="comparison-value">${formatNumber(ratio)}</div>
                    <div class="comparison-description">${physical.description}</div>
                    <div class="visual-bar">
                        <div class="visual-fill" style="width: ${percentage}%"></div>
                    </div>
                    <div class="responsive-text">
                        相当于 <strong>${formatNumber(ratio)}</strong> 个${physical.name.replace(/[📚🏟️🏫🏢]/g, '')}的数据量
                    </div>
                </div>
            `;
        }

        function createStorageCard(storage, ratio, totalBytes) {
            const percentage = Math.min(ratio * 100, 100);
            
            return `
                <div class="comparison-card">
                    <h3>
                        <span class="icon">${storage.icon}</span>
                        ${storage.name}
                    </h3>
                    <div class="comparison-value">${formatNumber(ratio)}</div>
                    <div class="comparison-description">${storage.description}</div>
                    <div class="visual-bar">
                        <div class="visual-fill" style="width: ${Math.min(percentage, 100)}%"></div>
                    </div>
                    <div class="responsive-text">
                        ${ratio >= 1 ? 
                            `相当于 <strong>${formatNumber(ratio)}</strong> 个${storage.name.replace(/[💿📀💽💾💻📱💳🖥️]/g, '')}` :
                            `只占 <strong>${(ratio * 100).toFixed(2)}%</strong> 个${storage.name.replace(/[💿📀💽💾💻📱💳🖥️]/g, '')}`
                        }
                    </div>
                </div>
            `;
        }

        function visualizeData() {
            hideError();
            
            const value = parseFloat(document.getElementById('dataValue').value);
            const unit = document.getElementById('dataUnit').value;
            
            if (isNaN(value) || value < 0) {
                showError('请输入有效的正数！');
                return;
            }
            
            if (value === 0) {
                showError('数据大小不能为零！');
                return;
            }
            
            // 转换为字节
            const totalBytes = value * UNITS[unit];
            
            if (totalBytes > Number.MAX_SAFE_INTEGER) {
                showError('输入的数值过大，请输入较小的数值！');
                return;
            }
            
            // 显示转换信息
            const conversionInfo = document.getElementById('conversionInfo');
            conversionInfo.innerHTML = `
                <p><strong>原始数据：</strong>${value} ${unit}</p>
                <p><strong>字节数：</strong>${formatBytes(totalBytes)}</p>
                <p><strong>科学计数法：</strong>${totalBytes.toExponential(2)} 字节</p>
            `;
            
            // 生成比较卡片
            const comparisonGrid = document.getElementById('comparisonGrid');
            let cardsHTML = '';
            
            // 添加文件类型比较
            COMPARISONS.forEach(comparison => {
                const count = totalBytes / comparison.unitSize;
                if (count >= 0.01) { // 只显示大于0.01的比较
                    cardsHTML += createComparisonCard(comparison, count, totalBytes);
                }
            });
            
            // 添加存储设备比较
            STORAGE_COMPARISONS.forEach(storage => {
                const ratio = totalBytes / storage.capacity;
                if (ratio >= 0.001 || ratio <= 1000) { // 显示合理范围内的比较
                    cardsHTML += createStorageCard(storage, ratio, totalBytes);
                }
            });
            
            // 添加时间比较
            TIME_COMPARISONS.forEach(timeComp => {
                const time = totalBytes / timeComp.speed;
                if (time >= 0.1 && time <= 86400 * 30) { // 0.1秒到30天
                    cardsHTML += createTimeCard(timeComp, time, totalBytes);
                }
            });
            
            // 添加物理世界比较
            PHYSICAL_COMPARISONS.forEach(physical => {
                const totalCapacity = physical.capacity * physical.unitSize;
                const ratio = totalBytes / totalCapacity;
                if (ratio >= 0.001 && ratio <= 1000) {
                    cardsHTML += createPhysicalCard(physical, ratio, totalBytes);
                }
            });
            
            // 添加云服务比较
            CLOUD_COMPARISONS.forEach(cloud => {
                const ratio = totalBytes / cloud.freeStorage;
                if (ratio >= 0.001 && ratio <= 1000) {
                    cardsHTML += createCloudCard(cloud, ratio, totalBytes);
                }
            });
            
            comparisonGrid.innerHTML = cardsHTML;
            
            // 显示结果
            document.getElementById('results').style.display = 'block';
            
            // 滚动到结果区域
            document.getElementById('results').scrollIntoView({ 
                behavior: 'smooth',
                block: 'start'
            });
        }

        // 回车键触发转换
        document.getElementById('dataValue').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                visualizeData();
            }
        });

        // 页面加载时的示例
        window.addEventListener('load', function() {
            document.getElementById('dataValue').value = '1';
            document.getElementById('dataUnit').value = 'GB';
        });

        // 联系我们模态框功能
        function openContactModal() {
            document.getElementById('contactModal').style.display = 'block';
        }

        function closeContactModal() {
            document.getElementById('contactModal').style.display = 'none';
        }

        // 点击模态框外部关闭
        window.onclick = function(event) {
            const modal = document.getElementById('contactModal');
            if (event.target === modal) {
                closeContactModal();
            }
        }

        // ESC键关闭模态框
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeContactModal();
            }
        });
    </script>
</body>
</html>
