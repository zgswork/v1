<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>樱花在线画板 / Sakura Drawing Board</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff0f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><path fill="%23ffb6c1" opacity="0.2" d="M30,50 Q50,30 70,50 Q50,70 30,50"/></svg>');
            background-size: 100px 100px;
        }
        h1 {
            color: #d6336c;
            margin: 20px 0 20px 40px;
            text-shadow: 1px 1px 3px rgba(214, 51, 108, 0.3);
            font-size: 2.2em;
            position: relative;
            display: inline-block;
            align-self: flex-start;
            padding-left: 20px;
        }
        h1:before, h1:after {
            content: "🌸";
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
        }
        h1:before {
            left: -40px;
        }
        h1:after {
            right: -40px;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(214, 51, 108, 0.15);
            width: 90%;
            max-width: 800px;
            border: 2px solid #ffb6c1;
            margin-bottom: 30px;
        }
        .canvas-container {
            position: relative;
            margin-bottom: 20px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 3px 15px rgba(214, 51, 108, 0.1);
            background: white;
            border: 2px solid #ffb6c1;
        }
        canvas {
            display: block;
            background-color: white;
            cursor: crosshair;
            width: 100%;
            height: 500px;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
            justify-content: center;
        }
        .control-group {
            display: flex;
            align-items: center;
            background: #fff5f9;
            padding: 8px 15px;
            border-radius: 50px;
            border: 1px solid #ffd1dc;
        }
        .color-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .color-option {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s;
        }
        .color-option:hover {
            transform: scale(1.2);
        }
        .color-option.selected {
            border-color: #333;
            transform: scale(1.1);
        }
        label {
            margin-right: 8px;
            font-weight: bold;
            color: #d6336c;
            white-space: nowrap;
        }
        input[type="color"] {
            width: 40px;
            height: 40px;
            border: 2px solid #ffb6c1;
            border-radius: 50%;
            cursor: pointer;
            padding: 0;
        }
        input[type="range"] {
            width: 100px;
            cursor: pointer;
            accent-color: #d6336c;
        }
        button {
            padding: 10px 25px;
            background-color: #d6336c;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.3s;
            box-shadow: 0 3px 8px rgba(214, 51, 108, 0.3);
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        button:hover {
            background-color: #c2255c;
            transform: translateY(-3px);
            box-shadow: 0 5px 12px rgba(214, 51, 108, 0.4);
        }
        button:active {
            transform: translateY(1px);
        }
        #sizeValue {
            min-width: 25px;
            text-align: center;
            color: #d6336c;
            font-weight: bold;
            font-size: 1.1em;
        }
        .author-info {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #d6336c;
            padding: 12px 20px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 50px;
            border: 1px solid #ffd1dc;
            box-shadow: 0 2px 10px rgba(214, 51, 108, 0.1);
        }
        .author-info a {
            color: #d6336c;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.2s;
        }
        .author-info a:hover {
            text-decoration: underline;
            color: #a81c4b;
        }
        .sakura {
            position: fixed;
            top: -10%;
            z-index: -1;
            animation: fall linear infinite;
        }
        @keyframes fall {
            to {
                transform: translateY(110vh);
            }
        }
        .language-switcher {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            gap: 10px;
        }
        .lang-btn {
            padding: 8px 15px;
            background-color: rgba(214, 51, 108, 0.8);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .lang-btn:hover {
            background-color: rgba(194, 37, 92, 0.9);
        }
        .lang-btn.active {
            background-color: rgba(194, 37, 92, 1);
            box-shadow: 0 0 0 2px white;
        }
    </style>
</head>
<body>
    <!-- 语言切换按钮 -->
    <div class="language-switcher">
        <button id="langZh" class="lang-btn active">简体</button>
        <button id="langZhHant" class="lang-btn">繁體</button>
        <button id="langJa" class="lang-btn">日本語</button>
        <button id="langEn" class="lang-btn">English</button>
    </div>

    <!-- 樱花飘落效果 -->
    <div id="sakura-container"></div>

    <div class="container">
        <h1 id="appTitle">樱花在线画板</h1>
        
        <div class="controls">
            <div class="control-group">
                <label id="colorLabel">颜色</label>
                <input type="color" id="color" value="#d6336c">
            </div>
            
            <div class="color-options">
                <div class="color-option selected" style="background-color: #d6336c;" data-color="#d6336c"></div>
                <div class="color-option" style="background-color: #ff1493;" data-color="#ff1493"></div>
                <div class="color-option" style="background-color: #ff69b4;" data-color="#ff69b4"></div>
                <div class="color-option" style="background-color: #ffb6c1;" data-color="#ffb6c1"></div>
                <div class="color-option" style="background-color: #ff6347;" data-color="#ff6347"></div>
                <div class="color-option" style="background-color: #ffa500;" data-color="#ffa500"></div>
                <div class="color-option" style="background-color: #ffd700;" data-color="#ffd700"></div>
                <div class="color-option" style="background-color: #32cd32;" data-color="#32cd32"></div>
                <div class="color-option" style="background-color: #1e90ff;" data-color="#1e90ff"></div>
                <div class="color-option" style="background-color: #9370db;" data-color="#9370db"></div>
                <div class="color-option" style="background-color: #000000;" data-color="#000000"></div>
                <div class="color-option" style="background-color: #ffffff; border: 1px solid #ccc;" data-color="#ffffff"></div>
            </div>
            
            <div class="control-group">
                <label id="brushLabel">笔刷</label>
                <input type="range" id="size" min="1" max="50" value="5">
                <span id="sizeValue">5</span>
            </div>
            
            <button id="clear">🧹 <span id="clearText">清除</span></button>
            <button id="save">💾 <span id="saveText">保存</span></button>
        </div>
        
        <div class="canvas-container">
            <canvas id="canvas"></canvas>
        </div>
    </div>
    
    <div class="author-info">
        <p id="authorInfo">🌸 开发者: 文璧 | 联系邮箱: <a href="/cdn-cgi/l/email-protection#16242021232122272f21235667673875797b"><span class="__cf_email__" data-cfemail="3b090d0c0e0c0f0a020c0e7b4a4a15585456">[email&#160;protected]</span></a> 🌸</p>
        <p id="copyright">© 2025 樱花在线画板 - 所有权利保留</p>
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 多语言支持
        const translations = {
            'zh': {
                title: '樱花在线画板',
                color: '颜色',
                brush: '笔刷',
                clear: '清除',
                save: '保存',
                author: '🌸 开发者: 文璧 | 联系邮箱: ',
                copyright: '© 2025 樱花在线画板 - 所有权利保留'
            },
            'zh-hant': {
                title: '櫻花在線畫板',
                color: '顏色',
                brush: '畫筆',
                clear: '清除',
                save: '保存',
                author: '🌸 開發者: 文璧 | 聯繫郵箱: ',
                copyright: '© 2025 櫻花在線畫板 - 版權所有'
            },
            'ja': {
                title: '桜のお絵かきボード',
                color: '色',
                brush: 'ブラシ',
                clear: '消去',
                save: '保存',
                author: '🌸 開発者: 文璧 | メール: ',
                copyright: '© 2025 桜のお絵かきボード - 無断転載を禁じます'
            },
            'en': {
                title: 'Sakura Drawing Board',
                color: 'Color',
                brush: 'Brush',
                clear: 'Clear',
                save: 'Save',
                author: '🌸 Developer: Wen Bi | Email: ',
                copyright: '© 2025 Sakura Drawing Board - All Rights Reserved'
            }
        };

        let currentLang = 'zh';
        const langBtns = {
            'zh': document.getElementById('langZh'),
            'zh-hant': document.getElementById('langZhHant'),
            'ja': document.getElementById('langJa'),
            'en': document.getElementById('langEn')
        };

        // 设置语言按钮点击事件
        Object.entries(langBtns).forEach(([lang, btn]) => {
            btn.addEventListener('click', () => {
                currentLang = lang;
                updateLanguage();
                updateActiveButton();
            });
        });

        function updateActiveButton() {
            Object.values(langBtns).forEach(btn => btn.classList.remove('active'));
            langBtns[currentLang].classList.add('active');
        }

        function updateLanguage() {
            document.getElementById('appTitle').textContent = translations[currentLang].title;
            document.getElementById('colorLabel').textContent = translations[currentLang].color;
            document.getElementById('brushLabel').textContent = translations[currentLang].brush;
            document.getElementById('clearText').textContent = translations[currentLang].clear;
            document.getElementById('saveText').textContent = translations[currentLang].save;
            document.getElementById('authorInfo').innerHTML = translations[currentLang].author + 
                '<a href="mailto:2675741975@qq.com">2675741975@qq.com</a> 🌸';
            document.getElementById('copyright').textContent = translations[currentLang].copyright;
        }

        // 樱花飘落效果
        function createSakura() {
            const sakura = document.createElement('div');
            sakura.className = 'sakura';
            sakura.innerHTML = '🌸';
            
            // 随机属性
            const size = Math.random() * 20 + 10;
            const left = Math.random() * 100;
            const animationDuration = Math.random() * 10 + 10;
            const delay = Math.random() * 5;
            const opacity = Math.random() * 0.5 + 0.3;
            
            sakura.style.left = `${left}%`;
            sakura.style.fontSize = `${size}px`;
            sakura.style.animationDuration = `${animationDuration}s`;
            sakura.style.animationDelay = `${delay}s`;
            sakura.style.opacity = opacity;
            
            document.getElementById('sakura-container').appendChild(sakura);
            
            // 移除已经落下的樱花
            setTimeout(() => {
                sakura.remove();
            }, animationDuration * 1000);
        }
        
        // 每隔一段时间创建新的樱花
        setInterval(createSakura, 300);
        
        // 获取画布和上下文
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // 设置画布大小
        function resizeCanvas() {
            const container = document.querySelector('.canvas-container');
            canvas.width = container.offsetWidth;
            canvas.height = 500;
            
            // 确保画布背景为白色
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        
        // 初始化变量
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        
        // 颜色和大小选择器
        const colorPicker = document.getElementById('color');
        const sizePicker = document.getElementById('size');
        const sizeValue = document.getElementById('sizeValue');
        const clearBtn = document.getElementById('clear');
        const saveBtn = document.getElementById('save');
        const colorOptions = document.querySelectorAll('.color-option');
        
        // 调整画布大小
        window.addEventListener('load', () => {
            resizeCanvas();
            
            // 确保初始背景为白色
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        });
        window.addEventListener('resize', resizeCanvas);
        
        // 开始绘画
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            [lastX, lastY] = [e.offsetX, e.offsetY];
        });
        
        // 绘画中
        canvas.addEventListener('mousemove', draw);
        
        // 结束绘画
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseout', () => isDrawing = false);
        
        // 绘画函数
        function draw(e) {
            if (!isDrawing) return;
            
            ctx.strokeStyle = colorPicker.value;
            ctx.lineWidth = sizePicker.value;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.stroke();
            
            [lastX, lastY] = [e.offsetX, e.offsetY];
        }
        
        // 更新笔刷大小显示
        sizePicker.addEventListener('input', () => {
            sizeValue.textContent = sizePicker.value;
        });
        
        // 清除画布
        clearBtn.addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // 清除后重新设置白色背景
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        });
        
        // 保存图片 - 确保背景为白色
        saveBtn.addEventListener('click', () => {
            // 创建临时canvas确保背景为白色
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            
            // 填充白色背景
            tempCtx.fillStyle = 'white';
            tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
            
            // 绘制原始内容
            tempCtx.drawImage(canvas, 0, 0);
            
            // 根据语言设置文件名
            let filename = 'drawing';
            if (currentLang === 'zh') filename = '樱花画板作品';
            else if (currentLang === 'zh-hant') filename = '櫻花畫板作品';
            else if (currentLang === 'ja') filename = '桜の絵';
            else if (currentLang === 'en') filename = 'sakura-drawing';
            
            // 保存图片
            const link = document.createElement('a');
            link.download = `${filename}.png`;
            link.href = tempCanvas.toDataURL('image/png');
            link.click();
        });
        
        // 颜色选项点击事件
        colorOptions.forEach(option => {
            option.addEventListener('click', () => {
                // 移除所有选中状态
                colorOptions.forEach(opt => opt.classList.remove('selected'));
                // 添加当前选中状态
                option.classList.add('selected');
                // 设置颜色选择器值
                const color = option.getAttribute('data-color');
                colorPicker.value = color;
            });
        });
        
        // 颜色选择器变化时更新选中的颜色选项
        colorPicker.addEventListener('input', () => {
            const currentColor = colorPicker.value.toLowerCase();
            colorOptions.forEach(option => {
                const optionColor = option.getAttribute('data-color');
                option.classList.toggle('selected', optionColor === currentColor);
            });
        });
        
        // 触摸设备支持
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const offsetX = touch.clientX - rect.left;
            const offsetY = touch.clientY - rect.top;
            
            const mouseEvent = new MouseEvent('mousedown', {
                clientX: touch.clientX,
                clientY: touch.clientY,
                offsetX: offsetX,
                offsetY: offsetY
            });
            canvas.dispatchEvent(mouseEvent);
        });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const offsetX = touch.clientX - rect.left;
            const offsetY = touch.clientY - rect.top;
            
            const mouseEvent = new MouseEvent('mousemove', {
                clientX: touch.clientX,
                clientY: touch.clientY,
                offsetX: offsetX,
                offsetY: offsetY
            });
            canvas.dispatchEvent(mouseEvent);
        });
        
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            const mouseEvent = new MouseEvent('mouseup');
            canvas.dispatchEvent(mouseEvent);
        });
    </script>
</body>
</html>
