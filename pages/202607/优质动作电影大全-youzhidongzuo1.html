        const recommendBtn = document.getElementById('recommend-btn');
        const changeBtn = document.getElementById('change-btn');
        const downloadBtn = document.getElementById('download-btn');
        const modal = document.getElementById('download-modal');
        const closeBtn = document.querySelector('.close');
        const placeholder = document.querySelector('.placeholder');
        const movieInfo = document.querySelector('.movie-info');
        const movieTitle = document.querySelector('.movie-title');
        const movieCountry = document.querySelector('.movie-country');
        const movieCast = document.querySelector('.movie-cast');
        const movieDescription = document.querySelector('.movie-description');
        const stars = document.querySelector('.stars');
        const ratingText = document.querySelector('.rating-text');
        const movieReason = document.querySelector('.movie-reason');

        let currentMovieIndex = -1;
        let previousMovieIndex = -1;

        function getRandomMovieIndex() {
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * movies.length);
            } while (randomIndex === previousMovieIndex);
            previousMovieIndex = currentMovieIndex;
            return randomIndex;
        }

        function displayMovie(index) {
            const movie = movies[index];
            
            movieTitle.textContent = movie.title;
            movieCountry.textContent = `国家: ${movie.country}`;
            movieCast.textContent = `主演: ${movie.cast}`;
            movieDescription.textContent = movie.description;
            
            // Calculate stars based on rating (5 stars for 10 points)
            const starCount = Math.round(movie.rating / 2);
            stars.innerHTML = '★'.repeat(starCount) + '☆'.repeat(5 - starCount);
            ratingText.textContent = `豆瓣评分: ${movie.rating}`;
            
            movieReason.textContent = `推荐理由: ${movie.reason}`;
            
            placeholder.style.display = 'none';
            movieInfo.classList.add('active');
            recommendBtn.style.display = 'none';
            changeBtn.style.display = 'block';
        }

        recommendBtn.addEventListener('click', () => {
            currentMovieIndex = getRandomMovieIndex();
            displayMovie(currentMovieIndex);
        });

        changeBtn.addEventListener('click', () => {
            currentMovieIndex = getRandomMovieIndex();
            displayMovie(currentMovieIndex);
        });

        // 下载按钮点击事件
        downloadBtn.addEventListener('click', () => {
            modal.style.display = 'block';
        });

        // 关闭按钮点击事件
        closeBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        // 点击模态框外部关闭
        window.addEventListener('click', (event) => {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });
