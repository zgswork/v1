                description: "凯文葛罗夫是苏格兰最受欢迎的免费博物馆，收藏有艺术品、自然历史展品和兵器盔甲，建筑本身也是维多利亚时期的杰作。",
                address: "Argyle St, Glasgow G3 8AG, UK",
                transport: "从爱丁堡乘火车到Glasgow Central站",
                ticket: "免费",
                opening: "10:00-17:00（周五、六延长至20:00）"
            }
        ];
        
        // 获取DOM元素
        const generateBtn = document.getElementById('generate-btn');
        const changeBtn = document.getElementById('change-btn');
        const guideDisplay = document.getElementById('guide-display');
        const downloadBtn = document.getElementById('download-btn');
        const modal = document.getElementById('download-modal');
        const closeBtn = document.querySelector('.close');
        
        // 存储已显示景点的索引
        let displayedIndices = [];
        
        // 生成随机景点
        function generateRandomAttraction() {
            // 如果所有景点都已显示过，重置记录
            if (displayedIndices.length >= attractions.length) {
                displayedIndices = [];
            }
            
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * attractions.length);
            } while (displayedIndices.includes(randomIndex));
            
            displayedIndices.push(randomIndex);
            return attractions[randomIndex];
        }
        
        // 显示景点攻略
        function displayAttraction(attraction) {
            guideDisplay.innerHTML = `
                <div class="guide-item">
                    <h2 class="guide-title">${attraction.name}</h2>
                </div>
                <div class="guide-item">
                    <p><span class="guide-label">景点介绍：</span>${attraction.description}</p>
                </div>
                <div class="guide-item">
                    <p><span class="guide-label">地址：</span>${attraction.address}</p>
                </div>
                <div class="guide-item">
                    <p><span class="guide-label">交通：</span>${attraction.transport}</p>
                </div>
                <div class="guide-item">
                    <p><span class="guide-label">门票：</span>${attraction.ticket}</p>
                </div>
                <div class="guide-item">
                    <p><span class="guide-label">开放时间：</span>${attraction.opening}</p>
                </div>
            `;
        }
        
        // 按钮事件监听
        generateBtn.addEventListener('click', function() {
            const attraction = generateRandomAttraction();
            displayAttraction(attraction);
            changeBtn.disabled = false;
        });
        
        changeBtn.addEventListener('click', function() {
            const attraction = generateRandomAttraction();
            displayAttraction(attraction);
        });
        
        // 下载按钮事件监听
        downloadBtn.addEventListener('click', function() {
            modal.style.display = 'block';
        });
        
        // 关闭弹窗
        closeBtn.addEventListener('click', function() {
            modal.style.display = 'none';
        });
        
        // 点击弹窗外部关闭
        window.addEventListener('click', function(event) {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
