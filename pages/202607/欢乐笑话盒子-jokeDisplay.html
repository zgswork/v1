<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢乐笑话盒子</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --accent: #4895ef;
            --light: #f8f9fa;
            --dark: #212529;
            --success: #4cc9f0;
            --warning: #f72585;
            --card-bg: rgba(255, 255, 255, 0.95);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4361ee, #3a0ca3);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--dark);
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            padding: 25px;
            text-align: center;
            position: relative;
        }
        
        .header-content {
            position: relative;
            z-index: 2;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .decor {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }
        
        .decor i {
            position: absolute;
            color: rgba(255, 255, 255, 0.1);
            font-size: 3rem;
            animation: float 15s infinite linear;
        }
        
        .decor i:nth-child(1) { top: 10%; left: 5%; animation-delay: 0s; }
        .decor i:nth-child(2) { top: 25%; left: 80%; animation-delay: -2s; }
        .decor i:nth-child(3) { top: 65%; left: 15%; animation-delay: -4s; }
        .decor i:nth-child(4) { top: 40%; left: 50%; animation-delay: -6s; }
        .decor i:nth-child(5) { top: 75%; left: 70%; animation-delay: -8s; }
        
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-100px) rotate(360deg); }
        }
        
        .content {
            padding: 30px;
        }
        
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .filter-section {
            background: #f1f3ff;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
        }
        
        .filter-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .filter-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .filter-btn {
            background: white;
            border: 2px solid #e0e0e0;
            padding: 8px 15px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .filter-btn:hover, .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        
        .joke-display {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 25px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            position: relative;
            overflow: hidden;
            border: 1px dashed #e0e0ff;
            transition: all 0.4s ease;
        }
        
        .joke-display.loading {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        .joke-text {
            font-size: 1.4rem;
            line-height: 1.6;
            margin-bottom: 20px;
            position: relative;
            z-index: 2;
            transition: opacity 0.3s ease;
        }
        
        .joke-category {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-top: 15px;
        }
        
        .joke-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .action-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            background: #f0f3ff;
            color: var(--primary);
        }
        
        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .action-btn.liked {
            background: var(--warning);
            color: white;
        }
        
        .action-btn.shared {
            background: #4ade80;
            color: white;
        }
        
        .history-section {
            background: #f1f3ff;
            border-radius: 15px;
            padding: 20px;
            margin-top: 25px;
        }
        
        .history-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .history-list {
            max-height: 200px;
            overflow-y: auto;
        }
        
        .history-item {
            padding: 12px 15px;
            background: white;
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 4px solid var(--primary);
        }
        
        .history-item:hover {
            transform: translateX(5px);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }
        
        .history-item .category {
            font-size: 0.8rem;
            background: var(--accent);
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 5px;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 15px rgba(0, 0, 0, 0.1);
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
            flex: 1;
        }
        
        .btn-secondary {
            background: var(--light);
            color: var(--dark);
            border: 1px solid #e0e0e0;
            flex: 1;
        }
        
        .btn-small {
            padding: 8px 15px;
            font-size: 0.9rem;
        }
        
        .counter {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            background: #f0f3ff;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin: 0 10px;
        }
        
        .emoji {
            font-size: 1.8rem;
            position: absolute;
            opacity: 0.1;
            z-index: 1;
        }
        
        .emoji-1 { top: 20px; left: 20px; }
        .emoji-2 { bottom: 20px; right: 20px; }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #6c757d;
            font-size: 0.9rem;
            border-top: 1px solid #eee;
        }
        
        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .joke-text {
                font-size: 1.2rem;
            }
            
            .btn {
                width: 100%;
            }
            
            .counter {
                margin: 10px 0;
                width: 100%;
            }
        }
        
        @media (max-width: 480px) {
            .content {
                padding: 20px;
            }
            
            .joke-display {
                padding: 20px;
            }
            
            .joke-text {
                font-size: 1.1rem;
            }
            
            .filter-options {
                flex-direction: column;
            }
            
            .filter-btn {
                width: 100%;
            }
        }
        
        /* Animation for joke text */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="decor">
                <i class="fa-solid fa-face-laugh"></i>
                <i class="fa-solid fa-face-grin-tears"></i>
                <i class="fa-solid fa-face-grin-squint"></i>
                <i class="fa-solid fa-face-laugh-beam"></i>
                <i class="fa-solid fa-face-grin-stars"></i>
            </div>
            <div class="header-content">
                <h1>欢乐笑话盒子</h1>
                <p class="subtitle">每日一笑，烦恼全消！精选各类幽默笑话，点亮您的一天</p>
            </div>
        </header>
        
        <div class="content">
            <div class="filter-section">
                <h2 class="filter-title"><i class="fa-solid fa-filter"></i> 笑话分类</h2>
                <div class="filter-options">
                    <div class="filter-btn active" data-category="all">全部</div>
                    <div class="filter-btn" data-category="programmer">程序员</div>
                    <div class="filter-btn" data-category="animal">动物</div>
                    <div class="filter-btn" data-category="life">生活</div>
                    <div class="filter-btn" data-category="kids">儿童</div>
                </div>
            </div>
            
            <div class="joke-display" id="jokeDisplay">
                <div class="emoji emoji-1">😂</div>
                <div class="emoji emoji-2">🤣</div>
                <div class="joke-text">点击下方按钮，开启欢乐时光！</div>
                <div class="joke-category">准备就绪</div>
                
                <div class="joke-actions">
                    <div class="action-btn" id="likeBtn" title="收藏笑话">
                        <i class="fa-regular fa-heart"></i>
                    </div>
                    <div class="action-btn shared" id="shareBtn" title="分享笑话">
                        <i class="fa-solid fa-share-nodes"></i>
                    </div>
                </div>
            </div>
            
            <div class="controls">
                <button class="btn btn-secondary" id="prevBtn">
                    <i class="fa-solid fa-arrow-left"></i> 上一个
                </button>
                
                <div class="counter">
                    <i class="fa-solid fa-laugh"></i>
                    <span id="counter">0/0</span>
                </div>
                
                <button class="btn btn-primary" id="nextBtn">
                    下一个 <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
            
            <div class="history-section">
                <h2 class="history-title"><i class="fa-solid fa-clock-rotate-left"></i> 历史记录</h2>
                <div class="history-list" id="historyList">
                    <!-- 历史记录将通过JavaScript动态添加 -->
                    <div class="history-empty">您还没有查看过任何笑话</div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>欢乐笑话盒子 &copy; 2023 - 让生活充满笑声</p>
            <div class="stats">
                <div class="stat-item">
                    <i class="fa-solid fa-laugh"></i>
                    <span id="totalJokes">0</span> 笑话
                </div>
                <div class="stat-item">
                    <i class="fa-solid fa-heart"></i>
                    <span id="likedCount">0</span> 收藏
                </div>
                <div class="stat-item">
                    <i class="fa-solid fa-share"></i>
                    <span id="sharedCount">0</span> 分享
                </div>
            </div>
        </footer>
    </div>

    <script>
        // 笑话数据库（按类别分类）
        const jokes = {
            all: [
                { text: "为什么程序员分不清万圣节和圣诞节？因为 Oct 31 == Dec 25！", category: "programmer" },
                { text: "程序员最讨厌的购物网站是什么？404页面！", category: "programmer" },
                { text: "为什么程序员总是把冰箱门开着？他们在等返回结果！", category: "programmer" },
                { text: "程序员去餐厅点菜：'我要一份栈和一份队列'，服务员说：'您是要先入先出还是后入先出？'", category: "programmer" },
                { text: "为什么程序员不喜欢户外活动？因为有太多bug！", category: "programmer" },
                { text: "为什么恐龙灭绝了？因为它们找不到自己的电话号码本！", category: "animal" },
                { text: "企鹅为什么不会飞？因为它们把飞行执照忘在南极了！", category: "animal" },
                { text: "为什么海星永远不会感到孤独？因为它们总是有很多'星'朋友！", category: "animal" },
                { text: "为什么猫咪不喜欢玩扑克？因为它们总是被抓住'抓'牌！", category: "animal" },
                { text: "为什么数学书很伤心？因为它有太多问题！", category: "kids" },
                { text: "为什么自行车不能自己站起来？因为它太累了！", category: "kids" },
                { text: "为什么番茄会变红？因为它看到了沙拉酱！", category: "kids" },
                { text: "为什么咖啡杯会生气？因为它被搅拌得太厉害了！", category: "life" },
                { text: "为什么面包去健身房？因为它想变成'硬'汉！", category: "life" },
                { text: "为什么时钟很聪明？因为它总是知道'时'机！", category: "life" }
            ],
            programmer: [
                { text: "为什么程序员分不清万圣节和圣诞节？因为 Oct 31 == Dec 25！", category: "programmer" },
                { text: "程序员最讨厌的购物网站是什么？404页面！", category: "programmer" },
                { text: "为什么程序员总是把冰箱门开着？他们在等返回结果！", category: "programmer" },
                { text: "程序员去餐厅点菜：'我要一份栈和一份队列'，服务员说：'您是要先入先出还是后入先出？'", category: "programmer" },
                { text: "为什么程序员不喜欢户外活动？因为有太多bug！", category: "programmer" }
            ],
            animal: [
                { text: "为什么恐龙灭绝了？因为它们找不到自己的电话号码本！", category: "animal" },
                { text: "企鹅为什么不会飞？因为它们把飞行执照忘在南极了！", category: "animal" },
                { text: "为什么海星永远不会感到孤独？因为它们总是有很多'星'朋友！", category: "animal" },
                { text: "为什么猫咪不喜欢玩扑克？因为它们总是被抓住'抓'牌！", category: "animal" }
            ],
            kids: [
                { text: "为什么数学书很伤心？因为它有太多问题！", category: "kids" },
                { text: "为什么自行车不能自己站起来？因为它太累了！", category: "kids" },
                { text: "为什么番茄会变红？因为它看到了沙拉酱！", category: "kids" }
            ],
            life: [
                { text: "为什么咖啡杯会生气？因为它被搅拌得太厉害了！", category: "life" },
                { text: "为什么面包去健身房？因为它想变成'硬'汉！", category: "life" },
                { text: "为什么时钟很聪明？因为它总是知道'时'机！", category: "life" }
            ]
        };

        // DOM元素
        const jokeDisplay = document.getElementById('jokeDisplay');
        const jokeText = document.querySelector('.joke-text');
        const jokeCategory = document.querySelector('.joke-category');
        const nextBtn = document.getElementById('nextBtn');
        const prevBtn = document.getElementById('prevBtn');
        const likeBtn = document.getElementById('likeBtn');
        const shareBtn = document.getElementById('shareBtn');
        const counter = document.getElementById('counter');
        const historyList = document.getElementById('historyList');
        const totalJokes = document.getElementById('totalJokes');
        const likedCount = document.getElementById('likedCount');
        const sharedCount = document.getElementById('sharedCount');
        const filterBtns = document.querySelectorAll('.filter-btn');
        
        // 状态变量
        let currentJokeIndex = -1;
        let currentCategory = 'all';
        let jokeHistory = [];
        let likedJokes = [];
        let sharedJokes = [];
        
        // 初始化页面
        function init() {
            // 设置统计信息
            totalJokes.textContent = jokes.all.length;
            likedCount.textContent = likedJokes.length;
            sharedCount.textContent = sharedJokes.length;
            
            // 设置分类过滤事件
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentCategory = btn.dataset.category;
                    showRandomJoke();
                });
            });
            
            // 设置按钮事件
            nextBtn.addEventListener('click', showRandomJoke);
            prevBtn.addEventListener('click', showPreviousJoke);
            likeBtn.addEventListener('click', toggleLike);
            shareBtn.addEventListener('click', shareJoke);
            
            // 初始显示一个笑话
            showRandomJoke();
        }
        
        // 显示随机笑话
        function showRandomJoke() {
            // 显示加载状态
            jokeDisplay.classList.add('loading');
            jokeText.textContent = '';
            jokeCategory.textContent = '';
            
            // 模拟加载延迟
            setTimeout(() => {
                jokeDisplay.classList.remove('loading');
                
                // 获取当前类别的笑话
                const categoryJokes = jokes[currentCategory];
                
                // 如果没有笑话
                if (categoryJokes.length === 0) {
                    jokeText.textContent = "该分类暂时没有笑话，请选择其他分类";
                    jokeCategory.textContent = "无内容";
                    counter.textContent = "0/0";
                    return;
                }
                
                // 随机选择一个笑话（排除当前显示的）
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * categoryJokes.length);
                } while (newIndex === currentJokeIndex && categoryJokes.length > 1);
                
                currentJokeIndex = newIndex;
                const joke = categoryJokes[currentJokeIndex];
                
                // 更新显示
                jokeText.textContent = joke.text;
                jokeCategory.textContent = getCategoryName(joke.category);
                
                // 添加动画效果
                jokeText.classList.remove('fade-in');
                void jokeText.offsetWidth; // 触发重绘
                jokeText.classList.add('fade-in');
                
                // 更新计数器
                counter.textContent = `${currentJokeIndex + 1}/${categoryJokes.length}`;
                
                // 添加到历史记录
                addToHistory(joke);
                
                // 更新收藏按钮状态
                updateLikeButton(joke);
            }, 800);
        }
        
        // 显示上一个笑话
        function showPreviousJoke() {
            if (jokeHistory.length < 2) return;
            
            // 从历史记录中获取上一个笑话
            const prevJoke = jokeHistory[jokeHistory.length - 2];
            
            // 更新显示
            jokeText.textContent = prevJoke.text;
            jokeCategory.textContent = getCategoryName(prevJoke.category);
            
            // 添加动画效果
            jokeText.classList.remove('fade-in');
            void jokeText.offsetWidth;
            jokeText.classList.add('fade-in');
            
            // 更新计数器（历史记录中没有计数器，所以显示为历史）
            counter.textContent = "历史记录";
            
            // 更新收藏按钮状态
            updateLikeButton(prevJoke);
            
            // 从历史记录中移除当前和上一个笑话，然后重新添加（保持历史顺序）
            jokeHistory.pop(); // 移除当前
            jokeHistory.pop(); // 移除上一个
            addToHistory(prevJoke); // 重新添加
        }
        
        // 添加到历史记录
        function addToHistory(joke) {
            // 如果历史记录中已有该笑话，先移除
            jokeHistory = jokeHistory.filter(item => item.text !== joke.text);
            
            // 添加到历史记录
            jokeHistory.push(joke);
            
            // 限制历史记录最多10条
            if (jokeHistory.length > 10) {
                jokeHistory.shift();
            }
            
            // 更新历史记录显示
            updateHistoryList();
        }
        
        // 更新历史记录列表
        function updateHistoryList() {
            if (jokeHistory.length === 0) {
                historyList.innerHTML = '<div class="history-empty">您还没有查看过任何笑话</div>';
                return;
            }
            
            // 反转历史记录，使最新显示在最上面
            const reversedHistory = [...jokeHistory].reverse();
            
            historyList.innerHTML = reversedHistory.map(joke => `
                <div class="history-item">
                    ${joke.text}
                    <div class="category">${getCategoryName(joke.category)}</div>
                </div>
            `).join('');
            
            // 为历史记录项添加点击事件
            document.querySelectorAll('.history-item').forEach((item, index) => {
                item.addEventListener('click', () => {
                    const joke = reversedHistory[index];
                    jokeText.textContent = joke.text;
                    jokeCategory.textContent = getCategoryName(joke.category);
                    
                    // 添加动画效果
                    jokeText.classList.remove('fade-in');
                    void jokeText.offsetWidth;
                    jokeText.classList.add('fade-in');
                    
                    // 更新计数器
                    counter.textContent = "历史记录";
                    
                    // 更新收藏按钮状态
                    updateLikeButton(joke);
                });
            });
        }
        
        // 切换收藏状态
        function toggleLike() {
            const currentJoke = jokeHistory[jokeHistory.length - 1];
            if (!currentJoke) return;
            
            const isLiked = likedJokes.some(joke => joke.text === currentJoke.text);
            
            if (isLiked) {
                // 移除收藏
                likedJokes = likedJokes.filter(joke => joke.text !== currentJoke.text);
                likeBtn.innerHTML = '<i class="fa-regular fa-heart"></i>';
                likeBtn.classList.remove('liked');
            } else {
                // 添加收藏
                likedJokes.push(currentJoke);
                likeBtn.innerHTML = '<i class="fa-solid fa-heart"></i>';
                likeBtn.classList.add('liked');
            }
            
            // 更新收藏计数
            likedCount.textContent = likedJokes.length;
        }
        
        // 更新收藏按钮状态
        function updateLikeButton(joke) {
            const isLiked = likedJokes.some(likedJoke => likedJoke.text === joke.text);
            
            if (isLiked) {
                likeBtn.innerHTML = '<i class="fa-solid fa-heart"></i>';
                likeBtn.classList.add('liked');
            } else {
                likeBtn.innerHTML = '<i class="fa-regular fa-heart"></i>';
                likeBtn.classList.remove('liked');
            }
        }
        
        // 分享笑话
        function shareJoke() {
            const currentJoke = jokeHistory[jokeHistory.length - 1];
            if (!currentJoke) return;
            
            // 添加到分享统计
            if (!sharedJokes.some(joke => joke.text === currentJoke.text)) {
                sharedJokes.push(currentJoke);
                sharedCount.textContent = sharedJokes.length;
            }
            
            // 分享动画效果
            shareBtn.classList.add('shared');
            setTimeout(() => {
                shareBtn.classList.remove('shared');
            }, 1000);
            
            // 实际分享功能（模拟）
            if (navigator.share) {
                navigator.share({
                    title: '欢乐笑话分享',
                    text: currentJoke.text,
                    url: window.location.href
                }).catch(console.error);
            } else {
                // 如果不支持Web Share API，则使用alert提示
                alert("笑话已复制到剪贴板！\n\n" + currentJoke.text);
            }
        }
        
        // 获取分类名称
        function getCategoryName(category) {
            const names = {
                'all': '全部',
                'programmer': '程序员',
                'animal': '动物',
                'kids': '儿童',
                'life': '生活'
            };
            return names[category] || category;
        }
        
        // 页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
