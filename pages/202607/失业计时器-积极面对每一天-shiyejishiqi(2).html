<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>失业计时器 - 积极面对每一天</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2ecc71;
            --background-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --border-color: #e0e0e0;
            --transition-speed: 0.3s;
        }

        .dark-theme {
            --primary-color: #2980b9;
            --secondary-color: #27ae60;
            --background-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --shadow-color: rgba(0, 0, 0, 0.4);
            --border-color: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            transition: background-color var(--transition-speed);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            background: linear-gradient(135deg, var(--background-color) 0%, #eef2f7 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
        }

        .logo-text h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .logo-text p {
            font-size: 14px;
            color: var(--text-color);
            opacity: 0.8;
        }

        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all var(--transition-speed);
            box-shadow: 0 4px 6px var(--shadow-color);
        }

        .theme-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 10px var(--shadow-color);
        }

        .theme-toggle i {
            font-size: 18px;
        }

        .main-content {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            margin-bottom: 40px;
        }

        .timer-section {
            flex: 1 1 500px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px var(--shadow-color);
            border: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--primary-color);
        }

        .section-title i {
            color: var(--primary-color);
        }

        .timer-display {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin: 40px 0;
        }

        .time-unit {
            text-align: center;
            min-width: 90px;
            padding: 15px;
            background: rgba(52, 152, 219, 0.05);
            border-radius: 15px;
        }

        .time-value {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 5px;
        }

        .time-label {
            font-size: 14px;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .date-controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 30px;
        }

        .date-input {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-weight: 500;
            font-size: 16px;
        }

        input[type="date"] {
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 16px;
            max-width: 300px;
            transition: all 0.3s;
        }

        input[type="date"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-speed);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
        }

        .btn-secondary {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            box-shadow: 0 2px 8px var(--shadow-color);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .resources-section {
            flex: 1 1 500px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px var(--shadow-color);
            border: 1px solid var(--border-color);
        }

        .resources-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .resource-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 20px;
            transition: all var(--transition-speed);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .resource-card:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }

        .resource-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px var(--shadow-color);
            border-color: var(--primary-color);
        }

        .resource-card:hover:before {
            transform: scaleX(1);
        }

        .resource-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            color: white;
            font-size: 20px;
        }

        .resource-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .resource-desc {
            font-size: 14px;
            opacity: 0.8;
            line-height: 1.5;
        }

        .motivational-section {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px var(--shadow-color);
            color: white;
            position: relative;
            overflow: hidden;
        }

        .motivational-section:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0,0 Q50,25 100,0 T100,100 Q50,75 0,100 Z" fill="rgba(255,255,255,0.1)"/></svg>');
            background-size: cover;
        }

        .quote {
            font-size: 24px;
            font-weight: 500;
            font-style: italic;
            text-align: center;
            margin-bottom: 20px;
            max-width: 800px;
            margin: 0 auto 20px;
            position: relative;
            z-index: 1;
        }

        .author {
            text-align: center;
            font-size: 16px;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }

        footer {
            text-align: center;
            padding: 20px;
            border-top: 1px solid var(--border-color);
            margin-top: auto;
            font-size: 14px;
            opacity: 0.8;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: 10px;
            box-shadow: 0 5px 15px var(--shadow-color);
            transform: translateX(120%);
            transition: transform 0.3s ease;
            z-index: 1000;
            border-left: 4px solid var(--secondary-color);
        }

        .notification.show {
            transform: translateX(0);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .time-unit {
                min-width: 70px;
            }
            
            .time-value {
                font-size: 36px;
            }
            
            .quote {
                font-size: 20px;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            .button-group .btn {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .time-unit {
                min-width: 60px;
                padding: 10px;
            }
            
            .time-value {
                font-size: 28px;
            }
            
            .section-title {
                font-size: 20px;
            }
            
            .quote {
                font-size: 18px;
            }
            
            .timer-section, .resources-section {
                padding: 20px;
            }
            
            header {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }
            
            .logo {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-clock"></i>
                </div>
                <div class="logo-text">
                    <h1>失业计时器</h1>
                    <p>积极面对每一天 · 记录成长每一步</p>
                </div>
            </div>
            <div class="theme-toggle" id="themeToggle">
                <i class="fas fa-moon"></i>
                <span>深色模式</span>
            </div>
        </header>

        <div class="main-content">
            <div class="timer-section">
                <h2 class="section-title">
                    <i class="fas fa-calendar-alt"></i>
                    失业时间统计
                </h2>
                <div class="timer-display">
                    <div class="time-unit">
                        <div class="time-value" id="days">0</div>
                        <div class="time-label">天</div>
                    </div>
                    <div class="time-unit">
                        <div class="time-value" id="hours">0</div>
                        <div class="time-label">小时</div>
                    </div>
                    <div class="time-unit">
                        <div class="time-value" id="minutes">0</div>
                        <div class="time-label">分钟</div>
                    </div>
                    <div class="time-unit">
                        <div class="time-value" id="seconds">0</div>
                        <div class="time-label">秒</div>
                    </div>
                </div>
                <div class="date-controls">
                    <div class="date-input">
                        <label for="startDate">失业开始日期：</label>
                        <input type="date" id="startDate">
                    </div>
                    <div class="button-group">
                        <button class="btn btn-primary" id="saveBtn">
                            <i class="fas fa-save"></i> 保存日期
                        </button>
                        <button class="btn btn-secondary" id="resetBtn">
                            <i class="fas fa-redo"></i> 重新开始
                        </button>
                    </div>
                </div>
            </div>

            <div class="resources-section">
                <h2 class="section-title">
                    <i class="fas fa-lightbulb"></i>
                    求职资源与建议
                </h2>
                <div class="resources-grid">
                    <div class="resource-card">
                        <div class="resource-icon">
                            <i class="fas fa-file-alt"></i>
                        </div>
                        <h3 class="resource-title">简历优化</h3>
                        <p class="resource-desc">学习如何制作一份能脱颖而出的简历，提高面试机会。</p>
                    </div>
                    <div class="resource-card">
                        <div class="resource-icon">
                            <i class="fas fa-comments"></i>
                        </div>
                        <h3 class="resource-title">面试技巧</h3>
                        <p class="resource-desc">掌握常见面试问题回答技巧，提升面试成功率。</p>
                    </div>
                    <div class="resource-card">
                        <div class="resource-icon">
                            <i class="fas fa-network-wired"></i>
                        </div>
                        <h3 class="resource-title">人脉拓展</h3>
                        <p class="resource-desc">如何有效建立职业人脉网络，获取更多机会。</p>
                    </div>
                    <div class="resource-card">
                        <div class="resource-icon">
                            <i class="fas fa-graduation-cap"></i>
                        </div>
                        <h3 class="resource-title">技能提升</h3>
                        <p class="resource-desc">免费在线课程资源，提升你的职场竞争力。</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="motivational-section">
            <div class="quote" id="quoteText">
                "每一次失业都是重新审视自己、提升自己的机会。坚持下去，更好的机会就在前方等着你。"
            </div>
            <div class="author" id="quoteAuthor">- 职场导师 张明</div>
        </div>
    </div>

    <footer>
        <p>失业计时器 © 2023 | 积极面对每一天，记录成长每一步</p>
    </footer>

    <div class="notification" id="notification">
        <i class="fas fa-check-circle"></i> <span id="notificationText">操作成功</span>
    </div>

    <script>
        // DOM元素引用
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = themeToggle.querySelector('i');
        const themeText = themeToggle.querySelector('span');
        const startDateInput = document.getElementById('startDate');
        const daysEl = document.getElementById('days');
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');
        const saveBtn = document.getElementById('saveBtn');
        const resetBtn = document.getElementById('resetBtn');
        const quoteEl = document.getElementById('quoteText');
        const authorEl = document.getElementById('quoteAuthor');
        const notification = document.getElementById('notification');
        const notificationText = document.getElementById('notificationText');

        // 显示通知函数
        function showNotification(message) {
            notificationText.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // 主题切换功能
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            
            if (document.body.classList.contains('dark-theme')) {
                themeIcon.className = 'fas fa-sun';
                themeText.textContent = '浅色模式';
                showNotification('已切换到深色模式');
            } else {
                themeIcon.className = 'fas fa-moon';
                themeText.textContent = '深色模式';
                showNotification('已切换到浅色模式');
            }
            
            // 保存主题偏好
            localStorage.setItem('theme', document.body.classList.contains('dark-theme') ? 'dark' : 'light');
        });
        
        // 检查本地存储的主题偏好
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-theme');
            themeIcon.className = 'fas fa-sun';
            themeText.textContent = '浅色模式';
        }
        
        // 失业计时器功能
        let startDate = localStorage.getItem('unemploymentStartDate');
        
        // 设置日期输入框的值
        if (startDate) {
            startDateInput.value = startDate;
        } else {
            // 默认设置为30天前
            const defaultDate = new Date();
            defaultDate.setDate(defaultDate.getDate() - 30);
            const formattedDate = formatDate(defaultDate);
            startDateInput.value = formattedDate;
            startDate = formattedDate;
            localStorage.setItem('unemploymentStartDate', startDate);
        }
        
        // 日期格式化函数
        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }
        
        // 更新计时器显示
        function updateTimer() {
            if (!startDate) return;
            
            const start = new Date(startDate);
            const now = new Date();
            const diff = now - start;
            
            // 计算时间差
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            // 更新时间显示
            daysEl.textContent = days;
            hoursEl.textContent = hours.toString().padStart(2, '0');
            minutesEl.textContent = minutes.toString().padStart(2, '0');
            secondsEl.textContent = seconds.toString().padStart(2, '0');
        }
        
        // 初始更新
        updateTimer();
        
        // 每秒更新一次
        setInterval(updateTimer, 1000);
        
        // 保存日期
        saveBtn.addEventListener('click', () => {
            const selectedDate = startDateInput.value;
            if (selectedDate) {
                startDate = selectedDate;
                localStorage.setItem('unemploymentStartDate', startDate);
                updateTimer();
                showNotification('日期已保存！');
            } else {
                showNotification('请选择有效的日期');
            }
        });
        
        // 重置日期
        resetBtn.addEventListener('click', () => {
            const today = new Date();
            const formattedToday = formatDate(today);
            startDateInput.value = formattedToday;
            startDate = formattedToday;
            localStorage.setItem('unemploymentStartDate', startDate);
            updateTimer();
            showNotification('已重置为今日日期！');
        });
        
        // 随机励志名言
        const quotes = [
            {
                text: "每一次失业都是重新审视自己、提升自己的机会。坚持下去，更好的机会就在前方等着你。",
                author: "职场导师 张明"
            },
            {
                text: "失业只是暂时的状态，你的价值永远不会因此改变。",
                author: "职业规划师 李华"
            },
            {
                text: "每一次职业转换都是成长的机会，保持积极心态。",
                author: "HR专家 王芳"
            },
            {
                text: "专注于你能控制的事情：技能提升、求职准备和保持健康心态。",
                author: "职业教练 陈伟"
            },
            {
                text: "成功不是最终目的，失败也不是致命伤，继续前进的勇气才是最重要的。",
                author: "企业家 马云"
            },
            {
                text: "今天的努力是为了明天更好的自己，坚持就是胜利。",
                author: "励志演说家 刘强"
            },
            {
                text: "失业是人生中的一个逗号，而不是句号。",
                author: "心理学家 赵敏"
            }
        ];
        
        // 随机选择一条励志名言
        function updateQuote() {
            const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
            quoteEl.textContent = `"${randomQuote.text}"`;
            authorEl.textContent = `- ${randomQuote.author}`;
        }
        
        // 初始化和每30秒更新一次
        updateQuote();
        setInterval(updateQuote, 30000);
        
        // 资源卡片点击事件
        const resourceCards = document.querySelectorAll('.resource-card');
        resourceCards.forEach(card => {
            card.addEventListener('click', () => {
                const title = card.querySelector('.resource-title').textContent;
                showNotification(`已选择: ${title} 资源`);
            });
        });
    </script>
</body>
</html>
