        // 获取DOM元素
        const getGuideBtn = document.getElementById('getGuide');
        const changeGuideBtn = document.getElementById('changeGuide');
        const guidePlaceholder = document.querySelector('.guide-placeholder');
        const guideContent = document.querySelector('.guide-content');
        const downloadBtn = document.getElementById('downloadBtn');
        const modal = document.getElementById('downloadModal');
        const closeBtn = document.querySelector('.close');
        
        // 显示随机景点攻略
        function showRandomAttraction() {
            // 隐藏占位符，显示内容
            guidePlaceholder.style.display = 'none';
            guideContent.style.display = 'block';
            
            // 随机选择一个景点
            const randomIndex = Math.floor(Math.random() * attractions.length);
            const attraction = attractions[randomIndex];
            
            // 填充内容
            document.getElementById('attraction-name').textContent = attraction.name;
            document.getElementById('attraction-description').textContent = attraction.description;
            document.getElementById('attraction-address').textContent = attraction.address;
            document.getElementById('attraction-transport').textContent = attraction.transport;
            document.getElementById('attraction-ticket').textContent = attraction.ticket;
            document.getElementById('attraction-hours').textContent = attraction.hours;
            
            // 显示"换一个景点"按钮
            changeGuideBtn.style.display = 'inline-block';
        }
        
        // 事件监听
        getGuideBtn.addEventListener('click', showRandomAttraction);
        changeGuideBtn.addEventListener('click', showRandomAttraction);
        
        // 下载按钮事件
        downloadBtn.addEventListener('click', function() {
            modal.style.display = 'block';
        });
        
        // 关闭模态框事件
        closeBtn.addEventListener('click', function() {
            modal.style.display = 'none';
        });
        
        // 点击模态框外部关闭
        window.addEventListener('click', function(event) {
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        });
    </script>
