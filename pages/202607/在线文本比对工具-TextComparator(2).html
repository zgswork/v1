<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线文本比对工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        header {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #1a2a6c;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #555;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .comparison-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 10px;
        }
        
        @media (min-width: 768px) {
            .comparison-container {
                flex-direction: row;
            }
        }
        
        .text-container {
            flex: 1;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 500px;
        }
        
        .text-header {
            background: #1a2a6c;
            color: white;
            padding: 15px 20px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .char-count {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        textarea {
            flex: 1;
            padding: 20px;
            border: none;
            resize: none;
            font-size: 1.1rem;
            line-height: 1.6;
            outline: none;
            background: rgba(255, 255, 255, 0.95);
            font-family: 'Consolas', 'Courier New', monospace;
            overflow: auto;
        }
        
        .result-container {
            flex: 1;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 500px;
        }
        
        .result-content {
            flex: 1;
            padding: 20px;
            overflow: auto;
            font-size: 1.1rem;
            line-height: 1.6;
            font-family: 'Consolas', 'Courier New', monospace;
            white-space: pre-wrap;
            background: rgba(255, 255, 255, 0.95);
        }
        
        .diff-added {
            background-color: #d4edda;
            color: #155724;
            padding: 0 2px;
            border-radius: 3px;
        }
        
        .diff-removed {
            background-color: #f8d7da;
            color: #721c24;
            text-decoration: line-through;
            padding: 0 2px;
            border-radius: 3px;
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            color: white;
            font-size: 1rem;
            margin-top: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
        }
        
        .btn-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 10px;
        }
        
        .btn {
            padding: 12px 25px;
            background: #1a2a6c;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .btn:hover {
            background: #fdbb2d;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        .btn-clear {
            background: #b21f1f;
        }
        
        .btn-example {
            background: #0d6efd;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>在线文本比对工具</h1>
            <p class="subtitle">在左右两侧输入文本内容，系统将实时比对差异并用颜色标记不同之处（<span style="background-color:#d4edda; color:#155724">绿色</span>表示添加内容，<span style="background-color:#f8d7da; color:#721c24; text-decoration:line-through">红色</span>表示删除内容）</p>
            
            <div class="btn-container">
                <button class="btn btn-example" id="loadExample">加载示例文本</button>
                <button class="btn btn-clear" id="clearText">清空文本</button>
            </div>
        </header>
        
        <div class="comparison-container">
            <div class="text-container">
                <div class="text-header">
                    <span>原始文本</span>
                    <span class="char-count">字符数: <span id="leftCount">0</span></span>
                </div>
                <textarea id="leftText" placeholder="在此输入原始文本..."></textarea>
            </div>
            
            <div class="text-container">
                <div class="text-header">
                    <span>修改文本</span>
                    <span class="char-count">字符数: <span id="rightCount">0</span></span>
                </div>
                <textarea id="rightText" placeholder="在此输入修改后的文本..."></textarea>
            </div>
        </div>
        
        <div class="comparison-container">
            <div class="result-container">
                <div class="text-header">
                    <span>差异比对结果</span>
                </div>
                <div class="result-content" id="diffResult">
                    文本差异将在此显示...
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>在线文本比对工具 &copy; 2023 | 实时差异检测 | 手机/平板/电脑适配</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const leftText = document.getElementById('leftText');
            const rightText = document.getElementById('rightText');
            const diffResult = document.getElementById('diffResult');
            const leftCount = document.getElementById('leftCount');
            const rightCount = document.getElementById('rightCount');
            const loadExampleBtn = document.getElementById('loadExample');
            const clearTextBtn = document.getElementById('clearText');
            
            // 示例文本
            const exampleLeftText = `欢迎使用在线文本比对工具！
此工具可帮助您快速比较两个文本之间的差异。
左侧输入原始文本，右侧输入修改后的文本。
系统将实时高亮显示所有差异。

功能特点：
1. 实时文本差异比对
2. 添加内容用绿色背景标记
3. 删除内容用红色背景标记
4. 完美适配手机和电脑设备
5. 简洁直观的用户界面

请尝试修改右侧文本以查看差异效果。`;
            
            const exampleRightText = `欢迎使用强大的在线文本比对工具！
此工具可帮助您快速比较两个文本之间的差异。
左侧输入原始文本，右侧输入修改后的文本。
系统将实时高亮显示所有文本变化。

功能特点：
1. 实时文本差异比对分析
2. 新添加内容用绿色背景标记
3. 被删除内容用红色背景标记
4. 完美适配手机、平板和电脑设备
5. 简洁直观的用户界面设计
6. 新增示例文本和清空功能

请尝试修改文本以查看实时差异效果。`;
            
            // 加载示例文本
            loadExampleBtn.addEventListener('click', function() {
                leftText.value = exampleLeftText;
                rightText.value = exampleRightText;
                updateCharCount();
                compareTexts();
            });
            
            // 清空文本
            clearTextBtn.addEventListener('click', function() {
                leftText.value = '';
                rightText.value = '';
                diffResult.innerHTML = '文本差异将在此显示...';
                updateCharCount();
            });
            
            // 更新字符计数
            function updateCharCount() {
                leftCount.textContent = leftText.value.length;
                rightCount.textContent = rightText.value.length;
            }
            
            // 文本比较函数
            function compareTexts() {
                const text1 = leftText.value;
                const text2 = rightText.value;
                
                if (!text1 && !text2) {
                    diffResult.innerHTML = '文本差异将在此显示...';
                    return;
                }
                
                if (!text1) {
                    diffResult.innerHTML = highlightDifferences('', text2);
                    return;
                }
                
                if (!text2) {
                    diffResult.innerHTML = highlightDifferences(text1, '');
                    return;
                }
                
                diffResult.innerHTML = highlightDifferences(text1, text2);
            }
            
            // 高亮差异算法
            function highlightDifferences(text1, text2) {
                const lines1 = text1.split('\n');
                const lines2 = text2.split('\n');
                const maxLines = Math.max(lines1.length, lines2.length);
                let resultHtml = '';
                
                for (let i = 0; i < maxLines; i++) {
                    const line1 = lines1[i] || '';
                    const line2 = lines2[i] || '';
                    
                    // 整行相同
                    if (line1 === line2) {
                        resultHtml += escapeHtml(line1) + '\n';
                        continue;
                    }
                    
                    // 整行被删除
                    if (line2 === '') {
                        resultHtml += `<span class="diff-removed">${escapeHtml(line1)}</span>\n`;
                        continue;
                    }
                    
                    // 整行新增
                    if (line1 === '') {
                        resultHtml += `<span class="diff-added">${escapeHtml(line2)}</span>\n`;
                        continue;
                    }
                    
                    // 逐行比较
                    resultHtml += highlightLineDifferences(line1, line2) + '\n';
                }
                
                return resultHtml;
            }
            
            // 高亮单行差异
            function highlightLineDifferences(line1, line2) {
                const len1 = line1.length;
                const len2 = line2.length;
                let i = 0;
                let j = 0;
                let result = '';
                
                while (i < len1 || j < len2) {
                    // 查找相同部分
                    let startI = i;
                    let startJ = j;
                    
                    while (i < len1 && j < len2 && line1[i] === line2[j]) {
                        i++;
                        j++;
                    }
                    
                    // 添加相同部分
                    if (i > startI) {
                        result += escapeHtml(line1.substring(startI, i));
                    }
                    
                    // 查找删除部分
                    let deleteStart = i;
                    while (i < len1 && (j >= len2 || line1[i] !== line2[j])) {
                        i++;
                    }
                    
                    // 查找新增部分
                    let addStart = j;
                    while (j < len2 && (i >= len1 || line1[i] !== line2[j])) {
                        j++;
                    }
                    
                    // 添加删除部分
                    if (i > deleteStart) {
                        result += `<span class="diff-removed">${escapeHtml(line1.substring(deleteStart, i))}</span>`;
                    }
                    
                    // 添加新增部分
                    if (j > addStart) {
                        result += `<span class="diff-added">${escapeHtml(line2.substring(addStart, j))}</span>`;
                    }
                }
                
                return result;
            }
            
            // 转义HTML特殊字符
            function escapeHtml(text) {
                return text
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }
            
            // 监听文本变化
            leftText.addEventListener('input', function() {
                updateCharCount();
                compareTexts();
            });
            
            rightText.addEventListener('input', function() {
                updateCharCount();
                compareTexts();
            });
            
            // 初始化字符计数
            updateCharCount();
        });
    </script>
</body>
</html>
