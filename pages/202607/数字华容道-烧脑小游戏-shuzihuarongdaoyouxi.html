<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字华容道 - 烧脑小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .game-header {
            margin-bottom: 25px;
        }

        .game-title {
            font-size: 2.5em;
            color: #2c3e50;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .game-subtitle {
            font-size: 1.2em;
            color: #7f8c8d;
            margin-bottom: 20px;
        }

        .game-stats {
            display: flex;
            justify-content: space-around;
            background: #ecf0f1;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 1em;
            color: #7f8c8d;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #e74c3c;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-gap: 10px;
            margin: 20px auto;
            max-width: 400px;
        }

        .tile {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #3498db, #2980b9);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .tile:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .tile.empty {
            background: rgba(236, 240, 241, 0.5);
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .tile.correct {
            background: linear-gradient(135deg, #27ae60, #219653);
        }

        .game-controls {
            margin-top: 25px;
        }

        .btn {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            margin: 0 10px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(231, 76, 60, 0.6);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn.restart {
            background: linear-gradient(135deg, #3498db, #2980b9);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }

        .btn.restart:hover {
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.6);
        }

        .difficulty-selector {
            margin: 20px 0;
        }

        .difficulty-btn {
            background: #95a5a6;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 0 5px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .difficulty-btn.active {
            background: #e74c3c;
        }

        .message {
            font-size: 1.3em;
            font-weight: bold;
            color: #e74c3c;
            margin: 20px 0;
            min-height: 30px;
        }

        .instructions {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            margin-top: 25px;
            text-align: left;
        }

        .instructions h3 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .instructions ul {
            padding-left: 20px;
        }

        .instructions li {
            margin: 8px 0;
            color: #7f8c8d;
        }

        .win-animation {
            animation: winPulse 1s infinite;
        }

        @keyframes winPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* 响应式设计 */
        @media (max-width: 480px) {
            .game-container {
                padding: 20px;
            }

            .game-title {
                font-size: 2em;
            }

            .tile {
                font-size: 1.5em;
            }

            .btn {
                padding: 12px 20px;
                font-size: 1em;
                margin: 5px;
            }

            .game-stats {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1 class="game-title">🧩 数字华容道</h1>
            <p class="game-subtitle">移动方块，按顺序排列数字</p>
        </div>

        <div class="game-stats">
            <div class="stat-item">
                <div class="stat-label">步数</div>
                <div class="stat-value" id="moves">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">时间</div>
                <div class="stat-value" id="timer">0s</div>
            </div>
        </div>

        <div class="difficulty-selector">
            <button class="difficulty-btn active" data-size="4">4×4</button>
            <button class="difficulty-btn" data-size="3">3×3</button>
            <button class="difficulty-btn" data-size="5">5×5</button>
        </div>

        <div class="message" id="message">开始游戏吧！</div>

        <div class="game-board" id="gameBoard"></div>

        <div class="game-controls">
            <button class="btn restart" id="restartBtn">🔄 重新开始</button>
            <button class="btn" id="shuffleBtn">🔀 打乱</button>
        </div>

        <div class="instructions">
            <h3>游戏副本说明：</h3>
            <ul>
                <li>点击与空白格相邻的数字方块，将其移动到空白位置</li>
                <li>目标是按从左到右、从上到下的顺序排列数字（最后一个是空白格）</li>
                <li>用最少的步数和时间完成挑战</li>
                <li>可以选择不同的难度级别：3×3、4×4、5×5</li>
            </ul>
        </div>
    </div>

    <script>
        class NumberPuzzle {
            constructor() {
                this.boardSize = 4;
                this.board = [];
                this.emptyPos = { row: 3, col: 3 };
                this.moves = 0;
                this.startTime = null;
                this.timerInterval = null;
                this.isGameStarted = false;
                this.isGameWon = false;
                
                this.init();
            }

            init() {
                this.createBoard();
                this.bindEvents();
                this.updateDisplay();
            }

            createBoard() {
                const board = [];
                const totalTiles = this.boardSize * this.boardSize;
                
                // 创建有序数组
                for (let i = 1; i < totalTiles; i++) {
                    board.push(i);
                }
                board.push(0); // 0 代表空白格
                
                this.board = board;
                this.emptyPos = { row: this.boardSize - 1, col: this.boardSize - 1 };
                this.moves = 0;
                this.isGameStarted = false;
                this.isGameWon = false;
                
                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                    this.timerInterval = null;
                }
                
                this.renderBoard();
                this.updateStats();
            }

            shuffleBoard() {
                // 随机打乱棋盘
                const totalTiles = this.boardSize * this.boardSize;
                for (let i = 0; i < 1000; i++) {
                    const neighbors = this.getValidMoves();
                    if (neighbors.length > 0) {
                        const randomMove = neighbors[Math.floor(Math.random() * neighbors.length)];
                        this.moveTile(randomMove.row, randomMove.col, false);
                    }
                }
                
                this.moves = 0;
                this.isGameStarted = true;
                this.isGameWon = false;
                this.startTime = Date.now();
                this.startTimer();
                this.renderBoard();
                this.updateStats();
                document.getElementById('message').textContent = '游戏进行中...';
            }

            renderBoard() {
                const gameBoard = document.getElementById('gameBoard');
                gameBoard.innerHTML = '';
                gameBoard.style.gridTemplateColumns = `repeat(${this.boardSize}, 1fr)`;
                
                for (let i = 0; i < this.board.length; i++) {
                    const tileValue = this.board[i];
                    const row = Math.floor(i / this.boardSize);
                    const col = i % this.boardSize;
                    
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.row = row;
                    tile.dataset.col = col;
                    
                    if (tileValue === 0) {
                        tile.classList.add('empty');
                    } else {
                        tile.textContent = tileValue;
                        // 检查是否在正确位置
                        const correctValue = row * this.boardSize + col + 1;
                        if (tileValue === correctValue) {
                            tile.classList.add('correct');
                        }
                    }
                    
                    tile.addEventListener('click', () => this.handleTileClick(row, col));
                    gameBoard.appendChild(tile);
                }
            }

            handleTileClick(row, col) {
                if (this.isGameWon) return;
                
                if (!this.isGameStarted) {
                    this.isGameStarted = true;
                    this.startTime = Date.now();
                    this.startTimer();
                    document.getElementById('message').textContent = '游戏进行中...';
                }
                
                if (this.canMove(row, col)) {
                    this.moveTile(row, col);
                    this.checkWin();
                }
            }

            canMove(row, col) {
                const emptyRow = this.emptyPos.row;
                const emptyCol = this.emptyPos.col;
                
                // 只能移动与空白格相邻的方块
                return (
                    (Math.abs(row - emptyRow) === 1 && col === emptyCol) ||
                    (Math.abs(col - emptyCol) === 1 && row === emptyRow)
                );
            }

            moveTile(row, col, updateStats = true) {
                const emptyIndex = this.emptyPos.row * this.boardSize + this.emptyPos.col;
                const tileIndex = row * this.boardSize + col;
                
                // 交换位置
                [this.board[emptyIndex], this.board[tileIndex]] = 
                [this.board[tileIndex], this.board[emptyIndex]];
                
                // 更新空白格位置
                this.emptyPos = { row, col };
                
                if (updateStats) {
                    this.moves++;
                }
                
                this.renderBoard();
                if (updateStats) {
                    this.updateStats();
                }
            }

            getValidMoves() {
                const { row, col } = this.emptyPos;
                const moves = [];
                
                // 上
                if (row > 0) moves.push({ row: row - 1, col });
                // 下
                if (row < this.boardSize - 1) moves.push({ row: row + 1, col });
                // 左
                if (col > 0) moves.push({ row, col: col - 1 });
                // 右
                if (col < this.boardSize - 1) moves.push({ row, col: col + 1 });
                
                return moves;
            }

            checkWin() {
                for (let i = 0; i < this.board.length - 1; i++) {
                    if (this.board[i] !== i + 1) {
                        return false;
                    }
                }
                
                // 检查最后一个是否为空白格
                if (this.board[this.board.length - 1] !== 0) {
                    return false;
                }
                
                this.winGame();
                return true;
            }

            winGame() {
                this.isGameWon = true;
                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                    this.timerInterval = null;
                }
                
                const timeTaken = Math.floor((Date.now() - this.startTime) / 1000);
                document.getElementById('message').innerHTML = 
                    `🎉 恭喜完成！<br>步数: ${this.moves} 步，时间: ${timeTaken} 秒`;
                
                // 胜利动画
                const tiles = document.querySelectorAll('.tile:not(.empty)');
                tiles.forEach(tile => {
                    tile.classList.add('win-animation');
                });
            }

            startTimer() {
                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                }
                
                this.timerInterval = setInterval(() => {
                    this.updateStats();
                }, 1000);
            }

            updateStats() {
                document.getElementById('moves').textContent = this.moves;
                
                if (this.startTime) {
                    const elapsed = Math.floor((Date.now() - this.startTime) / 1000);
                    document.getElementById('timer').textContent = `${elapsed}s`;
                } else {
                    document.getElementById('timer').textContent = '0s';
                }
            }

            changeDifficulty(size) {
                this.boardSize = parseInt(size);
                this.createBoard();
                document.getElementById('message').textContent = '选择难度，点击"打乱"开始游戏';
                
                // 更新难度按钮状态
                document.querySelectorAll('.difficulty-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                document.querySelector(`[data-size="${size}"]`).classList.add('active');
            }

            bindEvents() {
                // 重新开始按钮
                document.getElementById('restartBtn').addEventListener('click', () => {
                    this.createBoard();
                    document.getElementById('message').textContent = '游戏已重置';
                });
                
                // 打乱按钮
                document.getElementById('shuffleBtn').addEventListener('click', () => {
                    this.shuffleBoard();
                });
                
                // 难度选择
                document.querySelectorAll('.difficulty-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const size = e.target.dataset.size;
                        this.changeDifficulty(size);
                    });
                });
            }
        }

        // 初始化游戏
        document.addEventListener('DOMContentLoaded', () => {
            const game = new NumberPuzzle();
            
            // 添加键盘支持
            document.addEventListener('keydown', (e) => {
                if (game.isGameWon) return;
                
                const { row, col } = game.emptyPos;
                let targetRow = row;
                let targetCol = col;
                
                switch(e.key) {
                    case 'ArrowUp':
                        targetRow = row + 1;
                        break;
                    case 'ArrowDown':
                        targetRow = row - 1;
                        break;
                    case 'ArrowLeft':
                        targetCol = col + 1;
                        break;
                    case 'ArrowRight':
                        targetCol = col - 1;
                        break;
                    default:
                        return;
                }
                
                if (targetRow >= 0 && targetRow < game.boardSize && 
                    targetCol >= 0 && targetCol < game.boardSize) {
                    game.handleTileClick(targetRow, targetCol);
                }
            });
        });
    </script>
</body>
</html>
