<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水印生成工具</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .upload-section {
            margin-bottom: 30px;
        }

        .file-input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .file-input {
            width: 100%;
            padding: 15px;
            border: 3px dashed #ddd;
            border-radius: 10px;
            background: #f8f9fa;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-size: 1.1em;
            color: #666;
        }

        .file-input:hover {
            border-color: #667eea;
            background: #f0f2ff;
        }

        .file-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .watermark-section {
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
            font-size: 1.1em;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .color-picker {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .color-picker input[type="color"] {
            width: 60px;
            height: 40px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #666;
            border: 2px solid #ddd;
        }

        .btn-secondary:hover {
            background: #e9ecef;
            border-color: #adb5bd;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .progress {
            margin-top: 20px;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(45deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }

        .status {
            margin-top: 10px;
            text-align: center;
            font-weight: bold;
            color: #666;
        }

        .error {
            color: #dc3545;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            display: none;
        }

        .success {
            color: #155724;
            background: #d4edda;
            border: 1px solid #c3e6cb;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            display: none;
        }

        .file-info {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }

        .file-info h4 {
            margin-bottom: 10px;
            color: #333;
        }

        .file-info p {
            color: #666;
            margin-bottom: 5px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
                margin: 10px;
            }

            .header h1 {
                font-size: 2em;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>水印生成工具</h1>
            <p>为您的PDF和DOC文件添加专业水印</p>
            <p style="font-size: 0.9em; color: #888; margin-top: 10px;">
                📝 提示：DOCX文件将转换为PDF格式并添加水印
            </p>
            <p style="font-size: 0.85em; color: #999; margin-top: 5px;">
                ⚠️ 注意：老版本DOC文件可能无法提取原文内容，建议使用DOCX或PDF格式
            </p>
        </div>

        <div class="upload-section">
            <div class="file-input-wrapper">
                <input type="file" id="fileInput" class="file-input" accept=".pdf,.doc,.docx" />
            </div>
            <div class="file-info" id="fileInfo">
                <h4>文件信息</h4>
                <p id="fileName"></p>
                <p id="fileSize"></p>
                <p id="fileType"></p>
            </div>
        </div>

        <div class="watermark-section">
            <div class="form-group">
                <label for="watermarkText">水印文字</label>
                <input type="text" id="watermarkText" placeholder="请输入水印文字" value="机密文件" />
            </div>

            <div class="form-group">
                <label for="fontSize">字体大小</label>
                <select id="fontSize">
                    <option value="24">小 (24px)</option>
                    <option value="36" selected>中 (36px)</option>
                    <option value="48">大 (48px)</option>
                    <option value="60">特大 (60px)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="opacity">透明度</label>
                <select id="opacity">
                    <option value="0.1">很淡 (10%)</option>
                    <option value="0.3" selected>淡 (30%)</option>
                    <option value="0.5">中等 (50%)</option>
                    <option value="0.7">深 (70%)</option>
                    <option value="0.9">很深 (90%)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="rotation">旋转角度</label>
                <select id="rotation">
                    <option value="-45" selected>左上到右下 (-45°)</option>
                    <option value="-30">左上到右下 (-30°)</option>
                    <option value="0">水平 (0°)</option>
                    <option value="30">右上到左下 (30°)</option>
                    <option value="45">右上到左下 (45°)</option>
                </select>
            </div>

            <div class="form-group">
                <label>水印颜色</label>
                <div class="color-picker">
                    <input type="color" id="watermarkColor" value="#ff0000" />
                    <span id="colorValue">#ff0000</span>
                </div>
            </div>
        </div>

        <div class="button-group">
            <button class="btn btn-primary" id="generateBtn" onclick="generateWatermark()">
                生成水印
            </button>
            <button class="btn btn-secondary" onclick="resetForm()">
                重置
            </button>
        </div>

        <div class="progress" id="progress">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="status" id="status">处理中...</div>
        </div>

        <div class="error" id="error"></div>
        <div class="success" id="success"></div>
    </div>

    <script>
        let selectedFile = null;

        // 文件选择处理
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                showFileInfo(file);
                hideMessages();
            }
        });

        // 颜色选择器处理
        document.getElementById('watermarkColor').addEventListener('change', function(e) {
            document.getElementById('colorValue').textContent = e.target.value;
        });

        // 显示文件信息
        function showFileInfo(file) {
            const fileInfo = document.getElementById('fileInfo');
            const fileName = document.getElementById('fileName');
            const fileSize = document.getElementById('fileSize');
            const fileType = document.getElementById('fileType');

            fileName.textContent = `文件名: ${file.name}`;
            fileSize.textContent = `文件大小: ${formatFileSize(file.size)}`;
            fileType.textContent = `文件类型: ${file.type || '未知'}`;
            fileInfo.style.display = 'block';
        }

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // 隐藏消息
        function hideMessages() {
            document.getElementById('error').style.display = 'none';
            document.getElementById('success').style.display = 'none';
        }

        // 显示错误消息
        function showError(message) {
            const error = document.getElementById('error');
            error.textContent = message;
            error.style.display = 'block';
            document.getElementById('success').style.display = 'none';
        }

        // 显示成功消息
        function showSuccess(message) {
            const success = document.getElementById('success');
            success.textContent = message;
            success.style.display = 'block';
            document.getElementById('error').style.display = 'none';
        }

        // 重置表单
        function resetForm() {
            document.getElementById('fileInput').value = '';
            document.getElementById('watermarkText').value = '机密文件';
            document.getElementById('fontSize').value = '36';
            document.getElementById('opacity').value = '0.3';
            document.getElementById('rotation').value = '-45';
            document.getElementById('watermarkColor').value = '#ff0000';
            document.getElementById('colorValue').textContent = '#ff0000';
            document.getElementById('fileInfo').style.display = 'none';
            document.getElementById('progress').style.display = 'none';
            hideMessages();
            selectedFile = null;
        }

        // 更新进度条
        function updateProgress(percent, status) {
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('status').textContent = status;
        }

        // 检查必需的库是否已加载
        function checkLibraries() {
            const libraries = {
                'PDFLib': typeof PDFLib !== 'undefined',
                'mammoth': typeof mammoth !== 'undefined',
                'JSZip': typeof JSZip !== 'undefined'
            };
            
            console.log('库加载状态:', libraries);
            
            const missingLibs = Object.keys(libraries).filter(lib => !libraries[lib]);
            if (missingLibs.length > 0) {
                throw new Error(`以下库未正确加载: ${missingLibs.join(', ')}`);
            }
            
            return true;
        }

        // 生成水印
        async function generateWatermark() {
            if (!selectedFile) {
                showError('请先选择文件');
                return;
            }

            const watermarkText = document.getElementById('watermarkText').value.trim();
            if (!watermarkText) {
                showError('请输入水印文字');
                return;
            }
            
            // 检查库是否正确加载
            try {
                checkLibraries();
            } catch (libError) {
                showError('系统库加载失败: ' + libError.message);
                return;
            }

            const fontSize = parseInt(document.getElementById('fontSize').value);
            const opacity = parseFloat(document.getElementById('opacity').value);
            const rotation = parseInt(document.getElementById('rotation').value);
            const color = document.getElementById('watermarkColor').value;

            // 显示进度条
            document.getElementById('progress').style.display = 'block';
            document.getElementById('generateBtn').disabled = true;
            hideMessages();

            try {
                updateProgress(10, '开始处理文件...');

                const fileType = selectedFile.name.toLowerCase();
                let result;

                if (fileType.endsWith('.pdf')) {
                    result = await processPDF(selectedFile, watermarkText, fontSize, opacity, rotation, color);
                } else if (fileType.endsWith('.doc') || fileType.endsWith('.docx')) {
                    result = await processDOC(selectedFile, watermarkText, fontSize, opacity, rotation, color);
                } else {
                    throw new Error('不支持的文件格式');
                }

                updateProgress(100, '处理完成！');
                
                // 下载文件
                const link = document.createElement('a');
                link.href = result;
                
                // 根据原文件类型设置下载文件名
                const originalName = selectedFile.name;
                const nameWithoutExt = originalName.substring(0, originalName.lastIndexOf('.'));
                
                if (fileType.endsWith('.pdf')) {
                    link.download = `watermarked_${originalName}`;
                } else if (fileType.endsWith('.doc') || fileType.endsWith('.docx')) {
                    // DOC/DOCX文件转换为PDF，所以下载为PDF格式
                    link.download = `watermarked_${nameWithoutExt}.pdf`;
                }
                
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                // 显示成功消息
                if (fileType.endsWith('.pdf')) {
                    showSuccess('水印添加成功！PDF文件已下载。');
                } else if (fileType.endsWith('.doc') || fileType.endsWith('.docx')) {
                    showSuccess('水印添加成功！DOC文件已转换为PDF格式并下载。');
                }
                
            } catch (error) {
                console.error('Error:', error);
                showError('处理文件时出错: ' + error.message);
            } finally {
                document.getElementById('generateBtn').disabled = false;
                setTimeout(() => {
                    document.getElementById('progress').style.display = 'none';
                }, 2000);
            }
        }

        // 处理PDF文件
        async function processPDF(file, watermarkText, fontSize, opacity, rotation, color) {
            try {
            updateProgress(20, '读取PDF文件...');
            
            const arrayBuffer = await file.arrayBuffer();
            const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
            const pages = pdfDoc.getPages();

            updateProgress(40, '添加水印...');

            for (let i = 0; i < pages.length; i++) {
                const page = pages[i];
                const { width, height } = page.getSize();

                    // 添加中心水印
                    await addWatermarkToPage(pdfDoc, page, watermarkText, width / 2, height / 2, fontSize, color, opacity, rotation);

                    // 添加网格状水印以覆盖整个页面
                    const rows = Math.ceil(height / (fontSize * 3));
                    const cols = Math.ceil(width / (fontSize * 6));
                    
                    for (let row = 0; row < rows; row++) {
                        for (let col = 0; col < cols; col++) {
                            const x = (col + 0.5) * (width / cols);
                            const y = (row + 0.5) * (height / rows);
                            
                            await addWatermarkToPage(pdfDoc, page, watermarkText, x, y, fontSize * 0.8, color, opacity * 0.5, rotation);
                        }
                    }

                    updateProgress(40 + (i + 1) / pages.length * 40, `处理第 ${i + 1}/${pages.length} 页...`);
            }

            updateProgress(80, '生成最终文件...');
            
            const pdfBytes = await pdfDoc.save();
            return URL.createObjectURL(new Blob([pdfBytes], { type: 'application/pdf' }));
                
            } catch (error) {
                console.error('处理PDF文件时出错:', error);
                throw new Error('PDF文件处理失败: ' + error.message);
            }
        }

        // 处理DOC文件
        async function processDOC(file, watermarkText, fontSize, opacity, rotation, color) {
            try {
            updateProgress(20, '读取DOC文件...');
            
            const arrayBuffer = await file.arrayBuffer();
                let extractedText = '';
                let extractionSuccess = false;
                
                // 验证文件数据
                console.log('文件大小:', file.size);
                console.log('ArrayBuffer大小:', arrayBuffer.byteLength);
                console.log('文件类型:', file.type);
                
                // 检查ArrayBuffer是否有效
                if (!arrayBuffer || arrayBuffer.byteLength === 0) {
                    throw new Error('文件读取失败，ArrayBuffer为空');
                }
                
                // 检查文件的真实格式
                const uint8Array = new Uint8Array(arrayBuffer);
                const fileSignature = uint8Array.slice(0, 4);
                console.log('文件前4字节:', Array.from(fileSignature).map(b => b.toString(16).padStart(2, '0')).join(' '));
                
                // 判断真实的文件类型
                const isRealDocx = fileSignature[0] === 0x50 && fileSignature[1] === 0x4B; // PK (ZIP/DOCX)
                const isRealDoc = fileSignature[0] === 0xD0 && fileSignature[1] === 0xCF;  // OLE2 (DOC)
                
                console.log('文件类型检测:');
                console.log('- 是真正的DOCX (ZIP格式):', isRealDocx);
                console.log('- 是老版本DOC (OLE2格式):', isRealDoc);
                console.log('- 文件扩展名:', file.name.toLowerCase().split('.').pop());
                
                // 根据真实文件格式处理，而不是扩展名
                if (isRealDocx) {
                    // 处理DOCX文件
                    try {
                        console.log('开始解析DOCX文件...');
                        console.log('检查JSZip是否可用:', typeof JSZip !== 'undefined');
                        console.log('检查Mammoth是否可用:', typeof mammoth !== 'undefined');
                        
                        // 确保JSZip已加载
                        if (typeof JSZip === 'undefined') {
                            throw new Error('JSZip库未正确加载');
                        }
                        
                        // 验证DOCX文件格式
                        const isValidZip = await validateZipFile(uint8Array);
                        if (!isValidZip) {
                            console.error('文件不是有效的ZIP/DOCX格式');
                            throw new Error('文件格式无效，不是有效的DOCX文件');
                        }
                        
                        // 尝试多种方法处理ArrayBuffer
                        const bufferVariants = [
                            arrayBuffer,                           // 原始buffer
                            arrayBuffer.slice(0),                 // 复制buffer
                            new Uint8Array(arrayBuffer).buffer    // 重新构造buffer
                        ];
                        
                        let mammothSuccess = false;
                        
                        // 尝试使用不同的buffer变体
                        for (let i = 0; i < bufferVariants.length && !mammothSuccess; i++) {
                            try {
                                console.log(`尝试Mammoth解析，变体 ${i + 1}...`);
                                const result = await mammoth.extractRawText({ arrayBuffer: bufferVariants[i] });
                                console.log('Mammoth解析结果:', result);
                                
                                if (result.value && result.value.trim().length > 0) {
                                    extractedText = result.value;
                                    extractionSuccess = true;
                                    mammothSuccess = true;
                                    console.log('Mammoth内容提取成功！');
                                    break;
                                }
                            } catch (mammothError) {
                                console.warn(`Mammoth解析变体 ${i + 1} 失败:`, mammothError.message);
                            }
                        }
                        
                        // 如果Mammoth失败，尝试直接使用JSZip解析
                        if (!mammothSuccess) {
                            console.log('尝试使用JSZip直接解析DOCX...');
                            
                            for (let i = 0; i < bufferVariants.length && !extractionSuccess; i++) {
                                try {
                                    console.log(`尝试JSZip解析，变体 ${i + 1}...`);
                                    const zip = await JSZip.loadAsync(bufferVariants[i]);
                                    
                                    // 列出ZIP文件中的所有文件
                                    console.log('ZIP文件内容:', Object.keys(zip.files));
                                    
                                    const documentXml = await zip.file('word/document.xml').async('text');
                                    
                                    // 简单的XML文本提取（移除XML标签）
                                    const textContent = documentXml
                                        .replace(/<[^>]*>/g, '') // 移除XML标签
                                        .replace(/\s+/g, ' ')    // 合并多个空格
                                        .trim();
                                    
                                    if (textContent.length > 0) {
                                        extractedText = textContent;
                                        extractionSuccess = true;
                                        console.log('JSZip直接解析成功！提取文本长度:', textContent.length);
                                        console.log('文本预览:', textContent.substring(0, 200));
                                        break;
                                    } else {
                                        console.warn('JSZip解析返回空内容');
                                    }
                                } catch (jsZipError) {
                                    console.error(`JSZip解析变体 ${i + 1} 失败:`, jsZipError.message);
                                }
                            }
                        }
                        
                        if (!extractionSuccess) {
                            console.warn('所有DOCX解析方法都失败了');
                        }
                        
                    } catch (docxError) {
                        console.error('DOCX解析完全失败:', docxError);
                        extractionSuccess = false;
                    }
                } else if (isRealDoc || file.name.toLowerCase().endsWith('.doc')) {
                    // 对于老版本的DOC文件（包括扩展名伪装的），由于格式复杂，我们不尝试提取内容
                    console.log('检测到老版本DOC文件（OLE2格式），将创建仅包含水印的PDF');
                    console.log('注意：文件扩展名可能是.docx，但实际格式是老版本DOC');
                    extractionSuccess = false;
                } else {
                    // 未知格式
                    console.error('未知的文件格式');
                    throw new Error('不支持的文件格式：既不是DOCX也不是DOC');
                }

                updateProgress(40, '创建PDF文档...');
            
            // 创建新的PDF文档
            const pdfDoc = await PDFLib.PDFDocument.create();
                
                                // 如果成功提取了文本内容
                if (extractionSuccess && extractedText) {
                    console.log('开始添加提取的文本内容到PDF...');
                    
                    // 注册fontkit以支持自定义字体
                    pdfDoc.registerFontkit(fontkit);
                    
                    // 尝试嵌入支持中文的字体
                    updateProgress(45, '加载中文字体...');
                    const chineseFont = await loadChineseFont(pdfDoc);
                    
                    if (chineseFont) {
                        console.log('将使用中文字体渲染');
                    } else {
                        console.log('将使用分离显示方案');
                    }
                    
                    // 添加提取的文本内容
                    const lines = extractedText.split('\n');
                    let currentPage = pdfDoc.addPage([595.28, 841.89]);
                    const { width, height } = currentPage.getSize();
            let y = height - 50;
                    const lineHeight = 16;
                    const fontSize = 11;
                    const maxWidth = width - 100;
                    
                    console.log(`准备处理 ${lines.length} 行文本`);
                    
                    for (let lineIndex = 0; lineIndex < lines.length; lineIndex++) {
                        let line = lines[lineIndex];
                        
                        // 如果是空行，跳过但保留行距
                        if (!line.trim()) {
                            y -= lineHeight;
                            continue;
                        }
                        
                        // 处理长行，进行自动换行
                        while (line.length > 0) {
                if (y < 50) {
                                currentPage = pdfDoc.addPage([595.28, 841.89]);
                    y = height - 50;
                                console.log('创建新页面');
                            }
                            
                            // 计算每行最大字符数（中文字符占用更多空间）
                            const maxCharsPerLine = Math.floor(maxWidth / (fontSize * 0.8));
                            let lineText = line.substring(0, maxCharsPerLine);
                            
                            // 在单词边界处断行
                            if (line.length > maxCharsPerLine) {
                                const lastSpace = lineText.lastIndexOf(' ');
                                if (lastSpace > maxCharsPerLine * 0.7) {
                                    lineText = lineText.substring(0, lastSpace);
                                    line = line.substring(lastSpace + 1);
                                } else {
                                    line = line.substring(maxCharsPerLine);
                                }
                            } else {
                                line = '';
                            }
                            
                            if (lineText.trim()) {
                                                                try {
                                    if (chineseFont) {
                                        // 如果有中文字体，直接渲染包含中文的文本
                                        currentPage.drawText(lineText, {
                                            x: 50,
                                            y: y,
                                            size: fontSize,
                                            font: chineseFont,
                                            color: PDFLib.rgb(0, 0, 0)
                                        });
                                        console.log(`成功添加第 ${lineIndex + 1} 行（中文字体）`);
                                    } else {
                                        // 使用Canvas渲染方案
                                        await renderTextWithCanvas(pdfDoc, currentPage, lineText, 50, y, fontSize);
                                        console.log(`成功添加第 ${lineIndex + 1} 行（Canvas渲染）`);
                                    }
                                } catch (textError) {
                                    console.warn(`第 ${lineIndex + 1} 行渲染失败:`, textError.message);
                                    // 添加错误占位符
                                    try {
                                        currentPage.drawText('[Text rendering error]', {
                                            x: 50,
                                            y: y,
                                            size: fontSize,
                                            color: PDFLib.rgb(0.5, 0.5, 0.5)
                                        });
                                    } catch (e) {
                                        console.warn('连占位符都无法渲染');
                                    }
                                }
                            }
                y -= lineHeight;
                        }
                    }
                    
                    console.log('文本内容添加完成！');
                } else {
                    // 如果无法提取内容，创建一个说明页面
                    const infoPage = pdfDoc.addPage([595.28, 841.89]);
                    const { width, height } = infoPage.getSize();
                    
                    // 根据真实文件格式生成说明
                    const realFormat = isRealDoc ? 'DOC (OLE2)' : 
                                     isRealDocx ? 'DOCX (ZIP)' : 'Unknown';
                    const fileExt = file.name.toLowerCase().split('.').pop();
                    
                    const infoLines = [
                        'Watermark Applied Successfully',
                        '',
                        `Original File: ${file.name}`,
                        `File Extension: .${fileExt}`,
                        `Actual Format: ${realFormat}`,
                        `File Size: ${(file.size / 1024).toFixed(2)} KB`,
                        `Processing Date: ${new Date().toLocaleDateString()}`,
                        '',
                        'Note: This is a watermarked version of your document.',
                        '',
                        isRealDoc 
                            ? 'This file is in the old DOC format (Microsoft OLE2).'
                            : 'The document content could not be extracted.',
                        isRealDoc 
                            ? 'Even if the extension is .docx, the internal format is DOC.'
                            : 'This may be due to format complexity or corruption.',
                        '',
                        'For best results, please consider:',
                        '1. Open the file in Microsoft Word',
                        '2. Save it as a new DOCX file (File > Save As > .docx)',
                        '3. Or convert to PDF format before adding watermarks',
                        '4. Keep the original file for reference',
                        '',
                        'The watermark has been successfully applied to protect',
                        'your document content.'
                    ];
                    
                    let y = height - 100;
                    const lineHeight = 20;
                    
                    // 添加标题
                    try {
                        infoPage.drawText('Watermark Applied Successfully', {
                            x: width / 2 - 120,
                            y: y,
                            size: 18,
                    color: PDFLib.rgb(0, 0, 0)
                });
                        y -= lineHeight * 2;
                        
                        // 添加信息文本
                        for (const line of infoLines.slice(2)) {
                            if (line) {
                                infoPage.drawText(line, {
                                    x: 50,
                                    y: y,
                                    size: 11,
                                    color: PDFLib.rgb(0.2, 0.2, 0.2)
                                });
                            }
                y -= lineHeight;
                        }
                    } catch (e) {
                        console.warn('添加信息文本时出错:', e);
                    }
            }

            updateProgress(60, '添加水印...');

            // 为所有页面添加水印
            const pages = pdfDoc.getPages();
            for (const page of pages) {
                const { width, height } = page.getSize();

                    // 添加中心水印
                    await addWatermarkToPage(pdfDoc, page, watermarkText, width / 2, height / 2, fontSize, color, opacity, rotation);

                // 添加多个水印以覆盖整个页面
                    const rows = Math.ceil(height / (fontSize * 3));
                    const cols = Math.ceil(width / (fontSize * 6));
                    
                    for (let row = 0; row < rows; row++) {
                        for (let col = 0; col < cols; col++) {
                            const x = (col + 0.5) * (width / cols);
                            const y = (row + 0.5) * (height / rows);
                            
                            await addWatermarkToPage(pdfDoc, page, watermarkText, x, y, fontSize * 0.8, color, opacity * 0.5, rotation);
                        }
                    }
            }

            updateProgress(80, '生成最终文件...');
            
            const pdfBytes = await pdfDoc.save();
            return URL.createObjectURL(new Blob([pdfBytes], { type: 'application/pdf' }));
                
            } catch (error) {
                console.error('处理DOC文件时出错:', error);
                throw new Error('DOC文件处理失败: ' + error.message);
            }
        }

        // 使用Canvas渲染中文文本为图片
        async function renderTextAsImage(text, fontSize = 14) {
            return new Promise((resolve) => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // 设置字体
                ctx.font = `${fontSize}px "Microsoft YaHei", "SimSun", sans-serif`;
                ctx.fillStyle = '#000000';
                ctx.textBaseline = 'top';
                
                // 计算文本尺寸
                const metrics = ctx.measureText(text);
                const width = Math.ceil(metrics.width) + 10;
                const height = fontSize + 10;
                
                // 设置canvas尺寸
                canvas.width = width;
                canvas.height = height;
                
                // 重新设置字体（canvas尺寸改变后需要重设）
                ctx.font = `${fontSize}px "Microsoft YaHei", "SimSun", sans-serif`;
                ctx.fillStyle = '#000000';
                ctx.textBaseline = 'top';
                
                // 绘制文本
                ctx.fillText(text, 5, 5);
                
                // 转换为base64
                const imageData = canvas.toDataURL('image/png');
                resolve({
                    imageData: imageData,
                    width: width,
                    height: height
                });
            });
        }

        // 获取中文字体 - 简化版本
        async function loadChineseFont(pdfDoc) {
            // 暂时不使用在线字体，直接返回null使用Canvas方案
            console.log('使用Canvas渲染中文方案');
            return null;
        }

        // 使用Canvas渲染混合文本到PDF
        async function renderTextWithCanvas(pdfDoc, page, text, x, y, fontSize) {
            try {
                // 将文本渲染为图片
                const imageInfo = await renderTextAsImage(text, fontSize);
                
                // 将图片嵌入PDF
                const image = await pdfDoc.embedPng(imageInfo.imageData);
                
                // 计算图片缩放比例
                const scale = fontSize / 14; // 基准字体大小是14
                const scaledWidth = imageInfo.width * scale;
                const scaledHeight = imageInfo.height * scale;
                
                // 在PDF中绘制图片
                page.drawImage(image, {
                    x: x,
                    y: y - scaledHeight + fontSize, // 调整y位置使其与文本基线对齐
                    width: scaledWidth,
                    height: scaledHeight
                });
                
                return scaledWidth; // 返回宽度，用于后续定位
            } catch (error) {
                console.warn('Canvas渲染失败，使用备用方案:', error.message);
                // 备用方案：分离显示
                await renderMixedTextFallback(page, text, x, y, fontSize);
            }
        }

        // 备用的分离显示方案
        async function renderMixedTextFallback(page, text, x, y, fontSize) {
            // 将文本分成英文和中文部分
            const segments = [];
            let currentSegment = '';
            let isCurrentChinese = false;
            
            for (const char of text) {
                const isCharChinese = isChinese(char);
                
                if (isCharChinese !== isCurrentChinese) {
                    if (currentSegment) {
                        segments.push({ text: currentSegment, isChinese: isCurrentChinese });
                    }
                    currentSegment = char;
                    isCurrentChinese = isCharChinese;
                } else {
                    currentSegment += char;
                }
            }
            
            if (currentSegment) {
                segments.push({ text: currentSegment, isChinese: isCurrentChinese });
            }
            
            // 渲染各个段落
            let currentX = x;
            for (const segment of segments) {
                try {
                    if (segment.isChinese) {
                        // 中文段落用描述性文字表示
                        const chineseDesc = `[中文:${segment.text.length}字]`;
                        page.drawText(chineseDesc, {
                            x: currentX,
                            y: y,
                            size: fontSize * 0.9,
                            color: PDFLib.rgb(0.2, 0.4, 0.8)
                        });
                        currentX += chineseDesc.length * fontSize * 0.6;
                    } else {
                        // 英文段落正常显示
                        page.drawText(segment.text, {
                            x: currentX,
                            y: y,
                            size: fontSize,
                            color: PDFLib.rgb(0, 0, 0)
                        });
                        currentX += segment.text.length * fontSize * 0.6;
                    }
                } catch (e) {
                    console.warn('段落渲染失败:', e.message);
                }
            }
        }

        // 判断是否为中文字符
        function isChinese(char) {
            const code = char.charCodeAt(0);
            return code >= 0x4e00 && code <= 0x9fff;
        }

        // 检查文本是否包含中文
        function containsChinese(text) {
            return /[\u4e00-\u9fff]/.test(text);
        }

        // 添加水印到页面（支持中文）
        async function addWatermarkToPage(pdfDoc, page, watermarkText, x, y, fontSize, color, opacity, rotation) {
            try {
                if (containsChinese(watermarkText)) {
                    // 如果水印包含中文，使用Canvas渲染
                    console.log('水印包含中文，使用Canvas渲染');
                    await addChineseWatermark(pdfDoc, page, watermarkText, x, y, fontSize, color, opacity, rotation);
                } else {
                    // 如果是纯英文，直接使用文本
                    page.drawText(watermarkText, {
                        x: x,
                        y: y,
                        size: fontSize,
                        color: PDFLib.rgb(
                            parseInt(color.substr(1, 2), 16) / 255,
                            parseInt(color.substr(3, 2), 16) / 255,
                            parseInt(color.substr(5, 2), 16) / 255
                        ),
                        opacity: opacity,
                        rotate: PDFLib.degrees(rotation)
                    });
                }
            } catch (error) {
                console.warn('水印添加失败，使用备用文本:', error.message);
                // 备用方案
                page.drawText('WATERMARK', {
                    x: x,
                    y: y,
                    size: fontSize,
                    color: PDFLib.rgb(
                        parseInt(color.substr(1, 2), 16) / 255,
                        parseInt(color.substr(3, 2), 16) / 255,
                        parseInt(color.substr(5, 2), 16) / 255
                    ),
                    opacity: opacity,
                    rotate: PDFLib.degrees(rotation)
                });
            }
        }

        // 添加中文水印（使用Canvas渲染）
        async function addChineseWatermark(pdfDoc, page, watermarkText, x, y, fontSize, color, opacity, rotation) {
            try {
                // 创建带颜色和透明度的Canvas
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // 设置字体和样式
                ctx.font = `${fontSize}px "Microsoft YaHei", "SimSun", sans-serif`;
                ctx.textBaseline = 'middle';
                ctx.textAlign = 'center';
                
                // 计算文本尺寸
                const metrics = ctx.measureText(watermarkText);
                const textWidth = Math.ceil(metrics.width);
                const textHeight = fontSize;
                
                // 考虑旋转后的尺寸
                const radians = (rotation * Math.PI) / 180;
                const rotatedWidth = Math.abs(textWidth * Math.cos(radians)) + Math.abs(textHeight * Math.sin(radians));
                const rotatedHeight = Math.abs(textWidth * Math.sin(radians)) + Math.abs(textHeight * Math.cos(radians));
                
                // 设置canvas尺寸（增加边距）
                canvas.width = rotatedWidth + 20;
                canvas.height = rotatedHeight + 20;
                
                // 重新设置字体（canvas尺寸改变后需要重设）
                ctx.font = `${fontSize}px "Microsoft YaHei", "SimSun", sans-serif`;
                ctx.textBaseline = 'middle';
                ctx.textAlign = 'center';
                
                // 设置颜色和透明度
                const r = parseInt(color.substr(1, 2), 16);
                const g = parseInt(color.substr(3, 2), 16);
                const b = parseInt(color.substr(5, 2), 16);
                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${opacity})`;
                
                // 移动到canvas中心并旋转
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.rotate(radians);
                
                // 绘制文本
                ctx.fillText(watermarkText, 0, 0);
                
                // 转换为PNG并嵌入PDF
                const imageData = canvas.toDataURL('image/png');
                const image = await pdfDoc.embedPng(imageData);
                
                // 在PDF中绘制图片
                page.drawImage(image, {
                    x: x - canvas.width / 2,
                    y: y - canvas.height / 2,
                    width: canvas.width,
                    height: canvas.height
                });
                
                console.log('中文水印添加成功');
            } catch (error) {
                console.error('中文水印渲染失败:', error);
                throw error;
            }
        }

        // ZIP文件验证函数
        async function validateZipFile(uint8Array) {
            try {
                // 检查ZIP文件签名
                // ZIP文件应该以 PK (0x50 0x4B) 开头
                if (uint8Array.length < 4) {
                    console.error('文件太小，不是有效的ZIP文件');
                    return false;
                }
                
                const signature = uint8Array.slice(0, 2);
                const isPK = signature[0] === 0x50 && signature[1] === 0x4B;
                
                console.log('ZIP签名检查:', isPK ? '通过' : '失败', 
                    `(${signature[0].toString(16)} ${signature[1].toString(16)})`);
                
                if (!isPK) {
                    return false;
                }
                
                // 尝试用JSZip快速验证
                try {
                    const testZip = await JSZip.loadAsync(uint8Array.buffer);
                    const hasDocumentXml = testZip.file('word/document.xml') !== null;
                    console.log('DOCX结构检查:', hasDocumentXml ? '通过' : '失败');
                    return hasDocumentXml;
                } catch (e) {
                    console.error('ZIP结构验证失败:', e.message);
                    return false;
                }
                
            } catch (error) {
                console.error('ZIP验证过程出错:', error);
                return false;
            }
        }

        // 注意：老版本DOC文件格式复杂，无法可靠地提取中文内容
        // 建议用户将文件转换为DOCX格式或使用PDF格式
    </script>
