<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>链接保鲜存档器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            padding: 40px;
        }

        .input-section {
            background: #f8f9ff;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border: 2px solid #e1e8ff;
        }

        .url-input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .url-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .url-input:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }

        .archive-btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 120px;
        }

        .archive-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .archive-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .options {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .option-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .option-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #4facfe;
        }

        .option-group label {
            font-weight: 500;
            color: #333;
        }

        .status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            font-weight: 500;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .preview-section {
            background: #fff;
            border-radius: 15px;
            border: 2px solid #e1e8ff;
            overflow: hidden;
            display: none;
        }

        .preview-header {
            background: #f8f9ff;
            padding: 20px;
            border-bottom: 1px solid #e1e8ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .preview-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
        }

        .preview-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #4facfe;
            color: white;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .preview-content {
            padding: 20px;
            max-height: 500px;
            overflow-y: auto;
        }

        .iframe-container {
            width: 100%;
            height: 400px;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .crop-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            display: none;
            cursor: crosshair;
        }

        .crop-selection {
            position: absolute;
            border: 2px dashed #4facfe;
            background: rgba(79, 172, 254, 0.1);
            display: none;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4facfe;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .archive-list {
            margin-top: 30px;
        }

        .archive-item {
            background: #f8f9ff;
            border: 1px solid #e1e8ff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .archive-info h3 {
            color: #333;
            margin-bottom: 5px;
        }

        .archive-info p {
            color: #666;
            font-size: 14px;
        }

        .archive-actions {
            display: flex;
            gap: 10px;
        }

        @media (max-width: 768px) {
            .url-input-group {
                flex-direction: column;
            }
            
            .options {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .archive-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔗 链接保鲜存档器</h1>
            <p>快速保存网页快照，防止内容丢失或被修改</p>
        </div>

        <div class="main-content">
            <div class="input-section">
                <div class="url-input-group">
                    <input type="url" class="url-input" id="urlInput" placeholder="请输入要存档的网址 (例如: https://example.com)">
                    <button class="archive-btn" id="archiveBtn">
                        <span id="btnText">开始存档</span>
                        <span id="btnLoading" class="loading" style="display: none;"></span>
                    </button>
                </div>
                
                <div class="options">
                    <div class="option-group">
                        <input type="checkbox" id="saveHtml" checked>
                        <label for="saveHtml">保存为HTML</label>
                    </div>
                    <div class="option-group">
                        <input type="checkbox" id="saveImage">
                        <label for="saveImage">保存为图片</label>
                    </div>
                    <div class="option-group">
                        <input type="checkbox" id="enableCrop">
                        <label for="enableCrop">启用裁剪</label>
                    </div>
                    <div class="option-group">
                        <input type="checkbox" id="includeResources" checked>
                        <label for="includeResources">包含资源文件</label>
                    </div>
                </div>
            </div>

            <div class="status" id="statusMessage"></div>

            <div class="preview-section" id="previewSection">
                <div class="preview-header">
                    <div class="preview-title" id="previewTitle">预览存档内容</div>
                    <div class="preview-actions">
                        <button class="btn btn-primary" id="cropBtn" style="display: none;">裁剪选择</button>
                        <button class="btn btn-success" id="downloadBtn">下载存档</button>
                        <button class="btn btn-secondary" id="shareBtn">生成分享链接</button>
                    </div>
                </div>
                <div class="preview-content" id="previewContent">
                    <!-- 预览内容将在这里显示 -->
                </div>
            </div>

            <div class="archive-list" id="archiveList">
                <h2>存档历史</h2>
                <!-- 存档历史将在这里显示 -->
            </div>
        </div>
    </div>

    <div class="crop-overlay" id="cropOverlay">
        <div class="crop-selection" id="cropSelection"></div>
    </div>

    <script>
        class LinkArchiver {
            constructor() {
                this.archives = JSON.parse(localStorage.getItem('archives') || '[]');
                this.currentArchive = null;
                this.initializeEventListeners();
                this.loadArchiveHistory();
            }

            initializeEventListeners() {
                document.getElementById('archiveBtn').addEventListener('click', () => this.startArchive());
                document.getElementById('urlInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.startArchive();
                });
                document.getElementById('downloadBtn').addEventListener('click', () => this.downloadArchive());
                document.getElementById('shareBtn').addEventListener('click', () => this.generateShareLink());
                document.getElementById('cropBtn').addEventListener('click', () => this.startCrop());
                document.getElementById('cropOverlay').addEventListener('click', (e) => this.handleCropSelection(e));
            }

            showStatus(message, type = 'info') {
                const statusEl = document.getElementById('statusMessage');
                statusEl.textContent = message;
                statusEl.className = `status ${type}`;
                statusEl.style.display = 'block';
                
                setTimeout(() => {
                    statusEl.style.display = 'none';
                }, 5000);
            }

            setLoading(loading) {
                const btn = document.getElementById('archiveBtn');
                const btnText = document.getElementById('btnText');
                const btnLoading = document.getElementById('btnLoading');
                
                btn.disabled = loading;
                btnText.style.display = loading ? 'none' : 'inline';
                btnLoading.style.display = loading ? 'inline-block' : 'none';
            }

            async startArchive() {
                const url = document.getElementById('urlInput').value.trim();
                if (!url) {
                    this.showStatus('请输入有效的网址', 'error');
                    return;
                }

                if (!this.isValidUrl(url)) {
                    this.showStatus('请输入有效的URL格式', 'error');
                    return;
                }

                this.setLoading(true);
                this.showStatus('正在获取网页内容...', 'info');

                try {
                    await this.archiveWebpage(url);
                } catch (error) {
                    this.showStatus(`存档失败: ${error.message}`, 'error');
                } finally {
                    this.setLoading(false);
                }
            }

            isValidUrl(string) {
                try {
                    new URL(string);
                    return true;
                } catch (_) {
                    return false;
                }
            }

            async archiveWebpage(url) {
                // 由于浏览器的CORS限制，我们使用代理服务或模拟存档过程
                // 在实际应用中，这里需要后端服务支持
                
                const saveHtml = document.getElementById('saveHtml').checked;
                const saveImage = document.getElementById('saveImage').checked;
                const includeResources = document.getElementById('includeResources').checked;

                // 模拟网页获取过程
                await this.simulateArchiveProcess(url, saveHtml, saveImage, includeResources);
            }

            async simulateArchiveProcess(url, saveHtml, saveImage, includeResources) {
                // 创建一个iframe来加载目标网页（受CORS限制）
                const iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                document.body.appendChild(iframe);

                try {
                    // 尝试通过代理服务获取网页内容
                    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
                    const response = await fetch(proxyUrl);
                    const data = await response.json();
                    
                    if (data.contents) {
                        await this.processWebpageContent(url, data.contents, saveHtml, saveImage);
                    } else {
                        throw new Error('无法获取网页内容');
                    }
                } catch (error) {
                    // 如果代理失败，创建一个示例存档
                    await this.createSampleArchive(url, saveHtml, saveImage);
                } finally {
                    document.body.removeChild(iframe);
                }
            }

            async processWebpageContent(url, content, saveHtml, saveImage) {
                const archive = {
                    id: Date.now(),
                    url: url,
                    title: this.extractTitle(content) || '未知标题',
                    timestamp: new Date().toISOString(),
                    content: content,
                    formats: []
                };

                if (saveHtml) {
                    archive.formats.push({
                        type: 'html',
                        data: this.processHtmlContent(content, url)
                    });
                }

                if (saveImage) {
                    // 在实际应用中，这里会生成网页截图
                    archive.formats.push({
                        type: 'image',
                        data: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg=='
                    });
                }

                this.currentArchive = archive;
                this.archives.unshift(archive);
                this.saveArchives();
                this.showPreview(archive);
                this.loadArchiveHistory();
                this.showStatus('存档完成！', 'success');
            }

            async createSampleArchive(url, saveHtml, saveImage) {
                const sampleContent = `
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <title>存档示例 - ${url}</title>
                        <meta charset="UTF-8">
                        <style>
                            body { font-family: Arial, sans-serif; padding: 20px; }
                            .archive-notice { background: #e3f2fd; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
                        </style>
                    </head>
                    <body>
                        <div class="archive-notice">
                            <h2>🔗 链接存档</h2>
                            <p><strong>原始URL:</strong> ${url}</p>
                            <p><strong>存档时间:</strong> ${new Date().toLocaleString()}</p>
                            <p><strong>说明:</strong> 由于浏览器安全限制，这是一个示例存档。在实际部署中，需要后端服务支持跨域请求。</p>
                        </div>
                        <h1>网页存档示例</h1>
                        <p>这里显示的是存档的网页内容。在实际应用中，这里会包含完整的原始网页内容。</p>
                        <p>存档功能包括：</p>
                        <ul>
                            <li>完整的HTML内容保存</li>
                            <li>CSS样式保存</li>
                            <li>图片和资源文件内联</li>
                            <li>JavaScript代码保存（可选）</li>
                        </ul>
                    </body>
                    </html>
                `;

                await this.processWebpageContent(url, sampleContent, saveHtml, saveImage);
            }

            extractTitle(html) {
                const titleMatch = html.match(/<title[^>]*>([^<]+)<\/title>/i);
                return titleMatch ? titleMatch[1].trim() : null;
            }

            processHtmlContent(content, baseUrl) {
                // 处理相对URL，内联CSS和图片等
                let processedContent = content;
                
                // 添加存档信息
                const archiveInfo = `
                    <div style="background: #f0f8ff; border: 2px solid #4facfe; padding: 15px; margin: 10px 0; border-radius: 8px; font-family: Arial, sans-serif;">
                        <h3 style="margin: 0 0 10px 0; color: #333;">📁 网页存档信息</h3>
                        <p style="margin: 5px 0;"><strong>原始URL:</strong> <a href="${baseUrl}" target="_blank">${baseUrl}</a></p>
                        <p style="margin: 5px 0;"><strong>存档时间:</strong> ${new Date().toLocaleString()}</p>
                        <p style="margin: 5px 0;"><strong>存档工具:</strong> 链接保鲜存档器</p>
                    </div>
                `;
                
                // 在body标签后插入存档信息
                processedContent = processedContent.replace(/<body[^>]*>/i, (match) => match + archiveInfo);
                
                return processedContent;
            }

            showPreview(archive) {
                const previewSection = document.getElementById('previewSection');
                const previewTitle = document.getElementById('previewTitle');
                const previewContent = document.getElementById('previewContent');
                const cropBtn = document.getElementById('cropBtn');

                previewTitle.textContent = `预览: ${archive.title}`;
                previewSection.style.display = 'block';

                // 显示HTML预览
                const htmlFormat = archive.formats.find(f => f.type === 'html');
                if (htmlFormat) {
                    const iframe = document.createElement('iframe');
                    iframe.className = 'iframe-container';
                    iframe.srcdoc = htmlFormat.data;
                    iframe.style.width = '100%';
                    iframe.style.height = '400px';
                    iframe.style.border = '1px solid #ddd';
                    iframe.style.borderRadius = '8px';
                    
                    previewContent.innerHTML = '';
                    previewContent.appendChild(iframe);
                }

                // 显示裁剪按钮
                if (document.getElementById('enableCrop').checked) {
                    cropBtn.style.display = 'inline-block';
                }
            }

            startCrop() {
                const overlay = document.getElementById('cropOverlay');
                overlay.style.display = 'block';
                this.showStatus('请拖拽选择要裁剪的区域', 'info');
            }

            handleCropSelection(e) {
                if (e.target.id === 'cropOverlay') {
                    document.getElementById('cropOverlay').style.display = 'none';
                    this.showStatus('裁剪已取消', 'info');
                }
            }

            downloadArchive() {
                if (!this.currentArchive) {
                    this.showStatus('没有可下载的存档', 'error');
                    return;
                }

                const htmlFormat = this.currentArchive.formats.find(f => f.type === 'html');
                if (htmlFormat) {
                    const blob = new Blob([htmlFormat.data], { type: 'text/html' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `archive_${this.currentArchive.id}.html`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    
                    this.showStatus('存档文件已下载', 'success');
                }
            }

            generateShareLink() {
                if (!this.currentArchive) {
                    this.showStatus('没有可分享的存档', 'error');
                    return;
                }

                // 生成一个模拟的分享链接
                const shareId = btoa(this.currentArchive.id.toString()).replace(/[^a-zA-Z0-9]/g, '');
                const shareUrl = `${window.location.origin}${window.location.pathname}?archive=${shareId}`;
                
                navigator.clipboard.writeText(shareUrl).then(() => {
                    this.showStatus('分享链接已复制到剪贴板', 'success');
                }).catch(() => {
                    prompt('分享链接:', shareUrl);
                });
            }

            saveArchives() {
                localStorage.setItem('archives', JSON.stringify(this.archives));
            }

            loadArchiveHistory() {
                const archiveList = document.getElementById('archiveList');
                const historyHtml = this.archives.map(archive => `
                    <div class="archive-item">
                        <div class="archive-info">
                            <h3>${archive.title}</h3>
                            <p>${archive.url}</p>
                            <p>存档时间: ${new Date(archive.timestamp).toLocaleString()}</p>
                        </div>
                        <div class="archive-actions">
                            <button class="btn btn-primary" onclick="archiver.viewArchive(${archive.id})">查看</button>
                            <button class="btn btn-success" onclick="archiver.downloadArchiveById(${archive.id})">下载</button>
                            <button class="btn btn-secondary" onclick="archiver.deleteArchive(${archive.id})">删除</button>
                        </div>
                    </div>
                `).join('');
                
                archiveList.innerHTML = `<h2>存档历史 (${this.archives.length})</h2>` + historyHtml;
            }

            viewArchive(id) {
                const archive = this.archives.find(a => a.id === id);
                if (archive) {
                    this.currentArchive = archive;
                    this.showPreview(archive);
                    document.getElementById('previewSection').scrollIntoView({ behavior: 'smooth' });
                }
            }

            downloadArchiveById(id) {
                const archive = this.archives.find(a => a.id === id);
                if (archive) {
                    this.currentArchive = archive;
                    this.downloadArchive();
                }
            }

            deleteArchive(id) {
                if (confirm('确定要删除这个存档吗？')) {
                    this.archives = this.archives.filter(a => a.id !== id);
                    this.saveArchives();
                    this.loadArchiveHistory();
                    this.showStatus('存档已删除', 'success');
                }
            }
        }

        // 初始化应用
        const archiver = new LinkArchiver();

        // 检查是否有分享的存档需要显示
        const urlParams = new URLSearchParams(window.location.search);
        const archiveParam = urlParams.get('archive');
        if (archiveParam) {
            // 在实际应用中，这里会从服务器获取分享的存档
            archiver.showStatus('正在加载分享的存档...', 'info');
        }
    </script>
</body>
</html>
