<!DOCTYPE html>

    </script>
    <style type="text/tailwindcss">
        @layer utilities {

            }

</head>
<body class="bg-gray-50 text-dark font-sans min-h-screen flex flex-col">
    <!-- 顶部导航栏 -->
    <header class="bg-white shadow-sm sticky top-0 z-50 transition-custom">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa fa-envelope-o text-primary text-2xl"></i>

            </div>
            <div class="hidden md:flex items-center space-x-4">

    <!-- 主内容区 -->
    <main class="container mx-auto px-4 py-6 flex-grow">
        <!-- 介绍部分 -->
        <section class="mb-6 text-center">

            <p class="text-gray-600 max-w-2xl mx-auto text-[clamp(0.9rem,1.2vw,1rem)]">
                输入中文邮件内容，自动翻译为专业商务英文，保留原始格式，支持人工修改，让您的英文邮件既准确又得体。
            </p>
        </section>

        <!-- 翻译区域 -->
        <section class="max-w-6xl mx-auto">
            <div class="bg-white rounded-xl shadow-md overflow-hidden transform hover:shadow-lg transition-custom">
                <!-- 翻译工具栏 -->
                <div class="bg-neutral px-6 py-4 border-b border-gray-200 flex flex-wrap items-center justify-between gap-4">
                    <div class="flex items-center space-x-4">
                        <div class="flex items-center">
                            <span class="text-gray-700 font-medium mr-2">中文</span>
                            <i class="fa fa-pencil text-primary"></i>
                        </div>
                        <div class="h-5 border-r border-gray-300"></div>
                        <button id="translate-btn" class="bg-primary hover:bg-primary/90 text-white px-4 py-2 rounded-lg flex items-center transition-custom">
                            <i class="fa fa-exchange mr-2"></i>
                            <span>翻译为英文</span>
                        </button>
                        <div class="h-5 border-r border-gray-300"></div>
                        <div class="flex items-center">
                            <span class="text-gray-700 font-medium mr-2">英文</span>
                            <i class="fa fa-check-circle text-secondary"></i>
                        </div>
                    </div>
                    
                    <div class="flex items-center space-x-2">
                        <button id="clear-btn" class="text-gray-600 hover:text-primary px-3 py-1.5 rounded-lg border border-gray-300 hover:border-primary transition-custom">
                            <i class="fa fa-eraser mr-1"></i>清空
                        </button>
                        <button id="copy-btn" class="text-gray-600 hover:text-primary px-3 py-1.5 rounded-lg border border-gray-300 hover:border-primary transition-custom">
                            <i class="fa fa-copy mr-1"></i>复制结果
                        </button>
                    </div>
                </div>
                
                <!-- 翻译内容区 -->
                <div class="p-1 md:p-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- 中文输入区 -->
                        <div class="flex flex-col h-full">
                            <label for="chinese-input" class="text-gray-700 font-medium mb-2">中文邮件内容</label>
                            <div class="relative flex-grow">
                                <textarea id="chinese-input" class="w-full h-full p-4 editor-shadow rounded-lg border border-gray-300 focus:border-primary focus:ring-1 focus:ring-primary transition-custom resize-none" placeholder="请输入您的中文邮件内容...">尊敬的史密斯先生：

您好！

关于我们上周讨论的合作项目，我已经整理好了详细的计划书，现附上供您参考。

我们希望能在下周三上午10点与您进行一次简短的视频会议，讨论计划书中的细节。请告知您是否方便。

如有任何问题，请随时与我联系。

顺祝商祺！

李明
市场部经理</textarea>
                                <div class="absolute bottom-3 right-3 text-gray-500 text-sm">
                                    <span id="char-count">0</span> 字符
                                </div>
                            </div>
                        </div>
                        
                        <!-- 英文输出区 -->
                        <div class="flex flex-col h-full">
                            <label for="english-output" class="text-gray-700 font-medium mb-2">英文翻译结果</label>
                            <div class="relative flex-grow">
                                <textarea id="english-output" class="w-full h-full p-4 editor-shadow rounded-lg border border-gray-300 bg-gray-50 focus:border-primary focus:ring-1 focus:ring-primary transition-custom resize-none" placeholder="翻译结果将显示在这里..." readonly></textarea>
                                <div id="edit-toggle" class="absolute top-3 right-3 text-sm">
                                    <button class="text-primary hover:text-primary/80 flex items-center transition-custom">
                                        <i class="fa fa-pencil mr-1"></i>
                                        <span>编辑</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 提示信息 -->
                <div class="bg-primary/5 px-6 py-3 border-t border-primary/20 text-sm text-gray-700">
                    <i class="fa fa-info-circle text-primary mr-2"></i>
                    <span>提示：翻译结果针对商务场景优化，您可以点击"编辑"按钮对翻译内容进行调整。</span>
                </div>
            </div>
        </section>
        
        <!-- 邮件模板区域 -->
        <section class="mt-8 max-w-6xl mx-auto">
            <div class="bg-white rounded-xl shadow-md overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-200">
                    <h3 class="font-semibold text-gray-800">常用邮件模板</h3>
                </div>
                
                <div class="p-4 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                    <button class="template-btn p-3 border border-gray-200 rounded-lg hover:border-primary hover:bg-primary/5 text-left transition-custom text-sm">
                        <div class="font-medium text-gray-800 mb-1">初次联系客户</div>
                        <div class="text-gray-600 line-clamp-2">用于首次与潜在客户建立联系，介绍公司和产品...</div>
                    </button>
                    
                    <button class="template-btn p-3 border border-gray-200 rounded-lg hover:border-primary hover:bg-primary/5 text-left transition-custom text-sm">
                        <div class="font-medium text-gray-800 mb-1">会议邀请</div>
                        <div class="text-gray-600 line-clamp-2">用于邀请客户或合作伙伴参加会议，包含时间地点...</div>
                    </button>
                    
                    <button class="template-btn p-3 border border-gray-200 rounded-lg hover:border-primary hover:bg-primary/5 text-left transition-custom text-sm">
                        <div class="font-medium text-gray-800 mb-1">项目跟进</div>
                        <div class="text-gray-600 line-clamp-2">用于向客户汇报项目进展，沟通下一步计划...</div>
                    </button>
                    
                    <button class="template-btn p-3 border border-gray-200 rounded-lg hover:border-primary hover:bg-primary/5 text-left transition-custom text-sm">
                        <div class="font-medium text-gray-800 mb-1">报价回复</div>
                        <div class="text-gray-600 line-clamp-2">用于回复客户的报价请求，包含价格和服务说明...</div>
                    </button>
                    
                    <button class="template-btn p-3 border border-gray-200 rounded-lg hover:border-primary hover:bg-primary/5 text-left transition-custom text-sm">
                        <div class="font-medium text-gray-800 mb-1">感谢合作</div>
                        <div class="text-gray-600 line-clamp-2">用于在合作达成后向客户表达感谢，巩固合作关系...</div>
                    </button>
                    
                    <button class="template-btn p-3 border border-gray-200 rounded-lg hover:border-primary hover:bg-primary/5 text-left transition-custom text-sm">
                        <div class="font-medium text-gray-800 mb-1">道歉信函</div>
                        <div class="text-gray-600 line-clamp-2">用于因延误或失误向客户道歉，表达改进意愿...</div>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer class="bg-dark text-white py-6 mt-12">
        <div class="container mx-auto px-4">
            <div class="text-center">
                <p class="text-gray-300">
                    邓文涛(AI版) | <a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="9daaadaaa8a9aaa9a9acddececb3fef2f0">[email&#160;protected]</a> | VX：707547441 | 更多点击➡️
                    <a href="https://dkfile.com/Dx25214" target="_blank" rel="noopener" class="text-secondary hover:underline inline-flex items-center">
                        🌌
                    </a>
                </p>
                <p class="text-gray-500 text-sm mt-2">© 2023 中英文邮件翻译工具 - 助力专业商务沟通</p>
            </div>
        </div>
    </footer>

    <!-- 通知提示框 -->
    <div id="notification" class="fixed bottom-5 right-5 px-4 py-3 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-custom flex items-center">
        <i id="notification-icon" class="mr-2 text-xl"></i>
        <span id="notification-text"></span>
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // DOM 元素
        const chineseInput = document.getElementById('chinese-input');
        const englishOutput = document.getElementById('english-output');
        const translateBtn = document.getElementById('translate-btn');
        const clearBtn = document.getElementById('clear-btn');
        const copyBtn = document.getElementById('copy-btn');
        const editToggle = document.getElementById('edit-toggle');
        const charCount = document.getElementById('char-count');
        const notification = document.getElementById('notification');
        const notificationIcon = document.getElementById('notification-icon');
        const notificationText = document.getElementById('notification-text');
        const templateBtns = document.querySelectorAll('.template-btn');
        
        // 示例翻译数据（模拟DeepL API返回结果）
        const sampleTranslations = {
            "尊敬的史密斯先生：\n\n您好！\n\n关于我们上周讨论的合作项目，我已经整理好了详细的计划书，现附上供您参考。\n\n我们希望能在下周三上午10点与您进行一次简短的视频会议，讨论计划书中的细节。请告知您是否方便。\n\n如有任何问题，请随时与我联系。\n\n顺祝商祺！\n\n李明\n市场部经理": 
            "Dear Mr. Smith,\n\nHello!\n\nRegarding the cooperation project we discussed last week, I have prepared a detailed plan, which is attached for your reference.\n\nWe hope to have a brief video conference with you at 10:00 AM next Wednesday to discuss the details in the plan. Please let us know if this time is convenient for you.\n\nIf you have any questions, please feel free to contact me.\n\nSincerely,\n\nLi Ming\nMarketing Manager"
        };
        
        // 常用邮件模板
        const emailTemplates = {
            "初次联系客户": "尊敬的[客户名称]先生/女士：\n\n您好！我是[您的公司]的[您的姓名]，负责[您的职位]。我们是一家专注于[公司业务]的企业，了解到贵公司在[客户业务领域]取得了卓越成就。\n\n我们认为双方在[合作点]方面有很大的合作空间，希望能有机会与您进一步沟通。\n\n期待您的回复。\n\n此致\n\n[您的姓名]\n[您的职位]",
            
            "会议邀请": "尊敬的[客户名称]：\n\n您好！\n\n为了更好地推进[项目名称]，我们提议于[日期] [时间]举行一次会议，讨论[会议主题]。\n\n会议地点：[地点/线上会议链接]\n会议时长：[预计时长]\n\n请告知您是否方便参加。如时间不合适，也请提出您的建议时间。\n\n顺祝商祺！\n\n[您的姓名]"
        };

        // 计算字符数
        function updateCharCount() {
            charCount.textContent = chineseInput.value.length;
        }
        
        // 显示通知
        function showNotification(message, isSuccess = true) {
            notificationText.textContent = message;
            notificationIcon.className = isSuccess ? "fa fa-check-circle mr-2 text-xl text-green-500" : "fa fa-exclamation-circle mr-2 text-xl text-red-500";
            notification.classList.remove('translate-y-20', 'opacity-0');
            notification.classList.add(isSuccess ? 'bg-green-50 text-green-800' : 'bg-red-50 text-red-800');
            
            setTimeout(() => {
                notification.classList.add('translate-y-20', 'opacity-0');
                notification.classList.remove('bg-green-50', 'text-green-800', 'bg-red-50', 'text-red-800');
            }, 3000);
        }
        
        // 翻译功能（模拟API调用）
        function translateText() {
            const chineseText = chineseInput.value.trim();
            
            if (!chineseText) {
                showNotification('请输入中文邮件内容', false);
                return;
            }
            
            // 显示加载状态
            translateBtn.disabled = true;
            translateBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i><span>翻译中...</span>';
            
            // 模拟API请求延迟
            setTimeout(() => {
                let englishText = "";
                
                // 检查是否有预设的翻译结果，否则使用简单替换（实际应用中应调用真实API）
                if (sampleTranslations[chineseText]) {
                    englishText = sampleTranslations[chineseText];
                } else {
                    // 简单替换示例，实际应用中应调用DeepL API
                    englishText = "This is a sample translation of your email content. In a real application, this would be replaced with high-quality translation from DeepL API.\n\n[Translated content would appear here]";
                }
                
                englishOutput.value = englishText;
                showNotification('翻译完成');
                
                // 恢复按钮状态
                translateBtn.disabled = false;
                translateBtn.innerHTML = '<i class="fa fa-exchange mr-2"></i><span>翻译为英文</span>';
            }, 1500);
        }
        
        // 清空功能
        function clearContent() {
            chineseInput.value = "";
            englishOutput.value = "";
            updateCharCount();
            showNotification('内容已清空');
        }
        
        // 复制功能
        function copyToClipboard() {
            const textToCopy = englishOutput.value.trim();
            
            if (!textToCopy) {
                showNotification('没有可复制的内容', false);
                return;
            }
            
            englishOutput.select();
            document.execCommand('copy');
            showNotification('翻译结果已复制到剪贴板');
        }
        
        // 切换编辑模式
        function toggleEditMode() {
            const isReadonly = englishOutput.hasAttribute('readonly');
            
            if (isReadonly) {
                englishOutput.removeAttribute('readonly');
                englishOutput.classList.remove('bg-gray-50');
                editToggle.innerHTML = '<button class="text-primary hover:text-primary/80 flex items-center transition-custom"><i class="fa fa-check mr-1"></i><span>完成编辑</span></button>';
                showNotification('已进入编辑模式');
            } else {
                englishOutput.setAttribute('readonly', true);
                englishOutput.classList.add('bg-gray-50');
                editToggle.innerHTML = '<button class="text-primary hover:text-primary/80 flex items-center transition-custom"><i class="fa fa-pencil mr-1"></i><span>编辑</span></button>';
                showNotification('已保存编辑内容');
            }
        }
        
        // 加载模板
        function loadTemplate(templateKey) {
            if (emailTemplates[templateKey]) {
                chineseInput.value = emailTemplates[templateKey];
                updateCharCount();
                showNotification('模板已加载');
            } else {
                // 对于没有预设内容的模板，使用通用提示
                chineseInput.value = "尊敬的[收件人名称]：\n\n您好！\n\n[邮件正文内容]\n\n期待您的回复。\n\n此致\n\n[您的姓名]\n[您的职位]";
                updateCharCount();
                showNotification('模板已加载');
            }
        }
        
        // 事件监听
        chineseInput.addEventListener('input', updateCharCount);
        translateBtn.addEventListener('click', translateText);
        clearBtn.addEventListener('click', clearContent);
        copyBtn.addEventListener('click', copyToClipboard);
        editToggle.addEventListener('click', toggleEditMode);
        
        // 模板按钮事件
        templateBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const templateName = this.querySelector('div:first-child').textContent;
                loadTemplate(templateName);
            });
        });
        
        // 初始化字符计数
        updateCharCount();
        
        // 添加滚动效果
        window.addEventListener('scroll', function() {
            const header = document.querySelector('header');
            if (window.scrollY > 10) {
                header.classList.add('py-2', 'shadow');
                header.classList.remove('py-4', 'shadow-sm');
            } else {
                header.classList.add('py-4', 'shadow-sm');
                header.classList.remove('py-2', 'shadow');
            }
        });
    </script>
</body>
