<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线拼图游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            padding-bottom: 110px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 30px;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .upload-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .file-input {
            display: none;
        }

        .upload-btn {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .upload-btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        .settings {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .settings label {
            font-weight: bold;
            color: #555;
        }

        .settings input {
            padding: 8px 15px;
            border: 2px solid #ddd;
            border-radius: 20px;
            width: 80px;
            text-align: center;
        }

        .action-btns {
            text-align: center;
            margin-bottom: 30px;
        }

        .btn {
            background: #4CAF50;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            margin: 0 10px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .game-area {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .puzzle-container {
            position: relative;
            border: 3px solid #667eea;
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
        }

        .puzzle-piece {
            position: absolute;
            background-size: cover;
            cursor: move;
            transition: transform 0.3s;
            border: 1px solid #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .puzzle-piece:hover {
            transform: scale(1.05);
            z-index: 10;
        }

        .puzzle-piece.dragging {
            z-index: 100;
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .preview {
            max-width: 100%;
            max-height: 300px;
            margin: 20px 0;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .success-message {
            display: none;
            background: #4CAF50;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 24px;
            animation: bounce 0.5s;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            .settings {
                flex-direction: column;
                gap: 10px;
            }
            
            .puzzle-container {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>在线拼图游戏</h1>
        
        <div class="upload-section">
            <input type="file" id="fileInput" class="file-input" accept="image/*">
            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                上传图片
            </button>
            <img id="preview" class="preview" style="display: none;">
        </div>

        <div class="settings">
            <label>拼图数量：</label>
            <input type="number" id="puzzleCount" min="4" max="100" value="9" placeholder="数量">
            <span>x</span>
        </div>

        <div class="action-btns">
            <button class="btn" onclick="generatePuzzle()" disabled id="generateBtn">生成拼图</button>
            <button class="btn" onclick="shufflePuzzle()" disabled id="shuffleBtn">打散拼图</button>
            <button class="btn" onclick="resetGame()" disabled id="resetBtn">重新开始</button>
        </div>

        <div class="game-area" id="gameArea">
            <div class="puzzle-container" id="puzzleContainer"></div>
        </div>

        <div class="success-message" id="successMessage">
            🎉 恭喜你，完成了拼图！
        </div>

        <template id="site-footer">
        <style>
            .footer {
            position: fixed;   /* 贴底 */
            bottom: 55px;
            left: 0;
            width: 100%;
            padding: .75rem 1rem;
            font-size: 14px;
            background: #fafafa;
            border-top: 1px solid #eaeaea;
            display: flex;
            flex-wrap: wrap;
            gap: .5rem;
            justify-content: center;
            align-items: center;
            z-index: 999;
            }

            @media (max-width: 768px) {
                    .footer {
                        bottom: 47px;
                    }
                }
            .footer a { color: #0077cc; text-decoration: none; }
            .footer a:hover { text-decoration: underline; }

            .qr-wrapper { position: relative; display: inline-block; }
            .qr-img {
            /* 初始隐藏 */
            display: none;
            position: absolute;
            bottom: 1.8rem;   /* 调整图片出现的位置 */
            left: 50%;
            transform: translateX(-50%);
            max-width: 140px;
            border: 1px solid #ddd;
            background: #fff;
            padding: 4px;
            border-radius: 6px;
            box-shadow: 0 4px 12px rgba(0,0,0,.15);
            }
            .qr-wrapper:hover .qr-img { display: block; }
        </style>

        <div class="footer card">
            Created&nbsp;by：
            <!-- 广告示例 1 -->
                <span class="qr-wrapper">
                <a class="qr-link"
                    href="https://mp.weixin.qq.com/mp/profile_ext?action=home&__biz=MzI0MzUzOTEwMw==&scene=124#wechat_redirect"
                    target="_blank"
                    data-img="https://youke1.picui.cn/s1/2025/07/12/6872600d20281.jpg">系统1与系统2</a>
                <img class="qr-img" alt="系统1与系统2公众号二维码">
                </span>
            &nbsp;||&nbsp;广告位：
            <!-- 广告示例 1 -->
            <span class="qr-wrapper">
            <a class="qr-link"
                href="https://t.zsxq.com/SjYuX"
                target="_blank"
                data-img="https://youke1.picui.cn/s1/2025/07/12/6871f995b3e7a.jpg">AI编程星球</a>
            <img class="qr-img" alt="AI编程星球二维码">
            </span> |
            <!-- 广告示例 2 -->
            <span class="qr-wrapper">
            <a class="qr-link"
                href="https://t.zsxq.com/VTCya"
                target="_blank"
                data-img="https://youke1.picui.cn/s1/2025/07/12/6871f9c361e7d.jpg">副业避坑星球</a>
            <img class="qr-img" alt="副业避坑星球二维码">
            </span> |
            <!-- 广告示例 3（如果没有 data-img 就不会弹出图片） -->
            <span class="qr-wrapper">
            <a class="qr-link"
                href="https://www.xiaobot.net/p/ai07?refer=a9625ad2-ec04-4cc8-8549-7511079cb3b5"
                target="_blank"
                data-img="https://youke1.picui.cn/s1/2025/07/12/6871f9ef3edba.jpg">AI&nbsp;产品日报</a>
            <img class="qr-img" alt="AI产品日报二维码">
            </span> |
            <span class="qr-wrapper">
            <a class="qr-link"
                href="https://t.zsxq.com/jcaEa"
                target="_blank"
                data-img="https://youke1.picui.cn/s1/2025/07/12/6871fa39eab33.jpg">AI&nbsp;产品经理大本营</a>
            <img class="qr-img" alt="AI产品经理大本营二维码">
            </span>
        </div>
    </template>
    </div>

    <script>
        let currentImage = null;
        let puzzlePieces = [];
        let containerWidth = 0;
        let containerHeight = 0;
        let cols = 0;
        let rows = 0;
        let isDragging = false;
        let currentPiece = null;
        let startX = 0;
        let startY = 0;
        let offsetX = 0;
        let offsetY = 0;

        document.getElementById('fileInput').addEventListener('change', handleFileSelect);

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        currentImage = img;
                        const preview = document.getElementById('preview');
                        preview.src = e.target.result;
                        preview.style.display = 'block';
                        document.getElementById('generateBtn').disabled = false;
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function generatePuzzle() {
            const count = parseInt(document.getElementById('puzzleCount').value);
            if (!currentImage || count < 4) return;

            const gameArea = document.getElementById('gameArea');
            const container = document.getElementById('puzzleContainer');
            
            // 计算行列
            cols = Math.ceil(Math.sqrt(count));
            rows = Math.ceil(count / cols);
            
            // 设置容器大小
            const maxWidth = Math.min(600, window.innerWidth - 40);
            const aspectRatio = currentImage.width / currentImage.height;
            containerWidth = maxWidth;
            containerHeight = maxWidth / aspectRatio;
            
            container.style.width = containerWidth + 'px';
            container.style.height = containerHeight + 'px';
            
            // 清空容器
            container.innerHTML = '';
            puzzlePieces = [];
            
            // 创建拼图块
            const pieceWidth = containerWidth / cols;
            const pieceHeight = containerHeight / rows;
            
            for (let i = 0; i < count; i++) {
                const piece = document.createElement('div');
                piece.className = 'puzzle-piece';
                
                const col = i % cols;
                const row = Math.floor(i / cols);
                
                piece.style.width = pieceWidth + 'px';
                piece.style.height = pieceHeight + 'px';
                piece.style.left = (col * pieceWidth) + 'px';
                piece.style.top = (row * pieceHeight) + 'px';
                piece.style.backgroundImage = `url(${currentImage.src})`;
                piece.style.backgroundSize = `${containerWidth}px ${containerHeight}px`;
                piece.style.backgroundPosition = `-${col * pieceWidth}px -${row * pieceHeight}px`;
                
                piece.dataset.correctX = col * pieceWidth;
                piece.dataset.correctY = row * pieceHeight;
                
                container.appendChild(piece);
                puzzlePieces.push(piece);
                
                // 添加拖拽事件
                addDragEvents(piece);
            }
            
            gameArea.style.display = 'flex';
            document.getElementById('shuffleBtn').disabled = false;
            document.getElementById('resetBtn').disabled = false;
            document.getElementById('successMessage').style.display = 'none';
        }

        function shufflePuzzle() {
            const container = document.getElementById('puzzleContainer');
            const containerRect = container.getBoundingClientRect();
            
            puzzlePieces.forEach(piece => {
                const maxX = containerWidth - parseFloat(piece.style.width);
                const maxY = containerHeight - parseFloat(piece.style.height);
                
                const randomX = Math.random() * maxX;
                const randomY = Math.random() * maxY;
                
                piece.style.transition = 'all 1s ease-in-out';
                piece.style.left = randomX + 'px';
                piece.style.top = randomY + 'px';
                
                setTimeout(() => {
                    piece.style.transition = '';
                }, 1000);
            });
        }

        function addDragEvents(piece) {
            piece.addEventListener('mousedown', startDrag);
            piece.addEventListener('touchstart', startDrag);
            piece.addEventListener('mousemove', drag);
            piece.addEventListener('touchmove', drag);
            piece.addEventListener('mouseup', endDrag);
            piece.addEventListener('touchend', endDrag);
        }

        function startDrag(e) {
            e.preventDefault();
            isDragging = true;
            currentPiece = e.target;
            currentPiece.classList.add('dragging');
            
            const rect = currentPiece.getBoundingClientRect();
            const containerRect = document.getElementById('puzzleContainer').getBoundingClientRect();
            
            if (e.type === 'touchstart') {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            } else {
                startX = e.clientX;
                startY = e.clientY;
            }
            
            offsetX = rect.left - containerRect.left;
            offsetY = rect.top - containerRect.top;
        }

        function drag(e) {
            if (!isDragging || !currentPiece) return;
            e.preventDefault();
            
            const container = document.getElementById('puzzleContainer');
            const containerRect = container.getBoundingClientRect();
            
            let currentX, currentY;
            if (e.type === 'touchmove') {
                currentX = e.touches[0].clientX;
                currentY = e.touches[0].clientY;
            } else {
                currentX = e.clientX;
                currentY = e.clientY;
            }
            
            const deltaX = currentX - startX;
            const deltaY = currentY - startY;
            
            const newX = offsetX + deltaX;
            const newY = offsetY + deltaY;
            
            currentPiece.style.left = Math.max(0, Math.min(newX, containerWidth - parseFloat(currentPiece.style.width))) + 'px';
            currentPiece.style.top = Math.max(0, Math.min(newY, containerHeight - parseFloat(currentPiece.style.height))) + 'px';
        }

        function endDrag() {
            if (!currentPiece) return;
            
            currentPiece.classList.remove('dragging');
            snapToPosition(currentPiece);
            checkWin();
            
            isDragging = false;
            currentPiece = null;
        }

        function snapToPosition(piece) {
            const correctX = parseFloat(piece.dataset.correctX);
            const correctY = parseFloat(piece.dataset.correctY);
            const currentX = parseFloat(piece.style.left);
            const currentY = parseFloat(piece.style.top);
            
            const threshold = 20;
            
            if (Math.abs(currentX - correctX) < threshold && Math.abs(currentY - correctY) < threshold) {
                piece.style.transition = 'all 0.3s';
                piece.style.left = correctX + 'px';
                piece.style.top = correctY + 'px';
                piece.style.boxShadow = '0 0 10px #4CAF50';
                
                setTimeout(() => {
                    piece.style.transition = '';
                }, 300);
            }
        }

        function checkWin() {
            let allCorrect = true;
            
            puzzlePieces.forEach(piece => {
                const correctX = parseFloat(piece.dataset.correctX);
                const correctY = parseFloat(piece.dataset.correctY);
                const currentX = parseFloat(piece.style.left);
                const currentY = parseFloat(piece.style.top);
                
                if (Math.abs(currentX - correctX) > 5 || Math.abs(currentY - correctY) > 5) {
                    allCorrect = false;
                }
            });
            
            if (allCorrect && puzzlePieces.length > 0) {
                document.getElementById('successMessage').style.display = 'block';
            }
        }

        function resetGame() {
            document.getElementById('gameArea').style.display = 'none';
            document.getElementById('generateBtn').disabled = true;
            document.getElementById('shuffleBtn').disabled = true;
            document.getElementById('resetBtn').disabled = true;
            document.getElementById('successMessage').style.display = 'none';
            document.getElementById('preview').style.display = 'none';
            document.getElementById('fileInput').value = '';
            currentImage = null;
            puzzlePieces = [];
        }

        // 防止页面滚动
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        // 把模板克隆到页面底部
        document.addEventListener('DOMContentLoaded', () => {
            const tpl = document.getElementById('site-footer');
            if (tpl && 'content' in tpl) {
            document.body.appendChild(tpl.content.cloneNode(true));
            }

            // 用 data-img 填充 <img src>
            document.querySelectorAll('.qr-wrapper').forEach(w => {
            const link = w.querySelector('.qr-link');
            const img  = w.querySelector('.qr-img');
            if (link && img && link.dataset.img) {
                img.src = link.dataset.img.trim();
            }
            });
        });
    </script>
</body>
</html>
