    <!-- 提示消息 -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs">

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // DOM元素
        const stressForm = document.getElementById('stressForm');
        const stressCategory = document.getElementById('stressCategory');
        const stressLevel = document.getElementById('stressLevel');
        const stressDescription = document.getElementById('stressDescription');
        const historyTable = document.getElementById('historyTable');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        const refreshStatsBtn = document.getElementById('refreshStatsBtn');
        const timeFilterBtns = document.querySelectorAll('.time-filter-btn');
        const emptyState = document.getElementById('emptyState');
        const statsSection = document.getElementById('statsSection');
        const statsContainer = document.getElementById('statsContainer');
        
        const toast = document.getElementById('toast');
        const toastIcon = document.getElementById('toastIcon');
        const toastMessage = document.getElementById('toastMessage');
        
        // 图表实例
        let categoryPieChart = null;
        let stressTrendChart = null;
        
        // 压力源分类名称映射
        const categoryNames = {
            'meetings': '会议过多/低效',
            'deadline': '截止日期紧迫',
            'workload': '工作量过大',
            'colleagues': '同事/人际关系',
            'management': '管理层问题',
            'skills': '技能不足/学习压力',
            'balance': '工作生活平衡',
            'environment': '工作环境',
            'other': '其他'
        };
        
        // 初始化
        function init() {
            // 加载本地存储的记录
            loadStressRecords();
            // 设置事件监听器
            setupEventListeners();
            // 初始化图表
            initCharts();
            // 更新统计数据
            updateStatistics('week');
        }
        
        // 设置事件监听器
        function setupEventListeners() {
            // 表单提交
            stressForm.addEventListener('submit', function(e) {
                e.preventDefault();
                saveStressRecord();
            });
            
            // 清空历史记录
            clearHistoryBtn.addEventListener('click', clearAllRecords);
            
            // 刷新统计数据
            refreshStatsBtn.addEventListener('click', function() {
                const activePeriod = document.querySelector('.time-filter-btn.bg-primary').dataset.period;
                updateStatistics(activePeriod);
                showToast('统计数据已刷新');
            });
            
            // 时间范围筛选
            timeFilterBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    // 更新按钮样式
                    timeFilterBtns.forEach(b => {
                        b.classList.remove('bg-primary', 'text-white');
                        b.classList.add('bg-gray-100', 'text-gray-700');
                    });
                    this.classList.remove('bg-gray-100', 'text-gray-700');
                    this.classList.add('bg-primary', 'text-white');
                    
                    // 更新统计数据
                    updateStatistics(this.dataset.period);
                });
            });
        }
        
        // 初始化图表
        function initCharts() {
            // 初始化饼图
            const pieCtx = document.getElementById('categoryPieChart').getContext('2d');
            categoryPieChart = new Chart(pieCtx, {
                type: 'pie',
                data: {
                    labels: [],
                    datasets: [{
                        data: [],
                        backgroundColor: [
                            '#3b82f6', '#10b981', '#8b5cf6', '#f97316',
                            '#ef4444', '#eab308', '#6366f1', '#ec4899', '#64748b'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {
                                boxWidth: 12,
                                padding: 15,
                                font: {
                                    size: 11
                                }
                            }
                        }
                    }
                }
            });
            
            // 初始化趋势图
            const trendCtx = document.getElementById('stressTrendChart').getContext('2d');
            stressTrendChart = new Chart(trendCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: '平均压力值',
                        data: [],
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        tension: 0.4,
                        fill: true,
                        pointRadius: 4,
                        pointBackgroundColor: '#3b82f6'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 10,
                            title: {
                                display: true,
                                text: '压力程度'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }
        
        // 保存压力记录
        function saveStressRecord() {
            const category = stressCategory.value;
            const level = parseInt(stressLevel.value);
            const description = stressDescription.value.trim();
            
            // 验证表单
            if (!category) {
                showToast('请选择压力源分类', 'error');
                stressCategory.focus();
                return;
            }
            
            if (!description) {
                showToast('请描述压力事件', 'error');
                stressDescription.focus();
                return;
            }
            
            // 创建记录对象
            const record = {
                id: Date.now().toString(),
                category: category,
                level: level,
                description: description,
                date: new Date().toISOString()
            };
            
            // 获取现有记录
            let records = JSON.parse(localStorage.getItem('stressRecords') || '[]');
            records.unshift(record); // 添加到数组开头
            
            // 保存到本地存储
            localStorage.setItem('stressRecords', JSON.stringify(records));
            
            // 更新UI
            loadStressRecords();
            const activePeriod = document.querySelector('.time-filter-btn.bg-primary').dataset.period;
            updateStatistics(activePeriod);
            
            // 重置表单
            stressForm.reset();
            
            // 显示提示
            showToast('压力事件记录已保存');
        }
        
        // 加载压力记录
        function loadStressRecords() {
            const records = JSON.parse(localStorage.getItem('stressRecords') || '[]');
            
            // 更新历史记录表格
            if (records.length === 0) {
                historyTable.innerHTML = `
                    <tr>
                        <td colspan="5" class="py-8 px-4 text-center text-gray-500">
                            暂无压力事件记录
                        </td>
                    </tr>
                `;
                clearHistoryBtn.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                historyTable.innerHTML = '';
                records.forEach(record => {
                    const date = new Date(record.date);
                    const formattedDate = `${date.getFullYear()}-${(date.getMonth()+1).toString().padStart(2, '0')}-${date.getDate().toString().padStart(2, '0')}`;
                    
                    // 压力程度样式
                    let levelClass = '';
                    if (record.level <= 3) {
                        levelClass = 'bg-stressLow text-stressLowDark';
                    } else if (record.level <= 7) {
                        levelClass = 'bg-stressMedium text-stressMediumDark';
                    } else {
                        levelClass = 'bg-stressHigh text-stressHighDark';
                    }
                    
                    const row = document.createElement('tr');
                    row.className = 'hover:bg-gray-50 transition-colors';
                    row.innerHTML = `
                        <td class="py-3 px-4 whitespace-nowrap">${formattedDate}</td>
                        <td class="py-3 px-4 whitespace-nowrap">${categoryNames[record.category]}</td>
                        <td class="py-3 px-4 whitespace-nowrap">
                            <span class="px-2 py-1 rounded-full text-xs font-medium ${levelClass}">
                                ${record.level}
                            </span>
                        </td>
                        <td class="py-3 px-4">${record.description}</td>
                        <td class="py-3 px-4 whitespace-nowrap">
                            <button class="text-red-500 hover:text-red-700 delete-record" data-id="${record.id}">
                                <i class="fa fa-trash"></i>
                            </button>
                        </td>
                    `;
                    historyTable.appendChild(row);
                });
                
                // 添加删除事件监听
                document.querySelectorAll('.delete-record').forEach(btn => {
                    btn.addEventListener('click', function() {
                        deleteRecord(this.dataset.id);
                    });
                });
                
                clearHistoryBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }
        
        // 删除单条记录
        function deleteRecord(id) {
            if (confirm('确定要删除这条记录吗？')) {
                let records = JSON.parse(localStorage.getItem('stressRecords') || '[]');
                records = records.filter(record => record.id !== id);
                localStorage.setItem('stressRecords', JSON.stringify(records));
                
                // 更新UI
                loadStressRecords();
                const activePeriod = document.querySelector('.time-filter-btn.bg-primary').dataset.period;
                updateStatistics(activePeriod);
                
                showToast('记录已删除');
            }
        }
        
        // 清空所有记录
        function clearAllRecords() {
            if (confirm('确定要清空所有记录吗？此操作不可恢复。')) {
                localStorage.removeItem('stressRecords');
                
                // 更新UI
                loadStressRecords();
                updateStatistics('week');
                
                showToast('所有记录已清空');
            }
        }
        
        // 更新统计数据
        function updateStatistics(period) {
            const records = JSON.parse(localStorage.getItem('stressRecords') || '[]');
            
            // 过滤指定时间段的记录
            let filteredRecords = [];
            const now = new Date();
            
            if (period === 'week') {
                // 过去7天
                const oneWeekAgo = new Date();
                oneWeekAgo.setDate(now.getDate() - 7);
                filteredRecords = records.filter(record => new Date(record.date) >= oneWeekAgo);
            } else if (period === 'month') {
                // 过去30天
                const oneMonthAgo = new Date();
                oneMonthAgo.setDate(now.getDate() - 30);
                filteredRecords = records.filter(record => new Date(record.date) >= oneMonthAgo);
            } else {
                // 所有记录
                filteredRecords = records;
            }
            
            // 显示空状态或统计数据
            if (filteredRecords.length === 0) {
                emptyState.classList.remove('hidden');
                statsSection.classList.add('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
                statsSection.classList.remove('hidden');
            }
            
            // 计算分类统计
            const categoryStats = {};
            Object.keys(categoryNames).forEach(key => {
                categoryStats[key] = {
                    count: 0,
                    totalLevel: 0,
                    avgLevel: 0
                };
            });
            
            filteredRecords.forEach(record => {
                categoryStats[record.category].count++;
                categoryStats[record.category].totalLevel += record.level;
            });
            
            // 计算平均压力值
            Object.keys(categoryStats).forEach(key => {
                if (categoryStats[key].count > 0) {
                    categoryStats[key].avgLevel = (categoryStats[key].totalLevel / categoryStats[key].count).toFixed(1);
                }
            });
            
            // 更新饼图
            updatePieChart(categoryStats);
            
            // 计算每日平均压力
            const dailyStats = calculateDailyStats(filteredRecords);
            
            // 更新趋势图
            updateTrendChart(dailyStats);
            
            // 更新统计卡片
            updateStatsCards(categoryStats, filteredRecords);
        }
        
        // 计算每日统计数据
        function calculateDailyStats(records) {
            const dailyStats = {};
            
            // 按日期分组
            records.forEach(record => {
                const date = new Date(record.date);
                const dateStr = `${date.getFullYear()}-${(date.getMonth()+1).toString().padStart(2, '0')}-${date.getDate().toString().padStart(2, '0')}`;
                
                if (!dailyStats[dateStr]) {
                    dailyStats[dateStr] = {
                        totalLevel: 0,
                        count: 0,
                        avgLevel: 0
                    };
                }
                
                dailyStats[dateStr].totalLevel += record.level;
                dailyStats[dateStr].count++;
            });
            
            // 计算每日平均压力
            Object.keys(dailyStats).forEach(date => {
                dailyStats[date].avgLevel = (dailyStats[date].totalLevel / dailyStats[date].count).toFixed(1);
            });
            
            // 按日期排序
            const sortedDates = Object.keys(dailyStats).sort((a, b) => new Date(a) - new Date(b));
            const result = {
                dates: sortedDates,
                avgLevels: sortedDates.map(date => parseFloat(dailyStats[date].avgLevel))
            };
            
            return result;
        }
        
        // 更新饼图
        function updatePieChart(categoryStats) {
            const labels = [];
            const data = [];
            
            // 收集有记录的分类
            Object.keys(categoryStats).forEach(key => {
                if (categoryStats[key].count > 0) {
                    labels.push(categoryNames[key]);
                    data.push(categoryStats[key].count);
                }
            });
            
            // 更新图表数据
            categoryPieChart.data.labels = labels;
            categoryPieChart.data.datasets[0].data = data;
            categoryPieChart.update();
        }
        
        // 更新趋势图
        function updateTrendChart(dailyStats) {
            // 更新图表数据
            stressTrendChart.data.labels = dailyStats.dates;
            stressTrendChart.data.datasets[0].data = dailyStats.avgLevels;
            stressTrendChart.update();
        }
        
        // 更新统计卡片
        function updateStatsCards(categoryStats, records) {
            statsContainer.innerHTML = '';
            
            // 总体统计
            const totalCount = records.length;
            const totalLevel = records.reduce((sum, record) => sum + record.level, 0);
            const avgLevel = totalCount > 0 ? (totalLevel / totalCount).toFixed(1) : 0;
            
            let overallLevelClass = '';
            if (avgLevel <= 3) {
                overallLevelClass = 'text-stressLowDark';
            } else if (avgLevel <= 7) {
                overallLevelClass = 'text-stressMediumDark';
            } else {
                overallLevelClass = 'text-stressHighDark';
            }
            
            const overallCard = document.createElement('div');
            overallCard.className = 'bg-gray-50 p-4 rounded-lg';
            overallCard.innerHTML = `
                <h4 class="text-sm text-gray-500 mb-1">总压力事件</h4>
                <p class="text-2xl font-bold">${totalCount}</p>
                <p class="text-sm ${overallLevelClass} mt-1">平均压力值: ${avgLevel}</p>
            `;
            statsContainer.appendChild(overallCard);
            
            // 找出主要压力源
            let topCategory = '';
            let maxCount = 0;
            
            Object.keys(categoryStats).forEach(key => {
                if (categoryStats[key].count > maxCount) {
                    maxCount = categoryStats[key].count;
                    topCategory = key;
                }
            });
            
            if (topCategory) {
                const topCategoryCard = document.createElement('div');
                topCategoryCard.className = 'bg-primary/5 p-4 rounded-lg border border-primary/10';
                topCategoryCard.innerHTML = `
                    <h4 class="text-sm text-gray-500 mb-1">主要压力源</h4>
                    <p class="font-bold">${categoryNames[topCategory]}</p>
                    <p class="text-sm text-gray-600 mt-1">占比: ${Math.round((maxCount / totalCount) * 100)}%</p>
                `;
                statsContainer.appendChild(topCategoryCard);
            }
            
            // 压力最高的类别
            let highestStressCategory = '';
            let maxAvgLevel = 0;
            
            Object.keys(categoryStats).forEach(key => {
                if (categoryStats[key].count > 0 && parseFloat(categoryStats[key].avgLevel) > maxAvgLevel) {
                    maxAvgLevel = parseFloat(categoryStats[key].avgLevel);
                    highestStressCategory = key;
                }
            });
            
            if (highestStressCategory) {
                const highestStressCard = document.createElement('div');
                highestStressCard.className = 'bg-stressHigh/20 p-4 rounded-lg border border-stressHigh/30';
                highestStressCard.innerHTML = `
                    <h4 class="text-sm text-gray-500 mb-1">压力最大的来源</h4>
                    <p class="font-bold">${categoryNames[highestStressCategory]}</p>
                    <p class="text-sm text-stressHighDark mt-1">平均压力值: ${maxAvgLevel}</p>
                `;
                statsContainer.appendChild(highestStressCard);
            }
        }
        
        // 显示提示消息
        function showToast(message, type = 'success') {
            toastMessage.textContent = message;
            
            if (type === 'success') {
                toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs bg-green-50 text-green-800';
                toastIcon.className = 'fa fa-check-circle mr-2 text-green-500';
            } else if (type === 'error') {
                toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs bg-red-50 text-red-800';
                toastIcon.className = 'fa fa-exclamation-circle mr-2 text-red-500';
            } else if (type === 'info') {
                toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs bg-blue-50 text-blue-800';
                toastIcon.className = 'fa fa-info-circle mr-2 text-blue-500';
            }
            
            // 3秒后隐藏
            setTimeout(() => {
                toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs';
            }, 3000);
        }
        
        // 初始化应用
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
