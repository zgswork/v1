<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>星空画板</title>
  <style>
    :root {
      --panel: rgba(20,30,50,0.8);
      --panel-strong: rgba(30,40,70,0.9);
      --ink: #E8F4FD;
      --accent: #FFD700;
      --accent-2: #FF69B4;
      --glow: rgba(255,215,0,0.6);
      --bg-dark: #0A0E1A;
      --bg-mid: #1A1F2E;
      --bg-light: #2A2F3E;
    }
    html, body {
      height: 100%;
    }
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(ellipse at center, #1A1F2E 0%, #0A0E1A 70%, #000000 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: var(--ink);
    }
    #sky {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
    }
    .hud {
      position: fixed;
      top: 12px;
      right: 12px;
      display: grid;
      gap: 6px;
      grid-template-columns: 1fr;
      z-index: 10;
      user-select: none;
      max-width: 200px;
    }
    .card {
      background: var(--panel);
      border-radius: 12px;
      box-shadow: 0 3px 16px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,215,0,0.2);
      padding: 10px;
      backdrop-filter: blur(12px) saturate(1.5);
      -webkit-backdrop-filter: blur(12px) saturate(1.5);
      border: 1px solid rgba(255,215,0,0.1);
    }
    .title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      letter-spacing: 0.2px;
      font-size: 15px;
      color: var(--accent);
      text-shadow: 0 0 10px rgba(255,215,0,0.5);
    }
    .title .logo {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #FFD700, #FFA500);
      box-shadow: 0 0 12px rgba(255,215,0,0.6);
      position: relative;
    }
    .title .logo::after {
      content: '⭐';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 14px;
    }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
    .label { font-size: 11px; opacity: 0.9; font-weight: 500; }
    .brushes { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      appearance: none;
      border: none;
      background: var(--panel-strong);
      color: var(--ink);
      border-radius: 20px;
      padding: 8px 12px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0,0,0,0.3), inset 0 0 0 1px rgba(255,215,0,0.1);
      transition: all 0.3s ease;
      border: 1px solid rgba(255,215,0,0.1);
    }
    .chip:hover { 
      transform: translateY(-2px); 
      box-shadow: 0 6px 20px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,215,0,0.3);
    }
    .chip.active {
      background: linear-gradient(135deg, #FFD700, #FFA500);
      color: #000;
      box-shadow: 0 0 20px rgba(255,215,0,0.4);
      border: 1px solid rgba(255,215,0,0.5);
    }
    .slider {
      -webkit-appearance: none;
      appearance: none;
      height: 8px;
      border-radius: 10px;
      background: linear-gradient(90deg, #FFD700, #FFA500);
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.3);
      outline: none;
      flex: 1;
    }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px; height: 24px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #FFD700, #FFA500);
      box-shadow: 0 0 15px rgba(255,215,0,0.6);
      border: 2px solid #FFF;
      cursor: pointer;
    }
    .btn {
      appearance: none; border: none; cursor: pointer;
      padding: 10px 14px; border-radius: 14px;
      font-weight: 700; color: #000;
      background: linear-gradient(135deg, #FFD700, #FFA500);
      box-shadow: 0 4px 16px rgba(255,215,0,0.3);
      transition: all 0.3s ease;
      border: 1px solid rgba(255,215,0,0.3);
    }
    .btn:hover { 
      transform: translateY(-2px); 
      box-shadow: 0 8px 25px rgba(255,215,0,0.4);
    }
    .btn:active { transform: translateY(1px); }
    .btn.secondary { 
      background: linear-gradient(135deg, #4A90E2, #357ABD); 
      color: #FFF;
      box-shadow: 0 4px 16px rgba(74,144,226,0.3);
    }
    .footer {
      position: fixed; left: 16px; bottom: 16px; z-index: 10;
      background: var(--panel);
      padding: 10px 12px; border-radius: 16px; backdrop-filter: blur(12px);
      box-shadow: 0 6px 24px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,215,0,0.2);
      font-size: 11px; opacity: 0.9;
      border: 1px solid rgba(255,215,0,0.1);
    }
    .hint { font-size: 12px; opacity: 0.8; margin-bottom: 10px; }
    .sep { height: 1px; background: linear-gradient(90deg, transparent, rgba(255,215,0,0.3), transparent); margin: 10px 0; border-radius: 1px; }
    .toggle {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--panel-strong); padding: 8px 12px; border-radius: 16px;
      box-shadow: inset 0 0 0 1px rgba(255,215,0,0.1);
      border: 1px solid rgba(255,215,0,0.1);
    }
    .toggle input { width: 36px; height: 20px; }
    .kbd { 
      font-family: 'Courier New', monospace; 
      background: rgba(255,215,0,0.2); 
      padding: 2px 6px; 
      border-radius: 8px; 
      border: 1px solid rgba(255,215,0,0.3);
      color: #FFD700;
    }
         .controls {
       display: flex;
       gap: 12px;
       flex-wrap: wrap;
       justify-content: space-between;
     }
     .copyright {
       text-align: center;
       font-size: 11px;
       opacity: 0.7;
       color: var(--accent);
       margin-top: 8px;
       font-weight: 500;
     }
  </style>
  <meta name="description" content="在神秘的夜空中绘制闪烁的星星。多种笔刷效果，流星划过，保存你的星空杰作。"
  />
</head>
<body>
  <canvas id="sky"></canvas>

  <div class="hud">
    <div class="card">
      <div class="title"><div class="logo" aria-hidden="true"></div> 星空画板</div>
      <div class="hint">绘制闪烁的星星。它们在夜空中闪烁，流星划过。</div>
      <div class="sep"></div>
      <div class="row">
        <div style="min-width:60px" class="label">笔刷</div>
        <div class="brushes" id="brushes">
          <button class="chip active" data-shape="star" title="星星">⭐ 星星</button>
          <button class="chip" data-shape="sparkle" title="闪烁">✨ 闪烁</button>
          <button class="chip" data-shape="nebula" title="星云">🌌 星云</button>
          <button class="chip" data-shape="constellation" title="星座">🔮 星座</button>
        </div>
      </div>
      <div class="row">
        <div style="min-width:60px" class="label">大小</div>
        <input id="size" class="slider" type="range" min="8" max="120" value="40" />
        <div id="sizeVal" class="label"></div>
      </div>
      <div class="row">
        <div style="min-width:60px" class="label">亮度</div>
        <input id="brightness" class="slider" type="range" min="20" max="100" value="80" />
        <div id="brightnessVal" class="label"></div>
      </div>
      <div class="row">
        <div style="min-width:60px" class="label">闪烁</div>
        <input id="twinkle" class="slider" type="range" min="0" max="100" value="60" />
        <div id="twinkleVal" class="label"></div>
      </div>
      <div class="sep"></div>
             <div class="controls">
         <button class="btn secondary" id="clear">清空夜空</button>
         <div class="toggle"><input type="checkbox" id="meteorsToggle" checked /><label for="meteorsToggle">流星</label></div>
         <button class="btn" id="save">保存图片</button>
       </div>
       <div class="sep"></div>
       <div class="copyright">© 小莎研AI | 星空画板</div>
    </div>
  </div>

  <div class="footer">提示：拖拽绘制星星。尝试切换笔刷。按 <span class="kbd">S</span> 保存。</div>

  <script>
    const canvas = document.getElementById('sky');
    const ctx = canvas.getContext('2d');
    let W = canvas.width = window.innerWidth;
    let H = canvas.height = window.innerHeight;
    const DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    
    function resize() {
      W = canvas.width = Math.floor(window.innerWidth * DPR);
      H = canvas.height = Math.floor(window.innerHeight * DPR);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
    }
    resize();
    window.addEventListener('resize', resize);

    const state = {
      shape: 'star',
      size: 40,
      brightness: 0.8,
      twinkle: 0.6,
      painting: false,
      last: null,
      meteorsEnabled: true,
    };

    const MAX_STARS = 8000;
    const stars = [];

    function rand(a,b){ return a + Math.random()*(b-a); }
    function rint(a,b){ return Math.floor(rand(a,b+1)); }

    function addStar(s){
      if (stars.length > MAX_STARS) stars.splice(0, Math.floor(MAX_STARS*0.15));
      stars.push(s);
    }

    function spawnBrush(x,y) {
      const s = state.size * DPR;
      const baseBrightness = state.brightness;
      const twinkleIntensity = state.twinkle;
      
      if (state.shape === 'star') {
        addStar({
          x, y, r: s*rand(0.8,1.2), 
          brightness: baseBrightness*rand(0.7,1), 
          type: 'star', 
          twinkle: twinkleIntensity*rand(0.5,1.5),
          phase: rand(0,Math.PI*2),
          color: rand(0,1) > 0.8 ? '#FFD700' : '#FFFFFF'
        });
      } else if (state.shape === 'sparkle') {
        const count = rint(4,7);
        for (let i=0;i<count;i++) {
          const ang = rand(0, Math.PI*2);
          const dist = s*rand(0.1,0.3);
          const px = x + Math.cos(ang)*dist;
          const py = y + Math.sin(ang)*dist;
          addStar({
            x:px, y:py, r: s*rand(0.3,0.6), 
            brightness: baseBrightness*rand(0.6,1), 
            type: 'sparkle', 
            twinkle: twinkleIntensity*rand(0.8,1.2),
            phase: rand(0,Math.PI*2),
            color: '#FFD700'
          });
        }
      } else if (state.shape === 'nebula') {
        const count = rint(8,15);
        for (let i=0;i<count;i++) {
          const ang = rand(0, Math.PI*2);
          const dist = s*rand(0.05,0.4);
          const px = x + Math.cos(ang)*dist;
          const py = y + Math.sin(ang)*dist;
          addStar({
            x:px, y:py, r: s*rand(0.2,0.5), 
            brightness: baseBrightness*rand(0.4,0.8), 
            type: 'nebula', 
            twinkle: twinkleIntensity*rand(0.3,0.7),
            phase: rand(0,Math.PI*2),
            color: rand(0,1) > 0.5 ? '#FF69B4' : '#87CEEB'
          });
        }
      } else if (state.shape === 'constellation') {
        const count = rint(5,9);
        // 丰富多彩的星座颜色数组
        const constellationColors = [
          '#FFD700', // 金色
          '#FF69B4', // 粉红色
          '#87CEEB', // 天蓝色
          '#98FB98', // 淡绿色
          '#DDA0DD', // 梅红色
          '#F0E68C', // 卡其色
          '#FFA07A', // 浅鲑鱼色
          '#20B2AA', // 浅海绿色
          '#FF6347', // 番茄色
          '#9370DB', // 中等紫色
          '#00CED1', // 深青色
          '#FF8C00', // 深橙色
          '#32CD32', // 酸橙绿
          '#BA55D3', // 中等兰花紫
          '#FF1493'  // 深粉红色
        ];
        
        // 存储星座星星的位置，用于绘制连接线
        const constellationStars = [];
        
        for (let i=0;i<count;i++) {
          const ang = (i/count) * Math.PI * 2 + rand(-0.3,0.3);
          const dist = s*rand(0.1,0.25);
          const px = x + Math.cos(ang)*dist;
          const py = y + Math.sin(ang)*dist;
          
          // 随机选择颜色，增加相邻星星颜色变化的可能性
          const colorIndex = Math.floor(rand(0, constellationColors.length));
          const baseColor = constellationColors[colorIndex];
          
          // 为每个星星添加微妙的颜色变化
          const hueVariation = rand(-20, 20);
          const saturationVariation = rand(-15, 15);
          const lightnessVariation = rand(-10, 10);
          
          const starObj = {
            x:px, y:py, r: s*rand(0.4,0.7), 
            brightness: baseBrightness*rand(0.8,1), 
            type: 'constellation', 
            twinkle: twinkleIntensity*rand(0.6,1.4),
            phase: rand(0,Math.PI*2),
            color: baseColor,
            colorVariation: { hue: hueVariation, saturation: saturationVariation, lightness: lightnessVariation },
            constellationId: Math.floor(rand(0, 1000)) // 为星座分组
          };
          
          constellationStars.push(starObj);
          addStar(starObj);
        }
        
        // 添加星座连接线
        if (constellationStars.length > 1) {
          for (let i = 0; i < constellationStars.length - 1; i++) {
            const currentStar = constellationStars[i];
            const nextStar = constellationStars[i + 1];
            
            // 创建连接线对象
            addStar({
              x: (currentStar.x + nextStar.x) / 2,
              y: (currentStar.y + nextStar.y) / 2,
              r: s * 0.1,
              brightness: baseBrightness * 0.6,
              type: 'constellation_line',
              twinkle: twinkleIntensity * 0.8,
              phase: rand(0, Math.PI * 2),
              color: currentStar.color,
              startStar: currentStar,
              endStar: nextStar
            });
          }
        }
      }
    }

    const pointer = { x: 0, y: 0 };
    let lastStamp = null;
    
    function onPointerDown(e){
      state.painting = true;
      const rect = canvas.getBoundingClientRect();
      pointer.x = (e.clientX - rect.left) * DPR;
      pointer.y = (e.clientY - rect.top) * DPR;
      lastStamp = { x: pointer.x, y: pointer.y };
      spawnBrush(pointer.x, pointer.y);
    }
    
    function onPointerMove(e){
      const rect = canvas.getBoundingClientRect();
      pointer.x = (e.clientX - rect.left) * DPR;
      pointer.y = (e.clientY - rect.top) * DPR;
      if (!state.painting) return;
      const step = state.size * 0.4 * DPR;
      const dx = pointer.x - lastStamp.x, dy = pointer.y - lastStamp.y;
      const dist = Math.hypot(dx, dy);
      if (dist >= step) {
        const steps = Math.floor(dist / step);
        for (let i = 1; i <= steps; i++) {
          const t = i / steps;
          const ix = lastStamp.x + dx * t;
          const iy = lastStamp.y + dy * t;
          spawnBrush(ix, iy);
        }
        lastStamp.x = pointer.x; lastStamp.y = pointer.y;
      }
    }
    
    function onPointerUp(){ state.painting = false; }
    
    canvas.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);

    const brushesEl = document.getElementById('brushes');
    brushesEl.addEventListener('click', (e)=>{
      const btn = e.target.closest('button[data-shape]');
      if (!btn) return;
      state.shape = btn.getAttribute('data-shape');
      brushesEl.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
    });

    const sizeEl = document.getElementById('size');
    const sizeVal = document.getElementById('sizeVal');
    function syncSize(){ state.size = +sizeEl.value; sizeVal.textContent = state.size + ' px'; }
    sizeEl.addEventListener('input', syncSize); syncSize();

    const brightnessEl = document.getElementById('brightness');
    const brightnessVal = document.getElementById('brightnessVal');
    function syncBrightness(){ state.brightness = (+brightnessEl.value)/100; brightnessVal.textContent = Math.round(state.brightness*100)+'%'; }
    brightnessEl.addEventListener('input', syncBrightness); syncBrightness();

    const twinkleEl = document.getElementById('twinkle');
    const twinkleVal = document.getElementById('twinkleVal');
    function syncTwinkle(){ state.twinkle = (+twinkleEl.value)/100; twinkleVal.textContent = Math.round(state.twinkle*100)+'%'; }
    twinkleEl.addEventListener('input', syncTwinkle); syncTwinkle();

    document.getElementById('clear').addEventListener('click', ()=>{ stars.length = 0; });
    const meteorsToggle = document.getElementById('meteorsToggle');
    meteorsToggle.addEventListener('change', ()=>{ state.meteorsEnabled = meteorsToggle.checked; });

    document.getElementById('save').addEventListener('click', saveImage);
    window.addEventListener('keydown', (e)=>{ if (e.key.toLowerCase()==='s') saveImage(); });

    function saveImage(){
      const link = document.createElement('a');
      link.download = 'night-sky-painting.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function drawBackground(t){
      // 深色渐变背景
      const g = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H));
      g.addColorStop(0, '#1A1F2E');
      g.addColorStop(0.7, '#0A0E1A');
      g.addColorStop(1, '#000000');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,W,H);

      // 绘制月亮
      const moonX = W*0.15 + Math.sin(t*0.0001)*15*DPR;
      const moonY = H*0.25 + Math.cos(t*0.0001)*8*DPR;
      const moonR = Math.min(W,H)*0.06;
      
      // 月亮光晕
      const moonGlow = ctx.createRadialGradient(moonX, moonY, 0, moonX, moonY, moonR*2);
      moonGlow.addColorStop(0, 'rgba(255,255,255,0.3)');
      moonGlow.addColorStop(0.5, 'rgba(255,255,255,0.1)');
      moonGlow.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = moonGlow;
      ctx.beginPath(); 
      ctx.arc(moonX, moonY, moonR*2, 0, Math.PI*2); 
      ctx.fill();
      
      // 月亮本体
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath(); 
      ctx.arc(moonX, moonY, moonR, 0, Math.PI*2); 
      ctx.fill();
    }

    function drawStar(star, t){
      const twinkleEffect = Math.sin(t*0.002 + star.phase) * star.twinkle * 0.3 + 0.7;
      const brightness = star.brightness * twinkleEffect;
      const x = star.x; 
      const y = star.y;
      
       if (star.type === 'star') {
         // 绘制五角星
         ctx.save();
         ctx.translate(x, y);
         ctx.rotate(t * 0.0005);
         
         // 绘制五角星光芒
         const rays = 5;
         const rayLength = star.r * 2.2;
         ctx.strokeStyle = star.color;
         ctx.lineWidth = 2.5;
         ctx.globalAlpha = brightness * 0.7;
         
         for (let i = 0; i < rays; i++) {
           const angle = (i / rays) * Math.PI * 2;
           ctx.beginPath();
           ctx.moveTo(0, 0);
           ctx.lineTo(Math.cos(angle) * rayLength, Math.sin(angle) * rayLength);
           ctx.stroke();
         }
         
         // 绘制五角星主体 - 使用更精确的算法
         ctx.fillStyle = star.color;
         ctx.globalAlpha = brightness;
         ctx.beginPath();
         
         // 五角星的五个外顶点和五个内顶点
         const outerRadius = star.r;
         const innerRadius = star.r * 0.382; // 黄金比例，使五角星更美观
         
         for (let i = 0; i < 10; i++) {
           const angle = (i * Math.PI) / 5 - Math.PI / 2;
           const radius = i % 2 === 0 ? outerRadius : innerRadius;
           const x1 = Math.cos(angle) * radius;
           const y1 = Math.sin(angle) * radius;
           
           if (i === 0) {
             ctx.moveTo(x1, y1);
           } else {
             ctx.lineTo(x1, y1);
           }
         }
         ctx.closePath();
         ctx.fill();
         
         // 绘制五角星边框，增强尖角效果
         ctx.strokeStyle = star.color + 'DD';
         ctx.lineWidth = 1.5;
         ctx.globalAlpha = brightness * 0.9;
         ctx.lineCap = 'round';
         ctx.stroke();
         
         // 绘制五角星中心光晕
         const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, star.r * 0.4);
         grad.addColorStop(0, 'rgba(255,255,255,0.9)');
         grad.addColorStop(0.5, 'rgba(255,255,255,0.4)');
         grad.addColorStop(1, 'rgba(255,255,255,0)');
         ctx.fillStyle = grad;
         ctx.globalAlpha = brightness * 0.7;
         ctx.beginPath();
         ctx.arc(0, 0, star.r * 0.4, 0, Math.PI * 2);
         ctx.fill();
         
         // 在五个尖角处添加小光点，增强尖角效果
         ctx.fillStyle = 'rgba(255,255,255,0.8)';
         ctx.globalAlpha = brightness * 0.8;
         for (let i = 0; i < 5; i++) {
           const angle = (i * 2 * Math.PI) / 5 - Math.PI / 2;
           const x1 = Math.cos(angle) * outerRadius;
           const y1 = Math.sin(angle) * outerRadius;
           ctx.beginPath();
           ctx.arc(x1, y1, star.r * 0.08, 0, Math.PI * 2);
           ctx.fill();
         }
         
         ctx.restore();
      } else if (star.type === 'sparkle') {
        // 绘制闪烁效果
        const sparkleEffect = Math.sin(t*0.005 + star.phase) * 0.5 + 0.5;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(t * 0.001);
        
        // 绘制十字光芒
        ctx.strokeStyle = star.color;
        ctx.lineWidth = 1.5;
        ctx.globalAlpha = brightness * sparkleEffect;
        ctx.beginPath();
        ctx.moveTo(-star.r, 0);
        ctx.lineTo(star.r, 0);
        ctx.moveTo(0, -star.r);
        ctx.lineTo(0, star.r);
        ctx.stroke();
        
        // 绘制中心点
        ctx.fillStyle = star.color;
        ctx.globalAlpha = brightness;
        ctx.beginPath(); 
        ctx.arc(0, 0, star.r*0.3, 0, Math.PI*2); 
        ctx.fill();
        
        ctx.restore();
      } else if (star.type === 'nebula') {
        // 绘制星云效果
        const nebulaEffect = Math.sin(t*0.001 + star.phase) * 0.3 + 0.7;
        const grad = ctx.createRadialGradient(x, y, 0, x, y, star.r*2);
        grad.addColorStop(0, star.color + Math.floor(brightness*255).toString(16).padStart(2,'0'));
        grad.addColorStop(0.5, star.color + Math.floor(brightness*nebulaEffect*100).toString(16).padStart(2,'0'));
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = grad;
        ctx.globalAlpha = brightness * 0.8;
        ctx.beginPath(); 
        ctx.arc(x, y, star.r*2, 0, Math.PI*2); 
        ctx.fill();
      } else if (star.type === 'constellation') {
        // 绘制星座连线效果
        const constEffect = Math.sin(t*0.0008 + star.phase) * 0.4 + 0.6;
        
        // 创建更丰富的渐变效果
        const grad = ctx.createRadialGradient(x, y, 0, x, y, star.r * 1.5);
        
        // 根据颜色变化调整渐变
        let enhancedColor = star.color;
        if (star.colorVariation) {
          // 这里可以添加HSL颜色调整逻辑
          enhancedColor = star.color;
        }
        
        // 创建多彩的渐变
        const colorStops = [
          { pos: 0, color: enhancedColor },
          { pos: 0.2, color: enhancedColor + 'F0' },
          { pos: 0.4, color: enhancedColor + 'CC' },
          { pos: 0.6, color: enhancedColor + '99' },
          { pos: 0.8, color: enhancedColor + '66' },
          { pos: 1, color: 'rgba(255,255,255,0)' }
        ];
        
        // 添加彩虹色彩变化
        const timeVariation = Math.sin(t * 0.0005 + star.phase) * 0.3;
        const rainbowColors = [
          '#FF0000', '#FF7F00', '#FFFF00', '#00FF00', '#0000FF', '#4B0082', '#9400D3'
        ];
        
        // 随机选择彩虹色彩
        if (Math.random() < 0.3) {
          const rainbowIndex = Math.floor(Math.random() * rainbowColors.length);
          colorStops[1].color = rainbowColors[rainbowIndex] + 'E6';
          colorStops[2].color = rainbowColors[rainbowIndex] + 'CC';
        }
        
        colorStops.forEach(stop => {
          grad.addColorStop(stop.pos, stop.color);
        });
        
        ctx.fillStyle = grad;
        ctx.globalAlpha = brightness * constEffect;
        
        // 绘制主星星
        ctx.beginPath(); 
        ctx.arc(x, y, star.r, 0, Math.PI*2); 
        ctx.fill();
        
        // 添加星座特有的光芒效果
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(t * 0.0003 + star.phase);
        
        // 绘制十字光芒
        ctx.strokeStyle = enhancedColor;
        ctx.lineWidth = 1.5;
        ctx.globalAlpha = brightness * constEffect * 0.6;
        
        const rayLength = star.r * 0.8;
        ctx.beginPath();
        ctx.moveTo(-rayLength, 0);
        ctx.lineTo(rayLength, 0);
        ctx.moveTo(0, -rayLength);
        ctx.lineTo(0, rayLength);
        ctx.stroke();
        
        // 绘制对角线光芒
        ctx.beginPath();
        ctx.moveTo(-rayLength * 0.6, -rayLength * 0.6);
        ctx.lineTo(rayLength * 0.6, rayLength * 0.6);
        ctx.moveTo(-rayLength * 0.6, rayLength * 0.6);
        ctx.lineTo(rayLength * 0.6, -rayLength * 0.6);
        ctx.stroke();
        
        ctx.restore();
      } else if (star.type === 'constellation_line') {
        // 绘制星座连接线
        const lineEffect = Math.sin(t*0.001 + star.phase) * 0.3 + 0.7;
        
        if (star.startStar && star.endStar) {
          ctx.save();
          
          // 绘制连接线
          ctx.strokeStyle = star.color;
          ctx.lineWidth = 2;
          ctx.globalAlpha = brightness * lineEffect * 0.8;
          ctx.lineCap = 'round';
          
          ctx.beginPath();
          ctx.moveTo(star.startStar.x, star.startStar.y);
          ctx.lineTo(star.endStar.x, star.endStar.y);
          ctx.stroke();
          
          // 添加连接线的光晕效果
          ctx.shadowColor = star.color;
          ctx.shadowBlur = 8;
          ctx.lineWidth = 1;
          ctx.globalAlpha = brightness * lineEffect * 0.4;
          
          ctx.beginPath();
          ctx.moveTo(star.startStar.x, star.startStar.y);
          ctx.lineTo(star.endStar.x, star.endStar.y);
          ctx.stroke();
          
          ctx.restore();
        }
      }
    }

    const meteors = [];
    function spawnMeteor(){
      const fromLeft = Math.random() < 0.5;
      const y = rand(H*0.1, H*0.4);
      const speed = rand(60, 120) * DPR;
      const dir = fromLeft ? 1 : -1;
      const x = fromLeft ? -100*DPR : W + 100*DPR;
      const scale = rand(0.8,1.4);
      meteors.push({ x, y, vx: dir*speed, dir, scale, trail: [] });
    }
    let nextMeteorTime = 0;

    function drawMeteor(meteor, t, dt){
      const x = meteor.x; 
      const y = meteor.y;
      const s = 0.8 * meteor.scale;
      
      ctx.save();
      ctx.translate(x, y);
      if (meteor.dir < 0) ctx.scale(-1,1);
      ctx.scale(DPR*s, DPR*s);
      
      // 绘制流星
      ctx.strokeStyle = '#FFD700';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-30, -15);
      ctx.stroke();
      
      // 绘制流星头部
      ctx.fillStyle = '#FFD700';
      ctx.beginPath();
      ctx.arc(0, 0, 4, 0, Math.PI*2);
      ctx.fill();
      
      // 添加尾迹
      const cx = x - meteor.dir*30*DPR*s; 
      const cy = y - 15*DPR*s;
      meteor.trail.push({x: cx, y: cy, r: rand(8,16)*DPR*s, a: 0.4, life: 1});
      if (meteor.trail.length > 60) meteor.trail.shift();
      
      ctx.restore();

      // 绘制尾迹
      for (let i=meteor.trail.length-1;i>=0;i--) {
        const c = meteor.trail[i];
        c.r += 8*DPR*dt*0.08; 
        c.a *= (1 - 0.02*dt);
        if (c.a < 0.01) { meteor.trail.splice(i,1); continue; }
        const g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r);
        g.addColorStop(0, 'rgba(255,215,0,'+(c.a*0.9)+')');
        g.addColorStop(1, 'rgba(255,215,0,0)');
        ctx.fillStyle = g; 
        ctx.beginPath(); 
        ctx.arc(c.x, c.y, c.r, 0, Math.PI*2); 
        ctx.fill();
      }
    }

    let lastT = performance.now();
    function frame(now){
      const dtMs = now - lastT; 
      lastT = now;
      const dt = Math.max(0.5, Math.min(4, dtMs/16.67));
      
      drawBackground(now);
      
      // 绘制所有星星
      for (let i=0;i<stars.length;i++) drawStar(stars[i], now);
      
      // 处理流星
      if (state.meteorsEnabled) {
        if (now > nextMeteorTime) {
          spawnMeteor();
          nextMeteorTime = now + rand(3000, 8000);
        }
        for (let i = meteors.length-1; i >= 0; i--) {
          const meteor = meteors[i];
          meteor.x += meteor.vx * (dt/60);
          drawMeteor(meteor, now, dt);
          if (meteor.dir>0 && meteor.x > W + 200*DPR) meteors.splice(i,1);
          else if (meteor.dir<0 && meteor.x < -200*DPR) meteors.splice(i,1);
        }
      }
      
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
