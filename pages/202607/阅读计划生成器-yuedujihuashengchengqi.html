    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 全局变量
        let readingPlan = null;       // 阅读计划数据
        let readingLogs = [];         // 阅读记录
        let currentDisplayMonth = new Date(); // 当前显示的月份
        
        // DOM元素获取
        const bookTitleInput = document.getElementById('bookTitle');
        const totalPagesInput = document.getElementById('totalPages');
        const targetDateInput = document.getElementById('targetDate');
        const generatePlanBtn = document.getElementById('generatePlanBtn');
        const planSummary = document.getElementById('planSummary');
        const summaryBookTitle = document.getElementById('summaryBookTitle');
        const summaryTotalDays = document.getElementById('summaryTotalDays');
        const summaryFlexDays = document.getElementById('summaryFlexDays');
        const summaryDailyPages = document.getElementById('summaryDailyPages');
        const detailedPlan = document.getElementById('detailedPlan');
        const calendarMonth = document.getElementById('calendarMonth');
        const prevMonthBtn = document.getElementById('prevMonth');
        const nextMonthBtn = document.getElementById('nextMonth');
        const calendarDays = document.getElementById('calendarDays');
        const readingLog = document.getElementById('readingLog');
        const noLogMsg = document.getElementById('noLogMsg');
        const logList = document.getElementById('logList');
        const downloadPlanBtn = document.getElementById('downloadPlanBtn');
        const readingRecordModal = document.getElementById('readingRecordModal');
        const modalContent = document.getElementById('modalContent');
        const pagesReadInput = document.getElementById('pagesRead');
        const pageRangeHint = document.getElementById('pageRangeHint');
        const cancelRecordBtn = document.getElementById('cancelRecordBtn');
        const confirmRecordBtn = document.getElementById('confirmRecordBtn');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        
        // 初始化
        function init() {
            // 设置默认目标日期为14天后
            const defaultTargetDate = new Date();
            defaultTargetDate.setDate(defaultTargetDate.getDate() + 14);
            targetDateInput.valueAsDate = defaultTargetDate;
            
            // 加载本地存储的数据
            loadSavedData();
            
            // 设置事件监听
            setupEventListeners();
        }
        
        // 加载本地存储的数据
        function loadSavedData() {
            const savedPlan = localStorage.getItem('readingPlan');
            const savedLogs = localStorage.getItem('readingLogs');
            
            if (savedPlan) {
                readingPlan = JSON.parse(savedPlan);
                updatePlanUI();
            }
            
            if (savedLogs) {
                readingLogs = JSON.parse(savedLogs);
                updateReadingLogUI();
            }
        }
        
        // 保存数据到本地存储
        function saveData() {
            if (readingPlan) {
                localStorage.setItem('readingPlan', JSON.stringify(readingPlan));
            }
            localStorage.setItem('readingLogs', JSON.stringify(readingLogs));
        }
        
        // 生成阅读计划
        function generateReadingPlan() {
            // 获取输入值
            const bookTitle = bookTitleInput.value.trim();
            const totalPages = parseInt(totalPagesInput.value, 10);
            const targetDate = new Date(targetDateInput.value);
            const startDate = new Date(); // 从今天开始
            startDate.setHours(0, 0, 0, 0);
            
            // 验证输入
            if (!bookTitle) {
                showToast('请输入书名', 'error');
                bookTitleInput.focus();
                return;
            }
            
            if (isNaN(totalPages) || totalPages < 10) {
                showToast('请输入有效的总页数（至少10页）', 'error');
                totalPagesInput.focus();
                return;
            }
            
            if (targetDate <= startDate) {
                showToast('目标完成日期必须晚于今天', 'error');
                targetDateInput.focus();
                return;
            }
            
            // 计算总天数（包含首尾两天）
            const timeDiff = targetDate - startDate;
            const totalDays = Math.ceil(timeDiff / (1000 * 60 * 60 * 24)) + 1;
            
            // 计算弹性天数（总天数的20%，至少1天）
            const flexDays = Math.max(1, Math.floor(totalDays * 0.2));
            const readingDays = totalDays - flexDays;
            
            // 计算每天基础阅读页数（向上取整）
            const baseDailyPages = Math.ceil(totalPages / readingDays);
            
            // 生成每日计划
            const dailyPlans = [];
            let currentPage = 1;
            let flexDaysAssigned = 0;
            
            for (let i = 0; i < totalDays; i++) {
                const currentDate = new Date(startDate);
                currentDate.setDate(startDate.getDate() + i);
                
                // 随机分配弹性天数（但确保不集中在最后）
                const isFlexDay = flexDaysAssigned < flexDays && 
                                 (i < totalDays - flexDays + flexDaysAssigned) &&
                                 (Math.random() < 0.3 || flexDaysAssigned >= flexDays - 1);
                
                let plan = {
                    date: currentDate.toISOString().split('T')[0],
                    isFlexDay: isFlexDay,
                    startPage: null,
                    endPage: null,
                    pages: 0
                };
                
                if (!isFlexDay) {
                    plan.startPage = currentPage;
                    plan.endPage = Math.min(currentPage + baseDailyPages - 1, totalPages);
                    plan.pages = plan.endPage - plan.startPage + 1;
                    currentPage = plan.endPage + 1;
                } else {
                    flexDaysAssigned++;
                }
                
                dailyPlans.push(plan);
            }
            
            // 调整最后一天的页数，确保完成总页数
            if (dailyPlans.length > 0 && currentPage <= totalPages) {
                const lastPlanIndex = dailyPlans.findLastIndex(plan => !plan.isFlexDay);
                if (lastPlanIndex !== -1) {
                    dailyPlans[lastPlanIndex].endPage = totalPages;
                    dailyPlans[lastPlanIndex].pages = dailyPlans[lastPlanIndex].endPage - dailyPlans[lastPlanIndex].startPage + 1;
                }
            }
            
            // 保存阅读计划
            readingPlan = {
                bookTitle,
                totalPages,
                startDate: startDate.toISOString().split('T')[0],
                targetDate: targetDate.toISOString().split('T')[0],
                totalDays,
                flexDays,
                readingDays,
                baseDailyPages,
                dailyPlans
            };
            
            // 清空之前的记录
            readingLogs = [];
            
            // 保存数据并更新UI
            saveData();
            updatePlanUI();
            
            // 显示提示
            showToast(`阅读计划生成成功！共${totalDays}天，包含${flexDays}天弹性时间`);
        }
        
        // 更新计划相关UI
        function updatePlanUI() {
            if (!readingPlan) return;
            
            // 显示计划摘要
            planSummary.classList.remove('hidden');
            summaryBookTitle.textContent = readingPlan.bookTitle;
            summaryTotalDays.textContent = readingPlan.totalDays + ' 天';
            summaryFlexDays.textContent = readingPlan.flexDays + ' 天';
            summaryDailyPages.textContent = readingPlan.baseDailyPages + ' 页';
            
            // 显示详细计划和阅读记录
            detailedPlan.classList.remove('hidden');
            readingLog.classList.remove('hidden');
            
            // 更新日历
            currentDisplayMonth = new Date(readingPlan.startDate);
            renderCalendar(currentDisplayMonth);
            
            // 更新阅读记录
            updateReadingLogUI();
        }
        
        // 渲染日历
        function renderCalendar(date) {
            if (!readingPlan) return;
            
            const year = date.getFullYear();
            const month = date.getMonth();
            
            // 更新日历标题
            const monthNames = ["一月", "二月", "三月", "四月", "五月", "六月", 
                               "七月", "八月", "九月", "十月", "十一月", "十二月"];
            calendarMonth.textContent = `${year}年 ${monthNames[month]}`;
            
            // 获取当月第一天是星期几
            const firstDay = new Date(year, month, 1).getDay();
            
            // 获取当月的天数
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            // 清空日历
            calendarDays.innerHTML = '';
            
            // 添加空白格子
            for (let i = 0; i < firstDay; i++) {
                const emptyDay = document.createElement('div');
                emptyDay.className = 'calendar-day bg-transparent border-0';
                calendarDays.appendChild(emptyDay);
            }
            
            // 获取今天的日期（仅日期部分）
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            // 添加日期格子
            for (let day = 1; day <= daysInMonth; day++) {
                const currentDate = new Date(year, month, day);
                const dateStr = currentDate.toISOString().split('T')[0];
                const planForDay = readingPlan.dailyPlans.find(plan => plan.date === dateStr);
                
                const dayEl = document.createElement('div');
                dayEl.className = 'calendar-day';
                
                // 判断日期状态
                const isPast = currentDate < today;
                const isToday = currentDate.getTime() === today.getTime();
                const isPlanDay = !!planForDay;
                
                // 设置基础样式
                if (isPast) {
                    dayEl.classList.add('calendar-day-past');
                } else if (isPlanDay) {
                    if (planForDay.isFlexDay) {
                        dayEl.classList.add('calendar-day-flex');
                    } else {
                        dayEl.classList.add('calendar-day-task');
                    }
                }
                
                // 标记今天
                if (isToday) {
                    dayEl.innerHTML += `<div class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></div>`;
                }
                
                // 添加日期和页数
                dayEl.innerHTML += `<span class="text-sm">${day}</span>`;
                
                if (isPlanDay && !planForDay.isFlexDay) {
                    dayEl.innerHTML += `<span class="text-xs mt-1">${planForDay.pages}页</span>`;
                    
                    // 添加点击事件（未过期的任务日可以记录阅读）
                    if (!isPast) {
                        dayEl.classList.add('cursor-pointer');
                        dayEl.addEventListener('click', () => openReadingRecordModal(planForDay));
                    }
                } else if (isPlanDay && planForDay.isFlexDay) {
                    dayEl.innerHTML += `<span class="text-xs mt-1 text-gray-500">弹性日</span>`;
                }
                
                calendarDays.appendChild(dayEl);
            }
        }
        
        // 打开阅读记录弹窗
        function openReadingRecordModal(plan) {
            // 设置弹窗信息
            pageRangeHint.textContent = `建议阅读范围：${plan.startPage}-${plan.endPage}页`;
            pagesReadInput.value = plan.pages;
            pagesReadInput.focus();
            
            // 保存当前计划到按钮上，方便后续使用
            confirmRecordBtn.dataset.date = plan.date;
            confirmRecordBtn.dataset.startPage = plan.startPage;
            confirmRecordBtn.dataset.endPage = plan.endPage;
            
            // 显示弹窗
            readingRecordModal.classList.remove('hidden');
            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
                modalContent.classList.add('scale-100', 'opacity-100');
            }, 50);
        }
        
        // 关闭阅读记录弹窗
        function closeReadingRecordModal() {
            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                readingRecordModal.classList.add('hidden');
                // 清除按钮上的临时数据
                confirmRecordBtn.removeAttribute('data-date');
                confirmRecordBtn.removeAttribute('data-startPage');
                confirmRecordBtn.removeAttribute('data-endPage');
            }, 300);
        }
        
        // 记录阅读情况
        function recordReading() {
            const date = confirmRecordBtn.dataset.date;
            const startPage = parseInt(confirmRecordBtn.dataset.startPage);
            const endPage = parseInt(confirmRecordBtn.dataset.endPage);
            const pagesRead = parseInt(pagesReadInput.value, 10);
            
            // 验证输入
            if (isNaN(pagesRead) || pagesRead < 1) {
                showToast('请输入有效的阅读页数', 'error');
                pagesReadInput.focus();
                return;
            }
            
            // 查找是否已有该日期的记录
            const logIndex = readingLogs.findIndex(log => log.date === date);
            
            // 格式化日期显示
            const dateObj = new Date(date);
            const formattedDate = `${dateObj.getMonth() + 1}月${dateObj.getDate()}日`;
            
            // 创建或更新记录
            const readingLog = {
                date,
                formattedDate,
                pagesRead,
                startPage,
                endPage
            };
            
            if (logIndex >= 0) {
                readingLogs[logIndex] = readingLog;
            } else {
                readingLogs.push(readingLog);
                // 按日期排序
                readingLogs.sort((a, b) => new Date(a.date) - new Date(b.date));
            }
            
            // 保存数据并更新UI
            saveData();
            updateReadingLogUI();
            
            // 关闭弹窗并显示提示
            closeReadingRecordModal();
            showToast(`已记录 ${formattedDate} 阅读 ${pagesRead} 页`);
        }
        
        // 更新阅读记录UI
        function updateReadingLogUI() {
            if (readingLogs.length === 0) {
                noLogMsg.classList.remove('hidden');
                logList.classList.add('hidden');
                return;
            }
            
            noLogMsg.classList.add('hidden');
            logList.classList.remove('hidden');
            
            // 清空现有列表
            logList.innerHTML = '';
            
            // 添加记录项（倒序显示，最新的在上面）
            const reversedLogs = [...readingLogs].reverse();
            reversedLogs.forEach(log => {
                const logEl = document.createElement('div');
                logEl.className = 'flex justify-between items-center p-2.5 bg-gray-50 rounded-lg text-sm';
                
                // 计算完成比例
                const totalPlanned = log.endPage - log.startPage + 1;
                const completion = Math.min(Math.round((log.pagesRead / totalPlanned) * 100), 100);
                
                logEl.innerHTML = `
                    <div>
                        <div class="font-medium">${log.formattedDate}</div>
                        <div class="text-xs text-gray-500 mt-0.5">
                            阅读 ${log.pagesRead} 页 (计划: ${totalPlanned}页)
                        </div>
                        <div class="w-full h-1.5 bg-gray-200 rounded-full mt-1.5 overflow-hidden">
                            <div class="h-full bg-primary rounded-full" style="width: ${completion}%"></div>
                        </div>
                    </div>
                    <button class="delete-log text-gray-400 hover:text-red-500 card-transition" data-date="${log.date}">
                        <i class="fa fa-times"></i>
                    </button>
                `;
                logList.appendChild(logEl);
            });
            
            // 添加删除事件监听
            document.querySelectorAll('.delete-log').forEach(btn => {
                btn.addEventListener('click', function() {
                    const date = this.dataset.date;
                    deleteReadingLog(date);
                });
            });
        }
        
        // 删除阅读记录
        function deleteReadingLog(date) {
            const logIndex = readingLogs.findIndex(log => log.date === date);
            if (logIndex >= 0) {
                const log = readingLogs[logIndex];
                readingLogs.splice(logIndex, 1);
                saveData();
                updateReadingLogUI();
                showToast(`${log.formattedDate} 的阅读记录已删除`);
            }
        }
        
        // 导出阅读计划
        function downloadPlan() {
            if (!readingPlan) {
                showToast('没有可导出的阅读计划', 'error');
                return;
            }
            
            // 构建导出文本
            let planText = `《${readingPlan.bookTitle}》阅读计划\n`;
            planText += `总页数：${readingPlan.totalPages}页\n`;
            planText += `阅读周期：${formatDate(readingPlan.startDate)} 至 ${formatDate(readingPlan.targetDate)}\n`;
            planText += `总天数：${readingPlan.totalDays}天（含${readingPlan.flexDays}天弹性时间）\n`;
            planText += `每日建议阅读：${readingPlan.baseDailyPages}页\n\n`;
            planText += "每日计划：\n";
            
            readingPlan.dailyPlans.forEach(plan => {
                const dateStr = formatDate(plan.date);
                if (plan.isFlexDay) {
                    planText += `${dateStr}：弹性调整日\n`;
                } else {
                    planText += `${dateStr}：阅读第${plan.startPage}-${plan.endPage}页（${plan.pages}页）\n`;
                }
            });
            
            // 创建下载链接
            const blob = new Blob([planText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${readingPlan.bookTitle}_阅读计划.txt`;
            document.body.appendChild(a);
            a.click();
            
            // 清理
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 0);
            
            showToast('阅读计划已导出');
        }
        
        // 格式化日期显示（YYYY-MM-DD 转为 MM月DD日）
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return `${date.getMonth() + 1}月${date.getDate()}日`;
        }
        
        // 显示提示消息
        function showToast(message, type = 'success') {
            toastMessage.textContent = message;
            
            if (type === 'success') {
                toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs bg-green-500 text-white';
                toast.querySelector('i').className = 'fa fa-check-circle mr-2';
            } else {
                toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs bg-red-500 text-white';
                toast.querySelector('i').className = 'fa fa-exclamation-circle mr-2';
            }
            
            setTimeout(() => {
                toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs';
            }, 3000);
        }
        
        // 设置事件监听器
        function setupEventListeners() {
            // 生成计划按钮
            generatePlanBtn.addEventListener('click', generateReadingPlan);
            
            // 日历导航按钮
            prevMonthBtn.addEventListener('click', () => {
                currentDisplayMonth.setMonth(currentDisplayMonth.getMonth() - 1);
                renderCalendar(currentDisplayMonth);
            });
            
            nextMonthBtn.addEventListener('click', () => {
                currentDisplayMonth.setMonth(currentDisplayMonth.getMonth() + 1);
                renderCalendar(currentDisplayMonth);
            });
            
            // 记录阅读相关按钮
            cancelRecordBtn.addEventListener('click', closeReadingRecordModal);
            confirmRecordBtn.addEventListener('click', recordReading);
            
            // 导出计划按钮
            downloadPlanBtn.addEventListener('click', downloadPlan);
            
            // 点击弹窗外部关闭
            readingRecordModal.addEventListener('click', function(e) {
                if (e.target === readingRecordModal) {
                    closeReadingRecordModal();
                }
            });
            
            // 输入框回车提交
            totalPagesInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    generatePlanBtn.click();
                }
            });
            
            pagesReadInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    confirmRecordBtn.click();
                }
            });
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
