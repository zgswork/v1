                intro: "《书剑恩仇录》是金庸的第一部长篇武侠小说，以清朝乾隆年间为背景，讲述了红花会总舵主陈家洛与乾隆皇帝之间的恩怨情仇。小说通过红花会反清复明的斗争，展现了民族矛盾和个人情感的冲突。",
                rating: 4.7,
                reason: "这部作品虽然艺术上不如后期作品成熟，但已经展现了金庸武侠小说的基本风格和特点。小说中的民族大义与个人情感的矛盾，成为金庸后来作品中反复探讨的主题。"

                intro: "《碧血剑》以明末清初为背景，讲述了袁承志为父报仇的故事。袁承志是明末抗清名将袁崇焕之子，自幼被送上华山学艺，后下山为父报仇，并协助李自成起义。小说通过袁承志的视角，展现了明末清初的历史风云。",

                title: "雪山飞狐",
                intro: "《雪山飞狐》讲述了胡斐为父报仇的故事。小说采用倒叙手法，通过不同人物的回忆，拼凑出胡一刀与苗人凤的恩怨，以及胡斐与苗若兰的爱情。故事发生在一天之内，但通过回忆展现了数十年的恩怨情仇。",

                reason: "这部作品以其独特的叙事结构和紧凑的情节设计，展现了金庸在小说形式上的创新。小说中的'一日叙事'和'罗生门式'的多视角叙述，体现了金庸高超的叙事技巧。"

                intro: "《飞狐外传》是《雪山飞狐》的前传，讲述了胡斐的成长经历。小说通过胡斐为钟阿四一家报仇、与袁紫衣的感情纠葛、与程灵素的师徒情谊等情节，塑造了一个更加丰满的胡斐形象。",
                rating: 4.6,
                reason: "这部作品虽然作为《雪山飞狐》的补充而创作，但独立成篇，展现了胡斐性格的多个侧面。小说中的侠义精神和对弱者的同情，体现了金庸武侠小说的核心价值观。"

                rating: 4.6,
                reason: "这部作品以其奇幻的情节和寓言式的叙事，展现了金庸武侠小说的另一面。石破天纯真无邪的性格与江湖的险恶形成鲜明对比，体现了金庸对人性本真的赞美。"
            },
            {
                title: "连城诀",
                intro: "《连城诀》讲述了狄云被冤枉入狱后复仇的故事。小说通过狄云的悲惨遭遇，揭露了人性中的贪婪和残忍。'连城诀'是一部记载宝藏的密码，引发了一系列的血腥争夺。",
                rating: 4.7,
                reason: "这部作品是金庸武侠小说中最黑暗的一部，对人性的揭露最为彻底。小说中的背叛、欺骗和残忍，展现了金庸对人性阴暗面的深刻洞察，与其其他作品的浪漫主义风格形成鲜明对比。"

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            const recommendBtn = document.getElementById('recommendBtn');
            const changeBtn = document.getElementById('changeBtn');
            const bookInfo = document.getElementById('bookInfo');
            const counter = document.getElementById('counter');
            
            let previousIndex = -1;
            let recommendationCount = 0;

            // 获取随机书籍
            function getRandomBook() {
                let randomIndex;
                // 确保不重复推荐同一本书
                do {
                    randomIndex = Math.floor(Math.random() * books.length);
                } while (randomIndex === previousIndex && books.length > 1);
                
                previousIndex = randomIndex;
                return books[randomIndex];
            }

            // 显示书籍信息
            function displayBook(book) {
                const stars = '★'.repeat(Math.floor(book.rating));
                const emptyStars = '☆'.repeat(5 - Math.floor(book.rating));
                
                bookInfo.innerHTML = `
                    <div class="book-title">${book.title}</div>
                    <div class="rating">
                        <span class="star">${stars}${emptyStars}</span>
                        <span> (推荐指数: ${book.rating.toFixed(1)})</span>
                    </div>
                    <div class="intro">${book.intro}</div>
                    <div class="recommendation">
                        <strong>推荐理由：</strong>${book.reason}
                    </div>
                `;
                
                recommendationCount++;
                counter.textContent = `已推荐: ${recommendationCount} 部作品`;
            }

            // 绑定推荐按钮点击事件
            recommendBtn.addEventListener('click', function() {
                const book = getRandomBook();
                displayBook(book);
                recommendBtn.style.display = 'none';
                changeBtn.style.display = 'inline-block';
            });

            // 绑定换一本书按钮点击事件
            changeBtn.addEventListener('click', function() {
                const book = getRandomBook();
                displayBook(book);
            });

            // 添加键盘快捷键支持
            document.addEventListener('keydown', function(event) {
                if (event.key === 'Enter' || event.key === ' ') {
                    if (recommendBtn.style.display !== 'none') {
                        recommendBtn.click();
                    } else {
                        changeBtn.click();
                    }
                }
            });
        });
    </script>
