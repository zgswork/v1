<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>旅行照片墙</title>
  <meta name="description" content="上传并标注地点日期的旅行照片墙，轻松整理与回顾旅行回忆" />
  <style>
    :root{
      --primary:#3B82F6;/*主色*/
      --success:#10B981;/*成功*/
      --danger:#EF4444;/*删除*/
      --bg:#F9FAFB;/*背景*/
      --text:#374151;/*文本*/
      --muted:#6B7280;/*次文*/
      --border:#E5E7EB;/*边框*/
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
      display:flex;flex-direction:column;min-height:100vh;
    }
    header{
      position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border);z-index:10;
    }
    .container{max-width:1200px;margin:0 auto;padding:12px 16px}
    main.container{flex:1}
    h1{margin:8px 0;font-size:20px;display:flex;align-items:center;gap:10px;color:var(--text)}
    .hint{color:var(--muted);font-size:12px;margin-bottom:6px}

    /* 空状态 */
    .empty{display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:48px 16px;color:var(--muted)}
    .empty.show{display:flex}
    .empty button{margin-top:12px;background:var(--primary);color:#fff;border:none;border-radius:999px;padding:10px 16px;cursor:pointer}

    /* 骨架屏 */
    .skeleton-wrap{display:grid;grid-template-columns:1fr;gap:8px}
    @media(min-width:481px){.skeleton-wrap{grid-template-columns:1fr 1fr;gap:12px}}
    @media(min-width:769px){.skeleton-wrap{grid-template-columns:1fr 1fr 1fr;gap:16px}}
    .skeleton{height:220px;border-radius:8px;background:linear-gradient(90deg,#eee,#f5f5f5,#eee);background-size:200% 100%;animation:shine 1.2s linear infinite}
    @keyframes shine{0%{background-position:200% 0}100%{background-position:-200% 0}}

    /* 照片墙 - 瀑布流列 */
    .masonry{column-gap:8px}
    @media(min-width:481px){.masonry{column-count:2;column-gap:12px}}
    @media(min-width:769px){.masonry{column-count:3;column-gap:16px}}
    .card{break-inside:avoid;border-radius:8px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06);position:relative;margin:0 0 8px;transition:transform .3s ease}
    @media(min-width:481px){.card{margin-bottom:12px}}
    @media(min-width:769px){.card{margin-bottom:16px}}
    .card:hover{transform:scale(1.03)}
    .card img{width:100%;height:auto;display:block;opacity:0;transition:opacity .3s ease}
    .card img.loaded{opacity:1}
    .label{position:absolute;left:0;right:0;bottom:0;color:#fff;padding:10px;background:linear-gradient(180deg,rgba(0,0,0,0) 0%, rgba(0,0,0,.45) 100%);font-size:14px;line-height:1.35}
    .label .loc{font-weight:600}

    /* 操作按钮 */
    .actions{position:absolute;top:8px;right:8px;display:flex;gap:8px}
    .act-btn{width:44px;height:44px;border-radius:999px;border:none;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(0,0,0,.1);cursor:pointer;opacity:0;transition:opacity .2s}
    .card:hover .act-btn, .card:focus-within .act-btn{opacity:1}
    .act-btn.edit{color:#111}
    .act-btn.del{color:#fff;background:var(--danger)}
    /* 触屏点击时显示操作按钮 */
    .card.show-actions .act-btn{opacity:1}

    /* 浮动上传按钮 */
    .fab{position:fixed;right:20px;bottom:20px;z-index:20;width:60px;height:60px;border-radius:50%;background:var(--primary);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 16px rgba(59,130,246,.35)}
    .fab:focus{outline:2px solid #cde;outline-offset:3px}
    input[type=file]{display:none}

    /* 拖拽区域提示 */
    .drop-mask{position:fixed;inset:0;background:rgba(59,130,246,.08);border:2px dashed var(--primary);display:none;align-items:center;justify-content:center;z-index:30;color:var(--primary);font-size:18px}
    .drop-mask.show{display:flex}

    /* 模态框基础 */
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:40}
    .modal.show{display:flex}
    .dialog{background:#fff;border-radius:12px;max-width:92vw;width:420px;padding:16px 16px 12px;box-shadow:0 10px 24px rgba(0,0,0,.2)}
    .dialog h3{margin:0 0 8px}
    .form-row{display:flex;flex-direction:column;margin:8px 0}
    .form-row label{font-size:13px;color:var(--muted);margin-bottom:4px}
    .form-row input{padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px}
    .form-row small{font-size:12px;color:var(--muted)}
    .dialog .bar{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
    .btn{border:none;border-radius:8px;padding:10px 14px;cursor:pointer}
    .btn.primary{background:var(--primary);color:#fff}
    .btn.ghost{background:#f3f4f6;color:#111}
    .btn.danger{background:var(--danger);color:#fff}

    /* 确认对话框按钮尺寸>=44 */
    .btn, .act-btn, .fab{min-width:44px;min-height:44px}

    /* 进度与吐司 */
    .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:50}
    .toast.show{opacity:1}
    .toast.success{background:var(--success)}
    .toast.danger{background:var(--danger)}
    /* 上传进行中的loading动画 */
    .toast.loading{padding-left:38px;}
    .toast.loading::before{content:"";position:absolute;left:12px;top:50%;width:16px;height:16px;margin-top:-8px;border:2px solid rgba(255,255,255,.6);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* 删除淡出 */
    .fade-out{opacity:0;transform:scale(.98);transition:all .25s ease}

    /* 页脚注脚 */
    footer{padding:30px 16px;color:var(--muted);text-align:center;margin-top:auto;background:var(--bg)}
    footer a{color:var(--primary);text-decoration:none}
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1 aria-label="旅行照片墙应用">旅行照片墙</h1>
      <div class="hint">上传你的旅行照片，添加地点与日期标签，自动生成响应式瀑布流照片墙。</div>
    </div>
  </header>

  <main class="container" id="main" aria-live="polite" aria-busy="true">
    <section id="skeleton" class="skeleton-wrap" aria-hidden="true"></section>

    <section id="empty" class="empty" role="region" aria-label="空状态">
      <div>上传你的第一张旅行照片</div>
      <button id="emptyUploadBtn" aria-label="上传第一张旅行照片">开始上传</button>
    </section>

    <section id="grid" class="masonry" aria-label="照片墙"></section>
  </main>

  <!-- 拖拽提示遮罩 -->
  <div id="dropMask" class="drop-mask" aria-hidden="true">将图片拖放到此处上传</div>

  <!-- 编辑信息模态框 -->
  <div id="editModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="editTitle" aria-hidden="true">
    <div class="dialog">
      <h3 id="editTitle">添加/编辑照片信息</h3>
      <div class="form-row">
        <label for="locationInput">地点（不超过30字符）</label>
        <input id="locationInput" type="text" maxlength="30" placeholder="例如：九份、丽江古城" />
        <small id="locHint">0/30</small>
      </div>
      <div class="form-row">
        <label for="dateInput">日期</label>
        <input id="dateInput" type="date" />
      </div>
      <div class="bar">
        <button class="btn ghost" id="cancelEdit">取消</button>
        <button class="btn primary" id="saveEdit">保存</button>
      </div>
    </div>
  </div>

  <!-- 删除确认框 -->
  <div id="confirmModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" aria-hidden="true">
    <div class="dialog">
      <h3 id="confirmTitle">确认删除这张照片？</h3>
      <div class="bar">
        <button class="btn ghost" id="cancelDel">取消</button>
        <button class="btn danger" id="okDel">确认删除</button>
      </div>
    </div>
  </div>

  <!-- 吐司通知与状态区域 -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- 浮动上传按钮 -->
  <button id="fab" class="fab" aria-label="上传照片" title="上传照片">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M4 7h3l2-2h6l2 2h3a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="12" cy="13" r="4" stroke="currentColor" stroke-width="1.6"/>
    </svg>
    <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp" multiple aria-hidden="true" />
  </button>

  <script>
    const MAX_SIZE_MB = 5;
    const MAX_COUNT = 30;
    const STORAGE_KEY = 'travelPhotos';
    const compressQuality = 0.8; // 质量0.8

    const grid = document.getElementById('grid');
    const skeleton = document.getElementById('skeleton');
    const emptyState = document.getElementById('empty');
    const emptyUploadBtn = document.getElementById('emptyUploadBtn');
    const fileInput = document.getElementById('fileInput');
    const fab = document.getElementById('fab');
    const dropMask = document.getElementById('dropMask');
    const toast = document.getElementById('toast');
    const main = document.getElementById('main');

    // Edit modal refs
    const editModal = document.getElementById('editModal');
    const locationInput = document.getElementById('locationInput');
    const dateInput = document.getElementById('dateInput');
    const saveEditBtn = document.getElementById('saveEdit');
    const cancelEditBtn = document.getElementById('cancelEdit');
    const locHint = document.getElementById('locHint');

    // Confirm modal refs
    const confirmModal = document.getElementById('confirmModal');
    const okDelBtn = document.getElementById('okDel');
    const cancelDelBtn = document.getElementById('cancelDel');

    let photos = [];
    let currentEditId = null;
    let pendingDeleteId = null;
    let lastFocusedEl = null;

    // 初始化骨架屏
    function showSkeleton(count=6){
      skeleton.innerHTML = Array.from({length:count}).map(()=>'<div class="skeleton" aria-hidden="true"></div>').join('');
      skeleton.style.display='grid';
    }
    function hideSkeleton(){ skeleton.style.display='none'; }

    function showToast(msg, type=''){ 
      toast.textContent = msg; 
      toast.className = 'toast show' + (type?(' '+type):'');
      if(type === 'loading') return; // loading不自动消失，待后续状态覆盖
      setTimeout(()=> toast.className='toast', 3000);
    }

    function getStored(){
      try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'); }catch{ return [] }
    }
    function persist(){
      try{
        localStorage.setItem(STORAGE_KEY, JSON.stringify(photos));
        return true;
      }catch(e){
        console.error('Persist error', e);
        return false;
      }
    }
    
    function sortPhotos(){
      photos.sort((a,b)=>{
        const ad = a.date? new Date(a.date).getTime() : a.timestamp;
        const bd = b.date? new Date(b.date).getTime() : b.timestamp;
        return bd - ad; // 倒序
      });
    }

    // 懒加载
    const io = new IntersectionObserver(entries=>{
      entries.forEach(e=>{
        if(e.isIntersecting){
          const img=e.target; img.src = img.dataset.src; img.onload=()=>img.classList.add('loaded'); io.unobserve(img);
        }
      });
    },{rootMargin:'100px'});

    function render(){
      sortPhotos();
      grid.innerHTML='';
      if(photos.length===0){
        emptyState.classList.add('show');
      }else{
        emptyState.classList.remove('show');
      }
      photos.forEach(p=>{
        const card = document.createElement('article');
        card.className='card';
        card.setAttribute('tabindex','0');
        card.setAttribute('aria-label', `照片：${p.location||'未填写地点'} ${p.date||''}`);
        // 触屏：点击卡片显示操作按钮
        card.addEventListener('click',(e)=>{
          if(e.target.closest('.act-btn')) return; // 点击按钮不切换
          document.querySelectorAll('.card.show-actions').forEach(c=>{ if(c!==card) c.classList.remove('show-actions');});
          card.classList.toggle('show-actions');
        });

        const img = document.createElement('img');
        img.alt = (p.location? `拍摄于${p.location}`:'旅行照片');
        img.dataset.src = p.imageData; // 懒加载
        io.observe(img);

        const label = document.createElement('div');
        label.className='label';
        label.innerHTML = `<div class="loc">${escapeHtml(p.location||'')}</div><div>${p.date||''}</div>`;

        const actions = document.createElement('div');
        actions.className='actions';

        const editBtn = document.createElement('button');
        editBtn.className='act-btn edit';
        editBtn.setAttribute('aria-label','编辑这张照片');
        editBtn.innerHTML = svgEdit;
        editBtn.addEventListener('click',()=> openEdit(p.id));

        const delBtn = document.createElement('button');
        delBtn.className='act-btn del';
        delBtn.setAttribute('aria-label','删除这张照片');
        delBtn.innerHTML = svgTrash;
        delBtn.addEventListener('click',()=> openConfirm(p.id));

        actions.append(editBtn, delBtn);
        card.append(img,label,actions);
        grid.append(card);
      });
      main.setAttribute('aria-busy','false');
    }

    function escapeHtml(s){return s? s.replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])) : ''}

    // 打开编辑对话框
    function openEdit(id){
      currentEditId = id;
      const p = photos.find(x=>x.id===id);
      if(!p) return;
      lastFocusedEl = document.activeElement;
      editModal.classList.add('show');
      editModal.removeAttribute('aria-hidden');
      locationInput.value = p.location||'';
      dateInput.value = p.date||'';
      updateLocHint();
      setTimeout(()=> locationInput.focus(), 50);
    }
    function closeEdit(){
      editModal.classList.remove('show');
      editModal.setAttribute('aria-hidden','true');
      currentEditId = null;
      if(lastFocusedEl) lastFocusedEl.focus();
    }
    function saveEdit(){
      const loc = locationInput.value.trim();
      if(loc.length>30){ showToast('地点最多30字符','danger'); return; }
      const dt = dateInput.value;
      const idx = photos.findIndex(x=>x.id===currentEditId);
      if(idx>-1){
        const prev = {...photos[idx]};
        photos[idx].location = loc;
        photos[idx].date = dt;
        if(!persist()){
          // 回滚
          photos[idx] = prev;
          showToast('存储空间不足，未能保存修改','danger');
        }else{
          render();
          showToast('信息已更新','success');
        }
      }
      closeEdit();
    }
    function updateLocHint(){ locHint.textContent = `${locationInput.value.length}/30`; }

    // 删除确认框
    function openConfirm(id){
      pendingDeleteId = id;
      lastFocusedEl = document.activeElement;
      confirmModal.classList.add('show');
      confirmModal.removeAttribute('aria-hidden');
      setTimeout(()=> okDelBtn.focus(), 50);
    }
    function closeConfirm(){
      confirmModal.classList.remove('show');
      confirmModal.setAttribute('aria-hidden','true');
      pendingDeleteId=null; if(lastFocusedEl) lastFocusedEl.focus();
    }
    function confirmDelete(){
      const idx = photos.findIndex(x=>x.id===pendingDeleteId);
      if(idx>-1){
        // 淡出动画
        const card = grid.children[idx];
        if(card){
          card.classList.add('fade-out');
          setTimeout(()=>{
            photos.splice(idx,1);
            persist();
            render();
            showToast('已删除','success');
          }, 250);
        }else{
          photos.splice(idx,1);persist();render();
        }
      }
      closeConfirm();
    }

    // 文件上传逻辑
    fab.addEventListener('click',()=> fileInput.click());
    emptyUploadBtn.addEventListener('click',()=> fileInput.click());
    fileInput.addEventListener('change', e=> handleFiles(e.target.files));

    ['dragenter','dragover'].forEach(ev=>{
      document.addEventListener(ev, e=>{ e.preventDefault(); dropMask.classList.add('show'); });
    });
    ['dragleave','drop'].forEach(ev=>{
      document.addEventListener(ev, e=>{ e.preventDefault(); if(ev==='drop'){ handleFiles(e.dataTransfer.files); } dropMask.classList.remove('show'); });
    });

    function validateFile(file){
      const okType = ['image/jpeg','image/png','image/webp'].includes(file.type);
      const okSize = file.size <= MAX_SIZE_MB*1024*1024;
      return okType && okSize;
    }

    async function handleFiles(fileList){
      if(!fileList || fileList.length===0) return;
      if(photos.length >= MAX_COUNT){ showToast('已达最大存储数量（30张）','danger'); return; }

      const files = Array.from(fileList).filter(validateFile);
      if(files.length===0){ showToast('仅支持jpg/png/webp且≤5MB','danger'); return; }

      main.setAttribute('aria-busy','true');
      showToast('正在上传与处理...','loading');

      const remain = MAX_COUNT - photos.length;
      const selected = files.slice(0, remain);

      let lastId = null;
      const before = photos.slice();
      for(const f of selected){
        try{
          const dataUrl = await readAndCompress(f);
          const item = { id: cryptoRandomId(), imageData: dataUrl, location:'', date:'', timestamp: Date.now() };
          photos.push(item);
          lastId = item.id;
        }catch(e){ console.error(e); }
      }
      if(!persist()){
        // 回滚
        photos = before;
        render();
        showToast('存储空间不足，请删除部分照片后重试','danger');
        return;
      }
      render();
      showToast('照片上传成功','success');
      if(lastId) openEdit(lastId);
    }

    function cryptoRandomId(){
      if(window.crypto && crypto.getRandomValues){
        const a = new Uint8Array(16); crypto.getRandomValues(a);
        return Array.from(a).map(x=>x.toString(16).padStart(2,'0')).join('');
      }
      return 'id_'+Math.random().toString(36).slice(2);
    }

    function readFileAsImg(file){
      return new Promise((resolve,reject)=>{
        const reader = new FileReader();
        reader.onload = ()=>{
          const img = new Image();
          img.onload = ()=> resolve(img);
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function readAndCompress(file){
      const img = await readFileAsImg(file);
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      // 限制最大边为 2000 像素，优化存储与性能
      const maxSide = 2000;
      let {width, height} = img;
      if(Math.max(width,height) > maxSide){
        const scale = maxSide / Math.max(width,height);
        width = Math.round(width*scale); height = Math.round(height*scale);
      }
      canvas.width = width; canvas.height = height;
      ctx.drawImage(img,0,0,width,height);
      const mime = file.type==='image/webp' ? 'image/webp' : 'image/jpeg';
      return canvas.toDataURL(mime, compressQuality);
    }

    // 事件绑定 - 模态框
    saveEditBtn.addEventListener('click', saveEdit);
    cancelEditBtn.addEventListener('click', closeEdit);
    locationInput.addEventListener('input', updateLocHint);
    editModal.addEventListener('click', (e)=>{ if(e.target===editModal) closeEdit(); });
    confirmModal.addEventListener('click', (e)=>{ if(e.target===confirmModal) closeConfirm(); });

    // 键盘可访问性
    document.addEventListener('keydown', (e)=>{
      // Enter 保存编辑 / 确认删除
      if(e.key==='Enter'){
        if(editModal.classList.contains('show')){ e.preventDefault(); saveEdit(); return; }
        if(confirmModal.classList.contains('show')){ e.preventDefault(); confirmDelete(); return; }
      }
      // Esc 关闭弹窗
      if(e.key==='Escape'){
        if(editModal.classList.contains('show')) closeEdit();
        if(confirmModal.classList.contains('show')) closeConfirm();
      }
    });
    // 点击页面空白处隐藏卡片操作按钮
    document.addEventListener('click',(e)=>{
      if(!e.target.closest('.card')){
        document.querySelectorAll('.card.show-actions').forEach(c=> c.classList.remove('show-actions'));
      }
    });
    okDelBtn.addEventListener('click', confirmDelete);
    cancelDelBtn.addEventListener('click', closeConfirm);

    // SVG 图标
    const svgEdit = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 20h4l10-10a2.828 2.828 0 0 0-4-4L4 16v4Z" stroke="currentColor" stroke-width="1.6"/><path d="M13 7l4 4" stroke="currentColor" stroke-width="1.6"/></svg>';
    const svgTrash = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16" stroke="#fff" stroke-width="1.6"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2" stroke="#fff" stroke-width="1.6"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13" stroke="#fff" stroke-width="1.6"/></svg>';

    // 启动
    (function init(){
      showSkeleton(6);
      setTimeout(()=>{
        photos = getStored();
        render();
        hideSkeleton();
      }, 400);
    })();
  </script>
