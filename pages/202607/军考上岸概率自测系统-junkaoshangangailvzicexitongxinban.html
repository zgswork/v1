<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>军考上岸概率自测系统</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Microsoft YaHei", sans-serif;
        }
        
        body {
            background-color: #e8f5e9;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }
        
        h1 {
            text-align: center;
            color: #2e7d32;
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        .intro {
            text-align: center;
            margin-bottom: 30px;
            color: #555;
        }
        
        .factor {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px dashed #ddd;
        }
        
        .factor-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #2e7d32;
            font-size: 18px;
        }
        
        .factor-weight {
            font-size: 14px;
            color: #777;
            margin-bottom: 10px;
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .option {
            display: flex;
            align-items: center;
        }
        
        .option input {
            margin-right: 10px;
        }
        
        .btn-container {
            text-align: center;
            margin-top: 30px;
        }
        
        button {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #1b5e20;
        }
        
        .result {
            margin-top: 30px;
            text-align: center;
            display: none;
        }
        
        .score {
            font-size: 24px;
            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 15px;
        }
        
        .message {
            font-size: 18px;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }
        
        .success {
            color: #d32f2f;
            background-color: #ffebee;
            border: 1px solid #d32f2f;
        }
        
        .fail {
            color: #d32f2f;
            background-color: #ffebee;
            border: 1px solid #d32f2f;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            
            h1 {
                font-size: 20px;
            }
            
            .factor-title {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>军考上岸概率自测系统</h1>
        <p class="intro">根据您的实际情况选择以下选项，系统将自动计算您的军考上岸概率</p >
        
        <form id="testForm">
            <!-- 自律程度 -->
            <div class="factor">
                <div class="factor-title">自律程度</div>
                <div class="factor-weight">占比：40%</div>
                <div class="options">
                    <div class="option">
                        <input type="radio" id="disciplineA" name="discipline" value="100" required>
                        <label for="disciplineA">A. 计划落实100%</label>
                    </div>
                    <div class="option">
                        <input type="radio" id="disciplineB" name="discipline" value="80">
                        <label for="disciplineB">B. 计划落实80%</label>
                    </div>
                    <div class="option">
                        <input type="radio" id="disciplineC" name="discipline" value="60">
                        <label for="disciplineC">C. 计划落实60%</label>
                    </div>
                    <div class="option">
                        <input type="radio" id="disciplineD" name="discipline" value="40">
                        <label for="disciplineD">D. 计划落实40%</label>
                    </div>
                    <div class="option">
                        <input type="radio" id="disciplineE" name="discipline" value="20">
                        <label for="disciplineE">E. 计划落实20%</label>
                    </div>
                </div>
            </div>
            
            <!-- 复习时间 -->
            <div class="factor">
                <div class="factor-title">复习时间</div>
                <div class="factor-weight">占比：20%</div>
                <div class="options">
                    <div class="option">
                        <input type="radio" id="studyTimeA" name="studyTime" value="100" required>
                        <label for="studyTimeA">A. 每天学习时间5小时及以上</label>
                    </div>
                    <div class="option">
                        <input type="radio" id="studyTimeB" name="studyTime" value="80">
                        <label for="studyTimeB">B. 每天学习时间4小时</label>
                    </div>
                    <div class="option">
                        <input type="radio" id="studyTimeC" name="studyTime" value="60">
                        <label for="studyTimeC">C. 每天学习时间3小时</label>
                    </div>
                    <div class="option">
                        <input type="radio" id="studyTimeD" name="studyTime" value="40">
                        <label for="studyTimeD">D. 每天学习时间2小时</label>
                    </div>
                    <div class="option">
                        <input type="radio" id="studyTimeE" name="studyTime" value="20">
                        <label for="studyTimeE">E. 每天学习时间1小时及以下</label>
                    </div>
                </div>
            </div>
            
            <!-- 高考层次 -->
            <div class="factor">
                <div class="factor-title">高考层次</div>
                <div class="factor-weight">占比：20%</div>
                <div class="options">
                    <div class="option">
                        <input type="radio" id="gaokaoA" name="gaokao" value="100" required>
                        <label for="gaokaoA">A. 600分以上</label>
                    </div>
                    <div class="option">
                        <input type="radio" id="gaokaoB" name="gaokao" value="80">
                        <label for="gaokaoB">B. 500-600分</label>
                    </div>
                    <div class="option">
                        <input type="radio" id="gaokaoC" name="gaokao" value="60">
                        <label for="gaokaoC">C. 400-500分</label>
                    </div>
                    <div class="option">
                        <input type="radio" id="gaokaoD" name="gaokao" value="40">
                        <label for="gaokaoD">D. 300-400分</label>
                    </div>
                    <div class="option">
                        <input type="radio" id="gaokaoE" name="gaokao" value="20">
                        <label for="gaokaoE">E. 300分以下</label>
                    </div>
                </div>
            </div>
            
            <!-- 军种类别 -->
            <div class="factor">
                <div class="factor-title">军种类别</div>
                <div class="factor-weight">占比：10%</div>
                <div class="options">
                    <div class="option">
                        <input type="radio" id="militaryTypeA" name="militaryType" value="100" required>
                        <label for="militaryTypeA">A. 国动、藏路</label>
                    </div>
                    <div class="option">
                        <input type="radio" id="militaryTypeB" name="militaryType" value="80">
                        <label for="militaryTypeB">B. 海、空、军航、联勤、北路、西路</label>
                    </div>
                    <div class="option">
                        <input type="radio" id="militaryTypeC" name="militaryType" value="60">
                        <label for="militaryTypeC">C. 疆路、火、海警</label>
                    </div>
                    <div class="option">
                        <input type="radio" id="militaryTypeD" name="militaryType" value="40">
                        <label for="militaryTypeD">D. 中南东路、路直</label>
                    </div>
                    <div class="option">
                        <input type="radio" id="militaryTypeE" name="militaryType" value="20">
                        <label for="militaryTypeE">E. 武、网络、信息</label>
                    </div>
                </div>
            </div>
            
            <!-- 复习方式 -->
            <div class="factor">
                <div class="factor-title">复习方式</div>
                <div class="factor-weight">占比：10%</div>
                <div class="options">
                    <div class="option">
                        <input type="radio" id="studyMethodA" name="studyMethod" value="100" required>
                        <label for="studyMethodA">A. 全程班+一对一辅导</label>
                    </div>
                    <div class="option">
                        <input type="radio" id="studyMethodB" name="studyMethod" value="80">
                        <label for="studyMethodB">B. 全程班</label>
                    </div>
                    <div class="option">
                        <input type="radio" id="studyMethodC" name="studyMethod" value="60">
                        <label for="studyMethodC">C. 阶段基础班+一对一辅导</label>
                    </div>
                    <div class="option">
                        <input type="radio" id="studyMethodD" name="studyMethod" value="40">
                        <label for="studyMethodD">D. 阶段基础班</label>
                    </div>
                    <div class="option">
                        <input type="radio" id="studyMethodE" name="studyMethod" value="20">
                        <label for="studyMethodE">E. 自己复习</label>
                    </div>
                </div>
            </div>
            
            <div class="btn-container">
                <button type="button" id="calculateBtn">计算上岸概率</button>
            </div>
        </form>
        
        <div class="result" id="resultSection">
            <div class="score" id="scoreDisplay"></div>
            <div class="message" id="messageDisplay"></div>
        </div>
    </div>

    <script>
        document.getElementById('calculateBtn').addEventListener('click', function() {
            // 获取所有选项的值
            const discipline = parseFloat(document.querySelector('input[name="discipline"]:checked').value);
            const studyTime = parseFloat(document.querySelector('input[name="studyTime"]:checked').value);
            const gaokao = parseFloat(document.querySelector('input[name="gaokao"]:checked').value);
            const militaryType = parseFloat(document.querySelector('input[name="militaryType"]:checked').value);
            const studyMethod = parseFloat(document.querySelector('input[name="studyMethod"]:checked').value);
            
            // 计算加权得分
            const disciplineScore = discipline * 0.4;
            const studyTimeScore = studyTime * 0.2;
            const gaokaoScore = gaokao * 0.2;
            const militaryTypeScore = militaryType * 0.1;
            const studyMethodScore = studyMethod * 0.1;
            
            // 计算总分
            const totalScore = disciplineScore + studyTimeScore + gaokaoScore + militaryTypeScore + studyMethodScore;
            
            // 显示结果
            const resultSection = document.getElementById('resultSection');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const messageDisplay = document.getElementById('messageDisplay');
            
            scoreDisplay.textContent = `您的军考上岸概率：${totalScore.toFixed(2)}%`;
            
            if (totalScore >= 60) {
                messageDisplay.textContent = "恭喜上岸，更多军考资讯，请加wangxuezhang03";
                messageDisplay.className = "message success";
            } else {
                messageDisplay.textContent = "再接再厉，更多军考资讯，请加wangxuezhang03";
                messageDisplay.className = "message fail";
            }
            
            resultSection.style.display = 'block';
            
            // 滚动到结果部分
            resultSection.scrollIntoView({ behavior: 'smooth' });
        });
    </script>
