<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片转Icon工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            margin: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .controls {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .control-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-item label {
            font-weight: 600;
            color: #495057;
            font-size: 0.9rem;
        }

        .control-item select,
        .control-item input {
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .control-item select:focus,
        .control-item input:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }

        .storage-options {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-top: 20px;
        }

        .radio-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .radio-group input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #4facfe;
        }

        .drop-zone {
            margin: 30px;
            border: 3px dashed #4facfe;
            border-radius: 15px;
            padding: 60px 30px;
            text-align: center;
            background: linear-gradient(135deg, #f8f9ff 0%, #e8f4fd 100%);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            flex: 1;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .drop-zone.drag-over {
            border-color: #0056b3;
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            transform: scale(1.02);
        }

        .drop-zone-content {
            position: relative;
            z-index: 2;
        }

        .drop-zone h3 {
            color: #4facfe;
            font-size: 1.5rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .drop-zone p {
            color: #6c757d;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .upload-btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 172, 254, 0.4);
        }

        .results {
            padding: 40px 30px;
            display: none;
            min-height: 400px;
            flex: 1;
        }

        .results.show {
            display: block;
        }

        .results h3 {
            color: #495057;
            margin-bottom: 30px;
            font-size: 1.5rem;
            text-align: center;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
        }

        .image-item {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            transition: all 0.3s ease;
        }

        .image-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .image-preview {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-name {
            font-size: 1rem;
            color: #495057;
            margin-bottom: 20px;
            font-weight: 600;
            word-break: break-word;
        }

        .download-btn {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
        }

        .batch-actions {
            margin-top: 40px;
            text-align: center;
            padding-bottom: 20px;
        }

        .batch-download-btn {
            background: linear-gradient(135deg, #6f42c1 0%, #e83e8c 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(111, 66, 193, 0.3);
        }

        .batch-download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(111, 66, 193, 0.4);
        }

        .batch-download-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .processing {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 1000;
            display: none;
        }

        .processing.show {
            display: block;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4facfe;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .file-input {
            display: none;
        }

        .custom-path {
            display: none;
        }

        .custom-path.show {
            display: block;
            margin-top: 15px;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 1001;
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.error {
            background: #dc3545;
        }

        .footer {
            background: #2c3e50;
            color: #bdc3c7;
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
            margin-top: auto;
            width: 100%;
        }

        .footer a {
            color: #3498db;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .container {
                margin: 0;
                border-radius: 15px;
            }
            
            .header {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
            
            .header p {
                font-size: 1rem;
            }
            
            .controls {
                padding: 20px;
            }
            
            .control-group {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .drop-zone {
                margin: 20px;
                padding: 40px 20px;
                min-height: 250px;
            }
            
            .drop-zone h3 {
                font-size: 1.3rem;
            }
            
            .drop-zone p {
                font-size: 1rem;
            }
            
            .results {
                padding: 20px;
            }
            
            .results h3 {
                font-size: 1.3rem;
                margin-bottom: 20px;
            }
            
            .image-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 15px;
            }
            
            .image-preview {
                width: 100px;
                height: 100px;
                margin-bottom: 15px;
            }
            
            .image-item {
                padding: 20px;
            }
            
            .image-name {
                font-size: 0.9rem;
                margin-bottom: 15px;
            }
            
            .download-btn {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
            
            .batch-actions {
                margin-top: 30px;
                padding-bottom: 20px;
            }
            
            .batch-download-btn {
                padding: 12px 25px;
                font-size: 0.9rem;
            }
            
            .footer {
                padding: 15px;
                font-size: 0.8rem;
            }
        }
        
        @media (max-width: 480px) {
            .image-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
            
            .image-preview {
                width: 80px;
                height: 80px;
            }
            
            .drop-zone {
                padding: 30px 15px;
            }
            
            .header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 图片转Icon工具</h1>
            <p>拖拽上传，即时转换，批量处理，简单高效</p>
        </div>

        <div class="controls">
            <div class="control-group">
                <div class="control-item">
                    <label for="size">Icon尺寸</label>
                    <select id="size">
                        <option value="16">16x16</option>
                        <option value="24">24x24</option>
                        <option value="32">32x32</option>
                        <option value="48">48x48</option>
                        <option value="64" selected>64x64</option>
                        <option value="128">128x128</option>
                        <option value="256">256x256</option>
                        <option value="512">512x512</option>
                    </select>
                </div>
                <div class="control-item">
                    <label for="borderRadius">圆角大小</label>
                    <select id="borderRadius">
                        <option value="0">无圆角</option>
                        <option value="10">轻微圆角</option>
                        <option value="20" selected>中等圆角</option>
                        <option value="30">较大圆角</option>
                        <option value="50">圆形</option>
                    </select>
                </div>
                <div class="control-item">
                    <label for="format">输出格式</label>
                    <select id="format">
                        <option value="png" selected>PNG</option>
                        <option value="jpeg">JPEG</option>
                        <option value="webp">WebP</option>
                        <option value="ico">ICO</option>
                    </select>
                </div>
            </div>

            <div class="storage-options">
                <label>存储位置:</label>
                <div class="radio-group">
                    <input type="radio" id="sameFolder" name="storage" value="same" checked>
                    <label for="sameFolder">同源文件夹</label>
                </div>
                <div class="radio-group">
                    <input type="radio" id="customFolder" name="storage" value="custom">
                    <label for="customFolder">自定义路径</label>
                </div>
            </div>
            
            <div class="custom-path" id="customPath">
                <div class="control-item">
                    <label for="customPathInput">自定义路径</label>
                    <input type="text" id="customPathInput" placeholder="输入自定义文件夹名称">
                </div>
            </div>
        </div>

        <div class="drop-zone" id="dropZone">
            <div class="drop-zone-content">
                <h3>📁 拖拽图片到这里</h3>
                <p>支持 PNG、JPG、JPEG、WebP 格式</p>
                <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                    选择文件
                </button>
            </div>
            <input type="file" id="fileInput" class="file-input" multiple accept="image/*">
        </div>

        <div class="results" id="results">
            <h3>转换结果</h3>
            <div class="image-grid" id="imageGrid"></div>
            <div class="batch-actions">
                <button class="batch-download-btn" id="batchDownloadBtn" onclick="downloadAll()">
                    📦 批量下载全部
                </button>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>© 2025 @AI编程-垂直小流量复利商业化 - 专业的图片转icon工具</p>
    </div>

    <div class="processing" id="processing">
        <div class="spinner"></div>
        <p>正在处理图片...</p>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let processedImages = [];
        let currentSettings = {
            size: 64,
            borderRadius: 20,
            format: 'png',
            storage: 'same',
            customPath: ''
        };

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            setupEventListeners();
            updateSettings();
        });

        function setupEventListeners() {
            const dropZone = document.getElementById('dropZone');
            const fileInput = document.getElementById('fileInput');
            const storageInputs = document.querySelectorAll('input[name="storage"]');

            // 拖拽事件
            dropZone.addEventListener('dragover', handleDragOver);
            dropZone.addEventListener('dragleave', handleDragLeave);
            dropZone.addEventListener('drop', handleDrop);

            // 文件选择
            fileInput.addEventListener('change', handleFileSelect);

            // 设置变更
            document.getElementById('size').addEventListener('change', updateSettings);
            document.getElementById('borderRadius').addEventListener('change', updateSettings);
            document.getElementById('format').addEventListener('change', updateSettings);
            
            // 存储选项
            storageInputs.forEach(input => {
                input.addEventListener('change', function() {
                    currentSettings.storage = this.value;
                    const customPath = document.getElementById('customPath');
                    if (this.value === 'custom') {
                        customPath.classList.add('show');
                    } else {
                        customPath.classList.remove('show');
                    }
                });
            });

            document.getElementById('customPathInput').addEventListener('input', function() {
                currentSettings.customPath = this.value;
            });

            // 阻止默认拖拽行为
            document.addEventListener('dragover', e => e.preventDefault());
            document.addEventListener('drop', e => e.preventDefault());
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            const files = Array.from(e.dataTransfer.files).filter(file => file.type.startsWith('image/'));
            if (files.length > 0) {
                processFiles(files);
            }
        }

        function handleFileSelect(e) {
            const files = Array.from(e.target.files);
            if (files.length > 0) {
                processFiles(files);
            }
        }

        function updateSettings() {
            currentSettings.size = parseInt(document.getElementById('size').value);
            currentSettings.borderRadius = parseInt(document.getElementById('borderRadius').value);
            currentSettings.format = document.getElementById('format').value;
            
            // 重新处理已有图片
            if (processedImages.length > 0) {
                reprocessImages();
            }
        }

        function processFiles(files) {
            showProcessing();
            processedImages = [];
            
            Promise.all(files.map(file => processImage(file)))
                .then(results => {
                    processedImages = results.filter(result => result !== null);
                    displayResults();
                    hideProcessing();
                    showToast('处理完成！', 'success');
                })
                .catch(error => {
                    hideProcessing();
                    showToast('处理失败：' + error.message, 'error');
                });
        }

        function processImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        try {
                            const canvas = document.createElement('canvas');
                            const ctx = canvas.getContext('2d');
                            
                            canvas.width = currentSettings.size;
                            canvas.height = currentSettings.size;
                            
                            // 绘制圆角背景
                            if (currentSettings.borderRadius > 0) {
                                ctx.beginPath();
                                const radius = Math.min(currentSettings.borderRadius, currentSettings.size / 2);
                                ctx.roundRect(0, 0, currentSettings.size, currentSettings.size, radius);
                                ctx.clip();
                            }
                            
                            // 绘制图片
                            ctx.drawImage(img, 0, 0, currentSettings.size, currentSettings.size);
                            
                            // 转换为指定格式
                            let mimeType = 'image/png';
                            if (currentSettings.format === 'jpeg') mimeType = 'image/jpeg';
                            if (currentSettings.format === 'webp') mimeType = 'image/webp';
                            
                            canvas.toBlob(function(blob) {
                                const originalName = file.name.split('.')[0];
                                const fileName = `${originalName}_icon_${currentSettings.size}x${currentSettings.size}.${currentSettings.format}`;
                                
                                resolve({
                                    blob: blob,
                                    fileName: fileName,
                                    originalName: originalName,
                                    dataUrl: canvas.toDataURL(mimeType)
                                });
                            }, mimeType, 0.9);
                            
                        } catch (error) {
                            reject(error);
                        }
                    };
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function reprocessImages() {
            if (processedImages.length === 0) return;
            
            showProcessing();
            
            Promise.all(processedImages.map(item => {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = function() {
                        try {
                            const canvas = document.createElement('canvas');
                            const ctx = canvas.getContext('2d');
                            
                            canvas.width = currentSettings.size;
                            canvas.height = currentSettings.size;
                            
                            if (currentSettings.borderRadius > 0) {
                                ctx.beginPath();
                                const radius = Math.min(currentSettings.borderRadius, currentSettings.size / 2);
                                ctx.roundRect(0, 0, currentSettings.size, currentSettings.size, radius);
                                ctx.clip();
                            }
                            
                            ctx.drawImage(img, 0, 0, currentSettings.size, currentSettings.size);
                            
                            let mimeType = 'image/png';
                            if (currentSettings.format === 'jpeg') mimeType = 'image/jpeg';
                            if (currentSettings.format === 'webp') mimeType = 'image/webp';
                            
                            canvas.toBlob(function(blob) {
                                const fileName = `${item.originalName}_icon_${currentSettings.size}x${currentSettings.size}.${currentSettings.format}`;
                                
                                resolve({
                                    blob: blob,
                                    fileName: fileName,
                                    originalName: item.originalName,
                                    dataUrl: canvas.toDataURL(mimeType)
                                });
                            }, mimeType, 0.9);
                            
                        } catch (error) {
                            reject(error);
                        }
                    };
                    img.src = item.dataUrl;
                });
            }))
            .then(results => {
                processedImages = results;
                displayResults();
                hideProcessing();
            })
            .catch(error => {
                hideProcessing();
                showToast('重新处理失败：' + error.message, 'error');
            });
        }

        function displayResults() {
            const imageGrid = document.getElementById('imageGrid');
            const results = document.getElementById('results');
            
            imageGrid.innerHTML = '';
            
            processedImages.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'image-item';
                itemDiv.innerHTML = `
                    <div class="image-preview">
                        <img src="${item.dataUrl}" alt="${item.originalName}">
                    </div>
                    <div class="image-name">${item.originalName}</div>
                    <button class="download-btn" onclick="downloadSingle(${index})">
                        💾 下载
                    </button>
                `;
                imageGrid.appendChild(itemDiv);
            });
            
            results.classList.add('show');
            document.getElementById('batchDownloadBtn').disabled = processedImages.length === 0;
        }

        function downloadSingle(index) {
            const item = processedImages[index];
            const link = document.createElement('a');
            link.href = URL.createObjectURL(item.blob);
            link.download = item.fileName;
            link.click();
            URL.revokeObjectURL(link.href);
            
            showToast('下载完成！', 'success');
        }

        function downloadAll() {
            if (processedImages.length === 0) return;
            
            showProcessing();
            
            // 创建ZIP文件需要外部库，这里使用逐个下载
            processedImages.forEach((item, index) => {
                setTimeout(() => {
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(item.blob);
                    link.download = item.fileName;
                    link.click();
                    URL.revokeObjectURL(link.href);
                    
                    if (index === processedImages.length - 1) {
                        hideProcessing();
                        showToast('批量下载完成！', 'success');
                    }
                }, index * 200);
            });
        }

        function showProcessing() {
            document.getElementById('processing').classList.add('show');
        }

        function hideProcessing() {
            document.getElementById('processing').classList.remove('show');
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // 添加roundRect支持（对于较老的浏览器）
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, width, height, radius) {
                if (typeof radius === 'number') {
                    radius = {tl: radius, tr: radius, br: radius, bl: radius};
                } else {
                    radius = {tl: 0, tr: 0, br: 0, bl: 0, ...radius};
                }
                
                this.beginPath();
                this.moveTo(x + radius.tl, y);
                this.lineTo(x + width - radius.tr, y);
                this.quadraticCurveTo(x + width, y, x + width, y + radius.tr);
                this.lineTo(x + width, y + height - radius.br);
                this.quadraticCurveTo(x + width, y + height, x + width - radius.br, y + height);
                this.lineTo(x + radius.bl, y + height);
                this.quadraticCurveTo(x, y + height, x, y + height - radius.bl);
                this.lineTo(x, y + radius.tl);
                this.quadraticCurveTo(x, y, x + radius.tl, y);
                this.closePath();
            };
        }
    </script>
</body>
