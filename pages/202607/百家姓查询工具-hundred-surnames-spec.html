<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📜 百家姓查询工具 📜</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', '宋体', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            color: #333;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 页面加载动画 */
        .page-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #8B4513, #A0522D);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .page-loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader-content {
            text-align: center;
            color: white;
        }

        .loader-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            font-size: 1.2em;
            font-weight: bold;
        }

        .surname-app {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s ease forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .app-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .app-header h1 {
            color: #8B4513;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .search-container {
            max-width: 500px;
            margin: 0 auto;
            position: relative;
        }

        .search-wrapper {
            display: flex;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
        }

        #search-input {
            flex: 1;
            padding: 15px 20px;
            border: none;
            font-size: 16px;
            outline: none;
        }

        #search-btn {
            padding: 15px 20px;
            background: #8B4513;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        #search-btn:hover {
            background: #A0522D;
        }

        .search-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border-radius: 0 0 15px 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .search-suggestions.show {
            display: block;
        }

        .suggestion-item {
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .suggestion-item:hover,
        .suggestion-item.selected {
            background: #f9f9f9;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-type {
            font-size: 0.8em;
            color: #8B4513;
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 40px;
            text-align: center;
        }

        .suggestion-text {
            flex: 1;
        }

        .suggestion-detail {
            font-size: 0.9em;
            color: #666;
        }

        .quick-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 10px 20px;
            border: 2px solid #8B4513;
            background: white;
            color: #8B4513;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            font-weight: 500;
        }

        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: #8B4513;
            transition: left 0.3s ease;
            z-index: -1;
        }

        .nav-btn:hover::before,
        .nav-btn.active::before {
            left: 0;
        }

        .nav-btn.active, .nav-btn:hover {
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 69, 19, 0.3);
        }

        .alphabet-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .alphabet-btn {
            width: 40px;
            height: 40px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: bold;
            position: relative;
            overflow: hidden;
        }

        .alphabet-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: #8B4513;
            border-radius: 50%;
            transition: all 0.3s ease;
            transform: translate(-50%, -50%);
            z-index: -1;
        }

        .alphabet-btn:hover::before,
        .alphabet-btn.active::before {
            width: 100%;
            height: 100%;
        }

        .alphabet-btn:hover, .alphabet-btn.active {
            color: white;
            border-color: #8B4513;
            transform: scale(1.1);
            box-shadow: 0 4px 12px rgba(139, 69, 19, 0.3);
        }

        .surname-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .surname-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px);
            animation: cardFadeIn 0.6s ease forwards;
        }

        .surname-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.6s;
        }

        .surname-card:hover::before {
            left: 100%;
        }

        .surname-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
        }

        @keyframes cardFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .surname-card:nth-child(1) { animation-delay: 0.1s; }
        .surname-card:nth-child(2) { animation-delay: 0.2s; }
        .surname-card:nth-child(3) { animation-delay: 0.3s; }
        .surname-card:nth-child(4) { animation-delay: 0.4s; }
        .surname-card:nth-child(5) { animation-delay: 0.5s; }
        .surname-card:nth-child(6) { animation-delay: 0.6s; }

        .surname-main {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .surname-char {
            font-size: 3em;
            color: #8B4513;
            margin-right: 15px;
            font-weight: bold;
        }

        .surname-info {
            flex: 1;
        }

        .surname-pinyin {
            font-size: 1.2em;
            color: #666;
        }

        .surname-ranking {
            color: #8B4513;
            font-weight: bold;
        }

        .surname-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 0.9em;
            color: #666;
        }

        .surname-actions {
            display: flex;
            gap: 10px;
        }

        .favorite-btn, .detail-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .favorite-btn {
            background: #f0f0f0;
        }

        .favorite-btn.active {
            background: #ff6b6b;
            color: white;
        }

        .detail-btn {
            background: #8B4513;
            color: white;
            flex: 1;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }



        .ranking-list {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .ranking-item {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .ranking-number {
            width: 50px;
            font-size: 1.5em;
            font-weight: bold;
            color: #8B4513;
        }

        .ranking-surname {
            font-size: 2em;
            margin-right: 20px;
            color: #8B4513;
        }

        .ranking-info {
            flex: 1;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            width: 90%;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }

        .detail-section {
            margin-bottom: 20px;
        }

        .detail-section h3 {
            color: #8B4513;
            margin-bottom: 10px;
            border-bottom: 2px solid #8B4513;
            padding-bottom: 5px;
        }

        .no-results {
            text-align: center;
            color: #666;
            font-size: 1.2em;
            padding: 40px;
        }

        .filter-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .filter-group {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        .filter-group label {
            min-width: 80px;
            font-weight: bold;
            color: #8B4513;
        }

        .filter-group select {
            flex: 1;
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .filter-group select:focus {
            border-color: #8B4513;
        }

        .filter-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .filter-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .filter-btn:not(.secondary) {
            background: #8B4513;
            color: white;
        }

        .filter-btn:not(.secondary):hover {
            background: #A0522D;
            transform: translateY(-2px);
        }

        .filter-btn.secondary {
            background: #f0f0f0;
            color: #666;
            border: 2px solid #ddd;
        }

        .filter-btn.secondary:hover {
            background: #e0e0e0;
            border-color: #ccc;
        }

        .filter-results {
            margin-top: 20px;
        }

        .stats-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .stats-overview {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .stat-card {
            background: linear-gradient(135deg, #8B4513, #A0522D);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(139, 69, 19, 0.3);
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .stats-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .stats-section h3 {
            color: #8B4513;
            margin-bottom: 20px;
            border-bottom: 2px solid #8B4513;
            padding-bottom: 10px;
        }

        .chart-container {
            margin-top: 15px;
        }

        .bar-chart {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .bar-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .bar-label {
            font-weight: bold;
            color: #8B4513;
            min-width: 80px;
        }

        .bar-container {
            background: #f0f0f0;
            border-radius: 8px;
            height: 30px;
            position: relative;
            overflow: hidden;
        }

        .bar {
            height: 100%;
            background: linear-gradient(90deg, #8B4513, #A0522D);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            min-width: 60px;
            transition: width 0.8s ease;
        }

        .bar.origin-bar {
            background: linear-gradient(90deg, #2E8B57, #3CB371);
        }

        .bar.region-bar {
            background: linear-gradient(90deg, #4682B4, #5F9EA0);
        }

        .bar.population-bar {
            background: linear-gradient(90deg, #CD853F, #DEB887);
        }

        .bar-value {
            color: white;
            font-size: 0.8em;
            font-weight: bold;
            white-space: nowrap;
        }

        .bar-detail {
            font-size: 0.8em;
            color: #666;
            margin-left: 10px;
        }

        /* 返回顶部按钮 */
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #8B4513, #A0522D);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            box-shadow: 0 4px 15px rgba(139, 69, 19, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            z-index: 1000;
        }

        .back-to-top.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .back-to-top:hover {
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 8px 25px rgba(139, 69, 19, 0.4);
        }

        .back-to-top:active {
            transform: translateY(-2px) scale(1.05);
        }

        /* 平板设备 */
        @media (max-width: 1024px) {
            .surname-app {
                padding: 15px;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .surname-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
        }

        /* 手机设备 */
        @media (max-width: 768px) {
            .surname-app {
                padding: 10px;
            }

            .app-header h1 {
                font-size: 2em;
                margin-bottom: 15px;
            }

            .search-container {
                max-width: 100%;
                margin: 0 10px;
            }

            .quick-nav {
                flex-wrap: wrap;
                gap: 8px;
                margin-bottom: 20px;
            }

            .nav-btn {
                padding: 8px 16px;
                font-size: 0.9em;
            }

            .surname-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .alphabet-nav {
                gap: 3px;
                margin-bottom: 15px;
            }

            .alphabet-btn {
                width: 35px;
                height: 35px;
                font-size: 0.9em;
            }

            .surname-card {
                padding: 15px;
            }

            .surname-char {
                font-size: 2.5em;
                margin-right: 10px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .stat-card {
                padding: 15px;
            }

            .stat-number {
                font-size: 2em;
            }

            .filter-group {
                flex-direction: column;
                align-items: stretch;
                gap: 5px;
            }

            .filter-group label {
                min-width: auto;
            }

            .filter-actions {
                flex-direction: column;
                gap: 10px;
            }

            .modal-content {
                width: 95%;
                max-height: 90vh;
                padding: 20px;
            }
        }

        /* 小屏手机 */
        @media (max-width: 480px) {
            .surname-app {
                padding: 8px;
            }

            .app-header h1 {
                font-size: 1.8em;
            }

            .search-container {
                margin: 0 5px;
            }

            .alphabet-btn {
                width: 30px;
                height: 30px;
                font-size: 0.8em;
            }

            .surname-char {
                font-size: 2em;
            }

            .surname-card {
                padding: 12px;
            }

            .stat-number {
                font-size: 1.8em;
            }

            .bar-container {
                height: 25px;
            }

            .bar-value {
                font-size: 0.7em;
            }
        }

        /* 触摸设备优化 */
        @media (hover: none) and (pointer: coarse) {
            .surname-card:hover {
                transform: none;
                box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            }

            .nav-btn:hover {
                transform: none;
            }

            .alphabet-btn:hover {
                transform: none;
            }

            .surname-card:active {
                transform: scale(0.98);
            }

            .nav-btn:active {
                transform: scale(0.95);
            }

            .alphabet-btn:active {
                transform: scale(0.9);
            }
        }
    </style>
</head>
<body>
    <!-- 页面加载器 -->
    <div class="page-loader" id="page-loader">
        <div class="loader-content">
            <div class="loader-spinner"></div>
            <div class="loader-text">正在加载百家姓数据...</div>
        </div>
    </div>

    <div class="surname-app">
        <header class="app-header">
            <h1>📜 百家姓查询 📜</h1>
            <div class="search-container">
                <div class="search-wrapper">
                    <input type="text" id="search-input" placeholder="请输入姓氏、拼音、地区或名人..." autocomplete="off" />
                    <button id="search-btn">🔍</button>
                    <div class="search-suggestions" id="search-suggestions"></div>
                </div>
            </div>
        </header>
        
        <nav class="quick-nav">
            <button class="nav-btn active" data-type="pinyin">拼音检索</button>
            <button class="nav-btn" data-type="ranking">排名查询</button>
            <button class="nav-btn" data-type="filter">高级筛选</button>
            <button class="nav-btn" data-type="statistics">统计分析</button>
        </nav>
        
        <main class="main-content">
            <section class="section active" id="pinyin-section">
                <h2>拼音索引</h2>
                <div class="alphabet-nav" id="alphabet-nav"></div>
                <div class="surname-list" id="surname-list"></div>
            </section>
            

            
            <section class="section" id="ranking-section">
                <h2>姓氏排名</h2>
                <div class="ranking-list" id="ranking-list"></div>
            </section>

            <section class="section" id="filter-section">
                <h2>高级筛选</h2>
                <div class="filter-container">
                    <div class="filter-group">
                        <label>排名范围:</label>
                        <select id="ranking-filter">
                            <option value="">全部</option>
                            <option value="top10">前10名</option>
                            <option value="top50">前50名</option>
                            <option value="top100">前100名</option>
                        </select>
                    </div>



                    <div class="filter-group">
                        <label>起源类型:</label>
                        <select id="origin-filter">
                            <option value="">全部</option>
                            <option value="姬姓">姬姓</option>
                            <option value="姜姓">姜姓</option>
                            <option value="嬴姓">嬴姓</option>
                            <option value="子姓">子姓</option>
                            <option value="妫姓">妫姓</option>
                            <option value="祁姓">祁姓</option>
                            <option value="芈姓">芈姓</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label>主要分布:</label>
                        <select id="region-filter">
                            <option value="">全部</option>
                            <option value="河南">河南</option>

            constructor() {
                this.surnames = surnamesData;
                this.favorites = this.loadFavorites();
                this.currentSection = 'pinyin';
                this.init();
            }

            init() {
                this.buildIndexes();
                this.renderPinyinIndex();
                this.bindEvents();
                this.showSurnamesByLetter('W');
                this.initBackToTop();
            }

            buildIndexes() {
                this.pinyinIndex = {};
                this.rankingIndex = {};
                this.originIndex = {};
                this.regionIndex = {};
                this.searchIndex = new Map();

                this.surnames.forEach(surname => {
                    // 拼音索引
                    const firstLetter = surname.pinyin.charAt(0).toUpperCase();
                    if (!this.pinyinIndex[firstLetter]) {
                        this.pinyinIndex[firstLetter] = [];
                    }
                    this.pinyinIndex[firstLetter].push(surname);

                    // 排名索引
                    const rankingRange = this.getRankingRange(surname.ranking);
                    if (!this.rankingIndex[rankingRange]) {
                        this.rankingIndex[rankingRange] = [];
                    }
                    this.rankingIndex[rankingRange].push(surname);

                    // 起源索引
                    surname.origins.forEach(origin => {
                        if (!this.originIndex[origin.type]) {
                            this.originIndex[origin.type] = [];
                        }
                        this.originIndex[origin.type].push(surname);
                    });

                    // 地区索引
                    surname.distribution.main.forEach(region => {
                        if (!this.regionIndex[region]) {
                            this.regionIndex[region] = [];
                        }
                        this.regionIndex[region].push(surname);
                    });

                    // 搜索索引 - 包含姓氏、拼音、声调等所有可搜索内容
                    const searchTerms = [
                        surname.surname,
                        surname.pinyin,
                        surname.tone,
                        ...surname.distribution.main,
                        ...surname.celebrities.map(c => c.name),
                        surname.genealogy.hallName,
                        surname.genealogy.ancestralPlace
                    ];

                    searchTerms.forEach(term => {
                        if (term) {
                            const key = term.toLowerCase();
                            if (!this.searchIndex.has(key)) {
                                this.searchIndex.set(key, new Set());
                            }
                            this.searchIndex.get(key).add(surname);
                        }
                    });
                });

                // 排序索引
                Object.keys(this.pinyinIndex).forEach(letter => {
                    this.pinyinIndex[letter].sort((a, b) => a.ranking - b.ranking);
                });
            }

            getRankingRange(ranking) {
                if (ranking <= 10) return 'top10';
                if (ranking <= 50) return 'top50';
                if (ranking <= 100) return 'top100';
                return 'others';
            }

            renderPinyinIndex() {
                const alphabetNav = document.getElementById('alphabet-nav');
                const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
                
                alphabetNav.innerHTML = alphabet.map(letter => `
                    <button class="alphabet-btn" data-letter="${letter}">
                        ${letter}
                    </button>
                `).join('');
            }

            showSurnamesByLetter(letter) {
                const surnameList = document.getElementById('surname-list');
                const surnames = this.pinyinIndex[letter] || [];
                
                document.querySelectorAll('.alphabet-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.letter === letter);
                });
                
                if (surnames.length === 0) {
                    surnameList.innerHTML = `<div class="no-results">暂无${letter}开头的姓氏</div>`;
                    return;
                }
                
                surnameList.innerHTML = `
                    <h3>${letter}开头的姓氏 (${surnames.length}个)</h3>
                    <div class="surname-grid">
                        ${surnames.map(surname => this.renderSurnameCard(surname)).join('')}
                    </div>
                `;
            }

            renderSurnameCard(surname) {
                return `
                    <div class="surname-card" data-surname-id="${surname.id}">
                        <div class="surname-main">

                            </button>

                        </div>

            addClickAnimation(element) {
                element.style.transform = 'scale(0.95)';

            initBackToTop() {
                const backToTopBtn = document.getElementById('back-to-top');

                // 监听滚动事件
                window.addEventListener('scroll', () => {
                    if (window.pageYOffset > 300) {
                        backToTopBtn.classList.add('show');
                    } else {
                        backToTopBtn.classList.remove('show');
                    }
                });

                // 点击返回顶部
                backToTopBtn.addEventListener('click', () => {
                    this.addClickAnimation(backToTopBtn);
                    window.scrollTo({
                        top: 0,
                        behavior: 'smooth'
                    });
                });
            }

                const rankingList = document.getElementById('ranking-list');
                const topSurnames = [...this.surnames].sort((a, b) => a.ranking - b.ranking);
                
                rankingList.innerHTML = topSurnames.map(surname => `

                const statsContent = document.getElementById('stats-content');

                        <!-- 前10大姓详情 -->

                                    </div>
                                `).join('')}

            }

                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.type === sectionType);
                });
                
                document.querySelectorAll('.section').forEach(section => {
                    section.classList.remove('active');
                });
                
                document.getElementById(`${sectionType}-section`).classList.add('active');
                this.currentSection = sectionType;
                
                if (sectionType === 'ranking') {
                    this.renderRankingSection();
                } else if (sectionType === 'filter') {
                    this.renderFilterSection();
                } else if (sectionType === 'statistics') {
                    this.renderStatisticsSection();
                }
            }

            performSearch() {
                const query = document.getElementById('search-input').value.trim();
                if (!query) return;

                const results = this.smartSearch(query);

                const surnameList = document.getElementById('surname-list');
                if (results.length === 0) {
                    surnameList.innerHTML = `
                        <div class="no-results">
                            <p>未找到相关姓氏</p>
                            <p style="font-size: 0.9em; color: #666; margin-top: 10px;">
                                建议：尝试输入姓氏、拼音、地区名称或名人姓名
                            </p>
                        </div>
                    `;
                } else {
                    surnameList.innerHTML = `
                        <h3>搜索结果 (${results.length}个)</h3>
                        <div class="search-tips" style="margin-bottom: 15px; padding: 10px; background: #f9f9f9; border-radius: 8px; font-size: 0.9em; color: #666;">
                            搜索关键词: "${query}" | 找到 ${results.length} 个相关姓氏
                        </div>
                        <div class="surname-grid">
                            ${results.map(surname => this.renderSurnameCard(surname)).join('')}
                        </div>
                    `;
                }

                // 切换到拼音检索页面显示结果
                this.switchSection('pinyin');

                // 记录搜索历史
                this.addToSearchHistory(query);
            }

            smartSearch(query) {
                const lowerQuery = query.toLowerCase();
                const results = new Set();

                // 1. 精确匹配姓氏
                this.surnames.forEach(surname => {
                    if (surname.surname === query) {
                        results.add(surname);
                    }
                });

                // 2. 拼音匹配
                this.surnames.forEach(surname => {
                    if (surname.pinyin === lowerQuery || surname.tone.includes(query)) {
                        results.add(surname);
                    }
                });

                // 3. 使用搜索索引进行模糊匹配
                for (const [term, surnameSet] of this.searchIndex) {
                    if (term.includes(lowerQuery) || lowerQuery.includes(term)) {
                        surnameSet.forEach(surname => results.add(surname));
                    }
                }

                // 4. 部分匹配
                this.surnames.forEach(surname => {
                    // 姓氏包含查询
                    if (surname.surname.includes(query)) {
                        results.add(surname);
                    }

                    // 拼音包含查询
                    if (surname.pinyin.includes(lowerQuery)) {
                        results.add(surname);
                    }

                    // 地区匹配
                    if (surname.distribution.main.some(region => region.includes(query))) {
                        results.add(surname);
                    }

                    // 名人姓名匹配
                    if (surname.celebrities.some(celebrity => celebrity.name.includes(query))) {
                        results.add(surname);
                    }

                    // 堂号匹配
                    if (surname.genealogy.hallName.includes(query)) {
                        results.add(surname);
                    }
                });

                // 转换为数组并按排名排序
                return Array.from(results).sort((a, b) => a.ranking - b.ranking);
            }

            addToSearchHistory(query) {
                if (!this.searchHistory) {
                    this.searchHistory = this.loadSearchHistory();
                }

                // 避免重复
                this.searchHistory = this.searchHistory.filter(item => item !== query);
                this.searchHistory.unshift(query);

                // 限制历史记录数量
                if (this.searchHistory.length > 20) {
                    this.searchHistory = this.searchHistory.slice(0, 20);
                }

                // 保存到本地存储
                try {
                    localStorage.setItem('surnameSearchHistory', JSON.stringify(this.searchHistory));
                } catch (e) {
                    console.warn('无法保存搜索历史:', e);
                }
            }

            loadSearchHistory() {
                try {
                    return JSON.parse(localStorage.getItem('surnameSearchHistory')) || [];
                } catch (e) {
                    return [];
                }
            }

            renderFilterSection() {
                // 筛选功能已在HTML中定义，这里绑定事件
                this.bindFilterEvents();
            }

            bindFilterEvents() {
                const applyBtn = document.getElementById('apply-filter');
                const resetBtn = document.getElementById('reset-filter');

                if (applyBtn) {
                    applyBtn.addEventListener('click', () => this.applyFilters());
                }

                if (resetBtn) {
                    resetBtn.addEventListener('click', () => this.resetFilters());
                }
            }

            applyFilters() {
                const filters = {
                    ranking: document.getElementById('ranking-filter')?.value || '',
                    origin: document.getElementById('origin-filter')?.value || '',
                    region: document.getElementById('region-filter')?.value || ''
                };

                const results = this.filterSurnames(filters);
                this.displayFilterResults(results, filters);
            }

            filterSurnames(filters) {
                return this.surnames.filter(surname => {
                    // 排名筛选
                    if (filters.ranking) {
                        const rankingRange = this.getRankingRange(surname.ranking);
                        if (rankingRange !== filters.ranking) return false;
                    }

                    // 起源筛选
                    if (filters.origin) {
                        const hasOrigin = surname.origins.some(origin =>
                            filters.origin === '其他' ?
                            !['姬姓', '姜姓', '嬴姓', '子姓', '妫姓', '祁姓', '芈姓'].includes(origin.type) :
                            origin.type === filters.origin
                        );
                        if (!hasOrigin) return false;
                    }

                    // 地区筛选
                    if (filters.region) {
                        if (!surname.distribution.main.includes(filters.region)) return false;
                    }

                    return true;
                });
            }

            displayFilterResults(results, filters) {
                const filterResults = document.getElementById('filter-results');

                if (results.length === 0) {
                    filterResults.innerHTML = `
                        <div class="no-results">
                            <p>没有找到符合条件的姓氏</p>
                            <p style="font-size: 0.9em; color: #666; margin-top: 10px;">
                                请尝试调整筛选条件
                            </p>
                        </div>
                    `;
                    return;
                }

                const activeFilters = Object.entries(filters)
                    .filter(([key, value]) => value)
                    .map(([key, value]) => {
                        const labels = {
                            ranking: '排名',
                            origin: '起源',
                            region: '地区'
                        };
                        return `${labels[key]}: ${value}`;
                    });

                filterResults.innerHTML = `
                    <div class="filter-summary" style="margin-bottom: 15px; padding: 10px; background: #f9f9f9; border-radius: 8px;">
                        <div style="font-weight: bold; margin-bottom: 5px;">筛选条件:</div>
                        <div style="font-size: 0.9em; color: #666;">
                            ${activeFilters.length > 0 ? activeFilters.join(' | ') : '无'}
                        </div>
                        <div style="font-size: 0.9em; color: #8B4513; margin-top: 5px;">
                            找到 ${results.length} 个符合条件的姓氏
                        </div>
                    </div>
                    <div class="surname-grid">
                        ${results.map(surname => this.renderSurnameCard(surname)).join('')}
                    </div>
                `;
            }

            resetFilters() {
                document.getElementById('ranking-filter').value = '';
                document.getElementById('origin-filter').value = '';
                document.getElementById('region-filter').value = '';

                document.getElementById('filter-results').innerHTML = `
                    <div style="text-align: center; color: #666; padding: 40px;">
                        <p>请选择筛选条件，然后点击"应用筛选"</p>
                    </div>
                `;
            }

            handleSearchInput(query) {
                if (!query || query.length < 1) {
                    this.hideSuggestions();
                    return;
                }

                const suggestions = this.generateSuggestions(query);
                this.showSuggestions(suggestions);
            }

            generateSuggestions(query) {
                const suggestions = [];
                const lowerQuery = query.toLowerCase();
                const maxSuggestions = 8;

                // 1. 姓氏直接匹配
                this.surnames.forEach(surname => {
                    if (suggestions.length >= maxSuggestions) return;

                    if (surname.surname.includes(query) ||
                        surname.pinyin.includes(lowerQuery) ||
                        surname.tone.includes(query)) {
                        suggestions.push({
                            type: '姓氏',
                            text: surname.surname,
                            detail: `${surname.tone} | 第${surname.ranking}位`,
                            action: () => this.selectSuggestion(surname.surname)
                        });
                    }
                });

                // 2. 地区匹配
                const regions = new Set();
                this.surnames.forEach(surname => {
                    surname.distribution.main.forEach(region => {
                        if (region.includes(query) && !regions.has(region)) {
                            regions.add(region);
                            if (suggestions.length < maxSuggestions) {
                                suggestions.push({
                                    type: '地区',
                                    text: region,
                                    detail: `查看${region}的姓氏分布`,
                                    action: () => this.selectSuggestion(region)
                                });
                            }
                        }
                    });
                });

                // 3. 名人匹配
                this.surnames.forEach(surname => {
                    if (suggestions.length >= maxSuggestions) return;

                    surname.celebrities.forEach(celebrity => {
                        if (celebrity.name.includes(query)) {
                            suggestions.push({
                                type: '名人',
                                text: celebrity.name,
                                detail: `${surname.surname}姓 | ${celebrity.period}`,
                                action: () => this.selectSuggestion(surname.surname)
                            });
                        }
                    });
                });

                // 4. 搜索历史
                if (this.searchHistory) {
                    this.searchHistory.forEach(historyItem => {
                        if (suggestions.length >= maxSuggestions) return;

                        if (historyItem.includes(query) && historyItem !== query) {
                            suggestions.push({
                                type: '历史',
                                text: historyItem,
                                detail: '搜索历史',
                                action: () => this.selectSuggestion(historyItem)
                            });
                        }
                    });
                }

                return suggestions;
            }

            showSuggestions(suggestions) {
                const suggestionsContainer = document.getElementById('search-suggestions');

                if (suggestions.length === 0) {
                    this.hideSuggestions();
                    return;
                }

                suggestionsContainer.innerHTML = suggestions.map(suggestion => `
                    <div class="suggestion-item" data-action="suggestion">
                        <span class="suggestion-type">${suggestion.type}</span>
                        <div class="suggestion-content">
                            <div class="suggestion-text">${suggestion.text}</div>
                            <div class="suggestion-detail">${suggestion.detail}</div>
                        </div>
                    </div>
                `).join('');

                // 绑定点击事件
                suggestionsContainer.querySelectorAll('.suggestion-item').forEach((item, index) => {
                    item.addEventListener('click', () => {
                        suggestions[index].action();
                        this.hideSuggestions();
                    });
                });

                suggestionsContainer.classList.add('show');
            }

            hideSuggestions() {
                const suggestionsContainer = document.getElementById('search-suggestions');
                suggestionsContainer.classList.remove('show');
            }

            selectSuggestion(text) {
                document.getElementById('search-input').value = text;
                this.performSearch();
            }

            navigateSuggestions(direction) {
                const suggestions = document.querySelectorAll('.suggestion-item');
                if (suggestions.length === 0) return;

                const currentSelected = document.querySelector('.suggestion-item.selected');
                let newIndex = 0;

                if (currentSelected) {
                    const currentIndex = Array.from(suggestions).indexOf(currentSelected);
                    if (direction === 'down') {
                        newIndex = (currentIndex + 1) % suggestions.length;
                    } else {
                        newIndex = currentIndex === 0 ? suggestions.length - 1 : currentIndex - 1;
                    }
                    currentSelected.classList.remove('selected');
                } else if (direction === 'up') {
                    newIndex = suggestions.length - 1;
                }

                suggestions[newIndex].classList.add('selected');
                suggestions[newIndex].scrollIntoView({ block: 'nearest' });
            }



            getOriginStatistics() {
                const originStats = {};
                this.surnames.forEach(surname => {
                    surname.origins.forEach(origin => {
                        if (!originStats[origin.type]) {
                            originStats[origin.type] = { count: 0, surnames: [], totalPopulation: 0 };
                        }
                        originStats[origin.type].count++;
                        originStats[origin.type].surnames.push(surname.surname);
                        originStats[origin.type].totalPopulation += surname.population;
                    });
                });

                return Object.entries(originStats)
                    .map(([type, data]) => ({
                        type,
                        count: data.count,
                        surnames: data.surnames,
                        totalPopulation: data.totalPopulation,
                        percentage: ((data.count / this.surnames.length) * 100).toFixed(1)
                    }))
                    .sort((a, b) => b.count - a.count);
            }

            getRegionStatistics() {
                const regionStats = {};
                this.surnames.forEach(surname => {
                    surname.distribution.main.forEach(region => {
                        if (!regionStats[region]) {
                            regionStats[region] = { count: 0, surnames: [], totalPopulation: 0 };
                        }
                        regionStats[region].count++;
                        regionStats[region].surnames.push(surname.surname);
                        regionStats[region].totalPopulation += surname.population;
                    });
                });

                return Object.entries(regionStats)
                    .map(([region, data]) => ({
                        region,
                        count: data.count,
                        surnames: data.surnames,
                        totalPopulation: data.totalPopulation,
                        percentage: ((data.count / this.surnames.length) * 100).toFixed(1)
                    }))
                    .sort((a, b) => b.count - a.count)
                    .slice(0, 15); // 只显示前15个地区
            }

            getPopulationRangeStatistics() {
                const ranges = [
                    { min: 50000000, max: Infinity, label: '5000万以上' },
                    { min: 10000000, max: 50000000, label: '1000万-5000万' },
                    { min: 5000000, max: 10000000, label: '500万-1000万' },
                    { min: 1000000, max: 5000000, label: '100万-500万' },
                    { min: 100000, max: 1000000, label: '10万-100万' },
                    { min: 0, max: 100000, label: '10万以下' }
                ];

                return ranges.map(range => {
                    const surnames = this.surnames.filter(s =>
                        s.population >= range.min && s.population < range.max
                    );
                    return {
                        label: range.label,
                        count: surnames.length,
                        surnames: surnames.map(s => s.surname),
                        percentage: ((surnames.length / this.surnames.length) * 100).toFixed(1)
                    };
                }).filter(range => range.count > 0);
            }



            renderOriginChart(originStats) {
                const maxCount = Math.max(...originStats.map(s => s.count));
                return `
                    <div class="bar-chart">
                        ${originStats.map(stat => `
                            <div class="bar-item">
                                <div class="bar-label">${stat.type}</div>
                                <div class="bar-container">
                                    <div class="bar origin-bar" style="width: ${(stat.count / maxCount) * 100}%">
                                        <span class="bar-value">${stat.count}个 (${stat.percentage}%)</span>
                                    </div>
                                </div>
                                <div class="bar-detail">
                                    ${stat.surnames.slice(0, 8).join('、')}${stat.surnames.length > 8 ? '等' : ''}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            renderRegionChart(regionStats) {
                const maxCount = Math.max(...regionStats.map(s => s.count));
                return `
                    <div class="bar-chart">
                        ${regionStats.map(stat => `
                            <div class="bar-item">
                                <div class="bar-label">${stat.region}</div>
                                <div class="bar-container">
                                    <div class="bar region-bar" style="width: ${(stat.count / maxCount) * 100}%">
                                        <span class="bar-value">${stat.count}个 (${stat.percentage}%)</span>
                                    </div>
                                </div>
                                <div class="bar-detail">
                                    人口: ${this.formatNumber(stat.totalPopulation)}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            renderPopulationChart(populationRanges) {
                const maxCount = Math.max(...populationRanges.map(r => r.count));
                return `
                    <div class="bar-chart">
                        ${populationRanges.map(range => `
                            <div class="bar-item">
                                <div class="bar-label">${range.label}</div>
                                <div class="bar-container">
                                    <div class="bar population-bar" style="width: ${(range.count / maxCount) * 100}%">
                                        <span class="bar-value">${range.count}个 (${range.percentage}%)</span>
                                    </div>
                                </div>
                                <div class="bar-detail">
                                    ${range.surnames.slice(0, 6).join('、')}${range.surnames.length > 6 ? '等' : ''}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            toggleFavorite(surnameId) {
                const index = this.favorites.indexOf(surnameId);
                if (index > -1) {
                    this.favorites.splice(index, 1);
                } else {
                    this.favorites.push(surnameId);
                }
                this.saveFavorites();
                
                // 更新UI
                const favoriteBtn = document.querySelector(`[data-surname-id="${surnameId}"].favorite-btn`);
                if (favoriteBtn) {
                    favoriteBtn.textContent = this.favorites.includes(surnameId) ? '❤️' : '🤍';
                    favoriteBtn.classList.toggle('active', this.favorites.includes(surnameId));
                }
            }

            formatNumber(num) {
                if (num >= 100000000) {
                    return (num / 100000000).toFixed(2) + '亿';
                } else if (num >= 10000) {
                    return (num / 10000).toFixed(1) + '万';
                }
                return num.toString();
            }

            loadFavorites() {
                try {
                    return JSON.parse(localStorage.getItem('surnameFavorites')) || [];
                } catch {
                    return [];
                }
            }

            saveFavorites() {
                localStorage.setItem('surnameFavorites', JSON.stringify(this.favorites));
            }

            bindEvents() {
                // 搜索功能
                const searchInput = document.getElementById('search-input');
                const searchBtn = document.getElementById('search-btn');

                searchBtn.addEventListener('click', () => this.performSearch());

                searchInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        const selectedSuggestion = document.querySelector('.suggestion-item.selected');
                        if (selectedSuggestion) {
                            selectedSuggestion.click();
                        } else {
                            this.performSearch();
                            this.hideSuggestions();
                        }
                        e.preventDefault();
                    } else if (e.key === 'ArrowDown') {
                        this.navigateSuggestions('down');
                        e.preventDefault();
                    } else if (e.key === 'ArrowUp') {
                        this.navigateSuggestions('up');
                        e.preventDefault();
                    } else if (e.key === 'Escape') {
                        this.hideSuggestions();
                    }
                });

                // 搜索建议
                searchInput.addEventListener('input', (e) => {
                    this.handleSearchInput(e.target.value);
                });

                searchInput.addEventListener('focus', (e) => {
                    if (e.target.value.trim()) {
                        this.handleSearchInput(e.target.value);
                    }
                });

                searchInput.addEventListener('blur', (e) => {
                    // 延迟隐藏，允许点击建议项
                    setTimeout(() => this.hideSuggestions(), 200);
                });
                
                // 事件委托
                document.addEventListener('click', (e) => {
                    if (e.target.classList.contains('nav-btn')) {
                        this.addClickAnimation(e.target);
                        this.switchSection(e.target.dataset.type);
                    }

                    if (e.target.classList.contains('alphabet-btn')) {
                        this.addClickAnimation(e.target);
                        this.showSurnamesByLetter(e.target.dataset.letter);
                    }

                    if (e.target.id === 'apply-filter') {
                        this.applyFilters();
                    }

                    if (e.target.id === 'reset-filter') {
                        this.resetFilters();
                    }
                    
                    if (e.target.classList.contains('surname-card') || 
                        e.target.classList.contains('detail-btn') ||
                        e.target.classList.contains('ranking-item')) {
                        const surnameId = e.target.dataset.surnameId || 
                                         e.target.closest('[data-surname-id]').dataset.surnameId;
                        this.showSurnameDetail(surnameId);
                    }
                    
                    if (e.target.classList.contains('favorite-btn')) {
                        e.stopPropagation();
                        const surnameId = e.target.dataset.surnameId;
                        this.toggleFavorite(surnameId);
                    }
                    
                    if (e.target.id === 'close-modal' || e.target.id === 'detail-modal') {
                        document.getElementById('detail-modal').style.display = 'none';
                    }
                });
            }
        }

        // 初始化应用
        document.addEventListener('DOMContentLoaded', () => {
            // 显示加载器
            const loader = document.getElementById('page-loader');

            // 模拟数据加载时间
            setTimeout(() => {
                new SurnameApp();

                // 隐藏加载器
                setTimeout(() => {
                    loader.classList.add('hidden');

                    // 完全移除加载器
                    setTimeout(() => {
                        loader.remove();
                    }, 500);
                }, 500);
            }, 1000);
        });
    </script>
</body>
</html>
