        // 获取DOM元素
        const generateBtn = document.getElementById('generateBtn');
        const movieDisplay = document.getElementById('movieDisplay');
        const movieTitle = document.getElementById('movieTitle');
        const movieCountry = document.getElementById('movieCountry');
        const movieActors = document.getElementById('movieActors');
        const movieDescription = document.getElementById('movieDescription');
        const movieRating = document.getElementById('movieRating');
        const movieReason = document.getElementById('movieReason');
        const downloadBtn = document.getElementById('downloadBtn');
        const modal = document.getElementById('downloadModal');
        const closeBtn = document.querySelector('.close');

        // 记录当前显示的电影索引
        let currentMovieIndex = -1;

        // 获取随机电影索引，确保不重复
        function getRandomMovieIndex() {
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * disasterMovies.length);
            } while (newIndex === currentMovieIndex && disasterMovies.length > 1);
            currentMovieIndex = newIndex;
            return newIndex;
        }

        // 显示电影信息
        function displayMovie() {
            const index = getRandomMovieIndex();
            const movie = disasterMovies[index];
            
            movieTitle.textContent = movie.title;
            movieCountry.textContent = movie.country;
            movieActors.textContent = movie.actors;
            movieDescription.textContent = movie.description;
            
            // 转换评分为星星 (豆瓣评分7-10分对应3-5星)
            const stars = Math.min(5, Math.max(3, Math.round(movie.rating / 2)));
            movieRating.textContent = '★'.repeat(stars) + '☆'.repeat(5 - stars);
            
            movieReason.textContent = movie.reason;
            
            // 显示电影信息区域
            movieDisplay.style.display = 'block';
            
            // 更新按钮文本
            generateBtn.textContent = '换一部灾难电影';
        }

        // 显示下载弹窗
        downloadBtn.addEventListener('click', function() {
            modal.style.display = 'block';
        });

        // 关闭弹窗
        closeBtn.addEventListener('click', function() {
            modal.style.display = 'none';
        });

        // 点击弹窗外部关闭
        window.addEventListener('click', function(event) {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });

        // 绑定按钮点击事件
        generateBtn.addEventListener('click', displayMovie);
    </script>
