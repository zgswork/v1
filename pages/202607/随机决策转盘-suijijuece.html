<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机决策转盘</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f8f9fc 0%, #e9f2f9 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #2c3e50;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .header {
            text-align: center;
            margin: 20px 0 40px;
            position: relative;
        }
        
        .title {
            font-size: 2.2rem;
            font-weight: 300;
            color: #2c3e50;
            letter-spacing: 1px;
            margin-bottom: 15px;
            position: relative;
            display: inline-block;
        }
        
        .title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #3498db, #2ecc71);
            border-radius: 3px;
        }
        
        .subtitle {
            font-size: 1.1rem;
            color: #7f8c8d;
            font-weight: 300;
        }
        
        .main-content {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            width: 100%;
            margin-bottom: 40px;
        }
        
        .wheel-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin-bottom: 30px;
        }
        
        @media (min-width: 768px) {
            .wheel-container {
                width: 320px;
                height: 320px;
            }
        }
        
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            transition: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1), 0 0 0 10px rgba(255, 255, 255, 0.5);
            transform: rotate(0deg);
        }
        
        .wheel.spinning {
            transition: transform 3s cubic-bezier(0.17, 0.67, 0.83, 0.67);
        }
        
        .wheel-item {
            position: absolute;
            width: 50%;
            height: 50%;
            transform-origin: bottom right;
            left: 0;
            top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
            padding: 10px;
            font-weight: 600;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }
        
        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 50%;
            z-index: 5;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #f8f9fc;
        }
        
        .wheel-center i {
            color: #e74c3c;
            font-size: 18px;
        }
        
        .wheel-pointer {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 50px;
            background: #e74c3c;
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            z-index: 10;
            filter: drop-shadow(0 3px 3px rgba(0,0,0,0.2));
        }
        
        .options-section {
            flex: 1;
            min-width: 300px;
            max-width: 400px;
        }
        
        .options-container {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
        }
        
        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            color: #2c3e50;
            margin-bottom: 20px;
            font-weight: 500;
        }
        
        .section-title i {
            color: #3498db;
        }
        
        .option-input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 15px;
            border: 1px solid #eaeaea;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
            background: #fafafa;
        }
        
        .option-input:focus {
            outline: none;
            border-color: #3498db;
            background: white;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }
        
        .buttons-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }
        
        .button {
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #3498db 0%, #2ecc71 100%);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.25);
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(52, 152, 219, 0.35);
        }
        
        .button:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 4px 10px rgba(189, 195, 199, 0.25);
        }
        
        .button.spin {
            background: linear-gradient(135deg, #e74c3c 0%, #e67e22 100%);
            box-shadow: 0 4px 10px rgba(231, 76, 60, 0.25);
        }
        
        .button.spin:hover {
            box-shadow: 0 6px 15px rgba(231, 76, 60, 0.35);
        }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 25px 0;
            color: #7f8c8d;
            line-height: 1.6;
            font-size: 0.9rem;
            border-top: 1px solid #eee;
            width: 100%;
        }
        
        .footer p {
            margin: 5px 0;
        }
        
        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 100;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(3px);
        }
        
        .modal-content {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            max-width: 90%;
            width: 380px;
            animation: popIn 0.4s ease-out;
            position: relative;
        }
        
        @keyframes popIn {
            0% { transform: scale(0.9) translateY(20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        
        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #7f8c8d;
            cursor: pointer;
            transition: color 0.3s;
        }
        
        .modal-close:hover {
            color: #e74c3c;
        }
        
        .modal-icon {
            font-size: 3rem;
            color: #2ecc71;
            margin-bottom: 15px;
        }
        
        .modal h2 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-weight: 500;
        }
        
        .modal p {
            margin: 15px 0;
            font-size: 1.4rem;
            font-weight: 600;
            color: #e74c3c;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 8px;
        }
        
        .modal-button {
            background: linear-gradient(135deg, #3498db 0%, #2ecc71 100%);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.25);
        }
        
        .modal-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(52, 152, 219, 0.35);
        }
        
        .hidden {
            display: none;
        }
        
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
                align-items: center;
                gap: 30px;
            }
            
            .title {
                font-size: 1.8rem;
            }
            
            .wheel-container {
                width: 260px;
                height: 260px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">随机决策转盘</h1>
            <p class="subtitle">如果你不知道如何做选择，转一转吧</p>
        </div>
        
        <div class="main-content">
            <div class="wheel-section">
                <div class="wheel-container">
                    <div class="wheel" id="wheel"></div>
                    <div class="wheel-center">
                        <i class="fas fa-circle"></i>
                    </div>
                    <div class="wheel-pointer"></div>
                </div>
                
                <div class="buttons-container">
                    <button class="button spin" id="spin">
                        <i class="fas fa-play-circle"></i>开始转动
                    </button>
                </div>
            </div>
            
            <div class="options-section">
                <div class="options-container">
                    <h3 class="section-title">
                        <i class="fas fa-edit"></i>选项设置
                    </h3>
                    <div id="options-container">
                        <input type="text" class="option-input" placeholder="选项 1">
                        <input type="text" class="option-input" placeholder="选项 2">
                        <input type="text" class="option-input" placeholder="选项 3">
                        <input type="text" class="option-input" placeholder="选项 4">
                        <input type="text" class="option-input" placeholder="选项 5">
                    </div>
                </div>
                
                <div class="buttons-container">
                    <button class="button" id="add-option">
                        <i class="fas fa-plus-circle"></i>新加选项
                    </button>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>本工具由木棉制作</p>
            <p>微信 ping3173</p>
            <p>QQ邮箱 <a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="cff8fafdfff8faf8f9f68fbebee1aca0a2">[email&#160;protected]</a></p>
        </div>
    </div>
    
    <!-- 弹窗 -->
    <div class="modal" id="result-modal">
        <div class="modal-content">
            <button class="modal-close" id="modal-close">&times;</button>
            <div class="modal-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h2>恭喜你，选择了</h2>
            <p id="selected-option"></p>
            <button class="modal-button" id="modal-ok">
                <i class="fas fa-check"></i>确定
            </button>
        </div>
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        document.addEventListener('DOMContentLoaded', function() {
            const wheel = document.getElementById('wheel');
            const optionsContainer = document.getElementById('options-container');
            const addOptionBtn = document.getElementById('add-option');
            const spinBtn = document.getElementById('spin');
            const optionInputs = optionsContainer.querySelectorAll('.option-input');
            const modal = document.getElementById('result-modal');
            const selectedOptionElement = document.getElementById('selected-option');
            const modalOk = document.getElementById('modal-ok');
            const modalClose = document.getElementById('modal-close');
            
            let optionCount = 5;
            let isSpinning = false;
            let currentRotation = 0;
            
            // 初始化转盘
            updateWheel();
            
            // 添加选项事件
            addOptionBtn.addEventListener('click', function() {
                if (optionCount >= 10) {
                    alert('最多只能添加10个选项');
                    return;
                }
                
                optionCount++;
                const newInput = document.createElement('input');
                newInput.type = 'text';
                newInput.className = 'option-input';
                newInput.placeholder = `选项 ${optionCount}`;
                optionsContainer.appendChild(newInput);
                
                // 添加输入事件监听
                newInput.addEventListener('input', updateWheel);
                
                if (optionCount === 10) {
                    addOptionBtn.disabled = true;
                }
            });
            
            // 为现有输入框添加事件监听
            optionInputs.forEach(input => {
                input.addEventListener('input', updateWheel);
            });
            
            // 生成柔和的随机颜色
            function generatePastelColor() {
                const hue = Math.floor(Math.random() * 360);
                const saturation = 60 + Math.floor(Math.random() * 20); // 60-80% 饱和度
                const lightness = 70 + Math.floor(Math.random() * 15); // 70-85% 亮度
                return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
            }
            
            // 更新转盘
            function updateWheel() {
                const inputs = optionsContainer.querySelectorAll('.option-input');
                const options = [];
                
                inputs.forEach(input => {
                    if (input.value.trim() !== '') {
                        options.push(input.value.trim());
                    }
                });
                
                // 如果没有有效选项，使用占位文本
                if (options.length === 0) {
                    options.push('选项1', '选项2', '选项3');
                }
                
                // 清空转盘
                wheel.innerHTML = '';
                
                // 创建新的转盘扇区
                const angle = 360 / options.length;
                
                options.forEach((option, index) => {
                    const item = document.createElement('div');
                    item.className = 'wheel-item';
                    item.style.transform = `rotate(${index * angle}deg)`;
                    item.style.backgroundColor = generatePastelColor();
                    
                    const text = document.createElement('span');
                    text.textContent = option;
                    text.style.transform = `rotate(${angle/2}deg)`;
                    
                    item.appendChild(text);
                    wheel.appendChild(item);
                });
                
                // 重置转盘位置
                wheel.classList.remove('spinning');
                wheel.style.transform = 'rotate(0deg)';
                currentRotation = 0;
            }
            
            // 显示结果弹窗
            function showResult(option) {
                selectedOptionElement.textContent = option;
                modal.style.display = 'flex';
            }
            
            // 关闭弹窗
            modalOk.addEventListener('click', function() {
                modal.style.display = 'none';
            });
            
            modalClose.addEventListener('click', function() {
                modal.style.display = 'none';
            });
            
            // 点击蒙层关闭弹窗
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.style.display = 'none';
                }
            });
            
            // 旋转转盘
            spinBtn.addEventListener('click', function() {
                if (isSpinning) return;
                
                const inputs = optionsContainer.querySelectorAll('.option-input');
                const validOptions = Array.from(inputs).filter(input => input.value.trim() !== '');
                
                if (validOptions.length < 2) {
                    alert('请至少输入两个选项');
                    return;
                }
                
                isSpinning = true;
                spinBtn.disabled = true;
                
                // 移除之前的旋转类
                wheel.classList.remove('spinning');
                
                // 强制重绘
                void wheel.offsetWidth;
                
                // 添加旋转类
                wheel.classList.add('spinning');
                
                // 固定旋转速度和圈数
                const rotations = 8; // 固定8圈
                const randomAngle = Math.floor(Math.random() * 360);
                const totalRotation = currentRotation + rotations * 360 + randomAngle;
                
                // 应用旋转
                wheel.style.transform = `rotate(${totalRotation}deg)`;
                currentRotation = totalRotation % 360;
                
                // 旋转结束后启用按钮
                setTimeout(function() {
                    isSpinning = false;
                    spinBtn.disabled = false;
                    
                    // 计算选中的选项
                    const optionsCount = wheel.children.length;
                    const selectedAngle = totalRotation % 360;
                    const sectorAngle = 360 / optionsCount;
                    const selectedIndex = Math.floor(optionsCount - selectedAngle / sectorAngle) % optionsCount;
                    
                    // 显示结果弹窗
                    showResult(wheel.children[selectedIndex].textContent);
                }, 3000); // 固定3秒后停止
            });
        });
    </script>
</body>
</html>
