<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高级图片压缩工具</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .container {
            max-width: 1200px;
            margin: 30px auto;
            background-color: rgba(255, 255, 255, 0.97);
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(90deg, #1a2980, #26d0ce);
            color: white;
            padding: 35px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        header::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 70%);
            transform: rotate(30deg);
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            position: relative;
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 10px auto 0;
            position: relative;
        }
        
        .main-content {
            display: flex;
            flex-wrap: wrap;
            padding: 30px;
        }
        
        .upload-section {
            flex: 1;
            min-width: 300px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 15px;
            margin: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            position: relative;
        }
        
        .settings-section {
            flex: 1;
            min-width: 300px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 15px;
            margin: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            position: relative;
        }
        
        .section-title {
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: #1a2980;
            display: flex;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e6ff;
        }
        
        .section-title i {
            margin-right: 12px;
            font-size: 1.8rem;
            color: #1a2980;
        }
        
        .upload-area {
            border: 3px dashed #26d0ce;
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #f0f9ff;
            margin-bottom: 25px;
            position: relative;
        }
        
        .upload-area:hover {
            background-color: #e1f5ff;
            transform: translateY(-5px);
            border-color: #1a2980;
            box-shadow: 0 10px 25px rgba(26, 41, 128, 0.15);
        }
        
        .upload-area i {
            font-size: 4.5rem;
            color: #26d0ce;
            margin-bottom: 25px;
            transition: all 0.3s;
        }
        
        .upload-area:hover i {
            color: #1a2980;
            transform: scale(1.1);
        }
        
        .upload-area p {
            font-size: 1.25rem;
            margin-bottom: 15px;
            color: #444;
            font-weight: 500;
        }
        
        .upload-area .hint {
            font-size: 0.95rem;
            color: #666;
            margin-top: 10px;
        }
        
        .file-input {
            display: none;
        }
        
        .preview-container {
            margin-top: 20px;
            max-height: 350px;
            overflow-y: auto;
            padding: 15px;
            border: 1px solid #e0e6ff;
            border-radius: 12px;
            background: white;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }
        
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .preview-title {
            font-size: 1.2rem;
            color: #1a2980;
            font-weight: 600;
        }
        
        .add-more-btn {
            background: #26d0ce;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 8px 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .add-more-btn:hover {
            background: #1a2980;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(26, 41, 128, 0.3);
        }
        
        .preview-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
            transition: all 0.3s;
            border-radius: 8px;
        }
        
        .preview-item:hover {
            background-color: #f8fbff;
            transform: translateX(5px);
        }
        
        .preview-item img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 10px;
            margin-right: 15px;
            cursor: pointer;
            border: 2px solid #e0e6ff;
            transition: all 0.3s;
        }
        
        .preview-item img:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .preview-info {
            flex: 1;
        }
        
        .preview-name {
            font-weight: 600;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
            color: #333;
        }
        
        .preview-size {
            font-size: 0.9rem;
            color: #666;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .delete-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .delete-btn:hover {
            background: #ff4757;
            transform: rotate(90deg) scale(1.1);
        }
        
        .setting-group {
            margin-bottom: 30px;
        }
        
        .setting-label {
            display: block;
            margin-bottom: 12px;
            font-weight: 600;
            color: #444;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .setting-label i {
            color: #1a2980;
        }
        
        .size-input-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .size-input {
            flex: 1;
            padding: 15px;
            border: 2px solid #d7dcf0;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #1a2980;
            transition: all 0.3s;
        }
        
        .size-input:focus {
            border-color: #26d0ce;
            box-shadow: 0 0 0 3px rgba(38, 208, 206, 0.2);
            outline: none;
        }
        
        .size-unit {
            font-weight: 600;
            color: #1a2980;
            min-width: 60px;
        }
        
        .tolerance-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
        
        .tolerance-input {
            width: 80px;
            padding: 10px;
            border: 2px solid #d7dcf0;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            color: #1a2980;
        }
        
        .btn {
            display: inline-block;
            padding: 16px 40px;
            background: linear-gradient(90deg, #1a2980 0%, #26d0ce 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s;
            text-align: center;
            width: 100%;
            box-shadow: 0 8px 25px rgba(26, 41, 128, 0.4);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
        }
        
        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(26, 41, 128, 0.6);
            letter-spacing: 1px;
        }
        
        .btn:active {
            transform: translateY(2px);
        }
        
        .btn:disabled {
            background: linear-gradient(90deg, #cccccc 0%, #999999 100%);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            letter-spacing: 0.5px;
        }
        
        .btn i {
            margin-right: 10px;
            transition: all 0.3s;
        }
        
        .btn:hover i {
            transform: rotate(-20deg);
        }
        
        .results-section {
            flex: 100%;
            margin: 15px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .results-title {
            font-size: 1.5rem;
            color: #1a2980;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .clear-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 10px 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .clear-btn:hover {
            background: #ff4757;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }
        
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }
        
        .result-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transition: all 0.4s;
            position: relative;
        }
        
        .result-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }
        
        .result-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .result-image:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
        
        .result-info {
            padding: 20px;
        }
        
        .result-title {
            font-weight: 700;
            margin-bottom: 18px;
            font-size: 1.15rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #1a2980;
        }
        
        .result-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        
        .stat {
            text-align: center;
            flex: 1;
        }
        
        .stat-value {
            font-weight: 800;
            font-size: 1.3rem;
            color: #26d0ce;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #777;
            margin-top: 5px;
        }
        
        .accuracy-badge {
            background: linear-gradient(90deg, #1a2980, #26d0ce);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
            text-align: center;
            margin: 10px 0;
        }
        
        .progress {
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
            margin: 20px 0;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #1a2980 0%, #26d0ce 100%);
            border-radius: 5px;
            transition: width 0.5s ease;
        }
        
        .result-actions {
            display: flex;
            gap: 12px;
        }
        
        .download-btn {
            flex: 1;
            padding: 12px;
            background: #1a2980;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .download-btn:hover {
            background: #26d0ce;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(26, 41, 128, 0.3);
        }
        
        .status-message {
            text-align: center;
            padding: 40px 20px;
            font-size: 1.2rem;
            color: #666;
        }
        
        .status-message i {
            font-size: 3rem;
            color: #1a2980;
            margin-bottom: 20px;
            display: block;
        }
        
        /* 模态框样式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            padding-top: 60px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
        }
        
        .modal-content {
            margin: auto;
            display: block;
            width: 80%;
            max-width: 1200px;
            max-height: 80vh;
            object-fit: contain;
        }
        
        .close {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #f1f1f1;
            font-size: 50px;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
        }
        
        .close:hover {
            color: #26d0ce;
            transform: rotate(90deg);
        }
        
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
                padding: 20px;
            }
            
            .upload-section, .settings-section {
                margin: 10px 0;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .results-grid {
                grid-template-columns: 1fr;
            }
        }
        
        /* 动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.6s ease forwards;
        }
        
        .pulse {
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(38, 208, 206, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(38, 208, 206, 0); }
            100% { box-shadow: 0 0 0 0 rgba(38, 208, 206, 0); }
        }
        
        .accuracy-display {
            text-align: center;
            font-size: 1.1rem;
            margin-top: 10px;
            font-weight: 600;
            color: #1a2980;
        }
        
        .batch-download {
            margin-top: 30px;
            text-align: center;
        }
        
        .batch-download-btn {
            padding: 15px 40px;
            background: linear-gradient(90deg, #1a2980, #26d0ce);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 20px rgba(26, 41, 128, 0.4);
        }
        
        .batch-download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(26, 41, 128, 0.6);
        }
        
        .batch-download-btn:disabled {
            background: linear-gradient(90deg, #cccccc, #999999);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-compress-alt"></i> 高级图片压缩工具</h1>
            <p class="subtitle">批量压缩图片到指定大小，支持批量下载</p>
        </header>
        
        <div class="main-content">
            <!-- 上传区域 -->
            <div class="upload-section fade-in">
                <h2 class="section-title"><i class="fas fa-cloud-upload-alt"></i> 上传图片</h2>
                
                <div class="upload-area" id="uploadArea">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>点击或拖拽图片到此处上传</p>
                    <p class="hint">支持 JPG, PNG, GIF, WebP 格式 (最大 10MB)</p>
                    <input type="file" id="fileInput" class="file-input" accept="image/*" multiple>
                </div>
                
                <div class="preview-container" id="previewContainer">
                    <div class="preview-header">
                        <div class="preview-title">已上传图片</div>
                        <button class="add-more-btn" id="addMoreBtn">
                            <i class="fas fa-plus"></i> 添加更多
                        </button>
                    </div>
                    <div class="empty-state" id="emptyPreview">
                        <p>暂无上传图片</p>
                    </div>
                </div>
            </div>
            
            <!-- 设置区域 -->
            <div class="settings-section fade-in">
                <h2 class="section-title"><i class="fas fa-sliders-h"></i> 压缩设置</h2>
                
                <div class="setting-group">
                    <label class="setting-label">
                        <i class="fas fa-bullseye"></i> 目标文件大小 (KB)
                    </label>
                    <div class="size-input-container">
                        <input type="number" min="10" max="5000" value="300" class="size-input" id="sizeInput">
                        <span class="size-unit">KB</span>
                    </div>
                    
                    <div class="tolerance-container">
                        <label>容差范围:</label>
                        <input type="number" min="1" max="100" value="5" class="tolerance-input" id="toleranceInput">
                        <span>%</span>
                    </div>
                    
                    <div class="accuracy-display">
                        <i class="fas fa-check-circle"></i> 智能算法确保误差在 ±<span id="toleranceValue">5</span>% 以内
                    </div>
                </div>
                
                <div class="setting-group">
                    <label class="setting-label">
                        <i class="fas fa-file-export"></i> 输出格式
                    </label>
                    <div style="display: flex; gap: 15px; margin-top: 10px;">
                        <label style="display: flex; align-items: center; gap: 8px;">
                            <input type="radio" name="format" value="jpeg" checked> 
                            <i class="fas fa-file-image" style="color: #1a2980;"></i> JPEG
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px;">
                            <input type="radio" name="format" value="png"> 
                            <i class="fas fa-file-image" style="color: #1a2980;"></i> PNG
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px;">
                            <input type="radio" name="format" value="webp"> 
                            <i class="fas fa-file-image" style="color: #1a2980;"></i> WebP
                        </label>
                    </div>
                </div>
                
                <button class="btn pulse" id="compressBtn" disabled>
                    <i class="fas fa-bolt"></i> 开始压缩图片
                </button>
            </div>
            
            <!-- 结果区域 -->
            <div class="results-section">
                <div class="results-header">
                    <div class="results-title">
                        <i class="fas fa-download"></i> 压缩结果
                    </div>
                    <button class="clear-btn" id="clearResultsBtn">
                        <i class="fas fa-trash-alt"></i> 清除结果
                    </button>
                </div>
                
                <div class="results-grid" id="resultsGrid">
                    <div class="status-message">
                        <i class="fas fa-file-download"></i>
                        <p>压缩后的图片将显示在这里</p>
                    </div>
                </div>
                
                <div class="batch-download">
                    <button class="batch-download-btn" id="batchDownloadBtn" disabled>
                        <i class="fas fa-file-archive"></i> 批量下载所有压缩图片
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 图片查看模态框 -->
    <div id="imageModal" class="modal">
        <span class="close">&times;</span>
        <img class="modal-content" id="modalImage">
    </div>

    <script>
        // 获取DOM元素
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const addMoreBtn = document.getElementById('addMoreBtn');
        const previewContainer = document.getElementById('previewContainer');
        const emptyPreview = document.getElementById('emptyPreview');
        const sizeInput = document.getElementById('sizeInput');
        const toleranceInput = document.getElementById('toleranceInput');
        const toleranceValue = document.getElementById('toleranceValue');
        const compressBtn = document.getElementById('compressBtn');
        const clearResultsBtn = document.getElementById('clearResultsBtn');
        const batchDownloadBtn = document.getElementById('batchDownloadBtn');
        const resultsGrid = document.getElementById('resultsGrid');
        const imageModal = document.getElementById('imageModal');
        const modalImage = document.getElementById('modalImage');
        const closeModal = document.querySelector('.close');
        
        // 存储上传的图片文件和压缩结果
        let uploadedFiles = [];
        let compressedFiles = [];
        
        // 初始化事件监听
        function init() {
            // 上传区域点击事件
            uploadArea.addEventListener('click', () => fileInput.click());
            addMoreBtn.addEventListener('click', () => fileInput.click());
            
            // 拖放功能
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.style.backgroundColor = '#e1f5ff';
                uploadArea.style.borderColor = '#1a2980';
            });
            
            uploadArea.addEventListener('dragleave', () => {
                uploadArea.style.backgroundColor = '#f0f9ff';
                uploadArea.style.borderColor = '#26d0ce';
            });
            
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.style.backgroundColor = '#f0f9ff';
                uploadArea.style.borderColor = '#26d0ce';
                handleFiles(e.dataTransfer.files);
            });
            
            // 文件选择事件
            fileInput.addEventListener('change', (e) => {
                handleFiles(e.target.files);
                fileInput.value = ''; // 重置input，允许选择相同文件
            });
            
            // 容差输入
            toleranceInput.addEventListener('input', () => {
                let value = parseInt(toleranceInput.value);
                if (value < 1) value = 1;
                if (value > 100) value = 100;
                toleranceInput.value = value;
                toleranceValue.textContent = value;
            });
            
            // 压缩按钮
            compressBtn.addEventListener('click', compressImages);
            
            // 清除结果按钮
            clearResultsBtn.addEventListener('click', () => {
                resultsGrid.innerHTML = `
                    <div class="status-message">
                        <i class="fas fa-file-download"></i>
                        <p>压缩后的图片将显示在这里</p>
                    </div>
                `;
                compressedFiles = [];
                batchDownloadBtn.disabled = true;
            });
            
            // 批量下载按钮
            batchDownloadBtn.addEventListener('click', downloadAllCompressed);
            
            // 模态框关闭
            closeModal.addEventListener('click', () => {
                imageModal.style.display = "none";
            });
            
            // 点击模态框背景关闭
            window.addEventListener('click', (e) => {
                if (e.target === imageModal) {
                    imageModal.style.display = "none";
                }
            });
        }
        
        // 处理上传的文件
        function handleFiles(files) {
            if (!files.length) return;
            
            // 过滤非图片文件
            const imageFiles = Array.from(files).filter(file => 
                file.type.startsWith('image/') && file.size <= 10 * 1024 * 1024
            );
            
            if (imageFiles.length === 0) {
                alert('请上传有效的图片文件（JPG, PNG, GIF, WebP），且大小不超过10MB');
                return;
            }
            
            // 添加到上传列表
            uploadedFiles = [...uploadedFiles, ...imageFiles];
            
            // 更新预览
            updatePreview();
            
            // 启用压缩按钮
            compressBtn.disabled = false;
            compressBtn.classList.add('pulse');
        }
        
        // 更新图片预览
        function updatePreview() {
            if (uploadedFiles.length === 0) {
                emptyPreview.style.display = 'block';
                return;
            }
            
            emptyPreview.style.display = 'none';
            
            // 只保留预览容器中的header和添加按钮
            previewContainer.innerHTML = `
                <div class="preview-header">
                    <div class="preview-title">已上传图片 (${uploadedFiles.length})</div>
                    <button class="add-more-btn" id="addMoreBtn">
                        <i class="fas fa-plus"></i> 添加更多
                    </button>
                </div>
            `;
            
            // 重新添加添加更多按钮事件
            document.getElementById('addMoreBtn').addEventListener('click', () => fileInput.click());
            
            uploadedFiles.forEach((file, index) => {
                const reader = new FileReader();
                
                reader.onload = (e) => {
                    const previewItem = document.createElement('div');
                    previewItem.className = 'preview-item';
                    
                    // 文件信息
                    const fileSize = (file.size / 1024).toFixed(1);
                    
                    previewItem.innerHTML = `
                        <img src="${e.target.result}" alt="${file.name}" data-index="${index}">
                        <div class="preview-info">
                            <div class="preview-name">${file.name}</div>
                            <div class="preview-size">
                                <i class="fas fa-weight-hanging"></i> ${fileSize} KB
                            </div>
                        </div>
                        <button class="delete-btn" data-index="${index}">
                            <i class="fas fa-times"></i>
                        </button>
                    `;
                    
                    previewContainer.appendChild(previewItem);
                    
                    // 添加删除按钮事件
                    const deleteBtn = previewItem.querySelector('.delete-btn');
                    deleteBtn.addEventListener('click', (event) => {
                        event.stopPropagation();
                        const index = parseInt(deleteBtn.getAttribute('data-index'));
                        uploadedFiles.splice(index, 1);
                        updatePreview();
                        if (uploadedFiles.length === 0) {
                            compressBtn.disabled = true;
                            compressBtn.classList.remove('pulse');
                        }
                    });
                    
                    // 添加图片点击事件（预览大图）
                    const img = previewItem.querySelector('img');
                    img.addEventListener('click', () => {
                        modalImage.src = e.target.result;
                        imageModal.style.display = "block";
                    });
                };
                
                reader.readAsDataURL(file);
            });
        }
        
        // 压缩图片主函数
        async function compressImages() {
            if (uploadedFiles.length === 0) return;
            
            // 更新按钮状态
            compressBtn.disabled = true;
            compressBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 压缩中...';
            batchDownloadBtn.disabled = true;
            
            // 清空结果区域
            resultsGrid.innerHTML = `
                <div class="status-message">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>正在精确压缩图片，请稍候...</p>
                    <p class="hint">使用智能算法确保图片大小精确匹配目标</p>
                </div>
            `;
            
            // 获取设置值
            const targetSize = parseInt(sizeInput.value) * 1024; // 转换为字节
            const tolerance = parseInt(toleranceInput.value) / 100; // 容差百分比
            const format = document.querySelector('input[name="format"]:checked').value;
            
            // 清空之前的压缩结果
            compressedFiles = [];
            
            // 压缩所有图片
            for (let i = 0; i < uploadedFiles.length; i++) {
                const file = uploadedFiles[i];
                try {
                    const compressedFile = await compressImage(file, targetSize, tolerance, format);
                    compressedFiles.push({
                        file: compressedFile,
                        original: file
                    });
                    displayResult(file, compressedFile, targetSize);
                } catch (error) {
                    console.error('压缩失败:', error);
                    displayError(file, error.message);
                }
            }
            
            // 恢复按钮状态
            compressBtn.disabled = false;
            compressBtn.innerHTML = '<i class="fas fa-bolt"></i> 开始压缩图片';
            
            // 如果有压缩结果，启用批量下载按钮
            if (compressedFiles.length > 0) {
                batchDownloadBtn.disabled = false;
            }
        }
        
        // 压缩单张图片（使用二分搜索算法精确匹配大小）
        function compressImage(file, targetSize, tolerance, format) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const reader = new FileReader();
                
                reader.onload = (e) => {
                    img.src = e.target.result;
                };
                
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // 设置canvas尺寸
                    canvas.width = img.width;
                    canvas.height = img.height;
                    
                    // 清除画布
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    // 绘制图片到canvas
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    // 二分搜索算法参数
                    let low = 0.1;
                    let high = 1.0;
                    let bestBlob = null;
                    let bestDiff = Infinity;
                    const maxIterations = 15;
                    let iteration = 0;
                    
                    // 容差范围
                    const minSize = targetSize * (1 - tolerance);
                    const maxSize = targetSize * (1 + tolerance);
                    
                    const tryCompress = () => {
                        if (iteration >= maxIterations) {
                            resolve(new File([bestBlob], 
                                `compressed_${file.name.replace(/\.[^/.]+$/, "")}.${format}`, 
                                { type: `image/${format}` }
                            ));
                            return;
                        }
                        
                        const quality = (low + high) / 2;
                        
                        canvas.toBlob((blob) => {
                            if (!blob) {
                                reject(new Error('压缩失败，无法生成Blob'));
                                return;
                            }
                            
                            const size = blob.size;
                            const diff = Math.abs(size - targetSize);
                            
                            // 检查是否在容差范围内
                            if (size >= minSize && size <= maxSize) {
                                resolve(new File([blob], 
                                    `compressed_${file.name.replace(/\.[^/.]+$/, "")}.${format}`, 
                                    { type: `image/${format}` }
                                ));
                                return;
                            }
                            
                            // 更新最佳匹配
                            if (diff < bestDiff) {
                                bestDiff = diff;
                                bestBlob = blob;
                            }
                            
                            // 调整质量范围
                            if (size > targetSize) {
                                high = quality; // 文件太大，降低质量
                            } else {
                                low = quality; // 文件太小，提高质量
                            }
                            
                            iteration++;
                            setTimeout(tryCompress, 50);
                        }, `image/${format}`, quality);
                    };
                    
                    // 开始压缩
                    tryCompress();
                };
                
                img.onerror = (error) => {
                    reject(new Error('图片加载失败'));
                };
                
                reader.readAsDataURL(file);
            });
        }
        
        // 显示压缩结果
        function displayResult(originalFile, compressedFile, targetSize) {
            // 移除加载状态
            if (resultsGrid.querySelector('.status-message')) {
                resultsGrid.innerHTML = '';
            }
            
            // 创建结果卡片
            const resultCard = document.createElement('div');
            resultCard.className = 'result-card fade-in';
            
            // 计算压缩比例
            const originalSize = (originalFile.size / 1024).toFixed(1);
            const compressedSize = (compressedFile.size / 1024).toFixed(1);
            const reduction = ((1 - compressedFile.size / originalFile.size) * 100).toFixed(1);
            
            // 计算精度
            const accuracy = ((1 - Math.abs(compressedFile.size - targetSize) / targetSize) * 100).toFixed(1);
            
            // 创建对象URL用于预览
            const objectUrl = URL.createObjectURL(compressedFile);
            
            resultCard.innerHTML = `
                <img src="${objectUrl}" alt="压缩结果" class="result-image">
                <div class="result-info">
                    <div class="result-title">${compressedFile.name}</div>
                    
                    <div class="result-stats">
                        <div class="stat">
                            <div class="stat-value">${originalSize}</div>
                            <div class="stat-label">原始大小 (KB)</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${compressedSize}</div>
                            <div class="stat-label">压缩后 (KB)</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${reduction}%</div>
                            <div class="stat-label">体积减少</div>
                        </div>
                    </div>
                    
                    <div class="accuracy-badge">目标精度: ${accuracy}%</div>
                    
                    <div class="progress">
                        <div class="progress-bar" style="width: ${accuracy}%"></div>
                    </div>
                    
                    <div class="result-actions">
                        <button class="download-btn" data-file="${objectUrl}" data-name="${compressedFile.name}">
                            <i class="fas fa-download"></i> 下载
                        </button>
                    </div>
                </div>
            `;
            
            resultsGrid.appendChild(resultCard);
            
            // 添加下载事件
            const downloadBtn = resultCard.querySelector('.download-btn');
            downloadBtn.addEventListener('click', (e) => {
                const url = downloadBtn.getAttribute('data-file');
                const name = downloadBtn.getAttribute('data-name');
                
                const a = document.createElement('a');
                a.href = url;
                a.download = name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            });
            
            // 添加图片点击事件（预览大图）
            const resultImage = resultCard.querySelector('.result-image');
            resultImage.addEventListener('click', () => {
                modalImage.src = objectUrl;
                imageModal.style.display = "block";
            });
        }
        
        // 显示错误信息
        function displayError(file, message) {
            const errorCard = document.createElement('div');
            errorCard.className = 'result-card';
            errorCard.innerHTML = `
                <div class="result-info" style="text-align: center; padding: 40px 20px;">
                    <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: #ff6b6b; margin-bottom: 20px;"></i>
                    <div class="result-title">${file.name} 压缩失败</div>
                    <p style="color: #ff6b6b;">${message}</p>
                </div>
            `;
            resultsGrid.appendChild(errorCard);
        }
        
        // 批量下载所有压缩图片
        function downloadAllCompressed() {
            if (compressedFiles.length === 0) return;
            
            // 创建ZIP文件
            const zip = new JSZip();
            const folder = zip.folder("compressed_images");
            
            // 添加所有压缩图片到ZIP
            compressedFiles.forEach(item => {
                folder.file(item.file.name, item.file);
            });
            
            // 生成ZIP文件并下载
            zip.generateAsync({type:"blob"}).then(content => {
                saveAs(content, "compressed_images.zip");
            });
        }
        
        // 页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
