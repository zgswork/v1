            const movieDisplay = document.getElementById('movieDisplay');
            const downloadBtn = document.getElementById('downloadBtn');

            const closeBtn = document.querySelector('.close');
            
            let currentMovieIndex = -1;
            let previousIndexes = [];
            
            function getRandomMovie() {
                if (previousIndexes.length === movies.length) {
                    previousIndexes = [];
                }
                
                let randomIndex;
                do {
                    randomIndex = Math.floor(Math.random() * movies.length);
                } while (previousIndexes.includes(randomIndex));
                
                previousIndexes.push(randomIndex);
                currentMovieIndex = randomIndex;
                return movies[randomIndex];
            }
            
            function displayMovie(movie) {
                const stars = '★'.repeat(Math.round(movie.rating / 2));
                
                movieDisplay.innerHTML = `
                    <h2 class="movie-title">${movie.title}</h2>
                    <div class="movie-info">
                        <span>国家:</span> ${movie.country}
                    </div>
                    <div class="movie-info">
                        <span>主演:</span> ${movie.actors}
                    </div>
                    <p class="movie-description">${movie.description}</p>
                    <div class="rating">
                        <span class="rating-label">推荐指数:</span>
                        <span class="stars">${stars}</span>
                        <span>(${movie.rating.toFixed(1)}/10)</span>
                    </div>
                    <p class="recommend-reason"><span>推荐理由:</span> ${movie.reason}</p>
                `;
            }
            
            recommendBtn.addEventListener('click', function() {
                const movie = getRandomMovie();
                displayMovie(movie);
                recommendBtn.style.display = 'none';
                changeBtn.style.display = 'block';
            });
            
            changeBtn.addEventListener('click', function() {
                const movie = getRandomMovie();
                displayMovie(movie);
            });
            
            downloadBtn.addEventListener('click', function() {
                downloadModal.style.display = 'block';
            });
            
            closeBtn.addEventListener('click', function() {
                downloadModal.style.display = 'none';
            });
            
            window.addEventListener('click', function(event) {
                if (event.target === downloadModal) {
                    downloadModal.style.display = 'none';
                }
            });
