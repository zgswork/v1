
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时薪计算器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen p-4">
    <div class="max-w-2xl mx-auto">
        <!-- 标题 -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">⏰ 时薪计算器</h1>
            <p class="text-gray-600">准确计算你的小时工资，合理规划时间价值</p>
        </div>

        <!-- 主要计算区域 -->
        <div class="bg-white rounded-xl shadow-lg p-8 mb-6">
            <h2 class="text-2xl font-semibold text-gray-800 mb-6">基础信息</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <!-- 月薪输入 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">月薪 (元)</label>
                    <input type="number" id="monthlySalary" placeholder="请输入月薪" 
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                </div>

                <!-- 每月工作天数 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">每月工作天数</label>
                    <input type="number" id="workDays" value="22" placeholder="22"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                </div>

                <!-- 每日工作小时数 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">每日工作小时数</label>
                    <input type="number" id="workHours" value="8" step="0.5" placeholder="8"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                </div>

                <!-- 加班费倍率 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">加班费倍率</label>
                    <select id="overtimeRate" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                        <option value="1">不计算加班费</option>
                        <option value="1.5">1.5倍 (工作日加班)</option>
                        <option value="2">2倍 (周末加班)</option>
                        <option value="3">3倍 (法定节假日)</option>
                    </select>
                </div>
            </div>

            <!-- 计算按钮 -->
            <button onclick="calculateHourlyWage()" 
                    class="w-full bg-primary text-white py-3 px-6 rounded-lg font-semibold hover:bg-blue-600 transition duration-300 shadow-md">
                💰 计算时薪
            </button>
        </div>

        <!-- 结果显示区域 -->
        <div id="results" class="bg-white rounded-xl shadow-lg p-8 mb-6 hidden">
            <h2 class="text-2xl font-semibold text-gray-800 mb-6">计算结果</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- 基础时薪 -->
                <div class="bg-gradient-to-r from-blue-500 to-blue-600 text-white p-6 rounded-lg">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-blue-100 text-sm">基础时薪</p>
                            <p id="baseHourlyWage" class="text-3xl font-bold">--</p>
                        </div>
                        <div class="text-4xl">⏰</div>
                    </div>
                </div>

                <!-- 加班时薪 -->
                <div class="bg-gradient-to-r from-green-500 to-green-600 text-white p-6 rounded-lg">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-green-100 text-sm">加班时薪</p>
                            <p id="overtimeHourlyWage" class="text-3xl font-bold">--</p>
                        </div>
                        <div class="text-4xl">💪</div>
                    </div>
                </div>

                <!-- 日薪 -->
                <div class="bg-gradient-to-r from-purple-500 to-purple-600 text-white p-6 rounded-lg">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-purple-100 text-sm">日薪</p>
                            <p id="dailyWage" class="text-3xl font-bold">--</p>
                        </div>
                        <div class="text-4xl">📅</div>
                    </div>
                </div>

                <!-- 年薪 -->
                <div class="bg-gradient-to-r from-orange-500 to-orange-600 text-white p-6 rounded-lg">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-orange-100 text-sm">年薪</p>
                            <p id="annualSalary" class="text-3xl font-bold">--</p>
                        </div>
                        <div class="text-4xl">📊</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 快速场景计算 -->
        <div class="bg-white rounded-xl shadow-lg p-8 mb-6">
            <h2 class="text-2xl font-semibold text-gray-800 mb-6">快速场景计算</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <button onclick="calculateScenario(1)" 
                        class="bg-blue-50 hover:bg-blue-100 border border-blue-200 rounded-lg p-4 text-center transition duration-300">
                    <div class="text-2xl mb-2">⏰</div>
                    <div class="font-medium text-gray-800">1小时价值</div>
                    <div id="scenario1" class="text-blue-600 font-bold">--</div>
                </button>
                
                <button onclick="calculateScenario(4)" 
                        class="bg-green-50 hover:bg-green-100 border border-green-200 rounded-lg p-4 text-center transition duration-300">
                    <div class="text-2xl mb-2">🌅</div>
                    <div class="font-medium text-gray-800">半天价值</div>
                    <div id="scenario4" class="text-green-600 font-bold">--</div>
                </button>
                
                <button onclick="calculateScenario(2)" 
                        class="bg-purple-50 hover:bg-purple-100 border border-purple-200 rounded-lg p-4 text-center transition duration-300">
                    <div class="text-2xl mb-2">🌙</div>
                    <div class="font-medium text-gray-800">2小时加班</div>
                    <div id="scenario2" class="text-purple-600 font-bold">--</div>
                </button>
            </div>
        </div>

        <!-- 实用提示 -->
        <div class="bg-gradient-to-r from-yellow-50 to-orange-50 border-l-4 border-yellow-400 p-6 rounded-r-lg">
            <h3 class="text-lg font-semibold text-gray-800 mb-3">💡 实用提示</h3>
            <ul class="text-gray-700 space-y-2">
                <li class="flex items-start">
                    <span class="text-yellow-500 mr-2">•</span>
                    <span>知道时薪后，可以更好地评估工作机会和副业价值</span>
                </li>
                <li class="flex items-start">
                    <span class="text-yellow-500 mr-2">•</span>
                    <span>合理安排时间，提升时间利用效率</span>
                </li>
                <li class="flex items-start">
                    <span class="text-yellow-500 mr-2">•</span>
                    <span>加班时薪可以帮你决定是否值得加班</span>
                </li>
                <li class="flex items-start">
                    <span class="text-yellow-500 mr-2">•</span>
                    <span>建议定期重新计算，跟踪收入变化</span>
                </li>
            </ul>
        </div>
    </div>

    <script>
        function calculateHourlyWage() {
            const monthlySalary = parseFloat(document.getElementById('monthlySalary').value);
            const workDays = parseFloat(document.getElementById('workDays').value);
            const workHours = parseFloat(document.getElementById('workHours').value);
            const overtimeRate = parseFloat(document.getElementById('overtimeRate').value);

            if (!monthlySalary || !workDays || !workHours) {
                alert('请填写完整的基础信息！');
                return;
            }

            // 计算基础时薪
            const totalHours = workDays * workHours;
            const baseHourlyWage = monthlySalary / totalHours;
            const overtimeHourlyWage = baseHourlyWage * overtimeRate;
            const dailyWage = baseHourlyWage * workHours;
            const annualSalary = monthlySalary * 12;

            // 显示结果
            document.getElementById('baseHourlyWage').textContent = baseHourlyWage.toFixed(2) + ' 元/小时';
            document.getElementById('overtimeHourlyWage').textContent = overtimeHourlyWage.toFixed(2) + ' 元/小时';
            document.getElementById('dailyWage').textContent = dailyWage.toFixed(2) + ' 元/天';
            document.getElementById('annualSalary').textContent = annualSalary.toLocaleString() + ' 元/年';

            // 显示结果区域
            document.getElementById('results').classList.remove('hidden');

            // 更新场景计算
            updateScenarios(baseHourlyWage, overtimeHourlyWage);
        }

        function updateScenarios(baseRate, overtimeRate) {
            document.getElementById('scenario1').textContent = baseRate.toFixed(2) + ' 元';
            document.getElementById('scenario4').textContent = (baseRate * 4).toFixed(2) + ' 元';
            document.getElementById('scenario2').textContent = (overtimeRate * 2).toFixed(2) + ' 元';
        }

        function calculateScenario(hours) {
            const baseRate = parseFloat(document.getElementById('baseHourlyWage').textContent);
            if (!baseRate) {
                alert('请先计算基础时薪！');
                return;
            }
        }

        // 添加实时计算功能
        document.addEventListener('DOMContentLoaded', function() {
            const inputs = ['monthlySalary', 'workDays', 'workHours', 'overtimeRate'];
            inputs.forEach(id => {
                document.getElementById(id).addEventListener('input', function() {
                    const monthlySalary = document.getElementById('monthlySalary').value;
                    if (monthlySalary) {
                        calculateHourlyWage();
                    }
                });
            });
        });
    </script>
<script>window.parent.postMessage({ action: "ready" }, "*"); 
 
window.console = new Proxy(console, {
  get(target, prop) {
    if (['log', 'warn', 'error'].includes(prop)) {
      return new Proxy(target[prop], {
        apply(fn, thisArg, args) {
          fn.apply(thisArg, args);
          window.parent.postMessage({ action: 'console', 
            type: prop, 
            args: args.map((arg) => {
              try {
                return JSON.stringify(arg).replace(/^["']|["']$/g, '');
              } catch (e) {
                return arg;
              }
            }) 
          }, '*');
        }
      });
    }
    return target[prop];
  }
});
</script></body>
</html>
