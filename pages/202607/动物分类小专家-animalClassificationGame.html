<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动物分类小专家</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            color: #333;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .game-container {
            width: 100%;
            max-width: 1200px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            padding: 20px;
            background: linear-gradient(to right, #3498db, #2ecc71);
            border-radius: 15px;
            color: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .header h1 {
            font-size: 3.2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        
        .header h1 i {
            font-size: 2.8rem;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        
        .header p {
            font-size: 1.4rem;
            max-width: 800px;
            margin: 0 auto;
            opacity: 0.9;
        }
        
        .badge-progress {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        
        .badge {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #ecf0f1;
            border: 4px solid #bdc3c7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            transition: all 0.4s ease;
            box-shadow: 0 5px 10px rgba(0,0,0,0.1);
        }
        
        .badge.earned {
            background: #f1c40f;
            border: 4px solid #f39c12;
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(243, 156, 18, 0.5);
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(241, 196, 15, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(241, 196, 15, 0); }
            100% { box-shadow: 0 0 0 0 rgba(241, 196, 15, 0); }
        }
        
        .game-area {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }
        
        .animal-pool-container {
            flex: 1;
            min-width: 300px;
            background: rgba(236, 240, 241, 0.7);
            border-radius: 20px;
            padding: 25px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.1);
            border: 3px dashed #3498db;
        }
        
        .animal-pool-container h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .animal-pool {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 25px;
            padding: 15px;
        }
        
        .animal-card {
            background: white;
            border-radius: 15px;
            padding: 20px 15px;
            text-align: center;
            cursor: grab;
            transition: all 0.3s ease;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            border: 3px solid transparent;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .animal-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.2);
            border-color: #3498db;
        }
        
        .animal-card.dragging {
            opacity: 0.8;
            transform: scale(0.92);
            animation: dragPulse 1.5s infinite;
        }
        
        @keyframes dragPulse {
            0% { box-shadow: 0 0 0 0 rgba(52, 152, 219, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(52, 152, 219, 0); }
            100% { box-shadow: 0 0 0 0 rgba(52, 152, 219, 0); }
        }
        
        .animal-icon {
            font-size: 4.5rem;
            margin-bottom: 15px;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #f8f9fa;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }
        
        .animal-card h3 {
            color: #2c3e50;
            font-size: 1.3rem;
            font-weight: 600;
        }
        
        .categories-container {
            flex: 1;
            min-width: 300px;
        }
        
        .categories-container h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .category-boxes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
        }
        
        .category-box {
            background: #3498db;
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            min-height: 200px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            color: white;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .category-box::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 10px;
            background: rgba(255,255,255,0.4);
        }
        
        .category-box h2 {
            font-size: 1.8rem;
            margin-bottom: 25px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
            z-index: 2;
        }
        
        .category-box.mammal { background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); }
        .category-box.bird { background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); }
        .category-box.reptile { background: linear-gradient(135deg, #27ae60 0%, #219653 100%); }
        .category-box.amphibian { background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%); }
        .category-box.fish { background: linear-gradient(135deg, #f39c12 0%, #d35400 100%); }
        
        .category-box.correct {
            animation: pulse 0.5s;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .category-box.incorrect {
            animation: shake 0.5s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        
        /* 修改为动物容器 */
        .animal-container {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 15px;
            min-height: 120px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: flex-start;
            justify-content: center;
            margin-top: auto;
            padding: 15px;
            transition: all 0.3s ease;
            border: 3px dashed rgba(255,255,255,0.6);
        }
        
        .animal-container.empty::after {
            content: "将动物拖到此处";
            color: rgba(255,255,255,0.7);
            font-size: 1.1rem;
            font-style: italic;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        
        /* 分类区域内的小卡片 */
        .animal-container .animal-card {
            padding: 10px;
            transform: scale(0.85);
            cursor: pointer;
            margin: 0;
        }
        
        .animal-container .animal-card .animal-icon {
            font-size: 2.5rem;
            width: 60px;
            height: 60px;
            margin-bottom: 8px;
        }
        
        .animal-container .animal-card h3 {
            font-size: 1rem;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 40px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 15px 35px;
            border: none;
            border-radius: 60px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        button:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        
        button:active {
            transform: translateY(2px);
        }
        
        #resetBtn {
            background: linear-gradient(to right, #e74c3c, #c0392b);
            color: white;
        }
        
        #helpBtn {
            background: linear-gradient(to right, #3498db, #2980b9);
            color: white;
        }
        
        #checkBtn {
            background: linear-gradient(to right, #2ecc71, #27ae60);
            color: white;
        }
        
        .knowledge-card {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 25px;
            padding: 40px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
            z-index: 1000;
            display: none;
        }
        
        .knowledge-card.active {
            display: block;
            animation: popup 0.5s ease-out;
        }
        
        @keyframes popup {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        
        .knowledge-card h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 2.2rem;
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 3px solid #3498db;
        }
        
        .animal-fact {
            font-size: 1.3rem;
            line-height: 1.7;
            color: #34495e;
            margin-bottom: 30px;
            text-align: center;
            padding: 0 15px;
        }
        
        .animal-img {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            font-size: 6rem;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #f8f9fa;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        
        .close-btn {
            display: block;
            margin: 0 auto;
            padding: 12px 40px;
            background: linear-gradient(to right, #3498db, #2980b9);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }
        
        .close-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.6);
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 999;
            display: none;
        }
        
        .overlay.active {
            display: block;
        }
        
        .win-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 25px;
            padding: 50px 40px;
            text-align: center;
            z-index: 1001;
            display: none;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
            max-width: 700px;
            width: 90%;
        }
        
        .win-message.active {
            display: block;
            animation: popup 0.6s ease-out;
        }
        
        .win-message h2 {
            color: #27ae60;
            font-size: 3rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        .win-message p {
            font-size: 1.5rem;
            color: #2c3e50;
            margin-bottom: 40px;
            line-height: 1.7;
        }
        
        .animal-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 40px 0;
            flex-wrap: wrap;
        }
        
        .animal-icon-large {
            font-size: 4rem;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #f8f9fa;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            animation: float 4s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        .animal-icon-large:nth-child(1) { animation-delay: 0s; background: #f1c40f; color: white; }
        .animal-icon-large:nth-child(2) { animation-delay: 0.2s; background: #3498db; color: white; }
        .animal-icon-large:nth-child(3) { animation-delay: 0.4s; background: #27ae60; color: white; }
        .animal-icon-large:nth-child(4) { animation-delay: 0.6s; background: #9b59b6; color: white; }
        .animal-icon-large:nth-child(5) { animation-delay: 0.8s; background: #e74c3c; color: white; }
        
        #playAgainBtn {
            background: linear-gradient(to right, #9b59b6, #8e44ad);
            color: white;
            font-size: 1.4rem;
            padding: 18px 50px;
            margin-top: 20px;
        }
        
        .instructions {
            background: rgba(236, 240, 241, 0.9);
            border-radius: 20px;
            padding: 25px;
            margin: 30px 0;
            border-left: 8px solid #3498db;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .instructions h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .instructions p {
            color: #2c3e50;
            line-height: 1.7;
            font-size: 1.2rem;
        }
        
        .drag-hint {
            text-align: center;
            color: #7f8c8d;
            margin-top: 15px;
            font-size: 1.1rem;
            font-style: italic;
        }
        
        @media (max-width: 768px) {
            .game-area {
                flex-direction: column;
            }
            
            .header h1 {
                font-size: 2.5rem;
            }
            
            .badge {
                width: 60px;
                height: 60px;
                font-size: 1.8rem;
            }
            
            button {
                padding: 12px 25px;
                font-size: 1.1rem;
            }
            
            .animal-pool {
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
                gap: 15px;
            }
            
            .animal-card {
                padding: 15px 10px;
            }
            
            .animal-icon {
                font-size: 3.5rem;
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1><i class="fas fa-paw"></i> 动物分类小专家 <i class="fas fa-feather-alt"></i></h1>
            <p>将动物拖拽到正确的分类中，成为动物分类大师！</p>
            
            <div class="badge-progress">
                <div class="badge" id="badge1"><i class="fas fa-hippo"></i></div>
                <div class="badge" id="badge2"><i class="fas fa-dove"></i></div>
                <div class="badge" id="badge3"><i class="fas fa-dragon"></i></div>
                <div class="badge" id="badge4"><i class="fas fa-frog"></i></div>
                <div class="badge" id="badge5"><i class="fas fa-fish"></i></div>
            </div>
        </div>
        
        <div class="instructions">
            <h3><i class="fas fa-info-circle"></i> 游戏说明：</h3>
            <p>从下面的动物池中选择动物卡片，拖拽到正确的分类箱中。点击动物可以查看相关知识！完成一个类别的所有动物分类可获得徽章，收集全部5个徽章即可通关！</p>
            <p class="drag-hint">提示：每个分类箱可以放置多个动物</p>
        </div>
        
        <div class="game-area">
            <div class="animal-pool-container">
                <h2><i class="fas fa-water"></i> 动物池</h2>
                <div class="animal-pool" id="animalPool">
                    <!-- 动物卡片由JavaScript动态生成 -->
                </div>
            </div>
            
            <div class="categories-container">
                <h2><i class="fas fa-boxes"></i> 分类区</h2>
                <div class="category-boxes">
                    <div class="category-box mammal" data-category="mammal">
                        <h2>哺乳动物</h2>
                        <div class="animal-container empty" data-category="mammal"></div>
                    </div>
                    
                    <div class="category-box bird" data-category="bird">
                        <h2>鸟类</h2>
                        <div class="animal-container empty" data-category="bird"></div>
                    </div>
                    
                    <div class="category-box reptile" data-category="reptile">
                        <h2>爬行动物</h2>
                        <div class="animal-container empty" data-category="reptile"></div>
                    </div>
                    
                    <div class="category-box amphibian" data-category="amphibian">
                        <h2>两栖动物</h2>
                        <div class="animal-container empty" data-category="amphibian"></div>
                    </div>
                    
                    <div class="category-box fish" data-category="fish">
                        <h2>鱼类</h2>
                        <div class="animal-container empty" data-category="fish"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="controls">
            <button id="resetBtn"><i class="fas fa-redo"></i> 重新开始</button>
            <button id="helpBtn"><i class="fas fa-question-circle"></i> 游戏帮助</button>
            <button id="checkBtn"><i class="fas fa-tasks"></i> 检查进度</button>
        </div>
    </div>
    
    <div class="overlay" id="overlay"></div>
    
    <div class="knowledge-card" id="knowledgeCard">
        <div class="animal-img" id="cardImage"></div>
        <h2 id="animalName">动物名称</h2>
        <p class="animal-fact" id="animalFact">动物知识描述...</p>
        <button class="close-btn" id="closeCard"><i class="fas fa-check"></i> 知道了</button>
    </div>
    
    <div class="win-message" id="winMessage">
        <h2><i class="fas fa-trophy"></i> 恭喜你！ <i class="fas fa-trophy"></i></h2>
        <p>你已成功完成所有动物分类！</p>
        <p>你已证明自己是真正的动物分类小专家！</p>
        
        <div class="animal-icons">
            <div class="animal-icon-large"><i class="fas fa-hippo"></i></div>
            <div class="animal-icon-large"><i class="fas fa-dove"></i></div>
            <div class="animal-icon-large"><i class="fas fa-dragon"></i></div>
            <div class="animal-icon-large"><i class="fas fa-frog"></i></div>
            <div class="animal-icon-large"><i class="fas fa-fish"></i></div>
        </div>
        
        <button id="playAgainBtn"><i class="fas fa-play-circle"></i> 再玩一次</button>
    </div>

    <script>
        // 动物数据（扩展了更多动物）
        const animals = [
            {
                id: 1,
                name: "狮子",
                category: "mammal",
                icon: '<i class="fas fa-lion"></i>',
                fact: "狮子是唯一群居的猫科动物，雄狮的鬃毛是它们最显著的特征，用来吸引雌狮和威慑对手。狮子主要在夜间狩猎，可以长时间不喝水，从猎物中获取水分。"
            },
            {
                id: 2,
                name: "蝙蝠",
                category: "mammal",
                icon: '<i class="fas fa-bat"></i>',
                fact: "蝙蝠是唯一真正会飞的哺乳动物，它们使用回声定位在黑暗中导航和捕食昆虫。有些蝙蝠可以飞行超过50公里寻找食物，而且它们的新陈代谢非常快，能在20分钟内消化食物。"
            },
            {
                id: 3,
                name: "鲸鱼",
                category: "mammal",
                icon: '<i class="fas fa-whale"></i>',
                fact: "鲸鱼是地球上最大的哺乳动物，它们用肺呼吸空气，鲸鱼宝宝喝妈妈的乳汁长大。蓝鲸的体重可达200吨，心脏有小汽车那么大，声音能传播上千公里！"
            },
            {
                id: 4,
                name: "大象",
                category: "mammal",
                icon: '<i class="fas fa-elephant"></i>',
                fact: "大象是陆地上最大的哺乳动物，它们拥有动物界最长的孕期（22个月）。大象的大脑重达5公斤，是陆生动物中最大的。它们使用次声波进行远距离交流，能听到几公里外的声音。"
            },
            {
                id: 5,
                name: "企鹅",
                category: "bird",
                icon: '<i class="fas fa-kiwi-bird"></i>',

        // 游戏状态
        let gameState = {
            classified: [],
            badgesEarned: 0
        };

        // 初始化游戏
        function initGame() {
            const animalPool = document.getElementById('animalPool');
            animalPool.innerHTML = '';
            
            // 重置游戏状态
            gameState = {
                classified: [],
                badgesEarned: 0
            };
            
            // 重置徽章
            for(let i = 1; i <= 5; i++) {
                const badge = document.getElementById(`badge${i}`);
                badge.classList.remove('earned');
            }
            
            // 清空分类容器
            document.querySelectorAll('.animal-container').forEach(container => {
                container.innerHTML = '';
                container.classList.add('empty');
            });
            
            // 创建动物卡片
            animals.forEach(animal => {
                const animalCard = document.createElement('div');
                animalCard.className = 'animal-card';
                animalCard.draggable = true;
                animalCard.dataset.id = animal.id;
                animalCard.dataset.category = animal.category;
                animalCard.innerHTML = `
                    <div class="animal-icon">${animal.icon}</div>
                    <h3>${animal.name}</h3>
                `;
                
                // 添加拖拽事件
                animalCard.addEventListener('dragstart', handleDragStart);
                animalCard.addEventListener('click', () => showKnowledgeCard(animal));
                
                animalPool.appendChild(animalCard);
            });
            
            // 添加放置区域事件
            document.querySelectorAll('.animal-container').forEach(container => {
                container.addEventListener('dragover', handleDragOver);
                container.addEventListener('drop', handleDrop);
            });
        }

        // 拖拽功能实现
        let draggedAnimal = null;

        function handleDragStart(e) {
            draggedAnimal = this;
            this.classList.add('dragging');
            e.dataTransfer.setData('text/plain', this.dataset.id);
        }

        function handleDragOver(e) {
            e.preventDefault();
        }

        function handleDrop(e) {
            e.preventDefault();
            const category = this.dataset.category;
            const animalId = draggedAnimal.dataset.id;
            const correctCategory = draggedAnimal.dataset.category;
            
            // 检查分类是否正确
            if (category === correctCategory) {
                // 正确分类
                // 创建分类区域的小卡片
                const miniCard = document.createElement('div');
                miniCard.className = 'animal-card';
                miniCard.dataset.id = animalId;
                miniCard.dataset.category = correctCategory;
                miniCard.innerHTML = `
                    <div class="animal-icon">${draggedAnimal.querySelector('.animal-icon').innerHTML}</div>
                    <h3>${draggedAnimal.querySelector('h3').textContent}</h3>
                `;
                
                // 添加点击事件查看知识卡片
                const animal = animals.find(a => a.id == animalId);
                miniCard.addEventListener('click', () => showKnowledgeCard(animal));
                
                this.appendChild(miniCard);
                this.classList.remove('empty');
                
                // 添加动物到已分类列表
                if (!gameState.classified.includes(animalId)) {
                    gameState.classified.push(animalId);
                }
                
                // 移除原始卡片
                draggedAnimal.remove();
                
                // 正确反馈效果
                this.closest('.category-box').classList.add('correct');
                setTimeout(() => {
                    this.closest('.category-box').classList.remove('correct');
                }, 500);
                
                // 检查是否获得徽章
                checkBadgeProgress();
            } else {
                // 错误分类
                const categoryBox = this.closest('.category-box');
                categoryBox.classList.add('incorrect');
                
                // 错误反馈效果
                setTimeout(() => {
                    categoryBox.classList.remove('incorrect');
                }, 500);
            }
            
            draggedAnimal.classList.remove('dragging');
            draggedAnimal = null;
            
            // 检查游戏是否完成
            checkGameCompletion();
        }

        // 播放音效
        function playSound(type) {
            // 实际项目中这里会播放音效
            console.log(`Playing ${type} sound`);
        }

        // 检查徽章进度
        function checkBadgeProgress() {
            const categories = ['mammal', 'bird', 'reptile', 'amphibian', 'fish'];
            let earnedCount = 0;
            
            categories.forEach((category, index) => {
                const categoryAnimals = animals.filter(a => a.category === category);
                const classifiedInCategory = gameState.classified.filter(id => {
                    const animal = animals.find(a => a.id == id);
                    return animal && animal.category === category;
                });
                
                if (classifiedInCategory.length === categoryAnimals.length) {
                    const badge = document.getElementById(`badge${index+1}`);
                    if (!badge.classList.contains('earned')) {
                        badge.classList.add('earned');
                        earnedCount++;
                        
                        // 徽章获得动画
                        badge.animate([
                            { transform: 'scale(1)', opacity: 1 },
                            { transform: 'scale(1.5)', opacity: 0.7 },
                            { transform: 'scale(1.2)', opacity: 1 }
                        ], {
                            duration: 800,
                            iterations: 1
                        });
                    }
                }
            });
            
            gameState.badgesEarned = earnedCount;
        }

        // 检查游戏是否完成
        function checkGameCompletion() {
            if (gameState.classified.length === animals.length) {
                setTimeout(() => {
                    document.getElementById('winMessage').classList.add('active');
                    document.getElementById('overlay').classList.add('active');
                }, 1000);
            }
        }

        // 显示知识卡片
        function showKnowledgeCard(animal) {
            document.getElementById('animalName').textContent = animal.name;
            document.getElementById('animalFact').textContent = animal.fact;
            document.getElementById('cardImage').innerHTML = animal.icon;
            
            document.getElementById('knowledgeCard').classList.add('active');
            document.getElementById('overlay').classList.add('active');
        }

        // 事件监听器
        document.getElementById('closeCard').addEventListener('click', () => {
            document.getElementById('knowledgeCard').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
        });

        document.getElementById('resetBtn').addEventListener('click', initGame);
        
        document.getElementById('playAgainBtn').addEventListener('click', () => {
            document.getElementById('winMessage').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
            initGame();
        });
        
        document.getElementById('helpBtn').addEventListener('click', () => {
            alert("🏆 游戏帮助 🏆\n\n1. 拖拽动物到对应的分类箱中进行分类\n2. 点击动物可以查看相关知识\n3. 分类正确一个类别的所有动物可获得徽章\n4. 收集全部5个徽章即可通关！\n\n💡 小贴士：哺乳动物有毛发和乳腺，鸟类有羽毛和喙，爬行动物有鳞片，两栖动物幼时生活在水中，鱼类用鳃呼吸！");
        });
        
        document.getElementById('checkBtn').addEventListener('click', () => {
            const progress = Math.round((gameState.classified.length / animals.length) * 100);
            alert(`📊 当前进度：${progress}%\n\n已分类动物：${gameState.classified.length}/${animals.length}\n获得徽章：${gameState.badgesEarned}/5\n\n${gameState.badgesEarned === 5 ? "恭喜！你已收集所有徽章！" : "继续加油！"}`);
        });

        // 初始化游戏
        window.addEventListener('DOMContentLoaded', initGame);
    </script>
