<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>女性月经周期日历跟踪工具</title>
    <style>
        :root {
            --primary-color: #ffcce6;
            --secondary-color: #ff99cc;
            --accent-color: #ff66b2;
            --text-color: #4a4a4a;
            --light-color: #fff0f7;
            --period-color: #ff4d94;
            --ovulation-color: #ffd700;
            --safe-color: #90ee90;
            --fertile-color: #ffb6c1;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, var(--primary-color), var(--light-color));
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(to right, var(--secondary-color), var(--accent-color));
            color: white;
            padding: 25px;
            text-align: center;
            position: relative;
        }
        
        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: var(--light-color);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            gap: 15px;
        }
        
        .month-nav {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .settings-area {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            padding: 10px 20px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
        }
        
        .setting-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .setting-item label {
            font-size: 0.95rem;
            font-weight: 500;
        }
        
        .setting-item input {
            width: 60px;
            padding: 8px;
            border: 1px solid var(--secondary-color);
            border-radius: 8px;
            text-align: center;
            font-size: 1rem;
        }
        
        .nav-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .nav-btn:hover {
            background-color: var(--secondary-color);
            transform: scale(1.05);
        }
        
        .current-month {
            font-size: 1.5rem;
            font-weight: 600;
            min-width: 200px;
            text-align: center;
        }
        
        .legend {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 15px;
            background-color: var(--light-color);
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9rem;
        }
        
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }
        
        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            padding: 15px;
            background-color: var(--light-color);
        }
        
        .day-header {
            padding: 15px 5px;
            text-align: center;
            font-weight: 600;
            background-color: var(--primary-color);
            color: var(--text-color);
        }
        
        .day {
            aspect-ratio: 1/1;
            background-color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }
        
        .day:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            background-color: #fff9fc;
        }
        
        .day.other-month {
            color: #aaa;
            background-color: #f9f9f9;
        }
        
        .day-number {
            font-size: 1.2rem;
            font-weight: 600;
        }
        
        .day-label {
            font-size: 0.7rem;
            margin-top: 5px;
            padding: 2px 5px;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.7);
        }
        
        .period-indicator {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--period-color);
        }
        
        .day.period {
            background-color: rgba(255, 77, 148, 0.15);
        }
        
        .day.ovulation {
            background-color: rgba(255, 215, 0, 0.25);
        }
        
        .day.fertile {
            background-color: rgba(255, 182, 193, 0.25);
        }
        
        .day.safe {
            background-color: rgba(144, 238, 144, 0.25);
        }
        
        .day.selected {
            border: 2px solid var(--accent-color);
        }
        
        .day.start .day-number::before {
            content: "开始";
            font-size: 0.6rem;
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--period-color);
            font-weight: bold;
        }
        
        .day.end .day-number::after {
            content: "结束";
            font-size: 0.6rem;
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--period-color);
            font-weight: bold;
        }
        
        .info-panel {
            padding: 20px;
            background-color: white;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }
        
        .info-title {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: var(--accent-color);
            text-align: center;
        }
        
        .cycle-info {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .cycle-phase {
            background-color: var(--light-color);
            padding: 15px;
            border-radius: 12px;
            min-width: 200px;
            flex: 1;
        }
        
        .phase-title {
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .phase-title::before {
            content: "";
            display: inline-block;
            width: 15px;
            height: 15px;
            border-radius: 4px;
        }
        
        .phase-period .phase-title::before {
            background-color: var(--period-color);
        }
        
        .phase-ovulation .phase-title::before {
            background-color: var(--ovulation-color);
        }
        
        .phase-fertile .phase-title::before {
            background-color: var(--fertile-color);
        }
        
        .phase-safe .phase-title::before {
            background-color: var(--safe-color);
        }
        
        .phase-dates {
            font-size: 0.9rem;
            line-height: 1.6;
        }
        
        .phase-dates span {
            display: block;
            margin-top: 5px;
            padding: 3px 8px;
            background-color: white;
            border-radius: 5px;
        }
        
        .status-indicator {
            padding: 8px 15px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            font-weight: 500;
            margin-top: 5px;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .status-start {
            background-color: rgba(255, 77, 148, 0.2);
            color: var(--period-color);
        }
        
        .status-end {
            background-color: rgba(144, 238, 144, 0.3);
            color: var(--safe-color);
        }
        
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                gap: 15px;
            }
            
            .settings-area {
                width: 100%;
                justify-content: space-around;
            }
            
            .calendar {
                padding: 5px;
            }
            
            .day-header {
                padding: 10px 2px;
                font-size: 0.9rem;
            }
            
            .day-number {
                font-size: 1rem;
            }
            
            .cycle-info {
                flex-direction: column;
            }
            
            .current-month {
                font-size: 1.3rem;
                min-width: 170px;
            }
            
            .legend {
                padding: 10px;
                gap: 8px;
            }
            
            .legend-item {
                font-size: 0.8rem;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .subtitle {
                font-size: 0.95rem;
            }
            
            .settings-area {
                flex-direction: column;
                align-items: flex-start;
                padding: 15px;
            }
            
            .setting-item {
                width: 100%;
                justify-content: space-between;
            }
            
            .setting-item input {
                width: 70px;
            }
            
            .legend {
                justify-content: flex-start;
                padding: 10px 15px;
            }
            
            .cycle-phase {
                min-width: 100%;
            }
            
            .phase-title {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>月经周期跟踪日历</h1>
            <p class="subtitle">记录您的月经周期，预测排卵期和安全期</p>
        </header>
        
        <div class="controls">
            <div class="month-nav">
                <button class="nav-btn" id="prev-month">←</button>
                <div class="current-month" id="current-month">2023年10月</div>
                <button class="nav-btn" id="next-month">→</button>
            </div>
            
            <div class="settings-area">
                <div class="setting-item">
                    <label for="cycle-length">周期长度(天):</label>
                    <input type="number" id="cycle-length" min="21" max="45" value="28">
                </div>
                
                <div class="setting-item">
                    <label for="period-length">经期长度(天):</label>
                    <input type="number" id="period-length" min="3" max="10" value="5">
                </div>
            </div>
        </div>
        
        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background-color: rgba(255, 77, 148, 0.15);"></div>
                <span>月经期</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: rgba(255, 215, 0, 0.25);"></div>
                <span>排卵期</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: rgba(255, 182, 193, 0.25);"></div>
                <span>易孕期</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: rgba(144, 238, 144, 0.25);"></div>
                <span>安全期</span>
            </div>
        </div>
        
        <!-- 状态指示器 -->
        <div class="status-indicator" id="status-indicator">请点击日期设置月经开始日期</div>
        
        <div class="calendar">
            <!-- 星期标题 -->
            <div class="day-header">周日</div>
            <div class="day-header">周一</div>
            <div class="day-header">周二</div>
            <div class="day-header">周三</div>
            <div class="day-header">周四</div>
            <div class="day-header">周五</div>
            <div class="day-header">周六</div>
            
            <!-- 日期由JavaScript动态生成 -->
        </div>
        
        <div class="info-panel">
            <h2 class="info-title">当前周期信息</h2>
            <div class="cycle-info">
                <div class="cycle-phase phase-period">
                    <h3 class="phase-title">月经期</h3>
                    <div class="phase-dates">
                        <span id="period-dates">未设置</span>
                    </div>
                </div>
                <div class="cycle-phase phase-ovulation">
                    <h3 class="phase-title">排卵期</h3>
                    <div class="phase-dates">
                        <span id="ovulation-dates">未设置</span>
                    </div>
                </div>
                <div class="cycle-phase phase-fertile">
                    <h3 class="phase-title">易孕期</h3>
                    <div class="phase-dates">
                        <span id="fertile-dates">未设置</span>
                    </div>
                </div>
                <div class="cycle-phase phase-safe">
                    <h3 class="phase-title">安全期</h3>
                    <div class="phase-dates">
                        <span id="safe-dates">未设置</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 当前显示的日期
            let currentDate = new Date();
            // 月经开始和结束日期
            let periodStart = null;
            let periodEnd = null;
            // 当前周期长度（天）
            let cycleLength = parseInt(document.getElementById('cycle-length').value) || 28;
            // 当前经期长度（天）
            let periodLength = parseInt(document.getElementById('period-length').value) || 5;
            // 设置状态: 'start' 或 'end'
            let settingState = 'start';
            // 日历元素
            const calendarEl = document.querySelector('.calendar');
            // 状态指示器
            const statusIndicator = document.getElementById('status-indicator');
            
            // 更新状态指示器
            function updateStatusIndicator() {
                if (settingState === 'start') {
                    statusIndicator.textContent = "请点击日期设置月经开始日期";
                    statusIndicator.className = "status-indicator status-start";
                } else {
                    statusIndicator.textContent = "请点击日期设置月经结束日期";
                    statusIndicator.className = "status-indicator status-end";
                }
            }
            
            // 监听周期长度输入变化
            document.getElementById('cycle-length').addEventListener('change', function() {
                cycleLength = parseInt(this.value) || 28;
                if (cycleLength < 21) cycleLength = 21;
                if (cycleLength > 45) cycleLength = 45;
                this.value = cycleLength;
                if (periodStart && periodEnd) {
                    renderCalendar(currentDate);
                }
            });
            
            // 监听经期长度输入变化
            document.getElementById('period-length').addEventListener('change', function() {
                periodLength = parseInt(this.value) || 5;
                if (periodLength < 3) periodLength = 3;
                if (periodLength > 10) periodLength = 10;
                this.value = periodLength;
                
                // 如果已经设置了开始日期但未设置结束日期
                if (periodStart && !periodEnd) {
                    periodEnd = new Date(periodStart);
                    periodEnd.setDate(periodEnd.getDate() + periodLength - 1);
                    renderCalendar(currentDate);
                }
                // 如果已经设置了完整的月经周期
                else if (periodStart && periodEnd) {
                    renderCalendar(currentDate);
                }
            });
            
            // 初始化日历
            renderCalendar(currentDate);
            updateStatusIndicator();
            
            // 上个月按钮事件
            document.getElementById('prev-month').addEventListener('click', function() {
                currentDate.setMonth(currentDate.getMonth() - 1);
                renderCalendar(currentDate);
            });
            
            // 下个月按钮事件
            document.getElementById('next-month').addEventListener('click', function() {
                currentDate.setMonth(currentDate.getMonth() + 1);
                renderCalendar(currentDate);
            });
            
            // 渲染日历
            function renderCalendar(date) {
                const monthYearEl = document.getElementById('current-month');
                
                // 设置当前年月显示
                const monthNames = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];
                monthYearEl.textContent = `${date.getFullYear()}年${monthNames[date.getMonth()]}`;
                
                // 获取当月第一天和最后一天
                const firstDay = new Date(date.getFullYear(), date.getMonth(), 1);
                const lastDay = new Date(date.getFullYear(), date.getMonth() + 1, 0);
                
                // 获取当月第一天是星期几（0为周日）
                const firstDayIndex = firstDay.getDay();
                
                // 获取上个月最后一天
                const prevLastDay = new Date(date.getFullYear(), date.getMonth(), 0).getDate();
                
                // 清空日历（保留星期标题）
                while (calendarEl.children.length > 7) {
                    calendarEl.removeChild(calendarEl.lastChild);
                }
                
                // 添加上个月的日期
                for (let i = firstDayIndex; i > 0; i--) {
                    const day = document.createElement('div');
                    day.className = 'day other-month';
                    day.innerHTML = `<div class="day-number">${prevLastDay - i + 1}</div>`;
                    calendarEl.appendChild(day);
                }
                
                // 添加当月的日期
                for (let i = 1; i <= lastDay.getDate(); i++) {
                    const day = document.createElement('div');
                    day.className = 'day';
                    day.innerHTML = `<div class="day-number">${i}</div>`;
                    
                    const dayDate = new Date(date.getFullYear(), date.getMonth(), i);
                    
                    // 高亮选择的开始和结束日期
                    if (periodStart && dayDate.getTime() === periodStart.getTime()) {
                        day.classList.add('selected');
                    }
                    
                    if (periodEnd && dayDate.getTime() === periodEnd.getTime()) {
                        day.classList.add('selected');
                    }
                    
                    // 标记月经期
                    if (periodStart && periodEnd) {
                        if (dayDate >= periodStart && dayDate <= periodEnd) {
                            day.classList.add('period');
                            
                            // 标记开始和结束日期
                            if (dayDate.getTime() === periodStart.getTime()) {
                                day.classList.add('start');
                            }
                            if (dayDate.getTime() === periodEnd.getTime()) {
                                day.classList.add('end');
                            }
                        }
                        
                        // 计算并标记其他周期阶段
                        if (periodStart) {
                            // 排卵日 = 月经开始日 + (周期长度 - 14)天
                            const ovulationDate = new Date(periodStart);
                            ovulationDate.setDate(ovulationDate.getDate() + (cycleLength - 14));
                            
                            // 易孕期 = 排卵日前5天到后1天
                            const fertileStart = new Date(ovulationDate);
                            fertileStart.setDate(fertileStart.getDate() - 5);
                            
                            const fertileEnd = new Date(ovulationDate);
                            fertileEnd.setDate(fertileEnd.getDate() + 1);
                            
                            // 安全期 = 月经结束后到易孕开始前 + 易孕结束后到下次月经前
                            const safe1Start = new Date(periodEnd);
                            safe1Start.setDate(safe1Start.getDate() + 1);
                            
                            const safe1End = new Date(fertileStart);
                            safe1End.setDate(safe1End.getDate() - 1);
                            
                            const safe2Start = new Date(fertileEnd);
                            safe2Start.setDate(safe2Start.getDate() + 1);
                            
                            const safe2End = new Date(periodStart);
                            safe2End.setDate(safe2End.getDate() + cycleLength - 1);
                            
                            // 标记排卵日
                            if (dayDate.getTime() === ovulationDate.getTime()) {
                                day.classList.add('ovulation');
                                day.innerHTML += '<div class="day-label">排卵日</div>';
                            }
                            
                            // 标记易孕期
                            if (dayDate >= fertileStart && dayDate <= fertileEnd && 
                                dayDate < periodStart && dayDate > periodEnd) {
                                day.classList.add('fertile');
                                if (dayDate.getTime() !== ovulationDate.getTime()) {
                                    day.innerHTML += '<div class="day-label">易孕</div>';
                                }
                            }
                            
                            // 标记安全期
                            if ((dayDate >= safe1Start && dayDate <= safe1End) || 
                                (dayDate >= safe2Start && dayDate <= safe2End)) {
                                day.classList.add('safe');
                                day.innerHTML += '<div class="day-label">安全</div>';
                            }
                        }
                    }
                    
                    // 点击日期事件
                    day.addEventListener('click', function() {
                        handleDayClick(dayDate);
                    });
                    
                    calendarEl.appendChild(day);
                }
                
                // 添加下个月的日期
                const daysNeeded = 42 - (calendarEl.children.length - 7); // 6行 * 7天
                for (let i = 1; i <= daysNeeded; i++) {
                    const day = document.createElement('div');
                    day.className = 'day other-month';
                    day.innerHTML = `<div class="day-number">${i}</div>`;
                    calendarEl.appendChild(day);
                }
                
                // 更新信息面板
                updateInfoPanel();
            }
            
            // 处理日期点击
            function handleDayClick(date) {
                if (settingState === 'start') {
                    // 设置月经开始日期
                    periodStart = date;
                    settingState = 'end';
                    periodEnd = null; // 清空结束日期
                } else if (settingState === 'end') {
                    // 设置月经结束日期
                    if (date >= periodStart) {
                        periodEnd = date;
                        settingState = 'start';
                    } else {
                        // 如果选了一个比开始日期早的日期，则重置为开始日期设置
                        periodStart = date;
                        periodEnd = null;
                        settingState = 'end';
                    }
                }
                
                // 更新状态指示器
                updateStatusIndicator();
                
                renderCalendar(currentDate);
            }
            
            // 更新信息面板
            function updateInfoPanel() {
                const periodDatesEl = document.getElementById('period-dates');
                const ovulationDatesEl = document.getElementById('ovulation-dates');
                const fertileDatesEl = document.getElementById('fertile-dates');
                const safeDatesEl = document.getElementById('safe-dates');
                
                if (periodStart && periodEnd) {
                    // 格式化日期
                    const formatDate = (date) => {
                        return `${date.getMonth() + 1}月${date.getDate()}日`;
                    };
                    
                    // 月经期
                    periodDatesEl.textContent = `${formatDate(periodStart)} 至 ${formatDate(periodEnd)}`;
                    
                    // 排卵日
                    const ovulationDate = new Date(periodStart);
                    ovulationDate.setDate(ovulationDate.getDate() + (cycleLength - 14));
                    ovulationDatesEl.textContent = formatDate(ovulationDate);
                    
                    // 易孕期
                    const fertileStart = new Date(ovulationDate);
                    fertileStart.setDate(fertileStart.getDate() - 5);
                    
                    const fertileEnd = new Date(ovulationDate);
                    fertileEnd.setDate(fertileEnd.getDate() + 1);
                    
                    let fertileText = `${formatDate(fertileStart)} 至 ${formatDate(fertileEnd)}`;
                    // 检查易孕期是否跨月
                    if (fertileStart.getMonth() !== fertileEnd.getMonth()) {
                        fertileText = `${fertileStart.getMonth()+1}月${fertileStart.getDate()}日 - ${fertileEnd.getMonth()+1}月${fertileEnd.getDate()}日`;
                    }
                    
                    fertileDatesEl.textContent = fertileText;
                    
                    // 安全期
                    const safe1Start = new Date(periodEnd);
                    safe1Start.setDate(safe1Start.getDate() + 1);
                    
                    const safe1End = new Date(fertileStart);
                    safe1End.setDate(safe1End.getDate() - 1);
                    
                    const safe2Start = new Date(fertileEnd);
                    safe2Start.setDate(safe2Start.getDate() + 1);
                    
                    const safe2End = new Date(periodStart);
                    safe2End.setDate(safe2End.getDate() + cycleLength - 1);
                    
                    safeDatesEl.textContent = `${formatDate(safe1Start)}-${formatDate(safe1End)} 和 ${formatDate(safe2Start)}-${formatDate(safe2End)}`;
                } else {
                    periodDatesEl.textContent = "未设置";
                    ovulationDatesEl.textContent = "未设置";
                    fertileDatesEl.textContent = "未设置";
                    safeDatesEl.textContent = "未设置";
                }
            }
            
            // 移动设备调整大小
            window.addEventListener('resize', function() {
                renderCalendar(currentDate);
            });
        });
    </script>
</body>
</html>
