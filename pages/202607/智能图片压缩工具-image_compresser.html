<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能图片压缩工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            padding-bottom: 100.5px; /* 电脑端底部预留 */
        }

        @media (max-width: 768px) {
            body {
                padding-bottom: 100px; /* 手机端底部预留 */
            }
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            min-height: calc(100vh - 100.5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .container {
                min-height: calc(100vh - 100px);
                padding: 15px;
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 768px) {
            .card {
                padding: 25px;
                border-radius: 15px;
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        @media (max-width: 768px) {
            .header {
                margin-bottom: 30px;
            }
        }

        .title {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2rem;
            }
        }

        .subtitle {
            color: #666;
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            .subtitle {
                font-size: 1rem;
            }
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
            background: rgba(102, 126, 234, 0.05);
        }

        @media (max-width: 768px) {
            .upload-area {
                padding: 30px 20px;
            }
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: rgba(118, 75, 162, 0.05);
            transform: translateY(-2px);
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: rgba(118, 75, 162, 0.1);
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .upload-icon {
                font-size: 2.5rem;
            }
        }

        .upload-text {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .upload-text {
                font-size: 1.1rem;
            }
        }

        .upload-hint {
            color: #888;
            font-size: 0.9rem;
        }

        .file-input {
            display: none;
        }

        .controls {
            display: none;
            margin-bottom: 30px;
        }

        .controls.show {
            display: block;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .control-group {
            margin-bottom: 25px;
        }

        .control-label {
            display: block;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
        }

        .size-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        @media (max-width: 768px) {
            .size-input-group {
                flex-direction: column;
                align-items: stretch;
                gap: 15px;
            }
        }

        .size-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .size-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .unit-select {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }

        .unit-select:focus {
            outline: none;
            border-color: #667eea;
        }

        .compress-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .compress-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .compress-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-area {
            display: none;
            margin-top: 30px;
        }

        .result-area.show {
            display: block;
            animation: slideIn 0.5s ease;
        }

        .result-info {
            background: rgba(102, 126, 234, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(102, 126, 234, 0.2);
        }

        .info-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .info-label {
            font-weight: 600;
            color: #555;
        }

        .info-value {
            color: #667eea;
            font-weight: 500;
        }

        .download-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(76, 175, 80, 0.3);
        }

        .preview-area {
            display: none;
            margin-top: 20px;
        }

        .preview-area.show {
            display: block;
            animation: slideIn 0.5s ease;
        }

        .preview-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .preview-container.two-columns {
            grid-template-columns: 1fr 1fr;
        }

        @media (max-width: 768px) {
            .preview-container.two-columns {
                grid-template-columns: 1fr;
                gap: 15px;
            }
        }

        .preview-item {
            text-align: center;
        }

        .preview-item.compressed {
            display: none;
        }

        .preview-item.compressed.show {
            display: block;
        }

        .preview-label {
            font-weight: 600;
            color: #555;
            margin-bottom: 10px;
        }

        .preview-image {
            max-width: 100%;
            max-height: 200px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            margin: 20px 0;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(102, 126, 234, 0.3);
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: rgba(244, 67, 54, 0.1);
            color: #d32f2f;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 4px solid #f44336;
            display: none;
        }

        .error.show {
            display: block;
            animation: slideIn 0.5s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1 class="title">智能图片压缩</h1>
                <p class="subtitle">快速压缩图片到指定大小，保持最佳画质</p>
            </div>

            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📁</div>
                <div class="upload-text">点击或拖拽图片到此处</div>
                <div class="upload-hint">支持 JPG、PNG、WebP 格式</div>
                <input type="file" id="fileInput" class="file-input" accept="image/*">
            </div>

            <div class="error" id="errorMsg"></div>

            <div class="controls" id="controls">
                <div class="control-group">
                    <label class="control-label">目标文件大小</label>
                    <div class="size-input-group">
                        <input type="number" id="targetSize" class="size-input" placeholder="输入数字" min="1" value="500">
                        <select id="sizeUnit" class="unit-select">
                            <option value="KB">KB</option>
                            <option value="MB">MB</option>
                        </select>
                    </div>
                </div>
                <button id="compressBtn" class="compress-btn">开始压缩</button>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                正在压缩中...
            </div>

            <div class="preview-area" id="previewArea">
                <div class="preview-container">
                    <div class="preview-item">
                        <div class="preview-label">原图预览</div>
                        <img id="originalPreview" class="preview-image" alt="原图预览">
                    </div>
                    <div class="preview-item compressed" id="compressedPreviewItem">
                        <div class="preview-label">压缩后预览</div>
                        <img id="compressedPreview" class="preview-image" alt="压缩后预览">
                    </div>
                </div>
            </div>

            <div class="result-area" id="resultArea">
                <div class="result-info">
                    <div class="info-item">
                        <span class="info-label">原始大小</span>
                        <span class="info-value" id="originalSize">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">压缩后大小</span>
                        <span class="info-value" id="compressedSize">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">压缩比例</span>
                        <span class="info-value" id="compressionRatio">-</span>
                    </div>
                </div>
                <a id="downloadBtn" class="download-btn" download>下载压缩图片</a>
            </div>
        </div>
        <template id="site-footer">
            <style>
                .footer {
                position: fixed;   /* 贴底 */
                bottom: 55px;
                left: 0;
                width: 100%;
                padding: .75rem 1rem;
                font-size: 14px;
                background: #fafafa;
                border-top: 1px solid #eaeaea;
                display: flex;
                flex-wrap: wrap;
                gap: .5rem;
                justify-content: center;
                align-items: center;
                z-index: 999;
                }
                
                @media (max-width: 768px) {
                    .footer {
                        bottom: 47px;
                    }
                }
                .footer a { color: #0077cc; text-decoration: none; }
                .footer a:hover { text-decoration: underline; }
    
                .qr-wrapper { position: relative; display: inline-block; }
                .qr-img {
                /* 初始隐藏 */
                display: none;
                position: absolute;
                bottom: 1.8rem;   /* 调整图片出现的位置 */
                left: 50%;
                transform: translateX(-50%);
                max-width: 140px;
                border: 1px solid #ddd;
                background: #fff;
                padding: 4px;
                border-radius: 6px;
                box-shadow: 0 4px 12px rgba(0,0,0,.15);
                }
                .qr-wrapper:hover .qr-img { display: block; }
            </style>
    
            <div class="footer">
                Created&nbsp;by：
                <!-- 广告示例 1 -->
                    <span class="qr-wrapper">
                    <a class="qr-link"
                        href="https://mp.weixin.qq.com/mp/profile_ext?action=home&__biz=MzI0MzUzOTEwMw==&scene=124#wechat_redirect"
                        target="_blank"
                        data-img="https://youke1.picui.cn/s1/2025/07/12/6872600d20281.jpg">系统1与系统2</a>
                    <img class="qr-img" alt="系统1与系统2公众号二维码">
                    </span>
                &nbsp;||&nbsp;广告位：
                <!-- 广告示例 1 -->
                <span class="qr-wrapper">
                <a class="qr-link"
                    href="https://t.zsxq.com/SjYuX"
                    target="_blank"
                    data-img="https://youke1.picui.cn/s1/2025/07/12/6871f995b3e7a.jpg">AI编程星球</a>
                <img class="qr-img" alt="AI编程星球二维码">
                </span> |
                <!-- 广告示例 2 -->
                <span class="qr-wrapper">
                <a class="qr-link"
                    href="https://t.zsxq.com/VTCya"
                    target="_blank"
                    data-img="https://youke1.picui.cn/s1/2025/07/12/6871f9c361e7d.jpg">副业避坑星球</a>
                <img class="qr-img" alt="副业避坑星球二维码">
                </span> |
                <!-- 广告示例 3（如果没有 data-img 就不会弹出图片） -->
                <span class="qr-wrapper">
                <a class="qr-link"
                    href="https://www.xiaobot.net/p/ai07?refer=a9625ad2-ec04-4cc8-8549-7511079cb3b5"
                    target="_blank"
                    data-img="https://youke1.picui.cn/s1/2025/07/12/6871f9ef3edba.jpg">AI&nbsp;产品日报</a>
                <img class="qr-img" alt="AI产品日报二维码">
                </span> |
                <span class="qr-wrapper">
                <a class="qr-link"
                    href="https://t.zsxq.com/jcaEa"
                    target="_blank"
                    data-img="https://youke1.picui.cn/s1/2025/07/12/6871fa39eab33.jpg">AI&nbsp;产品经理大本营</a>
                <img class="qr-img" alt="AI产品经理大本营二维码">
                </span>
            </div>
        </template>
    </div>

    <script>
        class ImageCompressor {
            constructor() {
                this.currentFile = null;
                this.compressedBlob = null;
                this.initializeEventListeners();
            }

            initializeEventListeners() {
                const uploadArea = document.getElementById('uploadArea');
                const fileInput = document.getElementById('fileInput');
                const compressBtn = document.getElementById('compressBtn');

                // 点击上传区域
                uploadArea.addEventListener('click', () => fileInput.click());

                // 文件选择
                fileInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) this.handleFileSelect(file);
                });

                // 拖拽功能
                uploadArea.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    uploadArea.classList.add('dragover');
                });

                uploadArea.addEventListener('dragleave', () => {
                    uploadArea.classList.remove('dragover');
                });

                uploadArea.addEventListener('drop', (e) => {
                    e.preventDefault();
                    uploadArea.classList.remove('dragover');
                    const file = e.dataTransfer.files[0];
                    if (file && file.type.startsWith('image/')) {
                        this.handleFileSelect(file);
                    }
                });

                // 压缩按钮
                compressBtn.addEventListener('click', () => this.compressImage());
            }

            handleFileSelect(file) {
                if (!file.type.startsWith('image/')) {
                    this.showError('请选择有效的图片文件');
                    return;
                }

                this.currentFile = file;
                this.hideError();
                this.showControls();
                this.showOriginalPreview(file);
                this.hideResults();
                
                // 显示原始文件大小
                document.getElementById('originalSize').textContent = this.formatFileSize(file.size);
            }

            showOriginalPreview(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = document.getElementById('originalPreview');
                    img.src = e.target.result;
                    document.getElementById('previewArea').classList.add('show');
                    // 隐藏压缩后预览
                    document.getElementById('compressedPreviewItem').classList.remove('show');
                    document.querySelector('.preview-container').classList.remove('two-columns');
                };
                reader.readAsDataURL(file);
            }

            async compressImage() {
                if (!this.currentFile) return;

                const targetSize = parseFloat(document.getElementById('targetSize').value);
                const unit = document.getElementById('sizeUnit').value;
                
                if (!targetSize || targetSize <= 0) {
                    this.showError('请输入有效的目标大小');
                    return;
                }

                const targetBytes = unit === 'MB' ? targetSize * 1024 * 1024 : targetSize * 1024;
                
                if (targetBytes >= this.currentFile.size) {
                    this.showError('目标大小应小于原始文件大小');
                    return;
                }

                this.showLoading();
                this.hideError();

                try {
                    const compressedBlob = await this.performCompression(this.currentFile, targetBytes);
                    this.compressedBlob = compressedBlob;
                    this.showResults(compressedBlob);
                    this.showCompressedPreview(compressedBlob);
                } catch (error) {
                    this.showError('压缩失败：' + error.message);
                } finally {
                    this.hideLoading();
                }
            }

            async performCompression(file, targetBytes) {
                return new Promise((resolve, reject) => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const img = new Image();

                    img.onload = () => {
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.drawImage(img, 0, 0);

                        let quality = 0.9;
                        let attempt = 0;
                        const maxAttempts = 10;

                        const tryCompress = () => {
                            canvas.toBlob((blob) => {
                                if (!blob) {
                                    reject(new Error('压缩失败'));
                                    return;
                                }

                                if (blob.size <= targetBytes || attempt >= maxAttempts) {
                                    resolve(blob);
                                } else {
                                    quality -= 0.1;
                                    attempt++;
                                    if (quality < 0.1) {
                                        // 如果质量已经很低，尝试缩小尺寸
                                        const scale = Math.sqrt(targetBytes / blob.size);
                                        canvas.width = img.width * scale;
                                        canvas.height = img.height * scale;
                                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                                        quality = 0.8;
                                    }
                                    setTimeout(tryCompress, 10);
                                }
                            }, 'image/jpeg', quality);
                        };

                        tryCompress();
                    };

                    img.onerror = () => reject(new Error('图片加载失败'));
                    img.src = URL.createObjectURL(file);
                });
            }

            showCompressedPreview(blob) {
                const url = URL.createObjectURL(blob);
                const img = document.getElementById('compressedPreview');
                img.src = url;
                // 显示压缩后预览
                document.getElementById('compressedPreviewItem').classList.add('show');
                document.querySelector('.preview-container').classList.add('two-columns');
            }

            showResults(compressedBlob) {
                const originalSize = this.currentFile.size;
                const compressedSize = compressedBlob.size;
                const ratio = ((originalSize - compressedSize) / originalSize * 100).toFixed(1);

                document.getElementById('compressedSize').textContent = this.formatFileSize(compressedSize);
                document.getElementById('compressionRatio').textContent = `${ratio}%`;

                // 设置下载链接
                const downloadBtn = document.getElementById('downloadBtn');
                const url = URL.createObjectURL(compressedBlob);
                downloadBtn.href = url;
                downloadBtn.download = `compressed_${this.currentFile.name}`;

                document.getElementById('resultArea').classList.add('show');
            }

            formatFileSize(bytes) {
                if (bytes === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }

            showControls() {
                document.getElementById('controls').classList.add('show');
            }

            showLoading() {
                document.getElementById('loading').classList.add('show');
                document.getElementById('compressBtn').disabled = true;
            }

            hideLoading() {
                document.getElementById('loading').classList.remove('show');
                document.getElementById('compressBtn').disabled = false;
            }

            showError(message) {
                const errorElement = document.getElementById('errorMsg');
                errorElement.textContent = message;
                errorElement.classList.add('show');
            }

            hideError() {
                document.getElementById('errorMsg').classList.remove('show');
            }

            hideResults() {
                document.getElementById('resultArea').classList.remove('show');
            }
        }

        // 初始化应用
        document.addEventListener('DOMContentLoaded', () => {
            new ImageCompressor();
        });

        document.addEventListener('DOMContentLoaded', () => {
            const tpl = document.getElementById('site-footer');
            if (tpl && 'content' in tpl) {
            document.body.appendChild(tpl.content.cloneNode(true));
            }

            // 用 data-img 填充 <img src>
            document.querySelectorAll('.qr-wrapper').forEach(w => {
            const link = w.querySelector('.qr-link');
            const img  = w.querySelector('.qr-img');
            if (link && img && link.dataset.img) {
                img.src = link.dataset.img.trim();
            }
            });
        });
    </script>
</body>
</html>
