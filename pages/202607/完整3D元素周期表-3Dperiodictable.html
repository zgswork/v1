<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>完整3D元素周期表</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00dbde, #fc00ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.8;
        }
        
        .periodic-table {
            display: grid;
            grid-template-columns: repeat(18, 1fr);
            gap: 5px;
            margin-bottom: 30px;
        }
        
        .element {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 5px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .element:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            background: rgba(255, 255, 255, 0.2);
        }
        
        .element .number {
            font-size: 0.7rem;
            opacity: 0.7;
        }
        
        .element .symbol {
            font-size: 1.3rem;
            font-weight: bold;
            margin: 5px 0;
        }
        
        .element .name {
            font-size: 0.6rem;
            opacity: 0.8;
        }
        
        .viewer-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        
        .viewer-container.active {
            opacity: 1;
            pointer-events: all;
        }
        
        .viewer-content {
            width: 85%;
            height: 85%;
            background: rgba(30, 30, 50, 0.9);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .viewer-title {
            font-size: 1.8rem;
            font-weight: bold;
        }
        
        .close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(90deg);
        }
        
        .viewer-body {
            display: flex;
            flex: 1;
            gap: 20px;
        }
        
        .model-container {
            flex: 2;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }
        
        #modelCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        .info-panel {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            overflow-y: auto;
        }
        
        .info-item {
            margin-bottom: 15px;
        }
        
        .info-label {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 5px;
        }
        
        .info-value {
            font-size: 1.1rem;
        }
        
        .spacer {
            grid-column: span 14;
        }
        
        .lanthanide-actinide {
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            gap: 5px;
            margin-top: 20px;
        }
        
        .category-1 { background-color: rgba(255, 105, 97, 0.3); }
        .category-2 { background-color: rgba(255, 179, 71, 0.3); }
        .category-3 { background-color: rgba(77, 171, 247, 0.3); }
        .category-4 { background-color: rgba(72, 219, 251, 0.3); }
        .category-5 { background-color: rgba(29, 209, 161, 0.3); }
        .category-6 { background-color: rgba(129, 236, 236, 0.3); }
        .category-7 { background-color: rgba(255, 221, 89, 0.3); }
        .category-8 { background-color: rgba(120, 224, 143, 0.3); }
        .category-9 { background-color: rgba(246, 229, 141, 0.3); }
        .category-10 { background-color: rgba(255, 138, 216, 0.3); }
        .category-11 { background-color: rgba(170, 170, 170, 0.3); }
        
        #helpModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            display: none;
        }
        
        #helpModal .modal-content {
            background: #1a1a2e;
            padding: 25px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            border: 1px solid #444;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        
        #helpModal h2 {
            margin-bottom: 20px;
            color: #fc00ff;
            text-align: center;
        }
        
        #helpModal ul {
            list-style-type: none;
            padding: 0;
            margin-bottom: 25px;
        }
        
        #helpModal li {
            margin-bottom: 12px;
            display: flex;
            align-items: flex-start;
        }
        
        #helpModal li span:first-child {
            background: #fc00ff;
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-right: 12px;
            flex-shrink: 0;
            font-size: 0.9rem;
        }
        
        #helpModal li strong {
            color: #00dbde;
        }
        
        #helpBtn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            margin-top: 15px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        
        #helpBtn:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }
        
        #closeHelp {
            background: linear-gradient(90deg, #00dbde, #fc00ff);
            border: none;
            color: white;
            padding: 10px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
            width: 180px;
        }
        
        #closeHelp:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .loading-fallback {
            color: white;
            text-align: center;
            padding-top: 50px;
        }
        
        @media (max-width: 1200px) {
            .periodic-table {
                grid-template-columns: repeat(9, 1fr);
            }
            
            .lanthanide-actinide {
                grid-template-columns: repeat(9, 1fr);
            }
            
            .viewer-content {
                width: 95%;
                height: 90%;
            }
            
            .viewer-body {
                flex-direction: column;
            }
            
            .model-container {
                min-height: 50%;
            }
        }
        
        @media (max-width: 768px) {
            .periodic-table {
                grid-template-columns: repeat(5, 1fr);
            }
            
            .lanthanide-actinide {
                grid-template-columns: repeat(5, 1fr);
            }
            
            #helpModal .modal-content {
                padding: 20px 15px;
            }
            
            #helpModal li {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>完整3D元素周期表</h1>
            <p class="subtitle">点击元素查看3D原子模型和详细信息 (共118个元素)</p>
            <button id="helpBtn">如何使用3D模型？</button>
            <div id="loadingIndicator" style="display:none; margin-top:10px;">
                <span style="color:#00dbde">加载3D引擎中...</span>
            </div>
        </header>
        
        <div class="periodic-table" id="periodicTable">
            <!-- 主表元素将通过JavaScript动态生成 -->
        </div>
        
        <div class="lanthanide-actinide" id="lanthanideActinide">
            <!-- 镧系和锕系元素将通过JavaScript动态生成 -->
        </div>
    </div>
    
    <!-- 3D模型查看器 -->
    <div class="viewer-container" id="viewerContainer">
        <div class="viewer-content">

                </div>
                <div class="info-panel" id="infoPanel">

                        <div class="info-label">原子序数</div>

                    </div>

                        <div class="info-value" id="atomicSymbol">-</div>
                    </div>

                        <div class="info-label">原子量</div>

                        <div class="info-value" id="state">-</div>

                    <div class="info-item">

                        <div class="info-value" id="density">-</div>

                        <div class="info-value" id="meltingPoint">-</div>

                        <div class="info-value" id="boilingPoint">-</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">电负性</div>
                        <div class="info-value" id="electronegativity">-</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">电子亲和能 (kJ/mol)</div>
                        <div class="info-value" id="electronAffinity">-</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 引导说明弹窗 -->
    <div id="helpModal">
        <div class="modal-content">
            <h2>3D模型交互指南</h2>
            <ul>
                <li>
                    <span>1</span>
                    <span>点击任意元素卡片查看3D原子模型</span>
                </li>

                    <span>2</span>
                    <span><strong>鼠标左键拖动</strong>：旋转原子模型</span>
                </li>
                <li>

                    <span><strong>鼠标滚轮</strong>：缩放模型大小</span>
                </li>
                <li>

                    <span><strong>点击右上角×</strong>：关闭3D视图</span>

            </div>
        </div>
    </div>

            if (e.target.tagName === 'SCRIPT' && e.target.src.includes('three')) {
                document.getElementById('loadingIndicator').textContent = 
                    '3D引擎资源加载失败，请尝试：<br>1. 检查网络连接<br>2. 手动下载资源：<br>&nbsp;&nbsp;- three.min.js: https://unpkg.com/three@0.132.2/build/three.min.js<br>&nbsp;&nbsp;- OrbitControls.js: https://unpkg.com/three@0.132.2/examples/js/controls/OrbitControls.js<br>3. 将文件保存到HTML同一目录<br>4. 修改script标签为本地路径'
            }
        });
    </script>

                document.getElementById('loadingIndicator').textContent = 
                    '3D引擎加载失败，请检查网络连接';
                return false;
            }
            threeJSLoaded = true;
            return true;

            try {
                const canvas = document.createElement('canvas');
                return !!window.WebGLRenderingContext && 
                      (canvas.getContext('webgl') || canvas.getContext('experimental-webgl'));
            } catch (e) {
                return false;
            }

              { number: 115, symbol: "Mc", name: "镆", category: 10, atomicWeight: 290, electronConfig: "[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p³", discoveryYear: 2003, state: "固体", density: 13.5, meltingPoint: 400, boilingPoint: 670, electronegativity: 1.1, electronAffinity: 50 },
              { number: 116, symbol: "Lv", name: "𫟷", category: 10, atomicWeight: 293, electronConfig: "[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p⁴", discoveryYear: 2000, state: "固体", density: 12.9, meltingPoint: 350, boilingPoint: 540, electronegativity: 1.3, electronAffinity: 50 },
              { number: 117, symbol: "Ts", name: "鿬", category: 8, atomicWeight: 294, electronConfig: "[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p⁵", discoveryYear: 2010, state: "固体", density: 7, meltingPoint: 573, boilingPoint: 883, electronegativity: 2.0, electronAffinity: 50 },
              { number: 118, symbol: "Og", name: "鿫", category: 9, atomicWeight: 294, electronConfig: "[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p⁶", discoveryYear: 2002, state: "气体", density: null, meltingPoint: null, boilingPoint: null, electronegativity: null, electronAffinity: null }
        ];
        window.addEventListener('DOMContentLoaded', init);

        // 3D场景变量
        let scene, camera, renderer, controls, electronGroup;
        let currentElement = null;
        let animationId = null;

        // 初始化周期表
        function initPeriodicTable() {
            if (!threeJSLoaded) return;
            
            const table = document.getElementById('periodicTable');
            const lanthanideActinide = document.getElementById('lanthanideActinide');
            
            // 清空表格
            table.innerHTML = '';
            lanthanideActinide.innerHTML = '';
            
            // 创建主表元素 (1-118)
            elements.forEach(element => {
                const el = document.createElement('div');
                el.className = `element category-${element.category}`;
                el.innerHTML = `
                    <div class="number">${element.number}</div>
                    <div class="symbol">${element.symbol}</div>
                    <div class="name">${element.name}</div>
                `;
                el.addEventListener('click', () => showElement(element));
                
                // 将镧系和锕系元素放到单独的区域
                if (element.number >= 57 && element.number <= 71) {
                    lanthanideActinide.appendChild(el);
                } else if (element.number >= 89 && element.number <= 103) {
                    lanthanideActinide.appendChild(el);
                } else {
                    table.appendChild(el);
                }
            });
            
            // 添加间隔元素来正确排列周期表
            const spacer1 = document.createElement('div');
            spacer1.className = 'spacer';
            table.appendChild(spacer1);
        }

        // 显示元素详情和3D模型
        function showElement(element) {
            if (!threeJSLoaded) {
                alert("3D引擎未正确加载，无法显示模型");
                return;
            }
            
            currentElement = element;
            
            // 更新信息面板
            document.getElementById('elementTitle').textContent = `${element.name} (${element.symbol})`;
            document.getElementById('atomicNumber').textContent = element.number;
            document.getElementById('atomicSymbol').textContent = element.symbol;
            document.getElementById('atomicWeight').textContent = element.atomicWeight;
            document.getElementById('electronConfig').textContent = element.electronConfig;
            document.getElementById('discoveryYear').textContent = element.discoveryYear;
            
            // 设置类别名称
            let categoryName = "";
            switch(element.category) {
                case 1: categoryName = "碱金属"; break;
                case 2: categoryName = "碱土金属"; break;
                case 3: categoryName = "过渡金属"; break;
                case 4: categoryName = "镧系元素"; break;
                case 5: categoryName = "锕系元素"; break;
                case 6: categoryName = "类金属"; break;
                case 7: categoryName = "非金属"; break;
                case 8: categoryName = "卤素"; break;
                case 9: categoryName = "稀有气体"; break;
                case 10: categoryName = "后过渡金属"; break;
                case 11: categoryName = "未知性质"; break;
            }
            document.getElementById('category').textContent = categoryName;
            
            document.getElementById('state').textContent = element.state;
            document.getElementById('density').textContent = element.density;
            document.getElementById('meltingPoint').textContent = element.meltingPoint;
            document.getElementById('boilingPoint').textContent = element.boilingPoint;
            document.getElementById('electronegativity').textContent = element.electronegativity || "未知";
            document.getElementById('electronAffinity').textContent = element.electronAffinity || "未知";
            
            // 显示查看器
            document.getElementById('viewerContainer').classList.add('active');
            
            // 初始化3D模型
            init3DModel(element.number);
        }

        // 初始化3D模型
        function init3DModel(atomicNumber) {
            const canvas = document.getElementById('modelCanvas');
            const container = canvas.parentElement;
            
            // 确保容器有正确的尺寸
            container.style.width = '100%';
            container.style.height = '100%';
            canvas.style.width = '100%';
            canvas.style.height = '100%';
            
            // 清除之前的场景
            cleanup3DScene();
            
            try {
                // 创建场景
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x111122);
                
                // 创建相机
                const width = container.clientWidth;
                const height = container.clientHeight;
                camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
                camera.position.z = 30;
                
                // 创建渲染器
                renderer = new THREE.WebGLRenderer({
                    canvas: canvas,
                    antialias: true,
                    alpha: true
                });
                renderer.setSize(width, height);
                renderer.setPixelRatio(window.devicePixelRatio);
                
                // 添加轨道控制
                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                
                // 添加光源
                const ambientLight = new THREE.AmbientLight(0x404040);
                scene.add(ambientLight);
                
                const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
                directionalLight.position.set(1, 1, 1);
                scene.add(directionalLight);
                
                // 创建原子模型
                createAtomModel(atomicNumber);
                
                // 开始动画循环
                animate();
            } catch (error) {
                console.error("初始化3D模型时出错:", error);
                document.querySelector('.model-container').innerHTML = 
                    '<div class="loading-fallback">无法加载3D模型，但您可以查看元素信息</div>';
            }
        }

        // 创建原子模型
        function createAtomModel(atomicNumber) {
            try {
                electronGroup = new THREE.Group();
                scene.add(electronGroup);
                
                // 创建原子核
                const nucleusGeometry = new THREE.SphereGeometry(2, 32, 32);
                const nucleusMaterial = new THREE.MeshPhongMaterial({ 
                    color: 0xff3333, 
                    emissive: 0xaa0000, 
                    emissiveIntensity: 0.2,
                    specular: 0xffffff,
                    shininess: 30
                });
                const nucleus = new THREE.Mesh(nucleusGeometry, nucleusMaterial);
                electronGroup.add(nucleus);
                
                // 根据原子序数创建电子轨道
                const electronCount = Math.min(atomicNumber, 32); // 简化模型，最多显示32个电子
                
                // 计算电子壳层
                const shells = [];
                let remainingElectrons = electronCount;
                let shellNumber = 1;
                
                while (remainingElectrons > 0) {
                    const maxInShell = 2 * shellNumber * shellNumber;
                    const inShell = Math.min(remainingElectrons, maxInShell);
                    shells.push({ number: shellNumber, electrons: inShell });
                    remainingElectrons -= inShell;
                    shellNumber++;
                }
                
                // 创建电子
                shells.forEach(shell => {
                    const radius = shell.number * 5;
                    const angleIncrement = (Math.PI * 2) / shell.electrons;
                    
                    for (let i = 0; i < shell.electrons; i++) {
                        const angle = i * angleIncrement;
                        const x = Math.cos(angle) * radius;
                        const y = Math.sin(angle) * radius;
                        
                        // 添加一些随机性使电子不完全在同一平面
                        const z = (Math.random() - 0.5) * 2;
                        
                        const electronGeometry = new THREE.SphereGeometry(0.5, 16, 16);
                        const electronMaterial = new THREE.MeshPhongMaterial({ 
                            color: 0x3399ff,
                            emissive: 0x0066cc,
                            emissiveIntensity: 0.3,
                            specular: 0xffffff,
                            shininess: 50
                        });
                        const electron = new THREE.Mesh(electronGeometry, electronMaterial);
                        electron.position.set(x, y, z);
                        
                        // 为电子添加动画属性
                        electron.userData = {
                            originalX: x,
                            originalY: y,
                            originalZ: z,
                            speed: 0.01 + Math.random() * 0.02,
                            angle: Math.random() * Math.PI * 2
                        };
                        
                        electronGroup.add(electron);
                    }
                });
            } catch (error) {
                console.error("创建原子模型时出错:", error);
                throw error; // 重新抛出错误以便外层捕获
            }
        }

        // 动画循环
        function animate() {
            animationId = requestAnimationFrame(animate);
            
            try {
                // 更新电子位置
                if (electronGroup) {
                    electronGroup.children.forEach(child => {
                        if (child.userData.originalX !== undefined) {
                            // 电子围绕其原始位置做小幅度运动
                            child.position.x = child.userData.originalX + Math.sin(child.userData.angle) * 0.5;
                            child.position.z = child.userData.originalZ + Math.cos(child.userData.angle) * 0.5;
                            child.userData.angle += child.userData.speed;
                        }
                    });
                }
                
                // 更新轨道控制
                if (controls) {
                    controls.update();
                }
                
                // 渲染场景
                if (renderer && scene && camera) {
                    renderer.render(scene, camera);
                }
            } catch (error) {
                console.error("动画循环出错:", error);
                if (animationId) {
                    cancelAnimationFrame(animationId);
                }
            }
        }

        // 清理3D场景
        function cleanup3DScene() {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            
            if (controls) {
                controls.dispose();
                controls = null;
            }
            
            if (renderer) {
                renderer.dispose();
                renderer = null;
            }
            
            if (scene) {
                while(scene.children.length > 0) { 
                    scene.remove(scene.children[0]); 
                }
                scene = null;
            }
            
            camera = null;
            electronGroup = null;
        }

        // 窗口大小调整处理
        function onWindowResize() {
            if (!camera || !renderer) return;
            
            const canvas = document.getElementById('modelCanvas');
            const container = canvas.parentElement;
            const width = container.clientWidth;
            const height = container.clientHeight;
            
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        // 关闭查看器
        function closeViewer() {
            document.getElementById('viewerContainer').classList.remove('active');
            cleanup3DScene();
        }

        // 初始化帮助模态框
        function initHelpModal() {
            const helpBtn = document.getElementById('helpBtn');
            const helpModal = document.getElementById('helpModal');
            const closeHelp = document.getElementById('closeHelp');
            
            helpBtn.addEventListener('click', function() {
                helpModal.style.display = 'flex';
            });
            
            closeHelp.addEventListener('click', function() {
                helpModal.style.display = 'none';
            });
            
            helpModal.addEventListener('click', function(e) {
                if (e.target === helpModal) {
                    helpModal.style.display = 'none';
                }
            });
        }

        // 初始化Three.js加载
        function initAfterThreeJSLoad() {
            document.getElementById('loadingIndicator').style.display = 'block';
            
            const checkInterval = setInterval(() => {
                if (typeof THREE !== 'undefined') {
                    clearInterval(checkInterval);
                    threeJSLoaded = true;
                    document.getElementById('loadingIndicator').style.display = 'none';
                    initPeriodicTable();
                    
                    document.getElementById('closeBtn').addEventListener('click', closeViewer);
                    window.addEventListener('resize', onWindowResize);
                    initHelpModal();
                }
            }, 100);
            
            setTimeout(() => {
                if (!threeJSLoaded) {
                    clearInterval(checkInterval);
                    document.getElementById('loadingIndicator').innerHTML = 
                        '<span style="color:#ff3333">3D引擎加载失败，请刷新页面或检查网络连接</span>';
                }
            }, 10000); // 10秒超时
        }

        // 初始化应用
        document.addEventListener('DOMContentLoaded', function() {
            initAfterThreeJSLoad();
            
            // 首次访问显示提示
            if (!localStorage.getItem('periodicTableHelpShown')) {
                setTimeout(() => {
                    document.getElementById('helpModal').style.display = 'flex';
                    localStorage.setItem('periodicTableHelpShown', 'true');
                }, 1500);
            }
        });
    </script>
</body>
</html>
