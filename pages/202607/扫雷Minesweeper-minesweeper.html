<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扫雷 Minesweeper</title>
    <style>
        body {
            background: #f0f2f5;
            font-family: 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
        }
        h1 {
            color: #2d8cf0;
            margin-top: 32px;
        }
        #menu, #game {
            margin-top: 32px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.08);
            padding: 32px 40px 40px 40px;
            min-width: 320px;
        }
        #menu button {
            display: block;
            width: 200px;
            margin: 18px auto;
            padding: 12px 0;
            font-size: 20px;
            border: none;
            border-radius: 8px;
            background: #2d8cf0;
            color: #fff;
            cursor: pointer;
            transition: background 0.2s;
        }
        #menu button:hover {
            background: #1a6ed8;
        }
        #game {
            display: none;
            flex-direction: column;
            align-items: center;
        }
        #info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 12px;
            font-size: 18px;
        }
        #board {
            display: grid;
            background: #bdbdbd;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            margin: 0 auto;
        }
        .cell {
            width: 32px;
            height: 32px;
            background: #e0e0e0;
            border: 1px solid #bdbdbd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: background 0.1s;
        }
        .cell.open {
            background: #fff;
            cursor: default;
        }
        .cell.flag {
            color: #e74c3c;
        }
        .cell.mine {
            color: #e74c3c;
        }
        #result {
            margin-top: 18px;
            font-size: 22px;
            font-weight: bold;
        }
        #restart {
            margin-top: 16px;
            padding: 8px 24px;
            font-size: 18px;
            border: none;
            border-radius: 6px;
            background: #2d8cf0;
            color: #fff;
            cursor: pointer;
        }
        #restart:hover {
            background: #1a6ed8;
        }
    </style>
</head>
<body>
    <h1>扫雷 Minesweeper</h1>
    <div id="menu">
        <button data-level="easy">初级 (9x9, 10雷)</button>
        <button data-level="medium">中级 (16x16, 40雷)</button>
        <button data-level="hard">高级 (30x16, 99雷)</button>
    </div>
    <div id="game">
        <div id="info">
            <span id="mines">雷数: 0</span>
            <span id="timer">用时: 0 秒</span>
        </div>
        <div id="board"></div>
        <div id="result"></div>
        <button id="restart">重新开始</button>
    </div>
    <script>
    // 扫雷参数
    const LEVELS = {
        easy: { width: 9, height: 9, mines: 10 },
        medium: { width: 16, height: 16, mines: 40 },
        hard: { width: 30, height: 16, mines: 99 }
    };
    let board = [], visible = [], flagged = [], mineSet = new Set();
    let width = 9, height = 9, mines = 10;
    let gameOver = false, win = false, timer = 0, timerId = null, startTime = null;

    const menu = document.getElementById('menu');
    const game = document.getElementById('game');
    const boardDiv = document.getElementById('board');
    const minesSpan = document.getElementById('mines');
    const timerSpan = document.getElementById('timer');
    const resultDiv = document.getElementById('result');
    const restartBtn = document.getElementById('restart');

    function start(level) {
        width = LEVELS[level].width;
        height = LEVELS[level].height;
        mines = LEVELS[level].mines;
        board = Array.from({length: height}, () => Array(width).fill(0));
        visible = Array.from({length: height}, () => Array(width).fill(false));
        flagged = Array.from({length: height}, () => Array(width).fill(false));
        mineSet = new Set();
        gameOver = false;
        win = false;
        timer = 0;
        startTime = null;
        clearInterval(timerId);
        minesSpan.textContent = `雷数: ${mines}`;
        timerSpan.textContent = `用时: 0 秒`;
        resultDiv.textContent = '';
        // 随机布雷
        let positions = [];
        for (let x = 0; x < width; x++) for (let y = 0; y < height; y++) positions.push([x, y]);
        let minePos = positions.sort(() => Math.random() - 0.5).slice(0, mines);
        for (let [mx, my] of minePos) {
            board[my][mx] = -1;
            mineSet.add(`${mx},${my}`);
        }
        // 计算数字
        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                if (board[y][x] === -1) continue;
                let count = 0;
                for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
                    let nx = x + dx, ny = y + dy;
                    if (nx >= 0 && nx < width && ny >= 0 && ny < height && board[ny][nx] === -1) count++;
                }
                board[y][x] = count;
            }
        }
        // 生成棋盘
        boardDiv.innerHTML = '';
        boardDiv.style.gridTemplateColumns = `repeat(${width}, 32px)`;
        boardDiv.style.gridTemplateRows = `repeat(${height}, 32px)`;
        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.x = x;
                cell.dataset.y = y;
                cell.onmousedown = handleCellClick;
                boardDiv.appendChild(cell);
            }
        }
        // 显示界面
        menu.style.display = 'none';
        game.style.display = 'flex';
    }

    function handleCellClick(e) {
        if (gameOver) return;
        let x = +this.dataset.x, y = +this.dataset.y;
        if (e.button === 2) { // 右键
            if (!visible[y][x]) {
                flagged[y][x] = !flagged[y][x];
                updateBoard();
                updateMinesLeft();
            }
            return false;
        } else if (e.button === 0) { // 左键
            if (!startTime) {
                startTime = Date.now();
                timerId = setInterval(() => {
                    timer = Math.floor((Date.now() - startTime) / 1000);
                    timerSpan.textContent = `用时: ${timer} 秒`;
                }, 1000);
            }
            if (flagged[y][x] || visible[y][x]) return;
            openCell(x, y);
            updateBoard();
            if (gameOver) showAllMines();
            if (checkWin()) {
                win = true;
                gameOver = true;
                clearInterval(timerId);
                resultDiv.textContent = '你赢了！';
                showAllMines();
            }
        }
    }

    function openCell(x, y) {
        if (x < 0 || x >= width || y < 0 || y >= height || visible[y][x] || flagged[y][x]) return;
        visible[y][x] = true;
        if (board[y][x] === -1) {
            gameOver = true;
            clearInterval(timerId);
            resultDiv.textContent = '游戏失败！';
            return;
        }
        if (board[y][x] === 0) {
            for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
                if (dx !== 0 || dy !== 0) openCell(x + dx, y + dy);
            }
        }
    }

    function updateBoard() {
        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                let idx = y * width + x;
                let cell = boardDiv.children[idx];
                cell.oncontextmenu = e => e.preventDefault();
                cell.className = 'cell';
                if (visible[y][x]) {
                    cell.classList.add('open');
                    if (board[y][x] === -1) {
                        cell.classList.add('mine');
                        cell.textContent = '💣';
                    } else if (board[y][x] > 0) {
                        cell.textContent = board[y][x];
                        cell.style.color = ['#1976d2','#388e3c','#d32f2f','#512da8','#c62828','#00838f','#000','#888'][board[y][x]-1];
                    } else {
                        cell.textContent = '';
                    }
                } else if (flagged[y][x]) {
                    cell.classList.add('flag');
                    cell.textContent = '🚩';
                } else {
                    cell.textContent = '';
                }
            }
        }
    }

    function showAllMines() {
        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                if (board[y][x] === -1) visible[y][x] = true;
            }
        }
        updateBoard();
    }

    function checkWin() {
        for (let y = 0; y < height; y++)
            for (let x = 0; x < width; x++)
                if (board[y][x] !== -1 && !visible[y][x]) return false;
        return true;
    }

    function updateMinesLeft() {
        let flaggedCount = flagged.flat().filter(Boolean).length;
        minesSpan.textContent = `雷数: ${mines - flaggedCount}`;
    }

    // 事件绑定
    document.querySelectorAll('#menu button').forEach(btn => {
        btn.onclick = () => start(btn.dataset.level);
    });
    restartBtn.onclick = () => start(Object.keys(LEVELS).find(lv => LEVELS[lv].width === width && LEVELS[lv].height === height && LEVELS[lv].mines === mines));
    // 禁止右键菜单
    boardDiv.oncontextmenu = e => e.preventDefault();
    </script>
</body>
</html>
