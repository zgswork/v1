<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>渐变背景生成器</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --text: #1f2328;
      --card: #ffffff;
      --muted: #6a737d;
      --accent: #3b82f6;
      --accent-2: #10b981;
      --border: #e5e7eb;
      --shadow: 0 1px 2px rgba(0,0,0,0.08), 0 8px 24px rgba(0,0,0,0.06);
    }
    [data-theme="dark"] {
      --bg: #0b0f14;
      --text: #e5e7eb;
      --card: #111827;
      --muted: #9aa0a6;
      --accent: #60a5fa;
      --accent-2: #34d399;
      --border: #1f2937;
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 24px rgba(0,0,0,0.25);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Noto Sans", sans-serif;
      line-height: 1.5;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .title { font-size: 18px; font-weight: 600; }
    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      box-shadow: var(--shadow);
    }
    .btn:active { transform: translateY(1px); }
    .btn.primary { border-color: transparent; background: var(--accent); color: #fff; }
    .btn.success { border-color: transparent; background: var(--accent-2); color: #fff; }
    .btn.icon { display: inline-flex; align-items: center; gap: 6px; }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    @media (min-width: 900px) {
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 16px;
    }
    .section-title { font-weight: 600; margin-bottom: 10px; }
    .row { display: grid; grid-template-columns: 140px 1fr; gap: 12px; align-items: center; margin: 10px 0; }
    .row .label { color: var(--muted); }
    .row input[type="range"] { width: 100%; }
    .row input[type="text"], .row select, .row textarea {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 14px;
    }
    .colors {
      display: flex; flex-direction: column; gap: 8px;
    }
    .stop {
      display: grid;
      grid-template-columns: 40px 1fr 70px 70px;
      gap: 8px;
      align-items: center;
    }
    .stop input[type="color"] { width: 40px; height: 40px; padding: 0; border: none; background: transparent; }
    .stop .pos { display: grid; grid-template-columns: 1fr auto 1fr auto; column-gap: 8px; row-gap: 6px; align-items: center; }
    .stop .pos input[type="range"] { width: 100%; min-width: 140px; }

    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

    .preview {
      height: 260px;
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
      position: relative;
      box-shadow: var(--shadow);
    }
    .preview::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,0.28) 0, transparent 60%),
        radial-gradient(circle at 85% 80%, rgba(0,0,0,0.08) 0, transparent 60%);
      pointer-events: none;
    }
    .preview-grid {
      position: absolute; inset: 0;
      background-size: 20px 20px;
      background-image: linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px), linear-gradient(180deg, rgba(0,0,0,0.04) 1px, transparent 1px);
      opacity: 0.5;
      mix-blend-mode: soft-light;
      pointer-events: none;
    }

    .code { height: 140px; width: 100%; }
    .footer-note { color: var(--muted); font-size: 12px; margin-top: 8px; }

    .apply-toggle { display: inline-flex; align-items: center; gap: 8px; }
    .kbd { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 12px; background: rgba(127,127,127,0.12); border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px; }
    input.kbd { width: 64px; text-align: right; }

    /* 小屏优化 */
    @media (max-width: 480px) {
      .row { grid-template-columns: 1fr; }
      .stop { grid-template-columns: 40px 1fr 70px; }
      /* 在小屏上将每个滑块与数字输入分两行显示，避免拥挤 */
      .stop .pos { grid-template-columns: 1fr auto; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="title">🎨 渐变背景生成器</div>
    <div class="theme-toggle">
      <button class="btn icon" id="themeBtn" title="切换主题">
        <span id="themeIcon">🌞</span>
        <span id="themeText">浅色</span>
      </button>
    </div>
  </header>

  <main class="container">
    <div class="grid">
      <section class="card" aria-label="控制区">
        <div class="section-title">参数设置</div>

        <div class="row">
          <div class="label">类型</div>
          <div>
            <select id="type">
              <option value="linear">线性渐变 linear-gradient</option>
              <option value="radial">径向渐变 radial-gradient</option>
              <option value="conic">锥形渐变 conic-gradient</option>
            </select>
          </div>
        </div>

        <div class="row" id="angleRow">
          <div class="label">角度</div>
          <div class="pos">
            <input type="range" id="angle" min="0" max="360" value="45" />
            <input type="number" class="kbd" id="angleValInput" min="0" max="360" step="1" value="45" />
          </div>
        </div>

        <div class="row" id="dirRow">
          <div class="label">方向预设</div>
          <div>
            <select id="dirPreset">
              <option value="45">↗ 45°</option>
              <option value="0">→ 0°</option>
              <option value="90">↑ 90°</option>
              <option value="135">↖ 135°</option>
              <option value="180">← 180°</option>
              <option value="225">↙ 225°</option>
              <option value="270">↓ 270°</option>
              <option value="315">↘ 315°</option>
            </select>
          </div>
        </div>

        <div class="row" id="shapeRow" style="display:none;">
          <div class="label">形状</div>
          <div>
            <select id="shape">
              <option value="ellipse">椭圆 ellipse</option>
              <option value="circle">圆形 circle</option>
            </select>
          </div>
        </div>

        <div class="row" id="centerRow" style="display:none;">
          <div class="label">中心位置</div>
          <div class="pos">
            <input type="range" id="centerX" min="0" max="100" value="50" />
            <span class="kbd" id="centerXVal">X 50%</span>
            <input type="range" id="centerY" min="0" max="100" value="50" />
            <span class="kbd" id="centerYVal">Y 50%</span>
          </div>
        </div>

        <div class="row" id="startAngleRow" style="display:none;">
          <div class="label">起始角度</div>
          <div class="pos">
            <input type="range" id="startAngle" min="0" max="360" value="0" />
            <span class="kbd" id="startAngleVal">0°</span>
          </div>
        </div>

        <div class="row">
          <div class="label">颜色停靠点</div>
          <div class="colors" id="stops">
            <!-- 动态填充颜色停靠点 -->
          </div>
        </div>

        <div class="actions">
          <button class="btn" id="addStop">添加颜色</button>
          <button class="btn" id="randomBtn">随机渐变</button>
          <button class="btn" id="reverseBtn">反转颜色</button>
          <label class="apply-toggle">
            <input type="checkbox" id="applyToPage" /> 应用到页面背景
          </label>
        </div>
      </section>

      <section class="card" aria-label="预览与代码">
        <div class="section-title">预览</div>
        <div class="preview" id="preview">
          <div class="preview-grid"></div>
        </div>

        <div class="section-title" style="margin-top:12px;">CSS 代码</div>
        <textarea class="code" id="code" readonly></textarea>
        <div class="actions">
          <button class="btn primary" id="copyBtn">复制 CSS</button>
          <button class="btn" id="copyLinkBtn">复制链接</button>
          <button class="btn" id="exportPngBtn">导出 PNG</button>
          <button class="btn success" id="resetBtn">重置</button>
        </div>
        <div class="footer-note">提示：将代码复制到你的样式文件或在线编辑器即可使用。</div>
      </section>
    </div>
  </main>

  <script>
    // 主题切换与持久化
    const themeBtn = document.getElementById('themeBtn');
    const themeIcon = document.getElementById('themeIcon');
    const themeText = document.getElementById('themeText');
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const savedTheme = localStorage.getItem('gbg-theme');
    const setTheme = (mode) => {
      document.documentElement.setAttribute('data-theme', mode);
      themeIcon.textContent = mode === 'dark' ? '🌙' : '🌞';
      themeText.textContent = mode === 'dark' ? '深色' : '浅色';
      localStorage.setItem('gbg-theme', mode);
    };
    setTheme(savedTheme ? savedTheme : (prefersDark ? 'dark' : 'light'));
    themeBtn.addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      setTheme(next);
    });

    // 渐变逻辑
    const typeEl = document.getElementById('type');
    const angleRow = document.getElementById('angleRow');
    const angleEl = document.getElementById('angle');
    const angleValInput = document.getElementById('angleValInput');
    const dirRow = document.getElementById('dirRow');
    const dirPreset = document.getElementById('dirPreset');
    const shapeRow = document.getElementById('shapeRow');
    const shapeEl = document.getElementById('shape');
    const centerRow = document.getElementById('centerRow');
    const centerXEl = document.getElementById('centerX');
    const centerYEl = document.getElementById('centerY');
    const centerXValEl = document.getElementById('centerXVal');
    const centerYValEl = document.getElementById('centerYVal');
    const startAngleRow = document.getElementById('startAngleRow');
    const startAngleEl = document.getElementById('startAngle');
    const startAngleValEl = document.getElementById('startAngleVal');
    const stopsEl = document.getElementById('stops');
    const previewEl = document.getElementById('preview');
    const codeEl = document.getElementById('code');
    const addStopBtn = document.getElementById('addStop');
    const randomBtn = document.getElementById('randomBtn');
    const reverseBtn = document.getElementById('reverseBtn');
    const copyBtn = document.getElementById('copyBtn');
    const copyLinkBtn = document.getElementById('copyLinkBtn');
    const exportPngBtn = document.getElementById('exportPngBtn');
    const resetBtn = document.getElementById('resetBtn');
    const applyToPageEl = document.getElementById('applyToPage');

    let stops = [
      { color: '#ff7b7b', pos: 0, alpha: 100 },
      { color: '#7bbcff', pos: 100, alpha: 100 },
    ];

    function hexToRgb(hex) {
      const h = hex.replace('#','');
      const bigint = parseInt(h, 16);
      const r = (bigint >> 16) & 255;
      const g = (bigint >> 8) & 255;
      const b = bigint & 255;
      return `${r}, ${g}, ${b}`;
    }

    function renderStops() {
      stopsEl.innerHTML = '';
      stops.forEach((s, idx) => {
        const row = document.createElement('div');
        row.className = 'stop';
        row.innerHTML = `
          <input type="color" value="${s.color}" aria-label="颜色选择${idx+1}" />
          <div class="pos">
            <input type="range" min="0" max="100" value="${s.pos}" aria-label="位置${idx+1}" />
            <input type="number" class="kbd" min="0" max="100" step="1" value="${s.pos}" aria-label="位置值${idx+1}" />
            <input type="range" min="0" max="100" value="${s.alpha ?? 100}" aria-label="透明度${idx+1}" />
            <input type="number" class="kbd" min="0" max="100" step="1" value="${s.alpha ?? 100}" aria-label="透明度值${idx+1}" />
          </div>
          <button class="btn" aria-label="上移">上移</button>
          <button class="btn" aria-label="删除">删除</button>
        `;

        const colorInput = row.children[0];
        const rangeWrap = row.children[1];
        const rangeInputs = rangeWrap.querySelectorAll('input[type="range"]');
        const numInputs = rangeWrap.querySelectorAll('input[type="number"].kbd');
        const upBtn = row.children[2];
        const delBtn = row.children[3];

        colorInput.addEventListener('input', (e) => {
          stops[idx].color = e.target.value;
          update();
        });
        rangeInputs[0].addEventListener('input', (e) => {
          stops[idx].pos = Number(e.target.value);
          numInputs[0].value = String(stops[idx].pos);
          update();
        });
        rangeInputs[1].addEventListener('input', (e) => {
          stops[idx].alpha = Number(e.target.value);
          numInputs[1].value = String(stops[idx].alpha);
          update();
        });

        numInputs[0].addEventListener('input', (e) => {
          const val = Math.max(0, Math.min(100, parseInt(e.target.value || '0', 10)));
          stops[idx].pos = val;
          rangeInputs[0].value = String(val);
          e.target.value = String(val);
          update();
        });
        numInputs[1].addEventListener('input', (e) => {
          const val = Math.max(0, Math.min(100, parseInt(e.target.value || '0', 10)));
          stops[idx].alpha = val;
          rangeInputs[1].value = String(val);
          e.target.value = String(val);
          update();
        });
        upBtn.addEventListener('click', () => {
          if (idx > 0) {
            const tmp = stops[idx-1];
            stops[idx-1] = stops[idx];
            stops[idx] = tmp;
            renderStops();
            update();
          }
        });
        delBtn.addEventListener('click', () => {
          if (stops.length > 2) {
            stops.splice(idx, 1);
            renderStops();
            update();
          }
        });

        stopsEl.appendChild(row);
      });
    }

    function gradientString() {
      const type = typeEl.value;
      const parts = stops
        .sort((a,b) => a.pos - b.pos)
        .map(s => {
          const rgb = hexToRgb(s.color);
          const a = (s.alpha ?? 100) / 100;
          return `rgba(${rgb}, ${a}) ${s.pos}%`;
        })
        .join(', ');
      if (type === 'linear') {
        const ang = Number(angleEl.value);
        return `linear-gradient(${ang}deg, ${parts})`;
      } else if (type === 'radial') {
        const shape = shapeEl.value || 'ellipse';
        const cx = Number(centerXEl.value);
        const cy = Number(centerYEl.value);
        return `radial-gradient(${shape} at ${cx}% ${cy}%, ${parts})`;
      } else {
        const start = Number(startAngleEl.value);
        const cx = Number(centerXEl.value);
        const cy = Number(centerYEl.value);
        return `conic-gradient(from ${start}deg at ${cx}% ${cy}%, ${parts})`;
      }
    }

    function update() {
      angleValInput.value = String(angleEl.value);
      centerXValEl.textContent = `X ${centerXEl.value}%`;
      centerYValEl.textContent = `Y ${centerYEl.value}%`;
      startAngleValEl.textContent = `${startAngleEl.value}°`;
      const g = gradientString();
      previewEl.style.backgroundImage = g;
      const css = `/* 背景渐变 */\nbackground-image: ${g};\nbackground-attachment: fixed;\nbackground-size: cover;\n\n/* 可选的兼容前缀（现代浏览器多数无需） */\n/* background-image: -webkit-${g}; */\n\n/* 示例：整页应用 */\n/* body { min-height: 100vh; ${applyToPageEl.checked ? `background-image: ${g};` : ''} } */`;
      codeEl.value = css;
      if (applyToPageEl.checked) {
        document.body.style.backgroundImage = g;
        document.body.style.backgroundAttachment = 'fixed';
        document.body.style.backgroundSize = 'cover';
      } else {
        document.body.style.backgroundImage = '';
      }
    }

    function syncTypeVisibility(){
      const t = typeEl.value;
      const isLinear = t === 'linear';
      const isRadial = t === 'radial';
      const isConic = t === 'conic';
      angleRow.style.display = isLinear ? '' : 'none';
      dirRow.style.display = isLinear ? '' : 'none';
      shapeRow.style.display = isRadial ? '' : 'none';
      centerRow.style.display = (isRadial || isConic) ? '' : 'none';
      startAngleRow.style.display = isConic ? '' : 'none';
    }
    typeEl.addEventListener('change', () => { syncTypeVisibility(); update(); });
    angleEl.addEventListener('input', update);
    angleValInput.addEventListener('input', (e) => {
      const raw = String(e.target.value || '0').replace(/[^\d]/g, '');
      const val = Math.max(0, Math.min(360, parseInt(raw || '0', 10)));
      angleEl.value = String(val);
      e.target.value = String(val);
      update();
    });
    shapeEl.addEventListener('change', update);
    centerXEl.addEventListener('input', update);
    centerYEl.addEventListener('input', update);
    startAngleEl.addEventListener('input', update);
    dirPreset.addEventListener('change', () => { angleEl.value = dirPreset.value; update(); });
    applyToPageEl.addEventListener('change', update);

    addStopBtn.addEventListener('click', () => {
      if (stops.length >= 8) return alert('最多支持 8 个颜色停靠点');
      // 自动插入在末尾位置
      const lastPos = stops.length ? stops[stops.length-1].pos : 100;
      const nextPos = Math.min(100, lastPos + Math.round(100 / (stops.length+1)));
      const randomColor = `#${Math.floor(Math.random()*16777215).toString(16).padStart(6,'0')}`;
      stops.push({ color: randomColor, pos: nextPos, alpha: 100 });
      renderStops();
      update();
    });

    randomBtn.addEventListener('click', () => {
      const type = Math.random() > 0.5 ? 'linear' : 'radial';
      typeEl.value = type;
      angleRow.style.display = type === 'linear' ? '' : 'none';
      shapeRow.style.display = type === 'linear' ? 'none' : '';
      if (type === 'linear') angleEl.value = Math.floor(Math.random()*360);
      const n = Math.floor(Math.random()*3) + 2; // 2-4色
      stops = Array.from({length: n}, (_, i) => {
        const color = `#${Math.floor(Math.random()*16777215).toString(16).padStart(6,'0')}`;
        const pos = Math.round((i/(n-1))*100);
        return { color, pos, alpha: 100 };
      });
      renderStops();
      update();
    });

    reverseBtn.addEventListener('click', () => {
      stops = stops.map(s => ({...s, pos: 100 - s.pos})).reverse();
      renderStops();
      update();
    });

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(codeEl.value);
        copyBtn.textContent = '已复制!';
        setTimeout(() => copyBtn.textContent = '复制 CSS', 1200);
      } catch (e) {
        alert('复制失败，请手动选择文本复制。');
      }
    });

    function serializeConfig(){
      const p = new URLSearchParams();
      p.set('type', typeEl.value);
      p.set('angle', angleEl.value);
      p.set('shape', shapeEl.value);
      p.set('cx', centerXEl.value);
      p.set('cy', centerYEl.value);
      p.set('start', startAngleEl.value);
      p.set('apply', applyToPageEl.checked ? '1':'0');
      const s = stops.map(st => `${st.color.slice(1)}-${st.alpha ?? 100}-${st.pos}`).join('_');
      p.set('stops', s);
      return p.toString();
    }
    function parseConfig(){
      const sp = new URLSearchParams(location.search);
      if(!sp.has('type')) return;
      typeEl.value = sp.get('type');
      if(sp.get('angle')) angleEl.value = sp.get('angle');
      if(sp.get('shape')) shapeEl.value = sp.get('shape');
      if(sp.get('cx')) centerXEl.value = sp.get('cx');
      if(sp.get('cy')) centerYEl.value = sp.get('cy');
      if(sp.get('start')) startAngleEl.value = sp.get('start');
      if(sp.get('apply')) applyToPageEl.checked = sp.get('apply')==='1';
      const s = sp.get('stops');
      if(s){
        stops = s.split('_').map(tok => {
          const [hex,a,pos] = tok.split('-');
          return { color: `#${hex}`, alpha: Number(a), pos: Number(pos) };
        });
      }
    }
    copyLinkBtn.addEventListener('click', async () => {
      const qs = serializeConfig();
      const url = `${location.origin}${location.pathname}?${qs}`;
      history.replaceState(null, '', `?${qs}`);
      try {
        await navigator.clipboard.writeText(url);
        copyLinkBtn.textContent = '链接已复制!';
        setTimeout(() => copyLinkBtn.textContent = '复制链接', 1200);
      } catch (e) {
        alert('复制失败，请手动复制地址栏链接。');
      }
    });

    exportPngBtn.addEventListener('click', () => {
      const w = 1600, h = 900;
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      const type = typeEl.value;
      let grd;
      if(type==='linear'){
        const ang = Number(angleEl.value) * Math.PI/180;
        const cx = w/2, cy = h/2;
        const L = Math.hypot(w,h);
        const dx = Math.cos(ang) * L/2;
        const dy = Math.sin(ang) * L/2;
        grd = ctx.createLinearGradient(cx-dx, cy-dy, cx+dx, cy+dy);
      } else if(type==='radial'){
        const cxp = Number(centerXEl.value)/100 * w;
        const cyp = Number(centerYEl.value)/100 * h;
        const r = Math.hypot(w,h)/2;
        grd = ctx.createRadialGradient(cxp, cyp, 0, cxp, cyp, r);
      } else if(type==='conic'){
        if(typeof ctx.createConicGradient === 'function'){
          const start = Number(startAngleEl.value) * Math.PI/180;
          const cxp = Number(centerXEl.value)/100 * w;
          const cyp = Number(centerYEl.value)/100 * h;
          grd = ctx.createConicGradient(start, cxp, cyp);
        } else {
          alert('当前浏览器不支持锥形渐变导出PNG，将改用线性导出预览。');
          const ang = Number(angleEl.value) * Math.PI/180;
          const cx = w/2, cy = h/2;
          const L = Math.hypot(w,h);
          const dx = Math.cos(ang) * L/2;
          const dy = Math.sin(ang) * L/2;
          grd = ctx.createLinearGradient(cx-dx, cy-dy, cx+dx, cy+dy);
        }
      }
      const sorted = [...stops].sort((a,b)=>a.pos-b.pos);
      sorted.forEach(s => {
        const rgb = hexToRgb(s.color);
        const a = (s.alpha ?? 100)/100;
        grd.addColorStop(s.pos/100, `rgba(${rgb}, ${a})`);
      });
      ctx.fillStyle = grd;
      ctx.fillRect(0,0,w,h);
      const url = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = url;
      a.download = `gradient-${type}.png`;
      a.click();
    });

    resetBtn.addEventListener('click', () => {
      typeEl.value = 'linear';
      angleEl.value = 45;
      centerXEl.value = 50;
      centerYEl.value = 50;
      startAngleEl.value = 0;
      stops = [
        { color: '#ff7b7b', pos: 0, alpha: 100 },
        { color: '#7bbcff', pos: 100, alpha: 100 },
      ];
      renderStops();
      syncTypeVisibility();
      update();
    });

    // 初始化
    parseConfig();
    renderStops();
    syncTypeVisibility();
    update();
  </script>
</body>
</html>
