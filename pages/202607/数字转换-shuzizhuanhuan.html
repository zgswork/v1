<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>数字转换</title>
  <style>
    :root {
      --bg: #0e1012;
      --card: #161a1f;
      --text: #e6eef7;
      --muted: #9fb2c8;
      --accent: #4da3ff;
      --accent-2: #6ed19e;
      --danger: #ff6d6d;
      --border: #29313a;
      --shadow: 0 8px 24px rgba(0,0,0,0.35);
    }

    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: radial-gradient(1200px 800px at 20% 0%, #0b0d10, var(--bg));
      color: var(--text);
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .logo {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #8fd3ff);
      box-shadow: var(--shadow);
    }
    h1 { font-size: 22px; margin: 0; letter-spacing: 0.5px; }
    .subtitle { color: var(--muted); font-size: 13px; }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }
    .input {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 16px;
      outline: none;
      width: 100%;
    }
    .btn {
      background: var(--accent);
      color: #07121f;
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(77,163,255,0.35);
    }
    .btn.secondary { background: #243142; color: var(--text); box-shadow: none; border: 1px solid var(--border); }

    .helper-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
    .helper { font-size: 12px; color: var(--muted); }
    .badge { font-size: 11px; color: #07121f; background: var(--accent-2); border-radius: 999px; padding: 4px 8px; }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-top: 16px;
    }
    @media (min-width: 720px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }

    .result-card { position: relative; }
    .result-title { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
    .result-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      min-height: 56px;
      line-height: 1.6;
      word-break: break-word;
      font-size: 15px;
    }
    .result-actions { display: flex; gap: 8px; margin-top: 8px; }
    .small-btn { background: #243142; color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; font-size: 12px; cursor: pointer; }

    .error { color: var(--danger); font-size: 12px; margin-top: 6px; }
    footer { margin-top: 28px; color: var(--muted); font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo"></div>
      <div>
        <h1>数字转换</h1>
        <div class="subtitle">输入阿拉伯数字，转换为汉字大写、英文拼写、罗马数字</div>
      </div>
    </header>

    <section class="card">
      <div class="input-row">
        <input id="inputNumber" class="input" type="text" inputmode="decimal" placeholder="例如：12345 或 -12.34 或 Ⅳ" />
        <button id="convertBtn" class="btn">转换</button>
      </div>
      <div class="helper-row">
        <div class="helper">支持负号、小数点；会自动忽略空格与逗号。</div>
        <div class="badge">桌面 / 手机 均可用</div>
        <button id="clearBtn" class="small-btn" title="清空">清空</button>
        <label class="small-btn" style="cursor: pointer; user-select:none;">
          <input id="readZeroToggle" type="checkbox" style="vertical-align: middle; margin-right:6px;" /> 是否读零
        </label>
      </div>
      <div id="errorMsg" class="error" aria-live="polite"></div>
    </section>

    <section class="grid">
      <div class="card result-card">
        <div class="result-title">汉字大写（整数加“元整”，小数含“点”）</div>
        <div id="cnUpper" class="result-box"></div>
        <div class="result-actions">
          <button class="small-btn" data-copy="cnUpper">复制</button>
        </div>
      </div>

      <div class="card result-card">
        <div class="result-title">英文拼写（含小数读作 point）</div>
        <div id="enWords" class="result-box"></div>
        <div class="result-actions">
          <button class="small-btn" data-copy="enWords">复制</button>
        </div>
      </div>

      <div class="card result-card">
        <div class="result-title">罗马数字（1–3999）</div>
        <div id="roman" class="result-box"></div>
        <div class="result-actions">
          <button class="small-btn" data-copy="roman">复制</button>
        </div>
      </div>
    </section>

    <footer>© 数字转换 | 本页为单文件实现，可离线保存使用</footer>
  </div>

  <script>
    // 解析与规范化输入
    function normalizeInput(raw) {
      if (raw == null) return '';
      const s = String(raw)
        .trim()
        .replace(/[，,\s]+/g, '')
        .replace(/^[＋+]/, '') // 去掉前导加号
        .toUpperCase();

      // 如果是罗马数字（纯 I V X L C D M），尝试转换为阿拉伯数字
      if (/^[IVXLCDM]+$/.test(s)) {
        const v = romanToNumber(s);
        return Number.isFinite(v) ? String(v) : s; // 无效则保留原样，后续会报错
      }

      // 允许负号与一个小数点，其余必须为数字
      if (!/^[-]?\d*(?:\.\d+)?$/.test(s)) return s; // 返回原始以便错误提示
      // 去掉开头的多余0（保留单个0），以及小数点规范
      let cleaned = s;
      if (cleaned.startsWith('-')) {
        cleaned = '-' + cleaned.slice(1).replace(/^0+(?=\d)/, '');
      } else {
        cleaned = cleaned.replace(/^0+(?=\d)/, '');
      }
      return cleaned.length ? cleaned : '0';
    }

    // 汉字大写（金融大写），支持负数与小数（小数部分逐位读）
    // 读零模式（插入“零”作为占位）
    function toChineseUpperReadZero(numStr) {
      if (!/^[-]?\d*(?:\.\d+)?$/.test(numStr)) return '';
      const digits = ['零','壹','贰','叁','肆','伍','陆','柒','捌','玖'];
      const unitsSmall = ['仟','佰','拾',''];
      const unitsBig = ['','万','亿','兆'];
      const sign = numStr.startsWith('-') ? '负' : '';
      const [intRaw, decRaw = ''] = numStr.replace('-','').split('.');

      if (intRaw === '' || /^0+$/.test(intRaw)) {
        const intPart = '零';
        const decPart = decRaw ? '点' + decRaw.split('').map(d => digits[+d]).join('') : '';
        return sign + intPart + (decPart ? decPart : '元整');
      }

      let s = intRaw;
      const groups = [];
      while (s.length > 0) { groups.unshift(s.slice(-4)); s = s.slice(0, -4); }
      const unitsCount = groups.length;

      function processGroup(g) {
        const pad = g.padStart(4, '0');
        let out = '';
        for (let i = 0; i < 4; i++) {
          const n = +pad[i];
          if (n === 0) {
            if (!out.endsWith('零') && /[1-9]/.test(pad.slice(i+1))) out += '零';
          } else {
            out += digits[n] + unitsSmall[i];
          }
        }
        return out.replace(/零+$/,'');
      }

      let intOut = '';
      groups.forEach((g, idx) => {
        const p = processGroup(g);
        if (p) intOut += p + unitsBig[unitsCount - idx - 1];
        else if (!intOut.endsWith('零') && groups.slice(idx+1).some(x => /[1-9]/.test(x))) intOut += '零';
      });
      intOut = intOut.replace(/零+/g, '零');

      const decOut = decRaw ? '点' + decRaw.split('').map(d => digits[+d]).join('') : '';
      return sign + intOut + (decOut ? decOut : '元整');
    }

    // 不读零模式（仅输出非零位）
    function toChineseUpperNoZero(numStr) {
      if (!/^[-]?\d*(?:\.\d+)?$/.test(numStr)) return '';
      const digits = ['零','壹','贰','叁','肆','伍','陆','柒','捌','玖'];
      const unitsSmall = ['仟','佰','拾',''];
      const unitsBig = ['','万','亿','兆'];
      const sign = numStr.startsWith('-') ? '负' : '';
      const [intRaw, decRaw = ''] = numStr.replace('-','').split('.');

      let intOut = '';
      if (!(intRaw === '' || /^0+$/.test(intRaw))) {
        let s = intRaw;
        const groups = [];
        while (s.length > 0) { groups.unshift(s.slice(-4)); s = s.slice(0, -4); }
        const total = groups.length;
        groups.forEach((g, idx) => {
          const pad = g.padStart(4, '0');
          let part = '';
          for (let i = 0; i < 4; i++) { const n = +pad[i]; if (n) part += digits[n] + unitsSmall[i]; }
          if (part) intOut += part + unitsBig[total - idx - 1];
        });
      }

      const decOut = decRaw ? ('点' + decRaw.split('').filter(d => d !== '0').map(d => digits[+d]).join('')) : '';
      const base = (intOut ? intOut : '');
      return sign + base + (decOut ? decOut : '元整');
    }

    function toChineseUpper(numStr, readZero) {
      return readZero ? toChineseUpperReadZero(numStr) : toChineseUpperNoZero(numStr);
    }

    // 英文拼写（支持负数与小数；小数逐位读作 point）
    function toEnglishWords(numStr) {
      if (!/^[-]?\d*(?:\.\d+)?$/.test(numStr)) return '';
      const sign = numStr.startsWith('-') ? 'minus ' : '';
      const [intRaw, decRaw = ''] = numStr.replace('-','').split('.');

      if (intRaw === '' || /^0+$/.test(intRaw)) {
        const intPart = 'zero';
        const decPart = decRaw ? ' point ' + decRaw.split('').map(d => EN_DIGITS[+d]).join(' ') : '';
        return (sign + intPart + decPart).trim();
      }

      const intVal = BigInt(intRaw);
      const scales = ['',' thousand',' million',' billion',' trillion'];

      let s = intRaw;
      const chunks = [];
      while (s.length > 0) {
        chunks.unshift(+s.slice(-3));
        s = s.slice(0, -3);
      }

      let words = [];
      const total = chunks.length;
      chunks.forEach((n, idx) => {
        if (n > 0) {
          words.push(chunkToEnglish(n) + scales[total - idx - 1]);
        }
      });

      const intOut = words.join(' ').replace(/\s+/g, ' ').trim();
      const decOut = decRaw ? ' point ' + decRaw.split('').map(d => EN_DIGITS[+d]).join(' ') : '';
      return (sign + intOut + decOut).trim();
    }

    const EN_DIGITS = ['zero','one','two','three','four','five','six','seven','eight','nine'];
    const EN_TEENS = ['ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
    const EN_TENS = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];

    function chunkToEnglish(n) { // 0..999
      const h = Math.floor(n/100), t = Math.floor(n%100/10), o = n%10;
      let res = '';
      if (h) res += EN_DIGITS[h] + ' hundred';
      const tail = n % 100;
      if (tail) {
        if (res) res += ' ';
        if (tail < 10) res += EN_DIGITS[tail];
        else if (tail < 20) res += EN_TEENS[tail - 10];
        else res += EN_TENS[t] + (o ? '-' + EN_DIGITS[o] : '');
      }
      return res || 'zero';
    }

    // 罗马数字：支持 1..3999，超出范围返回空
    function toRoman(numStr) {
      if (!/^[-]?\d+(?:\.0+)?$/.test(numStr)) return '';
      const n = Number(numStr);
      if (!Number.isFinite(n) || n <= 0 || n >= 4000 || !Number.isInteger(n)) return '';
      const map = [
        [1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']
      ];
      let v = n, out = '';
      for (const [val, sym] of map) {
        while (v >= val) { out += sym; v -= val; }
      }
      return out;
    }

    // 罗马数字转阿拉伯，用于输入兼容（简单校验）
    function romanToNumber(s) {
      const val = {I:1,V:5,X:10,L:50,C:100,D:500,M:1000};
      let sum = 0;
      for (let i = 0; i < s.length; i++) {
        const a = val[s[i]] || 0;
        const b = val[s[i+1]] || 0;
        if (a < b) sum -= a; else sum += a;
      }
      // 简单合法性检查：逆向再转
      const back = toRoman(String(sum));
      return back === s ? sum : NaN;
    }

    // 事件与交互
    const $ = (id) => document.getElementById(id);
    const input = $('inputNumber');
    const cnBox = $('cnUpper');
    const enBox = $('enWords');
    const romanBox = $('roman');
    const errorMsg = $('errorMsg');

    function updateAll() {
      const raw = input.value;
      const normalized = normalizeInput(raw);

      // 判定是否为有效数字
      const isNumeric = /^[-]?\d*(?:\.\d+)?$/.test(normalized);
      const isRomanOnly = /^[IVXLCDM]+$/.test(raw.trim());

      if (!raw.trim()) {
        cnBox.textContent = '';
        enBox.textContent = '';
        romanBox.textContent = '';
        errorMsg.textContent = '';
        return;
      }

      if (!isNumeric && !isRomanOnly) {
        cnBox.textContent = '';
        enBox.textContent = '';
        romanBox.textContent = '';
        errorMsg.textContent = '输入格式不正确：仅支持数字、负号和一个小数点，或有效罗马数字 (IVXLCDM)。';
        return;
      }
      errorMsg.textContent = '';

      const numStr = isRomanOnly ? String(romanToNumber(raw.trim().toUpperCase())) : normalized;
      const readZero = document.getElementById('readZeroToggle').checked;
      cnBox.textContent = toChineseUpper(numStr, readZero) || '（无效或过大）';
      enBox.textContent = toEnglishWords(numStr) || '（无效或过大）';
      const r = toRoman(numStr);
      romanBox.textContent = r || '（罗马数字仅支持 1–3999 的整数）';
    }

    input.addEventListener('input', updateAll);
    document.getElementById('readZeroToggle').addEventListener('change', updateAll);
    document.querySelector('#convertBtn').addEventListener('click', updateAll);
    document.querySelector('#clearBtn').addEventListener('click', () => {
      input.value = '';
      updateAll();
      input.focus();
    });
    document.querySelectorAll('[data-copy]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-copy');
        const text = $(id).textContent.trim();
        if (!text) return;
        try {
          await navigator.clipboard.writeText(text);
          btn.textContent = '已复制';
          setTimeout(() => btn.textContent = '复制', 1200);
        } catch {
          // 兼容处理
          const ta = document.createElement('textarea');
          ta.value = text; document.body.appendChild(ta);
          ta.select(); document.execCommand('copy');
          document.body.removeChild(ta);
          btn.textContent = '已复制';
          setTimeout(() => btn.textContent = '复制', 1200);
        }
      });
    });

    // 初始示例
    input.value = '12345';
    updateAll();
  </script>
</body>
</html>
