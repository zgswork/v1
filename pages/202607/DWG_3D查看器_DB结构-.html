                for (const prop of props) {
                    let valueHtml = '';
                    if (prop.isColor) {
                        valueHtml = `<span class="color-swatch"><span class="swatch" style="background:${prop.value};"></span> ${prop.value}</span>`;
                    } else if (prop.isCoord) {
                        valueHtml = `<span class="coord">${prop.value}</span>`;
                    } else if (typeof prop.rawValue === 'object' && prop.rawValue !== null && !Array.isArray(prop.rawValue)) {
                        valueHtml = `<span class="array-preview">${prop.value}</span>`;
                    } else { valueHtml = prop.value; }
                    html += `<div class="prop-row"><span class="prop-key">${prop.key}</span><span class="prop-value">${valueHtml}</span></div>`;
                }
                if (!html) { html = `<div class="no-entity">此图元无可显示的属性</div>`; }
                modalBody.innerHTML = html;
                entityModal.classList.add('open');
            }
            function closeModal() { entityModal.classList.remove('open'); }
            closeModalBtn.addEventListener('click', closeModal);
            closeModalFooterBtn.addEventListener('click', closeModal);
            entityModal.addEventListener('click', (e) => { if (e.target === entityModal) closeModal(); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && entityModal.classList.contains('open')) { closeModal(); } });
            // ================================================================
            // 16. 图层列表渲染
            // ================================================================
            function renderLayerList() {
                if (!layerMap.size) { layerContainer.innerHTML = `<div class="layer-empty">当前文件无图层</div>`; return; }
                let html = '';
                const sorted = Array.from(layerMap.entries()).sort((a, b) => a[0].localeCompare(b[0]));
                for (const [name, info] of sorted) {
                    const checked = info.visible ? 'checked' : '';
                    html += `<div class="layer-item" data-layer="${name}"><input type="checkbox" ${checked} data-layer="${name}"><span class="layer-color" style="background:${info.color};"></span><span class="layer-name">${name}</span><span class="layer-count">${info.count}</span></div>`;
                }
                layerContainer.innerHTML = html;
                layerContainer.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                    cb.addEventListener('change', function () {
                        const layer = this.dataset.layer;
                        const visible = this.checked;
                        layerVisibility.set(layer, visible);
                        layerMap.get(layer).visible = visible;
                        refreshLayerVisibility();
                    });
                });
            }
            // ================================================================
            // 17. 加载 LibreDWG 库
            // ================================================================
            async function loadLib() {
                try {
                    showStatus('正在加载 LibreDWG 库...');
                    const module = await import(LIB_URL);
                    const { LibreDwg, Dwg_File_Type } = module;
                    libredwgInstance = await LibreDwg.create(WASM_DIR);
                    window.Dwg_File_Type = Dwg_File_Type;
                    libLoaded = true;
                    openBtn.disabled = false;
                    showStatus('✅ 库加载成功');
                } catch (err) {
                    console.error(err);
                    showStatus('❌ 库加载失败: ' + err.message, true);
                    openBtn.disabled = true;
                }
            }
            // ================================================================
            // 18. 打开文件
            // ================================================================
            function openFile() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.dwg';
                input.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    if (!file.name.toLowerCase().endsWith('.dwg')) { alert('请选择 .dwg 文件'); return; }
                    currentFile = file;
                    fileStatus.textContent = file.name;
                    await parseDwgFile(file);
                };
                input.click();
            }
            openBtn.addEventListener('click', openFile);
            // ================================================================
            // 19. 解析 DWG
            // ================================================================
            async function parseDwgFile(file) {
                if (!libLoaded || !libredwgInstance) { showStatus('库未就绪', true); return; }
                showStatus('⏳ 解析中...');
                openBtn.disabled = true;
                try {
                    const buffer = await file.arrayBuffer();
                    const data = new Uint8Array(buffer);
                    const Dwg_File_Type = window.Dwg_File_Type;
                    const dwg = libredwgInstance.dwg_read_data(data, Dwg_File_Type.DWG);
                    const db = libredwgInstance.convert(dwg);
                    libredwgInstance.dwg_free(dwg);
                    currentDb = db;
                    let modelEntities = [];
                    if (db.modelSpace && db.modelSpace.entities) { modelEntities = db.modelSpace.entities; } else { modelEntities = db.entities || []; }
                    allEntities = modelEntities;
                    let layerTable = null;
                    if (db.tables && db.tables.LAYER && db.tables.LAYER.entries) { layerTable = db.tables.LAYER.entries; } else if (db.layerTable) { layerTable = db.layerTable; } else if (db.layers) { layerTable = db.layers; } else if (db.tables && db.tables.layer) { layerTable = db.tables.layer; }
                    buildLayers(layerTable, modelEntities);
                    buildScene();
                    renderDbTree(db);
                    showStatus(`✅ 解析完成，${allEntities.length} 个图元，${layerMap.size} 个图层`);
                    openBtn.disabled = false;
                } catch (err) {
                    console.error(err);
                    showStatus('❌ 解析失败: ' + err.message, true);
                    openBtn.disabled = false;
                }
            }
            // ================================================================
            // 20. 构建图层
            // ================================================================
            function buildLayers(layerTable, entities) {
                layerMap.clear();
                layerVisibility.clear();
                const countMap = new Map();
                const colorMap = new Map();
                const layerColors = {};
                if (layerTable && Array.isArray(layerTable)) {
                    for (const layer of layerTable) {
                        const name = layer.name || layer._name || layer.layerName;
                        if (name) {
                            let color = null;
                            if (layer.colorIndex !== undefined && layer.colorIndex !== null && layer.colorIndex !== 0) { color = layer.colorIndex; }
                            else if (layer.color !== undefined && layer.color !== null) {
                                if (typeof layer.color === 'number') color = layer.color;
                                else if (typeof layer.color === 'string') { const num = parseInt(layer.color, 10); if (!isNaN(num)) color = num; }
                            }
                            let colorStr = '#888888';
                            if (color !== null) {
                                if (typeof color === 'number') {
                                    colorStr = color <= 255 ? idxToRgb(color) : intToRgb(color);
                                } else if (typeof color === 'string') {
                                    if (color.startsWith('#')) colorStr = color;
                                    else { const num = parseInt(color, 10); if (!isNaN(num)) { colorStr = num <= 255 ? idxToRgb(num) : intToRgb(num); } }
                                }
                            }
                            layerColors[name] = colorStr;
                        }
                    }
                }
                for (const entity of entities) {
                    const layer = entity.layer || '0';
                    countMap.set(layer, (countMap.get(layer) || 0) + 1);
                    if (!colorMap.has(layer)) { const color = layerColors[layer] || resolveColor(entity, '#888888'); colorMap.set(layer, color); }
                }
                for (const [layer, count] of countMap) {
                    const color = colorMap.get(layer) || '#888888';
                    layerMap.set(layer, { color, count, visible: true });
                    layerVisibility.set(layer, true);
                }
                renderLayerList();
            }
            // ================================================================
            // 21. DB 树形渲染 (与之前相同)
            // ================================================================
            function getValueType(val) {
                if (val === null) return 'null';
                if (val === undefined) return 'undefined';
                const t = typeof val;
                if (t === 'string') return 'string';
                if (t === 'number') return 'number';
                if (t === 'boolean') return 'boolean';
                if (t === 'function') return 'function';
                if (t === 'symbol') return 'symbol';
                if (Array.isArray(val)) return 'array';
                if (val instanceof Date) return 'date';
                if (val instanceof RegExp) return 'regexp';
                if (t === 'object') return 'object';
                return 'other';
            }
            function getPreview(val, type) {
                if (type === 'null') return 'null';
                if (type === 'undefined') return 'undefined';
                if (type === 'string') { const s = String(val); if (s.length > 60) return `"${s.slice(0, 60)}…"`; return `"${s}"`; }
                if (type === 'number') return String(val);
                if (type === 'boolean') return String(val);
                if (type === 'function') return 'ƒ()';
                if (type === 'symbol') return 'Symbol()';
                if (type === 'date') return val.toISOString ? val.toISOString().slice(0, 19) : String(val);
                if (type === 'regexp') return String(val);
                if (type === 'array') return `[${val.length}项]`;
                if (type === 'object') {
                    const keys = Object.keys(val);
                    if (keys.length === 0) return '{}';
                    if (keys.length <= 3) return `{ ${keys.join(', ')} }`;
                    return `{ ${keys.slice(0, 3).join(', ')} … }`;
                }
                return String(val);
            }
            function buildTreeData(obj, key = 'db', path = 'db', depth = 0, visited = new Set()) {
                if (depth > 12) { return { key, type: 'other', preview: '⚠️ 深度限制', children: null, isLeaf: true }; }
                const type = getValueType(obj);
                if (type === 'string' || type === 'number' || type === 'boolean' ||
                    type === 'null' || type === 'undefined' || type === 'function' ||
                    type === 'symbol' || type === 'date' || type === 'regexp') {
                    return { key, type, preview: getPreview(obj, type), children: null, isLeaf: true, rawValue: obj, };
                }
                if (visited.has(obj)) { return { key, type: 'other', preview: '🔁 循环引用', children: null, isLeaf: true, }; }
                visited.add(obj);
                if (type === 'array') {
                    const children = [];
                    const len = Math.min(obj.length, 500);
                    for (let i = 0; i < len; i++) {
                        const child = buildTreeData(obj[i], String(i), `${path}[${i}]`, depth + 1, new Set(visited));
                        children.push(child);
                    }
                    if (obj.length > 500) { children.push({ key: '…', type: 'other', preview: `还有 ${obj.length - 500} 项未显示`, children: null, isLeaf: true, }); }
                    return { key, type: 'array', preview: `[${obj.length}项]`, children, isLeaf: false, rawValue: obj, length: obj.length, };
                }
                if (type === 'object') {
                    const keys = Object.keys(obj);
                    const children = [];
                    const limit = 300;
                    const displayKeys = keys.slice(0, limit);
                    for (const k of displayKeys) {
                        try { const child = buildTreeData(obj[k], k, `${path}.${k}`, depth + 1, new Set(visited)); children.push(child); }
                        catch (_) { children.push({ key: k, type: 'other', preview: '⚠️ 无法读取', children: null, isLeaf: true, }); }
                    }
                    if (keys.length > limit) { children.push({ key: '…', type: 'other', preview: `还有 ${keys.length - limit} 个属性未显示`, children: null, isLeaf: true, }); }
                    return { key, type: 'object', preview: `{${keys.length}个属性}`, children, isLeaf: false, rawValue: obj, length: keys.length, };
                }
                return { key, type: 'other', preview: String(obj), children: null, isLeaf: true, };
            }
            function renderTreeDOM(node, container, isRoot = false) {
                const wrapperDiv = document.createElement('div');
                wrapperDiv.className = 'tree-node';
                const header = document.createElement('div');
                header.className = 'tree-node-header';
                const arrow = document.createElement('span');
                arrow.className = 'arrow';
                if (!node.isLeaf && node.children && node.children.length) { arrow.textContent = '▶'; arrow.dataset.expanded = 'false'; } else { arrow.textContent = '▶'; arrow.classList.add('leaf'); }
                header.appendChild(arrow);
                const keySpan = document.createElement('span');
                keySpan.className = 'key';
                if (/^\d+$/.test(node.key) && node.type !== 'object') { keySpan.classList.add('array-index'); }
                keySpan.textContent = node.key;
                header.appendChild(keySpan);
                const colon = document.createElement('span');
                colon.className = 'colon';
                colon.textContent = ': ';
                header.appendChild(colon);
                const badge = document.createElement('span');
                badge.className = `type-badge ${node.type}`;
                const typeLabels = { object: 'obj', array: 'arr', string: 'str', number: 'num', boolean: 'bool', null: 'null', undefined: 'undef', function: 'fn', symbol: 'sym', date: 'date', regexp: 'regex', other: '?' };
                badge.textContent = typeLabels[node.type] || node.type;
                header.appendChild(badge);
                if (node.preview !== undefined && node.preview !== null) {
                    const previewSpan = document.createElement('span');
                    previewSpan.className = `preview ${node.type}-val`;
                    previewSpan.textContent = node.preview;
                    header.appendChild(previewSpan);
                }
                wrapperDiv.appendChild(header);
                if (!node.isLeaf && node.children && node.children.length) {
                    const childrenContainer = document.createElement('div');
                    childrenContainer.className = 'tree-node-children';
                    childrenContainer.style.display = 'none';
                    for (const child of node.children) { renderTreeDOM(child, childrenContainer, false); }
                    wrapperDiv.appendChild(childrenContainer);
                    header.style.cursor = 'pointer';
                    header.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const isOpen = childrenContainer.style.display !== 'none';
                        childrenContainer.style.display = isOpen ? 'none' : 'block';
                        arrow.textContent = isOpen ? '▶' : '▼';
                        arrow.dataset.expanded = isOpen ? 'false' : 'true';
                    });
                } else { header.style.cursor = 'default'; }
                container.appendChild(wrapperDiv);
                return wrapperDiv;
            }
            function renderDbTree(db) {
                if (!db) {
                    dbTreeContainer.innerHTML = `<div class="empty-msg">📭 尚未加载 DWG 文件<br /><span style="font-size:0.8rem;color:#555;">打开文件后自动显示 DB 结构</span></div>`;
                    dbSizeBadge.textContent = '0';
                    treeStats.textContent = '节点: 0';
                    return;
                }
                try {
                    const root = buildTreeData(db, 'db', 'db', 0, new Set());
                    treeData = root;
                    let totalNodes = 0;
                    function countNodes(node) { totalNodes++; if (node.children) { for (const c of node.children) countNodes(c); } }
                    countNodes(root);
                    dbTreeContainer.innerHTML = '';
                    renderTreeDOM(root, dbTreeContainer, true);
                    dbSizeBadge.textContent = totalNodes;
                    treeStats.textContent = `节点: ${totalNodes}`;
                    const firstLevel = dbTreeContainer.querySelector('.tree-node:first-child > .tree-node-children');
                    if (firstLevel) {
                        firstLevel.style.display = 'block';
                        const arrow = dbTreeContainer.querySelector('.tree-node:first-child > .tree-node-header > .arrow');
                        if (arrow && !arrow.classList.contains('leaf')) { arrow.textContent = '▼'; arrow.dataset.expanded = 'true'; }
                    }
                } catch (err) {
                    console.error('渲染 DB 树失败:', err);
                    dbTreeContainer.innerHTML = `<div class="empty-msg" style="color:#d88;">⚠️ 渲染失败: ${err.message}</div>`;
                    dbSizeBadge.textContent = '!';
                }
            }
            expandAllBtn.addEventListener('click', () => {
                const allChildren = dbTreeContainer.querySelectorAll('.tree-node-children');
                const allArrows = dbTreeContainer.querySelectorAll('.tree-node-header > .arrow:not(.leaf)');
                for (const el of allChildren) el.style.display = 'block';
                for (const el of allArrows) { el.textContent = '▼'; el.dataset.expanded = 'true'; }
            });
            collapseAllBtn.addEventListener('click', () => {
                const allChildren = dbTreeContainer.querySelectorAll('.tree-node-children');
                const allArrows = dbTreeContainer.querySelectorAll('.tree-node-header > .arrow:not(.leaf)');
                for (const el of allChildren) el.style.display = 'none';
                for (const el of allArrows) { el.textContent = '▶'; el.dataset.expanded = 'false'; }
                const firstLevel = dbTreeContainer.querySelector('.tree-node:first-child > .tree-node-children');
                if (firstLevel) {
                    firstLevel.style.display = 'block';
                    const arrow = dbTreeContainer.querySelector('.tree-node:first-child > .tree-node-header > .arrow');
                    if (arrow && !arrow.classList.contains('leaf')) { arrow.textContent = '▼'; arrow.dataset.expanded = 'true'; }
                }
            });
            // ================================================================
            // 22. 侧边栏控制
            // ================================================================
            function collapseLeftSidebar() { sidebar.classList.add('collapsed'); openLeftBtn.style.display = 'flex'; }
            function openLeftSidebar() { sidebar.classList.remove('collapsed'); openLeftBtn.style.display = 'none'; }
            collapseLeftBtn.addEventListener('click', collapseLeftSidebar);
            openLeftBtn.addEventListener('click', openLeftSidebar);
            sidebar.classList.remove('collapsed');
            openLeftBtn.style.display = 'none';
            function toggleRightSidebar() {
                const isOpen = rightSidebar.classList.contains('open');
                if (isOpen) {
                    rightSidebar.classList.remove('open');
                    toggleRightBtn.classList.remove('active');
                    toggleRightBtn.textContent = '📊';
                } else {
                    rightSidebar.classList.add('open');
                    toggleRightBtn.classList.add('active');
                    toggleRightBtn.textContent = '✕';
                }
            }
            toggleRightBtn.addEventListener('click', toggleRightSidebar);
            closeRightBtn.addEventListener('click', () => {
                rightSidebar.classList.remove('open');
                toggleRightBtn.classList.remove('active');
                toggleRightBtn.textContent = '📊';
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && rightSidebar.classList.contains('open')) {
                    rightSidebar.classList.remove('open');
                    toggleRightBtn.classList.remove('active');
                    toggleRightBtn.textContent = '📊';
                }
            });
            // ================================================================
            // 23. 拖拽支持
            // ================================================================
            wrapper.addEventListener('dragover', (e) => { e.preventDefault(); wrapper.style.border = '2px solid #0e639c'; });
            wrapper.addEventListener('dragleave', () => { wrapper.style.border = 'none'; });
            wrapper.addEventListener('drop', (e) => {
                e.preventDefault();
                wrapper.style.border = 'none';
                const files = e.dataTransfer.files;
                if (files.length && files[0].name.toLowerCase().endsWith('.dwg')) {
                    const file = files[0];
                    currentFile = file;
                    fileStatus.textContent = file.name;
                    parseDwgFile(file);
                } else { showStatus('请拖拽 .dwg 文件', true); }
            });
            document.getElementById('sidebar').addEventListener('dragover', (e) => e.preventDefault());
            document.getElementById('sidebar').addEventListener('drop', (e) => {
                e.preventDefault();
                const files = e.dataTransfer.files;
                if (files.length && files[0].name.toLowerCase().endsWith('.dwg')) {
                    const file = files[0];
                    currentFile = file;
                    fileStatus.textContent = file.name;
                    parseDwgFile(file);
                }
            });
            // ================================================================
            // 24. 中键双击重置视图
            // ================================================================
            let lastClickTime = 0;
            let lastClickButton = -1;
            wrapper.addEventListener('mouseup', (e) => {
                if (e.button !== 1) return;
                const now = Date.now();
                const timeDiff = now - lastClickTime;
                if (e.button === lastClickButton && timeDiff < 300) {
                    if (allEntities.length) { fitAll(); showStatus('✅ 视图已重置'); }
                    lastClickTime = 0;
                    lastClickButton = -1;
                } else {
                    lastClickTime = now;
                    lastClickButton = e.button;
                }
            });
            // ================================================================
            // 25. 启动
            // ================================================================
            await loadLib();
            initThree();
            console.log('DWG 3D 查看器已启动 (Z轴向上，标签始终在最前)');
        </script>
    </body>
