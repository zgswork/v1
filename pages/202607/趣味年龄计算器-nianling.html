<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>趣味年龄计算器</title>
    <style>
        :root {
            --primary-color: #ff6b6b;
            --secondary-color: #4ecdc4;
            --accent-color: #ffe66d;
        }
        
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }
        
        .container {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 25px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        h1 {
            color: var(--primary-color);
            margin-bottom: 25px;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--secondary-color);
            font-size: 1rem;
        }
        
        input[type="date"], 
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--secondary-color);
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
            box-sizing: border-box;
        }
        
        input[type="date"]:focus,
        input[type="number"]:focus,
        select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.2);
        }
        
        .year-input {
            display: flex;
            align-items: center;
        }
        
        .year-input input {
            flex: 1;
            margin-right: 10px;
        }
        
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 15px 0;
            box-shadow: 0 4px 8px rgba(255, 107, 107, 0.3);
            width: 100%;
        }
        
        button:hover {
            background-color: #ff5252;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(255, 107, 107, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .result {
            background-color: var(--accent-color);
            padding: 15px;
            border-radius: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 15px;
            display: none;
            animation: fadeIn 0.5s ease-in-out;
            position: relative;
        }
        
        .result::before,
        .result::after {
            content: "";
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.5rem;
        }
        
        .result::before {
            left: 10px;
        }
        
        .result::after {
            right: 10px;
        }
        
        .age-details {
            margin-top: 15px;
            text-align: left;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 12px;
            border-radius: 10px;
            display: none;
            font-size: 0.9rem;
        }
        
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: var(--primary-color);
            opacity: 0;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes confetti-fall {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(500px) rotate(360deg); opacity: 0; }
        }
        
        .emoji-display {
            font-size: 2.5rem;
            margin: 15px 0;
            display: none;
            animation: bounce 1s infinite alternate;
        }
        
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-15px); }
        }
        
        /* 响应式设计 */
        @media (max-width: 480px) {
            .container {
                padding: 15px;
                border-radius: 15px;
            }
            
            h1 {
                font-size: 1.6rem;
                margin-bottom: 15px;
            }
            
            .result {
                font-size: 1.1rem;
                padding: 12px;
            }
            
            .emoji-display {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎂 趣味年龄计算器 🎈</h1>
        
        <div class="input-group">
            <label for="gender">性别：</label>
            <select id="gender">
                <option value="male">男</option>
                <option value="female">女</option>
                <option value="other">其他</option>
            </select>
        </div>
        
        <div class="input-group">
            <label for="birth-year">出生年份：</label>
            <div class="year-input">
                <input type="number" id="birth-year" min="1900" max="2025" placeholder="请输入出生年份">
                <span>年</span>
            </div>
        </div>
        
        <div class="input-group">
            <label for="birthdate">完整出生日期：</label>
            <input type="date" id="birthdate" max="">
        </div>
        
        <button id="calculate-btn">计算我的年龄</button>
        
        <div class="emoji-display" id="emoji-display"></div>
        
        <div class="result" id="result"></div>
        
        <div class="age-details" id="age-details"></div>
    </div>

    <script>
        // 设置日期选择器的最大值为今天
        document.getElementById('birthdate').max = new Date().toISOString().split('T')[0];
        
        // 当年份变化时更新日期输入框
        document.getElementById('birth-year').addEventListener('input', function() {
            const year = this.value;
            if (year.length === 4) {
                document.getElementById('birthdate').value = `${year}-01-01`;
            }
        });
        
        document.getElementById('calculate-btn').addEventListener('click', function() {
            const birthdate = document.getElementById('birthdate').value;
            const gender = document.getElementById('gender').value;
            
            if (!birthdate) {
                alert('请至少选择您的出生年份或完整日期！');
                return;
            }
            
            calculateAge(birthdate, gender);
        });
        
        function calculateAge(birthdate, gender) {
            const birthDate = new Date(birthdate);
            const today = new Date();
            
            let age = today.getFullYear() - birthDate.getFullYear();
            const monthDiff = today.getMonth() - birthDate.getMonth();
            
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            
            // 计算精确年龄（年、月、日）
            let months = today.getMonth() - birthDate.getMonth();
            let days = today.getDate() - birthDate.getDate();
            
            if (days < 0) {
                months--;
                // 获取上个月的天数
                const lastMonth = new Date(today.getFullYear(), today.getMonth(), 0);
                days += lastMonth.getDate();
            }
            
            if (months < 0) {
                age--;
                months += 12;
            }
            
            // 计算总天数
            const timeDiff = today - birthDate;
            const totalDays = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
            
            // 显示结果
            const resultElement = document.getElementById('result');
            resultElement.style.display = 'block';
            
            // 根据性别设置不同的称呼
            let greeting = '';
            switch(gender) {
                case 'male':
                    greeting = '先生';
                    resultElement.innerHTML = `👨‍💼 ${age}岁${greeting}`;
                    resultElement.style.backgroundColor = '#a0e7e5';
                    break;
                case 'female':
                    greeting = '女士';
                    resultElement.innerHTML = `👩‍💼 ${age}岁${greeting}`;
                    resultElement.style.backgroundColor = '#ffb6c1';
                    break;
                default:
                    greeting = '朋友';
                    resultElement.innerHTML = `🧑 ${age}岁${greeting}`;
                    resultElement.style.backgroundColor = '#ffe66d';
            }
            
            // 显示详细年龄信息
            const ageDetailsElement = document.getElementById('age-details');
            ageDetailsElement.style.display = 'block';
            ageDetailsElement.innerHTML = `
                <p>精确年龄: ${age} 岁 ${months} 个月 ${days} 天</p>
                <p>您已经在地球上生活了: ${totalDays} 天</p>
                <p>您已经经历了: ${Math.floor(totalDays / 7)} 周</p>
                <p>您已经度过了: ${Math.floor(totalDays / 30)} 个月</p>
                <p>您的生肖: ${getChineseZodiac(birthDate.getFullYear())}</p>
            `;
            
            // 显示适合年龄的表情
            const emojiDisplay = document.getElementById('emoji-display');
            emojiDisplay.style.display = 'block';
            
            if (age < 1) {
                emojiDisplay.textContent = '👶';
            } else if (age < 5) {
                emojiDisplay.textContent = '🧒';
            } else if (age < 12) {
                emojiDisplay.textContent = '👦👧';
            } else if (age < 20) {
                emojiDisplay.textContent = '🧑';
            } else if (age < 30) {
                emojiDisplay.textContent = '🧑‍💼';
            } else if (age < 50) {
                emojiDisplay.textContent = '🧑‍🔬';
            } else if (age < 70) {
                emojiDisplay.textContent = '🧑‍🏫';
            } else {
                emojiDisplay.textContent = '🧓';
            }
            
            // 创建五彩纸屑效果
            createConfetti();
        }
        
        function getChineseZodiac(year) {
            const zodiacs = ['鼠', '牛', '虎', '兔', '龙', '蛇', '马', '羊', '猴', '鸡', '狗', '猪'];
            return zodiacs[(year - 4) % 12];
        }
        
        function createConfetti() {
            const container = document.querySelector('.container');
            
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                
                // 随机颜色
                const colors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#a0e7e5', '#b5ead7'];
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.backgroundColor = randomColor;
                
                // 随机大小
                const size = Math.random() * 8 + 4;
                confetti.style.width = `${size}px`;
                confetti.style.height = `${size}px`;
                
                // 随机位置
                confetti.style.left = `${Math.random() * 100}%`;
                
                // 随机形状
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                
                // 随机动画持续时间
                const duration = Math.random() * 3 + 2;
                confetti.style.animation = `confetti-fall ${duration}s linear forwards`;
                
                container.appendChild(confetti);
                
                // 动画结束后移除
                setTimeout(() => {
                    confetti.remove();
                }, duration * 1000);
            }
        }
    </script>
</body>
</html>
