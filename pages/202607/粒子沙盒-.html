<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>粒子沙盒 · 百万粒子</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: #000; 
            touch-action: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        canvas { 
            display: block; 
            width: 100vw; 
            height: 100vh;
        }
        #ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .stats {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255,255,255,0.8);
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .stats .number {
            color: #00ff88;
            font-weight: 600;
            font-size: 18px;
        }
        .hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.6);
            font-size: 13px;
            text-align: center;
            line-height: 1.6;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            animation: pulse 3s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        #fallback {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            padding: 20px;
        }
        #fallback h2 {
            color: #ff6b6b;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div class="stats">
            <div>粒子数量: <span class="number" id="particle-count">--</span></div>
            <div style="margin-top:8px;font-size:12px;opacity:0.7;">FPS: <span id="fps">--</span></div>
        </div>
        <div class="hint">
            触摸聚气 · 松手释放<br>
            百万粒子随势而动
        </div>
    </div>
    
    <div id="fallback">
        <h2>需要 WebGL 2.0 支持</h2>
        <p>您的浏览器不支持所需的图形技术。<br>请使用 Chrome、Firefox、Edge 或 Safari 的最新版本。</p>
    </div>
    
    <canvas id="canvas"></canvas>
    
    <script>
        const MAX_PARTICLES = 1000000;
        let PARTICLE_COUNT;
        
        // ========== 三角函数查表（LUT）==========
        const LUT_BITS = 10;
        const LUT_SIZE = 1 << LUT_BITS;
        const LUT_MASK = LUT_SIZE - 1;
        const sinTable = new Float32Array(LUT_SIZE);
        const cosTable = new Float32Array(LUT_SIZE);
        for (let i = 0; i < LUT_SIZE; i++) {
            let rad = i * 6.283185307179586 / LUT_SIZE;
            sinTable[i] = Math.sin(rad);
            cosTable[i] = Math.cos(rad);
        }
        
        const canvas = document.getElementById('canvas');
        const gl = canvas.getContext('webgl2', { 
            alpha: false, 
            antialias: false,
            powerPreference: 'high-performance'
        });
        
        if (!gl) {
            document.getElementById('fallback').style.display = 'flex';
            document.getElementById('ui').style.display = 'none';
            canvas.style.display = 'none';
            throw new Error('WebGL 2.0 not supported');
        }
        
        let width, height, dpr;
        function resize() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = Math.floor(window.innerWidth * dpr);
            height = Math.floor(window.innerHeight * dpr);
            canvas.width = width;
            canvas.height = height;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            gl.viewport(0, 0, width, height);
        }
        resize();
        window.addEventListener('resize', resize);
        
        // 根据屏幕面积动态决定粒子数
        PARTICLE_COUNT = Math.min(MAX_PARTICLES, Math.floor(width * height * 0.4));
        if (PARTICLE_COUNT < 50000) PARTICLE_COUNT = 50000;
        document.getElementById('particle-count').textContent = PARTICLE_COUNT.toLocaleString();
        
        // 输入处理
        const input = { active: 0, x: 0, y: 0, released: 0, releaseX: 0, releaseY: 0 };
        
        function getClientPos(e) {
            if (e.type === 'touchend') {
                if (e.changedTouches && e.changedTouches.length > 0) {
                    return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
                }
                return null;
            } else if (e.touches && e.touches.length > 0) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            } else {
                return { x: e.clientX, y: e.clientY };
            }
        }
        
        function updateInput(e, isStart) {
            e.preventDefault();
            const pos = getClientPos(e);
            if (!pos) return;
            
            const rect = canvas.getBoundingClientRect();
            const cx = (pos.x - rect.left) * dpr;
            const cy = height - (pos.y - rect.top) * dpr;
            
            if (isStart) {
                input.active = 1;
                input.x = cx;
                input.y = cy;
            } else if (e.type === 'mouseup' || e.type === 'touchend' || e.type === 'mouseleave') {
                if (input.active) {
                    input.active = 0;
                    input.released = 1;
                    input.releaseX = input.x;
                    input.releaseY = input.y;
                }
            } else if ((e.type === 'mousemove' || e.type === 'touchmove') && input.active) {
                input.x = cx;
                input.y = cy;
            }
        }
        
        canvas.addEventListener('mousedown', e => updateInput(e, true));
        canvas.addEventListener('mousemove', e => updateInput(e, false));
        canvas.addEventListener('mouseup', e => updateInput(e, false));
        canvas.addEventListener('mouseleave', e => updateInput(e, false));
        canvas.addEventListener('touchstart', e => updateInput(e, true), {passive: false});
        canvas.addEventListener('touchmove', e => updateInput(e, false), {passive: false});
        canvas.addEventListener('touchend', e => updateInput(e, false), {passive: false});
        canvas.addEventListener('touchcancel', e => updateInput(e, false), {passive: false});
        
        // 着色器
        const vsSource = `#version 300 es
            precision highp float;
            in vec2 a_position;
            in float a_hue;
            uniform vec2 u_resolution;
            out float v_hue;
            void main() {
                vec2 clipPos = (a_position / u_resolution) * 2.0 - 1.0;
                gl_Position = vec4(clipPos, 0.0, 1.0);
                gl_PointSize = 2.5;
                v_hue = a_hue;
            }
        `;
        
        const fsSource = `#version 300 es
            precision highp float;
            in float v_hue;
            out vec4 fragColor;
            vec3 hsv2rgb(vec3 c) {
                vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
                vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
                return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
            }
            void main() {
                vec2 coord = gl_PointCoord - vec2(0.5);
                float dist = length(coord);
                if (dist > 0.5) discard;
                float alpha = (1.0 - smoothstep(0.2, 0.5, dist)) * 0.45;
                vec3 color = hsv2rgb(vec3(v_hue, 0.85, 1.0));
                fragColor = vec4(color, alpha);
            }
        `;
        
        function createShader(type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error('Shader error:', gl.getShaderInfoLog(shader));
                return null;
            }
            return shader;
        }
        
        const vs = createShader(gl.VERTEX_SHADER, vsSource);
        const fs = createShader(gl.FRAGMENT_SHADER, fsSource);
        
        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            console.error('Program link error:', gl.getProgramInfoLog(program));
            throw new Error('Program linking failed');
        }
        
        const loc = {
            position: gl.getAttribLocation(program, 'a_position'),
            hue: gl.getAttribLocation(program, 'a_hue')
        };
        
        const uni = {
            resolution: gl.getUniformLocation(program, 'u_resolution')
        };
        
        // 粒子数据
        const positions = new Float32Array(PARTICLE_COUNT * 2);
        const velocities = new Float32Array(PARTICLE_COUNT * 2);
        const hues = new Float32Array(PARTICLE_COUNT);
        const phases = new Float32Array(PARTICLE_COUNT);
        
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            positions[i * 2] = Math.random() * width;
            positions[i * 2 + 1] = Math.random() * height;
            velocities[i * 2] = (Math.random() - 0.5) * 3;
            velocities[i * 2 + 1] = (Math.random() - 0.5) * 3;
            hues[i] = Math.random();
            phases[i] = Math.random() * LUT_SIZE;
        }
        
        const buffers = {
            position: gl.createBuffer(),
            hue: gl.createBuffer()
        };
        
        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        
        gl.bindBuffer(gl.ARRAY_BUFFER, buffers.position);
        gl.enableVertexAttribArray(loc.position);
        gl.vertexAttribPointer(loc.position, 2, gl.FLOAT, false, 0, 0);
        
        gl.bindBuffer(gl.ARRAY_BUFFER, buffers.hue);
        gl.enableVertexAttribArray(loc.hue);
        gl.vertexAttribPointer(loc.hue, 1, gl.FLOAT, false, 0, 0);
        
        gl.bindBuffer(gl.ARRAY_BUFFER, buffers.hue);
        gl.bufferData(gl.ARRAY_BUFFER, hues, gl.STATIC_DRAW);
        
        // 预生成随机数表
        const RAND_SIZE = 65536;
        const randTable = new Float32Array(RAND_SIZE);
        for (let i = 0; i < RAND_SIZE; i++) randTable[i] = Math.random();
        let randPtr = 0;
        function rnd() { return randTable[randPtr++ & 0xFFFF]; }
        
        let frameCount = 0, lastFpsTime = 0;
        const fpsEl = document.getElementById('fps');
        
        // 物理更新
        function updatePhysics() {
            const justReleased = input.released;
            const mx = input.x, my = input.y;
            const w = width, h = height;
            const rx = input.releaseX, ry = input.releaseY;
            const n = PARTICLE_COUNT;
            const p = positions;
            const v = velocities;
            const ph = phases;
            
            if (input.active) {
                for (let i = 0; i < n; i++) {
                    let b = i * 2;
                    let px = p[b], py = p[b + 1];
                    let dx = mx - px, dy = my - py;
                    let dist = Math.sqrt(dx * dx + dy * dy) + 0.1;
                    let f = 0.15 * (1 + 300 / dist);
                    let vx = v[b] + (dx / dist) * f;
                    let vy = v[b + 1] + (dy / dist) * f;
                    vx *= 0.88; vy *= 0.88;
                    px += vx; py += vy;
                    if (px < 0) px += w; else if (px > w) px -= w;
                    if (py < 0) py += h; else if (py > h) py -= h;
                    p[b] = px; p[b + 1] = py; v[b] = vx; v[b + 1] = vy;
                }
            } else if (justReleased) {
                input.released = 0;
                for (let i = 0; i < n; i++) {
                    let b = i * 2;
                    let px = p[b], py = p[b + 1];
                    let dx = px - rx, dy = py - ry;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    let force = 15 * ((300 - dist) / 300);
                    let vx, vy;
                    if (force > 0.1 && dist < 300) {
                        let nd = dist + 0.001;
                        vx = (dx / nd) * force * 1.5 + (rnd() - 0.5) * 3;
                        vy = (dy / nd) * force * 1.5 + (rnd() - 0.5) * 3;
                    } else {
                        let angle = rnd() * 6.28318;
                        let sp = 2 + rnd() * 4;
                        vx = Math.cos(angle) * sp;
                        vy = Math.sin(angle) * sp;
                    }
                    px += vx; py += vy;
                    if (px < 0) px += w; else if (px > w) px -= w;
                    if (py < 0) py += h; else if (py > h) py -= h;
                    p[b] = px; p[b + 1] = py; v[b] = vx; v[b + 1] = vy;
                }
            } else {
                for (let i = 0; i < n; i++) {
                    let b = i * 2;
                    let vx = v[b], vy = v[b + 1];
                    
                    let phase = ph[i];
                    let idx = phase | 0;
                    phase += 3.26;
                    if (phase >= LUT_SIZE) phase -= LUT_SIZE;
                    ph[i] = phase;
                    
                    vx += cosTable[idx] * 0.03;
                    vy += sinTable[(idx + 333) & LUT_MASK] * 0.03;
                    
                    vx *= 0.999; vy *= 0.999;
                    vx += (rnd() - 0.5) * 0.1;
                    vy += (rnd() - 0.5) * 0.1;
                    
                    let speedSq = vx * vx + vy * vy;
                    if (speedSq < 0.25) {
                        vx *= 1.5; vy *= 1.5;
                    } else if (speedSq > 64) {
                        let s = Math.sqrt(speedSq);
                        let inv = 8 / s;
                        vx *= inv; vy *= inv;
                    }
                    
                    let px = p[b] + vx, py = p[b + 1] + vy;
                    if (px < 0) px += w; else if (px > w) px -= w;
                    if (py < 0) py += h; else if (py > h) py -= h;
                    p[b] = px; p[b + 1] = py; v[b] = vx; v[b + 1] = vy;
                }
            }
        }
        
        function render(time) {
            frameCount++;
            if (time - lastFpsTime > 1000) {
                fpsEl.textContent = frameCount;
                frameCount = 0;
                lastFpsTime = time;
            }
            
            updatePhysics();
            
            gl.bindBuffer(gl.ARRAY_BUFFER, buffers.position);
            gl.bufferData(gl.ARRAY_BUFFER, positions, gl.DYNAMIC_DRAW);
            
            gl.clearColor(0, 0, 0, 0.1);
            gl.clear(gl.COLOR_BUFFER_BIT);
            
            gl.useProgram(program);
            gl.bindVertexArray(vao);
            gl.uniform2f(uni.resolution, width, height);
            
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
            
            gl.drawArrays(gl.POINTS, 0, PARTICLE_COUNT);
            
            gl.disable(gl.BLEND);
            
            requestAnimationFrame(render);
        }
        
        requestAnimationFrame(render);
    </script>
</body>
</html>
