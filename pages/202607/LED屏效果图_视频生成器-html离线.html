<!DOCTYPE html>
<!-- saved from url=(0025)https://gjgds.com/effect/ -->
<html lang="zh-CN">

    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>LED 屏效果图/视频生成器（异形版）</title>
        <style>
            /* 配色 / 字体参考 gjgds.com（深色工业风 + 橙色高亮） */
            :root {
                --bg: #151a27;
                --panel: #1c2235;
                --card: #23293d;
                --line: #2a3150;
                --line2: #333c5c;
                --text: #e4e9f2;
                --muted: #8892ab;
                --muted2: #7b86a3;
                --accent: #ff6b35;
                --accent2: #ff8a33;
                --accent3: #ff4422;
                --ok: #22c55e;
            }

            * {
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent;
            }

            html,
            body {
                margin: 0;
                height: 100%;
                font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
                background: var(--bg);
                color: var(--text);
            }

            header {
                background: var(--panel);
                color: var(--text);
                padding: 12px 18px;
                font-size: 16px;
                font-weight: 700;
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex: 0 0 auto;
                border-bottom: 1px solid var(--line);
            }

            header .brand b {
                color: var(--accent);
            }

            header small {
                font-weight: 400;
                color: var(--muted);
                font-size: 12px;
            }

            .app {
                display: flex;
                height: calc(100vh - 51px);
                min-height: 320px;
            }

            .panel {
                background: var(--panel);
                width: 260px;
                flex: 0 0 260px;
                display: flex;
                flex-direction: column;
                overflow: hidden;
                border-right: 1px solid var(--line);
            }

            .panel.right {
                border-right: none;
                border-left: 1px solid var(--line);
                width: 280px;
                flex: 0 0 280px;
            }

            .panel-body {
                flex: 1;
                overflow-y: auto;
                padding: 14px;
            }

            .panel-body::-webkit-scrollbar {
                width: 8px;
            }

            .panel-body::-webkit-scrollbar-thumb {
                background: var(--line2);
                border-radius: 8px;
            }

            .panel h3 {
                margin: 0 0 12px;
                font-size: 13px;
                color: var(--accent);
                font-weight: 700;
                padding-bottom: 8px;
                border-bottom: 1px solid var(--line);
                letter-spacing: .5px;
            }

            .card {
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 14px;
                padding: 13px;
                margin-bottom: 13px;
            }

            .card-title {
                font-size: 12px;
                color: var(--muted);
                margin-bottom: 9px;
                font-weight: 600;
            }

            .grp {
                display: flex;
                flex-direction: column;
                gap: 6px;
                margin-bottom: 10px;
            }

            .grp:last-child {
                margin-bottom: 0;
            }

            .grp label {
                font-size: 11px;
                color: var(--muted);
            }

            .grp .row {
                display: flex;
                gap: 6px;
                align-items: center;
                flex-wrap: wrap;
            }

            input[type=number],
            select,
            input[type=text] {
                width: 74px;
                padding: 6px 8px;
                border: 1px solid var(--line);
                border-radius: 8px;
                font-size: 13px;
                background: #1a2032;
                color: var(--text);
            }

            input[type=number]:focus,
            select:focus,
            input[type=text]:focus {
                outline: none;
                border-color: var(--accent);
            }

            select option {
                background: #1a2032;
                color: var(--text);
            }

            input[type=text].wide {
                width: 100%;
            }

            input[type=color] {
                width: 34px;
                height: 30px;
                border: 1px solid var(--line);
                border-radius: 8px;
                padding: 0;
                background: #1a2032;
            }

            input[type=range] {
                accent-color: var(--accent);
            }

            input[type=checkbox],
            input[type=radio] {
                accent-color: var(--accent);
            }

            button {
                padding: 7px 12px;
                border: 1px solid var(--line2);
                background: #2a3150;
                color: var(--text);
                border-radius: 9px;
                font-size: 13px;
                cursor: pointer;
                transition: .15s;
            }

            button:hover {
                border-color: var(--accent);
            }

            button.primary {
                background: linear-gradient(135deg, var(--accent2), var(--accent3));
                color: #fff;
                border: none;
                font-weight: 600;
            }

            button.primary:hover {
                filter: brightness(1.08);
            }

            button.ghost {
                background: #2a3150;
            }

            /* 上传按钮 — 醒目圆角 */
            .upload-btn,
            .upload-btn-video {
                padding: 10px 18px;
                border: none;
                border-radius: 20px;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition: all .2s;
                width: 100%;
            }

            .upload-btn {
                background: linear-gradient(135deg, #3b82f6, #06b6d4);
                color: #fff;
            }

            .upload-btn:hover {
                background: linear-gradient(135deg, #2563eb, #0891b2);
                transform: translateY(-1px);
            }

            .upload-btn-video {
                background: linear-gradient(135deg, #f59e0b, #ef4444);
                color: #fff;
            }

            .upload-btn-video:hover {
                background: linear-gradient(135deg, #d97706, #dc2626);
                transform: translateY(-1px);
            }

            button.active {
                background: linear-gradient(135deg, var(--accent2), var(--accent3));
                color: #fff;
                border: none;
            }

            button.block {
                width: 100%;
            }

            .rd {
                font-size: 12px;
                display: inline-flex;
                gap: 10px;
                align-items: center;
                flex-wrap: wrap;
                color: var(--text);
            }

            .stage {
                position: relative;
                flex: 1;
                min-width: 0;
                background: #0e1320;
                overflow: hidden;
                touch-action: none;
            }

            canvas {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                display: block;
                z-index: 1;
            }

            /* 视频预览叠加层：用浏览器原生 <video>（GPU 合成）做透视播放，预览如原生播放器般流畅 */
            #pv {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                transform-origin: 0 0;
                pointer-events: none;
                z-index: 2;
                display: none;
                will-change: transform;
                object-fit: fill;
            }

            /* 面积为原 22×22 的 1/5：22/√5 ≈ 10px */
            .handle {
                position: absolute;
                width: 10px;
                height: 10px;
                margin: -5px 0 0 -5px;
                border-radius: 50%;
                background: var(--accent2);
                border: 1.5px solid #fff;
                box-shadow: 0 1px 5px rgba(0, 0, 0, .6);
                cursor: grab;
                z-index: 5;
                touch-action: none;
            }

            .handle:active {
                cursor: grabbing;
            }

            .hint {
                position: absolute;
                left: 10px;
                bottom: 10px;
                color: var(--muted);
                font-size: 12px;
                background: rgba(10, 14, 24, .6);
                border: 1px solid var(--line);
                padding: 5px 10px;
                border-radius: 8px;
                z-index: 4;
                pointer-events: none;
            }

            #exportTip {
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                background: rgba(28, 34, 53, .94);
                color: var(--text);
                padding: 14px 22px;
                border-radius: 12px;
                font-size: 14px;
                z-index: 9;
                text-align: center;
                pointer-events: none;
                box-shadow: 0 6px 26px rgba(0, 0, 0, .55);
                border: 1px solid var(--line);
            }

            .sec {
                border-left: 3px solid var(--accent);
                padding-left: 8px;
                font-size: 12px;
                font-weight: 700;
                color: var(--accent);
                margin-right: 4px;
            }

            .hide {
                display: none !important;
            }

            .rotate-hint {
                display: none;
            }

            .badge {
                font-size: 11px;
                color: var(--accent);
                margin-left: 4px;
                font-weight: 600;
            }

            /* 手机端：强制横屏 + 保持桌面布局比例 */
            @media (max-width: 900px) and (orientation: portrait) {

                html,
                body {
                    overflow: hidden;
                }

                /* 横屏提示覆盖层 */
                .rotate-hint {
                    display: flex;
                    position: fixed;
                    inset: 0;
                    z-index: 9999;
                    background: rgba(5, 8, 18, .97);
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    gap: 20px;
                    color: #ff914d;
                    text-align: center;
                    padding: 30px;
                }

                .rotate-hint .icon {
                    font-size: 64px;
                    animation: pulse 1.5s ease infinite;
                }

                .rotate-hint h2 {
                    font-size: 20px;
                    margin: 0;
                    color: #ff914d;
                }

                .rotate-hint p {
                    font-size: 15px;
                    color: #8a93b0;
                    margin: 0;
                    line-height: 1.6;
                }

                @keyframes pulse {

                    0%,
                    100% {
                        opacity: 0.5;
                        transform: rotate(0deg);
                    }

                    50% {
                        opacity: 1;
                        transform: rotate(90deg);
                    }
                }

                /* 隐藏应用层 */
                .app {
                    display: none !important;
                }
            }

            @media (max-width: 900px) and (orientation: landscape) {
                .app {
                    height: 100vh;
                }

                .panel {
                    width: 200px;
                    flex: 0 0 200px;
                    font-size: 12px;
                    overflow-y: auto;
                }

                .panel.right {
                    width: 220px;
                    flex: 0 0 220px;
                }

                .panel h3 {
                    font-size: 13px;
                }

                .panel-body {
                    padding: 8px 10px;
                }

                .panel-body label {
                    font-size: 11px;
                }

                .panel-body input,
                .panel-body select {
                    font-size: 11px;
                    padding: 4px 6px;
                }

                .panel-body button {
                    font-size: 11px;
                    padding: 6px 10px;
                }

                .mobile-bar {
                    display: none !important;
                }

                .hint {
                    font-size: 11px;
                    bottom: 4px;
                }

                header {
                    padding: 4px 10px;
                    font-size: 12px;
                }

                header small {
                    font-size: 10px;
                }

                .stage {
                    flex: 1;
                    min-width: 0;
                }
            }

            @media (min-width: 901px) {
                .mobile-bar {
                    display: none;
                }
            }

            /* ==== 右侧可收起侧边栏 ==== */
            .side-tab {
                position: fixed;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                z-index: 100;
                width: 36px;
                height: 130px;
                background: #1c2235;
                border: 1px solid #2a3150;
                border-right: none;
                border-radius: 12px 0 0 12px;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                writing-mode: vertical-rl;
                text-orientation: upright;
                letter-spacing: 6px;
                font-size: 14px;
                color: #8892ab;
                font-weight: 600;
                transition: all .35s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .side-tab:hover {
                color: #ff6b35;
                background: #23293d;
                border-color: #ff6b35;
            }

            .side-drawer {
                position: fixed;
                right: -280px;
                top: 50%;
                transform: translateY(-50%);
                z-index: 99;
                width: 270px;
                background: #1c2235;
                border: 1px solid #2a3150;
                border-radius: 14px;
                padding: 18px 16px;
                color: #a0aabf;
                font-size: 13px;
                line-height: 1.6;
                transition: right .35s cubic-bezier(0.4, 0, 0.2, 1);
                max-height: 75vh;
                overflow-y: auto;
            }

            .side-drawer.show {
                right: 36px;
            }

            .side-drawer h3 {
                font-size: 14px;
                font-weight: 700;
                color: #c8d0e6;
                margin-bottom: 10px;
            }

            .side-drawer .row {
                display: flex;
                justify-content: space-between;
                padding: 3px 0;
                border-bottom: 1px solid #2a3150;
            }

            .side-drawer .row:last-child {
                border-bottom: none;
            }

            .side-drawer .val {
                color: #ff6b35;
                font-weight: 600;
            }

            .side-drawer .v {
                color: #ff6b35;
                font-weight: 600;
            }

            .side-drawer .date {
                font-size: 11px;
                color: #5a6580;
            }

            .side-drawer .item {
                margin-bottom: 8px;
            }

            .side-drawer .future {
                color: #5a6580;
                font-size: 11px;
                margin-top: 8px;
                font-style: italic;
            }

            .side-drawer::-webkit-scrollbar {
                width: 4px;
            }

            .side-drawer::-webkit-scrollbar-thumb {
                background: #2a3150;
                border-radius: 2px;
            }

            @media(max-width:1200px) {

                .side-tab,
                .side-drawer {
                    display: none;
                }
            }
        </style>
    </head>

    <body>
        <div class="rotate-hint">
            <div class="icon">📱</div>
            <h2>请旋转手机</h2>
            <p>横屏模式下可获得最佳操作体验<br>竖屏时布局会自动适配</p>
        </div>
        <header><span class="brand">LED <b>屏效果图/视频生成器</b></span> <small>异形版 · 自由控制点网格 · 单文件离线</small></header>
        <div class="app">
            <!-- 左侧面板：素材与工具 -->
            <aside class="panel">
                <div class="panel-body">
                    <h3>素材与场景</h3>
                    <div class="card">
                        <div class="card-title">场地背景</div>
                        <div class="grp">
                            <div class="row">
                                <button id="btnBg" class="ghost block">上传背景(图/视频)</button>
                                <button id="btnSample" class="ghost">示例背景</button>
                                <input id="bgFile" type="file" accept="image/*,video/*" class="hide">
                            </div>
                            <div class="row hide" id="bgVidCtl">
                                <button id="btnBgPrev" class="ghost">背景预览</button>
                                <button id="btnBgGrab" class="ghost">截取当前帧</button>
                            </div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-title">屏体形状</div>
                        <div class="grp">
                            <div class="row">
                                <span class="rd">
                                    <label><input type="radio" name="shape" value="flat" checked=""> 平面</label>
                                    <label><input type="radio" name="shape" value="arc"> 弧形</label>
                                    <label><input type="radio" name="shape" value="fold"> 折角</label>
                                    <label><input type="radio" name="shape" value="cyl"> 圆柱</label>
                                    <label><input type="radio" name="shape" value="free"> 自由形状</label>
                                </span>
                            </div>
                            <div class="row hide" id="arcCtl">
                                <span style="font-size:11px;color:var(--muted);">弧向</span>
                                <select id="inArcConv">
                                    <option value="1">外凸</option>
                                    <option value="0">内凹</option>
                                </select>
                                <span style="font-size:11px;color:var(--muted);">形状用鼠标拖动控制点微调</span>
                            </div>
                            <div class="row hide" id="foldCtl">
                                <span>折角</span><input id="inFoldAngle" type="number" value="40" min="0" max="85"
                                    style="width:52px;"><span>°</span>
                                <span>折点</span><input id="inFoldPos" type="number" value="50" min="15" max="85"
                                    style="width:52px;"><span>%</span>
                                <select id="inFoldConv">
                                    <option value="1">向后折</option>
                                    <option value="0">向前折</option>
                                </select>
                            </div>
                            <div class="row hide" id="cylCtl">
                                <span>环绕角</span><input id="inCylWrap" type="number" value="160" min="40" max="300"
                                    style="width:56px;"><span>°</span>
                            </div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-title">整体缩放</div>
                        <div class="grp">
                            <div class="row">
                                <input id="inScale" type="range" min="30" max="150" value="100"
                                    style="flex:1;min-width:120px;">
                                <span id="lblScale" class="badge">100%</span>
                            </div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-title">控制点网格</div>
                        <div class="grp">
                            <div class="row">
                                <span>列</span><button id="btnColM" class="ghost">-</button><span id="lblCol"
                                    class="badge">2</span><button id="btnColP" class="ghost">+</button>
                                <span>行</span><button id="btnRowM" class="ghost">-</button><span id="lblRow"
                                    class="badge">2</span><button id="btnRowP" class="ghost">+</button>
                            </div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-title">调整点模式</div>
                        <div class="grp">
                            <div class="row">
                                <span class="rd">
                                    <label><input type="radio" name="adjust" value="shape" checked=""> 形状联动（丝滑）</label>
                                </span>
                            </div>
                            <div class="row">
                                <span class="rd">
                                    <label><input type="radio" name="adjust" value="free"> 自由单点</label>
                                </span>
                            </div>
                            <div class="row" id="linkRow">
                                <span style="font-size:11px;color:var(--muted);">联动范围</span>
                                <input id="inLinkRadius" type="range" min="15" max="120" value="60"
                                    style="flex:1;min-width:90px;">
                                <span id="lblLinkRadius" class="badge">60%</span>
                            </div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-title">显示选项</div>
                        <div class="grp">
                            <label><input id="inBezel" type="checkbox" checked=""> 包边+阴影</label>
                            <label><input id="inSnapHV" type="checkbox"> 锁定水平/垂直</label>
                        </div>
                    </div>
                </div>
            </aside>
            <!-- 中间画布 -->
            <div class="stage" id="stage">
                <canvas id="cv" width="1372" height="830"></canvas>
                <video id="pv" muted="" loop="" playsinline="" style="object-fit: fill; display: none;"></video>
                <div class="handles" id="handles">
                    <div class="handle" data-idx="0" style="left: 308.7px; top: 202.769px;"></div>
                    <div class="handle" data-idx="1" style="left: 1063.3px; top: 202.769px;"></div>
                    <div class="handle" data-idx="2" style="left: 308.7px; top: 627.231px;"></div>
                    <div class="handle" data-idx="3" style="left: 1063.3px; top: 627.231px;"></div>
                </div>
                <div id="exportTip" class="hide"></div>
                <!-- 手机端底部工具栏 -->
                <div class="mobile-bar" id="mobileBar">
                    <button class="primary" id="mbLeft">⚙️ 素材与形状</button>
                    <button class="primary" id="mbRight">🎨 内容与导出</button>
                    <button class="ghost" id="mbClose" style="display:none;">✕ 关闭面板</button>
                </div>
                <div class="hint">形状：平面/弧形/折角/圆柱/自由；「形状联动」拖一点整片丝滑跟随(联动范围可调)，「自由单点」逐点微调；整体缩放对所有形状生效</div>
            </div>
            <!-- 右侧面板：内容与导出 -->
            <aside class="panel right">
                <div class="panel-body">
                    <h3>内容与导出</h3>
                    <div class="card">
                        <div class="card-title">屏内内容</div>
                        <div class="grp">
                            <div class="row">
                                <span class="rd">
                                    <label><input type="radio" name="mode" value="image" checked="">图片</label>
                                    <label><input type="radio" name="mode" value="video">视频</label>
                                    <label><input type="radio" name="mode" value="bars">彩条</label>
                                    <label><input type="radio" name="mode" value="text">文字</label>
                                </span>
                            </div>
                            <div class="row hide" id="textCtl">
                                <input id="inText" type="text" class="wide" value="欢迎光临">
                            </div>
                            <div class="row hide" id="textCtl2">
                                <input id="inColor" type="color" value="#ffcc00">
                                <input id="inBg" type="color" value="#0b1f4d">
                                <span style="font-size:11px;color:var(--muted);">文字色 / 背景色</span>
                            </div>
                            <div class="row" id="imgCtl">
                                <button id="btnContent" class="upload-btn block">上传图片</button>
                                <input id="imgFile" type="file" accept="image/*" class="hide">
                            </div>
                            <div class="row hide" id="videoCtl">
                                <button id="btnVideo" class="upload-btn-video">上传视频</button>
                                <input id="videoFile" type="file" accept="video/*" class="hide">
                                <label style="font-size:11px;color:var(--muted);"><input id="inVideoAudio"
                                        type="checkbox"> 导出含原声</label>
                            </div>
                            <div class="row hide" id="vidVidCtl">
                                <button id="btnVPrev" class="ghost">冻结画面</button>
                                <button id="btnVGrab" class="ghost">截取当前帧</button>
                            </div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-title">包边宽度 <label
                                style="font-weight:400;color:var(--muted);font-size:11px;"><input id="inBezelLink"
                                    type="checkbox" checked=""> 锁定等宽</label></div>
                        <div class="grp">
