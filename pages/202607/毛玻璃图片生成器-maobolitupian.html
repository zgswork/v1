<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毛玻璃图片生成器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .header {
            text-align: center;
            padding: 25px;
            background: rgba(255, 255, 255, 0.15);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .content {
            display: flex;
            flex-wrap: wrap;
            padding: 20px;
        }
        
        .controls {
            flex: 1;
            min-width: 300px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 15px;
            margin: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .preview-area {
            flex: 1.5;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 15px;
            margin: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        
        .control-group {
            margin-bottom: 25px;
        }
        
        .control-group h3 {
            margin-bottom: 15px;
            color: #5a67d8;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .control-group h3 i {
            font-size: 1.2rem;
        }
        
        .slider-container {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #4a5568;
        }
        
        input[type="range"] {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            background: linear-gradient(to right, #a777e3, #6e8efb);
            border-radius: 10px;
            outline: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            border: 2px solid #6e8efb;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        
        .value-display {
            text-align: right;
            font-size: 0.9rem;
            color: #5a67d8;
            font-weight: 600;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 25px;
            background: linear-gradient(to right, #6e8efb, #a777e3);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(106, 142, 251, 0.4);
            width: 100%;
            margin: 5px 0;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(106, 142, 251, 0.6);
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        .btn i {
            margin-right: 8px;
        }
        
        .btn-secondary {
            background: linear-gradient(to right, #4a5568, #718096);
            box-shadow: 0 4px 10px rgba(113, 128, 150, 0.4);
        }
        
        .btn-secondary:hover {
            box-shadow: 0 6px 15px rgba(113, 128, 150, 0.6);
        }
        
        .upload-area {
            border: 2px dashed #cbd5e0;
            border-radius: 10px;
            padding: 25px;
            text-align: center;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .upload-area:hover {
            border-color: #a777e3;
            background: rgba(255, 255, 255, 0.8);
        }
        
        .upload-area i {
            font-size: 3rem;
            color: #a777e3;
            margin-bottom: 15px;
        }
        
        .upload-area p {
            color: #718096;
            font-size: 1.1rem;
        }
        
        #imagePreview {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: none;
        }
        
        #canvasOutput {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: none;
        }
        
        .preview-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
            color: #a0aec0;
        }
        
        .preview-placeholder i {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #cbd5e0;
        }
        
        .preview-placeholder p {
            font-size: 1.1rem;
            max-width: 300px;
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .footer a {
            color: white;
            text-decoration: none;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .button-group .btn {
            width: auto;
            flex: 1;
        }
        
        @media (max-width: 768px) {
            .content {
                flex-direction: column;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .controls, .preview-area {
                min-width: 100%;
            }
            
            .button-group {
                flex-direction: column;
                gap: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-image"></i> 毛玻璃图片生成器</h1>
            <p>上传图片，调整参数，创建令人惊艳的毛玻璃效果</p>
        </div>
        
        <div class="content">
            <div class="controls">
                <div class="upload-area" id="dropArea">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>点击或拖放图片到此处上传</p>
                    <input type="file" id="imageUpload" accept="image/*" style="display: none;">
                </div>
                
                <div class="control-group">
                    <h3><i class="fas fa-sliders-h"></i> 效果调整</h3>
                    
                    <div class="slider-container">
                        <label for="blurSlider">模糊度: <span id="blurValue">10</span>px</label>
                        <input type="range" id="blurSlider" min="0" max="50" value="10">
                    </div>
                    
                    <div class="slider-container">
                        <label for="brightnessSlider">亮度: <span id="brightnessValue">100</span>%</label>
                        <input type="range" id="brightnessSlider" min="0" max="200" value="100">
                    </div>
                    
                    <div class="slider-container">
                        <label for="scaleSlider">缩放: <span id="scaleValue">100</span>%</label>
                        <input type="range" id="scaleSlider" min="50" max="150" value="100">
                    </div>
                </div>
                
                <div class="control-group">
                    <h3><i class="fas fa-download"></i> 导出图片</h3>
                    <div class="button-group">
                        <button class="btn" id="downloadBtn">
                            <i class="fas fa-download"></i> 下载图片
                        </button>
                        <button class="btn btn-secondary" id="resetBtn">
                            <i class="fas fa-redo"></i> 重置参数
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="preview-area">
                <div class="preview-placeholder" id="previewPlaceholder">
                    <i class="fas fa-image"></i>
                    <p>上传图片后，效果预览将显示在这里</p>
                </div>
                <img id="imagePreview" alt="原始图片预览">
                <canvas id="canvasOutput"></canvas>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2023 毛玻璃图片生成器 | 兼容所有现代浏览器，支持手机和电脑使用</p>
        </div>
    </div>

    <script>
        // DOM元素
        const imageUpload = document.getElementById('imageUpload');
        const dropArea = document.getElementById('dropArea');
        const imagePreview = document.getElementById('imagePreview');
        const canvasOutput = document.getElementById('canvasOutput');
        const previewPlaceholder = document.getElementById('previewPlaceholder');
        const blurSlider = document.getElementById('blurSlider');
        const brightnessSlider = document.getElementById('brightnessSlider');
        const scaleSlider = document.getElementById('scaleSlider');
        const blurValue = document.getElementById('blurValue');
        const brightnessValue = document.getElementById('brightnessValue');
        const scaleValue = document.getElementById('scaleValue');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');
        
        // 上下文变量
        let originalImage = null;
        const ctx = canvasOutput.getContext('2d');
        
        // 事件监听器
        dropArea.addEventListener('click', () => imageUpload.click());
        
        imageUpload.addEventListener('change', function(e) {
            if (this.files && this.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    loadImage(e.target.result);
                }
                reader.readAsDataURL(this.files[0]);
            }
        });
        
        // 拖放功能
        dropArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropArea.style.borderColor = '#a777e3';
            dropArea.style.backgroundColor = 'rgba(255, 255, 255, 0.9)';
        });
        
        dropArea.addEventListener('dragleave', () => {
            dropArea.style.borderColor = '#cbd5e0';
            dropArea.style.backgroundColor = 'rgba(255, 255, 255, 0.6)';
        });
        
        dropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dropArea.style.borderColor = '#cbd5e0';
            dropArea.style.backgroundColor = 'rgba(255, 255, 255, 0.6)';
            
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    loadImage(e.target.result);
                }
                reader.readAsDataURL(e.dataTransfer.files[0]);
            }
        });
        
        // 滑块事件
        blurSlider.addEventListener('input', updateEffect);
        brightnessSlider.addEventListener('input', updateEffect);
        scaleSlider.addEventListener('input', updateEffect);
        
        // 按钮事件
        downloadBtn.addEventListener('click', downloadImage);
        resetBtn.addEventListener('click', resetParameters);
        
        // 加载图片
        function loadImage(src) {
            originalImage = new Image();
            originalImage.onload = function() {
                previewPlaceholder.style.display = 'none';
                imagePreview.style.display = 'block';
                imagePreview.src = src;
                
                // 设置Canvas尺寸
                const maxWidth = 600;
                const maxHeight = 400;
                let width = originalImage.width;
                let height = originalImage.height;
                
                if (width > maxWidth) {
                    height = (maxWidth / width) * height;
                    width = maxWidth;
                }
                
                if (height > maxHeight) {
                    width = (maxHeight / height) * width;
                    height = maxHeight;
                }
                
                canvasOutput.width = width;
                canvasOutput.height = height;
                imagePreview.style.maxWidth = `${width}px`;
                imagePreview.style.maxHeight = `${height}px`;
                
                // 应用初始效果
                updateEffect();
            }
            originalImage.src = src;
        }
        
        // 更新效果
        function updateEffect() {
            if (!originalImage) return;
            
            // 更新显示值
            blurValue.textContent = blurSlider.value;
            brightnessValue.textContent = brightnessSlider.value;
            scaleValue.textContent = scaleSlider.value;
            
            // 获取参数值
            const blur = parseInt(blurSlider.value);
            const brightness = parseInt(brightnessSlider.value);
            const scale = parseInt(scaleSlider.value) / 100;
            
            // 清空画布
            ctx.clearRect(0, 0, canvasOutput.width, canvasOutput.height);
            
            // 应用滤镜
            ctx.filter = `blur(${blur}px) brightness(${brightness}%)`;
            
            // 计算缩放后的尺寸和位置
            const scaledWidth = originalImage.width * scale;
            const scaledHeight = originalImage.height * scale;
            const x = (canvasOutput.width - scaledWidth) / 2;
            const y = (canvasOutput.height - scaledHeight) / 2;
            
            // 绘制图像
            ctx.drawImage(originalImage, x, y, scaledWidth, scaledHeight);
            
            // 显示Canvas
            canvasOutput.style.display = 'block';
            imagePreview.style.display = 'none';
        }
        
        // 下载图片
        function downloadImage() {
            if (!originalImage) {
                alert('请先上传图片！');
                return;
            }
            
            const link = document.createElement('a');
            link.download = 'frosted-glass-effect.png';
            link.href = canvasOutput.toDataURL('image/png');
            link.click();
        }
        
        // 重置参数
        function resetParameters() {
            blurSlider.value = 10;
            brightnessSlider.value = 100;
            scaleSlider.value = 100;
            updateEffect();
        }
        
        // 初始化页面
        window.addEventListener('load', function() {
            // 加载示例图片
            loadImage('https://images.unsplash.com/photo-1501854140801-50d01698950b?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1200&q=80');
        });
    </script>
</body>
</html>
