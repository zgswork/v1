<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048 游戏</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        body {
            background: #faf8ef;
            color: #776e65;
            padding: 10px;
            max-width: 500px;
            margin: 0 auto;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 2.5rem;
            font-weight: bold;
        }
        
        .score-container {
            background: #bbada0;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
        }
        
        .score-title {
            font-size: 0.8rem;
        }
        
        .score-value {
            font-size: 1.5rem;
        }
        
        .game-intro {
            margin-bottom: 15px;
            line-height: 1.4;
        }
        
        .game-container {
            position: relative;
            background: #bbada0;
            border-radius: 6px;
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
        }
        
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-gap: 10px;
            width: 100%;
        }
        
        .grid-cell {
            background: rgba(238, 228, 218, 0.35);
            border-radius: 3px;
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
        }
        
        .tile {
            position: absolute;
            width: calc(25% - 12.5px);
            height: calc(25% - 12.5px);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 3px;
            font-size: 2rem;
            font-weight: bold;
            transition: all 0.1s ease-in-out;
            z-index: 10;
        }
        
        .tile-2 {
            background: #eee4da;
        }
        
        .tile-4 {
            background: #ede0c8;
        }
        
        .tile-8 {
            background: #f2b179;
            color: white;
        }
        
        .tile-16 {
            background: #f59563;
            color: white;
        }
        
        .tile-32 {
            background: #f67c5f;
            color: white;
        }
        
        .tile-64 {
            background: #f65e3b;
            color: white;
        }
        
        .tile-128 {
            background: #edcf72;
            color: white;
            font-size: 1.8rem;
        }
        
        .tile-256 {
            background: #edcc61;
            color: white;
            font-size: 1.8rem;
        }
        
        .tile-512 {
            background: #edc850;
            color: white;
            font-size: 1.8rem;
        }
        
        .tile-1024 {
            background: #edc53f;
            color: white;
            font-size: 1.5rem;
        }
        
        .tile-2048 {
            background: #edc22e;
            color: white;
            font-size: 1.5rem;
        }
        
        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(238, 228, 218, 0.73);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            display: none;
        }
        
        .game-over-text {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        .restart-button {
            background: #8f7a66;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 10px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
        }
        
        .restart-button:hover {
            background: #9f8b77;
        }
        
        .instructions {
            margin-top: 20px;
            line-height: 1.5;
        }
        
        @media (max-width: 400px) {
            h1 {
                font-size: 2rem;
            }
            
            .tile {
                font-size: 1.5rem;
            }
            
            .tile-128, .tile-256, .tile-512 {
                font-size: 1.3rem;
            }
            
            .tile-1024, .tile-2048 {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>2048</h1>
        <div class="score-container">
            <div class="score-title">分数</div>
            <div class="score-value" id="score">0</div>
        </div>
    </div>
    
    <p class="game-intro">
        使用方向键或滑动屏幕移动方块。当两个相同数字的方块相撞时，它们会合并成一个更大的数字！
    </p>
    
    <div class="game-container">
        <div class="grid-container">
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
        </div>
        
        <div class="game-over">
            <div class="game-over-text">游戏结束!</div>
            <button class="restart-button" onclick="resetGame()">再玩一次</button>
        </div>
    </div>
    
    <div class="instructions">
        <p><strong>游戏规则：</strong></p>
        <p>1. 使用方向键或滑动屏幕移动所有方块</p>
        <p>2. 相同数字的方块碰撞时会合并</p>
        <p>3. 每次移动后会在空白处随机出现一个2或4</p>
        <p>4. 当得到一个2048方块时获胜</p>
        <p>5. 当无法移动时游戏结束</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 初始化游戏
            initGame();
            
            // 添加触摸事件监听
            setupTouchControls();
        });
        
        // 游戏状态
        let grid = [];
        let score = 0;
        let gameOver = false;
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;
        
        // 初始化游戏
        function initGame() {
            grid = Array(4).fill().map(() => Array(4).fill(0));
            score = 0;
            gameOver = false;
            document.getElementById('score').textContent = score;
            document.querySelector('.game-over').style.display = 'none';
            
            // 清空所有方块
            const tiles = document.querySelectorAll('.tile');
            tiles.forEach(tile => tile.remove());
            
            // 添加两个初始方块
            addRandomTile();
            addRandomTile();
            
            // 渲染网格
            updateGrid();
            
            // 添加键盘事件监听
            document.addEventListener('keydown', handleKeyPress);
        }
        
        // 重置游戏
        function resetGame() {
            initGame();
        }
        
        // 添加随机方块
        function addRandomTile() {
            const emptyCells = [];
            
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (grid[i][j] === 0) {
                        emptyCells.push({row: i, col: j});
                    }
                }
            }
            
            if (emptyCells.length > 0) {
                const randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                grid[randomCell.row][randomCell.col] = Math.random() < 0.9 ? 2 : 4;
                return true;
            }
            
            return false;
        }
        
        // 更新网格显示
        function updateGrid() {
            const gameContainer = document.querySelector('.game-container');
            
            // 移除所有现有的方块
            const tiles = document.querySelectorAll('.tile');
            tiles.forEach(tile => tile.remove());
            
            // 添加新的方块
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (grid[i][j] !== 0) {
                        const value = grid[i][j];
                        const tile = document.createElement('div');
                        tile.className = `tile tile-${value}`;
                        tile.textContent = value;
                        
                        // 计算位置
                        const tileSize = gameContainer.offsetWidth / 4 - 12.5;
                        tile.style.width = `${tileSize}px`;
                        tile.style.height = `${tileSize}px`;
                        tile.style.left = `${j * (tileSize + 10) + 10}px`;
                        tile.style.top = `${i * (tileSize + 10) + 10}px`;
                        
                        gameContainer.appendChild(tile);
                    }
                }
            }
            
            // 更新分数
            document.getElementById('score').textContent = score;
            
            // 检查游戏是否结束
            if (isGameOver()) {
                endGame();
            }
        }
        
        // 处理键盘输入
        function handleKeyPress(event) {
            if (gameOver) return;
            
            let moved = false;
            
            switch (event.key) {
                case 'ArrowUp':
                    moved = moveUp();
                    break;
                case 'ArrowDown':
                    moved = moveDown();
                    break;
                case 'ArrowLeft':
                    moved = moveLeft();
                    break;
                case 'ArrowRight':
                    moved = moveRight();
                    break;
                default:
                    return;
            }
            
            if (moved) {
                addRandomTile();
                updateGrid();
            }
        }
        
        // 向上移动
        function moveUp() {
            let moved = false;
            
            for (let j = 0; j < 4; j++) {
                for (let i = 1; i < 4; i++) {
                    if (grid[i][j] !== 0) {
                        let k = i;
                        while (k > 0 && grid[k-1][j] === 0) {
                            grid[k-1][j] = grid[k][j];
                            grid[k][j] = 0;
                            k--;
                            moved = true;
                        }
                        
                        if (k > 0 && grid[k-1][j] === grid[k][j]) {
                            grid[k-1][j] *= 2;
                            score += grid[k-1][j];
                            grid[k][j] = 0;
                            moved = true;
                        }
                    }
                }
            }
            
            return moved;
        }
        
        // 向下移动
        function moveDown() {
            let moved = false;
            
            for (let j = 0; j < 4; j++) {
                for (let i = 2; i >= 0; i--) {
                    if (grid[i][j] !== 0) {
                        let k = i;
                        while (k < 3 && grid[k+1][j] === 0) {
                            grid[k+1][j] = grid[k][j];
                            grid[k][j] = 0;
                            k++;
                            moved = true;
                        }
                        
                        if (k < 3 && grid[k+1][j] === grid[k][j]) {
                            grid[k+1][j] *= 2;
                            score += grid[k+1][j];
                            grid[k][j] = 0;
                            moved = true;
                        }
                    }
                }
            }
            
            return moved;
        }
        
        // 向左移动
        function moveLeft() {
            let moved = false;
            
            for (let i = 0; i < 4; i++) {
                for (let j = 1; j < 4; j++) {
                    if (grid[i][j] !== 0) {
                        let k = j;
                        while (k > 0 && grid[i][k-1] === 0) {
                            grid[i][k-1] = grid[i][k];
                            grid[i][k] = 0;
                            k--;
                            moved = true;
                        }
                        
                        if (k > 0 && grid[i][k-1] === grid[i][k]) {
                            grid[i][k-1] *= 2;
                            score += grid[i][k-1];
                            grid[i][k] = 0;
                            moved = true;
                        }
                    }
                }
            }
            
            return moved;
        }
        
        // 向右移动
        function moveRight() {
            let moved = false;
            
            for (let i = 0; i < 4; i++) {
                for (let j = 2; j >= 0; j--) {
                    if (grid[i][j] !== 0) {
                        let k = j;
                        while (k < 3 && grid[i][k+1] === 0) {
                            grid[i][k+1] = grid[i][k];
                            grid[i][k] = 0;
                            k++;
                            moved = true;
                        }
                        
                        if (k < 3 && grid[i][k+1] === grid[i][k]) {
                            grid[i][k+1] *= 2;
                            score += grid[i][k+1];
                            grid[i][k] = 0;
                            moved = true;
                        }
                    }
                }
            }
            
            return moved;
        }
        
        // 检查游戏是否结束
        function isGameOver() {
            // 检查是否有空格
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (grid[i][j] === 0) {
                        return false;
                    }
                }
            }
            
            // 检查是否有相邻的相同数字
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (j < 3 && grid[i][j] === grid[i][j+1]) {
                        return false;
                    }
                    if (i < 3 && grid[i][j] === grid[i+1][j]) {
                        return false;
                    }
                }
            }
            
            return true;
        }
        
        // 游戏结束
        function endGame() {
            gameOver = true;
            document.querySelector('.game-over').style.display = 'flex';
        }
        
        // 设置触摸控制
        function setupTouchControls() {
            const gameContainer = document.querySelector('.game-container');
            
            gameContainer.addEventListener('touchstart', function(event) {
                touchStartX = event.touches[0].clientX;
                touchStartY = event.touches[0].clientY;
            }, false);
            
            gameContainer.addEventListener('touchend', function(event) {
                if (gameOver) return;
                
                touchEndX = event.changedTouches[0].clientX;
                touchEndY = event.changedTouches[0].clientY;
                
                handleSwipe();
            }, false);
        }
        
        // 处理滑动
        function handleSwipe() {
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;
            
            // 确定滑动方向
            if (Math.abs(dx) > Math.abs(dy)) {
                // 水平滑动
                if (dx > 50) {
                    // 向右滑动
                    if (moveRight()) {
                        addRandomTile();
                        updateGrid();
                    }
                } else if (dx < -50) {
                    // 向左滑动
                    if (moveLeft()) {
                        addRandomTile();
                        updateGrid();
                    }
                }
            } else {
                // 垂直滑动
                if (dy > 50) {
                    // 向下滑动
                    if (moveDown()) {
                        addRandomTile();
                        updateGrid();
                    }
                } else if (dy < -50) {
                    // 向上滑动
                    if (moveUp()) {
                        addRandomTile();
                        updateGrid();
                    }
                }
            }
        }
    </script>
</body>
</html>
