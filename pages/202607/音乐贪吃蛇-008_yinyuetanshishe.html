<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐贪吃蛇</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #feca57, #ff9ff3, #54a0ff, #5f27cd);
            background-size: 800% 800%;
            animation: gradientShift 8s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }

        body.game-started {
            animation: none;
            background: linear-gradient(135deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #feca57, #ff9ff3, #54a0ff, #5f27cd);
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .game-container {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 5px 15px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
            max-height: 100vh;
            overflow-y: auto;
            transform: translateY(0);
            transition: transform 0.3s ease;
            position: relative;
        }

        .game-container:hover {
            transform: translateY(-5px);
        }

        .header {
            margin-bottom: 25px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 15px;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 0 0 40px rgba(255, 215, 0, 0.4);
            font-weight: bold;
            letter-spacing: 2px;
        }

        body.game-started h1 {
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 0 0 40px rgba(255, 215, 0, 0.4);
        }

        .controls-row {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .control-group label {
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            margin-bottom: 5px;
        }

        select, button {
            padding: 12px 20px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #ffffff, #f0f0f0);
            color: #333;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.5);
            font-weight: bold;
            min-width: 120px;
        }

        select option {
            background: #333;
            color: white;
            font-weight: bold;
            padding: 8px;
        }

        select:hover, button:hover {
            background: linear-gradient(135deg, #ffffff, #e0e0e0);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 215, 0, 0.8);
        }

        select:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.7);
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px 16px;
            border-radius: 15px;
            min-width: 80px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease;
        }

        .stat-item:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.15);
        }

        .stat-item div:first-child {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 3px;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }

        .stat-item div:last-child {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .game-area {
            position: relative;
            margin: 0 auto 25px;
        }

        #gameCanvas {
            border: 3px solid rgba(255, 255, 255, 0.6);
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.4);
            display: block;
            margin: 0 auto;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            transition: box-shadow 0.3s ease;
        }

        #gameCanvas:hover {
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
        }

        .melody-info {
            margin: 20px 0;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            position: relative;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .current-note {
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
            animation: pulseText 2s ease-in-out infinite;
        }

        body.game-started .current-note {
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
        }

        @keyframes pulseText {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .melody-progress {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            max-width: 450px;
        }

        .note-indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #ffffff;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
        }

        .note-indicator.active {
            background: linear-gradient(135deg, #ffd700, #ff6b6b);
            transform: scale(1.3);
            box-shadow: 0 0 20px #ffd700, 0 4px 15px rgba(255, 215, 0, 0.8);
            animation: activePulse 1s ease-in-out infinite;
        }

        body.game-started .note-indicator.active {
            animation: activePulse 1s ease-in-out infinite;
        }

        @keyframes activePulse {
            0%, 100% { transform: scale(1.3); }
            50% { transform: scale(1.5); }
        }

        .note-indicator.collected {
            background: linear-gradient(135deg, #4CAF50, #45b7d1);
            animation: collectedBounce 0.6s ease;
        }

        @keyframes collectedBounce {
            0% { transform: scale(1); }
            25% { transform: scale(1.4); }
            50% { transform: scale(1.2); }
            75% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .game-controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ffffff, #f0f0f0);
            color: #333;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 16px;
            min-width: 100px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            font-weight: bold;
        }

        .btn:hover {
            background: linear-gradient(135deg, #ffffff, #e0e0e0);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 215, 0, 0.8);
        }

        .btn:active {
            transform: translateY(-1px) scale(1.02);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .achievements {
            margin-top: 25px;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .achievements h3 {
            margin-bottom: 15px;
            font-size: 20px;
            color: #ffd700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
            font-weight: bold;
        }

        #achievementsList {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .achievement-item {
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            font-size: 12px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            opacity: 0.7;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }

        .achievement-item.unlocked {
            background: linear-gradient(135deg, #ffd700, #ff6b6b);
            color: #333;
            transform: scale(1.1);
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.8);
            opacity: 1;
            animation: achievementUnlock 0.8s ease;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }

        @keyframes achievementUnlock {
            0% { transform: scale(1); }
            25% { transform: scale(1.3); }
            50% { transform: scale(1.1); }
            75% { transform: scale(1.2); }
            100% { transform: scale(1.1); }
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            display: none;
            z-index: 1000;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .game-over h2 {
            color: #ffd700;
            margin-bottom: 20px;
            font-size: 28px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            font-weight: bold;
        }

        .game-over p {
            margin-bottom: 20px;
            font-size: 18px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            font-weight: bold;
        }

        .difficulty-info {
            font-size: 14px;
            font-weight: bold;
            margin-top: 15px;
            line-height: 1.6;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .instructions {
            margin-top: 20px;
            font-size: 14px;
            font-weight: bold;
            line-height: 1.6;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
        }

        .achievement-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #ffd700, #ff6b6b);
            color: #333;
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1001;
            font-weight: bold;
            font-size: 16px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .achievement-notification.show {
            transform: translateX(0);
        }

        .footer-credit {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 13px;
            color: #ffd700;
            text-align: center;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }

        /* 响应式设计 */
        @media (max-width: 600px) {
            .game-container {
                padding: 20px;
                margin: 10px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            #gameCanvas {
                width: 300px;
                height: 300px;
            }
            
            .stats {
                gap: 8px;
            }
            
            .stat-item {
                padding: 8px 10px;
                min-width: 65px;
            }
        }
    </style>
</head>
<body>
    <div class="achievement-notification" id="achievementNotification">
        🏆 成就解锁！
    </div>

    <div class="game-container">
        <div class="header">
            <h1>🎵 音乐贪吃蛇</h1>
            <div class="controls-row">
                <div class="control-group">
                    <label>选择歌曲</label>
                    <select id="songSelect">
                        <option value="twinkle">✨ 小星星 (完整版)</option>
                        <option value="birthday">🎂 生日快乐 (完整版)</option>
                        <option value="mary">🐑 玛丽有只小羊羔 (完整版)</option>
                        <option value="jingle">🔔 铃儿响叮当 (完整版)</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>难度选择</label>
                    <select id="difficultySelect">
                        <option value="easy">简单模式</option>
                        <option value="hard">困难模式</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div>得分</div>
                <div id="score">0</div>
            </div>
            <div class="stat-item">
                <div>等级</div>
                <div id="level">1</div>
            </div>
            <div class="stat-item">
                <div>连击</div>
                <div id="combo">0</div>
            </div>
            <div class="stat-item">
                <div>完美</div>
                <div id="perfect">0</div>
            </div>
            <div class="stat-item">
                <div>进度</div>
                <div id="progress">0/0</div>
            </div>
        </div>

        <div class="game-area">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div class="game-over" id="gameOver">
                <h2>🎵 演奏结束</h2>
                <p>最终得分: <span id="finalScore">0</span></p>
                <button class="btn" onclick="restartAndStart()">再次演奏</button>
            </div>
        </div>

        <div class="melody-info">
            <div class="current-note" id="currentNote">选择歌曲和难度开始游戏</div>
            <div class="melody-progress" id="melodyProgress"></div>
            <div class="difficulty-info" id="difficultyInfo">
                简单模式：完整版歌曲可循环演奏<br>
                困难模式：必须按正确顺序收集所有音符
            </div>
        </div>

        <div class="game-controls">
            <button class="btn" onclick="startGame()" id="startBtn">开始演奏</button>
            <button class="btn" onclick="pauseGame()" id="pauseBtn">暂停</button>
            <button class="btn" onclick="restartGame()">重新开始</button>
        </div>

        <div class="achievements">
            <h3>🏆 成就系统</h3>
            <div id="achievementsList">
                <div class="achievement-item" id="ach-first-note" data-text="🎵 第一个音符">🎵 第一个音符</div>
                <div class="achievement-item" id="ach-perfect-5" data-text="🎯 5连完美">🎯 5连完美</div>
                <div class="achievement-item" id="ach-complete-song" data-text="🎼 完整演奏">🎼 完整演奏</div>
                <div class="achievement-item" id="ach-high-score" data-text="🏅 高分达人">🏅 高分达人</div>
                <div class="achievement-item" id="ach-master" data-text="👑 音乐大师">👑 音乐大师</div>
            </div>
        </div>

        <div class="instructions">
            使用方向键或WASD控制蛇的移动<br>
            空格键暂停/继续游戏 | 收集所有音符演奏完整歌曲<br>
            简单模式可循环演奏，困难模式只有一次机会
        </div>

        <div class="footer-credit">
            作者：林义贵，合作请洽v：vblue728
        </div>
    </div>

    <script>
        // 防止页面滚动
        document.addEventListener('keydown', (e) => {
            if(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                e.preventDefault();
            }
        });

        // 游戏变量
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // 经典歌曲旋律库 - 完整版本
        const songs = {
            twinkle: {
                name: '小星星',
                notes: [
                    'C4', 'C4', 'G4', 'G4', 'A4', 'A4', 'G4', 'F4', 'F4', 'E4', 'E4', 'D4', 'D4', 'C4',
                    'G4', 'G4', 'F4', 'F4', 'E4', 'E4', 'D4', 'G4', 'G4', 'F4', 'F4', 'E4', 'E4', 'D4',
                    'C4', 'C4', 'G4', 'G4', 'A4', 'A4', 'G4', 'F4', 'F4', 'E4', 'E4', 'D4', 'D4', 'C4'
                ],
                colors: ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#feca57', '#ff9ff3', '#54a0ff', '#5f27cd']
            },
            birthday: {
                name: '生日快乐',
                notes: [
                    'C4', 'C4', 'D4', 'C4', 'F4', 'E4', 'C4', 'C4', 'D4', 'C4', 'G4', 'F4',
                    'C4', 'C4', 'C5', 'A4', 'F4', 'F4', 'E4', 'D4', 'A#4', 'A#4', 'A4', 'F4', 'G4', 'F4'
                ],
                colors: ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#feca57', '#ff9ff3', '#54a0ff', '#5f27cd']
            },
            mary: {
                name: '玛丽有只小羊羔',
                notes: [
                    'E4', 'D4', 'C4', 'D4', 'E4', 'E4', 'E4', 'D4', 'D4', 'D4', 'E4', 'G4', 'G4',
                    'E4', 'D4', 'C4', 'D4', 'E4', 'E4', 'E4', 'D4', 'D4', 'E4', 'D4', 'C4'
                ],
                colors: ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#feca57', '#ff9ff3', '#54a0ff', '#5f27cd']
            },
            jingle: {
                name: '铃儿响叮当',
                notes: [
                    'E4', 'E4', 'E4', 'E4', 'E4', 'E4', 'E4', 'G4', 'C4', 'D4', 'E4', 'F4', 'F4', 'F4', 'F4', 'F4',
                    'E4', 'E4', 'E4', 'E4', 'D4', 'D4', 'E4', 'D4', 'G4', 'E4', 'E4', 'E4', 'E4', 'E4', 'E4', 'E4',
                    'G4', 'G4', 'G4', 'G4', 'G4', 'E4', 'D4', 'C4', 'A4', 'A4', 'A4', 'A4', 'A4', 'G4', 'F4', 'E4', 'D4', 'G4'
                ],
                colors: ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#feca57', '#ff9ff3', '#54a0ff', '#5f27cd']
            }
        };

        // 音符频率映射
        const noteFrequencies = {
            'C4': 261.63, 'C#4': 277.18, 'D4': 293.66, 'D#4': 311.13,
            'E4': 329.63, 'F4': 349.23, 'F#4': 369.99, 'G4': 392.00,
            'G#4': 415.30, 'A4': 440.00, 'A#4': 466.16, 'B4': 493.88,
            'C5': 523.25
        };

        // 游戏状态
        let snake = [{x: 10, y: 10}];
        let food = {};
        let dx = 0;
        let dy = 0;
        let gameRunning = false;
        let score = 0;
        let level = 1;
        let combo = 0;
        let perfectCount = 0;
        let currentSong = songs.twinkle;
        let currentNoteIndex = 0;
        let gameSpeed = 150;
        let difficulty = 'easy';
        let achievements = {
            firstNote: false,
            perfect5: false,
            completeSong: false,
            highScore: false,
            master: false
        };
        let gameCompleted = false;
        let gameStarted = false;
        let hasMoved = false;
        let audioContextReady = false;

        // 音频上下文
        let audioContext;

        // 初始化音频上下文
        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                audioContextReady = true;
            }
        }

        // 播放音符 - 修复第一个音无声问题
        function playNote(frequency, duration = 0.3) {
            if (!audioContextReady) {
                initAudioContext();
            }
            
            try {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = frequency;
                oscillator.type = 'sine';
                
                // 确保音量从0开始，避免第一个音无声
                gainNode.gain.setValueAtTime(0, audioContext.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.3, audioContext.currentTime + 0.01);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + duration);
            } catch (error) {
                console.error('播放音符失败:', error);
            }
        }

        // 播放完整歌曲
        function playCompleteSong(song, bpm = 120) {
            if (!gameStarted || !gameCompleted || !audioContextReady) return;
            
            try {
                const noteDuration = 60 / bpm;
                
                song.notes.forEach((note, index) => {
                    setTimeout(() => {
                        if (audioContextReady && noteFrequencies[note]) {
                            playNote(noteFrequencies[note], noteDuration * 0.8);
                        }
                    }, index * noteDuration * 1000);
                });
            } catch (error) {
                console.error('播放完整歌曲失败:', error);
            }
        }

        // 显示成就通知
        function showAchievementNotification(text) {
            const notification = document.getElementById('achievementNotification');
            notification.textContent = `🏆 ${text}`;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // 解锁成就
        function unlockAchievement(id, text) {
            const element = document.getElementById(id);
            if (element && !element.classList.contains('unlocked')) {
                element.classList.add('unlocked');
                showAchievementNotification(text);
                
                localStorage.setItem(`achievement_${id}`, 'true');
            }
        }

        // 加载已解锁成就
        function loadAchievements() {
            Object.keys(achievements).forEach(key => {
                const id = `ach-${key.replace(/([A-Z])/g, '-$1').toLowerCase()}`;
                if (localStorage.getItem(`achievement_${id}`) === 'true') {
                    const element = document.getElementById(id);
                    if (element) {
                        element.classList.add('unlocked');
                        achievements[key] = true;
                    }
                }
            });
        }

        // 更新旋律进度
        function updateMelodyProgress() {
            const progressContainer = document.getElementById('melodyProgress');
            const currentNoteText = document.getElementById('currentNote');
            
            progressContainer.innerHTML = '';
            
            if (!currentSong || !currentSong.notes) return;
            
            currentSong.notes.forEach((note, index) => {
                const indicator = document.createElement('div');
                indicator.className = 'note-indicator';
                indicator.textContent = note.replace(/\d/, '');
                
                if (index === currentNoteIndex) {
                    indicator.classList.add('active');
                    currentNoteText.textContent = `当前音符: ${note} - ${currentSong.name}`;
                } else if (index < currentNoteIndex) {
                    indicator.classList.add('collected');
                }
                
                progressContainer.appendChild(indicator);
            });
            
            document.getElementById('progress').textContent = `${currentNoteIndex}/${currentSong.notes.length}`;
        }

        // 检查成就
        function checkAchievements() {
            if (!achievements.firstNote && score > 0) {
                achievements.firstNote = true;
                unlockAchievement('ach-first-note', '第一个音符');
            }
            
            if (!achievements.perfect5 && combo >= 5) {
                achievements.perfect5 = true;
                unlockAchievement('ach-perfect-5', '5连完美');
            }
            
            if (!achievements.completeSong && gameCompleted) {
                achievements.completeSong = true;
                unlockAchievement('ach-complete-song', '完整演奏');
            }
            
            if (!achievements.highScore && score >= 500) {
                achievements.highScore = true;
                unlockAchievement('ach-high-score', '高分达人');
            }
            
            if (!achievements.master && score >= 1000) {
                achievements.master = true;
                unlockAchievement('ach-master', '音乐大师');
            }
        }

        // 初始化游戏
        function initGame() {
            snake = [{x: 10, y: 10}];
            dx = 0;
            dy = 0;
            gameRunning = false;
            score = 0;
            level = 1;
            combo = 0;
            perfectCount = 0;
            currentNoteIndex = 0;
            gameSpeed = difficulty === 'easy' ? 180 : 120;
            gameCompleted = false;
            gameStarted = false;
            hasMoved = false;
            audioContextReady = false;
            
            updateUI();
            generateFood();
            drawGame();
            updateMelodyProgress();
            updateDifficultyInfo();
            
            achievements = {
                firstNote: false,
                perfect5: false,
                completeSong: false,
                highScore: false,
                master: false
            };
            
            loadAchievements();
            
            // 重置背景动画
            document.body.classList.remove('game-started');
        }

        // 生成食物
        function generateFood() {
            if (!currentSong || !currentSong.notes) return;
            
            if (currentNoteIndex >= currentSong.notes.length) {
                if (difficulty === 'easy') {
                    gameCompleted = true;
                    score += 100;
                    level++;
                    gameSpeed = Math.max(100, gameSpeed - 5);
                    
                    if (gameStarted && gameCompleted) {
                        playCompleteSong(currentSong);
                    }
                    
                    setTimeout(() => {
                        currentNoteIndex = 0;
                        gameCompleted = false;
                        generateFood();
                        updateUI();
                        updateMelodyProgress();
                    }, 4000);
                } else {
                    gameCompleted = true;
                    gameOver();
                    return;
                }
            }
            
            if (currentNoteIndex < currentSong.notes.length) {
                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount),
                    note: currentSong.notes[currentNoteIndex],
                    color: currentSong.colors[currentNoteIndex % currentSong.colors.length],
                    index: currentNoteIndex
                };
                
                // 确保食物不会生成在蛇身上
                for (let segment of snake) {
                    if (segment.x === food.x && segment.y === food.y) {
                        generateFood();
                        return;
                    }
                }
            }
        }

        // 绘制游戏
        function drawGame() {
            try {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                for (let i = 0; i < snake.length; i++) {
                    const segment = snake[i];
                    
                    if (i === 0) {
                        ctx.fillStyle = '#ffffff';
                        ctx.shadowColor = '#ffffff';
                        ctx.shadowBlur = 15;
                    } else {
                        const intensity = Math.max(0.3, 1 - (i * 0.08));
                        const green = Math.floor(255 * intensity);
                        ctx.fillStyle = `rgb(50, ${green}, 50)`;
                        ctx.shadowColor = '#00ff00';
                        ctx.shadowBlur = 8;
                    }
                    
                    ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
                    
                    if (i > 0) {
                        ctx.strokeStyle = 'rgba(100, 255, 100, 0.9)';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
                    }
                }
                
                ctx.shadowBlur = 0;

                if (food && food.note) {
                    const gradient = ctx.createRadialGradient(
                        food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, 0,
                        food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2
                    );
                    gradient.addColorStop(0, food.color);
                    gradient.addColorStop(1, 'rgba(255, 255, 255, 0.8)');
                    
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(
                        food.x * gridSize + gridSize/2,
                        food.y * gridSize + gridSize/2,
                        gridSize/2 - 2,
                        0,
                        2 * Math.PI
                    );
                    ctx.fill();
                    
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 12px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(
                        food.note.replace(/\d/, ''),
                        food.x * gridSize + gridSize/2,
                        food.y * gridSize + gridSize/2 + 4
                    );
                }
            } catch (error) {
                console.error('绘制游戏失败:', error);
            }
        }

        // 更新游戏状态
        function updateGame() {
            if (!gameRunning) return;

            try {
                const head = {x: snake[0].x + dx, y: snake[0].y + dy};

                // 检查边界碰撞
                if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                    gameOver();
                    return;
                }

                // 检查自身碰撞
                for (let segment of snake) {
                    if (head.x === segment.x && head.y === segment.y) {
                        gameOver();
                        return;
                    }
                }

                snake.unshift(head);

                if (food && head.x === food.x && head.y === food.y) {
                    const expectedNote = currentSong.notes[currentNoteIndex];
                    if (food.note === expectedNote) {
                        score += 10 * (combo + 1);
                        combo++;
                        perfectCount++;
                        
                        // 修复第一个音无声问题：确保音频上下文已初始化
                        if (!audioContextReady) {
                            initAudioContext();
                        }
                        
                        if (audioContextReady && noteFrequencies[food.note]) {
                            setTimeout(() => {
                                playNote(noteFrequencies[food.note]);
                            }, 50);
                        }
                        
                        currentNoteIndex++;
                        checkAchievements();
                        
                        if (currentNoteIndex >= currentSong.notes.length) {
                            if (difficulty === 'easy') {
                                score += 200;
                                level++;
                                gameCompleted = true;
                                
                                if (gameStarted && gameCompleted) {
                                    playCompleteSong(currentSong);
                                }
                                
                                setTimeout(() => {
                                    currentNoteIndex = 0;
                                    gameCompleted = false;
                                    generateFood();
                                    updateUI();
                                    updateMelodyProgress();
                                }, 4000);
                            } else {
                                score += 500;
                                gameCompleted = true;
                                gameOver();
                                return;
                            }
                        }
                    } else {
                        combo = 0;
                        if (difficulty === 'hard') {
                            score = Math.max(0, score - 5);
                        }
                    }
                    
                    generateFood();
                    updateUI();
                    updateMelodyProgress();
                } else {
                    snake.pop();
                }

                drawGame();
            } catch (error) {
                console.error('更新游戏失败:', error);
                gameRunning = false;
            }
        }

        // 更新UI
        function updateUI() {
            try {
                document.getElementById('score').textContent = score;
                document.getElementById('level').textContent = level;
                document.getElementById('combo').textContent = combo;
                document.getElementById('perfect').textContent = perfectCount;
            } catch (error) {
                console.error('更新UI失败:', error);
            }
        }

        // 更新难度信息
        function updateDifficultyInfo() {
            try {
                const info = document.getElementById('difficultyInfo');
                const totalNotes = currentSong.notes.length;
                if (difficulty === 'easy') {
                    info.innerHTML = `简单模式：完整版 ${currentSong.name} (${totalNotes}个音符) 可循环演奏`;
                } else {
                    info.innerHTML = `困难模式：完整版 ${currentSong.name} (${totalNotes}个音符) 必须全部收集`;
                }
            } catch (error) {
                console.error('更新难度信息失败:', error);
            }
        }

        // 游戏控制
        function startGame() {
            if (!gameRunning) {
                try {
                    gameRunning = true;
                    gameStarted = true;
                    
                    // 初始化音频上下文
                    initAudioContext();
                    
                    if (dx === 0 && dy === 0) {
                        dx = 1;
                        dy = 0;
                    }
                    document.getElementById('startBtn').disabled = true;
                    document.getElementById('pauseBtn').disabled = false;
                    
                    // 停止背景动画
                    document.body.classList.add('game-started');
                    
                    gameLoop();
                } catch (error) {
                    console.error('开始游戏失败:', error);
                }
            }
        }

        function pauseGame() {
            try {
                gameRunning = !gameRunning;
                document.getElementById('startBtn').disabled = gameRunning;
                document.getElementById('pauseBtn').textContent = gameRunning ? '暂停' : '继续';
                if (gameRunning) gameLoop();
            } catch (error) {
                console.error('暂停游戏失败:', error);
            }
        }

        function restartGame() {
            try {
                gameRunning = false;
                document.getElementById('gameOver').style.display = 'none';
                document.getElementById('startBtn').disabled = false;
                document.getElementById('pauseBtn').disabled = false;
                document.getElementById('pauseBtn').textContent = '暂停';
                initGame();
            } catch (error) {
                console.error('重新开始游戏失败:', error);
            }
        }

        function restartAndStart() {
            try {
                restartGame();
                setTimeout(() => {
                    startGame();
                }, 100);
            } catch (error) {
                console.error('重新开始并启动失败:', error);
            }
        }

        function gameOver() {
            try {
                gameRunning = false;
                document.getElementById('finalScore').textContent = score;
                document.getElementById('gameOver').style.display = 'block';
                document.getElementById('startBtn').disabled = false;
                document.getElementById('pauseBtn').disabled = true;
                
                // 只在真正完成时播放完整歌曲
                if (gameStarted && gameCompleted) {
                    playCompleteSong(currentSong);
                }
            } catch (error) {
                console.error('游戏结束失败:', error);
            }
        }

        // 游戏循环
        let gameInterval;
        function gameLoop() {
            if (gameRunning) {
                try {
                    updateGame();
                    setTimeout(gameLoop, gameSpeed);
                } catch (error) {
                    console.error('游戏循环失败:', error);
                    gameRunning = false;
                }
            }
        }

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                e.preventDefault();
            }

            try {
                switch(e.key) {
                    case 'ArrowUp':
                    case 'w':
                    case 'W':
                        if (dy !== 1) { 
                            dx = 0; 
                            dy = -1; 
                            if (!hasMoved) {
                                hasMoved = true;
                                document.body.classList.add('game-started');
                            }
                        }
                        break;
                    case 'ArrowDown':
                    case 's':
                    case 'S':
                        if (dy !== -1) { 
                            dx = 0; 
                            dy = 1; 
                            if (!hasMoved) {
                                hasMoved = true;
                                document.body.classList.add('game-started');
                            }
                        }
                        break;
                    case 'ArrowLeft':
                    case 'a':
                    case 'A':
                        if (dx !== 1) { 
                            dx = -1; 
                            dy = 0; 
                            if (!hasMoved) {
                                hasMoved = true;
                                document.body.classList.add('game-started');
                            }
                        }
                        break;
                    case 'ArrowRight':
                    case 'd':
                    case 'D':
                        if (dx !== -1) { 
                            dx = 1; 
                            dy = 0; 
                            if (!hasMoved) {
                                hasMoved = true;
                                document.body.classList.add('game-started');
                            }
                        }
                        break;
                    case ' ':
                        e.preventDefault();
                        pauseGame();
                        break;
                }
            } catch (error) {
                console.error('键盘控制失败:', error);
            }
        });

        // 歌曲选择
        document.getElementById('songSelect').addEventListener('change', (e) => {
            try {
                currentSong = songs[e.target.value];
                restartGame();
            } catch (error) {
                console.error('选择歌曲失败:', error);
            }
        });

        // 难度选择
        document.getElementById('difficultySelect').addEventListener('change', (e) => {
            try {
                difficulty = e.target.value;
                restartGame();
            } catch (error) {
                console.error('选择难度失败:', error);
            }
        });

        // 初始化
        try {
            loadAchievements();
            initGame();
        } catch (error) {
            console.error('初始化失败:', error);
        }
    </script>
</body>
</html>
