<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中英翻译工具</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', 'SF Pro', 'Segoe UI', '微软雅黑', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #222;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      backdrop-filter: blur(10px);
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 2rem;
      text-align: center;
      position: relative;
    }
    .header h1 {
      margin: 0;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .header p {
      margin: 0.5rem 0 0 0;
      opacity: 0.9;
      font-size: 1.1rem;
    }

    .main-content { padding: 2rem; }
    .input-section {
      margin-bottom: 2rem;
      background: #f8f9fa;
      border-radius: 15px;
      padding: 1.5rem;
      border: 1px solid #e9ecef;
    }
    .input-section h3 {
      margin: 0 0 1rem 0;
      color: #495057;
      font-size: 1.2rem;
    }
    textarea {
      width: 100%;
      min-height: 120px;
      font-size: 1rem;
      padding: 1rem;
      border-radius: 10px;
      border: 1px solid #dee2e6;
      resize: vertical;
      font-family: inherit;
      background: white;
      box-sizing: border-box;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }
    textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .controls {
      display: flex;
      justify-content: center;
      margin: 1.5rem 0;
    }
    .btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 1rem 2rem;
      font-size: 1.1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .result-section {
      background: #f8f9fa;
      border-radius: 15px;
      padding: 1.5rem;
      border: 1px solid #e9ecef;
      margin-bottom: 1.5rem;
    }
    .result-section h3 {
      margin: 0 0 1rem 0;
      color: #495057;
      font-size: 1.2rem;
    }
    .result {
      min-height: 80px;
      background: white;
      border-radius: 10px;
      border: 1px solid #dee2e6;
      padding: 1rem;
      font-size: 1rem;
      color: #2563eb;
      margin-bottom: 1rem;
      white-space: pre-wrap;
      line-height: 1.6;
      overflow-y: auto;
      max-height: 200px;
    }
    .result-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .action-btn {
      background: #28a745;
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      min-width: 120px;
      justify-content: center;
    }
    .action-btn:hover {
      background: #218838;
      transform: translateY(-1px);
    }
    .status {
      text-align: center;
      padding: 1rem;
      margin: 1rem 0;
      border-radius: 10px;
      font-weight: 500;
    }
    .status.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .status.processing {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffeaa7;
    }
    @media (max-width: 768px) {
      body {
        padding: 10px;
      }
      .main-content {
        padding: 1.5rem;
      }
      .result-actions {
        flex-direction: column;
        align-items: center;
      }
      .action-btn {
        width: 100%;
        max-width: 200px;
        justify-content: center;
      }
    }
    @media (max-width: 480px) {
      .header h1 {
        font-size: 1.8rem;
      }
      .main-content {
        padding: 1rem;
      }
      .input-section, .result-section {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">

      <h1>🌐 中英翻译工具</h1>
      <p>智能API翻译，支持中英文双向翻译</p>
    </div>
    
    <div class="main-content">
      <!-- 输入区域 -->
      <div class="input-section">
        <h3>📝 输入内容</h3>
        <textarea id="translator-input" placeholder="请输入中文或英文..."></textarea>
      </div>

      <!-- 状态显示 -->
      <div id="status" class="status info" style="display: none;">
        准备就绪，请输入内容开始翻译
      </div>

      <!-- 控制按钮 -->
      <div class="controls">
        <button class="btn" id="translator-btn">
          🌎 开始翻译
        </button>
      </div>

      <!-- 结果区域 -->
      <div class="result-section">
        <h3>🎯 翻译结果</h3>
        <div class="result" id="translator-result">翻译结果将在这里显示...</div>
        <div class="result-actions">
          <button class="action-btn" id="copy-btn">
            📋 复制文本
          </button>
        </div>
      </div>
    </div>
  </div>
  <script>
    // 显示状态信息
    function showStatus(type, message) {
      const statusElement = document.getElementById('status');
      statusElement.className = `status ${type}`;
      statusElement.textContent = message;
      statusElement.style.display = 'block';
      
      // 3秒后自动隐藏非错误状态
      if (type !== 'error') {
        setTimeout(() => {
          if (statusElement.style.display !== 'none') {
            statusElement.style.display = 'none';
          }
        }, 3000);
      }
    }
    
    // 使用百度翻译开放API（jsonp）
    document.getElementById('translator-btn').onclick = function() {
      const input = document.getElementById('translator-input').value.trim();
      const resultBox = document.getElementById('translator-result');
      const translateBtn = document.getElementById('translator-btn');
      
      if (!input) { 
        showStatus('error', '请输入内容');
        return; 
      }
      
      // 禁用按钮并显示加载状态
      translateBtn.disabled = true;
      translateBtn.innerHTML = '🔄 翻译中...';
      resultBox.textContent = '翻译中...';
      showStatus('processing', '正在翻译，请稍候...');
      
      // 自动识别中英文
      const zhReg = /[\u4e00-\u9fa5]/;
      const isZh = zhReg.test(input);
      const from = isZh ? 'zh-CHS' : 'en';
      const to = isZh ? 'en' : 'zh-CHS';
      
      fetch(`https://aidemo.youdao.com/trans`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: `q=${encodeURIComponent(input)}&from=${from}&to=${to}`
      })
      .then(r => r.json())
      .then(data => {
        if (data && data.translation && data.translation[0]) {
          resultBox.textContent = data.translation[0];
          showStatus('success', '翻译完成！');
        } else {
          resultBox.textContent = '翻译失败';
          showStatus('error', '翻译失败，请稍后重试');
        }
      })
      .catch(() => {
        resultBox.textContent = '网络错误或API不可用';
        showStatus('error', '网络错误或API不可用，请检查网络连接');
      })
      .finally(() => {
        // 恢复按钮状态
        translateBtn.disabled = false;
        translateBtn.innerHTML = '🌎 开始翻译';
      });
    };

    document.getElementById('copy-btn').onclick = function() {
      const text = document.getElementById('translator-result').textContent;
      if (!text || text === '翻译失败' || text === '网络错误或API不可用' || text === '请输入内容' || text === '翻译中...' || text === '翻译结果将在这里显示...') {
        showStatus('info', '暂无可复制的翻译结果');
        return;
      }
      
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
          showStatus('success', '翻译结果已复制到剪贴板');
        }).catch(() => {
          showStatus('error', '复制失败，请手动选择文本');
        });
      } else {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showStatus('success', '翻译结果已复制到剪贴板');
      }
    };
    
    // 页面加载后自动聚焦输入框
    document.addEventListener('DOMContentLoaded', function() {
      const inputElement = document.getElementById('translator-input');
      inputElement.focus();
      
      // 添加回车键快捷翻译支持
      inputElement.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && e.ctrlKey) {
          e.preventDefault();
          document.getElementById('translator-btn').click();
        }
      });
      
      console.log('🌐 中英翻译工具已加载完成');
      console.log('💡 提示：使用 Ctrl+Enter 快捷键即可开始翻译');
    });
  </script>
</body>
</html>
