<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纯前端文件差异比对工具</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.18/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --success: #4cc9f0;
            --danger: #f72585;
            --warning: #ff9e00;
            --light: #f8f9fa;
            --dark: #212529;
            --background: #ffffff;
            --card-bg: #ffffff;
            --text: #333333;
            --border: #dee2e6;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        .dark-theme {
            --primary: #4895ef;
            --secondary: #3a0ca3;
            --success: #4cc9f0;
            --danger: #ff7096;
            --warning: #ffb703;
            --light: #343a40;
            --dark: #f8f9fa;
            --background: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --border: #444444;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 30px 0;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.8;
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 30px var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .tabs {
            display: flex;
            background: var(--light);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .tab {
            padding: 15px 25px;
            cursor: pointer;
            font-weight: 600;
            border-bottom: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tab.active {
            border-bottom: 3px solid var(--primary);
            color: var(--primary);
            background: var(--card-bg);
        }

        .card-body {
            padding: 30px;
        }

        .file-upload-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .file-upload-area {
                grid-template-columns: 1fr;
            }
        }

        .upload-box {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            background: var(--light);
            transition: all 0.3s;
        }

        .upload-box:hover {
            border-color: var(--primary);
            background: rgba(67, 97, 238, 0.05);
        }

        .upload-icon {
            font-size: 3.5rem;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .upload-title {
            font-size: 1.3rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .file-input {
            display: none;
        }

        .btn {
            padding: 12px 25px;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
            margin-top: 15px;
            position: relative;
            z-index: 10;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--secondary);
            transform: translateY(-2px);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #d00058;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            pointer-events: none;
        }
        
        .btn:active {
            transform: scale(0.98);
        }

        .file-info {
            margin-top: 15px;
            padding: 12px;
            background: rgba(67, 97, 238, 0.1);
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
        }

        .compare-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            background: var(--success);
            color: white;
            border-radius: 50px;
        }

        .compare-btn:hover {
            background: #3ab0d3;
            transform: translateY(-2px);
        }

        .results {
            display: none;
            margin-top: 40px;
            border-top: 1px solid var(--border);
            padding-top: 30px;
        }

        .result-title {
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.5rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .result-content {
            background: var(--light);
            border-radius: 12px;
            padding: 25px;
            min-height: 400px;
            overflow: auto;
            position: relative;
        }

        .text-diff {
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            line-height: 1.8;
        }

        .diff-added {
            background: rgba(76, 201, 240, 0.3);
            text-decoration: underline;
        }

        .diff-removed {
            background: rgba(247, 37, 133, 0.3);
            text-decoration: line-through;
        }

        .image-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .image-box {
            flex: 1;
            min-width: 300px;
            text-align: center;
        }

        .image-box h3 {
            margin-bottom: 15px;
            color: var(--primary);
        }

        .image-preview {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
            box-shadow: 0 5px 15px var(--shadow);
        }

        .diff-image-container {
            margin-top: 30px;
            text-align: center;
        }

        .diff-image {
            max-width: 100%;
            max-height: 500px;
            border-radius: 8px;
            box-shadow: 0 5px 15px var(--shadow);
        }

        .table-container {
            overflow: auto;
            max-height: 500px;
        }

        .diff-table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
        }

        .diff-table th {
            background: var(--primary);
            color: white;
            padding: 12px;
            text-align: left;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .diff-table td {
            padding: 10px;
            border: 1px solid var(--border);
            vertical-align: top;
        }

        .diff-table tr:nth-child(even) {
            background: rgba(0, 0, 0, 0.03);
        }

        /* 行号样式 */
        .line-number {
            background: #f8f9fa;
            color: #6c757d;
            text-align: center;
            font-weight: bold;
            min-width: 60px;
            user-select: none;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        }
        
        /* 行内容样式 */
        .line-content {
            white-space: pre-wrap;
            word-break: break-all;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        }
        
        /* 差异行样式 */
        .diff-line-added {
            background-color: rgba(40, 167, 69, 0.1);
        }
        
        .diff-line-removed {
            background-color: rgba(220, 53, 69, 0.1);
        }
        
        .diff-line-modified {
            background-color: rgba(255, 193, 7, 0.1);
        }
        
        .diff-line-added .line-number {
            background-color: rgba(40, 167, 69, 0.2);
            color: #28a745;
        }
        
        .diff-line-removed .line-number {
            background-color: rgba(220, 53, 69, 0.2);
            color: #dc3545;
        }
        
        .diff-line-modified .line-number {
            background-color: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }
        
        /* 修改内容样式 */
        .diff-modified {
            background-color: rgba(255, 193, 7, 0.2);
            padding: 2px 4px;
            border-radius: 3px;
        }
        
        /* 高亮显示差异内容的样式 */
        .diff-added-highlight {
            background-color: rgba(40, 167, 69, 0.3);
            color: #155724;
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: bold;
        }
        
        .diff-removed-highlight {
            background-color: rgba(220, 53, 69, 0.3);
            color: #721c24;
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: bold;
        }
        
        .diff-unchanged {
            color: var(--text);
        }
        
        /* Markdown内容样式 */
        .markdown-content {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        .cell-added {
            background: rgba(76, 201, 240, 0.3);
        }

        .cell-removed {
            background: rgba(247, 37, 133, 0.3);
        }

        .cell-changed {
            background: rgba(255, 158, 0, 0.3);
        }
        
        /* 文本差异显示容器 */
        .text-diff-with-lines,
        .markdown-diff-with-lines {
            max-height: 600px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
        }
        
        /* 拆分视图样式 */
        .text-diff-split-view {
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }
        
        .diff-container {
            display: flex;
            max-height: 600px;
        }
        
        .diff-column {
            flex: 1;
            border-right: 1px solid var(--border);
        }
        
        .diff-column:last-child {
            border-right: none;
        }
        
        .diff-column h4 {
            margin: 0;
            padding: 12px 15px;
            background: var(--secondary);
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }
        
        .diff-content {
            overflow-y: auto;
            max-height: 550px;
        }
        
        .diff-line {
            display: flex;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            min-height: 20px;
            line-height: 20px;
        }
        
        .diff-line .line-number {
            flex-shrink: 0;
            width: 50px;
            padding: 2px 8px;
            background: #f8f9fa;
            border-right: 1px solid var(--border);
            text-align: center;
            font-size: 12px;
            color: #6c757d;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            user-select: none;
        }
        
        .diff-line .line-content {
            flex: 1;
            padding: 2px 8px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            word-break: break-all;
            white-space: pre-wrap;
        }
        
        /* 行状态样式 */
        .line-added {
            background-color: rgba(40, 167, 69, 0.1);
        }
        
        .line-removed {
            background-color: rgba(220, 53, 69, 0.1);
        }
        
        .line-unchanged {
            background-color: transparent;
        }
        
        .line-added .line-number {
            background-color: rgba(40, 167, 69, 0.2);
            color: #28a745;
            font-weight: bold;
        }
        
        .line-removed .line-number {
            background-color: rgba(220, 53, 69, 0.2);
            color: #dc3545;
            font-weight: bold;
        }
        
        /* Word文档差异显示 */
        .word-diff {
            line-height: 1.6;
            font-family: Arial, sans-serif;
        }
        
        .word-diff p {
            margin: 10px 0;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px 0;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(67, 97, 238, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .theme-switch {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 8px 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            box-shadow: 0 2px 10px var(--shadow);
            z-index: 100;
        }

        .footer {
            text-align: center;
            padding: 30px 0;
            color: var(--text);
            opacity: 0.7;
            font-size: 0.9rem;
        }

        .diff-stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: var(--light);
            border-radius: 8px;
            padding: 15px;
            min-width: 150px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            margin: 10px 0;
        }

        .added-stat .stat-value {
            color: var(--success);
        }

        .removed-stat .stat-value {
            color: var(--danger);
        }

        .changed-stat .stat-value {
            color: var(--warning);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="theme-switch" id="themeToggle">
            <i class="fas fa-moon"></i>
            <span>深色模式</span>
        </div>
        
        <header>
            <h1><i class="fas fa-file-contract"></i> 文件差异比对工具</h1>
            <p class="subtitle">在浏览器中直接比对图片、文本、Word、Excel和Markdown文件，无需上传到服务器</p>
        </header>
        
        <div class="card">
            <div class="tabs" id="fileTabs">
                <div class="tab active" data-type="text">
                    <i class="fas fa-font"></i> 文本文件
                </div>
                <div class="tab" data-type="image">
                    <i class="fas fa-image"></i> 图片
                </div>
                <div class="tab" data-type="word">
                    <i class="fas fa-file-word"></i> Word文档
                </div>
                <div class="tab" data-type="excel">
                    <i class="fas fa-file-excel"></i> Excel表格
                </div>
                <div class="tab" data-type="markdown">
                    <i class="fab fa-markdown"></i> Markdown
                </div>
            </div>
            
            <div class="card-body">
                <div class="file-upload-area">
                    <div class="upload-box" id="file1Box">
                        <div class="upload-icon">
                            <i class="fas fa-file-upload"></i>
                        </div>
                        <div class="upload-title">原始文件</div>
                        <p>拖放文件或点击上传</p>
                        <input type="file" class="file-input" id="file1Input">
                        <button class="btn btn-primary" id="file1Btn">
                            <i class="fas fa-upload"></i> 选择文件
                        </button>
                        <div class="file-info" id="file1Info">未选择文件</div>
                    </div>
                    
                    <div class="upload-box" id="file2Box">
                        <div class="upload-icon">
                            <i class="fas fa-file-upload"></i>
                        </div>
                        <div class="upload-title">修改文件</div>
                        <p>拖放文件或点击上传</p>
                        <input type="file" class="file-input" id="file2Input">
                        <button class="btn btn-primary" id="file2Btn">
                            <i class="fas fa-upload"></i> 选择文件
                        </button>
                        <div class="file-info" id="file2Info">未选择文件</div>
                    </div>
                </div>
                
                <div class="actions">
                    <button class="btn compare-btn" id="compareBtn" disabled>
                        <i class="fas fa-exchange-alt"></i> 开始比对
                    </button>
                    <button class="btn btn-danger" id="resetBtn">
                        <i class="fas fa-redo"></i> 重置
                    </button>
                </div>
                
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>正在比对文件，请稍候...</p>
                </div>
                
                <div class="results" id="results">
                    <h2 class="result-title"><i class="fas fa-search"></i> 比对结果</h2>
                    
                    <div class="diff-stats" id="diffStats">
                        <div class="stat-card added-stat">
                            <div>新增内容</div>
                            <div class="stat-value" id="addedCount">0</div>
                            <div>行/元素</div>
                        </div>
                        <div class="stat-card removed-stat">
                            <div>删除内容</div>
                            <div class="stat-value" id="removedCount">0</div>
                            <div>行/元素</div>
                        </div>
                        <div class="stat-card changed-stat">
                            <div>修改内容</div>
                            <div class="stat-value" id="changedCount">0</div>
                            <div>处</div>
                        </div>
                    </div>
                    
                    <div class="result-content" id="resultContent">
                        <!-- 结果将动态显示在这里 -->
                    </div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2023 纯前端文件差异比对工具 | 所有操作在浏览器中完成，文件不会上传到任何服务器</p>
        </div>
    </div>

    <script>
        /**
         * 使用 jQuery 重构的文件差异比对工具
         * 提供更好的兼容性和稳定性
         */
        $(document).ready(function() {
            console.log('jQuery 加载完成，开始初始化页面');
            
                    /**
         * 简化版文本差异比对实现
         * 用于替代外部 diff 库
         */
    const SimpleDiff = {
        /**
         * 按行比较两个文本，返回带行号的差异数组
         * @param {string} text1 - 原始文本
         * @param {string} text2 - 修改后文本
         * @returns {Array} 差异数组
         */
        diffLines: function(text1, text2) {
            const lines1 = text1.split('\n');
            const lines2 = text2.split('\n');
            const result = [];
            
            let i = 0, j = 0;
            let lineNum1 = 1, lineNum2 = 1;
            
            while (i < lines1.length || j < lines2.length) {
                if (i >= lines1.length) {
                    // 新增行
                    result.push({
                        added: true,
                        value: lines2[j],
                        count: 1,
                        lineNum1: null,
                        lineNum2: lineNum2
                    });
                    j++;
                    lineNum2++;
                } else if (j >= lines2.length) {
                    // 删除行
                    result.push({
                        removed: true,
                        value: lines1[i],
                        count: 1,
                        lineNum1: lineNum1,
                        lineNum2: null
                    });
                    i++;
                    lineNum1++;
                } else if (lines1[i] === lines2[j]) {
                    // 相同行
                    result.push({
                        value: lines1[i],
                        count: 1,
                        lineNum1: lineNum1,
                        lineNum2: lineNum2
                    });
                    i++;
                    j++;
                    lineNum1++;
                    lineNum2++;
                } else {
                    // 不同行，简单处理为修改
                    result.push({
                        removed: true,
                        value: lines1[i],
                        count: 1,
                        lineNum1: lineNum1,
                        lineNum2: null
                    });
                    result.push({
                        added: true,
                        value: lines2[j],
                        count: 1,
                        lineNum1: null,
                        lineNum2: lineNum2
                    });
                    i++;
                    j++;
                    lineNum1++;
                    lineNum2++;
                }
            }
            
            return result;
        },

        /**
         * 按字符比较两个文本，用于Word文档的精细比较
         * @param {string} text1 - 原始文本
         * @param {string} text2 - 修改后文本
         * @returns {Array} 差异数组
         */
        diffChars: function(text1, text2) {
            const result = [];
            let i = 0, j = 0;
            
            while (i < text1.length || j < text2.length) {
                if (i >= text1.length) {
                    // 新增字符
                    let addedText = '';
                    while (j < text2.length) {
                        addedText += text2[j];
                        j++;
                    }
                    if (addedText) {
                        result.push({
                            added: true,
                            value: addedText,
                            count: addedText.length
                        });
                    }
                } else if (j >= text2.length) {
                    // 删除字符
                    let removedText = '';
                    while (i < text1.length) {
                        removedText += text1[i];
                        i++;
                    }
                    if (removedText) {
                        result.push({
                            removed: true,
                            value: removedText,
                            count: removedText.length
                        });
                    }
                } else if (text1[i] === text2[j]) {
                    // 相同字符
                    let sameText = '';
                    while (i < text1.length && j < text2.length && text1[i] === text2[j]) {
                        sameText += text1[i];
                        i++;
                        j++;
                    }
                    result.push({
                        value: sameText,
                        count: sameText.length
                    });
                } else {
                    // 不同字符，找到下一个匹配点
                    let removedText = text1[i];
                    let addedText = text2[j];
                    i++;
                    j++;
                    
                    // 简单的启发式：继续收集不同的字符直到找到匹配
                    while (i < text1.length && j < text2.length && text1[i] !== text2[j]) {
                        removedText += text1[i];
                        addedText += text2[j];
                        i++;
                        j++;
                    }
                    
                    result.push({
                        removed: true,
                        value: removedText,
                        count: removedText.length
                    });
                    result.push({
                        added: true,
                        value: addedText,
                        count: addedText.length
                    });
                }
            }
            
            return result;
        }
    };

        /**
         * 简化版图片像素比较实现
         * 用于替代 pixelmatch 库
         * @param {Uint8ClampedArray} img1 - 第一张图片的像素数据
         * @param {Uint8ClampedArray} img2 - 第二张图片的像素数据
         * @param {Uint8ClampedArray} output - 输出差异图像数据
         * @param {number} width - 图片宽度
         * @param {number} height - 图片高度
         * @param {Object} options - 选项
         * @returns {number} 不同像素的数量
         */
        function simplePixelMatch(img1, img2, output, width, height, options = {}) {
            const threshold = options.threshold || 0.1;
            let diffCount = 0;
            
            for (let i = 0; i < img1.length; i += 4) {
                const r1 = img1[i], g1 = img1[i + 1], b1 = img1[i + 2];
                const r2 = img2[i], g2 = img2[i + 1], b2 = img2[i + 2];
                
                // 计算颜色差异
                const dr = r1 - r2;
                const dg = g1 - g2;
                const db = b1 - b2;
                const delta = Math.sqrt(dr * dr + dg * dg + db * db) / 255;
                
                if (delta > threshold) {
                    // 标记为不同像素（红色高亮）
                    output[i] = 255;     // R
                    output[i + 1] = 0;   // G
                    output[i + 2] = 0;   // B
                    output[i + 3] = 255; // A
                    diffCount++;
                } else {
                    // 保持原始像素，但降低透明度
                    output[i] = img1[i];
                    output[i + 1] = img1[i + 1];
                    output[i + 2] = img1[i + 2];
                    output[i + 3] = 100; // 降低透明度
                }
            }
            
            return Math.floor(diffCount / 4); // 返回像素数量而非字节数量
        }

        async function compareImages() {

            // 创建canvas用于显示差异
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            const height = Math.max(img1.height, img2.height);
            canvas.width = width;
            canvas.height = height;
            
            // 绘制原始图像
            ctx.drawImage(img1, 0, 0);
            const imgData1 = ctx.getImageData(0, 0, width, height);
            
            // 绘制修改后图像

            ctx.drawImage(img2, 0, 0);

                imgData1.data, 
                imgData2.data, 
                diffData, 
                width, 
                height, 
                { threshold: 0.1 }
            );
            
            // 绘制差异
            ctx.putImageData(diff, 0, 0);

        /**

        /**
         * 读取文件内容为文本
         * @param {File} file - 要读取的文件
         * @returns {Promise<string>} 文件内容
         */
        function readFileAsText(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsText(file);
            });
        }
        
        /**
         * 创建图片对象
         * @param {File} file - 图片文件
         * @returns {Promise<HTMLImageElement>} 图片对象
         */
        function createImage(file) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = URL.createObjectURL(file);
            });
        }
        
        /**
         * 将Word文档转换为HTML
         * @param {File} file - Word文档文件
         * @returns {Promise<string>} HTML内容
         */
        function convertWordToHtml(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const arrayBuffer = e.target.result;
                    mammoth.convertToHtml({ arrayBuffer })
                        .then(result => resolve(result.value))
                        .catch(reject);
                };
                reader.onerror = reject;
                reader.readAsArrayBuffer(file);
            });
        }
        
        /**
         * 读取Excel文件数据
         * @param {File} file - Excel文件
         * @returns {Promise<Array>} 表格数据数组
         */
        async function readExcelFile(file) {
            const data = await file.arrayBuffer();
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            return XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
        }
        
        /**
         * 获取Excel单元格名称
         * @param {number} row - 行号
         * @param {number} col - 列号
         * @returns {string} 单元格名称，如 A1, B2
         */
        function getCellName(row, col) {
            const colName = String.fromCharCode(65 + col);
            return `${colName}${row + 1}`;
        }

        /**
         * 从Word HTML中提取纯文本内容，忽略样式和图片
         * @param {string} html - Word转换的HTML内容
         * @returns {string} 纯文本内容
         */
        function extractTextFromWordHtml(html) {
            // 创建临时DOM元素来解析HTML
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = html;
            
            // 移除所有图片元素
            const images = tempDiv.querySelectorAll('img');
            images.forEach(img => img.remove());
            
            // 移除所有样式属性
            const allElements = tempDiv.querySelectorAll('*');
            allElements.forEach(element => {
                element.removeAttribute('style');
                element.removeAttribute('class');
            });
            
            // 获取纯文本内容，保持段落结构
            let text = tempDiv.textContent || tempDiv.innerText || '';
            
            // 清理多余的空白字符，但保持段落分隔
            text = text.replace(/\s+/g, ' ').trim();
            text = text.replace(/\s*\n\s*/g, '\n');
            
            return text;
        }

        /**
         * 比较两个段落数组，返回差异结果
         * @param {Array<string>} paragraphs1 - 原始段落数组
         * @param {Array<string>} paragraphs2 - 修改后段落数组
         * @returns {Array} 差异数组
         */
        function compareParagraphs(paragraphs1, paragraphs2) {
            const result = [];
            let i = 0, j = 0;
            let paragraphNum1 = 1, paragraphNum2 = 1;
            
            while (i < paragraphs1.length || j < paragraphs2.length) {
                if (i >= paragraphs1.length) {
                    // 新增段落
                    result.push({
                        added: true,
                        value: paragraphs2[j],
                        paragraphNum1: null,
                        paragraphNum2: paragraphNum2
                    });
                    j++;
                    paragraphNum2++;
                } else if (j >= paragraphs2.length) {
                    // 删除段落
                    result.push({
                        removed: true,
                        value: paragraphs1[i],
                        paragraphNum1: paragraphNum1,
                        paragraphNum2: null
                    });
                    i++;
                    paragraphNum1++;
                } else {
                    // 比较段落内容
                    const para1 = paragraphs1[i].trim();
                    const para2 = paragraphs2[j].trim();
                    
                    if (para1 === para2) {
                        // 相同段落
                        result.push({
                            value: para1,
                            paragraphNum1: paragraphNum1,
                            paragraphNum2: paragraphNum2
                        });
                        i++;
                        j++;
                        paragraphNum1++;
                        paragraphNum2++;
                    } else {
                        // 检查是否是修改的段落（相似度判断）
                        const similarity = calculateSimilarity(para1, para2);
                        if (similarity > 0.5) {
                            // 认为是修改的段落
                            result.push({
                                modified: true,
                                value: `原文：${para1}\n\n修改：${para2}`,
                                paragraphNum1: paragraphNum1,
                                paragraphNum2: paragraphNum2
                            });
                            i++;
                            j++;
                            paragraphNum1++;
                            paragraphNum2++;
                        } else {
                            // 认为是删除+新增
                            result.push({
                                removed: true,
                                value: para1,
                                paragraphNum1: paragraphNum1,
                                paragraphNum2: null
                            });
                            result.push({
                                added: true,
                                value: para2,
                                paragraphNum1: null,
                                paragraphNum2: paragraphNum2
                            });
                            i++;
                            j++;
                            paragraphNum1++;
                            paragraphNum2++;
                        }
                    }
                }
            }
            
            return result;
        }

        /**
         * 计算两个字符串的相似度
         * @param {string} str1 - 字符串1
         * @param {string} str2 - 字符串2
         * @returns {number} 相似度（0-1之间）
         */
        function calculateSimilarity(str1, str2) {
            if (str1 === str2) return 1;
            if (str1.length === 0 || str2.length === 0) return 0;
            
            const longer = str1.length > str2.length ? str1 : str2;
            const shorter = str1.length > str2.length ? str2 : str1;
            
            if (longer.length === 0) return 1;
            
            const editDistance = levenshteinDistance(longer, shorter);
            return (longer.length - editDistance) / longer.length;
        }

        /**
         * 计算编辑距离（Levenshtein距离）
         * @param {string} str1 - 字符串1
         * @param {string} str2 - 字符串2
         * @returns {number} 编辑距离
         */
        function levenshteinDistance(str1, str2) {
            const matrix = [];
            
            for (let i = 0; i <= str2.length; i++) {
                matrix[i] = [i];
            }
            
            for (let j = 0; j <= str1.length; j++) {
                matrix[0][j] = j;
            }
            
            for (let i = 1; i <= str2.length; i++) {
                for (let j = 1; j <= str1.length; j++) {
                    if (str2.charAt(i - 1) === str1.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(
                            matrix[i - 1][j - 1] + 1,
                            matrix[i][j - 1] + 1,
                            matrix[i - 1][j] + 1
                        );
                    }
                }
            }
            
            return matrix[str2.length][str1.length];
        }
