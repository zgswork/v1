<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时间成本计算器</title>
    <style>
        /* 全局样式和响应式设计 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        .container {
            background-color: #ffffff;
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
            transition: all 0.3s ease;
        }

        /* 顶部的警示语 */
        .warning-header {
            font-size: 1.5em;
            font-weight: bold;
            color: #d93025; /* 红色 */
            margin-bottom: 25px;
        }
        
        /* 结果显示区域 */
        .results {
            margin-bottom: 20px;
        }

        /* 成本消耗的主显示区域 */
        #costDisplay {
            font-size: 3.5em;
            font-weight: bold;
            color: #d93025; /* 红色 */
            margin: 15px 0;
            letter-spacing: 1px;
            min-height: 70px; /* 防止字体跳动 */
        }
        
        /* 每分钟收入的次要信息显示 */
        #rateDisplay {
            font-size: 1em;
            color: #666;
            min-height: 1.2em; /* 防止内容为空时跳动 */
        }

        /* 按钮组样式 */
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .button-group button {
            padding: 12px 15px;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }
        
        .button-group button:active {
            transform: scale(0.98);
        }

        #startButton {
            background-color: #28a745; /* 绿色 */
            color: white;
        }
        #startButton:hover {
            background-color: #218838;
        }

        #pauseButton {
            background-color: #ffc107; /* 黄色 */
            color: #333;
        }
        #pauseButton:hover {
            background-color: #e0a800;
        }

        #resetButton {
            background-color: #dc3545; /* 红色 */
            color: white;
        }
        #resetButton:hover {
            background-color: #c82333;
        }
        
        /* 输入区域样式 */
        #input-form {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1em;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.25);
        }

        /* 作者信息样式 (新增) */
        .author-info {
            margin-top: 25px;
            font-size: 1em; /* 字体清晰 */
            color: #888; /* 颜色柔和不突兀 */
            word-break: break-all; /* 适配移动端，防止长邮箱破坏布局 */
        }

        /* 移动端适配 */
        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            .warning-header {
                font-size: 1.3em;
            }
            #costDisplay {
                font-size: 2.8em;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="warning-header">时间永不逆转，每一秒皆是成本。</h1>

        <div class="results">
            <div id="costDisplay">-0.00元</div>
            <div id="rateDisplay"></div>
        </div>

        <div class="button-group">
            <button id="startButton">开始计时</button>
            <button id="pauseButton">暂停</button>
            <button id="resetButton">重置</button>
        </div>

        <div id="input-form">
            <div class="input-group">
                <label for="monthlyIncome">每月总收入 (元)</label>
                <input type="number" id="monthlyIncome" placeholder="例如: 10000">
            </div>
            <div class="input-group">
                <label for="monthlyHours">每月总工时 (小时)</label>
                <input type="number" id="monthlyHours" placeholder="例如: 160">
            </div>
            <div class="input-group">
                <label for="dailyHours">每日平均工时 (小时)</label>
                <input type="number" id="dailyHours" placeholder="例如: 8 (仅供参考)">
            </div>
        </div>

        <!-- 作者信息 (新增) -->
        <div class="author-info">
            作者：acid5 | 合作邮箱：<a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="417374707376717170780130306f222e2c">[email&#160;protected]</a>
        </div>

    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 获取所有需要的HTML元素
        const monthlyIncomeInput = document.getElementById('monthlyIncome');
        const monthlyHoursInput = document.getElementById('monthlyHours');
        const startButton = document.getElementById('startButton');
        const pauseButton = document.getElementById('pauseButton');
        const resetButton = document.getElementById('resetButton');
        const costDisplay = document.getElementById('costDisplay');
        const rateDisplay = document.getElementById('rateDisplay');

        // 定义状态变量
        let incomePerMinute = 0;
        let timerInterval = null;
        let elapsedSeconds = 0;
        let isRunning = false;

        // --- 功能函数 ---

        function calculateRate() {
            const monthlyIncome = parseFloat(monthlyIncomeInput.value);
            const monthlyHours = parseFloat(monthlyHoursInput.value);

            if (isNaN(monthlyIncome) || monthlyIncome <= 0) {
                alert('请输入有效的每月总收入！');
                return false;
            }
            if (isNaN(monthlyHours) || monthlyHours <= 0) {
                alert('请输入有效的每月总工时！');
                return false;
            }

            incomePerMinute = monthlyIncome / (monthlyHours * 60);
            rateDisplay.textContent = `根据您的输入，您的每分钟价值约为 ${incomePerMinute.toFixed(2)} 元`;
            return true;
        }

        function updateTimer() {
            elapsedSeconds++;
            const currentCost = (elapsedSeconds / 60) * incomePerMinute;
            costDisplay.textContent = `-${currentCost.toFixed(2)}元`;
        }

        function lockInputs(lock) {
            monthlyIncomeInput.disabled = lock;
            monthlyHoursInput.disabled = lock;
            document.getElementById('dailyHours').disabled = lock;
        }
        
        // --- 事件监听器 ---

        startButton.addEventListener('click', () => {
            if (isRunning) return;

            if (elapsedSeconds === 0) {
                if (!calculateRate()) {
                    return;
                }
            }
            
            isRunning = true;
            lockInputs(true);
            timerInterval = setInterval(updateTimer, 1000); 
        });

        pauseButton.addEventListener('click', () => {
            if (!isRunning) return;

            isRunning = false;
            clearInterval(timerInterval);
        });

        resetButton.addEventListener('click', () => {
            isRunning = false;
            clearInterval(timerInterval);
            
            elapsedSeconds = 0;
            incomePerMinute = 0;
            
            costDisplay.textContent = '-0.00元';
            rateDisplay.textContent = '';
            
            lockInputs(false);
        });
    </script>

</body>
</html>
