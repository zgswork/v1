<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>儿童任务大转盘</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Comic Sans MS', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #6ecbf5 0%, #e5a2f2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #333;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        header {
            text-align: center;
            margin: 20px 0 30px;
            width: 100%;
            animation: float 3s ease-in-out infinite;
        }
        
        h1 {
            font-size: 3.5rem;
            color: #ff6b6b;
            text-shadow: 3px 3px 0 #ffd166, 6px 6px 0 rgba(0,0,0,0.1);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        
        .subtitle {
            font-size: 1.8rem;
            color: #5f6caf;
            margin: 10px 0;
            text-shadow: 1px 1px 2px white;
        }
        
        .game-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            width: 100%;
        }
        
        .wheel-section {
            flex: 1;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 8px solid #ffd166;
        }
        
        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 20px auto 30px;
        }
        
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            border: 10px solid #ffd166;
            box-shadow: 0 0 25px rgba(0,0,0,0.2);
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            transform: rotate(0deg);
            background: white;
        }
        
        .section {
            position: absolute;
            width: 50%;
            height: 50%;
            transform-origin: bottom right;
            left: 0;
            top: 0;
            border: 1px solid rgba(255,255,255,0.3);
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            padding: 15px 0;
        }
        
        .pointer {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            z-index: 10;
        }
        
        .pointer:before {
            content: '↓';
            position: absolute;
            font-size: 40px;
            color: #ff6b6b;
            text-shadow: 0 0 8px rgba(255,107,107,0.7);
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 15px;
            width: 100%;
        }
        
        .btn-spin {
            background: linear-gradient(to bottom, #5f6caf, #3a4468);
            color: white;
            border: none;
            padding: 18px 45px;
            font-size: 26px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #2c334e;
            transition: all 0.1s;
            font-weight: bold;
            letter-spacing: 1px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn-spin:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #2c334e;
        }
        
        .btn-spin:disabled {
            background: #cccccc;
            box-shadow: 0 6px 0 #999999;
            cursor: not-allowed;
            transform: none;
        }
        
        .counter {
            font-size: 24px;
            color: #5f6caf;
            margin: 15px 0;
            background: white;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .info-section {
            flex: 1;
            min-width: 320px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 8px solid #ffd166;
        }
        
        .info-section h2 {
            color: #ff6b6b;
            font-size: 2.2rem;
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 3px dashed #ffd166;
            padding-bottom: 15px;
        }
        
        .task-list {
            list-style: none;
            padding: 0 15px;
        }
        
        .task-list li {
            font-size: 18px;
            margin: 15px 0;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.08);
        }
        
        .task-list li i {
            font-size: 24px;
            width: 40px;
            height: 40px;
            background: #5f6caf;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .result-popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 0 40px rgba(0,0,0,0.3);
            text-align: center;
            z-index: 100;
            animation: pop 0.6s;
            border: 10px solid #ffd166;
            max-width: 90%;
            width: 400px;
        }
        
        @keyframes pop {
            0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
            70% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
        
        .result-title {
            color: #ff6b6b;
            font-size: 36px;
            margin-bottom: 15px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
        }
        
        .result-prize {
            font-size: 44px;
            margin: 25px 0;
            font-weight: bold;
            color: #5f6caf;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        
        .btn-close {
            background: linear-gradient(to bottom, #1DD1A1, #10ac84);
            color: white;
            border: none;
            padding: 14px 35px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 4px 0 #0a7a5c;
            transition: all 0.1s;
            margin-top: 15px;
        }
        
        .btn-close:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #0a7a5c;
        }
        
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: #f00;
            opacity: 0;
            z-index: 9999;
            pointer-events: none;
        }
        
        .character {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 120px;
            z-index: 5;
            animation: bounce 2s infinite alternate;
        }
        
        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-20px); }
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        
        .pulse {
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        @media (max-width: 768px) {
            .game-container {
                flex-direction: column;
                align-items: center;
            }
            
            h1 {
                font-size: 2.8rem;
            }
            
            .subtitle {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎡 儿童任务大转盘 🎡</h1>
            <div class="subtitle">完成任务，享受乐趣！每天3次机会</div>
        </header>
        
        <div class="game-container">
            <div class="wheel-section">
                <div class="wheel-container">
                    <div class="wheel" id="wheel">
                        <!-- 转盘扇区将通过JS动态生成 -->
                    </div>
                    <div class="pointer"></div>
                </div>
                
                <div class="controls">
                    <button class="btn-spin pulse" id="spinBtn">
                        <i class="fas fa-sync-alt"></i> 开始抽奖
                    </button>
                    <div class="counter">
                        <i class="fas fa-ticket-alt"></i>
                        <span id="counter">剩余抽奖机会: 3次</span>
                    </div>
                </div>
            </div>
            
            <div class="info-section">
                <h2><i class="fas fa-tasks"></i> 今日任务</h2>
                <ul class="task-list">
                    <li><i class="fas fa-book"></i> 完成数学作业</li>
                    <li><i class="fas fa-book-open"></i> 阅读30分钟</li>
                    <li><i class="fas fa-broom"></i> 打扫自己的房间</li>
                    <li><i class="fas fa-utensils"></i> 帮忙准备晚餐</li>
                    <li><i class="fas fa-recycle"></i> 垃圾分类处理</li>
                    <li><i class="fas fa-paw"></i> 照顾宠物</li>
                    <li><i class="fas fa-seedling"></i> 给植物浇水</li>
                    <li><i class="fas fa-shopping-basket"></i> 整理购物袋</li>
                </ul>
            </div>
        </div>
        
        <div class="result-popup" id="resultPopup">
            <div class="result-title">🎉 抽奖结果 🎉</div>
            <div>你获得了：</div>
            <div class="result-prize" id="resultPrize"></div>
            <button class="btn-close" id="closeBtn">知道了</button>
        </div>
    </div>
    
    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Ccircle cx='100' cy='100' r='90' fill='%23FFD166'/%3E%3Ccircle cx='70' cy='80' r='10' fill='%23333'/%3E%3Ccircle cx='130' cy='80' r='10' fill='%23333'/%3E%3Cpath d='M60 120 Q100 150 140 120' stroke='%23333' stroke-width='8' fill='none'/%3E%3C/svg%3E" alt="Fun Character" class="character">
    
    <script>
        // 任务配置
        const tasks = [
            { text: "🧹 打扫房间", color: "#FF9FF3", emoji: "🧹" },
            { text: "📚 完成作业", color: "#48DBFB", emoji: "📚" },
            { text: "🍽️ 洗碗", color: "#1DD1A1", emoji: "🍽️" },
            { text: "🧺 洗衣服", color: "#FECA57", emoji: "🧺" },
            { text: "🗑️ 倒垃圾", color: "#FF9F43", emoji: "🗑️" },
            { text: "🛏️ 整理床铺", color: "#F368E0", emoji: "🛏️" },
            { text: "🪴 给植物浇水", color: "#00D2D3", emoji: "🪴" },
            { text: "谢谢参与", color: "#C4C4C4", emoji: "🎁" }
        ];
        
        // 游戏状态
        let spinCount = 3;
        let canSpin = true;
        const spinBtn = document.getElementById('spinBtn');
        const wheel = document.getElementById('wheel');
        const resultPopup = document.getElementById('resultPopup');
        const resultPrize = document.getElementById('resultPrize');
        const counter = document.getElementById('counter');
        
        // 初始化转盘
        function initWheel() {
            wheel.innerHTML = '';
            const sectionAngle = 360 / tasks.length;
            
            tasks.forEach((task, index) => {
                const section = document.createElement('div');
                section.className = 'section';
                section.style.backgroundColor = task.color;
                section.style.transform = `rotate(${sectionAngle * index}deg)`;
                
                // 调整文字方向
                const contentDiv = document.createElement('div');
                contentDiv.style.transform = `rotate(${sectionAngle/2}deg)`;
                contentDiv.style.textAlign = 'center';
                contentDiv.style.width = '100px';
                
                const emoji = document.createElement('div');
                emoji.style.fontSize = '30px';
                emoji.textContent = task.emoji;
                
                const text = document.createElement('div');
                text.style.fontSize = '16px';
                text.textContent = task.text;
                text.style.marginTop = '5px';
                text.style.fontWeight = 'bold';
                
                contentDiv.appendChild(emoji);
                contentDiv.appendChild(text);
                section.appendChild(contentDiv);
                wheel.appendChild(section);
            });
        }
        
        // 旋转转盘
        function spinWheel() {
            if (!canSpin) return;
            
            canSpin = false;
            spinBtn.disabled = true;
            spinCount--;
            counter.textContent = `剩余抽奖机会: ${spinCount}次`;
            
            // 随机决定旋转角度（5-10圈 + 随机奖品位置）
            const spinAngle = 1800 + Math.floor(Math.random() * 360);
            wheel.style.transform = `rotate(${-spinAngle}deg)`;
            
            // 旋转结束后显示结果
            setTimeout(() => {
                const taskIndex = calculateTaskIndex(spinAngle % 360);
                showResult(tasks[taskIndex].text);
                
                // 创建五彩纸屑效果
                createConfetti();
            }, 4000);
        }
        
        // 计算任务索引
        function calculateTaskIndex(finalAngle) {
            const sectionAngle = 360 / tasks.length;
            // 调整指针位置（默认指针在顶部）
            const adjustedAngle = (finalAngle + 90) % 360;
            return Math.floor(adjustedAngle / sectionAngle);
        }
        
        // 显示结果
        function showResult(task) {
            resultPrize.textContent = task;
            resultPopup.style.display = 'block';
            
            // 语音播报（如果浏览器支持）
            if ('speechSynthesis' in window) {
                const speech = new SpeechSynthesisUtterance();
                speech.text = `恭喜获得 ${task}`;
                speech.lang = 'zh-CN';
                speech.rate = 0.9;
                window.speechSynthesis.speak(speech);
            }
            
            // 检查是否还有机会
            if (spinCount > 0) {
                canSpin = true;
                spinBtn.disabled = false;
            } else {
                spinBtn.textContent = "机会已用完";
            }
        }
        
        // 关闭结果弹窗
        function closePopup() {
            resultPopup.style.display = 'none';
        }
        
        // 创建五彩纸屑效果
        function createConfetti() {
            const colors = ['#ff6b6b', '#5f6caf', '#1DD1A1', '#FECA57', '#FF9F43', '#F368E0'];
            const container = document.body;
            
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = `${Math.random() * 100}%`;
                confetti.style.top = '-10px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                confetti.style.width = `${Math.random() * 10 + 5}px`;
                confetti.style.height = confetti.style.width;
                
                container.appendChild(confetti);
                
                // 动画效果
                const animation = confetti.animate([
                    { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
                    { transform: `translateY(${window.innerHeight + 100}px) rotate(${Math.random() * 360}deg)`, opacity: 0 }
                ], {
                    duration: Math.random() * 3000 + 2000,
                    easing: 'cubic-bezier(0,0.9,0.57,1)',
                });
                
                animation.onfinish = () => confetti.remove();
            }
        }
        
        // 事件监听
        spinBtn.addEventListener('click', spinWheel);
        document.getElementById('closeBtn').addEventListener('click', closePopup);
        
        // 触摸设备支持
        let touchStartY = 0;
        wheel.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        });
        wheel.addEventListener('touchend', (e) => {
            if (e.changedTouches[0].clientY - touchStartY < -50 && canSpin) {
                spinWheel();
            }
        });
        
        // 初始化
        initWheel();
        
        // 添加键盘支持
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && canSpin) {
                spinWheel();
            }
        });
    </script>
</body>
</html>
