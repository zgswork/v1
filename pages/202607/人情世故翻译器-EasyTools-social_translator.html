<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人情世故翻译器 - EasyTools</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            padding: 40px;
        }

        .input-section {
            margin-bottom: 30px;
        }

        .input-section label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #555;
        }

        .input-area {
            width: 100%;
            min-height: 120px;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
            transition: border-color 0.3s ease;
        }

        .input-area:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .translate-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin: 20px 0;
        }

        .translate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .translate-btn:active {
            transform: translateY(0);
        }

        .result-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            min-height: 120px;
            border-left: 4px solid #667eea;
        }

        .result-section h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .result-text {
            font-size: 16px;
            line-height: 1.6;
            color: #333;
        }

        .examples {
            margin-top: 30px;
            padding: 20px;
            background: #f0f2f5;
            border-radius: 10px;
        }

        .examples h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .example-item {
            margin-bottom: 15px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .example-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .example-original {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .example-translation {
            color: #666;
            font-style: italic;
        }

        .copy-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
            transition: background 0.3s ease;
        }

        .copy-btn:hover {
            background: #218838;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 15px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 2em;
            }

            .main-content {
                padding: 20px;
            }

            .input-area {
                min-height: 100px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .main-content {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗣️ 人情世故翻译器</h1>
            <p>将弦外之音转换成大白话，让沟通更直接明了</p>
        </div>

        <div class="main-content">
            <div class="input-section">
                <label for="inputText">请输入需要翻译的话：</label>
                <textarea id="inputText" class="input-area" placeholder="例如：改天请你吃饭..."></textarea>
            </div>

            <button class="translate-btn" onclick="translateText()">🔄 翻译成大白话</button>

            <div class="result-section" id="resultSection" style="display: none;">
                <h3>📝 翻译结果：</h3>
                <div class="result-text" id="resultText"></div>
                <button class="copy-btn" onclick="copyResult()">📋 复制结果</button>
            </div>

            <div class="examples">
                <h3>💡 常见示例（点击可直接使用）：</h3>
                
                <div class="example-item" onclick="useExample('改天请你吃饭')">
                    <div class="example-original">"改天请你吃饭"</div>
                    <div class="example-translation">→ 我不想请你吃饭，只是客套话</div>
                </div>

                <div class="example-item" onclick="useExample('你真厉害')">
                    <div class="example-original">"你真厉害"</div>
                    <div class="example-translation">→ 我觉得你做得不怎么样，但不好直说</div>
                </div>

                <div class="example-item" onclick="useExample('有空再聊')">
                    <div class="example-original">"有空再聊"</div>
                    <div class="example-translation">→ 我不想继续这个话题了</div>
                </div>

                <div class="example-item" onclick="useExample('你看着办吧')">
                    <div class="example-original">"你看着办吧"</div>
                    <div class="example-translation">→ 我对你的决定不满意，但不想直接反对</div>
                </div>

                <div class="example-item" onclick="useExample('随便你')">
                    <div class="example-original">"随便你"</div>
                    <div class="example-translation">→ 我很生气，但不想争论了</div>
                </div>

                <div class="example-item" onclick="useExample('没关系的')">
                    <div class="example-original">"没关系的"</div>
                    <div class="example-translation">→ 其实我很在意，但不想让你觉得我小气</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 翻译规则库
        const translationRules = {
            '改天请你吃饭': '我不想请你吃饭，只是客套话',
            '改天吃饭': '我不想请你吃饭，只是客套话',
            '有空再聊': '我不想继续这个话题了',
            '有时间再说': '我不想继续这个话题了',
            '你真厉害': '我觉得你做得不怎么样，但不好直说',
            '你好棒': '我觉得你做得不怎么样，但不好直说',
            '你看着办吧': '我对你的决定不满意，但不想直接反对',
            '你决定就好': '我对你的决定不满意，但不想直接反对',
            '随便你': '我很生气，但不想争论了',
            '随你便': '我很生气，但不想争论了',
            '没关系的': '其实我很在意，但不想让你觉得我小气',
            '没事的': '其实我很在意，但不想让你觉得我小气',
            '不用了谢谢': '我真的不需要，请不要再坚持了',
            '不用麻烦了': '我真的不需要，请不要再坚持了',
            '我考虑一下': '我基本上不会同意，但不想直接拒绝',
            '我想想': '我基本上不会同意，但不想直接拒绝',
            '再说吧': '我基本上不会同意，但不想直接拒绝',
            '看情况': '我基本上不会同意，但不想直接拒绝',
            '你辛苦了': '这是你应该做的，我只是客套一下',
            '麻烦你了': '这是你应该做的，我只是客套一下',
            '还行吧': '我觉得不怎么样，但不想说得太直接',
            '还可以': '我觉得不怎么样，但不想说得太直接',
            '挺好的': '我觉得不怎么样，但不想说得太直接',
            '不错': '我觉得不怎么样，但不想说得太直接',
            '我没意见': '我有意见，但不想直接表达',
            '都可以': '我有意见，但不想直接表达',
            '无所谓': '我有意见，但不想直接表达',
            '你忙你的': '我希望你能关注我，但不想直说',
            '你去忙吧': '我希望你能关注我，但不想直说',
            '我一个人就行': '我希望你能陪我，但不想直说',
            '不用陪我': '我希望你能陪我，但不想直说',
            '你真会说话': '你这话听起来很假，但我不想直接拆穿',
            '你嘴真甜': '你这话听起来很假，但我不想直接拆穿',
            '呵呵': '我对你的话感到无语或不屑',
            '哦': '我对你的话不感兴趣或有些不满',
            '好的吧': '我不太情愿，但勉强同意',
            '行吧': '我不太情愿，但勉强同意',
            '那就这样吧': '我不太满意这个结果，但不想再争论了'
        };

        function translateText() {
            const inputText = document.getElementById('inputText').value.trim();
            const resultSection = document.getElementById('resultSection');
            const resultText = document.getElementById('resultText');

            if (!inputText) {
                alert('请输入需要翻译的内容！');
                return;
            }

            let translation = findTranslation(inputText);
            
            if (!translation) {
                translation = analyzeText(inputText);
            }

            resultText.textContent = translation;
            resultSection.style.display = 'block';
            resultSection.scrollIntoView({ behavior: 'smooth' });
        }

        function findTranslation(text) {
            // 精确匹配
            if (translationRules[text]) {
                return translationRules[text];
            }

            // 模糊匹配
            for (let key in translationRules) {
                if (text.includes(key) || key.includes(text)) {
                    return translationRules[key];
                }
            }

            return null;
        }

        function analyzeText(text) {
            // 基于关键词的智能分析
            const patterns = [
                { keywords: ['改天', '有空', '下次'], translation: '我不想现在做这件事，可能以后也不会做' },
                { keywords: ['随便', '无所谓', '都行'], translation: '我其实有偏好，但不想直接表达' },
                { keywords: ['没关系', '没事', '不要紧'], translation: '我其实很在意，但不想显得小气' },
                { keywords: ['考虑', '想想', '再说'], translation: '我倾向于拒绝，但不想直接说不' },
                { keywords: ['辛苦', '麻烦'], translation: '这是客套话，表示礼貌' },
                { keywords: ['还行', '还可以', '不错'], translation: '我觉得一般，但不想说得太直接' },
                { keywords: ['呵呵', '哈哈'], translation: '我对此感到无语或不以为然' },
                { keywords: ['你忙', '不用陪'], translation: '我其实希望得到更多关注' }
            ];

            for (let pattern of patterns) {
                if (pattern.keywords.some(keyword => text.includes(keyword))) {
                    return pattern.translation;
                }
            }

            return '这句话可能包含一些隐含意思，建议结合具体情境来理解。常见的弦外之音包括：客套、委婉拒绝、表达不满但不想直说、希望得到关注等。';
        }

        function useExample(text) {
            document.getElementById('inputText').value = text;
            translateText();
        }

        function copyResult() {
            const resultText = document.getElementById('resultText').textContent;
            navigator.clipboard.writeText(resultText).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✅ 已复制';
                btn.style.background = '#28a745';
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.background = '#28a745';
                }, 2000);
            }).catch(() => {
                alert('复制失败，请手动复制结果');
            });
        }

        // 回车键快捷翻译
        document.getElementById('inputText').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && e.ctrlKey) {
                translateText();
            }
        });
    </script>
</body>
</html>
