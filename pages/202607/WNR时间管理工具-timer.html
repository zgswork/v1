<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WNR 时间管理工具</title>
    <style>
        :root {
            --primary-color: #4CAF50;
            --dark-color: #388E3C;
            --light-color: #C8E6C9;
            --text-color: #333;
            --bg-color: #f5f5f5;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: all 0.3s;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 拟态化设计 */
        .neumorphic {
            background: var(--bg-color);
            border-radius: 15px;
            box-shadow: 8px 8px 15px #d9d9d9, -8px -8px 15px #ffffff;
            padding: 20px;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
        }

        .tab-container {
            display: flex;
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 20px;
            background-color: var(--light-color);
            border: none;
            border-radius: 5px 5px 0 0;
            cursor: pointer;
            margin-right: 5px;
            transition: all 0.3s;
        }

        .tab.active {
            background-color: var(--primary-color);
            color: white;
        }

        .timer-display {
            font-size: 4rem;
            text-align: center;
            margin: 20px 0;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background-color: var(--dark-color);
        }

        .settings {
            margin-top: 20px;
        }

        .setting-item {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        .mini-mode {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: move;
        }

        .dark-mode {
            --bg-color: #2d2d2d;
            --text-color: #f5f5f5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>WNR 时间管理工具</h1>
        
        <div class="neumorphic">
            <div class="tab-container">
                <button class="tab active" onclick="switchTab('countdown')">倒计时</button>
                <button class="tab" onclick="switchTab('stopwatch')">正计时</button>
                <button class="tab" onclick="switchTab('pomodoro')">番茄钟</button>
                <button class="tab" onclick="switchTab('schedule')">课程表</button>
            </div>

            <!-- 倒计时 -->
            <div id="countdown" class="tab-content">
                <div class="timer-display">00:00</div>
                <div class="controls">
                    <button onclick="startCountdown()">开始</button>
                    <button onclick="pauseCountdown()">暂停</button>
                    <button onclick="resetCountdown()">重置</button>
                </div>
                <div class="settings">
                    <div class="setting-item">
                        <label for="countdown-time">设置时间 (分钟):</label>
                        <input type="number" id="countdown-time" min="1" value="25">
                    </div>
                </div>
            </div>

            <!-- 正计时 -->
            <div id="stopwatch" class="tab-content" style="display:none;">
                <div class="timer-display">00:00:00</div>
                <div class="controls">
                    <button onclick="startStopwatch()">开始</button>
                    <button onclick="pauseStopwatch()">暂停</button>
                    <button onclick="resetStopwatch()">重置</button>
                </div>
            </div>

            <!-- 番茄钟 -->
            <div id="pomodoro" class="tab-content" style="display:none;">
                <div class="timer-display">25:00</div>
                <div class="controls">
                    <button onclick="startPomodoro()">开始</button>
                    <button onclick="pausePomodoro()">暂停</button>
                    <button onclick="resetPomodoro()">重置</button>
                </div>
                <div class="settings">
                    <div class="setting-item">
                        <label for="work-time">工作时间 (分钟):</label>
                        <input type="number" id="work-time" min="1" value="25">
                    </div>
                    <div class="setting-item">
                        <label for="break-time">休息时间 (分钟):</label>
                        <input type="number" id="break-time" min="1" value="5">
                    </div>
                </div>
            </div>

            <!-- 课程表 -->
            <div id="schedule" class="tab-content" style="display:none;">
                <div class="settings">
                    <div class="setting-item">
                        <label for="schedule-name">课程名称:</label>
                        <input type="text" id="schedule-name">
                    </div>
                    <div class="setting-item">
                        <label for="schedule-time">时间:</label>
                        <input type="time" id="schedule-time">
                    </div>
                    <div class="setting-item">
                        <label for="schedule-days">重复:</label>
                        <select id="schedule-days" multiple>
                            <option value="1">周一</option>
                            <option value="2">周二</option>
                            <option value="3">周三</option>
                            <option value="4">周四</option>
                            <option value="5">周五</option>
                            <option value="6">周六</option>
                            <option value="0">周日</option>
                        </select>
                    </div>
                    <button onclick="addSchedule()">添加课程</button>
                </div>
                <div id="schedule-list"></div>
            </div>
        </div>

        <div class="neumorphic settings">
            <h2>设置</h2>
            <div class="setting-item">
                <label>
                    <input type="checkbox" id="dark-mode" onchange="toggleDarkMode()"> 深色模式
                </label>
            </div>
            <div class="setting-item">
                <label>
                    <input type="checkbox" id="mini-mode" onchange="toggleMiniMode()"> 迷你模式
                </label>
            </div>
            <div class="setting-item">
                <label>
                    <input type="checkbox" id="focus-mode" onchange="toggleFocusMode()"> 专注模式
                </label>
            </div>
            <div class="setting-item">
                <label for="notification-sound">通知铃声:</label>
                <select id="notification-sound">
                    <option value="bell">铃声</option>
                    <option value="beep">蜂鸣</option>
                    <option value="chime">钟声</option>
                </select>
            </div>
        </div>
    </div>

    <!-- 迷你模式 -->
    <div id="mini-timer" class="neumorphic mini-mode" style="display:none;">
        <div class="timer-display" style="font-size:1.5rem;">00:00</div>
        <button style="padding:5px 10px;" onclick="exitMiniMode()">退出</button>
    </div>

    <script>
        // 全局变量
        let currentTab = 'countdown';
        let countdownInterval, stopwatchInterval, pomodoroInterval;
        let countdownTime = 0, stopwatchTime = 0, pomodoroTime = 0;
        let isPomodoroWorking = true;
        let isFocusMode = false;
        let schedules = [];

        // 切换标签页
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.style.display = 'none';
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.getElementById(tabName).style.display = 'block';
            document.querySelector(`.tab[onclick="switchTab('${tabName}')"]`).classList.add('active');
            currentTab = tabName;
        }

        // 倒计时功能
        function startCountdown() {
            const minutes = parseInt(document.getElementById('countdown-time').value);
            countdownTime = minutes * 60;
            updateCountdownDisplay();
            
            clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                if (countdownTime > 0) {
                    countdownTime--;
                    updateCountdownDisplay();
                } else {
                    clearInterval(countdownInterval);
                    playNotificationSound();
                }
            }, 1000);
        }

        function pauseCountdown() {
            clearInterval(countdownInterval);
        }

        function resetCountdown() {
            clearInterval(countdownInterval);
            countdownTime = parseInt(document.getElementById('countdown-time').value) * 60;
            updateCountdownDisplay();
        }

        function updateCountdownDisplay() {
            const minutes = Math.floor(countdownTime / 60);
            const seconds = countdownTime % 60;
            document.querySelector('#countdown .timer-display').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            if (document.getElementById('mini-mode').checked) {
                document.querySelector('#mini-timer .timer-display').textContent = 
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }
        }

        // 正计时功能
        function startStopwatch() {
            clearInterval(stopwatchInterval);
            stopwatchInterval = setInterval(() => {
                stopwatchTime++;
                updateStopwatchDisplay();
            }, 1000);
        }

        function pauseStopwatch() {
            clearInterval(stopwatchInterval);
        }

        function resetStopwatch() {
            clearInterval(stopwatchInterval);
            stopwatchTime = 0;
            updateStopwatchDisplay();
        }

        function updateStopwatchDisplay() {
            const hours = Math.floor(stopwatchTime / 3600);
            const minutes = Math.floor((stopwatchTime % 3600) / 60);
            const seconds = stopwatchTime % 60;
            document.querySelector('#stopwatch .timer-display').textContent = 
                `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        // 番茄钟功能
        function startPomodoro() {
            const workMinutes = parseInt(document.getElementById('work-time').value);
            const breakMinutes = parseInt(document.getElementById('break-time').value);
            
            isPomodoroWorking = true;
            pomodoroTime = workMinutes * 60;
            updatePomodoroDisplay();
            
            clearInterval(pomodoroInterval);
            pomodoroInterval = setInterval(() => {
                if (pomodoroTime > 0) {
                    pomodoroTime--;
                    updatePomodoroDisplay();
                } else {
                    playNotificationSound();
                    if (isPomodoroWorking) {
                        // 工作时间结束，切换到休息时间
                        isPomodoroWorking = false;
                        pomodoroTime = breakMinutes * 60;
                    } else {
                        // 休息时间结束，切换到工作时间
                        isPomodoroWorking = true;
                        pomodoroTime = workMinutes * 60;
                    }
                    updatePomodoroDisplay();
                }
            }, 1000);
        }

        function pausePomodoro() {
            clearInterval(pomodoroInterval);
        }

        function resetPomodoro() {
            clearInterval(pomodoroInterval);
            isPomodoroWorking = true;
            pomodoroTime = parseInt(document.getElementById('work-time').value) * 60;
            updatePomodoroDisplay();
        }

        function updatePomodoroDisplay() {
            const minutes = Math.floor(pomodoroTime / 60);
            const seconds = pomodoroTime % 60;
            document.querySelector('#pomodoro .timer-display').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            if (isPomodoroWorking) {
                document.querySelector('#pomodoro .timer-display').style.color = 'var(--primary-color)';
            } else {
                document.querySelector('#pomodoro .timer-display').style.color = 'orange';
            }
        }

        // 课程表功能
        function addSchedule() {
            const name = document.getElementById('schedule-name').value;
            const time = document.getElementById('schedule-time').value;
            const days = Array.from(document.getElementById('schedule-days').selectedOptions)
                .map(option => parseInt(option.value));
            
            if (name && time && days.length > 0) {
                schedules.push({ name, time, days });
                renderScheduleList();
                
                // 清空输入
                document.getElementById('schedule-name').value = '';
                document.getElementById('schedule-time').value = '';
                document.getElementById('schedule-days').selectedIndex = -1;
            }
        }

        function renderScheduleList() {
            const scheduleList = document.getElementById('schedule-list');
            scheduleList.innerHTML = '';
            
            schedules.forEach((schedule, index) => {
                const scheduleItem = document.createElement('div');
                scheduleItem.className = 'neumorphic setting-item';
                scheduleItem.innerHTML = `
                    <div style="display:flex; justify-content:space-between;">
                        <div>
                            <strong>${schedule.name}</strong> - ${schedule.time}
                            <div>${getDayNames(schedule.days)}</div>
                        </div>
                        <button onclick="deleteSchedule(${index})">删除</button>
                    </div>
                `;
                scheduleList.appendChild(scheduleItem);
            });
        }

        function deleteSchedule(index) {
            schedules.splice(index, 1);
            renderScheduleList();
        }

        function getDayNames(days) {
            const dayNames = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            return days.map(day => dayNames[day]).join('、');
        }

        // 播放通知声音
        function playNotificationSound() {
            const sound = document.getElementById('notification-sound').value;
            // 实际应用中这里应该播放对应的声音文件
            console.log(`播放${sound}通知声音`);
        }

        // 切换深色模式
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }

        // 切换迷你模式
        function toggleMiniMode() {
            const miniTimer = document.getElementById('mini-timer');
            if (document.getElementById('mini-mode').checked) {
                miniTimer.style.display = 'flex';
                // 更新迷你计时器显示
                updateMiniTimer();
            } else {
                miniTimer.style.display = 'none';
            }
        }

        function updateMiniTimer() {
            if (currentTab === 'countdown') {
                updateCountdownDisplay();
            } else if (currentTab === 'stopwatch') {
                updateStopwatchDisplay();
            } else if (currentTab === 'pomodoro') {
                updatePomodoroDisplay();
            }
        }

        function exitMiniMode() {
            document.getElementById('mini-mode').checked = false;
            document.getElementById('mini-timer').style.display = 'none';
        }

        // 切换专注模式
        function toggleFocusMode() {
            isFocusMode = document.getElementById('focus-mode').checked;
            if (isFocusMode) {
                alert('专注模式已开启，将阻止其他应用干扰');
                // 实际应用中这里应该实现锁屏功能
            } else {
                alert('专注模式已关闭');
            }
        }

        // 检查课程表提醒
        function checkScheduleAlerts() {
            const now = new Date();
            const currentTime = now.getHours().toString().padStart(2, '0') + ':' + 
                               now.getMinutes().toString().padStart(2, '0');
            const currentDay = now.getDay(); // 0是周日，6是周六
            
            schedules.forEach(schedule => {
                if (schedule.time === currentTime && schedule.days.includes(currentDay)) {
                    alert(`提醒：${schedule.name}时间到了！`);
                    playNotificationSound();
                }
            });
        }

        // 每分钟检查一次课程表提醒
        setInterval(checkScheduleAlerts, 60000);

        // 初始化
        resetCountdown();
        resetStopwatch();
        resetPomodoro();
    </script>
</body>
</html>
