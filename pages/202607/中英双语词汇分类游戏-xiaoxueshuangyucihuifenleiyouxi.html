            theme: {
                extend: {
                    colors: {
                        primary: '#4361EE',
                        secondary: '#FF6B6B',

                        chinese: '#1E40AF',

    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .word-card {
                @apply bg-white rounded-lg p-2 shadow-sm cursor-pointer transition-all hover:shadow-md hover:-translate-y-0.5 select-none;

                @apply min-h-[150px] border-2 border-dashed rounded-lg p-3 transition-all;
            }
            .chinese-category {
                @apply border-chinese/50;
            }
            .english-category {
                @apply border-english/50;
            }
            .category-active {
                @apply bg-opacity-10 border-solid;

<body class="bg-gray-50 min-h-screen">

        <!-- 关卡选择 -->

                    <!-- 中文分类区域 -->

                        <!-- 中文分类将动态生成 -->

                    <!-- 中文单词区域 -->
                    <div>
                        <h3 class="font-bold mb-3">待分类单词</h3>

                    <!-- 英文单词区域 -->

                        <h3 class="font-bold mb-3">Words to Classify</h3>

            <!-- 控制按钮 -->

        <!-- 底部备注信息 -->

        </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 中文词汇数据库
        const chineseVocabulary = {
            动物: ["狗", "猫", "牛", "马", "羊", "猪", "鸡", "鸭", "老虎", "狮子", "大象", "熊猫", "猴子", "兔子", "蛇"],
            水果: ["苹果", "香蕉", "橙子", "西瓜", "草莓", "葡萄", "梨", "桃子", "芒果", "菠萝", "柠檬", "猕猴桃", "樱桃"],
            蔬菜: ["白菜", "萝卜", "土豆", "西红柿", "黄瓜", "茄子", "辣椒", "豆角", "南瓜", "冬瓜", "洋葱", "大蒜"],
            交通工具: ["自行车", "汽车", "公交车", "火车", "地铁", "飞机", "轮船", "摩托车", "出租车", "货车"],
            颜色: ["红色", "蓝色", "黄色", "绿色", "黑色", "白色", "紫色", "橙色", "粉色", "灰色"],
            家庭成员: ["爸爸", "妈妈", "爷爷", "奶奶", "外公", "外婆", "哥哥", "弟弟", "姐姐", "妹妹"],
            学校用品: ["书", "笔", "本子", "书包", "橡皮", "尺子", "铅笔", "钢笔", "彩笔", "蜡笔"],
            食物: ["米饭", "面条", "馒头", "包子", "饺子", "面包", "蛋糕", "饼干", "汉堡", "披萨"]
        };

        // 英文词汇数据库
        const englishVocabulary = {
            "Animals": ["dog", "cat", "cow", "horse", "sheep", "pig", "chicken", "duck", "tiger", "lion", "elephant", "panda", "monkey", "rabbit", "snake"],
            "Fruits": ["apple", "banana", "orange", "watermelon", "strawberry", "grape", "pear", "peach", "mango", "pineapple", "lemon", "kiwi", "cherry"],
            "Vegetables": ["cabbage", "radish", "potato", "tomato", "cucumber", "eggplant", "chili", "bean", "pumpkin", "wintermelon", "onion", "garlic"],
            "Transportation": ["bicycle", "car", "bus", "train", "subway", "plane", "ship", "motorcycle", "taxi", "truck"],
            "Colors": ["red", "blue", "yellow", "green", "black", "white", "purple", "orange", "pink", "gray"],
            "Family": ["father", "mother", "grandfather", "grandmother", "grandpa", "grandma", "brother", "sister"],
            "School Supplies": ["book", "pen", "notebook", "schoolbag", "eraser", "ruler", "pencil", "crayon"],
            "Food": ["rice", "noodles", "bread", "cake", "biscuit", "hamburger", "pizza", "chicken", "egg", "milk"]
        };

        // 关卡配置 - 10个关卡，第一关10个词，每关递增5词
        const levelsConfig = [
            { categories: 2, wordsPerCategory: 5, totalWords: 10 },   // 关卡1: 2类 × 5词 = 10词
            { categories: 2, wordsPerCategory: 7-8, totalWords: 15 }, // 关卡2: 2类 × 7-8词 = 15词
            { categories: 2, wordsPerCategory: 10, totalWords: 20 },  // 关卡3: 2类 × 10词 = 20词
            { categories: 3, wordsPerCategory: 7-8, totalWords: 25 }, // 关卡4: 3类 × 7-8词 = 25词
            { categories: 3, wordsPerCategory: 10, totalWords: 30 },  // 关卡5: 3类 × 10词 = 30词
            { categories: 4, wordsPerCategory: 8, totalWords: 35 },   // 关卡6: 4类 × 8-9词 = 35词
            { categories: 4, wordsPerCategory: 10, totalWords: 40 },  // 关卡7: 4类 × 10词 = 40词
            { categories: 5, wordsPerCategory: 9, totalWords: 45 },   // 关卡8: 5类 × 9词 = 45词
            { categories: 5, wordsPerCategory: 10, totalWords: 50 },  // 关卡9: 5类 × 10词 = 50词
            { categories: 6, wordsPerCategory: 9-10, totalWords: 55 } // 关卡10: 6类 × 9-10词 = 55词
        ];

        // 分类映射关系 (中文 -> 英文)
        const categoryMapping = {
            "动物": "Animals",
            "水果": "Fruits",
            "蔬菜": "Vegetables",
            "交通工具": "Transportation",
            "颜色": "Colors",
            "家庭成员": "Family",
            "学校用品": "School Supplies",
            "食物": "Food"
        };

        // 游戏状态
        let gameState = {
            currentLevel: 1,
            unlockedLevels: 1,
            score: 0,
            selectedWord: {
                lang: null,
                word: null
            },
            chineseData: [],  // 当前关卡中文词汇数据
            englishData: [],  // 当前关卡英文词汇数据
            completedWords: {
                chinese: 0,
                english: 0
            },
            sectionCompleted: {
                chinese: false,
                english: false
            }
        };

        // DOM元素
        const elements = {
            // 状态显示
            currentLevel: document.getElementById('current-level'),
            currentScore: document.getElementById('current-score'),
            wordCount: document.getElementById('word-count'),
            
            // 区域
            levelSelect: document.getElementById('level-select'),
            levelButtons: document.getElementById('level-buttons'),
            gameContainer: document.getElementById('game-container'),
            
            // 中文游戏区
            chineseSection: document.getElementById('chinese-section'),
            chineseCategories: document.getElementById('chinese-categories'),
            chineseWords: document.getElementById('chinese-words'),
            
            // 英文游戏区
            englishSection: document.getElementById('english-section'),
            englishCategories: document.getElementById('english-categories'),
            englishWords: document.getElementById('english-words'),
            
            // 弹窗
            levelComplete: document.getElementById('level-complete'),
            completedLevel: document.getElementById('completed-level'),
            finalScore: document.getElementById('final-score'),
            
            // 按钮
            backBtn: document.getElementById('back-btn'),
            resetBtn: document.getElementById('reset-btn'),
            playAgain: document.getElementById('play-again'),
            nextLevel: document.getElementById('next-level')
        };

        // 初始化游戏
        function initGame() {
            // 从本地存储加载状态
            loadGameState();
            
            // 更新UI
            updateGameStats();
            generateLevelButtons();
            
            // 添加事件监听
            addEventListeners();
        }

        // 生成关卡按钮
        function generateLevelButtons() {
            elements.levelButtons.innerHTML = '';
            
            for (let i = 1; i <= 10; i++) {
                const button = document.createElement('button');
                button.className = `h-12 rounded-lg font-bold transition-all ${
                    i <= gameState.unlockedLevels 
                        ? 'bg-primary text-white hover:bg-primary/80 hover:scale-105' 
                        : 'bg-gray-200 text-gray-500 cursor-not-allowed'
                }`;
                button.textContent = i;
                
                if (i <= gameState.unlockedLevels) {
                    button.addEventListener('click', () => startLevel(i));
                } else {
                    button.innerHTML = '<i class="fa fa-lock"></i>';
                }
                
                elements.levelButtons.appendChild(button);
            }
        }

        // 开始关卡
        function startLevel(levelId) {
            // 更新当前关卡
            gameState.currentLevel = levelId;
            gameState.score = 0;
            gameState.completedWords = { chinese: 0, english: 0 };
            gameState.sectionCompleted = { chinese: false, english: false };
            
            // 重置区域样式
            elements.chineseSection.classList.remove('completed-section');
            elements.englishSection.classList.remove('completed-section');
            
            // 更新状态显示
            updateGameStats();
            
            // 获取关卡配置
            const levelConfig = levelsConfig[levelId - 1];
            if (!levelConfig) return;
            
            // 生成游戏数据
            generateGameData(levelConfig);
            
            // 显示游戏区域，隐藏关卡选择
            elements.levelSelect.classList.add('hidden');
            elements.gameContainer.classList.remove('hidden');
            
            // 生成分类和单词
            generateCategories(levelConfig.categories);
            generateWords();
        }

        // 生成游戏数据
        function generateGameData(levelConfig) {
            // 获取所有分类并打乱顺序
            const allCategories = Object.keys(chineseVocabulary);
            const shuffledCategories = [...allCategories].sort(() => 0.5 - Math.random());
            
            // 选择当前关卡需要的分类数量
            const selectedCategories = shuffledCategories.slice(0, levelConfig.categories);
            
            // 为中文和英文生成词汇数据
            gameState.chineseData = [];
            gameState.englishData = [];
            
            selectedCategories.forEach(category => {
                const englishCategory = categoryMapping[category];
                
                // 获取该分类下的所有词汇
                const chineseWords = chineseVocabulary[category];
                const englishWords = englishVocabulary[englishCategory];
                
                // 计算每个分类需要的词汇数量
                let wordsNeeded = Math.round(levelConfig.totalWords / levelConfig.categories);
                
                // 随机选择词汇
                const shuffledChinese = [...chineseWords].sort(() => 0.5 - Math.random());
                const shuffledEnglish = [...englishWords].sort(() => 0.5 - Math.random());
                
                // 选取需要的词汇数量
                const selectedChinese = shuffledChinese.slice(0, wordsNeeded);
                const selectedEnglish = shuffledEnglish.slice(0, wordsNeeded);
                
                // 添加到游戏数据
                selectedChinese.forEach(word => {
                    gameState.chineseData.push({ word, category });
                });
                
                selectedEnglish.forEach(word => {
                    gameState.englishData.push({ word, category: englishCategory });
                });
            });
            
            // 打乱词汇顺序
            gameState.chineseData.sort(() => 0.5 - Math.random());
            gameState.englishData.sort(() => 0.5 - Math.random());
            
            // 确保词汇数量正确
            if (gameState.chineseData.length > levelConfig.totalWords) {
                gameState.chineseData = gameState.chineseData.slice(0, levelConfig.totalWords);
                gameState.englishData = gameState.englishData.slice(0, levelConfig.totalWords);
            }
        }

        // 生成分类区域
        function generateCategories(categoryCount) {
            // 清空现有分类
            elements.chineseCategories.innerHTML = '';
            elements.englishCategories.innerHTML = '';
            
            // 获取已选择的分类
            const chineseCategories = [...new Set(gameState.chineseData.map(item => item.category))];
            const englishCategories = chineseCategories.map(cat => categoryMapping[cat]);
            
            // 生成中文分类
            chineseCategories.forEach(category => {
                const categoryBox = createCategoryBox(category, 'chinese');
                elements.chineseCategories.appendChild(categoryBox);
            });
            
            // 生成英文分类
            englishCategories.forEach(category => {
                const categoryBox = createCategoryBox(category, 'english');
                elements.englishCategories.appendChild(categoryBox);
            });
        }

        // 创建分类框
        function createCategoryBox(category, lang) {
            const categoryBox = document.createElement('div');
            const isChinese = lang === 'chinese';
            
            categoryBox.className = `category-box ${isChinese ? 'chinese-category' : 'english-category'}`;
            categoryBox.dataset.category = category;
            categoryBox.dataset.lang = lang;
            
            // 分类标题
            const title = document.createElement('h3');
            title.className = `font-bold text-center mb-2 ${isChinese ? 'text-chinese' : 'text-english'}`;
            title.textContent = category;
            
            // 单词放置区域
            const wordsContainer = document.createElement('div');
            wordsContainer.className = 'category-words min-h-[100px]';
            
            categoryBox.appendChild(title);
            categoryBox.appendChild(wordsContainer);
            
            // 点击分类放置单词
            categoryBox.addEventListener('click', () => {
                if (gameState.selectedWord.lang && gameState.selectedWord.word) {
                    // 确保语言匹配且该部分未完成
                    if (gameState.selectedWord.lang === lang && !gameState.sectionCompleted[lang]) {
                        placeWord(gameState.selectedWord.word, category, lang);
                        gameState.selectedWord = { lang: null, word: null };
                        // 移除所有选中状态
                        document.querySelectorAll('.word-card').forEach(card => {
                            card.classList.remove('ring-2', isChinese ? 'ring-chinese' : 'ring-english');
                        });
                    }
                }
            });
            
            // 拖放功能
            categoryBox.addEventListener('dragover', (e) => {
                e.preventDefault();
                if (!gameState.sectionCompleted[lang]) {
                    categoryBox.classList.add('category-active');
                }
            });
            
            categoryBox.addEventListener('dragleave', () => {
                categoryBox.classList.remove('category-active');
            });
            
            categoryBox.addEventListener('drop', (e) => {
                e.preventDefault();
                categoryBox.classList.remove('category-active');
                
                if (gameState.sectionCompleted[lang]) return;
                
                const data = e.dataTransfer.getData('text').split('|');
                const word = data[0];
                const wordLang = data[1];
                
                // 确保语言匹配
                if (wordLang === lang) {
                    placeWord(word, category, lang);
                }
            });
            
            return categoryBox;
        }

        // 生成单词卡片
        function generateWords() {
            // 清空现有单词
            elements.chineseWords.innerHTML = '';
            elements.englishWords.innerHTML = '';
            
            // 生成中文单词
            gameState.chineseData.forEach((item, index) => {
                const wordCard = createWordCard(item.word, item.category, 'chinese', index);
                elements.chineseWords.appendChild(wordCard);
            });
            
            // 生成英文单词
            gameState.englishData.forEach((item, index) => {
                const wordCard = createWordCard(item.word, item.category, 'english', index);
                elements.englishWords.appendChild(wordCard);
            });
        }

        // 创建单词卡片
        function createWordCard(word, category, lang, index) {
            const wordCard = document.createElement('div');
            const isChinese = lang === 'chinese';
            
            wordCard.className = 'word-card m-1.5';
            wordCard.dataset.word = word;
            wordCard.dataset.category = category;
            wordCard.dataset.lang = lang;
            wordCard.textContent = word;
            wordCard.draggable = true;
            
            // 添加延迟动画效果
            wordCard.style.animation = `fadeIn 0.3s ease-out ${index * 0.05}s forwards`;
            wordCard.style.opacity = '0';
            
            // 点击选择单词
            wordCard.addEventListener('click', () => {
                // 如果该部分已完成，则不允许选择
                if (gameState.sectionCompleted[lang]) return;
                
                // 取消之前的选择
                document.querySelectorAll('.word-card').forEach(card => {
                    card.classList.remove('ring-2', isChinese ? 'ring-chinese' : 'ring-english');
                });
                
                // 选中当前单词
                gameState.selectedWord = { lang, word };
                wordCard.classList.add('ring-2', isChinese ? 'ring-chinese' : 'ring-english');
            });
            
            // 拖拽事件
            wordCard.addEventListener('dragstart', (e) => {
                // 如果该部分已完成，则不允许拖拽
                if (gameState.sectionCompleted[lang]) {
                    e.preventDefault();
                    return;
                }
                
                e.dataTransfer.setData('text', `${word}|${lang}`);
                setTimeout(() => wordCard.classList.add('opacity-50'), 0);
            });
            
            wordCard.addEventListener('dragend', () => {
                wordCard.classList.remove('opacity-50');
            });
            
            return wordCard;
        }

        // 放置单词到分类
        function placeWord(word, category, lang) {
            // 如果该部分已完成，则不允许放置
            if (gameState.sectionCompleted[lang]) return;
            
            const isChinese = lang === 'chinese';
            const wordElement = document.querySelector(`.word-card[data-word="${word}"][data-lang="${lang}"]`);
            if (!wordElement) return;
            
            // 检查是否分类正确
            const correctCategory = wordElement.dataset.category;
            const isCorrect = category === correctCategory;
            
            // 找到目标分类
            const targetCategory = document.querySelector(`.category-box[data-category="${category}"][data-lang="${lang}"] .category-words`);
            if (!targetCategory) return;
            
            // 移动单词并添加视觉反馈
            if (isCorrect) {
                // 正确分类
                wordElement.classList.add('correct-drop');
                gameState.score += 10;
                gameState.completedWords[lang]++;
            } else {
                // 错误分类（降低惩罚）
                wordElement.classList.add('wrong-drop');
                if (gameState.score >= 3) gameState.score -= 3;
            }
            
            // 更新分数
            updateGameStats();
            
            // 移动单词到分类区域
            setTimeout(() => {
                targetCategory.appendChild(wordElement);
                wordElement.removeAttribute('draggable');
                wordElement.classList.remove('cursor-pointer', 'hover:-translate-y-0.5');
                
                // 检查该语言部分是否完成
                checkSectionCompletion(lang);
                
                // 检查关卡是否完成
                checkLevelCompletion();
            }, 300);
        }

        // 检查语言部分是否完成
        function checkSectionCompletion(lang) {
            const levelConfig = levelsConfig[gameState.currentLevel - 1];
            if (gameState.completedWords[lang] >= levelConfig.totalWords) {
                gameState.sectionCompleted[lang] = true;
                
                // 标记完成的部分
                if (lang === 'chinese') {
                    elements.chineseSection.classList.add('completed-section');
                } else {
                    elements.englishSection.classList.add('completed-section');
                }
            }
        }

        // 检查关卡是否完成（任一语言完成即可）
        function checkLevelCompletion() {
            if (gameState.sectionCompleted.chinese || gameState.sectionCompleted.english) {
                setTimeout(showLevelComplete, 800);
            }
        }

        // 显示关卡完成弹窗
        function showLevelComplete() {
            elements.completedLevel.textContent = gameState.currentLevel;
            elements.finalScore.textContent = gameState.score;
            
            // 解锁下一关
            if (gameState.currentLevel === gameState.unlockedLevels && 
                gameState.currentLevel < 10) {
                gameState.unlockedLevels++;
                saveGameState();
            }
            
            elements.levelComplete.classList.remove('hidden');
        }

        // 更新游戏状态显示
        function updateGameStats() {
            elements.currentLevel.textContent = gameState.currentLevel;
            elements.currentScore.textContent = gameState.score;
            
            const levelConfig = levelsConfig[gameState.currentLevel - 1];
            elements.wordCount.textContent = levelConfig.totalWords;
        }

        // 保存游戏状态到本地存储
        function saveGameState() {
            try {
                localStorage.setItem('bilingualWordGameState', JSON.stringify(gameState));
            } catch (e) {
                console.error('无法保存游戏状态:', e);
            }
        }

        // 从本地存储加载游戏状态
        function loadGameState() {
            try {
                const saved = localStorage.getItem('bilingualWordGameState');
                if (saved) {
                    gameState = JSON.parse(saved);
                }
            } catch (e) {
                console.error('无法加载游戏状态:', e);
                // 使用默认状态
                resetGameState();
            }
        }

        // 重置游戏状态
        function resetGameState() {
            gameState = {
                currentLevel: 1,
                unlockedLevels: 1,
                score: 0,
                selectedWord: {
                    lang: null,
                    word: null
                },
                chineseData: [],
                englishData: [],
                completedWords: {
                    chinese: 0,
                    english: 0
                },
                sectionCompleted: {
                    chinese: false,
                    english: false
                }
            };
            saveGameState();
        }

        // 添加事件监听
        function addEventListeners() {
            // 返回关卡选择
            elements.backBtn.addEventListener('click', () => {
                elements.gameContainer.classList.add('hidden');
                elements.levelSelect.classList.remove('hidden');
                generateLevelButtons(); // 更新关卡按钮状态
            });
            
            // 重置当前关卡
            elements.resetBtn.addEventListener('click', () => {
                startLevel(gameState.currentLevel);
            });
            
            // 再玩一次
            elements.playAgain.addEventListener('click', () => {
                elements.levelComplete.classList.add('hidden');
                startLevel(gameState.currentLevel);
            });
            
            // 下一关
            elements.nextLevel.addEventListener('click', () => {
                elements.levelComplete.classList.add('hidden');
                startLevel(gameState.currentLevel + 1);
            });
        }

        // 添加动画样式
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeIn {
                from { opacity: 0; transform: scale(0.9); }
                to { opacity: 1; transform: scale(1); }
            }
        `;
        document.head.appendChild(style);

        // 初始化游戏
        document.addEventListener('DOMContentLoaded', initGame);
    </script>
