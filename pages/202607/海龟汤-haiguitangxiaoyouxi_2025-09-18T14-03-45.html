            },
            {
                title: "神秘的电话",
                description: "一个男人在晚上接到了一个电话，电话是从他的办公室打来的。他接通电话，里面传来了他自己的声音：'不要来办公室，快报警！'男人听后，立刻赶到了办公室，但当他打开门时，他吓得立刻报警了。为什么？",
                answer: "男人的办公室进了小偷，小偷用他的电话给他打了电话，想骗他不要来办公室。但男人意识到这可能是一个陷阱，所以他决定去办公室看看，结果发现办公室被翻得乱七八糟，小偷还在里面，所以他立刻报警了。",
                clues: {

                    "小偷是不是想骗他？": "是",

                    "办公室是不是被偷了？": "是",
                    "小偷是不是还在？": "是"
                }
            },
            {
                title: "死亡的记者",
                description: "一个记者在采访一位名人时，突然死在了采访现场。警方调查后，排除了他杀的可能，认为是自然死亡。为什么？",
                answer: "记者有严重的心脏病，他在采访过程中，听到了一个震惊的消息，情绪过于激动，导致心脏病发作而死。",
                clues: {
                    "是不是和心脏病有关？": "是",
                    "是不是情绪激动？": "是",
                    "死亡是不是因为心脏病发作？": "是",
                    "死亡是不是意外？": "是",
                    "是不是在采访时发生的？": "是",
                    "警方是不是没有发现他杀证据？": "是",
                    "是不是听到了震惊的消息？": "是"
                }
            }
        ];

        // 当前海龟汤
        let currentSoup = null;
        // 当前问题计数
        let questionCount = 0;
        // 当前匹配度
        let matchPercentage = 0;
        // 关键词数据库（用于emoji生成）
        const keywordEmojiMap = {
            '死亡': '💀', '杀人': '🔪', '自杀': '🪢', '谋杀': '🔪',
            '电梯': '🚪', '镜子': '🪞', '医院': '🏥', '电话': '📞',
            '沙漠': '🏜️', '海洋': '🌊', '河': '🌊', '水': '💧',
            '火灾': '🔥', '中毒': '☠️', '车祸': '🚗', '飞机': '✈️',
            '气球': '🎈', '绳子': '🪢', '刀': '🔪', '枪': '🔫',
            '血': '🩸', '头发': '💇', '眼睛': '👁️', '手': '🖐️',
            '脚': '🦶', '尸体': '☠️', '警察': '👮', '小偷': '👺',
            '凶手': '👺', '朋友': '👫', '家人': '👪', '恋人': '❤️',
            '医院': '🏥', '医生': '👨⚕️', '病人': '🤒', '手术': '⚕️',
            '房间': '🏠', '床': '🛏️', '天花板': '☁️', '敲门': '🚪',
            '狗': '🐶', '猫': '🐱', '动物': '🐾', '鱼': '🐟',
            '食物': '🍲', '饮料': '🥤', '酒': '🍷', '杯子': '🥃',
            '书': '📚', '电视': '📺', '录像带': '📼', '音乐': '🎵',
            '钢琴': '🎹', '钱': '💰', '珠宝': '💎', '礼物': '🎁',
            '盒子': '📦', '信': '📝', '信封': '✉️', '钥匙': '🗝️',
            '锁': '🔒', '门': '🚪', '窗户': '🪟', '墙': '🧱',
            '公园': '🏞️', '森林': '🌳', '山': '⛰️', '洞穴': '🕳️',
            '雪': '❄️', '雨': '🌧️', '风': '💨', '雷': '⚡',
            '黑暗': '🌑', '光明': '☀️', '蜡烛': '🕯️', '灯': '💡',
            '火柴': '🪵', '烟': '🚬', '雾': '🌫️', '镜子': '🪞',
            '影子': '👥', '梦': '💭', '幻觉': '🌈', '恐惧': '😱',
            '笑': '😄', '哭': '😭', '惊讶': '😲', '愤怒': '😠'
        };

        // DOM 元素
        const soupDescription = document.getElementById('soupDescription');
        const chatContainer = document.getElementById('chatContainer');
        const questionInput = document.getElementById('questionInput');
        const sendQuestionBtn = document.getElementById('sendQuestionBtn');
        const generateSoupBtn = document.getElementById('generateSoupBtn');
        const revealAnswerBtn = document.getElementById('revealAnswerBtn');
        const answerModal = document.getElementById('answerModal');
        const soupAnswer = document.getElementById('soupAnswer');
        const closeAnswerModal = document.getElementById('closeAnswerModal');
        const newSoupBtn = document.getElementById('newSoupBtn');
        const soupTitleElement = document.createElement('h3');
        soupTitleElement.className = 'text-xl font-semibold text-primary mb-2 flex items-center';
        soupDescription.parentNode.insertBefore(soupTitleElement, soupDescription);

        // 生成与故事相关的emoji
        function generateStoryEmoji(storyText) {
            let usedEmojis = new Set();
            let emojis = [];
            
            // 查找匹配的关键词
            for (const [keyword, emoji] of Object.entries(keywordEmojiMap)) {
                if (storyText.includes(keyword) && !usedEmojis.has(emoji)) {
                    emojis.push(emoji);
                    usedEmojis.add(emoji);
                    if (emojis.length >= 3) break;
                }
            }
            
            // 如果没有找到足够的emoji，随机选择一些
            if (emojis.length < 2) {
                const allEmojis = Array.from(Object.values(keywordEmojiMap));
                while (emojis.length < 2) {
                    const randomEmoji = allEmojis[Math.floor(Math.random() * allEmojis.length)];
                    if (!usedEmojis.has(randomEmoji)) {
                        emojis.push(randomEmoji);
                        usedEmojis.add(randomEmoji);
                    }
                }
            }
            
            return emojis.join(' ');
        }

        // 生成随机海龟汤
        function generateRandomSoup() {
            const randomIndex = Math.floor(Math.random() * turtleSoupDatabase.length);
            currentSoup = turtleSoupDatabase[randomIndex];
            
            // 生成故事emoji
            const storyEmoji = generateStoryEmoji(currentSoup.description + currentSoup.answer);
            
            // 更新标题和描述
            soupTitleElement.innerHTML = ` ${storyEmoji} ${currentSoup.title} `;
            soupDescription.textContent = currentSoup.description;
            
            // 重置问题计数和匹配度
            questionCount = 0;
            matchPercentage = 0;
            
            // 清空聊天记录
            chatContainer.innerHTML = `
                <div class="flex flex-col items-start">
                    <span class="text-xs text-gray-500 mb-1">系统</span>
                    <div class="message-bubble-bot px-4 py-2 max-w-[80%]">
                        海龟汤已生成！你可以开始提问了，我只会回答"是"、"不是"或"是也不是"。
                    </div>
                </div>
            `;
            
            // 启用提问功能和揭示汤底按钮
            questionInput.disabled = false;
            sendQuestionBtn.disabled = false;
            revealAnswerBtn.disabled = false;
            
            // 聚焦到输入框
            questionInput.focus();
        }

        // 计算用户回答与汤底的匹配度
        function calculateMatchPercentage(userQuestions) {
            if (!currentSoup || !userQuestions.length) return 0;
            
            // 提取汤底关键词
            const answerLower = currentSoup.answer.toLowerCase();
            const answerKeywords = [];
            
            // 从关键词数据库中查找汤底中的关键词
            for (const keyword of Object.keys(keywordEmojiMap)) {
                if (answerLower.includes(keyword.toLowerCase())) {
                    answerKeywords.push(keyword.toLowerCase());
                }
            }
            
            // 如果没有找到关键词，使用汤底中的主要词汇
            if (answerKeywords.length === 0) {
                const answerWords = answerLower.match(/[\u4e00-\u9fa5a-z0-9]+/g) || [];
                // 过滤掉常见的停用词
                const stopwords = ['的', '了', '在', '是', '我', '有', '和', '就', '不', '人', '都', '一', '一个', '上', '也', '很', '到', '说', '要', '去', '你', '会', '着', '没有', '看', '好', '自己', '这'];
                answerKeywords.push(...answerWords.filter(word => !stopwords.includes(word) && word.length > 1));
            }
            
            if (answerKeywords.length === 0) return 0;
            
            // 检查用户问题中是否包含这些关键词
            let matchedCount = 0;
            const allQuestionsLower = userQuestions.join(' ').toLowerCase();
            
            answerKeywords.forEach(keyword => {
                if (allQuestionsLower.includes(keyword)) {
                    matchedCount++;
                }
            });
            
            // 计算匹配百分比
            return Math.min(Math.round((matchedCount / answerKeywords.length) * 100), 100);
        }

        // 发送问题
        function sendQuestion() {
            const question = questionInput.value.trim();
            if (!question) return;
            
            // 增加问题计数
            questionCount++;
            
            // 添加用户问题到聊天记录
            addMessageToChat('user', question);
            
            // 清空输入框
            questionInput.value = '';
            
            // 获取回答
            const answer = getAnswerForQuestion(question);
            
            // 获取当前所有用户问题
            const userMessages = Array.from(chatContainer.querySelectorAll('.flex-col.items-end')).map(el => {
                return el.querySelector('.message-bubble-user')?.textContent || '';
            }).filter(msg => msg);
            
            // 计算匹配度
            matchPercentage = calculateMatchPercentage(userMessages);
            
            // 添加回答到聊天记录（稍微延迟，模拟思考）
            setTimeout(() => {
                addMessageToChat('bot', answer);
                
                // 检查是否达到自动揭示条件
                if (matchPercentage >= 80) {
                    setTimeout(() => {
                        addMessageToChat('bot', `🎉 恭喜！你已经接近真相了（匹配度${matchPercentage}%），让我来告诉你完整的汤底吧！`);
                        setTimeout(revealAnswer, 1000);
                    }, 500);
                } else if (questionCount >= 5) {
                    setTimeout(() => {
                        addMessageToChat('bot', `⌛ 你已经问了${questionCount}个问题，让我来揭示汤底吧！`);
                        setTimeout(revealAnswer, 1000);
                    }, 500);
                }
            }, 500);
        }

        // 获取问题的回答
        function getAnswerForQuestion(question) {
            // 转换为小写，方便匹配
            const lowerQuestion = question.toLowerCase();
            
            // 检查是否在clues中有匹配的问题
            for (const [key, value] of Object.entries(currentSoup.clues)) {
                if (lowerQuestion.includes(key.toLowerCase()) || 
                    key.toLowerCase().includes(lowerQuestion)) {
                    return value;
                }
            }
            
            // 如果没有匹配的问题，随机返回一个回答
            const randomAnswers = ['是', '不是', '是也不是'];
            return randomAnswers[Math.floor(Math.random() * randomAnswers.length)];
        }

        // 添加消息到聊天记录
        function addMessageToChat(sender, message) {
            const messageElement = document.createElement('div');
            messageElement.className = sender === 'user' ? 'flex flex-col items-end' : 'flex flex-col items-start';
            
            const senderSpan = document.createElement('span');
            senderSpan.className = 'text-xs text-gray-500 mb-1';
            senderSpan.textContent = sender === 'user' ? '你' : '系统';
            
            const messageBubble = document.createElement('div');
            messageBubble.className = sender === 'user' ? 'message-bubble-user px-4 py-2 max-w-[80%]' : 'message-bubble-bot px-4 py-2 max-w-[80%]';
            messageBubble.textContent = message;
            
            messageElement.appendChild(senderSpan);
            messageElement.appendChild(messageBubble);
            
            chatContainer.appendChild(messageElement);
            
            // 滚动到底部
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 揭示汤底
        function revealAnswer() {
            soupAnswer.textContent = currentSoup.answer;
            answerModal.classList.remove('hidden');
        }

        // 关闭汤底弹窗
        function closeModal() {
            answerModal.classList.add('hidden');
        }

        // 再来一个海龟汤
        function newSoup() {
            closeModal();
            generateRandomSoup();
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 确保标题元素正确显示
            soupTitleElement.innerHTML = ' 🤔 点击下方按钮开始游戏 ';
        });

        // 添加事件监听器
        generateSoupBtn.addEventListener('click', generateRandomSoup);
        sendQuestionBtn.addEventListener('click', sendQuestion);
        revealAnswerBtn.addEventListener('click', revealAnswer);
        closeAnswerModal.addEventListener('click', closeModal);
        newSoupBtn.addEventListener('click', newSoup);
        
        // 按下回车键发送问题
        questionInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendQuestion();
            }
        });
        
        // 点击模态框背景关闭弹窗
        answerModal.addEventListener('click', function(e) {
            if (e.target === answerModal) {
                closeModal();
            }
        });
    </script>
