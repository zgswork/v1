<!DOCTYPE html>
<html lang="zh-CN">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Lonely-HTML</title>
        <link rel="stylesheet" href="/static/css/lonely-html.css">
    </head>

    <body>
        <div class="container" id="mainContainer">
            <div class="header">
                <div class="search-wrapper">
                    <span class="icon">🔍</span> <input type="text" id="searchInput" placeholder="搜索应用名…"
                        autocomplete="off" disabled />
                </div>
                <div class="stats" id="stats"> 共 <strong id="totalCount">0</strong> 个应用 <span class="tag-count"
                        id="visibleCount"></span>
                </div>
            </div>
            <div class="file-grid" id="fileGrid">
                <!-- 由 JS 动态渲染 -->
            </div>
        </div>

        <!-- ===== 覆盖层 ===== -->
        <div id="overlay">
            <div id="overlay-nav">
                <button class="back-btn" id="backBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                    <span>返回主页</span>
                </button>
                <span class="file-title" id="overlayTitle">正在加载…</span>
            </div>
            <iframe id="contentFrame" src="about:blank"></iframe>
        </div>

        <!-- ===== 外部数据 ===== -->
        <script src="202607.js">    </script>
        <script src="/static/js/lonely-html.js"></script>
    </body>

</html>
