<html lang="zh-CN">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            line-height: 1.47059;
            font-weight: 400;
            letter-spacing: -0.022em;
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
            padding: 0 22px;
        }

        /* Header Section */
        .hero-section {
            text-align: center;
            padding: 80px 0 60px;
            background: linear-gradient(135deg, #ffffff 0%, #f5f5f7 100%);
        }

        .hero-title {
            font-size: 56px;
            font-weight: 600;
            letter-spacing: -0.005em;
            line-height: 1.07143;
            color: #1d1d1f;
            margin-bottom: 16px;
        }

        .hero-subtitle {
            font-size: 28px;
            font-weight: 400;
            letter-spacing: 0.004em;
            line-height: 1.14286;
            color: #86868b;
            margin-bottom: 40px;
        }

        /* Main Content */
        .main-content {
            padding: 60px 0;
        }

        /* Search Section */
        .search-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 48px;
            margin-bottom: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .search-title {
            font-size: 32px;
            font-weight: 600;
            letter-spacing: -0.003em;
            color: #1d1d1f;
            margin-bottom: 8px;
            text-align: center;
        }

        .search-description {
            font-size: 19px;
            color: #86868b;
            text-align: center;
            margin-bottom: 40px;
        }

        .input-container {
            position: relative;
            margin-bottom: 24px;
        }

        .mac-input {
            width: 100%;
            height: 56px;
            padding: 0 20px;
            font-size: 17px;
            font-weight: 400;
            color: #1d1d1f;
            background: #f5f5f7;
            border: 2px solid transparent;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
            font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
        }

        .mac-input:focus {
            background: #ffffff;
            border-color: #007aff;
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1);
        }

        .mac-input::placeholder {
            color: #86868b;
            font-weight: 400;
        }

        .mac-input.error {
            border-color: #ff3b30 !important;
            background: #fff5f5 !important;
        }

        .search-button {
            width: 100%;
            height: 56px;
            background: #007aff;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
            letter-spacing: -0.022em;
        }

        .search-button:hover {
            background: #0056cc;
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(0, 122, 255, 0.25);
        }

        .search-button:active {
            transform: translateY(0);
        }

        .format-hint {
            margin-top: 16px;
            padding: 16px 20px;
            background: rgba(0, 122, 255, 0.04);
            border-radius: 12px;
            font-size: 15px;
            color: #86868b;
            text-align: center;
        }

        .format-hint strong {
            color: #1d1d1f;
            font-weight: 500;
        }

        /* Quick Test Section */
        .quick-test {
            margin-top: 32px;
            text-align: center;
        }

        .quick-test-title {
            font-size: 17px;
            color: #86868b;
            margin-bottom: 16px;
        }

        .test-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .test-btn {
            padding: 8px 16px;
            background: rgba(0, 122, 255, 0.1);
            color: #007aff;
            border: 1px solid rgba(0, 122, 255, 0.2);
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .test-btn:hover {
            background: rgba(0, 122, 255, 0.15);
            transform: translateY(-1px);
        }

        /* Loading State */
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.show {
            display: block;
        }

        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #f5f5f7;
            border-top: 3px solid #007aff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-size: 17px;
            color: #86868b;
        }

        /* Result Section */
        .result-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 48px;
            margin-bottom: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.04);
            display: none;
        }

        .result-card.show {
            display: block;
            animation: slideUp 0.6s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .result-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #007aff, #5856d6);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 32px;
            color: white;
        }

        .result-vendor {
            font-size: 32px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 8px;
        }

        .result-company {
            font-size: 19px;
            color: #86868b;
        }

        .result-details {
            display: grid;
            gap: 24px;
        }

        .detail-row {
            display: flex;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-size: 17px;
            font-weight: 500;
            color: #86868b;
            min-width: 140px;
        }

        .detail-value {
            font-size: 17px;
            color: #1d1d1f;
            flex: 1;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
        }

        .detail-value.text {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
        }

        /* Error State */
        .error-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 48px;
            margin-bottom: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 59, 48, 0.1);
            text-align: center;
            display: none;
        }

        .error-card.show {
            display: block;
            animation: slideUp 0.6s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        .error-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ff3b30, #ff9500);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 32px;
            color: white;
        }

        .error-title {
            font-size: 28px;
            font-weight: 600;
            color: #ff3b30;
            margin-bottom: 12px;
        }

        .error-message {
            font-size: 17px;
            color: #86868b;
            line-height: 1.5;
            white-space: pre-line;
        }

        /* History Section */
        .history-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 48px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .history-title {
            font-size: 28px;
            font-weight: 600;
            color: #1d1d1f;
        }

        .clear-history-btn {
            background: none;
            border: none;
            color: #007aff;
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .clear-history-btn:hover {
            background: rgba(0, 122, 255, 0.1);
        }

        .history-list {
            display: grid;
            gap: 12px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: #f5f5f7;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        .history-item:hover {
            background: rgba(0, 122, 255, 0.08);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

            font-weight: 600;
            color: #1d1d1f;

            color: #86868b;
            margin-top: 4px;
        }

        .history-date {
            font-size: 14px;
            color: #86868b;
            text-align: right;
        }

        .empty-history {
            text-align: center;
            padding: 60px 20px;
            color: #86868b;
            font-size: 17px;
        }

        /* Footer */
        .footer {
            background: #f5f5f7;
            padding: 60px 0;
            text-align: center;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
        }

        .footer-content {
            max-width: 600px;
            margin: 0 auto;
        }

        .footer-text {
            font-size: 15px;
            color: #86868b;
            line-height: 1.6;
            margin-bottom: 16px;
        }

            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .wechat-link:hover {
            color: #0056cc;
        }

            font-size: 12px;
            color: #86868b;
            margin-top: 20px;

                font-size: 21px;
            }

            .search-card,
            .result-card,
            .error-card,
            .history-card {

            }

            .search-title {
                font-size: 28px;
            }

            .result-vendor {
                font-size: 28px;
            }

            .history-title {
                font-size: 24px;
            }

            .detail-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .detail-label {
                min-width: auto;
                font-size: 15px;
            }

            .detail-value {
                font-size: 15px;
            }

            .test-buttons {
                justify-content: center;
            }

            .history-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .history-date {
                text-align: left;
                align-self: flex-end;
            }

</head>

            <!-- Loading State -->

            <!-- Result Section -->

            <!-- Error Section -->
            <div class="error-card" id="errorCard">
                <div class="error-icon">⚠️</div>
                <h3 class="error-title">查询失败</h3>
                <p class="error-message" id="errorMessage">请检查MAC地址格式是否正确</p>
            </div>

            <!-- History Section -->
            <div class="history-card">
                <div class="history-header">
                    <h3 class="history-title">查询历史</h3>
                    <button class="clear-history-btn" id="clearHistory">清空历史</button>

                <div class="history-list" id="historyList">
                    <div class="empty-history">暂无查询记录</div>
                </div>
            </div>
        </div>

            macDatabase = {
                '00:00:0C': { vendor: 'Cisco', company: 'Cisco Systems, Inc.', country: 'US', type: 'Network Equipment' },
                '00:03:47': { vendor: 'Intel', company: 'Intel Corporation', country: 'US', type: 'Network Interface' },
                '00:03:93': { vendor: 'Apple', company: 'Apple Inc.', country: 'US', type: 'Consumer Electronics' }
            };
        }

        // MAC地址格式验证和标准化函数
        function validateAndNormalizeMac(mac) {
            if (!mac || typeof mac !== 'string') {
                return { isValid: false, error: '请输入有效的MAC地址' };
            }

            // 移除所有空格和转换为大写
            mac = mac.trim().replace(/\s+/g, '').toUpperCase();

            if (mac.length === 0) {
                return { isValid: false, error: 'MAC地址不能为空' };
            }

            // 支持的格式验证
            const formats = [
                { regex: /^([0-9A-F]{2}[:-]){5}[0-9A-F]{2}$/, name: 'AA:BB:CC:DD:EE:FF 或 AA-BB-CC-DD-EE-FF' },
                { regex: /^[0-9A-F]{12}$/, name: 'AABBCCDDEEFF' },
                { regex: /^([0-9A-F]{2}\.){5}[0-9A-F]{2}$/, name: 'AA.BB.CC.DD.EE.FF' },
                { regex: /^([0-9A-F]{2}\s){5}[0-9A-F]{2}$/, name: 'AA BB CC DD EE FF' }
            ];

            let matchedFormat = null;
            for (let format of formats) {
                if (format.regex.test(mac)) {
                    matchedFormat = format;
                    break;
                }
            }

            if (!matchedFormat) {
                return {
                    isValid: false,
                    error: `MAC地址格式不正确。支持的格式：\n${formats.map(f => f.name).join('\n')}`
                };
            }

            // 标准化为 AA:BB:CC:DD:EE:FF 格式
            let normalized = mac.replace(/[-\.\s]/g, ':');
            if (normalized.length === 12) {
                // AABBCCDDEEFF -> AA:BB:CC:DD:EE:FF
                normalized = normalized.match(/.{2}/g).join(':');
            }

            // 验证每个字节是否为有效的十六进制
            const bytes = normalized.split(':');
            if (bytes.length !== 6) {
                return { isValid: false, error: 'MAC地址必须包含6个字节' };
            }

            for (let byte of bytes) {
                if (!/^[0-9A-F]{2}$/.test(byte)) {
                    return { isValid: false, error: `无效的十六进制字节: ${byte}` };
                }
            }

            return { isValid: true, normalized: normalized, original: mac };
        }

        // 获取MAC地址的OUI前缀
        function getOUI(macValidationResult) {
            if (!macValidationResult.isValid) {
                return { isValid: false, error: macValidationResult.error };
            }

            const normalized = macValidationResult.normalized;
            const oui = normalized.substring(0, 8); // 前3个字节 AA:BB:CC

            return { isValid: true, oui: oui, fullMac: normalized };
        }

        // 查询厂商信息
        function lookupVendor(mac) {
            try {
                // 验证MAC地址格式
                const macValidation = validateAndNormalizeMac(mac);
                if (!macValidation.isValid) {
                    return { success: false, error: macValidation.error };
                }

                // 获取OUI
                const ouiResult = getOUI(macValidation);
                if (!ouiResult.isValid) {
                    return { success: false, error: ouiResult.error };
                }

                // 查找厂商信息
                const vendorInfo = macDatabase[ouiResult.oui];
                if (!vendorInfo) {
                    return {
                        success: false,
                        error: `未找到OUI ${ouiResult.oui} 对应的厂商信息\n可能是未知厂商或私有地址段`,
                        oui: ouiResult.oui,
                        mac: ouiResult.fullMac
                    };
                }

                return {
                    success: true,
                    mac: ouiResult.fullMac,
                    oui: ouiResult.oui,
                    vendor: vendorInfo.vendor,
                    company: vendorInfo.company,
                    country: vendorInfo.country,
                    type: vendorInfo.type
                };

            } catch (error) {
                console.error('查询过程中发生错误:', error);
                return {
                    success: false,
                    error: '查询过程中发生未知错误，请稍后重试'
                };
            }
        }

        // 显示查询结果
        function displayResult(mac, vendorInfo) {
            const resultCard = document.getElementById('resultCard');
            const errorCard = document.getElementById('errorCard');
            const vendorName = document.getElementById('vendorName');
            const companyName = document.getElementById('companyName');
            const resultDetails = document.getElementById('resultDetails');

            // 隐藏错误卡片
            errorCard.classList.remove('show');

            // 更新结果内容
            vendorName.textContent = vendorInfo.vendor;
            companyName.textContent = vendorInfo.company;

            // 获取国家显示名称
            const countryDisplay = countryNames[vendorInfo.country] || vendorInfo.country;

            resultDetails.innerHTML = `
                <div class="detail-row">
                    <div class="detail-label">MAC地址</div>
                    <div class="detail-value">${mac}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">厂商名称</div>
                    <div class="detail-value text">${vendorInfo.vendor}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">公司全称</div>
                    <div class="detail-value text">${vendorInfo.company}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">设备类型</div>
                    <div class="detail-value text">${vendorInfo.type}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">注册国家</div>
                    <div class="detail-value text">${countryDisplay}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">OUI前缀</div>
                    <div class="detail-value">${mac.substring(0, 8)}</div>
                </div>
            `;

            // 显示结果卡片
            resultCard.classList.add('show');
        }

        // 显示错误信息
        function displayError(message) {
            const resultCard = document.getElementById('resultCard');
            const errorCard = document.getElementById('errorCard');
            const errorMessage = document.getElementById('errorMessage');

            // 隐藏结果卡片
            resultCard.classList.remove('show');

            // 更新错误信息
            errorMessage.textContent = message;

            // 显示错误卡片
            errorCard.classList.add('show');
        }

        // 保存查询历史
        function saveToHistory(mac, vendorInfo) {
            let history = JSON.parse(localStorage.getItem('macLookupHistory') || '[]');

            // 检查是否已存在相同的MAC地址
            const existingIndex = history.findIndex(item => item.mac === mac);
            if (existingIndex !== -1) {
                history.splice(existingIndex, 1);
            }

            // 添加到历史记录开头
            history.unshift({
                mac: mac,
                vendor: vendorInfo.vendor,
                company: vendorInfo.company,
                country: vendorInfo.country,
                type: vendorInfo.type,
                timestamp: new Date().toISOString()
            });

            // 限制历史记录数量为10条
            if (history.length > 10) {
                history = history.slice(0, 10);
            }

            localStorage.setItem('macLookupHistory', JSON.stringify(history));
            updateHistoryDisplay();
        }

        // 更新历史记录显示
        function updateHistoryDisplay() {
            const historyList = document.getElementById('historyList');
            const history = JSON.parse(localStorage.getItem('macLookupHistory') || '[]');

            if (history.length === 0) {
                historyList.innerHTML = '<div class="empty-history">暂无查询记录</div>';
                return;
            }

            historyList.innerHTML = history.map(item => `
                <div class="history-item" data-mac="${item.mac}">
                    <div>
                        <div class="history-mac">${item.mac}</div>
                        <div class="history-vendor">${item.vendor} - ${item.type}</div>
                    </div>
                    <div class="history-date">
                        ${new Date(item.timestamp).toLocaleDateString('zh-CN')}
                    </div>
                </div>
            `).join('');

            // 为历史记录项添加点击事件
            const historyItems = historyList.querySelectorAll('.history-item');
            historyItems.forEach(item => {
                item.addEventListener('click', function () {
                    const mac = this.getAttribute('data-mac');
                    searchFromHistory(mac);
                });
            });
        }

        // 从历史记录搜索
        function searchFromHistory(mac) {
            const macInput = document.getElementById('macInput');
            if (macInput) {
                macInput.value = mac;
                performSearch();
            }
        }

        // 清空历史记录
        function clearHistory() {
            if (confirm('确定要清空所有查询历史吗？')) {
                localStorage.removeItem('macLookupHistory');
                updateHistoryDisplay();
            }
        }

        // 执行搜索
        function performSearch() {
            const macInput = document.getElementById('macInput');
            const loading = document.getElementById('loading');
            const mac = macInput.value.trim();

            if (!mac) {
                displayError('请输入MAC地址');
                return;
            }

            // 显示加载状态
            loading.classList.add('show');
            document.getElementById('resultCard').classList.remove('show');
            document.getElementById('errorCard').classList.remove('show');

            // 模拟网络延迟
            setTimeout(() => {
                loading.classList.remove('show');

                // 查询厂商信息
                const result = lookupVendor(mac);

                if (result.success) {
                    // 查询成功，显示结果
                    displayResult(result.mac, {
                        vendor: result.vendor,
                        company: result.company,
                        country: result.country,
                        type: result.type
                    });

                    // 保存到历史记录
                    saveToHistory(result.mac, {
                        vendor: result.vendor,
                        company: result.company,
                        country: result.country,
                        type: result.type
                    });
                } else {
                    // 查询失败，显示错误信息
                    displayError(result.error);
                }
            }, 800);
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function () {
            const macInput = document.getElementById('macInput');
            const searchBtn = document.getElementById('searchBtn');
            const clearHistoryBtn = document.getElementById('clearHistory');

            // 确保元素存在后再绑定事件
            if (searchBtn) {
                searchBtn.addEventListener('click', performSearch);
            }

            if (macInput) {
                // 绑定回车键搜索
                macInput.addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') {
                        performSearch();
                    }
                });

                // 输入框格式化提示和实时验证
                macInput.addEventListener('input', function (e) {
                    let value = e.target.value.toUpperCase();

                    // 移除输入框的错误状态
                    e.target.classList.remove('error');

                    // 自动添加冒号分隔符（可选功能）
                    if (value.length === 2 || value.length === 5 || value.length === 8 || value.length === 11 || value.length === 14) {
                        if (value[value.length - 1] !== ':' && /^[0-9A-F]+$/.test(value.replace(/:/g, ''))) {
                            // 只在输入纯十六进制字符时自动添加冒号
                            if (value.length < 17) {
                                e.target.value = value + ':';
                            }
                        }
                    }

                    // 实时验证提示
                    if (value.length > 0) {
                        const validation = validateAndNormalizeMac(value);
                        if (!validation.isValid && value.length >= 12) {
                            e.target.classList.add('error');
                            e.target.title = validation.error;
                        } else {
                            e.target.title = '';
                        }
                    }
                });
            }

            // 绑定清空历史按钮事件
            if (clearHistoryBtn) {
                clearHistoryBtn.addEventListener('click', clearHistory);
            }

            // 初始化历史记录显示
            updateHistoryDisplay();

            // 绑定测试按钮事件
            const testButtons = document.querySelectorAll('.test-btn');
            testButtons.forEach(button => {
                button.addEventListener('click', function () {
                    const mac = this.getAttribute('data-mac');
                    if (macInput) {
                        macInput.value = mac;
                        performSearch();
                    }
                });
            });
        });
    </script>
</body>
