<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>循环视频播放器</title>
<style>
:root{--bg:#f7f7f7;--fg:#111;--muted:#666;--accent:#3a86ff;--border:#ddd;--btn:#fff}
html.theme-dark{--bg:#0f1217;--fg:#e8eaed;--muted:#9aa0a6;--accent:#7aa2ff;--border:#1f2430;--btn:#171a21}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
h1{font-size:18px;margin:0}
button, input, select{font:inherit}
#themeToggle{padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--btn);color:var(--fg);cursor:pointer}
.container{max-width:1000px;margin:16px auto;padding:0 12px}
.player{position:relative;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#000}
video{width:100%;height:auto;display:block;background:#000}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.control{display:flex;gap:8px}
input[type="text"]{flex:1;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--btn);color:var(--fg)}
button.primary{background:var(--accent);border:none;color:#fff}
button{padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--btn);color:var(--fg);cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.status{margin-top:8px;color:var(--muted);font-size:14px}
.drop{margin-top:10px;padding:12px;border:1px dashed var(--border);border-radius:10px;color:var(--muted);text-align:center}
@media (hover:hover){.drop:hover{border-color:var(--accent);color:var(--fg)}}
@media (max-width:480px){header{padding:10px} h1{font-size:16px} button{padding:12px}}
</style>
</head>
<body>
<header>
  <h1>循环视频播放器</h1>
  <button id="themeToggle" aria-label="切换主题">切换主题</button>
</header>
<div class="container">
  <div class="player">
    <video id="video" preload="metadata" playsinline webkit-playsinline></video>
  </div>
  <div class="controls">
    <button id="pick" class="primary">选择视频文件</button>
    <button id="play">播放/暂停</button>
    <button id="setA">设置A点(当前)</button>
    <button id="setB">设置B点(当前)</button>
    <button id="jumpA">跳到A点</button>
    <button id="clearAB">清除AB</button>
    <button id="toggleLoop">AB循环：关闭</button>
    <div class="control">
      <input id="aInput" type="text" placeholder="A点(秒或mm:ss)">
      <input id="bInput" type="text" placeholder="B点(秒或mm:ss)">
    </div>
  </div>
  <div class="status" id="status">未加载视频</div>
  <div class="drop" id="drop">拖拽视频到此，或点击“选择视频文件”</div>
</div>
<input id="file" type="file" accept="video/*" hidden>
<script>
(function(){
const el=(id)=>document.getElementById(id);
const video=el('video'), file=el('file'), pick=el('pick'), play=el('play'), setA=el('setA'), setB=el('setB'), jumpA=el('jumpA'), clearAB=el('clearAB'), toggleLoop=el('toggleLoop'), aInput=el('aInput'), bInput=el('bInput'), status=el('status'), drop=el('drop'), themeToggle=el('themeToggle');
let objectUrl=null, aTime=null, bTime=null, loopOn=false;
function fmt(t){if(!isFinite(t)||t<0)return '0:00';let h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=Math.floor(t%60);let mm=(m<10?'0':'')+m,ss=(s<10?'0':'')+s;return h?`${h}:${mm}:${ss}`:`${m}:${ss}`;}
function parse(str){if(!str)return null;str=str.trim();if(/^\d+(\.\d+)?$/.test(str))return parseFloat(str);let parts=str.split(':').map(Number);if(parts.some(isNaN))return null;let sec=0;for(let i=0;i<parts.length;i++)sec=sec*60+parts[i];return sec;}
function updateStatus(){let dur=isFinite(video.duration)?video.duration:null;let t=`时间 ${fmt(video.currentTime)} / ${dur?fmt(dur):'--'}`;let a=aTime!=null?fmt(aTime):'未设',b=bTime!=null?fmt(bTime):'未设';status.textContent=`${t} | A:${a} B:${b} | 循环:${loopOn?'开启':'关闭'}`;}
function ensureValid(){if(aTime!=null&&bTime!=null){if(bTime<=aTime){bTime=aTime+0.5;}}if(video.duration&&bTime>video.duration)bTime=video.duration;}
function applyInputs(){let a=parse(aInput.value),b=parse(bInput.value);aTime=a!=null?a:null;bTime=b!=null?b:null;ensureValid();updateStatus();toggleLoop.textContent=`AB循环：${loopOn?'开启':'关闭'}`;}
function setTheme(t){document.documentElement.classList.toggle('theme-dark',t==='dark');localStorage.setItem('loop-video-theme',t);themeToggle.textContent=t==='dark'?'切换为浅色':'切换为深色';}
function initTheme(){let t=localStorage.getItem('loop-video-theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}setTheme(t);}
initTheme();themeToggle.onclick=()=>{let t=document.documentElement.classList.contains('theme-dark')?'light':'dark';setTheme(t);};
pick.onclick=()=>file.click();
file.onchange=()=>{if(file.files&&file.files[0]){if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(file.files[0]);video.src=objectUrl;video.load();video.play().catch(()=>{});}};
drop.ondragover=(e)=>{e.preventDefault();drop.style.borderColor='var(--accent)';};
drop.ondragleave=()=>{drop.style.borderColor='var(--border)';};
drop.ondrop=(e)=>{e.preventDefault();drop.style.borderColor='var(--border)';let f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f){file.files=e.dataTransfer.files;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(f);video.src=objectUrl;video.load();video.play().catch(()=>{});}};
play.onclick=()=>{if(video.paused)video.play();else video.pause();};
setA.onclick=()=>{aTime=video.currentTime; aInput.value=fmt(aTime); ensureValid(); updateStatus();};
setB.onclick=()=>{bTime=video.currentTime; bInput.value=fmt(bTime); ensureValid(); updateStatus();};
jumpA.onclick=()=>{if(aTime!=null){video.currentTime=aTime; video.play().catch(()=>{});}}
clearAB.onclick=()=>{aTime=null; bTime=null; aInput.value=''; bInput.value=''; updateStatus();};
toggleLoop.onclick=()=>{loopOn=!loopOn; toggleLoop.textContent=`AB循环：${loopOn?'开启':'关闭'}`;};
aInput.onchange=bInput.onchange=applyInputs;
video.addEventListener('timeupdate',()=>{updateStatus(); if(loopOn&&aTime!=null&&bTime!=null&&isFinite(video.duration)){if(video.currentTime>=bTime-0.02){video.currentTime=aTime; if(video.paused)video.play().catch(()=>{});}}});
video.addEventListener('loadedmetadata',()=>{updateStatus(); ensureValid();});
video.addEventListener('ended',()=>{if(loopOn&&aTime!=null&&bTime!=null){video.currentTime=aTime; video.play().catch(()=>{});}});
document.addEventListener('keydown',(e)=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;
if(e.key===' '){e.preventDefault(); play.click();}
if(e.key.toLowerCase()==='a'){setA.click();}
if(e.key.toLowerCase()==='b'){setB.click();}
if(e.key.toLowerCase()==='l'){toggleLoop.click();}
if(e.key.toLowerCase()==='r'){clearAB.click();}
if(e.key==='ArrowLeft'){video.currentTime=Math.max(0,video.currentTime-5);} 
if(e.key==='ArrowRight'){video.currentTime=Math.min(video.duration||1e9,video.currentTime+5);} 
});
window.addEventListener('beforeunload',()=>{if(objectUrl)URL.revokeObjectURL(objectUrl);});
updateStatus();
})();
</script>
</body>
</html>
