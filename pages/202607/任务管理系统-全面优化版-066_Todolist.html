<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务管理系统 - 全面优化版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #5d9bff;
            --light-color: #f8f9fa;
            --border-color: #e1e5eb;
            --todo-color: #ff6b6b;
            --progress-color: #ffd166;
            --done-color: #06d6a0;
            --calendar-color: #6a67ce;
            --high-priority: #ff6b6b;
            --medium-priority: #ffd166;
            --low-priority: #06d6a0;
            --tag-color: #6a67ce;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: #f8f9fa;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* 头部样式 */
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .subtitle {
            color: #6c757d;
            font-size: 16px;
        }

        /* 任务创建区域 */
        .task-creator {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }

        .task-creator::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: var(--primary-color);
        }

        .task-input {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .task-input-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 200px;
        }

        .task-input input, .task-input select {
            width: 100%;
            padding: 16px 20px;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .task-input input:focus, .task-input select:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(93, 155, 255, 0.2);
        }

        .add-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            height: 56px;
            align-self: flex-end;
        }

        .add-btn:hover {
            background: #4a8cff;
            transform: translateY(-2px);
        }

        .hint {
            font-size: 14px;
            color: #6c757d;
            padding: 10px 15px;
            background: #f1f7ff;
            border-radius: 8px;
            margin-top: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hint i {
            color: var(--primary-color);
        }

        /* 视图切换 */
        .view-switcher {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .view-btn {
            background: #f1f3f5;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            min-width: 160px;
            justify-content: center;
        }

        .view-btn.active {
            background: var(--primary-color);
            color: white;
        }

        .view-btn:hover:not(.active) {
            background: #e9ecef;
        }

        /* 看板区域 */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .column {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
        }

        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        .column-title {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .todo .column-title {
            color: var(--todo-color);
        }

        .progress .column-title {
            color: var(--progress-color);
        }

        .done .column-title {
            color: var(--done-color);
        }

        .task-count {
            font-size: 14px;
            color: #6c757d;
            background: #f1f3f5;
            padding: 4px 10px;
            border-radius: 12px;
        }

        .cards-container {
            min-height: 200px;
            padding: 5px;
            flex: 1;
        }

        .empty-state {
            text-align: center;
            padding: 30px 10px;
            color: #6c757d;
            font-size: 14px;
        }

        .empty-state i {
            font-size: 40px;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            border-left: 4px solid var(--border-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .card.dragging {
            opacity: 0.6;
            transform: scale(0.98);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .column.drop-over {
            background: rgba(241, 247, 255, 0.7);
            box-shadow: 0 0 0 2px var(--primary-color);
        }

        .card-title {
            font-weight: 600;
            margin-bottom: 8px;
            padding-right: 30px;
        }

        .card-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            font-size: 13px;
        }

        .card-date {
            color: #6c757d;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-priority {
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 500;
        }

        .priority-high {
            background: rgba(255, 107, 107, 0.15);
            color: var(--high-priority);
        }

        .priority-medium {
            background: rgba(255, 209, 102, 0.15);
            color: var(--medium-priority);
        }

        .priority-low {
            background: rgba(6, 214, 160, 0.15);
            color: var(--low-priority);
        }

        .card-tag {
            display: inline-block;
            padding: 3px 8px;
            background: rgba(106, 103, 206, 0.15);
            color: var(--tag-color);
            border-radius: 10px;
            font-size: 12px;
            margin-top: 8px;
        }

        .card-actions {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
        }

        .action-btn {
            background: none;
            border: none;
            color: #adb5bd;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .action-btn:hover {
            background: #f1f3f5;
        }

        .edit-btn:hover {
            color: var(--primary-color);
        }

        .delete-btn:hover {
            color: #ff6b6b;
        }

        /* 日历区域 */
        .calendar-view {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
            display: none;
        }

        .calendar-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--calendar-color);
        }

        .calendar-nav {
            display: flex;
            gap: 10px;
        }

        .calendar-nav-btn {
            background: #f1f3f5;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .calendar-nav-btn:hover {
            background: #e9ecef;
            transform: scale(1.05);
        }

        .calendar-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 14px;
            color: #6c757d;
        }

        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .calendar-day {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 100px;
        }

        .calendar-day:hover {
            background: #e9ecef;
        }

        .calendar-day.active {
            background: var(--calendar-color);
            color: white;
            font-weight: 600;
        }

        .calendar-day.has-tasks::after {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            background: var(--primary-color);
            border-radius: 50%;
        }
        
        .calendar-day.today {
            border: 2px solid var(--primary-color);
        }
        
        .calendar-day.empty {
            background: transparent;
            pointer-events: none;
        }

        .day-number {
            font-size: 16px;
            margin-bottom: 3px;
            font-weight: 600;
        }

        .day-tasks {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
            align-items: flex-start;
            overflow: hidden;
        }

        .day-task-item {
            width: 100%;
            padding: 4px 6px;
            background: white;
            border-radius: 6px;
            font-size: 12px;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-left: 3px solid var(--primary-color);
        }

        .day-detail {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            display: none;
        }

        .day-detail-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--calendar-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .day-tasks-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .detail-task-item {
            padding: 12px 15px;
            background: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .task-status {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .status-todo { background: var(--todo-color); }
        .status-progress { background: var(--progress-color); }
        .status-done { background: var(--done-color); }

        /* 搜索区域 */
        .search-container {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .search-box {
            flex: 1;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px 14px 45px;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(93, 155, 255, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #adb5bd;
        }

        .filter-select {
            padding: 14px 20px;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            font-size: 16px;
            min-width: 150px;
            background: white;
        }

        /* 编辑模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-title {
            font-size: 22px;
            font-weight: 600;
            color: var(--primary-color);
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #6c757d;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 2px solid var(--border-color);
            font-size: 16px;
        }

        .form-input:focus, .form-select:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: #4a8cff;
        }

        .btn-outline {
            background: white;
            border: 2px solid var(--border-color);
            color: #495057;
        }

        .btn-outline:hover {
            background: #f8f9fa;
        }

        /* 页脚样式 */
        footer {
            text-align: center;
            padding: 25px 0;
            color: #6c757d;
            font-size: 16px;
            margin-top: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .creator-info {
            font-weight: 600;
            color: var(--primary-color);
        }

        /* 动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .pulse {
            animation: pulse 1.5s infinite;
        }

        /* 响应式设计 */
        @media (max-width: 992px) {
            .board {
                grid-template-columns: 1fr;
            }
            
            .task-input {
                flex-direction: column;
            }
            
            .search-container {
                flex-direction: column;
            }
        }

        @media (max-width: 768px) {
            .calendar-day {
                min-height: 80px;
                padding: 8px;
            }

            .day-number {
                font-size: 14px;
            }
            
            .task-input input, .task-input select {
                width: 100%;
            }

            .add-btn {
                width: 100%;
                justify-content: center;
            }
            
            .view-btn {
                min-width: 140px;
                padding: 10px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header>
            <div class="logo">
                <i class="fas fa-tasks"></i>
                <span>任务管理系统</span>
            </div>
            <div class="subtitle">全面优化的任务管理解决方案</div>
            
            <!-- 视图切换 -->
            <div class="view-switcher">
                <button class="view-btn active" id="boardViewBtn">
                    <i class="fas fa-table-columns"></i> 看板视图
                </button>
                <button class="view-btn" id="calendarViewBtn">
                    <i class="far fa-calendar"></i> 日历视图
                </button>
                <button class="view-btn" id="searchViewBtn">
                    <i class="fas fa-search"></i> 搜索任务
                </button>
            </div>
        </header>
        
        <!-- 搜索区域 -->
        <div class="search-container" id="searchView" style="display: none;">
            <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="search-input" id="searchInput" placeholder="搜索任务...">
            </div>
            <select class="filter-select" id="statusFilter">
                <option value="all">所有状态</option>
                <option value="todo">待处理</option>
                <option value="progress">进行中</option>
                <option value="done">已完成</option>
            </select>
            <select class="filter-select" id="priorityFilter">
                <option value="all">所有优先级</option>
                <option value="high">高优先级</option>
                <option value="medium">中优先级</option>
                <option value="low">低优先级</option>
            </select>
        </div>
        
        <!-- 任务创建区域 -->
        <div class="task-creator">
            <div class="task-input">
                <div class="task-input-group">
                    <input type="text" id="taskInput" placeholder="输入任务内容">
                </div>
                <div class="task-input-group">
                    <input type="text" id="taskDate" placeholder="输入日期（如：明天、下周一）" value="今天">
                </div>
                <div class="task-input-group">
                    <select id="taskPriority">
                        <option value="medium">中优先级</option>
                        <option value="high">高优先级</option>
                        <option value="low">低优先级</option>
                    </select>
                </div>
                <div class="task-input-group">
                    <select id="taskTag">
                        <option value="">无标签</option>
                        <option value="工作">工作</option>
                        <option value="个人">个人</option>
                        <option value="学习">学习</option>
                        <option value="家庭">家庭</option>
                    </select>
                </div>
                <button class="add-btn" id="addTaskBtn">
                    <i class="fas fa-plus"></i> 添加任务
                </button>
            </div>
            <div class="hint">
                <i class="fas fa-lightbulb"></i> 
                <div>
                    <div>提示：支持自然语言日期（今天、明天、下周一），可拖拽任务卡片，双击任务进行编辑</div>
                    <div>快捷键：Enter添加任务，Esc关闭弹窗</div>
                </div>
            </div>
        </div>
        
        <!-- 看板区域 -->
        <div class="board" id="boardView">
            <!-- 待处理列 -->
            <div class="column todo board-column" id="todo">
                <div class="column-header">
                    <div class="column-title">
                        <i class="fas fa-list"></i>
                        <span>待处理</span>
                    </div>
                    <div class="task-count">0 任务</div>
                </div>
                <div class="cards-container" id="todo-container">
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <div>没有待处理任务</div>
                    </div>
                </div>
            </div>
            
            <!-- 进行中列 -->
            <div class="column progress board-column" id="progress">
                <div class="column-header">
                    <div class="column-title">
                        <i class="fas fa-spinner"></i>
                        <span>进行中</span>
                    </div>
                    <div class="task-count">0 任务</div>
                </div>
                <div class="cards-container" id="progress-container">
                    <div class="empty-state">
                        <i class="fas fa-cogs"></i>
                        <div>没有进行中任务</div>
                    </div>
                </div>
            </div>
            
            <!-- 已完成列 -->
            <div class="column done board-column" id="done">
                <div class="column-header">
                    <div class="column-title">
                        <i class="fas fa-check"></i>
                        <span>已完成</span>
                    </div>
                    <div class="task-count">0 任务</div>
                </div>
                <div class="cards-container" id="done-container">
                    <div class="empty-state">
                        <i class="fas fa-check-circle"></i>
                        <div>没有已完成任务</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 日历区域 -->
        <div class="calendar-view" id="calendarView">
            <div class="calendar-controls">
                <div class="calendar-title">2023年11月</div>
                <div class="calendar-nav">
                    <button class="calendar-nav-btn" id="prevMonth"><i class="fas fa-chevron-left"></i></button>
                    <button class="calendar-nav-btn" id="today">今天</button>
                    <button class="calendar-nav-btn" id="nextMonth"><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>
            
            <div class="calendar-header">
                <div>日</div>
                <div>一</div>
                <div>二</div>
                <div>三</div>
                <div>四</div>
                <div>五</div>
                <div>六</div>
            </div>
            
            <div class="calendar" id="calendarGrid">
                <!-- 日历日期将通过JavaScript动态生成 -->
            </div>
            
            <div class="day-detail" id="dayDetail">
                <div class="day-detail-title">
                    <i class="fas fa-calendar-day"></i>
                    <span id="detailDate">2023年11月1日</span>
                </div>
                <ul class="day-tasks-list" id="dayTasksList">
                    <!-- 当日任务将通过JavaScript动态生成 -->
                </ul>
            </div>
        </div>
        
        <!-- 页脚 -->
        <footer>
            <div>© 2023 <span class="creator-info">整合版待办系统</span> - 让工作更高效</div>
            <div style="margin-top: 10px; font-size: 14px;">已创建 <span id="totalTasks">0</span> 个任务，完成 <span id="completedTasks">0</span> 个任务</div>
        </footer>
    </div>
    
    <!-- 编辑任务模态框 -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">编辑任务</h3>
                <button class="close-modal" id="closeModal">&times;</button>
            </div>
            <div class="form-group">
                <label class="form-label">任务内容</label>
                <input type="text" class="form-input" id="editTaskText">
            </div>
            <div class="form-group">
                <label class="form-label">日期</label>
                <input type="text" class="form-input" id="editTaskDate">
            </div>
            <div class="form-group">
                <label class="form-label">优先级</label>
                <select class="form-select" id="editTaskPriority">
                    <option value="medium">中优先级</option>
                    <option value="high">高优先级</option>
                    <option value="low">低优先级</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">标签</label>
                <select class="form-select" id="editTaskTag">
                    <option value="">无标签</option>
                    <option value="工作">工作</option>
                    <option value="个人">个人</option>
                    <option value="学习">学习</option>
                    <option value="家庭">家庭</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">状态</label>
                <select class="form-select" id="editTaskStatus">
                    <option value="todo">待处理</option>
                    <option value="progress">进行中</option>
                    <option value="done">已完成</option>
                </select>
            </div>
            <div class="form-actions">
                <button class="btn btn-outline" id="cancelEdit">取消</button>
                <button class="btn btn-primary" id="saveTask">保存</button>
            </div>
        </div>
    </div>
    
    <!-- JavaScript -->
    <script>
    // 任务数据存储
    let tasks = [];
    let draggedItem = null;
    let currentDate = new Date();
    let currentEditingTask = null;

    // 自然语言日期解析
    function parseNaturalDate(dateStr) {
        const today = new Date();
        const tomorrow = new Date(today);
        tomorrow.setDate(tomorrow.getDate() + 1);
        
        const nextMonday = new Date(today);
        nextMonday.setDate(nextMonday.getDate() + (1 + 7 - nextMonday.getDay()) % 7);
        
        const dateMap = {
            '今天': today,
            '明天': tomorrow,
            '后天': new Date(tomorrow.getTime() + 86400000),
            '下周': nextMonday,
            '下周一': nextMonday,
            '下周二': new Date(nextMonday.getTime() + 86400000),
            '下周三': new Date(nextMonday.getTime() + 86400000 * 2),
            '下周四': new Date(nextMonday.getTime() + 86400000 * 3),
            '下周五': new Date(nextMonday.getTime() + 86400000 * 4),
            '下周六': new Date(nextMonday.getTime() + 86400000 * 5),
            '下周日': new Date(nextMonday.getTime() + 86400000 * 6),
        };
        
        if (dateMap[dateStr]) {
            return formatDate(dateMap[dateStr]);
        }
        
        return formatDate(today);
    }

    // 格式化日期为YYYY-MM-DD
    function formatDate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    // 拖拽功能
    function dragStart() {
        draggedItem = this;
        this.classList.add('dragging');
        setTimeout(() => this.style.opacity = '0.4', 0);
    }

    function dragEnd() {
        this.classList.remove('dragging');
        this.style.opacity = '1';
        draggedItem = null;
    }

    function dragOver(e) {
        e.preventDefault();
        this.classList.add('drop-over');
    }

    function dragEnter(e) {
        e.preventDefault();
        this.style.backgroundColor = 'rgba(0,0,0,0.1)';
    }

    function dragLeave() {
        this.classList.remove('drop-over');
        this.style.backgroundColor = '';
    }

    function drop() {
        this.classList.remove('drop-over');
        this.style.backgroundColor = '';
        if (draggedItem && this.classList.contains('board-column')) {
            this.querySelector('.cards-container').appendChild(draggedItem);
            updateTaskStatus(draggedItem.id, this.id);
        }
    }

    function setupDragAndDrop() {
        const cards = document.querySelectorAll('.card');
        const columns = document.querySelectorAll('.board-column');

        cards.forEach(card => {
            card.draggable = true;
            card.addEventListener('dragstart', dragStart);
            card.addEventListener('dragend', dragEnd);
        });

        columns.forEach(column => {
            column.addEventListener('dragover', dragOver);
            column.addEventListener('dragenter', dragEnter);
            column.addEventListener('dragleave', dragLeave);
            column.addEventListener('drop', drop);
        });
    }

    // 任务管理功能
    function addTask() {
        const taskInput = document.getElementById('taskInput');
        const dateInput = document.getElementById('taskDate');
        const prioritySelect = document.getElementById('taskPriority');
        const tagSelect = document.getElementById('taskTag');
        
        const taskText = taskInput.value.trim();
        const dateStr = dateInput.value.trim() || '今天';
        
        if (taskText) {
            const newTask = {
                id: Date.now().toString(),
                text: taskText,
                status: 'todo',
                date: parseNaturalDate(dateStr),
                priority: prioritySelect.value,
                tag: tagSelect.value
            };
            
            tasks.push(newTask);
            renderTask(newTask);
            taskInput.value = '';
            dateInput.value = '今天';
            saveTasks();
            updateTaskCount('todo');
            updateStats();
        }
    }

    // 渲染单个任务
    function renderTask(task) {
        const container = document.getElementById(`${task.status}-container`);
        
        // 移除空状态提示
        const emptyState = container.querySelector('.empty-state');
        if (emptyState) {
            emptyState.remove();
        }
        
        const taskCard = document.createElement('div');
        taskCard.className = 'card fade-in';
        taskCard.id = task.id;
        taskCard.draggable = true;
        
        // 设置优先级样式
        let priorityClass = '';
        let priorityText = '';
        if (task.priority === 'high') {
            priorityClass = 'priority-high';
            priorityText = '高优先级';
        } else if (task.priority === 'medium') {
            priorityClass = 'priority-medium';
            priorityText = '中优先级';
        } else {
            priorityClass = 'priority-low';
            priorityText = '低优先级';
        }
        
        taskCard.innerHTML = `
            <div class="card-title">${escapeHTML(task.text)}</div>
            ${task.tag ? `<div class="card-tag">${escapeHTML(task.tag)}</div>` : ''}
            <div class="card-info">
                <div class="card-date">
                    <i class="far fa-calendar"></i> ${task.date}
                </div>
                <div class="card-priority ${priorityClass}">${priorityText}</div>
            </div>
            <div class="card-actions">
                <button class="action-btn edit-btn" onclick="openEditModal('${task.id}')">
                    <i class="fas fa-edit"></i>
                </button>
                <button class="action-btn delete-btn" onclick="deleteTask('${task.id}')">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        `;
        
        // 添加双击编辑功能
        taskCard.addEventListener('dblclick', () => openEditModal(task.id));
        
        container.appendChild(taskCard);
    }

    // 更新任务状态
    function updateTaskStatus(taskId, newStatus) {
        const task = tasks.find(t => t.id === taskId);
        if (task) {
            const oldStatus = task.status;
            task.status = newStatus;
            saveTasks();
            updateTaskCount(oldStatus);
            updateTaskCount(newStatus);
            updateStats();
        }
    }

    // 删除任务
    function deleteTask(taskId) {
        const taskIndex = tasks.findIndex(t => t.id === taskId);
        if (taskIndex !== -1) {
            const status = tasks[taskIndex].status;
            tasks.splice(taskIndex, 1);
            const taskElement = document.getElementById(taskId);
            if (taskElement) {
                taskElement.classList.add('fade-out');
                setTimeout(() => {
                    taskElement.remove();
                    checkEmptyState(status);
                    updateTaskCount(status);
                    updateStats();
                }, 300);
            }
            saveTasks();
        }
    }

    // 检查空状态
    function checkEmptyState(status) {
        const container = document.getElementById(`${status}-container`);
        const cards = container.querySelectorAll('.card');
        
        if (cards.length === 0) {
            const emptyState = document.createElement('div');
            emptyState.className = 'empty-state';
            
            let icon = '';
            let text = '';
            
            if (status === 'todo') {
                icon = '<i class="fas fa-inbox"></i>';
                text = '没有待处理任务';
            } else if (status === 'progress') {
                icon = '<i class="fas fa-cogs"></i>';
                text = '没有进行中任务';
            } else {
                icon = '<i class="fas fa-check-circle"></i>';
                text = '没有已完成任务';
            }
            
            emptyState.innerHTML = `${icon}<div>${text}</div>`;
            container.appendChild(emptyState);
        }
    }

    // 更新任务计数
    function updateTaskCount(status) {
        const container = document.getElementById(`${status}-container`);
        const count = container.querySelectorAll('.card').length;
        document.querySelector(`#${status} .task-count`).textContent = `${count} 任务`;
    }

    // 更新统计信息
    function updateStats() {
        const totalTasks = tasks.length;
        const completedTasks = tasks.filter(t => t.status === 'done').length;
        
        document.getElementById('totalTasks').textContent = totalTasks;
        document.getElementById('completedTasks').textContent = completedTasks;
    }

    // 视图切换功能
    function switchView(viewType) {
        // 重置所有视图
        document.getElementById('boardView').style.display = 'none';
        document.getElementById('calendarView').style.display = 'none';
        document.getElementById('searchView').style.display = 'none';
        
        // 重置按钮状态
        document.getElementById('boardViewBtn').classList.remove('active');
        document.getElementById('calendarViewBtn').classList.remove('active');
        document.getElementById('searchViewBtn').classList.remove('active');
        
        // 激活当前视图
        if (viewType === 'board') {
            document.getElementById('boardView').style.display = 'grid';
            document.getElementById('boardViewBtn').classList.add('active');
        } else if (viewType === 'calendar') {
            document.getElementById('calendarView').style.display = 'block';
            document.getElementById('calendarViewBtn').classList.add('active');
            renderCalendar();
        } else if (viewType === 'search') {
            document.getElementById('searchView').style.display = 'flex';
            document.getElementById('searchViewBtn').classList.add('active');
            filterTasks();
        }
    }

    // 日历功能
    function renderCalendar() {
        const calendarGrid = document.getElementById('calendarGrid');
        calendarGrid.innerHTML = '';
        
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const today = new Date();
        
        document.querySelector('.calendar-title').textContent = `${year}年${month + 1}月`;
        
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const daysInMonth = lastDay.getDate();
        const startingDay = firstDay.getDay();
        
        // 渲染日历日期格子
        for (let i = 0; i < startingDay; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.className = 'calendar-day empty';
            calendarGrid.appendChild(emptyCell);
        }
        
        for (let day = 1; day <= daysInMonth; day++) {
            const dayCell = document.createElement('div');
            dayCell.className = 'calendar-day';
            
            // 标记今天
            if (year === today.getFullYear() && 
                month === today.getMonth() && 
                day === today.getDate()) {
                dayCell.classList.add('today');
            }
            
            const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const dayTasks = tasks.filter(task => task.date === dateKey);
            
            dayCell.innerHTML = `
                <div class="day-number">${day}</div>
                <div class="day-tasks">
                    ${dayTasks.slice(0, 3).map(task => `
                        <div class="day-task-item">${escapeHTML(task.text)}</div>
                    `).join('')}
                    ${dayTasks.length > 3 ? `<div class="day-task-item">+${dayTasks.length - 3} 更多</div>` : ''}
                </div>
            `;
            
            if (dayTasks.length > 0) {
                dayCell.classList.add('has-tasks');
            }
            
            dayCell.addEventListener('click', () => showDayTasks(year, month + 1, day));
            calendarGrid.appendChild(dayCell);
        }
        
        // 隐藏详情区域
        document.getElementById('dayDetail').style.display = 'none';
    }

    // 显示某天的任务详情
    function showDayTasks(year, month, day) {
        const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dateDisplay = `${year}年${month}月${day}日`;
        document.getElementById('detailDate').textContent = dateDisplay;
        const dayTasksList = document.getElementById('dayTasksList');
        dayTasksList.innerHTML = '';
        
        // 获取这一天的所有任务
        const dayTasks = tasks.filter(task => task.date === dateStr);
        
        if (dayTasks.length === 0) {
            dayTasksList.innerHTML = '<li class="detail-task-item">这一天没有任务</li>';
        } else {
            dayTasks.forEach(task => {
                const taskItem = document.createElement('li');
                taskItem.className = 'detail-task-item';
                
                let statusClass = '';
                let statusText = '';
                if (task.status === 'todo') {
                    statusClass = 'status-todo';
                    statusText = '待处理';
                } else if (task.status === 'progress') {
                    statusClass = 'status-progress';
                    statusText = '进行中';
                } else {
                    statusClass = 'status-done';
                    statusText = '已完成';
                }
                
                // 优先级样式
                let priorityClass = '';
                if (task.priority === 'high') {
                    priorityClass = 'priority-high';
                } else if (task.priority === 'medium') {
                    priorityClass = 'priority-medium';
                } else {
                    priorityClass = 'priority-low';
                }
                
                taskItem.innerHTML = `
                    <div>
                        <span class="task-status ${statusClass}"></span>
                        <span>${escapeHTML(task.text)}</span>
                        ${task.tag ? `<span class="card-tag">${escapeHTML(task.tag)}</span>` : ''}
                    </div>
                    <div class="${priorityClass}">${statusText}</div>
                `;
                
                // 添加点击事件编辑任务
                taskItem.addEventListener('click', () => openEditModal(task.id));
                
                dayTasksList.appendChild(taskItem);
            });
        }
        
        // 显示详情区域
        document.getElementById('dayDetail').style.display = 'block';
    }

    // 打开编辑模态框
    function openEditModal(taskId) {
        const task = tasks.find(t => t.id === taskId);
        if (!task) return;
        
        currentEditingTask = task;
        
        document.getElementById('editTaskText').value = task.text;
        document.getElementById('editTaskDate').value = task.date;
        document.getElementById('editTaskPriority').value = task.priority;
        document.getElementById('editTaskTag').value = task.tag || '';
        document.getElementById('editTaskStatus').value = task.status;
        
        document.getElementById('editModal').style.display = 'flex';
    }

    // 保存编辑后的任务
    function saveEditedTask() {
        if (!currentEditingTask) return;
        
        const task = tasks.find(t => t.id === currentEditingTask.id);
        if (task) {
            const oldStatus = task.status;
            
            task.text = document.getElementById('editTaskText').value;
            task.date = document.getElementById('editTaskDate').value;
            task.priority = document.getElementById('editTaskPriority').value;
            task.tag = document.getElementById('editTaskTag').value;
            task.status = document.getElementById('editTaskStatus').value;
            
            // 如果状态发生变化，需要移动任务
            if (oldStatus !== task.status) {
                const oldContainer = document.getElementById(`${oldStatus}-container`);
                const taskElement = document.getElementById(task.id);
                if (taskElement) {
                    oldContainer.removeChild(taskElement);
                    checkEmptyState(oldStatus);
                }
                
                const newContainer = document.getElementById(`${task.status}-container`);
                // 移除空状态提示
                const emptyState = newContainer.querySelector('.empty-state');
                if (emptyState) {
                    emptyState.remove();
                }
                renderTask(task);
            } else {
                // 只更新内容
                const taskElement = document.getElementById(task.id);
                if (taskElement) {
                    // 设置优先级样式
                    let priorityClass = '';
                    let priorityText = '';
                    if (task.priority === 'high') {
                        priorityClass = 'priority-high';
                        priorityText = '高优先级';
                    } else if (task.priority === 'medium') {
                        priorityClass = 'priority-medium';
                        priorityText = '中优先级';
                    } else {
                        priorityClass = 'priority-low';
                        priorityText = '低优先级';
                    }
                    
                    taskElement.querySelector('.card-title').textContent = task.text;
                    taskElement.querySelector('.card-date').innerHTML = `<i class="far fa-calendar"></i> ${task.date}`;
                    taskElement.querySelector('.card-priority').className = `card-priority ${priorityClass}`;
                    taskElement.querySelector('.card-priority').textContent = priorityText;
                    
                    const tagElement = taskElement.querySelector('.card-tag');
                    if (task.tag) {
                        if (!tagElement) {
                            const titleElement = taskElement.querySelector('.card-title');
                            const tag = document.createElement('div');
                            tag.className = 'card-tag';
                            tag.textContent = task.tag;
                            titleElement.after(tag);
                        } else {
                            tagElement.textContent = task.tag;
                        }
                    } else if (tagElement) {
                        tagElement.remove();
                    }
                }
            }
            
            saveTasks();
            updateTaskCount(oldStatus);
            updateTaskCount(task.status);
            updateStats();
        }
        
        closeEditModal();
    }

    // 关闭编辑模态框
    function closeEditModal() {
        document.getElementById('editModal').style.display = 'none';
        currentEditingTask = null;
    }

    // 过滤任务
    function filterTasks() {
        const searchText = document.getElementById('searchInput').value.toLowerCase();
        const statusFilter = document.getElementById('statusFilter').value;
        const priorityFilter = document.getElementById('priorityFilter').value;
        
        // 清除看板视图
        document.getElementById('todo-container').innerHTML = '';
        document.getElementById('progress-container').innerHTML = '';
        document.getElementById('done-container').innerHTML = '';
        
        // 添加空状态
        document.getElementById('todo-container').innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><div>没有待处理任务</div></div>';
        document.getElementById('progress-container').innerHTML = '<div class="empty-state"><i class="fas fa-cogs"></i><div>没有进行中任务</div></div>';
        document.getElementById('done-container').innerHTML = '<div class="empty-state"><i class="fas fa-check-circle"></i><div>没有已完成任务</div></div>';
        
        // 过滤任务
        const filteredTasks = tasks.filter(task => {
            const matchesSearch = task.text.toLowerCase().includes(searchText) || 
                                 (task.tag && task.tag.toLowerCase().includes(searchText));
            const matchesStatus = statusFilter === 'all' || task.status === statusFilter;
            const matchesPriority = priorityFilter === 'all' || task.priority === priorityFilter;
            
            return matchesSearch && matchesStatus && matchesPriority;
        });
        
        // 渲染过滤后的任务
        filteredTasks.forEach(task => {
            renderTask(task);
        });
        
        // 更新任务计数
        updateTaskCount('todo');
        updateTaskCount('progress');
        updateTaskCount('done');
    }

    // 转义HTML防止XSS
    function escapeHTML(str) {
        return str.replace(/[&<>"']/g, 
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[tag]));
    }

    // 本地存储功能
    function saveTasks() {
        localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    function loadTasks() {
        const savedTasks = localStorage.getItem('tasks');
        if (savedTasks) {
            tasks = JSON.parse(savedTasks);
            tasks.forEach(task => renderTask(task));
            
            // 更新任务计数
            updateTaskCount('todo');
            updateTaskCount('progress');
            updateTaskCount('done');
            updateStats();
        }
    }

    // 初始化函数
    function init() {
        loadTasks();
        setupDragAndDrop();
        renderCalendar();
        
        // 事件监听
        document.getElementById('addTaskBtn').addEventListener('click', addTask);
        document.getElementById('taskInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });
        
        document.getElementById('boardViewBtn').addEventListener('click', () => switchView('board'));
        document.getElementById('calendarViewBtn').addEventListener('click', () => switchView('calendar'));
        document.getElementById('searchViewBtn').addEventListener('click', () => switchView('search'));
        
        document.getElementById('prevMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });
        
        document.getElementById('nextMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });
        
        document.getElementById('today').addEventListener('click', () => {
            currentDate = new Date();
            renderCalendar();
        });
        
        // 编辑模态框事件
        document.getElementById('closeModal').addEventListener('click', closeEditModal);
        document.getElementById('cancelEdit').addEventListener('click', closeEditModal);
        document.getElementById('saveTask').addEventListener('click', saveEditedTask);
        
        // 搜索和过滤事件
        document.getElementById('searchInput').addEventListener('input', filterTasks);
        document.getElementById('statusFilter').addEventListener('change', filterTasks);
        document.getElementById('priorityFilter').addEventListener('change', filterTasks);
        
        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeEditModal();
            }
        });
    }

    document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
