<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简约秒表</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        
        h1 {
            margin-top: 0;
            color: #444;
            font-weight: 300;
        }
        
        .display {
            font-size: 3.5rem;
            font-weight: 300;
            margin: 20px 0;
            letter-spacing: 2px;
            color: #222;
        }
        
        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        button {
            padding: 10px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        #start {
            background-color: #4CAF50;
            color: white;
        }
        
        #pause {
            background-color: #FFC107;
            color: #333;
        }
        
        #reset {
            background-color: #F44336;
            color: white;
        }
        
        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.9rem;
            color: #666;
            line-height: 1.6;
        }
        
        @media (max-width: 480px) {
            .display {
                font-size: 2.5rem;
            }
            
            .buttons {
                flex-direction: column;
                align-items: center;
            }
            
            button {
                width: 80%;
                padding: 12px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>简约秒表</h1>
        <div class="display" id="display">00:00:00</div>
        <div class="buttons">
            <button id="start">开始</button>
            <button id="pause">暂停</button>
            <button id="reset">结束</button>
        </div>
        <div class="footer">
            <div>本工具由叁贰壹制作</div>
            <div>微信coolman88886666</div>
            <div>QQ邮箱<a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="99a1adaaababafa0a9add9e8e8b7faf6f4">[email&#160;protected]</a></div>
            <div>gmail <a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="087b303c3b3a3a3e31383d486f65696164266b6765">[email&#160;protected]</a></div>
        </div>
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        let timer;
        let hours = 0;
        let minutes = 0;
        let seconds = 0;
        let isRunning = false;
        
        const display = document.getElementById('display');
        const startBtn = document.getElementById('start');
        const pauseBtn = document.getElementById('pause');
        const resetBtn = document.getElementById('reset');
        
        function updateDisplay() {
            const formattedHours = hours.toString().padStart(2, '0');
            const formattedMinutes = minutes.toString().padStart(2, '0');
            const formattedSeconds = seconds.toString().padStart(2, '0');
            display.textContent = `${formattedHours}:${formattedMinutes}:${formattedSeconds}`;
        }
        
        function startTimer() {
            if (!isRunning) {
                isRunning = true;
                timer = setInterval(() => {
                    seconds++;
                    if (seconds === 60) {
                        seconds = 0;
                        minutes++;
                    }
                    if (minutes === 60) {
                        minutes = 0;
                        hours++;
                    }
                    updateDisplay();
                }, 1000);
            }
        }
        
        function pauseTimer() {
            clearInterval(timer);
            isRunning = false;
        }
        
        function resetTimer() {
            clearInterval(timer);
            isRunning = false;
            hours = 0;
            minutes = 0;
            seconds = 0;
            updateDisplay();
        }
        
        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resetBtn.addEventListener('click', resetTimer);
        
        // 初始化显示
        updateDisplay();
    </script>
</body>
</html>
