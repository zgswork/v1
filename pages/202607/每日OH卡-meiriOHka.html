        <div class="flex justify-center flex-wrap gap-3">

          <button class="w-8 h-8 rounded-full bg-morandi-green color-btn" data-color="bg-morandi-green"></button>
          <button class="w-8 h-8 rounded-full bg-morandi-pink color-btn" data-color="bg-morandi-pink"></button>
          <button class="w-8 h-8 rounded-full bg-morandi-lightgray color-btn" data-color="bg-morandi-lightgray"></button>
          <button class="w-8 h-8 rounded-full bg-morandi-yellow color-btn" data-color="bg-morandi-yellow"></button>

          <button class="w-8 h-8 rounded-full bg-morandi-brown color-btn" data-color="bg-morandi-brown"></button>
          <button class="w-8 h-8 rounded-full bg-morandi-teal color-btn" data-color="bg-morandi-teal"></button>
          <button class="w-8 h-8 rounded-full bg-morandi-lightwhite color-btn" data-color="bg-morandi-lightwhite"></button>

          <i class="fa fa-download mr-2"></i> 导出卡片

    </div>
  </main>

        "https://picsum.photos/id/119/800/800", "https://picsum.photos/id/160/800/800", "https://picsum.photos/id/169/800/800",
        "https://picsum.photos/id/183/800/800", "https://picsum.photos/id/200/800/800", "https://picsum.photos/id/216/800/800",

        // 家庭相关主题
        "https://picsum.photos/id/22/800/800", "https://picsum.photos/id/55/800/800", "https://picsum.photos/id/60/800/800",
        "https://picsum.photos/id/62/800/800", "https://picsum.photos/id/84/800/800", "https://picsum.photos/id/103/800/800",
        "https://picsum.photos/id/122/800/800", "https://picsum.photos/id/134/800/800", "https://picsum.photos/id/146/800/800",
        "https://picsum.photos/id/175/800/800", "https://picsum.photos/id/214/800/800", "https://picsum.photos/id/237/800/800",
        
        // 人际关系主题
        "https://picsum.photos/id/342/800/800", "https://picsum.photos/id/349/800/800", "https://picsum.photos/id/350/800/800",
        "https://picsum.photos/id/352/800/800", "https://picsum.photos/id/364/800/800", "https://picsum.photos/id/365/800/800",
        "https://picsum.photos/id/370/800/800", "https://picsum.photos/id/372/800/800", "https://picsum.photos/id/380/800/800",
        "https://picsum.photos/id/382/800/800", "https://picsum.photos/id/385/800/800", "https://picsum.photos/id/399/800/800",
        
        // 情感相关主题
        "https://picsum.photos/id/401/800/800", "https://picsum.photos/id/403/800/800", "https://picsum.photos/id/405/800/800",
        "https://picsum.photos/id/416/800/800", "https://picsum.photos/id/425/800/800", "https://picsum.photos/id/429/800/800",
        "https://picsum.photos/id/430/800/800", "https://picsum.photos/id/431/800/800", "https://picsum.photos/id/433/800/800",
        "https://picsum.photos/id/437/800/800", "https://picsum.photos/id/447/800/800", "https://picsum.photos/id/452/800/800"
      ]
    };
    
    // 获取DOM元素
    const cardContainer = document.getElementById('cardContainer');
    const imageCardElement = document.getElementById('imageCard');
    const wordCardElement = document.getElementById('wordCard');
    const currentDateElement = document.getElementById('currentDate');
    const changeCardsBtn = document.getElementById('changeCardsBtn');
    const exportBtn = document.getElementById('exportBtn');
    const colorButtons = document.querySelectorAll('.color-btn');
    
    // 设置当前日期
    function setCurrentDate() {
      const now = new Date();
      const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
      currentDateElement.textContent = now.toLocaleDateString('zh-CN', options);
    }
    
    // 随机获取一张字卡和一张图卡
    function getRandomCards() {
      // 随机选择一张字卡
      const randomWordIndex = Math.floor(Math.random() * ohCards.words.length);
      const word = ohCards.words[randomWordIndex];
      
      // 随机选择一张图卡
      const randomImageIndex = Math.floor(Math.random() * ohCards.images.length);
      const image = ohCards.images[randomImageIndex];
      
      return { word, image };
    }
    
    // 更新卡片显示
    function updateCards() {
      const { word, image } = getRandomCards();
      
      // 添加过渡效果
      imageCardElement.classList.add('opacity-0', 'transition-opacity', 'duration-500');
      wordCardElement.classList.add('opacity-0', 'transition-opacity', 'duration-500');
      
      // 更新图片和文字
      setTimeout(() => {
        imageCardElement.src = image;
        wordCardElement.textContent = word;
        
        // 显示内容
        imageCardElement.classList.remove('opacity-0');
        wordCardElement.classList.remove('opacity-0');
      }, 300);
    }
    
    // 更改背景颜色
    function changeBackgroundColor(colorClass) {
      // 移除所有莫兰迪色类
      Object.keys(tailwind.config.theme.extend.colors.morandi).forEach(color => {
        cardContainer.classList.remove(`bg-morandi-${color}`);
      });
      
      // 添加选中的颜色类
      cardContainer.classList.add(colorClass);
      
      // 更新活跃的颜色按钮
      colorButtons.forEach(btn => {
        btn.classList.remove('ring-4', 'ring-gray-300', 'scale-110');
      });
      document.querySelector(`.color-btn[data-color="${colorClass}"]`).classList.add('ring-4', 'ring-gray-300', 'scale-110');
    }
    
    // 导出卡片为图片
    function exportCardAsImage() {
      // 显示加载状态
      exportBtn.disabled = true;
      exportBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i> 正在导出...';
      
      html2canvas(cardContainer, {
        scale: 2, // 提高分辨率
        useCORS: true,
        logging: false,
        allowTaint: false,
        backgroundColor: null
      }).then(canvas => {
        try {
          // 创建下载链接
          const link = document.createElement('a');
          link.download = `每日OH卡-${new Date().toLocaleDateString().replace(/\//g, '-')}.png`;
          
          // 处理不同浏览器的兼容性
          if (navigator.msSaveBlob) {
            // IE/Edge 兼容
            canvas.toBlob(blob => {
              navigator.msSaveBlob(blob, link.download);
            });
          } else {
            // 标准浏览器
            link.href = canvas.toDataURL('image/png');
            link.click();
          }
        } catch (error) {
          console.error('导出失败:', error);
          alert('导出失败，请重试');
        } finally {
          // 恢复按钮状态
          exportBtn.disabled = false;
          exportBtn.innerHTML = '<i class="fa fa-download mr-2"></i> 导出卡片';
        }
      }).catch(error => {
        console.error('导出失败:', error);
        alert('导出失败，请重试');
        // 恢复按钮状态
        exportBtn.disabled = false;
        exportBtn.innerHTML = '<i class="fa fa-download mr-2"></i> 导出卡片';
      });
    }
    
    // 初始化页面
    function init() {
      setCurrentDate();
      updateCards();
      
      // 默认选中第一个颜色
      colorButtons[0].classList.add('ring-4', 'ring-gray-300', 'scale-110');
    }
    
    // 事件监听
    changeCardsBtn.addEventListener('click', updateCards);
    exportBtn.addEventListener('click', exportCardAsImage);
    
    // 颜色按钮点击事件
    colorButtons.forEach(button => {
      button.addEventListener('click', () => {
        const colorClass = button.getAttribute('data-color');
        changeBackgroundColor(colorClass);
      });
    });
    
    // 图片加载错误处理
    imageCardElement.addEventListener('error', function() {
      console.log('图片加载失败，尝试重新加载');
      // 如果图片加载失败，尝试重新加载另一张
      const randomImageIndex = Math.floor(Math.random() * ohCards.images.length);
      this.src = ohCards.images[randomImageIndex];
    });
    
    // 页面加载完成后初始化
    window.addEventListener('DOMContentLoaded', init);
  </script>
