<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浏览器插件图标转换工具</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 30px auto;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #4a6bdf;
            font-weight: 600;
        }
        .header p {
            color: #6c757d;
        }
        .nav-tabs .nav-link {
            color: #495057;
            font-weight: 500;
            border: none;
            padding: 12px 20px;
            border-radius: 0;
            border-bottom: 3px solid transparent;
        }
        .nav-tabs .nav-link.active {
            color: #4a6bdf;
            background-color: transparent;
            border-bottom: 3px solid #4a6bdf;
        }
        .tab-content {
            padding: 30px 0;
        }
        .upload-area {
            border: 2px dashed #dee2e6;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            margin-bottom: 20px;
            transition: all 0.3s;
            cursor: pointer;
        }
        .upload-area:hover {
            border-color: #4a6bdf;
            background-color: #f8f9fa;
        }
        .upload-icon {
            font-size: 48px;
            color: #4a6bdf;
            margin-bottom: 15px;
        }
        .preview-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }
        .preview-item {
            text-align: center;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }
        .preview-item img {
            display: block;
            margin: 0 auto 10px;
            border: 1px solid #eee;
        }
        .btn-primary {
            background-color: #4a6bdf;
            border-color: #4a6bdf;
        }
        .btn-primary:hover {
            background-color: #3a5bce;
            border-color: #3a5bce;
        }
        .btn-outline-primary {
            color: #4a6bdf;
            border-color: #4a6bdf;
        }
        .btn-outline-primary:hover {
            background-color: #4a6bdf;
            border-color: #4a6bdf;
        }
        .form-check-input:checked {
            background-color: #4a6bdf;
            border-color: #4a6bdf;
        }
        .size-checkbox-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .size-checkbox {
            display: inline-flex;
            align-items: center;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 8px 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .size-checkbox:hover {
            border-color: #4a6bdf;
        }
        .size-checkbox input {
            margin-right: 8px;
        }
        .format-radio-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .format-radio {
            display: inline-flex;
            align-items: center;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 8px 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .format-radio:hover {
            border-color: #4a6bdf;
        }
        .format-radio input {
            margin-right: 8px;
        }
        .download-btn {
            margin-top: 5px;
        }
        .alert {
            margin-top: 20px;
        }
        .hidden {
            display: none;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(74, 107, 223, 0.3);
            border-radius: 50%;
            border-top-color: #4a6bdf;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>浏览器插件图标转换工具</h1>
            <p>轻松转换和生成浏览器插件所需的各种尺寸图标</p>
        </div>

        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="icon-generator-tab" data-bs-toggle="tab" data-bs-target="#icon-generator" type="button" role="tab" aria-controls="icon-generator" aria-selected="true">
                    <i class="bi bi-grid-3x3-gap"></i> 插件图标生成器
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="format-converter-tab" data-bs-toggle="tab" data-bs-target="#format-converter" type="button" role="tab" aria-controls="format-converter" aria-selected="false">
                    <i class="bi bi-arrow-left-right"></i> 格式转换器
                </button>
            </li>
        </ul>

        <div class="tab-content" id="myTabContent">
            <!-- 插件图标生成器 Tab -->
            <div class="tab-pane fade show active" id="icon-generator" role="tabpanel" aria-labelledby="icon-generator-tab">
                <div class="upload-area" id="iconUploadArea">
                    <i class="bi bi-cloud-arrow-up upload-icon"></i>
                    <h4>拖放或点击上传图片</h4>
                    <p class="text-muted">支持 PNG, JPG, SVG 格式</p>
                    <input type="file" id="iconUploadInput" class="hidden" accept="image/*">
                </div>

                <div id="iconSettings" class="hidden">
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <h5>选择输出尺寸</h5>
                            <div class="size-checkbox-container">
                                <label class="size-checkbox">
                                    <input type="checkbox" class="size-option" value="16" checked> 16×16
                                </label>
                                <label class="size-checkbox">
                                    <input type="checkbox" class="size-option" value="19" checked> 19×19
                                </label>
                                <label class="size-checkbox">
                                    <input type="checkbox" class="size-option" value="32" checked> 32×32
                                </label>
                                <label class="size-checkbox">
                                    <input type="checkbox" class="size-option" value="38" checked> 38×38
                                </label>
                                <label class="size-checkbox">
                                    <input type="checkbox" class="size-option" value="48" checked> 48×48
                                </label>
                                <label class="size-checkbox">
                                    <input type="checkbox" class="size-option" value="128" checked> 128×128
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <h5>选择输出格式</h5>
                            <div class="format-radio-container">
                                <label class="format-radio">
                                    <input type="radio" name="formatOption" value="png" checked> PNG
                                </label>
                                <label class="format-radio">
                                    <input type="radio" name="formatOption" value="svg"> SVG
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <button class="btn btn-outline-primary" id="generateIconsBtn">
                            <i class="bi bi-gear"></i> 生成图标
                        </button>
                    </div>
                </div>

                <div id="iconPreviewContainer" class="hidden">
                    <h5 class="mb-3">预览和下载</h5>
                    <div class="preview-container" id="iconPreviewGrid"></div>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                        <button class="btn btn-primary" id="downloadAllIconsBtn">
                            <i class="bi bi-download"></i> 下载全部图标
                        </button>
                    </div>
                </div>

                <div class="alert alert-info hidden" id="iconGeneratorAlert" role="alert"></div>
            </div>

            <!-- 格式转换器 Tab -->
            <div class="tab-pane fade" id="format-converter" role="tabpanel" aria-labelledby="format-converter-tab">
                <div class="upload-area" id="formatUploadArea">
                    <i class="bi bi-arrow-repeat upload-icon"></i>
                    <h4>拖放或点击上传图片</h4>
                    <p class="text-muted">支持 PNG 和 SVG 格式，可以选择多个文件</p>
                    <input type="file" id="formatUploadInput" class="hidden" accept="image/png,image/svg+xml" multiple>
                </div>

                <div id="formatPreviewContainer" class="hidden">
                    <h5 class="mb-3">预览和下载</h5>
                    <div class="preview-container" id="formatPreviewGrid"></div>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                        <button class="btn btn-primary" id="downloadAllConvertedBtn">
                            <i class="bi bi-download"></i> 下载全部转换后的图片
                        </button>
                    </div>
                </div>

                <div class="alert alert-info hidden" id="formatConverterAlert" role="alert"></div>
            </div>
        </div>

        <!-- 开发者联系方式 -->
        <div class="mt-5 pt-4 border-top">
            <div class="row align-items-center">
                <div class="col-md-6 text-center text-md-start mb-3 mb-md-0">
                    <h5 class="text-primary">联系开发者</h5>
                    <p class="mb-1">有任何使用问题或建议，欢迎联系我：</p>
                    <p class="mb-1"><strong>公众号：</strong>东哥说AI</p>
                    <p class="mb-0"><strong>个人微信：</strong>donggeai02</p>
                </div>
                <div class="col-md-6 text-center">
                    <div class="qrcode-container">
                        <img id="qrcode" src="" alt="公众号二维码" style="max-width: 150px; border: 1px solid #eee; padding: 5px;">
                        <p class="mt-2 text-muted">扫码关注公众号</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JSZip 库用于打包下载 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- FileSaver.js 用于保存文件 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 主要脚本 -->

            // 格式转换器相关元素
            const formatUploadArea = document.getElementById('formatUploadArea');
            const formatUploadInput = document.getElementById('formatUploadInput');
            const formatPreviewContainer = document.getElementById('formatPreviewContainer');
            const formatPreviewGrid = document.getElementById('formatPreviewGrid');
            const downloadAllConvertedBtn = document.getElementById('downloadAllConvertedBtn');
            const formatConverterAlert = document.getElementById('formatConverterAlert');

            // 存储上传的图片和生成的图标
            let uploadedIconImage = null;
            let generatedIcons = [];
            let convertedImages = [];

            // 插件图标生成器 - 上传区域点击事件
            iconUploadArea.addEventListener('click', () => {
                iconUploadInput.click();
            });

            // 插件图标生成器 - 文件上传事件
            iconUploadInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    handleIconImageUpload(file);
                }
            });

            // 插件图标生成器 - 拖放事件
            iconUploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                iconUploadArea.style.borderColor = '#4a6bdf';
                iconUploadArea.style.backgroundColor = '#f8f9fa';
            });

            iconUploadArea.addEventListener('dragleave', () => {
                iconUploadArea.style.borderColor = '#dee2e6';
                iconUploadArea.style.backgroundColor = '';
            });

            iconUploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                iconUploadArea.style.borderColor = '#dee2e6';
                iconUploadArea.style.backgroundColor = '';
                
                const file = e.dataTransfer.files[0];
                if (file && file.type.startsWith('image/')) {
                    handleIconImageUpload(file);
                } else {
                    showAlert(iconGeneratorAlert, '请上传有效的图片文件', 'danger');
                }
            });

            // 插件图标生成器 - 生成图标按钮点击事件
            generateIconsBtn.addEventListener('click', () => {
                generateIcons();
            });

            // 插件图标生成器 - 下载全部图标按钮点击事件
            downloadAllIconsBtn.addEventListener('click', () => {
                downloadAllIcons();
            });

            // 格式转换器 - 上传区域点击事件
            formatUploadArea.addEventListener('click', () => {
                formatUploadInput.click();
            });

            // 格式转换器 - 文件上传事件
            formatUploadInput.addEventListener('change', (e) => {
                const files = e.target.files;
                if (files.length > 0) {
                    handleFormatImagesUpload(files);
                }
            });

            // 格式转换器 - 拖放事件
            formatUploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                formatUploadArea.style.borderColor = '#4a6bdf';
                formatUploadArea.style.backgroundColor = '#f8f9fa';
            });

            formatUploadArea.addEventListener('dragleave', () => {
                formatUploadArea.style.borderColor = '#dee2e6';
                formatUploadArea.style.backgroundColor = '';
            });

            formatUploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                formatUploadArea.style.borderColor = '#dee2e6';
                formatUploadArea.style.backgroundColor = '';
                
                const files = e.dataTransfer.files;
                const imageFiles = Array.from(files).filter(file => 
                    file.type === 'image/png' || file.type === 'image/svg+xml'
                );
                
                if (imageFiles.length > 0) {
                    handleFormatImagesUpload(imageFiles);
                } else {
                    showAlert(formatConverterAlert, '请上传有效的PNG或SVG图片文件', 'danger');
                }
            });

            // 格式转换器 - 下载全部转换后的图片按钮点击事件
            downloadAllConvertedBtn.addEventListener('click', () => {
                downloadAllConvertedImages();
            });

            // 处理插件图标生成器的图片上传
            function handleIconImageUpload(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedIconImage = {
                        data: e.target.result,
                        name: file.name,
                        type: file.type
                    };
                    
                    // 显示设置区域
                    iconSettings.classList.remove('hidden');
                    // 隐藏预览区域（如果之前显示过）
                    iconPreviewContainer.classList.add('hidden');
                    // 更新上传区域显示
                    iconUploadArea.innerHTML = `
                        <img src="${e.target.result}" alt="Uploaded Image" style="max-width: 100%; max-height: 200px; margin-bottom: 15px;">
                        <h5>${file.name}</h5>
                        <p class="text-muted">点击更换图片</p>
                    `;
                    
                    showAlert(iconGeneratorAlert, '图片上传成功，请选择输出选项并点击生成图标', 'success');
                };
                reader.readAsDataURL(file);
            }

            // 生成插件图标
            function generateIcons() {
                if (!uploadedIconImage) {
                    showAlert(iconGeneratorAlert, '请先上传图片', 'warning');
                    return;
                }

                // 获取选中的尺寸
                const selectedSizes = Array.from(document.querySelectorAll('.size-option:checked')).map(checkbox => parseInt(checkbox.value));
                if (selectedSizes.length === 0) {
                    showAlert(iconGeneratorAlert, '请至少选择一个输出尺寸', 'warning');
                    return;
                }

                // 获取选中的格式
                const selectedFormat = document.querySelector('input[name="formatOption"]:checked').value;

                // 显示加载状态
                generateIconsBtn.innerHTML = '<span class="loading"></span> 生成中...';
                generateIconsBtn.disabled = true;

                // 清空之前的预览
                iconPreviewGrid.innerHTML = '';
                generatedIcons = [];

                // 创建图像对象
                const img = new Image();
                img.onload = function() {
                    // 为每个选中的尺寸生成图标
                    selectedSizes.forEach(size => {
                        if (selectedFormat === 'png') {
                            generatePNGIcon(img, size);
                        } else {
                            generateSVGIcon(img, size);
                        }
                    });

                    // 显示预览区域
                    iconPreviewContainer.classList.remove('hidden');
                    // 恢复按钮状态
                    generateIconsBtn.innerHTML = '<i class="bi bi-gear"></i> 生成图标';
                    generateIconsBtn.disabled = false;

                    showAlert(iconGeneratorAlert, `成功生成 ${selectedSizes.length} 个 ${selectedFormat.toUpperCase()} 图标`, 'success');
                };
                img.src = uploadedIconImage.data;
            }

            // 生成PNG图标
            function generatePNGIcon(img, size) {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, size, size);
                
                const iconData = canvas.toDataURL('image/png');
                const fileName = `icon${size}.png`;
                
                // 存储生成的图标
                generatedIcons.push({
                    data: iconData,
                    name: fileName,
                    size: size,
                    format: 'png'
                });
                
                // 添加到预览区域
                addIconPreview(iconData, fileName, size);
            }

            // 生成SVG图标
            function generateSVGIcon(img, size) {
                // 如果原图是SVG，我们可以直接使用它并调整尺寸
                if (uploadedIconImage.type === 'image/svg+xml') {
                    const parser = new DOMParser();
                    const svgDoc = parser.parseFromString(uploadedIconImage.data, 'image/svg+xml');
                    const svgElement = svgDoc.documentElement;
                    
                    svgElement.setAttribute('width', size);
                    svgElement.setAttribute('height', size);
                    
                    const serializer = new XMLSerializer();
                    const svgString = serializer.serializeToString(svgElement);
                    const svgBlob = new Blob([svgString], {type: 'image/svg+xml'});
                    const svgUrl = URL.createObjectURL(svgBlob);
                    
                    const fileName = `icon${size}.svg`;
                    
                    // 存储生成的图标
                    generatedIcons.push({
                        data: svgUrl,
                        blob: svgBlob,
                        name: fileName,
                        size: size,
                        format: 'svg'
                    });
                    
                    // 添加到预览区域
                    addIconPreview(svgUrl, fileName, size);
                } else {
                    // 如果原图不是SVG，我们需要将其转换为SVG
                    // 这里使用简单的方法，将PNG嵌入到SVG中
                    const canvas = document.createElement('canvas');
                    canvas.width = size;
                    canvas.height = size;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, size, size);
                    
                    const pngData = canvas.toDataURL('image/png');
                    const svgString = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}">
                        <image width="${size}" height="${size}" href="${pngData}"/>
                    </svg>`;
                    
                    const svgBlob = new Blob([svgString], {type: 'image/svg+xml'});
                    const svgUrl = URL.createObjectURL(svgBlob);
                    
                    const fileName = `icon${size}.svg`;
                    
                    // 存储生成的图标
                    generatedIcons.push({
                        data: svgUrl,
                        blob: svgBlob,
                        name: fileName,
                        size: size,
                        format: 'svg'
                    });
                    
                    // 添加到预览区域
                    addIconPreview(svgUrl, fileName, size);
                }
            }

            // 添加图标预览
            function addIconPreview(iconData, fileName, size) {
                const previewItem = document.createElement('div');
                previewItem.className = 'preview-item';
                previewItem.innerHTML = `
                    <img src="${iconData}" alt="${fileName}" style="width: ${size}px; height: ${size}px;">
                    <p>${fileName}</p>
                    <button class="btn btn-sm btn-outline-primary download-btn" data-filename="${fileName}">
                        <i class="bi bi-download"></i> 下载
                    </button>
                `;
                
                iconPreviewGrid.appendChild(previewItem);
                
                // 添加下载按钮点击事件
                const downloadBtn = previewItem.querySelector('.download-btn');
                downloadBtn.addEventListener('click', () => {
                    const icon = generatedIcons.find(icon => icon.name === fileName);
                    if (icon) {
                        if (icon.format === 'svg' && icon.blob) {
                            saveAs(icon.blob, fileName);
                        } else {
                            // 对于PNG，我们需要从Data URL创建Blob
                            fetch(icon.data)
                                .then(res => res.blob())
                                .then(blob => saveAs(blob, fileName));
                        }
                    }
                });
            }

            // 下载全部图标
            function downloadAllIcons() {
                if (generatedIcons.length === 0) {
                    showAlert(iconGeneratorAlert, '没有可下载的图标', 'warning');
                    return;
                }

                // 如果只有一个图标，直接下载
                if (generatedIcons.length === 1) {
                    const icon = generatedIcons[0];
                    if (icon.format === 'svg' && icon.blob) {
                        saveAs(icon.blob, icon.name);
                    } else {
                        fetch(icon.data)
                            .then(res => res.blob())
                            .then(blob => saveAs(blob, icon.name));
                    }
                    return;
                }

                // 如果有多个图标，使用JSZip打包下载
                const zip = new JSZip();
                let processedCount = 0;

                // 显示加载状态
                downloadAllIconsBtn.innerHTML = '<span class="loading"></span> 打包中...';
                downloadAllIconsBtn.disabled = true;

                generatedIcons.forEach(icon => {
                    if (icon.format === 'svg' && icon.blob) {
                        // 对于SVG，直接添加Blob到zip
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            zip.file(icon.name, e.target.result);
                            processedCount++;
                            checkAllProcessed();
                        };
                        reader.readAsArrayBuffer(icon.blob);
                    } else {
                        // 对于PNG，从Data URL获取Blob
                        fetch(icon.data)
                            .then(res => res.blob())
                            .then(blob => {
                                zip.file(icon.name, blob);
                                processedCount++;
                                checkAllProcessed();
                            });
                    }
                });

                function checkAllProcessed() {
                    if (processedCount === generatedIcons.length) {
                        // 所有图标都已处理，生成zip文件
                        zip.generateAsync({type: 'blob'})
                            .then(function(content) {
                                saveAs(content, 'browser-extension-icons.zip');
                                // 恢复按钮状态
                                downloadAllIconsBtn.innerHTML = '<i class="bi bi-download"></i> 下载全部图标';
                                downloadAllIconsBtn.disabled = false;
                                showAlert(iconGeneratorAlert, '所有图标已打包下载', 'success');
                            });
                    }
                }
            }

            // 处理格式转换器的图片上传
            function handleFormatImagesUpload(files) {
                // 清空之前的预览
                formatPreviewGrid.innerHTML = '';
                convertedImages = [];

                // 显示加载状态
                showAlert(formatConverterAlert, '正在处理图片...', 'info');

                let processedCount = 0;
                Array.from(files).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const fileData = e.target.result;
                        const fileName = file.name;
                        const fileType = file.type;

                        // 确定目标格式
                        const targetFormat = fileType === 'image/svg+xml' ? 'png' : 'svg';
                        const targetMimeType = targetFormat === 'png' ? 'image/png' : 'image/svg+xml';

                        // 转换图片格式
                        convertImageFormat(fileData, fileName, fileType, targetFormat, targetMimeType)
                            .then(convertedImage => {
                                // 存储转换后的图片
                                convertedImages.push(convertedImage);
                                
                                // 添加到预览区域
                                addConvertedImagePreview(convertedImage);
                                
                                processedCount++;
                                if (processedCount === files.length) {
                                    // 所有图片都已处理
                                    formatPreviewContainer.classList.remove('hidden');
                                    showAlert(formatConverterAlert, `成功转换 ${files.length} 张图片`, 'success');
                                }
                            })
                            .catch(error => {
                                console.error('转换图片时出错:', error);
                                processedCount++;
                                if (processedCount === files.length) {
                                    showAlert(formatConverterAlert, '部分图片转换失败', 'warning');
                                }
                            });
                    };
                    reader.readAsDataURL(file);
                });
            }

            // 转换图片格式
            function convertImageFormat(fileData, fileName, fileType, targetFormat, targetMimeType) {
                return new Promise((resolve, reject) => {
                    if (fileType === 'image/svg+xml' && targetFormat === 'png') {
                        // SVG 转 PNG
                        const img = new Image();
                        img.onload = function() {
                            const canvas = document.createElement('canvas');
                            // 使用原始SVG的尺寸，如果没有明确指定，则使用默认尺寸
                            canvas.width = img.width || 128;
                            canvas.height = img.height || 128;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            
                            const pngData = canvas.toDataURL('image/png');
                            const newFileName = fileName.replace(/\.svg$/i, '.png');
                            
                            // 从Data URL创建Blob
                            fetch(pngData)
                                .then(res => res.blob())
                                .then(blob => {
                                    resolve({
                                        originalData: fileData,
                                        data: pngData,
                                        blob: blob,
                                        name: newFileName,
                                        originalName: fileName,
                                        originalFormat: 'svg',
                                        format: 'png'
                                    });
                                })
                                .catch(reject);
                        };
                        img.onerror = reject;
                        img.src = fileData;
                    } else if (fileType === 'image/png' && targetFormat === 'svg') {
                        // PNG 转 SVG
                        const img = new Image();
                        img.onload = function() {
                            // 将PNG嵌入到SVG中
                            const svgString = `<svg xmlns="http://www.w3.org/2000/svg" width="${img.width}" height="${img.height}">
                                <image width="${img.width}" height="${img.height}" href="${fileData}"/>
                            </svg>`;
                            
                            const svgBlob = new Blob([svgString], {type: 'image/svg+xml'});
                            const svgUrl = URL.createObjectURL(svgBlob);
                            const newFileName = fileName.replace(/\.png$/i, '.svg');
                            
                            resolve({
                                originalData: fileData,
                                data: svgUrl,
                                blob: svgBlob,
                                name: newFileName,
                                originalName: fileName,
                                originalFormat: 'png',
                                format: 'svg'
                            });
                        };
                        img.onerror = reject;
                        img.src = fileData;
                    } else {
                        reject(new Error('不支持的格式转换'));
                    }
                });
            }

            // 添加转换后的图片预览
            function addConvertedImagePreview(convertedImage) {
                const previewItem = document.createElement('div');
                previewItem.className = 'preview-item';
                previewItem.innerHTML = `
                    <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
                        <div style="text-align: center; margin-right: 15px;">
                            <img src="${convertedImage.originalData}" alt="原始图片" style="max-width: 64px; max-height: 64px;">
                            <p>${convertedImage.originalName}</p>
                        </div>
                        <i class="bi bi-arrow-right" style="font-size: 24px; margin: 0 10px;"></i>
                        <div style="text-align: center; margin-left: 15px;">
                            <img src="${convertedImage.data}" alt="转换后的图片" style="max-width: 64px; max-height: 64px;">
                            <p>${convertedImage.name}</p>
                        </div>
                    </div>
                    <button class="btn btn-sm btn-outline-primary download-btn" data-filename="${convertedImage.name}">
                        <i class="bi bi-download"></i> 下载
                    </button>
                `;
                
                formatPreviewGrid.appendChild(previewItem);
                
                // 添加下载按钮点击事件
                const downloadBtn = previewItem.querySelector('.download-btn');
                downloadBtn.addEventListener('click', () => {
                    if (convertedImage.format === 'svg' && convertedImage.blob) {
                        saveAs(convertedImage.blob, convertedImage.name);
                    } else {
                        // 对于PNG，我们需要从Data URL创建Blob
                        fetch(convertedImage.data)
                            .then(res => res.blob())
                            .then(blob => saveAs(blob, convertedImage.name));
                    }
                });
            }

            // 下载全部转换后的图片
            function downloadAllConvertedImages() {
                if (convertedImages.length === 0) {
                    showAlert(formatConverterAlert, '没有可下载的图片', 'warning');
                    return;
                }

                // 如果只有一个图片，直接下载
                if (convertedImages.length === 1) {
                    const image = convertedImages[0];
                    if (image.format === 'svg' && image.blob) {
                        saveAs(image.blob, image.name);
                    } else {
                        fetch(image.data)
                            .then(res => res.blob())
                            .then(blob => saveAs(blob, image.name));
                    }
                    return;
                }

                // 如果有多个图片，使用JSZip打包下载
                const zip = new JSZip();
                let processedCount = 0;

                // 显示加载状态
                downloadAllConvertedBtn.innerHTML = '<span class="loading"></span> 打包中...';
                downloadAllConvertedBtn.disabled = true;

                convertedImages.forEach(image => {
                    if (image.format === 'svg' && image.blob) {
                        // 对于SVG，直接添加Blob到zip
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            zip.file(image.name, e.target.result);
                            processedCount++;
                            checkAllProcessed();
                        };
                        reader.readAsArrayBuffer(image.blob);
                    } else {
                        // 对于PNG，从Data URL获取Blob
                        fetch(image.data)
                            .then(res => res.blob())
                            .then(blob => {
                                zip.file(image.name, blob);
                                processedCount++;
                                checkAllProcessed();
                            });
                    }
                });

                function checkAllProcessed() {
                    if (processedCount === convertedImages.length) {
                        // 所有图片都已处理，生成zip文件
                        zip.generateAsync({type: 'blob'})
                            .then(function(content) {
                                saveAs(content, 'converted-images.zip');
                                // 恢复按钮状态
                                downloadAllConvertedBtn.innerHTML = '<i class="bi bi-download"></i> 下载全部转换后的图片';
                                downloadAllConvertedBtn.disabled = false;
                                showAlert(formatConverterAlert, '所有图片已打包下载', 'success');
                            });
                    }
                }
            }

            // 显示提示信息
            function showAlert(alertElement, message, type) {
                alertElement.textContent = message;
                alertElement.className = `alert alert-${type}`;
                alertElement.classList.remove('hidden');
                
                // 5秒后自动隐藏
                setTimeout(() => {
                    alertElement.classList.add('hidden');
                }, 5000);
            }
        });
    </script>
</body>
</html>
