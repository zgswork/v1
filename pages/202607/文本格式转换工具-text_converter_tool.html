<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本格式转换工具</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            color: #333;
        }

        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 1000px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-sizing: border-box;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 2.2em;
            font-weight: 600;
            position: relative;
        }

        h1::before {
            content: '🔄';
            margin-right: 10px;
            font-size: 0.9em;
        }

        textarea {
            width: 100%;
            height: 200px;
            margin-bottom: 25px;
            padding: 20px;
            overflow-y: auto;
            border: 2px solid #e3f2fd;
            border-radius: 15px;
            font-size: 16px;
            font-family: Consolas, 'Courier New', monospace;
            resize: vertical;
            box-sizing: border-box;
            transition: all 0.3s ease;
            background-color: #fafafa;
            line-height: 1.6;
        }

        textarea:focus {
            border-color: #42a5f5;
            box-shadow: 0 0 0 4px rgba(66, 165, 245, 0.15);
            outline: none;
            background-color: #ffffff;
        }

        .buttons-container {
            display: flex;
            flex-wrap: nowrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            padding: 5px;
        }

        button {
            background: linear-gradient(135deg, #42a5f5 0%, #1e88e5 100%);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 500;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 100px;
            max-width: 130px;
            box-shadow: 0 3px 12px rgba(66, 165, 245, 0.3);
            position: relative;
            overflow: hidden;
            white-space: nowrap;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            background: linear-gradient(135deg, #1e88e5 0%, #1565c0 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(66, 165, 245, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        #copyButton {
            background: linear-gradient(135deg, #66bb6a 0%, #4caf50 100%);
            box-shadow: 0 3px 12px rgba(102, 187, 106, 0.3);
        }

        #copyButton:hover {
            background: linear-gradient(135deg, #4caf50 0%, #388e3c 100%);
            box-shadow: 0 4px 16px rgba(102, 187, 106, 0.4);
        }

        #clearButton {
            background: linear-gradient(135deg, #ef5350 0%, #e53935 100%);
            box-shadow: 0 3px 12px rgba(239, 83, 80, 0.3);
        }

        #clearButton:hover {
            background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
            box-shadow: 0 4px 16px rgba(239, 83, 80, 0.4);
        }

        /* 模拟 textarea 样式，用于可编辑的 div */
        .editable-textarea {
            width: 100%;
            height: 200px;
            margin-bottom: 25px;
            padding: 20px;
            border: 2px solid #e3f2fd;
            border-radius: 15px;
            font-size: 16px;
            font-family: Consolas, 'Courier New', monospace;
            resize: vertical;
            box-sizing: border-box;
            text-align: left;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            position: relative;
            background-color: #fafafa;
            cursor: text;
            user-select: text;
            transition: all 0.3s ease;
            line-height: 1.6;
        }

        .editable-textarea:focus {
            border-color: #42a5f5;
            box-shadow: 0 0 0 4px rgba(66, 165, 245, 0.15);
            outline: none;
            background-color: #ffffff;
        }

        /* 模拟 placeholder 样式 */
        .editable-textarea[placeholder]:empty::before {
            content: attr(placeholder);
            color: #999;
            pointer-events: none;
            display: block;
            padding: 20px;
            margin-left: -20px;
            margin-top: -20px;
        }

        .editable-textarea:focus::before {
            content: none;
        }


        /* 查找替换功能样式 */
        .find-replace-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            background: linear-gradient(135deg, #f8f9ff 0%, #e8f4fd 100%);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #e3f2fd;
            box-shadow: 0 8px 25px rgba(66, 165, 245, 0.1);
        }

        .find-replace-container input[type="text"] {
            padding: 12px 16px;
            border: 2px solid #e3f2fd;
            border-radius: 25px;
            font-size: 1em;
            flex-grow: 1;
            min-width: 180px;
            max-width: 280px;
            transition: all 0.3s ease;
            background-color: #ffffff;
            box-sizing: border-box;
        }

        .find-replace-container input[type="text"]:focus {
            border-color: #42a5f5;
            box-shadow: 0 0 0 3px rgba(66, 165, 245, 0.15);
            outline: none;
        }

        .find-replace-container button {
            min-width: 70px;
            padding: 8px 14px;
            font-size: 0.9em;
        }

        .highlight {
            background-color: #fff59d;
            padding: 2px 4px;
            border-radius: 4px;
            box-shadow: 0 1px 3px rgba(255, 193, 7, 0.3);
        }

        .highlight-replaced {
            background-color: #c8e6c9;
            padding: 2px 4px;
            border-radius: 4px;
            box-shadow: 0 1px 3px rgba(76, 175, 80, 0.3);
        }

        /* 页脚样式 */
        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 14px;
            border-top: 1px solid #e3f2fd;
            margin-top: 20px;
        }

        .footer strong {
            font-weight: 600;
            color: #333;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            body {
                padding: 8px;
            }

            .container {
                padding: 20px;
                border-radius: 15px;
                max-width: 100%;
            }

            h1 {
                font-size: 1.8em;
            }

            .buttons-container {
                flex-wrap: wrap;
                gap: 8px;
                padding: 5px;
            }

            /* 前4个按钮：2x2布局 */
            button:nth-child(1),
            button:nth-child(2),
            button:nth-child(3),
            button:nth-child(4) {
                flex: 1 1 calc(50% - 4px);
                min-width: calc(50% - 4px);
                max-width: calc(50% - 4px);
                padding: 10px 8px;
                font-size: 0.85em;
                border-radius: 18px;
            }

            /* 后3个按钮：一行布局 */
            #uploadButton,
            #copyButton,
            #clearButton {
                flex: 1 1 calc(33.333% - 6px);
                min-width: calc(33.333% - 6px);
                max-width: calc(33.333% - 6px);
                padding: 10px 8px;
                font-size: 0.85em;
                border-radius: 18px;
            }

            .editable-textarea {
                height: 150px;
                padding: 15px;
                border-radius: 12px;
            }

            .editable-textarea[placeholder]:empty::before {
                padding: 15px;
                margin-left: -15px;
                margin-top: -15px;
            }

            .find-replace-container {
                display: grid;
                grid-template-columns: 1fr;
                gap: 10px;
                padding: 15px;
                border-radius: 12px;
                justify-items: center;
            }

            .find-replace-container input[type="text"] {
                width: 100%;
                max-width: 100%;
                min-width: 100%;
                justify-self: stretch;
                border-radius: 20px;
                box-sizing: border-box;
            }

            .find-replace-container button {
                width: auto;
                min-width: 120px;
                padding: 8px 24px;
                border-radius: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>文本格式转换工具</h1>

        <div id="inputText" class="editable-textarea" contenteditable="true" placeholder="在此输入文本..."></div>

        <div class="buttons-container">
            <button id="toUpperCaseButton">转换为大写</button>
            <button id="toLowerCaseButton">转换为小写</button>
            <button id="capitalizeWordsButton">首字母大写</button>
            <button id="removeExtraSpacesButton">删除多余空格</button>
            <input type="file" id="fileInput" accept=".txt" style="display: none;">
            <button id="uploadButton">上传文件</button>
            <button id="copyButton">复制结果</button>
            <button id="clearButton">清空</button>
        </div>

        <div class="find-replace-container">
            <input type="text" id="findInput" placeholder="查找内容">
            <button id="findButton">查找</button>
            <input type="text" id="replaceInput" placeholder="替换为">
            <button id="replaceButton">替换</button>
        </div>

        <div id="outputText" class="editable-textarea" contenteditable="false" placeholder="转换结果将显示在此..."></div>

        <!-- 页脚 -->
        <div class="footer">
            本工具使用AI编程实现，如有定制工具的需求可联系微信 <strong>L94026958</strong>
        </div>
    </div>

    <script>
        const inputTextDiv = document.getElementById('inputText');
        const outputTextDiv = document.getElementById('outputText'); // 重命名以区分
        const toUpperCaseButton = document.getElementById('toUpperCaseButton');
        const toLowerCaseButton = document.getElementById('toLowerCaseButton');
        const capitalizeWordsButton = document.getElementById('capitalizeWordsButton');
        const removeExtraSpacesButton = document.getElementById('removeExtraSpacesButton');
        const copyButton = document.getElementById('copyButton');
        const clearButton = document.getElementById('clearButton');
        const fileInput = document.getElementById('fileInput');
        const uploadButton = document.getElementById('uploadButton');
        const findInput = document.getElementById('findInput');
        const findButton = document.getElementById('findButton');
        const replaceInput = document.getElementById('replaceInput');
        const replaceButton = document.getElementById('replaceButton');

        // --- Helper Functions ---
        function getInputText() {
            // 使用 textContent 获取纯文本，保留换行符
            return inputTextDiv.textContent || "";
        }

        function setInputText(text) {
            inputTextDiv.textContent = text;
            // 触发 input 事件，以便 placeholder 逻辑更新
            inputTextDiv.dispatchEvent(new Event('input', { bubbles: true }));
        }



        function clearHighlights() {
            // 移除所有 highlight span，保留文本内容
            const spans = inputTextDiv.querySelectorAll('span.highlight');
            spans.forEach(span => {
                span.outerHTML = span.innerHTML; // 用内部 HTML 替换整个 span
            });
            // 重新规范化文本节点（合并相邻的文本节点）
            inputTextDiv.normalize();
        }

        // --- Event Listeners ---

        // 转换为大写
        // --- Helper Functions for Output Div ---
        function setOutputText(text) {
            outputTextDiv.textContent = text;
            // Placeholder logic for output div (if needed in future)
            // outputTextDiv.dispatchEvent(new Event('input', { bubbles: true }));
        }

        function setOutputHTML(html) {
            outputTextDiv.innerHTML = html;
             // Placeholder logic for output div (if needed in future)
            // outputTextDiv.dispatchEvent(new Event('input', { bubbles: true }));
        }

        // --- Event Listeners ---

        // 获取源文本的通用函数
        function getSourceText() {
            // 优先使用输出区域的内容，如果输出区域为空则使用输入区域的内容
            let sourceText = outputTextDiv.textContent.trim();
            if (!sourceText) {
                sourceText = getInputText(); // 获取输入区域的纯文本
            }
            return sourceText;
        }

        toUpperCaseButton.addEventListener('click', () => {
            setOutputText(getSourceText().toUpperCase());
        });

        // 转换为小写
        toLowerCaseButton.addEventListener('click', () => {
            setOutputText(getSourceText().toLowerCase());
        });

        // 首字母大写
        capitalizeWordsButton.addEventListener('click', () => {
            const text = getSourceText();
            // 先将整个文本转为小写，然后将每个单词的首字母转为大写
            const capitalizedText = text.toLowerCase().replace(/\b\w/g, function(match) {
                return match.toUpperCase();
            });
            setOutputText(capitalizedText);
        });

        // 删除多余空格
        removeExtraSpacesButton.addEventListener('click', () => {
            const lines = getSourceText().split('\n');
            const processedLines = lines.map(line => {
                // 替换连续空格为一个空格，并去除首尾空格
                return line.replace(/\s+/g, ' ').trim();
            }).filter(line => line !== ''); // 过滤掉处理后的空行
            setOutputText(processedLines.join('\n'));
        });

        // 复制结果
        copyButton.addEventListener('click', () => {
            const textToCopy = outputTextDiv.textContent;
            if (navigator.clipboard && window.isSecureContext) {
                // 现代、安全的方法
                navigator.clipboard.writeText(textToCopy).then(() => {
                    alert('结果已复制到剪贴板！');
                }).catch(err => {
                    console.error('无法复制文本: ', err);
                    alert('复制失败！');
                });
            } else {
                // 备用方法（可能在非 HTTPS 或旧浏览器中需要）
                try {
                    const textArea = document.createElement("textarea");
                    textArea.value = textToCopy;
                    textArea.style.position = "fixed"; // 防止滚动条跳动
                    textArea.style.left = "-9999px";
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    alert('结果已复制到剪贴板！');
                } catch (err) {
                    console.error('备用复制方法失败: ', err);
                    alert('复制失败！');
                }
            }
        });


        // 清空
        clearButton.addEventListener('click', () => {
            setInputText('');
            setOutputText(''); // Use helper
            findInput.value = '';
            replaceInput.value = '';
            clearHighlights(); // 清除输入区高亮
        });

        // 上传文件
        uploadButton.addEventListener('click', () => {
            fileInput.click(); // 触发文件输入元素的点击
        });

        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];

            if (!file) {
                return;
            }

            // 检查文件类型
            if (file.type !== 'text/plain') {
                alert('请上传TXT文本文件！');
                fileInput.value = ''; // 清空文件输入，以便再次选择相同文件
                return;
            }

            // 检查文件大小 (3MB 限制)
            const maxSize = 3 * 1024 * 1024; // 3MB in bytes
            if (file.size > maxSize) {
                alert('文件大小不能超过3MB！');
                fileInput.value = ''; // 清空文件输入
                return;
            }

            const reader = new FileReader();

            reader.onload = (e) => {
                setInputText(e.target.result);
                setOutputText(''); // Use helper to clear output div
                clearHighlights();
                fileInput.value = ''; // 清空文件输入框，允许再次选择同名文件
            };

            reader.onerror = () => {
                alert('读取文件时发生错误。');
                fileInput.value = ''; // 清空文件输入框
            };

            reader.readAsText(file);
        });

        // --- Find and Replace Logic ---

        // 查找按钮点击事件
        findButton.addEventListener('click', () => {
            const searchTerm = findInput.value;
            const originalText = getInputText(); // 获取纯文本进行查找

            clearHighlights(); // 清除之前的高亮

            if (!searchTerm) {
                alert('请输入要查找的内容！');
                return;
            }

            if (!originalText) {
                alert('输入区域为空，无法查找。');
                return;
            }

            // 使用正则表达式进行全局、区分大小写的查找，并转义特殊字符
            const escapedSearchTerm = searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(escapedSearchTerm, 'g'); // g: global, 区分大小写
            let match;
            let count = 0;
            let highlightedHTML = originalText; // 从纯文本开始构建 HTML

            // 为了正确处理替换和重叠，我们需要从后往前替换
            const matches = [];
            while ((match = regex.exec(originalText)) !== null) {
                matches.push({ index: match.index, length: match[0].length, text: match[0] });
                count++;
            }

            // 从后往前遍历匹配项，插入高亮标签
            for (let i = matches.length - 1; i >= 0; i--) {
                const m = matches[i];
                highlightedHTML = highlightedHTML.substring(0, m.index) +
                                  `<span class="highlight">${m.text}</span>` +
                                  highlightedHTML.substring(m.index + m.length);
            }


            if (count > 0) {
                setInputHTML(highlightedHTML); // 更新 div 的 innerHTML 以显示高亮
                alert(`找到了 ${count} 处匹配项。`);
                // 滚动到第一个高亮位置
                const firstHighlight = inputTextDiv.querySelector('span.highlight');
                if (firstHighlight) {
                    firstHighlight.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            } else {
                setInputText(originalText); // 如果没找到，确保显示原始纯文本
                alert('未找到匹配项。');
            }
        });

        // 替换按钮点击事件
        replaceButton.addEventListener('click', () => {
            const searchTerm = findInput.value;
            const replacementText = replaceInput.value;

            // 优先使用输出区域的内容，如果输出区域为空则使用输入区域的内容
            let sourceText = outputTextDiv.textContent.trim();
            if (!sourceText) {
                sourceText = getInputText(); // 获取输入区域的纯文本
            }

            if (!searchTerm) {
                alert('请输入要查找的内容！');
                return;
            }

            if (!sourceText) {
                alert('没有可替换的内容。');
                return;
            }

            // 使用正则表达式进行全局替换（精确匹配，区分大小写）
            const escapedSearchTerm = searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(escapedSearchTerm, 'g'); // g: global
            let count = 0;

            // 计算匹配数量
            sourceText.replace(regex, () => {
                count++;
                return replacementText; // 只是为了计数，实际替换在下面进行
            });

            // 构建带有高亮标记的输出 HTML
            let outputHTML = "";
            let lastIndex = 0;
            let replacedCount = 0;

            sourceText.replace(regex, (match, index) => {
                // 添加匹配之前的部分
                outputHTML += sourceText.substring(lastIndex, index);
                // 添加高亮标记的替换文本
                outputHTML += `<span class="highlight-replaced">${replacementText}</span>`;
                lastIndex = index + match.length;
                replacedCount++;
                return replacementText; // 这个返回值在 replace 中不直接使用，但需要有
            });

            // 添加最后一个匹配之后的部分
            outputHTML += sourceText.substring(lastIndex);

            // 将生成的 HTML 设置到输出 div
            setOutputHTML(outputHTML);

            if (replacedCount > 0) {
                alert(`成功替换了 ${replacedCount} 处。请查看下方结果区域。`);
                 // 滚动到第一个替换高亮位置
                const firstReplaced = outputTextDiv.querySelector('span.highlight-replaced');
                if (firstReplaced) {
                    firstReplaced.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
                // 注意：不再清除输入区的高亮 clearHighlights();
            } else {
                setOutputText(sourceText); // 如果没有替换，显示原始文本
                alert('未找到可替换的匹配项。');
            }
        });

        // 查找输入框内容变化事件，用于清除高亮
        findInput.addEventListener('input', () => {
            if (findInput.value === '') {
                clearHighlights();
            }
        });

        // --- Placeholder Logic for Editable Div ---
        // 初始检查 placeholder
        if (inputTextDiv.textContent === '') {
            inputTextDiv.setAttribute('data-placeholder-shown', 'true');
        } else {
            inputTextDiv.removeAttribute('data-placeholder-shown');
        }

        // 添加一个标志来跟踪是否是程序设置的HTML
        let isProgrammaticUpdate = false;

        // 重写setInputHTML函数，添加标志
        function setInputHTML(html) {
            isProgrammaticUpdate = true;
            inputTextDiv.innerHTML = html;
            inputTextDiv.dispatchEvent(new Event('input', { bubbles: true }));
            isProgrammaticUpdate = false;
        }

        // 监听输入事件以更新 placeholder 显示状态
        inputTextDiv.addEventListener('input', (e) => {
            // 只有在用户主动输入或粘贴时才清除高亮，避免程序设置HTML时误清除
            if (!isProgrammaticUpdate && (e.inputType === 'insertText' || e.inputType === 'insertFromPaste' || e.inputType === 'deleteContentBackward' || e.inputType === 'deleteContentForward')) {
                // 当用户手动输入或粘贴内容时，清除之前的高亮效果
                if (inputTextDiv.querySelector('span.highlight')) {
                    // 延迟清除，确保输入操作完成
                    setTimeout(() => {
                        clearHighlights();
                    }, 10);
                }
            }

            if (inputTextDiv.textContent === '') {
                // 如果清空了内容，确保 placeholder 模拟样式生效
                // 注意：直接设置 data-placeholder-shown 可能效果不佳，依赖 CSS :empty 选择器
            } else {
                 // 如果有内容，移除 data-placeholder-shown
                 // inputTextDiv.removeAttribute('data-placeholder-shown');
            }
            // CSS :empty 伪类会自动处理 placeholder 的显示/隐藏
        });


    </script>
</body>
</html>
