<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素飞机射击</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #222;
            text-align: center;
            font-family: Arial, sans-serif;
            color: white;
        }
        #game {
            width: 400px;
            height: 500px;
            margin: 20px auto;
            position: relative;
            background-color: #000;
            overflow: hidden;
        }
        #player {
            width: 30px;
            height: 30px;
            background-color: #55f;
            position: absolute;
            bottom: 20px;
            left: 185px;
        }
        .target {
            width: 30px;
            height: 30px;
            background-color: #f55;
            position: absolute;
        }
        .bullet {
            width: 4px;
            height: 10px;
            background-color: #ff0;
            position: absolute;
        }
        #score {
            font-size: 24px;
            margin-top: 10px;
        }
        #controls {
            margin-top: 10px;
        }
        button {
            padding: 8px 16px;
            font-size: 16px;
        }
        .footer {
            margin-top: 20px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <h1>像素飞机射击</h1>
    <div id="score">得分: 0</div>
    <div id="game">
        <div id="player"></div>
    </div>
    <div id="controls">
        <button onclick="moveLeft()">← 左移</button>
        <button onclick="shoot()">发射子弹</button>
        <button onclick="moveRight()">右移 →</button>
    </div>
    <p>使用左右移动按钮控制飞机，点击发射子弹击中红色目标</p>
    
    <div class="footer">
        由草根君使用DeepSeek生成，欢迎交流请+WX:caogenjun
    </div>

    <script>
        const game = document.getElementById('game');
        const player = document.getElementById('player');
        let playerX = 185;
        let score = 0;
        let targets = [];
        let bullets = [];
        
        // 创建目标
        function createTargets() {
            for(let row = 0; row < 3; row++) {
                for(let col = 0; col < 8; col++) {
                    const target = document.createElement('div');
                    target.className = 'target';
                    target.style.left = (col * 50 + 10) + 'px';
                    target.style.top = (row * 50 + 20) + 'px';
                    game.appendChild(target);
                    targets.push({
                        element: target,
                        x: col * 50 + 10,
                        y: row * 50 + 20,
                        alive: true
                    });
                }
            }
        }
        
        // 移动飞机
        function moveLeft() {
            playerX = Math.max(0, playerX - 20);
            player.style.left = playerX + 'px';
        }
        
        function moveRight() {
            playerX = Math.min(370, playerX + 20);
            player.style.left = playerX + 'px';
        }
        
        // 发射子弹
        function shoot() {
            const bullet = document.createElement('div');
            bullet.className = 'bullet';
            bullet.style.left = (playerX + 13) + 'px';
            bullet.style.bottom = '50px';
            game.appendChild(bullet);
            
            const bulletObj = {
                element: bullet,
                active: true
            };
            bullets.push(bulletObj);
            
            // 子弹移动
            const bulletInterval = setInterval(() => {
                if(!bulletObj.active) {
                    clearInterval(bulletInterval);
                    return;
                }
                
                const currentBottom = parseInt(bullet.style.bottom);
                bullet.style.bottom = (currentBottom + 10) + 'px';
                
                // 检查碰撞
                checkCollision(bulletObj, currentBottom + 10);
                
                // 超出屏幕移除子弹
                if(currentBottom > 500) {
                    clearInterval(bulletInterval);
                    bullet.remove();
                    bullets = bullets.filter(b => b !== bulletObj);
                }
            }, 50);
        }
        
        // 检查碰撞
        function checkCollision(bulletObj, bulletY) {
            const bullet = bulletObj.element;
            const bulletX = parseInt(bullet.style.left);
            
            for(let i = 0; i < targets.length; i++) {
                const target = targets[i];
                if(target.alive && 
                   bulletX > target.x && bulletX < target.x + 30 &&
                   500 - bulletY > target.y && 500 - bulletY < target.y + 30) {
                    // 击中目标
                    target.element.style.display = 'none';
                    target.alive = false;
                    bullet.remove();
                    bulletObj.active = false;
                    score++;
                    document.getElementById('score').textContent = '得分: ' + score;
                    
                    // 检查游戏是否胜利
                    if(targets.every(t => !t.alive)) {
                        setTimeout(() => {
                            alert('恭喜你赢了！得分: ' + score);
                            resetGame();
                        }, 100);
                    }
                    
                    // 每颗子弹只能消灭一个目标
                    break;
                }
            }
        }
        
        // 重置游戏
        function resetGame() {
            // 清除所有子弹
            bullets.forEach(bullet => {
                bullet.element.remove();
            });
            bullets = [];
            
            // 清除所有目标
            targets.forEach(target => {
                target.element.remove();
            });
            targets = [];
            
            // 重置分数
            score = 0;
            document.getElementById('score').textContent = '得分: 0';
            
            // 创建新目标
            createTargets();
        }
        
        // 初始化游戏
        createTargets();
        
        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowLeft') moveLeft();
            if(e.key === 'ArrowRight') moveRight();
            if(e.key === ' ') shoot();
        });
    </script>
</body>
</html>
