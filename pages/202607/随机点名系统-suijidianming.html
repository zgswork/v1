<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机点名系统</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #34C759;
            --dark-green: #248A3D;
            --light-green: #D9F3E3;
            --text-color: #1D1D1F;
            --white: #FFFFFF;
            --error-color: #FF3B30;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, var(--primary-color), var(--dark-green));
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--white);
            border-radius: 18px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin: 20px 0;
        }
        
        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
            color: var(--primary-color);
        }
        
        .input-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .input-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .range-inputs {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .range-inputs span {
            font-weight: 500;
        }
        
        label {
            font-size: 1rem;
            font-weight: 500;
        }
        
        input, .file-upload {
            padding: 12px 15px;
            border: 1px solid #D2D2D7;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s;
            width: 100%;
        }
        
        input:focus, .file-upload:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(52, 199, 89, 0.2);
        }
        
        .file-upload {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            background-color: #f8f8f8;
        }
        
        .file-upload input[type="file"] {
            display: none;
        }
        
        .file-upload .icon {
            font-size: 2rem;
            margin-bottom: 8px;
            color: var(--primary-color);
        }
        
        .file-upload .hint {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }
        
        .file-info {
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--dark-green);
            font-weight: 500;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }
        
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            flex-grow: 1;
            max-width: 200px;
        }
        
        button:hover {
            background-color: var(--dark-green);
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button.secondary {
            background-color: #f8f8f8;
            color: var(--text-color);
            border: 1px solid #D2D2D7;
        }
        
        button.secondary:hover {
            background-color: #e8e8e8;
        }
        
        .result-section {
            margin-top: 30px;
            text-align: center;
        }
        
        .result-box {
            background-color: var(--light-green);
            border-radius: 12px;
            padding: 20px;
            margin-top: 15px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .result-content {
            color: var(--text-color);
            font-weight: bold;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
        }
        
        .student-name {
            white-space: nowrap;
        }
        
        .separator:not(:last-child)::after {
            content: "、";
        }
        
        .error {
            color: var(--error-color);
            font-weight: normal;
        }
        
        .mode-switch {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            background-color: #f8f8f8;
            border-radius: 12px;
            padding: 5px;
        }
        
        .mode-btn {
            padding: 8px 16px;
            border-radius: 8px;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 500;
            color: #666;
            flex: 1;
            max-width: 200px;
        }
        
        .mode-btn.active {
            background-color: var(--primary-color);
            color: white;
        }
        
        .footer {
            margin-top: auto;
            text-align: center;
            color: var(--white);
            font-size: 0.9rem;
            padding: 20px;
            opacity: 0.8;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .button-group {
                flex-direction: column;
                align-items: center;
            }
            
            button {
                width: 100%;
                max-width: none;
            }
            
            .range-inputs {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            
            .result-content {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>随机点名系统</h1>
        
        <div class="mode-switch">
            <button id="numberModeBtn" class="mode-btn active">学号模式</button>
            <button id="nameModeBtn" class="mode-btn">姓名模式</button>
        </div>
        
        <div id="numberMode" class="input-section">
            <div class="input-row">
                <label>学号范围设置</label>
                <div class="range-inputs">
                    <input type="number" id="startId" min="1" value="1" placeholder="起始学号">
                    <span>至</span>
                    <input type="number" id="endId" min="1" value="50" placeholder="结束学号">
                </div>
            </div>
            
            <div class="input-row">
                <label for="count">抽取人数</label>
                <input type="number" id="count" min="1" value="1" placeholder="输入要抽取的人数">
            </div>
        </div>
        
        <div id="nameMode" class="input-section" style="display: none;">
            <div class="input-row">
                <label>上传学生名单</label>
                <label class="file-upload">
                    <input type="file" id="excelFile" accept=".xlsx,.xls">
                    <div class="icon">📄</div>
                    <div>点击上传Excel文件</div>
                    <div class="hint">支持.xlsx和.xls格式，需包含姓名列</div>
                </label>
                <div id="fileInfo" class="file-info"></div>
            </div>
            
            <div class="input-row">
                <label for="nameCount">抽取人数</label>
                <input type="number" id="nameCount" min="1" value="1" placeholder="输入要抽取的人数">
            </div>
        </div>
        
        <div class="button-group">
            <button id="randomBtn">随机抽取</button>
            <button id="resetBtn" class="secondary">重置</button>
        </div>
        
        <div class="result-section">
            <h2>抽取结果</h2>
            <div class="result-box" id="resultBox">
                <div class="result-content" id="resultContent">
                    点击"随机抽取"按钮开始
                </div>
            </div>
        </div>
    </div>
    
    <div class="footer">
        由 兔子先生 用 DeepSeek 1分钟生成，你也可以去尝试制作
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 模式切换
            const numberModeBtn = document.getElementById('numberModeBtn');
            const nameModeBtn = document.getElementById('nameModeBtn');
            const numberMode = document.getElementById('numberMode');
            const nameMode = document.getElementById('nameMode');
            
            // 学号模式元素
            const startIdInput = document.getElementById('startId');
            const endIdInput = document.getElementById('endId');
            const countInput = document.getElementById('count');
            
            // 姓名模式元素
            const excelFileInput = document.getElementById('excelFile');
            const nameCountInput = document.getElementById('nameCount');
            const fileInfo = document.getElementById('fileInfo');
            
            // 共用元素
            const randomBtn = document.getElementById('randomBtn');
            const resetBtn = document.getElementById('resetBtn');
            const resultContent = document.getElementById('resultContent');
            
            let currentMode = 'number';
            let nameList = [];
            
            // 模式切换
            numberModeBtn.addEventListener('click', function() {
                currentMode = 'number';
                numberMode.style.display = 'flex';
                nameMode.style.display = 'none';
                numberModeBtn.classList.add('active');
                nameModeBtn.classList.remove('active');
                resultContent.textContent = '点击"随机抽取"按钮开始';
            });
            
            nameModeBtn.addEventListener('click', function() {
                currentMode = 'name';
                numberMode.style.display = 'none';
                nameMode.style.display = 'flex';
                numberModeBtn.classList.remove('active');
                nameModeBtn.classList.add('active');
                resultContent.textContent = '点击"随机抽取"按钮开始';
            });
            
            // 处理Excel文件上传
            excelFileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                fileInfo.textContent = `已选择文件: ${file.name}`;
                nameList = [];
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        
                        // 获取第一个工作表
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        
                        // 将工作表转换为JSON
                        const jsonData = XLSX.utils.sheet_to_json(firstSheet);
                        
                        // 查找包含"姓名"的列
                        let nameKey = null;
                        for (let key in jsonData[0] || {}) {
                            if (key.includes('姓名') || key.includes('name') || key.includes('Name')) {
                                nameKey = key;
                                break;
                            }
                        }
                        
                        if (!nameKey) {
                            fileInfo.innerHTML = `<span class="error">未找到包含"姓名"的列</span>`;
                            return;
                        }
                        
                        // 提取姓名列表
                        nameList = jsonData.map(row => row[nameKey]).filter(name => name);
                        
                        if (nameList.length === 0) {
                            fileInfo.innerHTML = `<span class="error">文件中没有有效的姓名数据</span>`;
                            return;
                        }
                        
                        fileInfo.textContent = `已加载 ${nameList.length} 个姓名`;
                    } catch (error) {
                        console.error(error);
                        fileInfo.innerHTML = `<span class="error">文件解析失败: ${error.message}</span>`;
                    }
                };
                
                reader.readAsArrayBuffer(file);
            });
            
            // 随机抽取函数
            randomBtn.addEventListener('click', function() {
                if (currentMode === 'number') {
                    // 学号模式
                    const studentIds = generateStudentIds();
                    const count = parseInt(countInput.value) || 1;
                    
                    if (count > studentIds.length) {
                        resultContent.innerHTML = `<span class="error">抽取人数不能超过总人数 (${studentIds.length})</span>`;
                        return;
                    }
                    
                    // 随机抽取
                    const shuffled = [...studentIds].sort(() => 0.5 - Math.random());
                    const selected = shuffled.slice(0, count);
                    
                    // 显示结果
                    resultContent.innerHTML = selected.map(id => 
                        `<span class="student-name separator">${id}</span>`
                    ).join('');
                } else {
                    // 姓名模式
                    const count = parseInt(nameCountInput.value) || 1;
                    
                    if (nameList.length === 0) {
                        resultContent.innerHTML = `<span class="error">请先上传包含姓名列的Excel文件</span>`;
                        return;
                    }
                    
                    if (count > nameList.length) {
                        resultContent.innerHTML = `<span class="error">抽取人数不能超过总人数 (${nameList.length})</span>`;
                        return;
                    }
                    
                    // 随机抽取
                    const shuffled = [...nameList].sort(() => 0.5 - Math.random());
                    const selected = shuffled.slice(0, count);
                    
                    // 显示结果
                    resultContent.innerHTML = selected.map(name => 
                        `<span class="student-name separator">${name}</span>`
                    ).join('');
                }
            });
            
            // 生成学号数组
            function generateStudentIds() {
                const start = parseInt(startIdInput.value) || 1;
                const end = parseInt(endIdInput.value) || 50;
                
                // 确保结束值不小于起始值
                const adjustedEnd = Math.max(start, end);
                if (end !== adjustedEnd) {
                    endIdInput.value = adjustedEnd;
                }
                
                const length = adjustedEnd - start + 1;
                return Array.from({length}, (_, i) => (start + i).toString());
            }
            
            // 重置函数
            resetBtn.addEventListener('click', function() {
                if (currentMode === 'number') {
                    startIdInput.value = '1';
                    endIdInput.value = '50';
                    countInput.value = '1';
                } else {
                    excelFileInput.value = '';
                    nameCountInput.value = '1';
                    fileInfo.textContent = '';
                    nameList = [];
                }
                resultContent.textContent = '点击"随机抽取"按钮开始';
            });
        });
    </script>
</body>
</html>
