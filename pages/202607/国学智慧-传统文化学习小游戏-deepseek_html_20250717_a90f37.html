<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国学智慧 - 传统文化学习小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background-color: #8e44ad;
            color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .game-menu {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .game-card {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .game-card h2 {
            color: #8e44ad;
            margin-bottom: 10px;
        }
        
        .game-card p {
            color: #666;
            margin-bottom: 15px;
        }
        
        .game-card .icon {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #9b59b6;
        }
        
        .game-area {
            background-color: white;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            display: none;
        }
        
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .game-title {
            color: #8e44ad;
            font-size: 1.5rem;
        }
        
        .game-stats {
            display: flex;
            gap: 15px;
        }
        
        .stat {
            background-color: #f0e6f6;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        
        .game-content {
            margin-bottom: 20px;
        }
        
        .question {
            font-size: 1.2rem;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .option {
            padding: 12px;
            background-color: #f0e6f6;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-size: 1rem;
        }
        
        .option:hover {
            background-color: #d2b4de;
        }
        
        .input-answer {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            margin-bottom: 15px;
        }
        
        .btn {
            padding: 12px 20px;
            background-color: #8e44ad;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-size: 1rem;
        }
        
        .btn:hover {
            background-color: #732d91;
        }
        
        .btn-secondary {
            background-color: #95a5a6;
        }
        
        .btn-secondary:hover {
            background-color: #7f8c8d;
        }
        
        .feedback {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
        
        .correct {
            background-color: #d5f5e3;
            color: #27ae60;
        }
        
        .incorrect {
            background-color: #fadbd8;
            color: #e74c3c;
        }
        
        .explanation {
            margin-top: 10px;
            font-size: 0.9rem;
        }
        
        .result {
            text-align: center;
            font-size: 1.2rem;
            margin-bottom: 20px;
            display: none;
        }
        
        .progress-container {
            width: 100%;
            background-color: #f0e6f6;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        .progress-bar {
            height: 10px;
            background-color: #8e44ad;
            border-radius: 5px;
            width: 0%;
            transition: width 0.3s;
        }
        
        .back-to-menu {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #8e44ad;
            cursor: pointer;
        }
        
        .back-to-menu:hover {
            text-decoration: underline;
        }
        
        .hidden {
            display: none;
        }
        
        @media (max-width: 768px) {
            .game-menu {
                grid-template-columns: 1fr;
            }
            
            .options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>国学智慧</h1>
            <p class="subtitle">传统文化学习小游戏</p>
        </header>
        
        <div id="main-menu">
            <div class="game-menu">
                <div class="game-card" onclick="startGame('idiom-chain')">
                    <div class="icon">🐉</div>
                    <h2>成语接龙</h2>
                    <p>以上一个成语的最后一个字开头，接出新的成语</p>
                    <button class="btn">开始游戏</button>
                </div>
                
                <div class="game-card" onclick="startGame('idiom-fill')">
                    <div class="icon">✍️</div>
                    <h2>成语填空</h2>
                    <p>根据解释或情境，填写正确的成语</p>
                    <button class="btn">开始游戏</button>
                </div>
                
                <div class="game-card" onclick="startGame('xiehouyu')">
                    <div class="icon">😄</div>
                    <h2>歇后语配对</h2>
                    <p>根据前半句，选择正确的后半句</p>
                    <button class="btn">开始游戏</button>
                </div>
                
                <div class="game-card" onclick="startGame('quote-author')">
                    <div class="icon">📜</div>
                    <h2>名言猜作者</h2>
                    <p>根据名言名句，猜测其作者</p>
                    <button class="btn">开始游戏</button>
                </div>
            </div>
        </div>
        
        <!-- 成语接龙游戏 -->
        <div id="idiom-chain" class="game-area">
            <div class="game-header">
                <h2 class="game-title">成语接龙</h2>
                <div class="game-stats">
                    <div class="stat" id="chain-score">得分: 0</div>
                    <div class="stat" id="chain-streak">连胜: 0</div>
                </div>
            </div>
            
            <div class="progress-container">
                <div class="progress-bar" id="chain-progress"></div>
            </div>
            
            <div class="game-content">
                <div class="question" id="chain-question"></div>
                <input type="text" class="input-answer" id="chain-answer" placeholder="输入接龙的成语...">
                <button class="btn" onclick="checkChainAnswer()">提交</button>
                <button class="btn btn-secondary" onclick="skipChainQuestion()">跳过</button>
                
                <div class="feedback hidden" id="chain-feedback">
                    <div class="explanation" id="chain-explanation"></div>
                </div>
            </div>
            
            <div class="result hidden" id="chain-result"></div>
            
            <a class="back-to-menu" onclick="backToMenu('idiom-chain')">返回主菜单</a>
        </div>
        
        <!-- 成语填空游戏 -->
        <div id="idiom-fill" class="game-area">
            <div class="game-header">
                <h2 class="game-title">成语填空</h2>
                <div class="game-stats">
                    <div class="stat" id="fill-score">得分: 0</div>
                    <div class="stat" id="fill-streak">连胜: 0</div>
                </div>
            </div>
            
            <div class="progress-container">
                <div class="progress-bar" id="fill-progress"></div>
            </div>
            
            <div class="game-content">
                <div class="question" id="fill-question"></div>
                <input type="text" class="input-answer" id="fill-answer" placeholder="输入成语...">
                <button class="btn" onclick="checkFillAnswer()">提交</button>
                <button class="btn btn-secondary" onclick="skipFillQuestion()">跳过</button>
                
                <div class="feedback hidden" id="fill-feedback">
                    <div class="explanation" id="fill-explanation"></div>
                </div>
            </div>
            
            <div class="result hidden" id="fill-result"></div>
            
            <a class="back-to-menu" onclick="backToMenu('idiom-fill')">返回主菜单</a>
        </div>
        
        <!-- 歇后语配对游戏 -->
        <div id="xiehouyu" class="game-area">
            <div class="game-header">
                <h2 class="game-title">歇后语配对</h2>
                <div class="game-stats">
                    <div class="stat" id="xiehouyu-score">得分: 0</div>
                    <div class="stat" id="xiehouyu-streak">连胜: 0</div>
                </div>
            </div>
            
            <div class="progress-container">
                <div class="progress-bar" id="xiehouyu-progress"></div>
            </div>
            
            <div class="game-content">
                <div class="question" id="xiehouyu-question"></div>
                <div class="options" id="xiehouyu-options"></div>
                
                <div class="feedback hidden" id="xiehouyu-feedback">
                    <div class="explanation" id="xiehouyu-explanation"></div>
                </div>
            </div>
            
            <div class="result hidden" id="xiehouyu-result"></div>
            
            <a class="back-to-menu" onclick="backToMenu('xiehouyu')">返回主菜单</a>
        </div>
        
        <!-- 名言猜作者游戏 -->
        <div id="quote-author" class="game-area">
            <div class="game-header">
                <h2 class="game-title">名言猜作者</h2>
                <div class="game-stats">
                    <div class="stat" id="quote-score">得分: 0</div>
                    <div class="stat" id="quote-streak">连胜: 0</div>
                </div>
            </div>
            
            <div class="progress-container">
                <div class="progress-bar" id="quote-progress"></div>
            </div>
            
            <div class="game-content">
                <div class="question" id="quote-question"></div>
                <div class="options" id="quote-options"></div>
                
                <div class="feedback hidden" id="quote-feedback">
                    <div class="explanation" id="quote-explanation"></div>
                </div>
            </div>
            
            <div class="result hidden" id="quote-result"></div>
            
            <a class="back-to-menu" onclick="backToMenu('quote-author')">返回主菜单</a>
        </div>
    </div>

                { quote: "知之者不如好之者，好之者不如乐之者。", author: "孔子", source: "《论语》", explanation: "懂得它的人，不如爱好它的人；爱好它的人，又不如以它为乐的人。" },
                { quote: "工欲善其事，必先利其器。", author: "孔子", source: "《论语》", explanation: "工匠想要使他的工作做好，一定要先让工具锋利。" },
                { quote: "君子坦荡荡，小人长戚戚。", author: "孔子", source: "《论语》", explanation: "君子心胸开阔，能够包容别人；小人爱斤斤计较，患得患失。" },
                { quote: "不患人之不己知，患不知人也。", author: "孔子", source: "《论语》", explanation: "不怕别人不了解自己，只怕自己不了解别人。" },
                { quote: "老吾老以及人之老，幼吾幼以及人之幼。", author: "孟子", source: "《孟子》", explanation: "尊敬自己的长辈，从而推广到尊敬别人的长辈；爱护自己的儿女，从而推广到爱护别人的儿女。" },
                { quote: "天时不如地利，地利不如人和。", author: "孟子", source: "《孟子》", explanation: "有利的时机和气候不如有利的地势，有利的地势不如人心所向、上下团结。" },
                { quote: "得道者多助，失道者寡助。", author: "孟子", source: "《孟子》", explanation: "站在正义方面，会得到多数人的支持帮助；违背道义，必陷于孤立。" },
                { quote: "富贵不能淫，贫贱不能移，威武不能屈。", author: "孟子", source: "《孟子》", explanation: "富贵不能使他的思想迷惑，贫贱不能使他的操守动摇，威武不能使他的意志屈服。" },
                { quote: "生于忧患，死于安乐。", author: "孟子", source: "《孟子》", explanation: "忧患使人生存发展，安逸享乐使人萎靡死亡。" },
                { quote: "民为贵，社稷次之，君为轻。", author: "孟子", source: "《孟子》", explanation: "人民放在第一位，国家其次，君在最后。" },
                { quote: "穷则独善其身，达则兼济天下。", author: "孟子", source: "《孟子》", explanation: "不得志时就洁身自好修养个人品德，得志时就使天下人都能这样。" },
                { quote: "尽信书，则不如无书。", author: "孟子", source: "《孟子》", explanation: "完全相信《尚书》，那还不如没有《尚书》。" },
                { quote: "不以规矩，不能成方圆。", author: "孟子", source: "《孟子》", explanation: "不用圆规和曲尺，就不能准确地画出方形和圆形。" },
                { quote: "天行健，君子以自强不息。", author: "《周易》", source: "《周易》", explanation: "天（即自然）的运动刚强劲健，君子应刚毅坚卓，发愤图强。" },
                { quote: "路漫漫其修远兮，吾将上下而求索。", author: "屈原", source: "《离骚》", explanation: "前面的道路啊又远又长，我将上上下下追求理想。" },
                { quote: "不积跬步，无以至千里；不积小流，无以成江海。", author: "荀子", source: "《劝学》", explanation: "不积累一步半步的行程，就没有办法达到千里之远；不积累细小的流水，就没有办法汇成江河大海。" },
                { quote: "青，取之于蓝，而青于蓝。", author: "荀子", source: "《劝学》", explanation: "靛青是从蓼蓝中提取的，但它比蓼蓝的颜色更青。" },
                { quote: "锲而舍之，朽木不折；锲而不舍，金石可镂。", author: "荀子", source: "《劝学》", explanation: "用刀刻东西如果半途放弃，腐烂的木头也不能刻断；如果不停地刻下去，金属和石头也能雕刻成功。" },
                { quote: "知己知彼，百战不殆。", author: "孙子", source: "《孙子兵法》", explanation: "了解自己也了解敌人，经历多少次战斗都不会有危险。" },
                { quote: "天下兴亡，匹夫有责。", author: "顾炎武", source: "《日知录》", explanation: "国家的兴盛或衰亡，每个普通人都有一份责任。" },
                { quote: "先天下之忧而忧，后天下之乐而乐。", author: "范仲淹", source: "《岳阳楼记》", explanation: "在天下人忧愁之前先忧愁，在天下人快乐之后才快乐。" },
                { quote: "人生自古谁无死，留取丹心照汗青。", author: "文天祥", source: "《过零丁洋》", explanation: "自古以来，人终不免一死！但死得要有意义，倘若能为国尽忠，死后仍可光照千秋，青史留名。" },
                { quote: "海内存知己，天涯若比邻。", author: "王勃", source: "《送杜少府之任蜀州》", explanation: "四海之内有知心朋友，即使远在天边也好像近在眼前。" },
                { quote: "欲穷千里目，更上一层楼。", author: "王之涣", source: "《登鹳雀楼》", explanation: "若想把千里的风光景物看够，那就要登上更高的一层城楼。" }
            ]
        };
        
        // 游戏状态
        const gameState = {
            currentGame: null,
            currentQuestion: 0,
            totalQuestions: 10,
            score: 0,
            streak: 0,
            
            // 成语接龙状态
            lastIdiom: "",
            
            // 成语填空状态
            fillQuestions: [],
            
            // 歇后语状态
            xiehouyuQuestions: [],
            
            // 名言状态
            quoteQuestions: []
        };
        
        // 初始化游戏
        function initGame() {
            document.getElementById('main-menu').style.display = 'block';
            document.getElementById('idiom-chain').style.display = 'none';
            document.getElementById('idiom-fill').style.display = 'none';
            document.getElementById('xiehouyu').style.display = 'none';
            document.getElementById('quote-author').style.display = 'none';
            
            gameState.currentGame = null;
            gameState.currentQuestion = 0;
            gameState.score = 0;
            gameState.streak = 0;
        }
        
        // 开始游戏
        function startGame(gameType) {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById(gameType).style.display = 'block';
            
            gameState.currentGame = gameType;
            gameState.currentQuestion = 0;
            gameState.score = 0;
            gameState.streak = 0;
            
            // 重置进度条
            updateProgressBar(gameType, 0);
            
            // 根据游戏类型初始化
            switch(gameType) {
                case 'idiom-chain':
                    initIdiomChain();
                    break;
                case 'idiom-fill':
                    initIdiomFill();
                    break;
                case 'xiehouyu':
                    initXiehouyu();
                    break;
                case 'quote-author':
                    initQuoteAuthor();
                    break;
            }
            
            // 显示第一个问题
            showNextQuestion(gameType);
        }
        
        // 返回主菜单
        function backToMenu(gameType) {
            document.getElementById(gameType).style.display = 'none';
            initGame();
        }
        
        // 更新进度条
        function updateProgressBar(gameType, progress) {
            const progressBar = document.getElementById(`${gameType}-progress`);
            progressBar.style.width = `${progress}%`;
        }
        
        // 更新分数显示
        function updateScoreDisplay(gameType) {
            document.getElementById(`${gameType}-score`).textContent = `得分: ${gameState.score}`;
            document.getElementById(`${gameType}-streak`).textContent = `连胜: ${gameState.streak}`;
        }
        
        // 显示反馈
        function showFeedback(gameType, isCorrect, explanation) {
            const feedback = document.getElementById(`${gameType}-feedback`);
            feedback.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
            feedback.innerHTML = isCorrect ? '✅ 回答正确！' : '❌ 回答错误！';
            
            if (explanation) {
                feedback.innerHTML += `<div class="explanation">${explanation}</div>`;
            }
            
            feedback.style.display = 'block';
        }
        
        // 隐藏反馈
        function hideFeedback(gameType) {
            document.getElementById(`${gameType}-feedback`).style.display = 'none';
        }
        
        // 显示结果
        function showResult(gameType) {
            const result = document.getElementById(`${gameType}-result`);
            result.textContent = `游戏结束！你的最终得分是 ${gameState.score}/${gameState.totalQuestions}`;
            result.style.display = 'block';
        }
        
        // 成语接龙初始化
        function initIdiomChain() {
            // 随机选择一个起始成语
            const randomIndex = Math.floor(Math.random() * gameData.idioms.length);
            gameState.lastIdiom = gameData.idioms[randomIndex].word;
            updateScoreDisplay('idiom-chain');
        }
        
        // 显示成语接龙问题
        function showIdiomChainQuestion() {
            document.getElementById('chain-question').textContent = `请接龙成语：${gameState.lastIdiom}`;
            document.getElementById('chain-answer').value = '';
            document.getElementById('chain-answer').focus();
            hideFeedback('chain');
        }
        
        // 检查成语接龙答案
        function checkChainAnswer() {
            const userAnswer = document.getElementById('chain-answer').value.trim();
            
            if (!userAnswer) {
                alert('请输入一个成语！');
                return;
            }
            
            // 检查是否是成语
            const isIdiom = gameData.idioms.some(idiom => idiom.word === userAnswer);
            
            if (!isIdiom) {
                showFeedback('chain', false, `${userAnswer}不是一个有效的成语。`);
                gameState.streak = 0;
                updateScoreDisplay('chain');
                return;
            }
            
            // 检查是否接龙正确
            const lastChar = gameState.lastIdiom.slice(-1);
            const firstChar = userAnswer[0];
            
            if (lastChar === firstChar) {
                // 正确
                gameState.score++;
                gameState.streak++;
                
                const idiomObj = gameData.idioms.find(idiom => idiom.word === userAnswer);
                showFeedback('chain', true, `解释：${idiomObj.explanation}<br>例句：${idiomObj.example}`);
                
                // 更新最后一个成语
                gameState.lastIdiom = userAnswer;
            } else {
                // 错误
                showFeedback('chain', false, `应该以"${lastChar}"开头，你输入的是"${firstChar}"开头。`);
                gameState.streak = 0;
            }
            
            updateScoreDisplay('chain');
            
            // 继续下一题或结束游戏
            gameState.currentQuestion++;
            if (gameState.currentQuestion < gameState.totalQuestions) {
                setTimeout(() => {
                    showNextQuestion('idiom-chain');
                }, 2000);
            } else {
                showResult('idiom-chain');
            }
        }
        
        // 跳过成语接龙问题
        function skipChainQuestion() {
            gameState.streak = 0;
            updateScoreDisplay('chain');
            
            // 继续下一题或结束游戏
            gameState.currentQuestion++;
            if (gameState.currentQuestion < gameState.totalQuestions) {
                showNextQuestion('idiom-chain');
            } else {
                showResult('idiom-chain');
            }
        }
        
        // 成语填空初始化
        function initIdiomFill() {
            // 随机选择10个成语作为问题
            const shuffled = [...gameData.idioms].sort(() => 0.5 - Math.random());
            gameState.fillQuestions = shuffled.slice(0, gameState.totalQuestions);
            updateScoreDisplay('fill');
        }
        
        // 显示成语填空问题
        function showIdiomFillQuestion() {
            const currentQ = gameState.fillQuestions[gameState.currentQuestion];
            document.getElementById('fill-question').textContent = `解释：${currentQ.explanation}`;
            document.getElementById('fill-answer').value = '';
            document.getElementById('fill-answer').focus();
            hideFeedback('fill');
        }
        
        // 检查成语填空答案
        function checkFillAnswer() {
            const userAnswer = document.getElementById('fill-answer').value.trim();
            const currentQ = gameState.fillQuestions[gameState.currentQuestion];
            
            if (!userAnswer) {
                alert('请输入一个成语！');
                return;
            }
            
            if (userAnswer === currentQ.word) {
                // 正确
                gameState.score++;
                gameState.streak++;
                showFeedback('fill', true, `拼音：${currentQ.pinyin}<br>例句：${currentQ.example}`);
            } else {
                // 错误
                showFeedback('fill', false, `正确答案是：${currentQ.word}<br>解释：${currentQ.explanation}`);
                gameState.streak = 0;
            }
            
            updateScoreDisplay('fill');
            
            // 继续下一题或结束游戏
            gameState.currentQuestion++;
            if (gameState.currentQuestion < gameState.totalQuestions) {
                setTimeout(() => {
                    showNextQuestion('idiom-fill');
                }, 2000);
            } else {
                showResult('idiom-fill');
            }
        }
        
        // 跳过成语填空问题
        function skipFillQuestion() {
            gameState.streak = 0;
            updateScoreDisplay('fill');
            
            // 继续下一题或结束游戏
            gameState.currentQuestion++;
            if (gameState.currentQuestion < gameState.totalQuestions) {
                showNextQuestion('idiom-fill');
            } else {
                showResult('idiom-fill');
            }
        }
        
        // 歇后语初始化
        function initXiehouyu() {
            // 随机选择10个歇后语作为问题
            const shuffled = [...gameData.xiehouyu].sort(() => 0.5 - Math.random());
            gameState.xiehouyuQuestions = shuffled.slice(0, gameState.totalQuestions);
            updateScoreDisplay('xiehouyu');
        }
        
        // 显示歇后语问题
        function showXiehouyuQuestion() {
            const currentQ = gameState.xiehouyuQuestions[gameState.currentQuestion];
            document.getElementById('xiehouyu-question').textContent = `歇后语：${currentQ.first} —— ?`;
            
            // 生成选项（包括正确答案和3个随机错误答案）
            const options = [currentQ.second];
            while (options.length < 4) {
                const randomIndex = Math.floor(Math.random() * gameData.xiehouyu.length);
                const wrongAnswer = gameData.xiehouyu[randomIndex].second;
                if (!options.includes(wrongAnswer)) {
                    options.push(wrongAnswer);
                }
            }
            
            // 打乱选项顺序
            options.sort(() => 0.5 - Math.random());
            
            // 显示选项
            const optionsContainer = document.getElementById('xiehouyu-options');
            optionsContainer.innerHTML = '';
            
            options.forEach(option => {
                const button = document.createElement('button');
                button.className = 'option';
                button.textContent = option;
                button.onclick = () => checkXiehouyuAnswer(option, currentQ.second);
                optionsContainer.appendChild(button);
            });
            
            hideFeedback('xiehouyu');
        }
        
        // 检查歇后语答案
        function checkXiehouyuAnswer(selectedAnswer, correctAnswer) {
            const currentQ = gameState.xiehouyuQuestions[gameState.currentQuestion];
            
            if (selectedAnswer === correctAnswer) {
                // 正确
                gameState.score++;
                gameState.streak++;
                showFeedback('xiehouyu', true, `解释：${currentQ.explanation}`);
            } else {
                // 错误
                showFeedback('xiehouyu', false, `正确答案是：${correctAnswer}<br>解释：${currentQ.explanation}`);
                gameState.streak = 0;
            }
            
            updateScoreDisplay('xiehouyu');
            
            // 继续下一题或结束游戏
            gameState.currentQuestion++;
            if (gameState.currentQuestion < gameState.totalQuestions) {
                setTimeout(() => {
                    showNextQuestion('xiehouyu');
                }, 2000);
            } else {
                showResult('xiehouyu');
            }
        }
        
        // 名言猜作者初始化
        function initQuoteAuthor() {
            // 随机选择10个名言作为问题
            const shuffled = [...gameData.quotes].sort(() => 0.5 - Math.random());
            gameState.quoteQuestions = shuffled.slice(0, gameState.totalQuestions);
            updateScoreDisplay('quote');
        }
        
        // 显示名言猜作者问题
        function showQuoteAuthorQuestion() {
            const currentQ = gameState.quoteQuestions[gameState.currentQuestion];
            document.getElementById('quote-question').textContent = `名言："${currentQ.quote}"`;
            
            // 生成选项（包括正确答案和3个随机错误作者）
            const authors = [currentQ.author];
            while (authors.length < 4) {
                const randomIndex = Math.floor(Math.random() * gameData.quotes.length);
                const wrongAuthor = gameData.quotes[randomIndex].author;
                if (!authors.includes(wrongAuthor)) {
                    authors.push(wrongAuthor);
                }
            }
            
            // 打乱选项顺序
            authors.sort(() => 0.5 - Math.random());
            
            // 显示选项
            const optionsContainer = document.getElementById('quote-options');
            optionsContainer.innerHTML = '';
            
            authors.forEach(author => {
                const button = document.createElement('button');
                button.className = 'option';
                button.textContent = author;
                button.onclick = () => checkQuoteAnswer(author, currentQ.author, currentQ);
                optionsContainer.appendChild(button);
            });
            
            hideFeedback('quote');
        }
        
        // 检查名言答案
        function checkQuoteAnswer(selectedAuthor, correctAuthor, currentQ) {
            if (selectedAuthor === correctAuthor) {
                // 正确
                gameState.score++;
                gameState.streak++;
                showFeedback('quote', true, `出处：${currentQ.source}<br>解释：${currentQ.explanation}`);
            } else {
                // 错误
                showFeedback('quote', false, `正确答案是：${correctAuthor}<br>出处：${currentQ.source}<br>解释：${currentQ.explanation}`);
                gameState.streak = 0;
            }
            
            updateScoreDisplay('quote');
            
            // 继续下一题或结束游戏
            gameState.currentQuestion++;
            if (gameState.currentQuestion < gameState.totalQuestions) {
                setTimeout(() => {
                    showNextQuestion('quote-author');
                }, 2000);
            } else {
                showResult('quote-author');
            }
        }
        
        // 显示下一个问题
        function showNextQuestion(gameType) {
            // 更新进度条
            const progress = (gameState.currentQuestion / gameState.totalQuestions) * 100;
            updateProgressBar(gameType, progress);
            
            switch(gameType) {
                case 'idiom-chain':
                    showIdiomChainQuestion();
                    break;
                case 'idiom-fill':
                    showIdiomFillQuestion();
                    break;
                case 'xiehouyu':
                    showXiehouyuQuestion();
                    break;
                case 'quote-author':
                    showQuoteAuthorQuestion();
                    break;
            }
        }
        
        // 初始化游戏
        window.onload = initGame;
        
        // 为输入框添加回车键支持
        document.getElementById('chain-answer').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkChainAnswer();
            }
        });
        
        document.getElementById('fill-answer').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkFillAnswer();
            }
        });
    </script>
</body>
</html>
