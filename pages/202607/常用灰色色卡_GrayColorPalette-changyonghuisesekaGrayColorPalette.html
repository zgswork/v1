<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>常用灰色色卡 / Gray Color Palette</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, 
                         Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
            border-bottom: 1px solid #eee;
            position: relative;
        }
        
        h1 {
            font-size: 2rem;
            font-weight: 500;
            color: #444;
        }
        
        .subtitle {
            color: #777;
            font-size: 1rem;
            margin-top: 5px;
        }
        
        .lang-switcher {
            position: absolute;
            top: 20px;
            right: 20px;
        }
        
        .lang-btn {
            background: none;
            border: 1px solid #ddd;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-left: 5px;
            transition: all 0.2s;
        }
        
        .lang-btn:hover {
            background-color: #f0f0f0;
        }
        
        .lang-btn.active {
            background-color: #333;
            color: white;
            border-color: #333;
        }
        
        .color-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }
        
        .color-card {
            height: 150px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .color-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .color-info {
            background-color: rgba(255,255,255,0.9);
            padding: 8px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        
        .hex-value {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            display: block;
            margin-bottom: 3px;
        }
        
        .color-name {
            color: #666;
            font-size: 0.8rem;
        }
        
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px 0;
            color: #999;
            font-size: 0.9rem;
            border-top: 1px solid #eee;
        }
        
        @media (max-width: 768px) {
            .color-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
            
            .color-card {
                height: 120px;
            }
        }
        
        @media (max-width: 480px) {
            .color-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 10px;
            }
            
            .color-card {
                height: 100px;
                padding: 8px;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            .lang-switcher {
                position: static;
                text-align: center;
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="lang-switcher">
                <button class="lang-btn active" id="zhBtn">中文</button>
                <button class="lang-btn" id="enBtn">English</button>
            </div>
            <h1 id="title">常用灰色色卡</h1>
            <div class="subtitle" id="subtitle">设计师必备的灰色参考</div>
        </header>
        
        <div class="color-grid" id="colorGrid">
            <!-- 色卡将通过JavaScript动态生成 -->
        </div>
        
        <footer>
            <p id="footerText">© 2023 常用灰色色卡 | 共收录 24 种实用灰色</p>
        </footer>
    </div>

    <div class="toast" id="toast">已复制到剪贴板</div>

    <script>
        // 多语言文本
        const translations = {
            zh: {
                title: "常用灰色色卡",
                subtitle: "设计师必备的灰色参考",
                footer: "© 2023 常用灰色色卡 | 共收录 24 种实用灰色",
                toast: "已复制到剪贴板",
                colors: [
                    { name: "纯白" },
                    { name: "雪白" },
                    { name: "象牙白" },
                    { name: "珍珠白" },
                    { name: "浅灰1" },
                    { name: "浅灰2" },
                    { name: "浅灰3" },
                    { name: "浅灰4" },
                    { name: "银灰" },
                    { name: "中灰1" },
                    { name: "中灰2" },
                    { name: "中灰3" },
                    { name: "中灰4" },
                    { name: "岩石灰" },
                    { name: "水泥灰" },
                    { name: "石板灰" },
                    { name: "标准灰" },
                    { name: "深灰1" },
                    { name: "深灰2" },
                    { name: "深灰3" },
                    { name: "深灰4" },
                    { name: "炭灰" },
                    { name: "黑灰" },
                    { name: "纯黑" }
                ]
            },
            en: {
                title: "Gray Color Palette",
                subtitle: "Essential gray reference for designers",
                footer: "© 2023 Gray Palette | 24 practical gray colors",
                toast: "Copied to clipboard",
                colors: [
                    { name: "Pure White" },
                    { name: "Snow White" },
                    { name: "Ivory White" },
                    { name: "Pearl White" },
                    { name: "Light Gray 1" },
                    { name: "Light Gray 2" },
                    { name: "Light Gray 3" },
                    { name: "Light Gray 4" },
                    { name: "Silver Gray" },
                    { name: "Medium Gray 1" },
                    { name: "Medium Gray 2" },
                    { name: "Medium Gray 3" },
                    { name: "Medium Gray 4" },
                    { name: "Stone Gray" },
                    { name: "Cement Gray" },
                    { name: "Slate Gray" },
                    { name: "Standard Gray" },
                    { name: "Dark Gray 1" },
                    { name: "Dark Gray 2" },
                    { name: "Dark Gray 3" },
                    { name: "Dark Gray 4" },
                    { name: "Charcoal Gray" },
                    { name: "Black Gray" },
                    { name: "Pure Black" }
                ]
            }
        };

        // 灰色色卡数据
        const grayColors = [
            { hex: "#FFFFFF" },
            { hex: "#F8F8F8" },
            { hex: "#F0F0F0" },
            { hex: "#E8E8E8" },
            { hex: "#E0E0E0" },
            { hex: "#D8D8D8" },
            { hex: "#D0D0D0" },
            { hex: "#C8C8C8" },
            { hex: "#C0C0C0" },
            { hex: "#B8B8B8" },
            { hex: "#B0B0B0" },
            { hex: "#A8A8A8" },
            { hex: "#A0A0A0" },
            { hex: "#989898" },
            { hex: "#909090" },
            { hex: "#888888" },
            { hex: "#808080" },
            { hex: "#787878" },
            { hex: "#707070" },
            { hex: "#686868" },
            { hex: "#606060" },
            { hex: "#585858" },
            { hex: "#303030" },
            { hex: "#000000" }
        ];

        // 当前语言
        let currentLang = 'zh';

        // 切换语言
        function switchLanguage(lang) {
            currentLang = lang;
            
            // 更新界面文本
            document.getElementById('title').textContent = translations[lang].title;
            document.getElementById('subtitle').textContent = translations[lang].subtitle;
            document.getElementById('footerText').textContent = translations[lang].footer;
            document.getElementById('toast').textContent = translations[lang].toast;
            
            // 更新按钮状态
            document.getElementById('zhBtn').classList.toggle('active', lang === 'zh');
            document.getElementById('enBtn').classList.toggle('active', lang === 'en');
            
            // 更新色卡名称
            const colorNames = document.querySelectorAll('.color-name');
            colorNames.forEach((nameEl, index) => {
                nameEl.textContent = translations[lang].colors[index].name;
            });
        }

        // 初始化色卡
        function initColorGrid() {
            const colorGrid = document.getElementById('colorGrid');
            colorGrid.innerHTML = '';
            
            grayColors.forEach((color, index) => {
                const card = document.createElement('div');
                card.className = 'color-card';
                card.style.backgroundColor = color.hex;
                
                // 根据亮度决定文字颜色
                const brightness = getBrightness(color.hex);
                const textColor = brightness > 128 ? '#333' : '#fff';
                
                card.innerHTML = `
                    <div class="color-info" style="color: ${textColor}">
                        <span class="hex-value">${color.hex}</span>
                        <span class="color-name">${translations[currentLang].colors[index].name}</span>
                    </div>
                `;
                
                // 点击复制HEX值
                card.addEventListener('click', () => {
                    copyToClipboard(color.hex);
                });
                
                colorGrid.appendChild(card);
            });
        }

        // 计算颜色亮度
        function getBrightness(hexColor) {
            const r = parseInt(hexColor.substr(1, 2), 16);
            const g = parseInt(hexColor.substr(3, 2), 16);
            const b = parseInt(hexColor.substr(5, 2), 16);
            return (r * 299 + g * 587 + b * 114) / 1000;
        }

        // 复制到剪贴板
        function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';  // 防止页面滚动
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                showToast();
            } catch (err) {
                console.error('复制失败:', err);
            }
            
            document.body.removeChild(textarea);
        }

        // 显示提示信息
        function showToast() {
            const toast = document.getElementById('toast');
            toast.style.opacity = '1';
            
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 2000);
        }

        // 页面加载时初始化
        window.addEventListener('DOMContentLoaded', () => {
            initColorGrid();
            
            // 添加语言切换事件
            document.getElementById('zhBtn').addEventListener('click', () => {
                switchLanguage('zh');
            });
            
            document.getElementById('enBtn').addEventListener('click', () => {
                switchLanguage('en');
            });
        });
    </script>
</body>
</html>
