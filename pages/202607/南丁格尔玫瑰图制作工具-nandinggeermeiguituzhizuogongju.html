<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南丁格尔玫瑰图制作工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            padding: 40px;
        }

        .data-input-section {
            background: #fef7f7;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border: 2px solid #ffe0e0;
        }

        .section-title {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-methods {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .input-method {
            background: white;
            border: 2px solid #ffe0e0;
            border-radius: 10px;
            padding: 20px;
        }

        .method-title {
            font-weight: 600;
            color: #ff6b9d;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        .data-table th,
        .data-table td {
            border: 1px solid #ffe0e0;
            padding: 10px;
            text-align: center;
        }

        .data-table th {
            background: #fef7f7;
            font-weight: 600;
            color: #333;
        }

        .data-table input {
            width: 100%;
            border: none;
            padding: 8px;
            text-align: center;
            font-size: 14px;
            border-radius: 4px;
        }

        .data-table input:focus {
            outline: 2px solid #ff6b9d;
            background: #fff5f8;
        }

        .data-table .color-cell {
            width: 60px;
        }

        .color-input {
            width: 100%;
            height: 35px;
            border: 2px solid #ffe0e0;
            border-radius: 6px;
            cursor: pointer;
        }

        .csv-input {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            border: 2px solid #ffe0e0;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
        }

        .csv-input:focus {
            outline: none;
            border-color: #ff6b9d;
        }

        .csv-hint {
            color: #666;
            font-size: 0.9em;
            margin-top: 10px;
        }

        .table-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .btn {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff9a9e 100%);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-weight: 500;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 157, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.8em;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
        }

        .btn-success {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
        }

        .btn-danger {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }

        .chart-settings {
            background: white;
            border: 2px solid #ffe0e0;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .setting-group {
            background: #fef7f7;
            border: 1px solid #ffe0e0;
            border-radius: 10px;
            padding: 20px;
        }

        .setting-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            display: block;
        }

        .setting-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ffe0e0;
            border-radius: 6px;
            font-size: 14px;
        }

        .setting-input:focus {
            outline: none;
            border-color: #ff6b9d;
        }

        .chart-preview {
            background: white;
            border: 2px solid #ffe0e0;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: #fef7f7;
            border: 2px solid #ffe0e0;
            border-radius: 10px;
            padding: 20px;
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #chartCanvas {
            max-width: 100%;
            max-height: 500px;
        }

        .placeholder {
            color: #666;
            text-align: center;
            font-size: 1.1em;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .btn-large {
            padding: 12px 24px;
            font-size: 1em;
            min-width: 120px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
            color: #ff6b9d;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #ff6b9d;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 8px;
            padding: 15px;
            color: #721c24;
            margin-top: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            padding: 15px;
            color: #155724;
            margin-top: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .data-stats {
            background: #fff5f8;
            border: 1px solid #ffe0e0;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .stat-item {
            text-align: center;
            padding: 10px;
            background: white;
            border-radius: 6px;
            border: 1px solid #ffe0e0;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: 600;
            color: #ff6b9d;
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 15px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 2em;
            }

            .main-content {
                padding: 20px;
            }

            .input-methods {
                grid-template-columns: 1fr;
            }

            .settings-grid {
                grid-template-columns: 1fr;
            }

            .action-buttons {
                flex-direction: column;
            }

            .table-controls {
                flex-direction: column;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌹 南丁格尔玫瑰图制作工具</h1>
            <p>创建美丽的南丁格尔玫瑰图（极坐标面积图），支持自定义颜色和样式</p>
        </div>

        <div class="main-content">
            <!-- 数据输入区域 -->
            <div class="data-input-section">
                <div class="section-title">
                    <span>📝</span>
                    数据输入
                </div>
                
                <div class="input-methods">
                    <div class="input-method">
                        <div class="method-title">
                            <span>📋</span>
                            表格输入
                        </div>
                        
                        <div class="table-controls">
                            <button class="btn btn-small" id="addRowBtn">
                                <span>➕</span>
                                添加行
                            </button>
                            <button class="btn btn-small btn-danger" id="removeRowBtn">
                                <span>➖</span>
                                删除行
                            </button>
                            <button class="btn btn-small btn-secondary" id="randomColorsBtn">
                                <span>🎨</span>
                                随机颜色
                            </button>
                        </div>
                        
                        <table class="data-table" id="dataTable">
                            <thead>
                                <tr>
                                    <th>标签</th>
                                    <th>数值</th>
                                    <th>颜色</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><input type="text" value="产品A" placeholder="标签名称"></td>
                                    <td><input type="number" value="30" placeholder="数值" min="0"></td>
                                    <td class="color-cell"><input type="color" class="color-input" value="#ff6b9d"></td>
                                </tr>
                                <tr>
                                    <td><input type="text" value="产品B" placeholder="标签名称"></td>
                                    <td><input type="number" value="25" placeholder="数值" min="0"></td>
                                    <td class="color-cell"><input type="color" class="color-input" value="#4ecdc4"></td>
                                </tr>
                                <tr>
                                    <td><input type="text" value="产品C" placeholder="标签名称"></td>
                                    <td><input type="number" value="20" placeholder="数值" min="0"></td>
                                    <td class="color-cell"><input type="color" class="color-input" value="#45b7d1"></td>
                                </tr>
                                <tr>
                                    <td><input type="text" value="产品D" placeholder="标签名称"></td>
                                    <td><input type="number" value="15" placeholder="数值" min="0"></td>
                                    <td class="color-cell"><input type="color" class="color-input" value="#f9ca24"></td>
                                </tr>
                                <tr>
                                    <td><input type="text" value="产品E" placeholder="标签名称"></td>
                                    <td><input type="number" value="10" placeholder="数值" min="0"></td>
                                    <td class="color-cell"><input type="color" class="color-input" value="#6c5ce7"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    
                    <div class="input-method">
                        <div class="method-title">
                            <span>📄</span>
                            CSV格式输入
                        </div>
                        
                        <textarea id="csvInput" class="csv-input" placeholder="请输入CSV格式数据，例如：\n\n标签,数值,颜色\n产品A,30,#ff6b9d\n产品B,25,#4ecdc4\n产品C,20,#45b7d1\n产品D,15,#f9ca24\n产品E,10,#6c5ce7"></textarea>
                        
                        <div class="csv-hint">
                            格式：标签,数值,颜色（颜色可选，支持十六进制颜色代码）
                        </div>
                        
                        <div style="margin-top: 15px;">
                            <button class="btn btn-small" id="parseCsvBtn">
                                <span>🔄</span>
                                解析CSV
                            </button>
                            <button class="btn btn-small btn-secondary" id="exportCsvBtn">
                                <span>📤</span>
                                导出CSV
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- 数据统计 -->
                <div class="data-stats" id="dataStats">
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-value" id="totalItems">5</div>
                            <div class="stat-label">数据项</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="totalValue">100</div>
                            <div class="stat-label">总数值</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="avgValue">20</div>
                            <div class="stat-label">平均值</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="maxValue">30</div>
                            <div class="stat-label">最大值</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 图表设置 -->
            <div class="chart-settings">
                <div class="section-title">
                    <span>⚙️</span>
                    图表设置
                </div>
                
                <div class="settings-grid">
                    <div class="setting-group">
                        <label class="setting-label" for="chartTitle">图表标题</label>
                        <input type="text" id="chartTitle" class="setting-input" value="南丁格尔玫瑰图" placeholder="输入图表标题">
                    </div>
                    
                    <div class="setting-group">
                        <label class="setting-label" for="chartSize">图表大小</label>
                        <input type="number" id="chartSize" class="setting-input" value="500" min="300" max="800">
                    </div>
                    
                    <div class="setting-group">
                        <label class="setting-label" for="showLegend">显示图例</label>
                        <select id="showLegend" class="setting-input">
                            <option value="true">显示</option>
                            <option value="false">隐藏</option>
                        </select>
                    </div>
                    
                    <div class="setting-group">
                        <label class="setting-label" for="showValues">显示数值</label>
                        <select id="showValues" class="setting-input">
                            <option value="true">显示</option>
                            <option value="false">隐藏</option>
                        </select>
                    </div>
                    
                    <div class="setting-group">
                        <label class="setting-label" for="showPercentage">显示百分比</label>
                        <select id="showPercentage" class="setting-input">
                            <option value="true">显示</option>
                            <option value="false">隐藏</option>
                        </select>
                    </div>
                    
                    <div class="setting-group">
                        <label class="setting-label" for="startAngle">起始角度</label>
                        <input type="number" id="startAngle" class="setting-input" value="0" min="0" max="360">
                    </div>
                    
                    <div class="setting-group">
                        <label class="setting-label" for="borderWidth">边框宽度</label>
                        <input type="number" id="borderWidth" class="setting-input" value="2" min="0" max="10">
                    </div>
                    
                    <div class="setting-group">
                        <label class="setting-label" for="borderColor">边框颜色</label>
                        <input type="color" id="borderColor" class="setting-input" value="#ffffff">
                    </div>
                </div>
            </div>

            <!-- 操作按钮 -->
            <div class="action-buttons">
                <button class="btn btn-large" id="generateChartBtn">
                    <span>🌹</span>
                    生成玫瑰图
                </button>
                <button class="btn btn-large btn-success" id="downloadPngBtn" disabled>
                    <span>🖼️</span>
                    下载PNG
                </button>
                <button class="btn btn-large btn-success" id="downloadJpgBtn" disabled>
                    <span>📷</span>
                    下载JPG
                </button>
                <button class="btn btn-large btn-danger" id="clearBtn">
                    <span>🗑️</span>
                    清空重置
                </button>
            </div>

            <!-- 加载状态 -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div>正在生成玫瑰图...</div>
            </div>

            <!-- 图表预览 -->
            <div class="chart-preview">
                <div class="section-title">
                    <span>🌹</span>
                    玫瑰图预览
                </div>
                
                <div class="chart-container">
                    <canvas id="chartCanvas"></canvas>
                    <div class="placeholder" id="placeholder">
                        <div style="font-size: 3em; margin-bottom: 15px;">🌹</div>
                        <div>设置数据并点击"生成玫瑰图"按钮开始制作</div>
                    </div>
                </div>
            </div>

            <!-- 错误信息 -->
            <div class="error-message" id="errorMessage"></div>
            
            <!-- 成功信息 -->
            <div class="success-message" id="successMessage"></div>
        </div>
    </div>

    <!-- 引入Chart.js库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    
    <script>
        class NightingaleRoseChartGenerator {
            constructor() {
                this.chart = null;
                this.currentData = null;
                this.initializeElements();
                this.bindEvents();
                this.updateStats();
            }

            initializeElements() {
                this.dataTable = document.getElementById('dataTable');
                this.csvInput = document.getElementById('csvInput');
                this.chartCanvas = document.getElementById('chartCanvas');
                this.placeholder = document.getElementById('placeholder');
                this.loading = document.getElementById('loading');
                this.errorMessage = document.getElementById('errorMessage');
                this.successMessage = document.getElementById('successMessage');
                
                // 统计元素
                this.totalItems = document.getElementById('totalItems');
                this.totalValue = document.getElementById('totalValue');
                this.avgValue = document.getElementById('avgValue');
                this.maxValue = document.getElementById('maxValue');
                
                // 按钮
                this.addRowBtn = document.getElementById('addRowBtn');
                this.removeRowBtn = document.getElementById('removeRowBtn');
                this.randomColorsBtn = document.getElementById('randomColorsBtn');
                this.parseCsvBtn = document.getElementById('parseCsvBtn');
                this.exportCsvBtn = document.getElementById('exportCsvBtn');
                this.generateChartBtn = document.getElementById('generateChartBtn');
                this.downloadPngBtn = document.getElementById('downloadPngBtn');
                this.downloadJpgBtn = document.getElementById('downloadJpgBtn');
                this.clearBtn = document.getElementById('clearBtn');
                
                // 设置
                this.chartTitle = document.getElementById('chartTitle');
                this.chartSize = document.getElementById('chartSize');
                this.showLegend = document.getElementById('showLegend');
                this.showValues = document.getElementById('showValues');
                this.showPercentage = document.getElementById('showPercentage');
                this.startAngle = document.getElementById('startAngle');
                this.borderWidth = document.getElementById('borderWidth');
                this.borderColor = document.getElementById('borderColor');
            }

            bindEvents() {
                // 表格操作
                this.addRowBtn.addEventListener('click', () => this.addTableRow());
                this.removeRowBtn.addEventListener('click', () => this.removeTableRow());
                this.randomColorsBtn.addEventListener('click', () => this.randomizeColors());
                
                // CSV操作
                this.parseCsvBtn.addEventListener('click', () => this.parseCsvData());
                this.exportCsvBtn.addEventListener('click', () => this.exportToCsv());
                
                // 图表操作
                this.generateChartBtn.addEventListener('click', () => this.generateChart());
                this.downloadPngBtn.addEventListener('click', () => this.downloadChart('png'));
                this.downloadJpgBtn.addEventListener('click', () => this.downloadChart('jpeg'));
                this.clearBtn.addEventListener('click', () => this.clearAll());
                
                // 数据变化监听
                this.dataTable.addEventListener('input', () => this.updateStats());
            }

            addTableRow() {
                const tbody = this.dataTable.querySelector('tbody');
                const newRow = document.createElement('tr');
                const rowCount = tbody.children.length + 1;
                
                newRow.innerHTML = `
                    <td><input type="text" value="项目${rowCount}" placeholder="标签名称"></td>
                    <td><input type="number" value="10" placeholder="数值" min="0"></td>
                    <td class="color-cell"><input type="color" class="color-input" value="${this.getRandomColor()}"></td>
                `;
                
                tbody.appendChild(newRow);
                this.updateStats();
                this.showSuccess('已添加新行');
            }

            removeTableRow() {
                const tbody = this.dataTable.querySelector('tbody');
                if (tbody.children.length > 1) {
                    tbody.removeChild(tbody.lastElementChild);
                    this.updateStats();
                    this.showSuccess('已删除最后一行');
                } else {
                    this.showError('至少需要保留一行数据');
                }
            }

            randomizeColors() {
                const colorInputs = this.dataTable.querySelectorAll('.color-input');
                colorInputs.forEach(input => {
                    input.value = this.getRandomColor();
                });
                this.showSuccess('已随机生成颜色');
            }

            getRandomColor() {
                const colors = [
                    '#ff6b9d', '#4ecdc4', '#45b7d1', '#f9ca24', '#6c5ce7',
                    '#a29bfe', '#fd79a8', '#fdcb6e', '#e17055', '#00b894',
                    '#00cec9', '#55a3ff', '#ff7675', '#74b9ff', '#81ecec',
                    '#fab1a0', '#e84393', '#00b894', '#fdcb6e', '#6c5ce7'
                ];
                return colors[Math.floor(Math.random() * colors.length)];
            }

            parseCsvData() {
                const csvText = this.csvInput.value.trim();
                if (!csvText) {
                    this.showError('请输入CSV数据');
                    return;
                }

                try {
                    const lines = csvText.split('\n').filter(line => line.trim());
                    if (lines.length < 2) {
                        this.showError('CSV数据至少需要包含标题行和一行数据');
                        return;
                    }

                    // 跳过标题行，解析数据行
                    const dataRows = lines.slice(1).map(line => {
                        const parts = line.split(',').map(part => part.trim());
                        return {
                            label: parts[0] || '',
                            value: parseFloat(parts[1]) || 0,
                            color: parts[2] || this.getRandomColor()
                        };
                    });

                    // 重建表格
                    this.rebuildTable(dataRows);
                    this.updateStats();
                    this.showSuccess('CSV数据解析成功');
                } catch (error) {
                    this.showError('CSV数据格式错误：' + error.message);
                }
            }

            rebuildTable(dataRows) {
                const tbody = this.dataTable.querySelector('tbody');
                tbody.innerHTML = '';
                
                dataRows.forEach(row => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><input type="text" value="${row.label}" placeholder="标签名称"></td>
                        <td><input type="number" value="${row.value}" placeholder="数值" min="0"></td>
                        <td class="color-cell"><input type="color" class="color-input" value="${row.color}"></td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            exportToCsv() {
                const data = this.getTableData();
                if (!data) return;
                
                const csvContent = [
                    '标签,数值,颜色',
                    ...data.map(item => `${item.label},${item.value},${item.color}`)
                ].join('\n');
                
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `rose_chart_data_${new Date().getTime()}.csv`;
                link.click();
                
                this.showSuccess('CSV文件导出成功');
            }

            getTableData() {
                const tbody = this.dataTable.querySelector('tbody');
                const rows = Array.from(tbody.children);
                const data = [];
                
                for (let i = 0; i < rows.length; i++) {
                    const inputs = rows[i].querySelectorAll('input');
                    const label = inputs[0].value.trim();
                    const value = parseFloat(inputs[1].value);
                    const color = inputs[2].value;
                    
                    if (!label) {
                        this.showError(`第${i + 1}行缺少标签名称`);
                        return null;
                    }
                    
                    if (isNaN(value) || value < 0) {
                        this.showError(`第${i + 1}行数值无效`);
                        return null;
                    }
                    
                    data.push({ label, value, color });
                }
                
                if (data.length === 0) {
                    this.showError('请输入数据');
                    return null;
                }
                
                return data;
            }

            updateStats() {
                const data = this.getTableData();
                if (!data) return;
                
                const values = data.map(item => item.value);
                const total = values.reduce((sum, val) => sum + val, 0);
                const avg = total / values.length;
                const max = Math.max(...values);
                
                this.totalItems.textContent = data.length;
                this.totalValue.textContent = total.toFixed(1);
                this.avgValue.textContent = avg.toFixed(1);
                this.maxValue.textContent = max.toFixed(1);
            }

            generateChart() {
                const data = this.getTableData();
                if (!data) return;

                this.showLoading(true);
                this.hideMessages();
                
                setTimeout(() => {
                    try {
                        this.renderChart(data);
                        this.currentData = data;
                        this.showLoading(false);
                        this.showSuccess('南丁格尔玫瑰图生成成功');
                    } catch (error) {
                        this.showLoading(false);
                        this.showError('图表生成失败：' + error.message);
                    }
                }, 500);
            }

            renderChart(data) {
                const ctx = this.chartCanvas.getContext('2d');
                
                // 销毁现有图表
                if (this.chart) {
                    this.chart.destroy();
                }
                
                // 准备数据
                const labels = data.map(item => item.label);
                const values = data.map(item => item.value);
                const colors = data.map(item => item.color);
                const total = values.reduce((sum, val) => sum + val, 0);
                
                // 设置画布大小
                const size = parseInt(this.chartSize.value);
                this.chartCanvas.width = size;
                this.chartCanvas.height = size;
                
                // 创建图表配置
                const config = {
                    type: 'polarArea',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: values,
                            backgroundColor: colors,
                            borderColor: this.borderColor.value,
                            borderWidth: parseInt(this.borderWidth.value)
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            r: {
                                beginAtZero: true,
                                grid: {
                                    color: 'rgba(0,0,0,0.1)'
                                },
                                angleLines: {
                                    color: 'rgba(0,0,0,0.1)'
                                },
                                pointLabels: {
                                    font: {
                                        size: 12
                                    }
                                }
                            }
                        },
                        plugins: {
                            title: {
                                display: !!this.chartTitle.value,
                                text: this.chartTitle.value,
                                font: {
                                    size: 16,
                                    weight: 'bold'
                                },
                                padding: 20
                            },
                            legend: {
                                display: this.showLegend.value === 'true',
                                position: 'bottom',
                                labels: {
                                    padding: 20,
                                    usePointStyle: true
                                }
                            },
                            tooltip: {
                                callbacks: {
                                    label: (context) => {
                                        const value = context.parsed;
                                        const percentage = ((value / total) * 100).toFixed(1);
                                        let label = context.label + ': ' + value;
                                        
                                        if (this.showPercentage.value === 'true') {
                                            label += ` (${percentage}%)`;
                                        }
                                        
                                        return label;
                                    }
                                }
                            }
                        },
                        elements: {
                            arc: {
                                borderWidth: parseInt(this.borderWidth.value)
                            }
                        },
                        layout: {
                            padding: 20
                        }
                    }
                };
                
                // 设置起始角度
                if (this.startAngle.value) {
                    config.options.scales.r.startAngle = parseInt(this.startAngle.value);
                }
                
                // 创建图表
                this.chart = new Chart(ctx, config);
                
                // 显示图表，隐藏占位符
                this.placeholder.style.display = 'none';
                this.chartCanvas.style.display = 'block';
                
                // 启用下载按钮
                this.downloadPngBtn.disabled = false;
                this.downloadJpgBtn.disabled = false;
            }

            downloadChart(format) {
                if (!this.chart) {
                    this.showError('请先生成图表');
                    return;
                }

                try {
                    const link = document.createElement('a');
                    link.download = `nightingale_rose_chart_${new Date().getTime()}.${format === 'jpeg' ? 'jpg' : format}`;
                    
                    if (format === 'jpeg') {
                        // 对于JPEG格式，需要白色背景
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = this.chartCanvas.width;
                        canvas.height = this.chartCanvas.height;
                        
                        // 填充白色背景
                        ctx.fillStyle = 'white';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        
                        // 绘制图表
                        ctx.drawImage(this.chartCanvas, 0, 0);
                        
                        link.href = canvas.toDataURL('image/jpeg', 0.9);
                    } else {
                        link.href = this.chartCanvas.toDataURL('image/png');
                    }
                    
                    link.click();
                    this.showSuccess(`${format.toUpperCase()}图片下载成功`);
                } catch (error) {
                    this.showError('图片下载失败：' + error.message);
                }
            }

            clearAll() {
                // 重置表格
                const tbody = this.dataTable.querySelector('tbody');
                tbody.innerHTML = `
                    <tr>
                        <td><input type="text" value="产品A" placeholder="标签名称"></td>
                        <td><input type="number" value="30" placeholder="数值" min="0"></td>
                        <td class="color-cell"><input type="color" class="color-input" value="#ff6b9d"></td>
                    </tr>
                    <tr>
                        <td><input type="text" value="产品B" placeholder="标签名称"></td>
                        <td><input type="number" value="25" placeholder="数值" min="0"></td>
                        <td class="color-cell"><input type="color" class="color-input" value="#4ecdc4"></td>
                    </tr>
                    <tr>
                        <td><input type="text" value="产品C" placeholder="标签名称"></td>
                        <td><input type="number" value="20" placeholder="数值" min="0"></td>
                        <td class="color-cell"><input type="color" class="color-input" value="#45b7d1"></td>
                    </tr>
                    <tr>
                        <td><input type="text" value="产品D" placeholder="标签名称"></td>
                        <td><input type="number" value="15" placeholder="数值" min="0"></td>
                        <td class="color-cell"><input type="color" class="color-input" value="#f9ca24"></td>
                    </tr>
                    <tr>
                        <td><input type="text" value="产品E" placeholder="标签名称"></td>
                        <td><input type="number" value="10" placeholder="数值" min="0"></td>
                        <td class="color-cell"><input type="color" class="color-input" value="#6c5ce7"></td>
                    </tr>
                `;
                
                // 清空CSV输入
                this.csvInput.value = '';
                
                // 重置设置
                this.chartTitle.value = '南丁格尔玫瑰图';
                this.chartSize.value = '500';
                this.showLegend.value = 'true';
                this.showValues.value = 'true';
                this.showPercentage.value = 'true';
                this.startAngle.value = '0';
                this.borderWidth.value = '2';
                this.borderColor.value = '#ffffff';
                
                // 销毁图表
                if (this.chart) {
                    this.chart.destroy();
                    this.chart = null;
                }
                
                // 显示占位符
                this.placeholder.style.display = 'block';
                this.chartCanvas.style.display = 'none';
                
                // 禁用下载按钮
                this.downloadPngBtn.disabled = true;
                this.downloadJpgBtn.disabled = true;
                
                // 更新统计
                this.updateStats();
                
                this.hideMessages();
                this.showSuccess('已重置所有设置');
            }

            showLoading(show) {
                this.loading.classList.toggle('show', show);
            }

            showError(message) {
                this.errorMessage.textContent = message;
                this.errorMessage.classList.add('show');
                this.successMessage.classList.remove('show');
            }

            showSuccess(message) {
                this.successMessage.textContent = message;
                this.successMessage.classList.add('show');
                this.errorMessage.classList.remove('show');
            }

            hideMessages() {
                this.errorMessage.classList.remove('show');
                this.successMessage.classList.remove('show');
            }
        }

        // 等待Chart.js库加载完成后初始化
        window.addEventListener('load', () => {
            if (typeof Chart !== 'undefined') {
                new NightingaleRoseChartGenerator();
            } else {
                console.error('Chart.js库加载失败');
                document.getElementById('errorMessage').textContent = 'Chart.js库加载失败，请检查网络连接';
                document.getElementById('errorMessage').classList.add('show');
            }
        });
    </script>
</body>
</html>
