<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Token 计算器 - 支持主流模型</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
        }

        .input-section, .result-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .section-title {
            font-size: 1.4em;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        select:focus, textarea:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
            font-family: 'Courier New', monospace;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card.secondary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .stat-card.tertiary {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }

        .stat-card.quaternary {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .cost-breakdown {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }

        .cost-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e9ecef;
        }

        .cost-item:last-child {
            border-bottom: none;
            font-weight: bold;
            font-size: 1.1em;
            color: #4facfe;
        }

        .copy-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .copy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 20px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2em;
            }
        }

        .model-info {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            margin-top: 15px;
            border-radius: 0 8px 8px 0;
            font-size: 0.9em;
            color: #1565c0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI Token 计算器</h1>
            <p>支持主流AI模型的Token计算和成本估算</p>
        </div>

        <div class="main-content">
            <div class="input-section">
                <h2 class="section-title">
                    📝 输入文本
                </h2>
                
                <div class="form-group">
                    <label for="model-select">选择AI模型:</label>
                    <select id="model-select">
                        <optgroup label="OpenAI">
                            <option value="gpt-4o" data-input="2.50" data-output="10.00" data-ratio="0.75">GPT-4o</option>
                            <option value="gpt-4o-mini" data-input="0.15" data-output="0.60" data-ratio="0.75">GPT-4o Mini</option>
                            <option value="o1" data-input="15.00" data-output="60.00" data-ratio="0.75">o1</option>
                            <option value="o3-mini" data-input="1.10" data-output="4.40" data-ratio="0.75">o3-mini</option>
                            <option value="gpt-3.5-turbo" data-input="0.50" data-output="1.50" data-ratio="0.75">GPT-3.5 Turbo</option>
                        </optgroup>
                        <optgroup label="Anthropic Claude">
                            <option value="claude-3.5-sonnet" data-input="3.00" data-output="15.00" data-ratio="0.75">Claude 3.5 Sonnet</option>
                            <option value="claude-3.5-haiku" data-input="0.25" data-output="1.25" data-ratio="0.75">Claude 3.5 Haiku</option>
                            <option value="claude-3-opus" data-input="15.00" data-output="75.00" data-ratio="0.75">Claude 3 Opus</option>
                        </optgroup>
                        <optgroup label="Google Gemini">
                            <option value="gemini-2.5-pro" data-input="1.25" data-output="5.00" data-ratio="0.75">Gemini 2.5 Pro</option>
                            <option value="gemini-2.5-flash" data-input="0.075" data-output="0.30" data-ratio="0.75">Gemini 2.5 Flash</option>
                            <option value="gemini-1.5-pro" data-input="1.25" data-output="5.00" data-ratio="0.75">Gemini 1.5 Pro</option>
                        </optgroup>
                        <optgroup label="DeepSeek">
                            <option value="deepseek-chat" data-input="0.27" data-output="1.10" data-ratio="0.5" data-cn="0.6" data-en="0.3">DeepSeek Chat</option>
                            <option value="deepseek-reasoner" data-input="0.55" data-output="2.19" data-ratio="0.5" data-cn="0.6" data-en="0.3">DeepSeek Reasoner</option>
                        </optgroup>
                        <optgroup label="Mistral AI">
                            <option value="mistral-large" data-input="2.00" data-output="6.00" data-ratio="0.75">Mistral Large</option>
                            <option value="mistral-medium-3" data-input="0.40" data-output="2.00" data-ratio="0.75">Mistral Medium 3</option>
                            <option value="mistral-small-3.2" data-input="0.10" data-output="0.30" data-ratio="0.75">Mistral Small 3.2</option>
                            <option value="codestral" data-input="0.30" data-output="0.90" data-ratio="0.75">Codestral</option>
                        </optgroup>
                        <optgroup label="Meta Llama">
                            <option value="llama-3.2-3b" data-input="0.06" data-output="0.06" data-ratio="0.75">Llama 3.2 3B</option>
                            <option value="llama-3.2-8b" data-input="0.20" data-output="0.20" data-ratio="0.75">Llama 3.2 8B</option>
                            <option value="llama-3.1-70b" data-input="0.50" data-output="0.50" data-ratio="0.75">Llama 3.1 70B</option>
                            <option value="llama-3.1-405b" data-input="2.00" data-output="6.00" data-ratio="0.75">Llama 3.1 405B</option>
                        </optgroup>
                    </select>
                </div>

                <div class="form-group">
                    <label for="text-input">输入文本:</label>
                    <textarea id="text-input" placeholder="在这里输入您要计算token的文本..."></textarea>
                </div>

                <div class="model-info" id="model-info">
                    选择一个模型查看详细信息
                </div>
            </div>

            <div class="result-section">
                <h2 class="section-title">
                    📊 计算结果
                </h2>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="token-count">0</div>
                        <div class="stat-label">Token 数量</div>
                    </div>
                    <div class="stat-card secondary">
                        <div class="stat-value" id="char-count">0</div>
                        <div class="stat-label">字符数</div>
                    </div>
                    <div class="stat-card tertiary">
                        <div class="stat-value" id="word-count">0</div>
                        <div class="stat-label">单词数</div>
                    </div>
                    <div class="stat-card quaternary">
                        <div class="stat-value" id="input-cost">$0.00</div>
                        <div class="stat-label">输入成本</div>
                    </div>
                </div>

                <div class="cost-breakdown">
                    <h3 style="margin-bottom: 15px; color: #333;">💰 成本明细</h3>
                    <div class="cost-item">
                        <span>输入Token成本:</span>
                        <span id="input-cost-detail">$0.00</span>
                    </div>
                    <div class="cost-item">
                        <span>输出Token成本 (估算):</span>
                        <span id="output-cost-detail">$0.00</span>
                    </div>
                    <div class="cost-item">
                        <span>总成本估算:</span>
                        <span id="total-cost">$0.00</span>
                    </div>
                </div>

                <button class="copy-btn" onclick="copyResults()">📋 复制结果</button>
            </div>
        </div>
    </div>

    <script>
        const textInput = document.getElementById('text-input');
        const modelSelect = document.getElementById('model-select');
        const modelInfo = document.getElementById('model-info');
        
        // 模型信息
        const modelInfoData = {
            'gpt-4o': 'OpenAI最新的多模态模型，支持文本和图像处理，128K上下文长度',
            'gpt-4o-mini': 'OpenAI的轻量级模型，成本效益高，适合大多数应用',
            'o1': 'OpenAI的推理模型，擅长复杂的数学和编程任务',
            'o3-mini': 'OpenAI最新的高效推理模型，适合STEM领域',
            'gpt-3.5-turbo': 'OpenAI经典模型，性价比高',
            'claude-3.5-sonnet': 'Anthropic最强模型，擅长写作和分析',
            'claude-3.5-haiku': 'Anthropic快速模型，低延迟高效率',
            'claude-3-opus': 'Anthropic最强大的模型，适合复杂任务',
            'gemini-2.5-pro': 'Google最新旗舰模型，支持长上下文',
            'gemini-2.5-flash': 'Google快速模型，平衡性能和成本',
            'gemini-1.5-pro': 'Google成熟的多模态模型',
            'deepseek-chat': 'DeepSeek对话模型，中英文优化，成本极低',
            'deepseek-reasoner': 'DeepSeek推理模型，包含思维链过程',
            'mistral-large': 'Mistral最强模型，适合复杂任务',
            'mistral-medium-3': 'Mistral中等模型，性能均衡',
            'mistral-small-3.2': 'Mistral轻量模型，多模态支持',
            'codestral': 'Mistral专业编程模型，支持80+编程语言',
            'llama-3.2-3b': 'Meta轻量模型，适合边缘部署',
            'llama-3.2-8b': 'Meta中等模型，平衡性能和效率',
            'llama-3.1-70b': 'Meta大型模型，强大的推理能力',
            'llama-3.1-405b': 'Meta最大模型，顶级性能'
        };

        function calculateTokens(text, model) {
            const option = modelSelect.selectedOptions[0];
            const isDeepSeek = model.startsWith('deepseek');
            
            if (isDeepSeek) {
                // DeepSeek特殊计算方式
                const cnRatio = parseFloat(option.dataset.cn) || 0.6;
                const enRatio = parseFloat(option.dataset.en) || 0.3;
                
                let tokens = 0;
                for (let char of text) {
                    if (/[\u4e00-\u9fff]/.test(char)) {
                        // 中文字符
                        tokens += cnRatio;
                    } else {
                        // 英文字符
                        tokens += enRatio;
                    }
                }
                return Math.ceil(tokens);
            } else {
                // 其他模型使用标准计算
                const ratio = parseFloat(option.dataset.ratio) || 0.75;
                return Math.ceil(text.length * ratio);
            }
        }

        function updateCalculations() {
            const text = textInput.value;
            const selectedModel = modelSelect.value;
            const option = modelSelect.selectedOptions[0];
            
            // 基础统计
            const charCount = text.length;
            const wordCount = text.trim() ? text.trim().split(/\s+/).length : 0;
            const tokenCount = calculateTokens(text, selectedModel);
            
            // 成本计算
            const inputPrice = parseFloat(option.dataset.input) || 0;
            const outputPrice = parseFloat(option.dataset.output) || 0;
            
            const inputCost = (tokenCount / 1000000) * inputPrice;
            const outputCost = (tokenCount / 1000000) * outputPrice; // 假设输出与输入同等长度
            const totalCost = inputCost + outputCost;
            
            // 更新显示
            document.getElementById('token-count').textContent = tokenCount.toLocaleString();
            document.getElementById('char-count').textContent = charCount.toLocaleString();
            document.getElementById('word-count').textContent = wordCount.toLocaleString();
            document.getElementById('input-cost').textContent = `$${inputCost.toFixed(6)}`;
            document.getElementById('input-cost-detail').textContent = `$${inputCost.toFixed(6)}`;
            document.getElementById('output-cost-detail').textContent = `$${outputCost.toFixed(6)}`;
            document.getElementById('total-cost').textContent = `$${totalCost.toFixed(6)}`;
            
            // 更新模型信息
            modelInfo.textContent = modelInfoData[selectedModel] || '模型信息不可用';
        }

        function copyResults() {
            const results = `Token计算结果:
模型: ${modelSelect.selectedOptions[0].text}
Token数量: ${document.getElementById('token-count').textContent}
字符数: ${document.getElementById('char-count').textContent}
单词数: ${document.getElementById('word-count').textContent}
输入成本: ${document.getElementById('input-cost-detail').textContent}
输出成本: ${document.getElementById('output-cost-detail').textContent}
总成本: ${document.getElementById('total-cost').textContent}`;
            
            navigator.clipboard.writeText(results).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✅ 已复制!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            });
        }

        // 事件监听
        textInput.addEventListener('input', updateCalculations);
        modelSelect.addEventListener('change', updateCalculations);
        
        // 初始化
        updateCalculations();
    </script>
</body>
</html>
