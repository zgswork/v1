<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF转图片工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
        }

        h3 {
            margin-bottom: 15px;
            color: #2c3e50;
        }

        .upload-area {
            margin-bottom: 30px;
        }

        #drop-area {
            border: 3px dashed #ccc;
            border-radius: 10px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #drop-area:hover, #drop-area.highlight {
            border-color: #3498db;
            background-color: #f0f8ff;
        }

        #drop-area p {
            margin-bottom: 15px;
            font-size: 18px;
            color: #666;
        }

        #file-input {
            display: none;
        }

        .file-input-label {
            display: inline-block;
            padding: 12px 24px;
            background-color: #3498db;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .file-input-label:hover {
            background-color: #2980b9;
        }

        .options {
            margin-bottom: 30px;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 8px;
        }

        .option-group {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .option-group label {
            width: 100px;
            font-weight: 500;
        }

        select, input[type="range"] {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ddd;
            flex: 1;
        }

        #quality-value {
            margin-left: 10px;
            font-weight: bold;
            width: 20px;
            text-align: center;
        }

        .primary-btn, .secondary-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .primary-btn {
            background-color: #3498db;
            color: white;
        }

        .primary-btn:hover {
            background-color: #2980b9;
        }

        .secondary-btn {
            background-color: #95a5a6;
            color: white;
            margin-right: 10px;
        }

        .secondary-btn:hover {
            background-color: #7f8c8d;
        }

        .progress-bar {
            height: 20px;
            background-color: #ecf0f1;
            border-radius: 10px;
            margin-bottom: 10px;
            overflow: hidden;
        }

        #progress-bar-inner {
            height: 100%;
            background-color: #3498db;
            width: 0;
            transition: width 0.3s ease;
        }

        #progress-text {
            text-align: center;
            margin-bottom: 20px;
            font-weight: 500;
        }

        #result-container {
            margin-top: 30px;
        }

        .result-actions {
            margin-bottom: 20px;
            display: flex;
        }

        #preview-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .preview-item {
            border: 1px solid #ddd;
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }

        .preview-item img {
            width: 100%;
            display: block;
        }

        .preview-item .page-number {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
        }

        .preview-item .download-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .preview-item .download-btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PDF转图片工具</h1>
        <div class="upload-area">
            <div id="drop-area">
                <p>拖放PDF文件到这里或</p>
                <input type="file" id="file-input" accept=".pdf" />
                <label for="file-input" class="file-input-label">选择PDF文件</label>
            </div>
        </div>
        
        <div class="options" id="options-panel" style="display: none;">
            <h3>转换选项</h3>
            <div class="option-group">
                <label for="format-select">图片格式:</label>
                <select id="format-select">
                    <option value="png" selected>PNG</option>
                    <option value="jpeg">JPEG</option>
                    <option value="webp">WebP</option>
                </select>
            </div>
            <div class="option-group">
                <label for="quality-input">图片质量:</label>
                <input type="range" id="quality-input" min="1" max="10" value="8">
                <span id="quality-value">8</span>
            </div>
            <button id="convert-btn" class="primary-btn">开始转换</button>
        </div>

        <div id="progress-container" style="display: none;">
            <div class="progress-bar">
                <div id="progress-bar-inner"></div>
            </div>
            <div id="progress-text">处理中: 0%</div>
        </div>

        <div id="result-container" style="display: none;">
            <h3>转换结果</h3>
            <div class="result-actions">
                <button id="download-all-btn" class="secondary-btn">下载所有图片(ZIP)</button>
                <button id="clear-btn" class="secondary-btn">清除结果</button>
            </div>
            <div id="preview-container"></div>
        </div>
    </div>

    <!-- 引入必要的库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script>
        // 设置pdf.js的worker路径
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const dropArea = document.getElementById('drop-area');
            const fileInput = document.getElementById('file-input');
            const optionsPanel = document.getElementById('options-panel');
            const convertBtn = document.getElementById('convert-btn');
            const progressContainer = document.getElementById('progress-container');
            const progressBarInner = document.getElementById('progress-bar-inner');
            const progressText = document.getElementById('progress-text');
            const resultContainer = document.getElementById('result-container');
            const previewContainer = document.getElementById('preview-container');
            const downloadAllBtn = document.getElementById('download-all-btn');
            const clearBtn = document.getElementById('clear-btn');
            const formatSelect = document.getElementById('format-select');
            const qualityInput = document.getElementById('quality-input');
            const qualityValue = document.getElementById('quality-value');

            // 存储PDF文件和转换后的图片
            let pdfFile = null;
            let convertedImages = [];

            // 拖放功能
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, preventDefaults, false);
            });

            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }

            ['dragenter', 'dragover'].forEach(eventName => {
                dropArea.addEventListener(eventName, highlight, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, unhighlight, false);
            });

            function highlight() {
                dropArea.classList.add('highlight');
            }

            function unhighlight() {
                dropArea.classList.remove('highlight');
            }

            // 处理文件拖放
            dropArea.addEventListener('drop', handleDrop, false);

            function handleDrop(e) {
                const dt = e.dataTransfer;
                const files = dt.files;
                handleFiles(files);
            }

            // 处理文件选择
            fileInput.addEventListener('change', function() {
                handleFiles(this.files);
            });

            // 处理选择的文件
            function handleFiles(files) {
                if (files.length > 0) {
                    const file = files[0];
                    if (file.type === 'application/pdf') {
                        pdfFile = file;
                        optionsPanel.style.display = 'block';
                        dropArea.innerHTML = `<p>已选择: ${file.name}</p>
                                             <input type="file" id="file-input" accept=".pdf" />
                                             <label for="file-input" class="file-input-label">更换文件</label>`;
                        // 重新绑定文件输入事件
                        document.getElementById('file-input').addEventListener('change', function() {
                            handleFiles(this.files);
                        });
                    } else {
                        alert('请选择PDF文件');
                    }
                }
            }

            // 更新质量值显示
            qualityInput.addEventListener('input', function() {
                qualityValue.textContent = this.value;
            });

            // 转换按钮点击事件
            convertBtn.addEventListener('click', convertPdfToImages);

            // PDF转图片的主要功能
            async function convertPdfToImages() {
                if (!pdfFile) {
                    alert('请先选择PDF文件');
                    return;
                }

                // 显示进度条
                optionsPanel.style.display = 'none';
                progressContainer.style.display = 'block';
                resultContainer.style.display = 'none';
                previewContainer.innerHTML = '';
                convertedImages = [];

                try {
                    // 读取PDF文件
                    const arrayBuffer = await readFileAsArrayBuffer(pdfFile);
                    const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                    const totalPages = pdf.numPages;
                    
                    // 设置画布
                    const format = formatSelect.value;
                    const quality = parseInt(qualityInput.value) / 10;
                    
                    // 处理每一页
                    for (let i = 1; i <= totalPages; i++) {
                        // 更新进度
                        const progress = Math.round((i - 1) / totalPages * 100);
                        updateProgress(progress, `处理中: ${i-1}/${totalPages} 页`);
                        
                        // 获取页面
                        const page = await pdf.getPage(i);
                        
                        // 计算尺寸
                        const viewport = page.getViewport({ scale: 1.5 });
                        
                        // 创建画布
                        const canvas = document.createElement('canvas');
                        const context = canvas.getContext('2d');
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;
                        
                        // 渲染PDF页面到画布
                        await page.render({
                            canvasContext: context,
                            viewport: viewport
                        }).promise;
                        
                        // 转换为图片
                        let imageData;
                        if (format === 'png') {
                            imageData = canvas.toDataURL('image/png');
                        } else if (format === 'jpeg') {
                            imageData = canvas.toDataURL('image/jpeg', quality);
                        } else if (format === 'webp') {
                            imageData = canvas.toDataURL('image/webp', quality);
                        }
                        
                        // 存储转换后的图片
                        convertedImages.push({
                            pageNum: i,
                            data: imageData,
                            format: format
                        });
                        
                        // 更新进度
                        updateProgress(Math.round(i / totalPages * 100), `处理中: ${i}/${totalPages} 页`);
                    }
                    
                    // 显示结果
                    displayResults();
                    
                } catch (error) {
                    console.error('转换过程中出错:', error);
                    alert('转换过程中出错: ' + error.message);
                    progressContainer.style.display = 'none';
                    optionsPanel.style.display = 'block';
                }
            }

            // 更新进度条
            function updateProgress(percent, text) {
                progressBarInner.style.width = percent + '%';
                progressText.textContent = text;
            }

            // 显示转换结果
            function displayResults() {
                progressContainer.style.display = 'none';
                resultContainer.style.display = 'block';
                
                convertedImages.forEach(image => {
                    const previewItem = document.createElement('div');
                    previewItem.className = 'preview-item';
                    
                    const img = document.createElement('img');
                    img.src = image.data;
                    
                    const pageNumber = document.createElement('div');
                    pageNumber.className = 'page-number';
                    pageNumber.textContent = `第 ${image.pageNum} 页`;
                    
                    const downloadBtn = document.createElement('button');
                    downloadBtn.className = 'download-btn';
                    downloadBtn.textContent = '下载';
                    downloadBtn.addEventListener('click', () => {
                        downloadImage(image.data, `page-${image.pageNum}.${image.format}`);
                    });
                    
                    previewItem.appendChild(img);
                    previewItem.appendChild(pageNumber);
                    previewItem.appendChild(downloadBtn);
                    previewContainer.appendChild(previewItem);
                });
            }

            // 下载单个图片
            function downloadImage(dataUrl, fileName) {
                const link = document.createElement('a');
                link.href = dataUrl;
                link.download = fileName;
                link.click();
            }

            // 下载所有图片（ZIP压缩包）
            downloadAllBtn.addEventListener('click', async function() {
                if (convertedImages.length === 0) {
                    alert('没有可下载的图片');
                    return;
                }
                
                const zip = new JSZip();
                const format = formatSelect.value;
                
                // 添加所有图片到ZIP
                convertedImages.forEach(image => {
                    // 从base64数据URL中提取实际的base64数据
                    const base64Data = image.data.split(',')[1];
                    zip.file(`page-${image.pageNum}.${format}`, base64Data, {base64: true});
                });
                
                // 生成ZIP文件
                const zipBlob = await zip.generateAsync({type: 'blob'});
                
                // 下载ZIP文件
                saveAs(zipBlob, `pdf-images-${new Date().getTime()}.zip`);
            });

            // 清除结果
            clearBtn.addEventListener('click', function() {
                resultContainer.style.display = 'none';
                optionsPanel.style.display = 'block';
                previewContainer.innerHTML = '';
                convertedImages = [];
            });

            // 辅助函数：将文件读取为ArrayBuffer
            function readFileAsArrayBuffer(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsArrayBuffer(file);
                });
            }
        });
    </script>
</body>
</html>
