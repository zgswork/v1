        // 获取DOM元素
        const movieDisplay = document.getElementById('movieDisplay');
        const recommendBtn = document.getElementById('recommendBtn');
        const changeBtn = document.getElementById('changeBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const modal = document.getElementById('downloadModal');
        const span = document.getElementsByClassName('close')[0];
        
        let currentMovie = null;
        let previousMovie = null;

        // 推荐电影函数
        function recommendMovie() {
            // 确保不会连续推荐同一部电影
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * movies.length);
            } while (movies[randomIndex] === previousMovie && movies.length > 1);
            
            currentMovie = movies[randomIndex];
            previousMovie = currentMovie;
            
            displayMovie(currentMovie);
            
            // 启用"换一部"按钮
            changeBtn.disabled = false;
        }

        // 显示电影信息函数
        function displayMovie(movie) {
            // 计算星数
            const starCount = Math.round(movie.rating / 2);
            const stars = '★'.repeat(starCount) + '☆'.repeat(5 - starCount);
            
            movieDisplay.innerHTML = `
                <h2 class="movie-title">${movie.title}</h2>
                <div class="movie-info"><span>国家/地区:</span> ${movie.country}</div>
                <div class="movie-info"><span>主演:</span> ${movie.actors}</div>
                <div class="stars">${stars} (豆瓣评分: ${movie.rating})</div>
                <div class="movie-info"><span>简介:</span> ${movie.description}</div>
                <div class="movie-info"><span>推荐理由:</span> ${movie.reason}</div>
            `;
        }

        // 事件监听
        recommendBtn.addEventListener('click', recommendMovie);
        changeBtn.addEventListener('click', recommendMovie);

        // 下载按钮事件
        downloadBtn.addEventListener('click', function() {
            modal.style.display = "block";
        });

        // 关闭弹窗事件
        span.addEventListener('click', function() {
            modal.style.display = "none";
        });

        // 点击弹窗外部关闭
        window.addEventListener('click', function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        });
    </script>
