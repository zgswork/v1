<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>进制转换器</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --card-bg: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-contrast: #ffffff;
      --border: #e5e7eb;
      --error: #dc2626;
      --input-bg: #ffffff;
    }

    html.dark {
      --bg: #0f172a;
      --card-bg: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --primary: #60a5fa;
      --primary-contrast: #0b1220;
      --border: #1f2937;
      --error: #f87171;
      --input-bg: #0b1220;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .app {
      width: 100%;
      max-width: 720px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .title {
      font-size: 18px;
      font-weight: 600;
    }
    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--input-bg);
      color: var(--text);
      cursor: pointer;
      user-select: none;
    }
    .theme-toggle:hover { border-color: var(--primary); }

    .content { padding: 20px; }

    .row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    @media (min-width: 640px) {
      .row { grid-template-columns: 1fr 1fr; }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--input-bg);
    }
    .label {
      font-size: 14px;
      color: var(--muted);
    }
    .input-wrap {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    input[type="text"], input[type="number"] {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
      background: var(--card-bg);
      color: var(--text);
      outline: none;
    }
    input::placeholder { color: var(--muted); }

    .btn {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
    }
    .btn.primary {
      background: var(--primary);
      color: var(--primary-contrast);
      border-color: transparent;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .hint {
      font-size: 12px;
      color: var(--muted);
    }
    .error { color: var(--error); }

    .footer {
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .note { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="title">进制转换器</div>
      <button id="themeBtn" class="theme-toggle" aria-label="切换主题">
        <span id="themeIcon" aria-hidden="true">🌙</span>
        <span id="themeText">深色</span>
      </button>
    </div>

    <div class="content">
      <div class="row">
        <div class="field" aria-live="polite">
          <div class="label">二进制（支持负数，空格会被忽略）</div>
          <div class="input-wrap">
            <input id="binInput" type="text" inputmode="decimal" placeholder="例如：-101101 或 1011 0101" aria-label="二进制输入" />
            <button id="binClear" class="btn" title="清空">清空</button>
          </div>
          <div style="display:flex; align-items:center; gap:8px; margin-top:6px;">
            <label style="display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted);">
              <input id="groupToggle" type="checkbox" /> 每 4 位分组显示
            </label>
          </div>
          <div id="binHint" class="hint">支持负数与大整数（使用 BigInt 精确转换）。</div>
        </div>

        <div class="field" aria-live="polite">
          <div class="label">十进制（支持负数与大整数）</div>
          <div class="input-wrap">
            <input id="decInput" type="text" inputmode="decimal" placeholder="例如：-45 或 12345678901234567890" aria-label="十进制输入" />
            <button id="decClear" class="btn" title="清空">清空</button>
          </div>
          <div id="decHint" class="hint">使用 BigInt 精确转换，无安全整数限制。</div>
        </div>
      </div>

      <div class="row" style="margin-top:14px;">
        <div class="field" aria-live="polite">
          <div class="label">十六进制（支持负数，A-F 不区分大小写）</div>
          <div class="input-wrap">
            <input id="hexInput" type="text" inputmode="text" placeholder="例如：-2A 或 2a 3f" aria-label="十六进制输入" />
            <button id="hexClear" class="btn" title="清空">清空</button>
          </div>
          <div id="hexHint" class="hint">支持负数与空格分组，使用 BigInt 精确转换。</div>
        </div>
        <div class="field" aria-live="polite">
          <div class="label">八进制（支持负数，数字 0–7）</div>
          <div class="input-wrap">
            <input id="octInput" type="text" inputmode="numeric" placeholder="例如：-57 或 12 345" aria-label="八进制输入" />
            <button id="octClear" class="btn" title="清空">清空</button>
          </div>
          <div id="octHint" class="hint">支持负数与空格分组，使用 BigInt 精确转换。</div>
        </div>
      </div>

        <div class="footer">
          <div class="note">在任一输入框中输入，另一侧会自动更新。</div>
          <div style="display:flex; gap:8px;">
            <button id="copyBin" class="btn">复制二进制</button>
            <button id="copyDec" class="btn">复制十进制</button>
            <button id="copyHex" class="btn">复制十六进制</button>
            <button id="copyOct" class="btn">复制八进制</button>
          </div>
        </div>
      </div>
    </div>

  <script>
    // 主题初始化
    const root = document.documentElement;
    const themeBtn = document.getElementById('themeBtn');
    const themeIcon = document.getElementById('themeIcon');
    const themeText = document.getElementById('themeText');

    function applyTheme(mode) {
      const isDark = mode === 'dark';
      root.classList.toggle('dark', isDark);
      themeIcon.textContent = isDark ? '🌞' : '🌙';
      themeText.textContent = isDark ? '浅色' : '深色';
    }

    function getInitialTheme() {
      const saved = localStorage.getItem('binary-decimal-theme');
      if (saved === 'light' || saved === 'dark') return saved;
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      return prefersDark ? 'dark' : 'light';
    }

    let currentTheme = getInitialTheme();
    applyTheme(currentTheme);

    themeBtn.addEventListener('click', () => {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('binary-decimal-theme', currentTheme);
      applyTheme(currentTheme);
    });

    // 转换逻辑
    const binInput = document.getElementById('binInput');
    const decInput = document.getElementById('decInput');
    const binHint = document.getElementById('binHint');
    const decHint = document.getElementById('decHint');
    const binClear = document.getElementById('binClear');
    const decClear = document.getElementById('decClear');
    const copyBin = document.getElementById('copyBin');
    const copyDec = document.getElementById('copyDec');
    const copyHex = document.getElementById('copyHex');
    const copyOct = document.getElementById('copyOct');
    const hexInput = document.getElementById('hexInput');
    const octInput = document.getElementById('octInput');
    const hexClear = document.getElementById('hexClear');
    const octClear = document.getElementById('octClear');
    const hexHint = document.getElementById('hexHint');
    const octHint = document.getElementById('octHint');
    const swapBtn = document.getElementById('swapBtn');

    const MAX_SAFE = Number.MAX_SAFE_INTEGER; // 2^53 - 1（用于旧提示保留）
    let lastEdited = null; // 'bin' | 'dec'

    function isBinary(str) {
      // 允许负号与空格分组
      const s = str.trim().replace(/\s+/g, '');
      return /^-?[01]+$/.test(s);
    }

    function isIntegerStr(str) {
      // 允许负号，纯数字
      const s = str.trim();
      return /^-?(?:0|[1-9]\d*)$/.test(s);
    }

    function absBinary(str) {
      return str.replace(/\s+/g, '').replace(/^-/, '');
    }

    function binarySign(str) {
      return str.trim().startsWith('-') ? -1n : 1n;
    }

    function binToBigInt(str) {
      const sign = binarySign(str);
      const s = absBinary(str);
      let val = 0n;
      for (const ch of s) {
        val = (val << 1n) + (ch === '1' ? 1n : 0n);
      }
      return val * sign;
    }

    // Hex helpers
    function isHex(str) {
      const s = str.trim().replace(/\s+/g, '');
      return /^-?[0-9a-fA-F]+$/.test(s);
    }
    function absHex(str) { return str.replace(/\s+/g, '').replace(/^-/, ''); }
    function hexSign(str) { return str.trim().startsWith('-') ? -1n : 1n; }
    function hexToBigInt(str) {
      const sign = hexSign(str);
      const s = absHex(str).toLowerCase();
      let val = 0n;
      for (const ch of s) {
        let d = 0n;
        if (ch >= '0' && ch <= '9') d = BigInt(ch.charCodeAt(0) - 48);
        else d = BigInt(ch.charCodeAt(0) - 87); // a=10
        val = (val << 4n) + d;
      }
      return val * sign;
    }

    // Oct helpers
    function isOct(str) {
      const s = str.trim().replace(/\s+/g, '');
      return /^-?[0-7]+$/.test(s);
    }
    function absOct(str) { return str.replace(/\s+/g, '').replace(/^-/, ''); }
    function octSign(str) { return str.trim().startsWith('-') ? -1n : 1n; }
    function octToBigInt(str) {
      const sign = octSign(str);
      const s = absOct(str);
      let val = 0n;
      for (const ch of s) {
        const d = BigInt(ch.charCodeAt(0) - 48);
        val = (val << 3n) + d;
      }
      return val * sign;
    }

    function groupBits(binStr) {
      // 从右往左每4位加空格，保留负号
      const isNeg = binStr.startsWith('-');
      const raw = isNeg ? binStr.slice(1) : binStr;
      let out = '';
      let count = 0;
      for (let i = raw.length - 1; i >= 0; i--) {
        out = raw[i] + out;
        count++;
        if (count === 4 && i !== 0) {
          out = ' ' + out;
          count = 0;
        }
      }
      return isNeg ? '-' + out : out;
    }

    // 已移除进阶显示区域，改为与二/十进制一致的输入区

    function showError(el, msg) {
      el.classList.add('error');
      el.textContent = msg;
    }

    function showHint(el, msg) {
      el.classList.remove('error');
      el.textContent = msg;
    }

    function updateFromBinary() {
      const raw = binInput.value;
      const bin = raw.trim();
      if (bin === '') { decInput.value = ''; hexInput.value=''; octInput.value=''; showHint(binHint, '支持负数与大整数（使用 BigInt 精确转换）。'); return; }
      if (!isBinary(bin)) { showError(binHint, '请输入仅包含 0/1 的二进制，可选前导负号与空格'); return; }
      try {
        const big = binToBigInt(bin);
        const decStr = big.toString();
        decInput.value = decStr;
        showHint(binHint, '支持负数与大整数（使用 BigInt 精确转换）。');
        const grouped = document.getElementById('groupToggle').checked;
        // 对由十进制反向更新的显示进行分组控制
        const display = big.toString(2);
        binInput.value = grouped ? groupBits(display) : display;
        hexInput.value = (big < 0n ? '-' : '') + (-big < 0n ? (-big).toString(16).toUpperCase() : big.toString(16).toUpperCase());
        octInput.value = (big < 0n ? '-' : '') + (-big < 0n ? (-big).toString(8) : big.toString(8));
      } catch (e) {
        showError(binHint, '转换失败，请检查输入');
      }
    }

    function updateFromDecimal() {
      const decStr = decInput.value.trim();
      if (decStr === '') { binInput.value = ''; hexInput.value=''; octInput.value=''; showHint(decHint, '使用 BigInt 精确转换，无安全整数限制。'); return; }
      if (!isIntegerStr(decStr)) { showError(decHint, '请输入整数（允许负号，不含空格与小数点）'); return; }
      try {
        const big = BigInt(decStr);
        const bin = big.toString(2);
        const grouped = document.getElementById('groupToggle').checked;
        binInput.value = grouped ? groupBits(bin) : bin;
        showHint(decHint, '使用 BigInt 精确转换，无安全整数限制。');
        hexInput.value = (big < 0n ? '-' : '') + (-big < 0n ? (-big).toString(16).toUpperCase() : big.toString(16).toUpperCase());
        octInput.value = (big < 0n ? '-' : '') + (-big < 0n ? (-big).toString(8) : big.toString(8));
      } catch (e) {
        showError(decHint, '转换失败，请检查输入');
      }
    }

    function updateFromHex() {
      const raw = hexInput.value;
      const hex = raw.trim();
      if (hex === '') { decInput.value=''; binInput.value=''; octInput.value=''; showHint(hexHint, '支持负数与空格分组，使用 BigInt 精确转换。'); return; }
      if (!isHex(hex)) { showError(hexHint, '请输入合法十六进制（0-9 A-F），可带负号与空格'); return; }
      try {
        const big = hexToBigInt(hex);
        decInput.value = big.toString(10);
        const bin = big.toString(2);
        const grouped = document.getElementById('groupToggle').checked;
        binInput.value = grouped ? groupBits(bin) : bin;
        octInput.value = (big < 0n ? '-' : '') + (-big < 0n ? (-big).toString(8) : big.toString(8));
        showHint(hexHint, '支持负数与空格分组，使用 BigInt 精确转换。');
      } catch (e) {
        showError(hexHint, '转换失败，请检查输入');
      }
    }

    function updateFromOct() {
      const raw = octInput.value;
      const oct = raw.trim();
      if (oct === '') { decInput.value=''; binInput.value=''; hexInput.value=''; showHint(octHint, '支持负数与空格分组，使用 BigInt 精确转换。'); return; }
      if (!isOct(oct)) { showError(octHint, '请输入合法八进制（0-7），可带负号与空格'); return; }
      try {
        const big = octToBigInt(oct);
        decInput.value = big.toString(10);
        const bin = big.toString(2);
        const grouped = document.getElementById('groupToggle').checked;
        binInput.value = grouped ? groupBits(bin) : bin;
        hexInput.value = (big < 0n ? '-' : '') + (-big < 0n ? (-big).toString(16).toUpperCase() : big.toString(16).toUpperCase());
        showHint(octHint, '支持负数与空格分组，使用 BigInt 精确转换。');
      } catch (e) {
        showError(octHint, '转换失败，请检查输入');
      }
    }

    function handleInput(e) {
      const target = e.target.id;
      lastEdited = target === 'binInput' ? 'bin' : 'dec';
      if (lastEdited === 'bin') updateFromBinary();
      else updateFromDecimal();
    }

    binInput.addEventListener('input', handleInput);
    decInput.addEventListener('input', handleInput);
    hexInput.addEventListener('input', (e)=>{ lastEdited='hex'; updateFromHex(); });
    octInput.addEventListener('input', (e)=>{ lastEdited='oct'; updateFromOct(); });

    const groupToggle = document.getElementById('groupToggle');

    binClear.addEventListener('click', () => {
      binInput.value = '';
      updateFromBinary();
      binInput.focus();
    });

    decClear.addEventListener('click', () => {
      decInput.value = '';
      updateFromDecimal();
      decInput.focus();
    });

    hexClear.addEventListener('click', () => {
      hexInput.value = '';
      updateFromHex();
      hexInput.focus();
    });

    octClear.addEventListener('click', () => {
      octInput.value = '';
      updateFromOct();
      octInput.focus();
    });

    copyBin.addEventListener('click', async () => {
      const val = binInput.value.trim();
      if (!val) return;
      try { await navigator.clipboard.writeText(val); copyBin.textContent = '已复制'; setTimeout(()=>copyBin.textContent='复制二进制', 1200); } catch {}
    });

    copyDec.addEventListener('click', async () => {
      const val = decInput.value.trim();
      if (!val) return;
      try { await navigator.clipboard.writeText(val); copyDec.textContent = '已复制'; setTimeout(()=>copyDec.textContent='复制十进制', 1200); } catch {}
    });

    copyHex.addEventListener('click', async () => {
      const val = hexInput.value.trim();
      if (!val) return;
      try { await navigator.clipboard.writeText(val); copyHex.textContent = '已复制'; setTimeout(()=>copyHex.textContent='复制十六进制', 1200); } catch {}
    });

    copyOct.addEventListener('click', async () => {
      const val = octInput.value.trim();
      if (!val) return;
      try { await navigator.clipboard.writeText(val); copyOct.textContent = '已复制'; setTimeout(()=>copyOct.textContent='复制八进制', 1200); } catch {}
    });

    groupToggle.addEventListener('change', () => {
      // 根据当前值重新渲染分组显示
      const current = binInput.value.trim();
      if (!current) return;
      const normalized = current.replace(/\s+/g, '');
      if (!isBinary(normalized)) return;
      const display = normalized;
      binInput.value = groupToggle.checked ? groupBits(display) : display;
    });

    // 已移除交换输入按钮

    // 初始提示校正
    showHint(binHint, '支持负数与大整数（使用 BigInt 精确转换）。');
    showHint(decHint, '使用 BigInt 精确转换，无安全整数限制。');
    showHint(hexHint, '支持负数与空格分组，使用 BigInt 精确转换。');
    showHint(octHint, '支持负数与空格分组，使用 BigInt 精确转换。');
  </script>
</body>
</html>
