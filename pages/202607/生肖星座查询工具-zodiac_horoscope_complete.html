        function calculateZodiac() {

            const birthdate = new Date(birthdateInput.value);
            
            if (!birthdateInput.value) {
                alert('请选择出生日期！');
                return;
            }
            
            const year = birthdate.getFullYear();
            const month = birthdate.getMonth() + 1;
            const day = birthdate.getDate();
            
            // 计算生肖
            const zodiacIndex = (year - 4) % 12;
            const zodiac = zodiacAnimals[zodiacIndex];
            
            // 计算星座
            const currentDate = `${month.toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}`;
            let horoscope = null;
            
            for (let h of horoscopes) {
                if (currentDate >= h.start && currentDate <= h.end) {
                    horoscope = h;
                    break;
                }
            }
            
            // 处理跨年星座（摩羯座）
            if (!horoscope) {
                horoscope = horoscopes[9]; // 摩羯座
            }

            document.getElementById('horoscope').textContent = horoscope.name;
