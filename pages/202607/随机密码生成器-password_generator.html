<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机密码生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            text-align: center;
            padding: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .content {
            padding: 30px;
        }

        .section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
            border-left: 4px solid #4facfe;
        }

        .section-title {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }

        .password-display {
            font-family: 'Courier New', monospace;
            font-size: 16px;
            background: #f8f9fa;
            border: 2px dashed #dee2e6;
            padding: 15px;
            border-radius: 8px;
            word-break: break-all;
            min-height: 50px;
            display: flex;
            align-items: center;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 10px;
            background: white;
            border-radius: 8px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }

        .checkbox-item:hover {
            border-color: #4facfe;
        }

        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            accent-color: #4facfe;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(132, 250, 176, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ffa726 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #545b62;
            transform: translateY(-2px);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .table-container {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
        }

        .table th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 10px;
            text-align: left;
            font-weight: 600;
        }

        .table td {
            padding: 12px 10px;
            border-bottom: 1px solid #e9ecef;
            vertical-align: middle;
        }

        .table tbody tr:hover {
            background: #f8f9fa;
        }

        .table tbody tr.selected {
            background: rgba(79, 172, 254, 0.1);
        }

        .password-cell {
            font-family: 'Courier New', monospace;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .length-input {
            width: 80px;
            text-align: center;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border-color: #28a745;
        }

        .alert-warning {
            background: #fff3cd;
            color: #856404;
            border-color: #ffc107;
        }

        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border-color: #dc3545;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border-top: 4px solid #4facfe;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #4facfe;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 10px;
            }

            .content {
                padding: 20px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 2em;
            }

            .checkbox-group {
                grid-template-columns: 1fr;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .table-container {
                overflow-x: auto;
            }
        }

        .hidden {
            display: none;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 随机密码生成器</h1>
            <p>安全、便捷、功能完整的密码管理工具</p>
        </div>

        <div class="content">
            <!-- 统计信息 -->
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number" id="totalPasswords">0</div>
                    <div class="stat-label">已保存密码</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="avgLength">0</div>
                    <div class="stat-label">平均长度</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="strongPasswords">0</div>
                    <div class="stat-label">强密码数量</div>
                </div>
            </div>

            <!-- 消息提示区域 -->
            <div id="alertContainer"></div>

            <!-- 密码生成设置 -->
            <div class="section">
                <h2 class="section-title">🎯 密码生成设置</h2>
                
                <div class="form-group">
                    <label for="passwordLength">密码长度: <span id="lengthValue">12</span></label>
                    <input type="range" id="passwordLength" min="4" max="64" value="12" 
                           style="width: 100%; height: 8px; border-radius: 5px; background: #ddd; outline: none; -webkit-appearance: none;">
                </div>

                <div class="form-group">
                    <label>包含字符类型:</label>
                    <div class="checkbox-group">
                        <div class="checkbox-item">
                            <input type="checkbox" id="lowercase" checked>
                            <label for="lowercase">小写字母 (a-z)</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="uppercase" checked>
                            <label for="uppercase">大写字母 (A-Z)</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="numbers" checked>
                            <label for="numbers">数字 (0-9)</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="symbols" checked>
                            <label for="symbols">特殊符号 (!@#$%...)</label>
                        </div>
                    </div>
                </div>

                <div class="btn-group">
                    <button class="btn btn-primary" onclick="generatePassword()">🎲 生成密码</button>
                    <button class="btn btn-success" onclick="copyPassword()">📋 复制密码</button>
                </div>

                <div class="form-group" style="margin-top: 20px;">
                    <label>生成的密码:</label>
                    <div class="password-display" id="generatedPassword">点击"生成密码"按钮生成新密码</div>
                </div>
            </div>

            <!-- 账号信息 -->
            <div class="section">
                <h2 class="section-title">📝 账号信息</h2>
                
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">
                    <div class="form-group">
                        <label for="website">网站/应用 *</label>
                        <input type="text" id="website" class="form-control" placeholder="例如: 微信、支付宝、GitHub" required>
                    </div>
                    <div class="form-group">
                        <label for="username">账号/用户名</label>
                        <input type="text" id="username" class="form-control" placeholder="例如: user@example.com">
                    </div>
                    <div class="form-group">
                        <label for="notes">备注</label>
                        <input type="text" id="notes" class="form-control" placeholder="可选的备注信息">
                    </div>
                </div>

                <div class="btn-group">
                    <button class="btn btn-primary" onclick="saveRecord()">💾 保存记录</button>
                    <button class="btn btn-secondary" onclick="clearForm()">🧹 清空表单</button>
                </div>
            </div>

            <!-- 密码记录管理 -->
            <div class="section">
                <h2 class="section-title">📊 密码记录管理</h2>
                
                <div class="btn-group">
                    <button class="btn btn-success" onclick="exportCSV()">📥 导出CSV</button>
                    <button class="btn btn-success" onclick="exportJSON()">📥 导出JSON</button>
                    <button class="btn btn-danger" onclick="deleteSelected()">🗑️ 删除选中</button>
                    <button class="btn btn-danger" onclick="clearAllRecords()">🧹 清空所有</button>
                </div>

                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>选择</th>
                                <th>网站/应用</th>
                                <th>用户名</th>
                                <th>密码</th>
                                <th>创建时间</th>
                                <th>备注</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="recordsTable">
                            <tr>
                                <td colspan="7" style="text-align: center; color: #666; padding: 30px;">
                                    暂无密码记录，请先生成并保存密码
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let passwordRecords = [];
        let selectedRecords = new Set();

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadRecords();
            updateStats();
            
            // 设置密码长度滑块事件
            document.getElementById('passwordLength').addEventListener('input', function() {
                document.getElementById('lengthValue').textContent = this.value;
            });
        });

        // 生成密码
        function generatePassword() {
            const length = parseInt(document.getElementById('passwordLength').value);
            const lowercase = document.getElementById('lowercase').checked;
            const uppercase = document.getElementById('uppercase').checked;
            const numbers = document.getElementById('numbers').checked;
            const symbols = document.getElementById('symbols').checked;

            // 检查至少选择一种字符类型
            if (!lowercase && !uppercase && !numbers && !symbols) {
                showAlert('请至少选择一种字符类型！', 'warning');
                return;
            }

            // 构建字符集
            let chars = '';
            if (lowercase) chars += 'abcdefghijklmnopqrstuvwxyz';
            if (uppercase) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (numbers) chars += '0123456789';
            if (symbols) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';

            // 生成密码
            let password = '';
            for (let i = 0; i < length; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }

            document.getElementById('generatedPassword').textContent = password;
            showAlert('密码生成成功！', 'success');
        }

        // 复制密码
        function copyPassword() {
            const password = document.getElementById('generatedPassword').textContent;
            if (password === '点击"生成密码"按钮生成新密码' || !password.trim()) {
                showAlert('请先生成密码！', 'warning');
                return;
            }

            navigator.clipboard.writeText(password).then(() => {
                showAlert('密码已复制到剪贴板！', 'success');
            }).catch(() => {
                // 备用复制方法
                const textarea = document.createElement('textarea');
                textarea.value = password;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showAlert('密码已复制到剪贴板！', 'success');
            });
        }

        // 保存记录
        function saveRecord() {
            const password = document.getElementById('generatedPassword').textContent;
            const website = document.getElementById('website').value.trim();
            const username = document.getElementById('username').value.trim();
            const notes = document.getElementById('notes').value.trim();

            if (password === '点击"生成密码"按钮生成新密码' || !password.trim()) {
                showAlert('请先生成密码！', 'warning');
                return;
            }

            if (!website) {
                showAlert('请输入网站/应用名称！', 'warning');
                return;
            }

            // 创建记录
            const record = {
                id: Date.now(),
                website: website,
                username: username,
                password: password,
                createdTime: new Date().toLocaleString('zh-CN'),
                notes: notes
            };

            // 添加到记录列表
            passwordRecords.push(record);

            // 保存到本地存储
            saveRecords();

            // 更新界面
            updateTable();
            updateStats();
            clearForm();

            showAlert('记录保存成功！', 'success');
        }

        // 清空表单
        function clearForm() {
            document.getElementById('website').value = '';
            document.getElementById('username').value = '';
            document.getElementById('notes').value = '';
            document.getElementById('generatedPassword').textContent = '点击"生成密码"按钮生成新密码';
        }

        // 更新表格
        function updateTable() {
            const tbody = document.getElementById('recordsTable');
            
            if (passwordRecords.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" style="text-align: center; color: #666; padding: 30px;">
                            暂无密码记录，请先生成并保存密码
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = passwordRecords.map(record => `
                <tr>
                    <td>
                        <input type="checkbox" onchange="toggleSelection(${record.id})" 
                               ${selectedRecords.has(record.id) ? 'checked' : ''}>
                    </td>
                    <td>${record.website}</td>
                    <td>${record.username || '-'}</td>
                    <td class="password-cell" title="${record.password}">
                        <span style="cursor: pointer;" onclick="copyText('${record.password}')">${record.password}</span>
                    </td>
                    <td>${record.createdTime}</td>
                    <td>${record.notes || '-'}</td>
                    <td>
                        <button class="btn btn-secondary" style="padding: 5px 10px; font-size: 12px;" 
                                onclick="deleteRecord(${record.id})">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        // 切换选择状态
        function toggleSelection(id) {
            if (selectedRecords.has(id)) {
                selectedRecords.delete(id);
            } else {
                selectedRecords.add(id);
            }
        }

        // 复制文本
        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => {
                showAlert('已复制到剪贴板！', 'success');
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showAlert('已复制到剪贴板！', 'success');
            });
        }

        // 删除单个记录
        function deleteRecord(id) {
            if (confirm('确定要删除这条记录吗？')) {
                passwordRecords = passwordRecords.filter(record => record.id !== id);
                selectedRecords.delete(id);
                saveRecords();
                updateTable();
                updateStats();
                showAlert('记录已删除！', 'success');
            }
        }

        // 删除选中记录
        function deleteSelected() {
            if (selectedRecords.size === 0) {
                showAlert('请先选择要删除的记录！', 'warning');
                return;
            }

            if (confirm(`确定要删除选中的 ${selectedRecords.size} 条记录吗？`)) {
                passwordRecords = passwordRecords.filter(record => !selectedRecords.has(record.id));
                selectedRecords.clear();
                saveRecords();
                updateTable();
                updateStats();
                showAlert('选中记录已删除！', 'success');
            }
        }

        // 清空所有记录
        function clearAllRecords() {
            if (passwordRecords.length === 0) {
                showAlert('没有记录可以清空！', 'warning');
                return;
            }

            if (confirm('确定要清空所有记录吗？这个操作不可撤销！')) {
                passwordRecords = [];
                selectedRecords.clear();
                saveRecords();
                updateTable();
                updateStats();
                showAlert('所有记录已清空！', 'success');
            }
        }

        // 导出CSV
        function exportCSV() {
            if (passwordRecords.length === 0) {
                showAlert('没有记录可以导出！', 'warning');
                return;
            }

            const headers = ['网站/应用', '用户名', '密码', '创建时间', '备注'];
            const csvContent = [
                headers.join(','),
                ...passwordRecords.map(record => [
                    `"${record.website}"`,
                    `"${record.username || ''}"`,
                    `"${record.password}"`,
                    `"${record.createdTime}"`,
                    `"${record.notes || ''}"`
                ].join(','))
            ].join('\n');

            downloadFile(csvContent, 'password_records.csv', 'text/csv;charset=utf-8;');
            showAlert('CSV文件下载成功！', 'success');
        }

        // 导出JSON
        function exportJSON() {
            if (passwordRecords.length === 0) {
                showAlert('没有记录可以导出！', 'warning');
                return;
            }

            const jsonContent = JSON.stringify(passwordRecords, null, 2);
            downloadFile(jsonContent, 'password_records.json', 'application/json;charset=utf-8;');
            showAlert('JSON文件下载成功！', 'success');
        }

        // 下载文件
        function downloadFile(content, filename, mimeType) {
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // 保存记录到本地存储
        function saveRecords() {
            localStorage.setItem('passwordRecords', JSON.stringify(passwordRecords));
        }

        // 从本地存储加载记录
        function loadRecords() {
            const saved = localStorage.getItem('passwordRecords');
            if (saved) {
                try {
                    passwordRecords = JSON.parse(saved);
                    updateTable();
                } catch (e) {
                    console.error('加载记录失败:', e);
                    passwordRecords = [];
                }
            }
        }

        // 更新统计信息
        function updateStats() {
            const total = passwordRecords.length;
            const avgLength = total > 0 ? Math.round(passwordRecords.reduce((sum, record) => sum + record.password.length, 0) / total) : 0;
            const strongPasswords = passwordRecords.filter(record => isStrongPassword(record.password)).length;

            document.getElementById('totalPasswords').textContent = total;
            document.getElementById('avgLength').textContent = avgLength;
            document.getElementById('strongPasswords').textContent = strongPasswords;
        }

        // 判断是否为强密码
        function isStrongPassword(password) {
            return password.length >= 12 && 
                   /[a-z]/.test(password) && 
                   /[A-Z]/.test(password) && 
                   /[0-9]/.test(password) && 
                   /[^a-zA-Z0-9]/.test(password);
        }

        // 显示提示消息
        function showAlert(message, type = 'info') {
            const alertContainer = document.getElementById('alertContainer');
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} fade-in`;
            alertDiv.textContent = message;

            alertContainer.appendChild(alertDiv);

            // 3秒后自动移除
            setTimeout(() => {
                if (alertDiv.parentNode) {
                    alertDiv.parentNode.removeChild(alertDiv);
                }
            }, 3000);
        }
    </script>
</body>
</html>
