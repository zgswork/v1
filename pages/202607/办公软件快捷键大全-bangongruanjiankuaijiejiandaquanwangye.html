        .shortcuts-container {

            background: #2a5c2a;

            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            margin-right: 8px;
            margin-bottom: 8px;
        }
        
        .shortcut-description {

            color: #1a331a;
            margin-top: 10px;

        footer {

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 默认显示Windows快捷键
            displayShortcuts('windows');
            
            // 为所有类别按钮添加点击事件
            const categoryButtons = document.querySelectorAll('.category-btn');
            categoryButtons.forEach(button => {
                button.addEventListener('click', function() {
                    // 移除所有按钮的active类
                    categoryButtons.forEach(btn => btn.classList.remove('active'));
                    // 为当前点击的按钮添加active类
                    this.classList.add('active');
                    // 显示对应类别的快捷键
                    const category = this.getAttribute('data-category');
                    displayShortcuts(category);
                });
            });
            
            // 开发者按钮点击事件
            document.getElementById('developer-btn').addEventListener('click', function() {
                document.getElementById('developer-modal').style.display = 'block';
            });
            
            // 技术支持按钮点击事件
            document.getElementById('support-btn').addEventListener('click', function() {
                document.getElementById('support-modal').style.display = 'block';
            });
            
            // 关闭按钮点击事件
            const closeButtons = document.querySelectorAll('.close');
            closeButtons.forEach(button => {
                button.addEventListener('click', function() {
                    this.closest('.modal').style.display = 'none';
                });
            });
            
            // 点击模态框外部关闭
            const modals = document.querySelectorAll('.modal');
            modals.forEach(modal => {
                modal.addEventListener('click', function(e) {
                    if (e.target === this) {
                        this.style.display = 'none';
                    }
                });
            });
            
            // 复制链接按钮
            document.getElementById('copy-link-btn').addEventListener('click', function() {
                const link = 'https://t.zsxq.com/y1934';
                navigator.clipboard.writeText(link).then(function() {
                    alert('链接已复制到剪贴板！');
                }, function(err) {
                    // 如果复制失败，使用备用方法
                    const textArea = document.createElement('textarea');
                    textArea.value = link;
                    document.body.appendChild(textArea);
                    textArea.select();
                    try {
                        document.execCommand('copy');
                        alert('链接已复制到剪贴板！');
                    } catch (err) {
                        alert('复制失败，请手动复制：' + link);
                    }
                    document.body.removeChild(textArea);
                });
            });
        });

        // 显示指定类别的快捷键
        function displayShortcuts(category) {
            const shortcutsList = document.getElementById('shortcuts-list');
            const categoryName = document.getElementById('category-name');
            
            // 更新类别名称
            categoryName.textContent = getCategoryDisplayName(category);
            
            // 清空当前列表
            shortcutsList.innerHTML = '';
            
            // 添加新的快捷键项
            shortcutsData[category].forEach(shortcut => {
                const shortcutItem = document.createElement('div');
                shortcutItem.className = 'shortcut-item';
                
                // 处理快捷键键位显示（可能有多个键组合）
                const keys = shortcut.key.split(' + ');
                let keyHTML = '';
                keys.forEach((key, index) => {
                    if (index > 0) keyHTML += ' + ';
                    keyHTML += `<span class="shortcut-key">${key}</span>`;
                });
                
                shortcutItem.innerHTML = `
                    ${keyHTML}
                    <div class="shortcut-description">${shortcut.description}</div>
                `;
                
                shortcutsList.appendChild(shortcutItem);
            });
        }

        // 获取类别的显示名称
        function getCategoryDisplayName(category) {
            const names = {
                windows: 'Windows快捷键',
                macos: '苹果电脑快捷键',
                excel: 'Excel快捷键',
                word: 'Word快捷键',
                ppt: 'PPT快捷键',
                photoshop: 'Photoshop快捷键',
                jianying: '剪映快捷键'
            };
            return names[category] || category;
        }
