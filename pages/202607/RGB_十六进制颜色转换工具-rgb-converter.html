<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGB/十六进制颜色转换工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 48px;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 48px;
            color: #1d1d1f;
        }

        .converter-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
            align-items: start;
        }

        .input-section {
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: 600;
            color: #3a3a3c;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .rgb-inputs {
            display: flex;
            gap: 12px;
        }

        .rgb-input-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .rgb-input-item span {
            font-size: 12px;
            font-weight: 500;
            color: #6e6e73;
            text-align: center;
        }

        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            transition: all 0.2s ease;
            background: #fbfbfd;
        }

        input[type="number"]:focus, input[type="text"]:focus {
            outline: none;
            border-color: #007aff;
            background: white;
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
        }

        input[type="number"]:invalid, input[type="text"]:invalid {
            border-color: #ff3b30;
        }

        .hex-input-wrapper {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .hex-input-wrapper input[type="text"] {
            flex: 1;
            text-transform: uppercase;
        }

        input[type="color"] {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        input[type="color"]:hover {
            transform: scale(1.02);
        }

        .copy-btn {
            background: #007aff;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 36px;
            height: 36px;
        }

        .copy-btn:hover {
            background: #0056cc;
            transform: translateY(-1px);
        }

        .copy-btn:active {
            transform: translateY(0);
        }

        .copy-btn.copied {
            background: #34c759;
        }

        .preview-section {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .color-preview {
            width: 100%;
            height: 200px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .color-info {
            text-align: center;
            z-index: 1;
        }

        .color-info span {
            display: block;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            font-size: 18px;
            font-weight: 500;
            margin: 4px 0;
            transition: color 0.3s ease;
        }

        .contact-section {
            margin-top: 48px;
            padding: 24px;
            background: #f5f5f7;
            border-radius: 12px;
            text-align: center;
        }

        .contact-section h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1d1d1f;
        }

        .contact-info {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 32px;
            flex-wrap: wrap;
        }

        .contact-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .qr-code {
            width: 120px;
            height: 120px;
            border-radius: 8px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .qr-code img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .contact-label {
            font-size: 14px;
            color: #3a3a3c;
            font-weight: 500;
        }

        .contact-value {
            font-size: 13px;
            color: #007aff;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
        }

        @media (max-width: 768px) {
            .container {
                padding: 32px 24px;
                margin: 20px;
            }
            
            h1 {
                font-size: 24px;
                margin-bottom: 32px;
            }
            
            .converter-wrapper {
                grid-template-columns: 1fr;
                gap: 32px;
            }
            
            .rgb-inputs {
                flex-direction: column;
            }
            
            .color-preview {
                height: 150px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 0;
            }
            
            .container {
                border-radius: 0;
                box-shadow: none;
                min-height: 100vh;
                margin: 0;
                padding: 24px;
            }

            .contact-info {
                flex-direction: column;
                gap: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>RGB/十六进制颜色转换工具</h1>
        
        <div class="converter-wrapper">
            <div class="input-section">
                <div class="input-group">
                    <label>RGB 值</label>
                    <div class="rgb-inputs">
                        <div class="rgb-input-item">
                            <span>R</span>
                            <input type="number" id="r-input" min="0" max="255" value="255" placeholder="0-255">
                        </div>
                        <div class="rgb-input-item">
                            <span>G</span>
                            <input type="number" id="g-input" min="0" max="255" value="87" placeholder="0-255">
                        </div>
                        <div class="rgb-input-item">
                            <span>B</span>
                            <input type="number" id="b-input" min="0" max="255" value="51" placeholder="0-255">
                        </div>
                    </div>
                    <button class="copy-btn" id="copy-rgb" title="复制RGB值">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </button>
                </div>

                <div class="input-group">
                    <label>十六进制</label>
                    <div class="hex-input-wrapper">
                        <input type="text" id="hex-input" value="#FF5733" placeholder="#000000">
                        <button class="copy-btn" id="copy-hex" title="复制十六进制值">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="input-group">
                    <label>颜色选择器</label>
                    <input type="color" id="color-picker" value="#FF5733">
                </div>
            </div>

            <div class="preview-section">
                <div class="color-preview" id="color-preview">
                    <div class="color-info">
                        <span id="preview-hex">#FF5733</span>
                        <span id="preview-rgb">rgb(255, 87, 51)</span>
                    </div>
                </div>
            </div>
        </div>

    <script>
        class ColorConverter {
            constructor() {
                this.rInput = document.getElementById('r-input');
                this.gInput = document.getElementById('g-input');
                this.bInput = document.getElementById('b-input');
                this.hexInput = document.getElementById('hex-input');
                this.colorPicker = document.getElementById('color-picker');
                this.colorPreview = document.getElementById('color-preview');
                this.previewHex = document.getElementById('preview-hex');
                this.previewRgb = document.getElementById('preview-rgb');
                this.copyRgbBtn = document.getElementById('copy-rgb');
                this.copyHexBtn = document.getElementById('copy-hex');

                this.init();
            }

            init() {
                this.bindEvents();
                this.updateFromRgb();
            }

            bindEvents() {
                this.rInput.addEventListener('input', () => this.handleRgbInput());
                this.gInput.addEventListener('input', () => this.handleRgbInput());
                this.bInput.addEventListener('input', () => this.handleRgbInput());
                this.hexInput.addEventListener('input', () => this.handleHexInput());
                this.colorPicker.addEventListener('input', () => this.handleColorPicker());
                this.copyRgbBtn.addEventListener('click', () => this.copyToClipboard('rgb'));
                this.copyHexBtn.addEventListener('click', () => this.copyToClipboard('hex'));

                [this.rInput, this.gInput, this.bInput].forEach(input => {
                    input.addEventListener('blur', () => this.validateRgbInput(input));
                });
            }

            handleRgbInput() {
                this.validateRgbInputs();
                this.updateFromRgb();
            }

            handleHexInput() {
                this.validateHexInput();
                this.updateFromHex();
            }

            handleColorPicker() {
                const color = this.colorPicker.value;
                this.hexInput.value = color.toUpperCase();
                this.updateFromHex();
            }

            validateRgbInputs() {
                [this.rInput, this.gInput, this.bInput].forEach(input => {
                    this.validateRgbInput(input);
                });
            }

            validateRgbInput(input) {
                let value = parseInt(input.value);
                if (isNaN(value)) {
                    value = 0;
                }
                value = Math.max(0, Math.min(255, value));
                input.value = value;
            }

            validateHexInput() {
                let hex = this.hexInput.value.trim();
                
                if (hex.startsWith('#')) {
                    hex = hex.slice(1);
                }
                
                hex = hex.replace(/[^0-9A-Fa-f]/g, '');
                
                if (hex.length === 3) {
                    hex = hex.split('').map(char => char + char).join('');
                }
                
                if (hex.length === 6) {
                    this.hexInput.value = '#' + hex.toUpperCase();
                } else if (hex.length > 0) {
                    this.hexInput.value = '#' + hex.slice(0, 6).toUpperCase();
                }
            }

            updateFromRgb() {
                const r = parseInt(this.rInput.value) || 0;
                const g = parseInt(this.gInput.value) || 0;
                const b = parseInt(this.bInput.value) || 0;
                
                const hex = this.rgbToHex(r, g, b);
                this.hexInput.value = hex;
                this.colorPicker.value = hex;
                
                this.updatePreview(r, g, b, hex);
            }

            updateFromHex() {
                let hex = this.hexInput.value.trim();
                
                if (hex.startsWith('#')) {
                    hex = hex.slice(1);
                }
                
                if (hex.length === 6) {
                    const rgb = this.hexToRgb(hex);
                    if (rgb) {
                        this.rInput.value = rgb.r;
                        this.gInput.value = rgb.g;
                        this.bInput.value = rgb.b;
                        this.colorPicker.value = '#' + hex;
                        this.updatePreview(rgb.r, rgb.g, rgb.b, '#' + hex);
                    }
                }
            }

            rgbToHex(r, g, b) {
                const toHex = (n) => {
                    const hex = Math.round(n).toString(16);
                    return hex.length === 1 ? '0' + hex : hex;
                };
                return '#' + toHex(r) + toHex(g) + toHex(b);
            }

            hexToRgb(hex) {
                const result = /^([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? {
                    r: parseInt(result[1], 16),
                    g: parseInt(result[2], 16),
                    b: parseInt(result[3], 16)
                } : null;
            }

            updatePreview(r, g, b, hex) {
                const color = `rgb(${r}, ${g}, ${b})`;
                this.colorPreview.style.backgroundColor = color;
                this.previewHex.textContent = hex.toUpperCase();
                this.previewRgb.textContent = color;
                
                const textColor = this.getContrastColor(r, g, b);
                this.previewHex.style.color = textColor;
                this.previewRgb.style.color = textColor;
            }

            getContrastColor(r, g, b) {
                const brightness = (r * 299 + g * 587 + b * 114) / 1000;
                return brightness > 128 ? '#000000' : '#ffffff';
            }

            async copyToClipboard(type) {
                let textToCopy = '';
                let button = null;

                if (type === 'rgb') {
                    const r = parseInt(this.rInput.value) || 0;
                    const g = parseInt(this.gInput.value) || 0;
                    const b = parseInt(this.bInput.value) || 0;
                    textToCopy = `rgb(${r}, ${g}, ${b})`;
                    button = this.copyRgbBtn;
                } else if (type === 'hex') {
                    textToCopy = this.hexInput.value.toUpperCase();
                    button = this.copyHexBtn;
                }

                try {
                    await navigator.clipboard.writeText(textToCopy);
                    this.showCopyFeedback(button);
                } catch (err) {
                    console.error('Failed to copy: ', err);
                    this.fallbackCopy(textToCopy);
                    this.showCopyFeedback(button);
                }
            }

            fallbackCopy(text) {
                const textArea = document.createElement('textarea');
                textArea.value = text;
                textArea.style.position = 'fixed';
                textArea.style.left = '-9999px';
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                
                try {
                    document.execCommand('copy');
                } catch (err) {
                    console.error('Fallback copy failed: ', err);
                }
                
                document.body.removeChild(textArea);
            }

            showCopyFeedback(button) {
                const originalContent = button.innerHTML;
                button.classList.add('copied');
                button.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>';
                
                setTimeout(() => {
                    button.classList.remove('copied');
                    button.innerHTML = originalContent;
                }, 1500);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new ColorConverter();
        });
    </script>
</body>
</html>
