            const numberOfPeople = parseInt(numberOfPeopleInput.value);

            // 确定人数范围
            let peopleRange;
            if (numberOfPeople >= 2 && numberOfPeople <= 4) {

                peopleRange = '5-8';
            } else {
                peopleRange = '9+';

            // 获取符合条件的游戏列表

            // 显示结果
            displayResult(selectedGame, numberOfPeople, occasion);

                    <h3 class="text-3xl font-bold text-secondary mb-2">${game.name}</h3>
                    <div class="flex flex-wrap gap-3 mt-3">
                        <span class="bg-primary/10 text-primary px-3 py-1 rounded-full text-sm flex items-center">
                            <i class="fa fa-users mr-1"></i> ${peopleCount}人
                        </span>
                        <span class="bg-secondary/10 text-secondary px-3 py-1 rounded-full text-sm flex items-center">
                            <i class="fa fa-glass mr-1"></i> ${occasion}
                        </span>
                        ${game.isExciting ? `
                        <span class="bg-accent/10 text-accent px-3 py-1 rounded-full text-sm flex items-center">
                            <i class="fa fa-bolt mr-1"></i> 刺激推荐
                        </span>
                        ` : ''}
                    </div>
                </div>
                
                <div>
                    <h4 class="text-xl font-semibold text-gray-700 mb-3 flex items-center">
                        <i class="fa fa-book text-primary mr-2"></i> 游戏规则
                    </h4>
                    <p class="text-gray-600 leading-relaxed">${game.rules}</p>
                </div>
            `;
        }

        // 事件监听
        gameForm.addEventListener('submit', function(e) {
            e.preventDefault();
            recommendGame();
        });

        recommendAgainBtn.addEventListener('click', recommendGame);

        // 添加简单的动画定义
        document.head.insertAdjacentHTML('beforeend', `
            <style>
                @keyframes fadeIn {
                    from { opacity: 0; transform: translateY(10px); }
                    to { opacity: 1; transform: translateY(0); }
                }
                .animate-fade-in {
                    animation: fadeIn 0.5s ease-out forwards;
                }
            </style>
        `);
    </script>
</body>
</html>
