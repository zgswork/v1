<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git命令助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            font-weight: 300;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            display: grid;
            grid-template-columns: 350px 1fr;
            height: calc(100vh - 200px);
        }

        .sidebar {
            background: #f8f9fa;
            border-right: 2px solid #e1e5e9;
            padding: 30px;
            overflow-y: auto;
        }

        .main-panel {
            padding: 30px;
            overflow-y: auto;
        }

        .section-title {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 12px 15px 12px 40px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
        }

        .category-list {
            list-style: none;
        }

        .category-item {
            margin-bottom: 8px;
        }

        .category-link {
            display: block;
            padding: 12px 15px;
            background: white;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            text-decoration: none;
            color: #495057;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .category-link:hover {
            border-color: #667eea;
            background: #f0f4ff;
            transform: translateX(5px);
        }

        .category-link.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .command-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }

        .command-card {
            background: white;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .command-card:hover {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .command-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .command-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .command-category {
            background: #667eea;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75em;
            text-transform: uppercase;
            font-weight: 600;
        }

        .command-description {
            color: #6c757d;
            font-size: 0.9em;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .command-code {
            background: #f8f9fa;
            border: 1px solid #e1e5e9;
            border-radius: 8px;
            padding: 12px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.85em;
            color: #333;
            margin-bottom: 15px;
            position: relative;
            overflow-x: auto;
        }

        .command-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8em;
            transition: all 0.3s ease;
        }

        .copy-btn {
            background: #17a2b8;
            color: white;
        }

        .copy-btn:hover {
            background: #138496;
        }

        .explain-btn {
            background: #28a745;
            color: white;
        }

        .explain-btn:hover {
            background: #218838;
        }

        .example-btn {
            background: #ffc107;
            color: #212529;
        }

        .example-btn:hover {
            background: #e0a800;
        }

        .command-explanation {
            background: #e8f5e8;
            border: 1px solid #c3e6c3;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            display: none;
        }

        .command-explanation.show {
            display: block;
        }

        .explanation-title {
            font-weight: 600;
            color: #155724;
            margin-bottom: 10px;
        }

        .explanation-content {
            color: #155724;
            font-size: 0.9em;
            line-height: 1.5;
        }

        .command-examples {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            display: none;
        }

        .command-examples.show {
            display: block;
        }

        .examples-title {
            font-weight: 600;
            color: #856404;
            margin-bottom: 10px;
        }

        .example-item {
            margin-bottom: 10px;
        }

        .example-code {
            background: #f8f9fa;
            border: 1px solid #e1e5e9;
            border-radius: 4px;
            padding: 8px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.8em;
            color: #333;
            margin-bottom: 5px;
        }

        .example-desc {
            color: #856404;
            font-size: 0.85em;
        }

        .quick-actions {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .quick-title {
            font-weight: 600;
            color: #495057;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .quick-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }

        .quick-btn {
            padding: 10px 15px;
            background: white;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85em;
            text-align: center;
            transition: all 0.3s ease;
        }

        .quick-btn:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transform: translateX(400px);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.error {
            background: #dc3545;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2em;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .theme-toggle:hover {
            background: rgba(255,255,255,0.3);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 400px;
            color: #6c757d;
            text-align: center;
        }

        .empty-icon {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-title {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .empty-description {
            font-size: 0.9em;
            line-height: 1.5;
        }

        /* 暗色主题 */
        .dark-theme {
            background: #1a1a1a;
            color: #e1e1e1;
        }

        .dark-theme .container {
            background: #2d2d2d;
        }

        .dark-theme .sidebar {
            background: #3a3a3a;
            border-color: #555;
        }

        .dark-theme .search-input {
            background: #4a4a4a;
            border-color: #555;
            color: #e1e1e1;
        }

        .dark-theme .category-link {
            background: #4a4a4a;
            border-color: #555;
            color: #e1e1e1;
        }

        .dark-theme .category-link:hover {
            background: #3a4a5a;
        }

        .dark-theme .command-card {
            background: #4a4a4a;
            border-color: #555;
        }

        .dark-theme .command-code,
        .dark-theme .example-code {
            background: #3a3a3a;
            border-color: #555;
            color: #e1e1e1;
        }

        .dark-theme .quick-actions {
            background: #3a3a3a;
        }

        .dark-theme .quick-btn {
            background: #4a4a4a;
            border-color: #555;
            color: #e1e1e1;
        }

        .dark-theme .quick-btn:hover {
            background: #3a4a5a;
        }

        .dark-theme .section-title,
        .dark-theme .command-title,
        .dark-theme .quick-title {
            color: #e1e1e1;
        }

        /* 响应式设计 */
        @media (max-width: 1024px) {
            .content {
                grid-template-columns: 1fr;
                height: auto;
            }

            .sidebar {
                border-right: none;
                border-bottom: 2px solid #e1e5e9;
                max-height: 300px;
            }

            .command-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 2em;
            }

            .sidebar,
            .main-panel {
                padding: 20px;
            }

            .quick-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" title="切换主题">🌙</button>
    
    <div class="container">
        <div class="header">
            <h1>Git命令助手</h1>
            <p>快速查找和学习Git命令，提高开发效率</p>
        </div>

        <div class="content">
            <div class="sidebar">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" id="searchInput" placeholder="搜索Git命令..." oninput="filterCommands()">
                </div>
                
                <h3 class="section-title">命令分类</h3>
                <ul class="category-list" id="categoryList">
                    <li class="category-item">
                        <a class="category-link active" data-category="all" onclick="filterByCategory('all', this)">全部命令</a>
                    </li>
                    <li class="category-item">
                        <a class="category-link" data-category="basic" onclick="filterByCategory('basic', this)">基础操作</a>
                    </li>
                    <li class="category-item">
                        <a class="category-link" data-category="branch" onclick="filterByCategory('branch', this)">分支管理</a>
                    </li>
                    <li class="category-item">
                        <a class="category-link" data-category="remote" onclick="filterByCategory('remote', this)">远程仓库</a>
                    </li>
                    <li class="category-item">
                        <a class="category-link" data-category="history" onclick="filterByCategory('history', this)">历史查看</a>
                    </li>
                    <li class="category-item">
                        <a class="category-link" data-category="stash" onclick="filterByCategory('stash', this)">暂存管理</a>
                    </li>
                    <li class="category-item">
                        <a class="category-link" data-category="config" onclick="filterByCategory('config', this)">配置设置</a>
                    </li>
                    <li class="category-item">
                        <a class="category-link" data-category="advanced" onclick="filterByCategory('advanced', this)">高级操作</a>
                    </li>
                </ul>
            </div>

            <div class="main-panel">
                <div class="quick-actions">
                    <div class="quick-title">快速操作</div>
                    <div class="quick-buttons">
                        <button class="quick-btn" onclick="showQuickCommand('git status')">查看状态</button>
                        <button class="quick-btn" onclick="showQuickCommand('git add .')">添加所有文件</button>
                        <button class="quick-btn" onclick="showQuickCommand('git commit -m')">提交更改</button>
                        <button class="quick-btn" onclick="showQuickCommand('git push')">推送到远程</button>
                        <button class="quick-btn" onclick="showQuickCommand('git pull')">拉取更新</button>
                        <button class="quick-btn" onclick="showQuickCommand('git branch')">查看分支</button>
                    </div>
                </div>
                
                <div class="command-grid" id="commandGrid">
                    <!-- 命令卡片将在这里动态生成 -->
                </div>
                
                <div class="empty-state" id="emptyState" style="display: none;">
                    <div class="empty-icon">🔍</div>
                    <div class="empty-title">未找到匹配的命令</div>
                    <div class="empty-description">尝试使用不同的关键词搜索，或浏览不同的命令分类</div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">操作成功！</div>

    <script>
        let isDarkTheme = false;
        let currentCategory = 'all';
        let searchTerm = '';

        // Git命令数据
        const gitCommands = [
            // 基础操作
            {
                title: 'git init',
                category: 'basic',
                description: '初始化一个新的Git仓库',
                command: 'git init',
                explanation: '在当前目录创建一个新的Git仓库。这会创建一个.git子目录，包含所有必要的仓库文件。',
                examples: [
                    { code: 'git init', desc: '在当前目录初始化仓库' },
                    { code: 'git init my-project', desc: '创建名为my-project的目录并初始化仓库' }
                ]
            },
            {
                title: 'git clone',
                category: 'basic',
                description: '克隆远程仓库到本地',
                command: 'git clone <repository-url>',
                explanation: '从远程仓库创建一个本地副本，包括所有文件、分支和提交历史。',
                examples: [
                    { code: 'git clone https://github.com/user/repo.git', desc: '克隆GitHub仓库' },
                    { code: 'git clone https://github.com/user/repo.git my-folder', desc: '克隆到指定文件夹' }
                ]
            },
            {
                title: 'git status',
                category: 'basic',
                description: '查看工作区和暂存区的状态',
                command: 'git status',
                explanation: '显示工作目录的状态，包括已修改、已暂存和未跟踪的文件。',
                examples: [
                    { code: 'git status', desc: '查看详细状态' },
                    { code: 'git status -s', desc: '查看简短状态' }
                ]
            },
            {
                title: 'git add',
                category: 'basic',
                description: '将文件添加到暂存区',
                command: 'git add <file>',
                explanation: '将工作目录中的更改添加到暂存区，准备进行提交。',
                examples: [
                    { code: 'git add file.txt', desc: '添加单个文件' },
                    { code: 'git add .', desc: '添加所有文件' },
                    { code: 'git add *.js', desc: '添加所有JS文件' }
                ]
            },
            {
                title: 'git commit',
                category: 'basic',
                description: '提交暂存区的更改',
                command: 'git commit -m "message"',
                explanation: '将暂存区的更改保存到仓库历史中，并添加描述性消息。',
                examples: [
                    { code: 'git commit -m "Add new feature"', desc: '提交并添加消息' },
                    { code: 'git commit -am "Fix bug"', desc: '添加所有已跟踪文件并提交' }
                ]
            },
            
            // 分支管理
            {
                title: 'git branch',
                category: 'branch',
                description: '查看、创建或删除分支',
                command: 'git branch',
                explanation: '管理Git分支，包括查看现有分支、创建新分支或删除分支。',
                examples: [
                    { code: 'git branch', desc: '查看所有本地分支' },
                    { code: 'git branch new-feature', desc: '创建新分支' },
                    { code: 'git branch -d old-branch', desc: '删除分支' }
                ]
            },
            {
                title: 'git checkout',
                category: 'branch',
                description: '切换分支或恢复文件',
                command: 'git checkout <branch>',
                explanation: '切换到指定分支，或者恢复工作目录中的文件到特定状态。',
                examples: [
                    { code: 'git checkout main', desc: '切换到main分支' },
                    { code: 'git checkout -b new-branch', desc: '创建并切换到新分支' },
                    { code: 'git checkout -- file.txt', desc: '恢复文件到最后提交状态' }
                ]
            },
            {
                title: 'git merge',
                category: 'branch',
                description: '合并分支',
                command: 'git merge <branch>',
                explanation: '将指定分支的更改合并到当前分支中。',
                examples: [
                    { code: 'git merge feature-branch', desc: '合并feature分支到当前分支' },
                    { code: 'git merge --no-ff feature', desc: '强制创建合并提交' }
                ]
            },
            
            // 远程仓库
            {
                title: 'git remote',
                category: 'remote',
                description: '管理远程仓库',
                command: 'git remote',
                explanation: '查看、添加、删除或重命名远程仓库连接。',
                examples: [
                    { code: 'git remote -v', desc: '查看所有远程仓库' },
                    { code: 'git remote add origin <url>', desc: '添加远程仓库' },
                    { code: 'git remote remove origin', desc: '删除远程仓库' }
                ]
            },
            {
                title: 'git push',
                category: 'remote',
                description: '推送本地更改到远程仓库',
                command: 'git push',
                explanation: '将本地提交推送到远程仓库，与其他开发者共享更改。',
                examples: [
                    { code: 'git push', desc: '推送当前分支' },
                    { code: 'git push origin main', desc: '推送main分支到origin' },
                    { code: 'git push -u origin feature', desc: '推送并设置上游分支' }
                ]
            },
            {
                title: 'git pull',
                category: 'remote',
                description: '从远程仓库拉取并合并更改',
                command: 'git pull',
                explanation: '从远程仓库获取最新更改并自动合并到当前分支。',
                examples: [
                    { code: 'git pull', desc: '拉取当前分支的更新' },
                    { code: 'git pull origin main', desc: '从origin拉取main分支' },
                    { code: 'git pull --rebase', desc: '使用rebase方式拉取' }
                ]
            },
            {
                title: 'git fetch',
                category: 'remote',
                description: '从远程仓库获取更改但不合并',
                command: 'git fetch',
                explanation: '下载远程仓库的最新更改，但不自动合并到当前分支。',
                examples: [
                    { code: 'git fetch', desc: '获取所有远程更新' },
                    { code: 'git fetch origin', desc: '从origin获取更新' },
                    { code: 'git fetch --all', desc: '从所有远程仓库获取更新' }
                ]
            },
            
            // 历史查看
            {
                title: 'git log',
                category: 'history',
                description: '查看提交历史',
                command: 'git log',
                explanation: '显示仓库的提交历史，包括提交消息、作者和时间戳。',
                examples: [
                    { code: 'git log', desc: '查看完整提交历史' },
                    { code: 'git log --oneline', desc: '查看简洁的提交历史' },
                    { code: 'git log --graph', desc: '以图形方式显示分支历史' }
                ]
            },
            {
                title: 'git diff',
                category: 'history',
                description: '查看文件差异',
                command: 'git diff',
                explanation: '显示工作目录、暂存区或不同提交之间的文件差异。',
                examples: [
                    { code: 'git diff', desc: '查看工作目录与暂存区的差异' },
                    { code: 'git diff --staged', desc: '查看暂存区与最后提交的差异' },
                    { code: 'git diff HEAD~1', desc: '与上一个提交比较' }
                ]
            },
            {
                title: 'git show',
                category: 'history',
                description: '显示提交的详细信息',
                command: 'git show <commit>',
                explanation: '显示指定提交的详细信息，包括更改的文件和内容。',
                examples: [
                    { code: 'git show', desc: '显示最新提交的详情' },
                    { code: 'git show HEAD~2', desc: '显示倒数第三个提交' },
                    { code: 'git show --stat', desc: '只显示文件统计信息' }
                ]
            },
            
            // 暂存管理
            {
                title: 'git stash',
                category: 'stash',
                description: '暂存当前工作进度',
                command: 'git stash',
                explanation: '临时保存当前工作目录的更改，以便快速切换到其他任务。',
                examples: [
                    { code: 'git stash', desc: '暂存当前更改' },
                    { code: 'git stash save "work in progress"', desc: '带消息暂存' },
                    { code: 'git stash -u', desc: '包括未跟踪文件一起暂存' }
                ]
            },
            {
                title: 'git stash pop',
                category: 'stash',
                description: '恢复最近的暂存',
                command: 'git stash pop',
                explanation: '恢复最近暂存的更改并从暂存列表中删除。',
                examples: [
                    { code: 'git stash pop', desc: '恢复最新暂存' },
                    { code: 'git stash pop stash@{1}', desc: '恢复指定暂存' }
                ]
            },
            {
                title: 'git stash list',
                category: 'stash',
                description: '查看所有暂存',
                command: 'git stash list',
                explanation: '显示所有已保存的暂存列表。',
                examples: [
                    { code: 'git stash list', desc: '查看暂存列表' },
                    { code: 'git stash show', desc: '显示最新暂存的统计' }
                ]
            },
            
            // 配置设置
            {
                title: 'git config',
                category: 'config',
                description: '配置Git设置',
                command: 'git config',
                explanation: '设置Git的配置选项，如用户信息、编辑器、别名等。',
                examples: [
                    { code: 'git config --global user.name "Your Name"', desc: '设置全局用户名' },
                    { code: 'git config --global user.email "email@example.com"', desc: '设置全局邮箱' },
                    { code: 'git config --list', desc: '查看所有配置' }
                ]
            },
            
            // 高级操作
            {
                title: 'git rebase',
                category: 'advanced',
                description: '重新应用提交到另一个基础上',
                command: 'git rebase <branch>',
                explanation: '将当前分支的提交重新应用到指定分支的顶部，创建线性历史。',
                examples: [
                    { code: 'git rebase main', desc: '将当前分支rebase到main' },
                    { code: 'git rebase -i HEAD~3', desc: '交互式rebase最近3个提交' }
                ]
            },
            {
                title: 'git reset',
                category: 'advanced',
                description: '重置当前分支到指定状态',
                command: 'git reset',
                explanation: '将当前分支重置到指定提交，可以选择保留或丢弃工作目录的更改。',
                examples: [
                    { code: 'git reset --soft HEAD~1', desc: '软重置，保留更改在暂存区' },
                    { code: 'git reset --hard HEAD~1', desc: '硬重置，丢弃所有更改' },
                    { code: 'git reset HEAD file.txt', desc: '从暂存区移除文件' }
                ]
            },
            {
                title: 'git cherry-pick',
                category: 'advanced',
                description: '选择性地应用某个提交',
                command: 'git cherry-pick <commit>',
                explanation: '将指定提交的更改应用到当前分支，而不合并整个分支。',
                examples: [
                    { code: 'git cherry-pick abc123', desc: '应用指定提交' },
                    { code: 'git cherry-pick -n abc123', desc: '应用但不自动提交' }
                ]
            }
        ];

        let filteredCommands = [...gitCommands];

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            renderCommands();
            restoreTheme();
        });

        // 渲染命令卡片
        function renderCommands() {
            const grid = document.getElementById('commandGrid');
            const emptyState = document.getElementById('emptyState');
            
            if (filteredCommands.length === 0) {
                grid.style.display = 'none';
                emptyState.style.display = 'flex';
                return;
            }
            
            grid.style.display = 'grid';
            emptyState.style.display = 'none';
            
            grid.innerHTML = filteredCommands.map((cmd, index) => `
                <div class="command-card">
                    <div class="command-header">
                        <div>
                            <div class="command-title">${cmd.title}</div>
                        </div>
                        <div class="command-category">${getCategoryName(cmd.category)}</div>
                    </div>
                    <div class="command-description">${cmd.description}</div>
                    <div class="command-code">${cmd.command}</div>
                    <div class="command-actions">
                        <button class="action-btn copy-btn" onclick="copyCommand('${cmd.command}')">
                            📋 复制
                        </button>
                        <button class="action-btn explain-btn" onclick="toggleExplanation(${index})">
                            💡 说明
                        </button>
                        <button class="action-btn example-btn" onclick="toggleExamples(${index})">
                            📚 示例
                        </button>
                    </div>
                    <div class="command-explanation" id="explanation-${index}">
                        <div class="explanation-title">命令说明</div>
                        <div class="explanation-content">${cmd.explanation}</div>
                    </div>
                    <div class="command-examples" id="examples-${index}">
                        <div class="examples-title">使用示例</div>
                        ${cmd.examples.map(example => `
                            <div class="example-item">
                                <div class="example-code">${example.code}</div>
                                <div class="example-desc">${example.desc}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        // 获取分类名称
        function getCategoryName(category) {
            const names = {
                'basic': '基础',
                'branch': '分支',
                'remote': '远程',
                'history': '历史',
                'stash': '暂存',
                'config': '配置',
                'advanced': '高级'
            };
            return names[category] || category;
        }

        // 按分类过滤
        function filterByCategory(category, element) {
            currentCategory = category;
            
            // 更新活动状态
            document.querySelectorAll('.category-link').forEach(link => {
                link.classList.remove('active');
            });
            element.classList.add('active');
            
            applyFilters();
        }

        // 搜索过滤
        function filterCommands() {
            searchTerm = document.getElementById('searchInput').value.toLowerCase();
            applyFilters();
        }

        // 应用过滤器
        function applyFilters() {
            filteredCommands = gitCommands.filter(cmd => {
                const matchesCategory = currentCategory === 'all' || cmd.category === currentCategory;
                const matchesSearch = !searchTerm || 
                    cmd.title.toLowerCase().includes(searchTerm) ||
                    cmd.description.toLowerCase().includes(searchTerm) ||
                    cmd.command.toLowerCase().includes(searchTerm);
                
                return matchesCategory && matchesSearch;
            });
            
            renderCommands();
        }

        // 显示快速命令
        function showQuickCommand(command) {
            copyCommand(command);
            showToast(`已复制命令: ${command}`);
        }

        // 复制命令
        function copyCommand(command) {
            navigator.clipboard.writeText(command).then(() => {
                showToast('命令已复制到剪贴板！');
            }).catch(() => {
                // 降级方案
                const textarea = document.createElement('textarea');
                textarea.value = command;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('命令已复制到剪贴板！');
            });
        }

        // 切换说明显示
        function toggleExplanation(index) {
            const explanation = document.getElementById(`explanation-${index}`);
            const examples = document.getElementById(`examples-${index}`);
            
            // 隐藏示例
            examples.classList.remove('show');
            
            // 切换说明
            explanation.classList.toggle('show');
        }

        // 切换示例显示
        function toggleExamples(index) {
            const explanation = document.getElementById(`explanation-${index}`);
            const examples = document.getElementById(`examples-${index}`);
            
            // 隐藏说明
            explanation.classList.remove('show');
            
            // 切换示例
            examples.classList.toggle('show');
        }

        // 显示提示消息
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // 切换主题
        function toggleTheme() {
            isDarkTheme = !isDarkTheme;
            const body = document.body;
            const button = document.querySelector('.theme-toggle');
            
            if (isDarkTheme) {
                body.classList.add('dark-theme');
                button.textContent = '☀️';
                button.title = '切换到亮色主题';
            } else {
                body.classList.remove('dark-theme');
                button.textContent = '🌙';
                button.title = '切换到暗色主题';
            }
            
            localStorage.setItem('git-helper-theme', isDarkTheme ? 'dark' : 'light');
        }

        // 恢复主题设置
        function restoreTheme() {
            const savedTheme = localStorage.getItem('git-helper-theme');
            if (savedTheme === 'dark') {
                toggleTheme();
            }
        }
    </script>
</body>
</html>
