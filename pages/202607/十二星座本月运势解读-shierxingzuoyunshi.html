        // 获取当前月份(0-11)
        function getCurrentMonth() {
            return new Date().getMonth();
        }

        // 生成运势报告
        function generateReport() {
            const zodiacSelect = document.getElementById('zodiac');
            const selectedZodiac = zodiacSelect.value;
            
            if (!selectedZodiac) {
                alert('请先选择你的星座');
                return;
            }
            
            const currentMonth = getCurrentMonth();
            const report = zodiacData[selectedZodiac][currentMonth];
            
            // 更新卡片内容
            document.getElementById('card-title').textContent = `${selectedZodiac} ${currentMonth + 1}月运势`;
            document.getElementById('card-subtitle').textContent = '为你解读本月的情感、事业与健康走向';
            document.getElementById('love-content').textContent = report.love;
            document.getElementById('career-content').textContent = report.career;
            document.getElementById('health-content').textContent = report.health;
            
            // 显示卡片
            const resultCard = document.getElementById('result-card');
            resultCard.classList.add('show');
            
            // 滚动到卡片位置
            resultCard.scrollIntoView({ behavior: 'smooth' });
        }

        // 导出卡片为图片
        function exportCard() {
            const card = document.getElementById('result-card');
            
            if (!card.classList.contains('show')) {
                alert('请先生成运势报告');
                return;
            }
            
            html2canvas(card).then(canvas => {
                const link = document.createElement('a');
                link.download = `${document.getElementById('card-title').textContent}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        // 事件监听
        document.getElementById('generate-btn').addEventListener('click', generateReport);
        document.getElementById('export-btn').addEventListener('click', exportCard);
