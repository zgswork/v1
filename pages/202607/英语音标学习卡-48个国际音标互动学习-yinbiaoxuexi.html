<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英语音标学习卡 - 48个国际音标互动学习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
        }

        .filter-btn {
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            backdrop-filter: blur(10px);
        }

        .filter-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: rgba(255,255,255,0.9);
            color: #667eea;
            font-weight: bold;
        }

        .phonetic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .phonetic-card {
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .phonetic-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
        }

        .phonetic-symbol {
            font-size: 3em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
            font-family: 'Times New Roman', serif;
        }

        .phonetic-type {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 15px;
            display: inline-block;
        }

        .example-word {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .example-meaning {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .play-btn {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            margin: 5px;
        }

        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .progress-bar {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            color: white;
        }

        .progress-fill {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            height: 10px;
            border-radius: 5px;
            transition: width 0.3s ease;
            margin: 10px 0;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }

        .stat-item {
            background: rgba(255,255,255,0.2);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            color: white;
            backdrop-filter: blur(10px);
            min-width: 150px;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .hidden {
            display: none;
        }

        /* 底部备注样式 */
        .footer {
            margin-top: 50px;
            padding: 30px 20px;
            text-align: center;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            color: white;
        }

        .footer p {
            margin: 8px 0;
            font-size: 14px;
            opacity: 0.9;
        }

        .footer p:first-child {
            font-weight: bold;
            font-size: 16px;
        }

        /* 响应式设计优化 */
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .header p {
                font-size: 1em;
            }
            
            .controls {
                gap: 8px;
            }
            
            .filter-btn {
                padding: 8px 16px;
                font-size: 12px;
            }
            
            .phonetic-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 15px;
            }
            
            .phonetic-card {
                padding: 20px;
            }
            
            .phonetic-symbol {
                font-size: 2.5em;
            }
            
            .stats {
                gap: 15px;
            }
            
            .stat-item {
                min-width: 120px;
                padding: 15px;
            }
            
            .footer {
                margin-top: 30px;
                padding: 20px 15px;
            }
            
            .footer p {
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
            
            .filter-btn {
                padding: 6px 12px;
                font-size: 11px;
            }
            
            .phonetic-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            
            .phonetic-card {
                padding: 18px;
            }
            
            .phonetic-symbol {
                font-size: 2.2em;
            }
            
            .play-btn {
                padding: 8px 16px;
                font-size: 12px;
                margin: 3px;
            }
            
            .stats {
                flex-direction: column;
                gap: 10px;
            }
            
            .stat-item {
                min-width: auto;
                width: 100%;
            }
            
            .footer p {
                font-size: 12px;
                margin: 6px 0;
            }
        }

        @media (min-width: 1200px) {
            .phonetic-grid {
                grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 英语音标学习卡</h1>
            <p>掌握48个国际音标，提升英语发音水平</p>
        </div>

        <div class="progress-bar">
            <div>学习进度</div>
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            <div id="progressText">0 / 48 已学习</div>
        </div>

        <div class="controls">
            <button class="filter-btn active" data-filter="all">全部音标</button>
            <button class="filter-btn" data-filter="vowel">元音 (20个)</button>
            <button class="filter-btn" data-filter="consonant">辅音 (28个)</button>
            <button class="filter-btn" data-filter="monophthong">单元音</button>
            <button class="filter-btn" data-filter="diphthong">双元音</button>
            <button class="filter-btn" data-filter="voiceless">清辅音</button>
            <button class="filter-btn" data-filter="voiced">浊辅音</button>
        </div>

        <div class="phonetic-grid" id="phoneticGrid">
            <!-- 音标卡片将通过JavaScript动态生成 -->
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-number" id="totalLearned">0</div>
                <div>已学习</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="totalVowels">20</div>
                <div>元音</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="totalConsonants">28</div>
                <div>辅音</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="accuracy">0%</div>
                <div>掌握度</div>
            </div>
        </div>

        <!-- 底部备注信息 -->
        <div class="footer">
            <p>本工具由杨天蛇制作</p>
            <p>微信：84131868</p>
            <p>QQ邮箱：<a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="1b232f2a282a232d235b6a6a35787476">[email&#160;protected]</a></p>
            <p>Gmail: <a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="9df9f6fbf4f1f8adadacddfaf0fcf4f1b3fef2f0">[email&#160;protected]</a></p>
        </div>
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 48个国际音标数据
        const phoneticData = [
            // 单元音 - 前元音
            { symbol: '/iː/', type: 'vowel', subtype: 'monophthong', category: '前元音', example: 'sheep', meaning: '羊', learned: false },
            { symbol: '/ɪ/', type: 'vowel', subtype: 'monophthong', category: '前元音', example: 'sit', meaning: '坐', learned: false },
            { symbol: '/e/', type: 'vowel', subtype: 'monophthong', category: '前元音', example: 'pen', meaning: '钢笔', learned: false },
            { symbol: '/æ/', type: 'vowel', subtype: 'monophthong', category: '前元音', example: 'cat', meaning: '猫', learned: false },
            
            // 单元音 - 中元音
            { symbol: '/ɜː/', type: 'vowel', subtype: 'monophthong', category: '中元音', example: 'bird', meaning: '鸟', learned: false },
            { symbol: '/ə/', type: 'vowel', subtype: 'monophthong', category: '中元音', example: 'about', meaning: '关于', learned: false },
            { symbol: '/ʌ/', type: 'vowel', subtype: 'monophthong', category: '中元音', example: 'cup', meaning: '杯子', learned: false },
            
            // 单元音 - 后元音
            { symbol: '/uː/', type: 'vowel', subtype: 'monophthong', category: '后元音', example: 'moon', meaning: '月亮', learned: false },
            { symbol: '/ʊ/', type: 'vowel', subtype: 'monophthong', category: '后元音', example: 'book', meaning: '书', learned: false },
            { symbol: '/ɔː/', type: 'vowel', subtype: 'monophthong', category: '后元音', example: 'law', meaning: '法律', learned: false },
            { symbol: '/ɒ/', type: 'vowel', subtype: 'monophthong', category: '后元音', example: 'hot', meaning: '热的', learned: false },
            { symbol: '/ɑː/', type: 'vowel', subtype: 'monophthong', category: '后元音', example: 'far', meaning: '远的', learned: false },
            
            // 双元音
            { symbol: '/eɪ/', type: 'vowel', subtype: 'diphthong', category: '开合双元音', example: 'day', meaning: '白天', learned: false },
            { symbol: '/aɪ/', type: 'vowel', subtype: 'diphthong', category: '开合双元音', example: 'ice', meaning: '冰', learned: false },
            { symbol: '/ɔɪ/', type: 'vowel', subtype: 'diphthong', category: '开合双元音', example: 'coin', meaning: '硬币', learned: false },
            { symbol: '/aʊ/', type: 'vowel', subtype: 'diphthong', category: '开合双元音', example: 'house', meaning: '房子', learned: false },
            { symbol: '/əʊ/', type: 'vowel', subtype: 'diphthong', category: '开合双元音', example: 'road', meaning: '道路', learned: false },
            { symbol: '/ɪə/', type: 'vowel', subtype: 'diphthong', category: '集中双元音', example: 'ear', meaning: '耳朵', learned: false },
            { symbol: '/eə/', type: 'vowel', subtype: 'diphthong', category: '集中双元音', example: 'air', meaning: '空气', learned: false },
            { symbol: '/ʊə/', type: 'vowel', subtype: 'diphthong', category: '集中双元音', example: 'poor', meaning: '可怜的', learned: false },
            
            // 辅音 - 爆破音（清辅音）
            { symbol: '/p/', type: 'consonant', subtype: 'voiceless', category: '爆破音', example: 'pat', meaning: '轻拍', learned: false },
            { symbol: '/t/', type: 'consonant', subtype: 'voiceless', category: '爆破音', example: 'top', meaning: '顶部', learned: false },
            { symbol: '/k/', type: 'consonant', subtype: 'voiceless', category: '爆破音', example: 'cat', meaning: '猫', learned: false },
            
            // 辅音 - 爆破音（浊辅音）
            { symbol: '/b/', type: 'consonant', subtype: 'voiced', category: '爆破音', example: 'bat', meaning: '蝙蝠', learned: false },
            { symbol: '/d/', type: 'consonant', subtype: 'voiced', category: '爆破音', example: 'dog', meaning: '狗', learned: false },
            { symbol: '/ɡ/', type: 'consonant', subtype: 'voiced', category: '爆破音', example: 'go', meaning: '去', learned: false },
            
            // 辅音 - 摩擦音（清辅音）
            { symbol: '/f/', type: 'consonant', subtype: 'voiceless', category: '摩擦音', example: 'fat', meaning: '肥胖', learned: false },
            { symbol: '/s/', type: 'consonant', subtype: 'voiceless', category: '摩擦音', example: 'sun', meaning: '太阳', learned: false },
            { symbol: '/ʃ/', type: 'consonant', subtype: 'voiceless', category: '摩擦音', example: 'she', meaning: '她', learned: false },
            { symbol: '/θ/', type: 'consonant', subtype: 'voiceless', category: '摩擦音', example: 'think', meaning: '思考', learned: false },
            { symbol: '/h/', type: 'consonant', subtype: 'voiceless', category: '摩擦音', example: 'happy', meaning: '快乐的', learned: false },
            
            // 辅音 - 摩擦音（浊辅音）
            { symbol: '/v/', type: 'consonant', subtype: 'voiced', category: '摩擦音', example: 'van', meaning: '货车', learned: false },
            { symbol: '/z/', type: 'consonant', subtype: 'voiced', category: '摩擦音', example: 'zoo', meaning: '动物园', learned: false },
            { symbol: '/ʒ/', type: 'consonant', subtype: 'voiced', category: '摩擦音', example: 'vision', meaning: '视觉', learned: false },
            { symbol: '/ð/', type: 'consonant', subtype: 'voiced', category: '摩擦音', example: 'this', meaning: '这个', learned: false },
            { symbol: '/r/', type: 'consonant', subtype: 'voiced', category: '摩擦音', example: 'red', meaning: '红色', learned: false },
            
            // 辅音 - 破擦音（清辅音）
            { symbol: '/tʃ/', type: 'consonant', subtype: 'voiceless', category: '破擦音', example: 'church', meaning: '教堂', learned: false },
            { symbol: '/tr/', type: 'consonant', subtype: 'voiceless', category: '破擦音', example: 'tree', meaning: '树', learned: false },
            { symbol: '/ts/', type: 'consonant', subtype: 'voiceless', category: '破擦音', example: 'cats', meaning: '猫们', learned: false },
            
            // 辅音 - 破擦音（浊辅音）
            { symbol: '/dʒ/', type: 'consonant', subtype: 'voiced', category: '破擦音', example: 'judge', meaning: '法官', learned: false },
            { symbol: '/dr/', type: 'consonant', subtype: 'voiced', category: '破擦音', example: 'dream', meaning: '梦想', learned: false },
            { symbol: '/dz/', type: 'consonant', subtype: 'voiced', category: '破擦音', example: 'beds', meaning: '床们', learned: false },
            
            // 辅音 - 鼻音
            { symbol: '/m/', type: 'consonant', subtype: 'voiced', category: '鼻音', example: 'man', meaning: '男人', learned: false },
            { symbol: '/n/', type: 'consonant', subtype: 'voiced', category: '鼻音', example: 'note', meaning: '笔记', learned: false },
            { symbol: '/ŋ/', type: 'consonant', subtype: 'voiced', category: '鼻音', example: 'song', meaning: '歌曲', learned: false },
            
            // 辅音 - 似拼音
            { symbol: '/l/', type: 'consonant', subtype: 'voiced', category: '似拼音', example: 'love', meaning: '爱', learned: false },
            
            // 辅音 - 半元音
            { symbol: '/j/', type: 'consonant', subtype: 'voiced', category: '半元音', example: 'yes', meaning: '是的', learned: false },
            { symbol: '/w/', type: 'consonant', subtype: 'voiced', category: '半元音', example: 'water', meaning: '水', learned: false }
        ];

        let currentFilter = 'all';
        let learnedCount = 0;

        // 初始化页面
        function init() {
            loadProgress();
            renderPhoneticCards();
            updateStats();
            bindEvents();
        }

        // 渲染音标卡片
        function renderPhoneticCards() {
            const grid = document.getElementById('phoneticGrid');
            grid.innerHTML = '';

            const filteredData = filterPhoneticData();
            
            filteredData.forEach((phonetic, index) => {
                const card = createPhoneticCard(phonetic, index);
                grid.appendChild(card);
            });
        }

        // 过滤音标数据
        function filterPhoneticData() {
            if (currentFilter === 'all') return phoneticData;
            
            return phoneticData.filter(phonetic => {
                switch (currentFilter) {
                    case 'vowel':
                        return phonetic.type === 'vowel';
                    case 'consonant':
                        return phonetic.type === 'consonant';
                    case 'monophthong':
                        return phonetic.subtype === 'monophthong';
                    case 'diphthong':
                        return phonetic.subtype === 'diphthong';
                    case 'voiceless':
                        return phonetic.subtype === 'voiceless';
                    case 'voiced':
                        return phonetic.subtype === 'voiced';
                    default:
                        return true;
                }
            });
        }

        // 创建音标卡片
        function createPhoneticCard(phonetic, index) {
            const card = document.createElement('div');
            card.className = `phonetic-card ${phonetic.learned ? 'learned' : ''}`;
            card.innerHTML = `
                <div class="phonetic-symbol">${phonetic.symbol}</div>
                <div class="phonetic-type">${phonetic.category}</div>
                <div class="example-word">${phonetic.example}</div>
                <div class="example-meaning">${phonetic.meaning}</div>
                <button class="play-btn" onclick="playPhonetic('${phonetic.symbol}', ${index})">🔊 发音</button>
                <button class="play-btn" onclick="toggleLearned(${index})">
                    ${phonetic.learned ? '✅ 已掌握' : '📚 标记掌握'}
                </button>
            `;
            return card;
        }

        // 播放音标发音（模拟）
        function playPhonetic(symbol, index) {
            // 这里使用Web Speech API模拟发音
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(phoneticData[index].example);
                utterance.lang = 'en-US';
                utterance.rate = 0.8;
                speechSynthesis.speak(utterance);
            } else {
                alert(`正在播放音标 ${symbol} 的发音\n示例单词: ${phoneticData[index].example}`);
            }
        }

        // 切换学习状态
        function toggleLearned(index) {
            phoneticData[index].learned = !phoneticData[index].learned;
            
            if (phoneticData[index].learned) {
                learnedCount++;
            } else {
                learnedCount--;
            }
            
            saveProgress();
            renderPhoneticCards();
            updateStats();
        }

        // 更新统计信息
        function updateStats() {
            const totalLearned = phoneticData.filter(p => p.learned).length;
            const accuracy = Math.round((totalLearned / phoneticData.length) * 100);
            
            document.getElementById('totalLearned').textContent = totalLearned;
            document.getElementById('accuracy').textContent = accuracy + '%';
            document.getElementById('progressText').textContent = `${totalLearned} / 48 已学习`;
            document.getElementById('progressFill').style.width = accuracy + '%';
        }

        // 绑定事件
        function bindEvents() {
            // 过滤按钮事件
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    renderPhoneticCards();
                });
            });
        }

        // 保存学习进度
        function saveProgress() {
            localStorage.setItem('phoneticProgress', JSON.stringify(phoneticData));
        }

        // 加载学习进度
        function loadProgress() {
            const saved = localStorage.getItem('phoneticProgress');
            if (saved) {
                const savedData = JSON.parse(saved);
                savedData.forEach((saved, index) => {
                    if (phoneticData[index]) {
                        phoneticData[index].learned = saved.learned;
                    }
                });
            }
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
