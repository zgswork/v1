<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车牌归属地查询工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow:
                20px 20px 60px rgba(0, 0, 0, 0.1),
                -20px -20px 60px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 600px;
            width: 100%;
        }

        .title {
            text-align: center;
            color: #2d5a27;
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .input-group {
            margin-bottom: 30px;
        }

        .query-btn {
            width: 100%;
            padding: 18px;
            font-size: 1.1em;
            font-weight: bold;
            color: white;
            background: linear-gradient(145deg, #4caf50, #45a049);
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow:
                8px 8px 16px rgba(45, 90, 39, 0.2),
                -8px -8px 16px rgba(255, 255, 255, 0.1);
            margin-bottom: 30px;
        }

        .query-btn:hover {
            transform: translateY(-2px);
            box-shadow:
                12px 12px 20px rgba(45, 90, 39, 0.3),
                -12px -12px 20px rgba(255, 255, 255, 0.2);
        }

        .query-btn:active {
            transform: translateY(0);
            box-shadow:
                4px 4px 8px rgba(45, 90, 39, 0.2),
                -4px -4px 8px rgba(255, 255, 255, 0.1);
        }

        .result-card {
            background: #f0f8f0;
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
            box-shadow:
                inset 5px 5px 10px rgba(45, 90, 39, 0.1),
                inset -5px -5px 10px rgba(255, 255, 255, 0.8);
            display: none;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid rgba(45, 90, 39, 0.1);
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-label {
            font-weight: bold;
            color: #2d5a27;
            font-size: 1.1em;
        }

        .result-value {
            color: #4caf50;
            font-weight: bold;
            font-size: 1.1em;
        }

        .energy-badge {
            display: inline-block;
            padding: 5px 15px;
            background: linear-gradient(145deg, #81c784, #66bb6a);
            color: white;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            box-shadow:
                3px 3px 6px rgba(45, 90, 39, 0.2),
                -3px -3px 6px rgba(255, 255, 255, 0.1);
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
            box-shadow:
                inset 3px 3px 6px rgba(198, 40, 40, 0.1),
                inset -3px -3px 6px rgba(255, 255, 255, 0.8);
            display: none;
        }

        .examples {
            margin-top: 30px;
            text-align: center;
        }

        .examples-title {
            color: #2d5a27;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .example-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .example-tag {
            background: rgba(76, 175, 80, 0.2);
            color: #2d5a27;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow:
                3px 3px 6px rgba(45, 90, 39, 0.1),
                -3px -3px 6px rgba(255, 255, 255, 0.3);
        }

        .example-tag:hover {
            background: rgba(76, 175, 80, 0.3);
            transform: translateY(-1px);
        }

        /* 车牌构建器样式 */
        .plate-builder {
            background: #e8f5e8;
            border-radius: 15px;
            padding: 20px;
            box-shadow:
                inset 8px 8px 16px rgba(45, 90, 39, 0.1),
                inset -8px -8px 16px rgba(255, 255, 255, 0.8);
        }

        .province-selector {
            margin-bottom: 20px;
        }

        .province-select {
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            background: #f0f8f0;
            color: #2d5a27;
            font-weight: bold;
            outline: none;
            cursor: pointer;
            box-shadow:
                5px 5px 10px rgba(45, 90, 39, 0.1),
                -5px -5px 10px rgba(255, 255, 255, 0.8);
        }

        .province-select:focus {
            box-shadow:
                inset 3px 3px 6px rgba(45, 90, 39, 0.2),
                inset -3px -3px 6px rgba(255, 255, 255, 0.9);
        }

        .plate-display {
            margin-bottom: 25px;
        }

        .plate-preview {
            background: linear-gradient(145deg, #ffffff, #f0f8f0);
            border: 3px solid #4caf50;
            border-radius: 8px;
            padding: 15px 20px;
            text-align: center;
            font-size: 1.8em;
            font-weight: bold;
            color: #2d5a27;
            letter-spacing: 3px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                5px 5px 15px rgba(45, 90, 39, 0.2),
                -5px -5px 15px rgba(255, 255, 255, 0.8);
        }

        .keyboard-container {
            margin-top: 20px;
        }

        .keyboard-section {
            margin-bottom: 20px;
        }

        .section-title {
            color: #2d5a27;
            font-weight: bold;
            font-size: 1em;
            margin-bottom: 10px;
            text-align: center;
        }

        .keyboard-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .key-btn {
            min-width: 45px;
            height: 45px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .letter-key {
            background: linear-gradient(145deg, #81c784, #66bb6a);
            color: white;
            box-shadow:
                3px 3px 6px rgba(45, 90, 39, 0.3),
                -3px -3px 6px rgba(255, 255, 255, 0.1);
        }

        .letter-key:hover {
            transform: translateY(-2px);
            box-shadow:
                5px 5px 10px rgba(45, 90, 39, 0.4),
                -5px -5px 10px rgba(255, 255, 255, 0.2);
        }

        .letter-key:active {
            transform: translateY(0);
            box-shadow:
                2px 2px 4px rgba(45, 90, 39, 0.3),
                -2px -2px 4px rgba(255, 255, 255, 0.1);
        }

        .number-key {
            background: linear-gradient(145deg, #4caf50, #45a049);
            color: white;
            box-shadow:
                3px 3px 6px rgba(45, 90, 39, 0.3),
                -3px -3px 6px rgba(255, 255, 255, 0.1);
        }

        .number-key:hover {
            transform: translateY(-2px);
            box-shadow:
                5px 5px 10px rgba(45, 90, 39, 0.4),
                -5px -5px 10px rgba(255, 255, 255, 0.2);
        }

        .number-key:active {
            transform: translateY(0);
            box-shadow:
                2px 2px 4px rgba(45, 90, 39, 0.3),
                -2px -2px 4px rgba(255, 255, 255, 0.1);
        }

        .special-key {
            background: linear-gradient(145deg, #ff9800, #f57c00);
            color: white;
            box-shadow:
                3px 3px 6px rgba(245, 124, 0, 0.3),
                -3px -3px 6px rgba(255, 255, 255, 0.1);
        }

        .special-key:hover {
            transform: translateY(-2px);
            box-shadow:
                5px 5px 10px rgba(245, 124, 0, 0.4),
                -5px -5px 10px rgba(255, 255, 255, 0.2);
        }

        .special-key:active {
            transform: translateY(0);
            box-shadow:
                2px 2px 4px rgba(245, 124, 0, 0.3),
                -2px -2px 4px rgba(255, 255, 255, 0.1);
        }

        .control-key {
            background: linear-gradient(145deg, #f44336, #d32f2f);
            color: white;
            min-width: 80px;
            box-shadow:
                3px 3px 6px rgba(211, 47, 47, 0.3),
                -3px -3px 6px rgba(255, 255, 255, 0.1);
        }

        .control-key:hover {
            transform: translateY(-2px);
            box-shadow:
                5px 5px 10px rgba(211, 47, 47, 0.4),
                -5px -5px 10px rgba(255, 255, 255, 0.2);
        }

        .control-key:active {
            transform: translateY(0);
            box-shadow:
                2px 2px 4px rgba(211, 47, 47, 0.3),
                -2px -2px 4px rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            .title {
                font-size: 2em;
            }

            .plate-preview {
                font-size: 1.4em;
                letter-spacing: 2px;
                padding: 12px 15px;
                min-height: 50px;
            }

            .key-btn {
                min-width: 35px;
                height: 35px;
                font-size: 0.9em;
            }

            .control-key {
                min-width: 60px;
            }

            .keyboard-row {
                gap: 5px;
            }
        }
    </style>
</head>

        // 全局变量存储当前车牌
        let currentPlate = '';

        // 添加普通字符到车牌（字母和数字）
        function addCharacter(char) {
            const provinceSelect = document.getElementById('provinceSelect');

            // 如果没有选择省份，提示用户
            if (!provinceSelect.value) {
                showError('请先选择省份');
                return;
            }

            // 最简查询：只需要输入城市代码（第一个字符）
            if (currentPlate.length >= 1) {
                showError('最简查询模式：只需输入一个城市代码即可查询');
                return;
            }

            currentPlate = char;
            updatePlatePreview();
            
            // 自动查询
            setTimeout(() => {
                queryLicense();
            }, 300);
        }

        // 添加特殊字符（挂、学、警、港、澳）
        function addSpecialCharacter(char) {
            const provinceSelect = document.getElementById('provinceSelect');

            // 如果没有选择省份，提示用户
            if (!provinceSelect.value) {
                showError('请先选择省份');
                return;
            }

            // 特殊字符可以直接查询
            currentPlate = char;
            updatePlatePreview();
            
            // 自动查询
            setTimeout(() => {
                querySpecialLicense(char);
            }, 300);
        }

        // 删除最后一个字符
        function deleteLast() {
            if (currentPlate.length > 0) {
                currentPlate = '';
                updatePlatePreview();
                hideResults();
            }
        }

        // 清空车牌
        function clearPlate() {
            currentPlate = '';
            document.getElementById('provinceSelect').value = '';
            updatePlatePreview();
            hideResults();
        }

        // 更新车牌预览
        function updatePlatePreview() {
            const provinceSelect = document.getElementById('provinceSelect');
            const platePreview = document.getElementById('platePreview');
            
            if (!provinceSelect.value && !currentPlate) {
                platePreview.textContent = '请选择省份并输入城市代码';
                return;
            }
            
            if (!provinceSelect.value) {
                platePreview.textContent = '请先选择省份';
                return;
            }
            
            if (!currentPlate) {
                platePreview.textContent = provinceSelect.value + '? - 请输入城市代码';
                return;
            }
            
            // 显示省份+城市代码的格式
            const displayText = provinceSelect.value + currentPlate + ' - 最简查询模式';
            platePreview.textContent = displayText;
        }

        // 省份选择变化时更新预览
        document.getElementById('provinceSelect').addEventListener('change', function () {
            updatePlatePreview();
            hideResults();
        });

        // 隐藏结果
        function hideResults() {
            document.getElementById('resultCard').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'none';
        }

        // 查询普通车牌
        function queryLicense() {
            const provinceSelect = document.getElementById('provinceSelect');
            const resultCard = document.getElementById('resultCard');
            
            // 隐藏之前的结果
            hideResults();
            
            if (!provinceSelect.value) {
                showError('请选择省份');
                return;
            }
            
            if (!currentPlate) {
                showError('请输入城市代码（如：A、B、C等）');
                return;
            }
            
            const province = provinceSelect.value;
            const cityCode = currentPlate.charAt(0); // 只取第一个字符作为城市代码
            
            if (!licensePlateData[province]) {
                showError('未找到该省份信息');
                return;
            }
            
            const provinceData = licensePlateData[province];
            const cityName = provinceData.cities[cityCode];
            
            if (!cityName) {
                showError('未找到该城市代码信息，请检查输入的字母');
                return;
            }
            
            // 判断车牌类型
            let plateType = '普通车牌';
            if (cityCode === 'D' || cityCode === 'F') {
                plateType = '新能源车牌';
            }
            
            // 构建显示的车牌号（省份+城市代码+示例）
            const displayPlate = province + cityCode + 'XXXXX';
            
            // 显示结果
            document.getElementById('plateNumber').textContent = displayPlate;
            document.getElementById('province').textContent = provinceData.province;
            document.getElementById('city').textContent = cityName;
            
            const plateTypeElement = document.getElementById('plateType');
            plateTypeElement.textContent = plateType;
            
            // 如果是新能源车牌，添加特殊样式
            if (plateType === '新能源车牌') {
                plateTypeElement.innerHTML = plateType + ' <span class="energy-badge">🔋 绿色出行</span>';
            }
            
            resultCard.style.display = 'block';
        }

        // 查询特殊车牌
        function querySpecialLicense(specialChar) {
            const provinceSelect = document.getElementById('provinceSelect');
            const resultCard = document.getElementById('resultCard');
            
            // 隐藏之前的结果
            hideResults();
            
            if (!provinceSelect.value) {
                showError('请选择省份');
                return;
            }
            
            const province = provinceSelect.value;
            
            if (!licensePlateData[province]) {
                showError('未找到该省份信息');
                return;
            }
            
            const provinceData = licensePlateData[province];
            
            // 判断特殊车牌类型
            let plateType = '普通车牌';
            let cityName = '特殊车牌';
            
            if (specialChar === '挂') {
                plateType = '挂车车牌';
                cityName = '挂车专用';
            } else if (specialChar === '学') {
                plateType = '教练车牌';
                cityName = '驾校教练车';
            } else if (specialChar === '警') {
                plateType = '警用车牌';
                cityName = '公安警用';
            } else if (specialChar === '港') {
                plateType = '港澳车牌';
                cityName = '香港车辆';
            } else if (specialChar === '澳') {
                plateType = '港澳车牌';
                cityName = '澳门车辆';
            }
            
            // 构建显示的车牌号
            const displayPlate = province + specialChar + 'XXXXX';
            
            // 显示结果
            document.getElementById('plateNumber').textContent = displayPlate;
            document.getElementById('province').textContent = provinceData.province;
            document.getElementById('city').textContent = cityName;
            document.getElementById('plateType').textContent = plateType;
            
            resultCard.style.display = 'block';
        }

        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        function fillExample(example) {
            // 解析示例车牌（只需要省份+城市代码）
            const province = example.charAt(0);
            const cityCode = example.charAt(1);

            // 设置省份选择器
            document.getElementById('provinceSelect').value = province;

            // 设置城市代码（只需要一个字母）
            currentPlate = cityCode;

            // 更新预览
            updatePlatePreview();

            // 自动查询
            queryLicense();
        }
