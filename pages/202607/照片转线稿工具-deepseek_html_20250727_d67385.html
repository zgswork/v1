<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>照片转线稿工具</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .tool-container {
            display: flex;
            gap: 20px;
        }
        .panel {
            flex: 1;
            padding: 20px;
            border: 1px dashed #ccc;
            border-radius: 8px;
            text-align: center;
        }
        .upload-area {
            height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .upload-area:hover {
            background-color: #f9f9f9;
        }
        .upload-icon {
            font-size: 48px;
            color: #666;
            margin-bottom: 10px;
        }
        .preview-image {
            max-width: 100%;
            max-height: 300px;
            display: none;
        }
        .control-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .slider-container {
            width: 100%;
            text-align: center;
        }
        .slider {
            width: 100%;
            margin: 15px 0;
        }
        .slider-value {
            font-weight: bold;
            color: #333;
        }
        .download-btn {
            background-color: #2196F3;
            margin-top: 20px;
        }
        .download-btn:hover {
            background-color: #0b7dda;
        }
        .clear-btn {
            background-color: #f44336;
            margin-top: 20px;
        }
        .clear-btn:hover {
            background-color: #d32f2f;
        }
        .error-message {
            color: #f44336;
            margin-top: 10px;
            display: none;
        }
        .file-info {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>照片转线稿工具</h1>
        
        <div class="tool-container">
            <!-- 左侧上传区域 -->
            <div class="panel">
                <h3>上传照片</h3>
                <div id="upload-area" class="upload-area">
                    <div class="upload-icon">📁</div>
                    <p>点击或拖放照片到这里</p>
                    <p>支持JPG/JPEG/PNG格式</p>
                    <p>最大5MB</p>
                    <img id="original-preview" class="preview-image" alt="原始图片预览">
                </div>
                <input type="file" id="file-input" accept="image/jpeg, image/png" style="display: none;">
                <div id="file-info" class="file-info"></div>
                <div id="error-message" class="error-message"></div>
            </div>
            
            <!-- 中间控制区域 -->
            <div class="panel control-panel">
                <h3>转换设置</h3>
                <button id="convert-btn" disabled>开始转换</button>
                
                <div class="slider-container">
                    <label for="intensity-slider">线稿强度: <span id="intensity-value" class="slider-value">50</span></label>
                    <input type="range" id="intensity-slider" class="slider" min="1" max="100" value="50">
                </div>
                
                <button id="clear-btn" class="clear-btn">清除文件</button>
            </div>
            
            <!-- 右侧输出区域 -->
            <div class="panel">
                <h3>线稿结果</h3>
                <div id="result-container" style="height: 300px; display: flex; justify-content: center; align-items: center;">
                    <p>转换后的线稿将显示在这里</p>
                </div>
                <button id="download-btn" class="download-btn" disabled>下载线稿</button>
            </div>
        </div>
    </div>

    <script>
        // DOM元素
        const fileInput = document.getElementById('file-input');
        const uploadArea = document.getElementById('upload-area');
        const originalPreview = document.getElementById('original-preview');
        const convertBtn = document.getElementById('convert-btn');
        const intensitySlider = document.getElementById('intensity-slider');
        const intensityValue = document.getElementById('intensity-value');
        const resultContainer = document.getElementById('result-container');
        const downloadBtn = document.getElementById('download-btn');
        const clearBtn = document.getElementById('clear-btn');
        const errorMessage = document.getElementById('error-message');
        const fileInfo = document.getElementById('file-info');
        
        // 变量
        let originalImage = null;
        let lineArtImage = null;
        
        // 事件监听
        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.backgroundColor = '#f0f0f0';
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.backgroundColor = '';
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.backgroundColor = '';
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                handleFileSelect();
            }
        });
        
        fileInput.addEventListener('change', handleFileSelect);
        intensitySlider.addEventListener('input', updateIntensityValue);
        convertBtn.addEventListener('click', convertToLineArt);
        downloadBtn.addEventListener('click', downloadLineArt);
        clearBtn.addEventListener('click', clearAll);
        
        // 更新强度值显示
        function updateIntensityValue() {
            intensityValue.textContent = intensitySlider.value;
        }
        
        // 处理文件选择
        function handleFileSelect() {
            const file = fileInput.files[0];
            
            // 验证文件
            if (!file) return;
            
            // 检查文件类型
            const validTypes = ['image/jpeg', 'image/png'];
            if (!validTypes.includes(file.type)) {
                showError('只支持JPG/JPEG/PNG格式的图片');
                return;
            }
            
            // 检查文件大小 (5MB)
            if (file.size > 5 * 1024 * 1024) {
                showError('文件大小不能超过5MB');
                return;
            }
            
            // 清除错误信息
            hideError();
            
            // 显示文件信息
            fileInfo.textContent = `${file.name} (${(file.size / 1024 / 1024).toFixed(2)}MB)`;
            
            // 预览原始图片
            const reader = new FileReader();
            reader.onload = function(e) {
                originalImage = new Image();
                originalImage.onload = function() {
                    originalPreview.src = e.target.result;
                    originalPreview.style.display = 'block';
                    uploadArea.querySelector('p').style.display = 'none';
                    uploadArea.querySelector('.upload-icon').style.display = 'none';
                    convertBtn.disabled = false;
                };
                originalImage.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
        
        // 清除所有内容
        function clearAll() {
            // 重置文件输入
            fileInput.value = '';
            
            // 清除预览图片
            originalPreview.src = '';
            originalPreview.style.display = 'none';
            
            // 恢复上传区域提示
            uploadArea.querySelector('p').style.display = '';
            uploadArea.querySelector('.upload-icon').style.display = '';
            
            // 清除结果区域
            resultContainer.innerHTML = '<p>转换后的线稿将显示在这里</p>';
            
            // 清除文件信息
            fileInfo.textContent = '';
            
            // 隐藏错误信息
            hideError();
            
            // 禁用按钮
            convertBtn.disabled = true;
            downloadBtn.disabled = true;
            
            // 重置变量
            originalImage = null;
            lineArtImage = null;
        }
        
        // 显示错误信息
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            convertBtn.disabled = true;
            originalPreview.style.display = 'none';
            uploadArea.querySelector('p').style.display = '';
            uploadArea.querySelector('.upload-icon').style.display = '';
            fileInfo.textContent = '';
        }
        
        // 隐藏错误信息
        function hideError() {
            errorMessage.style.display = 'none';
        }
        
        // 转换为线稿
        function convertToLineArt() {
            if (!originalImage) return;
            
            convertBtn.disabled = true;
            convertBtn.textContent = '转换中...';
            
            // 使用canvas处理图片
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // 设置canvas尺寸
            const maxWidth = 800;
            const maxHeight = 800;
            let width = originalImage.width;
            let height = originalImage.height;
            
            // 调整大小保持比例
            if (width > maxWidth || height > maxHeight) {
                const ratio = Math.min(maxWidth / width, maxHeight / height);
                width *= ratio;
                height *= ratio;
            }
            
            canvas.width = width;
            canvas.height = height;
            
            // 绘制原始图片
            ctx.drawImage(originalImage, 0, 0, width, height);
            
            // 获取图像数据
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            
            // 获取强度值 (1-100)
            const intensity = parseInt(intensitySlider.value) / 100;
            
            // 转换为灰度并检测边缘
            const grayData = [];
            const edgeData = new Uint8ClampedArray(data.length);
            
            // 转换为灰度
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                const gray = 0.299 * r + 0.587 * g + 0.114 * b;
                grayData.push(gray);
            }
            
            // Sobel边缘检测
            const sobelX = [-1, 0, 1, -2, 0, 2, -1, 0, 1];
            const sobelY = [-1, -2, -1, 0, 0, 0, 1, 2, 1];
            
            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    let gx = 0;
                    let gy = 0;
                    
                    // 计算梯度
                    for (let ky = -1; ky <= 1; ky++) {
                        for (let kx = -1; kx <= 1; kx++) {
                            const idx = (y + ky) * width + (x + kx);
                            const gray = grayData[idx];
                            
                            const sobelIdx = (ky + 1) * 3 + (kx + 1);
                            gx += gray * sobelX[sobelIdx];
                            gy += gray * sobelY[sobelIdx];
                        }
                    }
                    
                    // 计算梯度幅度
                    const magnitude = Math.sqrt(gx * gx + gy * gy);
                    const edgeValue = 255 - Math.min(255, magnitude * intensity);
                    
                    // 设置边缘数据
                    const pos = (y * width + x) * 4;
                    edgeData[pos] = edgeValue;
                    edgeData[pos + 1] = edgeValue;
                    edgeData[pos + 2] = edgeValue;
                    edgeData[pos + 3] = 255;
                }
            }
            
            // 处理边界像素
            for (let i = 0; i < width; i++) {
                const topPos = i * 4;
                edgeData[topPos] = edgeData[topPos + 1] = edgeData[topPos + 2] = 255;
                
                const bottomPos = ((height - 1) * width + i) * 4;
                edgeData[bottomPos] = edgeData[bottomPos + 1] = edgeData[bottomPos + 2] = 255;
            }
            
            for (let i = 0; i < height; i++) {
                const leftPos = (i * width) * 4;
                edgeData[leftPos] = edgeData[leftPos + 1] = edgeData[leftPos + 2] = 255;
                
                const rightPos = (i * width + (width - 1)) * 4;
                edgeData[rightPos] = edgeData[rightPos + 1] = edgeData[rightPos + 2] = 255;
            }
            
            // 创建新的图像数据
            const edgeImageData = new ImageData(edgeData, width, height);
            ctx.putImageData(edgeImageData, 0, 0);
            
            // 显示结果
            lineArtImage = new Image();
            lineArtImage.onload = function() {
                resultContainer.innerHTML = '';
                resultContainer.appendChild(lineArtImage);
                downloadBtn.disabled = false;
                convertBtn.textContent = '开始转换';
                convertBtn.disabled = false;
            };
            lineArtImage.src = canvas.toDataURL('image/jpeg', 0.9);
        }
        
        // 下载线稿
        function downloadLineArt() {
            if (!lineArtImage) return;
            
            const link = document.createElement('a');
            link.download = 'line-art.jpg';
            link.href = lineArtImage.src;
            link.click();
        }
    </script>
</body>
</html>
