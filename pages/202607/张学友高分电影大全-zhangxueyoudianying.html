        let currentMovieIndex = -1;
        let previousIndexes = [];

        function getRandomMovieIndex() {
            if (previousIndexes.length === movies.length) {
                previousIndexes = [];
            }
            
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * movies.length);
            } while (previousIndexes.includes(randomIndex));
            
            previousIndexes.push(randomIndex);
            return randomIndex;
        }

        function displayMovie(index) {
            const movie = movies[index];
            movieTitle.textContent = movie.title;
            
            // 计算星星数量（豆瓣评分除以2，四舍五入）
            const starCount = Math.round(movie.rating / 2);
            let stars = '';
            for (let i = 0; i < 5; i++) {
                if (i < starCount) {
                    stars += '★';
                } else {
                    stars += '☆';
                }
            }
            movieRating.textContent = `推荐指数：${stars} (豆瓣评分：${movie.rating})`;
            
            movieDescription.textContent = movie.description;
            movieReason.textContent = movie.reason;
            
            movieDisplay.style.display = 'block';
            changeBtn.style.display = 'block';
        }
