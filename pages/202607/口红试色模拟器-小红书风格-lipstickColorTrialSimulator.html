<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>口红试色模拟器 - 小红书风格</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #fff5f5 0%, #fff0f5 100%);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        
        header {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(255, 105, 180, 0.15);
            border: 1px solid #ffe4e9;
        }
        
        h1 {
            color: #e6007a;
            font-size: 2.8rem;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            position: relative;
            display: inline-block;
        }
        
        h1:after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #ff9a9e, #fad0c4);
            border-radius: 2px;
        }
        
        .tagline {
            color: #ff6b9c;
            font-size: 1.2rem;
            margin-top: 10px;
            font-weight: 500;
        }
        
        .app-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
        }
        
        .upload-section {
            flex: 1;
            min-width: 300px;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(255, 105, 180, 0.15);
            border: 1px solid #ffe4e9;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
        }
        
        .upload-section:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(255, 105, 180, 0.2);
        }
        
        .preview-section {
            flex: 2;
            min-width: 400px;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(255, 105, 180, 0.15);
            border: 1px solid #ffe4e9;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
        }
        
        .preview-section:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(255, 105, 180, 0.2);
        }
        
        .section-title {
            color: #e6007a;
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
            position: relative;
            padding-bottom: 10px;
        }
        
        .section-title:after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 3px;
            background: linear-gradient(90deg, #ff9a9e, #fad0c4);
            border-radius: 2px;
        }
        
        .upload-area {
            width: 100%;
            height: 300px;
            border: 3px dashed #ffb6c1;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #fffafb;
            margin-bottom: 25px;
        }
        
        .upload-area:hover {
            background: #fff0f5;
            border-color: #ff69b4;
        }
        
        .upload-area i {
            font-size: 5rem;
            color: #ffb6c1;
            margin-bottom: 20px;
        }
        
        .upload-area p {
            color: #888;
            font-size: 1.1rem;
            text-align: center;
            max-width: 80%;
        }
        
        .upload-btn {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.3);
        }
        
        .upload-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 20px rgba(255, 105, 180, 0.4);
        }
        
        .upload-btn:active {
            transform: translateY(1px);
        }
        
        .preview-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 400px;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            background: #f8f8f8;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .preview-image {
            max-width: 100%;
            max-height: 100%;
            display: none;
        }
        
        .placeholder-text {
            color: #ccc;
            font-size: 1.2rem;
            text-align: center;
            padding: 20px;
        }
        
        .lipstick-palette {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 500px;
            margin-top: 20px;
        }
        
        .lipstick-color {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        .lipstick-color:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }
        
        .lipstick-color.selected {
            transform: scale(1.15);
            box-shadow: 0 0 0 3px white, 0 0 0 6px #ff69b4;
        }
        
        .lipstick-color .color-name {
            position: absolute;
            bottom: -25px;
            font-size: 0.7rem;
            text-align: center;
            width: 100%;
            color: #666;
            font-weight: 500;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .action-btn {
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            border: none;
        }
        
        .save-btn {
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(161, 140, 209, 0.3);
        }
        
        .share-btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8e8e 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }
        
        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 20px rgba(0, 0, 0, 0.2);
        }
        
        .card-preview {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: none;
            margin-top: 30px;
            border: 1px solid #ffe4e9;
        }
        
        .card-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }
        
        .card-info {
            padding: 20px;
            text-align: center;
        }
        
        .card-info h3 {
            color: #e6007a;
            font-size: 1.4rem;
            margin-bottom: 10px;
        }
        
        .card-info p {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 15px;
            font-weight: 500;
        }
        
        .hashtag {
            color: #ff6b9c;
            font-weight: 600;
            font-size: 1rem;
        }
        
        .social-share {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }
        
        .social-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .social-btn:hover {
            transform: scale(1.1);
        }
        
        .red {
            background: #e6007a;
        }
        
        .wechat {
            background: #09b83e;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #888;
            font-size: 0.9rem;
            margin-top: 20px;
        }
        
        .tip {
            background: #fff0f5;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            border-left: 4px solid #ff69b4;
            font-size: 0.9rem;
        }
        
        .tip h4 {
            color: #e6007a;
            margin-bottom: 8px;
        }
        
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .preview-container {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-lipstick"></i> 口红试色模拟器</h1>
            <p class="tagline">上传自拍，即刻体验热门色号，打造专属美妆笔记</p>
        </header>
        
        <div class="app-container">
            <div class="upload-section">
                <h2 class="section-title">上传自拍</h2>
                <div class="upload-area" id="uploadArea">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>点击或拖拽照片到此处上传<br>（建议使用清晰正面照）</p>
                </div>
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
                <button class="upload-btn" id="uploadBtn">
                    <i class="fas fa-camera"></i> 选择照片
                </button>
                
                <div class="tip">
                    <h4>📌 使用小贴士</h4>
                    <p>• 请上传光线充足、正脸清晰的照片</p>
                    <p>• 系统会自动识别嘴唇位置进行上色</p>
                    <p>• 完成后可保存或分享到小红书</p>
                </div>
            </div>
            
            <div class="preview-section">
                <h2 class="section-title">虚拟试妆</h2>
                <div class="preview-container">
                    <img id="previewImage" class="preview-image" alt="预览图">
                    <div class="placeholder-text" id="placeholder">请上传照片开始试色</div>
                    <canvas id="lipCanvas" style="display: none;"></canvas>
                </div>
                
                <div class="lipstick-palette" id="lipstickPalette">
                    <!-- Lipstick colors will be generated here -->
                </div>
                
                <div class="action-buttons">
                    <button class="action-btn save-btn" id="saveBtn">
                        <i class="fas fa-download"></i> 保存图片
                    </button>
                    <button class="action-btn share-btn" id="shareBtn">
                        <i class="fab fa-reddit-alien"></i> 生成小红书卡片
                    </button>
                </div>
                
                <div class="card-preview" id="cardPreview">
                    <img id="cardImage" class="card-image" alt="种草卡片">
                    <div class="card-info">
                        <h3>绝美口红试色分享</h3>
                        <p id="lipstickInfo">YSL 小黑条 #302 豆沙玫瑰</p>
                        <p class="hashtag">#口红试色模拟器 #虚拟试妆 #美妆种草</p>
                        <div class="social-share">
                            <div class="social-btn red">
                                <i class="fab fa-reddit-alien"></i>
                            </div>
                            <div class="social-btn wechat">
                                <i class="fab fa-weixin"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>口红试色模拟器 MVP 版本 | 专为小红书用户设计 | 产品设计灵感来自真实用户需求</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化口红色号数据
            const lipstickColors = [
                { name: '豆沙玫瑰', color: '#d87093', brand: 'YSL 小黑条 #302' },
                { name: '正宫红', color: '#9e0e40', brand: 'Dior 烈焰蓝金 #999' },
                { name: '烂番茄', color: '#ff4c4c', brand: 'Armani 红管 #405' },
                { name: '蜜桃粉', color: '#ffb7c5', brand: 'Chanel 炫亮 #92' },
                { name: '奶茶色', color: '#e3c9b1', brand: 'MAC 子弹头 #Mocha' },
                { name: '梅子色', color: '#7a3e65', brand: 'NARS 唇膏笔 #Dragon Girl' },
                { name: '橘红色', color: '#ff6b35', brand: 'Tom Ford 黑管 #16' },
                { name: '浆果色', color: '#8a2a52', brand: 'YSL 水光 #613' },
                { name: '珊瑚橘', color: '#ff7f50', brand: '兰蔻 菁纯 #122' },
                { name: '裸粉色', color: '#f8c3af', brand: 'CT 吻痕 #Pillow Talk' }
            ];
            
            // 获取DOM元素
            const uploadArea = document.getElementById('uploadArea');
            const fileInput = document.getElementById('fileInput');
            const uploadBtn = document.getElementById('uploadBtn');
            const previewImage = document.getElementById('previewImage');
            const placeholder = document.getElementById('placeholder');
            const lipCanvas = document.getElementById('lipCanvas');
            const lipstickPalette = document.getElementById('lipstickPalette');
            const saveBtn = document.getElementById('saveBtn');
            const shareBtn = document.getElementById('shareBtn');
            const cardPreview = document.getElementById('cardPreview');
            const cardImage = document.getElementById('cardImage');
            const lipstickInfo = document.getElementById('lipstickInfo');
            
            // 当前选中的口红
            let selectedLipstick = null;
            let originalImage = null;
            
            // 生成口红色板
            lipstickColors.forEach((lipstick, index) => {
                const colorDiv = document.createElement('div');
                colorDiv.className = 'lipstick-color';
                colorDiv.style.background = lipstick.color;
                colorDiv.dataset.index = index;
                
                const nameSpan = document.createElement('span');
                nameSpan.className = 'color-name';
                nameSpan.textContent = lipstick.name;
                
                colorDiv.appendChild(nameSpan);
                lipstickPalette.appendChild(colorDiv);
                
                // 添加点击事件
                colorDiv.addEventListener('click', function() {
                    // 移除之前选中的样式
                    document.querySelectorAll('.lipstick-color').forEach(el => {
                        el.classList.remove('selected');
                    });
                    
                    // 添加当前选中样式
                    this.classList.add('selected');
                    selectedLipstick = lipstick;
                    
                    // 应用口红效果
                    applyLipstickEffect(lipstick.color);
                });
            });
            
            // 上传按钮事件
            uploadBtn.addEventListener('click', function() {
                fileInput.click();
            });
            
            // 拖拽上传事件
            uploadArea.addEventListener('dragover', function(e) {
                e.preventDefault();
                this.style.borderColor = '#ff69b4';
                this.style.background = '#fff0f5';
            });
            
            uploadArea.addEventListener('dragleave', function() {
                this.style.borderColor = '#ffb6c1';
                this.style.background = '#fffafb';
            });
            
            uploadArea.addEventListener('drop', function(e) {
                e.preventDefault();
                this.style.borderColor = '#ffb6c1';
                this.style.background = '#fffafb';
                
                if (e.dataTransfer.files.length) {
                    handleImageUpload(e.dataTransfer.files[0]);
                }
            });
            
            // 点击上传区域事件
            uploadArea.addEventListener('click', function() {
                fileInput.click();
            });
            
            // 文件选择事件
            fileInput.addEventListener('change', function(e) {
                if (this.files && this.files[0]) {
                    handleImageUpload(this.files[0]);
                }
            });
            
            // 保存按钮事件
            saveBtn.addEventListener('click', function() {
                if (!previewImage.src) {
                    alert('请先上传照片并选择口红颜色');
                    return;
                }
                
                // 创建下载链接
                const link = document.createElement('a');
                link.download = '口红试色效果.png';
                link.href = previewImage.src;
                link.click();
            });
            
            // 分享按钮事件
            shareBtn.addEventListener('click', function() {
                if (!previewImage.src || !selectedLipstick) {
                    alert('请先上传照片并选择口红颜色');
                    return;
                }
                
                // 更新卡片信息
                lipstickInfo.textContent = selectedLipstick.brand;
                
                // 使用预览图作为卡片图片
                cardImage.src = previewImage.src;
                cardPreview.style.display = 'block';
                
                // 滚动到卡片位置
                cardPreview.scrollIntoView({ behavior: 'smooth' });
            });
            
            // 处理图片上传
            function handleImageUpload(file) {
                if (!file.type.match('image.*')) {
                    alert('请上传图片文件');
                    return;
                }
                
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    originalImage = new Image();
                    originalImage.onload = function() {
                        // 显示预览图
                        previewImage.src = e.target.result;
                        previewImage.style.display = 'block';
                        placeholder.style.display = 'none';
                        
                        // 设置canvas尺寸
                        lipCanvas.width = originalImage.width;
                        lipCanvas.height = originalImage.height;
                        
                        // 重置选择
                        document.querySelectorAll('.lipstick-color').forEach(el => {
                            el.classList.remove('selected');
                        });
                        selectedLipstick = null;
                        cardPreview.style.display = 'none';
                    };
                    originalImage.src = e.target.result;
                };
                
                reader.readAsDataURL(file);
            }
            
            // 应用口红效果
            function applyLipstickEffect(color) {
                if (!originalImage) return;
                
                const ctx = lipCanvas.getContext('2d');
                
                // 清空canvas
                ctx.clearRect(0, 0, lipCanvas.width, lipCanvas.height);
                
                // 绘制原始图像
                ctx.drawImage(originalImage, 0, 0);
                
                // 模拟嘴唇位置（在真实应用中，这里使用人脸识别）
                const lipX = lipCanvas.width / 2;
                const lipY = lipCanvas.height / 2 + 50;
                const lipWidth = 120;
                const lipHeight = 40;
                
                // 绘制口红效果
                ctx.fillStyle = color;
                
                // 上嘴唇
                ctx.beginPath();
                ctx.moveTo(lipX - lipWidth/2, lipY);
                ctx.bezierCurveTo(
                    lipX - lipWidth/4, lipY - lipHeight/2,
                    lipX + lipWidth/4, lipY - lipHeight/2,
                    lipX + lipWidth/2, lipY
                );
                ctx.bezierCurveTo(
                    lipX + lipWidth/4, lipY + lipHeight/4,
                    lipX - lipWidth/4, lipY + lipHeight/4,
                    lipX - lipWidth/2, lipY
                );
                ctx.closePath();
                ctx.fill();
                
                // 下嘴唇
                ctx.beginPath();
                ctx.moveTo(lipX - lipWidth/2, lipY);
                ctx.bezierCurveTo(
                    lipX - lipWidth/4, lipY + lipHeight,
                    lipX + lipWidth/4, lipY + lipHeight,
                    lipX + lipWidth/2, lipY
                );
                ctx.bezierCurveTo(
                    lipX + lipWidth/4, lipY + lipHeight/4,
                    lipX - lipWidth/4, lipY + lipHeight/4,
                    lipX - lipWidth/2, lipY
                );
                ctx.closePath();
                ctx.fill();
                
                // 添加光泽效果
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.beginPath();
                ctx.ellipse(lipX, lipY - 10, 30, 15, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // 更新预览图
                previewImage.src = lipCanvas.toDataURL('image/png');
            }
            
            // 模拟初始状态：上传一张示例图片
            setTimeout(() => {
                const sampleImage = new Image();
                sampleImage.onload = function() {
                    originalImage = sampleImage;
                    previewImage.src = 'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&h=400&q=80';
                    previewImage.style.display = 'block';
                    placeholder.style.display = 'none';
                    
                    lipCanvas.width = sampleImage.width;
                    lipCanvas.height = sampleImage.height;
                    
                    // 自动选择第一个口红颜色
                    const firstColor = document.querySelector('.lipstick-color');
                    if (firstColor) {
                        firstColor.click();
                    }
                };
                sampleImage.src = 'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&h=400&q=80';
            }, 1000);
        });
    </script>
</body>
</html>
