<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix 经典代码雨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        canvas {
            display: block;
            background: #000;
        }

        .mode-selector {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 20, 0, 0.95);
            border: 2px solid #00ff00;
            border-radius: 25px;
            padding: 10px;
            z-index: 2000;
            display: flex;
            gap: 10px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }

        .title {
            background: rgba(0, 20, 0, 0.9);
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 15px 25px;
            border-radius: 25px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            text-shadow: 0 0 10px #00ff00;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }

        .controls {
            position: fixed;
            top: 90px;
            right: 20px;
            background: rgba(0, 20, 0, 0.95);
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 15px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            z-index: 1000;
            backdrop-filter: blur(5px);
            min-width: 220px;
        }

        .controls h3 {
            margin-bottom: 15px;
            text-align: center;
            text-shadow: 0 0 10px #00ff00;
            border-bottom: 1px solid #00ff00;
            padding-bottom: 8px;
        }

        .control-group {
            margin-bottom: 12px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            color: #00ff00;
            font-size: 11px;
        }

        .control-group input[type="range"] {
            width: 100%;
            background: #001100;
            border: 1px solid #00ff00;
            border-radius: 3px;
            height: 18px;
            outline: none;
            -webkit-appearance: none;
        }

        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: #00ff00;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 5px #00ff00;
        }

        .control-group select {
            width: 100%;
            background: #001100;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 5px;
            border-radius: 3px;
            outline: none;
            font-size: 11px;
        }

        .control-group button {
            background: #001100;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 8px 15px;
            border-radius: 3px;
            cursor: pointer;
            margin-right: 8px;
            margin-bottom: 5px;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
            font-size: 11px;
        }

        .control-group button:hover {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 10px #00ff00;
        }

        .value-display {
            color: #00ff00;
            font-weight: bold;
            text-shadow: 0 0 3px #00ff00;
        }

        .stats {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 20, 0, 0.95);
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .mode-transition {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0, 255, 0, 0.1) 0%, rgba(0, 0, 0, 0.9) 100%);
            z-index: 1500;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .mode-transition.active {
            opacity: 1;
        }

        @media (max-width: 768px) {
            .mode-selector {
                top: 10px;
                left: 10px;
                right: 10px;
                transform: none;
                flex-direction: column;
                gap: 5px;
            }
            
            .mode-btn {
                padding: 10px 15px;
                font-size: 12px;
            }
            
            .controls {
                top: 120px;
                right: 10px;
                left: 10px;
                padding: 12px;
                font-size: 11px;
            }
            
            .stats {
                bottom: 10px;
                left: 10px;
                right: 10px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>
    
    <!-- 标题 -->
    <div class="mode-selector">
        <div class="title">💧 Matrix 经典代码雨</div>
    </div>
    
    <!-- 控制面板 -->
    <div class="controls">
        <h3 id="controlTitle">Matrix 代码雨控制台</h3>
        
        <div class="control-group">
            <label>下落速度: <span class="value-display" id="speedValue">3</span></label>
            <input type="range" id="speed" min="1" max="10" value="3">
        </div>
        
        <div class="control-group">
            <label>字符密度: <span class="value-display" id="densityValue">0.8</span></label>
            <input type="range" id="density" min="0.1" max="2" step="0.1" value="0.8">
        </div>
        
        <div class="control-group">
            <label>字符大小: <span class="value-display" id="fontSizeValue">16</span>px</label>
            <input type="range" id="fontSize" min="10" max="30" value="16">
        </div>
        
        <div class="control-group">
            <label>拖尾长度: <span class="value-display" id="trailLengthValue">20</span></label>
            <input type="range" id="trailLength" min="5" max="50" value="20">
        </div>
        
        <div class="control-group">
            <label>淡出速度: <span class="value-display" id="fadeSpeedValue">0.05</span></label>
            <input type="range" id="fadeSpeed" min="0.01" max="0.2" step="0.01" value="0.05">
        </div>
        
        <div class="control-group">
            <label>颜色主题:</label>
            <select id="colorTheme">
                <option value="classic">经典绿色</option>
                <option value="blue">蓝色科技</option>
                <option value="red">红色警报</option>
                <option value="purple">紫色梦幻</option>
                <option value="rainbow">彩虹模式</option>
            </select>
        </div>
        
        <div class="control-group">
            <label>字符集:</label>
            <select id="charset">
                <option value="matrix">Matrix字符</option>
                <option value="japanese">日文字符</option>
                <option value="chinese">中文字符</option>
                <option value="binary">二进制</option>
                <option value="hex">十六进制</option>
            </select>
        </div>
        
        <div class="control-group">
            <button id="pauseBtn">暂停</button>
            <button id="resetBtn">重置</button>
            <button id="fullscreenBtn">全屏</button>
        </div>
    </div>
    
    <!-- 统计信息 -->
    <div class="stats">
        <div><strong>FPS:</strong> <span id="fpsCounter">60</span></div>
        <div><strong>字符数:</strong> <span id="charCount">0</span></div>
        <div><strong>状态:</strong> <span id="animationStatus">运行中</span></div>
    </div>

    <script>
        class MatrixRain {
            constructor() {
                this.canvas = document.getElementById('matrix-canvas');
                this.ctx = this.canvas.getContext('2d');
                
                // 配置参数
                this.config = {
                    speed: 3,
                    density: 0.8,
                    fontSize: 16,
                    trailLength: 20,
                    fadeSpeed: 0.05,
                    colorTheme: 'classic',
                    charset: 'matrix'
                };
                
                // 字符集定义
                this.charsets = {
                    matrix: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()_+-=[]{}|;:,.<>?',
                    japanese: 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン',
                    chinese: '的一是在不了有和人这中大为上个国我以要他时来用们生到作地于出就分对成会可主发年动同工也能下过子说产种面而方后多定行学法所民得经十三之进着等部度家电力里如水化高自二理起小物现实加量都两体制机当使点从业本去把性好应开它合还因由其些然前外天政四日那社义事平形相全表间样与关各重新线内数正心反你明看原又么利比或但质气第向道命此变条只没结解问意建月公无系军很情者最立代想已通并提直题党程展五果料象员革位入常文总次品式活设及管特件长求老头基资边流路级少图山统接知较将组见计别她手角期根论运农指几九区强放决西被干做必战先回则任取据处队南给色光门即保治北造百规热领七海口东导器压志世金增争济阶油思术极交受联什认六共权收证改清己美再采转更单风切打白教速花带安场身车例真务具万每目至达走积示议声报斗完类八离华名确才科张信马节话米整空元况今集温传土许步群广石记需段研界拉林律叫且究观越织装影算低持音众书布复容儿须际商非验连断深难近矿千周委素技备半办青省列习响约支般史感劳便团往酸历市克何除消构府称太准精值号率族维划选标写存候毛亲快效斯院查江型眼王按格养易置派层片始却专状育厂京识适属圆包火住调满县局照参红细引听该铁价严',
                    binary: '01',
                    hex: '0123456789ABCDEF'
                };
                
                // 颜色主题
                this.colorThemes = {
                    classic: { primary: '#00ff00', secondary: '#008800', accent: '#004400' },
                    blue: { primary: '#00aaff', secondary: '#0066aa', accent: '#003366' },
                    red: { primary: '#ff0044', secondary: '#aa0022', accent: '#660011' },
                    purple: { primary: '#aa00ff', secondary: '#6600aa', accent: '#330066' },
                    rainbow: { primary: '#ff0000', secondary: '#00ff00', accent: '#0000ff' }
                };
                
                // 动画状态
                this.drops = [];
                this.animationId = null;
                this.isPaused = false;
                this.time = 0;
                this.columns = 0;
                
                // 性能监控
                this.fps = 0;
                this.frameCount = 0;
                this.lastTime = performance.now();
                
                this.init();
            }
            
            init() {
                this.setupCanvas();
                this.setupEventListeners();
                this.setupControls();
                this.createRainDrops();
                this.animate();
            }
            
            setupCanvas() {
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());
            }
            
            resizeCanvas() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                this.columns = Math.floor(this.canvas.width / this.config.fontSize);
                this.createRainDrops();
            }
            
            setupEventListeners() {
                // 键盘控制
                document.addEventListener('keydown', (e) => {
                    switch(e.key) {
                        case ' ':
                            e.preventDefault();
                            this.togglePause();
                            break;
                        case 'r':
                        case 'R':
                            this.reset();
                            break;
                        case 'f':
                        case 'F':
                            this.toggleFullscreen();
                            break;
                    }
                });
            }
            
            setupControls() {
                // 速度控制
                const speedSlider = document.getElementById('speed');
                speedSlider.addEventListener('input', (e) => {
                    this.config.speed = parseInt(e.target.value);
                    document.getElementById('speedValue').textContent = e.target.value;
                });
                
                // 密度控制
                const densitySlider = document.getElementById('density');
                densitySlider.addEventListener('input', (e) => {
                    this.config.density = parseFloat(e.target.value);
                    document.getElementById('densityValue').textContent = e.target.value;
                    this.createRainDrops();
                });
                
                // 字体大小控制
                const fontSizeSlider = document.getElementById('fontSize');
                fontSizeSlider.addEventListener('input', (e) => {
                    this.config.fontSize = parseInt(e.target.value);
                    document.getElementById('fontSizeValue').textContent = e.target.value;
                    this.resizeCanvas();
                });
                
                // 拖尾长度控制
                const trailLengthSlider = document.getElementById('trailLength');
                trailLengthSlider.addEventListener('input', (e) => {
                    this.config.trailLength = parseInt(e.target.value);
                    document.getElementById('trailLengthValue').textContent = e.target.value;
                });
                
                // 淡出速度控制
                const fadeSpeedSlider = document.getElementById('fadeSpeed');
                fadeSpeedSlider.addEventListener('input', (e) => {
                    this.config.fadeSpeed = parseFloat(e.target.value);
                    document.getElementById('fadeSpeedValue').textContent = e.target.value;
                });
                
                // 颜色主题控制
                const colorThemeSelect = document.getElementById('colorTheme');
                colorThemeSelect.addEventListener('change', (e) => {
                    this.config.colorTheme = e.target.value;
                });
                
                // 字符集控制
                const charsetSelect = document.getElementById('charset');
                charsetSelect.addEventListener('change', (e) => {
                    this.config.charset = e.target.value;
                });
                
                // 按钮控制
                document.getElementById('pauseBtn').addEventListener('click', () => {
                    this.togglePause();
                });
                
                document.getElementById('resetBtn').addEventListener('click', () => {
                    this.reset();
                });
                
                document.getElementById('fullscreenBtn').addEventListener('click', () => {
                    this.toggleFullscreen();
                });
            }
            
            // 创建经典代码雨效果的雨滴
            createRainDrops() {
                this.drops = [];
                for (let i = 0; i < this.columns; i++) {
                    this.drops[i] = {
                        y: Math.random() * this.canvas.height,
                        speed: Math.random() * this.config.speed + 1,
                        chars: [],
                        opacity: Math.random() * 0.5 + 0.5
                    };
                    
                    // 为每一列创建字符序列
                    const charCount = Math.floor(Math.random() * this.config.trailLength) + 5;
                    for (let j = 0; j < charCount; j++) {
                        this.drops[i].chars.push({
                            char: this.getRandomChar(),
                            opacity: Math.max(0, 1 - j * 0.1),
                            changeTime: Math.random() * 100
                        });
                    }
                }
            }
            
            
            getRandomChar() {
                const chars = this.charsets[this.config.charset];
                return chars[Math.floor(Math.random() * chars.length)];
            }
            
            getColor(opacity = 1, isHead = false, brightness = 1) {
                const theme = this.colorThemes[this.config.colorTheme];
                
                if (this.config.colorTheme === 'rainbow') {
                    const hue = (this.time * 2) % 360;
                    return `hsla(${hue}, 100%, ${isHead ? 80 : 50}%, ${opacity})`;
                }
                
                const color = isHead ? theme.primary : theme.secondary;
                const hex = color.replace('#', '');
                const r = Math.floor(parseInt(hex.substr(0, 2), 16) * brightness);
                const g = Math.floor(parseInt(hex.substr(2, 2), 16) * brightness);
                const b = Math.floor(parseInt(hex.substr(4, 2), 16) * brightness);
                
                return `rgba(${r}, ${g}, ${b}, ${opacity})`;
            }
            
            
            // 绘制经典代码雨效果
            drawRain() {
                let charCount = 0;
                
                for (let i = 0; i < this.drops.length; i++) {
                    const drop = this.drops[i];
                    const x = i * this.config.fontSize + this.config.fontSize / 2;
                    
                    // 绘制字符序列
                    for (let j = 0; j < drop.chars.length; j++) {
                        const charData = drop.chars[j];
                        const y = drop.y - j * this.config.fontSize;
                        
                        if (y > 0 && y < this.canvas.height + this.config.fontSize) {
                            // 随机改变字符
                            charData.changeTime--;
                            if (charData.changeTime <= 0) {
                                charData.char = this.getRandomChar();
                                charData.changeTime = Math.random() * 100 + 50;
                            }
                            
                            // 设置颜色和透明度
                            const opacity = charData.opacity * drop.opacity;
                            const isHead = j === 0;
                            
                            this.ctx.font = `${this.config.fontSize}px 'Courier New', monospace`;
                            this.ctx.fillStyle = this.getColor(opacity, isHead);
                            this.ctx.textAlign = 'center';
                            this.ctx.textBaseline = 'middle';
                            
                            if (isHead) {
                                this.ctx.shadowColor = this.getColor(0.8, true);
                                this.ctx.shadowBlur = 10;
                            } else {
                                this.ctx.shadowBlur = 0;
                            }
                            
                            this.ctx.fillText(charData.char, x, y);
                            charCount++;
                        }
                    }
                    
                    // 更新下落位置
                    drop.y += drop.speed;
                    
                    // 重置到顶部
                    if (drop.y > this.canvas.height + drop.chars.length * this.config.fontSize) {
                        if (Math.random() < this.config.density) {
                            drop.y = -drop.chars.length * this.config.fontSize;
                            drop.speed = Math.random() * this.config.speed + 1;
                            drop.opacity = Math.random() * 0.5 + 0.5;
                        }
                    }
                }
                
                this.ctx.shadowBlur = 0;
                return charCount;
            }
            
            
            animate() {
                if (this.isPaused) {
                    this.animationId = requestAnimationFrame(() => this.animate());
                    return;
                }
                
                // 性能监控
                this.updateFPS();
                
                // 清除画布
                this.ctx.fillStyle = `rgba(0, 0, 0, ${this.config.fadeSpeed})`;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // 绘制经典代码雨
                const charCount = this.drawRain();
                
                // 更新字符计数
                document.getElementById('charCount').textContent = charCount;
                
                // 更新时间
                this.time++;
                
                this.animationId = requestAnimationFrame(() => this.animate());
            }
            
            updateFPS() {
                this.frameCount++;
                const currentTime = performance.now();
                
                if (currentTime - this.lastTime >= 1000) {
                    this.fps = Math.round((this.frameCount * 1000) / (currentTime - this.lastTime));
                    document.getElementById('fpsCounter').textContent = this.fps;
                    this.frameCount = 0;
                    this.lastTime = currentTime;
                }
            }
            
            togglePause() {
                this.isPaused = !this.isPaused;
                const btn = document.getElementById('pauseBtn');
                const status = document.getElementById('animationStatus');
                
                if (this.isPaused) {
                    btn.textContent = '继续';
                    status.textContent = '已暂停';
                } else {
                    btn.textContent = '暂停';
                    status.textContent = '运行中';
                    this.animate();
                }
            }
            
            reset() {
                this.time = 0;
                this.createRainDrops();
            }
            
            toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            }
        }
        
        // 初始化Matrix经典代码雨动画
        window.addEventListener('load', () => {
            new MatrixRain();
        });
        
        // 防止右键菜单
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });
    </script>
</body>
</html>
