            return randomIndex;
        }

        function displayMovie(index) {
            const movie = movies[index];
            movieTitle.textContent = movie.title;
            
            // 创建星级评价
            let stars = '';
            const fullStars = Math.floor(movie.rating);
            const hasHalfStar = movie.rating % 1 >= 0.5;
            
            for (let i = 0; i < fullStars; i++) {
                stars += '★';
            }
            
            if (hasHalfStar) {
                stars += '☆';
            }
            
            rating.textContent = `推荐指数: ${stars} (${movie.rating}/5)`;
            reason.textContent = `推荐理由: ${movie.reason}`;
            description.textContent = `简介: ${movie.description}`;
            
            movieInfo.style.display = 'block';
        }

        recommendBtn.addEventListener('click', function() {
            currentMovieIndex = getRandomMovieIndex();
            displayMovie(currentMovieIndex);
            recommendBtn.style.display = 'none';
        });

        changeBtn.addEventListener('click', function() {
            currentMovieIndex = getRandomMovieIndex();
            displayMovie(currentMovieIndex);
        });
    </script>
</body>
</html>
