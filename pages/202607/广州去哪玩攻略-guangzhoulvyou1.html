                address: "广州市越秀区麓湖路13号",
                transport: "地铁5号线至小北站",
                ticket: "免费",
                time: "9:00-17:00（周一闭馆）"
            }
        ];
        
        // 显示随机景点
        function showRandomAttraction() {
            const randomIndex = Math.floor(Math.random() * attractions.length);
            const attraction = attractions[randomIndex];
            
            document.getElementById('attractionName').textContent = attraction.name;
            document.getElementById('attractionDesc').textContent = attraction.desc;
            document.getElementById('attractionAddress').textContent = attraction.address;
            document.getElementById('attractionTransport').textContent = attraction.transport;
            document.getElementById('attractionTicket').textContent = attraction.ticket;
            document.getElementById('attractionTime').textContent = attraction.time;
            
            document.getElementById('result').style.display = 'block';
        }
        
        // 页面加载完成后绑定事件
        document.addEventListener('DOMContentLoaded', function() {
            // 获取按钮元素
            const generateBtn = document.getElementById('generateBtn');
            const changeBtn = document.getElementById('changeBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const closeModal = document.getElementById('closeModal');
            const modal = document.getElementById('modal');
            
            // 绑定事件
            generateBtn.addEventListener('click', showRandomAttraction);
            changeBtn.addEventListener('click', showRandomAttraction);
            
            downloadBtn.addEventListener('click', function() {
                modal.style.display = 'flex';
            });
            
            closeModal.addEventListener('click', function() {
                modal.style.display = 'none';
            });
            
            // 点击模态框外部关闭
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
