<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水果连连看</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #f5e6ca;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        
        .game-container {
            width: 100%;
            max-width: 600px;
        }
        
        h1 {
            color: #e74c3c;
            margin: 10px 0;
            text-align: center;
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            background: white;
            padding: 10px;
            border-radius: 10px;
        }
        
        .info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .game-board {
            width: 100%;
            aspect-ratio: 1;
            display: grid;
            background: #e67e22;
            padding: 5px;
            border-radius: 10px;
            gap: 2px;
        }
        
        .tile {
            background: white;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 2rem;
        }
        
        .tile.selected {
            background: #f1c40f;
        }
        
        .tile.matched {
            visibility: hidden;
        }
        
        .controls {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            color: white;
            background: #3498db;
            cursor: pointer;
        }
        
        .btn-shuffle {
            background: #9b59b6;
        }
        
        .btn-restart {
            background: #e74c3c;
        }
        
        .btn-download {
            background: #1abc9c;
        }
        
        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        
        .game-over.show {
            opacity: 1;
            pointer-events: all;
        }
        
        .game-over-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .download-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 100;
        }
        
        .download-modal.show {
            opacity: 1;
            pointer-events: all;
        }
        
        .download-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 90%;
            width: 400px;
        }
        
        .download-link {
            background: #f5f5f5;
            padding: 10px;
            margin: 15px 0;
            border-radius: 5px;
            word-break: break-all;
        }
        
        .copy-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
        }
        
        .close-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>水果连连看</h1>
        
        <div class="game-info">
            <div class="info-item">
                <div>时间</div>
                <div id="time">00:00</div>
            </div>
            <div class="info-item">
                <div>分数</div>
                <div id="score">0</div>
            </div>
            <div class="info-item">
                <div>剩余</div>
                <div id="remaining">32</div>
            </div>
        </div>
        
        <div class="game-board" id="board"></div>
        
        <div class="controls">
            <button class="btn btn-shuffle" id="shuffle-btn">重排</button>
            <button class="btn btn-restart" id="restart-btn">重玩</button>
            <button class="btn btn-download" id="download-btn">下载游戏</button>
        </div>
    </div>
    
    <div class="game-over" id="game-over">
        <div class="game-over-content">
            <h2>游戏结束!</h2>
            <p>你的分数: <span id="final-score">0</span></p>
            <p>用时: <span id="final-time">00:00</span></p>
            <button class="btn btn-restart" id="restart-end-btn">再玩一次</button>
        </div>
    </div>
    
    <div class="download-modal" id="download-modal">
        <div class="download-content">
            <p>复制以下夸克网盘链接在浏览器打开可以转存下载游戏</p>
            <div class="download-link" id="download-link">https://pan.quark.cn/s/a6ecc4988679</div>
            <button class="copy-btn" id="copy-btn">复制链接</button>
            <button class="close-btn" id="close-modal-btn">关闭</button>
        </div>
    </div>
    
    <script>
        // 游戏状态
        const gameState = {
            board: [],
            size: { rows: 8, cols: 8 },
            selectedTile: null,
            score: 0,
            time: 0,
            timer: null,
            remainingPairs: 32,
            isPlaying: false,
            fruitTypes: 16
        };

        // DOM 元素
        const elements = {
            board: document.getElementById('board'),
            timeDisplay: document.getElementById('time'),
            scoreDisplay: document.getElementById('score'),
            remainingDisplay: document.getElementById('remaining'),
            shuffleBtn: document.getElementById('shuffle-btn'),
            restartBtn: document.getElementById('restart-btn'),
            gameOver: document.getElementById('game-over'),
            finalScore: document.getElementById('final-score'),
            finalTime: document.getElementById('final-time'),
            restartEndBtn: document.getElementById('restart-end-btn'),
            downloadBtn: document.getElementById('download-btn'),
            downloadModal: document.getElementById('download-modal'),
            copyBtn: document.getElementById('copy-btn'),
            closeModalBtn: document.getElementById('close-modal-btn'),
            downloadLink: document.getElementById('download-link')
        };

        // 水果图标
        const fruits = [
            '🍎', '🍐', '🍊', '🍋', '🍌', '🍉', '🍇', '🍓',
            '🍈', '🍒', '🍑', '🥭', '🍍', '🥥', '🥝', '🍅'
        ];

        // 初始化游戏
        function initGame() {
            adjustBoardSize();
            resetGameState();
            createBoard();
            startGame();
            setupEventListeners();
        }

        // 调整游戏板大小
        function adjustBoardSize() {
            const width = window.innerWidth;
            if (width <= 400) {
                gameState.size.rows = 10;
                gameState.size.cols = 6;
                gameState.remainingPairs = 30;
                elements.remainingDisplay.textContent = '30';
            } else {
                gameState.size.rows = 8;
                gameState.size.cols = 8;
                gameState.remainingPairs = 32;
                elements.remainingDisplay.textContent = '32';
            }
        }

        // 重置游戏状态
        function resetGameState() {
            gameState.board = [];
            gameState.selectedTile = null;
            gameState.score = 0;
            gameState.time = 0;
            gameState.isPlaying = false;
            
            if (gameState.timer) {
                clearInterval(gameState.timer);
                gameState.timer = null;
            }
            
            elements.scoreDisplay.textContent = '0';
            elements.timeDisplay.textContent = '00:00';
            elements.board.innerHTML = '';
            elements.gameOver.classList.remove('show');
        }

        // 创建游戏板
        function createBoard() {
            // 创建配对的水果数组
            const pairs = [];
            const totalPairs = gameState.size.rows * gameState.size.cols / 2;
            const types = Math.min(gameState.fruitTypes, totalPairs);
            
            // 确保每种水果有相同的数量
            const fruitsPerType = Math.floor(totalPairs / types);
            let extraFruits = totalPairs % types;
            
            for (let i = 0; i < types; i++) {
                const count = i < extraFruits ? fruitsPerType + 1 : fruitsPerType;
                for (let j = 0; j < count; j++) {
                    pairs.push(i);
                    pairs.push(i);
                }
            }
            
            // 随机打乱数组
            shuffleArray(pairs);
            
            // 创建游戏板
            elements.board.style.gridTemplateColumns = `repeat(${gameState.size.cols}, 1fr)`;
            elements.board.style.gridTemplateRows = `repeat(${gameState.size.rows}, 1fr)`;
            
            // 创建瓦片
            for (let i = 0; i < gameState.size.rows; i++) {
                gameState.board[i] = [];
                for (let j = 0; j < gameState.size.cols; j++) {
                    const index = i * gameState.size.cols + j;
                    const fruitIndex = pairs[index];
                    
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.row = i;
                    tile.dataset.col = j;
                    tile.dataset.type = fruitIndex;
                    tile.textContent = fruits[fruitIndex];
                    
                    gameState.board[i][j] = {
                        element: tile,
                        type: fruitIndex,
                        matched: false
                    };
                    
                    elements.board.appendChild(tile);
                }
            }
        }

        // 开始游戏
        function startGame() {
            gameState.isPlaying = true;
            gameState.time = 0;
            updateTimeDisplay();
            
            gameState.timer = setInterval(() => {
                gameState.time++;
                updateTimeDisplay();
            }, 1000);
        }

        // 更新时间显示
        function updateTimeDisplay() {
            const minutes = Math.floor(gameState.time / 60).toString().padStart(2, '0');
            const seconds = (gameState.time % 60).toString().padStart(2, '0');
            elements.timeDisplay.textContent = `${minutes}:${seconds}`;
        }

        // 设置事件监听器
        function setupEventListeners() {
            // 瓦片点击事件
            elements.board.addEventListener('click', handleTileClick);
            elements.board.addEventListener('touchstart', handleTileTouch, { passive: true });
            
            // 按钮事件
            elements.shuffleBtn.addEventListener('click', shuffleBoard);
            elements.restartBtn.addEventListener('click', initGame);
            elements.restartEndBtn.addEventListener('click', initGame);
            
            // 下载按钮事件
            elements.downloadBtn.addEventListener('click', showDownloadModal);
            elements.copyBtn.addEventListener('click', copyDownloadLink);
            elements.closeModalBtn.addEventListener('click', hideDownloadModal);
            
            // 窗口大小调整
            window.addEventListener('resize', adjustBoardSize);
        }

        // 处理瓦片点击
        function handleTileClick(e) {
            if (!gameState.isPlaying) return;
            
            const tile = e.target.closest('.tile');
            if (!tile) return;
            
            selectTile(tile);
        }

        // 处理瓦片触摸
        function handleTileTouch(e) {
            if (!gameState.isPlaying) return;
            
            e.preventDefault();
            const touch = e.touches[0];
            const tile = document.elementFromPoint(touch.clientX, touch.clientY);
            
            if (tile && tile.classList.contains('tile')) {
                selectTile(tile);
            }
        }

        // 选择瓦片
        function selectTile(tile) {
            const row = parseInt(tile.dataset.row);
            const col = parseInt(tile.dataset.col);
            const tileData = gameState.board[row][col];
            
            // 如果瓦片已匹配或已选中，则忽略
            if (tileData.matched || (gameState.selectedTile && gameState.selectedTile.row === row && gameState.selectedTile.col === col)) {
                return;
            }
            
            // 如果已经有选中的瓦片，尝试匹配
            if (gameState.selectedTile) {
                const prevRow = gameState.selectedTile.row;
                const prevCol = gameState.selectedTile.col;
                const prevTile = gameState.board[prevRow][prevCol];
                
                // 检查是否可以连接
                if (tileData.type === prevTile.type && canConnect(prevRow, prevCol, row, col)) {
                    // 匹配成功
                    matchTiles(prevRow, prevCol, row, col);
                } else {
                    // 匹配失败
                    prevTile.element.classList.remove('selected');
                    gameState.selectedTile = null;
                    selectTile(tile); // 重新选择当前瓦片
                }
            } else {
                // 选中瓦片
                tileData.element.classList.add('selected');
                gameState.selectedTile = { row, col };
            }
        }

        // 检查两个瓦片是否可以连接
        function canConnect(row1, col1, row2, col2) {
            // 如果两个瓦片位置相同，返回false
            if (row1 === row2 && col1 === col2) return false;
            
            // 检查是否为直线连接（无拐点）
            if (isStraightLineConnectable(row1, col1, row2, col2)) {
                return true;
            }
            
            // 检查单拐点连接
            if (isOneCornerConnectable(row1, col1, row2, col2)) {
                return true;
            }
            
            // 检查双拐点连接
            if (isTwoCornerConnectable(row1, col1, row2, col2)) {
                return true;
            }
            
            return false;
        }
        
        // 直线连接检查
        function isStraightLineConnectable(row1, col1, row2, col2) {
            // 同一行
            if (row1 === row2) {
                const minCol = Math.min(col1, col2);
                const maxCol = Math.max(col1, col2);
                
                // 检查中间是否有障碍物
                for (let col = minCol + 1; col < maxCol; col++) {
                    if (!gameState.board[row1][col].matched) {
                        return false;
                    }
                }
                return true;
            }
            
            // 同一列
            if (col1 === col2) {
                const minRow = Math.min(row1, row2);
                const maxRow = Math.max(row1, row2);
                
                // 检查中间是否有障碍物
                for (let row = minRow + 1; row < maxRow; row++) {
                    if (!gameState.board[row][col1].matched) {
                        return false;
                    }
                }
                return true;
            }
            
            return false;
        }
        
        // 单拐点连接检查
        function isOneCornerConnectable(row1, col1, row2, col2) {
            // 拐点1：(row1, col2)
            if ((gameState.board[row1][col2].matched || (row1 === row2 && col1 === col2)) && 
                isStraightLineConnectable(row1, col1, row1, col2) && 
                isStraightLineConnectable(row1, col2, row2, col2)) {
                return true;
            }
            
            // 拐点2：(row2, col1)
            if ((gameState.board[row2][col1].matched || (row1 === row2 && col1 === col2)) && 
                isStraightLineConnectable(row1, col1, row2, col1) && 
                isStraightLineConnectable(row2, col1, row2, col2)) {
                return true;
            }
            
            return false;
        }
        
        // 双拐点连接检查
        function isTwoCornerConnectable(row1, col1, row2, col2) {
            // 检查所有可能的双拐点路径
            for (let row = -1; row <= gameState.size.rows; row++) {
                if (row === row1 || row === row2) continue;
                
                // 检查垂直-水平-垂直路径
                if ((row < 0 || row >= gameState.size.rows || gameState.board[row][col1].matched) &&
                    (row < 0 || row >= gameState.size.rows || gameState.board[row][col2].matched) &&
                    isStraightLineConnectable(row1, col1, row, col1) &&
                    isStraightLineConnectable(row, col1, row, col2) &&
                    isStraightLineConnectable(row, col2, row2, col2)) {
                    return true;
                }
            }
            
            for (let col = -1; col <= gameState.size.cols; col++) {
                if (col === col1 || col === col2) continue;
                
                // 检查水平-垂直-水平路径
                if ((col < 0 || col >= gameState.size.cols || gameState.board[row1][col].matched) &&
                    (col < 0 || col >= gameState.size.cols || gameState.board[row2][col].matched) &&
                    isStraightLineConnectable(row1, col1, row1, col) &&
                    isStraightLineConnectable(row1, col, row2, col) &&
                    isStraightLineConnectable(row2, col, row2, col2)) {
                    return true;
                }
            }
            
            return false;
        }

        // 匹配瓦片
        function matchTiles(row1, col1, row2, col2) {
            const tile1 = gameState.board[row1][col1];
            const tile2 = gameState.board[row2][col2];
            
            // 标记为已匹配
            tile1.matched = true;
            tile2.matched = true;
            
            // 添加匹配动画类
            tile1.element.classList.add('matched');
            tile2.element.classList.add('matched');
            
            // 清除选中状态
            tile1.element.classList.remove('selected');
            tile2.element.classList.remove('selected');
            
            // 更新分数和剩余对数
            gameState.score += 10;
            gameState.remainingPairs--;
            
            elements.scoreDisplay.textContent = gameState.score;
            elements.remainingDisplay.textContent = gameState.remainingPairs;
            
            // 重置选中的瓦片
            gameState.selectedTile = null;
            
            // 检查游戏是否结束
            if (gameState.remainingPairs === 0) {
                endGame();
            }
        }

        // 结束游戏
        function endGame() {
            gameState.isPlaying = false;
            clearInterval(gameState.timer);
            
            elements.finalScore.textContent = gameState.score;
            elements.finalTime.textContent = elements.timeDisplay.textContent;
            elements.gameOver.classList.add('show');
        }

        // 重排游戏板
        function shuffleBoard() {
            if (!gameState.isPlaying) return;
            
            // 收集所有未匹配的瓦片
            const unmatchedTiles = [];
            const types = [];
            
            for (let i = 0; i < gameState.size.rows; i++) {
                for (let j = 0; j < gameState.size.cols; j++) {
                    if (!gameState.board[i][j].matched) {
                        unmatchedTiles.push(gameState.board[i][j]);
                        types.push(gameState.board[i][j].type);
                    }
                }
            }
            
            // 随机打乱类型
            shuffleArray(types);
            
            // 重新分配类型
            for (let i = 0; i < unmatchedTiles.length; i++) {
                unmatchedTiles[i].type = types[i];
                unmatchedTiles[i].element.dataset.type = types[i];
                unmatchedTiles[i].element.textContent = fruits[types[i]];
            }
            
            // 清除任何选中的瓦片
            if (gameState.selectedTile) {
                const { row, col } = gameState.selectedTile;
                gameState.board[row][col].element.classList.remove('selected');
                gameState.selectedTile = null;
            }
        }

        // 显示下载弹窗
        function showDownloadModal() {
            elements.downloadModal.classList.add('show');
        }

        // 隐藏下载弹窗
        function hideDownloadModal() {
            elements.downloadModal.classList.remove('show');
        }

        // 复制下载链接
        function copyDownloadLink() {
            const textarea = document.createElement('textarea');
            textarea.value = elements.downloadLink.textContent;
            textarea.style.position = 'fixed';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    elements.copyBtn.textContent = '已复制';
                    setTimeout(() => {
                        elements.copyBtn.textContent = '复制链接';
                    }, 2000);
                } else {
                    alert('复制失败，请手动选择链接后按Ctrl+C复制');
                }
            } catch (err) {
                console.error('复制出错:', err);
                alert('复制出错，请手动选择链接后按Ctrl+C复制');
            }
            
            document.body.removeChild(textarea);
        }

        // 辅助函数：随机打乱数组
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 初始化游戏
        window.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
