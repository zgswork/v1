<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电子骰子游戏工具</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        header {
            padding: 30px 40px;
            background: linear-gradient(90deg, #6b7eff 0%, #8e54e9 100%);
            color: white;
            text-align: center;
        }
        
        header h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }
        
        header p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .main-content {
            display: flex;
            padding: 30px;
            gap: 30px;
        }
        
        .settings-panel {
            flex: 1;
            background: #f8f9ff;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.03);
        }
        
        .game-area {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .panel-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .panel-title i {
            background: #6b7eff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .setting-group {
            margin-bottom: 25px;
        }
        
        .setting-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }
        
        .setting-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #e0e4ee;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .setting-group input:focus {
            border-color: #6b7eff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(107, 126, 255, 0.2);
        }
        
        .color-picker {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        
        .color-option {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        
        .color-option.active {
            transform: scale(1.15);
            border-color: #fff;
            box-shadow: 0 0 0 2px #6b7eff;
        }
        
        .players-container {
            background: #f8f9ff;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.03);
        }
        
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .player-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            border-left: 4px solid #6b7eff;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .player-card.active {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(107, 126, 255, 0.3);
            border-left: 4px solid #ff6b6b;
        }
        
        .player-header {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px;
        }
        
        .player-color {
            width: 24px;
            height: 24px;
            border-radius: 50%;
        }
        
        .player-name {
            font-weight: 600;
            font-size: 1.1rem;
        }
        
        .dice-area {
            background: #f8f9ff;
            border-radius: 18px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.03);
        }
        
        .dice-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        
        .dice {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 700;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            color: #2c3e50;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .dice.rolling {
            animation: rollDice 0.8s ease-out;
        }
        
        .dice.six {
            background: #ffeb3b;
            box-shadow: 0 8px 20px rgba(255, 235, 59, 0.3);
        }
        
        @keyframes rollDice {
            0% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-50px) rotate(90deg); }
            50% { transform: translateY(0) rotate(180deg); }
            75% { transform: translateY(-30px) rotate(270deg); }
            100% { transform: translateY(0) rotate(360deg); }
        }
        
        .result-display {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 20px 0;
            color: #2c3e50;
        }
        
        .result-display span {
            color: #6b7eff;
        }
        
        .roll-btn {
            background: linear-gradient(90deg, #ff6b6b 0%, #ff8e53 100%);
            color: white;
            border: none;
            padding: 16px 45px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.4);
            margin-top: 10px;
        }
        
        .roll-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 107, 107, 0.5);
        }
        
        .roll-btn:active {
            transform: translateY(1px);
        }
        
        .roll-btn:disabled {
            background: #e0e4ee;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
        
        .history-panel {
            background: #f8f9ff;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.03);
        }
        
        .history-list {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 15px;
            padding-right: 10px;
        }
        
        .history-item {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.03);
        }
        
        .history-player {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .history-details {
            display: flex;
            gap: 15px;
        }
        
        .history-dice {
            display: flex;
            gap: 5px;
        }
        
        .dice-point {
            width: 24px;
            height: 24px;
            background: #eef1ff;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .dice-point.six {
            background: #fff9c4;
            font-weight: 700;
        }
        
        .history-total {
            font-weight: 700;
            color: #ff6b6b;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }
        
        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            font-size: 1rem;
        }
        
        .btn-primary {
            background: linear-gradient(90deg, #6b7eff 0%, #8e54e9 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(107, 126, 255, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(107, 126, 255, 0.4);
        }
        
        .btn-outline {
            background: transparent;
            border: 1px solid #e0e4ee;
            color: #555;
        }
        
        .btn-outline:hover {
            background: #f8f9ff;
        }
        
        .extra-rules {
            background: #fff9e6;
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
            border-left: 4px solid #ffc107;
        }
        
        .extra-rules h4 {
            margin-top: 0;
            color: #ff9800;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        @media (max-width: 900px) {
            .main-content {
                flex-direction: column;
            }
        }
        
        @media (max-width: 600px) {
            header {
                padding: 20px;
            }
            
            header h1 {
                font-size: 1.8rem;
            }
            
            .main-content {
                padding: 20px;
            }
            
            .dice {
                width: 60px;
                height: 60px;
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-dice"></i> 电子骰子游戏工具</h1>
            <p>自定义骰子数量、添加玩家、轮流掷骰子并记录每次结果</p>
        </header>
        
        <div class="main-content">
            <div class="settings-panel">
                <h2 class="panel-title"><i class="fas fa-cog"></i> 游戏设置</h2>
                
                <div class="setting-group">
                    <label for="diceCount">骰子数量</label>
                    <input type="number" id="diceCount" min="1" max="6" value="3">
                </div>
                
                <div class="setting-group">
                    <label for="playerCount">玩家数量</label>
                    <input type="number" id="playerCount" min="1" max="6" value="2">
                </div>
                
                <div class="extra-rules">
                    <h4><i class="fas fa-star"></i> 特殊规则</h4>
                    <p>当使用1个骰子时，掷出6点的玩家可以继续掷骰，直到不是6点为止。</p>
                </div>
                
                <div class="action-buttons">
                    <button class="btn btn-primary" id="applySettings">
                        <i class="fas fa-sync-alt"></i> 应用设置
                    </button>
                    <button class="btn btn-outline" id="resetGame">
                        <i class="fas fa-redo"></i> 重置游戏
                    </button>
                </div>
            </div>
            
            <div class="game-area">
                <div class="players-container">
                    <h2 class="panel-title"><i class="fas fa-users"></i> 玩家列表</h2>
                    <div class="players-grid" id="playersGrid">
                        <!-- 玩家卡片将通过JS动态生成 -->
                    </div>
                </div>
                
                <div class="dice-area">
                    <h2 class="panel-title"><i class="fas fa-dice-d20"></i> 掷骰子</h2>
                    <p id="currentPlayer">等待游戏开始...</p>
                    
                    <div class="dice-container" id="diceContainer">
                        <!-- 骰子将通过JS动态生成 -->
                    </div>
                    
                    <div class="result-display">
                        总计点数: <span id="totalPoints">0</span>
                    </div>
                    
                    <button class="roll-btn" id="rollBtn" disabled>
                        <i class="fas fa-dice"></i> 掷骰子
                    </button>
                </div>
                
                <div class="history-panel">
                    <h2 class="panel-title"><i class="fas fa-history"></i> 历史记录</h2>
                    <div class="history-list" id="historyList">
                        <!-- 历史记录将通过JS动态生成 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 游戏状态
        const gameState = {
            diceCount: 3,
            players: [
                { id: 1, name: "玩家1", color: "#FF6B6B", active: true },
                { id: 2, name: "玩家2", color: "#6B7EFF" }
            ],
            currentPlayerIndex: 0,
            history: [],
            isExtraRoll: false // 标记是否为额外掷骰
        };
        
        // DOM元素
        const diceCountInput = document.getElementById('diceCount');
        const playerCountInput = document.getElementById('playerCount');
        const applySettingsBtn = document.getElementById('applySettings');
        const resetGameBtn = document.getElementById('resetGame');
        const rollBtn = document.getElementById('rollBtn');
        const playersGrid = document.getElementById('playersGrid');
        const diceContainer = document.getElementById('diceContainer');
        const totalPointsEl = document.getElementById('totalPoints');
        const historyList = document.getElementById('historyList');
        const currentPlayerEl = document.getElementById('currentPlayer');
        
        // 预定义颜色选项
        const colorOptions = [
            '#FF6B6B', '#6B7EFF', '#4CAF50', '#FFC107', 
            '#9C27B0', '#00BCD4', '#FF5722', '#795548'
        ];
        
        // 初始化游戏
        function initGame() {
            renderPlayers();
            renderDice();
            updateCurrentPlayer();
            rollBtn.disabled = false;
        }
        
        // 渲染玩家列表
        function renderPlayers() {
            playersGrid.innerHTML = '';
            
            gameState.players.forEach((player, index) => {
                const playerCard = document.createElement('div');
                playerCard.className = `player-card ${player.active ? 'active' : ''}`;
                playerCard.innerHTML = `
                    <div class="player-header">
                        <div class="player-color" style="background: ${player.color}"></div>
                        <div class="player-name">${player.name}</div>
                    </div>
                    <div class="player-actions">
                        <input type="text" class="player-name-input" data-id="${player.id}" 
                               value="${player.name}" placeholder="玩家名称">
                        <div class="color-picker">
                            ${colorOptions.map(color => `
                                <div class="color-option ${player.color === color ? 'active' : ''}" 
                                     style="background: ${color}" 
                                     data-player="${player.id}" 
                                     data-color="${color}"></div>
                            `).join('')}
                        </div>
                    </div>
                `;
                playersGrid.appendChild(playerCard);
            });
            
            // 添加事件监听器
            document.querySelectorAll('.player-name-input').forEach(input => {
                input.addEventListener('change', function() {
                    const playerId = parseInt(this.dataset.id);
                    const player = gameState.players.find(p => p.id === playerId);
                    if (player) player.name = this.value;
                    updateCurrentPlayer();
                });
            });
            
            document.querySelectorAll('.color-option').forEach(option => {
                option.addEventListener('click', function() {
                    const playerId = parseInt(this.dataset.player);
                    const color = this.dataset.color;
                    const player = gameState.players.find(p => p.id === playerId);
                    
                    if (player) {
                        player.color = color;
                        renderPlayers();
                    }
                });
            });
        }
        
        // 渲染骰子
        function renderDice() {
            diceContainer.innerHTML = '';
            
            for (let i = 0; i < gameState.diceCount; i++) {
                const dice = document.createElement('div');
                dice.className = 'dice';
                dice.textContent = '?';
                diceContainer.appendChild(dice);
            }
        }
        
        // 更新当前玩家显示
        function updateCurrentPlayer() {
            const currentPlayer = gameState.players[gameState.currentPlayerIndex];
            currentPlayerEl.textContent = `当前玩家: ${currentPlayer.name}`;
            currentPlayerEl.style.color = currentPlayer.color;
            renderPlayers();
        }
        
        // 掷骰子动画和结果
        function rollDice() {
            const diceElements = document.querySelectorAll('.dice');
            const results = [];
            let total = 0;
            
            // 禁用掷骰按钮
            rollBtn.disabled = true;
            rollBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 掷骰中...';
            
            // 添加滚动动画
            diceElements.forEach(dice => {
                dice.classList.add('rolling');
                dice.textContent = '?';
                dice.classList.remove('six');
            });
            
            // 生成随机点数
            setTimeout(() => {
                diceElements.forEach((dice, index) => {
                    const result = Math.floor(Math.random() * 6) + 1;
                    results.push(result);
                    total += result;
                    
                    setTimeout(() => {
                        dice.textContent = result;
                        dice.classList.remove('rolling');
                        
                        // 如果是6点，添加特殊样式
                        if (result === 6) {
                            dice.classList.add('six');
                        }
                        
                        // 最后一个骰子动画结束时处理结果
                        if (index === diceElements.length - 1) {
                            totalPointsEl.textContent = total;
                            
                            // 检查是否需要额外掷骰（1个骰子且结果为6）
                            if (gameState.diceCount === 1 && results[0] === 6 && !gameState.isExtraRoll) {
                                gameState.isExtraRoll = true;
                                rollBtn.disabled = false;
                                rollBtn.innerHTML = '<i class="fas fa-dice"></i> 继续掷骰 (6点奖励)';
                                currentPlayerEl.textContent = `${currentPlayerEl.textContent} (6点奖励回合)`;
                            } else {
                                saveResult(results, total);
                                rollBtn.disabled = false;
                                rollBtn.innerHTML = '<i class="fas fa-dice"></i> 掷骰子';
                                
                                // 如果不是额外掷骰，切换到下一个玩家
                                if (!gameState.isExtraRoll) {
                                    setTimeout(() => {
                                        gameState.currentPlayerIndex = 
                                            (gameState.currentPlayerIndex + 1) % gameState.players.length;
                                        updateCurrentPlayer();
                                    }, 1000);
                                } else {
                                    // 如果是额外掷骰但这次不是6点，重置状态并切换玩家
                                    if (results[0] !== 6) {
                                        gameState.isExtraRoll = false;
                                        setTimeout(() => {
                                            gameState.currentPlayerIndex = 
                                                (gameState.currentPlayerIndex + 1) % gameState.players.length;
                                            updateCurrentPlayer();
                                        }, 1000);
                                    } else {
                                        // 如果又是6点，保持当前玩家
                                        currentPlayerEl.textContent = `${currentPlayerEl.textContent.replace(' (6点奖励回合)', '')} (6点奖励回合)`;
                                    }
                                }
                            }
                        }
                    }, 600 + (index * 200));
                });
            }, 500);
        }
        
        // 保存结果到历史记录
        function saveResult(results, total) {
            const currentPlayer = gameState.players[gameState.currentPlayerIndex];
            const now = new Date();
            const timeString = now.toLocaleTimeString();
            
            const historyItem = {
                playerId: currentPlayer.id,
                playerName: currentPlayer.name,
                playerColor: currentPlayer.color,
                diceResults: [...results],
                total: total,
                timestamp: timeString,
                isExtraRoll: gameState.isExtraRoll
            };
            
            gameState.history.unshift(historyItem);
            renderHistory();
        }
        
        // 渲染历史记录
        function renderHistory() {
            historyList.innerHTML = '';
            
            gameState.history.slice(0, 10).forEach(item => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                
                historyItem.innerHTML = `
                    <div class="history-player">
                        <div class="player-color" style="background: ${item.playerColor}; width: 16px; height: 16px;"></div>
                        <div>${item.playerName}${item.isExtraRoll ? ' (奖励回合)' : ''}</div>
                    </div>
                    <div class="history-details">
                        <div class="history-dice">
                            ${item.diceResults.map(result => `
                                <div class="dice-point ${result === 6 ? 'six' : ''}">${result}</div>
                            `).join('')}
                        </div>
                        <div class="history-total">${item.total}</div>
                        <div class="history-time">${item.timestamp}</div>
                    </div>
                `;
                
                historyList.appendChild(historyItem);
            });
            
            if (gameState.history.length === 0) {
                historyList.innerHTML = '<div class="no-history">暂无历史记录</div>';
            }
        }
        
        // 应用设置
        function applySettings() {
            const diceCount = parseInt(diceCountInput.value) || 3;
            const playerCount = parseInt(playerCountInput.value) || 2;
            
            if (diceCount < 1) diceCount = 1;
            if (diceCount > 6) diceCount = 6;
            if (playerCount < 1) playerCount = 1;
            if (playerCount > 6) playerCount = 6;
            
            gameState.diceCount = diceCount;
            gameState.isExtraRoll = false; // 重置额外掷骰状态
            
            // 更新玩家
            if (playerCount !== gameState.players.length) {
                gameState.players = [];
                for (let i = 0; i < playerCount; i++) {
                    gameState.players.push({
                        id: i + 1,
                        name: `玩家${i + 1}`,
                        color: colorOptions[i % colorOptions.length],
                        active: i === 0
                    });
                }
                gameState.currentPlayerIndex = 0;
            }
            
            initGame();
        }
        
        // 重置游戏
        function resetGame() {
            gameState.history = [];
            gameState.currentPlayerIndex = 0;
            gameState.isExtraRoll = false;
            gameState.players.forEach((player, index) => {
                player.active = index === 0;
            });
            
            diceCountInput.value = 3;
            playerCountInput.value = 2;
            
            applySettings();
            renderHistory();
        }
        
        // 事件监听器
        applySettingsBtn.addEventListener('click', applySettings);
        resetGameBtn.addEventListener('click', resetGame);
        rollBtn.addEventListener('click', rollDice);
        
        // 初始化
        window.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
