    }
    const UNIQUE_WORDS = [...new Set(allWordsRaw.map(w => w.toLowerCase()))];
    // 展示用词（前50个）
    const DISPLAY_WORDS = UNIQUE_WORDS.slice(0, 50);

    const inputText = document.getElementById('inputText');
    const checkBtn = document.getElementById('checkBtn');
    const clearBtn = document.getElementById('clearBtn');

    const resultHint = document.getElementById('resultHint');

    bankTagsDiv.innerHTML = DISPLAY_WORDS.map(w => `<span class="bank-tag">${escapeHtml(w)}</span>`).join('');

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // 实时字数统计
    function updateCharCount() {
        charCountSpan.innerText = inputText.value.length;
    }
    inputText.addEventListener('input', updateCharCount);
    updateCharCount();

    // 核心检测
    function performCheck() {
        const rawText = inputText.value.trim();
        if (rawText.length === 0) {
            matchListDiv.innerHTML = '<div class="empty-state">📝 请在上方输入商品标题或描述</div>';
            hitCountSpan.innerText = '0';
            riskBadge.className = 'risk-badge risk-safe';
            riskBadge.innerText = '✅ 暂无风险';
            resultHint.innerText = '未检测到内容';
            return;
        }

        const lowerText = rawText.toLowerCase();
        const foundMap = new Map();

        for (const word of UNIQUE_WORDS) {
            if (lowerText.includes(word)) {
                const idx = lowerText.indexOf(word);
                let context = '';
                if (idx !== -1) {
                    const start = Math.max(0, idx - 13);
                    const end = Math.min(rawText.length, idx + word.length + 13);
                    let rawContext = rawText.substring(start, end);
                    if (rawContext.length > 36) rawContext = rawContext.substring(0, 34) + '...';
                    context = `...${rawContext}...`;
                } else {
                    context = `...${rawText.substring(0, 28)}...`;
                }
                if (!foundMap.has(word)) {
                    foundMap.set(word, { matchWord: word, context });
                }
            }
        }

        const matches = Array.from(foundMap.values());
        const hit = matches.length;
        hitCountSpan.innerText = hit;

            riskBadge.className = 'risk-badge risk-safe';
            riskBadge.innerText = '✅ 未检测到违禁词，相对安全';

            riskBadge.className = 'risk-badge risk-warn';
            riskBadge.innerText = '⚠️ 轻度风险，建议修改';
            resultHint.innerText = `命中 ${hit} 个潜在违禁词，优化后可降低限流风险。`;
            renderMatches(matches);

            riskBadge.className = 'risk-badge risk-danger';
            riskBadge.innerText = '❌ 高风险，请立即修改';
            resultHint.innerText = `命中 ${hit} 个违禁词，极易导致下架或封号！`;
            renderMatches(matches);
        }
    }

    function renderMatches(matches) {
        if (matches.length === 0) return;
        let html = '';
        for (let m of matches.slice(0, 55)) {
            html += `
                <div class="match-item">
                    <div class="match-word">${escapeHtml(m.matchWord)}</div>
                    <div class="match-context">${escapeHtml(m.context)}</div>
                </div>
            `;
        }
        if (matches.length > 55) {
            html += `<div class="match-item"><div class="match-word">···</div><div class="match-context">还有 ${matches.length-55} 条匹配词，请仔细检查</div></div>`;
        }
        matchListDiv.innerHTML = html;
    }

    function clearAll() {
        inputText.value = '';
        updateCharCount();
        matchListDiv.innerHTML = '<div class="empty-state">✨ 已清空，输入新内容后点击检测</div>';
        hitCountSpan.innerText = '0';
        riskBadge.className = 'risk-badge risk-safe';
        riskBadge.innerText = '✅ 暂无风险';
        resultHint.innerText = '点击检测按钮开始审核';
    }

    function fillExample() {
        inputText.value = '全网最低价！国家级荣誉，绝对正品。加微信：abc123，根治脚气，招财进宝，永不反弹。';
        updateCharCount();
        performCheck();
    }

    checkBtn.addEventListener('click', performCheck);
    clearBtn.addEventListener('click', clearAll);
    exampleBtn.addEventListener('click', fillExample);
    updateCharCount();
</script>
</body>
</html>
