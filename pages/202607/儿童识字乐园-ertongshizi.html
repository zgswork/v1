<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>儿童识字乐园</title>
    <style>
        body {
            font-family: 'Comic Sans MS', '楷体', sans-serif;
            background-color: #f0f9ff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #ff6b6b;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        .character-card {
            display: inline-block;
            margin: 15px;
            padding: 20px;
            background-color: #fff9e6;
            border-radius: 15px;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1);
            width: 200px;
            transition: transform 0.3s;
        }
        .character-card:hover {
            transform: scale(1.05);
        }
        .character-img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 3px solid #ffd166;
        }
        .character-hanzi {
            font-size: 3rem;
            color: #06d6a0;
            margin: 10px 0;
            font-weight: bold;
        }
        .character-pinyin {
            font-size: 1.5rem;
            color: #118ab2;
            margin-bottom: 15px;
        }
        .speak-btn {
            background-color: #ff9e7d;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .speak-btn:hover {
            background-color: #ff7b54;
        }
        .controls {
            margin: 30px 0;
        }
        .category-btn {
            background-color: #a0c4ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1rem;
            margin: 0 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .category-btn:hover {
            background-color: #7ea6ff;
            transform: translateY(-2px);
        }
        .active {
            background-color: #4d7eff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        .footer {
            margin-top: 30px;
            color: #888;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌟 儿童识字乐园 🌟</h1>
        
        <div class="controls">
            <button class="category-btn active" data-category="animals">动物</button>
            <button class="category-btn" data-category="fruits">水果</button>
            <button class="category-btn" data-category="family">家庭成员</button>
            <button class="category-btn" data-category="nature">自然</button>
        </div>
        
        <div id="characters-container">
            <!-- 字符卡片将通过JavaScript动态生成 -->
        </div>
        
        <div class="footer">
            点击喇叭图标可以听到发音哦！
        </div>
    </div>

    <script>
        // 汉字数据
        const charactersData = {
            animals: [
                { hanzi: '猫', pinyin: 'māo', image: 'https://img.icons8.com/color/96/000000/cat.png' },
                { hanzi: '狗', pinyin: 'gǒu', image: 'https://img.icons8.com/color/96/000000/dog.png' },
                { hanzi: '鸟', pinyin: 'niǎo', image: 'https://img.icons8.com/color/96/000000/bird.png' },
                { hanzi: '鱼', pinyin: 'yú', image: 'https://img.icons8.com/color/96/000000/fish.png' },
                { hanzi: '兔', pinyin: 'tù', image: 'https://img.icons8.com/color/96/000000/rabbit.png' }
            ],
            fruits: [
                { hanzi: '苹果', pinyin: 'píng guǒ', image: 'https://img.icons8.com/color/96/000000/apple.png' },
                { hanzi: '香蕉', pinyin: 'xiāng jiāo', image: 'https://img.icons8.com/color/96/000000/banana.png' },
                { hanzi: '葡萄', pinyin: 'pú táo', image: 'https://img.icons8.com/color/96/000000/grapes.png' },
                { hanzi: '西瓜', pinyin: 'xī guā', image: 'https://img.icons8.com/color/96/000000/watermelon.png' },
                { hanzi: '草莓', pinyin: 'cǎo méi', image: 'https://img.icons8.com/color/96/000000/strawberry.png' }
            ],
            family: [
                { hanzi: '爸爸', pinyin: 'bà ba', image: 'https://img.icons8.com/color/96/000000/father.png' },
                { hanzi: '妈妈', pinyin: 'mā ma', image: 'https://img.icons8.com/color/96/000000/mother.png' },
                { hanzi: '爷爷', pinyin: 'yé ye', image: 'https://img.icons8.com/color/96/000000/grandfather.png' },
                { hanzi: '奶奶', pinyin: 'nǎi nai', image: 'https://img.icons8.com/color/96/000000/grandmother.png' },
                { hanzi: '哥哥', pinyin: 'gē ge', image: 'https://img.icons8.com/color/96/000000/boy.png' }
            ],
            nature: [
                { hanzi: '太阳', pinyin: 'tài yáng', image: 'https://img.icons8.com/color/96/000000/sun.png' },
                { hanzi: '月亮', pinyin: 'yuè liang', image: 'https://img.icons8.com/color/96/000000/moon.png' },
                { hanzi: '星星', pinyin: 'xīng xing', image: 'https://img.icons8.com/color/96/000000/star.png' },
                { hanzi: '云', pinyin: 'yún', image: 'https://img.icons8.com/color/96/000000/cloud.png' },
                { hanzi: '花', pinyin: 'huā', image: 'https://img.icons8.com/color/96/000000/flower.png' }
            ]
        };

        const container = document.getElementById('characters-container');
        const categoryBtns = document.querySelectorAll('.category-btn');

        // 初始化显示动物类别
        showCharacters('animals');

        // 为类别按钮添加点击事件
        categoryBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // 移除所有按钮的active类
                categoryBtns.forEach(b => b.classList.remove('active'));
                // 为当前点击的按钮添加active类
                btn.classList.add('active');
                // 显示对应类别的字符
                showCharacters(btn.dataset.category);
            });
        });

        // 显示指定类别的字符
        function showCharacters(category) {
            container.innerHTML = '';
            
            charactersData[category].forEach(char => {
                const card = document.createElement('div');
                card.className = 'character-card';
                
                card.innerHTML = `
                    <img src="${char.image}" alt="${char.hanzi}" class="character-img">
                    <div class="character-hanzi">${char.hanzi}</div>
                    <div class="character-pinyin">${char.pinyin}</div>
                    <button class="speak-btn" onclick="speak('${char.hanzi}')">
                        🔊 发音
                    </button>
                `;
                
                container.appendChild(card);
            });
        }

        // 发音功能
        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
