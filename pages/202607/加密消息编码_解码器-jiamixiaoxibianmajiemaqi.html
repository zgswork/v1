<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>加密消息编码/解码器</title>
  <style>
    :root{--bg:#f6f7fb;--text:#1a1a1a;--surface:#ffffff;--primary:#3b82f6;--muted:#6b7280;--border:#e5e7eb}
    [data-theme="dark"]{--bg:#0f172a;--text:#e5e7eb;--surface:#111827;--primary:#60a5fa;--muted:#94a3b8;--border:#334155}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto}
    .container{max-width:900px;margin:0 auto;padding:16px}
    .header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    h1{font-size:20px;margin:0}
    .controls{display:flex;flex-wrap:wrap;gap:8px}
    input,textarea,button,select{border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text)}
    textarea{width:100%;min-height:140px;padding:12px;resize:vertical}
    input{padding:10px;width:240px}
    button{padding:10px 14px;border:none;background:var(--primary);color:#fff;cursor:pointer}
    button.secondary{background:transparent;color:var(--text);border:1px solid var(--border)}
    .grid{display:grid;grid-template-columns:1fr;gap:12px}
    .card{padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
    .row{display:flex;flex-wrap:wrap;gap:8px}
    .output{min-height:120px}
    .note{color:var(--muted);font-size:13px}
    .strength{display:flex;align-items:center;gap:8px;margin-top:8px}
    .strength .label{font-size:13px;color:var(--muted)}
    .strength .bar{flex:1;height:8px;border-radius:999px;position:relative;background:linear-gradient(90deg,#ef4444,#f59e0b,#10b981,#22c55e);opacity:.25}
    .strength .bar::after{content:"";position:absolute;left:0;top:0;height:100%;width:var(--level,0%);background:linear-gradient(90deg,#ef4444,#f59e0b,#10b981,#22c55e);border-radius:999px;opacity:1}
    @media(min-width:720px){.grid{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>加密消息编码/解码器</h1>
      <div class="controls">
        <button id="themeBtn" class="secondary">切换主题</button>
        <button id="sampleBtn" class="secondary">示例</button>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <label>原始消息</label>
        <textarea id="plain" placeholder="在这里输入要加密的消息"></textarea>
        <div class="row">
          <input id="password" type="password" placeholder="请输入密码 (至少6位)">
          <button id="togglePwd" class="secondary" title="显示/隐藏密码">显示密码</button>
          <button id="genPwdBtn" class="secondary" title="生成随机密码">生成随机密码</button>
          <button id="encBtn">编码(加密)</button>
          <button id="clearBtn" class="secondary">清空</button>
        </div>
        <div class="strength">
          <div class="bar" id="strengthBar"></div>
          <span class="label" id="strengthLabel">强度：—</span>
        </div>
        <p class="note">使用AES‑GCM + PBKDF2。输出为Base64封装字符串，含盐值与IV。</p>
      </div>

      <div class="card">
        <label>编码/解码结果</label>
        <textarea id="result" class="output" placeholder="这里显示加密后的编码或解密后的原文"></textarea>
        <div class="row">
          <button id="decBtn">解码(解密)</button>
          <button id="copyBtn" class="secondary">复制结果</button>
          <button id="downloadBtn" class="secondary">下载结果</button>
          <button id="exportJsonBtn" class="secondary">导出JSON</button>
          <button id="importJsonBtn" class="secondary">导入JSON</button>
          <input id="importJsonInput" type="file" accept=".json,application/json" style="display:none">
        </div>
        <p id="statusMsg" class="note"></p>
        <p class="note">若是加密包，自动识别并提示解密；否则直接显示文本。</p>
      </div>
    </div>
  </div>

  <script>
    // 主题状态
    const state={theme:localStorage.getItem('theme')||'light'};
    if(state.theme==='dark') document.body.setAttribute('data-theme','dark');
    document.getElementById('themeBtn').onclick=()=>{
      state.theme=state.theme==='dark'?'light':'dark';
      localStorage.setItem('theme',state.theme);
      if(state.theme==='dark'){
        document.body.setAttribute('data-theme','dark');
      }else{
        document.body.removeAttribute('data-theme');
      }
    };

    // 示例填充
    document.getElementById('sampleBtn').onclick=()=>{
      plain.value='这是一个示例消息：安全传输测试。';
      password.value='p@ssw0rd';
      updateStrength();
    };

    // 元素引用
    const enc=new TextEncoder(),dec=new TextDecoder();
    const plain=document.getElementById('plain'),password=document.getElementById('password'),result=document.getElementById('result');
    const strengthBar=document.getElementById('strengthBar'),strengthLabel=document.getElementById('strengthLabel');

    // Base64 工具
    function b64fromBytes(bytes){let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin)}
    function b64toBytes(b64){const bin=atob(b64);const out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}
    function rand(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return a}

    // 密码强度评估
    function passwordStrength(p){
      const hasLower=/[a-z]/.test(p),hasUpper=/[A-Z]/.test(p),hasDigit=/\d/.test(p),hasSpecial=/[^\da-zA-Z]/.test(p);
      let pool=0; if(hasLower)pool+=26; if(hasUpper)pool+=26; if(hasDigit)pool+=10; if(hasSpecial)pool+=32;
      const bits=Math.round(Math.log2(pool||1)*p.length);
      let label='弱',level=20;
      if(bits>=64){label='极强';level=100} else if(bits>=48){label='强';level=75} else if(bits>=32){label='中';level=50} else {label='弱';level=Math.min(30,Math.max(10,bits/64*50))}
      return {bits,label,level};
    }
    function updateStrength(){
      const s=passwordStrength(password.value||'');
      strengthBar.style.setProperty('--level',s.level+'%');
      strengthLabel.textContent= password.value ? `强度：${s.label}（~${s.bits}位）` : '强度：—';
    }
    password.addEventListener('input',updateStrength);

    // 随机密码生成
    function genPassword(len=16){
      const sets={lower:'abcdefghijklmnopqrstuvwxyz',upper:'ABCDEFGHIJKLMNOPQRSTUVWXYZ',digit:'0123456789',special:'!@#$%^&*()-_=+[]{};:,./?~'};
      const pick=(set)=>set[Math.floor(crypto.getRandomValues(new Uint32Array(1))[0]/4294967296*set.length)];
      const chars=[pick(sets.lower),pick(sets.upper),pick(sets.digit),pick(sets.special)];
      const all=sets.lower+sets.upper+sets.digit+sets.special;
      for(let i=chars.length;i<len;i++){chars.push(pick(all))}
      // shuffle
      for(let i=chars.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[chars[i],chars[j]]=[chars[j],chars[i]]}
      return chars.join('');
    }
    document.getElementById('genPwdBtn').onclick=()=>{ password.value=genPassword(16); updateStrength(); };

    // 密钥派生与加/解密
    async function deriveKey(pass,salt){
      const keyMat=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
      return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:120000,hash:'SHA-256'},keyMat,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])
    }
    async function encryptMessage(text,pass){
      if(!pass||pass.length<6) throw new Error('密码至少6位');
      const salt=rand(16),iv=rand(12),key=await deriveKey(pass,salt);
      const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(text));
      const pack={v:1,alg:'AES-GCM',salt:b64fromBytes(salt),iv:b64fromBytes(iv),ct:b64fromBytes(new Uint8Array(ct))};
      return 'ENC:'+btoa(JSON.stringify(pack))
    }
    async function decryptMessage(input,pass){
      if(!input) throw new Error('请输入待解码内容');
      if(input.startsWith('ENC:')){
        const pack=JSON.parse(atob(input.slice(4)));
        const salt=b64toBytes(pack.salt),iv=b64toBytes(pack.iv),ct=b64toBytes(pack.ct);
        const key=await deriveKey(pass,salt);
        const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
        return dec.decode(pt)
      }
      return input
    }

    // 编码/解码与操作
    document.getElementById('encBtn').onclick=async()=>{
      try{
        const out=await encryptMessage(plain.value.trim(),password.value);
        result.value=out; updateStatus();
      }catch(e){
        alert('编码失败：'+e.message)
      }
    };
    document.getElementById('decBtn').onclick=async()=>{
      try{
        const out=await decryptMessage(result.value.trim(),password.value);
        result.value=out; updateStatus();
      }catch(e){
        alert('解码失败：可能密码错误或内容损坏')
      }
    };
    document.getElementById('copyBtn').onclick=async()=>{
      try{await navigator.clipboard.writeText(result.value||'');}
      catch{alert('复制失败')}
    };
    document.getElementById('clearBtn').onclick=()=>{plain.value='';result.value='';updateStatus();};

    // 显示/隐藏密码
    const togglePwd=document.getElementById('togglePwd');
    togglePwd.onclick=()=>{
      const isPass=password.type==='password';
      password.type=isPass?'text':'password';
      togglePwd.textContent=isPass?'隐藏密码':'显示密码';
    };

    // 下载结果到文件
    const downloadBtn=document.getElementById('downloadBtn');
    downloadBtn.onclick=()=>{
      try{
        const text=result.value||'';
        const name=(result.value&&result.value.startsWith('ENC:'))?'encrypted.txt':'message.txt';
        const blob=new Blob([text],{type:'text/plain;charset=utf-8'});
        const a=document.createElement('a');
        a.href=URL.createObjectURL(blob);
        a.download=name; a.style.display='none';
        document.body.appendChild(a); a.click();
        setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
      }catch(e){ alert('下载失败：'+e.message); }
    };

    // 导出/导入 JSON 包
    const exportJsonBtn=document.getElementById('exportJsonBtn');
    const importJsonBtn=document.getElementById('importJsonBtn');
    const importJsonInput=document.getElementById('importJsonInput');
    exportJsonBtn.onclick=()=>{
      const val=result.value.trim();
      if(!val.startsWith('ENC:')){ alert('当前结果不是加密包'); return; }
      try{
        const pack=JSON.parse(atob(val.slice(4)));
        const blob=new Blob([JSON.stringify(pack,null,2)],{type:'application/json'});
        const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='package.json'; a.style.display='none';
        document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
      }catch(e){ alert('导出失败：'+e.message); }
    };
    importJsonBtn.onclick=()=>importJsonInput.click();
    importJsonInput.onchange=async(e)=>{
      const file=e.target.files[0]; if(!file) return;
      try{
        const text=await file.text(); const pack=JSON.parse(text);
        if(!pack||!pack.salt||!pack.iv||!pack.ct){ throw new Error('缺少必要字段'); }
        const encStr='ENC:'+btoa(JSON.stringify(pack));
        result.value=encStr; updateStatus();
      }catch(err){ alert('导入失败：'+(err.message||err)); }
      finally{ e.target.value=''; }
    };

    // 状态提示与粘贴检测
    const statusMsg=document.getElementById('statusMsg');
    function updateStatus(){
      const val=(result.value||'').trim();
      if(!val){ statusMsg.textContent=''; }
      else if(val.startsWith('ENC:')){ statusMsg.textContent='检测到加密包：请输入密码并点击解码'; }
      else{ statusMsg.textContent='普通文本'; }
    }
    result.addEventListener('input',updateStatus);
    result.addEventListener('paste',()=>setTimeout(updateStatus,0));

    // 自测
    (async()=>{
      try{
        const msg='hello world 自测',pwd='p@ssw0rd';
        const encd=await encryptMessage(msg,pwd);
        const decd=await decryptMessage(encd,pwd);
        console.log('自测结果',decd===msg?'OK':'FAIL');
      }catch(e){ console.error('自测错误',e) }
    })();
  </script>
</body>
</html>
