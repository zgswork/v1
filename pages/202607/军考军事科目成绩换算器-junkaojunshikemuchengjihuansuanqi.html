<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>军考军事科目成绩换算器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9, #a5d6a7);
            background-attachment: fixed;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }
        
        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #4caf50, #8bc34a, #cddc39);
        }
        
        h1 {
            text-align: center;
            color: #2e7d32;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            text-align: center;
            color: #558b2f;
            margin-bottom: 30px;
            font-size: 16px;
        }
        
        .gender-selector {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        .gender-btn {
            padding: 8px 20px;
            margin: 0 10px;
            border: 2px solid #4caf50;
            background: white;
            color: #4caf50;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .gender-btn.active {
            background: #4caf50;
            color: white;
        }
        
        .calculator {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .subject-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            border-left: 4px solid #4caf50;
        }
        
        .subject-title {
            font-size: 18px;
            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .score-display {
            font-size: 24px;
            font-weight: bold;
            color: #f44336;
            text-align: right;
        }
        
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-top: 8px;
            font-size: 16px;
        }
        
        .result-section {
            text-align: center;
            padding: 20px;
            background: #f1f8e9;
            border-radius: 8px;
            margin-top: 20px;
        }
        
        .total-score {
            font-size: 36px;
            font-weight: bold;
            color: #f44336;
            margin: 10px 0;
        }
        
        .message {
            font-size: 18px;
            margin: 15px 0;
            padding: 15px;
            border-radius: 8px;
            background: #ffebee;
            color: #c62828;
            display: none;
        }
        
        .info-note {
            text-align: center;
            margin-top: 20px;
            color: #558b2f;
            font-size: 14px;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .calculator {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>军考军事科目成绩换算器</h1>
        <p class="subtitle">请输入各科目成绩，系统将自动计算总分并给出评定</p >
        
        <div class="gender-selector">
            <button class="gender-btn active" data-gender="male">男兵</button>
            <button class="gender-btn" data-gender="female">女兵</button>
        </div>
        
        <div class="calculator">
            <!-- 队列 -->
            <div class="subject-card">
                <div class="subject-title">
                    <span>一、队列</span>
                    <span class="score-display" id="queue-score">9</span>
                </div>
                <p>固定得分：9分</p >
            </div>
            
            <!-- 轻武器操作 -->
            <div class="subject-card">
                <div class="subject-title">
                    <span>二、轻武器操作（环数）</span>
                    <span class="score-display" id="weapon-score">0</span>
                </div>
                <select id="weapon-input">
                    <option value="0">请选择环数</option>
                    <option value="20">48环以上</option>
                    <option value="19">46-47环</option>
                    <option value="18">45环</option>
                    <option value="17">42-44环</option>
                    <option value="16">39-41环</option>
                    <option value="15">36-38环</option>
                    <option value="14">35环</option>
                    <option value="13">31-34环</option>
                    <option value="12">30环</option>
                    <option value="0">30环以下</option>
                </select>
            </div>
            
            <!-- 战术基础动作 -->
            <div class="subject-card">
                <div class="subject-title">
                    <span>三、战术基础动作（时间）</span>
                    <span class="score-display" id="tactic-score">0</span>
                </div>
                <select id="tactic-input">
                    <option value="0">请选择完成时间</option>
                    <option value="10">20秒以内(男)/30秒以内(女)</option>
                    <option value="8">25秒(男)/35秒(女)</option>
                    <option value="6">30秒(男)/40秒(女)</option>
                    <option value="0">超过30秒(男)/40秒(女)</option>
                </select>
            </div>
            
            <!-- 蛇形跑 -->
            <div class="subject-card">
                <div class="subject-title">
                    <span>四、蛇形跑（时间）</span>
                    <span class="score-display" id="snake-score">0</span>
                </div>
                <select id="snake-input">
                    <option value="0">请选择完成时间</option>
                    <option value="15">18.1秒以内(男)/20.0秒以内(女)</option>
                    <option value="14.3">18.7秒(男)/20.4秒(女)</option>
                    <option value="13.5">19.0秒(男)/20.9秒(女)</option>
                    <option value="12.8">19.2秒(男)/21.1秒(女)</option>
                    <option value="12">19.5秒(男)/21.3秒(女)</option>
                    <option value="11.3">19.7秒(男)/21.6秒(女)</option>
                    <option value="10.5">19.9秒(男)/21.7秒(女)</option>
                    <option value="9.8">20.1秒(男)/21.9秒(女)</option>
                    <option value="9">20.4秒(男)/22.2秒(女)</option>
                    <option value="0">超过20.4秒(男)/22.2秒(女)</option>
                </select>
            </div>
            
            <!-- 仰卧卷腹 -->
            <div class="subject-card">
                <div class="subject-title">
                    <span>五、仰卧卷腹（次数）</span>
                    <span class="score-display" id="situp-score">0</span>
                </div>
                <select id="situp-input">
                    <option value="0">请选择完成次数</option>
                    <option value="15">87次以上(男)/71次以上(女)</option>
                    <option value="14.3">82次(男)/68次(女)</option>
                    <option value="13.5">77次(男)/65次(女)</option>
                    <option value="12.8">72次(男)/62次(女)</option>
                    <option value="12">67次(男)/59次(女)</option>
                    <option value="11.3">62次(男)/56次(女)</option>
                    <option value="10.5">58次(男)/53次(女)</option>
                    <option value="9.8">54次(男)/43次(女)</option>
                    <option value="9">50次(男)/42次(女)</option>
                    <option value="0">50次以下(男)/42次以下(女)</option>
                </select>
            </div>
            
            <!-- 3000米跑 -->
            <div class="subject-card">
                <div class="subject-title">
                    <span>六、3000米跑（时间）</span>
                    <span class="score-display" id="run-score">0</span>
                </div>
                <select id="run-input">
                    <option value="0">请选择完成时间</option>
                    <option value="30">11分30秒以内(男)/14分00秒以内(女)</option>
                    <option value="28.5">11分55秒(男)/14分25秒(女)</option>
                    <option value="27">12分10秒(男)/14分40秒(女)</option>
                    <option value="25.5">12分25秒(男)/14分55秒(女)</option>
                    <option value="24">12分40秒(男)/15分10秒(女)</option>
                    <option value="22.5">12分55秒(男)/15分25秒(女)</option>
                    <option value="21">13分10秒(男)/15分40秒(女)</option>
                    <option value="19.5">13分30秒(男)/16分00秒(女)</option>
                    <option value="18">13分35秒(男)/16分05秒(女)</option>
                    <option value="0">超过13分35秒(男)/16分05秒(女)</option>
                </select>
            </div>
        </div>
        
        <div class="result-section">
            <h2>总分</h2>
            <div class="total-score" id="total-score">0</div>
            
            <div class="message" id="pass-message">
                军事科目成绩合格，可以参加文化科目考试，加油！
            </div>
            
            <div class="message" id="fail-message">
                军事科目成绩不合格，暂时不能参加文化科目考试，不要气馁，继续努力！
            </div>
            
            <div class="info-note">
                更多军考资讯，请加wangxuezhang03
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 性别选择
            const genderButtons = document.querySelectorAll('.gender-btn');
            let currentGender = 'male';
            
            genderButtons.forEach(button => {
                button.addEventListener('click', function() {
                    genderButtons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                    currentGender = this.getAttribute('data-gender');
                    calculateTotalScore();
                });
            });
            
            // 获取所有输入元素
            const inputs = document.querySelectorAll('select');
            
            // 为每个输入添加事件监听
            inputs.forEach(input => {
                input.addEventListener('change', calculateTotalScore);
            });
            
            // 计算总分函数
            function calculateTotalScore() {
                let total = 0;
                let failedSubjects = 0;
                
                // 队列固定9分
                const queueScore = 9;
                total += queueScore;
                document.getElementById('queue-score').textContent = queueScore;
                
                // 轻武器操作
                const weaponScore = parseFloat(document.getElementById('weapon-input').value) || 0;
                total += weaponScore;
                document.getElementById('weapon-score').textContent = weaponScore;
                if (weaponScore === 0) failedSubjects++;
                
                // 战术基础动作
                const tacticScore = parseFloat(document.getElementById('tactic-input').value) || 0;
                total += tacticScore;
                document.getElementById('tactic-score').textContent = tacticScore;
                if (tacticScore === 0) failedSubjects++;
                
                // 蛇形跑
                const snakeScore = parseFloat(document.getElementById('snake-input').value) || 0;
                total += snakeScore;
                document.getElementById('snake-score').textContent = snakeScore;
                if (snakeScore === 0) failedSubjects++;
                
                // 仰卧卷腹
                const situpScore = parseFloat(document.getElementById('situp-input').value) || 0;
                total += situpScore;
                document.getElementById('situp-score').textContent = situpScore;
                if (situpScore === 0) failedSubjects++;
                
                // 3000米跑
                const runScore = parseFloat(document.getElementById('run-input').value) || 0;
                total += runScore;
                document.getElementById('run-score').textContent = runScore;
                if (runScore === 0) failedSubjects++;
                
                // 更新总分
                document.getElementById('total-score').textContent = total.toFixed(1);
                
                // 显示相应消息
                const passMessage = document.getElementById('pass-message');
                const failMessage = document.getElementById('fail-message');
                
                if (total >= 60 && failedSubjects <= 1) {
                    passMessage.style.display = 'block';
                    failMessage.style.display = 'none';
                } else {
                    passMessage.style.display = 'none';
                    failMessage.style.display = 'block';
                }
            }
            
            // 初始化计算
            calculateTotalScore();
        });
    </script>
