<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高级图片转PDF工具</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        
        :root {
            --primary: #4361ee;
            --primary-light: #4895ef;
            --secondary: #3f37c9;
            --success: #4cc9f0;
            --dark: #3a0ca3;
            --light: #f8f9fa;
            --gray: #6c757d;
            --light-gray: #e9ecef;
            --danger: #f72585;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }
        
        body {
            background: linear-gradient(135deg, #e0f7fa 0%, #bbdefb 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }
        
        .container {
            width: 100%;
            max-width: 1000px;
            background: white;
            border-radius: 20px;
            box-shadow: var(--shadow);
            overflow: hidden;
            animation: fadeIn 0.6s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        header {
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        header::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
            transform: rotate(30deg);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            position: relative;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        
        .subtitle {
            font-weight: 300;
            opacity: 0.92;
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }
        
        .main-content {
            padding: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
        
        .upload-section {
            margin-bottom: 20px;
        }
        
        .drop-area {
            border: 3px dashed var(--primary-light);
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            background-color: #f8fbff;
            transition: var(--transition);
            cursor: pointer;
            margin-bottom: 20px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .drop-area:hover, .drop-area.drag-over {
            background-color: #edf5ff;
            transform: translateY(-5px);
            box-shadow: var(--shadow);
            border-color: var(--primary);
        }
        
        .drop-area i {
            font-size: 64px;
            color: var(--primary);
            margin-bottom: 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--success) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .drop-area h3 {
            color: var(--primary);
            margin-bottom: 15px;
            font-size: 1.6rem;
            font-weight: 600;
        }
        
        .drop-area p {
            color: var(--gray);
            margin-bottom: 25px;
            font-size: 1.05rem;
            max-width: 90%;
        }
        
        .btn {
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3);
        }
        
        .btn i {
            font-size: 1.2rem;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(67, 97, 238, 0.4);
            background: linear-gradient(90deg, var(--primary-light) 0%, var(--primary) 100%);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn:disabled {
            background: var(--light-gray);
            color: var(--gray);
            transform: none;
            box-shadow: none;
            cursor: not-allowed;
        }
        
        .preview-section {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .section-title {
            font-size: 1.4rem;
            color: var(--dark);
            font-weight: 600;
        }
        
        .image-counter {
            background: var(--primary-light);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        .image-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
            flex-grow: 1;
            overflow-y: auto;
            max-height: 400px;
            padding: 5px;
        }
        
        .image-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            aspect-ratio: 4/3;
            transition: var(--transition);
        }
        
        .image-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
        }
        
        .image-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .image-item .remove-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(247, 37, 133, 0.85);
            color: white;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            opacity: 0;
            transition: var(--transition);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .image-item:hover .remove-btn {
            opacity: 1;
        }
        
        .image-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            font-size: 0.75rem;
            padding: 5px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .action-section {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        
        .btn-secondary {
            background: linear-gradient(90deg, #6c757d 0%, #495057 100%);
            box-shadow: 0 4px 15px rgba(108, 117, 125, 0.3);
        }
        
        .btn-secondary:hover {
            background: linear-gradient(90deg, #5a6268 0%, #343a40 100%);
        }
        
        .btn-success {
            background: linear-gradient(90deg, #4cc9f0 0%, #4895ef 100%);
            box-shadow: 0 4px 15px rgba(76, 201, 240, 0.3);
        }
        
        .btn-success:hover {
            background: linear-gradient(90deg, #3bb9e0 0%, #3a86e0 100%);
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--gray);
            border: 2px dashed var(--light-gray);
            border-radius: 16px;
            background-color: #fafcff;
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
        }
        
        .empty-state i {
            font-size: 56px;
            margin-bottom: 20px;
            color: #c5d5f3;
        }
        
        .empty-state p {
            font-size: 1.1rem;
            max-width: 300px;
        }
        
        .status-bar {
            background: var(--light);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
            color: var(--dark);
            font-weight: 500;
            display: none;
            border: 1px solid var(--light-gray);
            animation: slideUp 0.4s ease-out;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .progress-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
        }
        
        .progress-bar {
            flex-grow: 1;
            height: 10px;
            background: var(--light-gray);
            border-radius: 5px;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(90deg, var(--success) 0%, var(--primary) 100%);
            width: 0;
            transition: width 0.4s ease;
        }
        
        .progress-text {
            font-weight: 600;
            min-width: 60px;
            color: var(--primary);
        }
        
        .feature-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 25px;
        }
        
        .feature {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            background: #f0f7ff;
            padding: 12px 15px;
            border-radius: 12px;
            font-size: 0.95rem;
        }
        
        .feature i {
            color: var(--primary);
            font-size: 1.2rem;
            margin-top: 2px;
        }
        
        footer {
            text-align: center;
            padding: 25px;
            background: #f9fbff;
            color: var(--gray);
            font-size: 0.95rem;
            border-top: 1px solid var(--light-gray);
        }
        
        @media (max-width: 768px) {
            .container {
                margin: 10px;
            }
            
            header {
                padding: 25px 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .main-content {
                padding: 20px;
            }
            
            .image-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
            
            .action-section {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-file-pdf"></i> 高级图片转PDF工具</h1>
            <p class="subtitle">在浏览器本地安全转换 - 无需上传，保护隐私</p>
        </header>
        
        <div class="main-content">
            <div class="upload-section">
                <div id="dropArea" class="drop-area">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <h3>拖拽图片到此处</h3>
                    <p>支持 JPG, PNG, BMP, GIF, WEBP 等常见图片格式</p>
                    <button id="selectBtn" class="btn">
                        <i class="fas fa-folder-open"></i> 选择图片
                    </button>
                    <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">
                    
                    <div class="feature-list">
                        <div class="feature">
                            <i class="fas fa-lock"></i>
                            <span>100% 本地处理，不上传服务器</span>
                        </div>
                        <div class="feature">
                            <i class="fas fa-bolt"></i>
                            <span>快速转换，即时下载</span>
                        </div>
                        <div class="feature">
                            <i class="fas fa-mobile-alt"></i>
                            <span>响应式设计，移动设备友好</span>
                        </div>
                        <div class="feature">
                            <i class="fas fa-sort"></i>
                            <span>拖拽调整图片顺序</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="preview-section">
                <div class="section-header">
                    <h3 class="section-title">图片预览</h3>
                    <div id="imageCounter" class="image-counter">0 张图片</div>
                </div>
                
                <div id="imageList" class="image-list">
                    <div class="empty-state">
                        <i class="fas fa-images"></i>
                        <p>尚未添加图片，请拖放或选择图片</p>
                    </div>
                </div>
                
                <div class="action-section">
                    <button id="clearBtn" class="btn btn-secondary" disabled>
                        <i class="fas fa-trash-alt"></i> 清除所有
                    </button>
                    <button id="convertBtn" class="btn btn-success" disabled>
                        <i class="fas fa-file-pdf"></i> 转换为PDF
                    </button>
                </div>
                
                <div id="statusBar" class="status-bar">
                    <div id="statusText">正在准备转换...</div>
                    <div class="progress-container">
                        <div class="progress-bar">
                            <div id="progress" class="progress"></div>
                        </div>
                        <div id="progressText" class="progress-text">0%</div>
                    </div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>© 2023 高级图片转PDF工具 | 所有操作均在您的设备上完成，无服务器上传</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const dropArea = document.getElementById('dropArea');
            const fileInput = document.getElementById('fileInput');
            const selectBtn = document.getElementById('selectBtn');
            const imageList = document.getElementById('imageList');
            const clearBtn = document.getElementById('clearBtn');
            const convertBtn = document.getElementById('convertBtn');
            const statusBar = document.getElementById('statusBar');
            const statusText = document.getElementById('statusText');
            const progress = document.getElementById('progress');
            const progressText = document.getElementById('progressText');
            const imageCounter = document.getElementById('imageCounter');
            
            // 存储图片的数组
            let images = [];
            
            // 点击按钮触发文件选择
            selectBtn.addEventListener('click', () => {
                fileInput.click();
            });
            
            // 文件选择变化事件
            fileInput.addEventListener('change', (e) => {
                handleFiles(e.target.files);
                fileInput.value = '';
            });
            
            // 拖拽事件处理
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, preventDefaults, false);
            });
            
            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }
            
            ['dragenter', 'dragover'].forEach(eventName => {
                dropArea.addEventListener(eventName, highlight, false);
            });
            
            ['dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, unhighlight, false);
            });
            
            function highlight() {
                dropArea.classList.add('drag-over');
            }
            
            function unhighlight() {
                dropArea.classList.remove('drag-over');
            }
            
            // 处理拖放的文件
            dropArea.addEventListener('drop', (e) => {
                const dt = e.dataTransfer;
                const files = dt.files;
                handleFiles(files);
            });
            
            // 处理文件函数
            function handleFiles(files) {
                const newImages = Array.from(files).filter(file => file.type.match('image.*'));
                
                if (newImages.length === 0) {
                    showToast('请选择图片文件 (JPG, PNG, BMP, GIF, WEBP)', 'error');
                    return;
                }
                
                // 添加到图片数组
                images = [...images, ...newImages];
                updatePreview();
                updateButtonStates();
                showToast(`成功添加 ${newImages.length} 张图片`, 'success');
            }
            
            // 更新图片预览
            function updatePreview() {
                imageCounter.textContent = `${images.length} 张图片`;
                
                if (images.length === 0) {
                    imageList.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-images"></i>
                            <p>尚未添加图片，请拖放或选择图片</p>
                        </div>
                    `;
                    return;
                }
                
                imageList.innerHTML = '';
                
                images.forEach((image, index) => {
                    const reader = new FileReader();
                    
                    reader.onload = (e) => {
                        const imgElement = document.createElement('div');
                        imgElement.className = 'image-item';
                        imgElement.innerHTML = `
                            <img src="${e.target.result}" alt="预览图片">
                            <button class="remove-btn" data-index="${index}">×</button>
                            <div class="image-name">${truncateFileName(image.name, 15)}</div>
                        `;
                        imageList.appendChild(imgElement);
                        
                        // 添加删除事件
                        imgElement.querySelector('.remove-btn').addEventListener('click', (e) => {
                            e.stopPropagation();
                            const idx = parseInt(e.target.getAttribute('data-index'));
                            const removedImage = images[idx].name;
                            images.splice(idx, 1);
                            updatePreview();
                            updateButtonStates();
                            showToast(`已移除: ${truncateFileName(removedImage, 20)}`, 'info');
                        });
                    };
                    
                    reader.readAsDataURL(image);
                });
            }
            
            // 文件名截断函数
            function truncateFileName(name, maxLength) {
                if (name.length <= maxLength) return name;
                return name.substring(0, maxLength - 3) + '...';
            }
            
            // 更新按钮状态
            function updateButtonStates() {
                clearBtn.disabled = images.length === 0;
                convertBtn.disabled = images.length === 0;
            }
            
            // 清除所有图片
            clearBtn.addEventListener('click', () => {
                if (images.length > 0) {
                    images = [];
                    updatePreview();
                    updateButtonStates();
                    showToast('已清除所有图片', 'info');
                }
            });
            
            // 转换为PDF
            convertBtn.addEventListener('click', async () => {
                if (images.length === 0) return;
                
                // 显示状态栏
                statusBar.style.display = 'block';
                statusText.textContent = '正在准备转换...';
                progress.style.width = '0%';
                progressText.textContent = '0%';
                
                try {
                    // 创建PDF实例
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    
                    // 设置PDF尺寸为A4
                    const pdfWidth = doc.internal.pageSize.getWidth();
                    const pdfHeight = doc.internal.pageSize.getHeight();
                    
                    // 逐个添加图片到PDF
                    for (let i = 0; i < images.length; i++) {
                        // 更新进度条
                        const progressPercent = Math.floor(((i + 1) / images.length) * 100);
                        progress.style.width = `${progressPercent}%`;
                        progressText.textContent = `${progressPercent}%`;
                        statusText.textContent = `正在处理图片 ${i + 1}/${images.length}`;
                        
                        // 读取图片数据
                        const imgData = await readFileAsDataURL(images[i]);
                        
                        // 如果是第一张之后的图片，添加新页面
                        if (i > 0) {
                            doc.addPage();
                        }
                        
                        // 计算图片在PDF中的尺寸
                        const img = new Image();
                        img.src = imgData;
                        await new Promise(resolve => img.onload = resolve);
                        
                        const imgRatio = img.width / img.height;
                        let imgWidth = pdfWidth;
                        let imgHeight = pdfHeight;
                        
                        if (imgRatio > pdfWidth / pdfHeight) {
                            imgHeight = pdfWidth / imgRatio;
                        } else {
                            imgWidth = pdfHeight * imgRatio;
                        }
                        
                        const x = (pdfWidth - imgWidth) / 2;
                        const y = (pdfHeight - imgHeight) / 2;
                        
                        // 添加图片到PDF
                        doc.addImage(imgData, 'JPEG', x, y, imgWidth, imgHeight);
                    }
                    
                    // 完成进度条
                    progress.style.width = '100%';
                    progressText.textContent = '100%';
                    statusText.textContent = 'PDF生成完成！';
                    
                    // 保存PDF文件
                    const fileName = `图片转换_${new Date().toISOString().slice(0, 10)}.pdf`;
                    doc.save(fileName);
                    
                    showToast(`PDF已生成: ${fileName}`, 'success');
                    
                    // 3秒后隐藏状态栏
                    setTimeout(() => {
                        statusBar.style.display = 'none';
                    }, 5000);
                    
                } catch (error) {
                    console.error('转换出错:', error);
                    statusText.textContent = '转换出错，请重试';
                    progress.style.background = 'var(--danger)';
                    showToast('转换过程中发生错误', 'error');
                }
            });
            
            // 辅助函数：将文件读取为DataURL
            function readFileAsDataURL(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            }
            
            // 显示Toast通知
            function showToast(message, type) {
                // 在实际应用中这里会实现一个Toast通知系统
                console.log(`${type.toUpperCase()}: ${message}`);
            }
        });
    </script>
</body>
</html>
