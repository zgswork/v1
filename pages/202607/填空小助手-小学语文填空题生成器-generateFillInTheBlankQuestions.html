<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>填空小助手 - 小学语文填空题生成器</title>
    <style>
        :root {
            --primary: #4a6fa5;
            --primary-light: #6c8fc0;
            --secondary: #e74c3c;
            --light: #f8f9fa;
            --dark: #343a40;
            --success: #28a745;
            --gray: #e9ecef;
            --border: #ced4da;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background-color: #f0f2f5;
            color: var(--dark);
            line-height: 1.6;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 25px 30px;
            text-align: center;
        }
        
        header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        header p {
            font-size: 16px;
            opacity: 0.9;
            max-width: 700px;
            margin: 0 auto;
        }
        
        .app-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            padding: 30px;
        }
        
        @media (max-width: 768px) {
            .app-container {
                grid-template-columns: 1fr;
            }
        }
        
        .panel {
            background: var(--light);
            border-radius: 10px;
            border: 1px solid var(--border);
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.03);
        }
        
        .panel-title {
            color: var(--primary);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--primary);
            font-size: 20px;
        }
        
        textarea {
            width: 100%;
            min-height: 180px;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
            transition: border-color 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(74, 111, 165, 0.2);
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark);
        }
        
        .btn {
            display: inline-block;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            text-align: center;
        }
        
        .btn:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74, 111, 165, 0.3);
        }
        
        .btn-lg {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            margin: 20px 0;
        }
        
        .btn-secondary {
            background: var(--secondary);
        }
        
        .btn-secondary:hover {
            background: #c0392b;
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        
        .preview-container {
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            min-height: 200px;
            font-size: 18px;
            line-height: 1.8;
            white-space: pre-wrap;
        }
        
        .blank {
            display: inline-block;
            border-bottom: 2px solid var(--primary);
            min-width: 50px;
            text-align: center;
            margin: 0 5px;
            position: relative;
            padding: 0 5px;
            cursor: pointer;
        }
        
        .blank:hover {
            background-color: rgba(74, 111, 165, 0.1);
        }
        
        .blank::after {
            content: "×";
            position: absolute;
            top: -12px;
            right: -8px;
            font-size: 14px;
            color: var(--secondary);
            background: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .blank:hover::after {
            opacity: 1;
        }
        
        .answer-item {
            display: inline-block;
            background: var(--gray);
            padding: 5px 15px;
            border-radius: 30px;
            margin: 5px;
            font-size: 16px;
        }
        
        .answer-item span {
            font-weight: bold;
            color: var(--primary);
            margin-right: 5px;
        }
        
        .instructions {
            background: #e8f4fd;
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin: 20px 0;
            font-size: 14px;
        }
        
        .instructions h3 {
            color: var(--primary);
            margin-bottom: 8px;
        }
        
        .instructions ul {
            padding-left: 20px;
        }
        
        .instructions li {
            margin-bottom: 5px;
        }
        
        .highlight {
            background-color: #fff9c4;
            padding: 0 3px;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #6c757d;
            font-size: 14px;
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>填空小助手</h1>
            <p>小学语文填空题生成器 - 五年级教师专用</p>
        </header>
        
        <div class="app-container">
            <div class="input-panel">
                <div class="panel">
                    <h2 class="panel-title">输入内容</h2>
                    
                    <div class="input-group">
                        <label for="text-input">粘贴课文内容：</label>
                        <textarea id="text-input" placeholder="请在此粘贴需要生成填空题的课文内容...">漓江的水真静啊，静得让你感觉不到它在流动；漓江的水真清啊，清得可以看见江底的沙石；漓江的水真绿啊，绿得仿佛那是一块无瑕的翡翠。桂林的山真奇啊，一座座拔地而起，各不相连，像老人，像巨象，像骆驼，奇峰罗列，形态万千；桂林的山真秀啊，像翠绿的屏障，像新生的竹笋，色彩明丽，倒映水中；桂林的山真险啊，危峰兀立，怪石嶙峋，好像一不小心就会栽倒下来。</textarea>
                    </div>
                    
                    <div class="input-group">
                        <label for="words-input">输入目标词语（用逗号或空格分隔）：</label>
                        <textarea id="words-input" placeholder="例如：静,清,绿,奇,秀,险">静,清,绿,奇,秀,险</textarea>
                    </div>
                    
                    <button id="generate-btn" class="btn btn-lg">一键生成填空题</button>
                    
                    <div class="instructions">
                        <h3>使用说明：</h3>
                        <ul>
                            <li>在第一个文本框粘贴需要出题的<span class="highlight">课文内容</span></li>
                            <li>在第二个文本框输入要考察的<span class="highlight">重点词语</span>（用逗号或空格分隔）</li>
                            <li>点击"一键生成填空题"按钮，系统会自动将目标词语替换为空格</li>
                            <li>在预览区域可以<span class="highlight">点击空格上的×号删除空格</span></li>
                            <li>在文本中<span class="highlight">双击词语</span>可以将其添加为空格</li>
                            <li>最后可以复制或下载生成的题目和答案</li>
                        </ul>
                    </div>
                </div>
            </div>
            
            <div class="output-panel">
                <div class="panel">
                    <h2 class="panel-title">生成结果预览</h2>
                    <div id="preview" class="preview-container">
                        生成的填空题将显示在这里...
                    </div>
                    
                    <h3 class="panel-title" style="margin-top: 25px;">答案列表</h3>
                    <div id="answer-container"></div>
                    
                    <div class="btn-group">
                        <button id="copy-btn" class="btn">复制题目和答案</button>
                        <button id="download-btn" class="btn btn-secondary">下载题目和答案</button>
                    </div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>© 2025 填空小助手 - 专为小学语文教师设计的填空题生成工具 | MVP版本 1.0</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const textInput = document.getElementById('text-input');
            const wordsInput = document.getElementById('words-input');
            const generateBtn = document.getElementById('generate-btn');
            const preview = document.getElementById('preview');
            const answerContainer = document.getElementById('answer-container');
            const copyBtn = document.getElementById('copy-btn');
            const downloadBtn = document.getElementById('download-btn');
            
            // 存储原始文本和目标词
            let originalText = '';
            let targetWords = [];
            let blanksData = [];
            
            // 生成填空题
            generateBtn.addEventListener('click', generateBlanks);
            
            // 复制功能
            copyBtn.addEventListener('click', copyContent);
            
            // 下载功能
            downloadBtn.addEventListener('click', downloadContent);
            
            // 生成填空题函数
            function generateBlanks() {
                originalText = textInput.value.trim();
                const words = wordsInput.value.trim();
                
                if (!originalText) {
                    alert('请输入课文内容');
                    return;
                }
                
                if (!words) {
                    alert('请输入目标词语');
                    return;
                }
                
                // 处理目标词输入（支持中英文逗号、空格分隔）
                targetWords = words.split(/[,，\s]+/).filter(word => word);
                
                // 存储空白数据
                blanksData = [];
                
                // 初始化处理后的文本
                let processedText = originalText;
                
                // 替换目标词为空白
                targetWords.forEach((word, index) => {
                    const regex = new RegExp(word, 'g');
                    let match;
                    
                    while ((match = regex.exec(processedText)) !== null) {
                        blanksData.push({
                            id: blanksData.length,
                            word: word,
                            position: match.index,
                            length: word.length
                        });
                    }
                });
                
                // 按位置排序
                blanksData.sort((a, b) => a.position - b.position);
                
                // 生成带空白的文本
                let lastIndex = 0;
                let resultHTML = '';
                
                blanksData.forEach((blank, idx) => {
                    // 添加空白前的文本
                    resultHTML += processedText.substring(lastIndex, blank.position);
                    
                    // 添加空白
                    resultHTML += `<span class="blank" data-id="${blank.id}" title="点击删除空格">${'_'.repeat(blank.length)}</span>`;
                    
                    lastIndex = blank.position + blank.length;
                });
                
                // 添加剩余文本
                resultHTML += processedText.substring(lastIndex);
                
                // 显示结果
                preview.innerHTML = resultHTML;
                
                // 添加删除空格的点击事件
                document.querySelectorAll('.blank').forEach(blank => {
                    blank.addEventListener('click', removeBlank);
                });
                
                // 添加双击添加空格事件
                preview.addEventListener('dblclick', addBlank);
                
                // 生成答案列表
                generateAnswerList();
            }
            
            // 生成答案列表
            function generateAnswerList() {
                if (blanksData.length === 0) {
                    answerContainer.innerHTML = '<p>暂无空格，请先生成填空题</p>';
                    return;
                }
                
                let answersHTML = '<p>答案列表：</p>';
                
                blanksData.forEach((blank, index) => {
                    answersHTML += `<div class="answer-item"><span>${index + 1}.</span> ${blank.word}</div>`;
                });
                
                answerContainer.innerHTML = answersHTML;
            }
            
            // 删除空格
            function removeBlank(event) {
                const blankId = parseInt(event.target.getAttribute('data-id'));
                
                // 从blanksData中移除
                blanksData = blanksData.filter(blank => blank.id !== blankId);
                
                // 重新生成预览
                generatePreviewFromBlanks();
                generateAnswerList();
            }
            
            // 添加空格
            function addBlank(event) {
                // 获取选中的文本
                const selection = window.getSelection();
                if (!selection.toString().trim()) return;
                
                const selectedText = selection.toString().trim();
                const range = selection.getRangeAt(0);
                
                // 创建空白对象
                const blankId = blanksData.length > 0 ? Math.max(...blanksData.map(b => b.id)) + 1 : 0;
                
                blanksData.push({
                    id: blankId,
                    word: selectedText,
                    position: range.startOffset,
                    length: selectedText.length
                });
                
                // 重新生成预览
                generatePreviewFromBlanks();
                generateAnswerList();
            }
            
            // 根据blanksData生成预览
            function generatePreviewFromBlanks() {
                // 按位置排序
                blanksData.sort((a, b) => a.position - b.position);
                
                let lastIndex = 0;
                let resultHTML = '';
                
                blanksData.forEach(blank => {
                    // 添加空白前的文本
                    resultHTML += originalText.substring(lastIndex, blank.position);
                    
                    // 添加空白
                    resultHTML += `<span class="blank" data-id="${blank.id}" title="点击删除空格">${'_'.repeat(blank.length)}</span>`;
                    
                    lastIndex = blank.position + blank.length;
                });
                
                // 添加剩余文本
                resultHTML += originalText.substring(lastIndex);
                
                preview.innerHTML = resultHTML;
                
                // 重新绑定事件
                document.querySelectorAll('.blank').forEach(blank => {
                    blank.addEventListener('click', removeBlank);
                });
            }
            
            // 复制内容
            function copyContent() {
                // 获取纯文本题目
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = preview.innerHTML;
                const questionText = tempDiv.textContent;
                
                // 获取答案文本
                const answers = Array.from(answerContainer.querySelectorAll('.answer-item'))
                    .map(item => item.textContent)
                    .join('\n');
                
                const content = `填空题：\n${questionText}\n\n答案：\n${answers}`;
                
                navigator.clipboard.writeText(content)
                    .then(() => {
                        alert('内容已复制到剪贴板！');
                    })
                    .catch(err => {
                        console.error('复制失败:', err);
                        alert('复制失败，请手动复制内容');
                    });
            }
            
            // 下载内容
            function downloadContent() {
                // 获取纯文本题目
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = preview.innerHTML;
                const questionText = tempDiv.textContent;
                
                // 获取答案文本
                const answers = Array.from(answerContainer.querySelectorAll('.answer-item'))
                    .map(item => item.textContent)
                    .join('\n');
                
                const content = `填空题：\n${questionText}\n\n答案：\n${answers}`;
                
                // 创建下载链接
                const blob = new Blob([content], {type: 'text/plain'});
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = `填空题_${new Date().toLocaleDateString()}.txt`;
                document.body.appendChild(a);
                a.click();
                
                // 清理
                setTimeout(() => {
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                }, 100);
            }
            
            // 初始化示例
            generateBtn.click();
        });
    </script>
</body>
</html>
