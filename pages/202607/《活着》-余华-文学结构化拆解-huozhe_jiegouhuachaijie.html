            // 计算最大频率
            const maxCount = Math.max(...wordFrequencyData.map(item => item.count));
            
            // 创建连接线
            characterData.links.forEach(link => {
                const sourceNode = characterData.nodes.find(n => n.id === link.source);
                const targetNode = characterData.nodes.find(n => n.id === link.target);
                
                if (sourceNode && targetNode) {
                    const dx = targetNode.x - sourceNode.x;
                    const dy = targetNode.y - sourceNode.y;
                    const length = Math.sqrt(dx * dx + dy * dy);
                    const angle = Math.atan2(dy, dx) * (180 / Math.PI);
                    
                    const relationLine = document.createElement('div');
                    relationLine.className = 'character-relation';
                    relationLine.style.left = `${sourceNode.x + 30}px`;
                    relationLine.style.top = `${sourceNode.y + 15}px`;
                    relationLine.style.width = `${length}px`;
                    relationLine.style.transform = `rotate(${angle}deg)`;
                    
                    graphContainer.appendChild(relationLine);
                }
            });
            
            // 创建人物节点
            characterData.nodes.forEach(node => {
                const nodeElement = document.createElement('div');
                nodeElement.className = 'character-node';
                nodeElement.textContent = node.name;
                nodeElement.style.left = `${node.x}px`;
                nodeElement.style.top = `${node.y}px`;
                
                // 添加悬停提示
                nodeElement.title = `${node.role}`;
                
                graphContainer.appendChild(nodeElement);
            });
        }
        
        // 渲染时间轴
        function renderTimeline() {
            const timelineContainer = document.getElementById('timeline');
            timelineContainer.innerHTML = '';
            
            timelineData.forEach((item, index) => {
                const timelineItem = document.createElement('div');
                timelineItem.className = 'timeline-item';
                
                const content = document.createElement('div');
                content.className = 'timeline-content';
                content.innerHTML = `
                    <div class="timeline-year">${item.year}</div>
                    <div class="timeline-event">${item.event}</div>
                `;
                
                timelineItem.appendChild(content);
                timelineContainer.appendChild(timelineItem);
            });
        }
        
        // 渲染主题分析
        function renderThemeAnalysis() {
            const themeContainer = document.getElementById('theme-analysis');
            themeContainer.innerHTML = '';
            
            themeData.forEach(theme => {
                const themeCard = document.createElement('div');
                themeCard.className = 'theme-card';
                themeCard.innerHTML = `
                    <div class="theme-name">${theme.name}</div>
                    <div class="theme-description">${theme.description}</div>
                `;
                
                themeContainer.appendChild(themeCard);
            });
        }
        
        // 渲染词频统计
        function renderWordFrequency() {
            const frequencyContainer = document.getElementById('word-frequency');
            frequencyContainer.innerHTML = '';
            
            // 计算最大频率
            const maxCount = Math.max(...wordFrequencyData.map(item => item.count));
            
            wordFrequencyData.forEach(item => {
                const wordBar = document.createElement('div');
                wordBar.className = 'word-bar';
                
                const percentage = (item.count / maxCount) * 100;
                
                wordBar.innerHTML = `
                    <div class="word-text">${item.word}</div>
                    <div class="word-progress">
                        <div class="word-progress-fill" style="width: 0%" data-width="${percentage}%"></div>
                    </div>
                    <div class="word-count">${item.count}</div>
                `;
                
                frequencyContainer.appendChild(wordBar);
            });
            
            // 动画效果
            setTimeout(() => {
                const progressBars = document.querySelectorAll('.word-progress-fill');
                progressBars.forEach(bar => {
                    bar.style.width = bar.getAttribute('data-width');
                });
            }, 100);
        }
        
        function renderChapters() {
            const chaptersContainer = document.getElementById('chapters-container');
            bookData.chapters.forEach(chapter => {
                const chapterCard = document.createElement('div');
                chapterCard.className = 'chapter-card';
                
                // 章节标题
                const chapterTitle = document.createElement('h3');
                chapterTitle.className = 'chapter-title';
                chapterTitle.textContent = `${chapter.chapter_num}：${chapter.chapter_title}`;
                chapterCard.appendChild(chapterTitle);
                
                // 内容摘要
                const summarySection = document.createElement('div');
                summarySection.innerHTML = `
                    <div class="section-title">内容摘要</div>
                    <div class="chapter-summary">${chapter.content_summary}</div>
                `;
                chapterCard.appendChild(summarySection);
                
                // 核心人物
                const charactersSection = document.createElement('div');
                charactersSection.className = 'core-characters';
                charactersSection.innerHTML = '<div class="section-title">核心人物</div><ul></ul>';
                const charactersList = charactersSection.querySelector('ul');
                chapter.core_characters.forEach(character => {
                    const li = document.createElement('li');
                    li.textContent = character;
                    charactersList.appendChild(li);
                });
                chapterCard.appendChild(charactersSection);
                
                // 章节主题
                const themesSection = document.createElement('div');
                themesSection.className = 'key-themes';
                themesSection.innerHTML = '<div class="section-title">章节主题</div>';
                chapter.key_themes.forEach(theme => {
                    const span = document.createElement('span');
                    span.textContent = theme;
                    themesSection.appendChild(span);
                });
                chapterCard.appendChild(themesSection);
                
                // 经典金句
                const quotesSection = document.createElement('div');
                quotesSection.className = 'classic-quotes';
                quotesSection.innerHTML = '<div class="section-title">经典金句</div>';
                chapter.classic_quotes.forEach(quote => {
                    const blockquote = document.createElement('blockquote');
                    blockquote.textContent = quote;
                    quotesSection.appendChild(blockquote);
                });
                chapterCard.appendChild(quotesSection);
                
                chaptersContainer.appendChild(chapterCard);
            });
        }
        
        // 人物关系切换功能
        function setupCharacterToggle() {
            const toggle = document.getElementById('character-toggle');
            const content = document.getElementById('character-content');
            const icon = document.getElementById('toggle-icon');
            
            toggle.addEventListener('click', () => {
                if (content.style.display === 'block') {
                    content.style.display = 'none';
                    icon.textContent = '▼';
                } else {
                    content.style.display = 'block';
                    icon.textContent = '▲';
                }
            });
        }
        
        // 回到顶部功能
        function setupBackToTop() {
            const backToTop = document.getElementById('back-to-top');
            
            window.addEventListener('scroll', () => {
                if (window.pageYOffset > 300) {
                    backToTop.classList.add('visible');
                } else {
                    backToTop.classList.remove('visible');
                }
            });
            
            backToTop.addEventListener('click', () => {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
        }
        
        // 初始化
        function init() {
            renderBookInfo();
            renderCharacterRelationship();
            renderCharacterGraph();
            renderTimeline();
            renderThemeAnalysis();
            renderWordFrequency();
            renderChapters();
            setupCharacterToggle();
            setupBackToTop();
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
