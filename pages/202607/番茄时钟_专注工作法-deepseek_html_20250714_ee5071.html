<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄时钟 | 专注工作法</title>
    <style>
        /* 全局样式 - 参考苹果官网风格 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        body {
            background-color: #f5f5f7;
            color: #1d1d1f;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            line-height: 1.5;
        }
        
        /* 导航栏 - 类似苹果顶部导航 */
        .navbar {
            background-color: rgba(245, 245, 247, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }
        
        .nav-title {
            font-size: 17px;
            font-weight: 500;
            color: #1d1d1f;
        }
        
        /* 主内容区域 */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px 40px;
            text-align: center;
        }
        
        /* 时钟显示区域 */
        .timer-container {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffffff, #f5f5f7);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05),
                        inset 0 0 0 1px rgba(255, 255, 255, 0.8),
                        inset 0 -2px 5px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }
        
        /* 进度环动画 */
        .progress-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }
        
        .progress-ring-circle {
            fill: none;
            stroke: #0071e3;
            stroke-width: 6;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s linear;
        }
        
        /* 时间显示 */
        .timer-display {
            font-size: 60px;
            font-weight: 300;
            color: #1d1d1f;
            margin-bottom: 5px;
            font-variant-numeric: tabular-nums;
        }
        
        .timer-state {
            font-size: 17px;
            color: #86868b;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* 控制按钮 */
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        
        .btn {
            border: none;
            border-radius: 30px;
            padding: 12px 24px;
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-primary {
            background-color: #0071e3;
            color: white;
            box-shadow: 0 4px 15px rgba(0, 113, 227, 0.3);
        }
        
        .btn-primary:hover {
            background-color: #0077ed;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 113, 227, 0.4);
        }
        
        .btn-secondary {
            background-color: rgba(0, 0, 0, 0.05);
            color: #1d1d1f;
        }
        
        .btn-secondary:hover {
            background-color: rgba(0, 0, 0, 0.1);
        }
        
        /* 设置区域 */
        .settings {
            margin-top: 40px;
            background-color: white;
            border-radius: 18px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        }
        
        .settings-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #1d1d1f;
        }
        
        .setting-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .setting-label {
            font-size: 15px;
            color: #515154;
        }
        
        .setting-input {
            width: 80px;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #d2d2d7;
            font-size: 15px;
            text-align: center;
            background-color: #f5f5f7;
        }
        
        /* 底部信息 */
        .footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #86868b;
        }
        
        /* 响应式调整 */
        @media (max-width: 500px) {
            .timer-container {
                width: 250px;
                height: 250px;
            }
            
            .timer-display {
                font-size: 50px;
            }
            
            .controls {
                flex-direction: column;
                width: 100%;
                max-width: 300px;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-title">番茄时钟</div>
    </nav>
    
    <!-- 主内容区域 -->
    <main class="main">
        <!-- 时钟显示 -->
        <div class="timer-container">
            <svg class="progress-ring" width="300" height="300">
                <circle class="progress-ring-circle" stroke-dasharray="942" stroke-dashoffset="0" r="150" cx="150" cy="150"></circle>
            </svg>
            <div class="timer-content">
                <div class="timer-display" id="time">25:00</div>
                <div class="timer-state" id="state">准备开始</div>
            </div>
        </div>
        
        <!-- 控制按钮 -->
        <div class="controls">
            <button class="btn btn-primary" id="startBtn">开始专注</button>
            <button class="btn btn-secondary" id="resetBtn">重置</button>
        </div>
        
        <!-- 设置区域 -->
        <div class="settings">
            <h3 class="settings-title">设置</h3>
            <div class="setting-group">
                <span class="setting-label">专注时间 (分钟)</span>
                <input type="number" class="setting-input" id="workTime" value="25" min="1" max="60">
            </div>
            <div class="setting-group">
                <span class="setting-label">休息时间 (分钟)</span>
                <input type="number" class="setting-input" id="breakTime" value="5" min="1" max="30">
            </div>
        </div>
    </main>
    
    <!-- 页脚 -->
    <footer class="footer">
        <p>番茄工作法 · 每25分钟专注工作后休息5分钟</p>
    </footer>
    
    <script>
        // DOM元素
        const timeDisplay = document.getElementById('time');
        const stateDisplay = document.getElementById('state');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const workTimeInput = document.getElementById('workTime');
        const breakTimeInput = document.getElementById('breakTime');
        const progressCircle = document.querySelector('.progress-ring-circle');
        
        // 变量
        let timer;
        let isRunning = false;
        let isWorkTime = true;
        let totalSeconds;
        let remainingSeconds;
        let circumference = 942; // 2πr (r=150)
        
        // 初始化
        function init() {
            const workMinutes = parseInt(workTimeInput.value);
            totalSeconds = workMinutes * 60;
            remainingSeconds = totalSeconds;
            updateDisplay();
            updateProgress(1);
        }
        
        // 更新时间显示
        function updateDisplay() {
            const minutes = Math.floor(remainingSeconds / 60);
            const seconds = remainingSeconds % 60;
            timeDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }
        
        // 更新进度环
        function updateProgress(progress) {
            const offset = circumference - progress * circumference;
            progressCircle.style.strokeDashoffset = offset;
        }
        
        // 开始/暂停计时器
        function toggleTimer() {
            if (isRunning) {
                clearInterval(timer);
                startBtn.textContent = '继续';
                isRunning = false;
            } else {
                startBtn.textContent = '暂停';
                isRunning = true;
                
                timer = setInterval(() => {
                    remainingSeconds--;
                    const progress = remainingSeconds / totalSeconds;
                    updateDisplay();
                    updateProgress(progress);
                    
                    if (remainingSeconds <= 0) {
                        clearInterval(timer);
                        isRunning = false;
                        
                        // 切换工作/休息时间
                        isWorkTime = !isWorkTime;
                        if (isWorkTime) {
                            totalSeconds = parseInt(workTimeInput.value) * 60;
                            stateDisplay.textContent = '专注时间';
                        } else {
                            totalSeconds = parseInt(breakTimeInput.value) * 60;
                            stateDisplay.textContent = '休息时间';
                        }
                        
                        remainingSeconds = totalSeconds;
                        updateDisplay();
                        updateProgress(1);
                        
                        // 播放提示音
                        playNotification();
                        
                        startBtn.textContent = '开始' + (isWorkTime ? '专注' : '休息');
                    }
                }, 1000);
            }
        }
        
        // 重置计时器
        function resetTimer() {
            clearInterval(timer);
            isRunning = false;
            isWorkTime = true;
            init();
            stateDisplay.textContent = '准备开始';
            startBtn.textContent = '开始专注';
        }
        
        // 播放提示音
        function playNotification() {
            const audio = new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU...'); // 简短的base64编码提示音
            audio.volume = 0.3;
            audio.play().catch(e => console.log('无法播放提示音:', e));
        }
        
        // 事件监听
        startBtn.addEventListener('click', toggleTimer);
        resetBtn.addEventListener('click', resetTimer);
        workTimeInput.addEventListener('change', resetTimer);
        breakTimeInput.addEventListener('change', resetTimer);
        
        // 初始化
        init();
    </script>
</body>
</html>
