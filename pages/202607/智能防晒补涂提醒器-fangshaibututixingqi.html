<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌞 智能防晒补涂提醒器</title>
    <style>
        :root {
            --primary: #FF9E4F;
            --danger: #FF6B6B;
            --safe: #51CF66;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #FFF8F1 0%, #FFE8D6 100%);
            color: #333;
            position: relative;
        }
        .author-info {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 12px;
            color: #666;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            margin-top: 30px;
        }
        h1 {
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 20px rgba(255, 158, 79, 0.1);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #FFE0C2;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            background: #FF8B37;
            transform: translateY(-2px);
        }
        .result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            display: none;
        }
        .uv-high {
            background-color: #FFF0F0;
            border-left: 5px solid var(--danger);
        }
        .uv-moderate {
            background-color: #FFF9E6;
            border-left: 5px solid var(--primary);
        }
        .uv-low {
            background-color: #F0FFF4;
            border-left: 5px solid var(--safe);
        }
        .timer {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
            color: var(--primary);
        }
        .fun-fact {
            padding: 12px;
            background: #FFF4E6;
            border-radius: 8px;
            margin-top: 15px;
            font-style: italic;
        }
        .activity-icon {
            font-size: 24px;
            margin-right: 10px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="author-info">
        作者：文璧<br>
        联系合作：<a href="/cdn-cgi/l/email-protection#fac8cccdcfcdcecbc3cdcfba8b8bd4999597"><span class="__cf_email__" data-cfemail="c4f6f2f3f1f3f0f5fdf3f184b5b5eaa7aba9">[email&#160;protected]</span></a>
    </div>

    <header>
        <h1>
            <span>🌞</span>
            智能防晒补涂提醒器
        </h1>
        <p>根据你的活动和紫外线强度，科学提醒补涂时间</p>
    </header>

    <div class="card">
        <div class="form-group">
            <label for="activity">当前活动类型</label>
            <select id="activity">
                <option value="120">🏃‍♀️ 日常户外（散步/通勤）</option>
                <option value="60">🧗‍♂️ 高强度户外（跑步/爬山）</option>
                <option value="45">🏊‍♀️ 游泳/暴汗活动</option>
            </select>
        </div>

        <div class="form-group">
            <label for="uv">当前紫外线指数 (1-10)</label>
            <input type="number" id="uv" min="1" max="10" value="5">
            <small>（可在天气APP中查看）</small>
        </div>

        <button onclick="startReminder()">开始防晒保护</button>

        <div id="result" class="result">
            <div id="uv-warning"></div>
            <p>建议每 <span id="interval" style="font-weight:bold"></span> 分钟补涂一次</p>
            <div class="timer" id="timer">--:--</div>
            <button onclick="stopReminder()" style="background: #666; margin-top:10px;">停止提醒</button>
            <div class="fun-fact" id="fun-fact"></div>
        </div>
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        let timerInterval;
        let remainingTime = 0;

        function startReminder() {
            // 获取用户输入
            const activity = document.getElementById("activity").value;
            const uv = parseInt(document.getElementById("uv").value);
            
            // 清除已有计时器
            if (timerInterval) clearInterval(timerInterval);
            
            // 设置初始时间（分钟）
            remainingTime = parseInt(activity);
            
            // 更新UI显示
            document.getElementById("interval").textContent = activity;
            
            // 根据紫外线指数设置警告级别
            const resultDiv = document.getElementById("result");
            const uvWarning = document.getElementById("uv-warning");
            const funFact = document.getElementById("fun-fact");
            
            if (uv >= 8) {
                resultDiv.className = "result uv-high";
                uvWarning.innerHTML = "🔥 <strong>紫外线爆表警告！</strong> 皮肤处于高危状态！";
                funFact.textContent = "此刻的紫外线强度足以在30分钟内晒伤皮肤！";
            } else if (uv >= 5) {
                resultDiv.className = "result uv-moderate";
                uvWarning.innerHTML = "☀️ <strong>紫外线强烈</strong> 需要认真防护！";
                funFact.textContent = "阴天也有80%的紫外线能穿透云层，别被欺骗啦~";
            } else {
                resultDiv.className = "result uv-low";
                uvWarning.innerHTML = "⛅ <strong>紫外线温和</strong> 但仍需基础防护";
                funFact.textContent = "日常通勤也会累积紫外线伤害，防晒不能偷懒哦！";
            }
            
            // 显示结果区域
            resultDiv.style.display = "block";
            
            // 开始倒计时
            updateTimerDisplay();
            timerInterval = setInterval(updateTimer, 1000);
        }

        function updateTimer() {
            remainingTime--;
            updateTimerDisplay();
            
            if (remainingTime <= 0) {
                clearInterval(timerInterval);
                document.getElementById("timer").textContent = "时间到！";
                document.getElementById("fun-fact").textContent = "💡 防晒保护已过期！立即补涂并重新开始计时~";
                
                // 播放提示音
                const audio = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-alarm-digital-clock-beep-989.mp3');
                audio.play();
            }
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(remainingTime);
            const seconds = remainingTime % 1 * 60;
            document.getElementById("timer").textContent = 
                `${minutes.toString().padStart(2, '0')}:${Math.round(seconds).toString().padStart(2, '0')}`;
        }

        function stopReminder() {
            clearInterval(timerInterval);
            document.getElementById("result").style.display = "none";
        }
    </script>
</body>
</html>
