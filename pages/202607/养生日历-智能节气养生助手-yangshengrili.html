<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>养生日历 - 智能节气养生助手</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 养生日历样式文件 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', '微软雅黑', Arial, sans-serif;
            background: linear-gradient(135deg, #ffeef7 0%, #f3e7ff 100%);
            min-height: 100vh;
            color: #5a4a6a;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 头部样式 */
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px 0;
            background: linear-gradient(135deg, #ffb3d9 0%, #d9b3ff 100%);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(255, 179, 217, 0.3);
            backdrop-filter: blur(10px);
        }

        .title {
            font-size: 2.5rem;
            color: #fff;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .title i {
            margin-right: 15px;
            color: #fff;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #fff;
            opacity: 0.9;
        }

        /* 时间节气区域 */
        .time-section {
            margin-bottom: 30px;
        }

        .current-time {
            background: rgba(255, 255, 255, 0.8);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .date-display {
            font-size: 1.8rem;
            font-weight: bold;
            color: #8b5a9f;
            margin-bottom: 15px;
        }

        .solar-term {
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        .term-label {
            color: #a67bb8;
        }

        .term-name {
            color: #d63384;
            font-weight: bold;
            background: linear-gradient(45deg, #ff6b9d, #c44569);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .location {
            color: #8b5a9f;
            font-size: 1rem;
        }

        .location i {
            margin-right: 8px;
            color: #ff6b9d;
        }

        /* 建议卡片网格 */
        .advice-section {
            margin-bottom: 30px;
        }

        .advice-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
        }

        .advice-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .advice-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .card-header i {
            font-size: 1.5rem;
            margin-right: 12px;
        }

        .card-header h3 {
            font-size: 1.3rem;
            font-weight: bold;
        }

        /* 不同卡片的主题色 */
        .dont-do .card-header i {
            color: #ff6b9d;
        }

        .dont-do .card-header h3 {
            color: #d63384;
        }

        .should-do .card-header i {
            color: #20c997;
        }

        .should-do .card-header h3 {
            color: #198754;
        }

        .food-recommend .card-header i {
            color: #fd7e14;
        }

        .food-recommend .card-header h3 {
            color: #e55a4e;
        }

        .advice-list {
            list-style: none;
        }

        .advice-list li {
            padding: 12px 0;
            border-bottom: 1px solid #f5f5f5;
            position: relative;
            padding-left: 25px;
            color: #5a4a6a;
            font-size: 1rem;
        }

        .advice-list li:last-child {
            border-bottom: none;
        }

        .advice-list li::before {
            content: "•";
            position: absolute;
            left: 0;
            top: 12px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .dont-do .advice-list li::before {
            color: #ff6b9d;
        }

        .should-do .advice-list li::before {
            color: #20c997;
        }

        .food-recommend .advice-list li::before {
            color: #fd7e14;
        }

        /* 教程区域 */
        .tutorial-section {
            margin-bottom: 30px;
        }

        .tutorial-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .tutorial-card .card-header i {
            color: #6f42c1;
        }

        .tutorial-card .card-header h3 {
            color: #6f42c1;
        }

        .tutorial-content {
            margin-top: 20px;
        }

        .tutorial-step {
            display: flex;
            align-items: flex-start;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(111, 66, 193, 0.05);
            border-radius: 10px;
            border-left: 4px solid #6f42c1;
        }

        .step-number {
            background: linear-gradient(135deg, #6f42c1, #8b5a9f);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 15px;
            flex-shrink: 0;
            font-size: 0.9rem;
        }

        .tutorial-step p {
            color: #5a4a6a;
            margin: 0;
            line-height: 1.6;
        }

        /* 底部样式 */
        .footer {
            background: linear-gradient(135deg, #8b5a9f 0%, #6f42c1 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            margin-top: 40px;
        }

        .contact-info {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
        }

        .contact-item i {
            font-size: 1.3rem;
            color: #ffb3d9;
        }

        .footer-text {
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 20px;
            opacity: 0.8;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .title {
                font-size: 2rem;
            }
            
            .advice-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .contact-info {
                flex-direction: column;
                gap: 20px;
            }
            
            .tutorial-step {
                flex-direction: column;
                text-align: center;
            }
            
            .step-number {
                margin-bottom: 10px;
                margin-right: 0;
            }
        }

        @media (max-width: 480px) {
            .title {
                font-size: 1.8rem;
            }
            
            .date-display {
                font-size: 1.5rem;
            }
            
            .solar-term {
                font-size: 1.1rem;
            }
            
            .advice-card {
                padding: 20px;
            }
        }

        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #ff6b9d;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 淡入动画 */
        .fade-in {
            animation: fadeIn 0.6s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <div class="header-content">
                <h1 class="title">
                    <i class="fas fa-calendar-alt"></i>
                    养生日历
                </h1>
                <p class="subtitle">智能节气养生助手</p>
            </div>
        </header>

        <!-- 主要内容区域 -->
        <main class="main-content">
            <!-- 当前时间和节气信息 -->
            <section class="time-section">
                <div class="current-time">
                    <div class="date-display">
                        <span id="currentDate"></span>
                    </div>
                    <div class="solar-term">
                        <span class="term-label">当前节气：</span>
                        <span id="currentSolarTerm" class="term-name"></span>
                    </div>
                    <div class="location">
                        <i class="fas fa-map-marker-alt"></i>
                        <span id="userLocation">正在获取位置...</span>
                    </div>
                </div>
            </section>

            <!-- 养生建议卡片 -->
            <section class="advice-section">
                <div class="advice-grid">
                    <!-- 不能做的事情 -->
                    <div class="advice-card dont-do">
                        <div class="card-header">
                            <i class="fas fa-times-circle"></i>
                            <h3>不宜做的事</h3>
                        </div>
                        <ul id="dontDoList" class="advice-list">
                            <li>正在加载...</li>
                        </ul>
                    </div>

                    <!-- 应该做的事情 -->
                    <div class="advice-card should-do">
                        <div class="card-header">
                            <i class="fas fa-check-circle"></i>
                            <h3>宜做的事</h3>
                        </div>
                        <ul id="shouldDoList" class="advice-list">
                            <li>正在加载...</li>
                        </ul>
                    </div>

                    <!-- 推荐食物 -->
                    <div class="advice-card food-recommend">
                        <div class="card-header">
                            <i class="fas fa-utensils"></i>
                            <h3>推荐食物</h3>
                        </div>
                        <ul id="foodList" class="advice-list">
                            <li>正在加载...</li>
                        </ul>
                    </div>
                </div>
            </section>

            <!-- 使用教程 -->
            <section class="tutorial-section">
                <div class="tutorial-card">
                    <div class="card-header">
                        <i class="fas fa-question-circle"></i>
                        <h3>使用教程</h3>
                    </div>
                    <div class="tutorial-content">
                        <div class="tutorial-step">
                            <span class="step-number">1</span>
                            <p>允许浏览器获取您的位置信息，以便提供精准的本地化养生建议</p>
                        </div>
                        <div class="tutorial-step">
                            <span class="step-number">2</span>
                            <p>系统会自动识别当前节气，并根据您的地理位置调整建议</p>
                        </div>
                        <div class="tutorial-step">
                            <span class="step-number">3</span>
                            <p>每日查看养生建议，养成健康生活习惯</p>
                        </div>
                        <div class="tutorial-step">
                            <span class="step-number">4</span>
                            <p>建议收藏本页面，方便随时查看</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- 底部联系方式 -->
        <footer class="footer">
            <div class="contact-info">
                <div class="contact-item">
                    <i class="fab fa-weixin"></i>
                    <span>微信：2537471224</span>
                </div>
                <div class="contact-item">
                    <i class="fas fa-envelope"></i>
                    <span>邮箱：<a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="97a5a2a4a0a3a0a6a5a5a3d7e6e6b9f4f8fa">[email&#160;protected]</a></span>
                </div>
            </div>
            <div class="footer-text">
                <p>© 2024 养生日历 - 关爱健康，从每一天开始</p>
            </div>
        </footer>
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 养生日历 JavaScript 功能文件

        class HealthCalendar {
            constructor() {
                this.solarTerms = [
                    { name: '立春', date: '2-4', advice: this.getSpringAdvice() },
                    { name: '雨水', date: '2-19', advice: this.getRainWaterAdvice() },
                    { name: '惊蛰', date: '3-6', advice: this.getAwakeningAdvice() },
                    { name: '春分', date: '3-21', advice: this.getSpringEquinoxAdvice() },
                    { name: '清明', date: '4-5', advice: this.getClearBrightAdvice() },
                    { name: '谷雨', date: '4-20', advice: this.getGrainRainAdvice() },
                    { name: '立夏', date: '5-6', advice: this.getSummerStartAdvice() },
                    { name: '小满', date: '5-21', advice: this.getGrainBudsAdvice() },
                    { name: '芒种', date: '6-6', advice: this.getGrainInEarAdvice() },
                    { name: '夏至', date: '6-21', advice: this.getSummerSolsticeAdvice() },
                    { name: '小暑', date: '7-7', advice: this.getMinorHeatAdvice() },
                    { name: '大暑', date: '7-23', advice: this.getMajorHeatAdvice() },
                    { name: '立秋', date: '8-8', advice: this.getAutumnStartAdvice() },
                    { name: '处暑', date: '8-23', advice: this.getStoppingHeatAdvice() },
                    { name: '白露', date: '9-8', advice: this.getWhiteDewAdvice() },
                    { name: '秋分', date: '9-23', advice: this.getAutumnEquinoxAdvice() },
                    { name: '寒露', date: '10-8', advice: this.getColdDewAdvice() },
                    { name: '霜降', date: '10-23', advice: this.getFrostDescentAdvice() },
                    { name: '立冬', date: '11-7', advice: this.getWinterStartAdvice() },
                    { name: '小雪', date: '11-22', advice: this.getMinorSnowAdvice() },
                    { name: '大雪', date: '12-7', advice: this.getMajorSnowAdvice() },
                    { name: '冬至', date: '12-22', advice: this.getWinterSolsticeAdvice() }
                ];
                
                this.userLocation = null;
                this.init();
            }

            init() {
                this.updateDateTime();
                this.getCurrentSolarTerm();
                this.getUserLocation();
                
                // 每分钟更新一次时间
                setInterval(() => {
                    this.updateDateTime();
                }, 60000);
            }

            updateDateTime() {
                const now = new Date();
                const options = {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    weekday: 'long'
                };
                
                const dateStr = now.toLocaleDateString('zh-CN', options);
                document.getElementById('currentDate').textContent = dateStr;
            }

            getCurrentSolarTerm() {
                const now = new Date();
                const currentYear = now.getFullYear();
                let currentTerm = null;
                let minDiff = Infinity;

                this.solarTerms.forEach(term => {
                    const [month, day] = term.date.split('-').map(Number);
                    const termDate = new Date(currentYear, month - 1, day);
                    
                    // 如果节气日期已过，检查明年的
                    if (termDate < now) {
                        termDate.setFullYear(currentYear + 1);
                    }
                    
                    const diff = Math.abs(now - termDate);
                    if (diff < minDiff) {
                        minDiff = diff;
                        currentTerm = term;
                    }
                });

                // 找到最近的已过节气
                let lastPassedTerm = null;
                this.solarTerms.forEach(term => {
                    const [month, day] = term.date.split('-').map(Number);
                    const termDate = new Date(currentYear, month - 1, day);
                    
                    if (termDate <= now) {
                        if (!lastPassedTerm || termDate > new Date(currentYear, lastPassedTerm.date.split('-')[0] - 1, lastPassedTerm.date.split('-')[1])) {
                            lastPassedTerm = term;
                        }
                    }
                });

                // 如果没有找到今年已过的节气，使用去年的最后一个
                if (!lastPassedTerm) {
                    lastPassedTerm = this.solarTerms[this.solarTerms.length - 1];
                }

                document.getElementById('currentSolarTerm').textContent = lastPassedTerm.name;
                this.displayAdvice(lastPassedTerm.advice);
            }

            async getUserLocation() {
                try {
                    if (navigator.geolocation) {
                        navigator.geolocation.getCurrentPosition(
                            async (position) => {
                                const lat = position.coords.latitude;
                                const lon = position.coords.longitude;
                                
                                try {
                                    // 使用免费的地理编码API获取位置信息
                                    const response = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=zh`);
                                    const data = await response.json();
                                    
                                    const location = data.city || data.locality || data.principalSubdivision || '未知位置';
                                    this.userLocation = location;
                                    document.getElementById('userLocation').textContent = location;
                                } catch (error) {
                                    console.error('获取位置信息失败:', error);
                                    document.getElementById('userLocation').textContent = '位置获取失败';
                                }
                            },
                            (error) => {
                                console.error('地理位置获取失败:', error);
                                document.getElementById('userLocation').textContent = '请允许位置访问';
                            }
                        );
                    } else {
                        document.getElementById('userLocation').textContent = '浏览器不支持定位';
                    }
                } catch (error) {
                    console.error('位置服务错误:', error);
                    document.getElementById('userLocation').textContent = '位置服务不可用';
                }
            }

            displayAdvice(advice) {
                // 显示不宜做的事
                const dontDoList = document.getElementById('dontDoList');
                dontDoList.innerHTML = '';
                advice.dontDo.forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = item;
                    li.classList.add('fade-in');
                    dontDoList.appendChild(li);
                });

                // 显示宜做的事
                const shouldDoList = document.getElementById('shouldDoList');
                shouldDoList.innerHTML = '';
                advice.shouldDo.forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = item;
                    li.classList.add('fade-in');
                    shouldDoList.appendChild(li);
                });

                // 显示推荐食物
                const foodList = document.getElementById('foodList');
                foodList.innerHTML = '';
                advice.foods.forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = item;
                    li.classList.add('fade-in');
                    foodList.appendChild(li);
                });
            }

            // 春季节气养生建议
            getSpringAdvice() {
                return {
                    dontDo: [
                        '不宜过早减衣，防止春寒伤身',
                        '不宜久坐不动，影响阳气生发',
                        '不宜熬夜晚睡，违背春季养生规律',
                        '不宜过度进补，容易上火',
                        '不宜情绪波动过大，伤肝气'
                    ],
                    shouldDo: [
                        '早睡早起，顺应春季阳气生发',
                        '适当运动，如散步、太极拳',
                        '保持心情舒畅，多与自然接触',
                        '注意保暖，特别是颈部和脚部',
                        '多开窗通风，保持室内空气清新'
                    ],
                    foods: [
                        '韭菜 - 温补肾阳，助春阳生发',
                        '春笋 - 清热化痰，利水消肿',
                        '菠菜 - 养血润燥，清理肠胃',
                        '豆芽 - 清热解毒，利湿消肿',
                        '蜂蜜 - 润肺止咳，养颜美容'
                    ]
                };
            }

            getRainWaterAdvice() {
                return {
                    dontDo: [
                        '不宜剧烈运动，避免大汗淋漓',
                        '不宜食用过于寒凉的食物',
                        '不宜长时间待在潮湿环境',
                        '不宜过度忧虑，影响脾胃功能',
                        '不宜穿着过薄，注意保暖'
                    ],
                    shouldDo: [
                        '调养脾胃，注意饮食规律',
                        '适当运动，增强体质',
                        '保持室内干燥，防止湿气过重',
                        '早睡早起，养护阳气',
                        '多吃温性食物，健脾祛湿'
                    ],
                    foods: [
                        '山药 - 健脾益气，补肺固肾',
                        '红枣 - 补中益气，养血安神',
                        '薏米 - 健脾祛湿，清热排脓',
                        '白萝卜 - 清热生津，凉血止血',
                        '银耳 - 滋阴润肺，养胃生津'
                    ]
                };
            }

            getAwakeningAdvice() {
                return {
                    dontDo: [
                        '不宜食用过于辛辣刺激的食物',
                        '不宜情绪激动，保持平和心态',
                        '不宜过度劳累，注意休息',
                        '不宜贪凉饮冷，伤害脾胃',
                        '不宜久视电子屏幕，保护视力'
                    ],
                    shouldDo: [
                        '多吃清淡食物，养护肝脏',
                        '适当户外活动，接触自然',
                        '保证充足睡眠，养精蓄锐',
                        '练习深呼吸，调节情绪',
                        '多喝温水，促进新陈代谢'
                    ],
