<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时间单位换算工具</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .card {
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            overflow: hidden;
            margin-bottom: 30px;
        }
        
        .card-header {
            background: linear-gradient(to right, #2575fc, #6a11cb);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.4rem;
        }
        
        .converter {
            padding: 25px;
        }
        
        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .input-section, .output-section {
            flex: 1;
            min-width: 280px;
        }
        
        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            color: #2575fc;
            font-weight: 600;
        }
        
        .input-container {
            display: flex;
            border: 1px solid #ddd;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: border-color 0.3s;
        }
        
        .input-container:focus-within {
            border-color: #2575fc;
            box-shadow: 0 0 0 2px rgba(37, 117, 252, 0.2);
        }
        
        input {
            flex: 1;
            padding: 15px;
            border: none;
            font-size: 1.1rem;
            outline: none;
        }
        
        select {
            padding: 0 15px;
            border: none;
            background: #f5f7fa;
            border-left: 1px solid #ddd;
            font-size: 1rem;
            cursor: pointer;
            outline: none;
        }
        
        .result-container {
            background: #f9fbfd;
            border: 1px solid #e1e5eb;
            border-radius: 10px;
            padding: 15px;
            font-size: 1.1rem;
            min-height: 56px;
            display: flex;
            align-items: center;
        }
        
        .swap-btn {
            display: flex;
            justify-content: center;
            margin: 10px 0 20px;
        }
        
        .swap-btn button {
            background: #4e89ff;
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(78, 137, 255, 0.4);
            transition: all 0.3s ease;
        }
        
        .swap-btn button:hover {
            background: #3a70e0;
            transform: rotate(180deg);
        }
        
        .info-section {
            background: #f5f7fa;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .info-section h3 {
            color: #2575fc;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .conversion-rates {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .rate-item {
            background: white;
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            text-align: center;
        }
        
        .rate-item .value {
            font-weight: 600;
            color: #2575fc;
            font-size: 1.1rem;
        }
        
        .rate-item .unit {
            font-size: 0.9rem;
            color: #666;
        }
        
        footer {
            text-align: center;
            color: white;
            padding: 20px;
            font-size: 0.9rem;
            opacity: 0.85;
            margin-top: auto;
        }
        
        @media (max-width: 600px) {
            .input-group {
                flex-direction: column;
            }
            
            header h1 {
                font-size: 2rem;
            }
            
            .converter {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-clock"></i> 时间单位换算工具</h1>
            <p>快速转换纳秒、微秒、毫秒、秒、分钟、小时、天、周、月、年等时间单位</p>
        </header>
        
        <div class="card">
            <div class="card-header">
                <i class="fas fa-exchange-alt"></i> 单位转换器
            </div>
            
            <div class="converter">
                <div class="input-group">
                    <div class="input-section">
                        <div class="section-title">
                            <i class="fas fa-arrow-right-to-bracket"></i> 输入
                        </div>
                        <div class="input-container">
                            <input type="number" id="inputValue" value="1" min="0" step="any">
                            <select id="inputUnit">
                                <option value="ns">纳秒 (ns)</option>
                                <option value="μs">微秒 (μs)</option>
                                <option value="ms">毫秒 (ms)</option>
                                <option value="s" selected>秒 (s)</option>
                                <option value="min">分钟 (min)</option>
                                <option value="hr">小时 (hr)</option>
                                <option value="day">天 (day)</option>
                                <option value="week">周 (week)</option>
                                <option value="month">月 (month)</option>
                                <option value="year">年 (year)</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="output-section">
                        <div class="section-title">
                            <i class="fas fa-arrow-right-from-bracket"></i> 输出
                        </div>
                        <div class="result-container" id="result">
                            60.00 分钟
                        </div>
                        <select id="outputUnit">
                            <option value="ns">纳秒 (ns)</option>
                            <option value="μs">微秒 (μs)</option>
                            <option value="ms">毫秒 (ms)</option>
                            <option value="s">秒 (s)</option>
                            <option value="min" selected>分钟 (min)</option>
                            <option value="hr">小时 (hr)</option>
                            <option value="day">天 (day)</option>
                            <option value="week">周 (week)</option>
                            <option value="month">月 (month)</option>
                            <option value="year">年 (year)</option>
                        </select>
                    </div>
                </div>
                
                <div class="swap-btn">
                    <button id="swapBtn"><i class="fas fa-sync-alt"></i></button>
                </div>
            </div>
        </div>
        
        <div class="info-section">
            <h3><i class="fas fa-info-circle"></i> 时间单位换算关系</h3>
            <div class="conversion-rates">
                <div class="rate-item">
                    <div class="value">1 分钟</div>
                    <div class="unit">= 60 秒</div>
                </div>
                <div class="rate-item">
                    <div class="value">1 小时</div>
                    <div class="unit">= 60 分钟</div>
                </div>
                <div class="rate-item">
                    <div class="value">1 天</div>
                    <div class="unit">= 24 小时</div>
                </div>
                <div class="rate-item">
                    <div class="value">1 周</div>
                    <div class="unit">= 7 天</div>
                </div>
                <div class="rate-item">
                    <div class="value">1 月</div>
                    <div class="unit">≈ 30.44 天</div>
                </div>
                <div class="rate-item">
                    <div class="value">1 年</div>
                    <div class="unit">= 365.25 天</div>
                </div>
            </div>
        </div>
    </div>
    
    <footer>
        <p>© 2023 时间单位换算工具 | 响应式设计，兼容所有设备</p>
    </footer>

    <script>
        // 定义时间单位换算关系（以秒为基准）
        const conversionFactors = {
            ns: 1e-9,      // 纳秒
            μs: 1e-6,      // 微秒
            ms: 0.001,     // 毫秒
            s: 1,          // 秒
            min: 60,        // 分钟
            hr: 3600,      // 小时
            day: 86400,    // 天 (24小时)
            week: 604800,   // 周 (7天)
            month: 2629800, // 月 (365.25/12 ≈ 30.4375天)
            year: 31557600  // 年 (365.25天)
        };
        
        // 获取DOM元素
        const inputValue = document.getElementById('inputValue');
        const inputUnit = document.getElementById('inputUnit');
        const outputUnit = document.getElementById('outputUnit');
        const result = document.getElementById('result');
        const swapBtn = document.getElementById('swapBtn');
        
        // 格式化数字函数
        function formatNumber(num) {
            // 处理非常大或非常小的数字
            if (Math.abs(num) > 1e15 || (Math.abs(num) < 1e-4 && num !== 0)) {
                return num.toExponential(6);
            }
            
            // 处理常规数字
            const parts = num.toString().split('.');
            if (parts.length === 1) {
                return num.toLocaleString();
            }
            
            const integerPart = parts[0];
            let decimalPart = parts[1];
            
            // 如果小数部分超过6位，截断到6位
            if (decimalPart.length > 6) {
                decimalPart = decimalPart.substring(0, 6);
            }
            
            // 移除末尾多余的零
            decimalPart = decimalPart.replace(/0+$/, '');
            
            // 如果小数部分为空，则只返回整数部分
            return decimalPart ? 
                `${parseInt(integerPart).toLocaleString()}.${decimalPart}` : 
                parseInt(integerPart).toLocaleString();
        }
        
        // 转换函数
        function convert() {
            const value = parseFloat(inputValue.value);
            if (isNaN(value)) {
                result.textContent = '请输入有效数字';
                return;
            }
            
            // 获取输入和输出单位
            const fromUnit = inputUnit.value;
            const toUnit = outputUnit.value;
            
            // 转换为秒
            const valueInSeconds = value * conversionFactors[fromUnit];
            
            // 转换为目标单位
            const resultValue = valueInSeconds / conversionFactors[toUnit];
            
            // 获取单位名称
            const unitNames = {
                ns: "纳秒",
                μs: "微秒",
                ms: "毫秒",
                s: "秒",
                min: "分钟",
                hr: "小时",
                day: "天",
                week: "周",
                month: "月",
                year: "年"
            };
            
            // 显示结果
            result.textContent = `${formatNumber(resultValue)} ${unitNames[toUnit]}`;
        }
        
        // 交换输入输出单位
        function swapUnits() {
            const tempUnit = inputUnit.value;
            inputUnit.value = outputUnit.value;
            outputUnit.value = tempUnit;
            convert();
        }
        
        // 添加事件监听器
        inputValue.addEventListener('input', convert);
        inputUnit.addEventListener('change', convert);
        outputUnit.addEventListener('change', convert);
        swapBtn.addEventListener('click', swapUnits);
        
        // 页面加载时执行一次转换
        window.addEventListener('load', convert);
    </script>
</body>
</html>
