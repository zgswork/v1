<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>任务进度追踪器</title>
  <style>
    :root {
      --bg: #f8f9fb;
      --card: #ffffff;
      --text: #1a1d21;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #3b82f6;
      --accent-contrast: #ffffff;
      --danger: #ef4444;
      --success: #10b981;
      --shadow: 0 2px 10px rgba(0,0,0,0.06);
    }
    :root[data-theme="dark"] {
      --bg: #0f1216;
      --card: #161a21;
      --text: #d1d5db;
      --muted: #9ca3af;
      --border: #22262d;
      --accent: #60a5fa;
      --accent-contrast: #0b0f14;
      --danger: #f87171;
      --success: #34d399;
      --shadow: 0 2px 12px rgba(0,0,0,0.35);
    }

    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 14px/1.6 system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .container { max-width: 960px; margin: 0 auto; padding: 20px; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 16px;
    }
    .title { font-weight: 700; font-size: 20px; }
    .actions { display: flex; align-items: center; gap: 8px; }

    button, .btn {
      border: 1px solid var(--border);
      background: var(--card); color: var(--text);
      padding: 8px 12px; border-radius: 8px; cursor: pointer;
      box-shadow: var(--shadow);
    }
    button.primary { background: var(--accent); color: var(--accent-contrast); border-color: transparent; }
    button.danger { background: var(--danger); color: #fff; border-color: transparent; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      box-shadow: var(--shadow); padding: 14px; margin-bottom: 12px;
    }

    .add-form { display: grid; grid-template-columns: 2fr auto auto auto; gap: 10px; }
    .add-form input[type="text"] {
      width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 10px; background: transparent; color: var(--text);
    }

    .toolbar { display: grid; grid-template-columns: 1fr auto auto auto auto auto; gap: 10px; align-items: center; }
    .toolbar .filters { display: flex; gap: 6px; flex-wrap: wrap; }
    .toolbar input[type="search"] { border: 1px solid var(--border); border-radius: 10px; padding: 9px; background: transparent; color: var(--text); }

    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
    .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px; text-align: center; }
    .stat strong { display: block; font-size: 18px; }

    .list { display: grid; gap: 10px; }

    .task { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
    .task-left { display: flex; align-items: center; gap: 10px; }
    .task-title {
      font-weight: 600; outline: none; border-radius: 6px; padding: 2px 4px;
    }
    .task-title[contenteditable="true"]:focus { box-shadow: inset 0 0 0 2px var(--accent); }

    .progress-wrap { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
    .status { font-size: 12px; color: var(--muted); }
    .status.done { color: var(--success); font-weight: 600; }
    .status.inprogress { color: var(--accent); font-weight: 600; }
    .status.todo { color: var(--muted); }

    input[type="range"] { width: 100%; appearance: none; -webkit-appearance: none; -moz-appearance: none; background: transparent; }
    input[type="range"]::-webkit-slider-runnable-track { height: 8px; border-radius: 999px; background: linear-gradient(90deg, var(--accent) 0%, var(--accent) var(--range-pct, 0%), var(--border) var(--range-pct, 0%), var(--border) 100%); }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--card); border: 2px solid var(--accent); margin-top: -5px; }
    input[type="range"]::-moz-range-track { height: 8px; background: var(--border); border-radius: 999px; }
    input[type="range"]::-moz-range-progress { height: 8px; background: var(--accent); border-radius: 999px; }
    input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--card); border: 2px solid var(--accent); }

    .task-actions { display: flex; align-items: center; gap: 6px; }

    .priority-badge { font-size: 12px; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--border); }
    .priority-high { color: #fff; background: var(--danger); border-color: transparent; }
    .priority-medium { color: var(--accent-contrast); background: var(--accent); border-color: transparent; }
    .priority-low { color: var(--muted); background: transparent; }

    .card.overdue { border-color: var(--danger); box-shadow: 0 0 0 2px rgba(239,68,68,0.2); }
    .card.due-soon { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
    .due-info { font-size: 12px; color: var(--muted); }

    .subtasks { margin-top: 8px; display: grid; gap: 6px; }
    .subtask-item { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; }
    .subtask-input { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 6px; background: transparent; color: var(--text); }

    footer { color: var(--muted); text-align: center; padding: 16px 0; }

    @media (max-width: 640px) {
      .add-form { grid-template-columns: 1fr; }
      .toolbar { grid-template-columns: 1fr; }
      .task { grid-template-columns: 1fr; }
      .task-actions { justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="title">任务进度追踪器</div>
      <div class="actions">
        <button id="themeToggle" title="切换浅/深主题">切换主题</button>
        <button id="clearDone" class="btn" title="移除已完成">清理已完成</button>
        <button id="clearAll" class="danger" title="清空所有任务">清空所有任务</button>
      </div>
    </header>

    <div class="card add-form">
      <input id="newTitle" type="text" placeholder="输入任务标题，如：完成需求评审" />
      <select id="newPriority" class="btn" title="优先级">
        <option value="high">高</option>
        <option value="medium" selected>中</option>
        <option value="low">低</option>
      </select>
      <input id="newDue" type="date" title="到期日期" />
      <input id="newRemind" type="date" title="提醒日期" />
      <button id="addBtn" class="primary">添加</button>
    </div>

    <div class="toolbar">
      <div class="filters">
        <button data-filter="all" class="btn">全部</button>
        <button data-filter="todo" class="btn">未开始</button>
        <button data-filter="inprogress" class="btn">进行中</button>
        <button data-filter="done" class="btn">已完成</button>
      </div>
      <input id="search" type="search" placeholder="搜索任务…" />
      <select id="sortKey" class="btn" title="排序字段">
        <option value="createdAt">按时间</option>
        <option value="progress">按进度</option>
        <option value="title">按标题</option>
        <option value="priority">按优先级</option>
      </select>
      <select id="sortOrder" class="btn" title="排序方向">
        <option value="desc">降序</option>
        <option value="asc">升序</option>
      </select>
      <button id="exportBtn" class="btn" title="导出为 JSON">导出</button>
      <button id="importBtn" class="btn" title="导入覆盖">导入覆盖</button>
      <input id="importFile" type="file" accept="application/json" style="display:none" />
      <button id="mergeImportBtn" class="btn" title="合并导入">合并导入</button>
      <input id="importFileMerge" type="file" accept="application/json" style="display:none" />
    </div>

    <div class="stats">
      <div class="stat"><span>总任务</span><strong id="statTotal">0</strong></div>
      <div class="stat"><span>进行中</span><strong id="statDoing">0</strong></div>
      <div class="stat"><span>已完成</span><strong id="statDone">0</strong></div>
      <div class="stat"><span>整体进度</span><strong id="statProgress">0%</strong></div>
    </div>

    <section class="list" id="list"></section>

    <footer>
      本工具数据保存在浏览器本地（localStorage），清除缓存将导致数据丢失。
    </footer>
  </div>

  <script>
    const STORAGE_KEY = 'task-tracker-v1';
    const THEME_KEY = 'task-tracker-theme';

    let state = {
      tasks: [],
      filter: 'all',
      search: '',
      sortKey: 'createdAt',
      sortOrder: 'desc'
    };

    function uid() { return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.tasks)); }
    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) state.tasks = JSON.parse(raw);
        else state.tasks = [];
      } catch (e) { state.tasks = []; }
    }

    function applyTheme(initial=false) {
      let t = localStorage.getItem(THEME_KEY);
      if (!t && initial) {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      if (!t) t = 'light';
      document.documentElement.setAttribute('data-theme', t);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem(THEME_KEY, next);
    }

    function render() {
      renderStats();
      renderList();
    }

    function renderStats() {
      const total = state.tasks.length;
      const done = state.tasks.filter(t => computeTaskProgress(t) >= 100).length;
      const doing = state.tasks.filter(t => {
        const p = computeTaskProgress(t); return p > 0 && p < 100;
      }).length;
      const overall = total === 0 ? 0 : Math.round(state.tasks.reduce((acc, t) => acc + Math.min(100, Math.max(0, computeTaskProgress(t))), 0) / (total * 100) * 100);
      document.getElementById('statTotal').textContent = total;
      document.getElementById('statDoing').textContent = doing;
      document.getElementById('statDone').textContent = done;
      document.getElementById('statProgress').textContent = overall + '%';
    }

    function statusOf(p) {
      if (p >= 100) return { cls: 'done', text: '已完成' };
      if (p <= 0) return { cls: 'todo', text: '未开始' };
      return { cls: 'inprogress', text: '进行中' };
    }

    function computeTaskProgress(t) {
      const clamp = (n) => Math.max(0, Math.min(100, Number(n)||0));
      if (Array.isArray(t.subtasks) && t.subtasks.length) {
        const total = t.subtasks.length;
        const done = t.subtasks.filter(s => !!s.done).length;
        return clamp(Math.round(done / total * 100));
      }
      return clamp(t.progress);
    }

    function getDueStatus(t) {
      if (!t.dueDate) return null;
      const d = new Date(t.dueDate);
      if (isNaN(d)) return null;
      const today = new Date(); today.setHours(0,0,0,0);
      const due = new Date(d); due.setHours(0,0,0,0);
      const days = Math.floor((due - today) / 86400000);
      if (days < 0) return 'overdue';
      if (days <= 3) return 'due-soon';
      return null;
    }

    function renderList() {
      const root = document.getElementById('list');
      root.innerHTML = '';
      let tasks = state.tasks.slice();
      if (state.filter !== 'all') {
        tasks = tasks.filter(t => {
          const s = statusOf(computeTaskProgress(t)).cls;
          return s === state.filter;
        });
      }

      // 排序
      const key = state.sortKey || 'createdAt';
      const order = state.sortOrder || 'desc';
      const priorityRank = { high: 2, medium: 1, low: 0 };
      tasks.sort((a, b) => {
        let va, vb;
        switch (key) {
          case 'progress':
            va = computeTaskProgress(a); vb = computeTaskProgress(b); break;
          case 'title':
            va = (a.title || '').toLowerCase(); vb = (b.title || '').toLowerCase(); break;
          case 'priority':
            va = priorityRank[(a.priority || 'medium')]; vb = priorityRank[(b.priority || 'medium')]; break;
          default:
            va = a.createdAt || 0; vb = b.createdAt || 0;
        }
        if (typeof va === 'string' && typeof vb === 'string') {
          const comp = va.localeCompare(vb);
          return order === 'asc' ? comp : -comp;
        }
        return order === 'asc' ? (va - vb) : (vb - va);
      });
      if (state.search) {
        const q = state.search.toLowerCase();
        tasks = tasks.filter(t => (t.title||'').toLowerCase().includes(q));
      }
      tasks.forEach(t => root.appendChild(renderItem(t)));
      if (tasks.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'card';
        const noTasks = state.tasks.length === 0;
        empty.textContent = noTasks ? '暂无任务，添加一个试试吧！' : '没有符合条件的任务，试试调整筛选或清除搜索。';
        root.appendChild(empty);
      }
    }

    function renderItem(t) {
      const p = computeTaskProgress(t);
      const card = document.createElement('div');
      card.className = 'card';
      const dueStatus = getDueStatus(t);
      if (dueStatus) card.classList.add(dueStatus);

      const row = document.createElement('div');
      row.className = 'task';

      // left: checkbox + title + priority
      const left = document.createElement('div');
      left.className = 'task-left';
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = p >= 100;
      checkbox.addEventListener('change', () => {
        if (Array.isArray(t.subtasks) && t.subtasks.length) {
          const checked = checkbox.checked;
          t.subtasks.forEach(s => s.done = checked);
        } else {
          t.progress = checkbox.checked ? 100 : 0;
        }
        save(); render();
      });
      const title = document.createElement('div');
      title.className = 'task-title';
      title.contentEditable = true;
      title.textContent = t.title || '';
      title.addEventListener('blur', () => {
        const v = title.textContent.trim();
        t.title = v || '未命名任务';
        save(); renderStats();
      });
      const prBadge = document.createElement('span');
      const pr = (t.priority || 'medium');
      prBadge.className = 'priority-badge ' + (pr === 'high' ? 'priority-high' : pr === 'low' ? 'priority-low' : 'priority-medium');
      prBadge.textContent = pr === 'high' ? '高' : pr === 'low' ? '低' : '中';
      left.appendChild(checkbox);
      left.appendChild(title);
      left.appendChild(prBadge);

      // middle: progress + status
      const middle = document.createElement('div');
      middle.className = 'progress-wrap';
      const range = document.createElement('input');
      range.type = 'range'; range.min = 0; range.max = 100; range.step = 1; range.value = Math.max(0, Math.min(100, p));
      range.style.setProperty('--range-pct', Math.round(range.value) + '%');
      const pct = document.createElement('div');
      pct.textContent = Math.round(p) + '%';
      if (Array.isArray(t.subtasks) && t.subtasks.length) {
        range.disabled = true;
        pct.textContent += '（由子任务汇总）';
      }
      range.addEventListener('input', () => { 
        pct.textContent = Math.round(range.value) + '%'; 
        range.style.setProperty('--range-pct', Math.round(range.value) + '%');
      });
      range.addEventListener('change', () => {
        range.style.setProperty('--range-pct', Math.round(range.value) + '%');
        if (!(Array.isArray(t.subtasks) && t.subtasks.length)) {
          t.progress = parseInt(range.value, 10) || 0;
          save(); renderStats();
          checkbox.checked = computeTaskProgress(t) >= 100;
          const s = statusOf(computeTaskProgress(t));
          statusEl.textContent = s.text; statusEl.className = 'status ' + s.cls;
        }
      });
      middle.appendChild(range);
      middle.appendChild(pct);

      const statusEl = document.createElement('div');
      const s = statusOf(p);
      statusEl.className = 'status ' + s.cls;
      statusEl.textContent = s.text;

      // right: actions + due info
      const right = document.createElement('div');
      right.className = 'task-actions';
      const dueInfo = document.createElement('div');
      dueInfo.className = 'due-info';
      dueInfo.textContent = t.dueDate ? ('到期: ' + t.dueDate) : '';
      const del = document.createElement('button');
      del.textContent = '删除';
      del.className = 'btn';
      del.addEventListener('click', () => {
        state.tasks = state.tasks.filter(x => x.id !== t.id);
        save(); render();
      });

      right.appendChild(statusEl);
      right.appendChild(dueInfo);
      right.appendChild(del);

      row.appendChild(left);
      row.appendChild(middle);
      row.appendChild(right);

      // subtasks section
      const subWrap = document.createElement('div');
      subWrap.className = 'subtasks';
      if (!Array.isArray(t.subtasks)) { t.subtasks = []; }
      t.subtasks.forEach(st => {
        const item = document.createElement('div');
        item.className = 'subtask-item';
        const c = document.createElement('input'); c.type = 'checkbox'; c.checked = !!st.done;
        c.addEventListener('change', () => { st.done = c.checked; save(); render(); });
        const txt = document.createElement('div'); txt.contentEditable = true; txt.textContent = st.title || '';
        txt.addEventListener('blur', () => { st.title = txt.textContent.trim() || '子任务'; save(); renderStats(); });
        const rm = document.createElement('button'); rm.className = 'btn'; rm.textContent = '删除';
        rm.addEventListener('click', () => { t.subtasks = t.subtasks.filter(x => x !== st); save(); render(); });
        item.appendChild(c); item.appendChild(txt); item.appendChild(rm);
        subWrap.appendChild(item);
      });
      const addSubInput = document.createElement('input'); addSubInput.className = 'subtask-input'; addSubInput.placeholder = '添加子任务…';
      addSubInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const v = addSubInput.value.trim(); if (!v) return; t.subtasks.push({ id: uid(), title: v, done: false }); addSubInput.value=''; save(); render();
        }
      });
      subWrap.appendChild(addSubInput);

      card.appendChild(row);
      card.appendChild(subWrap);
      return card;
    }

    function addTaskFromInput() {
      const input = document.getElementById('newTitle');
      const v = input.value.trim();
      if (!v) return;
      const pr = (document.getElementById('newPriority').value) || 'medium';
      const due = document.getElementById('newDue').value || '';
      const remind = document.getElementById('newRemind').value || '';
      const task = { id: uid(), title: v, progress: 0, createdAt: Date.now(), priority: pr, dueDate: due, remindDate: remind, subtasks: [] };
      state.tasks.unshift(task);
      input.value = '';
      save(); render();
    }

    function exportJSON() {
      const data = JSON.stringify(state.tasks, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = '任务进度追踪器.json'; a.click();
      URL.revokeObjectURL(url);
    }

    function importJSONFromFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (!Array.isArray(parsed)) throw new Error('格式错误：需要数组');
          if (!confirm('导入将覆盖当前任务，是否继续？')) return;
          const normalized = parsed.map(item => {
            const title = (item.title || '').toString();
            let p = parseInt(item.progress ?? 0, 10);
            if (isNaN(p)) p = 0; p = Math.max(0, Math.min(100, p));
            const subtasks = Array.isArray(item.subtasks) ? item.subtasks.map(s => ({ id: s.id || uid(), title: (s.title||'子任务').toString(), done: !!s.done })) : [];
            const pr = ['high','medium','low'].includes(item.priority) ? item.priority : 'medium';
            return {
              id: item.id || uid(),
              title: title || '未命名任务',
              progress: p,
              createdAt: item.createdAt || Date.now(),
              priority: pr,
              dueDate: item.dueDate || '',
              remindDate: item.remindDate || '',
              subtasks
            };
          });
          state.tasks = normalized;
          save(); render();
          alert('导入成功，共 ' + normalized.length + ' 条任务');
        } catch (err) {
          alert('导入失败：' + (err.message || err));
        }
      };
      reader.readAsText(file, 'utf-8');
    }

    function importJSONMergeFromFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (!Array.isArray(parsed)) throw new Error('格式错误：需要数组');
          const normalized = parsed.map(item => {
            const title = (item.title || '').toString();
            let p = parseInt(item.progress ?? 0, 10);
            if (isNaN(p)) p = 0; p = Math.max(0, Math.min(100, p));
            const subtasks = Array.isArray(item.subtasks) ? item.subtasks.map(s => ({ id: s.id || uid(), title: (s.title||'子任务').toString(), done: !!s.done })) : [];
            const pr = ['high','medium','low'].includes(item.priority) ? item.priority : 'medium';
            return {
              id: item.id || uid(),
              title: title || '未命名任务',
              progress: p,
              createdAt: item.createdAt || Date.now(),
              priority: pr,
              dueDate: item.dueDate || '',
              remindDate: item.remindDate || '',
              subtasks
            };
          });
          const existing = new Set(state.tasks.map(t => t.id));
          const incoming = normalized.filter(t => !existing.has(t.id));
          state.tasks = state.tasks.concat(incoming);
          save(); render();
          alert('合并导入成功，新增 ' + incoming.length + ' 条，跳过 ' + (normalized.length - incoming.length) + ' 条重复项');
        } catch (err) {
          alert('合并导入失败：' + (err.message || err));
        }
      };
      reader.readAsText(file, 'utf-8');
    }

    function clearDone() {
      const before = state.tasks.length;
      state.tasks = state.tasks.filter(t => computeTaskProgress(t) < 100);
      const after = state.tasks.length;
      save(); render();
    }

    function clearAll() {
      if (!state.tasks.length) return;
      if (confirm('确定清空所有任务？该操作不可撤销')) {
        state.tasks = [];
        save(); render();
      }
    }

    function initEvents() {
      document.getElementById('addBtn').addEventListener('click', addTaskFromInput);
      document.getElementById('newTitle').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); addTaskFromInput(); }
      });

      document.getElementById('exportBtn').addEventListener('click', exportJSON);
      document.getElementById('importBtn').addEventListener('click', () => {
        const fileInput = document.getElementById('importFile');
        fileInput.value = '';
        fileInput.click();
      });
      document.getElementById('importFile').addEventListener('change', (e) => {
        const f = e.target.files && e.target.files[0];
        importJSONFromFile(f);
      });
      document.getElementById('clearDone').addEventListener('click', clearDone);
      document.getElementById('clearAll').addEventListener('click', clearAll);

      document.getElementById('themeToggle').addEventListener('click', toggleTheme);

      document.getElementById('search').addEventListener('input', (e) => {
        state.search = e.target.value || '';
        renderList();
      });

      document.getElementById('sortKey').addEventListener('change', (e) => {
        state.sortKey = e.target.value || 'createdAt';
        renderList();
      });
      document.getElementById('sortOrder').addEventListener('change', (e) => {
        state.sortOrder = e.target.value || 'desc';
        renderList();
      });

      document.querySelectorAll('.filters .btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.filter = btn.dataset.filter;
          document.querySelectorAll('.filters .btn').forEach(b => b.classList.remove('primary'));
          btn.classList.add('primary');
          renderList();
        });
      });

      document.getElementById('mergeImportBtn').addEventListener('click', () => {
        const fileInput = document.getElementById('importFileMerge');
        fileInput.value = '';
        fileInput.click();
      });
      document.getElementById('importFileMerge').addEventListener('change', (e) => {
        const f = e.target.files && e.target.files[0];
        importJSONMergeFromFile(f);
      });

      // Default filter: 全部
      const first = document.querySelector('.filters .btn[data-filter="all"]');
      if (first) first.classList.add('primary');
    }

    // boot
    load();
    applyTheme(true);
    initEvents();
    render();
  </script>
</body>
</html>
