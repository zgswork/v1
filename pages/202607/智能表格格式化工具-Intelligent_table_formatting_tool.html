<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能表格格式化工具</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.2rem;
        }
        
        .description {
            color: #7f8c8d;
            font-size: 1.1rem;
        }
        
        .main-content {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .input-section, .output-section {
            flex: 1;
            min-width: 300px;
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        
        h2 {
            color: #2c3e50;
            font-size: 1.5rem;
        }
        
        .detected-info {
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: #555;
        }
        
        textarea {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            resize: vertical;
            transition: border 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .format-btn {
            background: #3498db;
            color: white;
            flex: 2;
        }
        
        .format-btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }
        
        .clear-btn {
            background: #e74c3c;
            color: white;
            flex: 1;
        }
        
        .clear-btn:hover {
            background: #c0392b;
        }
        
        .table-container {
            overflow-x: auto;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px;
        }
        
        th, td {
            border: 1px solid #ddd;
            padding: 12px 15px;
            text-align: left;
            position: relative;
            resize: horizontal;
            overflow: auto;
            min-width: 80px;
        }
        
        th {
            background-color: #f2f2f2;
            font-weight: 600;
            cursor: col-resize;
            user-select: none;
        }
        
        th::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            width: 5px;
            background-color: #3498db;
            cursor: col-resize;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        th:hover::after {
            opacity: 1;
        }
        
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        
        tr:hover {
            background-color: #f1f1f1;
        }
        
        .copy-options {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .copy-md {
            background: #2ecc71;
            color: white;
            flex: 1;
        }
        
        .copy-md:hover {
            background: #27ae60;
        }
        
        .copy-excel {
            background: #f39c12;
            color: white;
            flex: 1;
        }
        
        .copy-excel:hover {
            background: #e67e22;
        }
        
        .download-options {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .download-md {
            background: #9b59b6;
            color: white;
            flex: 1;
        }
        
        .download-md:hover {
            background: #8e44ad;
        }
        
        .download-excel {
            background: #1abc9c;
            color: white;
            flex: 1;
        }
        
        .download-excel:hover {
            background: #16a085;
        }
        
        .adjust-options {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .adjust-btn {
            background: #34495e;
            color: white;
            flex: 1;
        }
        
        .adjust-btn:hover {
            background: #2c3e50;
        }
        
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .button-group, .copy-options, .download-options, .adjust-options {
                flex-direction: column;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .table-container {
                max-height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>智能表格格式化工具</h1>
            <p class="description">粘贴混乱表格数据，自动识别分隔符，生成整洁表格</p>
        </header>
        
        <div class="main-content">
            <div class="input-section">
                <div class="section-title">
                    <h2>输入表格数据</h2>
                </div>
                
                <div class="detected-info" id="detected-info">
                    检测到的分隔符将显示在这里...
                </div>
                
                <textarea id="input-text" placeholder="请粘贴您的表格数据（支持逗号、制表符、竖线等分隔符）..."></textarea>
                
                <div class="button-group">
                    <button class="format-btn" id="format-btn">格式化表格</button>
                    <button class="clear-btn" id="clear-btn">清空输入</button>
                </div>
            </div>
            
            <div class="output-section">
                <div class="section-title">
                    <h2>格式化结果</h2>
                </div>
                
                <div class="table-container" id="table-container">
                    <table id="output-table">
                        <thead>
                            <tr>
                                <th>列1</th>
                                <th>列2</th>
                                <th>列3</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>示例数据1</td>
                                <td>示例数据2</td>
                                <td>示例数据3</td>
                            </tr>
                            <tr>
                                <td>示例数据4</td>
                                <td>示例数据5</td>
                                <td>示例数据6</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <div class="adjust-options">
                    <button class="adjust-btn" id="auto-adjust">自动调整列宽</button>
                </div>
                
                <div class="copy-options">
                    <button class="copy-md" id="copy-md">复制为Markdown</button>
                    <button class="copy-excel" id="copy-excel">复制为Excel格式</button>
                </div>
                
                <div class="download-options">
                    <button class="download-md" id="download-md">下载为Markdown</button>
                    <button class="download-excel" id="download-excel">下载为Excel</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const inputText = document.getElementById('input-text');
            const detectedInfo = document.getElementById('detected-info');
            const outputTable = document.getElementById('output-table');
            const formatBtn = document.getElementById('format-btn');
            const clearBtn = document.getElementById('clear-btn');
            const copyMdBtn = document.getElementById('copy-md');
            const copyExcelBtn = document.getElementById('copy-excel');
            const downloadMdBtn = document.getElementById('download-md');
            const downloadExcelBtn = document.getElementById('download-excel');
            const autoAdjustBtn = document.getElementById('auto-adjust');
            
            // 检测分隔符函数
            function detectDelimiter(text) {
                const delimiters = [
                    { char: '\t', name: '制表符' },
                    { char: ',', name: '逗号' },
                    { char: '|', name: '竖线' },
                    { char: ';', name: '分号' }
                ];
                
                let maxCount = 0;
                let detectedDelimiter = { char: ',', name: '逗号' };
                
                // 分析前几行来确定最可能的分隔符
                const lines = text.split('\n').slice(0, 5);
                
                for (const delimiter of delimiters) {
                    let totalCount = 0;
                    
                    for (const line of lines) {
                        if (line.trim() === '') continue;
                        
                        const count = (line.match(new RegExp(`\\${delimiter.char}`, 'g')) || []).length;
                        totalCount += count;
                    }
                    
                    if (totalCount > maxCount) {
                        maxCount = totalCount;
                        detectedDelimiter = delimiter;
                    }
                }
                
                return detectedDelimiter;
            }
            
            // 格式化表格函数
            function formatTable() {
                const text = inputText.value.trim();
                if (!text) {
                    detectedInfo.textContent = '请输入表格数据';
                    return;
                }
                
                // 检测分隔符
                const delimiter = detectDelimiter(text);
                detectedInfo.textContent = `检测到分隔符: ${delimiter.name} (${delimiter.char === '\t' ? '\\t' : delimiter.char})`;
                
                // 解析表格数据
                const lines = text.split('\n').filter(line => line.trim() !== '');
                const rows = [];
                let maxCols = 0;
                
                for (const line of lines) {
                    const row = line.split(delimiter.char).map(cell => cell.trim());
                    rows.push(row);
                    if (row.length > maxCols) maxCols = row.length;
                }
                
                // 确保所有行有相同的列数
                for (const row of rows) {
                    while (row.length < maxCols) {
                        row.push('');
                    }
                }
                
                // 生成表格HTML
                let tableHTML = '<thead><tr>';
                
                // 生成表头（使用第一行数据或默认列名）
                if (rows.length > 0) {
                    for (let i = 0; i < maxCols; i++) {
                        tableHTML += `<th contenteditable="true">${rows[0][i] || `列${i+1}`}</th>`;
                    }
                    tableHTML += '</tr></thead><tbody>';
                    
                    // 生成表格内容（跳过第一行如果它是表头）
                    const startRow = rows.length > 1 ? 1 : 0;
                    for (let i = startRow; i < rows.length; i++) {
                        tableHTML += '<tr>';
                        for (let j = 0; j < maxCols; j++) {
                            tableHTML += `<td contenteditable="true">${rows[i][j] || ''}</td>`;
                        }
                        tableHTML += '</tr>';
                    }
                } else {
                    // 如果没有数据，创建空表
                    tableHTML += '<th>列1</th><th>列2</th><th>列3</th></tr></thead><tbody>';
                    tableHTML += '<tr><td></td><td></td><td></td></tr>';
                }
                
                tableHTML += '</tbody>';
                outputTable.innerHTML = tableHTML;
                
                // 添加列宽调整功能
                enableColumnResize();
            }
            
            // 启用列宽调整功能
            function enableColumnResize() {
                const headers = outputTable.querySelectorAll('th');
                let isResizing = false;
                let startX, startWidth, columnIndex;
                
                headers.forEach((header, index) => {
                    header.addEventListener('mousedown', function(e) {
                        if (e.offsetX > this.offsetWidth - 10) {
                            isResizing = true;
                            startX = e.pageX;
                            startWidth = this.offsetWidth;
                            columnIndex = index;
                            document.addEventListener('mousemove', handleResize);
                            document.addEventListener('mouseup', stopResize);
                            e.preventDefault();
                        }
                    });
                });
                
                function handleResize(e) {
                    if (!isResizing) return;
                    
                    const width = startWidth + (e.pageX - startX);
                    if (width > 50) { // 最小宽度限制
                        headers[columnIndex].style.width = width + 'px';
                        
                        // 调整同一列的所有单元格
                        const cells = outputTable.querySelectorAll(`td:nth-child(${columnIndex + 1})`);
                        cells.forEach(cell => {
                            cell.style.width = width + 'px';
                        });
                    }
                }
                
                function stopResize() {
                    isResizing = false;
                    document.removeEventListener('mousemove', handleResize);
                    document.removeEventListener('mouseup', stopResize);
                }
            }
            
            // 自动调整列宽
            function autoAdjustColumns() {
                const headers = outputTable.querySelectorAll('th');
                const rows = outputTable.querySelectorAll('tbody tr');
                
                headers.forEach((header, colIndex) => {
                    let maxWidth = header.textContent.length * 10 + 20; // 基于内容计算宽度
                    
                    // 检查每行对应列的内容宽度
                    rows.forEach(row => {
                        const cell = row.cells[colIndex];
                        const cellWidth = cell.textContent.length * 8 + 20;
                        if (cellWidth > maxWidth) maxWidth = cellWidth;
                    });
                    
                    // 设置列宽
                    header.style.width = maxWidth + 'px';
                    rows.forEach(row => {
                        row.cells[colIndex].style.width = maxWidth + 'px';
                    });
                });
            }
            
            // 获取表格数据
            function getTableData() {
                const headers = outputTable.querySelectorAll('th');
                const rows = outputTable.querySelectorAll('tbody tr');
                
                if (headers.length === 0) {
                    alert('没有表格数据');
                    return null;
                }
                
                return { headers, rows };
            }
            
            // 生成Markdown格式表格
            function generateMarkdown() {
                const tableData = getTableData();
                if (!tableData) return null;
                
                const { headers, rows } = tableData;
                
                let markdown = '|';
                
                // 添加表头
                headers.forEach(header => {
                    markdown += ` ${header.textContent} |`;
                });
                
                markdown += '\n|';
                
                // 添加分隔线
                headers.forEach(() => {
                    markdown += ' --- |';
                });
                
                markdown += '\n';
                
                // 添加数据行
                rows.forEach(row => {
                    markdown += '|';
                    for (let i = 0; i < headers.length; i++) {
                        markdown += ` ${row.cells[i].textContent} |`;
                    }
                    markdown += '\n';
                });
                
                return markdown;
            }
            
            // 生成Excel格式（TSV）
            function generateExcel() {
                const tableData = getTableData();
                if (!tableData) return null;
                
                const { headers, rows } = tableData;
                
                let tsv = '';
                
                // 添加表头
                headers.forEach((header, index) => {
                    tsv += header.textContent;
                    if (index < headers.length - 1) tsv += '\t';
                });
                
                tsv += '\n';
                
                // 添加数据行
                rows.forEach(row => {
                    for (let i = 0; i < headers.length; i++) {
                        tsv += row.cells[i].textContent;
                        if (i < headers.length - 1) tsv += '\t';
                    }
                    tsv += '\n';
                });
                
                return tsv;
            }
            
            // 复制为Markdown格式
            function copyAsMarkdown() {
                const markdown = generateMarkdown();
                if (!markdown) return;
                
                copyToClipboard(markdown, 'Markdown');
            }
            
            // 复制为Excel格式（TSV）
            function copyAsExcel() {
                const excel = generateExcel();
                if (!excel) return;
                
                copyToClipboard(excel, 'Excel');
            }
            
            // 下载为Markdown格式
            function downloadAsMarkdown() {
                const markdown = generateMarkdown();
                if (!markdown) return;
                
                downloadFile(markdown, 'table.md', 'text/markdown');
            }
            
            // 下载为Excel格式
            function downloadAsExcel() {
                const excel = generateExcel();
                if (!excel) return;
                
                downloadFile(excel, 'table.csv', 'text/csv');
            }
            
            // 下载文件
            function downloadFile(content, filename, mimeType) {
                const blob = new Blob([content], { type: mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
            
            // 复制到剪贴板
            function copyToClipboard(text, format) {
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(text)
                        .then(() => {
                            alert(`${format}格式表格已复制到剪贴板`);
                        })
                        .catch(err => {
                            console.error('复制失败: ', err);
                            fallbackCopy(text, format);
                        });
                } else {
                    fallbackCopy(text, format);
                }
            }
            
            // 兼容旧浏览器的复制方法
            function fallbackCopy(text, format) {
                const textArea = document.createElement('textarea');
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                
                try {
                    document.execCommand('copy');
                    alert(`${format}格式表格已复制到剪贴板`);
                } catch (err) {
                    console.error('复制失败: ', err);
                    alert('复制失败，请手动选择文本并复制');
                }
                
                document.body.removeChild(textArea);
            }
            
            // 清空输入
            function clearInput() {
                inputText.value = '';
                detectedInfo.textContent = '检测到的分隔符将显示在这里...';
                outputTable.innerHTML = `
                    <thead>
                        <tr>
                            <th>列1</th>
                            <th>列2</th>
                            <th>列3</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>示例数据1</td>
                            <td>示例数据2</td>
                            <td>示例数据3</td>
                        </tr>
                        <tr>
                            <td>示例数据4</td>
                            <td>示例数据5</td>
                            <td>示例数据6</td>
                        </tr>
                    </tbody>
                `;
            }
            
            // 事件监听
            formatBtn.addEventListener('click', formatTable);
            clearBtn.addEventListener('click', clearInput);
            copyMdBtn.addEventListener('click', copyAsMarkdown);
            copyExcelBtn.addEventListener('click', copyAsExcel);
            downloadMdBtn.addEventListener('click', downloadAsMarkdown);
            downloadExcelBtn.addEventListener('click', downloadAsExcel);
            autoAdjustBtn.addEventListener('click', autoAdjustColumns);
            
            // 示例数据
            inputText.value = `姓名,年龄,城市,职业
张三,25,北京,工程师
李四,30,上海,设计师
王五,28,广州,产品经理`;
        });
    </script>
</body>
</html>
