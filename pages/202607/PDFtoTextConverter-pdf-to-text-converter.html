<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to Text Converter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #pdf-viewer {
            width: 100%;
            height: 500px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
        }
        #text-output {
            width: 100%;
            height: 200px;
            border: 1px solid #ccc;
            padding: 10px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>PDF to Text Converter</h1>
    <input type="file" id="pdf-input" accept=".pdf">
    <button id="clear-btn" style="margin-left: 10px; color: red;">清空</button>
    <button id="undo-btn" style="margin-left: 10px;">撤回</button>
    <div id="pdf-viewer"></div>
    <h3>Extracted Text:</h3>
    <textarea id="text-output" readonly></textarea>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.worker.min.js';

        document.getElementById('pdf-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function() {
                const typedArray = new Uint8Array(this.result);
                extractText(typedArray);
            };
            reader.readAsArrayBuffer(file);
        });

        let previousText = '';
        
        async function extractText(pdfData) {
            try {
                previousText = document.getElementById('text-output').value;
                const pdf = await pdfjsLib.getDocument(pdfData).promise;
                let fullText = '';
                
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    const textItems = textContent.items.map(item => item.str);
                    fullText += textItems.join(' ') + '\n\n';
                }
                
                document.getElementById('text-output').value = fullText;
            } catch (error) {
                console.error('Error extracting text:', error);
                document.getElementById('text-output').value = 'Error extracting text: ' + error.message;
            }
        }
        
        document.getElementById('clear-btn').addEventListener('click', function() {
            document.getElementById('text-output').value = '';
            document.getElementById('pdf-input').value = '';
            document.getElementById('pdf-viewer').innerHTML = '';
        });
        
        document.getElementById('undo-btn').addEventListener('click', function() {
            document.getElementById('text-output').value = previousText;
        });
    </script>
</body>
</html>
