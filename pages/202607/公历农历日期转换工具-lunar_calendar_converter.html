<body>
    <div class="container">

    <script>
        // 权威的农历转换算法 - 数据来源香港天文台
        var calendar = {
            /** * 农历1900-2100的润大小信息表 * @Array Of Property * @return Hex */
            lunarInfo:[0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,//1900-1909

                0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,//1930-1939

                0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,//1950-1959
                0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,//1960-1969
                0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,//1970-1979
                0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,//1980-1989
                0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x055c0,0x0ab60,0x096d5,0x092e0,//1990-1999
                0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,//2000-2009

                0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,//2030-2039
                0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,//2040-2049
                /**Add By JJonline@JJonline.Cn**/
                0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50, 0x06b20,0x1a6c4,0x0aae0,//2050-2059
                0x0a2e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,//2060-2069
                0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,//2070-2079
                0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,//2080-2089
                0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a2d0,0x0d150,0x0f252,//2090-2099
                0x0d520],//2100

            /** * 公历每个月份的天数普通表 * @Array Of Property * @return Number */
            solarMonth:[31,28,31,30,31,30,31,31,30,31,30,31],

            /** * 天干地支之天干速查表 * @Array Of Property trans["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"] * @return Cn string */
            Gan:["\u7532","\u4e59","\u4e19","\u4e01","\u620a","\u5df1","\u5e9a","\u8f9b","\u58ec","\u7678"],

            /** * 天干地支之地支速查表 * @Array Of Property * @trans["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"] * @return Cn string */
            Zhi:["\u5b50","\u4e11","\u5bc5","\u536f","\u8fb0","\u5df3","\u5348","\u672a","\u7533","\u9149","\u620c","\u4ea5"],

            /** * 天干地支之地支速查表<=>生肖 * @Array Of Property * @trans["鼠","牛","虎","兔","龙","蛇","马","羊","猴","鸡","狗","猪"] * @return Cn string */
            Animals:["\u9f20","\u725b","\u864e","\u5154","\u9f99","\u86c7","\u9a6c","\u7f8a","\u7334","\u9e21","\u72d7","\u732a"],

            /** * 数字转中文速查表 * @Array Of Property * @trans ['日','一','二','三','四','五','六','七','八','九','十'] * @return Cn string */
            nStr1:["\u65e5","\u4e00","\u4e8c","\u4e09","\u56db","\u4e94","\u516d","\u4e03","\u516b","\u4e5d","\u5341"],

            /** * 日期转农历称呼速查表 * @Array Of Property * @trans ['初','十','廿','卅'] * @return Cn string */
            nStr2:["\u521d","\u5341","\u5eff","\u5345"],

            /** * 月份转农历称呼速查表 * @Array Of Property * @trans ['正','一','二','三','四','五','六','七','八','九','十','冬','腊'] * @return Cn string */
            nStr3:["\u6b63","\u4e8c","\u4e09","\u56db","\u4e94","\u516d","\u4e03","\u516b","\u4e5d","\u5341","\u51ac","\u814a"],

            /** * 返回农历y年一整年的总天数 * @param lunar Year * @return Number * @eg:var count = calendar.lYearDays(1987) ;//count=387 */
            lYearDays:function(y) {
                var i, sum = 348;
                for(i=0x8000; i>0x8; i>>=1) {
                    sum += (calendar.lunarInfo[y-1900] & i)? 1: 0;
                }
                return(sum+calendar.leapDays(y));
            },

            /** * 返回农历y年闰月是哪个月；若y年没有闰月 则返回0 * @param lunar Year * @return Number (0-12) * @eg:var leapMonth = calendar.leapMonth(1987) ;//leapMonth=6 */
            leapMonth:function(y) {
                //闰字编码 \u95f0
                return(calendar.lunarInfo[y-1900] & 0xf);
            },

            /** * 返回农历y年闰月的天数 若该年没有闰月则返回0 * @param lunar Year * @return Number (0、29、30) * @eg:var leapMonthDay = calendar.leapDays(1987) ;//leapMonthDay=29 */
            leapDays:function(y) {
                if(calendar.leapMonth(y)) {
                    return((calendar.lunarInfo[y-1900] & 0x10000)? 30: 29);
                }
                return(0);
            },

            /** * 返回农历y年m月（非闰月）的总天数，计算m为闰月时的天数请使用leapDays方法 * @param lunar Year * @return Number (-1、29、30) * @eg:var MonthDay = calendar.monthDays(1987,9) ;//MonthDay=29 */
            monthDays:function(y,m) {
                if(m>12 || m<1) {return -1}//月份参数从1至12，参数错误返回-1
                return( (calendar.lunarInfo[y-1900] & (0x10000>>m))? 30: 29 );
            },

            /** * 返回公历(!)y年m月的天数 * @param solar Year * @return Number (-1、28、29、30、31) * @eg:var solarMonthDay = calendar.leapDays(1987) ;//solarMonthDay=30 */
            solarDays:function(y,m) {
                if(m>12 || m<1) {return -1} //若参数错误 返回-1
                var ms = m-1;
                if(ms==1) { //2月份的闰平规律测算后确认返回28或29
                    return(((y%4 == 0) && (y%100 != 0) || (y%400 == 0))? 29: 28);
                }else {
                    return(calendar.solarMonth[ms]);
                }
            },

            /** * 农历年份转换为干支纪年 * @param lYear 农历年的年份数 * @return Cn string */
            toGanZhiYear:function(lYear) {
                var ganKey = (lYear - 3) % 10;
                var zhiKey = (lYear - 3) % 12;
                if(ganKey == 0) ganKey = 10;//如果余数为0则为最后一个天干
                if(zhiKey == 0) zhiKey = 12;//如果余数为0则为最后一个地支
                return calendar.Gan[ganKey-1] + calendar.Zhi[zhiKey-1];
            },

            /** * 公历月、日判断所属星座 * @param cMonth [description] * @param cDay [description] * @return Cn string */
            toAstro:function(cMonth,cDay) {
                var s = "\u9b54\u7faf\u6c34\u74f6\u53cc\u9c7c\u767d\u7f8a\u91d1\u725b\u53cc\u5b50\u5de8\u87f9\u72ee\u5b50\u5904\u5973\u5929\u79e4\u5929\u874e\u5c04\u624b\u9b54\u7faf";
                var arr = [20,19,21,21,21,22,23,23,23,23,22,22];
                return s.substr(cMonth*2 - (cDay < arr[cMonth-1] ? 2 : 0),2) + "\u5ea7";//座
            },

            /** * 传入农历数字月份返回汉语通俗表示法 * @param lunar month * @return Cn string * @eg:var cnMonth = calendar.toChinaMonth(12) ;//cnMonth='腊月' */
            toChinaMonth:function(m) {
                // 月 => \u6708
                if(m>12 || m<1) {return -1} //若参数错误 返回-1
                var s = calendar.nStr3[m-1];
                s+= "\u6708";//加上月字
                return s;
            },

            /** * 传入农历日期数字返回汉字表示法 * @param lunar day * @return Cn string * @eg:var cnDay = calendar.toChinaDay(21) ;//cnMonth='廿一' */
            toChinaDay:function(d){ //日 => \u65e5
                var s;
                switch (d) {
                    case 10:
                        s = '\u521d\u5341'; break;
                    case 20:
                        s = '\u4e8c\u5341'; break;
                    case 30:
                        s = '\u4e09\u5341'; break;
                    default :
                        s = calendar.nStr2[Math.floor(d/10)];
                        s += calendar.nStr1[d%10];
                }
                return(s);
            },

            /** * 年份转生肖[!仅能大致转换] => 精确划分生肖分界线是"立春" * @param y year * @return Cn string * @eg:var animal = calendar.getAnimal(1987) ;//animal='兔' */
            getAnimal: function(y) {
                return calendar.Animals[(y - 4) % 12]
            },

            /** * 传入阳历年月日获得详细的公历、农历object信息 <=>JSON * @param y solar year * @param m solar month * @param d solar day * @return JSON object * @eg:console.log(calendar.solar2lunar(1987,11,01)); */
            solar2lunar:function (y,m,d) { //参数区间1900.1.31~2100.12.31
                //年份限定、上限
                if(y<1900 || y>2100) {
                    return -1;// undefined转换为数字变为NaN
                }
                //公历传参最下限
                if(y==1900&&m==1&&d<31) {
                    return -1;
                }
                //未传参 获得当天
                if(!y) {
                    var objDate = new Date();
                }else {
                    var objDate = new Date(y,parseInt(m)-1,d)
                }
                var i, leap=0, temp=0;
                //修正ymd参数
                var y = objDate.getFullYear(),
                    m = objDate.getMonth()+1,
                    d = objDate.getDate();
                var offset = (Date.UTC(objDate.getFullYear(),objDate.getMonth(),objDate.getDate()) - Date.UTC(1900,0,31))/86400000;
                for(i=1900; i<2101 && offset>0; i++) {
                    temp = calendar.lYearDays(i);
                    offset -= temp;
                }
                if(offset<0) {
                    offset+=temp; i--;
                }
                //是否今天
                var isTodayObj = new Date(),
                    isToday = false;
                if(isTodayObj.getFullYear()==y && isTodayObj.getMonth()+1==m && isTodayObj.getDate()==d) {
                    isToday = true;
                }
                //星期几  
                var nWeek = objDate.getDay(),
                    cWeek = calendar.nStr1[nWeek];
                //数字表示周几顺应天朝周一开始的惯例
                if(nWeek==0) {
                    nWeek = 7;
                }
                //农历年
                var year = i;
                var leap = calendar.leapMonth(i); //闰哪个月
                var isLeap = false;

                //效验闰月
                for(i=1; i<13 && offset>0; i++) {
                    //闰月
                    if(leap>0 && i==(leap+1) && isLeap==false){
                        --i;
                        isLeap = true; temp = calendar.leapDays(year); //计算农历闰月天数
                    }
                    else{
                        temp = calendar.monthDays(year, i);//计算农历普通月天数
                    }
                    //解除闰月
                    if(isLeap==true && i==(leap+1)) { isLeap = false; }
                    offset -= temp;
                }
                // 闰月导致数组下标重叠取反
                if(offset==0 && leap>0 && i==leap+1)
                {
                    if(isLeap){
                        isLeap = false;
                    }else{
                        isLeap = true; --i;
                    }
                }
                if(offset<0)
                {
                    offset += temp; --i;
                }
                //农历月
                var month = i;
                //农历日
                var day = offset + 1;
                //天干地支处理
                var sm = m-1;
                var gzY = calendar.toGanZhiYear(year);

                //该日期所属的星座
                var astro = calendar.toAstro(m,d);

                return {'lYear':year,'lMonth':month,'lDay':day,'Animal':calendar.getAnimal(year),'IMonthCn':(isLeap?"\u95f0":'')+calendar.toChinaMonth(month),'IDayCn':calendar.toChinaDay(day),'cYear':y,'cMonth':m,'cDay':d,'gzYear':gzY,'isToday':isToday,'isLeap':isLeap,'nWeek':nWeek,'ncWeek':"\u661f\u671f"+cWeek,'astro':astro};
            },

            /** * 传入农历年月日以及传入的月份是否闰月获得详细的公历、农历object信息 <=>JSON * @param y lunar year * @param m lunar month * @param d lunar day * @param isLeapMonth lunar month is leap or not.[如果是农历闰月第四个参数赋值true即可] * @return JSON object * @eg:console.log(calendar.lunar2solar(1987,9,10)); */
            lunar2solar:function(y,m,d,isLeapMonth) { //参数区间1900.1.31~2100.12.1
                var isLeapMonth = !!isLeapMonth;
                var leapOffset = 0;
                var leapMonth = calendar.leapMonth(y);
                var leapDay = calendar.leapDays(y);
                if(isLeapMonth&&(leapMonth!=m)) {return -1;}//传参要求计算该闰月公历 但该年得出的闰月与传参的月份并不同
                if(y==2100&&m==12&&d>1 || y==1900&&m==1&&d<31) {return -1;}//超出了最大极限值
                var day = calendar.monthDays(y,m);
                var _day = day;
                //bugFix 2016-9-25
                //if month is leap, _day use leapDays method
                if(isLeapMonth) {
                    _day = calendar.leapDays(y,m);
                }
                if(y < 1900 || y > 2100 || d > _day) {return -1;}//参数合法性效验

                //计算农历的时间差
                var offset = 0;
                for(var i=1900;i<y;i++) {
                    offset+=calendar.lYearDays(i);
                }
                var leap = 0,isAdd= false;
                for(var i=1;i<m;i++) {
                    leap = calendar.leapMonth(y);
                    if(!isAdd) {//处理闰月
                        if(leap<=i && leap>0) {
                            offset+=calendar.leapDays(y);isAdd = true;
                        }
                    }
                    offset+=calendar.monthDays(y,i);
                }
                //转换闰月农历 需补充该年闰月的前一个月的时差
                if(isLeapMonth) {offset+=day;}
                //1900年农历正月一日的公历时间为1900年1月30日0时0分0秒(该时间也是本农历的最开始起始点)
                var stmap = Date.UTC(1900,1,30,0,0,0);
                var calObj = new Date((offset+d-31)*86400000+stmap);
                var cY = calObj.getUTCFullYear();
                var cM = calObj.getUTCMonth()+1;
                var cD = calObj.getUTCDate();

                return calendar.solar2lunar(cY,cM,cD);
            }
        };

        // 转换农历到公历 - 增强版
        function convertLunarToSolar() {
            const year = parseInt(document.getElementById('lunarYear').value);
            const month = parseInt(document.getElementById('lunarMonth').value);
            const day = parseInt(document.getElementById('lunarDay').value);
            const isLeap = document.getElementById('isLeapMonth').checked;
            
            // 清除之前的结果
            const resultDiv = document.getElementById('solarResult');
            resultDiv.classList.remove('show');
            
            // 输入验证
            if (!year) {
                showInputError('请选择农历年份');
                return;
            }
            
            if (!month) {
                showInputError('请选择农历月份');
                return;
            }
            
            if (!day) {
                showInputError('请选择农历日期');
                return;
            }
            
            // 验证年份范围
            if (year < 1900 || year > 2100) {
                showInputError('年份超出支持范围（1900-2100年）');
                return;
            }
            
            // 验证闰月
            const leapMonth = calendar.leapMonth(year);
            if (isLeap && leapMonth !== month) {
                const monthNames = ['', '正', '二', '三', '四', '五', '六', '七', '八', '九', '十', '冬', '腊'];
                showInputError(`${year}年没有闰${monthNames[month]}月`);
                return;
            }
            
            // 验证日期范围
            let maxDay;
            if (isLeap) {
                maxDay = calendar.leapDays(year);
            } else {
                maxDay = calendar.monthDays(year, month);
            }
            
            if (day > maxDay || day < 1) {
                const monthNames = ['', '正', '二', '三', '四', '五', '六', '七', '八', '九', '十', '冬', '腊'];
                showInputError(`${isLeap ? '闰' : ''}${monthNames[month]}月只有${maxDay}天`);
                return;
            }
            
            // 执行转换
            const solar = calendar.lunar2solar(year, month, day, isLeap);
            
            if (solar === -1) {
                showInputError('转换失败，请检查输入的农历日期是否正确');
                return;
            }
            
            // 显示结果
            const contentDiv = document.getElementById('solarContent');
            const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const date = new Date(solar.cYear, solar.cMonth - 1, solar.cDay);
            const weekDay = weekDays[date.getDay()];
            
            const monthNames = ['', '正', '二', '三', '四', '五', '六', '七', '八', '九', '十', '冬', '腊'];
            
            contentDiv.innerHTML = `
                <div class="conversion-summary">
                    <strong style="color: #667eea; font-size: 1.1em;">
                        农历${year}年${isLeap ? '闰' : ''}${monthNames[month]}月${formatLunarDay(day)} 
                        → 公历${solar.cYear}年${solar.cMonth}月${solar.cDay}日
                    </strong>
                </div>
                <hr style="margin: 15px 0; border: none; border-top: 1px solid #eee;">
                <strong>公历日期：</strong>${solar.cYear}年${solar.cMonth}月${solar.cDay}日<br>
                <strong>星期：</strong>${weekDay}<br>
                <strong>格式化：</strong>${solar.cYear}-${String(solar.cMonth).padStart(2, '0')}-${String(solar.cDay).padStart(2, '0')}<br>
                <strong>星座：</strong>${solar.astro}<br>
                <strong>天干地支：</strong>${solar.gzYear}年<br>
                <strong>生肖：</strong>${solar.Animal}<br>
                <div style="margin-top: 10px;">
                    <span class="success">✓ 转换成功，数据准确可靠</span>
                </div>
            `;
            
            resultDiv.classList.add('show');
        }

        // 格式化农历日期显示
        function formatLunarDay(day) {
            const dayNames = [
                '', '初一', '初二', '初三', '初四', '初五', '初六', '初七', '初八', '初九', '初十',
                '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十',
                '廿一', '廿二', '廿三', '廿四', '廿五', '廿六', '廿七', '廿八', '廿九', '三十'
            ];
            return dayNames[day] || day + '日';
        }

        // 显示输入错误提示
        function showInputError(message) {
            // 创建临时提示框
            const errorDiv = document.createElement('div');
            errorDiv.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: #dc3545;
                color: white;
                padding: 12px 20px;
                border-radius: 8px;
                box-shadow: 0 4px 15px rgba(220, 53, 69, 0.3);
                z-index: 1000;
                animation: slideInRight 0.3s ease-out;
                max-width: 300px;
                word-wrap: break-word;
            `;
            errorDiv.textContent = message;
            
            document.body.appendChild(errorDiv);
            
            // 3秒后自动移除
            setTimeout(() => {
                errorDiv.style.animation = 'slideOutRight 0.3s ease-out';
                setTimeout(() => {
                    if (errorDiv.parentNode) {
                        errorDiv.parentNode.removeChild(errorDiv);
                    }
                }, 300);
            }, 3000);
        }

        // 显示今日日期
        function showTodayDate() {
            const today = new Date();
            const year = today.getFullYear();
            const month = today.getMonth() + 1;
            const day = today.getDate();
            
            const lunar = calendar.solar2lunar(year, month, day);
            
            if (lunar === -1) {
                document.getElementById('todayDate').innerHTML = `
                    公历：${year}年${month}月${day}日<br>
                    农历：暂不支持此日期范围
                `;
                document.getElementById('zodiacInfo').innerHTML = '';
                return;
            }
            
            const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const weekDay = weekDays[today.getDay()];
            
            document.getElementById('todayDate').innerHTML = `
                公历：${year}年${month}月${day}日 ${weekDay}<br>
                农历：${lunar.IMonthCn}${lunar.IDayCn}
            `;
            
            document.getElementById('zodiacInfo').innerHTML = `
                ${lunar.gzYear}年 〖${lunar.Animal}年〗 ${lunar.astro}
            `;
        }

        // 自动转换（如果日期选择完整）
        function autoConvertIfComplete() {
            const year = document.getElementById('solarYear').value;
            const month = document.getElementById('solarMonth').value;
            const day = document.getElementById('solarDay').value;
            
            if (year && month && day) {
                convertSolarToLunar();
            }
        }

        // 页面加载完成后初始化
        window.onload = function() {
            showTodayDate();
            initYearSelectors();
            
            // 设置默认为今天
            const today = new Date();
            document.getElementById('solarYear').value = today.getFullYear();
            document.getElementById('solarMonth').value = today.getMonth() + 1;
            updateSolarDays();
            document.getElementById('solarDay').value = today.getDate();
            convertSolarToLunar();
            
            // 为公历日期选择器添加自动转换
            document.getElementById('solarYear').addEventListener('change', autoConvertIfComplete);
            document.getElementById('solarMonth').addEventListener('change', autoConvertIfComplete);
            document.getElementById('solarDay').addEventListener('change', autoConvertIfComplete);
        };
    </script>
</body>
</html>
