<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>番茄钟工作法工具</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#10B981', // 绿色主题
            secondary: '#3B82F6', // 蓝色（休息时使用）
            accent: '#F59E0B', // 橙色（长休息时使用）
            dark: '#1F2937',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .timer-shadow {
        box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
      }
      .timer-shadow-break {
        box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
      }
      .timer-shadow-long {
        box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
      }
      .progress-ring-container {
        position: relative;
        width: 280px;
        height: 280px;
      }
      .progress-ring {
        transform: rotate(-90deg);
        transform-origin: 50% 50%;
      }
      .progress-ring-circle {
        transition: stroke-dashoffset 1s linear;
        stroke-width: 8;
        stroke-linecap: round;
      }
      .slide-in {
        animation: slideIn 0.3s ease forwards;
      }
      @keyframes slideIn {
        from { transform: translateX(-100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      .slide-in-right {
        animation: slideInRight 0.3s ease forwards;
      }
      @keyframes slideInRight {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      .fade-in {
        animation: fadeIn 0.5s ease forwards;
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .pulse {
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
      }
    }
  </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- 标题区 -->
    <header class="text-center mb-8">
      <h1 class="text-[clamp(1.8rem,4vw,2.5rem)] font-bold text-primary mb-2">番茄钟工作法工具</h1>
      <p class="text-gray-600 max-w-2xl mx-auto">专注工作与学习，提高效率，告别拖延</p>
    </header>

    <!-- 主内容区 -->
    <main class="flex flex-col lg:flex-row gap-6">
      <!-- 左侧设置面板 -->
      <aside class="lg:w-1/4 bg-white rounded-xl shadow-md p-6 order-2 lg:order-1">
        <h2 class="text-xl font-semibold mb-4 flex items-center">
          <i class="fa fa-sliders text-primary mr-2"></i>时间设置
        </h2>
        
        <div class="space-y-6">
          <!-- 工作时间设置 -->
          <div>
            <label for="workDuration" class="block text-sm font-medium text-gray-700 mb-1">
              工作时长 (当前: <span id="workDurationValue" class="font-bold text-primary">25</span> 分钟)
            </label>
            <input type="range" id="workDuration" min="5" max="60" value="25" step="5"
              class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-primary">
          </div>

          <!-- 短休息时间设置 -->
          <div>
            <label for="shortBreakDuration" class="block text-sm font-medium text-gray-700 mb-1">
              短休息时长 (当前: <span id="shortBreakDurationValue" class="font-bold text-secondary">5</span> 分钟)
            </label>
            <input type="range" id="shortBreakDuration" min="1" max="30" value="5" step="1"
              class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-secondary">
          </div>

          <!-- 长休息时间设置 -->
          <div>
            <label for="longBreakDuration" class="block text-sm font-medium text-gray-700 mb-1">
              长休息时长 (当前: <span id="longBreakDurationValue" class="font-bold text-accent">15</span> 分钟)
            </label>
            <input type="range" id="longBreakDuration" min="5" max="60" value="15" step="5"
              class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-accent">
          </div>

          <!-- 循环设置 -->
          <div>
            <label for="cycles" class="block text-sm font-medium text-gray-700 mb-1">
              工作循环次数 (当前: <span id="cyclesValue" class="font-bold">4</span> 次)
            </label>
            <input type="range" id="cycles" min="1" max="10" value="4" step="1"
              class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-primary">
          </div>

          <!-- 提示音设置 -->
          <div class="pt-2">
            <h3 class="text-sm font-medium text-gray-700 mb-2">提示音设置</h3>
            <div class="space-y-2">
              <div class="flex items-center">
                <input type="checkbox" id="soundEnabled" checked
                  class="w-4 h-4 text-primary focus:ring-primary border-gray-300 rounded">
                <label for="soundEnabled" class="ml-2 text-sm text-gray-700">启用提示音</label>
              </div>
              
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-2">
                <div class="p-2 border border-gray-200 rounded-md">
                  <p class="text-xs text-gray-500 mb-1">开始提示音</p>
                  <button id="playStartSound" class="text-primary hover:text-primary/80 text-sm">
                    <i class="fa fa-play mr-1"></i> 播放
                  </button>
                </div>
                <div class="p-2 border border-gray-200 rounded-md">
                  <p class="text-xs text-gray-500 mb-1">结束提示音</p>
                  <button id="playEndSound" class="text-primary hover:text-primary/80 text-sm">
                    <i class="fa fa-play mr-1"></i> 播放
                  </button>
                </div>
                <div class="p-2 border border-gray-200 rounded-md">
                  <p class="text-xs text-gray-500 mb-1">休息提示音</p>
                  <button id="playBreakSound" class="text-primary hover:text-primary/80 text-sm">
                    <i class="fa fa-play mr-1"></i> 播放
                  </button>
                </div>
                <div class="p-2 border border-gray-200 rounded-md">
                  <p class="text-xs text-gray-500 mb-1">长休息提示音</p>
                  <button id="playLongBreakSound" class="text-primary hover:text-primary/80 text-sm">
                    <i class="fa fa-play mr-1"></i> 播放

                </div>
              </div>
            </div>
          </div>
        </div>
      </aside>

      <!-- 中间番茄钟核心区 -->
      <section class="lg:w-2/4 flex flex-col items-center justify-center order-1 lg:order-2">
        <div class="w-full max-w-md mx-auto">
          <!-- 状态指示 -->
          <div class="text-center mb-6">
            <h2 id="timerStatus" class="text-2xl font-bold text-primary">准备开始专注</h2>
            <p id="currentTask" class="text-gray-600 mt-1">选择一个任务开始专注</p>

          <!-- 番茄钟显示 -->

      <!-- 右侧任务管理面板 -->

        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-semibold flex items-center">
            <i class="fa fa-tasks text-primary mr-2"></i>今日任务
          </h2>
          <button id="addTaskBtn" class="text-primary hover:text-primary/80">
            <i class="fa fa-plus-circle text-xl"></i>
          </button>
        </div>
        
        <!-- 添加任务表单 -->
        <div id="addTaskForm" class="mb-4 hidden">
          <div class="flex gap-2">
            <input type="text" id="newTaskInput" placeholder="输入新任务..."

            <button id="saveTaskBtn" class="px-3 py-2 bg-primary text-white rounded-lg hover:bg-primary/90 transition-colors">

        <!-- 任务列表 -->

            <div class="flex items-center">
              <input type="checkbox" class="task-checkbox mr-2 w-4 h-4 text-primary focus:ring-primary border-gray-300 rounded">
              <span class="task-name">完成项目报告</span>
            </div>
            <div class="flex items-center gap-1">
              <span class="text-xs text-gray-500 task-pomodoros">0/2 番茄</span>
              <button class="start-task-btn text-primary hover:text-primary/80">

              </button>
              <button class="delete-task-btn text-gray-400 hover:text-red-500">

              </button>
            </div>
          </div>
          <div class="p-3 bg-gray-50 rounded-lg flex justify-between items-center hover:bg-gray-100 transition-colors">
            <div class="flex items-center">
              <input type="checkbox" class="task-checkbox mr-2 w-4 h-4 text-primary focus:ring-primary border-gray-300 rounded">
              <span class="task-name">学习JavaScript</span>
            </div>
            <div class="flex items-center gap-1">
              <span class="text-xs text-gray-500 task-pomodoros">0/3 番茄</span>
              <button class="start-task-btn text-primary hover:text-primary/80">
                <i class="fa fa-play"></i>
              </button>
              <button class="delete-task-btn text-gray-400 hover:text-red-500">
                <i class="fa fa-trash"></i>
              </button>
            </div>
          </div>
        </div>
        
        <!-- 统计摘要 -->
        <div class="mt-6 pt-4 border-t border-gray-200">
          <h3 class="text-sm font-medium text-gray-700 mb-2">今日统计</h3>
          <div class="grid grid-cols-2 gap-4 text-center">
            <div class="bg-green-50 p-3 rounded-lg">
              <p class="text-xs text-gray-500">完成番茄数</p>
              <p id="completedPomodoros" class="text-2xl font-bold text-primary">0</p>
            </div>
            <div class="bg-blue-50 p-3 rounded-lg">
              <p class="text-xs text-gray-500">专注时长</p>
              <p id="focusTime" class="text-2xl font-bold text-secondary">0小时</p>
            </div>
          </div>
        </div>
      </aside>

    <!-- 底部统计区域 -->

        <i class="fa fa-bar-chart text-primary mr-2"></i>专注统计
      </h2>
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- 近7天番茄数统计 -->
        <div>
          <h3 class="text-sm font-medium text-gray-700 mb-3">近7天完成番茄数</h3>
          <div class="bg-gray-50 p-4 rounded-lg h-[250px]">
            <canvas id="weeklyChart"></canvas>
          </div>
        </div>
        <!-- 每日专注时长统计 -->
        <div>
          <h3 class="text-sm font-medium text-gray-700 mb-3">每日专注时长（小时）</h3>
          <div class="bg-gray-50 p-4 rounded-lg h-[250px]">
            <canvas id="dailyChart"></canvas>

    <!-- 底部备注 -->

    </footer>

  <!-- 提示音音频元素 -->
  <audio id="startSound" preload="auto">
    <source src="https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3" type="audio/mpeg">
  </audio>
  <audio id="endSound" preload="auto">
    <source src="https://assets.mixkit.co/sfx/preview/mixkit-achievement-bell-600.mp3" type="audio/mpeg">
  </audio>
  <audio id="breakSound" preload="auto">
    <source src="https://assets.mixkit.co/sfx/preview/mixkit-interface-hint-notification-911.mp3" type="audio/mpeg">
  </audio>
  <audio id="longBreakSound" preload="auto">
    <source src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3" type="audio/mpeg">
  </audio>

  <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
    // DOM元素获取
    const timerEl = document.getElementById('timer');
    const timerStatusEl = document.getElementById('timerStatus');
    const currentTaskEl = document.getElementById('currentTask');
    const progressRingEl = document.getElementById('progressRing');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const workDurationSlider = document.getElementById('workDuration');
    const workDurationValue = document.getElementById('workDurationValue');
    const shortBreakDurationSlider = document.getElementById('shortBreakDuration');
    const shortBreakDurationValue = document.getElementById('shortBreakDurationValue');
    const longBreakDurationSlider = document.getElementById('longBreakDuration');
    const longBreakDurationValue = document.getElementById('longBreakDurationValue');
    const cyclesSlider = document.getElementById('cycles');
    const cyclesValue = document.getElementById('cyclesValue');
    const currentCycleEl = document.getElementById('currentCycle');
    const totalCyclesEl = document.getElementById('totalCycles');
    const addTaskBtn = document.getElementById('addTaskBtn');
    const addTaskForm = document.getElementById('addTaskForm');
    const newTaskInput = document.getElementById('newTaskInput');
    const saveTaskBtn = document.getElementById('saveTaskBtn');
    const taskList = document.getElementById('taskList');
    const completedPomodorosEl = document.getElementById('completedPomodoros');
    const focusTimeEl = document.getElementById('focusTime');
    const soundEnabled = document.getElementById('soundEnabled');
    const playStartSound = document.getElementById('playStartSound');
    const playEndSound = document.getElementById('playEndSound');
    const playBreakSound = document.getElementById('playBreakSound');
    const playLongBreakSound = document.getElementById('playLongBreakSound');
    
    // 音频元素
    const startSound = document.getElementById('startSound');
    const endSound = document.getElementById('endSound');
    const breakSound = document.getElementById('breakSound');
    const longBreakSound = document.getElementById('longBreakSound');

    // 番茄钟状态
    let timerState = {
      isRunning: false,
      mode: 'work', // 'work', 'shortBreak', 'longBreak'
      timeLeft: 25 * 60, // 默认25分钟
      workDuration: 25 * 60,
      shortBreakDuration: 5 * 60,
      longBreakDuration: 15 * 60,
      cycles: 4,
      currentCycle: 0,
      completedPomodoros: 0,
      focusMinutes: 0,
      currentTask: null,
      timerInterval: null,
      soundEnabled: true
    };

    // 任务数据
    let tasks = [
      { id: 1, name: '完成项目报告', pomodoros: 0, targetPomodoros: 2, completed: false },
      { id: 2, name: '学习JavaScript', pomodoros: 0, targetPomodoros: 3, completed: false }
    ];

    // 统计数据
    let stats = {
      weeklyPomodoros: [3, 5, 2, 7, 4, 0, 0], // 近7天番茄数
      dailyFocusHours: [1.5, 2.5, 1, 3.5, 2, 0, 0] // 近7天专注小时数
    };

    // 初始化
    function init() {
      // 从localStorage加载数据
      loadFromLocalStorage();
      
      // 设置事件监听
      setupEventListeners();
      
      // 更新UI
      updateTimerDisplay();
      updateCycleDisplay();
      updateStatsDisplay();
      renderTasks();
      initCharts();
      
      // 更新进度环
      updateProgressRing(100);
    }

    // 设置事件监听
    function setupEventListeners() {
      // 时间设置滑块
      workDurationSlider.addEventListener('input', function() {
        timerState.workDuration = parseInt(this.value) * 60;
        workDurationValue.textContent = parseInt(this.value);
        if (timerState.mode === 'work' && !timerState.isRunning) {
          timerState.timeLeft = timerState.workDuration;
          updateTimerDisplay();
          updateProgressRing(100);
        }
        saveToLocalStorage();
      });
      
      shortBreakDurationSlider.addEventListener('input', function() {
        timerState.shortBreakDuration = parseInt(this.value) * 60;
        shortBreakDurationValue.textContent = parseInt(this.value);
        if (timerState.mode === 'shortBreak' && !timerState.isRunning) {
          timerState.timeLeft = timerState.shortBreakDuration;
          updateTimerDisplay();
          updateProgressRing(100);
        }
        saveToLocalStorage();
      });
      
      longBreakDurationSlider.addEventListener('input', function() {
        timerState.longBreakDuration = parseInt(this.value) * 60;
        longBreakDurationValue.textContent = parseInt(this.value);
        if (timerState.mode === 'longBreak' && !timerState.isRunning) {
          timerState.timeLeft = timerState.longBreakDuration;
          updateTimerDisplay();
          updateProgressRing(100);
        }
        saveToLocalStorage();
      });
      
      cyclesSlider.addEventListener('input', function() {
        timerState.cycles = parseInt(this.value);
        cyclesValue.textContent = parseInt(this.value);
        totalCyclesEl.textContent = parseInt(this.value);
        saveToLocalStorage();
      });
      
      // 控制按钮
      startBtn.addEventListener('click', startTimer);
      pauseBtn.addEventListener('click', pauseTimer);
      resetBtn.addEventListener('click', resetTimer);
      
      // 任务管理
      addTaskBtn.addEventListener('click', toggleAddTaskForm);
      saveTaskBtn.addEventListener('click', addNewTask);
      newTaskInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') addNewTask();
      });
      
      // 提示音设置
      soundEnabled.addEventListener('change', function() {
        timerState.soundEnabled = this.checked;
        saveToLocalStorage();
      });
      
      // 播放提示音预览
      playStartSound.addEventListener('click', function() {
        playSound(startSound);
      });
      
      playEndSound.addEventListener('click', function() {
        playSound(endSound);
      });
      
      playBreakSound.addEventListener('click', function() {
        playSound(breakSound);
      });
      
      playLongBreakSound.addEventListener('click', function() {
        playSound(longBreakSound);
      });
    }

    // 播放提示音
    function playSound(audioElement) {
      if (timerState.soundEnabled) {
        audioElement.currentTime = 0;
        audioElement.play().catch(e => console.log('无法播放音频:', e));
      }
    }

    // 开始计时器
    function startTimer() {
      if (timerState.isRunning) return;
      
      timerState.isRunning = true;
      startBtn.classList.add('hidden');
      pauseBtn.classList.remove('hidden');
      
      // 播放开始提示音
      if (timerState.mode === 'work') {
        playSound(startSound);
      } else if (timerState.mode === 'shortBreak') {
        playSound(breakSound);
      } else if (timerState.mode === 'longBreak') {
        playSound(longBreakSound);
      }
      
      // 添加脉冲动画
      progressRingEl.parentElement.parentElement.classList.add('pulse');
      
      timerState.timerInterval = setInterval(function() {
        timerState.timeLeft--;
        updateTimerDisplay();
        
        // 更新进度环
        const totalTime = timerState.mode === 'work' ? timerState.workDuration : 
                          timerState.mode === 'shortBreak' ? timerState.shortBreakDuration : timerState.longBreakDuration;
        const percentage = (timerState.timeLeft / totalTime) * 100;
        updateProgressRing(percentage);
        
        if (timerState.timeLeft <= 0) {
          clearInterval(timerState.timerInterval);
          timerComplete();
        }
      }, 1000);
    }

    // 暂停计时器
    function pauseTimer() {
      if (!timerState.isRunning) return;
      
      timerState.isRunning = false;
      clearInterval(timerState.timerInterval);
      startBtn.classList.remove('hidden');
      pauseBtn.classList.add('hidden');
      
      // 移除脉冲动画
      progressRingEl.parentElement.parentElement.classList.remove('pulse');
      
      saveToLocalStorage();
    }

    // 重置计时器
    function resetTimer() {
      pauseTimer();
      
      if (timerState.mode === 'work') {
        timerState.timeLeft = timerState.workDuration;
      } else if (timerState.mode === 'shortBreak') {
        timerState.timeLeft = timerState.shortBreakDuration;
      } else {
        timerState.timeLeft = timerState.longBreakDuration;
      }
      
      updateTimerDisplay();
      updateProgressRing(100);
    }

    // 计时器完成处理
    function timerComplete() {
      // 移除脉冲动画
      progressRingEl.parentElement.parentElement.classList.remove('pulse');
      
      if (timerState.mode === 'work') {
        // 工作时段完成
        timerState.completedPomodoros++;
        timerState.focusMinutes += timerState.workDuration / 60;
        
        // 更新当前任务的番茄数
        if (timerState.currentTask) {
          const task = tasks.find(t => t.id === timerState.currentTask);
          if (task) {
            task.pomodoros++;
            if (task.pomodoros >= task.targetPomodoros) {
              task.completed = true;
            }
          }
        }
        
        // 播放结束提示音
        playSound(endSound);
        
        // 更新统计
        updateStatsDisplay();
        renderTasks();
        
        // 检查是否完成所有循环
        if (timerState.currentCycle >= timerState.cycles) {
          timerState.currentCycle = 0;
          switchMode('longBreak');
        } else {
          switchMode('shortBreak');
        }
      } else {
        // 休息时段完成
        timerState.currentCycle++;
        updateCycleDisplay();
        
        // 播放开始提示音
        playSound(startSound);
        
        switchMode('work');
      }
      
      // 保存数据
      saveToLocalStorage();
      
      // 自动开始下一个时段
      setTimeout(startTimer, 2000);
    }

    // 切换模式（工作/休息）
    function switchMode(mode) {
      timerState.mode = mode;
      
      if (mode === 'work') {
        timerState.timeLeft = timerState.workDuration;
        timerStatusEl.textContent = '专注工作中';
        timerStatusEl.className = 'text-2xl font-bold text-primary';
        progressRingEl.setAttribute('stroke', '#10B981');
        progressRingEl.parentElement.parentElement.classList.remove('timer-shadow-break', 'timer-shadow-long');
        progressRingEl.parentElement.parentElement.classList.add('timer-shadow');
      } else if (mode === 'shortBreak') {
        timerState.timeLeft = timerState.shortBreakDuration;
        timerStatusEl.textContent = '短暂休息';
        timerStatusEl.className = 'text-2xl font-bold text-secondary';
        progressRingEl.setAttribute('stroke', '#3B82F6');
        progressRingEl.parentElement.parentElement.classList.remove('timer-shadow', 'timer-shadow-long');
        progressRingEl.parentElement.parentElement.classList.add('timer-shadow-break');
        
        // 播放休息提示音
        playSound(breakSound);
      } else if (mode === 'longBreak') {
        timerState.timeLeft = timerState.longBreakDuration;
        timerStatusEl.textContent = '长时间休息';
        timerStatusEl.className = 'text-2xl font-bold text-accent';
        progressRingEl.setAttribute('stroke', '#F59E0B');
        progressRingEl.parentElement.parentElement.classList.remove('timer-shadow', 'timer-shadow-break');
        progressRingEl.parentElement.parentElement.classList.add('timer-shadow-long');
        
        // 播放长休息提示音
        playSound(longBreakSound);
      }
      
      updateTimerDisplay();
      updateProgressRing(100);
      updateCycleDisplay();
    }

    // 更新计时器显示
    function updateTimerDisplay() {
      const minutes = Math.floor(timerState.timeLeft / 60);
      const seconds = timerState.timeLeft % 60;
      timerEl.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    // 更新循环显示
    function updateCycleDisplay() {
      currentCycleEl.textContent = timerState.currentCycle;
      totalCyclesEl.textContent = timerState.cycles;
    }

    // 更新进度环
    function updateProgressRing(percentage) {
      const circumference = 2 * Math.PI * 130;
      const offset = circumference - (percentage / 100 * circumference);
      progressRingEl.style.strokeDasharray = `${circumference} ${circumference}`;
      progressRingEl.style.strokeDashoffset = offset;
    }

    // 切换添加任务表单显示
    function toggleAddTaskForm() {
      addTaskForm.classList.toggle('hidden');
      if (!addTaskForm.classList.contains('hidden')) {
        newTaskInput.focus();
      }
    }

    // 添加新任务
    function addNewTask() {
      const taskName = newTaskInput.value.trim();
      if (!taskName) return;
      
      const newTask = {
        id: Date.now(),
        name: taskName,
        pomodoros: 0,
        targetPomodoros: 1,
        completed: false
      };
      
      tasks.push(newTask);
      newTaskInput.value = '';
      toggleAddTaskForm();
      renderTasks();
      saveToLocalStorage();
    }

    // 渲染任务列表
    function renderTasks() {
      taskList.innerHTML = '';
      
      tasks.forEach(task => {
        const taskEl = document.createElement('div');
        taskEl.className = `p-3 ${task.completed ? 'bg-green-50' : 'bg-gray-50'} rounded-lg flex justify-between items-center hover:bg-gray-100 transition-colors ${task.completed ? 'opacity-75' : ''}`;
        
        taskEl.innerHTML = `
          <div class="flex items-center">
            <input type="checkbox" class="task-checkbox mr-2 w-4 h-4 text-primary focus:ring-primary border-gray-300 rounded" ${task.completed ? 'checked' : ''} data-id="${task.id}">
            <span class="task-name ${task.completed ? 'line-through text-gray-500' : ''}">${task.name}</span>
          </div>
          <div class="flex items-center gap-1">
            <span class="text-xs text-gray-500 task-pomodoros">${task.pomodoros}/${task.targetPomodoros} 番茄</span>
            <button class="start-task-btn text-primary hover:text-primary/80 ${timerState.isRunning || task.completed ? 'hidden' : ''}" data-id="${task.id}">
              <i class="fa fa-play"></i>
            </button>
            <button class="delete-task-btn text-gray-400 hover:text-red-500" data-id="${task.id}">
              <i class="fa fa-trash"></i>
            </button>
          </div>
        `;
        
        taskList.appendChild(taskEl);
      });
      
      // 添加事件监听
      document.querySelectorAll('.task-checkbox').forEach(checkbox => {
        checkbox.addEventListener('change', function() {
          const taskId = parseInt(this.getAttribute('data-id'));
          const task = tasks.find(t => t.id === taskId);
          if (task) {
            task.completed = this.checked;
            renderTasks();
            saveToLocalStorage();
          }
        });
      });
      
      document.querySelectorAll('.start-task-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const taskId = parseInt(this.getAttribute('data-id'));
          const task = tasks.find(t => t.id === taskId);
          if (task) {
            timerState.currentTask = taskId;
            currentTaskEl.textContent = `当前任务: ${task.name}`;
            
            // 如果计时器不在工作模式，切换到工作模式
            if (timerState.mode !== 'work') {
              switchMode('work');
            }
            
            // 开始计时器
            if (!timerState.isRunning) {
              startTimer();
            }
            
            saveToLocalStorage();
          }
        });
      });
      
      document.querySelectorAll('.delete-task-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const taskId = parseInt(this.getAttribute('data-id'));
          tasks = tasks.filter(task => task.id !== taskId);
          
          // 如果删除的是当前任务，重置当前任务
          if (timerState.currentTask === taskId) {
            timerState.currentTask = null;
            currentTaskEl.textContent = '选择一个任务开始专注';
          }
          
          renderTasks();
          saveToLocalStorage();
        });
      });
    }

    // 更新统计显示
    function updateStatsDisplay() {
      completedPomodorosEl.textContent = timerState.completedPomodoros;
      
      const hours = Math.floor(timerState.focusMinutes / 60);
      const minutes = Math.floor(timerState.focusMinutes % 60);
      if (hours > 0) {
        focusTimeEl.textContent = `${hours}小时${minutes > 0 ? ` ${minutes}分钟` : ''}`;
      } else {
        focusTimeEl.textContent = `${minutes}分钟`;
      }
      
      // 更新图表
      updateCharts();
    }

    // 初始化图表
    let weeklyChart, dailyChart;
    function initCharts() {
      const ctx1 = document.getElementById('weeklyChart').getContext('2d');
      const ctx2 = document.getElementById('dailyChart').getContext('2d');
      
      // 获取近7天的日期
      const labels = [];
      for (let i = 6; i >= 0; i--) {
        const date = new Date();
        date.setDate(date.getDate() - i);
        labels.push(date.toLocaleDateString('zh-CN', { weekday: 'short' }));
      }
      
      weeklyChart = new Chart(ctx1, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: '完成番茄数',
            data: stats.weeklyPomodoros,
            backgroundColor: 'rgba(16, 185, 129, 0.2)',
            borderColor: 'rgba(16, 185, 129, 1)',
            borderWidth: 2,
            tension: 0.3,
            pointBackgroundColor: 'rgba(16, 185, 129, 1)',
            pointRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: {
                precision: 0
              }
            }
          }
        }
      });
      
      dailyChart = new Chart(ctx2, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: '专注时长（小时）',
            data: stats.dailyFocusHours,
            backgroundColor: 'rgba(59, 130, 246, 0.7)',
            borderColor: 'rgba(59, 130, 246, 1)',
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false
            }
          },
          scales: {
            y: {
              beginAtZero: true
            }
          }
        }
      });
    }

    // 更新图表数据
    function updateCharts() {
      // 更新今天的数据（假设labels[6]是今天）
      stats.weeklyPomodoros[6] = timerState.completedPomodoros;
      stats.dailyFocusHours[6] = parseFloat((timerState.focusMinutes / 60).toFixed(1));
      
      weeklyChart.data.datasets[0].data = stats.weeklyPomodoros;
      weeklyChart.update();
      
      dailyChart.data.datasets[0].data = stats.dailyFocusHours;
      dailyChart.update();
    }

    // 保存到localStorage
    function saveToLocalStorage() {
      const data = {
        timerState,
        tasks,
        stats
      };
      
      localStorage.setItem('pomodoroData', JSON.stringify(data));
    }

    // 从localStorage加载
    function loadFromLocalStorage() {
      const savedData = localStorage.getItem('pomodoroData');
      if (savedData) {
        const data = JSON.parse(savedData);
        
        // 恢复计时器状态
        if (data.timerState) {
          timerState = { ...timerState, ...data.timerState };
          
          // 更新滑块值
          workDurationSlider.value = Math.floor(timerState.workDuration / 60);
          workDurationValue.textContent = Math.floor(timerState.workDuration / 60);
          
          shortBreakDurationSlider.value = Math.floor(timerState.shortBreakDuration / 60);
          shortBreakDurationValue.textContent = Math.floor(timerState.shortBreakDuration / 60);
          
          longBreakDurationSlider.value = Math.floor(timerState.longBreakDuration / 60);
          longBreakDurationValue.textContent = Math.floor(timerState.longBreakDuration / 60);
          
          cyclesSlider.value = timerState.cycles;
          cyclesValue.textContent = timerState.cycles;
          
          // 更新声音设置
          soundEnabled.checked = timerState.soundEnabled;
          
          // 更新状态文本和颜色
          if (timerState.mode === 'work') {
            timerStatusEl.textContent = timerState.isRunning ? '专注工作中' : '准备开始专注';
            timerStatusEl.className = 'text-2xl font-bold text-primary';
            progressRingEl.setAttribute('stroke', '#10B981');
            progressRingEl.parentElement.parentElement.classList.add('timer-shadow');
          } else if (timerState.mode === 'shortBreak') {
            timerStatusEl.textContent = '短暂休息';
            timerStatusEl.className = 'text-2xl font-bold text-secondary';
            progressRingEl.setAttribute('stroke', '#3B82F6');
            progressRingEl.parentElement.parentElement.classList.add('timer-shadow-break');
          } else if (timerState.mode === 'longBreak') {
            timerStatusEl.textContent = '长时间休息';
            timerStatusEl.className = 'text-2xl font-bold text-accent';
            progressRingEl.setAttribute('stroke', '#F59E0B');
            progressRingEl.parentElement.parentElement.classList.add('timer-shadow-long');
          }
          
          // 更新当前任务显示
          if (timerState.currentTask) {
            const task = data.tasks.find(t => t.id === timerState.currentTask);
            if (task) {
              currentTaskEl.textContent = `当前任务: ${task.name}`;
            }
          }
          
          // 更新按钮状态
          if (timerState.isRunning) {
            startBtn.classList.add('hidden');
            pauseBtn.classList.remove('hidden');
            progressRingEl.parentElement.parentElement.classList.add('pulse');
          }
        }
        
        // 恢复任务数据
        if (data.tasks) {
          tasks = data.tasks;
        }
        
        // 恢复统计数据
        if (data.stats) {
          stats = data.stats;
        }
      }
    }

    // 初始化应用
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
