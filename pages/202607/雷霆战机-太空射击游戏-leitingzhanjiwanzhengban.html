<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>雷霆战机 - 太空射击游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            touch-action: none;
        }

        .game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            will-change: transform;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #00ffff;
            box-shadow: 0 4px 20px rgba(0, 255, 255, 0.3);
        }

        .game-title {
            font-size: 32px;
            font-weight: bold;
            background: linear-gradient(45deg, #00ffff, #0080ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            letter-spacing: 2px;
        }

        .game-stats {
            display: flex;
            gap: 30px;
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .stat-label {
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .game-area {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, rgba(0, 100, 200, 0.1) 0%, transparent 70%);
        }

        #gameCanvas {
            border: 2px solid #00ffff;
            border-radius: 10px;
            background: linear-gradient(180deg, #000428 0%, #004e92 100%);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.3);
            position: relative;
            z-index: 1;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .game-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .overlay-content {
            text-align: center;
            padding: 40px;
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.1) 0%, rgba(0, 128, 255, 0.1) 100%);
            border: 2px solid #00ffff;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.3);
        }

        .overlay-content h2 {
            font-size: 36px;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #00ffff, #0080ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .overlay-content p {
            font-size: 18px;
            margin-bottom: 30px;
            color: #ccc;
        }

        .game-button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(45deg, #00ffff, #0080ff);
            color: #000;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 255, 0.4);
        }

        .game-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 255, 0.6);
        }

        .game-button:active {
            transform: translateY(0);
        }

        .game-controls {
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border-top: 2px solid #00ffff;
        }

        .control-info {
            text-align: center;
        }

        .control-info p {
            margin: 5px 0;
            color: #888;
            font-size: 14px;
        }

        .control-info p:first-child {
            color: #00ffff;
            font-size: 16px;
            margin-bottom: 10px;
        }

        @media (max-width: 900px) {
            .game-header {
                padding: 15px 20px;
            }
            
            .game-title {
                font-size: 24px;
            }
            
            .game-stats {
                gap: 20px;
            }
            
            .stat-value {
                font-size: 20px;
            }
            
            #gameCanvas {
                width: 90vw;
                height: 60vh;
            }
        }

        @media (max-width: 600px) {
            .game-header {
                flex-direction: column;
                gap: 15px;
                padding: 10px 15px;
            }
            
            .game-title {
                font-size: 20px;
                letter-spacing: 1px;
            }
            
            .game-stats {
                gap: 15px;
            }
            
            .stat-label {
                font-size: 12px;
            }
            
            .stat-value {
                font-size: 18px;
            }
            
            .overlay-content {
                padding: 30px 20px;
                margin: 20px;
            }
            
            .overlay-content h2 {
                font-size: 28px;
            }
            
            .overlay-content p {
                font-size: 16px;
            }
            
            .game-button {
                padding: 12px 24px;
                font-size: 14px;
                margin: 5px;
            }
            
            .game-controls {
                padding: 15px;
            }
            
            .control-info p {
                font-size: 12px;
                margin: 3px 0;
            }
            
            .control-info p:first-child {
                font-size: 14px;
                margin-bottom: 8px;
            }
        }

        @media (max-width: 400px) {
            .game-title {
                font-size: 18px;
            }
            
            .stat-value {
                font-size: 16px;
            }
            
            .overlay-content {
                padding: 25px 15px;
            }
            
            .overlay-content h2 {
                font-size: 24px;
            }
            
            .game-button {
                padding: 10px 20px;
                font-size: 13px;
            }
        }

        /* 移动设备触摸控制 */
        .mobile-controls {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            z-index: 100;
            pointer-events: none;
        }

        .touch-controls {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 20px;
            pointer-events: auto;
        }

        .movement-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            width: 120px;
        }

        .action-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .touch-button {
            width: 40px;
            height: 40px;
            background: rgba(0, 255, 255, 0.3);
            border: 2px solid #00ffff;
            border-radius: 50%;
            color: #ffffff;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            transition: all 0.2s ease;
        }

        .touch-button:active {
            background: rgba(0, 255, 255, 0.6);
            transform: scale(0.95);
        }

        .touch-button.fire {
            width: 60px;
            height: 60px;
            background: rgba(255, 0, 0, 0.4);
            border-color: #ff0000;
            font-size: 14px;
        }

        .touch-button.fire:active {
            background: rgba(255, 0, 0, 0.7);
        }

        /* 移动设备显示触摸控制 */
        @media (max-width: 768px) and (pointer: coarse) {
            .mobile-controls {
                display: block;
            }
            
            .game-controls {
                padding-bottom: 80px;
            }
            
            .control-info {
                display: none;
            }
        }

        /* 防止移动设备上的默认触摸行为 */
        .game-container {
            touch-action: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* 全屏模式支持 */
        .game-container:fullscreen {
            background: #000;
        }

        .game-container:-webkit-full-screen {
            background: #000;
        }

        .game-container:-moz-full-screen {
            background: #000;
        }

        .game-container:-ms-fullscreen {
            background: #000;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <div class="game-title">雷霆战机</div>
            <div class="game-stats">
                <div class="stat">
                    <span class="stat-label">分数:</span>
                    <span class="stat-value" id="score">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">生命:</span>
                    <span class="stat-value" id="lives">3</span>
                </div>
                <div class="stat">
                    <span class="stat-label">关卡:</span>
                    <span class="stat-value" id="level">1</span>
                </div>
            </div>
        </div>
        
        <div class="game-area">
            <canvas id="gameCanvas" width="800" height="600"></canvas>
            
            <div class="game-overlay" id="gameOverlay">
                <div class="overlay-content">
                    <h2 id="overlayTitle">雷霆战机</h2>
                    <p id="overlayMessage">点击开始游戏</p>
                    <button id="startButton" class="game-button">开始游戏</button>
                    <button id="pauseButton" class="game-button" style="display: none;">暂停</button>
                    <button id="resumeButton" class="game-button" style="display: none;">继续</button>
                    <button id="restartButton" class="game-button" style="display: none;">重新开始</button>
                    <button id="fullscreenButton" class="game-button" style="display: none;">全屏</button>
                </div>
            </div>
        </div>
        
        <div class="game-controls">
            <div class="control-info">
                <p><strong>操作说明:</strong></p>
                <p>方向键/WASD: 移动战机</p>
                <p>空格键: 发射子弹</p>
                <p>P键: 暂停/继续</p>
            </div>
        </div>
        
        <!-- 移动设备触摸控制 -->
        <div class="mobile-controls">
            <div class="touch-controls">
                <div class="movement-controls">
                    <div></div>
                    <div class="touch-button" data-key="ArrowUp">↑</div>
                    <div></div>
                    <div class="touch-button" data-key="ArrowLeft">←</div>
                    <div class="touch-button" data-key="ArrowDown">↓</div>
                    <div class="touch-button" data-key="ArrowRight">→</div>
                </div>
                <div class="action-controls">
                    <div class="touch-button fire" data-action="shoot">射击</div>
                    <div class="touch-button" data-key="KeyP">暂停</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * 雷霆战机游戏主类
         */
        class SkyFighterGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.gameState = 'menu'; // menu, playing, paused, gameOver
                
                // 初始化画布尺寸
                this.resizeCanvas();
                
                // 游戏状态
                this.score = 0;
                this.level = 1;
                this.lives = 3;
                this.gameSpeed = 1;
                
                // 游戏对象
                this.player = null;
                this.bullets = [];
                this.enemies = [];
                this.explosions = [];
                this.powerUps = [];
                this.stars = []; // 背景星星
                
                // 输入控制
                this.keys = {};
                this.lastShotTime = 0;
                this.shootCooldown = 200; // 射击冷却时间（毫秒）
                
                // 敌机生成
                this.lastEnemySpawn = 0;
                this.enemySpawnRate = 1500; // 敌机生成间隔（毫秒）
                
                // 绑定事件
                this.bindEvents();
                this.initStars();
                this.gameLoop();
            }
            
            bindEvents() {
                // 键盘事件
                document.addEventListener('keydown', (e) => {
                    this.keys[e.code] = true;
                    if (e.code === 'Space') {
                        e.preventDefault();
                    }
                    if (e.code === 'KeyP') {
                        this.togglePause();
                    }
                });
                
                document.addEventListener('keyup', (e) => {
                    this.keys[e.code] = false;
                });
                
                // 按钮事件
                document.getElementById('startButton').addEventListener('click', () => this.startGame());
                document.getElementById('pauseButton').addEventListener('click', () => this.togglePause());
                document.getElementById('resumeButton').addEventListener('click', () => this.togglePause());
                document.getElementById('restartButton').addEventListener('click', () => this.restartGame());
                document.getElementById('fullscreenButton').addEventListener('click', () => this.toggleFullscreen());
                
                // 鼠标控制（可选）
                this.canvas.addEventListener('mousemove', (e) => {
                    if (this.gameState === 'playing' && this.player) {
                        const rect = this.canvas.getBoundingClientRect();
                        const mouseX = e.clientX - rect.left;
                        const mouseY = e.clientY - rect.top;
                        this.player.targetX = mouseX;
                        this.player.targetY = mouseY;
                    }
                });
                
                this.canvas.addEventListener('click', (e) => {
                    if (this.gameState === 'playing') {
                        this.shoot();
                    }
                });
                
                // 触摸控制事件
                this.setupTouchControls();
                
                // 窗口大小改变事件
                window.addEventListener('resize', () => this.resizeCanvas());
                window.addEventListener('orientationchange', () => {
                    setTimeout(() => this.resizeCanvas(), 100);
                });
            }
            
            setupTouchControls() {
                // 触摸按钮事件
                document.querySelectorAll('.touch-button').forEach(button => {
                    const key = button.dataset.key;
                    const action = button.dataset.action;
                    
                    const startEvent = (e) => {
                        e.preventDefault();
                        if (key) {
                            this.keys[key] = true;
                        } else if (action === 'shoot') {
                            this.touchShootInterval = setInterval(() => this.shoot(), 150);
                        }
                    };
                    
                    const endEvent = (e) => {
                        e.preventDefault();
                        if (key) {
                            this.keys[key] = false;
                        } else if (action === 'shoot') {
                            clearInterval(this.touchShootInterval);
                        }
                    };
                    
                    // 触摸事件
                    button.addEventListener('touchstart', startEvent);
                    button.addEventListener('touchend', endEvent);
                    button.addEventListener('touchcancel', endEvent);
                    
                    // 鼠标事件（用于测试）
                    button.addEventListener('mousedown', startEvent);
                    button.addEventListener('mouseup', endEvent);
                    button.addEventListener('mouseleave', endEvent);
                });
            }
            
            resizeCanvas() {
                const container = this.canvas.parentElement;
                const containerWidth = container.clientWidth;
                const containerHeight = container.clientHeight;
                
                // 计算合适的画布尺寸
                let canvasWidth = Math.min(800, containerWidth * 0.9);
                let canvasHeight = Math.min(600, containerHeight * 0.8);
                
                // 保持宽高比
                const aspectRatio = 800 / 600;
                if (canvasWidth / canvasHeight > aspectRatio) {
                    canvasWidth = canvasHeight * aspectRatio;
                } else {
                    canvasHeight = canvasWidth / aspectRatio;
                }
                
                // 设置画布尺寸
                this.canvas.width = canvasWidth;
                this.canvas.height = canvasHeight;
                
                // 更新游戏对象的位置限制
                if (this.player) {
                    this.player.updateBounds(canvasWidth, canvasHeight);
                }
            }
            
            initStars() {
                for (let i = 0; i < 100; i++) {
                    this.stars.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        size: Math.random() * 2 + 1,
                        speed: Math.random() * 2 + 1
                    });
                }
            }
            
            startGame() {
                this.gameState = 'playing';
                this.score = 0;
                this.level = 1;
                this.lives = 3;
                this.gameSpeed = 1;
                this.bullets = [];
                this.enemies = [];
                this.explosions = [];
                this.powerUps = [];
                
                // 创建玩家战机，位置基于当前画布尺寸
                this.player = new Player(this.canvas.width / 2, this.canvas.height - 100);
                this.player.updateBounds(this.canvas.width, this.canvas.height);
                
                this.updateUI();
                this.hideOverlay();
            }
            
            togglePause() {
                if (this.gameState === 'playing') {
                    this.gameState = 'paused';
                    this.showOverlay('游戏暂停', '点击继续按钮或按P键继续游戏', ['resumeButton', 'fullscreenButton']);
                } else if (this.gameState === 'paused') {
                    this.gameState = 'playing';
                    this.hideOverlay();
                }
            }
            
            restartGame() {
                this.startGame();
            }
            
            toggleFullscreen() {
                const container = document.querySelector('.game-container');
                
                if (!document.fullscreenElement && !document.webkitFullscreenElement && 
                    !document.msFullscreenElement && !document.mozFullScreenElement) {
                    // 进入全屏
                    if (container.requestFullscreen) {
                        container.requestFullscreen();
                    } else if (container.webkitRequestFullscreen) {
                        container.webkitRequestFullscreen();
                    } else if (container.msRequestFullscreen) {
                        container.msRequestFullscreen();
                    } else if (container.mozRequestFullScreen) {
                        container.mozRequestFullScreen();
                    }
                } else {
                    // 退出全屏
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    } else if (document.msExitFullscreen) {
                        document.msExitFullscreen();
                    } else if (document.mozCancelFullScreen) {
                        document.mozCancelFullScreen();
                    }
                }
            }
            
            gameOver() {
                this.gameState = 'gameOver';
                this.showOverlay('游戏结束', `最终分数: ${this.score}`, ['restartButton', 'fullscreenButton']);
            }
            
            showOverlay(title, message, buttons = []) {
                document.getElementById('overlayTitle').textContent = title;
                document.getElementById('overlayMessage').textContent = message;
                document.getElementById('gameOverlay').style.display = 'flex';
                
                // 隐藏所有按钮
                document.querySelectorAll('.game-button').forEach(btn => btn.style.display = 'none');
                
                // 显示指定按钮
                buttons.forEach(btnId => {
                    document.getElementById(btnId).style.display = 'inline-block';
                });
            }
            
            hideOverlay() {
                document.getElementById('gameOverlay').style.display = 'none';
            }
            
            updateUI() {
                document.getElementById('score').textContent = this.score;
                document.getElementById('lives').textContent = this.lives;
                document.getElementById('level').textContent = this.level;
            }
            
            handleInput() {
                if (!this.player || this.gameState !== 'playing') return;
                
                // 移动控制
                if (this.keys['ArrowLeft'] || this.keys['KeyA']) {
                    this.player.moveLeft();
                }
                if (this.keys['ArrowRight'] || this.keys['KeyD']) {
                    this.player.moveRight();
                }
                if (this.keys['ArrowUp'] || this.keys['KeyW']) {
                    this.player.moveUp();
                }
                if (this.keys['ArrowDown'] || this.keys['KeyS']) {
                    this.player.moveDown();
                }
                
                // 射击控制
                if (this.keys['Space']) {
                    this.shoot();
                }
            }
            
            shoot() {
                const now = Date.now();
                if (now - this.lastShotTime > this.shootCooldown) {
                    this.bullets.push(this.player.shoot());
                    this.lastShotTime = now;
                }
            }
            
            spawnEnemy() {
                const now = Date.now();
                if (now - this.lastEnemySpawn > this.enemySpawnRate) {
                    const x = Math.random() * (this.canvas.width - 60) + 30;
                    const enemyType = Math.random() < 0.7 ? 'basic' : 'advanced';
                    this.enemies.push(new Enemy(x, -50, enemyType, this.gameSpeed));
                    this.lastEnemySpawn = now;
                }
            }
            
            update() {
                if (this.gameState !== 'playing') return;
                
                this.handleInput();
                this.spawnEnemy();
                
                // 更新背景星星
                this.stars.forEach(star => {
                    star.y += star.speed;
                    if (star.y > this.canvas.height) {
                        star.y = 0;
                        star.x = Math.random() * this.canvas.width;
                    }
                });
                
                // 更新玩家
                if (this.player) {
                    this.player.update();
                }
                
                // 更新子弹
                this.bullets = this.bullets.filter(bullet => {
                    bullet.update();
                    return bullet.y > -10;
                });
                
                // 更新敌机
                this.enemies = this.enemies.filter(enemy => {
                    enemy.update();
                    return enemy.y < this.canvas.height + 50;
                });
                
                // 更新爆炸效果
                this.explosions = this.explosions.filter(explosion => {
                    explosion.update();
                    return explosion.life > 0;
                });
                
                // 碰撞检测
                this.checkCollisions();
                
                // 检查游戏状态
                if (this.lives <= 0) {
                    this.gameOver();
                }
            }
            
            checkCollisions() {
                // 子弹与敌机碰撞
                this.bullets.forEach((bullet, bulletIndex) => {
                    this.enemies.forEach((enemy, enemyIndex) => {
                        if (this.isColliding(bullet, enemy)) {
                            // 创建爆炸效果
                            this.explosions.push(new Explosion(enemy.x, enemy.y));
                            
                            // 增加分数
                            this.score += enemy.points;
                            
                            // 移除子弹和敌机
                            this.bullets.splice(bulletIndex, 1);
                            this.enemies.splice(enemyIndex, 1);
                            
                            // 更新UI
                            this.updateUI();
                        }
                    });
                });
                
                // 玩家与敌机碰撞
                if (this.player) {
                    this.enemies.forEach((enemy, enemyIndex) => {
                        if (this.isColliding(this.player, enemy)) {
                            // 创建爆炸效果
                            this.explosions.push(new Explosion(enemy.x, enemy.y));
                            
                            // 移除敌机
                            this.enemies.splice(enemyIndex, 1);
                            
                            // 减少生命值
                            this.lives--;
                            this.player.takeDamage();
                            
                            // 更新UI
                            this.updateUI();
                        }
                    });
                }
            }
            
            isColliding(obj1, obj2) {
                return obj1.x < obj2.x + obj2.width &&
                       obj1.x + obj1.width > obj2.x &&
                       obj1.y < obj2.y + obj2.height &&
                       obj1.y + obj1.height > obj2.y;
            }
            
            render() {
                // 清空画布
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                // 绘制背景星星
                this.ctx.fillStyle = '#ffffff';
                this.stars.forEach(star => {
                    this.ctx.beginPath();
                    this.ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    this.ctx.fill();
                });
                
                if (this.gameState === 'playing') {
                    // 绘制玩家
                    if (this.player) {
                        this.player.render(this.ctx);
                    }
                    
                    // 绘制子弹
                    this.bullets.forEach(bullet => bullet.render(this.ctx));
                    
                    // 绘制敌机
                    this.enemies.forEach(enemy => enemy.render(this.ctx));
                    
                    // 绘制爆炸效果
                    this.explosions.forEach(explosion => explosion.render(this.ctx));
                }
            }
            
            gameLoop() {
                this.update();
                this.render();
                requestAnimationFrame(() => this.gameLoop());
            }
        }

        /**
         * 玩家战机类
         */
        class Player {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 50;
                this.height = 50;
                this.speed = 5;
                this.health = 100;
                this.invulnerable = false;
                this.invulnerableTime = 0;
                this.canvasWidth = 800;
                this.canvasHeight = 600;
            }
            
            updateBounds(canvasWidth, canvasHeight) {
                this.canvasWidth = canvasWidth;
                this.canvasHeight = canvasHeight;
                // 确保玩家在画布范围内
                this.x = Math.min(this.x, canvasWidth - this.width);
                this.y = Math.min(this.y, canvasHeight - this.height);
            }
            
            moveLeft() {
                this.x = Math.max(0, this.x - this.speed);
            }
            
            moveRight() {
                this.x = Math.min(this.canvasWidth - this.width, this.x + this.speed);
            }
            
            moveUp() {
                this.y = Math.max(0, this.y - this.speed);
            }
            
            moveDown() {
                this.y = Math.min(this.canvasHeight - this.height, this.y + this.speed);
            }
            
            update() {
                if (this.invulnerable) {
                    this.invulnerableTime--;
                    if (this.invulnerableTime <= 0) {
                        this.invulnerable = false;
                    }
                }
            }
            
            shoot() {
                return new Bullet(this.x + this.width / 2 - 2, this.y, -8, '#00ffff');
            }
            
            takeDamage() {
                if (!this.invulnerable) {
                    this.health -= 20;
                    this.invulnerable = true;
                    this.invulnerableTime = 60; // 1秒无敌时间
                }
            }
            
            render(ctx) {
                ctx.save();
                
                // 无敌时闪烁效果
                if (this.invulnerable && Math.floor(this.invulnerableTime / 5) % 2 === 0) {
                    ctx.globalAlpha = 0.5;
                }
                
                // 绘制战机主体
                ctx.fillStyle = '#0080ff';
                ctx.fillRect(this.x + 15, this.y + 10, 20, 30);
                
                // 绘制机翼
                ctx.fillStyle = '#00ffff';
                ctx.fillRect(this.x, this.y + 20, 50, 15);
                
                // 绘制机头
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.moveTo(this.x + 25, this.y);
                ctx.lineTo(this.x + 20, this.y + 15);
                ctx.lineTo(this.x + 30, this.y + 15);
                ctx.closePath();
                ctx.fill();
                
                // 绘制引擎火焰
                ctx.fillStyle = '#ff6600';
                ctx.fillRect(this.x + 10, this.y + 40, 10, 10);
                ctx.fillRect(this.x + 30, this.y + 40, 10, 10);
                
                ctx.restore();
            }
        }

        /**
         * 子弹类
         */
        class Bullet {
            constructor(x, y, speed, color) {
                this.x = x;
                this.y = y;
                this.width = 4;
                this.height = 10;
                this.speed = speed;
                this.color = color;
            }
            
            update() {
                this.y += this.speed;
            }
            
            render(ctx) {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                // 添加发光效果
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.shadowBlur = 0;
            }
        }

        /**
         * 敌机类
         */
        class Enemy {
            constructor(x, y, type, speedMultiplier) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.width = type === 'basic' ? 40 : 60;
                this.height = type === 'basic' ? 40 : 60;
                this.speed = (type === 'basic' ? 2 : 3) * speedMultiplier;
                this.health = type === 'basic' ? 1 : 2;
                this.points = type === 'basic' ? 10 : 25;
                this.shootCooldown = 0;
            }
            
            update() {
                this.y += this.speed;
                
                // 高级敌机左右移动
                if (this.type === 'advanced') {
                    this.x += Math.sin(this.y * 0.02) * 2;
                }
                
                // 敌机射击（简化版，不实现敌机子弹）
                this.shootCooldown--;
            }
            
            render(ctx) {
                ctx.save();
                
                if (this.type === 'basic') {
                    // 基础敌机
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(this.x + 10, this.y, 20, 30);
                    
                    ctx.fillStyle = '#ff6600';
                    ctx.fillRect(this.x, this.y + 15, 40, 15);
                    
                    // 绘制细节
                    ctx.fillStyle = '#ffff00';
                    ctx.fillRect(this.x + 15, this.y + 5, 10, 5);
                    ctx.fillRect(this.x + 15, this.y + 20, 10, 5);
                } else {
                    // 高级敌机
                    ctx.fillStyle = '#800080';
                    ctx.fillRect(this.x + 15, this.y, 30, 40);
                    
                    ctx.fillStyle = '#ff00ff';
                    ctx.fillRect(this.x, this.y + 20, 60, 20);
                    
                    // 绘制细节
                    ctx.fillStyle = '#00ffff';
                    ctx.fillRect(this.x + 20, this.y + 10, 20, 10);
                    ctx.fillRect(this.x + 20, this.y + 30, 20, 10);
                }
                
                ctx.restore();
            }
        }

        /**
         * 爆炸效果类
         */
        class Explosion {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.particles = [];
                this.life = 30;
                
                // 创建粒子
                for (let i = 0; i < 15; i++) {
                    this.particles.push({
                        x: x,
                        y: y,
                        vx: (Math.random() - 0.5) * 10,
                        vy: (Math.random() - 0.5) * 10,
                        size: Math.random() * 5 + 2,
                        color: `hsl(${Math.random() * 60 + 10}, 100%, 50%)`,
                        life: Math.random() * 20 + 10
                    });
                }
            }
            
            update() {
                this.life--;
                this.particles.forEach(particle => {
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    particle.life--;
                    particle.size *= 0.95;
                });
            }
            
            render(ctx) {
                this.particles.forEach(particle => {
                    if (particle.life > 0) {
                        ctx.save();
                        ctx.globalAlpha = particle.life / 30;
                        ctx.fillStyle = particle.color;
                        ctx.beginPath();
                        ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                });
            }
        }

        // 初始化游戏
        document.addEventListener('DOMContentLoaded', () => {
            new SkyFighterGame();
        });
    </script>
</body>
