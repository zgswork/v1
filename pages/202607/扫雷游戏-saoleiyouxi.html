<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扫雷游戏</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        h1 {
            color: #333;
            margin: 10px 0;
            font-size: clamp(20px, 5vw, 28px);
        }
        
        .game-container {
            display: inline-block;
            margin-top: 10px;
            background-color: #bdbdbd;
            padding: 10px;
            border: 3px solid;
            border-color: #fff #7b7b7b #7b7b7b #fff;
            max-width: 100%;
            overflow: auto;
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            padding: 5px 10px;
            margin-bottom: 10px;
            background-color: #bdbdbd;
            border: 2px solid;
            border-color: #7b7b7b #fff #fff #7b7b7b;
        }
        
        .mines-count, .timer {
            background-color: #000;
            color: #f00;
            font-family: monospace;
            font-size: clamp(18px, 4vw, 24px);
            padding: 2px 10px;
            border: 1px solid #7b7b7b;
            min-width: 60px;
            text-align: center;
        }
        
        .reset-button {
            width: clamp(30px, 8vw, 40px);
            height: clamp(30px, 8vw, 40px);
            font-size: clamp(20px, 6vw, 24px);
            cursor: pointer;
            border: 2px solid;
            border-color: #fff #7b7b7b #7b7b7b #fff;
            background-color: #bdbdbd;
            padding: 0;
        }
        
        .reset-button:active {
            border-color: #7b7b7b #fff #fff #7b7b7b;
        }
        
        .game-board {
            display: grid;
            grid-gap: 1px;
            background-color: #7b7b7b;
            border: 2px solid;
            border-color: #7b7b7b #fff #fff #7b7b7b;
            margin: 0 auto;
        }
        
        .cell {
            width: clamp(24px, 6vw, 30px);
            height: clamp(24px, 6vw, 30px);
            background-color: #bdbdbd;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: clamp(12px, 3vw, 16px);
            cursor: pointer;
            border: 2px solid;
            border-color: #fff #7b7b7b #7b7b7b #fff;
            user-select: none;
        }
        
        .cell.revealed {
            border: 1px solid #7b7b7b;
            background-color: #bdbdbd;
        }
        
        .cell.flagged {
            background-color: #bdbdbd;
        }
        
        .cell.mine {
            background-color: #f00;
        }
        
        .cell.mine.revealed {
            background-color: #f00;
        }
        
        .cell-1 { color: blue; }
        .cell-2 { color: green; }
        .cell-3 { color: red; }
        .cell-4 { color: darkblue; }
        .cell-5 { color: brown; }
        .cell-6 { color: teal; }
        .cell-7 { color: black; }
        .cell-8 { color: gray; }
        
        .difficulty-selector {
            margin: 10px 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
        }
        
        button {
            padding: 5px 10px;
            margin: 0 5px;
            cursor: pointer;
            font-size: clamp(12px, 3vw, 14px);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            text-align: center;
            max-width: 80%;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }
        
        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }
        
        .modal-buttons button {
            padding: 8px 15px;
            font-size: 14px;
        }
        
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #666;
            text-align: center;
            padding: 10px;
        }
        
        .footer a {
            color: #06c;
            text-decoration: none;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>扫雷游戏</h1>
    
    <div class="difficulty-selector">
        <button onclick="startGame(10, 10, 15)">简单</button>
        <button onclick="startGame(16, 16, 40)">中等</button>
        <button onclick="startGame(16, 30, 99)">困难</button>
    </div>
    
    <div class="game-container">
        <div class="game-info">
            <div class="mines-count">000</div>
            <button class="reset-button" onclick="resetGame()">😊</button>
            <div class="timer">000</div>
        </div>
        <div class="game-board" id="game-board"></div>
    </div>
    
    <div class="modal" id="game-over-modal">
        <div class="modal-content">
            <h2 id="modal-title">游戏结束</h2>
            <p id="modal-message">你踩到地雷了！</p>
            <div class="modal-buttons">
                <button onclick="resetGame(); closeModal()">再玩一次</button>
                <button onclick="closeModal()">取消</button>
            </div>
        </div>
    </div>
    
    <div class="footer">
        由 老陈 使用 DeepSeek 生成，
        <a href="https://pan.quark.cn/s/3c7d944462e1" target="_blank">
            （提示词、网页源码，点这领取，免费）
        </a>
    </div>
    
    <script>
        // 游戏状态
        const gameState = {
            board: [],
            rows: 10,
            cols: 10,
            mines: 15,
            flags: 0,
            revealed: 0,
            gameOver: false,
            gameWon: false,
            firstClick: true,
            timer: 0,
            timerInterval: null
        };
        
        // 获取DOM元素
        const gameBoard = document.getElementById('game-board');
        const modal = document.getElementById('game-over-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        
        // 初始化游戏
        function initGame() {
            gameBoard.innerHTML = '';
            gameBoard.style.gridTemplateColumns = `repeat(${gameState.cols}, minmax(24px, 30px))`;
            
            // 创建空棋盘
            gameState.board = Array(gameState.rows).fill().map(() => 
                Array(gameState.cols).fill().map(() => ({
                    isMine: false,
                    isRevealed: false,
                    isFlagged: false,
                    neighborMines: 0
                }))
            );
            
            // 创建单元格元素
            for (let row = 0; row < gameState.rows; row++) {
                for (let col = 0; col < gameState.cols; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    
                    cell.addEventListener('click', () => handleCellClick(row, col));
                    cell.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        handleRightClick(row, col);
                    });
                    
                    gameBoard.appendChild(cell);
                }
            }
            
            // 重置游戏状态
            gameState.flags = 0;
            gameState.revealed = 0;
            gameState.gameOver = false;
            gameState.gameWon = false;
            gameState.firstClick = true;
            
            // 更新显示
            updateMinesCount();
            resetTimer();
        }
        
        // 放置地雷（首次点击后）
        function placeMines(firstRow, firstCol) {
            let minesPlaced = 0;
            
            while (minesPlaced < gameState.mines) {
                const row = Math.floor(Math.random() * gameState.rows);
                const col = Math.floor(Math.random() * gameState.cols);
                
                // 确保首次点击的单元格及其周围没有地雷
                const isFirstClickArea = Math.abs(row - firstRow) <= 1 && Math.abs(col - firstCol) <= 1;
                
                if (!gameState.board[row][col].isMine && !isFirstClickArea) {
                    gameState.board[row][col].isMine = true;
                    minesPlaced++;
                }
            }
            
            // 计算每个单元格周围的地雷数
            for (let row = 0; row < gameState.rows; row++) {
                for (let col = 0; col < gameState.cols; col++) {
                    if (!gameState.board[row][col].isMine) {
                        gameState.board[row][col].neighborMines = countNeighborMines(row, col);
                    }
                }
            }
        }
        
        // 计算相邻地雷数
        function countNeighborMines(row, col) {
            let count = 0;
            
            for (let r = Math.max(0, row - 1); r <= Math.min(gameState.rows - 1, row + 1); r++) {
                for (let c = Math.max(0, col - 1); c <= Math.min(gameState.cols - 1, col + 1); c++) {
                    if (gameState.board[r][c].isMine) {
                        count++;
                    }
                }
            }
            
            return count;
        }
        
        // 处理单元格点击
        function handleCellClick(row, col) {
            const cell = gameState.board[row][col];
            
            if (gameState.gameOver || cell.isRevealed || cell.isFlagged) {
                return;
            }
            
            // 如果是第一次点击，放置地雷并开始计时
            if (gameState.firstClick) {
                placeMines(row, col);
                startTimer();
                gameState.firstClick = false;
                document.querySelector('.reset-button').textContent = '😊';
            }
            
            // 如果点击到地雷，游戏结束
            if (cell.isMine) {
                revealAllMines();
                gameState.gameOver = true;
                document.querySelector('.reset-button').textContent = '😵';
                showGameOverModal(false);
                return;
            }
            
            // 揭示单元格
            revealCell(row, col);
            
            // 检查是否获胜
            checkWin();
        }
        
        // 揭示单元格
        function revealCell(row, col) {
            const cell = gameState.board[row][col];
            
            if (cell.isRevealed || cell.isFlagged) {
                return;
            }
            
            cell.isRevealed = true;
            gameState.revealed++;
            
            const cellElement = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
            cellElement.classList.add('revealed');
            
            if (cell.neighborMines > 0) {
                cellElement.textContent = cell.neighborMines;
                cellElement.classList.add(`cell-${cell.neighborMines}`);
            } else {
                // 如果是空白单元格，递归揭示周围的单元格
                for (let r = Math.max(0, row - 1); r <= Math.min(gameState.rows - 1, row + 1); r++) {
                    for (let c = Math.max(0, col - 1); c <= Math.min(gameState.cols - 1, col + 1); c++) {
                        if (r !== row || c !== col) {
                            revealCell(r, c);
                        }
                    }
                }
            }
        }
        
        // 处理右键点击（插旗）
        function handleRightClick(row, col) {
            const cell = gameState.board[row][col];
            
            if (gameState.gameOver || cell.isRevealed) {
                return;
            }
            
            const cellElement = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
            
            if (cell.isFlagged) {
                cell.isFlagged = false;
                gameState.flags--;
                cellElement.textContent = '';
                cellElement.classList.remove('flagged');
            } else {
                cell.isFlagged = true;
                gameState.flags++;
                cellElement.textContent = '🚩';
                cellElement.classList.add('flagged');
            }
            
            updateMinesCount();
        }
        
        // 揭示所有地雷
        function revealAllMines() {
            for (let row = 0; row < gameState.rows; row++) {
                for (let col = 0; col < gameState.cols; col++) {
                    const cell = gameState.board[row][col];
                    if (cell.isMine) {
                        const cellElement = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
                        cellElement.textContent = '💣';
                        cellElement.classList.add('mine', 'revealed');
                    }
                }
            }
        }
        
        // 检查是否获胜
        function checkWin() {
            if (gameState.revealed === gameState.rows * gameState.cols - gameState.mines) {
                gameState.gameOver = true;
                gameState.gameWon = true;
                document.querySelector('.reset-button').textContent = '😎';
                clearInterval(gameState.timerInterval);
                
                // 标记所有地雷
                for (let row = 0; row < gameState.rows; row++) {
                    for (let col = 0; col < gameState.cols; col++) {
                        const cell = gameState.board[row][col];
                        if (cell.isMine && !cell.isFlagged) {
                            const cellElement = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
                            cellElement.textContent = '🚩';
                            cellElement.classList.add('flagged');
                        }
                    }
                }
                
                showGameOverModal(true);
            }
        }
        
        // 显示游戏结束弹窗
        function showGameOverModal(isWin) {
            if (isWin) {
                modalTitle.textContent = "恭喜获胜！";
                modalMessage.textContent = `你用时 ${gameState.timer} 秒完成了游戏！`;
            } else {
                modalTitle.textContent = "游戏结束";
                modalMessage.textContent = "你踩到地雷了！";
            }
            modal.style.display = "flex";
        }
        
        // 关闭弹窗
        function closeModal() {
            modal.style.display = "none";
        }
        
        // 更新剩余地雷数显示
        function updateMinesCount() {
            const remainingMines = gameState.mines - gameState.flags;
            const minesCountElement = document.querySelector('.mines-count');
            minesCountElement.textContent = String(Math.max(0, remainingMines)).padStart(3, '0');
        }
        
        // 开始计时器
        function startTimer() {
            resetTimer();
            gameState.timer = 0;
            updateTimerDisplay();
            
            gameState.timerInterval = setInterval(() => {
                gameState.timer++;
                updateTimerDisplay();
                
                if (gameState.timer >= 999) {
                    clearInterval(gameState.timerInterval);
                }
            }, 1000);
        }
        
        // 更新计时器显示
        function updateTimerDisplay() {
            const timerElement = document.querySelector('.timer');
            timerElement.textContent = String(gameState.timer).padStart(3, '0');
        }
        
        // 重置计时器
        function resetTimer() {
            clearInterval(gameState.timerInterval);
            gameState.timer = 0;
            updateTimerDisplay();
        }
        
        // 重置游戏
        function resetGame() {
            initGame();
            document.querySelector('.reset-button').textContent = '😊';
            closeModal();
        }
        
        // 开始新游戏（设置难度）
        function startGame(rows, cols, mines) {
            gameState.rows = rows;
            gameState.cols = cols;
            gameState.mines = mines;
            resetGame();
        }
        
        // 初始化游戏
        window.onload = initGame;
        
        // 点击弹窗外部关闭弹窗
        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });
    </script>
</body>
</html>
