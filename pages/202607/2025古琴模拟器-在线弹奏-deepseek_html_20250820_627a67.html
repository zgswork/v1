    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        document.addEventListener('DOMContentLoaded', function() {
            // 简繁体转换映射表
            const simplifiedToTraditional = {
                '轻': '輕',
                '抚': '撫',
                '琴': '琴',
                '弦': '弦',
                '感': '感',
                '受': '受',
                '千': '千',
                '年': '年',
                '雅': '雅',
                '韵': '韻',
                '作': '作',
                '者': '者',
                '文': '文',
                '璧': '璧',
                '合': '合',
                '作': '作',
                '邮': '郵',
                '箱': '箱',
                '模': '模',
                '拟': '擬',
                '器': '器',
                '宫': '宮',
                '商': '商',
                '角': '角',
                '徵': '徵',
                '羽': '羽',
                '演': '演',
                '示': '示',
                '范': '範',
                '曲': '曲',
                '调': '調',
                '梅': '梅',
                '花': '花',
                '三': '三',
                '弄': '弄',
                '阳': '陽',
                '关': '關',
                '叠': '疊',
                '高': '高',
                '山': '山',
                '流': '流',
                '水': '水',
                '使': '使',
                '用': '用',
                '说': '說',
                '明': '明',
                '弹': '彈',
                '奏': '奏',
                '方': '方',
                '式': '式',
                '点': '點',
                '击': '擊',
                '或': '或',
                '划': '劃',
                '过': '過',
                '进': '進',
                '行': '行',
                '支': '支',
                '持': '持',
                '拖': '拖',
                '动': '動',
                '连': '連',
                '续': '續',
                '拨': '撥',
                '的': '的',
                '分': '分',
                '别': '別',
                '代': '代',
                '表': '表',
                '体': '體',
                '验': '驗',
                '古': '古',
                '味': '味',
                '创': '創',
                '灵': '靈',
                '感': '感',
                '尝': '嘗',
                '试': '試',
                '旋': '旋',
                '律': '律',
                '独': '獨',
                '特': '特',
                '魅': '魅',
                '力': '力',
                '自': '自',
                '动': '動',
                '教': '教',
                '程': '程',
                '重': '重',
                '置': '置'
            };

            const traditionalToSimplified = {};
            for (const [simplified, traditional] of Object.entries(simplifiedToTraditional)) {
                traditionalToSimplified[traditional] = simplified;
            }

            // 音频上下文
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const audioCtx = new AudioContext();
            
            // 琴弦元素
            const strings = document.querySelectorAll('.string');
            
            // 创建古琴音色
            function playNote(stringNumber) {
                // 基础频率 - 古琴常用调弦
                const baseFreq = [130.81, 146.83, 164.81, 196.00, 220.00, 246.94, 293.66];
                
                // 创建振荡器
                const oscillator = audioCtx.createOscillator();
                oscillator.type = 'sine'; // 使用正弦波模拟古琴音色
                
                // 轻微随机变化使音色更自然
                const detune = (Math.random() - 0.5) * 10;
                oscillator.frequency.setValueAtTime(baseFreq[stringNumber-1] * (1 + Math.random()*0.01), audioCtx.currentTime);
                oscillator.detune.setValueAtTime(detune, audioCtx.currentTime);
                
                // 创建音量包络（模拟古琴音色衰减）
                const gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.7, audioCtx.currentTime + 0.01);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 2.5);
                
                // 连接节点
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                // 播放并停止
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 2.5);
                
                // 视觉反馈
                const stringElement = document.querySelector(`.string[data-note="${stringNumber}"]`);
                stringElement.classList.add('plucked');
                setTimeout(() => {
                    stringElement.classList.remove('plucked');
                }, 200);
            }
            
            // 为琴弦添加事件监听
            strings.forEach(string => {
                // 点击播放
                string.addEventListener('click', () => {
                    const note = parseInt(string.getAttribute('data-note'));
                    playNote(note);
                });
                
                // 鼠标划过播放（模拟拨弦）
                string.addEventListener('mouseenter', (e) => {
                    if (e.buttons === 1) { // 只有在鼠标按下时划过才播放
                        const note = parseInt(string.getAttribute('data-note'));
                        playNote(note);
                    }
                });
            });
            
            // 允许鼠标拖动拨弦
            document.addEventListener('mousedown', () => {
                document.addEventListener('mouseover', stringMouseOverHandler);
            });
            
            document.addEventListener('mouseup', () => {
                document.removeEventListener('mouseover', stringMouseOverHandler);
            });
            
            function stringMouseOverHandler(e) {
                if (e.target.classList.contains('string')) {
                    const note = parseInt(e.target.getAttribute('data-note'));
                    playNote(note);
                }
            }
            
            // 示范曲调
            const songs = {
                1: [1, 3, 5, 3, 1, 3, 5, 3, 5, 6, 5, 3, 2],
                2: [5, 6, 5, 3, 2, 1, 2, 3, 5, 3, 2, 1, 6, 5],
                3: [1, 2, 3, 5, 6, 5, 3, 5, 6, 1, 2, 3, 2, 1, 6, 5]
            };
            
            // 为示范曲目添加事件
            document.querySelectorAll('.song').forEach(song => {
                song.addEventListener('click', () => {
                    const songId = parseInt(song.getAttribute('data-song'));
                    playSong(songs[songId]);
                });
            });
            
            // 播放整首曲子
            function playSong(notes) {
                // 先停止所有当前播放
                if (window.currentPlaying) {
                    clearTimeout(window.currentPlaying);
                }
                
                // 依次播放每个音符
                let delay = 0;
                notes.forEach((note, index) => {
                    setTimeout(() => {
                        playNote(note);
                    }, delay);
                    
                    // 根据节奏设置延迟（简单的节奏变化）
                    delay += index % 4 === 0 ? 600 : 300;
                });
            }
            
            // 自动演奏按钮
            document.getElementById('play-all').addEventListener('click', () => {
                playSong([1, 2, 3, 4, 5, 6, 7, 6, 5, 4, 3, 2, 1]);
            });
            
            // 重置按钮
            document.getElementById('reset').addEventListener('click', () => {
                if (window.currentPlaying) {
                    clearTimeout(window.currentPlaying);
                }
            });
            
            // 教程按钮
            document.getElementById('tutorial').addEventListener('click', () => {
                const isTraditional = document.getElementById('traditional-chinese').classList.contains('active');
                if (isTraditional) {
                    alert("歡迎使用古琴模擬器！\n\n1. 點擊或拖動鼠標劃過琴弦可以彈奏\n2. 嘗試上方的示範曲目體驗古琴音樂\n3. 自動演奏按鈕可以演示音階\n\n盡情享受古琴的魅力吧！");
                } else {
                    alert("欢迎使用古琴模拟器！\n\n1. 点击或拖动鼠标划过琴弦可以弹奏\n2. 尝试上方的示范曲目体验古琴音乐\n3. 自动演奏按钮可以演示音阶\n\n尽情享受古琴的魅力吧！");
                }
            });
            
            // 简繁体转换功能
            function convertToTraditional() {
                document.querySelectorAll('h1, h2, h3, p, button, .subtitle, .author, .contact, .string-name, .song, .instruction p').forEach(element => {
                    let text = element.textContent;
                    for (const [simplified, traditional] of Object.entries(simplifiedToTraditional)) {
                        text = text.replace(new RegExp(simplified, 'g'), traditional);
                    }
                    element.textContent = text;
                });
                
                // 更新按钮状态
                document.getElementById('simplified-chinese').classList.remove('active');
                document.getElementById('traditional-chinese').classList.add('active');
                
                // 保存语言偏好
                localStorage.setItem('language-preference', 'traditional');
            }
            
            function convertToSimplified() {
                document.querySelectorAll('h1, h2, h3, p, button, .subtitle, .author, .contact, .string-name, .song, .instruction p').forEach(element => {
                    let text = element.textContent;
                    for (const [traditional, simplified] of Object.entries(traditionalToSimplified)) {
                        text = text.replace(new RegExp(traditional, 'g'), simplified);
                    }
                    element.textContent = text;
                });
                
                // 更新按钮状态
                document.getElementById('traditional-chinese').classList.remove('active');
                document.getElementById('simplified-chinese').classList.add('active');
                
                // 保存语言偏好
                localStorage.setItem('language-preference', 'simplified');
            }
            
            // 添加简繁体按钮事件监听
            document.getElementById('simplified-chinese').addEventListener('click', convertToSimplified);
            document.getElementById('traditional-chinese').addEventListener('click', convertToTraditional);
            
            // 检查本地存储的语言偏好
            const languagePreference = localStorage.getItem('language-preference');
            if (languagePreference === 'traditional') {
                convertToTraditional();
            }
            
            // 创建背景粒子效果
            function createParticles() {
                const particlesContainer = document.getElementById('particles');
                const particleCount = 50;
                
                for (let i = 0; i < particleCount; i++) {
                    const particle = document.createElement('div');
                    particle.classList.add('particle');
                    
                    // 随机大小和位置
                    const size = Math.random() * 4 + 1;
                    const posX = Math.random() * 100;
                    const posY = Math.random() * 100;
                    
                    particle.style.width = `${size}px`;
                    particle.style.height = `${size}px`;
                    particle.style.left = `${posX}vw`;
                    particle.style.top = `${posY}vh`;
                    
                    // 随机动画
                    const animationDuration = Math.random() * 20 + 10;
                    particle.style.animation = `float ${animationDuration}s linear infinite`;
                    
                    particlesContainer.appendChild(particle);
                }
            }
            
            createParticles();
        });
    </script>
</body>
</html>
