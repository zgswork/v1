        // 获取DOM元素
        const recommendBtn = document.getElementById('recommend-btn');
        const changeBtn = document.getElementById('change-btn');
        const downloadBtn = document.getElementById('download-btn');
        const movieDisplay = document.getElementById('movie-display');
        const movieName = document.getElementById('movie-name');
        const movieCountry = document.getElementById('movie-country');
        const movieCast = document.getElementById('movie-cast');
        const movieDesc = document.getElementById('movie-desc');
        const movieRating = document.getElementById('movie-rating');
        const movieReason = document.getElementById('movie-reason');
        const modal = document.getElementById('download-modal');
        const modalClose = document.querySelector('.modal-close');

        // 记录已显示的电影索引
        let shownMovies = [];

        // 推荐电影函数
        function recommendMovie() {
            // 如果所有电影都已显示过，重置记录
            if (shownMovies.length === horrorMovies.length) {
                shownMovies = [];
            }

            // 随机选择一部未显示过的电影
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * horrorMovies.length);
            } while (shownMovies.includes(randomIndex));

            shownMovies.push(randomIndex);
            const movie = horrorMovies[randomIndex];

            // 更新DOM
            movieName.textContent = movie.name;
            movieCountry.textContent = movie.country;
            movieCast.textContent = movie.cast;
            movieDesc.textContent = movie.desc;
            
            // 计算星星数量
            const fullStars = Math.floor(movie.rating);
            const halfStar = movie.rating - fullStars >= 0.5 ? 1 : 0;
            const emptyStars = 5 - fullStars - halfStar;
            
            let stars = '';
            for (let i = 0; i < fullStars; i++) {
                stars += '★';
            }
            if (halfStar) {
                stars += '½';
            }
            for (let i = 0; i < emptyStars; i++) {
                stars += '☆';
            }
            
            movieRating.textContent = stars;
            movieReason.textContent = movie.reason;

            // 显示电影信息和"换一部"按钮
            movieDisplay.style.display = 'block';
            changeBtn.style.display = 'inline-block';
            recommendBtn.style.display = 'none';
        }

        // 显示下载模态框
        function showDownloadModal() {
            modal.style.display = 'flex';
        }

        // 隐藏下载模态框
        function hideDownloadModal() {
            modal.style.display = 'none';
        }

        // 事件监听
        recommendBtn.addEventListener('click', recommendMovie);
        changeBtn.addEventListener('click', recommendMovie);
        downloadBtn.addEventListener('click', showDownloadModal);
        modalClose.addEventListener('click', hideDownloadModal);
        
        // 点击模态框外部关闭
        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                hideDownloadModal();
            }
        });
