<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>九宫格图片生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            padding: 40px;
        }

        .upload-section {
            margin-bottom: 40px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            background: #f8f9ff;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
            transform: translateY(-2px);
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 4em;
            color: #667eea;
            margin-bottom: 20px;
        }

        .upload-text {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 10px;
        }

        .upload-hint {
            color: #666;
            font-size: 1em;
        }

        .file-input {
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px 5px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.3);
        }

        .btn-secondary:hover {
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
        }

        .preview-section {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .preview-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: start;
        }

        .original-preview {
            text-align: center;
        }

        .original-preview h3 {
            margin-bottom: 20px;
            color: #333;
            font-size: 1.3em;
        }

        .original-image {
            max-width: 100%;
            max-height: 400px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .grid-preview {
            text-align: center;
        }

        .grid-preview h3 {
            margin-bottom: 20px;
            color: #333;
            font-size: 1.3em;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 400px;
            margin: 0 auto;
            background: #fff;
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: gap 0.3s ease;
        }

        .grid-line-control {
            margin: 20px 0;
            text-align: center;
        }

        .crop-mode-control {
            margin: 20px 0;
            text-align: center;
            padding: 15px;
            background: #f8f9ff;
            border-radius: 12px;
            border: 1px solid #e1e5ff;
        }

        .crop-mode-control label {
            display: block;
            margin-bottom: 15px;
            color: #333;
            font-weight: 500;
            font-size: 1.1em;
        }

        .radio-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 15px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 140px;
            justify-content: center;
        }

        .radio-option:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .radio-option.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .radio-option input[type="radio"] {
            margin: 0;
            accent-color: #667eea;
        }

        .radio-option.selected input[type="radio"] {
            accent-color: white;
        }

        .radio-text {
            font-size: 0.95em;
            font-weight: 500;
        }

        .grid-line-control label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: 500;
        }

        .slider-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            max-width: 300px;
            margin: 0 auto;
        }

        .slider {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: #ddd;
            outline: none;
            appearance: none;
            transition: background 0.3s ease;
        }

        .slider::-webkit-slider-thumb {
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(102, 126, 234, 0.3);
            transition: all 0.3s ease;
        }

        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.5);
        }

        .slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 6px rgba(102, 126, 234, 0.3);
        }

        .slider-value {
            min-width: 60px;
            padding: 5px 10px;
            background: #f8f9ff;
            border-radius: 15px;
            color: #667eea;
            font-weight: bold;
            font-size: 0.9em;
        }

        .grid-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .grid-item.square-mode {
            aspect-ratio: 1;
        }

        .grid-item.original-mode {
            aspect-ratio: auto;
        }

        .grid-item:hover {
            transform: scale(1.05);
            z-index: 2;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .download-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(102, 126, 234, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .grid-item:hover .download-overlay {
            opacity: 1;
        }

        .download-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 8px 12px;
            border-radius: 15px;
            font-size: 0.9em;
            cursor: pointer;
            font-weight: bold;
        }

        .controls {
            margin-top: 30px;
            text-align: center;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error-message {
            background: #ffe6e6;
            color: #d63031;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 4px solid #d63031;
            display: none;
        }

        @media (max-width: 768px) {
            .preview-container {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .main-content {
                padding: 20px;
            }

            .header h1 {
                font-size: 2em;
            }

            .upload-area {
                padding: 40px 20px;
            }

            .radio-group {
                flex-direction: column;
                gap: 10px;
                align-items: center;
            }

            .radio-option {
                min-width: 200px;
            }
        }

        .footer {
            text-align: center;
            padding: 30px 20px;
            background: #f8f9ff;
            border-top: 1px solid #e1e5ff;
            margin-top: 20px;
        }

        .footer-text {
            color: #666;
            font-size: 0.9em;
        }

        .footer-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .footer-link:hover {
            color: #764ba2;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>九宫格图片生成器</h1>
            <p>将您的图片智能分割成3×3九宫格，完美适用于社交媒体发布</p>
        </div>

        <div class="main-content">
            <div class="upload-section">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📸</div>
                    <div class="upload-text">拖拽图片到此处或点击选择</div>
                    <div class="upload-hint">支持 JPG、PNG、GIF 格式</div>
                    <input type="file" id="fileInput" class="file-input" accept="image/*">
                </div>
                <div class="error-message" id="errorMessage"></div>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>正在处理图片...</p>
            </div>

            <div class="preview-section" id="previewSection">
                <div class="preview-container">
                    <div class="original-preview">
                        <h3>原始图片</h3>
                        <img id="originalImage" class="original-image" alt="原始图片">
                    </div>
                    <div class="grid-preview">
                        <h3>九宫格预览</h3>
                        <div class="grid-container" id="gridContainer">
                            <!-- 九宫格项目将动态生成 -->
                        </div>
                        <div class="crop-mode-control">
                            <label>分割模式</label>
                            <div class="radio-group">
                                <div class="radio-option selected" data-mode="square">
                                    <input type="radio" id="squareMode" name="cropMode" value="square" checked>
                                    <span class="radio-text">正方形裁剪</span>
                                </div>
                                <div class="radio-option" data-mode="original">
                                    <input type="radio" id="originalMode" name="cropMode" value="original">
                                    <span class="radio-text">保持原图比例</span>
                                </div>
                            </div>
                        </div>
                        <div class="grid-line-control">
                            <label for="gridLineSlider">网格线粗细</label>
                            <div class="slider-container">
                                <span>细</span>
                                <input type="range" id="gridLineSlider" class="slider" min="0" max="20" value="8" step="1">
                                <span>粗</span>
                            </div>
                            <div class="slider-value" id="sliderValue">8px</div>
                        </div>
                    </div>
                </div>
                <div class="controls">
                    <button class="btn" id="downloadAllBtn">下载全部图片</button>
                    <button class="btn btn-secondary" id="resetBtn">重新选择图片</button>
                </div>
            </div>
        </div>

        <div class="footer">
            <p class="footer-text">
                由 老陈 使用 AI 生成，（<a href="https://pan.quark.cn/s/a9fcf9841c6d" target="_blank" class="footer-link">提示词、网页源码，点这领取，免费</a>）
            </p>
        </div>
    </div>

    <script>
        class GridImageGenerator {
            constructor() {
                this.uploadArea = document.getElementById('uploadArea');
                this.fileInput = document.getElementById('fileInput');
                this.previewSection = document.getElementById('previewSection');
                this.originalImage = document.getElementById('originalImage');
                this.gridContainer = document.getElementById('gridContainer');
                this.loading = document.getElementById('loading');
                this.errorMessage = document.getElementById('errorMessage');
                this.downloadAllBtn = document.getElementById('downloadAllBtn');
                this.resetBtn = document.getElementById('resetBtn');
                this.gridLineSlider = document.getElementById('gridLineSlider');
                this.sliderValue = document.getElementById('sliderValue');
                
                this.gridImages = [];
                this.originalFileName = '';
                this.currentImage = null;
                this.cropMode = 'square'; // 默认正方形裁剪
                this.cropModeListenersInitialized = false; // 标记是否已初始化监听器
                
                this.initEventListeners();
            }

            initEventListeners() {
                // 上传区域点击事件
                this.uploadArea.addEventListener('click', () => {
                    this.fileInput.click();
                });

                // 文件选择事件
                this.fileInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        this.handleFile(file);
                    }
                });

                // 拖拽事件
                this.uploadArea.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    this.uploadArea.classList.add('dragover');
                });

                this.uploadArea.addEventListener('dragleave', () => {
                    this.uploadArea.classList.remove('dragover');
                });

                this.uploadArea.addEventListener('drop', (e) => {
                    e.preventDefault();
                    this.uploadArea.classList.remove('dragover');
                    const file = e.dataTransfer.files[0];
                    if (file && file.type.startsWith('image/')) {
                        this.handleFile(file);
                    } else {
                        this.showError('请选择有效的图片文件');
                    }
                });

                // 按钮事件
                this.downloadAllBtn.addEventListener('click', () => {
                    this.downloadAllImages();
                });

                this.resetBtn.addEventListener('click', () => {
                    this.reset();
                });

                // 网格线粗细滑动条事件
                this.gridLineSlider.addEventListener('input', (e) => {
                    this.updateGridLineThickness(e.target.value);
                });
            }

            initCropModeListeners() {
                // 防止重复初始化
                if (this.cropModeListenersInitialized) return;
                
                // 裁剪模式切换事件
                const radioOptions = document.querySelectorAll('.radio-option');
                
                radioOptions.forEach((option, index) => {
                    option.addEventListener('click', (e) => {
                        e.preventDefault(); // 阻止默认行为
                        e.stopPropagation(); // 阻止事件冒泡
                        
                        try {
                            // 更新选中状态
                            radioOptions.forEach(opt => opt.classList.remove('selected'));
                            option.classList.add('selected');
                            
                            // 更新单选按钮状态
                            const radio = option.querySelector('input[type="radio"]');
                            if (radio) {
                                radio.checked = true;
                            }
                            
                            // 更新裁剪模式
                            const newMode = option.dataset.mode;
                            
                            if (this.cropMode !== newMode) {
                                this.cropMode = newMode;
                                
                                // 如果已有图片，重新处理
                                if (this.currentImage) {
                                    this.reprocessCurrentImage();
                                }
                            }
                        } catch (error) {
                            console.error('Error in crop mode switch:', error);
                            this.showError('切换模式时出现错误，请刷新页面重试');
                        }
                    });
                });
                
                // 也为单选按钮本身添加事件监听器
                const radioInputs = document.querySelectorAll('input[name="cropMode"]');
                radioInputs.forEach(radio => {
                    radio.addEventListener('change', (e) => {
                        e.preventDefault();
                        
                        try {
                            const newMode = e.target.value;
                            const option = document.querySelector(`.radio-option[data-mode="${newMode}"]`);
                            
                            if (option) {
                                // 更新选中状态
                                radioOptions.forEach(opt => opt.classList.remove('selected'));
                                option.classList.add('selected');
                                
                                if (this.cropMode !== newMode) {
                                    this.cropMode = newMode;
                                    
                                    // 如果已有图片，重新处理
                                    if (this.currentImage) {
                                        this.reprocessCurrentImage();
                                    }
                                }
                            }
                        } catch (error) {
                            console.error('Error in radio change:', error);
                            this.showError('切换模式时出现错误，请刷新页面重试');
                        }
                    });
                });
                
                this.cropModeListenersInitialized = true;
            }

            handleFile(file) {
                // 验证文件类型
                if (!file.type.startsWith('image/')) {
                    this.showError('请选择有效的图片文件');
                    return;
                }

                // 验证文件大小（10MB限制）
                if (file.size > 10 * 1024 * 1024) {
                    this.showError('图片文件大小不能超过10MB');
                    return;
                }

                this.originalFileName = file.name.split('.')[0];
                this.hideError();
                this.showLoading();
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    this.processImage(e.target.result);
                };
                reader.readAsDataURL(file);
            }

            processImage(imageDataUrl) {
                const img = new Image();
                img.onload = () => {
                    try {
                        this.currentImage = img; // 保存当前图片引用
                        this.createGridImages(img);
                        this.displayPreview(imageDataUrl);
                        this.hideLoading();
                        this.showPreview();
                    } catch (error) {
                        this.hideLoading();
                        this.showError('图片处理失败，请重试');
                        console.error('Image processing error:', error);
                    }
                };
                img.onerror = () => {
                    this.hideLoading();
                    this.showError('图片加载失败，请选择其他图片');
                };
                img.src = imageDataUrl;
            }

            reprocessCurrentImage() {
                if (!this.currentImage) return;
                
                // 不显示loading，避免影响DOM
                try {
                    this.createGridImages(this.currentImage);
                    this.displayGridOnly(); // 只更新九宫格部分
                } catch (error) {
                    console.error('Reprocess error:', error);
                    this.showError('图片重新处理失败，请重试');
                }
            }

            createGridImages(img) {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                let sourceWidth, sourceHeight, startX, startY;
                
                if (this.cropMode === 'square') {
                    // 正方形裁剪模式：取最小边，居中裁剪
                    const size = Math.min(img.width, img.height);
                    sourceWidth = sourceHeight = size;
                    startX = (img.width - size) / 2;
                    startY = (img.height - size) / 2;
                } else {
                    // 原图比例模式：保持原始尺寸
                    sourceWidth = img.width;
                    sourceHeight = img.height;
                    startX = 0;
                    startY = 0;
                }
                
                // 每个格子的尺寸
                const gridWidth = sourceWidth / 3;
                const gridHeight = sourceHeight / 3;
                
                this.gridImages = [];
                
                for (let row = 0; row < 3; row++) {
                    for (let col = 0; col < 3; col++) {
                        canvas.width = gridWidth;
                        canvas.height = gridHeight;
                        
                        // 清除画布
                        ctx.clearRect(0, 0, gridWidth, gridHeight);
                        
                        // 绘制对应区域的图片
                        ctx.drawImage(
                            img,
                            startX + col * gridWidth, startY + row * gridHeight, gridWidth, gridHeight,
                            0, 0, gridWidth, gridHeight
                        );
                        
                        // 转换为数据URL
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
                        this.gridImages.push({
                            dataUrl: dataUrl,
                            filename: `${this.originalFileName}_${row + 1}_${col + 1}.jpg`,
                            position: `${row + 1}-${col + 1}`
                        });
                    }
                }
            }

            displayPreview(originalImageUrl) {
                // 显示原始图片
                this.originalImage.src = originalImageUrl;
                
                // 显示九宫格
                this.displayGridOnly();
            }

            displayGridOnly() {
                this.gridContainer.innerHTML = '';
                this.gridImages.forEach((gridImage, index) => {
                    const gridItem = document.createElement('div');
                    gridItem.className = `grid-item ${this.cropMode}-mode`; // 根据裁剪模式添加CSS类
                    
                    const img = document.createElement('img');
                    img.src = gridImage.dataUrl;
                    img.alt = `九宫格 ${gridImage.position}`;
                    
                    const overlay = document.createElement('div');
                    overlay.className = 'download-overlay';
                    
                    const downloadBtn = document.createElement('button');
                    downloadBtn.className = 'download-btn';
                    downloadBtn.textContent = '下载';
                    downloadBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        this.downloadSingleImage(gridImage);
                    });
                    
                    overlay.appendChild(downloadBtn);
                    gridItem.appendChild(img);
                    gridItem.appendChild(overlay);
                    this.gridContainer.appendChild(gridItem);
                });
            }

            downloadSingleImage(gridImage) {
                const link = document.createElement('a');
                link.download = gridImage.filename;
                link.href = gridImage.dataUrl;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

            downloadAllImages() {
                // 创建一个延迟函数来避免浏览器阻止多个下载
                const downloadWithDelay = (images, index = 0) => {
                    if (index >= images.length) return;
                    
                    this.downloadSingleImage(images[index]);
                    
                    setTimeout(() => {
                        downloadWithDelay(images, index + 1);
                    }, 500);
                };
                
                downloadWithDelay(this.gridImages);
            }

            updateGridLineThickness(value) {
                // 更新网格容器的gap值
                this.gridContainer.style.gap = `${value}px`;
                
                // 更新显示的数值
                this.sliderValue.textContent = `${value}px`;
            }

            showLoading() {
                this.loading.style.display = 'block';
                this.previewSection.style.display = 'none';
            }

            hideLoading() {
                this.loading.style.display = 'none';
            }

            showPreview() {
                this.previewSection.style.display = 'block';
                // 确保裁剪模式监听器已初始化（但避免重复初始化）
                this.initCropModeListeners();
            }

            showError(message) {
                this.errorMessage.textContent = message;
                this.errorMessage.style.display = 'block';
            }

            hideError() {
                this.errorMessage.style.display = 'none';
            }

            reset() {
                this.fileInput.value = '';
                this.previewSection.style.display = 'none';
                this.hideError();
                this.gridImages = [];
                this.originalFileName = '';
                this.currentImage = null;
                this.cropModeListenersInitialized = false; // 重置监听器标志
                
                // 重置网格线粗细滑动条
                this.gridLineSlider.value = 8;
                this.sliderValue.textContent = '8px';
                this.gridContainer.style.gap = '8px';
                
                // 重置裁剪模式为正方形
                this.cropMode = 'square';
                const radioOptions = document.querySelectorAll('.radio-option');
                radioOptions.forEach(opt => opt.classList.remove('selected'));
                const squareOption = document.querySelector('.radio-option[data-mode="square"]');
                if (squareOption) {
                    squareOption.classList.add('selected');
                }
                const squareRadio = document.getElementById('squareMode');
                if (squareRadio) {
                    squareRadio.checked = true;
                }
            }
        }

        // 初始化应用
        document.addEventListener('DOMContentLoaded', () => {
            new GridImageGenerator();
        });
    </script>
</body>
</html>
