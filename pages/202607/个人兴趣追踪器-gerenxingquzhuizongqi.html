<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>个人兴趣追踪器</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
      --bg: #0b1220;
      --panel: #0a1324;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #22c55e;
      --accent-2: #60a5fa;
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Noto Sans", "PingFang SC", "Microsoft YaHei"; background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.6; }
    header { padding: 24px; border-bottom: 1px solid #334155; position: sticky; top: 0; backdrop-filter: blur(6px); background: rgba(11, 18, 32, 0.85); z-index: 5; }
    header h1 { margin: 0; font-size: 22px; }
    .container { padding: 24px; max-width: 1200px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
    .card { background: var(--panel); border: 1px solid #334155; border-radius: 12px; padding: 16px; }
    .span-4 { grid-column: span 4; }
    .span-6 { grid-column: span 6; }
    .span-8 { grid-column: span 8; }
    .span-12 { grid-column: span 12; }
    @media (max-width: 960px) {
      .span-4, .span-6, .span-8, .span-12 { grid-column: span 12; }
    }

    h2 { margin: 0 0 12px; font-size: 20px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    label { font-size: 13px; color: var(--muted); }
    input, select, textarea { width: 100%; padding: 12px 14px; background: #091221; color: #ffffff; border: 1px solid #2b3b55; border-radius: 10px; outline: none; font-size: 15px; }
    textarea { min-height: 72px; resize: vertical; }
    .btn { padding: 10px 14px; border-radius: 10px; border: 1px solid #334155; background: #0b1220; color: var(--text); cursor: pointer; font-size: 15px; }
    .btn.primary { background: var(--accent); border-color: #16a34a; color: #ffffff; font-weight: 600; }
    .btn.secondary { background: #0b1220; color: var(--text); }
    .btn.danger { background: var(--danger); border-color: #b91c1c; color: #ffffff; font-weight: 600; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .toolbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .toolbar .left, .toolbar .right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .muted { color: var(--muted); font-size: 12px; }

    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #334155; padding: 12px 10px; text-align: left; font-size: 14px; }
    thead th { color: var(--muted); font-weight: 600; }
    tbody tr:hover { background: #102038; }

    .progress { height: 10px; background: #0b1220; border: 1px solid #334155; border-radius: 999px; overflow: hidden; }
    .progress > span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
    .tag { display: inline-block; padding: 3px 10px; border: 1px solid #334155; border-radius: 999px; font-size: 13px; color: var(--muted); }
    .kpi { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .kpi .item { background: #0b1220; border: 1px solid #334155; border-radius: 12px; padding: 14px; }
    .kpi .item b { font-size: 20px; }
    .kpi .item span { color: var(--muted); font-size: 12px; }

    canvas { width: 100%; height: 280px; background: #0b1220; border: 1px solid #334155; border-radius: 12px; }
  </style>
  <!-- 联系我们样式 -->
  <style>
    .contact-button { position: fixed; right: 80px; bottom: 80px; background: linear-gradient(135deg, #ff7a59, #ff4d4d); color: #fff; border: none; border-radius: 999px; padding: 12px 22px; box-shadow: 0 8px 20px rgba(0,0,0,0.25); display: flex; align-items: center; gap: 10px; font-weight: 700; cursor: pointer; z-index: 20; transition: transform .2s ease, box-shadow .2s ease; }
    .contact-button i { font-size: 18px; }
    .contact-button:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(0,0,0,0.35); }

    .contact-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); backdrop-filter: blur(3px); display: none; align-items: center; justify-content: center; z-index: 50; }
    .contact-modal { width: min(760px, 92vw); background: #fff; color: #111; border-radius: 20px; box-shadow: 0 24px 60px rgba(0,0,0,.30); overflow: hidden; }
    .contact-header { display:flex; align-items:center; justify-content: space-between; padding: 18px 22px; background: linear-gradient(135deg,#7c4dff,#5b8bff); color:#fff; }
    .contact-header .left { display:flex; align-items:center; gap:12px; font-size: 24px; font-weight: 800; }
    .contact-close { background: transparent; border: none; color:#fff; font-size:22px; cursor:pointer; }
    .contact-body { padding: 20px; }
    .contact-item { display:flex; align-items:center; gap:16px; background:#f5f7fb; border-radius:16px; padding: 16px; border-left: 6px solid #5b8bff; }
    .contact-item + .contact-item { margin-top: 16px; }
    .contact-item .icon { width: 50px; height: 50px; border-radius: 50%; display:flex; align-items:center; justify-content:center; background: linear-gradient(135deg,#6a8cff,#7c4dff); color:#fff; font-size: 22px; flex:0 0 50px; }
    .contact-item .info { display:flex; align-items:center; gap:10px; flex-wrap: wrap; }
    .contact-item .label { font-weight: 800; color:#1f2937; }
    .contact-item .value { background:#fff; border-radius:10px; padding:8px 12px; color:#374151; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .contact-footer { margin: 16px 20px 22px; padding: 14px 18px; border-radius: 14px; color:#fff; background: linear-gradient(135deg,#7c4dff,#5b8bff); text-align: center; font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
      <h1>个人兴趣追踪器 · 记录、追踪、可视化</h1>
      <div style="display:flex; align-items:center; gap:8px;">
        <label for="bgColorPicker" class="muted">背景色</label>
        <input id="bgColorPicker" type="color" title="选择背景颜色" />
        <button id="resetBgBtn" class="btn secondary" style="padding:6px 10px;">重置</button>
      </div>
    </div>
  </header>
  <div class="container">
    <div class="grid">
      <section class="card span-8" id="activity-form-card">
        <h2>记录一次活动</h2>
        <div class="row">
          <div style="flex:1; min-width: 180px;">
            <label>活动类型</label>
            <input id="typeInput" list="typeList" placeholder="例如：跑步、绘画、阅读" />
            <datalist id="typeList"></datalist>
          </div>
          <div style="flex:1; min-width: 160px;">
            <label>日期</label>
            <input id="dateInput" type="date" />
          </div>
          <div style="flex:1; min-width: 160px;">
            <label>时长（分钟）</label>
            <input id="durationInput" type="number" min="1" step="1" placeholder="例如：45" />
          </div>
          <div style="flex:1; min-width: 160px;">
            <label>感受（1-5）</label>
            <select id="feelingInput">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3" selected>3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
          </div>
        </div>
        <div class="row" style="margin-top: 8px;">
          <div style="flex:1;">
            <label>备注</label>
            <textarea id="notesInput" placeholder="可选：关键收获、遇到的挑战等"></textarea>
          </div>
        </div>
        <div class="toolbar" style="margin-top: 12px;">
          <div class="left">
            <button id="addBtn" class="btn primary">保存活动</button>
            <button id="resetBtn" class="btn secondary">清空表单</button>
          </div>
          <div class="right muted">数据会自动保存在浏览器本地（localStorage）</div>
        </div>
      </section>

      <section class="card span-4">
        <h2>概览统计</h2>
        <div class="kpi" id="kpiPanel">
          <!-- 动态填充 -->
        </div>
      </section>

      <section class="card span-12">
        <div class="toolbar">
          <h2 style="margin:0;">活动清单</h2>
          <div class="right">
            <input id="filterType" placeholder="按类型过滤" style="width:180px;" />
            <input id="filterStart" type="date" />
            <input id="filterEnd" type="date" />
            <button id="clearFilter" class="btn secondary">清除过滤</button>
          </div>
        </div>
        <div style="overflow:auto;">
          <table>
            <thead>
              <tr>
                <th>日期</th>
                <th>类型</th>
                <th>时长(分钟)</th>
                <th>感受</th>
                <th>备注</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="activityTbody"></tbody>
          </table>
        </div>
      </section>

      <section class="card span-6">
        <h2>兴趣发展历程（按日总时长）</h2>
        <canvas id="lineChart" width="800" height="300"></canvas>
        <div class="muted">展示最近一段时间的每日总时长趋势。</div>
      </section>

      <section class="card span-6">
        <h2>活动频率统计（按类型计数）</h2>
        <canvas id="barChart" width="800" height="300"></canvas>
        <div class="muted">统计每种活动出现次数，帮助了解偏好与习惯。</div>
      </section>

      <section class="card span-6">
        <h2>目标设置</h2>
        <div class="row">
          <div style="flex:1; min-width: 160px;">
            <label>目标名称</label>
            <input id="goalName" placeholder="例如：30天完成20次跑步" />
          </div>
          <div style="flex:1; min-width: 160px;">
            <label>目标类型</label>
            <select id="goalType">
              <option value="count" selected>次数</option>
              <option value="duration">时长（分钟）</option>
            </select>
          </div>
          <div style="flex:1; min-width: 160px;">
            <label>对应活动类型</label>
            <input id="goalActivityType" list="typeList" placeholder="例如：跑步" />
          </div>
          <div style="flex:1; min-width: 160px;">
            <label>目标值</label>
            <input id="goalTarget" type="number" min="1" placeholder="例如：20 或 600" />
          </div>
          <div style="flex:1; min-width: 160px;">
            <label>截止日期</label>
            <input id="goalDeadline" type="date" />
          </div>
        </div>
        <div class="toolbar" style="margin-top: 12px;">
          <div class="left">
            <button id="addGoalBtn" class="btn primary">添加目标</button>
          </div>
          <div class="right muted">目标进度会自动根据活动记录更新。</div>
        </div>
        <div id="goalsList" style="margin-top: 8px; display: grid; gap: 8px;"></div>
      </section>

      <section class="card span-6">
        <h2>里程碑</h2>
        <div class="row">
          <div style="flex:2; min-width: 220px;">
            <label>里程碑描述</label>
            <input id="milestoneDesc" placeholder="例如：首次10公里长跑" />
          </div>
          <div style="flex:1; min-width: 160px;">
            <label>日期</label>
            <input id="milestoneDate" type="date" />
          </div>
        </div>
        <div class="toolbar" style="margin-top: 12px;">
          <div class="left">
            <button id="addMilestoneBtn" class="btn primary">添加里程碑</button>
          </div>
          <div class="right muted">可在达成后标记完成。</div>
        </div>
        <div id="milestoneList" style="margin-top: 8px; display: grid; gap: 8px;"></div>
      </section>
    </div>
  </div>

  <script>
    const storeKey = 'hobbyTracker.v1';
    const appearanceKey = 'hobbyTracker.bgColor';

    const state = {
      activities: [], // {id, type, date, duration, feeling, notes}
      goals: [],      // {id, name, type: 'count'|'duration', target, deadline}
      milestones: []  // {id, desc, date, achieved}
    };

    // 初始化 & 存取
    function loadState() {
      try {
        const raw = localStorage.getItem(storeKey);
        if (raw) {
          const obj = JSON.parse(raw);
          state.activities = Array.isArray(obj.activities) ? obj.activities : [];
          state.goals = Array.isArray(obj.goals) ? obj.goals : [];
          state.milestones = Array.isArray(obj.milestones) ? obj.milestones : [];
        }
      } catch (e) { console.error('loadState error', e); }
    }
    function saveState() {
      try {
        localStorage.setItem(storeKey, JSON.stringify(state));
      } catch (e) { console.error('saveState error', e); }
    }

    // 工具函数
    const uid = () => Math.random().toString(36).slice(2, 10);
    const fmtDate = (d) => new Date(d).toISOString().slice(0,10);
    const todayStr = () => fmtDate(new Date());
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

    // 表单交互
    function setDefaultFormValues() {
      const dateEl = document.getElementById('dateInput');
      dateEl.value = todayStr();
    }
    function clearForm() {
      document.getElementById('typeInput').value = '';
      document.getElementById('dateInput').value = todayStr();
      document.getElementById('durationInput').value = '';
      document.getElementById('feelingInput').value = '3';
      document.getElementById('notesInput').value = '';
    }

    function addActivity() {
      const type = document.getElementById('typeInput').value.trim();
      const date = document.getElementById('dateInput').value || todayStr();
      const duration = parseInt(document.getElementById('durationInput').value, 10);
      const feeling = parseInt(document.getElementById('feelingInput').value, 10);
      const notes = document.getElementById('notesInput').value.trim();

      if (!type || !duration || duration <= 0) {
        alert('请填写活动类型与有效的时长');
        return;
      }
      const item = { id: uid(), type, date, duration, feeling: clamp(feeling || 3, 1, 5), notes };
      state.activities.push(item);
      saveState();
      clearForm();
      renderAll();
    }

    function deleteActivity(id) {
      if (!confirm('确认删除这条活动记录吗？')) return;
      state.activities = state.activities.filter(a => a.id !== id);
      saveState();
      renderAll();
    }

    function editActivity(id) {
      const a = state.activities.find(x => x.id === id);
      if (!a) return;
      const type = prompt('修改类型', a.type);
      if (type === null) return;
      const date = prompt('修改日期(YYYY-MM-DD)', a.date);
      if (date === null) return;
      const durationStr = prompt('修改时长(分钟)', String(a.duration));
      if (durationStr === null) return;
      const duration = parseInt(durationStr, 10) || a.duration;
      const feelingStr = prompt('修改感受(1-5)', String(a.feeling));
      if (feelingStr === null) return;
      const feeling = clamp(parseInt(feelingStr, 10) || a.feeling, 1, 5);
      const notes = prompt('修改备注', a.notes ?? '');
      if (notes === null) return;
      Object.assign(a, { type: type.trim() || a.type, date: date || a.date, duration, feeling, notes });
      saveState();
      renderAll();
    }

    // 过滤
    function getFilters() {
      const type = document.getElementById('filterType').value.trim();
      const start = document.getElementById('filterStart').value;
      const end = document.getElementById('filterEnd').value;
      return { type, start, end };
    }
    function applyFilters(list) {
      const { type, start, end } = getFilters();
      return list.filter(a => {
        if (type && !a.type.toLowerCase().includes(type.toLowerCase())) return false;
        if (start && a.date < start) return false;
        if (end && a.date > end) return false;
        return true;
      });
    }

    // 渲染：活动表
    function renderActivityTable() {
      const tbody = document.getElementById('activityTbody');
      tbody.innerHTML = '';
      const sorted = [...state.activities].sort((a,b) => (a.date < b.date ? 1 : -1));
      const filtered = applyFilters(sorted);
      for (const a of filtered) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${a.date}</td>
          <td><span class="tag">${escapeHtml(a.type)}</span></td>
          <td>${a.duration}</td>
          <td>${a.feeling}</td>
          <td>${escapeHtml(a.notes || '')}</td>
          <td>
            <button class="btn secondary" onclick="editActivity('${a.id}')">编辑</button>
            <button class="btn danger" onclick="deleteActivity('${a.id}')">删除</button>
          </td>
        `;
        tbody.appendChild(tr);
      }
      // 更新类型 datalist
      const types = Array.from(new Set(state.activities.map(a => a.type))).sort();
      const dl = document.getElementById('typeList');
      dl.innerHTML = types.map(t => `<option value="${escapeHtml(t)}"></option>`).join('');
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[s]));
    }

    // 概览KPI
    function renderKpi() {
      const panel = document.getElementById('kpiPanel');
      const list = applyFilters(state.activities);
      const totalCount = list.length;
      const totalMinutes = list.reduce((sum,a)=>sum+a.duration,0);
      const avgFeeling = totalCount ? (list.reduce((s,a)=>s+a.feeling,0)/totalCount).toFixed(1) : '-';
      const daysSet = new Set(list.map(a=>a.date));
      const uniqueDays = daysSet.size;
      const now = new Date();
      const weekAgo = new Date(now.getTime()-7*86400000);
      const weekCount = list.filter(a=>new Date(a.date)>=weekAgo).length;
      panel.innerHTML = `
        <div class="item"><b>${totalCount}</b><br/><span>记录次数</span></div>
        <div class="item"><b>${totalMinutes}</b><br/><span>累计时长(分钟)</span></div>
        <div class="item"><b>${avgFeeling}</b><br/><span>平均感受(1-5)</span></div>
        <div class="item"><b>${weekCount}</b><br/><span>近7天次数</span></div>
      `;
    }

    // 可视化：按日总时长折线图 & 类型计数柱状图
    function aggregateByDate(list) {
      const map = new Map();
      for (const a of list) {
        const d = a.date;
        const prev = map.get(d) || { duration: 0, count: 0 };
        map.set(d, { duration: prev.duration + a.duration, count: prev.count + 1 });
      }
      const entries = Array.from(map.entries()).sort((a,b) => a[0] < b[0] ? -1 : 1);
      return { labels: entries.map(e=>e[0]), values: entries.map(e=>e[1].duration) };
    }

    function aggregateByType(list) {
      const map = new Map();
      for (const a of list) {
        const t = a.type;
        const prev = map.get(t) || { count: 0 };
        map.set(t, { count: prev.count + 1 });
      }
      const entries = Array.from(map.entries()).sort((a,b)=> a[0].localeCompare(b[0]));
      return { labels: entries.map(e=>e[0]), values: entries.map(e=>e[1].count) };
    }

    function drawLineChart(canvasId, labels, values) {
      const c = document.getElementById(canvasId);
      const ctx = c.getContext('2d');
      const W = c.width, H = c.height;
      ctx.clearRect(0,0,W,H);
      // padding
      const pL = 40, pR = 16, pT = 20, pB = 30;
      // axes
      ctx.strokeStyle = '#334155'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(pL, pT); ctx.lineTo(pL, H-pB); ctx.lineTo(W-pR, H-pB);
      ctx.stroke();
      if (!values.length) return;
      const maxV = Math.max(...values);
      const minV = 0;
      const n = values.length;
      const xStep = (W - pL - pR) / Math.max(1, n-1);
      // grid
      ctx.strokeStyle = '#1d2a3f';
      ctx.setLineDash([4,4]);
      for (let i=0;i<5;i++) {
        const y = pT + ((H-pT-pB) * i / 4);
        ctx.beginPath(); ctx.moveTo(pL, y); ctx.lineTo(W-pR, y); ctx.stroke();
      }
      ctx.setLineDash([]);
      // labels Y
      ctx.fillStyle = '#cbd5e1'; ctx.font = '12px system-ui'; ctx.textAlign = 'right';
      for (let i=0;i<=4;i++) {
        const v = minV + (maxV-minV) * i/4;
        const y = (H-pB) - ((H-pT-pB) * i/4);
        ctx.fillText(Math.round(v), pL-6, y+4);
      }
      // line
      ctx.strokeStyle = '#60a5fa'; ctx.lineWidth = 2; ctx.beginPath();
      values.forEach((v,i)=>{
        const x = pL + xStep * i;
        const y = (H-pB) - ((v-minV)/(maxV-minV || 1))*(H-pT-pB);
        if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      });
      ctx.stroke();
      // points
      ctx.fillStyle = '#22c55e';
      values.forEach((v,i)=>{
        const x = pL + xStep * i;
        const y = (H-pB) - ((v-minV)/(maxV-minV || 1))*(H-pT-pB);
        ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fill();
      });
      // X tick labels (sparse)
      ctx.fillStyle = '#cbd5e1'; ctx.textAlign = 'center'; ctx.font = '12px system-ui';
      const tickEvery = Math.ceil(n / 6);
      labels.forEach((lab,i)=>{
        if (i % tickEvery === 0 || i === n-1) {
          const x = pL + xStep * i;
          ctx.fillText(lab.slice(5), x, H-pB+14);
        }
      });
    }

    function drawBarChart(canvasId, labels, values) {
      const c = document.getElementById(canvasId);
      const ctx = c.getContext('2d');
      const W = c.width, H = c.height;
      ctx.clearRect(0,0,W,H);
      const pL = 40, pR = 16, pT = 20, pB = 40;
      ctx.strokeStyle = '#334155'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(pL, pT); ctx.lineTo(pL, H-pB); ctx.lineTo(W-pR, H-pB); ctx.stroke();
      if (!values.length) return;
      const maxV = Math.max(...values);
      const barW = (W - pL - pR) / values.length * 0.7;
      const gap = (W - pL - pR) / values.length * 0.3;
      // grid
      ctx.strokeStyle = '#1d2a3f'; ctx.setLineDash([4,4]);
      for (let i=0;i<5;i++) { const y=pT+((H-pT-pB)*i/4); ctx.beginPath(); ctx.moveTo(pL,y); ctx.lineTo(W-pR,y); ctx.stroke(); }
      ctx.setLineDash([]);
      // bars
      values.forEach((v,i)=>{
        const x = pL + i*(barW+gap) + gap*0.5;
        const h = ((v)/(maxV || 1))*(H-pT-pB);
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(x, (H-pB)-h, barW, h);
      });
      // labels
      ctx.fillStyle = '#cbd5e1'; ctx.textAlign = 'center'; ctx.font = '12px system-ui';
      labels.forEach((lab,i)=>{
        const x = pL + i*(barW+gap) + gap*0.5 + barW/2;
        ctx.fillText(lab, x, H-pB+14);
      });
    }

    // 目标与里程碑
    function addGoal() {
      const name = document.getElementById('goalName').value.trim();
      const type = document.getElementById('goalType').value;
      const activityType = document.getElementById('goalActivityType').value.trim();
      const target = parseInt(document.getElementById('goalTarget').value, 10);
      const deadline = document.getElementById('goalDeadline').value;
      if (!name || !activityType || !target || target <= 0) { alert('请填写目标名称、对应活动类型与有效的目标值'); return; }
      const goal = { id: uid(), name, type, target, deadline, activityType };
      state.goals.push(goal); saveState();
      document.getElementById('goalName').value = '';
      document.getElementById('goalActivityType').value = '';
      document.getElementById('goalTarget').value = '';
      document.getElementById('goalDeadline').value = '';
      renderGoals();
    }
    function deleteGoal(id) {
      if (!confirm('确认删除该目标？')) return;
      state.goals = state.goals.filter(g=>g.id!==id); saveState(); renderGoals();
    }
    function normalizeType(s) { return (s || '').trim().toLowerCase(); }
    function computeGoalProgress(goal) {
      const targetType = normalizeType(goal.activityType);
      // 若未设置活动类型，则该目标不计入任何进度
      if (!targetType) { return { value: 0, pct: 0 }; }
      const filtered = state.activities.filter(a => {
        const deadlineOk = !goal.deadline || new Date(a.date) <= new Date(goal.deadline);
        const typeOk = normalizeType(a.type) === targetType;
        return deadlineOk && typeOk;
      });
      const value = goal.type === 'count'
        ? filtered.length
        : filtered.reduce((s,a)=>s+a.duration,0);
      const pct = clamp(Math.round((value / goal.target) * 100), 0, 100);
      return { value, pct };
    }
    function renderGoals() {
      const wrap = document.getElementById('goalsList');
      wrap.innerHTML = '';
      state.goals.forEach(g => {
        const { value, pct } = computeGoalProgress(g);
        const div = document.createElement('div');
        div.className = 'item';
        div.style.border = '1px solid #1f2937';
        div.style.borderRadius = '12px';
        div.style.padding = '12px';
        div.style.background = '#0b1220';
        div.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
            <div>
              <b>${escapeHtml(g.name)}</b>
              <div class="muted">类型：${g.type==='count'?'次数':'时长(分钟)'} · 活动类型：${escapeHtml(g.activityType || '未设置（不计进度）')} · 目标：${g.target}${g.deadline?` · 截止：${g.deadline}`:''}</div>
            </div>
            <div style="display:flex; gap:8px;">
              <button class="btn secondary" onclick="setGoalActivityType('${g.id}')">设置类型</button>
              <button class="btn danger" onclick="deleteGoal('${g.id}')">删除</button>
            </div>
          </div>
          <div class="progress" style="margin-top:8px;"><span style="width:${pct}%"></span></div>
          <div class="muted" style="margin-top:6px;">进度：${value} / ${g.target}（${pct}%）</div>
        `;
        wrap.appendChild(div);
      });
    }

    function setGoalActivityType(id) {
      const g = state.goals.find(x=>x.id===id);
      if (!g) return;
      const next = prompt('设置该目标对应的活动类型', g.activityType || '');
      if (next === null) return;
      const val = (next || '').trim();
      if (!val) { alert('活动类型不能为空'); return; }
      g.activityType = val;
      saveState();
      renderGoals();
    }

    function addMilestone() {
      const desc = document.getElementById('milestoneDesc').value.trim();
      const date = document.getElementById('milestoneDate').value || todayStr();
      if (!desc) { alert('请填写里程碑描述'); return; }
      const m = { id: uid(), desc, date, achieved: false };
      state.milestones.push(m); saveState();
      document.getElementById('milestoneDesc').value = '';
      document.getElementById('milestoneDate').value = '';
      renderMilestones();
    }
    function toggleMilestone(id) {
      const m = state.milestones.find(x=>x.id===id); if (!m) return;
      m.achieved = !m.achieved; saveState(); renderMilestones();
    }
    function deleteMilestone(id) {
      if (!confirm('确认删除该里程碑？')) return;
      state.milestones = state.milestones.filter(m=>m.id!==id); saveState(); renderMilestones();
    }
    function renderMilestones() {
      const wrap = document.getElementById('milestoneList');
      wrap.innerHTML = '';
      const sorted = [...state.milestones].sort((a,b)=> a.date < b.date ? -1 : 1);
      sorted.forEach(m => {
        const div = document.createElement('div');
        div.className = 'item';
        div.style.border = '1px solid #1f2937';
        div.style.borderRadius = '12px';
        div.style.padding = '12px';
        div.style.background = '#0b1220';
        div.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
            <div>
              <b>${escapeHtml(m.desc)}</b>
              <div class="muted">日期：${m.date}</div>
            </div>
            <div style="display:flex; gap:8px;">
              <button class="btn ${m.achieved?'secondary':'primary'}" onclick="toggleMilestone('${m.id}')">${m.achieved?'标记未完成':'标记完成'}</button>
              <button class="btn danger" onclick="deleteMilestone('${m.id}')">删除</button>
            </div>
          </div>
        `;
        if (m.achieved) { div.style.borderColor = '#16a34a'; div.style.background = '#0c1a12'; }
        wrap.appendChild(div);
      });
    }

    // 统一渲染入口
    function renderCharts() {
      const list = applyFilters(state.activities);
      const byDate = aggregateByDate(list);
      drawLineChart('lineChart', byDate.labels, byDate.values);
      const byType = aggregateByType(list);
      drawBarChart('barChart', byType.labels, byType.values);
    }
    function renderAll() {
      renderActivityTable();
      renderKpi();
      renderCharts();
      renderGoals();
      renderMilestones();
    }

    // 事件绑定
    function bindEvents() {
      document.getElementById('addBtn').addEventListener('click', addActivity);
      document.getElementById('resetBtn').addEventListener('click', clearForm);
      document.getElementById('addGoalBtn').addEventListener('click', addGoal);
      document.getElementById('addMilestoneBtn').addEventListener('click', addMilestone);
      document.getElementById('filterType').addEventListener('input', renderAll);
      document.getElementById('filterStart').addEventListener('change', renderAll);
      document.getElementById('filterEnd').addEventListener('change', renderAll);
      document.getElementById('clearFilter').addEventListener('click', () => {
        document.getElementById('filterType').value = '';
        document.getElementById('filterStart').value = '';
        document.getElementById('filterEnd').value = '';
        renderAll();
      });

      // 外观：背景色选择
      const defaultBg = '#0b1220';
      const bgInput = document.getElementById('bgColorPicker');
      const savedBg = localStorage.getItem(appearanceKey);
      const currentBg = savedBg || getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || defaultBg;
      bgInput.value = toHexColor(currentBg) || defaultBg;
      applyBackground(bgInput.value);
      bgInput.addEventListener('input', (e) => {
        const color = e.target.value;
        applyBackground(color);
        localStorage.setItem(appearanceKey, color);
      });
      document.getElementById('resetBgBtn').addEventListener('click', () => {
        localStorage.removeItem(appearanceKey);
        bgInput.value = defaultBg;
        applyBackground(defaultBg);
      });
    }

    function applyBackground(color) {
      if (!color) return;
      document.documentElement.style.setProperty('--bg', color);
      document.body.style.background = 'var(--bg)';
    }

    function toHexColor(c) {
      // 支持 rgb/rgba/hex，统一转为 #rrggbb
      try {
        const s = c.trim();
        if (/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(s)) {
          if (s.length === 4) {
            return '#' + s[1]+s[1] + s[2]+s[2] + s[3]+s[3];
          }
          return s;
        }
        const m = s.match(/rgba?\((\d+)\s*,\s*(\d+)\s*,\s*(\d+)/i);
        if (m) {
          const r = Number(m[1]); const g = Number(m[2]); const b = Number(m[3]);
          const toHex = (n) => n.toString(16).padStart(2, '0');
          return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
        }
      } catch {}
      return null;
    }

    // 启动
    loadState();
    setDefaultFormValues();
    bindEvents();
  renderAll();
  </script>
