<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盲打键盘练习工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981',
                        accent: '#F59E0B',
                        danger: '#EF4444',
                        dark: '#1F2937',
                        light: '#F3F4F6'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .key {
                @apply bg-white rounded-md shadow-md flex items-center justify-center transition-all duration-200 border-2 border-gray-200;
            }
            .key-pressed {
                @apply bg-primary/20 border-primary scale-95;
            }
            .key-correct {
                @apply bg-secondary/20 border-secondary;
            }
            .key-error {
                @apply bg-danger/20 border-danger;
            }
            .progress-bar {
                @apply h-2 bg-gray-200 rounded-full overflow-hidden;
            }
            .progress-value {
                @apply h-full bg-primary transition-all duration-300;
            }
            .typing-char {
                @apply text-xl md:text-2xl font-bold mx-1 transition-all duration-200;
            }
            .char-correct {
                @apply text-secondary opacity-70;
            }
            .char-current {
                @apply text-primary underline decoration-2;
            }
            .char-upcoming {
                @apply text-gray-400;
            }
            .char-error {
                @apply text-danger;
            }
            .stat-card {
                @apply bg-white/80 backdrop-blur-sm rounded-lg shadow p-4 transition-all duration-300 hover:shadow-lg;
            }
            .keyboard-container {
                @apply max-w-4xl mx-auto p-2 md:p-4 bg-gray-100 rounded-xl shadow-inner;
            }
            .key-row {
                @apply flex justify-center items-center gap-1 md:gap-2 mb-1 md:mb-2;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-light to-gray-200 min-h-screen flex flex-col">
    <!-- 页面标题 -->
    <header class="py-6 px-4 text-center">
        <h1 class="text-[clamp(1.8rem,5vw,3rem)] font-bold text-dark mb-2">盲打键盘练习工具</h1>
        <p class="text-gray-600 max-w-2xl mx-auto">提升您的打字速度和准确性，通过交互式练习掌握握键盘盲打技巧</p>
    </header>

    <!-- 主要内容区 -->
    <main class="flex-grow containerainer mx-auto px-4 pb-12">
        <!-- 控制面板 -->
        <div class="flex flex-wrap justify-between items-center mb-6 gap-4">
            <div class="flex gap-3">
                <button id="start-btn" class="bg-primary hover:bg-primary/90 text-white font-semibold py-2 px-6 rounded-lg shadow transition-all duration-300 flex items-center gap-2">
                    <i class="fa fa-play"></i> 开始练习
                </button>
                <button id="reset-btn" class="bg-gray-600 hover:bg-gray-700 text-white font-semibold py-2 px-6 rounded-lg shadow transition-all duration-300 flex items items-center gap-2" disabled>
                    <i class="fa fa-refresh"></i> 重置
                </button>
            </div>
            
            <div class="flex flex-wrap gap-4">
                <div class="flex items-center gap-2">
                    <label for="difficulty" class="font-medium text-gray-700">难度:</label>
                    <select id="difficulty" class="border border-gray-300 rounded-md px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-primary">
                        <option value="easy">简单 (小写字母)</option>
                        <option value="medium" selected>中等 (大小写字母)</option>
                        <option value="hard">困难 (大小写写字母随机)</option>
                    </select>
                </div>
                
                <div class="flex items-center gap-2">
                    <label for="length" class="font-medium text-gray-700">长度:</label>
                    <select id="length" class="border border-gray-300 rounded-md px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-primary">
                        <option value="20">短 (20字符)</option>
                        <option value="50" selected>中 (50字符)</option>
                        <option value="100">长 (100字符)</option>
                        <option value="200">特长 (200字符)</option>
                    </select>
                </div>
            </div>
        </div>
        
        <!-- 进度条 -->
        <div class="mb-6">
            <div class="flex justify-between text-sm text-gray-600 mb-1">
                <span>进度</span>
                <span id="progress-text">0%</span>
            </div>
            <div class="progress-bar">
                <div id="progress-bar" class="progress-value" style="width: 0%"></div>
            </div>
        </div>
        
        <!-- 打字练习区 -->
        <div class="bg-white rounded-xl shadow-lg p-6 mb-8 min-h-[120px] flex items-center justify-center">
            <div id="typing-area" class="flex flex-wrap justify-center items-center gap-1 md:gap-2">
                <p class="text-gray-500 italic">点击"开始练习"按钮开始盲打训练</p>
            </div>
        </div>
        
        <!-- 统计数据 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="stat-card">
                <h3 class="text-gray-500 text-sm mb-1">当前速度</h3>
                <p id="speed" class="text-2xl font-bold text-dark">0 <span class="text-sm font-normal text-gray-500">字/分钟</span></p>
            </div>
            <div class="stat-card">
                <h3 class="text-gray-500 text-sm mb-1">准确率</h3>
                <p id="accuracy" class="text-2xl font-bold text-dark">0 <span class="text-sm font-normal text-gray-500">%</span></p>
            </div>
            <div class="stat-card">
                <h3 class="text-gray-500 text-sm mb-1">错误数</h3>
                <p id="errors" class="text-2xl font-bold text-dark">0</p>
            </div>
        </div>
        
        <!-- 虚拟键盘 -->
        <div class="keyboard-container">
            <!-- 第二行键盘 (字母区) -->
            <div class="key-row">
                <div class="key" data-key="Tab" style="width: 75px; height: 50px;">Tab</div>
                <div class="key" data-key="q" style="width: 50px; height: 50px;">q</div>
                <div class="key" data-key="w" style="width: 50px; height: 50px;">w</div>
                <div class="key" data-key="e" style="width: 50px; height: 50px;">e</div>
                <div class="key" data-key="r" style="width: 50px; height: 50px;">r</div>
                <div class="key" data-key="t" style="width: 50px; height: 50px;">t</div>
                <div class="key" data-key="y" style="width: 50px; height: 50px;">y</div>
                <div class="key" data-key="u" style="width: 50px; height: 50px;">u</div>
                <div class="key" data-key="i" style="width: 50px; height: 50px;">i</div>
                <div class="key" data-key="o" style="width: 50px; height: 50px;">o</div>
                <div class="key" data-key="p" style="width: 50px; height: 50px;">p</div>
                <div class="key" data-key="Backspace" style="width: 100px; height: 50px;">Backspace</div>
            </div>
            
            <!-- 第三行键盘 (字母区) -->
            <div class="key-row">
                <div class="key" data-key="CapsLock" style="width: 90px; height: 50px;">Caps Lock</div>
                <div class="key" data-key="a" style="width: 50px; height: 50px;">a</div>
                <div class="key" data-key="s" style="width: 50px; height: 50px;">s</div>
                <div class="key" data-key="d" style="width: 50px; height: 50px;">d</div>
                <div class="key" data-key="f" style="width: 50px; height: 50px;">f</div>
                <div class="key" data-key="g" style="width: 50px; height: 50px;">g</div>
                <div class="key" data-key="h" style="width: 50px; height: 50px;">h</div>
                <div class="key" data-key="j" style="width: 50px; height: 50px;">j</div>
                <div class="key" data-key="k" style="width: 50px; height: 50px;">k</div>
                <div class="key" data-key="l" style="width: 50px; height: 50px;">l</div>
                <div class="key" data-key="Enter" style="width: 105px; height: 50px;">Enter</div>
            </div>
            
            <!-- 第四行键盘 (字母区) -->
            <div class="key-row">
                <div class="key" data-key="Shift" style="width: 115px; height: 50px;">Shift</div>
                <div class="key" data-key="z" style="width: 50px; height: 50px;">z</div>
                <div class="key" data-key="x" style="width: 50px; height: 50px;">x</div>
                <div class="key" data-key="c" style="width: 50px; height: 50px;">c</div>
                <div class="key" data-key="v" style="width: 50px; height: 50px;">v</div>
                <div class="key" data-key="b" style="width: 50px; height: 50px;">b</div>
                <div class="key" data-key="n" style="width: 50px; height: 50px;">n</div>
                <div class="key" data-key="m" style="width: 50px; height: 50px;">m</div>
                <div class="key" data-key="Shift" style="width: 165px; height: 50px;">Shift</div>
            </div>
            
            <!-- 第五行键盘 -->
            <div class="key-row">
                <div class="key" data-key="Ctrl" style="width: 65px; height: 50px;">Ctrl</div>
                <div class="key" data-key="Win" style="width: 65px; height: 50px;"><i class="fa fa-windows"></i></div>
                <div class="key" data-key="Alt" style="width: 65px; height: 50px;">Alt</div>
                <div class="key" data-key=" " style="width: 310px; height: 50px;">Space</div>
                <div class="key" data-key="Alt" style="width: 65px; height: 50px;">Alt</div>
                <div class="key" data-key="Menu" style="width: 65px; height: 50px;"><i class="fa fa-bars"></i></div>
                <div class="key" data-key="Ctrl" style="width: 65px; height: 50px;">Ctrl</div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-dark text-white py-6 px-4 text-center">
        <p>盲打键盘练习工具 &copy; 2023 - 提升您的打字技能</p>
    </footer>

    <!-- 音效元素 -->
    <audio id="correct-sound" preload="auto" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="error-sound" preload="auto" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>
    
    <script>
        // 全局状态变量
        const state = {
            isPracticing: false,
            currentIndex: 0,
            startTime: null,
            endTime: null,
            errors: 0,
            totalChars: 0,
            correctChars: 0,
            typingText: [],
            timer: null
        };

        // DOM元素
        const elements = {
            startBtn: document.getElementById('start-btn'),
            resetBtn: document.getElementById('reset-btn'),
            typingArea: document.getElementById('typing-area'),
            progressBar: document.getElementById('progress-bar'),
            progressText: document.getElementById('progress-text'),
            speedDisplay: document.getElementById('speed'),
            accuracyDisplay: document.getElementById('accuracy'),
            errorsDisplay: document.getElementById('errors'),
            difficultySelect: document.getElementById('difficulty'),
            lengthSelect: document.getElementById('length'),
            correctSound: document.getElementById('correct-sound'),
            errorSound: document.getElementById('error-sound'),
            keys: document.querySelectorAll('.key')
        };

        // 字符集 - 只包含字母和空格
        const charSets = {
            easy: 'abcdefghijklmnopqrstuvwxyz ',  // 仅小写字母和空格
            medium: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ ',  // 大小写字母和空格
            hard: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ '   // 大小写字母和空格（更多随机组合）
        };

        // 生成随机练习文本
        function generateTypingText() {
            const difficulty = elements.difficultySelect.value;
            const length = parseInt(elements.lengthSelect.value);
            const chars = charSets[difficulty];
            let text = [];
            
            for (let i = 0; i < length; i++) {
                const randomIndex = Math.floor(Math.random() * chars.length);
                text.push(chars[randomIndex]);
            }
            
            return text;
        }

        // 渲染打字练习区
        function renderTypingArea() {
            // 使用文档片段减少DOM重绘
            const fragment = document.createDocumentFragment();
            
            state.typingText.forEach((char, index) => {
                const charElement = document.createElement('span');
                charElement.className = 'typing-char';
                
                if (index < state.currentIndex) {
                    charElement.classList.add('char-correct');
                } else if (index === state.currentIndex) {
                    charElement.classList.add('char-current');
                } else {
                    charElement.classList.add('char-upcoming');
                }
                
                // 空格显示为可见字符
                charElement.textContent = char === ' ' ? '␣' : char;
                fragment.appendChild(charElement);
            });
            
            elements.typingArea.innerHTML = '';
            elements.typingArea.appendChild(fragment);
            updateProgress();
        }

        // 更新进度条
        function updateProgress() {
            const progress = (state.currentIndex / state.typingText.length) * 100;
            elements.progressBar.style.width = `${progress}%`;
            elements.progressText.textContent = `${Math.round(progress)}%`;
        }

        // 更新统计数据
        function updateStats() {
            if (!state.startTime) return;
            
            // 计算用时（分钟）
            const currentTime = new Date();
            const minutes = (currentTime - state.startTime) / (1000 * 60);
            
            // 计算速度（字符/分钟）
            const speed = minutes > 0 ? Math.round(state.currentIndex / minutes) : 0;
            
            // 计算准确率
            const accuracy = state.totalChars > 0 
                ? Math.round((state.correctChars / state.totalChars) * 100) 
                : 0;
            
            // 更新显示
            elements.speedDisplay.innerHTML = `${speed} <span class="text-sm font-normal text-gray-500">字/分钟</span>`;
            elements.accuracyDisplay.innerHTML = `${accuracy} <span class="text-sm font-normal text-gray-500">%</span>`;
            elements.errorsDisplay.textContent = state.errors;
        }

        // 处理按键按下
        function handleKeyPress(event) {
            if (!state.isPracticing) return;
            
            // 防止默认行为（如空格滚动页面）
            if (event.key === ' ' || event.key === 'Spacebar') {
                event.preventDefault();
            }
            
            // 处理退格键
            if (event.key === 'Backspace' && state.currentIndex > 0) {
                state.currentIndex--;
                renderTypingArea();
                return;
            }
            
            // 检查是否是当前需要输入的字符
            if (event.key === state.typingText[state.currentIndex]) {
                // 正确输入
                elements.correctSound.currentTime = 0;
                elements.correctSound.play().catch(e => console.log('音效播放失败:', e));
                
                state.currentIndex++;
                state.correctChars++;
                state.totalChars++;
                
                // 高亮正确的按键
                highlightKey(event.key, 'correct');
                
                // 检查是否完成练习
                if (state.currentIndex >= state.typingText.length) {
                    finishPractice();
                    return;
                }
            } else {
                // 错误输入
                elements.errorSound.currentTime = 0;
                elements.errorSound.play().catch(e => console.log('音效播放失败:', e));
                
                state.errors++;
                state.totalChars++;
                
                // 高亮错误的按键
                highlightKey(event.key, 'error');
            }
            
            // 更新UI
            renderTypingArea();
            updateStats();
        }

        // 高亮按键
        function highlightKey(key, type = 'pressed') {
            // 特殊键处理
            const keyName = key === ' ' ? ' ' : 
                           key === 'Enter' ? 'Enter' :
                           key === 'Shift' ? 'Shift' :
                           key === 'Control' ? 'Ctrl' :
                           key === 'Alt' ? 'Alt' :
                           key === 'Tab' ? 'Tab' :
                           key === 'CapsLock' ? 'CapsLock' :
                           key === 'Backspace' ? 'Backspace' :
                           key;
            
            // 找到对应的按键元素并高亮
            const keyElement = document.querySelector(`.key[data-key="${keyName}"]`);
            if (keyElement) {
                keyElement.classList.add(type === 'correct' ? 'key-correct' : 
                                       type === 'error' ? 'key-error' : 'key-pressed');
                
                // 移除高亮
                setTimeout(() => {
                    keyElement.classList.remove('key-pressed', 'key-correct', 'key-error');
                }, 200);
            }
        }

        // 开始练习
        function startPractice() {
            // 重置状态
            state.isPracticing = true;
            state.currentIndex = 0;
            state.startTime = new Date();
            state.errors = 0;
            state.totalChars = 0;
            state.correctChars = 0;
            state.typingText = generateTypingText();
            state.totalChars = state.typingText.length;
            
            // 更新UI
            elements.startBtn.disabled = true;
            elements.resetBtn.disabled = false;
            elements.difficultySelect.disabled = true;
            elements.lengthSelect.disabled = true;
            
            renderTypingArea();
            updateStats();
            
            // 启动定时器更新统计
            state.timer = setInterval(updateStats, 1000);
            
            // 聚焦到页面，确保能捕获按键
            document.body.focus();
        }

        // 重置练习
        function resetPractice() {
            // 停止练习
            state.isPracticing = false;
            clearInterval(state.timer);
            
            // 重置UI
            elements.startBtn.disabled = false;
            elements.resetBtn.disabled = true;
            elements.difficultySelect.disabled = false;
            elements.lengthSelect.disabled = false;
            elements.typingArea.innerHTML = '<p class="text-gray-500 italic">点击"开始练习"按钮开始盲打训练</p>';
            elements.progressBar.style.width = '0%';
            elements.progressText.textContent = '0%';
            
            updateStats();
        }

        // 完成练习
        function finishPractice() {
            state.isPracticing = false;
            state.endTime = new Date();
            clearInterval(state.timer);
            
            // 计算最终统计
            updateStats();
            
            // 显示完成消息
            const totalTime = ((state.endTime - state.startTime) / 1000).toFixed(1);
            const wpm = Math.round((state.typingText.length / (totalTime / 60)));
            const accuracy = Math.round((state.correctChars / state.totalChars) * 100);
            
            // 显示完成弹窗（简单实现）
            elements.typingArea.innerHTML = `
                <div class="text-center">
                    <h3 class="text-2xl font-bold text-primary mb-2">练习完成！</h3>
                    <p class="mb-1">用时: ${totalTime} 秒</p>
                    <p class="mb-1">速度: ${wpm} 字/分钟</p>
                    <p class="mb-3">准确率: ${accuracy}%</p>
                    <button id="new-practice-btn" class="bg-primary hover:bg-primary/90 text-white font-semibold py-2 px-6 rounded-lg shadow transition-all duration-300">
                        再练一次
                    </button>
                </div>
            `;
            
            // 再练一次按钮事件
            document.getElementById('new-practice-btn').addEventListener('click', startPractice);
            
            // 更新按钮状态
            elements.resetBtn.disabled = false;
            elements.difficultySelect.disabled = false;
            elements.lengthSelect.disabled = false;
        }

        // 事件监听
        elements.startBtn.addEventListener('click', startPractice);
        elements.resetBtn.addEventListener('click', resetPractice);
        document.addEventListener('keydown', handleKeyPress);

        // 窗口失去焦点时暂停练习
        window.addEventListener('blur', () => {
            if (state.isPracticing) {
                clearInterval(state.timer);
            }
        });

        // 窗口获得焦点时继续练习
        window.addEventListener('focus', () => {
            if (state.isPracticing) {
                state.timer = setInterval(updateStats, 1000);
            }
        });
    </script>
