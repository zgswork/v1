<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAML ↔ JSON Converter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --light-color: #f8f9fa;
            --dark-color: #212529;
            --success-color: #4cc9f0;
            --error-color: #f72585;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            color: var(--dark-color);
            background-color: #f5f7ff;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }
        
        h1 {
            color: var(--primary-color);
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #6c757d;
            font-size: 1rem;
        }
        
        .language-switcher {
            position: absolute;
            top: 0;
            right: 0;
        }
        
        .converter-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        @media (max-width: 768px) {
            .converter-container {
                grid-template-columns: 1fr;
            }
        }
        
        .editor-container {
            position: relative;
        }
        
        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .editor-label {
            font-weight: 600;
            color: var(--primary-color);
            font-size: 0.9rem;
        }
        
        .editor-actions {
            display: flex;
            gap: 8px;
        }
        
        textarea {
            width: 100%;
            min-height: 300px;
            padding: 15px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: vertical;
            transition: border-color 0.2s;
        }
        
        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(67, 97, 238, 0.2);
        }
        
        .button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .button-primary {
            background-color: var(--primary-color);
            color: white;
        }
        
        .button-primary:hover {
            background-color: var(--secondary-color);
        }
        
        .button-secondary {
            background-color: #e9ecef;
            color: var(--dark-color);
        }
        
        .button-secondary:hover {
            background-color: #dee2e6;
        }
        
        .button-small {
            padding: 4px 8px;
            font-size: 0.8rem;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .status {
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        
        .status-success {
            background-color: rgba(76, 201, 240, 0.1);
            color: var(--success-color);
        }
        
        .status-error {
            background-color: rgba(247, 37, 133, 0.1);
            color: var(--error-color);
        }
        
        .copy-button {
            position: absolute;
            top: 30px;
            right: 10px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 0.7rem;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .editor-container:hover .copy-button {
            opacity: 1;
        }
        
        footer {
            text-align: center;
            margin-top: 30px;
            color: #6c757d;
            font-size: 0.85rem;
        }
        
        .disclaimer {
            margin-top: 30px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 8px;
            font-size: 0.8rem;
            line-height: 1.5;
        }
        
        .author-info {
            margin-top: 10px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="language-switcher">
                <button class="button button-secondary button-small" onclick="toggleLanguage()" id="langBtn">English</button>
            </div>
            <h1 id="title">YAML ↔ JSON 转换器</h1>
            <p class="subtitle" id="subtitle">简洁高效的数据格式转换工具</p>
        </header>
        
        <div class="converter-container">
            <div class="editor-container">
                <div class="editor-header">
                    <span class="editor-label" id="yamlLabel">YAML</span>
                    <div class="editor-actions">
                        <button class="button button-secondary button-small" onclick="clearYaml()" id="clearYamlBtn">清空</button>
                        <button class="button button-secondary button-small" onclick="loadExample()" id="exampleBtn">示例</button>
                    </div>
                </div>
                <textarea id="yamlInput" placeholder="输入 YAML 数据..."># 示例 YAML 数据
user:
  name: "张三"
  age: 28
  is_active: true
  skills:
    - JavaScript
    - Python
    - DevOps
  contact:
    email: "user@example.com"
    phone: "13800138000"</textarea>
                <button class="copy-button" onclick="copyToClipboard('yamlInput')" id="copyYamlBtn">复制</button>
            </div>
            
            <div class="editor-container">
                <div class="editor-header">
                    <span class="editor-label" id="jsonLabel">JSON</span>
                    <div class="editor-actions">
                        <button class="button button-secondary button-small" onclick="clearJson()" id="clearJsonBtn">清空</button>
                    </div>
                </div>
                <textarea id="jsonOutput" placeholder="JSON 输出将显示在这里..." readonly></textarea>
                <button class="copy-button" onclick="copyToClipboard('jsonOutput')" id="copyJsonBtn">复制</button>
            </div>
        </div>
        
        <div id="statusMessage" class="status" style="display: none;"></div>
        
        <div class="controls">
            <button class="button button-primary" onclick="convertYamlToJson()" id="yamlToJsonBtn">
                <span>YAML → JSON</span>
            </button>
            <button class="button button-primary" onclick="convertJsonToYaml()" id="jsonToYamlBtn">
                <span>JSON → YAML</span>
            </button>
        </div>
        
        <div class="disclaimer" id="disclaimer">
            <strong>免责声明：</strong>本工具仅提供格式转换功能，不保证转换结果的绝对准确性。使用者应自行检查转换后的数据。作者不对因使用本工具而产生的任何直接或间接损失负责。
        </div>
        
        <div class="author-info" id="authorInfo">
            作者: 老木头 | 联系邮箱: <a href="/cdn-cgi/l/email-protection#a0cbc5d9d5c590929092e0cfd5d4cccfcfcb8ec3cfcd"><span class="__cf_email__" data-cfemail="c2a9a7bbb7a7f2f0f2f082adb7b6aeadada9eca1adaf">[email&#160;protected]</span></a>
        </div>
        
        <footer id="footer">
            <p>YAML 是一种人性化的数据序列化标准，适用于所有编程语言。</p>
        </footer>
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 语言切换状态
        let isEnglish = false;
        
        // 语言资源
        const resources = {
            zh: {
                title: "YAML ↔ JSON 转换器",
                subtitle: "简洁高效的数据格式转换工具",
                yamlLabel: "YAML",
                jsonLabel: "JSON",
                yamlPlaceholder: "输入 YAML 数据...",
                jsonPlaceholder: "JSON 输出将显示在这里...",
                clearYaml: "清空",
                clearJson: "清空",
                example: "示例",
                copy: "复制",
                yamlToJson: "YAML → JSON",
                jsonToYaml: "JSON → YAML",
                success: "转换成功！",
                copied: "已复制到剪贴板！",
                disclaimer: "免责声明：本工具仅提供格式转换功能，不保证转换结果的绝对准确性。使用者应自行检查转换后的数据。作者不对因使用本工具而产生的任何直接或间接损失负责。",
                author: "作者: 老木头 | 联系邮箱: ",
                footer: "YAML 是一种人性化的数据序列化标准，适用于所有编程语言。",
                langBtn: "English"
            },
            en: {
                title: "YAML ↔ JSON Converter",
                subtitle: "Simple and efficient data format conversion tool",
                yamlLabel: "YAML",
                jsonLabel: "JSON",
                yamlPlaceholder: "Enter YAML data...",
                jsonPlaceholder: "JSON output will appear here...",
                clearYaml: "Clear",
                clearJson: "Clear",
                example: "Example",
                copy: "Copy",
                yamlToJson: "YAML → JSON",
                jsonToYaml: "JSON → YAML",
                success: "Conversion successful!",
                copied: "Copied to clipboard!",
                disclaimer: "Disclaimer: This tool only provides format conversion functionality and does not guarantee the absolute accuracy of the conversion results. Users should verify the converted data themselves. The author is not responsible for any direct or indirect losses caused by using this tool.",
                author: "Author: Old Wood | Contact: ",
                footer: "YAML is a human-friendly data serialization standard for all programming languages.",
                langBtn: "中文"
            }
        };
        
        // 切换语言
        function toggleLanguage() {
            isEnglish = !isEnglish;
            const lang = isEnglish ? 'en' : 'zh';
            const res = resources[lang];
            
            // 更新界面文本
            document.getElementById('title').textContent = res.title;
            document.getElementById('subtitle').textContent = res.subtitle;
            document.getElementById('yamlLabel').textContent = res.yamlLabel;
            document.getElementById('jsonLabel').textContent = res.jsonLabel;
            document.getElementById('yamlInput').placeholder = res.yamlPlaceholder;
            document.getElementById('jsonOutput').placeholder = res.jsonPlaceholder;
            document.getElementById('clearYamlBtn').textContent = res.clearYaml;
            document.getElementById('clearJsonBtn').textContent = res.clearJson;
            document.getElementById('exampleBtn').textContent = res.example;
            document.getElementById('copyYamlBtn').textContent = res.copy;
            document.getElementById('copyJsonBtn').textContent = res.copy;
            document.getElementById('yamlToJsonBtn').innerHTML = `<span>${res.yamlToJson}</span>`;
            document.getElementById('jsonToYamlBtn').innerHTML = `<span>${res.jsonToYaml}</span>`;
            document.getElementById('disclaimer').innerHTML = `<strong>${isEnglish ? 'Disclaimer:' : '免责声明：'}</strong> ${res.disclaimer}`;
            document.getElementById('authorInfo').innerHTML = `${res.author}<a href="mailto:keyue0202@outlook.com">keyue0202@outlook.com</a>`;
            document.getElementById('footer').innerHTML = `<p>${res.footer}</p>`;
            document.getElementById('langBtn').textContent = res.langBtn;
        }
        
        function showStatus(message, isError = false) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = isError ? 'status status-error' : 'status status-success';
            statusEl.style.display = 'block';
            
            setTimeout(() => {
                statusEl.style.opacity = '0';
                setTimeout(() => {
                    statusEl.style.display = 'none';
                    statusEl.style.opacity = '1';
                }, 300);
            }, 3000);
        }
        
        function convertYamlToJson() {
            const yamlText = document.getElementById('yamlInput').value;
            try {
                const jsonObj = jsyaml.load(yamlText);
                const jsonStr = JSON.stringify(jsonObj, null, 2);
                document.getElementById('jsonOutput').value = jsonStr;
                showStatus(isEnglish ? 'Conversion successful!' : '转换成功！');
            } catch (e) {
                showStatus(`${isEnglish ? 'Error:' : '错误:'} ${e.message}`, true);
            }
        }
        
        function convertJsonToYaml() {
            const jsonText = document.getElementById('jsonOutput').value;
            try {
                const jsonObj = JSON.parse(jsonText);
                const yamlStr = jsyaml.dump(jsonObj);
                document.getElementById('yamlInput').value = yamlStr;
                showStatus(isEnglish ? 'Conversion successful!' : '转换成功！');
            } catch (e) {
                showStatus(`${isEnglish ? 'Error:' : '错误:'} ${e.message}`, true);
            }
        }
        
        function clearYaml() {
            document.getElementById('yamlInput').value = '';
        }
        
        function clearJson() {
            document.getElementById('jsonOutput').value = '';
        }
        
        function loadExample() {
            const exampleYaml = isEnglish ? 
                `# Example YAML data
user:
  name: "John Doe"
  age: 30
  is_active: true
  skills:
    - JavaScript
    - Python
    - DevOps
  contact:
    email: "john@example.com"
    phone: "1234567890"` : 
                `# 示例 YAML 数据
user:
  name: "张三"
  age: 28
  is_active: true
  skills:
    - JavaScript
    - Python
    - DevOps
  contact:
    email: "user@example.com"
    phone: "13800138000"`;
            document.getElementById('yamlInput').value = exampleYaml;
        }
        
        function copyToClipboard(elementId) {
            const textarea = document.getElementById(elementId);
            textarea.select();
            document.execCommand('copy');
            showStatus(isEnglish ? 'Copied to clipboard!' : '已复制到剪贴板！');
        }
    </script>
</body>
</html>
