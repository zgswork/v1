<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片转矢量图工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            padding: 40px;
        }

        .upload-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .upload-area {
            border: 3px dashed #4facfe;
            border-radius: 15px;
            padding: 60px 20px;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .upload-area:hover {
            border-color: #00f2fe;
            background: #f0f8ff;
            transform: translateY(-2px);
        }

        .upload-area.dragover {
            border-color: #00f2fe;
            background: #e6f3ff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 4rem;
            color: #4facfe;
            margin-bottom: 20px;
        }

        .upload-text {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .upload-hint {
            color: #666;
            font-size: 1rem;
        }

        #fileInput {
            display: none;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .control-group {
            background: #f8f9ff;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #e0e6ff;
        }

        .control-group h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        /* 两列布局 */
        .control-item {
            display: inline-block;
            width: calc(50% - 10px);
            vertical-align: top;
            margin-bottom: 0;
        }

        .control-item:last-child {
            margin-left: 10px;
        }

        .control-item label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .control-item input,
        .control-item select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e6ff;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .control-item input:focus,
        .control-item select:focus {
            outline: none;
            border-color: #4facfe;
        }

        .preview-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .preview-box {
            background: #f8f9ff;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            border: 1px solid #e0e6ff;
        }

        .preview-box h3 {
            margin-bottom: 20px;
            color: #333;
            font-size: 1.3rem;
        }

        .preview-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #e0e6ff;
        }

        .preview-image,
        .preview-svg {
            max-width: 100%;
            max-height: 280px;
            border-radius: 8px;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.3);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4facfe;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .error-message {
            background: #ffe6e6;
            color: #d63384;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid #f5c6cb;
            display: none;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid #c3e6cb;
            display: none;
        }

        @media (max-width: 768px) {
            .header {
                padding: 20px 15px;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .header p {
                font-size: 0.9rem;
            }

            .main-content {
                padding: 15px;
            }

            .preview-section {
                grid-template-columns: 1fr;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            /* 按钮保持一行布局 */
            .action-buttons {
                flex-direction: row;
                gap: 8px;
            }

            .btn {
                flex: 1;
                padding: 12px 10px;
                font-size: 0.95rem;
                min-width: 0;
            }
        }

        /* 页脚 */
        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 14px;
            border-top: 1px solid #e0e6ff;
            margin-top: 20px;
        }

        .footer strong {
            font-weight: 600;
            color: #333;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🎨 图片转矢量图工具</h1>
            <p>将位图转换为可缩放的矢量图形，支持多种格式输出</p>
        </div>

        <div class="main-content">
            <div class="upload-section">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📁</div>
                    <div class="upload-text">点击或拖拽上传图片</div>
                    <div class="upload-hint">支持 JPG、PNG、GIF 格式，最大 10MB</div>
                </div>
                <input type="file" id="fileInput" accept="image/*">
            </div>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <div class="controls">
                <div class="control-group">
                    <h3>🎯 矢量化设置</h3>
                    <div class="control-item">
                        <label for="colorCount">颜色数量:</label>
                        <input type="range" id="colorCount" min="2" max="32" value="8">
                        <span id="colorCountValue">8</span>
                    </div>
                    <div class="control-item">
                        <label for="threshold">边缘检测阈值:</label>
                        <input type="range" id="threshold" min="10" max="200" value="100">
                        <span id="thresholdValue">100</span>
                    </div>
                </div>

                <div class="control-group">
                    <h3>📐 输出设置</h3>
                    <div class="control-item">
                        <label for="outputFormat">输出格式:</label>
                        <select id="outputFormat">
                            <option value="svg">SVG</option>
                            <option value="pdf">PDF</option>
                            <option value="eps">EPS</option>
                        </select>
                    </div>
                    <div class="control-item">
                        <label for="outputSize">输出尺寸:</label>
                        <select id="outputSize">
                            <option value="original">原始尺寸</option>
                            <option value="small">小 (512px)</option>
                            <option value="medium">中 (1024px)</option>
                            <option value="large">大 (2048px)</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="preview-section">
                <div class="preview-box">
                    <h3>📷 原始图片</h3>
                    <div class="preview-container" id="originalPreview">
                        <div style="color: #999;">请先上传图片</div>
                    </div>
                </div>

                <div class="preview-box">
                    <h3>🎨 矢量预览</h3>
                    <div class="preview-container" id="vectorPreview">
                        <div style="color: #999;">矢量图将在这里显示</div>
                    </div>
                </div>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div>正在处理图片，请稍候...</div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary" id="convertBtn" disabled>
                    🔄 开始转换
                </button>
                <button class="btn btn-secondary" id="downloadBtn" disabled>
                    💾 下载
                </button>
                <button class="btn btn-secondary" id="resetBtn">
                    🔄 重新开始
                </button>
            </div>

            <!-- 页脚 -->
            <div class="footer">
                本工具使用AI编程实现，如有定制工具的需求可联系微信 <strong>L94026958</strong>
            </div>
        </div>
    </div>

    <!-- 添加jsPDF库用于PDF生成 -->
    <script src="https://unpkg.com/jspdf@latest/dist/jspdf.umd.min.js"></script>

    <script>
        class ImageToVectorConverter {
            constructor() {
                this.originalImage = null;
                this.vectorData = null;
                this.jsPDFLoaded = false;
                this.initializeElements();
                this.bindEvents();
                this.checkLibraries();
            }

            checkLibraries() {
                // 检查jsPDF库是否加载
                let attempts = 0;
                const maxAttempts = 50; // 最多等待5秒

                const checkjsPDF = () => {
                    attempts++;
                    // 检查多种可能的jsPDF访问方式
                    if (typeof window.jsPDF !== 'undefined' ||
                        typeof window.jspdf !== 'undefined' ||
                        (window.jspdf && window.jspdf.jsPDF)) {
                        this.jsPDFLoaded = true;
                        console.log('jsPDF库加载成功');
                        console.log('jsPDF对象:', window.jsPDF || window.jspdf);
                    } else if (attempts < maxAttempts) {
                        // 延迟检查，给库更多时间加载
                        setTimeout(checkjsPDF, 100);
                    } else {
                        console.warn('jsPDF库加载超时，PDF功能可能不可用');
                        console.log('当前window对象包含的jsPDF相关属性:', Object.keys(window).filter(key => key.toLowerCase().includes('pdf')));
                        this.jsPDFLoaded = false;
                    }
                };
                checkjsPDF();
            }

            initializeElements() {
                this.uploadArea = document.getElementById('uploadArea');
                this.fileInput = document.getElementById('fileInput');
                this.originalPreview = document.getElementById('originalPreview');
                this.vectorPreview = document.getElementById('vectorPreview');
                this.convertBtn = document.getElementById('convertBtn');
                this.downloadBtn = document.getElementById('downloadBtn');
                this.resetBtn = document.getElementById('resetBtn');
                this.loading = document.getElementById('loading');
                this.errorMessage = document.getElementById('errorMessage');
                this.successMessage = document.getElementById('successMessage');
                this.colorCount = document.getElementById('colorCount');
                this.colorCountValue = document.getElementById('colorCountValue');
                this.threshold = document.getElementById('threshold');
                this.thresholdValue = document.getElementById('thresholdValue');
            }

            bindEvents() {
                // 文件上传事件
                this.uploadArea.addEventListener('click', () => this.fileInput.click());
                this.fileInput.addEventListener('change', (e) => this.handleFileSelect(e));

                // 拖拽上传
                this.uploadArea.addEventListener('dragover', (e) => this.handleDragOver(e));
                this.uploadArea.addEventListener('dragleave', (e) => this.handleDragLeave(e));
                this.uploadArea.addEventListener('drop', (e) => this.handleDrop(e));

                // 按钮事件
                this.convertBtn.addEventListener('click', () => this.convertImage());
                this.downloadBtn.addEventListener('click', () => this.downloadVector());
                this.resetBtn.addEventListener('click', () => this.reset());

                // 滑块事件
                this.colorCount.addEventListener('input', (e) => {
                    this.colorCountValue.textContent = e.target.value;
                });

                this.threshold.addEventListener('input', (e) => {
                    this.thresholdValue.textContent = e.target.value;
                });
            }

            handleDragOver(e) {
                e.preventDefault();
                this.uploadArea.classList.add('dragover');
            }

            handleDragLeave(e) {
                e.preventDefault();
                this.uploadArea.classList.remove('dragover');
            }

            handleDrop(e) {
                e.preventDefault();
                this.uploadArea.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    this.processFile(files[0]);
                }
            }

            handleFileSelect(e) {
                const file = e.target.files[0];
                if (file) {
                    this.processFile(file);
                }
            }

            processFile(file) {
                // 验证文件
                if (!this.validateFile(file)) {
                    return;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    this.originalImage = new Image();
                    this.originalImage.onload = () => {
                        this.displayOriginalImage();
                        this.convertBtn.disabled = false;
                        this.showSuccess('图片上传成功！');
                    };
                    this.originalImage.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }

            validateFile(file) {
                const maxSize = 10 * 1024 * 1024; // 10MB
                const allowedTypes = ['image/jpeg', 'image/png', 'image/gif'];

                if (!allowedTypes.includes(file.type)) {
                    this.showError('请上传 JPG、PNG 或 GIF 格式的图片');
                    return false;
                }

                if (file.size > maxSize) {
                    this.showError('文件大小不能超过 10MB');
                    return false;
                }

                return true;
            }

            displayOriginalImage() {
                this.originalPreview.innerHTML = '';
                const img = document.createElement('img');
                img.src = this.originalImage.src;
                img.className = 'preview-image';
                this.originalPreview.appendChild(img);
            }

            async convertImage() {
                if (!this.originalImage) {
                    this.showError('请先上传图片');
                    return;
                }

                this.showLoading(true);
                this.convertBtn.disabled = true;

                try {
                    // 模拟矢量化处理
                    await this.simulateVectorization();
                    this.showSuccess('图片转换成功！');
                    this.downloadBtn.disabled = false;
                } catch (error) {
                    this.showError('转换失败：' + error.message);
                } finally {
                    this.showLoading(false);
                    this.convertBtn.disabled = false;
                }
            }

            async simulateVectorization() {
                return new Promise((resolve) => {
                    setTimeout(() => {
                        // 创建简化的SVG矢量图
                        this.createSimplifiedSVG();
                        resolve();
                    }, 2000);
                });
            }

            createSimplifiedSVG() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                canvas.width = this.originalImage.width;
                canvas.height = this.originalImage.height;

                ctx.drawImage(this.originalImage, 0, 0);

                // 创建简化的SVG
                const svg = this.generateSimplifiedSVG(canvas);
                this.vectorData = svg;
                this.displayVectorPreview(svg);
            }

            generateSimplifiedSVG(canvas) {
                const width = canvas.width;
                const height = canvas.height;
                const colorCount = parseInt(this.colorCount.value);

                // 简化的矢量化算法 - 创建色块效果
                let svg = `<svg width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg">`;

                const ctx = canvas.getContext('2d');
                const imageData = ctx.getImageData(0, 0, width, height);
                const data = imageData.data;

                // 简单的色彩量化和矩形生成
                const blockSize = Math.max(4, Math.floor(Math.min(width, height) / 50));

                for (let y = 0; y < height; y += blockSize) {
                    for (let x = 0; x < width; x += blockSize) {
                        const pixelIndex = (y * width + x) * 4;
                        const r = data[pixelIndex];
                        const g = data[pixelIndex + 1];
                        const b = data[pixelIndex + 2];
                        const a = data[pixelIndex + 3] / 255;

                        if (a > 0.1) {
                            const color = `rgb(${r},${g},${b})`;
                            svg += `<rect x="${x}" y="${y}" width="${blockSize}" height="${blockSize}" fill="${color}" opacity="${a}"/>`;
                        }
                    }
                }

                svg += '</svg>';
                return svg;
            }

            displayVectorPreview(svgData) {
                this.vectorPreview.innerHTML = svgData;
                const svgElement = this.vectorPreview.querySelector('svg');
                if (svgElement) {
                    svgElement.style.maxWidth = '100%';
                    svgElement.style.maxHeight = '280px';
                }
            }

            async downloadVector() {
                if (!this.vectorData) {
                    this.showError('没有可下载的矢量图');
                    return;
                }

                const format = document.getElementById('outputFormat').value;
                let blob, filename, mimeType;

                try {
                    switch (format) {
                        case 'svg':
                            blob = new Blob([this.vectorData], { type: 'image/svg+xml' });
                            filename = 'vector-image.svg';
                            break;

                        case 'pdf':
                            try {
                                const pdfData = await this.convertToPDF();
                                blob = new Blob([pdfData], { type: 'application/pdf' });
                                filename = 'vector-image.pdf';
                            } catch (error) {
                                console.warn('jsPDF转换失败，使用简单PDF生成:', error.message);
                                const simplePdfData = this.generateSimplePDF();
                                blob = new Blob([simplePdfData], { type: 'application/pdf' });
                                filename = 'vector-image.pdf';
                            }
                            break;

                        case 'eps':
                            const epsData = this.convertToEPS();
                            blob = new Blob([epsData], { type: 'application/postscript' });
                            filename = 'vector-image.eps';
                            break;

                        default:
                            throw new Error('不支持的格式');
                    }

                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);

                    this.showSuccess(`${format.toUpperCase()}文件下载成功！`);
                } catch (error) {
                    this.showError('下载失败：' + error.message);
                }
            }

            reset() {
                this.originalImage = null;
                this.vectorData = null;
                this.fileInput.value = '';
                this.originalPreview.innerHTML = '<div style="color: #999;">请先上传图片</div>';
                this.vectorPreview.innerHTML = '<div style="color: #999;">矢量图将在这里显示</div>';
                this.convertBtn.disabled = true;
                this.downloadBtn.disabled = true;
                this.hideMessages();
            }

            showLoading(show) {
                this.loading.style.display = show ? 'block' : 'none';
            }

            showError(message) {
                this.errorMessage.textContent = message;
                this.errorMessage.style.display = 'block';
                this.successMessage.style.display = 'none';
            }

            showSuccess(message) {
                this.successMessage.textContent = message;
                this.successMessage.style.display = 'block';
                this.errorMessage.style.display = 'none';
            }

            hideMessages() {
                this.errorMessage.style.display = 'none';
                this.successMessage.style.display = 'none';
            }

            async convertToPDF() {
                return new Promise((resolve, reject) => {
                    try {
                        // 等待jsPDF库加载完成
                        let attempts = 0;
                        const maxAttempts = 50; // 最多等待5秒

                        const waitForjsPDF = () => {
                            attempts++;
                            if (typeof window.jsPDF !== 'undefined' ||
                                typeof window.jspdf !== 'undefined' ||
                                (window.jspdf && window.jspdf.jsPDF)) {
                                this.generatePDF(resolve, reject);
                            } else if (attempts < maxAttempts) {
                                setTimeout(waitForjsPDF, 100);
                            } else {
                                // 如果库加载失败，提供备用方案
                                reject(new Error('PDF库加载失败，请刷新页面重试或选择SVG格式下载'));
                            }
                        };
                        waitForjsPDF();
                    } catch (error) {
                        reject(error);
                    }
                });
            }

            generatePDF(resolve, reject) {
                try {
                    // 创建jsPDF实例 - 支持多种访问方式
                    let jsPDF;
                    if (window.jsPDF) {
                        jsPDF = window.jsPDF.jsPDF || window.jsPDF;
                    } else if (window.jspdf) {
                        jsPDF = window.jspdf.jsPDF || window.jspdf;
                    } else {
                        throw new Error('无法找到jsPDF构造函数');
                    }

                    const pdf = new jsPDF();

                    // 获取图片尺寸
                    const imgWidth = this.originalImage.width;
                    const imgHeight = this.originalImage.height;

                    // 计算PDF页面尺寸（A4: 210x297mm）
                    const pageWidth = 210;
                    const pageHeight = 297;

                    // 计算缩放比例以适应页面
                    const scaleX = pageWidth / imgWidth;
                    const scaleY = pageHeight / imgHeight;
                    const scale = Math.min(scaleX, scaleY) * 0.8; // 留边距

                    const scaledWidth = imgWidth * scale;
                    const scaledHeight = imgHeight * scale;

                    // 居中位置
                    const x = (pageWidth - scaledWidth) / 2;
                    const y = (pageHeight - scaledHeight) / 2;

                    // 将SVG转换为图片然后添加到PDF
                    const svgBlob = new Blob([this.vectorData], { type: 'image/svg+xml;charset=utf-8' });
                    const url = URL.createObjectURL(svgBlob);

                    const img = new Image();
                    img.onload = () => {
                        try {
                            // 创建canvas来渲染SVG
                            const canvas = document.createElement('canvas');
                            const ctx = canvas.getContext('2d');
                            canvas.width = imgWidth;
                            canvas.height = imgHeight;

                            ctx.drawImage(img, 0, 0);
                            const imgData = canvas.toDataURL('image/png');

                            // 添加图片到PDF
                            pdf.addImage(imgData, 'PNG', x, y, scaledWidth, scaledHeight);

                            // 添加标题
                            pdf.setFontSize(16);
                            pdf.text('Vector Image', pageWidth / 2, 20, { align: 'center' });

                            const pdfOutput = pdf.output('arraybuffer');
                            URL.revokeObjectURL(url);
                            resolve(pdfOutput);
                        } catch (error) {
                            URL.revokeObjectURL(url);
                            reject(error);
                        }
                    };

                    img.onerror = () => {
                        URL.revokeObjectURL(url);
                        reject(new Error('无法加载SVG图像'));
                    };

                    img.src = url;

                } catch (error) {
                    reject(error);
                }
            }

            generateSimplePDF() {
                // 生成一个简单的PDF文件，包含SVG转换的图像
                const width = this.originalImage.width;
                const height = this.originalImage.height;

                // 简单的PDF结构
                const pdfContent = `%PDF-1.4

endobj

                return pdfContent;
            }

            convertToEPS() {
                try {
                    // EPS格式生成
                    const width = this.originalImage.width;
                    const height = this.originalImage.height;

                    let eps = `%!PS-Adobe-3.0 EPSF-3.0
%%BoundingBox: 0 0 ${width} ${height}
%%Creator: Image to Vector Converter
%%Title: Vector Image
%%CreationDate: ${new Date().toISOString()}
%%Pages: 1
%%DocumentData: Clean7Bit
%%LanguageLevel: 2
%%EndComments

%%BeginProlog
/rectfill {
    4 2 roll
    moveto
    1 index 0 rlineto
    0 exch rlineto
    neg 0 rlineto
    closepath
    fill
} def
%%EndProlog

%%Page: 1 1
gsave

% 设置坐标系
0 ${height} translate
1 -1 scale

% 开始图形
`;

                    // 解析SVG并转换为PostScript命令
                    const parser = new DOMParser();
                    const svgDoc = parser.parseFromString(this.vectorData, 'image/svg+xml');
                    const rects = svgDoc.querySelectorAll('rect');

                    if (rects.length === 0) {
                        throw new Error('SVG中没有找到可转换的图形元素');
                    }

                    rects.forEach(rect => {
                        const x = parseFloat(rect.getAttribute('x') || 0);
                        const y = parseFloat(rect.getAttribute('y') || 0);
                        const w = parseFloat(rect.getAttribute('width') || 0);
                        const h = parseFloat(rect.getAttribute('height') || 0);
                        const fill = rect.getAttribute('fill') || '#000000';
                        const opacity = parseFloat(rect.getAttribute('opacity') || 1);

                        // 跳过无效的矩形
                        if (w <= 0 || h <= 0) return;

                        // 转换颜色
                        const color = this.parseColor(fill);
                        if (color && opacity > 0) {
                            const r = (color.r / 255).toFixed(3);
                            const g = (color.g / 255).toFixed(3);
                            const b = (color.b / 255).toFixed(3);

                            // 处理透明度
                            if (opacity < 1) {
                                eps += `gsave
${opacity.toFixed(3)} setgray
${r} ${g} ${b} setrgbcolor
${x.toFixed(2)} ${y.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} rectfill
grestore
`;
                            } else {
                                eps += `${r} ${g} ${b} setrgbcolor
${x.toFixed(2)} ${y.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} rectfill
`;
                            }
                        }
                    });

                    eps += `
grestore
showpage
%%Trailer
%%EOF`;

                    return eps;
                } catch (error) {
                    console.error('EPS转换错误:', error);
                    throw new Error('EPS格式转换失败: ' + error.message);
                }
            }

            parseColor(colorStr) {
                if (!colorStr) return null;

                // 处理rgb()格式
                if (colorStr.startsWith('rgb(')) {
                    const match = colorStr.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
                    if (match) {
                        return {
                            r: parseInt(match[1]),
                            g: parseInt(match[2]),
                            b: parseInt(match[3])
                        };
                    }
                }

                // 处理rgba()格式
                if (colorStr.startsWith('rgba(')) {
                    const match = colorStr.match(/rgba\((\d+),\s*(\d+),\s*(\d+),\s*([\d.]+)\)/);
                    if (match) {
                        return {
                            r: parseInt(match[1]),
                            g: parseInt(match[2]),
                            b: parseInt(match[3]),
                            a: parseFloat(match[4])
                        };
                    }
                }

                // 处理十六进制格式
                const hexMatch = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(colorStr);
                if (hexMatch) {
                    return {
                        r: parseInt(hexMatch[1], 16),
                        g: parseInt(hexMatch[2], 16),
                        b: parseInt(hexMatch[3], 16)
                    };
                }

                // 处理CSS颜色名称
                const colorNames = {
                    'black': { r: 0, g: 0, b: 0 },
                    'white': { r: 255, g: 255, b: 255 },
                    'red': { r: 255, g: 0, b: 0 },
                    'green': { r: 0, g: 128, b: 0 },
                    'blue': { r: 0, g: 0, b: 255 },
                    'yellow': { r: 255, g: 255, b: 0 },
                    'cyan': { r: 0, g: 255, b: 255 },
                    'magenta': { r: 255, g: 0, b: 255 },
                    'gray': { r: 128, g: 128, b: 128 },
                    'grey': { r: 128, g: 128, b: 128 }
                };

                return colorNames[colorStr.toLowerCase()] || null;
            }

            // 保持向后兼容
            hexToRgb(hex) {
                return this.parseColor(hex);
            }
        }

        // 初始化应用
        document.addEventListener('DOMContentLoaded', () => {
            new ImageToVectorConverter();
        });
    </script>
