<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经典推箱子</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #5a9e5a;
            background-image: linear-gradient(to bottom, #5a9e5a, #3a6a3a);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            touch-action: manipulation;
            overflow: auto;
        }
        
        #game-container {
            position: relative;
            margin: 20px auto;
            text-align: center;
        }
        
        #game-board {
            background-color: #d4b483;
            border: 8px solid #4a3a2a;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
            image-rendering: pixelated;
        }
        
        #controls {
            margin: 15px 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        
        button {
            padding: 10px 20px;
            background-color: #4a3a2a;
            color: #d4b483;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            box-shadow: 0 3px 0 #2a2a2a;
            transition: all 0.1s;
        }
        
        button:hover {
            background-color: #5a4a3a;
        }
        
        button:active {
            transform: translateY(3px);
            box-shadow: none;
        }
        
        #level-info {
            margin: 15px 0;
            font-size: 20px;
            color: #fff;
            text-shadow: 2px 2px 2px #000;
            font-weight: bold;
        }
        
        #moves-count {
            margin: 10px 0;
            font-size: 18px;
            color: #ffeb3b;
            text-shadow: 1px 1px 1px #000;
        }
        
        #footer {
            margin: 20px 0;
            color: white;
            text-align: center;
            font-size: 14px;
            text-shadow: 1px 1px 1px #000;
            padding: 0 10px;
        }
        
        #footer a {
            color: #ffeb3b;
            text-decoration: none;
            font-weight: bold;
        }
        
        .game-title {
            color: #fff;
            text-shadow: 3px 3px 0 #4a3a2a;
            font-size: 36px;
            margin: 10px 0;
            font-weight: bold;
        }
        
        @media (max-width: 600px) {
            #game-board {
                width: 280px;
                height: 280px;
            }
            
            .game-title {
                font-size: 28px;
            }
            
            #controls {
                gap: 8px;
            }
            
            button {
                padding: 8px 16px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="game-title">经典推箱子</div>
    <div id="game-container">
        <canvas id="game-board"></canvas>
        <div id="level-info">第 <span id="current-level">1</span> 关 / 共 <span id="total-levels">100</span> 关</div>
        <div id="moves-count">移动步数: <span id="moves">0</span></div>
        <div id="controls">
            <button id="restart-btn">重新开始</button>
            <button id="prev-btn">上一关</button>
            <button id="next-btn">下一关</button>
            <button id="undo-btn">撤销</button>
        </div>
    </div>
    <div id="footer">
        本工具由兔子先生用deepseek开发，<br>
        技术支持：<a href="https://t.zsxq.com/y1934" target="_blank">https://t.zsxq.com/y1934</a>
    </div>

    <script>
        // 游戏配置
        const config = {
            colors: {
                wall: '#4a3a2a',
                floor: '#d4b483',
                player: '#3a7a3a',
                box: '#b45a3a',
                target: '#7a3a5a',
                boxOnTarget: '#5a3a7a',
                playerOnTarget: '#3a5a7a',
                outline: '#000000'
            },
            minBoxes: 1,
            maxBoxes: 8
        };
        
        // 固定关卡 (前10关)
        const fixedLevels = [
            // 第1关 - 基础教学
            [
                "#######",
                "#     #",
                "#  $  #",
                "#  @  #",
                "#  .  #",
                "#     #",
                "#######"
            ],
            // 第2关 - 简单
            [
                " ##### ",
                " #   # ",
                "## $ ##",
                "#  $  #",
                "# @ . #",
                "## . ##",
                " #   # ",
                " ##### "
            ],
            // 第3关 - 简单
            [
                "  #### ",
                "###  ##",
                "#  $  #",
                "# $@$ #",
                "#  $  #",
                "##  ###",
                " ####  "
            ],
            // 第4关 - 中等
            [
                " ##### ",
                " # . # ",
                "## $ ##",
                "#  $  #",
                "# @$ .#",
                "## $ ##",
                " # . # ",
                " ##### "
            ],
            // 第5关 - 中等
            [
                " ##### ",
                " #   # ",
                "##$ $##",
                "# .$. #",
                "# @ $ #",
                "##   ##",
                " #   # ",
                " ##### "
            ],
            // 第6关 - 中等
            [
                "#######",
                "#. . .#",
                "# $$$ #",
                "#  @  #",
                "#     #",
                "#######"
            ],
            // 第7关 - 较难
            [
                " ##### ",
                " # . # ",
                "## $ ##",
                "# $@$ #",
                "## $ ##",
                " # . # ",
                " ##### "
            ],
            // 第8关 - 较难
            [
                "#######",
                "#.   .#",
                "# $$  #",
                "#  $$ #",
                "#@   .#",
                "#######"
            ],
            // 第9关 - 困难
            [
                " ####### ",
                " #     # ",
                " # $$$ # ",
                "## $ $##",
                "#  $.  #",
                "#  @   #",
                "########"
            ],
            // 第10关 - 困难
            [
                "  ####  ",
                "###  ###",
                "#  $$  #",
                "# $  $ #",
                "#  @   #",
                "### .###",
                "  ####  "
            ]
        ];
        
        // 游戏状态
        let gameState = {
            currentLevel: 0,
            board: [],
            playerPos: { x: 0, y: 0 },
            targets: [],
            completed: false,
            moves: 0,
            history: []
        };
        
        // DOM元素
        const canvas = document.getElementById('game-board');
        const ctx = canvas.getContext('2d');
        const currentLevelSpan = document.getElementById('current-level');
        const totalLevelsSpan = document.getElementById('total-levels');
        const movesSpan = document.getElementById('moves');
        const restartBtn = document.getElementById('restart-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const undoBtn = document.getElementById('undo-btn');
        
        // 初始化游戏
        function initGame() {
            totalLevelsSpan.textContent = 100; // 总共100关
            resizeCanvas();
            loadLevel(gameState.currentLevel);
            drawGame();
            
            // 事件监听
            window.addEventListener('resize', resizeCanvas);
            document.addEventListener('keydown', handleKeyPress);
            restartBtn.addEventListener('click', () => loadLevel(gameState.currentLevel));
            prevBtn.addEventListener('click', prevLevel);
            nextBtn.addEventListener('click', nextLevel);
            undoBtn.addEventListener('click', undoMove);
            
            // 触摸控制
            setupTouchControls();
        }
        
        // 调整画布大小
        function resizeCanvas() {
            const size = Math.min(window.innerWidth - 40, window.innerHeight - 300, 500);
            canvas.width = size;
            canvas.height = size;
            drawGame();
        }
        
        // 加载关卡
        function loadLevel(levelIndex) {
            if (levelIndex < 0) levelIndex = 0;
            if (levelIndex >= 100) levelIndex = 99;
            
            gameState.currentLevel = levelIndex;
            currentLevelSpan.textContent = levelIndex + 1;
            gameState.moves = 0;
            movesSpan.textContent = gameState.moves;
            gameState.history = [];
            
            let level;
            if (levelIndex < fixedLevels.length) {
                // 使用固定关卡
                level = fixedLevels[levelIndex];
            } else {
                // 生成随机关卡
                level = generateRandomLevel();
            }
            
            gameState.board = [];
            gameState.targets = [];
            gameState.completed = false;
            
            for (let y = 0; y < level.length; y++) {
                const row = level[y];
                gameState.board[y] = [];
                
                for (let x = 0; x < row.length; x++) {
                    const cell = row[x];
                    gameState.board[y][x] = cell;
                    
                    if (cell === '@' || cell === '+') {
                        gameState.playerPos = { x, y };
                    }
                    
                    if (cell === '.' || cell === '+' || cell === '*') {
                        gameState.targets.push({ x, y });
                    }
                }
            }
            
            drawGame();
        }
        
        // 生成随机关卡
        function generateRandomLevel() {
            const width = 7 + Math.floor(Math.random() * 4); // 7-10宽度
            const height = 7 + Math.floor(Math.random() * 4); // 7-10高度
            
            // 确定箱子数量 (1-8个)
            const boxCount = Math.min(
                Math.max(config.minBoxes, Math.floor(Math.random() * config.maxBoxes) + 1),
                Math.floor((width-2) * (height-2) / 3) // 不超过可用空间的1/3
            );
            
            // 初始化空地图 (全是墙)
            let level = [];
            for (let y = 0; y < height; y++) {
                level[y] = [];
                for (let x = 0; x < width; x++) {
                    level[y][x] = '#';
                }
            }
            
            // 挖空中心区域
            for (let y = 1; y < height-1; y++) {
                for (let x = 1; x < width-1; x++) {
                    level[y][x] = ' ';
                }
            }
            
            // 放置玩家 (随机位置)
            let px = 1 + Math.floor(Math.random() * (width-2));
            let py = 1 + Math.floor(Math.random() * (height-2));
            level[py][px] = '@';
            gameState.playerPos = { x: px, y: py };
            
            // 放置目标点 (随机位置，不与玩家重叠)
            for (let i = 0; i < boxCount; i++) {
                let tx, ty;
                do {
                    tx = 1 + Math.floor(Math.random() * (width-2));
                    ty = 1 + Math.floor(Math.random() * (height-2));
                } while ((tx === px && ty === py) || level[ty][tx] === '.');
                
                level[ty][tx] = '.';
                gameState.targets.push({ x: tx, y: ty });
            }
            
            // 放置箱子 (随机位置，不与玩家或目标点重叠)
            for (let i = 0; i < boxCount; i++) {
                let bx, by;
                do {
                    bx = 1 + Math.floor(Math.random() * (width-2));
                    by = 1 + Math.floor(Math.random() * (height-2));
                } while (
                    (bx === px && by === py) || 
                    level[by][bx] === '$' || 
                    level[by][bx] === '.'
                );
                
                level[by][bx] = '$';
            }
            
            // 随机添加一些墙 (增加复杂度)
            const wallCount = Math.floor((width * height) / 10);
            for (let i = 0; i < wallCount; i++) {
                const wx = 1 + Math.floor(Math.random() * (width-2));
                const wy = 1 + Math.floor(Math.random() * (height-2));
                
                if (level[wy][wx] === ' ') {
                    level[wy][wx] = '#';
                }
            }
            
            return level;
        }
        
        // 绘制游戏
        function drawGame() {
            if (!gameState.board.length) return;
            
            const rows = gameState.board.length;
            const cols = gameState.board[0].length;
            const tileSize = Math.min(
                canvas.width / cols,
                canvas.height / rows
            );
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 计算偏移使游戏居中
            const offsetX = (canvas.width - cols * tileSize) / 2;
            const offsetY = (canvas.height - rows * tileSize) / 2;
            
            // 绘制背景
            ctx.fillStyle = '#5a9e5a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制游戏区域背景
            ctx.fillStyle = config.colors.floor;
            ctx.fillRect(offsetX, offsetY, cols * tileSize, rows * tileSize);
            
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const cell = gameState.board[y][x];
                    const px = x * tileSize + offsetX;
                    const py = y * tileSize + offsetY;
                    
                    // 绘制其他元素
                    switch (cell) {
                        case '#': // 墙
                            drawWall(px, py, tileSize);
                            break;
                        case '@': // 玩家
                            drawPlayer(px, py, tileSize, false);
                            break;
                        case '+': // 站在目标点上的玩家
                            drawPlayer(px, py, tileSize, true);
                            break;
                        case '$': // 箱子
                            drawBox(px, py, tileSize, false);
                            break;
                        case '*': // 在目标点上的箱子
                            drawBox(px, py, tileSize, true);
                            break;
                        case '.': // 目标点
                            drawTarget(px, py, tileSize);
                            break;
                    }
                }
            }
        }
        
        // 绘制墙
        function drawWall(x, y, size) {
            // 墙主体
            ctx.fillStyle = config.colors.wall;
            ctx.fillRect(x, y, size, size);
            
            // 墙砖细节
            ctx.strokeStyle = config.colors.outline;
            ctx.lineWidth = 1;
            ctx.strokeRect(x, y, size, size);
            
            // 砖块纹理
            ctx.fillStyle = '#3a2a1a';
            for (let i = 0; i < size; i += 4) {
                for (let j = 0; j < size; j += 4) {
                    if ((i + j) % 8 === 0) {
                        ctx.fillRect(x + i, y + j, 2, 2);
                    }
                }
            }
        }
        
        // 绘制玩家
        function drawPlayer(x, y, size, onTarget) {
            // 如果有目标点，先绘制目标点
            if (onTarget) {
                drawTarget(x, y, size);
            }
            
            // 玩家身体
            ctx.fillStyle = onTarget ? config.colors.playerOnTarget : config.colors.player;
            ctx.beginPath();
            ctx.arc(x + size/2, y + size/2, size/2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = config.colors.outline;
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // 玩家眼睛
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(x + size/2 - size/6, y + size/3, size/8, 0, Math.PI * 2);
            ctx.arc(x + size/2 + size/6, y + size/3, size/8, 0, Math.PI * 2);
            ctx.fill();
            
            // 眼睛瞳孔
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(x + size/2 - size/6, y + size/3, size/12, 0, Math.PI * 2);
            ctx.arc(x + size/2 + size/6, y + size/3, size/12, 0, Math.PI * 2);
            ctx.fill();
            
            // 玩家嘴巴 (微笑)
            ctx.strokeStyle = config.colors.outline;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(x + size/2, y + size/2, size/4, 0.2 * Math.PI, 0.8 * Math.PI);
            ctx.stroke();
        }
        
        // 绘制箱子
        function drawBox(x, y, size, onTarget) {
            // 如果有目标点，先绘制目标点
            if (onTarget) {
                drawTarget(x, y, size);
            }
            
            // 箱子主体
            ctx.fillStyle = onTarget ? config.colors.boxOnTarget : config.colors.box;
            ctx.fillRect(x + size/5, y + size/5, size * 3/5, size * 3/5);
            
            // 箱子边缘
            ctx.strokeStyle = config.colors.outline;
            ctx.lineWidth = 3;
            ctx.strokeRect(x + size/5, y + size/5, size * 3/5, size * 3/5);
            
            // 箱子带子
            ctx.fillStyle = '#8a4a2a';
            ctx.fillRect(x + size/5, y + size/2 - size/10, size * 3/5, size/5);
            
            // 箱子带子细节
            ctx.strokeStyle = config.colors.outline;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x + size/5, y + size/2 - size/10);
            ctx.lineTo(x + size * 4/5, y + size/2 - size/10);
            ctx.moveTo(x + size/5, y + size/2 + size/10);
            ctx.lineTo(x + size * 4/5, y + size/2 + size/10);
            ctx.stroke();
        }
        
        // 绘制目标点
        function drawTarget(x, y, size) {
            ctx.fillStyle = config.colors.target;
            ctx.beginPath();
            ctx.arc(x + size/2, y + size/2, size/4, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = config.colors.outline;
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // 目标点中心
            ctx.fillStyle = '#9a4a7a';
            ctx.beginPath();
            ctx.arc(x + size/2, y + size/2, size/8, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // 处理键盘输入
        function handleKeyPress(e) {
            if (gameState.completed) return;
            
            let dx = 0, dy = 0;
            
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    dy = -1;
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    dy = 1;
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    dx = -1;
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    dx = 1;
                    break;
                case 'z':
                case 'Z':
                    undoMove();
                    return;
                default:
                    return;
            }
            
            e.preventDefault();
            movePlayer(dx, dy);
        }
        
        // 移动玩家
        function movePlayer(dx, dy) {
            const { x, y } = gameState.playerPos;
            const newX = x + dx;
            const newY = y + dy;
            
            // 检查边界
            if (newY < 0 || newY >= gameState.board.length || 
                newX < 0 || newX >= gameState.board[newY].length) {
                return;
            }
            
            const cell = gameState.board[newY][newX];
            
            // 保存当前状态到历史记录 (用于撤销)
            saveState();
            
            // 移动到空地或目标点
            if (cell === ' ' || cell === '.') {
                updatePlayerPosition(x, y, newX, newY);
                gameState.moves++;
                movesSpan.textContent = gameState.moves;
            } 
            // 移动到箱子旁边，尝试推动箱子
            else if (cell === '$' || cell === '*') {
                const boxNewX = newX + dx;
                const boxNewY = newY + dy;
                
                // 检查箱子是否可以推动
                if (boxNewY >= 0 && boxNewY < gameState.board.length && 
                    boxNewX >= 0 && boxNewX < gameState.board[boxNewY].length) {
                    
                    const nextCell = gameState.board[boxNewY][boxNewX];
                    
                    if (nextCell === ' ' || nextCell === '.') {
                        // 移动箱子和玩家
                        moveBox(newX, newY, boxNewX, boxNewY);
                        updatePlayerPosition(x, y, newX, newY);
                        gameState.moves++;
                        movesSpan.textContent = gameState.moves;
                    }
                }
            }
            
            checkLevelCompletion();
            drawGame();
        }
        
        // 保存当前状态 (用于撤销)
        function saveState() {
            // 只保存最近的20步
            if (gameState.history.length >= 20) {
                gameState.history.shift();
            }
            
            // 深拷贝当前状态
            const stateCopy = {
                board: JSON.parse(JSON.stringify(gameState.board)),
                playerPos: {...gameState.playerPos},
                moves: gameState.moves
            };
            
            gameState.history.push(stateCopy);
        }
        
        // 撤销上一步
        function undoMove() {
            if (gameState.history.length === 0) return;
            
            const lastState = gameState.history.pop();
            gameState.board = lastState.board;
            gameState.playerPos = lastState.playerPos;
            gameState.moves = lastState.moves;
            gameState.completed = false;
            
            movesSpan.textContent = gameState.moves;
            drawGame();
        }
        
        // 更新玩家位置
        function updatePlayerPosition(oldX, oldY, newX, newY) {
            const oldCell = gameState.board[oldY][oldX];
            const newCell = gameState.board[newY][newX];
            
            // 更新旧位置
            if (oldCell === '@') {
                gameState.board[oldY][oldX] = ' ';
            } else if (oldCell === '+') {
                gameState.board[oldY][oldX] = '.';
            }
            
            // 更新新位置
            if (newCell === ' ') {
                gameState.board[newY][newX] = '@';
            } else if (newCell === '.') {
                gameState.board[newY][newX] = '+';
            }
            
            gameState.playerPos = { x: newX, y: newY };
        }
        
        // 移动箱子
        function moveBox(oldX, oldY, newX, newY) {
            const oldCell = gameState.board[oldY][oldX];
            const newCell = gameState.board[newY][newX];
            
            // 更新旧位置
            if (oldCell === '$') {
                gameState.board[oldY][oldX] = ' ';
            } else if (oldCell === '*') {
                gameState.board[oldY][oldX] = '.';
            }
            
            // 更新新位置
            if (newCell === ' ') {
                gameState.board[newY][newX] = '$';
            } else if (newCell === '.') {
                gameState.board[newY][newX] = '*';
            }
        }
        
        // 检查关卡是否完成
        function checkLevelCompletion() {
            for (const target of gameState.targets) {
                const cell = gameState.board[target.y][target.x];
                if (cell !== '*' && cell !== '+') {
                    gameState.completed = false;
                    return;
                }
            }
            
            gameState.completed = true;
            setTimeout(() => {
                if (gameState.currentLevel < 99) {
                    if (confirm(`恭喜完成第${gameState.currentLevel + 1}关！用时${gameState.moves}步。是否进入下一关？`)) {
                        nextLevel();
                    }
                } else {
                    alert(`恭喜你完成了所有100关！最后一关用时${gameState.moves}步。`);
                }
            }, 100);
        }
        
        // 上一关
        function prevLevel() {
            if (gameState.currentLevel > 0) {
                loadLevel(gameState.currentLevel - 1);
            }
        }
        
        // 下一关
        function nextLevel() {
            if (gameState.currentLevel < 99) {
                loadLevel(gameState.currentLevel + 1);
            }
        }
        
        // 设置触摸控制
        function setupTouchControls() {
            let touchStartX = 0;
            let touchStartY = 0;
            let touchMoved = false;
            
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                touchMoved = false;
                const touch = e.touches[0];
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;
            }, { passive: false });
            
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                touchMoved = true;
            }, { passive: false });
            
            canvas.addEventListener('touchend', (e) => {
                e.preventDefault();
                if (!e.changedTouches[0] || touchMoved) return;
                
                // 处理点击 (用于触摸设备上的撤销)
                undoMove();
            }, { passive: false });
            
            canvas.addEventListener('touchcancel', (e) => {
                e.preventDefault();
                if (!e.changedTouches[0]) return;
                
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;
                
                const dx = touchEndX - touchStartX;
                const dy = touchEndY - touchStartY;
                
                // 确定滑动方向
                if (Math.abs(dx) > Math.abs(dy)) {
                    // 水平滑动
                    if (dx > 30) movePlayer(1, 0);  // 向右
                    else if (dx < -30) movePlayer(-1, 0); // 向左
                } else {
                    // 垂直滑动
                    if (dy > 30) movePlayer(0, 1);  // 向下
                    else if (dy < -30) movePlayer(0, -1); // 向上
                }
            }, { passive: false });
        }
        
        // 启动游戏
        window.onload = initGame;
    </script>
</body>
