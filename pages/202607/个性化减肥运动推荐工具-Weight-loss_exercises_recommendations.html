<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个性化减肥运动推荐工具</title>
    <style>
        /* CSS样式部分：负责页面的美化和响应式布局 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            background-color: #f4f7f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        /* 作者信息样式 */
        .author-info {
            font-size: 14px;
            color: #888;
            margin-bottom: 20px;
            text-align: left;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="number"], select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
        }
        .full-width {
            grid-column: 1 / -1;
        }
        /* 复选框组样式 */
        #condition-type-checkboxes {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #fafafa;
        }
        #condition-type-checkboxes .checkbox-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        #condition-type-checkboxes .checkbox-item:last-child {
            margin-bottom: 0;
        }
        #condition-type-checkboxes input[type="checkbox"] {
            width: auto; /* 覆盖通用input样式 */
            margin-right: 10px;
            transform: scale(1.2); /* 让勾选框稍大一些 */
        }
        #condition-type-checkboxes label {
            font-weight: normal; /* 复选框的标签不需要加粗 */
            margin-bottom: 0;
        }
        .btn {
            grid-column: 1 / -1;
            padding: 12px 20px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #3498db, #2980b9);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 15px;
        }
        .btn:hover {
            background: linear-gradient(45deg, #2980b9, #3498db);
        }
        #results {
            margin-top: 30px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            display: none; /* 默认隐藏 */
        }
        #results h2 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        #results h3 {
            color: #2980b9;
            margin-top: 20px;
        }
        #results ul {
            list-style-type: disc;
            padding-left: 20px;
        }
        #results li {
            margin-bottom: 10px;
        }
        .warning {
            background-color: #fff3cd;
            color: #856404;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #ffeeba;
            margin-bottom: 20px;
        }
        /* 响应式布局 */
        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .container {
                padding: 20px 15px;
            }
            h1 {
                font-size: 24px;
            }
            .author-info {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="author-info">作者：acid5 | 合作邮箱：<a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="0230373330353232333b4273732c616d6f">[email&#160;protected]</a></div>
        <h1>个性化减肥运动推荐工具</h1>
        <form id="fitness-form">
            <div class="form-grid">
                <div class="form-group">
                    <label for="age">年龄 (岁)</label>
                    <input type="number" id="age" required min="12" max="99">
                </div>
                <div class="form-group">
                    <label for="gender">性别</label>
                    <select id="gender" required>
                        <option value="male">男</option>
                        <option value="female">女</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="height">身高 (cm)</label>
                    <input type="number" id="height" required min="100" max="250">
                </div>
                <div class="form-group">
                    <label for="weight">当前体重 (kg)</label>
                    <input type="number" id="weight" required min="30" max="300">
                </div>
                <div class="form-group">
                    <label for="waist">腰围 (cm)</label>
                    <input type="number" id="waist" required min="40" max="250">
                </div>
                <div class="form-group">
                    <label for="hip">臀围 (cm)</label>
                    <input type="number" id="hip" required min="40" max="250">
                </div>
                <div class="form-group">
                    <label for="target-weight-loss">预期减重量 (kg)</label>
                    <input type="number" id="target-weight-loss" required min="1">
                </div>
                <div class="form-group">
                    <label for="timeframe">计划用时 (周)</label>
                    <input type="number" id="timeframe" required min="1">
                </div>
                <div class="form-group full-width">
                    <label for="condition">是否有基础病？</label>
                    <select id="condition" onchange="toggleConditionType(this.value)">
                        <option value="none">无</option>
                        <option value="yes">有</option>
                    </select>
                </div>
                <div class="form-group full-width" id="condition-type-group" style="display: none;">
                    <label>请勾选您的基础病类型：</label>
                    <div id="condition-type-checkboxes">
                        <div class="checkbox-item">
                            <input type="checkbox" id="cond-arthritis" value="arthritis">
                            <label for="cond-arthritis">关节问题 (如关节炎、半月板损伤)</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="cond-hypertension" value="hypertension">
                            <label for="cond-hypertension">心血管疾病 (如高血压、冠心病)</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="cond-diabetes" value="diabetes">
                            <label for="cond-diabetes">代谢性疾病 (如糖尿病)</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="cond-respiratory" value="respiratory">
                            <label for="cond-respiratory">呼吸系统疾病 (如哮喘)</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="cond-other" value="other">
                            <label for="cond-other">其他（请咨询医生）</label>
                        </div>
                    </div>
                </div>
                <button type="button" class="btn" onclick="generateRecommendation()">生成我的专属运动建议</button>
            </div>
        </form>
        <div id="results"></div>
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // JavaScript部分：负责数据处理、逻辑判断和结果生成

        function toggleConditionType(value) {
            const conditionTypeGroup = document.getElementById('condition-type-group');
            conditionTypeGroup.style.display = (value === 'yes') ? 'block' : 'none';
        }

        function generateRecommendation() {
            // 1. 获取所有输入值
            const age = parseInt(document.getElementById('age').value);
            const gender = document.getElementById('gender').value;
            const height = parseInt(document.getElementById('height').value);
            const weight = parseFloat(document.getElementById('weight').value);
            const waist = parseFloat(document.getElementById('waist').value);
            const hip = parseFloat(document.getElementById('hip').value);
            const targetLoss = parseFloat(document.getElementById('target-weight-loss').value);
            const timeframe = parseInt(document.getElementById('timeframe').value);
            const hasCondition = document.getElementById('condition').value === 'yes';
            
            // 从复选框获取已勾选的基础病
            let conditions = [];
            if (hasCondition) {
                const checkedBoxes = document.querySelectorAll('#condition-type-checkboxes input[type="checkbox"]:checked');
                conditions = Array.from(checkedBoxes).map(cb => cb.value);
            }

            // 2. 输入验证
            if (!age || !height || !weight || !waist || !hip || !targetLoss || !timeframe) {
                alert('请填写所有必填项！');
                return;
            }

            // 3. 计算核心指标
            const heightInMeters = height / 100;
            const bmi = weight / (heightInMeters * heightInMeters);
            const whr = waist / hip; // 腰臀比

            // 4. 分析减重目标合理性
            let weeklyLossRate = targetLoss / timeframe;
            let goalWarning = '';
            let safeTimeframe = timeframe;

            if (weeklyLossRate > 1.5) {
                goalWarning = `<div class="warning"><strong>温馨提示：</strong>您设定的减重目标 (${timeframe}周内减掉${targetLoss}公斤) 非常具有挑战性，平均每周需减重 ${weeklyLossRate.toFixed(2)} 公斤。为了您的健康和减肥效果的可持续性，我们强烈建议将目标调整为每周减重0.5-1公斤。过快的减重可能导致肌肉流失、营养不良，且极易反弹。我们已根据更健康的减重速率为您重新规划了时间。</div>`;
                safeTimeframe = Math.ceil(targetLoss / 0.75);
            } else if (weeklyLossRate > 1.0) {
                 goalWarning = `<div class="warning"><strong>温馨提示：</strong>您设定的减重目标 (${timeframe}周内减掉${targetLoss}公斤) 颇具挑战性，平均每周需减重 ${weeklyLossRate.toFixed(2)} 公斤。请务必保证充足的营养和休息，密切关注身体反应。</div>`;
                 safeTimeframe = Math.ceil(targetLoss / 1.0);
            } else {
                safeTimeframe = Math.ceil(targetLoss / (weeklyLossRate > 0 ? weeklyLossRate : 0.5)); // 防止除以0
            }


            // 5. 构建推荐逻辑
            let exerciseRecommendations = [];
            let mainAdvice = '';
            let intensity = '中等强度';

            let cardio = ['快走', '慢跑', '骑自行车', '游泳', '椭圆机'];
            let strength = ['深蹲', '弓步蹲', '俯卧撑 (或跪姿)', '平板支撑', '划船机'];

            if (conditions.includes('arthritis')) {
                mainAdvice += '考虑到您的关节问题，我们优先推荐低冲击性的有氧运动，避免跑跳。';
                cardio = ['游泳', '水中漫步', '固定自行车', '椭圆机'];
                strength = ['弹力带训练', '坐姿腿举', '核心力量训练 (如平板支撑)'];
                intensity = '中低强度';
            }
            if (conditions.includes('hypertension')) {
                mainAdvice += '考虑到您的心血管状况，建议进行持续、中等强度的有氧运动，避免突然发力或强度过高的间歇训练。运动前后务必充分热身和放松。';
                cardio = ['快走', '太极拳', '慢速游泳', '固定自行车'];
                strength = ['小重量、多次数的器械训练', '弹力带训练'];
                intensity = '中等强度，并时刻关注心率';
            }
            if (conditions.includes('diabetes')) {
                mainAdvice += '规律的运动对控制血糖非常有益。我们推荐有氧运动和力量训练相结合，以提高胰岛素敏感性。';
            }
            if (conditions.includes('respiratory')) {
                 mainAdvice += '考虑到您的呼吸系统状况，请选择环境通风的场所运动，避免雾霾天外出。运动强度应循序渐进，感觉不适立刻停止。';
                 intensity = '中低强度';
            }

            if (bmi >= 28) {
                mainAdvice += `您的BMI指数(${bmi.toFixed(1)})较高，初期应以低冲击运动为主，保护膝关节。`;
                if (!conditions.includes('arthritis')) {
                    cardio.unshift('快走', '游泳');
                }
            }
            if (age > 55) {
                mainAdvice += '随着年龄增长，力量和平衡能力的训练尤为重要，有助于预防肌肉流失和跌倒。';
                strength.unshift('太极拳', '瑜伽', '坐姿起身训练');
                if(!conditions.includes('hypertension')) cardio.unshift('广场舞');
            }

            // 6. 生成结果HTML
            let resultHTML = `
                ${goalWarning}
                <h2>您的个性化运动建议报告</h2>
                
                <h3>一、 综合健康评估</h3>
                <ul>
                    <li><strong>BMI (身体质量指数):</strong> ${bmi.toFixed(1)} (世界卫生组织标准：18.5-24.9为正常，25-29.9为超重，30及以上为肥胖)</li>
                    <li><strong>腰臀比 (WHR):</strong> ${whr.toFixed(2)} (男性 > 0.9 或 女性 > 0.85 通常提示腹部脂肪堆积较多，为中心性肥胖)</li>
                    <li><strong>核心建议:</strong> ${mainAdvice || '我们建议您采用有氧运动和力量训练相结合的方式，以达到最佳的减脂和塑形效果。'}</li>
                </ul>

                <h3>二、 推荐运动方式</h3>
                <p>我们为您精心挑选了以下几种运动，您可以根据兴趣和实际条件选择2-3种交替进行：</p>
                <ul>
                    <li><strong>主要有氧运动 (减脂核心):</strong> ${[...new Set(cardio)].slice(0, 3).join('、')}。有氧运动是消耗热量的主要方式。</li>
                    <li><strong>主要力量训练 (塑形增肌):</strong> ${[...new Set(strength)].slice(0, 3).join('、')}。力量训练可以增加肌肉量，提高基础代谢，让您在不运动时也能消耗更多热量。</li>
                </ul>

                <h3>三、 运动量与时间建议</h3>
                <ul>
                    <li><strong>运动频率:</strong> 建议每周运动 <strong>4-5天</strong>。</li>
                    <li><strong>每次时长:</strong> 每次总运动时间 <strong>45-60分钟</strong>。包括：
                        <ul>
                            <li>热身 (5-10分钟): 如动态拉伸、原地小跑。</li>
                            <li>有氧运动 (30-40分钟): 保持在${intensity}，感觉心跳加快、微微出汗但仍能交谈的程度。</li>
                            <li>力量训练 (10-15分钟): 选择2-3个动作，每个动作做3组，每组12-15次。</li>
                            <li>拉伸放松 (5分钟): 对主要锻炼的肌群进行静态拉伸。</li>
                        </ul>
                    </li>
                    <li><strong>建议运动时段:</strong>
                        <p>运动的最佳时间因人而异，关键在于<strong>坚持</strong>。您可以选择：</p>
                        <ul>
                            <li><strong>早晨:</strong> 开启一天的新陈代谢，精力充沛。</li>
                            <li><strong>下午:</strong> 身体机能和体温处于高峰，运动表现可能更好。</li>
                            <li><strong>傍晚:</strong> 有助于释放一天的工作压力，但睡前1-2小时不宜剧烈运动。</li>
                        </ul>
                    </li>
                    <li><strong>预计达成目标总时长:</strong> 根据健康的减重速率，您大约需要坚持 <strong>${safeTimeframe} 周</strong> 来实现减重 ${targetLoss} 公斤的目标。请记住，这是一个持续的过程，健康的生活方式才是最终目的。</li>
                </ul>

                <h3>四、 重要提示</h3>
                <ul>
                    <li><strong>循序渐进:</strong> 如果您久未运动，请从较低的强度和较短的时间开始，让身体逐步适应。</li>
                    <li><strong>聆听身体:</strong> 运动过程中如有任何不适（如关节疼痛、头晕、胸闷），请立即停止并休息。如有需要请咨询医生。</li>
                    <li><strong>饮食结合:</strong> “三分练，七分吃”，合理的饮食控制是减肥成功的关键。请保证营养均衡，适当控制总热量摄入。</li>
                    <li><strong>保持水分:</strong> 运动前后及过程中要及时补充水分。</li>
                </ul>
            `;

            // 7. 显示结果
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = resultHTML;
            resultsDiv.style.display = 'block';
            resultsDiv.scrollIntoView({ behavior: 'smooth' });
        }
    </script>

</body>
</html>
