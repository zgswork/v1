<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>翻页时钟</title>
  <style>
    /* 基础与主题 */
    :root {
      --bg: #121314;
      --card: #2a2d31;
      --card-dark: #222528;
      --text: #ffffff;
      --muted: #8a8f98;
      --accent: #3a3f45;
      --shadow: rgba(0, 0, 0, 0.55);
      --gloss: rgba(255, 255, 255, 0.06);
      --gap: clamp(8px, 2.2vw, 18px);
      --radius: clamp(10px, 1.8vw, 16px);
      --digit-w: clamp(68px, 12vw, 160px);
      --digit-h: calc(var(--digit-w) * 1.25);
      --font-big: clamp(36px, 10vw, 120px);
      --font-label: clamp(10px, 1.8vw, 16px);
      --colon-size: clamp(18px, 6vw, 40px);
      --flip-duration: 600ms;
      --persp: 1200px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }

    .page {
      min-height: 100dvh;
      padding: clamp(10px, 2.5vw, 24px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: var(--gap);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .title {
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text);
      opacity: 0.9;
    }
    .meta {
      color: var(--muted);
      font-size: 12px;
      opacity: 0.8;
    }
    /* 手机版横屏按钮 */
    .landscape-btn {
      appearance: none;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 12px;
      opacity: 0.85;
      cursor: pointer;
    }
    @media (min-width: 561px) { .landscape-btn { display: none; } }
    /* 全屏按钮（所有设备可见） */
    .fullscreen-btn {
      appearance: none;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 12px;
      opacity: 0.85;
      cursor: pointer;
      margin-left: 8px;
    }

    .clock {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--gap);
      perspective: var(--persp);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      flex-wrap: nowrap;
    }

    /* 单个数字卡片 */
    .digit {
      position: relative;
      width: var(--digit-w);
      height: var(--digit-h);
      border-radius: var(--radius);
      box-shadow: 0 18px 30px var(--shadow);
      background: linear-gradient(180deg, var(--card) 0%, var(--card-dark) 100%);
      overflow: hidden;
      transform-style: preserve-3d;
    }

    /* 上下静态半片 */
    .card-top, .card-bottom {
      position: absolute;
      left: 0; right: 0;
      height: 50%;
      display: grid;
      place-items: center;
      overflow: hidden;
      backface-visibility: hidden;
    }
    .card-top {
      top: 0;
      border-bottom: 1px solid #0008;
      background: linear-gradient(180deg, rgba(255,255,255,0.065), rgba(0,0,0,0.08));
    }
    .card-bottom {
      bottom: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.06), rgba(255,255,255,0.04));
    }
    .value {
      font-weight: 800;
      font-size: var(--font-big);
      line-height: 1;
      color: var(--text);
      text-shadow: 0 2px 0 #0008;
      font-variant-numeric: tabular-nums lining-nums;
    }

    /* 让上半片只显示数字的上半部分、下半片只显示下半部分 */
    .card-top .value, .flip-top .value {
      position: absolute;
      left: 0; right: 0; top: 0;
      height: var(--digit-h);
      display: grid; place-items: center;
    }
    .card-bottom .value, .flip-bottom .value {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: var(--digit-h);
      display: grid; place-items: center;
    }

    /* 翻页动画层（动态） */
    .flip-top, .flip-bottom {
      position: absolute;
      left: 0; right: 0;
      height: 50%;
      display: grid;
      place-items: center;
      overflow: hidden;
      transform-origin: center bottom;
      backface-visibility: hidden;
      background: inherit;
    }
    .flip-top { top: 0; z-index: 3; transform: rotateX(-90deg); pointer-events: none; }
    .flip-bottom { bottom: 0; transform-origin: center top; z-index: 2; transform: rotateX(90deg); pointer-events: none; }

    .card-top { z-index: 1; }
    .card-bottom { z-index: 1; }

    /* 光泽与分割线 */
    .digit::before {
      content: "";
      position: absolute; left: 0; right: 0; top: 48.9%; height: 1px;
      background: #000a;
      z-index: 2;
    }
    .digit::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(180deg, var(--gloss), transparent 35%);
      pointer-events: none;
    }

    /* 触发动画时的关键帧（分两阶段） */
    .digit.animate-top .flip-top {
      animation: flipTop calc(var(--flip-duration) / 2) ease-in forwards;
    }
    .digit.animate-bottom .flip-bottom {
      animation: flipBottom calc(var(--flip-duration) / 2) ease-out forwards;
    }
    @keyframes flipTop {
      0%   { transform: rotateX(0deg); }
      100% { transform: rotateX(-90deg); }
    }
    @keyframes flipBottom {
      0%   { transform: rotateX(90deg); }
      100% { transform: rotateX(0deg); }
    }

    /* 冒号 */
    .colon {
      width: clamp(12px, 3vw, 20px);
      text-align: center;
      font-size: var(--colon-size);
      font-weight: 700;
      color: #fff9;
      margin: 0 clamp(2px, 1vw, 6px);
      display: grid;
      place-items: center;
    }

    /* 分组标签：两列网格，标签占据第二行整行，实现两位数字横排 */
    .group {
      display: grid;
      grid-template-columns: auto auto;
      grid-template-rows: auto auto;
      align-items: center;
      justify-items: center;
      gap: clamp(6px, 1.4vw, 10px);
    }
    .label {
      color: var(--muted);
      font-size: var(--font-label);
      letter-spacing: 0.12em;
    }
    .group .label { grid-column: 1 / span 2; }

    /* 页脚 */
    .footer {
      display: flex; align-items: center; justify-content: center;
      color: var(--muted);
      font-size: 12px;
    }

    /* 小屏优化：自动压缩间距 */
    @media (max-width: 560px) {
      :root { --gap: clamp(6px, 2.4vw, 12px); }
      .meta { display: none; }
    }
    /* 降级方案：不支持锁定时旋转整页，模拟横屏 */
    body.force-landscape { overflow: hidden; }
    body.force-landscape .page {
      position: fixed;
      left: 50%; top: 50%;
      width: 100dvh; height: 100dvw;
      transform: translate(-50%, -50%) rotate(90deg);
      transform-origin: center;
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="title">翻页时钟</div>
      <div class="meta" id="dateMeta"></div>
      <button class="landscape-btn" id="landscapeBtn" title="横屏显示">横屏</button>
      <button class="fullscreen-btn" id="fullscreenBtn" title="全屏显示">全屏</button>
    </header>

    <section class="clock" id="clock">
      <!-- 小时 -->
      <div class="group">
        <div class="digit" data-role="h1">
          <div class="card-top"><span class="value">0</span></div>
          <div class="card-bottom"><span class="value">0</span></div>
          <div class="flip-top"><span class="value">0</span></div>
          <div class="flip-bottom"><span class="value">0</span></div>
        </div>
        <div class="digit" data-role="h2">
          <div class="card-top"><span class="value">0</span></div>
          <div class="card-bottom"><span class="value">0</span></div>
          <div class="flip-top"><span class="value">0</span></div>
          <div class="flip-bottom"><span class="value">0</span></div>
        </div>
        <div class="label">小时</div>
      </div>

      <div class="colon">:</div>

      <!-- 分钟 -->
      <div class="group">
        <div class="digit" data-role="m1">
          <div class="card-top"><span class="value">0</span></div>
          <div class="card-bottom"><span class="value">0</span></div>
          <div class="flip-top"><span class="value">0</span></div>
          <div class="flip-bottom"><span class="value">0</span></div>
        </div>
        <div class="digit" data-role="m2">
          <div class="card-top"><span class="value">0</span></div>
          <div class="card-bottom"><span class="value">0</span></div>
          <div class="flip-top"><span class="value">0</span></div>
          <div class="flip-bottom"><span class="value">0</span></div>
        </div>
        <div class="label">分钟</div>
      </div>

      <div class="colon">:</div>

      <!-- 秒钟 -->
      <div class="group">
        <div class="digit" data-role="s1">
          <div class="card-top"><span class="value">0</span></div>
          <div class="card-bottom"><span class="value">0</span></div>
          <div class="flip-top"><span class="value">0</span></div>
          <div class="flip-bottom"><span class="value">0</span></div>
        </div>
        <div class="digit" data-role="s2">
          <div class="card-top"><span class="value">0</span></div>
          <div class="card-bottom"><span class="value">0</span></div>
          <div class="flip-top"><span class="value">0</span></div>
          <div class="flip-bottom"><span class="value">0</span></div>
        </div>
        <div class="label">秒</div>
      </div>
    </section>

    <footer class="footer">
      24小时制 · 页面自适应 · 电脑与手机可用
    </footer>
  </main>

  <script>
    // 工具：补零并拆分为两个字符
    const pad2 = (n) => String(n).padStart(2, '0');
    const split2 = (s) => [s[0], s[1]];

    // 设置日期栏
    function updateDateMeta() {
      const d = new Date();
      const wd = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
      const fmt = `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${wd}`;
      document.getElementById('dateMeta').textContent = fmt;
    }
    updateDateMeta();
    setInterval(updateDateMeta, 60_000);

    // 根据角色名找到对应digit元素
    const roles = ['h1','h2','m1','m2','s1','s2'];
    const digits = Object.fromEntries(roles.map(r => [r, document.querySelector(`.digit[data-role="${r}"]`)]));

    // 触发一次翻页动画：prev -> next（分阶段顺序触发）
    function flip(digitEl, prev, next) {
      const topStatic = digitEl.querySelector('.card-top .value');
      const botStatic = digitEl.querySelector('.card-bottom .value');
      const topFlip = digitEl.querySelector('.flip-top .value');
      const botFlip = digitEl.querySelector('.flip-bottom .value');

      // 设置当前和下一值
      topStatic.textContent = prev;
      botStatic.textContent = prev;
      topFlip.textContent = prev;
      botFlip.textContent = next;

      // 分阶段动画：先上半片，再下半片
      digitEl.classList.remove('animate-top', 'animate-bottom');
      void digitEl.offsetWidth; // 强制 reflow
      digitEl.classList.add('animate-top');
      // 上半片一开始就更新顶部静态文本为下一值，提前时机
      topStatic.textContent = next;

      const onTopEnd = () => {
        digitEl.classList.remove('animate-top');
        digitEl.classList.add('animate-bottom');
      };
      const onBottomEnd = () => {
        digitEl.classList.remove('animate-bottom');
        // 下半片结束后再更新底部静态文本
        botStatic.textContent = next;
      };

      // 只监听对应层的结束事件，避免重复触发
      digitEl.querySelector('.flip-top').addEventListener('animationend', onTopEnd, { once: true });
      digitEl.querySelector('.flip-bottom').addEventListener('animationend', onBottomEnd, { once: true });
    }

    // 初始化并每秒更新
    let prev = null;
    function tick() {
      const now = new Date();
      const [h1,h2] = split2(pad2(now.getHours()));
      const [m1,m2] = split2(pad2(now.getMinutes()));
      const [s1,s2] = split2(pad2(now.getSeconds()));
      const curr = { h1,h2,m1,m2,s1,s2 };

      if (!prev) {
        // 首次渲染：直接设置静态值
        for (const r of roles) {
          const el = digits[r];
          el.querySelector('.card-top .value').textContent = curr[r];
          el.querySelector('.card-bottom .value').textContent = curr[r];
          el.querySelector('.flip-top .value').textContent = curr[r];
          el.querySelector('.flip-bottom .value').textContent = curr[r];
        }
        prev = curr;
        return;
      }

      // 逐个数字比较，变化则翻页
      for (const r of roles) {
        if (prev[r] !== curr[r]) {
          flip(digits[r], prev[r], curr[r]);
        }
      }
      prev = curr;
    }

    tick();
    // 与真实秒同步：先对齐到下一个整秒再开始每秒tick
    const delay = 1000 - (Date.now() % 1000);
    setTimeout(() => {
      tick();
      setInterval(tick, 1000);
    }, delay);

    // 可见性优化：页面隐藏时暂停动画的更新，显示后立即对齐
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        tick();
      }
    });
    
    // 手机版：尝试锁定横屏；失败则旋转整页作为降级方案
    async function enableLandscape() {
      try {
        if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen();
        }
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock('landscape');
          document.body.classList.remove('force-landscape');
        } else {
          throw new Error('orientation lock not supported');
        }
      } catch (err) {
        document.body.classList.add('force-landscape');
      }
    }
    const btn = document.getElementById('landscapeBtn');
    if (btn) btn.addEventListener('click', enableLandscape);
    
    function isMobilePortrait() {
      const small = window.matchMedia('(max-width: 560px)').matches;
      const portrait = (screen.orientation && screen.orientation.type)
        ? screen.orientation.type.includes('portrait')
        : (window.innerHeight > window.innerWidth);
      return small && portrait;
    }

    async function enableLandscapeAuto() {
      if (!isMobilePortrait()) return;
      try {
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock('landscape');
          document.body.classList.remove('force-landscape');
        } else {
          throw new Error('orientation lock not supported');
        }
      } catch (err) {
        // 自动降级：旋转整页模拟横屏
        document.body.classList.add('force-landscape');
      }
    }

    document.addEventListener('DOMContentLoaded', enableLandscapeAuto);

    window.addEventListener('orientationchange', () => {
      const isLandscape = (screen.orientation && screen.orientation.type && screen.orientation.type.includes('landscape'))
        || (window.innerWidth > window.innerHeight);
      if (isLandscape) {
        document.body.classList.remove('force-landscape');
      } else if (isMobilePortrait()) {
        document.body.classList.add('force-landscape');
      }
    });

    // 全屏开关：支持浏览器则进入/退出全屏，并动态更新按钮文案
    async function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) {
          if (document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen();
          }
        } else {
          if (document.exitFullscreen) {
            await document.exitFullscreen();
          }
        }
      } catch (e) {
        // 忽略错误（部分移动端需要用户手势或不支持）
      }
    }
    const fsBtn = document.getElementById('fullscreenBtn');
    if (fsBtn) {
      fsBtn.addEventListener('click', toggleFullscreen);
      document.addEventListener('fullscreenchange', () => {
        fsBtn.textContent = document.fullscreenElement ? '退出全屏' : '全屏';
        fsBtn.title = document.fullscreenElement ? '退出全屏显示' : '全屏显示';
      });
    }
  </script>
</body>
</html>
