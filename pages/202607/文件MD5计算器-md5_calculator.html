<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件MD5计算器</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #6dd5ed, #2193b0); /* 渐变背景 */
            margin: 0;
            color: #333;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.95); /* 半透明白色背景 */
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); /* 更明显的阴影 */
            text-align: center;
            width: 90%;
            max-width: 550px;
            backdrop-filter: blur(5px); /* 毛玻璃效果 */
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        h1 {
            color: #2193b0; /* 标题颜色 */
            margin-bottom: 25px;
            font-size: 2.2em;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }
        .input-group {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px; /* 标签和输入框之间的间距 */
        }
        .input-group label {
            font-size: 1.1em;
            color: #555;
            white-space: nowrap; /* 防止标签换行 */
        }
        .size-input-container {
            display: flex;
            border: 2px solid #6dd5ed; /* 整体边框 */
            border-radius: 8px;
            overflow: hidden; /* 确保子元素圆角 */
            transition: all 0.3s ease;
        }
        .size-input-container:hover {
            border-color: #2193b0;
            box-shadow: 0 0 5px rgba(33, 147, 176, 0.5);
        }
        input[type="file"] {
            display: block;
            width: calc(100% - 20px); /* 调整宽度以适应内边距 */
            padding: 12px;
            margin: 0 auto 25px auto; /* 居中并增加下边距 */
            border: 2px solid #6dd5ed; /* 边框颜色 */
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1.1em;
            color: #333;
            background-color: #f9f9f9;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        input[type="file"]:hover {
            border-color: #2193b0;
            background-color: #e0f7fa;
        }
        .size-input-container input[type="number"] {
            border: none; /* 移除内部边框 */
            padding: 12px;
            width: 100px; /* 固定输入框宽度 */
            font-size: 1.1em;
            color: #333;
            background-color: #f9f9f9;
            box-sizing: border-box;
            outline: none; /* 移除焦点轮廓 */
        }
        .size-input-container select {
            border: none; /* 移除内部边框 */
            padding: 12px;
            background-color: #f9f9f9;
            font-size: 1.1em;
            color: #333;
            cursor: pointer;
            outline: none; /* 移除焦点轮廓 */
            border-left: 1px solid #ddd; /* 分隔线 */
        }
        button {
            background: linear-gradient(45deg, #2193b0, #6dd5ed); /* 按钮渐变背景 */
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            margin-top: 10px;
        }
        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }
        .md5-result {
            margin-top: 30px;
            padding: 20px;
            background: linear-gradient(45deg, #e0f7fa, #b2ebf2); /* 结果区域渐变背景 */
            border-radius: 10px;
            word-break: break-all;
            text-align: left;
            box-shadow: inset 0 1px 5px rgba(0, 0, 0, 0.05);
            border: 1px solid #80deea;
        }
        .md5-result strong {
            display: block;
            margin-bottom: 10px;
            color: #00796b; /* 强调文字颜色 */
            font-size: 1.2em;
        }
        #md5Value {
            font-family: 'Courier New', Courier, monospace; /* 等宽字体 */
            color: #000; /* 更深的颜色 */
            font-size: 1.1em;
            font-weight: bold; /* 加粗 */
        }
        .loading {
            color: #007bff;
            font-style: italic;
            animation: pulse 1.5s infinite; /* 添加加载动画 */
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>文件工具</h1>
        <h2>MD5计算器</h2>
        <input type="file" id="fileInput">
        <div class="md5-result">
            <strong>MD5值:</strong>
            <span id="md5Value">请选择文件...</span>
        </div>

        <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">

        <h2>XML文件生成器</h2>
        <div class="input-group">
            <label for="fileSizeInput">文件大小:</label>
            <div class="size-input-container">
                <input type="number" id="fileSizeInput" value="1" min="0.01" step="0.01">
                <select id="fileUnitSelect">
                    <option value="MB">MB</option>
                    <option value="GB">GB</option>
                </select>
            </div>
        </div>
        <button id="generateXmlButton">生成并下载XML文件</button>
    </div>

    <!-- 引入 js-md5 库 -->
    <script src="https://cdn.jsdelivr.net/npm/js-md5@0.7.3/src/md5.min.js"></script>
    <script>
        // MD5计算器功能
        const fileInput = document.getElementById('fileInput');
        const md5ValueSpan = document.getElementById('md5Value');

        fileInput.addEventListener('change', function() {
            const file = this.files[0];

            if (file) {
                md5ValueSpan.textContent = '计算中...';
                md5ValueSpan.classList.add('loading');

                const reader = new FileReader();

                reader.onload = function(e) {
                    const buffer = e.target.result;
                    const md5Hash = md5(buffer);

                    md5ValueSpan.textContent = md5Hash;
                    md5ValueSpan.classList.remove('loading');
                };

                reader.onerror = function() {
                    md5ValueSpan.textContent = '文件读取失败！';
                    md5ValueSpan.classList.remove('loading');
                };

                reader.readAsArrayBuffer(file);
            } else {
                md5ValueSpan.textContent = '请选择文件...';
                md5ValueSpan.classList.remove('loading');
            }
        });

        // XML文件生成器功能
        const fileSizeInput = document.getElementById('fileSizeInput');
        const fileUnitSelect = document.getElementById('fileUnitSelect');
        const generateXmlButton = document.getElementById('generateXmlButton');

        generateXmlButton.addEventListener('click', function() {
            let fileSize = parseFloat(fileSizeInput.value);
            const unit = fileUnitSelect.value;

            if (isNaN(fileSize) || fileSize <= 0) {
                alert('请输入有效的文件大小。');
                return;
            }

            let targetBytes;
            let displaySize;
            let displayUnit;

            if (unit === 'GB') {
                // 限制最大生成文件大小，例如 0.1GB (100MB)，避免浏览器崩溃
                const MAX_FILE_SIZE_GB = 0.1; // 对应 100MB
                if (fileSize > MAX_FILE_SIZE_GB) {
                    alert(`为避免浏览器性能问题，最大支持生成 ${MAX_FILE_SIZE_GB} GB的文件。`);
                    return;
                }
                targetBytes = fileSize * 1024 * 1024 * 1024; // 转换为字节
                displaySize = fileSize;
                displayUnit = 'GB';
            } else { // MB
                // 限制最大生成文件大小，例如 100MB，避免浏览器崩溃
                const MAX_FILE_SIZE_MB = 100;
                if (fileSize > MAX_FILE_SIZE_MB) {
                    alert(`为避免浏览器性能问题，最大支持生成 ${MAX_FILE_SIZE_MB} MB的文件。`);
                    return;
                }
                targetBytes = fileSize * 1024 * 1024; // 转换为字节
                displaySize = fileSize;
                displayUnit = 'MB';
            }


            let xmlContent = '<?xml version="1.0" encoding="UTF-8"?>\n<root>\n';
            const dataSegment = '    <item id="{}">This is some dummy data to fill the file.</item>\n';
            let currentBytes = xmlContent.length;
            let item_id = 0;

            // 循环生成内容，直到接近目标大小
            while (currentBytes < targetBytes - ('</root>'.length + dataSegment.length)) {
                const segment = dataSegment.replace('{}', item_id);
                xmlContent += segment;
                currentBytes += segment.length;
                item_id++;
            }
            xmlContent += '</root>';

            // 创建Blob对象
            const blob = new Blob([xmlContent], { type: 'application/xml' });

            // 创建下载链接
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `generated_file_${displaySize}${displayUnit}.xml`; // 默认文件名
            document.body.appendChild(a);
            a.click(); // 模拟点击下载
            document.body.removeChild(a); // 移除链接
            URL.revokeObjectURL(a.href); // 释放URL对象

            alert(`已生成并开始下载 ${displaySize} ${displayUnit} 的XML文件。`);
        });
    </script>
</body>
</html>
