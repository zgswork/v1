<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时钟学习乐园</title>
    <style>
        body {
            font-family: 'Arial Rounded MT Bold', 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #ffd6e7, #c1f0c1);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        h1 {
            color: #ff6b9d;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            font-size: 2.5rem;
            margin: 20px 0;
        }
        
        .container {
            width: 90%;
            max-width: 800px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-bottom: 30px;
        }
        
        .panel-title {
            color: #5a8f3d;
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .clock-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .clock {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background-color: #fff9e6;
            border: 10px solid #ffb6c1;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        
        .number {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #5a8f3d;
        }
        
        .number span {
            display: inline-block;
            position: absolute;
        }
        
        .hand {
            position: absolute;
            left: 50%;
            bottom: 50%;
            transform-origin: 50% 100%;
            border-radius: 10px;
        }
        
        .hour-hand {
            width: 8px;
            height: 80px;
            background-color: #4285f4;
            transform: translateX(-50%) rotate(0deg);
            z-index: 3;
        }
        
        .minute-hand {
            width: 5px;
            height: 110px;
            background-color: #34a853;
            transform: translateX(-50%) rotate(0deg);
            z-index: 2;
        }
        
        .second-hand {
            width: 2px;
            height: 130px;
            background-color: #ea4335;
            transform: translateX(-50%) rotate(0deg);
            z-index: 1;
        }
        
        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 15px;
            height: 15px;
            background-color: #ff6b9d;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 4;
        }
        
        .hand-description {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .hand-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .hand-color {
            width: 30px;
            height: 30px;
            border-radius: 5px;
        }
        
        .hour-color {
            background-color: #4285f4;
        }
        
        .minute-color {
            background-color: #34a853;
        }
        
        .second-color {
            background-color: #ea4335;
        }
        
        .time-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .time-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .time-label {
            width: 60px;
            font-weight: bold;
            color: #5a8f3d;
        }
        
        .time-input {
            flex-grow: 1;
            height: 30px;
            border: 2px solid #ffb6c1;
            border-radius: 5px;
            padding: 0 10px;
            font-size: 1rem;
        }
        
        .time-display {
            padding: 15px;
            background-color: #fff9e6;
            border: 3px solid #ffb6c1;
            border-radius: 10px;
            font-size: 1.5rem;
            text-align: center;
            color: #5a8f3d;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>时钟学习乐园</h1>
    
    <div class="container">
        <h2 class="panel-title">互动时钟</h2>
        
        <div class="clock-container">
            <div class="clock" id="clock">
                <div class="number" id="numbers"></div>
                <div class="hand hour-hand" id="hour-hand"></div>
                <div class="hand minute-hand" id="minute-hand"></div>
                <div class="hand second-hand" id="second-hand"></div>
                <div class="center-circle"></div>
            </div>
            
            <div class="hand-description">
                <div class="hand-item">
                    <div class="hand-color hour-color"></div>
                    <div>时针（小时）：最短最粗的指针</div>
                </div>
                <div class="hand-item">
                    <div class="hand-color minute-color"></div>
                    <div>分针（分钟）：中间长度的指针</div>
                </div>
                <div class="hand-item">
                    <div class="hand-color second-color"></div>
                    <div>秒针（秒钟）：最细最长的指针</div>
                </div>
            </div>
            
            <div class="time-controls">
                <div class="time-row">
                    <div class="time-label">小时：</div>
                    <input type="number" class="time-input" id="hour-input" min="0" max="23" value="12">
                </div>
                <div class="time-row">
                    <div class="time-label">分钟：</div>
                    <input type="number" class="time-input" id="minute-input" min="0" max="59" value="0">
                </div>
                <div class="time-row">
                    <div class="time-label">秒钟：</div>
                    <input type="number" class="time-input" id="second-input" min="0" max="59" value="0">
                </div>
            </div>
            
            <div class="time-display" id="time-display">
                12:00:00
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 创建时钟数字
            const numbersContainer = document.getElementById('numbers');
            for (let i = 1; i <= 12; i++) {
                const angle = (i - 3) * 30 * Math.PI / 180;
                const x = 50 + 40 * Math.cos(angle);
                const y = 50 + 40 * Math.sin(angle);
                const numberSpan = document.createElement('span');
                numberSpan.textContent = i;
                numberSpan.style.left = `${x}%`;
                numberSpan.style.top = `${y}%`;
                numbersContainer.appendChild(numberSpan);
            }
            
            // 获取指针元素
            const hourHand = document.getElementById('hour-hand');
            const minuteHand = document.getElementById('minute-hand');
            const secondHand = document.getElementById('second-hand');
            
            // 获取输入框
            const hourInput = document.getElementById('hour-input');
            const minuteInput = document.getElementById('minute-input');
            const secondInput = document.getElementById('second-input');
            const timeDisplay = document.getElementById('time-display');
            
            // 更新时钟显示
            function updateClock() {
                let hours = parseInt(hourInput.value) || 0;
                let minutes = parseInt(minuteInput.value) || 0;
                let seconds = parseInt(secondInput.value) || 0;
                
                // 处理输入范围
                hours = Math.max(0, Math.min(23, hours));
                minutes = Math.max(0, Math.min(59, minutes));
                seconds = Math.max(0, Math.min(59, seconds));
                
                // 更新输入框值
                hourInput.value = hours;
                minuteInput.value = minutes;
                secondInput.value = seconds;
                
                // 计算指针角度
                const hourDegrees = (hours % 12) * 30 + minutes * 0.5;
                const minuteDegrees = minutes * 6;
                const secondDegrees = seconds * 6;
                
                // 应用旋转
                hourHand.style.transform = `translateX(-50%) rotate(${hourDegrees}deg)`;
                minuteHand.style.transform = `translateX(-50%) rotate(${minuteDegrees}deg)`;
                secondHand.style.transform = `translateX(-50%) rotate(${secondDegrees}deg)`;
                
                // 更新时间显示
                const displayHours = hours.toString().padStart(2, '0');
                const displayMinutes = minutes.toString().padStart(2, '0');
                const displaySeconds = seconds.toString().padStart(2, '0');
                timeDisplay.textContent = `${displayHours}:${displayMinutes}:${displaySeconds}`;
            }
            
            // 添加输入事件监听
            hourInput.addEventListener('input', updateClock);
            minuteInput.addEventListener('input', updateClock);
            secondInput.addEventListener('input', updateClock);
            
            // 初始更新
            updateClock();
        });
    </script>
</body>
</html>
