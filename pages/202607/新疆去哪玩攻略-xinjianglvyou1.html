        // 获取DOM元素
        const generateBtn = document.getElementById('generateBtn');
        const changeBtn = document.getElementById('changeBtn');
        const resultDiv = document.getElementById('result');
        const attractionName = document.getElementById('attractionName');
        const attractionDesc = document.getElementById('attractionDesc');
        const attractionAddress = document.getElementById('attractionAddress');
        const attractionTransport = document.getElementById('attractionTransport');
        const attractionTicket = document.getElementById('attractionTicket');
        const attractionTime = document.getElementById('attractionTime');
        const downloadBtn = document.getElementById('downloadBtn');
        const downloadModal = document.getElementById('downloadModal');
        const closeModal = document.getElementById('closeModal');
        
        // 已显示的景点索引数组
        let shownIndices = [];
        
        // 生成随机景点
        function getRandomAttraction() {
            // 如果所有景点都已显示过，重置数组
            if (shownIndices.length >= attractions.length) {
                shownIndices = [];
            }
            
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * attractions.length);
            } while (shownIndices.includes(randomIndex));
            
            shownIndices.push(randomIndex);
            return attractions[randomIndex];
        }
        
        // 显示景点信息
        function displayAttraction(attraction) {
            attractionName.textContent = attraction.name;
            attractionDesc.textContent = attraction.desc;
            attractionAddress.textContent = attraction.address;
            attractionTransport.textContent = attraction.transport;
            attractionTicket.textContent = attraction.ticket;
            attractionTime.textContent = attraction.time;
            
            resultDiv.style.display = 'block';
        }
        
        // 事件监听
        generateBtn.addEventListener('click', function() {
            const randomAttraction = getRandomAttraction();
            displayAttraction(randomAttraction);
        });
        
        changeBtn.addEventListener('click', function() {
            const randomAttraction = getRandomAttraction();
            displayAttraction(randomAttraction);
        });
        
        // 下载按钮功能
        downloadBtn.addEventListener('click', function() {
            downloadModal.style.display = 'flex';
        });
        
        closeModal.addEventListener('click', function() {
            downloadModal.style.display = 'none';
        });
        
        // 点击模态框外部关闭
        downloadModal.addEventListener('click', function(e) {
            if (e.target === downloadModal) {
                downloadModal.style.display = 'none';
            }
        });
    </script>
