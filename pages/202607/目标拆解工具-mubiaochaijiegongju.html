    <title>目标拆解工具</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    
    <!-- 配置Tailwind自定义颜色和工具类 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',      // 主色调：蓝色
                        secondary: '#10b981',    // 辅助色：绿色
                        accent: '#f59e0b',       // 强调色：橙色
                        neutral: '#64748b',      // 中性色：灰色
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .goal-card {
                @apply bg-white rounded-lg border border-gray-200 p-4 shadow-sm transition-all duration-300 hover:shadow-md;
            }
            .subgoal-item {
                @apply pl-6 py-2 border-l-2 border-gray-200 relative;
            }
            .subgoal-item:before {
                content: '';
                @apply absolute left-[-5px] top-4 w-2 h-2 rounded-full bg-gray-300;
            }
            .task-item {
                @apply pl-10 py-2 border-l-2 border-gray-200 relative;

<body class="bg-gray-50 font-sans text-gray-800 min-h-screen flex flex-col">

        <main class="space-y-10">

                <h2 class="text-xl font-bold mb-5 flex items-center">

                <form id="goalForm" class="grid grid-cols-1 md:grid-cols-3 gap-5">
                    <input type="hidden" id="goalId">
                    
                    <div class="md:col-span-3">
                        <label for="goalName" class="block text-gray-700 font-medium mb-2">

                        </label>
                        <input

                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none"
                            placeholder="例如：减肥10斤、完成项目A、学习Python编程..."
                            required
                        >
                    </div>
                    
                    <div class="md:col-span-2">
                        <label for="goalDescription" class="block text-gray-700 font-medium mb-2">
                            目标描述
                        </label>
                        <textarea 
                            id="goalDescription" 
                            rows="2" 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none"

                    </div>
                    
                    <div>
                        <label for="goalDeadline" class="block text-gray-700 font-medium mb-2">

                        >
                    </div>
                    
                    <div class="md:col-span-3">
                        <label class="block text-gray-700 font-medium mb-2">
                            目标类型（帮助更精准地拆解）
                        </label>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                            <label class="flex items-center p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50 transition-colors">
                                <input type="radio" name="goalType" value="health" class="mr-2 text-primary focus:ring-primary" checked>
                                <span>健康健身</span>
                            </label>
                            <label class="flex items-center p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50 transition-colors">
                                <input type="radio" name="goalType" value="career" class="mr-2 text-primary focus:ring-primary">
                                <span>职业发展</span>
                            </label>
                            <label class="flex items-center p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50 transition-colors">
                                <input type="radio" name="goalType" value="study" class="mr-2 text-primary focus:ring-primary">
                                <span>学习教育</span>
                            </label>
                            <label class="flex items-center p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50 transition-colors">
                                <input type="radio" name="goalType" value="other" class="mr-2 text-primary focus:ring-primary">

                            </label>

                    <!-- 提交按钮 -->

                                    </div>
                                    <div class="text-right">
                                        <span class="text-xs font-semibold inline-block text-primary" id="overallCompletionRate">

                                    </div>

                                    <div id="overallProgressBar" style="width: 0%" class="shadow-none flex flex-col text-center whitespace-nowrap text-white justify-center bg-primary"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
                
                <!-- 最近添加的目标 -->
                <section class="bg-white rounded-xl p-6 shadow-sm transition-all duration-300 hover:shadow-md lg:col-span-2">
                    <h2 class="text-xl font-bold mb-5 flex items-center">
                        <i class="fa fa-list-alt text-primary mr-2"></i>我的目标列表
                    </h2>
                    
                    <div id="goalsList" class="space-y-4">
                        <!-- 目标列表将通过JS动态生成 -->

                        </div>
                    </div>
                </section>
            </div>
            
            <!-- 当前选中的目标详情 -->
            <section id="goalDetailsSection" class="bg-white rounded-xl p-6 shadow-sm transition-all duration-300 hover:shadow-md hidden">
                <div class="flex flex-col md:flex-row md:items-center justify-between mb-6">
                    <div>
                        <h2 class="text-xl font-bold flex items-center" id="currentGoalTitle">
                            <i class="fa fa-flag text-primary mr-2"></i>目标详情
                        </h2>
                        <p class="text-gray-500 mt-1" id="currentGoalDeadline"></p>
                    </div>
                    
                    <div class="flex gap-3 mt-4 md:mt-0">
                        <button id="editCurrentGoalBtn" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg shadow transition-all duration-300 hover:bg-gray-200 hover:shadow-md flex items-center">
                            <i class="fa fa-pencil mr-2"></i>编辑
                        </button>
                        <button id="deleteCurrentGoalBtn" class="px-4 py-2 bg-red-100 text-red-700 rounded-lg shadow transition-all duration-300 hover:bg-red-200 hover:shadow-md flex items-center">
                            <i class="fa fa-trash-o mr-2"></i>删除
                        </button>
                    </div>
                </div>
                
                <div class="mb-6">
                    <h3 class="font-bold text-gray-700 mb-2">目标描述</h3>
                    <div id="currentGoalDescription" class="bg-gray-50 p-4 rounded-lg text-gray-700">
                        <!-- 目标描述将通过JS动态生成 -->
                    </div>
                </div>
                
                <div class="mb-6">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="font-bold text-gray-700">目标拆解（点击子目标可展开/折叠）</h3>
                        <div class="flex items-center">
                            <span class="text-sm text-gray-500 mr-2">完成进度：</span>
                            <span class="text-sm font-medium text-primary" id="currentGoalProgressText">0%</span>
                            <div class="w-24 h-2 bg-gray-200 rounded-full ml-2">
                                <div id="currentGoalProgressBar" class="h-full bg-primary rounded-full" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                    
                    <div id="goalBreakdown" class="pl-2 border-l-2 border-primary">
                        <!-- 目标拆解结果将通过JS动态生成 -->
                    </div>
                </div>
                
                <div class="border-t border-gray-200 pt-4">
                    <button id="markGoalAsCompletedBtn" class="px-6 py-2 bg-secondary text-white rounded-lg shadow transition-all duration-300 hover:bg-secondary/90 hover:shadow-md">
                        <i class="fa fa-check mr-2"></i>标记为已完成
                    </button>
                </div>
            </section>
        </main>
    </div>
    
    <!-- 添加子目标/任务的模态框 -->
    <div id="addItemModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-xl p-6 max-w-md w-full mx-4 shadow-xl transform transition-all">
            <div class="flex justify-between items-start mb-4">
                <h3 class="text-xl font-bold text-primary flex items-center" id="modalTitle">
                    <i class="fa fa-plus-circle mr-2"></i>添加子目标
                </h3>
                <button id="closeModalBtn" class="text-gray-400 hover:text-gray-600 transition-colors">
                    <i class="fa fa-times text-xl"></i>
                </button>
            </div>
            
            <form id="itemForm">
                <input type="hidden" id="parentId">
                <input type="hidden" id="itemType">
                
                <div class="mb-4">
                    <label for="itemName" class="block text-gray-700 font-medium mb-2">
                        名称 <span class="text-red-500">*</span>
                    </label>
                    <input 
                        type="text" 
                        id="itemName" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none"
                        placeholder="输入子目标或任务名称..."
                        required
                    >
                </div>
                
                <div class="mb-4">
                    <label for="itemDescription" class="block text-gray-700 font-medium mb-2">
                        描述
                    </label>
                    <textarea 
                        id="itemDescription" 
                        rows="2" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none"
                        placeholder="添加描述或具体执行方法..."></textarea>
                </div>
                
                <div class="mb-4">
                    <label for="itemDeadline" class="block text-gray-700 font-medium mb-2">
                        截止日期
                    </label>
                    <input 
                        type="date" 
                        id="itemDeadline" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none"
                    >
                </div>
                
                <div class="text-center pt-2">
                    <button type="submit" class="px-6 py-3 bg-primary text-white rounded-lg shadow transition-all duration-300 hover:bg-primary/90 hover:shadow-md">
                        <i class="fa fa-save mr-2"></i>保存
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- 底部备注 -->
    <footer class="mt-10 py-4 border-t border-gray-200">
        <div class="max-w-5xl mx-auto px-4 text-center text-gray-600 text-sm">
            <p>

                <a href="https://dkfile.com/Dx25214" target="_blank" rel="noopener" class="text-primary hover:underline">🌌</a>
            </p>
        </div>
    </footer>
    
    <!-- 操作提示 -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs">
        <i class="fa fa-check-circle mr-2"></i>
        <span id="toastMessage"></span>
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 目标拆解工具主类
        const GoalBreakdownTool = {
            // 初始化
            init() {
                // 初始化数据
                this.loadGoals();
                
                // 设置默认日期为30天后
                const defaultDeadline = new Date();
                defaultDeadline.setDate(defaultDeadline.getDate() + 30);
                document.getElementById('goalDeadline').value = this.formatDate(defaultDeadline);
                
                // 初始化事件监听
                this.initEventListeners();
                
                // 渲染页面
                this.renderAll();
            },
            
            // 格式化日期为YYYY-MM-DD
            formatDate(date) {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            },
            
            // 从本地存储加载目标
            loadGoals() {
                const savedGoals = localStorage.getItem('goals');
                this.goals = savedGoals ? JSON.parse(savedGoals) : [];
                this.currentGoalId = null;
            },
            
            // 保存目标到本地存储
            saveGoals() {
                localStorage.setItem('goals', JSON.stringify(this.goals));
            },
            
            // 初始化事件监听
            initEventListeners() {
                // 表单提交
                document.getElementById('goalForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.saveGoal();
                });
                
                // 取消编辑
                document.getElementById('cancelEditBtn').addEventListener('click', () => {
                    this.resetForm();
                });
                
                // 关闭模态框
                document.getElementById('closeModalBtn').addEventListener('click', () => {
                    this.closeModal();
                });
                
                // 子目标/任务表单提交
                document.getElementById('itemForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.saveItem();
                });
                
                // 编辑当前目标
                document.getElementById('editCurrentGoalBtn').addEventListener('click', () => {
                    if (this.currentGoalId) {
                        const goal = this.getGoalById(this.currentGoalId);
                        if (goal) {
                            this.editGoal(goal.id);
                        }
                    }
                });
                
                // 删除当前目标
                document.getElementById('deleteCurrentGoalBtn').addEventListener('click', () => {
                    if (this.currentGoalId) {
                        this.deleteGoal(this.currentGoalId);
                    }
                });
                
                // 标记目标为已完成
                document.getElementById('markGoalAsCompletedBtn').addEventListener('click', () => {
                    if (this.currentGoalId) {
                        this.toggleGoalCompletion(this.currentGoalId);
                    }
                });
            },
            
            // 保存目标
            saveGoal() {
                const goalId = document.getElementById('goalId').value;
                const name = document.getElementById('goalName').value.trim();
                const description = document.getElementById('goalDescription').value.trim();
                const deadline = document.getElementById('goalDeadline').value;
                const type = document.querySelector('input[name="goalType"]:checked').value;
                
                // 验证必填字段
                if (!name) {
                    this.showToast('请填写目标名称', 'error');
                    return;
                }
                
                // 创建目标对象
                const goal = {
                    name,
                    description,
                    deadline,
                    type,
                    isCompleted: false,
                    updatedAt: new Date().toISOString()
                };
                
                // 检查是新增还是编辑
                if (goalId) {
                    // 更新现有目标
                    const index = this.goals.findIndex(g => g.id === goalId);
                    if (index !== -1) {
                        goal.id = goalId;
                        goal.createdAt = this.goals[index].createdAt; // 保留创建时间
                        goal.subgoals = this.goals[index].subgoals || []; // 保留子目标
                        this.goals[index] = goal;
                        this.currentGoalId = goalId;
                    }
                } else {
                    // 添加新目标并自动拆解
                    goal.id = Date.now().toString();
                    goal.createdAt = new Date().toISOString();
                    goal.subgoals = this.breakdownGoal(goal); // 自动拆解目标
                    this.goals.push(goal);
                    this.currentGoalId = goal.id; // 设置为当前选中目标
                }
                
                // 保存数据
                this.saveGoals();
                
                // 更新UI
                this.renderAll();
                
                // 重置表单
                this.resetForm();
                
                // 显示提示
                this.showToast(goalId ? '目标已更新' : '目标已添加并自动拆解');
                
                // 如果是新目标，滚动到目标详情
                if (!goalId) {
                    document.getElementById('goalDetailsSection').scrollIntoView({ behavior: 'smooth' });
                }
            },
            
            // 自动拆解目标
            breakdownGoal(goal) {
                // 根据目标类型和名称进行智能拆解
                // 实际应用中可以使用更复杂的算法或AI模型进行拆解
                
                // 提取目标中的数量和时间信息
                const quantityMatch = goal.name.match(/(\d+)/);
                const quantity = quantityMatch ? parseInt(quantityMatch[0]) : null;
                
                // 根据目标类型生成不同的子目标
                switch(goal.type) {
                    case 'health':
                        return this.breakdownHealthGoal(goal, quantity);
                        
                    case 'career':
                        return this.breakdownCareerGoal(goal);
                        
                    case 'study':
                        return this.breakdownStudyGoal(goal);
                        
                    default:
                        return this.breakdownGenericGoal(goal);
                }
            },
            
            // 拆解健康健身类目标
            breakdownHealthGoal(goal, quantity) {
                const subgoals = [];
                
                // 运动相关子目标
                const exerciseGoal = {
                    id: `sg-${Date.now() + 1}`,
                    name: '规律运动',
                    description: '保持每周固定次数的运动习惯',
                    deadline: goal.deadline,
                    isCompleted: false,
                    tasks: [
                        {
                            id: `t-${Date.now() + 101}`,
                            name: '每周运动3-4次',
                            description: '每次运动30分钟以上，可以选择跑步、游泳、健身等',
                            isCompleted: false
                        },
                        {
                            id: `t-${Date.now() + 102}`,
                            name: '记录运动数据',
                            description: '记录每次运动的类型、时长和强度，追踪进步',
                            isCompleted: false
                        }
                    ]
                };
                
                // 饮食相关子目标
                const dietGoal = {
                    id: `sg-${Date.now() + 2}`,
                    name: '控制饮食',
                    description: '合理安排饮食，减少高热量食物摄入',
                    deadline: goal.deadline,
                    isCompleted: false,
                    tasks: [
                        {
                            id: `t-${Date.now() + 201}`,
                            name: '减少高热量食物',
                            description: '少吃油炸食品、甜食和精加工食品',
                            isCompleted: false
                        },
                        {
                            id: `t-${Date.now() + 202}`,
                            name: '增加蔬果摄入',
                            description: '每天保证摄入足够的蔬菜和水果',
                            isCompleted: false
                        },
                        {
                            id: `t-${Date.now() + 203}`,
                            name: '规律三餐',
                            description: '按时吃三餐，避免暴饮暴食',
                            isCompleted: false
                        }
                    ]
                };
                
                // 监测进度子目标
                const progressGoal = {
                    id: `sg-${Date.now() + 3}`,
                    name: '定期监测进度',
                    description: '记录并追踪目标的完成情况',
                    deadline: goal.deadline,
                    isCompleted: false,
                    tasks: [
                        {
                            id: `t-${Date.now() + 301}`,
                            name: '每周称重/测量',
                            description: '固定时间记录体重或身体数据变化',
                            isCompleted: false
                        },
                        {
                            id: `t-${Date.now() + 302}`,
                            name: '调整计划',
                            description: '根据进度调整运动和饮食计划',
                            isCompleted: false
                        }

            // 保存子目标或任务
            saveItem() {
                const parentId = document.getElementById('parentId').value;
                const itemType = document.getElementById('itemType').value;
                const name = document.getElementById('itemName').value.trim();
                const description = document.getElementById('itemDescription').value.trim();
                const deadline = document.getElementById('itemDeadline').value;
                
                // 验证必填字段
                if (!name) {
                    this.showToast('请填写名称', 'error');
                    return;
                }
                
                if (itemType === 'subgoal') {
                    // 查找目标（当前选中的目标）
                    const goal = this.getGoalById(this.currentGoalId);
                    if (!goal) return;
                    
                    // 初始化子目标数组
                    if (!goal.subgoals) {
                        goal.subgoals = [];
                    }
                    
                    // 检查是新增还是编辑
                    const existingIndex = goal.subgoals.findIndex(sg => sg.id === parentId);
                    
                    if (existingIndex !== -1) {
                        // 编辑现有子目标
                        goal.subgoals[existingIndex] = {
                            ...goal.subgoals[existingIndex],
                            name,
                            description,
                            deadline
                        };
                        this.showToast('子目标已更新');
                    } else {
                        // 添加新子目标
                        const newSubgoal = {
                            id: `sg-${Date.now()}`,
                            name,
                            description,
                            deadline,
                            isCompleted: false,
                            tasks: []
                        };
                        goal.subgoals.push(newSubgoal);
                        this.showToast('子目标已添加');
                    }
                } else if (itemType === 'task') {
                    // 查找子目标
                    const goal = this.getGoalById(this.currentGoalId);
                    if (!goal || !goal.subgoals) return;
                    
                    const subgoal = goal.subgoals.find(sg => sg.tasks && sg.tasks.some(t => t.id === parentId));
                    
                    // 如果没找到，检查parentId是否是子目标ID（新增任务）
                    if (!subgoal) {
                        subgoal = goal.subgoals.find(sg => sg.id === parentId);
                    }
                    
                    if (!subgoal) return;
                    
                    // 初始化任务数组
                    if (!subgoal.tasks) {
                        subgoal.tasks = [];
                    }
                    
                    // 检查是新增还是编辑
                    const existingIndex = subgoal.tasks.findIndex(t => t.id === parentId);
                    
                    if (existingIndex !== -1) {
                        // 编辑现有任务
                        subgoal.tasks[existingIndex] = {
                            ...subgoal.tasks[existingIndex],
                            name,
                            description,
                            deadline
                        };
                        this.showToast('任务已更新');

                        // 添加新任务
                        const newTask = {
                            id: `t-${Date.now()}`,
                            name,
                            description,
                            deadline,
                            isCompleted: false
                        };
                        subgoal.tasks.push(newTask);
                        
                        // 如果子目标之前是完成状态，设置为未完成
                        if (subgoal.isCompleted) {
                            subgoal.isCompleted = false;
                        }
                        
                        this.showToast('任务已添加');
                    }

            // 计算目标的完成进度
            calculateGoalProgress(goal) {
                if (!goal.subgoals || goal.subgoals.length === 0) {
                    return goal.isCompleted ? 100 : 0;
                }
                
                let totalItems = 0;
                let completedItems = 0;
                
                // 计算所有子目标和任务的完成情况
                goal.subgoals.forEach(subgoal => {
                    totalItems++;
                    if (subgoal.isCompleted) {
                        completedItems++;
                    }
                    
                    if (subgoal.tasks && subgoal.tasks.length > 0) {
                        subgoal.tasks.forEach(task => {
                            totalItems++;
                            if (task.isCompleted) {
                                completedItems++;
                            }
                        });
                    }
                });
                
                return totalItems > 0 ? Math.round((completedItems / totalItems) * 100) : 0;
            },
            
            // 计算总体完成进度
            calculateOverallProgress() {
                if (this.goals.length === 0) return 0;
                
                let totalProgress = 0;
                
                this.goals.forEach(goal => {
                    totalProgress += this.calculateGoalProgress(goal);
                });
                
                return Math.round(totalProgress / this.goals.length);
            },

            // 渲染目标列表
            renderGoalsList() {
                const container = document.getElementById('goalsList');
                
                if (this.goals.length === 0) {
                    container.innerHTML = `
                        <div class="text-center text-gray-500 py-10">
                            <i class="fa fa-flag-o text-3xl mb-3 text-gray-300"></i>
                            <p>还没有添加目标</p>
                            <p class="text-sm mt-1">输入一个大目标并拆解，开始您的目标实现之旅</p>
                        </div>
                    `;
                    return;
                }
                
                // 按创建时间排序（最新的在前）
                const sortedGoals = [...this.goals].sort((a, b) => 
                    new Date(b.createdAt) - new Date(a.createdAt)
                );
                
                container.innerHTML = '';
                sortedGoals.forEach(goal => {
                    const progress = this.calculateGoalProgress(goal);
                    const isCurrent = this.currentGoalId === goal.id;
                    
                    const goalEl = document.createElement('div');
                    goalEl.className = `goal-card ${isCurrent ? 'border-primary ring-1 ring-primary' : ''} cursor-pointer`;
                    goalEl.dataset.id = goal.id;
                    
                    // 格式化日期显示
                    const deadlineText = goal.deadline 
                        ? new Date(goal.deadline).toLocaleDateString('zh-CN') 
                        : '无截止日期';
                    
                    goalEl.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div class="flex-grow mr-3">
                                <div class="font-medium ${goal.isCompleted ? 'line-through text-gray-500' : ''}">
                                    ${goal.name}
                                    ${goal.isCompleted ? '<span class="ml-2 text-xs bg-secondary/10 text-secondary px-2 py-0.5 rounded-full">已完成</span>' : ''}
                                </div>
                                <div class="text-sm text-gray-500 mt-1">
                                    截止日期: ${deadlineText}
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-sm font-medium text-primary">${progress}%</div>
                                <div class="w-20 h-2 bg-gray-200 rounded-full mt-1">
                                    <div class="h-full rounded-full ${goal.isCompleted ? 'bg-secondary' : 'bg-primary'}" style="width: ${progress}%"></div>
                                </div>
                            </div>
                        </div>
                    `;
                    
                    // 添加点击事件
                    goalEl.addEventListener('click', () => {
                        this.currentGoalId = goal.id;
                        this.renderAll();
                        document.getElementById('goalDetailsSection').scrollIntoView({ behavior: 'smooth' });
                    });
                    
                    container.appendChild(goalEl);
                });
            },
            
            // 渲染目标详情
            renderGoalDetails(goal) {
                const detailsSection = document.getElementById('goalDetailsSection');
                detailsSection.classList.remove('hidden');
                
                // 更新目标标题和截止日期
                document.getElementById('currentGoalTitle').innerHTML = `
                    <i class="fa fa-flag text-primary mr-2"></i>${goal.name}
                    ${goal.isCompleted ? '<span class="ml-2 text-sm bg-secondary/10 text-secondary px-2 py-0.5 rounded-full">已完成</span>' : ''}
                `;
                
                // 格式化日期显示
                const deadlineText = goal.deadline 
                    ? `截止日期: ${new Date(goal.deadline).toLocaleDateString('zh-CN')}` 
                    : '无截止日期';
                document.getElementById('currentGoalDeadline').textContent = deadlineText;
                
                // 更新目标描述
                document.getElementById('currentGoalDescription').textContent = 
                    goal.description || '无描述信息。点击"编辑"可以添加目标描述。';
                
                // 计算并更新进度
                const progress = this.calculateGoalProgress(goal);
                document.getElementById('currentGoalProgressText').textContent = `${progress}%`;
                document.getElementById('currentGoalProgressBar').style.width = `${progress}%`;
                
                // 更新标记完成按钮文本
                const completeBtn = document.getElementById('markGoalAsCompletedBtn');
                if (goal.isCompleted) {
                    completeBtn.innerHTML = '<i class="fa fa-undo mr-2"></i>标记为进行中';
                } else {
                    completeBtn.innerHTML = '<i class="fa fa-check mr-2"></i>标记为已完成';
                }
                
                // 渲染目标拆解
                const breakdownContainer = document.getElementById('goalBreakdown');
                breakdownContainer.innerHTML = '';
                
                if (!goal.subgoals || goal.subgoals.length === 0) {
                    breakdownContainer.innerHTML = `
                        <div class="text-center text-gray-500 py-6">
                            <p>此目标尚未拆解为子目标</p>
                            <button class="mt-2 text-primary hover:underline" data-action="add-subgoal">
                                <i class="fa fa-plus-circle mr-1"></i>添加子目标
                            </button>
                        </div>
                    `;
                    
                    // 添加子目标按钮事件
                    breakdownContainer.querySelector('[data-action="add-subgoal"]').addEventListener('click', () => {
                        this.addSubgoal(goal.id);
                    });
                    
                    return;
                }
                
                // 渲染每个子目标
                goal.subgoals.forEach((subgoal, sgIndex) => {
                    // 计算子目标的完成进度
                    const sgProgress = this.calculateSubgoalProgress(subgoal);
                    
                    const subgoalEl = document.createElement('div');
                    subgoalEl.className = 'mb-6 last:mb-0';
                    
                    subgoalEl.innerHTML = `
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-3">
                            <div class="flex items-center">
                                <button class="toggle-subgoal mr-2 text-gray-500 hover:text-primary transition-colors" data-sg-index="${sgIndex}">
                                    <i class="fa fa-chevron-down"></i>
                                </button>
                                <div class="font-medium ${subgoal.isCompleted ? 'line-through text-gray-500' : ''}">
                                    ${subgoal.name}
                                    ${subgoal.isCompleted ? '<span class="ml-2 text-xs bg-secondary/10 text-secondary px-2 py-0.5 rounded-full">已完成</span>' : ''}
                                </div>
                            </div>
                            <div class="flex items-center mt-2 sm:mt-0">
                                <span class="text-sm text-gray-500 mr-2">完成度：${sgProgress}%</span>
                                <div class="flex space-x-1">
                                    <button class="edit-subgoal p-1 text-gray-400 hover:text-primary transition-colors" data-sg-index="${sgIndex}" title="编辑子目标">
                                        <i class="fa fa-pencil"></i>
                                    </button>
                                    <button class="delete-subgoal p-1 text-gray-400 hover:text-red-500 transition-colors" data-sg-index="${sgIndex}" title="删除子目标">
                                        <i class="fa fa-trash-o"></i>
                                    </button>
                                    <button class="add-task p-1 text-gray-400 hover:text-secondary transition-colors" data-sg-index="${sgIndex}" title="添加任务">
                                        <i class="fa fa-plus-circle"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        ${subgoal.description ? `
                            <div class="pl-6 mb-3 text-sm text-gray-600 bg-gray-50 p-2 rounded-lg">
                                ${subgoal.description}
                            </div>
                        ` : ''}
                        
                        <div class="subgoal-tasks">
                            <!-- 任务将在这里动态生成 -->
                        </div>
                    `;
                    
                    breakdownContainer.appendChild(subgoalEl);
                    
                    // 渲染子目标的任务
                    this.renderSubgoalTasks(subgoalEl.querySelector('.subgoal-tasks'), goal.id, subgoal, sgIndex);
                    
                    // 添加子目标事件监听
                    this.addSubgoalEventListeners(subgoalEl, goal.id, subgoal, sgIndex);
                });
            },
            
            // 计算子目标的完成进度
            calculateSubgoalProgress(subgoal) {
                if (!subgoal.tasks || subgoal.tasks.length === 0) {
                    return subgoal.isCompleted ? 100 : 0;
                }
                
                const completedTasks = subgoal.tasks.filter(task => task.isCompleted).length;
                return Math.round((completedTasks / subgoal.tasks.length) * 100);
            },
            
            // 渲染子目标的任务
            renderSubgoalTasks(container, goalId, subgoal, sgIndex) {
                if (!subgoal.tasks || subgoal.tasks.length === 0) {
                    container.innerHTML = `
                        <div class="subgoal-item">
                            <div class="text-gray-500 text-sm">
                                无任务。点击"添加任务"按钮创建具体任务。
                            </div>
                        </div>
                    `;
                    return;
                }
                
                container.innerHTML = '';
                
                subgoal.tasks.forEach((task, tIndex) => {
                    const taskEl = document.createElement('div');
                    taskEl.className = 'task-item';
                    
                    taskEl.innerHTML = `
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between">
                            <div class="flex items-start">
                                <label class="cursor-pointer flex items-start mt-0.5">
                                    <input type="checkbox" class="task-checkbox mt-1 text-primary focus:ring-primary" 
                                        ${task.isCompleted ? 'checked' : ''} 
                                        data-sg-index="${sgIndex}" 
                                        data-t-index="${tIndex}">
                                    <span class="ml-2 ${task.isCompleted ? 'line-through text-gray-500' : ''}">
                                        ${task.name}
                                    </span>
                                </label>
                            </div>
                            <div class="flex space-x-1 mt-1 sm:mt-0">
                                <button class="edit-task p-1 text-gray-400 hover:text-primary transition-colors" 
                                    data-sg-index="${sgIndex}" 
                                    data-t-index="${tIndex}"
                                    title="编辑任务">
                                    <i class="fa fa-pencil"></i>
                                </button>
                                <button class="delete-task p-1 text-gray-400 hover:text-red-500 transition-colors" 
                                    data-sg-index="${sgIndex}" 
                                    data-t-index="${tIndex}"
                                    title="删除任务">
                                    <i class="fa fa-trash-o"></i>
                                </button>
                            </div>
                        </div>
                        
                        ${task.description ? `
                            <div class="ml-6 mt-1 text-sm text-gray-600 bg-gray-50 p-2 rounded-lg">
                                ${task.description}
                            </div>
                        ` : ''}
                    `;
                    
                    container.appendChild(taskEl);
                    
                    // 添加任务事件监听
                    this.addTaskEventListeners(taskEl, goalId, subgoal.id, task.id, sgIndex, tIndex);
                });
            },
            
            // 添加子目标事件监听
            addSubgoalEventListeners(element, goalId, subgoal, sgIndex) {
                // 展开/折叠子目标
                element.querySelector('.toggle-subgoal').addEventListener('click', (e) => {
                    e.stopPropagation();
                    const tasksContainer = element.querySelector('.subgoal-tasks');
                    const icon = e.currentTarget.querySelector('i');
                    
                    if (tasksContainer.style.display === 'none') {
                        tasksContainer.style.display = 'block';
                        icon.className = 'fa fa-chevron-down';
                    } else {
                        tasksContainer.style.display = 'none';
                        icon.className = 'fa fa-chevron-right';
                    }
                });
                
                // 编辑子目标
                element.querySelector('.edit-subgoal').addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.editSubgoal(goalId, subgoal.id);
                });
                
                // 删除子目标
                element.querySelector('.delete-subgoal').addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.deleteSubgoal(goalId, subgoal.id);
                });
                
                // 添加任务
                element.querySelector('.add-task').addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.addTask(goalId, subgoal.id);
                });
            },
            
            // 添加任务事件监听
            addTaskEventListeners(element, goalId, subgoalId, taskId, sgIndex, tIndex) {
                // 切换任务完成状态
                element.querySelector('.task-checkbox').addEventListener('change', (e) => {
                    e.stopPropagation();
                    this.toggleTaskCompletion(goalId, subgoalId, taskId);
                });
                
                // 编辑任务
                element.querySelector('.edit-task').addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.editTask(goalId, subgoalId, taskId);
                });
                
                // 删除任务
                element.querySelector('.delete-task').addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.deleteTask(goalId, subgoalId, taskId);
                });
            },
            
            // 更新统计信息
            updateStatistics() {
                const total = this.goals.length;
                const completed = this.goals.filter(goal => goal.isCompleted).length;
                const inProgress = total - completed;
                const overallProgress = this.calculateOverallProgress();
                
                // 更新统计数字
                document.getElementById('totalGoalsCount').textContent = total;
                document.getElementById('completedGoalsCount').textContent = completed;
                document.getElementById('inProgressGoalsCount').textContent = inProgress;
                document.getElementById('overallCompletionRate').textContent = `${overallProgress}%`;
                document.getElementById('overallProgressBar').style.width = `${overallProgress}%`;
            },
            
            // 显示提示消息
            showToast(message, type = 'success') {
                const toast = document.getElementById('toast');
                const toastMsg = document.getElementById('toastMessage');
                
                toastMsg.textContent = message;
                
                // 设置样式
                if (type === 'success') {
                    toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs bg-green-500 text-white';
                    toast.querySelector('i').className = 'fa fa-check-circle mr-2';
                } else if (type === 'error') {
                    toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs bg-red-500 text-white';
                    toast.querySelector('i').className = 'fa fa-exclamation-circle mr-2';
                } else if (type === 'info') {
                    toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs bg-blue-500 text-white';
                    toast.querySelector('i').className = 'fa fa-info-circle mr-2';
                }
                
                // 3秒后隐藏
                setTimeout(() => {
                    toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs';
                }, 3000);
            }
        };
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            GoalBreakdownTool.init();
        });
    </script>
</body>
</html>
