<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经典贪吃蛇 - Classic Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            font-family: 'Courier New', monospace;
            color: #00ff41;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 10px 5px 100px 5px;
            overflow-x: hidden;
        }

        .game-container {
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #00ff41;
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.3);
            text-align: center;
            margin: 5px 5px 102px 5px;
            max-width: 440px;
            width: 100%;
            box-sizing: border-box;
        }

        .title {
            font-size: 1.9em;
            text-shadow: 0 0 20px #00ff41;
            margin-bottom: 7px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .score {
            font-size: 1.15em;
            margin-bottom: 9px;
        }

        #gameCanvas {
            border: 2px solid #00ff41;
            background: #0a0a0a;
            display: block;
            margin: 0 auto 11px;
            box-shadow: inset 0 0 20px rgba(0, 255, 65, 0.1);
            max-width: calc(100vw - 40px);
            max-height: calc(100vh - 300px);
            width: 100%;
            height: auto;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            justify-content: center;
            margin-bottom: 10px;
        }

        button {
            background: linear-gradient(45deg, #00ff41, #00cc33);
            border: none;
            color: black;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 65, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .mobile-controls {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 7px;
            max-width: 170px;
            margin: 10px auto;
        }

        .mobile-controls button {
            padding: 11px;
            font-size: 15px;
        }

        .arrow-up { grid-column: 2; }
        .arrow-left { grid-column: 1; grid-row: 2; }
        .arrow-right { grid-column: 3; grid-row: 2; }
        .arrow-down { grid-column: 2; grid-row: 3; }

        .instructions {
            font-size: 0.82em;
            color: #00cc33;
            line-height: 1.35;
            max-width: 400px;
            margin: 0 auto;
        }

        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #ff0040;
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            color: #ff0040;
            display: none;
            z-index: 1000;
        }

        .game-over h2 {
            font-size: 2em;
            margin-bottom: 15px;
            text-shadow: 0 0 15px #ff0040;
        }

        @media (max-width: 768px) {
            .mobile-controls {
                display: grid;
            }
            
            .title {
                font-size: 1.8em;
                margin-bottom: 6px;
            }
            
            .score {
                font-size: 1.1em;
                margin-bottom: 8px;
            }
            
            #gameCanvas {
                max-width: calc(100vw - 30px);
                max-height: calc(100vh - 260px);
            }
            
            .instructions {
                font-size: 0.75em;
                padding: 0 10px;
                line-height: 1.3;
            }
            
            .game-container {
                padding: 12px;
                margin: 2px 2px 102px 2px;
            }
            
            button {
                padding: 8px 12px;
                font-size: 12px;
            }
            
            .mobile-controls button {
                padding: 10px;
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .title {
                font-size: 1.6em;
                margin-bottom: 4px;
            }
            
            .score {
                font-size: 1em;
                margin-bottom: 6px;
            }
            
            #gameCanvas {
                max-width: calc(100vw - 20px);
                max-height: calc(100vh - 240px);
            }
            
            .game-container {
                padding: 10px;
                border-radius: 12px;
                margin: 2px 2px 102px 2px;
            }
            
            .instructions {
                font-size: 0.7em;
                line-height: 1.2;
            }
            
            button {
                padding: 6px 10px;
                font-size: 11px;
            }
            
            .mobile-controls {
                max-width: 160px;
                gap: 6px;
            }
            
            .mobile-controls button {
                padding: 8px;
                font-size: 12px;
            }
        }

        @media (max-height: 600px) {
            .title {
                font-size: 1.5em;
                margin-bottom: 3px;
            }
            
            .score {
                font-size: 0.9em;
                margin-bottom: 5px;
            }
            
            #gameCanvas {
                max-height: calc(100vh - 220px);
            }
            
            .instructions {
                font-size: 0.65em;
                line-height: 1.1;
            }
        }

        .footer {
            position: fixed;
            bottom: 55px;
            left: 0;
            width: 100%;
            padding: .75rem 1rem;
            font-size: 14px;
            background: #fafafa;
            border-top: 1px solid #eaeaea;
            display: flex;
            flex-wrap: wrap;
            gap: .5rem;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        @media (max-width: 768px) {
            .footer {
                bottom: 47px;
            }
        }

        .footer a { color: #0077cc; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }

        .qr-wrapper { position: relative; display: inline-block; }
        .qr-img {
            display: none;
            position: absolute;
            bottom: 1.8rem;
            left: 50%;
            transform: translateX(-50%);
            max-width: 140px;
            border: 1px solid #ddd;
            background: #fff;
            padding: 4px;
            border-radius: 6px;
            box-shadow: 0 4px 12px rgba(0,0,0,.15);
        }
        .qr-wrapper:hover .qr-img { display: block; }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="title">🐍 SNAKE GAME</h1>
        <div class="score">分数: <span id="score">0</span> | 最高分: <span id="highScore">0</span></div>
        
        <canvas id="gameCanvas" width="360" height="360"></canvas>
        
        <div class="controls">
            <button onclick="startGame()">开始游戏</button>
            <button onclick="pauseGame()">暂停</button>
            <button onclick="resetGame()">重新开始</button>
        </div>

        <div class="mobile-controls">
            <button class="arrow-up" onclick="changeDirection(0, -1)">↑</button>
            <button class="arrow-left" onclick="changeDirection(-1, 0)">←</button>
            <button class="arrow-right" onclick="changeDirection(1, 0)">→</button>
            <button class="arrow-down" onclick="changeDirection(0, 1)">↓</button>
        </div>

        <div class="instructions">
            <p><strong>游戏规则:</strong></p>
            <p>• 使用方向键或屏幕按钮控制蛇的移动</p>
            <p>• 吃食物长大，避免撞墙和撞自己</p>
            <p>• 每吃一个食物得10分</p>
            <p>• 蛇越长移动越快，挑战更大！</p>
        </div>
    </div>

    <div class="game-over" id="gameOver">
        <h2>GAME OVER</h2>
        <p>最终分数: <span id="finalScore">0</span></p>
        <p id="newRecord" style="display: none; color: #00ff41;">🎉 新纪录！</p>
        <button onclick="resetGame(); document.getElementById('gameOver').style.display='none';">再来一局</button>
    </div>

    <div class="footer">
        Created&nbsp;by：
        <span class="qr-wrapper">
            <a class="qr-link"
                href="https://mp.weixin.qq.com/mp/profile_ext?action=home&__biz=MzI0MzUzOTEwMw==&scene=124#wechat_redirect"
                target="_blank"
                data-img="https://youke1.picui.cn/s1/2025/07/12/6872600d20281.jpg">系统1与系统2</a>
            <img class="qr-img" alt="系统1与系统2公众号二维码">
        </span>
        &nbsp;||&nbsp;广告位：
        <span class="qr-wrapper">
            <a class="qr-link"
                href="https://t.zsxq.com/SjYuX"
                target="_blank"
                data-img="https://youke1.picui.cn/s1/2025/07/12/6871f995b3e7a.jpg">AI编程星球</a>
            <img class="qr-img" alt="AI编程星球二维码">
        </span> |
        <span class="qr-wrapper">
            <a class="qr-link"
                href="https://t.zsxq.com/VTCya"
                target="_blank"
                data-img="https://youke1.picui.cn/s1/2025/07/12/6871f9c361e7d.jpg">副业避坑星球</a>
            <img class="qr-img" alt="副业避坑星球二维码">
        </span> |
        <span class="qr-wrapper">
            <a class="qr-link"
                href="https://www.xiaobot.net/p/ai07?refer=a9625ad2-ec04-4cc8-8549-7511079cb3b5"
                target="_blank"
                data-img="https://youke1.picui.cn/s1/2025/07/12/6871f9ef3edba.jpg">AI&nbsp;产品日报</a>
            <img class="qr-img" alt="AI产品日报二维码">
        </span> |
        <span class="qr-wrapper">
            <a class="qr-link"
                href="https://t.zsxq.com/jcaEa"
                target="_blank"
                data-img="https://youke1.picui.cn/s1/2025/07/12/6871fa39eab33.jpg">AI&nbsp;产品经理大本营</a>
            <img class="qr-img" alt="AI产品经理大本营二维码">
        </span>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');

        const gridSize = 18;
        let tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let food = {};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameRunning = false;
        let gameLoop;
        let lastDirectionChange = 0; // 防止过快改变方向

        highScoreElement.textContent = highScore;

        function randomFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
        }

        function drawGame() {
            clearCanvas();
            drawSnake();
            drawFood();
            moveSnake();
            checkCollision();
        }

        function clearCanvas() {
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid
            ctx.strokeStyle = 'rgba(0, 255, 65, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }
        }

        function drawSnake() {
            ctx.fillStyle = '#00ff41';
            ctx.shadowColor = '#00ff41';
            ctx.shadowBlur = 10;
            
            snake.forEach((segment, index) => {
                if (index === 0) {
                    // Head
                    ctx.fillStyle = '#00ff88';
                } else {
                    ctx.fillStyle = '#00ff41';
                }
                ctx.fillRect(segment.x * gridSize + 2, segment.y * gridSize + 2, gridSize - 4, gridSize - 4);
            });
            
            ctx.shadowBlur = 0;
        }

        function drawFood() {
            ctx.fillStyle = '#ff0040';
            ctx.shadowColor = '#ff0040';
            ctx.shadowBlur = 15;
            ctx.fillRect(food.x * gridSize + 4, food.y * gridSize + 4, gridSize - 8, gridSize - 8);
            ctx.shadowBlur = 0;
        }

        function moveSnake() {
            if (dx === 0 && dy === 0) return;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                randomFood();
                
                // Speed up as score increases (more noticeable but balanced)
                if (gameLoop) {
                    clearInterval(gameLoop);
                    const speed = Math.max(150, 280 - Math.floor(score / 50) * 20);
                    gameLoop = setInterval(drawGame, speed);
                }
            } else {
                snake.pop();
            }
        }

        function checkCollision() {
            const head = snake[0];

            // Wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            // Self collision
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }
        }

        function gameOver() {
            gameRunning = false;
            clearInterval(gameLoop);
            
            document.getElementById('finalScore').textContent = score;
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreElement.textContent = highScore;
                document.getElementById('newRecord').style.display = 'block';
            } else {
                document.getElementById('newRecord').style.display = 'none';
            }
            
            document.getElementById('gameOver').style.display = 'block';
        }

        function startGame() {
            if (!gameRunning) {
                gameRunning = true;
                if (snake.length === 1 && dx === 0 && dy === 0) {
                    dx = 1;
                    dy = 0;
                }
                const speed = Math.max(150, 280 - Math.floor(score / 50) * 20);
                gameLoop = setInterval(drawGame, speed);
            }
        }

        function pauseGame() {
            if (gameRunning) {
                gameRunning = false;
                clearInterval(gameLoop);
            } else if (snake.length > 1 || dx !== 0 || dy !== 0) {
                startGame();
            }
        }

        function resetGame() {
            gameRunning = false;
            clearInterval(gameLoop);
            snake = [{ x: 10, y: 10 }];
            dx = 0;
            dy = 0;
            score = 0;
            scoreElement.textContent = score;
            randomFood();
            drawGame();
        }

        function changeDirection(newDx, newDy) {
            // Prevent reversing into self
            if ((newDx === -dx && dx !== 0) || (newDy === -dy && dy !== 0)) {
                return;
            }
            
            dx = newDx;
            dy = newDy;
            
            if (!gameRunning) {
                startGame();
            }
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    e.preventDefault();
                    changeDirection(0, -1);
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    e.preventDefault();
                    changeDirection(0, 1);
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    e.preventDefault();
                    changeDirection(-1, 0);
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    e.preventDefault();
                    changeDirection(1, 0);
                    break;
                case ' ':
                    e.preventDefault();
                    pauseGame();
                    break;
            }
        });

        // Touch controls for mobile
        let touchStartX, touchStartY;

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (!touchStartX || !touchStartY) return;

            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;

            const diffX = touchStartX - touchEndX;
            const diffY = touchStartY - touchEndY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 0) {
                    changeDirection(-1, 0); // Left
                } else {
                    changeDirection(1, 0);  // Right
                }
            } else {
                if (diffY > 0) {
                    changeDirection(0, -1); // Up
                } else {
                    changeDirection(0, 1);  // Down
                }
            }

            touchStartX = null;
            touchStartY = null;
        });

        // Initialize QR images
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.qr-wrapper').forEach(w => {
                const link = w.querySelector('.qr-link');
                const img = w.querySelector('.qr-img');
                if (link && img && link.dataset.img) {
                    img.src = link.dataset.img.trim();
                }
            });
        });

        // Dynamic canvas sizing
        function resizeCanvas() {
            const maxWidth = Math.min(360, window.innerWidth - 40);
            const maxHeight = Math.min(360, window.innerHeight - 300);
            const size = Math.min(maxWidth, maxHeight);
            
            // Ensure size is divisible by gridSize for proper grid alignment
            const adjustedSize = Math.floor(size / gridSize) * gridSize;
            
            if (adjustedSize >= 180) { // Minimum playable size
                canvas.width = adjustedSize;
                canvas.height = adjustedSize;
                canvas.style.width = adjustedSize + 'px';
                canvas.style.height = adjustedSize + 'px';
                tileCount = canvas.width / gridSize;
            }
        }

        // Initialize game
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        randomFood();
        drawGame();
    </script>
</body>
