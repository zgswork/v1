<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片边框添加工具</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 25px;
            margin-top: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.2rem;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        
        .app-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            flex: 1;
        }
        
        @media (min-width: 768px) {
            .app-container {
                flex-direction: row;
            }
            
            .controls {
                flex: 1;
            }
            
            .preview {
                flex: 1.5;
            }
        }
        
        .upload-section {
            background-color: #f8f9fa;
            border: 2px dashed #ced4da;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        
        .upload-section:hover {
            border-color: #6c757d;
            background-color: #e9ecef;
        }
        
        .upload-icon {
            font-size: 48px;
            color: #6c757d;
            margin-bottom: 15px;
        }
        
        .upload-text {
            color: #495057;
            font-size: 1.1rem;
        }
        
        #imageInput {
            display: none;
        }
        
        .frame-options {
            margin-top: 20px;
        }
        
        .section-title {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e9ecef;
        }
        
        .frame-categories {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .category-btn {
            padding: 8px 15px;
            background-color: #f1f3f4;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        
        .category-btn.active {
            background-color: #4a6ee0;
            color: white;
        }
        
        .frames-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px;
            max-height: 400px;
            overflow-y: auto;
            padding: 5px;
        }
        
        .frame-option {
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            background-color: white;
        }
        
        .frame-option:hover {
            border-color: #4a6ee0;
            transform: translateY(-3px);
        }
        
        .frame-option.active {
            border-color: #4a6ee0;
            box-shadow: 0 5px 15px rgba(74, 110, 224, 0.2);
        }
        
        .frame-preview {
            width: 100%;
            height: 60px;
            border-radius: 8px;
            margin-bottom: 8px;
            background: linear-gradient(45deg, #eee 25%, #fff 25%, #fff 50%, #eee 50%, #eee 75%, #fff 75%);
            background-size: 10px 10px;
        }
        
        .frame-name {
            font-size: 0.8rem;
            color: #495057;
        }
        
        .preview-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            min-height: 400px;
            position: relative;
        }
        
        .image-preview {
            max-width: 100%;
            max-height: 350px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: none;
        }
        
        .placeholder-text {
            color: #6c757d;
            text-align: center;
            font-size: 1.1rem;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
            min-width: 120px;
        }
        
        .btn-primary {
            background-color: #4a6ee0;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #3a5ec9;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        
        .btn:disabled {
            background-color: #ced4da;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #4a6ee0;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 相框样式 - 圆角边框 */
        .simple-frame {
            border: 3px solid #f0f0f0;
            border-radius: 15px;
            box-sizing: border-box;
        }
        
        .classic-frame {
            border: 4px solid #8B4513;
            border-radius: 15px;
            box-sizing: border-box;
        }
        
        .elegant-frame {
            border: 5px solid #4a6ee0;
            border-radius: 15px;
            box-sizing: border-box;
        }
        
        .modern-frame {
            border: 2px solid #333;
            border-radius: 15px;
            box-shadow: 0 0 0 1px #4a6ee0, 0 0 0 2px #333;
            box-sizing: border-box;
        }
        
        .vintage-frame {
            border: 2.4px solid #D2B48C;
            border-radius: 15px;
            background-color: #F5F5DC;
            box-shadow: inset 0 0 4px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        
        .ornate-frame {
            border: 4px solid #D2691E;
            border-radius: 15px;
            box-shadow: 0 0 2px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        
        .wood-frame {
            border: 5px solid #8B4513;
            border-radius: 15px;
            background: linear-gradient(45deg, #8B4513, #A0522D, #8B4513);
            box-sizing: border-box;
        }
        
        .floral-frame {
            border: 3.6px solid #FF69B4;
            border-radius: 15px;
            box-sizing: border-box;
        }
        
        .gold-frame {
            border: 4.4px solid #FFD700;
            border-radius: 15px;
            box-shadow: 0 0 3px rgba(255, 215, 0, 0.5);
            box-sizing: border-box;
        }
        
        .silver-frame {
            border: 3.6px solid #C0C0C0;
            border-radius: 15px;
            box-shadow: 0 0 2px rgba(192, 192, 192, 0.7);
            box-sizing: border-box;
        }
        
        .black-frame {
            border: 4px solid #000;
            border-radius: 15px;
            box-sizing: border-box;
        }
        
        .blue-frame {
            border: 3.6px solid #1E90FF;
            border-radius: 15px;
            box-sizing: border-box;
        }
        
        .green-frame {
            border: 3.6px solid #32CD32;
            border-radius: 15px;
            box-sizing: border-box;
        }
        
        .rainbow-frame {
            border: 4px solid transparent;
            border-radius: 15px;
            border-image: linear-gradient(45deg, red, orange, yellow, green, blue, indigo, violet) 1;
            box-sizing: border-box;
        }
        
        /* 新增边框样式 */
        .polaroid-frame {
            border: 3px solid white;
            border-radius: 15px;
            box-shadow: 0 0.8px 1.6px rgba(0,0,0,0.1);
            background-color: white;
            box-sizing: border-box;
        }
        
        .grunge-frame {
            border: 4px solid #5D4037;
            border-radius: 15px;
            background: linear-gradient(45deg, #5D4037, #795548, #5D4037);
            box-shadow: 0 0 3px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        
        .canvas-container {
            position: absolute;
            top: -9999px;
            left: -9999px;
        }
        
        /* 新增边框预览样式 */
        .polaroid-preview {
            background: white;
            border: 0.4px solid #ddd;
            border-radius: 8px;
        }
        
        .grunge-preview {
            background: linear-gradient(45deg, #5D4037, #795548, #5D4037);
            border-radius: 8px;
        }
        
        /* 底部信息样式 */
        .footer {
            text-align: center;
            margin-top: 30px;
            padding: 15px;
            color: #666;
            font-size: 0.9rem;
            border-top: 1px solid #e9ecef;
        }
        
        /* 响应式按钮调整 */
        @media (max-width: 480px) {
            .btn {
                padding: 10px 15px;
                font-size: 0.9rem;
                min-width: 100px;
            }
            
            .action-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .action-buttons .btn {
                width: 100%;
                max-width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>图片边框添加工具</h1>
        <p class="subtitle">上传图片，选择边框风格，下载精美效果</p>
        
        <div class="app-container">
            <div class="controls">
                <div class="upload-section" id="uploadArea">
                    <div class="upload-icon">📁</div>
                    <p class="upload-text">点击选择图片或拖拽图片到此处</p>
                    <input type="file" id="imageInput" accept="image/*">
                </div>
                
                <div class="frame-options">
                    <h3 class="section-title">选择边框风格</h3>
                    
                    <div class="frame-categories">
                        <button class="category-btn active" data-category="all">全部</button>
                        <button class="category-btn" data-category="simple">简约</button>
                        <button class="category-btn" data-category="classic">经典</button>
                        <button class="category-btn" data-category="colorful">彩色</button>
                    </div>
                    
                    <div class="frames-grid">
                        <!-- 简约风格边框 -->
                        <div class="frame-option active" data-frame="simple" data-category="simple">
                            <div class="frame-preview simple-frame"></div>
                            <div class="frame-name">简约灰边</div>
                        </div>
                        
                        <div class="frame-option" data-frame="modern" data-category="simple">
                            <div class="frame-preview modern-frame"></div>
                            <div class="frame-name">现代双框</div>
                        </div>
                        
                        <div class="frame-option" data-frame="black" data-category="simple">
                            <div class="frame-preview black-frame"></div>
                            <div class="frame-name">纯黑边框</div>
                        </div>
                        
                        <div class="frame-option" data-frame="polaroid" data-category="simple">
                            <div class="frame-preview polaroid-preview"></div>
                            <div class="frame-name">宝丽来风格</div>
                        </div>
                        
                        <!-- 经典风格边框 -->
                        <div class="frame-option" data-frame="classic" data-category="classic">
                            <div class="frame-preview classic-frame"></div>
                            <div class="frame-name">经典木纹</div>
                        </div>
                        
                        <div class="frame-option" data-frame="vintage" data-category="classic">
                            <div class="frame-preview vintage-frame"></div>
                            <div class="frame-name">复古米色</div>
                        </div>
                        
                        <div class="frame-option" data-frame="wood" data-category="classic">
                            <div class="frame-preview wood-frame"></div>
                            <div class="frame-name">木质边框</div>
                        </div>
                        
                        <div class="frame-option" data-frame="gold" data-category="classic">
                            <div class="frame-preview gold-frame"></div>
                            <div class="frame-name">金色边框</div>
                        </div>
                        
                        <div class="frame-option" data-frame="silver" data-category="classic">
                            <div class="frame-preview silver-frame"></div>
                            <div class="frame-name">银色边框</div>
                        </div>
                        
                        <div class="frame-option" data-frame="grunge" data-category="classic">
                            <div class="frame-preview grunge-preview"></div>
                            <div class="frame-name">复古做旧</div>
                        </div>
                        
                        <!-- 彩色风格边框 -->
                        <div class="frame-option" data-frame="elegant" data-category="colorful">
                            <div class="frame-preview elegant-frame"></div>
                            <div class="frame-name">优雅蓝边</div>
                        </div>
                        
                        <div class="frame-option" data-frame="ornate" data-category="colorful">
                            <div class="frame-preview ornate-frame"></div>
                            <div class="frame-name">华丽装饰</div>
                        </div>
                        
                        <div class="frame-option" data-frame="floral" data-category="colorful">
                            <div class="frame-preview floral-frame"></div>
                            <div class="frame-name">粉色边框</div>
                        </div>
                        
                        <div class="frame-option" data-frame="blue" data-category="colorful">
                            <div class="frame-preview blue-frame"></div>
                            <div class="frame-name">天蓝边框</div>
                        </div>
                        
                        <div class="frame-option" data-frame="green" data-category="colorful">
                            <div class="frame-preview green-frame"></div>
                            <div class="frame-name">翠绿边框</div>
                        </div>
                        
                        <div class="frame-option" data-frame="rainbow" data-category="colorful">
                            <div class="frame-preview rainbow-frame"></div>
                            <div class="frame-name">彩虹边框</div>
                        </div>
                    </div>
                </div>
                
                <div class="action-buttons">
                    <button class="btn btn-primary" id="downloadBtn" disabled>
                        <span>下载图片</span>
                    </button>
                    <button class="btn btn-secondary" id="resetBtn">
                        <span>重新开始</span>
                    </button>
                </div>
            </div>
            
            <div class="preview">
                <h3 class="section-title">预览效果</h3>
                
                <div class="preview-container">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>正在处理图片...</p>
                    </div>
                    
                    <img id="imagePreview" class="image-preview" alt="预览图片">
                    
                    <p id="placeholderText" class="placeholder-text">请上传图片以查看预览效果</p>
                </div>
            </div>
        </div>
        
        <div class="footer">
            本工具由 @深圳老易 使用DeepSeek制作
        </div>
    </div>

    <!-- 隐藏的Canvas用于生成带边框的图片 -->
    <div class="canvas-container">
        <canvas id="frameCanvas"></canvas>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const imageInput = document.getElementById('imageInput');
            const uploadArea = document.getElementById('uploadArea');
            const imagePreview = document.getElementById('imagePreview');
            const placeholderText = document.getElementById('placeholderText');
            const downloadBtn = document.getElementById('downloadBtn');
            const resetBtn = document.getElementById('resetBtn');
            const loading = document.querySelector('.loading');
            const frameOptions = document.querySelectorAll('.frame-option');
            const categoryBtns = document.querySelectorAll('.category-btn');
            const frameCanvas = document.getElementById('frameCanvas');
            const ctx = frameCanvas.getContext('2d');
            
            let currentImage = null;
            let currentFrame = 'simple';
            
            // 上传区域点击事件
            uploadArea.addEventListener('click', () => {
                imageInput.click();
            });
            
            // 拖拽功能
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = '#4a6ee0';
                uploadArea.style.backgroundColor = '#e9ecef';
            });
            
            uploadArea.addEventListener('dragleave', () => {
                uploadArea.style.borderColor = '#ced4da';
                uploadArea.style.backgroundColor = '#f8f9fa';
            });
            
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = '#ced4da';
                uploadArea.style.backgroundColor = '#f8f9fa';
                
                if (e.dataTransfer.files.length) {
                    handleImageUpload(e.dataTransfer.files[0]);
                }
            });
            
            // 文件选择事件
            imageInput.addEventListener('change', (e) => {
                if (e.target.files.length) {
                    handleImageUpload(e.target.files[0]);
                }
            });
            
            // 处理图片上传
            function handleImageUpload(file) {
                if (!file.type.match('image.*')) {
                    alert('请上传图片文件！');
                    return;
                }
                
                // 显示加载状态
                loading.style.display = 'block';
                placeholderText.style.display = 'none';
                imagePreview.style.display = 'none';
                
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    // 创建图片对象
                    const img = new Image();
                    img.onload = function() {
                        currentImage = img;
                        applyFrame(currentFrame);
                        
                        // 隐藏加载状态，显示图片
                        loading.style.display = 'none';
                        imagePreview.style.display = 'block';
                        downloadBtn.disabled = false;
                    };
                    img.src = e.target.result;
                };
                
                reader.readAsDataURL(file);
            }
            
            // 边框选择事件
            frameOptions.forEach(option => {
                option.addEventListener('click', () => {
                    // 移除所有active类
                    frameOptions.forEach(opt => opt.classList.remove('active'));
                    
                    // 添加active类到当前选项
                    option.classList.add('active');
                    
                    // 更新当前边框
                    currentFrame = option.getAttribute('data-frame');
                    
                    // 应用边框效果
                    if (currentImage) {
                        applyFrame(currentFrame);
                    }
                });
            });
            
            // 分类筛选
            categoryBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    // 更新激活的分类按钮
                    categoryBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    const category = btn.getAttribute('data-category');
                    
                    // 显示/隐藏边框选项
                    frameOptions.forEach(option => {
                        if (category === 'all' || option.getAttribute('data-category') === category) {
                            option.style.display = 'block';
                        } else {
                            option.style.display = 'none';
                        }
                    });
                });
            });
            
            // 应用边框效果
            function applyFrame(frameType) {
                // 移除所有边框类
                const frameClasses = [
                    'simple-frame', 'classic-frame', 'elegant-frame', 
                    'modern-frame', 'vintage-frame', 'ornate-frame',
                    'wood-frame', 'floral-frame', 'gold-frame',
                    'silver-frame', 'black-frame', 'blue-frame', 
                    'green-frame', 'rainbow-frame', 'polaroid-frame',
                    'grunge-frame'
                ];
                
                imagePreview.classList.remove(...frameClasses);
                
                // 添加当前边框类
                imagePreview.classList.add(`${frameType}-frame`);
                
                // 更新图片源
                imagePreview.src = currentImage.src;
            }
            
            // 下载功能
            downloadBtn.addEventListener('click', () => {
                if (!currentImage) return;
                
                // 使用Canvas合成带边框的图片
                const frameWidth = getFrameWidth(currentFrame);
                const padding = 4; // 额外的内边距
                const borderRadius = 15; // 圆角半径
                
                // 计算Canvas尺寸
                const canvasWidth = currentImage.width + (frameWidth * 2) + (padding * 2);
                const canvasHeight = currentImage.height + (frameWidth * 2) + (padding * 2);
                
                // 设置Canvas尺寸
                frameCanvas.width = canvasWidth;
                frameCanvas.height = canvasHeight;
                
                // 绘制背景（白色）
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvasWidth, canvasHeight);
                
                // 绘制边框
                drawFrame(ctx, currentFrame, 0, 0, canvasWidth, canvasHeight, frameWidth, borderRadius);
                
                // 绘制图片（带圆角）
                ctx.save();
                // 创建圆角路径
                roundRect(ctx, frameWidth + padding, frameWidth + padding, 
                         currentImage.width, currentImage.height, borderRadius);
                ctx.clip();
                
                // 绘制图片
                ctx.drawImage(
                    currentImage, 
                    frameWidth + padding, 
                    frameWidth + padding, 
                    currentImage.width, 
                    currentImage.height
                );
                ctx.restore();
                
                // 创建下载链接
                const link = document.createElement('a');
                link.download = `framed-image-${new Date().getTime()}.png`;
                link.href = frameCanvas.toDataURL('image/png');
                link.click();
            });
            
            // 绘制圆角矩形路径
            function roundRect(ctx, x, y, width, height, radius) {
                ctx.beginPath();
                ctx.moveTo(x + radius, y);
                ctx.lineTo(x + width - radius, y);
                ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
                ctx.lineTo(x + width, y + height - radius);
                ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
                ctx.lineTo(x + radius, y + height);
                ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
                ctx.lineTo(x, y + radius);
                ctx.quadraticCurveTo(x, y, x + radius, y);
                ctx.closePath();
            }
            
            // 获取边框宽度
            function getFrameWidth(frameType) {
                const widths = {
                    'simple': 3,
                    'classic': 4,
                    'elegant': 5,
                    'modern': 5, // 2px边框 + 1px阴影 + 2px阴影
                    'vintage': 2.4,
                    'ornate': 4,
                    'wood': 5,
                    'floral': 3.6,
                    'gold': 4.4,
                    'silver': 3.6,
                    'black': 4,
                    'blue': 3.6,
                    'green': 3.6,
                    'rainbow': 4,
                    'polaroid': 3,
                    'grunge': 4
                };
                
                return widths[frameType] || 3;
            }
            
            // 绘制边框（带圆角）
            function drawFrame(ctx, frameType, x, y, width, height, frameWidth, borderRadius) {
                ctx.save();
                
                // 创建圆角矩形路径
                roundRect(ctx, x, y, width, height, borderRadius);
                ctx.clip();
                
                switch(frameType) {
                    case 'simple':
                        ctx.fillStyle = '#f0f0f0';
                        ctx.fillRect(x, y, width, height);
                        break;
                        
                    case 'classic':
                        ctx.fillStyle = '#8B4513';
                        ctx.fillRect(x, y, width, height);
                        break;
                        
                    case 'elegant':
                        ctx.fillStyle = '#4a6ee0';
                        ctx.fillRect(x, y, width, height);
                        break;
                        
                    case 'modern':
                        // 外框
                        ctx.fillStyle = '#333';
                        ctx.fillRect(x, y, width, height);
                        
                        // 中框
                        ctx.fillStyle = '#4a6ee0';
                        ctx.fillRect(x+1, y+1, width-2, height-2);
                        
                        // 内框
                        ctx.fillStyle = '#333';
                        ctx.fillRect(x+2, y+2, width-4, height-4);
                        break;
                        
                    case 'vintage':
                        ctx.fillStyle = '#D2B48C';
                        ctx.fillRect(x, y, width, height);
                        
                        // 添加内部阴影效果
                        ctx.fillStyle = 'rgba(0,0,0,0.1)';
                        ctx.fillRect(x+1, y+1, width-2, height-2);
                        break;
                        
                    case 'ornate':
                        ctx.fillStyle = '#D2691E';
                        ctx.fillRect(x, y, width, height);
                        
                        // 添加阴影效果
                        ctx.shadowColor = 'rgba(0,0,0,0.3)';
                        ctx.shadowBlur = 2;
                        ctx.fillRect(x, y, width, height);
                        ctx.shadowBlur = 0;
                        break;
                        
                    case 'wood':
                        // 创建木质纹理
                        const woodGradient = ctx.createLinearGradient(x, y, x+width, y+height);
                        woodGradient.addColorStop(0, '#8B4513');
                        woodGradient.addColorStop(0.5, '#A0522D');
                        woodGradient.addColorStop(1, '#8B4513');
                        
                        ctx.fillStyle = woodGradient;
                        ctx.fillRect(x, y, width, height);
                        break;
                        
                    case 'floral':
                        ctx.fillStyle = '#FF69B4';
                        ctx.fillRect(x, y, width, height);
                        break;
                        
                    case 'gold':
                        ctx.fillStyle = '#FFD700';
                        ctx.fillRect(x, y, width, height);
                        
                        // 添加金色光泽
                        ctx.shadowColor = 'rgba(255, 215, 0, 0.5)';
                        ctx.shadowBlur = 3;
                        ctx.fillRect(x, y, width, height);
                        ctx.shadowBlur = 0;
                        break;
                        
                    case 'silver':
                        ctx.fillStyle = '#C0C0C0';
                        ctx.fillRect(x, y, width, height);
                        
                        // 添加银色光泽
                        ctx.shadowColor = 'rgba(192, 192, 192, 0.7)';
                        ctx.shadowBlur = 2;
                        ctx.fillRect(x, y, width, height);
                        ctx.shadowBlur = 0;
                        break;
                        
                    case 'black':
                        ctx.fillStyle = '#000';
                        ctx.fillRect(x, y, width, height);
                        break;
                        
                    case 'blue':
                        ctx.fillStyle = '#1E90FF';
                        ctx.fillRect(x, y, width, height);
                        break;
                        
                    case 'green':
                        ctx.fillStyle = '#32CD32';
                        ctx.fillRect(x, y, width, height);
                        break;
                        
                    case 'rainbow':
                        // 创建彩虹渐变
                        const rainbowGradient = ctx.createLinearGradient(x, y, x+width, y);
                        rainbowGradient.addColorStop(0, 'red');
                        rainbowGradient.addColorStop(0.16, 'orange');
                        rainbowGradient.addColorStop(0.33, 'yellow');
                        rainbowGradient.addColorStop(0.5, 'green');
                        rainbowGradient.addColorStop(0.66, 'blue');
                        rainbowGradient.addColorStop(0.83, 'indigo');
                        rainbowGradient.addColorStop(1, 'violet');
                        
                        ctx.fillStyle = rainbowGradient;
                        ctx.fillRect(x, y, width, height);
                        break;
                        
                    case 'polaroid':
                        // 宝丽来风格边框
                        ctx.fillStyle = 'white';
                        ctx.fillRect(x, y, width, height);
                        
                        // 添加阴影效果
                        ctx.shadowColor = 'rgba(0,0,0,0.1)';
                        ctx.shadowBlur = 0.8;
                        ctx.shadowOffsetY = 0.8;
                        ctx.fillRect(x, y, width, height);
                        ctx.shadowBlur = 0;
                        ctx.shadowOffsetY = 0;
                        break;
                        
                    case 'grunge':
                        // 复古做旧风格
                        const grungeGradient = ctx.createLinearGradient(x, y, x+width, y+height);
                        grungeGradient.addColorStop(0, '#5D4037');
                        grungeGradient.addColorStop(0.5, '#795548');
                        grungeGradient.addColorStop(1, '#5D4037');
                        
                        ctx.fillStyle = grungeGradient;
                        ctx.fillRect(x, y, width, height);
                        
                        // 添加做旧效果
                        ctx.shadowColor = 'rgba(0,0,0,0.3)';
                        ctx.shadowBlur = 3;
                        ctx.fillRect(x, y, width, height);
                        ctx.shadowBlur = 0;
                        break;
                        
                    default:
                        ctx.fillStyle = '#f0f0f0';
                        ctx.fillRect(x, y, width, height);
                }
                
                ctx.restore();
            }
            
            // 重置功能
            resetBtn.addEventListener('click', () => {
                // 重置所有状态
                imageInput.value = '';
                currentImage = null;
                imagePreview.src = '';
                imagePreview.style.display = 'none';
                placeholderText.style.display = 'block';
                downloadBtn.disabled = true;
                
                // 重置边框选择
                frameOptions.forEach(opt => opt.classList.remove('active'));
                document.querySelector('.frame-option[data-frame="simple"]').classList.add('active');
                currentFrame = 'simple';
                
                // 重置分类
                categoryBtns.forEach(b => b.classList.remove('active'));
                document.querySelector('.category-btn[data-category="all"]').classList.add('active');
                
                // 显示所有边框选项
                frameOptions.forEach(option => {
                    option.style.display = 'block';
                });
            });
        });
    </script>
</body>
</html>
