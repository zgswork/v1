<!DOCTYPE html>
<html lang="zh">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>QRGen — 二维码生成器</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link
            href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+SC:wght@300;400;700&family=Noto+Sans+JP:wght@300;400;700&display=swap"
            rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
        <style>
            :root {
                --bg: #0a0a0a;
                --surface: #141414;
                --surface2: #1e1e1e;
                --border: #2a2a2a;
                --accent: #e8ff47;
                --accent2: #ff6b35;
                --text: #f0f0f0;
                --text2: #888;
                --text3: #555;
                --radius: 4px;
                --font-mono: 'Space Mono', monospace;
                --font-body: 'Noto Sans SC', sans-serif;
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                background: var(--bg);
                color: var(--text);
                font-family: var(--font-body);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                overflow-x: hidden;
            }

            /* Grid bg */
            body::before {
                content: '';
                position: fixed;
                inset: 0;
                background-image:
                    linear-gradient(rgba(232, 255, 71, 0.03) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(232, 255, 71, 0.03) 1px, transparent 1px);
                background-size: 40px 40px;
                pointer-events: none;
                z-index: 0;
            }

            /* ── Header ── */
            header {
                position: relative;
                z-index: 10;
                padding: 24px 40px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                border-bottom: 1px solid var(--border);
            }

            .logo {
                font-family: var(--font-mono);
                font-size: 20px;
                font-weight: 700;
                letter-spacing: -0.5px;
                color: var(--text);
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .logo-dot {
                width: 10px;
                height: 10px;
                background: var(--accent);
                border-radius: 50%;
                animation: pulse 2s infinite;
            }

            @keyframes pulse {

                0%,
                100% {
                    transform: scale(1);
                    opacity: 1;
                }

                50% {
                    transform: scale(1.4);
                    opacity: 0.7;
                }
            }

            /* Language selector */
            .lang-wrap {
                display: flex;
                gap: 6px;
                align-items: center;
            }

            .lang-label {
                font-family: var(--font-mono);
                font-size: 11px;
                color: var(--text3);
                text-transform: uppercase;
                letter-spacing: 1px;
                margin-right: 4px;
            }

            .lang-btn {
                background: none;
                border: 1px solid var(--border);
                color: var(--text2);
                font-family: var(--font-mono);
                font-size: 11px;
                padding: 5px 10px;
                cursor: pointer;
                border-radius: var(--radius);
                transition: all 0.2s;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }

            .lang-btn:hover {
                border-color: var(--accent);
                color: var(--accent);
            }

            .lang-btn.active {
                background: var(--accent);
                border-color: var(--accent);
                color: #000;
                font-weight: 700;
            }

            /* ── Hero ── */
            .hero {
                position: relative;
                z-index: 10;
                padding: 60px 40px 20px;
                max-width: 900px;
                margin: 0 auto;
                width: 100%;
            }

            .hero-tag {
                font-family: var(--font-mono);
                font-size: 11px;
                color: var(--accent);
                text-transform: uppercase;
                letter-spacing: 3px;
                margin-bottom: 16px;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .hero-tag::before {
                content: '';
                display: block;
                width: 24px;
                height: 1px;
                background: var(--accent);
            }

            .hero-title {
                font-size: clamp(36px, 6vw, 72px);
                font-weight: 700;
                line-height: 1.05;
                letter-spacing: -2px;
                margin-bottom: 16px;
            }

            .hero-title em {
                font-style: normal;
                color: var(--accent);
                position: relative;
            }

            .hero-sub {
                font-size: 15px;
                color: var(--text2);
                font-weight: 300;
                line-height: 1.6;
                max-width: 480px;
            }

            /* ── Main layout ── */
            .main {
                position: relative;
                z-index: 10;
                flex: 1;
                max-width: 900px;
                margin: 0 auto;
                width: 100%;
                padding: 40px 40px 80px;
                display: grid;
                grid-template-columns: 1fr 320px;
                gap: 32px;
                align-items: start;
            }

            /* Left panel */
            .panel {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 8px;
                overflow: hidden;
            }

            .panel-header {
                padding: 14px 20px;
                border-bottom: 1px solid var(--border);
                display: flex;
                align-items: center;
                gap: 8px;
                font-family: var(--font-mono);
                font-size: 11px;
                color: var(--text3);
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            .panel-header-dot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: var(--border);
            }

            .panel-header-dot.g {
                background: #4caf50;
            }

            .panel-header-dot.y {
                background: var(--accent);
            }

            .panel-header-dot.r {
                background: var(--accent2);
            }

            .panel-body {
                padding: 24px;
            }

            /* Input */
            .field {
                margin-bottom: 20px;
            }

            .field-label {
                font-family: var(--font-mono);
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 1.5px;
                color: var(--text2);
                margin-bottom: 8px;
                display: block;
            }

            textarea {
                width: 100%;
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                color: var(--text);
                font-family: var(--font-mono);
                font-size: 13px;
                padding: 14px;
                resize: vertical;
                min-height: 120px;
                outline: none;
                transition: border-color 0.2s;
                line-height: 1.6;
            }

            textarea:focus {
                border-color: var(--accent);
            }

            textarea::placeholder {
                color: var(--text3);
            }

            /* Options row */
            .options-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 16px;
                margin-bottom: 20px;
            }

            select,
            input[type=color],
            input[type=range] {
                width: 100%;
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                color: var(--text);
                font-family: var(--font-mono);
                font-size: 12px;
                padding: 10px 12px;
                outline: none;
                cursor: pointer;
                transition: border-color 0.2s;
                appearance: none;
                -webkit-appearance: none;
            }

            select:focus,
            input[type=color]:focus {
                border-color: var(--accent);
            }

            .color-row {
                display: flex;
                gap: 12px;
            }

            .color-field {
                flex: 1;
            }

            input[type=color] {
                height: 40px;
                padding: 4px 6px;
                cursor: pointer;
            }

            .color-label {
                font-family: var(--font-mono);
                font-size: 10px;
                color: var(--text3);
                text-transform: uppercase;
                letter-spacing: 1px;
                margin-bottom: 6px;
                display: block;
            }

            /* Size slider */
            .slider-row {
                margin-bottom: 20px;
            }

            .slider-header {
                display: flex;
                justify-content: space-between;
                margin-bottom: 8px;
            }

            input[type=range] {
                padding: 0;
                height: 4px;
                border: none;
                background: var(--border);
                border-radius: 2px;
                outline: none;
                cursor: pointer;
            }

            input[type=range]::-webkit-slider-thumb {
                appearance: none;
                width: 16px;
                height: 16px;
                border-radius: 50%;
                background: var(--accent);
                cursor: pointer;
                border: 2px solid var(--bg);
            }

            /* Generate button */
            .btn-generate {
                width: 100%;
                padding: 16px;
                background: var(--accent);
                color: #000;
                border: none;
                border-radius: var(--radius);
                font-family: var(--font-mono);
                font-size: 13px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 2px;
                cursor: pointer;
                transition: all 0.2s;
                position: relative;
                overflow: hidden;
            }

            .btn-generate::after {
                content: '';
                position: absolute;
                inset: 0;
                background: rgba(255, 255, 255, 0.15);
                transform: translateX(-100%);
                transition: transform 0.3s;
            }

            .btn-generate:hover::after {
                transform: translateX(0);
            }

            .btn-generate:active {
                transform: scale(0.98);
            }

            /* ── QR Panel ── */
            .qr-panel {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 8px;
                overflow: hidden;
                position: sticky;
                top: 20px;
            }

            .qr-display {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 280px;
                padding: 32px;
                position: relative;
            }

            .qr-placeholder {
                text-align: center;
                color: var(--text3);
            }

            .qr-placeholder-icon {
                width: 80px;
                height: 80px;
                border: 2px dashed var(--border);
                border-radius: 8px;
                margin: 0 auto 16px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 28px;
                position: relative;
            }

            /* Animated corners */
            .qr-placeholder-icon::before,
            .qr-placeholder-icon::after {
                content: '';
                position: absolute;
                width: 12px;
                height: 12px;
                border-color: var(--accent);
                border-style: solid;
            }

            .qr-placeholder-icon::before {
                top: -2px;
                left: -2px;
                border-width: 2px 0 0 2px;
            }

            .qr-placeholder-icon::after {
                bottom: -2px;
                right: -2px;
                border-width: 0 2px 2px 0;
            }

            .qr-placeholder p {
                font-size: 12px;
                font-family: var(--font-mono);
                letter-spacing: 0.5px;
            }

            #qrcode {
                display: none;
            }

            #qrcode canvas,
            #qrcode img {
                border-radius: 4px;
                max-width: 100%;
            }

            .qr-actions {
                padding: 16px 20px;
                border-top: 1px solid var(--border);
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .btn-action {
                padding: 11px;
                background: var(--surface2);
                color: var(--text);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                font-family: var(--font-mono);
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 1px;
                cursor: pointer;
                transition: all 0.2s;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
            }

            .btn-action:hover {
                border-color: var(--accent);
                color: var(--accent);
                background: rgba(232, 255, 71, 0.05);
            }

            .btn-action.primary {
                background: var(--surface2);
                border-color: var(--accent2);
                color: var(--accent2);
            }

            .btn-action.primary:hover {
                background: rgba(255, 107, 53, 0.08);
            }

            /* QR info strip */
            .qr-info {
                padding: 12px 20px;
                border-top: 1px solid var(--border);
                font-family: var(--font-mono);
                font-size: 10px;
                color: var(--text3);
                display: flex;
                justify-content: space-between;
            }

            #char-count {
                color: var(--accent);
            }

            /* Error correction badge */
            .ec-badge {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                font-family: var(--font-mono);
                font-size: 10px;
                color: var(--text3);
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            .ec-dot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: #4caf50;
            }

            /* Toast */
            .toast {
                position: fixed;
                bottom: 32px;
                left: 50%;
                transform: translateX(-50%) translateY(20px);
                background: var(--surface2);
                border: 1px solid var(--accent);
                color: var(--accent);
                font-family: var(--font-mono);
                font-size: 12px;
                padding: 12px 24px;
                border-radius: var(--radius);
                opacity: 0;
                transition: all 0.3s;
                pointer-events: none;
                z-index: 100;
                letter-spacing: 1px;
                text-transform: uppercase;
            }

            .toast.show {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }

            /* Footer */
            footer {
                position: relative;
                z-index: 10;
                padding: 20px 40px;
                border-top: 1px solid var(--border);
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .footer-text {
                font-family: var(--font-mono);
                font-size: 11px;
                color: var(--text3);
            }

            .footer-version {
                font-family: var(--font-mono);
                font-size: 11px;
                color: var(--text3);
                background: var(--surface);
                border: 1px solid var(--border);
                padding: 4px 10px;
                border-radius: var(--radius);
            }

            /* ── Responsive ── */
            @media (max-width: 700px) {
                header {
                    padding: 16px 20px;
                }

                .hero {
                    padding: 32px 20px 16px;
                }

                .main {
                    grid-template-columns: 1fr;
                    padding: 24px 20px 60px;
                    gap: 20px;
                }

                .qr-panel {
                    position: static;
                }

                footer {
                    padding: 16px 20px;
                }

                .hero-title {
                    letter-spacing: -1px;
                }
            }

            /* Animation for QR generation */
            @keyframes qr-appear {
                from {
                    opacity: 0;
                    transform: scale(0.9);
                }

                to {
                    opacity: 1;
                    transform: scale(1);
                }
            }

            .qr-animated {
                animation: qr-appear 0.3s ease-out;
            }

            /* select arrow */
            .select-wrap {
                position: relative;
            }

            .select-wrap::after {
                content: '▾';
                position: absolute;
                right: 12px;
                top: 50%;
                transform: translateY(-50%);
                color: var(--text3);
                font-size: 11px;
                pointer-events: none;
            }
        </style>
    </head>

    <body>

        <header>
            <div class="logo">
                <span class="logo-dot"></span>
                QRGen
            </div>
            <div class="lang-wrap">
                <span class="lang-label" data-i18n="lang">Lang</span>
                <button class="lang-btn active" onclick="setLang('zh')">中文</button>
                <button class="lang-btn" onclick="setLang('en')">EN</button>
                <button class="lang-btn" onclick="setLang('ja')">日本語</button>
                <button class="lang-btn" onclick="setLang('ko')">한국어</button>
                <button class="lang-btn" onclick="setLang('es')">ES</button>
                <button class="lang-btn" onclick="setLang('fr')">FR</button>
            </div>
        </header>

        <div class="hero">
            <div class="hero-tag" data-i18n="tag">QR Code Generator</div>
            <h1 class="hero-title" data-i18n="title">Generate<br><em>QR Codes</em><br>Instantly.</h1>
            <p class="hero-sub" data-i18n="subtitle">输入任意文字或链接，即刻生成高质量二维码。支持自定义颜色、尺寸与纠错等级。</p>
        </div>

        <div class="main">

            <!-- Left: Controls -->
            <div>
                <div class="panel">
                    <div class="panel-header">
                        <span class="panel-header-dot r"></span>
                        <span class="panel-header-dot y"></span>
                        <span class="panel-header-dot g"></span>
                        <span style="margin-left:8px" data-i18n="input_panel">输入内容</span>
                    </div>
                    <div class="panel-body">

                        <div class="field">
                            <label class="field-label" data-i18n="content_label">Content / 内容</label>
                            <textarea id="inputText" placeholder="https://example.com 或输入任意文字..." rows="5"
                                oninput="updateCharCount()"></textarea>
                        </div>

                        <div class="options-grid">
                            <div class="field">
                                <label class="field-label" data-i18n="size_label">Size / 尺寸</label>
                                <div class="select-wrap">
                                    <select id="qrSize">
                                        <option value="128">128 × 128</option>
                                        <option value="200">200 × 200</option>
                                        <option value="256" selected>256 × 256</option>
                                        <option value="400">400 × 400</option>
                                        <option value="512">512 × 512</option>
                                    </select>
                                </div>
                            </div>
                            <div class="field">
                                <label class="field-label" data-i18n="ec_label">Error Correction</label>
                                <div class="select-wrap">
                                    <select id="ecLevel">
                                        <option value="L">L — 7%</option>
                                        <option value="M" selected>M — 15%</option>
                                        <option value="Q">Q — 25%</option>
                                        <option value="H">H — 30%</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="field">
                            <label class="field-label" data-i18n="color_label">Colors / 颜色</label>
                            <div class="color-row">
                                <div class="color-field">
                                    <span class="color-label" data-i18n="fg_color">前景色 Foreground</span>
                                    <input type="color" id="fgColor" value="#000000">
                                </div>
                                <div class="color-field">
                                    <span class="color-label" data-i18n="bg_color">背景色 Background</span>
                                    <input type="color" id="bgColor" value="#ffffff">
                                </div>
                            </div>
                        </div>

                        <div class="field">
                            <label class="field-label" data-i18n="format_label">Export Format / 导出格式</label>
                            <div class="select-wrap">
                                <select id="exportFormat">
                                    <option value="png">PNG</option>
                                    <option value="svg">SVG (Canvas-based)</option>
                                </select>
                            </div>
                        </div>

                        <button class="btn-generate" onclick="generateQR()">
                            <span data-i18n="gen_btn">⬡ Generate QR Code</span>
                        </button>

                    </div>
                </div>
            </div>

            <!-- Right: QR Preview -->
            <div class="qr-panel">
                <div class="panel-header">
                    <span class="panel-header-dot r"></span>
                    <span class="panel-header-dot y"></span>
                    <span class="panel-header-dot g"></span>
                    <span style="margin-left:8px" data-i18n="preview_panel">预览</span>
                </div>

                <div class="qr-display" id="qrDisplay">
                    <div class="qr-placeholder" id="qrPlaceholder">
                        <div class="qr-placeholder-icon">
                            <span>⬡</span>
                        </div>
                        <p data-i18n="placeholder_text">等待生成…</p>
                    </div>
                    <div id="qrcode" class="qr-animated"></div>
                </div>

                <div class="qr-info">
                    <span><span data-i18n="chars">字符数">Chars</span>: <span id="char-count">0</span></span>
                    <span class="ec-badge"><span class="ec-dot"></span><span data-i18n="ready">就绪</span></span>
                </div>

                <div class="qr-actions">
                    <button class="btn-action" onclick="downloadQR()">
                        ↓ <span data-i18n="download_btn">下载</span>
                    </button>
                    <button class="btn-action primary" onclick="copyQR()">
                        ⎘ <span data-i18n="copy_btn">复制图片</span>
                    </button>
                </div>
            </div>

        </div>

        <footer>
            <span class="footer-text">QRGen · <span data-i18n="footer_text">开源免费工具，无数据上传</span></span>
            <span class="footer-version">v1.0.0</span>
        </footer>

        <div class="toast" id="toast"></div>

        <script>

                    content_label: '内容 / Content',
                    size_label: '尺寸 / Size',
                    ec_label: '纠错等级',
                    color_label: '颜色',
                    fg_color: '前景色',
                    bg_color: '背景色',
                    format_label: '导出格式',
                    gen_btn: '⬡ 生成二维码',
                    preview_panel: '预览',
                    placeholder_text: '等待生成…',
                    chars: '字符数',
                    ready: '就绪',
                    download_btn: '下载',
                    copy_btn: '复制图片',
                    footer_text: '开源免费工具，无数据上传',
                    toast_copied: '已复制到剪贴板',
                    toast_downloaded: '已下载',
                    toast_empty: '请输入内容',
                    toast_no_qr: '请先生成二维码',
                },
                en: {
                    tag: 'QR Code Generator',
                    title: 'Generate<br><em>QR Codes</em><br>Instantly.',
                    subtitle: 'Enter any text or URL to instantly generate a high-quality QR code. Customize colors, size, and error correction.',
                    input_panel: 'Input',
                    content_label: 'Content',
                    size_label: 'Size',
                    ec_label: 'Error Correction',
                    color_label: 'Colors',
                    fg_color: 'Foreground',
                    bg_color: 'Background',
                    format_label: 'Export Format',
                    gen_btn: '⬡ Generate QR Code',
                    preview_panel: 'Preview',
                    placeholder_text: 'Waiting for input…',
                    chars: 'Chars',
                    ready: 'Ready',
                    download_btn: 'Download',
                    copy_btn: 'Copy Image',
                    footer_text: 'Open-source, offline, no data sent',
                    toast_copied: 'Copied to clipboard!',
                    toast_downloaded: 'Downloaded!',
                    toast_empty: 'Please enter some content',
                    toast_no_qr: 'Generate a QR code first',
                },
                ja: {

            let currentLang = 'zh';
            let qrGenerated = false;

            function setLang(lang) {
                currentLang = lang;
                const t = i18n[lang];
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.dataset.i18n;
                    if (t[key] !== undefined) {
                        if (key === 'title') el.innerHTML = t[key];
                        else el.textContent = t[key];
                    }
                });
                document.querySelectorAll('.lang-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.textContent.trim() === {
                        zh: '中文', en: 'EN', ja: '日本語', ko: '한국어', es: 'ES', fr: 'FR'
                    }[lang]);
                });
                // Update font for CJK
                document.body.style.fontFamily = lang === 'ja'
                    ? "'Noto Sans JP', sans-serif"
                    : lang === 'ko'
                        ? "'Noto Sans KR', sans-serif"
                        : "'Noto Sans SC', sans-serif";
            }

            function updateCharCount() {
                const len = document.getElementById('inputText').value.length;
                document.getElementById('char-count').textContent = len;
            }

            function showToast(key) {
                const t = i18n[currentLang];
                const el = document.getElementById('toast');
                el.textContent = t[key] || key;
                el.classList.add('show');
                setTimeout(() => el.classList.remove('show'), 2500);
            }

            function generateQR() {
                const text = document.getElementById('inputText').value.trim();
                if (!text) { showToast('toast_empty'); return; }

                const size = parseInt(document.getElementById('qrSize').value);
                const ec = document.getElementById('ecLevel').value;
                const fg = document.getElementById('fgColor').value;
                const bg = document.getElementById('bgColor').value;

                const container = document.getElementById('qrcode');
                container.innerHTML = '';
                container.style.display = 'none';

                new QRCode(container, {
                    text,
                    width: size,
                    height: size,
                    colorDark: fg,
                    colorLight: bg,
                    correctLevel: QRCode.CorrectLevel[ec]
                });

                container.style.display = 'block';
                document.getElementById('qrPlaceholder').style.display = 'none';
                container.classList.remove('qr-animated');
                void container.offsetWidth;
                container.classList.add('qr-animated');
                qrGenerated = true;
            }

            function getCanvas() {
                return document.querySelector('#qrcode canvas');
            }

            function downloadQR() {
                if (!qrGenerated) { showToast('toast_no_qr'); return; }
                const canvas = getCanvas();
                if (!canvas) return;
                const link = document.createElement('a');
                link.download = 'qrcode_' + Date.now() + '.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                showToast('toast_downloaded');
            }

            async function copyQR() {
                if (!qrGenerated) { showToast('toast_no_qr'); return; }
                const canvas = getCanvas();
                if (!canvas) return;
                canvas.toBlob(async (blob) => {
                    try {
                        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                        showToast('toast_copied');
                    } catch {
                        showToast('toast_downloaded');
                        downloadQR();
                    }
                });
            }

            // Enter key shortcut
            document.addEventListener('keydown', e => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') generateQR();
            });

            // Init
            updateCharCount();
        </script>
