<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本处理工具</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        :root {
            --bg-color: #e0f2e9;
            --container-bg: #e0f2e9;
            --title-bg: linear-gradient(145deg, #c8e6d7, #d4f0e3);
            --menu-bg: #d4eadd;
            --text-color: #2c7a51;
            --text-area-bg: #f5fbf8;
            --shadow-dark: rgba(0, 0, 0, 0.1);
            --shadow-light: rgba(255, 255, 255, 0.7);
            --btn-bg: #4a9eff;
            --btn-hover: #3a8eff;
        }

        [data-theme="dark"] {
            --bg-color: #1a2f1a;
            --container-bg: #1a2f1a;
            --title-bg: linear-gradient(145deg, #2a4a2a, #1f3f1f);
            --menu-bg: #2a4a2a;
            --text-color: #90c695;
            --text-area-bg: #2f4f2f;
            --shadow-dark: rgba(0, 0, 0, 0.3);
            --shadow-light: rgba(255, 255, 255, 0.1);
            --btn-bg: #4a7c59;
            --btn-hover: #5a8c69;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .app-container {
            background-color: var(--container-bg);
            border-radius: 10px;
            box-shadow: 8px 8px 15px var(--shadow-dark), -8px -8px 15px var(--shadow-light);
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .title-bar {
            background: var(--title-bg);
            padding: 10px 15px;
            border-radius: 10px 10px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px var(--shadow-dark);
        }

        .title-bar h1 {
            font-size: 16px;
            color: var(--text-color);
        }

        .window-controls {
            display: flex;
            gap: 8px;
        }

        .window-control {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            cursor: pointer;
        }

        .minimize {
            background-color: #f1c40f;
            border: 1px solid #e6b90f;
        }

        .maximize {
            background-color: #2ecc71;
            border: 1px solid #27ae60;
        }

        .close {
            background-color: #e74c3c;
            border: 1px solid #c0392b;
        }

        .menu-bar {
            background-color: var(--menu-bg);
            padding: 8px 15px;
            display: flex;
            gap: 20px;
            box-shadow: 0 2px 3px rgba(0, 0, 0, 0.05);
        }

        .menu-item {
            color: var(--text-color);
            cursor: pointer;
            font-size: 14px;
            position: relative;
        }

        .menu-item:hover {
            opacity: 0.8;
        }

        .content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 120px;
            background-color: var(--container-bg);
            padding: 15px 0;
            box-shadow: inset -5px 0 10px rgba(0, 0, 0, 0.03);
            overflow-y: auto;
        }

        .tool-btn {
            display: block;
            width: 90%;
            margin: 8px auto;
            padding: 8px 0;
            text-align: center;
            background: var(--btn-bg);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
            transition: all 0.2s ease;
        }

        .tool-btn:hover {
            background: var(--btn-hover);
            box-shadow: 2px 2px 4px var(--shadow-dark), -2px -2px 4px var(--shadow-light);
        }

        .tool-btn:active {
            box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
        }

        .main-content {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow: hidden;
        }

        .text-area,
        .result-area {
            flex: 1;
            border-radius: 8px;
            padding: 15px;
            font-size: 14px;
            resize: none;
            border: none;
            background-color: var(--text-area-bg);
            color: var(--text-color);
            box-shadow: inset 3px 3px 7px var(--shadow-dark), inset -3px -3px 7px var(--shadow-light);
            outline: none;
        }

        .status-bar {
            background-color: var(--menu-bg);
            padding: 8px 15px;
            font-size: 12px;
            color: var(--text-color);
            display: flex;
            justify-content: space-between;
            border-radius: 0 0 10px 10px;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: var(--text-area-bg);
            min-width: 160px;
            box-shadow: 0px 8px 16px var(--shadow-dark);
            z-index: 1;
            border-radius: 5px;
            top: 100%;
            left: 0;
        }

        .dropdown-content a {
            color: var(--text-color);
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            cursor: pointer;
        }

        .dropdown-content a:hover {
            background-color: var(--menu-bg);
        }

        .show {
            display: block;
        }

        .search-replace-dialog {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: var(--text-area-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px var(--shadow-dark);
            z-index: 1000;
            min-width: 300px;
        }

        .search-replace-dialog input {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            border: 1px solid var(--shadow-dark);
            border-radius: 5px;
            background-color: var(--container-bg);
            color: var(--text-color);
        }

        .search-replace-dialog button {
            padding: 8px 15px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background-color: var(--btn-bg);
            color: white;
            cursor: pointer;
        }

        .search-replace-dialog button:hover {
            background-color: var(--btn-hover);
        }

        #fileInput {
            display: none;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div class="title-bar">
            <h1>文本处理工具</h1>
            <div class="window-controls">
                <div class="window-control minimize" title="最小化"></div>
                <div class="window-control maximize" title="最大化"></div>
                <div class="window-control close" title="关闭"></div>
            </div>
        </div>

        <div class="menu-bar">
            <div class="dropdown">
                <div class="menu-item" onclick="toggleFileMenu()" title="文件操作">文件</div>
                <div id="fileDropdown" class="dropdown-content">
                    <a onclick="importFile()" title="导入文件">导入文件</a>
                    <a onclick="exportFile()" title="导出文件">导出文件</a>
                    <a onclick="clearText()" title="清空文本">清空文本</a>
                </div>
            </div>
            <div class="dropdown">
                <div class="menu-item" onclick="toggleEditMenu()" title="编辑功能">编辑</div>
                <div id="editDropdown" class="dropdown-content">
                    <a onclick="showSearchReplace()" title="搜索和替换">搜索替换</a>
                    <a onclick="copyToClipboard()" title="复制结果">复制结果</a>
                    <a onclick="pasteFromClipboard()" title="粘贴文本">粘贴文本</a>
                </div>
            </div>
            <div class="dropdown">
                <div class="menu-item" onclick="toggleThemeMenu()" title="主题设置">主题</div>
                <div id="themeDropdown" class="dropdown-content">
                    <a onclick="setTheme('light')" title="亮色主题">亮色主题</a>
                    <a onclick="setTheme('dark')" title="暗色主题">暗色主题</a>
                </div>
            </div>
            <div class="menu-item" onclick="showAbout()" title="关于信息">关于</div>
        </div>

        <div class="content">
            <div class="sidebar">
                <button class="tool-btn" onclick="md5Encrypt()" title="MD5加密">MD5加密</button>
                <button class="tool-btn" onclick="toUpperCase()" title="转换为大写">大写转换</button>
                <button class="tool-btn" onclick="toLowerCase()" title="转换为小写">小写转换</button>
                <button class="tool-btn" onclick="capitalizeFirstLetter()" title="首字母大写">首字母大写</button>
                <button class="tool-btn" onclick="toTraditional()" title="简体转繁体">简体转繁体</button>
                <button class="tool-btn" onclick="toSimplified()" title="繁体转简体">繁体转简体</button>
                <button class="tool-btn" onclick="toPinyin()" title="汉字转拼音">汉字转拼音</button>
                <button class="tool-btn" onclick="formatText()" title="格式清理">格式清理</button>
                <button class="tool-btn" onclick="countText()" title="文本统计">文本统计</button>
                <button class="tool-btn" onclick="convertNumberToChinese()" title="数字转中文">数字转中文</button>
                <button class="tool-btn" onclick="convertChineseToUppercase()" title="中文转大写">中文转大写</button>
            </div>

            <div class="main-content">
                <textarea id="inputText" class="text-area" placeholder="请在此输入需要处理的文本..." title="输入文本区域"></textarea>
                <textarea id="outputText" class="result-area" placeholder="处理结果将显示在这里..." readonly
                    title="输出结果区域"></textarea>
            </div>
        </div>

        <div class="status-bar">
            <div id="charCount">字符数: 0</div>
            <div>版本: 1.0.0</div>
        </div>
    </div>

    <!-- 搜索替换对话框 -->
    <div id="searchReplaceDialog" class="search-replace-dialog">
        <h3 style="color: var(--text-color); margin-bottom: 15px;">搜索和替换</h3>
        <input type="text" id="searchText" placeholder="搜索内容" title="输入要搜索的文本">
        <input type="text" id="replaceText" placeholder="替换内容" title="输入替换的文本">
        <div>
            <button onclick="findText()" title="查找文本">查找</button>
            <button onclick="replaceText()" title="替换文本">替换</button>
            <button onclick="replaceAllText()" title="全部替换">全部替换</button>
            <button onclick="closeSearchReplace()" title="关闭对话框">关闭</button>
        </div>
    </div>

    <!-- 隐藏的文件输入 -->
    <input type="file" id="fileInput" accept=".txt,.md,.json,.csv" title="选择文件">

    <script>
        // 简繁转换映射表
        const simplifiedToTraditional = {
            '个': '個', '为': '為', '国': '國', '学': '學', '会': '會', '来': '來', '说': '說',
            '时': '時', '们': '們', '这': '這', '那': '那', '里': '裡', '边': '邊', '后': '後',
            '东': '東', '内': '內', '门': '門', '间': '間', '厅': '廳', '楼': '樓', '层': '層',
            '桥': '橋', '车': '車', '飞': '飛', '机': '機', '电': '電', '话': '話', '视': '視',
            '听': '聽', '读': '讀', '写': '寫', '买': '買', '卖': '賣', '游': '遊', '钱': '錢',
            '块': '塊', '万': '萬', '几': '幾', '对': '對', '错': '錯', '没': '沒', '从': '從',
            '给': '給', '让': '讓', '问': '問', '应': '應', '该': '該', '须': '須', '会': '會',
            '将': '將', '让': '讓'
        };

        const traditionalToSimplified = {};
        for (let key in simplifiedToTraditional) {
            traditionalToSimplified[simplifiedToTraditional[key]] = key;
        }

        // 拼音映射表
        const pinyinMap = {
            '你': 'nǐ', '好': 'hǎo', '我': 'wǒ', '是': 'shì', '的': 'de', '在': 'zài',
            '有': 'yǒu', '不': 'bù', '了': 'le', '人': 'rén', '他': 'tā', '这': 'zhè',
            '个': 'gè', '上': 'shàng', '来': 'lái', '到': 'dào', '时': 'shí', '会': 'huì',
            '可': 'kě', '以': 'yǐ', '说': 'shuō', '她': 'tā', '们': 'men', '那': 'nà',
            '要': 'yào', '下': 'xià', '看': 'kàn', '天': 'tiān', '过': 'guò', '出': 'chū',
            '就': 'jiù', '分': 'fēn', '对': 'duì', '成': 'chéng', '如': 'rú', '果': 'guǒ',
            '发': 'fā', '现': 'xiàn', '面': 'miàn', '但': 'dàn', '定': 'dìng', '向': 'xiàng',
            '知': 'zhī', '道': 'dào', '后': 'hòu', '家': 'jiā', '小': 'xiǎo', '想': 'xiǎng',
            '开': 'kāi', '工': 'gōng', '还': 'hái', '因': 'yīn', '为': 'wèi', '高': 'gāo',
            '手': 'shǒu', '动': 'dòng', '很': 'hěn', '听': 'tīng', '自': 'zì', '己': 'jǐ',
            '话': 'huà', '等': 'děng', '真': 'zhēn', '直': 'zhí', '点': 'diǎn', '比': 'bǐ',
            '又': 'yòu', '用': 'yòng', '第': 'dì', '样': 'yàng', '进': 'jìn', '关': 'guān',
            '两': 'liǎng', '种': 'zhǒng', '从': 'cóng', '做': 'zuò', '被': 'bèi', '前': 'qián',
            '所': 'suǒ', '本': 'běn', '见': 'jiàn', '经': 'jīng', '头': 'tóu', '公': 'gōng',
            '同': 'tóng', '三': 'sān', '已': 'yǐ', '老': 'lǎo', '长': 'cháng', '回': 'huí',
            '什': 'shén', '么': 'me', '年': 'nián', '月': 'yuè', '日': 'rì', '中': 'zhōng',
            '大': 'dà', '国': 'guó', '学': 'xué', '生': 'shēng', '文': 'wén', '字': 'zì'
        };

        // 更新字符计数
        document.getElementById('inputText').addEventListener('input', function () {
            const text = this.value;
            document.getElementById('charCount').textContent = `字符数: ${text.length}`;
        });

        // MD5加密
        function md5Encrypt() {
            const text = document.getElementById('inputText').value;
            if (!text) {
                alert('请输入需要处理的文本');
                return;
            }
            try {
                const hash = CryptoJS.MD5(text).toString();
                document.getElementById('outputText').value = hash;
            } catch (error) {
                document.getElementById('outputText').value = '处理出错: ' + error.message;
            }
        }

        // 转换为大写
        function toUpperCase() {
            const text = document.getElementById('inputText').value;
            document.getElementById('outputText').value = text.toUpperCase();
        }

        // 转换为小写
        function toLowerCase() {
            const text = document.getElementById('inputText').value;
            document.getElementById('outputText').value = text.toLowerCase();
        }

        // 首字母大写
        function capitalizeFirstLetter() {
            const text = document.getElementById('inputText').value;
            const result = text.split(' ')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');
            document.getElementById('outputText').value = result;
        }

        // 简体转繁体
        function toTraditional() {
            const text = document.getElementById('inputText').value;
            let result = '';
            for (let char of text) {
                result += simplifiedToTraditional[char] || char;
            }
            document.getElementById('outputText').value = result;
        }

        // 繁体转简体
        function toSimplified() {
            const text = document.getElementById('inputText').value;
            let result = '';
            for (let char of text) {
                result += traditionalToSimplified[char] || char;
            }
            document.getElementById('outputText').value = result;
        }

        // 汉字转拼音
        function toPinyin() {
            const text = document.getElementById('inputText').value;
            let result = '';
            for (let char of text) {
                if (pinyinMap[char]) {
                    result += pinyinMap[char] + ' ';
                } else if (/[\u4e00-\u9fa5]/.test(char)) {
                    result += char + ' ';
                } else {
                    result += char;
                }
            }
            document.getElementById('outputText').value = result.trim();
        }

        // 格式清理
        function formatText() {
            const text = document.getElementById('inputText').value;
            let result = text.replace(/\s+/g, ' ').trim();
            document.getElementById('outputText').value = result;
        }

        // 文本统计
        function countText() {
            const text = document.getElementById('inputText').value;
            const charCount = text.length;
            const wordCount = text.trim().split(/\s+/).filter(Boolean).length;
            const lineCount = text.split('\n').length;
            const chineseCharCount = (text.match(/[\u4e00-\u9fa5]/g) || []).length;
            const englishCharCount = (text.match(/[a-zA-Z]/g) || []).length;
            const numberCount = (text.match(/[0-9]/g) || []).length;
            const punctuationCount = (text.match(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g) || []).length;

            const result = `字符总数: ${charCount}\n单词数: ${wordCount}\n行数: ${lineCount}\n中文字符: ${chineseCharCount}\n英文字符: ${englishCharCount}\n数字: ${numberCount}\n标点符号: ${punctuationCount}`;
            document.getElementById('outputText').value = result;
        }

        // 数字转中文
        function convertNumberToChinese() {
            const text = document.getElementById('inputText').value;
            function numberToChinese(num) {
                const chineseNumbers = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
                const chineseUnits = ['', '十', '百', '千', '万'];
                if (num === 0) return chineseNumbers[0];
                let result = '';
                let unitPos = 0;
                let strNum = num.toString();
                for (let i = strNum.length - 1; i >= 0; i--) {
                    const digit = parseInt(strNum[i]);
                    if (digit !== 0) {
                        result = chineseNumbers[digit] + (chineseUnits[unitPos] || '') + result;
                    }
                    unitPos++;
                }
                return result;
            }
            try {
                const result = text.replace(/\d+/g, match => numberToChinese(parseInt(match)));
                document.getElementById('outputText').value = result;
            } catch (error) {
                document.getElementById('outputText').value = '处理出错: ' + error.message;
            }
        }

        // 中文金额大写
        function convertChineseToUppercase() {
            const text = document.getElementById('inputText').value;
            function numberToChineseUppercase(num) {
                const chineseNumbers = ['零', '壹', '贰', '叁', '肆', '伍', '陆', '柒', '捌', '玖'];
                const chineseUnits = ['', '拾', '佰', '仟', '万'];
                if (isNaN(num)) return '输入不是有效数字';
                const parts = num.toString().split('.');
                const integerPart = parts[0];
                let result = '';
                let unitPos = 0;
                for (let i = integerPart.length - 1; i >= 0; i--) {
                    const digit = parseInt(integerPart[i]);
                    if (digit !== 0) {
                        result = chineseNumbers[digit] + (chineseUnits[unitPos] || '') + result;
                    }
                    unitPos++;
                }
                result += '元';
                if (parts.length > 1) {
                    const decimalPart = parts[1];
                    if (decimalPart.length >= 1) {
                        const tenthDigit = parseInt(decimalPart[0]);
                        if (tenthDigit !== 0) result += chineseNumbers[tenthDigit] + '角';
                    }
                    if (decimalPart.length >= 2) {
                        const hundredthDigit = parseInt(decimalPart[1]);
                        if (hundredthDigit !== 0) result += chineseNumbers[hundredthDigit] + '分';
                    }
                } else {
                    result += '整';
                }
                return result;
            }
            try {
                const result = text.replace(/\d+(\.\d+)?/g, match => numberToChineseUppercase(parseFloat(match)));
                document.getElementById('outputText').value = result;
            } catch (error) {
                document.getElementById('outputText').value = '处理出错: ' + error.message;
            }
        }

        // 菜单功能
        function toggleFileMenu() {
            closeAllDropdowns();
            document.getElementById("fileDropdown").classList.toggle("show");
        }

        function toggleEditMenu() {
            closeAllDropdowns();
            document.getElementById("editDropdown").classList.toggle("show");
        }

        function toggleThemeMenu() {
            closeAllDropdowns();
            document.getElementById("themeDropdown").classList.toggle("show");
        }

        function closeAllDropdowns() {
            const dropdowns = document.getElementsByClassName("dropdown-content");
            for (let i = 0; i < dropdowns.length; i++) {
                dropdowns[i].classList.remove('show');
            }
        }

        // 文件操作
        function importFile() {
            document.getElementById('fileInput').click();
            closeAllDropdowns();
        }

        function exportFile() {
            const text = document.getElementById('outputText').value || document.getElementById('inputText').value;
            if (!text) {
                alert('没有内容可以导出');
                return;
            }
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'processed_text.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            closeAllDropdowns();
        }

        function clearText() {
            document.getElementById('inputText').value = '';
            document.getElementById('outputText').value = '';
            document.getElementById('charCount').textContent = '字符数: 0';
            closeAllDropdowns();
        }

        // 编辑功能
        function showSearchReplace() {
            document.getElementById('searchReplaceDialog').style.display = 'block';
            closeAllDropdowns();
        }

        function closeSearchReplace() {
            document.getElementById('searchReplaceDialog').style.display = 'none';
        }

        function findText() {
            const searchText = document.getElementById('searchText').value;
            const inputText = document.getElementById('inputText');
            if (!searchText) {
                alert('请输入搜索内容');
                return;
            }
            const text = inputText.value;
            const index = text.indexOf(searchText);
            if (index !== -1) {
                inputText.focus();
                inputText.setSelectionRange(index, index + searchText.length);
                alert(`找到匹配项，位置: ${index + 1}`);
            } else {
                alert('未找到匹配项');
            }
        }

        function replaceText() {
            const searchText = document.getElementById('searchText').value;
            const replaceText = document.getElementById('replaceText').value;
            const inputText = document.getElementById('inputText');
            if (!searchText) {
                alert('请输入搜索内容');
                return;
            }
            const text = inputText.value;
            const newText = text.replace(searchText, replaceText);
            inputText.value = newText;
            if (text !== newText) {
                alert('替换成功');
                document.getElementById('charCount').textContent = `字符数: ${newText.length}`;
            } else {
                alert('未找到匹配项');
            }
        }

        function replaceAllText() {
            const searchText = document.getElementById('searchText').value;
            const replaceText = document.getElementById('replaceText').value;
            const inputText = document.getElementById('inputText');
            if (!searchText) {
                alert('请输入搜索内容');
                return;
            }
            const text = inputText.value;
            const regex = new RegExp(searchText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
            const newText = text.replace(regex, replaceText);
            inputText.value = newText;
            const count = (text.match(regex) || []).length;
            if (count > 0) {
                alert(`替换成功，共替换 ${count} 处`);
                document.getElementById('charCount').textContent = `字符数: ${newText.length}`;
            } else {
                alert('未找到匹配项');
            }
        }

        function copyToClipboard() {
            const outputText = document.getElementById('outputText');
            if (!outputText.value) {
                alert('没有内容可以复制');
                return;
            }
            outputText.select();
            document.execCommand('copy');
            alert('已复制到剪贴板');
            closeAllDropdowns();
        }

        function pasteFromClipboard() {
            navigator.clipboard.readText().then(text => {
                document.getElementById('inputText').value = text;
                document.getElementById('charCount').textContent = `字符数: ${text.length}`;
            }).catch(err => {
                alert('无法访问剪贴板');
            });
            closeAllDropdowns();
        }

        // 主题切换
        function setTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            }
            closeAllDropdowns();
        }

        // 关于信息
        function showAbout() {
            alert('文本处理工具 v1.0.0\n\n功能包括：\n- MD5加密\n- 大小写转换\n- 简繁体转换\n- 汉字转拼音\n- 文本统计\n- 数字转中文\n- 搜索替换\n- 文件导入导出\n- 主题切换');
        }

        // 文件输入处理
        document.getElementById('fileInput').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const text = e.target.result;
                    document.getElementById('inputText').value = text;
                    document.getElementById('charCount').textContent = `字符数: ${text.length}`;
                };
                reader.readAsText(file, 'UTF-8');
            }
        });

        // 窗口控制按钮功能
        document.querySelector('.close').addEventListener('click', function () {
            if (confirm('确定要关闭应用吗？')) {
                window.close();
            }
        });

        document.querySelector('.maximize').addEventListener('click', function () {
            if (document.fullscreenElement) {
                document.exitFullscreen();
            } else {
                document.documentElement.requestFullscreen();
            }
        });

        document.querySelector('.minimize').addEventListener('click', function () {
            alert('最小化功能需要在桌面应用中使用');
        });

        // 点击其他地方关闭下拉菜单
        window.onclick = function (event) {
            if (!event.target.matches('.menu-item')) {
                closeAllDropdowns();
            }
        }

        // 加载保存的主题
        window.addEventListener('load', function () {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                setTheme('dark');
            }
        });

        // ESC键关闭搜索替换对话框
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                closeSearchReplace();
            }
        });
    </script>
</body>

</html>
