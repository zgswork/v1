<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三年级英语趣味学习乐园</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', '楷体', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6ecbf5 0%, #059ee3 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        
        .container {
            width: 100%;
            max-width: 900px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 20px;
            margin-top: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #ff6b6b;
            font-size: 2.5rem;
            text-shadow: 2px 2px 0 #ffd166;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #06d6a0;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        
        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        .score-board {
            display: flex;
            justify-content: space-around;
            width: 100%;
            background: #ffd166;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .score-item {
            text-align: center;
        }
        
        .score-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ef476f;
        }
        
        .game-selection {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .game-card {
            width: 150px;
            height: 150px;
            background: #118ab2;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            transition: transform 0.3s, background 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .game-card:hover {
            transform: translateY(-5px);
            background: #06d6a0;
        }
        
        .game-card i {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        
        .game-content {
            width: 100%;
            min-height: 400px;
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            display: none;
        }
        
        .active {
            display: block;
        }
        
        .question {
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
            color: #073b4c;
        }
        
        .options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .option {
            background: #ffd166;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.2rem;
        }
        
        .option:hover {
            background: #06d6a0;
            transform: scale(1.05);
        }
        
        .feedback {
            text-align: center;
            font-size: 1.5rem;
            margin: 20px 0;
            min-height: 40px;
        }
        
        .correct {
            color: #06d6a0;
        }
        
        .incorrect {
            color: #ef476f;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            background: #118ab2;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 0 #073b4c;
        }
        
        button:hover {
            background: #06d6a0;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #073b4c;
        }
        
        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #073b4c;
        }
        
        .home-btn {
            background: #ef476f;
            box-shadow: 0 4px 0 #b9133c;
        }
        
        .home-btn:hover {
            background: #ff6b6b;
            box-shadow: 0 6px 0 #b9133c;
        }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            background: #06d6a0;
            width: 0%;
            transition: width 0.5s;
        }
        
        .word-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px 0;
        }
        
        .word-image {
            width: 200px;
            height: 200px;
            object-fit: contain;
            margin-bottom: 15px;
        }
        
        .word-text {
            font-size: 2.5rem;
            color: #073b4c;
            margin-bottom: 10px;
        }
        
        .pronunciation {
            font-size: 1.2rem;
            color: #118ab2;
            margin-bottom: 15px;
        }
        
        .sound-btn {
            background: #ffd166;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-bottom: 20px;
            box-shadow: 0 4px 0 #e6b845;
        }
        
        .sound-btn:hover {
            background: #ffb347;
        }
        
        @media (max-width: 600px) {
            .options {
                grid-template-columns: 1fr;
            }
            
            .game-card {
                width: 120px;
                height: 120px;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>三年级英语趣味学习乐园</h1>
        <p class="subtitle">在游戏中学习，在快乐中进步！</p>
    </header>
    
    <div class="container">
        <div class="score-board">
            <div class="score-item">
                <div>积分</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="score-item">
                <div>正确率</div>
                <div class="score-value" id="accuracy">0%</div>
            </div>
            <div class="score-item">
                <div>连续正确</div>
                <div class="score-value" id="streak">0</div>
            </div>
        </div>
        
        <div class="game-selection">
            <div class="game-card" data-game="vocabulary">
                <i>📚</i>
                <span>词汇学习</span>
            </div>
            <div class="game-card" data-game="matching">
                <i>🔤</i>
                <span>单词匹配</span>
            </div>
            <div class="game-card" data-game="listening">
                <i>👂</i>
                <span>听力挑战</span>
            </div>
            <div class="game-card" data-game="spelling">
                <i>✏️</i>
                <span>拼写测试</span>
            </div>
        </div>
        
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
        
        <!-- 词汇学习模块 -->
        <div id="vocabulary" class="game-content">
            <div class="question">学习新单词</div>
            <div class="word-card">
                <img class="word-image" id="word-image" src="" alt="单词图片">
                <div class="word-text" id="word-text">apple</div>
                <div class="pronunciation" id="word-pronunciation">/ˈæp.əl/</div>
                <div class="sound-btn" id="sound-btn">🔊</div>
            </div>
            <div class="controls">
                <button id="prev-word">上一个</button>
                <button id="next-word">下一个</button>
                <button class="home-btn" id="vocab-home">返回主页</button>
            </div>
        </div>
        
        <!-- 单词匹配游戏 -->
        <div id="matching" class="game-content">
            <div class="question">将图片与正确的单词匹配</div>
            <div class="options" id="matching-options">
                <!-- 选项将通过JavaScript动态生成 -->
            </div>
            <div class="feedback" id="matching-feedback"></div>
            <div class="controls">
                <button id="next-match">下一题</button>
                <button class="home-btn" id="matching-home">返回主页</button>
            </div>
        </div>
        
        <!-- 听力挑战游戏 -->
        <div id="listening" class="game-content">
            <div class="question">听录音，选择正确的图片</div>
            <div class="sound-btn" id="listen-btn" style="margin: 20px auto;">🔊 点击播放</div>
            <div class="options" id="listening-options">
                <!-- 选项将通过JavaScript动态生成 -->
            </div>
            <div class="feedback" id="listening-feedback"></div>
            <div class="controls">
                <button id="next-listening">下一题</button>
                <button class="home-btn" id="listening-home">返回主页</button>
            </div>
        </div>
        
        <!-- 拼写测试游戏 -->
        <div id="spelling" class="game-content">
            <div class="question">根据图片拼写单词</div>
            <div class="word-card">
                <img class="word-image" id="spelling-image" src="" alt="拼写单词图片">
            </div>
            <div style="text-align: center; margin: 20px 0;">
                <input type="text" id="spelling-input" placeholder="输入单词" style="padding: 10px; font-size: 1.2rem; width: 200px; text-align: center;">
                <button id="check-spelling">检查</button>
            </div>
            <div class="feedback" id="spelling-feedback"></div>
            <div class="controls">
                <button id="next-spelling">下一题</button>
                <button class="home-btn" id="spelling-home">返回主页</button>
            </div>
        </div>
    </div>

    <script>
        // 三年级英语单词库
        const wordList = [
            { word: "apple", pronunciation: "/ˈæp.əl/", image: "🍎", meaning: "苹果" },
            { word: "banana", pronunciation: "/bəˈnɑː.nə/", image: "🍌", meaning: "香蕉" },
            { word: "cat", pronunciation: "/kæt/", image: "🐱", meaning: "猫" },
            { word: "dog", pronunciation: "/dɒɡ/", image: "🐶", meaning: "狗" },
            { word: "elephant", pronunciation: "/ˈel.ɪ.fənt/", image: "🐘", meaning: "大象" },
            { word: "fish", pronunciation: "/fɪʃ/", image: "🐟", meaning: "鱼" },
            { word: "grape", pronunciation: "/ɡreɪp/", image: "🍇", meaning: "葡萄" },
            { word: "house", pronunciation: "/haʊs/", image: "🏠", meaning: "房子" },
            { word: "ice cream", pronunciation: "/ˌaɪs ˈkriːm/", image: "🍦", meaning: "冰淇淋" },
            { word: "juice", pronunciation: "/dʒuːs/", image: "🧃", meaning: "果汁" },
            { word: "kite", pronunciation: "/kaɪt/", image: "🪁", meaning: "风筝" },
            { word: "lion", pronunciation: "/ˈlaɪ.ən/", image: "🦁", meaning: "狮子" },
            { word: "monkey", pronunciation: "/ˈmʌŋ.ki/", image: "🐒", meaning: "猴子" },
            { word: "nose", pronunciation: "/nəʊz/", image: "👃", meaning: "鼻子" },
            { word: "orange", pronunciation: "/ˈɒr.ɪndʒ/", image: "🍊", meaning: "橙子" }
        ];

        // 游戏状态
        let gameState = {
            score: 0,
            correctAnswers: 0,
            totalQuestions: 0,
            currentStreak: 0,
            currentWordIndex: 0,
            currentGame: null
        };

        // DOM元素
        const gameCards = document.querySelectorAll('.game-card');
        const gameContents = document.querySelectorAll('.game-content');
        const scoreElement = document.getElementById('score');
        const accuracyElement = document.getElementById('accuracy');
        const streakElement = document.getElementById('streak');
        const progressElement = document.getElementById('progress');

        // 初始化游戏
        function initGame() {
            // 添加游戏卡片点击事件
            gameCards.forEach(card => {
                card.addEventListener('click', () => {
                    const gameType = card.getAttribute('data-game');
                    startGame(gameType);
                });
            });

            // 初始化词汇学习模块
            initVocabularyGame();
            
            // 初始化匹配游戏
            initMatchingGame();
            
            // 初始化听力游戏
            initListeningGame();
            
            // 初始化拼写游戏
            initSpellingGame();
            
            // 更新分数显示
            updateScoreDisplay();
        }

        // 开始游戏
        function startGame(gameType) {
            // 隐藏所有游戏内容
            gameContents.forEach(content => {
                content.classList.remove('active');
            });
            
            // 显示选中的游戏
            document.getElementById(gameType).classList.add('active');
            
            // 设置当前游戏
            gameState.currentGame = gameType;
            
            // 重置进度条
            progressElement.style.width = '0%';
            
            // 根据游戏类型初始化游戏
            switch(gameType) {
                case 'vocabulary':
                    showVocabularyWord(gameState.currentWordIndex);
                    break;
                case 'matching':
                    generateMatchingQuestion();
                    break;
                case 'listening':
                    generateListeningQuestion();
                    break;
                case 'spelling':
                    generateSpellingQuestion();
                    break;
            }
        }

        // 初始化词汇学习模块
        function initVocabularyGame() {
            const prevButton = document.getElementById('prev-word');
            const nextButton = document.getElementById('next-word');
            const homeButton = document.getElementById('vocab-home');
            const soundButton = document.getElementById('sound-btn');
            
            prevButton.addEventListener('click', () => {
                gameState.currentWordIndex = (gameState.currentWordIndex - 1 + wordList.length) % wordList.length;
                showVocabularyWord(gameState.currentWordIndex);
            });
            
            nextButton.addEventListener('click', () => {
                gameState.currentWordIndex = (gameState.currentWordIndex + 1) % wordList.length;
                showVocabularyWord(gameState.currentWordIndex);
            });
            
            homeButton.addEventListener('click', () => {
                returnToHome();
            });
            
            soundButton.addEventListener('click', () => {
                // 模拟发音功能
                const word = wordList[gameState.currentWordIndex].word;
                speakWord(word);
            });
        }

        // 显示词汇学习单词
        function showVocabularyWord(index) {
            const wordData = wordList[index];
            document.getElementById('word-image').textContent = wordData.image;
            document.getElementById('word-text').textContent = wordData.word;
            document.getElementById('word-pronunciation').textContent = wordData.pronunciation;
            
            // 更新进度条
            progressElement.style.width = `${(index / wordList.length) * 100}%`;
        }

        // 初始化匹配游戏
        function initMatchingGame() {
            const nextButton = document.getElementById('next-match');
            const homeButton = document.getElementById('matching-home');
            
            nextButton.addEventListener('click', () => {
                generateMatchingQuestion();
            });
            
            homeButton.addEventListener('click', () => {
                returnToHome();
            });
        }

        // 生成匹配游戏题目
        function generateMatchingQuestion() {
            const optionsContainer = document.getElementById('matching-options');
            const feedbackElement = document.getElementById('matching-feedback');
            
            // 清空选项和反馈
            optionsContainer.innerHTML = '';
            feedbackElement.textContent = '';
            feedbackElement.className = 'feedback';
            
            // 随机选择一个单词
            const correctIndex = Math.floor(Math.random() * wordList.length);
            const correctWord = wordList[correctIndex];
            
            // 创建选项（3个错误选项 + 1个正确选项）
            const options = [correctWord];
            while (options.length < 4) {
                const randomIndex = Math.floor(Math.random() * wordList.length);
                if (!options.includes(wordList[randomIndex])) {
                    options.push(wordList[randomIndex]);
                }
            }
            
            // 打乱选项顺序
            shuffleArray(options);
            
            // 生成选项HTML
            options.forEach(option => {
                const optionElement = document.createElement('div');
                optionElement.className = 'option';
                optionElement.innerHTML = `
                    <div style="font-size: 3rem; margin-bottom: 10px;">${option.image}</div>
                    <div>${option.word}</div>
                `;
                
                optionElement.addEventListener('click', () => {
                    // 检查答案
                    if (option === correctWord) {
                        feedbackElement.textContent = '正确！太棒了！';
                        feedbackElement.className = 'feedback correct';
                        updateScore(true);
                    } else {
                        feedbackElement.textContent = `不对哦，正确答案是: ${correctWord.word}`;
                        feedbackElement.className = 'feedback incorrect';
                        updateScore(false);
                    }
                    
                    // 禁用所有选项
                    document.querySelectorAll('#matching-options .option').forEach(opt => {
                        opt.style.pointerEvents = 'none';
                    });
                });
                
                optionsContainer.appendChild(optionElement);
            });
            
            // 更新进度条
            gameState.totalQuestions++;
            progressElement.style.width = `${(gameState.correctAnswers / gameState.totalQuestions) * 100}%`;
        }

        // 初始化听力游戏
        function initListeningGame() {
            const listenButton = document.getElementById('listen-btn');
            const nextButton = document.getElementById('next-listening');
            const homeButton = document.getElementById('listening-home');
            
            listenButton.addEventListener('click', () => {
                // 获取当前正确单词
                const correctWord = document.getElementById('listening-options').getAttribute('data-correct');
                speakWord(correctWord);
            });
            
            nextButton.addEventListener('click', () => {
                generateListeningQuestion();
            });
            
            homeButton.addEventListener('click', () => {
                returnToHome();
            });
        }

        // 生成听力游戏题目
        function generateListeningQuestion() {
            const optionsContainer = document.getElementById('listening-options');
            const feedbackElement = document.getElementById('listening-feedback');
            const listenButton = document.getElementById('listen-btn');
            
            // 清空选项和反馈
            optionsContainer.innerHTML = '';
            feedbackElement.textContent = '';
            feedbackElement.className = 'feedback';
            
            // 随机选择一个单词
            const correctIndex = Math.floor(Math.random() * wordList.length);
            const correctWord = wordList[correctIndex];
            
            // 创建选项（3个错误选项 + 1个正确选项）
            const options = [correctWord];
            while (options.length < 4) {
                const randomIndex = Math.floor(Math.random() * wordList.length);
                if (!options.includes(wordList[randomIndex])) {
                    options.push(wordList[randomIndex]);
                }
            }
            
            // 打乱选项顺序
            shuffleArray(options);
            
            // 生成选项HTML
            options.forEach(option => {
                const optionElement = document.createElement('div');
                optionElement.className = 'option';
                optionElement.innerHTML = `
                    <div style="font-size: 3rem;">${option.image}</div>
                `;
                
                optionElement.addEventListener('click', () => {
                    // 检查答案
                    if (option === correctWord) {
                        feedbackElement.textContent = '听力真棒！答对了！';
                        feedbackElement.className = 'feedback correct';
                        updateScore(true);
                    } else {
                        feedbackElement.textContent = `再仔细听听，正确答案是: ${correctWord.word}`;
                        feedbackElement.className = 'feedback incorrect';
                        updateScore(false);
                    }
                    
                    // 禁用所有选项
                    document.querySelectorAll('#listening-options .option').forEach(opt => {
                        opt.style.pointerEvents = 'none';
                    });
                });
                
                optionsContainer.appendChild(optionElement);
            });
            
            // 存储正确答案
            optionsContainer.setAttribute('data-correct', correctWord.word);
            
            // 更新进度条
            gameState.totalQuestions++;
            progressElement.style.width = `${(gameState.correctAnswers / gameState.totalQuestions) * 100}%`;
        }

        // 初始化拼写游戏
        function initSpellingGame() {
            const checkButton = document.getElementById('check-spelling');
            const nextButton = document.getElementById('next-spelling');
            const homeButton = document.getElementById('spelling-home');
            const inputField = document.getElementById('spelling-input');
            
            checkButton.addEventListener('click', () => {
                checkSpelling();
            });
            
            inputField.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    checkSpelling();
                }
            });
            
            nextButton.addEventListener('click', () => {
                generateSpellingQuestion();
            });
            
            homeButton.addEventListener('click', () => {
                returnToHome();
            });
        }

        // 生成拼写游戏题目
        function generateSpellingQuestion() {
            const imageElement = document.getElementById('spelling-image');
            const feedbackElement = document.getElementById('spelling-feedback');
            const inputField = document.getElementById('spelling-input');
            
            // 清空输入和反馈
            inputField.value = '';
            feedbackElement.textContent = '';
            feedbackElement.className = 'feedback';
            
            // 随机选择一个单词
            const randomIndex = Math.floor(Math.random() * wordList.length);
            const wordData = wordList[randomIndex];
            
            // 显示图片
            imageElement.textContent = wordData.image;
            
            // 存储正确答案
            imageElement.setAttribute('data-correct', wordData.word);
            
            // 更新进度条
            gameState.totalQuestions++;
            progressElement.style.width = `${(gameState.correctAnswers / gameState.totalQuestions) * 100}%`;
            
            // 聚焦输入框
            inputField.focus();
        }

        // 检查拼写
        function checkSpelling() {
            const inputField = document.getElementById('spelling-input');
            const feedbackElement = document.getElementById('spelling-feedback');
            const imageElement = document.getElementById('spelling-image');
            
            const userAnswer = inputField.value.trim().toLowerCase();
            const correctAnswer = imageElement.getAttribute('data-correct').toLowerCase();
            
            if (userAnswer === correctAnswer) {
                feedbackElement.textContent = '拼写正确！太厉害了！';
                feedbackElement.className = 'feedback correct';
                updateScore(true);
            } else {
                feedbackElement.textContent = `再试试看，正确拼写是: ${correctAnswer}`;
                feedbackElement.className = 'feedback incorrect';
                updateScore(false);
            }
        }

        // 更新分数
        function updateScore(isCorrect) {
            if (isCorrect) {
                gameState.score += 10;
                gameState.correctAnswers++;
                gameState.currentStreak++;
            } else {
                gameState.currentStreak = 0;
            }
            
            updateScoreDisplay();
        }

        // 更新分数显示
        function updateScoreDisplay() {
            scoreElement.textContent = gameState.score;
            
            const accuracy = gameState.totalQuestions > 0 ? 
                Math.round((gameState.correctAnswers / gameState.totalQuestions) * 100) : 0;
            accuracyElement.textContent = `${accuracy}%`;
            
            streakElement.textContent = gameState.currentStreak;
        }

        // 返回主页
        function returnToHome() {
            gameContents.forEach(content => {
                content.classList.remove('active');
            });
        }

        // 模拟单词发音
        function speakWord(word) {

            // 这里使用alert模拟发音效果
            alert(`发音: ${word}`);
        }

        // 打乱数组顺序
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        document.addEventListener('DOMContentLoaded', initGame);
