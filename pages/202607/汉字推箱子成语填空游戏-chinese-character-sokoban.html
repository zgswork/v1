<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汉字推箱子成语填空游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', '微软雅黑', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            color: #333;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 20px;
            max-width: 1200px;
            width: 100%;
            margin: 10px;
        }

        .game-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .game-title {
            font-size: 2.5em;
            color: #333;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .game-stats {
            display: flex;
            justify-content: space-around;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .game-main {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
            margin-bottom: 20px;
        }

        .game-board {
            background: #f0f0f0;
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .canvas-container {
            position: relative;
            border: 3px solid #333;
            border-radius: 8px;
            background: #fff;
            margin-bottom: 15px;
            max-width: 100%;
            overflow: hidden;
        }

        #gameCanvas {
            display: block;
            border-radius: 5px;
            max-width: 100%;
            height: auto;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 200px;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .control-btn:active {
            transform: translateY(0);
        }

        .control-btn.empty {
            background: transparent;
            cursor: default;
        }

        .control-btn.empty:hover {
            transform: none;
            box-shadow: none;
        }

        .idiom-panel {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .idiom-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            color: #333;
        }

        .idiom-explanation {
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .idiom-display {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 8px;
            color: #333;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border-radius: 8px;
            padding: 15px;
            border: 2px solid #dee2e6;
        }

        .blank-char {
            color: #ff6b6b;
            border-bottom: 3px solid #ff6b6b;
            padding: 0 5px;
            min-width: 40px;
            display: inline-block;
            text-align: center;
        }

        .filled-char {
            color: #28a745;
            background: #d4edda;
            border-radius: 4px;
            padding: 0 5px;
        }

        .game-tips {
            margin-top: 15px;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .tip-text {
             background: linear-gradient(135deg, #ffeaa7, #fab1a0);
             color: #2d3436;
             padding: 8px 15px;
             border-radius: 20px;
             font-size: 13px;
             margin: 0;
             display: inline-block;
             box-shadow: 0 2px 8px rgba(0,0,0,0.1);
             border: 1px solid rgba(255,255,255,0.3);
         }
         
         /* 页面底部备注样式 */
          .footer-notes {
              text-align: center;
              margin-top: 30px;
              padding: 20px;
              background: white;
              border-radius: 20px;
              box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
              font-size: 13px;
              line-height: 1.6;
              color: #333;
              max-width: 1200px;
              width: 100%;
          }
          
          .footer-notes p {
              margin: 8px 0;
              color: #333;
          }
          
          .wechat-account {
              color: #e74c3c;
              font-weight: bold;
          }
          
          .wechat-id {
              color: #27ae60;
              font-weight: bold;
          }
          
          .tool-link, .zsxq-link {
              color: #667eea;
              text-decoration: none;
              font-weight: 500;
              transition: all 0.2s ease;
              padding: 2px 6px;
              border-radius: 4px;
          }
          
          .tool-link:hover, .zsxq-link:hover {
              color: white;
              background: linear-gradient(45deg, #667eea, #764ba2);
              transform: translateY(-1px);
              box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
          }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .action-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
            min-width: 80px;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .action-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        /* 响应式设计 */
        
        /* 大屏设备 (桌面) - 水平布局 */
        @media (min-width: 1024px) {
            .game-container {
                max-width: 1400px;
                padding: 30px;
            }
            
            .game-main {
                grid-template-columns: 1fr 400px;
                gap: 30px;
            }
            
            .game-title {
                font-size: 3em;
            }
            
            .idiom-display {
                font-size: 36px;
                letter-spacing: 10px;
                padding: 20px;
            }
            
            .action-btn {
                padding: 12px 24px;
                font-size: 16px;
                min-width: 100px;
            }
            
            .control-btn {
                width: 60px;
                height: 60px;
                font-size: 24px;
            }
        }
        
        /* 中等屏幕 (平板) - 水平布局 */
        @media (min-width: 769px) and (max-width: 1023px) {
            .game-main {
                grid-template-columns: 1fr 320px;
                gap: 20px;
            }
            
            .game-title {
                font-size: 2.2em;
            }
            
            .idiom-display {
                font-size: 28px;
                letter-spacing: 6px;
            }
            
            .action-btn {
                padding: 10px 18px;
                font-size: 14px;
                min-width: 85px;
            }
        }
        
        /* 小屏设备 (手机) - 垂直布局，成语信息在上方 */
        @media (max-width: 768px) {
            body {
                padding: 5px;
            }
            
            .game-container {
                padding: 15px;
                margin: 5px;
                border-radius: 15px;
            }
            
            .game-main {
                grid-template-columns: 1fr;
                gap: 15px;
                /* 改变顺序：成语信息在上方 */
            }
            
            .idiom-panel {
                order: -1; /* 成语面板移到上方 */
                padding: 15px;
            }
            
            .game-board {
                padding: 15px;
            }
            
            .game-title {
                font-size: 1.8em;
                margin-bottom: 15px;
            }
            
            .game-stats {
                padding: 10px;
                margin-bottom: 15px;
            }
            
            .stat-value {
                font-size: 16px;
            }
            
            .stat-label {
                font-size: 11px;
            }
            
            .idiom-title {
                font-size: 16px;
                margin-bottom: 10px;
            }
            
            .idiom-explanation {
                font-size: 14px;
                padding: 12px;
                margin-bottom: 15px;
            }
            
            .idiom-display {
                font-size: 20px;
                letter-spacing: 3px;
                padding: 12px;
                margin-bottom: 15px;
                min-height: 40px;
            }
            
            .controls {
                max-width: 140px;
                gap: 8px;
            }
            
            .control-btn {
                width: 35px;
                height: 35px;
                font-size: 14px;
            }
            
            .action-buttons {
                gap: 8px;
                margin-top: 15px;
            }
            
            .action-btn {
                padding: 8px 12px;
                font-size: 12px;
                min-width: 60px;
                flex: 1;
            }
            
            #gameCanvas {
                max-width: 100%;
                height: auto;
            }
        }
        
        /* 超小屏设备 (小手机) */
        @media (max-width: 480px) {
            .game-title {
                font-size: 1.5em;
            }
            
            .idiom-display {
                font-size: 18px;
                letter-spacing: 2px;
                padding: 10px;
            }
            
            .idiom-explanation {
                font-size: 13px;
                padding: 10px;
            }
            
            .control-btn {
                width: 30px;
                height: 30px;
                font-size: 12px;
            }
            
            .action-btn {
                padding: 6px 10px;
                font-size: 11px;
                min-width: 50px;
            }
            
            .game-stats {
                flex-direction: column;
                gap: 8px;
            }
            
            .stat-item {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            
            .stat-label {
                 margin-bottom: 0;
             }
         }
         
         /* 横屏模式优化 */
         @media (max-width: 768px) and (orientation: landscape) {
             .game-main {
                 grid-template-columns: 1fr 280px;
                 gap: 15px;
             }
             
             .idiom-panel {
                 order: 0; /* 恢复正常顺序 */
                 padding: 10px;
             }
             
             .game-board {
                 padding: 10px;
             }
             
             .game-title {
                 font-size: 1.5em;
                 margin-bottom: 10px;
             }
             
             .game-stats {
                 padding: 8px;
                 margin-bottom: 10px;
             }
             
             .idiom-display {
                 font-size: 16px;
                 letter-spacing: 2px;
                 padding: 8px;
                 margin-bottom: 10px;
             }
             
             .idiom-explanation {
                 font-size: 12px;
                 padding: 8px;
                 margin-bottom: 10px;
             }
             
             .action-buttons {
                 margin-top: 10px;
             }
         }
         
         /* 确保在所有设备上的可访问性 */
         @media (prefers-reduced-motion: reduce) {
             .action-btn, .control-btn, .level-btn {
                 transition: none;
             }
             
             .action-btn:hover, .control-btn:hover, .level-btn:hover {
                 transform: none;
             }
         }

        /* 关卡选择器样式 */
        .level-selector {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .level-selector-content {
            background: white;
            border-radius: 15px;
            padding: 20px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 90%;
            margin: 0 10px;
        }

        .level-selector-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #e74c3c;
            padding-bottom: 10px;
        }

        .level-selector-header h3 {
            margin: 0;
            color: #2c3e50;
            font-size: 1.5em;
        }

        .close-btn {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            background: #c0392b;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
        }

        .level-btn {
            width: 60px;
            height: 60px;
            border: 2px solid #3498db;
            background: #ecf0f1;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .level-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .level-btn.unlocked {
            background: #2ecc71;
            color: white;
            border-color: #27ae60;
        }

        .level-btn.current {
            background: #f39c12;
            color: white;
            border-color: #e67e22;
        }

        .level-btn.locked {
            background: #95a5a6;
            color: #7f8c8d;
            border-color: #bdc3c7;
            cursor: not-allowed;
        }

        .level-btn.locked:hover {
            transform: none;
            box-shadow: none;
        }

        .level-difficulty {
            font-size: 10px;
            margin-top: 2px;
        }
        
        /* 关卡选择器响应式设计 */
        @media (max-width: 768px) {
            .level-selector-content {
                padding: 15px;
                max-width: 95%;
                max-height: 85vh;
                border-radius: 10px;
            }
            
            .level-selector-header h3 {
                font-size: 1.2em;
            }
            
            .level-grid {
                grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
                gap: 8px;
                max-height: 350px;
            }
            
            .level-btn {
                width: 50px;
                height: 50px;
                font-size: 12px;
                border-radius: 8px;
            }
            
            .level-difficulty {
                font-size: 8px;
            }
        }
        
        @media (max-width: 480px) {
            .level-selector-content {
                padding: 10px;
                max-width: 98%;
                max-height: 90vh;
            }
            
            .level-selector-header {
                margin-bottom: 15px;
                padding-bottom: 8px;
            }
            
            .level-selector-header h3 {
                font-size: 1.1em;
            }
            
            .close-btn {
                width: 25px;
                height: 25px;
                font-size: 14px;
            }
            
            .level-grid {
                grid-template-columns: repeat(auto-fill, minmax(45px, 1fr));
                gap: 6px;
                max-height: 300px;
            }
            
            .level-btn {
                width: 45px;
                height: 45px;
                font-size: 11px;
                border-radius: 6px;
            }
            
            .level-difficulty {
                font-size: 7px;
                margin-top: 1px;
            }
        }

        /* 深色主题 */
        .dark-theme {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
        }

        .dark-theme .game-container {
            background: #2c3e50;
            color: #ecf0f1;
        }

        .dark-theme .game-stats {
            background: #34495e;
        }

        .dark-theme .stat-value {
            color: #ecf0f1;
        }

        .dark-theme .game-board {
            background: #34495e;
        }

        .dark-theme .idiom-panel {
            background: #34495e;
        }

        .dark-theme .idiom-display {
            background: #2c3e50;
            border-color: #4a5f7a;
            color: #ecf0f1;
        }

        .dark-theme .idiom-explanation {
            background: #4a5f7a;
            color: #ecf0f1;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1 class="game-title">汉字推箱子成语填空</h1>
            <div class="game-stats">
                <div class="stat-item">
                    <div class="stat-label">关卡</div>
                    <div class="stat-value" id="levelDisplay">1</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">难度</div>
                    <div class="stat-value" id="difficultyDisplay">简单</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">分数</div>
                    <div class="stat-value" id="scoreDisplay">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">步数</div>
                    <div class="stat-value" id="stepsDisplay">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">时间</div>
                    <div class="stat-value" id="timeDisplay">00:00</div>
                </div>
            </div>
        </div>

        <div class="game-main">
            <div class="game-board">
                <div class="canvas-container">
                    <canvas id="gameCanvas" width="480" height="480"></canvas>
                </div>
                <div class="controls">
                    <div class="control-btn empty"></div>
                    <div class="control-btn" onclick="movePlayer(0, -1)">↑</div>
                    <div class="control-btn empty"></div>
                    <div class="control-btn" onclick="movePlayer(-1, 0)">←</div>
                    <div class="control-btn empty"></div>
                    <div class="control-btn" onclick="movePlayer(1, 0)">→</div>
                    <div class="control-btn empty"></div>
                    <div class="control-btn" onclick="movePlayer(0, 1)">↓</div>
                    <div class="control-btn empty"></div>
                </div>
            </div>

            <div class="idiom-panel">
                <div class="idiom-title">成语填空</div>
                <div class="idiom-explanation" id="idiomExplanation">
                    请将正确的汉字推到对应位置完成成语
                </div>
                <div class="idiom-display" id="idiomDisplay">
                    ____
                </div>
                
                <div class="game-tips">
                    <p class="tip-text">💡 遇到死局时可点击"重置"按钮重新开始当前关卡</p>
                </div>
                
                <div class="action-buttons">
                    <button class="action-btn" onclick="undoMove()">撤销</button>
                    <button class="action-btn" onclick="resetLevel()">重置</button>
                    <button class="action-btn" onclick="showHint()">提示</button>
                    <button class="action-btn" onclick="showLevelSelector()">选关</button>
                    <button class="action-btn" onclick="nextLevel()">下一关</button>
                </div>
                
                <div class="success-message" id="successMessage">
                    恭喜！成语填写正确！
                </div>
                
                <div class="error-message" id="errorMessage">
                    成语填写有误，请重试！
                </div>
            </div>
        </div>
    </div>

    <!-- 关卡选择器 -->
    <div id="levelSelector" class="level-selector" style="display: none;">
        <div class="level-selector-content">
            <div class="level-selector-header">
                <h3>选择关卡</h3>
                <button class="close-btn" onclick="hideLevelSelector()">×</button>
            </div>
            <div class="level-grid" id="levelGrid">
                <!-- 关卡按钮将通过JavaScript动态生成 -->
            </div>
        </div>
    </div>

    <script>
        // 游戏状态
        const gameState = {
            currentLevel: 1,
            maxUnlockedLevel: 1, // 最高解锁关卡
            score: 0,
            steps: 0,
            startTime: Date.now(),
            gameWon: false,
            playerPos: { x: 0, y: 0 },
            boxes: [],
            targets: [],
            walls: [],
            moveHistory: [],
            currentIdiom: null
        };
        
        // 布局生成统计
        let layoutStats = {
            totalAttempts: 0,
            successfulGenerations: 0,
            failedGenerations: 0,
            averageAttempts: 0
        };

        // 成语数据库
        const idiomDatabase = [
            // 简单级别 (1-33)
            { idiom: "一心一意", explanation: "形容做事专心，注意力集中", blanks: [0, 2], difficulty: "easy" },
            { idiom: "四面八方", explanation: "指各个方向，到处", blanks: [0, 2], difficulty: "easy" },
            { idiom: "人山人海", explanation: "形容人群拥挤", blanks: [0, 2], difficulty: "easy" },
            { idiom: "三心二意", explanation: "意志不坚定，犹豫不决", blanks: [0, 2], difficulty: "easy" },
            { idiom: "五光十色", explanation: "形容色彩繁多，非常好看", blanks: [0, 2], difficulty: "easy" },
            { idiom: "七上八下", explanation: "形容心情不安", blanks: [0, 2], difficulty: "easy" },

        // 初始化游戏
        function initGame() {
            loadProgress(); // 加载游戏进度
            loadGameData();
            
            // 确保游戏从已解锁的关卡开始，但不超过最高解锁关卡
            if (gameState.currentLevel > gameState.maxUnlockedLevel) {
                gameState.currentLevel = gameState.maxUnlockedLevel;
            }
            
            generateLevel(gameState.currentLevel);
            updateDisplay();
            drawGame();
            startTimer();
        }

        // 生成关卡
        function generateLevel(level) {
            // 按难度级别顺序选择成语
            const easyIdioms = idiomDatabase.filter(idiom => idiom.difficulty === "easy");
            const mediumIdioms = idiomDatabase.filter(idiom => idiom.difficulty === "medium");
            const hardIdioms = idiomDatabase.filter(idiom => idiom.difficulty === "hard");
            
            let selectedIdiom;
            
            if (level <= easyIdioms.length) {
                // 简单级别 (1-33)
                selectedIdiom = easyIdioms[level - 1];
            } else if (level <= easyIdioms.length + mediumIdioms.length) {
                // 中等级别 (34-66)
                const mediumIndex = level - easyIdioms.length - 1;
                selectedIdiom = mediumIdioms[mediumIndex];
            } else if (level <= easyIdioms.length + mediumIdioms.length + hardIdioms.length) {
                // 困难级别 (67-99)
                const hardIndex = level - easyIdioms.length - mediumIdioms.length - 1;
                selectedIdiom = hardIdioms[hardIndex];
            } else {
                // 超过99关后循环
                const totalIdioms = idiomDatabase.length;
                const cycleIndex = (level - 1) % totalIdioms;
                selectedIdiom = idiomDatabase[cycleIndex];
            }
            
            gameState.currentIdiom = selectedIdiom;
            
            // 重置游戏状态
            gameState.gameWon = false;
            gameState.steps = 0;
            gameState.moveHistory = [];
            
            // 生成简单的推箱子布局
            generateSimpleLayout();
            
            // 更新成语显示
            updateIdiomDisplay();
        }

        // 生成汉字箱子数组
        function generateCharacters(idiom) {
            console.log("generateCharacters开始，成语:", idiom.idiom, "空白位置:", idiom.blanks);
            const characters = [];
            const correctChars = [];
            
            // 收集需要填空的正确汉字
            idiom.blanks.forEach(blankIndex => {
                correctChars.push(idiom.idiom[blankIndex]);
            });
            
            // 统计每个正确汉字的数量
            const charCount = {};
            correctChars.forEach(char => {
                charCount[char] = (charCount[char] || 0) + 1;
            });
            
            // 添加正确汉字（按需要的数量）
            Object.keys(charCount).forEach(char => {
                for (let i = 0; i < charCount[char]; i++) {
                    characters.push(char);
                }
            });
            
            // 添加干扰汉字
            const distractors = ["二", "三", "五", "六", "七", "八", "九", "十", "百", "千", "万", "大", "小", "多", "少", "好", "坏", "新", "老", "高", "低"];
            const usedChars = new Set(characters);
            
            // 添加2-4个干扰汉字
            const distractorCount = Math.min(4, Math.max(2, 8 - characters.length));
            let added = 0;
            for (let i = 0; i < distractors.length && added < distractorCount; i++) {
                if (!usedChars.has(distractors[i])) {
                    characters.push(distractors[i]);
                    added++;
                }
            }
            
            // 打乱数组
            for (let i = characters.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [characters[i], characters[j]] = [characters[j], characters[i]];
            }
            
            console.log("生成的汉字数组:", characters);
            return characters;
        }

        // 检查位置是否为墙
        function isWall(x, y) {
            return gameState.walls.some(wall => wall.x === x && wall.y === y);
        }
        
        // 检查位置是否有箱子
        function hasBox(x, y) {
            return gameState.boxes.some(box => box.x === x && box.y === y);
        }
        
        // 检查位置是否可以放置箱子（不是墙，不在边界，周围有足够空间推动）
        function canPlaceBox(x, y) {
            // 边界检查
            if (x <= 1 || x >= GRID_WIDTH - 2 || y <= 1 || y >= GRID_HEIGHT - 2) {
                return false;
            }
            
            // 不能是墙
            if (isWall(x, y)) {
                return false;
            }
            
            // 检查是否在角落（角落容易形成死局）
            if (isCornerPosition(x, y)) {
                return false;
            }
            
            // 检查至少有两个相邻方向可以推动
            const directions = [
                { dx: 1, dy: 0 },   // 右
                { dx: -1, dy: 0 },  // 左
                { dx: 0, dy: 1 },   // 下
                { dx: 0, dy: -1 }   // 上
            ];
            
            let validDirections = 0;
            for (let dir of directions) {
                const pushFromX = x - dir.dx;
                const pushFromY = y - dir.dy;
                const pushToX = x + dir.dx;
                const pushToY = y + dir.dy;
                
                // 检查推动起点和终点都不是墙
                if (!isWall(pushFromX, pushFromY) && !isWall(pushToX, pushToY)) {
                    validDirections++;
                }
            }
            
            // 至少需要两个方向可以推动，避免箱子被困在死胡同
            return validDirections >= 2;
        }
        
        // 检查是否是角落位置
        function isCornerPosition(x, y) {
            const adjacentWalls = [
                isWall(x - 1, y),  // 左
                isWall(x + 1, y),  // 右
                isWall(x, y - 1),  // 上
                isWall(x, y + 1)   // 下
            ];
            
            // 如果有两个相邻的墙，则认为是角落
            return (adjacentWalls[0] && adjacentWalls[2]) || // 左上角
                   (adjacentWalls[0] && adjacentWalls[3]) || // 左下角
                   (adjacentWalls[1] && adjacentWalls[2]) || // 右上角
                   (adjacentWalls[1] && adjacentWalls[3]);   // 右下角
        }
        
        // 获取所有可用的空位置
        function getAvailablePositions() {
            const positions = [];
            for (let x = 2; x < GRID_WIDTH - 2; x++) {
                for (let y = 2; y < GRID_HEIGHT - 2; y++) {
                    if (canPlaceBox(x, y) && !hasBox(x, y)) {
                        positions.push({ x, y });
                    }
                }
            }
            return positions;
        }
        
        // 生成简单布局（改进版）
        function generateSimpleLayout() {
            console.log("generateSimpleLayout开始，当前成语:", gameState.currentIdiom.idiom, "难度:", gameState.currentIdiom.difficulty);
            let attempts = 0;
            const maxAttempts = 50; // 增加最大尝试次数
            
            // 记录总尝试次数
            layoutStats.totalAttempts++;
            
            // 尝试生成可解的布局
            while (attempts < maxAttempts) {
                attempts++;
                
                // 清空数组
                gameState.walls = [];
                gameState.boxes = [];
                gameState.targets = [];
                
                // 设置玩家位置
                gameState.playerPos = { x: 1, y: 1 };
                
                // 添加边界墙
                for (let x = 0; x < GRID_WIDTH; x++) {
                    gameState.walls.push({ x: x, y: 0 });
                    gameState.walls.push({ x: x, y: GRID_HEIGHT - 1 });
                }
                for (let y = 0; y < GRID_HEIGHT; y++) {
                    gameState.walls.push({ x: 0, y: y });
                    gameState.walls.push({ x: GRID_WIDTH - 1, y: y });
                }
                
                // 根据难度添加内部墙（更保守的策略）
                addInternalWallsCarefully();
                
                // 根据成语设置目标位置
                const idiom = gameState.currentIdiom;
                const blankCount = idiom.blanks.length;
                
                // 设置目标位置（优化分布）
                const targetPositions = generateOptimalTargetPositions(blankCount);
                for (let i = 0; i < blankCount; i++) {
                    gameState.targets.push({
                        x: targetPositions[i].x,
                        y: targetPositions[i].y,
                        charIndex: idiom.blanks[i],
                        filled: false
                    });
                }
                
                // 生成汉字箱子
                const characters = generateCharacters(idiom);
                
                // 智能放置箱子
                if (placeBoxesIntelligently(characters)) {
                    // 进行全面的布局验证
                    if (isLayoutFullySolvable()) {
                        layoutStats.successfulGenerations++;
                        layoutStats.averageAttempts = layoutStats.totalAttempts / layoutStats.successfulGenerations;
                        return; // 找到可解的布局
                    }
                }
            }
            
            // 如果多次尝试都失败，使用安全的默认布局
            layoutStats.failedGenerations++;
            generateSafeLayout();
        }

        // 检查墙位置是否安全（不会造成明显死局）
        function isWallPositionSafe(wallPos) {
            // 临时添加墙来测试
            gameState.walls.push(wallPos);
            
            // 检查是否会创建封闭区域或阻断关键路径
            let isSafe = true;
            
            // 检查是否会将游戏区域分割成无法连通的部分
            const reachablePositions = getReachablePositions(gameState.playerPos);
            const totalFreePositions = getAvailablePositions().length;
            
            // 如果可达位置太少，说明墙阻断了太多路径
            // 降低阈值，允许更多墙的添加
            if (reachablePositions.length < totalFreePositions * 0.4) {
                isSafe = false;
            }
            
            // 移除临时添加的墙
            gameState.walls.pop();
            
            return isSafe;
        }
        
        // 获取从指定位置可达的所有位置
        function getReachablePositions(startPos) {
            const visited = new Set();
            const queue = [startPos];
            const reachable = [];
            
            while (queue.length > 0) {
                const pos = queue.shift();
                const key = `${pos.x},${pos.y}`;
                
                if (visited.has(key)) continue;
                visited.add(key);
                reachable.push(pos);
                
                // 检查四个方向
                const directions = [
                    { x: pos.x + 1, y: pos.y },
                    { x: pos.x - 1, y: pos.y },
                    { x: pos.x, y: pos.y + 1 },
                    { x: pos.x, y: pos.y - 1 }
                ];
                
                for (let dir of directions) {
                    if (!isWall(dir.x, dir.y) && !visited.has(`${dir.x},${dir.y}`)) {
                        queue.push(dir);
                    }
                }
            }
            
            return reachable;
        }

        // 智能放置箱子
        function placeBoxesIntelligently(characters) {
            console.log("placeBoxesIntelligently开始，汉字数组:", characters);
            const maxPlacementAttempts = 20;
            
            for (let attempt = 0; attempt < maxPlacementAttempts; attempt++) {
                gameState.boxes = [];
                
                // 获取所有可用位置
                const availablePositions = getAvailablePositions();
                
                // 过滤掉目标位置和玩家位置
                let candidatePositions = availablePositions.filter(pos => 
                    !gameState.targets.some(target => target.x === pos.x && target.y === pos.y) &&
                    !(pos.x === gameState.playerPos.x && pos.y === gameState.playerPos.y)
                );
                
                // 进一步过滤掉明显的死局位置
                candidatePositions = candidatePositions.filter(pos => {
                    // 检查是否在角落
                    const inCorner = isPositionInCorner(pos.x, pos.y);
                    if (inCorner) return false;
                    
                    // 检查是否在死亡边缘
                    const onDeadEdge = isPositionOnDeadEdge(pos.x, pos.y);
                    if (onDeadEdge) return false;
                    
                    return true;
                });
                
                if (candidatePositions.length < characters.length) {
                    continue;
                }
                
                // 按照与目标的距离排序，优先选择距离适中的位置
                candidatePositions.sort((a, b) => {
                    const aScore = calculatePositionScore(a);
                    const bScore = calculatePositionScore(b);
                    return bScore - aScore; // 分数高的优先
                });
                
                // 放置箱子
                for (let i = 0; i < characters.length; i++) {
                    gameState.boxes.push({
                        x: candidatePositions[i].x,
                        y: candidatePositions[i].y,
                        character: characters[i]
                    });
                }
                
                // 检查放置是否合理
                if (isBoxPlacementValid()) {
                    return true;
                }
            }
            
            return false;

        // 检查位置是否在角落
        function isPositionInCorner(x, y) {
            const corners = [
                [isWall(x-1, y), isWall(x, y-1)],
                [isWall(x+1, y), isWall(x, y-1)],
                [isWall(x-1, y), isWall(x, y+1)],
                [isWall(x+1, y), isWall(x, y+1)]
            ];
            
            for (let corner of corners) {
                if (corner[0] && corner[1]) {
                    return true;
                }
            }
            
            return false;
        }
        
        // 检查位置是否在死亡边缘
        function isPositionOnDeadEdge(x, y) {
            // 如果在边界且没有目标在同一行或列
            if (x === 1 || x === GRID_WIDTH - 2) {
                const hasTargetInColumn = gameState.targets.some(t => t.x === x);
                if (!hasTargetInColumn) return true;
            }
            
            if (y === 1 || y === GRID_HEIGHT - 2) {
                const hasTargetInRow = gameState.targets.some(t => t.y === y);
                if (!hasTargetInRow) return true;
            }
            
            return false;
        }
        
        // 计算位置分数（分数越高越适合放置箱子）
        function calculatePositionScore(pos) {
            let score = 0;
            
            // 距离所有目标的平均距离（适中的距离得分更高）
            let totalDistance = 0;
            for (let target of gameState.targets) {
                const distance = Math.abs(pos.x - target.x) + Math.abs(pos.y - target.y);
                totalDistance += distance;
            }
            const avgDistance = totalDistance / gameState.targets.length;
            
            // 距离在2-4之间的位置得分更高
            if (avgDistance >= 2 && avgDistance <= 4) {
                score += 10;
            } else if (avgDistance >= 1 && avgDistance <= 5) {
                score += 5;
            }
            
            // 中心位置得分更高
            const centerX = GRID_WIDTH / 2;
            const centerY = GRID_HEIGHT / 2;
            const distanceFromCenter = Math.abs(pos.x - centerX) + Math.abs(pos.y - centerY);
            score += Math.max(0, 10 - distanceFromCenter);
            
            // 避免边缘位置
            if (pos.x === 1 || pos.x === GRID_WIDTH - 2 || pos.y === 1 || pos.y === GRID_HEIGHT - 2) {
                score -= 5;
            }
            
            return score;
        }
        
        // 检查两个箱子是否相互阻挡形成死局
        function areBoxesDeadlocked(box1, box2) {
            // 检查两个箱子是否相邻
            const distance = Math.abs(box1.x - box2.x) + Math.abs(box1.y - box2.y);
            if (distance !== 1) return false;
            
            // 检查是否在角落或边缘形成阻挡
            const dx = box2.x - box1.x;
            const dy = box2.y - box1.y;
            
            // 检查两个箱子是否都无法移动到有用的位置
            if (dx !== 0) { // 水平相邻
                // 检查上下是否都被墙阻挡
                const upBlocked = isWall(box1.x, box1.y - 1) && isWall(box2.x, box2.y - 1);
                const downBlocked = isWall(box1.x, box1.y + 1) && isWall(box2.x, box2.y + 1);
                return upBlocked || downBlocked;
            } else { // 垂直相邻
                // 检查左右是否都被墙阻挡
                const leftBlocked = isWall(box1.x - 1, box1.y) && isWall(box2.x - 1, box2.y);
                const rightBlocked = isWall(box1.x + 1, box1.y) && isWall(box2.x + 1, box2.y);
                return leftBlocked || rightBlocked;
            }
        }
        
        // 检查箱子放置是否有效
        function isBoxPlacementValid() {
            // 检查是否有箱子相互阻挡
            for (let i = 0; i < gameState.boxes.length; i++) {
                for (let j = i + 1; j < gameState.boxes.length; j++) {
                    if (areBoxesDeadlocked(gameState.boxes[i], gameState.boxes[j])) {
                        return false;
                    }
                }
            }
            
            // 检查每个箱子是否至少能到达一个目标
            for (let box of gameState.boxes) {
                let canReachTarget = false;
                for (let target of gameState.targets) {
                    if (canBoxReachTarget(box, target)) {
                        canReachTarget = true;
                        break;
                    }
                }
                if (!canReachTarget) {
                    return false;
                }
            }
            
            return true;
        }
        
        // 全面的布局可解性验证
        function isLayoutFullySolvable() {
            // 先进行基本验证
            if (!isLayoutSolvable()) {
                return false;
            }
            
            // 进行增强的死局检测
            const deadlockInfo = analyzeCurrentState();
            if (deadlockInfo.hasDeadlock) {
                return false;

            if (!canAllBoxesReachTargets()) {
