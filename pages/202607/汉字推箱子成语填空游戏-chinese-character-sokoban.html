            }
            
            return true;
        }
        
        // 检查所有箱子是否都能到达对应的目标
        function canAllBoxesReachTargets() {
            // 使用匈牙利算法或简单的贪心算法检查箱子和目标的匹配
            const boxes = [...gameState.boxes];
            const targets = [...gameState.targets];
            
            // 简单的贪心匹配：为每个箱子找到最近的可达目标
            for (let box of boxes) {
                let foundTarget = false;
                for (let i = 0; i < targets.length; i++) {
                    const target = targets[i];
                    if (canBoxReachTarget(box, target)) {
                        targets.splice(i, 1); // 移除已匹配的目标
                        foundTarget = true;
                        break;
                    }
                }
                if (!foundTarget) {
                    return false;
                }
            }
            
            return true;
        }
        
        // 验证布局是否可解
        function isLayoutSolvable() {
            // 基本检查：确保所有箱子都能到达至少一个目标位置
            for (let box of gameState.boxes) {
                let canReachTarget = false;
                for (let target of gameState.targets) {
                    if (canBoxReachTarget(box, target)) {
                        canReachTarget = true;
                        break;
                    }
                }
                if (!canReachTarget) {
                    return false;
                }
            }
            
            // 检查玩家是否能到达所有箱子的推动位置
            for (let box of gameState.boxes) {
                if (!canPlayerReachBox(box)) {
                    return false;
                }
            }
            
            return true;
        }
        
        // 检查箱子是否能到达目标位置（改进版）
        function canBoxReachTarget(box, target) {
            // 使用BFS算法检查箱子是否能被推到目标位置
            const visited = new Set();
            const queue = [{ x: box.x, y: box.y }];
            
            while (queue.length > 0) {
                const current = queue.shift();
                const key = `${current.x},${current.y}`;
                
                if (visited.has(key)) continue;
                visited.add(key);
                
                // 如果到达目标位置
                if (current.x === target.x && current.y === target.y) {
                    return true;
                }
                
                // 检查四个方向的推动
                const directions = [
                    { dx: 1, dy: 0 }, { dx: -1, dy: 0 },
                    { dx: 0, dy: 1 }, { dx: 0, dy: -1 }
                ];
                
                for (let dir of directions) {
                    const newX = current.x + dir.dx;
                    const newY = current.y + dir.dy;
                    const pushFromX = current.x - dir.dx;
                    const pushFromY = current.y - dir.dy;
                    
                    // 检查新位置是否有效
                    if (newX < 1 || newX >= GRID_WIDTH - 1 || 
                        newY < 1 || newY >= GRID_HEIGHT - 1) continue;
                    
                    // 检查新位置是否是墙
                    if (isWall(newX, newY)) continue;
                    
                    // 检查推动位置是否有效且玩家可达
                    if (pushFromX < 1 || pushFromX >= GRID_WIDTH - 1 || 
                        pushFromY < 1 || pushFromY >= GRID_HEIGHT - 1) continue;
                    
                    if (isWall(pushFromX, pushFromY)) continue;
                    
                    // 检查新位置是否会形成死局
                    if (wouldCreateDeadlock(newX, newY, target)) continue;
                    
                    // 检查玩家是否能到达推动位置
                    if (canPlayerReachPosition(pushFromX, pushFromY, current.x, current.y)) {
                        queue.push({ x: newX, y: newY });
                    }
                }
            }
            
            return false;
        }
        
        // 检查玩家是否能到达箱子（改进版）
        function canPlayerReachBox(box) {
            // 检查箱子周围是否有玩家可以到达的位置
            const directions = [
                { dx: 1, dy: 0 }, { dx: -1, dy: 0 },
                { dx: 0, dy: 1 }, { dx: 0, dy: -1 }
            ];
            
            for (let dir of directions) {
                const pushFromX = box.x - dir.dx;
                const pushFromY = box.y - dir.dy;
                
                if (!isWall(pushFromX, pushFromY) && 
                    canPlayerReachPosition(pushFromX, pushFromY, box.x, box.y)) {
                    return true;
                }
            }
            
            return false;
        }
        
        // 检查玩家是否能到达指定位置（避开指定的箱子位置）
        function canPlayerReachPosition(targetX, targetY, avoidX, avoidY) {
            const visited = new Set();
            const queue = [{ x: gameState.playerPos.x, y: gameState.playerPos.y }];
            
            while (queue.length > 0) {
                const current = queue.shift();
                const key = `${current.x},${current.y}`;
                
                if (visited.has(key)) continue;
                visited.add(key);
                
                // 如果到达目标位置
                if (current.x === targetX && current.y === targetY) {
                    return true;
                }
                
                // 检查四个方向
                const directions = [
                    { dx: 1, dy: 0 }, { dx: -1, dy: 0 },
                    { dx: 0, dy: 1 }, { dx: 0, dy: -1 }
                ];
                
                for (let dir of directions) {
                    const newX = current.x + dir.dx;
                    const newY = current.y + dir.dy;
                    
                    // 检查边界
                    if (newX < 0 || newX >= GRID_WIDTH || 
                        newY < 0 || newY >= GRID_HEIGHT) continue;
                    
                    // 检查是否是墙
                    if (isWall(newX, newY)) continue;
                    
                    // 检查是否是要避开的箱子位置
                    if (newX === avoidX && newY === avoidY) continue;
                    
                    // 检查是否有其他箱子
                    const hasBox = gameState.boxes.some(box => 
                        box.x === newX && box.y === newY && 
                        !(box.x === avoidX && box.y === avoidY)
                    );
                    if (hasBox) continue;
                    
                    queue.push({ x: newX, y: newY });
                }
            }
            
            return false;
        }
        
        // 检查在指定位置放置箱子是否会形成死局
        function wouldCreateDeadlock(x, y, targetPos) {
            // 检查是否在角落且不是目标位置
            if (x === targetPos.x && y === targetPos.y) {
                return false; // 如果是目标位置，不算死局
            }
            
            // 检查四个角落的情况
            const corners = [
                { walls: [isWall(x-1, y), isWall(x, y-1)] },
                { walls: [isWall(x+1, y), isWall(x, y-1)] },
                { walls: [isWall(x-1, y), isWall(x, y+1)] },
                { walls: [isWall(x+1, y), isWall(x, y+1)] }
            ];
            
            for (let corner of corners) {
                if (corner.walls[0] && corner.walls[1]) {
                    return true; // 在角落且不是目标位置
                }
            }
            
            // 检查是否在边缘且无法移动到目标
            if (isOnDeadEdge(x, y, targetPos)) {
                return true;
            }
            
            return false;
        }
        
        // 检查是否在死亡边缘
        function isOnDeadEdge(x, y, targetPos) {
            // 如果在边界墙旁边且不在目标位置的同一行或列
            if ((x === 1 || x === GRID_WIDTH - 2) && 
                targetPos.x !== x && 
                Math.abs(y - targetPos.y) > 2) {
                return true;
            }
            
            if ((y === 1 || y === GRID_HEIGHT - 2) && 
                targetPos.y !== y && 
                Math.abs(x - targetPos.x) > 2) {
                return true;
            }
            
            return false;
        }
        
        // 基本路径检查
        function hasBasicPath(x1, y1, x2, y2) {
            // 简单的曼哈顿距离检查，确保不被墙完全阻隔
            const dx = Math.abs(x2 - x1);
            const dy = Math.abs(y2 - y1);
            
            // 如果距离很近，认为有路径
            if (dx + dy <= 3) {
                return true;
            }
            
            // 检查直线路径是否被阻隔
            if (x1 === x2) {
                // 垂直路径
                const minY = Math.min(y1, y2);
                const maxY = Math.max(y1, y2);
                for (let y = minY + 1; y < maxY; y++) {
                    if (isWall(x1, y)) {
                        return false;
                    }
                }
                return true;
            } else if (y1 === y2) {
                // 水平路径
                const minX = Math.min(x1, x2);
                const maxX = Math.max(x1, x2);
                for (let x = minX + 1; x < maxX; x++) {
                    if (isWall(x, y1)) {
                        return false;
                    }
                }
                return true;
            }
            
            return true; // 对于L形路径，暂时认为可达
        }
        
        // 生成安全的默认布局
        function generateSafeLayout() {
            // 清空数组
            gameState.walls = [];
            gameState.boxes = [];
            gameState.targets = [];
            
            // 设置玩家位置
            gameState.playerPos = { x: 1, y: 1 };
            
            // 添加边界墙
            for (let x = 0; x < GRID_WIDTH; x++) {
                gameState.walls.push({ x: x, y: 0 });
                gameState.walls.push({ x: x, y: GRID_HEIGHT - 1 });
            }
            for (let y = 0; y < GRID_HEIGHT; y++) {
                gameState.walls.push({ x: 0, y: y });
                gameState.walls.push({ x: GRID_WIDTH - 1, y: y });
            }
            
            // 根据难度添加内部墙（即使是安全布局也要保持挑战性）
            addInternalWallsCarefully();
            
            const idiom = gameState.currentIdiom;
            const blankCount = idiom.blanks.length;
            
            // 设置目标位置（底部一行）
            const targetStartX = Math.floor((GRID_WIDTH - blankCount * 2) / 2) + 1;
            for (let i = 0; i < blankCount; i++) {
                gameState.targets.push({
                    x: targetStartX + i * 2,
                    y: GRID_HEIGHT - 2,
                    charIndex: idiom.blanks[i],
                    filled: false
                });
            }
            
            // 生成汉字箱子（放在顶部区域）
            const characters = generateCharacters(idiom);
            console.log("generateSafeLayout中的汉字数组:", characters);
            // 避免角落位置，选择更安全的中心区域位置
            const safeBoxPositions = [
                { x: 3, y: 3 }, { x: 5, y: 3 }, { x: 7, y: 3 },
                { x: 3, y: 5 }, { x: 5, y: 5 }, { x: 7, y: 5 },
                { x: 4, y: 4 }, { x: 6, y: 4 }, { x: 8, y: 4 }
            ];
            
            // 确保所有汉字都被放置
            for (let i = 0; i < characters.length; i++) {
                if (i < safeBoxPositions.length) {
                    const pos = safeBoxPositions[i];
                    // 检查预定义位置是否为墙体或角落
                      if (!isWall(pos.x, pos.y) && !isCornerPosition(pos.x, pos.y)) {
                         gameState.boxes.push({
                             x: pos.x,
                             y: pos.y,
                             character: characters[i]
                         });
                         console.log(`汉字 ${characters[i]} 放置在安全位置 (${pos.x}, ${pos.y})`);
                     } else {
                         const reason = isWall(pos.x, pos.y) ? '是墙体' : '是角落位置';
                          console.log(`预定义位置 (${pos.x}, ${pos.y}) ${reason}，寻找其他位置`);
                        // 如果预定义位置是墙体，寻找其他位置
                        const availablePos = findSafePosition();
                        if (availablePos) {
                             gameState.boxes.push({
                                 x: availablePos.x,
                                 y: availablePos.y,
                                 character: characters[i]
                             });
                             console.log(`汉字 ${characters[i]} 动态放置在位置 (${availablePos.x}, ${availablePos.y})`);
                         } else {
                             console.log(`无法为汉字 ${characters[i]} 找到安全位置`);
                         }
                    }
                } else {
                    // 如果预定义位置不够，动态寻找安全位置
                    const availablePos = findSafePosition();
                    if (availablePos) {
                        gameState.boxes.push({
                            x: availablePos.x,
                            y: availablePos.y,
                            character: characters[i]
                        });
                    }
                }
            }
            console.log("generateSafeLayout放置的箱子:", gameState.boxes);
        }
        
        // 寻找安全的箱子位置
        function findSafePosition() {
            for (let y = 2; y < GRID_HEIGHT - 2; y++) {
                for (let x = 2; x < GRID_WIDTH - 2; x++) {
                    // 检查位置是否可用（避免墙体、角落、已占用位置）
                    if (!isWall(x, y) && 
                        !isCornerPosition(x, y) &&
                        !gameState.boxes.some(box => box.x === x && box.y === y) &&
                        !gameState.targets.some(target => target.x === x && target.y === y) &&
                        !(x === gameState.playerPos.x && y === gameState.playerPos.y)) {
                        return { x, y };
                    }
                }
            }
            return null;
        }
        
        // 更新成语显示
        function updateIdiomDisplay() {
            const idiom = gameState.currentIdiom;
            const explanationEl = document.getElementById('idiomExplanation');
            const displayEl = document.getElementById('idiomDisplay');
            
            explanationEl.textContent = idiom.explanation;
            
            // 构建成语显示
            let displayText = '';
            for (let i = 0; i < idiom.idiom.length; i++) {
                if (idiom.blanks.includes(i)) {
                    // 检查是否已填入
                    const target = gameState.targets.find(t => t.charIndex === i);
                    if (target && target.filled) {
                        displayText += `<span class="filled-char">${target.filledChar}</span>`;
                    } else {
                        displayText += `<span class="blank-char">__</span>`;
                    }
                } else {
                    displayText += idiom.idiom[i];
                }
            }
            
            displayEl.innerHTML = displayText;
        }

        // 移动玩家
        function movePlayer(dx, dy) {
            if (gameState.gameWon) return;
            
            const newX = gameState.playerPos.x + dx;
            const newY = gameState.playerPos.y + dy;
            
            // 检查边界
            if (newX < 0 || newX >= GRID_WIDTH || newY < 0 || newY >= GRID_HEIGHT) {
                return;
            }
            
            // 检查墙壁
            if (gameState.walls.some(wall => wall.x === newX && wall.y === newY)) {
                return;
            }
            
            // 检查箱子
            const boxIndex = gameState.boxes.findIndex(box => box.x === newX && box.y === newY);
            if (boxIndex !== -1) {
                // 尝试推箱子
                const boxNewX = newX + dx;
                const boxNewY = newY + dy;
                
                // 检查箱子新位置是否有效
                if (boxNewX < 0 || boxNewX >= GRID_WIDTH || boxNewY < 0 || boxNewY >= GRID_HEIGHT) {
                    return;
                }
                
                if (gameState.walls.some(wall => wall.x === boxNewX && wall.y === boxNewY)) {
                    return;
                }
                
                if (gameState.boxes.some(box => box.x === boxNewX && box.y === boxNewY)) {
                    return;
                }
                
                // 保存移动历史
                gameState.moveHistory.push({
                    playerPos: { ...gameState.playerPos },
                    boxIndex: boxIndex,
                    boxPos: { x: gameState.boxes[boxIndex].x, y: gameState.boxes[boxIndex].y }
                });
                
                // 移动箱子
                gameState.boxes[boxIndex].x = boxNewX;
                gameState.boxes[boxIndex].y = boxNewY;
                
                // 检查箱子是否到达目标位置
                checkBoxOnTarget(boxIndex);
            } else {
                // 保存移动历史（只移动玩家）
                gameState.moveHistory.push({
                    playerPos: { ...gameState.playerPos }
                });
            }
            
            // 移动玩家
            gameState.playerPos.x = newX;
            gameState.playerPos.y = newY;
            gameState.steps++;
            
            updateDisplay();
            drawGame();
            
            // 检查是否完成关卡
            checkLevelComplete();
        }

        // 重新检查所有目标位置的状态
        function updateAllTargetStates() {
            const idiom = gameState.currentIdiom;
            
            // 重置所有目标状态
            gameState.targets.forEach(target => {
                target.filled = false;
                target.filledChar = null;
            });
            
            // 检查每个目标位置
            gameState.targets.forEach(target => {
                const boxOnTarget = gameState.boxes.find(box => box.x === target.x && box.y === target.y);
                if (boxOnTarget) {
                    const correctChar = idiom.idiom[target.charIndex];
                    if (boxOnTarget.character === correctChar) {
                        target.filled = true;
                        target.filledChar = boxOnTarget.character;
                    }
                }
            });
            
            updateIdiomDisplay();
        }
        
        // 检查箱子是否在目标位置
        function checkBoxOnTarget(boxIndex) {
            const box = gameState.boxes[boxIndex];
            const target = gameState.targets.find(t => t.x === box.x && t.y === box.y);
            
            if (target) {
                // 检查汉字是否正确
                const idiom = gameState.currentIdiom;
                const correctChar = idiom.idiom[target.charIndex];
                
                if (box.character === correctChar) {
                    showMessage('正确！', 'success');
                } else {
                    showMessage('汉字不正确，请重试！', 'error');
                }
            }
            
            // 重新检查所有目标状态
            updateAllTargetStates();
        }

        // 检查关卡是否完成
        function checkLevelComplete() {
            const allTargetsFilled = gameState.targets.every(target => target.filled);
            
            if (allTargetsFilled) {
                gameState.gameWon = true;
                gameState.score += 1000;
                
                // 解锁下一关
                if (gameState.currentLevel >= gameState.maxUnlockedLevel) {
                    gameState.maxUnlockedLevel = gameState.currentLevel + 1;
                    saveProgress();
                }
                
                showMessage('恭喜完成本关！', 'success');
                setTimeout(() => {
                    nextLevel();
                }, 2000);
            }
        }

        // 撤销移动
        function undoMove() {
            if (gameState.moveHistory.length === 0) return;
            
            const lastMove = gameState.moveHistory.pop();
            gameState.playerPos = lastMove.playerPos;
            
            if (lastMove.boxIndex !== undefined) {
                gameState.boxes[lastMove.boxIndex].x = lastMove.boxPos.x;
                gameState.boxes[lastMove.boxIndex].y = lastMove.boxPos.y;
                
                // 重新检查所有目标状态
                updateAllTargetStates();
            }
            
            gameState.steps = Math.max(0, gameState.steps - 1);
            updateDisplay();
            drawGame();
        }

        // 重置关卡
        function resetLevel() {
            console.log("重置关卡，当前关卡:", gameState.currentLevel);
            generateLevel(gameState.currentLevel);
            updateDisplay();
            drawGame();
        }

        // 下一关
        function nextLevel() {
            const nextLevelNum = gameState.currentLevel + 1;
            if (nextLevelNum <= gameState.maxUnlockedLevel) {
                gameState.currentLevel = nextLevelNum;
                generateLevel(gameState.currentLevel);
                updateDisplay();
                drawGame();
            } else {
                showMessage('请先完成当前关卡！', 'error');
            }
        }
        
        // 保存游戏进度
        function saveProgress() {
            const progress = {
                maxUnlockedLevel: gameState.maxUnlockedLevel,
                totalScore: gameState.score
            };
            localStorage.setItem('sokobanProgress', JSON.stringify(progress));
        }
        
        // 加载游戏进度
        function loadProgress() {
            const saved = localStorage.getItem('sokobanProgress');
            if (saved) {
                const progress = JSON.parse(saved);
                gameState.maxUnlockedLevel = progress.maxUnlockedLevel || 1;
            }
        }
        
        // 选择关卡
        function selectLevel(level) {
            if (level <= gameState.maxUnlockedLevel) {
                gameState.currentLevel = level;
                generateLevel(gameState.currentLevel);
                updateDisplay();
                drawGame();
                hideLevelSelector();
            } else {
                showMessage('该关卡尚未解锁！', 'error');
            }
        }
        
        // 显示关卡选择器
        function showLevelSelector() {
            generateLevelButtons();
            document.getElementById('levelSelector').style.display = 'flex';
        }
        
        // 隐藏关卡选择器
        function hideLevelSelector() {
            document.getElementById('levelSelector').style.display = 'none';
        }
        
        // 生成关卡按钮
        function generateLevelButtons() {
            const levelGrid = document.getElementById('levelGrid');
            levelGrid.innerHTML = '';
            
            for (let i = 1; i <= 99; i++) {
                const btn = document.createElement('button');
                btn.className = 'level-btn';
                btn.onclick = () => selectLevel(i);
                
                // 确定关卡状态
                if (i === gameState.currentLevel) {
                    btn.classList.add('current');
                } else if (i <= gameState.maxUnlockedLevel) {
                    btn.classList.add('unlocked');
                } else {
                    btn.classList.add('locked');
                }
                
                // 确定难度
                let difficulty = '';
                if (i <= 33) {
                    difficulty = '简单';
                } else if (i <= 66) {
                    difficulty = '中等';
                } else {
                    difficulty = '困难';
                }
                
                btn.innerHTML = `
                    <div>${i}</div>
                    <div class="level-difficulty">${difficulty}</div>
                `;
                
                levelGrid.appendChild(btn);
            }
        }

        // 显示提示
        function showHint() {
            const idiom = gameState.currentIdiom;
            
            // 检查是否有当前成语
            if (!idiom) {
                alert('当前没有可用的提示！请先开始游戏。');
                return;
            }
            
            const correctChars = idiom.blanks.map(i => idiom.idiom[i]);
            const charCount = {};
            correctChars.forEach(char => {
                charCount[char] = (charCount[char] || 0) + 1;
            });
            
            const charList = Object.keys(charCount).map(char => {
                return charCount[char] > 1 ? `${char}(${charCount[char]}个)` : char;
            }).join('、');
            
            const hintText = `成语：${idiom.idiom}\n解释：${idiom.explanation}\n\n需要填入的字：${charList}`;
            alert(hintText);
        }
        
        // 检测死局
        function checkDeadlock() {
            const deadlockInfo = analyzeCurrentState();
            
            if (deadlockInfo.hasDeadlock) {
                const message = `检测到死局！\n问题：${deadlockInfo.reason}\n\n是否重新生成布局？`;
                if (confirm(message)) {
                    regenerateLevel();
                }
            } else {
                showMessage('当前布局可解，没有检测到死局！', 'success');
            }
        }
        
        // 分析当前游戏状态（增强版）
        function analyzeCurrentState() {
            // 检查是否有箱子被困在角落
            for (let box of gameState.boxes) {
                if (isBoxStuckInCorner(box)) {
                    return {
                        hasDeadlock: true,
                        reason: `箱子"${box.character}"被困在角落无法移动`
                    };
                }
            }
            
            // 检查箱子是否形成不可解的相互阻挡
            const blockingResult = checkBoxBlocking();
            if (blockingResult.hasDeadlock) {
                return blockingResult;
            }
            
            // 检查是否有箱子无法到达任何目标
            for (let box of gameState.boxes) {
                let canReachAnyTarget = false;
                for (let target of gameState.targets) {
                    if (canBoxReachTarget(box, target)) {
                        canReachAnyTarget = true;
                        break;
                    }
                }
                if (!canReachAnyTarget) {
                    return {
                        hasDeadlock: true,
                        reason: `箱子"${box.character}"无法到达任何目标位置`
                    };
                }
            }
            
            // 检查玩家是否能到达所有箱子
            for (let box of gameState.boxes) {
                if (!canPlayerReachBox(box)) {
                    return {
                        hasDeadlock: true,
                        reason: `玩家无法到达箱子"${box.character}"进行推动`
                    };
                }
            }
            
            // 检查是否有箱子在死亡线上
            const deadlineResult = checkDeadlines();
            if (deadlineResult.hasDeadlock) {
                return deadlineResult;
            }
            
            return { hasDeadlock: false };
        }
        
        // 检查箱子相互阻挡形成的死局
        function checkBoxBlocking() {
            // 检查两个或多个箱子是否形成无法解开的阻挡
            for (let i = 0; i < gameState.boxes.length; i++) {
                for (let j = i + 1; j < gameState.boxes.length; j++) {
                    const box1 = gameState.boxes[i];
                    const box2 = gameState.boxes[j];
                    
                    // 检查两个箱子是否相邻且形成死局
                    if (areBoxesDeadlocked(box1, box2)) {
                        return {
                            hasDeadlock: true,
                            reason: `箱子"${box1.character}"和"${box2.character}"相互阻挡形成死局`
                        };
                    }
                }
            }
            
            return { hasDeadlock: false };
        }
        
        // 检查两个箱子是否形成死局
        function areBoxesDeadlocked(box1, box2) {
            const dx = Math.abs(box1.x - box2.x);
            const dy = Math.abs(box1.y - box2.y);
            
            // 如果两个箱子相邻
            if ((dx === 1 && dy === 0) || (dx === 0 && dy === 1)) {
                // 检查是否都在角落或边缘
                const box1InCorner = isInCornerOrEdge(box1);
                const box2InCorner = isInCornerOrEdge(box2);
                
                if (box1InCorner && box2InCorner) {
                    // 检查是否都不在目标位置
                    const box1OnTarget = gameState.targets.some(t => t.x === box1.x && t.y === box1.y);
                    const box2OnTarget = gameState.targets.some(t => t.x === box2.x && t.y === box2.y);
                    
                    if (!box1OnTarget && !box2OnTarget) {
                        return true;
                    }
                }
            }
            
            return false;
        }
        
        // 检查箱子是否在角落或边缘
        function isInCornerOrEdge(box) {
            const x = box.x;
            const y = box.y;
            
            // 检查是否在角落
            const corners = [
                [isWall(x-1, y), isWall(x, y-1)],
                [isWall(x+1, y), isWall(x, y-1)],
                [isWall(x-1, y), isWall(x, y+1)],
                [isWall(x+1, y), isWall(x, y+1)]
            ];
            
            for (let corner of corners) {
                if (corner[0] && corner[1]) {
                    return true;
                }
            }
            
            // 检查是否在边缘
            if (x === 1 || x === GRID_WIDTH - 2 || y === 1 || y === GRID_HEIGHT - 2) {
                return true;
            }
            
            return false;
        }
        
        // 检查死亡线（箱子在边缘且无法到达目标）
        function checkDeadlines() {
            for (let box of gameState.boxes) {
                // 检查是否在边缘
                if (box.x === 1 || box.x === GRID_WIDTH - 2) {
                    // 检查是否有目标在同一列
                    const hasTargetInColumn = gameState.targets.some(t => t.x === box.x);
                    if (!hasTargetInColumn) {
                        // 检查是否能移动到有目标的列
                        let canMoveToTargetColumn = false;
                        for (let target of gameState.targets) {
                            if (canBoxReachTarget(box, target)) {
                                canMoveToTargetColumn = true;
                                break;
                            }
                        }
                        if (!canMoveToTargetColumn) {
                            return {
                                hasDeadlock: true,
                                reason: `箱子"${box.character}"在边缘且无法到达任何目标列`
                            };
                        }
                    }
                }
                
                if (box.y === 1 || box.y === GRID_HEIGHT - 2) {
                    // 检查是否有目标在同一行
                    const hasTargetInRow = gameState.targets.some(t => t.y === box.y);
                    if (!hasTargetInRow) {
                        // 检查是否能移动到有目标的行
                        let canMoveToTargetRow = false;
                        for (let target of gameState.targets) {
                            if (canBoxReachTarget(box, target)) {
                                canMoveToTargetRow = true;
                                break;
                            }
                        }
                        if (!canMoveToTargetRow) {
                            return {
                                hasDeadlock: true,
                                reason: `箱子"${box.character}"在边缘且无法到达任何目标行`
                            };
                        }
                    }
                }
            }
            
            return { hasDeadlock: false };
        }
        
        // 检查箱子是否被困在角落
        function isBoxStuckInCorner(box) {
            const x = box.x;
            const y = box.y;
            
            // 检查四个角落的情况
            const corners = [
                { walls: [isWall(x-1, y), isWall(x, y-1)], name: "左上" },
                { walls: [isWall(x+1, y), isWall(x, y-1)], name: "右上" },
                { walls: [isWall(x-1, y), isWall(x, y+1)], name: "左下" },
                { walls: [isWall(x+1, y), isWall(x, y+1)], name: "右下" }
            ];
            
            for (let corner of corners) {
                if (corner.walls[0] && corner.walls[1]) {
                    // 检查这个角落是否有对应的目标位置
                    const hasTargetHere = gameState.targets.some(target => 
                        target.x === x && target.y === y
                    );
                    
                    if (!hasTargetHere) {
                        return true; // 箱子在角落且不是目标位置
                    }
                }
            }
            
            return false;
        }
        
        // 重新生成当前关卡
        function regenerateLevel() {
            generateLevel(gameState.currentLevel);
            updateDisplay();
            drawGame();
            showMessage('布局已重新生成！', 'success');
        }
        
        // 显示布局统计信息
        function showLayoutStats() {
            const successRate = layoutStats.totalAttempts > 0 ? 
                ((layoutStats.successfulGenerations / layoutStats.totalAttempts) * 100).toFixed(1) : 0;
            
            const statsText = `布局生成统计：\n\n` +
                `总生成次数：${layoutStats.totalAttempts}\n` +
                `成功生成：${layoutStats.successfulGenerations}\n` +
                `失败生成：${layoutStats.failedGenerations}\n` +
                `成功率：${successRate}%\n` +
                `平均尝试次数：${layoutStats.averageAttempts.toFixed(2)}\n\n` +
                `这些数据显示了死局避免机制的效果。\n` +
                `成功率越高说明生成的布局质量越好。`;
            
            alert(statsText);
        }

        // 显示消息
        function showMessage(message, type) {
            const successEl = document.getElementById('successMessage');
            const errorEl = document.getElementById('errorMessage');
            
            if (type === 'success') {
                successEl.textContent = message;
                successEl.style.display = 'block';
                errorEl.style.display = 'none';
                setTimeout(() => {
                    successEl.style.display = 'none';
                }, 3000);
            } else {
                errorEl.textContent = message;
                errorEl.style.display = 'block';
                successEl.style.display = 'none';
                setTimeout(() => {
                    errorEl.style.display = 'none';
                }, 3000);
            }
        }

        // 绘制游戏
        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制网格
            ctx.strokeStyle = '#ddd';
            ctx.lineWidth = 1;
            for (let x = 0; x <= GRID_WIDTH; x++) {
                ctx.beginPath();
                ctx.moveTo(x * CELL_SIZE, 0);
                ctx.lineTo(x * CELL_SIZE, GRID_HEIGHT * CELL_SIZE);
                ctx.stroke();
            }
            for (let y = 0; y <= GRID_HEIGHT; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * CELL_SIZE);
                ctx.lineTo(GRID_WIDTH * CELL_SIZE, y * CELL_SIZE);
                ctx.stroke();
            }
            
            // 绘制墙壁
            ctx.fillStyle = '#333';
            gameState.walls.forEach(wall => {
                ctx.fillRect(wall.x * CELL_SIZE, wall.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
            });
            
            // 绘制目标位置
            gameState.targets.forEach(target => {
                ctx.fillStyle = target.filled ? '#28a745' : '#ffc107';
                ctx.beginPath();
                ctx.arc(
                    target.x * CELL_SIZE + CELL_SIZE / 2,
                    target.y * CELL_SIZE + CELL_SIZE / 2,
                    CELL_SIZE / 4,
                    0,
                    2 * Math.PI
                );
                ctx.fill();
                
                // 绘制目标序号
                ctx.fillStyle = '#000';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(
                    (target.charIndex + 1).toString(),
                    target.x * CELL_SIZE + CELL_SIZE / 2,
                    target.y * CELL_SIZE + CELL_SIZE / 2 - 15
                );
            });
            
            // 绘制箱子（汉字）
            gameState.boxes.forEach(box => {
                // 箱子背景（统一样式）
                ctx.fillStyle = '#f8f9fa';
                ctx.fillRect(
                    box.x * CELL_SIZE + 5,
                    box.y * CELL_SIZE + 5,
                    CELL_SIZE - 10,
                    CELL_SIZE - 10
                );
                
                // 箱子边框（统一样式）
                ctx.strokeStyle = '#6c757d';
                ctx.lineWidth = 2;
                ctx.strokeRect(
                    box.x * CELL_SIZE + 5,
                    box.y * CELL_SIZE + 5,
                    CELL_SIZE - 10,
                    CELL_SIZE - 10
                );
                
                // 汉字（统一颜色）
                ctx.fillStyle = '#000';
                ctx.font = 'bold 24px 微软雅黑';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(
                    box.character,
                    box.x * CELL_SIZE + CELL_SIZE / 2,
                    box.y * CELL_SIZE + CELL_SIZE / 2
                );
            });
            
            // 绘制玩家
            ctx.fillStyle = '#007bff';
            ctx.beginPath();
            ctx.arc(
                gameState.playerPos.x * CELL_SIZE + CELL_SIZE / 2,
                gameState.playerPos.y * CELL_SIZE + CELL_SIZE / 2,
                CELL_SIZE / 3,
                0,
                2 * Math.PI
            );
            ctx.fill();
            
            // 玩家眼睛
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(
                gameState.playerPos.x * CELL_SIZE + CELL_SIZE / 2 - 8,
                gameState.playerPos.y * CELL_SIZE + CELL_SIZE / 2 - 5,
                3,
                0,
                2 * Math.PI
            );
            ctx.fill();
            ctx.beginPath();
            ctx.arc(
                gameState.playerPos.x * CELL_SIZE + CELL_SIZE / 2 + 8,
                gameState.playerPos.y * CELL_SIZE + CELL_SIZE / 2 - 5,
                3,
                0,
                2 * Math.PI
            );
            ctx.fill();
        }

        // 更新显示
        function updateDisplay() {
            document.getElementById('levelDisplay').textContent = gameState.currentLevel;
            document.getElementById('scoreDisplay').textContent = gameState.score;
            document.getElementById('stepsDisplay').textContent = gameState.steps;
            
            // 显示当前难度级别
            if (gameState.currentIdiom) {
                const difficultyMap = {
                    'easy': '简单',
                    'medium': '中等', 
                    'hard': '困难'
                };
                document.getElementById('difficultyDisplay').textContent = 
                    difficultyMap[gameState.currentIdiom.difficulty] || '未知';
            }
        }

        // 计时器
        function startTimer() {
            setInterval(() => {
                const elapsed = Math.floor((Date.now() - gameState.startTime) / 1000);
                const minutes = Math.floor(elapsed / 60);
                const seconds = elapsed % 60;
                document.getElementById('timeDisplay').textContent = 
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }, 1000);
        }

        // 数据保存和加载
        function saveGameData() {
            localStorage.setItem('chineseCharacterSokoban', JSON.stringify(gameState));
        }

        function loadGameData() {
            const saved = localStorage.getItem('chineseCharacterSokoban');
            if (saved) {
                const data = JSON.parse(saved);
                Object.assign(gameState, data);
                gameState.startTime = Date.now(); // 重置计时器
            }
        }

        // 键盘事件
        // 调试模式状态
        let debugMode = false;
        let debugKeySequence = [];
        const debugActivationSequence = ['d', 'e', 'b', 'u', 'g'];
        
        document.addEventListener('keydown', function(e) {
            // 检查调试模式激活序列（连续输入debug）
            if (!debugMode && !gameState.gameWon) {
                debugKeySequence.push(e.key.toLowerCase());
                if (debugKeySequence.length > debugActivationSequence.length) {
                    debugKeySequence.shift();
                }
                if (debugKeySequence.join('') === debugActivationSequence.join('')) {
                    debugMode = true;
                    showMessage('调试模式已激活！按Ctrl+1检测死局，按Ctrl+2查看统计，按Ctrl+0关闭', 'success');
                    debugKeySequence = [];
                    return;
                }
            }
            
            // 调试模式快捷键
            if (debugMode && e.ctrlKey) {
                switch(e.key) {
                    case '1':
                        checkDeadlock();
                        e.preventDefault();
                        return;
                    case '2':
                        showLayoutStats();
                        e.preventDefault();
                        return;
                    case '0':
                        debugMode = false;
                        showMessage('调试模式已关闭', 'success');
                        e.preventDefault();
                        return;
                }
            }
            
            if (gameState.gameWon) return;
            
            let dx = 0, dy = 0;
            
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    dy = -1;
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    dy = 1;
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    dx = -1;
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    dx = 1;
                    break;
                case 'u':
                case 'U':
                    undoMove();
                    return;
                case 'r':
                case 'R':
                    resetLevel();
                    return;
                default:
                    return;
            }
            
            e.preventDefault();
            movePlayer(dx, dy);
        });

        // 触摸事件（移动设备支持）
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener('touchstart', function(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            touchStartX = touch.clientX - rect.left;
            touchStartY = touch.clientY - rect.top;
        });

        canvas.addEventListener('touchend', function(e) {
            e.preventDefault();
            if (gameState.gameWon) return;
            
            const touch = e.changedTouches[0];
            const rect = canvas.getBoundingClientRect();
            const touchEndX = touch.clientX - rect.left;
            const touchEndY = touch.clientY - rect.top;
            
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;
            
            const minSwipeDistance = 30;
            
            if (Math.abs(dx) > Math.abs(dy)) {
                if (Math.abs(dx) > minSwipeDistance) {
                    movePlayer(dx > 0 ? 1 : -1, 0);
                }
            } else {
                if (Math.abs(dy) > minSwipeDistance) {
                    movePlayer(0, dy > 0 ? 1 : -1);
                }
            }
        });

        // 窗口大小改变时重新绘制
        window.addEventListener('resize', function() {
            setTimeout(drawGame, 100);
        });

        // 自动保存
        setInterval(saveGameData, 30000); // 每30秒自动保存

        // 初始化游戏
        initGame();
    </script>
