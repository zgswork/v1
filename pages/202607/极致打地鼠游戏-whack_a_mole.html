<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极致打地鼠游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        /* === 全局：把 footer 高度暴露成变量 === */
        :root { --footer-h: 90px; }      /* 45px 留白 + 约 45px footer 本身 */

        body {
            display:flex; flex-direction:column;
            min-height:100vh;             /* 满屏 */
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #f5576c 75%, #4facfe 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            overflow:hidden;
            position: relative;
            padding-bottom: 50px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 背景粒子效果 */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.6; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 1; }
        }

        /* 背景元素 */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .sun {
            position: absolute;
            top: 40px;
            right: 60px;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #FFD700 20%, #FF8C00 60%, #FF6347 100%);
            border-radius: 50%;
            animation: sunPulse 4s ease-in-out infinite;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.6);
        }

        .sun::before {
            content: '';
            position: absolute;
            top: -15px;
            left: -15px;
            right: -15px;
            bottom: -15px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            animation: sunGlow 3s ease-in-out infinite alternate;
        }

        @keyframes sunPulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(180deg); }
        }

        @keyframes sunGlow {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .mountain {
            position: absolute;
            bottom: 180px;
            background: linear-gradient(45deg, #4a5568 0%, #2d3748 50%, #1a202c 100%);
            border-radius: 50% 50% 0 0;
            box-shadow: inset 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .mountain1 {
            left: 8%;
            width: 180px;
            height: 120px;
            transform: skew(-5deg);
        }

        .mountain2 {
            right: 12%;
            width: 150px;
            height: 100px;
            transform: skew(3deg);
        }

        .tree {
            position: absolute;
            bottom: 140px;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
        }

        .tree1 {
            left: 3%;
            width: 80px;
            height: 140px;
        }

        .tree2 {
            right: 5%;
            width: 70px;
            height: 120px;
        }

        .tree::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 50px;
            background: linear-gradient(180deg, #8B4513 0%, #654321 100%);
            border-radius: 5px;
        }

        .tree::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 90px;
            background: linear-gradient(135deg, #228B22 0%, #006400 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            box-shadow: inset 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        /* 游戏容器 */
        .game-container {
            flex:1;
            display:flex;
            flex-direction:column;
            max-width:900px;
            margin:0 auto;
            padding:30px;
            text-align: center;
            position: relative;               /* 创建新层叠上下文 */
            z-index: 5;                       /* 保证内容在最上 */
        } 

        .game-header {
            flex:0 0 auto;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 25px;
            margin-bottom: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        } 

        .game-title {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 1.8rem;
            font-weight: 400;
            margin-bottom: 20px;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            letter-spacing: -1px;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 25px;
            margin-bottom: 25px;
        }

        .info-item {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.1));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 15px 25px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .info-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
        }

        .game-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-start {
            background: linear-gradient(135deg, #4CAF50, #45a049);
        }

        .btn-pause {
            background: linear-gradient(135deg, #FF9800, #e68900);
        }

        .btn-reset {
            background: linear-gradient(135deg, #f44336, #da190b);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* 游戏区域 */
        .game-board {
            flex:1 1 0;
            overflow:hidden;
            position: relative;
            background: linear-gradient(135deg, rgba(34, 139, 34, 0.8) 0%, rgba(0, 100, 0, 0.9) 100%);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 30px;
            box-shadow: inset 0 10px 40px rgba(0, 0, 0, 0.2), 0 20px 60px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .holes-container {
            position: relative;
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        .hole {
            position: absolute;
            width: 90px;
            height: 70px;
            background: radial-gradient(ellipse at center, #1a1a1a 0%, #4a4a4a 40%, #6a6a6a 100%);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: inset 0 10px 20px rgba(0, 0, 0, 0.8), 0 5px 15px rgba(0, 0, 0, 0.3);
            border: 3px solid rgba(139, 69, 19, 0.6);
        }

        .hole:hover {
            transform: scale(1.05);
            box-shadow: inset 0 12px 25px rgba(0, 0, 0, 0.9), 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .holes-container {                      /* 高度可略调 */
        position: relative;
        width: 100%;
        max-width: 700px;
        margin: 0 auto;
        height:100%;
        }

        .hole {                                 /* 不再在 CSS 中指定 top/left */
            position: absolute;
            width: 90px;  height: 70px;
            /* 其余视觉样式不变… */
        }

        .mole {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #8B4513 0%, #A0522D 50%, #CD853F 100%);
            border-radius: 50% 50% 40% 40%;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 5;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .mole.show {
            bottom: 15px;
            animation: moleWiggle 0.5s ease-in-out infinite alternate;
        }

        @keyframes moleWiggle {
            0% { transform: translateX(-50%) rotate(-2deg); }
            100% { transform: translateX(-50%) rotate(2deg); }
        }

        .mole::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 18px;
            width: 10px;
            height: 10px;
            background: #000;
            border-radius: 50%;
            box-shadow: 24px 0 0 #000, 12px 8px 0 -2px #FF69B4;
        }

        .mole::after {
            content: '';
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 15px;
            background: #8B4513;
            border-radius: 50% 50% 0 0;
            box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.3);
        }

        .trap {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 40px;
            background: linear-gradient(135deg, #2F2F2F 0%, #696969 50%, #A9A9A9 100%);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 5;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        }

        .trap.show {
            bottom: 20px;
            animation: trapSnap 1s ease-in-out infinite;
        }

        @keyframes trapSnap {
            0%, 80% { transform: translateX(-50%) scale(1); }
            90% { transform: translateX(-50%) scale(1.1); }
            100% { transform: translateX(-50%) scale(1); }
        }

        .trap::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 8px;
            width: 44px;
            height: 25px;
            background: linear-gradient(135deg, #1a1a1a 0%, #4a4a4a 100%);
            border-radius: 15px;
            transform: rotate(-15deg);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
        }

        .trap::after {
            content: '';
            position: absolute;
            top: -15px;
            right: 8px;
            width: 44px;
            height: 25px;
            background: linear-gradient(135deg, #1a1a1a 0%, #4a4a4a 100%);
            border-radius: 15px;
            transform: rotate(15deg);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
        }

        .hit-effect {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #FFD700;
            font-size: 2.5rem;
            font-weight: 800;
            pointer-events: none;
            animation: hitEffect 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
            z-index: 100;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }

        @keyframes hitEffect {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.5);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.2);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.5) translateY(-40px);
            }
        }

        .game-over {
            /* 弹窗化 */
            position: absolute;            /* ⇠ 关键 */
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;                  /* 保证盖在洞和鼹鼠之上 */

            /* 背景 & 圆角等保留原来的 */
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.25);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
            text-align: center;
        }

        .game-over h2 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            white-space:nowrap;
            font-size:clamp(1.8rem, 6vw, 2.5rem); /* 视口变窄时自动缩小 */
            font-weight: 700;
            margin-bottom: 20px;
        }

        .final-score {
            font-size: 1.8rem;
            color: white;
            margin-bottom: 15px;
            font-weight: 600;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            body{
                overflow-x:hidden;   /* 仍禁止横向滚动 */
                overflow-y:auto;     /* 允许竖向滚动 */
                -webkit-overflow-scrolling:touch;
            }

            .game-title {
                font-size: 2.2rem;
            }

            .hole {
                width: 70px;
                height: 55px;
            }

            .mole {
                width: 55px;
                height: 55px;
            }

            .trap {
                width: 50px;
                height: 35px;
            }

            .holes-container {
                height: 380px;
            }

            .hole:nth-child(1) {
                top: 50px;
            }

            .hole:nth-child(2),
            .hole:nth-child(3),
            .hole:nth-child(4) {
                top: 140px;
            }

            .hole:nth-child(5),
            .hole:nth-child(6),
            .hole:nth-child(7),
            .hole:nth-child(8),
            .hole:nth-child(9),
            .hole:nth-child(10) {
                top: 250px;
            }

            .sun {
                width: 70px;
                height: 70px;
                top: 30px;
                right: 40px;
            }

            .mountain1 {
                width: 120px;
                height: 80px;
            }

            .mountain2 {
                width: 100px;
                height: 70px;
            }

            .tree1 {
                width: 60px;
                height: 100px;
            }

            .tree2 {
                width: 50px;
                height: 90px;
            }

            .info-item {
                font-size: 1.1rem;
                padding: 12px 20px;
            }

            .btn {
                font-size: 1rem;
                padding: 12px 24px;
            }
        }
        /* Game Over关闭样式 */
        .close-gameover{
            position:absolute;
            top:12px; right:12px;
            background:transparent;
            border:none;
            font-size:1.6rem;
            line-height:1;
            color:#fff;
            cursor:pointer;
            opacity:.8;
            transition:opacity .2s;
        }
        .close-gameover:hover{ opacity:1; }
    </style>
</head>

        const GAME_DURATION = 15;

        // 创建粒子效果
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 50;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        /* ★ 固定坐标（中心点百分比） */
        const HOLE_COORDS = [
            [0.25, 0.28], [0.50, 0.28], [0.75, 0.28],      // 第一行
            [0.17, 0.50], [0.37, 0.50], [0.57, 0.50], [0.77, 0.50], // 第二行
            [0.29, 0.72], [0.50, 0.72], [0.71, 0.72]       // 第三行
        ];


        /* 把旧的 positionHoles() 替换为 ↓ 这版 */
        function layoutHoles() {
        const container = document.querySelector('.holes-container');
        const holes     = container.querySelectorAll('.hole');

        /* ---------- 1. 只在拿到有效宽高后再真正排布 ---------- */
        const tryLayout = () => {
            const cw = container.clientWidth;

        /* ① 先根据宽度写入高度，再读取新的高度 */
        container.style.height = `${cw * 0.7 | 0}px`;   // 0.7 可按需调整
        const ch = container.clientHeight;

            if (!cw || !ch) {
            requestAnimationFrame(tryLayout);   // 下一帧再试
            return;
            }

            holes.forEach((hole, i) => {
            const [px, py] = HOLE_COORDS[i];
            const x = px * cw - hole.offsetWidth  / 2;
            const y = py * ch - hole.offsetHeight / 2;

            hole.style.left      = `${x}px`;
            hole.style.top       = `${y}px`;
            hole.style.transform = `rotate(${(Math.random()*16-8).toFixed(1)}deg)`;
            });
        };

        tryLayout();

        /* ---------- 2. 尺寸变化时自动重排 ---------- */
        const ro = new ResizeObserver(tryLayout);
        ro.observe(container);
        ro.observe(container.parentNode);

        // ① 关闭按钮事件
        const closeBtn = document.querySelector('#gameOver .close-gameover');
        closeBtn.addEventListener('click', () => {
            document.getElementById('gameOver').style.display = 'none';
        });

        }

        class WhackAMoleGame {
            constructor() {
                this.gameState = 'stopped'; // stopped, playing, paused
                this.score = 0;
                this.timeLeft = GAME_DURATION;
                this.gameTimer = null;
                this.moleTimer = null;
                this.holes = document.querySelectorAll('.hole');
                this.activeElements = new Map(); // 存储活跃的地鼠和陷阱
                
                this.initializeGame();
                this.loadHighScore();
                layoutHoles();                      // ★ 页面加载后布局一次
                window.addEventListener('resize', layoutHoles); // ★ 自适应
            }

            initializeGame() {
                // 绑定按钮事件
                document.getElementById('startBtn').addEventListener('click', () => this.startGame());
                document.getElementById('pauseBtn').addEventListener('click', () => this.pauseGame());
                document.getElementById('stopBtn').addEventListener('click', () => this.stopGame());

                // 为每个洞绑定点击事件
                this.holes.forEach((hole, index) => {
                    hole.addEventListener('click', (e) => this.hitHole(index, e));
                    hole.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        this.hitHole(index, e);
                    });
                });
            }

            startGame() {
                if (this.gameState === 'paused') {
                    this.gameState = 'playing';
                    this.updateButtons();
                    this.startMoleSpawning();
                    this.startGameTimer();
                    return;
                }

                this.gameState = 'playing';
                this.score = 0;
                this.timeLeft = GAME_DURATION;
                this.updateDisplay();
                this.updateButtons();
                this.hideGameOver();
                this.clearAllMoles();
                
                this.startGameTimer();
                this.startMoleSpawning();
            }

            pauseGame() {
                if (this.gameState === 'playing') {
                    this.gameState = 'paused';
                    this.stopTimers();
                    this.updateButtons();
                } else if (this.gameState === 'paused') {
                    this.startGame();
                }
            }

            resetGame() {
                this.stopTimers();          // 关掉计时器
                this.updateHighScore();     // 先刷新最高分
                this.startGame();           // 立即开启下一局
            }

            stopGame() {
                if (this.gameState === 'playing' || this.gameState === 'paused') {
                    this.endGame();              // 复用已有结算逻辑
                }
            }

            endGame() {
                this.gameState = 'stopped';
                this.stopTimers();
                this.clearAllMoles();
                this.updateButtons();
                // 记录本局耗时 →
                const elapsed = GAME_DURATION - this.timeLeft;

                // 更新 Game-Over 弹窗
                document.getElementById('finalScore').textContent = this.score;
                document.getElementById('gameTime').textContent   = elapsed;
                this.showGameOver();

                // 统一把剩余时间归 0 再刷新面板
                this.timeLeft = 0;
                this.updateDisplay();
                this.updateHighScore();
            }

            startGameTimer() {
                this.gameTimer = setInterval(() => {
                    this.timeLeft--;
                    this.updateDisplay();
                    
                    if (this.timeLeft <= 0) {
                        this.endGame();
                    }
                }, 1000);
            }

            startMoleSpawning() {
                const spawnMole = () => {
                    if (this.gameState !== 'playing') return;
                    
                    // 随机选择一个空的洞
                    const availableHoles = Array.from(this.holes)
                        .map((hole, index) => index)
                        .filter(index => !this.activeElements.has(index));
                    
                    if (availableHoles.length === 0) {
                        this.scheduleMoleSpawn();
                        return;
                    }

                    const holeIndex = availableHoles[Math.floor(Math.random() * availableHoles.length)];
                    const isTrap = Math.random() < 0.25; // 25% 概率是陷阱
                    
                    this.spawnElement(holeIndex, isTrap);
                    this.scheduleMoleSpawn();
                };

                spawnMole();
            }

            scheduleMoleSpawn() {
                // 随机间隔 60ms - 1800ms
                const delay = Math.random() * 360 + 60;
                this.moleTimer = setTimeout(() => {
                    if (this.gameState === 'playing') {
                        this.startMoleSpawning();
                    }
                }, delay);
            }

            spawnElement(holeIndex, isTrap) {
                const hole = this.holes[holeIndex];
                const element = document.createElement('div');
                element.className = isTrap ? 'trap' : 'mole';
                
                hole.appendChild(element);
                
                // 延迟显示动画
                setTimeout(() => {
                    element.classList.add('show');
                }, 10);
                
                this.activeElements.set(holeIndex, { element, isTrap });
                
                // 自动消失时间 1000ms - 2500ms
                const hideDelay = Math.random() * 1500 + 1000;
                setTimeout(() => {
                    this.removeElement(holeIndex);
                }, hideDelay);
            }

            removeElement(holeIndex) {
                const elementData = this.activeElements.get(holeIndex);
                if (elementData) {
                    elementData.element.classList.remove('show');
                    setTimeout(() => {
                        if (elementData.element.parentNode) {
                            elementData.element.parentNode.removeChild(elementData.element);
                        }
                    }, 400);
                    this.activeElements.delete(holeIndex);
                }
            }

            hitHole(holeIndex, event) {
                if (this.gameState !== 'playing') return;
                
                const elementData = this.activeElements.get(holeIndex);
                if (!elementData) return;
                
                const { element, isTrap } = elementData;
                
                // 移除元素
                this.removeElement(holeIndex);
                
                // 计分
                const points = isTrap ? -10 : 10;
                this.score += points;
                this.updateDisplay();
                
                // 显示击中效果
                this.showHitEffect(event.currentTarget, points);
            }

            showHitEffect(target, points) {
                const effect = document.createElement('div');
                effect.className = 'hit-effect';
                effect.textContent = points > 0 ? `+${points}` : `${points}`;
                effect.style.color = points > 0 ? '#4CAF50' : '#f44336';
                
                target.appendChild(effect);
                
                setTimeout(() => {
                    if (effect.parentNode) {
                        effect.parentNode.removeChild(effect);
                    }
                }, 1200);
            }

            clearAllMoles() {
                this.activeElements.forEach((elementData, holeIndex) => {
                    this.removeElement(holeIndex);
                });
                this.activeElements.clear();
            }

            stopTimers() {
                if (this.gameTimer) {
                    clearInterval(this.gameTimer);
                    this.gameTimer = null;
                }
                if (this.moleTimer) {
                    clearTimeout(this.moleTimer);
                    this.moleTimer = null;
                }
            }

            updateDisplay() {
                document.getElementById('score').textContent = this.score;
                document.getElementById('timeLeft').textContent = this.timeLeft;
            }

            updateButtons() {
                const startBtn = document.getElementById('startBtn');
                const pauseBtn = document.getElementById('pauseBtn');
                const stopBtn = document.getElementById('stopBtn');

                switch (this.gameState) {
                    case 'stopped':
                        startBtn.textContent = '开始游戏';
                        startBtn.disabled = false;
                        pauseBtn.textContent = '暂停游戏';
                        pauseBtn.disabled = true;
                        stopBtn.disabled = true;
                        break;
                    case 'playing':
                        startBtn.disabled = true;
                        pauseBtn.textContent = '暂停游戏';
                        pauseBtn.disabled = false;
                        stopBtn.disabled = false;
                        break;
                    case 'paused':
                        startBtn.disabled = true;
                        pauseBtn.textContent = '继续游戏';
                        pauseBtn.disabled = false;
                        stopBtn.disabled = true;
                        break;
                }
            }

            showGameOver() {
                const gameOverDiv = document.getElementById('gameOver');
                const finalScore = document.getElementById('finalScore');
                const gameTime = document.getElementById('gameTime');
                
                finalScore.textContent = this.score;
                gameTime.textContent = GAME_DURATION - this.timeLeft;
                gameOverDiv.style.display = 'block';
            }

            hideGameOver() {
                document.getElementById('gameOver').style.display = 'none';
            }

            loadHighScore() {
                const savedHighScore = localStorage.getItem('whackAMoleHighScore');
                if (savedHighScore) {
                    document.getElementById('highScore').textContent = savedHighScore;
                }
            }

            updateHighScore() {
                const highScoreSpan = document.getElementById('highScore');
                const currentHigh   = parseInt(highScoreSpan.textContent) || 0;
                if (this.score > currentHigh) {
                    highScoreSpan.textContent = this.score;
                    localStorage.setItem('whackAMoleHighScore', this.score);
                }
            }
        }

        // 启动游戏
        document.addEventListener('DOMContentLoaded', () => {
            createParticles();
            document.getElementById('timeLeft').textContent = GAME_DURATION;
            new WhackAMoleGame();
            layoutHoles();
        });

        //渲染广告位
        document.addEventListener('DOMContentLoaded', () => {
            const tpl = document.getElementById('site-footer');
            if (tpl && 'content' in tpl) {
            document.body.appendChild(tpl.content.cloneNode(true));
            }

            // 用 data-img 填充 <img src>
            document.querySelectorAll('.qr-wrapper').forEach(w => {
            const link = w.querySelector('.qr-link');
            const img  = w.querySelector('.qr-img');
            if (link && img && link.dataset.img) {
                img.src = link.dataset.img.trim();
            }
            });
        });
    </script>
</body>
</html>
