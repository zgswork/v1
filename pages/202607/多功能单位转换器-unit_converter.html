<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多功能单位转换器</title>
    <style>
        /* CSS 样式将在这里添加 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 900px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        header {
            background: linear-gradient(135deg, #42a5f5 0%, #1e88e5 100%);
            color: white;
            padding: 25px 30px;
            text-align: center;
            font-size: 2em;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
        }

        header::before {
            content: '🔄';
            margin-right: 10px;
            font-size: 0.9em;
        }

        .tabs {
            display: flex;
            justify-content: space-around;
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            border-bottom: 1px solid rgba(66, 165, 245, 0.2);
            overflow-x: auto;
        }

        .tab-button {
            flex-grow: 1;
            padding: 15px 8px;
            text-align: center;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            color: #546e7a;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
            white-space: nowrap;
            min-width: 80px;
        }

        .tab-button:hover {
            background-color: rgba(66, 165, 245, 0.1);
            color: #42a5f5;
        }

        .tab-button.active {
            color: #1565c0;
            border-bottom: 3px solid #42a5f5;
            background: linear-gradient(135deg, #ffffff 0%, #f8f9ff 100%);
            box-shadow: 0 2px 8px rgba(66, 165, 245, 0.2);
        }

        .content {
            padding: 35px;
            display: none;
            flex-direction: column;
            gap: 30px;
        }

        .content.active {
            display: flex;
        }

        .input-section {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            align-items: center;
            background: linear-gradient(135deg, #f8f9ff 0%, #e8f4fd 100%);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(66, 165, 245, 0.1);
            border: 2px solid #e3f2fd;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 200px;
        }

        .input-group label {
            margin-bottom: 10px;
            font-weight: 600;
            color: #2c3e50;
            font-size: 1.1em;
        }

        .input-group input,
        .input-group select {
            padding: 15px 20px;
            border: 2px solid #e3f2fd;
            border-radius: 15px;
            font-size: 1em;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.3s ease;
            background-color: #fafafa;
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: #42a5f5;
            box-shadow: 0 0 0 4px rgba(66, 165, 245, 0.15);
            outline: none;
            background-color: #ffffff;
        }

        .results-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 18px;
            padding: 25px;
            background: linear-gradient(135deg, #e8f5e8 0%, #c8e6c9 100%);
            border-radius: 15px;
            border: 2px solid #66bb6a;
            box-shadow: 0 8px 25px rgba(102, 187, 106, 0.2);
        }

        .result-item {
            background-color: #ffffff;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid rgba(102, 187, 106, 0.2);
        }

        .result-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .result-item strong {
            display: block;
            font-size: 0.95em;
            color: #2e7d32;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .result-item span {
            font-size: 1.4em;
            font-weight: bold;
            color: #1b5e20;
            word-break: break-all;
        }

        .shortcuts-section {
            padding: 30px;
            background: linear-gradient(135deg, #f8f9ff 0%, #e8f4fd 100%);
            border-top: 2px solid #e3f2fd;
            border-radius: 0 0 20px 20px;
        }

        .shortcuts-section h3 {
            margin-top: 0;
            color: #1565c0;
            font-size: 1.4em;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .shortcut-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .shortcut-button {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            border: none;
            padding: 12px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.95em;
            color: #546e7a;
            transition: all 0.3s ease;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(66, 165, 245, 0.2);
            position: relative;
            overflow: hidden;
        }

        .shortcut-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .shortcut-button:hover::before {
            left: 100%;
        }

        .shortcut-button:hover {
            background: linear-gradient(135deg, #bbdefb 0%, #90caf9 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(66, 165, 245, 0.3);
        }

        .shortcut-button.active {
            background: linear-gradient(135deg, #42a5f5 0%, #1e88e5 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(66, 165, 245, 0.4);
        }

        /* 页脚样式 */
        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 14px;
            border-top: 1px solid #e3f2fd;
            margin-top: 20px;
        }

        .footer strong {
            font-weight: 600;
            color: #333;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            body {
                padding-top: 8px;
                padding-left: 8px;
                padding-right: 8px;
            }

            .container {
                width: 100%;
                margin: 0 auto;
                border-radius: 15px;
                max-width: 100%;
            }

            header {
                font-size: 1.5em;
                padding: 18px 15px;
            }

            .tabs {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none; /* Firefox */
                -ms-overflow-style: none; /* IE and Edge */
            }

            .tabs::-webkit-scrollbar {
                display: none; /* Chrome, Safari, Opera */
            }

            .tab-button {
                font-size: 0.85em;
                padding: 12px 4px;
                min-width: 50px;
                flex-shrink: 0;
            }

            .content {
                padding: 20px 15px;
                gap: 20px;
            }

            .input-section {
                flex-direction: row;
                align-items: flex-end;
                padding: 15px;
                gap: 10px;
            }

            .input-group {
                flex: 1;
                min-width: 0;
            }

            .input-group label {
                font-size: 0.9em;
                margin-bottom: 6px;
            }

            .input-group input,
            .input-group select {
                padding: 10px 12px;
                border-radius: 12px;
                font-size: 0.9em;
            }

            .results-section {
                grid-template-columns: 1fr 1fr !important;
                gap: 12px;
                padding: 15px;
            }

            .result-item {
                padding: 12px;
            }

            .result-item strong {
                font-size: 0.85em;
            }

            .result-item span {
                font-size: 0.95em;
            }

            .shortcuts-section {
                padding: 20px 15px;
            }

            .shortcuts-section h3 {
                font-size: 1em;
            }

            .shortcut-button {
                padding: 8px 12px;
                font-size: 0.85em;
            }
        }

        @media (max-width: 400px) {
            .tab-button {
                font-size: 0.8em;
                padding: 10px 3px;
                min-width: 45px;
            }

            .results-section {
                grid-template-columns: 1fr 1fr !important;
                gap: 10px;
            }

            .tab-button {
                font-size: 0.85em;
                padding: 10px 4px;
                min-width: 60px;
            }
        }
    </style>
</head>

            // 定义所有单位及其与基础单位（米、克、摄氏度、平方米、立方米、米/秒、秒、比特）的转换关系

            // 定义单位缩写
            const unitAbbreviations = {

                // 体积单位
                '立方米': 'm³', '立方千米': 'km³', '立方分米': 'dm³', '立方厘米': 'cm³', '立方毫米': 'mm³', '升': 'L', '分升': 'dL', '毫升': 'mL', '厘升': 'cL', '公石': 'hL', '微升': 'µL',
                '立方英尺': 'ft³', '立方英寸': 'in³', '立方码': 'yd³', '亩英尺': 'ac-ft', '英制加仑': 'imp gal', '美制加仑': 'US gal', '英制液体盎司': 'imp fl oz', '美制液体盎司': 'US fl oz',
                // 速度单位
                '米/秒': 'm/s', '千米/秒': 'km/s', '千米/时': 'km/h', '毫米/秒': 'mm/s', '微米/秒': 'µm/s', '公里/时': 'km/h', '光速': 'c', '音速': 'Ma',
                '马赫': 'Ma', '英里/时': 'mph', '英寸/秒': 'in/s', '英尺/秒': 'ft/s',
                '海里/时': 'kn', '海里/秒': 'nmi/s',
                // 时间单位
                '分': 'min', '秒': 's', '时': 'h', '天': 'day', '周': 'week', '月': 'month', '年': 'year', '毫秒': 'ms', '微秒': 'µs', '纳秒': 'ns',
                // 存储单位
                '兆字节': 'MB', '千兆字节': 'GB', '比特': 'bit', '字节': 'B', '千字节': 'KB', '太字节': 'TB', '拍字节': 'PB'
            };

            // 定义常用转换快捷选项
            const commonShortcuts = {
                length: [
                    { value: 1, unit: '米' }, { value: 1, unit: '千米' }, { value: 1, unit: '英寸' },
                    { value: 1, unit: '英尺' }, { value: 1, unit: '英里' }, { value: 1, unit: '公里' },
                    { value: 1, unit: '里' }, { value: 1, unit: '丈' }, { value: 1, unit: '尺' }
                ],
                weight: [
                    { value: 1, unit: '千克' }, { value: 1, unit: '吨' }, { value: 1, unit: '磅' },
                    { value: 1, unit: '盎司' }, { value: 1, unit: '斤' }, { value: 1, unit: '两' }
                ],
                temperature: [
                    { value: 0, unit: '摄氏度' }, { value: 100, unit: '摄氏度' }, { value: 32, unit: '华氏度' },
                    { value: 212, unit: '华氏度' }, { value: 273.15, unit: '开氏度' }
                ],
                area: [
                    { value: 1, unit: '平方米' }, { value: 1, unit: '平方千米' }, { value: 1, unit: '公顷' },
                    { value: 1, unit: '英亩' }, { value: 1, unit: '平方英里' }, { value: 1, unit: '亩' }
                ],
                volume: [
                    { value: 1, unit: '立方米' }, { value: 1, unit: '升' }, { value: 1, unit: '立方英尺' },
                    { value: 1, unit: '英制加仑' }, { value: 1, unit: '美制加仑' }
                ],
                speed: [
                    { value: 1, unit: '米/秒' }, { value: 1, unit: '千米/时' }, { value: 1, unit: '英里/时' },
                    { value: 1, unit: '马赫' }, { value: 1, unit: '光速' }
                ],
                time: [
                    { value: 60, unit: '秒' }, { value: 1, unit: '分' }, { value: 1, unit: '时' },
                    { value: 1, unit: '天' }, { value: 1, unit: '年' }
                ],
                storage: [
                    { value: 1, unit: '兆字节' }, { value: 1, unit: '千兆字节' }, { value: 1, unit: '比特' },
                    { value: 1, unit: '字节' }, { value: 1, unit: '千字节' }, { value: 1, unit: '拍字节' }
                ]
            };

            // 填充单位选项
            function populateUnits() {
                for (const type in units) {
                    const selectElement = document.getElementById(`${type}-unit`);
                    selectElement.innerHTML = ''; // 清空现有选项

                    if (type === 'temperature' || type === 'time' || type === 'storage') {
                        // 温度、时间、存储单位没有子分类
                        for (const unitName in units[type]) {
                            const option = document.createElement('option');
                            option.value = unitName;
                            option.textContent = unitAbbreviations[unitName] ? `${unitName} (${unitAbbreviations[unitName]})` : unitName;
                            selectElement.appendChild(option);
                        }
                    } else {
                        // 其他单位有公制、英制、市制等子分类
                        for (const category in units[type]) {
                            const optgroup = document.createElement('optgroup');
                            optgroup.label = {
                                metric: '公制',
                                imperial: '英制',
                                city: '市制',
                                nautical: '航海' // 添加航海分类
                            }[category];
                            for (const unitName in units[type][category]) {
                                const option = document.createElement('option');
                                option.value = unitName;
                                // 对于市制单位，不显示英文缩写
                                if (category === 'city') {
                                    option.textContent = unitName;
                                } else {
                                    option.textContent = unitAbbreviations[unitName] ? `${unitName} (${unitAbbreviations[unitName]})` : unitName;
                                }
                                optgroup.appendChild(option);
                            }
                            selectElement.appendChild(optgroup);
                        }
                    }
                }
            }

            // 填充快捷选项
            function populateShortcuts() {
                for (const type in commonShortcuts) {
                    const shortcutsContainer = document.getElementById(`${type}-shortcuts`);
                    shortcutsContainer.innerHTML = ''; // 清空现有快捷选项

                    commonShortcuts[type].forEach(shortcut => {
                        const button = document.createElement('button');
                        button.classList.add('shortcut-button');
                        // 对于市制单位，不显示英文缩写
                        const unitCategory = findUnitCategory(type, shortcut.unit);
                        if (unitCategory === 'city') {
                            button.textContent = `${shortcut.value}${shortcut.unit}`;
                        } else {
                            button.textContent = unitAbbreviations[shortcut.unit] ? `${shortcut.value}${shortcut.unit} (${unitAbbreviations[shortcut.unit]})` : `${shortcut.value}${shortcut.unit}`;
                        }
                        
                        button.addEventListener('click', () => {
                            document.getElementById(`${type}-value`).value = shortcut.value;
                            document.getElementById(`${type}-unit`).value = shortcut.unit;
                            convertUnits(type);
                            // 移除所有active类
                            shortcutsContainer.querySelectorAll('.shortcut-button').forEach(btn => btn.classList.remove('active'));
                            // 添加active类到当前点击的按钮
                            button.classList.add('active');
                        });
                        shortcutsContainer.appendChild(button);
                    });
                }
            }

            // 辅助函数：查找单位所属的分类
            function findUnitCategory(type, unitName) {
                if (units[type]) {
                    for (const category in units[type]) {
                        if (units[type][category][unitName] !== undefined) {
                            return category;
                        }
                    }
                }
                return null;
            }

            // 单位转换逻辑
            function convertUnits(type) {
                const valueInput = document.getElementById(`${type}-value`);
                const unitSelect = document.getElementById(`${type}-unit`);
                const resultsContainer = document.getElementById(`${type}-results`);

                let inputValue = parseFloat(valueInput.value);
                let inputUnit = unitSelect.value;

                if (isNaN(inputValue)) {
                    resultsContainer.innerHTML = '<div class="result-item"><span>请输入有效数字</span></div>';
                    return;
                }

                resultsContainer.innerHTML = ''; // 清空结果

                if (type === 'temperature') {
                    // 温度单位的特殊转换
                    const baseValueCelsius = units[type][inputUnit].toBase(inputValue);

                    for (const targetUnit in units[type]) {
                        // 排除当前输入单位
                        if (targetUnit === inputUnit) continue;

                        const convertedValue = units[type][targetUnit].fromBase(baseValueCelsius);
                        const resultItem = document.createElement('div');
                        resultItem.classList.add('result-item');
                        resultItem.innerHTML = `<strong>${unitAbbreviations[targetUnit] ? `${targetUnit} (${unitAbbreviations[targetUnit]})` : targetUnit}</strong><span>${parseFloat(convertedValue.toFixed(4))}</span>`;
                        resultsContainer.appendChild(resultItem);
                    }
                } else if (type === 'time' || type === 'storage') {
                    // 时间、存储单位的特殊转换 (没有子分类)
                    const baseValue = inputValue * units[type][inputUnit];
                    for (const targetUnit in units[type]) {
                        if (targetUnit === inputUnit) continue;
                        const convertedValue = baseValue / units[type][targetUnit];
                        const resultItem = document.createElement('div');
                        resultItem.classList.add('result-item');
                        resultItem.innerHTML = `<strong>${unitAbbreviations[targetUnit] ? `${targetUnit} (${unitAbbreviations[targetUnit]})` : targetUnit}</strong><span>${parseFloat(convertedValue.toFixed(6))}</span>`;
                        resultsContainer.appendChild(resultItem);
                    }
                } else {
                    // 其他单位的通用转换 (有子分类: length, weight, area, volume, speed)
                    let baseValue = 0; // 统一转换为基础单位

                    // 找到输入单位的基础值
                    let foundInputUnit = false;
                    let inputUnitCategory = findUnitCategory(type, inputUnit);

                    if (inputUnitCategory) {
                        baseValue = inputValue * units[type][inputUnitCategory][inputUnit];
                        foundInputUnit = true;
                    }

                    if (!foundInputUnit) {
                        resultsContainer.innerHTML = '<div class="result-item"><span>未知单位</span></div>';
                        return;
                    }

                    // 转换并显示所有单位的结果
                    for (const category in units[type]) {
                        for (const targetUnit in units[type][category]) {
                            // 排除当前输入单位
                            if (targetUnit === inputUnit) continue;

                            const convertedValue = baseValue / units[type][category][targetUnit];
                            const resultItem = document.createElement('div');
                            resultItem.classList.add('result-item');
                            // 对于市制单位，不显示英文缩写
                            if (category === 'city') {
                                resultItem.innerHTML = `<strong>${targetUnit}</strong><span>${parseFloat(convertedValue.toFixed(6))}</span>`;
                            } else if (type === 'volume' && (targetUnit === '英制液体盎司' || targetUnit === '美制液体盎司')) {
                                resultItem.innerHTML = `<strong>${targetUnit}<br>(${unitAbbreviations[targetUnit]})</strong><span>${parseFloat(convertedValue.toFixed(6))}</span>`;
                            }
                            else {
                                resultItem.innerHTML = `<strong>${unitAbbreviations[targetUnit] ? `${targetUnit} (${unitAbbreviations[targetUnit]})` : targetUnit}</strong><span>${parseFloat(convertedValue.toFixed(6))}</span>`;
                            }
                            resultsContainer.appendChild(resultItem);
                        }
                    }
                }
            }

            // 切换标签页
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const targetTab = tab.dataset.tab;

                    tabs.forEach(t => t.classList.remove('active'));
                    contents.forEach(c => c.classList.remove('active'));

                    tab.classList.add('active');
                    document.getElementById(targetTab).classList.add('active');

                    // 每次切换标签页时重新填充单位和快捷选项，并执行转换
                    populateUnits();
                    populateShortcuts();
                    convertUnits(targetTab);
                });
            });

            // 输入值或单位改变时实时转换
            document.querySelectorAll('.input-section input[type="number"], .input-section select').forEach(input => {
                input.addEventListener('input', (event) => {
                    const type = event.target.id.split('-')[0];
                    convertUnits(type);
                });
            });

            // 初始加载时填充单位和快捷选项，并执行转换
            populateUnits();
            populateShortcuts();
            convertUnits('length'); // 默认显示长度转换
        });
    </script>
</body>
</html>
