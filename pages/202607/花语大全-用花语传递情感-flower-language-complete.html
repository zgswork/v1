<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>花语大全 - 用花语传递情感</title>
    <meta name="description" content="查询各种花卉的花语含义，了解不同朵数的寓意，为您的特殊时刻选择最合适的花束">
    
    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 根元素样式 */
        :root {
            /* 颜色变量 */
            --primary-color: #ff6b9d;
            --secondary-color: #c44569;
            --accent-color: #f8b195;
            --light-pink: #ffeef8;
            --light-blue: #f0f8ff;
            --text-primary: #333;
            --text-secondary: #666;
            --text-light: #999;
            --bg-white: #ffffff;
            --bg-gray: #f5f5f5;
            --border-color: #e0e0e0;
            --shadow-light: rgba(0, 0, 0, 0.1);
            --shadow-medium: rgba(0, 0, 0, 0.15);
            
            /* 字体变量 */
            --font-primary: 'Microsoft YaHei', 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            
            /* 间距变量 */
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            
            /* 圆角变量 */
            --radius-sm: 5px;
            --radius-md: 10px;
            --radius-lg: 15px;
            --radius-xl: 20px;
            
            /* 过渡动画 */
            --transition-fast: 0.2s ease;
            --transition-normal: 0.3s ease;
            --transition-slow: 0.5s ease;
        }

        /* 基础body样式 */
        body {
            font-family: var(--font-primary);
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-primary);
            background: linear-gradient(135deg, var(--light-pink) 0%, var(--light-blue) 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 主容器 */
        .flower-language-app {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-lg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 头部样式 */
        .app-header {
            text-align: center;
            padding: var(--spacing-xl) 0;
            animation: fadeInDown 0.8s ease;
        }

        .app-title {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: var(--spacing-sm);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .app-subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 300;
        }

        /* 搜索区域样式 */
        .search-section {
            margin-bottom: var(--spacing-xl);
            animation: fadeIn 1s ease 0.2s both;
        }

        .search-container {
            display: flex;
            gap: var(--spacing-md);
            max-width: 600px;
            margin: 0 auto;
        }

        .search-input {
            flex: 1;
            padding: var(--spacing-md) var(--spacing-lg);
            font-size: 1rem;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-xl);
            background: var(--bg-white);
            transition: all var(--transition-normal);
            outline: none;
        }

        .search-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(255, 107, 157, 0.1);
        }

        .search-btn {
            padding: var(--spacing-md) var(--spacing-xl);
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--radius-xl);
            font-size: 1rem;
            cursor: pointer;
            transition: all var(--transition-normal);
            font-weight: 500;
        }

        .search-btn:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow-light);
        }

        /* 功能导航样式 */
        .feature-nav {
            display: flex;
            justify-content: center;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
            flex-wrap: wrap;
            animation: fadeIn 1s ease 0.4s both;
        }

        .feature-btn {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-sm) var(--spacing-lg);
            background: var(--bg-white);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: all var(--transition-normal);
            font-size: 0.95rem;
            color: var(--text-primary);
        }

        .feature-btn:hover {
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow-light);
        }

        .feature-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* 分类导航样式 */
        .category-section {
            margin-bottom: var(--spacing-xl);
            animation: fadeIn 1s ease 0.6s both;
        }

        .section-title {
            text-align: center;
            font-size: 1.5rem;
            color: var(--text-primary);
            margin-bottom: var(--spacing-lg);
        }

        .category-container {
            display: flex;
            justify-content: center;
            gap: var(--spacing-md);
            flex-wrap: wrap;
        }

        .category-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--spacing-xs);
            padding: var(--spacing-md);
            background: var(--bg-white);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-normal);
            min-width: 80px;
        }

        .category-btn:hover {
            border-color: var(--primary-color);
            transform: translateY(-3px);
            box-shadow: 0 6px 16px var(--shadow-light);
        }

        .category-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* 花卉网格布局 */
        .flowers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: var(--spacing-lg);
            padding: var(--spacing-md);
        }

        /* 花卉卡片样式 */
        .flower-card {
            background: var(--bg-white);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: 0 4px 15px var(--shadow-light);
            transition: all var(--transition-normal);
            cursor: pointer;
            position: relative;
            animation: fadeInUp 0.5s ease both;
        }

        .flower-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px var(--shadow-medium);
        }

        /* 花卉图片 */
        .flower-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: linear-gradient(45deg, #ffeef8, #f0f8ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: var(--primary-color);
        }

        /* 花卉信息 */
        .flower-info {
            padding: var(--spacing-lg);
        }

        .flower-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-md);
        }

        .flower-name {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--text-primary);
            margin: 0;
        }

        .flower-category {
            font-size: 0.85rem;
            color: var(--text-light);
            background: var(--bg-gray);
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: var(--radius-sm);
        }

        /* 花语含义 */
        .meaning-tags {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-md);
        }

        .meaning-tag {
            background: var(--light-pink);
            color: var(--secondary-color);
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
        }

        /* 收藏按钮 */
        .favorite-btn {
            position: absolute;
            top: var(--spacing-md);
            right: var(--spacing-md);
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-normal);
            font-size: 1.2rem;
            box-shadow: 0 2px 8px var(--shadow-light);
        }

        .favorite-btn:hover {
            background: var(--bg-white);
            transform: scale(1.1);
        }

        .favorite-btn.favorited {
            color: var(--primary-color);
            animation: heartBeat 0.3s ease;
        }

        /* 适合对象标签 */
        .suitable-for {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding-top: var(--spacing-md);
            border-top: 1px solid var(--border-color);
        }

        .suitable-tags {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-xs);
        }

        .suitable-tag {
            font-size: 0.85rem;
            color: var(--text-secondary);
            background: var(--bg-gray);
            padding: 2px var(--spacing-sm);
            border-radius: var(--radius-sm);
        }

        /* 模态框基础样式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            position: relative;
            background: var(--bg-white);
            margin: 5% auto;
            padding: 0;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: slideInUp 0.3s ease;
        }

        .modal-close {
            position: absolute;
            right: var(--spacing-lg);
            top: var(--spacing-lg);
            font-size: 2rem;
            font-weight: bold;
            color: var(--text-light);
            cursor: pointer;
            transition: color var(--transition-fast);
            z-index: 1;
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        .modal-body {
            padding: var(--spacing-xl);
        }

        /* 花卉详情样式 */
        .flower-detail {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
        }

        .detail-header {
            display: flex;
            gap: var(--spacing-xl);
            align-items: center;
        }

        .detail-image {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: var(--radius-md);
            box-shadow: 0 4px 15px var(--shadow-light);
            background: linear-gradient(45deg, #ffeef8, #f0f8ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            color: var(--primary-color);
        }

        .detail-name {
            font-size: 2rem;
            color: var(--text-primary);
            margin-bottom: var(--spacing-sm);
        }

        .detail-section {
            padding: var(--spacing-lg);
            background: var(--bg-gray);
            border-radius: var(--radius-md);
        }

        .detail-section-title {
            font-size: 1.2rem;
            color: var(--text-primary);
            margin-bottom: var(--spacing-md);
        }

        /* 朵数含义样式 */
        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: var(--spacing-md);
        }

        .number-card {
            background: var(--bg-white);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            text-align: center;
            box-shadow: 0 2px 10px var(--shadow-light);
            transition: all var(--transition-normal);
            cursor: pointer;
        }

        .number-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 15px var(--shadow-medium);
        }

        .number-count {
            font-size: 2rem;
            color: var(--primary-color);
            font-weight: bold;
            margin-bottom: var(--spacing-sm);
        }

        .number-meaning {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* 场合推荐网格 */
        .occasions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: var(--spacing-lg);
        }

        .occasion-card {
            background: var(--bg-white);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            text-align: center;
            box-shadow: 0 4px 15px var(--shadow-light);
            transition: all var(--transition-normal);
            cursor: pointer;
        }

        .occasion-icon {
            font-size: 3rem;
            margin-bottom: var(--spacing-md);
        }

        /* 页脚样式 */
        .app-footer {
            text-align: center;
            padding: var(--spacing-xl) 0;
            margin-top: var(--spacing-xl);
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* 隐藏元素 */
        .hidden {
            display: none !important;
        }

        /* 加载动画 */
        .loading-spinner {
            text-align: center;
            padding: var(--spacing-xl);
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--bg-gray);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            margin: 0 auto var(--spacing-md);
            animation: spin 1s linear infinite;
        }

        /* 动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* 响应式设计 */
        @media screen and (max-width: 768px) {
            .app-title { font-size: 1.75rem; }
            .search-container { flex-direction: column; }
            .search-btn { width: 100%; }
            .flowers-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
            .detail-header { flex-direction: column; text-align: center; }
            .category-container { display: grid; grid-template-columns: repeat(3, 1fr); }
        }

        @media screen and (max-width: 576px) {
            .flower-language-app { padding: var(--spacing-sm); }
            .app-title { font-size: 1.5rem; }
            .flowers-grid { grid-template-columns: 1fr; }
            .feature-btn { flex: 0 0 calc(50% - var(--spacing-xs)); }
            .modal-content { margin: 20% auto; }
        }
    </style>
</head>
<body>
    <div class="flower-language-app">
        <!-- 头部 -->
        <header class="app-header">
            <h1 class="app-title">🌸 花语大全 🌸</h1>
            <p class="app-subtitle">50种精选花卉，让每一朵花都说出你的心声</p>
        </header>

        <!-- 搜索区域 -->
        <section class="search-section">
            <div class="search-container">
                <input type="text" 
                       id="searchInput" 
                       class="search-input" 
                       placeholder="🔍 搜索花名或花语..."
                       autocomplete="off">
                <button id="searchBtn" class="search-btn">搜索</button>
            </div>
        </section>

        <!-- 功能导航 -->
        <nav class="feature-nav">
            <button class="feature-btn active" data-feature="flowers">
                <span class="feature-icon">🌺</span>
                <span class="feature-text">花卉查询</span>
            </button>
            <button class="feature-btn" data-feature="numbers">
                <span class="feature-icon">💐</span>
                <span class="feature-text">朵数含义</span>
            </button>
            <button class="feature-btn" data-feature="occasions">

            </button>
        </nav>

        <!-- 花卉分类导航 -->
        <section class="category-section" id="categorySection">
            <h2 class="section-title">花卉分类</h2>
            <div class="category-container">
                <button class="category-btn active" data-category="all">
                    <span class="category-emoji">🌷</span>
                    <span>全部</span>
                </button>
                <button class="category-btn" data-category="rose">

                    <span>玫瑰</span>
                </button>
                <button class="category-btn" data-category="lily">
                    <span class="category-emoji">🌺</span>
                    <span>百合</span>
                </button>
                <button class="category-btn" data-category="carnation">
                    <span class="category-emoji">🌸</span>
                    <span>康乃馨</span>
                </button>
                <button class="category-btn" data-category="tulip">
                    <span class="category-emoji">🌷</span>
                    <span>郁金香</span>
                </button>
                <button class="category-btn" data-category="others">
                    <span class="category-emoji">🌻</span>
                    <span>其他</span>
                </button>
            </div>
        </section>

        <!-- 主要内容区域 -->
        <main class="main-content" id="mainContent">
            <!-- 花卉展示区域 -->
            <section class="flowers-section" id="flowersSection">
                <div class="flowers-grid" id="flowersGrid">
                    <div class="loading-spinner">
                        <div class="spinner"></div>
                        <p>正在加载花卉数据...</p>
                    </div>
                </div>
            </section>

            <!-- 朵数含义区域 -->
            <section class="numbers-section hidden" id="numbersSection">
                <h2 class="section-title">朵数含义查询</h2>
                <div class="number-query" style="display: flex; gap: 16px; max-width: 400px; margin: 0 auto 32px;">
                    <input type="number" 
                           id="numberInput" 
                           class="search-input" 
                           placeholder="输入朵数（如：99）"
                           min="1"
                           max="9999"
                           style="flex: 1;">
                    <button id="numberQueryBtn" class="search-btn">查询含义</button>
                </div>
                <div id="numberResult" class="number-result" style="margin-bottom: 32px;"></div>
                <div class="common-numbers">
                    <h3 style="text-align: center; margin-bottom: 20px;">经典朵数含义</h3>
                    <div class="numbers-grid" id="numbersGrid"></div>
                </div>
            </section>

            <!-- 场合推荐区域 -->
            <section class="occasions-section hidden" id="occasionsSection">
                <h2 class="section-title">场合花卉推荐</h2>
                <div class="occasions-grid" id="occasionsGrid"></div>
            </section>

            <!-- 收藏区域 -->
            <section class="favorites-section hidden" id="favoritesSection">
                <h2 class="section-title">我的收藏</h2>
                <div class="flowers-grid" id="favoritesGrid"></div>
                <div class="empty-favorites hidden" id="emptyFavorites" style="text-align: center; padding: 50px; color: #999;">
                    <p>还没有收藏任何花卉哦~</p>
                    <p>点击花卉卡片上的❤️即可收藏</p>
                </div>
            </section>
        </main>

        <!-- 花卉详情模态框 -->
        <div class="modal" id="flowerModal">
            <div class="modal-content">
                <span class="modal-close" id="modalClose">&times;</span>
                <div class="modal-body" id="modalBody"></div>
            </div>
        </div>

        <!-- 页脚 -->
        <footer class="app-footer">
            <p>&copy; 2025 花语大全 | 收录50种花卉，400+花语含义，40+朵数寓意</p>
            <p style="font-size: 0.8rem; color: #999; margin-top: 5px;">花语含义仅供参考，具体含义可能因地域文化而异</p>
        </footer>
    </div>

    // 初始化应用
    function init() {
        bindEvents();
        renderFlowers();
        updateFavoritesCount();
    }

    // 绑定事件
    function bindEvents() {
        // 搜索功能
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        
        searchInput.addEventListener('input', debounce(handleSearch, 300));
        searchBtn.addEventListener('click', handleSearch);
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });
        
        // 功能导航
        document.querySelectorAll('.feature-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const feature = e.target.closest('.feature-btn').dataset.feature;
                switchView(feature);
            });
        });

        // 分类导航
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const category = e.target.closest('.category-btn').dataset.category;
                switchCategory(category);
            });
        });

        // 朵数查询
        const numberQueryBtn = document.getElementById('numberQueryBtn');
        const numberInput = document.getElementById('numberInput');
        
        if (numberQueryBtn) {
            numberQueryBtn.addEventListener('click', queryNumberMeaning);
        }
        
        if (numberInput) {
            numberInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    queryNumberMeaning();
                }
            });
        }

        // 模态框关闭
        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.getElementById('flowerModal').addEventListener('click', function(e) {
            if (e.target.id === 'flowerModal') {
                closeModal();
            }
        });
    }

    // 切换视图
    function switchView(view) {
        currentView = view;
        
        // 更新导航状态
        document.querySelectorAll('.feature-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.feature === view);
        });

        // 隐藏所有内容
        document.querySelectorAll('.main-content > section').forEach(section => {
            section.classList.add('hidden');
        });

        // 显示对应内容
        switch (view) {
            case 'flowers':
                document.getElementById('flowersSection').classList.remove('hidden');
                document.getElementById('categorySection').classList.remove('hidden');
                renderFlowers();
                break;
            case 'numbers':
                document.getElementById('numbersSection').classList.remove('hidden');
                document.getElementById('categorySection').classList.add('hidden');
                renderNumbers();
                break;
            case 'occasions':
                document.getElementById('occasionsSection').classList.remove('hidden');
                document.getElementById('categorySection').classList.add('hidden');
                renderOccasions();
                break;
            case 'favorites':
                document.getElementById('favoritesSection').classList.remove('hidden');
                document.getElementById('categorySection').classList.add('hidden');
                renderFavorites();
                break;
        }
    }

    // 切换分类
    function switchCategory(category) {
        currentCategory = category;
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.category === category);
        });
        renderFlowers();
    }

    // 搜索处理
    function handleSearch() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        let filtered = flowersData;
        
        if (query) {
            filtered = flowersData.filter(flower => 
                flower.name.includes(query) ||
                flower.meanings.some(m => m.includes(query)) ||
                flower.occasions.some(o => o.includes(query)) ||
                flower.suitableFor.some(s => s.includes(query))
            );
        }
        
        if (currentCategory !== 'all') {
            filtered = filtered.filter(f => f.category === currentCategory);
        }
        
        renderFlowerGrid(filtered);
    }

    // 渲染花卉
    function renderFlowers() {
        let flowers = currentCategory === 'all' 
            ? flowersData 
            : flowersData.filter(f => f.category === currentCategory);
        renderFlowerGrid(flowers);
    }

    // 渲染花卉网格
    function renderFlowerGrid(flowers) {
        const grid = document.getElementById('flowersGrid');
        
        if (flowers.length === 0) {
            grid.innerHTML = '<div style="text-align: center; padding: 50px; color: #999;">没有找到相关花卉</div>';
            return;
        }

        const html = flowers.map(flower => `
            <div class="flower-card" data-id="${flower.id}">
                <button class="favorite-btn ${favorites.includes(flower.id) ? 'favorited' : ''}" 
                        data-flower-id="${flower.id}">
                    ${favorites.includes(flower.id) ? '❤️' : '🤍'}
                </button>
                <div class="flower-image">${flower.emoji}</div>
                <div class="flower-info">
                    <div class="flower-header">
                        <h3 class="flower-name">${flower.name}</h3>
                        <span class="flower-category">${flower.categoryName}</span>
                    </div>
                    <div class="meaning-tags">
                        ${flower.meanings.slice(0, 3).map(m => 
                            `<span class="meaning-tag">${m}</span>`
                        ).join('')}
                    </div>
                    <div class="suitable-for">
                        <span style="color: #999;">适合：</span>
                        <div class="suitable-tags">
                            ${flower.suitableFor.slice(0, 2).map(s => 
                                `<span class="suitable-tag">${s}</span>`
                            ).join('')}
                        </div>
                    </div>
                </div>
            </div>
        `).join('');
        
        grid.innerHTML = html;
        
        // 绑定点击事件
        grid.querySelectorAll('.flower-card').forEach(card => {
            card.addEventListener('click', function(e) {
                if (!e.target.closest('.favorite-btn')) {
                    showFlowerDetail(card.dataset.id);
                }
            });
        });
        
        // 绑定收藏按钮事件
        grid.querySelectorAll('.favorite-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                toggleFavorite(btn.dataset.flowerId);
            });
        });
    }

    // 渲染朵数含义
    function renderNumbers() {
        const grid = document.getElementById('numbersGrid');
        const commonNumbers = [1, 3, 9, 11, 19, 21, 33, 52, 66, 99, 108, 365, 520, 999, 1314];
        
        const html = commonNumbers.map(num => {
            const meaning = numberMeanings.find(n => n.number === num);
            return meaning ? `
                <div class="number-card" onclick="showNumberDetail(${num})">
                    <div class="number-count">${num}朵</div>
                    <div class="number-meaning">${meaning.meaning}</div>
                </div>
            ` : '';
        }).join('');
        
        grid.innerHTML = html;
    }

            alert('请输入有效的朵数（1-9999）');
        }
    }

            favorites.splice(index, 1);
        } else {
            favorites.push(id);
        }
        
        try {
            localStorage.setItem('favorites', JSON.stringify(favorites));
        } catch (e) {
            console.error('保存收藏失败:', e);
        }
        
        updateFavoritesCount();
        
        // 更新所有相关按钮
        document.querySelectorAll('.favorite-btn').forEach(btn => {
            if (btn.dataset.flowerId === id) {
                btn.classList.toggle('favorited', favorites.includes(id));
                btn.innerHTML = favorites.includes(id) ? '❤️' : '🤍';
            }
        });
        
        if (currentView === 'favorites') {
            setTimeout(renderFavorites, 300);
        }
    }

    // 更新收藏数量
    function updateFavoritesCount() {
        const btn = document.querySelector('.feature-btn[data-feature="favorites"] .feature-text');
        if (btn) {
            btn.textContent = favorites.length > 0 ? `我的收藏(${favorites.length})` : '我的收藏';
        }
    }

    // 关闭模态框
    function closeModal() {
        document.getElementById('flowerModal').style.display = 'none';
    }

    // 防抖函数
    function debounce(func, wait) {
        let timeout;
        return function executedFunction(...args) {
            const later = () => {
                clearTimeout(timeout);
                func(...args);
            };
            clearTimeout(timeout);
            timeout = setTimeout(later, wait);
        };
    }
    </script>
</body>
</html>
