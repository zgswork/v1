<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 绿色版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            touch-action: manipulation;
        }
        
        .header {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
        }
        
        .score-container {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-align: center;
        }
        
        .score-title {
            font-size: 0.9rem;
            color: #EEE;
        }
        
        .score-value {
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        .game-container {
            width: 100%;
            max-width: 500px;
            background-color: #333;
            border-radius: 10px;
            padding: 15px;
            position: relative;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-gap: 15px;
            background-color: #555;
            border-radius: 8px;
            padding: 15px;
            position: relative;
        }
        
        .cell {
            aspect-ratio: 1;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            transition: all 0.2s;
        }
        
        .tile-2 {
            background-color: #E8F5E9;
            color: #333;
        }
        
        .tile-4 {
            background-color: #C8E6C9;
            color: #333;
        }
        
        .tile-8 {
            background-color: #A5D6A7;
            color: #333;
        }
        
        .tile-16 {
            background-color: #81C784;
            color: white;
        }
        
        .tile-32 {
            background-color: #66BB6A;
            color: white;
        }
        
        .tile-64 {
            background-color: #4CAF50;
            color: white;
        }
        
        .tile-128 {
            background-color: #43A047;
            color: white;
            font-size: 1.8rem;
        }
        
        .tile-256 {
            background-color: #388E3C;
            color: white;
            font-size: 1.8rem;
        }
        
        .tile-512 {
            background-color: #2E7D32;
            color: white;
            font-size: 1.8rem;
        }
        
        .tile-1024 {
            background-color: #1B5E20;
            color: white;
            font-size: 1.5rem;
        }
        
        .tile-2048 {
            background-color: #0D47A1;
            color: white;
            font-size: 1.5rem;
        }
        
        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        
        .game-over-text {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: white;
        }
        
        .restart-button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        
        .share-button {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .instructions {
            margin-top: 20px;
            text-align: center;
            color: white;
            font-size: 1rem;
            max-width: 500px;
        }
        
        .footer {
            margin-top: 30px;
            text-align: center;
            color: white;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            
            .cell {
                font-size: 1.5rem;
            }
            
            .tile-128, .tile-256, .tile-512 {
                font-size: 1.3rem;
            }
            
            .tile-1024, .tile-2048 {
                font-size: 1rem;
            }
        }
        
        @media (max-width: 400px) {
            .grid {
                grid-gap: 10px;
                padding: 10px;
            }
            
            .game-container {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>2048</h1>
        <div class="score-container">
            <div class="score-title">分数</div>
            <div class="score-value" id="score">0</div>
        </div>
    </div>
    
    <div class="game-container">
        <div class="grid" id="grid">
            <!-- 游戏格子将通过JS动态生成 -->
        </div>
        
        <div class="game-over" id="game-over">
            <div class="game-over-text">游戏结束!</div>
            <div class="score-container" style="margin-bottom: 20px;">
                <div class="score-title">最终分数</div>
                <div class="score-value" id="final-score">0</div>
            </div>
            <button class="restart-button" id="restart-button">重新开始</button>
            <button class="share-button" id="share-button">分享结果</button>
        </div>
    </div>
    
    <div class="instructions">
        使用方向键或滑动来移动方块。当两个相同数字的方块相撞时，它们会合并成一个更大的数字！
    </div>
    
    <div class="footer">
        由 兔子先生 用 DeepSeek 1分钟生成，你也可以去尝试制作
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('grid');
            const scoreDisplay = document.getElementById('score');
            const finalScoreDisplay = document.getElementById('final-score');
            const gameOverDisplay = document.getElementById('game-over');
            const restartButton = document.getElementById('restart-button');
            const shareButton = document.getElementById('share-button');
            
            let board = [];
            let score = 0;
            let isGameOver = false;
            let touchStartX = 0;
            let touchStartY = 0;
            let touchEndX = 0;
            let touchEndY = 0;
            
            // 获取当前页面URL
            const gameUrl = window.location.href;
            
            // 初始化游戏
            function initGame() {
                // 清空游戏板
                board = Array(4).fill().map(() => Array(4).fill(0));
                score = 0;
                isGameOver = false;
                scoreDisplay.textContent = '0';
                finalScoreDisplay.textContent = '0';
                gameOverDisplay.style.display = 'none';
                
                // 清空网格
                grid.innerHTML = '';
                
                // 创建16个格子
                for (let i = 0; i < 4; i++) {
                    for (let j = 0; j < 4; j++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.id = `cell-${i}-${j}`;
                        grid.appendChild(cell);
                    }
                }
                
                // 添加两个初始数字
                addRandomTile();
                addRandomTile();
                
                // 更新视图
                updateView();
            }
            
            // 添加随机数字(2或4)
            function addRandomTile() {
                const emptyCells = [];
                
                // 找出所有空格子
                for (let i = 0; i < 4; i++) {
                    for (let j = 0; j < 4; j++) {
                        if (board[i][j] === 0) {
                            emptyCells.push({i, j});
                        }
                    }
                }
                
                // 如果有空格子，随机选择一个并放置2或4
                if (emptyCells.length > 0) {
                    const randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                    board[randomCell.i][randomCell.j] = Math.random() < 0.9 ? 2 : 4;
                }
            }
            
            // 更新视图
            function updateView() {
                for (let i = 0; i < 4; i++) {
                    for (let j = 0; j < 4; j++) {
                        const cell = document.getElementById(`cell-${i}-${j}`);
                        const value = board[i][j];
                        
                        cell.textContent = value === 0 ? '' : value;
                        cell.className = 'cell';
                        
                        if (value > 0) {
                            cell.classList.add(`tile-${value}`);
                        }
                    }
                }
                
                scoreDisplay.textContent = score;
            }
            
            // 移动数字
            function move(direction) {
                if (isGameOver) return false;
                
                let moved = false;
                const oldBoard = JSON.parse(JSON.stringify(board));
                
                // 根据方向处理移动逻辑
                switch (direction) {
                    case 'up':
                        for (let j = 0; j < 4; j++) {
                            for (let i = 1; i < 4; i++) {
                                if (board[i][j] !== 0) {
                                    let k = i;
                                    while (k > 0 && (board[k-1][j] === 0 || board[k-1][j] === board[k][j])) {
                                        if (board[k-1][j] === board[k][j]) {
                                            // 合并
                                            board[k-1][j] *= 2;
                                            board[k][j] = 0;
                                            score += board[k-1][j];
                                            moved = true;
                                            break;
                                        } else if (board[k-1][j] === 0) {
                                            // 移动
                                            board[k-1][j] = board[k][j];
                                            board[k][j] = 0;
                                            moved = true;
                                            k--;
                                        }
                                    }
                                }
                            }
                        }
                        break;
                        
                    case 'down':
                        for (let j = 0; j < 4; j++) {
                            for (let i = 2; i >= 0; i--) {
                                if (board[i][j] !== 0) {
                                    let k = i;
                                    while (k < 3 && (board[k+1][j] === 0 || board[k+1][j] === board[k][j])) {
                                        if (board[k+1][j] === board[k][j]) {
                                            // 合并
                                            board[k+1][j] *= 2;
                                            board[k][j] = 0;
                                            score += board[k+1][j];
                                            moved = true;
                                            break;
                                        } else if (board[k+1][j] === 0) {
                                            // 移动
                                            board[k+1][j] = board[k][j];
                                            board[k][j] = 0;
                                            moved = true;
                                            k++;
                                        }
                                    }
                                }
                            }
                        }
                        break;
                        
                    case 'left':
                        for (let i = 0; i < 4; i++) {
                            for (let j = 1; j < 4; j++) {
                                if (board[i][j] !== 0) {
                                    let k = j;
                                    while (k > 0 && (board[i][k-1] === 0 || board[i][k-1] === board[i][k])) {
                                        if (board[i][k-1] === board[i][k]) {
                                            // 合并
                                            board[i][k-1] *= 2;
                                            board[i][k] = 0;
                                            score += board[i][k-1];
                                            moved = true;
                                            break;
                                        } else if (board[i][k-1] === 0) {
                                            // 移动
                                            board[i][k-1] = board[i][k];
                                            board[i][k] = 0;
                                            moved = true;
                                            k--;
                                        }
                                    }
                                }
                            }
                        }
                        break;
                        
                    case 'right':
                        for (let i = 0; i < 4; i++) {
                            for (let j = 2; j >= 0; j--) {
                                if (board[i][j] !== 0) {
                                    let k = j;
                                    while (k < 3 && (board[i][k+1] === 0 || board[i][k+1] === board[i][k])) {
                                        if (board[i][k+1] === board[i][k]) {
                                            // 合并
                                            board[i][k+1] *= 2;
                                            board[i][k] = 0;
                                            score += board[i][k+1];
                                            moved = true;
                                            break;
                                        } else if (board[i][k+1] === 0) {
                                            // 移动
                                            board[i][k+1] = board[i][k];
                                            board[i][k] = 0;
                                            moved = true;
                                            k++;
                                        }
                                    }
                                }
                            }
                        }
                        break;
                }
                
                // 如果有移动，添加新数字并更新视图
                if (moved) {
                    addRandomTile();
                    updateView();
                    
                    // 检查游戏是否结束
                    if (isGameOverCheck()) {
                        gameOver();
                    }
                } else if (JSON.stringify(oldBoard) !== JSON.stringify(board)) {
                    updateView();
                }
                
                return moved;
            }
            
            // 检查游戏是否结束
            function isGameOverCheck() {
                // 检查是否有空格子
                for (let i = 0; i < 4; i++) {
                    for (let j = 0; j < 4; j++) {
                        if (board[i][j] === 0) {
                            return false;
                        }
                    }
                }
                
                // 检查是否有相邻的相同数字
                for (let i = 0; i < 4; i++) {
                    for (let j = 0; j < 4; j++) {
                        if (j < 3 && board[i][j] === board[i][j+1]) {
                            return false;
                        }
                        if (i < 3 && board[i][j] === board[i+1][j]) {
                            return false;
                        }
                    }
                }
                
                return true;
            }
            
            // 游戏结束
            function gameOver() {
                isGameOver = true;
                finalScoreDisplay.textContent = score;
                gameOverDisplay.style.display = 'flex';
            }
            
            // 键盘事件处理
            document.addEventListener('keydown', (e) => {
                e.preventDefault(); // 阻止默认行为，防止页面滚动
                
                switch (e.key) {
                    case 'ArrowUp':
                        move('up');
                        break;
                    case 'ArrowDown':
                        move('down');
                        break;
                    case 'ArrowLeft':
                        move('left');
                        break;
                    case 'ArrowRight':
                        move('right');
                        break;
                }
            });
            
            // 触摸事件处理
            grid.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }, false);
            
            grid.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].clientX;
                touchEndY = e.changedTouches[0].clientY;
                handleSwipe();
            }, false);
            
            // 处理滑动
            function handleSwipe() {
                const dx = touchEndX - touchStartX;
                const dy = touchEndY - touchStartY;
                
                // 确定滑动方向
                if (Math.abs(dx) > Math.abs(dy)) {
                    // 水平滑动
                    if (dx > 50) {
                        move('right');
                    } else if (dx < -50) {
                        move('left');
                    }
                } else {
                    // 垂直滑动
                    if (dy > 50) {
                        move('down');
                    } else if (dy < -50) {
                        move('up');
                    }
                }
            }
            
            // 重新开始按钮
            restartButton.addEventListener('click', initGame);
            
            // 分享按钮
            shareButton.addEventListener('click', () => {
                const shareText = `我在2048游戏中获得了${score}分！你能超越我吗？快来挑战吧：${gameUrl}`;
                
                if (navigator.share) {
                    navigator.share({
                        title: '2048游戏结果',
                        text: shareText,
                        url: gameUrl
                    }).catch(err => {
                        console.log('分享失败:', err);
                        copyToClipboard(shareText);
                    });
                } else {
                    copyToClipboard(shareText);
                }
            });
            
            // 复制到剪贴板
            function copyToClipboard(text) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('结果已复制到剪贴板，快去分享吧！\n\n' + text);
            }
            
            // 初始化游戏
            initGame();
        });
    </script>
</body>
</html>
