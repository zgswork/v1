<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简易图片编辑工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(90deg, #4b6cb7 0%, #182848 100%);
            color: white;
            padding: 25px 40px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .main-content {
            display: flex;
            padding: 30px;
            gap: 30px;
        }
        
        .upload-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .preview-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .panel {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }
        
        .panel-title {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .panel-title i {
            font-size: 1.5rem;
            color: #3498db;
        }
        
        .upload-area {
            border: 3px dashed #3498db;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9ff;
        }
        
        .upload-area:hover {
            background: #e3f2fd;
            transform: translateY(-3px);
        }
        
        .upload-icon {
            font-size: 4rem;
            color: #3498db;
            margin-bottom: 15px;
        }
        
        .btn {
            background: linear-gradient(90deg, #3498db, #2c3e50);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4);
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.6);
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        .btn-download {
            background: linear-gradient(90deg, #27ae60, #219653);
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.4);
        }
        
        .btn-download:hover {
            box-shadow: 0 6px 20px rgba(39, 174, 96, 0.6);
        }
        
        .control-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }
        
        input[type="range"], 
        input[type="number"], 
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border 0.3s;
        }
        
        input[type="range"] {
            padding: 0;
        }
        
        input[type="number"]:focus, 
        select:focus {
            border-color: #3498db;
            outline: none;
        }
        
        .dimension-controls {
            display: flex;
            gap: 15px;
        }
        
        .dimension-controls > div {
            flex: 1;
        }
        
        .preview-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
            border: 2px dashed #bdc3c7;
            border-radius: 12px;
            background: #f8f9ff;
            overflow: hidden;
            position: relative;
        }
        
        canvas {
            max-width: 100%;
            max-height: 300px;
            display: none;
        }
        
        .preview-placeholder {
            text-align: center;
            color: #7f8c8d;
            padding: 20px;
        }
        
        .preview-placeholder i {
            font-size: 4rem;
            color: #bdc3c7;
            margin-bottom: 15px;
        }
        
        .file-info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-top: 20px;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #cfd8dc;
        }
        
        .info-row:last-child {
            border-bottom: none;
        }
        
        .stats {
            display: flex;
            justify-content: space-between;
            background: #f1f8e9;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-weight: 500;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.4rem;
            font-weight: 700;
            color: #27ae60;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #7f8c8d;
        }
        
        .actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        
        .actions .btn {
            flex: 1;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.2);
            font-size: 0.9rem;
        }
        
        @media (max-width: 900px) {
            .main-content {
                flex-direction: column;
            }
            
            header {
                padding: 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>简易图片编辑工具</h1>
            <p class="subtitle">尺寸编辑 | 格式转换 | 图片压缩</p>
        </header>
        
        <div class="main-content">
            <div class="upload-section">
                <div class="panel">
                    <h2 class="panel-title">
                        <i>📁</i> 上传图片
                    </h2>
                    <div class="upload-area" id="dropArea">
                        <div class="upload-icon">📤</div>
                        <h3>拖放图片到此处或点击上传</h3>
                        <p>支持 JPG, PNG, GIF 格式</p>
                        <input type="file" id="fileInput" accept="image/*" style="display: none;">
                        <button class="btn" id="uploadBtn" style="margin-top: 20px;">
                            <i>⬆️</i> 选择图片
                        </button>
                    </div>
                </div>
                
                <div class="panel">
                    <h2 class="panel-title">
                        <i>⚙️</i> 编辑选项
                    </h2>
                    
                    <div class="control-group">
                        <label for="width">宽度 (px)</label>
                        <input type="number" id="width" min="1" max="5000" placeholder="自动">
                    </div>
                    
                    <div class="control-group">
                        <label for="height">高度 (px)</label>
                        <input type="number" id="height" min="1" max="5000" placeholder="自动">
                    </div>
                    
                    <div class="control-group">
                        <label for="format">输出格式</label>
                        <select id="format">
                            <option value="jpeg">JPEG (推荐)</option>
                            <option value="png">PNG (透明背景)</option>
                            <option value="webp">WebP (高质量)</option>
                        </select>
                    </div>
                    
                    <div class="control-group">
                        <label for="quality">图片质量: <span id="qualityValue">85</span>%</label>
                        <input type="range" id="quality" min="10" max="100" value="85">
                    </div>
                    
                    <div class="actions">
                        <button class="btn" id="resetBtn">
                            <i>🔄</i> 重置
                        </button>
                        <button class="btn btn-download" id="downloadBtn">
                            <i>💾</i> 下载图片
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="preview-section">
                <div class="panel">
                    <h2 class="panel-title">
                        <i>👁️</i> 预览效果
                    </h2>
                    
                    <div class="preview-container">
                        <div class="preview-placeholder" id="previewPlaceholder">
                            <div>🖼️</div>
                            <p>上传图片后预览效果将显示在这里</p>
                        </div>
                        <canvas id="canvas"></canvas>
                    </div>
                    
                    <div class="stats">
                        <div class="stat">
                            <div class="stat-value" id="originalSize">0 KB</div>
                            <div class="stat-label">原始大小</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value" id="compressedSize">0 KB</div>
                            <div class="stat-label">压缩后大小</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value" id="reduction">0%</div>
                            <div class="stat-label">减少</div>
                        </div>
                    </div>
                </div>
                
                <div class="panel">
                    <h2 class="panel-title">
                        <i>ℹ️</i> 图片信息
                    </h2>
                    
                    <div class="file-info">
                        <div class="info-row">
                            <span>文件名:</span>
                            <span id="fileName">-</span>
                        </div>
                        <div class="info-row">
                            <span>原始尺寸:</span>
                            <span id="originalDimensions">-</span>
                        </div>
                        <div class="info-row">
                            <span>新尺寸:</span>
                            <span id="newDimensions">-</span>
                        </div>
                        <div class="info-row">
                            <span>文件类型:</span>
                            <span id="fileType">-</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>简易图片编辑工具 &copy; 2023 | 基于HTML5 Canvas技术 | 所有处理在浏览器中完成</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // DOM元素
            const fileInput = document.getElementById('fileInput');
            const uploadBtn = document.getElementById('uploadBtn');
            const dropArea = document.getElementById('dropArea');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const previewPlaceholder = document.getElementById('previewPlaceholder');
            const widthInput = document.getElementById('width');
            const heightInput = document.getElementById('height');
            const formatSelect = document.getElementById('format');
            const qualityInput = document.getElementById('quality');
            const qualityValue = document.getElementById('qualityValue');
            const resetBtn = document.getElementById('resetBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            
            // 文件信息元素
            const fileName = document.getElementById('fileName');
            const originalDimensions = document.getElementById('originalDimensions');
            const newDimensions = document.getElementById('newDimensions');
            const fileType = document.getElementById('fileType');
            const originalSize = document.getElementById('originalSize');
            const compressedSize = document.getElementById('compressedSize');
            const reduction = document.getElementById('reduction');
            
            // 全局变量
            let originalImage = null;
            let originalWidth = 0;
            let originalHeight = 0;
            let originalFileSize = 0;
            
            // 上传按钮事件
            uploadBtn.addEventListener('click', () => fileInput.click());
            
            // 文件选择事件
            fileInput.addEventListener('change', handleFileSelect);
            
            // 拖放事件
            dropArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropArea.style.borderColor = '#27ae60';
                dropArea.style.backgroundColor = '#e8f5e9';
            });
            
            dropArea.addEventListener('dragleave', () => {
                dropArea.style.borderColor = '#3498db';
                dropArea.style.backgroundColor = '#f8f9ff';
            });
            
            dropArea.addEventListener('drop', (e) => {
                e.preventDefault();
                dropArea.style.borderColor = '#3498db';
                dropArea.style.backgroundColor = '#f8f9ff';
                
                if (e.dataTransfer.files.length) {
                    fileInput.files = e.dataTransfer.files;
                    handleFileSelect();
                }
            });
            
            // 处理文件选择
            function handleFileSelect() {
                if (!fileInput.files || !fileInput.files[0]) return;
                
                const file = fileInput.files[0];
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    originalImage = new Image();
                    originalImage.onload = function() {
                        // 保存原始尺寸
                        originalWidth = originalImage.width;
                        originalHeight = originalImage.height;
                        originalFileSize = file.size;
                        
                        // 更新UI
                        updateFileInfo(file);
                        resetControls();
                        updatePreview();
                    };
                    originalImage.src = e.target.result;
                };
                
                reader.readAsDataURL(file);
            }
            
            // 更新文件信息
            function updateFileInfo(file) {
                fileName.textContent = file.name;
                originalDimensions.textContent = `${originalWidth} × ${originalHeight} 像素`;
                fileType.textContent = file.type.split('/')[1].toUpperCase();
                originalSize.textContent = formatFileSize(originalFileSize);
            }
            
            // 重置控件
            function resetControls() {
                widthInput.value = '';
                heightInput.value = '';
                formatSelect.value = 'jpeg';
                qualityInput.value = '85';
                qualityValue.textContent = '85';
            }
            
            // 更新预览
            function updatePreview() {
                if (!originalImage) return;
                
                // 计算新尺寸
                let newWidth = parseInt(widthInput.value) || originalWidth;
                let newHeight = parseInt(heightInput.value) || originalHeight;
                
                // 如果只设置了一个维度，保持比例
                if (widthInput.value && !heightInput.value) {
                    newHeight = (newWidth / originalWidth) * originalHeight;
                } else if (!widthInput.value && heightInput.value) {
                    newWidth = (newHeight / originalHeight) * originalWidth;
                }
                
                // 设置canvas尺寸
                canvas.width = newWidth;
                canvas.height = newHeight;
                
                // 绘制图片
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(originalImage, 0, 0, newWidth, newHeight);
                
                // 显示canvas
                canvas.style.display = 'block';
                previewPlaceholder.style.display = 'none';
                
                // 更新尺寸信息
                newDimensions.textContent = `${Math.round(newWidth)} × ${Math.round(newHeight)} 像素`;
                
                // 更新文件大小信息
                updateFileSizeInfo();
            }
            
            // 更新文件大小信息
            function updateFileSizeInfo() {
                if (!originalImage) return;
                
                // 获取压缩后的数据URL
                const format = formatSelect.value;
                const quality = parseInt(qualityInput.value) / 100;
                const dataURL = canvas.toDataURL(`image/${format}`, quality);
                
                // 计算文件大小
                const compressedFileSize = Math.round((dataURL.length * 3) / 4); // 近似值
                
                // 更新UI
                compressedSize.textContent = formatFileSize(compressedFileSize);
                
                // 计算减少百分比
                const reductionPercent = Math.round(((originalFileSize - compressedFileSize) / originalFileSize) * 100);
                reduction.textContent = `${reductionPercent > 0 ? reductionPercent : 0}%`;
            }
            
            // 格式化文件大小
            function formatFileSize(bytes) {
                if (bytes < 1024) return bytes + ' B';
                else if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
                else return (bytes / 1048576).toFixed(1) + ' MB';
            }
            
            // 事件监听器
            widthInput.addEventListener('input', updatePreview);
            heightInput.addEventListener('input', updatePreview);
            formatSelect.addEventListener('change', updateFileSizeInfo);
            qualityInput.addEventListener('input', function() {
                qualityValue.textContent = this.value;
                updateFileSizeInfo();
            });
            
            // 重置按钮
            resetBtn.addEventListener('click', function() {
                if (originalImage) {
                    resetControls();
                    updatePreview();
                }
            });
            
            // 下载按钮
            downloadBtn.addEventListener('click', function() {
                if (!originalImage) {
                    alert('请先上传图片');
                    return;
                }
                
                const format = formatSelect.value;
                const quality = parseInt(qualityInput.value) / 100;
                const dataURL = canvas.toDataURL(`image/${format}`, quality);
                
                const link = document.createElement('a');
                link.download = `edited-image.${format}`;
                link.href = dataURL;
                link.click();
            });
        });
    </script>
</body>
</html>
