<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日待办清单</title>
  <!-- 引入外部资源 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  
  <!-- 配置Tailwind自定义颜色（七彩纯色） -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#4F46E5',
            red: '#EF4444',
            orange: '#F97316',
            yellow: '#EAB308',
            green: '#22C55E',
            blue: '#3B82F6',
            indigo: '#6366F1',
            purple: '#A855F7'
          }
        }
      }
    }
  </script>
  
  <!-- 自定义工具类 -->
  <style type="text/tailwindcss">
    @layer utilities {
      .card-shadow {
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      .btn-hover {
        @apply transition-all duration-300 hover:scale-105 hover:shadow-lg;
      }
      .todo-card {
        @apply bg-white rounded-xl p-4 card-shadow flex-1 min-w-[280px] max-w-[300px] transition-all duration-300 hover:shadow-xl;
      }
      .check-item {
        @apply flex items-center mb-2 p-2 rounded-lg hover:bg-gray-100 transition-colors duration-200;
      }
      .check-input {
        @apply w-5 h-5 mr-3 accent-primary cursor-pointer;
      }
      .check-label {
        @apply flex-1 cursor-pointer transition-colors duration-200;
      }
      .check-label-checked {
        @apply line-through text-gray-500;
      }
      .edit-input {
        @apply flex-1 p-1 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-primary/50;
      }
      .title-edit-input {
        @apply text-lg font-bold p-1 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-primary/50;
      }
      .notification {
        @apply fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-lg shadow-lg opacity-0 transition-opacity duration-300 z-50;
      }
      .notification.show {
        @apply opacity-100;
      }
    }
  </style>
</head>
<body class="bg-primary min-h-screen transition-colors duration-500">
  <!-- 通知提示 -->
  <div id="notification" class="notification">导出成功！</div>
  
  <div class="container mx-auto px-4 py-6 max-w-7xl">
    <!-- 页面标题和日期 -->
    <header class="text-center mb-8">
      <h1 class="text-[clamp(1.8rem,5vw,2.5rem)] font-bold text-white mb-2">每日待办清单</h1>
      <p id="currentDate" class="text-[clamp(1rem,3vw,1.2rem)] text-white/90 font-medium"></p>
    </header>
    
    <!-- 颜色选择器 -->
    <div class="mb-6">
      <h3 class="text-center text-white mb-3">选择背景颜色</h3>
      <div class="flex justify-center gap-3 flex-wrap">
        <button class="w-8 h-8 rounded-full bg-red color-btn active" data-color="bg-red"></button>
        <button class="w-8 h-8 rounded-full bg-orange color-btn" data-color="bg-orange"></button>
        <button class="w-8 h-8 rounded-full bg-yellow color-btn" data-color="bg-yellow"></button>
        <button class="w-8 h-8 rounded-full bg-green color-btn" data-color="bg-green"></button>
        <button class="w-8 h-8 rounded-full bg-blue color-btn" data-color="bg-blue"></button>
        <button class="w-8 h-8 rounded-full bg-indigo color-btn" data-color="bg-indigo"></button>
        <button class="w-8 h-8 rounded-full bg-purple color-btn" data-color="bg-purple"></button>
      </div>
    </div>
    
    <!-- 主要内容区 - 六个清单 -->
    <main class="mb-8">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- 冥想（专注力） -->
        <div class="todo-card">
          <h2 class="text-lg font-bold mb-4 flex items-center text-primary">
            <i class="fa fa-balance-scale mr-2"></i><span class="title-text">冥想（专注力）</span>
          </h2>
          <div class="todo-items">
            <div class="check-item">
              <input type="checkbox" class="check-input" id="meditation1">
              <label for="meditation1" class="check-label">早晨冥想10分钟</label>
            </div>
            <div class="check-item">
              <input type="checkbox" class="check-input" id="meditation2">
              <label for="meditation2" class="check-label">深呼吸练习</label>
            </div>
            <div class="check-item">
              <input type="checkbox" class="check-input" id="meditation3">
              <label for="meditation3" class="check-label">专注当下一刻</label>
            </div>
          </div>
        </div>
        
        <!-- 肯定（欣赏力） -->
        <div class="todo-card">
          <h2 class="text-lg font-bold mb-4 flex items-center text-primary">
            <i class="fa fa-thumbs-up mr-2"></i><span class="title-text">肯定（欣赏力）</span>
          </h2>
          <div class="todo-items">
            <div class="check-item">
              <input type="checkbox" class="check-input" id="affirmation1">
              <label for="affirmation1" class="check-label">肯定自己的一个优点</label>
            </div>
            <div class="check-item">
              <input type="checkbox" class="check-input" id="affirmation2">
              <label for="affirmation2" class="check-label">赞美身边的一个人</label>
            </div>
            <div class="check-item">
              <input type="checkbox" class="check-input" id="affirmation3">
              <label for="affirmation3" class="check-label">感恩今天的一件事</label>
            </div>
          </div>
        </div>
        
        <!-- 视觉（想象力） -->
        <div class="todo-card">
          <h2 class="text-lg font-bold mb-4 flex items-center text-primary">
            <i class="fa fa-eye mr-2"></i><span class="title-text">视觉（想象力）</span>
          </h2>
          <div class="todo-items">
            <div class="check-item">
              <input type="checkbox" class="check-input" id="visualization1">
              <label for="visualization1" class="check-label">想象理想的一天</label>
            </div>
            <div class="check-item">
              <input type="checkbox" class="check-input" id="visualization2">
              <label for="visualization2" class="check-label">关注一个美丽的细节</label>
            </div>
            <div class="check-item">
              <input type="checkbox" class="check-input" id="visualization3">
              <label for="visualization3" class="check-label">绘制简单的思维导图</label>
            </div>
          </div>
        </div>
        
        <!-- 锻炼（持续力） -->
        <div class="todo-card">
          <h2 class="text-lg font-bold mb-4 flex items-center text-primary">
            <i class="fa fa-heartbeat mr-2"></i><span class="title-text">锻炼（持续力）</span>
          </h2>
          <div class="todo-items">
            <div class="check-item">
              <input type="checkbox" class="check-input" id="exercise1">
              <label for="exercise1" class="check-label">30分钟有氧运动</label>
            </div>
            <div class="check-item">
              <input type="checkbox" class="check-input" id="exercise2">
              <label for="exercise2" class="check-label">拉伸放松肌肉</label>
            </div>
            <div class="check-item">
              <input type="checkbox" class="check-input" id="exercise3">
              <label for="exercise3" class="check-label">多喝水，保持活力</label>
            </div>
          </div>
        </div>
        
        <!-- 写作（生产力） -->
        <div class="todo-card">
          <h2 class="text-lg font-bold mb-4 flex items-center text-primary">
            <i class="fa fa-pencil mr-2"></i><span class="title-text">写作（生产力）</span>
          </h2>
          <div class="todo-items">
            <div class="check-item">
              <input type="checkbox" class="check-input" id="writing1">
              <label for="writing1" class="check-label">写一篇日记</label>
            </div>
            <div class="check-item">
              <input type="checkbox" class="check-input" id="writing2">
              <label for="writing2" class="check-label">记录三个创意想法</label>
            </div>
            <div class="check-item">
              <input type="checkbox" class="check-input" id="writing3">
              <label for="writing3" class="check-label">整理待办事项清单</label>
            </div>
          </div>
        </div>
        
        <!-- 阅读（宁静时刻） -->
        <div class="todo-card">
          <h2 class="text-lg font-bold mb-4 flex items-center text-primary">
            <i class="fa fa-book mr-2"></i><span class="title-text">阅读（宁静时刻）</span>
          </h2>
          <div class="todo-items">
            <div class="check-item">
              <input type="checkbox" class="check-input" id="reading1">
              <label for="reading1" class="check-label">阅读20分钟书籍</label>
            </div>
            <div class="check-item">
              <input type="checkbox" class="check-input" id="reading2">
              <label for="reading2" class="check-label">学习一个新知识</label>
            </div>
            <div class="check-item">
              <input type="checkbox" class="check-input" id="reading3">
              <label for="reading3" class="check-label">记录一句名言警句</label>
            </div>
          </div>
        </div>
      </div>
    </main>
    
    <!-- 导出按钮 -->
    <div class="flex justify-center mb-10">
      <button id="exportBtn" class="bg-white text-primary px-6 py-3 rounded-lg font-medium btn-hover flex items-center">
        <i class="fa fa-download mr-2"></i> 导出清单
      </button>
    </div>
    
    <!-- 页脚备注信息 -->
    <footer class="text-center text-white/80 text-sm mt-auto">
      <p class="mb-1">本工具由 @邓文涛 制作</p>
      <p class="mb-1">微信：707547441</p>
      <p>QQ邮箱：<a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="023532353736353636334273732c616d6f">[email&#160;protected]</a></p>
    </footer>
  </div>
  
  <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
    // 获取DOM元素
    const bodyElement = document.body;
    const currentDateElement = document.getElementById('currentDate');
    const exportBtn = document.getElementById('exportBtn');
    const colorButtons = document.querySelectorAll('.color-btn');
    const checkInputs = document.querySelectorAll('.check-input');
    const checkLabels = document.querySelectorAll('.check-label');
    const titleTexts = document.querySelectorAll('.title-text');
    const notification = document.getElementById('notification');
    
    // 设置当前日期
    function setCurrentDate() {
      const now = new Date();
      const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
      currentDateElement.textContent = now.toLocaleDateString('zh-CN', options);
    }
    
    // 更改背景颜色
    function changeBackgroundColor(colorClass) {
      // 移除所有颜色类
      const colors = ['bg-red', 'bg-orange', 'bg-yellow', 'bg-green', 'bg-blue', 'bg-indigo', 'bg-purple'];
      colors.forEach(color => {
        bodyElement.classList.remove(color);
      });
      
      // 添加选中的颜色类
      bodyElement.classList.add(colorClass);
      
      // 更新标题和卡片标题颜色
      const primaryColor = colorClass.replace('bg-', 'text-');
      document.querySelectorAll('.todo-card h2').forEach(title => {
        // 移除所有颜色类，然后添加新的
        title.classList.remove('text-primary', 'text-red', 'text-orange', 'text-yellow', 
                               'text-green', 'text-blue', 'text-indigo', 'text-purple');
        title.classList.add(primaryColor);
        // 更新导出按钮颜色
        exportBtn.classList.remove('text-primary', 'text-red', 'text-orange', 'text-yellow', 
                                 'text-green', 'text-blue', 'text-indigo', 'text-purple');
        exportBtn.classList.add(primaryColor);
      });
      
      // 更新按钮选中状态
      colorButtons.forEach(btn => {
        btn.classList.remove('ring-4', 'ring-white', 'scale-110');
      });
      const selectedBtn = document.querySelector(`.color-btn[data-color="${colorClass}"]`);
      if (selectedBtn) {
        selectedBtn.classList.add('ring-4', 'ring-white', 'scale-110');
      }
    }
    
    // 处理复选框状态变化
    function handleCheckboxChange() {
      checkInputs.forEach(checkbox => {
        const label = document.querySelector(`label[for="${checkbox.id}"]`);
        if (label) { // 确保标签存在
          if (checkbox.checked) {
            label.classList.add('check-label-checked');
          } else {
            label.classList.remove('check-label-checked');
          }
        }
      });
    }
    
    // 显示通知
    function showNotification(message) {
      notification.textContent = message;
      notification.classList.add('show');
      
      setTimeout(() => {
        notification.classList.remove('show');
      }, 3000);
    }
    
    // 实现清单项目编辑功能
    function setupItemEditFunctionality() {
      checkLabels.forEach(label => {
        label.addEventListener('dblclick', function() {
          // 获取当前文本内容
          const currentText = this.textContent.trim();
          const forAttr = this.getAttribute('for');
          
          if (!forAttr) return; // 确保有for属性
          
          // 创建输入框
          const input = document.createElement('input');
          input.type = 'text';
          input.value = currentText;
          input.className = 'edit-input';
          
          // 保存当前元素的引用
          const originalElement = this;
          const parentElement = this.parentNode;
          
          // 替换标签为输入框
          parentElement.replaceChild(input, this);
          
          // 聚焦输入框并选中内容
          input.focus();
          input.select();
          
          // 按Enter键保存
          input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
              e.preventDefault(); // 防止表单提交行为
              saveItemEdit(input, originalElement, forAttr);
            }
          });
          
          // 点击其他地方保存
          input.addEventListener('blur', function() {
            saveItemEdit(input, originalElement, forAttr);
          });
        });
      });
    }
    
    // 保存清单项目编辑内容
    function saveItemEdit(input, originalElement, forAttr) {
      // 获取输入框的值
      const newText = input.value.trim() || originalElement.textContent.trim();
      
      // 创建新的标签元素
      const newLabel = document.createElement('label');
      newLabel.setAttribute('for', forAttr);
      newLabel.className = originalElement.className;
      newLabel.textContent = newText;
      
      // 恢复勾选状态
      const checkbox = document.getElementById(forAttr);
      if (checkbox && checkbox.checked) {
        newLabel.classList.add('check-label-checked');
      }
      
      // 替换输入框为标签
      input.parentNode.replaceChild(newLabel, input);
      
      // 重新绑定双击事件
      setupItemEditFunctionality();
    }
    
    // 实现清单标题编辑功能
    function setupTitleEditFunctionality() {
      titleTexts.forEach(title => {
        title.addEventListener('dblclick', function() {
          // 获取当前标题文本
          const currentText = this.textContent.trim();
          
          // 创建输入框
          const input = document.createElement('input');
          input.type = 'text';
          input.value = currentText;
          input.className = 'title-edit-input';
          // 继承标题的颜色
          input.style.color = window.getComputedStyle(this).color;
          
          // 保存当前元素的引用
          const originalElement = this;
          const parentElement = this.parentNode;
          
          // 替换标题文本为输入框
          parentElement.replaceChild(input, this);
          
          // 聚焦输入框并选中内容
          input.focus();
          input.select();
          
          // 按Enter键保存
          input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
              e.preventDefault();
              saveTitleEdit(input, originalElement);
            }
          });
          
          // 点击其他地方保存
          input.addEventListener('blur', function() {
            saveTitleEdit(input, originalElement);
          });
        });
      });
    }
    
    // 保存清单标题编辑内容
    function saveTitleEdit(input, originalElement) {
      // 获取输入框的值
      const newText = input.value.trim() || originalElement.textContent.trim();
      
      // 创建新的标题文本元素
      const newTitle = document.createElement('span');
      newTitle.className = originalElement.className;
      newTitle.textContent = newText;
      
      // 替换输入框为标题文本
      input.parentNode.replaceChild(newTitle, input);
      
      // 更新titleTexts集合并重新绑定事件
      titleTexts = document.querySelectorAll('.title-text');
      setupTitleEditFunctionality();
    }
    
    // 导出清单为图片
    function exportListAsImage() {
      // 显示加载状态
      exportBtn.disabled = true;
      exportBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i> 正在导出...';
      
      // 获取整个页面内容
      const element = document.documentElement;
      
      // 保存当前滚动位置
      const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
      const scrollLeft = window.pageXOffset || document.documentElement.scrollLeft;
      
      // 滚动到顶部以确保完整截图
      window.scrollTo(0, 0);
      
      // 优化的html2canvas配置
      html2canvas(element, {
        scale: 2, // 提高分辨率
        useCORS: true,
        logging: false,
        allowTaint: false,
        letterRendering: true,
        scrollX: 0,
        scrollY: 0,
        windowWidth: document.documentElement.offsetWidth,
        windowHeight: document.documentElement.offsetHeight
      }).then(canvas => {
        try {
          // 创建下载链接
          const link = document.createElement('a');
          const dateStr = new Date().toLocaleDateString().replace(/\//g, '-');
          link.download = `每日待办清单-${dateStr}.png`;
          
          // 处理不同浏览器的兼容性
          if (navigator.msSaveBlob) {
            // IE/Edge 兼容
            canvas.toBlob(blob => {
              if (blob) {
                navigator.msSaveBlob(blob, link.download);
                showNotification('导出成功！');
              } else {
                showNotification('导出失败，请重试');
              }
            });
          } else {
            // 标准浏览器
            link.href = canvas.toDataURL('image/png');
            link.click();
            showNotification('导出成功！');
          }
        } catch (error) {
          console.error('导出失败:', error);
          showNotification('导出失败，请重试');
        } finally {
          // 恢复滚动位置
          window.scrollTo(scrollLeft, scrollTop);
          
          // 恢复按钮状态
          exportBtn.disabled = false;
          exportBtn.innerHTML = '<i class="fa fa-download mr-2"></i> 导出清单';
        }
      }).catch(error => {
        console.error('导出失败:', error);
        showNotification('导出失败，请重试');
        
        // 恢复滚动位置
        window.scrollTo(scrollLeft, scrollTop);
        
        // 恢复按钮状态
        exportBtn.disabled = false;
        exportBtn.innerHTML = '<i class="fa fa-download mr-2"></i> 导出清单';
      });
    }
    
    // 初始化页面
    function init() {
      setCurrentDate();
      
      // 设置默认选中的颜色按钮样式
      colorButtons[0].classList.add('ring-4', 'ring-white', 'scale-110');
      
      // 初始化复选框状态
      handleCheckboxChange();
      
      // 设置编辑功能
      setupItemEditFunctionality();
      setupTitleEditFunctionality();
    }
    
    // 事件监听
    exportBtn.addEventListener('click', exportListAsImage);
    
    // 颜色按钮点击事件
    colorButtons.forEach(button => {
      button.addEventListener('click', () => {
        const colorClass = button.getAttribute('data-color');
        changeBackgroundColor(colorClass);
      });
    });
    
    // 复选框变化事件
    checkInputs.forEach(checkbox => {
      checkbox.addEventListener('change', handleCheckboxChange);
    });
    
    // 页面加载完成后初始化
    window.addEventListener('DOMContentLoaded', init);
  </script>
