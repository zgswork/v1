<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>经典打地鼠游戏</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            font-family: 'Arial Rounded MT Bold', 'Arial', sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            color: white;
        }
        
        .header {
            text-align: center;
            margin: 20px 0;
            width: 100%;
            max-width: 600px;
        }
        
        h1 {
            font-size: 3.5rem;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
            letter-spacing: 2px;
            background: linear-gradient(to right, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            padding: 15px 25px;
            margin: 15px 0;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }
        
        .info-box {
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 10px 20px;
            min-width: 120px;
        }
        
        .info-title {
            font-size: 1.1rem;
            margin-bottom: 5px;
            color: #ffd700;
        }
        
        .info-value {
            font-size: 2.2rem;
            font-weight: bold;
            color: white;
        }
        
        #time {
            color: #ff6b6b;
        }
        
        .game-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 1/1;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="%235d4037" stroke="%233e2723" stroke-width="3"/></svg>');
            background-size: 33.33% 33.33%;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4);
            margin: 10px 0 30px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 5%;
            padding: 5%;
        }
        
        .hole {
            position: relative;
            background: #5d4037;
            border-radius: 50%;
            cursor: pointer;
            overflow: hidden;
            box-shadow: inset 0 8px 0px #3e2723, 
                        0 8px 10px rgba(0, 0, 0, 0.5);
            transition: transform 0.1s;
        }
        
        .hole:active {
            transform: scale(0.95);
        }
        
        .mole {
            position: absolute;
            width: 80%;
            height: 80%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%238d6e63"/><circle cx="35" cy="40" r="5" fill="black"/><circle cx="65" cy="40" r="5" fill="black"/><path d="M40,65 Q50,75 60,65" stroke="black" stroke-width="3" fill="none"/><ellipse cx="50" cy="30" rx="15" ry="10" fill="%238d6e63"/></svg>') center/contain no-repeat;
            bottom: -100%;
            left: 10%;
            transition: bottom 0.3s ease;
        }
        
        .hole.up .mole {
            bottom: 15%;
        }
        
        .controls {
            display: flex;
            gap: 20px;
            margin: 10px 0 30px;
            width: 100%;
            max-width: 600px;
            justify-content: center;
        }
        
        .btn {
            background: linear-gradient(to bottom, #ffd700, #ff9800);
            border: none;
            border-radius: 50px;
            color: #5d4037;
            padding: 15px 30px;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 0 #e65100, 0 8px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.2s;
            min-width: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #e65100, 0 3px 8px rgba(0, 0, 0, 0.3);
        }
        
        .btn:disabled {
            opacity: 0.6;
            transform: translateY(6px);
            box-shadow: 0 0 0 #e65100;
            cursor: not-allowed;
        }
        
        .instructions {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .instructions h2 {
            color: #ffd700;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .instructions ul {
            padding-left: 20px;
            line-height: 1.6;
        }
        
        .instructions li {
            margin-bottom: 10px;
        }
        
        .hit-animation {
            position: absolute;
            font-size: 3rem;
            color: #ffd700;
            pointer-events: none;
            animation: floatUp 1s forwards;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
        }
        
        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100px); opacity: 0; }
        }
        
        @media (max-width: 650px) {
            h1 {
                font-size: 2.5rem;
            }
            
            .game-info {
                padding: 10px 15px;
            }
            
            .info-box {
                padding: 8px 15px;
                min-width: 100px;
            }
            
            .info-title {
                font-size: 0.9rem;
            }
            
            .info-value {
                font-size: 1.8rem;
            }
            
            .btn {
                padding: 12px 20px;
                font-size: 1.2rem;
                min-width: 140px;
            }
            
            .instructions {
                font-size: 0.9rem;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }
            
            .game-info {
                flex-direction: column;
                gap: 10px;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 300px;
            }
        }
        
        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        
        .game-over.show {
            opacity: 1;
            pointer-events: all;
        }
        
        .game-over h2 {
            font-size: 4rem;
            color: #ffd700;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
        }
        
        .final-score {
            font-size: 3rem;
            color: white;
            margin-bottom: 30px;
        }
        
        .difficulty {
            display: flex;
            gap: 15px;
            margin: 15px 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .diff-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            color: white;
            padding: 8px 20px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .diff-btn.active {
            background: linear-gradient(to right, #ffd700, #ff9800);
            color: #5d4037;
            font-weight: bold;
            border-color: #ff9800;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fas fa-paw"></i> 经典打地鼠 <i class="fas fa-paw"></i></h1>
        <p>点击冒出来的地鼠，在时间结束前获得尽可能多的分数！</p>
    </div>
    
    <div class="game-info">
        <div class="info-box">
            <div class="info-title">分数</div>
            <div id="score" class="info-value">0</div>
        </div>
        <div class="info-box">
            <div class="info-title">剩余时间</div>
            <div id="time" class="info-value">60</div>
        </div>
        <div class="info-box">
            <div class="info-title">最高分</div>
            <div id="high-score" class="info-value">0</div>
        </div>
    </div>
    
    <div class="difficulty">
        <div class="diff-btn active" data-level="easy">简单</div>
        <div class="diff-btn" data-level="medium">中等</div>
        <div class="diff-btn" data-level="hard">困难</div>
    </div>
    
    <div class="game-container">
        <!-- 地鼠洞将通过JS动态生成 -->
        
        <div class="game-over">
            <h2>游戏结束!</h2>
            <div class="final-score">得分: <span id="final-score">0</span></div>
            <button class="btn" id="restart-btn">
                <i class="fas fa-redo"></i> 再玩一次
            </button>
        </div>
    </div>
    
    <div class="controls">
        <button class="btn" id="start-btn">
            <i class="fas fa-play"></i> 开始游戏
        </button>
        <button class="btn" id="pause-btn" disabled>
            <i class="fas fa-pause"></i> 暂停
        </button>
    </div>
    
    <div class="instructions">
        <h2><i class="fas fa-info-circle"></i> 游戏说明</h2>
        <ul>
            <li><strong>游戏目标：</strong>在60秒内点击尽可能多的地鼠</li>
            <li><strong>操作方式：</strong>点击冒出来的地鼠获得分数</li>
            <li><strong>难度等级：</strong>简单 - 中等 - 困难（地鼠出现速度不同）</li>
            <li><strong>计分规则：</strong>每打中一只地鼠得10分，连续击中会有额外奖励分</li>
            <li><strong>提示：</strong>连续击中地鼠可获得连击奖励分！</li>
        </ul>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 游戏元素
            const gameContainer = document.querySelector('.game-container');
            const scoreDisplay = document.getElementById('score');
            const timeDisplay = document.getElementById('time');
            const highScoreDisplay = document.getElementById('high-score');
            const startButton = document.getElementById('start-btn');
            const pauseButton = document.getElementById('pause-btn');
            const restartButton = document.getElementById('restart-btn');
            const gameOverScreen = document.querySelector('.game-over');
            const finalScoreDisplay = document.getElementById('final-score');
            const diffButtons = document.querySelectorAll('.diff-btn');
            
            // 游戏变量
            let score = 0;
            let timeLeft = 60;
            let highScore = localStorage.getItem('whackHighScore') || 0;
            let gameActive = false;
            let gameTimer;
            let moleTimer;
            let difficulty = 'medium';
            let consecutiveHits = 0;
            let lastHitTime = 0;
            
            // 设置最高分显示
            highScoreDisplay.textContent = highScore;
            
            // 创建地鼠洞
            for (let i = 0; i < 9; i++) {
                const hole = document.createElement('div');
                hole.className = 'hole';
                hole.innerHTML = '<div class="mole"></div>';
                gameContainer.appendChild(hole);
            }
            
            const holes = document.querySelectorAll('.hole');
            
            // 难度设置
            diffButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    diffButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    difficulty = btn.dataset.level;
                    
                    // 如果游戏正在进行中，重新开始游戏
                    if (gameActive) {
                        resetGame();
                        startGame();
                    }
                });
            });
            
            // 开始游戏按钮
            startButton.addEventListener('click', () => {
                if (!gameActive) {
                    startGame();
                }
            });
            
            // 暂停游戏按钮
            pauseButton.addEventListener('click', () => {
                if (gameActive) {
                    pauseGame();
                    pauseButton.innerHTML = '<i class="fas fa-play"></i> 继续';
                    pauseButton.disabled = false;
                } else {
                    resumeGame();
                    pauseButton.innerHTML = '<i class="fas fa-pause"></i> 暂停';
                }
            });
            
            // 重新开始游戏按钮
            restartButton.addEventListener('click', () => {
                resetGame();
                startGame();
            });
            
            // 开始游戏函数
            function startGame() {
                gameActive = true;
                score = 0;
                consecutiveHits = 0;
                timeLeft = 60;
                updateScore();
                timeDisplay.textContent = timeLeft;
                
                startButton.disabled = true;
                pauseButton.disabled = false;
                gameOverScreen.classList.remove('show');
                
                // 开始游戏计时器
                gameTimer = setInterval(() => {
                    timeLeft--;
                    timeDisplay.textContent = timeLeft;
                    
                    if (timeLeft <= 0) {
                        endGame();
                    }
                }, 1000);
                
                // 开始地鼠出现
                popUpMole();
            }
            
            // 暂停游戏
            function pauseGame() {
                gameActive = false;
                clearInterval(moleTimer);
                clearTimeout(moleTimer);
            }
            
            // 继续游戏
            function resumeGame() {
                gameActive = true;
                popUpMole();
            }
            
            // 重置游戏
            function resetGame() {
                gameActive = false;
                clearInterval(gameTimer);
                clearTimeout(moleTimer);
                
                // 移除所有活动的地鼠
                holes.forEach(hole => hole.classList.remove('up'));
                
                startButton.disabled = false;
                pauseButton.disabled = true;
                pauseButton.innerHTML = '<i class="fas fa-pause"></i> 暂停';
            }
            
            // 结束游戏
            function endGame() {
                gameActive = false;
                clearInterval(gameTimer);
                clearTimeout(moleTimer);
                
                // 更新最高分
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('whackHighScore', highScore);
                    highScoreDisplay.textContent = highScore;
                }
                
                // 显示游戏结束界面
                finalScoreDisplay.textContent = score;
                gameOverScreen.classList.add('show');
                
                // 移除所有活动的地鼠
                holes.forEach(hole => hole.classList.remove('up'));
                
                startButton.disabled = false;
                pauseButton.disabled = true;
            }
            
            // 地鼠出现函数
            function popUpMole() {
                if (!gameActive) return;
                
                // 随机选择一个洞
                const hole = holes[Math.floor(Math.random() * holes.length)];
                
                // 显示地鼠
                hole.classList.add('up');
                
                // 设置地鼠消失的时间（根据难度）
                let hideTime;
                switch(difficulty) {
                    case 'easy':
                        hideTime = 1500;
                        break;
                    case 'hard':
                        hideTime = 700;
                        break;
                    default: // medium
                        hideTime = 1000;
                }
                
                // 设置地鼠消失
                setTimeout(() => {
                    hole.classList.remove('up');
                    
                    // 继续出现下一个地鼠
                    if (gameActive) {
                        let nextTime;
                        switch(difficulty) {
                            case 'easy':
                                nextTime = 1000;
                                break;
                            case 'hard':
                                nextTime = 400;
                                break;
                            default: // medium
                                nextTime = 600;
                        }
                        moleTimer = setTimeout(popUpMole, nextTime);
                    }
                }, hideTime);
                
                // 添加点击事件
                hole.addEventListener('click', whackMole);
            }
            
            // 打地鼠函数
            function whackMole(e) {
                if (!this.classList.contains('up') || !gameActive) return;
                
                // 增加分数
                score += 10;
                
                // 计算连击
                const now = Date.now();
                if (now - lastHitTime < 1000) {
                    consecutiveHits++;
                    // 连击奖励
                    if (consecutiveHits > 1) {
                        const bonus = consecutiveHits * 5;
                        score += bonus;
                        
                        // 显示连击效果
                        const hitEffect = document.createElement('div');
                        hitEffect.className = 'hit-animation';
                        hitEffect.textContent = `连击x${consecutiveHits}! +${bonus}`;
                        hitEffect.style.left = `${e.clientX - 100}px`;
                        hitEffect.style.top = `${e.clientY - 50}px`;
                        document.body.appendChild(hitEffect);
                        
                        setTimeout(() => {
                            document.body.removeChild(hitEffect);
                        }, 1000);
                    }
                } else {
                    consecutiveHits = 1;
                }
                lastHitTime = now;
                
                // 更新分数显示
                updateScore();
                
                // 隐藏地鼠并移除点击事件
                this.classList.remove('up');
                this.removeEventListener('click', whackMole);
                
                // 播放音效
                playWhackSound();
            }
            
            // 播放音效
            function playWhackSound() {
                const context = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = context.createOscillator();
                const gainNode = context.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(context.destination);
                
                oscillator.type = 'sine';
                oscillator.frequency.value = 300 + (consecutiveHits * 50);
                gainNode.gain.value = 0.1;
                
                oscillator.start();
                setTimeout(() => {
                    oscillator.stop();
                }, 100);
            }
            
            // 更新分数显示
            function updateScore() {
                scoreDisplay.textContent = score;
            }
            
            // 触摸设备支持
            gameContainer.addEventListener('touchstart', function(e) {
                e.preventDefault();
            }, { passive: false });
        });
    </script>
</body>
</html>
