<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>谐音梗生成器 - 轻松创造语言乐趣</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6a5acd;
            --primary-light: #9389e3;
            --secondary: #ff7f50;
            --success: #4CAF50;
            --text: #333;
            --light: #f9f9ff;
            --border: #e0e0e0;
            --shadow: rgba(0, 0, 0, 0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e7f1 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: var(--text);
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px var(--shadow);
            overflow: hidden;
            margin-top: 40px;
        }
        
        header {
            background: linear-gradient(90deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            text-align: center;
            padding: 30px 20px;
            position: relative;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .logo {
            position: absolute;
            top: 20px;
            left: 30px;
            font-size: 2rem;
            background: white;
            color: var(--primary);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        
        .input-section {
            padding: 40px 30px 20px;
            text-align: center;
            background: var(--light);
            border-bottom: 1px solid var(--border);
        }
        
        .input-group {
            max-width: 500px;
            margin: 0 auto;
            position: relative;
        }
        
        input {
            width: 100%;
            padding: 18px 25px;
            font-size: 1.2rem;
            border: 2px solid var(--border);
            border-radius: 50px;
            outline: none;
            transition: all 0.3s;
            box-shadow: 0 4px 10px var(--shadow);
        }
        
        input:focus {
            border-color: var(--primary-light);
            box-shadow: 0 4px 15px rgba(106, 90, 205, 0.2);
        }
        
        input::placeholder {
            color: #aaa;
        }
        
        .hint {
            margin-top: 10px;
            color: #777;
            font-size: 0.9rem;
        }
        
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 25px;
            box-shadow: 0 4px 15px rgba(106, 90, 205, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn:hover {
            background: var(--primary-light);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(106, 90, 205, 0.4);
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        .btn.secondary {
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 12px 25px;
            margin-top: 0;
        }
        
        .result-section {
            padding: 30px;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
        }
        
        .loader {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(106, 90, 205, 0.2);
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .result-content {
            display: none;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .original-word {
            font-size: 1.8rem;
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .pun-word {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--secondary);
            margin: 15px 0;
            position: relative;
            display: inline-block;
        }
        
        .pun-word::after {
            content: "";
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 3px;
        }
        
        .explanation {
            font-size: 1.2rem;
            line-height: 1.6;
            background: var(--light);
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            text-align: left;
        }
        
        .actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 25px 0 15px;
        }
        
        .feedback {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        
        .feedback-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            opacity: 0.6;
            transition: all 0.2s;
            padding: 10px;
            border-radius: 50%;
        }
        
        .feedback-btn:hover {
            opacity: 1;
            background: rgba(0,0,0,0.05);
        }
        
        .like:hover {
            color: var(--success);
        }
        
        .dislike:hover {
            color: #f44336;
        }
        
        .examples {
            padding: 30px;
            background: var(--light);
            border-top: 1px solid var(--border);
        }
        
        .examples h2 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--primary);
        }
        
        .examples-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        
        .example-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 10px var(--shadow);
            transition: transform 0.3s;
            cursor: pointer;
        }
        
        .example-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 15px var(--shadow);
        }
        
        .example-word {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 5px;
        }
        
        .example-pun {
            color: var(--secondary);
            font-weight: 500;
        }
        
        footer {
            text-align: center;
            padding: 30px;
            color: #777;
            font-size: 0.9rem;
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            
            .logo {
                position: static;
                margin: 0 auto 15px;
            }
            
            header {
                padding: 20px 15px;
            }
            
            .input-section, .result-section, .examples {
                padding: 25px 15px;
            }
            
            .actions {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-puzzle-piece"></i>
            </div>
            <h1>谐音梗生成器</h1>
            <p class="subtitle">输入词语，一键生成有趣谐音梗，为你的生活增添语言乐趣</p>
        </header>
        
        <section class="input-section">
            <div class="input-group">
                <input type="text" id="word-input" placeholder="输入一个词语（2-5个字）" maxlength="10">
                <p class="hint">例如：手机、开会、韭菜、程序员...</p>
            </div>
            <button class="btn" id="generate-btn">
                <i class="fas fa-bolt"></i> 生成谐音梗
            </button>
        </section>
        
        <section class="result-section">
            <div class="loader" id="loader">
                <div class="spinner"></div>
                <p>正在绞尽脑汁创作中...</p>
            </div>
            
            <div class="result-content" id="result-content">
                <div class="original-word" id="original-word">韭菜</div>
                <div class="pun-word" id="pun-word">久菜</div>
                <div class="explanation" id="explanation">
                    老板说我是公司的"久菜"，意思是我能在公司待很久？还是割完一茬又一茬？
                </div>
                
                <div class="actions">
                    <button class="btn secondary" id="try-again-btn">
                        <i class="fas fa-sync-alt"></i> 再试一次
                    </button>
                    <button class="btn secondary" id="copy-btn">
                        <i class="fas fa-copy"></i> 复制结果
                    </button>
                    <button class="btn secondary" id="share-btn">
                        <i class="fas fa-share-alt"></i> 分享
                    </button>
                </div>
                
                <div class="feedback">
                    <button class="feedback-btn like" title="喜欢这个谐音梗">
                        <i class="fas fa-thumbs-up"></i>
                    </button>
                    <button class="feedback-btn dislike" title="不喜欢这个谐音梗">
                        <i class="fas fa-thumbs-down"></i>
                    </button>
                </div>
            </div>
        </section>
        
        <section class="examples">
            <h2>热门示例</h2>
            <div class="examples-grid">
                <div class="example-card" data-word="韭菜">
                    <div class="example-word">韭菜</div>
                    <div class="example-pun">久菜 → 割完一茬又一茬</div>
                </div>
                <div class="example-card" data-word="程序员">
                    <div class="example-word">程序员</div>
                    <div class="example-pun">成猿 → 加班加到进化了</div>
                </div>
                <div class="example-card" data-word="开会">
                    <div class="example-word">开会</div>
                    <div class="example-pun">开烩 → 各种人各种事一锅炖</div>
                </div>
                <div class="example-card" data-word="手机">
                    <div class="example-word">手机</div>
                    <div class="example-pun">手鸡 → 会下金蛋的鸡</div>
                </div>
            </div>
        </section>
        
        <footer>
            <p>© 2023 谐音梗生成器 MVP版本 | 让语言更有趣</p>
        </footer>
    </div>

    <script>
        // 模拟数据 - 实际应用中应由后端API提供
        const punsDatabase = [
            {
                word: "韭菜",
                pun: "久菜",
                explanation: "老板说我是公司的'久菜'，意思是我能在公司待很久？还是割完一茬又一茬？"
            },
            {
                word: "程序员",
                pun: "成猿",
                explanation: "为什么程序员都自称'成猿'？因为加班太多，从人类进化成猿了！"
            },
            {
                word: "开会",
                pun: "开烩",
                explanation: "每次开会都像是'开烩'，各种人各种事一锅炖，最后味道还不怎么样。"
            },
            {
                word: "手机",
                pun: "手鸡",
                explanation: "为什么手机叫'手鸡'？因为拿在手上的鸡，会下金蛋（指各种APP）吗？"
            },
            {
                word: "加班",
                pun: "加奔",
                explanation: "每次加班都变成'加奔'，加着加着就想奔向自由！"
            },
            {
                word: "奶茶",
                pun: "奶岔",
                explanation: "为什么奶茶叫'奶岔'？因为喝多了会在身材上岔出一条分界线？"
            }
        ];
        
        // DOM元素
        const wordInput = document.getElementById('word-input');
        const generateBtn = document.getElementById('generate-btn');
        const loader = document.getElementById('loader');
        const resultContent = document.getElementById('result-content');
        const originalWord = document.getElementById('original-word');
        const punWord = document.getElementById('pun-word');
        const explanation = document.getElementById('explanation');
        const tryAgainBtn = document.getElementById('try-again-btn');
        const copyBtn = document.getElementById('copy-btn');
        const shareBtn = document.getElementById('share-btn');
        const likeBtn = document.querySelector('.like');
        const dislikeBtn = document.querySelector('.dislike');
        const exampleCards = document.querySelectorAll('.example-card');
        
        // 生成随机谐音梗
        function generatePun(word) {
            // 如果有匹配的，优先返回匹配项
            const matchedPun = punsDatabase.find(item => item.word === word);
            if (matchedPun) return matchedPun;
            
            // 否则返回随机项
            const randomIndex = Math.floor(Math.random() * punsDatabase.length);
            return punsDatabase[randomIndex];
        }
        
        // 显示加载状态
        function showLoader() {
            loader.style.display = 'flex';
            resultContent.style.display = 'none';
        }
        
        // 显示结果
        function showResult(pun) {
            setTimeout(() => {
                loader.style.display = 'none';
                originalWord.textContent = pun.word;
                punWord.textContent = pun.pun;
                explanation.textContent = pun.explanation;
                resultContent.style.display = 'block';
            }, 1000);
        }
        
        // 处理生成
        function handleGenerate() {
            const word = wordInput.value.trim();
            
            if (!word || word.length < 2) {
                alert('请输入至少2个字的词语');
                return;
            }
            
            showLoader();
            
            // 模拟API请求延迟
            setTimeout(() => {
                const pun = generatePun(word);
                showResult(pun);
            }, 1500);
        }
        
        // 示例点击事件
        exampleCards.forEach(card => {
            card.addEventListener('click', () => {
                const word = card.getAttribute('data-word');
                wordInput.value = word;
                handleGenerate();
            });
        });
        
        // 复制结果
        function copyResult() {
            const text = `${originalWord.textContent} → ${punWord.textContent}\n${explanation.textContent}`;
            
            navigator.clipboard.writeText(text)
                .then(() => {
                    // 显示成功反馈
                    const originalText = copyBtn.innerHTML;
                    copyBtn.innerHTML = '<i class="fas fa-check"></i> 已复制';
                    
                    setTimeout(() => {
                        copyBtn.innerHTML = originalText;
                    }, 2000);
                })
                .catch(err => {
                    console.error('复制失败:', err);
                    alert('复制失败，请手动复制文本');
                });
        }
        
        // 分享功能
        function shareResult() {
            const text = `我发现了一个有趣的谐音梗：\n${originalWord.textContent} → ${punWord.textContent}\n${explanation.textContent}\n\n来自「谐音梗生成器」`;
            
            if (navigator.share) {
                navigator.share({
                    title: '有趣的谐音梗',
                    text: text
                }).catch(console.error);
            } else {
                // 如果不支持Web Share API，则使用复制
                navigator.clipboard.writeText(text)
                    .then(() => {
                        const originalText = shareBtn.innerHTML;
                        shareBtn.innerHTML = '<i class="fas fa-check"></i> 已复制';
                        
                        setTimeout(() => {
                            shareBtn.innerHTML = originalText;
                        }, 2000);
                    })
                    .catch(err => {
                        console.error('复制失败:', err);
                        alert('分享失败，请手动复制文本');
                    });
            }
        }
        
        // 反馈功能
        function sendFeedback(isLike) {
            const feedbackText = isLike ? '👍 谢谢你的喜欢！' : '👎 我们会改进的！';
            
            // 显示反馈提示
            const feedbackBtn = isLike ? likeBtn : dislikeBtn;
            const originalHTML = feedbackBtn.innerHTML;
            feedbackBtn.innerHTML = isLike ? '<i class="fas fa-check"></i>' : '<i class="fas fa-times"></i>';
            
            setTimeout(() => {
                feedbackBtn.innerHTML = originalHTML;
            }, 1000);
        }
        
        // 事件监听
        generateBtn.addEventListener('click', handleGenerate);
        tryAgainBtn.addEventListener('click', handleGenerate);
        copyBtn.addEventListener('click', copyResult);
        shareBtn.addEventListener('click', shareResult);
        likeBtn.addEventListener('click', () => sendFeedback(true));
        dislikeBtn.addEventListener('click', () => sendFeedback(false));
        
        // 支持按Enter键生成
        wordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleGenerate();
            }
        });
        
        // 初始化显示一个示例
        window.addEventListener('load', () => {
            const initialPun = generatePun('韭菜');
            showResult(initialPun);
        });
    </script>
</body>
</html>
