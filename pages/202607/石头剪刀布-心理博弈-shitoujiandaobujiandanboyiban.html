<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>石头剪刀布 - 心理博弈</title>
    <style>
        :root {
            --primary-color: #34C759;
            --primary-dark: #248A3D;
            --primary-light: #DDF7E4;
            --text-color: #1D1D1F;
            --text-light: #86868B;
            --bg-color: #F5F5F7;
            --card-color: #FFFFFF;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
        }
        
        .game-container {
            background-color: var(--card-color);
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            width: 90%;
            max-width: 500px;
            margin: 20px 0;
        }
        
        h1 {
            font-size: 32px;
            font-weight: 600;
            margin: 0 0 30px 0;
            color: var(--primary-dark);
        }
        
        .scores {
            display: flex;
            justify-content: space-around;
            margin: 25px 0;
            font-size: 20px;
            font-weight: 500;
        }
        
        .preview-container {
            background-color: var(--primary-light);
            border-radius: 12px;
            padding: 15px;
            margin: 20px 0;
        }
        
        .preview-label {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 8px;
        }
        
        .computer-preview {
            font-size: 60px;
            line-height: 1;
        }
        
        .choices {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
        }
        
        .choice-btn {
            background-color: var(--primary-color);
            border: none;
            color: white;
            padding: 12px 0;
            font-size: 17px;
            font-weight: 500;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100px;
            box-shadow: 0 4px 8px rgba(52, 199, 89, 0.2);
        }
        
        .choice-btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(52, 199, 89, 0.3);
        }
        
        .choice-btn:active {
            transform: translateY(0);
        }
        
        .result-container {
            margin: 25px 0;
            min-height: 60px;
        }
        
        .result {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 10px;
        }
        
        .choices-made {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 20px 0;
        }
        
        .choice-display {
            font-size: 50px;
            line-height: 1;
        }
        
        .choice-label {
            font-size: 14px;
            color: var(--text-light);
            margin-top: 8px;
        }
        
        .reset-btn {
            background-color: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 8px 20px;
            font-size: 15px;
            font-weight: 500;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }
        
        .reset-btn:hover {
            background-color: var(--primary-light);
        }
        
        .divider {
            height: 1px;
            background-color: rgba(0, 0, 0, 0.1);
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>石头剪刀布</h1>
        
        <div class="scores">
            <div>玩家: <span id="player-score">0</span></div>
            <div>电脑: <span id="computer-score">0</span></div>
        </div>
        
        <div class="preview-container">
            <div class="preview-label">电脑预告</div>
            <div class="computer-preview" id="computer-preview">?</div>
        </div>
        
        <div class="divider"></div>
        
        <div class="choices">
            <button class="choice-btn" id="rock">石头</button>
            <button class="choice-btn" id="paper">布</button>
            <button class="choice-btn" id="scissors">剪刀</button>
        </div>
        
        <div class="result-container">
            <div class="result" id="result">请做出你的选择</div>
            <div class="choices-made">
                <div>
                    <div class="choice-display" id="player-choice">-</div>
                    <div class="choice-label">你的选择</div>
                </div>
                <div>
                    <div class="choice-display" id="computer-choice">-</div>
                    <div class="choice-label">电脑选择</div>
                </div>
            </div>
        </div>
        
        <button class="reset-btn" id="reset">重新开始</button>
    </div>

    <script>
        // 游戏变量
        let playerScore = 0;
        let computerScore = 0;
        let computerRealChoice = '';
        let computerPreviewChoice = '';
        
        // 表情符号映射
        const emojiMap = {
            '石头': '✊',
            '布': '✋',
            '剪刀': '✌️'
        };
        
        // DOM元素
        const playerScoreEl = document.getElementById('player-score');
        const computerScoreEl = document.getElementById('computer-score');
        const resultEl = document.getElementById('result');
        const playerChoiceEl = document.getElementById('player-choice');
        const computerChoiceEl = document.getElementById('computer-choice');
        const computerPreviewEl = document.getElementById('computer-preview');
        const rockBtn = document.getElementById('rock');
        const paperBtn = document.getElementById('paper');
        const scissorsBtn = document.getElementById('scissors');
        const resetBtn = document.getElementById('reset');
        
        // 电脑随机选择
        function computerPlay() {
            const choices = ['石头', '布', '剪刀'];
            const randomIndex = Math.floor(Math.random() * 3);
            return choices[randomIndex];
        }
        
        // 生成电脑预告
        function generateComputerPreview() {
            computerRealChoice = computerPlay();
            
            // 70%概率展示真实选择，30%概率说谎
            const isPreviewTruth = Math.random() < 0.7;
            
            if (isPreviewTruth) {
                computerPreviewChoice = computerRealChoice;
            } else {
                // 从不是真实选择的选项中随机选一个
                const otherChoices = ['石头', '布', '剪刀'].filter(choice => choice !== computerRealChoice);
                computerPreviewChoice = otherChoices[Math.floor(Math.random() * 2)];
            }
            
            computerPreviewEl.textContent = emojiMap[computerPreviewChoice];
        }
        
        // 游戏逻辑
        function playRound(playerSelection) {
            // 更新显示的选择(使用表情符号)
            playerChoiceEl.textContent = emojiMap[playerSelection];
            computerChoiceEl.textContent = emojiMap[computerRealChoice];
            
            // 平局
            if (playerSelection === computerRealChoice) {
                resultEl.textContent = "平局！";
                return;
            }
            
            // 玩家赢的情况
            if (
                (playerSelection === '石头' && computerRealChoice === '剪刀') ||
                (playerSelection === '布' && computerRealChoice === '石头') ||
                (playerSelection === '剪刀' && computerRealChoice === '布')
            ) {
                playerScore++;
                playerScoreEl.textContent = playerScore;
                resultEl.textContent = "你赢了！";
                return;
            }
            
            // 电脑赢的情况
            computerScore++;
            computerScoreEl.textContent = computerScore;
            resultEl.textContent = "你输了！";
        }
        
        // 重置回合
        function resetRound() {
            generateComputerPreview();
            playerChoiceEl.textContent = '-';
            computerChoiceEl.textContent = '-';
            resultEl.textContent = '请做出你的选择';
        }
        
        // 事件监听
        rockBtn.addEventListener('click', () => {
            playRound('石头');
            setTimeout(resetRound, 1500);
        });
        
        paperBtn.addEventListener('click', () => {
            playRound('布');
            setTimeout(resetRound, 1500);
        });
        
        scissorsBtn.addEventListener('click', () => {
            playRound('剪刀');
            setTimeout(resetRound, 1500);
        });
        
        // 重置游戏
        resetBtn.addEventListener('click', () => {
            playerScore = 0;
            computerScore = 0;
            playerScoreEl.textContent = '0';
            computerScoreEl.textContent = '0';
            resetRound();
        });
        
        // 初始化游戏
        generateComputerPreview();
    </script>
</body>
</html>
