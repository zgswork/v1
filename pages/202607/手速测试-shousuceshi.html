<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>手速测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #008c8c 0%, #006666 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            touch-action: manipulation;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .title {
            color: #fff;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .timer {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .timer-label {
            color: #008c8c;
            font-size: 1rem;
            margin-bottom: 5px;
        }

        .timer-value {
            color: #008c8c;
            font-size: 3.5rem;
            font-weight: bold;
        }

        .click-area {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: transform 0.1s, background 0.1s;
            user-select: none;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .click-area:active {
            transform: scale(0.98);
            background: rgba(230, 255, 255, 0.95);
        }

        .click-area.disabled {
            cursor: default;
        }

        .click-area.disabled:active {
            transform: none;
            background: rgba(255, 255, 255, 0.95);
        }

        .click-hint {
            color: #008c8c;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .score {
            color: #008c8c;
            font-size: 4rem;
            font-weight: bold;
        }

        .score-label {
            color: #666;
            font-size: 1rem;
            margin-top: 5px;
        }

        .stats {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .stats-row {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            color: #008c8c;
            font-size: 2rem;
            font-weight: bold;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
        }

        .btn {
            background: linear-gradient(135deg, #00a8a8 0%, #008c8c 100%);
            color: #fff;
            border: none;
            border-radius: 50px;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 140, 140, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            display: none;
        }

        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 3px 10px rgba(0, 140, 140, 0.4);
        }

        .btn.visible {
            display: inline-block;
        }

        .result-message {
            color: #008c8c;
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 15px;
            display: none;
        }

        .result-message.visible {
            display: block;
        }

        @media (max-width: 380px) {
            .title {
                font-size: 1.6rem;
            }

            .timer-value {
                font-size: 3rem;
            }

            .score {
                font-size: 3.5rem;
            }

            .stat-value {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">手速测试</h1>
        
        <div class="timer">
            <div class="timer-label">剩余时间</div>
            <div class="timer-value" id="timer">10.0</div>
        </div>

        <div class="click-area" id="clickArea">
            <div class="click-hint" id="clickHint">点击开始测试</div>
            <div class="score" id="score">0</div>
            <div class="score-label" id="scoreLabel">得分</div>
        </div>

        <div class="stats">
            <div class="result-message" id="resultMessage">测试结束!</div>
            <div class="stats-row">
                <div class="stat-item">
                    <div class="stat-value" id="totalClicks">0</div>
                    <div class="stat-label">总点击次数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="avgSpeed">0.0</div>
                    <div class="stat-label">平均每秒点击</div>
                </div>
            </div>
            <button class="btn" id="restartBtn">再来一次</button>
        </div>
    </div>

    <script>
        const clickArea = document.getElementById('clickArea');
        const clickHint = document.getElementById('clickHint');
        const scoreDisplay = document.getElementById('score');
        const scoreLabel = document.getElementById('scoreLabel');
        const timerDisplay = document.getElementById('timer');
        const totalClicksDisplay = document.getElementById('totalClicks');
        const avgSpeedDisplay = document.getElementById('avgSpeed');
        const resultMessage = document.getElementById('resultMessage');
        const restartBtn = document.getElementById('restartBtn');

        let score = 0;
        let timeLeft = 10.0;
        let gameStarted = false;
        let gameEnded = false;
        let timerInterval = null;
        let startTime = null;

        function formatTime(seconds) {
            return seconds.toFixed(1);
        }

        function startGame() {
            gameStarted = true;
            gameEnded = false;
            score = 0;
            timeLeft = 10.0;
            startTime = Date.now();
            
            clickHint.textContent = '疯狂点击!';
            scoreDisplay.textContent = '0';
            timerDisplay.textContent = '10.0';
            totalClicksDisplay.textContent = '0';
            avgSpeedDisplay.textContent = '0.0';
            resultMessage.classList.remove('visible');
            restartBtn.classList.remove('visible');
            clickArea.classList.remove('disabled');

            timerInterval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                timeLeft = Math.max(0, 10.0 - elapsed);
                timerDisplay.textContent = formatTime(timeLeft);

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 50);
        }

        function endGame() {
            clearInterval(timerInterval);
            gameEnded = true;
            gameStarted = false;
            clickArea.classList.add('disabled');
            
            const avgSpeed = score / 10;
            totalClicksDisplay.textContent = score;
            avgSpeedDisplay.textContent = avgSpeed.toFixed(1);
            
            clickHint.textContent = '时间到!';
            resultMessage.classList.add('visible');
            restartBtn.classList.add('visible');
        }

        function handleClick(e) {
            e.preventDefault();
            
            if (!gameStarted && !gameEnded) {
                startGame();
            }
            
            if (gameStarted && !gameEnded) {
                score++;
                scoreDisplay.textContent = score;
                
                const elapsed = (Date.now() - startTime) / 1000;
                if (elapsed > 0) {
                    const currentAvg = score / elapsed;
                    avgSpeedDisplay.textContent = currentAvg.toFixed(1);
                }
            }
        }

        function handleRestart() {
            score = 0;
            timeLeft = 10.0;
            gameStarted = false;
            gameEnded = false;
            
            clickHint.textContent = '点击开始测试';
            scoreDisplay.textContent = '0';
            timerDisplay.textContent = '10.0';
            totalClicksDisplay.textContent = '0';
            avgSpeedDisplay.textContent = '0.0';
            resultMessage.classList.remove('visible');
            restartBtn.classList.remove('visible');
            clickArea.classList.remove('disabled');
        }

        clickArea.addEventListener('click', handleClick);
        clickArea.addEventListener('touchstart', handleClick, { passive: false });
        restartBtn.addEventListener('click', handleRestart);
    </script>
</body>
</html>
