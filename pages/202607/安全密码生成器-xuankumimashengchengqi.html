<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全密码生成器</title>
    <style>
        :root {
            --primary-color: #6200ee;
            --primary-light: #9e47ff;
            --primary-dark: #0400ba;
            --secondary-color: #03dac6;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e1e1e1;
            --text-secondary: #a0a0a0;
            --border-color: #333333;
            --border-radius: 12px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 8px 30px rgba(0, 0, 0, 0.5);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 700;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 30px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            transition: var(--transition);
        }

        .card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-5px);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--secondary-color);
            font-weight: 500;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .option-item {
            display: flex;
            align-items: center;
        }

        .option-item input[type="checkbox"] {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-secondary);
            border-radius: 4px;
            margin-right: 10px;
            cursor: pointer;
            position: relative;
            transition: var(--transition);
        }

        .option-item input[type="checkbox"]:checked {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .option-item input[type="checkbox"]:checked::after {
            content: "✓";
            position: absolute;
            color: white;
            font-size: 14px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .option-item label {
            cursor: pointer;
            user-select: none;
        }

        .slider-container {
            margin-top: 10px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .slider {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: var(--border-color);
            outline: none;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
            transition: var(--transition);
        }

        .slider::-webkit-slider-thumb:hover {
            background: var(--primary-light);
            transform: scale(1.1);
        }

        .result-container {
            text-align: center;
            padding: 20px;
            position: relative;
        }

        .password-display {
            font-size: 1.8rem;
            margin: 20px 0;
            padding: 15px;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: var(--border-radius);
            word-break: break-all;
            position: relative;
            transition: var(--transition);
        }

        .password-display:hover {
            background-color: rgba(0, 0, 0, 0.3);
        }

        .copy-btn {
            position: absolute;
            right: 10px;
            top: 10px;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.2rem;
            transition: var(--transition);
        }

        .copy-btn:hover {
            color: var(--secondary-color);
        }

        .strength-meter {
            height: 8px;
            background: var(--border-color);
            border-radius: 4px;
            margin: 20px 0;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff5252, #ffab40, #ffd740, #69f0ae, #00e676);
            transition: width 0.5s ease;
        }

        .strength-text {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(98, 0, 238, 0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(98, 0, 238, 0.4);
            background: linear-gradient(135deg, var(--primary-light), var(--primary-color));
        }

        .btn:active {
            transform: translateY(1px);
        }

        .tooltip {
            position: absolute;
            background-color: var(--primary-color);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: var(--primary-color) transparent transparent transparent;
        }

        .visible {
            opacity: 1;
        }

        footer {
            text-align: center;
            margin-top: auto;
            padding-top: 30px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .password-display {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>安全密码生成器</h1>
            <p class="subtitle">创建高强度、随机的安全密码</p>
        </header>
        
        <div class="card">
            <div class="form-group">
                <h3 class="form-title">密码长度</h3>
                <div class="slider-container">
                    <div class="slider-label">
                        <span>8</span>
                        <span id="length-value">16</span>
                        <span>32</span>
                    </div>
                    <input type="range" min="8" max="32" value="16" class="slider" id="length-slider">
                </div>
            </div>
            
            <div class="form-group">
                <h3 class="form-title">包含字符类型</h3>
                <div class="options-grid">
                    <div class="option-item">
                        <input type="checkbox" id="uppercase" checked>
                        <label for="uppercase">大写字母 (A-Z)</label>
                    </div>
                    <div class="option-item">
                        <input type="checkbox" id="lowercase" checked>
                        <label for="lowercase">小写字母 (a-z)</label>
                    </div>
                    <div class="option-item">
                        <input type="checkbox" id="numbers" checked>
                        <label for="numbers">数字 (0-9)</label>
                    </div>
                    <div class="option-item">
                        <input type="checkbox" id="symbols" checked>
                        <label for="symbols">特殊符号 (!@#$%^&*)</label>
                    </div>
                    <div class="option-item">
                        <input type="checkbox" id="ambiguous">
                        <label for="ambiguous">排除易混淆字符 (1lI0O)</label>
                    </div>
                    <div class="option-item">
                        <input type="checkbox" id="similar">
                        <label for="similar">排除相似字符 (i1lo0)</label>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <button class="btn" id="generate-btn">生成密码</button>
            </div>
        </div>
        
        <div class="card result-container" id="result-card" style="display: none;">
            <h3 class="form-title">生成的密码</h3>
            <div class="password-display" id="password-display">
                <button class="copy-btn" id="copy-btn" title="复制密码">
                    <i class="fas fa-copy"></i>
                </button>
                <span id="password-text"></span>
            </div>
            
            <div class="strength-meter">
                <div class="strength-fill" id="strength-fill"></div>
            </div>
            <div class="strength-text" id="strength-text">密码强度: 中等</div>
            
            <button class="btn" id="regenerate-btn">重新生成</button>
        </div>
    </div>
    
    <footer>
        <p>使用强密码保护您的在线账户安全</p>
    </footer>

    <!-- 引入Font Awesome图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <script>
        // DOM元素
        const lengthSlider = document.getElementById('length-slider');
        const lengthValue = document.getElementById('length-value');
        const uppercaseCheckbox = document.getElementById('uppercase');
        const lowercaseCheckbox = document.getElementById('lowercase');
        const numbersCheckbox = document.getElementById('numbers');
        const symbolsCheckbox = document.getElementById('symbols');
        const ambiguousCheckbox = document.getElementById('ambiguous');
        const similarCheckbox = document.getElementById('similar');
        const generateBtn = document.getElementById('generate-btn');
        const resultCard = document.getElementById('result-card');
        const passwordText = document.getElementById('password-text');
        const copyBtn = document.getElementById('copy-btn');
        const regenerateBtn = document.getElementById('regenerate-btn');
        const strengthFill = document.getElementById('strength-fill');
        const strengthText = document.getElementById('strength-text');
        
        // 字符集
        const charSets = {
            uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
            lowercase: 'abcdefghijklmnopqrstuvwxyz',
            numbers: '0123456789',
            symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?',
            ambiguous: '1lI0O',
            similar: 'i1lo0'
        };
        
        // 更新密码长度显示
        lengthSlider.addEventListener('input', function() {
            lengthValue.textContent = this.value;
        });
        
        // 生成密码
        generateBtn.addEventListener('click', generatePassword);
        regenerateBtn.addEventListener('click', generatePassword);
        
        // 复制密码
        copyBtn.addEventListener('click', copyPassword);
        
        function generatePassword() {
            // 获取用户选择
            const length = parseInt(lengthSlider.value);
            const includeUppercase = uppercaseCheckbox.checked;
            const includeLowercase = lowercaseCheckbox.checked;
            const includeNumbers = numbersCheckbox.checked;
            const includeSymbols = symbolsCheckbox.checked;
            const excludeAmbiguous = ambiguousCheckbox.checked;
            const excludeSimilar = similarCheckbox.checked;
            
            // 验证至少选择一种字符类型
            if (!includeUppercase && !includeLowercase && !includeNumbers && !includeSymbols) {
                alert('请至少选择一种字符类型！');
                return;
            }
            
            // 构建可用字符集
            let charset = '';
            
            if (includeUppercase) {
                charset += charSets.uppercase;
            }
            
            if (includeLowercase) {
                charset += charSets.lowercase;
            }
            
            if (includeNumbers) {
                charset += charSets.numbers;
            }
            
            if (includeSymbols) {
                charset += charSets.symbols;
            }
            
            // 排除易混淆字符
            if (excludeAmbiguous) {
                for (const char of charSets.ambiguous) {
                    charset = charset.replace(new RegExp(char, 'g'), '');
                }
            }
            
            // 排除相似字符
            if (excludeSimilar) {
                for (const char of charSets.similar) {
                    charset = charset.replace(new RegExp(char, 'g'), '');
                }
            }
            
            // 生成密码
            let password = '';
            const charsetLength = charset.length;
            
            // 使用加密安全的随机数生成器
            const crypto = window.crypto || window.msCrypto;
            const randomValues = new Uint32Array(length);
            crypto.getRandomValues(randomValues);
            
            for (let i = 0; i < length; i++) {
                password += charset[randomValues[i] % charsetLength];
            }
            
            // 显示密码
            passwordText.textContent = password;
            resultCard.style.display = 'block';
            
            // 计算密码强度
            calculateStrength(password, length);
        }
        
        function calculateStrength(password, length) {
            let score = 0;
            
            // 长度评分
            if (length >= 32) score += 40;
            else if (length >= 24) score += 30;
            else if (length >= 16) score += 20;
            else if (length >= 12) score += 10;
            else score += 5;
            
            // 字符类型多样性
            const hasUppercase = /[A-Z]/.test(password);
            const hasLowercase = /[a-z]/.test(password);
            const hasNumbers = /[0-9]/.test(password);
            const hasSymbols = /[^A-Za-z0-9]/.test(password);
            
            let typeCount = 0;
            if (hasUppercase) typeCount++;
            if (hasLowercase) typeCount++;
            if (hasNumbers) typeCount++;
            if (hasSymbols) typeCount++;
            
            score += typeCount * 15;
            
            // 特殊字符加分
            if (hasSymbols) score += 10;
            
            // 密码强度百分比 (0-100)
            const strengthPercent = Math.min(100, score);
            strengthFill.style.width = `${strengthPercent}%`;
            
            // 设置强度文本和颜色
            let strengthLevel, strengthColor;
            
            if (strengthPercent >= 80) {
                strengthLevel = '非常强';
                strengthColor = '#00e676'; // 绿色
            } else if (strengthPercent >= 60) {
                strengthLevel = '强';
                strengthColor = '#69f0ae'; // 浅绿色
            } else if (strengthPercent >= 40) {
                strengthLevel = '中等';
                strengthColor = '#ffd740'; // 黄色
            } else if (strengthPercent >= 20) {
                strengthLevel = '弱';
                strengthColor = '#ffab40'; // 橙色
            } else {
                strengthLevel = '非常弱';
                strengthColor = '#ff5252'; // 红色
            }
            
            strengthText.textContent = `密码强度: ${strengthLevel}`;
            strengthFill.style.background = strengthColor;
        }
        
        function copyPassword() {
            const password = passwordText.textContent;
            if (!password) return;
            
            navigator.clipboard.writeText(password).then(() => {
                // 显示复制成功的提示
                const tooltip = document.createElement('div');
                tooltip.className = 'tooltip visible';
                tooltip.textContent = '已复制！';
                copyBtn.appendChild(tooltip);
                
                // 3秒后移除提示
                setTimeout(() => {
                    tooltip.classList.remove('visible');
                    setTimeout(() => {
                        copyBtn.removeChild(tooltip);
                    }, 300);
                }, 1500);
            }).catch(err => {
                console.error('复制失败:', err);
            });
        }
        
        // 初始生成一个密码
        generatePassword();
    </script>
</body>
</html>
