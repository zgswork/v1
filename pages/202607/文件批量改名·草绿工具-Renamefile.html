<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>文件批量改名 · 草绿工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        /* 草绿色背景，全屏自适应 */
        body {
            background-color: #ccff99;
            background: #b7e57e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* 主卡片 */
        .card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 36px 36px 28px 28px;
            box-shadow: 0 20px 40px rgba(0, 30, 0, 0.2);
            width: 100%;
            max-width: 1000px;
            padding: 28px 24px 24px 24px;
            border: 2px solid rgba(120, 140, 60, 0.3);
            transition: all 0.2s;
        }

        /* 头部 */
        .header {
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 8px 12px;
        }
        .header h1 {
            font-size: 1.9rem;
            font-weight: 600;
            color: #1f3a1f;
            letter-spacing: -0.3px;
            text-shadow: 2px 2px 0 #e0ffb0;
            margin-right: auto;
        }
        .header-badge {
            background: #2b5e2b;
            color: #f9ffdb;
            padding: 6px 18px;
            border-radius: 60px;
            font-weight: 500;
            font-size: 1rem;
            border: 1px solid #98c779;
            white-space: nowrap;
        }

        /* 核心上传区 - 删除树叶图标 */
        .upload-area {
            background: rgba(245, 255, 220, 0.6);
            border: 3px dashed #558b2f;
            border-radius: 42px;
            padding: 26px 18px;
            text-align: center;
            margin-bottom: 30px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .upload-area:hover {
            background: rgba(225, 250, 180, 0.8);
            border-color: #33691e;
        }
        .upload-area:active {
            transform: scale(0.99);
        }
        /* 删除树叶图标，只保留文字 */
        .upload-text {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1f4d1f;
        }
        .upload-hint {
            font-size: 0.9rem;
            color: #2e542e;
            background: #ddffbb;
            display: inline-block;
            padding: 4px 18px;
            border-radius: 50px;
            margin-top: 8px;
        }

        /* ===== 批量工具栏 ===== */
        .batch-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin: 0 0 16px 0;
            background: rgba(210, 240, 170, 0.5);
            padding: 16px 18px;
            border-radius: 48px;
            backdrop-filter: blur(2px);
            border: 2px solid #7dab64;
        }
        .tool-item {
            display: flex;
            flex: 1 1 240px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: white;
            padding: 6px 12px 6px 18px;
            border-radius: 40px;
            border: 2px solid #58853e;
            box-shadow: inset 0 1px 4px #c0e0a0;
            min-width: 260px;
        }
        .tool-label {
            font-weight: 600;
            color: #1d4f1d;
            margin-right: 4px;
            white-space: nowrap;
        }
        .tool-item input {
            flex: 2 1 120px;
            padding: 10px 14px;
            border: 2px solid #9bc178;
            border-radius: 40px;
            font-size: 0.95rem;
            background: #fdffec;
            min-width: 100px;
        }
        .tool-item input:focus {
            border-color: #2a7a2a;
            outline: 3px solid #c2f0a5;
        }
        .tool-btn {
            background: #558b2f;
            border: none;
            color: white;
            font-weight: 700;
            padding: 10px 22px;
            border-radius: 40px;
            cursor: pointer;
            border-bottom: 4px solid #2c5e1a;
            transition: 0.05s linear;
            white-space: nowrap;
            font-size: 0.95rem;
            box-shadow: 0 3px 0 #2b5a1a;
        }
        .tool-btn:active {
            transform: translateY(4px);
            border-bottom-width: 2px;
        }
        .tool-btn.warning-btn {
            background: #cc9c33;
            border-bottom-color: #8f651f;
        }

        /* 前缀工具栏 */
        .prefix-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin: 0 0 16px 0;
            background: rgba(210, 240, 170, 0.5);
            padding: 16px 18px;
            border-radius: 48px;
            backdrop-filter: blur(2px);
            border: 2px solid #7dab64;
        }
        .prefix-toolbar .tool-item {
            display: flex;
            flex: 1 1 240px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: white;
            padding: 6px 12px 6px 18px;
            border-radius: 40px;
            border: 2px solid #58853e;
            box-shadow: inset 0 1px 4px #c0e0a0;
            min-width: 260px;
        }
        .prefix-toolbar .tool-item input {
            flex: 2 1 180px;
            padding: 10px 14px;
            border: 2px solid #9bc178;
            border-radius: 40px;
            font-size: 0.95rem;
            background: #fdffec;
        }

        /* 操作栏 - 四个按钮居中 */
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;  /* 水平居中 */
            gap: 15px 10px;
            margin: 8px 0 12px;
        }
        .left-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .btn {
            background: #ecffe2;
            border: 2px solid #507e32;
            color: #1d4d1d;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #678c4a;
            transition: 0.08s linear;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }
        .btn.warning {
            background: #fff0b5;
            border-color: #b68b40;
            box-shadow: 0 4px 0 #b68b40;
            color: #4f3a0e;
        }
        /* 撤销按钮特殊颜色 */
        .btn.undo {
            background: #d4f0ff;
            border-color: #3f7e9c;
            box-shadow: 0 4px 0 #2d5f7a;
            color: #12455f;
        }

        /* 表格区域 */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 28px;
            background: #e5ffcdc0;
            padding: 4px 0;
            margin-top: 12px;
            box-shadow: inset 0 2px 6px rgba(70,100,0,0.2);
        }
        .file-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 480px;
        }
        .file-table th {
            background: #558b2f;
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 16px 8px;
            white-space: nowrap;
        }
        .file-table th:first-child {
            border-top-left-radius: 24px;
        }
        .file-table th:last-child {
            border-top-right-radius: 24px;
        }
        .file-table td {
            padding: 14px 8px;
            border-bottom: 2px solid #bbdbaa;
            background: rgba(255, 255, 240, 0.5);
            word-break: break-word;
        }
        .file-table tr:last-child td {
            border-bottom: none;
        }
        .preview-col {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.9rem;
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .new-name-cell {
            background: #f0ffe0;
        }
        .new-name-input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #9acc7a;
            border-radius: 30px;
            font-size: 0.9rem;
            background: white;
        }
        .new-name-input:focus {
            border-color: #256f25;
            outline: 3px solid #c5f5a5;
        }
        .file-size {
            font-size: 0.8rem;
            color: #2e542e;
            white-space: nowrap;
        }
        .action-icons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .icon-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 4px;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.1s;
            background: #ffffffd0;
            border: 1px solid #8cb36b;
        }
        .icon-btn:hover {
            background: #f0ffe2;
            transform: scale(1.1);
        }

        /* 底部版权 - JA伙伴-阿记在做一件事 */
        .footer {
            margin-top: 24px;
            text-align: center;
            color: #173017;
            font-weight: 550;
            font-size: 1.2rem;
            letter-spacing: 1px;
            background: rgba(180, 220, 120, 0.5);
            padding: 10px 40px;
            border-radius: 60px;
            backdrop-filter: blur(2px);
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            border: 2px solid #3e6d2b;
            box-shadow: 0 4px 0 #2b4f1e;
        }

        .empty-message {
            padding: 40px;
            text-align: center;
            font-size: 1.3rem;
            color: #457645;
            font-style: italic;
        }
        .note {
            font-size: 0.9rem;
            color: #1c471c;
            margin-top: 12px;
            background: #e3ffc2;
            padding: 8px 16px;
            border-radius: 28px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>📛 文件批量改名</h1>
            <span class="header-badge">任意文件 · 单个/批量</span>
        </div>

        <!-- 隐藏file input -->
        <input type="file" id="filePicker" multiple style="display: none;">

        <!-- 上传区 - 已删除树叶图标 -->
        <div class="upload-area" id="dropZone">
            <div class="upload-text">点击或将文件拖拽至此</div>
            <div class="upload-hint">支持任意格式，可多选</div>
        </div>

        <!-- 第一行批量功能：只保留查找替换（已删除一键清空） -->
        <div class="batch-toolbar">
            <!-- 仅保留替换文字功能，占满整行 -->
            <div class="tool-item" style="flex: 1 1 100%;">
                <span class="tool-label">🔍 查找</span>
                <input type="text" id="findText" placeholder="输入要查找的文字" value="" style="flex: 2 1 200px;">
                <span class="tool-label" style="margin-left: 4px;">➡️ 替换为</span>
                <input type="text" id="replaceText" placeholder="替换成" value="" style="flex: 2 1 200px;">
                <button class="tool-btn" id="batchReplaceBtn">替换</button>
            </div>
        </div>

        <!-- 第二行：批量加前缀 -->
        <div class="prefix-toolbar">
            <div class="tool-item" style="justify-content: flex-start; flex: 1 1 100%;">
                <span class="tool-label">✨ 批量加前缀</span>
                <input type="text" id="prefixInput" placeholder="例如: holiday_" value="" style="flex: 3 1 200px;">
                <button class="tool-btn" id="applyPrefixBtn">添加前缀</button>
            </div>
        </div>

        <!-- 操作栏 - 四个按钮 (追加文件、撤销修改、清空列表、全部下载) 全部居中 -->
        <div class="action-bar">
            <div class="left-actions">
                <button class="btn" id="selectMoreBtn">➕ 追加文件</button>
                <button class="btn undo" id="undoBtn">↩️ 撤销修改</button>
                <button class="btn warning" id="clearAllBtn">🗑️ 清空列表</button>
                <button class="btn" id="batchSaveBtn">⬇️ 全部下载</button>
            </div>
        </div>

        <!-- 文件列表表格 -->
        <div class="table-wrapper" id="tableWrapper">
            <table class="file-table" id="fileTable">
                <thead>
                    <tr>
                        <th>原文件名</th>
                        <th>大小</th>
                        <th>新文件名 (点击编辑)</th>
                        <th style="text-align: center;">操作</th>
                    </tr>
                </thead>
                <tbody id="fileListBody">
                    <tr>
                        <td colspan="4" class="empty-message">✨ 点击上方区域添加文件</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="note">
            💡 点击表格中“新文件名”单元格即可单独编辑；修改后自动记忆。点击保存按钮下载重命名后的文件。
        </div>
    </div>

    <!-- 底部居中 - JA伙伴-阿记在做一件事 -->
    <div class="footer">
        JA伙伴-阿记在做一件事
    </div>

    <script>
        (function() {
            let filesData = [];          // 存储 { file, newName }
            let historyStack = [];        // 历史记录栈，用于撤销功能

            const filePicker = document.getElementById('filePicker');
            const dropZone = document.getElementById('dropZone');
            const selectMoreBtn = document.getElementById('selectMoreBtn');
            const undoBtn = document.getElementById('undoBtn');
            const clearAllBtn = document.getElementById('clearAllBtn');
            const prefixInput = document.getElementById('prefixInput');
            const applyPrefixBtn = document.getElementById('applyPrefixBtn');
            const fileListBody = document.getElementById('fileListBody');
            const batchSaveBtn = document.getElementById('batchSaveBtn');

            // 只保留查找替换相关元素
            const batchReplaceBtn = document.getElementById('batchReplaceBtn');
            const findText = document.getElementById('findText');
            const replaceText = document.getElementById('replaceText');

            // 保存当前状态到历史栈 (深拷贝)
            function pushHistory() {
                // 深拷贝 filesData
                const snapshot = filesData.map(item => ({
                    file: item.file,  // file对象是只读的，可共享
                    newName: item.newName
                }));
                historyStack.push(snapshot);
                // 限制历史长度，防止内存过大
                if (historyStack.length > 30) {
                    historyStack.shift();
                }
            }

            // 撤销：恢复到上一个历史状态
            function undo() {
                if (historyStack.length === 0) {
                    alert('没有可撤销的操作');
                    return;
                }
                // 弹出上一个快照
                const lastSnapshot = historyStack.pop();
                // 恢复数据 (但需要保留file对象引用)
                filesData = lastSnapshot.map(item => ({
                    file: item.file,
                    newName: item.newName
                }));
                renderTable();
            }

            // 包装数据修改函数，自动记录历史
            function modifyData(modifyFn) {
                if (filesData.length > 0) {
                    pushHistory();  // 记录修改前的状态
                }
                modifyFn();
                renderTable();
            }

            function formatFileSize(bytes) {
                if (bytes === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return (bytes / Math.pow(k, i)).toFixed(1) + ' ' + sizes[i];
            }

            function renderTable() {
                if (!fileListBody) return;

                if (filesData.length === 0) {
                    fileListBody.innerHTML = `<tr><td colspan="4" class="empty-message">📭 还没有添加任何文件，点击上方添加</td></tr>`;
                    return;
                }

                let html = '';
                filesData.forEach((item, index) => {
                    const file = item.file;
                    const currentNewName = item.newName !== undefined ? item.newName : file.name;
                    const safeNewName = currentNewName || file.name;  // 如果为空字符串则显示原文件名（但实际存储可能为空）
                    
                    const sizeStr = formatFileSize(file.size);
                    html += `<tr data-index="${index}">
                        <td class="preview-col" title="${file.name}">${escapeHtml(file.name)}</td>
                        <td class="file-size">${sizeStr}</td>
                        <td class="new-name-cell" data-field="newName">
                            <input type="text" class="new-name-input" value="${escapeHtml(safeNewName)}" data-index="${index}" placeholder="新文件名">
                        </td>
                        <td style="text-align: center;">
                            <div class="action-icons">
                                <button class="icon-btn save-row" data-index="${index}" title="保存此文件(下载)">💾</button>
                                <button class="icon-btn remove-row" data-index="${index}" title="移除">❌</button>
                            </div>
                        </td>
                    </tr>`;
                });
                fileListBody.innerHTML = html;

                // 输入框事件
                document.querySelectorAll('.new-name-input').forEach(input => {
                    input.addEventListener('input', function(e) {
                        const idx = this.getAttribute('data-index');
                        if (idx !== null && filesData[idx]) {
                            filesData[idx].newName = this.value;
                        }
                    });
                });

                document.querySelectorAll('.save-row').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const idx = this.getAttribute('data-index');
                        if (idx !== null && filesData[idx]) {
                            downloadSingleFile(idx);
                        }
                    });
                });

                document.querySelectorAll('.remove-row').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const idx = this.getAttribute('data-index');
                        if (idx !== null && filesData[idx]) {
                            // 单个移除也记录历史
                            pushHistory();
                            filesData.splice(idx, 1);
                            renderTable();
                        }
                    });
                });
            }

            function escapeHtml(unsafe) {
                return unsafe.replace(/[&<>"']/g, function(m) {
                    if(m === '&') return '&amp;'; if(m === '<') return '&lt;'; if(m === '>') return '&gt;';
                    if(m === '"') return '&quot;'; return '&#039;';
                });
            }

            function downloadSingleFile(index) {
                const item = filesData[index];
                if (!item) return;
                const file = item.file;
                const newName = (item.newName && item.newName.trim()) ? item.newName.trim() : file.name;

                const blob = new Blob([file], { type: file.type });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = newName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            function downloadAllFiles() {
                if (filesData.length === 0) {
                    alert('没有文件可保存');
                    return;
                }
                for (let i = 0; i < filesData.length; i++) {
                    setTimeout(() => {
                        downloadSingleFile(i);
                    }, i * 300);
                }
            }

            function addFilesFromList(fileList) {
                if (!fileList || fileList.length === 0) return;
                const newItems = [];
                for (let i = 0; i < fileList.length; i++) {
                    const file = fileList[i];
                    newItems.push({
                        file: file,
                        newName: file.name
                    });
                }
                // 添加文件也记录历史
                if (newItems.length > 0) {
                    pushHistory();
                    filesData = [...filesData, ...newItems];
                    renderTable();
                }
            }

            function openFilePicker() {
                filePicker.click();
            }

            filePicker.addEventListener('change', function(e) {
                addFilesFromList(e.target.files);
                filePicker.value = '';
            });

            dropZone.addEventListener('click', openFilePicker);
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.style.background = 'rgba(200, 240, 150, 0.8)';
            });
            dropZone.addEventListener('dragleave', () => {
                dropZone.style.background = 'rgba(245, 255, 220, 0.6)';
            });
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.style.background = 'rgba(245, 255, 220, 0.6)';
                const items = e.dataTransfer.files;
                if (items.length > 0) {
                    addFilesFromList(items);
                }
            });

            selectMoreBtn.addEventListener('click', openFilePicker);

            // 撤销按钮
            undoBtn.addEventListener('click', undo);

            clearAllBtn.addEventListener('click', () => {
                if (filesData.length > 0 && confirm('确定要清空所有文件吗？')) {
                    pushHistory();  // 记录清空前状态
                    filesData = [];
                    renderTable();
                }
            });

            // 批量加前缀
            applyPrefixBtn.addEventListener('click', () => {
                const prefix = prefixInput.value.trim();
                if (filesData.length === 0) {
                    alert('请先添加文件');
                    return;
                }
                if (prefix === '') {
                    alert('请输入要添加的前缀');
                    return;
                }
                modifyData(() => {
                    filesData.forEach(item => {
                        const original = item.file.name;
                        const lastDotIndex = original.lastIndexOf('.');
                        let baseName = original;
                        let ext = '';
                        if (lastDotIndex !== -1 && lastDotIndex > 0) {
                            baseName = original.substring(0, lastDotIndex);
                            ext = original.substring(lastDotIndex);
                        }
                        item.newName = prefix + baseName + ext;
                    });
                });
            });

            // 查找替换
            batchReplaceBtn.addEventListener('click', () => {
                if (filesData.length === 0) {
                    alert('没有文件可操作');
                    return;
                }
                const findStr = findText.value;
                const replaceStr = replaceText.value;
                if (findStr === '') {
                    alert('请输入要查找的文字');
                    return;
                }

                modifyData(() => {
                    filesData.forEach(item => {
                        const currentNew = item.newName !== undefined ? item.newName : item.file.name;
                        const replaced = currentNew.split(findStr).join(replaceStr);
                        item.newName = replaced;
                    });
                });
            });

            // 全部下载按钮
            batchSaveBtn.addEventListener('click', downloadAllFiles);

            // 初始化
            renderTable();
        })();
    </script>
</body>
</html>
