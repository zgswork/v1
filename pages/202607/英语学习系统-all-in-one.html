<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英语学习系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* 基础样式 */
        body {
            font-family: 'Comic Neue', cursive;
            background-color: #f0f8ff;
            margin: 0;
            padding: 0;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background-color: #ff9966;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1,
        h2 {
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        /* 按钮样式 */
        button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 15px 25px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
            border-radius: 50px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            font-family: 'Comic Neue', cursive;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        button:active {
            transform: translateY(1px);
        }

        /* 年级选择按钮 */
        .grade-btn {
            min-width: 100px;
            background-color: #ff6699;
        }

        /* 游戏选择按钮 */
        .game-btn {
            min-width: 150px;
            background-color: #66ccff;
        }

        #multiplayer-btn {
            background-color: #ffcc66;
        }

        #back-btn {
            background-color: #ff6666;
        }

        /* 游戏区域 */
        .game-area {
            background-color: white;
            padding: 20px;
            border-radius: 15px;
            min-height: 300px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* 单词配对游戏样式 */
        .matching-game {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }

        .words,
        .meanings {
            width: 45%;
        }

        .word,
        .meaning {
            padding: 10px;
            margin: 5px 0;
            background-color: #f0f8ff;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .word.selected,
        .meaning.selected {
            background-color: yellow;
        }

        .word.correct,
        .meaning.correct {
            background-color: #4CAF50;
            color: white;
        }

        .word.incorrect,
        .meaning.incorrect {
            background-color: #ff6666;
            color: white;
        }

        /*
 用户信息 */
        .user-info {
            background-color: white;
            padding: 10px 20px;
            border-radius: 50px;
            display: inline-block;
            margin-top: 10px;
        }

        /* 清零积分按钮 */
        .reset-btn {
            background-color: #ff6666;
            padding: 8px 15px;
            font-size: 14px;
            margin-left: 10px;
        }

        #points {
            font-weight: bold;
            color: #ff9966;
            font-size: 1.2em;
        }

        /* 徽章样式 */
        .badge {
            display: inline-block;
            width: 30px;
            height: 30px;
            background-color: gold;
            border-radius: 50%;
            margin-left: 5px;
            text-align: center;
            line-height: 30px;
            font-size: 0.8em;
            color: #333;
        }

        /* 排行榜 */
        .leaderboard {
            background-color: white;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        #top-players {
            list-style-type: none;
            padding: 0;
        }

        #top-players li {
            padding: 10px;
            margin: 5px 0;
            background-color: #f0f8ff;
            border-radius: 5px;
        }

        /* 隐藏类 */
        .hidden {
            display: none;
        }

        /* 动画效果 */
        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .bounce {
            animation: bounce 0.5s;
        }

        /* 输入框样式 */
        input[type="text"] {
            padding: 10px;
            margin: 10px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 16px;
            font-family: 'Comic Neue', cursive;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #4CAF50;
        }

        /* 选项按钮样式 */
        .option {
            background-color: #e0e0e0;
            color: #333;
            margin: 5px;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 14px;
        }

        .option:hover {
            background-color: #d0d0d0;
        }

        .option:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>

    <div class="container">
        <header>
            <h1>英语单词挑战</h1>
            <div class="user-info">

            </div>
        </header>

        <main>
            <section class="grade-selector">

                <div class="grades">
                    <button class="grade-btn" data-grade="3">三年级</button>
                    <button class="grade-btn" data-grade="4">四年级</button>
                    <button class="grade-btn" data-grade="5">五年级</button>
                    <button class="grade-btn" data-grade="6">六年级</button>
                </div>
            </section>

            <section class="game-selector hidden">
                <h2>选择游戏模式</h2>
                <div class="games">
                    <button class="game-btn" data-game="spelling">拼写比赛</button>
                    <button class="game-btn" data-game="matching">单词配对</button>
                    <button class="game-btn" data-game="chain">单词接龙</button>
                    <button class="game-btn" data-game="listening">听力挑战</button>
                    <button class="game-btn" data-game="fill">填空游戏</button>
                </div>
                <div class="multiplayer">
                    <button id="multiplayer-btn">多人模式</button>
                    <button id="back-to-grade" class="back-btn">返回年级选择</button>
                </div>
            </section>

            <section class="game-area hidden">
                <!-- Game content will be loaded here -->
            </section>

            <section class="leaderboard hidden">
                <h2>排行榜</h2>
                <ol id="top-players"></ol>
            </section>
        </main>

        <footer>
            <button id="back-btn" class="hidden">返回</button>
            <audio id="sound-effect" src=""></audio>
        </footer>
    </div>

        // 初始化
        function init() {
            // 年级选择
            gradeButtons.forEach(button => {
                button.addEventListener('click', selectGrade);
            });

            // 游戏选择
            gameButtons.forEach(button => {
                button.addEventListener('click', selectGame);
            });

            // 返回按钮
            backButton.addEventListener('click', goBack);

            // 多人模式
            multiplayerButton.addEventListener('click', startMultiplayer);

            // 返回年级选择
            document.getElementById('back-to-grade').addEventListener('click', () => {
                gameSelector.classList.add('hidden');
                document.querySelector('.grade-selector').classList.remove('hidden');
                playSound('click');
            });

            document.getElementById('reset-points').addEventListener('click', resetPoints);

            loadLeaderboard();

        // 选择年级
        function selectGrade(e) {
            const grade = e.target.dataset.grade;
            gameData.currentGrade = grade;
            gameSelector.classList.remove('hidden');
            e.target.parentElement.parentElement.classList.add('hidden');
            playSound('click');
        }

        // 选择游戏
        function selectGame(e) {
            const game = e.target.dataset.game;
            gameData.currentGame = game;
            gameArea.classList.remove('hidden');
            e.target.parentElement.parentElement.classList.add('hidden');
            backButton.classList.remove('hidden');
            playSound('click');

            // 根据选择的游戏加载不同的内容
            switch (game) {
                case 'spelling':
                    loadSpellingGame();
                    break;
                case 'matching':
                    loadMatchingGame();
                    break;
                case 'chain':
                    loadWordChainGame();
                    break;
                case 'listening':
                    loadListeningGame();
                    break;
                case 'fill':
                    loadFillBlankGame();
                    break;
            }
        }
        // 拼写游戏
        function loadSpellingGame() {
            const words = wordDatabase[`grade${gameData.currentGrade}`];
            const randomWord = words[Math.floor(Math.random() * words.length)];

            gameArea.innerHTML = `
                <h2>拼写单词</h2>
                <p>${randomWord.meaning}</p>
                <input type="text" id="spelling-input" placeholder="输入英文单词">
                <button id="check-spelling">检查</button>
                <p id="spelling-result"></p>
            `;

            document.getElementById('check-spelling').addEventListener('click', checkSpelling);
        }

        function checkSpelling() {
            const input = document.getElementById('spelling-input');
            const resultDisplay = document.getElementById('spelling-result');
            const words = wordDatabase[`grade${gameData.currentGrade}`];
            const currentWord = words.find(w => w.meaning === document.querySelector('p').textContent);

            // 提取纯单词部分（去掉音标）
            const baseWord = currentWord.word.split('[')[0].trim();
            if (input.value.toLowerCase() === baseWord.toLowerCase()) {
                resultDisplay.textContent = "Correct! +5分";
                resultDisplay.style.color = "green";
                addPoints(5);
                playSound('correct');

                // 2秒后自动进入下一题
                setTimeout(() => {
                    loadSpellingGame();
                }, 2000);
            } else {
                resultDisplay.textContent = `Incorrect! -3分 正确答案是 "${currentWord.word}"`;
                resultDisplay.style.color = "red";
                addPoints(-3);
                playSound('wrong');
            }
        }

        // 单词匹配游戏
        function loadMatchingGame() {
            const words = wordDatabase[`grade${gameData.currentGrade}`];
            const selectedWords = [];

            // 随机选择4个单词
            while (selectedWords.length < 4 && selectedWords.length < words.length) {
                const randomWord = words[Math.floor(Math.random() * words.length)];
                if (!selectedWords.includes(randomWord)) {
                    selectedWords.push(randomWord);
                }
            }

            gameArea.innerHTML = `
                <h2>单词配对</h2>
                <div class="matching-game">
                    <div class="words">
                        ${selectedWords.map(word => { const baseWord = word.word.split('[')[0].trim(); return `<div class="word" data-word="${word.word}">${baseWord}</div>`; }).join('')}
                    </div>
                    <div class="meanings">
                        ${shuffleArray(selectedWords).map(word => `<div class="meaning" data-meaning="${word.meaning}">${word.meaning}</div>`).join('')}
                    </div>
                </div>
            `;

            // 添加匹配事件
            const wordElements = document.querySelectorAll('.word');
            const meaningElements = document.querySelectorAll('.meaning');

            wordElements.forEach(word => {
                word.addEventListener('click', selectWord);
            });

            meaningElements.forEach(meaning => {
                meaning.addEventListener('click', selectMeaning);
            });
        }

        let selectedWord = null;
        let selectedMeaning = null;

        function selectWord() {
            // 清除之前的选择
            document.querySelectorAll('.word').forEach(w => w.classList.remove('selected'));
            document.querySelectorAll('.meaning').forEach(m => m.classList.remove('selected'));

            // 选中当前单词
            this.classList.add('selected');
            selectedWord = this;

            // 如果已经选中了中文，检查匹配
            if (selectedMeaning) {
                checkMatch();
            }
        }

        function selectMeaning() {
            // 清除之前的选择
            document.querySelectorAll('.word').forEach(w => w.classList.remove('selected'));
            document.querySelectorAll('.meaning').forEach(m => m.classList.remove('selected'));

            // 选中当前中文
            this.classList.add('selected');
            selectedMeaning = this;

            // 如果已经选中了英文，检查匹配
            if (selectedWord) {
                checkMatch();
            }
        }

        function checkMatch() {
            const word = selectedWord.getAttribute('data-word');
            const meaning = selectedMeaning.getAttribute('data-meaning');

            // 检查单词和中文是否匹配
            const isCorrect = wordDatabase[`grade${gameData.currentGrade}`].some(
                w => w.word === word && w.meaning === meaning
            );

            if (isCorrect) {
                selectedWord.classList.add('correct');
                selectedMeaning.classList.add('correct');
                selectedWord.classList.remove('selected');
                selectedMeaning.classList.remove('selected');
                playSound('correct');
                addPoints(5);

                // 检查是否所有配对都已完成
                const allWords = document.querySelectorAll('.word');
                const allCorrect = Array.from(allWords).every(word => word.classList.contains('correct'));

                if (allCorrect) {
                    // 2秒后自动进入下一题
                    setTimeout(() => {
                        loadMatchingGame();
                    }, 2000);
                }

                // 重置选择
                selectedWord = null;
                selectedMeaning = null;
            } else {
                selectedWord.classList.add('incorrect');
                selectedMeaning.classList.add('incorrect');
                playSound('wrong');
                addPoints(-3);

                // 添加重新选择功能
                setTimeout(() => {
                    selectedWord.classList.remove('incorrect', 'selected');
                    selectedMeaning.classList.remove('incorrect', 'selected');
                    selectedWord = null;
                    selectedMeaning = null;
                }, 1000);
            }
        }

        // 单词接龙游戏
        function loadWordChainGame() {
            gameArea.innerHTML = `
                <h2>单词接龙</h2>
                <p>上一个单词的最后一个字母是下一个单词的第一个字母</p>
                <div id="word-chain"></div>
                <input type="text" id="chain-input" placeholder="输入你的单词">
                <button id="submit-word">提交</button>
                <p id="chain-result"></p>
            `;

            // 初始化第一个单词
            const words = wordDatabase[`grade${gameData.currentGrade}`];
            const randomWord = words[Math.floor(Math.random() * words.length)];
            const baseWord = randomWord.word.split('[')[0].trim();
            document.getElementById('word-chain').textContent = `${randomWord.meaning} ${baseWord}`;

            document.getElementById('submit-word').addEventListener('click', checkChainWord);
        }

        function checkChainWord() {
            const input = document.getElementById('chain-input');
            const resultDisplay = document.getElementById('chain-result');
            const currentChainWord = document.getElementById('word-chain').textContent;

            const lastLetter = currentChainWord.slice(-1).toLowerCase();
            const userWord = input.value.trim().toLowerCase();

            // 获取所有年级的单词，构建验证集合
            const allWords = new Set();
            Object.keys(wordDatabase).forEach(grade => {
                wordDatabase[grade].forEach(item => {
                    const baseWord = item.word.split('[')[0].trim().toLowerCase();
                    allWords.add(baseWord);
                });
            });

            // 检查用户输入的单词是否在小学阶段单词表中
            const isInWordDatabase = allWords.has(userWord);
            const startsWithCorrectLetter = userWord.startsWith(lastLetter);
            const isValidFormat = /^[a-zA-Z]+$/.test(userWord) && userWord.length >= 2;

            if (isValidFormat && startsWithCorrectLetter && isInWordDatabase) {
                resultDisplay.textContent = "Correct! +5分";
                resultDisplay.style.color = "green";
                addPoints(5);
                playSound('correct');

                // 获取用户输入单词的中文意思
                let userWordData = null;
                Object.keys(wordDatabase).forEach(grade => {
                    const found = wordDatabase[grade].find(item =>
                        item.word.split('[')[0].trim().toLowerCase() === userWord.toLowerCase()
                    );
                    if (found) userWordData = found;
                });

                // 更新单词链并清空输入
                const displayText = userWordData ? `${userWordData.meaning} ${userWord}` : userWord;
                document.getElementById('word-chain').textContent = displayText;
                input.value = '';

                // 2秒后自动进入下一题（使用用户输入的单词作为下一题接龙语词）
                setTimeout(() => {
                    document.getElementById('word-chain').textContent = displayText;
                    input.value = '';
                    resultDisplay.textContent = '';
                }, 2000);
            } else if (!startsWithCorrectLetter) {
                resultDisplay.textContent = `Incorrect! -3分 请输入以'${lastLetter}'开头的单词`;
                resultDisplay.style.color = "red";
                addPoints(-3);
                playSound('wrong');
            } else if (!isInWordDatabase) {
                resultDisplay.textContent = "该单词不在小学阶段单词表中，请重新输入 -3分";
                resultDisplay.style.color = "red";
                addPoints(-3);
                playSound('wrong');
            } else {
                resultDisplay.textContent = "请输入有效的英文单词 -3分";
                resultDisplay.style.color = "red";
                addPoints(-3);
                playSound('wrong');
            }
        }
        // 听音辨词游戏
        function loadListeningGame() {
            const words = wordDatabase[`grade${gameData.currentGrade}`];
            const selectedWords = [];

            // 随机选择4个单词
            while (selectedWords.length < 4 && selectedWords.length < words.length) {
                const randomWord = words[Math.floor(Math.random() * words.length)];
                if (!selectedWords.includes(randomWord)) {
                    selectedWords.push(randomWord);
                }
            }

            // 从当前答案选项中随机选择4个单词
            const shuffledWords = [...selectedWords].sort(() => 0.5 - Math.random());
            const answerWords = shuffledWords.slice(0, 4); // 获取4个选项单词
            const correctWord = answerWords[Math.floor(Math.random() * answerWords.length)];

            gameArea.innerHTML = `
                <h2>听力挑战</h2>
                <button id="play-sound">播放单词</button>
                <div class="options" data-correct-word="${correctWord.word}" data-retry-count="0">
                    ${answerWords.map(word => `<button class="option" data-word="${word.word}">${word.meaning}</button>`).join('')}
                </div>
                <p id="listening-result"></p>
            `;

            // 播放语音的函数
            function playWordAudio(word) {
                if ('speechSynthesis' in window) {
                    // 清除之前的语音播报
                    speechSynthesis.cancel();

                    // 获取可用的语音列表
                    const voices = speechSynthesis.getVoices();

                    // 优先选择标准的英语语音
                    let selectedVoice = null;

                    // 按优先级选择语音：美式英语 > 英式英语 > 其他英语
                    const preferredVoices = [
                        'Microsoft Zira - English (United States)',
                        'Microsoft David - English (United States)',
                        'Google US English',
                        'Alex',
                        'Samantha',
                        'Microsoft Hazel - English (Great Britain)',
                        'Google UK English Female',
                        'Google UK English Male'
                    ];

                    // 尝试找到首选语音
                    for (const preferredName of preferredVoices) {
                        selectedVoice = voices.find(voice => voice.name === preferredName);
                        if (selectedVoice) break;
                    }

                    // 如果没找到首选语音，选择任何英语语音
                    if (!selectedVoice) {
                        selectedVoice = voices.find(voice =>
                            voice.lang.startsWith('en-') &&
                            (voice.lang.includes('US') || voice.lang.includes('GB'))
                        );
                    }

                    // 如果还是没找到，使用默认的英语语音
                    if (!selectedVoice) {
                        selectedVoice = voices.find(voice => voice.lang.startsWith('en'));
                    }

                    const createUtterance = () => {
                        const utterance = new SpeechSynthesisUtterance();
                        utterance.text = word.split('[')[0].trim(); // 获取纯单词文本
                        utterance.lang = 'en-US';
                        utterance.rate = 0.7; // 稍微慢一点，更清晰
                        utterance.pitch = 1.0; // 标准音调
                        utterance.volume = 1.0; // 最大音量

                        // 设置选中的语音
                        if (selectedVoice) {
                            utterance.voice = selectedVoice;
                        }

                        return utterance;
                    };

                    // 第一次播报
                    const firstUtterance = createUtterance();
                    speechSynthesis.speak(firstUtterance);

                    // 第二次播报，间隔1.5秒
                    setTimeout(() => {
                        const secondUtterance = createUtterance();
                        speechSynthesis.speak(secondUtterance);
                    }, 1500);
                } else {
                    // 降级方案：显示提示
                    alert('您的浏览器不支持语音播报功能');
                }
            }

            document.getElementById('play-sound').addEventListener('click', () => {
                playWordAudio(correctWord.word);
            });

            document.querySelectorAll('.option').forEach(option => {
                option.addEventListener('click', checkListeningAnswer);
            });
        }

        function checkListeningAnswer(e) {
            const selectedOption = e.target;
            const selectedWord = selectedOption.getAttribute('data-word');
            const resultDisplay = document.getElementById('listening-result');
            const optionsContainer = document.querySelector('.options');

            // 获取当前题目的正确单词
            const correctWord = optionsContainer.dataset.correctWord;

            // 获取或初始化重试次数
            let retryCount = parseInt(optionsContainer.dataset.retryCount || '0');

            if (selectedWord === correctWord) {
                // 选择正确答案时显示绿色
                selectedOption.style.backgroundColor = "#4CAF50";
                selectedOption.style.color = "white";

                resultDisplay.textContent = "Correct! +5分";
                resultDisplay.style.color = "green";
                addPoints(5);
                playSound('correct');

                // 禁用所有选项
                document.querySelectorAll('.option').forEach(opt => opt.disabled = true);

                // 2秒后自动下一题
                setTimeout(() => {
                    loadListeningGame();
                }, 2000);
            } else {
                // 选择错误答案时显示红色
                selectedOption.style.backgroundColor = "#ff6666";
                selectedOption.style.color = "white";

                retryCount++;
                optionsContainer.dataset.retryCount = retryCount;

                if (retryCount < 2) {
                    // 还有重试机会
                    resultDisplay.textContent = `选择错误！还有 ${2 - retryCount} 次机会`;
                    resultDisplay.style.color = "orange";
                    selectedOption.disabled = true; // 禁用错误选项
                    playSound('wrong');
                } else {
                    // 二次机会用完，显示正确答案为绿色
                    const correctWordData = wordDatabase[`grade${gameData.currentGrade}`].find(w => w.word === correctWord);
                    const chineseMeaning = correctWordData ? correctWordData.meaning : '';
                    resultDisplay.textContent = `选择错误！-3分 正确答案是: ${correctWord} (${chineseMeaning})`;
                    resultDisplay.style.color = "red";
                    addPoints(-3);
                    playSound('wrong');

                    // 高亮显示正确答案
                    document.querySelectorAll('.option').forEach(opt => {
                        if (opt.getAttribute('data-word') === correctWord) {
                            opt.style.backgroundColor = "#4CAF50";
                            opt.style.color = "white";
                        }
                        opt.disabled = true;
                    });

                    // 3秒后自动下一题
                    setTimeout(() => {
                        loadListeningGame();
                    }, 3000);
                }
            }
        }
        // 单词填空游戏
        let currentFillWord = null; // 存储当前填空题的正确答案

        function loadFillBlankGame() {
            const words = wordDatabase[`grade${gameData.currentGrade}`];
            const randomWord = words[Math.floor(Math.random() * words.length)];

            // 保存当前题目的正确答案
            currentFillWord = randomWord;

            // 创建填空句子
            const baseWord = randomWord.word.split('[')[0].trim();
            const sentence = `This is a ${'_'.repeat(baseWord.length)}. (${randomWord.meaning})`;

            gameArea.innerHTML = `
                <h2>填空游戏</h2>
                <p>${sentence}</p>
                <input type="text" id="fill-input" placeholder="输入缺失的单词">
                <button id="check-fill">检查</button>
                <p id="fill-result"></p>
            `;

            document.getElementById('check-fill').addEventListener('click', checkFillAnswer);
        }

        function checkFillAnswer() {
            const input = document.getElementById('fill-input');
            const resultDisplay = document.getElementById('fill-result');

            // 直接使用保存的正确答案
            if (!currentFillWord) {
                resultDisplay.textContent = "游戏错误，请重新开始";
                resultDisplay.style.color = "red";
                return;
            }

            const baseWord = currentFillWord.word.split('[')[0].trim();
            const userAnswer = input.value.trim();

            if (userAnswer.toLowerCase() === baseWord.toLowerCase()) {
                resultDisplay.textContent = "Correct! +5分";
                resultDisplay.style.color = "green";
                addPoints(5);
                playSound('correct');

                // 2秒后自动进入下一题
                setTimeout(() => {
                    loadFillBlankGame();
                }, 2000);
            } else {
                resultDisplay.textContent = `Incorrect! -3分 正确答案是 "${baseWord}"`;
                resultDisplay.style.color = "red";
                addPoints(-3);
                playSound('wrong');
            }
        }

        // 多人游戏
        function startMultiplayer() {
            alert('该功能即将开放，敬请期待');
        }

        // 返回上一级
        function goBack() {
            // 停止语音播报
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
            }

            if (gameArea.classList.contains('hidden')) {
                // 从游戏选择返回年级选择
                gameSelector.classList.remove('hidden');
                document.querySelector('.grade-selector').classList.remove('hidden');
                gameArea.classList.add('hidden');
                backButton.classList.add('hidden');
            } else {
                // 从游戏返回游戏选择
                gameSelector.classList.remove('hidden');
                gameArea.classList.add('hidden');
                backButton.classList.add('hidden');
            }
            playSound('click');
        }

        // 加载排行榜
        function loadLeaderboard() {
            leaderboardList.innerHTML = gameData.leaderboard
                .sort((a, b) => b.score - a.score)
                .map(player => `<li>${player.name}: ${player.score}</li>`)
                .join('');

            leaderboardSection.classList.remove('hidden');
        }

        // 添加分数
        function addPoints(points) {
            gameData.points += points;
            pointsDisplay.textContent = gameData.points;

            // 检查是否获得徽章
            checkBadges();
        }

        // 清零积分
        function resetPoints() {
            gameData.points = 0;
            pointsDisplay.textContent = gameData.points;
            playSound('click');
        }

        // 检查徽章
        function checkBadges() {
            const badgeLevels = [50, 100, 200, 500];

            badgeLevels.forEach((level, index) => {
                if (gameData.points >= level && !gameData.badges.includes(index)) {
                    gameData.badges.push(index);
                    const badge = document.createElement('div');
                    badge.className = 'badge bounce';
                    badge.textContent = index + 1;
                    badge.title = `Level ${index + 1} Badge`;
                    badgesContainer.appendChild(badge);
                    playSound('badge');
                }
            });
        }

        // 播放音效
        function playSound(type) {
            const sounds = {
                click: 'click.mp3',
                correct: 'correct.mp3',
                wrong: 'wrong.mp3',
                badge: 'badge.mp3'
            };

            // 由于没有实际音频文件，这里只是模拟
            console.log(`Playing sound: ${sounds[type]}`);
        }

        // 辅助函数：打乱数组
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        // 启动应用
        init();
    </script>
</body>
