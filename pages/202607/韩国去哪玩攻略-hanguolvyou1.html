        const closeBtn = document.querySelector('.close');
        
        // 记录已显示的景点索引
        let shownIndices = [];
        
        // 获取随机景点
        function getRandomAttraction() {
            if (shownIndices.length === attractions.length) {
                shownIndices = []; // 如果所有景点都已显示过，重置
                alert('所有景点已展示完毕，将重新开始循环！');
            }
            
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * attractions.length);
            } while (shownIndices.includes(randomIndex));
            
            shownIndices.push(randomIndex);
            return attractions[randomIndex];
        }
        
        // 显示景点攻略
        function displayGuide() {
            const attraction = getRandomAttraction();
            
            guideDisplay.innerHTML = `
                <div class="guide-item">
                    <h2>${attraction.name}</h2>
                </div>
                <div class="guide-item">
                    <h3>景点介绍</h3>
                    <p>${attraction.description}</p>
                </div>
                <div class="guide-item">
                    <h3>景点地址</h3>
                    <p>${attraction.address}</p>
                </div>
                <div class="guide-item">
                    <h3>交通方式</h3>
                    <p>${attraction.transportation}</p>
                </div>
                <div class="guide-item">
                    <h3>门票信息</h3>
                    <p>${attraction.ticket}</p>
                </div>
                <div class="guide-item">
                    <h3>开放时间</h3>
                    <p>${attraction.opening}</p>
                </div>
            `;
            
            changeGuideBtn.style.display = 'inline-block';
        }
        
        // 事件监听
        getGuideBtn.addEventListener('click', displayGuide);
        changeGuideBtn.addEventListener('click', displayGuide);
        
        // 下载按钮事件
        downloadBtn.addEventListener('click', function() {
            modal.style.display = 'block';
        });
        
        // 关闭模态框
        closeBtn.addEventListener('click', function() {
            modal.style.display = 'none';
        });
        
        // 点击模态框外部关闭
        window.addEventListener('click', function(event) {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
