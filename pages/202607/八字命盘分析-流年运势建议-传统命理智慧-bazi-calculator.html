        // 计算年柱
        function getYearPillar(year) {
            // 以立春为界，简化处理用公历年
            const tianganIndex = (year - 4) % 10;
            const dizhiIndex = (year - 4) % 12;
            return {
                tiangan: TIANGAN[tianganIndex],
                dizhi: DIZHI[dizhiIndex]
            };
        }

        // 计算月柱
        function getMonthPillar(year, month, day) {
            // 简化节气处理，使用月份近似
            // 实际应该用精确的节气时间
            let adjustedMonth = month;
            if (day < 6) adjustedMonth--; // 简化：假设每月6号前算上月
            if (adjustedMonth === 0) {
                adjustedMonth = 12;
                year--;
            }

            const yearTiangan = (year - 4) % 10;
            // 月干 = (年干 * 2 + 月份) % 10
            const monthTianganIndex = (yearTiangan * 2 + adjustedMonth) % 10;
            // 月支从寅月开始
            const monthDizhiIndex = (adjustedMonth + 1) % 12;

            return {
                tiangan: TIANGAN[monthTianganIndex],
                dizhi: DIZHI[monthDizhiIndex]
            };
        }

        // 计算日柱（使用简化公式）
        function getDayPillar(year, month, day) {
            // 使用蔡勒公式的变体来计算日干支
            // 这是一个简化版本，实际应该使用查表法或更精确的算法
            const baseDate = new Date(1900, 0, 31); // 1900年1月31日是甲辰日
            const targetDate = new Date(year, month - 1, day);
            const diffDays = Math.floor((targetDate - baseDate) / (1000 * 60 * 60 * 24));

            const tianganIndex = (diffDays % 10 + 10) % 10;
            const dizhiIndex = (diffDays % 12 + 10) % 12; // 1900年1月31日是辰日

            return {
                tiangan: TIANGAN[tianganIndex],
                dizhi: DIZHI[(dizhiIndex + 4) % 12] // 调整为正确的地支
            };
        }

        // 计算时柱
        function getHourPillar(dayTiangan, hour) {
            const dayTianganIndex = TIANGAN.indexOf(dayTiangan);
            // 时干 = (日干序号 * 2 + 时支序号) % 10
            const hourTianganIndex = (dayTianganIndex * 2 + hour) % 10;

            return {
                tiangan: TIANGAN[hourTianganIndex],
                dizhi: DIZHI[hour]
            };
        }

        // 计算八字
        function calculateBazi() {
            const yearValue = document.getElementById('birthYear').value;
            const monthValue = document.getElementById('birthMonth').value;
            const dayValue = document.getElementById('birthDay').value;
            const hourValue = document.getElementById('birthHour').value;
            const gender = document.querySelector('input[name="gender"]:checked').value;
            const calendarType = document.querySelector('input[name="calendarType"]:checked').value;

            // 验证必填字段
            if (!yearValue || !monthValue || !dayValue || !hourValue) {
                alert('请完整填写出生信息（年、月、日、时辰）');
                return;
            }

            const year = parseInt(yearValue);
            const month = parseInt(monthValue);
            const day = parseInt(dayValue);
            const hour = parseInt(hourValue);

            // 验证日期有效性
            if (calendarType === 'solar') {
                const testDate = new Date(year, month - 1, day);
                if (testDate.getMonth() !== month - 1) {
                    alert('请输入有效的阳历日期');
                    return;
                }
            } else {
                // 农历日期简单验证（1-30日）
                if (day > 30) {
                    alert('农历日期最多30日，请检查输入');
                    return;
                }
            }

            // 显示历法类型提示
            const calendarHint = calendarType === 'solar' ? '（阳历）' : '（农历，已自动转换）';

            // 计算四柱
            const yearPillar = getYearPillar(year);
            const monthPillar = getMonthPillar(year, month, day);
            const dayPillar = getDayPillar(year, month, day);
            const hourPillar = getHourPillar(dayPillar.tiangan, hour);

            // 显示四柱
            displayPillars(yearPillar, monthPillar, dayPillar, hourPillar);

            // 分析五行
            const wuxingCount = analyzeWuxing(yearPillar, monthPillar, dayPillar, hourPillar);

            // 日主分析
            analyzeDayMaster(dayPillar.tiangan, gender);

            // 命盘特点
            analyzeCharacteristics(yearPillar, monthPillar, dayPillar, hourPillar, gender);

            // 年运分析
            analyzeYearlyFortune(dayPillar, yearPillar, monthPillar, wuxingCount, gender);

            // 显示结果
            document.getElementById('result').classList.remove('hidden');

            // 滚动到结果
            document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
        }

        // 分析五行
        function analyzeWuxing(year, month, day, hour) {
            const count = { '木': 0, '火': 0, '土': 0, '金': 0, '水': 0 };

            // 统计天干
            [year, month, day, hour].forEach(p => {
                count[TIANGAN_WUXING[p.tiangan]]++;
            });

            // 统计地支
            [year, month, day, hour].forEach(p => {
                count[DIZHI_WUXING[p.dizhi]]++;
            });

            // 统计藏干
            [year, month, day, hour].forEach(p => {
                const canggan = DIZHI_CANGGAN[p.dizhi];
                canggan.forEach((g, i) => {
                    // 主气权重大，余气权重小
                    count[TIANGAN_WUXING[g]] += (i === 0 ? 0.5 : 0.3);
                });
            });

            const total = Object.values(count).reduce((a, b) => a + b, 0);

            // 显示五行分布
            const wuxingContainer = document.getElementById('wuxing');
            wuxingContainer.innerHTML = ['木', '火', '土', '金', '水'].map(wx => {
                const percent = Math.round(count[wx] / total * 100);
                return `

                        <div class="text-xs text-gray-400">${percent}%</div>
                    </div>
                `;
            }).join('');

            // 五行分析
            const sorted = Object.entries(count).sort((a, b) => b[1] - a[1]);
            const strongest = sorted[0];
            const weakest = sorted[sorted.length - 1];

            let analysis = '';
            if (weakest[1] < 1) {

            analysis += `<p class="text-gray-300">五行${strongest[0]}最旺（${strongest[1].toFixed(1)}），${weakest[0]}最弱（${weakest[1].toFixed(1)}）</p>`;

            analysis += `<p class="text-gray-300 mt-2">${relations}</p>`;

            document.getElementById('wuxingAnalysis').innerHTML = analysis;

            return count;

                { name: '红色', color: '#ef4444', desc: '热情活力' },
                { name: '紫色', color: '#a855f7', desc: '高贵神秘' },
                { name: '橙色', color: '#f97316', desc: '温暖明亮' }
            ],
            '土': [
                { name: '黄色', color: '#eab308', desc: '尊贵富足' },
                { name: '棕色', color: '#a16207', desc: '稳重踏实' },
                { name: '米色', color: '#fef3c7', desc: '柔和温馨' }
            ],
            '金': [
                { name: '白色', color: '#f5f5f5', desc: '纯净高雅' },
                { name: '银色', color: '#cbd5e1', desc: '清冷理性' },
                { name: '金色', color: '#fbbf24', desc: '富贵吉祥' }
            ],
            '水': [
                { name: '黑色', color: '#1f2937', desc: '深邃内敛' },
                { name: '蓝色', color: '#3b82f6', desc: '智慧沉稳' },
                { name: '深蓝', color: '#1e3a8a', desc: '神秘优雅' }
            ]
        };

        // 五行对应配饰
        const WUXING_ACCESSORIES = {
            '木': [
                { name: '绿幽灵', desc: '招财旺运，事业顺遂', icon: '💎' },
                { name: '翡翠', desc: '养生护体，提升运势', icon: '🟢' },
                { name: '檀木手串', desc: '静心安神，增强贵人运', icon: '📿' },
                { name: '绿植盆栽', desc: '生机勃发，催旺财运', icon: '🌿' }
            ],
            '火': [
                { name: '红玛瑙', desc: '增强活力，提升人缘', icon: '🔴' },
                { name: '石榴石', desc: '激发热情，增进感情', icon: '💎' },
                { name: '紫水晶', desc: '开发智慧，提升直觉', icon: '💜' },
                { name: '红绳', desc: '辟邪保平安', icon: '🎀' }
            ],
            '土': [
                { name: '黄水晶', desc: '招财进宝，增强自信', icon: '💛' },
                { name: '虎眼石', desc: '增强决断力，事业顺利', icon: '🐯' },
                { name: '陶瓷饰品', desc: '稳定气场，增强包容', icon: '🏺' },
                { name: '琥珀', desc: '安神定心，趋吉避凶', icon: '🟤' }
            ],
            '金': [
                { name: '白水晶', desc: '净化磁场，增强正能量', icon: '⚪' },
                { name: '银饰', desc: '辟邪化煞，提升气质', icon: '💍' },
                { name: '金饰', desc: '招财聚富，提升贵气', icon: '👑' },
                { name: '珍珠', desc: '养颜静心，柔和气场', icon: '🤍' }
            ],
            '水': [
                { name: '黑曜石', desc: '辟邪挡煞，增强定力', icon: '⚫' },
                { name: '海蓝宝', desc: '增强沟通，提升智慧', icon: '💙' },
                { name: '青金石', desc: '开发潜能，增强直觉', icon: '🔵' },
                { name: '墨玉', desc: '稳定情绪，增强财运', icon: '🖤' }
            ]
        };

        // 计算流年天干地支
        function getYearPillarForYear(year) {
            const tianganIndex = (year - 4) % 10;
            const dizhiIndex = (year - 4) % 12;
            return {
                tiangan: TIANGAN[tianganIndex],
                dizhi: DIZHI[dizhiIndex]
            };
        }

        // 计算喜用神（简化版，基于日主强弱）
        function calculateFavorableElements(dayTiangan, wuxingCount) {
            const dayWuxing = TIANGAN_WUXING[dayTiangan];

            // 生克关系
            const sheng = { '木': '火', '火': '土', '土': '金', '金': '水', '水': '木' };
            const ke = { '木': '土', '火': '金', '土': '水', '金': '木', '水': '火' };
            const beiSheng = { '木': '水', '火': '木', '土': '火', '金': '土', '水': '金' };
            const beiKe = { '木': '金', '火': '水', '土': '木', '金': '火', '水': '土' };

            // 判断日主强弱
            const selfStrength = wuxingCount[dayWuxing] + wuxingCount[beiSheng[dayWuxing]];
            const totalStrength = Object.values(wuxingCount).reduce((a, b) => a + b, 0);
            const isStrong = selfStrength > totalStrength * 0.4;

            let favorable = [];
            let unfavorable = [];

            if (isStrong) {
                // 身强喜克泄耗
                favorable = [ke[dayWuxing], sheng[dayWuxing], beiKe[dayWuxing]];
                unfavorable = [dayWuxing, beiSheng[dayWuxing]];
            } else {
                // 身弱喜生扶
                favorable = [dayWuxing, beiSheng[dayWuxing]];
                unfavorable = [ke[dayWuxing], sheng[dayWuxing], beiKe[dayWuxing]];
            }

            return { favorable, unfavorable, isStrong };
        }

        // 分析年运
        function analyzeYearlyFortune(dayPillar, yearPillar, monthPillar, wuxingCount, gender) {
            const currentYear = new Date().getFullYear();
            const flowYear = getYearPillarForYear(currentYear);

            // 更新标题
            document.getElementById('yearFortuneTitle').textContent = `${currentYear}年运势分析`;

            const dayTiangan = dayPillar.tiangan;
            const dayDizhi = dayPillar.dizhi;
            const dayWuxing = TIANGAN_WUXING[dayTiangan];
            const flowYearWuxing = TIANGAN_WUXING[flowYear.tiangan];
            const flowYearDizhiWuxing = DIZHI_WUXING[flowYear.dizhi];

            // 计算喜用神
            const { favorable, unfavorable, isStrong } = calculateFavorableElements(dayTiangan, wuxingCount);

            // 流年概述
            const yearOverview = generateYearOverview(dayTiangan, flowYear, favorable, unfavorable, currentYear);
            document.getElementById('yearOverview').innerHTML = yearOverview;

            // 幸运颜色
            displayLuckyColors(favorable);

            // 开运配饰
            displayLuckyAccessories(favorable);

            // 各方面运势评分
            displayFortuneRatings(dayPillar, flowYear, favorable, unfavorable);

            // 年运注意事项
            displayYearTips(dayPillar, flowYear, favorable, unfavorable, isStrong);

            // 月份运势
            displayMonthlyFortune(dayPillar, favorable, currentYear);
        }

        // 生成年运概述
        function generateYearOverview(dayTiangan, flowYear, favorable, unfavorable, year) {
            const dayWuxing = TIANGAN_WUXING[dayTiangan];
            const flowWuxing = TIANGAN_WUXING[flowYear.tiangan];
            const flowDizhiWuxing = DIZHI_WUXING[flowYear.dizhi];

            let fortune = '';
            let advice = '';

            // 判断流年五行对日主的影响
            if (favorable.includes(flowWuxing)) {
                fortune = `${year}年流年天干${flowYear.tiangan}属${flowWuxing}，为您的喜用神，整体运势向好`;
                advice = '宜积极进取，把握机遇';
            } else if (unfavorable.includes(flowWuxing)) {
                fortune = `${year}年流年天干${flowYear.tiangan}属${flowWuxing}，与您的命格有所冲突，需要注意调整`;
                advice = '宜稳中求进，谨慎行事';
            } else {
                fortune = `${year}年流年天干${flowYear.tiangan}属${flowWuxing}，对您影响中性`;
                advice = '顺其自然，平稳度过';
            }

            // 检查地支关系
            const tianganHeDesc = checkTianganHe(dayTiangan, flowYear.tiangan);

            return `
                <div class="flex items-center gap-3 mb-3">
                    <span class="text-4xl">${flowYear.tiangan}${flowYear.dizhi}</span>
                    <div>
                        <div class="text-lg font-semibold text-white">${year}年·${flowYear.tiangan}${flowYear.dizhi}年</div>
                        <div class="text-sm text-gray-400">流年天干属${flowWuxing}，地支属${flowDizhiWuxing}</div>
                    </div>
                </div>
                <p class="text-gray-300 mb-2">${fortune}</p>
                ${tianganHeDesc ? `<p class="text-yellow-300 mb-2">${tianganHeDesc}</p>` : ''}
                <p class="text-cyan-300 text-sm">建议：${advice}</p>
            `;
        }

        // 检查天干合
        function checkTianganHe(dayTiangan, flowTiangan) {
            const heMap = {
                '甲己': '甲己相合化土，有利于稳定发展',
                '乙庚': '乙庚相合化金，有利于财运提升',
                '丙辛': '丙辛相合化水，有利于智慧增长',
                '丁壬': '丁壬相合化木，有利于事业拓展',
                '戊癸': '戊癸相合化火，有利于人际关系'
            };

            const combo = [dayTiangan, flowTiangan].sort().join('');
            for (const [key, desc] of Object.entries(heMap)) {
                if (key.includes(dayTiangan) && key.includes(flowTiangan)) {
                    return `今年您与流年${desc}`;
                }
            }
            return null;
        }

        // 显示幸运颜色
        function displayLuckyColors(favorable) {
            const container = document.getElementById('luckyColors');
            let colors = [];

            // 取前两个喜用五行的颜色
            favorable.slice(0, 2).forEach(wx => {
                if (WUXING_COLORS[wx]) {
                    colors = colors.concat(WUXING_COLORS[wx].slice(0, 2));
                }
            });

            container.innerHTML = colors.map(c => `
                <div class="flex items-center gap-2 bg-white/10 rounded-lg px-3 py-2">
                    <div class="w-6 h-6 rounded-full border-2 border-white/30" style="background: ${c.color}"></div>
                    <span class="text-sm">${c.name}</span>
                </div>
            `).join('');

            document.getElementById('colorTips').textContent =
                `穿搭建议：日常穿着可多选择${colors.map(c => c.name).join('、')}系的服饰，有助于提升运势`;
        }

        // 显示开运配饰
        function displayLuckyAccessories(favorable) {
            const container = document.getElementById('luckyAccessories');
            let accessories = [];

            favorable.slice(0, 2).forEach(wx => {
                if (WUXING_ACCESSORIES[wx]) {
                    accessories = accessories.concat(WUXING_ACCESSORIES[wx].slice(0, 2));
                }
            });

            container.innerHTML = accessories.map(a => `
                <div class="flex items-center gap-2 text-sm">
                    <span class="text-lg">${a.icon}</span>
                    <span class="text-white">${a.name}</span>
                    <span class="text-gray-400">- ${a.desc}</span>
                </div>
            `).join('');
        }

        // 显示运势评分
        function displayFortuneRatings(dayPillar, flowYear, favorable, unfavorable) {
            const dayWuxing = TIANGAN_WUXING[dayPillar.tiangan];
            const flowWuxing = TIANGAN_WUXING[flowYear.tiangan];

            // 基础分数
            let baseScore = 3;
            if (favorable.includes(flowWuxing)) baseScore = 4;
            if (unfavorable.includes(flowWuxing)) baseScore = 2;

            // 各项评分（基于五行关系微调）
            const scores = {
                career: Math.min(5, Math.max(1, baseScore + (Math.random() > 0.5 ? 1 : 0))),
                wealth: Math.min(5, Math.max(1, baseScore + (Math.random() > 0.5 ? 1 : -1))),
                love: Math.min(5, Math.max(1, baseScore + (Math.random() > 0.6 ? 1 : 0))),
                health: Math.min(5, Math.max(1, baseScore + (Math.random() > 0.4 ? 0 : -1)))
            };

            // 渲染星级
            const renderStars = (score) => '★'.repeat(score) + '☆'.repeat(5 - score);

            document.querySelector('#careerFortune .fortune-stars').textContent = renderStars(scores.career);
            document.querySelector('#wealthFortune .fortune-stars').textContent = renderStars(scores.wealth);
            document.querySelector('#loveFortune .fortune-stars').textContent = renderStars(scores.love);
            document.querySelector('#healthFortune .fortune-stars').textContent = renderStars(scores.health);
        }

        // 显示年运注意事项
        function displayYearTips(dayPillar, flowYear, favorable, unfavorable, isStrong) {
            const tips = [];
            const dayWuxing = TIANGAN_WUXING[dayPillar.tiangan];
            const flowWuxing = TIANGAN_WUXING[flowYear.tiangan];

            // 基于身强身弱的建议
            if (isStrong) {
                tips.push({
                    type: 'info',
                    text: '您的命格偏强，今年宜多付出、多奉献，通过帮助他人来化解过旺的能量'
                });
            } else {
                tips.push({
                    type: 'info',
                    text: '您的命格偏弱，今年宜多休息、养精蓄锐，避免过度消耗'
                });
            }

            // 基于流年五行的建议
            if (unfavorable.includes(flowWuxing)) {
                tips.push({
                    type: 'warning',
                    text: `流年${flowWuxing}气较重，建议佩戴${favorable[0]}属性的饰品化解`
                });
            }

            // 地支冲合建议
            const dayDizhi = dayPillar.dizhi;
            const flowDizhi = flowYear.dizhi;
            const chongMap = { '子': '午', '丑': '未', '寅': '申', '卯': '酉', '辰': '戌', '巳': '亥' };

            for (const [a, b] of Object.entries(chongMap)) {
                if ((dayDizhi === a && flowDizhi === b) || (dayDizhi === b && flowDizhi === a)) {
                    tips.push({
                        type: 'warning',
                        text: `今年日支与流年地支相冲（${dayDizhi}冲${flowDizhi}），注意情绪波动和人际关系`
                    });
                    break;
                }
            }

            // 通用建议
            tips.push({
                type: 'tip',
                text: '建议在立春后进行新年规划，因为命理学上以立春为一年之始'
            });

            tips.push({
                type: 'tip',
                text: `有利方位：${getDirectionByWuxing(favorable[0])}；避开方位：${getDirectionByWuxing(unfavorable[0])}`
            });

            const container = document.getElementById('yearTips');
            container.innerHTML = tips.map(t => `
                <div class="flex items-start gap-2 text-sm">
                    <span class="${t.type === 'warning' ? 'text-orange-400' : t.type === 'info' ? 'text-blue-400' : 'text-green-400'}">
                        ${t.type === 'warning' ? '⚠️' : t.type === 'info' ? 'ℹ️' : '💡'}
                    </span>
                    <span class="text-gray-300">${t.text}</span>
                </div>
            `).join('');
        }

        // 五行对应方位
        function getDirectionByWuxing(wuxing) {
            const directionMap = {
                '木': '东方',
                '火': '南方',
                '土': '中央',
                '金': '西方',
                '水': '北方'
            };
            return directionMap[wuxing] || '中央';
        }

        // 显示月份运势
        function displayMonthlyFortune(dayPillar, favorable, year) {
            const container = document.getElementById('monthlyFortune');
            const months = [];

            for (let m = 1; m <= 12; m++) {
                // 计算月份的五行属性（简化）
                const monthDizhi = DIZHI[(m + 1) % 12];
                const monthWuxing = DIZHI_WUXING[monthDizhi];

                let fortune = 'normal';
                if (favorable.includes(monthWuxing)) {
                    fortune = 'good';
                } else if (favorable.length > 0 && !favorable.includes(monthWuxing)) {
                    // 检查是否是忌神月份
                    fortune = Math.random() > 0.5 ? 'normal' : 'caution';
                }

                months.push({ month: m, fortune, dizhi: monthDizhi });
            }

            container.innerHTML = months.map(m => {
                const bgClass = m.fortune === 'good' ? 'bg-green-500/30 border-green-500/50' :
                               m.fortune === 'caution' ? 'bg-orange-500/30 border-orange-500/50' :
                               'bg-white/5 border-white/10';
                const icon = m.fortune === 'good' ? '↑' : m.fortune === 'caution' ? '!' : '-';

                return `
                    <div class="rounded-lg p-2 text-center border ${bgClass}">
                        <div class="text-sm font-semibold">${m.month}月</div>
                        <div class="text-xs text-gray-400">${m.dizhi}月</div>
                        <div class="text-xs mt-1 ${m.fortune === 'good' ? 'text-green-400' : m.fortune === 'caution' ? 'text-orange-400' : 'text-gray-400'}">${icon}</div>
                    </div>
                `;
            }).join('');
        }

        // ==================== 年运分析功能结束 ====================

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initSelects();

            // 加载footer
            const tpl = document.getElementById('site-footer');
            if (tpl && 'content' in tpl) {
                document.body.appendChild(tpl.content.cloneNode(true));
            }

            // 用 data-img 填充 <img src>
            document.querySelectorAll('.qr-wrapper').forEach(w => {
                const link = w.querySelector('.qr-link');
                const img = w.querySelector('.qr-img');
                if (link && img && link.dataset.img) {
                    img.src = link.dataset.img.trim();
                }
            });
        });
    </script>
