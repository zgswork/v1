<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>去除 Markdown 格式</title>
  <style>
    :root {
      --bg: #ffffff;
      --panel: #ffffff;
      --muted: #6b7280;
      --text: #0f172a;
      --accent: #2563eb; /* blue-600 */
      --accent-2: #059669; /* emerald-600 */
      --border: #e5e7eb;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Noto Sans, Ubuntu, Cantarell, Helvetica Neue, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .title {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
      margin-bottom: 12px;
    }

    .title h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0.2px;
      font-weight: 700;
    }

    .subtitle {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      background: #f8fafc;
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 12px;
    }

    .btn, label.btn {
      appearance: none;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform .05s ease, border-color .2s ease, background .2s ease, box-shadow .2s ease;
      user-select: none;
    }
    .btn:hover { border-color: #d1d5db; background: #f9fafb; }
    .btn:active { transform: translateY(1px); }

    .btn.primary { border-color: rgba(37, 99, 235, .4); background: rgba(37, 99, 235, .06); }
    .btn.primary:hover { background: rgba(37, 99, 235, .1); }
    .btn.info { border-color: rgba(5, 150, 105, .4); background: rgba(5, 150, 105, .06); }
    .btn.info:hover { background: rgba(5, 150, 105, .1); }

    input[type="file"] { display: none; }

    .switch {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
      margin-left: auto;
    }
    .switch input { display: none; }
    .switch .track {
      width: 44px; height: 24px; border-radius: 24px;
      background: #e5e7eb; border: 1px solid #e5e7eb;
      position: relative;
      transition: background .2s ease, border-color .2s ease;
    }
    .switch .thumb {
      width: 18px; height: 18px; border-radius: 50%;
      background: #94a3b8; position: absolute; top: 2px; left: 2px;
      transition: left .18s ease, background .2s ease;
    }
    .switch input:checked + .track { border-color: rgba(37, 99, 235, .5); background: rgba(37, 99, 235, .15); }
    .switch input:checked + .track .thumb { left: 24px; background: #2563eb; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 14px;
      flex: 1;
      min-height: 60vh;
      grid-auto-rows: 1fr;
      min-width: 0;
    }
    @media (max-width: 980px) {
      .grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 600px) { /* 手机端优化 */
      .toolbar { gap: 8px; border-radius: 10px; }
      .btn, label.btn { padding: 10px 12px; font-size: 14px; }
      .panel { padding: 8px; border-radius: 12px; }
      textarea { min-height: 200px; font-size: 14px; line-height: 1.7; }
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .panel h3 {
      margin: 2px 0 8px;
      font-size: 13px;
      color: var(--accent);
      font-weight: 600;
    }
    textarea {
      resize: vertical; /* 支持手动拉伸，移动端可滚动查看全部内容 */
      min-height: 360px;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      outline: none;
      background: #ffffff;
      color: #111827;
      font-size: 13px;
      line-height: 1.6;
      flex: 1;
      overflow: auto;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.03);
    }
    textarea::placeholder { color: #9ca3af; }

    .panel .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

    .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

    .status { font-size: 12px; color: #16a34a; margin-left: 6px; }
    .status.error { color: #dc2626; }
    .status.warn { color: #d97706; }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 6px 4px 0;
      margin-top: 6px; /* 紧挨“小提示”之下 */
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">
      <h1>去除 Markdown 格式</h1>
      <p class="subtitle">粘贴文本或上传文件，自动转换为纯文本</p>
      <p class="subtitle">© 小莎研AI</p>
    </div>

    <div class="toolbar">
      <label class="btn info" for="fileInput" title="支持 .txt / .md / .markdown / .html / .htm">
        上传文件
      </label>
      <input id="fileInput" type="file" accept=".txt,.md,.markdown,.html,.htm,.docx" />

      <button id="btnProcess" class="btn primary" title="立即处理">去除 Markdown</button>
      <button id="btnClear" class="btn" title="清空输入与输出">清空</button>
      <button id="btnCopy" class="btn" title="复制结果到剪贴板">复制结果</button>
      <button id="btnDownload" class="btn" title="下载结果为文本文件">下载结果</button>

      <span class="switch" title="开启后输入改变会自动处理">
        <span>自动处理</span>
        <input id="autoToggle" type="checkbox" checked />
        <span class="track"><span class="thumb"></span></span>
      </span>
      <span id="statusText" class="status"></span>
    </div>

    <div class="grid">
      <div class="panel">
        <h3>输入（支持粘贴文本或拖拽文件）</h3>
        <textarea id="inputText" placeholder="在此粘贴 Markdown 或任意文本；也可以点击上方“上传文件”选择 .txt / .md / .html（.docx 暂不直接解析）"></textarea>
        <div class="row hint">
          - 也可直接将文件拖拽到此文本框（同样支持 .txt / .md / .html / .htm）
        </div>
      </div>

      <div class="panel">
        <h3>输出（已去除 Markdown 格式）</h3>
        <textarea id="outputText" placeholder="在此也可编辑去除后的文本"></textarea>
      </div>
    </div>

    <p class="hint" style="margin-top: 10px; text-align: center;">
      © 小莎研AI  |  markdown格式去除工具
    </p>
  </div>

  <script>
    const inputTextArea = document.getElementById('inputText');
    const outputTextArea = document.getElementById('outputText');
    const fileInput = document.getElementById('fileInput');
    const btnProcess = document.getElementById('btnProcess');
    const btnClear = document.getElementById('btnClear');
    const btnCopy = document.getElementById('btnCopy');
    const btnDownload = document.getElementById('btnDownload');
    const autoToggle = document.getElementById('autoToggle');
    const statusText = document.getElementById('statusText');

    function setStatus(message, kind = 'ok') {
      statusText.textContent = message || '';
      statusText.className = 'status' + (kind === 'error' ? ' error' : kind === 'warn' ? ' warn' : '');
      if (message) {
        clearTimeout(setStatus._timer);
        setStatus._timer = setTimeout(() => setStatus(''), 2200);
      }
    }

    function stripMarkdown(markdownText) {
      if (!markdownText) return '';
      let text = String(markdownText);

      // Normalize newlines
      text = text.replace(/\r\n?/g, '\n');

      // YAML front matter（保留内容：仅去掉分隔线）
      text = text.replace(/^---\n/gm, '');
      text = text.replace(/^---\n/gm, '');

      // Fenced code blocks: keep inner content
      text = text.replace(/```[ \t]*[^\n]*\n([\s\S]*?)```/g, '$1');
      // Edge: inline double backticks
      text = text.replace(/``([\s\S]*?)``/g, '$1');
      // Inline code
      text = text.replace(/`([^`]+)`/g, '$1');

      // Images ![alt](url)
      text = text.replace(/!\[([^\]]*)\]\([^\)]*\)/g, '$1');

      // Links [text](url "title")
      text = text.replace(/\[([^\]]+)\]\((?:[^)\s]+)(?:\s+\"[^\"]*\")?\)/g, '$1');
      // Reference-style [text][id]
      text = text.replace(/\[([^\]]+)\]\[[^\]]*\]/g, '$1');
      // Link definitions
      text = text.replace(/^\s*\[[^\]]+\]:\s+\S+.*$/gm, '');
      // Autolinks <http...>
      text = text.replace(/<((?:https?:\/\/|mailto:)[^>]+)>/g, '$1');

      // Blockquotes
      text = text.replace(/^\s{0,3}>\s?/gm, '');

      // ATX headings
      text = text.replace(/^\s{0,3}#{1,6}\s+/gm, '');
      // Setext heading underline lines
      text = text.replace(/^[=\-]{2,}\s*$/gm, '');

      // Horizontal rules
      text = text.replace(/^\s{0,3}(?:\*\s?){3,}\s*$/gm, '');
      text = text.replace(/^\s{0,3}(?:-\s?){3,}\s*$/gm, '');
      text = text.replace(/^\s{0,3}(?:_\s?){3,}\s*$/gm, '');

      // Lists (unordered, tasks, ordered)
      text = text.replace(/^\s{0,3}(\*|\+|\-)\s+\[[ xX]\]\s+/gm, '');
      text = text.replace(/^\s{0,3}(\*|\+|\-)\s+/gm, '');
      // Keep numbering for ordered lists, also strip task checkbox if present
      text = text.replace(/^\s{0,3}(\d+)([\.)])\s+\[[ xX]\]\s+/gm, '$1$2 ');
      text = text.replace(/^\s{0,3}(\d+)([\.)])\s+/gm, '$1$2 ');

      // Tables: remove header separators and tidy pipes
      text = text.replace(/^\s*:?\-\-{3,}:?\s*(\|\s*:?\-\-{3,}:?\s*)+$/gm, '');
      text = text.replace(/^\s*\|/gm, '');
      text = text.replace(/\|\s*$/gm, '');
      text = text.replace(/\s*\|\s*/g, '  ');

      // Emphasis and strike
      text = text.replace(/(\*\*|__)(.*?)\1/g, '$2');
      text = text.replace(/(\*|_)(.*?)\1/g, '$2');
      text = text.replace(/~~(.*?)~~/g, '$1');

      // Footnotes
      text = text.replace(/\[\^[^\]]+\]/g, '');
      text = text.replace(/^\s*\[\^[^\]]+\]:.*$/gm, '');

      // Escaped chars
      text = text.replace(/\\([\\`*_{}\[\]()#+\-.!>|~])/g, '$1');

      // Strip HTML tags
      text = text.replace(/<\/?[^>]+>/g, '');

      // Trim trailing spaces on each line（保留行本身，不整体 trim 文本）
      text = text.replace(/[ \t]+\n/g, '\n');

      // 不折叠空行，保持原始空行数量

      // Decode basic HTML entities
      text = text
        .replace(/&nbsp;/g, ' ')
        .replace(/&amp;/g, '&')
        .replace(/&lt;/g, '<')
        .replace(/&gt;/g, '>')
        .replace(/&quot;/g, '"')
        .replace(/&#39;/g, "'");

      // 不整体 trim，保证首尾空白也保留
      return text;
    }

    function processNow() {
      const raw = inputTextArea.value;
      const plain = stripMarkdown(raw);
      outputTextArea.value = plain;
      autoGrow(outputTextArea);
      return plain;
    }

    let debounceTimer = null;
    function scheduleProcess() {
      if (!autoToggle.checked) return;
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        processNow();
      }, 180);
    }

    btnProcess.addEventListener('click', () => {
      processNow();
      setStatus('处理完成');
    });

    btnClear.addEventListener('click', () => {
      inputTextArea.value = '';
      outputTextArea.value = '';
      fileInput.value = '';
      setStatus('已清空');
    });

    btnCopy.addEventListener('click', async () => {
      try {
        const text = outputTextArea.value;
        await navigator.clipboard.writeText(text);
        setStatus('已复制到剪贴板');
      } catch (err) {
        setStatus('复制失败：' + (err && err.message ? err.message : '未知错误'), 'error');
      }
    });

    btnDownload.addEventListener('click', () => {
      const now = new Date();
      const stamp = now.toISOString().replace(/[:.]/g, '-');
      const blob = new Blob([outputTextArea.value || ''], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `plain-${stamp}.txt`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setStatus('已下载结果');
    });

    // 输入变化：自动处理（若开启）
    inputTextArea.addEventListener('input', () => { scheduleProcess(); });

    // Drag & drop
    inputTextArea.addEventListener('dragover', (e) => { e.preventDefault(); });
    inputTextArea.addEventListener('drop', async (e) => {
      e.preventDefault();
      const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (file) await handleFile(file);
    });

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      if (file) await handleFile(file);
      fileInput.value = '';
    });

    async function handleFile(file) {
      const lower = (file.name || '').toLowerCase();
      if (lower.endsWith('.docx')) {
        setStatus('暂不支持直接解析 .docx，请先另存为 .txt 再导入', 'warn');
        return;
      }
      try {
        const text = await file.text();
        inputTextArea.value = text;
        processNow();
        setStatus('文件已载入：' + file.name);
      } catch (err) {
        setStatus('读取失败：' + (err && err.message ? err.message : '未知错误'), 'error');
      }
    }

  </script>
</body>
</html>
