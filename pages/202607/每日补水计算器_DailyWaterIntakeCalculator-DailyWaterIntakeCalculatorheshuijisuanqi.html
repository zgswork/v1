<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日补水计算器 / Daily Water Intake Calculator</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
            color: #333;
            background-color: #f0f8ff;
        }
        h1 {
            color: #1e90ff;
            text-align: center;
            margin-bottom: 25px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        .calculator {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #4682b4;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #add8e6;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #1e90ff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 15px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #187bcd;
        }
        #result {
            margin-top: 25px;
            padding: 20px;
            background-color: #e6f2ff;
            border-radius: 8px;
            display: none;
            border-left: 5px solid #1e90ff;
        }
        .water-icon {
            color: #1e90ff;
            font-size: 24px;
            margin-right: 10px;
        }
        .note {
            font-size: 0.9em;
            color: #5f9ea0;
            margin-top: 30px;
            padding: 15px;
            background-color: #f0ffff;
            border-radius: 8px;
        }
        .highlight {
            color: #1e90ff;
            font-weight: bold;
        }
        .lang-switch {
            text-align: right;
            margin-bottom: 15px;
        }
        .lang-btn {
            display: inline-block;
            padding: 5px 10px;
            background: #e6f2ff;
            border: 1px solid #add8e6;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            width: auto;
            margin: 0 5px;
        }
        .lang-btn.active {
            background: #1e90ff;
            color: white;
        }
    </style>
</head>
<body>
    <div class="lang-switch">
        <button class="lang-btn active" id="zh-btn">中文</button>
        <button class="lang-btn" id="en-btn">English</button>
    </div>
    
    <h1 id="title">每日补水计算器</h1>
    
    <div class="calculator">
        <p id="description">根据您的体重和活动水平，计算每日建议饮水量。</p>
        
        <div class="form-group">
            <label for="weight" id="weight-label">您的体重 (kg):</label>
            <input type="number" id="weight" min="30" max="200" placeholder="请输入体重" required>
        </div>
        
        <div class="form-group">
            <label for="activity" id="activity-label">日常活动水平:</label>
            <select id="activity" required>
                <option value="">-- 请选择 --</option>
                <option value="1.2">久坐 (办公室工作，很少运动)</option>
                <option value="1.375">轻度活动 (每周1-3次轻度运动)</option>
                <option value="1.55">中度活动 (每周3-5次中等强度运动)</option>
                <option value="1.725">高度活动 (每天运动或体力劳动)</option>
                <option value="1.9">极高活动 (运动员或高强度体力劳动)</option>
            </select>
        </div>
        
        <button onclick="calculateWater()" id="calculate-btn">计算每日饮水量</button>
        
        <div id="result"></div>
    </div>
    
    <div class="note">
        <h3 id="tips-title">补水小贴士:</h3>
        <p><span class="water-icon">💧</span><span id="tip1">计算结果为基础饮水量，运动或高温时需额外补充</span></p>
        <p><span class="water-icon">💧</span><span id="tip2">尿液颜色是很好的水分指标，应接近淡黄色</span></p>
        <p><span class="water-icon">💧</span><span id="tip3">不要等到口渴才喝水，应定时少量多次补充</span></p>
        <p><span class="water-icon">💧</span><span id="tip4">水果和蔬菜也含有大量水分，可计入每日摄入量</span></p>
    </div>

    <script>
        // 语言数据
        const translations = {
            zh: {
                title: "每日补水计算器",
                description: "根据您的体重和活动水平，计算每日建议饮水量。",
                weightLabel: "您的体重 (kg):",
                weightPlaceholder: "请输入体重",
                activityLabel: "日常活动水平:",
                activityOptions: [
                    "-- 请选择 --",
                    "久坐 (办公室工作，很少运动)",
                    "轻度活动 (每周1-3次轻度运动)",
                    "中度活动 (每周3-5次中等强度运动)",
                    "高度活动 (每天运动或体力劳动)",
                    "极高活动 (运动员或高强度体力劳动)"
                ],
                calculateBtn: "计算每日饮水量",
                tipsTitle: "补水小贴士:",
                tips: [
                    "计算结果为基础饮水量，运动或高温时需额外补充",
                    "尿液颜色是很好的水分指标，应接近淡黄色",
                    "不要等到口渴才喝水，应定时少量多次补充",
                    "水果和蔬菜也含有大量水分，可计入每日摄入量"
                ],
                resultTitle: "您的每日饮水量建议",
                resultText1: "根据您的体重 ",
                resultText2: " 和活动水平：",
                resultAmount: "建议每日饮水量: ",
                cups: " 杯(250ml/杯)水",
                note1: "* 此建议量包含食物中的水分，实际饮水量可适当减少",
                note2: "* 运动、高温或特殊健康状况下需增加饮水量"
            },
            en: {
                title: "Daily Water Intake Calculator",
                description: "Calculate your recommended daily water intake based on weight and activity level.",
                weightLabel: "Your weight (kg):",
                weightPlaceholder: "Enter your weight",
                activityLabel: "Activity level:",
                activityOptions: [
                    "-- Please select --",
                    "Sedentary (office work, little exercise)",
                    "Lightly active (light exercise 1-3 times/week)",
                    "Moderately active (moderate exercise 3-5 times/week)",
                    "Very active (daily exercise or physical labor)",
                    "Extremely active (athlete or intense physical labor)"
                ],
                calculateBtn: "Calculate Water Intake",
                tipsTitle: "Hydration Tips:",
                tips: [
                    "This is the base amount, increase during exercise or hot weather",
                    "Urine color is a good indicator - it should be pale yellow",
                    "Don't wait until you're thirsty, drink regularly throughout the day",
                    "Fruits and vegetables also contain water and count toward your intake"
                ],
                resultTitle: "Your Daily Water Intake",
                resultText1: "Based on your weight of ",
                resultText2: " and activity level:",
                resultAmount: "Recommended daily water intake: ",
                cups: " cups (250ml/cup) of water",
                note1: "* This includes water from food, actual drinking amount can be slightly less",
                note2: "* Increase intake during exercise, hot weather or special health conditions"
            }
        };

        // 当前语言
        let currentLang = 'zh';

        // 切换语言
        function switchLanguage(lang) {
            currentLang = lang;
            
            // 更新按钮状态
            document.getElementById('zh-btn').classList.toggle('active', lang === 'zh');
            document.getElementById('en-btn').classList.toggle('active', lang === 'en');
            
            // 更新界面文本
            const t = translations[lang];
            document.getElementById('title').textContent = t.title;
            document.getElementById('description').textContent = t.description;
            document.getElementById('weight-label').textContent = t.weightLabel;
            document.getElementById('weight').placeholder = t.weightPlaceholder;
            document.getElementById('activity-label').textContent = t.activityLabel;
            document.getElementById('calculate-btn').textContent = t.calculateBtn;
            document.getElementById('tips-title').textContent = t.tipsTitle;
            
            // 更新活动水平选项
            const activitySelect = document.getElementById('activity');
            activitySelect.innerHTML = '';
            t.activityOptions.forEach((option, index) => {
                const opt = document.createElement('option');
                opt.value = index === 0 ? '' : (1.2 + (index-1)*0.175).toFixed(3);
                opt.textContent = option;
                activitySelect.appendChild(opt);
            });
            
            // 更新小贴士
            t.tips.forEach((tip, index) => {
                document.getElementById(`tip${index+1}`).textContent = tip;
            });
        }

        // 初始化语言按钮事件
        document.getElementById('zh-btn').addEventListener('click', () => switchLanguage('zh'));
        document.getElementById('en-btn').addEventListener('click', () => switchLanguage('en'));

        // 计算函数
        function calculateWater() {
            // 获取输入值
            const weight = parseFloat(document.getElementById('weight').value);
            const activityLevel = parseFloat(document.getElementById('activity').value);
            const t = translations[currentLang];
            
            // 验证输入
            if(isNaN(weight) || weight < 30 || weight > 200) {
                alert(currentLang === 'zh' ? "请输入30-200kg之间的有效体重" : "Please enter a valid weight between 30-200kg");
                return;
            }
            if(isNaN(activityLevel)) {
                alert(currentLang === 'zh' ? "请选择活动水平" : "Please select activity level");
                return;
            }
            
            // 计算基础水量 (30ml/kg)
            const baseWater = weight * 30;
            
            // 根据活动水平调整
            const adjustedWater = baseWater * activityLevel;
            
            // 转换为升
            const waterInLiters = adjustedWater / 1000;
            
            // 显示结果
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = "block";
            resultDiv.innerHTML = `
                <h3>${t.resultTitle}</h3>
                <p>${t.resultText1}<span class="highlight">${weight}kg</span>${t.resultText2}</p>
                <p style="font-size: 1.3em; margin: 20px 0;">${t.resultAmount}<span class="highlight">${waterInLiters.toFixed(1)} L</span></p>
                <p>${currentLang === 'zh' ? '约等于' : 'About'} <span class="highlight">${Math.round(adjustedWater/250)}</span>${t.cups}</p>
                <hr>
                <p style="font-size: 0.9em; color: #5f9ea0;">${t.note1}</p>
                <p style="font-size: 0.9em; color: #5f9ea0;">${t.note2}</p>
            `;
        }
    </script>
</body>
</html>
