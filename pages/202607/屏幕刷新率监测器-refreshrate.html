<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>屏幕刷新率监测器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #ffffff;
            overflow: hidden;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
        }

        .monitor-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 3rem 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            transition: all 0.3s ease;
        }

        .monitor-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #ffffff, #e0e7ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.8;
            margin-bottom: 2rem;
            font-weight: 400;
        }

        .refresh-rate {
            font-size: 4rem;
            font-weight: 800;
            margin: 1rem 0;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .unit {
            font-size: 1.5rem;
            font-weight: 400;
            opacity: 0.7;
            margin-left: 0.5rem;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid rgba(34, 197, 94, 0.3);
            padding: 0.5rem 1rem;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            margin-top: 1rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
            width: 100%;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
        }

        .info-label {
            font-size: 0.8rem;
            opacity: 0.7;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .footer {
            padding: 1.5rem;
            text-align: center;
            background: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .footer-text {
            font-size: 0.9rem;
            opacity: 0.7;
            font-weight: 400;
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2rem;
            }
            
            .refresh-rate {
                font-size: 3rem;
            }
            
            .container {
                padding: 1rem;
            }
            
            .monitor-card {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="monitor-card">
            <h1 class="title">刷新率监测器</h1>
            <p class="subtitle">实时监测您的屏幕刷新率</p>
            
            <div class="refresh-rate">
                <span id="refreshRate">--</span>
                <span class="unit">Hz</span>
            </div>
            
            <div class="status">
                <div class="status-dot"></div>
                <span>实时监测中</span>
            </div>
            
            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">平均刷新率</div>
                    <div class="info-value" id="avgRate">--</div>
                </div>
                <div class="info-item">
                    <div class="info-label">最高刷新率</div>
                    <div class="info-value" id="maxRate">--</div>
                </div>
                <div class="info-item">
                    <div class="info-label">监测时长</div>
                    <div class="info-value" id="duration">0s</div>
                </div>
            </div>
        </div>
    </div>
    
    <footer class="footer">
        <p class="footer-text">由嗯哼开发，微信 125273616。</p>
    </footer>

    <script>
        class RefreshRateMonitor {
            constructor() {
                this.refreshRates = [];
                this.startTime = Date.now();
                this.lastFrameTime = performance.now();
                this.frameCount = 0;
                
                this.refreshRateElement = document.getElementById('refreshRate');
                this.avgRateElement = document.getElementById('avgRate');
                this.maxRateElement = document.getElementById('maxRate');
                this.durationElement = document.getElementById('duration');
                
                this.startMonitoring();
                this.updateDuration();
            }
            
            startMonitoring() {
                const measureRefreshRate = (currentTime) => {
                    const deltaTime = currentTime - this.lastFrameTime;
                    
                    if (deltaTime > 0) {
                        const currentRefreshRate = Math.round(1000 / deltaTime);
                        
                        // 过滤异常值（通常刷新率在30-240Hz之间）
                        if (currentRefreshRate >= 30 && currentRefreshRate <= 240) {
                            this.refreshRates.push(currentRefreshRate);
                            
                            // 保持最近100个样本
                            if (this.refreshRates.length > 100) {
                                this.refreshRates.shift();
                            }
                            
                            this.updateDisplay(currentRefreshRate);
                        }
                    }
                    
                    this.lastFrameTime = currentTime;
                    this.frameCount++;
                    
                    requestAnimationFrame(measureRefreshRate);
                };
                
                requestAnimationFrame(measureRefreshRate);
            }
            
            updateDisplay(currentRate) {
                // 更新当前刷新率
                this.refreshRateElement.textContent = currentRate;
                
                // 计算平均刷新率
                if (this.refreshRates.length > 0) {
                    const avgRate = Math.round(
                        this.refreshRates.reduce((sum, rate) => sum + rate, 0) / this.refreshRates.length
                    );
                    this.avgRateElement.textContent = avgRate + ' Hz';
                }
                
                // 计算最高刷新率
                if (this.refreshRates.length > 0) {
                    const maxRate = Math.max(...this.refreshRates);
                    this.maxRateElement.textContent = maxRate + ' Hz';
                }
            }
            
            updateDuration() {
                const updateTime = () => {
                    const elapsed = Math.floor((Date.now() - this.startTime) / 1000);
                    
                    if (elapsed < 60) {
                        this.durationElement.textContent = elapsed + 's';
                    } else if (elapsed < 3600) {
                        const minutes = Math.floor(elapsed / 60);
                        const seconds = elapsed % 60;
                        this.durationElement.textContent = `${minutes}m ${seconds}s`;
                    } else {
                        const hours = Math.floor(elapsed / 3600);
                        const minutes = Math.floor((elapsed % 3600) / 60);
                        this.durationElement.textContent = `${hours}h ${minutes}m`;
                    }
                    
                    setTimeout(updateTime, 1000);
                };
                
                updateTime();
            }
        }
        
        // 页面加载完成后开始监测
        document.addEventListener('DOMContentLoaded', () => {
            new RefreshRateMonitor();
        });
        

    </script>
</body>
</html>
