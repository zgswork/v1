<!doctype html>
<html lang="zh-CN">
<head>
  <!-- 工具名称: 简易图片编辑器 -->
  <!-- 工具描述: 轻量级离线图片编辑与导出，支持裁剪、旋转、缩放、滤镜、文字与拼接 -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>简易图片编辑器</title>
  <meta name="description" content="轻量级离线图片编辑与导出，支持裁剪、旋转、缩放、滤镜、文字与拼接" />
  <style>
    :root{--bg:#f8f9fa;--accent:#0078d4;--radius:12px;--shadow:0 1px 2px rgba(0,0,0,.06)}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,"Noto Sans",sans-serif;color:#111}
    header{position:sticky;top:0;background:rgba(255,255,255,.8);backdrop-filter:blur(10px);border-bottom:1px solid #e5e7eb}
    .wrap{max-width:1200px;margin:0 auto;padding:12px 16px}
    .title{display:flex;align-items:center;gap:8px;font-weight:600}
    .title-badge{color:#fff;background:var(--accent);padding:2px 8px;border-radius:999px;font-size:12px}
    main{display:grid;grid-template-columns:1fr;gap:12px;padding:12px}
    @media(min-width:768px){main{grid-template-columns:1fr 3fr}}
    aside{background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-radius:var(--radius);box-shadow:0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -1px rgba(0,0,0,.06);padding:16px;max-height:calc(100vh - 120px);overflow-y:auto}
    .group{margin-bottom:20px;padding:16px;background:rgba(248,250,252,.8);border:1px solid #f1f5f9;border-radius:10px;transition:all 0.2s ease}
    .group:hover{background:rgba(248,250,252,1);border-color:#e2e8f0;transform:translateY(-1px);box-shadow:0 2px 4px rgba(0,0,0,.05)}
    .group h3{margin:0 0 12px 0;font-size:15px;font-weight:600;color:#1e293b;display:flex;align-items:center;gap:8px}
    .group h3::before{content:'';width:4px;height:16px;background:linear-gradient(135deg, var(--accent), #0ea5e9);border-radius:2px}
    .group.primary{background:linear-gradient(135deg, rgba(0,120,212,.08), rgba(14,165,233,.05));border-color:rgba(0,120,212,.2)}
    .group.primary h3{color:var(--accent)}
    .group.primary h3::before{background:linear-gradient(135deg, var(--accent), #0ea5e9)}
    section.preview{background:#fff;border:1px solid #e5e7eb;border-radius:var(--radius);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;position:relative;min-height:420px;transition:all 0.2s ease-in-out}
    section.preview.drag-over{background:rgba(0,120,212,0.1);border-color:#0078d4;transform:scale(1.02)}
    canvas{max-width:100%;max-height:100%;border-radius:8px}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .btn{appearance:none;border:1px solid #e5e7eb;background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer;transition:all .2s ease-in-out;box-shadow:0 1px 2px rgba(0,0,0,.05);font-weight:500;font-size:13px}
    .btn:hover{background:#f8fafc;border-color:#cbd5e1;transform:translateY(-1px);box-shadow:0 2px 4px rgba(0,0,0,.1)}
    .btn:active{transform:translateY(0);box-shadow:0 1px 2px rgba(0,0,0,.05)}
    .btn.primary{background:linear-gradient(135deg, var(--accent), #0ea5e9);border-color:transparent;color:#fff;font-weight:600}
    .btn.primary:hover{background:linear-gradient(135deg, #006fc5, #0284c7);transform:translateY(-1px);box-shadow:0 4px 8px rgba(0,120,212,.3)}
    .input,.select{width:100%;padding:10px 12px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;transition:all 0.2s ease;font-size:13px}
    .input:focus,.select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,120,212,.1)}
    .range{width:100%;accent-color:var(--accent)}
    .toolbar{display:flex;flex-direction:column;gap:16px}
    .small{font-size:12px;color:#64748b;font-weight:500}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;justify-content:center}
     .seg button{font-size:13px;padding:10px 8px;min-width:110px;white-space:nowrap;border-radius:8px;font-weight:500;transition:all 0.2s ease;background:rgba(255,255,255,0.8);border:1.5px solid #e2e8f0;flex:0 0 auto}
     .seg button:hover{background:rgba(59,130,246,0.1);border-color:#3b82f6;transform:translateY(-1px);box-shadow:0 2px 4px rgba(59,130,246,0.2)}
     .seg button.active{background:linear-gradient(135deg, #3b82f6, #1d4ed8);color:white;border-color:#1d4ed8;box-shadow:0 4px 8px rgba(59,130,246,0.3)}
    .crop-section{display:flex;flex-direction:column;gap:12px}
     .crop-label{margin-bottom:4px;font-weight:600;color:#374151;display:block}
     .crop-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
      .crop-actions button{flex:1;min-width:110px;font-weight:600;padding:12px 16px;border-radius:8px;transition:all 0.2s ease}
      .crop-actions button.primary{background:linear-gradient(135deg, #10b981, #059669);border-color:#059669;box-shadow:0 4px 8px rgba(16,185,129,0.3)}
      .crop-actions button.primary:hover{background:linear-gradient(135deg, #059669, #047857);transform:translateY(-1px);box-shadow:0 6px 12px rgba(16,185,129,0.4)}
      .crop-actions button:not(.primary){background:rgba(255,255,255,0.9);border:1.5px solid #e5e7eb;color:#374151}
      .crop-actions button:not(.primary):hover{background:rgba(239,68,68,0.1);border-color:#ef4444;color:#dc2626;transform:translateY(-1px)}
      @media(max-width:320px){.crop-actions{flex-direction:column}.crop-actions button{min-width:auto}}
    label{display:block;margin-bottom:4px;font-weight:500;color:#475569}
    .hint{font-size:12px;color:#6b7280}
    .toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(17,24,39,.85);color:#fff;padding:10px 14px;border-radius:12px;backdrop-filter:blur(8px);box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s}
    .toast.show{opacity:1}
    footer{background:#fff}
    .file-upload-container{margin:8px 0}
    .file-upload-label{display:flex;align-items:center;gap:12px;padding:16px;border:2px dashed #cbd5e1;border-radius:12px;background:linear-gradient(135deg, rgba(248,250,252,.9), rgba(241,245,249,.7));cursor:pointer;transition:all 0.3s ease;position:relative;overflow:hidden}
    .file-upload-label::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg, transparent, rgba(0,120,212,.1), transparent);transition:left 0.6s ease;z-index:1}
    .file-upload-label:hover{border-color:var(--accent);background:linear-gradient(135deg, rgba(0,120,212,.05), rgba(14,165,233,.03));transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,120,212,.15)}
    .file-upload-label:hover::before{left:100%}
    .file-upload-label:active{transform:translateY(0);box-shadow:0 2px 6px rgba(0,120,212,.1)}
    .file-upload-icon{font-size:24px;opacity:0.8;transition:all 0.3s ease;z-index:2;position:relative}
    .file-upload-label:hover .file-upload-icon{transform:scale(1.1);opacity:1}
    .file-upload-text{display:flex;flex-direction:column;gap:2px;z-index:2;position:relative}
    .file-upload-main{font-weight:600;color:#1e293b;font-size:14px}
    .file-upload-hint{font-size:12px;color:#64748b;font-weight:400}
    footer .footwrap{max-width:72rem;margin:0 auto;padding:16px;text-align:center;font-size:12px;color:#6b7280}
    .crop-overlay{position:absolute;inset:8px;pointer-events:none}
    .nine-grid-preview{margin-top:12px;padding:12px;background:rgba(248,250,252,.5);border-radius:8px;border:1px solid #e2e8f0}
    .nine-grid-container{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;max-width:180px;margin:0 auto}
    .nine-grid-item{aspect-ratio:1;background:#fff;border:1px solid #cbd5e1;border-radius:4px;position:relative;overflow:hidden;cursor:pointer;transition:all 0.2s ease;background-size:cover;background-position:center}
    .nine-grid-item:hover{transform:scale(1.05);border-color:var(--accent);box-shadow:0 2px 8px rgba(0,120,212,.2)}
    .grid-number{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.7);color:#fff;font-size:10px;font-weight:600;padding:2px 4px;border-radius:3px;line-height:1}
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="title" role="heading" aria-level="1" aria-label="简易图片编辑器">
        <span>简易图片编辑器</span><span class="title-badge">离线·轻量</span>
      </div>
      <div class="hint">支持：加载/裁剪/缩放/旋转/亮度对比度/滤镜/文本/拼接/撤销重做/导出</div>
    </div>
  </header>
  <main class="wrap">
    <aside aria-label="操作面板">
      <div class="toolbar" id="controls">
        <div class="group primary" aria-label="图片加载">
          <h3>📁 图片加载</h3>
          <div class="file-upload-container">
            <label for="fileInput" class="file-upload-label">
              <div class="file-upload-icon">📁</div>
              <div class="file-upload-text">
                <span class="file-upload-main">点击选择图片</span>
                <span class="file-upload-hint">支持 JPG、PNG、WEBP 格式</span>
              </div>
            </label>
            <input id="fileInput" type="file" accept="image/*" aria-label="选择图片文件" style="display: none;" />
          </div>
          <div class="small" id="imgInfo">未加载图片</div>
        </div>

        <div class="group primary" aria-label="裁剪">
          <h3>✂️ 裁剪</h3>
          <div class="crop-section">
            <label class="small crop-label">选择裁剪比例：</label>
            <div class="seg" role="group" aria-label="裁剪比例预设">
              <button class="btn" data-aspect="free" title="自由裁剪">自由</button>
              <button class="btn" data-aspect="1:1" title="正方形 1:1">1:1</button>
              <button class="btn" data-aspect="3:4" title="竖版 3:4">3:4</button>
              <button class="btn" data-aspect="4:3" title="横版 4:3">4:3</button>
              <button class="btn" data-aspect="9:16" title="手机竖屏 9:16">9:16</button>
              <button class="btn" data-aspect="16:9" title="宽屏 16:9">16:9</button>
            </div>
            <div class="crop-actions">
              <button id="btnApplyCrop" class="btn primary" aria-label="应用裁剪">✓ 应用裁剪</button>
              <button id="btnCancelCrop" class="btn" aria-label="取消裁剪">✕ 取消</button>
            </div>
          </div>
        </div>

        <div class="group" aria-label="九宫格裁切">
          <h3>🔲 九宫格裁切</h3>
          <div class="crop-section">
            <label class="small crop-label">将1:1图片自动裁切成9份：</label>
            <div class="crop-actions">
              <button id="btnNineGrid" class="btn primary" aria-label="生成九宫格">✂️ 生成九宫格</button>
              <button id="btnExportNineGrid" class="btn" aria-label="导出九宫格" style="display:none">📦 导出全部 (ZIP/分别)</button>
            </div>
            <div id="nineGridPreview" class="nine-grid-preview" style="display:none">
              <div class="nine-grid-container">
                <div class="nine-grid-item" data-index="1"><span class="grid-number">1</span></div>
                <div class="nine-grid-item" data-index="2"><span class="grid-number">2</span></div>
                <div class="nine-grid-item" data-index="3"><span class="grid-number">3</span></div>
                <div class="nine-grid-item" data-index="4"><span class="grid-number">4</span></div>
                <div class="nine-grid-item" data-index="5"><span class="grid-number">5</span></div>
                <div class="nine-grid-item" data-index="6"><span class="grid-number">6</span></div>
                <div class="nine-grid-item" data-index="7"><span class="grid-number">7</span></div>
                <div class="nine-grid-item" data-index="8"><span class="grid-number">8</span></div>
                <div class="nine-grid-item" data-index="9"><span class="grid-number">9</span></div>
              </div>
            </div>
          </div>
        </div>

        <div class="group" aria-label="缩放与尺寸">
          <h3>🔍 缩放与尺寸</h3>
          <label class="crop-label" for="zoomRange">预览缩放：<span id="zoomLabel">100%</span></label>
          <input id="zoomRange" class="range" type="range" min="10" max="200" step="1" value="100" aria-label="预览缩放" />
          <div class="two-col" style="margin-top:8px">
            <input id="widthInput" class="input" type="number" min="1" placeholder="宽(px)" aria-label="设置宽度" />
            <input id="heightInput" class="input" type="number" min="1" placeholder="高(px)" aria-label="设置高度" />
          </div>
          <div class="crop-actions" style="margin-top:6px;align-items:center">
            <label style="display:flex;gap:6px;align-items:center;flex:1"><input id="lockRatio" type="checkbox" checked /> <span class="crop-label" style="margin-bottom:0">锁定比例</span></label>
            <button id="btnApplySize" class="btn" aria-label="应用尺寸">应用尺寸</button>
          </div>
        </div>

        <div class="group" aria-label="旋转">
          <h3>🔄 旋转</h3>
          <div class="crop-actions">
            <button id="btnRotateCCW" class="btn" aria-label="逆时针90°">↶ -90°</button>
            <button id="btnRotateCW" class="btn" aria-label="顺时针90°">↷ +90°</button>
          </div>
        </div>

        <div class="group" aria-label="亮度对比度与滤镜">
          <h3>🌟 亮度 / 对比度</h3>
          <label class="crop-label" for="brightnessRange">亮度：<span id="brightnessLabel">0</span></label>
          <input id="brightnessRange" class="range" type="range" min="-100" max="100" step="1" value="0" aria-label="调整亮度" />
          <label class="crop-label" for="contrastRange">对比度：<span id="contrastLabel">0</span></label>
          <input id="contrastRange" class="range" type="range" min="-100" max="100" step="1" value="0" aria-label="调整对比度" />
          <h3 style="margin-top:8px">🎨 滤镜</h3>
          <select id="filterSelect" class="select" aria-label="选择滤镜">
            <option value="none">无</option>
            <option value="bw">黑白</option>
            <option value="vintage">复古</option>
            <option value="cool">冷调</option>
            <option value="warm">暖调</option>
            <option value="high-contrast">高对比度</option>
          </select>
        </div>

        <div class="group" aria-label="文本添加">
          <h3>📝 文本添加</h3>
          <input id="textInput" class="input" type="text" placeholder="输入文本" aria-label="输入文本内容" />
          <div class="two-col" style="margin-top:6px">
            <select id="fontFamily" class="select" aria-label="字体选择">
              <option value="Arial">Arial</option>
              <option value="Georgia">Georgia</option>
              <option value="Courier New">Courier</option>
            </select>
            <input id="fontSize" class="input" type="number" min="12" max="72" value="24" aria-label="字体大小" />
          </div>
          <div class="crop-actions" style="margin-top:6px">
            <input id="fontColor" class="input" type="color" value="#111111" aria-label="文字颜色" style="flex:0 0 60px" />
            <button id="btnAddText" class="btn" aria-label="添加文本">添加文本</button>
            <button id="btnDeleteText" class="btn" aria-label="删除选中文本">删除选中</button>
          </div>
        </div>

        <div class="group" aria-label="拼接">
          <h3>🧩 图片拼接</h3>
          <div class="crop-section">
            <input id="stitchInput" class="input" type="file" accept="image/*" multiple aria-label="选择2-4张图片用于拼接" />
          </div>
          <div class="crop-actions" style="margin-top:6px">
            <select id="stitchMode" class="select" aria-label="拼接模式" style="flex:1">
              <option value="horizontal">横向拼接</option>
              <option value="vertical">纵向拼接</option>
            </select>
            <button id="btnStitch" class="btn" aria-label="开始拼接">开始拼接</button>
          </div>
        </div>

        <div class="group" aria-label="撤销与导出">
          <h3>💾 撤销 / 重做 / 导出</h3>
          <div class="crop-actions">
            <button id="btnUndo" class="btn" aria-label="撤销 (Ctrl+Z)">撤销</button>
            <button id="btnRedo" class="btn" aria-label="重做 (Ctrl+Y)">重做</button>
          </div>
          <div class="two-col" style="margin-top:6px">
            <select id="exportFormat" class="select" aria-label="导出格式">
              <option value="image/png">PNG</option>
              <option value="image/jpeg">JPEG</option>
              <option value="image/webp">WEBP</option>
            </select>
            <input id="qualityRange" class="input" type="range" min="0.1" max="1" step="0.1" value="1" aria-label="压缩质量" />
          </div>
          <div class="crop-actions" style="margin-top:6px">
            <button id="btnExportOriginal" class="btn" aria-label="原始画质导出">原始画质保存</button>
            <button id="btnExport" class="btn primary" aria-label="导出图片">导出</button>
          </div>
        </div>
      </div>
    </aside>

    <section class="preview" aria-label="预览画布">
      <canvas id="view" width="960" height="720" aria-label="图像预览画布"></canvas>
      <div class="crop-overlay" id="cropOverlay" aria-hidden="true"></div>
    </section>
  </main>

  <footer class="border-t border-gray-200 bg-white">
    <div class="footwrap">
      LGO赵哥 | <a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="abd1ccdfc4db9e999a9eebccc6cac2c785c8c4c6">[email&#160;protected]</a> | WX:LGOzhaoge | 更多点击➡️ <a href="https://deepseek.idoxu.com/LGOzhaoge" target="_blank" rel="noopener noreferrer" aria-label="打开 LGO赵哥的主页" title="打开 LGO赵哥的主页" class="underline decoration-dotted align-middle">🔗</a>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>

      const img = await loadImage(url);
      const {width,height} = img;
      state.off.width = width; state.off.height = height;
      state.offCtx.drawImage(img,0,0,width,height);
      state.originalRatio = width/height;
      state.dirty = true;
      updateSizeInputs();
      updateInfo();
    };

    const undo = async()=>{
      if(state.undoStack.length===0) return;
      const current = state.off.toDataURL();
      const prev = state.undoStack.pop();
      state.redoStack.push(current);
      await restoreFromDataURL(prev);
      setUndoRedoState();
      notify('已撤销');
    };

    const redo = async()=>{
      if(state.redoStack.length===0) return;
      const current = state.off.toDataURL();
      const next = state.redoStack.pop();
      state.undoStack.push(current);
      await restoreFromDataURL(next);
      setUndoRedoState();
      notify('已重做');
    };

    const loadImage = (src)=> new Promise((resolve,reject)=>{
      const img = new Image();
      img.onload = ()=>resolve(img);
      img.onerror = reject;
      img.src = src;
    });

    const fitRectIn = (srcW, srcH, maxW, maxH)=>{
      const r = Math.min(maxW/srcW, maxH/srcH);
      return { w: Math.round(srcW*r), h: Math.round(srcH*r), scale: r };
    };

    const getFilterString = ()=>{
      const b = 100 + Number(state.preview.brightness);
      const c = 100 + Number(state.preview.contrast);
      const preset = state.preview.filter;
      const presetStr = (()=>{
        switch(preset){
          case 'bw': return 'grayscale(100%)';
          case 'vintage': return 'sepia(60%) saturate(120%) contrast(105%)';
          case 'cool': return 'hue-rotate(180deg) saturate(110%) brightness(105%)';
          case 'warm': return 'hue-rotate(330deg) saturate(115%) brightness(105%)';
          case 'high-contrast': return 'contrast(130%) brightness(100%)';
          default: return '';
        }
      })();
      const parts = [`brightness(${b}%)`,`contrast(${c}%)`];
      if(presetStr) parts.push(presetStr);
      return parts.join(' ');
    };

    const updateInfo = ()=>{
      if(!state.loaded){ imgInfo.textContent = '未加载图片'; return; }
      imgInfo.textContent = `${state.off.width} × ${state.off.height}`;
    };

    const updateSizeInputs = ()=>{
      widthInput.value = state.off.width;
      heightInput.value = state.off.height;
    };

    const clearCrop = ()=>{
      state.crop.active = false;
      state.crop.start = null;
      state.crop.rect = null;
      overlayEl.setAttribute('aria-hidden','true');
      state.dirty = true;
    };

    const applyCropRectToOffscreen = ()=>{
      if(!state.crop.rect) return;
      const {x,y,w,h} = state.crop.rect;
      const temp = document.createElement('canvas');
      temp.width = w; temp.height = h;
      const tctx = temp.getContext('2d');
      tctx.drawImage(state.off, x, y, w, h, 0, 0, w, h);
      state.off.width = w; state.off.height = h;
      state.offCtx.clearRect(0,0,w,h);
      state.offCtx.drawImage(temp,0,0);
      state.originalRatio = w/h;
      state.dirty = true;
      updateSizeInputs();
      updateInfo();
      clearCrop();
    };

    /** 绘制 **/
    const draw = ()=>{
      if(!state.dirty) return;
      state.dirty = false;
      ctx.save();
      ctx.clearRect(0,0,view.width,view.height);
      if(!state.loaded){
        // 占位文案
        ctx.fillStyle = '#9ca3af';
        ctx.font = '14px system-ui, -apple-system, Segoe UI, Roboto, Arial';
        ctx.textAlign = 'center';
        ctx.fillText('请在左侧加载一张图片', view.width/2, view.height/2);
        ctx.restore();
        return;
      }
      // 计算适配尺寸（预览缩放）
      const padding = 16;
      const areaW = view.width - padding*2;
      const areaH = view.height - padding*2;
      const fit = fitRectIn(state.off.width, state.off.height, areaW, areaH);
      const zoom = Number(state.preview.zoom);
      const drawW = Math.round(fit.w * zoom);
      const drawH = Math.round(fit.h * zoom);
      const dx = Math.round((view.width - drawW)/2);
      const dy = Math.round((view.height - drawH)/2);

      ctx.filter = getFilterString();
      ctx.drawImage(state.off, dx, dy, drawW, drawH);
      ctx.filter = 'none';

      // 文本叠加（预览）
      for(const t of state.textOverlays){
        ctx.font = `${t.fontSize}px ${t.fontFamily}`;
        ctx.fillStyle = t.color;
        ctx.textBaseline = 'top';
        // t.x, t.y 在 offscreen 坐标；换算到预览坐标
        const scaleX = drawW / state.off.width;
        const scaleY = drawH / state.off.height;
        const vx = dx + t.x * scaleX;
        const vy = dy + t.y * scaleY;
        ctx.fillText(t.text, vx, vy);
        if(t.selected){
          const w = ctx.measureText(t.text).width;
          ctx.strokeStyle = '#0078d4';
          ctx.setLineDash([4,4]);
          ctx.strokeRect(vx-2, vy-2, w+4, t.fontSize+4);
          ctx.setLineDash([]);
        }
      }

      // 裁剪可视化
      if(state.crop.active && state.crop.rect){
        const {x,y,w,h} = state.crop.rect;
        // 转换为预览坐标
        const scaleX = drawW / state.off.width;
        const scaleY = drawH / state.off.height;
        const rx = dx + x*scaleX;
        const ry = dy + y*scaleY;
        const rw = w*scaleX;
        const rh = h*scaleY;
        
        // 绘制外部遮罩，保留裁剪区域显示原图
        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        
        // 创建遮罩路径（整个画布减去裁剪区域）
        ctx.beginPath();
        ctx.rect(0, 0, view.width, view.height);
        ctx.rect(rx + rw, ry, -rw, rh); // 反向绘制裁剪区域，形成镂空
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fill('evenodd'); // 使用 evenodd 规则创建镂空效果
        
        ctx.restore();
        
        // 边框与九宫格
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 4]); // 设置虚线样式
        ctx.strokeRect(rx+0.5, ry+0.5, rw-1, rh-1);
        
        // 九宫格线条（更细的虚线）
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = 'rgba(255,255,255,0.8)'; // 半透明白色
        // 竖线
        ctx.beginPath();
        ctx.moveTo(rx+rw/3, ry); ctx.lineTo(rx+rw/3, ry+rh);
        ctx.moveTo(rx+rw*2/3, ry); ctx.lineTo(rx+rw*2/3, ry+rh);
        // 横线
        ctx.moveTo(rx, ry+rh/3); ctx.lineTo(rx+rw, ry+rh/3);
        ctx.moveTo(rx, ry+rh*2/3); ctx.lineTo(rx+rw, ry+rh*2/3);
        ctx.stroke();
        ctx.setLineDash([]);
        
        // 绘制四个角的缩放控制点
        const handleSize = 12;
        const handleOffset = handleSize / 2;
        ctx.fillStyle = '#fff';
        ctx.strokeStyle = '#0078d4';
        ctx.lineWidth = 2;
        
        // 左上角
        ctx.fillRect(rx - handleOffset, ry - handleOffset, handleSize, handleSize);
        ctx.strokeRect(rx - handleOffset, ry - handleOffset, handleSize, handleSize);
        
        // 右上角
        ctx.fillRect(rx + rw - handleOffset, ry - handleOffset, handleSize, handleSize);
        ctx.strokeRect(rx + rw - handleOffset, ry - handleOffset, handleSize, handleSize);
        
        // 左下角
        ctx.fillRect(rx - handleOffset, ry + rh - handleOffset, handleSize, handleSize);
        ctx.strokeRect(rx - handleOffset, ry + rh - handleOffset, handleSize, handleSize);
        
        // 右下角
        ctx.fillRect(rx + rw - handleOffset, ry + rh - handleOffset, handleSize, handleSize);
        ctx.strokeRect(rx + rw - handleOffset, ry + rh - handleOffset, handleSize, handleSize);
      }
      ctx.restore();
    };

    const loop = ()=>{ requestAnimationFrame(loop); draw(); };

    /** 事件：加载图片 **/
    fileInput.addEventListener('change', async(e)=>{
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      const url = URL.createObjectURL(file);
      const img = await loadImage(url);
      URL.revokeObjectURL(url);
      state.off.width = img.width;
      state.off.height = img.height;
      state.offCtx.clearRect(0,0,img.width,img.height);
      state.offCtx.drawImage(img,0,0);
      state.originalRatio = img.width/img.height;
      state.loaded = true;
      state.preview.zoom = 1; zoomRange.value = 100; zoomLabel.textContent = '100%';
      state.preview.brightness = 0; brightnessRange.value = 0; brightnessLabel.textContent = '0';
      state.preview.contrast = 0; contrastRange.value = 0; contrastLabel.textContent = '0';
      filterSelect.value = 'none'; state.preview.filter='none';
      state.textOverlays = [];
      clearCrop();
      updateSizeInputs();
      updateInfo();
      pushHistory();
      notify('图片加载成功');
      state.dirty = true;
    });

    /** 缩放 **/
    zoomRange.addEventListener('input', (e)=>{
      const v = Number(e.target.value)/100;
      state.preview.zoom = v;
      zoomLabel.textContent = `${Math.round(v*100)}%`;
      state.dirty = true;
    });

    /** 尺寸应用 **/
    lockRatio.addEventListener('change', ()=> state.aspectLocked = lockRatio.checked);

    widthInput.addEventListener('input', ()=>{
      if(!state.loaded) return;
      const w = Number(widthInput.value);
      if(state.aspectLocked){
        const h = Math.round(w / state.originalRatio);
        heightInput.value = Math.max(1,h);
      }
    });
    heightInput.addEventListener('input', ()=>{
      if(!state.loaded) return;
      const h = Number(heightInput.value);
      if(state.aspectLocked){
        const w = Math.round(h * state.originalRatio);
        widthInput.value = Math.max(1,w);
      }
    });

    btnApplySize.addEventListener('click', ()=>{
      if(!state.loaded) return notify('请先加载图片');
      const newW = Math.max(1, Number(widthInput.value||0));
      const newH = Math.max(1, Number(heightInput.value||0));
      const temp = document.createElement('canvas');
      temp.width = newW; temp.height = newH;
      const tctx = temp.getContext('2d');
      tctx.drawImage(state.off, 0,0,state.off.width,state.off.height, 0,0,newW,newH);
      state.off.width = newW; state.off.height = newH;
      state.offCtx.clearRect(0,0,newW,newH);
      state.offCtx.drawImage(temp,0,0);
      state.originalRatio = newW/newH;
      updateSizeInputs();
      updateInfo();
      pushHistory();
      state.dirty = true;
      notify('已应用新尺寸');
    });

    /** 旋转 **/
    const rotate = (direction)=>{
      if(!state.loaded) return notify('请先加载图片');
      const angle = direction==='cw'? 90 : -90;
      const rad = angle * Math.PI/180;
      const srcW = state.off.width; const srcH = state.off.height;
      const dstW = srcH; const dstH = srcW;
      const temp = document.createElement('canvas');
      temp.width = dstW; temp.height = dstH;
      const tctx = temp.getContext('2d');
      tctx.translate(dstW/2, dstH/2);
      tctx.rotate(rad);
      tctx.drawImage(state.off, -srcW/2, -srcH/2);
      state.off.width = dstW; state.off.height = dstH;
      state.offCtx.clearRect(0,0,dstW,dstH);
      state.offCtx.drawImage(temp,0,0);
      state.originalRatio = dstW/dstH;
      updateSizeInputs();
      updateInfo();
      pushHistory();
      state.dirty = true;
      notify(angle>0? '已顺时针旋转90°' : '已逆时针旋转90°');
    };

    btnRotateCW.addEventListener('click', ()=>rotate('cw'));
    btnRotateCCW.addEventListener('click', ()=>rotate('ccw'));

    /** 亮度/对比度/滤镜 **/
    brightnessRange.addEventListener('input', (e)=>{
      state.preview.brightness = Number(e.target.value);
      brightnessLabel.textContent = String(e.target.value);
      state.dirty = true;
    });
    contrastRange.addEventListener('input', (e)=>{
      state.preview.contrast = Number(e.target.value);
      contrastLabel.textContent = String(e.target.value);
      state.dirty = true;
    });
    filterSelect.addEventListener('change', ()=>{
      state.preview.filter = filterSelect.value;
      state.dirty = true;
    });

    /** 裁剪交互 **/
    cropAspectButtons.forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(!state.loaded) return notify('请先加载图片');
        state.crop.aspect = btn.dataset.aspect;
        state.crop.active = true;
        overlayEl.removeAttribute('aria-hidden');
        
        // 自动创建对应比例的裁剪框，以中心点为锚点
        const padding = 20; // 距离边缘的内边距
        let cropWidth, cropHeight;
        
        if (btn.dataset.aspect === 'free') {
          // 自由裁剪：创建一个适中大小的矩形
          cropWidth = Math.min(state.off.width * 0.6, 400);
          cropHeight = Math.min(state.off.height * 0.6, 300);
        } else {
          // 按比例裁剪：根据比例计算尺寸
          const [aw, ah] = btn.dataset.aspect.split(':').map(Number);
          const aspectRatio = aw / ah;
          
          // 以图片较小边的60%作为基准
          const baseSize = Math.min(state.off.width, state.off.height) * 0.6;
          
          if (aspectRatio >= 1) {
            // 横向或正方形
            cropWidth = baseSize;
            cropHeight = baseSize / aspectRatio;
          } else {
            // 纵向
            cropHeight = baseSize;
            cropWidth = baseSize * aspectRatio;
          }
        }
        
        // 确保裁剪框不超出图像边界
        const maxWidth = state.off.width - padding * 2;
        const maxHeight = state.off.height - padding * 2;
        cropWidth = Math.min(cropWidth, maxWidth);
        cropHeight = Math.min(cropHeight, maxHeight);
        
        // 以中心点为锚点计算左上角坐标
        const centerX = state.off.width / 2;
        const centerY = state.off.height / 2;
        const cropX = Math.max(padding, centerX - cropWidth / 2);
        const cropY = Math.max(padding, centerY - cropHeight / 2);
        
        // 确保裁剪框完全在图像范围内
        const finalX = Math.min(cropX, state.off.width - cropWidth - padding);
        const finalY = Math.min(cropY, state.off.height - cropHeight - padding);
        
        state.crop.rect = {
          x: Math.round(finalX),
          y: Math.round(finalY),
          w: Math.round(cropWidth),
          h: Math.round(cropHeight)
        };
        
        // 应用比例约束（确保精确比例）
        state.crop.rect = alignRectToAspect(state.crop.rect, state.crop.aspect);
        
        state.dirty = true;
        notify(`裁剪比例：${btn.dataset.aspect}`);
      });
    });

    // 移除开始裁剪按钮的事件监听器
    btnCancelCrop.addEventListener('click', ()=>{ clearCrop(); notify('已取消裁剪'); });
    btnApplyCrop.addEventListener('click', ()=>{
      if(!state.crop.active || !state.crop.rect) return notify('请先选择裁剪区域');
      applyCropRectToOffscreen();
      pushHistory();
      notify('裁剪完成');
    });

    const getPointer = (evt)=>{
      const rect = view.getBoundingClientRect();
      const clientX = evt.touches? evt.touches[0].clientX : evt.clientX;
      const clientY = evt.touches? evt.touches[0].clientY : evt.clientY;
      const x = (clientX - rect.left) * (view.width / rect.width);
      const y = (clientY - rect.top) * (view.height / rect.height);
      return {x,y};
    };

    const getDrawFrame = ()=>{
      const padding = 16;
      const areaW = view.width - padding*2;
      const areaH = view.height - padding*2;
      const fit = fitRectIn(state.off.width, state.off.height, areaW, areaH);
      const zoom = state.preview.zoom;
      const drawW = Math.round(fit.w * zoom);
      const drawH = Math.round(fit.h * zoom);
      const dx = Math.round((view.width - drawW)/2);
      const dy = Math.round((view.height - drawH)/2);
      return {dx,dy,drawW,drawH};
    };

    const alignRectToAspect = (rect, aspect)=>{
      if(aspect==='free' || !rect) return rect;
      const [aw,ah] = aspect.split(':').map(Number);
      if(!aw||!ah) return rect;
      const target = aw/ah;
      let {x,y,w,h} = rect;
      const current = w/h;
      if(current>target){
        // 太宽，按高裁
        w = Math.round(h*target);
      }else{
        // 太高，按宽裁
        h = Math.round(w/target);
      }
      return {x,y,w,h};
    };

    let isDraggingCrop = false;
    let isMovingCrop = false;
    let isResizingCrop = false;
    let cropMoveStart = null;
    let resizeHandle = null;
    
    // 检测点击是否在裁切框内
    const isPointInCropRect = (ox, oy) => {
      if (!state.crop.rect) return false;
      const { x, y, w, h } = state.crop.rect;
      return ox >= x && ox <= x + w && oy >= y && oy <= y + h;
    };
    
    // 检测点击是否在角点控制器上
    const getResizeHandle = (px, py) => {
      if (!state.crop.rect) return null;
      const frame = getDrawFrame();
      const { x, y, w, h } = state.crop.rect;
      const scaleX = frame.drawW / state.off.width;
      const scaleY = frame.drawH / state.off.height;
      const rx = frame.dx + x * scaleX;
      const ry = frame.dy + y * scaleY;
      const rw = w * scaleX;
      const rh = h * scaleY;
      
      const handleSize = 12;
      const tolerance = handleSize;
      
      // 检测四个角点
      if (Math.abs(px - rx) <= tolerance && Math.abs(py - ry) <= tolerance) {
        return 'top-left';
      }
      if (Math.abs(px - (rx + rw)) <= tolerance && Math.abs(py - ry) <= tolerance) {
        return 'top-right';
      }
      if (Math.abs(px - rx) <= tolerance && Math.abs(py - (ry + rh)) <= tolerance) {
        return 'bottom-left';
      }
      if (Math.abs(px - (rx + rw)) <= tolerance && Math.abs(py - (ry + rh)) <= tolerance) {
        return 'bottom-right';
      }
      
      return null;
    };
    
    // 根据角点调整裁切框大小
    const resizeCropRect = (handle, startRect, startPointer, currentPointer) => {
      const deltaX = currentPointer.x - startPointer.x;
      const deltaY = currentPointer.y - startPointer.y;
      const frame = getDrawFrame();
      const scaleX = state.off.width / frame.drawW;
      const scaleY = state.off.height / frame.drawH;
      const dx = deltaX * scaleX;
      const dy = deltaY * scaleY;
      
      let newRect = { ...startRect };
      
      switch (handle) {
        case 'top-left':
          newRect.x = startRect.x + dx;
          newRect.y = startRect.y + dy;
          newRect.w = startRect.w - dx;
          newRect.h = startRect.h - dy;
          break;
        case 'top-right':
          newRect.y = startRect.y + dy;
          newRect.w = startRect.w + dx;
          newRect.h = startRect.h - dy;
          break;
        case 'bottom-left':
          newRect.x = startRect.x + dx;
          newRect.w = startRect.w - dx;
          newRect.h = startRect.h + dy;
          break;
        case 'bottom-right':
          newRect.w = startRect.w + dx;
          newRect.h = startRect.h + dy;
          break;
      }
      
      // 确保最小尺寸
      const minSize = 20;
      if (newRect.w < minSize || newRect.h < minSize) {
        return startRect;
      }
      
      // 应用比例约束
      newRect = alignRectToAspect(newRect, state.crop.aspect);
      
      // 确保不超出图像边界
      newRect.x = Math.max(0, Math.min(state.off.width - newRect.w, newRect.x));
      newRect.y = Math.max(0, Math.min(state.off.height - newRect.h, newRect.y));
      newRect.w = Math.min(newRect.w, state.off.width - newRect.x);
      newRect.h = Math.min(newRect.h, state.off.height - newRect.y);
      
      return newRect;
    };
    
    const onPointerDown = (evt)=>{
      if(!state.loaded) return;
      const p = getPointer(evt);
      // 文本命中优先（选择/拖动）
      const hitId = hitTestText(p.x,p.y);
      if(hitId){
        state.draggingTextId = hitId;
        selectText(hitId);
        state._dragStart = p;
        evt.preventDefault();
        return;
      }

      if(!state.crop.active) return;
      const frame = getDrawFrame();
      
      // 确保点击在预览区域内才开始裁剪
      if(p.x >= frame.dx && p.x <= frame.dx + frame.drawW && p.y >= frame.dy && p.y <= frame.dy + frame.drawH){
        // 检查是否点击在角点控制器上
        const handle = getResizeHandle(p.x, p.y);
        if (handle && state.crop.rect) {
          // 进入缩放模式
          isResizingCrop = true;
          resizeHandle = handle;
          cropMoveStart = { 
            pointer: p, 
            rect: { ...state.crop.rect } 
          };
          evt.preventDefault();
          return;
        }
        
        // 将预览坐标转回 offscreen 坐标
        const scaleX = state.off.width / frame.drawW;
        const scaleY = state.off.height / frame.drawH;
        const ox = Math.max(0, Math.min(state.off.width, Math.round((p.x - frame.dx) * scaleX)));
        const oy = Math.max(0, Math.min(state.off.height, Math.round((p.y - frame.dy) * scaleY)));
        
        // 检查是否点击在现有裁切框内
        if (state.crop.rect && isPointInCropRect(ox, oy)) {
          // 进入移动模式
          isMovingCrop = true;
          cropMoveStart = { x: ox, y: oy, cropX: state.crop.rect.x, cropY: state.crop.rect.y };
          evt.preventDefault();
        } else {
          // 创建新的裁切框
          state.crop.start = {x:ox,y:oy};
          state.crop.rect = {x:ox,y:oy,w:0,h:0};
          isDraggingCrop = true;
        }
      }
    };

    const onPointerMove = (evt)=>{
      if(!state.loaded) return;
      const p = getPointer(evt);
      // 拖动文本
      if(state.draggingTextId && state._dragStart){
        const frame = getDrawFrame();
        const scaleX = state.off.width / frame.drawW;
        const scaleY = state.off.height / frame.drawH;
        const dx = (p.x - state._dragStart.x) * scaleX;
        const dy = (p.y - state._dragStart.y) * scaleY;
        const t = state.textOverlays.find(t=>t.id===state.draggingTextId);
        if(t){ t.x = Math.max(0, Math.min(state.off.width, t.x + dx)); t.y = Math.max(0, Math.min(state.off.height, t.y + dy)); }
        state._dragStart = p;
        state.dirty = true;
        evt.preventDefault();
        return;
      }

      if(!state.crop.active) return;
      const frame = getDrawFrame();
      const scaleX = state.off.width / frame.drawW;
      const scaleY = state.off.height / frame.drawH;
      
      // 缩放裁切框
      if(isResizingCrop && resizeHandle && cropMoveStart && state.crop.rect){
        const newRect = resizeCropRect(resizeHandle, cropMoveStart.rect, cropMoveStart.pointer, p);
        state.crop.rect = newRect;
        state.dirty = true;
        evt.preventDefault();
        return;
      }
      
      // 移动裁切框
      if(isMovingCrop && cropMoveStart && state.crop.rect){
        const ox = Math.max(0, Math.min(state.off.width, Math.round((p.x - frame.dx) * scaleX)));
        const oy = Math.max(0, Math.min(state.off.height, Math.round((p.y - frame.dy) * scaleY)));
        
        const deltaX = ox - cropMoveStart.x;
        const deltaY = oy - cropMoveStart.y;
        
        let newX = cropMoveStart.cropX + deltaX;
        let newY = cropMoveStart.cropY + deltaY;
        
        // 确保裁切框不超出图像边界
        newX = Math.max(0, Math.min(state.off.width - state.crop.rect.w, newX));
        newY = Math.max(0, Math.min(state.off.height - state.crop.rect.h, newY));
        
        state.crop.rect.x = newX;
        state.crop.rect.y = newY;
        state.dirty = true;
        evt.preventDefault();
        return;
      }
      
      // 创建新裁切框
      if(!isDraggingCrop || !state.crop.start) return;
      
      // 确保指针在预览区域内
      const ox = Math.max(0, Math.min(state.off.width, Math.round((p.x - frame.dx) * scaleX)));
      const oy = Math.max(0, Math.min(state.off.height, Math.round((p.y - frame.dy) * scaleY)));
      
      // 只有当指针在有效预览区域内时才更新裁剪框
      if(p.x >= frame.dx && p.x <= frame.dx + frame.drawW && p.y >= frame.dy && p.y <= frame.dy + frame.drawH){
        const x0 = state.crop.start.x;
        const y0 = state.crop.start.y;
        let rect = { x: Math.min(x0,ox), y: Math.min(y0,oy), w: Math.abs(ox-x0), h: Math.abs(oy-y0) };
        rect = alignRectToAspect(rect, state.crop.aspect);
        
        // 确保裁剪框完全在图像范围内
        rect.x = Math.max(0, Math.min(state.off.width - rect.w, rect.x));
        rect.y = Math.max(0, Math.min(state.off.height - rect.h, rect.y));
        rect.w = Math.min(rect.w, state.off.width - rect.x);
        rect.h = Math.min(rect.h, state.off.height - rect.y);
        
        state.crop.rect = rect;
        state.dirty = true;
      }
    };

    const onPointerUp = ()=>{
      if(state.draggingTextId){
        state.draggingTextId = null; state._dragStart = null; pushHistory(); return;
      }
      if(isResizingCrop){
        isResizingCrop = false;
        resizeHandle = null;
        cropMoveStart = null;
        pushHistory();
        return;
      }
      if(isMovingCrop){
        isMovingCrop = false;
        cropMoveStart = null;
        pushHistory();
        return;
      }
      isDraggingCrop = false;
    };

    // 鼠标指针样式管理
    const updateCursor = (evt) => {
      if (!state.crop.active || !state.crop.rect) {
        view.style.cursor = 'default';
        return;
      }
      
      const p = getPointer(evt);
      const handle = getResizeHandle(p.x, p.y);
      
      if (handle) {
        switch (handle) {
          case 'top-left':
          case 'bottom-right':
            view.style.cursor = 'nw-resize';
            break;
          case 'top-right':
          case 'bottom-left':
            view.style.cursor = 'ne-resize';
            break;
        }
      } else {
        const frame = getDrawFrame();
        if (p.x >= frame.dx && p.x <= frame.dx + frame.drawW && p.y >= frame.dy && p.y <= frame.dy + frame.drawH) {
          const scaleX = state.off.width / frame.drawW;
          const scaleY = state.off.height / frame.drawH;
          const ox = Math.max(0, Math.min(state.off.width, Math.round((p.x - frame.dx) * scaleX)));
          const oy = Math.max(0, Math.min(state.off.height, Math.round((p.y - frame.dy) * scaleY)));
          
          if (isPointInCropRect(ox, oy)) {
            view.style.cursor = 'move';
          } else {
            view.style.cursor = 'crosshair';
          }
        } else {
          view.style.cursor = 'default';
        }
      }
    };
    
    view.addEventListener('mousedown', onPointerDown);
    view.addEventListener('mousemove', (evt) => {
      updateCursor(evt);
      onPointerMove(evt);
    });
    window.addEventListener('mouseup', onPointerUp);
    view.addEventListener('touchstart', onPointerDown, {passive:false});
    view.addEventListener('touchmove', onPointerMove, {passive:false});
    window.addEventListener('touchend', onPointerUp);

    /** 文本添加/删除 **/
    const addText = ()=>{
      if(!state.loaded) return notify('请先加载图片');
      const text = textInput.value.trim();
      if(!text) return notify('请输入文本');
      const id = 't_'+Date.now();
      state.textOverlays.push({
        id,
        text,
        fontFamily: fontFamily.value,
        fontSize: Math.max(12, Math.min(72, Number(fontSize.value)||24)),
        color: fontColor.value || '#111111',
        x: Math.round(state.off.width/2 - 40),
        y: Math.round(state.off.height/2 - 12),
        selected: true,
      });
      selectText(id);
      pushHistory();
      state.dirty = true;
      notify('已添加文本');
    };

    const selectText = (id)=>{
      for(const t of state.textOverlays){ t.selected = (t.id===id); }
      state.dirty = true;
    };

    const hitTestText = (vx,vy)=>{
      if(!state.loaded) return null;
      const frame = getDrawFrame();
      const scaleX = state.off.width / frame.drawW;
      const scaleY = state.off.height / frame.drawH;
      const ox = (vx - frame.dx) * scaleX;
      const oy = (vy - frame.dy) * scaleY;
      // 从上到下查找最近一次添加的优先
      for(let i=state.textOverlays.length-1;i>=0;i--){
        const t = state.textOverlays[i];
        const w = measureTextWidthOff(t);
        if(ox>=t.x && ox<=t.x+w && oy>=t.y && oy<=t.y+t.fontSize){
          return t.id;
        }
      }
      return null;
    };

    const measureTextWidthOff = (t)=>{
      const c = document.createElement('canvas');
      const cctx = c.getContext('2d');
      cctx.font = `${t.fontSize}px ${t.fontFamily}`;
      return cctx.measureText(t.text).width;
    };

    const deleteSelectedText = ()=>{
      const idx = state.textOverlays.findIndex(t=>t.selected);
      if(idx<0) return notify('未选中文本');
      state.textOverlays.splice(idx,1);
      pushHistory();
      state.dirty = true;
      notify('已删除文本');
    };

    btnAddText.addEventListener('click', addText);
    btnDeleteText.addEventListener('click', deleteSelectedText);

    /** 拼接 **/
    // 添加文件选择预览功能
    stitchInput.addEventListener('change', (e) => {
      const files = e.target.files;
      if (files && files.length > 0) {
        notify(`已选择 ${files.length} 张图片，点击开始拼接`);
      }
    });

    btnStitch.addEventListener('click', async()=>{
      const files = [...(stitchInput.files||[])];
      if(files.length<2 || files.length>4) return notify('请选择 2-4 张图片');
      const imgs = await Promise.all(files.map(f=>{
        const u = URL.createObjectURL(f);
        return loadImage(u).then(img=>{ URL.revokeObjectURL(u); return img; });
      }));
      const mode = stitchMode.value; // horizontal/vertical
      let dstW, dstH;
      if(mode==='horizontal'){
        dstW = imgs.reduce((s,i)=>s+i.width,0);
        dstH = imgs.reduce((m,i)=>Math.max(m,i.height),0);
      }else{
        dstW = imgs.reduce((m,i)=>Math.max(m,i.width),0);
        dstH = imgs.reduce((s,i)=>s+i.height,0);
      }
      const temp = document.createElement('canvas');
      temp.width = dstW; temp.height = dstH;
      const tctx = temp.getContext('2d');
      let x=0,y=0;
      for(const img of imgs){
        tctx.drawImage(img, x, y);
        if(mode==='horizontal') x += img.width; else y += img.height;
      }
      state.off.width = dstW; state.off.height = dstH;
      state.offCtx.clearRect(0,0,dstW,dstH);
      state.offCtx.drawImage(temp,0,0);
      state.originalRatio = dstW/dstH;
      state.loaded = true; // 设置为已加载状态
      // 重置其他状态
      state.preview.zoom = 1; zoomRange.value = 100; zoomLabel.textContent = '100%';
      state.preview.brightness = 0; brightnessRange.value = 0; brightnessLabel.textContent = '0';
      state.preview.contrast = 0; contrastRange.value = 0; contrastLabel.textContent = '0';
      filterSelect.value = 'none'; state.preview.filter='none';
      state.textOverlays = [];
      clearCrop();
      updateSizeInputs();
      updateInfo();
      pushHistory();
      state.dirty = true;
      notify('拼接完成');
      // 清空文件选择器
      stitchInput.value = '';
    });

    /** 导出 **/
    const exportImage = (useOriginalQuality)=>{
      if(!state.loaded) return notify('请先加载图片');
      const format = exportFormat.value; // mime
      const quality = useOriginalQuality? 1 : Number(qualityRange.value||1);
      const ex = document.createElement('canvas');
      ex.width = state.off.width; ex.height = state.off.height;
      const exCtx = ex.getContext('2d');
      exCtx.filter = getFilterString();
      exCtx.drawImage(state.off,0,0);
      exCtx.filter = 'none';
      // 绘制文本（以 offscreen 坐标）
      for(const t of state.textOverlays){
        exCtx.font = `${t.fontSize}px ${t.fontFamily}`;
        exCtx.fillStyle = t.color;
        exCtx.textBaseline = 'top';
        exCtx.fillText(t.text, t.x, t.y);
      }
      let dataURL;
      try{ dataURL = ex.toDataURL(format, quality); }
      catch(e){ dataURL = ex.toDataURL(); }
      const a = document.createElement('a');
      a.href = dataURL;
      const ext = format.split('/')[1]||'png';
      a.download = `edited.${ext}`;
      document.body.appendChild(a); a.click(); a.remove();
      notify('已导出图片');
    };

    btnExport.addEventListener('click', ()=>exportImage(false));
    btnExportOriginal.addEventListener('click', ()=>exportImage(true));

    /** 九宫格裁切功能 **/
    const generateNineGrid = () => {
      if (!state.loaded) {
        notify('请先加载图片');
        return;
      }
      
      const { width, height } = state.off;
      if (Math.abs(width - height) > 10) {
        notify('请使用1:1比例的正方形图片');
        return;
      }
      
      const pieceSize = Math.floor(Math.min(width, height) / 3);
      state.nineGrid.pieces = [];
      
      for (let row = 0; row < 3; row++) {
        for (let col = 0; col < 3; col++) {
          const index = row * 3 + col + 1;
          const x = col * pieceSize;
          const y = row * pieceSize;
          
          const canvas = document.createElement('canvas');
          canvas.width = pieceSize;
          canvas.height = pieceSize;
          const ctx = canvas.getContext('2d');
          
          ctx.drawImage(state.off, x, y, pieceSize, pieceSize, 0, 0, pieceSize, pieceSize);
          
          // 应用当前的滤镜效果
          if (state.preview.filter !== 'none') {
            ctx.filter = getFilterCSS();
            ctx.drawImage(canvas, 0, 0);
            ctx.filter = 'none';
          }
          
          state.nineGrid.pieces.push({
            index,
            canvas,
            dataURL: canvas.toDataURL('image/png')
          });
        }
      }
      
      // 更新预览
      updateNineGridPreview();
      state.nineGrid.active = true;
      nineGridPreview.style.display = 'block';
      btnExportNineGrid.style.display = 'inline-block';
      notify('九宫格生成成功！');
    };
    
    const updateNineGridPreview = () => {
      const items = document.querySelectorAll('.nine-grid-item');
      items.forEach((item, index) => {
        if (state.nineGrid.pieces[index]) {
          item.style.backgroundImage = `url(${state.nineGrid.pieces[index].dataURL})`;
        }
      });
    };
    
    const exportNineGrid = async () => {
      if (!state.nineGrid.active || state.nineGrid.pieces.length === 0) {
        notify('请先生成九宫格');
        return;
      }
      
      // 显示导出选项
      const choice = confirm('选择导出方式：\n确定 = 打包下载ZIP文件\n取消 = 分别下载所有图片');
      
      if (choice) {
        // 导出为ZIP文件
        await exportNineGridAsZip();
      } else {
        // 分别下载所有图片（无需逐个确认）
        exportNineGridSeparately();
      }
    };
    
    const exportNineGridSeparately = () => {
      let downloadCount = 0;
      const totalCount = state.nineGrid.pieces.length;
      
      state.nineGrid.pieces.forEach((piece, index) => {
        setTimeout(() => {
          const a = document.createElement('a');
          a.href = piece.dataURL;
          a.download = `九宫格_${piece.index}.png`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          
          downloadCount++;
          if (downloadCount === totalCount) {
            notify(`九宫格导出完成！已下载 ${totalCount} 张图片`);
          }
        }, index * 200); // 每200ms下载一张，避免浏览器阻止
      });
    };
    
    const exportNineGridAsZip = async () => {
      try {
        // 动态加载JSZip库
        if (typeof JSZip === 'undefined') {
          const script = document.createElement('script');
          script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
          document.head.appendChild(script);
          
          await new Promise((resolve, reject) => {
            script.onload = resolve;
            script.onerror = () => reject(new Error('JSZip加载失败'));
          });
        }
        
        const zip = new JSZip();
        const folder = zip.folder('九宫格图片');
        
        // 将所有图片添加到ZIP
        for (const piece of state.nineGrid.pieces) {
          const response = await fetch(piece.dataURL);
          const blob = await response.blob();
          folder.file(`九宫格_${piece.index}.png`, blob);
        }
        
        // 生成ZIP文件并下载
        const zipBlob = await zip.generateAsync({type: 'blob'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(zipBlob);
        a.download = `九宫格图片_${new Date().toISOString().slice(0,10)}.zip`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(a.href);
        
        notify('九宫格ZIP文件导出完成！');
      } catch (error) {
        console.error('ZIP导出失败:', error);
        notify('ZIP导出失败，将使用分别下载方式');
        exportNineGridSeparately();
      }
    };
    
    btnNineGrid.addEventListener('click', generateNineGrid);
    btnExportNineGrid.addEventListener('click', exportNineGrid);

    /** 撤销重做 **/
    btnUndo.addEventListener('click', ()=>undo());
    btnRedo.addEventListener('click', ()=>redo());
    window.addEventListener('keydown', (e)=>{
      if(e.ctrlKey && e.key.toLowerCase()==='z'){ e.preventDefault(); if(e.shiftKey) redo(); else undo(); }
      if(e.ctrlKey && e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); }
      if(e.key==='+'){ zoomRange.value = Math.min(200, Number(zoomRange.value)+5); zoomRange.dispatchEvent(new Event('input')); }
      if(e.key==='-'){ zoomRange.value = Math.max(10, Number(zoomRange.value)-5); zoomRange.dispatchEvent(new Event('input')); }
      if(e.key==='Escape' && state.crop.active){ clearCrop(); }
    });

    /** 视图画布自适应大小（响应式）**/
    let _resizeRaf = 0; let _lastCssW = 0; let _lastCssH = 0;
    const resizeView = (cssW, cssH)=>{
      const sec = document.querySelector('section.preview');
      // 允许直接传入 css 尺寸，避免在 ResizeObserver 中同步读取布局
      const rect = cssW && cssH ? { width: cssW, height: cssH } : sec.getBoundingClientRect();
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const pad = 16 * 2; // 与 draw 中的 padding 对齐
      const cssWidth = Math.max(320, Math.floor((rect.width || 0)) - pad);
      const cssHeight = Math.max(240, Math.floor((rect.height || 480)) - pad);
      if(cssWidth === _lastCssW && cssHeight === _lastCssH) return; // 尺寸未变化，避免重复设置
      _lastCssW = cssWidth; _lastCssH = cssHeight;
      // 设置样式尺寸（CSS 像素）
      view.style.width = cssWidth + 'px';
      view.style.height = cssHeight + 'px';
      // 设置画布像素尺寸（物理像素）
      const pxW = Math.floor(cssWidth * dpr);
      const pxH = Math.floor(cssHeight * dpr);
      if(view.width !== pxW) view.width = pxW;
      if(view.height !== pxH) view.height = pxH;
      state.dirty = true;
    };
    window.addEventListener('resize', ()=>{
      if(_resizeRaf) cancelAnimationFrame(_resizeRaf);
      _resizeRaf = requestAnimationFrame(()=>{ _resizeRaf = 0; resizeView(); });
    });
    const ro = new ResizeObserver((entries)=>{
      const cr = entries && entries[0] ? entries[0].contentRect : null;
      const w = cr ? cr.width : undefined;
      const h = cr ? cr.height : undefined;
      if(_resizeRaf) cancelAnimationFrame(_resizeRaf);
      _resizeRaf = requestAnimationFrame(()=>{ _resizeRaf = 0; resizeView(w, h); });
    });
    ro.observe(document.querySelector('section.preview'));

    /** 拖拽上传功能 **/
    const previewSection = document.querySelector('section.preview');
    
    // 处理拖拽上传的通用函数
    const handleFileLoad = async (file) => {
      if (!file || !file.type.startsWith('image/')) {
        notify('请拖拽图片文件');
        return;
      }
      
      const url = URL.createObjectURL(file);
      try {
        const img = await loadImage(url);
        state.off.width = img.width;
        state.off.height = img.height;
        state.offCtx.clearRect(0,0,img.width,img.height);
        state.offCtx.drawImage(img,0,0);
        state.originalRatio = img.width/img.height;
        state.loaded = true;
        state.preview.zoom = 1; zoomRange.value = 100; zoomLabel.textContent = '100%';
        state.preview.brightness = 0; brightnessRange.value = 0; brightnessLabel.textContent = '0';
        state.preview.contrast = 0; contrastRange.value = 0; contrastLabel.textContent = '0';
        filterSelect.value = 'none'; state.preview.filter='none';
        state.textOverlays = [];
        clearCrop();
        updateSizeInputs();
        updateInfo();
        pushHistory();
        notify('图片加载成功');
        state.dirty = true;
      } catch (error) {
        notify('图片加载失败');
      } finally {
        URL.revokeObjectURL(url);
      }
    };

    // 拖拽事件监听
    previewSection.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.stopPropagation();
      previewSection.classList.add('drag-over');
    });

    previewSection.addEventListener('dragleave', (e) => {
      e.preventDefault();
      e.stopPropagation();
      // 只有当离开整个预览区域时才重置样式
      if (!previewSection.contains(e.relatedTarget)) {
        previewSection.classList.remove('drag-over');
      }
    });

    previewSection.addEventListener('drop', (e) => {
      e.preventDefault();
      e.stopPropagation();
      previewSection.classList.remove('drag-over');
      
      const files = e.dataTransfer.files;
      if (files && files.length > 0) {
        handleFileLoad(files[0]);
      }
    });

    /** 初始化 **/
    setUndoRedoState();
    resizeView();
    loop();
  })();
  </script>
</body>
</html>
