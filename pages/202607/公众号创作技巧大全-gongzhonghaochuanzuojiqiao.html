            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: var(--transition);
        }
        
        .tip-content {
            font-size: 1.3rem;
            line-height: 1.5;
            margin-bottom: 15px;
        }
        
        .btn {
            padding: 12px 28px;
            background-color: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow);
        }
        
        .btn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
        
        footer {
            text-align: center;
            margin-top: auto;
            padding: 20px 0;
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        
        footer p {
            margin-bottom: 8px;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {

            } while (tips.length > 1 && tipIndex === lastTipIndex);
