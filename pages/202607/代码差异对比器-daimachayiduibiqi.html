<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代码差异对比器</title>
    <script src="https://cdn.jsdelivr.net/npm/diff@5.1.0/dist/diff.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            height: calc(100vh - 40px);
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 1.8em;
            font-weight: 300;
        }

        .header-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .toolbar {
            background: #f8f9fa;
            padding: 15px 30px;
            border-bottom: 1px solid #e1e5e9;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .editors-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .editor-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e1e5e9;
        }

        .editor-panel:last-child {
            border-right: none;
        }

        .panel-header {
            background: #f8f9fa;
            padding: 10px 20px;
            border-bottom: 1px solid #e1e5e9;
            font-weight: 600;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-header .title {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-header .title::before {
            font-size: 1.2em;
        }

        .original-title::before { content: '📄'; }
        .modified-title::before { content: '📝'; }
        .diff-title::before { content: '🔍'; }

        .editor {
            flex: 1;
            padding: 15px;
            border: none;
            outline: none;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            background: #fafafa;
            color: #333;
        }

        .diff-container {
            flex: 1;
            overflow-y: auto;
            background: white;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
        }

        .diff-result {
            flex: 1;
            background: #f8f9fa;
            border-radius: 15px;
            margin: 20px;
            overflow: hidden;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-1px);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
            transform: translateY(-1px);
        }

        .btn-warning {
            background: #ffc107;
            color: #212529;
        }

        .btn-warning:hover {
            background: #e0a800;
            transform: translateY(-1px);
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
            transform: translateY(-1px);
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.8em;
        }

        .diff-options {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .diff-option {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9em;
        }

        .diff-option input {
            margin: 0;
        }

        .diff-option label {
            color: #555;
            font-weight: 600;
            cursor: pointer;
        }

        .status-bar {
            background: #f8f9fa;
            padding: 8px 20px;
            border-top: 1px solid #e1e5e9;
            font-size: 0.9em;
            color: #666;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .diff-stats {
            display: flex;
            gap: 20px;
        }

        .error-message {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 10px 20px;
            margin: 10px 20px;
            border-radius: 6px;
            font-size: 0.9em;
            display: none;
        }

        .success-message {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 10px 20px;
            margin: 10px 20px;
            border-radius: 6px;
            font-size: 0.9em;
            display: none;
        }

        /* 差异显示样式 */
        .diff-line {
            padding: 2px 10px;
            margin: 0;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .diff-line-number {
            display: inline-block;
            width: 50px;
            text-align: right;
            margin-right: 10px;
            color: #666;
            user-select: none;
        }

        .diff-added {
            background-color: #d4edda;
            border-left: 4px solid #28a745;
        }

        .diff-removed {
            background-color: #f8d7da;
            border-left: 4px solid #dc3545;
        }

        .diff-unchanged {
            background-color: #f8f9fa;
            border-left: 4px solid #e9ecef;
        }

        .diff-context {
            background-color: #fff;
            border-left: 4px solid #dee2e6;
        }

        .diff-header {
            background-color: #e9ecef;
            font-weight: bold;
            padding: 5px 10px;
            border-bottom: 1px solid #dee2e6;
        }

        .char-diff {
            background-color: rgba(255, 0, 0, 0.3);
            padding: 1px 2px;
            border-radius: 2px;
        }

        .char-diff.added {
            background-color: rgba(0, 255, 0, 0.3);
        }

        .unified-diff {
            padding: 20px;
        }

        .side-by-side {
            display: flex;
            height: 100%;
        }

        .side-by-side .side {
            flex: 1;
            border-right: 1px solid #e1e5e9;
            overflow-y: auto;
        }

        .side-by-side .side:last-child {
            border-right: none;
        }

        .side-header {
            background: #f8f9fa;
            padding: 10px;
            font-weight: bold;
            border-bottom: 1px solid #e1e5e9;
            text-align: center;
        }

        .side-content {
            padding: 10px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .editors-container {
                flex-direction: column;
            }
            
            .editor-panel {
                border-right: none;
                border-bottom: 1px solid #e1e5e9;
            }
            
            .side-by-side {
                flex-direction: column;
            }
            
            .side-by-side .side {
                border-right: none;
                border-bottom: 1px solid #e1e5e9;
            }
            
            .toolbar {
                padding: 10px 15px;
            }
            
            .header {
                padding: 15px 20px;
            }
            
            .header h1 {
                font-size: 1.5em;
            }
        }

        /* 暗色主题 */
        .dark-theme {
            background: #1a1a1a;
            color: #e1e1e1;
        }

        .dark-theme .header {
            background: linear-gradient(135deg, #2d3748 0%, #4a5568 100%);
        }

        .dark-theme .toolbar,
        .dark-theme .panel-header,
        .dark-theme .status-bar,
        .dark-theme .side-header {
            background: #2d3748;
            border-color: #4a5568;
            color: #e1e1e1;
        }

        .dark-theme .editor {
            background: #1a202c;
            color: #e1e1e1;
        }

        .dark-theme .diff-container {
            background: #1a202c;
            color: #e1e1e1;
        }

        .dark-theme .diff-added {
            background-color: #1e4d2b;
            border-color: #28a745;
        }

        .dark-theme .diff-removed {
            background-color: #4d1e1e;
            border-color: #dc3545;
        }

        .dark-theme .diff-unchanged {
            background-color: #2d3748;
            border-color: #4a5568;
        }

        .dark-theme .diff-context {
            background-color: #1a202c;
            border-color: #4a5568;
        }

        .dark-theme .diff-header {
            background-color: #2d3748;
            border-color: #4a5568;
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="header">
            <h1>代码差异对比器</h1>
            <div class="header-controls">
                <button class="btn btn-secondary btn-small" onclick="toggleTheme()">🌙 暗色</button>
                <button class="btn btn-secondary btn-small" onclick="toggleFullscreen()">⛶ 全屏</button>
            </div>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <div class="toolbar">
            <button class="btn btn-primary" onclick="compareDiff()">🔍 对比差异</button>
            <button class="btn btn-secondary" onclick="clearAll()">🗑️ 清空</button>
            <button class="btn btn-success" onclick="loadExample()">📄 加载示例</button>
            <button class="btn btn-warning" onclick="exportDiff()">💾 导出差异</button>
            
            <span style="margin: 0 10px; border-left: 1px solid #ddd; height: 20px;"></span>
            
            <div class="diff-options">
                <div class="diff-option">
                    <input type="radio" id="unifiedView" name="viewMode" value="unified" checked>
                    <label for="unifiedView">统一视图</label>
                </div>
                <div class="diff-option">
                    <input type="radio" id="sideBySideView" name="viewMode" value="sideBySide">
                    <label for="sideBySideView">并排视图</label>
                </div>
                <div class="diff-option">
                    <input type="checkbox" id="ignoreWhitespace">
                    <label for="ignoreWhitespace">忽略空白</label>
                </div>
                <div class="diff-option">
                    <input type="checkbox" id="ignoreCase">
                    <label for="ignoreCase">忽略大小写</label>
                </div>
                <div class="diff-option">
                    <input type="checkbox" id="showContext" checked>
                    <label for="showContext">显示上下文</label>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="editors-container">
                <!-- 原始代码 -->
                <div class="editor-panel">
                    <div class="panel-header">
                        <div class="title original-title">原始代码</div>
                        <div>
                            <button class="btn btn-secondary btn-small" onclick="loadFile('original')">📁 加载文件</button>
                            <input type="file" id="originalFileInput" style="display: none;" onchange="handleFileLoad(event, 'original')">
                        </div>
                    </div>
                    <textarea id="originalEditor" class="editor" placeholder="在此输入原始代码...">function calculateSum(numbers) {
    let sum = 0;
    for (let i = 0; i < numbers.length; i++) {
        sum += numbers[i];
    }
    return sum;
}

function findMax(numbers) {
    let max = numbers[0];
    for (let i = 1; i < numbers.length; i++) {
        if (numbers[i] > max) {
            max = numbers[i];
        }
    }
    return max;
}

const data = [1, 2, 3, 4, 5];
console.log('Sum:', calculateSum(data));
console.log('Max:', findMax(data));</textarea>
                </div>

                <!-- 修改后代码 -->
                <div class="editor-panel">
                    <div class="panel-header">
                        <div class="title modified-title">修改后代码</div>
                        <div>
                            <button class="btn btn-secondary btn-small" onclick="loadFile('modified')">📁 加载文件</button>
                            <input type="file" id="modifiedFileInput" style="display: none;" onchange="handleFileLoad(event, 'modified')">
                        </div>
                    </div>
                    <textarea id="modifiedEditor" class="editor" placeholder="在此输入修改后的代码...">function calculateSum(numbers) {
    return numbers.reduce((sum, num) => sum + num, 0);
}

function findMax(numbers) {
    return Math.max(...numbers);
}

function findMin(numbers) {
    return Math.min(...numbers);
}

const data = [1, 2, 3, 4, 5, 6];
console.log('Sum:', calculateSum(data));
console.log('Max:', findMax(data));
console.log('Min:', findMin(data));</textarea>
                </div>
            </div>

            <!-- 差异结果 -->
            <div class="diff-result">
                <div class="panel-header">
                    <div class="title diff-title">差异对比结果</div>
                    <div>
                        <button class="btn btn-secondary btn-small" onclick="copyDiff()">📋 复制差异</button>
                    </div>
                </div>
                <div class="diff-container" id="diffContainer">
                    <div style="padding: 40px; text-align: center; color: #666;">
                        点击"对比差异"按钮开始比较代码
                    </div>
                </div>
            </div>
        </div>

        <div class="status-bar">
            <div class="diff-stats">
                <span>添加行数: <span id="addedLines">0</span></span>
                <span>删除行数: <span id="removedLines">0</span></span>
                <span>修改行数: <span id="modifiedLines">0</span></span>
            </div>
            <div>
                <span id="diffTime">未对比</span>
            </div>
        </div>
    </div>

    <script>
        let isDarkTheme = false;
        let isFullscreen = false;
        let currentDiff = null;

        // 显示错误信息
        function showError(message) {
            const errorElement = document.getElementById('errorMessage');
            const successElement = document.getElementById('successMessage');
            
            errorElement.textContent = message;
            errorElement.style.display = 'block';
            successElement.style.display = 'none';
            
            setTimeout(() => {
                errorElement.style.display = 'none';
            }, 5000);
        }

        // 显示成功信息
        function showSuccess(message) {
            const errorElement = document.getElementById('errorMessage');
            const successElement = document.getElementById('successMessage');
            
            successElement.textContent = message;
            successElement.style.display = 'block';
            errorElement.style.display = 'none';
            
            setTimeout(() => {
                successElement.style.display = 'none';
            }, 3000);
        }

        // 对比差异
        function compareDiff() {
            const originalText = document.getElementById('originalEditor').value;
            const modifiedText = document.getElementById('modifiedEditor').value;
            
            if (!originalText && !modifiedText) {
                showError('请输入要对比的代码');
                return;
            }

            const startTime = Date.now();
            
            try {
                const options = getDiffOptions();
                let original = originalText;
                let modified = modifiedText;
                
                // 预处理文本
                if (options.ignoreWhitespace) {
                    original = original.replace(/\s+/g, ' ').trim();
                    modified = modified.replace(/\s+/g, ' ').trim();
                }
                
                if (options.ignoreCase) {
                    original = original.toLowerCase();
                    modified = modified.toLowerCase();
                }
                
                // 计算差异
                const diff = Diff.diffLines(original, modified);
                currentDiff = diff;
                
                // 显示差异
                const viewMode = document.querySelector('input[name="viewMode"]:checked').value;
                if (viewMode === 'unified') {
                    displayUnifiedDiff(diff, options);
                } else {
                    displaySideBySideDiff(originalText, modifiedText, diff, options);
                }
                
                // 更新统计信息
                updateDiffStats(diff);
                
                const endTime = Date.now();
                document.getElementById('diffTime').textContent = `对比完成 (${endTime - startTime}ms)`;
                
                showSuccess('代码差异对比完成！');
                
            } catch (error) {
                showError('差异对比失败: ' + error.message);
            }
        }

        // 获取差异选项
        function getDiffOptions() {
            return {
                ignoreWhitespace: document.getElementById('ignoreWhitespace').checked,
                ignoreCase: document.getElementById('ignoreCase').checked,
                showContext: document.getElementById('showContext').checked
            };
        }

        // 显示统一差异视图
        function displayUnifiedDiff(diff, options) {
            const container = document.getElementById('diffContainer');
            container.innerHTML = '';
            container.className = 'diff-container unified-diff';
            
            let lineNumber = 1;
            
            diff.forEach((part, index) => {
                const lines = part.value.split('\n');
                if (lines[lines.length - 1] === '') {
                    lines.pop(); // 移除最后的空行
                }
                
                lines.forEach((line, lineIndex) => {
                    const lineDiv = document.createElement('div');
                    lineDiv.className = 'diff-line';
                    
                    const lineNumberSpan = document.createElement('span');
                    lineNumberSpan.className = 'diff-line-number';
                    lineNumberSpan.textContent = lineNumber.toString().padStart(4, ' ');
                    
                    const contentSpan = document.createElement('span');
                    contentSpan.textContent = line || ' '; // 空行显示空格
                    
                    if (part.added) {
                        lineDiv.classList.add('diff-added');
                        contentSpan.textContent = '+ ' + line;
                    } else if (part.removed) {
                        lineDiv.classList.add('diff-removed');
                        contentSpan.textContent = '- ' + line;
                    } else {
                        lineDiv.classList.add('diff-unchanged');
                        contentSpan.textContent = '  ' + line;
                    }
                    
                    lineDiv.appendChild(lineNumberSpan);
                    lineDiv.appendChild(contentSpan);
                    container.appendChild(lineDiv);
                    
                    if (!part.removed) {
                        lineNumber++;
                    }
                });
            });
        }

        // 显示并排差异视图
        function displaySideBySideDiff(originalText, modifiedText, diff, options) {
            const container = document.getElementById('diffContainer');
            container.innerHTML = '';
            container.className = 'diff-container side-by-side';
            
            const leftSide = document.createElement('div');
            leftSide.className = 'side';
            const leftHeader = document.createElement('div');
            leftHeader.className = 'side-header';
            leftHeader.textContent = '原始代码';
            const leftContent = document.createElement('div');
            leftContent.className = 'side-content';
            leftSide.appendChild(leftHeader);
            leftSide.appendChild(leftContent);
            
            const rightSide = document.createElement('div');
            rightSide.className = 'side';
            const rightHeader = document.createElement('div');
            rightHeader.className = 'side-header';
            rightHeader.textContent = '修改后代码';
            const rightContent = document.createElement('div');
            rightContent.className = 'side-content';
            rightSide.appendChild(rightHeader);
            rightSide.appendChild(rightContent);
            
            container.appendChild(leftSide);
            container.appendChild(rightSide);
            
            // 处理并排显示逻辑
            const originalLines = originalText.split('\n');
            const modifiedLines = modifiedText.split('\n');
            
            let originalIndex = 0;
            let modifiedIndex = 0;
            
            diff.forEach(part => {
                const lines = part.value.split('\n');
                if (lines[lines.length - 1] === '') {
                    lines.pop();
                }
                
                lines.forEach(line => {
                    if (part.added) {
                        // 添加的行只在右侧显示
                        const leftLineDiv = document.createElement('div');
                        leftLineDiv.className = 'diff-line';
                        leftLineDiv.innerHTML = '<span class="diff-line-number"></span><span></span>';
                        leftContent.appendChild(leftLineDiv);
                        
                        const rightLineDiv = document.createElement('div');
                        rightLineDiv.className = 'diff-line diff-added';
                        rightLineDiv.innerHTML = `<span class="diff-line-number">${(modifiedIndex + 1).toString().padStart(4, ' ')}</span><span>+ ${line}</span>`;
                        rightContent.appendChild(rightLineDiv);
                        
                        modifiedIndex++;
                    } else if (part.removed) {
                        // 删除的行只在左侧显示
                        const leftLineDiv = document.createElement('div');
                        leftLineDiv.className = 'diff-line diff-removed';
                        leftLineDiv.innerHTML = `<span class="diff-line-number">${(originalIndex + 1).toString().padStart(4, ' ')}</span><span>- ${line}</span>`;
                        leftContent.appendChild(leftLineDiv);
                        
                        const rightLineDiv = document.createElement('div');
                        rightLineDiv.className = 'diff-line';
                        rightLineDiv.innerHTML = '<span class="diff-line-number"></span><span></span>';
                        rightContent.appendChild(rightLineDiv);
                        
                        originalIndex++;
                    } else {
                        // 未修改的行在两侧都显示
                        const leftLineDiv = document.createElement('div');
                        leftLineDiv.className = 'diff-line diff-unchanged';
                        leftLineDiv.innerHTML = `<span class="diff-line-number">${(originalIndex + 1).toString().padStart(4, ' ')}</span><span>  ${line}</span>`;
                        leftContent.appendChild(leftLineDiv);
                        
                        const rightLineDiv = document.createElement('div');
                        rightLineDiv.className = 'diff-line diff-unchanged';
                        rightLineDiv.innerHTML = `<span class="diff-line-number">${(modifiedIndex + 1).toString().padStart(4, ' ')}</span><span>  ${line}</span>`;
                        rightContent.appendChild(rightLineDiv);
                        
                        originalIndex++;
                        modifiedIndex++;
                    }
                });
            });
        }

        // 更新差异统计
        function updateDiffStats(diff) {
            let addedLines = 0;
            let removedLines = 0;
            let modifiedLines = 0;
            
            diff.forEach(part => {
                const lines = part.value.split('\n').filter(line => line !== '');
                if (part.added) {
                    addedLines += lines.length;
                } else if (part.removed) {
                    removedLines += lines.length;
                }
            });
            
            // 计算修改行数（添加和删除的较小值）
            modifiedLines = Math.min(addedLines, removedLines);
            addedLines -= modifiedLines;
            removedLines -= modifiedLines;
            
            document.getElementById('addedLines').textContent = addedLines;
            document.getElementById('removedLines').textContent = removedLines;
            document.getElementById('modifiedLines').textContent = modifiedLines;
        }

        // 清空所有内容
        function clearAll() {
            if (confirm('确定要清空所有内容吗？')) {
                document.getElementById('originalEditor').value = '';
                document.getElementById('modifiedEditor').value = '';
                document.getElementById('diffContainer').innerHTML = '<div style="padding: 40px; text-align: center; color: #666;">点击"对比差异"按钮开始比较代码</div>';
                
                document.getElementById('addedLines').textContent = '0';
                document.getElementById('removedLines').textContent = '0';
                document.getElementById('modifiedLines').textContent = '0';
                document.getElementById('diffTime').textContent = '未对比';
                
                currentDiff = null;
                showSuccess('内容已清空');
            }
        }

        // 加载示例
        function loadExample() {
            const examples = [
                {
                    name: 'JavaScript函数重构',
                    original: `function calculateSum(numbers) {
    let sum = 0;
    for (let i = 0; i < numbers.length; i++) {
        sum += numbers[i];
    }
    return sum;
}

function findMax(numbers) {
    let max = numbers[0];
    for (let i = 1; i < numbers.length; i++) {
        if (numbers[i] > max) {
            max = numbers[i];
        }
    }
    return max;
}

const data = [1, 2, 3, 4, 5];
console.log('Sum:', calculateSum(data));
console.log('Max:', findMax(data));`,
                    modified: `function calculateSum(numbers) {
    return numbers.reduce((sum, num) => sum + num, 0);
}

function findMax(numbers) {
    return Math.max(...numbers);
}

function findMin(numbers) {
    return Math.min(...numbers);
}

const data = [1, 2, 3, 4, 5, 6];
console.log('Sum:', calculateSum(data));
console.log('Max:', findMax(data));
console.log('Min:', findMin(data));`
                },
                {
                    name: 'CSS样式更新',
                    original: `.button {
    background-color: blue;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}

.button:hover {
    background-color: darkblue;
}

.container {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
}`,
                    modified: `.button {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-weight: 600;
}

.button:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
}

.container {
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 20px;
}`
                }
            ];
            
            const choice = prompt('选择示例:\n' + examples.map((ex, i) => `${i + 1}. ${ex.name}`).join('\n'));
            
            if (choice && choice >= 1 && choice <= examples.length) {
                const example = examples[choice - 1];
                document.getElementById('originalEditor').value = example.original;
                document.getElementById('modifiedEditor').value = example.modified;
                showSuccess('示例加载成功！');
            }
        }

        // 导出差异
        function exportDiff() {
            if (!currentDiff) {
                showError('请先进行差异对比');
                return;
            }
            
            let diffText = '# 代码差异对比报告\n\n';
            diffText += `生成时间: ${new Date().toLocaleString()}\n\n`;
            
            const stats = {
                added: parseInt(document.getElementById('addedLines').textContent),
                removed: parseInt(document.getElementById('removedLines').textContent),
                modified: parseInt(document.getElementById('modifiedLines').textContent)
            };
            
            diffText += `## 统计信息\n`;
            diffText += `- 添加行数: ${stats.added}\n`;
            diffText += `- 删除行数: ${stats.removed}\n`;
            diffText += `- 修改行数: ${stats.modified}\n\n`;
            
            diffText += `## 详细差异\n\n`;
            diffText += '```diff\n';
            
            currentDiff.forEach(part => {
                const lines = part.value.split('\n');
                if (lines[lines.length - 1] === '') {
                    lines.pop();
                }
                
                lines.forEach(line => {
                    if (part.added) {
                        diffText += `+ ${line}\n`;
                    } else if (part.removed) {
                        diffText += `- ${line}\n`;
                    } else {
                        diffText += `  ${line}\n`;
                    }
                });
            });
            
            diffText += '```\n';
            
            downloadFile(diffText, 'diff-report.md', 'text/markdown');
            showSuccess('差异报告导出成功！');
        }

        // 复制差异
        function copyDiff() {
            if (!currentDiff) {
                showError('请先进行差异对比');
                return;
            }
            
            let diffText = '';
            currentDiff.forEach(part => {
                const lines = part.value.split('\n');
                if (lines[lines.length - 1] === '') {
                    lines.pop();
                }
                
                lines.forEach(line => {
                    if (part.added) {
                        diffText += `+ ${line}\n`;
                    } else if (part.removed) {
                        diffText += `- ${line}\n`;
                    } else {
                        diffText += `  ${line}\n`;
                    }
                });
            });
            
            navigator.clipboard.writeText(diffText).then(() => {
                showSuccess('差异内容已复制到剪贴板！');
            }).catch(() => {
                showError('复制失败，请手动选择内容复制');
            });
        }

        // 下载文件
        function downloadFile(content, filename, mimeType) {
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.download = filename;
            link.href = url;
            link.click();
            URL.revokeObjectURL(url);
        }

        // 加载文件
        function loadFile(type) {
            const fileInput = document.getElementById(type + 'FileInput');
            fileInput.click();
        }

        // 处理文件加载
        function handleFileLoad(event, type) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const editor = document.getElementById(type + 'Editor');
                editor.value = e.target.result;
                showSuccess(`文件 "${file.name}" 加载成功！`);
            };
            reader.readAsText(file);
        }

        // 切换主题
        function toggleTheme() {
            isDarkTheme = !isDarkTheme;
            const container = document.getElementById('container');
            const button = event.target;
            
            if (isDarkTheme) {
                container.classList.add('dark-theme');
                button.textContent = '☀️ 亮色';
            } else {
                container.classList.remove('dark-theme');
                button.textContent = '🌙 暗色';
            }
            
            localStorage.setItem('diff-tool-theme', isDarkTheme ? 'dark' : 'light');
        }

        // 切换全屏
        function toggleFullscreen() {
            isFullscreen = !isFullscreen;
            const container = document.getElementById('container');
            const button = event.target;
            
            if (isFullscreen) {
                container.style.position = 'fixed';
                container.style.top = '0';
                container.style.left = '0';
                container.style.width = '100vw';
                container.style.height = '100vh';
                container.style.zIndex = '9999';
                container.style.borderRadius = '0';
                button.textContent = '⛶ 退出全屏';
            } else {
                container.style.position = '';
                container.style.top = '';
                container.style.left = '';
                container.style.width = '';
                container.style.height = '';
                container.style.zIndex = '';
                container.style.borderRadius = '';
                button.textContent = '⛶ 全屏';
            }
        }

        // 恢复主题
        function restoreTheme() {
            const savedTheme = localStorage.getItem('diff-tool-theme');
            if (savedTheme === 'dark') {
                toggleTheme();
            }
        }

        // 页面加载时初始化
        window.addEventListener('load', function() {
            restoreTheme();
            
            // 绑定视图模式切换事件
            document.querySelectorAll('input[name="viewMode"]').forEach(radio => {
                radio.addEventListener('change', function() {
                    if (currentDiff) {
                        compareDiff(); // 重新渲染差异
                    }
                });
            });
            
            // 绑定选项变化事件
            document.querySelectorAll('.diff-option input').forEach(input => {
                input.addEventListener('change', function() {
                    if (currentDiff) {
                        compareDiff(); // 重新计算差异
                    }
                });
            });
        });
    </script>
</body>
</html>
