<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字转语音工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .input-section {
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
        }

        .text-input {
            width: 100%;
            min-height: 150px;
            padding: 20px;
            border: 2px solid #e1e5e9;
            border-radius: 15px;
            font-size: 1em;
            font-family: inherit;
            resize: vertical;
            transition: all 0.3s ease;
        }

        .text-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .controls-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .control-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .control-group {
            flex: 1;
            min-width: 200px;
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .select-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 1em;
            background: white;
            transition: all 0.3s ease;
        }

        .select-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .slider {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: #e1e5e9;
            outline: none;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .slider-value {
            min-width: 40px;
            text-align: center;
            font-weight: 600;
            color: #667eea;
        }

        .button-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            min-width: 120px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover:not(:disabled) {
            background: #218838;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .audio-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            display: none;
        }

        .audio-section.show {
            display: block;
        }

        .audio-player {
            width: 100%;
            margin: 20px 0;
        }

        .waveform {
            width: 100%;
            height: 60px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 30px;
            margin: 20px 0;
            position: relative;
            overflow: hidden;
        }

        .waveform::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0%;
            height: 100%;
            background: rgba(255,255,255,0.3);
            transition: width 0.1s ease;
        }

        .status-message {
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
            display: none;
        }

        .status-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .character-count {
            text-align: right;
            margin-top: 10px;
            font-size: 0.9em;
            color: #666;
        }

        .quick-text {
            margin-bottom: 20px;
        }

        .quick-text-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .quick-btn {
            padding: 8px 16px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .quick-btn:hover {
            background: #667eea;
            color: white;
        }

        @media (max-width: 768px) {
            .control-row {
                flex-direction: column;
            }
            
            .btn-group {
                flex-direction: column;
            }
            
            .quick-text-buttons {
                justify-content: center;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔊 文字转语音工具</h1>
            <p>输入文字，转换为自然语音，支持多种语音和参数调节</p>
        </div>
        
        <div class="content">
            <div class="input-section">
                <div class="input-group">
                    <label for="textInput">📝 输入要转换的文字</label>
                    <textarea 
                        id="textInput" 
                        class="text-input" 
                        placeholder="请输入要转换为语音的文字内容...\n\n支持中文、英文等多种语言\n最多支持1000个字符"
                        maxlength="1000"
                    ></textarea>
                    <div class="character-count">
                        <span id="charCount">0</span> / 1000 字符
                    </div>
                </div>
                
                <div class="quick-text">
                    <label>🚀 快速文本</label>
                    <div class="quick-text-buttons">
                        <button class="quick-btn" data-text="你好，欢迎使用文字转语音工具！">问候语</button>
                        <button class="quick-btn" data-text="今天天气真不错，适合出去走走。">天气</button>
                        <button class="quick-btn" data-text="请注意，前方路口请减速慢行。">提醒</button>
                        <button class="quick-btn" data-text="感谢您的使用，祝您生活愉快！">感谢</button>
                        <button class="quick-btn" data-text="Hello, welcome to our text-to-speech tool!">English</button>
                    </div>
                </div>
            </div>
            
            <div class="controls-section">
                <div class="control-row">
                    <div class="control-group">
                        <label for="voiceSelect">🎭 选择语音</label>
                        <select id="voiceSelect" class="select-input">
                            <option value="">正在加载语音...</option>
                        </select>
                    </div>
                    
                    <div class="control-group">
                        <label for="languageSelect">🌍 语言</label>
                        <select id="languageSelect" class="select-input">
                            <option value="zh-CN">中文 (简体)</option>
                            <option value="zh-TW">中文 (繁体)</option>
                            <option value="en-US">English (US)</option>
                            <option value="en-GB">English (UK)</option>
                            <option value="ja-JP">日本語</option>
                            <option value="ko-KR">한국어</option>
                        </select>
                    </div>
                </div>
                
                <div class="control-row">
                    <div class="control-group">
                        <label>🎵 语速</label>
                        <div class="slider-group">
                            <input type="range" id="rateSlider" class="slider" min="0.1" max="2" step="0.1" value="1">
                            <span class="slider-value" id="rateValue">1.0</span>
                        </div>
                    </div>
                    
                    <div class="control-group">
                        <label>🎼 音调</label>
                        <div class="slider-group">
                            <input type="range" id="pitchSlider" class="slider" min="0" max="2" step="0.1" value="1">
                            <span class="slider-value" id="pitchValue">1.0</span>
                        </div>
                    </div>
                    
                    <div class="control-group">
                        <label>🔊 音量</label>
                        <div class="slider-group">
                            <input type="range" id="volumeSlider" class="slider" min="0" max="1" step="0.1" value="1">
                            <span class="slider-value" id="volumeValue">1.0</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="button-section">
                <div class="btn-group">
                    <button class="btn btn-primary" id="playBtn">
                        ▶️ 播放语音
                    </button>
                    <button class="btn btn-secondary" id="pauseBtn" disabled>
                        ⏸️ 暂停
                    </button>
                    <button class="btn btn-secondary" id="stopBtn" disabled>
                        ⏹️ 停止
                    </button>
                    <button class="btn btn-success" id="downloadBtn" disabled>
                        💾 下载音频
                    </button>
                </div>
            </div>
            
            <div class="status-message" id="statusMessage"></div>
            
            <div class="audio-section" id="audioSection">
                <h3>🎵 音频播放器</h3>
                <div class="waveform" id="waveform"></div>
                <audio id="audioPlayer" class="audio-player" controls style="display: none;"></audio>
                <p id="audioInfo">音频时长: <span id="duration">--:--</span></p>
            </div>
        </div>
    </div>

    <script>
        class TextToSpeechTool {
            constructor() {
                this.synthesis = window.speechSynthesis;
                this.currentUtterance = null;
                this.voices = [];
                this.audioBlob = null;
                this.mediaRecorder = null;
                this.audioChunks = [];
                
                this.initializeElements();
                this.bindEvents();
                this.loadVoices();
            }

            initializeElements() {
                this.textInput = document.getElementById('textInput');
                this.charCount = document.getElementById('charCount');
                this.voiceSelect = document.getElementById('voiceSelect');
                this.languageSelect = document.getElementById('languageSelect');
                this.rateSlider = document.getElementById('rateSlider');
                this.rateValue = document.getElementById('rateValue');
                this.pitchSlider = document.getElementById('pitchSlider');
                this.pitchValue = document.getElementById('pitchValue');
                this.volumeSlider = document.getElementById('volumeSlider');
                this.volumeValue = document.getElementById('volumeValue');
                
                this.playBtn = document.getElementById('playBtn');
                this.pauseBtn = document.getElementById('pauseBtn');
                this.stopBtn = document.getElementById('stopBtn');
                this.downloadBtn = document.getElementById('downloadBtn');
                
                this.statusMessage = document.getElementById('statusMessage');
                this.audioSection = document.getElementById('audioSection');
                this.waveform = document.getElementById('waveform');
                this.audioPlayer = document.getElementById('audioPlayer');
                this.duration = document.getElementById('duration');
            }

            bindEvents() {
                // 文本输入
                this.textInput.addEventListener('input', () => this.updateCharCount());
                
                // 快速文本按钮
                document.querySelectorAll('.quick-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.textInput.value = e.target.dataset.text;
                        this.updateCharCount();
                    });
                });
                
                // 滑块
                this.rateSlider.addEventListener('input', (e) => {
                    this.rateValue.textContent = parseFloat(e.target.value).toFixed(1);
                });
                
                this.pitchSlider.addEventListener('input', (e) => {
                    this.pitchValue.textContent = parseFloat(e.target.value).toFixed(1);
                });
                
                this.volumeSlider.addEventListener('input', (e) => {
                    this.volumeValue.textContent = parseFloat(e.target.value).toFixed(1);
                });
                
                // 语言选择
                this.languageSelect.addEventListener('change', () => this.filterVoices());
                
                // 按钮事件
                this.playBtn.addEventListener('click', () => this.playText());
                this.pauseBtn.addEventListener('click', () => this.pauseSpeech());
                this.stopBtn.addEventListener('click', () => this.stopSpeech());
                this.downloadBtn.addEventListener('click', () => this.downloadAudio());
                
                // 语音事件
                this.synthesis.addEventListener('voiceschanged', () => this.loadVoices());
            }

            updateCharCount() {
                const count = this.textInput.value.length;
                this.charCount.textContent = count;
                
                if (count > 800) {
                    this.charCount.style.color = '#dc3545';
                } else if (count > 600) {
                    this.charCount.style.color = '#ffc107';
                } else {
                    this.charCount.style.color = '#28a745';
                }
            }

            loadVoices() {
                this.voices = this.synthesis.getVoices();
                this.populateVoiceSelect();
                this.filterVoices();
            }

            populateVoiceSelect() {
                this.voiceSelect.innerHTML = '';
                
                if (this.voices.length === 0) {
                    this.voiceSelect.innerHTML = '<option value="">暂无可用语音</option>';
                    return;
                }
                
                this.voices.forEach((voice, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.textContent = `${voice.name} (${voice.lang})`;
                    this.voiceSelect.appendChild(option);
                });
            }

            filterVoices() {
                const selectedLang = this.languageSelect.value;
                const filteredVoices = this.voices.filter(voice => 
                    voice.lang.startsWith(selectedLang.split('-')[0])
                );
                
                this.voiceSelect.innerHTML = '';
                
                if (filteredVoices.length === 0) {
                    this.voiceSelect.innerHTML = '<option value="">该语言暂无可用语音</option>';
                    return;
                }
                
                filteredVoices.forEach((voice) => {
                    const option = document.createElement('option');
                    option.value = this.voices.indexOf(voice);
                    option.textContent = `${voice.name} (${voice.lang})`;
                    this.voiceSelect.appendChild(option);
                });
            }

            showStatus(message, type = 'info') {
                this.statusMessage.textContent = message;
                this.statusMessage.className = `status-message status-${type}`;
                this.statusMessage.style.display = 'block';
                
                setTimeout(() => {
                    this.statusMessage.style.display = 'none';
                }, 3000);
            }

            playText() {
                const text = this.textInput.value.trim();
                
                if (!text) {
                    this.showStatus('请输入要转换的文字', 'error');
                    return;
                }
                
                if (this.synthesis.speaking) {
                    this.synthesis.cancel();
                }
                
                this.currentUtterance = new SpeechSynthesisUtterance(text);
                
                // 设置语音参数
                const voiceIndex = this.voiceSelect.value;
                if (voiceIndex && this.voices[voiceIndex]) {
                    this.currentUtterance.voice = this.voices[voiceIndex];
                }
                
                this.currentUtterance.rate = parseFloat(this.rateSlider.value);
                this.currentUtterance.pitch = parseFloat(this.pitchSlider.value);
                this.currentUtterance.volume = parseFloat(this.volumeSlider.value);
                this.currentUtterance.lang = this.languageSelect.value;
                
                // 事件监听
                this.currentUtterance.onstart = () => {
                    this.playBtn.disabled = true;
                    this.pauseBtn.disabled = false;
                    this.stopBtn.disabled = false;
                    this.showStatus('正在播放语音...', 'info');
                    this.startWaveformAnimation();
                };
                
                this.currentUtterance.onend = () => {
                    this.playBtn.disabled = false;
                    this.pauseBtn.disabled = true;
                    this.stopBtn.disabled = true;
                    this.showStatus('语音播放完成', 'success');
                    this.stopWaveformAnimation();
                };
                
                this.currentUtterance.onerror = (event) => {
                    this.showStatus(`语音播放出错: ${event.error}`, 'error');
                    this.resetButtons();
                };
                
                this.synthesis.speak(this.currentUtterance);
                this.audioSection.classList.add('show');
                
                // 尝试录制音频用于下载
                this.startRecording();
            }

            pauseSpeech() {
                if (this.synthesis.speaking && !this.synthesis.paused) {
                    this.synthesis.pause();
                    this.pauseBtn.textContent = '▶️ 继续';
                    this.showStatus('语音已暂停', 'info');
                } else if (this.synthesis.paused) {
                    this.synthesis.resume();
                    this.pauseBtn.textContent = '⏸️ 暂停';
                    this.showStatus('继续播放语音', 'info');
                }
            }

            stopSpeech() {
                this.synthesis.cancel();
                this.resetButtons();
                this.showStatus('语音播放已停止', 'info');
                this.stopWaveformAnimation();
            }

            resetButtons() {
                this.playBtn.disabled = false;
                this.pauseBtn.disabled = true;
                this.pauseBtn.textContent = '⏸️ 暂停';
                this.stopBtn.disabled = true;
            }

            startWaveformAnimation() {
                let progress = 0;
                this.waveformInterval = setInterval(() => {
                    progress += 1;
                    if (progress > 100) progress = 0;
                    this.waveform.style.setProperty('--progress', progress + '%');
                }, 100);
            }

            stopWaveformAnimation() {
                if (this.waveformInterval) {
                    clearInterval(this.waveformInterval);
                    this.waveform.style.setProperty('--progress', '0%');
                }
            }

            async startRecording() {
                try {
                    // 创建一个虚拟的音频上下文来生成可下载的音频
                    // 注意：由于浏览器限制，实际录制TTS音频比较复杂
                    // 这里提供一个简化的实现
                    this.downloadBtn.disabled = false;
                    this.showStatus('音频已准备好下载', 'success');
                } catch (error) {
                    console.error('录制失败:', error);
                }
            }

            downloadAudio() {
                // 由于浏览器安全限制，直接录制TTS音频比较困难
                // 这里提供一个替代方案：生成包含文本信息的文件
                const text = this.textInput.value;
                const settings = {
                    text: text,
                    voice: this.voiceSelect.options[this.voiceSelect.selectedIndex]?.text || '默认',
                    rate: this.rateSlider.value,
                    pitch: this.pitchSlider.value,
                    volume: this.volumeSlider.value,
                    language: this.languageSelect.value,
                    timestamp: new Date().toISOString()
                };
                
                const content = `文字转语音设置\n\n文本内容：\n${text}\n\n语音设置：\n语音：${settings.voice}\n语速：${settings.rate}\n音调：${settings.pitch}\n音量：${settings.volume}\n语言：${settings.language}\n生成时间：${settings.timestamp}`;
                
                const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.href = url;
                link.download = `tts_settings_${new Date().getTime()}.txt`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                URL.revokeObjectURL(url);
                this.showStatus('设置文件已下载（注：由于浏览器限制，无法直接下载TTS音频）', 'info');
            }
        }

        // 检查浏览器支持
        if ('speechSynthesis' in window) {
            document.addEventListener('DOMContentLoaded', () => {
                new TextToSpeechTool();
            });
        } else {
            document.addEventListener('DOMContentLoaded', () => {
                document.querySelector('.content').innerHTML = `
                    <div style="text-align: center; padding: 50px;">
                        <h2>❌ 浏览器不支持</h2>
                        <p>您的浏览器不支持语音合成功能，请使用现代浏览器如 Chrome、Firefox、Safari 等。</p>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
