<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时区转换器 - 美好人生工具站</title>
    <meta name="description" content="在线时区转换工具，轻松转换全球各地时间，方便国际交流和日程安排">
    <meta name="keywords" content="时区转换, 世界时间, 时差计算, 国际时间, timezone converter">
    <meta property="og:title" content="时区转换器">
    <meta property="og:description" content="在线时区转换工具，轻松转换全球各地时间">
    <meta property="og:type" content="website">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --accent: #4a90d9;
            --accent-hover: #357abd;
            --border: #e0e0e0;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --text-primary: #eaeaea;
            --text-secondary: #b0b0b0;
            --accent: #4a90d9;
            --accent-hover: #5da0e9;
            --border: #2a2a4a;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 80px;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn-icon {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            color: var(--text-primary);
            font-size: 1.2rem;
            transition: all 0.2s;
        }

        .btn-icon:hover {
            background: var(--accent);
            color: white;
        }

        .card {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 10px var(--shadow);
        }

        .timezone-section {
            margin-bottom: 20px;
        }

        .timezone-section:last-child {
            margin-bottom: 0;
        }

        .section-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-label .icon {
            font-size: 1.1rem;
        }

        .timezone-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 500px) {
            .timezone-row {
                grid-template-columns: 1fr;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        select, input {
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            background: var(--bg-primary);
            color: var(--text-primary);
            width: 100%;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 24px 0;
        }

        .divider-icon {
            background: var(--accent);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .divider-icon:hover {
            transform: rotate(180deg);
        }

        .result-display {
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            border-radius: 12px;
            padding: 20px;
            color: white;
            text-align: center;
        }

        .result-time {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .result-date {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .result-diff {
            margin-top: 12px;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .quick-times {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
        }

        .quick-time-btn {
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-time-btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .common-zones {
            margin-top: 30px;
        }

        .common-zones h3 {
            font-size: 1rem;
            margin-bottom: 16px;
            color: var(--text-secondary);
        }

        .zone-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
        }

        .zone-card {
            background: var(--bg-primary);
            border-radius: 10px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .zone-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .zone-card .city {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .zone-card .time {
            font-size: 1.3rem;
            color: var(--accent);
        }

        .zone-card .date {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>时区转换器</h1>
            <div class="header-actions">
                <button class="btn-icon" id="useCurrentTime" title="使用当前时间">🕐</button>
                <button class="btn-icon" id="themeToggle" title="切换主题">🌙</button>
            </div>
        </header>

        <div class="card">
            <div class="timezone-section">
                <div class="section-label">
                    <span class="icon">📍</span>
                    <span>源时区 (A 地区)</span>
                </div>
                <div class="timezone-row">
                    <div class="input-group">
                        <label>选择时区</label>
                        <select id="sourceTimezone"></select>
                    </div>
                    <div class="input-group">
                        <label>日期和时间</label>
                        <input type="datetime-local" id="sourceDateTime">
                    </div>
                </div>
                <div class="quick-times">
                    <button class="quick-time-btn" data-hour="9">09:00</button>
                    <button class="quick-time-btn" data-hour="10">10:00</button>
                    <button class="quick-time-btn" data-hour="14">14:00</button>
                    <button class="quick-time-btn" data-hour="15">15:00</button>
                    <button class="quick-time-btn" data-hour="19">19:00</button>
                    <button class="quick-time-btn" data-hour="20">20:00</button>
                </div>
            </div>

            <div class="divider">
                <div class="divider-icon" id="swapTimezones" title="交换时区">⇅</div>
            </div>

            <div class="timezone-section">
                <div class="section-label">
                    <span class="icon">🎯</span>
                    <span>目标时区 (B 地区)</span>
                </div>
                <div class="input-group" style="max-width: 400px;">
                    <label>选择时区</label>
                    <select id="targetTimezone"></select>
                </div>
            </div>

            <div class="result-display" style="margin-top: 24px;">
                <div class="result-time" id="resultTime">--:--</div>
                <div class="result-date" id="resultDate">请选择时间</div>
                <div class="result-diff" id="resultDiff"></div>
            </div>
        </div>

        <div class="card common-zones">
            <h3>常用城市当前时间</h3>
            <div class="zone-grid" id="commonZonesGrid"></div>
        </div>

    </div>

    <script>
        // 常用时区列表
        const timezones = [
            { id: 'Asia/Shanghai', name: '中国 (北京/上海)', city: '北京' },
            { id: 'Asia/Tokyo', name: '日本 (东京)', city: '东京' },
            { id: 'Asia/Seoul', name: '韩国 (首尔)', city: '首尔' },
            { id: 'Asia/Singapore', name: '新加坡', city: '新加坡' },
            { id: 'Asia/Hong_Kong', name: '中国香港', city: '香港' },
            { id: 'Asia/Taipei', name: '中国台北', city: '台北' },
            { id: 'Asia/Bangkok', name: '泰国 (曼谷)', city: '曼谷' },
            { id: 'Asia/Dubai', name: '阿联酋 (迪拜)', city: '迪拜' },
            { id: 'Asia/Kolkata', name: '印度 (新德里)', city: '新德里' },
            { id: 'Europe/London', name: '英国 (伦敦)', city: '伦敦' },
            { id: 'Europe/Paris', name: '法国 (巴黎)', city: '巴黎' },
            { id: 'Europe/Berlin', name: '德国 (柏林)', city: '柏林' },
            { id: 'Europe/Moscow', name: '俄罗斯 (莫斯科)', city: '莫斯科' },
            { id: 'America/New_York', name: '美国 (纽约)', city: '纽约' },
            { id: 'America/Los_Angeles', name: '美国 (洛杉矶)', city: '洛杉矶' },
            { id: 'America/Chicago', name: '美国 (芝加哥)', city: '芝加哥' },
            { id: 'America/Toronto', name: '加拿大 (多伦多)', city: '多伦多' },
            { id: 'America/Vancouver', name: '加拿大 (温哥华)', city: '温哥华' },
            { id: 'America/Sao_Paulo', name: '巴西 (圣保罗)', city: '圣保罗' },
            { id: 'Australia/Sydney', name: '澳大利亚 (悉尼)', city: '悉尼' },
            { id: 'Australia/Melbourne', name: '澳大利亚 (墨尔本)', city: '墨尔本' },
            { id: 'Pacific/Auckland', name: '新西兰 (奥克兰)', city: '奥克兰' },
            { id: 'Pacific/Honolulu', name: '美国 (夏威夷)', city: '夏威夷' },
            { id: 'UTC', name: 'UTC (协调世界时)', city: 'UTC' }
        ];

        // 常用城市展示
        const commonCities = [
            'Asia/Shanghai', 'America/New_York', 'Europe/London',
            'Asia/Tokyo', 'America/Los_Angeles', 'Australia/Sydney'
        ];

        // DOM 元素
        const sourceTimezoneEl = document.getElementById('sourceTimezone');
        const targetTimezoneEl = document.getElementById('targetTimezone');
        const sourceDateTimeEl = document.getElementById('sourceDateTime');
        const resultTimeEl = document.getElementById('resultTime');
        const resultDateEl = document.getElementById('resultDate');
        const resultDiffEl = document.getElementById('resultDiff');
        const commonZonesGridEl = document.getElementById('commonZonesGrid');

        // 初始化时区选择器
        function initTimezoneSelectors() {
            timezones.forEach(tz => {
                const option1 = new Option(tz.name, tz.id);
                const option2 = new Option(tz.name, tz.id);
                sourceTimezoneEl.add(option1);
                targetTimezoneEl.add(option2);
            });

            // 默认值：源时区为用户本地，目标时区为纽约
            const userTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            sourceTimezoneEl.value = timezones.find(tz => tz.id === userTimezone)?.id || 'Asia/Shanghai';
            targetTimezoneEl.value = 'America/New_York';
        }

        // 设置当前时间
        function setCurrentTime() {
            const now = new Date();
            const sourceTimezone = sourceTimezoneEl.value;

            // 获取源时区的当前时间
            const formatter = new Intl.DateTimeFormat('sv-SE', {
                timeZone: sourceTimezone,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });

            const parts = formatter.formatToParts(now);
            const year = parts.find(p => p.type === 'year').value;
            const month = parts.find(p => p.type === 'month').value;
            const day = parts.find(p => p.type === 'day').value;
            const hour = parts.find(p => p.type === 'hour').value;
            const minute = parts.find(p => p.type === 'minute').value;

            sourceDateTimeEl.value = `${year}-${month}-${day}T${hour}:${minute}`;
            convertTime();
        }

        // 转换时间
        function convertTime() {
            const sourceTimezone = sourceTimezoneEl.value;
            const targetTimezone = targetTimezoneEl.value;
            const dateTimeValue = sourceDateTimeEl.value;

            if (!dateTimeValue) {
                resultTimeEl.textContent = '--:--';
                resultDateEl.textContent = '请选择时间';
                resultDiffEl.textContent = '';
                return;
            }

            // 创建源时区的日期对象
            const sourceDate = new Date(dateTimeValue);

            // 获取源时区的偏移量
            const sourceOffset = getTimezoneOffset(sourceDate, sourceTimezone);
            const localOffset = sourceDate.getTimezoneOffset();

            // 调整到正确的 UTC 时间
            const utcTime = new Date(sourceDate.getTime() + (localOffset + sourceOffset) * 60000);

            // 格式化目标时区时间
            const timeFormatter = new Intl.DateTimeFormat('zh-CN', {
                timeZone: targetTimezone,
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });

            const dateFormatter = new Intl.DateTimeFormat('zh-CN', {
                timeZone: targetTimezone,
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                weekday: 'long'
            });

            resultTimeEl.textContent = timeFormatter.format(utcTime);
            resultDateEl.textContent = dateFormatter.format(utcTime);

            // 计算时差
            const targetOffset = getTimezoneOffset(utcTime, targetTimezone);
            const diffHours = (targetOffset - sourceOffset) / 60;
            const diffText = diffHours > 0 ? `+${diffHours}` : diffHours;
            resultDiffEl.textContent = `时差: ${diffText} 小时`;
        }

        // 获取时区偏移（分钟）
        function getTimezoneOffset(date, timezone) {
            const utcDate = new Date(date.toLocaleString('en-US', { timeZone: 'UTC' }));
            const tzDate = new Date(date.toLocaleString('en-US', { timeZone: timezone }));
            return (tzDate - utcDate) / 60000;
        }

        // 更新常用城市时间
        function updateCommonZones() {
            const now = new Date();
            commonZonesGridEl.innerHTML = '';

            commonCities.forEach(tzId => {
                const tz = timezones.find(t => t.id === tzId);
                if (!tz) return;

                const timeFormatter = new Intl.DateTimeFormat('zh-CN', {
                    timeZone: tzId,
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false
                });

                const dateFormatter = new Intl.DateTimeFormat('zh-CN', {
                    timeZone: tzId,
                    month: 'short',
                    day: 'numeric',
                    weekday: 'short'
                });

                const card = document.createElement('div');
                card.className = 'zone-card';
                card.innerHTML = `
                    <div class="city">${tz.city}</div>
                    <div class="time">${timeFormatter.format(now)}</div>
                    <div class="date">${dateFormatter.format(now)}</div>
                `;
                card.onclick = () => {
                    targetTimezoneEl.value = tzId;
                    convertTime();
                };
                commonZonesGridEl.appendChild(card);
            });
        }

        // 交换时区
        document.getElementById('swapTimezones').onclick = () => {
            const temp = sourceTimezoneEl.value;
            sourceTimezoneEl.value = targetTimezoneEl.value;
            targetTimezoneEl.value = temp;
            setCurrentTime();
        };

        // 快捷时间按钮
        document.querySelectorAll('.quick-time-btn').forEach(btn => {
            btn.onclick = () => {
                const hour = btn.dataset.hour;
                const current = sourceDateTimeEl.value || new Date().toISOString().slice(0, 10);
                const date = current.slice(0, 10);
                sourceDateTimeEl.value = `${date}T${hour.padStart(2, '0')}:00`;
                convertTime();
            };
        });

        // 使用当前时间按钮
        document.getElementById('useCurrentTime').onclick = setCurrentTime;

        // 主题切换
        const themeToggle = document.getElementById('themeToggle');
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
            themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
        }

        themeToggle.onclick = () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        };

        // 事件监听
        sourceTimezoneEl.onchange = convertTime;
        targetTimezoneEl.onchange = convertTime;
        sourceDateTimeEl.onchange = convertTime;

        // 初始化
        initTheme();
        initTimezoneSelectors();
        setCurrentTime();
        updateCommonZones();

        // 每分钟更新常用城市时间
        setInterval(updateCommonZones, 60000);
    </script>
