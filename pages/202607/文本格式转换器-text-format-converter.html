<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本格式转换器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 30px;
            height: calc(100vh - 40px);
        }

        .sidebar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .main-content {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
        }

        .title {
            color: #4ade80;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 30px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .converter-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 25px;
            margin-bottom: 15px;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            box-shadow:
                0 8px 16px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .converter-button:hover {
            transform: translateY(-2px);
            box-shadow:
                0 12px 24px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .converter-button:active {
            transform: translateY(0);
            box-shadow:
                0 4px 8px rgba(0, 0, 0, 0.2),
                inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .btn-markdown {
            background: linear-gradient(135deg, #22c55e, #16a34a);
        }

        .btn-json {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        }

        .btn-csv {
            background: linear-gradient(135deg, #06b6d4, #0891b2);
        }

        .btn-xml {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
        }

        .btn-yaml {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }

        .btn-html {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .arrow {
            font-size: 18px;
            margin: 0 10px;
        }

        .format-label {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        .workspace {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .workspace-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .workspace-title {
            color: white;
            font-size: 20px;
            font-weight: 600;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .action-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .action-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .export-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        }

        .clear-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .clear-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .text-areas {
            display: flex;
            gap: 20px;
            flex: 1;
        }

        .text-area-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .text-area-label {
            color: white;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            opacity: 0.9;
        }

        .text-area {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 15px;
            color: white;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            outline: none;
            backdrop-filter: blur(5px);
        }

        .text-area::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .text-area:focus {
            border-color: #4ade80;
            box-shadow: 0 0 0 2px rgba(74, 222, 128, 0.2);
        }

        .status-bar {
            margin-top: 15px;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 12px;
            opacity: 0.8;
        }

        .active-converter {
            box-shadow:
                0 0 0 2px #4ade80,
                0 8px 16px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .text-areas {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="sidebar">
            <h1 class="title">文本格式转换器</h1>

            <button class="converter-button btn-markdown" data-type="markdown">
                <span>任意格式</span>
                <span class="arrow">→</span>
                <span class="format-label">MD</span>
            </button>

            <button class="converter-button btn-json" data-type="json">
                <span>任意格式</span>
                <span class="arrow">→</span>
                <span class="format-label">JSON</span>
            </button>

            <button class="converter-button btn-csv" data-type="csv">
                <span>任意格式</span>
                <span class="arrow">→</span>
                <span class="format-label">CSV</span>
            </button>

            <button class="converter-button btn-xml" data-type="xml">
                <span>任意格式</span>
                <span class="arrow">→</span>
                <span class="format-label">XML</span>
            </button>

            <button class="converter-button btn-yaml" data-type="yaml">
                <span>任意格式</span>
                <span class="arrow">→</span>
                <span class="format-label">YAML</span>
            </button>

            <button class="converter-button btn-html" data-type="html">
                <span>任意格式</span>
                <span class="arrow">→</span>
                <span class="format-label">HTML</span>
            </button>
        </div>

        <div class="main-content">
            <div class="workspace">
                <div class="workspace-header">
                    <h2 class="workspace-title">转换工作区</h2>
                    <div class="header-buttons">
                        <input type="file" id="fileInput" accept=".txt,.md,.json,.csv,.xml,.yaml,.yml,.html"
                            style="display: none;" onchange="importFile(event)">
                        <button class="action-btn import-btn" onclick="document.getElementById('fileInput').click()">
                            📁 导入文件
                        </button>
                        <button class="action-btn export-btn" onclick="exportFile()">
                            💾 导出结果
                        </button>
                        <button class="clear-btn" onclick="clearAll()">清空</button>
                    </div>
                </div>

                <div class="text-areas">
                    <div class="text-area-container">
                        <div class="text-area-label">输入文本</div>
                        <textarea id="inputText" class="text-area" placeholder="请输入要转换的文本内容..."
                            oninput="autoConvert()"></textarea>
                    </div>

                    <div class="text-area-container">
                        <div class="text-area-label">转换结果</div>
                        <textarea id="outputText" class="text-area" placeholder="转换结果将显示在这里..." readonly></textarea>
                    </div>
                </div>

                <div class="status-bar" id="statusBar">
                    请选择转换格式并输入文本
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentConverter = null;

        // 初始化转换器按钮事件
        document.querySelectorAll('.converter-button').forEach(button => {
            button.addEventListener('click', function () {
                // 移除之前的活动状态
                document.querySelectorAll('.converter-button').forEach(btn => {
                    btn.classList.remove('active-converter');
                });

                // 设置当前活动转换器
                this.classList.add('active-converter');
                currentConverter = this.dataset.type;

                // 更新状态栏
                updateStatus(`已选择 ${this.dataset.type.toUpperCase()} 转换器`);

                // 如果有输入内容，立即转换
                autoConvert();
            });
        });

        function autoConvert() {
            if (!currentConverter) return;

            const inputText = document.getElementById('inputText').value.trim();
            if (!inputText) {
                document.getElementById('outputText').value = '';
                return;
            }

            try {
                const result = convertText(inputText, currentConverter);
                document.getElementById('outputText').value = result;
                updateStatus(`转换成功 - ${currentConverter.toUpperCase()} 格式`);
            } catch (error) {
                document.getElementById('outputText').value = `转换错误: ${error.message}`;
                updateStatus(`转换失败: ${error.message}`);
            }
        }

        function convertText(text, targetFormat) {
            switch (targetFormat) {
                case 'markdown':
                    return convertToMarkdown(text);
                case 'json':
                    return convertToJSON(text);
                case 'csv':
                    return convertToCSV(text);
                case 'xml':
                    return convertToXML(text);
                case 'yaml':
                    return convertToYAML(text);
                case 'html':
                    return convertToHTML(text);
                default:
                    throw new Error('不支持的转换格式');
            }
        }

        function convertToMarkdown(text) {
            // 简单的文本到Markdown转换
            const lines = text.split('\n');
            let result = '';

            lines.forEach(line => {
                line = line.trim();
                if (!line) {
                    result += '\n';
                    return;
                }

                // 检测标题（以数字或特殊字符开头）
                if (/^[\d\-\*\#]/.test(line)) {
                    result += `## ${line}\n\n`;
                } else if (line.length < 50 && !line.includes('.') && !line.includes(',')) {
                    result += `### ${line}\n\n`;
                } else {
                    result += `${line}\n\n`;
                }
            });

            return result;
        }

        function convertToJSON(text) {
            // 尝试解析为JSON，如果失败则转换为简单对象
            try {
                const parsed = JSON.parse(text);
                return JSON.stringify(parsed, null, 2);
            } catch {
                const lines = text.split('\n').filter(line => line.trim());
                const obj = {};

                lines.forEach((line, index) => {
                    if (line.includes(':')) {
                        const [key, ...valueParts] = line.split(':');
                        obj[key.trim()] = valueParts.join(':').trim();
                    } else {
                        obj[`item_${index + 1}`] = line.trim();
                    }
                });

                return JSON.stringify(obj, null, 2);
            }
        }

        function convertToCSV(text) {
            const lines = text.split('\n').filter(line => line.trim());

            // 如果文本包含逗号，可能已经是CSV格式
            if (text.includes(',')) {
                return text;
            }

            // 转换为简单的CSV格式
            let csv = 'Field,Value\n';
            lines.forEach((line, index) => {
                if (line.includes(':')) {
                    const [key, ...valueParts] = line.split(':');
                    csv += `"${key.trim()}","${valueParts.join(':').trim()}"\n`;
                } else {
                    csv += `"Item ${index + 1}","${line.trim()}"\n`;
                }
            });

            return csv;
        }

        function convertToXML(text) {
            const lines = text.split('\n').filter(line => line.trim());
            let xml = '<?xml version="1.0" encoding="UTF-8"?>\n<root>\n';

            lines.forEach((line, index) => {
                if (line.includes(':')) {
                    const [key, ...valueParts] = line.split(':');
                    const cleanKey = key.trim().replace(/[^a-zA-Z0-9]/g, '_');
                    xml += `  <${cleanKey}>${valueParts.join(':').trim()}</${cleanKey}>\n`;
                } else {
                    xml += `  <item_${index + 1}>${line.trim()}</item_${index + 1}>\n`;
                }
            });

            xml += '</root>';
            return xml;
        }

        function convertToYAML(text) {
            const lines = text.split('\n').filter(line => line.trim());
            let yaml = '';

            lines.forEach(line => {
                if (line.includes(':')) {
                    const [key, ...valueParts] = line.split(':');
                    yaml += `${key.trim()}: ${valueParts.join(':').trim()}\n`;
                } else {
                    yaml += `- ${line.trim()}\n`;
                }
            });

            return yaml;
        }

        function convertToHTML(text) {
            const lines = text.split('\n');
            let html = '<!DOCTYPE html>\n<html>\n<head>\n  <meta charset="UTF-8">\n  <title>转换结果</title>\n</head>\n<body>\n';

            lines.forEach(line => {
                line = line.trim();
                if (!line) {
                    html += '  <br>\n';
                    return;
                }

                // 检测标题
                if (line.length < 50 && !line.includes('.') && !line.includes(',')) {
                    html += `  <h2>${line}</h2>\n`;
                } else {
                    html += `  <p>${line}</p>\n`;
                }
            });

            html += '</body>\n</html>';
            return html;
        }

        function clearAll() {
            document.getElementById('inputText').value = '';
            document.getElementById('outputText').value = '';
            updateStatus('已清空所有内容');
        }

        function updateStatus(message) {
            document.getElementById('statusBar').textContent = message;
        }

        // 文件导入功能
        function importFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                const content = e.target.result;
                document.getElementById('inputText').value = content;

                // 根据文件扩展名自动选择转换器
                const fileName = file.name.toLowerCase();
                const extension = fileName.split('.').pop();

                // 自动选择对应的转换器
                autoSelectConverter(extension);

                // 执行转换
                autoConvert();

                updateStatus(`已导入文件: ${file.name} (${(file.size / 1024).toFixed(2)} KB)`);
            };

            reader.onerror = function () {
                updateStatus('文件读取失败，请重试');
            };

            reader.readAsText(file, 'UTF-8');
        }

        // 根据文件扩展名自动选择转换器
        function autoSelectConverter(extension) {
            const converterMap = {
                'md': 'markdown',
                'markdown': 'markdown',
                'json': 'json',
                'csv': 'csv',
                'xml': 'xml',
                'yaml': 'yaml',
                'yml': 'yaml',
                'html': 'html',
                'htm': 'html'
            };

            const targetType = converterMap[extension];
            if (targetType) {
                // 移除之前的活动状态
                document.querySelectorAll('.converter-button').forEach(btn => {
                    btn.classList.remove('active-converter');
                });

                // 激活对应的转换器
                const targetButton = document.querySelector(`[data-type="${targetType}"]`);
                if (targetButton) {
                    targetButton.classList.add('active-converter');
                    currentConverter = targetType;
                    updateStatus(`已自动选择 ${targetType.toUpperCase()} 转换器`);
                }
            }
        }

        // 文件导出功能
        function exportFile() {
            const outputText = document.getElementById('outputText').value;
            if (!outputText.trim()) {
                updateStatus('没有可导出的内容');
                return;
            }

            if (!currentConverter) {
                updateStatus('请先选择转换格式');
                return;
            }

            // 根据转换格式确定文件扩展名和MIME类型
            const formatConfig = {
                'markdown': { ext: 'md', mime: 'text/markdown' },
                'json': { ext: 'json', mime: 'application/json' },
                'csv': { ext: 'csv', mime: 'text/csv' },
                'xml': { ext: 'xml', mime: 'application/xml' },
                'yaml': { ext: 'yaml', mime: 'text/yaml' },
                'html': { ext: 'html', mime: 'text/html' }
            };

            const config = formatConfig[currentConverter];
            if (!config) {
                updateStatus('不支持的导出格式');
                return;
            }

            // 创建下载链接
            const blob = new Blob([outputText], { type: config.mime + ';charset=utf-8' });
            const url = URL.createObjectURL(blob);

            // 生成文件名
            const timestamp = new Date().toISOString().slice(0, 19).replace(/[:-]/g, '');
            const filename = `converted_${timestamp}.${config.ext}`;

            // 创建临时下载链接
            const downloadLink = document.createElement('a');
            downloadLink.href = url;
            downloadLink.download = filename;
            downloadLink.style.display = 'none';

            // 触发下载
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);

            // 清理URL对象
            URL.revokeObjectURL(url);

            updateStatus(`文件已导出: ${filename}`);
        }

        // 拖拽上传功能
        function setupDragAndDrop() {
            const inputTextArea = document.getElementById('inputText');

            // 防止默认拖拽行为
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                inputTextArea.addEventListener(eventName, preventDefaults, false);
                document.body.addEventListener(eventName, preventDefaults, false);
            });

            // 高亮拖拽区域
            ['dragenter', 'dragover'].forEach(eventName => {
                inputTextArea.addEventListener(eventName, highlight, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                inputTextArea.addEventListener(eventName, unhighlight, false);
            });

            // 处理文件拖拽
            inputTextArea.addEventListener('drop', handleDrop, false);

            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }

            function highlight(e) {
                inputTextArea.style.borderColor = '#4ade80';
                inputTextArea.style.backgroundColor = 'rgba(74, 222, 128, 0.1)';
            }

            function unhighlight(e) {
                inputTextArea.style.borderColor = 'rgba(255, 255, 255, 0.2)';
                inputTextArea.style.backgroundColor = 'rgba(255, 255, 255, 0.1)';
            }

            function handleDrop(e) {
                const dt = e.dataTransfer;
                const files = dt.files;

                if (files.length > 0) {
                    const file = files[0];
                    const reader = new FileReader();

                    reader.onload = function (e) {
                        inputTextArea.value = e.target.result;

                        // 根据文件扩展名自动选择转换器
                        const fileName = file.name.toLowerCase();
                        const extension = fileName.split('.').pop();
                        autoSelectConverter(extension);

                        // 执行转换
                        autoConvert();

                        updateStatus(`已拖拽导入文件: ${file.name}`);
                    };

                    reader.readAsText(file, 'UTF-8');
                }
            }
        }

        // 复制功能
        document.getElementById('outputText').addEventListener('dblclick', function () {
            this.select();
            document.execCommand('copy');
            updateStatus('结果已复制到剪贴板');
        });

        // 键盘快捷键
        document.addEventListener('keydown', function (e) {
            // Ctrl+O 导入文件
            if (e.ctrlKey && e.key === 'o') {
                e.preventDefault();
                document.getElementById('fileInput').click();
            }

            // Ctrl+S 导出文件
            if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                exportFile();
            }

            // Ctrl+L 清空内容
            if (e.ctrlKey && e.key === 'l') {
                e.preventDefault();
                clearAll();
            }
        });

        // 初始化拖拽功能
        document.addEventListener('DOMContentLoaded', function () {
            setupDragAndDrop();
        });
    </script>
</body>

</html>
