<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>石头剪刀布 - 三局两胜制</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
            background-color: #f5f5f5;
            color: #333;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        
        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            background-color: #ecf0f1;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .score {
            font-size: 1.2em;
            font-weight: bold;
        }
        
        .round-info {
            margin-bottom: 15px;
            font-weight: bold;
        }
        
        .choices-container {
            display: flex;
            justify-content: center;
            margin: 30px 0;
        }
        
        .choices {
            display: flex;
            gap: 20px;
        }
        
        .choice {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #3498db;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .choice:hover {
            transform: scale(1.1);
            background-color: #2980b9;
        }
        
        .result {
            margin: 20px 0;
            font-size: 1.2em;
            min-height: 60px;
            padding: 10px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .game-over {
            font-size: 1.5em;
            font-weight: bold;
            color: #e74c3c;
            margin: 20px 0;
        }
        
        .reset-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }
        
        .reset-btn:hover {
            background-color: #c0392b;
        }
        
        .round-history {
            margin-top: 30px;
            text-align: left;
            background-color: #fff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .history-item {
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }
        
        @media (max-width: 480px) {
            .choices {
                gap: 10px;
            }
            
            .choice {
                width: 70px;
                height: 70px;
                font-size: 1.3em;
            }
        }
    </style>
</head>
<body>
    <h1>石头剪刀布</h1>
    <h3>三局两胜制</h3>
    
    <div class="score-board">
        <div class="player-score">
            <div>玩家</div>
            <div class="score" id="player-score">0</div>
        </div>
        <div class="computer-score">
            <div>电脑</div>
            <div class="score" id="computer-score">0</div>
        </div>
        <div class="round-count">
            <div>回合</div>
            <div class="score" id="round-count">0/3</div>
        </div>
    </div>
    
    <div class="round-info" id="round-info">请选择你的出拳...</div>
    <div class="result" id="result"></div>
    
    <div class="choices-container">
        <div class="choices">
            <div class="choice" data-choice="rock">✊</div>
            <div class="choice" data-choice="paper">✋</div>
            <div class="choice" data-choice="scissors">✌️</div>
        </div>
    </div>
    
    <div class="round-history">
        <h3>回合记录</h3>
        <div id="history"></div>
    </div>
    
    <button class="reset-btn" id="reset-btn">重新开始</button>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const choices = document.querySelectorAll('.choice');
            const playerScoreEl = document.getElementById('player-score');
            const computerScoreEl = document.getElementById('computer-score');
            const roundCountEl = document.getElementById('round-count');
            const roundInfoEl = document.getElementById('round-info');
            const resultEl = document.getElementById('result');
            const historyEl = document.getElementById('history');
            const resetBtn = document.getElementById('reset-btn');
            
            let playerScore = 0;
            let computerScore = 0;
            let roundCount = 0;
            let gameOver = false;
            
            function computerPlay() {
                const choices = ['rock', 'paper', 'scissors'];
                const randomIndex = Math.floor(Math.random() * 3);
                return choices[randomIndex];
            }
            
            function playRound(playerSelection, computerSelection) {
                if (playerSelection === computerSelection) {
                    return '平局';
                }
                
                if (
                    (playerSelection === 'rock' && computerSelection === 'scissors') ||
                    (playerSelection === 'paper' && computerSelection === 'rock') ||
                    (playerSelection === 'scissors' && computerSelection === 'paper')
                ) {
                    playerScore++;
                    return '你赢了';
                } else {
                    computerScore++;
                    return '电脑赢了';
                }
            }
            
            function checkGameOver() {
                // 检查是否有玩家达到2胜
                if (playerScore >= 2 || computerScore >= 2) {
                    return true;
                }
                // 检查是否达到3局
                if (roundCount >= 3) {
                    return true;
                }
                return false;
            }
            
            function updateScores() {
                playerScoreEl.textContent = playerScore;
                computerScoreEl.textContent = computerScore;
                roundCountEl.textContent = `${roundCount}/3`;
                
                if (checkGameOver()) {
                    gameOver = true;
                    let finalResult = '';
                    
                    if (playerScore >= 2) {
                        finalResult = '游戏结束！你获胜了！';
                    } else if (computerScore >= 2) {
                        finalResult = '游戏结束！电脑获胜！';
                    } else {
                        finalResult = '游戏结束！没有获胜方！';
                    }
                    
                    resultEl.innerHTML = `<div class="game-over">${finalResult}</div>`;
                }
            }
            
            function addHistory(playerChoice, computerChoice, result) {
                const emojiMap = {
                    rock: '✊',
                    paper: '✋',
                    scissors: '✌️'
                };
                
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                historyItem.textContent = `第${roundCount}局: 你出 ${emojiMap[playerChoice]} vs 电脑出 ${emojiMap[computerChoice]} - ${result}`;
                historyEl.prepend(historyItem);
            }
            
            function resetGame() {
                playerScore = 0;
                computerScore = 0;
                roundCount = 0;
                gameOver = false;
                playerScoreEl.textContent = '0';
                computerScoreEl.textContent = '0';
                roundCountEl.textContent = '0/3';
                roundInfoEl.textContent = '请选择你的出拳...';
                resultEl.textContent = '';
                historyEl.innerHTML = '';
            }
            
            choices.forEach(choice => {
                choice.addEventListener('click', function() {
                    if (gameOver) return;
                    
                    roundCount++;
                    const playerChoice = this.getAttribute('data-choice');
                    const computerChoice = computerPlay();
                    const result = playRound(playerChoice, computerChoice);
                    
                    roundInfoEl.textContent = `第${roundCount}局: 你出 ${this.textContent} vs 电脑出 ${computerChoice === 'rock' ? '✊' : computerChoice === 'paper' ? '✋' : '✌️'}`;
                    
                    if (checkGameOver()) {
                        updateScores();
                    }
                    
                    addHistory(playerChoice, computerChoice, result);
                });
            });
            
            resetBtn.addEventListener('click', resetGame);
        });
    </script>
</body>
</html>
