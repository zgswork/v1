<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>读书笔记时间线</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6', // 蓝色作为主色调，代表知识和学习
                        secondary: '#f97316', // 橙色作为辅助色，代表创造力
                        neutral: '#f8fafc', // 浅色背景
                        dark: '#1e293b', // 深色文本
                    },
                    fontFamily: {
                        inter: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    boxShadow: {
                        'card': '0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.03)',
                        'hover': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)',
                    }
                },
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .timeline-line {
                @apply absolute left-5 top-0 bottom-0 w-0.5 bg-primary/30;
            }
            .timeline-dot {
                @apply absolute left-5 top-4 w-3 h-3 rounded-full bg-primary border-2 border-white transform -translate-x-1/2 z-10;
            }
            .card-transition {
                @apply transition-all duration-300 ease-in-out;
            }
            .input-focus {
                @apply focus:ring-2 focus:ring-primary/50 focus:border-primary focus:outline-none;
            }
        }
    </style>
</head>
<body class="font-inter bg-gradient-to-br from-neutral to-blue-50 min-h-screen text-dark">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- 页面头部 -->
        <header class="text-center mb-10">
            <div class="inline-block p-4 bg-primary/10 rounded-full mb-6">
                <i class="fa fa-book text-3xl text-primary"></i>
            </div>
            <h1 class="text-[clamp(1.8rem,5vw,2.5rem)] font-bold text-dark mb-3">读书笔记时间线</h1>
            <p class="text-gray-600 max-w-2xl mx-auto">
                轻松记录多本书的阅读进度，按时间轴清晰展示您的阅读轨迹，告别混乱
            </p>
        </header>
        
        <!-- 主内容区 -->
        <main class="space-y-8">
            <!-- 添加笔记区域 -->
            <section class="bg-white rounded-2xl shadow-card p-6 md:p-8 card-transition hover:shadow-hover">
                <h2 class="text-xl font-semibold mb-6 flex items-center">
                    <i class="fa fa-pencil-square-o text-primary mr-2"></i> 添加阅读记录
                </h2>
                
                <form id="noteForm" class="space-y-5">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label for="bookTitle" class="block text-sm font-medium text-gray-700 mb-1">书名 <span class="text-red-500">*</span></label>
                            <input type="text" id="bookTitle" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus card-transition">
                        </div>
                        
                        <div>
                            <label for="pageNumber" class="block text-sm font-medium text-gray-700 mb-1">页码 <span class="text-red-500">*</span></label>
                            <input type="number" id="pageNumber" min="1" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus card-transition">
                        </div>
                        
                        <div class="md:col-span-2">
                            <label for="readingDate" class="block text-sm font-medium text-gray-700 mb-1">阅读日期 <span class="text-red-500">*</span></label>
                            <input type="date" id="readingDate" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus card-transition">
                        </div>
                        
                        <div class="md:col-span-2">
                            <label for="noteContent" class="block text-sm font-medium text-gray-700 mb-1">笔记内容</label>
                            <textarea id="noteContent" rows="4" placeholder="记录您的想法、感悟或重要内容..."
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus card-transition"></textarea>
                        </div>
                    </div>
                    
                    <div class="pt-2 flex justify-end">
                        <button type="submit" 
                            class="bg-primary hover:bg-primary/90 text-white font-medium py-2 px-6 rounded-lg card-transition flex items-center">
                            <i class="fa fa-save mr-2"></i> 保存记录
                        </button>
                    </div>
                </form>
            </section>
            
            <!-- 筛选和管理区域 -->
            <section class="bg-white rounded-2xl shadow-card p-6 md:p-8 card-transition">
                <div class="flex flex-col md:flex-row md:items-center justify-between mb-4">
                    <h2 class="text-xl font-semibold flex items-center">
                        <i class="fa fa-history text-primary mr-2"></i> 阅读时间线
                    </h2>
                    
                    <div class="flex flex-wrap gap-3 mt-4 md:mt-0">
                        <div class="relative">
                            <select id="bookFilter" 
                                class="pl-10 pr-4 py-2 border border-gray-300 rounded-lg input-focus card-transition appearance-none bg-white">
                                <option value="all">所有书籍</option>
                                <!-- 书籍选项将动态生成 -->
                            </select>
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fa fa-filter text-gray-500"></i>
                            </div>
                            <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                                <i class="fa fa-chevron-down text-gray-400 text-xs"></i>
                            </div>
                        </div>
                        
                        <button id="clearFilter" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 card-transition">
                            <i class="fa fa-times mr-1"></i> 清除筛选
                        </button>
                        
                        <button id="clearAll" class="px-4 py-2 border border-red-300 text-red-600 rounded-lg hover:bg-red-50 card-transition">
                            <i class="fa fa-trash mr-1"></i> 清空记录
                        </button>
                    </div>
                </div>
                
                <!-- 时间线展示区域 -->
                <div id="timelineContainer" class="relative pl-12 mt-6 space-y-8">
                    <!-- 时间轴线 -->
                    <div class="timeline-line"></div>
                    
                    <!-- 时间线内容将动态生成 -->
                    <div id="emptyState" class="py-16 text-center hidden">
                        <div class="inline-block p-4 bg-gray-100 rounded-full mb-4">
                            <i class="fa fa-book-open text-2xl text-gray-400"></i>
                        </div>
                        <h3 class="text-lg font-medium text-gray-500 mb-2">暂无阅读记录</h3>
                        <p class="text-gray-400 max-w-md mx-auto">
                            开始添加您的第一条阅读记录吧，所有数据将保存在本地
                        </p>
                    </div>
                    
                    <div id="timelineContent" class="space-y-8">
                        <!-- 动态生成的时间线项目 -->
                    </div>
                </div>
            </section>
        </main>
        
        <!-- 页脚信息 -->
        <footer class="mt-16 pt-8 border-t border-gray-200 text-center text-gray-600">
            <p class="mb-3">本工具由 邓文涛(AI版) 制作</p>
            <p class="mb-3">微信：707547441</p>
            <p class="mb-6">QQ邮箱：<a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="5b6c6b6c6e6f6c6f6f6a1b2a2a75383436">[email&#160;protected]</a></p>
        </footer>
    </div>
    
    <!-- 提示弹窗 -->
    <div id="toast" class="fixed bottom-6 right-6 transform translate-y-20 opacity-0 transition-all duration-300 flex items-center px-4 py-3 rounded-lg shadow-lg z-50 max-w-xs">
        <i class="fa fa-check-circle mr-2"></i>
        <span id="toastMessage"></span>
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 数据管理
        const ReadingData = {
            // 获取所有阅读记录
            getAll: function() {
                const data = localStorage.getItem('readingNotes');
                return data ? JSON.parse(data) : [];
            },
            
            // 保存阅读记录
            save: function(note) {
                const notes = this.getAll();
                // 添加唯一ID和时间戳
                note.id = Date.now().toString();
                notes.push(note);
                localStorage.setItem('readingNotes', JSON.stringify(notes));
                return note;
            },
            
            // 删除阅读记录
            delete: function(id) {
                let notes = this.getAll();
                notes = notes.filter(note => note.id !== id);
                localStorage.setItem('readingNotes', JSON.stringify(notes));
                return notes;
            },
            
            // 获取所有书籍名称
            getBooks: function() {
                const notes = this.getAll();
                const books = new Set();
                notes.forEach(note => books.add(note.bookTitle));
                return Array.from(books);
            },
            
            // 按书籍筛选记录
            filterByBook: function(bookTitle) {
                const notes = this.getAll();
                return bookTitle === 'all' 
                    ? notes 
                    : notes.filter(note => note.bookTitle === bookTitle);
            },
            
            // 清空所有记录
            clearAll: function() {
                localStorage.setItem('readingNotes', JSON.stringify([]));
            }
        };
        
        // DOM元素
        const noteForm = document.getElementById('noteForm');
        const bookTitleInput = document.getElementById('bookTitle');
        const pageNumberInput = document.getElementById('pageNumber');
        const readingDateInput = document.getElementById('readingDate');
        const noteContentInput = document.getElementById('noteContent');
        const timelineContent = document.getElementById('timelineContent');
        const emptyState = document.getElementById('emptyState');
        const bookFilter = document.getElementById('bookFilter');
        const clearFilterBtn = document.getElementById('clearFilter');
        const clearAllBtn = document.getElementById('clearAll');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        
        // 初始化页面
        function init() {
            // 设置默认日期为今天
            const today = new Date().toISOString().split('T')[0];
            readingDateInput.value = today;
            
            // 加载阅读记录
            renderTimeline();
            
            // 初始化书籍筛选器
            updateBookFilter();
            
            // 绑定事件监听
            bindEvents();
        }
        
        // 绑定事件
        function bindEvents() {
            // 表单提交
            noteForm.addEventListener('submit', function(e) {
                e.preventDefault();
                saveNote();
            });
            
            // 书籍筛选
            bookFilter.addEventListener('change', renderTimeline);
            
            // 清除筛选
            clearFilterBtn.addEventListener('click', function() {
                bookFilter.value = 'all';
                renderTimeline();
            });
            
            // 清空所有记录
            clearAllBtn.addEventListener('click', function() {
                if (confirm('确定要清空所有阅读记录吗？此操作不可恢复。')) {
                    ReadingData.clearAll();
                    renderTimeline();
                    updateBookFilter();
                    showToast('所有记录已清空');
                }
            });
            
            // 时间线内容区域事件委托（删除记录）
            timelineContent.addEventListener('click', function(e) {
                if (e.target.closest('.delete-note')) {
                    const id = e.target.closest('.note-item').dataset.id;
                    ReadingData.delete(id);
                    renderTimeline();
                    updateBookFilter();
                    showToast('记录已删除');
                }
            });
        }
        
        // 保存笔记
        function saveNote() {
            const bookTitle = bookTitleInput.value.trim();
            const pageNumber = pageNumberInput.value.trim();
            const readingDate = readingDateInput.value;
            const noteContent = noteContentInput.value.trim();
            
            if (!bookTitle || !pageNumber || !readingDate) {
                showToast('请填写必填字段', 'error');
                return;
            }
            
            const note = {
                bookTitle,
                pageNumber,
                readingDate,
                noteContent
            };
            
            ReadingData.save(note);
            
            // 重置表单
            noteForm.reset();
            readingDateInput.value = new Date().toISOString().split('T')[0];
            
            // 更新时间线和筛选器
            renderTimeline();
            updateBookFilter();
            
            showToast('阅读记录已保存');
        }
        
        // 渲染时间线
        function renderTimeline() {
            const selectedBook = bookFilter.value;
            let notes = ReadingData.filterByBook(selectedBook);
            
            // 按日期排序（最新的在前）
            notes.sort((a, b) => new Date(b.readingDate) - new Date(a.readingDate));
            
            // 清空时间线
            timelineContent.innerHTML = '';
            
            // 显示空状态或时间线内容
            if (notes.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');
            
            // 按日期分组显示
            let currentDate = '';
            notes.forEach(note => {
                // 格式化日期显示
                const formattedDate = formatDate(note.readingDate);
                
                // 如果是新的日期，添加日期标题
                if (formattedDate !== currentDate) {
                    currentDate = formattedDate;
                    const dateHeader = document.createElement('div');
                    dateHeader.className = 'text-primary font-semibold text-lg mt-6 mb-2';
                    dateHeader.textContent = formattedDate;
                    timelineContent.appendChild(dateHeader);
                }
                
                // 创建笔记项
                const noteItem = document.createElement('div');
                noteItem.className = 'note-item relative bg-white rounded-xl p-5 shadow-sm border border-gray-100 card-transition hover:shadow-md';
                noteItem.dataset.id = note.id;
                
                noteItem.innerHTML = `
                    <div class="timeline-dot"></div>
                    <div class="flex flex-col md:flex-row md:items-start justify-between gap-3">
                        <div class="flex-grow">
                            <div class="flex items-center gap-2 mb-2">
                                <h3 class="font-semibold text-lg text-dark">${escapeHtml(note.bookTitle)}</h3>
                                <span class="bg-primary/10 text-primary text-xs px-2 py-0.5 rounded-full">
                                    第 ${note.pageNumber} 页
                                </span>
                            </div>
                            ${note.noteContent ? `
                                <p class="text-gray-600 text-sm mb-3">${escapeHtml(note.noteContent)}</p>
                            ` : ''}
                            <div class="text-xs text-gray-500">
                                ${formatDateTime(note.readingDate)}
                            </div>
                        </div>
                        <button class="delete-note text-gray-400 hover:text-red-500 self-start card-transition p-1">
                            <i class="fa fa-trash-o"></i>
                        </button>
                    </div>
                `;
                
                timelineContent.appendChild(noteItem);
                
                // 添加入场动画
                setTimeout(() => {
                    noteItem.style.opacity = '1';
                    noteItem.style.transform = 'translateX(0)';
                }, 50);
            });
        }
        
        // 更新书籍筛选器
        function updateBookFilter() {
            // 保存当前选中值
            const currentValue = bookFilter.value;
            
            // 清除现有选项（保留"所有书籍"）
            while (bookFilter.options.length > 1) {
                bookFilter.remove(1);
            }
            
            // 添加书籍选项
            const books = ReadingData.getBooks();
            books.forEach(book => {
                const option = document.createElement('option');
                option.value = book;
                option.textContent = book;
                bookFilter.appendChild(option);
            });
            
            // 恢复选中值或默认值
            if (books.includes(currentValue)) {
                bookFilter.value = currentValue;
            } else {
                bookFilter.value = 'all';
            }
        }
        
        // 显示提示信息
        function showToast(message, type = 'success') {
            toastMessage.textContent = message;
            
            // 设置提示样式
            if (type === 'success') {
                toast.className = 'fixed bottom-6 right-6 transform translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-3 rounded-lg shadow-lg z-50 max-w-xs bg-green-500 text-white';
                toast.querySelector('i').className = 'fa fa-check-circle mr-2';
            } else {
                toast.className = 'fixed bottom-6 right-6 transform translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-3 rounded-lg shadow-lg z-50 max-w-xs bg-red-500 text-white';
                toast.querySelector('i').className = 'fa fa-exclamation-circle mr-2';
            }
            
            // 3秒后隐藏提示
            setTimeout(() => {
                toast.className = 'fixed bottom-6 right-6 transform translate-y-20 opacity-0 transition-all duration-300 flex items-center px-4 py-3 rounded-lg shadow-lg z-50 max-w-xs';
            }, 3000);
        }
        
        // 格式化日期为"YYYY年MM月DD日"
        function formatDate(dateString) {
            const date = new Date(dateString);
            return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
        }
        
        // 格式化日期时间为"YYYY-MM-DD HH:MM"
        function formatDateTime(dateString) {
            const date = new Date(dateString);
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')} ${hours}:${minutes}`;
        }
        
        // HTML转义，防止XSS
        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
