<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>感谢礼物记录 | 回礼提醒工具</title>
    <!-- 引入Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 引入Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    
    <!-- 配置Tailwind自定义颜色和工具类 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',     // 主色调：蓝色
                        secondary: '#10b981',   // 辅助色：绿色
                        accent: '#f59e0b',      // 强调色：橙色
                        neutral: '#64748b',     // 中性色：灰色
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .card-shadow {
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            }
            .star-rating .star {
                cursor: pointer;
                transition: color 0.2s;
            }
            .image-preview-container {
                min-height: 120px;
            }
            .gift-image {
                object-fit: cover;
                transition: transform 0.2s;
            }
            .gift-image:hover {
                transform: scale(1.02);
            }
        }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800 min-h-screen flex flex-col">
    <div class="max-w-5xl w-full mx-auto px-4 py-6 flex-grow">
        <!-- 头部标题 -->
        <header class="text-center mb-8">
            <h1 class="text-[clamp(1.8rem,5vw,2.5rem)] font-bold text-gray-800 mb-2">
                <i class="fa fa-gift text-primary mr-2"></i>感谢礼物记录
            </h1>
            <p class="text-gray-500 max-w-xl mx-auto">记录收到的礼物信息，设置回礼提醒，维系良好人际关系</p>
        </header>

        <main class="space-y-8">
            <!-- 回礼提醒区 -->
            <section id="reminderSection" class="bg-white rounded-xl p-6 card-shadow transition-all duration-300 hover:shadow-lg">
                <h2 class="text-xl font-bold mb-4 flex items-center">
                    <i class="fa fa-bell text-accent mr-2"></i>回礼提醒
                </h2>
                
                <div id="remindersList" class="space-y-4">
                    <!-- 提醒将通过JS动态生成 -->
                    <div class="text-center text-gray-500 py-6 border border-dashed border-gray-200 rounded-lg">
                        <i class="fa fa-calendar-check-o text-2xl mb-2"></i>
                        <p>暂无需要回礼的提醒，添加礼物记录并设置重要日期即可获得提醒</p>
                    </div>
                </div>
            </section>
            
            <!-- 礼物记录表单 -->
            <section class="bg-white rounded-xl p-6 card-shadow transition-all duration-300 hover:shadow-lg">
                <h2 class="text-xl font-bold mb-4 flex items-center">
                    <i class="fa fa-pencil-square-o text-primary mr-2"></i>添加礼物记录
                </h2>
                
                <form id="giftForm" class="space-y-5">
                    <input type="hidden" id="giftId">
                    <input type="hidden" id="giftImageData">
                    
                    <!-- 赠送人信息 -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label for="giverName" class="block text-gray-700 font-medium mb-2">
                                赠送人 <span class="text-red-500">*</span>
                            </label>
                            <input 
                                type="text" 
                                id="giverName" 
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none"
                                placeholder="是谁送的礼物？"
                                required
                            >
                        </div>
                        
                        <div>
                            <label for="giverContact" class="block text-gray-700 font-medium mb-2">
                                联系方式
                            </label>
                            <input 
                                type="text" 
                                id="giverContact" 
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none"
                                placeholder="电话、微信等联系方式"
                            >
                        </div>
                    </div>
                    
                    <!-- 礼物信息和图片 -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                        <div class="md:col-span-2">
                            <label for="giftName" class="block text-gray-700 font-medium mb-2">
                                礼物名称 <span class="text-red-500">*</span>
                            </label>
                            <input 
                                type="text" 
                                id="giftName" 
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none"
                                placeholder="收到了什么礼物？"
                                required
                            >
                        </div>
                        
                        <div>
                            <label class="block text-gray-700 font-medium mb-2">
                                礼物图片
                            </label>
                            <div class="flex items-center justify-center w-full">
                                <label for="giftImageUpload" class="flex flex-col items-center justify-center w-full h-20 border-2 border-dashed border-gray-300 rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 transition-colors">
                                    <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                        <i class="fa fa-cloud-upload text-gray-400 mb-2"></i>
                                        <p class="mb-2 text-sm text-gray-500"><span class="font-semibold">点击上传</span> 或拖放</p>
                                        <p class="text-xs text-gray-500">支持 PNG, JPG, GIF (最大 5MB)</p>
                                    </div>
                                    <input id="giftImageUpload" type="file" accept="image/*" class="hidden" />
                                </label>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 图片预览 -->
                    <div id="imagePreviewContainer" class="image-preview-container border border-gray-200 rounded-lg p-3 hidden">
                        <div class="flex items-center justify-between mb-2">
                            <h4 class="text-sm font-medium text-gray-700">图片预览</h4>
                            <button type="button" id="removeImageBtn" class="text-red-500 text-sm hover:text-red-700 transition-colors">
                                <i class="fa fa-times mr-1"></i>移除图片
                            </button>
                        </div>
                        <div class="flex flex-wrap gap-3">
                            <img id="imagePreview" src="" alt="礼物图片预览" class="max-h-40 rounded-lg border border-gray-100 gift-image">
                        </div>
                    </div>
                    
                    <!-- 场合和日期 -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label for="occasion" class="block text-gray-700 font-medium mb-2">
                                赠送场合 <span class="text-red-500">*</span>
                            </label>
                            <select 
                                id="occasion" 
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none appearance-none bg-white"
                                required
                            >
                                <option value="" disabled selected>请选择赠送场合</option>
                                <option value="birthday">生日</option>
                                <option value="festival">节日</option>
                                <option value="visit">探访</option>
                                <option value="congratulation">祝贺</option>
                                <option value="thankyou">感谢</option>
                                <option value="other">其他</option>
                            </select>
                        </div>
                        
                        <div>
                            <label for="receiveDate" class="block text-gray-700 font-medium mb-2">
                                收到日期 <span class="text-red-500">*</span>
                            </label>
                            <input 
                                type="date" 
                                id="receiveDate" 
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none"
                                required
                            >
                        </div>
                    </div>
                    
                    <!-- 喜好度和备注 -->
                    <div>
                        <label class="block text-gray-700 font-medium mb-2">
                            喜好度
                        </label>
                        <div id="rating" class="star-rating flex text-gray-300">
                            <span class="star text-2xl mr-1" data-value="1"><i class="fa fa-star"></i></span>
                            <span class="star text-2xl mr-1" data-value="2"><i class="fa fa-star"></i></span>
                            <span class="star text-2xl mr-1" data-value="3"><i class="fa fa-star"></i></span>
                            <span class="star text-2xl mr-1" data-value="4"><i class="fa fa-star"></i></span>
                            <span class="star text-2xl" data-value="5"><i class="fa fa-star"></i></span>
                            <input type="hidden" id="ratingValue" value="3">
                        </div>
                    </div>
                    
                    <!-- 回礼提醒设置 -->
                    <div>
                        <label for="importantDate" class="block text-gray-700 font-medium mb-2">
                            对方重要日期（用于回礼提醒）
                        </label>
                        <input 
                            type="date" 
                            id="importantDate" 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none"
                        >
                        <p class="text-sm text-gray-500 mt-1">设置对方生日等重要日期，将在日期前提醒您准备回礼</p>
                    </div>
                    
                    <!-- 备注信息 -->
                    <div>
                        <label for="notes" class="block text-gray-700 font-medium mb-2">
                            备注
                        </label>
                        <textarea 
                            id="notes" 
                            rows="3" 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none"
                            placeholder="记录其他重要信息，如对方的喜好、忌讳等..."></textarea>
                    </div>
                    
                    <!-- 提交按钮 -->
                    <div class="text-center pt-2">
                        <button type="submit" id="saveGiftBtn" class="px-6 py-3 bg-primary text-white rounded-lg shadow transition-all duration-300 hover:bg-primary/90 hover:shadow-md">
                            <i class="fa fa-save mr-2"></i>保存记录
                        </button>
                        <button type="button" id="cancelEditBtn" class="px-6 py-3 bg-gray-100 text-gray-700 rounded-lg shadow transition-all duration-300 hover:bg-gray-200 hover:shadow-md ml-2 hidden">
                            取消
                        </button>
                    </div>
                </form>
            </section>
            
            <!-- 礼物记录列表 -->
            <section class="bg-white rounded-xl p-6 card-shadow transition-all duration-300 hover:shadow-lg">
                <h2 class="text-xl font-bold mb-4 flex items-center">
                    <i class="fa fa-history text-primary mr-2"></i>礼物记录
                </h2>
                
                <!-- 筛选和搜索 -->
                <div class="flex flex-col sm:flex-row gap-4 mb-6">
                    <div class="flex-grow">
                        <div class="relative">
                            <input 
                                type="text" 
                                id="searchGifts" 
                                class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none"
                                placeholder="搜索赠送人或礼物..."
                            >
                            <i class="fa fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        </div>
                    </div>
                    
                    <div>
                        <select 
                            id="filterOccasion" 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none appearance-none bg-white"
                        >
                            <option value="all">所有场合</option>
                            <option value="birthday">生日</option>
                            <option value="festival">节日</option>
                            <option value="visit">探访</option>
                            <option value="congratulation">祝贺</option>
                            <option value="thankyou">感谢</option>
                            <option value="other">其他</option>
                        </select>
                    </div>
                </div>
                
                <!-- 记录列表 -->
                <div id="giftsList" class="space-y-4">
                    <!-- 记录将通过JS动态生成 -->
                    <div class="text-center text-gray-500 py-8 border border-dashed border-gray-200 rounded-lg">
                        <i class="fa fa-box text-3xl mb-2"></i>
                        <p>还没有记录哦，开始添加您收到的第一个礼物吧！</p>
                    </div>
                </div>
                
                <!-- 清空记录按钮 -->
                <div class="text-center mt-6">
                    <button id="clearGiftsBtn" class="text-gray-500 hover:text-red-500 text-sm transition-colors flex items-center justify-center">
                        <i class="fa fa-trash-o mr-1"></i> 清空所有记录
                    </button>
                </div>
            </section>
            
            <!-- 统计分析 -->
            <section class="bg-white rounded-xl p-6 card-shadow transition-all duration-300 hover:shadow-lg">
                <h2 class="text-xl font-bold mb-4 flex items-center">
                    <i class="fa fa-pie-chart text-primary mr-2"></i>统计分析
                </h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- 场合分布 -->
                    <div class="h-[300px]">
                        <h3 class="text-sm font-medium text-gray-500 mb-3">礼物场合分布</h3>
                        <canvas id="occasionChart"></canvas>
                    </div>
                    
                    <!-- 喜好度分布 -->
                    <div class="h-[300px]">
                        <h3 class="text-sm font-medium text-gray-500 mb-3">礼物喜好度分布</h3>
                        <canvas id="ratingChart"></canvas>
                    </div>
                </div>
            </section>
        </main>
    </div>
    
    <!-- 底部备注 -->
    <footer class="mt-10 py-4 border-t border-gray-200">
        <div class="max-w-5xl mx-auto px-4 text-center text-gray-600 text-sm">
            <p>
                邓文涛(AI版) | <a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="bb8c8b8c8e8f8c8f8f8afbcaca95d8d4d6">[email&#160;protected]</a> | VX：707547441 | 更多点击➡️
                <a href="https://dkfile.com/Dx25214" target="_blank" rel="noopener" class="text-primary hover:underline">🌌</a>
            </p>
        </div>
    </footer>
    
    <!-- 提示弹窗 -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs">
        <i class="fa fa-check-circle mr-2"></i>
        <span id="toastMessage"></span>
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 礼物记录工具主类
        const GiftTracker = {
            // 初始化
            init() {
                // 设置默认日期为今天
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('receiveDate').value = today;
                
                // 从本地存储加载数据
                this.gifts = JSON.parse(localStorage.getItem('giftRecords') || '[]');
                this.editingId = null;
                
                // 初始化事件监听
                this.initEventListeners();
                
                // 渲染页面
                this.renderGifts();
                this.renderReminders();
                this.initCharts();
                this.updateCharts();
            },
            
            // 初始化事件监听
            initEventListeners() {
                // 星级评分
                document.querySelectorAll('#rating .star').forEach(star => {
                    star.addEventListener('click', (e) => {
                        const value = e.currentTarget.dataset.value;
                        this.setRating(value);
                    });
                });
                
                // 图片上传
                const imageUpload = document.getElementById('giftImageUpload');
                imageUpload.addEventListener('change', (e) => {
                    this.handleImageUpload(e);
                });
                
                // 移除图片
                document.getElementById('removeImageBtn').addEventListener('click', () => {
                    this.removeImage();
                });
                
                // 表单提交
                document.getElementById('giftForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.saveGift();
                });
                
                // 取消编辑
                document.getElementById('cancelEditBtn').addEventListener('click', () => {
                    this.cancelEdit();
                });
                
                // 搜索和筛选
                document.getElementById('searchGifts').addEventListener('input', () => {
                    this.renderGifts();
                });
                
                document.getElementById('filterOccasion').addEventListener('change', () => {
                    this.renderGifts();
                });
                
                // 清空记录
                document.getElementById('clearGiftsBtn').addEventListener('click', () => {
                    if (confirm('确定要清空所有记录吗？此操作不可恢复。')) {
                        this.clearAllGifts();
                    }
                });
            },
            
            // 处理图片上传
            handleImageUpload(event) {
                const file = event.target.files[0];
                if (!file) return;
                
                // 检查文件类型
                if (!file.type.startsWith('image/')) {
                    this.showToast('请上传图片文件', 'error');
                    return;
                }
                
                // 检查文件大小（限制5MB）
                if (file.size > 5 * 1024 * 1024) {
                    this.showToast('图片大小不能超过5MB', 'error');
                    return;
                }
                
                const reader = new FileReader();
                
                reader.onload = (e) => {
                    // 显示预览
                    document.getElementById('imagePreview').src = e.target.result;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                    
                    // 保存图片数据
                    document.getElementById('giftImageData').value = e.target.result;
                };
                
                reader.readAsDataURL(file);
            },
            
            // 移除图片
            removeImage() {
                document.getElementById('imagePreview').src = '';
                document.getElementById('imagePreviewContainer').classList.add('hidden');
                document.getElementById('giftImageData').value = '';
                document.getElementById('giftImageUpload').value = '';
            },
            
            // 设置星级评分
            setRating(value) {
                document.getElementById('ratingValue').value = value;
                document.querySelectorAll('#rating .star').forEach(star => {
                    if (star.dataset.value <= value) {
                        star.classList.add('text-accent');
                        star.classList.remove('text-gray-300');
                    } else {
                        star.classList.remove('text-accent');
                        star.classList.add('text-gray-300');
                    }
                });
            },
            
            // 保存礼物记录
            saveGift() {
                // 获取表单数据
                const giftId = document.getElementById('giftId').value || Date.now().toString();
                const giverName = document.getElementById('giverName').value.trim();
                const giverContact = document.getElementById('giverContact').value.trim();
                const giftName = document.getElementById('giftName').value.trim();
                const occasion = document.getElementById('occasion').value;
                const receiveDate = document.getElementById('receiveDate').value;
                const rating = document.getElementById('ratingValue').value;
                const importantDate = document.getElementById('importantDate').value;
                const notes = document.getElementById('notes').value.trim();
                const imageData = document.getElementById('giftImageData').value;
                
                // 验证必填字段
                if (!giverName || !giftName || !occasion || !receiveDate) {
                    this.showToast('请填写所有必填字段', 'error');
                    return;
                }
                
                // 创建礼物对象
                const gift = {
                    id: giftId,
                    giverName,
                    giverContact,
                    giftName,
                    occasion,
                    receiveDate,
                    rating,
                    importantDate,
                    notes,
                    imageData,
                    createdAt: new Date().toISOString()
                };
                
                // 检查是新增还是编辑
                const existingIndex = this.gifts.findIndex(item => item.id === giftId);
                if (existingIndex >= 0) {
                    // 更新现有记录
                    this.gifts[existingIndex] = gift;
                } else {
                    // 添加新记录
                    this.gifts.push(gift);
                }
                
                // 保存到本地存储
                localStorage.setItem('giftRecords', JSON.stringify(this.gifts));
                
                // 更新UI
                this.renderGifts();
                this.renderReminders();
                this.updateCharts();
                
                // 重置表单
                this.cancelEdit();
                
                // 显示提示
                this.showToast(existingIndex >= 0 ? '记录已更新' : '记录已保存');
            },
            
            // 编辑礼物记录
            editGift(id) {
                const gift = this.gifts.find(item => item.id === id);
                if (!gift) return;
                
                // 填充表单
                document.getElementById('giftId').value = gift.id;
                document.getElementById('giverName').value = gift.giverName;
                document.getElementById('giverContact').value = gift.giverContact || '';
                document.getElementById('giftName').value = gift.giftName;
                document.getElementById('occasion').value = gift.occasion;
                document.getElementById('receiveDate').value = gift.receiveDate;
                this.setRating(gift.rating);
                document.getElementById('importantDate').value = gift.importantDate || '';
                document.getElementById('notes').value = gift.notes || '';
                
                // 处理图片
                if (gift.imageData) {
                    document.getElementById('giftImageData').value = gift.imageData;
                    document.getElementById('imagePreview').src = gift.imageData;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                } else {
                    this.removeImage();
                }
                
                // 显示取消按钮
                document.getElementById('cancelEditBtn').classList.remove('hidden');
                
                // 滚动到表单
                document.querySelector('form').scrollIntoView({ behavior: 'smooth' });
                
                this.editingId = id;
            },
            
            // 删除礼物记录
            deleteGift(id) {
                if (confirm('确定要删除这条记录吗？')) {
                    this.gifts = this.gifts.filter(item => item.id !== id);
                    localStorage.setItem('giftRecords', JSON.stringify(this.gifts));
                    
                    // 更新UI
                    this.renderGifts();
                    this.renderReminders();
                    this.updateCharts();
                    
                    // 如果正在编辑的记录被删除，重置表单
                    if (this.editingId === id) {
                        this.cancelEdit();
                    }
                    
                    this.showToast('记录已删除');
                }
            },
            
            // 取消编辑
            cancelEdit() {
                document.getElementById('giftForm').reset();
                document.getElementById('giftId').value = '';
                document.getElementById('receiveDate').value = new Date().toISOString().split('T')[0];
                this.setRating(3);
                this.removeImage();
                document.getElementById('cancelEditBtn').classList.add('hidden');
                this.editingId = null;
            },
            
            // 清空所有记录
            clearAllGifts() {
                if (this.gifts.length === 0) {
                    this.showToast('没有记录可清空', 'info');
                    return;
                }
                
                localStorage.removeItem('giftRecords');
                this.gifts = [];
                
                // 更新UI
                this.renderGifts();
                this.renderReminders();
                this.updateCharts();
                this.cancelEdit();
                
                this.showToast('所有记录已清空', 'info');
            },
            
            // 渲染礼物记录列表
            renderGifts() {
                const giftsList = document.getElementById('giftsList');
                const searchTerm = document.getElementById('searchGifts').value.toLowerCase();
                const filterOccasion = document.getElementById('filterOccasion').value;
                
                // 筛选礼物
                let filteredGifts = [...this.gifts];
                
                // 按搜索词筛选
                if (searchTerm) {
                    filteredGifts = filteredGifts.filter(gift => 
                        gift.giverName.toLowerCase().includes(searchTerm) || 
                        gift.giftName.toLowerCase().includes(searchTerm)
                    );
                }
                
                // 按场合筛选
                if (filterOccasion !== 'all') {
                    filteredGifts = filteredGifts.filter(gift => gift.occasion === filterOccasion);
                }
                
                // 按日期排序（最新的在前）
                filteredGifts.sort((a, b) => new Date(b.receiveDate) - new Date(a.receiveDate));
                
                if (filteredGifts.length === 0) {
                    giftsList.innerHTML = `
                        <div class="text-center text-gray-500 py-8 border border-dashed border-gray-200 rounded-lg">
                            <i class="fa fa-search text-3xl mb-2"></i>
                            <p>没有找到符合条件的记录</p>
                        </div>
                    `;
                    return;
                }
                
                // 生成记录HTML
                giftsList.innerHTML = '';
                filteredGifts.forEach(gift => {
                    const occasionName = this.getOccasionName(gift.occasion);
                    const formattedDate = this.formatDate(gift.receiveDate);
                    const ratingHtml = this.generateRatingHtml(gift.rating);
                    
                    // 图片HTML
                    const imageHtml = gift.imageData ? `
                        <div class="mt-2">
                            <img src="${gift.imageData}" alt="${gift.giftName}" class="h-32 rounded-lg border border-gray-100 gift-image">
                        </div>
                    ` : '';
                    
                    const giftElement = document.createElement('div');
                    giftElement.className = 'p-4 border border-gray-100 rounded-lg hover:border-gray-200 transition-all';
                    giftElement.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="font-semibold text-lg">${gift.giverName}</h3>
                                <p class="text-sm text-gray-500">赠送于 ${formattedDate}</p>
                            </div>
                            <div class="flex gap-1">
                                <button class="edit-gift p-1 text-gray-400 hover:text-primary transition-colors" data-id="${gift.id}">
                                    <i class="fa fa-pencil"></i>
                                </button>
                                <button class="delete-gift p-1 text-gray-400 hover:text-red-500 transition-colors" data-id="${gift.id}">
                                    <i class="fa fa-trash-o"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div class="mt-3">
                            <div class="flex flex-wrap gap-2 mb-2">
                                <span class="px-2 py-1 bg-primary/10 text-primary text-xs rounded-full">${gift.giftName}</span>
                                <span class="px-2 py-1 bg-gray-100 text-gray-700 text-xs rounded-full">${occasionName}</span>
                            </div>
                            
                            <div class="mb-2">${ratingHtml}</div>
                            
                            ${imageHtml}
                            
                            ${gift.importantDate ? `
                                <div class="text-sm text-accent flex items-center mt-2">
                                    <i class="fa fa-calendar mr-1"></i>
                                    重要日期：${this.formatDate(gift.importantDate)}
                                </div>
                            ` : ''}
                            
                            ${gift.notes ? `
                                <div class="mt-2 text-sm text-gray-600">
                                    <strong>备注：</strong>${gift.notes}
                                </div>
                            ` : ''}
                        </div>
                    `;
                    
                    giftsList.appendChild(giftElement);
                });
                
                // 添加编辑和删除事件监听器
                this.addGiftActionListeners();
            },
            
            // 添加礼物操作监听器
            addGiftActionListeners() {
                // 编辑礼物
                document.querySelectorAll('.edit-gift').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const giftId = e.currentTarget.dataset.id;
                        this.editGift(giftId);
                    });
                });
                
                // 删除礼物
                document.querySelectorAll('.delete-gift').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const giftId = e.currentTarget.dataset.id;
                        this.deleteGift(giftId);
                    });
                });
            },
            
            // 渲染回礼提醒
            renderReminders() {
                const remindersList = document.getElementById('remindersList');
                
                // 筛选有重要日期的礼物
                const giftsWithDates = this.gifts.filter(gift => gift.importantDate);
                
                if (giftsWithDates.length === 0) {
                    remindersList.innerHTML = `
                        <div class="text-center text-gray-500 py-6 border border-dashed border-gray-200 rounded-lg">
                            <i class="fa fa-calendar-check-o text-2xl mb-2"></i>
                            <p>暂无需要回礼的提醒，添加礼物记录并设置重要日期即可获得提醒</p>
                        </div>
                    `;
                    return;
                }
                
                // 计算提醒日期（重要日期前15天）
                const today = new Date();
                const upcomingGifts = giftsWithDates.map(gift => {
                    const importantDate = new Date(gift.importantDate);
                    // 处理年份，假设每年都需要提醒
                    const thisYearDate = new Date(importantDate);
                    thisYearDate.setFullYear(today.getFullYear());
                    
                    // 如果今年的日期已过，则取明年的
                    const reminderDate = thisYearDate < today 
                        ? new Date(importantDate.setFullYear(today.getFullYear() + 1))
                        : thisYearDate;
                    
                    // 提前15天提醒
                    const notificationDate = new Date(reminderDate);
                    notificationDate.setDate(notificationDate.getDate() - 15);
                    
                    return {
                        ...gift,
                        reminderDate,
                        notificationDate,
                        daysUntilNotification: Math.ceil((notificationDate - today) / (1000 * 60 * 60 * 24))
                    };
                })
                // 筛选出需要提醒的（通知日期在今天或未来30天内）
                .filter(gift => {
                    const daysUntil = gift.daysUntilNotification;
                    return daysUntil >= 0 && daysUntil <= 30;
                })
                // 按通知日期排序
                .sort((a, b) => a.notificationDate - b.notificationDate);
                
                if (upcomingGifts.length === 0) {
                    remindersList.innerHTML = `
                        <div class="text-center text-gray-500 py-6 border border-dashed border-gray-200 rounded-lg">
                            <i class="fa fa-calendar-o text-2xl mb-2"></i>
                            <p>近期没有需要准备的回礼，稍后再来查看吧</p>
                        </div>
                    `;
                    return;
                }
                
                // 生成提醒HTML
                remindersList.innerHTML = '';
                upcomingGifts.forEach(gift => {
                    const formattedReminderDate = this.formatDate(gift.reminderDate);
                    const occasionName = this.getOccasionName(gift.occasion);
                    let daysText = '';
                    
                    if (gift.daysUntilNotification === 0) {
                        daysText = '<span class="text-red-500 font-medium">今天需要准备回礼</span>';
                    } else if (gift.daysUntilNotification === 1) {
                        daysText = '<span class="text-orange-500 font-medium">明天需要准备回礼</span>';
                    } else if (gift.daysUntilNotification < 7) {
                        daysText = `<span class="text-orange-500">${gift.daysUntilNotification}天后需要准备回礼</span>`;
                    } else {
                        daysText = `${gift.daysUntilNotification}天后需要准备回礼`;
                    }
                    
                    const reminderElement = document.createElement('div');
                    reminderElement.className = 'p-4 border border-gray-100 rounded-lg hover:border-primary/30 transition-all';
                    reminderElement.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="font-semibold">${gift.giverName}</h3>
                                <p class="text-sm text-gray-500">重要日期：${formattedReminderDate}</p>
                            </div>
                            <div class="text-sm">${daysText}</div>
                        </div>
                        
                        <div class="mt-2">
                            <p class="text-sm"><strong>上次收到：</strong>${gift.giftName}（${occasionName}）</p>
                            <button class="mt-2 text-primary text-sm hover:underline edit-gift" data-id="${gift.id}">
                                <i class="fa fa-pencil mr-1"></i>编辑记录
                            </button>
                        </div>
                    `;
                    
                    remindersList.appendChild(reminderElement);
                });
                
                // 为提醒中的编辑按钮添加事件
                document.querySelectorAll('.edit-gift').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const giftId = e.currentTarget.dataset.id;
                        this.editGift(giftId);
                    });
                });
            },
            
            // 初始化图表
            initCharts() {
                // 场合分布图表
                const occasionCtx = document.getElementById('occasionChart').getContext('2d');
                this.occasionChart = new Chart(occasionCtx, {
                    type: 'doughnut',
                    data: {
                        labels: [],
                        datasets: [{
                            data: [],
                            backgroundColor: [
                                '#3b82f6', '#10b981', '#f59e0b', 
                                '#ef4444', '#8b5cf6', '#64748b'
                            ],
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'right',
                                labels: {
                                    boxWidth: 12,
                                    padding: 15
                                }
                            }
                        }
                    }
                });
                
                // 喜好度分布图表
                const ratingCtx = document.getElementById('ratingChart').getContext('2d');
                this.ratingChart = new Chart(ratingCtx, {
                    type: 'bar',
                    data: {
                        labels: ['1星', '2星', '3星', '4星', '5星'],
                        datasets: [{
                            label: '礼物数量',
                            data: [0, 0, 0, 0, 0],
                            backgroundColor: '#3b82f6',
                            borderRadius: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    precision: 0
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: false
                            }
                        }
                    }
                });
            },
            
            // 更新图表数据
            updateCharts() {
                if (!this.occasionChart || !this.ratingChart) return;
                
                // 更新场合分布图表
                const occasionCounts = {
                    birthday: 0,
                    festival: 0,
                    visit: 0,
                    congratulation: 0,
                    thankyou: 0,
                    other: 0
                };
                
                this.gifts.forEach(gift => {
                    if (occasionCounts.hasOwnProperty(gift.occasion)) {
                        occasionCounts[gift.occasion]++;
                    }
                });
                
                const occasionLabels = [];
                const occasionData = [];
                
                Object.keys(occasionCounts).forEach(key => {
                    if (occasionCounts[key] > 0) {
                        occasionLabels.push(this.getOccasionName(key));
                        occasionData.push(occasionCounts[key]);
                    }
                });
                
                this.occasionChart.data.labels = occasionLabels;
                this.occasionChart.data.datasets[0].data = occasionData;
                this.occasionChart.update();
                
                // 更新喜好度分布图表
                const ratingCounts = [0, 0, 0, 0, 0]; // 1-5星
                
                this.gifts.forEach(gift => {
                    const rating = parseInt(gift.rating);
                    if (rating >= 1 && rating <= 5) {
                        ratingCounts[rating - 1]++;
                    }
                });
                
                this.ratingChart.data.datasets[0].data = ratingCounts;
                this.ratingChart.update();
            },
            
            // 辅助函数：格式化日期
            formatDate(dateString) {
                const date = new Date(dateString);
                return `${date.getFullYear()}-${(date.getMonth() + 1).toString().padStart(2, '0')}-${date.getDate().toString().padStart(2, '0')}`;
            },
            
            // 辅助函数：获取场合名称
            getOccasionName(occasionKey) {
                const names = {
                    birthday: '生日',
                    festival: '节日',
                    visit: '探访',
                    congratulation: '祝贺',
                    thankyou: '感谢',
                    other: '其他'
                };
                return names[occasionKey] || '其他';
            },
            
            // 辅助函数：生成星级评分HTML
            generateRatingHtml(rating) {
                let html = '';
                for (let i = 1; i <= 5; i++) {
                    if (i <= rating) {
                        html += '<i class="fa fa-star text-accent"></i>';
                    } else {
                        html += '<i class="fa fa-star text-gray-300"></i>';
                    }
                }
                return html;
            },
            
            // 显示提示弹窗
            showToast(message, type = 'success') {
                const toast = document.getElementById('toast');
                const toastMsg = document.getElementById('toastMessage');
                
                toastMsg.textContent = message;
                
                // 设置样式
                if (type === 'success') {
                    toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs bg-green-500 text-white';
                    toast.querySelector('i').className = 'fa fa-check-circle mr-2';
                } else if (type === 'error') {
                    toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs bg-red-500 text-white';
                    toast.querySelector('i').className = 'fa fa-exclamation-circle mr-2';
                } else if (type === 'info') {
                    toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs bg-blue-500 text-white';
                    toast.querySelector('i').className = 'fa fa-info-circle mr-2';
                }
                
                // 3秒后隐藏
                setTimeout(() => {
                    toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs';
                }, 3000);
            }
        };
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            GiftTracker.init();
        });
    </script>
</body>
</html>
