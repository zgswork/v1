<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件差异对比工具</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            max-width: 1400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            margin-top: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.8rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            background: linear-gradient(45deg, #3498db, #2c3e50);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .description {
            color: #5a6c7d;
            font-size: 1.2rem;
            line-height: 1.6;
            font-weight: 500;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .upload-section {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .file-upload {
            flex: 1;
            min-width: 300px;
        }
        
        .panel {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        
        .panel-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #2c3e50;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .upload-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
            border: 2px dashed #3498db;
            border-radius: 12px;
            background: #f8f9fa;
            cursor: pointer;
            transition: all 0.3s;
            height: 200px;
        }
        
        .upload-container:hover {
            background: #e8f4fc;
            border-color: #2980b9;
        }
        
        .upload-icon {
            font-size: 3rem;
            color: #3498db;
            margin-bottom: 15px;
        }
        
        .upload-text {
            font-size: 1.1rem;
            color: #5a6c7d;
            text-align: center;
            margin-bottom: 15px;
        }
        
        .file-input {
            display: none;
        }
        
        .btn {
            background: linear-gradient(to right, #3498db, #2980b9);
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s;
            box-shadow: 0 4px 8px rgba(52, 152, 219, 0.3);
            border: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(52, 152, 219, 0.4);
        }
        
        .btn-primary {
            background: linear-gradient(to right, #2ecc71, #27ae60);
        }
        
        .btn-primary:hover {
            box-shadow: 0 6px 12px rgba(46, 204, 113, 0.4);
        }
        
        .btn-secondary {
            background: linear-gradient(to right, #e74c3c, #c0392b);
        }
        
        .btn-secondary:hover {
            box-shadow: 0 6px 12px rgba(231, 76, 60, 0.4);
        }
        
        .compare-section {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .file-content {
            flex: 1;
            min-width: 300px;
        }
        
        .content-container {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            background: #f8f9fa;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        
        .content-line {
            padding: 2px 0;
        }
        
        .content-line-added {
            background-color: #d4edda;
            color: #155724;
        }
        
        .content-line-removed {
            background-color: #f8d7da;
            color: #721c24;
        }
        
        .content-line-unchanged {
            color: #6c757d;
        }
        
        .char-added {
            background-color: #28a745;
            color: white;
            border-radius: 2px;
            padding: 0 2px;
        }
        
        .char-removed {
            background-color: #dc3545;
            color: white;
            border-radius: 2px;
            padding: 0 2px;
            text-decoration: line-through;
        }
        
        .diff-container {
            flex: 1;
            min-width: 300px;
        }
        
        .diff-result {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            background: #f8f9fa;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        
        .diff-line {
            padding: 2px 5px;
            margin: 1px 0;
            border-radius: 3px;
            white-space: pre-wrap;
        }
        
        .diff-added {
            background-color: #d4edda;
            color: #155724;
        }
        
        .diff-removed {
            background-color: #f8d7da;
            color: #721c24;
        }
        
        .diff-unchanged {
            color: #6c757d;
        }
        
        .diff-info {
            background-color: #e9ecef;
            color: #495057;
            font-weight: bold;
        }
        
        .file-info {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #5a6c7d;
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }
        
        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #3498db;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #5a6c7d;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            background: #2ecc71;
            color: white;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transform: translateX(100%);
            transition: transform 0.3s;
            z-index: 1000;
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        .line-number {
            display: inline-block;
            width: 40px;
            color: #6c757d;
            text-align: right;
            margin-right: 10px;
            user-select: none;
        }
        
        @media (max-width: 768px) {
            .upload-section {
                flex-direction: column;
            }
            
            .compare-section {
                flex-direction: column;
            }
            
            .stats-container {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .description {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-code-compare"></i> 文件差异对比工具</h1>
            <p class="description">上传两个文本文件，比较它们之间的差异</p>
        </header>
        
        <div class="upload-section">
            <div class="file-upload">
                <div class="panel">
                    <h2 class="panel-title"><i class="fas fa-file-upload"></i> 文件 A</h2>
                    <div class="upload-container" id="upload-a">
                        <i class="fas fa-cloud-upload-alt upload-icon"></i>
                        <p class="upload-text">点击或拖放第一个文件</p>
                        <button class="btn"><i class="fas fa-file"></i> 选择文件</button>
                        <input type="file" id="file-a" class="file-input" accept=".txt,.log,.js,.css,.html,.xml,.json,.java,.py">
                    </div>
                    <div class="file-info" id="file-info-a">尚未选择文件</div>
                </div>
                
                <div class="content-container" id="content-a">
                    // 文件A内容将显示在这里
                </div>
            </div>
            
            <div class="file-upload">
                <div class="panel">
                    <h2 class="panel-title"><i class="fas fa-file-upload"></i> 文件 B</h2>
                    <div class="upload-container" id="upload-b">
                        <i class="fas fa-cloud-upload-alt upload-icon"></i>
                        <p class="upload-text">点击或拖放第二个文件</p>
                        <button class="btn"><i class="fas fa-file"></i> 选择文件</button>
                        <input type="file" id="file-b" class="file-input" accept=".txt,.log,.js,.css,.html,.xml,.json,.java,.py">
                    </div>
                    <div class="file-info" id="file-info-b">尚未选择文件</div>
                </div>
                
                <div class="content-container" id="content-b">
                    // 文件B内容将显示在这里
                </div>
            </div>
        </div>
        
        <div class="action-buttons">
            <button class="btn btn-primary" id="compare-btn" disabled><i class="fas fa-code-compare"></i> 比较文件</button>
            <button class="btn" id="reset-btn"><i class="fas fa-redo"></i> 重置</button>
        </div>
        
        <div class="panel">
            <h2 class="panel-title"><i class="fas fa-file-diff"></i> 差异结果</h2>
            <div class="diff-result" id="diff-result">
                <div class="diff-line diff-info">请上传两个文件并点击"比较文件"按钮</div>
            </div>
        </div>
    </div>

    <div class="notification" id="notification">文件比较完成！</div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const fileInputA = document.getElementById('file-a');
            const fileInputB = document.getElementById('file-b');
            const uploadA = document.getElementById('upload-a');
            const uploadB = document.getElementById('upload-b');
            const fileInfoA = document.getElementById('file-info-a');
            const fileInfoB = document.getElementById('file-info-b');
            const contentA = document.getElementById('content-a');
            const contentB = document.getElementById('content-b');
            const compareBtn = document.getElementById('compare-btn');
            const resetBtn = document.getElementById('reset-btn');
            const diffResult = document.getElementById('diff-result');
            const totalLines = document.getElementById('total-lines');
            const addedLines = document.getElementById('added-lines');
            const removedLines = document.getElementById('removed-lines');
            const notification = document.getElementById('notification');
            
            let fileAContent = '';
            let fileBContent = '';
            
            // 上传区域点击事件
            uploadA.addEventListener('click', function() {
                fileInputA.click();
            });
            
            uploadB.addEventListener('click', function() {
                fileInputB.click();
            });
            
            // 拖放功能
            setupDragAndDrop(uploadA, fileInputA, function(content) {
                fileAContent = content;
                fileInfoA.textContent = `文件A已加载，行数: ${content.split('\n').length}`;
                contentA.textContent = content;
                checkCompareButton();
            });
            
            setupDragAndDrop(uploadB, fileInputB, function(content) {
                fileBContent = content;
                fileInfoB.textContent = `文件B已加载，行数: ${content.split('\n').length}`;
                contentB.textContent = content;
                checkCompareButton();
            });
            
            function setupDragAndDrop(uploadArea, input, callback) {
                uploadArea.addEventListener('dragover', function(e) {
                    e.preventDefault();
                    uploadArea.style.background = '#e1f5fe';
                    uploadArea.style.borderColor = '#0288d1';
                });
                
                uploadArea.addEventListener('dragleave', function() {
                    uploadArea.style.background = '#f8f9fa';
                    uploadArea.style.borderColor = '#3498db';
                });
                
                uploadArea.addEventListener('drop', function(e) {
                    e.preventDefault();
                    uploadArea.style.background = '#f8f9fa';
                    uploadArea.style.borderColor = '#3498db';
                    
                    if (e.dataTransfer.files.length) {
                        input.files = e.dataTransfer.files;
                        handleFileSelect(e.dataTransfer.files[0], callback);
                    }
                });
            }
            
            // 文件选择处理
            fileInputA.addEventListener('change', function(e) {
                if (e.target.files.length) {
                    handleFileSelect(e.target.files[0], function(content) {
                        fileAContent = content;
                        fileInfoA.textContent = `文件A: ${e.target.files[0].name}，行数: ${content.split('\n').length}`;
                        contentA.textContent = content;
                        checkCompareButton();
                    });
                }
            });
            
            fileInputB.addEventListener('change', function(e) {
                if (e.target.files.length) {
                    handleFileSelect(e.target.files[0], function(content) {
                        fileBContent = content;
                        fileInfoB.textContent = `文件B: ${e.target.files[0].name}，行数: ${content.split('\n').length}`;
                        contentB.textContent = content;
                        checkCompareButton();
                    });
                }
            });
            
            function handleFileSelect(file, callback) {
                if (!file.type.match('text.*') && !file.name.match(/\.(txt|log|js|css|html|xml|json|java|py)$/i)) {
                    showNotification('请上传文本文件！', 'error');
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    callback(e.target.result);
                };
                reader.readAsText(file);
            }
            
            function checkCompareButton() {
                compareBtn.disabled = !(fileAContent && fileBContent);
            }
            
            // 比较按钮点击事件
            compareBtn.addEventListener('click', function() {
                if (!fileAContent || !fileBContent) {
                    showNotification('请先上传两个文件！', 'error');
                    return;
                }
                
                const diff = compareFiles(fileAContent, fileBContent);
                displayDiff(diff);
                highlightContent(diff);
                showNotification('文件比较完成！');
            });
            
            // 高亮显示文件内容中的差异
            function highlightContent(diff) {
                // 清空当前内容
                contentA.innerHTML = '';
                contentB.innerHTML = '';
                
                // 分别处理文件A和文件B的内容
                diff.forEach(item => {
                    const lineDivA = document.createElement('div');
                    const lineDivB = document.createElement('div');
                    
                    if (item.type === 'unchanged') {
                        lineDivA.classList.add('content-line', 'content-line-unchanged');
                        lineDivB.classList.add('content-line', 'content-line-unchanged');
                        lineDivA.textContent = item.text;
                        lineDivB.textContent = item.text;
                    } else if (item.type === 'removed') {
                        lineDivA.classList.add('content-line', 'content-line-removed');
                        lineDivB.classList.add('content-line');
                        // 对于删除的行，我们进行字符级别的高亮
                        const span = document.createElement('span');
                        span.textContent = item.text;
                        lineDivA.appendChild(span);
                        lineDivB.textContent = '';
                    } else if (item.type === 'added') {
                        lineDivA.classList.add('content-line');
                        lineDivB.classList.add('content-line', 'content-line-added');
                        // 对于新增的行，我们进行字符级别的高亮
                        const span = document.createElement('span');
                        span.textContent = item.text;
                        lineDivB.appendChild(span);
                        lineDivA.textContent = '';
                    }
                    
                    contentA.appendChild(lineDivA);
                    contentB.appendChild(lineDivB);
                });
            }
            
            // 比较文件内容
            function compareFiles(contentA, contentB) {
                const linesA = contentA.split('\n');
                const linesB = contentB.split('\n');
                
                const diff = [];
                
                // 简单的行比较算法
                let i = 0, j = 0;
                while (i < linesA.length || j < linesB.length) {
                    if (i < linesA.length && j < linesB.length && linesA[i] === linesB[j]) {
                        diff.push({ type: 'unchanged', text: linesA[i], lineA: i+1, lineB: j+1 });
                        i++;
                        j++;
                    } else {
                        // 检查是否是被删除的行
                        if (i < linesA.length && (j >= linesB.length || linesA[i] !== linesB[j])) {
                            let found = false;
                            // 检查后面的行是否有匹配
                            for (let k = j + 1; k < Math.min(j + 10, linesB.length); k++) {
                                if (linesA[i] === linesB[k]) {
                                    found = true;
                                    // 添加新增的行
                                    for (let l = j; l < k; l++) {
                                        diff.push({ type: 'added', text: linesB[l], lineB: l+1 });
                                    }
                                    j = k;
                                    break;
                                }
                            }
                            
                            if (!found) {
                                diff.push({ type: 'removed', text: linesA[i], lineA: i+1 });
                                i++;
                            }
                        } 
                        // 检查是否是新增加的行
                        else if (j < linesB.length && (i >= linesA.length || linesA[i] !== linesB[j])) {
                            let found = false;
                            // 检查后面的行是否有匹配
                            for (let k = i + 1; k < Math.min(i + 10, linesA.length); k++) {
                                if (linesA[k] === linesB[j]) {
                                    found = true;
                                    // 添加删除的行
                                    for (let l = i; l < k; l++) {
                                        diff.push({ type: 'removed', text: linesA[l], lineA: l+1 });
                                    }
                                    i = k;
                                    break;
                                }
                            }
                            
                            if (!found) {
                                diff.push({ type: 'added', text: linesB[j], lineB: j+1 });
                                j++;
                            }
                        }
                    }
                }
                
                return diff;
            }
            
            // 显示差异结果
            function displayDiff(diff) {
                diffResult.innerHTML = '';
                
                if (diff.length === 0) {
                    diffResult.innerHTML = '<div class="diff-line diff-info">两个文件内容完全相同</div>';
                    return;
                }
                
                // 只显示不一样的内容
                const differentLines = diff.filter(item => item.type !== 'unchanged');
                
                if (differentLines.length === 0) {
                    diffResult.innerHTML = '<div class="diff-line diff-info">两个文件内容完全相同</div>';
                    return;
                }
                
                differentLines.forEach(item => {
                    const lineDiv = document.createElement('div');
                    lineDiv.classList.add('diff-line', `diff-${item.type}`);
                    
                    let lineInfo = '';
                    if (item.type === 'added') {
                        lineInfo = `     | ${item.lineB} | + `;
                    } else if (item.type === 'removed') {
                        lineInfo = `${item.lineA} |      | - `;
                    }
                    
                    // 创建行号和信息元素
                    const infoSpan = document.createElement('span');
                    infoSpan.textContent = lineInfo;
                    infoSpan.style.color = '#6c757d';
                    infoSpan.style.fontWeight = 'bold';
                    infoSpan.style.marginRight = '10px';
                    
                    // 创建文本元素
                    const textSpan = document.createElement('span');
                    textSpan.textContent = item.text;
                    
                    lineDiv.appendChild(infoSpan);
                    lineDiv.appendChild(textSpan);
                    diffResult.appendChild(lineDiv);
                });
            }
            
            // 重置按钮点击事件
            resetBtn.addEventListener('click', function() {
                fileInputA.value = '';
                fileInputB.value = '';
                fileInfoA.textContent = '尚未选择文件';
                fileInfoB.textContent = '尚未选择文件';
                contentA.textContent = '// 文件A内容将显示在这里';
                contentB.textContent = '// 文件B内容将显示在这里';
                diffResult.innerHTML = '<div class="diff-line diff-info">请上传两个文件并点击"比较文件"按钮</div>';
                fileAContent = '';
                fileBContent = '';
                compareBtn.disabled = true;
                
                showNotification('已重置所有设置！');
            });
            
            // 显示通知
            function showNotification(message, type = 'success') {
                notification.textContent = message;
                notification.style.background = type === 'success' ? '#2ecc71' : '#e74c3c';
                notification.classList.add('show');
                
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            }
        });
    </script>
</body>
</html>
