<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车贷计算器</title>
    <style>
        :root {
            --primary-color: #1976d2;
            --secondary-color: #42a5f5;
            --text-color: #333;
            --text-muted: #666;
            --border-color: #e0e0e0;
            --bg-light: #f8f9fa;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 600;
        }

        .content {
            padding: 20px;
        }

        /* 模式选择器 */
        .mode-selector {
            display: flex;
            background: var(--bg-light);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            padding: 15px 20px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-color);
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background: var(--primary-color);
            color: white;
        }

        .mode-btn:hover:not(.active) {
            background: rgba(25, 118, 210, 0.1);
        }

        /* 计算器布局 */
        .calculator-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 20px;
        }

        .left-panel {
            background: var(--bg-light);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .calculator-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 20px;
            text-align: center;
        }

        /* 表单组件 */
        .form-group {
            margin-bottom: 15px;
        }

        .form-row {
            display: block;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-color);
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(25, 118, 210, 0.1);
        }

        .input-group {
            display: flex;
            align-items: stretch;
        }

        .input-group input {
            flex: 1;
            border-radius: 6px 0 0 6px;
            border-right: none;
        }

        .input-suffix {
            padding: 10px 12px;
            background: var(--bg-light);
            border: 1px solid var(--border-color);
            border-radius: 0 6px 6px 0;
            color: var(--text-muted);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            min-width: 40px;
            justify-content: center;
        }

        /* 按钮组 */
        .button-group {
            display: flex !important;
            gap: 10px;
            margin: 20px 0 10px 0;
            width: 100%;
        }

        .calculate-btn {
            flex: 1 !important;
            width: calc(50% - 5px) !important;
            padding: 12px 20px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .calculate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(25, 118, 210, 0.3);
        }

        .reset-btn {
            flex: 1 !important;
            width: calc(50% - 5px) !important;
            padding: 12px 20px;
            background: #ffc107;
            color: #212529;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .reset-btn:hover {
            background: #e0a800;
            color: #212529;
            border-color: #e0a800;
            transform: translateY(-1px);
        }

        /* 右侧结果区域 */
        .right-panel {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
        }

        .result-header {
            background: var(--bg-light);
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .result-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-color);
            margin: 0;
        }

        .result-content {
            padding: 20px;
        }

        .result-summary {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .result-item {
            background: var(--bg-light);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .result-item label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .result-item .value {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary-color);
        }

        /* 操作按钮 */
        .result-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .action-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            transform: translateY(-1px);
        }

        /* 还款计划表样式 */
        .schedule-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .schedule-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 12px;
            width: 85%;
            max-width: 1000px;
            max-height: 90vh;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .schedule-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .download-btn {
            background: #28a745;
            color: white;
            border: 1px solid #28a745;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            background: #218838;
            border-color: #218838;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .schedule-summary {
            padding: 15px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            font-size: 0.95rem;
            color: var(--text-color);
        }

        .schedule-table-container {
            max-height: 60vh;
            overflow-y: auto;
            padding: 0;
        }

        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .schedule-table th {
            background: #f8f9fa;
            color: var(--text-color);
            font-weight: 600;
            padding: 10px 4px;
            text-align: center;
            border-bottom: 2px solid #e9ecef;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .schedule-table td {
            padding: 8px 4px;
            text-align: center;
            border-bottom: 1px solid #f0f0f0;
        }

        .schedule-table tr:hover {
            background: #f8f9fa;
        }

        .schedule-table .period {
            width: 7%;
            font-weight: 600;
            color: var(--primary-color);
        }

        .schedule-table .date {
            width: 11%;
        }

        .schedule-table .payment,
        .schedule-table .principal,
        .schedule-table .interest {
            width: 10%;
            font-weight: 600;
        }

        .schedule-table .paid-principal,
        .schedule-table .remaining,
        .schedule-table .paid-interest,
        .schedule-table .remaining-interest {
            width: 10%;
        }

        .action-btn.secondary {
            background: #6c757d;
            color: white;
        }

        .action-btn.secondary:hover {
            background: #5a6268;
        }

        /* 隐藏元素 */
        .hidden {
            display: none !important;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                margin: 0;
                border-radius: 10px;
            }

            .header {
                padding: 15px;
            }

            .header h1 {
                font-size: 1.5rem;
                margin: 0;
            }

            .content {
                padding: 15px;
            }

            /* 模式选择器移动端优化 - 保持水平布局 */
            .mode-selector {
                flex-direction: row;
                gap: 0;
            }

            .mode-btn {
                flex: 1;
                padding: 12px 8px;
                font-size: 0.9rem;
                border-radius: 0;
                border-right: 1px solid var(--border-color);
            }

            .mode-btn:first-child {
                border-radius: 8px 0 0 8px;
            }

            .mode-btn:last-child {
                border-radius: 0 8px 8px 0;
                border-right: none;
            }

            /* 计算器布局移动端优化 */
            .calculator-layout {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            /* 表单组件移动端优化 */
            .form-group {
                margin-bottom: 12px;
            }

            .form-group label {
                font-size: 0.9rem;
                margin-bottom: 6px;
            }

            /* 移动端表单行布局 */
            .form-row {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .form-row .form-group {
                margin-bottom: 12px;
            }

            .form-group input,
            .form-group select {
                padding: 12px;
                font-size: 16px; /* 防止iOS缩放 */
            }

            /* 输入组移动端优化 - 保持水平布局，无缝连接 */
            .input-group {
                border: 1px solid var(--border-color);
                border-radius: 6px;
                overflow: hidden;
            }

            .input-group input {
                flex: 1;
                border: none;
                border-radius: 0;
                outline: none;
                padding: 12px;
                font-size: 16px;
            }

            .input-group input:focus {
                box-shadow: none;
            }

            .input-group .input-suffix {
                padding: 12px 8px;
                border: none;
                border-left: 1px solid var(--border-color);
                background: var(--bg-light);
                text-align: center;
                font-size: 14px;
                min-width: 35px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--text-muted);
            }

            /* 按钮组移动端优化 - 保持水平布局 */
            .button-group {
                flex-direction: row;
                gap: 8px;
                margin: 15px 0;
            }

            .calculate-btn,
            .reset-btn {
                flex: 1;
                padding: 14px 12px;
                font-size: 0.95rem;
            }

            /* 结果区域移动端优化 */
            .result-summary {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .result-item {
                padding: 8px;
                text-align: center;
            }

            .result-item label {
                font-size: 0.85rem;
            }

            .result-item .value {
                font-size: 1rem;
            }

            /* 操作按钮移动端优化 - 保持水平布局 */
            .result-actions {
                flex-direction: row;
                gap: 8px;
                justify-content: center;
            }

            .action-btn {
                flex: 1;
                padding: 12px 8px;
                font-size: 0.85rem;
                max-width: 150px;
            }

            /* 还款计划表移动端优化 */
            .schedule-modal {
                padding: 10px;
            }

            .schedule-content {
                width: 95%;
                max-height: 85vh;
                border-radius: 8px;
            }

            .schedule-header {
                padding: 10px 15px;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                position: relative;
            }

            .schedule-header .download-btn {
                order: 1;
                padding: 8px 12px;
                font-size: 0.85rem;
            }

            .schedule-header .close-btn {
                order: 2;
                position: absolute;
                right: 10px;
                top: 50%;
                transform: translateY(-50%);
                padding: 4px 8px;
                font-size: 1.2rem;
            }

            .schedule-table {
                font-size: 0.8rem;
            }

            .schedule-table th,
            .schedule-table td {
                padding: 6px 2px;
            }

            /* 购车成本表单移动端优化 */
            div[style*="grid-template-columns"] {
                grid-template-columns: 1fr 1fr !important;
                gap: 12px !important;
            }

            /* 购车成本结果区域移动端优化 */
            .result-summary[style*="grid-template-columns"] {
                grid-template-columns: 1fr !important;
                gap: 8px !important;
            }
        }

        /* 小屏幕设备进一步优化 */
        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.3rem;
            }

            .content {
                padding: 10px;
            }

            .form-group input,
            .form-group select {
                padding: 10px;
            }

            .calculate-btn,
            .reset-btn {
                padding: 12px 16px;
                font-size: 0.95rem;
            }

            .schedule-table {
                font-size: 0.75rem;
            }

            .schedule-table th,
            .schedule-table td {
                padding: 4px 1px;
            }

            /* 购车成本表单网格布局移动端优化 */
            div[style*="grid-template-columns"] {
                grid-template-columns: 1fr 1fr !important;
                gap: 10px !important;
            }

            /* 购车成本表单字段移动端优化 */
            div[style*="grid-template-columns"] .form-group {
                margin-bottom: 10px;
            }

            div[style*="grid-template-columns"] .form-group label {
                font-size: 0.85rem;
                margin-bottom: 4px;
            }

            div[style*="grid-template-columns"] .form-group input {
                padding: 10px;
                font-size: 15px;
            }

            div[style*="grid-template-columns"] .form-group small {
                font-size: 0.75rem;
                margin-top: 2px;
            }
        }

        /* 超小屏幕设备优化 */
        @media (max-width: 360px) {
            .header h1 {
                font-size: 1.2rem;
            }

            .content {
                padding: 8px;
            }

            .mode-btn {
                padding: 10px 6px;
                font-size: 0.85rem;
            }

            /* 超小屏幕下购车成本表单可能需要单列布局 */
            div[style*="grid-template-columns"] {
                grid-template-columns: 1fr !important;
                gap: 8px !important;
            }

            .form-group input,
            .form-group select {
                padding: 8px;
                font-size: 14px;
            }

            .calculate-btn,
            .reset-btn {
                padding: 10px 12px;
                font-size: 0.9rem;
            }

            .schedule-table {
                font-size: 0.7rem;
            }

            .schedule-table th,
            .schedule-table td {
                padding: 3px 1px;
            }

            .action-btn {
                padding: 10px 6px;
                font-size: 0.8rem;
            }
        }

        /* 横屏模式优化 */
        @media (max-width: 768px) and (orientation: landscape) {
            .calculator-layout {
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }

            .schedule-content {
                width: 90%;
                max-height: 80vh;
            }

            .schedule-table {
                font-size: 0.85rem;
            }

            .schedule-table th,
            .schedule-table td {
                padding: 6px 3px;
            }
        }

        /* 触摸设备优化 */
        @media (hover: none) and (pointer: coarse) {
            .action-btn,
            .calculate-btn,
            .reset-btn,
            .mode-btn {
                min-height: 44px; /* iOS推荐的最小触摸目标 */
            }

            .download-btn,
            .close-btn {
                min-height: 44px;
                min-width: 44px;
            }

            /* 增加表格行高，便于触摸滚动 */
            .schedule-table td {
                padding: 10px 4px;
            }
        }

        /* 页脚 */
        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 14px;
            border-top: 1px solid #E0E0E0;
            margin-top: 20px;
        }

        .footer strong {
            font-weight: 600;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>车贷计算器</h1>
        </div>

        <div class="content">
            <!-- 模式选择器 -->
            <div class="mode-selector">
                <button class="mode-btn active" onclick="switchMode('loan')">车贷计算</button>
                <button class="mode-btn" onclick="switchMode('cost')">购车成本</button>
            </div>

            <div class="calculator-layout">
                <!-- 左侧面板 -->
                <div class="left-panel">
                    <div class="calculator-title" id="calculatorTitle">车贷计算器</div>
                    
                    <!-- 车贷计算表单容器 -->
                    <div id="loanFormContainer"></div>
                    
                    <!-- 购车成本表单容器 -->
                    <div id="costFormContainer" class="hidden"></div>
                </div>

                <!-- 右侧结果面板 -->
                <div class="right-panel">
                    <div class="result-header">
                        <h3 class="result-title" id="resultTitle">计算结果</h3>
                    </div>
                    <div class="result-content" id="resultContent">
                        <p style="text-align: center; color: var(--text-muted); margin: 40px 0;">
                            请输入相关信息后点击计算
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 页脚 -->
        <div class="footer">
            本工具使用AI编程实现，如有定制工具的需求可联系微信 <strong>L94026958</strong>
        </div>
    </div>

    <script>
        // 全局变量
        let currentMode = 'loan';

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            generateForms();
            bindEvents();
        });

        // 生成所有表单
        function generateForms() {
            // 生成车贷表单
            document.getElementById('loanFormContainer').innerHTML = generateLoanForm();

            // 生成购车成本表单
            document.getElementById('costFormContainer').innerHTML = generateCostForm();
        }

        // 生成车贷表单（参照房贷计算器商业贷款页面）
        function generateLoanForm() {
            return `
                <div class="form-group">
                    <label for="loanAmount">贷款金额</label>
                    <div class="input-group">
                        <input type="number" id="loanAmount" placeholder="请输入贷款金额" min="10000" max="10000000" step="1000" value="100000" oninput="updateLoanAmountDisplay()">
                        <div class="input-suffix">元</div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="loanYears">贷款期数</label>
                        <select id="loanYears" onchange="handleLoanYearsChange()">
                            <option value="1">1年</option>
                            <option value="2">2年</option>
                            <option value="3" selected>3年</option>
                            <option value="4">4年</option>
                            <option value="5">5年</option>
                            <option value="custom">自定义期数</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="loanMonths">贷款月数</label>
                        <div class="input-group">
                            <input type="number" id="loanMonths" placeholder="请输入贷款月数" min="1" max="60" step="1" value="36" readonly oninput="updateLoanYearsFromMonths()">
                            <div class="input-suffix">月</div>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="loanRate">贷款利率</label>
                    <div class="input-group">
                        <input type="number" id="loanRate" placeholder="请输入年利率" min="0.1" max="20" step="0.1" value="3.5">
                        <div class="input-suffix">%</div>
                    </div>
                </div>

                <div class="button-group">
                    <button type="button" class="calculate-btn" onclick="calculateLoan()">开始计算</button>
                    <button type="button" class="reset-btn" onclick="resetLoanForm()">重置</button>
                </div>
            `;
        }

        // 生成购车成本表单（提供预算参考）
        function generateCostForm() {
            return `
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label for="carPrice">裸车价格</label>
                        <div class="input-group">
                            <input type="number" id="carPrice" placeholder="请输入裸车价格" min="10000" max="10000000" step="1000" value="200000" oninput="updateAllCosts()">
                            <div class="input-suffix">元</div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="purchaseTaxRate">购置税率</label>
                        <div class="input-group">

        // 车贷计算
        function calculateLoan() {
            try {
                // 获取输入值
                const loanAmount = parseFloat(document.getElementById('loanAmount').value);
                const loanMonths = parseInt(document.getElementById('loanMonths').value);
                const annualRate = parseFloat(document.getElementById('loanRate').value);

                // 验证输入
                if (!loanAmount || loanAmount <= 0) {
                    alert('请输入有效的贷款金额');
                    return;
                }
                if (!loanMonths || loanMonths <= 0) {
                    alert('请输入有效的贷款期数');
                    return;
                }
                if (!annualRate || annualRate <= 0) {
                    alert('请输入有效的贷款利率');
                    return;
                }

                // 计算月利率
                const monthlyRate = annualRate / 100 / 12;

                // 等额本息计算
                const monthlyPayment = loanAmount * monthlyRate * Math.pow(1 + monthlyRate, loanMonths) /
                    (Math.pow(1 + monthlyRate, loanMonths) - 1);

                const totalPayment = monthlyPayment * loanMonths;
                const totalInterest = totalPayment - loanAmount;

                // 等额本金计算
                const principalPayment = loanAmount / loanMonths;
                const firstInterest = loanAmount * monthlyRate;
                const firstPayment = principalPayment + firstInterest;
                const lastInterest = principalPayment * monthlyRate;
                const lastPayment = principalPayment + lastInterest;
                const monthlyDecrease = principalPayment * monthlyRate;
                const principalTotalInterest = (loanMonths + 1) * loanAmount * monthlyRate / 2;
                const principalTotalPayment = loanAmount + principalTotalInterest;

                // 显示结果
                displayLoanResult({
                    loanAmount,
                    loanMonths,
                    annualRate,
                    monthlyPayment,
                    totalPayment,
                    totalInterest,
                    principalResult: {
                        firstPayment,
                        lastPayment,
                        monthlyDecrease,
                        totalInterest: principalTotalInterest,
                        totalPayment: principalTotalPayment
                    }
                });

            } catch (error) {
                alert('计算过程中出现错误，请检查输入参数');
                console.error('计算错误:', error);
            }
        }

        // 购车成本计算
        function calculateCost() {
            // 先更新所有自动计算的费用
            updateAllCosts();

            // 获取输入值
            const carPrice = parseFloat(document.getElementById('carPrice').value);
            const purchaseTaxRate = parseFloat(document.getElementById('purchaseTaxRate').value) || 0;
            const carDamageRate = parseFloat(document.getElementById('carDamageRate').value) || 0;
            const compulsoryInsurance = parseFloat(document.getElementById('compulsoryInsurance').value) || 0;
            const thirdPartyInsurance = parseFloat(document.getElementById('thirdPartyInsurance').value) || 0;
            const additionalInsurance = parseFloat(document.getElementById('additionalInsurance').value) || 0;
            const licenseFee = parseFloat(document.getElementById('licenseFee').value) || 0;
            const vehicleTax = parseFloat(document.getElementById('vehicleTax').value) || 0;
            const otherFees = parseFloat(document.getElementById('otherFees').value) || 0;

            // 验证输入
            if (!carPrice || carPrice <= 0) {
                alert('请输入有效的裸车价格');
                return;
            }

            // 计算购置税和车损险
            const purchaseTax = Math.round(carPrice / 1.13 * purchaseTaxRate / 100);
            const carDamageInsurance = Math.round(carPrice * carDamageRate / 100);

            // 计算总保险费用
            const totalInsurance = compulsoryInsurance + carDamageInsurance + thirdPartyInsurance + additionalInsurance;

            // 计算总成本
            const totalCost = carPrice + purchaseTax + totalInsurance + licenseFee + vehicleTax + otherFees;

            // 显示结果
            displayCostResult({
                carPrice,
                purchaseTax,
                compulsoryInsurance,
                carDamageInsurance,
                thirdPartyInsurance,
                additionalInsurance,
                totalInsurance,
                licenseFee,
                vehicleTax,
                otherFees,
                totalCost
            });
        }

        // 格式化货币
        function formatCurrency(amount) {
            if (isNaN(amount)) return '0';
            
            // 保留2位小数
            const rounded = Math.round(amount * 100) / 100;
            
            // 如果是整数，显示整数；否则显示2位小数
            if (rounded % 1 === 0) {
                return Math.round(rounded).toLocaleString('zh-CN');
            } else {
                return rounded.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            }
        }

        // 显示还款明细
        function showLoanDetail() {
            const loanAmount = parseFloat(document.getElementById('loanAmount').value);
            const loanYears = document.getElementById('loanYears').value;
            const loanMonths = loanYears === 'custom' ?
                parseFloat(document.getElementById('loanMonths').value) :
                parseInt(loanYears) * 12;
            const annualRate = parseFloat(document.getElementById('loanRate').value);
            const monthlyRate = annualRate / 100 / 12;

            // 计算每月还款明细
            const monthlyPayment = loanAmount * monthlyRate * Math.pow(1 + monthlyRate, loanMonths) /
                (Math.pow(1 + monthlyRate, loanMonths) - 1);

            let balance = loanAmount;
            let detailHtml = `
                <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center;" onclick="this.remove()">
                    <div style="background: white; border-radius: 10px; padding: 20px; max-width: 90%; max-height: 80%; overflow: auto;" onclick="event.stopPropagation()">
                        <h3 style="margin-top: 0; text-align: center; color: var(--primary-color);">还款明细表</h3>
                        <table style="width: 100%; border-collapse: collapse; font-size: 0.9rem;">
                            <thead>
                                <tr style="background: var(--bg-light);">
                                    <th style="border: 1px solid var(--border-color); padding: 8px; text-align: center;">期数</th>
                                    <th style="border: 1px solid var(--border-color); padding: 8px; text-align: center;">月供</th>
                                    <th style="border: 1px solid var(--border-color); padding: 8px; text-align: center;">本金</th>
                                    <th style="border: 1px solid var(--border-color); padding: 8px; text-align: center;">利息</th>
                                    <th style="border: 1px solid var(--border-color); padding: 8px; text-align: center;">余额</th>
                                </tr>
                            </thead>
                            <tbody>
            `;

            for (let i = 1; i <= loanMonths; i++) {
                const interestPayment = balance * monthlyRate;
                const principalPayment = monthlyPayment - interestPayment;
                balance -= principalPayment;

                if (balance < 0) balance = 0; // 防止负数

                detailHtml += `
                    <tr>
                        <td style="border: 1px solid var(--border-color); padding: 6px; text-align: center;">${i}</td>
                        <td style="border: 1px solid var(--border-color); padding: 6px; text-align: right;">${formatCurrency(monthlyPayment)}</td>
                        <td style="border: 1px solid var(--border-color); padding: 6px; text-align: right;">${formatCurrency(principalPayment)}</td>
                        <td style="border: 1px solid var(--border-color); padding: 6px; text-align: right;">${formatCurrency(interestPayment)}</td>
                        <td style="border: 1px solid var(--border-color); padding: 6px; text-align: right;">${formatCurrency(balance)}</td>
                    </tr>
                `;
            }

            detailHtml += `
                            </tbody>
                        </table>
                        <div style="text-align: center; margin-top: 15px;">
                            <button onclick="this.closest('div[style*=\"position: fixed\"]').remove()" style="padding: 8px 20px; background: var(--primary-color); color: white; border: none; border-radius: 5px; cursor: pointer;">关闭</button>
                        </div>
                    </div>
                </div>
            `;

            document.body.insertAdjacentHTML('beforeend', detailHtml);
        }

        // 显示月供明细
        function showLoanDetail(paymentType) {
            try {
                // 获取当前计算参数
                const loanAmount = parseFloat(document.getElementById('loanAmount').value);
                const loanMonths = parseInt(document.getElementById('loanMonths').value);
                const annualRate = parseFloat(document.getElementById('loanRate').value) / 100;

                // 验证输入
                if (!loanAmount || loanAmount <= 0) {
                    alert('请先进行车贷计算');
                    return;
                }
                if (!loanMonths || loanMonths <= 0) {
                    alert('请输入有效的贷款期数');
                    return;
                }
                if (!annualRate || annualRate <= 0) {
                    alert('请输入有效的贷款利率');
                    return;
                }

                const monthlyRate = annualRate / 12;

                // 生成还款计划
                let scheduleData;
                if (paymentType === 'equal_payment') {
                    scheduleData = generateEqualPaymentSchedule(loanAmount, monthlyRate, loanMonths);
                } else {
                    scheduleData = generateEqualPrincipalSchedule(loanAmount, monthlyRate, loanMonths);
                }

                // 显示模态框
                displayScheduleModal(scheduleData, loanAmount, loanMonths, annualRate * 100, paymentType);

            } catch (error) {
                alert('生成还款计划时出现错误');
                console.error('还款计划错误:', error);
            }
        }

        // 生成等额本息还款计划
        function generateEqualPaymentSchedule(principal, monthlyRate, totalMonths) {
            const monthlyPayment = principal * monthlyRate * Math.pow(1 + monthlyRate, totalMonths) /
                (Math.pow(1 + monthlyRate, totalMonths) - 1);

            let remainingPrincipal = principal;
            let totalPaidPrincipal = 0;
            let totalPaidInterest = 0;
            const schedule = [];

            for (let month = 1; month <= totalMonths; month++) {
                const interestPayment = remainingPrincipal * monthlyRate;
                const principalPayment = monthlyPayment - interestPayment;

                remainingPrincipal -= principalPayment;
                totalPaidPrincipal += principalPayment;
                totalPaidInterest += interestPayment;

                const paymentDate = new Date();
                paymentDate.setMonth(paymentDate.getMonth() + month);

                const remainingInterest = (totalMonths - month) * monthlyPayment - remainingPrincipal;

                schedule.push({
                    period: month,
                    date: `${paymentDate.getFullYear()}年${String(paymentDate.getMonth() + 1).padStart(2, '0')}月`,
                    payment: monthlyPayment,
                    principal: principalPayment,
                    interest: interestPayment,
                    paidPrincipal: totalPaidPrincipal,
                    remainingPrincipal: Math.max(0, remainingPrincipal),
                    paidInterest: totalPaidInterest,
                    remainingInterest: Math.max(0, remainingInterest)
                });
            }

            return schedule;
        }

        // 生成等额本金还款计划
        function generateEqualPrincipalSchedule(principal, monthlyRate, totalMonths) {
            const monthlyPrincipal = principal / totalMonths;
            let remainingPrincipal = principal;
            let totalPaidPrincipal = 0;
            let totalPaidInterest = 0;
            const schedule = [];

            for (let month = 1; month <= totalMonths; month++) {
                const interestPayment = remainingPrincipal * monthlyRate;
                const monthlyPayment = monthlyPrincipal + interestPayment;

                remainingPrincipal -= monthlyPrincipal;
                totalPaidPrincipal += monthlyPrincipal;
                totalPaidInterest += interestPayment;

                const paymentDate = new Date();
                paymentDate.setMonth(paymentDate.getMonth() + month);

                const remainingInterest = remainingPrincipal * monthlyRate * (totalMonths - month) / 2;

                schedule.push({
                    period: month,
                    date: `${paymentDate.getFullYear()}年${String(paymentDate.getMonth() + 1).padStart(2, '0')}月`,
                    payment: monthlyPayment,
                    principal: monthlyPrincipal,
                    interest: interestPayment,
                    paidPrincipal: totalPaidPrincipal,
                    remainingPrincipal: Math.max(0, remainingPrincipal),
                    paidInterest: totalPaidInterest,
                    remainingInterest: Math.max(0, remainingInterest)
                });
            }

            return schedule;
        }

        // 显示还款计划模态框
        function displayScheduleModal(scheduleData, loanAmount, loanMonths, rate, paymentType) {
            const modal = document.getElementById('scheduleModal');
            const summary = document.getElementById('scheduleSummary');
            const tableBody = document.getElementById('scheduleTableBody');

            // 设置摘要
            const paymentMethodText = paymentType === 'equal_payment' ? '等额本息' : '等额本金';
            const rateDisplay = typeof rate === 'number' ? rate.toFixed(2) : parseFloat(rate).toFixed(2);
            summary.textContent = `贷款金额${(loanAmount/10000).toFixed(1)}万元，贷款期数${Math.ceil(loanMonths/12)}年（共${loanMonths}期），贷款利率${rateDisplay}%，${paymentMethodText}还款方式，月供还款明细表。`;

            // 清空表格
            tableBody.innerHTML = '';

            // 生成表格行
            scheduleData.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row.period}期</td>
                    <td>${row.date}</td>
                    <td>${formatCurrency(row.payment)}</td>
                    <td>${formatCurrency(row.principal)}</td>
                    <td>${formatCurrency(row.interest)}</td>
                    <td>${formatCurrency(row.paidPrincipal)}</td>
                    <td>${formatCurrency(row.remainingPrincipal)}</td>
                    <td>${formatCurrency(row.paidInterest)}</td>
                    <td>${formatCurrency(row.remainingInterest)}</td>
                `;
                tableBody.appendChild(tr);
            });

            // 显示模态框
            modal.style.display = 'block';

            // 存储当前数据用于下载
            window.currentScheduleData = {
                scheduleData,
                loanAmount,
                loanMonths,
                rate,
                paymentType
            };
        }

        // 关闭还款计划模态框
        function closeSchedule() {
            document.getElementById('scheduleModal').style.display = 'none';
        }

        // 下载还款计划表格
        function downloadSchedule() {
            if (!window.currentScheduleData) {
                alert('没有可下载的数据');
                return;
            }

            const { scheduleData, loanAmount, loanMonths, rate, paymentType } = window.currentScheduleData;
            const paymentMethodText = paymentType === 'equal_payment' ? '等额本息' : '等额本金';

            // 创建CSV内容
            let csvContent = '\uFEFF'; // BOM for UTF-8
            csvContent += `车贷还款计划表\n`;
            csvContent += `贷款金额,${(loanAmount/10000).toFixed(1)}万元\n`;
            csvContent += `贷款期数,${Math.ceil(loanMonths/12)}年（共${loanMonths}期）\n`;
            csvContent += `贷款利率,${rate.toFixed(2)}%\n`;
            csvContent += `还款方式,${paymentMethodText}\n\n`;
            csvContent += `期次,还款日期,月供,本金,利息,已还本金,剩余本金,已还利息,剩余利息\n`;

            scheduleData.forEach(row => {
                const formatForCSV = (num) => {
                    const rounded = Math.round(num * 100) / 100;
                    return rounded % 1 === 0 ? Math.round(rounded).toString() : rounded.toFixed(2);
                };
                
                csvContent += `${row.period}期,${row.date},${formatForCSV(row.payment)},${formatForCSV(row.principal)},${formatForCSV(row.interest)},${formatForCSV(row.paidPrincipal)},${formatForCSV(row.remainingPrincipal)},${formatForCSV(row.paidInterest)},${formatForCSV(row.remainingInterest)}\n`;
            });

            // 创建下载链接
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `车贷还款计划表_${paymentMethodText}_${new Date().toISOString().slice(0, 10)}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // 页面加载完成后初始化
        window.addEventListener('load', function() {
            // 点击模态框外部关闭
            document.getElementById('scheduleModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeSchedule();
                }
            });
        });
    </script>

    <!-- 还款计划表模态框 -->
    <div class="schedule-modal" id="scheduleModal">
        <div class="schedule-content">
            <div class="schedule-header">
                <button class="download-btn" onclick="downloadSchedule()">表格下载</button>
                <button class="close-btn" onclick="closeSchedule()">&times;</button>
            </div>
            <div class="schedule-summary" id="scheduleSummary">
                贷款金额10万元，贷款期数3年（共36期），贷款利率3.5%，等额本息还款方式，月供还款明细表。
            </div>
            <div class="schedule-table-container">
                <table class="schedule-table">
                    <thead>
                        <tr>
                            <th class="period">期次</th>
                            <th class="date">还款日期</th>
                            <th class="payment">月供</th>
                            <th class="principal">本金</th>
                            <th class="interest">利息</th>
                            <th class="paid-principal">已还本金</th>
                            <th class="remaining">剩余本金</th>
                            <th class="paid-interest">已还利息</th>
                            <th class="remaining-interest">剩余利息</th>
                        </tr>
                    </thead>
                    <tbody id="scheduleTableBody">
                        <!-- 动态生成的还款计划数据 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
