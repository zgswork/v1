<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>颜色提取 - 图片颜色识别工具</title>
  <style>
    :root { --bg:#f7f7f8; --text:#1f2937; --muted:#64748b; --card-bg:#ffffff; --border:#e5e7eb; --primary:#2563eb; --accent:#22c55e; --shadow:0 2px 10px rgba(0,0,0,.08); }
    [data-theme="dark"] { --bg:#0b1220; --text:#e5e7eb; --muted:#94a3b8; --card-bg:#121826; --border:#1f2937; --primary:#3b82f6; --accent:#10b981; --shadow:0 2px 12px rgba(0,0,0,.40); }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", sans-serif; background:var(--bg); color:var(--text); line-height:1.6; }
    .header{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px; position:sticky; top:0; background:var(--bg); backdrop-filter: blur(6px); border-bottom:1px solid var(--border); z-index:10; }
    .header h1{ margin:0; font-size:18px; letter-spacing:.2px; }
    .theme-toggle{ display:inline-flex; align-items:center; gap:8px; border:1px solid var(--border); background:var(--card-bg); color:var(--text); padding:8px 12px; border-radius:10px; cursor:pointer; box-shadow:var(--shadow); user-select:none; }
    .container{ max-width:1100px; margin:0 auto; padding:20px; display:grid; grid-template-columns:1fr 1fr; gap:20px; }
    @media (max-width:900px){ .container{ grid-template-columns:1fr; } }
    .card{ background:var(--card-bg); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); overflow:hidden; }
    .card header{ padding:12px 16px; border-bottom:1px solid var(--border); font-weight:600; }
    .upload{ padding:16px; display:flex; flex-direction:column; gap:12px; }
    .dropzone{ border:2px dashed var(--border); border-radius:14px; padding:16px; display:flex; align-items:center; justify-content:center; text-align:center; min-height:140px; cursor:pointer; transition:border-color .2s, background .2s; }
    .dropzone.hover{ border-color:var(--primary); background:rgba(37,99,235,.08); }
    .dropzone p{ margin:0; color:var(--muted); }
    .actions{ display:flex; gap:10px; flex-wrap:wrap; }
    .button{ background:var(--primary); color:#fff; border:none; border-radius:10px; padding:10px 14px; font-weight:600; cursor:pointer; }
    .button.secondary{ background:transparent; color:var(--text); border:1px solid var(--border); }
    .preview{ padding:12px; display:flex; flex-direction:column; gap:12px; }
    .canvas-wrap{ position:relative; background:#00000010; border:1px dashed var(--border); border-radius:12px; overflow:hidden; display:flex; align-items:center; justify-content:center; min-height:240px; }
    canvas{ max-width:100%; height:auto; display:block; }
    .sample-tip{ position:absolute; background:rgba(0,0,0,.7); color:#fff; font-size:12px; padding:6px 8px; border-radius:8px; display:none; pointer-events:none; white-space:nowrap; border:1px solid #ffffff33; box-shadow:var(--shadow); }
    .sample-tip .dot{ display:inline-block; width:14px; height:14px; border-radius:4px; margin-right:6px; border:1px solid rgba(255,255,255,.6); }
    .palette{ padding:16px; display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:12px; }
    @media (min-width:600px){ .palette{ grid-template-columns: repeat(3, minmax(0,1fr)); } }
    .color-item{ border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--card-bg); box-shadow:var(--shadow); }
    .swatch{ height:72px; width:100%; }
    .color-meta{ padding:10px; display:flex; flex-direction:column; gap:6px; font-size:14px; }
    .color-meta .row{ display:flex; align-items:center; justify-content:space-between; }
    .copy{ background:var(--card-bg); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:6px 10px; cursor:pointer; }
    .footer{ padding:16px 20px; color:var(--muted); text-align:center; }
    .small{ font-size:12px; color:var(--muted); }
    .range-wrap{ display:flex; align-items:center; gap:10px; }
    input[type="range"]{ width:160px; }
    .hidden-input{ position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
    kbd{ background:#0003; padding:2px 6px; border-radius:6px; }
    .help{ padding:12px 16px; font-size:13px; color:var(--muted); }
  </style>
</head>
<body>
  <div class="header">
    <h1>颜色提取</h1>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="切换主题">
      <span id="themeLabel">浅色主题</span>
    </button>
  </div>

  <div class="container">
    <div class="card">
      <header>导入图片</header>
      <div class="upload">
        <div id="drop" class="dropzone" role="button" tabindex="0" aria-label="拖拽或点击选择图片">
          <p>拖拽图片到此处，或点击选择图片</p>
        </div>
        <div class="actions">
          <button id="pick" class="button">选择图片</button>
          <button id="useSample" class="button secondary">使用示例图片</button>
          <div class="range-wrap">
            <label for="colorCount">颜色数量</label>
            <input id="colorCount" type="range" min="3" max="24" value="12">
            <span id="colorCountLabel">12</span>
          </div>
        </div>
        <div class="help">
          支持拖拽、点击选择；点击画布可查看该像素颜色；复制颜色值一键到剪贴板。
        </div>
        <input id="fileInput" class="hidden-input" type="file" accept="image/*">
      </div>
    </div>

    <div class="card">
      <header>预览与采样</header>
      <div class="preview">
        <div class="canvas-wrap">
          <canvas id="canvas"></canvas>
          <div id="sampleTip" class="sample-tip">RGB(—)</div>
        </div>
        <div class="small">提示：图片仅用于本地浏览器处理，不会上传。</div>
      </div>
    </div>

    <div class="card" style="grid-column: 1 / -1;">
      <header>提取到的颜色</header>
      <div class="actions" style="padding:12px 16px;">
        <button id="exportJSON" class="button secondary">导出 JSON</button>
        <button id="exportCSS" class="button secondary">复制 CSS 变量</button>
      </div>
      <div id="palette" class="palette" aria-live="polite"></div>
    </div>
  </div>

  <div class="footer">© 颜色提取 · 本工具可离线使用</div>

  <script>
  (function(){
    const root = document.documentElement;
    const savedTheme = localStorage.getItem('color-extract-theme');
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const initial = savedTheme || (prefersDark ? 'dark' : 'light');
    setTheme(initial);
    document.getElementById('themeToggle').addEventListener('click', () => {
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      setTheme(next);
    });
    function setTheme(mode) {
      root.setAttribute('data-theme', mode === 'dark' ? 'dark' : 'light');
      document.getElementById('themeLabel').textContent = mode === 'dark' ? '深色主题' : '浅色主题';
      localStorage.setItem('color-extract-theme', mode);
    }

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const drop = document.getElementById('drop');
    const fileInput = document.getElementById('fileInput');
    const pickBtn = document.getElementById('pick');
    const paletteEl = document.getElementById('palette');
    const sampleTip = document.getElementById('sampleTip');
    const useSampleBtn = document.getElementById('useSample');
    const colorCountRange = document.getElementById('colorCount');
    const colorCountLabel = document.getElementById('colorCountLabel');
    let currentImage;
    let lastPalette = [];
    const exportJSONBtn = document.getElementById('exportJSON');
    const exportCSSBtn = document.getElementById('exportCSS');
    exportJSONBtn.addEventListener('click', exportJSON);
    exportCSSBtn.addEventListener('click', exportCSS);

    colorCountRange.addEventListener('input', () => {
      colorCountLabel.textContent = colorCountRange.value;
      if (currentImage) {
        drawImage(currentImage);
        extractAndRenderPalette(currentImage, parseInt(colorCountRange.value, 10));
      }
    });

    pickBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (file) handleFile(file);
    });

    drop.addEventListener('click', () => fileInput.click());
    drop.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') fileInput.click();
    });
    drop.addEventListener('dragover', (e) => {
      e.preventDefault();
      drop.classList.add('hover');
    });
    drop.addEventListener('dragleave', () => drop.classList.remove('hover'));
    drop.addEventListener('drop', (e) => {
      e.preventDefault();
      drop.classList.remove('hover');
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      if (file) handleFile(file);
    });

    useSampleBtn.addEventListener('click', () => {
      // 轻量示例图片：320x180 多彩渐变
      const sampleCanvas = document.createElement('canvas');
      const w = 320, h = 180;
      sampleCanvas.width = w; sampleCanvas.height = h;
      const c = sampleCanvas.getContext('2d');
      const grad = c.createLinearGradient(0,0,w,h);
      grad.addColorStop(0, '#ff2d55');
      grad.addColorStop(0.25, '#ffcc00');
      grad.addColorStop(0.5, '#34c759');
      grad.addColorStop(0.75, '#0a84ff');
      grad.addColorStop(1, '#af52de');
      c.fillStyle = grad;
      c.fillRect(0,0,w,h);
      const url = sampleCanvas.toDataURL('image/png');
      loadImageUrl(url);
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!currentImage) return;
      const pos = getCanvasPos(e);
      const pixel = ctx.getImageData(pos.x, pos.y, 1, 1).data;
      const hex = rgbToHex(pixel[0], pixel[1], pixel[2]);
      sampleTip.style.display = 'block';
      sampleTip.innerHTML = '<span class="dot" style="background:'+hex+'"></span>' + 'RGB(' + pixel[0] + ',' + pixel[1] + ',' + pixel[2] + ') ' + hex;
      const rect = canvas.getBoundingClientRect();
      const tipW = sampleTip.offsetWidth || 120;
      const tipH = sampleTip.offsetHeight || 24;
      let left = e.clientX - rect.left + 12;
      let top = e.clientY - rect.top + 12;
      left = Math.min(Math.max(8, left), rect.width - tipW - 8);
      top = Math.min(Math.max(8, top), rect.height - tipH - 8);
      sampleTip.style.left = left + 'px';
      sampleTip.style.top = top + 'px';
    });
    canvas.addEventListener('mouseleave', () => { sampleTip.style.display = 'none'; });

    canvas.addEventListener('click', (e) => {
      if (!currentImage) return;
      const pos = getCanvasPos(e);
      const pixel = ctx.getImageData(pos.x, pos.y, 1, 1).data;
      const hex = rgbToHex(pixel[0], pixel[1], pixel[2]);
      copy(hex);
      flash('已复制 ' + hex);
    });

    function getCanvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = Math.min(canvas.width-1, Math.max(0, Math.floor((e.clientX - rect.left) * scaleX)));
      const y = Math.min(canvas.height-1, Math.max(0, Math.floor((e.clientY - rect.top) * scaleY)));
      return { x, y };
    }

    function handleFile(file) {
      if (!file.type.startsWith('image/')) {
        alert('请选择图片文件');
        return;
      }
      const url = URL.createObjectURL(file);
      loadImageUrl(url, true);
    }

    function loadImageUrl(url, revoke=false) {
      const img = new Image();
      img.onload = () => {
        currentImage = img;
        drawImage(img);
        extractAndRenderPalette(img, parseInt(colorCountRange.value, 10));
        if (revoke) URL.revokeObjectURL(url);
      };
      img.onerror = () => {
        alert('图片加载失败，请更换图片重试');
        if (revoke) URL.revokeObjectURL(url);
      };
      img.src = url;
    }

    function drawImage(img) {
      const maxW = 900;
      const ratio = img.width / img.height;
      let targetW = Math.min(maxW, img.width);
      let targetH = Math.round(targetW / ratio);
      if (targetH < 200) { targetH = 200; targetW = Math.round(targetH * ratio); }
      canvas.width = targetW;
      canvas.height = targetH;
      ctx.clearRect(0,0,targetW,targetH);
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(img, 0, 0, targetW, targetH);
    }

    function extractAndRenderPalette(img, maxColors=12) {
      const data = getImagePixels(img, 256);
      const bins = new Map(); // key -> {count, r, g, b}
      const LEVELS = 16; // 4-bit per channel
      for (let i = 0; i < data.length; i += 4) {
        const a = data[i+3];
        if (a < 16) continue; // 跳过近乎透明像素
        const r = data[i], g = data[i+1], b = data[i+2];
        const br = r >> 4, bg = g >> 4, bb = b >> 4;
        const key = (br<<8) | (bg<<4) | bb;
        let bin = bins.get(key);
        if (!bin) { bin = { count: 0, r: 0, g: 0, b: 0 }; bins.set(key, bin); }
        bin.count++;
        bin.r += r; bin.g += g; bin.b += b;
      }

      const totalNonTransparent = Array.from(bins.values()).reduce((acc, bin) => acc + bin.count, 0);

      const arr = Array.from(bins.entries()).map(([key, bin]) => {
        const avgR = Math.round(bin.r / bin.count);
        const avgG = Math.round(bin.g / bin.count);
        const avgB = Math.round(bin.b / bin.count);
        return { key, count: bin.count, r: avgR, g: avgG, b: avgB };
      }).sort((a,b) => b.count - a.count).slice(0, maxColors);

      lastPalette = arr.map(it => ({
        hex: rgbToHex(it.r, it.g, it.b),
        rgb: [it.r, it.g, it.b],
        percent: totalNonTransparent ? (it.count / totalNonTransparent) * 100 : 0
      }));

      renderPalette(arr, totalNonTransparent);
    }

    function getImagePixels(img, targetWidth=256) {
      const ratio = img.width / img.height;
      const w = Math.min(targetWidth, img.width);
      const h = Math.round(w / ratio);
      const off = document.createElement('canvas');
      off.width = w; off.height = h;
      const c = off.getContext('2d', { willReadFrequently: true });
      c.drawImage(img, 0, 0, w, h);
      return c.getImageData(0, 0, w, h).data;
    }

    function renderPalette(items, totalPixels) {
      paletteEl.innerHTML = '';
      if (!items.length) {
        const empty = document.createElement('div');
        empty.className = 'help';
        empty.textContent = '请先导入图片，提取到的颜色会显示在这里。';
        paletteEl.appendChild(empty);
        return;
      }
      items.forEach(it => {
        const percent = totalPixels ? (it.count / totalPixels) * 100 : 0;
        const hex = rgbToHex(it.r, it.g, it.b);
        const el = document.createElement('div');
        el.className = 'color-item';
        const sw = document.createElement('div');
        sw.className = 'swatch';
        sw.style.background = hex;
        const meta = document.createElement('div');
        meta.className = 'color-meta';
        const row1 = document.createElement('div');
        row1.className = 'row';
        const h = document.createElement('div');
        h.textContent = hex;
        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy';
        copyBtn.textContent = '复制';
        copyBtn.addEventListener('click', () => {
          copy(hex);
          flash('已复制 ' + hex);
        });
        row1.appendChild(h); row1.appendChild(copyBtn);
        const row2 = document.createElement('div');
        row2.className = 'row';
        const rgb = document.createElement('div');
        rgb.textContent = 'RGB(' + it.r + ',' + it.g + ',' + it.b + ')';
        const pct = document.createElement('div');
        pct.textContent = percent.toFixed(1) + '%';
        row2.appendChild(rgb); row2.appendChild(pct);
        meta.appendChild(row1); meta.appendChild(row2);

        el.appendChild(sw); el.appendChild(meta);
        paletteEl.appendChild(el);
      });
    }

    function rgbToHex(r,g,b) {
      const toHex = (n) => n.toString(16).padStart(2, '0');
      return '#' + toHex(r) + toHex(g) + toHex(b);
    }

    function copy(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta);
      ta.select(); try { document.execCommand('copy'); } catch(e) {}
      document.body.removeChild(ta);
    }

    function flash(msg) {
      const div = document.createElement('div');
      div.textContent = msg;
      div.style.position = 'fixed';
      div.style.left = '50%';
      div.style.top = '16px';
      div.style.transform = 'translateX(-50%)';
      div.style.background = 'rgba(0,0,0,.7)';
      div.style.color = '#fff';
      div.style.padding = '8px 12px';
      div.style.borderRadius = '10px';
      div.style.zIndex = '9999';
      document.body.appendChild(div);
      setTimeout(() => div.remove(), 1200);
    }

    function exportJSON() {
      if (!lastPalette || !lastPalette.length) { flash('暂无调色板可导出'); return; }
      const data = JSON.stringify(lastPalette, null, 2);
      const blob = new Blob([data], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'palette.json';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 500);
    }

    function exportCSS() {
      if (!lastPalette || !lastPalette.length) { flash('暂无调色板可复制'); return; }
      const vars = lastPalette.map((p, i) => `--color-${i+1}: ${p.hex};`).join('\n');
      const css = `:root {\n${vars}\n}`;
      copy(css);
      flash('已复制 CSS 变量');
    }

    // 初始占位
    renderPalette([], 0);
  })();
  </script>
</body>
</html>
