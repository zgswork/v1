<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目文件夹创建工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .folder-input-group {
            display: flex;
            gap: 10px;
        }

        .folder-input-group input {
            flex: 1;
        }

        .browse-btn {
            padding: 15px 20px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .browse-btn:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .create-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .create-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .create-btn:active {
            transform: translateY(-1px);
        }

        .create-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .preview {
            background: #f8f9fa;
            border: 2px dashed #dee2e6;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            color: #6c757d;
            font-size: 14px;
            min-height: 50px;
            display: flex;
            align-items: center;
            word-break: break-all;
            overflow-wrap: break-word;
        }

        .preview.active {
            border-color: #667eea;
            background: #f0f4ff;
            color: #333;
        }

        .preview-editable {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: inherit;
            resize: none;
            min-height: 20px;
        }

        .preview-editable:focus {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 5px;
            padding: 5px;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-weight: 500;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
            word-break: break-all;
            overflow-wrap: break-word;
        }
        
        .result p {
            word-break: break-all;
            overflow-wrap: break-word;
        }
        
        .result p[style*="font-family"] {
            font-size: 12px;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-all;
            overflow-wrap: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .result.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .result.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .result.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .dictionary-section {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }

        .dictionary-section h3 {
            color: #856404;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .dict-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .dict-input-group input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .add-dict-btn {
            padding: 10px 20px;
            background: #ffc107;
            color: #212529;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .add-dict-btn:hover {
            background: #e0a800;
        }

        .dict-list {
            max-height: 150px;
            overflow-y: auto;
            background: #f8f9fa;
            border-radius: 5px;
            padding: 10px;
            margin-top: 10px;
        }

        .dict-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            border-bottom: 1px solid #dee2e6;
            font-size: 12px;
        }

        .dict-item:last-child {
            border-bottom: none;
        }

        .dict-remove-btn {
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 2px 6px;
            cursor: pointer;
            font-size: 10px;
        }

        .dict-remove-btn:hover {
            background: #c82333;
        }

        .tips {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            margin-top: 20px;
            border-radius: 0 10px 10px 0;
        }

        .tips h3 {
            color: #1976d2;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .tips ul {
            color: #424242;
            padding-left: 20px;
        }

        .tips li {
            margin-bottom: 5px;
            font-size: 14px;
        }

        .copy-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 项目文件夹创建工具</h1>
        
        <form id="folderForm">
            <div class="form-group">
                <label for="basePath">目标文件夹路径：</label>
                <input type="text" id="basePath" placeholder="例如: D:\projects" required>
            </div>

            <div class="form-group">
                <label for="appName">应用名称（中文）：</label>
                <input type="text" id="appName" placeholder="例如: 待办事项管理器" required>
            </div>

            <div class="preview" id="preview">
                <textarea class="preview-editable" id="previewEditable" placeholder="完整路径将在这里显示..." readonly></textarea>
            </div>

            <button type="submit" class="create-btn" id="createBtn">
                ✨ 创建项目文件夹
            </button>
        </form>

        <div id="result"></div>

        <div class="dictionary-section">
            <h3>📚 词库管理</h3>
            <div class="dict-input-group">
                <input type="text" id="chineseWord" placeholder="中文词汇（如：朋友圈）">
                <input type="text" id="englishWord" placeholder="英文翻译（如：moments）">
                <button type="button" class="add-dict-btn" onclick="addToDictionary()">添加到词库</button>
            </div>
            <div class="dict-list" id="dictList">
                <div style="text-align: center; color: #6c757d; font-size: 12px;">自定义词汇将显示在这里</div>
            </div>
        </div>

        <div class="tips">
            <h3>💡 使用提示</h3>
            <ul>
                <li>应用名称支持中文，会自动转换为英文文件夹名</li>
                <li>预览框可以直接编辑，修改文件夹名称</li>
                <li>可以添加自定义词汇到词库中</li>
                <li>使用jieba分词进行精准翻译</li>
                <li>生成的文件夹名可直接复制使用</li>
            </ul>
        </div>
    </div>

    <!-- 引入jieba.js分词库 -->
    <script src="https://unpkg.com/jieba-js@1.0.0/dist/jieba.min.js"></script>
    
    <script>
        let jiebaReady = false;
        
        // 自定义词库存储
        let customDictionary = {};
        
        // 从localStorage加载自定义词库
        function loadCustomDictionary() {
            try {
                const saved = localStorage.getItem('customDictionary');
                if (saved) {
                    customDictionary = JSON.parse(saved);
                    updateDictList();
                }
            } catch (e) {
                console.log('加载自定义词库失败:', e);
            }
        }
        
        // 保存自定义词库到localStorage
        function saveCustomDictionary() {
            try {
                localStorage.setItem('customDictionary', JSON.stringify(customDictionary));
            } catch (e) {
                console.log('保存自定义词库失败:', e);
            }
        }
        
        // 添加词汇到自定义词库
        function addToDictionary() {
            const chineseInput = document.getElementById('chineseWord');
            const englishInput = document.getElementById('englishWord');
            
            const chinese = chineseInput.value.trim();
            const english = englishInput.value.trim();
            
            if (!chinese || !english) {
                alert('请填写完整的中文词汇和英文翻译！');
                return;
            }
            
            // 验证英文只包含字母、数字、下划线、连字符
            if (!/^[a-zA-Z0-9_-]+$/.test(english)) {
                alert('英文翻译只能包含字母、数字、下划线和连字符！');
                return;
            }
            
            customDictionary[chinese] = english.toLowerCase();
            saveCustomDictionary();
            updateDictList();
            
            // 清空输入框
            chineseInput.value = '';
            englishInput.value = '';
            
            // 重新生成预览
            updatePreview();
            
            alert(`已添加：${chinese} → ${english}`);
        }
        
        // 从自定义词库删除词汇
        function removeFromDictionary(chinese) {
            if (confirm(`确定要删除 "${chinese}" 吗？`)) {
                delete customDictionary[chinese];
                saveCustomDictionary();
                updateDictList();
                updatePreview();
            }
        }
        
        // 更新词库列表显示
        function updateDictList() {
            const dictList = document.getElementById('dictList');
            if (!dictList) return;
            
            const entries = Object.entries(customDictionary);
            if (entries.length === 0) {
                dictList.innerHTML = '<div style="text-align: center; color: #6c757d; font-size: 12px;">自定义词汇将显示在这里</div>';
                return;
            }
            
            dictList.innerHTML = entries.map(([chinese, english]) => `
                <div class="dict-item">
                    <span>${chinese} → ${english}</span>
                    <button class="dict-remove-btn" onclick="removeFromDictionary('${chinese}')">删除</button>
                </div>
            `).join('');
        }
        
        // 检查jieba库是否加载成功
        function checkJieba() {
            if (typeof jieba !== 'undefined' && jieba.cut) {
                jiebaReady = true;
                console.log('jieba分词库已就绪');
                return true;
            }
            return false;
        }
        
        // 等待jieba库加载
        async function waitForJieba() {
            return new Promise((resolve) => {
                if (checkJieba()) {
                    resolve(true);
                    return;
                }
                
                let attempts = 0;
                const maxAttempts = 50; // 最多等待5秒
                
                const checkInterval = setInterval(() => {
                    attempts++;
                    if (checkJieba()) {
                        clearInterval(checkInterval);
                        resolve(true);
                    } else if (attempts >= maxAttempts) {
                        clearInterval(checkInterval);
                        console.log('jieba库加载超时，使用备用方案');
                        resolve(false);
                    }
                }, 100);
            });
        }
        
        // 中文到英文的常用词汇映射
        const chineseToEnglish = {
            // 基础词汇
            '管理': 'manager', '管理器': 'manager', '系统': 'system', '工具': 'tool', '应用': 'app', '网站': 'website',
            '平台': 'platform', '服务': 'service', '客户端': 'client', '服务器': 'server', '数据库': 'database',
            '接口': 'api', '框架': 'framework', '组件': 'component', '模块': 'module', '插件': 'plugin',
            '项目': 'project', '任务': 'task', '待办': 'todo', '事项': 'item', '列表': 'list',
            '表格': 'table', '表单': 'form', '页面': 'page', '界面': 'ui', '用户': 'user',
            '登录': 'login', '注册': 'register', '购物': 'shopping', '商城': 'mall', '商店': 'shop',
            '博客': 'blog', '论坛': 'forum', '聊天': 'chat', '消息': 'message', '通知': 'notification',
            '邮件': 'email', '文件': 'file', '视频': 'video', '音频': 'audio',
            '游戏': 'game', '计算器': 'calculator', '日历': 'calendar', '时钟': 'clock', '天气': 'weather',
            '新闻': 'news', '搜索': 'search', '导航': 'navigation', '菜单': 'menu', '按钮': 'button',
            '设置': 'settings', '配置': 'config', '帮助': 'help', '关于': 'about', '首页': 'home',
            
            // 图片相关词汇 - 更精确的翻译
            '图片': 'image', '图像': 'image', '照片': 'photo', '相片': 'photo', '截图': 'screenshot',
            '图标': 'icon', '头像': 'avatar', '缩略图': 'thumbnail', '预览图': 'preview',
            '背景图': 'background', '壁纸': 'wallpaper', '海报': 'poster', '横幅': 'banner',
            '轮播图': 'carousel', '画廊': 'gallery', '相册': 'album', '图集': 'gallery',
            
            // 图片处理相关
            '分割': 'split', '切割': 'cut', '裁剪': 'crop', '剪切': 'clip', '分离': 'separate',
            '自由': 'free', '智能': 'smart', '手动': 'manual', '自动': 'auto',

            // 社交平台和应用
            '小红书': 'xiaohongshu', '微信': 'wechat', '微博': 'weibo', '抖音': 'douyin',
            '快手': 'kuaishou', '淘宝': 'taobao', '京东': 'jingdong', '支付宝': 'alipay',
            '百度': 'baidu', '腾讯': 'tencent', '阿里': 'ali', '字节': 'bytedance',
            '朋友圈': 'moments', '朋友': 'friend', '圈子': 'circle', '社交圈': 'social_circle',
            'QQ': 'qq', 'QQ空间': 'qzone', '空间': 'space', '动态': 'timeline',
            
            // 数量和操作相关
            '批量': 'batch', '单个': 'single', '多个': 'multiple', '全部': 'all',
            '自动': 'auto', '手动': 'manual', '定时': 'scheduled', '实时': 'realtime',
            '一键': 'oneclick', '快捷': 'shortcut', '便捷': 'convenient',
            '点赞': 'like', '分享': 'share', '评论': 'comment', '收藏': 'favorite'
        };

        // 使用jieba进行中文分词
        async function segmentChinese(text) {
            // 等待jieba库加载
            const jiebaLoaded = await waitForJieba();
            
            if (jiebaLoaded && typeof jieba !== 'undefined' && jieba.cut) {
                try {
                    // 使用jieba进行分词
                    const segments = jieba.cut(text, false);
                    console.log('jieba分词结果:', segments);
                    return segments.filter(seg => seg.trim().length > 0);
                } catch (e) {
                    console.log('jieba分词失败:', e);
                }
            }
            
            // 如果jieba不可用，使用备用分词
            console.log('使用备用分词方案');
            return fallbackSegment(text);
        }
        
        // 备用分词函数
        function fallbackSegment(text) {
            const segments = [];
            let i = 0;
            
            while (i < text.length) {
                let matched = false;
                
                // 尝试从最长的词开始匹配（最长6个字符）
                for (let len = Math.min(6, text.length - i); len >= 1; len--) {
                    const substr = text.substr(i, len);
                    if (chineseToEnglish[substr] || customDictionary[substr]) {
                        segments.push(substr);
                        i += len;
                        matched = true;
                        break;
                    }
                }
                
                // 如果没有匹配到词典中的词，按单个字符处理
                if (!matched) {
                    const char = text[i];
                    if (/[\u4e00-\u9fff]/.test(char)) {
                        segments.push(char);
                    }
                    i++;
                }
            }
            
            return segments.filter(seg => seg.trim().length > 0);
        }

        // 将单个词首字母大写
        function capitalizeFirst(word) {
            if (!word) return '';
            return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
        }

        // 将中文转换为英文文件夹名
        async function chineseToEnglishName(chineseName) {
            // 1. 先进行分词
            const segments = await segmentChinese(chineseName);
            console.log('🔍 分词结果:', segments);
            
            // 2. 翻译每个词
            const translatedWords = [];
            const debugInfo = [];
            
            for (const segment of segments) {
                // 优先检查自定义词库
                if (customDictionary[segment]) {
                    const translation = customDictionary[segment];
                    translatedWords.push(translation);
                    debugInfo.push(`"${segment}" → "${translation}" (自定义)`);
                } else if (chineseToEnglish[segment]) {
                    // 检查内置词典
                    const translation = chineseToEnglish[segment];
                    translatedWords.push(translation);
                    debugInfo.push(`"${segment}" → "${translation}"`);
                } else {
                    // 如果词典中没有，记录未翻译的词
                    debugInfo.push(`"${segment}" → 未找到翻译`);
                    console.warn(`⚠️ 词典中缺少翻译: "${segment}"`);
                    
                    // 尝试字符级别的处理
                    let processed = segment
                        .replace(/[\u4e00-\u9fff]/g, '') // 移除未翻译的中文字符
                        .replace(/[^\w]/g, '') // 移除特殊字符
                        .toLowerCase();
                    
                    if (processed) {
                        translatedWords.push(processed);
                    }
                }
            }
            
            console.log('📝 翻译详情:', debugInfo);
            
            // 3. 过滤空词并首字母大写
            const finalWords = translatedWords
                .filter(word => word && word.length > 0)
                .map(word => capitalizeFirst(word));
            
            console.log('✅ 最终结果:', finalWords);
            
            // 4. 用下划线连接
            let result = finalWords.join('_');
            
            // 如果结果为空，使用默认名称
            if (!result || result.length < 2) {
                result = 'New_Project';
            }
            
            return result;
        }

        // 更新预览
        async function updatePreview() {
            const basePath = document.getElementById('basePath').value.trim();
            const appName = document.getElementById('appName').value.trim();
            const previewEditable = document.getElementById('previewEditable');
            const preview = document.getElementById('preview');
            
            if (basePath && appName) {
                try {
                    previewEditable.value = '正在生成预览...';
                    const englishName = await chineseToEnglishName(appName);
                    const fullPath = basePath.replace(/[\\\/]+$/, '') + '\\' + englishName;
                    previewEditable.value = fullPath;
                    previewEditable.readOnly = false;
                    preview.classList.add('active');
                } catch (e) {
                    previewEditable.value = '预览生成失败，请重试';
                    console.error('预览生成错误:', e);
                }
            } else {
                previewEditable.value = '完整路径将在这里显示...';
                previewEditable.readOnly = true;
                preview.classList.remove('active');
            }
        }


        // 创建文件夹
        async function createFolder() {
            const previewEditable = document.getElementById('previewEditable');
            const resultDiv = document.getElementById('result');
            
            const fullPath = previewEditable.value.trim();
            
            if (!fullPath || fullPath === '完整路径将在这里显示...' || fullPath === '正在生成预览...') {
                showResult('请先填写完整信息并生成预览路径！', 'error');
                return;
            }
            
            try {
                showResult('正在生成创建指令...', 'info');
                
                // 显示成功信息和创建指令
                const mkdirCommand = `mkdir "${fullPath}"`;
                // 使用全局变量存储要复制的内容
                window.currentPath = fullPath;
                window.currentCommand = mkdirCommand;
                
                const instructions = `
                    <div>
                        <p><strong>💻 命令行创建：</strong></p>
                        <div style="font-family: 'Courier New', monospace; background: #f8f9fa; padding: 15px; border-radius: 5px; margin: 10px 0; word-break: break-all; display: flex; align-items: center; gap: 10px;">
                            <span style="flex: 1;">mkdir "${fullPath}"</span>
                            <button class="copy-btn" onclick="copyToClipboard(window.currentCommand)">复制命令</button>
                        </div>
                    </div>
                `;
                
                showResult(instructions, 'success');
                
            } catch (error) {
                showResult('创建文件夹时出现错误：' + error.message, 'error');
            }
        }

        // 复制到剪贴板
        function copyToClipboard(text) {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(text).then(() => {
                        alert('已复制到剪贴板！');
                    }).catch(() => {
                        fallbackCopy(text);
                    });
                } else {
                    fallbackCopy(text);
                }
            } catch (err) {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            textArea.style.top = '-999999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                alert('已复制到剪贴板！');
            } catch (err) {
                alert('复制失败，请手动复制：\n' + text);
            }
            document.body.removeChild(textArea);
        }

        // 显示结果
        function showResult(message, type) {
            const resultDiv = document.getElementById('result');
            if (resultDiv) {
                resultDiv.innerHTML = message;
                resultDiv.className = `result ${type}`;
                
                try {
                    resultDiv.scrollIntoView({ behavior: 'smooth' });
                } catch (e) {
                    resultDiv.scrollIntoView();
                }
            }
        }

        // 页面加载完成后的初始化
        document.addEventListener('DOMContentLoaded', function() {
            try {
                // 加载自定义词库
                loadCustomDictionary();
                
                // 绑定事件监听器
                const basePathInput = document.getElementById('basePath');
                const appNameInput = document.getElementById('appName');
                const folderForm = document.getElementById('folderForm');
                
                if (basePathInput) {
                    basePathInput.addEventListener('input', updatePreview);
                }
                
                if (appNameInput) {
                    appNameInput.addEventListener('input', updatePreview);
                }
                
                if (folderForm) {
                    folderForm.addEventListener('submit', function(e) {
                        e.preventDefault();
                        createFolder();
                    });
                }
                
                // 为词库输入框添加回车键支持
                const chineseWordInput = document.getElementById('chineseWord');
                const englishWordInput = document.getElementById('englishWord');
                
                if (chineseWordInput && englishWordInput) {
                    [chineseWordInput, englishWordInput].forEach(input => {
                        input.addEventListener('keypress', function(e) {
                            if (e.key === 'Enter') {
                                addToDictionary();
                            }
                        });
                    });
                }
                
                // 初始化预览
                updatePreview();
                
                // 检查jieba库状态
                setTimeout(() => {
                    if (checkJieba()) {
                        console.log('jieba库已准备就绪');
                    } else {
                        console.log('jieba库未加载，将使用备用分词');
                    }
                }, 1000);
            } catch (error) {
                console.error('初始化错误:', error);
            }
        });
    </script>
</body>
</html>
