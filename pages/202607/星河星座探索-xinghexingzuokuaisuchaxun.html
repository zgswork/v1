<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星河星座探索</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0b0b2d, #1a1a4a, #0b0b2d);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            position: relative;
        }
        
        header {
            text-align: center;
            padding: 30px 0;
            width: 100%;
        }
        
        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ff6ec4, #7873f5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 110, 196, 0.5);
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 30px;
        }
        
        .date-input {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 15px;
            width: 100%;
            max-width: 500px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }
        
        label {
            margin-bottom: 8px;
            font-weight: bold;
            color: #a5a5ff;
        }
        
        input[type="date"] {
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 1.1rem;
        }
        
        button {
            padding: 12px 25px;
            background: linear-gradient(90deg, #9d50bb, #6e48aa);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            width: 100%;
            font-size: 1.1rem;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 15px rgba(110, 72, 170, 0.4);
        }
        
        .result {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 15px;
            width: 100%;
            max-width: 800px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.5s ease;
        }
        
        .zodiac-title {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #ff9d6e;
        }
        
        .zodiac-date {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 20px;
        }
        
        .zodiac-description {
            line-height: 1.6;
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }
        
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle linear infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }
        
        .constellation {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0.3;
            transition: opacity 1s ease;
        }
        
        .galaxy {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle at center, rgba(92, 126, 240, 0.2) 0%, transparent 70%);
            animation: rotate 120s linear infinite;
            box-shadow: 0 0 200px rgba(92, 126, 240, 0.2);
        }
        
        @keyframes rotate {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        footer {
            margin-top: 30px;
            text-align: center;
            opacity: 0.7;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            
            .date-input, .result {
                padding: 15px;
            }
            
            .zodiac-title {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="stars-container" id="stars-container">
        <div class="galaxy"></div>
        <canvas id="constellation" class="constellation"></canvas>
    </div>
    
    <div class="container">
        <header>
            <h1>星河星座探索</h1>
            <p class="subtitle">输入您的生日，探索属于您的星座奥秘</p>
        </header>
        
        <div class="date-input">
            <div class="input-group">
                <label for="birthday">选择您的生日：</label>
                <input type="date" id="birthday" name="birthday">
            </div>
            <button id="reveal-btn">揭示星座</button>
        </div>
        
        <div class="result" id="result">
            <h2 class="zodiac-title">您的星座将在这里显示</h2>
            <p class="zodiac-date">选择日期后查看星座信息</p>
            <p class="zodiac-description">探索星座的奥秘，了解星空对您命运的影响。</p>
        </div>
        
        <footer>
            <p>© 2023 星河星座探索 | 探索宇宙的奥秘</p>
        </footer>
    </div>

    <script>
        // 星座数据
        const zodiacData = [
            { name: "摩羯座", date: "12月22日-1月19日", element: "土象", description: "摩羯座的人稳重踏实，富有责任感，有着强烈的进取心和毅力。" },
            { name: "水瓶座", date: "1月20日-2月18日", element: "风象", description: "水瓶座的人思想独立，富有创造力，喜欢创新和追求自由。" },
            { name: "双鱼座", date: "2月19日-3月20日", element: "水象", description: "双鱼座的人富有同情心，直觉敏锐，充满想象力和艺术气质。" },
            { name: "白羊座", date: "3月21日-4月19日", element: "火象", description: "白羊座的人充满活力，勇敢直率，喜欢挑战和领导他人。" },
            { name: "金牛座", date: "4月20日-5月20日", element: "土象", description: "金牛座的人务实稳重，注重安全感，有着坚定的意志和耐心。" },
            { name: "双子座", date: "5月21日-6月20日", element: "风象", description: "双子座的人聪明灵活，善于沟通，喜欢变化和多样性。" },
            { name: "巨蟹座", date: "6月21日-7月22日", element: "水象", description: "巨蟹座的人情感丰富，保护性强，家庭观念重且富有同情心。" },
            { name: "狮子座", date: "7月23日-8月22日", element: "火象", description: "狮子座的人自信大方，富有领导力，喜欢成为关注焦点。" },
            { name: "处女座", date: "8月23日-9月22日", element: "土象", description: "处女座的人注重细节，分析力强，追求完美和有序。" },
            { name: "天秤座", date: "9月23日-10月22日", element: "风象", description: "天秤座的人追求和谐，善于交际，注重公平和美感。" },
            { name: "天蝎座", date: "10月23日-11月21日", element: "水象", description: "天蝎座的人热情深刻，直觉敏锐，有着强大的意志力和洞察力。" },
            { name: "射手座", date: "11月22日-12月21日", element: "火象", description: "射手座的人乐观开朗，热爱自由，喜欢探索和冒险。" }
        ];

        // 获取DOM元素
        const birthdayInput = document.getElementById('birthday');
        const revealBtn = document.getElementById('reveal-btn');
        const resultDiv = document.getElementById('result');
        const zodiacTitle = document.querySelector('.zodiac-title');
        const zodiacDate = document.querySelector('.zodiac-date');
        const zodiacDescription = document.querySelector('.zodiac-description');
        const constellationCanvas = document.getElementById('constellation');
        const ctx = constellationCanvas.getContext('2d');

        // 设置Canvas尺寸
        function setCanvasSize() {
            constellationCanvas.width = window.innerWidth;
            constellationCanvas.height = window.innerHeight;
        }

        // 初始化
        window.addEventListener('load', function() {
            setCanvasSize();
            createStars();
            drawConstellation('default');
        });

        window.addEventListener('resize', function() {
            setCanvasSize();
            drawConstellation(currentZodiac);
        });

        // 创建星星
        function createStars() {
            const starsContainer = document.getElementById('stars-container');
            starsContainer.innerHTML = '<div class="galaxy"></div>';
            
            for (let i = 0; i < 200; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                
                // 随机大小和位置
                const size = Math.random() * 3;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                
                // 随机动画持续时间
                star.style.animationDuration = (Math.random() * 5 + 3) + 's';
                star.style.animationDelay = (Math.random() * 5) + 's';
                
                starsContainer.appendChild(star);
            }
            
            // 添加银河背景
            starsContainer.appendChild(constellationCanvas);
        }

        let currentZodiac = 'default';

        // 绘制星座
        function drawConstellation(zodiac) {
            currentZodiac = zodiac;
            ctx.clearRect(0, 0, constellationCanvas.width, constellationCanvas.height);
            
            // 绘制星星
            const starCount = 200;
            const stars = [];
            
            for (let i = 0; i < starCount; i++) {
                const x = Math.random() * constellationCanvas.width;
                const y = Math.random() * constellationCanvas.height;
                const size = Math.random() * 2 + 1;
                const opacity = Math.random() * 0.5 + 0.5;
                
                stars.push({x, y, size});
                
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                ctx.fill();
            }
            
            // 绘制星座连线（简化版）
            if (zodiac !== 'default') {
                for (let i = 0; i < stars.length - 1; i += 3) {
                    if (Math.random() > 0.7) {
                        ctx.beginPath();
                        ctx.moveTo(stars[i].x, stars[i].y);
                        ctx.lineTo(stars[i+1].x, stars[i+1].y);
                        ctx.strokeStyle = 'rgba(100, 150, 255, 0.3)';
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
            }
        }

        // 根据日期获取星座
        function getZodiacSign(day, month) {
            if ((month === 12 && day >= 22) || (month === 1 && day <= 19)) return 0;
            if ((month === 1 && day >= 20) || (month === 2 && day <= 18)) return 1;
            if ((month === 2 && day >= 19) || (month === 3 && day <= 20)) return 2;
            if ((month === 3 && day >= 21) || (month === 4 && day <= 19)) return 3;
            if ((month === 4 && day >= 20) || (month === 5 && day <= 20)) return 4;
            if ((month === 5 && day >= 21) || (month === 6 && day <= 20)) return 5;
            if ((month === 6 && day >= 21) || (month === 7 && day <= 22)) return 6;
            if ((month === 7 && day >= 23) || (month === 8 && day <= 22)) return 7;
            if ((month === 8 && day >= 23) || (month === 9 && day <= 22)) return 8;
            if ((month === 9 && day >= 23) || (month === 10 && day <= 22)) return 9;
            if ((month === 10 && day >= 23) || (month === 11 && day <= 21)) return 10;
            if ((month === 11 && day >= 22) || (month === 12 && day <= 21)) return 11;
        }

        // 显示星座信息
        function showZodiacInfo(zodiacIndex) {
            const zodiac = zodiacData[zodiacIndex];
            
            zodiacTitle.textContent = zodiac.name;
            zodiacDate.textContent = zodiac.date + " | " + zodiac.element;
            zodiacDescription.textContent = zodiac.description;
            
            // 添加显示动画
            resultDiv.style.opacity = 0;
            setTimeout(() => {
                resultDiv.style.opacity = 1;
            }, 300);
            
            // 绘制对应的星座
            drawConstellation(zodiacIndex);
        }

        // 按钮点击事件
        revealBtn.addEventListener('click', function() {
            const birthday = new Date(birthdayInput.value);
            
            if (isNaN(birthday.getTime())) {
                alert('请选择有效的日期');
                return;
            }
            
            const day = birthday.getDate();
            const month = birthday.getMonth() + 1;
            
            const zodiacIndex = getZodiacSign(day, month);
            showZodiacInfo(zodiacIndex);
        });

        // 初始显示当前日期
        const today = new Date();
        const formattedDate = today.getFullYear() + '-' + 
                             String(today.getMonth() + 1).padStart(2, '0') + '-' + 
                             String(today.getDate()).padStart(2, '0');
        birthdayInput.value = formattedDate;
        
        // 初始显示当前星座
        const zodiacIndex = getZodiacSign(today.getDate(), today.getMonth() + 1);
        showZodiacInfo(zodiacIndex);
    </script>
</body>
</html>
