<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>部编版高中古诗文抽查系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', '宋体', serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
            padding: 40px 0;
        }

        .header h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            font-weight: 300;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
            font-style: italic;
        }

        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .tab-button {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .tab-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .tab-button.active {
            background: white;
            color: #667eea;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .tab-content {
            display: none;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            animation: fadeIn 0.5s ease-in-out;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .selector-section {
            margin-bottom: 30px;
            text-align: center;
        }

        .selector-title {
            font-size: 1.5rem;
            color: #667eea;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .book-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .book-option {
            display: flex;
            align-items: center;
            background: #f8f9fa;
            padding: 12px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .book-option:hover {
            background: #e9ecef;
            transform: scale(1.05);
        }

        .book-option.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .book-option input {
            margin-right: 8px;
        }

        .action-button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            margin: 30px auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .action-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .action-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .poem-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            border-left: 5px solid #667eea;
        }

        .poem-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .poem-title {
            font-size: 1.8rem;
            color: #667eea;
            margin-bottom: 10px;
            text-align: center;
            font-weight: 500;
        }

        .poem-meta {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .poem-content {
            font-size: 1.3rem;
            line-height: 2;
            text-align: center;
            white-space: pre-line;
            color: #2c3e50;
            font-family: 'KaiTi', serif;
        }

        .hidden-content {
            background: #e9ecef;
            color: transparent;
            user-select: none;
            border-radius: 5px;
            padding: 3px 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .hidden-content:hover {
            background: #dee2e6;
        }

        .hidden-content.revealed {
            background: none;
            color: #2c3e50;
            cursor: default;
        }

        .quiz-section {
            text-align: center;
        }

        .quiz-question {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .quiz-title {
            font-size: 1.5rem;
            color: #667eea;
            margin-bottom: 15px;
        }

        .quiz-prompt {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .quiz-input {
            width: 100%;
            max-width: 500px;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 1.1rem;
            margin-bottom: 15px;
            text-align: center;
            transition: border-color 0.3s ease;
        }

        .quiz-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 1rem;
            opacity: 0.9;
        }

        .progress-bar {
            background: #e9ecef;
            border-radius: 10px;
            height: 25px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .progress-fill {
            background: linear-gradient(45deg, #667eea, #764ba2);
            height: 100%;
            transition: width 0.5s ease;
            border-radius: 10px;
        }

        .library-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .library-item {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .library-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .library-title {
            font-size: 1.3rem;
            color: #667eea;
            margin-bottom: 5px;
        }

        .library-meta {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .library-preview {
            color: #2c3e50;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .header h1 {
                font-size: 2.2rem;
            }

            .tab-content {
                padding: 20px;
            }

            .book-selector {
                flex-direction: column;
                align-items: center;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>部编版高中古诗文抽查系统</h1>
            <p>传承经典文化，提升文学素养</p>
        </div>

        <div class="tabs">
            <button class="tab-button active" onclick="showTab('poem-quiz')">诗文抽查</button>
            <button class="tab-button" onclick="showTab('famous-lines')">名句接龙</button>
            <button class="tab-button" onclick="showTab('poem-library')">诗文库</button>
            <button class="tab-button" onclick="showTab('statistics')">学习统计</button>
        </div>

        <!-- 诗文抽查标签页 -->
        <div id="poem-quiz" class="tab-content active">
            <div class="selector-section">
                <h2 class="selector-title">选择教材范围</h2>
                <div class="book-selector">
                    <div class="book-option" onclick="toggleBook(this, '必修上')">
                        <input type="checkbox" id="必修上">
                        <label for="必修上">必修上册</label>
                    </div>
                    <div class="book-option" onclick="toggleBook(this, '必修下')">
                        <input type="checkbox" id="必修下">
                        <label for="必修下">必修下册</label>
                    </div>
                    <div class="book-option" onclick="toggleBook(this, '选必上')">
                        <input type="checkbox" id="选必上">
                        <label for="选必上">选择性必修上册</label>
                    </div>
                    <div class="book-option" onclick="toggleBook(this, '选必中')">
                        <input type="checkbox" id="选必中">
                        <label for="选必中">选择性必修中册</label>
                    </div>
                    <div class="book-option" onclick="toggleBook(this, '选必下')">
                        <input type="checkbox" id="选必下">
                        <label for="选必下">选择性必修下册</label>
                    </div>
                </div>
            </div>

            <button class="action-button" onclick="startPoemQuiz()">开始抽查</button>

            <div id="quiz-content" style="display: none;">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number" id="total-count">0</div>
                        <div class="stat-label">总篇数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="current-index">0</div>
                        <div class="stat-label">当前篇目</div>
                    </div>
                </div>

                <div class="progress-bar">
                    <div class="progress-fill" id="progress-bar" style="width: 0%"></div>
                </div>

                <div class="poem-card" id="quiz-poem">
                    <div class="poem-title" id="quiz-title"></div>
                    <div class="poem-meta" id="quiz-meta"></div>
                    <div class="poem-content hidden-content" id="quiz-content-text">点击显示全文</div>
                </div>

                <button class="action-button" onclick="nextPoem()">下一篇</button>
                <button class="action-button" onclick="resetQuiz()">重新开始</button>
            </div>
        </div>

        <!-- 名句接龙标签页 -->
        <div id="famous-lines" class="tab-content">
            <div class="selector-section">
                <h2 class="selector-title">选择接龙范围</h2>
                <div class="book-selector">
                    <div class="book-option" onclick="toggleLinesBook(this, '必修上')">
                        <input type="checkbox" id="lines-必修上">
                        <label for="lines-必修上">必修上册</label>
                    </div>
                    <div class="book-option" onclick="toggleLinesBook(this, '必修下')">
                        <input type="checkbox" id="lines-必修下">
                        <label for="lines-必修下">必修下册</label>
                    </div>
                    <div class="book-option" onclick="toggleLinesBook(this, '选必上')">
                        <input type="checkbox" id="lines-选必上">
                        <label for="lines-选必上">选择性必修上册</label>
                    </div>
                    <div class="book-option" onclick="toggleLinesBook(this, '选必中')">
                        <input type="checkbox" id="lines-选必中">
                        <label for="lines-选必中">选择性必修中册</label>
                    </div>
                    <div class="book-option" onclick="toggleLinesBook(this, '选必下')">
                        <input type="checkbox" id="lines-选必下">
                        <label for="lines-选必下">选择性必修下册</label>
                    </div>
                </div>
            </div>

            <button class="action-button" onclick="startLinesQuiz()">开始接龙</button>

            <div id="lines-quiz-content" style="display: none;">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number" id="lines-total">0</div>
                        <div class="stat-label">总句数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="lines-correct">0</div>
                        <div class="stat-label">正确数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="lines-accuracy">0%</div>
                        <div class="stat-label">正确率</div>
                    </div>
                </div>

                <div class="quiz-section">
                    <div class="quiz-question">
                        <h3 class="quiz-title">名句接龙</h3>
                        <p class="quiz-prompt" id="lines-prompt">上句：</p>
                        <input type="text" class="quiz-input" id="lines-input" placeholder="请输入下句...">
                        <button class="action-button" onclick="checkLineAnswer()">提交答案</button>
                        <div id="lines-result"></div>
                    </div>
                </div>

                <button class="action-button" onclick="nextLine()">下一题</button>
                <button class="action-button" onclick="resetLinesQuiz()">重新开始</button>
            </div>
        </div>

        <!-- 诗文库标签页 -->
        <div id="poem-library" class="tab-content">
            <div class="selector-section">
                <h2 class="selector-title">浏览诗文库</h2>
                <div class="book-selector">
                    <div class="book-option" onclick="filterLibrary('all')">
                        <input type="radio" name="library-filter" id="lib-all" checked>
                        <label for="lib-all">全部</label>
                    </div>
                    <div class="book-option" onclick="filterLibrary('必修上')">
                        <input type="radio" name="library-filter" id="lib-必修上">
                        <label for="lib-必修上">必修上册</label>
                    </div>
                    <div class="book-option" onclick="filterLibrary('必修下')">
                        <input type="radio" name="library-filter" id="lib-必修下">
                        <label for="lib-必修下">必修下册</label>
                    </div>
                    <div class="book-option" onclick="filterLibrary('选必上')">
                        <input type="radio" name="library-filter" id="lib-选必上">
                        <label for="lib-选必上">选择性必修上册</label>
                    </div>
                    <div class="book-option" onclick="filterLibrary('选必中')">
                        <input type="radio" name="library-filter" id="lib-选必中">
                        <label for="lib-选必中">选择性必修中册</label>
                    </div>
                    <div class="book-option" onclick="filterLibrary('选必下')">
                        <input type="radio" name="library-filter" id="lib-选必下">
                        <label for="lib-选必下">选择性必修下册</label>
                    </div>
                </div>
            </div>

            <div class="library-grid" id="library-content"></div>
        </div>

        <!-- 学习统计标签页 -->
        <div id="statistics" class="tab-content">
            <h2 class="selector-title">学习统计</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="stat-total-poems">60</div>
                    <div class="stat-label">总诗文数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="stat-quiz-times">0</div>
                    <div class="stat-label">抽查次数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="stat-lines-times">0</div>
                    <div class="stat-label">接龙次数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="stat-mastery">0%</div>
                    <div class="stat-label">掌握程度</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 部编版高中古诗文完整数据
        const poemsData = {
            '必修上': [
                {
                    title: '沁园春·长沙',
                    author: '毛泽东',
                    dynasty: '现代',
                    content: '独立寒秋，湘江北去，橘子洲头。\n看万山红遍，层林尽染；\n漫江碧透，百舸争流。\n鹰击长空，鱼翔浅底，万类霜天竞自由。\n怅寥廓，问苍茫大地，谁主沉浮？\n\n携来百侣曾游，忆往昔峥嵘岁月稠。\n恰同学少年，风华正茂；\n书生意气，挥斥方遒。\n指点江山，激扬文字，粪土当年万户侯。\n曾记否，到中流击水，浪遏飞舟？'
                },
                {
                    title: '芣苢',
                    author: '佚名',
                    dynasty: '先秦',
                    content: '采采芣苢，薄言采之。\n采采芣苢，薄言有之。\n\n采采芣苢，薄言掇之。\n采采芣苢，薄言捋之。\n\n采采芣苢，薄言袺之。\n采采芣苢，薄言襭之。'
                },
                {
                    title: '文氏外孙入村收麦',
                    author: '苏辙',
                    dynasty: '宋',
                    content: '欲收新麦继陈谷，赖有诸孙替老人。\n三夜阴霪败场圃，一竿晴日舞比邻。\n急炊大饼偿饥乏，多博村酤劳苦辛。\n闭廪归来真了事，赋诗怜汝足精神。'
                },
                {
                    title: '短歌行',
                    author: '曹操',
                    dynasty: '东汉',
                    content: '对酒当歌，人生几何！\n譬如朝露，去日苦多。\n慨当以慷，忧思难忘。\n何以解忧？唯有杜康。\n青青子衿，悠悠我心。\n但为君故，沉吟至今。\n呦呦鹿鸣，食野之苹。\n我有嘉宾，鼓瑟吹笙。\n明明如月，何时可掇？\n忧从中来，不可断绝。\n越陌度阡，枉用相存。\n契阔谈讌，心念旧恩。\n月明星稀，乌鹊南飞。\n绕树三匝，何枝可依？\n山不厌高，海不厌深。\n周公吐哺，天下归心。'
                },
                {
                    title: '归园田居（其一）',
                    author: '陶渊明',
                    dynasty: '东晋',
                    content: '少无适俗韵，性本爱丘山。\n误落尘网中，一去三十年。\n羁鸟恋旧林，池鱼思故渊。\n开荒南野际，守拙归园田。\n方宅十余亩，草屋八九间。\n榆柳荫后檐，桃李罗堂前。\n暧暧远人村，依依墟里烟。\n狗吠深巷中，鸡鸣桑树颠。\n户庭无尘杂，虚室有余闲。\n久在樊笼里，复得返自然。'
                },
                {
                    title: '梦游天姥吟留别',
                    author: '李白',
                    dynasty: '唐',
                    content: '海客谈瀛洲，烟涛微茫信难求；\n越人语天姥，云霞明灭或可睹。\n天姥连天向天横，势拔五岳掩赤城。\n天台四万八千丈，对此欲倒东南倾。\n我欲因之梦吴越，一夜飞度镜湖月。\n湖月照我影，送我至剡溪。\n谢公宿处今尚在，渌水荡漾清猿啼。\n脚著谢公屐，身登青云梯。\n半壁见海日，空中闻天鸡。\n千岩万转路不定，迷花倚石忽已暝。\n熊咆龙吟殷岩泉，栗深林兮惊层巅。\n云青青兮欲雨，水澹澹兮生烟。\n列缺霹雳，丘峦崩摧。\n洞天石扉，訇然中开。\n青冥浩荡不见底，日月照耀金银台。\n霓为衣兮风为马，云之君兮纷纷而来下。\n虎鼓瑟兮鸾回车，仙之人兮列如麻。\n忽魂悸以魄动，恍惊起而长嗟。\n惟觉时之枕席，失向来之烟霞。\n世间行乐亦如此，古来万事东流水。\n别君去兮何时还？且放白鹿青崖间。\n须行即骑访名山。\n安能摧眉折腰事权贵，使我不得开心颜！'
                },
                {
                    title: '登高',
                    author: '杜甫',
                    dynasty: '唐',
                    content: '风急天高猿啸哀，渚清沙白鸟飞回。\n无边落木萧萧下，不尽长江滚滚来。\n万里悲秋常作客，百年多病独登台。\n艰难苦恨繁霜鬓，潦倒新停浊酒杯。'
                },
                {
                    title: '琵琶行（并序）',

        // 全局变量
        let selectedBooks = [];
        let currentPoems = [];
        let currentLines = [];
        let currentQuizIndex = 0;
        let currentLinesIndex = 0;
        let quizCorrect = 0;
        let linesCorrect = 0;

        // 标签页切换
        function showTab(tabName) {
            const tabs = document.querySelectorAll('.tab-content');
            const buttons = document.querySelectorAll('.tab-button');
            
            tabs.forEach(tab => tab.classList.remove('active'));
            buttons.forEach(button => button.classList.remove('active'));
            
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
            
            if (tabName === 'poem-library') {
                displayLibrary();
            }
        }

        // 教材选择
        function toggleBook(element, book) {
            const checkbox = element.querySelector('input');
            checkbox.checked = !checkbox.checked;
            
            if (checkbox.checked) {
                element.classList.add('selected');
                if (!selectedBooks.includes(book)) {
                    selectedBooks.push(book);
                }
            } else {
                element.classList.remove('selected');
                selectedBooks = selectedBooks.filter(b => b !== book);
            }
        }

        function toggleLinesBook(element, book) {
            toggleBook(element, book);
        }

        // 诗文抽查
        function startPoemQuiz() {
            if (selectedBooks.length === 0) {
                alert('请至少选择一册教材！');
                return;
            }
            
            currentPoems = [];
            selectedBooks.forEach(book => {
                if (poemsData[book]) {
                    currentPoems = currentPoems.concat(poemsData[book]);
                }
            });
            
            if (currentPoems.length === 0) {
                alert('所选教材暂无诗文！');
                return;
            }
            
            // 随机排序
            currentPoems.sort(() => Math.random() - 0.5);
            
            document.getElementById('quiz-content').style.display = 'block';
            document.getElementById('total-count').textContent = currentPoems.length;
            currentQuizIndex = 0;
            displayCurrentPoem();
        }

        function displayCurrentPoem() {
            if (currentQuizIndex >= currentPoems.length) {
                alert('已完成所有抽查！');
                return;
            }
            
            const poem = currentPoems[currentQuizIndex];
            document.getElementById('quiz-title').textContent = poem.title;
            document.getElementById('quiz-meta').textContent = `${poem.dynasty} · ${poem.author}`;
            document.getElementById('quiz-content-text').textContent = '点击显示全文';
            document.getElementById('quiz-content-text').classList.add('hidden-content');
            document.getElementById('quiz-content-text').onclick = function() {
                this.textContent = poem.content;
                this.classList.remove('hidden-content');
            };
            
            document.getElementById('current-index').textContent = currentQuizIndex + 1;
            const progress = ((currentQuizIndex + 1) / currentPoems.length) * 100;
            document.getElementById('progress-bar').style.width = progress + '%';
        }

        function nextPoem() {
            currentQuizIndex++;
            displayCurrentPoem();
        }

        function resetQuiz() {
            document.getElementById('quiz-content').style.display = 'none';
            currentQuizIndex = 0;
            currentPoems = [];
        }

        // 名句接龙
        function startLinesQuiz() {
            if (selectedBooks.length === 0) {
                alert('请至少选择一册教材！');
                return;
            }
            
            currentLines = [];
            selectedBooks.forEach(book => {
                if (famousLines[book]) {
                    currentLines = currentLines.concat(famousLines[book]);
                }
            });
            
            if (currentLines.length === 0) {
                alert('所选教材暂无名句！');
                return;
            }
            
            // 随机排序
            currentLines.sort(() => Math.random() - 0.5);
            
            document.getElementById('lines-quiz-content').style.display = 'block';
            document.getElementById('lines-total').textContent = currentLines.length;
            currentLinesIndex = 0;
            linesCorrect = 0;
            displayCurrentLine();
        }

        function displayCurrentLine() {
            if (currentLinesIndex >= currentLines.length) {
                const accuracy = Math.round((linesCorrect / currentLines.length) * 100);
                alert(`接龙完成！\n总题数：${currentLines.length}\n正确数：${linesCorrect}\n正确率：${accuracy}%`);
                return;
            }
            
            const line = currentLines[currentLinesIndex];
            document.getElementById('lines-prompt').textContent = `上句：${line.first}`;
            document.getElementById('lines-input').value = '';
            document.getElementById('lines-result').innerHTML = '';
            document.getElementById('lines-correct').textContent = linesCorrect;
            document.getElementById('lines-accuracy').textContent = 
                Math.round((linesCorrect / (currentLinesIndex + 1)) * 100) + '%';
        }

        function checkLineAnswer() {
            const userAnswer = document.getElementById('lines-input').value.trim();
            const correctAnswer = currentLines[currentLinesIndex].second;
            
            if (userAnswer === correctAnswer) {
                document.getElementById('lines-result').innerHTML = 
                    '<div style="color: green; font-weight: bold;">✓ 回答正确！</div>';
                linesCorrect++;
            } else {
                document.getElementById('lines-result').innerHTML = 
                    `<div style="color: red; font-weight: bold;">✗ 回答错误！<br>正确答案：${correctAnswer}</div>`;
            }
        }

        function nextLine() {
            currentLinesIndex++;
            displayCurrentLine();
        }

        function resetLinesQuiz() {
            document.getElementById('lines-quiz-content').style.display = 'none';
            currentLinesIndex = 0;
            currentLines = [];
            linesCorrect = 0;
        }

        // 诗文库
        function displayLibrary(filter = 'all') {
            const libraryContent = document.getElementById('library-content');
            libraryContent.innerHTML = '';
            
            let poemsToShow = [];
            if (filter === 'all') {
                Object.values(poemsData).forEach(bookPoems => {
                    poemsToShow = poemsToShow.concat(bookPoems);
                });
            } else {
                poemsToShow = poemsData[filter] || [];
            }
            
            poemsToShow.forEach(poem => {
                const item = document.createElement('div');
                item.className = 'library-item';
                item.innerHTML = `
                    <div class="library-title">${poem.title}</div>
                    <div class="library-meta">${poem.dynasty} · ${poem.author}</div>
                    <div class="library-preview">${poem.content.substring(0, 50)}...</div>
                `;
                item.onclick = function() {
                    showPoemDetail(poem);
                };
                libraryContent.appendChild(item);
            });
        }

        function filterLibrary(book) {
            displayLibrary(book);
        }

        function showPoemDetail(poem) {
            alert(`${poem.title}\n${poem.dynasty} · ${poem.author}\n\n${poem.content}`);
        }

        // 初始化
        displayLibrary();
    </script>
