<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行程时间轴工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    
    <!-- 配置Tailwind自定义颜色和字体 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#60a5fa',
                        accent: '#f59e0b',
                        dark: '#1e293b',
                        light: '#f8fafc'
                    },
                    fontFamily: {
                        inter: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .card-shadow {
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            }
            .timeline-dot {
                @apply absolute w-4 h-4 rounded-full bg-primary border-4 border-white z-10;
            }
            .timeline-line {
                @apply absolute left-0 top-0 bottom-0 w-0.5 bg-gray-200;
            }
            .timeline-item {
                @apply relative pl-8 pb-8 last:pb-0;
            }
            .timeline-item::before {
                content: '';
                @apply timeline-dot -left-2 top-1;
            }
            .timeline-date-group::before {
                content: '';
                @apply timeline-line left-1;
            }
            .image-preview {
                @apply w-full h-48 object-cover rounded-lg mb-3;
            }
        }
    </style>
</head>
<body class="font-inter bg-gray-50 min-h-screen flex flex-col">
    <!-- 顶部导航 -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa fa-map-o text-primary text-2xl"></i>
                <h1 class="text-xl md:text-2xl font-bold text-primary">行程时间轴工具</h1>
            </div>
            <div class="hidden md:block">
                <span class="text-sm text-gray-500">轻松规划，同步分享</span>
            </div>
        </div>
    </header>

    <!-- 主要内容区 -->
    <main class="flex-grow container mx-auto px-4 py-6 md:py-10">
        <!-- 介绍区域 -->
        <section class="mb-8 text-center max-w-3xl mx-auto">
            <h2 class="text-[clamp(1.3rem,3vw,1.8rem)] font-bold mb-3 text-gray-800">规划您的完美旅程</h2>
            <p class="text-gray-600">创建详细的行程时间轴，添加地点、事项和照片，轻松与同行人同步信息</p>
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 max-w-6xl mx-auto">
            <!-- 行程输入表单 -->
            <section class="bg-white rounded-xl p-5 card-shadow lg:col-span-1">
                <h3 class="text-lg font-semibold mb-4 text-gray-800 flex items-center">
                    <i class="fa fa-plus-circle text-primary mr-2"></i>添加行程
                </h3>
                
                <form id="itinerary-form" class="space-y-4">
                    <div>
                        <label for="trip-name" class="block text-sm font-medium text-gray-700 mb-1">旅行名称</label>
                        <input 
                            type="text" 
                            id="trip-name" 
                            placeholder="例如：巴厘岛之旅" 
                            class="w-full p-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-custom"
                            required
                        >
                    </div>
                    
                    <div>
                        <label for="itinerary-date" class="block text-sm font-medium text-gray-700 mb-1">日期</label>
                        <input 
                            type="date" 
                            id="itinerary-date" 
                            class="w-full p-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-custom"
                            required
                        >
                    </div>
                    
                    <div>
                        <label for="itinerary-time" class="block text-sm font-medium text-gray-700 mb-1">时间</label>
                        <input 
                            type="time" 
                            id="itinerary-time" 
                            class="w-full p-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-custom"
                            required
                        >
                    </div>
                    
                    <div>
                        <label for="itinerary-location" class="block text-sm font-medium text-gray-700 mb-1">地点</label>
                        <input 
                            type="text" 
                            id="itinerary-location" 
                            placeholder="例如：乌布皇宫" 
                            class="w-full p-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-custom"
                            required
                        >
                    </div>
                    
                    <div>
                        <label for="itinerary-activity" class="block text-sm font-medium text-gray-700 mb-1">活动事项</label>
                        <textarea 
                            id="itinerary-activity" 
                            rows="3" 
                            placeholder="描述要进行的活动..." 
                            class="w-full p-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-custom"
                            required
                        ></textarea>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            <i class="fa fa-camera text-primary mr-1"></i>添加照片
                        </label>
                        <div class="flex items-center justify-center w-full">
                            <label class="flex flex-col w-full h-32 border-2 border-dashed border-gray-300 rounded-lg hover:bg-gray-50 cursor-pointer transition-custom">
                                <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                    <i class="fa fa-cloud-upload text-gray-400 mb-2"></i>
                                    <p class="text-sm text-gray-500"><span class="font-semibold">点击上传</span> 或拖放文件</p>
                                    <p class="text-xs text-gray-400 mt-1">支持 PNG, JPG 格式</p>
                                </div>
                                <input id="itinerary-image" type="file" accept="image/*" class="opacity-0" />
                            </label>
                        </div>
                        <div id="image-preview-container" class="hidden mt-3">
                            <img id="image-preview" src="" alt="预览图" class="image-preview">
                            <button type="button" id="remove-image" class="text-sm text-red-500 hover:text-red-700 transition-custom">
                                <i class="fa fa-trash mr-1"></i>移除图片
                            </button>
                        </div>
                    </div>
                    
                    <button 
                        type="submit" 
                        class="w-full bg-primary hover:bg-primary/90 text-white font-medium py-3 px-4 rounded-lg transition-custom flex items-center justify-center mt-4"
                    >
                        <i class="fa fa-save mr-2"></i>添加到行程
                    </button>
                    
                    <button 
                        type="button" 
                        id="clear-all"
                        class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2 px-4 rounded-lg transition-custom flex items-center justify-center"
                    >
                        <i class="fa fa-trash mr-2"></i>清空所有行程
                    </button>
                </form>
            </section>

            <!-- 行程时间轴展示 -->
            <section class="bg-white rounded-xl p-5 card-shadow lg:col-span-2">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-semibold text-gray-800 flex items-center">
                        <i class="fa fa-calendar text-primary mr-2"></i>行程时间轴
                    </h3>
                    <button 
                        id="share-itinerary"
                        class="bg-accent hover:bg-accent/90 text-white font-medium py-2 px-4 rounded-lg transition-custom flex items-center text-sm"
                        disabled
                    >
                        <i class="fa fa-share-alt mr-2"></i>分享行程
                    </button>
                </div>
                
                <div id="empty-itinerary" class="w-full py-16 text-center">
                    <i class="fa fa-map text-gray-300 text-5xl mb-4"></i>
                    <p class="text-gray-400">添加行程来创建您的旅行时间轴</p>
                </div>
                
                <div id="itinerary-timeline" class="hidden">
                    <!-- 行程标题 -->
                    <div class="text-center mb-8">
                        <h2 id="timeline-title" class="text-2xl font-bold text-gray-800 mb-2">巴厘岛之旅</h2>
                        <p id="timeline-date-range" class="text-gray-600">2023年10月1日 - 2023年10月7日</p>
                    </div>
                    
                    <!-- 时间轴内容 -->
                    <div id="timeline-content" class="space-y-8">
                        <!-- 时间轴内容将通过JS动态生成 -->
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- 分享模态框 -->
    <div id="share-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-xl p-6 max-w-md w-full mx-4">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold text-gray-800">分享您的行程</h3>
                <button id="close-share-modal" class="text-gray-500 hover:text-gray-700">
                    <i class="fa fa-times text-xl"></i>
                </button>
            </div>
            
            <div class="mb-4">
                <p class="text-gray-600 mb-3">复制下面的链接分享给您的同行人：</p>
                <div class="flex">
                    <input 
                        type="text" 
                        id="share-link" 
                        value="" 
                        readonly 
                        class="flex-1 p-3 border border-gray-200 rounded-l-lg focus:outline-none bg-gray-50"
                    >
                    <button 
                        id="copy-link"
                        class="bg-primary hover:bg-primary/90 text-white font-medium py-3 px-4 rounded-r-lg transition-custom"
                    >
                        复制
                    </button>
                </div>
            </div>
            
            <div class="mb-4">
                <p class="text-gray-600 mb-3">或通过以下方式分享：</p>
                <div class="flex space-x-4">
                    <button class="w-10 h-10 rounded-full bg-green-500 flex items-center justify-center text-white hover:bg-green-600 transition-custom">
                        <i class="fa fa-weixin"></i>
                    </button>
                    <button class="w-10 h-10 rounded-full bg-red-500 flex items-center justify-center text-white hover:bg-red-600 transition-custom">
                        <i class="fa fa-weibo"></i>
                    </button>
                    <button class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center text-white hover:bg-blue-600 transition-custom">
                        <i class="fa fa-qq"></i>
                    </button>
                    <button class="w-10 h-10 rounded-full bg-gray-700 flex items-center justify-center text-white hover:bg-gray-800 transition-custom">
                        <i class="fa fa-envelope"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="bg-white border-t border-gray-200 py-4 mt-12">
        <div class="container mx-auto px-4 text-center text-sm text-gray-600">
            <p>邓文涛(AI版) | <a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="6e595e595b5a595a5a5f2e1f1f400d0103">[email&#160;protected]</a> | VX：707547441 | 更多点击➡️<a href="https://dkfile.com/Dx25214" target="_blank" rel="noopener" class="text-primary hover:underline">🌌</a></p>
        </div>
    </footer>

    <!-- 提示信息 -->
    <div id="toast" class="fixed bottom-6 right-6 bg-gray-800 text-white px-4 py-2 rounded-lg shadow-lg opacity-0 transition-custom pointer-events-none flex items-center">
        <i class="fa fa-check mr-2"></i> 操作成功！
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // DOM元素
        const itineraryForm = document.getElementById('itinerary-form');
        const tripNameInput = document.getElementById('trip-name');
        const itineraryDateInput = document.getElementById('itinerary-date');
        const itineraryTimeInput = document.getElementById('itinerary-time');
        const itineraryLocationInput = document.getElementById('itinerary-location');
        const itineraryActivityInput = document.getElementById('itinerary-activity');
        const itineraryImageInput = document.getElementById('itinerary-image');
        const imagePreviewContainer = document.getElementById('image-preview-container');
        const imagePreview = document.getElementById('image-preview');
        const removeImageBtn = document.getElementById('remove-image');
        const clearAllBtn = document.getElementById('clear-all');
        const shareItineraryBtn = document.getElementById('share-itinerary');
        const emptyItinerary = document.getElementById('empty-itinerary');
        const itineraryTimeline = document.getElementById('itinerary-timeline');
        const timelineTitle = document.getElementById('timeline-title');
        const timelineDateRange = document.getElementById('timeline-date-range');
        const timelineContent = document.getElementById('timeline-content');
        const shareModal = document.getElementById('share-modal');
        const closeShareModalBtn = document.getElementById('close-share-modal');
        const shareLinkInput = document.getElementById('share-link');
        const copyLinkBtn = document.getElementById('copy-link');
        const toast = document.getElementById('toast');

        // 初始化行程数据
        let itineraryData = {
            tripName: '',
            items: []
        };

        // 设置默认日期为今天
        function setDefaultDate() {
            const today = new Date();
            const year = today.getFullYear();
            let month = today.getMonth() + 1;
            let day = today.getDate();
            
            // 补零
            month = month < 10 ? `0${month}` : month;
            day = day < 10 ? `0${day}` : day;
            
            itineraryDateInput.value = `${year}-${month}-${day}`;
            
            // 设置默认时间为上午9点
            itineraryTimeInput.value = '09:00';
        }

        // 图片预览功能
        itineraryImageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    imagePreview.src = event.target.result;
                    imagePreviewContainer.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        // 移除图片
        removeImageBtn.addEventListener('click', function() {
            imagePreview.src = '';
            imagePreviewContainer.classList.add('hidden');
            itineraryImageInput.value = '';
        });

        // 表单提交处理
        itineraryForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // 获取表单数据
            const tripName = tripNameInput.value.trim();
            const date = itineraryDateInput.value;
            const time = itineraryTimeInput.value;
            const location = itineraryLocationInput.value.trim();
            const activity = itineraryActivityInput.value.trim();
            let image = null;
            
            // 检查是否有图片
            if (imagePreview.src) {
                image = imagePreview.src;
            }
            
            // 验证数据
            if (!tripName || !date || !time || !location || !activity) {
                showToast('请填写所有必填字段', 'warning');
                return;
            }
            
            // 创建行程项
            const itineraryItem = {
                id: Date.now().toString(),
                tripName,
                date,
                time,
                location,
                activity,
                image
            };
            
            // 添加到行程数据
            itineraryData.tripName = tripName;
            itineraryData.items.push(itineraryItem);
            
            // 保存到本地存储
            saveItineraryData();
            
            // 刷新时间轴
            renderTimeline();
            
            // 重置表单
            resetForm();
            
            showToast('行程已添加');
        });

        // 重置表单
        function resetForm() {
            itineraryLocationInput.value = '';
            itineraryActivityInput.value = '';
            itineraryImageInput.value = '';
            imagePreview.src = '';
            imagePreviewContainer.classList.add('hidden');
            itineraryLocationInput.focus();
        }

        // 清空所有行程
        clearAllBtn.addEventListener('click', function() {
            if (itineraryData.items.length === 0) {
                showToast('没有行程可清空', 'warning');
                return;
            }
            
            if (confirm('确定要清空所有行程吗？此操作不可撤销。')) {
                // 重置行程数据
                itineraryData = {
                    tripName: '',
                    items: []
                };
                
                // 清除本地存储
                localStorage.removeItem('itineraryData');
                
                // 刷新时间轴
                renderTimeline();
                
                // 重置表单
                tripNameInput.value = '';
                resetForm();
                
                showToast('所有行程已清空');
            }
        });

        // 渲染时间轴
        function renderTimeline() {
            if (itineraryData.items.length === 0) {
                // 没有行程数据
                emptyItinerary.classList.remove('hidden');
                itineraryTimeline.classList.add('hidden');
                shareItineraryBtn.disabled = true;
                shareItineraryBtn.classList.add('opacity-50', 'cursor-not-allowed');
                return;
            }
            
            // 有行程数据，显示时间轴
            emptyItinerary.classList.add('hidden');
            itineraryTimeline.classList.remove('hidden');
            shareItineraryBtn.disabled = false;
            shareItineraryBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            
            // 设置标题
            timelineTitle.textContent = itineraryData.tripName || '我的旅行';
            
            // 排序行程项（按日期和时间）
            const sortedItems = [...itineraryData.items].sort((a, b) => {
                if (a.date !== b.date) {
                    return a.date.localeCompare(b.date);
                }
                return a.time.localeCompare(b.time);
            });
            
            // 按日期分组
            const groupedByDate = {};
            sortedItems.forEach(item => {
                if (!groupedByDate[item.date]) {
                    groupedByDate[item.date] = [];
                }
                groupedByDate[item.date].push(item);
            });
            
            // 更新日期范围
            const dates = Object.keys(groupedByDate).sort();
            if (dates.length > 0) {
                const startDate = formatDate(dates[0]);
                const endDate = formatDate(dates[dates.length - 1]);
                timelineDateRange.textContent = `${startDate} - ${endDate}`;
            }
            
            // 清空时间轴内容
            timelineContent.innerHTML = '';
            
            // 添加分组内容
            Object.keys(groupedByDate).forEach(date => {
                const dateGroup = document.createElement('div');
                dateGroup.className = 'timeline-date-group relative pl-4';
                
                // 日期标题
                const dateHeader = document.createElement('h4');
                dateHeader.className = 'text-lg font-semibold text-gray-800 mb-4 pl-4';
                dateHeader.textContent = formatDate(date);
                dateGroup.appendChild(dateHeader);
                
                // 添加该日期的所有行程项
                groupedByDate[date].forEach(item => {
                    const timelineItem = document.createElement('div');
                    timelineItem.className = 'timeline-item';
                    timelineItem.innerHTML = `
                        <div class="bg-gray-50 p-4 rounded-lg hover:shadow-md transition-custom">
                            <div class="flex justify-between items-start mb-2">
                                <span class="text-sm font-medium text-primary">${item.time}</span>
                                <button class="delete-item text-gray-400 hover:text-red-500 transition-custom" data-id="${item.id}">
                                    <i class="fa fa-trash"></i>
                                </button>
                            </div>
                            <h5 class="font-semibold text-gray-800 mb-1">${item.location}</h5>
                            <p class="text-gray-600 text-sm mb-3">${item.activity}</p>
                            ${item.image ? `<img src="${item.image}" alt="${item.location}" class="w-full h-48 object-cover rounded-lg mb-2">` : ''}
                        </div>
                    `;
                    dateGroup.appendChild(timelineItem);
                });
                
                timelineContent.appendChild(dateGroup);
            });
            
            // 添加删除行程项事件监听
            document.querySelectorAll('.delete-item').forEach(button => {
                button.addEventListener('click', function() {
                    const itemId = this.getAttribute('data-id');
                    deleteItineraryItem(itemId);
                });
            });
        }

        // 删除行程项
        function deleteItineraryItem(itemId) {
            // 过滤掉要删除的项
            itineraryData.items = itineraryData.items.filter(item => item.id !== itemId);
            
            // 保存到本地存储
            saveItineraryData();
            
            // 刷新时间轴
            renderTimeline();
            
            showToast('行程已删除');
        }

        // 分享功能
        shareItineraryBtn.addEventListener('click', function() {
            // 生成分享链接（实际项目中应该是后端生成的唯一链接）
            // 这里使用当前URL加上行程ID作为示例
            const shareLink = `${window.location.href}?trip=${btoa(itineraryData.tripName || 'my-trip')}`;
            shareLinkInput.value = shareLink;
            
            // 显示分享模态框
            shareModal.classList.remove('hidden');
        });

        // 关闭分享模态框
        closeShareModalBtn.addEventListener('click', function() {
            shareModal.classList.add('hidden');
        });

        // 点击模态框外部关闭
        shareModal.addEventListener('click', function(e) {
            if (e.target === shareModal) {
                shareModal.classList.add('hidden');
            }
        });

        // 复制链接
        copyLinkBtn.addEventListener('click', function() {
            shareLinkInput.select();
            document.execCommand('copy');
            showToast('链接已复制到剪贴板');
        });

        // 保存行程数据到本地存储
        function saveItineraryData() {
            localStorage.setItem('itineraryData', JSON.stringify(itineraryData));
        }

        // 从本地存储加载行程数据
        function loadItineraryData() {
            const savedData = localStorage.getItem('itineraryData');
            if (savedData) {
                itineraryData = JSON.parse(savedData);
                
                // 更新表单
                if (itineraryData.tripName) {
                    tripNameInput.value = itineraryData.tripName;
                }
            }
        }

        // 格式化日期显示
        function formatDate(dateString) {
            const date = new Date(dateString);
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const weekday = weekdays[date.getDay()];
            
            return `${year}年${month}月${day}日 ${weekday}`;
        }

        // 显示提示信息
        function showToast(message, type = 'success') {
            toast.innerHTML = message;
            
            // 根据类型设置不同图标和样式
            if (type === 'success') {
                toast.innerHTML = `<i class="fa fa-check mr-2"></i> ${message}`;
                toast.className = 'fixed bottom-6 right-6 bg-gray-800 text-white px-4 py-2 rounded-lg shadow-lg opacity-0 transition-custom pointer-events-none flex items-center';
            } else if (type === 'warning') {
                toast.innerHTML = `<i class="fa fa-exclamation mr-2"></i> ${message}`;
                toast.className = 'fixed bottom-6 right-6 bg-yellow-600 text-white px-4 py-2 rounded-lg shadow-lg opacity-0 transition-custom pointer-events-none flex items-center';
            } else if (type === 'error') {
                toast.innerHTML = `<i class="fa fa-times mr-2"></i> ${message}`;
                toast.className = 'fixed bottom-6 right-6 bg-red-600 text-white px-4 py-2 rounded-lg shadow-lg opacity-0 transition-custom pointer-events-none flex items-center';
            }
            
            // 显示提示
            setTimeout(() => {
                toast.classList.remove('opacity-0');
                toast.classList.add('opacity-100');
            }, 100);
            
            // 3秒后隐藏提示
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 3000);
        }

        // 页面加载完成后初始化
        window.addEventListener('load', () => {
            setDefaultDate();
            loadItineraryData();
            renderTimeline();
            tripNameInput.focus();
        });
    </script>
</body>
</html>
