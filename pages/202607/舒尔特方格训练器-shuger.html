<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>舒尔特方格训练器</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8f9fa;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: white;
            padding: 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin: 0 auto;
            max-width: 100%;
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.4rem;
            margin: 1rem 0;
        }

        .cell {
            width: 4rem;
            height: 4rem;
            background: #f1f3f5;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.3rem;
            font-weight: 600;
            color: #495057;
            border-radius: 0.4rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .cell.clicked {
            background: #40c057 !important;
            color: white;
            transform: scale(0.95);
        }

        button {
            padding: 0.6rem 1.5rem;
            font-size: 0.95rem;
            background: #2b8a3e;
            color: white;
            border: none;
            border-radius: 0.4rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }

        button:hover {
            background: #2f9e44;
        }

        #timer {
            font-size: 1.1rem;
            color: #868e96;
            margin: 0.5rem 0;
            font-variant-numeric: tabular-nums;
        }

        #instructions {
            text-align: center;
            color: #666;
            line-height: 1.5;
            max-width: 400px;
            margin: 1rem 0 0;
            padding: 0 1rem;
            font-size: 0.9rem;
        }

        h1 {
            color: #2b8a3e;
            margin: 0 0 0.6rem;
            font-size: 1.6rem;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>舒尔特方格</h1>
        <div id="timer">0.00 秒</div>
        <div id="grid"></div>
        <button onclick="startGame()">开始游戏</button>
    </div>
    
    <div id="instructions">
        <p>玩法说明：</p>
        <p>1. 点击按钮重置并开始计时</p>
        <p>2. 按数字顺序 1 → 2 → 3 → ... → 16 依次点击</p>
    </div>

    <script>
        let currentNumber = 1;
        let timerInterval;
        let startTime;
        const audio = new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU');

        // 初始化展示用网格（无点击功能）
        function initGrid() {
            const grid = document.getElementById('grid');
            const numbers = Array.from({length: 16}, (_, i) => i + 1);
            
            numbers.sort(() => Math.random() - 0.5).forEach(num => {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.textContent = num;
                grid.appendChild(cell);
            });
        }

        // 创建可操作网格
        function createGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            const numbers = Array.from({length: 16}, (_, i) => i + 1);
            numbers.sort(() => Math.random() - 0.5).forEach(num => {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.textContent = num;
                cell.onclick = handleClick;
                grid.appendChild(cell);
            });
        }

        function handleClick(e) {
            if (!startTime) return;
            
            const clickedNumber = parseInt(e.target.textContent);
            
            if (clickedNumber === currentNumber) {
                e.target.classList.add('clicked');
                currentNumber++;
                
                if (currentNumber > 16) {
                    clearInterval(timerInterval);
                    startTime = null;
                }
            } else {
                audio.play().catch(() => {});
                e.target.style.transform = 'scale(0.9)';
                setTimeout(() => e.target.style.transform = '', 200);
            }
        }

        function startGame() {
            clearInterval(timerInterval);
            currentNumber = 1;
            startTime = null;
            document.getElementById('timer').textContent = '0.00 秒';
            
            createGrid();
            
            setTimeout(() => {
                startTime = Date.now();
                timerInterval = setInterval(() => {
                    if (startTime) {
                        const elapsed = (Date.now() - startTime)/1000;
                        document.getElementById('timer').textContent = `${elapsed.toFixed(2)} 秒`;
                    }
                }, 50);
            }, 100);
        }

        // 页面加载初始化
        initGrid();
    </script>
</body>
</html>
