    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 全局变量
        let selectedFiles = [];
        let convertedFiles = [];
        let conversionStats = {
            totalFiles: 0,
            convertedFiles: 0,
            sizeSaved: 0,
            startTime: 0
        };

        // DOM 元素
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const fileListSection = document.getElementById('fileListSection');
        const fileList = document.getElementById('fileList');
        const fileCount = document.getElementById('fileCount');
        const settingsSection = document.getElementById('settingsSection');
        const actionButtons = document.getElementById('actionButtons');
        const progressSection = document.getElementById('progressSection');
        const progressFill = document.getElementById('progressFill');
        const progressPercentage = document.getElementById('progressPercentage');
        const progressText = document.getElementById('progressText');
        const downloadSection = document.getElementById('downloadSection');
        const convertBtn = document.getElementById('convertBtn');
        const statusMessage = document.getElementById('statusMessage');
        const qualitySlider = document.getElementById('qualitySlider');
        const qualityDisplay = document.getElementById('qualityDisplay');
        const namingOption = document.getElementById('namingOption');
        const customPrefix = document.getElementById('customPrefix');

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initializeEventListeners();
            updateQualityDisplay();
        });

        // 初始化事件监听器
        function initializeEventListeners() {
            // 文件选择
            fileInput.addEventListener('change', handleFileSelect);
            
            // 拖拽上传
            uploadArea.addEventListener('dragover', handleDragOver);
            uploadArea.addEventListener('dragleave', handleDragLeave);
            uploadArea.addEventListener('drop', handleDrop);
            
            // 质量滑块
            qualitySlider.addEventListener('input', updateQualityDisplay);
            
            // 命名选项变化
            namingOption.addEventListener('change', toggleCustomPrefix);
        }

        // 更新质量显示
        function updateQualityDisplay() {
            qualityDisplay.textContent = qualitySlider.value + '%';
        }

        // 切换自定义前缀输入框
        function toggleCustomPrefix() {
            customPrefix.style.display = namingOption.value === 'custom' ? 'block' : 'none';
        }

        // 处理拖拽悬停
        function handleDragOver(e) {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        }

        // 处理拖拽离开
        function handleDragLeave(e) {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
        }

        // 处理拖拽放置
        function handleDrop(e) {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                processFiles(files);
            }
        }

        // 处理文件选择
        function handleFileSelect(e) {
            const files = e.target.files;
            if (files.length > 0) {
                processFiles(files);
            }
        }

        // 处理文件
        function processFiles(files) {
            const validFiles = [];
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                
                // 检查文件类型
                if (!file.type.startsWith('image/')) {
                    showMessage('请选择图片文件（JPG, PNG, GIF, BMP, WebP）', 'error');
                    continue;
                }
                
                // 检查文件大小（限制为10MB）
                if (file.size > 10 * 1024 * 1024) {
                    showMessage('文件大小不能超过10MB', 'error');
                    continue;
                }
                
                validFiles.push(file);
            }
            
            if (validFiles.length > 0) {
                selectedFiles = [...selectedFiles, ...validFiles];
                updateFileList();
                showSections();
                showMessage(`成功添加 ${validFiles.length} 个文件`, 'success');
            }
        }

        // 更新文件列表
        function updateFileList() {
            fileList.innerHTML = '';
            fileCount.textContent = selectedFiles.length + ' 个文件';
            
            selectedFiles.forEach((file, index) => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                
                const fileType = file.name.split('.').pop().toUpperCase();
                const fileSize = formatFileSize(file.size);
                
                fileItem.innerHTML = `
                    <div class="file-icon">🖼️</div>
                    <div class="file-info">
                        <div class="file-name">${file.name}</div>
                        <div class="file-details">
                            <span class="file-size">${fileSize}</span>
                            <span class="file-type">${fileType}</span>
                        </div>
                    </div>
                    <div class="file-actions">
                        <button class="file-action-btn" onclick="removeFile(${index})" title="删除文件">🗑️</button>
                    </div>
                `;
                
                fileList.appendChild(fileItem);
            });
        }

        // 删除文件
        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
            
            if (selectedFiles.length === 0) {
                hideSections();
            }
        }

        // 清空文件列表
        function clearFiles() {
            selectedFiles = [];
            fileInput.value = '';
            updateFileList();
            hideSections();
            showMessage('已清空文件列表', 'info');
        }

        // 显示相关区域
        function showSections() {
            fileListSection.classList.remove('hidden');
            settingsSection.classList.remove('hidden');
            actionButtons.classList.remove('hidden');
        }

        // 隐藏相关区域
        function hideSections() {
            fileListSection.classList.add('hidden');
            settingsSection.classList.add('hidden');
            actionButtons.classList.add('hidden');
            progressSection.classList.add('hidden');
            downloadSection.classList.add('hidden');
        }

        // 显示消息
        function showMessage(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = `status-message status-${type}`;
            statusMessage.classList.remove('hidden');
            
            // 3秒后自动隐藏
            setTimeout(() => {
                statusMessage.classList.add('hidden');
            }, 3000);
        }

        // 开始转换
        function startConversion() {
            if (selectedFiles.length === 0) {
                showMessage('请先选择要转换的图片文件', 'error');
                return;
            }
            
            // 初始化转换统计
            conversionStats = {
                totalFiles: selectedFiles.length,
                convertedFiles: 0,
                sizeSaved: 0,
                startTime: Date.now()
            };
            
            // 显示进度区域
            progressSection.classList.remove('hidden');
            actionButtons.classList.add('hidden');
            convertBtn.disabled = true;
            
            // 开始转换
            convertFiles();
        }

        // 转换文件
        async function convertFiles() {
            convertedFiles = [];
            const outputFormat = document.getElementById('outputFormat').value;
            const quality = parseInt(qualitySlider.value) / 100;
            
            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];
                
                try {
                    // 更新进度
                    updateProgress(i, selectedFiles.length, `正在转换 ${file.name}...`);
                    
                    // 转换文件（这里使用模拟转换）
                    const convertedFile = await simulateFileConversion(file, outputFormat, quality);
                    convertedFiles.push(convertedFile);
                    
                    conversionStats.convertedFiles++;
                    
                } catch (error) {
                    console.error('转换失败:', error);
                    showMessage(`文件 ${file.name} 转换失败`, 'error');
                }
            }
            
            // 完成转换
            completeConversion();
        }

        // 模拟文件转换（实际项目中需要实现真实的转换逻辑）
        async function simulateFileConversion(file, format, quality) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    // 模拟转换后的文件
                    const fileName = generateFileName(file.name, format);
                    const fileSize = Math.round(file.size * (0.7 + Math.random() * 0.2)); // 模拟大小变化
                    
                    resolve({
                        name: fileName,
                        size: fileSize,
                        type: `image/${format}`,
                        originalSize: file.size,
                        blob: new Blob([], { type: `image/${format}` })
                    });
                }, 1000 + Math.random() * 2000); // 模拟处理时间
            });
        }

        // 生成文件名
        function generateFileName(originalName, format) {
            const naming = namingOption.value;
            
                    let baseName = originalName.replace(/\.[^\.]+$/, '');
                    
                    switch (naming) {
                        case 'timestamp':
                            baseName = new Date().getTime();
                            break;
                        case 'custom':
                            baseName = customPrefix.value.trim() || baseName;
                            break;
                    }
                    
                    return `${baseName}.${format}`;
                }

                // 更新进度
                function updateProgress(current, total, message) {
                    const percentage = Math.round((current / total) * 100);
                    progressFill.style.width = percentage + '%';
                    progressPercentage.textContent = percentage + '%';
                    progressText.textContent = message;
                }

                // 完成转换
                function completeConversion() {
                    const endTime = Date.now();
                    const processTime = Math.round((endTime - conversionStats.startTime) / 1000);
                    
                    // 计算大小节省
                    const totalOriginalSize = selectedFiles.reduce((sum, file) => sum + file.size, 0);
                    const totalConvertedSize = convertedFiles.reduce((sum, file) => sum + file.size, 0);
                    const sizeSaved = totalOriginalSize - totalConvertedSize;
                    
                    // 更新统计信息
                    document.getElementById('convertedCount').textContent = conversionStats.convertedFiles;
                    document.getElementById('sizeSaved').textContent = formatFileSize(sizeSaved);
                    document.getElementById('processTime').textContent = processTime + 's';
                    
                    // 显示下载区域
                    progressSection.classList.add('hidden');
                    downloadSection.classList.remove('hidden');
                    convertBtn.disabled = false;
                    
                    showMessage('所有文件转换完成！', 'success');
                }

                // 下载全部文件
                function downloadAll() {
                    if (convertedFiles.length === 0) {
                        showMessage('没有可下载的文件', 'error');
                        return;
                    }
                    
                    // 模拟下载（实际项目中需要实现真实的下载逻辑）
                    convertedFiles.forEach((file, index) => {
                        setTimeout(() => {
                            simulateDownload(file);
                        }, index * 300);
                    });
                    
                    showMessage('开始下载文件...', 'info');
                }

                // 显示单独下载文件
                function showIndividualFiles() {
                    const container = document.getElementById('individualFiles');
                    container.innerHTML = '';
                    container.style.display = 'block';
                    
                    convertedFiles.forEach((file, index) => {
                        const fileItem = document.createElement('div');
                        fileItem.className = 'file-item';
                        fileItem.style.marginBottom = '10px';
                        
                        fileItem.innerHTML = `
                            <div class="file-info">
                                <div class="file-name">${file.name}</div>
                                <div class="file-details">
                                    <span class="file-size">${formatFileSize(file.size)}</span>
                                </div>
                            </div>
                            <button class="btn btn-outline" onclick="simulateDownload(convertedFiles[${index}])" 
                                    style="padding: 8px 16px; font-size: 0.9em;">
                                下载
                            </button>
                        `;
                        
                        container.appendChild(fileItem);
                    });
                }

                // 模拟下载
                function simulateDownload(file) {
                    // 实际项目中需要创建真实的下载链接
                    console.log('下载文件:', file.name);
                    showMessage(`已下载: ${file.name}`, 'success');
                }

                // 格式化文件大小
                function formatFileSize(bytes) {
                    if (bytes === 0) return '0 B';
                    
                    const k = 1024;
                    const sizes = ['B', 'KB', 'MB', 'GB'];
                    const i = Math.floor(Math.log(bytes) / Math.log(k));
                    
                    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
                }

                // 工具函数：生成随机ID
                function generateId() {
                    return Math.random().toString(36).substr(2, 9);
                }

                // 工具函数：防抖
                function debounce(func, wait) {
                    let timeout;
                    return function executedFunction(...args) {
                        const later = () => {
                            clearTimeout(timeout);
                            func(...args);
                        };
                        clearTimeout(timeout);
                        timeout = setTimeout(later, wait);
                    };
                }

                // 工具函数：节流
                function throttle(func, limit) {
                    let inThrottle;
                    return function() {
                        const args = arguments;
                        const context = this;
                        if (!inThrottle) {
                            func.apply(context, args);
                            inThrottle = true;
                            setTimeout(() => inThrottle = false, limit);
                        }
                    };
                }

                // 错误处理
                function handleError(error, context) {
                    console.error(`Error in ${context}:`, error);
                    showMessage(`操作失败: ${error.message || '未知错误'}`, 'error');
                }

                // 性能监控
                function trackPerformance(metricName, value) {
                    console.log(`[Performance] ${metricName}: ${value}ms`);
                }

                // 初始化完成
                console.log('图片格式转换工具初始化完成');
                
                // 添加键盘快捷键
                document.addEventListener('keydown', function(e) {
                    // Ctrl/Cmd + O 打开文件选择
                    if ((e.ctrlKey || e.metaKey) && e.key === 'o') {
                        e.preventDefault();
                        fileInput.click();
                    }
                    
                    // Ctrl/Cmd + D 清空文件
                    if ((e.ctrlKey || e.metaKey) && e.key === 'd') {
                        e.preventDefault();
                        clearFiles();
                    }
                    
                    // Enter 开始转换
                    if (e.key === 'Enter' && !convertBtn.disabled) {
                        e.preventDefault();
                        startConversion();
                    }
                });

                // 添加服务工作者注册（PWA支持）
                if ('serviceWorker' in navigator) {
                    window.addEventListener('load', function() {
                        navigator.serviceWorker.register('/sw.js')
                            .then(function(registration) {
                                console.log('ServiceWorker 注册成功:', registration.scope);
                            })
                            .catch(function(error) {
                                console.log('ServiceWorker 注册失败:', error);
                            });
                    });
                }

                // 添加离线检测
                window.addEventListener('online', function() {
                    showMessage('网络连接已恢复', 'success');
                });

                window.addEventListener('offline', function() {
                    showMessage('网络连接已断开', 'error');
                });

                // 添加页面可见性检测
                document.addEventListener('visibilitychange', function() {
                    if (document.hidden) {
                        console.log('页面被隐藏');
                    } else {
                        console.log('页面可见');
                    }
                });

                // 添加性能监控
                window.addEventListener('load', function() {
                    const loadTime = performance.now();
                    trackPerformance('页面加载时间', loadTime);
                });

            </script>
        </body>
        </html>
