<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时汇率转换器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            padding: 30px;
            text-align: center;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .status-bar {
            padding: 15px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .update-time {
            font-size: 0.9rem;
            color: #6c757d;
        }

        .refresh-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            background: #218838;
            transform: translateY(-1px);
        }

        .refresh-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4facfe;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .main-content {
            padding: 30px;
        }

        .converter-section {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 20px;
            margin-bottom: 30px;
            align-items: center;
        }

        .currency-input {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .currency-input:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
        }

        .currency-input.focused {
            border-color: #4facfe;
            transform: translateY(-2px);
        }

        .currency-select {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .flag {
            width: 30px;
            height: 20px;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            background: #f8f9fa;
        }

        select {
            flex: 1;
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }

        select:focus {
            outline: none;
            border-color: #4facfe;
        }

        .amount-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 1.5rem;
            font-weight: 600;
            text-align: center;
            transition: all 0.3s ease;
        }

        .amount-input:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }

        .swap-btn {
            background: #4facfe;
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .swap-btn:hover {
            background: #369dfc;
            transform: rotate(180deg) scale(1.1);
        }

        .rate-info {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .rate-display {
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .rate-trend {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-size: 0.9rem;
        }

        .trend-up {
            color: #28a745;
        }

        .trend-down {
            color: #dc3545;
        }

        .copy-section {
            text-align: center;
            margin: 20px 0;
        }

        .copy-btn {
            background: #17a2b8;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            background: #138496;
            transform: translateY(-1px);
        }

        .rates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .rate-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .rate-card:hover {
            transform: translateY(-2px);
        }

        .rate-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .currency-name {
            font-weight: 600;
            color: #333;
        }

        .rate-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: #4facfe;
        }

        .formula-section {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .formula-title {
            font-weight: 600;
            margin-bottom: 10px;
            color: #856404;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            display: none;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            display: none;
        }

        .footer-note {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
            font-size: 0.9rem;
            color: #6c757d;
        }

        .footer-note a {
            color: #4facfe;
            text-decoration: none;
            font-weight: 500;
        }

        .footer-note a:hover {
            text-decoration: underline;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pulse {
            animation: pulse 0.5s ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @media (max-width: 768px) {
            .container {
                margin: 0;
                border-radius: 0;
            }

            .header h1 {
                font-size: 2rem;
            }

            .converter-section {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .swap-btn {
                margin: 0 auto;
                transform: rotate(90deg);
            }

            .rates-grid {
                grid-template-columns: 1fr;
            }

            .status-bar {
                flex-direction: column;
                text-align: center;
            }
        }

        .offline-indicator {
            background: #dc3545;
            color: white;
            padding: 10px;
            text-align: center;
            font-size: 0.9rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="offline-indicator" id="offlineIndicator">
            ⚠️ 网络连接中断，正在使用缓存数据
        </div>

        <div class="header">
            <h1>💱 实时汇率转换器</h1>
            <p>精准汇率 · 实时更新 · 全球通用</p>
        </div>

        <div class="status-bar">
            <div class="update-time" id="updateTime">正在获取汇率数据...</div>
            <button class="refresh-btn" id="refreshBtn" onclick="refreshRates()">🔄 刷新汇率</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在获取最新汇率数据...</p>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <div class="main-content">
            <div class="converter-section">
                <div class="currency-input" id="fromCurrency">
                    <div class="currency-select">
                        <div class="flag" id="fromFlag">🇺🇸</div>
                        <select id="fromSelect" onchange="updateFlag('from'); convert()">
                            <option value="USD">美元 (USD)</option>
                            <option value="EUR">欧元 (EUR)</option>
                            <option value="CNY">人民币 (CNY)</option>
                            <option value="JPY">日元 (JPY)</option>
                            <option value="GBP">英镑 (GBP)</option>
                            <option value="HKD">港币 (HKD)</option>
                            <option value="AUD">澳元 (AUD)</option>
                            <option value="CAD">加元 (CAD)</option>
                            <option value="CHF">瑞士法郎 (CHF)</option>
                            <option value="SGD">新加坡元 (SGD)</option>
                            <option value="KRW">韩元 (KRW)</option>
                            <option value="THB">泰铢 (THB)</option>
                        </select>
                    </div>
                    <input type="text" class="amount-input" id="fromAmount" placeholder="输入金额" 
                           oninput="handleInput(this); convert()" onfocus="focusInput('from')" onblur="formatAndBlur(this, 'from')">
                </div>

                <button class="swap-btn" onclick="swapCurrencies()" title="交换货币">⇄</button>

                <div class="currency-input" id="toCurrency">
                    <div class="currency-select">
                        <div class="flag" id="toFlag">🇨🇳</div>
                        <select id="toSelect" onchange="updateFlag('to'); convert()">
                            <option value="USD">美元 (USD)</option>
                            <option value="EUR">欧元 (EUR)</option>
                            <option value="CNY" selected>人民币 (CNY)</option>
                            <option value="JPY">日元 (JPY)</option>
                            <option value="GBP">英镑 (GBP)</option>
                            <option value="HKD">港币 (HKD)</option>
                            <option value="AUD">澳元 (AUD)</option>
                            <option value="CAD">加元 (CAD)</option>
                            <option value="CHF">瑞士法郎 (CHF)</option>
                            <option value="SGD">新加坡元 (SGD)</option>
                            <option value="KRW">韩元 (KRW)</option>
                            <option value="THB">泰铢 (THB)</option>
                        </select>
                    </div>
                    <input type="text" class="amount-input" id="toAmount" placeholder="转换结果" 
                           oninput="handleInput(this); convertReverse()" onfocus="focusInput('to')" onblur="formatAndBlur(this, 'to')">
                </div>
            </div>

            <div class="rate-info" id="rateInfo">
                <div class="rate-display" id="rateDisplay">1 USD = ? CNY</div>
                <div class="rate-trend" id="rateTrend">
                    <span>汇率变化: </span>
                    <span id="trendIcon">📈</span>
                    <span id="trendPercent">+0.00%</span>
                </div>
            </div>

            <div class="copy-section">
                <button class="copy-btn" onclick="copyResult()">📋 复制转换结果</button>
            </div>

            <div class="formula-section">
                <div class="formula-title">💡 汇率计算公式</div>
                <p id="formulaText">转换金额 = 原始金额 × 汇率</p>
                <p style="margin-top: 10px; font-size: 0.9rem; color: #6c757d;">
                    💳 银行手续费参考: 0.3% - 0.8% | 🏪 现钞手续费: 1% - 3%
                </p>
            </div>

            <div class="rates-grid" id="ratesGrid">
                <!-- 汇率卡片将通过JavaScript动态生成 -->
            </div>
        </div>

        <div class="footer-note">
            由 <strong>老陈</strong> 使用 <strong>DeepSeek</strong> 生成，
            <a href="https://pan.quark.cn/s/3943c5b5ab11" target="_blank">提示词、网页源码，点这领取，免费</a>
        </div>
    </div>

    <script>
        // 全局变量
        let currentRates = {};
        let previousRates = {};
        let lastUpdateTime = null;
        let isConverting = false;

        // 货币符号映射
        const currencyFlags = {
            'USD': '🇺🇸', 'EUR': '🇪🇺', 'CNY': '🇨🇳', 'JPY': '🇯🇵',
            'GBP': '🇬🇧', 'HKD': '🇭🇰', 'AUD': '🇦🇺', 'CAD': '🇨🇦',
            'CHF': '🇨🇭', 'SGD': '🇸🇬', 'KRW': '🇰🇷', 'THB': '🇹🇭'
        };

        const currencyNames = {
            'USD': '美元', 'EUR': '欧元', 'CNY': '人民币', 'JPY': '日元',
            'GBP': '英镑', 'HKD': '港币', 'AUD': '澳元', 'CAD': '加元',
            'CHF': '瑞士法郎', 'SGD': '新加坡元', 'KRW': '韩元', 'THB': '泰铢'
        };

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadCachedRates();
            fetchRates();
            updateFlag('from');
            updateFlag('to');
            setupOfflineDetection();
            
            // 设置初始金额
            document.getElementById('fromAmount').value = '100';
            setTimeout(() => convert(), 500);
        });

        // 网络状态检测
        function setupOfflineDetection() {
            window.addEventListener('online', function() {
                document.getElementById('offlineIndicator').style.display = 'none';
                fetchRates();
            });

            window.addEventListener('offline', function() {
                document.getElementById('offlineIndicator').style.display = 'block';
            });
        }

        // 获取汇率数据
        async function fetchRates() {
            try {
                showLoading(true);
                hideMessages();

                // 使用免费的汇率API
                const response = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                
                if (!data.rates) {
                    throw new Error('无效的API响应格式');
                }

                // 保存之前的汇率用于比较
                previousRates = {...currentRates};
                currentRates = data.rates;
                lastUpdateTime = new Date();

                // 缓存数据
                cacheRates();
                
                // 更新UI
                updateUI();
                convert();
                
                showSuccessMessage('汇率数据更新成功！');
                
            } catch (error) {
                console.error('获取汇率失败:', error);
                handleError(error);
            } finally {
                showLoading(false);
                document.getElementById('refreshBtn').disabled = false;
            }
        }

        // 缓存汇率数据
        function cacheRates() {
            try {
                const cacheData = {
                    rates: currentRates,
                    timestamp: lastUpdateTime.getTime(),
                    previousRates: previousRates
                };
                
                // 使用内存缓存而不是localStorage
                window.cachedRatesData = cacheData;
            } catch (error) {
                console.warn('缓存数据失败:', error);
            }
        }

        // 加载缓存的汇率数据
        function loadCachedRates() {
            try {
                const cached = window.cachedRatesData;
                if (cached && cached.rates) {
                    const cacheAge = Date.now() - cached.timestamp;
                    
                    // 缓存有效期30分钟
                    if (cacheAge < 30 * 60 * 1000) {
                        currentRates = cached.rates;
                        previousRates = cached.previousRates || {};
                        lastUpdateTime = new Date(cached.timestamp);
                        updateUI();
                        return true;
                    }
                }
            } catch (error) {
                console.warn('加载缓存失败:', error);
            }
            return false;
        }

        // 错误处理
        function handleError(error) {
            let errorMsg = '获取汇率数据失败';
            
            if (!navigator.onLine) {
                errorMsg = '网络连接中断，正在使用缓存数据';
                document.getElementById('offlineIndicator').style.display = 'block';
            } else if (error.message.includes('HTTP')) {
                errorMsg = `服务器错误: ${error.message}`;
            } else if (error.message.includes('网络')) {
                errorMsg = '网络请求超时，请检查网络连接';
            } else {
                errorMsg = `数据获取失败: ${error.message}`;
            }

            showErrorMessage(errorMsg);

            // 如果有缓存数据，尝试使用
            if (Object.keys(currentRates).length === 0) {
                loadCachedRates();
            }
        }

        // 更新界面
        function updateUI() {
            updateTime();
            updateRatesGrid();
            updateRateInfo();
        }

        // 更新时间显示
        function updateTime() {
            const timeElement = document.getElementById('updateTime');
            if (lastUpdateTime) {
                const timeString = lastUpdateTime.toLocaleString('zh-CN');
                timeElement.textContent = `最后更新: ${timeString}`;
            }
        }

        // 更新汇率网格
        function updateRatesGrid() {
            const grid = document.getElementById('ratesGrid');
            const baseCurrency = document.getElementById('fromSelect').value;
            
            grid.innerHTML = '';
            
            const currencies = ['USD', 'EUR', 'CNY', 'JPY', 'GBP', 'HKD', 'AUD', 'CAD'];
            
            currencies.forEach(currency => {
                if (currency === baseCurrency) return;
                
                const rate = calculateRate(baseCurrency, currency);
                const prevRate = calculatePreviousRate(baseCurrency, currency);
                const change = prevRate ? ((rate - prevRate) / prevRate * 100) : 0;
                
                const card = document.createElement('div');
                card.className = 'rate-card fade-in';
                card.innerHTML = `
                    <div class="rate-card-header">
                        <span class="currency-name">
                            ${currencyFlags[currency]} ${currencyNames[currency]}
                        </span>
                        <span class="rate-value">${formatNumber(rate, 4)}</span>
                    </div>
                    <div class="rate-trend ${change >= 0 ? 'trend-up' : 'trend-down'}">
                        ${change >= 0 ? '↗' : '↘'} ${Math.abs(change).toFixed(2)}%
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }

        // 计算汇率
        function calculateRate(from, to) {
            if (from === to) return 1;
            
            if (from === 'USD') {
                return currentRates[to] || 0;
            } else if (to === 'USD') {
                return 1 / (currentRates[from] || 1);
            } else {
                const fromToUsd = 1 / (currentRates[from] || 1);
                const usdToTo = currentRates[to] || 0;
                return fromToUsd * usdToTo;
            }
        }

        // 计算之前的汇率
        function calculatePreviousRate(from, to) {
            if (!previousRates || Object.keys(previousRates).length === 0) return null;
            
            if (from === to) return 1;
            
            if (from === 'USD') {
                return previousRates[to] || 0;
            } else if (to === 'USD') {
                return 1 / (previousRates[from] || 1);
            } else {
                const fromToUsd = 1 / (previousRates[from] || 1);
                const usdToTo = previousRates[to] || 0;
                return fromToUsd * usdToTo;
            }
        }

        // 格式化数字
        function formatNumber(num, decimals = 2) {
            if (isNaN(num)) return '0.00';
            
            const rounded = parseFloat(num).toFixed(decimals);
            const parts = rounded.split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            return parts.join('.');
        }

        // 解析格式化的数字
        function parseFormattedNumber(str) {
            if (!str) return 0;
            return parseFloat(str.replace(/,/g, '')) || 0;
        }

        // 处理输入（不格式化，只验证）
        function handleInput(input) {
            let value = input.value;
            
            // 只允许数字和一个小数点
            value = value.replace(/[^\d.]/g, '');
            
            // 确保只有一个小数点
            const parts = value.split('.');
            if (parts.length > 2) {
                value = parts[0] + '.' + parts.slice(1).join('');
            }
            
            // 限制小数点后位数
            if (parts.length === 2 && parts[1].length > 6) {
                value = parts[0] + '.' + parts[1].substring(0, 6);
            }
            
            input.value = value;
        }

        // 格式化并失去焦点
        function formatAndBlur(input, type) {
            const value = parseFloat(input.value.replace(/,/g, '')) || 0;
            if (value > 0) {
                input.value = formatNumber(value);
            } else {
                input.value = '';
            }
            blurInput(type);
        }

        // 转换货币
        function convert() {
            if (isConverting) return;
            isConverting = true;

            try {
                const fromCurrency = document.getElementById('fromSelect').value;
                const toCurrency = document.getElementById('toSelect').value;
                const fromAmountStr = document.getElementById('fromAmount').value;
                const fromAmount = parseFloat(fromAmountStr.replace(/,/g, '')) || 0;

                if (fromAmount <= 0 || Object.keys(currentRates).length === 0) {
                    document.getElementById('toAmount').value = '';
                    isConverting = false;
                    return;
                }

                const rate = calculateRate(fromCurrency, toCurrency);
                const result = fromAmount * rate;

                // 显示结果时格式化
                document.getElementById('toAmount').value = formatNumber(result);
                
                // 添加动画效果
                document.getElementById('toCurrency').classList.add('pulse');
                setTimeout(() => {
                    document.getElementById('toCurrency').classList.remove('pulse');
                }, 500);

                updateRateInfo();
                updateFormula(fromAmount, rate, result, fromCurrency, toCurrency);

            } catch (error) {
                console.error('转换错误:', error);
                showErrorMessage('转换计算出错，请检查输入');
            } finally {
                isConverting = false;
            }
        }

        // 反向转换
        function convertReverse() {
            if (isConverting) return;
            isConverting = true;

            try {
                const fromCurrency = document.getElementById('fromSelect').value;
                const toCurrency = document.getElementById('toSelect').value;
                const toAmountStr = document.getElementById('toAmount').value;
                const toAmount = parseFloat(toAmountStr.replace(/,/g, '')) || 0;

                if (toAmount <= 0 || Object.keys(currentRates).length === 0) {
                    document.getElementById('fromAmount').value = '';
                    isConverting = false;
                    return;
                }

                const rate = calculateRate(toCurrency, fromCurrency);
                const result = toAmount * rate;

                // 显示结果时格式化
                document.getElementById('fromAmount').value = formatNumber(result);
                
                // 添加动画效果
                document.getElementById('fromCurrency').classList.add('pulse');
                setTimeout(() => {
                    document.getElementById('fromCurrency').classList.remove('pulse');
                }, 500);

                updateRateInfo();

            } catch (error) {
                console.error('反向转换错误:', error);
                showErrorMessage('转换计算出错，请检查输入');
            } finally {
                isConverting = false;
            }
        }

        // 更新汇率信息
        function updateRateInfo() {
            const fromCurrency = document.getElementById('fromSelect').value;
            const toCurrency = document.getElementById('toSelect').value;
            
            if (Object.keys(currentRates).length === 0) return;

            const rate = calculateRate(fromCurrency, toCurrency);
            const prevRate = calculatePreviousRate(fromCurrency, toCurrency);
            
            document.getElementById('rateDisplay').textContent = 
                `1 ${fromCurrency} = ${formatNumber(rate, 4)} ${toCurrency}`;

            // 更新趋势
            if (prevRate && prevRate !== rate) {
                const change = ((rate - prevRate) / prevRate * 100);
                const isUp = change > 0;
                
                document.getElementById('trendIcon').textContent = isUp ? '📈' : '📉';
                document.getElementById('trendPercent').textContent = 
                    `${isUp ? '+' : ''}${change.toFixed(2)}%`;
                document.getElementById('trendPercent').className = isUp ? 'trend-up' : 'trend-down';
            } else {
                document.getElementById('trendIcon').textContent = '📊';
                document.getElementById('trendPercent').textContent = '暂无变化';
                document.getElementById('trendPercent').className = '';
            }
        }

        // 更新公式显示
        function updateFormula(amount, rate, result, fromCurrency, toCurrency) {
            const formulaText = `${formatNumber(amount)} ${fromCurrency} × ${formatNumber(rate, 4)} = ${formatNumber(result)} ${toCurrency}`;
            document.getElementById('formulaText').textContent = formulaText;
        }

        // 交换货币
        function swapCurrencies() {
            const fromSelect = document.getElementById('fromSelect');
            const toSelect = document.getElementById('toSelect');
            const fromAmount = document.getElementById('fromAmount');
            const toAmount = document.getElementById('toAmount');

            // 交换选择的货币
            const tempCurrency = fromSelect.value;
            fromSelect.value = toSelect.value;
            toSelect.value = tempCurrency;

            // 交换金额
            const tempAmount = fromAmount.value;
            fromAmount.value = toAmount.value;
            toAmount.value = tempAmount;

            // 更新标志和转换
            updateFlag('from');
            updateFlag('to');
            convert();
            
            // 添加动画效果
            document.querySelector('.swap-btn').style.transform = 'rotate(180deg) scale(1.1)';
            setTimeout(() => {
                document.querySelector('.swap-btn').style.transform = '';
            }, 300);
        }

        // 更新国旗
        function updateFlag(type) {
            const select = document.getElementById(type + 'Select');
            const flag = document.getElementById(type + 'Flag');
            flag.textContent = currencyFlags[select.value] || '🌍';
        }

        // 复制结果
        async function copyResult() {
            try {
                const fromCurrency = document.getElementById('fromSelect').value;
                const toCurrency = document.getElementById('toSelect').value;
                const fromAmount = document.getElementById('fromAmount').value;
                const toAmount = document.getElementById('toAmount').value;
                
                if (!fromAmount || !toAmount) {
                    showErrorMessage('请先进行货币转换');
                    return;
                }

                const result = `${fromAmount} ${fromCurrency} = ${toAmount} ${toCurrency}`;
                
                await navigator.clipboard.writeText(result);
                showSuccessMessage('转换结果已复制到剪贴板！');
                
                // 按钮动画
                const btn = document.querySelector('.copy-btn');
                btn.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    btn.style.transform = '';
                }, 150);
                
            } catch (error) {
                console.error('复制失败:', error);
                
                // 降级方案：创建临时文本区域
                try {
                    const fromCurrency = document.getElementById('fromSelect').value;
                    const toCurrency = document.getElementById('toSelect').value;
                    const fromAmount = document.getElementById('fromAmount').value;
                    const toAmount = document.getElementById('toAmount').value;
                    const result = `${fromAmount} ${fromCurrency} = ${toAmount} ${toCurrency}`;
                    
                    const textArea = document.createElement('textarea');
                    textArea.value = result;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    
                    showSuccessMessage('转换结果已复制到剪贴板！');
                } catch (fallbackError) {
                    showErrorMessage('复制失败，请手动复制结果');
                }
            }
        }

        // 刷新汇率
        function refreshRates() {
            document.getElementById('refreshBtn').disabled = true;
            fetchRates();
        }

        // 输入框焦点事件
        function focusInput(type) {
            document.getElementById(type + 'Currency').classList.add('focused');
        }

        function blurInput(type) {
            document.getElementById(type + 'Currency').classList.remove('focused');
        }

        // 显示/隐藏加载动画
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        // 显示错误消息
        function showErrorMessage(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        // 显示成功消息
        function showSuccessMessage(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 3000);
        }

        // 隐藏所有消息
        function hideMessages() {
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
        }

        // 定期更新汇率（每5分钟）
        setInterval(() => {
            if (navigator.onLine) {
                fetchRates();
            }
        }, 5 * 60 * 1000);
    </script>
</body>
</html>
