<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品保质期管理 | 精美界面</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4361ee;
            --primary-light: #4895ef;
            --secondary: #3f37c9;
            --success: #4cc9f0;
            --danger: #f72585;
            --warning: #f8961e;
            --info: #7209b7;
            --dark: #1a1a2e;
            --light: #f8f9fa;
            --gray: #6c757d;
            --light-gray: #e9ecef;
            --white: #ffffff;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --radius: 12px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #f5f7ff;
            color: var(--dark);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--info));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--dark);
            letter-spacing: -0.5px;
        }

        .logo-subtext {
            font-size: 0.875rem;
            color: var(--gray);
            font-weight: 400;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card.warning {
            border-top: 4px solid var(--warning);
        }

        .stat-card.danger {
            border-top: 4px solid var(--danger);
        }

        .stat-card.success {
            border-top: 4px solid var(--success);
        }

        .stat-card.info {
            border-top: 4px solid var(--info);
        }

        .stat-title {
            font-size: 0.875rem;
            color: var(--gray);
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .stat-value {
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 0.5rem;
        }

        .stat-change {
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .stat-change.positive {
            color: var(--success);
        }

        .stat-change.negative {
            color: var(--danger);
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 2rem;
        }

        .form-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            height: fit-content;
            position: sticky;
            top: 1rem;
        }

        .form-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .form-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--dark);
        }

        .form-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .form-tab {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            background: var(--light-gray);
            color: var(--gray);
        }

        .form-tab.active {
            background: var(--primary);
            color: var(--white);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--dark);
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--light-gray);
            border-radius: 8px;
            font-size: 0.9375rem;
            transition: var(--transition);
            background: var(--light);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.15);
        }

        .form-row {
            display: flex;
            gap: 1rem;
        }

        .form-col {
            flex: 1;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--white);
        }

        .btn-primary:hover {
            background: var(--secondary);
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--light-gray);
            color: var(--gray);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-danger {
            background: var(--danger);
            color: var(--white);
        }

        .btn-danger:hover {
            background: #e3176a;
        }

        .products-card {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .products-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--light-gray);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .products-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--dark);
        }

        .products-actions {
            display: flex;
            gap: 0.75rem;
        }

        .search-box {
            position: relative;
            width: 240px;
        }

        .search-input {
            width: 100%;
            padding: 0.5rem 1rem 0.5rem 2.5rem;
            border: 1px solid var(--light-gray);
            border-radius: 8px;
            font-size: 0.875rem;
            transition: var(--transition);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
            font-size: 0.875rem;
        }

        .products-table {
            width: 100%;
            border-collapse: collapse;
        }

        .products-table th {
            text-align: left;
            padding: 1rem 1.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: var(--light);
        }

        .products-table td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--light-gray);
            font-size: 0.875rem;
            color: var(--dark);
        }

        .products-table tr:last-child td {
            border-bottom: none;
        }

        .products-table tr:hover td {
            background: rgba(67, 97, 238, 0.03);
        }

        .product-name {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .product-avatar {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--primary-light), var(--info));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .product-name-text {
            font-weight: 500;
        }

        .product-category {
            font-size: 0.75rem;
            color: var(--gray);
            margin-top: 0.25rem;
        }

        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .status-safe {
            background: rgba(76, 201, 240, 0.1);
            color: var(--success);
        }

        .status-warning {
            background: rgba(248, 150, 30, 0.1);
            color: var(--warning);
        }

        .status-danger {
            background: rgba(247, 37, 133, 0.1);
            color: var(--danger);
        }

        .status-expired {
            background: rgba(108, 117, 125, 0.1);
            color: var(--gray);
        }

        .product-actions {
            display: flex;
            gap: 0.5rem;
        }

        .action-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            background: transparent;
            color: var(--gray);
        }

        .action-btn:hover {
            background: var(--light-gray);
            color: var(--primary);
        }

        .action-btn.edit {
            color: var(--primary);
        }

        .action-btn.delete {
            color: var(--danger);
        }

        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--light-gray);
        }

        .pagination-info {
            font-size: 0.875rem;
            color: var(--gray);
        }

        .pagination-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .empty-state {
            padding: 3rem 1.5rem;
            text-align: center;
        }

        .empty-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            background: var(--light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gray);
            font-size: 2rem;
        }

        .empty-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 0.5rem;
        }

        .empty-text {
            font-size: 0.875rem;
            color: var(--gray);
            margin-bottom: 1.5rem;
            max-width: 360px;
            margin-left: auto;
            margin-right: auto;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .form-card {
                position: static;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 1.5rem;
            }
            
            .stats-container {
                grid-template-columns: 1fr 1fr;
            }
            
            .form-row {
                flex-direction: column;
                gap: 1.25rem;
            }
            
            .products-actions {
                flex-direction: column;
                align-items: flex-end;
            }
            
            .search-box {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .stats-container {
                grid-template-columns: 1fr;
            }
            
            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            
            .pagination {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon">S</div>
                <div>
                    <div class="logo-text">商品保质期管理</div>
                    <div class="logo-subtext">跟踪商品保质期，避免过期浪费</div>
                </div>
            </div>
            <div class="stats-container">
                <div class="stat-card success">
                    <div class="stat-title">安全商品</div>
                    <div class="stat-value" id="safeCount">0</div>
                    <div class="stat-change positive">
                        <span>↑</span>
                        <span>12%</span>
                    </div>
                </div>
                <div class="stat-card warning">
                    <div class="stat-title">临期商品</div>
                    <div class="stat-value" id="warningCount">0</div>
                    <div class="stat-change negative">
                        <span>↓</span>
                        <span>5%</span>
                    </div>
                </div>
                <div class="stat-card danger">
                    <div class="stat-title">即将过期</div>
                    <div class="stat-value" id="dangerCount">0</div>
                </div>
                <div class="stat-card info">
                    <div class="stat-title">已过期</div>
                    <div class="stat-value" id="expiredCount">0</div>
                </div>
            </div>
        </header>

        <div class="main-content">
            <div class="form-card">
                <div class="form-header">
                    <div class="form-title">添加商品</div>
                </div>
                <form id="productForm">
                    <div class="form-group">
                        <label for="productName" class="form-label">商品名称</label>
                        <input type="text" id="productName" class="form-control" placeholder="输入商品名称" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="productCategory" class="form-label">商品分类</label>
                        <input type="text" id="productCategory" class="form-control" placeholder="输入商品分类">
                    </div>
                    
                    <div class="form-row">
                        <div class="form-col">
                            <div class="form-group">
                                <label for="productionDate" class="form-label">生产日期</label>
                                <input type="date" id="productionDate" class="form-control" required>
                            </div>
                        </div>
                        <div class="form-col">
                            <div class="form-group">
                                <label for="quantity" class="form-label">数量</label>
                                <input type="number" id="quantity" class="form-control" min="1" value="1">
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-col">
                            <div class="form-group">
                                <label for="shelfLifeValue" class="form-label">保质期</label>
                                <input type="number" id="shelfLifeValue" class="form-control" min="1" value="12" required>
                            </div>
                        </div>
                        <div class="form-col">
                            <div class="form-group">
                                <label for="shelfLifeUnit" class="form-label">单位</label>
                                <select id="shelfLifeUnit" class="form-control">
                                    <option value="days">天</option>
                                    <option value="months" selected>月</option>
                                    <option value="years">年</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="expiryDate" class="form-label">过期日期</label>
                        <input type="date" id="expiryDate" class="form-control" readonly>
                    </div>
                    
                    <div class="form-group" style="margin-top: 1.5rem;">
                        <button type="submit" class="btn btn-primary" id="saveBtn">
                            <span>保存商品</span>
                        </button>
                        <button type="button" class="btn btn-outline" id="cancelBtn" style="display: none;">
                            <span>取消</span>
                        </button>
                    </div>
                </form>
            </div>

            <div class="products-card">
                <div class="products-header">
                    <div class="products-title">商品列表</div>
                    <div class="products-actions">
                        <div class="search-box">
                            <span class="search-icon">🔍</span>
                            <input type="text" class="search-input" id="searchInput" placeholder="搜索商品...">
                        </div>
                        <select class="form-control" id="statusFilter" style="width: 120px;">
                            <option value="">所有状态</option>
                            <option value="safe">安全</option>
                            <option value="warning">临期</option>
                            <option value="danger">即将过期</option>
                            <option value="expired">已过期</option>
                        </select>
                    </div>
                </div>
                
                <div class="products-table-container">
                    <table class="products-table">
                        <thead>
                            <tr>
                                <th>商品</th>
                                <th>生产日期</th>
                                <th>保质期</th>
                                <th>过期日期</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="productTableBody">
                            <tr>
                                <td colspan="6" class="empty-state">
                                    <div class="empty-icon">📦</div>
                                    <div class="empty-title">暂无商品</div>
                                    <div class="empty-text">添加您的第一个商品以开始跟踪保质期</div>
                                    <button class="btn btn-primary" id="addFirstProduct">
                                        <span>添加商品</span>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <div class="pagination">
                    <div class="pagination-info">显示 <span id="startItem">0</span>-<span id="endItem">0</span> 共 <span id="totalItems">0</span> 项</div>
                    <div class="pagination-buttons">
                        <button class="btn btn-outline" id="prevPage">上一页</button>
                        <button class="btn btn-outline" id="nextPage">下一页</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let products = [];
        let editingId = null;
        let currentPage = 1;
        const itemsPerPage = 8;
        
        // DOM元素
        const productForm = document.getElementById('productForm');
        const productName = document.getElementById('productName');
        const productCategory = document.getElementById('productCategory');
        const productionDate = document.getElementById('productionDate');
        const shelfLifeValue = document.getElementById('shelfLifeValue');
        const shelfLifeUnit = document.getElementById('shelfLifeUnit');
        const expiryDate = document.getElementById('expiryDate');
        const quantity = document.getElementById('quantity');
        const saveBtn = document.getElementById('saveBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const searchInput = document.getElementById('searchInput');
        const statusFilter = document.getElementById('statusFilter');
        const productTableBody = document.getElementById('productTableBody');
        const addFirstProduct = document.getElementById('addFirstProduct');
        const prevPage = document.getElementById('prevPage');
        const nextPage = document.getElementById('nextPage');
        const startItem = document.getElementById('startItem');
        const endItem = document.getElementById('endItem');
        const totalItems = document.getElementById('totalItems');
        const safeCount = document.getElementById('safeCount');
        const warningCount = document.getElementById('warningCount');
        const dangerCount = document.getElementById('dangerCount');
        const expiredCount = document.getElementById('expiredCount');

        // 初始化
        function init() {
            // 设置默认生产日期为今天
            productionDate.valueAsDate = new Date();
            
            // 计算初始过期日期
            calculateExpiryDate();
            
            // 加载保存的数据
            loadProducts();
            
            // 设置事件监听
            setupEventListeners();
        }

        // 计算过期日期
        function calculateExpiryDate() {
            if (!productionDate.value || !shelfLifeValue.value) return;
            
            const productionMoment = moment(productionDate.value);
            const value = parseInt(shelfLifeValue.value);
            const unit = shelfLifeUnit.value;
            
            let expiryMoment;
            
            switch(unit) {
                case 'days':
                    expiryMoment = productionMoment.add(value, 'days');
                    break;
                case 'months':
                    expiryMoment = productionMoment.add(value, 'months');
                    break;
                case 'years':
                    expiryMoment = productionMoment.add(value, 'years');
                    break;
                default:
                    expiryMoment = productionMoment.add(value, 'months');
            }
            
            expiryDate.value = expiryMoment.format('YYYY-MM-DD');
        }

        // 加载保存的商品数据
        function loadProducts() {
            const savedProducts = localStorage.getItem('products');
            
            if (savedProducts) {
                try {
                    products = JSON.parse(savedProducts);
                    updateProductTable();
                    updateStats();
                } catch (e) {
                    console.error("解析商品数据失败:", e);
                }
            }
        }

        // 保存商品数据
        function saveProducts() {
            localStorage.setItem('products', JSON.stringify(products));
            updateStats();
        }

        // 更新统计信息
        function updateStats() {
            const today = moment().startOf('day');
            let safe = 0, warning = 0, danger = 0, expired = 0;
            
            products.forEach(product => {
                const expiryMoment = moment(product.expiryDate);
                const daysRemaining = expiryMoment.diff(today, 'days');
                
                if (daysRemaining < 0) {
                    expired++;
                } else if (daysRemaining <= 7) {
                    danger++;
                } else if (daysRemaining <= 30) {
                    warning++;
                } else {
                    safe++;
                }
            });
            
            safeCount.textContent = safe;
            warningCount.textContent = warning;
            dangerCount.textContent = danger;
            expiredCount.textContent = expired;
        }

        // 添加或更新商品
        function handleSaveProduct(e) {
            e.preventDefault();
            
            const name = productName.value.trim();
            const category = productCategory.value.trim();
            const prodDate = productionDate.value;
            const shelfValue = shelfLifeValue.value;
            const shelfUnit = shelfLifeUnit.value;
            const expDate = expiryDate.value;
            const qty = parseInt(quantity.value) || 1;
            
            if (!name || !prodDate || !shelfValue || !expDate) {
                alert('请填写所有必填字段');
                return;
            }
            
            const product = {
                id: editingId || Date.now().toString(),
                name,
                category: category || undefined,
                productionDate: prodDate,
                expiryDate: expDate,
                shelfLifeValue: parseInt(shelfValue),
                shelfLifeUnit: shelfUnit,
                quantity: qty
            };
            
            if (editingId) {
                // 更新现有商品
                const index = products.findIndex(p => p.id === editingId);
                if (index !== -1) {
                    products[index] = product;
                }
                editingId = null;
                saveBtn.innerHTML = '<span>保存商品</span>';
                cancelBtn.style.display = 'none';
            } else {
                // 添加新商品
                products.push(product);
            }
            
            // 重置表单
            productForm.reset();
            productionDate.valueAsDate = new Date();
            calculateExpiryDate();
            
            saveProducts();
            updateProductTable();
            currentPage = Math.ceil(products.length / itemsPerPage);
        }

        // 更新商品表格
        function updateProductTable() {
            if (products.length === 0) {
                productTableBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="empty-state">
                            <div class="empty-icon">📦</div>
                            <div class="empty-title">暂无商品</div>
                            <div class="empty-text">添加您的第一个商品以开始跟踪保质期</div>
                            <button class="btn btn-primary" id="addFirstProduct">
                                <span>添加商品</span>
                            </button>
                        </td>
                    </tr>
                `;
                document.getElementById('addFirstProduct').addEventListener('click', () => {
                    document.querySelector('.form-card').scrollIntoView({ behavior: 'smooth' });
                    productName.focus();
                });
                updatePagination();
                return;
            }
            
            const searchTerm = searchInput.value.toLowerCase();
            const status = statusFilter.value;
            
            let filteredProducts = products.filter(product => {
                // 搜索词匹配
                const matchesSearch = product.name.toLowerCase().includes(searchTerm) || 
                                     (product.category && product.category.toLowerCase().includes(searchTerm));
                
                // 状态匹配
                const today = moment().startOf('day');
                const expiryMoment = moment(product.expiryDate);
                const daysRemaining = expiryMoment.diff(today, 'days');
                
                let matchesStatus = true;
                
                if (status) {
                    if (status === 'expired') {
                        matchesStatus = daysRemaining < 0;
                    } else if (status === 'danger') {
                        matchesStatus = daysRemaining >= 0 && daysRemaining <= 7;
                    } else if (status === 'warning') {
                        matchesStatus = daysRemaining > 7 && daysRemaining <= 30;
                    } else if (status === 'safe') {
                        matchesStatus = daysRemaining > 30;
                    }
                }
                
                return matchesSearch && matchesStatus;
            });
            
            // 分页
            const totalPages = Math.ceil(filteredProducts.length / itemsPerPage);
            if (currentPage > totalPages && totalPages > 0) {
                currentPage = totalPages;
            }
            
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = Math.min(startIndex + itemsPerPage, filteredProducts.length);
            const paginatedProducts = filteredProducts.slice(startIndex, endIndex);
            
            let html = '';
            
            paginatedProducts.forEach(product => {
                const today = moment().startOf('day');
                const expiryMoment = moment(product.expiryDate);
                const daysRemaining = expiryMoment.diff(today, 'days');
                
                let status, statusClass;
                
                if (daysRemaining < 0) {
                    status = '已过期';
                    statusClass = 'status-expired';
                } else if (daysRemaining <= 7) {
                    status = '即将过期';
                    statusClass = 'status-danger';
                } else if (daysRemaining <= 30) {
                    status = '临期';
                    statusClass = 'status-warning';
                } else {
                    status = '安全';
                    statusClass = 'status-safe';
                }
                
                // 获取商品名称首字母
                const firstLetter = product.name.charAt(0).toUpperCase();
                const colors = ['#4361ee', '#3f37c9', '#7209b7', '#f72585', '#f8961e', '#4cc9f0'];
                const color = colors[firstLetter.charCodeAt(0) % colors.length];
                
                html += `
                    <tr>
                        <td>
                            <div class="product-name">
                                <div class="product-avatar" style="background: ${color}">${firstLetter}</div>
                                <div>
                                    <div class="product-name-text">${product.name}</div>
                                    ${product.category ? `<div class="product-category">${product.category}</div>` : ''}
                                </div>
                            </div>
                        </td>
                        <td>${moment(product.productionDate).format('YYYY-MM-DD')}</td>
                        <td>${product.shelfLifeValue} ${getUnitText(product.shelfLifeUnit)}</td>
                        <td>${moment(product.expiryDate).format('YYYY-MM-DD')}</td>
                        <td><span class="status-badge ${statusClass}">${status}</span></td>
                        <td>
                            <div class="product-actions">
                                <button class="action-btn edit" data-id="${product.id}">✏️</button>
                                <button class="action-btn delete" data-id="${product.id}">🗑️</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            
            productTableBody.innerHTML = html;
            updatePagination(filteredProducts.length);
        }

        // 更新分页信息
        function updatePagination(total = products.length) {
            const startIndex = (currentPage - 1) * itemsPerPage + 1;
            const endIndex = Math.min(currentPage * itemsPerPage, total);
            
            startItem.textContent = total === 0 ? 0 : startIndex;
            endItem.textContent = endIndex;
            totalItems.textContent = total;
            
            prevPage.disabled = currentPage === 1;
            nextPage.disabled = currentPage * itemsPerPage >= total;
        }

        // 获取保质期单位文本
        function getUnitText(unit) {
            switch(unit) {
                case 'days': return '天';
                case 'months': return '月';
                case 'years': return '年';
                default: return '月';
            }
        }

        // 编辑商品
        function editProduct(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;
            
            editingId = id;
            
            productName.value = product.name;
            productCategory.value = product.category || '';
            productionDate.value = product.productionDate;
            shelfLifeValue.value = product.shelfLifeValue;
            shelfLifeUnit.value = product.shelfLifeUnit;
            expiryDate.value = product.expiryDate;
            quantity.value = product.quantity || 1;
            
            saveBtn.innerHTML = '<span>更新商品</span>';
            cancelBtn.style.display = 'inline-flex';
            
            document.querySelector('.form-card').scrollIntoView({ behavior: 'smooth' });
        }

        // 删除商品
        function deleteProduct(id) {
            if (confirm('确定要删除这个商品吗？')) {
                products = products.filter(p => p.id !== id);
                saveProducts();
                updateProductTable();
            }
        }

        // 设置事件监听
        function setupEventListeners() {
            // 计算过期日期
            productionDate.addEventListener('change', calculateExpiryDate);
            shelfLifeValue.addEventListener('input', calculateExpiryDate);
            shelfLifeUnit.addEventListener('change', calculateExpiryDate);
            
            // 表单提交
            productForm.addEventListener('submit', handleSaveProduct);
            
            // 取消编辑
            cancelBtn.addEventListener('click', () => {
                editingId = null;
                productForm.reset();
                productionDate.valueAsDate = new Date();
                calculateExpiryDate();
                saveBtn.innerHTML = '<span>保存商品</span>';
                cancelBtn.style.display = 'none';
            });
            
            // 搜索和筛选
            searchInput.addEventListener('input', () => {
                currentPage = 1;
                updateProductTable();
            });
            statusFilter.addEventListener('change', () => {
                currentPage = 1;
                updateProductTable();
            });
            
            // 分页
            prevPage.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    updateProductTable();
                }
            });
            
            nextPage.addEventListener('click', () => {
                if (currentPage * itemsPerPage < products.length) {
                    currentPage++;
                    updateProductTable();
                }
            });
            
            // 表格中的编辑/删除按钮事件委托
            productTableBody.addEventListener('click', (e) => {
                if (e.target.closest('.edit')) {
                    editProduct(e.target.closest('.action-btn').dataset.id);
                } else if (e.target.closest('.delete')) {
                    deleteProduct(e.target.closest('.action-btn').dataset.id);
                }
            });
        }

        // 初始化应用
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
