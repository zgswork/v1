<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>子女血型遗传查询</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .input-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .parent-input {
            text-align: center;
            flex: 1;
            min-width: 200px;
        }

        .parent-input h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .blood-type-selector {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .blood-type-btn {
            padding: 12px 20px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1em;
            font-weight: bold;
        }

        .blood-type-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .blood-type-btn.selected {
            background: #3498db;
            color: white;
            border-color: #3498db;
        }

        .calculate-btn {
            display: block;
            width: 200px;
            margin: 30px auto;
            padding: 15px 30px;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.3);
        }

        .calculate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.4);
        }

        .calculate-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .result-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-top: 30px;
            display: none;
        }

        .result-section.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-title {
            color: #2c3e50;
            font-size: 1.5em;
            margin-bottom: 20px;
            text-align: center;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .result-item {
            background: white;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .result-item:hover {
            transform: translateY(-3px);
        }

        .blood-type-result {
            font-size: 1.5em;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 10px;
        }

        .probability {
            font-size: 1.2em;
            color: #3498db;
            font-weight: bold;
        }

        .info-section {
            background: #ecf0f1;
            border-radius: 15px;
            padding: 25px;
            margin-top: 30px;
        }

        .info-title {
            color: #2c3e50;
            font-size: 1.3em;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .info-title::before {
            content: "💡";
            margin-right: 10px;
            font-size: 1.2em;
        }

        .info-content {
            color: #34495e;
            line-height: 1.6;
        }

        .info-content ul {
            margin-left: 20px;
            margin-top: 10px;
        }

        .info-content li {
            margin-bottom: 5px;
        }

        .footer-notes {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
            text-align: center;
            font-size: 0.75em;
            line-height: 1.3;
            color: #34495e;
        }

        .footer-notes p {
            margin-bottom: 6px;
        }

        .footer-notes a {
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        .footer-notes a:hover {
            opacity: 0.8;
        }

        .wechat-highlight {
            color: #27ae60;
            font-weight: bold;
        }

        .wechat-name {
            color: #e74c3c;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .footer-notes {
                font-size: 0.7em;
            }

            .footer-notes p {
                margin-bottom: 4px;
            }
            .content {
                padding: 20px;
            }

            .input-group {
                flex-direction: column;
            }

            .parent-input {
                width: 100%;
            }

            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🩸 子女血型遗传查询</h1>
            <p>根据父母血型，预测子女可能的血型及概率</p>
        </div>

        <div class="content">
            <div class="input-section">
                <div class="input-group">
                    <div class="parent-input">
                        <h3>👨 父亲血型</h3>
                        <div class="blood-type-selector" id="father-selector">
                            <button class="blood-type-btn" data-type="A">A型</button>
                            <button class="blood-type-btn" data-type="B">B型</button>
                            <button class="blood-type-btn" data-type="AB">AB型</button>
                            <button class="blood-type-btn" data-type="O">O型</button>
                        </div>
                    </div>

                    <div class="parent-input">
                        <h3>👩 母亲血型</h3>
                        <div class="blood-type-selector" id="mother-selector">
                            <button class="blood-type-btn" data-type="A">A型</button>
                            <button class="blood-type-btn" data-type="B">B型</button>
                            <button class="blood-type-btn" data-type="AB">AB型</button>
                            <button class="blood-type-btn" data-type="O">O型</button>
                        </div>
                    </div>
                </div>

                <button class="calculate-btn" id="calculate-btn" disabled>计算子女血型</button>
            </div>

            <div class="result-section" id="result-section">
                <h3 class="result-title">👶 子女可能的血型</h3>
                <div class="result-grid" id="result-grid"></div>
            </div>

            <div class="info-section">
                <h3 class="info-title">血型遗传知识</h3>
                <div class="info-content">
                    <p><strong>ABO血型系统遗传规律：</strong></p>
                    <ul>
                        <li>A型血：基因型为AA或AO</li>
                        <li>B型血：基因型为BB或BO</li>
                        <li>AB型血：基因型为AB</li>
                        <li>O型血：基因型为OO</li>
                    </ul>
                    <p style="margin-top: 15px;"><strong>遗传原理：</strong>子女从父母各继承一个血型基因，A和B基因为显性，O基因为隐性。</p>
                </div>
            </div>

            <div class="footer-notes">
                <p>获取本工具（<a href="https://pan.quark.cn/s/9d8fe1a5d2c9" target="_blank">点这领取</a>）</p>
                <p>更多工具请关注公众号：<span class="wechat-name">老陈的AI编程实验室</span></p>
                <p>如有任何建议或问题，请联系微信：<span class="wechat-highlight">chenlin241214</span>（添加请备注AI老陈）</p>
                <p>我正在「AI编程·垂直小流量复利商业化」，你<a href="https://t.zsxq.com/teUBo" target="_blank">⼀起来吧？</a></p>
            </div>
        </div>
    </div>

    <script>
        let selectedFather = null;
        let selectedMother = null;

        // 血型遗传数据
        const bloodTypeGenetics = {
            'A': ['AA', 'AO'],
            'B': ['BB', 'BO'],
            'AB': ['AB'],
            'O': ['OO']
        };

        // 基因型到血型的映射
        const genotypeToBloodType = {
            'AA': 'A', 'AO': 'A', 'OA': 'A',
            'BB': 'B', 'BO': 'B', 'OB': 'B',
            'AB': 'AB', 'BA': 'AB',
            'OO': 'O'
        };

        // 初始化事件监听
        document.addEventListener('DOMContentLoaded', function() {
            initializeSelectors();
            updateCalculateButton();
        });

        function initializeSelectors() {
            const fatherSelector = document.getElementById('father-selector');
            const motherSelector = document.getElementById('mother-selector');

            fatherSelector.addEventListener('click', function(e) {
                if (e.target.classList.contains('blood-type-btn')) {
                    selectBloodType(fatherSelector, e.target.dataset.type, 'father');
                }
            });

            motherSelector.addEventListener('click', function(e) {
                if (e.target.classList.contains('blood-type-btn')) {
                    selectBloodType(motherSelector, e.target.dataset.type, 'mother');
                }
            });

            document.getElementById('calculate-btn').addEventListener('click', calculateInheritance);
        }

        function selectBloodType(selector, bloodType, parent) {
            // 清除之前的选择
            selector.querySelectorAll('.blood-type-btn').forEach(btn => {
                btn.classList.remove('selected');
            });

            // 选择当前按钮
            selector.querySelector(`[data-type="${bloodType}"]`).classList.add('selected');

            if (parent === 'father') {
                selectedFather = bloodType;
            } else {
                selectedMother = bloodType;
            }

            updateCalculateButton();
        }

        function updateCalculateButton() {
            const calculateBtn = document.getElementById('calculate-btn');
            if (selectedFather && selectedMother) {
                calculateBtn.disabled = false;
            } else {
                calculateBtn.disabled = true;
            }
        }

        function calculateInheritance() {
            if (!selectedFather || !selectedMother) return;

            const fatherGenotypes = bloodTypeGenetics[selectedFather];
            const motherGenotypes = bloodTypeGenetics[selectedMother];

            const results = {};
            let totalCombinations = 0;

            // 计算所有可能的基因组合
            fatherGenotypes.forEach(fatherGene => {
                motherGenotypes.forEach(motherGene => {
                    fatherGene.split('').forEach(fGene => {
                        motherGene.split('').forEach(mGene => {
                            const childGenotype = fGene + mGene;
                            const childBloodType = genotypeToBloodType[childGenotype];
                            
                            if (!results[childBloodType]) {
                                results[childBloodType] = 0;
                            }
                            results[childBloodType]++;
                            totalCombinations++;
                        });
                    });
                });
            });

            displayResults(results, totalCombinations);
        }

        function displayResults(results, total) {
            const resultSection = document.getElementById('result-section');
            const resultGrid = document.getElementById('result-grid');

            resultGrid.innerHTML = '';

            // 按血型排序显示结果
            const sortedResults = Object.entries(results).sort((a, b) => {
                const order = ['A', 'B', 'AB', 'O'];
                return order.indexOf(a[0]) - order.indexOf(b[0]);
            });

            sortedResults.forEach(([bloodType, count]) => {
                const probability = ((count / total) * 100).toFixed(1);
                const resultItem = document.createElement('div');
                resultItem.className = 'result-item';
                resultItem.innerHTML = `
                    <div class="blood-type-result">${bloodType}型</div>
                    <div class="probability">${probability}%</div>
                `;
                resultGrid.appendChild(resultItem);
            });

            resultSection.classList.add('show');
            resultSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    </script>
</body>
</html>
