        // 获取DOM元素
        const generateBtn = document.getElementById('generateBtn');
        const changeBtn = document.getElementById('changeBtn');
        const resultContainer = document.getElementById('resultContainer');
        const attractionName = document.getElementById('attractionName');
        const attractionDesc = document.getElementById('attractionDesc');
        const attractionAddress = document.getElementById('attractionAddress');
        const transportation = document.getElementById('transportation');
        const ticketPrice = document.getElementById('ticketPrice');
        const openingHours = document.getElementById('openingHours');
        const downloadBtn = document.getElementById('downloadBtn');
        const downloadModal = document.getElementById('downloadModal');
        const closeModalBtn = document.getElementById('closeModalBtn');

        // 上次显示的景点索引
        let lastIndex = -1;

        // 生成随机景点
        function generateRandomAttraction() {
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * attractions.length);
            } while (randomIndex === lastIndex && attractions.length > 1);
            
            lastIndex = randomIndex;
            return attractions[randomIndex];
        }

        // 显示景点信息
        function displayAttraction(attraction) {
            attractionName.textContent = attraction.name;
            attractionDesc.textContent = attraction.desc;
            attractionAddress.textContent = attraction.address;
            transportation.textContent = attraction.transportation;
            ticketPrice.textContent = attraction.ticketPrice;
            openingHours.textContent = attraction.openingHours;
            
            resultContainer.style.display = 'block';
            generateBtn.style.display = 'none';
        }

        // 事件监听
        generateBtn.addEventListener('click', function() {
            const randomAttraction = generateRandomAttraction();
            displayAttraction(randomAttraction);
        });

        changeBtn.addEventListener('click', function() {
            const randomAttraction = generateRandomAttraction();
            displayAttraction(randomAttraction);
        });
        
        // 下载按钮事件
        downloadBtn.addEventListener('click', function() {
            downloadModal.style.display = 'flex';
        });
        
        closeModalBtn.addEventListener('click', function() {
            downloadModal.style.display = 'none';
        });
        
        // 点击模态框外部关闭
        downloadModal.addEventListener('click', function(e) {
            if (e.target === downloadModal) {
                downloadModal.style.display = 'none';
            }
        });
    </script>
