    <script>
        // 画布和上下文
        const canvas = document.getElementById('coverCanvas');
        const ctx = canvas.getContext('2d');
        
        // 设置画布尺寸
        canvas.width = 1283;
        canvas.height = 383;
        
        // 全局设置
        let settings = {
            leftBgColor: '#149c86',
            rightBgColor: '#149c86',
            mainTitle: '公众号封面生成器',
            rightTitle: '封面编辑器',
            fontFamily: 'Microsoft YaHei, sans-serif',
            mainTitleColor: '#ffffff',
            rightTitleColor: '#ffffff',
            mainTitleSize: 48,
            rightTitleSize: 36,
            textAlign: 'center'
        };
        
        // 初始化画布
        function initCanvas() {
            drawCover();
        }
        
        // 绘制封面
        function drawCover() {
            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制左侧区域 (900x383)
            ctx.fillStyle = settings.leftBgColor;
            ctx.fillRect(0, 0, 900, 383);
            
            // 绘制右侧区域 (383x383)
            ctx.fillStyle = settings.rightBgColor;
            ctx.fillRect(900, 0, 383, 383);
            
            // 绘制文案
            drawText();
        }
         
        // 绘制文案
        function drawText() {
            ctx.textBaseline = 'middle';
            
            // 绘制左侧主标题
            ctx.font = `bold ${settings.mainTitleSize}px ${settings.fontFamily}`;
            ctx.fillStyle = settings.mainTitleColor;
            ctx.textAlign = settings.textAlign;
            
            const leftCenterX = 450; // 左侧区域中心
            const mainTitleY = 150;
            ctx.fillText(settings.mainTitle, leftCenterX, mainTitleY);
            
            // 绘制右侧标题
            ctx.font = `bold ${settings.rightTitleSize}px ${settings.fontFamily}`;
            ctx.fillStyle = settings.rightTitleColor;
            const rightCenterX = 900 + 191.5; // 右侧区域中心
            const rightTitleY = 191.5; // 右侧区域中心
            ctx.fillText(settings.rightTitle, rightCenterX, rightTitleY);
        }
        
        // 快速颜色选择
        function setQuickColor(side, color) {
            if (side === 'left') {
                settings.leftBgColor = color;
                document.getElementById('leftBgColor').value = color;
                document.getElementById('leftBgColorCode').value = color;
            } else {
                settings.rightBgColor = color;
                document.getElementById('rightBgColor').value = color;
                document.getElementById('rightBgColorCode').value = color;
            }
            drawCover();
        }
        
        // 颜色验证
        function isValidColor(color) {
            const s = new Option().style;
            s.color = color;
            return s.color !== '';
        }
        
        // 重置设置
        function resetSettings() {
            settings = {
                leftBgColor: '#149c86',
                rightBgColor: '#149c86',
                mainTitle: '公众号封面生成器',
                rightTitle: '封面编辑器',
                fontFamily: 'Microsoft YaHei, sans-serif',
                mainTitleColor: '#ffffff',
                rightTitleColor: '#ffffff',
                mainTitleSize: 48,
                rightTitleSize: 36,
                textAlign: 'center'
            };
            
            // 更新界面
            document.getElementById('leftBgColor').value = settings.leftBgColor;
            document.getElementById('leftBgColorCode').value = settings.leftBgColor;
            document.getElementById('rightBgColor').value = settings.rightBgColor;
            document.getElementById('rightBgColorCode').value = settings.rightBgColor;
            document.getElementById('mainTitle').value = settings.mainTitle;
            document.getElementById('rightTitle').value = settings.rightTitle;
            document.getElementById('fontFamily').value = settings.fontFamily;
            document.getElementById('mainTitleColor').value = settings.mainTitleColor;
            document.getElementById('mainTitleColorCode').value = settings.mainTitleColor;
            document.getElementById('rightTitleColor').value = settings.rightTitleColor;
            document.getElementById('rightTitleColorCode').value = settings.rightTitleColor;
            document.getElementById('mainTitleSize').value = settings.mainTitleSize;
            document.getElementById('mainTitleSizeValue').textContent = settings.mainTitleSize;
            document.getElementById('rightTitleSize').value = settings.rightTitleSize;
            document.getElementById('rightTitleSizeValue').textContent = settings.rightTitleSize;
            
            // 重置对齐按钮
            document.querySelectorAll('.align-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('data-align') === 'center') {
                    btn.classList.add('active');
                }
            });
            
            drawCover();
        }
        
        // 下载封面
        function downloadCover() {
            const link = document.createElement('a');
            link.download = '公众号封面.png';
            link.href = canvas.toDataURL();
            link.click();
        }
        
        // 复制到剪贴板
        function copyToClipboard() {
            canvas.toBlob(function(blob) {
                const item = new ClipboardItem({ 'image/png': blob });
                navigator.clipboard.write([item]).then(function() {
                    alert('图片已复制到剪贴板！');
                }).catch(function(err) {
                    console.error('复制失败:', err);
                    alert('复制失败，请使用下载功能。');
                });
            });
        }
        
        // 颜色选择器事件
        document.getElementById('leftBgColor').addEventListener('change', function(e) {
            settings.leftBgColor = e.target.value;
            document.getElementById('leftBgColorCode').value = e.target.value;
            drawCover();
        });
        
        document.getElementById('rightBgColor').addEventListener('change', function(e) {
            settings.rightBgColor = e.target.value;
            document.getElementById('rightBgColorCode').value = e.target.value;
            drawCover();
        });
        
        // 颜色代码输入框事件
        document.getElementById('leftBgColorCode').addEventListener('change', function(e) {
            if (isValidColor(e.target.value)) {
                settings.leftBgColor = e.target.value;
                document.getElementById('leftBgColor').value = e.target.value;
                drawCover();
            }
        });
        
        document.getElementById('rightBgColorCode').addEventListener('change', function(e) {
            if (isValidColor(e.target.value)) {
                settings.rightBgColor = e.target.value;
                document.getElementById('rightBgColor').value = e.target.value;
                drawCover();
            }
        });
        
        // 文案编辑事件监听器
        function setupTextEditListeners() {
            // 文案内容输入框
            document.getElementById('mainTitle').addEventListener('input', function(e) {
                settings.mainTitle = e.target.value;
                drawCover();
            });
            
            document.getElementById('rightTitle').addEventListener('input', function(e) {
                settings.rightTitle = e.target.value;
                drawCover();
            });
            
            // 字体选择
            document.getElementById('fontFamily').addEventListener('change', function(e) {
                settings.fontFamily = e.target.value;
                drawCover();
            });
            
            // 文字颜色
            document.getElementById('mainTitleColor').addEventListener('change', function(e) {
                settings.mainTitleColor = e.target.value;
                document.getElementById('mainTitleColorCode').value = e.target.value;
                drawCover();
            });
            
            document.getElementById('mainTitleColorCode').addEventListener('change', function(e) {
                if (isValidColor(e.target.value)) {
                    settings.mainTitleColor = e.target.value;
                    document.getElementById('mainTitleColor').value = e.target.value;
                    drawCover();
                }
            });
            
            document.getElementById('rightTitleColor').addEventListener('change', function(e) {
                settings.rightTitleColor = e.target.value;
                document.getElementById('rightTitleColorCode').value = e.target.value;
                drawCover();
            });
            
            document.getElementById('rightTitleColorCode').addEventListener('change', function(e) {
                if (isValidColor(e.target.value)) {
                    settings.rightTitleColor = e.target.value;
                    document.getElementById('rightTitleColor').value = e.target.value;
                    drawCover();
                }
            });
            
            // 字体大小滑块
            document.getElementById('mainTitleSize').addEventListener('input', function(e) {
                settings.mainTitleSize = parseInt(e.target.value);
                document.getElementById('mainTitleSizeValue').textContent = e.target.value;
                drawCover();
            });
            
            document.getElementById('rightTitleSize').addEventListener('input', function(e) {
                settings.rightTitleSize = parseInt(e.target.value);
                document.getElementById('rightTitleSizeValue').textContent = e.target.value;
                drawCover();
            });
            
            // 对齐方式按钮
            document.querySelectorAll('.align-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.align-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    settings.textAlign = this.getAttribute('data-align');
                    drawCover();
                });
            });
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            initCanvas();
            setupTextEditListeners();
        });
    </script>
</body>
</html>
