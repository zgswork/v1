<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>错题分类整理工具</title>
    <!-- 引入Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    
    <!-- Tailwind配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6', // 蓝色系，代表知识和学习
                        secondary: '#10B981',
                        difficulty: {
                            easy: '#10B981',    // 简单-绿色
                            medium: '#F59E0B',  // 中等-黄色
                            hard: '#EF4444'     // 困难-红色
                        },
                        neutral: '#64748B',
                        light: '#F8FAFC',
                        dark: '#1E293B'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <!-- 自定义工具类 -->
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .card-shadow {
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
            }
            .transition-all-300 {
                transition: all 300ms ease-in-out;
            }
            .btn-primary {
                @apply bg-primary text-white font-medium py-2.5 px-5 rounded-lg hover:bg-primary/90 active:bg-primary/80 transition-all-300 flex items-center justify-center;
            }
            .btn-secondary {
                @apply bg-white text-primary border border-primary font-medium py-2.5 px-5 rounded-lg hover:bg-primary/5 active:bg-primary/10 transition-all-300 flex items-center justify-center;
            }
            .tag {
                @apply px-3 py-1 rounded-full text-sm font-medium cursor-pointer transition-all-300;
            }
            .tag-active {
                @apply bg-primary/10 text-primary border-primary;
            }
            .difficulty-tag {
                @apply px-3 py-1 rounded-full text-sm font-medium;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-blue-50 min-h-screen font-sans text-dark flex flex-col">
    <!-- 页面容器 -->
    <div class="container mx-auto px-4 py-6 max-w-5xl flex-grow">
        <!-- 标题区域 -->
        <header class="text-center mb-8 mt-4">
            <h1 class="text-[clamp(1.8rem,5vw,2.5rem)] font-bold text-dark mb-3 bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary">
                错题分类整理工具
            </h1>
            <p class="text-neutral text-base max-w-2xl mx-auto">
                系统整理错题，按知识点和难度分类，随机抽题复习，提升学习效率
            </p>
        </header>
        
        <!-- 功能标签页 -->
        <div class="flex flex-wrap justify-center gap-2 mb-6">
            <button class="tab-btn active px-5 py-2 rounded-lg font-medium bg-primary text-white" data-tab="add-question">
                <i class="fa fa-plus mr-2"></i> 添加错题
            </button>
            <button class="tab-btn px-5 py-2 rounded-lg font-medium bg-white text-dark hover:bg-slate-100" data-tab="question-list">
                <i class="fa fa-list mr-2"></i> 错题列表
            </button>
            <button class="tab-btn px-5 py-2 rounded-lg font-medium bg-white text-dark hover:bg-slate-100" data-tab="random-quiz">
                <i class="fa fa-random mr-2"></i> 随机抽题
            </button>
        </div>
        
        <!-- 主要内容区 -->
        <main class="mb-10">
            <!-- 添加错题表单 -->
            <div id="add-question" class="tab-content block">
                <div class="bg-white rounded-2xl p-6 card-shadow">
                    <h2 class="text-xl font-semibold mb-5 flex items-center text-dark">
                        <i class="fa fa-pencil-square-o text-primary mr-2"></i> 添加新错题
                    </h2>
                    
                    <form id="questionForm" class="space-y-4">
                        <div>
                            <label for="questionContent" class="block text-sm font-medium text-neutral mb-1">题干内容 <span class="text-red-500">*</span></label>
                            <textarea id="questionContent" rows="4" placeholder="请输入错题的题干内容..." 
                                      class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all-300" required></textarea>
                        </div>
                        
                        <div>
                            <label for="questionAnswer" class="block text-sm font-medium text-neutral mb-1">正确答案 <span class="text-red-500">*</span></label>
                            <textarea id="questionAnswer" rows="2" placeholder="请输入正确答案..." 
                                      class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all-300" required></textarea>
                        </div>
                        
                        <div>
                            <label for="mistakeReason" class="block text-sm font-medium text-neutral mb-1">错误原因 <span class="text-red-500">*</span></label>
                            <textarea id="mistakeReason" rows="2" placeholder="请记录错误原因和知识点..." 
                                      class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all-300" required></textarea>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label for="knowledgePoint" class="block text-sm font-medium text-neutral mb-1">知识点 <span class="text-red-500">*</span></label>
                                <input type="text" id="knowledgePoint" placeholder="如：数学-二次函数" 
                                       class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all-300" required>
                                <div class="mt-2 flex flex-wrap gap-2" id="knowledgeTags">
                                    <!-- 常用知识点标签将动态生成 -->
                                </div>
                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-neutral mb-1">难度 <span class="text-red-500">*</span></label>
                                <div class="flex gap-3">
                                    <label class="flex items-center">
                                        <input type="radio" name="difficulty" value="easy" class="mr-2" checked>
                                        <span class="text-difficulty-easy">简单</span>
                                    </label>
                                    <label class="flex items-center">
                                        <input type="radio" name="difficulty" value="medium" class="mr-2">
                                        <span class="text-difficulty-medium">中等</span>
                                    </label>
                                    <label class="flex items-center">
                                        <input type="radio" name="difficulty" value="hard" class="mr-2">
                                        <span class="text-difficulty-hard">困难</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                        
                        <div class="pt-2">
                            <button type="submit" class="btn-primary">
                                <i class="fa fa-save mr-2"></i> 保存错题
                            </button>
                        </div>
                    </form>
                </div>
            </div>
            
            <!-- 错题列表 -->
            <div id="question-list" class="tab-content hidden">
                <div class="bg-white rounded-2xl p-6 card-shadow mb-6">
                    <h2 class="text-xl font-semibold mb-5 flex items-center text-dark">
                        <i class="fa fa-filter text-primary mr-2"></i> 筛选错题
                    </h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-neutral mb-2">知识点筛选</label>
                            <div class="flex flex-wrap gap-2" id="knowledgeFilter">
                                <div class="tag tag-active border border-slate-200" data-filter="all">
                                    全部
                                </div>
                                <!-- 知识点筛选标签将动态生成 -->
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-neutral mb-2">难度筛选</label>
                            <div class="flex flex-wrap gap-2">
                                <div class="tag tag-active border border-slate-200" data-filter="all">
                                    全部
                                </div>
                                <div class="tag border border-slate-200 text-difficulty-easy" data-filter="easy">
                                    简单
                                </div>
                                <div class="tag border border-slate-200 text-difficulty-medium" data-filter="medium">
                                    中等
                                </div>
                                <div class="tag border border-slate-200 text-difficulty-hard" data-filter="hard">
                                    困难
                                </div>
                            </div>
                        </div>
                        
                        <div class="flex justify-between items-center">
                            <div class="text-sm text-neutral">
                                共 <span id="totalQuestions" class="font-medium text-primary">0</span> 道错题
                            </div>
                            <button id="clearFilters" class="text-sm text-primary hover:underline">
                                清除筛选
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- 错题列表 -->
                <div id="questionsContainer" class="space-y-4">
                    <div class="bg-white rounded-2xl p-8 card-shadow text-center text-neutral" id="emptyQuestionList">
                        <i class="fa fa-file-text-o text-4xl mb-3"></i>
                        <p>还没有添加错题，去添加错题吧</p>
                    </div>
                    <!-- 错题项将动态生成 -->
                </div>
            </div>
            
            <!-- 随机抽题 -->
            <div id="random-quiz" class="tab-content hidden">
                <div class="bg-white rounded-2xl p-6 card-shadow mb-6">
                    <h2 class="text-xl font-semibold mb-5 flex items-center text-dark">
                        <i class="fa fa-cog text-primary mr-2"></i> 抽题设置
                    </h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-neutral mb-2">按知识点抽题</label>
                            <div class="flex flex-wrap gap-2" id="quizKnowledgeFilter">
                                <div class="tag tag-active border border-slate-200" data-filter="all">
                                    全部
                                </div>
                                <!-- 抽题知识点筛选标签将动态生成 -->
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-neutral mb-2">按难度抽题</label>
                            <div class="flex flex-wrap gap-2">
                                <div class="tag tag-active border border-slate-200" data-filter="all">
                                    全部
                                </div>
                                <div class="tag border border-slate-200 text-difficulty-easy" data-filter="easy">
                                    简单
                                </div>
                                <div class="tag border border-slate-200 text-difficulty-medium" data-filter="medium">
                                    中等
                                </div>
                                <div class="tag border border-slate-200 text-difficulty-hard" data-filter="hard">
                                    困难
                                </div>
                            </div>
                        </div>
                        
                        <div class="pt-2">
                            <button id="drawQuestionBtn" class="btn-primary w-full">
                                <i class="fa fa-random mr-2"></i> 随机抽取一道题
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- 抽题结果 -->
                <div id="quizContainer" class="bg-white rounded-2xl p-6 card-shadow">
                    <div id="emptyQuizState" class="text-center py-10 text-neutral">
                        <i class="fa fa-question-circle text-4xl mb-3"></i>
                        <p>点击上方按钮抽取一道错题进行复习</p>
                    </div>
                    
                    <div id="questionDisplay" class="hidden space-y-5">
                        <div class="flex justify-between items-start">
                            <h3 class="text-lg font-semibold text-dark">题目</h3>
                            <span id="questionDifficulty" class="difficulty-tag"></span>
                        </div>
                        
                        <div id="displayQuestionContent" class="p-4 bg-slate-50 rounded-lg border border-slate-100">
                            <!-- 题目内容将动态生成 -->
                        </div>
                        
                        <div>
                            <button id="showAnswerBtn" class="btn-secondary">
                                <i class="fa fa-eye mr-2"></i> 查看答案和解析
                            </button>
                        </div>
                        
                        <div id="answerContainer" class="hidden space-y-4">
                            <div>
                                <h4 class="font-medium text-dark mb-2">正确答案</h4>
                                <div id="displayAnswer" class="p-3 bg-green-50 rounded-lg border border-green-100 text-green-800">
                                    <!-- 答案将动态生成 -->
                                </div>
                            </div>
                            
                            <div>
                                <h4 class="font-medium text-dark mb-2">错误原因与解析</h4>
                                <div id="displayReason" class="p-3 bg-blue-50 rounded-lg border border-blue-100 text-blue-800">
                                    <!-- 错误原因将动态生成 -->
                                </div>
                            </div>
                            
                            <div>
                                <h4 class="font-medium text-dark mb-2">知识点</h4>
                                <div id="displayKnowledge" class="flex flex-wrap gap-2">
                                    <!-- 知识点标签将动态生成 -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- 成功提示弹窗 -->
    <div id="successToast" class="fixed bottom-6 right-6 bg-green-500 text-white px-5 py-3 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all-300 flex items-center z-50">
        <i class="fa fa-check-circle mr-2"></i>
        <span id="toastMessage">操作成功</span>
    </div>
    
    <!-- 页脚备注 -->
    <footer class="text-center text-neutral text-sm py-4 border-t border-slate-200 mt-auto">
        <p>
            邓文涛(AI版) | <a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="4d7a7d7a78797a79797c0d3c3c632e2220">[email&#160;protected]</a> | VX：707547441 | 更多点击➡️
            <a href="https://dkfile.com/Dx25214" target="_blank" rel="noopener" class="text-primary hover:underline">🌌</a>
        </p>
    </footer>
    
    <!-- 核心逻辑JS -->
    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 等待DOM加载完成
        document.addEventListener('DOMContentLoaded', function() {
            // --------------------------
            // 数据存储与初始化
            // --------------------------
            // 存储键名
            const STORAGE_KEY = 'errorQuestions';
            
            // 应用状态
            let appState = {
                questions: [],
                filters: {
                    knowledge: 'all',
                    difficulty: 'all'
                },
                quizFilters: {
                    knowledge: 'all',
                    difficulty: 'all'
                },
                currentQuestion: null
            };
            
            // 初始化数据
            function initData() {
                const savedQuestions = JSON.parse(localStorage.getItem(STORAGE_KEY));
                if (savedQuestions && Array.isArray(savedQuestions)) {
                    appState.questions = savedQuestions;
                }
            }
            
            // 保存数据到localStorage
            function saveData() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appState.questions));
            }
            
            // 添加新错题
            function addQuestion(questionData) {
                const newQuestion = {
                    id: Date.now(),
                    ...questionData,
                    createdAt: new Date().toISOString()
                };
                
                appState.questions.push(newQuestion);
                saveData();
                return newQuestion;
            }
            
            // 删除错题
            function deleteQuestion(id) {
                appState.questions = appState.questions.filter(q => q.id !== id);
                saveData();
            }
            
            // 获取所有知识点
            function getAllKnowledgePoints() {
                const points = new Set();
                appState.questions.forEach(q => {
                    points.add(q.knowledgePoint);
                });
                return Array.from(points);
            }
            
            // 根据筛选条件获取错题
            function getFilteredQuestions(filters = appState.filters) {
                return appState.questions.filter(q => {
                    const knowledgeMatch = filters.knowledge === 'all' || q.knowledgePoint === filters.knowledge;
                    const difficultyMatch = filters.difficulty === 'all' || q.difficulty === filters.difficulty;
                    return knowledgeMatch && difficultyMatch;
                });
            }
            
            // 随机抽取一道题
            function drawRandomQuestion() {
                const filtered = getFilteredQuestions(appState.quizFilters);
                if (filtered.length === 0) return null;
                
                const randomIndex = Math.floor(Math.random() * filtered.length);
                return filtered[randomIndex];
            }
            
            // --------------------------
            // DOM元素获取
            // --------------------------
            const tabBtns = document.querySelectorAll('.tab-btn');
            const tabContents = document.querySelectorAll('.tab-content');
            const questionForm = document.getElementById('questionForm');
            const questionContent = document.getElementById('questionContent');
            const questionAnswer = document.getElementById('questionAnswer');
            const mistakeReason = document.getElementById('mistakeReason');
            const knowledgePoint = document.getElementById('knowledgePoint');
            const knowledgeTags = document.getElementById('knowledgeTags');
            const knowledgeFilter = document.getElementById('knowledgeFilter');
            const quizKnowledgeFilter = document.getElementById('quizKnowledgeFilter');
            const totalQuestions = document.getElementById('totalQuestions');
            const clearFilters = document.getElementById('clearFilters');
            const questionsContainer = document.getElementById('questionsContainer');
            const emptyQuestionList = document.getElementById('emptyQuestionList');
            const drawQuestionBtn = document.getElementById('drawQuestionBtn');
            const emptyQuizState = document.getElementById('emptyQuizState');
            const questionDisplay = document.getElementById('questionDisplay');
            const questionDifficulty = document.getElementById('questionDifficulty');
            const displayQuestionContent = document.getElementById('displayQuestionContent');
            const showAnswerBtn = document.getElementById('showAnswerBtn');
            const answerContainer = document.getElementById('answerContainer');
            const displayAnswer = document.getElementById('displayAnswer');
            const displayReason = document.getElementById('displayReason');
            const displayKnowledge = document.getElementById('displayKnowledge');
            const successToast = document.getElementById('successToast');
            const toastMessage = document.getElementById('toastMessage');
            
            // --------------------------
            // 视图渲染函数
            // --------------------------
            // 切换标签页
            function switchTab(tabId) {
                // 更新标签按钮状态
                tabBtns.forEach(btn => {
                    if (btn.dataset.tab === tabId) {
                        btn.classList.add('active', 'bg-primary', 'text-white');
                        btn.classList.remove('bg-white', 'text-dark', 'hover:bg-slate-100');
                    } else {
                        btn.classList.remove('active', 'bg-primary', 'text-white');
                        btn.classList.add('bg-white', 'text-dark', 'hover:bg-slate-100');
                    }
                });
                
                // 更新内容显示
                tabContents.forEach(content => {
                    if (content.id === tabId) {
                        content.classList.remove('hidden');
                        content.classList.add('block');
                    } else {
                        content.classList.add('hidden');
                        content.classList.remove('block');
                    }
                });
                
                // 特定标签页需要刷新数据
                if (tabId === 'question-list') {
                    renderKnowledgeFilters();
                    renderQuestionList();
                } else if (tabId === 'random-quiz') {
                    renderQuizKnowledgeFilters();
                }
            }
            
            // 渲染常用知识点标签
            function renderKnowledgeTags() {
                const points = getAllKnowledgePoints();
                knowledgeTags.innerHTML = '';
                
                if (points.length === 0) return;
                
                // 只显示前5个常用知识点
                const topPoints = points.slice(0, 5);
                
                topPoints.forEach(point => {
                    const tag = document.createElement('div');
                    tag.className = 'tag border border-slate-200 text-neutral';
                    tag.textContent = point;
                    
                    tag.addEventListener('click', () => {
                        knowledgePoint.value = point;
                    });
                    
                    knowledgeTags.appendChild(tag);
                });
            }
            
            // 渲染知识点筛选器
            function renderKnowledgeFilters() {
                const points = getAllKnowledgePoints();
                
                // 清除现有标签（保留"全部"）
                while (knowledgeFilter.children.length > 1) {
                    knowledgeFilter.removeChild(knowledgeFilter.lastChild);
                }
                
                points.forEach(point => {
                    const tag = document.createElement('div');
                    tag.className = `tag border border-slate-200 ${appState.filters.knowledge === point ? 'tag-active' : 'text-neutral'}`;
                    tag.textContent = point;
                    tag.dataset.filter = point;
                    
                    tag.addEventListener('click', () => {
                        appState.filters.knowledge = point;
                        renderKnowledgeFilters();
                        renderQuestionList();
                    });
                    
                    knowledgeFilter.appendChild(tag);
                });
            }
            
            // 渲染抽题知识点筛选器
            function renderQuizKnowledgeFilters() {
                const points = getAllKnowledgePoints();
                
                // 清除现有标签（保留"全部"）
                while (quizKnowledgeFilter.children.length > 1) {
                    quizKnowledgeFilter.removeChild(quizKnowledgeFilter.lastChild);
                }
                
                points.forEach(point => {
                    const tag = document.createElement('div');
                    tag.className = `tag border border-slate-200 ${appState.quizFilters.knowledge === point ? 'tag-active' : 'text-neutral'}`;
                    tag.textContent = point;
                    tag.dataset.filter = point;
                    
                    tag.addEventListener('click', () => {
                        appState.quizFilters.knowledge = point;
                        renderQuizKnowledgeFilters();
                    });
                    
                    quizKnowledgeFilter.appendChild(tag);
                });
            }
            
            // 渲染错题列表
            function renderQuestionList() {
                const filteredQuestions = getFilteredQuestions();
                totalQuestions.textContent = filteredQuestions.length;
                
                // 清空列表
                while (questionsContainer.children.length > 1) {
                    questionsContainer.removeChild(questionsContainer.lastChild);
                }
                
                // 显示/隐藏空提示
                if (appState.questions.length === 0) {
                    emptyQuestionList.classList.remove('hidden');
                    return;
                } else {
                    emptyQuestionList.classList.add('hidden');
                }
                
                // 显示筛选结果为空提示
                if (filteredQuestions.length === 0) {
                    const emptyFilterResult = document.createElement('div');
                    emptyFilterResult.className = 'bg-white rounded-2xl p-6 card-shadow text-center text-neutral';
                    emptyFilterResult.innerHTML = `
                        <i class="fa fa-search text-2xl mb-2"></i>
                        <p>没有找到符合筛选条件的错题</p>
                    `;
                    questionsContainer.appendChild(emptyFilterResult);
                    return;
                }
                
                // 渲染错题项
                filteredQuestions.forEach(question => {
                    const difficultyClass = `bg-difficulty-${question.difficulty}/10 text-difficulty-${question.difficulty}`;
                    
                    const questionItem = document.createElement('div');
                    questionItem.className = 'bg-white rounded-2xl p-5 card-shadow hover:shadow-md transition-all-300';
                    questionItem.innerHTML = `
                        <div class="flex justify-between items-start mb-3">
                            <span class="difficulty-tag ${difficultyClass}">
                                ${question.difficulty === 'easy' ? '简单' : question.difficulty === 'medium' ? '中等' : '困难'}
                            </span>
                            <button class="delete-question text-neutral hover:text-red-500 transition-all-300" data-id="${question.id}">
                                <i class="fa fa-trash-o"></i>
                            </button>
                        </div>
                        
                        <div class="mb-3">
                            <h3 class="font-medium text-dark mb-1">${question.content.substring(0, 50)}${question.content.length > 50 ? '...' : ''}</h3>
                            <div class="text-xs text-neutral">${question.knowledgePoint}</div>
                        </div>
                        
                        <div class="flex justify-end">
                            <button class="view-question btn-secondary px-4 text-sm" data-id="${question.id}">
                                <i class="fa fa-eye mr-1"></i> 查看详情
                            </button>
                        </div>
                    `;
                    
                    // 查看详情事件
                    questionItem.querySelector('.view-question').addEventListener('click', () => {
                        viewQuestionDetail(question.id);
                    });
                    
                    // 删除事件
                    questionItem.querySelector('.delete-question').addEventListener('click', () => {
                        if (confirm('确定要删除这道错题吗？')) {
                            deleteQuestion(question.id);
                            renderQuestionList();
                            renderKnowledgeFilters();
                            renderQuizKnowledgeFilters();
                            showToast('错题已删除');
                        }
                    });
                    
                    questionsContainer.appendChild(questionItem);
                });
            }
            
            // 查看错题详情
            function viewQuestionDetail(id) {
                const question = appState.questions.find(q => q.id === id);
                if (!question) return;
                
                // 显示抽题页面
                switchTab('random-quiz');
                
                // 显示题目详情
                displayQuestion(question);
            }
            
            // 显示题目
            function displayQuestion(question) {
                appState.currentQuestion = question;
                
                // 更新UI
                emptyQuizState.classList.add('hidden');
                questionDisplay.classList.remove('hidden');
                answerContainer.classList.add('hidden');
                
                // 设置难度标签
                const difficultyText = question.difficulty === 'easy' ? '简单' : question.difficulty === 'medium' ? '中等' : '困难';
                const difficultyClass = `bg-difficulty-${question.difficulty}/10 text-difficulty-${question.difficulty}`;
                questionDifficulty.className = `difficulty-tag ${difficultyClass}`;
                questionDifficulty.textContent = difficultyText;
                
                // 设置题目内容
                displayQuestionContent.textContent = question.content;
                
                // 设置答案和解析
                displayAnswer.textContent = question.answer;
                displayReason.textContent = question.reason;
                
                // 设置知识点
                displayKnowledge.innerHTML = '';
                const knowledgeTag = document.createElement('div');
                knowledgeTag.className = 'tag border border-primary bg-primary/10 text-primary';
                knowledgeTag.textContent = question.knowledgePoint;
                displayKnowledge.appendChild(knowledgeTag);
            }
            
            // 显示提示消息
            function showToast(message) {
                toastMessage.textContent = message;
                successToast.classList.remove('translate-y-20', 'opacity-0');
                
                // 3秒后隐藏
                setTimeout(() => {
                    successToast.classList.add('translate-y-20', 'opacity-0');
                }, 3000);
            }
            
            // --------------------------
            // 事件处理函数
            // --------------------------
            // 处理表单提交
            function handleFormSubmit(e) {
                e.preventDefault();
                
                // 获取表单数据
                const formData = {
                    content: questionContent.value.trim(),
                    answer: questionAnswer.value.trim(),
                    reason: mistakeReason.value.trim(),
                    knowledgePoint: knowledgePoint.value.trim(),
                    difficulty: document.querySelector('input[name="difficulty"]:checked').value
                };
                
                // 简单验证
                if (!formData.content || !formData.answer || !formData.reason || !formData.knowledgePoint) {
                    alert('请填写所有必填字段');
                    return;
                }
                
                // 添加错题
                addQuestion(formData);
                
                // 重置表单
                questionForm.reset();
                
                // 更新相关视图
                renderKnowledgeTags();
                
                // 显示成功提示
                showToast('错题添加成功');
                
                // 切换到错题列表
                switchTab('question-list');
            }
            
            // 处理筛选标签点击
            function handleFilterClick(e) {
                const target = e.target.closest('[data-filter]');
                if (!target) return;
                
                // 判断是知识点筛选还是难度筛选
                if (target.parentElement.id === 'knowledgeFilter') {
                    appState.filters.knowledge = target.dataset.filter;
                    renderKnowledgeFilters();
                } else if (target.parentElement.id === 'quizKnowledgeFilter') {
                    appState.quizFilters.knowledge = target.dataset.filter;
                    renderQuizKnowledgeFilters();
                } else if (target.parentElement.querySelector('input[name="difficulty"]')) {
                    // 列表难度筛选
                    appState.filters.difficulty = target.dataset.filter;
                    
                    // 更新难度标签状态
                    target.parentElement.querySelectorAll('.tag').forEach(tag => {
                        if (tag.dataset.filter === target.dataset.filter) {
                            tag.classList.add('tag-active');
                        } else {
                            tag.classList.remove('tag-active');
                        }
                    });
                } else {
                    // 抽题难度筛选
                    appState.quizFilters.difficulty = target.dataset.filter;
                    
                    // 更新难度标签状态
                    target.parentElement.querySelectorAll('.tag').forEach(tag => {
                        if (tag.dataset.filter === target.dataset.filter) {
                            tag.classList.add('tag-active');
                        } else {
                            tag.classList.remove('tag-active');
                        }
                    });
                }
                
                // 更新列表
                if (target.parentElement.id === 'knowledgeFilter' || target.parentElement.querySelector('input[name="difficulty"]')) {
                    renderQuestionList();
                }
            }
            
            // 清除筛选条件
            function handleClearFilters() {
                appState.filters = {
                    knowledge: 'all',
                    difficulty: 'all'
                };
                
                renderKnowledgeFilters();
                
                // 重置难度筛选标签
                document.querySelectorAll('#question-list .tag[data-filter]').forEach(tag => {
                    if (tag.dataset.filter === 'all') {
                        tag.classList.add('tag-active');
                    } else {
                        tag.classList.remove('tag-active');
                    }
                });
                
                renderQuestionList();
            }
            
            // 随机抽题
            function handleDrawQuestion() {
                const question = drawRandomQuestion();
                
                if (!question) {
                    alert('没有找到符合条件的错题，请先添加错题或调整筛选条件');
                    return;
                }
                
                displayQuestion(question);
            }
            
            // 查看答案
            function handleShowAnswer() {
                answerContainer.classList.toggle('hidden');
                
                if (answerContainer.classList.contains('hidden')) {
                    showAnswerBtn.innerHTML = '<i class="fa fa-eye mr-2"></i> 查看答案和解析';
                } else {
                    showAnswerBtn.innerHTML = '<i class="fa fa-eye-slash mr-2"></i> 隐藏答案和解析';
                }
            }
            
            // --------------------------
            // 初始化函数
            // --------------------------
            function init() {
                // 初始化数据
                initData();
                
                // 初始化视图
                renderKnowledgeTags();
                renderKnowledgeFilters();
                renderQuizKnowledgeFilters();
                renderQuestionList();
                
                // 绑定事件
                // 标签页切换
                tabBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        switchTab(btn.dataset.tab);
                    });
                });
                
                // 表单提交
                questionForm.addEventListener('submit', handleFormSubmit);
                
                // 筛选标签点击
                document.addEventListener('click', handleFilterClick);
                
                // 清除筛选
                clearFilters.addEventListener('click', handleClearFilters);
                
                // 随机抽题
                drawQuestionBtn.addEventListener('click', handleDrawQuestion);
                
                // 查看答案
                showAnswerBtn.addEventListener('click', handleShowAnswer);
            }
            
            // 启动应用
            init();
        });
    </script>
</body>
</html>
