<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>电子签名板</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9;
      --border: #d9dee5;
      --panel: #ffffff;
      --text: #1f2328;
      --accent: #2563eb;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100vw;
    }

    .header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    .header h1 {
      font-size: 16px;
      margin: 0;
      white-space: nowrap;
    }
    .spacer { flex: 1; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .tool {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
    }
    .tool label { font-size: 12px; color: #475569; }
    .tool input[type="color"] { width: 28px; height: 28px; padding: 0; border: none; background: transparent; }
    .tool input[type="range"] { width: 140px; }

    .buttons { display: inline-flex; gap: 8px; }
    button {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }
    button.primary {
      border-color: #cdd7f5;
      background: #e6efff;
      color: #0b1f6a;
    }
    button:active { transform: translateY(1px); }

    .canvas-wrap {
      flex: 1;
      display: flex;
      padding: 16px;
      overflow: auto;
    }
    .stage {
      flex: 1;
      max-width: 1200px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .hint { font-size: 12px; color: #64748b; }

    .canvas-box {
      position: relative;
      flex: 1;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      background:
        linear-gradient(#f8fafc, #f8fafc) padding-box,
        repeating-linear-gradient(0deg, transparent, transparent 24px, rgba(0,0,0,0.04) 24px, rgba(0,0,0,0.04) 25px);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none; /* 关键：阻止移动端手势滚动 */
      cursor: crosshair;
      border-radius: 8px;
    }

    @media (max-width: 480px) {
      .header { padding: 10px 12px; }
      .toolbar { gap: 8px; }
      .tool { padding: 6px 8px; }
      button { padding: 8px 10px; }
      .canvas-wrap { padding: 12px; }
    }
  </style>
  <script>
    // 简洁的签名板实现，支持鼠标/触控/触控笔，适配高分屏
    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('pad');
      const ctx = canvas.getContext('2d');

      const colorInput = document.getElementById('color');
      const sizeInput = document.getElementById('size');
      const clearBtn = document.getElementById('clear');
      const undoBtn = document.getElementById('undo');
      const saveBtn = document.getElementById('save');

      let drawing = false;
      let currentStroke = null; // {points: [{x,y}], color, size}
      const strokes = []; // 历史笔画

      // 获取相对于画布的坐标（CSS像素）
      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        let x, y;
        if (e.touches && e.touches[0]) {
          x = e.touches[0].clientX - rect.left;
          y = e.touches[0].clientY - rect.top;
        } else {
          x = e.clientX - rect.left;
          y = e.clientY - rect.top;
        }
        return { x, y };
      }

      // 设备像素比缩放，保证高分屏清晰，同时保留CSS坐标绘制
      function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        const cssW = Math.max(1, Math.floor(rect.width));
        const cssH = Math.max(1, Math.floor(rect.height));
        canvas.width = Math.round(cssW * dpr);
        canvas.height = Math.round(cssH * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        redraw();
      }

      function drawStroke(s) {
        if (!s || s.points.length < 1) return;
        ctx.strokeStyle = s.color;
        ctx.lineWidth = s.size;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(s.points[0].x, s.points[0].y);
        for (let i = 1; i < s.points.length; i++) {
          const p = s.points[i];
          ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
      }

      function redraw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const s of strokes) drawStroke(s);
        if (currentStroke) drawStroke(currentStroke);
      }

      function startStroke(e) {
        e.preventDefault();
        const p = getPos(e);
        drawing = true;
        currentStroke = {
          color: colorInput.value,
          size: parseFloat(sizeInput.value),
          points: [p]
        };
        canvas.setPointerCapture?.(e.pointerId);
        redraw();
      }

      function extendStroke(e) {
        if (!drawing || !currentStroke) return;
        e.preventDefault();
        const p = getPos(e);
        currentStroke.points.push(p);
        // 增量绘制当前笔划，减少重绘成本
        ctx.strokeStyle = currentStroke.color;
        ctx.lineWidth = currentStroke.size;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        const pts = currentStroke.points;
        const n = pts.length;
        if (n === 1) return;
        ctx.beginPath();
        ctx.moveTo(pts[n - 2].x, pts[n - 2].y);
        ctx.lineTo(pts[n - 1].x, pts[n - 1].y);
        ctx.stroke();
      }

      function endStroke(e) {
        if (!drawing) return;
        e.preventDefault();
        drawing = false;
        if (currentStroke && currentStroke.points.length > 0) {
          strokes.push(currentStroke);
        }
        currentStroke = null;
      }

      // 事件绑定（PointerEvents优先，兼容触摸/鼠标）
      const supportsPointer = 'PointerEvent' in window;
      if (supportsPointer) {
        canvas.addEventListener('pointerdown', startStroke);
        canvas.addEventListener('pointermove', extendStroke);
        window.addEventListener('pointerup', endStroke);
        window.addEventListener('pointercancel', endStroke);
      } else {
        canvas.addEventListener('mousedown', startStroke);
        window.addEventListener('mousemove', extendStroke);
        window.addEventListener('mouseup', endStroke);
        canvas.addEventListener('touchstart', startStroke, { passive: false });
        window.addEventListener('touchmove', extendStroke, { passive: false });
        window.addEventListener('touchend', endStroke);
        window.addEventListener('touchcancel', endStroke);
      }

      // 工具栏动作
      clearBtn.addEventListener('click', () => {
        strokes.length = 0;
        currentStroke = null;
        redraw();
      });
      undoBtn.addEventListener('click', () => {
        if (drawing) return; // 绘制时不支持撤销
        strokes.pop();
        redraw();
      });
      saveBtn.addEventListener('click', () => {
        // 保存为PNG
        const dataUrl = canvas.toDataURL('image/png');
        const a = document.createElement('a');
        const ts = new Date().toISOString().replace(/[:.]/g, '-');
        a.href = dataUrl;
        a.download = `签名-${ts}.png`;
        document.body.appendChild(a);
        a.click();
        a.remove();
      });

      // 键盘撤回：Ctrl+Z 或 Meta+Z（Mac）
      document.addEventListener('keydown', (e) => {
        const isUndo = (e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z');
        if (!isUndo) return;
        e.preventDefault();
        if (drawing) return; // 绘制进行中不撤回
        strokes.pop();
        redraw();
      });

      // 大小变化时自适应
      const ro = new ResizeObserver(() => resizeCanvas());
      ro.observe(document.querySelector('.canvas-box'));
      window.addEventListener('orientationchange', resizeCanvas);
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();
    });
  </script>
  <style>
    /* 深色模式适配（系统偏好） */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0e12;
        --panel: #0f1318;
        --border: #1f2a37;
        --text: #e6e8eb;
        --accent: #3b82f6;
      }
      .hint { color: #94a3b8; }
      .canvas-box { border-color: #374151; }
    }
  </style>
  <style>
    /* 显式主题（优先于系统偏好）：根据 data-theme 强制浅/深色 */
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f6f7f9;
      --border: #d9dee5;
      --panel: #ffffff;
      --text: #1f2328;
      --accent: #2563eb;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b0e12;
      --panel: #0f1318;
      --border: #1f2a37;
      --text: #e6e8eb;
      --accent: #3b82f6;
    }
    :root[data-theme="dark"] .hint { color: #94a3b8; }
    :root[data-theme="dark"] .canvas-box { border-color: #374151; }
  </style>
  <script>
    // 独立主题切换脚本（与绘图逻辑分离）
    document.addEventListener('DOMContentLoaded', function() {
      var root = document.documentElement;
      var btn = document.getElementById('theme-btn');
      if (!btn) return;
      function apply(theme) {
        root.setAttribute('data-theme', theme);
        try { localStorage.setItem('sigpad-theme', theme); } catch(e) {}
        btn.textContent = theme === 'dark' ? '切换为浅色' : '切换为深色';
      }
      var saved = null;
      try { saved = localStorage.getItem('sigpad-theme'); } catch(e) {}
      var preferredDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      apply(saved ? saved : (preferredDark ? 'dark' : 'light'));
      btn.addEventListener('click', function() {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        apply(next);
      });
    });
  </script>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>电子签名板</h1>
      <div class="spacer"></div>
      <div class="toolbar" aria-label="工具栏">
        <div class="tool">
          <label for="color">画笔颜色</label>
          <input id="color" type="color" value="#111111" />
        </div>
        <div class="tool">
          <label for="size">线宽</label>
          <input id="size" type="range" min="1" max="20" step="1" value="4" />
        </div>
        <div class="tool">
          <label>主题</label>
          <button id="theme-btn" type="button">切换为深色</button>
        </div>
        <div class="buttons">
          <button id="undo" type="button">撤销</button>
          <button id="clear" type="button">清空</button>
          <button id="save" class="primary" type="button">保存PNG</button>
        </div>
      </div>
    </div>

    <div class="canvas-wrap">
      <div class="stage">
        <div class="hint">提示：按住并拖动以签名。支持鼠标、触摸与触控笔。</div>
        <div class="canvas-box">
          <canvas id="pad" aria-label="签名画布"></canvas>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
