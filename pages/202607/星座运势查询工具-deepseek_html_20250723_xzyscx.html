<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星座运势查询工具</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(30, 30, 46, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
            margin-top: 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff9a9e, #fad0c4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .subtitle {
            color: #cbd5e0;
            font-size: 1.1rem;
        }
        
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .select-group {
            display: flex;
            flex-direction: column;
        }
        
        label {
            margin-bottom: 8px;
            font-weight: 500;
            color: #a0aec0;
            display: flex;
            align-items: center;
        }
        
        label i {
            margin-right: 8px;
            color: #ff9a9e;
        }
        
        select {
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(30, 30, 46, 0.9);
            color: #e2e8f0;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ff9a9e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 16px;
        }
        
        select:hover {
            background-color: rgba(40, 40, 60, 0.9);
        }
        
        select:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 154, 158, 0.3);
        }
        
        button {
            grid-column: span 2;
            padding: 14px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(45deg, #ff9a9e, #fad0c4);
            color: #302b63;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(255, 154, 158, 0.4);
        }
        
        .result {
            background: rgba(30, 30, 46, 0.5);
            border-radius: 15px;
            padding: 25px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .result-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .zodiac-icon {
            font-size: 3rem;
            margin-right: 20px;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 154, 158, 0.15);
            border-radius: 12px;
            color: #ff9a9e;
        }
        
        .result-title {
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(45deg, #ff9a9e, #fad0c4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .result-date {
            color: #a0aec0;
            font-size: 0.9rem;
            margin-top: 5px;
        }
        
        .fortune-content {
            line-height: 1.7;
            color: #e2e8f0;
        }
        
        .fortune-category {
            margin-top: 20px;
            padding-left: 15px;
            border-left: 3px solid #ff9a9e;
            background: rgba(255, 154, 158, 0.05);
            border-radius: 0 8px 8px 0;
            padding: 12px 15px;
        }
        
        .category-title {
            font-weight: 600;
            color: #ff9a9e;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        footer {
            margin-top: 40px;
            text-align: center;
            color: #a0aec0;
            font-size: 0.9rem;
            max-width: 800px;
            padding: 0 20px;
        }
        
        @media (max-width: 600px) {
            .controls {
                grid-template-columns: 1fr;
            }
            
            button {
                grid-column: span 1;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-star"></i> 星座运势查询</h1>
            <p class="subtitle">探索你的星座运势，把握每日机遇</p>
        </header>
        
        <div class="controls">
            <div class="select-group">
                <label for="zodiac-sign"><i class="fas fa-user-astronaut"></i> 选择星座</label>
                <select id="zodiac-sign">
                    <option value="aries">白羊座 (3.21-4.19)</option>
                    <option value="taurus">金牛座 (4.20-5.20)</option>
                    <option value="gemini">双子座 (5.21-6.21)</option>
                    <option value="cancer">巨蟹座 (6.22-7.22)</option>
                    <option value="leo">狮子座 (7.23-8.22)</option>
                    <option value="virgo">处女座 (8.23-9.22)</option>
                    <option value="libra">天秤座 (9.23-10.23)</option>
                    <option value="scorpio">天蝎座 (10.24-11.22)</option>
                    <option value="sagittarius">射手座 (11.23-12.21)</option>
                    <option value="capricorn">摩羯座 (12.22-1.19)</option>
                    <option value="aquarius">水瓶座 (1.20-2.18)</option>
                    <option value="pisces">双鱼座 (2.19-3.20)</option>
                </select>
            </div>
            
            <div class="select-group">
                <label for="fortune-type"><i class="fas fa-calendar-alt"></i> 运势类型</label>
                <select id="fortune-type">
                    <option value="today">今日运势</option>
                    <option value="week">本周运势</option>
                    <option value="month">本月运势</option>
                </select>
            </div>
            
            <button id="get-fortune"><i class="fas fa-crystal-ball"></i> 查看运势</button>
        </div>
        
        <div class="result">
            <div class="result-header">
                <div class="zodiac-icon" id="zodiac-icon">♈</div>
                <div>
                    <div class="result-title" id="result-title">白羊座今日运势</div>
                    <div class="result-date" id="result-date">2023年10月27日</div>
                </div>
            </div>
            
            <div class="fortune-content" id="fortune-content">
                <p>今天是你充满活力的一天！火星的能量让你充满动力，适合开始新的项目或挑战。在人际关系方面，你的热情会感染周围的人。</p>
                
                <div class="fortune-category">
                    <div class="category-title"><i class="fas fa-heart"></i> 爱情运势</div>
                    <p>单身的白羊可能会遇到有趣的人，有伴侣的可以计划一次浪漫约会。</p>
                </div>
                
                <div class="fortune-category">
                    <div class="category-title"><i class="fas fa-briefcase"></i> 事业运势</div>
                    <p>工作上有突破的机会，大胆提出你的想法，会得到上司的认可。</p>
                </div>
                
                <div class="fortune-category">
                    <div class="category-title"><i class="fas fa-coins"></i> 财富运势</div>
                    <p>有意外收入的可能，但要注意理性消费。</p>
                </div>
            </div>
        </div>
    </div>
    
    <footer>
        <p>星座运势仅供娱乐参考，生活由你创造 © 2025 星座运势查询工具</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const zodiacSignSelect = document.getElementById('zodiac-sign');
            const fortuneTypeSelect = document.getElementById('fortune-type');
            const getFortuneBtn = document.getElementById('get-fortune');
            const zodiacIcon = document.getElementById('zodiac-icon');
            const resultTitle = document.getElementById('result-title');
            const resultDate = document.getElementById('result-date');
            const fortuneContent = document.getElementById('fortune-content');
            
            // 星座图标映射
            const zodiacIcons = {
                aries: '♈',
                taurus: '♉',
                gemini: '♊',
                cancer: '♋',
                leo: '♌',
                virgo: '♍',
                libra: '♎',
                scorpio: '♏',
                sagittarius: '♐',
                capricorn: '♑',
                aquarius: '♒',
                pisces: '♓'
            };
            
            // 星座名称映射
            const zodiacNames = {
                aries: '白羊座',
                taurus: '金牛座',
                gemini: '双子座',
                cancer: '巨蟹座',
                leo: '狮子座',
                virgo: '处女座',
                libra: '天秤座',
                scorpio: '天蝎座',
                sagittarius: '射手座',
                capricorn: '摩羯座',
                aquarius: '水瓶座',
                pisces: '双鱼座'
            };
            
            // 运势类型映射
            const fortuneTypes = {
                today: '今日',
                week: '本周',
                month: '本月'
            };
            
            // 图标映射
            const categoryIcons = {
                love: 'fas fa-heart',
                career: 'fas fa-briefcase',
                wealth: 'fas fa-coins',
                health: 'fas fa-heartbeat'
            };
            
            // 生成随机运势内容
            function generateFortune(zodiac, type) {
                const fortunes = {
                    love: [
                        "爱情运势旺盛，适合表达心意",
                        "需要多关注伴侣的感受",
                        "单身者有机会遇到特别的人",
                        "关系中将有重要进展",
                        "情感交流变得更加深入",
                        "可能会经历浪漫的邂逅"
                    ],
                    career: [
                        "工作上会有突破性进展",
                        "团队合作是关键",
                        "适合学习新技能提升自己",
                        "可能会面临重要决策",
                        "创意灵感涌现，适合提出新方案",
                        "职业发展迎来新机遇"
                    ],
                    wealth: [
                        "财运平稳，适合储蓄计划",
                        "有意外收入的可能",
                        "投资需谨慎",
                        "消费欲望增强，注意节制",
                        "副业收入可能增加",
                        "适合制定长期财务规划"
                    ],
                    health: [
                        "精力充沛，适合运动",
                        "注意休息，避免过度劳累",
                        "健康状态良好",
                        "需要注意饮食均衡",
                        "适合开始新的健身计划",
                        "心理压力需要适当释放"
                    ],
                    overall: [
                        "整体运势平稳，是规划未来的好时机",
                        "能量充沛，适合挑战自我",
                        "需要保持耐心，好事多磨",
                        "人际关系将成为重点",
                        "直觉敏锐，相信自己的判断",
                        "转变的时机已经到来"
                    ]
                };
                
                const today = new Date();
                const dateStr = `${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日`;
                
                // 星座特性描述
                const zodiacTraits = {
                    aries: "充满活力和冒险精神",
                    taurus: "稳重务实，注重安全感",
                    gemini: "机智灵活，善于沟通",
                    cancer: "情感丰富，直觉敏锐",
                    leo: "自信热情，富有创造力",
                    virgo: "细致认真，追求完美",
                    libra: "追求和谐，善于社交",
                    scorpio: "深沉敏锐，富有魅力",
                    sagittarius: "乐观开朗，热爱自由",
                    capricorn: "目标明确，坚韧不拔",
                    aquarius: "思想独立，富有创新",
                    pisces: "富有同情心，想象力丰富"
                };
                
                // 生成运势内容
                const overallFortune = fortunes.overall[Math.floor(Math.random()*fortunes.overall.length)];
                const zodiacTrait = zodiacTraits[zodiac];
                
                let intro = "";
                if(type === 'today') {
                    intro = `今天对${zodiacNames[zodiac]}来说是${['充满机遇','需要谨慎','积极向上','反思调整'][Math.floor(Math.random()*4)]}的一天。`;
                } else if(type === 'week') {
                    intro = `本周${zodiacNames[zodiac]}将迎来${['重要转折','新的机遇','人际关系提升','自我成长'][Math.floor(Math.random()*4)]}的时期。`;
                } else {
                    intro = `本月${zodiacNames[zodiac]}在${['事业','感情','财务','个人发展'][Math.floor(Math.random()*4)]}领域将有显著进展。`;
                }
                
                let content = `<p>${intro}${zodiacNames[zodiac]}的${zodiacTrait}特质将帮助你应对挑战。${overallFortune}</p>`;
                
                // 添加分类运势
                content += `
                <div class="fortune-category">
                    <div class="category-title"><i class="${categoryIcons.love}"></i> 爱情运势</div>
                    <p>${fortunes.love[Math.floor(Math.random()*fortunes.love.length)]}</p>
                </div>
                
                <div class="fortune-category">
                    <div class="category-title"><i class="${categoryIcons.career}"></i> 事业运势</div>
                    <p>${fortunes.career[Math.floor(Math.random()*fortunes.career.length)]}</p>
                </div>
                
                <div class="fortune-category">
                    <div class="category-title"><i class="${categoryIcons.wealth}"></i> 财富运势</div>
                    <p>${fortunes.wealth[Math.floor(Math.random()*fortunes.wealth.length)]}</p>
                </div>
                
                <div class="fortune-category">
                    <div class="category-title"><i class="${categoryIcons.health}"></i> 健康运势</div>
                    <p>${fortunes.health[Math.floor(Math.random()*fortunes.health.length)]}</p>
                </div>
                `;
                
                return {
                    date: dateStr,
                    content: content
                };
            }
            
            // 更新运势显示
            function updateFortuneDisplay() {
                const zodiac = zodiacSignSelect.value;
                const type = fortuneTypeSelect.value;
                
                // 更新图标和标题
                zodiacIcon.textContent = zodiacIcons[zodiac];
                resultTitle.textContent = `${zodiacNames[zodiac]}${fortuneTypes[type]}运势`;
                
                // 生成并显示运势
                const fortune = generateFortune(zodiac, type);
                resultDate.textContent = fortune.date;
                fortuneContent.innerHTML = fortune.content;
                
                // 添加动画效果
                fortuneContent.style.opacity = 0;
                setTimeout(() => {
                    fortuneContent.style.transition = "opacity 0.5s ease-in-out";
                    fortuneContent.style.opacity = 1;
                }, 10);
            }
            
            // 初始显示
            updateFortuneDisplay();
            
            // 按钮点击事件
            getFortuneBtn.addEventListener('click', updateFortuneDisplay);
            
            // 选择变化时更新
            zodiacSignSelect.addEventListener('change', updateFortuneDisplay);
            fortuneTypeSelect.addEventListener('change', updateFortuneDisplay);
        });
    </script>
</body>
</html>
