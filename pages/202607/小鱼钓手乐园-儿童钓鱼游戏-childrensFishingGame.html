<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小鱼钓手乐园 - 儿童钓鱼游戏</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Marker Felt', 'Arial Rounded MT Bold', sans-serif;
        }
        
        body {
            background: linear-gradient(to bottom, #87CEEB, #1E90FF);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* 修改为顶部对齐 */
            padding: 20px;
            color: #333;
            overflow-x: hidden;
        }
        
        .game-container {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 100, 0.3);
            overflow: hidden;
            position: relative;
        }
        
        .header {
            background: linear-gradient(to right, #FF6B6B, #FF8E53);
            padding: 15px 20px;
            text-align: center;
            color: white;
            position: relative;
        }
        
        .header h1 {
            font-size: 2.2rem; /* 减小字体大小 */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 1rem; /* 减小字体大小 */
            opacity: 0.9;
        }
        
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #4ECDC4;
            padding: 10px 15px; /* 减小内边距 */
            color: white;
            font-weight: bold;
            font-size: 0.9rem; /* 减小字体大小 */
        }
        
        .stats-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 1rem; /* 减小字体大小 */
        }
        
        .game-area {
            display: flex;
            flex-direction: column; /* 移动设备上改为垂直布局 */
        }
        
        .fishing-area {
            flex: 1;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect fill="%23A3D9FF" width="100" height="100"/><circle fill="%2387CEEB" cx="20" cy="20" r="5"/><circle fill="%2387CEEB" cx="50" cy="40" r="7"/><circle fill="%2387CEEB" cx="80" cy="30" r="6"/></svg>');
            position: relative;
            overflow: hidden;
            height: 400px; /* 固定高度 */
            border-bottom: 3px dashed #4ECDC4; /* 添加底部边框 */
        }
        
        .info-area {
            flex: 1;
            padding: 15px; /* 减小内边距 */
            background: #F7F9FC;
            display: flex;
            flex-direction: column;
            gap: 15px; /* 减小间距 */
            max-height: 500px; /* 限制最大高度 */
            overflow-y: auto; /* 添加垂直滚动 */
        }
        
        /* 钓鱼场景元素 */
        .sky {
            height: 40%;
            background: linear-gradient(to bottom, #64B3F4, #87CEEB);
            position: relative;
            overflow: hidden;
        }
        
        .sun {
            position: absolute;
            top: 20px;
            right: 30px;
            width: 50px; /* 减小尺寸 */
            height: 50px; /* 减小尺寸 */
            background: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 20px #FFA500; /* 减小阴影 */
        }
        
        .cloud {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.9;
        }
        
        .cloud-1 { top: 30px; left: 10%; width: 40px; height: 25px; } /* 减小尺寸 */
        .cloud-2 { top: 20px; left: 40%; width: 60px; height: 35px; } /* 减小尺寸 */
        .cloud-3 { top: 40px; left: 70%; width: 50px; height: 30px; } /* 减小尺寸 */
        
        .water {
            height: 60%;
            background: linear-gradient(to bottom, #1E90FF, #00008B);
            position: relative;
            overflow: hidden;
        }
        
        .wave {
            position: absolute;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
        }
        
        .dock {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 180px; /* 减小尺寸 */
            height: 25px; /* 减小尺寸 */
            background: #8B4513;
            border-top-left-radius: 8px; /* 减小圆角 */
            border-top-right-radius: 8px; /* 减小圆角 */
            z-index: 10;
        }
        
        .character {
            position: absolute;
            bottom: 25px; /* 调整位置 */
            left: 50%;
            transform: translateX(-50%);
            width: 50px; /* 减小尺寸 */
            height: 70px; /* 减小尺寸 */
            background: #FF6B6B;
            border-radius: 50% 50% 0 0;
            z-index: 15;
        }
        
        /* 钓鱼元素 */
        .fishing-rod {
            position: absolute;
            bottom: 30px; /* 调整位置 */
            left: 50%;
            width: 3px; /* 减小尺寸 */
            height: 140px; /* 减小尺寸 */
            background: #8B4513;
            transform-origin: bottom center;
            transform: translateX(-50%) rotate(-30deg);
            z-index: 5;
        }
        
        .fishing-line {
            position: absolute;
            bottom: 30px; /* 调整位置 */
            left: 50%;
            width: 2px;
            height: 180px; /* 减小尺寸 */
            background: white;
            transform-origin: bottom center;
            transform: translateX(-50%) rotate(-30deg);
            z-index: 4;
        }
        
        .hook {
            position: absolute;
            bottom: 30px; /* 调整位置 */
            left: 50%;
            transform: translateX(-50%) translateY(180px); /* 调整位置 */
            width: 12px; /* 减小尺寸 */
            height: 12px; /* 减小尺寸 */
            background: silver;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            z-index: 3;
        }
        
        /* 鱼类 */
        .fish {
            position: absolute;
            transition: transform 0.5s;
            z-index: 2;
        }
        
        .clownfish { 
            width: 50px; /* 减小尺寸 */
            height: 25px; /* 减小尺寸 */
            background: linear-gradient(to right, #FF6B6B, #FF8E53);
            border-radius: 50% 15px 15px 50%;
            animation: swim 10s infinite linear;
        }
        
        .pufferfish {
            width: 45px; /* 减小尺寸 */
            height: 45px; /* 减小尺寸 */
            background: radial-gradient(circle, #4A90E2, #1E3F8F);
            border-radius: 50%;
            animation: swim 15s infinite linear;
        }
        
        .rainbowfish {
            width: 60px; /* 减小尺寸 */
            height: 20px; /* 减小尺寸 */
            background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);
            border-radius: 12px;
            animation: swim 8s infinite linear;
        }
        
        .goldfish {
            width: 50px; /* 减小尺寸 */
            height: 30px; /* 减小尺寸 */
            background: radial-gradient(circle, #FFD700, #FFA500);
            border-radius: 50% 20% 20% 50%;
            animation: swim 12s infinite linear;
        }
        
        /* 控制区域 */
        .controls {
            position: absolute;
            bottom: 15px; /* 调整位置 */
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px; /* 减小间距 */
            z-index: 20;
            width: 90%; /* 增加宽度 */
            max-width: 350px; /* 限制最大宽度 */
        }
        
        .btn {
            padding: 12px 25px; /* 减小内边距 */
            font-size: 1.1rem; /* 减小字体大小 */
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            width: 100%; /* 按钮宽度100% */
        }
        
        .btn-cast {
            background: linear-gradient(to right, #FF6B6B, #FF8E53);
            color: white;
        }
        
        .btn-reel {
            background: linear-gradient(to right, #4ECDC4, #2A9D8F);
            color: white;
            display: none;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        .progress-container {
            width: 100%; /* 宽度100% */
            height: 25px; /* 减小高度 */
            background: #e0e0e0;
            border-radius: 12px; /* 减小圆角 */
            overflow: hidden;
            display: none;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(to right, #FF6B6B, #FF8E53);
            width: 0%;
            transition: width 0.1s;
        }
        
        /* 信息区域样式 */
        .panel {
            background: white;
            border-radius: 12px; /* 减小圆角 */
            padding: 12px; /* 减小内边距 */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        
        .panel-title {
            font-size: 1.2rem; /* 减小字体大小 */
            color: #FF6B6B;
            margin-bottom: 12px; /* 减小间距 */
            display: flex;
            align-items: center;
            gap: 8px; /* 减小间距 */
        }
        
        .fish-collection {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); /* 自适应列数 */
            gap: 12px; /* 减小间距 */
        }
        
        .fish-item {
            background: #F0F8FF;
            border-radius: 8px; /* 减小圆角 */
            padding: 8px; /* 减小内边距 */
            text-align: center;
            transition: transform 0.3s;
        }
        
        .fish-item:hover {
            transform: translateY(-5px);
        }
        
        .fish-icon {
            width: 50px; /* 减小尺寸 */
            height: 50px; /* 减小尺寸 */
            margin: 0 auto 8px; /* 减小间距 */
            border-radius: 50%;
        }
        
        .clownfish-icon { background: linear-gradient(to bottom, #FF6B6B, #FF8E53); }
        .pufferfish-icon { background: radial-gradient(circle, #4A90E2, #1E3F8F); }
        .rainbowfish-icon { background: linear-gradient(45deg, #FF0000, #FF7F00, #FFFF00, #00FF00, #0000FF, #4B0082, #8B00FF); }
        .goldfish-icon { background: radial-gradient(circle, #FFD700, #FFA500); }
        
        .fish-name {
            font-weight: bold;
            margin-bottom: 4px; /* 减小间距 */
            font-size: 0.9rem; /* 减小字体大小 */
        }
        
        .upgrades {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px; /* 减小间距 */
        }
        
        .upgrade-item {
            background: #E0F7FA;
            border-radius: 8px; /* 减小圆角 */
            padding: 8px; /* 减小内边距 */
            text-align: center;
        }
        
        .upgrade-icon {
            font-size: 1.8rem; /* 减小尺寸 */
            margin-bottom: 8px; /* 减小间距 */
            color: #4ECDC4;
        }
        
        .btn-upgrade {
            background: #4ECDC4;
            color: white;
            border: none;
            padding: 4px 8px; /* 减小内边距 */
            border-radius: 4px; /* 减小圆角 */
            cursor: pointer;
            font-size: 0.85rem; /* 减小字体大小 */
            margin-top: 5px;
        }
        
        /* 动画 */
        @keyframes swim {
            0% { transform: translateX(-100px); }
            100% { transform: translateX(1000px); }
        }
        
        @keyframes bite {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }
        
        @keyframes splash {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }
        
        /* 响应式设计 - 桌面设备 */
        @media (min-width: 768px) {
            .game-area {
                flex-direction: row; /* 桌面设备上水平布局 */
            }
            
            .fishing-area {
                height: auto;
                min-height: 500px;
                border-right: 3px dashed #4ECDC4; /* 添加右边框 */
                border-bottom: none;
            }
            
            .info-area {
                max-height: 500px; /* 限制最大高度 */
            }
        }
        
        /* 响应式设计 - 小屏幕设备 */
        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.8rem;
            }
            
            .stats-bar {
                flex-direction: column;
                gap: 8px;
            }
            
            .upgrades {
                grid-template-columns: 1fr; /* 小屏幕上单列布局 */
            }
            
            .fishing-area {
                height: 350px; /* 减小高度 */
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1><i class="fas fa-fish"></i> 小鱼钓手乐园</h1>
            <p>抛竿、收线，收集所有鱼儿！</p>
        </div>
        
        <div class="stats-bar">
            <div class="stats-item">
                <i class="fas fa-coins"></i>
                <span id="coins">100</span> 金币
            </div>
            <div class="stats-item">
                <i class="fas fa-trophy"></i>
                已收集 <span id="caught-count">0</span>/10 种鱼儿
            </div>
            <div class="stats-item">
                <i class="fas fa-anchor"></i>
                等级: <span id="level">1</span>
            </div>
        </div>
        
        <div class="game-area">
            <div class="fishing-area">
                <!-- 天空区域 -->
                <div class="sky">
                    <div class="sun"></div>
                    <div class="cloud cloud-1"></div>
                    <div class="cloud cloud-2"></div>
                    <div class="cloud cloud-3"></div>
                </div>
                
                <!-- 水域区域 -->
                <div class="water">
                    <div class="dock"></div>
                    <div class="character"></div>
                    <div class="fishing-rod"></div>
                    <div class="fishing-line"></div>
                    <div class="hook"></div>
                    
                    <!-- 鱼类将通过JS动态添加 -->
                    
                    <!-- 控制区域 -->
                    <div class="controls">
                        <button class="btn btn-cast" id="castBtn">抛竿钓鱼</button>
                        <button class="btn btn-reel" id="reelBtn">快速收线！</button>
                        <div class="progress-container" id="progressContainer">
                            <div class="progress-bar" id="progressBar"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="info-area">
                <div class="panel">
                    <h2 class="panel-title"><i class="fas fa-book"></i> 我的收集图鉴</h2>
                    <div class="fish-collection" id="fishCollection">
                        <!-- 鱼类收集将通过JS动态添加 -->
                    </div>
                </div>
                
                <div class="panel">
                    <h2 class="panel-title"><i class="fas fa-cogs"></i> 升级装备</h2>
                    <div class="upgrades">
                        <div class="upgrade-item">
                            <div class="upgrade-icon"><i class="fas fa-fishing-rod"></i></div>
                            <h3>鱼竿升级</h3>
                            <p>减少等待时间</p>
                            <p>等级: <span id="rod-level">1</span></p>
                            <button class="btn-upgrade" id="upgradeRod">50金币升级</button>
                        </div>
                        <div class="upgrade-item">
                            <div class="upgrade-icon"><i class="fas fa-worm"></i></div>
                            <h3>鱼饵升级</h3>
                            <p>增加稀有鱼概率</p>
                            <p>等级: <span id="bait-level">1</span></p>
                            <button class="btn-upgrade" id="upgradeBait">50金币升级</button>
                        </div>
                    </div>
                </div>
                
                <div class="panel">
                    <h2 class="panel-title"><i class="fas fa-tasks"></i> 今日任务</h2>
                    <ul id="quests">
                        <li><i class="fas fa-check-circle"></i> 钓到5条鱼 - 奖励: 50金币</li>
                        <li><i class="fas fa-circle"></i> 钓到1条彩虹鱼 - 奖励: 闪亮鱼钩皮肤</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 游戏状态
        const gameState = {
            coins: 100,
            caughtFish: [],
            rodLevel: 1,
            baitLevel: 1,
            totalCaught: 0,
            castCount: 0,
            fishTypes: [
                { id: 'clownfish', name: '小丑鱼', rarity: 40, difficulty: 1, color: '#FF6B6B', value: 10 },
                { id: 'pufferfish', name: '蓝刺豚', rarity: 30, difficulty: 2, color: '#4A90E2', value: 20 },
                { id: 'rainbowfish', name: '彩虹鱼', rarity: 20, difficulty: 3, color: 'rainbow', value: 50 },
                { id: 'goldfish', name: '黄金鱼', rarity: 10, difficulty: 2, color: '#FFD700', value: 100 }
            ]
        };

        // DOM 元素
        const castBtn = document.getElementById('castBtn');
        const reelBtn = document.getElementById('reelBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const coinsEl = document.getElementById('coins');
        const caughtCountEl = document.getElementById('caught-count');
        const fishCollectionEl = document.getElementById('fishCollection');
        const rodLevelEl = document.getElementById('rod-level');
        const baitLevelEl = document.getElementById('bait-level');
        const upgradeRodBtn = document.getElementById('upgradeRod');
        const upgradeBaitBtn = document.getElementById('upgradeBait');
        const waterArea = document.querySelector('.water');

        // 初始化游戏
        function initGame() {
            updateUI();
            createFish();
            
            // 添加事件监听
            castBtn.addEventListener('click', startFishing);
            reelBtn.addEventListener('click', reelFish);
            upgradeRodBtn.addEventListener('click', () => upgradeItem('rod'));
            upgradeBaitBtn.addEventListener('click', () => upgradeItem('bait'));
        }

        // 创建游动的鱼
        function createFish() {
            gameState.fishTypes.forEach(fish => {
                const fishEl = document.createElement('div');
                fishEl.className = `fish ${fish.id}`;
                fishEl.dataset.type = fish.id;
                fishEl.style.bottom = `${Math.random() * 30 + 10}%`;
                fishEl.style.animationDuration = `${Math.random() * 10 + 10}s`;
                waterArea.appendChild(fishEl);
            });
        }

        // 开始钓鱼
        function startFishing() {
            castBtn.disabled = true;
            castBtn.textContent = "等待鱼儿上钩...";
            
            // 随机等待时间（根据鱼竿等级减少）
            const baseWaitTime = Math.random() * 5000 + 3000;
            const waitTime = baseWaitTime - (gameState.rodLevel - 1) * 1000;
            
            // 随机选择一种鱼
            const fishType = getRandomFish();
            
            setTimeout(() => {
                fishOnHook(fishType);
            }, waitTime);
        }

        // 随机获取鱼类型（根据鱼饵等级增加稀有鱼概率）
        function getRandomFish() {
            // 每级鱼饵增加1%的稀有鱼概率
            const rarityBonus = gameState.baitLevel - 1;
            
            const totalRarity = gameState.fishTypes.reduce((sum, fish) => sum + fish.rarity, 0);
            let rand = Math.random() * (totalRarity + rarityBonus * 5);
            
            for (const fish of gameState.fishTypes) {
                let adjustedRarity = fish.rarity;
                
                // 为稀有鱼增加额外概率
                if (fish.difficulty >= 3) {
                    adjustedRarity += rarityBonus;
                }
                
                if (rand <= adjustedRarity) {
                    return fish;
                }
                rand -= adjustedRarity;
            }
            
            // 默认返回小丑鱼
            return gameState.fishTypes[0];
        }

        // 鱼儿上钩
        function fishOnHook(fish) {
            // 显示收线按钮
            reelBtn.style.display = "block";
            progressContainer.style.display = "block";
            
            // 创建上钩动画效果
            const hook = document.querySelector('.hook');
            hook.style.animation = "bite 0.5s infinite";
            
            // 创建气泡效果
            createBubbles();
            
            // 设置进度条递减
            let progress = 100;
            progressBar.style.width = `${progress}%`;
            
            const difficulty = fish.difficulty;
            const decreaseSpeed = 100 - (difficulty - 1) * 20; // 难度越高减少越快
            
            const progressInterval = setInterval(() => {
                progress -= 1;
                progressBar.style.width = `${progress}%`;
                
                if (progress <= 0) {
                    clearInterval(progressInterval);
                    fishEscaped();
                }
            }, decreaseSpeed);
            
            // 保存当前鱼的引用
            reelBtn.dataset.fish = JSON.stringify(fish);
            reelBtn.dataset.interval = progressInterval;
        }

        // 创建气泡效果
        function createBubbles() {
            const hook = document.querySelector('.hook');
            const hookRect = hook.getBoundingClientRect();
            
            for (let i = 0; i < 5; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.style.left = `${hookRect.left + 5}px`;
                bubble.style.top = `${hookRect.top}px`;
                bubble.style.width = `${Math.random() * 10 + 5}px`;
                bubble.style.height = bubble.style.width;
                bubble.style.backgroundColor = 'rgba(255, 255, 255, 0.7)';
                bubble.style.borderRadius = '50%';
                bubble.style.position = 'absolute';
                bubble.style.animation = `splash ${Math.random() * 1 + 0.5}s forwards`;
                
                document.body.appendChild(bubble);
                
                // 移除气泡元素
                setTimeout(() => {
                    bubble.remove();
                }, 1000);
            }
        }

        // 收线
        function reelFish() {
            const fish = JSON.parse(reelBtn.dataset.fish);
            clearInterval(parseInt(reelBtn.dataset.interval));
            
            // 成功钓到鱼
            catchFish(fish);
            
            // 重置UI
            resetFishingUI();
        }

        // 鱼儿逃走
        function fishEscaped() {
            // 每3次失败后保证下一次成功
            gameState.castCount++;
            if (gameState.castCount % 3 === 0) {
                setTimeout(() => {
                    alert("别灰心！下一条鱼肯定能钓到！");
                }, 100);
            } else {
                // 创建逃跑效果
                const hook = document.querySelector('.hook');
                hook.style.animation = "";
                
                // 显示逃跑消息
                const message = document.createElement('div');
                message.textContent = "鱼儿逃走了！再试一次！";
                message.style.position = 'absolute';
                message.style.left = '50%';
                message.style.top = '50%';
                message.style.transform = 'translate(-50%, -50%)';
                message.style.color = '#FF6B6B';
                message.style.fontWeight = 'bold';
                message.style.fontSize = '1.5rem';
                message.style.zIndex = '100';
                waterArea.appendChild(message);
                
                setTimeout(() => {
                    message.remove();
                    resetFishingUI();
                }, 1500);
            }
        }

        // 成功钓到鱼
        function catchFish(fish) {
            // 添加鱼到收集
            if (!gameState.caughtFish.includes(fish.id)) {
                gameState.caughtFish.push(fish.id);
            }
            
            // 增加金币
            gameState.coins += fish.value;
            gameState.totalCaught++;
            
            // 更新UI
            updateUI();
            
            // 显示成功消息
            const message = document.createElement('div');
            message.textContent = `钓到 ${fish.name}！+${fish.value}金币`;
            message.style.position = 'absolute';
            message.style.left = '50%';
            message.style.top = '50%';
            message.style.transform = 'translate(-50%, -50%)';
            message.style.color = '#4ECDC4';
            message.style.fontWeight = 'bold';
            message.style.fontSize = '1.5rem';
            message.style.zIndex = '100';
            waterArea.appendChild(message);
            
            // 创建庆祝效果
            createCelebration();
            
            setTimeout(() => {
                message.remove();
            }, 2000);
        }

        // 创建庆祝效果
        function createCelebration() {
            for (let i = 0; i < 20; i++) {
                const spark = document.createElement('div');
                spark.style.position = 'absolute';
                spark.style.left = `${Math.random() * 100}%`;
                spark.style.top = `${Math.random() * 100}%`;
                spark.style.width = '8px';
                spark.style.height = '8px';
                spark.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
                spark.style.borderRadius = '50%';
                spark.style.animation = `splash ${Math.random() * 0.5 + 0.3}s forwards`;
                waterArea.appendChild(spark);
                
                setTimeout(() => {
                    spark.remove();
                }, 500);
            }
        }

        // 重置钓鱼UI
        function resetFishingUI() {
            const hook = document.querySelector('.hook');
            hook.style.animation = "";
            
            reelBtn.style.display = "none";
            progressContainer.style.display = "none";
            progressBar.style.width = "0%";
            
            castBtn.disabled = false;
            castBtn.textContent = "抛竿钓鱼";
        }

        // 升级装备
        function upgradeItem(item) {
            let cost;
            
            if (item === 'rod') {
                cost = gameState.rodLevel * 50;
                if (gameState.coins >= cost) {
                    gameState.coins -= cost;
                    gameState.rodLevel++;
                    rodLevelEl.textContent = gameState.rodLevel;
                } else {
                    alert("金币不足！");
                    return;
                }
            } else if (item === 'bait') {
                cost = gameState.baitLevel * 50;
                if (gameState.coins >= cost) {
                    gameState.coins -= cost;
                    gameState.baitLevel++;
                    baitLevelEl.textContent = gameState.baitLevel;
                } else {
                    alert("金币不足！");
                    return;
                }
            }
            
            updateUI();
        }

        // 更新UI
        function updateUI() {
            coinsEl.textContent = gameState.coins;
            caughtCountEl.textContent = gameState.caughtFish.length;
            
            // 更新鱼类收集
            fishCollectionEl.innerHTML = '';
            gameState.fishTypes.forEach(fish => {
                const isCaught = gameState.caughtFish.includes(fish.id);
                
                const fishItem = document.createElement('div');
                fishItem.className = 'fish-item';
                
                fishItem.innerHTML = `
                    <div class="fish-icon ${fish.id}-icon"></div>
                    <div class="fish-name">${fish.name}</div>
                    <div>${isCaught ? '✓ 已收集' : '? 尚未发现'}</div>
                `;
                
                fishCollectionEl.appendChild(fishItem);
            });
            
            // 更新升级按钮状态
            const rodCost = gameState.rodLevel * 50;
            upgradeRodBtn.textContent = `${rodCost}金币升级`;
            upgradeRodBtn.disabled = gameState.coins < rodCost;
            
            const baitCost = gameState.baitLevel * 50;
            upgradeBaitBtn.textContent = `${baitCost}金币升级`;
            upgradeBaitBtn.disabled = gameState.coins < baitCost;
            
            // 更新任务状态
            const questsEl = document.getElementById('quests');
            questsEl.innerHTML = `
                <li><i class="fas fa-${gameState.totalCaught >= 5 ? 'check' : ''}-circle"></i> 钓到5条鱼 - 奖励: 50金币 ${gameState.totalCaught >= 5 ? '✓' : `(${gameState.totalCaught}/5)`}</li>
                <li><i class="fas fa-${gameState.caughtFish.includes('rainbowfish') ? 'check' : ''}-circle"></i> 钓到1条彩虹鱼 - 奖励: 闪亮鱼钩皮肤 ${gameState.caughtFish.includes('rainbowfish') ? '✓' : ''}</li>
            `;
        }

        // 初始化游戏
        window.onload = initGame;
    </script>
</body>
</html>
