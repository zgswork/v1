<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专业文本差异对比工具</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --accent: #4895ef;
            --light: #f8f9fa;
            --dark: #212529;
            --success: #4cc9f0;
            --danger: #f72585;
            --warning: #f8961e;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 2rem;
            color: var(--dark);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            padding: 2rem;
        }
        
        header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            color: var(--dark);
            opacity: 0.7;
            font-size: 1.1rem;
        }
        
        .comparison-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .text-container {
            position: relative;
        }
        
        .text-container h3 {
            margin-bottom: 0.5rem;
            color: var(--secondary);
            display: flex;
            align-items: center;
        }
        
        .text-container h3 i {
            margin-right: 0.5rem;
            font-size: 1.2rem;
        }
        
        textarea {
            width: 100%;
            height: 300px;
            padding: 1rem;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            resize: vertical;
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            transition: all 0.3s ease;
        }
        
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(72, 149, 239, 0.2);
        }
        
        .button-group {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        button {
            padding: 0.8rem 1.8rem;
            border: none;
            border-radius: 50px;
            font-weight: 500;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .compare-btn {
            background-color: var(--primary);
            color: white;
        }
        
        .clear-btn {
            background-color: var(--light);
            color: var(--dark);
            border: 1px solid #dee2e6;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .compare-btn:hover {
            background-color: var(--secondary);
        }
        
        .clear-btn:hover {
            background-color: #e9ecef;
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .result-container {
            margin-top: 1.5rem;
        }
        
        .result-container h3 {
            margin-bottom: 0.5rem;
            color: var(--secondary);
        }
        
        .diff-result {
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 1rem;
            background-color: white;
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .added {
            background-color: rgba(76, 201, 240, 0.3);
            padding: 0.1rem 0.2rem;
            border-radius: 3px;
            position: relative;
        }
        
        .added::before {
            content: '+ ';
            color: #1b9aaa;
        }
        
        .removed {
            background-color: rgba(247, 37, 133, 0.2);
            padding: 0.1rem 0.2rem;
            border-radius: 3px;
            position: relative;
            text-decoration: line-through;
        }
        
        .removed::before {
            content: '- ';
            color: #d90429;
        }
        
        .file-types {
            margin-top: 2rem;
            padding: 1rem;
            background-color: rgba(67, 97, 238, 0.05);
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }
        
        .file-types h3 {
            color: var(--primary);
            margin-bottom: 0.5rem;
        }
        
        .file-types ul {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 0.5rem;
            list-style-type: none;
        }
        
        .file-types li {
            padding: 0.3rem 0.5rem;
            background-color: rgba(72, 149, 239, 0.1);
            border-radius: 4px;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .comparison-area {
                grid-template-columns: 1fr;
            }
            
            .file-types ul {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
        
        /* 动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .container {
            animation: fadeIn 0.5s ease-out;
        }
        
        button {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        
        /* 加载动画 */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本差异对比工具</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .text-areas {
            display: flex;
            gap: 20px;
        }
        textarea {
            width: 100%;
            height: 300px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        .diff-result {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 4px;
            background-color: #f9f9f9;
            white-space: pre-wrap;
        }
        .added {
            background-color: #a6f3a6;
            text-decoration: underline;
        }
        .removed {
            background-color: #f8cbcb;
            text-decoration: line-through;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>专业文本差异对比工具</h1>
            <p class="subtitle">快速识别文本差异，支持多种文件格式对比</p>
        </header>
        
        <div class="comparison-area">
            <div class="text-container">
                <h3><i>📄</i> 原始文本</h3>
                <textarea id="text1" placeholder="在此输入原始文本、代码或粘贴文件内容..."></textarea>
            </div>
            
            <div class="text-container">
                <h3><i>✏️</i> 修改文本</h3>
                <textarea id="text2" placeholder="在此输入修改后的文本、代码或粘贴文件内容..."></textarea>
            </div>
        </div>
        
        <div class="button-group">
            <button class="compare-btn" onclick="compareTexts()">
                <span class="spinner" id="spinner"></span>
                <span>对比差异</span>
            </button>
            <button class="clear-btn" onclick="clearTexts()">
                <span>清除内容</span>
            </button>
        </div>
        
        <div class="result-container">
            <h3><i>🔍</i> 差异结果</h3>
            <div class="diff-result" id="diffResult">对比结果将显示在这里...</div>
        </div>
        
        <div class="file-types">
            <h3><i>📂</i> 支持对比的文件类型</h3>
            <ul>
                <li>代码文件 (.js, .py, .java)</li>
                <li>文本文档 (.txt, .md)</li>
                <li>配置文件 (.json, .xml, .yaml)</li>
                <li>HTML/CSS 文件</li>
                <li>合同文档 (.docx, .pdf)</li>
                <li>SQL 查询文件</li>
                <li>日志文件 (.log)</li>
                <li>CSV/Excel 数据</li>
            </ul>
        </div>
    </div>

    <script>
        function compareTexts() {
            const text1 = document.getElementById('text1').value;
            const text2 = document.getElementById('text2').value;
            const spinner = document.getElementById('spinner');
            const compareBtn = document.querySelector('.compare-btn');
            
            if (!text1 || !text2) {
                alert('请输入两段文本进行对比');
                return;
            }
            
            // 显示加载动画
            spinner.style.display = 'inline-block';
            compareBtn.disabled = true;
            
            // 模拟处理延迟
            setTimeout(() => {
                const diffResult = document.getElementById('diffResult');
                diffResult.innerHTML = '';
                
                // 改进的逐行对比算法
                const lines1 = text1.split('\n');
                const lines2 = text2.split('\n');
                
                const maxLines = Math.max(lines1.length, lines2.length);
                let resultHtml = '';
                
                for (let i = 0; i < maxLines; i++) {
                    const line1 = lines1[i] || '';
                    const line2 = lines2[i] || '';
                    
                    if (line1 === line2) {
                        resultHtml += line1 + '\n';
                    } else {
                        // 高亮显示差异部分
                        if (line1) {
                            resultHtml += `<span class="removed">${line1}</span>\n`;
                        }
                        if (line2) {
                            resultHtml += `<span class="added">${line2}</span>\n`;
                        }
                    }
                }
                
                diffResult.innerHTML = resultHtml || '<em>没有发现差异</em>';
                
                // 隐藏加载动画
                spinner.style.display = 'none';
                compareBtn.disabled = false;
                
                // 滚动到结果区域
                diffResult.scrollIntoView({ behavior: 'smooth' });
            }, 500);
        }
        
        function clearTexts() {
            document.getElementById('text1').value = '';
            document.getElementById('text2').value = '';
            document.getElementById('diffResult').innerHTML = '对比结果将显示在这里...';
        }
    </script>
</body>
</html>
</body>
</html>
