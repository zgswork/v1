<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本大小写转换工具</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(90deg, #4776E6 0%, #8E54E9 100%);
            color: white;
            padding: 25px 30px;
            text-align: center;
            position: relative;
        }
        
        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .subtitle {
            font-size: 1rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .content {
            display: flex;
            flex-wrap: wrap;
            padding: 25px;
        }
        
        .input-section, .output-section {
            flex: 1;
            min-width: 300px;
            padding: 20px;
        }
        
        .divider {
            width: 1px;
            background: #e0e0e0;
            margin: 0 20px;
        }
        
        @media (max-width: 768px) {
            .divider {
                width: 100%;
                height: 1px;
                margin: 10px 0;
            }
        }
        
        .section-title {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #4776E6;
            display: flex;
            align-items: center;
        }
        
        .section-title i {
            margin-right: 10px;
        }
        
        textarea {
            width: 100%;
            height: 180px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            resize: vertical;
            transition: all 0.3s ease;
        }
        
        textarea:focus {
            outline: none;
            border-color: #4776E6;
            box-shadow: 0 0 0 3px rgba(71, 118, 230, 0.2);
        }
        
        .controls {
            margin: 20px 0;
        }
        
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .control-btn {
            padding: 12px 15px;
            background: #f5f7ff;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #555;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        
        .control-btn:hover {
            background: #eef2ff;
            border-color: #b3c3ff;
        }
        
        .control-btn.active {
            background: #4776E6;
            color: white;
            border-color: #4776E6;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        
        .btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .btn i {
            margin-right: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(90deg, #4776E6 0%, #5e8af0 100%);
            color: white;
        }
        
        .btn-primary:hover {
            background: linear-gradient(90deg, #3a68d1 0%, #4d7aec 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(71, 118, 230, 0.4);
        }
        
        .btn-secondary {
            background: #f5f7ff;
            color: #4776E6;
            border: 2px solid #e0e0e0;
        }
        
        .btn-secondary:hover {
            background: #eef2ff;
            border-color: #b3c3ff;
        }
        
        .result-container {
            position: relative;
        }
        
        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.8);
            border: none;
            border-radius: 5px;
            padding: 8px 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #4776E6;
            font-size: 0.9rem;
        }
        
        .copy-btn:hover {
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .history-section {
            margin-top: 30px;
            padding: 20px;
            background: #f9faff;
            border-radius: 15px;
        }
        
        .history-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .history-items {
            max-height: 200px;
            overflow-y: auto;
            padding-right: 10px;
        }
        
        .history-item {
            background: white;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #4776E6;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .history-text {
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        
        .history-actions {
            display: flex;
            gap: 10px;
        }
        
        .history-actions button {
            background: none;
            border: none;
            color: #777;
            cursor: pointer;
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        
        .history-actions button:hover {
            color: #4776E6;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 0.9rem;
            background: #f5f7ff;
        }
        
        .notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #4CAF50;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            animation: fadeInOut 3s ease-in-out;
            display: none;
        }
        
        @keyframes fadeInOut {
            0%, 100% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            10%, 90% { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        
        .char-count {
            text-align: right;
            margin-top: 5px;
            font-size: 0.85rem;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>文本大小写转换工具</h1>
            <p class="subtitle">快速将文本转换为大写、小写、首字母大写、句子大小写、标题大小写等多种格式</p>
        </header>
        
        <div class="content">
            <div class="input-section">
                <h2 class="section-title"><i class="fas fa-keyboard"></i> 输入文本</h2>
                <textarea id="inputText" placeholder="在此输入要转换的文本...">Convert this text to different cases. this tool is useful for programmers and content creators. try it now!</textarea>
                <div class="char-count">字符数: <span id="charCount">0</span></div>
                
                <div class="controls">
                    <h2 class="section-title"><i class="fas fa-sliders-h"></i> 转换选项</h2>
                    <div class="controls-grid">
                        <div class="control-btn active" data-type="upper">大写转换</div>
                        <div class="control-btn" data-type="lower">小写转换</div>
                        <div class="control-btn" data-type="sentence">句子大小写</div>
                        <div class="control-btn" data-type="title">标题大小写</div>
                        <div class="control-btn" data-type="capitalize">首字母大写</div>
                        <div class="control-btn" data-type="invert">大小写反转</div>
                        <div class="control-btn" data-type="alternating">大小写交替</div>
                        <div class="control-btn" data-type="random">随机大小写</div>
                    </div>
                    
                    <div class="action-buttons">
                        <button class="btn btn-primary" id="convertBtn">
                            <i class="fas fa-sync-alt"></i> 转换文本
                        </button>
                        <button class="btn btn-secondary" id="clearBtn">
                            <i class="fas fa-eraser"></i> 清除文本
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="divider"></div>
            
            <div class="output-section">
                <h2 class="section-title"><i class="fas fa-file-alt"></i> 转换结果</h2>
                <div class="result-container">
                    <textarea id="outputText" placeholder="转换结果将显示在这里..." readonly></textarea>
                    <button class="copy-btn" id="copyBtn">
                        <i class="fas fa-copy"></i> 复制结果
                    </button>
                </div>
                
                <div class="history-section">
                    <div class="history-title">
                        <h2 class="section-title"><i class="fas fa-history"></i> 转换历史</h2>
                        <button id="clearHistory" class="btn btn-secondary" style="padding: 8px 15px; font-size: 0.9rem;">清除历史</button>
                    </div>
                    <div class="history-items" id="historyItems">
                        <!-- 历史记录将通过JS动态添加 -->
                    </div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>文本大小写转换工具 &copy; 2023 | 完全免费，无需注册</p>
        </footer>
    </div>
    
    <div class="notification" id="notification">结果已复制到剪贴板！</div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const inputText = document.getElementById('inputText');
            const outputText = document.getElementById('outputText');
            const convertBtn = document.getElementById('convertBtn');
            const clearBtn = document.getElementById('clearBtn');
            const copyBtn = document.getElementById('copyBtn');
            const charCount = document.getElementById('charCount');
            const clearHistoryBtn = document.getElementById('clearHistory');
            const historyItems = document.getElementById('historyItems');
            const notification = document.getElementById('notification');
            const controlBtns = document.querySelectorAll('.control-btn');
            
            let conversionHistory = JSON.parse(localStorage.getItem('caseConversionHistory')) || [];
            let currentConversionType = 'upper';
            
            // 初始化
            updateCharCount();
            renderHistory();
            
            // 事件监听器
            inputText.addEventListener('input', updateCharCount);
            convertBtn.addEventListener('click', convertText);
            clearBtn.addEventListener('click', clearInput);
            copyBtn.addEventListener('click', copyResult);
            clearHistoryBtn.addEventListener('click', clearHistory);
            
            // 为转换选项添加事件监听器
            controlBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    controlBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentConversionType = this.dataset.type;
                    convertText();
                });
            });
            
            // 更新字符计数
            function updateCharCount() {
                charCount.textContent = inputText.value.length;
            }
            
            // 转换文本
            function convertText() {
                const text = inputText.value.trim();
                if (!text) {
                    outputText.value = '';
                    return;
                }
                
                let result = '';
                
                switch(currentConversionType) {
                    case 'upper':
                        result = text.toUpperCase();
                        break;
                    case 'lower':
                        result = text.toLowerCase();
                        break;
                    case 'sentence':
                        result = text.toLowerCase().replace(/(^\s*\w|[.!?]\s+\w)/g, c => c.toUpperCase());
                        break;
                    case 'title':
                        result = text.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
                        break;
                    case 'capitalize':
                        result = text.toLowerCase();
                        result = result.charAt(0).toUpperCase() + result.slice(1);
                        break;
                    case 'invert':
                        result = text.split('').map(c => 
                            c === c.toUpperCase() ? c.toLowerCase() : c.toUpperCase()
                        ).join('');
                        break;
                    case 'alternating':
                        result = text.split('').map((c, i) => 
                            i % 2 === 0 ? c.toLowerCase() : c.toUpperCase()
                        ).join('');
                        break;
                    case 'random':
                        result = text.split('').map(c => 
                            Math.random() > 0.5 ? c.toUpperCase() : c.toLowerCase()
                        ).join('');
                        break;
                    default:
                        result = text;
                }
                
                outputText.value = result;
                
                // 保存到历史记录
                saveToHistory(text, result, currentConversionType);
            }
            
            // 保存到历史记录
            function saveToHistory(original, converted, type) {
                const timestamp = new Date().toLocaleString();
                const historyItem = {
                    original,
                    converted,
                    type,
                    timestamp
                };
                
                // 添加到历史记录数组
                conversionHistory.unshift(historyItem);
                
                // 限制历史记录数量
                if (conversionHistory.length > 10) {
                    conversionHistory = conversionHistory.slice(0, 10);
                }
                
                // 保存到localStorage
                localStorage.setItem('caseConversionHistory', JSON.stringify(conversionHistory));
                
                // 重新渲染历史记录
                renderHistory();
            }
            
            // 渲染历史记录
            function renderHistory() {
                historyItems.innerHTML = '';
                
                if (conversionHistory.length === 0) {
                    historyItems.innerHTML = '<div class="history-item">暂无历史记录</div>';
                    return;
                }
                
                conversionHistory.forEach((item, index) => {
                    const historyItem = document.createElement('div');
                    historyItem.className = 'history-item';
                    
                    const typeNames = {
                        'upper': '大写',
                        'lower': '小写',
                        'sentence': '句子大小写',
                        'title': '标题大小写',
                        'capitalize': '首字母大写',
                        'invert': '大小写反转',
                        'alternating': '大小写交替',
                        'random': '随机大小写'
                    };
                    
                    historyItem.innerHTML = `
                        <div class="history-text" title="${item.original}">
                            <strong>${typeNames[item.type]}</strong>: ${item.converted.substring(0, 40)}${item.converted.length > 40 ? '...' : ''}
                        </div>
                        <div class="history-actions">
                            <button class="use-history" data-index="${index}" title="使用此结果">
                                <i class="fas fa-redo"></i>
                            </button>
                            <button class="remove-history" data-index="${index}" title="删除">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    `;
                    
                    historyItems.appendChild(historyItem);
                });
                
                // 为历史记录按钮添加事件监听器
                document.querySelectorAll('.use-history').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const index = this.dataset.index;
                        const historyItem = conversionHistory[index];
                        inputText.value = historyItem.original;
                        outputText.value = historyItem.converted;
                        updateCharCount();
                        
                        // 激活相应的转换类型按钮
                        controlBtns.forEach(b => b.classList.remove('active'));
                        const activeBtn = document.querySelector(`.control-btn[data-type="${historyItem.type}"]`);
                        if (activeBtn) activeBtn.classList.add('active');
                        currentConversionType = historyItem.type;
                    });
                });
                
                document.querySelectorAll('.remove-history').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const index = this.dataset.index;
                        conversionHistory.splice(index, 1);
                        localStorage.setItem('caseConversionHistory', JSON.stringify(conversionHistory));
                        renderHistory();
                    });
                });
            }
            
            // 清除输入
            function clearInput() {
                inputText.value = '';
                outputText.value = '';
                updateCharCount();
                inputText.focus();
            }
            
            // 复制结果
            function copyResult() {
                if (!outputText.value) return;
                
                outputText.select();
                document.execCommand('copy');
                
                // 显示通知
                notification.style.display = 'block';
                setTimeout(() => {
                    notification.style.display = 'none';
                }, 3000);
            }
            
            // 清除历史记录
            function clearHistory() {
                if (conversionHistory.length === 0) return;
                
                if (confirm('确定要清除所有历史记录吗？')) {
                    conversionHistory = [];
                    localStorage.removeItem('caseConversionHistory');
                    renderHistory();
                }
            }
            
            // 初始转换
            convertText();
        });
    </script>
</body>
</html>
