<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四季养生茶饮推荐工具</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f9f7f3;
            color: #333;
            position: relative;
        }
        .author-info {
            position: absolute;
            top: 15px;
            left: 20px;
            /* Changed font-size from 12px to 14px */
            font-size: 14px; 
            color: #888;
        }
        .container {
            max-width: 800px;
            margin: 50px auto 20px auto; /* Increased top margin for author info */
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #4a7c59;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        input[type="datetime-local"], input[type="number"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        /* Hide number input arrows */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
          -webkit-appearance: none; 
          margin: 0; 
        }
        input[type=number] {
          -moz-appearance: textfield;
        }
        button {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #4a7c59;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #3b6247;
        }
        #result {
            margin-top: 30px;
            padding: 20px;
            background-color: #e8f5e9;
            border-left: 5px solid #4a7c59;
            border-radius: 5px;
            display: none; /* Initially hidden */
        }
        #result h2 {
            margin-top: 0;
            color: #2e7d32;
        }
         #result p {
            margin-bottom: 10px;
        }
        .citation {
            font-size: 0.8em;
            color: #757575;
        }
        /* Responsive Design */
        @media (max-width: 600px) {
            .container {
                padding: 15px;
                margin-top: 70px; /* Adjust for author info on mobile */
            }
            .author-info {
                top: 15px;
                left: 0;
                width: 100%;
                text-align: center;
            }
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="author-info">
        作者：acid5 | 合作邮箱：<a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="695b5c585b5e59595850291818470a0604">[email&#160;protected]</a>
    </div>

    <div class="container">
        <h1>四季养生茶饮推荐</h1>
        <p>本工具将根据您输入的季节、年龄、性别和体质，为您推荐适合的茶饮及最佳饮用时间，助您科学养生。</p>
        <div class="form-group">
            <label for="datetime">请选择当前日期和时间：</label>
            <input type="datetime-local" id="datetime" name="datetime" required>
        </div>
        <div class="form-group">
            <label for="age">您的年龄：</label>
            <input type="number" id="age" name="age" placeholder="请输入您的年龄" required min="1">
        </div>
        <div class="form-group">
            <label for="gender">您的性别：</label>
            <select id="gender" name="gender">
                <option value="male">男</option>
                <option value="female">女</option>
            </select>
        </div>
        <div class="form-group">
            <label for="constitution">您的体质类型：</label>
            <select id="constitution" name="constitution">
                <option value="平和质">平和质 (精力充沛，适应能力强)</option>
                <option value="气虚质">气虚质 (易疲劳，气短懒言)</option>
                <option value="阳虚质">阳虚质 (畏寒怕冷，手足不温)</option>
                <option value="阴虚质">阴虚质 (手足心热，口干咽燥)</option>
                <option value="痰湿质">痰湿质 (体型肥胖，痰多，易困倦)</option>
                <option value="湿热质">湿热质 (面部油光，易生粉刺，口苦)</option>
                <option value="血瘀质">血瘀质 (面色晦暗，皮肤易出现瘀斑)</option>
                <option value="气郁质">气郁质 (情绪不稳定，多愁善感)</option>
                <option value="特禀质">特禀质 (过敏体质)</option>
            </select>
        </div>
        <button onclick="getRecommendation()">获取推荐</button>
        <div id="result"></div>
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // Set default datetime to current time
        document.addEventListener('DOMContentLoaded', (event) => {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('datetime').value = now.toISOString().slice(0,16);
        });

        function getRecommendation() {
            const datetimeInput = document.getElementById('datetime').value;
            const age = document.getElementById('age').value;
            const gender = document.getElementById('gender').value;
            const constitution = document.getElementById('constitution').value;
            const resultDiv = document.getElementById('result');

            if (!datetimeInput || !age) {
                alert('请输入完整的日期、时间和年龄！');
                return;
            }
            if (age <= 0) {
                alert('请输入有效的年龄！');
                return;
            }

            const date = new Date(datetimeInput);
            const month = date.getMonth() + 1; // getMonth() is zero-based
            const hour = date.getHours();

            let season = '';
            if (month >= 3 && month <= 5) {
                season = '春季';
            } else if (month >= 6 && month <= 8) {
                season = '夏季';
            } else if (month >= 9 && month <= 11) {
                season = '秋季';
            } else {
                season = '冬季';
            }

            let teaRecommendation = '';
            let teaReason = '';
            let bestTime = '';
            let timeReason = '';
            let notes = '';

            // --- Primary recommendation based on season and constitution ---
            // This logic remains the same as before to get a baseline
            switch (season) {
                case '春季':
                    teaRecommendation = '花茶 (如茉莉花茶、玫瑰花茶)';
                    teaReason = '春季万物生发，阳气始升，宜饮花茶以疏散冬季积存的寒气，并能提神醒脑，理气解郁。';
                    break;
                case '夏季':
                    teaRecommendation = '绿茶或白茶';
                    teaReason = '夏季天气炎热，人体消耗大，绿茶和白茶性凉，能清热解暑、生津止渴，是夏季的理想饮品。';
                    break;
                case '秋季':
                    teaRecommendation = '乌龙茶 (青茶)';
                    teaReason = '秋季气候干燥，易有“秋燥”。乌龙茶性温和，介于红茶与绿茶之间，能润肤、生津、除燥，帮助身体适应自然界的变化。';
                    break;
                case '冬季':
                    teaRecommendation = '红茶或普洱熟茶';
                    teaReason = '冬季寒冷，阳气闭藏，红茶和普洱熟茶性温，可以暖胃驱寒，促进消化，增强人体的抗寒能力。';
                    break;
            }

            switch (constitution) {
                case '气虚质':
                    teaRecommendation = '普洱熟茶、红茶';
                    teaReason = '气虚质者易疲劳，应饮用性温的茶来补气健脾。普洱熟茶和红茶性质温和，是不错的选择。';
                    notes = '可适量搭配黄芪、党参同饮，以增强补气效果。';
                    break;
                case '阳虚质':
                    teaRecommendation = '红茶、黑茶 (如普洱熟茶)';
                    teaReason = '阳虚质者畏寒怕冷，需要温阳散寒。红茶和黑茶是温性茶，能有效暖胃驱寒。';
                    notes = '可在茶中加入几片生姜，增强暖身效果。';
                    break;
                case '阴虚质':
                    teaRecommendation = '绿茶、白茶、黄茶';
                    teaReason = '阴虚质者内热，应饮用凉性茶来滋阴降火。绿茶、白茶、黄茶都是不错的选择。';
                    notes = '可搭配枸杞、麦冬同饮，以增强养阴生津的功效。';
                    break;
                case '痰湿质':
                    teaRecommendation = '陈皮普洱茶、老乌龙茶';
                    teaReason = '痰湿质者体内湿气重，应选择有助于健脾祛湿、理气化痰的茶饮。';
                    break;
                case '湿热质':
                    teaRecommendation = '绿茶、白茶、苦丁茶';
                    teaReason = '湿热质者体内湿热蕴结，适宜饮用绿茶、白茶等凉性茶，以清热利湿。';
                    break;
                case '血瘀质':
                    teaRecommendation = '红茶 (若体质偏寒) 或 绿茶 (若体质偏热)';
                    teaReason = '血瘀质的调理重在活血化瘀。如果怕冷，属寒凝血瘀，可选红茶；如果体热，可选绿茶。玫瑰花茶也有很好的活血作用。';
                    break;
                case '气郁质':
                    teaRecommendation = '玫瑰花茶、茉莉花茶';
                    teaReason = '气郁质者常情绪不畅，花茶芬芳怡人，能疏肝理气、解郁安神，是最佳选择。';
                    break;
                case '特禀质':
                    teaRecommendation = '经过发酵的红茶或普洱熟茶';
                    teaReason = '过敏体质者饮茶需谨慎，应避免未发酵或轻发酵的茶。可尝试从温和的发酵茶开始，如红茶或普洱熟茶。';
                    notes = '初次饮用请少量尝试，观察身体反应。';
                    break;
                case '平和质':
                    notes = '您是健康的平和体质，适应性强，主要根据季节选择茶饮即可。';
                    break;
            }
            
            // --- Refine recommendations based on AGE ---
            let ageNotes = '';
            if (age < 18) {
                ageNotes = '青少年脏腑娇嫩，不宜饮浓茶。建议饮用较淡的茶水，或选择不含咖啡因的花草茶，以免影响生长发育和睡眠。';
            } else if (age >= 60) {
                // For elderly, prioritize warm and gentle teas
                teaRecommendation = '红茶或普洱熟茶';
                teaReason = '老年人脾胃功能相对较弱，宜选择红茶、普洱熟茶等性情温和、经过发酵的茶，有助于暖胃、助消化，且对肠胃刺激小。';
                ageNotes = '建议饮用温热的淡茶，避免饮用过浓、过烫或凉性的茶，以免增加身体负担。晚间饮茶需谨慎，以免影响睡眠。';
            } else { // 18-59
                ageNotes = '中青年人群可根据季节与自身体质选择多样化的茶饮，以达养生保健之效。';
            }
            notes = ageNotes + ' ' + notes; // Prepend age notes

            // --- Gender-specific adjustments ---
            if (gender === 'female') {
                notes += ' 女性朋友可多尝试玫瑰花茶、红枣桂圆茶等，有助美容养颜、调理气血。特殊时期（经期、孕期、哺乳期）请咨询医生建议，避免饮用浓茶和凉性茶。';
            } else {
                 notes += ' 男性朋友饮用绿茶或乌龙茶，有助于提神醒脑、保护肝脏。';
            }

            // --- Best time to drink tea ---
            if (hour >= 9 && hour < 11) {
                bestTime = '上午 (9:00 - 11:00)';
                timeReason = '当前时间正适合饮用早茶。早饭后一小时饮茶，可以提神醒脑，开启活力满满的一天。';
            } else if (hour >= 13 && hour < 16) {
                bestTime = '下午 (13:00 - 16:00)';
                timeReason = '当前时间是午后茶歇的黄金时段。午饭后一小时饮茶，有助于降血脂、助消化，并能缓解午后的困顿。';
            } else if (hour >= 18 && hour < 20) {
                bestTime = '晚上 (18:00 - 20:00)';
                timeReason = '此时适合饮用晚茶。推荐饮用性情温和、咖啡因较低的红茶，有助于消食去腻，且对睡眠影响较小。';
            } else if (hour >= 20 || hour < 7) {
                 bestTime = '不推荐的饮茶时间';
                 timeReason = '为了保证良好的睡眠质量，晚上8点后不建议饮茶。早上空腹饮茶也可能刺激肠胃。';
            } else {
                bestTime = '任意时段 (避开饭前饭后半小时)';
                timeReason = '当前时间段饮茶亦可，但请注意避免空腹、饭后立即饮茶，以免影响消化。';
            }

            // --- Display final result ---
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `
                <h2>您的专属茶饮推荐</h2>
                <p><strong>综合分析：</strong>根据您选择的时间 (${season})、年龄 (${age}岁)、性别 (${gender === 'female' ? '女' : '男'}) 和体质 (${constitution})，我们为您做出以下推荐。</p>
                <p><strong>推荐茶饮：</strong><span style="font-size: 1.2em; color: #d32f2f; font-weight: bold;">${teaRecommendation}</span></p>
                <p><strong>推荐理由：</strong>${teaReason}</p>
                <p><strong>最佳饮茶时间：</strong>${bestTime}</p>
                <p><strong>时间建议：</strong>${timeReason}</p>
                <p><strong>温馨提示：</strong>${notes}</p>
                <p class="citation">请注意：本推荐仅供参考，不能替代专业医疗建议。</p>
            `;
        }
    </script>

</body>
</html>
