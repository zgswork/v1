<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能图片切割工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(135deg, #FFD89B 0%, #19547B 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .header h1 {
            color: white;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            font-weight: 700;
        }

        .header p {
            color: rgba(255,255,255,0.8);
            font-size: 1.1em;
        }

        .language-selector {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .language-selector label {
            color: rgba(255,255,255,0.9);
            font-size: 0.9em;
            font-weight: 500;
        }

        .language-select {
            background: rgba(255,255,255,0.9);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            padding: 5px 10px;
            font-size: 0.9em;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .language-select:hover {
            background: white;
            border-color: #4f46e5;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
        }

        .language-select:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .upload-area {
            background: linear-gradient(145deg, #ffffff 0%, #f8f9ff 100%);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1), 0 5px 15px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .upload-area:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.15), 0 10px 25px rgba(0,0,0,0.1);
        }

        .upload-box {
            border: 3px dashed #e0e6ff;
            border-radius: 15px;
            padding: 60px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            background: linear-gradient(145deg, #f8f9ff 0%, #ffffff 100%);
        }

        .upload-box:hover {
            border-color: #4f46e5;
            background: linear-gradient(145deg, #eef2ff 0%, #e0e7ff 100%);
            transform: scale(1.02);
        }

        .upload-box.dragover {
            border-color: #4f46e5;
            background: linear-gradient(145deg, #ddd6fe 0%, #c7d2fe 100%);
            transform: scale(1.05);
        }

        .upload-icon {
            font-size: 4em;
            color: #a5b4fc;
            margin-bottom: 20px;
        }

        .upload-text {
            font-size: 1.2em;
            color: #4338ca;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .upload-hint {
            font-size: 0.9em;
            color: #6b7280;
        }

        #fileInput {
            display: none;
        }

        .preview-section {
            background: linear-gradient(145deg, #ffffff 0%, #f8f9ff 100%);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1), 0 5px 15px rgba(0,0,0,0.05);
            display: none;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .preview-title {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #1e293b;
            text-align: center;
            font-weight: 700;
        }

        .original-preview {
            text-align: center;
            margin-bottom: 30px;
        }

        .original-image {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .action-buttons {
            text-align: center;
            margin: 20px 0;
        }

        .btn {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 1em;
            cursor: pointer;
            margin: 0 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
            font-weight: 600;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.4);
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        }

        .btn:disabled {
            background: linear-gradient(135deg, #d1d5db 0%, #9ca3af 100%);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .grid-preview {
            display: grid;
            gap: 10px;
            margin-top: 20px;
        }

        .grid-preview.grid-1x2, .grid-preview.grid-1x3, .grid-preview.grid-1x4, .grid-preview.grid-1x5, .grid-preview.grid-1x6 {
            grid-template-columns: 1fr;
        }

        .grid-preview.grid-2x1, .grid-preview.grid-2x2, .grid-preview.grid-2x3 {
            grid-template-columns: repeat(2, 1fr);
        }

        .grid-preview.grid-3x1, .grid-preview.grid-3x2, .grid-preview.grid-3x3, .grid-preview.grid-3x4 {
            grid-template-columns: repeat(3, 1fr);
        }

        .grid-preview.grid-4x1, .grid-preview.grid-4x2, .grid-preview.grid-4x3, .grid-preview.grid-4x4, .grid-preview.grid-4x5, .grid-preview.grid-4x6 {
            grid-template-columns: repeat(4, 1fr);
        }

        .grid-preview.grid-5x1, .grid-preview.grid-5x2, .grid-preview.grid-5x3, .grid-preview.grid-5x4, .grid-preview.grid-5x5 {
            grid-template-columns: repeat(5, 1fr);
        }

        .grid-preview.grid-6x1, .grid-preview.grid-6x2, .grid-preview.grid-6x3, .grid-preview.grid-6x4, .grid-preview.grid-6x5, .grid-preview.grid-6x6 {
            grid-template-columns: repeat(6, 1fr);
        }

        .grid-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .grid-item:hover {
            transform: scale(1.05);
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .grid-item .index {
            position: absolute;
            top: 5px;
            left: 5px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.8em;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #f0f0f0;
            border-radius: 3px;
            overflow: hidden;
            margin: 20px 0;
            display: none;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 3px;
        }

        .status-text {
            text-align: center;
            color: #4338ca;
            margin: 10px 0;
            display: none;
            font-weight: 500;
        }

        .cut-options {
            background: linear-gradient(145deg, #f8f9ff 0%, #ffffff 100%);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(79, 70, 229, 0.1);
        }

        .cut-options h3 {
            color: #1e293b;
            margin-bottom: 15px;
            font-size: 1.2em;
            font-weight: 600;
        }

        .grid-select-container {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }

        .grid-select {
            background: linear-gradient(145deg, #ffffff 0%, #f8f9ff 100%);
            border: 2px solid #e0e7ff;
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 1em;
            font-weight: 500;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 250px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .grid-select:hover {
            border-color: #4f46e5;
            background: linear-gradient(145deg, #eef2ff 0%, #e0e7ff 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
        }

        .grid-select:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .grid-select option {
            padding: 8px 12px;
            background: white;
            color: #1e293b;
        }

        .grid-select option:hover {
            background: #f8f9ff;
        }

        .grid-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .grid-item:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .grid-item.selected {
            border: 3px solid #4f46e5;
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.4);
        }

        .grid-item .download-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(79, 70, 229, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .grid-item:hover .download-btn {
            opacity: 1;
        }

        .selection-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .selection-controls .btn {
            padding: 8px 20px;
            font-size: 0.9em;
        }


        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .upload-area {
                padding: 20px;
            }
            
            .upload-box {
                padding: 40px 15px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .grid-select {
                min-width: 200px;
                font-size: 0.9em;
            }
            
            .grid-preview {
                gap: 8px;
            }
            
            .grid-preview.grid-5x1, .grid-preview.grid-5x2, .grid-preview.grid-5x3, .grid-preview.grid-5x4, .grid-preview.grid-5x5 {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .grid-preview.grid-6x1, .grid-preview.grid-6x2, .grid-preview.grid-6x3, .grid-preview.grid-6x4, .grid-preview.grid-6x5, .grid-preview.grid-6x6 {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .selection-controls {
                flex-direction: column;
                gap: 8px;
            }
            
            .selection-controls .btn {
                width: 100%;
                margin: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="language-selector">
                <label for="languageSelect" data-translate="language">语言:</label>
                <select id="languageSelect" class="language-select">
                    <option value="zh">中文</option>
                    <option value="en">English</option>
                </select>
            </div>
            <h1 data-translate="title">🎨 智能图片切割工具</h1>
            <p data-translate="subtitle">上传图片，选择切割方式，支持多种网格模式和选择性下载</p>
        </div>

        <div class="upload-area">
            <div class="upload-box" id="uploadBox">
                <div class="upload-icon">📸</div>
                <div class="upload-text" data-translate="uploadText">点击选择图片或拖拽图片到这里</div>
                <div class="upload-hint" data-translate="uploadHint">支持 JPG、PNG、GIF 格式</div>
                <input type="file" id="fileInput" accept="image/*">
            </div>
        </div>

        <div class="preview-section" id="previewSection">
            <div class="preview-title" data-translate="originalPreview">原图预览</div>
            <div class="original-preview">
                <img id="originalImage" class="original-image" alt="原图">
            </div>
            
            <div class="cut-options">
                <h3 data-translate="cutOptions">🔧 选择切割方式</h3>
                <div class="grid-select-container">
                    <select id="gridSelect" class="grid-select">
                        <option value="2x2">2×2 四宫格 (4片)</option>
                        <option value="3x3" selected>3×3 九宫格 (9片)</option>
                        <option value="4x4">4×4 十六宫格 (16片)</option>
                        <option value="5x5">5×5 二十五宫格 (25片)</option>
                        <option value="6x6">6×6 三十六宫格 (36片)</option>
                        <option value="2x3">2×3 六宫格 (6片)</option>
                        <option value="3x2">3×2 六宫格 (6片)</option>
                        <option value="4x3">4×3 十二宫格 (12片)</option>
                        <option value="3x4">3×4 十二宫格 (12片)</option>
                        <option value="5x4">5×4 二十宫格 (20片)</option>
                        <option value="4x5">4×5 二十宫格 (20片)</option>
                        <option value="6x4">6×4 二十四宫格 (24片)</option>
                        <option value="4x6">4×6 二十四宫格 (24片)</option>
                        <option value="1x2">1×2 二宫格 (2片)</option>
                        <option value="2x1">2×1 二宫格 (2片)</option>
                        <option value="1x3">1×3 三宫格 (3片)</option>
                        <option value="3x1">3×1 三宫格 (3片)</option>
                        <option value="1x4">1×4 四宫格 (4片)</option>
                        <option value="4x1">4×1 四宫格 (4片)</option>
                        <option value="1x5">1×5 五宫格 (5片)</option>
                        <option value="5x1">5×1 五宫格 (5片)</option>
                        <option value="1x6">1×6 六宫格 (6片)</option>
                        <option value="6x1">6×1 六宫格 (6片)</option>
                    </select>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn" id="cutButton" data-translate="startCut">🔪 开始切割</button>
                <button class="btn" id="downloadButton" data-translate="downloadAll" disabled>📦 打包下载</button>
                <button class="btn" id="resetButton" data-translate="reset">🔄 重新选择</button>
            </div>

            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="status-text" id="statusText"></div>

            <div class="selection-controls" id="selectionControls" style="display: none;">
                <button class="btn" id="selectAllButton" data-translate="selectAll">全选</button>
                <button class="btn" id="unselectAllButton" data-translate="unselectAll">取消全选</button>
                <button class="btn" id="downloadSelectedButton" data-translate="downloadSelected" disabled>下载选中</button>
            </div>

            <div class="grid-preview" id="gridPreview"></div>
        </div>
    </div>

    <script>
        // 语言配置对象
        const translations = {
            zh: {
                language: '语言:',
                title: '🎨 智能图片切割工具',
                subtitle: '上传图片，选择切割方式，支持多种网格模式和选择性下载',
                uploadText: '点击选择图片或拖拽图片到这里',
                uploadHint: '支持 JPG、PNG、GIF 格式',
                originalPreview: '原图预览',
                cutOptions: '🔧 选择切割方式',
                startCut: '🔪 开始切割',
                downloadAll: '📦 打包下载',
                reset: '🔄 重新选择',
                selectAll: '全选',
                unselectAll: '取消全选',
                downloadSelected: '下载选中',
                cutting: '正在切割图片...',
                packaging: '正在打包下载...',
                packagingSelected: '正在打包选中的图片...',
                generating: '生成压缩包...',
                errorMessage: '请选择图片文件！',
                gridOptions: {
                    '2x2': '2×2 四宫格 (4片)',
                    '3x3': '3×3 九宫格 (9片)',
                    '4x4': '4×4 十六宫格 (16片)',
                    '5x5': '5×5 二十五宫格 (25片)',
                    '6x6': '6×6 三十六宫格 (36片)',
                    '2x3': '2×3 六宫格 (6片)',
                    '3x2': '3×2 六宫格 (6片)',
                    '4x3': '4×3 十二宫格 (12片)',
                    '3x4': '3×4 十二宫格 (12片)',
                    '5x4': '5×4 二十宫格 (20片)',
                    '4x5': '4×5 二十宫格 (20片)',
                    '6x4': '6×4 二十四宫格 (24片)',
                    '4x6': '4×6 二十四宫格 (24片)',
                    '1x2': '1×2 二宫格 (2片)',
                    '2x1': '2×1 二宫格 (2片)',
                    '1x3': '1×3 三宫格 (3片)',
                    '3x1': '3×1 三宫格 (3片)',
                    '1x4': '1×4 四宫格 (4片)',
                    '4x1': '4×1 四宫格 (4片)',
                    '1x5': '1×5 五宫格 (5片)',
                    '5x1': '5×1 五宫格 (5片)',
                    '1x6': '1×6 六宫格 (6片)',
                    '6x1': '6×1 六宫格 (6片)'
                }
            },
            en: {
                language: 'Language:',
                title: '🎨 Smart Image Cutter Tool',
                subtitle: 'Upload images, choose cutting method, support multiple grid modes and selective download',
                uploadText: 'Click to select image or drag image here',
                uploadHint: 'Support JPG, PNG, GIF formats',
                originalPreview: 'Original Preview',
                cutOptions: '🔧 Select Cutting Method',
                startCut: '🔪 Start Cutting',
                downloadAll: '📦 Download All',
                reset: '🔄 Reset',
                selectAll: 'Select All',
                unselectAll: 'Unselect All',
                downloadSelected: 'Download Selected',
                cutting: 'Cutting image...',
                packaging: 'Packaging for download...',
                packagingSelected: 'Packaging selected images...',
                generating: 'Generating zip file...',
                errorMessage: 'Please select an image file!',
                gridOptions: {
                    '2x2': '2×2 Grid (4 pieces)',
                    '3x3': '3×3 Grid (9 pieces)',
                    '4x4': '4×4 Grid (16 pieces)',
                    '5x5': '5×5 Grid (25 pieces)',
                    '6x6': '6×6 Grid (36 pieces)',
                    '2x3': '2×3 Grid (6 pieces)',
                    '3x2': '3×2 Grid (6 pieces)',
                    '4x3': '4×3 Grid (12 pieces)',
                    '3x4': '3×4 Grid (12 pieces)',
                    '5x4': '5×4 Grid (20 pieces)',
                    '4x5': '4×5 Grid (20 pieces)',
                    '6x4': '6×4 Grid (24 pieces)',
                    '4x6': '4×6 Grid (24 pieces)',
                    '1x2': '1×2 Grid (2 pieces)',
                    '2x1': '2×1 Grid (2 pieces)',
                    '1x3': '1×3 Grid (3 pieces)',
                    '3x1': '3×1 Grid (3 pieces)',
                    '1x4': '1×4 Grid (4 pieces)',
                    '4x1': '4×1 Grid (4 pieces)',
                    '1x5': '1×5 Grid (5 pieces)',
                    '5x1': '5×1 Grid (5 pieces)',
                    '1x6': '1×6 Grid (6 pieces)',
                    '6x1': '6×1 Grid (6 pieces)'
                }
            }
        };

        class GridCutter {
            constructor() {
                this.originalImage = null;
                this.cutImages = [];
                this.selectedImages = new Set();
                this.currentGrid = '3x3';
                this.currentLanguage = 'zh';
                this.init();
            }

            init() {
                this.bindEvents();
                this.initLanguage();
            }

            initLanguage() {
                // 初始化语言选择器
                const languageSelect = document.getElementById('languageSelect');
                languageSelect.addEventListener('change', (e) => {
                    this.currentLanguage = e.target.value;
                    this.updateLanguage();
                });
                
                // 设置初始语言
                this.updateLanguage();
            }

            updateLanguage() {
                const t = translations[this.currentLanguage];
                
                // 更新所有带有 data-translate 属性的元素
                document.querySelectorAll('[data-translate]').forEach(element => {
                    const key = element.getAttribute('data-translate');
                    if (t[key]) {
                        element.textContent = t[key];
                    }
                });
                
                // 更新网格选择器选项
                this.updateGridOptions();
                
                // 更新按钮文本
                this.updateButtonTexts();
                
                // 更新HTML lang属性
                document.documentElement.lang = this.currentLanguage === 'zh' ? 'zh-CN' : 'en';
                
                // 更新title
                document.title = t.title;
            }

            updateGridOptions() {
                const gridSelect = document.getElementById('gridSelect');
                const t = translations[this.currentLanguage];
                const currentValue = gridSelect.value;
                
                gridSelect.innerHTML = '';
                Object.keys(t.gridOptions).forEach(key => {
                    const option = document.createElement('option');
                    option.value = key;
                    option.textContent = t.gridOptions[key];
                    if (key === currentValue) {
                        option.selected = true;
                    }
                    gridSelect.appendChild(option);
                });
            }

            updateButtonTexts() {
                const t = translations[this.currentLanguage];
                
                document.getElementById('cutButton').textContent = t.startCut;
                document.getElementById('downloadButton').textContent = t.downloadAll;
                document.getElementById('resetButton').textContent = t.reset;
                document.getElementById('selectAllButton').textContent = t.selectAll;
                document.getElementById('unselectAllButton').textContent = t.unselectAll;
                document.getElementById('downloadSelectedButton').textContent = t.downloadSelected;
            }

            bindEvents() {
                const uploadBox = document.getElementById('uploadBox');
                const fileInput = document.getElementById('fileInput');
                const cutButton = document.getElementById('cutButton');
                const downloadButton = document.getElementById('downloadButton');
                const resetButton = document.getElementById('resetButton');
                const selectAllButton = document.getElementById('selectAllButton');
                const unselectAllButton = document.getElementById('unselectAllButton');
                const downloadSelectedButton = document.getElementById('downloadSelectedButton');

                // 上传框点击事件
                uploadBox.addEventListener('click', () => fileInput.click());

                // 文件选择事件
                fileInput.addEventListener('change', (e) => this.handleFileSelect(e));

                // 拖拽事件
                uploadBox.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    uploadBox.classList.add('dragover');
                });

                uploadBox.addEventListener('dragleave', () => {
                    uploadBox.classList.remove('dragover');
                });

                uploadBox.addEventListener('drop', (e) => {
                    e.preventDefault();
                    uploadBox.classList.remove('dragover');
                    const files = e.dataTransfer.files;
                    if (files.length > 0) {
                        this.loadImage(files[0]);
                    }
                });

                // 网格选择事件
                const gridSelect = document.getElementById('gridSelect');
                gridSelect.addEventListener('change', (e) => {
                    this.currentGrid = e.target.value;
                });

                // 按钮事件
                cutButton.addEventListener('click', () => this.cutImage());
                downloadButton.addEventListener('click', () => this.downloadImages());
                resetButton.addEventListener('click', () => this.reset());
                selectAllButton.addEventListener('click', () => this.selectAll());
                unselectAllButton.addEventListener('click', () => this.unselectAll());
                downloadSelectedButton.addEventListener('click', () => this.downloadSelected());
            }


            handleFileSelect(e) {
                const file = e.target.files[0];
                if (file) {
                    this.loadImage(file);
                }
            }

            loadImage(file) {
                if (!file.type.startsWith('image/')) {
                    const t = translations[this.currentLanguage];
                    alert(t.errorMessage);
                    return;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        this.originalImage = img;
                        this.showPreview(e.target.result);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }

            showPreview(imageSrc) {
                const originalImage = document.getElementById('originalImage');
                const previewSection = document.getElementById('previewSection');
                
                originalImage.src = imageSrc;
                previewSection.style.display = 'block';
                
                // 重置状态
                document.getElementById('cutButton').disabled = false;
                document.getElementById('downloadButton').disabled = true;
                document.getElementById('selectionControls').style.display = 'none';
                document.getElementById('gridPreview').innerHTML = '';
                this.cutImages = [];
                this.selectedImages.clear();
            }

            async cutImage() {
                if (!this.originalImage) return;

                const cutButton = document.getElementById('cutButton');
                const progressBar = document.getElementById('progressBar');
                const progressFill = document.getElementById('progressFill');
                const statusText = document.getElementById('statusText');
                const gridPreview = document.getElementById('gridPreview');
                const selectionControls = document.getElementById('selectionControls');

                cutButton.disabled = true;
                progressBar.style.display = 'block';
                statusText.style.display = 'block';
                const t = translations[this.currentLanguage];
                statusText.textContent = t.cutting;

                // 清空之前的结果
                gridPreview.innerHTML = '';
                this.cutImages = [];
                this.selectedImages.clear();

                await this.cutGridImage();

                // 完成
                progressBar.style.display = 'none';
                statusText.style.display = 'none';
                cutButton.disabled = false;
                document.getElementById('downloadButton').disabled = false;
                selectionControls.style.display = 'flex';
            }

            async cutGridImage() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                // 解析网格配置
                const [cols, rows] = this.currentGrid.split('x').map(Number);
                const totalPieces = cols * rows;

                // 计算切割尺寸
                const width = this.originalImage.width;
                const height = this.originalImage.height;
                const pieceWidth = width / cols;
                const pieceHeight = height / rows;

                // 设置网格预览样式
                const gridPreview = document.getElementById('gridPreview');
                gridPreview.className = `grid-preview grid-${this.currentGrid}`;

                // 切割图片
                for (let row = 0; row < rows; row++) {
                    for (let col = 0; col < cols; col++) {
                        const index = row * cols + col;
                        
                        // 更新进度
                        const progress = ((index + 1) / totalPieces) * 100;
                        document.getElementById('progressFill').style.width = progress + '%';
                        const t = translations[this.currentLanguage];
                        document.getElementById('statusText').textContent = `${t.cutting.replace('...', '')} ${index + 1}/${totalPieces}`;

                        // 等待一帧以更新UI
                        await new Promise(resolve => requestAnimationFrame(resolve));

                        // 设置canvas尺寸
                        canvas.width = pieceWidth;
                        canvas.height = pieceHeight;

                        // 绘制图片片段
                        ctx.drawImage(
                            this.originalImage,
                            col * pieceWidth, row * pieceHeight,
                            pieceWidth, pieceHeight,
                            0, 0,
                            pieceWidth, pieceHeight
                        );

                        // 转换为blob
                        const blob = await new Promise(resolve => {
                            canvas.toBlob(resolve, 'image/png');
                        });

                        this.cutImages.push({
                            blob: blob,
                            dataUrl: canvas.toDataURL('image/png'),
                            filename: `piece_${index + 1}.png`,
                            index: index
                        });

                        // 创建预览
                        this.createPreviewItem(canvas.toDataURL('image/png'), index + 1);
                    }
                }
            }


            createPreviewItem(dataUrl, index) {
                const gridPreview = document.getElementById('gridPreview');
                const gridItem = document.createElement('div');
                gridItem.className = 'grid-item';
                gridItem.dataset.index = index - 1;
                
                gridItem.innerHTML = `
                    <img src="${dataUrl}" alt="切片 ${index}">
                    <div class="index">${index}</div>
                    <button class="download-btn" onclick="gridCutter.downloadSingle(${index - 1})">⬇</button>
                `;
                
                // 添加点击选择功能
                gridItem.addEventListener('click', (e) => {
                    if (e.target.classList.contains('download-btn')) return;
                    
                    const itemIndex = parseInt(gridItem.dataset.index);
                    if (this.selectedImages.has(itemIndex)) {
                        this.selectedImages.delete(itemIndex);
                        gridItem.classList.remove('selected');
                    } else {
                        this.selectedImages.add(itemIndex);
                        gridItem.classList.add('selected');
                    }
                    
                    this.updateSelectionButtons();
                });
                
                gridPreview.appendChild(gridItem);
            }

            async downloadImages() {
                if (this.cutImages.length === 0) return;

                const statusText = document.getElementById('statusText');
                const progressBar = document.getElementById('progressBar');
                const progressFill = document.getElementById('progressFill');

                statusText.style.display = 'block';
                progressBar.style.display = 'block';
                const t = translations[this.currentLanguage];
                statusText.textContent = t.packaging;

                // 创建JSZip实例
                const zip = new JSZip();

                // 添加文件到压缩包
                for (let i = 0; i < this.cutImages.length; i++) {
                    const item = this.cutImages[i];
                    zip.file(item.filename, item.blob);
                    
                    const progress = ((i + 1) / this.cutImages.length) * 100;
                    progressFill.style.width = progress + '%';
                    statusText.textContent = `${t.packaging.replace('...', '')} ${i + 1}/${this.cutImages.length}`;
                    
                    await new Promise(resolve => setTimeout(resolve, 50));
                }

                // 生成压缩包
                statusText.textContent = t.generating;
                const content = await zip.generateAsync({type: 'blob'});

                // 创建下载链接
                const url = URL.createObjectURL(content);
                const a = document.createElement('a');
                a.href = url;
                a.download = `切割图片_${this.currentGrid}_${new Date().getTime()}.zip`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                // 隐藏进度条
                progressBar.style.display = 'none';
                statusText.style.display = 'none';
            }

            downloadSingle(index) {
                if (index < 0 || index >= this.cutImages.length) return;
                
                const item = this.cutImages[index];
                const url = URL.createObjectURL(item.blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = item.filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            async downloadSelected() {
                if (this.selectedImages.size === 0) return;

                const statusText = document.getElementById('statusText');
                const progressBar = document.getElementById('progressBar');
                const progressFill = document.getElementById('progressFill');

                statusText.style.display = 'block';
                progressBar.style.display = 'block';
                const t = translations[this.currentLanguage];
                statusText.textContent = t.packagingSelected;

                // 创建JSZip实例
                const zip = new JSZip();
                const selectedItems = Array.from(this.selectedImages).map(index => this.cutImages[index]);

                // 添加文件到压缩包
                for (let i = 0; i < selectedItems.length; i++) {
                    const item = selectedItems[i];
                    zip.file(item.filename, item.blob);
                    
                    const progress = ((i + 1) / selectedItems.length) * 100;
                    progressFill.style.width = progress + '%';
                    statusText.textContent = `${t.packagingSelected.replace('...', '')} ${i + 1}/${selectedItems.length}`;
                    
                    await new Promise(resolve => setTimeout(resolve, 50));
                }

                // 生成压缩包
                statusText.textContent = t.generating;
                const content = await zip.generateAsync({type: 'blob'});

                // 创建下载链接
                const url = URL.createObjectURL(content);
                const a = document.createElement('a');
                a.href = url;
                a.download = `选中切片_${this.currentGrid}_${new Date().getTime()}.zip`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                // 隐藏进度条
                progressBar.style.display = 'none';
                statusText.style.display = 'none';
            }

            selectAll() {
                this.selectedImages.clear();
                for (let i = 0; i < this.cutImages.length; i++) {
                    this.selectedImages.add(i);
                }
                
                document.querySelectorAll('.grid-item').forEach(item => {
                    item.classList.add('selected');
                });
                
                this.updateSelectionButtons();
            }

            unselectAll() {
                this.selectedImages.clear();
                document.querySelectorAll('.grid-item').forEach(item => {
                    item.classList.remove('selected');
                });
                
                this.updateSelectionButtons();
            }

            updateSelectionButtons() {
                const downloadSelectedButton = document.getElementById('downloadSelectedButton');
                downloadSelectedButton.disabled = this.selectedImages.size === 0;
            }


            reset() {
                this.originalImage = null;
                this.cutImages = [];
                this.selectedImages.clear();
                document.getElementById('previewSection').style.display = 'none';
                document.getElementById('fileInput').value = '';
                document.getElementById('gridPreview').innerHTML = '';
                document.getElementById('selectionControls').style.display = 'none';
                
                // 重置网格选择
                const gridSelect = document.getElementById('gridSelect');
                gridSelect.value = '3x3';
                this.currentGrid = '3x3';
            }
        }

        // 初始化应用
        let gridCutter;
        document.addEventListener('DOMContentLoaded', () => {
            gridCutter = new GridCutter();
        });
    </script>

    <!-- 引入JSZip库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</body>
