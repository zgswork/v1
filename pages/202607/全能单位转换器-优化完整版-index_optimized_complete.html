<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全能单位转换器 - 优化完整版</title>
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        /* 标签页样式 */
        .category-tabs {
            display: flex;
            background: #ecf0f1;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .category-tab {
            padding: 15px 25px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 16px;
            font-weight: bold;
            color: #7f8c8d;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .category-tab:hover {
            background: #bdc3c7;
            color: #2c3e50;
        }

        .category-tab.active {
            background: white;
            color: #2c3e50;
            border-bottom: 3px solid #3498db;
        }

        /* 转换面板样式 */
        .content {
            padding: 20px;
        }

        .category-panel {
            display: none;
        }

        .category-panel.active {
            display: block;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        input[type="number"] {
            padding: 12px;
            font-size: 16px;
            border: 2px solid #bdc3c7;
            border-radius: 5px;
            width: 150px;
        }

        select {
            padding: 12px;
            font-size: 16px;
            border: 2px solid #bdc3c7;
            border-radius: 5px;
            background: white;
            cursor: pointer;
        }

        .swap-btn {
            padding: 12px 15px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s ease;
        }

        .swap-btn:hover {
            background: #2980b9;
        }

        .result {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .result h3 {
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .result-value {
            font-size: 2em;
            font-weight: bold;
            color: #3498db;
        }

        /* 页脚样式 */
        .footer {
            text-align: center;
            padding: 20px;
            margin-top: 30px;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            border-radius: 0 0 15px 15px;
        }

        .footer-content {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .creator-info {
            font-size: 14px;
            line-height: 1.6;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 14px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon {
            width: 16px;
            height: 16px;
            background: #3498db;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .input-group {
                flex-direction: column;
                align-items: stretch;
            }

            input[type="number"], select {
                width: 100%;
            }

            .category-tab {
                padding: 12px 20px;
                font-size: 14px;
            }

            h1 {
                font-size: 2em;
            }

            .footer-content {
                flex-direction: column;
                gap: 15px;
            }

            .contact-info {
                align-items: center;
            }
        }

        @media (max-width: 375px) {
            body {
                padding: 10px;
            }

            header {
                padding: 15px;
            }

            h1 {
                font-size: 1.8em;
            }

            .content {
                padding: 15px;
            }

            input[type="number"], select {
                font-size: 14px;
                padding: 10px;
            }

            .result-value {
                font-size: 1.5em;
            }
        }

        @media (min-width: 1200px) {
            .container {
                max-width: 1200px;
            }
        }

        @media (orientation: landscape) and (max-width: 768px) {
            .input-group {
                flex-direction: row;
                align-items: center;
            }

            input[type="number"], select {
                width: auto;
                min-width: 120px;
            }
        }

        @media (-webkit-device-pixel-ratio: 2), (resolution: 192dpi) {
            .container {
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
            }
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #1e2a3a 0%, #2d3a4b 100%);
            }

            .container {
                background: #2c3e50;
                color: #ecf0f1;
            }

            .category-tabs {
                background: #34495e;
            }

            .category-tab {
                color: #bdc3c7;
            }

            .category-tab:hover {
                background: #4a5f7a;
                color: #ecf0f1;
            }

            .category-tab.active {
                background: #2c3e50;
                color: #ecf0f1;
            }

            input[type="number"], select {
                background: #34495e;
                color: #ecf0f1;
                border-color: #4a5f7a;
            }

            .result {
                background: #34495e;
            }

            .result h3 {
                color: #ecf0f1;
            }
        }

        @media (hover: none) and (pointer: coarse) {
            .category-tab, .swap-btn {
                touch-action: manipulation;
            }

            .swap-btn {
                padding: 15px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>全能单位转换器</h1>
            <p>支持多种单位的快速转换</p>
        </header>

        <div class="category-tabs">
            <button class="category-tab active" onclick="showCategory('length')">长度</button>
            <button class="category-tab" onclick="showCategory('weight')">重量</button>
            <button class="category-tab" onclick="showCategory('area')">面积</button>
            <button class="category-tab" onclick="showCategory('volume')">体积</button>
            <button class="category-tab" onclick="showCategory('temperature')">温度</button>
            <button class="category-tab" onclick="showCategory('speed')">速度</button>
            <button class="category-tab" onclick="showCategory('time')">时间</button>
            <button class="category-tab" onclick="showCategory('data')">数据存储</button>
            <button class="category-tab" onclick="showCategory('energy')">能量</button>
            <button class="category-tab" onclick="showCategory('power')">功率</button>
            <button class="category-tab" onclick="showCategory('pressure')">压力</button>
            <button class="category-tab" onclick="showCategory('angle')">角度</button>
            <button class="category-tab" onclick="showCategory('frequency')">频率</button>
        </div>

        <div class="content">
            <!-- 长度转换 -->
            <div id="length" class="category-panel active">
                <div class="input-group">
                    <input type="number" id="length-input" placeholder="输入数值" step="any" oninput="convert('length')">
                    <select id="length-from" onchange="convert('length')">
                        <option value="mm">毫米 (mm)</option>
                        <option value="cm">厘米 (cm)</option>
                        <option value="m" selected>米 (m)</option>
                        <option value="km">千米 (km)</option>
                        <option value="in">英寸 (in)</option>
                        <option value="ft">英尺 (ft)</option>
                        <option value="yd">码 (yd)</option>
                        <option value="mile">英里 (mile)</option>
                        <option value="li">里</option>
                        <option value="zhang">丈</option>
                        <option value="chi">尺</option>
                        <option value="cun">寸</option>
                    </select>
                    <span>→</span>
                    <select id="length-to" onchange="convert('length')">
                        <option value="mm">毫米 (mm)</option>
                        <option value="cm">厘米 (cm)</option>
                        <option value="m">米 (m)</option>
                        <option value="km" selected>千米 (km)</option>
                        <option value="in">英寸 (in)</option>
                        <option value="ft">英尺 (ft)</option>
                        <option value="yd">码 (yd)</option>
                        <option value="mile">英里 (mile)</option>
                        <option value="li">里</option>
                        <option value="zhang">丈</option>
                        <option value="chi">尺</option>
                        <option value="cun">寸</option>
                    </select>
                    <button class="swap-btn" onclick="swapUnits('length')">↔ 交换</button>
                </div>
                <div class="result">
                    <h3>转换结果</h3>
                    <div id="length-result" class="result-value">0</div>
                </div>
            </div>

            <!-- 重量转换 -->
            <div id="weight" class="category-panel">
                <div class="input-group">
                    <input type="number" id="weight-input" placeholder="输入数值" step="any" oninput="convert('weight')">
                    <select id="weight-from" onchange="convert('weight')">
                        <option value="mg">毫克 (mg)</option>
                        <option value="g">克 (g)</option>
                        <option value="kg" selected>千克 (kg)</option>
                        <option value="t">吨 (t)</option>
                        <option value="oz">盎司 (oz)</option>
                        <option value="lb">磅 (lb)</option>
                        <option value="st">英石 (st)</option>
                        <option value="jin">斤</option>
                        <option value="liang">两</option>
                        <option value="qian">钱</option>
                    </select>
                    <span>→</span>
                    <select id="weight-to" onchange="convert('weight')">
                        <option value="mg">毫克 (mg)</option>
                        <option value="g">克 (g)</option>
                        <option value="kg">千克 (kg)</option>
                        <option value="t" selected>吨 (t)</option>
                        <option value="oz">盎司 (oz)</option>
                        <option value="lb">磅 (lb)</option>
                        <option value="st">英石 (st)</option>
                        <option value="jin">斤</option>
                        <option value="liang">两</option>
                        <option value="qian">钱</option>
                    </select>
                    <button class="swap-btn" onclick="swapUnits('weight')">↔ 交换</button>
                </div>
                <div class="result">
                    <h3>转换结果</h3>
                    <div id="weight-result" class="result-value">0</div>
                </div>
            </div>

            <!-- 面积转换 -->
            <div id="area" class="category-panel">
                <div class="input-group">
                    <input type="number" id="area-input" placeholder="输入数值" step="any" oninput="convert('area')">
                    <select id="area-from" onchange="convert('area')">
                        <option value="mm2">平方毫米 (mm²)</option>
                        <option value="cm2">平方厘米 (cm²)</option>
                        <option value="m2" selected>平方米 (m²)</option>
                        <option value="ha">公顷 (ha)</option>
                        <option value="km2">平方公里 (km²)</option>
                        <option value="in2">平方英寸 (in²)</option>
                        <option value="ft2">平方英尺 (ft²)</option>
                        <option value="acre">英亩 (acre)</option>
                        <option value="mu">亩</option>
                        <option value="fen">分</option>
                        <option value="li">厘</option>
                    </select>
                    <span>→</span>
                    <select id="area-to" onchange="convert('area')">
                        <option value="mm2">平方毫米 (mm²)</option>
                        <option value="cm2">平方厘米 (cm²)</option>
                        <option value="m2">平方米 (m²)</option>
                        <option value="ha">公顷 (ha)</option>
                        <option value="km2" selected>平方公里 (km²)</option>
                        <option value="in2">平方英寸 (in²)</option>
                        <option value="ft2">平方英尺 (ft²)</option>
                        <option value="acre">英亩 (acre)</option>
                        <option value="mu">亩</option>
                        <option value="fen">分</option>
                        <option value="li">厘</option>
                    </select>
                    <button class="swap-btn" onclick="swapUnits('area')">↔ 交换</button>
                </div>
                <div class="result">
                    <h3>转换结果</h3>
                    <div id="area-result" class="result-value">0</div>
                </div>
            </div>

            <!-- 体积转换 -->
            <div id="volume" class="category-panel">
                <div class="input-group">
                    <input type="number" id="volume-input" placeholder="输入数值" step="any" oninput="convert('volume')">
                    <select id="volume-from" onchange="convert('volume')">
                        <option value="ml">毫升 (ml)</option>
                        <option value="l" selected>升 (l)</option>
                        <option value="m3">立方米 (m³)</option>
                        <option value="floz">液盎司 (fl oz)</option>
                        <option value="pt">品脱 (pt)</option>
                        <option value="gal">加仑 (gal)</option>
                        <option value="sheng">升</option>
                        <option value="dou">斗</option>
                        <option value="dan">石</option>
                    </select>
                    <span>→</span>
                    <select id="volume-to" onchange="convert('volume')">
                        <option value="ml">毫升 (ml)</option>
                        <option value="l">升 (l)</option>
                        <option value="m3" selected>立方米 (m³)</option>
                        <option value="floz">液盎司 (fl oz)</option>
                        <option value="pt">品脱 (pt)</option>
                        <option value="gal">加仑 (gal)</option>
                        <option value="sheng">升</option>
                        <option value="dou">斗</option>
                        <option value="dan">石</option>
                    </select>
                    <button class="swap-btn" onclick="swapUnits('volume')">↔ 交换</button>
                </div>
                <div class="result">
                    <h3>转换结果</h3>
                    <div id="volume-result" class="result-value">0</div>
                </div>
            </div>

            <!-- 温度转换 -->
            <div id="temperature" class="category-panel">
                <div class="input-group">
                    <input type="number" id="temperature-input" placeholder="输入数值" step="any" oninput="convert('temperature')">
                    <select id="temperature-from" onchange="convert('temperature')">
                        <option value="c" selected>摄氏度 (°C)</option>
                        <option value="f">华氏度 (°F)</option>
                        <option value="k">开尔文 (K)</option>
                    </select>
                    <span>→</span>
                    <select id="temperature-to" onchange="convert('temperature')">
                        <option value="c">摄氏度 (°C)</option>
                        <option value="f" selected>华氏度 (°F)</option>
                        <option value="k">开尔文 (K)</option>
                    </select>
                    <button class="swap-btn" onclick="swapUnits('temperature')">↔ 交换</button>
                </div>
                <div class="result">
                    <h3>转换结果</h3>
                    <div id="temperature-result" class="result-value">0</div>
                </div>
            </div>

            <!-- 速度转换 -->
            <div id="speed" class="category-panel">
                <div class="input-group">
                    <input type="number" id="speed-input" placeholder="输入数值" step="any" oninput="convert('speed')">
                    <select id="speed-from" onchange="convert('speed')">
                        <option value="m_s" selected>米/秒 (m/s)</option>
                        <option value="km_h">千米/小时 (km/h)</option>
                        <option value="mph">英里/小时 (mph)</option>
                        <option value="knot">节 (knot)</option>
                    </select>
                    <span>→</span>
                    <select id="speed-to" onchange="convert('speed')">
                        <option value="m_s">米/秒 (m/s)</option>
                        <option value="km_h" selected>千米/小时 (km/h)</option>
                        <option value="mph">英里/小时 (mph)</option>
                        <option value="knot">节 (knot)</option>
                    </select>
                    <button class="swap-btn" onclick="swapUnits('speed')">↔ 交换</button>
                </div>
                <div class="result">
                    <h3>转换结果</h3>
                    <div id="speed-result" class="result-value">0</div>
                </div>
            </div>

            <!-- 时间转换 -->
            <div id="time" class="category-panel">
                <div class="input-group">
                    <input type="number" id="time-input" placeholder="输入数值" step="any" oninput="convert('time')">
                    <select id="time-from" onchange="convert('time')">
                        <option value="s" selected>秒 (s)</option>
                        <option value="min">分钟 (min)</option>
                        <option value="h">小时 (h)</option>
                        <option value="day">天 (day)</option>
                        <option value="week">周 (week)</option>
                    </select>
                    <span>→</span>
                    <select id="time-to" onchange="convert('time')">
                        <option value="s">秒 (s)</option>
                        <option value="min">分钟 (min)</option>
                        <option value="h">小时 (h)</option>
                        <option value="day" selected>天 (day)</option>
                        <option value="week">周 (week)</option>
                    </select>
                    <button class="swap-btn" onclick="swapUnits('time')">↔ 交换</button>
                </div>
                <div class="result">
                    <h3>转换结果</h3>
                    <div id="time-result" class="result-value">0</div>
                </div>
            </div>

            <!-- 数据存储转换 -->
            <div id="data" class="category-panel">
                <div class="input-group">
                    <input type="number" id="data-input" placeholder="输入数值" step="any" oninput="convert('data')">
                    <select id="data-from" onchange="convert('data')">
                        <option value="bit">比特 (bit)</option>
                        <option value="B">字节 (B)</option>
                        <option value="KB">千字节 (KB)</option>
                        <option value="MB">兆字节 (MB)</option>
                        <option value="GB" selected>吉字节 (GB)</option>
                        <option value="TB">太字节 (TB)</option>
                    </select>
                    <button class="swap-btn" onclick="swapUnits('data')">↔ 交换</button>
                </div>
                <div class="result">
                    <h3>转换结果</h3>
                    <div id="data-result" class="result-value">0</div>
                </div>
            </div>

            <!-- 能量转换 -->
            <div id="energy" class="category-panel">
                <div class="input-group">
                    <input type="number" id="energy-input" placeholder="输入数值" step="any" oninput="convert('energy')">
                    <select id="energy-from" onchange="convert('energy')">
                        <option value="J" selected>焦耳 (J)</option>
                        <option value="cal">卡路里 (cal)</option>
                        <option value="kWh">千瓦时 (kWh)</option>
                        <option value="eV">电子伏特 (eV)</option>
                    </select>
                    <span>→</span>
                    <select id="energy-to" onchange="convert('energy')">
                        <option value="J">焦耳 (J)</option>
                        <option value="cal">卡路里 (cal)</option>
                        <option value="kWh" selected>千瓦时 (kWh)</option>
                        <option value="eV">电子伏特 (eV)</option>
                    </select>
                    <button class="swap-btn" onclick="swapUnits('energy')">↔ 交换</button>
                </div>
                <div class="result">
                    <h3>转换结果</h3>
                    <div id="energy-result" class="result-value">0</div>
                </div>
            </div>

            <!-- 功率转换 -->
            <div id="power" class="category-panel">
                <div class="input-group">
                    <input type="number" id="power-input" placeholder="输入数值" step="any" oninput="convert('power')">
                    <select id="power-from" onchange="convert('power')">
                        <option value="W" selected>瓦特 (W)</option>
                        <option value="kW">千瓦 (kW)</option>
                        <option value="hp">马力 (hp)</option>
                    </select>
                    <span>→</span>
                    <select id="power-to" onchange="convert('power')">
                        <option value="W">瓦特 (W)</option>
                        <option value="kW" selected>千瓦 (kW)</option>
                        <option value="hp">马力 (hp)</option>
                    </select>
                    <button class="swap-btn" onclick="swapUnits('power')">↔ 交换</button>
                </div>
                <div class="result">
                    <h3>转换结果</h3>
                    <div id="power-result" class="result-value">0</div>
                </div>
            </div>

            <!-- 压力转换 -->
            <div id="pressure" class="category-panel">
                <div class="input-group">
                    <input type="number" id="pressure-input" placeholder="输入数值" step="any" oninput="convert('pressure')">
                    <select id="pressure-from" onchange="convert('pressure')">
                        <option value="Pa" selected>帕斯卡 (Pa)</option>
                        <option value="bar">巴 (bar)</option>
                        <option value="atm">大气压 (atm)</option>
                        <option value="mmHg">毫米汞柱 (mmHg)</option>
                    </select>
                    <span>→</span>
                    <select id="pressure-to" onchange="convert('pressure')">
                        <option value="Pa">帕斯卡 (Pa)</option>
                        <option value="bar" selected>巴 (bar)</option>
                        <option value="atm">大气压 (atm)</option>
                        <option value="mmHg">毫米汞柱 (mmHg)</option>
                    </select>
                    <button class="swap-btn" onclick="swapUnits('pressure')">↔ 交换</button>
                </div>
                <div class="result">
                    <h3>转换结果</h3>
                    <div id="pressure-result" class="result-value">0</div>
                </div>
            </div>

            <!-- 角度转换 -->
            <div id="angle" class="category-panel">
                <div class="input-group">
                    <input type="number" id="angle-input" placeholder="输入数值" step="any" oninput="convert('angle')">
                    <select id="angle-from" onchange="convert('angle')">
                        <option value="deg" selected>度 (°)</option>
                        <option value="rad">弧度 (rad)</option>
                        <option value="grad">梯度 (grad)</option>
                    </select>
                    <span>→</span>
                    <select id="angle-to" onchange="convert('angle')">
                        <option value="deg">度 (°)</option>
                        <option value="rad" selected>弧度 (rad)</option>
                        <option value="grad">梯度 (grad)</option>
                    </select>
                    <button class="swap-btn" onclick="swapUnits('angle')">↔ 交换</button>
                </div>
                <div class="result">
                    <h3>转换结果</h3>
                    <div id="angle-result" class="result-value">0</div>
                </div>
            </div>

            <!-- 频率转换 -->
            <div id="frequency" class="category-panel">
                <div class="input-group">
                    <input type="number" id="frequency-input" placeholder="输入数值" step="any" oninput="convert('frequency')">
                    <select id="frequency-from" onchange="convert('frequency')">
                        <option value="Hz" selected>赫兹 (Hz)</option>
                        <option value="kHz">千赫 (kHz)</option>
                        <option value="MHz">兆赫 (MHz)</option>
                    </select>
                    <span>→</span>
                    <select id="frequency-to" onchange="convert('frequency')">
                        <option value="Hz">赫兹 (Hz)</option>
                        <option value="kHz" selected>千赫 (kHz)</option>
                        <option value="MHz">兆赫 (MHz)</option>
                    </select>
                    <button class="swap-btn" onclick="swapUnits('frequency')">↔ 交换</button>
                </div>
                <div class="result">
                    <h3>转换结果</h3>
                    <div id="frequency-result" class="result-value">0</div>
                </div>
            </div>
        </div>

        <!-- 制作者信息 -->
        <div class="footer">
            <div class="footer-content">
                <div class="creator-info">
                    <strong>制作者：晋人在秦 老K</strong>
                </div>
                <div class="contact-info">
                    <div class="contact-item">
                        <span class="icon">📧</span>
                        <span>邮箱：<a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="0869636d663b383b487979266b6765">[email&#160;protected]</a></span>
                    </div>
                    <div class="contact-item">
                        <span class="icon">💬</span>
                        <span>微信：aken5933</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 单位转换系数定义
        const conversionFactors = {
            // 长度单位转换系数（以米为基准）
            length: {
                mm: 0.001,      // 毫米
                cm: 0.01,       // 厘米
                m: 1,           // 米
                km: 1000,       // 千米
                in: 0.0254,     // 英寸
                ft: 0.3048,     // 英尺
                yd: 0.9144,     // 码
                mile: 1609.344, // 英里
                li: 500,        // 里
                zhang: 3.3333,  // 丈
                chi: 0.3333,    // 尺
                cun: 0.0333     // 寸
            },
            
            // 重量单位转换系数（以千克为基准）
            weight: {
                mg: 0.000001,   // 毫克
                g: 0.001,       // 克
                kg: 1,          // 千克
                t: 1000,        // 吨
                oz: 0.0283495,  // 盎司
                lb: 0.453592,   // 磅
                st: 6.35029,    // 英石
                jin: 0.5,       // 斤
                liang: 0.05,    // 两
                qian: 0.005     // 钱
            },
            
            // 面积单位转换系数（以平方米为基准）
            area: {
                mm2: 0.000001,  // 平方毫米
                cm2: 0.0001,    // 平方厘米
                m2: 1,          // 平方米
                ha: 10000,      // 公顷
                km2: 1000000,   // 平方公里
                in2: 0.00064516,// 平方英寸
                ft2: 0.092903,  // 平方英尺
                acre: 4046.86,  // 英亩
                mu: 666.667,     // 亩
                fen: 66.6667,   // 分
                li: 6.66667     // 厘
            },
            
            // 体积单位转换系数（以升为基准）
            volume: {
                ml: 0.001,      // 毫升
                l: 1,           // 升
                m3: 1000,       // 立方米
                floz: 0.0295735,// 液盎司
                pt: 0.568261,   // 品脱
                gal: 4.54609,   // 加仑
                sheng: 1,       // 升
                dou: 10,        // 斗
                dan: 100        // 石
            },
            
            // 速度单位转换系数（以米/秒为基准）
            speed: {
                m_s: 1,         // 米/秒
                km_h: 0.277778, // 千米/小时
                mph: 0.44704,   // 英里/小时
                knot: 0.514444  // 节
            },
            
            // 时间单位转换系数（以秒为基准）
            time: {
                s: 1,           // 秒
                min: 60,        // 分钟
                h: 3600,        // 小时
                day: 86400,     // 天
                week: 604800    // 周
            },
            
            // 数据存储单位转换系数（以字节为基准）
            data: {
                bit: 0.125,     // 比特
                B: 1,           // 字节
                KB: 1024,       // 千字节
                MB: 1048576,    // 兆字节
                GB: 1073741824, // 吉字节
                TB: 1099511627776 // 太字节
            },
            
            // 能量单位转换系数（以焦耳为基准）
            energy: {
                J: 1,           // 焦耳
                cal: 4.184,     // 卡路里
                kWh: 3600000,   // 千瓦时
                eV: 1.602e-19   // 电子伏特
            },
            
            // 功率单位转换系数（以瓦特为基准）
            power: {
                W: 1,           // 瓦特
                kW: 1000,       // 千瓦
                hp: 745.7       // 马力
            },
            
            // 压力单位转换系数（以帕斯卡为基准）
            pressure: {
                Pa: 1,          // 帕斯卡
                bar: 100000,    // 巴
                atm: 101325,    // 大气压
                mmHg: 133.322    // 毫米汞柱
            },
            
            // 角度单位转换系数（以度为基准）
            angle: {
                deg: 1,         // 度
                rad: 57.2958,   // 弧度
                grad: 0.9        // 梯度
            },
            
            // 频率单位转换系数（以赫兹为基准）
            frequency: {
                Hz: 1,          // 赫兹
                kHz: 1000,     // 千赫
                MHz: 1000000    // 兆赫
            },
            
            // 温度转换函数（特殊处理）
            temperature: {
                c: (val, toUnit) => {
                    if (toUnit === 'f') return val * 9/5 + 32;
                    if (toUnit === 'k') return val + 273.15;
                    return val;
                },
                f: (val, toUnit) => {
                    if (toUnit === 'c') return (val - 32) * 5/9;
                    if (toUnit === 'k') return (val - 32) * 5/9 + 273.15;
                    return val;
                },
                k: (val, toUnit) => {
                    if (toUnit === 'c') return val - 273.15;
                    if (toUnit === 'f') return (val - 273.15) * 9/5 + 32;
                    return val;
                }
            }
        };

        // 显示指定类别的面板
        function showCategory(category) {
            // 隐藏所有面板
            document.querySelectorAll('.category-panel').forEach(panel => {
                panel.classList.remove('active');
            });
            
            // 取消所有标签的激活状态
            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // 显示选中的面板
            document.getElementById(category).classList.add('active');
            
            // 激活选中的标签
            document.querySelector(`.category-tab[onclick="showCategory('${category}')"]`).classList.add('active');
            
            // 触发当前类别的转换计算
            convert(category);
        }

        // 交换单位
        function swapUnits(category) {
            const fromSelect = document.getElementById(`${category}-from`);
            const toSelect = document.getElementById(`${category}-to`);
            const temp = fromSelect.value;
            fromSelect.value = toSelect.value;
            toSelect.value = temp;
            
            // 重新计算
            convert(category);
        }

        // 通用转换函数
        function convert(category) {
            const input = parseFloat(document.getElementById(`${category}-input`).value) || 0;
            const fromUnit = document.getElementById(`${category}-from`).value;
            const toUnit = document.getElementById(`${category}-to`).value;
            
            let result;
            if (category === 'temperature') {
                // 温度特殊处理
                result = conversionFactors.temperature[fromUnit](input, toUnit);
            } else {
                // 转换为基准单位
                const baseValue = input * conversionFactors[category][fromUnit];
                // 从基准单位转换为目标单位
                result = baseValue / conversionFactors[category][toUnit];
            }
            
            // 根据结果大小选择合适的精度
            const precision = Math.abs(result) < 1 ? 6 : 2;
            document.getElementById(`${category}-result`).textContent = result.toFixed(precision);
        }

        // 页面加载时初始化
        window.onload = function() {
            convert('length'); // 初始化显示长度转换结果
        };
    </script>
