<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPT大纲生成工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#8B5CF6',
                        secondary: '#A78BFA',
                        accent: '#F3E8FF',
                        neutral: '#F9FAFB',
                        warning: '#FBBF24'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .card-shadow {
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.03);
            }
            .hover-lift {
                transition: transform 0.3s ease, box-shadow 0.3s ease;
            }
            .hover-lift:hover {
                transform: translateY(-3px);
                box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            }
            .slide-item {
                transition: all 0.2s ease;
            }
            .slide-item:hover {
                background-color: rgba(139, 92, 246, 0.05);
            }
            .slide-placeholder {
                border: 2px dashed #ddd;
                background-color: rgba(255, 255, 255, 0.5);
            }
            .editing-border {
                border: 2px dashed #8B5CF6;
            }
            .placeholder-text {
                color: #D97706;
                background-color: rgba(251, 191, 36, 0.1);
                padding: 0 3px;
                border-radius: 2px;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-50 to-indigo-50 min-h-screen font-sans text-gray-800">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- 头部 -->
        <header class="text-center mb-10">
            <div class="inline-block p-3 bg-primary/10 rounded-full mb-4">
                <i class="fa fa-file-powerpoint-o text-3xl text-primary"></i>
            </div>
            <h1 class="text-[clamp(1.8rem,5vw,2.5rem)] font-bold mb-3">PPT大纲生成工具</h1>
            <p class="text-gray-600 max-w-2xl mx-auto">快速生成逻辑清晰的PPT结构，告别从零构思的烦恼</p>
        </header>
        
        <!-- 主内容区 -->
        <main class="space-y-8">
            <!-- 输入区域 -->
            <section class="bg-white rounded-2xl p-6 md:p-8 card-shadow">
                <h2 class="text-xl font-semibold mb-6 flex items-center">
                    <i class="fa fa-pencil-square-o text-primary mr-2"></i> 输入PPT信息
                </h2>
                
                <form id="pptForm" class="space-y-6">
                    <!-- PPT主题 -->
                    <div>
                        <label for="topic" class="block text-sm font-medium text-gray-700 mb-2">PPT主题</label>
                        <div class="relative">
                            <input type="text" id="topic" placeholder="例如：2023年度工作总结、产品发布会演示" required
                                class="block w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fa fa-header text-gray-400"></i>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 模板选择 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">PPT类型模板</label>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <label class="cursor-pointer">
                                <input type="radio" name="template" value="report" class="hidden" checked>
                                <div class="border-2 border-primary/30 bg-primary/5 hover:bg-primary/10 rounded-lg p-4 text-center transition-all hover-lift">
                                    <i class="fa fa-bar-chart text-primary text-xl mb-2"></i>
                                    <span class="block font-medium">汇报总结</span>
                                    <span class="text-xs text-gray-500 mt-1">工作/项目/年度总结</span>
                                </div>
                            </label>
                            
                            <label class="cursor-pointer">
                                <input type="radio" name="template" value="presentation" class="hidden">
                                <div class="border-2 border-primary/30 bg-primary/5 hover:bg-primary/10 rounded-lg p-4 text-center transition-all hover-lift">
                                    <i class="fa fa-microphone text-primary text-xl mb-2"></i>
                                    <span class="block font-medium">演讲演示</span>
                                    <span class="text-xs text-gray-500 mt-1">产品/方案/主题演讲</span>
                                </div>
                            </label>
                            
                            <label class="cursor-pointer">
                                <input type="radio" name="template" value="teaching" class="hidden">
                                <div class="border-2 border-primary/30 bg-primary/5 hover:bg-primary/10 rounded-lg p-4 text-center transition-all hover-lift">
                                    <i class="fa fa-graduation-cap text-primary text-xl mb-2"></i>
                                    <span class="block font-medium">教学培训</span>
                                    <span class="text-xs text-gray-500 mt-1">课程/培训/知识分享</span>
                                </div>
                            </label>
                        </div>
                    </div>
                    
                    <!-- 关键点 -->
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-sm font-medium text-gray-700">核心关键点（至少3个）</label>
                            <button type="button" id="addKeyPoint" class="text-sm text-primary hover:text-primary/80 transition-colors">
                                <i class="fa fa-plus-circle mr-1"></i> 添加
                            </button>
                        </div>
                        
                        <div id="keyPointsContainer" class="space-y-3">
                            <div class="relative key-point-item">
                                <input type="text" placeholder="例如：项目完成情况、遇到的问题、未来计划" required
                                    class="block w-full pl-10 pr-10 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="fa fa-circle text-xs text-primary mt-0.5"></i>
                                </div>
                                <button type="button" class="remove-key-point absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-red-500 transition-colors">
                                    <i class="fa fa-times"></i>
                                </button>
                            </div>
                            
                            <div class="relative key-point-item">
                                <input type="text" placeholder="输入第二个关键点..." required
                                    class="block w-full pl-10 pr-10 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="fa fa-circle text-xs text-primary mt-0.5"></i>
                                </div>
                                <button type="button" class="remove-key-point absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-red-500 transition-colors">
                                    <i class="fa fa-times"></i>
                                </button>
                            </div>
                            
                            <div class="relative key-point-item">
                                <input type="text" placeholder="输入第三个关键点..." required
                                    class="block w-full pl-10 pr-10 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="fa fa-circle text-xs text-primary mt-0.5"></i>
                                </div>
                                <button type="button" class="remove-key-point absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-red-500 transition-colors">
                                    <i class="fa fa-times"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 生成按钮 -->
                    <div class="pt-2">
                        <button type="submit" id="generateBtn" 
                            class="w-full bg-primary hover:bg-primary/90 text-white font-medium py-3 px-6 rounded-lg transition-all duration-300 flex items-center justify-center">
                            <i class="fa fa-magic mr-2"></i> 生成PPT大纲
                        </button>
                    </div>
                </form>
            </section>
            
            <!-- 加载状态 -->
            <section id="loadingSection" class="bg-white rounded-2xl p-6 card-shadow hidden">
                <div class="flex flex-col items-center justify-center py-10">
                    <div class="w-16 h-16 border-4 border-primary/30 border-t-primary rounded-full animate-spin mb-6"></div>
                    <h3 class="text-lg font-medium mb-2">正在生成PPT大纲</h3>
                    <p class="text-gray-500 text-center max-w-md">正在根据您的输入构建逻辑清晰的PPT结构，请稍候...</p>
                </div>
            </section>
            
            <!-- 结果区域 -->
            <section id="resultSection" class="bg-white rounded-2xl p-6 card-shadow hidden">
                <div class="flex flex-col md:flex-row md:items-center justify-between mb-6">
                    <h2 class="text-xl font-semibold flex items-center">
                        <i class="fa fa-file-text-o text-primary mr-2"></i> 生成的PPT大纲
                        <span class="ml-3 text-sm bg-primary/10 text-primary px-2 py-1 rounded-full" id="totalSlides">0页</span>
                    </h2>
                    <div class="flex flex-wrap gap-3 mt-4 md:mt-0">
                        <button id="copyBtn" class="bg-secondary hover:bg-secondary/90 text-white font-medium py-2 px-4 rounded-lg transition-all duration-300 flex items-center">
                            <i class="fa fa-copy mr-2"></i> 复制大纲
                        </button>
                        <button id="downloadBtn" class="bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded-lg transition-all duration-300 flex items-center">
                            <i class="fa fa-download mr-2"></i> 导出文本
                        </button>
                        <button id="regenerateBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium py-2 px-4 rounded-lg transition-all duration-300 flex items-center">
                            <i class="fa fa-refresh mr-2"></i> 重新生成
                        </button>
                    </div>
                </div>
                
                <!-- 预览控制区 -->
                <div class="bg-gray-50 px-4 py-3 border border-gray-200 rounded-lg mb-6 flex flex-wrap gap-4 items-center justify-between">
                    <div class="flex flex-wrap gap-3">
                        <button id="expandAllBtn" class="text-sm bg-white border border-gray-300 hover:border-primary px-3 py-1.5 rounded-lg transition-all duration-300 flex items-center">
                            <i class="fa fa-expand mr-1"></i> 全部展开
                        </button>
                        <button id="addSlideBtn" class="text-sm bg-primary/10 text-primary hover:bg-primary/20 px-3 py-1.5 rounded-lg transition-all duration-300 flex items-center">
                            <i class="fa fa-plus mr-1"></i> 新增页面
                        </button>
                    </div>
                    
                    <div class="flex items-center text-sm text-gray-600">
                        <span id="currentPageInfo">当前页：1/0</span>
                        <div class="ml-4 flex gap-2">
                            <button id="prevPageBtn" class="p-1.5 rounded hover:bg-gray-200 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                                <i class="fa fa-chevron-left"></i>
                            </button>
                            <button id="nextPageBtn" class="p-1.5 rounded hover:bg-gray-200 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                                <i class="fa fa-chevron-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- 大纲内容区 -->
                <div class="flex flex-col lg:flex-row gap-6">
                    <!-- 左侧缩略图导航 (仅在大屏幕显示) -->
                    <div class="hidden lg:block w-40 flex-shrink-0">
                        <div class="sticky top-4 max-h-[600px] overflow-y-auto pr-2">
                            <h3 class="text-sm font-medium text-gray-500 mb-3">页面导航</h3>
                            <div id="slideThumbnails" class="space-y-2">
                                <!-- 缩略图将在这里动态生成 -->
                            </div>
                        </div>
                    </div>
                    
                    <!-- 右侧详情预览 -->
                    <div class="flex-grow">
                        <div class="border border-gray-200 rounded-lg">
                            <div class="bg-gray-50 px-4 py-3 border-b border-gray-200">
                                <p class="text-sm text-gray-600"><i class="fa fa-info-circle mr-1"></i> 点击标题或内容可直接编辑，支持拖拽调整顺序</p>
                            </div>
                            
                            <div id="outlineContainer" class="p-4 max-h-[600px] overflow-y-auto">
                                <!-- 生成的PPT大纲将在这里显示 -->
                            </div>
                        </div>
                        
                        <!-- 内容建议区 -->
                        <div id="contentSuggestions" class="mt-6 bg-accent rounded-lg p-4 hidden">
                            <h3 class="font-medium mb-3 flex items-center">
                                <i class="fa fa-lightbulb-o text-primary mr-2"></i> 内容建议
                            </h3>
                            <ul id="suggestionsList" class="text-sm text-gray-700 space-y-2 list-disc list-inside">
                                <!-- 内容建议将在这里动态生成 -->
                            </ul>
                            <button id="closeSuggestions" class="mt-3 text-xs text-primary hover:text-primary/80">
                                <i class="fa fa-times mr-1"></i> 关闭建议
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- 导出前校验提示 -->
                <div id="exportCheck" class="mt-6 bg-yellow-50 border border-yellow-200 rounded-lg p-4 hidden">
                    <h3 class="font-medium mb-2 flex items-center text-yellow-800">
                        <i class="fa fa-exclamation-triangle text-yellow-600 mr-2"></i> 导出前检查
                    </h3>
                    <ul id="checkList" class="text-sm text-yellow-700 space-y-1 list-disc list-inside">
                        <!-- 检查项将在这里动态生成 -->
                    </ul>
                    <div class="mt-3 flex gap-2">
                        <button id="fixIssuesBtn" class="text-sm bg-yellow-100 text-yellow-800 hover:bg-yellow-200 px-3 py-1.5 rounded-lg transition-all duration-300">
                            去修改
                        </button>
                        <button id="ignoreIssuesBtn" class="text-sm bg-gray-100 text-gray-800 hover:bg-gray-200 px-3 py-1.5 rounded-lg transition-all duration-300">
                            忽略并导出
                        </button>
                    </div>
                </div>
            </section>
            
            <!-- 工具特点 -->
            <section class="bg-white rounded-2xl p-6 card-shadow">
                <h2 class="text-xl font-semibold mb-6 flex items-center">
                    <i class="fa fa-star text-primary mr-2"></i> 工具特点
                </h2>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="flex flex-col items-center text-center p-4 hover-lift">
                        <div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center mb-4">
                            <i class="fa fa-sitemap text-primary text-xl"></i>
                        </div>
                        <h3 class="font-medium mb-2">逻辑清晰</h3>
                        <p class="text-sm text-gray-600">自动生成结构化PPT框架，避免思路混乱</p>
                    </div>
                    
                    <div class="flex flex-col items-center text-center p-4 hover-lift">
                        <div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center mb-4">
                            <i class="fa fa-templates text-primary text-xl"></i>
                        </div>
                        <h3 class="font-medium mb-2">专业模板</h3>
                        <p class="text-sm text-gray-600">针对不同场景提供定制化大纲结构</p>
                    </div>
                    
                    <div class="flex flex-col items-center text-center p-4 hover-lift">
                        <div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center mb-4">
                            <i class="fa fa-edit text-primary text-xl"></i>
                        </div>
                        <h3 class="font-medium mb-2">灵活编辑</h3>
                        <p class="text-sm text-gray-600">支持在线修改和导出，无缝对接PPT软件</p>
                    </div>
                </div>
            </section>
        </main>
        
        <!-- 页脚信息 -->
        <footer class="mt-16 pt-6 border-t border-gray-200 text-center text-gray-600 text-sm">
            <p class="mb-2">本工具由 邓文涛(AI版) 制作</p>
            <p class="mb-2">微信：707547441</p>
            <p>QQ邮箱：<a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="bb8c8b8c8e8f8c8f8f8afbcaca95d8d4d6">[email&#160;protected]</a></p>
        </footer>
    </div>
    
    <!-- 提示弹窗 -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-300 flex items-center px-4 py-3 rounded-lg shadow-lg z-50">
        <i class="fa fa-check-circle mr-2"></i>
        <span id="toastMessage"></span>
    </div>

    <!-- 操作历史记录 -->
    <div id="operationHistory" class="hidden">
        <!-- 用于存储操作历史，实现撤销功能 -->
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 全局变量
        let currentOutline = [];
        let currentSlideIndex = 0;
        let operationHistory = [];
        let historyPosition = -1;
        const MAX_HISTORY = 10; // 最大历史记录数
        
        // DOM元素
        const pptForm = document.getElementById('pptForm');
        const topicInput = document.getElementById('topic');
        const addKeyPointBtn = document.getElementById('addKeyPoint');
        const keyPointsContainer = document.getElementById('keyPointsContainer');
        const generateBtn = document.getElementById('generateBtn');
        const loadingSection = document.getElementById('loadingSection');
        const resultSection = document.getElementById('resultSection');
        const outlineContainer = document.getElementById('outlineContainer');
        const slideThumbnails = document.getElementById('slideThumbnails');
        const totalSlidesEl = document.getElementById('totalSlides');
        const currentPageInfo = document.getElementById('currentPageInfo');
        const prevPageBtn = document.getElementById('prevPageBtn');
        const nextPageBtn = document.getElementById('nextPageBtn');
        const expandAllBtn = document.getElementById('expandAllBtn');
        const addSlideBtn = document.getElementById('addSlideBtn');
        const copyBtn = document.getElementById('copyBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const regenerateBtn = document.getElementById('regenerateBtn');
        const contentSuggestions = document.getElementById('contentSuggestions');
        const suggestionsList = document.getElementById('suggestionsList');
        const closeSuggestions = document.getElementById('closeSuggestions');
        const exportCheck = document.getElementById('exportCheck');
        const checkList = document.getElementById('checkList');
        const fixIssuesBtn = document.getElementById('fixIssuesBtn');
        const ignoreIssuesBtn = document.getElementById('ignoreIssuesBtn');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        const templateRadios = document.querySelectorAll('input[name="template"]');
        
        // 初始化模板选择样式
        templateRadios.forEach(radio => {
            radio.addEventListener('change', function() {
                // 移除所有选中样式
                templateRadios.forEach(r => {
                    const parentDiv = r.nextElementSibling;
                    parentDiv.classList.remove('bg-primary/10', 'border-primary');
                });
                
                // 为选中项添加样式
                if (this.checked) {
                    const parentDiv = this.nextElementSibling;
                    parentDiv.classList.add('bg-primary/10', 'border-primary');
                }
            });
        });
        
        // 默认选中汇报总结模板
        document.querySelector('input[name="template"][value="report"]').nextElementSibling.classList.add('bg-primary/10', 'border-primary');
        
        // 添加关键点
        addKeyPointBtn.addEventListener('click', () => {
            const keyPointCount = document.querySelectorAll('.key-point-item').length;
            
            if (keyPointCount < 10) { // 限制最大10个关键点
                const newKeyPoint = document.createElement('div');
                newKeyPoint.className = 'relative key-point-item';
                newKeyPoint.innerHTML = `
                    <input type="text" placeholder="输入第${keyPointCount + 1}个关键点..." required
                        class="block w-full pl-10 pr-10 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa fa-circle text-xs text-primary mt-0.5"></i>
                    </div>
                    <button type="button" class="remove-key-point absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-red-500 transition-colors">
                        <i class="fa fa-times"></i>
                    </button>
                `;
                
                keyPointsContainer.appendChild(newKeyPoint);
                
                // 添加删除事件
                newKeyPoint.querySelector('.remove-key-point').addEventListener('click', function() {
                    if (document.querySelectorAll('.key-point-item').length > 3) {
                        newKeyPoint.remove();
                    } else {
                        showToast('至少需要3个关键点', 'error');
                    }
                });
                
                // 滚动到新添加的输入框
                newKeyPoint.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                newKeyPoint.querySelector('input').focus();
            } else {
                showToast('最多支持10个关键点', 'error');
            }
        });
        
        // 初始删除关键点事件
        document.querySelectorAll('.remove-key-point').forEach(btn => {
            btn.addEventListener('click', function() {
                if (document.querySelectorAll('.key-point-item').length > 3) {
                    this.closest('.key-point-item').remove();
                } else {
                    showToast('至少需要3个关键点', 'error');
                }
            });
        });
        
        // 表单提交事件
        pptForm.addEventListener('submit', function(e) {
            e.preventDefault();
            generatePPTOutline();
        });
        
        // 重新生成按钮事件
        regenerateBtn.addEventListener('click', generatePPTOutline);
        
        // 复制按钮事件
        copyBtn.addEventListener('click', copyOutlineToClipboard);
        
        // 下载按钮事件
        downloadBtn.addEventListener('click', () => {
            // 显示导出前检查
            const issues = checkForIssues();
            if (issues.length > 0) {
                showExportCheck(issues);
            } else {
                downloadOutlineAsText();
            }
        });
        
        // 全部展开/折叠按钮事件
        expandAllBtn.addEventListener('click', toggleExpandAll);
        
        // 上一页/下一页按钮事件
        prevPageBtn.addEventListener('click', goToPrevPage);
        nextPageBtn.addEventListener('click', goToNextPage);
        
        // 添加新页面按钮事件
        addSlideBtn.addEventListener('click', addNewSlide);
        
        // 关闭建议按钮事件
        closeSuggestions.addEventListener('click', () => {
            contentSuggestions.classList.add('hidden');
        });
        
        // 去修改按钮事件
        fixIssuesBtn.addEventListener('click', () => {
            exportCheck.classList.add('hidden');
            // 滚动到第一个有问题的页面
            const firstIssueSlide = document.querySelector('.slide-item.has-issue');
            if (firstIssueSlide) {
                firstIssueSlide.scrollIntoView({ behavior: 'smooth', block: 'start' });
                firstIssueSlide.classList.add('editing-border');
                setTimeout(() => {
                    firstIssueSlide.classList.remove('editing-border');

        // 初始化拖拽功能
        function initDragAndDrop() {
            const draggableSlides = document.querySelectorAll('.slide-item');
            let draggedItem = null;
            
            draggableSlides.forEach(slide => {
                // 设置可拖拽
                slide.setAttribute('draggable', 'true');
                
                // 拖拽开始
                slide.addEventListener('dragstart', function(e) {
                    draggedItem = this;
                    setTimeout(() => {
                        this.classList.add('opacity-50');
                    }, 0);
                    e.dataTransfer.setData('text/plain', this.dataset.index);
                });
                
                // 拖拽结束
                slide.addEventListener('dragend', function() {
                    this.classList.remove('opacity-50');
                    draggedItem = null;
                    
                    // 移除所有占位符
                    document.querySelectorAll('.slide-placeholder').forEach(ph => ph.remove());
                    
                    // 更新序号和索引
                    updateSlideNumbersAndIndices();
                    
                    // 保存操作历史
                    saveToHistory();
                });
                
                // 拖拽经过
                slide.addEventListener('dragover', function(e) {
                    e.preventDefault();
                    if (draggedItem !== this) {
                        // 移除所有占位符
                        document.querySelectorAll('.slide-placeholder').forEach(ph => ph.remove());
                        
                        // 创建占位符
                        const rect = this.getBoundingClientRect();
                        const isBelow = e.clientY > rect.top + rect.height / 2;
                        
                        const placeholder = document.createElement('div');
                        placeholder.className = 'slide-placeholder h-16 rounded-lg my-4';
                        
                        if (isBelow) {
                            this.parentNode.insertBefore(placeholder, this.nextSibling);
                        } else {
                            this.parentNode.insertBefore(placeholder, this);
                        }
                    }
                });
                
                // 放置
                slide.addEventListener('drop', function(e) {
                    e.preventDefault();
                    if (draggedItem !== this) {
                        // 移除所有占位符
                        document.querySelectorAll('.slide-placeholder').forEach(ph => ph.remove());
                        
                        const rect = this.getBoundingClientRect();
                        const isBelow = e.clientY > rect.top + rect.height / 2;
                        
                        if (isBelow) {
                            this.parentNode.insertBefore(draggedItem, this.nextSibling);
                        } else {
                            this.parentNode.insertBefore(draggedItem, this);
                        }
                        
                        // 更新大纲数据
                        updateOutlineFromDOM();
                        // 更新缩略图
                        renderSlideThumbnails();
                        // 更新页面导航
                        updatePageNavigation();
                    }
                });
            });
            
            // 容器拖放事件
            outlineContainer.addEventListener('dragover', function(e) {
                e.preventDefault();
            });
            
            outlineContainer.addEventListener('drop', function(e) {
                e.preventDefault();
                if (draggedItem) {
                    // 移除所有占位符
                    document.querySelectorAll('.slide-placeholder').forEach(ph => ph.remove());
                    
                    // 直接添加到容器末尾
                    this.appendChild(draggedItem);
                    
                    // 更新大纲数据
                    updateOutlineFromDOM();
                    // 更新缩略图
                    renderSlideThumbnails();
                    // 更新页面导航
                    updatePageNavigation();
                }
            });
        }
        
        // 生成PPT大纲
        function generatePPTOutline() {
            // 获取表单数据
            const topic = topicInput.value.trim();
            const keyPoints = Array.from(document.querySelectorAll('.key-point-item input'))
                .map(input => input.value.trim())
                .filter(text => text);
            
            const templateType = document.querySelector('input[name="template"]:checked').value;
            
            // 验证输入
            if (!topic) {
                showToast('请输入PPT主题', 'error');
                topicInput.focus();
                return;
            }
            
            if (keyPoints.length < 3) {
                showToast('请至少输入3个关键点', 'error');
                return;
            }
            
            // 显示加载状态
            loadingSection.classList.remove('hidden');
            resultSection.classList.add('hidden');
            
            // 清空历史记录
            operationHistory = [];
            historyPosition = -1;
            
            // 模拟生成延迟
            setTimeout(() => {
                try {
                    // 根据模板类型生成不同的大纲结构
                    let outline;
                    switch (templateType) {
                        case 'report':
                            outline = generateReportOutline(topic, keyPoints);
                            break;
                        case 'presentation':
                            outline = generatePresentationOutline(topic, keyPoints);
                            break;
                        case 'teaching':
                            outline = generateTeachingOutline(topic, keyPoints);
                            break;
                        default:
                            outline = generateReportOutline(topic, keyPoints);
                    }
                    
                    // 保存当前大纲
                    currentOutline = outline;
                    
                    // 显示结果
                    renderOutline(outline);
                    renderSlideThumbnails();
                    updatePageNavigation();
                    
                    // 保存初始状态到历史记录
                    saveToHistory();
                    
                    // 隐藏加载状态，显示结果
                    loadingSection.classList.add('hidden');
                    resultSection.classList.remove('hidden');

                    slideEl.classList.remove('editing-border');

                    renderSlideThumbnails();

                    slideEl.classList.add('editing-border');

                    showContentSuggestions(slide.type, 'content');
                });

                    placeholders.forEach(ph => {

                    });

                    saveToHistory();

                    const html = contentElEditable.innerHTML;
                    const newHtml = html.replace(/\[.*?\]/g, match => 
                        `<span class="placeholder-text">${match}</span>`
                    );
                    if (newHtml !== html) {
                        const cursorPos = getCursorPosition(contentElEditable);
                        contentElEditable.innerHTML = newHtml;

            totalSlidesEl.textContent = `${outline.length}页`;

            checkLogicalGaps();

        // 渲染幻灯片缩略图导航
        function renderSlideThumbnails() {
            slideThumbnails.innerHTML = '';
            
            const slides = document.querySelectorAll('.slide-item');
            slides.forEach((slide, index) => {
                const title = slide.querySelector('.slide-title').innerText || '无标题';

                thumbnail.className = `p-2 rounded border ${index === currentSlideIndex ? 'border-primary bg-primary/5' : 'border-gray-200 hover:border-primary/50'} cursor-pointer transition-all`;

                    <div class="text-xs text-gray-500 mb-1">第${index + 1}页</div>

                    goToSlide(index);
                });
                
                slideThumbnails.appendChild(thumbnail);
            });

        // 更新页面导航信息
        function updatePageNavigation() {
            const slideCount = document.querySelectorAll('.slide-item').length;
            currentPageInfo.textContent = `当前页：${currentSlideIndex + 1}/${slideCount}`;
            
            // 更新按钮状态
            prevPageBtn.disabled = currentSlideIndex === 0;
            nextPageBtn.disabled = currentSlideIndex >= slideCount - 1;
        }
        
        // 前往上一页
        function goToPrevPage() {
            if (currentSlideIndex > 0) {
                goToSlide(currentSlideIndex - 1);
            }
        }
        
        // 前往下一页
        function goToNextPage() {
            const slideCount = document.querySelectorAll('.slide-item').length;
            if (currentSlideIndex < slideCount - 1) {
                goToSlide(currentSlideIndex + 1);
            }
        }
        
        // 前往指定页
        function goToSlide(index) {
            const slides = document.querySelectorAll('.slide-item');
            if (index >= 0 && index < slides.length) {
                currentSlideIndex = index;
                
                // 高亮当前缩略图
                renderSlideThumbnails();
                
                // 滚动到指定幻灯片
                slides[index].scrollIntoView({ behavior: 'smooth', block: 'start' });
                
                // 更新页面信息
                updatePageNavigation();
                
                // 显示该页的内容建议

                showContentSuggestions(slideType, 'both');

        // 切换全部展开/折叠
        function toggleExpandAll() {
            const toggleBtn = document.getElementById('expandAllBtn');
            const allContent = document.querySelectorAll('.slide-content');
            const allIcons = document.querySelectorAll('.toggle-slide i');
            
            // 检查当前状态
            const allExpanded = !Array.from(allContent).some(el => el.classList.contains('hidden'));
            
            if (allExpanded) {
                // 全部折叠
                allContent.forEach(el => el.classList.add('hidden'));
                allIcons.forEach(icon => icon.className = 'fa fa-chevron-right');
                toggleBtn.innerHTML = '<i class="fa fa-expand mr-1"></i> 全部展开';
            } else {
                // 全部展开
                allContent.forEach(el => el.classList.remove('hidden'));
                allIcons.forEach(icon => icon.className = 'fa fa-chevron-down');
                toggleBtn.innerHTML = '<i class="fa fa-compress mr-1"></i> 全部折叠';
            }
        }
        
        // 添加新幻灯片
        function addNewSlide() {
            const newIndex = currentSlideIndex + 1;
            const slideCount = document.querySelectorAll('.slide-item').length;
            
            // 创建新幻灯片数据
            const newSlide = {
                title: `新幻灯片 ${slideCount + 1}`,
                content: `• 内容点 1\n• 内容点 2\n• 内容点 3`,
                type: 'content'
            };

            renderSlideThumbnails();
            
            // 跳转到新幻灯片
            goToSlide(newIndex);

            saveToHistory();

        // 从DOM更新大纲数据
        function updateOutlineFromDOM() {
            const slides = document.querySelectorAll('.slide-item');
            currentOutline = Array.from(slides).map(slide => {
                // 移除HTML标签，获取纯文本
                const titleText = slide.querySelector('.slide-title').innerText.trim();
                
                // 处理内容中的换行和列表
                const contentEl = slide.querySelector('.slide-content');
                let contentText = contentEl.innerText.trim();
                
                // 保留换行符
                contentText = contentText.replace(/\n/g, '\n');
                
                return {
                    title: titleText,
                    content: contentText,
                    type: slide.dataset.type
                };
            });
            
            // 更新总页数显示
            totalSlidesEl.textContent = `${currentOutline.length}页`;
            
            // 检查逻辑断层
            checkLogicalGaps();
        }
        
        // 更新幻灯片序号和索引
        function updateSlideNumbersAndIndices() {
            const slides = document.querySelectorAll('.slide-item');
            slides.forEach((slide, index) => {
                slide.dataset.index = index;
                slide.querySelector('.slide-number').textContent = index + 1;
            });
            
            // 从DOM更新大纲数据
            updateOutlineFromDOM();
        }
        
        // 显示内容建议
        function showContentSuggestions(slideType, context) {
            // 根据幻灯片类型和上下文提供相关建议
            let suggestions = [];
            
            switch (slideType) {
                case 'title':
                    suggestions = [
                        "标题应简洁明了，突出主题核心",
                        "可包含时间、地点等关键信息",
                        "避免过长，建议不超过20个字"
                    ];
                    break;
                    
                case 'opening':
                    if (context === 'title' || context === 'both') {
                        suggestions.push("开场标题应能吸引听众注意力");
                        suggestions.push("可以使用问题、数据或故事性标题");
                    }
                    if (context === 'content' || context === 'both') {
                        suggestions.push("开场可简要介绍自己和主题");
                        suggestions.push("说明演讲的目的和听众能获得的价值");
                        suggestions.push("控制在1-2分钟内的内容量");
                    }
                    break;
                    
                case 'content':
                    if (context === 'title' || context === 'both') {
                        suggestions.push("标题应明确表达本段的核心观点");
                        suggestions.push("使用动词开头更具行动力");
                    }
                    if (context === 'content' || context === 'both') {
                        suggestions.push("每个要点配一个具体案例或数据支持");
                        suggestions.push("控制在3-5个要点以内，避免信息过载");
                        suggestions.push("使用统一的格式（如都是短语或完整句子）");
                    }
                    break;
                    
                case 'analysis':
                    suggestions = [
                        "分析部分应基于事实和数据",
                        "可使用对比、趋势等分析方法",
                        "突出关键发现和洞察"
                    ];
                    break;
                    
                case 'conclusion':
                    suggestions = [
                        "总结部分应简明扼要地回顾核心观点",
                        "可提出具体的行动建议",
                        "与开场内容呼应，形成完整闭环"
                    ];
                    break;
                    
                case 'closing':
                    suggestions = [
                        "结束语应真诚感谢听众",
                        "可提供后续交流的方式",
                        "保持积极正面的收尾"
                    ];
                    break;
                    
                default:
                    suggestions = [
                        "确保内容与标题一致",
                        "使用简洁明了的语言",
                        "重点内容可加粗或单独列出"
                    ];
            }
            
            // 显示建议
            suggestionsList.innerHTML = '';
            suggestions.forEach(suggestion => {
                const li = document.createElement('li');
                li.innerHTML = suggestion;
                li.className = "cursor-pointer hover:text-primary transition-colors";
                li.addEventListener('click', () => {
                    // 点击建议可插入到内容中
                    const activeSlide = document.querySelector(`.slide-item[data-index="${currentSlideIndex}"]`);
                    if (activeSlide) {
                        const contentEl = activeSlide.querySelector('.slide-content');
                        contentEl.focus();
                        document.execCommand('insertText', false, `\n• ${suggestion}`);
                        updateOutlineFromDOM();
                    }
                });
                suggestionsList.appendChild(li);
            });
            
            contentSuggestions.classList.remove('hidden');
        }
        
        // 检查逻辑断层
        function checkLogicalGaps() {
            // 清除之前的警告
            document.querySelectorAll('.logic-gap-warning').forEach(el => el.remove());
            
            const slides = document.querySelectorAll('.slide-item');
            if (slides.length < 2) return;
            
            // 简单的逻辑检查：比较相邻幻灯片的标题
            for (let i = 0; i < slides.length - 1; i++) {
                const currentTitle = slides[i].querySelector('.slide-title').innerText.toLowerCase();
                const nextTitle = slides[i+1].querySelector('.slide-title').innerText.toLowerCase();
                
                // 检查标题是否有逻辑关联（简单的关键词匹配）
                const currentKeywords = currentTitle.split(/\W+/).filter(word => word.length > 2);
                const nextKeywords = nextTitle.split(/\W+/).filter(word => word.length > 2);
                
                const commonKeywords = currentKeywords.filter(word => nextKeywords.includes(word));
                
                // 如果没有共同关键词，可能存在逻辑断层
                if (commonKeywords.length === 0) {
                    const warningEl = document.createElement('div');
                    warningEl.className = 'logic-gap-warning text-xs text-yellow-600 mt-2 flex items-center';
                    warningEl.innerHTML = '<i class="fa fa-exclamation-triangle mr-1"></i> 注意：与下一页内容可能缺乏逻辑衔接';
                    
                    // 添加到当前幻灯片底部
                    const contentEl = slides[i].querySelector('.slide-content');
                    slides[i].insertBefore(warningEl, contentEl.nextSibling);
                }
            }
        }
        
        // 检查导出前的问题
        function checkForIssues() {
            const issues = [];
            const slides = document.querySelectorAll('.slide-item');
            
            // 清除之前的问题标记
            slides.forEach(slide => slide.classList.remove('has-issue'));
            
            // 检查空页面
            slides.forEach((slide, index) => {
                const title = slide.querySelector('.slide-title').innerText.trim();
                const content = slide.querySelector('.slide-content').innerText.trim();
                
                if (!title && !content) {
                    issues.push(`第${index + 1}页：标题和内容均为空`);
                    slide.classList.add('has-issue');
                } else if (!title) {
                    issues.push(`第${index + 1}页：缺少标题`);
                    slide.classList.add('has-issue');
                }
                
                // 检查未替换的占位符
                if (content.includes('[') && content.includes(']')) {
                    issues.push(`第${index + 1}页：存在未替换的占位符（如[您的姓名]）`);
                    slide.classList.add('has-issue');
                }
            });
            
            // 检查页数过少
            if (slides.length < 3) {
                issues.push(`总页数较少（仅${slides.length}页），可能内容不够完整`);
            }
            
            return issues;
        }
        
        // 显示导出前检查
        function showExportCheck(issues) {
            checkList.innerHTML = '';
            
            issues.forEach(issue => {
                const li = document.createElement('li');
                li.textContent = issue;
                checkList.appendChild(li);
            });
            
            exportCheck.classList.remove('hidden');
            exportCheck.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        
        // 复制大纲到剪贴板
        function copyOutlineToClipboard() {
            const slides = document.querySelectorAll('.slide-item');
            let textToCopy = '';
            
            slides.forEach((slide, index) => {
                const title = slide.querySelector('.slide-title').innerText.trim();
                const content = slide.querySelector('.slide-content').innerText.trim();
                
                textToCopy += `【第${index + 1}页】${title}\n`;
                textToCopy += `内容：\n${content}\n\n`;
            });
            
            if (!textToCopy) {
                showToast('没有可复制的内容', 'error');
                return;
            }
            
            navigator.clipboard.writeText(textToCopy)
                .then(() => {
                    showToast('PPT大纲已复制到剪贴板');
                })
                .catch(err => {
                    console.error('复制失败:', err);
                    showToast('复制失败，请手动复制', 'error');
                });
        }
        
        // 下载大纲为文本文件
        function downloadOutlineAsText() {
            const slides = document.querySelectorAll('.slide-item');
            let textContent = '';
            const topic = topicInput.value.trim() || 'PPT大纲';
            
            slides.forEach((slide, index) => {
                const title = slide.querySelector('.slide-title').innerText.trim();
                const content = slide.querySelector('.slide-content').innerText.trim();
                
                textContent += `【第${index + 1}页】${title}\n`;
                textContent += `内容：\n${content}\n\n`;
            });
            
            if (!textContent) {
                showToast('没有可下载的内容', 'error');
                return;
            }
            
            // 创建Blob并下载
            const blob = new Blob([textContent], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${topic} - PPT大纲.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showToast('PPT大纲已下载为文本文件');
        }
        
        // 保存操作历史
        function saveToHistory() {
            // 移除当前位置之后的历史
            if (historyPosition < operationHistory.length - 1) {
                operationHistory = operationHistory.slice(0, historyPosition + 1);
            }
            
            // 深拷贝当前大纲状态
            const currentState = JSON.parse(JSON.stringify(currentOutline));
            operationHistory.push(currentState);
            
            // 限制历史记录数量
            if (operationHistory.length > MAX_HISTORY) {
                operationHistory.shift();
            }
            
            // 更新历史位置
            historyPosition = operationHistory.length - 1;
            
            // 注册撤销快捷键
            document.addEventListener('keydown', handleUndoRedo);
        }
        
        // 处理撤销重做快捷键
        function handleUndoRedo(e) {
            // Ctrl+Z 撤销
            if (e.ctrlKey && e.key === 'z') {
                e.preventDefault();
                if (historyPosition > 0) {
                    historyPosition--;
                    currentOutline = JSON.parse(JSON.stringify(operationHistory[historyPosition]));
                    renderOutline(currentOutline);
                    renderSlideThumbnails();
                    updatePageNavigation();
                    showToast('已撤销上一步操作');
                }
            }
            // Ctrl+Y 重做
            else if (e.ctrlKey && e.key === 'y') {
                e.preventDefault();
                if (historyPosition < operationHistory.length - 1) {
                    historyPosition++;
                    currentOutline = JSON.parse(JSON.stringify(operationHistory[historyPosition]));
                    renderOutline(currentOutline);
                    renderSlideThumbnails();
                    updatePageNavigation();
                    showToast('已重做操作');
                }
            }
        }
        
        // 获取幻灯片类型标签
        function getSlideTypeLabel(type) {
            const labels = {
                'title': '标题页',
                'opening': '开场页',
                'table-of-contents': '目录页',
                'overview': '概述页',
                'analysis': '分析页',
                'content': '内容页',
                'detailed': '详情页',
                'conclusion': '总结页',
                'qna': '问答页',
                'closing': '结束页',
                'prerequisite': '基础回顾',
                'module': '模块介绍',
                'practice': '实践应用',
                'exercises': '练习巩固',
                'summary': '内容总结',
                'assessment': '测试反馈',
                'resources': '资源答疑'
            };
            
            return labels[type] || '普通页';
        }
        
        // 显示提示信息
        function showToast(message, type = 'success') {
            toastMessage.textContent = message;
            
            // 设置提示样式
            if (type === 'success') {
                toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-3 rounded-lg shadow-lg z-50 bg-green-500 text-white';
                toast.querySelector('i').className = 'fa fa-check-circle mr-2';
            } else {
                toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-3 rounded-lg shadow-lg z-50 bg-red-500 text-white';
                toast.querySelector('i').className = 'fa fa-exclamation-circle mr-2';
            }
            
            // 3秒后隐藏提示
            setTimeout(() => {
                toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-300 flex items-center px-4 py-3 rounded-lg shadow-lg z-50';
            }, 3000);
        }
        
        // 防抖函数
        function debounce(func, wait) {
            let timeout;
            return function() {
                const context = this;
                const args = arguments;
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(context, args), wait);
            };
        }
        
        // 获取光标位置
        function getCursorPosition(element) {
            let cursorPos = 0;
            if (document.selection) {
                // IE
                const selection = document.selection.createRange();
                selection.moveStart('character', -element.value.length);
                cursorPos = selection.text.length;
            } else if (element.selectionStart || element.selectionStart === 0) {
                // 标准浏览器
                cursorPos = element.selectionStart;
            }
            return cursorPos;
        }
        
        // 设置光标位置
        function setCursorPosition(element, pos) {
            if (element.setSelectionRange) {
                element.focus();
                element.setSelectionRange(pos, pos);
            } else if (element.createTextRange) {
                const range = element.createTextRange();
                range.collapse(true);
                range.moveEnd('character', pos);
                range.moveStart('character', pos);
                range.select();
            }
        }
        
        // 初始化页面
        document.addEventListener('DOMContentLoaded', () => {
            // 支持撤销重做快捷键
            document.addEventListener('keydown', handleUndoRedo);
        });
    </script>
