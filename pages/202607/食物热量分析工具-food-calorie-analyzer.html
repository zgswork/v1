<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食物热量分析工具</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            padding: 30px;
        }

        .input-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 15px;
            align-items: end;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        input, select {
            padding: 12px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .results-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .food-list {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
        }

        .stats-panel {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 25px;
            border-radius: 15px;
        }

        .food-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .food-info {
            flex: 1;
        }

        .food-name {
            font-weight: 600;
            color: #333;
        }

        .food-details {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        .food-calories {
            font-size: 1.2em;
            font-weight: 600;
            color: #ff6b6b;
        }

        .delete-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            margin-left: 10px;
        }

        .stat-item {
            margin-bottom: 20px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: 600;
        }

        .chart-container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-top: 30px;
            height: 400px;
            position: relative;
        }

        #nutritionChart {
            max-height: 350px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .input-group {
                grid-template-columns: 1fr;
            }
            
            .results-section {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
            }
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .empty-state img {
            width: 100px;
            opacity: 0.5;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍎 食物热量分析工具</h1>
            <p>科学管理饮食，健康生活每一天</p>
        </div>
        
        <div class="main-content">
            <div class="input-section">
                <h3 style="margin-bottom: 20px; color: #333;">添加食物</h3>
                <div class="input-group">
                    <div class="form-group">
                        <label for="foodSelect">选择食物</label>
                        <select id="foodSelect">
                            <option value="">请选择食物</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="customFood">或输入自定义食物</label>
                        <input type="text" id="customFood" placeholder="输入食物名称">
                    </div>
                    <div class="form-group">
                        <label for="weight">重量 (克)</label>
                        <input type="number" id="weight" placeholder="100" min="1">
                    </div>
                    <div class="form-group">
                        <button class="btn btn-primary" onclick="addFood()">添加</button>
                    </div>
                </div>
            </div>
            
            <div class="results-section">
                <div class="food-list">
                    <h3 style="margin-bottom: 20px; color: #333;">食物清单</h3>
                    <div id="foodList">
                        <div class="empty-state">
                            <div style="font-size: 3em; margin-bottom: 10px;">🍽️</div>
                            <p>还没有添加任何食物</p>
                            <p style="font-size: 0.9em; margin-top: 5px;">开始添加食物来分析热量吧！</p>
                        </div>
                    </div>
                </div>
                
                <div class="stats-panel">
                    <h3 style="margin-bottom: 20px;">营养统计</h3>
                    <div class="stat-item">
                        <div class="stat-label">总热量</div>
                        <div class="stat-value" id="totalCalories">0 kcal</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">蛋白质</div>
                        <div class="stat-value" id="totalProtein">0 g</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">脂肪</div>
                        <div class="stat-value" id="totalFat">0 g</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">碳水化合物</div>
                        <div class="stat-value" id="totalCarbs">0 g</div>
                    </div>
                </div>
            </div>
            
            <div class="chart-container">
                <h3 style="margin-bottom: 20px; color: #333;">营养成分分布</h3>
                <canvas id="nutritionChart" width="400" height="200"></canvas>
            </div>
            
            <div class="controls">
                <button class="btn btn-danger" onclick="clearAll()">清空所有</button>
                <button class="btn btn-primary" onclick="exportData()">导出数据</button>
                <button class="btn btn-primary" onclick="saveToHistory()">保存到历史</button>
            </div>
        </div>
    </div>

    <script>
        // 食物数据库
        const foodDatabase = {
            '米饭': { calories: 116, protein: 2.6, fat: 0.3, carbs: 25.9 },
            '面条': { calories: 109, protein: 4.0, fat: 0.7, carbs: 22.2 },
            '面包': { calories: 265, protein: 8.9, fat: 4.2, carbs: 50.6 },
            '鸡蛋': { calories: 155, protein: 13.3, fat: 8.8, carbs: 2.8 },
            '牛奶': { calories: 54, protein: 3.0, fat: 3.2, carbs: 3.4 },
            '鸡胸肉': { calories: 165, protein: 31.0, fat: 3.6, carbs: 0 },
            '猪肉': { calories: 242, protein: 20.3, fat: 6.2, carbs: 0 },
            '牛肉': { calories: 250, protein: 26.0, fat: 15.0, carbs: 0 },
            '鱼肉': { calories: 206, protein: 22.0, fat: 12.0, carbs: 0 },
            '虾': { calories: 106, protein: 18.0, fat: 2.4, carbs: 2.4 },
            '豆腐': { calories: 76, protein: 8.1, fat: 4.8, carbs: 1.9 },
            '土豆': { calories: 76, protein: 2.0, fat: 0.2, carbs: 17.0 },
            '红薯': { calories: 99, protein: 2.0, fat: 0.1, carbs: 23.0 },
            '胡萝卜': { calories: 25, protein: 1.0, fat: 0.2, carbs: 6.0 },
            '白菜': { calories: 17, protein: 1.5, fat: 0.2, carbs: 3.2 },
            '菠菜': { calories: 28, protein: 2.9, fat: 0.3, carbs: 3.6 },
            '西红柿': { calories: 19, protein: 0.9, fat: 0.2, carbs: 3.9 },
            '黄瓜': { calories: 15, protein: 0.7, fat: 0.1, carbs: 2.9 },
            '苹果': { calories: 52, protein: 0.3, fat: 0.2, carbs: 13.8 },
            '香蕉': { calories: 93, protein: 1.0, fat: 0.2, carbs: 22.8 },
            '橙子': { calories: 43, protein: 1.0, fat: 0.2, carbs: 10.4 },
            '葡萄': { calories: 43, protein: 0.6, fat: 0.2, carbs: 10.3 },
            '草莓': { calories: 30, protein: 0.7, fat: 0.3, carbs: 7.0 },
            '西瓜': { calories: 25, protein: 0.6, fat: 0.2, carbs: 6.2 },
            '核桃': { calories: 654, protein: 15.2, fat: 65.2, carbs: 13.7 },
            '花生': { calories: 567, protein: 26.2, fat: 49.2, carbs: 16.1 },
            '杏仁': { calories: 579, protein: 21.2, fat: 49.9, carbs: 21.6 },
            '酸奶': { calories: 72, protein: 2.5, fat: 2.7, carbs: 9.3 },
            '奶酪': { calories: 328, protein: 25.0, fat: 27.0, carbs: 2.2 },
            '巧克力': { calories: 546, protein: 4.9, fat: 31.0, carbs: 61.0 }
        };

        let currentFoods = [];
        let chart = null;

        // 初始化
        function init() {
            populateFoodSelect();
            loadFromStorage();
            updateDisplay();
            initChart();
        }

        // 填充食物选择下拉框
        function populateFoodSelect() {
            const select = document.getElementById('foodSelect');
            Object.keys(foodDatabase).forEach(food => {
                const option = document.createElement('option');
                option.value = food;
                option.textContent = food;
                select.appendChild(option);
            });
        }

        // 添加食物
        function addFood() {
            const foodSelect = document.getElementById('foodSelect');
            const customFood = document.getElementById('customFood');
            const weight = document.getElementById('weight');

            let foodName = foodSelect.value || customFood.value;
            let weightValue = parseFloat(weight.value) || 100;

            if (!foodName) {
                alert('请选择或输入食物名称');
                return;
            }

            let foodData;
            if (foodDatabase[foodName]) {
                foodData = foodDatabase[foodName];
            } else {
                // 自定义食物，使用默认值
                foodData = { calories: 100, protein: 5, fat: 3, carbs: 15 };
            }

            const food = {
                name: foodName,
                weight: weightValue,
                calories: (foodData.calories * weightValue / 100).toFixed(1),
                protein: (foodData.protein * weightValue / 100).toFixed(1),
                fat: (foodData.fat * weightValue / 100).toFixed(1),
                carbs: (foodData.carbs * weightValue / 100).toFixed(1)
            };

            currentFoods.push(food);
            updateDisplay();
            saveToStorage();

            // 清空输入
            foodSelect.value = '';
            customFood.value = '';
            weight.value = '';
        }

        // 删除食物
        function removeFood(index) {
            currentFoods.splice(index, 1);
            updateDisplay();
            saveToStorage();
        }

        // 更新显示
        function updateDisplay() {
            updateFoodList();
            updateStats();
            updateChart();
        }

        // 更新食物列表
        function updateFoodList() {
            const foodList = document.getElementById('foodList');
            
            if (currentFoods.length === 0) {
                foodList.innerHTML = `
                    <div class="empty-state">
                        <div style="font-size: 3em; margin-bottom: 10px;">🍽️</div>
                        <p>还没有添加任何食物</p>
                        <p style="font-size: 0.9em; margin-top: 5px;">开始添加食物来分析热量吧！</p>
                    </div>
                `;
                return;
            }

            foodList.innerHTML = currentFoods.map((food, index) => `
                <div class="food-item">
                    <div class="food-info">
                        <div class="food-name">${food.name}</div>
                        <div class="food-details">${food.weight}g | 蛋白质: ${food.protein}g | 脂肪: ${food.fat}g | 碳水: ${food.carbs}g</div>
                    </div>
                    <div class="food-calories">${food.calories} kcal</div>
                    <button class="delete-btn" onclick="removeFood(${index})">×</button>
                </div>
            `).join('');
        }

        // 更新统计
        function updateStats() {
            const totals = currentFoods.reduce((acc, food) => {
                acc.calories += parseFloat(food.calories);
                acc.protein += parseFloat(food.protein);
                acc.fat += parseFloat(food.fat);
                acc.carbs += parseFloat(food.carbs);
                return acc;
            }, { calories: 0, protein: 0, fat: 0, carbs: 0 });

            document.getElementById('totalCalories').textContent = `${totals.calories.toFixed(1)} kcal`;
            document.getElementById('totalProtein').textContent = `${totals.protein.toFixed(1)} g`;
            document.getElementById('totalFat').textContent = `${totals.fat.toFixed(1)} g`;
            document.getElementById('totalCarbs').textContent = `${totals.carbs.toFixed(1)} g`;
        }

        // 初始化图表
        function initChart() {
            const ctx = document.getElementById('nutritionChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['蛋白质', '脂肪', '碳水化合物'],
                    datasets: [{
                        data: [0, 0, 0],
                        backgroundColor: [
                            '#ff6b6b',
                            '#4ecdc4',
                            '#45b7d1'
                        ],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }

        // 更新图表
        function updateChart() {
            if (!chart) return;

            const totals = currentFoods.reduce((acc, food) => {
                acc.protein += parseFloat(food.protein);
                acc.fat += parseFloat(food.fat);
                acc.carbs += parseFloat(food.carbs);
                return acc;
            }, { protein: 0, fat: 0, carbs: 0 });

            chart.data.datasets[0].data = [totals.protein, totals.fat, totals.carbs];
            chart.update();
        }

        // 清空所有
        function clearAll() {
            if (currentFoods.length === 0) return;
            
            if (confirm('确定要清空所有食物吗？')) {
                currentFoods = [];
                updateDisplay();
                saveToStorage();
            }
        }

        // 导出数据
        function exportData() {
            if (currentFoods.length === 0) {
                alert('没有数据可以导出');
                return;
            }

            const totals = currentFoods.reduce((acc, food) => {
                acc.calories += parseFloat(food.calories);
                acc.protein += parseFloat(food.protein);
                acc.fat += parseFloat(food.fat);
                acc.carbs += parseFloat(food.carbs);
                return acc;
            }, { calories: 0, protein: 0, fat: 0, carbs: 0 });

            let exportText = '食物热量分析报告\n';
            exportText += '==================\n\n';
            exportText += '食物清单：\n';
            currentFoods.forEach(food => {
                exportText += `${food.name} (${food.weight}g) - ${food.calories} kcal\n`;
            });
            exportText += '\n营养统计：\n';
            exportText += `总热量: ${totals.calories.toFixed(1)} kcal\n`;
            exportText += `蛋白质: ${totals.protein.toFixed(1)} g\n`;
            exportText += `脂肪: ${totals.fat.toFixed(1)} g\n`;
            exportText += `碳水化合物: ${totals.carbs.toFixed(1)} g\n`;
            exportText += `\n生成时间: ${new Date().toLocaleString()}`;

            const blob = new Blob([exportText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `食物热量分析_${new Date().toISOString().split('T')[0]}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // 保存到历史
        function saveToHistory() {
            if (currentFoods.length === 0) {
                alert('没有数据可以保存');
                return;
            }

            const history = JSON.parse(localStorage.getItem('foodHistory') || '[]');
            const record = {
                date: new Date().toISOString(),
                foods: [...currentFoods]
            };
            history.unshift(record);
            
            // 只保留最近10条记录
            if (history.length > 10) {
                history.splice(10);
            }
            
            localStorage.setItem('foodHistory', JSON.stringify(history));
            alert('已保存到历史记录');
        }

        // 保存到本地存储
        function saveToStorage() {
            localStorage.setItem('currentFoods', JSON.stringify(currentFoods));
        }

        // 从本地存储加载
        function loadFromStorage() {
            const saved = localStorage.getItem('currentFoods');
            if (saved) {
                currentFoods = JSON.parse(saved);
            }
        }

        // 页面加载完成后初始化
        window.addEventListener('load', init);
    </script>
</body>
</html>
