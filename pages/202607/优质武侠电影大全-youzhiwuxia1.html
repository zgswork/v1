        // 获取DOM元素
        const recommendBtn = document.getElementById('recommend-btn');
        const changeBtn = document.getElementById('change-btn');
        const downloadBtn = document.getElementById('download-btn');
        const movieInfo = document.getElementById('movie-info');
        const modal = document.getElementById('download-modal');
        const closeBtn = document.querySelector('.close');

        // 记录已推荐的电影索引
        let recommendedIndices = [];
        
        // 随机推荐一部电影
        function recommendMovie() {
            if (recommendedIndices.length === movies.length) {
                recommendedIndices = []; // 如果所有电影都推荐过了，重置
            }
            
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * movies.length);
            } while (recommendedIndices.includes(randomIndex));
            
            recommendedIndices.push(randomIndex);
            const movie = movies[randomIndex];
            
            // 更新DOM
            document.getElementById('movie-title').textContent = movie.title;
            document.getElementById('movie-country').textContent = `国家: ${movie.country}`;
            document.getElementById('movie-actors').textContent = `主演: ${movie.actors}`;
            document.getElementById('movie-description').textContent = movie.description;
            
            // 计算星级
            const stars = Math.round(movie.rating / 2);
            let starsHtml = '';
            for (let i = 0; i < 5; i++) {
                if (i < stars) {
                    starsHtml += '★';
                } else {
                    starsHtml += '☆';
                }
            }
            document.getElementById('rating').innerHTML = `推荐指数: ${starsHtml} (豆瓣评分: ${movie.rating})`;
            
            document.getElementById('recommendation').textContent = movie.recommendation;
            
            // 显示电影信息和换一部按钮
            movieInfo.style.display = 'block';
            recommendBtn.style.display = 'none';
            changeBtn.style.display = 'block';
        }
        
        // 显示下载模态框
        function showDownloadModal() {
            modal.style.display = 'block';
        }
        
        // 隐藏下载模态框
        function hideDownloadModal() {
            modal.style.display = 'none';
        }
        
        // 事件监听
        recommendBtn.addEventListener('click', recommendMovie);
        changeBtn.addEventListener('click', recommendMovie);
        downloadBtn.addEventListener('click', showDownloadModal);
        closeBtn.addEventListener('click', hideDownloadModal);
        
        window.addEventListener('click', (event) => {
            if (event.target === modal) {
                hideDownloadModal();
            }
        });
