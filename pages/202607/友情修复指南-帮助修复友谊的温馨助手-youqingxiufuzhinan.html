                    document.getElementById('repair-steps').classList.remove('hidden');
                    document.getElementById('communication-tips').classList.remove('hidden');
                    document.getElementById('reflection-section').classList.remove('hidden');
                    document.getElementById('progress-tracking').classList.remove('hidden');
                    
                    // 保存当前选择
                    this.saveData();
                },
                renderSteps() {
                    const container = document.getElementById('steps-container');
                    container.innerHTML = '';
                    
                    this.currentSteps.forEach((step, index) => {
                        const stepCard = document.createElement('div');
                        stepCard.className = `step-card ${step.completed ? 'step-card-active' : ''} animate-scale-in`;
                        stepCard.dataset.stepId = step.id;
                        
                        stepCard.innerHTML = `
                            <div class="flex items-start">
                                <div class="relative mr-4">
                                    <input type="checkbox" class="checkbox-custom" id="${step.id}" ${step.completed ? 'checked' : ''}>
                                    <label for="${step.id}" class="absolute inset-0 cursor-pointer"></label>
                                    ${step.completed ? '<i class="fa fa-check text-white absolute inset-0 flex items-center justify-center"></i>' : ''}
                                </div>
                                <div class="flex-1">
                                    <h3 class="text-xl font-semibold mb-2 flex items-center">
                                        <span class="bg-primary/20 text-primary rounded-full w-7 h-7 inline-flex items-center justify-center mr-2">${index + 1}</span>
                                        ${step.title}
                                    </h3>
                                    <p class="text-gray-600 mb-4">${step.description}</p>
                                    
                                    <div class="importance-section">
                                        <button class="importance-toggle text-primary flex items-center gap-1 text-sm">
                                            <i class="fa fa-info-circle"></i>
                                            <span>为什么这很重要？</span>
                                        </button>
                                        <div class="importance-content mt-2 p-3 bg-primary/5 rounded-lg hidden">
                                            <p class="text-sm text-gray-700">${step.importance}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                        
                        container.appendChild(stepCard);
                        
                        // 添加事件监听
                        const checkbox = stepCard.querySelector(`#${step.id}`);
                        checkbox.addEventListener('change', (e) => {
                            this.toggleStepCompletion(step.id, e.target.checked);
                        });
                        
                        const importanceToggle = stepCard.querySelector('.importance-toggle');
                        importanceToggle.addEventListener('click', () => {
                            const content = stepCard.querySelector('.importance-content');
                            content.classList.toggle('hidden');
                            
                            // 切换图标
                            const icon = importanceToggle.querySelector('i');
                            if (content.classList.contains('hidden')) {
                                icon.className = 'fa fa-info-circle';
                            } else {
                                icon.className = 'fa fa-angle-up';
                            }
                        });
                    });
                    
                    this.updateProgress();
                },
                renderCommunicationTips() {
                    const container = document.getElementById('communication-content');
                    const tips = this.conflictTypes[this.currentConflict].communication;
                    
                    container.innerHTML = `
                        <div class="space-y-4">
                            <div class="tip-card p-4 bg-primary/5 rounded-lg">
                                <h3 class="font-semibold text-primary mb-1 flex items-center">
                                    <i class="fa fa-comment-o mr-2"></i>开场白建议
                                </h3>
                                <p class="italic">"${tips.opening}"</p>
                            </div>
                            
                            <div class="tip-card p-4 bg-primary/5 rounded-lg">
                                <h3 class="font-semibold text-primary mb-1 flex items-center">
                                    <i class="fa fa-listening mr-2"></i>回应建议
                                </h3>
                                <p class="italic">"${tips.listening || tips.acknowledging || tips.catching_up}"</p>
                            </div>
                            
                            <div class="tip-card p-4 bg-primary/5 rounded-lg">
                                <h3 class="font-semibold text-primary mb-1 flex items-center">
                                    <i class="fa fa-lightbulb-o mr-2"></i>沟通要点
                                </h3>
                                <ul class="list-disc list-inside text-gray-600">
                                    <li>保持语气温和，避免指责性语言</li>
                                    <li>使用 "我" 语句表达感受，如 "我感到..."</li>
                                    <li>给予对方充分的表达机会</li>
                                    <li>注意非语言沟通，保持友好的肢体语言</li>
                                </ul>
                            </div>
                            
                            <div class="tip-card p-4 bg-primary/5 rounded-lg">
                                <h3 class="font-semibold text-primary mb-1 flex items-center">
                                    <i class="fa fa-handshake-o mr-2"></i>结束对话建议
                                </h3>
                                <p class="italic">"${tips.resolving || tips.compromising || tips.continuing}"</p>
                            </div>
                        </div>
                    `;
                },
                renderReflectionSection() {
                    const container = document.getElementById('reflection-content');
                    const questions = this.conflictTypes[this.currentConflict].reflection;
                    
                    container.innerHTML = '';
                    
                    questions.forEach((question, index) => {
                        const questionCard = document.createElement('div');
                        questionCard.className = 'bg-white rounded-xl shadow-sm p-5 transition-all duration-300 hover:shadow-md';
                        
                        questionCard.innerHTML = `
                            <div class="flex items-start">
                                <div class="bg-secondary/20 p-2 rounded-full mr-4 flex-shrink-0">
                                    <i class="fa fa-question text-secondary"></i>
                                </div>
                                <div>
                                    <p class="text-gray-700">${question}</p>
                                    <textarea class="w-full mt-3 p-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all resize-none" rows="2" placeholder="在这里记录你的思考..."></textarea>
                                </div>
                            </div>
                        `;
                        
                        container.appendChild(questionCard);
                    });
                },
                toggleStepCompletion(stepId, completed) {
                    const step = this.currentSteps.find(s => s.id === stepId);
                    if (step) {
                        step.completed = completed;
                        
                        // 显示成功提示
                        if (completed) {
                            this.showSuccessToast('步骤已完成！');
                        }
                        
                        // 更新进度
                        this.updateProgress();
                        
                        // 更新UI
                        const stepCard = document.querySelector(`.step-card[data-step-id="${stepId}"]`);
                        if (stepCard) {
                            if (completed) {
                                stepCard.classList.add('step-card-active');
                                stepCard.classList.add('animate-bounce-soft');
                                setTimeout(() => {
                                    stepCard.classList.remove('animate-bounce-soft');
                                }, 600);
                            } else {
                                stepCard.classList.remove('step-card-active');
                            }
                        }
                        
                        // 保存数据
                        this.saveData();
                    }
                },
                updateProgress() {
                    const completedSteps = this.currentSteps.filter(step => step.completed).length;
                    const totalSteps = this.currentSteps.length;
                    const percentage = Math.round((completedSteps / totalSteps) * 100);
                    
                    // 更新进度条
                    document.getElementById('progress-percentage').textContent = `${percentage}%`;
                    document.getElementById('progress-bar').style.width = `${percentage}%`;
                    
                    // 更新已完成步骤列表
                    const completedList = document.getElementById('completed-steps');
                    if (completedSteps === 0) {
                        completedList.innerHTML = '<p class="text-gray-500 italic">开始完成步骤后，这里将显示你的进度</p>';
                    } else {
                        completedList.innerHTML = '';
                        this.currentSteps.forEach((step, index) => {
                            if (step.completed) {
                                const stepItem = document.createElement('div');
                                stepItem.className = 'flex items-center gap-2 text-green-600';
                                stepItem.innerHTML = `
                                    <i class="fa fa-check-circle"></i>
                                    <span>第${index + 1}步: ${step.title}</span>
                                `;
                                completedList.appendChild(stepItem);
                            }
                        });
                    }
                },
                showSuccessToast(message) {
                    const toast = document.getElementById('success-toast');
                    document.getElementById('toast-message').textContent = message;
                    
                    // 显示提示框
                    toast.classList.remove('translate-y-20', 'opacity-0');
                    toast.classList.add('translate-y-0', 'opacity-100');
                    
                    // 3秒后隐藏
                    setTimeout(() => {
                        toast.classList.add('translate-y-20', 'opacity-0');
                        toast.classList.remove('translate-y-0', 'opacity-100');
                    }, 3000);
                },
                saveData() {
                    const data = {
                        currentConflict: this.currentConflict,
                        currentSteps: this.currentSteps
                    };
                    localStorage.setItem('friendshipRepairData', JSON.stringify(data));
                },
                loadData() {
                    const savedData = localStorage.getItem('friendshipRepairData');
                    if (savedData) {
                        try {
                            const data = JSON.parse(savedData);
                            if (data.currentConflict && this.conflictTypes[data.currentConflict]) {
                                this.currentConflict = data.currentConflict;
                                this.currentSteps = data.currentSteps || JSON.parse(JSON.stringify(this.conflictTypes[data.currentConflict].steps));
                                
                                // 显示已保存的内容
                                document.getElementById('conflict-selection').classList.add('hidden');
                                document.getElementById('repair-steps').classList.remove('hidden');
                                document.getElementById('communication-tips').classList.remove('hidden');
                                document.getElementById('reflection-section').classList.remove('hidden');
                                document.getElementById('progress-tracking').classList.remove('hidden');
                                
                                // 渲染内容
                                this.renderSteps();
                                this.renderCommunicationTips();
                                this.renderReflectionSection();
                            }
                        } catch (error) {
                            console.error('加载数据失败:', error);
                        }
                    }
                },
                restart() {
                    // 清除当前数据
                    this.currentConflict = null;
                    this.currentSteps = [];
                    
                    // 清除localStorage
                    localStorage.removeItem('friendshipRepairData');
                    
                    // 重置UI
                    document.getElementById('repair-steps').classList.add('hidden');
                    document.getElementById('communication-tips').classList.add('hidden');
                    document.getElementById('reflection-section').classList.add('hidden');
                    document.getElementById('progress-tracking').classList.add('hidden');
                    document.getElementById('conflict-selection').classList.remove('hidden');
                }
            };
            
            // 初始化应用
            appData.init();
        });
    </script>
</body>
</html>
