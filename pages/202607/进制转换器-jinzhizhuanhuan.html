<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>进制转换器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(to right, #3a7bd5, #00d2ff);
            color: white;
            padding: 25px;
            text-align: center;
            position: relative;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .description {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .content {
            padding: 30px;
        }
        
        .input-group {
            margin-bottom: 25px;
        }
        
        .input-group label {
            display: block;
            font-size: 1.1rem;
            margin-bottom: 10px;
            font-weight: 600;
            color: #2c3e50;
        }
        
        .input-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .input-container select {
            flex: 1;
            min-width: 120px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
            background-color: #f8f9fa;
            cursor: pointer;
        }
        
        .input-container select:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }
        
        .input-container input {
            flex: 3;
            min-width: 200px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s;
        }
        
        .input-container input:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }
        
        .results {
            background: linear-gradient(to right, #f8f9fa, #e9ecef);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            margin-top: 20px;
        }
        
        .result-item {
            padding: 15px 0;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .result-item:last-child {
            border-bottom: none;
        }
        
        .result-label {
            width: 120px;
            font-weight: 600;
            color: #2c3e50;
        }
        
        .result-value {
            flex: 1;
            min-width: 200px;
            padding: 10px 15px;
            background-color: white;
            border-radius: 8px;
            font-size: 1.1rem;
            word-break: break-all;
        }
        
        .instructions {
            background-color: #e3f2fd;
            border-left: 5px solid #2196f3;
            padding: 20px;
            border-radius: 0 10px 10px 0;
            margin-top: 30px;
            font-size: 0.95rem;
        }
        
        .instructions h3 {
            margin-bottom: 10px;
            color: #1976d2;
        }
        
        .instructions ul {
            padding-left: 20px;
        }
        
        .instructions li {
            margin-bottom: 8px;
        }
        
        .error {
            color: #e74c3c;
            font-weight: 600;
            padding: 15px;
            background-color: #fadbd8;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
            font-size: 0.9rem;
            background-color: #f8f9fa;
            border-top: 1px solid #eaeaea;
        }
        
        @media (max-width: 600px) {
            header {
                padding: 20px 15px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .description {
                font-size: 1rem;
            }
            
            .content {
                padding: 20px;
            }
            
            .input-container {
                flex-direction: column;
            }
            
            .input-container select, 
            .input-container input {
                width: 100%;
            }
            
            .result-item {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .result-label {
                margin-bottom: 8px;
            }
        }
        
        .highlight {
            background-color: #fffde7;
            border: 2px solid #ffd600;
            animation: highlight 1.5s ease;
        }
        
        @keyframes highlight {
            0% { background-color: #fffde7; }
            50% { background-color: #fff59d; }
            100% { background-color: #fffde7; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-exchange-alt"></i> 进制转换器</h1>
            <p class="description">在二进制、八进制、十进制和十六进制之间自由转换</p>
        </header>
        
        <div class="content">
            <div class="input-group">
                <label for="input-base">输入进制：</label>
                <div class="input-container">
                    <select id="input-base">
                        <option value="2">二进制 (2)</option>
                        <option value="8">八进制 (8)</option>
                        <option value="10" selected>十进制 (10)</option>
                        <option value="16">十六进制 (16)</option>
                    </select>
                    <input type="text" id="input-value" placeholder="输入数值..." autocomplete="off">
                </div>
            </div>
            
            <div class="error" id="error-message">
                输入值不符合所选进制规则！请检查输入。
            </div>
            
            <div class="results">
                <div class="result-item">
                    <div class="result-label">二进制 (2):</div>
                    <div class="result-value" id="binary-result">-</div>
                </div>
                <div class="result-item">
                    <div class="result-label">八进制 (8):</div>
                    <div class="result-value" id="octal-result">-</div>
                </div>
                <div class="result-item">
                    <div class="result-label">十进制 (10):</div>
                    <div class="result-value" id="decimal-result">-</div>
                </div>
                <div class="result-item">
                    <div class="result-label">十六进制 (16):</div>
                    <div class="result-value" id="hex-result">-</div>
                </div>
            </div>
            
            <div class="instructions">
                <h3>使用说明：</h3>
                <ul>
                    <li>在输入框中输入要转换的数值</li>
                    <li>选择输入数值的进制（二进制、八进制、十进制或十六进制）</li>
                    <li>转换结果将实时显示在下方</li>
                    <li>二进制只允许输入0和1</li>
                    <li>八进制允许输入0-7</li>
                    <li>十进制允许输入0-9</li>
                    <li>十六进制允许输入0-9和A-F（不区分大小写）</li>
                </ul>
            </div>
        </div>
        
        <footer>
            <p>© 2023 进制转换器 | 设计制作：DeepSeek开发团队</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const inputBase = document.getElementById('input-base');
            const inputValue = document.getElementById('input-value');
            const binaryResult = document.getElementById('binary-result');
            const octalResult = document.getElementById('octal-result');
            const decimalResult = document.getElementById('decimal-result');
            const hexResult = document.getElementById('hex-result');
            const errorMessage = document.getElementById('error-message');
            
            // 初始示例值
            inputValue.value = '255';
            convertBase();
            
            // 添加事件监听器
            inputBase.addEventListener('change', convertBase);
            inputValue.addEventListener('input', convertBase);
            
            function convertBase() {
                errorMessage.style.display = 'none';
                
                const base = parseInt(inputBase.value);
                const value = inputValue.value.trim().toUpperCase();
                
                // 清除之前的高亮效果
                [binaryResult, octalResult, decimalResult, hexResult].forEach(el => {
                    el.classList.remove('highlight');
                });
                
                // 空值处理
                if (value === '') {
                    binaryResult.textContent = '-';
                    octalResult.textContent = '-';
                    decimalResult.textContent = '-';
                    hexResult.textContent = '-';
                    return;
                }
                
                // 验证输入
                if (!isValidInput(value, base)) {
                    errorMessage.style.display = 'block';
                    binaryResult.textContent = '无效输入';
                    octalResult.textContent = '无效输入';
                    decimalResult.textContent = '无效输入';
                    hexResult.textContent = '无效输入';
                    return;
                }
                
                try {
                    // 转换为十进制
                    let decimalVal;
                    if (base === 16) {
                        // 处理十六进制前缀
                        const cleanValue = value.startsWith('0X') ? value.substring(2) : value;
                        decimalVal = parseInt(cleanValue, 16);
                    } else {
                        decimalVal = parseInt(value, base);
                    }
                    
                    // 转换到各种进制
                    decimalResult.textContent = decimalVal.toString(10);
                    binaryResult.textContent = '0b' + decimalVal.toString(2);
                    octalResult.textContent = '0o' + decimalVal.toString(8);
                    hexResult.textContent = '0x' + decimalVal.toString(16).toUpperCase();
                    
                    // 添加高亮效果
                    decimalResult.classList.add('highlight');
                    
                } catch (error) {
                    errorMessage.style.display = 'block';
                    binaryResult.textContent = '转换错误';
                    octalResult.textContent = '转换错误';
                    decimalResult.textContent = '转换错误';
                    hexResult.textContent = '转换错误';
                }
            }
            
            function isValidInput(value, base) {
                const hexPattern = /^[0-9A-F]+$/i;
                const decPattern = /^[0-9]+$/;
                const octPattern = /^[0-7]+$/;
                const binPattern = /^[01]+$/;
                
                // 处理十六进制前缀
                const cleanValue = value.startsWith('0X') ? value.substring(2) : value;
                
                switch(base) {
                    case 2:
                        return binPattern.test(cleanValue);
                    case 8:
                        return octPattern.test(cleanValue);
                    case 10:
                        return decPattern.test(cleanValue);
                    case 16:
                        return hexPattern.test(cleanValue);
                    default:
                        return false;
                }
            }
        });
    </script>
</body>
</html>
