                    if (document.body.contains(messageElement)) {
                        document.body.removeChild(messageElement);
                    }
                }, 2000);
            }

            // 重新洗牌
            shuffleBoard() {
                // 收集所有未匹配的符文
                const availableRunes = [];
                for (let row = 0; row < this.board.rows; row++) {
                    for (let col = 0; col < this.board.cols; col++) {
                        const rune = this.board.grid[row][col];
                        if (rune && !rune.isMatched && !rune.isObstacle) {
                            availableRunes.push({
                                element: rune.element,
                                level: rune.level,
                                isWild: rune.isWild,
                                isBomb: rune.isBomb,
                                bombRadius: rune.bombRadius
                            });
                        }
                    }
                }
                
                // 打乱符文数组
                for (let i = availableRunes.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [availableRunes[i], availableRunes[j]] = [availableRunes[j], availableRunes[i]];
                }
                
                // 重新填充棋盘
                let runeIndex = 0;
                for (let row = 0; row < this.board.rows; row++) {
                    for (let col = 0; col < this.board.cols; col++) {
                        const currentRune = this.board.grid[row][col];
                        if (currentRune && !currentRune.isMatched && !currentRune.isObstacle) {
                            if (runeIndex < availableRunes.length) {
                                const runeData = availableRunes[runeIndex];
                                currentRune.element = runeData.element;
                                currentRune.level = runeData.level;
                                currentRune.isWild = runeData.isWild;
                                currentRune.isBomb = runeData.isBomb;
                                currentRune.bombRadius = runeData.bombRadius;
                                runeIndex++;
                            }
                        }
                    }
                }
                
                // 如果洗牌后仍然没有匹配，强制创建一些
                if (!this.board.hasValidMatches()) {
                    this.board.forceValidMatch();
                }
            }

            // 更新交互时间
             updateInteractionTime() {
                 this.lastInteractionTime = Date.now();
                 if (this.hintTimeout) {
                     clearTimeout(this.hintTimeout);
                     this.hintTimeout = null;
                 }
             }

            // 爆炸炸弹
            explodeBomb(row, col) {
                const rune = this.board.grid[row][col];
                if (!rune || (!rune.isBomb && rune.element !== 'super')) {
                    return false;
                }

                // 计算爆炸半径
                let radius = 1;
                if (rune.element === 'super' || rune.isSuperBomb) {
                    radius = rune.bombRadius || 2; // 超级炸弹有更大的爆炸半径
                } else if (rune.bombRadius) {
                    radius = rune.bombRadius;
                }

                const explodedRunes = [];
                const bombRow = row;
                const bombCol = col;

                // 标记爆炸范围内的所有符文
                for (let r = Math.max(0, bombRow - radius); r <= Math.min(this.board.rows - 1, bombRow + radius); r++) {
                    for (let c = Math.max(0, bombCol - radius); c <= Math.min(this.board.cols - 1, bombCol + radius); c++) {
                        const targetRune = this.board.grid[r][c];
                        if (targetRune && !targetRune.matched && !targetRune.isObstacle) {
                            targetRune.matched = true;
                            targetRune.startExplosionAnimation();
                            explodedRunes.push(targetRune);
                        }
                    }
                }

                // 计算得分
                const basePoints = explodedRunes.length * 50;
                const bombBonus = rune.type === 'super' ? 500 : 200;
                const totalPoints = basePoints + bombBonus;

                // 更新得分
                this.score += totalPoints;
                this.updateScore();

                // 显示得分动画
                this.showPointsAnimation(row, col, totalPoints, (rune.element === 'super' || rune.isSuperBomb) ? 'super' : 'bomb');

                // 延迟填充空缺，等待爆炸动画完成
                setTimeout(() => {
                    this.board.fillEmptySpaces();
                }, 900); // 等待爆炸动画完成(800ms)再填充

                return true;
            }

            // 查找可能的匹配
            findPossibleMatch() {
                // 检查水平匹配
                for (let row = 0; row < this.board.rows; row++) {
                    for (let col = 0; col < this.board.cols - 2; col++) {
                        const rune1 = this.board.grid[row][col];
                        const rune2 = this.board.grid[row][col + 1];
                        const rune3 = this.board.grid[row][col + 2];
                        
                        if (rune1 && rune2 && rune3 && 
                            !rune1.isObstacle && !rune2.isObstacle && !rune3.isObstacle &&
                            (rune1.element === rune2.element || rune1.isWild || rune2.isWild) &&
                            (rune2.element === rune3.element || rune2.isWild || rune3.isWild)) {
                            return [rune1, rune2, rune3];
                        }
                    }
                }
                
                // 检查垂直匹配
                for (let row = 0; row < this.board.rows - 2; row++) {
                    for (let col = 0; col < this.board.cols; col++) {
                        const rune1 = this.board.grid[row][col];
                        const rune2 = this.board.grid[row + 1][col];
                        const rune3 = this.board.grid[row + 2][col];
                        
                        if (rune1 && rune2 && rune3 && 
                            !rune1.isObstacle && !rune2.isObstacle && !rune3.isObstacle &&
                            (rune1.element === rune2.element || rune1.isWild || rune2.isWild) &&
                            (rune2.element === rune3.element || rune2.isWild || rune3.isWild)) {
                            return [rune1, rune2, rune3];
                        }
                    }
                }
                
                // 检查L形匹配
                for (let row = 0; row < this.board.rows - 1; row++) {
                    for (let col = 0; col < this.board.cols - 1; col++) {
                        const rune1 = this.board.grid[row][col];
                        const rune2 = this.board.grid[row][col + 1];
                        const rune3 = this.board.grid[row + 1][col];
                        
                        if (rune1 && rune2 && rune3 && 
                            !rune1.isObstacle && !rune2.isObstacle && !rune3.isObstacle &&
                            (rune1.element === rune2.element || rune1.isWild || rune2.isWild) &&
                            (rune1.element === rune3.element || rune1.isWild || rune3.isWild)) {
                            return [rune1, rune2, rune3];
                        }
                    }
                }
                
                return null;
            }

            // 显示提示
            showHint() {
                const possibleMatch = this.findPossibleMatch();
                if (possibleMatch && !this.hintActive && !this.board.isAnimating) {
                    this.hintActive = true;
                    possibleMatch.forEach(rune => {
                        rune.showHint = true;
                    });
                    
                    // 3秒后清除提示
                    this.hintTimeout = setTimeout(() => {
                        this.clearHint();
                    }, 3000);
                }
            }

            // 清除提示
            clearHint() {
                if (this.hintActive) {
                    this.hintActive = false;
                    for (let row = 0; row < this.board.rows; row++) {
                        for (let col = 0; col < this.board.cols; col++) {
                            const rune = this.board.grid[row][col];
                            if (rune) {
                                rune.showHint = false;
                            }
                        }
                    }
                }
                
                if (this.hintTimeout) {
                    clearTimeout(this.hintTimeout);
                    this.hintTimeout = null;
                }
            }
        }

        // 导出到全局
        window.Game = Game;

        // 主程序入口
        document.addEventListener('DOMContentLoaded', function() {
            // 获取画布和容器
            const canvas = document.getElementById('game-board');
            const container = document.querySelector('.game-container');
            
            // 调整画布大小以适应容器
            function resizeCanvas() {
                const containerRect = container.getBoundingClientRect();
                const size = Math.min(containerRect.width - 40, containerRect.height - 40, 600);
                canvas.width = size;
                canvas.height = size;
                canvas.style.width = size + 'px';
                canvas.style.height = size + 'px';
            }
            
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            // 创建游戏实例
            const game = new Game(canvas);
            
            // 键盘事件
            document.addEventListener('keydown', function(event) {
                switch(event.key) {
                    case 'Escape':
                        if (game.isPaused) {
                            game.resume();
                        } else {
                            game.pause();
                        }
                        break;
                    case 'r':
                    case 'R':
                        game.restart();
                        break;
                    case '1':
                        game.setGameMode('zen');
                        break;
                    case '2':
                        game.setGameMode('time-challenge');
                        break;
                    case '3':
                        game.setGameMode('rune-master');
                        break;
                    case '4':
                        game.setGameMode('battle');
                        break;
                }
            });
            
            // 检测触摸设备
            const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            if (isTouchDevice) {
                document.body.classList.add('touch-device');
            }
            
            // 动态创建音效控制按钮
            const soundButton = document.createElement('button');
            soundButton.className = 'sound-toggle';
            soundButton.innerHTML = '🔊';
            soundButton.style.position = 'fixed';
            soundButton.style.top = '20px';
            soundButton.style.right = '20px';
            soundButton.style.background = 'rgba(255, 255, 255, 0.9)';
            soundButton.style.border = 'none';
            soundButton.style.borderRadius = '50%';
            soundButton.style.width = '50px';
            soundButton.style.height = '50px';
            soundButton.style.fontSize = '20px';
            soundButton.style.cursor = 'pointer';
            soundButton.style.zIndex = '1000';
            document.body.appendChild(soundButton);
            
            let soundEnabled = true;
            soundButton.addEventListener('click', function() {
                soundEnabled = !soundEnabled;
                soundButton.innerHTML = soundEnabled ? '🔊' : '🔇';
            });
            
            // 动态创建游戏帮助按钮
            const helpButton = document.createElement('button');
            helpButton.className = 'help-button';
            helpButton.innerHTML = '?';
            helpButton.style.position = 'fixed';
            helpButton.style.top = '80px';
            helpButton.style.right = '20px';
            helpButton.style.background = 'rgba(255, 255, 255, 0.9)';
            helpButton.style.border = 'none';
            helpButton.style.borderRadius = '50%';
            helpButton.style.width = '50px';
            helpButton.style.height = '50px';
            helpButton.style.fontSize = '20px';
            helpButton.style.fontWeight = 'bold';
            helpButton.style.cursor = 'pointer';
            helpButton.style.zIndex = '1000';
            document.body.appendChild(helpButton);
            
            // 创建帮助弹窗
            const helpModal = document.createElement('div');
            helpModal.className = 'help-modal';
            helpModal.style.display = 'none';
            helpModal.style.position = 'fixed';
            helpModal.style.top = '0';
            helpModal.style.left = '0';
            helpModal.style.width = '100%';
            helpModal.style.height = '100%';
            helpModal.style.background = 'rgba(0, 0, 0, 0.8)';
            helpModal.style.zIndex = '2000';
            helpModal.style.display = 'flex';
            helpModal.style.alignItems = 'center';
            helpModal.style.justifyContent = 'center';
            
            const helpContent = document.createElement('div');
            helpContent.style.background = 'white';
            helpContent.style.padding = '30px';
            helpContent.style.borderRadius = '15px';
            helpContent.style.maxWidth = '500px';
            helpContent.style.maxHeight = '80vh';
            helpContent.style.overflow = 'auto';
            helpContent.innerHTML = `
                <h2 style="margin-top: 0; color: #333;">符文连线 - 游戏帮助</h2>
                <h3>游戏目标</h3>
                <p>连接相同元素的符文，创造连击和特殊效果！</p>
                
                <h3>操作方式</h3>
                <ul>
                    <li>鼠标或手指拖拽连接相邻的相同符文</li>
                    <li>至少连接3个符文才能消除</li>
                    <li>路径最多只能有2个转角</li>
                </ul>
                
                <h3>游戏规则</h3>
                <ul>
                    <li>连接更多符文获得更高分数</li>
                    <li>连续匹配相同元素可获得连击加成</li>
                    <li>连击3次以上触发元素特效</li>
                    <li>连接6个以上符文可创造炸弹</li>
                </ul>
                
                <h3>元素特效</h3>
                <ul>
                    <li>🔥 火：燃烧周围符文</li>
                    <li>💧 水：刷新底部一行</li>
                    <li>🌍 土：创建障碍物</li>
                    <li>💨 风：交换两列</li>
                    <li>✨ 光：创建万能符文</li>
                </ul>
                
                <h3>游戏模式</h3>
                <ul>
                    <li><strong>禅模式</strong>：无时间限制，放松游戏</li>
                    <li><strong>限时挑战</strong>：90秒内获得最高分</li>
                    <li><strong>符文大师</strong>：特殊图案挑战</li>
                    <li><strong>对战模式</strong>：双人竞技</li>
                </ul>
                
                <h3>快捷键</h3>
                <ul>
                    <li>ESC：暂停/恢复</li>
                    <li>R：重新开始</li>
                    <li>1-4：切换游戏模式</li>
                </ul>
                
                <button id="closeHelp" style="margin-top: 20px; padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer;">关闭</button>
            `;
            
            helpModal.appendChild(helpContent);
            helpModal.style.display = 'none';
            document.body.appendChild(helpModal);
            
            helpButton.addEventListener('click', function() {
                helpModal.style.display = 'flex';
            });
            
            document.getElementById('closeHelp').addEventListener('click', function() {
                helpModal.style.display = 'none';
            });
            
            helpModal.addEventListener('click', function(e) {
                if (e.target === helpModal) {
                    helpModal.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
