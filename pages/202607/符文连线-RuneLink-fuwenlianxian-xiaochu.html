<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>符文连线 - Rune Link</title>
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 游戏容器 */
        .game-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 600px;
            width: 90vw;
            max-height: 90vh;
            position: relative;
        }

        /* 头部 */
        .game-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .game-title {
            color: white;
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
        }

        /* 统计信息 */
        .game-stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            color: white;
            font-size: 1.2rem;
        }

        .stat-item {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        /* 模式按钮 */
        .mode-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .mode-btn {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .mode-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .mode-btn.active {
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
            box-shadow: 0 0 20px rgba(78, 205, 196, 0.5);
        }

        /* 游戏棋盘 */
        .game-board-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        #game-board {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.1);
            cursor: crosshair;
        }

        /* 底部 */
        .game-footer {
            text-align: center;
            color: white;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        /* 元素信息 */
        .element-info {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.8rem;
            pointer-events: none;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .element-info.show {
            opacity: 1;
        }

        /* 游戏结束弹窗 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal.hidden {
            display: none;
        }

        .modal-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            color: white;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(10px);
            max-width: 400px;
            width: 90%;
        }

        .modal-content h2 {
            margin-bottom: 20px;
            font-size: 2rem;
        }

        .modal-content p {
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .restart-btn {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        /* 响应式设计 */
        @media (max-width: 600px) {
            .game-container {
                padding: 15px;
                width: 95vw;
            }

            .game-title {
                font-size: 2rem;
            }

            .game-stats {
                font-size: 1rem;
            }

            .stat-value {
                font-size: 1.2rem;
            }

            .mode-btn {
                padding: 6px 12px;
                font-size: 0.8rem;
            }

            #game-board {
                max-width: 100%;
                max-height: 50vh;
            }
        }

        /* 动画效果 */
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 5px rgba(255, 255, 255, 0.5); }
            50% { box-shadow: 0 0 20px rgba(255, 255, 255, 0.8); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(0.8); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes pointsFloat {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-50px) scale(1.2);
            }
        }

        @keyframes elementalFire {
            0%, 100% { filter: hue-rotate(0deg) brightness(1); }
            25% { filter: hue-rotate(30deg) brightness(1.2); }
            50% { filter: hue-rotate(60deg) brightness(1.4); }
            75% { filter: hue-rotate(30deg) brightness(1.2); }
        }

        @keyframes elementalWater {
            0%, 100% { filter: hue-rotate(0deg) brightness(1); }
            25% { filter: hue-rotate(-30deg) brightness(1.1); }
            50% { filter: hue-rotate(-60deg) brightness(1.3); }
            75% { filter: hue-rotate(-30deg) brightness(1.1); }
        }

        @keyframes elementalEarth {
            0%, 100% { filter: sepia(0) brightness(1); }
            50% { filter: sepia(0.5) brightness(1.2); }
        }

        @keyframes elementalWind {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }

        @keyframes elementalLight {
            0%, 100% { filter: brightness(1) saturate(1); }
            50% { filter: brightness(1.5) saturate(1.3); }
        }

        @keyframes bomb-pulse {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.1); filter: brightness(1.3); }
        }

        @keyframes explosion {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.8; }
            100% { transform: scale(2); opacity: 0; }
        }

        .glow {
            animation: glow 1s ease-in-out infinite;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        .fade-out {
            animation: fadeOut 0.3s ease-in;
        }

        .pulse {
            animation: pulse 0.6s ease-in-out infinite;
        }

        .points-animation {
            position: absolute;
            color: #ffe66d;
            font-weight: bold;
            font-size: 1.5rem;
            pointer-events: none;
            z-index: 1000;
            animation: pointsFloat 1s ease-out forwards;
        }

        .elemental-fire {
            animation: elementalFire 2s ease-in-out infinite;
        }

        .elemental-water {
            animation: elementalWater 2s ease-in-out infinite;
        }

        .elemental-earth {
            animation: elementalEarth 2s ease-in-out infinite;
        }

        .elemental-wind {
            animation: elementalWind 0.5s ease-in-out infinite;
        }

        .elemental-light {
            animation: elementalLight 1.5s ease-in-out infinite;
        }

        .bomb-pulse {
            animation: bomb-pulse 1s ease-in-out infinite;
        }

        .explosion {
            animation: explosion 0.8s ease-out forwards;
        }

        /* 得分动画 */
        .score-popup {
            position: absolute;
            color: #ffe66d;
            font-weight: bold;
            font-size: 1.2rem;
            pointer-events: none;
            z-index: 1000;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        /* 元素特效 */
        .element-effect {
            position: absolute;
            pointer-events: none;
            z-index: 999;
            border-radius: 50%;
            animation: explosion 1s ease-out forwards;
        }

        .element-effect.fire {
            background: radial-gradient(circle, #ff6b6b, #ff4757, transparent);
        }

        .element-effect.water {
            background: radial-gradient(circle, #4ecdc4, #00d2d3, transparent);
        }

        .element-effect.earth {
            background: radial-gradient(circle, #a68a64, #8b7355, transparent);
        }

        .element-effect.wind {
            background: radial-gradient(circle, #57cc99, #22a6b3, transparent);
        }

        .element-effect.light {
            background: radial-gradient(circle, #ffe66d, #ffa502, transparent);
        }

        /* 无匹配提示 */
        .no-matches-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 1.1rem;
            z-index: 1500;
            animation: fadeIn 0.3s ease-out;
        }

        /* 炸弹特效 */
        .bomb-effect {
            position: absolute;
            pointer-events: none;
            z-index: 1000;
            color: #ff6b6b;
            font-weight: bold;
            font-size: 1.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .bomb-text {
            animation: pulse 0.5s ease-in-out;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1 class="game-title">符文连线</h1>
        </div>
        
        <div class="game-stats">
            <div class="stat-item">
                <div class="stat-label">得分</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">连击</div>
                <div class="stat-value" id="combo">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">时间</div>
                <div class="stat-value" id="time">--</div>
            </div>
        </div>
        
        <div class="mode-buttons">
            <button class="mode-btn active" data-mode="zen">禅模式</button>
            <button class="mode-btn" data-mode="time-challenge">限时挑战</button>
            <button class="mode-btn" data-mode="rune-master">符文大师</button>
            <button class="mode-btn" data-mode="battle">对战模式</button>
        </div>
        
        <div class="game-board-container">
            <canvas id="game-board" width="400" height="400"></canvas>
        </div>
        
        <div class="game-footer">
            <p>连接3个或以上相同符文来消除它们！</p>
        </div>
    </div>
    
    <!-- 游戏结束弹窗 -->
    <div id="game-over-modal" class="modal hidden">
        <div class="modal-content">
            <h2>游戏结束</h2>
            <p>最终得分: <span id="final-score">0</span></p>
            <p>最大连击: <span id="max-combo">0</span></p>
            <button id="restart-btn" class="restart-btn">重新开始</button>
        </div>
    </div>

    <script>
        // Utils.js - 工具函数
        const Utils = {
            // 生成指定范围内的随机整数
            randomInt(min, max) {
                return Math.floor(Math.random() * (max - min + 1)) + min;
            },

            // 计算两点之间的距离
            distance(x1, y1, x2, y2) {
                return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
            },

            // 检查两个点是否足够接近
            pointsAreClose(x1, y1, x2, y2, threshold = 10) {
                return this.distance(x1, y1, x2, y2) <= threshold;
            },

            // 检查点是否在矩形内
            pointInRect(x, y, rectX, rectY, rectWidth, rectHeight) {
                return x >= rectX && x <= rectX + rectWidth &&
                       y >= rectY && y <= rectY + rectHeight;
            },

            // 计算两点间的角度
            angleBetweenPoints(x1, y1, x2, y2) {
                return Math.atan2(y2 - y1, x2 - x1);
            },

            // 计算路径的转角数量
            countTurns(path) {
                if (path.length < 3) return 0;
                
                let turns = 0;
                let lastDirection = null;
                
                for (let i = 1; i < path.length; i++) {
                    const prev = path[i - 1];
                    const curr = path[i];
                    
                    let direction;
                    if (curr.row === prev.row) {
                        direction = curr.col > prev.col ? 'right' : 'left';
                    } else {
                        direction = curr.row > prev.row ? 'down' : 'up';
                    }
                    
                    if (lastDirection && lastDirection !== direction) {
                        turns++;
                    }
                    
                    lastDirection = direction;
                }
                
                return turns;
            },

            // 创建流光线条效果
            createLineEffect(ctx, x1, y1, x2, y2, color = '#ffe66d') {
                const gradient = ctx.createLinearGradient(x1, y1, x2, y2);
                gradient.addColorStop(0, 'transparent');
                gradient.addColorStop(0.5, color);
                gradient.addColorStop(1, 'transparent');
                
                ctx.strokeStyle = gradient;
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            },

            // 创建爆炸效果
            createExplosionEffect(x, y, element = 'fire') {
                const effectDiv = document.createElement('div');
                effectDiv.className = `element-effect ${element}`;
                effectDiv.style.left = `${x - 25}px`;
                effectDiv.style.top = `${y - 25}px`;
                effectDiv.style.width = '50px';
                effectDiv.style.height = '50px';
                
                document.querySelector('.game-container').appendChild(effectDiv);
                
                setTimeout(() => effectDiv.remove(), 1000);
            },

            // 获取元素颜色
            getElementColor(element) {
                const colors = {
                    fire: '#ff6b6b',
                    water: '#4ecdc4',
                    earth: '#a68a64',
                    wind: '#57cc99',
                    light: '#ffe66d'
                };
                return colors[element] || '#ffffff';
            },

            // 获取元素渐变
            getElementGradient(ctx, element, x, y, radius) {
                if (!element) {
                    element = 'fire'; // 默认元素
                }
                
                const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
                
                switch (element) {
                    case 'fire':
                        gradient.addColorStop(0, '#ff6b6b');
                        gradient.addColorStop(1, '#ff4757');
                        break;
                    case 'water':
                        gradient.addColorStop(0, '#4ecdc4');
                        gradient.addColorStop(1, '#00d2d3');
                        break;
                    case 'earth':
                        gradient.addColorStop(0, '#a68a64');
                        gradient.addColorStop(1, '#8b7355');
                        break;
                    case 'wind':
                        gradient.addColorStop(0, '#57cc99');
                        gradient.addColorStop(1, '#22a6b3');
                        break;
                    case 'light':
                        gradient.addColorStop(0, '#ffe66d');
                        gradient.addColorStop(1, '#ffa502');
                        break;
                    case 'super':
                        // 超级炸弹的彩虹渐变效果
                        gradient.addColorStop(0, '#ff6b6b');
                        gradient.addColorStop(0.2, '#ffa502');
                        gradient.addColorStop(0.4, '#ffe66d');
                        gradient.addColorStop(0.6, '#57cc99');
                        gradient.addColorStop(0.8, '#4ecdc4');
                        gradient.addColorStop(1, '#a55eea');
                        break;
                    default:
                        gradient.addColorStop(0, '#ffffff');
                        gradient.addColorStop(1, '#cccccc');
                }
                
                return gradient;
            },

            // 播放音效（简化版）
            playSound(soundName, volume = 0.5) {
                // 这里可以添加实际的音效播放逻辑
                // 由于是单文件版本，暂时省略音效文件
                console.log(`Playing sound: ${soundName} at volume ${volume}`);
            },

            // 震动效果
            vibrate(duration = 100) {
                if (navigator.vibrate) {
                    navigator.vibrate(duration);
                }
            },

            // 创建连击特效
            createComboEffect(x, y, combo) {
                const effectDiv = document.createElement('div');
                effectDiv.className = 'combo-effect';
                effectDiv.style.position = 'absolute';
                effectDiv.style.left = `${x}px`;
                effectDiv.style.top = `${y}px`;
                effectDiv.style.color = '#ffe66d';
                effectDiv.style.fontSize = `${1 + combo * 0.2}rem`;
                effectDiv.style.fontWeight = 'bold';
                effectDiv.style.pointerEvents = 'none';
                effectDiv.style.zIndex = '1000';
                effectDiv.textContent = `${combo}x连击!`;
                
                document.querySelector('.game-container').appendChild(effectDiv);
                
                effectDiv.animate([
                    { transform: 'scale(0.5)', opacity: 0 },
                    { transform: 'scale(1.2)', opacity: 1 },
                    { transform: 'scale(1)', opacity: 0 }
                ], {
                    duration: 1000,
                    easing: 'ease-out'
                }).onfinish = () => effectDiv.remove();
            },

            // 格式化时间
            formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            },

            // 打乱数组
            shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }
        };

        // Rune.js - 符文类
        class Rune {
            constructor(row, col, element, level = 1) {
                this.row = row;
                this.col = col;
                this.element = element;
                this.level = level;
                this.selected = false;
                this.matched = false;
                this.age = 0;
                this.isObstacle = false;
                this.isWild = false;
                this.isBomb = false;
                this.bombRadius = 1;
                this.animation = null;
                this.showHint = false;
                
                // 符文图案定义
                this.patterns = {
                    fire: '🔥',
                    water: '💧',
                    earth: '🌍',
                    wind: '💨',
                    light: '✨'
                };
            }

            // 绘制符文
            draw(ctx, x, y, size) {
                if (this.matched && !this.animation) return;
                
                ctx.save();
                
                // 应用动画变换
                if (this.animation) {
                    this.updateAnimation();
                    
                    // 检查动画是否仍然存在（updateAnimation可能会将其设为null）
                    if (this.animation) {
                        switch (this.animation.type) {
                        case 'fall':
                            // 快速连贯的掉落动画，使用加速度曲线
                            const fallProgress = Math.pow(this.animation.progress, 0.6); // 加速下落
                            y -= (1 - fallProgress) * 100;
                            
                            // 添加轻微的拖尾效果
                            if (fallProgress > 0.2) {
                                ctx.globalAlpha = 0.9 + fallProgress * 0.1;
                            }
                            break;
                        case 'bounce':
                            const bounceScale = 1 + Math.sin(this.animation.progress * Math.PI) * 0.2;
                            ctx.scale(bounceScale, bounceScale);
                            break;
                        case 'explosion':
                            const explosionScale = 1 + this.animation.progress * 0.5;
                            const explosionAlpha = 1 - this.animation.progress;
                            ctx.globalAlpha = explosionAlpha;
                            ctx.scale(explosionScale, explosionScale);
                            break;
                        case 'match':
                            // 平滑的淡出和缩放动画，减少震颤
                            const matchProgress = this.animation.progress;
                            const smoothProgress = matchProgress * matchProgress * (3 - 2 * matchProgress); // 平滑插值
                            const matchAlpha = 1 - smoothProgress;
                            const matchScale = 1 - smoothProgress * 0.3; // 轻微缩放
                            ctx.globalAlpha = matchAlpha;
                            ctx.scale(matchScale, matchScale);
                            break;
                        case 'upgrade':
                            const upgradeScale = 1 + Math.sin(this.animation.progress * Math.PI * 2) * 0.1;
                            ctx.scale(upgradeScale, upgradeScale);
                            break;
                        case 'superBombCreation':
                            // 超级炸弹创建的特殊动画效果
                            const superProgress = this.animation.progress;
                            const superScale = 1 + Math.sin(superProgress * Math.PI * 4) * 0.2;
                            const superRotation = superProgress * Math.PI * 2;
                            ctx.scale(superScale, superScale);
                            ctx.rotate(superRotation);
                            // 添加闪烁效果
                            const flashAlpha = 0.8 + Math.sin(superProgress * Math.PI * 8) * 0.2;
                            ctx.globalAlpha = flashAlpha;
                            break;
                        }
                    }
                }
                
                this.drawRuneBody(ctx, x, y, size);
                
                ctx.restore();
            }

            // 绘制符文主体
            drawRuneBody(ctx, x, y, size) {
                const radius = size * 0.4;
                const centerX = x + size / 2;
                const centerY = y + size / 2;
                
                // 绘制符文背景
                if (this.isObstacle) {
                    // 障碍物样式
                    ctx.fillStyle = '#666666';
                    ctx.fillRect(x + size * 0.1, y + size * 0.1, size * 0.8, size * 0.8);
                    return;
                }
                
                // 获取元素渐变
                const gradient = Utils.getElementGradient(ctx, this.element, centerX, centerY, radius);
                ctx.fillStyle = gradient;
                
                // 绘制符文圆形
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.fill();
                
                // 选中状态高亮
                if (this.selected) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
                
                // 提示状态脉冲效果
                if (this.showHint) {
                    ctx.strokeStyle = '#ffe66d';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
                
                // 炸弹标识
                if (this.isBomb) {
                    if (this.isSuperBomb) {
                        // 超级炸弹的特殊标识
                        ctx.fillStyle = '#ffffff';
                        ctx.font = `${size * 0.25}px Arial`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('⚡', centerX, centerY - size * 0.1);
                        ctx.fillText('💥', centerX, centerY + size * 0.1);
                        
                        // 添加爆炸半径指示
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 2;
                        ctx.setLineDash([3, 3]);
                        ctx.beginPath();
                        ctx.arc(centerX, centerY, radius * 1.2, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    } else {
                        ctx.fillStyle = '#ff0000';
                        ctx.font = `${size * 0.3}px Arial`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('💣', centerX, centerY);
                    }
                }
                
                // 万能符文标识
                if (this.isWild) {
                    ctx.fillStyle = '#ffffff';
                    ctx.font = `${size * 0.3}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('★', centerX, centerY);
                }
                
                // 高级符文等级指示器
                if (this.level > 1 && !this.isBomb && !this.isWild) {
                    ctx.fillStyle = '#ffffff';
                    ctx.font = `${size * 0.2}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(this.level.toString(), centerX, centerY + radius * 0.6);
                }
            }

            // 更新动画
            updateAnimation() {
                if (!this.animation) return;
                
                // 根据动画类型调整速度
                let speedMultiplier = 1;
                if (this.animation.type === 'fall') {
                    speedMultiplier = 2; // 掉落动画加速2倍
                }
                
                this.animation.progress += (1 / this.animation.duration * 16.67) * speedMultiplier; // 假设60FPS
                
                if (this.animation.progress >= 1) {
                    this.animation = null;
                }
            }

            // 开始匹配动画
            startMatchAnimation() {
                this.animation = {
                    type: 'match',
                    progress: 0,
                    duration: 30 // 帧数
                };
            }

            // 开始爆炸动画
            startExplosionAnimation() {
                this.animation = {
                    type: 'explosion',
                    progress: 0,
                    duration: 20
                };
            }

            // 开始升级动画
            startUpgradeAnimation() {
                this.animation = {
                    type: 'upgrade',
                    progress: 0,
                    duration: 30
                };
            }

            // 升级符文
            upgrade() {
                if (this.level < 5) {
                    this.level++;
                    this.startUpgradeAnimation();
                    return true;
                }
                return false;
            }

            // 检查是否可以升级
            checkUpgrade() {
                return this.level < 5;
            }

            // 获取符文价值
            getValue() {
                return 50 * this.level;
            }

            // 检查符文是否匹配
            matches(other) {
                if (!other || this.isObstacle || other.isObstacle) return false;
                if (this.isWild || other.isWild) return true;
                return this.element === other.element;
            }

            // 获取符文在画布上的位置
            getCanvasPosition(board) {
                return {
                    x: board.boardX + this.col * board.cellSize,
                    y: board.boardY + this.row * board.cellSize
                };
            }
        }

        // Board.js - 棋盘类
        class Board {
            constructor(width, height, rows = 8, cols = 8) {
                this.width = width;
                this.height = height;
                this.rows = rows;
                this.cols = cols;
                this.cellSize = Math.min(width, height) / Math.max(rows, cols);
                this.boardX = (width - this.cellSize * cols) / 2;
                this.boardY = (height - this.cellSize * rows) / 2;
                
                this.grid = [];
                this.selectedPath = [];
                this.isAnimating = false;
                this.obstacleCount = 0;
                this.upgradeThreshold = 5;
                
                // 基础元素类型
                this.elements = ['fire', 'water', 'earth', 'wind', 'light'];
                
                // 特殊符文效果
                this.specialEffects = {
                    fire: 'burn',
                    water: 'refresh',
                    earth: 'obstacle',
                    wind: 'swap',
                    light: 'wild'
                };
                
                this.init();
            }

            // 初始化棋盘
            init() {
                this.grid = [];
                for (let row = 0; row < this.rows; row++) {
                    this.grid[row] = [];
                    for (let col = 0; col < this.cols; col++) {
                        this.grid[row][col] = null;
                    }
                }
                this.fillBoard();
                this.forceValidMatches();
            }

            // 填充棋盘
            fillBoard() {
                for (let row = 0; row < this.rows; row++) {
                    for (let col = 0; col < this.cols; col++) {
                        if (!this.grid[row][col]) {
                            const element = this.getRandomElement();
                            this.grid[row][col] = new Rune(row, col, element);
                        }
                    }
                }
            }

            // 获取随机元素
            getRandomElement() {
                return this.elements[Utils.randomInt(0, this.elements.length - 1)];
            }

            // 强制生成有效匹配
            forceValidMatches() {
                // 在棋盘中央创建一个简单的3连匹配
                const centerRow = Math.floor(this.rows / 2);
                const centerCol = Math.floor(this.cols / 2);
                const element = this.getRandomElement();
                
                for (let i = 0; i < 3; i++) {
                    if (centerCol + i < this.cols) {
                        this.grid[centerRow][centerCol + i] = new Rune(centerRow, centerCol + i, element);
                    }
                }
            }

            // 绘制棋盘
            draw(ctx) {
                // 绘制棋盘背景
                ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                ctx.fillRect(this.boardX, this.boardY, this.cellSize * this.cols, this.cellSize * this.rows);
                
                // 绘制网格线
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.lineWidth = 1;
                
                for (let i = 0; i <= this.rows; i++) {
                    const y = this.boardY + i * this.cellSize;
                    ctx.beginPath();
                    ctx.moveTo(this.boardX, y);
                    ctx.lineTo(this.boardX + this.cellSize * this.cols, y);
                    ctx.stroke();
                }
                
                for (let i = 0; i <= this.cols; i++) {
                    const x = this.boardX + i * this.cellSize;
                    ctx.beginPath();
                    ctx.moveTo(x, this.boardY);
                    ctx.lineTo(x, this.boardY + this.cellSize * this.rows);
                    ctx.stroke();
                }
                
                // 绘制符文
                for (let row = 0; row < this.rows; row++) {
                    for (let col = 0; col < this.cols; col++) {
                        const rune = this.grid[row][col];
                        if (rune) {
                            const x = this.boardX + col * this.cellSize;
                            const y = this.boardY + row * this.cellSize;
                            rune.draw(ctx, x, y, this.cellSize);
                        }
                    }
                }
                
                // 绘制选择路径
                this.drawSelectionPath(ctx);
            }

            // 绘制选择路径
            drawSelectionPath(ctx) {
                if (this.selectedPath.length < 2) return;
                
                ctx.strokeStyle = '#ffe66d';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                ctx.beginPath();
                
                for (let i = 0; i < this.selectedPath.length; i++) {
                    const rune = this.selectedPath[i];
                    const x = this.boardX + rune.col * this.cellSize + this.cellSize / 2;
                    const y = this.boardY + rune.row * this.cellSize + this.cellSize / 2;
                    
                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                
                ctx.stroke();
            }

            // 更新棋盘状态
            update() {
                let hasAnimation = false;
                
                for (let row = 0; row < this.rows; row++) {
                    for (let col = 0; col < this.cols; col++) {
                        const rune = this.grid[row][col];
                        if (rune && rune.animation) {
                            hasAnimation = true;
                        }
                    }
                }
                
                this.isAnimating = hasAnimation;
            }

            // 处理鼠标按下事件
            handlePointerDown(x, y) {
                const cell = this.getCellAtPosition(x, y);
                if (!cell) return null;
                
                const rune = this.grid[cell.row][cell.col];
                if (!rune || rune.matched || rune.isObstacle) return null;
                
                this.resetSelection();
                this.selectedPath = [rune];
                rune.selected = true;
                
                return { rune, cell };
            }

            // 处理鼠标移动事件
            handlePointerMove(x, y) {
                if (this.selectedPath.length === 0) return null;
                
                const cell = this.getCellAtPosition(x, y);
                if (!cell) return null;
                
                const rune = this.grid[cell.row][cell.col];
                if (!rune || rune.matched || rune.isObstacle) return null;
                
                // 检查符文是否已经在路径中
                const existingIndex = this.selectedPath.findIndex(r => r.row === rune.row && r.col === rune.col);
                
                if (existingIndex !== -1) {
                    // 如果点击的是路径中的符文，截断路径到该点
                    for (let i = existingIndex + 1; i < this.selectedPath.length; i++) {
                        this.selectedPath[i].selected = false;
                    }
                    this.selectedPath = this.selectedPath.slice(0, existingIndex + 1);
                    return { rune, cell };
                }
                
                // 检查是否可以添加到路径
                if (this.canAddToPath(rune)) {
                    this.selectedPath.push(rune);
                    rune.selected = true;
                    return { rune, cell };
                }
                
                return null;
            }

            // 处理鼠标抬起事件
            handlePointerUp() {
                if (this.selectedPath.length < 3) {
                    this.resetSelection();
                    return null;
                }
                
                // 检查路径是否有效（转角数不超过2）
                const turns = Utils.countTurns(this.selectedPath);
                if (turns > 2) {
                    this.resetSelection();
                    return null;
                }
                
                // 创建匹配结果
                const result = {
                    runes: [...this.selectedPath],
                    count: this.selectedPath.length,
                    element: this.selectedPath[0].element,
                    turns: turns,
                    matched: true
                };
                
                // 如果连线5个以上符文，在中心位置创建超级炸弹
                if (this.selectedPath.length >= 5) {
                    const centerRow = Math.floor(this.selectedPath.reduce((sum, r) => sum + r.row, 0) / this.selectedPath.length);
                    const centerCol = Math.floor(this.selectedPath.reduce((sum, r) => sum + r.col, 0) / this.selectedPath.length);
                    
                    // 延迟创建炸弹，等待消除动画完成
                    setTimeout(() => {
                        this.createSuperBomb(centerRow, centerCol, this.selectedPath.length);
                    }, 400);
                }
                
                // 移除匹配的符文
                this.removeMatchedRunes(this.selectedPath);
                this.resetSelection();
                
                return result;
            }

            // 重置选择状态
            resetSelection() {
                for (const rune of this.selectedPath) {
                    rune.selected = false;
                }
                this.selectedPath = [];
            }

            // 检查符文是否可以添加到当前路径
            canAddToPath(rune) {
                if (this.selectedPath.length === 0) return true;
                
                const lastRune = this.selectedPath[this.selectedPath.length - 1];
                
                // 检查是否相邻
                const rowDiff = Math.abs(rune.row - lastRune.row);
                const colDiff = Math.abs(rune.col - lastRune.col);
                const isAdjacent = (rowDiff === 1 && colDiff === 0) || (rowDiff === 0 && colDiff === 1);
                
                if (!isAdjacent) return false;
                
                // 检查元素是否匹配
                return rune.matches(lastRune);
            }

            // 移除匹配的符文
            removeMatchedRunes(runes) {
                for (const rune of runes) {
                    rune.matched = true;
                    rune.startMatchAnimation();
                }
                
                this.isAnimating = true;
                
                // 延迟填充空缺
                setTimeout(() => {
                    this.fillEmptySpaces();
                }, 300);
            }

            // 填充空缺
            fillEmptySpaces() {
                // 首先清除所有被标记为matched的符文
                for (let row = 0; row < this.rows; row++) {
                    for (let col = 0; col < this.cols; col++) {
                        const rune = this.grid[row][col];
                        if (rune && rune.matched) {
                            this.grid[row][col] = null;
                        }
                    }
                }
                
                // 让现有符文下落
                for (let col = 0; col < this.cols; col++) {
                    const column = [];
                    
                    // 收集未匹配的符文
                    for (let row = this.rows - 1; row >= 0; row--) {
                        const rune = this.grid[row][col];
                        if (rune && !rune.matched) {
                            column.push(rune);
                        }
                    }
                    
                    // 清空列
                    for (let row = 0; row < this.rows; row++) {
                        this.grid[row][col] = null;
                    }
                    
                    // 重新放置符文（从底部开始）
                    for (let i = 0; i < column.length; i++) {
                        const newRow = this.rows - 1 - i;
                        const rune = column[i];
                        rune.row = newRow;
                        this.grid[newRow][col] = rune;
                        
                        // 添加下落动画
                        rune.animation = {
                            type: 'fall',
                            progress: 0,
                            duration: 20
                        };
                    }
                    
                    // 生成新符文填充顶部
                    for (let i = column.length; i < this.rows; i++) {
                        const newRow = this.rows - 1 - i;
                        const element = this.getRandomElement();
                        const newRune = new Rune(newRow, col, element);
                        
                        // 添加下落动画
                        newRune.animation = {
                            type: 'fall',
                            progress: 0,
                            duration: 30
                        };
                        
                        this.grid[newRow][col] = newRune;
                    }
                }
            }

            // 根据坐标获取单元格
            getCellAtPosition(x, y) {
                const col = Math.floor((x - this.boardX) / this.cellSize);
                const row = Math.floor((y - this.boardY) / this.cellSize);
                
                if (row >= 0 && row < this.rows && col >= 0 && col < this.cols) {
                    return { row, col };
                }
                
                return null;
            }

            // 检查是否有有效匹配
            hasValidMatches() {
                // 检查水平方向
                for (let row = 0; row < this.rows; row++) {
                    for (let col = 0; col < this.cols - 2; col++) {
                        const rune1 = this.grid[row][col];
                        const rune2 = this.grid[row][col + 1];
                        const rune3 = this.grid[row][col + 2];
                        
                        if (rune1 && rune2 && rune3 &&
                            !rune1.matched && !rune2.matched && !rune3.matched &&
                            rune1.matches(rune2) && rune2.matches(rune3)) {
                            return true;
                        }
                    }
                }
                
                // 检查垂直方向
                for (let row = 0; row < this.rows - 2; row++) {
                    for (let col = 0; col < this.cols; col++) {
                        const rune1 = this.grid[row][col];
                        const rune2 = this.grid[row + 1][col];
                        const rune3 = this.grid[row + 2][col];
                        
                        if (rune1 && rune2 && rune3 &&
                            !rune1.matched && !rune2.matched && !rune3.matched &&
                            rune1.matches(rune2) && rune2.matches(rune3)) {
                            return true;
                        }
                    }
                }
                
                // 检查L形
                for (let row = 0; row < this.rows - 1; row++) {
                    for (let col = 0; col < this.cols - 1; col++) {
                        // L形 (右下)
                        const rune1 = this.grid[row][col];
                        const rune2 = this.grid[row + 1][col];
                        const rune3 = this.grid[row + 1][col + 1];
                        
                        if (rune1 && rune2 && rune3 &&
                            !rune1.matched && !rune2.matched && !rune3.matched &&
                            rune1.matches(rune2) && rune2.matches(rune3)) {
                            return true;
                        }
                        
                        // L形 (右上)
                        const rune4 = this.grid[row][col];
                        const rune5 = this.grid[row][col + 1];
                        const rune6 = this.grid[row + 1][col];
                        
                        if (rune4 && rune5 && rune6 &&
                            !rune4.matched && !rune5.matched && !rune6.matched &&
                            rune4.matches(rune5) && rune5.matches(rune6)) {
                            return true;
                        }
                    }
                }
                
                return false;
            }

            // 创建障碍物
            createObstacles(count = 2) {
                let created = 0;
                let attempts = 0;
                
                while (created < count && attempts < 20) {
                    const row = Utils.randomInt(0, this.rows - 1);
                    const col = Utils.randomInt(0, this.cols - 1);
                    const rune = this.grid[row][col];
                    
                    if (rune && !rune.isObstacle && !rune.matched) {
                        rune.isObstacle = true;
                        rune.element = 'obstacle';
                        created++;
                    }
                    
                    attempts++;
                }
            }

            // 创建万能符文
            createWildRune() {
                const emptyCells = [];
                
                for (let row = 0; row < this.rows; row++) {
                    for (let col = 0; col < this.cols; col++) {
                        const rune = this.grid[row][col];
                        if (rune && !rune.isObstacle && !rune.matched && !rune.isWild) {
                            emptyCells.push({ row, col });
                        }
                    }
                }
                
                if (emptyCells.length > 0) {
                    const randomCell = emptyCells[Utils.randomInt(0, emptyCells.length - 1)];
                    const rune = this.grid[randomCell.row][randomCell.col];
                    rune.isWild = true;
                    rune.startUpgradeAnimation();
                }
            }

            // 创建炸弹符文
            createBomb(row, col, radius = 1) {
                const rune = this.grid[row][col];
                if (rune) {
                    rune.isBomb = true;
                    rune.bombRadius = radius;
                    rune.startUpgradeAnimation();
                }
            }

            // 创建超级炸弹（5个以上连线时）
            createSuperBomb(row, col, chainLength) {
                // 确保位置有效
                if (row < 0 || row >= this.rows || col < 0 || col >= this.cols) {
                    // 如果计算的中心位置无效，找一个空位置
                    for (let r = 0; r < this.rows; r++) {
                        for (let c = 0; c < this.cols; c++) {
                            if (this.grid[r][c] && !this.grid[r][c].matched && !this.grid[r][c].isObstacle) {
                                row = r;
                                col = c;
                                break;
                            }
                        }
                        if (row >= 0 && row < this.rows) break;
                    }
                }
                
                const rune = this.grid[row][col];
                if (rune && !rune.matched && !rune.isObstacle) {
                    rune.isBomb = true;
                    rune.isSuperBomb = true;
                    // 超级炸弹的爆炸半径根据连线长度决定
                    rune.bombRadius = Math.min(3, Math.floor(chainLength / 2));
                    rune.element = 'super'; // 特殊元素类型
                    rune.startUpgradeAnimation();
                    
                    // 添加特殊的超级炸弹创建特效
                    rune.animation = {
                        type: 'superBombCreation',
                        progress: 0,
                        duration: 60
                    };
                }
            }

            // 引爆炸弹
            explodeBomb(row, col, radius) {
                const affectedRunes = [];
                
                for (let r = Math.max(0, row - radius); r <= Math.min(this.rows - 1, row + radius); r++) {
                    for (let c = Math.max(0, col - radius); c <= Math.min(this.cols - 1, col + radius); c++) {
                        const rune = this.grid[r][c];
                        if (rune && !rune.matched) {
                            affectedRunes.push(rune);
                        }
                    }
                }
                
                // 移除受影响的符文
                this.removeMatchedRunes(affectedRunes);
                
                return affectedRunes;
            }

            // 交换两列
            swapColumns(col1, col2) {
                if (col1 < 0 || col1 >= this.cols || col2 < 0 || col2 >= this.cols) return;
                
                for (let row = 0; row < this.rows; row++) {
                    const temp = this.grid[row][col1];
                    this.grid[row][col1] = this.grid[row][col2];
                    this.grid[row][col2] = temp;
                    
                    // 更新符文的列位置
                    if (this.grid[row][col1]) {
                        this.grid[row][col1].col = col1;
                    }
                    if (this.grid[row][col2]) {
                        this.grid[row][col2].col = col2;
                    }
                }
            }

            // 刷新底部一行
            refreshBottomRow() {
                const bottomRow = this.rows - 1;
                
                for (let col = 0; col < this.cols; col++) {
                    const rune = this.grid[bottomRow][col];
                    if (rune && !rune.isObstacle) {
                        const element = this.getRandomElement();
                        rune.element = element;
                        rune.level = 1;
                        rune.isWild = false;
                        rune.isBomb = false;
                        rune.startUpgradeAnimation();
                    }
                }
            }

            // 燃烧周围符文
            burnSurroundingRunes(centerRow, centerCol, count = 3) {
                const candidates = [];
                
                // 收集周围的符文
                for (let row = Math.max(0, centerRow - 2); row <= Math.min(this.rows - 1, centerRow + 2); row++) {
                    for (let col = Math.max(0, centerCol - 2); col <= Math.min(this.cols - 1, centerCol + 2); col++) {
                        if (row === centerRow && col === centerCol) continue;
                        
                        const rune = this.grid[row][col];
                        if (rune && !rune.matched && !rune.isObstacle) {
                            candidates.push(rune);
                        }
                    }
                }
                
                // 随机选择要燃烧的符文
                Utils.shuffleArray(candidates);
                const toBurn = candidates.slice(0, Math.min(count, candidates.length));
                
                if (toBurn.length > 0) {
                    this.removeMatchedRunes(toBurn);
                }
                
                return toBurn;
            }

            // 应用元素特效
            applyElementEffect(element, centerRow, centerCol) {
                switch (element) {
                    case 'fire':
                        return this.burnSurroundingRunes(centerRow, centerCol, 3);
                    
                    case 'water':
                        this.refreshBottomRow();
                        return [];
                    
                    case 'earth':
                        this.createObstacles(2);
                        return [];
                    
                    case 'wind':
                        const col1 = Utils.randomInt(0, this.cols - 1);
                        let col2 = Utils.randomInt(0, this.cols - 1);
                        while (col2 === col1) {
                            col2 = Utils.randomInt(0, this.cols - 1);
                        }
                        this.swapColumns(col1, col2);
                        return [];
                    
                    case 'light':
                        this.createWildRune();
                        return [];
                    
                    default:
                        return [];
                }
            }
        }

        // Game.js - 游戏主类
        class Game {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.width = canvas.width;
                this.height = canvas.height;
                
                this.isRunning = false;
                this.isPaused = false;
                this.gameMode = 'zen'; // zen, time-challenge, rune-master, battle
                
                // 游戏状态
                this.score = 0;
                this.combo = 0;
                this.maxCombo = 0;
                this.timeLeft = 90; // 限时模式的时间
                this.lastTime = 0;
                this.lastMatchedElement = null;
                
                // 提示系统
                this.lastInteractionTime = Date.now();
                this.hintTimeout = null;
                this.hintActive = false;
                this.hintRunes = [];
                
                // 创建棋盘
                this.board = new Board(this.width, this.height);
                
                // UI元素
                this.scoreElement = document.getElementById('score');
                this.comboElement = document.getElementById('combo');
                this.timeElement = document.getElementById('time');
                this.finalScoreElement = document.getElementById('final-score');
                this.maxComboElement = document.getElementById('max-combo');
                this.gameOverModal = document.getElementById('game-over-modal');
                this.restartBtn = document.getElementById('restart-btn');
                
                // 游戏模式按钮
                this.modeButtons = document.querySelectorAll('.mode-btn');
                
                // 成就系统
                this.achievements = {
                    firstMatch: false,
                    combo5: false,
                    score1000: false,
                    elementMaster: { fire: 0, water: 0, earth: 0, wind: 0, light: 0 }
                };
                
                // 每日挑战
                this.dailyChallenge = {
                    target: 2000,
                    progress: 0,
                    completed: false
                };
                
                // 符文大师模式
                this.runeMasterPattern = null;
                
                // 对战模式
                this.battleTurn = 0; // 0 或 1
                
                this.init();
            }

            // 初始化游戏
            init() {
                this.score = 0;
                this.combo = 0;
                this.maxCombo = 0;
                this.timeLeft = 90;
                this.lastMatchedElement = null;
                this.lastInteractionTime = Date.now();
                
                this.board.init();
                this.bindEvents();
                this.bindModeButtons();
                
                this.updateScore();
                this.updateCombo();
                this.updateTime();
                
                this.hideGameOverModal();
                
                this.isRunning = true;
                this.isPaused = false;
                this.lastTime = performance.now();
                
                this.gameLoop();
            }

            // 游戏主循环
            gameLoop() {
                if (!this.isRunning) return;
                
                const currentTime = performance.now();
                const deltaTime = currentTime - this.lastTime;
                this.lastTime = currentTime;
                
                if (!this.isPaused) {
                    this.update(deltaTime);
                }
                
                this.draw();
                
                requestAnimationFrame(() => this.gameLoop());
            }

            // 更新游戏状态
            update(deltaTime) {
                this.board.update();
                
                // 限时模式倒计时
                if (this.gameMode === 'time-challenge') {
                    this.timeLeft -= deltaTime / 1000;
                    this.updateTime();
                    
                    if (this.timeLeft <= 0) {
                        this.gameOver();
                        return;
                    }
                }
                
                // 检查是否需要显示提示（5秒无操作）
                const timeSinceInteraction = Date.now() - this.lastInteractionTime;
                if (timeSinceInteraction > 5000 && !this.hintActive && !this.board.isAnimating) {
                    this.showHint();
                }
                
                // 检查是否没有有效匹配
                if (!this.board.isAnimating && !this.board.hasValidMatches()) {
                    this.showNoMatchesMessage();
                    setTimeout(() => {
                        this.shuffleBoard();
                    }, 1500);
                }
            }

            // 绘制游戏
            draw() {
                // 清空画布
                this.ctx.clearRect(0, 0, this.width, this.height);
                
                // 绘制棋盘
                this.board.draw(this.ctx);
            }

            // 绑定事件
            bindEvents() {
                // 鼠标事件
                this.canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
                this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
                this.canvas.addEventListener('mouseup', (e) => this.handleMouseUp(e));
                
                // 触摸事件
                this.canvas.addEventListener('touchstart', (e) => this.handleTouchStart(e));
                this.canvas.addEventListener('touchmove', (e) => this.handleTouchMove(e));
                this.canvas.addEventListener('touchend', (e) => this.handleTouchEnd(e));
                
                // 重启按钮
                this.restartBtn.addEventListener('click', () => {
                    this.hideGameOverModal();
                    this.restart();
                });
            }

            // 绑定模式按钮
            bindModeButtons() {
                this.modeButtons.forEach(button => {
                    button.addEventListener('click', () => {
                        const mode = button.dataset.mode;
                        this.setGameMode(mode);
                    });
                });
            }

            // 设置游戏模式
            setGameMode(mode) {
                this.gameMode = mode;
                
                // 更新按钮状态
                this.modeButtons.forEach(button => {
                    button.classList.remove('active');
                    if (button.dataset.mode === mode) {
                        button.classList.add('active');
                    }
                });
                
                // 根据模式设置游戏参数
                switch (mode) {
                    case 'zen':
                        this.timeLeft = Infinity;
                        break;
                    case 'time-challenge':
                        this.timeLeft = 90;
                        break;
                    case 'rune-master':
                        this.setRuneMasterPattern('cross');
                        break;
                    case 'battle':
                        this.battleTurn = 0;
                        break;
                }
                
                this.updateTime();
                this.restart();
            }

            // 处理鼠标按下
            handleMouseDown(event) {
                if (this.isPaused || this.board.isAnimating) return;
                
                const rect = this.canvas.getBoundingClientRect();
                const x = event.clientX - rect.left;
                const y = event.clientY - rect.top;
                
                // 检查双击炸弹爆炸
                const cell = this.board.getCellAtPosition(x, y);
                if (cell) {
                    const rune = this.board.grid[cell.row][cell.col];
                    if (rune && rune.isBomb) {
                        const currentTime = Date.now();
                        const lastClickTime = this.lastBombClickTime || 0;
                        const timeDiff = currentTime - lastClickTime;
                        
                        if (timeDiff < 500 && this.lastClickedBomb === rune) {
                            // 双击炸弹，触发爆炸
                            this.explodeBomb(rune.row, rune.col);
                            this.lastBombClickTime = 0;
                            this.lastClickedBomb = null;
                            return;
                        } else {
                            // 记录单击
                            this.lastBombClickTime = currentTime;
                            this.lastClickedBomb = rune;
                        }
                    }
                }
                
                const result = this.board.handlePointerDown(x, y);
                if (result) {
                    this.updateInteractionTime();
                    this.clearHint();
                }
            }

            // 处理鼠标移动
            handleMouseMove(event) {
                if (this.isPaused || this.board.isAnimating) return;
                
                const rect = this.canvas.getBoundingClientRect();
                const x = event.clientX - rect.left;
                const y = event.clientY - rect.top;
                
                this.board.handlePointerMove(x, y);
            }

            // 处理鼠标抬起
            handleMouseUp(event) {
                if (this.isPaused || this.board.isAnimating) return;
                
                const result = this.board.handlePointerUp();
                if (result && result.matched) {
                    this.handleMatch(result);
                }
            }

            // 处理触摸开始
            handleTouchStart(event) {
                event.preventDefault();
                if (this.isPaused || this.board.isAnimating) return;
                
                const rect = this.canvas.getBoundingClientRect();
                const touch = event.touches[0];
                const x = touch.clientX - rect.left;
                const y = touch.clientY - rect.top;
                
                // 检查双击炸弹爆炸（触摸版本）
                const cell = this.board.getCellAtPosition(x, y);
                if (cell) {
                    const rune = this.board.grid[cell.row][cell.col];
                    if (rune && rune.isBomb) {
                        const currentTime = Date.now();
                        const lastClickTime = this.lastBombClickTime || 0;
                        const timeDiff = currentTime - lastClickTime;
                        
                        if (timeDiff < 500 && this.lastClickedBomb === rune) {
                            // 双击炸弹，触发爆炸
                            this.explodeBomb(rune.row, rune.col);
                            this.lastBombClickTime = 0;
                            this.lastClickedBomb = null;
                            return;
                        } else {
                            // 记录单击
                            this.lastBombClickTime = currentTime;
                            this.lastClickedBomb = rune;
                        }
                    }
                }
                
                const result = this.board.handlePointerDown(x, y);
                if (result) {
                    this.updateInteractionTime();
                    this.clearHint();
                }
            }

            // 处理触摸移动
            handleTouchMove(event) {
                event.preventDefault();
                if (this.isPaused || this.board.isAnimating) return;
                
                const rect = this.canvas.getBoundingClientRect();
                const touch = event.touches[0];
                const x = touch.clientX - rect.left;
                const y = touch.clientY - rect.top;
                
                this.board.handlePointerMove(x, y);
            }

            // 处理触摸结束
            handleTouchEnd(event) {
                event.preventDefault();
                if (this.isPaused || this.board.isAnimating) return;
                
                const result = this.board.handlePointerUp();
                if (result && result.matched) {
                    this.handleMatch(result);
                }
            }

            // 处理匹配
            handleMatch(result) {
                const { runes, element, count } = result;
                
                // 计算得分（5个以上连线有额外加成）
                let basePoints = this.calculatePoints(runes.length, result.turns, element);
                if (count >= 5) {
                    basePoints *= (1 + (count - 4) * 0.5); // 5个以上每多一个增加50%加成
                }
                
                // 更新连击
                this.updateComboForMatch(element);
                
                // 应用连击加成
                const comboMultiplier = 1 + (this.combo - 1) * 0.1;
                const finalPoints = Math.floor(basePoints * comboMultiplier);
                
                // 增加得分
                this.score += finalPoints;
                this.updateScore();
                
                // 显示得分动画
                this.showPointsAnimation(finalPoints, runes[0]);
                
                // 创建超级炸弹（如果是5个以上连线）
                if (count >= 5) {
                    const centerRow = Math.floor(runes.reduce((sum, r) => sum + r.row, 0) / runes.length);
                    const centerCol = Math.floor(runes.reduce((sum, r) => sum + r.col, 0) / runes.length);
                    
                    // 延迟创建超级炸弹，等待符文消除动画完成
                    setTimeout(() => {
                        this.board.createSuperBomb(centerRow, centerCol, count);
                        this.showBombCreatingEffect(centerRow, centerCol, true); // true表示超级炸弹
                    }, 300);
                }
                
                // 根据连击和元素类型触发特效
                if (this.combo >= 3) {
                    this.createElementalEffect(element, runes);
                }
                
                // 检查是否没有有效匹配，如果没有则重新洗牌
                setTimeout(() => {
                    if (!this.board.hasValidMatches()) {
                        this.shuffleBoard();
                    }
                }, 1000);
            }

            // 显示得分动画
            showPointsAnimation(points, rune) {
                const pointsElement = document.createElement('div');
                pointsElement.className = 'points-animation';
                pointsElement.textContent = `+${points}`;
                pointsElement.style.position = 'absolute';
                pointsElement.style.color = '#FFD700';
                pointsElement.style.fontSize = '24px';
                pointsElement.style.fontWeight = 'bold';
                pointsElement.style.pointerEvents = 'none';
                pointsElement.style.zIndex = '1000';
                
                const canvasRect = this.canvas.getBoundingClientRect();
                const runePos = rune.getCanvasPosition(this.board.boardX, this.board.boardY, this.board.cellSize);
                pointsElement.style.left = (canvasRect.left + runePos.x) + 'px';
                pointsElement.style.top = (canvasRect.top + runePos.y) + 'px';
                
                document.body.appendChild(pointsElement);
                
                // 动画
                pointsElement.animate([
                    { transform: 'translateY(0px)', opacity: 1 },
                    { transform: 'translateY(-50px)', opacity: 0 }
                ], {
                    duration: 1000,
                    easing: 'ease-out'
                }).onfinish = () => {
                    document.body.removeChild(pointsElement);
                };
            }

            // 创建元素特效
            createElementalEffect(element, runes) {
                switch (element) {
                    case 'fire':
                        // 火元素：燃烧周围符文
                        runes.forEach(rune => {
                            this.board.burnSurroundingRunes(rune.row, rune.col);
                        });
                        break;
                    case 'water':
                        // 水元素：刷新底部一行
                        this.board.refreshBottomRow();
                        break;
                    case 'earth':
                        // 土元素：创建障碍物
                        this.board.createObstacles(2);
                        break;
                    case 'air':
                        // 风元素：交换两列
                        const col1 = Math.floor(Math.random() * this.board.cols);
                        let col2 = Math.floor(Math.random() * this.board.cols);
                        while (col2 === col1) {
                            col2 = Math.floor(Math.random() * this.board.cols);
                        }
                        this.board.swapColumns(col1, col2);
                        break;
                    case 'light':
                        // 光元素：创建万能符文
                        const centerRune = runes[Math.floor(runes.length / 2)];
                        this.board.createWildRune(centerRune.row, centerRune.col);
                        break;
                }
            }

            // 显示炸弹创建特效
            showBombCreatingEffect(row, col, isSuper = false) {
                const effectElement = document.createElement('div');
                effectElement.className = 'bomb-effect';
                
                if (isSuper) {
                    // 超级炸弹特效
                    effectElement.innerHTML = '⚡💥⚡';
                    effectElement.style.fontSize = '40px';
                    effectElement.style.background = 'linear-gradient(45deg, #ff6b6b, #ffa502, #ffe66d, #57cc99, #4ecdc4, #a55eea)';
                    effectElement.style.backgroundClip = 'text';
                    effectElement.style.webkitBackgroundClip = 'text';
                    effectElement.style.color = 'transparent';
                    effectElement.style.textShadow = '0 0 10px rgba(255, 255, 255, 0.8)';
                } else {
                    // 普通炸弹特效
                    effectElement.textContent = '💣';
                    effectElement.style.fontSize = '32px';
                }
                
                effectElement.style.position = 'absolute';
                effectElement.style.pointerEvents = 'none';
                effectElement.style.zIndex = '1000';
                effectElement.style.fontWeight = 'bold';
                
                const canvasRect = this.canvas.getBoundingClientRect();
                const x = canvasRect.left + col * this.board.cellSize + this.board.cellSize / 2;
                const y = canvasRect.top + row * this.board.cellSize + this.board.cellSize / 2;
                effectElement.style.left = x + 'px';
                effectElement.style.top = y + 'px';
                
                document.body.appendChild(effectElement);
                
                // 动画
                const animationConfig = isSuper ? {
                    keyframes: [
                        { transform: 'scale(0) rotate(0deg)', opacity: 1, filter: 'brightness(1)' },
                        { transform: 'scale(1.2) rotate(180deg)', opacity: 1, filter: 'brightness(2)' },
                        { transform: 'scale(2) rotate(360deg)', opacity: 0, filter: 'brightness(3)' }
                    ],
                    options: { duration: 2000, easing: 'ease-out' }
                } : {
                    keyframes: [
                        { transform: 'scale(0) rotate(0deg)', opacity: 1 },
                        { transform: 'scale(1.5) rotate(360deg)', opacity: 0 }
                    ],
                    options: { duration: 1500, easing: 'ease-out' }
                };
                
                effectElement.animate(animationConfig.keyframes, animationConfig.options).onfinish = () => {
                     document.body.removeChild(effectElement);
                 };
             }

            // 计算得分
            calculatePoints(length, corners, element) {
                let basePoints = length * 10;
                
                // 长度加成
                if (length >= 5) basePoints *= 1.5;
                if (length >= 7) basePoints *= 2;
                
                // 转角奖励
                basePoints += corners * 5;
                
                // 元素连击加成
                if (this.lastMatchedElement === element) {
                    basePoints *= 1.2;
                }
                
                // 特殊位置加成（边角）
                // 这里可以根据符文位置添加额外加成
                
                return Math.floor(basePoints);
            }

            // 更新连击（匹配时）
            updateComboForMatch(element) {
                if (this.lastMatchedElement === element) {
                    this.combo++;
                } else {
                    this.combo = 1;
                }
                
                this.lastMatchedElement = element;
                this.maxCombo = Math.max(this.maxCombo, this.combo);
                this.updateCombo();
            }

            // 更新得分显示
            updateScore() {
                this.scoreElement.textContent = this.score.toLocaleString();
                this.finalScoreElement.textContent = this.score.toLocaleString();
            }

            // 更新连击显示
            updateCombo() {
                this.comboElement.textContent = this.combo;
                this.maxComboElement.textContent = this.maxCombo;
            }

            // 更新时间显示
            updateTime() {
                if (this.gameMode === 'zen') {
                    this.timeElement.textContent = '∞';
                } else {
                    const minutes = Math.floor(this.timeLeft / 60);
                    const seconds = Math.floor(this.timeLeft % 60);
                    this.timeElement.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                }
            }

            // 游戏结束
            gameOver() {
                this.isRunning = false;
                this.showGameOverModal();
            }

            // 显示游戏结束模态框
            showGameOverModal() {
                this.gameOverModal.style.display = 'flex';
            }

            // 隐藏游戏结束模态框
            hideGameOverModal() {
                this.gameOverModal.style.display = 'none';
            }

            // 重新开始游戏
            restart() {
                this.score = 0;
                this.combo = 0;
                this.maxCombo = 0;
                this.lastMatchedElement = null;
                this.lastInteractionTime = Date.now();
                
                // 根据游戏模式设置时间
                switch (this.gameMode) {
                    case 'zen':
                        this.timeLeft = Infinity;
                        break;
                    case 'time-challenge':
                        this.timeLeft = 90;
                        break;
                    case 'rune-master':
                        this.timeLeft = 120;
                        break;
                    case 'battle':
                        this.timeLeft = 60;
                        break;
                }
                
                this.board.init();
                this.updateScore();
                this.updateCombo();
                this.updateTime();
                
                this.clearHint();
                this.isRunning = true;
                this.isPaused = false;
                this.lastTime = performance.now();
            }

            // 暂停游戏
            pause() {
                this.isPaused = true;
            }

            // 恢复游戏
            resume() {
                this.isPaused = false;
                this.lastTime = performance.now();
            }

            // 设置符文大师模式图案
            setRuneMasterPattern(pattern) {
                this.runeMasterPattern = pattern;
                // 这里可以根据图案设置特殊的棋盘布局
            }

            // 切换对战回合
            switchBattleTurn() {
                this.battleTurn = 1 - this.battleTurn;
                // 这里可以添加回合切换的逻辑
            }

            // 显示无匹配消息
            showNoMatchesMessage() {
                const messageElement = document.createElement('div');
                messageElement.className = 'no-matches-message';
                messageElement.textContent = '无可用匹配，正在重新洗牌...';
                messageElement.style.position = 'fixed';
                messageElement.style.top = '50%';
                messageElement.style.left = '50%';
                messageElement.style.transform = 'translate(-50%, -50%)';
                messageElement.style.background = 'rgba(0, 0, 0, 0.8)';
                messageElement.style.color = 'white';
                messageElement.style.padding = '20px';
                messageElement.style.borderRadius = '10px';
                messageElement.style.fontSize = '18px';
                messageElement.style.zIndex = '1000';
                
                document.body.appendChild(messageElement);
                
                setTimeout(() => {
