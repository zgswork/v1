<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网页版扫雷</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .game-container {
            display: inline-block;
            margin-top: 20px;
            background-color: #bdbdbd;
            padding: 10px;
            border: 3px solid;
            border-color: #fff #7b7b7b #7b7b7b #fff;
        }
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 10px;
            margin-bottom: 10px;
            border: 3px solid;
            border-color: #7b7b7b #fff #fff #7b7b7b;
            background-color: #c0c0c0;
        }
        .counter {
            background-color: #000;
            color: #f00;
            font-family: monospace;
            font-size: 25px;
            font-weight: bold;
            padding: 5px;
            min-width: 60px;
        }
        .smiley {
            width: 30px;
            height: 30px;
            font-size: 20px;
            cursor: pointer;
            background-color: #c0c0c0;
            border: 3px solid;
            border-color: #fff #7b7b7b #7b7b7b #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .smiley:active {
            border-color: #7b7b7b #fff #fff #7b7b7b;
        }
        .game-board {
            display: grid;
            grid-gap: 1px;
            background-color: #7b7b7b;
        }
        .cell {
            width: 30px;
            height: 30px;
            background-color: #c0c0c0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            border: 3px solid;
            border-color: #fff #7b7b7b #7b7b7b #fff;
            user-select: none;
        }
        .cell.revealed {
            border: 1px solid #7b7b7b;
            background-color: #bdbdbd;
        }
        .cell.flagged {
            color: #f00;
        }
        .cell.mine {
            background-color: #f00;
        }
        .cell.mine-revealed {
            background-color: #f00;
        }
        .cell-1 { color: #00f; }
        .cell-2 { color: #080; }
        .cell-3 { color: #f00; }
        .cell-4 { color: #000080; }
        .cell-5 { color: #800000; }
        .cell-6 { color: #008080; }
        .cell-7 { color: #000; }
        .cell-8 { color: #808080; }
        .controls {
            margin-top: 20px;
        }
        select, button {
            padding: 5px 10px;
            margin: 0 5px;
            font-size: 16px;
        }
        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            display: none;
        }
        .game-over-content {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>扫雷游戏</h1>
    
    <div class="controls">
        <label for="difficulty">难度:</label>
        <select id="difficulty">
            <option value="easy">简单 (9×9, 10雷)</option>
            <option value="medium">中等 (16×16, 40雷)</option>
            <option value="hard">困难 (30×16, 99雷)</option>
        </select>
        <button id="new-game">新游戏</button>
    </div>
    
    <div class="game-container">
        <div class="game-header">
            <div class="counter" id="mine-counter">010</div>
            <div class="smiley" id="smiley">😊</div>
            <div class="counter" id="timer">000</div>
        </div>
        <div class="game-board" id="game-board"></div>
    </div>
    
    <div class="game-over" id="game-over">
        <div class="game-over-content">
            <h2 id="game-result">游戏结束!</h2>
            <p id="game-message"></p>
            <button id="play-again">再玩一次</button>
        </div>
    </div>
    
    <script>
        // 游戏配置
        const config = {
            easy: { rows: 9, cols: 9, mines: 10 },
            medium: { rows: 16, cols: 16, mines: 40 },
            hard: { rows: 16, cols: 30, mines: 99 }
        };
        
        // 游戏状态
        let gameState = {
            board: [],
            revealed: [],
            flagged: [],
            mines: 0,
            gameOver: false,
            gameWon: false,
            firstClick: true,
            timer: 0,
            timerInterval: null,
            difficulty: 'easy'
        };
        
        // DOM 元素
        const elements = {
            board: document.getElementById('game-board'),
            mineCounter: document.getElementById('mine-counter'),
            timer: document.getElementById('timer'),
            smiley: document.getElementById('smiley'),
            newGameBtn: document.getElementById('new-game'),
            difficulty: document.getElementById('difficulty'),
            gameOver: document.getElementById('game-over'),
            gameResult: document.getElementById('game-result'),
            gameMessage: document.getElementById('game-message'),
            playAgain: document.getElementById('play-again')
        };
        
        // 初始化游戏
        function initGame() {
            // 清除之前的游戏状态
            clearInterval(gameState.timerInterval);
            
            // 获取当前难度设置
            gameState.difficulty = elements.difficulty.value;
            const { rows, cols, mines } = config[gameState.difficulty];
            
            // 重置游戏状态
            gameState = {
                board: Array(rows).fill().map(() => Array(cols).fill(0)),
                revealed: Array(rows).fill().map(() => Array(cols).fill(false)),
                flagged: Array(rows).fill().map(() => Array(cols).fill(false)),
                mines: mines,
                gameOver: false,
                gameWon: false,
                firstClick: true,
                timer: 0,
                timerInterval: null,
                difficulty: gameState.difficulty
            };
            
            // 更新UI
            updateMineCounter();
            updateTimer();
            elements.smiley.textContent = '😊';
            
            // 创建游戏板
            createBoard(rows, cols);
        }
        
        // 创建游戏板
        function createBoard(rows, cols) {
            elements.board.innerHTML = '';
            elements.board.style.gridTemplateColumns = `repeat(${cols}, 30px)`;
            
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    
                    // 添加事件监听器
                    cell.addEventListener('click', () => handleCellClick(row, col));
                    cell.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        handleRightClick(row, col);
                    });
                    
                    // 鼠标按下事件
                    cell.addEventListener('mousedown', (e) => {
                        if (!gameState.gameOver && !gameState.gameWon && !gameState.flagged[row][col]) {
                            if (e.button === 0) { // 左键
                                elements.smiley.textContent = '😮';
                            }
                        }
                    });
                    
                    // 鼠标释放事件
                    cell.addEventListener('mouseup', () => {
                        if (!gameState.gameOver && !gameState.gameWon) {
                            elements.smiley.textContent = '😊';
                        }
                    });
                    
                    // 鼠标离开单元格
                    cell.addEventListener('mouseleave', () => {
                        if (!gameState.gameOver && !gameState.gameWon) {
                            elements.smiley.textContent = '😊';
                        }
                    });
                    
                    elements.board.appendChild(cell);
                }
            }
        }
        
        // 放置地雷
        function placeMines(firstRow, firstCol) {
            const { rows, cols, mines } = config[gameState.difficulty];
            let minesPlaced = 0;
            
            while (minesPlaced < mines) {
                const row = Math.floor(Math.random() * rows);
                const col = Math.floor(Math.random() * cols);
                
                // 确保第一个点击的单元格及其周围没有地雷
                const isFirstClickArea = Math.abs(row - firstRow) <= 1 && Math.abs(col - firstCol) <= 1;
                
                if (!gameState.board[row][col] && !isFirstClickArea) {
                    gameState.board[row][col] = -1; // -1 表示地雷
                    minesPlaced++;
                }
            }
            
            // 计算每个单元格周围的地雷数
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    if (gameState.board[row][col] !== -1) {
                        gameState.board[row][col] = countAdjacentMines(row, col);
                    }
                }
            }
        }
        
        // 计算相邻地雷数
        function countAdjacentMines(row, col) {
            const { rows, cols } = config[gameState.difficulty];
            let count = 0;
            
            for (let r = Math.max(0, row - 1); r <= Math.min(rows - 1, row + 1); r++) {
                for (let c = Math.max(0, col - 1); c <= Math.min(cols - 1, col + 1); c++) {
                    if (r === row && c === col) continue;
                    if (gameState.board[r][c] === -1) count++;
                }
            }
            
            return count;
        }
        
        // 处理单元格点击
        function handleCellClick(row, col) {
            if (gameState.gameOver || gameState.gameWon || gameState.flagged[row][col]) return;
            
            // 如果是第一次点击，放置地雷并开始计时
            if (gameState.firstClick) {
                placeMines(row, col);
                gameState.firstClick = false;
                startTimer();
            }
            
            // 如果点击的是地雷
            if (gameState.board[row][col] === -1) {
                revealAllMines();
                gameState.gameOver = true;
                elements.smiley.textContent = '😵';
                endGame(false);
                return;
            }
            
            // 揭示单元格
            revealCell(row, col);
            
            // 检查是否获胜
            checkWin();
        }
        
        // 处理右键点击（标记）
        function handleRightClick(row, col) {
            if (gameState.gameOver || gameState.gameWon || gameState.revealed[row][col]) return;
            
            // 切换标记状态
            gameState.flagged[row][col] = !gameState.flagged[row][col];
            
            // 更新UI
            const cell = getCellElement(row, col);
            if (gameState.flagged[row][col]) {
                cell.textContent = '🚩';
                cell.classList.add('flagged');
            } else {
                cell.textContent = '';
                cell.classList.remove('flagged');
            }
            
            // 更新地雷计数器
            updateMineCounter();
        }
        
        // 揭示单元格
        function revealCell(row, col) {
            const { rows, cols } = config[gameState.difficulty];
            
            // 如果超出边界或已经揭示或已标记，则返回
            if (row < 0 || row >= rows || col < 0 || col >= cols || 
                gameState.revealed[row][col] || gameState.flagged[row][col]) {
                return;
            }
            
            // 标记为已揭示
            gameState.revealed[row][col] = true;
            
            // 更新UI
            const cell = getCellElement(row, col);
            cell.classList.add('revealed');
            
            // 如果是数字单元格
            if (gameState.board[row][col] > 0) {
                cell.textContent = gameState.board[row][col];
                cell.classList.add(`cell-${gameState.board[row][col]}`);
                return;
            }
            
            // 如果是空白单元格（0），递归揭示周围的单元格
            if (gameState.board[row][col] === 0) {
                cell.textContent = '';
                
                // 揭示周围8个单元格
                for (let r = Math.max(0, row - 1); r <= Math.min(rows - 1, row + 1); r++) {
                    for (let c = Math.max(0, col - 1); c <= Math.min(cols - 1, col + 1); c++) {
                        if (r === row && c === col) continue;
                        revealCell(r, c);
                    }
                }
            }
        }
        
        // 揭示所有地雷
        function revealAllMines() {
            const { rows, cols } = config[gameState.difficulty];
            
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    if (gameState.board[row][col] === -1) {
                        const cell = getCellElement(row, col);
                        cell.textContent = '💣';
                        cell.classList.add('mine-revealed');
                    }
                }
            }
            
            // 检查错误标记的地雷
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    if (gameState.flagged[row][col] && gameState.board[row][col] !== -1) {
                        const cell = getCellElement(row, col);
                        cell.textContent = '❌';
                    }
                }
            }
        }
        
        // 检查是否获胜
        function checkWin() {
            const { rows, cols } = config[gameState.difficulty];
            let allNonMinesRevealed = true;
            
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    if (gameState.board[row][col] !== -1 && !gameState.revealed[row][col]) {
                        allNonMinesRevealed = false;
                        break;
                    }
                }
                if (!allNonMinesRevealed) break;
            }
            
            if (allNonMinesRevealed) {
                gameState.gameWon = true;
                elements.smiley.textContent = '😎';
                flagAllMines();
                endGame(true);
            }
        }
        
        // 标记所有地雷
        function flagAllMines() {
            const { rows, cols } = config[gameState.difficulty];
            
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    if (gameState.board[row][col] === -1 && !gameState.flagged[row][col]) {
                        gameState.flagged[row][col] = true;
                        const cell = getCellElement(row, col);
                        cell.textContent = '🚩';
                        cell.classList.add('flagged');
                    }
                }
            }
            
            updateMineCounter();
        }
        
        // 结束游戏
        function endGame(isWin) {
            clearInterval(gameState.timerInterval);
            
            elements.gameResult.textContent = isWin ? '恭喜你赢了!' : '游戏结束!';
            elements.gameMessage.textContent = isWin 
                ? `用时: ${gameState.timer} 秒` 
                : '你踩到地雷了!';
            elements.gameOver.style.display = 'flex';
        }
        
        // 开始计时器
        function startTimer() {
            gameState.timer = 0;
            updateTimer();
            
            gameState.timerInterval = setInterval(() => {
                gameState.timer++;
                updateTimer();
                
                // 限制最大时间为999秒
                if (gameState.timer >= 999) {
                    clearInterval(gameState.timerInterval);
                }
            }, 1000);
        }
        
        // 更新地雷计数器
        function updateMineCounter() {
            const { mines } = config[gameState.difficulty];
            const flaggedCount = gameState.flagged.flat().filter(Boolean).length;
            const remaining = Math.max(0, mines - flaggedCount);
            elements.mineCounter.textContent = remaining.toString().padStart(3, '0');
        }
        
        // 更新计时器显示
        function updateTimer() {
            elements.timer.textContent = gameState.timer.toString().padStart(3, '0');
        }
        
        // 获取单元格元素
        function getCellElement(row, col) {
            return document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
        }
        
        // 事件监听器
        elements.newGameBtn.addEventListener('click', initGame);
        elements.playAgain.addEventListener('click', () => {
            elements.gameOver.style.display = 'none';
            initGame();
        });
        elements.difficulty.addEventListener('change', initGame);
        elements.smiley.addEventListener('click', initGame);
        
        // 初始化游戏
        initGame();
    </script>
</body>
</html>
