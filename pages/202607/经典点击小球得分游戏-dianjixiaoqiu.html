<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>经典点击小球得分游戏</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
        }
        
        html, body {
            height: 100%;
            overflow: auto;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 15px;
            position: relative;
            min-height: 100%;
        }
        
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle, transparent 20%, #000000 150%);
            z-index: -1;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 800px;
            max-height: 95vh;
            background: rgba(10, 15, 40, 0.85);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            position: relative;
            border: 2px solid #4a9fff;
        }
        
        .header {
            text-align: center;
            padding: 15px;
            background: rgba(0, 20, 60, 0.7);
            border-bottom: 2px solid #4a9fff;
        }
        
        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            background: linear-gradient(to right, #ff9a9e, #fad0c4, #fad0c4, #a1c4fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            font-size: 1rem;
            background: rgba(0, 30, 70, 0.5);
        }
        
        .stat-box {
            text-align: center;
            flex: 1;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4affff;
            text-shadow: 0 0 10px rgba(74, 255, 255, 0.7);
        }
        
        .game-area-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }
        
        .difficulty-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            margin: 0 15px;
            overflow: hidden;
        }
        
        .difficulty-progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #00c853, #ffeb3b, #ff5252);
            border-radius: 5px;
            transition: width 0.5s ease;
        }
        
        .difficulty-label {
            text-align: center;
            padding: 5px 0;
            font-size: 0.9rem;
            color: #ffeb3b;
            margin: 0 15px;
        }
        
        .game-area {
            position: relative;
            width: 100%;
            flex: 1;
            background: rgba(5, 10, 30, 0.9);
            overflow: hidden;
            cursor: pointer;
            min-height: 200px;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            padding: 10px;
            gap: 10px;
            flex-wrap: wrap;
            background: rgba(0, 20, 50, 0.7);
            border-top: 2px solid #4a9fff;
        }
        
        button {
            background: linear-gradient(to bottom, #4a9fff, #1a5fcc);
            border: none;
            border-radius: 50px;
            color: white;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
            min-width: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        button i {
            font-size: 1.1rem;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 18px rgba(0, 0, 0, 0.4);
            background: linear-gradient(to bottom, #5aafff, #2a6fec);
        }
        
        button:active {
            transform: translateY(1px);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
        }
        
        #startBtn {
            background: linear-gradient(to bottom, #00c853, #009624);
        }
        
        #resetBtn {
            background: linear-gradient(to bottom, #ff5252, #c50e29);
        }
        
        .instructions {
            text-align: center;
            padding: 10px;
            font-size: 0.85rem;
            line-height: 1.4;
            background: rgba(0, 20, 50, 0.7);
            border-top: 2px solid #4a9fff;
        }
        
        .highlight {
            color: #ffeb3b;
            font-weight: bold;
        }
        
        .click-effect {
            position: absolute;
            pointer-events: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.7);
            transform: translate(-50%, -50%) scale(0);
            animation: clickAnimation 0.6s ease-out;
        }
        
        @keyframes clickAnimation {
            to {
                transform: translate(-50%, -50%) scale(3);
                opacity: 0;
            }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(74, 255, 255, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(74, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(74, 255, 255, 0); }
        }
        
        @media (max-width: 768px) {
            .container {
                max-height: 98vh;
            }
            
            h1 { font-size: 1.5rem; }
            .header { padding: 10px; }
            .stats { font-size: 0.9rem; }
            .stat-value { font-size: 1.3rem; }
            .controls { padding: 8px; }
            button { padding: 8px 15px; min-width: 90px; }
            .instructions { font-size: 0.8rem; padding: 8px; }
        }
        
        @media (max-width: 480px) {
            h1 { font-size: 1.3rem; }
            .stats { font-size: 0.8rem; }
            .stat-value { font-size: 1.1rem; }
            button { font-size: 0.8rem; min-width: 80px; }
            button i { font-size: 0.9rem; }
        }
        
        @media (max-height: 600px) {
            .header { padding: 10px; }
            .instructions { display: none; }
        }
        
        .mode-selector {
            display: flex;
            justify-content: center;
            padding: 8px;
            gap: 15px;
            background: rgba(0, 20, 60, 0.5);
        }
        
        .mode-btn {
            background: rgba(74, 159, 255, 0.3);
            border: 1px solid #4a9fff;
            border-radius: 20px;
            color: white;
            padding: 5px 15px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .mode-btn.active {
            background: linear-gradient(to bottom, #4a9fff, #1a5fcc);
            box-shadow: 0 0 10px rgba(74, 159, 255, 0.5);
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            padding: 8px 15px;
            background: rgba(0, 20, 50, 0.6);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-futbol"></i> 经典点击小球得分</h1>
            <p>点击移动的小球来获得分数！</p>
        </div>
        
        <div class="game-info">
            <div><i class="fas fa-star"></i> 最高分: <span id="highScore">0</span></div>
            <div><i class="fas fa-clock"></i> 时间: <span id="timer">60</span>秒</div>
        </div>
        
        <div class="stats">
            <div class="stat-box">
                <div>当前得分</div>
                <div id="score" class="stat-value">0</div>
            </div>
            <div class="stat-box">
                <div>小球数量</div>
                <div id="ballCount" class="stat-value">0</div>
            </div>
            <div class="stat-box">
                <div>游戏速度</div>
                <div id="speedLevel" class="stat-value">1x</div>
            </div>
        </div>
        
        <div class="difficulty-bar">
            <div class="difficulty-progress" id="difficultyProgress"></div>
        </div>
        <div class="difficulty-label">难度: <span id="difficultyText">简单</span></div>
        
        <div class="mode-selector">
            <div class="mode-btn active" data-speed="1">正常速度</div>
            <div class="mode-btn" data-speed="1.5">速度1.5x</div>
            <div class="mode-btn" data-speed="2">速度2x</div>
        </div>
        
        <div class="game-area-container">
            <div class="game-area" id="gameArea">
                <canvas id="gameCanvas"></canvas>
            </div>
        </div>
        
        <div class="controls">
            <button id="startBtn"><i class="fas fa-play"></i> 开始游戏</button>
            <button id="addBallBtn"><i class="fas fa-plus-circle"></i> 添加小球</button>
            <button id="resetBtn"><i class="fas fa-redo"></i> 重新开始</button>
        </div>
        
        <div class="instructions">
            <p><span class="highlight"><i class="fas fa-info-circle"></i> 游戏规则：</span> 点击移动的小球获得分数，小球越小、移动越快，得分越高！</p>
            <p>60秒倒计时，尽可能获得高分！</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 游戏元素
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const gameArea = document.getElementById('gameArea');
            const scoreElement = document.getElementById('score');
            const timerElement = document.getElementById('timer');
            const highScoreElement = document.getElementById('highScore');
            const ballCountElement = document.getElementById('ballCount');
            const speedLevelElement = document.getElementById('speedLevel');
            const startBtn = document.getElementById('startBtn');
            const resetBtn = document.getElementById('resetBtn');
            const addBallBtn = document.getElementById('addBallBtn');
            const difficultyProgress = document.getElementById('difficultyProgress');
            const difficultyText = document.getElementById('difficultyText');
            const modeButtons = document.querySelectorAll('.mode-btn');
            
            // 游戏状态
            let score = 0;
            let highScore = localStorage.getItem('ballClickHighScore') || 0;
            let timer = 60;
            let gameActive = false;
            let animationId;
            let balls = [];
            let speedMultiplier = 1;
            
            // 设置Canvas大小
            function resizeCanvas() {
                canvas.width = gameArea.clientWidth;
                canvas.height = gameArea.clientHeight;
            }
            
            // 初始化游戏
            function initGame() {
                resizeCanvas();
                highScoreElement.textContent = highScore;
                
                // 监听窗口大小变化
                window.addEventListener('resize', resizeCanvas);
                
                // 事件监听
                startBtn.addEventListener('click', startGame);
                resetBtn.addEventListener('click', resetGame);
                addBallBtn.addEventListener('click', addBall);
                gameArea.addEventListener('click', handleClick);
                gameArea.addEventListener('touchstart', handleTouch, { passive: false });
                
                // 速度模式选择
                modeButtons.forEach(btn => {
                    btn.addEventListener('click', () => {
                        modeButtons.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        speedMultiplier = parseFloat(btn.dataset.speed);
                        speedLevelElement.textContent = speedMultiplier + 'x';
                    });
                });
            }
            
            // 球类
            class Ball {
                constructor() {
                    this.radius = Math.random() * 30 + 15;
                    this.x = Math.random() * (canvas.width - this.radius * 2) + this.radius;
                    this.y = Math.random() * (canvas.height - this.radius * 2) + this.radius;
                    this.dx = (Math.random() - 0.5) * 8;
                    this.dy = (Math.random() - 0.5) * 8;
                    this.color = this.getRandomColor();
                    this.glow = 0;
                }
                
                getRandomColor() {
                    const colors = [
                        '#FF5252', '#FF4081', '#E040FB', '#7C4DFF',
                        '#536DFE', '#448AFF', '#40C4FF', '#18FFFF',
                        '#64FFDA', '#69F0AE', '#B2FF59', '#EEFF41'
                    ];
                    return colors[Math.floor(Math.random() * colors.length)];
                }
                
                update() {
                    // 边界碰撞检测
                    if (this.x + this.radius > canvas.width || this.x - this.radius < 0) {
                        this.dx = -this.dx;
                    }
                    if (this.y + this.radius > canvas.height || this.y - this.radius < 0) {
                        this.dy = -this.dy;
                    }
                    
                    // 更新位置
                    this.x += this.dx * speedMultiplier;
                    this.y += this.dy * speedMultiplier;
                    
                    // 更新发光效果
                    if (this.glow > 0) {
                        this.glow -= 0.05;
                    }
                }
                
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    
                    // 发光效果
                    if (this.glow > 0) {
                        ctx.shadowBlur = 20 * this.glow;
                        ctx.shadowColor = this.color;
                    }
                    
                    ctx.closePath();
                    
                    // 重置阴影
                    ctx.shadowBlur = 0;
                }
                
                isClicked(x, y) {
                    const distance = Math.sqrt((x - this.x) ** 2 + (y - this.y) ** 2);
                    return distance <= this.radius;
                }
            }
            
            // 创建小球
            function createBalls(count) {
                for (let i = 0; i < count; i++) {
                    balls.push(new Ball());
                }
                ballCountElement.textContent = balls.length;
            }
            
            // 添加小球
            function addBall() {
                if (!gameActive) return;
                balls.push(new Ball());
                ballCountElement.textContent = balls.length;
            }
            
            // 处理点击事件
            function handleClick(e) {
                if (!gameActive) return;
                
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                checkBallClick(x, y);
            }
            
            // 处理触摸事件
            function handleTouch(e) {
                if (!gameActive) return;
                e.preventDefault();
                
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                const x = touch.clientX - rect.left;
                const y = touch.clientY - rect.top;
                
                checkBallClick(x, y);
                
                // 添加点击效果
                createClickEffect(x, y);
            }
            
            // 创建点击效果
            function createClickEffect(x, y) {
                const effect = document.createElement('div');
                effect.className = 'click-effect';
                effect.style.left = `${x}px`;
                effect.style.top = `${y}px`;
                gameArea.appendChild(effect);
                
                // 效果结束后移除
                setTimeout(() => {
                    effect.remove();
                }, 600);
            }
            
            // 检查小球点击
            function checkBallClick(x, y) {
                for (let i = balls.length - 1; i >= 0; i--) {
                    if (balls[i].isClicked(x, y)) {
                        // 计算得分（小球越小、速度越快，得分越高）
                        const speed = Math.sqrt(balls[i].dx ** 2 + balls[i].dy ** 2);
                        const points = Math.floor((50 - balls[i].radius) * (speed + 1) / 2);
                        score += points > 0 ? points : 1;
                        
                        scoreElement.textContent = score;
                        
                        // 添加点击效果
                        balls[i].glow = 1;
                        
                        // 创建新球
                        balls.splice(i, 1);
                        balls.push(new Ball());
                        ballCountElement.textContent = balls.length;
                        return;
                    }
                }
            }
            
            // 游戏主循环
            function gameLoop() {
                // 清空画布
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // 绘制背景网格
                drawBackground();
                
                // 更新并绘制所有小球
                balls.forEach(ball => {
                    ball.update();
                    ball.draw();
                });
                
                // 继续动画
                if (gameActive) {
                    animationId = requestAnimationFrame(gameLoop);
                }
            }
            
            // 绘制背景网格
            function drawBackground() {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
                ctx.lineWidth = 1;
                
                // 绘制垂直线
                for (let x = 0; x < canvas.width; x += 40) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                    ctx.stroke();
                }
                
                // 绘制水平线
                for (let y = 0; y < canvas.height; y += 40) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }
            }
            
            // 开始游戏
            function startGame() {
                if (gameActive) return;
                
                // 重置游戏状态
                score = 0;
                timer = 60;
                gameActive = true;
                balls = [];
                
                // 更新UI
                scoreElement.textContent = score;
                timerElement.textContent = timer;
                startBtn.innerHTML = '<i class="fas fa-pause"></i> 暂停游戏';
                difficultyProgress.style.width = "0%";
                difficultyText.textContent = "简单";
                
                // 创建小球
                createBalls(5);
                
                // 开始游戏循环
                gameLoop();
                
                // 开始计时
                const countdown = setInterval(() => {
                    timer--;
                    timerElement.textContent = timer;
                    
                    // 更新难度
                    updateDifficulty();
                    
                    // 游戏结束
                    if (timer <= 0) {
                        clearInterval(countdown);
                        endGame();
                    }
                }, 1000);
            }
            
            // 更新难度
            function updateDifficulty() {
                const timeLeft = timer;
                const progress = 100 - (timeLeft / 60 * 100);
                difficultyProgress.style.width = `${progress}%`;
                
                // 基于时间调整难度
                if (timeLeft < 10) {
                    difficultyText.textContent = "疯狂";
                    // 增加速度
                    balls.forEach(ball => {
                        ball.dx *= 1.01;
                        ball.dy *= 1.01;
                    });
                    
                    // 每5秒添加一个新球
                    if (timer % 5 === 0 && balls.length < 15) {
                        balls.push(new Ball());
                        ballCountElement.textContent = balls.length;
                    }
                } else if (timeLeft < 25) {
                    difficultyText.textContent = "困难";
                } else if (timeLeft < 40) {
                    difficultyText.textContent = "中等";
                } else {
                    difficultyText.textContent = "简单";
                }
            }
            
            // 结束游戏
            function endGame() {
                gameActive = false;
                cancelAnimationFrame(animationId);
                
                // 更新最高分
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('ballClickHighScore', highScore);
                    highScoreElement.textContent = highScore;
                    highScoreElement.classList.add('pulse');
                    setTimeout(() => highScoreElement.classList.remove('pulse'), 2000);
                }
                
                // 更新UI
                startBtn.innerHTML = '<i class="fas fa-play"></i> 开始游戏';
                
                // 显示游戏结束消息
                ctx.font = "bold 40px Arial";
                ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
                ctx.textAlign = "center";
                ctx.fillText("游戏结束!", canvas.width / 2, canvas.height / 2 - 30);
                
                ctx.font = "30px Arial";
                ctx.fillText(`得分: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
                
                if (score > highScore) {
                    ctx.fillStyle = "#FFEB3B";
                    ctx.fillText("新纪录!", canvas.width / 2, canvas.height / 2 + 70);
                }
            }
            
            // 重置游戏
            function resetGame() {
                if (gameActive) {
                    cancelAnimationFrame(animationId);
                    gameActive = false;
                }
                
                score = 0;
                timer = 60;
                balls = [];
                
                // 更新UI
                scoreElement.textContent = score;
                timerElement.textContent = timer;
                startBtn.innerHTML = '<i class="fas fa-play"></i> 开始游戏';
                difficultyProgress.style.width = "0%";
                difficultyText.textContent = "简单";
                ballCountElement.textContent = "0";
                
                // 清空画布
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawBackground();
            }
            
            // 初始化游戏
            initGame();
            
            // 初始绘制背景
            resizeCanvas();
            drawBackground();
        });
    </script>
</body>
</html>
