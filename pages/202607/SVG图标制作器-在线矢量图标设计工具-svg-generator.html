    <script>

        // SVG图标制作器主要功能
        class SVGIconMaker {
            constructor() {
                this.canvas = document.getElementById('svgCanvas');
                this.currentTool = 'select';
                this.isDrawing = false;
                this.isDragging = false;
                this.currentElement = null;
                this.selectedElement = null;
                this.elements = [];
                this.gridVisible = true;
                this.zoom = 1;
                this.startX = 0;
                this.startY = 0;
                this.dragStartX = 0;
                this.dragStartY = 0;
                this.elementStartPos = null;

                // 初始化设置模态框
                this.settingsModal = new SettingsModal(this);

                this.init();
            }

            init() {
                this.bindEvents();
                this.updateCodePreview();
                this.initializeProperties();
            }

            bindEvents() {
                // 工具选择
                document.querySelectorAll('.tool-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.selectTool(e.target.closest('.tool-btn').dataset.tool);
                    });
                });

                // 画布事件
                this.canvas.addEventListener('mousedown', this.handleMouseDown.bind(this));
                this.canvas.addEventListener('mousemove', this.handleMouseMove.bind(this));
                this.canvas.addEventListener('mouseup', this.handleMouseUp.bind(this));

                // 键盘事件 - 删除功能
                document.addEventListener('keydown', (e) => {
                    if ((e.key === 'Delete' || e.key === 'Backspace') && this.selectedElement && this.selectedElement !== this.canvas) {
                        this.deleteSelectedElement();
                    }
                });

                // 顶部按钮事件
                document.getElementById('newBtn').addEventListener('click', this.newCanvas.bind(this));
                document.getElementById('openBtn').addEventListener('click', this.openFile.bind(this));
                document.getElementById('saveBtn').addEventListener('click', this.saveFile.bind(this));
                document.getElementById('exportBtn').addEventListener('click', this.exportSVG.bind(this));
                document.getElementById('gridToggle').addEventListener('click', this.toggleGrid.bind(this));
                document.getElementById('zoomIn').addEventListener('click', () => this.setZoom(this.zoom * 1.2));
                document.getElementById('zoomOut').addEventListener('click', () => this.setZoom(this.zoom / 1.2));

                // 代码预览按钮
                document.getElementById('copyCodeBtn').addEventListener('click', this.copyCode.bind(this));
                document.getElementById('downloadSvgBtn').addEventListener('click', this.downloadSVG.bind(this));
                document.getElementById('toggleCodeBtn').addEventListener('click', this.toggleCodePreview.bind(this));

                // 帮助按钮
                document.getElementById('helpBtn').addEventListener('click', this.showHelpModal.bind(this));

                // 设置按钮
                document.getElementById('settingsBtn').addEventListener('click', this.showSettingsModal.bind(this));

                // 属性面板事件
                this.bindPropertyEvents();

                // 模板按钮事件
                document.querySelectorAll('.template-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.loadTemplate(e.target.closest('.template-btn').dataset.template);
                    });
                });
            }

            bindPropertyEvents() {
                // 填充颜色
                document.getElementById('fillColor').addEventListener('change', this.updateSelectedElementFill.bind(this));
                document.getElementById('fillColorText').addEventListener('change', this.updateSelectedElementFill.bind(this));
                document.getElementById('fillOpacity').addEventListener('input', this.updateSelectedElementFill.bind(this));

                // 描边属性
                document.getElementById('strokeColor').addEventListener('change', this.updateSelectedElementStroke.bind(this));
                document.getElementById('strokeColorText').addEventListener('change', this.updateSelectedElementStroke.bind(this));
                document.getElementById('strokeWidth').addEventListener('input', this.updateSelectedElementStroke.bind(this));

                // 变换属性
                ['posX', 'posY', 'width', 'height'].forEach(id => {
                    document.getElementById(id).addEventListener('change', this.updateSelectedElementTransform.bind(this));
                });

                // 滑块值显示更新
                document.getElementById('fillOpacity').addEventListener('input', (e) => {
                    document.querySelector('#fillOpacity + .slider-value').textContent = Math.round(e.target.value * 100) + '%';
                });

                document.getElementById('strokeWidth').addEventListener('input', (e) => {
                    document.querySelector('#strokeWidth + .slider-value').textContent = e.target.value + 'px';
                });
            }

            selectTool(tool) {
                this.currentTool = tool;
                document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
                document.querySelector(`[data-tool="${tool}"]`).classList.add('active');

                // 更改画布光标
                const cursors = {
                    select: 'default',
                    rectangle: 'crosshair',
                    circle: 'crosshair',
                    ellipse: 'crosshair',
                    line: 'crosshair',
                    polygon: 'crosshair',
                    text: 'text'
                };
                this.canvas.style.cursor = cursors[tool] || 'crosshair';
            }

            handleMouseDown(e) {
                const rect = this.canvas.getBoundingClientRect();
                this.startX = e.clientX - rect.left;
                this.startY = e.clientY - rect.top;

                if (this.currentTool === 'select') {
                    const target = e.target;
                    const isUserElement = this.elements.includes(target);

                    if (isUserElement) {
                        this.selectElement(target);
                        // 准备拖拽
                        this.isDragging = true;
                        this.dragStartX = this.startX;
                        this.dragStartY = this.startY;
                        this.elementStartPos = this.getElementPosition(target);
                    } else {
                        this.handleSelect(e);
                    }
                } else {
                    this.startDrawing(e);
                }
            }

            handleMouseMove(e) {
                const rect = this.canvas.getBoundingClientRect();
                const currentX = e.clientX - rect.left;
                const currentY = e.clientY - rect.top;

                if (this.isDrawing && this.currentElement) {
                    this.updateCurrentElement(currentX, currentY);
                } else if (this.isDragging && this.selectedElement) {
                    this.dragElement(currentX, currentY);
                }
            }

            handleMouseUp(e) {
                if (this.isDrawing && this.currentElement) {
                    this.finishDrawing();
                }

                if (this.isDragging) {
                    this.isDragging = false;
                    this.updateCodePreview();
                    this.updatePropertiesPanel(this.selectedElement);
                }

                this.isDrawing = false;
                this.isDragging = false;
                this.currentElement = null;
            }

            getElementPosition(element) {
                switch (element.tagName) {
                    case 'rect':
                        return {
                            x: parseFloat(element.getAttribute('x')) || 0,
                            y: parseFloat(element.getAttribute('y')) || 0
                        };
                    case 'circle':
                        return {
                            x: parseFloat(element.getAttribute('cx')) || 0,
                            y: parseFloat(element.getAttribute('cy')) || 0
                        };
                    case 'ellipse':
                        return {
                            x: parseFloat(element.getAttribute('cx')) || 0,
                            y: parseFloat(element.getAttribute('cy')) || 0
                        };
                    case 'line':
                        return {
                            x: parseFloat(element.getAttribute('x1')) || 0,
                            y: parseFloat(element.getAttribute('y1')) || 0,
                            x2: parseFloat(element.getAttribute('x2')) || 0,
                            y2: parseFloat(element.getAttribute('y2')) || 0
                        };
                    case 'polygon':
                        const points = element.getAttribute('points') || '';
                        return { points: points };
                    default:
                        return { x: 0, y: 0 };
                }
            }

            dragElement(currentX, currentY) {
                if (!this.selectedElement || !this.elementStartPos) return;

                const deltaX = currentX - this.dragStartX;
                const deltaY = currentY - this.dragStartY;

                switch (this.selectedElement.tagName) {
                    case 'rect':
                        this.selectedElement.setAttribute('x', this.elementStartPos.x + deltaX);
                        this.selectedElement.setAttribute('y', this.elementStartPos.y + deltaY);
                        break;
                    case 'circle':
                        this.selectedElement.setAttribute('cx', this.elementStartPos.x + deltaX);
                        this.selectedElement.setAttribute('cy', this.elementStartPos.y + deltaY);
                        break;
                    case 'ellipse':
                        this.selectedElement.setAttribute('cx', this.elementStartPos.x + deltaX);
                        this.selectedElement.setAttribute('cy', this.elementStartPos.y + deltaY);
                        break;
                    case 'line':
                        this.selectedElement.setAttribute('x1', this.elementStartPos.x + deltaX);
                        this.selectedElement.setAttribute('y1', this.elementStartPos.y + deltaY);
                        this.selectedElement.setAttribute('x2', this.elementStartPos.x2 + deltaX);
                        this.selectedElement.setAttribute('y2', this.elementStartPos.y2 + deltaY);
                        break;
                    case 'polygon':
                        // 对于多边形，需要解析和更新所有点
                        const points = this.elementStartPos.points.split(' ').map(point => {
                            const [x, y] = point.split(',').map(Number);
                            return `${x + deltaX},${y + deltaY}`;
                        }).join(' ');
                        this.selectedElement.setAttribute('points', points);
                        break;
                }
            }

            startDrawing(e) {
                this.isDrawing = true;

                switch (this.currentTool) {
                    case 'rectangle':
                        this.currentElement = this.createRectangle(this.startX, this.startY);
                        break;
                    case 'circle':
                        this.currentElement = this.createCircle(this.startX, this.startY);
                        break;
                    case 'ellipse':
                        this.currentElement = this.createEllipse(this.startX, this.startY);
                        break;
                    case 'line':
                        this.currentElement = this.createLine(this.startX, this.startY);
                        break;
                    case 'polygon':
                        this.currentElement = this.createPolygon(this.startX, this.startY);
                        break;
                }

                if (this.currentElement) {
                    this.canvas.appendChild(this.currentElement);
                }
            }

            createRectangle(x, y) {
                const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                rect.setAttribute('x', x);
                rect.setAttribute('y', y);
                rect.setAttribute('width', 0);
                rect.setAttribute('height', 0);
                rect.setAttribute('fill', document.getElementById('fillColor').value);
                rect.setAttribute('stroke', document.getElementById('strokeColor').value);
                rect.setAttribute('stroke-width', document.getElementById('strokeWidth').value);
                rect.setAttribute('fill-opacity', document.getElementById('fillOpacity').value);
                return rect;
            }

            createCircle(x, y) {
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', x);
                circle.setAttribute('cy', y);
                circle.setAttribute('r', 0);
                circle.setAttribute('fill', document.getElementById('fillColor').value);
                circle.setAttribute('stroke', document.getElementById('strokeColor').value);
                circle.setAttribute('stroke-width', document.getElementById('strokeWidth').value);
                circle.setAttribute('fill-opacity', document.getElementById('fillOpacity').value);
                return circle;
            }

            createEllipse(x, y) {
                const ellipse = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
                ellipse.setAttribute('cx', x);
                ellipse.setAttribute('cy', y);
                ellipse.setAttribute('rx', 0);
                ellipse.setAttribute('ry', 0);
                ellipse.setAttribute('fill', document.getElementById('fillColor').value);
                ellipse.setAttribute('stroke', document.getElementById('strokeColor').value);
                ellipse.setAttribute('stroke-width', document.getElementById('strokeWidth').value);
                ellipse.setAttribute('fill-opacity', document.getElementById('fillOpacity').value);
                return ellipse;
            }

            createLine(x, y) {
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x);
                line.setAttribute('y1', y);
                line.setAttribute('x2', x);
                line.setAttribute('y2', y);
                line.setAttribute('stroke', document.getElementById('strokeColor').value);
                line.setAttribute('stroke-width', document.getElementById('strokeWidth').value);
                line.setAttribute('fill', 'none');
                return line;
            }

            createPolygon(x, y) {
                const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                const points = `${x},${y} ${x + 50},${y - 30} ${x + 30},${y + 40} ${x - 30},${y + 40} ${x - 50},${y - 30}`;
                polygon.setAttribute('points', points);
                polygon.setAttribute('fill', document.getElementById('fillColor').value);
                polygon.setAttribute('stroke', document.getElementById('strokeColor').value);
                polygon.setAttribute('stroke-width', document.getElementById('strokeWidth').value);
                polygon.setAttribute('fill-opacity', document.getElementById('fillOpacity').value);
                return polygon;
            }

            updateCurrentElement(currentX, currentY) {
                if (!this.currentElement) return;

                const width = Math.abs(currentX - this.startX);
                const height = Math.abs(currentY - this.startY);
                const minX = Math.min(this.startX, currentX);
                const minY = Math.min(this.startY, currentY);

                switch (this.currentTool) {
                    case 'rectangle':
                        this.currentElement.setAttribute('x', minX);
                        this.currentElement.setAttribute('y', minY);
                        this.currentElement.setAttribute('width', width);
                        this.currentElement.setAttribute('height', height);
                        break;
                    case 'circle':
                        const radius = Math.sqrt(width * width + height * height) / 2;
                        this.currentElement.setAttribute('r', radius);
                        break;
                    case 'ellipse':
                        this.currentElement.setAttribute('rx', width / 2);
                        this.currentElement.setAttribute('ry', height / 2);
                        this.currentElement.setAttribute('cx', minX + width / 2);
                        this.currentElement.setAttribute('cy', minY + height / 2);
                        break;
                    case 'line':
                        this.currentElement.setAttribute('x2', currentX);
                        this.currentElement.setAttribute('y2', currentY);
                        break;
                }
            }

            finishDrawing() {
                if (this.currentElement) {
                    // 检查是否有足够的拖拽距离，避免意外点击创建图形
                    let width = 0, height = 0;
                    const minSize = 5; // 最小尺寸阈值

                    // 根据不同图形类型获取尺寸
                    if (this.currentTool === 'rectangle') {
                        width = Math.abs(parseFloat(this.currentElement.getAttribute('width') || 0));
                        height = Math.abs(parseFloat(this.currentElement.getAttribute('height') || 0));
                    } else if (this.currentTool === 'circle') {
                        const r = Math.abs(parseFloat(this.currentElement.getAttribute('r') || 0));
                        width = height = r * 2;
                    } else if (this.currentTool === 'ellipse') {
                        const rx = Math.abs(parseFloat(this.currentElement.getAttribute('rx') || 0));
                        const ry = Math.abs(parseFloat(this.currentElement.getAttribute('ry') || 0));
                        width = rx * 2;
                        height = ry * 2;
                    } else if (this.currentTool === 'line') {
                        const x1 = parseFloat(this.currentElement.getAttribute('x1') || 0);
                        const y1 = parseFloat(this.currentElement.getAttribute('y1') || 0);
                        const x2 = parseFloat(this.currentElement.getAttribute('x2') || 0);
                        const y2 = parseFloat(this.currentElement.getAttribute('y2') || 0);
                        const length = Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);

                        if (length < minSize) {
                            this.currentElement.remove();
                            return;
                        }
                    } else if (this.currentTool === 'polygon') {
                        // 多边形总是添加，因为它有预设大小
                    }

                    // 检查其他图形的尺寸
                    if (this.currentTool !== 'line' && this.currentTool !== 'polygon') {
                        if (width < minSize || height < minSize) {
                            this.currentElement.remove();
                            return;
                        }
                    }

                    // 只有拖拽足够距离才添加到元素列表
                    this.elements.push(this.currentElement);
                    this.updateLayerList();
                    this.updateCodePreview();
                    this.selectElement(this.currentElement);
                }
            }

            handleSelect(e) {
                const target = e.target;

                // 防止选择网格背景和defs元素
                if (target.classList && target.classList.contains('grid-pattern')) {
                    this.selectElement(null);
                    return;
                }

                if (target.tagName === 'defs' || target.tagName === 'pattern') {
                    this.selectElement(null);
                    return;
                }

                // 检查是否点击了用户创建的SVG元素
                const isUserElement = this.elements.includes(target);

                if (isUserElement) {
                    this.selectElement(target);
                } else if (target === this.canvas) {
                    this.selectElement(null);
                }
            }

            deleteSelectedElement() {
                if (!this.selectedElement || this.selectedElement === this.canvas) return;

                // 从elements数组中移除
                const index = this.elements.indexOf(this.selectedElement);
                if (index > -1) {
                    this.elements.splice(index, 1);
                }

                // 从DOM中移除
                this.selectedElement.remove();

                // 清除选择状态
                this.selectedElement = null;

                // 更新界面
                this.updateLayerList();
                this.updateCodePreview();
                this.clearPropertiesPanel();
            }

            deleteElement(index) {
                if (index >= 0 && index < this.elements.length) {
                    const element = this.elements[index];

                    // 如果删除的是当前选中的元素
                    if (this.selectedElement === element) {
                        this.selectedElement = null;
                        this.clearPropertiesPanel();
                    }

                    // 从数组和DOM中移除
                    this.elements.splice(index, 1);
                    element.remove();

                    // 更新界面
                    this.updateLayerList();
                    this.updateCodePreview();
                }
            }

            selectElement(element) {
                // 移除之前的选中状态
                if (this.selectedElement) {
                    this.selectedElement.classList.remove('selected');
                }

                this.selectedElement = element;

                if (element && element !== this.canvas) {
                    element.classList.add('selected');
                    this.updatePropertiesPanel(element);
                } else {
                    this.clearPropertiesPanel();
                }
            }

            updatePropertiesPanel(element) {
                if (!element) return;

                // 更新填充属性
                const fill = element.getAttribute('fill') || '#007AFF';
                const fillOpacity = element.getAttribute('fill-opacity') || '1';
                document.getElementById('fillColor').value = fill;
                document.getElementById('fillColorText').value = fill;
                document.getElementById('fillOpacity').value = fillOpacity;
                document.querySelector('#fillOpacity + .slider-value').textContent = Math.round(fillOpacity * 100) + '%';

                // 更新描边属性
                const stroke = element.getAttribute('stroke') || '#000000';
                const strokeWidth = element.getAttribute('stroke-width') || '2';
                document.getElementById('strokeColor').value = stroke;
                document.getElementById('strokeColorText').value = stroke;
                document.getElementById('strokeWidth').value = strokeWidth;
                document.querySelector('#strokeWidth + .slider-value').textContent = strokeWidth + 'px';

                // 更新变换属性
                this.updateTransformInputs(element);
            }

            updateTransformInputs(element) {
                let x = 0, y = 0, width = 0, height = 0;

                switch (element.tagName) {
                    case 'rect':
                        x = parseFloat(element.getAttribute('x')) || 0;
                        y = parseFloat(element.getAttribute('y')) || 0;
                        width = parseFloat(element.getAttribute('width')) || 0;
                        height = parseFloat(element.getAttribute('height')) || 0;
                        break;
                    case 'circle':
                        x = parseFloat(element.getAttribute('cx')) || 0;
                        y = parseFloat(element.getAttribute('cy')) || 0;
                        const r = parseFloat(element.getAttribute('r')) || 0;
                        width = height = r * 2;
                        break;
                    case 'ellipse':
                        x = parseFloat(element.getAttribute('cx')) || 0;
                        y = parseFloat(element.getAttribute('cy')) || 0;
                        width = (parseFloat(element.getAttribute('rx')) || 0) * 2;
                        height = (parseFloat(element.getAttribute('ry')) || 0) * 2;
                        break;
                }

                document.getElementById('posX').value = Math.round(x);
                document.getElementById('posY').value = Math.round(y);
                document.getElementById('width').value = Math.round(width);
                document.getElementById('height').value = Math.round(height);
            }

            clearPropertiesPanel() {
                // 重置为默认值
                document.getElementById('fillColor').value = '#007AFF';
                document.getElementById('fillColorText').value = '#007AFF';
                document.getElementById('fillOpacity').value = '1';
                document.getElementById('strokeColor').value = '#000000';
                document.getElementById('strokeColorText').value = '#000000';
                document.getElementById('strokeWidth').value = '2';
                document.getElementById('posX').value = '0';
                document.getElementById('posY').value = '0';
                document.getElementById('width').value = '100';
                document.getElementById('height').value = '100';
            }

            updateSelectedElementFill() {
                if (!this.selectedElement) return;

                const fillColor = document.getElementById('fillColor').value;
                const fillOpacity = document.getElementById('fillOpacity').value;

                this.selectedElement.setAttribute('fill', fillColor);
                this.selectedElement.setAttribute('fill-opacity', fillOpacity);

                // 同步颜色输入框
                document.getElementById('fillColorText').value = fillColor;
                document.querySelector('#fillOpacity + .slider-value').textContent = Math.round(fillOpacity * 100) + '%';

                this.updateCodePreview();
            }

            updateSelectedElementStroke() {
                if (!this.selectedElement) return;

                const strokeColor = document.getElementById('strokeColor').value;
                const strokeWidth = document.getElementById('strokeWidth').value;

                this.selectedElement.setAttribute('stroke', strokeColor);
                this.selectedElement.setAttribute('stroke-width', strokeWidth);

                // 同步颜色输入框
                document.getElementById('strokeColorText').value = strokeColor;
                document.querySelector('#strokeWidth + .slider-value').textContent = strokeWidth + 'px';

                this.updateCodePreview();
            }

            updateSelectedElementTransform() {
                if (!this.selectedElement) return;

                const x = parseFloat(document.getElementById('posX').value) || 0;
                const y = parseFloat(document.getElementById('posY').value) || 0;
                const width = parseFloat(document.getElementById('width').value) || 0;
                const height = parseFloat(document.getElementById('height').value) || 0;

                switch (this.selectedElement.tagName) {
                    case 'rect':
                        this.selectedElement.setAttribute('x', x);
                        this.selectedElement.setAttribute('y', y);
                        this.selectedElement.setAttribute('width', width);
                        this.selectedElement.setAttribute('height', height);
                        break;
                    case 'circle':
                        this.selectedElement.setAttribute('cx', x);
                        this.selectedElement.setAttribute('cy', y);
                        this.selectedElement.setAttribute('r', width / 2);
                        break;
                    case 'ellipse':
                        this.selectedElement.setAttribute('cx', x);
                        this.selectedElement.setAttribute('cy', y);
                        this.selectedElement.setAttribute('rx', width / 2);
                        this.selectedElement.setAttribute('ry', height / 2);
                        break;
                }

                this.updateCodePreview();
            }

            updateLayerList() {
                const layerList = document.getElementById('layerList');
                layerList.innerHTML = '<div class="layer-item"><span class="layer-name">画布</span><div class="layer-controls"><button class="layer-btn" title="显示/隐藏"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M1 8S3 3 8 3S15 8 15 8S13 13 8 13S1 8 1 8Z" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.5"/></svg></button></div></div>';

                this.elements.forEach((element, index) => {
                    const layerItem = document.createElement('div');
                    layerItem.className = 'layer-item';
                    layerItem.innerHTML = `
                <span class="layer-name">${element.tagName} ${index + 1}</span>
                <div class="layer-controls">
                    <button class="layer-btn" title="显示/隐藏">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <path d="M1 8S3 3 8 3S15 8 15 8S13 13 8 13S1 8 1 8Z" stroke="currentColor" stroke-width="1.5"/>
                            <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.5"/>
                        </svg>
                    </button>
                    <button class="layer-btn" title="删除" onclick="event.stopPropagation(); svgMaker.deleteElement(${index})">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <path d="M6 2L10 2M2 4H14M12 4V12C12 13.1046 11.1046 14 10 14H6C4.89543 14 4 13.1046 4 12V4" stroke="currentColor" stroke-width="1.5"/>
                        </svg>
                    </button>
                </div>
            `;

                    layerItem.addEventListener('click', (e) => {
                        e.preventDefault();
                        this.selectElement(element);
                    });
                    layerList.appendChild(layerItem);
                });
            }

            updateCodePreview() {
                const codeElement = document.getElementById('svgCode');

                // 获取所有非网格的SVG元素
                const svgElements = Array.from(this.canvas.children).filter(child =>
                    !child.classList.contains('grid-pattern') &&
                    child.tagName !== 'defs' &&
                    child.tagName !== 'pattern'
                );

                // 生成干净的SVG代码
                let svgContent = '';
                svgElements.forEach(element => {
                    const elementClone = element.cloneNode(true);
                    elementClone.classList.remove('selected');
                    const serializer = new XMLSerializer();
                    const elementString = serializer.serializeToString(elementClone);
                    svgContent += '  ' + elementString + '\n';
                });

                const cleanSvg = `<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
${svgContent}</svg>`;

                codeElement.textContent = cleanSvg;
            }

            newCanvas() {
                // 清空画布
                this.elements.forEach(element => element.remove());
                this.elements = [];
                this.selectedElement = null;
                this.updateLayerList();
                this.updateCodePreview();
                this.clearPropertiesPanel();
            }

            openFile() {
                // 创建文件输入元素
                const fileInput = document.createElement('input');
                fileInput.type = 'file';
                fileInput.accept = '.svg,.json';
                fileInput.style.display = 'none';

                fileInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const content = event.target.result;

                            if (file.name.endsWith('.svg')) {
                                this.loadSVGFile(content);
                            } else if (file.name.endsWith('.json')) {
                                this.loadProjectFile(content);
                            }

                            // 显示成功提示
                            this.showNotification('文件加载成功！', 'success');
                        } catch (error) {
                            console.error('文件加载失败:', error);
                            this.showNotification('文件格式不正确或已损坏', 'error');
                        }
                    };

                    reader.readAsText(file);
                    document.body.removeChild(fileInput);
                });

                document.body.appendChild(fileInput);
                fileInput.click();
            }

            saveFile() {
                // 创建项目数据
                const projectData = {
                    version: '1.0',
                    canvas: {
                        width: 400,
                        height: 400,
                        viewBox: '0 0 400 400'
                    },
                    elements: this.elements.map(element => {
                        return {
                            tagName: element.tagName,
                            attributes: this.getElementAttributes(element)
                        };
                    }),
                    timestamp: new Date().toISOString()
                };

                const jsonContent = JSON.stringify(projectData, null, 2);
                const blob = new Blob([jsonContent], { type: 'application/json' });
                const url = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = url;
                a.download = `svg-project-${new Date().getTime()}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                this.showNotification('项目保存成功！', 'success');
            }

            loadSVGFile(svgContent) {
                // 清空当前画布
                this.newCanvas();

                // 解析SVG内容
                const parser = new DOMParser();
                const svgDoc = parser.parseFromString(svgContent, 'image/svg+xml');
                const svgElement = svgDoc.querySelector('svg');

                if (!svgElement) {
                    throw new Error('无效的SVG文件');
                }

                // 获取所有子元素（排除defs等）
                const children = Array.from(svgElement.children).filter(child =>
                    !['defs', 'pattern', 'clipPath', 'mask'].includes(child.tagName.toLowerCase())
                );

                // 重新创建元素
                children.forEach(child => {
                    const newElement = document.createElementNS('http://www.w3.org/2000/svg', child.tagName);

                    // 复制所有属性
                    Array.from(child.attributes).forEach(attr => {
                        newElement.setAttribute(attr.name, attr.value);
                    });

                    this.canvas.appendChild(newElement);
                    this.elements.push(newElement);
                });

                this.updateLayerList();
                this.updateCodePreview();
            }

            loadProjectFile(jsonContent) {
                const projectData = JSON.parse(jsonContent);

                if (!projectData.elements) {
                    throw new Error('无效的项目文件');
                }

                // 清空当前画布
                this.newCanvas();

                // 重新创建元素
                projectData.elements.forEach(elementData => {
                    const element = document.createElementNS('http://www.w3.org/2000/svg', elementData.tagName);

                    // 设置属性
                    Object.entries(elementData.attributes).forEach(([name, value]) => {
                        element.setAttribute(name, value);
                    });

                    this.canvas.appendChild(element);
                    this.elements.push(element);
                });

                this.updateLayerList();
                this.updateCodePreview();
            }

            getElementAttributes(element) {
                const attributes = {};
                Array.from(element.attributes).forEach(attr => {
                    attributes[attr.name] = attr.value;
                });
                return attributes;
            }

            showNotification(message, type = 'info') {
                // 创建通知元素
                const notification = document.createElement('div');
                notification.className = `notification notification-${type}`;
                notification.textContent = message;

                // 添加样式
                Object.assign(notification.style, {
                    position: 'fixed',
                    top: '20px',
                    right: '20px',
                    padding: '12px 20px',
                    borderRadius: '8px',
                    color: 'white',
                    fontWeight: '500',
                    zIndex: '1001',
                    transform: 'translateX(100%)',
                    transition: 'transform 0.3s ease',
                    maxWidth: '300px',
                    wordWrap: 'break-word'
                });

                // 设置背景色
                const colors = {
                    success: '#34C759',
                    error: '#FF3B30',
                    info: '#007AFF'
                };
                notification.style.backgroundColor = colors[type] || colors.info;

                document.body.appendChild(notification);

                // 显示动画
                setTimeout(() => {
                    notification.style.transform = 'translateX(0)';
                }, 100);

                // 自动隐藏
                setTimeout(() => {
                    notification.style.transform = 'translateX(100%)';
                    setTimeout(() => {
                        if (notification.parentNode) {
                            document.body.removeChild(notification);
                        }
                    }, 300);
                }, 3000);
            }

                a.href = url;

                                </div>
                            </div>
                            <div class="grid-opacity-option">
                                <label>网格透明度</label>
                                <div class="opacity-inputs">
                                    <input type="range" id="gridOpacity" min="0" max="1" step="0.1" value="0.5">
                                    <span class="opacity-value">50%</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="settings-footer">
                    <button class="btn btn-secondary" id="resetSettingsBtn">重置默认</button>
                    <div class="footer-actions">
                        <button class="btn btn-secondary" id="cancelSettingsBtn">取消</button>
                        <button class="btn btn-primary" id="applySettingsBtn">应用设置</button>
                    </div>
                </div>
            </div>
        `;
            }

            bindEvents() {
                // 关闭按钮
                this.modal.querySelector('#settingsCloseBtn').addEventListener('click', () => this.close());
                this.modal.querySelector('#cancelSettingsBtn').addEventListener('click', () => this.close());

                // 点击背景关闭
                this.modal.addEventListener('click', (e) => {
                    if (e.target === this.modal) {
                        this.close();
                    }
                });

                // ESC键关闭
                this.handleEscape = (e) => {
                    if (e.key === 'Escape') {
                        this.close();
                    }
                };
                document.addEventListener('keydown', this.handleEscape);

                // 预设尺寸按钮
                this.modal.querySelectorAll('.preset-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const [width, height] = e.target.dataset.size.split(',');
                        this.modal.querySelector('#canvasWidth').value = width;
                        this.modal.querySelector('#canvasHeight').value = height;
                        this.updatePresetButtonState(e.target);
                    });
                });

                // 自定义尺寸输入
                const widthInput = this.modal.querySelector('#canvasWidth');
                const heightInput = this.modal.querySelector('#canvasHeight');
                const keepRatioCheckbox = this.modal.querySelector('#keepRatio');

                let aspectRatio = 1;

                widthInput.addEventListener('input', (e) => {
                    if (keepRatioCheckbox.checked) {
                        const newHeight = Math.round(parseInt(e.target.value) / aspectRatio);
                        heightInput.value = newHeight;
                    } else {
                        aspectRatio = parseInt(widthInput.value) / parseInt(heightInput.value);
                    }
                    this.updatePresetButtonState();
                });

                heightInput.addEventListener('input', (e) => {
                    if (keepRatioCheckbox.checked) {
                        const newWidth = Math.round(parseInt(e.target.value) * aspectRatio);
                        widthInput.value = newWidth;
                    } else {
                        aspectRatio = parseInt(widthInput.value) / parseInt(heightInput.value);
                    }
                    this.updatePresetButtonState();
                });

                keepRatioCheckbox.addEventListener('change', () => {
                    if (keepRatioCheckbox.checked) {
                        aspectRatio = parseInt(widthInput.value) / parseInt(heightInput.value);
                    }
                });

                // 背景颜色
                const bgColorInput = this.modal.querySelector('#backgroundColor');
                const bgColorTextInput = this.modal.querySelector('#backgroundColorText');

                bgColorInput.addEventListener('change', (e) => {
                    bgColorTextInput.value = e.target.value;
                });

                bgColorTextInput.addEventListener('change', (e) => {
                    if (/^#[0-9A-F]{6}$/i.test(e.target.value)) {
                        bgColorInput.value = e.target.value;
                    }
                });

                // 预设颜色
                this.modal.querySelectorAll('.color-preset').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const color = e.target.dataset.color;
                        bgColorInput.value = color;
                        bgColorTextInput.value = color;
                    });
                });

                // 网格设置
                const gridSizeInput = this.modal.querySelector('#gridSize');
                const gridSizeValue = this.modal.querySelector('.grid-size-value');
                const gridColorInput = this.modal.querySelector('#gridColor');
                const gridColorTextInput = this.modal.querySelector('#gridColorText');
                const gridOpacityInput = this.modal.querySelector('#gridOpacity');
                const opacityValue = this.modal.querySelector('.opacity-value');

                gridSizeInput.addEventListener('input', (e) => {
                    gridSizeValue.textContent = e.target.value + 'px';
                });

                gridColorInput.addEventListener('change', (e) => {
                    gridColorTextInput.value = e.target.value;
                });

                gridColorTextInput.addEventListener('change', (e) => {
                    if (/^#[0-9A-F]{6}$/i.test(e.target.value)) {
                        gridColorInput.value = e.target.value;
                    }
                });

                gridOpacityInput.addEventListener('input', (e) => {
                    opacityValue.textContent = Math.round(e.target.value * 100) + '%';
                });

                // 重置按钮
                this.modal.querySelector('#resetSettingsBtn').addEventListener('click', () => {
                    this.resetToDefaults();
                });

                // 应用按钮
                this.modal.querySelector('#applySettingsBtn').addEventListener('click', () => {
                    this.applySettings();
                });
            }

            updateModalValues() {
                this.modal.querySelector('#canvasWidth').value = this.settings.canvasWidth;
                this.modal.querySelector('#canvasHeight').value = this.settings.canvasHeight;
                this.modal.querySelector('#backgroundColor').value = this.settings.backgroundColor;
                this.modal.querySelector('#backgroundColorText').value = this.settings.backgroundColor;
                this.modal.querySelector('#gridSize').value = this.settings.gridSize;
                this.modal.querySelector('.grid-size-value').textContent = this.settings.gridSize + 'px';
                this.modal.querySelector('#gridColor').value = this.settings.gridColor;
                this.modal.querySelector('#gridColorText').value = this.settings.gridColor;
                this.modal.querySelector('#gridOpacity').value = this.settings.gridOpacity;
                this.modal.querySelector('.opacity-value').textContent = Math.round(this.settings.gridOpacity * 100) + '%';

                this.updatePresetButtonState();
            }

            updatePresetButtonState(activeBtn = null) {
                const width = this.modal.querySelector('#canvasWidth').value;
                const height = this.modal.querySelector('#canvasHeight').value;
                const currentSize = `${width},${height}`;

                this.modal.querySelectorAll('.preset-btn').forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.dataset.size === currentSize) {
                        btn.classList.add('active');
                    }
                });

                if (activeBtn) {
                    activeBtn.classList.add('active');
                }
            }

            resetToDefaults() {
                this.settings = {
                    canvasWidth: 400,
                    canvasHeight: 400,
                    backgroundColor: '#FFFFFF',
                    gridSize: 20,
                    gridColor: '#d1d5db',
                    gridOpacity: 0.5
                };
                this.updateModalValues();
            }

            applySettings() {
                // 获取当前设置值
                this.settings.canvasWidth = parseInt(this.modal.querySelector('#canvasWidth').value);
                this.settings.canvasHeight = parseInt(this.modal.querySelector('#canvasHeight').value);
                this.settings.backgroundColor = this.modal.querySelector('#backgroundColor').value;
                this.settings.gridSize = parseInt(this.modal.querySelector('#gridSize').value);
                this.settings.gridColor = this.modal.querySelector('#gridColor').value;
                this.settings.gridOpacity = parseFloat(this.modal.querySelector('#gridOpacity').value);

                // 应用到画布
                this.applyCanvasSettings();

                // 保存设置
                this.saveSettings();

                // 显示成功提示
                this.svgMaker.showNotification('设置已应用', 'success');

                // 关闭模态框
                this.close();
            }

            applyCanvasSettings() {
                const canvas = this.svgMaker.canvas;

                // 更新画布尺寸
                canvas.setAttribute('width', this.settings.canvasWidth);
                canvas.setAttribute('height', this.settings.canvasHeight);
                canvas.setAttribute('viewBox', `0 0 ${this.settings.canvasWidth} ${this.settings.canvasHeight}`);

                // 更新画布背景色
                canvas.style.backgroundColor = this.settings.backgroundColor;

                // 更新网格
                this.updateGridPattern();

                // 更新画布信息显示
                document.querySelector('.canvas-size').textContent = `${this.settings.canvasWidth} × ${this.settings.canvasHeight}`;

                // 更新代码预览
                this.svgMaker.updateCodePreview();
            }

            updateGridPattern() {
                const canvas = this.svgMaker.canvas;
                const defs = canvas.querySelector('defs');
                const pattern = defs.querySelector('#grid');

                // 更新网格图案
                pattern.setAttribute('width', this.settings.gridSize);
                pattern.setAttribute('height', this.settings.gridSize);

                const gridPath = pattern.querySelector('path');
                gridPath.setAttribute('d', `M ${this.settings.gridSize} 0 L 0 0 0 ${this.settings.gridSize}`);
                gridPath.setAttribute('stroke', this.settings.gridColor);
                gridPath.setAttribute('stroke-opacity', this.settings.gridOpacity);
            }

            saveSettings() {
                localStorage.setItem('svgMakerSettings', JSON.stringify(this.settings));
            }

            loadSettings() {
                const saved = localStorage.getItem('svgMakerSettings');
                if (saved) {
                    try {
                        const parsedSettings = JSON.parse(saved);
                        this.settings = { ...this.settings, ...parsedSettings };
                    } catch (e) {
                        console.warn('无法加载保存的设置，使用默认设置');
                    }
                }
            }

            close() {
                if (this.modal && this.modal.parentNode) {
                    document.removeEventListener('keydown', this.handleEscape);
                    this.modal.remove();
                    this.modal = null;
                }
            }
        }

        // 导出类
        window.SettingsModal = SettingsModal;
    </script>
</body>

</html>
