<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球时区转换器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 700px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            text-align: center;
            color: #2d3748;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .form-control {
            flex: 1;
            min-width: 200px;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
        }

        .form-control:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        select.form-control {
            cursor: pointer;
        }

        .btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #4a5568, #2d3748);
        }

        .btn-secondary:hover {
            box-shadow: 0 10px 20px rgba(74, 85, 104, 0.3);
        }

        .btn-green {
            background: linear-gradient(135deg, #48bb78, #38a169);
        }

        .btn-green:hover {
            box-shadow: 0 10px 20px rgba(72, 187, 120, 0.3);
        }

        .current-time {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            color: #2d3748;
            margin: 20px 0;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            background: rgba(102, 126, 234, 0.1);
            padding: 15px;
            border-radius: 12px;
        }

        /* 目标时区转换结果样式 */
        .target-result {
            background: linear-gradient(135deg, #f0fff4, #e6fffa);
            border-radius: 16px;
            padding: 25px;
            border: 2px solid #38a169;
            margin-bottom: 30px;
        }

        .target-time-display {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: #2d3748;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            margin-bottom: 15px;
        }

        .target-timezone-name {
            text-align: center;
            font-size: 1.2rem;
            color: #38a169;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .target-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        /* 多时区对比样式 */
        .comparison-results {
            background: linear-gradient(135deg, #f7fafc, #edf2f7);
            border-radius: 16px;
            padding: 25px;
            border: 2px solid #e2e8f0;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #e2e8f0;
            transition: all 0.3s ease;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-item:hover {
            background: rgba(102, 126, 234, 0.05);
            border-radius: 8px;
            padding-left: 10px;
            padding-right: 10px;
        }

        .timezone-name {
            font-weight: 600;
            color: #2d3748;
            min-width: 120px;
        }

        .timezone-time {
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            font-size: 1.1rem;
            color: #4a5568;
            flex: 1;
            text-align: center;
        }

        .copy-btn {
            padding: 8px 12px;
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
            border: 1px solid #667eea;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            background: #667eea;
            color: white;
        }

        .copy-success {
            background: #48bb78 !important;
            color: white !important;
            border-color: #48bb78 !important;
        }

        .icon {
            width: 20px;
            height: 20px;
        }

        .live-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #48bb78;
            border-radius: 50%;
            animation: pulse 2s infinite;
            margin-right: 8px;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .footer-notes {
            margin-top: 40px;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .note-item {
            margin: 12px 0;
            font-size: 0.95rem;
            color: #4a5568;
            line-height: 1.6;
        }

        .footer-link {
            color: #667eea;
            text-decoration: none;
            transition: all 0.3s ease;
            border-bottom: 1px solid transparent;
        }

        .footer-link:hover {
            color: #764ba2;
            border-bottom-color: #764ba2;
        }

        .note-item strong {
            color: #2d3748;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            color: #718096;
            padding: 20px;
            font-style: italic;
        }

        .comparison-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        @media (max-width: 768px) {
            .container {
                padding: 25px;
                margin: 10px;
            }

            h1 {
                font-size: 2rem;
            }

            .input-group {
                flex-direction: column;
            }

            .form-control, .btn {
                width: 100%;
            }

            .result-item {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }

            .timezone-time {
                text-align: center;
            }

            .comparison-controls {
                flex-direction: column;
            }

            .target-actions {
                flex-direction: column;
            }

            .target-time-display {
                font-size: 1.4rem;
            }

            .footer-notes {
                margin-top: 20px;
                padding: 20px 15px;
            }

            .note-item {
                font-size: 0.9rem;
                margin: 10px 0;
            }
        }
    </style>
</head>

    <script>
        let comparisonTimezones = new Set();
        let updateInterval;
        let currentTargetTime = '';

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 自动设置用户本地时区和当前时间
            setLocalTimezone();
            setCurrentTime();
            
            updateResults();
            startLiveUpdate();
            
            // 监听输入变化
            document.getElementById('sourceTime').addEventListener('change', updateResults);
            document.getElementById('sourceTimezone').addEventListener('change', updateResults);
            document.getElementById('targetTimezone').addEventListener('change', updateResults);
        });

        // 设置当前时间
        function setCurrentTime() {
            const now = new Date();
            const offsetMinutes = now.getTimezoneOffset();
            const localTime = new Date(now.getTime() - offsetMinutes * 60000);
            document.getElementById('sourceTime').value = localTime.toISOString().slice(0, 16);
            updateResults();
        }

        // 检测并设置用户本地时区
        function setLocalTimezone() {
            try {
                const userTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
                const sourceSelect = document.getElementById('sourceTimezone');
                
                // 检查用户时区是否在选项列表中
                const options = Array.from(sourceSelect.options);
                const matchingOption = options.find(option => option.value === userTimezone);
                
                if (matchingOption) {
                    sourceSelect.value = userTimezone;
                } else {
                    // 时区映射表
                    const timezoneMapping = {
                        'Asia/Chongqing': 'Asia/Shanghai',
                        'Asia/Harbin': 'Asia/Shanghai',
                        'America/Indiana/Indianapolis': 'America/New_York',
                        'Europe/Jersey': 'Europe/London',
                        'GMT': 'Europe/London',
                        'EST': 'America/New_York',
                        'PST': 'America/Los_Angeles',
                        'CST': 'America/Chicago',
                        'MST': 'America/Denver'
                    };
                    
                    const mappedTimezone = timezoneMapping[userTimezone];
                    if (mappedTimezone && options.find(option => option.value === mappedTimezone)) {
                        sourceSelect.value = mappedTimezone;
                    }
                }
            } catch (error) {
                console.log('无法检测用户时区，使用默认设置');
            }
        }

        // 更新所有结果
        function updateResults() {
            const sourceTimeInput = document.getElementById('sourceTime').value;
            const sourceTimezone = document.getElementById('sourceTimezone').value;
            const targetTimezone = document.getElementById('targetTimezone').value;
            
            if (!sourceTimeInput) return;

            const sourceDate = new Date(sourceTimeInput);
            
            // 更新源时间显示
            updateCurrentTimeDisplay(sourceDate, sourceTimezone);
            
            // 更新目标时区转换
            updateTargetResult(sourceDate, targetTimezone);
            
            // 更新多时区对比
            updateComparison(sourceDate);
        }

        // 更新当前时间显示
        function updateCurrentTimeDisplay(sourceDate, sourceTimezone) {
            const currentTimeText = document.getElementById('currentTimeText');
            const sourceTimeStr = formatTime(sourceDate, sourceTimezone);
            currentTimeText.textContent = `${getTimezoneDisplayName(sourceTimezone)}: ${sourceTimeStr}`;
        }

        // 更新目标时区转换结果
        function updateTargetResult(sourceDate, targetTimezone) {
            const targetTimezoneName = document.getElementById('targetTimezoneName');
            const targetTimeDisplay = document.getElementById('targetTimeDisplay');
            
            targetTimezoneName.textContent = getTimezoneDisplayName(targetTimezone);
            currentTargetTime = formatTime(sourceDate, targetTimezone);
            targetTimeDisplay.textContent = currentTargetTime;
        }

        // 更新多时区对比
        function updateComparison(sourceDate) {
            const comparisonResults = document.getElementById('comparisonResults');
            
            if (comparisonTimezones.size === 0) {
                comparisonResults.innerHTML = '<div class="empty-state">点击"添加对比"按钮来添加要对比的时区</div>';
                return;
            }
            
            comparisonResults.innerHTML = '';
            
            comparisonTimezones.forEach(timezone => {
                const convertedTime = formatTime(sourceDate, timezone);
                const resultItem = createComparisonItem(timezone, convertedTime);
                comparisonResults.appendChild(resultItem);
            });
        }

        // 创建对比项
        function createComparisonItem(timezone, time) {
            const div = document.createElement('div');
            div.className = 'result-item';
            
            div.innerHTML = `
                <div class="timezone-name">${getTimezoneDisplayName(timezone)}</div>
                <div class="timezone-time">${time}</div>
                <div style="display: flex; gap: 8px;">
                    <button class="copy-btn" onclick="copyTime('${time}')" title="复制时间">
                        📋 复制
                    </button>
                    <button class="copy-btn" onclick="removeFromComparison('${timezone}')" title="移除时区" style="background: rgba(245, 101, 101, 0.1); color: #f56565; border-color: #f56565;">
                        🗑️
                    </button>
                </div>
            `;
            
            return div;
        }

        // 添加到对比列表
        function addToComparison() {
            const compareSelect = document.getElementById('compareTimezone');
            const selectedTimezone = compareSelect.value;
            
            if (!comparisonTimezones.has(selectedTimezone)) {
                comparisonTimezones.add(selectedTimezone);
                updateResults();
                
                // 添加视觉反馈
                setTimeout(() => {
                    const resultItems = document.querySelectorAll('#comparisonResults .result-item');
                    const newItem = Array.from(resultItems).find(item => 
                        item.querySelector('.timezone-name').textContent.includes(getTimezoneDisplayName(selectedTimezone))
                    );
                    if (newItem) {
                        newItem.style.background = 'rgba(72, 187, 120, 0.15)';
                        newItem.style.transform = 'scale(1.02)';
                        newItem.style.transition = 'all 0.3s ease';
                        setTimeout(() => {
                            newItem.style.background = '';
                            newItem.style.transform = '';
                        }, 1500);
                    }
                }, 100);
            }
        }

        // 从对比列表中移除
        function removeFromComparison(timezone) {
            comparisonTimezones.delete(timezone);
            updateResults();
        }

        // 清空对比列表
        function clearComparison() {
            comparisonTimezones.clear();
            updateResults();
        }

        // 复制目标时间
        async function copyTargetTime() {
            if (!currentTargetTime) return;
            
            try {
                await navigator.clipboard.writeText(currentTargetTime);
                
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✅ 已复制';
                btn.classList.add('copy-success');
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('copy-success');
                }, 2000);
            } catch (err) {
                // 降级方案
                const textArea = document.createElement('textarea');
                textArea.value = currentTargetTime;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✅ 已复制';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            }
        }

        // 复制时间到剪贴板
        async function copyTime(time) {
            try {
                await navigator.clipboard.writeText(time);
                
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✅ 已复制';
                btn.classList.add('copy-success');
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('copy-success');
                }, 2000);
            } catch (err) {
                // 降级方案
                const textArea = document.createElement('textarea');
                textArea.value = time;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✅ 已复制';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            }
        }

        // 格式化时间
        function formatTime(date, timezone) {
            try {
                const options = {
                    timeZone: timezone,
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                };
                
                const formatter = new Intl.DateTimeFormat('zh-CN', options);
                return formatter.format(date);
            } catch (error) {
                return '时区错误';
            }
        }

        // 开始实时更新
        function startLiveUpdate() {
            updateInterval = setInterval(() => {
                const sourceTimeInput = document.getElementById('sourceTime');
                const now = new Date();
                const inputTime = new Date(sourceTimeInput.value);
                
                // 如果输入的时间与当前时间差距小于2分钟，则自动更新为当前时间
                if (Math.abs(now - inputTime) < 120000) {
                    const offsetMinutes = now.getTimezoneOffset();
                    const localTime = new Date(now.getTime() - offsetMinutes * 60000);
                    sourceTimeInput.value = localTime.toISOString().slice(0, 16);
                    updateResults();
                }
            }, 30000); // 每30秒检查一次
        }

        // 页面卸载时清理定时器
        window.addEventListener('beforeunload', () => {
            if (updateInterval) {
                clearInterval(updateInterval);
            }
        });
    </script>
