                    <h3 class="guide-content">门票信息</h3>
                    <p class="guide-content">${attraction.ticket}</p>
                </div>
                <div class="guide-item">
                    <h3 class="guide-content">开放时间</h3>
                    <p class="guide-content">${attraction.opening}</p>
                </div>
            `;
            
            changeGuideBtn.style.display = 'inline-block';
        }
        
        // 事件监听
        getGuideBtn.addEventListener('click', showRandomGuide);
        changeGuideBtn.addEventListener('click', showRandomGuide);
        
        // 下载按钮点击事件
        downloadBtn.addEventListener('click', function() {
            modal.style.display = 'block';
        });
        
        // 关闭按钮点击事件
        span.addEventListener('click', function() {
            modal.style.display = 'none';
        });
        
        // 点击模态框外部关闭
        window.addEventListener('click', function(event) {
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
