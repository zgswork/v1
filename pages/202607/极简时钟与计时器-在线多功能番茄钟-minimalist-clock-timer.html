    </style>
</head>

    <script>
        class Clock {
            constructor(mode = 'digital') {
                this.mode = mode;
                this.is24Hour = true;
                this.theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                this.clockElement = document.getElementById('clock');
                this.analogClockElement = document.getElementById('analog-clock');
                this.canvas = document.getElementById('clock-canvas');
                this.ctx = this.canvas.getContext('2d');

                this.setupEventListeners();
                this.setCanvasSize();
                window.addEventListener('resize', () => this.setCanvasSize());
            }

            setCanvasSize() {
                const size = Math.min(300, window.innerWidth - 40);
                this.canvas.width = size;
                this.canvas.height = size;
            }

            setupEventListeners() {
                this.clockElement.addEventListener('click', () => this.toggle24Hour());
                document.addEventListener('dblclick', () => this.toggleTheme());
            }

            toggle24Hour() {
                this.is24Hour = !this.is24Hour;
            }

            toggleTheme() {
                const themes = ['light', 'dark', 'green'];
                const currentIndex = themes.indexOf(this.theme);
                this.theme = themes[(currentIndex + 1) % themes.length];
                document.body.setAttribute('data-theme', this.theme);
            }

            toggleMode() {
                this.mode = this.mode === 'digital' ? 'analog' : 'digital';
                if (this.mode === 'digital') {
                    this.clockElement.style.display = 'block';
                    this.analogClockElement.style.display = 'none';
                } else {
                    this.clockElement.style.display = 'none';
                    this.analogClockElement.style.display = 'block';
                }
            }

            drawAnalogClock(hours, minutes, seconds) {
                const ctx = this.ctx;
                const radius = this.canvas.width / 2;
                ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                // Draw clock face
                ctx.beginPath();
                ctx.arc(radius, radius, radius - 10, 0, 2 * Math.PI);
                ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--text-color');
                ctx.lineWidth = 2;
                ctx.stroke();

                // Draw hour markers
                for (let i = 0; i < 12; i++) {
                    const angle = (i * Math.PI) / 6 - Math.PI / 2;
                    const x1 = radius + (radius - 30) * Math.cos(angle);
                    const y1 = radius + (radius - 30) * Math.sin(angle);
                    const x2 = radius + (radius - 20) * Math.cos(angle);
                    const y2 = radius + (radius - 20) * Math.sin(angle);

                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                }

                // Draw hands
                this.drawHand(ctx, radius, (hours % 12 + minutes / 60) * 30, radius * 0.5, 6); // Hour
                this.drawHand(ctx, radius, minutes * 6, radius * 0.7, 4); // Minute
                this.drawHand(ctx, radius, seconds * 6, radius * 0.9, 2); // Second
            }

            drawHand(ctx, radius, angle, length, width) {
                const radian = (angle - 90) * Math.PI / 180;
                ctx.beginPath();
                ctx.lineWidth = width;
                ctx.moveTo(radius, radius);
                ctx.lineTo(radius + Math.cos(radian) * length,
                         radius + Math.sin(radian) * length);
                ctx.stroke();
            }

            update() {
                const now = new Date();
                const hours = now.getHours();
                const minutes = now.getMinutes();
                const seconds = now.getSeconds();

                if (this.mode === 'digital') {
                    const displayHours = this.is24Hour ? hours : hours % 12 || 12;
                    this.clockElement.textContent = 
                        `${String(displayHours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                } else {
                    this.drawAnalogClock(hours, minutes, seconds);
                }

                requestAnimationFrame(() => this.update());
            }
        }

                class Timer {
            constructor(container, id) {
                this.container = container;
                this.id = id;
                this.duration = 25 * 60; // Default to 25 minutes
                this.timeLeft = this.duration;
                this.elapsedTime = 0;
                this.isRunning = false;
                this.interval = null;
                this.mode = 'countdown'; // 'countdown' or 'stopwatch'
                this.isResting = false; // Pomodoro rest state

                this.displayElement = container.querySelector('.timer-display');
                this.progressRing = container.querySelector('.progress-ring');
                this.ctx = this.progressRing.getContext('2d');
                this.startPauseButton = container.querySelector('.start-pause');
                this.resetButton = container.querySelector('.reset');
                this.deleteButton = container.querySelector('.delete-timer');
                
                // Add mode toggle button
                this.toggleModeButton = document.createElement('button');
                this.toggleModeButton.textContent = '切换模式';
                this.toggleModeButton.className = 'timer-control';
                this.container.querySelector('.timer-controls').appendChild(this.toggleModeButton);

                this.setupEventListeners();
                this.updateDisplay();
            }

            setupEventListeners() {
                this.startPauseButton.addEventListener('click', () => this.toggleTimer());
                this.resetButton.addEventListener('click', () => this.reset());
                this.displayElement.addEventListener('click', () => this.showPresetMenu());
                this.toggleModeButton.addEventListener('click', () => this.toggleMode());
            }

            toggleTimer() {
                this.isRunning = !this.isRunning;
                this.startPauseButton.textContent = this.isRunning ? '暂停' : '开始';
                if (this.isRunning) {
                    this.run();
                } else {
                    clearInterval(this.interval);
                }
            }

            reset() {
                this.isRunning = false;
                clearInterval(this.interval);
                this.startPauseButton.textContent = '开始';
                if (this.mode === 'countdown') {
                    this.timeLeft = this.duration;
                } else {
                    this.elapsedTime = 0;
                }
                this.updateDisplay();
            }

            run() {
                this.interval = setInterval(() => {
                    if (this.mode === 'countdown') {
                        if (this.timeLeft > 0) {
                            this.timeLeft--;
                            this.updateDisplay();
                        } else {
                            this.handleTimerComplete();
                        }
                    } else { // stopwatch
                        this.elapsedTime++;
                        this.updateDisplay();
                    }
                }, 1000);
            }

            handleTimerComplete() {
                clearInterval(this.interval);
                this.isRunning = false;
                this.startPauseButton.textContent = '开始';

                //强制休息
                this.flashScreen();
                this.playNotificationSound();
                this.showSystemNotification();

                // Pomodoro logic
                if (timerManager.getTimers().length === 1) {
                    if (!this.isResting) {
                        this.isResting = true;
                        this.setDuration(5 * 60); // 5-minute rest
                        this.toggleTimer(); // Start rest timer automatically
                    } else {
                        this.isResting = false;
                        this.setDuration(25 * 60); // Back to 25-minute work
                    }
                }
            }

            updateDisplay() {
                let displayTime;
                if (this.mode === 'countdown') {
                    displayTime = this.timeLeft;
                } else {
                    displayTime = this.elapsedTime;
                }
                const minutes = Math.floor(displayTime / 60);
                const seconds = displayTime % 60;
                this.displayElement.textContent = 
                    `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                this.drawProgress();
            }

            showPresetMenu() {
                const presets = [15, 300, 1800]; // 15s, 5m, 30m
                const menu = document.createElement('div');
                menu.className = 'preset-menu';

                const defaultButton = document.createElement('button');
                defaultButton.textContent = '默认 (25m)';
                defaultButton.onclick = () => {
                    this.setDuration(1500); // 25 minutes
                    document.body.removeChild(menu);
                };
                menu.appendChild(defaultButton);

                presets.forEach(seconds => {
                    const button = document.createElement('button');
                    button.textContent = seconds >= 60 ? `${seconds / 60}m` : `${seconds}s`;
                    button.onclick = () => {
                        this.setDuration(seconds);
                        document.body.removeChild(menu);
                    };
                    menu.appendChild(button);
                });

                const rect = this.displayElement.getBoundingClientRect();
                menu.style.position = 'absolute';
                menu.style.top = `${rect.bottom}px`;
                menu.style.left = `${rect.left}px`;
                document.body.appendChild(menu);

                setTimeout(() => {
                    if (document.body.contains(menu)) {
                        document.body.removeChild(menu);
                    }
                }, 5000);
            }

            setDuration(seconds) {
                this.duration = seconds;
                this.reset();
            }

            toggleMode() {
                this.mode = this.mode === 'countdown' ? 'stopwatch' : 'countdown';
                this.reset();
            }

            flashScreen() {
                let count = 0;
                const interval = setInterval(() => {
                    document.body.style.backgroundColor = count % 2 === 0 ? 'rgba(255, 0, 0, 0.5)' : '';
                    count++;
                    if (count > 6) {
                        clearInterval(interval);
                        document.body.style.backgroundColor = ''; // Reset
                    }
                }, 500);
            }

            showSystemNotification() {
                if (!('Notification' in window)) return;
                if (Notification.permission === 'granted') {
                    new Notification('计时结束!', { body: '休息一下吧！' });
                } else if (Notification.permission !== 'denied') {
                    Notification.requestPermission().then(permission => {
                        if (permission === 'granted') {
                            new Notification('计时结束!', { body: '休息一下吧！' });
                        }
                    });
                }
            }

            playNotificationSound() {
                if (!window.audioContext) {
                    window.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (!window.soundEnabled) return;

                const oscillator = window.audioContext.createOscillator();
                const gainNode = window.audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(window.audioContext.destination);

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(440, window.audioContext.currentTime); // A4
                gainNode.gain.setValueAtTime(1, window.audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.00001, window.audioContext.currentTime + 1);
                oscillator.start(window.audioContext.currentTime);
                oscillator.stop(window.audioContext.currentTime + 1);
            }

            drawProgress() {
                const canvas = this.progressRing;
                const ctx = this.ctx;
                const size = 220; // Match new .timer-visual size
                const scale = window.devicePixelRatio || 1;
                canvas.width = size * scale;
                canvas.height = size * scale;
                canvas.style.width = `${size}px`;
                canvas.style.height = `${size}px`;
                ctx.scale(scale, scale);

                const centerX = size / 2;
                const centerY = size / 2;
                const radius = size / 2 - 15; // Adjust radius for new size and glow
                const lineWidth = 10;
                const progress = this.timeLeft / this.duration;
                const accentColor = getComputedStyle(document.body).getPropertyValue('--accent-color');

                ctx.clearRect(0, 0, size, size);

                // Background Circle
                 ctx.beginPath();
                 ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI, false);
                 ctx.lineWidth = lineWidth / 2; // Thinner background
                 ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                 ctx.stroke();

                 // Progress Arc
                 if (this.mode === 'countdown' && progress < 1) {
                     ctx.beginPath();
                     ctx.arc(centerX, centerY, radius, -Math.PI / 2, (2 * Math.PI * (1 - progress)) - Math.PI / 2, false);
                     
                     ctx.lineWidth = lineWidth;
                     ctx.lineCap = 'round';
                     ctx.strokeStyle = accentColor;
                     
                     // Glow effect
                     ctx.shadowColor = accentColor;
                     ctx.shadowBlur = 15;
                     
                     ctx.stroke();

                     // Reset shadow for other drawings
                     ctx.shadowColor = 'transparent';
                     ctx.shadowBlur = 0;
                 }
            }

            destroy() {
                clearInterval(this.interval);
                this.container.remove();
            }
        }

        class TimerManager {
            constructor() {
                this.timers = new Map();
                this.nextId = 2;
                this.timersWrapper = document.querySelector('.timers-wrapper');
                this.addTimerButton = document.getElementById('add-timer-btn');
                this.statsChart = document.getElementById('stats-chart');

                this.init();
                this.renderStatsChart();
            }

            init() {
                const initialTimerContainer = document.querySelector('.timer-container');
                const initialTimer = new Timer(initialTimerContainer, 1);
                this.timers.set(1, initialTimer);

                this.addTimerButton.addEventListener('click', () => this.addTimer());
                this.timersWrapper.addEventListener('click', (e) => {
                    if (e.target.classList.contains('delete-timer')) {
                        const timerContainer = e.target.closest('.timer-container');
                        const id = parseInt(timerContainer.dataset.id, 10);
                        this.deleteTimer(id);
                    }
                });
            }

            addTimer() {
                if (this.timers.size >= 5) {
                    alert('最多只能创建5个计时器。');
                    return;
                }

                const newTimerContainer = document.createElement('div');
                newTimerContainer.className = 'timer-container';
                newTimerContainer.dataset.id = this.nextId;
                newTimerContainer.innerHTML = `
                    <input type="text" class="timer-label" value="计时器 ${this.nextId}">
                    <div class="timer-visual">
                        <canvas class="progress-ring"></canvas>
                        <div class="timer-display">25:00</div>
                    </div>
                    <div class="timer-controls">
                        <button class="start-pause">开始</button>
                        <button class="reset">重置</button>
                        <button class="delete-timer">删除</button>
                    </div>
                `;

                this.timersWrapper.appendChild(newTimerContainer);
                const newTimer = new Timer(newTimerContainer, this.nextId);
                this.timers.set(this.nextId, newTimer);
                this.nextId++;
            }

            deleteTimer(id) {
                if (this.timers.has(id)) {
                    this.timers.get(id).destroy();
                    this.timers.delete(id);
                    if (this.timers.size === 0) {
                        this.nextId = 1;
                    }
                }
            }

            getWeekData() {
                const data = JSON.parse(localStorage.getItem('pomodoroStats')) || {};
                const today = new Date();
                const weekData = [0, 0, 0, 0, 0, 0, 0]; // Sun - Sat
                for (let i = 0; i < 7; i++) {
                    const date = new Date(today);
                    date.setDate(today.getDate() - i);
                    const dayOfWeek = date.getDay();
                    const dateString = date.toISOString().split('T')[0];
                    if (data[dateString]) {
                        weekData[dayOfWeek] = data[dateString];
                    }
                }
                return weekData;
            }

            recordPomodoro() {
                const today = new Date().toISOString().split('T')[0];
                const data = JSON.parse(localStorage.getItem('pomodoroStats')) || {};
                data[today] = (data[today] || 0) + 1;
                localStorage.setItem('pomodoroStats', JSON.stringify(data));
                this.renderStatsChart();
            }

            renderStatsChart() {
                const weekData = this.getWeekData();
                const maxCount = Math.max(...weekData, 1); // Avoid division by zero
                const days = ['日', '一', '二', '三', '四', '五', '六'];

                const chartSVG = `
                    <svg width="100%" height="150" viewBox="0 0 280 150">
                        ${weekData.map((count, i) => {
                            const barHeight = (count / maxCount) * 100;
                            return `
                                <rect x="${i * 40}" y="${120 - barHeight}" width="30" height="${barHeight}" fill="var(--accent-color)"></rect>
                                <text x="${i * 40 + 15}" y="135" text-anchor="middle" font-size="12" fill="var(--text-color)">${days[i]}</text>
                                <text x="${i * 40 + 15}" y="${115 - barHeight}" text-anchor="middle" font-size="10" fill="var(--text-color)">${count}</text>
                            `;
                        }).join('')}
                    </svg>
                `;
                this.statsChart.innerHTML = chartSVG;
            }

        // 移动端双指缩放
        let initialPinchDistance = 0;
        document.body.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                initialPinchDistance = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
            }
        });

        document.body.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {

                const currentPinchDistance = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
                const pinchRatio = currentPinchDistance / initialPinchDistance;
                currentFontSize = Math.max(2, Math.min(30, 12 * pinchRatio));
                clockElement.style.fontSize = `${currentFontSize}vw`;

        function changeLanguage() {
            const lang = document.getElementById('language-select').value;
            localStorage.setItem('language', lang);
            const t = translations[lang] || translations['en'];

            const safeUpdate = (selector, property, value) => {
                const element = document.querySelector(selector);
                if (element) element[property] = value;
            };

            const safeUpdateAll = (selector, callback) => {
                document.querySelectorAll(selector).forEach(callback);
            };

            safeUpdate('.fa-cog', 'title', t['settings']);
            safeUpdate('label[for="theme-selector"]', 'textContent', t['theme']);
            safeUpdate('label[for="font-select"]', 'textContent', t['font']);
            safeUpdate('label[for="opacity-slider"]', 'textContent', t['opacity']);
            safeUpdate('#mode-toggle-btn', 'textContent', t['toggle-mode']);
            safeUpdate('label[for="always-on-top"]', 'textContent', t['always-on-top']);
            safeUpdate('label[for="always-on-top"] ~ small', 'textContent', t['always-on-top-note']);
            safeUpdate('.stats-container label', 'textContent', t['pomodoro-stats']);
            safeUpdate('.footer a:first-child', 'textContent', t['contact']);

            // Translate theme options
            safeUpdateAll('#theme-select option', el => {
                const key = 'theme-' + el.value;
                if (t[key]) el.textContent = t[key];
            });

            // Translate font options
            safeUpdateAll('#font-select option', el => {
                const key = 'font-' + el.value;
                if (t[key]) el.textContent = t[key];
            });

            safeUpdateAll('.timer-label', (el, i) => el.value = `${t['timer-label']} ${i + 1}`);
            safeUpdateAll('.start-pause', el => el.textContent = el.classList.contains('running') ? t['pause'] : t['start']);
            safeUpdateAll('.reset', el => el.textContent = t['reset']);
            safeUpdateAll('.delete-timer', el => el.textContent = t['delete']);
            safeUpdateAll('.toggle-mode-btn', el => el.textContent = t['toggle-timer-mode']);

            // Translate instructions
            safeUpdate('summary[data-i18n="instructions"]', 'textContent', t['instructions']);
            safeUpdate('h4[data-i18n="instructions_clock_title"]', 'textContent', t['instructions_clock_title']);
            safeUpdate('p[data-i18n="instructions_clock_desc"]', 'textContent', t['instructions_clock_desc']);
            safeUpdate('h4[data-i18n="instructions_timer_title"]', 'textContent', t['instructions_timer_title']);
            safeUpdate('p[data-i18n="instructions_timer_desc"]', 'textContent', t['instructions_timer_desc']);
            safeUpdate('h4[data-i18n="instructions_settings_title"]', 'textContent', t['instructions_settings_title']);
            safeUpdate('p[data-i18n="instructions_settings_desc"]', 'textContent', t['instructions_settings_desc']);
            
            const soundBtn = document.getElementById('sound-toggle');
            if(soundBtn) soundBtn.textContent = window.soundEnabled ? t['sound-on'] : t['sound-off'];
        }

        document.getElementById('language-select').addEventListener('change', changeLanguage);

        // Initial language setup on page load
        document.addEventListener('DOMContentLoaded', () => {
            const languageSelector = document.getElementById('language-select');
            const savedLanguage = localStorage.getItem('language');

            let langToSet = 'en'; // Default language

            if (savedLanguage && translations[savedLanguage]) {
                langToSet = savedLanguage;
            } else {
                const browserLang = navigator.language;
                if (translations[browserLang]) {
                    langToSet = browserLang;
                } else {
                    const shortLang = browserLang.slice(0, 2);
                    if (translations[shortLang]) {
                        langToSet = shortLang;
                    }
                }
            }
            languageSelector.value = langToSet;
            changeLanguage();
        });

        // 监听全屏状态变化
        document.addEventListener('fullscreenchange', () => {
            const footer = document.querySelector('.footer');
            const settingsBtn = document.querySelector('.mode-switch');
            
            if (document.fullscreenElement) {
                // 进入全屏时隐藏元素
                if (footer) footer.style.display = 'none';
                if (settingsBtn) settingsBtn.style.display = 'none';
            } else {
                // 退出全屏时显示元素
                if (footer) footer.style.display = '';
                if (settingsBtn) settingsBtn.style.display = '';
            }
        });

    </script>
