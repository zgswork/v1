<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小学一年级随机口算系统</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background-image: url('https://img.freepik.com/free-vector/cute-colorful-numbers-pattern-background_42349-764.jpg');
            background-size: cover;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            padding: 30px;
            margin-bottom: 20px;
            border: 3px solid #FF9E9E;
        }
        
        h1 {
            color: #FF6B6B;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            font-size: 28px;
        }
        
        .question-display {
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: #5F6CAF;
            text-align: center;
            margin: 30px 0;
            padding: 20px;
            border: 3px dashed #FFB6C1;
            border-radius: 15px;
            background-color: rgba(255, 255, 255, 0.7);
        }
        
        .answer-input {
            width: 100%;
            padding: 15px;
            font-size: 24px;
            text-align: center;
            border: 2px solid #A5D6A7;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }
        
        .buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        button {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        #startBtn {
            background-color: #81C784;
            color: white;
        }
        
        #pauseBtn {
            background-color: #FFB74D;
            color: white;
            display: none;
        }
        
        #submitBtn {
            background-color: #64B5F6;
            color: white;
            display: none;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 80%;
            text-align: center;
            position: relative;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            border: 3px solid #FFD166;
        }
        
        .modal-title {
            font-size: 24px;
            color: #5F6CAF;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        .correct-answer {
            font-size: 20px;
            color: #EF476F;
            margin-top: 15px;
            display: none;
        }
        
        .continue-btn {
            padding: 10px 20px;
            background-color: #06D6A0;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 18px;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .footer {
            text-align: center;
            color: #5F6CAF;
            font-size: 14px;
            margin-top: auto;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 10px;
            width: 100%;
            max-width: 600px;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .question-display {
                font-size: 28px;
                height: 80px;
                padding: 15px;
            }
            
            .answer-input {
                font-size: 20px;
                padding: 12px;
            }
            
            button {
                padding: 10px 20px;
                font-size: 16px;
            }
            
            .modal-content {
                padding: 20px;
            }
            
            .modal-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>小学一年级随机口算系统</h1>
        
        <div class="question-display" id="questionDisplay">点击开始按钮出题</div>
        
        <input type="number" class="answer-input" id="answerInput" placeholder="请输入答案">
        
        <div class="buttons">
            <button id="startBtn">开始出题</button>
            <button id="pauseBtn">暂停</button>
            <button id="submitBtn">提交答案</button>
        </div>
    </div>
    
    <div class="footer">
        由 小山 用deepseek 1分钟生成，联系我：miaomiaoxueba01
    </div>
    
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <div class="modal-title" id="resultTitle"></div>
            <div class="correct-answer" id="correctAnswer"></div>
            <button class="continue-btn" id="continueBtn">继续</button>
        </div>
    </div>
    
    <script>
        // 口算题目生成函数
        function generateQuestion() {
            const operators = ['+', '-'];
            const operator = operators[Math.floor(Math.random() * operators.length)];
            
            let num1, num2, answer;
            
            // 根据运算符生成不同难度的题目
            if (operator === '+') {
                // 加法：和不超过20
                num1 = Math.floor(Math.random() * 10) + 1;
                num2 = Math.floor(Math.random() * (20 - num1)) + 1;
                answer = num1 + num2;
            } else {
                // 减法：被减数不超过20，结果不为负数
                num1 = Math.floor(Math.random() * 10) + 1;
                num2 = Math.floor(Math.random() * num1) + 1;
                answer = num1 - num2;
            }
            
            return {
                question: `${num1} ${operator} ${num2} = ?`,
                answer: answer
            };
        }
        
        // 获取DOM元素
        const questionDisplay = document.getElementById('questionDisplay');
        const answerInput = document.getElementById('answerInput');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const submitBtn = document.getElementById('submitBtn');
        const resultModal = document.getElementById('resultModal');
        const resultTitle = document.getElementById('resultTitle');
        const correctAnswer = document.getElementById('correctAnswer');
        const continueBtn = document.getElementById('continueBtn');
        
        let intervalId = null;
        let currentQuestion = null;
        let isRolling = false;
        
        // 开始出题
        startBtn.addEventListener('click', function() {
            if (isRolling) return;
            
            isRolling = true;
            startBtn.style.display = 'none';
            pauseBtn.style.display = 'block';
            answerInput.style.display = 'none';
            submitBtn.style.display = 'none';
            answerInput.value = '';
            
            // 快速切换题目，产生滚动效果
            intervalId = setInterval(function() {
                currentQuestion = generateQuestion();
                questionDisplay.textContent = currentQuestion.question;
            }, 100);
        });
        
        // 暂停出题
        pauseBtn.addEventListener('click', function() {
            if (!isRolling) return;
            
            clearInterval(intervalId);
            isRolling = false;
            pauseBtn.style.display = 'none';
            answerInput.style.display = 'block';
            submitBtn.style.display = 'block';
            
            // 聚焦到输入框
            answerInput.focus();
        });
        
        // 提交答案
        submitBtn.addEventListener('click', function() {
            if (!currentQuestion) return;
            
            const userAnswer = parseInt(answerInput.value);
            
            if (userAnswer === currentQuestion.answer) {
                resultTitle.textContent = "恭喜你，答对了！";
                correctAnswer.style.display = 'none';
            } else {
                resultTitle.textContent = "宝贝，再想想呢";
                correctAnswer.textContent = `正确答案: ${currentQuestion.answer}`;
                correctAnswer.style.display = 'block';
            }
            
            resultModal.style.display = 'flex';
        });
        
        // 继续出题
        continueBtn.addEventListener('click', function() {
            resultModal.style.display = 'none';
            startBtn.click(); // 自动点击开始按钮
        });
        
        // 按回车键提交答案
        answerInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                submitBtn.click();
            }
        });
        
        // 点击弹窗外部关闭
        resultModal.addEventListener('click', function(e) {
            if (e.target === resultModal) {
                resultModal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
