<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>薄荷曼波色卡 | Mint Mambo</title>
    <style>
        :root {
            --primary-text: #333;
            --secondary-text: #666;
            --bg-color: #f9f7f0;
            --card-bg: #fff;
            --border-color: #e0d6c2;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --pencil-line: #b3a58a;
            --highlight: #4a90e2;
        }

        [data-theme="dark"] {
            --primary-text: #f0f0f0;
            --secondary-text: #b0b0b0;
            --bg-color: #2a2a2a;
            --card-bg: #1e1e1e;
            --border-color: #444;
            --shadow-color: rgba(0, 0, 0, 0.3);
            --pencil-line: #666;
            --highlight: #5da2ff;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-text);
            margin: 0;
            padding: 0;
            background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M0 0h100v100H0z" fill="none"/><path d="M20 20l60 60M80 20L20 80" stroke="%23e0d6c2" stroke-width="0.5" opacity="0.3"/></svg>');
            background-size: 40px 40px;
            transition: background-color 0.3s, color 0.3s;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2rem;
            margin: 0;
            position: relative;
        }

        h1::after {
            content: "";
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--highlight);
            transform: scaleX(0);
            transition: transform 0.3s;
        }

        h1:hover::after {
            transform: scaleX(1);
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            background-color: var(--highlight);
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px var(--shadow-color);
        }

        .theme-toggle {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--primary-text);
        }

        .language-toggle {
            background: none;
            border: none;
            font-size: 0.9rem;
            cursor: pointer;
            color: var(--primary-text);
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .color-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 12px var(--shadow-color);
            transition: all 0.3s;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .color-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 1px solid var(--pencil-line);
            border-radius: 8px;
            pointer-events: none;
            opacity: 0.7;
        }

        .color-swatch {
            height: 120px;
            position: relative;
        }

        .color-swatch::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.1) 100%);
        }

        .color-info {
            padding: 15px;
        }

        .color-name {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .color-values {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .color-value {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .value-label {
            font-size: 0.9rem;
            color: var(--secondary-text);
        }

        .value-code {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            background-color: rgba(0, 0, 0, 0.05);
            padding: 3px 6px;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .value-code:hover {
            background-color: rgba(0, 0, 0, 0.1);
        }

        .copy-tooltip {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--primary-text);
            color: var(--card-bg);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            opacity: 0;
            transition: opacity 0.2s;
            white-space: nowrap;
        }

        .value-code:hover .copy-tooltip {
            opacity: 1;
        }

        .copy-success {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--highlight);
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            box-shadow: 0 4px 12px var(--shadow-color);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 1000;
        }

        .copy-success.show {
            opacity: 1;
        }

        .watermark {
            position: fixed;
            opacity: 0.05;
            z-index: -1;
            font-size: 20vw;
            font-weight: bold;
            color: var(--highlight);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            user-select: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            position: relative;
            border: 1px solid var(--border-color);
        }

        .modal-content::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 1px solid var(--pencil-line);
            border-radius: 8px;
            pointer-events: none;
            opacity: 0.7;
        }

        .modal-title {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .modal-text {
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .modal-link {
            display: block;
            background-color: rgba(0, 0, 0, 0.05);
            padding: 10px;
            border-radius: 4px;
            word-break: break-all;
            margin-bottom: 20px;
            color: var(--highlight);
            text-decoration: none;
            border: 1px dashed var(--border-color);
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--secondary-text);
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px 0;
            border-top: 1px solid var(--border-color);
            font-size: 0.9rem;
            color: var(--secondary-text);
        }

        footer p {
            margin: 5px 0;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .controls {
                width: 100%;
                justify-content: space-between;
            }

            .color-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
        }

        @media (max-width: 480px) {
            .color-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="title">薄荷曼波色卡 | Mint Mambo</h1>
            <div class="controls">
                <button class="language-toggle" id="languageToggle">EN/中</button>
                <button class="theme-toggle" id="themeToggle">🌓</button>
                <button class="btn" id="downloadBtn">下载工具</button>
            </div>
        </header>

        <div class="color-grid" id="colorGrid"></div>

        <footer>
            <p>本工具由叁贰壹制作</p>
            <p>微信 coolman88886666</p>
            <p>QQ邮箱 <a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="48707c7b7a7a7e71787c083939662b2725">[email&#160;protected]</a></p>
            <p>gmail <a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="e695ded2d5d4d4d0dfd6d2a6818b878f8ac885898b">[email&#160;protected]</a></p>
        </footer>
    </div>

    <div class="watermark">Mint Mambo</div>

    <div class="copy-success" id="copySuccess">已复制到剪贴板</div>

    <div class="modal" id="downloadModal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <h2 class="modal-title">下载工具</h2>
            <p class="modal-text">复制以下夸克网盘链接在浏览器打开可以转存下载工具</p>
            <a href="https://pan.quark.cn/s/df3c2e10d49c" class="modal-link" target="_blank">https://pan.quark.cn/s/df3c2e10d49c</a>
            <button class="btn" id="copyLinkBtn">复制链接</button>
        </div>
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 颜色数据
        const colors = [
            { name: { zh: "薄荷绿", en: "Mint Green" }, hex: "#3FE0D0", rgb: "63, 224, 208", hsl: "174°, 73%, 56%" },
            { name: { zh: "柠檬黄", en: "Lemon Yellow" }, hex: "#FFF44F", rgb: "255, 244, 79", hsl: "56°, 100%, 65%" },
            { name: { zh: "天蓝色", en: "Sky Blue" }, hex: "#87CEEB", rgb: "135, 206, 235", hsl: "197°, 71%, 73%" },
            { name: { zh: "珊瑚粉", en: "Coral Pink" }, hex: "#FF7F50", rgb: "255, 127, 80", hsl: "16°, 100%, 66%" },
            { name: { zh: "薰衣草紫", en: "Lavender Purple" }, hex: "#967BB6", rgb: "150, 123, 182", hsl: "267°, 30%, 60%" },
            { name: { zh: "芒果橙", en: "Mango Orange" }, hex: "#FF8243", rgb: "255, 130, 67", hsl: "21°, 100%, 63%" },
            { name: { zh: "湖水蓝", en: "Lake Blue" }, hex: "#5DBCD2", rgb: "93, 188, 210", hsl: "191°, 57%, 59%" },
            { name: { zh: "樱花粉", en: "Cherry Blossom Pink" }, hex: "#FFB7C5", rgb: "255, 183, 197", hsl: "348°, 100%, 86%" },
            { name: { zh: "青柠绿", en: "Lime Green" }, hex: "#32CD32", rgb: "50, 205, 50", hsl: "120°, 61%, 50%" },
            { name: { zh: "矢车菊蓝", en: "Cornflower Blue" }, hex: "#6495ED", rgb: "100, 149, 237", hsl: "219°, 79%, 66%" },
            { name: { zh: "蜜桃橙", en: "Peach Orange" }, hex: "#FFCC99", rgb: "255, 204, 153", hsl: "30°, 100%, 80%" },
            { name: { zh: "紫藤色", en: "Wisteria Purple" }, hex: "#C9A0DC", rgb: "201, 160, 220", hsl: "281°, 47%, 75%" },
            { name: { zh: "海沫绿", en: "Sea Foam Green" }, hex: "#9FE2BF", rgb: "159, 226, 191", hsl: "147°, 54%, 75%" },
            { name: { zh: "日光黄", en: "Sunshine Yellow" }, hex: "#FFD700", rgb: "255, 215, 0", hsl: "51°, 100%, 50%" },
            { name: { zh: "冰蓝色", en: "Ice Blue" }, hex: "#B0E0E6", rgb: "176, 224, 230", hsl: "187°, 52%, 80%" },
            { name: { zh: "玫瑰粉", en: "Rose Pink" }, hex: "#FF66B2", rgb: "255, 102, 178", hsl: "330°, 100%, 70%" }
        ];

        // 初始化语言
        let currentLanguage = 'zh';

        // DOM元素
        const colorGrid = document.getElementById('colorGrid');
        const languageToggle = document.getElementById('languageToggle');
        const themeToggle = document.getElementById('themeToggle');
        const downloadBtn = document.getElementById('downloadBtn');
        const downloadModal = document.getElementById('downloadModal');
        const modalClose = document.getElementById('modalClose');
        const copyLinkBtn = document.getElementById('copyLinkBtn');
        const copySuccess = document.getElementById('copySuccess');
        const titleElement = document.querySelector('.title');

        // 生成颜色卡片
        function generateColorCards() {
            colorGrid.innerHTML = '';
            
            colors.forEach(color => {
                const card = document.createElement('div');
                card.className = 'color-card';
                
                card.innerHTML = `
                    <div class="color-swatch" style="background-color: ${color.hex};"></div>
                    <div class="color-info">
                        <div class="color-name">${color.name[currentLanguage]}</div>
                        <div class="color-values">
                            <div class="color-value">
                                <span class="value-label">HEX</span>
                                <span class="value-code" data-value="${color.hex}">
                                    ${color.hex}
                                    <span class="copy-tooltip">${currentLanguage === 'zh' ? '点击复制' : 'Click to copy'}</span>
                                </span>
                            </div>
                            <div class="color-value">
                                <span class="value-label">RGB</span>
                                <span class="value-code" data-value="rgb(${color.rgb})">
                                    rgb(${color.rgb})
                                    <span class="copy-tooltip">${currentLanguage === 'zh' ? '点击复制' : 'Click to copy'}</span>
                                </span>
                            </div>
                            <div class="color-value">
                                <span class="value-label">HSL</span>
                                <span class="value-code" data-value="hsl(${color.hsl})">
                                    hsl(${color.hsl})
                                    <span class="copy-tooltip">${currentLanguage === 'zh' ? '点击复制' : 'Click to copy'}</span>
                                </span>
                            </div>
                        </div>
                    </div>
                `;
                
                colorGrid.appendChild(card);
            });
            
            // 添加复制事件监听
            addCopyListeners();
        }

        // 添加复制事件监听
        function addCopyListeners() {
            const valueCodes = document.querySelectorAll('.value-code');
            
            valueCodes.forEach(code => {
                code.addEventListener('click', () => {
                    const value = code.getAttribute('data-value');
                    copyToClipboard(value);
                });
            });
        }

        // 复制到剪贴板
        function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                showCopySuccess();
            } catch (err) {
                console.error('复制失败:', err);
            }
            
            document.body.removeChild(textarea);
        }

        // 显示复制成功提示
        function showCopySuccess() {
            copySuccess.textContent = currentLanguage === 'zh' ? '已复制到剪贴板' : 'Copied to clipboard';
            copySuccess.classList.add('show');
            
            setTimeout(() => {
                copySuccess.classList.remove('show');
            }, 2000);
        }

        // 更新语言
        function updateLanguage() {
            titleElement.textContent = currentLanguage === 'zh' 
                ? '薄荷曼波色卡 | Mint Mambo' 
                : 'Mint Mambo | 薄荷曼波色卡';
            
            document.getElementById('downloadBtn').textContent = currentLanguage === 'zh' ? '下载工具' : 'Download';
            document.getElementById('copyLinkBtn').textContent = currentLanguage === 'zh' ? '复制链接' : 'Copy Link';
            
            if (document.querySelector('.modal-title')) {
                document.querySelector('.modal-title').textContent = currentLanguage === 'zh' ? '下载工具' : 'Download';
                document.querySelector('.modal-text').textContent = currentLanguage === 'zh' 
                    ? '复制以下夸克网盘链接在浏览器打开可以转存下载工具' 
                    : 'Copy the following Quark Cloud Drive link and open it in your browser to download the tool';
            }
            
            // 更新页脚
            const footerTexts = document.querySelectorAll('footer p');
            if (currentLanguage === 'zh') {
                footerTexts[0].textContent = '本工具由叁贰壹制作';
                footerTexts[1].textContent = '微信 coolman88886666';
                footerTexts[2].textContent = 'QQ邮箱 843226904@qq.com';
                footerTexts[3].textContent = 'gmail s843226904@gmail.com';
            } else {
                footerTexts[0].textContent = 'Tool created by 321';
                footerTexts[1].textContent = 'WeChat coolman88886666';
                footerTexts[2].textContent = 'QQ Email 843226904@qq.com';
                footerTexts[3].textContent = 'Gmail s843226904@gmail.com';
            }
            
            // 重新生成颜色卡片以更新语言
            generateColorCards();
        }

        // 主题切换
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                themeToggle.textContent = '🌓';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeToggle.textContent = '🌞';
            }
            
            // 更新背景纹理颜色
            document.body.style.backgroundImage = document.body.style.backgroundImage.replace(
                /stroke="%23([0-9a-f]{3})"/i, 
                `stroke="%23${currentTheme === 'dark' ? 'e0d6c2' : '333'}"`
            );
        }

        // 事件监听
        languageToggle.addEventListener('click', () => {
            currentLanguage = currentLanguage === 'zh' ? 'en' : 'zh';
            updateLanguage();
        });

        themeToggle.addEventListener('click', toggleTheme);

        downloadBtn.addEventListener('click', () => {
            downloadModal.style.display = 'flex';
        });

        modalClose.addEventListener('click', () => {
            downloadModal.style.display = 'none';
        });

        copyLinkBtn.addEventListener('click', () => {
            copyToClipboard('https://pan.quark.cn/s/df3c2e10d49c');
        });

        downloadModal.addEventListener('click', (e) => {
            if (e.target === downloadModal) {
                downloadModal.style.display = 'none';
            }
        });

        // 监听系统主题变化
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
        prefersDark.addEventListener('change', e => {
            if (e.matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeToggle.textContent = '🌞';
            } else {
                document.documentElement.removeAttribute('data-theme');
                themeToggle.textContent = '🌓';
            }
        });

        // 检查系统初始主题
        if (prefersDark.matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeToggle.textContent = '🌞';
        }

        // 初始化
        generateColorCards();
    </script>
</body>
</html>
