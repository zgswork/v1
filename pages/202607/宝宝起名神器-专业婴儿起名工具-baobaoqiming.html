<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宝宝起名神器 - 专业婴儿起名工具</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        :root {
            --primary: #6a5acd;
            --primary-light: #9388db;
            --secondary: #ff6b6b;
            --light: #f8f9fa;
            --dark: #343a40;
            --success: #20bf6b;
            --warning: #fa8231;
            --background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        body {
            background: var(--background);
            color: var(--dark);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 40px 20px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(106, 90, 205, 0.2);
        }
        
        header::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }
        
        h1 {
            font-size: 3.2rem;
            color: var(--primary);
            margin-bottom: 15px;
            font-weight: 800;
            font-family: 'Ma Shan Zheng', cursive;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .subtitle {
            font-size: 1.3rem;
            color: var(--dark);
            max-width: 800px;
            margin: 0 auto 25px;
            font-family: 'ZCOOL XiaoWei', serif;
        }
        
        .main-content {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            margin-bottom: 40px;
        }
        
        .form-section {
            flex: 1;
            min-width: 320px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            position: sticky;
            top: 20px;
            height: fit-content;
            border: 1px solid rgba(106, 90, 205, 0.1);
        }
        
        .results-section {
            flex: 2.5;
            min-width: 320px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(106, 90, 205, 0.1);
        }
        
        .section-title {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 25px;
            padding-bottom: 12px;
            border-bottom: 3px solid var(--primary-light);
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
        }
        
        .section-title i {
            background: var(--primary);
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--dark);
            font-size: 1.1rem;
        }
        
        input, select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e1e5eb;
            border-radius: 10px;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            background: #f9fafc;
        }
        
        input:focus, select:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 4px rgba(106, 90, 205, 0.2);
            background: white;
        }
        
        .radio-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .radio-option {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 8px 15px;
            border-radius: 8px;
            background: #f0f2f5;
            transition: all 0.2s ease;
        }
        
        .radio-option:hover {
            background: #e4e6f0;
        }
        
        .radio-option input {
            width: auto;
        }
        
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px 30px;
            font-size: 1.15rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            box-shadow: 0 4px 10px rgba(106, 90, 205, 0.3);
        }
        
        .btn:hover {
            background: #5a4acd;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(106, 90, 205, 0.4);
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        .btn-reset {
            background: var(--dark);
            margin-top: 15px;
        }
        
        .btn-reset:hover {
            background: #2c3034;
            box-shadow: 0 8px 20px rgba(52, 58, 64, 0.4);
        }
        
        .btn-more {
            background: var(--warning);
            max-width: 300px;
            margin: 30px auto 0;
        }
        
        .btn-more:hover {
            background: #e9721c;
            box-shadow: 0 8px 20px rgba(250, 130, 49, 0.4);
        }
        
        .results-container {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            margin-top: 20px;
            overflow-y: auto;
            max-height: 650px;
            padding: 15px;
        }
        
        .name-card {
            background: linear-gradient(135deg, rgba(106, 90, 205, 0.08) 0%, rgba(255, 255, 255, 0.5) 100%);
            border-radius: 15px;
            padding: 25px 20px;
            text-align: center;
            transition: all 0.4s ease;
            cursor: pointer;
            border: 2px solid rgba(106, 90, 205, 0.15);
            position: relative;
            overflow: hidden;
        }
        
        .name-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.12);
            border-color: rgba(106, 90, 205, 0.3);
        }
        
        .name-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--primary);
            opacity: 0.4;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s ease;
        }
        
        .name-card:hover::before {
            transform: scaleX(1);
        }
        
        .name {
            font-size: 2.4rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 8px;
            font-family: 'Ma Shan Zheng', cursive;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }
        
        .pinyin {
            font-size: 1.1rem;
            color: var(--dark);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        
        .meaning {
            font-size: 1rem;
            color: #555;
            margin-bottom: 15px;
            line-height: 1.5;
            min-height: 50px;
            font-family: 'ZCOOL XiaoWei', serif;
        }
        
        .element {
            font-size: 0.95rem;
            background: rgba(106, 90, 205, 0.1);
            display: inline-block;
            padding: 6px 15px;
            border-radius: 20px;
            color: var(--primary);
            font-weight: 600;
        }
        
        .favorites {
            margin-top: 35px;
            padding-top: 25px;
            border-top: 2px dashed #e1e5eb;
        }
        
        .favorites-list {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
            min-height: 60px;
        }
        
        .favorite-item {
            background: rgba(32, 191, 107, 0.15);
            border-radius: 50px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 1.1rem;
            border: 1px solid rgba(32, 191, 107, 0.3);
        }
        
        .favorite-item i {
            color: var(--success);
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .favorite-item i:hover {
            transform: scale(1.2);
        }
        
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #777;
            grid-column: 1 / -1;
        }
        
        .empty-state i {
            font-size: 5rem;
            color: #dde1e8;
            margin-bottom: 25px;
            opacity: 0.6;
        }
        
        .empty-state h3 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #666;
        }
        
        .empty-state p {
            font-size: 1.1rem;
            max-width: 500px;
            margin: 0 auto;
        }
        
        footer {
            text-align: center;
            padding: 30px 20px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--shadow);
            color: #666;
            font-size: 1rem;
            line-height: 1.8;
            border: 1px solid rgba(106, 90, 205, 0.1);
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin: 40px 0;
        }
        
        .feature-card {
            background: var(--card-bg);
            padding: 30px 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: var(--shadow);
            transition: all 0.4s ease;
            border: 1px solid rgba(106, 90, 205, 0.1);
        }
        
        .feature-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }
        
        .feature-card i {
            font-size: 2.8rem;
            color: var(--primary);
            margin-bottom: 20px;
            background: rgba(106, 90, 205, 0.1);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            transition: all 0.3s ease;
        }
        
        .feature-card:hover i {
            transform: scale(1.1);
            background: var(--primary);
            color: white;
        }
        
        .feature-card h3 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: var(--dark);
        }
        
        .feature-card p {
            font-size: 1.05rem;
            color: #555;
        }
        
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .result-count {
            font-size: 1.1rem;
            color: var(--primary);
            font-weight: 600;
        }
        
        /* 响应式设计 */
        @media (max-width: 1200px) {
            .main-content {
                gap: 25px;
            }
            
            .results-container {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
        }
        
        @media (max-width: 992px) {
            h1 {
                font-size: 2.8rem;
            }
            
            .section-title {
                font-size: 1.7rem;
            }
            
            .name {
                font-size: 2.2rem;
            }
        }
        
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .form-section {
                position: static;
            }
            
            h1 {
                font-size: 2.5rem;
            }
            
            .subtitle {
                font-size: 1.15rem;
            }
            
            .section-title {
                font-size: 1.6rem;
            }
            
            .results-container {
                grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
                max-height: none;
            }
        }
        
        @media (max-width: 576px) {
            body {
                padding: 15px;
            }
            
            header {
                padding: 30px 15px;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .form-section, .results-section {
                padding: 25px 20px;
            }
            
            .results-container {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 15px;
            }
            
            .name {
                font-size: 2rem;
            }
            
            .feature-card {
                padding: 25px 20px;
            }
        }
        
        /* 动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .name-card {
            animation: fadeIn 0.5s ease forwards;
            opacity: 0;
        }
        
        /* 装饰元素 */
        .decoration {
            position: absolute;
            z-index: -1;
            opacity: 0.1;
        }
        
        .decoration-1 {
            top: 5%;
            left: 5%;
            font-size: 10rem;
            color: var(--primary);
        }
        
        .decoration-2 {
            bottom: 10%;
            right: 5%;
            font-size: 8rem;
            color: var(--secondary);
            transform: rotate(30deg);
        }
    </style>
</head>

    <div class="container">

        <div class="main-content">
            <div class="form-section">

                <div class="form-group">

                <div class="form-group">
                    <label><i class="fas fa-hashtag"></i> 名字字数</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="length" value="1"> 单字名
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="length" value="2" checked> 双字名

                    </div>
                </div>
                
                <div class="form-group">
                    <label for="element"><i class="fas fa-leaf"></i> 五行属性</label>
                    <select id="element">
                        <option value="all">全部属性</option>
                        <option value="metal">金（刚毅果断）</option>
                        <option value="wood">木（生机勃勃）</option>
                        <option value="water">水（智慧灵动）</option>
                        <option value="fire">火（热情活力）</option>
                        <option value="earth">土（稳重诚信）</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="theme"><i class="fas fa-palette"></i> 名字主题</label>
                    <select id="theme">
                        <option value="all">全部主题</option>
                        <option value="nature">自然风光</option>
                        <option value="wisdom">智慧才华</option>
                        <option value="virtue">品德修养</option>
                        <option value="beauty">美丽优雅</option>
                        <option value="health">健康长寿</option>
                    </select>
                </div>
                
                <button class="btn" id="generateBtn">
                    <i class="fas fa-magic"></i> 生成名字
                </button>
                
                <button class="btn btn-reset" id="resetBtn">
                    <i class="fas fa-redo"></i> 重置设置
                </button>
            </div>
            
            <div class="results-section">
                <div class="result-header">
                    <h2 class="section-title"><i class="fas fa-list"></i> 名字推荐</h2>
                    <div class="result-count" id="resultCount">共 0 个名字</div>
                </div>
                
                <div class="results-container" id="resultsContainer">
                    <div class="empty-state">
                        <i class="fas fa-baby-carriage"></i>
                        <h3>尚未生成名字</h3>
                        <p>请设置条件并点击"生成名字"按钮</p>
                    </div>
                </div>
                
                <button class="btn btn-more" id="loadMoreBtn" style="display: none;">
                    <i class="fas fa-plus-circle"></i> 加载更多名字
                </button>
                
                <div class="favorites">
                    <h3><i class="fas fa-heart"></i> 收藏的名字</h3>
                    <div class="favorites-list" id="favoritesList">
                        <div class="empty-state" style="padding: 20px 0; width: 100%;">
                            <i class="far fa-star"></i>
                            <p>您还没有收藏任何名字</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>宝宝起名神器 &copy; 2023 - 专业婴儿起名工具 | 结合传统文化与现代技术</p>
            <p>本工具仅供娱乐参考，实际命名请结合家庭传统和个人喜好</p>
        </footer>
    </div>

        // DOM元素

        const surnameInput = document.getElementById('surname');
        const resultCount = document.getElementById('resultCount');
        
        // 生成名字函数
        function generateNames(loadMore = false) {
            const gender = document.querySelector('input[name="gender"]:checked').value;
            const length = document.querySelector('input[name="length"]:checked').value;
            const element = document.getElementById('element').value;
            const theme = document.getElementById('theme').value;
            const surname = surnameInput.value.trim() || '李';
            
            // 清空结果容器（如果不是加载更多）
            if (!loadMore) {
                resultsContainer.innerHTML = '';
                currentPage = 1;
            } else {
                currentPage++;
            }
            
            // 获取对应性别的名字列表
            let names = [];
            if (length === '1') {
                names = [...singleNames[gender]];
                
                // 添加一些中性名字
                if (gender !== 'neutral') {
                    names = names.concat(singleNames.neutral);
                }
            } else {
                names = [...nameDatabase[gender]];
                
                // 添加一些中性名字
                if (gender !== 'neutral') {
                    names = names.concat(nameDatabase.neutral);
                }
            }
            
            // 过滤五行属性
            if (element !== 'all') {
                names = names.filter(name => name.element === element);
            }
            
            // 过滤主题
            if (theme !== 'all') {
                names = names.filter(name => name.theme === theme);
            }
            
            // 显示结果数量
            const totalNames = names.length;
            resultCount.textContent = `共 ${totalNames} 个名字`;
            
            if (totalNames === 0) {
                resultsContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <h3>未找到匹配的名字</h3>
                        <p>请尝试调整搜索条件</p>
                    </div>
                `;
                loadMoreBtn.style.display = 'none';
                return;
            }
            
            // 计算显示的名字数量
            const namesPerPage = 24;
            const startIndex = loadMore ? (currentPage - 1) * namesPerPage : 0;
            const endIndex = Math.min(startIndex + namesPerPage, totalNames);
            const namesToShow = names.slice(startIndex, endIndex);
            
            // 显示名字卡片
            namesToShow.forEach((nameData, index) => {
                const nameCard = document.createElement('div');
                nameCard.className = 'name-card';
                nameCard.style.animationDelay = `${index * 0.05}s`;
                nameCard.innerHTML = `
                    <div class="name">${surname}${nameData.name}</div>
                    <div class="pinyin">${nameData.pinyin}</div>
                    <div class="meaning">${nameData.meaning}</div>
                    <div class="element">五行: ${getElementChinese(nameData.element)}</div>
                    <div class="actions" style="margin-top: 15px;">
                        <button class="btn" style="padding: 10px 15px; font-size: 0.95rem;" onclick="addToFavorites('${surname}', '${nameData.name}', '${nameData.pinyin}', '${nameData.meaning}', '${nameData.element}')">

                        </button>
                    </div>
                `;
                resultsContainer.appendChild(nameCard);
            });
            
            // 显示/隐藏"加载更多"按钮
            if (endIndex < totalNames) {
                loadMoreBtn.style.display = 'block';
            } else {
                loadMoreBtn.style.display = 'none';
            }
        }
        
        // 添加到收藏夹
        function addToFavorites(surname, name, pinyin, meaning, element) {
            // 检查是否已收藏
            const existingFavorites = JSON.parse(localStorage.getItem('babyNameFavorites') || '[]');
            const fullName = surname + name;
            
            if (existingFavorites.some(fav => fav.fullName === fullName)) {
                alert('该名字已在收藏夹中！');
                return;
            }
            
            // 添加到收藏夹
            const newFavorite = {
                fullName,
                surname,
                name,
                pinyin,
                meaning,
                element
            };
            
            existingFavorites.push(newFavorite);
            localStorage.setItem('babyNameFavorites', JSON.stringify(existingFavorites));
            
            // 更新收藏夹显示
            updateFavoritesList();
            alert('已添加到收藏夹！');
        }
        
        // 更新收藏列表
        function updateFavoritesList() {
            const favorites = JSON.parse(localStorage.getItem('babyNameFavorites') || '[]');
            favoritesList.innerHTML = '';
            
            if (favorites.length === 0) {
                favoritesList.innerHTML = `
                    <div class="empty-state" style="padding: 20px 0; width: 100%;">
                        <i class="far fa-star"></i>
                        <p>您还没有收藏任何名字</p>
                    </div>
                `;
                return;
            }
            
            favorites.forEach((fav, index) => {
                const favoriteItem = document.createElement('div');
                favoriteItem.className = 'favorite-item';
                favoriteItem.innerHTML = `
                    <span>${fav.fullName}</span>
                    <i class="fas fa-times" onclick="removeFavorite(${index})"></i>
                `;
                favoritesList.appendChild(favoriteItem);
            });
        }
        
        // 移除收藏
        function removeFavorite(index) {
            const favorites = JSON.parse(localStorage.getItem('babyNameFavorites') || '[]');
            favorites.splice(index, 1);
            localStorage.setItem('babyNameFavorites', JSON.stringify(favorites));
            updateFavoritesList();
        }
        
        // 获取五行中文名称
        function getElementChinese(element) {
            const elements = {
                'metal': '金',
                'wood': '木',
                'water': '水',
                'fire': '火',
                'earth': '土'
            };
            return elements[element] || element;
        }
        
        // 分页变量
        let currentPage = 1;
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 绑定生成按钮事件
            generateBtn.addEventListener('click', () => generateNames(false));
            
            // 绑定加载更多按钮事件
            loadMoreBtn.addEventListener('click', () => generateNames(true));
            
            // 绑定重置按钮事件
            resetBtn.addEventListener('click', function() {
                document.querySelector('input[name="gender"][value="boy"]').checked = true;

                    generateNames(false);
                    localStorage.setItem('firstVisit', 'true');
                }
