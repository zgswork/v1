<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时间沙漏 | Hourglass</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f5f5f5;
            margin: 0;
            position: relative;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .author-info {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 14px;
            color: #666;
            text-align: right;
            background-color: rgba(255,255,255,0.8);
            padding: 5px 10px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        
        .author-info a {
            color: #b8860b;
            text-decoration: none;
            font-weight: bold;
        }
        
        .author-info a:hover {
            text-decoration: underline;
        }
        
        .language-switch {
            margin-top: 5px;
            padding: 3px 8px;
            background-color: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        
        .language-switch:hover {
            background-color: #e0e0e0;
        }
        
        .container {
            text-align: center;
            max-width: 100%;
            width: 100%;
        }
        
        .hourglass {
            position: relative;
            width: 200px;
            height: 400px;
            margin: 30px auto;
        }
        
        /* 上锥形腔体 */
        .upper-chamber {
            position: absolute;
            top: 0;
            width: 200px;
            height: 200px;
            border: 10px solid #b8860b;
            border-bottom: none;
            border-radius: 100px 100px 0 0;
            box-sizing: border-box;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        /* 下锥形腔体 */
        .lower-chamber {
            position: absolute;
            bottom: 0;
            width: 200px;
            height: 200px;
            border: 10px solid #b8860b;
            border-top: none;
            border-radius: 0 0 100px 100px;
            box-sizing: border-box;
            overflow: hidden;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
        }
        
        /* 中间连接部分 */
        .neck {
            position: absolute;
            top: 195px;
            left: 85px;
            width: 30px;
            height: 10px;
            background-color: #b8860b;
            z-index: 10;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
        }
        
        /* 沙子样式 */
        .sand {
            position: absolute;
            background-color: #e5b03c;
            transition: all 1s linear;
        }
        
        /* 上部沙子 - 向左移动到4px */
        .upper-sand {
            top: 0;
            left: 4px;
            width: 180px;
            height: 180px;
            border-radius: 90px 90px 0 0;
            transform-origin: bottom center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }
        
        /* 流动中的沙子 - 向左移动到89px */
        .flowing-sand {
            position: absolute;
            top: 195px;
            left: 89px;
            width: 10px;
            height: 0;
            background-color: #e5b03c;
            z-index: 5;
            transition: height 1s linear;
        }
        
        /* 下部沙子 - 向左移动到4px */
        .lower-sand {
            bottom: 0;
            left: 4px;
            width: 180px;
            height: 0;
            border-radius: 0 0 90px 90px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }
        
        .controls {
            margin: 20px 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        
        .time-input {
            display: flex;
            align-items: center;
        }
        
        input {
            width: 60px;
            padding: 8px;
            margin: 0 5px;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        
        button {
            padding: 10px 20px;
            background-color: #b8860b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            min-width: 80px;
        }
        
        button:hover {
            background-color: #a0780a;
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .display {
            font-size: 36px;
            margin: 20px 0;
            font-weight: bold;
            color: #333;
            font-family: 'Courier New', monospace;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        
        @media (max-width: 480px) {
            .hourglass {
                width: 150px;
                height: 300px;
            }
            
            .upper-chamber, .lower-chamber {
                width: 150px;
                height: 150px;
                border-width: 8px;
                border-radius: 75px 75px 0 0;
            }
            
            .upper-chamber {
                border-radius: 75px 75px 0 0;
            }
            
            .lower-chamber {
                border-radius: 0 0 75px 75px;
            }
            
            .neck {
                top: 145px;
                left: 65px;
                width: 20px;
            }
            
            .upper-sand {
                width: 134px;
                height: 134px;
                left: 2px;
            }
            
            .lower-sand {
                width: 134px;
                left: 2px;
            }
            
            .flowing-sand {
                left: 67px;
            }
            
            .display {
                font-size: 28px;
            }
            
            .controls {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="author-info">
        作者：文璧<br>
        合作邮箱：<a href="/cdn-cgi/l/email-protection#f8cacecfcdcfccc9c1cfcdb88989d69b9795"><span class="__cf_email__" data-cfemail="2c1e1a1b191b181d151b196c5d5d024f4341">[email&#160;protected]</span></a>
        <button class="language-switch" id="languageSwitch">English</button>
    </div>
    
    <div class="container">
        <h1 id="title">时间沙漏</h1>
        
        <div class="display" id="timeDisplay">00:00:00</div>
        
        <div class="hourglass">
            <div class="upper-chamber">
                <div class="sand upper-sand" id="upperSand"></div>
            </div>
            <div class="neck"></div>
            <div class="flowing-sand" id="flowingSand"></div>
            <div class="lower-chamber">
                <div class="sand lower-sand" id="lowerSand"></div>
            </div>
        </div>
        
        <div class="controls">
            <div class="time-input">
                <label for="hoursInput" id="hoursLabel">小时:</label>
                <input type="number" id="hoursInput" min="0" max="23" value="0">
            </div>
            <div class="time-input">
                <label for="minutesInput" id="minutesLabel">分钟:</label>
                <input type="number" id="minutesInput" min="0" max="59" value="5">
            </div>
            <button id="startBtn">开始</button>
            <button id="pauseBtn">暂停</button>
            <button id="resetBtn">重置</button>
        </div>
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        const hoursInput = document.getElementById('hoursInput');
        const minutesInput = document.getElementById('minutesInput');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const upperSand = document.getElementById('upperSand');
        const flowingSand = document.getElementById('flowingSand');
        const lowerSand = document.getElementById('lowerSand');
        const languageSwitch = document.getElementById('languageSwitch');
        const title = document.getElementById('title');
        const hoursLabel = document.getElementById('hoursLabel');
        const minutesLabel = document.getElementById('minutesLabel');
        
        let totalSeconds = 0;
        let remainingSeconds = 0;
        let timer = null;
        let isPaused = false;
        let pauseTime = 0;
        let endTime = 0;
        let isEnglish = false;
        
        // 语言切换
        function toggleLanguage() {
            isEnglish = !isEnglish;
            
            if (isEnglish) {
                title.textContent = "Hourglass";
                hoursLabel.textContent = "Hours:";
                minutesLabel.textContent = "Minutes:";
                startBtn.textContent = "Start";
                pauseBtn.textContent = "Pause";
                resetBtn.textContent = "Reset";
                languageSwitch.textContent = "中文";
                document.title = "Hourglass | 时间沙漏";
            } else {
                title.textContent = "时间沙漏";
                hoursLabel.textContent = "小时:";
                minutesLabel.textContent = "分钟:";
                startBtn.textContent = "开始";
                pauseBtn.textContent = "暂停";
                resetBtn.textContent = "重置";
                languageSwitch.textContent = "English";
                document.title = "时间沙漏 | Hourglass";
            }
            
            // 更新按钮状态文本
            if (isPaused) {
                pauseBtn.textContent = isEnglish ? "Resume" : "继续";
            }
        }
        
        // 初始化沙漏
        function initHourglass() {
            upperSand.style.height = upperSand.parentElement.clientHeight - 20 + 'px';
            upperSand.style.transform = 'scaleY(1)';
            flowingSand.style.height = '0px';
            lowerSand.style.height = '0px';
        }
        
        // 更新时间显示
        function updateDisplay(seconds) {
            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            
            timeDisplay.textContent = 
                `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        // 更新沙漏状态
        function updateHourglass(progress) {
            // 上部沙子逐渐减少
            upperSand.style.transform = `scaleY(${Math.max(0, 1 - progress)})`;
            
            // 流动的沙子高度
            const flowHeight = Math.min(10, progress * 20);
            flowingSand.style.height = `${flowHeight}px`;
            
            // 下部沙子逐渐增加
            const lowerChamberHeight = lowerSand.parentElement.clientHeight - 20;
            lowerSand.style.height = `${lowerChamberHeight * progress}px`;
        }
        
        // 开始倒计时
        function startTimer() {
            if (timer && !isPaused) return;
            
            if (isPaused) {
                // 从暂停状态恢复
                const now = Date.now();
                endTime = now + remainingSeconds * 1000;
                isPaused = false;
                pauseBtn.textContent = isEnglish ? "Pause" : "暂停";
                startBtn.disabled = true;
            } else {
                // 全新开始
                const hours = parseInt(hoursInput.value) || 0;
                const minutes = parseInt(minutesInput.value) || 0;
                
                if (hours < 0 || hours > 23 || minutes < 0 || minutes > 59) {
                    alert(isEnglish ? 
                        "Please enter valid time (0-23 hours, 0-59 minutes)" : 
                        "请输入有效的时间（0-23小时，0-59分钟）");
                    return;
                }
                
                totalSeconds = hours * 3600 + minutes * 60;
                remainingSeconds = totalSeconds;
                
                if (totalSeconds <= 0) {
                    alert(isEnglish ? "Please set time greater than 0" : "请设置大于0的时间");
                    return;
                }
                
                endTime = Date.now() + totalSeconds * 1000;
                initHourglass();
                startBtn.disabled = true;
                pauseBtn.disabled = false;
            }
            
            updateDisplay(remainingSeconds);
            
            // 清除之前的计时器
            if (timer) {
                clearInterval(timer);
            }
            
            // 开始新的计时器
            timer = setInterval(() => {
                if (isPaused) return;
                
                remainingSeconds = Math.max(0, Math.round((endTime - Date.now()) / 1000));
                const progress = 1 - (remainingSeconds / totalSeconds);
                
                updateDisplay(remainingSeconds);
                updateHourglass(progress);
                
                if (remainingSeconds <= 0) {
                    clearInterval(timer);
                    timer = null;
                    startBtn.disabled = false;
                    pauseBtn.disabled = true;
                    // 倒计时结束效果
                    setTimeout(() => {
                        upperSand.style.transform = 'scaleY(0)';
                        flowingSand.style.height = '10px';
                        lowerSand.style.height = lowerSand.parentElement.clientHeight - 20 + 'px';
                    }, 1000);
                }
            }, 1000);
        }
        
        // 暂停倒计时
        function pauseTimer() {
            if (!timer) return;
            
            if (isPaused) {
                // 恢复计时
                isPaused = false;
                pauseBtn.textContent = isEnglish ? "Pause" : "暂停";
                startTimer();
            } else {
                // 暂停计时
                isPaused = true;
                pauseTime = Date.now();
                pauseBtn.textContent = isEnglish ? "Resume" : "继续";
                clearInterval(timer);
                timer = null;
                startBtn.disabled = false;
            }
        }
        
        // 重置倒计时
        function resetTimer() {
            if (timer) {
                clearInterval(timer);
                timer = null;
            }
            
            isPaused = false;
            pauseBtn.textContent = isEnglish ? "Pause" : "暂停";
            hoursInput.value = '0';
            minutesInput.value = '5';
            remainingSeconds = 0;
            updateDisplay(remainingSeconds);
            initHourglass();
            startBtn.disabled = false;
            pauseBtn.disabled = false;
        }
        
        // 事件监听
        startBtn.addEventListener('click', startTimer);
        resetBtn.addEventListener('click', resetTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        languageSwitch.addEventListener('click', toggleLanguage);
        
        // 初始化
        resetTimer();
        
        // 响应式调整
        window.addEventListener('resize', initHourglass);
    </script>
</body>
</html>
