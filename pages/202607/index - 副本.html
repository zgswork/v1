<!DOCTYPE html>
<html lang="zh-CN">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Lonely-HTML</title>
        <style>
            /* ===== 全局重置 ===== */
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
                background: #1a2332;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                padding: 2rem 1.5rem;
                overflow-x: hidden;
            }

            .container {
                max-width: 1360px;
                width: 100%;
                overflow-x: hidden;
            }

            /* ===== 头部 ===== */
            .header {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                justify-content: space-between;
                gap: 1rem 1.5rem;
                margin-bottom: 2rem;
                padding: 0 0.25rem;
            }

            .header h1 {
                font-size: 1.8rem;
                font-weight: 600;
                color: #ffffff;
                letter-spacing: -0.5px;
                white-space: nowrap;
            }

            .header h1 span {
                color: #4f7df3;
            }

            .search-wrapper {
                position: relative;
                flex: 1;
                min-width: 200px;
                max-width: 460px;
            }

            .search-wrapper input {
                width: 100%;
                padding: 0.7rem 1rem 0.7rem 2.8rem;
                border: 2px solid #e2e8f0;
                border-radius: 12px;
                font-size: 1rem;
                background: #ffffff;
                transition: all 0.25s ease;
                outline: none;
                color: #1a2332;
            }

            .search-wrapper input:focus {
                border-color: #4f7df3;
                box-shadow: 0 0 0 4px rgba(79, 125, 243, 0.15);
            }

            .search-wrapper input::placeholder {
                color: #a0aec0;
            }

            .search-wrapper .icon {
                position: absolute;
                left: 1rem;
                top: 50%;
                transform: translateY(-50%);
                color: #a0aec0;
                font-size: 1.1rem;
                pointer-events: none;
                line-height: 1;
            }

            .stats {
                font-size: 0.95rem;
                color: #64748b;
                white-space: nowrap;
                background: #ffffff;
                padding: 0.4rem 1.2rem;
                border-radius: 20px;
                border: 1px solid #e2e8f0;
            }

            .stats strong {
                color: #1a2332;
                font-weight: 600;
            }

            .stats .tag-count {
                font-size: 0.75rem;
                color: #94a3b8;
                background: #f1f4f9;
                padding: 0.1rem 0.6rem;
                border-radius: 10px;
                margin-left: 0.3rem;
            }

            /* ===== 网格：自适应列数，每列最小宽度 200px ===== */
            .file-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 0.6rem;
                margin-top: 0.5rem;
                overflow-x: hidden;
            }

            /* ===== 卡片 ===== */
            .file-card {
                background: #1a2332;
                border-radius: 12px;
                padding: 0.5rem 0.8rem;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
                border: 1px solid #edf2f7;
                transition: transform 0.15s ease, box-shadow 0.2s ease, border-color 0.2s ease;
                display: flex;
                align-items: center;
                min-height: 38px;
                cursor: pointer;
            }

            .file-card.starred a {
                color: #ef4444 !important;
                /* 红色 */
            }

            .file-card:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
                border-color: #222427;
            }

            .file-card a {
                text-decoration: none;
                color: #ffffff;
                font-weight: 500;
                font-size: 1rem;
                display: flex;
                align-items: center;
                gap: 0.4rem;
                width: 100%;
                overflow: hidden;
                transition: color 0.15s ease;
                pointer-events: none;
            }

            .file-card a .filename {
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                flex: 1;
                min-width: 0;
            }

            .file-card a .badge {
                flex-shrink: 0;
                font-size: 0.55rem;
                font-weight: 600;
                color: #94a3b8;
                background: #f1f4f9;
                padding: 0.1rem 0.5rem;
                border-radius: 5px;
                letter-spacing: 0.3px;
                text-transform: uppercase;
            }

            /* ===== 空状态 ===== */
            .empty-state {
                grid-column: 1 / -1;
                text-align: center;
                padding: 4rem 1rem;
                color: #94a3b8;
                font-size: 1.1rem;
                background: #ffffff;
                border-radius: 16px;
                border: 2px dashed #e2e8f0;
            }

            .empty-state .emoji {
                font-size: 2.8rem;
                display: block;
                margin-bottom: 0.8rem;
            }

            /* ===== 显隐动画 ===== */
            .file-card {
                transition: opacity 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease,
                    border-color 0.2s ease;
            }

            .file-card.hidden {
                display: none;
            }

            .file-card.visible {
                display: flex;
                animation: fadeIn 0.2s ease;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: scale(0.97);
                }

                to {
                    opacity: 1;
                    transform: scale(1);
                }
            }

            /* ===== 覆盖层（全屏展示目标页面） ===== */
            #overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: #fff;
                z-index: 9999;
                display: none;
                flex-direction: column;
            }

            #overlay.active {
                display: flex;
            }

            #overlay-nav {
                flex-shrink: 0;
                background: rgba(255, 255, 255, 0.92);
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                padding: 10px 20px;
                border-bottom: 1px solid rgba(0, 0, 0, 0.08);
                display: flex;
                align-items: center;
                gap: 16px;
                z-index: 10;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            }

            #overlay-nav .back-btn {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 6px 14px 6px 10px;
                background: #f1f4f9;
                border-radius: 30px;
                border: none;
                color: #1a2332;
                font-size: 0.9rem;
                font-weight: 500;
                cursor: pointer;
                transition: all 0.2s ease;
                text-decoration: none;
                font-family: inherit;
            }

            #overlay-nav .back-btn:hover {
                background: #e2e8f0;
                transform: translateX(-2px);
            }

            #overlay-nav .back-btn svg {
                width: 20px;
                height: 20px;
                stroke: currentColor;
            }

            #overlay-nav .file-title {
                font-size: 0.9rem;
                color: #64748b;
                flex: 1;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            #overlay iframe {
                flex: 1;
                width: 100%;
                border: none;
                background: #fff;
            }

            /* ===== 响应式微调 ===== */
            @media (max-width: 768px) {
                body {
                    padding: 1.2rem 1rem;
                }

                .header {
                    flex-direction: column;
                    align-items: stretch;
                    gap: 0.8rem;
                }

                .header h1 {
                    font-size: 1.5rem;
                    white-space: normal;
                    text-align: center;
                }

                .search-wrapper {
                    max-width: 100%;
                }

                .stats {
                    text-align: center;
                    white-space: normal;
                }

                .file-card {
                    padding: 0.6rem 0.8rem;
                    min-height: 40px;
                }

                .file-card a {
                    font-size: 0.82rem;
                }

                #overlay-nav {
                    padding: 8px 12px;
                    flex-wrap: wrap;
                }

                #overlay-nav .back-btn {
                    font-size: 0.8rem;
                    padding: 4px 10px 4px 8px;
                }

                #overlay-nav .file-title {
                    font-size: 0.75rem;
                    max-width: 120px;
                }
            }

            @media (max-width: 480px) {
                .file-card {
                    padding: 0.5rem 0.6rem;
                    min-height: 36px;
                    border-radius: 8px;
                }

                .file-card a {
                    font-size: 0.75rem;
                }

                .file-card a .badge {
                    font-size: 0.45rem;
                    padding: 0.05rem 0.35rem;
                }

                #overlay-nav {
                    padding: 6px 10px;
                }

                #overlay-nav .back-btn {
                    font-size: 0.7rem;
                    padding: 3px 8px 3px 6px;
                }

                #overlay-nav .back-btn svg {
                    width: 16px;
                    height: 16px;
                }

                #overlay-nav .file-title {
                    font-size: 0.7rem;
                    max-width: 80px;
                }
            }
        </style>
    </head>

    <body>
        <div class="container" id="mainContainer">
            <div class="header">
                <!--
                <h1>Lonely-HTML列表</h1>
                -->
                <div class="search-wrapper">
                    <span class="icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="搜索应用名…" autocomplete="off" />
                </div>
                <div class="stats" id="stats">
                    共 <strong id="totalCount">0</strong> 个应用
                    <span class="tag-count" id="visibleCount"></span>
                </div>
            </div>
            <div class="file-grid" id="fileGrid">
                <!-- 由 JS 动态渲染 -->
            </div>
        </div>
        <!-- ===== 覆盖层 ===== -->
        <div id="overlay">
            <div id="overlay-nav">
                <button class="back-btn" id="backBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                    <span>返回主页</span>
                </button>
                <span class="file-title" id="overlayTitle">正在加载…</span>
            </div>
            <iframe id="contentFrame" src="about:blank"></iframe>
        </div>
        <!-- ===== 引入外部数据文件（已改为 index.js） ===== -->
        <script src="index.js"></script>
        <script>
            (function () {
                'use strict';
                // 数据已从外部 index.js 导入，全局变量 FILE_NAMES 可用
                if (typeof FILE_NAMES === 'undefined') {
                    console.error('请确保 index.js 已正确加载并定义了 FILE_NAMES 数组。');
                    return;
                }
                // DOM 引用
                const grid = document.getElementById('fileGrid');
                const searchInput = document.getElementById('searchInput');
                const totalCountEl = document.getElementById('totalCount');
                const visibleCountEl = document.getElementById('visibleCount');
                const overlay = document.getElementById('overlay');
                const backBtn = document.getElementById('backBtn');
                const contentFrame = document.getElementById('contentFrame');
                const overlayTitle = document.getElementById('overlayTitle');
                // ===== 改进的显示名称提取（支持路径） =====
                function getDisplayName(filename) {
                    const baseName = filename.split('/').pop();// 提取文件名（去掉路径）
                    const cleanBase = baseName.replace(/^\*/, '');   // 去掉前导 *
                    const base = cleanBase.replace(/\.[^.]+$/, '');// 去掉扩展名                    
                    const parts = base.split(/[-_]/);// 取第一个 '-' 或 '_' 之前的部分，若无则返回整个 base
                    return parts[0] && parts[0].trim() ? parts[0].trim() : base;
                }
                function escapeHtml(str) {
                    const div = document.createElement('div');
                    div.textContent = str;
                    return div.innerHTML;
                }
                // 渲染列表
                function render(files) {
                    if (!files || files.length === 0) {
                        grid.innerHTML = `<div class="empty-state"><span class="emoji">📭</span>没有找到匹配的 HTML 应用</div>`;
                        return;
                    }
                    let html = '';
                    for (const f of files) {
                        const display = getDisplayName(f);
                        const isStarred = f.startsWith('*');
                        const actualFile = isStarred ? f.slice(1) : f;
                        const cardClass = isStarred ? 'file-card visible starred' : 'file-card visible';
                        html += `<div class="${cardClass}" data-filename="${escapeHtml(actualFile)}"><a href="#" title="${escapeHtml(f)}"><span class="filename">${escapeHtml(display)}</span></a></div>`;
                    }
                    grid.innerHTML = html;
                }
                function updateStats(total, visible) {
                    totalCountEl.textContent = total;
                    if (visible === total) {
                        visibleCountEl.textContent = '';
                    } else {
                        visibleCountEl.textContent = `(已搜索 ${visible} 个应用)`;
                    }
                }
                function filterFiles(query) {
                    const q = query.trim().toLowerCase();
                    let filtered;
                    if (!q) {
                        filtered = FILE_NAMES.slice();
                    } else {
                        filtered = FILE_NAMES.filter(f => {
                            const display = getDisplayName(f);
                            return display.toLowerCase().includes(q) ||
                                f.toLowerCase().includes(q);
                        });
                    }
                    render(filtered);
                    updateStats(FILE_NAMES.length, filtered.length);
                }
                // 覆盖层控制
                function openFile(filename) {
                    overlay.classList.add('active');
                    overlayTitle.textContent = filename;
                    // 直接使用完整路径（包含子目录）加载
                    contentFrame.src = encodeURI(filename);
                }
                function closeOverlay() {
                    overlay.classList.remove('active');
                    contentFrame.src = 'about:blank';
                    overlayTitle.textContent = '正在加载…';
                }
                // 事件绑定
                grid.addEventListener('click', function (e) {
                    const card = e.target.closest('.file-card');
                    if (!card) return;
                    const filename = card.dataset.filename;
                    if (filename) {
                        e.preventDefault();
                        openFile(filename);
                    }
                });
                backBtn.addEventListener('click', function (e) {
                    e.preventDefault();
                    closeOverlay();
                });
                document.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape' && overlay.classList.contains('active')) {
                        closeOverlay();
                    }
                });
                searchInput.addEventListener('input', function (e) {
                    filterFiles(this.value);
                });
                searchInput.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape') {
                        this.value = '';
                        filterFiles('');
                        this.blur();
                    }
                });
                // 初始化
                render(FILE_NAMES);
                updateStats(FILE_NAMES.length, FILE_NAMES.length);
            })();
        </script>
    </body>

</html>
