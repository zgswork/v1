<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成语接龙乐园 - 小学生版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', '微软雅黑', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6ecbf5 0%, #e4f5fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 900px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            position: relative;
        }
        
        header {
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            padding: 20px;
            text-align: center;
            position: relative;
        }
        
        h1 {
            color: #fff;
            font-size: 2.8rem;
            text-shadow: 0 3px 6px rgba(0,0,0,0.2);
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #5a3d2b;
            font-size: 1.2rem;
            font-weight: bold;
        }
        
        .game-area {
            display: flex;
            padding: 25px;
        }
        
        .left-panel {
            flex: 1;
            padding: 20px;
            background: #fff9e6;
            border-radius: 20px;
            margin-right: 20px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }
        
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .prompt-box {
            background: linear-gradient(to right, #a1c4fd, #c2e9fb);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .prompt-title {
            color: #2c3e50;
            font-size: 1.3rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .prompt-title i {
            margin-right: 10px;
            color: #e74c3c;
        }
        
        .current-character {
            display: inline-block;
            font-size: 4rem;
            font-weight: bold;
            color: #e74c3c;
            background: white;
            width: 100px;
            height: 100px;
            line-height: 100px;
            border-radius: 50%;
            margin: 15px auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .input-area {
            background: #e8f4f8;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .input-group {
            display: flex;
            margin-bottom: 20px;
        }
        
        #idiom-input {
            flex: 1;
            padding: 18px;
            font-size: 1.4rem;
            border: 3px solid #a1c4fd;
            border-radius: 15px 0 0 15px;
            outline: none;
            text-align: center;
        }
        
        #submit-btn {
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            padding: 0 30px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 0 15px 15px 0;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        #submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .help-buttons {
            display: flex;
            justify-content: space-between;
        }
        
        .help-btn {
            flex: 1;
            padding: 15px;
            margin: 0 5px;
            border: none;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .help-btn i {
            margin-right: 8px;
            font-size: 1.3rem;
        }
        
        .hint-btn {
            background: linear-gradient(to right, #ff9a9e 0%, #fad0c4 100%);
        }
        
        .explain-btn {
            background: linear-gradient(to right, #6a11cb 0%, #2575fc 100%);
        }
        
        .reset-btn {
            background: linear-gradient(to right, #42e695 0%, #3bb2b8 100%);
        }
        
        .help-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .info-area {
            background: #fff;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
        }
        
        .score-item {
            text-align: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 15px;
            flex: 1;
            margin: 0 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }
        
        .score-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #3498db;
        }
        
        .score-label {
            font-size: 1.1rem;
            color: #7f8c8d;
        }
        
        .history-title {
            text-align: center;
            margin: 20px 0;
            color: #2c3e50;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .history-title i {
            margin-right: 10px;
            color: #3498db;
        }
        
        #history-list {
            height: 200px;
            overflow-y: auto;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 15px;
            border: 2px dashed #c2e9fb;
        }
        
        .history-item {
            padding: 12px;
            margin: 10px 0;
            background: white;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            animation: slideIn 0.5s;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .idiom-text {
            font-size: 1.6rem;
            font-weight: bold;
            color: #e74c3c;
        }
        
        .idiom-info {
            font-size: 0.9rem;
            color: #7f8c8d;
            max-width: 250px;
        }
        
        .message-box {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            display: none;
            z-index: 1000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .success-message {
            background: linear-gradient(to right, #00b09b, #96c93d);
            color: white;
        }
        
        .error-message {
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            color: white;
        }
        
        .explanation-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 500px;
            background: white;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
            z-index: 2000;
            display: none;
        }
        
        .explanation-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .explanation-title {
            font-size: 1.8rem;
            color: #3498db;
        }
        
        .close-btn {
            background: #e74c3c;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.5rem;
        }
        
        .explanation-content {
            line-height: 1.8;
            font-size: 1.1rem;
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1500;
            display: none;
        }
        
        @media (max-width: 768px) {
            .game-area {
                flex-direction: column;
            }
            
            .left-panel {
                margin-right: 0;
                margin-bottom: 20px;
            }
            
            .score-board {
                flex-direction: column;
            }
            
            .score-item {
                margin: 10px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-dragon"></i> 成语接龙乐园</h1>
            <p class="subtitle">开动脑筋，快乐学习成语！</p>
        </header>
        
        <div class="game-area">
            <div class="left-panel">
                <div class="prompt-box">
                    <div class="prompt-title">
                        <i class="fas fa-bullhorn"></i> 请接一个以这个字开头的成语
                    </div>
                    <div class="current-character" id="current-char">龙</div>
                    <p>小朋友，开动脑筋想一想吧！</p>
                </div>
                
                <div class="input-area">
                    <div class="input-group">
                        <input type="text" id="idiom-input" placeholder="输入四字成语..." maxlength="4">
                        <button id="submit-btn">提交</button>
                    </div>
                    
                    <div class="help-buttons">
                        <button class="help-btn hint-btn" id="hint-btn">
                            <i class="fas fa-lightbulb"></i> 提示
                        </button>
                        <button class="help-btn explain-btn" id="explain-btn">
                            <i class="fas fa-book"></i> 解释
                        </button>
                        <button class="help-btn reset-btn" id="reset-btn">
                            <i class="fas fa-redo"></i> 重新开始
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="right-panel">
                <div class="info-area">
                    <div class="score-board">
                        <div class="score-item">
                            <div class="score-value" id="score">0</div>
                            <div class="score-label">当前得分</div>
                        </div>
                        <div class="score-item">
                            <div class="score-value" id="combo">0</div>
                            <div class="score-label">连续正确</div>
                        </div>
                        <div class="score-item">
                            <div class="score-value" id="hint-count">3</div>
                            <div class="score-label">剩余提示</div>
                        </div>
                    </div>
                    
                    <div class="history-title">
                        <i class="fas fa-history"></i> 接龙历史
                    </div>
                    <div id="history-list"></div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="message-box" id="message-box"></div>
    
    <div class="overlay" id="overlay"></div>
    
    <div class="explanation-box" id="explanation-box">
        <div class="explanation-header">
            <h2 class="explanation-title" id="explain-title">成语解释</h2>
            <div class="close-btn" id="close-explain">
                <i class="fas fa-times"></i>
            </div>
        </div>
        <div class="explanation-content" id="explain-content">
            这里将显示成语的详细解释、拼音和例句。
        </div>
    </div>

    <script>
        // 成语数据库（包含解释、拼音和例句）
        const idioms = [
            {
                word: "龙飞凤舞",
                pinyin: "lóng fēi fèng wǔ",
                explanation: "形容山势蜿蜒起伏，气势磅礴。也形容书法笔势活泼有力。",
                example: "他的书法写得龙飞凤舞，十分漂亮。"
            },
            {
                word: "舞文弄墨",
                pinyin: "wǔ wén nòng mò",
                explanation: "指玩弄文字技巧。",
                example: "他整天舞文弄墨，却不做实际工作。"
            },
            {
                word: "墨守成规",
                pinyin: "mò shǒu chéng guī",
                explanation: "指思想保守，守着老规矩不肯改变。",
                example: "做事不能墨守成规，要敢于创新。"
            },
            {
                word: "规行矩步",
                pinyin: "guī xíng jǔ bù",
                explanation: "指举动合乎规矩，毫不苟且。也比喻墨守成规，不知变通。",
                example: "他做事规行矩步，从不越雷池一步。"
            },
            {
                word: "步步高升",
                pinyin: "bù bù gāo shēng",
                explanation: "指职位不断上升。",
                example: "祝你工作顺利，步步高升！"
            },
            {
                word: "升堂入室",
                pinyin: "shēng táng rù shì",
                explanation: "比喻学问或技能由浅入深，达到更高的水平。",
                example: "学习要循序渐进，才能升堂入室。"
            },
            {
                word: "室迩人远",
                pinyin: "shì ěr rén yuǎn",
                explanation: "房屋就在近处，可是房屋的主人却离得远了。多用于思念远别的人。",
                example: "虽然我们相隔千里，但室迩人远，思念之情更浓。"
            },
            {
                word: "远见卓识",
                pinyin: "yuǎn jiàn zhuó shí",
                explanation: "远大的眼光，卓越的见识。",
                example: "他是一位有远见卓识的企业家。"
            },
            {
                word: "识文断字",
                pinyin: "shí wén duàn zì",
                explanation: "认识字，有文化。",
                example: "奶奶虽然年纪大了，但识文断字，经常看书。"
            },
            {
                word: "字正腔圆",
                pinyin: "zì zhèng qiāng yuán",
                explanation: "形容吐字准确，唱腔圆熟。",
                example: "这位播音员字正腔圆，声音非常好听。"
            }
        ];
        
        // 游戏状态
        let gameState = {
            currentChar: '龙',
            score: 0,
            combo: 0,
            hintCount: 3,
            history: [],
            usedIdioms: []
        };
        
        // DOM元素
        const currentCharEl = document.getElementById('current-char');
        const idiomInputEl = document.getElementById('idiom-input');
        const submitBtn = document.getElementById('submit-btn');
        const hintBtn = document.getElementById('hint-btn');
        const explainBtn = document.getElementById('explain-btn');
        const resetBtn = document.getElementById('reset-btn');
        const scoreEl = document.getElementById('score');
        const comboEl = document.getElementById('combo');
        const hintCountEl = document.getElementById('hint-count');
        const historyListEl = document.getElementById('history-list');
        const messageBoxEl = document.getElementById('message-box');
        const explanationBoxEl = document.getElementById('explanation-box');
        const overlayEl = document.getElementById('overlay');
        const explainTitleEl = document.getElementById('explain-title');
        const explainContentEl = document.getElementById('explain-content');
        const closeExplainBtn = document.getElementById('close-explain');
        
        // 初始化游戏
        function initGame() {
            gameState = {
                currentChar: '龙',
                score: 0,
                combo: 0,
                hintCount: 3,
                history: [],
                usedIdioms: []
            };
            
            updateUI();
            idiomInputEl.value = '';
            historyListEl.innerHTML = '';
            showMessage('游戏开始！请接一个以"龙"开头的成语', 'success');
        }
        
        // 更新UI
        function updateUI() {
            currentCharEl.textContent = gameState.currentChar;
            scoreEl.textContent = gameState.score;
            comboEl.textContent = gameState.combo;
            hintCountEl.textContent = gameState.hintCount;
        }
        
        // 显示消息
        function showMessage(message, type) {
            messageBoxEl.textContent = message;
            messageBoxEl.className = 'message-box ' + type + '-message';
            messageBoxEl.style.display = 'block';
            
            setTimeout(() => {
                messageBoxEl.style.display = 'none';
            }, 3000);
        }
        
        // 显示解释
        function showExplanation(idiom) {
            const idiomData = idioms.find(item => item.word === idiom);
            
            if (idiomData) {
                explainTitleEl.textContent = idiomData.word;
                explainContentEl.innerHTML = `
                    <p><strong>拼音：</strong>${idiomData.pinyin}</p>
                    <p><strong>解释：</strong>${idiomData.explanation}</p>
                    <p><strong>例句：</strong>${idiomData.example}</p>
                `;
                
                explanationBoxEl.style.display = 'block';
                overlayEl.style.display = 'block';
            }
        }
        
        // 提交成语
        function submitIdiom() {
            const idiom = idiomInputEl.value.trim();
            
            if (idiom.length !== 4) {
                showMessage('成语必须是四个字哦！', 'error');
                return;
            }
            
            if (idiom[0] !== gameState.currentChar) {
                showMessage(`请接一个以"${gameState.currentChar}"开头的成语！`, 'error');
                gameState.combo = 0;
                updateUI();
                return;
            }
            
            const idiomData = idioms.find(item => item.word === idiom);
            if (!idiomData) {
                showMessage('这个成语不在我们的词库中，请换一个试试！', 'error');
                gameState.combo = 0;
                updateUI();
                return;
            }
            
            if (gameState.usedIdioms.includes(idiom)) {
                showMessage('这个成语已经用过了，请换一个吧！', 'error');
                gameState.combo = 0;
                updateUI();
                return;
            }
            
            // 成功接龙
            gameState.history.push(idiomData);
            gameState.usedIdioms.push(idiom);
            gameState.currentChar = idiom[idiom.length - 1];
            gameState.score += 10;
            gameState.combo += 1;
            
            // 添加历史记录
            const historyItem = document.createElement('div');
            historyItem.className = 'history-item';
            historyItem.innerHTML = `
                <div class="idiom-text">${idiomData.word}</div>
                <div class="idiom-info">${idiomData.pinyin}<br>${idiomData.explanation}</div>
            `;
            historyListEl.prepend(historyItem);
            
            updateUI();
            idiomInputEl.value = '';
            
            showMessage(`太棒了！${idiom} 接龙成功！`, 'success');
        }
        
        // 提供提示
        function provideHint() {
            if (gameState.hintCount <= 0) {
                showMessage('今天的提示次数用完啦！', 'error');
                return;
            }
            
            const possibleIdioms = idioms.filter(item => 
                item.word[0] === gameState.currentChar && 
                !gameState.usedIdioms.includes(item.word)
            );
            
            if (possibleIdioms.length === 0) {
                showMessage('没有找到可用的成语，游戏结束！', 'error');
                return;
            }
            
            gameState.hintCount--;
            updateUI();
            
            const randomIndex = Math.floor(Math.random() * possibleIdioms.length);
            const hintIdiom = possibleIdioms[randomIndex].word;
            
            showMessage(`试试这个成语：${hintIdiom}`, 'success');
        }
        
        // 事件监听
        submitBtn.addEventListener('click', submitIdiom);
        
        idiomInputEl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                submitIdiom();
            }
        });
        
        hintBtn.addEventListener('click', provideHint);
        
        explainBtn.addEventListener('click', () => {
            const idiom = idiomInputEl.value.trim();
            if (idiom.length !== 4) {
                showMessage('请输入一个四字成语', 'error');
                return;
            }
            
            if (idioms.some(item => item.word === idiom)) {
                showExplanation(idiom);
            } else {
                showMessage('这个成语不在我们的词库中', 'error');
            }
        });
        
        resetBtn.addEventListener('click', initGame);
        
        closeExplainBtn.addEventListener('click', () => {
            explanationBoxEl.style.display = 'none';
            overlayEl.style.display = 'none';
        });
        
        overlayEl.addEventListener('click', () => {
            explanationBoxEl.style.display = 'none';
            overlayEl.style.display = 'none';
        });
        
        // 初始化游戏
        initGame();
    </script>
</body>
</html>
