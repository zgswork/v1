<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本大小写转换工具</title>
    <style>
        :root {
            --primary: #3498db;
            --secondary: #2ecc71;
            --dark: #2c3e50;
            --light: #ecf0f1;
            --gray: #95a5a6;
            --danger: #e74c3c;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
            color: var(--light);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: rgba(44, 62, 80, 0.9);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        header {
            background-color: var(--dark);
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid var(--primary);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--primary);
        }
        
        .subtitle {
            color: var(--gray);
            font-size: 1.1rem;
        }
        
        .content {
            display: flex;
            flex-wrap: wrap;
            padding: 20px;
        }
        
        .input-section {
            flex: 1;
            min-width: 300px;
            padding: 20px;
        }
        
        .output-section {
            flex: 1;
            min-width: 300px;
            padding: 20px;
        }
        
        .section-title {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: var(--secondary);
            border-bottom: 2px solid var(--primary);
            padding-bottom: 5px;
        }
        
        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid var(--primary);
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1.1rem;
            resize: vertical;
            transition: all 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.5);
            background-color: rgba(255, 255, 255, 0.15);
        }
        
        .btn-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
        }
        
        .btn {
            flex: 1;
            min-width: 120px;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background-color: var(--primary);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        .btn-convert {
            background-color: var(--secondary);
        }
        
        .btn-copy {
            background-color: #9b59b6;
        }
        
        .btn-reset {
            background-color: var(--danger);
        }
        
        .result-container {
            position: relative;
            margin-top: 20px;
        }
        
        .result-box {
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 15px;
            min-height: 150px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid var(--gray);
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-all;
        }
        
        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .copy-btn:hover {
            background: var(--primary);
        }
        
        .examples {
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.2);
            border-top: 1px solid var(--gray);
        }
        
        .examples-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .example-item {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 5px;
            border-left: 3px solid var(--secondary);
        }
        
        .example-title {
            font-weight: bold;
            color: var(--secondary);
            margin-bottom: 5px;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            background-color: var(--secondary);
            color: white;
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transform: translateX(200%);
            transition: transform 0.3s ease;
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        @media (max-width: 768px) {
            .content {
                flex-direction: column;
            }
            
            .input-section, .output-section {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>文本大小写转换工具</h1>
            <p class="subtitle">专为程序员设计 - 支持多种命名规范转换</p>
        </header>
        
        <div class="content">
            <div class="input-section">
                <h2 class="section-title">输入文本</h2>
                <textarea id="inputText" placeholder="在此输入需要转换的文本...">convertThisTextExample</textarea>
                
                <div class="btn-container">
                    <button class="btn btn-convert" id="convertBtn">转换全部</button>
                    <button class="btn btn-reset" id="resetBtn">重置</button>
                </div>
                
                <div class="btn-container">
                    <button class="btn" data-type="lower">转小写</button>
                    <button class="btn" data-type="upper">转大写</button>
                    <button class="btn" data-type="camel">驼峰命名</button>
                    <button class="btn" data-type="pascal">帕斯卡命名</button>
                    <button class="btn" data-type="snake">蛇形命名</button>
                    <button class="btn" data-type="kebab">烤肉串命名</button>
                    <button class="btn" data-type="title">标题命名</button>
                </div>
            </div>
            
            <div class="output-section">
                <h2 class="section-title">转换结果</h2>
                <div class="result-container">
                    <div class="result-box" id="resultBox"></div>
                    <button class="copy-btn" id="copyBtn">复制</button>
                </div>
                
                <div class="result-container" style="margin-top: 30px;">
                    <h3 class="section-title">所有格式预览</h3>
                    <div class="result-box" id="allResultsBox"></div>
                </div>
            </div>
        </div>
        
        <div class="examples">
            <h2 class="section-title">命名规范示例</h2>
            <div class="examples-grid">
                <div class="example-item">
                    <div class="example-title">小写</div>
                    <div>hello world</div>
                </div>
                <div class="example-item">
                    <div class="example-title">大写</div>
                    <div>HELLO WORLD</div>
                </div>
                <div class="example-item">
                    <div class="example-title">驼峰命名</div>
                    <div>helloWorldExample</div>
                </div>
                <div class="example-item">
                    <div class="example-title">帕斯卡命名</div>
                    <div>HelloWorldExample</div>
                </div>
                <div class="example-item">
                    <div class="example-title">蛇形命名</div>
                    <div>hello_world_example</div>
                </div>
                <div class="example-item">
                    <div class="example-title">烤肉串命名</div>
                    <div>hello-world-example</div>
                </div>
                <div class="example-item">
                    <div class="example-title">标题命名</div>
                    <div>Hello World Example</div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="notification" id="notification">已复制到剪贴板！</div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const inputText = document.getElementById('inputText');
            const resultBox = document.getElementById('resultBox');
            const allResultsBox = document.getElementById('allResultsBox');
            const convertBtn = document.getElementById('convertBtn');
            const resetBtn = document.getElementById('resetBtn');
            const copyBtn = document.getElementById('copyBtn');
            const notification = document.getElementById('notification');
            const typeButtons = document.querySelectorAll('.btn[data-type]');
            
            // 分词函数 - 处理驼峰、蛇形等命名方式
            function splitWords(str) {
                // 处理蛇形命名和烤肉串命名
                if (str.includes('_') || str.includes('-')) {
                    return str.split(/[_\s-]+/);
                }
                
                // 处理驼峰命名
                return str.replace(/([a-z])([A-Z])/g, '$1 $2')
                          .replace(/([A-Z]+)([A-Z][a-z])/g, '$1 $2')
                          .split(/\s+/)
                          .filter(word => word.length > 0);
            }
            
            // 转换函数
            function convertText(text, type) {
                if (!text.trim()) return '';
                
                const words = splitWords(text);
                
                switch(type) {
                    case 'lower':
                        return text.toLowerCase();
                    case 'upper':
                        return text.toUpperCase();
                    case 'camel':
                        return words.map((word, i) => 
                            i === 0 ? word.toLowerCase() : 
                            word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()
                        ).join('');
                    case 'pascal':
                        return words.map(word => 
                            word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()
                        ).join('');
                    case 'snake':
                        return words.map(word => word.toLowerCase()).join('_');
                    case 'kebab':
                        return words.map(word => word.toLowerCase()).join('-');
                    case 'title':
                        return words.map(word => 
                            word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()
                        ).join(' ');
                    default:
                        return text;
                }
            }
            
            // 转换所有格式并显示
            function convertAll() {
                const text = inputText.value;
                if (!text.trim()) {
                    resultBox.textContent = '请输入文本...';
                    allResultsBox.textContent = '';
                    return;
                }
                
                const types = {
                    '原文本': text,
                    '小写': convertText(text, 'lower'),
                    '大写': convertText(text, 'upper'),
                    '驼峰命名': convertText(text, 'camel'),
                    '帕斯卡命名': convertText(text, 'pascal'),
                    '蛇形命名': convertText(text, 'snake'),
                    '烤肉串命名': convertText(text, 'kebab'),
                    '标题命名': convertText(text, 'title')
                };
                
                // 显示所有格式
                let allResults = '';
                for (const [name, value] of Object.entries(types)) {
                    allResults += `${name}:\n${value}\n\n`;
                }
                allResultsBox.textContent = allResults;
                
                // 默认显示驼峰命名
                resultBox.textContent = types['驼峰命名'];
            }
            
            // 单个转换
            function convertSingle(type) {
                const text = inputText.value;
                if (!text.trim()) {
                    resultBox.textContent = '请输入文本...';
                    return;
                }
                
                resultBox.textContent = convertText(text, type);
            }
            
            // 显示通知
            function showNotification(message) {
                notification.textContent = message;
                notification.classList.add('show');
                
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 2000);
            }
            
            // 事件监听
            convertBtn.addEventListener('click', convertAll);
            resetBtn.addEventListener('click', () => {
                inputText.value = '';
                resultBox.textContent = '';
                allResultsBox.textContent = '';
            });
            
            typeButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    convertSingle(btn.dataset.type);
                });
            });
            
            copyBtn.addEventListener('click', () => {
                if (!resultBox.textContent.trim()) return;
                
                navigator.clipboard.writeText(resultBox.textContent)
                    .then(() => {
                        showNotification('已复制到剪贴板！');
                    })
                    .catch(err => {
                        showNotification('复制失败，请重试');
                        console.error('复制失败:', err);
                    });
            });
            
            // 初始转换
            convertAll();
        });
    </script>
</body>
</html>
