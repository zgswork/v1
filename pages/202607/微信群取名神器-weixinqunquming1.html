                "垃圾回收群", "水电费节约", "闹钟大战群", "宿舍书屋", "复习重点群",
                "洗衣预约群", "代课推荐群", "深夜食堂2.0", "宿舍棋牌室", "考试经验群",
                "泡面怀旧群", "点名应对群", "熬夜突破群", "宿舍诊所", "作业答案2.0",
                "垃圾分类2.0", "水电费调整", "闹钟无效2.0", "宿舍实验室", "复习计划群",
                "洗衣心得群", "代课警告群", "深夜饿魔3.0", "宿舍游戏厅", "考试技巧群",
                "泡面终极群", "点名终极群", "熬夜终极群", "宿舍终极群", "作业终极群"
            ]
        };

        // 获取DOM元素
        const groupTypeSelect = document.getElementById('group-type');
        const generateBtn = document.getElementById('generate-btn');
        const downloadBtn = document.getElementById('download-btn');
        const resultsDiv = document.getElementById('results');
        const modal = document.getElementById('download-modal');
        const closeBtn = document.querySelector('.close');
        const copyBtn = document.getElementById('copy-btn');
        const downloadLink = document.getElementById('download-link');

        // 当前显示的群名索引
        let currentIndices = {
            work: [],
            family: [],
            girls: [],
            game: [],
            dorm: []
        };

        // 生成随机不重复的5个索引
        function getRandomIndices(type) {
            const names = groupNames[type];
            const indices = [];
            
            // 如果已经显示了大部分名字，重置索引
            if (currentIndices[type].length >= names.length - 5) {
                currentIndices[type] = [];
            }
            
            // 生成5个不重复的随机索引
            while (indices.length < 5) {
                const randomIndex = Math.floor(Math.random() * names.length);
                if (!currentIndices[type].includes(randomIndex) && !indices.includes(randomIndex)) {
                    indices.push(randomIndex);
                    currentIndices[type].push(randomIndex);
                }
            }
            
            return indices;
        }

        // 生成群名并显示
        function generateGroupNames() {
            const selectedType = groupTypeSelect.value;
            const indices = getRandomIndices(selectedType);
            const names = groupNames[selectedType];
            
            // 清空结果区域
            resultsDiv.innerHTML = '';
            
            // 添加新的群名
            indices.forEach(index => {
                const nameItem = document.createElement('div');
                nameItem.className = 'result-item';
                nameItem.textContent = names[index];
                resultsDiv.appendChild(nameItem);
            });
            
            // 更改按钮文本
            generateBtn.textContent = '换5个微信群名';
        }

        // 显示下载弹窗
        function showDownloadModal() {
            modal.style.display = 'block';
        }

        // 关闭弹窗
        function closeModal() {
            modal.style.display = 'none';
        }

        // 复制链接
        function copyLink() {
            const range = document.createRange();
            range.selectNode(downloadLink);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            document.execCommand('copy');
            window.getSelection().removeAllRanges();
            
            // 更改按钮文本
            copyBtn.textContent = '已复制';
            setTimeout(() => {
                copyBtn.textContent = '复制链接';
            }, 2000);
        }

        // 添加事件监听
        generateBtn.addEventListener('click', generateGroupNames);
        downloadBtn.addEventListener('click', showDownloadModal);
        closeBtn.addEventListener('click', closeModal);
        copyBtn.addEventListener('click', copyLink);

        // 点击弹窗外部关闭弹窗
        window.addEventListener('click', (event) => {
            if (event.target === modal) {
                closeModal();
            }
        });
    </script>
</body>
</html>
