            // 计算生命数字
            function calculateLifeNumber(birthday) {
                let sum = 0;
                
                // 将生日数字相加
                for (let i = 0; i < birthday.length; i++) {
                    sum += parseInt(birthday.charAt(i));
                }
                
                // 如果总和是11、22或33，直接返回（大师数字）
                if (sum === 11 || sum === 22 || sum === 33) {
                    return sum;
                }
                
                // 否则继续相加直到得到个位数
                while (sum > 9) {
                    let tempSum = 0;
                    const sumStr = sum.toString();
                    
                    for (let i = 0; i < sumStr.length; i++) {
                        tempSum += parseInt(sumStr.charAt(i));
                    }
                    
                    sum = tempSum;
                    
                    // 再次检查是否成为大师数字
                    if (sum === 11 || sum === 22 || sum === 33) {
                        return sum;
                    }
                }
                
                return sum;
            }
            
            // 验证生日输入
            function validateBirthday(input) {
                // 检查是否为8位数字
                const regex = /^\d{8}$/;
                if (!regex.test(input)) {
                    return false;
                }
                
                // 简单验证日期合理性
                const year = parseInt(input.substring(0, 4));
                const month = parseInt(input.substring(4, 6));
                const day = parseInt(input.substring(6, 8));
                
                // 检查年份范围（1900-当前年份）
                const currentYear = new Date().getFullYear();
                if (year < 1900 || year > currentYear) {
                    return false;
                }
                
                // 检查月份
                if (month < 1 || month > 12) {
                    return false;
                }
                
                // 检查日期
                if (day < 1 || day > 31) {
                    return false;
                }
                
                return true;
            }
            
            // 解析按钮点击事件
            analyzeBtn.addEventListener('click', function() {
                const birthday = birthdayInput.value.trim();
                
                if (!validateBirthday(birthday)) {
                    errorMsg.style.display = 'block';
                    return;
                }
                
                errorMsg.style.display = 'none';
                
                // 计算生命数字
                const lifeNumber = calculateLifeNumber(birthday);
                
                // 显示结果
                displayResult(lifeNumber);
            });

            function displayResult(lifeNumber) {

                relationships.textContent = interpretation.relationships;
                
                // 滚动到结果区域

            }
