<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 转图片工具</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* --- 1. UI 样式层 (暖色系/正能量风格) --- */
        :root {
            --primary: #f59e0b;       /* 活力橙 */
            --primary-dark: #ea580c;  /* 深橙色 */
            --bg-body: #fff7ed;       /* 暖白背景 */
            --bg-sidebar: #ffffff;
            --border: #fed7aa;
            --text-main: #451a03;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif;
            margin: 0;
            background: var(--bg-body);
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text-main);
            overflow: hidden;
        }

        /* 顶部栏 */
        header {
            height: 50px;
            background: #fff;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-weight: 700;
            font-size: 16px;
            justify-content: space-between;
            box-shadow: 0 2px 4px rgba(249, 115, 22, 0.05);
        }
        .tag {
            background: #ffedd5;
            color: #c2410c;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 8px;
            font-weight: normal;
        }

        /* 布局结构 */
        .layout { display: flex; flex: 1; overflow: hidden; }

        /* 左侧操作区 */
        .sidebar {
            width: 400px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px;
            z-index: 20;
            box-shadow: 4px 0 10px rgba(0,0,0,0.02);
            overflow-y: auto;
        }

        .group { margin-bottom: 20px; }
        .label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #9a3412; }
        
        /* 输入框行 */
        .row { display: flex; gap: 10px; }
        .col { flex: 1; }
        input {
            width: 100%; padding: 10px; border: 1px solid #fdba74; border-radius: 6px;
            box-sizing: border-box; background: #fffaf5; outline: none; transition: 0.2s;
        }
        input:focus { border-color: var(--primary); background: #fff; }

        /* 代码编辑器 (暗色 IDE 风格) */
        textarea {
            width: 100%; height: 260px;
            background: #27272a; color: #fbbf24;
            border: 1px solid #52525b; border-radius: 6px;
            padding: 12px; font-family: 'Consolas', monospace; font-size: 12px;
            line-height: 1.5; resize: vertical; box-sizing: border-box;
        }
        textarea:focus { outline: 1px solid var(--primary); }

        /* 按钮 */
        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 6px;
            font-weight: 600; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .btn-preview { background: #fff7ed; color: #ea580c; border: 1px solid #fdba74; margin-bottom: 10px; }
        .btn-preview:hover { background: #ffedd5; }
        .btn-down {
            background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
            color: white;
            box-shadow: 0 4px 10px rgba(234, 88, 12, 0.2);
        }
        .btn-down:hover { transform: translateY(-1px); box-shadow: 0 6px 15px rgba(234, 88, 12, 0.3); }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        /* 底部 */
        .footer { margin-top: auto; padding-top: 15px; border-top: 1px dashed #fed7aa; font-size: 12px; text-align: center; color: #9a3412; }

        /* 右侧预览区 */
        .stage {
            flex: 1;
            background: #f1f5f9;
            /* 点阵背景 */
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
            padding: 40px;
            overflow: auto; /* 允许滚动 */
            display: flex; align-items: flex-start; justify-content: center;
        }

        /* 预览盒子 */
        #preview-box {
            background: white;
            min-height: 200px;
            /* 关键：预览时最大宽度设为 100%，防止撑爆屏幕，但这会导致挤压。
               不过没关系，因为下载时我们用的是另一套逻辑。 */
            max-width: 100%; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: width 0.3s;
        }
    </style>
</head>
<body>

<header>
    <div>HTML 转图片工具 <span class="tag">离屏渲染修复版</span></div>
</header>

<div class="layout">
    <aside class="sidebar">
        <div class="group">
            <div class="row">
                <div class="col">
                    <label class="label">宽度 (px)</label>
                    <input type="number" id="cfg-w" value="750" placeholder="750">
                </div>
                <div class="col">
                    <label class="label">高度 (px)</label>
                    <input type="number" id="cfg-h" placeholder="自动">
                </div>
            </div>
        </div>

        <div class="group">
            <label class="label">HTML 代码</label>
            <textarea id="code-source" spellcheck="false"></textarea>
        </div>

        <button class="btn btn-preview" onclick="updatePreview()">👁️ 刷新预览</button>
        <button class="btn btn-down" onclick="downloadImage()">📸 生成并下载</button>

        <div class="footer">
            Designed by 小勇同学<br>
            微信：751825267
        </div>
    </aside>

    <main class="stage">
        <div id="preview-box"></div>
    </main>
</div>

<script>
    // --- 预置代码：正能量日签 (样式兼容性强) ---
    const defaultCode = `<style>
    /* 容器：暖色晨曦渐变 */
    .day-card-container {
        width: 100%;
        min-height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        /* 充满活力的渐变色 */
        background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
        padding: 60px 40px;
        box-sizing: border-box;
        font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }

    /* 卡片主体 */
    .card {
        background: rgba(255, 255, 255, 0.95);
        width: 100%;
        max-width: 600px; /* 限制卡片最大宽，好看点 */
        padding: 50px 40px;
        border-radius: 24px;
        box-shadow: 0 25px 50px rgba(253, 160, 133, 0.3);
        text-align: center;
        position: relative;
        overflow: hidden;
    }

    /* 装饰元素：右上角的圆 */
    .circle-deco {
        position: absolute;
        top: -50px;
        right: -50px;
        width: 150px;
        height: 150px;
        background: #ffecd2;
        border-radius: 50%;
        opacity: 0.5;
    }

    /* 日期标签 */
    .date-tag {
        display: inline-block;
        background: #fff0e6;
        color: #e65100;
        font-size: 14px;
        font-weight: bold;
        padding: 6px 16px;
        border-radius: 20px;
        margin-bottom: 30px;
        letter-spacing: 1px;
    }

    /* 标题 */
    .title {
        font-size: 32px;
        color: #333;
        font-weight: 800;
        margin-bottom: 20px;
        line-height: 1.2;
    }

    /* 正文 */
    .quote {
        font-size: 18px;
        color: #555;
        line-height: 1.8;
        margin-bottom: 40px;
        text-align: justify; /* 两端对齐更整齐 */
        border-left: 4px solid #fda085;
        padding-left: 20px;
        background: #fafafa;
        padding: 20px;
        border-radius: 0 8px 8px 0;
    }

    /* 底部按钮风格 */
    .footer-btn {
        display: inline-block;
        background: linear-gradient(to right, #ff9966, #ff5e62);
        color: white;
        padding: 12px 35px;
        border-radius: 50px;
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 2px;
        box-shadow: 0 10px 20px rgba(255, 94, 98, 0.3);
    }
    
    .author {
        margin-top: 20px;
        font-size: 12px;
        color: #999;
    }
</style>

<div class="day-card-container">
    <div class="card">
        <div class="circle-deco"></div>
        
        <div class="date-tag">✨ DAILY INSPIRATION</div>
        
        <div class="title">
            保持热爱<br>奔赴山海
        </div>
        
        <div class="quote">
            “生活原本沉闷，但跑起来就有风。<br>
            不要因为一时的迷茫而停滞不前，<br>
            你所坚持的，终将美好。”
        </div>
        
        <div class="footer-btn">KEEP GOING</div>
        
        <div class="author">
            @小勇同学 · 正能量日签
        </div>
    </div>
</div>`;

    const editor = document.getElementById('code-source');
    const previewBox = document.getElementById('preview-box');
    const inputW = document.getElementById('cfg-w');
    const inputH = document.getElementById('cfg-h');

    window.onload = () => {
        editor.value = defaultCode;
        updatePreview();
    };

    // 1. 普通预览 (仅供屏幕查看，哪怕被挤压也没关系)
    function updatePreview() {
        const w = inputW.value;
        const h = inputH.value;
        previewBox.style.width = w ? w + 'px' : 'auto';
        previewBox.style.height = h ? h + 'px' : 'auto';
        
        let code = editor.value;
        // 简单兼容：把body样式替换为容器样式
        code = code.replace(/body\s*\{/gi, '.poster-wrap {'); 
        previewBox.innerHTML = code;
    }

    // 2. 核心：离屏渲染下载 (彻底解决宽度不一致问题)
    function downloadImage() {
        const btn = document.querySelector('.btn-down');
        const oldText = btn.innerHTML;
        btn.innerHTML = '⚡ 处理中...';
        btn.disabled = true;

        const targetWidth = inputW.value ? parseFloat(inputW.value) : 750;
        const targetHeight = inputH.value ? parseFloat(inputH.value) : null;

        // --- Step A: 创建一个完全独立的 Ghost 容器 ---
        const ghost = document.createElement('div');
        ghost.id = 'ghost-container';
        // 关键1: 移到屏幕外，用户看不见
        ghost.style.position = 'fixed';
        ghost.style.left = '-9999px';
        ghost.style.top = '0';
        // 关键2: 强制宽度！这一步保证了无论屏幕多小，容器都是 750px
        ghost.style.width = targetWidth + 'px'; 
        ghost.style.zIndex = '-1';

        // 高度处理
        if (targetHeight) {
            ghost.style.height = targetHeight + 'px';
            ghost.style.overflow = 'hidden';
        } else {
            ghost.style.height = 'auto';
        }

        // --- Step B: 注入代码并进行样式隔离 ---
        let rawCode = editor.value;
        // 为了防止 CSS 里的 body 选择器失效，我们在最外层包一个 div
        // 并把 CSS 里的 body { ... } 替换为 #ghost-wrapper { ... }
        const wrapperDiv = `<div id="ghost-wrapper" style="width:100%; height:100%; box-sizing:border-box; overflow:hidden;">${rawCode}</div>`;
        ghost.innerHTML = wrapperDiv;

        document.body.appendChild(ghost);

        // 替换 style 标签中的 body 为 #ghost-wrapper，确保背景色能加上
        const styleTags = ghost.querySelectorAll('style');
        styleTags.forEach(style => {
            style.innerHTML = style.innerHTML.replace(/body/gi, '#ghost-wrapper');
        });

        // --- Step C: html2canvas 截图 ---
        const options = {
            scale: 2, // 2倍清晰度
            useCORS: true,
            width: targetWidth,     // 告诉插件：画布就这么宽
            windowWidth: targetWidth, // 关键3: 告诉插件：假装浏览器窗口也有这么宽！
            backgroundColor: null
        };

        if (!targetHeight) {
            options.height = ghost.scrollHeight;
            options.windowHeight = ghost.scrollHeight;
        } else {
            options.height = targetHeight;
        }

        html2canvas(ghost, options).then(canvas => {
            const link = document.createElement('a');
            link.download = `IMG-${targetWidth}px-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            // 清理现场
            document.body.removeChild(ghost);
            btn.innerHTML = oldText;
            btn.disabled = false;
        }).catch(err => {
            console.error(err);
            alert('生成出错，请重试');
            document.body.removeChild(ghost);
            btn.innerHTML = oldText;
            btn.disabled = false;
        });
    }
</script>
</body>
</html>
