<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本格式化工具</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.2rem;
        }
        
        .description {
            color: #7f8c8d;
            font-size: 1.1rem;
        }
        
        .main-content {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .input-section, .output-section {
            flex: 1;
            min-width: 300px;
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        
        h2 {
            color: #2c3e50;
            font-size: 1.5rem;
        }
        
        .options {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .option-group {
            display: flex;
            align-items: center;
        }
        
        .option-group label {
            margin-left: 8px;
            font-size: 0.9rem;
            color: #555;
        }
        
        textarea {
            width: 100%;
            min-height: 250px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            resize: vertical;
            transition: border 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .format-btn {
            background: #3498db;
            color: white;
            flex: 2;
        }
        
        .format-btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }
        
        .clear-btn {
            background: #e74c3c;
            color: white;
            flex: 1;
        }
        
        .clear-btn:hover {
            background: #c0392b;
        }
        
        .copy-btn {
            background: #2ecc71;
            color: white;
            flex: 1;
        }
        
        .copy-btn:hover {
            background: #27ae60;
        }
        
        .output-text {
            min-height: 250px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f8f9fa;
            white-space: pre-wrap;
            overflow-y: auto;
            font-size: 1rem;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .options {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>文本格式化工具</h1>
            <p class="description">一键格式化文本，自动识别换行符，提升文本可读性</p>
        </header>
        
        <div class="main-content">
            <div class="input-section">
                <div class="section-title">
                    <h2>输入文本</h2>
                </div>
                
                <div class="options">
                    <div class="option-group">
                        <input type="checkbox" id="auto-linebreak" checked>
                        <label for="auto-linebreak">自动识别换行符</label>
                    </div>
                    <div class="option-group">
                        <input type="checkbox" id="trim-spaces" checked>
                        <label for="trim-spaces">去除多余空格</label>
                    </div>
                    <div class="option-group">
                        <input type="checkbox" id="process-escape" checked>
                        <label for="process-escape">处理转义字符</label>
                    </div>
                    <div class="option-group">
                        <input type="checkbox" id="remove-empty-lines">
                        <label for="remove-empty-lines">删除空行</label>
                    </div>
                </div>
                
                <textarea id="input-text" placeholder="请输入需要格式化的文本..."></textarea>
                
                <div class="button-group">
                    <button class="format-btn" id="format-btn">格式化文本</button>
                    <button class="clear-btn" id="clear-btn">清空</button>
                </div>
            </div>
            
            <div class="output-section">
                <div class="section-title">
                    <h2>格式化结果</h2>
                </div>
                
                <div class="output-text" id="output-text">格式化后的文本将显示在这里...</div>
                
                <div class="button-group">
                    <button class="copy-btn" id="copy-btn">复制结果</button>
                </div>
            </div>
        </div>
        
        
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const inputText = document.getElementById('input-text');
            const outputText = document.getElementById('output-text');
            const formatBtn = document.getElementById('format-btn');
            const clearBtn = document.getElementById('clear-btn');
            const copyBtn = document.getElementById('copy-btn');
            
            // 格式化文本函数
            function formatText() {
                let text = inputText.value;
                
                // 获取选项状态
                const autoLinebreak = document.getElementById('auto-linebreak').checked;
                const trimSpaces = document.getElementById('trim-spaces').checked;
                const processEscape = document.getElementById('process-escape').checked;
                const removeEmptyLines = document.getElementById('remove-empty-lines').checked;
                
                // 处理转义字符（如\n）
                if (processEscape) {
                    // 将转义的换行符转换为实际换行符
                    text = text.replace(/\\n/g, '\n');
                    text = text.replace(/\\t/g, '\t');
                    text = text.replace(/\\r/g, '\r');
                }
                
                // 自动识别换行符
                if (autoLinebreak) {
                    // 处理不同平台的换行符，统一为\n
                    text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
                }
                
                // 去除多余空格
                if (trimSpaces) {
                    // 去除行首行尾空格
                    text = text.replace(/^[ \t]+/gm, '').replace(/[ \t]+$/gm, '');
                    // 多个连续空格替换为一个空格
                    text = text.replace(/[ ]{2,}/g, ' ');
                }
                
                // 删除空行
                if (removeEmptyLines) {
                    text = text.replace(/^\s*[\r\n]/gm, '');
                }
                
                // 更新输出区域
                outputText.textContent = text;
            }
            
            // 清空输入
            function clearInput() {
                inputText.value = '';
                outputText.textContent = '格式化后的文本将显示在这里...';
            }
            
            // 复制结果
            function copyResult() {
                const textToCopy = outputText.textContent;
                
                // 使用现代剪贴板API
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(textToCopy)
                        .then(() => {
                            // 显示成功提示
                            const originalText = copyBtn.textContent;
                            copyBtn.textContent = '已复制!';
                            setTimeout(() => {
                                copyBtn.textContent = originalText;
                            }, 2000);
                        })
                        .catch(err => {
                            console.error('复制失败: ', err);
                            fallbackCopy(textToCopy);
                        });
                } else {
                    fallbackCopy(textToCopy);
                }
            }
            
            // 兼容旧浏览器的复制方法
            function fallbackCopy(text) {
                const textArea = document.createElement('textarea');
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                
                try {
                    document.execCommand('copy');
                    const originalText = copyBtn.textContent;
                    copyBtn.textContent = '已复制!';
                    setTimeout(() => {
                        copyBtn.textContent = originalText;
                    }, 2000);
                } catch (err) {
                    console.error('复制失败: ', err);
                    alert('复制失败，请手动选择文本并复制');
                }
                
                document.body.removeChild(textArea);
            }
            
            // 事件监听
            formatBtn.addEventListener('click', formatText);
            clearBtn.addEventListener('click', clearInput);
            copyBtn.addEventListener('click', copyResult);
            
            // 示例文本 - 包含您提到的样例
            //inputText.value = `"""帮我生成一个会议纪要生成器（模板化），名称叫"会议纪要智能生成器"\\n1、简约、现代风格\\n2、提供多种会议模板选择，包括项目复盘、周会、评审会、月会、季度会等，每种模板有对应的示例展示\\n3、设置多个关键信息输入区域，分别用于填写议题、结论、责任人、截止日、参与人员、重要行动事项等\\n4、当用户选好会议模板并填好关键信息后，点击"生成纪要"按钮，系统会根据所选模板和填写信息自动生成格式统一、条理清晰的纪要文本\\n5、生成的纪要文本支持在线预览，用户可对文本进行简单编辑修改，修改后可重新保存生成新的纪要\\n6、页面自适应大小，可在电脑上和手机上使用\\n7、所有内容放在一个 HTML 文件里\\n8、生成好先自测一下，运行如果有问题的话把有问题的位置解决好，最后需要你给出的是直接可用的成果"""`;
        });
    </script>
</body>
</html>
