<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务追踪器 | 文璧</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .task-item {
      transition: all 0.3s ease;
    }
    .task-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .priority-high { border-left: 4px solid #ef4444; }
    .priority-medium { border-left: 4px solid #f59e0b; }
    .priority-low { border-left: 4px solid #10b981; }
    [contenteditable="true"]:empty:before {
      content: attr(placeholder);
      color: #9ca3af;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="container mx-auto px-4 py-8 max-w-4xl">
    <!-- 头部 -->
    <header class="mb-8">
      <h1 class="text-3xl font-bold text-gray-800 mb-2">任务追踪器</h1>
      <p class="text-gray-600">高效管理您的每日任务</p>
    </header>

    <!-- 添加任务表单 -->
    <div class="bg-white rounded-xl shadow-md overflow-hidden mb-8">
      <div class="p-6">
        <h2 class="text-xl font-semibold text-gray-800 mb-4">添加新任务</h2>
        <div class="flex flex-col space-y-4">
          <div>
            <input type="text" id="taskTitle" placeholder="任务标题" 
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
          </div>
          <div>
            <textarea id="taskDescription" placeholder="任务描述 (可选)" rows="2"
                      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label for="taskDueDate" class="block text-sm font-medium text-gray-700 mb-1">截止日期</label>
              <input type="date" id="taskDueDate"
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
              <label for="taskPriority" class="block text-sm font-medium text-gray-700 mb-1">优先级</label>
              <select id="taskPriority" 
                      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                <option value="low">低</option>
                <option value="medium" selected>中</option>
                <option value="high">高</option>
              </select>
            </div>
            <div>
              <label for="taskCategory" class="block text-sm font-medium text-gray-700 mb-1">类别</label>
              <input type="text" id="taskCategory" placeholder="工作/学习/个人" list="categories"
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
              <datalist id="categories">
                <option value="工作">
                <option value="学习">
                <option value="个人">
                <option value="家庭">
                <option value="健康">
              </datalist>
            </div>
          </div>
          <div class="flex justify-end">
            <button id="addTaskBtn" 
                    class="px-6 py-2 bg-blue-500 text-white font-medium rounded-lg hover:bg-blue-600 transition flex items-center">
              <i class="fas fa-plus mr-2"></i> 添加任务
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 任务过滤 -->
    <div class="bg-white rounded-xl shadow-md overflow-hidden mb-8">
      <div class="p-4 flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center space-x-2">
          <span class="text-sm font-medium text-gray-700">筛选:</span>
          <select id="filterPriority" 
                  class="px-3 py-1 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
            <option value="all">所有优先级</option>
            <option value="high">高</option>
            <option value="medium">中</option>
            <option value="low">低</option>
          </select>
          <select id="filterStatus" 
                  class="px-3 py-1 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
            <option value="all">所有状态</option>
            <option value="pending">待完成</option>
            <option value="completed">已完成</option>
          </select>
          <input type="text" id="filterCategory" placeholder="按类别筛选" list="categories"
                 class="px-3 py-1 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
        </div>
        <div class="flex items-center space-x-2">
          <span class="text-sm font-medium text-gray-700">排序:</span>
          <select id="sortTasks" 
                  class="px-3 py-1 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
            <option value="dueDate-asc">截止日期 (早→晚)</option>
            <option value="dueDate-desc">截止日期 (晚→早)</option>
            <option value="priority-desc">优先级 (高→低)</option>
            <option value="priority-asc">优先级 (低→高)</option>
            <option value="createdAt-desc">最近添加</option>
            <option value="createdAt-asc">最早添加</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 任务统计 -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
      <div class="bg-white rounded-xl shadow-md p-4">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-sm font-medium text-gray-500">总任务数</p>
            <p id="totalTasks" class="text-2xl font-bold text-gray-800">0</p>
          </div>
          <div class="p-3 rounded-full bg-blue-100 text-blue-600">
            <i class="fas fa-tasks text-xl"></i>
          </div>
        </div>
      </div>
      <div class="bg-white rounded-xl shadow-md p-4">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-sm font-medium text-gray-500">待完成</p>
            <p id="pendingTasks" class="text-2xl font-bold text-gray-800">0</p>
          </div>
          <div class="p-3 rounded-full bg-yellow-100 text-yellow-600">
            <i class="fas fa-clock text-xl"></i>
          </div>
        </div>
      </div>
      <div class="bg-white rounded-xl shadow-md p-4">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-sm font-medium text-gray-500">已完成</p>
            <p id="completedTasks" class="text-2xl font-bold text-gray-800">0</p>
          </div>
          <div class="p-3 rounded-full bg-green-100 text-green-600">
            <i class="fas fa-check-circle text-xl"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- 任务列表 -->
    <div class="bg-white rounded-xl shadow-md overflow-hidden mb-8">
      <div class="p-6">
        <h2 class="text-xl font-semibold text-gray-800 mb-4">我的任务</h2>
        <div id="taskList" class="space-y-3">
          <!-- 任务将通过JavaScript动态添加到这里 -->
          <div class="text-center py-10 text-gray-400">
            <i class="fas fa-clipboard-list text-4xl mb-3"></i>
            <p>暂无任务，添加您的第一个任务吧！</p>
          </div>
        </div>
      </div>
    </div>

    <!-- 页脚 -->
    <footer class="text-center text-sm text-gray-500 mt-12">
      <p>© 2023 任务追踪器 | 作者：文璧 | 联系邮箱：<a href="/cdn-cgi/l/email-protection#ecdedadbd9dbd8ddd5dbd9ac9d9dc28f8381" class="text-blue-500 hover:underline"><span class="__cf_email__" data-cfemail="cbf9fdfcfefcfffaf2fcfe8bbabae5a8a4a6">[email&#160;protected]</span></a></p>
    </footer>
  </div>

  <!-- 任务详情模态框 -->
  <div id="taskModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
      <div class="p-6">
        <div class="flex justify-between items-start mb-4">
          <h3 id="modalTaskTitle" class="text-2xl font-bold text-gray-800"></h3>
          <button id="closeModalBtn" class="text-gray-400 hover:text-gray-600">
            <i class="fas fa-times text-xl"></i>
          </button>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
          <div>
            <h4 class="text-sm font-medium text-gray-500 mb-2">任务详情</h4>
            <div id="modalTaskDescription" contenteditable="true" placeholder="点击添加描述..."
                 class="min-h-20 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></div>
          </div>
          
          <div class="space-y-4">
            <div>
              <h4 class="text-sm font-medium text-gray-500 mb-2">截止日期</h4>
              <input id="modalTaskDueDate" type="date" 
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            
            <div>
              <h4 class="text-sm font-medium text-gray-500 mb-2">优先级</h4>
              <select id="modalTaskPriority" 
                      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                <option value="high">高</option>
                <option value="medium">中</option>
                <option value="low">低</option>
              </select>
            </div>
            
            <div>
              <h4 class="text-sm font-medium text-gray-500 mb-2">类别</h4>
              <input id="modalTaskCategory" type="text" list="categories"
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
          </div>
        </div>
        
        <div class="flex justify-between items-center pt-4 border-t border-gray-200">
          <div class="text-sm text-gray-500">
            创建于: <span id="modalTaskCreatedAt"></span>
          </div>
          <div class="flex space-x-3">
            <button id="deleteTaskBtn" class="px-4 py-2 bg-red-100 text-red-600 rounded-lg hover:bg-red-200 transition">
              <i class="fas fa-trash-alt mr-2"></i>删除
            </button>
            <button id="saveTaskBtn" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition">
              <i class="fas fa-save mr-2"></i>保存更改
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
    // 任务管理应用
    document.addEventListener('DOMContentLoaded', function() {
      // DOM元素
      const taskTitle = document.getElementById('taskTitle');
      const taskDescription = document.getElementById('taskDescription');
      const taskDueDate = document.getElementById('taskDueDate');
      const taskPriority = document.getElementById('taskPriority');
      const taskCategory = document.getElementById('taskCategory');
      const addTaskBtn = document.getElementById('addTaskBtn');
      const taskList = document.getElementById('taskList');
      const filterPriority = document.getElementById('filterPriority');
      const filterStatus = document.getElementById('filterStatus');
      const filterCategory = document.getElementById('filterCategory');
      const sortTasks = document.getElementById('sortTasks');
      const totalTasks = document.getElementById('totalTasks');
      const pendingTasks = document.getElementById('pendingTasks');
      const completedTasks = document.getElementById('completedTasks');
      const taskModal = document.getElementById('taskModal');
      const closeModalBtn = document.getElementById('closeModalBtn');
      const modalTaskTitle = document.getElementById('modalTaskTitle');
      const modalTaskDescription = document.getElementById('modalTaskDescription');
      const modalTaskDueDate = document.getElementById('modalTaskDueDate');
      const modalTaskPriority = document.getElementById('modalTaskPriority');
      const modalTaskCategory = document.getElementById('modalTaskCategory');
      const modalTaskCreatedAt = document.getElementById('modalTaskCreatedAt');
      const saveTaskBtn = document.getElementById('saveTaskBtn');
      const deleteTaskBtn = document.getElementById('deleteTaskBtn');

      // 设置默认日期为今天
      const today = new Date().toISOString().split('T')[0];
      taskDueDate.value = today;
      modalTaskDueDate.value = today;

      // 任务数组
      let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
      let currentTaskId = null;

      // 初始化应用
      function init() {
        renderTasks();
        updateStats();
      }

      // 添加任务
      addTaskBtn.addEventListener('click', function() {
        const title = taskTitle.value.trim();
        if (!title) {
          alert('请输入任务标题');
          return;
        }

        const newTask = {
          id: Date.now().toString(),
          title: title,
          description: taskDescription.value.trim(),
          dueDate: taskDueDate.value,
          priority: taskPriority.value,
          category: taskCategory.value.trim() || '未分类',
          status: 'pending',
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };

        tasks.push(newTask);
        saveTasks();
        renderTasks();
        updateStats();
        resetForm();
      });

      // 渲染任务列表
      function renderTasks() {
        // 应用过滤和排序
        let filteredTasks = [...tasks];
        
        // 按优先级过滤
        if (filterPriority.value !== 'all') {
          filteredTasks = filteredTasks.filter(task => task.priority === filterPriority.value);
        }
        
        // 按状态过滤
        if (filterStatus.value !== 'all') {
          filteredTasks = filteredTasks.filter(task => task.status === filterStatus.value);
        }
        
        // 按类别过滤
        if (filterCategory.value) {
          filteredTasks = filteredTasks.filter(task => 
            task.category.toLowerCase().includes(filterCategory.value.toLowerCase())
          );
        }
        
        // 排序
        const [sortBy, sortOrder] = sortTasks.value.split('-');
        filteredTasks.sort((a, b) => {
          if (sortBy === 'dueDate') {
            return sortOrder === 'asc' 
              ? new Date(a.dueDate) - new Date(b.dueDate)
              : new Date(b.dueDate) - new Date(a.dueDate);
          } else if (sortBy === 'priority') {
            const priorityOrder = { high: 3, medium: 2, low: 1 };
            return sortOrder === 'desc'
              ? priorityOrder[b.priority] - priorityOrder[a.priority]
              : priorityOrder[a.priority] - priorityOrder[b.priority];
          } else if (sortBy === 'createdAt') {
            return sortOrder === 'desc'
              ? new Date(b.createdAt) - new Date(a.createdAt)
              : new Date(a.createdAt) - new Date(b.createdAt);
          }
          return 0;
        });

        // 清空任务列表
        taskList.innerHTML = '';

        // 如果没有任务，显示提示
        if (filteredTasks.length === 0) {
          taskList.innerHTML = `
            <div class="text-center py-10 text-gray-400">
              <i class="fas fa-search text-4xl mb-3"></i>
              <p>没有找到匹配的任务</p>
            </div>
          `;
          return;
        }

        // 渲染每个任务
        filteredTasks.forEach(task => {
          const taskElement = document.createElement('div');
          taskElement.className = `task-item bg-white border border-gray-200 rounded-lg p-4 ${task.status === 'completed' ? 'opacity-70' : ''} priority-${task.priority}`;
          
          // 任务优先级颜色
          let priorityColor = '';
          let priorityText = '';
          switch (task.priority) {
            case 'high':
              priorityColor = 'bg-red-100 text-red-800';
              priorityText = '高优先级';
              break;
            case 'medium':
              priorityColor = 'bg-yellow-100 text-yellow-800';
              priorityText = '中优先级';
              break;
            case 'low':
              priorityColor = 'bg-green-100 text-green-800';
              priorityText = '低优先级';
              break;
          }

          // 任务状态
          const statusText = task.status === 'completed' ? '已完成' : '待完成';
          const statusColor = task.status === 'completed' ? 'bg-green-100 text-green-800' : 'bg-blue-100 text-blue-800';

          // 格式化日期
          const dueDate = task.dueDate ? new Date(task.dueDate).toLocaleDateString() : '未设置';
          const today = new Date().toISOString().split('T')[0];
          const isOverdue = task.dueDate && task.dueDate < today && task.status !== 'completed';
          
          taskElement.innerHTML = `
            <div class="flex justify-between items-start mb-2">
              <div class="flex items-center space-x-3">
                <button class="task-status-toggle p-2 rounded-full ${task.status === 'completed' ? 'bg-green-100 text-green-600' : 'bg-gray-100 text-gray-600'} hover:bg-gray-200 transition"
                        data-id="${task.id}">
                  <i class="fas ${task.status === 'completed' ? 'fa-check-circle' : 'fa-circle'}"></i>
                </button>
                <h3 class="font-medium text-gray-800 ${task.status === 'completed' ? 'line-through' : ''}">${task.title}</h3>
              </div>
              <div class="flex space-x-2">
                <span class="text-xs px-2 py-1 rounded-full ${priorityColor}">${priorityText}</span>
                <span class="text-xs px-2 py-1 rounded-full ${statusColor}">${statusText}</span>
              </div>
            </div>
            
            ${task.description ? `<p class="text-gray-600 text-sm mb-3 ml-11 ${task.status === 'completed' ? 'line-through' : ''}">${task.description}</p>` : ''}
            
            <div class="flex flex-wrap justify-between items-center mt-4 text-sm">
              <div class="flex items-center space-x-4">
                <span class="text-gray-500"><i class="fas fa-calendar-day mr-1"></i> ${dueDate} ${isOverdue ? '<span class="text-red-500">(已过期)</span>' : ''}</span>
                <span class="text-gray-500"><i class="fas fa-tag mr-1"></i> ${task.category}</span>
              </div>
              <div class="flex space-x-2 mt-2 sm:mt-0">
                <button class="task-edit-btn px-3 py-1 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition text-sm"
                        data-id="${task.id}">
                  <i class="fas fa-edit mr-1"></i> 编辑
                </button>
                <button class="task-delete-btn px-3 py-1 bg-red-100 text-red-600 rounded-lg hover:bg-red-200 transition text-sm"
                        data-id="${task.id}">
                  <i class="fas fa-trash-alt mr-1"></i> 删除
                </button>
              </div>
            </div>
          `;
          
          taskList.appendChild(taskElement);
        });

        // 添加事件监听器
        document.querySelectorAll('.task-status-toggle').forEach(btn => {
          btn.addEventListener('click', function() {
            const taskId = this.getAttribute('data-id');
            toggleTaskStatus(taskId);
          });
        });

        document.querySelectorAll('.task-edit-btn').forEach(btn => {
          btn.addEventListener('click', function() {
            const taskId = this.getAttribute('data-id');
            openEditModal(taskId);
          });
        });

        document.querySelectorAll('.task-delete-btn').forEach(btn => {
          btn.addEventListener('click', function() {
            const taskId = this.getAttribute('data-id');
            deleteTask(taskId);
          });
        });
      }

      // 切换任务状态
      function toggleTaskStatus(taskId) {
        const taskIndex = tasks.findIndex(task => task.id === taskId);
        if (taskIndex !== -1) {
          tasks[taskIndex].status = tasks[taskIndex].status === 'completed' ? 'pending' : 'completed';
          tasks[taskIndex].updatedAt = new Date().toISOString();
          saveTasks();
          renderTasks();
          updateStats();
        }
      }

      // 打开编辑模态框
      function openEditModal(taskId) {
        const task = tasks.find(task => task.id === taskId);
        if (task) {
          currentTaskId = taskId;
          modalTaskTitle.textContent = task.title;
          modalTaskDescription.textContent = task.description;
          modalTaskDueDate.value = task.dueDate || '';
          modalTaskPriority.value = task.priority;
          modalTaskCategory.value = task.category;
          modalTaskCreatedAt.textContent = new Date(task.createdAt).toLocaleString();
          
          taskModal.classList.remove('hidden');
          document.body.style.overflow = 'hidden';
        }
      }

      // 关闭模态框
      function closeModal() {
        taskModal.classList.add('hidden');
        document.body.style.overflow = 'auto';
        currentTaskId = null;
      }

      // 保存任务更改
      saveTaskBtn.addEventListener('click', function() {
        if (!currentTaskId) return;
        
        const taskIndex = tasks.findIndex(task => task.id === currentTaskId);
        if (taskIndex !== -1) {
          tasks[taskIndex].title = modalTaskTitle.textContent;
          tasks[taskIndex].description = modalTaskDescription.textContent;
          tasks[taskIndex].dueDate = modalTaskDueDate.value;
          tasks[taskIndex].priority = modalTaskPriority.value;
          tasks[taskIndex].category = modalTaskCategory.value;
          tasks[taskIndex].updatedAt = new Date().toISOString();
          
          saveTasks();
          renderTasks();
          updateStats();
          closeModal();
        }
      });

      // 删除任务
      deleteTaskBtn.addEventListener('click', function() {
        if (!currentTaskId) return;
        
        if (confirm('确定要删除这个任务吗？')) {
          deleteTask(currentTaskId);
          closeModal();
        }
      });

      // 删除任务函数
      function deleteTask(taskId) {
        tasks = tasks.filter(task => task.id !== taskId);
        saveTasks();
        renderTasks();
        updateStats();
      }

      // 关闭模态框按钮
      closeModalBtn.addEventListener('click', closeModal);
      taskModal.addEventListener('click', function(e) {
        if (e.target === taskModal) {
          closeModal();
        }
      });

      // 保存任务到本地存储
      function saveTasks() {
        localStorage.setItem('tasks', JSON.stringify(tasks));
      }

      // 重置表单
      function resetForm() {
        taskTitle.value = '';
        taskDescription.value = '';
        taskDueDate.value = today;
        taskPriority.value = 'medium';
        taskCategory.value = '';
        taskTitle.focus();
      }

      // 更新统计信息
      function updateStats() {
        totalTasks.textContent = tasks.length;
        pendingTasks.textContent = tasks.filter(task => task.status === 'pending').length;
        completedTasks.textContent = tasks.filter(task => task.status === 'completed').length;
      }

      // 过滤和排序事件监听
      filterPriority.addEventListener('change', renderTasks);
      filterStatus.addEventListener('change', renderTasks);
      filterCategory.addEventListener('input', renderTasks);
      sortTasks.addEventListener('change', renderTasks);

      // 初始化应用
      init();
    });
  </script>
</body>
</html>
