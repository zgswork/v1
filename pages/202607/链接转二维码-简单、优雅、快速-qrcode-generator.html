<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>链接转二维码 - 简单、优雅、快速</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #fbfbfd;
            color: #1d1d1f;
            line-height: 1.47059;
            font-weight: 400;
            letter-spacing: -0.022em;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
            padding: 0 22px;
            width: 100%;
        }

        header {
            padding: 60px 0 40px;
            text-align: center;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: 56px;
            line-height: 1.07143;
            font-weight: 600;
            letter-spacing: -0.005em;
            margin-bottom: 6px;
            background: linear-gradient(90deg, #000000 0%, #333333 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 28px;
            line-height: 1.14286;
            font-weight: 400;
            letter-spacing: 0.007em;
            color: #6e6e73;
            margin-top: 12px;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
        }

        .card {
            background: #ffffff;
            border-radius: 18px;
            padding: 48px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 580px;
            animation: fadeInUp 0.8s ease-out;
            transition: box-shadow 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.08);
        }

        .input-group {
            margin-bottom: 32px;
        }

        label {
            display: block;
            font-size: 17px;
            font-weight: 500;
            margin-bottom: 12px;
            color: #1d1d1f;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 17px;
            border: 1.5px solid #d2d2d7;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
            background: #ffffff;
        }

        input[type="text"]:focus {
            border-color: #0071e3;
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1);
        }

        input[type="text"]::placeholder {
            color: #86868b;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
        }

        button {
            flex: 1;
            padding: 14px 24px;
            font-size: 17px;
            font-weight: 500;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            letter-spacing: -0.022em;
        }

        .primary-btn {
            background: #0071e3;
            color: #ffffff;
        }

        .primary-btn:hover {
            background: #0077ed;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(0, 113, 227, 0.3);
        }

        .primary-btn:active {
            transform: translateY(0);
        }

        .secondary-btn {
            background: #f5f5f7;
            color: #1d1d1f;
        }

        .secondary-btn:hover {
            background: #e8e8ed;
        }

        .secondary-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .qr-container {
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s ease;
            max-height: 0;
            overflow: hidden;
        }

        .qr-container.show {
            opacity: 1;
            max-height: 600px;
            animation: slideIn 0.5s ease-out;
        }

        #qrcode {
            display: inline-block;
            padding: 24px;
            background: #ffffff;
            border-radius: 18px;
            margin-bottom: 24px;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            background: #0071e3;
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            background: #0077ed;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(0, 113, 227, 0.3);
        }

        footer {
            text-align: center;
            padding: 40px 0;
            color: #86868b;
            font-size: 14px;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 40px;
            }

            .subtitle {
                font-size: 21px;
            }

            .card {
                padding: 32px 24px;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 32px;
            }

            .subtitle {
                font-size: 19px;
            }

            header {
                padding: 40px 0 30px;
            }
        }

        .error-message {
            color: #ff3b30;
            font-size: 14px;
            margin-top: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .error-message.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>链接转二维码</h1>
            <p class="subtitle">简单、优雅、快速分享你的链接</p>
        </header>

        <main>
            <div class="card">
                <div class="input-group">
                    <label for="urlInput">输入链接</label>
                    <input
                        type="text"
                        id="urlInput"
                        placeholder="https://example.com"
                        autocomplete="url"
                    >
                    <div class="error-message" id="errorMessage">请输入有效的网址</div>
                </div>

                <div class="button-group">
                    <button class="primary-btn" onclick="generateQRCode()">生成二维码</button>
                    <button class="secondary-btn" onclick="clearAll()" id="clearBtn" disabled>清除</button>
                </div>

                <div class="qr-container" id="qrContainer">
                    <div id="qrcode"></div>
                    <a href="#" class="download-btn" id="downloadBtn" download="qrcode.png">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M10 13L6 9L7.4 7.55L9 9.15V3H11V9.15L12.6 7.55L14 9L10 13ZM5 17C4.45 17 3.97917 16.8042 3.5875 16.4125C3.19583 16.0208 3 15.55 3 15V12H5V15H15V12H17V15C17 15.55 16.8042 16.0208 16.4125 16.4125C16.0208 16.8042 15.55 17 15 17H5Z" fill="currentColor"/>
                        </svg>
                        下载二维码
                    </a>
                </div>
            </div>
        </main>

        <footer>
            <p>使用 QRCode.js 驱动 &middot; 所有数据在本地处理</p>
        </footer>
    </div>

    <!-- QRCode.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <script>
        let qrCodeInstance = null;
        const urlInput = document.getElementById('urlInput');
        const qrContainer = document.getElementById('qrContainer');
        const clearBtn = document.getElementById('clearBtn');
        const errorMessage = document.getElementById('errorMessage');
        const downloadBtn = document.getElementById('downloadBtn');

        // 输入框回车事件
        urlInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                generateQRCode();
            }
        });

        // 输入框变化时清除错误信息
        urlInput.addEventListener('input', function() {
            errorMessage.classList.remove('show');
            if (urlInput.value.trim() === '') {
                clearBtn.disabled = true;
            } else {
                clearBtn.disabled = false;
            }
        });

        function isValidURL(string) {
            try {
                // 如果没有协议，自动添加 https://
                if (!string.match(/^https?:\/\//i)) {
                    string = 'https://' + string;
                }
                const url = new URL(string);
                return url.protocol === "http:" || url.protocol === "https:";
            } catch (_) {
                return false;
            }
        }

        function generateQRCode() {
            let url = urlInput.value.trim();

            if (!url) {
                showError('请输入网址');
                return;
            }

            // 如果没有协议，自动添加 https://
            if (!url.match(/^https?:\/\//i)) {
                url = 'https://' + url;
                urlInput.value = url;
            }

            if (!isValidURL(url)) {
                showError('请输入有效的网址');
                return;
            }

            errorMessage.classList.remove('show');

            // 清除旧的二维码
            const qrcodeDiv = document.getElementById('qrcode');
            qrcodeDiv.innerHTML = '';

            // 生成新的二维码
            qrCodeInstance = new QRCode(qrcodeDiv, {
                text: url,
                width: 256,
                height: 256,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            // 显示二维码容器
            qrContainer.classList.add('show');
            clearBtn.disabled = false;

            // 设置下载按钮
            setTimeout(() => {
                const canvas = qrcodeDiv.querySelector('canvas');
                if (canvas) {
                    downloadBtn.href = canvas.toDataURL('image/png');
                }
            }, 100);
        }

        function clearAll() {
            urlInput.value = '';
            qrContainer.classList.remove('show');
            const qrcodeDiv = document.getElementById('qrcode');
            qrcodeDiv.innerHTML = '';
            qrCodeInstance = null;
            clearBtn.disabled = true;
            errorMessage.classList.remove('show');
            urlInput.focus();
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            urlInput.focus();
        }

        // 页面加载完成后聚焦输入框
        window.addEventListener('load', () => {
            urlInput.focus();
        });
    </script>
</body>
</html>
