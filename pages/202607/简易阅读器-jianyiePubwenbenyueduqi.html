<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简易阅读器</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 现代化色彩方案 */
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --primary-color-rgb: 99, 102, 241;
            --secondary-color: #8b5cf6;
            --secondary-color-rgb: 139, 92, 246;
            --accent-color: #ec4899;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 深色模式变量 */
        .dark-mode {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--bg-color) 0%, #e2e8f0 100%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            transition: var(--transition);
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            padding: 12px;
        }

        /* 头部样式 */
        .header {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            margin-bottom: 24px;
            text-align: center;
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        h1 {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 24px;
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            animation: fadeInDown 0.6s ease-out;
        }

        /* 上传区域 */
        .upload-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
            animation: fadeInUp 0.6s ease-out 0.2s both;
        }

        #fileInput {
            display: none;
        }

        .upload-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 16px 32px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.125rem;
            font-weight: 600;
            transition: var(--transition);
            box-shadow: var(--shadow-md);
            position: relative;
            overflow: hidden;
        }

        .upload-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: var(--transition);
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .upload-btn:hover::before {
            left: 100%;
        }

        .file-info {
            font-size: 1rem;
            color: var(--text-secondary);
            background: rgba(var(--primary-color-rgb), 0.1);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        /* 控制栏样式 */
        .controls {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            animation: fadeInUp 0.6s ease-out 0.3s both;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.02);
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .control-group:hover {
            background: rgba(var(--primary-color-rgb), 0.05);
            border-color: var(--primary-color);
        }

        label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* 自定义选择框 */
        select {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.875rem;
            background: var(--card-bg);
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
            min-width: 100%;
            width: 100%;
        }

        select:hover {
            border-color: var(--primary-color);
            box-shadow: var(--shadow-md);
        }

        select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        /* 自定义滑块 */
        input[type="range"] {
            -webkit-appearance: none;
            width: 120px;
            height: 6px;
            background: var(--border-color);
            border-radius: 3px;
            outline: none;
            transition: var(--transition);
        }

        input[type="range"]:hover {
            background: rgba(var(--primary-color-rgb), 0.3);
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 50%;
            cursor: pointer;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: var(--shadow-lg);
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
        }

        input[type="range"]::-moz-range-thumb:hover {
            transform: scale(1.2);
            box-shadow: var(--shadow-lg);
        }

        /* 字体大小显示 */
        #fontSizeValue {
            font-weight: 600;
            color: var(--primary-color);
            min-width: 45px;
            text-align: center;
        }

        /* 阅读区域样式 */
        .reading-area {
            padding: 30px;
            border-radius: 16px;
            box-shadow: var(--shadow-xl);
            min-height: 700px;
            line-height: 2;
            font-size: 18px;
            transition: var(--transition);
            overflow-y: auto;
            max-height: calc(100vh - 280px);
            border: 1px solid var(--border-color);
            animation: fadeInUp 0.6s ease-out 0.4s both;
            position: relative;
            background: white;
            color: #333;
        }

        /* 阅读区域滚动条美化 */
        .reading-area::-webkit-scrollbar {
            width: 8px;
        }

        .reading-area::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 4px;
        }

        .reading-area::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--primary-color), var(--secondary-color));
            border-radius: 4px;
        }

        .reading-area::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, var(--primary-hover), var(--secondary-color));
        }

        .reading-area.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-style: italic;
            background: linear-gradient(135deg, var(--card-bg) 0%, rgba(var(--primary-color-rgb), 0.05) 100%);
        }

        .reading-content {
            max-width: 1000px;
            margin: 0 auto;
            text-align: justify;
            padding: 0 20px;
        }

        /* 背景色选项 */
        .bg-colors {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        /* 分页按钮样式 */
        .page-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }
        
        .page-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            background: linear-gradient(135deg, var(--primary-hover), var(--secondary-color));
        }
        
        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        /* 清空按钮样式 */
        .clear-btn {
            background: white;
            color: var(--primary-color);
            padding: 8px 16px;
            border: 2px solid var(--primary-color);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }
        
        .clear-btn:hover {
            background: var(--primary-color);
            color: white;
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        
        /* PDF内容样式 */
        .pdf-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .bg-color {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: var(--transition);
            box-shadow: var(--shadow-md);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .bg-color::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.3), transparent);
            opacity: 0;
            transition: var(--transition);
        }

        .bg-color:hover {
            transform: scale(1.15);
            box-shadow: var(--shadow-lg);
        }

        .bg-color:hover::before {
            opacity: 1;
        }

        .bg-color.active {
            border-color: var(--primary-color);
            transform: scale(1.2);
            box-shadow: 0 0 0 3px rgba(var(--primary-color-rgb), 0.2);
        }

        /* 默认背景色选项 */
        .bg-white { background-color: white; }
        .bg-cream { background-color: #f9f7f1; }
        .bg-gray { background-color: #f0f2f5; }
        .bg-night { background-color: #1a1a1a; }
        .bg-green { background-color: #e8f5e8; }
        .bg-blue { background-color: #e3f2fd; }
        .bg-pink { background-color: #fce4ec; }
        .bg-yellow { background-color: #fff8e1; }

        /* 页脚样式 */
        .footer {
            text-align: center;
            margin-top: 30px;
            color: var(--text-secondary);
            font-size: 0.875rem;
            animation: fadeInUp 0.6s ease-out 0.5s both;
        }

        /* 加载动画 */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--primary-color);
        }

        .loading::before {
            content: '';
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* 动画定义 */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 12px;
            }

            h1 {
                font-size: 1.75rem;
            }

            .header {
                padding: 20px;
            }

            .reading-area {
                padding: 24px;
                font-size: 16px;
                max-height: calc(100vh - 400px);
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .control-group {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            .bg-colors {
                justify-content: center;
            }

            .upload-btn {
                padding: 14px 24px;
                font-size: 1rem;
            }
        }

        /* 主布局样式 */
        .main-layout {
            display: flex;
            gap: 20px;
            margin: 0 auto;
            max-width: 1400px;
        }

        /* 左侧侧边栏 */
        .sidebar {
            width: 280px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 调整侧边栏内的上传区域 */
        .sidebar .upload-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
        }

        /* 调整侧边栏内的控制栏 */
        .sidebar .controls {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 20px;
        }

        /* 调整控制组 */
        .sidebar .control-group {
            flex-direction: column;
            align-items: stretch;
            gap: 10px;
        }

        /* 右侧阅读区域 */
        .reading-area {
            flex: 1;
            min-height: calc(100vh - 180px);
            max-height: calc(100vh - 180px);
        }

        /* 响应式设计 - 大屏幕 */
        @media (min-width: 1200px) {
            .reading-content {
                max-width: 1200px;
            }
        }

        /* 响应式设计 - 中等屏幕 */
        @media (max-width: 1024px) {
            .main-layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
            }

            .sidebar .upload-section,
            .sidebar .controls {
                flex: 1;
                min-width: 300px;
            }

            .reading-area {
                min-height: 600px;
                max-height: calc(100vh - 300px);
            }
        }

        /* 响应式设计 - 小屏幕 */
        @media (max-width: 768px) {
            .container {
                padding: 12px;
            }

            h1 {
                font-size: 1.75rem;
            }

            .header {
                padding: 20px;
            }

            .sidebar {
                flex-direction: column;
            }

            .sidebar .upload-section,
            .sidebar .controls {
                min-width: auto;
            }

            .reading-area {
                padding: 24px;
                font-size: 16px;
                min-height: 500px;
                max-height: calc(100vh - 400px);
            }

            .controls {
                gap: 12px;
            }

            .bg-colors {
                justify-content: center;
            }

            .upload-btn {
                padding: 14px 24px;
                font-size: 1rem;
            }
        }

        /* 响应式调整 - 超小屏幕 */
        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }

            .reading-area {
                padding: 16px;
                min-height: 400px;
            }

            .control-group {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="dropZone">
        <header class="header">
            <h1>简易 ePub/文本阅读器</h1>
        </header>

        <div class="main-layout">
            <!-- 左侧控制面板 -->
            <aside class="sidebar">
                <div class="upload-section">
                    <button class="upload-btn" onclick="document.getElementById('fileInput').click()">选择文件</button>
                    <input type="file" id="fileInput" accept=".txt,.epub,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx" onchange="handleFileUpload(event)">
                    <div style="display: flex; align-items: center; gap: 10px; margin-top: 15px;">
                        <div class="file-info" id="fileInfo">未选择文件</div>
                        <button class="clear-btn" onclick="clearFileSelection()">清空</button>
                    </div>
                    <p style="font-size: 0.875rem; color: var(--text-secondary); margin-top: 8px;">或直接拖放文件到页面上</p>
                </div>

                <div class="controls">
                    <div class="control-group">
                        <label for="fontSize">字体大小:</label>
                        <input type="range" id="fontSize" min="12" max="32" value="18" oninput="updateFontSize(this.value)">
                        <span id="fontSizeValue">18px</span>
                    </div>
                    
                    <div class="control-group">
                        <label for="fontFamily">字体:</label>
                        <select id="fontFamily" onchange="updateFontFamily(this.value)">
                            <option value="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif">系统默认</option>
                            <!-- 衬线字体 -->
                            <option value="'Times New Roman', Times, serif">Times New Roman</option>
                            <option value="'Georgia', serif">Georgia</option>
                            <option value="'Garamond', serif">Garamond</option>
                            <option value="'Palatino', 'Palatino Linotype', serif">Palatino</option>
                            <option value="'Book Antiqua', serif">Book Antiqua</option>
                            <!-- 无衬线字体 -->
                            <option value="'Arial', sans-serif">Arial</option>
                            <option value="'Verdana', sans-serif">Verdana</option>
                            <option value="'Helvetica', Arial, sans-serif">Helvetica</option>
                            <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
                            <option value="'Tahoma', sans-serif">Tahoma</option>
                            <option value="'Open Sans', sans-serif">Open Sans</option>
                            <!-- 等宽字体 -->
                            <option value="'Courier New', Courier, monospace">Courier New</option>
                            <option value="'Consolas', 'Monaco', monospace">Consolas</option>
                            <option value="'Lucida Console', Monaco, monospace">Lucida Console</option>
                            <option value="'Andale Mono', monospace">Andale Mono</option>
                        </select>
                    </div>
                    
                    <div class="control-group">
                        <label>背景色:</label>
                        <div class="bg-colors">
                            <div class="bg-color bg-white active" onclick="setBackgroundColor('white', this)"></div>
                            <div class="bg-color bg-cream" onclick="setBackgroundColor('cream', this)"></div>
                            <div class="bg-color bg-gray" onclick="setBackgroundColor('gray', this)"></div>
                            <div class="bg-color bg-green" onclick="setBackgroundColor('green', this)"></div>
                            <div class="bg-color bg-blue" onclick="setBackgroundColor('blue', this)"></div>
                            <div class="bg-color bg-pink" onclick="setBackgroundColor('pink', this)"></div>
                            <div class="bg-color bg-yellow" onclick="setBackgroundColor('yellow', this)"></div>
                            <div class="bg-color bg-night" onclick="setBackgroundColor('night', this)"></div>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- 右侧阅读区域 -->
            <main class="reading-area empty" id="readingArea">
            <div class="reading-content">
                请选择一个 .txt 或 .epub 文件开始阅读，也可以上传PDF文件进行临时阅读
            </div>
        </main>
        </div>

        <footer class="footer">
            <p>简易阅读器 - 支持 TXT、ePub、PDF 等多种格式</p>
        </footer>
    </div>

    <script>
        // 全局变量
        let currentFile = null;
        let currentFileContent = '';
        let isEpub = false;
        let epubBook = null;

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadSettings();
            loadLastReadingPosition();
            
            // 初始化拖放功能
            initDragDrop();
        });
        
        // 初始化拖放功能
        function initDragDrop() {
            const dropZone = document.getElementById('dropZone');
            
            // 阻止默认拖放行为
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, preventDefaults, false);
            });
            
            // 高亮拖放区域
            ['dragenter', 'dragover'].forEach(eventName => {
                dropZone.addEventListener(eventName, highlight, false);
            });
            
            ['dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, unhighlight, false);
            });
            
            // 处理文件拖放
            dropZone.addEventListener('drop', handleDrop, false);
        }
        
        // 阻止默认行为
        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }
        
        // 高亮拖放区域
        function highlight() {
            document.body.style.backgroundColor = 'rgba(var(--primary-color-rgb), 0.05)';
        }
        
        // 取消高亮
        function unhighlight() {
            document.body.style.backgroundColor = '';
        }
        
        // 处理文件拖放
        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            
            if (files.length > 0) {
                // 处理第一个文件
                const file = files[0];
                const supportedTypes = ['.txt', '.epub', '.pdf', '.doc', '.docx', '.xls', '.xlsx', '.ppt', '.pptx'];
                const fileExtension = file.name.slice(file.name.lastIndexOf('.'));
                
                if (supportedTypes.includes(fileExtension.toLowerCase())) {
                    // 模拟文件输入事件
                    const fileInput = document.getElementById('fileInput');
                    const event = new Event('change', { bubbles: true });
                    Object.defineProperty(fileInput, 'files', {
                        value: files,
                        writable: false
                    });
                    fileInput.dispatchEvent(event);
                    handleFileUpload({ target: fileInput });
                } else {
                    alert('请选择支持的文件类型：.txt, .epub, .pdf, .doc, .docx, .xls, .xlsx, .ppt 或 .pptx');
                }
            }
        }
        
        // 清空文件选择
        function clearFileSelection() {
            // 重置文件输入
            const fileInput = document.getElementById('fileInput');
            fileInput.value = '';
            
            // 重置全局变量
            currentFile = null;
            currentFileContent = '';
            isEpub = false;
            currentPdf = null;
            currentPageNum = 1;
            
            // 重置文件信息显示
            document.getElementById('fileInfo').textContent = '未选择文件';
            
            // 重置阅读区域
            const readingArea = document.getElementById('readingArea');
            readingArea.innerHTML = '<div class="reading-content">请选择一个 .txt 或 .epub 文件开始阅读，也可以上传PDF文件进行临时阅读</div>';
            readingArea.classList.add('empty');
            
            // 清除本地存储的阅读位置
            localStorage.removeItem('lastReadingPosition');
        }

        // 处理文件上传
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            currentFile = file;
            document.getElementById('fileInfo').textContent = `已选择: ${file.name}`;
            
            // 检查文件类型
            if (file.name.endsWith('.txt')) {
                readTextFile(file);
                isEpub = false;
            } else if (file.name.endsWith('.epub')) {
                readEpubFile(file);
                isEpub = true;
            } else if (file.name.endsWith('.pdf')) {
                readPdfFile(file);
                isEpub = false;
            } else if (file.name.endsWith('.doc') || file.name.endsWith('.docx')) {
                readOfficeFile(file, 'word');
                isEpub = false;
            } else if (file.name.endsWith('.xls') || file.name.endsWith('.xlsx')) {
                readOfficeFile(file, 'excel');
                isEpub = false;
            } else if (file.name.endsWith('.ppt') || file.name.endsWith('.pptx')) {
                readOfficeFile(file, 'ppt');
                isEpub = false;
            } else {
                // 不支持的文件类型
                const readingArea = document.getElementById('readingArea');
                readingArea.innerHTML = '<div class="reading-content">不支持的文件类型，请选择 .txt, .epub, .pdf, .doc, .docx, .xls, .xlsx, .ppt 或 .pptx 文件</div>';
                readingArea.classList.remove('empty');
            }
        }

        // 读取文本文件
        function readTextFile(file) {
            // 显示加载状态
            const readingArea = document.getElementById('readingArea');
            readingArea.innerHTML = '<div class="reading-content loading">加载中...</div>';
            readingArea.classList.remove('empty');
            
            const reader = new FileReader();
            reader.onload = function(e) {
                currentFileContent = e.target.result;
                displayTextContent();
                saveReadingPosition();
            };
            reader.onerror = function() {
                readingArea.innerHTML = '<div class="reading-content">文件读取失败，请重试</div>';
            };
            reader.readAsText(file, 'utf-8');
        }

        // 读取PDF文件
        function readPdfFile(file) {
            // 显示加载状态
            const readingArea = document.getElementById('readingArea');
            readingArea.innerHTML = '<div class="reading-content loading">加载PDF中...</div>';
            readingArea.classList.remove('empty');
            
            // 检查是否已加载PDF.js库
            if (typeof pdfjsLib === 'undefined') {
                // 动态加载PDF.js库
                const script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
                script.crossOrigin = 'anonymous';
                script.onload = function() {
                    try {
                        // 加载PDF.js工作器
                        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                        console.log('PDF.js library loaded successfully');
                        processPdfFile(file);
                    } catch (error) {
                        console.error('Error initializing PDF.js:', error);
                        showFilePreviewTips(file);
                    }
                };
                script.onerror = function(error) {
                    console.error('Failed to load PDF.js:', error);
                    showFilePreviewTips(file);
                };
                document.head.appendChild(script);
            } else {
                processPdfFile(file);
            }
        }

        // 全局PDF变量，用于分页导航
        let currentPdf = null;
        let currentPageNum = 1;
        
        // 处理PDF文件
        function processPdfFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const arrayBuffer = e.target.result;
                const readingArea = document.getElementById('readingArea');
                
                try {
                    // 检查PDF.js是否已正确加载
                    if (typeof pdfjsLib === 'undefined') {
                        throw new Error('PDF.js library not loaded');
                    }
                    
                    // 使用PDF.js渲染PDF
                    pdfjsLib.getDocument(arrayBuffer).promise.then(function(pdf) {
                        currentPdf = pdf;
                        currentPageNum = 1;
                        
                        // 渲染第一页
                        renderPdfPage(pdf, 1);
                        
                    }).catch(function(error) {
                        console.error('Error loading PDF:', error);
                        showFilePreviewTips(file);
                    });
                } catch (error) {
                    console.error('Error processing PDF:', error);
                    showFilePreviewTips(file);
                }
            };
            
            reader.onerror = function() {
                const readingArea = document.getElementById('readingArea');
                readingArea.innerHTML = '<div class="reading-content">文件读取失败，请重试</div>';
            };
            
            reader.readAsArrayBuffer(file);
        }
        
        // 渲染PDF指定页面
        function renderPdfPage(pdf, pageNum) {
            const readingArea = document.getElementById('readingArea');
            
            // 显示加载状态
            readingArea.innerHTML = '<div class="reading-content loading">加载中...</div>';
            
            pdf.getPage(pageNum).then(function(page) {
                try {
                    // 计算适合页面的缩放比例
                    const containerWidth = readingArea.clientWidth - 40; // 减少内边距限制
                    const viewport = page.getViewport({ scale: 1 });
                    
                    // 计算缩放比例，让PDF尽可能充满宽度
                    const scale = containerWidth / viewport.width;
                    const scaledViewport = page.getViewport({ scale: scale });
                    
                    // 创建canvas元素
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    
                    if (!context) {
                        throw new Error('Canvas context not available');
                    }
                    
                    canvas.height = scaledViewport.height;
                    canvas.width = scaledViewport.width;
                    canvas.style.width = '100%';
                    canvas.style.height = 'auto';
                    canvas.style.margin = '0 auto';
                    canvas.style.display = 'block';
                    canvas.style.border = '1px solid var(--border-color)';
                    canvas.style.borderRadius = '8px';
                    
                    // 渲染PDF页到canvas
                    const renderContext = {
                        canvasContext: context,
                        viewport: scaledViewport
                    };
                    
                    page.render(renderContext).promise.then(function() {
                        // 创建分页控制
                        const pageControls = createPaginationControls(pdf.numPages, pageNum);
                        
                        // 创建完整的DOM结构
                        const pdfContent = document.createElement('div');
                        pdfContent.className = 'reading-content pdf-content';
                        pdfContent.style.padding = '0';
                        
                        const canvasContainer = document.createElement('div');
                        canvasContainer.style.width = '100%';
                        canvasContainer.style.display = 'flex';
                        canvasContainer.style.justifyContent = 'center';
                        canvasContainer.style.marginBottom = '20px';
                        canvasContainer.appendChild(canvas);
                        
                        const controlsContainer = document.createElement('div');
                        controlsContainer.innerHTML = pageControls;
                        
                        pdfContent.appendChild(canvasContainer);
                        pdfContent.appendChild(controlsContainer);
                        
                        // 更新阅读区域
                        readingArea.innerHTML = '';
                        readingArea.appendChild(pdfContent);
                        
                        // 保存阅读位置
                        saveReadingPosition();
                    }).catch(function(renderError) {
                        console.error('PDF render error:', renderError);
                        showFilePreviewTips(currentFile);
                    });
                } catch (canvasError) {
                    console.error('Canvas creation error:', canvasError);
                    showFilePreviewTips(currentFile);
                }
            }).catch(function(pageError) {
                console.error('PDF page error:', pageError);
                showFilePreviewTips(currentFile);
            });
        }
        
        // 创建分页控制
        function createPaginationControls(totalPages, currentPage) {
            if (totalPages <= 1) return '';
            
            return `
                <div style="text-align: center; margin-top: 20px;">
                    <button class="page-btn" onclick="changePage(-1)" ${currentPage === 1 ? 'disabled' : ''}>
                        上一页
                    </button>
                    <div style="display: inline-flex; align-items: center; margin: 0 15px; font-size: 0.875rem;">
                        <span style="margin-right: 8px; font-weight: 600;">第</span>
                        <input type="number" id="pageInput" min="1" max="${totalPages}" value="${currentPage}" 
                               style="width: 60px; height: 34px; padding: 0 6px; border: 1px solid var(--border-color); border-radius: 4px; text-align: center; margin: 0 4px; font-size: 0.875rem; font-weight: 600; color: var(--text-primary); background: var(--card-bg);">
                        <span style="margin: 0 4px; font-weight: 600;">/</span>
                        <span style="margin-left: 4px; font-weight: 600; color: var(--text-primary);">${totalPages} 页</span>
                        <button class="page-btn" onclick="goToPage()" style="margin-left: 8px; padding: 6px 12px; font-size: 0.875rem; height: 34px;">
                            跳转
                        </button>
                    </div>
                    <button class="page-btn" onclick="changePage(1)" ${currentPage === totalPages ? 'disabled' : ''}>
                        下一页
                    </button>
                </div>
            `;
        }
        
        // 绑定分页事件
        function bindPaginationEvents(pdf) {
            // 绑定页码输入框的回车键事件
            const pageInput = document.getElementById('pageInput');
            if (pageInput) {
                pageInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        goToPage();
                    }
                });
            }
        }
        
        // 切换页面
        function changePage(direction) {
            if (!currentPdf) return;
            
            const newPage = currentPageNum + direction;
            if (newPage >= 1 && newPage <= currentPdf.numPages) {
                currentPageNum = newPage;
                renderPdfPage(currentPdf, currentPageNum);
            }
        }
        
        // 跳转到指定页码
        function goToPage() {
            if (!currentPdf) return;
            
            const pageInput = document.getElementById('pageInput');
            if (!pageInput) return;
            
            let targetPage = parseInt(pageInput.value);
            
            // 验证页码范围
            targetPage = Math.max(1, Math.min(targetPage, currentPdf.numPages));
            
            if (targetPage !== currentPageNum) {
                currentPageNum = targetPage;
                renderPdfPage(currentPdf, currentPageNum);
            }
        }
        
        // 显示文件预览提示
        function showFilePreviewTips(file) {
            const readingArea = document.getElementById('readingArea');
            readingArea.innerHTML = '<div class="reading-content">' +
                '<h3>文件预览提示</h3>' +
                '<p>当前文件无法直接预览，请使用以下方式打开：</p>' +
                '<ul>' +
                '<li>1. 保存文件到本地</li>' +
                '<li>2. 使用对应软件打开</li>' +
                '<li>3. 或转换为更兼容的格式后再次上传</li>' +
                '</ul>' +
                '<p style="margin-top: 20px; color: var(--text-secondary); font-size: 0.875rem;">文件名：' + file.name + '</p>' +
                '<p style="color: var(--text-secondary); font-size: 0.875rem;">文件大小：' + (file.size / 1024).toFixed(2) + ' KB</p>' +
                '</div>';
            saveReadingPosition();
        }

        // 读取Office文件 (Word, Excel, PowerPoint)
        function readOfficeFile(file, type) {
            // 显示加载状态
            const readingArea = document.getElementById('readingArea');
            readingArea.innerHTML = '<div class="reading-content loading">加载中...</div>';
            readingArea.classList.remove('empty');
            
            try {
                if (type === 'word') {
                    // 对于Word文件，尝试提取文本内容
                    readWordFile(file);
                } else {
                    // 对于Excel和PPT，显示不支持提示
                    readingArea.innerHTML = '<div class="reading-content">' +
                        '<h3>文件预览提示</h3>' +
                        '<p>当前文件类型暂不支持直接预览，请使用以下方式打开：</p>' +
                        '<ul>' +
                        '<li>1. 保存文件到本地</li>' +
                        '<li>2. 使用对应软件打开（如Microsoft Office或WPS）</li>' +
                        '<li>3. 或转换为PDF格式后再次上传</li>' +
                        '</ul>' +
                        '<p style="margin-top: 20px; color: var(--text-secondary); font-size: 0.875rem;">文件名：' + file.name + '</p>' +
                        '<p style="color: var(--text-secondary); font-size: 0.875rem;">文件大小：' + (file.size / 1024).toFixed(2) + ' KB</p>' +
                        '</div>';
                    saveReadingPosition();
                }
            } catch (error) {
                console.error('Error reading office file:', error);
                readingArea.innerHTML = '<div class="reading-content">无法读取文件，请检查文件格式或尝试其他方式打开</div>';
            }
        }
        
        // 读取Word文件，尝试提取文本内容
        function readWordFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const arrayBuffer = e.target.result;
                const readingArea = document.getElementById('readingArea');
                
                try {
                    // 尝试处理.docx文件
                    if (file.name.endsWith('.docx')) {
                        // 简单的docx文本提取（仅适用于简单的docx文件）
                        // 注意：这是一个简化的实现，可能无法处理复杂的docx文件
                        const text = extractTextFromDocx(arrayBuffer);
                        displayOfficeText(text, file.name);
                    } else {
                        // .doc文件暂时不支持直接提取
                        readingArea.innerHTML = '<div class="reading-content">' +
                            '<h3>文件预览提示</h3>' +
                            '<p>.doc格式文件暂不支持直接预览，请转换为.docx或PDF格式后再次上传</p>' +
                            '<p style="margin-top: 20px; color: var(--text-secondary); font-size: 0.875rem;">文件名：' + file.name + '</p>' +
                            '</div>';
                    }
                } catch (error) {
                    console.error('Error extracting text from word file:', error);
                    readingArea.innerHTML = '<div class="reading-content">无法提取文件内容，请尝试其他方式打开</div>';
                }
                saveReadingPosition();
            };
            reader.onerror = function() {
                const readingArea = document.getElementById('readingArea');
                readingArea.innerHTML = '<div class="reading-content">文件读取失败，请重试</div>';
            };
            
            if (file.name.endsWith('.docx')) {
                reader.readAsArrayBuffer(file);
            } else {
                reader.readAsBinaryString(file);
            }
        }
        
        // 从docx文件中提取文本（简化实现）
        function extractTextFromDocx(arrayBuffer) {
            // 这里是一个简化的实现，实际生产环境建议使用专业库
            // 由于安全限制，我们无法在浏览器中直接解压缩docx文件
            // 因此提供更友好的提示
            return '当前环境下无法直接提取DOCX文件内容。建议您：\n\n' +
                   '1. 将文件转换为TXT或PDF格式\n' +
                   '2. 使用专业的文档查看软件\n' +
                   '3. 或尝试使用在线转换工具\n\n' +
                   '感谢您的理解！';
        }
        
        // 显示提取的Office文本内容
        function displayOfficeText(text, fileName) {
            const readingArea = document.getElementById('readingArea');
            readingArea.innerHTML = '<div class="reading-content">' +
                '<h3>文件内容预览</h3>' +
                '<p style="color: var(--text-secondary); font-size: 0.875rem; margin-bottom: 20px;">文件名：' + fileName + '</p>' +
                '<div style="white-space: pre-wrap; line-height: 1.8;">' + text.replace(/\n/g, '<br>') + '</div>' +
                '</div>';
        }

        // 读取ePub文件
        function readEpubFile(file) {
            // 检查是否已加载epub.js库
            if (typeof ePub === 'undefined') {
                // 动态加载epub.js库
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js';
                script.onload = function() {
                    processEpubFile(file);
                };
                document.head.appendChild(script);
            } else {
                processEpubFile(file);
            }
        }

        // 处理ePub文件
        function processEpubFile(file) {
            const url = URL.createObjectURL(file);
            epubBook = ePub(url);
            
            epubBook.load().then(function() {
                return epubBook.renderTo('reading-content', {
                    width: '100%',
                    height: '100%'
                });
            }).then(function(renderer) {
                document.getElementById('readingArea').classList.remove('empty');
                saveReadingPosition();
            }).catch(function(error) {
                console.error('Error loading epub:', error);
                document.getElementById('readingArea').innerHTML = '<div class="reading-content">无法加载 ePub 文件，请检查文件格式</div>';
            });
        }

        // 显示文本内容
        function displayTextContent() {
            const readingArea = document.getElementById('readingArea');
            readingArea.classList.remove('empty');
            readingArea.innerHTML = `<div class="reading-content">${currentFileContent.replace(/\n/g, '<br>')}</div>`;
        }

        // 更新字体大小
        function updateFontSize(size) {
            const readingArea = document.getElementById('readingArea');
            readingArea.style.fontSize = size + 'px';
            document.getElementById('fontSizeValue').textContent = size + 'px';
            saveSettings();
        }

        // 更新字体
        function updateFontFamily(font) {
            const readingArea = document.getElementById('readingArea');
            readingArea.style.fontFamily = font;
            saveSettings();
        }

        // 设置背景色
        function setBackgroundColor(color, element) {
            const readingArea = document.getElementById('readingArea');
            const bgColors = document.querySelectorAll('.bg-color');
            
            // 移除所有active类
            bgColors.forEach(bg => bg.classList.remove('active'));
            // 添加active类到当前选中的颜色
            element.classList.add('active');
            
            // 设置背景色
            switch(color) {
                case 'white':
                    readingArea.style.backgroundColor = 'white';
                    readingArea.style.color = '#333';
                    break;
                case 'cream':
                    readingArea.style.backgroundColor = '#f9f7f1';
                    readingArea.style.color = '#333';
                    break;
                case 'gray':
                    readingArea.style.backgroundColor = '#f0f2f5';
                    readingArea.style.color = '#333';
                    break;
                case 'green':
                    readingArea.style.backgroundColor = '#e8f5e8';
                    readingArea.style.color = '#333';
                    break;
                case 'blue':
                    readingArea.style.backgroundColor = '#e3f2fd';
                    readingArea.style.color = '#333';
                    break;
                case 'pink':
                    readingArea.style.backgroundColor = '#fce4ec';
                    readingArea.style.color = '#333';
                    break;
                case 'yellow':
                    readingArea.style.backgroundColor = '#fff8e1';
                    readingArea.style.color = '#333';
                    break;
                case 'night':
                    readingArea.style.backgroundColor = '#1a1a1a';
                    readingArea.style.color = '#e0e0e0';
                    break;
            }
            saveSettings();
        }

        // 保存设置到本地存储
        function saveSettings() {
            const settings = {
                fontSize: document.getElementById('fontSize').value,
                fontFamily: document.getElementById('fontFamily').value,
                backgroundColor: document.querySelector('.bg-color.active').className.split(' ')[1].replace('bg-', '')
            };
            localStorage.setItem('readerSettings', JSON.stringify(settings));
        }

        // 加载设置
        function loadSettings() {
            const settings = localStorage.getItem('readerSettings');
            if (settings) {
                const parsedSettings = JSON.parse(settings);
                
                // 恢复字体大小
                document.getElementById('fontSize').value = parsedSettings.fontSize;
                updateFontSize(parsedSettings.fontSize);
                
                // 恢复字体
                document.getElementById('fontFamily').value = parsedSettings.fontFamily;
                updateFontFamily(parsedSettings.fontFamily);
                
                // 恢复背景色
                const bgColorElement = document.querySelector(`.bg-${parsedSettings.backgroundColor}`);
                if (bgColorElement) {
                    // 直接调用函数，不使用click()方法
                    setBackgroundColor(parsedSettings.backgroundColor, bgColorElement);
                }
            }
        }

        // 保存阅读位置
        function saveReadingPosition() {
            if (!currentFile) return;
            
            const readingArea = document.getElementById('readingArea');
            const scrollTop = readingArea.scrollTop;
            
            const readingPosition = {
                fileName: currentFile.name,
                scrollTop: scrollTop,
                timestamp: Date.now()
            };
            
            localStorage.setItem('lastReadingPosition', JSON.stringify(readingPosition));
        }

        // 加载上次阅读位置
        function loadLastReadingPosition() {
            const position = localStorage.getItem('lastReadingPosition');
            if (position) {
                const parsedPosition = JSON.parse(position);
                // 这里可以添加逻辑，当用户再次打开相同文件时恢复位置
                // 目前简化处理，只在页面加载时保存设置
            }
        }

        // 监听滚动事件，保存阅读位置
        document.getElementById('readingArea').addEventListener('scroll', function() {
            saveReadingPosition();
        });

        // 监听窗口关闭事件，保存阅读位置
        window.addEventListener('beforeunload', function() {
            saveReadingPosition();
        });
    </script>
