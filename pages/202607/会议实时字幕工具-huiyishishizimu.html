<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>会议实时字幕工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563EB',
                        secondary: '#10B981',
                        accent: '#F59E0B',
                        danger: '#EF4444',
                        dark: '#1E293B',
                        light: '#F8FAFC'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .card-shadow {
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            }
            .pulse-active {
                animation: pulseActive 2s infinite;
            }
            .slide-up {
                animation: slideUp 0.5s ease-out forwards;
            }
            .fade-in {
                animation: fadeIn 0.5s ease-out forwards;
            }
        }

        @keyframes pulseActive {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        @keyframes slideUp {
            from { transform: translateY(10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans text-dark min-h-screen flex flex-col">
    <!-- 顶部导航 -->
    <header class="bg-white shadow-sm py-4">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <i class="fa fa-closed-captioning text-primary text-2xl"></i>
                    <h1 class="text-xl font-bold">会议实时字幕工具</h1>
                </div>
                <div class="text-sm text-gray-500 flex items-center gap-1">
                    <i class="fa fa-microphone text-primary"></i>
                    <span>语音实时转文字</span>
                </div>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="flex-grow container mx-auto px-4 py-6 flex flex-col">
        <!-- 浏览器兼容性提示 -->
        <div id="browser-warning" class="max-w-2xl mx-auto mb-4 hidden bg-yellow-50 border border-yellow-200 rounded-lg p-3 text-sm text-yellow-700 flex items-start gap-2 fade-in">
            <i class="fa fa-exclamation-triangle mt-0.5"></i>
            <p>检测到您的浏览器可能不支持语音识别功能，建议使用Chrome、Edge等现代浏览器以获得最佳体验。</p>
        </div>
        
        <!-- 权限错误提示 -->
        <div id="permission-error" class="max-w-2xl mx-auto mb-4 hidden bg-red-50 border border-red-200 rounded-lg p-3 text-sm text-red-700 flex items-start gap-2 fade-in">
            <i class="fa fa-times-circle mt-0.5"></i>
            <p>无法访问麦克风，请检查浏览器权限设置并允许本网站使用麦克风。</p>
        </div>
        
        <!-- 控制面板 -->
        <section class="max-w-2xl mx-auto mb-6">
            <div class="bg-white rounded-xl shadow-md p-5 card-shadow">
                <div class="flex flex-wrap items-center justify-between gap-4">
                    <div class="flex items-center gap-3">
                        <button id="start-btn" class="bg-primary hover:bg-primary/90 text-white font-medium py-2 px-6 rounded-lg transition-colors flex items-center gap-2">
                            <i class="fa fa-microphone"></i>
                            <span>开始识别</span>
                        </button>
                        
                        <button id="stop-btn" class="hidden bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2 px-6 rounded-lg transition-colors flex items-center gap-2">
                            <i class="fa fa-stop"></i>
                            <span>停止识别</span>
                        </button>
                        
                        <div id="status-indicator" class="hidden items-center gap-2">
                            <span class="w-3 h-3 bg-red-500 rounded-full pulse-active"></span>
                            <span class="text-sm text-gray-600">正在识别...</span>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-3">
                        <label for="language-select" class="text-sm font-medium text-gray-700">语言：</label>
                        <select id="language-select" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-primary/50 focus:border-primary focus:outline-none">
                            <option value="zh-CN">中文</option>
                            <option value="en-US">英文</option>
                        </select>
                        
                        <button id="clear-btn" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2 px-4 rounded-lg transition-colors flex items-center gap-1">
                            <i class="fa fa-trash-o"></i>
                            <span class="text-sm">清空</span>
                        </button>
                    </div>
                </div>
                
                <div class="mt-4 p-3 bg-blue-50 border border-blue-100 rounded-lg text-sm text-blue-700 flex items-start gap-2">
                    <i class="fa fa-info-circle mt-0.5"></i>
                    <p>提示：点击"开始识别"后，请允许浏览器访问麦克风权限。确保环境安静以获得更好的识别效果。</p>
                </div>
            </div>
        </section>
        
        <!-- 字幕显示区 -->
        <section class="flex-grow max-w-3xl mx-auto mb-6 flex flex-col">
            <div class="bg-white rounded-xl shadow-md p-6 card-shadow flex flex-col h-full">
                <h2 class="text-lg font-semibold mb-4 pb-2 border-b border-gray-100 flex items-center">
                    <i class="fa fa-subscript text-primary mr-2"></i>
                    实时字幕
                </h2>
                
                <div id="subtitle-container" class="flex-grow overflow-y-auto p-4 text-lg leading-relaxed">
                    <div class="text-gray-400 text-center py-12">
                        <i class="fa fa-comment-o text-4xl mb-3 opacity-30"></i>
                        <p>识别的文字将显示在这里</p>
                    </div>
                </div>
                
                <div id="last-recognized" class="mt-4 pt-4 border-t border-gray-100 text-gray-600 text-sm hidden">
                    <p>最后识别：<span id="last-recognized-text">-</span></p>
                </div>
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer class="bg-dark text-white/70 py-3 px-4 text-center text-sm mt-auto">
        <p>
            邓文涛(AI版) | <a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="c7f0f7f0f2f3f0f3f3f687b6b6e9a4a8aa">[email&#160;protected]</a> | VX：707547441 | 更多点击➡️<a href="https://dkfile.com/Dx25214" target="_blank" rel="noopener" class="text-blue-400 hover:underline">🌌</a>
        </p>
    </footer>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const startBtn = document.getElementById('start-btn');
            const stopBtn = document.getElementById('stop-btn');
            const statusIndicator = document.getElementById('status-indicator');
            const clearBtn = document.getElementById('clear-btn');
            const languageSelect = document.getElementById('language-select');
            const subtitleContainer = document.getElementById('subtitle-container');
            const lastRecognized = document.getElementById('last-recognized');
            const lastRecognizedText = document.getElementById('last-recognized-text');
            const browserWarning = document.getElementById('browser-warning');
            const permissionError = document.getElementById('permission-error');
            
            // 语音识别相关变量
            let recognition;
            let isRecognizing = false;
            let finalTranscript = '';
            let currentParagraph;
            let hasPermission = false;
            
            // 检查浏览器是否支持Web Speech API
            function checkBrowserSupport() {
                if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                    browserWarning.classList.remove('hidden');
                    startBtn.disabled = true;
                    startBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    startBtn.classList.remove('hover:bg-primary/90');
                    return false;
                }
                return true;
            }
            
            // 初始化语音识别
            function initRecognition() {
                if (!checkBrowserSupport()) return;
                
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                
                // 配置识别参数
                recognition.continuous = true; // 持续识别
                recognition.interimResults = true; // 返回临时结果
                recognition.lang = languageSelect.value; // 设置语言
                recognition.maxAlternatives = 1; // 只返回一个最可能的结果
                
                // 处理识别结果
                recognition.onresult = function(event) {
                    let interimTranscript = '';
                    
                    // 遍历所有结果
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i][0].transcript;
                        if (event.results[i].isFinal) {
                            finalTranscript += transcript;
                            
                            // 更新最后识别文本
                            lastRecognized.classList.remove('hidden');
                            lastRecognizedText.textContent = transcript;
                        } else {
                            interimTranscript += transcript;
                        }
                    }
                    
                    // 更新字幕显示
                    updateSubtitles(finalTranscript, interimTranscript);
                };
                
                // 识别结束时重新开始，实现连续识别
                recognition.onend = function() {
                    if (isRecognizing) {
                        // 重新开始识别
                        setTimeout(() => {
                            if (isRecognizing) {
                                try {
                                    recognition.start();
                                } catch (e) {
                                    console.error('重启识别失败:', e);
                                    showError('识别已中断，请尝试重新开始');
                                    stopRecognition();
                                }
                            }
                        }, 500);
                    }
                };
                
                // 处理错误
                recognition.onerror = function(event) {
                    console.error('识别错误:', event.error);
                    
                    // 隐藏权限错误提示（如果显示）
                    permissionError.classList.add('hidden');
                    
                    if (event.error === 'not-allowed' || event.error === 'permission_denied') {
                        hasPermission = false;
                        permissionError.classList.remove('hidden');
                        stopRecognition();
                    } else if (event.error === 'audio-capture') {
                        showError('无法访问麦克风，请确保麦克风已正确连接');
                        stopRecognition();
                    } else if (event.error === 'no-speech') {
                        // 无语音输入，不显示错误
                    } else {
                        showError(`识别错误: ${event.error}`);
                    }
                };
            }
            
            // 检查麦克风权限
            async function checkMicrophonePermission() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    stream.getTracks().forEach(track => track.stop());
                    hasPermission = true;
                    permissionError.classList.add('hidden');
                    return true;
                } catch (err) {
                    console.error('麦克风权限错误:', err);
                    hasPermission = false;
                    permissionError.classList.remove('hidden');
                    return false;
                }
            }
            
            // 显示错误消息
            function showError(message) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'bg-red-50 border border-red-200 rounded-lg p-3 text-sm text-red-700 mb-3 fade-in';
                errorDiv.innerHTML = `<i class="fa fa-times-circle mr-1"></i> ${message}`;
                
                // 添加到字幕区域顶部
                if (subtitleContainer.firstChild) {
                    subtitleContainer.insertBefore(errorDiv, subtitleContainer.firstChild);
                } else {
                    subtitleContainer.appendChild(errorDiv);
                }
                
                // 5秒后自动移除
                setTimeout(() => {
                    errorDiv.style.opacity = '0';
                    errorDiv.style.transition = 'opacity 0.3s ease';
                    setTimeout(() => errorDiv.remove(), 300);
                }, 5000);
            }
            
            // 开始识别
            startBtn.addEventListener('click', async function() {
                if (isRecognizing) return;
                
                // 检查浏览器支持
                if (!checkBrowserSupport()) return;
                
                // 确保识别已初始化
                if (!recognition) {
                    initRecognition();
                }
                
                // 检查并请求麦克风权限
                const permissionGranted = await checkMicrophonePermission();
                if (!permissionGranted) {
                    return;
                }
                
                startRecognition();
            });
            
            // 停止识别
            stopBtn.addEventListener('click', function() {
                stopRecognition();
            });
            
            // 清空字幕
            clearBtn.addEventListener('click', function() {
                finalTranscript = '';
                subtitleContainer.innerHTML = `
                    <div class="text-gray-400 text-center py-12">
                        <i class="fa fa-comment-o text-4xl mb-3 opacity-30"></i>
                        <p>识别的文字将显示在这里</p>
                    </div>
                `;
                lastRecognized.classList.add('hidden');
            });
            
            // 切换语言
            languageSelect.addEventListener('change', function() {
                const wasRecognizing = isRecognizing;
                
                if (wasRecognizing) {
                    stopRecognition();
                }
                
                if (recognition) {
                    recognition.lang = this.value;
                }
                
                if (wasRecognizing) {
                    setTimeout(startRecognition, 100);
                }
            });
            
            // 开始识别函数
            function startRecognition() {
                if (!recognition || !hasPermission) return;
                
                isRecognizing = true;
                finalTranscript = finalTranscript || '';
                
                // 更新UI状态
                startBtn.classList.add('hidden');
                stopBtn.classList.remove('hidden');
                statusIndicator.classList.remove('hidden');
                statusIndicator.classList.add('flex');
                
                // 隐藏所有错误提示
                permissionError.classList.add('hidden');
                browserWarning.classList.add('hidden');
                
                // 开始识别
                try {
                    recognition.start();
                } catch (e) {
                    console.error('开始识别失败:', e);
                    showError('无法开始识别，请重试');
                    stopRecognition();
                }
            }
            
            // 停止识别函数
            function stopRecognition() {
                if (!recognition || !isRecognizing) return;
                
                isRecognizing = false;
                
                // 更新UI状态
                startBtn.classList.remove('hidden');
                stopBtn.classList.add('hidden');
                statusIndicator.classList.add('hidden');
                statusIndicator.classList.remove('flex');
                
                // 停止识别
                recognition.stop();
            }
            
            // 更新字幕显示
            function updateSubtitles(final, interim) {
                // 清除初始提示
                if (subtitleContainer.querySelector('.text-gray-400')) {
                    subtitleContainer.innerHTML = '';
                }
                
                // 如果没有当前段落，创建一个
                if (!currentParagraph) {
                    currentParagraph = document.createElement('p');
                    currentParagraph.className = 'mb-2 slide-up';
                    subtitleContainer.appendChild(currentParagraph);
                }
                
                // 更新当前段落内容
                currentParagraph.innerHTML = final + (interim ? `<span class="text-gray-400">${interim}</span>` : '');
                
                // 如果有最终文本且结尾是标点符号，创建新段落
                if (final && /[。,.?!；;]$/.test(final)) {
                    currentParagraph = null;
                }
                
                // 滚动到底部
                subtitleContainer.scrollTop = subtitleContainer.scrollHeight;
            }
            
            // 初始化
            checkBrowserSupport();
            initRecognition();
        });
    </script>
</body>
</html>
