<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会议纪要智能生成器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.2rem;
        }
        
        .description {
            color: #7f8c8d;
            font-size: 1.1rem;
        }
        
        .main-content {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .input-section, .preview-section {
            flex: 1;
            min-width: 300px;
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        
        h2 {
            color: #2c3e50;
            font-size: 1.5rem;
        }
        
        .template-selector {
            margin-bottom: 20px;
        }
        
        .template-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        
        .template-btn {
            padding: 8px 15px;
            border: 1px solid #ddd;
            background: #f8f9fa;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .template-btn.active {
            background: #3498db;
            color: white;
            border-color: #3498db;
        }
        
        .template-btn:hover {
            background: #e9ecef;
        }
        
        .template-btn.active:hover {
            background: #2980b9;
        }
        
        .template-preview {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 5px;
            font-size: 0.9rem;
            color: #555;
            display: none;
        }
        
        .template-preview.active {
            display: block;
        }
        
        .form-group {
            margin-bottom: 15px;
            transition: all 0.3s;
        }
        
        .form-group.hidden {
            display: none;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #2c3e50;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            transition: border 0.3s;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }
        
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .action-items {
            margin-top: 20px;
        }
        
        .action-item {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }
        
        .action-item input {
            flex: 1;
        }
        
        .add-action {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.3s;
        }
        
        .add-action:hover {
            background: #27ae60;
        }
        
        .remove-action {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        
        .remove-action:hover {
            background: #c0392b;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .generate-btn {
            background: #3498db;
            color: white;
            flex: 2;
        }
        
        .generate-btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }
        
        .reset-btn {
            background: #e74c3c;
            color: white;
            flex: 1;
        }
        
        .reset-btn:hover {
            background: #c0392b;
        }
        
        .preview-content {
            min-height: 400px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f8f9fa;
            white-space: pre-wrap;
            overflow-y: auto;
            font-size: 1rem;
            line-height: 1.8;
        }
        
        .edit-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .edit-btn {
            background: #9b59b6;
            color: white;
            flex: 1;
        }
        
        .edit-btn:hover {
            background: #8e44ad;
        }
        
        .save-btn {
            background: #2ecc71;
            color: white;
            flex: 1;
        }
        
        .save-btn:hover {
            background: #27ae60;
        }
        
        .download-btn {
            background: #f39c12;
            color: white;
            flex: 1;
        }
        
        .download-btn:hover {
            background: #e67e22;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .template-buttons {
                flex-direction: column;
            }
            
            .action-item {
                flex-direction: column;
                align-items: stretch;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .button-group, .edit-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>会议纪要智能生成器</h1>
            <p class="description">选择模板，填写信息，一键生成专业会议纪要</p>
        </header>
        
        <div class="main-content">
            <div class="input-section">
                <div class="section-title">
                    <h2>会议信息</h2>
                </div>
                
                <div class="template-selector">
                    <label>选择会议模板：</label>
                    <div class="template-buttons">
                        <button class="template-btn active" data-template="weekly">周会</button>
                        <button class="template-btn" data-template="monthly">月会</button>
                        <button class="template-btn" data-template="quarterly">季度会</button>
                        <button class="template-btn" data-template="review">评审会</button>
                        <button class="template-btn" data-template="retrospective">项目复盘</button>
                    </div>
                    
                    <div class="template-preview active" id="weekly-preview">
                        <strong>周会模板预览：</strong> 适用于团队每周例行会议，重点讨论进展、计划和问题。
                    </div>
                    <div class="template-preview" id="monthly-preview">
                        <strong>月会模板预览：</strong> 适用于月度总结和计划会议，关注整体进展和资源分配。
                    </div>
                    <div class="template-preview" id="quarterly-preview">
                        <strong>季度会模板预览：</strong> 适用于季度总结和规划，关注战略目标和关键成果。
                    </div>
                    <div class="template-preview" id="review-preview">
                        <strong>评审会模板预览：</strong> 适用于项目或产品评审，关注质量评估和改进点。
                    </div>
                    <div class="template-preview" id="retrospective-preview">
                        <strong>项目复盘模板预览：</strong> 适用于项目结束后复盘，总结经验教训和改进方向。
                    </div>
                </div>
                
                <div class="form-group" id="meeting-title-group">
                    <label for="meeting-title">会议主题：</label>
                    <input type="text" id="meeting-title" placeholder="请输入会议主题">
                </div>
                
                <div class="form-group" id="meeting-date-group">
                    <label for="meeting-date">会议日期：</label>
                    <input type="date" id="meeting-date">
                </div>
                
                <div class="form-group" id="meeting-time-group">
                    <label for="meeting-time">会议时间：</label>
                    <input type="time" id="meeting-time">
                </div>
                
                <div class="form-group" id="meeting-location-group">
                    <label for="meeting-location">会议地点：</label>
                    <input type="text" id="meeting-location" placeholder="请输入会议地点">
                </div>
                
                <div class="form-group" id="meeting-host-group">
                    <label for="meeting-host">会议主持人：</label>
                    <input type="text" id="meeting-host" placeholder="请输入主持人姓名">
                </div>
                
                <div class="form-group" id="meeting-recorder-group">
                    <label for="meeting-recorder">会议记录人：</label>
                    <input type="text" id="meeting-recorder" placeholder="请输入记录人姓名">
                </div>
                
                <div class="form-group" id="participants-group">
                    <label for="participants">参与人员：</label>
                    <textarea id="participants" placeholder="请输入参与人员姓名，用逗号分隔"></textarea>
                </div>
                
                <div class="form-group" id="absentees-group">
                    <label for="absentees">缺席人员：</label>
                    <textarea id="absentees" placeholder="请输入缺席人员姓名，用逗号分隔"></textarea>
                </div>
                
                <div class="form-group" id="meeting-topics-group">
                    <label for="meeting-topics">主要议题：</label>
                    <textarea id="meeting-topics" placeholder="请输入会议讨论的主要议题"></textarea>
                </div>
                
                <div class="form-group" id="last-week-progress-group">
                    <label for="last-week-progress">上周工作进展：</label>
                    <textarea id="last-week-progress" placeholder="请输入上周工作进展"></textarea>
                </div>
                
                <div class="form-group" id="this-week-plan-group">
                    <label for="this-week-plan">本周工作计划：</label>
                    <textarea id="this-week-plan" placeholder="请输入本周工作计划"></textarea>
                </div>
                
                <div class="form-group" id="monthly-summary-group">
                    <label for="monthly-summary">本月工作总结：</label>
                    <textarea id="monthly-summary" placeholder="请输入本月工作总结"></textarea>
                </div>
                
                <div class="form-group" id="next-month-plan-group">
                    <label for="next-month-plan">下月工作计划：</label>
                    <textarea id="next-month-plan" placeholder="请输入下月工作计划"></textarea>
                </div>
                
                <div class="form-group" id="quarterly-goals-group">
                    <label for="quarterly-goals">季度目标：</label>
                    <textarea id="quarterly-goals" placeholder="请输入季度目标"></textarea>
                </div>
                
                <div class="form-group" id="quarterly-results-group">
                    <label for="quarterly-results">季度成果：</label>
                    <textarea id="quarterly-results" placeholder="请输入季度成果"></textarea>
                </div>
                
                <div class="form-group" id="review-items-group">
                    <label for="review-items">评审项目：</label>
                    <textarea id="review-items" placeholder="请输入评审项目"></textarea>
                </div>
                
                <div class="form-group" id="review-results-group">
                    <label for="review-results">评审结果：</label>
                    <textarea id="review-results" placeholder="请输入评审结果"></textarea>
                </div>
                
                <div class="form-group" id="improvement-suggestions-group">
                    <label for="improvement-suggestions">改进建议：</label>
                    <textarea id="improvement-suggestions" placeholder="请输入改进建议"></textarea>
                </div>
                
                <div class="form-group" id="project-summary-group">
                    <label for="project-summary">项目总结：</label>
                    <textarea id="project-summary" placeholder="请输入项目总结"></textarea>
                </div>
                
                <div class="form-group" id="lessons-learned-group">
                    <label for="lessons-learned">经验教训：</label>
                    <textarea id="lessons-learned" placeholder="请输入经验教训"></textarea>
                </div>
                
                <div class="form-group" id="conclusions-group">
                    <label for="conclusions">会议结论：</label>
                    <textarea id="conclusions" placeholder="请输入会议达成的结论和决定"></textarea>
                </div>
                
                <div class="action-items">
                    <label>重要行动事项：</label>
                    <div id="action-items-container">
                        <div class="action-item">
                            <input type="text" placeholder="行动内容">
                            <input type="text" placeholder="责任人">
                            <input type="date" placeholder="截止日期">
                            <button class="remove-action">删除</button>
                        </div>
                    </div>
                    <button class="add-action" id="add-action">+ 添加行动项</button>
                </div>
                
                <div class="button-group">
                    <button class="generate-btn" id="generate-btn">生成会议纪要</button>
                    <button class="reset-btn" id="reset-btn">重置表单</button>
                </div>
            </div>
            
            <div class="preview-section">
                <div class="section-title">
                    <h2>会议纪要预览</h2>
                </div>
                
                <div class="preview-content" id="preview-content">
                    生成的会议纪要将显示在这里...
                </div>
                
                <div class="edit-buttons">
                    <button class="edit-btn" id="edit-btn">编辑内容</button>
                    <button class="save-btn" id="save-btn">保存修改</button>
                    <button class="download-btn" id="download-btn">下载纪要</button>
                </div>
            </div>
        </div>
        
      
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 模板配置
            const templateConfig = {
                weekly: {
                    name: "周会",
                    fields: [
                        "meeting-title-group",
                        "meeting-date-group",
                        "meeting-time-group",
                        "meeting-location-group",
                        "meeting-host-group",
                        "meeting-recorder-group",
                        "participants-group",
                        "absentees-group",
                        "meeting-topics-group",
                        "last-week-progress-group",
                        "this-week-plan-group",
                        "conclusions-group"
                    ]
                },
                monthly: {
                    name: "月会",
                    fields: [
                        "meeting-title-group",
                        "meeting-date-group",
                        "meeting-time-group",
                        "meeting-location-group",
                        "meeting-host-group",
                        "meeting-recorder-group",
                        "participants-group",
                        "absentees-group",
                        "meeting-topics-group",
                        "monthly-summary-group",
                        "next-month-plan-group",
                        "conclusions-group"
                    ]
                },
                quarterly: {
                    name: "季度会",
                    fields: [
                        "meeting-title-group",
                        "meeting-date-group",
                        "meeting-time-group",
                        "meeting-location-group",
                        "meeting-host-group",
                        "meeting-recorder-group",
                        "participants-group",
                        "absentees-group",
                        "meeting-topics-group",
                        "quarterly-goals-group",
                        "quarterly-results-group",
                        "conclusions-group"
                    ]
                },
                review: {
                    name: "评审会",
                    fields: [
                        "meeting-title-group",
                        "meeting-date-group",
                        "meeting-time-group",
                        "meeting-location-group",
                        "meeting-host-group",
                        "meeting-recorder-group",
                        "participants-group",
                        "absentees-group",
                        "review-items-group",
                        "review-results-group",
                        "improvement-suggestions-group",
                        "conclusions-group"
                    ]
                },
                retrospective: {
                    name: "项目复盘",
                    fields: [
                        "meeting-title-group",
                        "meeting-date-group",
                        "meeting-time-group",
                        "meeting-location-group",
                        "meeting-host-group",
                        "meeting-recorder-group",
                        "participants-group",
                        "absentees-group",
                        "project-summary-group",
                        "lessons-learned-group",
                        "improvement-suggestions-group",
                        "conclusions-group"
                    ]
                }
            };
            
            // 模板选择
            const templateButtons = document.querySelectorAll('.template-btn');
            const templatePreviews = document.querySelectorAll('.template-preview');
            const allFormGroups = document.querySelectorAll('.form-group');
            
            templateButtons.forEach(button => {
                button.addEventListener('click', function() {
                    // 移除所有活动状态
                    templateButtons.forEach(btn => btn.classList.remove('active'));
                    templatePreviews.forEach(preview => preview.classList.remove('active'));
                    
                    // 设置当前活动状态
                    this.classList.add('active');
                    const template = this.getAttribute('data-template');
                    document.getElementById(`${template}-preview`).classList.add('active');
                    
                    // 根据模板类型显示/隐藏表单字段
                    updateFormFields(template);
                });
            });
            
            // 根据模板类型更新表单字段
            function updateFormFields(template) {
                // 隐藏所有表单组
                allFormGroups.forEach(group => {
                    group.classList.add('hidden');
                });
                
                // 显示当前模板需要的字段
                const fieldsToShow = templateConfig[template].fields;
                fieldsToShow.forEach(fieldId => {
                    document.getElementById(fieldId).classList.remove('hidden');
                });
                
                // 总是显示行动事项
                document.querySelector('.action-items').classList.remove('hidden');
            }
            
            // 添加行动项
            const addActionBtn = document.getElementById('add-action');
            const actionItemsContainer = document.getElementById('action-items-container');
            
            addActionBtn.addEventListener('click', function() {
                const actionItem = document.createElement('div');
                actionItem.className = 'action-item';
                actionItem.innerHTML = `
                    <input type="text" placeholder="行动内容">
                    <input type="text" placeholder="责任人">
                    <input type="date" placeholder="截止日期">
                    <button class="remove-action">删除</button>
                `;
                actionItemsContainer.appendChild(actionItem);
                
                // 为新删除按钮添加事件
                actionItem.querySelector('.remove-action').addEventListener('click', function() {
                    actionItem.remove();
                });
            });
            
            // 初始化删除按钮事件
            document.querySelectorAll('.remove-action').forEach(button => {
                button.addEventListener('click', function() {
                    this.parentElement.remove();
                });
            });
            
            // 生成会议纪要
            const generateBtn = document.getElementById('generate-btn');
            const previewContent = document.getElementById('preview-content');
            
            generateBtn.addEventListener('click', function() {
                // 获取表单数据
                const meetingTitle = document.getElementById('meeting-title').value || '未命名会议';
                const meetingDate = document.getElementById('meeting-date').value || '未指定日期';
                const meetingTime = document.getElementById('meeting-time').value || '未指定时间';
                const meetingLocation = document.getElementById('meeting-location').value || '未指定地点';
                const meetingHost = document.getElementById('meeting-host').value || '未指定主持人';
                const meetingRecorder = document.getElementById('meeting-recorder').value || '未指定记录人';
                const participants = document.getElementById('participants').value || '未指定参与人员';
                const absentees = document.getElementById('absentees').value || '无';
                const topics = document.getElementById('meeting-topics').value || '未讨论具体议题';
                const lastWeekProgress = document.getElementById('last-week-progress').value || '无';
                const thisWeekPlan = document.getElementById('this-week-plan').value || '无';
                const monthlySummary = document.getElementById('monthly-summary').value || '无';
                const nextMonthPlan = document.getElementById('next-month-plan').value || '无';
                const quarterlyGoals = document.getElementById('quarterly-goals').value || '无';
                const quarterlyResults = document.getElementById('quarterly-results').value || '无';
                const reviewItems = document.getElementById('review-items').value || '无';
                const reviewResults = document.getElementById('review-results').value || '无';
                const improvementSuggestions = document.getElementById('improvement-suggestions').value || '无';
                const projectSummary = document.getElementById('project-summary').value || '无';
                const lessonsLearned = document.getElementById('lessons-learned').value || '无';
                const conclusions = document.getElementById('conclusions').value || '未达成明确结论';
                
                // 获取行动项
                const actionItems = [];
                document.querySelectorAll('.action-item').forEach(item => {
                    const inputs = item.querySelectorAll('input');
                    if (inputs[0].value || inputs[1].value || inputs[2].value) {
                        actionItems.push({
                            action: inputs[0].value || '待确定',
                            responsible: inputs[1].value || '待指定',
                            deadline: inputs[2].value || '待确定'
                        });
                    }
                });
                
                // 获取当前活动模板
                const activeTemplate = document.querySelector('.template-btn.active').getAttribute('data-template');
                
                // 生成会议纪要
                let minutes = `会议纪要\n`;
                minutes += `====================\n\n`;
                minutes += `会议主题：${meetingTitle}\n`;
                minutes += `会议日期：${meetingDate} ${meetingTime}\n`;
                minutes += `会议地点：${meetingLocation}\n`;
                minutes += `会议类型：${templateConfig[activeTemplate].name}\n`;
                minutes += `会议主持人：${meetingHost}\n`;
                minutes += `会议记录人：${meetingRecorder}\n\n`;
                minutes += `参与人员：${participants}\n`;
                minutes += `缺席人员：${absentees}\n\n`;
                
                // 根据模板类型添加特定内容
                if (activeTemplate === 'weekly') {
                    minutes += `会议议题：\n${formatText(topics)}\n\n`;
                    minutes += `上周工作进展：\n${formatText(lastWeekProgress)}\n\n`;
                    minutes += `本周工作计划：\n${formatText(thisWeekPlan)}\n\n`;
                } else if (activeTemplate === 'monthly') {
                    minutes += `会议议题：\n${formatText(topics)}\n\n`;
                    minutes += `本月工作总结：\n${formatText(monthlySummary)}\n\n`;
                    minutes += `下月工作计划：\n${formatText(nextMonthPlan)}\n\n`;
                } else if (activeTemplate === 'quarterly') {
                    minutes += `会议议题：\n${formatText(topics)}\n\n`;
                    minutes += `季度目标：\n${formatText(quarterlyGoals)}\n\n`;
                    minutes += `季度成果：\n${formatText(quarterlyResults)}\n\n`;
                } else if (activeTemplate === 'review') {
                    minutes += `评审项目：\n${formatText(reviewItems)}\n\n`;
                    minutes += `评审结果：\n${formatText(reviewResults)}\n\n`;
                    minutes += `改进建议：\n${formatText(improvementSuggestions)}\n\n`;
                } else if (activeTemplate === 'retrospective') {
                    minutes += `项目总结：\n${formatText(projectSummary)}\n\n`;
                    minutes += `经验教训：\n${formatText(lessonsLearned)}\n\n`;
                    minutes += `改进建议：\n${formatText(improvementSuggestions)}\n\n`;
                }
                
                minutes += `会议结论：\n${formatText(conclusions)}\n\n`;
                
                if (actionItems.length > 0) {
                    minutes += `重要行动事项：\n`;
                    actionItems.forEach((item, index) => {
                        minutes += `${index + 1}. ${item.action}（负责人：${item.responsible}，截止日期：${item.deadline}）\n`;
                    });
                    minutes += `\n`;
                }
                
                minutes += `纪要生成时间：${new Date().toLocaleString()}\n`;
                
                // 显示预览
                previewContent.textContent = minutes;
            });
            
            // 格式化文本，正确处理换行符
            function formatText(text) {
                // 处理不同平台的换行符，统一为\n
                text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
                // 确保每个换行符后都有适当的缩进
                return text.split('\n').map(line => `  ${line}`).join('\n');
            }
            
            // 重置表单
            const resetBtn = document.getElementById('reset-btn');
            resetBtn.addEventListener('click', function() {
                // 清空所有输入字段
                document.querySelectorAll('input, textarea').forEach(field => {
                    field.value = '';
                });
                
                // 清空行动项，只保留一个
                const actionItems = document.querySelectorAll('.action-item');
                for (let i = 1; i < actionItems.length; i++) {
                    actionItems[i].remove();
                }
                
                // 重置第一个行动项
                const firstAction = actionItems[0];
                const inputs = firstAction.querySelectorAll('input');
                inputs[0].value = '';
                inputs[1].value = '';
                inputs[2].value = '';
                
                previewContent.textContent = '生成的会议纪要将显示在这里...';
            });
            
            // 编辑内容
            const editBtn = document.getElementById('edit-btn');
            const saveBtn = document.getElementById('save-btn');
            
            let isEditing = false;
            let originalContent = '';
            
            editBtn.addEventListener('click', function() {
                if (!isEditing) {
                    // 进入编辑模式
                    isEditing = true;
                    originalContent = previewContent.textContent;
                    previewContent.contentEditable = true;
                    previewContent.style.backgroundColor = '#fff';
                    previewContent.style.border = '2px solid #3498db';
                    editBtn.textContent = '取消编辑';
                    editBtn.style.background = '#e74c3c';
                } else {
                    // 取消编辑
                    isEditing = false;
                    previewContent.contentEditable = false;
                    previewContent.style.backgroundColor = '#f8f9fa';
                    previewContent.style.border = '1px solid #ddd';
                    previewContent.textContent = originalContent;
                    editBtn.textContent = '编辑内容';
                    editBtn.style.background = '#9b59b6';
                }
            });
            
            // 保存修改
            saveBtn.addEventListener('click', function() {
                if (isEditing) {
                    isEditing = false;
                    previewContent.contentEditable = false;
                    previewContent.style.backgroundColor = '#f8f9fa';
                    previewContent.style.border = '1px solid #ddd';
                    editBtn.textContent = '编辑内容';
                    editBtn.style.background = '#9b59b6';
                    alert('修改已保存！');
                } else {
                    alert('当前不在编辑模式，无需保存。');
                }
            });
            
            // 下载纪要
            const downloadBtn = document.getElementById('download-btn');
            downloadBtn.addEventListener('click', function() {
                const content = previewContent.textContent;
                if (content === '生成的会议纪要将显示在这里...') {
                    alert('请先生成会议纪要！');
                    return;
                }
                
                const blob = new Blob([content], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `会议纪要_${new Date().toISOString().split('T')[0]}.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });
            
            // 初始化表单字段显示
            updateFormFields('weekly');
        });
    </script>
</body>
</html>
