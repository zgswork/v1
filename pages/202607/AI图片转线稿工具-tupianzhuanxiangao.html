<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI图片转线稿工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: white;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            color: rgba(255,255,255,0.9);
            font-size: 1.1em;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .panel {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .panel:hover {
            transform: translateY(-5px);
        }

        .panel h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 1.3em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon {
            width: 20px;
            height: 20px;
            display: inline-block;
        }

        /* 上传区域 */
        .upload-area {
            border: 2px dashed #ddd;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: #667eea;
            background-color: #f8f9ff;
        }

        .upload-area.active {
            border-color: #667eea;
            background-color: #f0f4ff;
        }

        .file-input {
            display: none;
        }

        .upload-icon {
            font-size: 3em;
            color: #ddd;
            margin-bottom: 10px;
        }

        .preview-container {
            margin-top: 15px;
            text-align: center;
        }

        .preview-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.5s ease;
        }

        .preview-image.show {
            opacity: 1;
            transform: scale(1);
        }

        /* 处理区域 */
        .style-selector {
            margin-bottom: 15px;
        }

        .style-selector select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .style-selector select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
            position: relative;
            overflow: hidden;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(45deg, #5a67d8, #6b46c1);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #666;
            border: 2px solid #e0e0e0;
        }

        .btn-secondary:hover {
            background: #e9ecef;
            border-color: #667eea;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* 参数设置面板 */
        .params-panel {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9ff;
            border-radius: 8px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .params-panel.open {
            max-height: 300px;
        }

        .param-group {
            margin-bottom: 15px;
        }

        .param-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #555;
        }

        .param-group input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #ddd;
            outline: none;
            transition: background 0.3s ease;
        }

        .param-group input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .param-group input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
        }

        .param-value {
            float: right;
            color: #667eea;
            font-weight: 600;
        }

        /* 输出区域 */
        .result-container {
            text-align: center;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .result-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.5s ease;
        }

        .result-image.show {
            opacity: 1;
            transform: scale(1);
        }

        .loading {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .loading.show {
            display: flex;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .progress-bar {
            width: 200px;
            height: 6px;
            background: #f0f0f0;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(45deg, #667eea, #764ba2);
            border-radius: 3px;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* 底部信息 */
        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .footer p {
            color: white;
            margin-bottom: 10px;
        }

        .footer a {
            color: #ffd700;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .footer a:hover {
            color: #ffed4a;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .disclaimer {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 0.9em;
            color: rgba(255,255,255,0.8);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .container {
                padding: 15px;
            }
        }

        /* 错误提示 */
        .alert {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            z-index: 1000;
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }

        .alert.show {
            transform: translateX(0);
        }

        .alert-error {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
        }

        .alert-success {
            background: linear-gradient(45deg, #27ae60, #229954);
        }

        .unsupported {
            display: none;
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .unsupported h2 {
            color: #e74c3c;
            margin-bottom: 15px;
        }

        /* 隐藏Canvas */
        .hidden-canvas {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 AI图片转线稿工具</h1>
            <p>轻松将照片转换为精美线稿，支持多种艺术风格</p>
        </div>

        <div class="unsupported" id="unsupported">
            <h2>⚠️ 浏览器不支持</h2>
            <p>当前浏览器暂不支持本网页功能，请使用最新版Chrome/Edge/Safari。</p>
        </div>

        <div class="main-content" id="mainContent">
            <!-- 上传与预览区 -->
            <div class="panel">

                    <span class="icon">📤</span>
                    上传与预览
                </h3>
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📷</div>
                    <p>点击或拖拽图片到此处</p>
                    <p style="font-size: 0.9em; color: #666; margin-top: 5px;">
                        支持 JPG、PNG 格式，文件大小不超过 5MB

                    </select>
                </div>
                <button class="btn btn-primary" id="convertBtn" disabled>开始转换</button>

                <div class="params-panel" id="paramsPanel">
                    <div class="param-group">

                        <label>平滑度 <span class="param-value" id="smoothValue">50</span></label>
                        <input type="range" id="smoothSlider" min="0" max="100" value="50">
                    </div>
                    <div class="param-group">
                        <label>对比度 <span class="param-value" id="contrastValue">60</span></label>
                        <input type="range" id="contrastSlider" min="0" max="100" value="60">
                    </div>

        <div class="footer">

    <!-- 隐藏的工作画布 -->
    <canvas id="workCanvas" class="hidden-canvas"></canvas>

    <script>
        // 全局变量
        let uploadedImage = null;
        let isProcessing = false;

        // DOM元素
        const elements = {
            fileInput: document.getElementById('fileInput'),
            uploadArea: document.getElementById('uploadArea'),
            previewImage: document.getElementById('previewImage'),
            reuploadBtn: document.getElementById('reuploadBtn'),
            styleSelect: document.getElementById('styleSelect'),
            convertBtn: document.getElementById('convertBtn'),
            paramsBtn: document.getElementById('paramsBtn'),
            resetBtn: document.getElementById('resetBtn'),
            paramsPanel: document.getElementById('paramsPanel'),
            intensitySlider: document.getElementById('intensitySlider'),
            smoothSlider: document.getElementById('smoothSlider'),
            contrastSlider: document.getElementById('contrastSlider'),
            intensityValue: document.getElementById('intensityValue'),
            smoothValue: document.getElementById('smoothValue'),
            contrastValue: document.getElementById('contrastValue'),
            resultContainer: document.getElementById('resultContainer'),
            resultCanvas: document.getElementById('resultCanvas'),
            loading: document.getElementById('loading'),
            progressFill: document.getElementById('progressFill'),
            downloadBtn: document.getElementById('downloadBtn'),
            workCanvas: document.getElementById('workCanvas'),
            mainContent: document.getElementById('mainContent'),
            unsupported: document.getElementById('unsupported')
        };

        // 检查浏览器兼容性
        function checkBrowserSupport() {
            const hasCanvas = !!document.createElement('canvas').getContext;
            const hasFileReader = window.File && window.FileReader && window.FileList && window.Blob;
            
            if (!hasCanvas || !hasFileReader) {
                elements.mainContent.style.display = 'none';
                elements.unsupported.style.display = 'block';
                return false;
            }
            return true;
        }

        // 显示提示消息
        function showAlert(message, type = 'error') {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            document.body.appendChild(alert);
            
            setTimeout(() => alert.classList.add('show'), 100);
            setTimeout(() => {
                alert.classList.remove('show');
                setTimeout(() => document.body.removeChild(alert), 300);
            }, 3000);
        }

        // 文件验证
        function validateFile(file) {
            const validTypes = ['image/jpeg', 'image/jpg', 'image/png'];
            const maxSize = 5 * 1024 * 1024; // 5MB

            if (!validTypes.includes(file.type)) {
                showAlert('请上传 JPG 或 PNG 格式的图片文件');
                return false;
            }

            if (file.size > maxSize) {
                showAlert('文件大小不能超过 5MB');
                return false;
            }

            return true;
        }

        // 处理文件上传
        function handleFileUpload(file) {
            if (!validateFile(file)) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedImage = new Image();
                uploadedImage.onload = function() {
                    elements.previewImage.src = e.target.result;
                    elements.previewImage.classList.add('show');
                    elements.reuploadBtn.style.display = 'block';
                    elements.convertBtn.disabled = false;
                    elements.uploadArea.classList.add('active');
                    showAlert('图片上传成功！', 'success');
                };
                uploadedImage.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // 图像处理核心算法
        class ImageProcessor {
            static toGrayscale(imageData) {
                const data = imageData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const gray = Math.round(0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]);
                    data[i] = data[i + 1] = data[i + 2] = gray;
                }
                return imageData;
            }

            static sobelEdgeDetection(imageData, intensity = 0.7) {
                const data = imageData.data;
                const width = imageData.width;
                const height = imageData.height;
                const result = new Uint8ClampedArray(data.length);

                const sobelX = [[-1, 0, 1], [-2, 0, 2], [-1, 0, 1]];
                const sobelY = [[-1, -2, -1], [0, 0, 0], [1, 2, 1]];

                for (let y = 1; y < height - 1; y++) {
                    for (let x = 1; x < width - 1; x++) {
                        let gx = 0, gy = 0;

                        for (let ky = -1; ky <= 1; ky++) {
                            for (let kx = -1; kx <= 1; kx++) {
                                const pos = ((y + ky) * width + (x + kx)) * 4;
                                const pixel = data[pos];
                                gx += pixel * sobelX[ky + 1][kx + 1];
                                gy += pixel * sobelY[ky + 1][kx + 1];
                            }
                        }

                        const magnitude = Math.sqrt(gx * gx + gy * gy) * intensity;
                        const edge = 255 - Math.min(255, magnitude);
                        const pos = (y * width + x) * 4;
                        
                        result[pos] = edge;
                        result[pos + 1] = edge;
                        result[pos + 2] = edge;
                        result[pos + 3] = 255;
                    }
                }

                return new ImageData(result, width, height);
            }

            static applyStyle(imageData, style, params) {
                const { intensity, smooth, contrast } = params;
                let result = this.toGrayscale(imageData);

                switch (style) {
                    case 'sketch':
                        result = this.sobelEdgeDetection(result, intensity / 100);
                        result = this.adjustContrast(result, contrast / 100);
                        break;
                    case 'cartoon':
                        result = this.cartoonEffect(result, intensity / 100, smooth / 100);
                        break;
                    case 'pencil':
                        result = this.pencilEffect(result, intensity / 100, smooth / 100);
                        break;
                }

                return result;
            }

            static adjustContrast(imageData, factor) {
                const data = imageData.data;
                const intercept = 128 * (1 - factor);

                for (let i = 0; i < data.length; i += 4) {
                    data[i] = Math.max(0, Math.min(255, data[i] * factor + intercept));
                    data[i + 1] = Math.max(0, Math.min(255, data[i + 1] * factor + intercept));
                    data[i + 2] = Math.max(0, Math.min(255, data[i + 2] * factor + intercept));
                }

                return imageData;
            }

            static cartoonEffect(imageData, intensity, smooth) {
                let result = this.sobelEdgeDetection(imageData, intensity);
                result = this.gaussianBlur(result, smooth * 2);
                return this.adjustContrast(result, 1.2);
            }

            static pencilEffect(imageData, intensity, smooth) {
                let result = this.sobelEdgeDetection(imageData, intensity * 0.8);
                result = this.gaussianBlur(result, smooth);
                return this.addTexture(result);
            }

            static gaussianBlur(imageData, radius) {
                if (radius <= 0) return imageData;
                
                const data = imageData.data;
                const width = imageData.width;
                const height = imageData.height;
                const result = new Uint8ClampedArray(data.length);
                
                const kernel = this.createGaussianKernel(Math.ceil(radius));
                const kernelSize = kernel.length;
                const half = Math.floor(kernelSize / 2);

                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        let r = 0, g = 0, b = 0, weight = 0;

                        for (let ky = -half; ky <= half; ky++) {
                            for (let kx = -half; kx <= half; kx++) {
                                const py = Math.max(0, Math.min(height - 1, y + ky));
                                const px = Math.max(0, Math.min(width - 1, x + kx));
                                const pos = (py * width + px) * 4;
                                const w = kernel[ky + half] * kernel[kx + half];

                                r += data[pos] * w;
                                g += data[pos + 1] * w;
                                b += data[pos + 2] * w;
                                weight += w;
                            }
                        }

                        const pos = (y * width + x) * 4;
                        result[pos] = r / weight;
                        result[pos + 1] = g / weight;
                        result[pos + 2] = b / weight;
                        result[pos + 3] = data[pos + 3];
                    }
                }

                return new ImageData(result, width, height);
            }

            static createGaussianKernel(radius) {
                const size = radius * 2 + 1;
                const kernel = new Array(size);
                const sigma = radius / 3;
                const norm = 1 / (Math.sqrt(2 * Math.PI) * sigma);
                const coeff = -1 / (2 * sigma * sigma);

                let sum = 0;
                for (let i = 0; i < size; i++) {
                    const x = i - radius;
                    kernel[i] = norm * Math.exp(coeff * x * x);
                    sum += kernel[i];
                }

                for (let i = 0; i < size; i++) {
                    kernel[i] /= sum;
                }

                return kernel;
            }

            static addTexture(imageData) {
                const data = imageData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const noise = (Math.random() - 0.5) * 10;
                    data[i] = Math.max(0, Math.min(255, data[i] + noise));
                    data[i + 1] = Math.max(0, Math.min(255, data[i + 1] + noise));
                    data[i + 2] = Math.max(0, Math.min(255, data[i + 2] + noise));
                }
                return imageData;
            }
        }

        // 执行图像转换
        async function convertImage() {
            if (!uploadedImage || isProcessing) return;

            isProcessing = true;
            elements.convertBtn.disabled = true;
            elements.loading.classList.add('show');
            elements.resultCanvas.classList.remove('show');

            try {
                // 模拟处理进度
                const progressSteps = [20, 40, 60, 80, 100];
                for (let i = 0; i < progressSteps.length; i++) {
                    elements.progressFill.style.width = progressSteps[i] + '%';
                    await new Promise(resolve => setTimeout(resolve, 200));
                }

                // 准备画布
                const canvas = elements.workCanvas;
                const ctx = canvas.getContext('2d');
                
                // 计算适当的尺寸（保持宽高比，最大800px）
                const maxSize = 800;
                let { width, height } = uploadedImage;
                
                if (width > height && width > maxSize) {
                    height = (height * maxSize) / width;
                    width = maxSize;
                } else if (height > maxSize) {
                    width = (width * maxSize) / height;
                    height = maxSize;
                }

                canvas.width = width;
                canvas.height = height;
                
                // 绘制原图像
                ctx.drawImage(uploadedImage, 0, 0, width, height);
                
                // 获取图像数据
                const imageData = ctx.getImageData(0, 0, width, height);
                
                // 获取处理参数
                const params = {
                    intensity: parseInt(elements.intensitySlider.value),
                    smooth: parseInt(elements.smoothSlider.value),
                    contrast: parseInt(elements.contrastSlider.value)
                };
                
                // 应用图像处理
                const style = elements.styleSelect.value;
                const processedData = ImageProcessor.applyStyle(imageData, style, params);
                
                // 显示结果
                const resultCanvas = elements.resultCanvas;
                const resultCtx = resultCanvas.getContext('2d');
                resultCanvas.width = width;
                resultCanvas.height = height;
                resultCtx.putImageData(processedData, 0, 0);
                
                // 显示结果
                elements.loading.classList.remove('show');
                elements.resultCanvas.classList.add('show');
                elements.downloadBtn.disabled = false;
                
                showAlert('线稿转换完成！', 'success');
                
            } catch (error) {
                console.error('转换过程中出现错误:', error);
                showAlert('转换过程中出现错误，请重试');
                elements.loading.classList.remove('show');
            } finally {
                isProcessing = false;
                elements.convertBtn.disabled = false;
                elements.progressFill.style.width = '0%';
            }
        }

        // 下载图像
        function downloadImage() {
            const canvas = elements.resultCanvas;
            const link = document.createElement('a');
            const timestamp = new Date().getTime();
            
            link.download = `sketch_${timestamp}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            
            showAlert('线稿已保存到下载文件夹', 'success');
        }

        // 重置应用
        function resetApp() {
            uploadedImage = null;
            elements.previewImage.src = '';
            elements.previewImage.classList.remove('show');
            elements.resultCanvas.classList.remove('show');
            elements.reuploadBtn.style.display = 'none';
            elements.uploadArea.classList.remove('active');
            elements.convertBtn.disabled = true;
            elements.downloadBtn.disabled = true;
            elements.fileInput.value = '';
            elements.progressFill.style.width = '0%';
            
            showAlert('画布已重置', 'success');
        }

        // 事件监听器
        function initEventListeners() {
            // 文件上传
            elements.fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) handleFileUpload(file);
            });

            // 拖拽上传
            elements.uploadArea.addEventListener('click', () => {
                elements.fileInput.click();
            });

            elements.uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                elements.uploadArea.classList.add('dragover');
            });

            elements.uploadArea.addEventListener('dragleave', () => {
                elements.uploadArea.classList.remove('dragover');
            });

            elements.uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                elements.uploadArea.classList.remove('dragover');
                const file = e.dataTransfer.files[0];
                if (file) handleFileUpload(file);
            });

            // 按钮事件
            elements.reuploadBtn.addEventListener('click', () => {
                elements.fileInput.click();
            });

            elements.convertBtn.addEventListener('click', convertImage);
            elements.downloadBtn.addEventListener('click', downloadImage);
            elements.resetBtn.addEventListener('click', resetApp);

            // 参数面板切换
            elements.paramsBtn.addEventListener('click', () => {
                elements.paramsPanel.classList.toggle('open');
            });

            // 参数滑块事件
            elements.intensitySlider.addEventListener('input', (e) => {
                elements.intensityValue.textContent = e.target.value;
            });

            elements.smoothSlider.addEventListener('input', (e) => {
                elements.smoothValue.textContent = e.target.value;
            });

            elements.contrastSlider.addEventListener('input', (e) => {
                elements.contrastValue.textContent = e.target.value;
            });
        }

        // 初始化应用
        function initApp() {
            if (!checkBrowserSupport()) return;
            
            initEventListeners();
            console.log('AI图片转线稿工具已初始化');
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
