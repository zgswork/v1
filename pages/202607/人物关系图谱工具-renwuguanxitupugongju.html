<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人物关系图谱工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #4CAF50, #66BB6A);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: #2E7D32;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .main-content {
            display: grid;
            grid-template-columns: 300px 1fr;
            min-height: 600px;
        }

        .sidebar {
            background: #F1F8E9;
            padding: 20px;
            border-right: 1px solid #C8E6C9;
        }

        .graph-area {
            position: relative;
            background: white;
            overflow: hidden;
        }

        #graphCanvas {
            width: 100%;
            height: 100%;
            border: none;
        }

        .control-panel {
            margin-bottom: 20px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #2E7D32;
        }

        .control-group input, .control-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #C8E6C9;
            border-radius: 5px;
            font-size: 14px;
        }

        .btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin: 2px;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #45a049;
        }

        .btn-danger {
            background: #f44336;
        }

        .btn-danger:hover {
            background: #da190b;
        }

        .person-list {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #C8E6C9;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .person-item {
            padding: 5px;
            margin: 2px 0;
            background: #E8F5E8;
            border-radius: 3px;
            cursor: pointer;
        }

        .person-item:hover {
            background: #C8E6C9;
        }

        .footer {
            background: #2E7D32;
            color: white;
            padding: 15px;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .footer-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .footer-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 300px;
            border-radius: 10px;
            text-align: center;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: #000;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .sidebar {
                order: 2;
            }
            
            .graph-area {
                order: 1;
                height: 400px;
            }
            
            .header {
                font-size: 20px;
            }
            
            .footer {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            人物关系图谱工具
        </div>
        
        <div class="main-content">
            <div class="sidebar">
                <div class="control-panel">
                    <h3>人物管理</h3>
                    <div class="control-group">
                        <label>人物名称:</label>
                        <input type="text" id="personName" placeholder="输入人物名称">
                        <button class="btn" onclick="addPerson()">添加人物</button>
                    </div>
                    
                    <div class="control-group">
                        <label>人物列表:</label>
                        <div class="person-list" id="personList"></div>
                    </div>

                    <h3>关系管理</h3>
                    <div class="control-group">
                        <label>选择人物A:</label>
                        <select id="personA"></select>
                    </div>
                    <div class="control-group">
                        <label>关系类型:</label>
                        <input type="text" id="relationType" list="relationOptions" placeholder="选择或输入关系类型">
                        <datalist id="relationOptions">
                            <option value="朋友">
                            <option value="家人">
                            <option value="同事">
                            <option value="恋人">
                            <option value="敌对">
                            <option value="师生">
                            <option value="父子">
                            <option value="母子">
                            <option value="兄弟">
                            <option value="姐妹">
                            <option value="上下级">
                            <option value="合作伙伴">
                        </datalist>
                    </div>
                    <div class="control-group">
                        <label>选择人物B:</label>
                        <select id="personB"></select>
                    </div>
                    <button class="btn" onclick="addRelation()">建立关系</button>
                    
                    <div class="control-group">
                        <button class="btn" onclick="generateGraph()">生成图谱</button>
                        <button class="btn btn-danger" onclick="clearData()">清空数据</button>
                        <button class="btn" onclick="debugData()">调试数据</button>
                    </div>
                    
                    <div class="control-group">
                        <button class="btn" onclick="exportData()">导出数据</button>
                        <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importData(event)">
                        <button class="btn" onclick="document.getElementById('importFile').click()">导入数据</button>
                    </div>
                </div>
            </div>
            
            <div class="graph-area">
                <canvas id="graphCanvas"></canvas>
            </div>
        </div>
        
        <div class="footer">
            <div class="footer-btn" onclick="showDeveloper()">开发：兔子先生</div>
            <div class="footer-btn" onclick="showSupport()">技术支持：AI编程星球</div>
        </div>
    </div>

    <!-- 弹窗 -->
    <div id="developerModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('developerModal')">&times;</span>
            <h3>合作联系</h3>
            <p>vx：l932371716</p>
        </div>
    </div>

    <div id="supportModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('supportModal')">&times;</span>
            <h3>技术支持</h3>
            <p><a href="https://t.zsxq.com/y1934" target="_blank">访问AI编程星球</a></p>
        </div>
    </div>

    <script>
        let persons = [];
        let relations = [];
        let canvas, ctx;
        let nodes = [];
        let edges = [];

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            canvas = document.getElementById('graphCanvas');
            ctx = canvas.getContext('2d');
            
            // 设置画布大小
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            // 加载保存的数据
            loadData();
            updatePersonList();
            updateSelects();
            generateGraph();
        });

        function resizeCanvas() {
            const container = document.querySelector('.graph-area');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            generateGraph();
        }

        function addPerson() {
            const name = document.getElementById('personName').value.trim();
            if (!name) {
                alert('请输入人物名称！');
                return;
            }
            
            if (persons.some(p => p.name === name)) {
                alert('该人物已存在！');
                return;
            }
            
            persons.push({
                id: Date.now(),
                name: name,
                x: Math.random() * (canvas.width - 100) + 50,
                y: Math.random() * (canvas.height - 100) + 50
            });
            
            document.getElementById('personName').value = '';
            updatePersonList();
            updateSelects();
            saveData();
            generateGraph();
        }

        function removePerson(personId) {
            persons = persons.filter(p => p.id !== personId);
            relations = relations.filter(r => r.personA !== personId && r.personB !== personId);
            updatePersonList();
            updateSelects();
            saveData();
            generateGraph();
        }

        function addRelation() {
            const personA = parseInt(document.getElementById('personA').value);
            const personB = parseInt(document.getElementById('personB').value);
            const relationType = document.getElementById('relationType').value;
            
            if (!personA || !personB) {
                alert('请选择两个人物！');
                return;
            }
            
            if (personA === personB) {
                alert('不能选择同一个人！');
                return;
            }
            
            if (relations.some(r => 
                (r.personA === personA && r.personB === personB) || 
                (r.personA === personB && r.personB === personA))) {
                alert('该关系已存在！');
                return;
            }
            
            relations.push({
                id: Date.now(),
                personA: personA,
                personB: personB,
                type: relationType
            });
            
            saveData();
            generateGraph();
        }

        function updatePersonList() {
            const list = document.getElementById('personList');
            list.innerHTML = '';
            
            persons.forEach(person => {
                const item = document.createElement('div');
                item.className = 'person-item';
                item.innerHTML = `
                    ${person.name}
                    <button class="btn btn-danger" style="float: right; padding: 2px 8px; font-size: 12px;" 
                            onclick="removePerson(${person.id})">删除</button>
                `;
                list.appendChild(item);
            });
        }

        function updateSelects() {
            const selectA = document.getElementById('personA');
            const selectB = document.getElementById('personB');
            
            selectA.innerHTML = '<option value="">选择人物</option>';
            selectB.innerHTML = '<option value="">选择人物</option>';
            
            persons.forEach(person => {
                selectA.innerHTML += `<option value="${person.id}">${person.name}</option>`;
                selectB.innerHTML += `<option value="${person.id}">${person.name}</option>`;
            });
        }

        function generateGraph() {
            try {
                if (!ctx) {
                    console.error('画布上下文未初始化');
                    return;
                }
                
                // 动态调整画布大小
                const baseSize = 400;
                const personCount = persons.length || 0;
                const dynamicSize = Math.max(baseSize, Math.min(1200, baseSize + personCount * 80));
                
                canvas.width = dynamicSize;
                canvas.height = dynamicSize;
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                if (!persons || persons.length === 0) return;
                
                // 过滤有效的人物
                persons = persons.filter(p => p && p.id && p.name);
                relations = relations.filter(r => r && r.personA && r.personB);
                
                // 计算节点位置 - 使用更大的半径
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const radius = Math.min(canvas.width, canvas.height) * 0.4;
                
                persons.forEach((person, index) => {
                    if (persons.length > 1) {
                        const angle = (index * 2 * Math.PI) / persons.length;
                        person.x = centerX + radius * Math.cos(angle);
                        person.y = centerY + radius * Math.sin(angle);
                    } else {
                        person.x = centerX;
                        person.y = centerY;
                    }
                });
            
            // 绘制边
            relations.forEach(relation => {
                const personA = persons.find(p => p.id === relation.personA);
                const personB = persons.find(p => p.id === relation.personB);
                
                if (personA && personB) {
                    ctx.beginPath();
                    ctx.moveTo(personA.x, personA.y);
                    ctx.lineTo(personB.x, personB.y);
                    ctx.strokeStyle = '#4CAF50';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    
                    // 绘制关系标签
                    const midX = (personA.x + personB.x) / 2;
                    const midY = (personA.y + personB.y) / 2;
                    ctx.fillStyle = '#2E7D32';
                    ctx.font = '12px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(relation.type, midX, midY - 5);
                }
            });
            
            // 绘制节点
            persons.forEach(person => {
                // 节点圆圈
                ctx.beginPath();
                ctx.arc(person.x, person.y, 30, 0, 2 * Math.PI);
                ctx.fillStyle = '#4CAF50';
                ctx.fill();
                ctx.strokeStyle = '#2E7D32';
                ctx.lineWidth = 3;
                ctx.stroke();
                
                // 人物名称
                ctx.fillStyle = 'white';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(person.name, person.x, person.y);
            });
        } catch (error) {
            console.error('生成图谱时出错:', error);
            alert('生成图谱时出错，请检查数据格式');
        }
        }

        function clearData() {
            if (confirm('确定要清空所有数据吗？')) {
                persons = [];
                relations = [];
                localStorage.removeItem('personGraphData');
                updatePersonList();
                updateSelects();
                generateGraph();
            }
        }

        function saveData() {
            const data = {
                persons: persons,
                relations: relations
            };
            localStorage.setItem('personGraphData', JSON.stringify(data));
        }

        function loadData() {
            const saved = localStorage.getItem('personGraphData');
            if (saved) {
                const data = JSON.parse(saved);
                persons = data.persons || [];
                relations = data.relations || [];
                
                // 确保ID为数字类型
                persons.forEach(p => p.id = Number(p.id));
                relations.forEach(r => {
                    r.id = Number(r.id);
                    r.personA = Number(r.personA);
                    r.personB = Number(r.personB);
                });
            }
        }

        function exportData() {
            const data = {
                persons: persons,
                relations: relations
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '人物关系图谱数据.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        
                        // 验证数据结构
                        if (!Array.isArray(data.persons) || !Array.isArray(data.relations)) {
                            throw new Error('数据格式错误：persons和relations必须是数组');
                        }
                        
                        // 清理和验证人物数据
                        persons = (data.persons || []).filter(p => 
                            p && 
                            typeof p === 'object' && 
                            p.id !== undefined && 
                            p.name && 
                            typeof p.name === 'string'
                        ).map(p => ({
                            id: Number(p.id),
                            name: String(p.name).trim()
                        }));
                        
                        // 清理和验证关系数据
                        relations = (data.relations || []).filter(r => 
                            r && 
                            typeof r === 'object' &&
                            r.personA !== undefined && 
                            r.personB !== undefined &&
                            r.type &&
                            typeof r.type === 'string'
                        ).map(r => ({
                            id: Number(r.id || Date.now() + Math.random()),
                            personA: Number(r.personA),
                            personB: Number(r.personB),
                            type: String(r.type).trim()
                        }));
                        
                        // 验证关系引用的ID是否存在于人物中
                        const personIds = new Set(persons.map(p => p.id));
                        relations = relations.filter(r => 
                            personIds.has(r.personA) && 
                            personIds.has(r.personB) &&
                            r.personA !== r.personB
                        );
                        
                        updatePersonList();
                        updateSelects();
                        saveData();
                        
                        // 延迟执行，确保画布已准备好
                        setTimeout(() => {
                            resizeCanvas();
                            generateGraph();
                        }, 200);
                        
                        alert(`数据导入成功！共导入${persons.length}个人物和${relations.length}个关系`);
                        
                    } catch (error) {
                        console.error('导入错误:', error);
                        alert('数据格式错误，导入失败！\n错误详情：' + error.message);
                    }
                };
                reader.readAsText(file);
            }
        }

        function showDeveloper() {
            document.getElementById('developerModal').style.display = 'block';
        }

        function showSupport() {
            document.getElementById('supportModal').style.display = 'block';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        // 点击空白处关闭弹窗
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
            }
        }

        function debugData() {
            console.log('人物数据:', persons);
            console.log('关系数据:', relations);
            console.log('画布尺寸:', canvas.width, 'x', canvas.height);
            
            alert(`数据调试信息：\n人物数量: ${persons.length}\n关系数量: ${relations.length}\n画布尺寸: ${canvas.width} x ${canvas.height}`);
        }

        // 回车键添加人物
        document.getElementById('personName').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addPerson();
            }
        });
    </script>
</body>
</html>
