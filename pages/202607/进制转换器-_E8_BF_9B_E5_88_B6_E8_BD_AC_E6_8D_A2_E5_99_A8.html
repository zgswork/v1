<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>进制转换器</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        .converter {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        .result {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            background-color: #e8f5e9;
            display: none;
        }
        .error {
            background-color: #ffebee;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="converter">
        <div class="input-group">
            <label for="number">输入数字：</label>
            <input type="text" id="number" placeholder="例如：1010, A1, 255">
        </div>
        
        <div class="input-group">
            <label for="fromBase">从：</label>
            <select id="fromBase">
                <option value="2">二进制</option>
                <option value="8">八进制</option>
                <option value="10" selected>十进制</option>
                <option value="16">十六进制</option>
            </select>
        </div>
        
        <div class="input-group">
            <label for="toBase">转换为：</label>
            <select id="toBase">
                <option value="2">二进制</option>
                <option value="8">八进制</option>
                <option value="10">十进制</option>
                <option value="16" selected>十六进制</option>
            </select>
        </div>
        
        <button onclick="convert()">转换</button>
        
        <div id="result" class="result"></div>
    </div>
    
    <div class="footer">
        由兔子先生用deepseek生成
    </div>

    <script>
        function convert() {
            const number = document.getElementById('number').value.trim();
            const fromBase = parseInt(document.getElementById('fromBase').value);
            const toBase = parseInt(document.getElementById('toBase').value);
            const resultElement = document.getElementById('result');
            
            resultElement.style.display = "none";
            resultElement.className = "result";
            
            if (!number) {
                showResult("请输入要转换的数字", false);
                return;
            }
            
            try {
                const decimal = parseInt(number, fromBase);
                if (isNaN(decimal)) {
                    throw new Error("无效的数字格式");
                }
                
                let converted;
                if (toBase === 16) {
                    converted = decimal.toString(16).toUpperCase();
                } else {
                    converted = decimal.toString(toBase);
                }
                
                showResult(`转换结果: ${converted}`);
            } catch (e) {
                showResult("转换失败: " + e.message, false);
            }
        }
        
        function showResult(message, isSuccess = true) {
            const resultElement = document.getElementById('result');
            resultElement.textContent = message;
            resultElement.style.display = "block";
            if (!isSuccess) {
                resultElement.classList.add("error");
            }
        }
    </script>
</body>
</html>
