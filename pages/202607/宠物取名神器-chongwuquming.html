        // 已生成的名字索引，避免重复
        let generatedIndices = [];

        // 生成宠物名函数
        function generatePetNames() {
            const petType = petTypeSelect.value;
            const furColor = furColorSelect.value;
            const nameStyle = nameStyleSelect.value;
            
            // 验证输入
            if (!petType || !furColor || !nameStyle) {
                alert('请先选择所有选项！');
                return;
            }
            
            // 获取对应类型的名字列表
            const names = nameDatabase[nameStyle];
            
            // 重置已生成索引（如果已经生成过所有名字）
            if (generatedIndices.length >= names.length) {
                generatedIndices = [];
            }
            
            // 生成10个不重复的名字
            const resultNames = [];
            let attempts = 0;
            const maxAttempts = 100;
            
            while (resultNames.length < 10 && attempts < maxAttempts) {
                attempts++;
                const randomIndex = Math.floor(Math.random() * names.length);
                
                // 检查是否已经生成过
                if (!generatedIndices.includes(randomIndex)) {
                    resultNames.push(names[randomIndex]);
                    generatedIndices.push(randomIndex);
                }
            }
            
            // 显示结果
            displayResults(resultNames);
        }
        
        // 显示结果函数
        function displayResults(names) {
            // 清空之前的结果
            nameListDiv.innerHTML = '';
            
            // 添加新结果
            names.forEach(name => {
                const nameElement = document.createElement('div');
                nameElement.className = 'name-item';
                nameElement.textContent = name;
                nameListDiv.appendChild(nameElement);
            });
            
            // 显示结果区域
            resultsDiv.style.display = 'block';
        }
