<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>散点图制作工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            padding: 40px;
        }

        .data-input-section {
            background: #fef7ff;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border: 2px solid #f5e6ff;
        }

        .section-title {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-methods {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .input-method {
            background: white;
            border: 2px solid #f5e6ff;
            border-radius: 10px;
            padding: 20px;
        }

        .method-title {
            font-weight: 600;
            color: #f093fb;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        .data-table th,
        .data-table td {
            border: 1px solid #f5e6ff;
            padding: 8px;
            text-align: center;
        }

        .data-table th {
            background: #fef7ff;
            font-weight: 600;
            color: #333;
        }

        .data-table input {
            width: 100%;
            border: none;
            padding: 5px;
            text-align: center;
            font-size: 14px;
        }

        .data-table input:focus {
            outline: 2px solid #f093fb;
            border-radius: 3px;
        }

        .csv-input {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            border: 2px solid #f5e6ff;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
        }

        .csv-input:focus {
            outline: none;
            border-color: #f093fb;
        }

        .csv-hint {
            color: #666;
            font-size: 0.9em;
            margin-top: 10px;
        }

        .table-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-weight: 500;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(240, 147, 251, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.8em;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
        }

        .btn-success {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
        }

        .btn-danger {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }

        .chart-settings {
            background: white;
            border: 2px solid #f5e6ff;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .setting-group {
            background: #fef7ff;
            border: 1px solid #f5e6ff;
            border-radius: 10px;
            padding: 20px;
        }

        .setting-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            display: block;
        }

        .setting-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #f5e6ff;
            border-radius: 6px;
            font-size: 14px;
        }

        .setting-input:focus {
            outline: none;
            border-color: #f093fb;
        }

        .chart-preview {
            background: white;
            border: 2px solid #f5e6ff;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: #fef7ff;
            border: 2px solid #f5e6ff;
            border-radius: 10px;
            padding: 20px;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #chartCanvas {
            max-width: 100%;
            max-height: 400px;
        }

        .placeholder {
            color: #666;
            text-align: center;
            font-size: 1.1em;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .btn-large {
            padding: 12px 24px;
            font-size: 1em;
            min-width: 120px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
            color: #f093fb;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #f093fb;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 8px;
            padding: 15px;
            color: #721c24;
            margin-top: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            padding: 15px;
            color: #155724;
            margin-top: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .data-preview {
            background: #fff;
            border: 1px solid #f5e6ff;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
        }

        .preview-title {
            font-weight: 600;
            color: #f093fb;
            margin-bottom: 10px;
        }

        .preview-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }

        .preview-table th,
        .preview-table td {
            border: 1px solid #f5e6ff;
            padding: 6px 8px;
            text-align: center;
        }

        .preview-table th {
            background: #fef7ff;
            font-weight: 600;
        }

        .stats-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .stat-item {
            background: #fef7ff;
            border: 1px solid #f5e6ff;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.2em;
            font-weight: 600;
            color: #f093fb;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 15px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 2em;
            }

            .main-content {
                padding: 20px;
            }

            .input-methods {
                grid-template-columns: 1fr;
            }

            .settings-grid {
                grid-template-columns: 1fr;
            }

            .action-buttons {
                flex-direction: column;
            }

            .table-controls {
                flex-direction: column;
            }

            .stats-info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔵 散点图制作工具</h1>
            <p>创建专业的散点图，分析两个变量之间的相关性和分布规律</p>
        </div>

        <div class="main-content">
            <!-- 数据输入区域 -->
            <div class="data-input-section">
                <div class="section-title">
                    <span>📝</span>
                    数据输入
                </div>
                
                <div class="input-methods">
                    <div class="input-method">
                        <div class="method-title">
                            <span>📋</span>
                            表格输入
                        </div>
                        
                        <div class="table-controls">
                            <button class="btn btn-small" id="addRowBtn">
                                <span>➕</span>
                                添加行
                            </button>
                            <button class="btn btn-small btn-danger" id="removeRowBtn">
                                <span>➖</span>
                                删除行
                            </button>
                            <button class="btn btn-small btn-secondary" id="generateRandomBtn">
                                <span>🎲</span>
                                生成随机数据
                            </button>
                            <button class="btn btn-small btn-secondary" id="clearDataBtn">
                                <span>🗑️</span>
                                清空数据
                            </button>
                        </div>
                        
                        <table class="data-table" id="dataTable">
                            <thead>
                                <tr>
                                    <th>X坐标</th>
                                    <th>Y坐标</th>
                                    <th>标签</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><input type="number" value="10" placeholder="X值" step="0.1"></td>
                                    <td><input type="number" value="20" placeholder="Y值" step="0.1"></td>
                                    <td><input type="text" value="点1" placeholder="标签（可选）"></td>
                                </tr>
                                <tr>
                                    <td><input type="number" value="20" placeholder="X值" step="0.1"></td>
                                    <td><input type="number" value="35" placeholder="Y值" step="0.1"></td>
                                    <td><input type="text" value="点2" placeholder="标签（可选）"></td>
                                </tr>
                                <tr>
                                    <td><input type="number" value="30" placeholder="X值" step="0.1"></td>
                                    <td><input type="number" value="45" placeholder="Y值" step="0.1"></td>
                                    <td><input type="text" value="点3" placeholder="标签（可选）"></td>
                                </tr>
                                <tr>
                                    <td><input type="number" value="40" placeholder="X值" step="0.1"></td>
                                    <td><input type="number" value="55" placeholder="Y值" step="0.1"></td>
                                    <td><input type="text" value="点4" placeholder="标签（可选）"></td>
                                </tr>
                                <tr>
                                    <td><input type="number" value="50" placeholder="X值" step="0.1"></td>
                                    <td><input type="number" value="70" placeholder="Y值" step="0.1"></td>
                                    <td><input type="text" value="点5" placeholder="标签（可选）"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    
                    <div class="input-method">
                        <div class="method-title">
                            <span>📄</span>
                            CSV格式输入
                        </div>
                        
                        <textarea id="csvInput" class="csv-input" placeholder="请输入CSV格式数据，例如：\n\nX坐标,Y坐标,标签\n10,20,点1\n20,35,点2\n30,45,点3\n40,55,点4\n50,70,点5"></textarea>
                        
                        <div class="csv-hint">
                            第一行为标题行，第一列为X坐标，第二列为Y坐标，第三列为标签（可选）
                        </div>
                        
                        <div style="margin-top: 15px;">
                            <button class="btn btn-small" id="parseCsvBtn">
                                <span>🔄</span>
                                解析CSV
                            </button>
                            <button class="btn btn-small btn-secondary" id="exportCsvBtn">
                                <span>📤</span>
                                导出CSV
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- 数据预览和统计 -->
                <div class="data-preview" id="dataPreview">
                    <div class="preview-title">数据预览</div>
                    <table class="preview-table" id="previewTable">
                        <thead>
                            <tr>
                                <th>序号</th>
                                <th>X坐标</th>
                                <th>Y坐标</th>
                                <th>标签</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>1</td>
                                <td>10</td>
                                <td>20</td>
                                <td>点1</td>
                            </tr>
                        </tbody>
                    </table>
                    
                    <div class="stats-info" id="statsInfo">
                        <div class="stat-item">
                            <div class="stat-label">数据点数量</div>
                            <div class="stat-value" id="pointCount">5</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">X轴范围</div>
                            <div class="stat-value" id="xRange">10 ~ 50</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Y轴范围</div>
                            <div class="stat-value" id="yRange">20 ~ 70</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">相关系数</div>
                            <div class="stat-value" id="correlation">0.95</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 图表设置 -->
            <div class="chart-settings">
                <div class="section-title">
                    <span>⚙️</span>
                    图表设置
                </div>
                
                <div class="settings-grid">
                    <div class="setting-group">
                        <label class="setting-label" for="chartTitle">图表标题</label>
                        <input type="text" id="chartTitle" class="setting-input" value="散点图" placeholder="输入图表标题">
                    </div>
                    
                    <div class="setting-group">
                        <label class="setting-label" for="xAxisTitle">X轴标题</label>
                        <input type="text" id="xAxisTitle" class="setting-input" value="X轴" placeholder="输入X轴标题">
                    </div>
                    
                    <div class="setting-group">
                        <label class="setting-label" for="yAxisTitle">Y轴标题</label>
                        <input type="text" id="yAxisTitle" class="setting-input" value="Y轴" placeholder="输入Y轴标题">
                    </div>
                    
                    <div class="setting-group">
                        <label class="setting-label" for="chartWidth">图表宽度</label>
                        <input type="number" id="chartWidth" class="setting-input" value="800" min="400" max="1200">
                    </div>
                    
                    <div class="setting-group">
                        <label class="setting-label" for="chartHeight">图表高度</label>
                        <input type="number" id="chartHeight" class="setting-input" value="400" min="300" max="800">
                    </div>
                    
                    <div class="setting-group">
                        <label class="setting-label" for="pointSize">点大小</label>
                        <input type="range" id="pointSize" class="setting-input" value="6" min="3" max="15" step="1">
                        <div style="text-align: center; margin-top: 5px; font-size: 0.9em; color: #666;">6px</div>
                    </div>
                    
                    <div class="setting-group">
                        <label class="setting-label" for="showGrid">显示网格</label>
                        <select id="showGrid" class="setting-input">
                            <option value="true">显示</option>
                            <option value="false">隐藏</option>
                        </select>
                    </div>
                    
                    <div class="setting-group">
                        <label class="setting-label" for="showTrendLine">显示趋势线</label>
                        <select id="showTrendLine" class="setting-input">
                            <option value="false">不显示</option>
                            <option value="true">显示</option>
                        </select>
                    </div>
                    
                    <div class="setting-group">
                        <label class="setting-label" for="colorScheme">配色方案</label>
                        <select id="colorScheme" class="setting-input">
                            <option value="single">单一颜色</option>
                            <option value="gradient">渐变色</option>
                            <option value="rainbow">彩虹色</option>
                            <option value="blue">蓝色系</option>
                            <option value="green">绿色系</option>
                            <option value="warm">暖色系</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 操作按钮 -->
            <div class="action-buttons">
                <button class="btn btn-large" id="generateChartBtn">
                    <span>🔵</span>
                    生成图表
                </button>
                <button class="btn btn-large btn-success" id="downloadPngBtn" disabled>
                    <span>🖼️</span>
                    下载PNG
                </button>
                <button class="btn btn-large btn-success" id="downloadJpgBtn" disabled>
                    <span>📷</span>
                    下载JPG
                </button>
                <button class="btn btn-large btn-danger" id="clearBtn">
                    <span>🗑️</span>
                    清空重置
                </button>
            </div>

            <!-- 加载状态 -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div>正在生成图表...</div>
            </div>

            <!-- 图表预览 -->
            <div class="chart-preview">
                <div class="section-title">
                    <span>🔵</span>
                    图表预览
                </div>
                
                <div class="chart-container">
                    <canvas id="chartCanvas"></canvas>
                    <div class="placeholder" id="placeholder">
                        <div style="font-size: 3em; margin-bottom: 15px;">🔵</div>
                        <div>设置数据并点击"生成图表"按钮开始制作</div>
                    </div>
                </div>
            </div>

            <!-- 错误信息 -->
            <div class="error-message" id="errorMessage"></div>
            
            <!-- 成功信息 -->
            <div class="success-message" id="successMessage"></div>
        </div>
    </div>

    <!-- 引入Chart.js库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    
    <script>
        class ScatterChartGenerator {
            constructor() {
                this.chart = null;
                this.currentData = null;
                this.initializeElements();
                this.bindEvents();
                this.updatePreview();
            }

            initializeElements() {
                this.dataTable = document.getElementById('dataTable');
                this.csvInput = document.getElementById('csvInput');
                this.chartCanvas = document.getElementById('chartCanvas');
                this.placeholder = document.getElementById('placeholder');
                this.loading = document.getElementById('loading');
                this.errorMessage = document.getElementById('errorMessage');
                this.successMessage = document.getElementById('successMessage');
                this.previewTable = document.getElementById('previewTable');
                
                // 统计信息
                this.pointCount = document.getElementById('pointCount');
                this.xRange = document.getElementById('xRange');
                this.yRange = document.getElementById('yRange');
                this.correlation = document.getElementById('correlation');
                
                // 按钮
                this.addRowBtn = document.getElementById('addRowBtn');
                this.removeRowBtn = document.getElementById('removeRowBtn');
                this.generateRandomBtn = document.getElementById('generateRandomBtn');
                this.clearDataBtn = document.getElementById('clearDataBtn');
                this.parseCsvBtn = document.getElementById('parseCsvBtn');
                this.exportCsvBtn = document.getElementById('exportCsvBtn');
                this.generateChartBtn = document.getElementById('generateChartBtn');
                this.downloadPngBtn = document.getElementById('downloadPngBtn');
                this.downloadJpgBtn = document.getElementById('downloadJpgBtn');
                this.clearBtn = document.getElementById('clearBtn');
                
                // 设置
                this.chartTitle = document.getElementById('chartTitle');
                this.xAxisTitle = document.getElementById('xAxisTitle');
                this.yAxisTitle = document.getElementById('yAxisTitle');
                this.chartWidth = document.getElementById('chartWidth');
                this.chartHeight = document.getElementById('chartHeight');
                this.pointSize = document.getElementById('pointSize');
                this.showGrid = document.getElementById('showGrid');
                this.showTrendLine = document.getElementById('showTrendLine');
                this.colorScheme = document.getElementById('colorScheme');
            }

            bindEvents() {
                // 表格操作
                this.addRowBtn.addEventListener('click', () => this.addTableRow());
                this.removeRowBtn.addEventListener('click', () => this.removeTableRow());
                this.generateRandomBtn.addEventListener('click', () => this.generateRandomData());
                this.clearDataBtn.addEventListener('click', () => this.clearTableData());
                
                // CSV操作
                this.parseCsvBtn.addEventListener('click', () => this.parseCsvData());
                this.exportCsvBtn.addEventListener('click', () => this.exportToCsv());
                
                // 图表操作
                this.generateChartBtn.addEventListener('click', () => this.generateChart());
                this.downloadPngBtn.addEventListener('click', () => this.downloadChart('png'));
                this.downloadJpgBtn.addEventListener('click', () => this.downloadChart('jpeg'));
                this.clearBtn.addEventListener('click', () => this.clearAll());
                
                // 数据变化监听
                this.dataTable.addEventListener('input', () => this.updatePreview());
                
                // 点大小滑块
                this.pointSize.addEventListener('input', (e) => {
                    const value = e.target.value;
                    e.target.nextElementSibling.textContent = value + 'px';
                });
            }

            addTableRow() {
                const tbody = this.dataTable.querySelector('tbody');
                const newRow = document.createElement('tr');
                const rowCount = tbody.children.length + 1;
                
                newRow.innerHTML = `
                    <td><input type="number" value="0" placeholder="X值" step="0.1"></td>
                    <td><input type="number" value="0" placeholder="Y值" step="0.1"></td>
                    <td><input type="text" value="点${rowCount}" placeholder="标签（可选）"></td>
                `;
                
                tbody.appendChild(newRow);
                this.updatePreview();
                this.showSuccess('已添加新行');
            }

            removeTableRow() {
                const tbody = this.dataTable.querySelector('tbody');
                if (tbody.children.length > 1) {
                    tbody.removeChild(tbody.lastElementChild);
                    this.updatePreview();
                    this.showSuccess('已删除最后一行');
                } else {
                    this.showError('至少需要保留一行数据');
                }
            }

            generateRandomData() {
                const tbody = this.dataTable.querySelector('tbody');
                const rows = Array.from(tbody.children);
                
                rows.forEach((row, index) => {
                    const xInput = row.children[0].querySelector('input');
                    const yInput = row.children[1].querySelector('input');
                    const labelInput = row.children[2].querySelector('input');
                    
                    // 生成相关性较强的随机数据
                    const x = Math.round((Math.random() * 90 + 10) * 10) / 10;
                    const y = Math.round((x * 0.8 + Math.random() * 20 + 10) * 10) / 10;
                    
                    xInput.value = x;
                    yInput.value = y;
                    labelInput.value = `点${index + 1}`;
                });
                
                this.updatePreview();
                this.showSuccess('已生成随机数据');
            }

            clearTableData() {
                const tbody = this.dataTable.querySelector('tbody');
                const rows = Array.from(tbody.children);
                
                rows.forEach((row, index) => {
                    const xInput = row.children[0].querySelector('input');
                    const yInput = row.children[1].querySelector('input');
                    const labelInput = row.children[2].querySelector('input');
                    
                    xInput.value = '0';
                    yInput.value = '0';
                    labelInput.value = `点${index + 1}`;
                });
                
                this.updatePreview();
                this.showSuccess('已清空表格数据');
            }

            parseCsvData() {
                const csvText = this.csvInput.value.trim();
                if (!csvText) {
                    this.showError('请输入CSV数据');
                    return;
                }

                try {
                    const lines = csvText.split('\n').filter(line => line.trim());
                    if (lines.length < 2) {
                        this.showError('CSV数据至少需要包含标题行和一行数据');
                        return;
                    }

                    // 解析数据行（跳过标题行）
                    const dataRows = lines.slice(1).map(line => {
                        const parts = line.split(',').map(cell => cell.trim());
                        if (parts.length < 2) {
                            throw new Error('每行数据必须包含X和Y坐标');
                        }
                        return parts;
                    });

                    // 重建表格
                    this.rebuildTable(dataRows);
                    this.updatePreview();
                    this.showSuccess('CSV数据解析成功');
                } catch (error) {
                    this.showError('CSV数据格式错误：' + error.message);
                }
            }

            rebuildTable(dataRows) {
                const tbody = this.dataTable.querySelector('tbody');
                tbody.innerHTML = '';
                
                dataRows.forEach(rowData => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><input type="number" value="${rowData[0]}" placeholder="X值" step="0.1"></td>
                        <td><input type="number" value="${rowData[1]}" placeholder="Y值" step="0.1"></td>
                        <td><input type="text" value="${rowData[2] || ''}" placeholder="标签（可选）"></td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            exportToCsv() {
                const data = this.getTableData();
                if (!data) return;
                
                const csvContent = [
                    'X坐标,Y坐标,标签',
                    ...data.map(item => `${item.x},${item.y},${item.label || ''}`)
                ].join('\n');
                
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `scatter_chart_data_${new Date().getTime()}.csv`;
                link.click();
                
                this.showSuccess('CSV文件导出成功');
            }

            getTableData() {
                const tbody = this.dataTable.querySelector('tbody');
                const rows = Array.from(tbody.children);
                
                const data = [];
                
                for (let i = 0; i < rows.length; i++) {
                    const xInput = rows[i].children[0].querySelector('input');
                    const yInput = rows[i].children[1].querySelector('input');
                    const labelInput = rows[i].children[2].querySelector('input');
                    
                    const x = parseFloat(xInput.value);
                    const y = parseFloat(yInput.value);
                    const label = labelInput.value.trim();
                    
                    if (isNaN(x) || isNaN(y)) {
                        this.showError(`第${i + 1}行坐标数据无效`);
                        return null;
                    }
                    
                    data.push({ x, y, label: label || `点${i + 1}` });
                }
                
                if (data.length === 0) {
                    this.showError('请输入数据');
                    return null;
                }
                
                return data;
            }

            updatePreview() {
                const data = this.getTableData();
                if (!data) return;
                
                const previewTbody = this.previewTable.querySelector('tbody');
                previewTbody.innerHTML = '';
                
                // 更新预览表格
                data.forEach((item, index) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="font-weight: 600; color: #f093fb;">${index + 1}</td>
                        <td>${item.x}</td>
                        <td>${item.y}</td>
                        <td>${item.label}</td>
                    `;
                    previewTbody.appendChild(tr);
                });
                
                // 更新统计信息
                this.updateStatistics(data);
            }

            updateStatistics(data) {
                // 数据点数量
                this.pointCount.textContent = data.length;
                
                // X轴范围
                const xValues = data.map(item => item.x);
                const xMin = Math.min(...xValues);
                const xMax = Math.max(...xValues);
                this.xRange.textContent = `${xMin} ~ ${xMax}`;
                
                // Y轴范围
                const yValues = data.map(item => item.y);
                const yMin = Math.min(...yValues);
                const yMax = Math.max(...yValues);
                this.yRange.textContent = `${yMin} ~ ${yMax}`;
                
                // 计算相关系数
                const correlation = this.calculateCorrelation(xValues, yValues);
                this.correlation.textContent = correlation.toFixed(3);
            }

            calculateCorrelation(x, y) {
                const n = x.length;
                if (n < 2) return 0;
                
                const sumX = x.reduce((a, b) => a + b, 0);
                const sumY = y.reduce((a, b) => a + b, 0);
                const sumXY = x.reduce((sum, xi, i) => sum + xi * y[i], 0);
                const sumX2 = x.reduce((sum, xi) => sum + xi * xi, 0);
                const sumY2 = y.reduce((sum, yi) => sum + yi * yi, 0);
                
                const numerator = n * sumXY - sumX * sumY;
                const denominator = Math.sqrt((n * sumX2 - sumX * sumX) * (n * sumY2 - sumY * sumY));
                
                return denominator === 0 ? 0 : numerator / denominator;
            }

            generateChart() {
                const data = this.getTableData();
                if (!data) return;

                this.showLoading(true);
                this.hideMessages();
                
                setTimeout(() => {
                    try {
                        this.renderChart(data);
                        this.currentData = data;
                        this.showLoading(false);
                        this.showSuccess('散点图生成成功');
                    } catch (error) {
                        this.showLoading(false);
                        this.showError('图表生成失败：' + error.message);
                    }
                }, 500);
            }

            renderChart(data) {
                const ctx = this.chartCanvas.getContext('2d');
                
                // 销毁现有图表
                if (this.chart) {
                    this.chart.destroy();
                }
                
                // 准备数据
                const scatterData = data.map(item => ({ x: item.x, y: item.y }));
                const colors = this.getColors(data.length);
                
                // 设置图表配置
                const config = {
                    type: 'scatter',
                    data: {
                        datasets: [{
                            label: '数据点',
                            data: scatterData,
                            backgroundColor: colors.background,
                            borderColor: colors.border,
                            borderWidth: 2,
                            pointRadius: parseInt(this.pointSize.value),
                            pointHoverRadius: parseInt(this.pointSize.value) + 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: {
                                type: 'linear',
                                position: 'bottom',
                                title: {
                                    display: !!this.xAxisTitle.value,
                                    text: this.xAxisTitle.value
                                },
                                grid: {
                                    display: this.showGrid.value === 'true'
                                }
                            },
                            y: {
                                title: {
                                    display: !!this.yAxisTitle.value,
                                    text: this.yAxisTitle.value
                                },
                                grid: {
                                    display: this.showGrid.value === 'true'
                                }
                            }
                        },
                        plugins: {
                            title: {
                                display: !!this.chartTitle.value,
                                text: this.chartTitle.value,
                                font: {
                                    size: 16,
                                    weight: 'bold'
                                }
                            },
                            legend: {
                                display: false
                            },
                            tooltip: {
                                callbacks: {
                                    title: function(context) {
                                        const index = context[0].dataIndex;
                                        return data[index].label;
                                    },
                                    label: function(context) {
                                        return `(${context.parsed.x}, ${context.parsed.y})`;
                                    }
                                }
                            }
                        },
                        animation: {
                            duration: 1000,
                            easing: 'easeOutQuart'
                        }
                    }
                };
                
                // 添加趋势线
                if (this.showTrendLine.value === 'true') {
                    const trendLineData = this.calculateTrendLine(data);
                    config.data.datasets.push({
                        label: '趋势线',
                        data: trendLineData,
                        type: 'line',
                        borderColor: '#ff6b6b',
                        backgroundColor: 'transparent',
                        borderWidth: 2,
                        pointRadius: 0,
                        pointHoverRadius: 0,
                        tension: 0
                    });
                }
                
                // 设置画布大小
                this.chartCanvas.width = parseInt(this.chartWidth.value);
                this.chartCanvas.height = parseInt(this.chartHeight.value);
                
                // 创建图表
                this.chart = new Chart(ctx, config);
                
                // 显示图表，隐藏占位符
                this.placeholder.style.display = 'none';
                this.chartCanvas.style.display = 'block';
                
                // 启用下载按钮
                this.downloadPngBtn.disabled = false;
                this.downloadJpgBtn.disabled = false;
            }

            calculateTrendLine(data) {
                const n = data.length;
                const sumX = data.reduce((sum, item) => sum + item.x, 0);
                const sumY = data.reduce((sum, item) => sum + item.y, 0);
                const sumXY = data.reduce((sum, item) => sum + item.x * item.y, 0);
                const sumX2 = data.reduce((sum, item) => sum + item.x * item.x, 0);
                
                const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
                const intercept = (sumY - slope * sumX) / n;
                
                const xMin = Math.min(...data.map(item => item.x));
                const xMax = Math.max(...data.map(item => item.x));
                
                return [
                    { x: xMin, y: slope * xMin + intercept },
                    { x: xMax, y: slope * xMax + intercept }
                ];
            }

            getColors(count) {
                const scheme = this.colorScheme.value;
                const background = [];
                const border = [];
                
                switch (scheme) {
                    case 'single':
                        const singleColor = '#f093fb';
                        for (let i = 0; i < count; i++) {
                            background.push(singleColor + '80');
                            border.push(singleColor);
                        }
                        break;
                        
                    case 'gradient':
                        for (let i = 0; i < count; i++) {
                            const ratio = i / Math.max(count - 1, 1);
                            const r = Math.round(240 + (245 - 240) * ratio);
                            const g = Math.round(147 + (87 - 147) * ratio);
                            const b = Math.round(251 + (108 - 251) * ratio);
                            background.push(`rgba(${r}, ${g}, ${b}, 0.8)`);
                            border.push(`rgb(${r}, ${g}, ${b})`);
                        }
                        break;
                        
                    case 'rainbow':
                        const rainbowColors = [
                            '#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', 
                            '#feca57', '#ff9ff3', '#54a0ff', '#5f27cd'
                        ];
                        for (let i = 0; i < count; i++) {
                            const color = rainbowColors[i % rainbowColors.length];
                            background.push(color + '80');
                            border.push(color);
                        }
                        break;
                        
                    case 'blue':
                        const blueColors = ['#74b9ff', '#0984e3', '#4facfe', '#00f2fe'];
                        for (let i = 0; i < count; i++) {
                            const color = blueColors[i % blueColors.length];
                            background.push(color + '80');
                            border.push(color);
                        }
                        break;
                        
                    case 'green':
                        const greenColors = ['#56ab2f', '#a8edea', '#2ed573', '#7bed9f'];
                        for (let i = 0; i < count; i++) {
                            const color = greenColors[i % greenColors.length];
                            background.push(color + '80');
                            border.push(color);
                        }
                        break;
                        
                    case 'warm':
                        const warmColors = ['#ff9a9e', '#fecfef', '#ffc3a0', '#ffafbd'];
                        for (let i = 0; i < count; i++) {
                            const color = warmColors[i % warmColors.length];
                            background.push(color + '80');
                            border.push(color);
                        }
                        break;
                        
                    default:
                        background.push('#f093fb80');
                        border.push('#f093fb');
                }
                
                return { background, border };
            }

            downloadChart(format) {
                if (!this.chart) {
                    this.showError('请先生成图表');
                    return;
                }

                try {
                    const link = document.createElement('a');
                    link.download = `scatter_chart_${new Date().getTime()}.${format === 'jpeg' ? 'jpg' : format}`;
                    
                    if (format === 'jpeg') {
                        // 对于JPEG格式，需要白色背景
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = this.chartCanvas.width;
                        canvas.height = this.chartCanvas.height;
                        
                        // 填充白色背景
                        ctx.fillStyle = 'white';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        
                        // 绘制图表
                        ctx.drawImage(this.chartCanvas, 0, 0);
                        
                        link.href = canvas.toDataURL('image/jpeg', 0.9);
                    } else {
                        link.href = this.chartCanvas.toDataURL('image/png');
                    }
                    
                    link.click();
                    this.showSuccess(`${format.toUpperCase()}图片下载成功`);
                } catch (error) {
                    this.showError('图片下载失败：' + error.message);
                }
            }

            clearAll() {
                // 重置表格
                const tbody = this.dataTable.querySelector('tbody');
                tbody.innerHTML = `
                    <tr>
                        <td><input type="number" value="10" placeholder="X值" step="0.1"></td>
                        <td><input type="number" value="20" placeholder="Y值" step="0.1"></td>
                        <td><input type="text" value="点1" placeholder="标签（可选）"></td>
                    </tr>
                    <tr>
                        <td><input type="number" value="20" placeholder="X值" step="0.1"></td>
                        <td><input type="number" value="35" placeholder="Y值" step="0.1"></td>
                        <td><input type="text" value="点2" placeholder="标签（可选）"></td>
                    </tr>
                    <tr>
                        <td><input type="number" value="30" placeholder="X值" step="0.1"></td>
                        <td><input type="number" value="45" placeholder="Y值" step="0.1"></td>
                        <td><input type="text" value="点3" placeholder="标签（可选）"></td>
                    </tr>
                    <tr>
                        <td><input type="number" value="40" placeholder="X值" step="0.1"></td>
                        <td><input type="number" value="55" placeholder="Y值" step="0.1"></td>
                        <td><input type="text" value="点4" placeholder="标签（可选）"></td>
                    </tr>
                    <tr>
                        <td><input type="number" value="50" placeholder="X值" step="0.1"></td>
                        <td><input type="number" value="70" placeholder="Y值" step="0.1"></td>
                        <td><input type="text" value="点5" placeholder="标签（可选）"></td>
                    </tr>
                `;
                
                // 清空CSV输入
                this.csvInput.value = '';
                
                // 重置设置
                this.chartTitle.value = '散点图';
                this.xAxisTitle.value = 'X轴';
                this.yAxisTitle.value = 'Y轴';
                this.chartWidth.value = '800';
                this.chartHeight.value = '400';
                this.pointSize.value = '6';
                this.pointSize.nextElementSibling.textContent = '6px';
                this.showGrid.value = 'true';
                this.showTrendLine.value = 'false';
                this.colorScheme.value = 'single';
                
                // 销毁图表
                if (this.chart) {
                    this.chart.destroy();
                    this.chart = null;
                }
                
                // 显示占位符
                this.placeholder.style.display = 'block';
                this.chartCanvas.style.display = 'none';
                
                // 禁用下载按钮
                this.downloadPngBtn.disabled = true;
                this.downloadJpgBtn.disabled = true;
                
                // 更新预览
                this.updatePreview();
                
                this.hideMessages();
                this.showSuccess('已重置所有设置');
            }

            showLoading(show) {
                this.loading.classList.toggle('show', show);
            }

            showError(message) {
                this.errorMessage.textContent = message;
                this.errorMessage.classList.add('show');
                this.successMessage.classList.remove('show');
            }

            showSuccess(message) {
                this.successMessage.textContent = message;
                this.successMessage.classList.add('show');
                this.errorMessage.classList.remove('show');
            }

            hideMessages() {
                this.errorMessage.classList.remove('show');
                this.successMessage.classList.remove('show');
            }
        }

        // 等待Chart.js库加载完成后初始化
        window.addEventListener('load', () => {
            if (typeof Chart !== 'undefined') {
                new ScatterChartGenerator();
            } else {
                console.error('Chart.js库加载失败');
                document.getElementById('errorMessage').textContent = 'Chart.js库加载失败，请检查网络连接';
                document.getElementById('errorMessage').classList.add('show');
            }
        });
    </script>
</body>
</html>
