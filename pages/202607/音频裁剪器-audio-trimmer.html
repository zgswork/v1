<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="在线音频裁剪器：拖拽或选择音频文件，调整起止点，快速导出 MP3 / WAV。">
  <meta name="keywords" content="音频裁剪,音频剪辑,MP3裁剪,音频截取,在线音频工具">
  <meta property="og:type" content="website">
  <meta property="og:title" content="音频裁剪器 - 在线剪切导出 MP3/WAV">
  <meta property="og:description" content="拖拽上传音频，设置开始结束时间，预览并导出裁剪好的片段。">
  <title>音频裁剪器</title>
  <style>
    :root {
      --ink: #0f172a;
      --card: #f8fafc;
      --accent: #10b981;
      --accent-2: #f97316;
      --muted: #475569;
      --stroke: rgba(15, 23, 42, 0.12);
      --shadow: 0 18px 38px rgba(15, 23, 42, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      margin-top: 36px;
      min-height: 100vh;
      font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
      background: radial-gradient(circle at 25% 20%, rgba(16, 185, 129, 0.12), transparent 32%),
                  radial-gradient(circle at 80% 0%, rgba(249, 115, 22, 0.14), transparent 36%),
                  linear-gradient(145deg, #f9fbff, #f1f5f9 50%, #e9eef5);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 56px;
    }
    .shell {
      width: min(1100px, 100%);
      background: var(--card);
      border-radius: 18px;
      padding: 28px;
      box-shadow: var(--shadow);
      border: 1px solid var(--stroke);
      margin: 0 auto;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }
    .title {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .title h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: -0.02em;
      color: #0b1222;
    }
    .pill {
      background: linear-gradient(120deg, rgba(16, 185, 129, 0.16), rgba(249, 115, 22, 0.22));
      color: #0b1222;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.02em;
    }
    .upload {
      border: 1px dashed var(--stroke);
      border-radius: 14px;
      padding: 14px 16px;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      transition: border-color 120ms ease, background 120ms ease;
    }
    .upload label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-weight: 600;
      color: #0f172a;
    }
    .upload input[type="file"] {
      display: none;
    }
    .tagline {
      color: var(--muted);
      font-size: 14px;
      margin: 2px 0 0;
    }
    .player-card {
      margin-top: 22px;
      border: 1px solid var(--stroke);
      border-radius: 14px;
      padding: 18px;
      background: white;
    }
    audio {
      width: 100%;
      margin: 10px 0 6px;
      accent-color: var(--accent);
    }
    .ranges {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px 18px;
      margin: 14px 0;
    }
    .range-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .range-row label {
      font-size: 13px;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent-2);
      cursor: pointer;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin: 12px 0 18px;
    }
    .chip {
      background: #0b1222;
      color: #e2e8f0;
      padding: 10px 12px;
      border-radius: 10px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .chip small {
      font-size: 12px;
      color: #cbd5e1;
      font-weight: 500;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    button {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease;
      letter-spacing: 0.01em;
      font-size: 14px;
    }
    button:active { transform: translateY(1px); }
    .primary {
      background: linear-gradient(120deg, var(--accent), #22c55e);
      color: #0b1222;
      box-shadow: 0 10px 24px rgba(16, 185, 129, 0.22);
    }
    .ghost {
      background: #e2e8f0;
      color: #0b1222;
    }
    .danger {
      background: linear-gradient(120deg, #fb923c, var(--accent-2));
      color: #0b1222;
      box-shadow: 0 10px 24px rgba(249, 115, 22, 0.24);
    }
    .status {
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
    }
    @media (max-width: 640px) {
      body { padding: 18px 12px 32px; }
      .shell { padding: 20px; }
      .actions { flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="title">
        <h1>音频裁剪器</h1>
        <span class="pill">音频裁剪 & 下载</span>
      </div>
      <div class="tagline">拖动起止点，预览并导出裁剪后的音频</div>
    </header>

    <div class="upload" id="drop-zone">
      <div>
        <label for="file-input">📂 选择或拖拽音频文件</label>
        <p class="tagline">支持常见格式 (mp3, wav, m4a, ogg)，拖入即可加载</p>
      </div>
      <input type="file" id="file-input" accept="audio/*">
      <div class="actions">
        <button class="primary" id="pick-button">加载文件</button>
        <button class="ghost" id="reset-button" type="button">清空</button>
      </div>
    </div>

    <div class="player-card">
      <audio id="audio" controls preload="metadata"></audio>
      <div class="metrics">
        <div class="chip"><small>开始</small><span id="start-label">0:00</span></div>
        <div class="chip"><small>结束</small><span id="end-label">0:00</span></div>
        <div class="chip"><small>持续</small><span id="duration-label">0:00</span></div>
      </div>
      <div class="ranges">
        <div class="range-row">
          <label for="start-range">
            开始位置
            <span id="start-time">0:00</span>
          </label>
          <input type="range" id="start-range" min="0" value="0" step="0.01">
        </div>
        <div class="range-row">
          <label for="end-range">
            结束位置
            <span id="end-time">0:00</span>
          </label>
          <input type="range" id="end-range" min="0" value="0" step="0.01">
        </div>
      </div>
      <div class="actions">
        <button class="primary" id="preview-button" type="button">预览裁剪片段</button>
        <button class="ghost" id="mark-start" type="button">将开始设为当前播放点</button>
        <button class="ghost" id="mark-end" type="button">将结束设为当前播放点</button>
        <button class="danger" id="export-button" type="button">导出裁剪音频</button>
      </div>
      <div class="status" id="status">等待加载音频文件。</div>
    </div>
    <template id="site-footer">
      <style>
          .footer {
          position: fixed;   /* 贴底 */
          bottom: 0;
          left: 0;
          width: 100%;
          padding: .75rem 1rem;
          font-size: 14px;
          background: #fafafa;
          border-top: 1px solid #eaeaea;
          display: flex;
          flex-wrap: wrap;
          gap: .5rem;
          justify-content: center;
          align-items: center;
          z-index: 999;
          }

          @media (max-width: 768px) {
                  .footer {
                      bottom: 47px;
                  }
              }
          .footer a { color: #0077cc; text-decoration: none; }
          .footer a:hover { text-decoration: underline; }

          .qr-wrapper { position: relative; display: inline-block; }
          .qr-img {
          /* 初始隐藏 */
          display: none;
          position: absolute;
          bottom: 1.8rem;   /* 调整图片出现的位置 */
          left: 50%;
          transform: translateX(-50%);
          max-width: 140px;
          border: 1px solid #ddd;
          background: #fff;
          padding: 4px;
          border-radius: 6px;
          box-shadow: 0 4px 12px rgba(0,0,0,.15);
          }
          .qr-wrapper:hover .qr-img { display: block; }
      </style>

      <div class="footer card">
          Created&nbsp;by：
          <!-- 广告示例 1 -->
              <span class="qr-wrapper">
              <a class="qr-link"
                  href="https://mp.weixin.qq.com/mp/profile_ext?action=home&__biz=MzI0MzUzOTEwMw==&scene=124#wechat_redirect"
                  target="_blank"
                  data-img="https://raw.githubusercontent.com/anneeeee/programming_exercise/refs/heads/main/ad_pics/qrcode_for_gh_87351941139e_258%20(2).jpg">系统1与系统2</a>
              <img class="qr-img" alt="系统1与系统2公众号二维码">
              </span>
          &nbsp;||&nbsp;广告位：
          <!-- 广告示例 1 -->
          <span class="qr-wrapper">
          <a class="qr-link"
              href="https://t.zsxq.com/SjYuX"
              target="_blank"
              data-img="https://raw.githubusercontent.com/anneeeee/programming_exercise/refs/heads/main/ad_pics/AI_programming.pic.jpg">AI编程星球</a>
          <img class="qr-img" alt="AI编程星球二维码">
          </span> |
          <!-- 广告示例 2 -->
          <span class="qr-wrapper">
          <a class="qr-link"
              href="https://t.zsxq.com/VTCya"
              target="_blank"
              data-img="https://raw.githubusercontent.com/anneeeee/programming_exercise/refs/heads/main/ad_pics/laoxu.pic.jpg">副业避坑星球</a>
          <img class="qr-img" alt="副业避坑星球二维码">
          </span> |
          <!-- 广告示例 3（如果没有 data-img 就不会弹出图片） -->
          <span class="qr-wrapper">
          <a class="qr-link"
              href="https://www.xiaobot.net/p/ai08?refer=a9625ad2-ec04-4cc8-8549-7511079cb3b5"
              target="_blank"
              data-img="https://raw.githubusercontent.com/anneeeee/programming_exercise/refs/heads/main/ad_pics/hani-xiaobot-8.png">AI&nbsp;产品日报</a>
          <img class="qr-img" alt="AI产品日报二维码">
          </span> |
          <span class="qr-wrapper">
          <a class="qr-link"
              href="https://t.zsxq.com/jcaEa"
              target="_blank"
              data-img="https://raw.githubusercontent.com/anneeeee/programming_exercise/refs/heads/main/ad_pics/aipm.pic.jpg">AI&nbsp;产品经理大本营</a>
          <img class="qr-img" alt="AI产品经理大本营二维码">
          </span>
      </div>
  </template>
  </div>

  <script>
    const audio = document.getElementById('audio');
    const fileInput = document.getElementById('file-input');
    const pickButton = document.getElementById('pick-button');
    const resetButton = document.getElementById('reset-button');
    const startRange = document.getElementById('start-range');
    const endRange = document.getElementById('end-range');
    const startTime = document.getElementById('start-time');
    const endTime = document.getElementById('end-time');
    const startLabel = document.getElementById('start-label');
    const endLabel = document.getElementById('end-label');
    const durationLabel = document.getElementById('duration-label');
    const previewButton = document.getElementById('preview-button');
    const markStart = document.getElementById('mark-start');
    const markEnd = document.getElementById('mark-end');
    const exportButton = document.getElementById('export-button');
    const status = document.getElementById('status');
    const dropZone = document.getElementById('drop-zone');

    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    let audioBuffer = null;
    let objectUrl = null;
    let lastPreviewEnd = null;
    let currentName = 'trimmed-audio';
    let sourceMime = '';

    pickButton.addEventListener('click', () => fileInput.click());
    resetButton.addEventListener('click', clearSelection);

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      await handleFile(file);
    });

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragging');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragging'));
    dropZone.addEventListener('drop', async (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragging');
      const file = e.dataTransfer?.files?.[0];
      if (file) await handleFile(file);
    });

    audio.addEventListener('loadedmetadata', () => {
      const { duration } = audio;
      if (!Number.isFinite(duration) || duration <= 0) {
        status.textContent = '无法读取音频时长，请尝试其它文件。';
        return;
      }
      startRange.max = duration;
      endRange.max = duration;
      endRange.value = duration;
      updateHandles();
      setStatus('音频已加载，可拖动起止点或预览片段。');
    });

    audio.addEventListener('timeupdate', () => {
      if (lastPreviewEnd !== null && audio.currentTime >= lastPreviewEnd) {
        audio.pause();
        lastPreviewEnd = null;
      }
    });

    startRange.addEventListener('input', () => {
      const startVal = parseFloat(startRange.value);
      const endVal = parseFloat(endRange.value);
      if (startVal > endVal) {
        endRange.value = startVal;
      }
      updateHandles();
    });

    endRange.addEventListener('input', () => {
      const startVal = parseFloat(startRange.value);
      const endVal = parseFloat(endRange.value);
      if (endVal < startVal) {
        startRange.value = endVal;
      }
      updateHandles();
    });

    previewButton.addEventListener('click', () => {
      if (!audio.src) return;
      const startVal = parseFloat(startRange.value);
      const endVal = parseFloat(endRange.value);
      if (endVal - startVal <= 0.05) {
        setStatus('片段过短，请调整起止点。');
        return;
      }
      audio.currentTime = startVal;
      lastPreviewEnd = endVal;
      audio.play();
      setStatus(`预览中：${formatTime(startVal)} - ${formatTime(endVal)}`);
    });

    markStart.addEventListener('click', () => {
      if (!audio.src) return;
      startRange.value = Math.min(audio.currentTime, parseFloat(endRange.value)).toFixed(2);
      updateHandles();
    });

    markEnd.addEventListener('click', () => {
      if (!audio.src) return;
      endRange.value = Math.max(audio.currentTime, parseFloat(startRange.value)).toFixed(2);
      updateHandles();
    });

    exportButton.addEventListener('click', async () => {
      if (!audioBuffer) {
        setStatus('请先加载音频。');
        return;
      }
      const startVal = parseFloat(startRange.value);
      const endVal = parseFloat(endRange.value);
      if (endVal <= startVal) {
        setStatus('结束时间需要晚于开始时间。');
        return;
      }
      const trimmed = trimBuffer(audioBuffer, startVal, endVal);
      const preferMp3 = /mpeg|mp3/i.test(sourceMime);
      setStatus(preferMp3 ? '正在导出 mp3...' : '正在导出 wav...');
      const blob = await exportBuffer(trimmed, preferMp3);
      const extension = blob.type.includes('mpeg') ? 'mp3' : 'wav';
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${currentName}-trimmed.${extension}`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      setStatus(extension === 'mp3' ? '裁剪完成，已开始下载 mp3。' : '裁剪完成，已开始下载 wav（浏览器暂不支持 mp3 导出）。');
    });

    async function handleFile(file) {
      currentName = file.name.replace(/\.[^/.]+$/, '') || 'trimmed-audio';
      const ext = (file.name.split('.').pop() || '').toLowerCase();
      sourceMime = file.type || (ext === 'mp3' ? 'audio/mpeg' : '');
      status.textContent = '加载并解析音频中…';
      await loadAudio(file);
    }

    function clearSelection() {
      audio.pause();
      audio.removeAttribute('src');
      audio.load();
      if (objectUrl) {
        URL.revokeObjectURL(objectUrl);
        objectUrl = null;
      }
      fileInput.value = '';
      audioBuffer = null;
      startRange.value = 0;
      endRange.value = 0;
      startTime.textContent = '0:00';
      endTime.textContent = '0:00';
      startLabel.textContent = '0:00';
      endLabel.textContent = '0:00';
      durationLabel.textContent = '0:00';
      setStatus('已清空，重新选择音频开始。');
    }

    async function loadAudio(file) {
      if (objectUrl) {
        URL.revokeObjectURL(objectUrl);
        objectUrl = null;
      }
      try {
        const arrayBuffer = await file.arrayBuffer();
        audioBuffer = await audioContext.decodeAudioData(arrayBuffer.slice(0));
        objectUrl = URL.createObjectURL(file);
        audio.src = objectUrl;
        audio.load();
        durationLabel.textContent = formatTime(audioBuffer.duration);
      } catch (err) {
        console.error(err);
        setStatus('解析音频失败，请换个文件再试。');
      }
    }

    function updateHandles() {
      const startVal = parseFloat(startRange.value);
      const endVal = parseFloat(endRange.value);
      startTime.textContent = formatTime(startVal);
      endTime.textContent = formatTime(endVal);
      startLabel.textContent = formatTime(startVal);
      endLabel.textContent = formatTime(endVal);
    }

    function trimBuffer(buffer, start, end) {
      const sampleRate = buffer.sampleRate;
      const startSample = Math.max(0, Math.floor(start * sampleRate));
      const endSample = Math.min(buffer.length, Math.floor(end * sampleRate));
      const frameCount = Math.max(0, endSample - startSample);
      const trimmed = audioContext.createBuffer(buffer.numberOfChannels, frameCount, sampleRate);
      for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
        const channelData = buffer.getChannelData(ch).slice(startSample, endSample);
        trimmed.copyToChannel(channelData, ch, 0);
      }
      return trimmed;
    }

    async function exportBuffer(buffer, preferMp3) {
      if (preferMp3 && typeof MediaRecorder !== 'undefined') {
        const mp3Type = ['audio/mpeg', 'audio/mp3'].find(type => MediaRecorder.isTypeSupported(type));
        if (mp3Type) {
          try {
            return await recordWithMediaRecorder(buffer, mp3Type);
          } catch (err) {
            console.warn('mp3 export failed, falling back to wav', err);
          }
        }
      }
      return encodeWav(buffer);
    }

    async function recordWithMediaRecorder(buffer, mimeType) {
      await audioContext.resume();
      const dest = audioContext.createMediaStreamDestination();
      const source = audioContext.createBufferSource();
      source.buffer = buffer;
      source.connect(dest);
      source.start();

      return new Promise((resolve, reject) => {
        const chunks = [];
        const recorder = new MediaRecorder(dest.stream, { mimeType });
        recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
        recorder.onerror = reject;
        recorder.onstop = () => resolve(new Blob(chunks, { type: mimeType }));
        recorder.start();
        source.onended = () => recorder.stop();
      });
    }

    function encodeWav(buffer) {
      const channels = buffer.numberOfChannels;
      const sampleRate = buffer.sampleRate;
      const frames = buffer.length;
      const bytesPerSample = 2;
      const blockAlign = channels * bytesPerSample;
      const bufferSize = 44 + frames * blockAlign;
      const arrayBuffer = new ArrayBuffer(bufferSize);
      const view = new DataView(arrayBuffer);

      // RIFF header
      writeString(view, 0, 'RIFF');
      view.setUint32(4, 36 + frames * blockAlign, true);
      writeString(view, 8, 'WAVE');

      // fmt chunk
      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true); // PCM chunk size
      view.setUint16(20, 1, true); // format PCM
      view.setUint16(22, channels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * blockAlign, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, bytesPerSample * 8, true);

      // data chunk
      writeString(view, 36, 'data');
      view.setUint32(40, frames * blockAlign, true);

      // Write interleaved samples
      let offset = 44;
      const temp = new Float32Array(channels);
      for (let i = 0; i < frames; i++) {
        for (let ch = 0; ch < channels; ch++) {
          temp[ch] = buffer.getChannelData(ch)[i];
        }
        for (let ch = 0; ch < channels; ch++) {
          const sample = Math.max(-1, Math.min(1, temp[ch]));
          view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
          offset += 2;
        }
      }
      return new Blob([arrayBuffer], { type: 'audio/wav' });
    }

    function writeString(view, offset, str) {
      for (let i = 0; i < str.length; i++) {
        view.setUint8(offset + i, str.charCodeAt(i));
      }
    }

    function formatTime(time) {
      if (!Number.isFinite(time)) return '0:00';
      const minutes = Math.floor(time / 60);
      const seconds = Math.floor(time % 60).toString().padStart(2, '0');
      return `${minutes}:${seconds}`;
    }

    function setStatus(msg) {
      status.textContent = msg;
    }
    // 把模板克隆到页面底部
  document.addEventListener('DOMContentLoaded', () => {
    const tpl = document.getElementById('site-footer');
    if (tpl && 'content' in tpl) {
      document.body.appendChild(tpl.content.cloneNode(true));
    }

    // 用 data-img 填充 <img src>
    document.querySelectorAll('.qr-wrapper').forEach(w => {
      const link = w.querySelector('.qr-link');
      const img  = w.querySelector('.qr-img');
      if (link && img && link.dataset.img) {
        img.src = link.dataset.img.trim();
      }
    });
  });
  </script>
</body>
