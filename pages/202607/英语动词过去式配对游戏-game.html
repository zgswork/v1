<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>英语动词过去式配对游戏</title>
  <style>
    :root{--bg:#FFF8F0;--card:#fff;--accent1:#FFB85F;--accent2:#FF7A7A;--accent3:#FFD66B;--text:#333}
    *{box-sizing:border-box}
    body{margin:0;font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft Yahei", Arial, sans-serif;background:linear-gradient(180deg,#FFF8F0 0%, #FFF3E6 100%);color:var(--text);display:flex;flex-direction:column;min-height:100vh}
    header{padding:18px 16px 8px;display:flex;align-items:center;gap:12px}
    .mascot{width:72px;height:72px;border-radius:16px;background:linear-gradient(135deg,#FFD89B,#FFB2A6);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(255,130,80,0.18)}
    .mascot svg{width:56px;height:56px}
    .title{flex:1}
    h1{margin:0;font-size:18px}
    p.subtitle{margin:2px 0 0;color:#80594C;font-size:13px}

    .controls{padding:10px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .seg{background:linear-gradient(90deg,#FFF,#FFF0D9);border-radius:12px;padding:8px;box-shadow:0 6px 14px rgba(255,170,90,0.08);display:flex;gap:8px}
    .seg label{font-size:13px;padding:6px 10px;border-radius:10px;background:transparent;cursor:pointer}
    .seg input[type=radio]{display:none}
    .seg input[type=radio]:checked + label{background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#fff;box-shadow:0 6px 12px rgba(255,120,80,0.18)}

    .btns{display:flex;gap:8px;margin-left:auto}
    button.btn{border:0;padding:10px 14px;border-radius:12px;font-weight:600;cursor:pointer;background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#fff;box-shadow:0 6px 18px rgba(255,125,70,0.15)}
    button.ghost{background:transparent;color:var(--accent2);box-shadow:none;border:2px solid rgba(255,120,80,0.12)}

    main{flex:1;padding:12px 12px 80px}
    .meta{display:flex;gap:10px;align-items:center;margin-bottom:12px}
    .score{background:linear-gradient(90deg,#FFF,#FFF9E6);padding:8px 12px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,0.04);font-weight:700}

    .board{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .col{background:linear-gradient(180deg,#fff,#FFF8F2);padding:12px;border-radius:14px;min-height:240px;box-shadow:0 10px 30px rgba(255,150,80,0.06)}
    .col h3{margin:0 0 8px;font-size:14px}
    .list{display:flex;flex-direction:column;gap:8px}
    .card{background:var(--card);padding:12px 14px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:700;cursor:pointer;transition:transform .12s,box-shadow .12s}
    .card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,0.06)}
    .card.matched{opacity:0.28;transform:scale(.98);cursor:default}
    .card.selected{box-shadow:0 10px 28px rgba(255,140,90,0.16);outline:3px solid rgba(255,200,150,0.16)}
    .card.correct{background:linear-gradient(90deg,#CFF9D6,#E9FFE7)}
    .card.wrong{background:linear-gradient(90deg,#FFD6D6,#FFECEC)}

    .footer{position:fixed;left:0;right:0;bottom:0;padding:10px 12px;background:linear-gradient(180deg,rgba(255,255,255,0.85),rgba(255,255,255,0.98));display:flex;align-items:center;justify-content:center;border-top:1px solid rgba(0,0,0,0.04);font-size:13px}

    /* responsive */
    @media (max-width:720px){.board{grid-template-columns:1fr 1fr} .mascot{width:62px;height:62px}.controls{padding:8px}} 
    @media (max-width:420px){.board{grid-template-columns:1fr 1fr;gap:8px} .card{font-size:15px;padding:10px}}

    /* small confetti container */
    #confetti{pointer-events:none;position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;z-index:9999}
  </style>
</head>
<body>
  <header>
    <div class="mascot" aria-hidden>
      <!-- simple mascot SVG -->
      <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <circle cx="60" cy="50" r="36" fill="#fff"/>
        <circle cx="44" cy="44" r="6" fill="#6C3"/>
        <circle cx="76" cy="44" r="6" fill="#6C3"/>
        <path d="M45 64c6 8 24 8 30 0" stroke="#FF7A7A" stroke-width="4" stroke-linecap="round" fill="none"/>
      </svg>
    </div>
    <div class="title">
      <h1>英语动词过去式配对游戏</h1>
      <p class="subtitle">卡通风格 · 适合小学生 · 直观有趣</p>
    </div>
  </header>

  <div class="controls">
    <div class="seg" style="align-items:center">
      <label for="difficultySelect" style="font-size:13px;padding:6px 8px;color:#8C5A4A">难度</label>
      <select id="difficultySelect" style="border-radius:8px;padding:6px 8px;border:1px solid rgba(0,0,0,0.06);background:linear-gradient(90deg,#fff,#FFF0D9);">
        <option value="easy">简单</option>
        <option value="medium">中等</option>
        <option value="hard">挑战</option>
      </select>
    </div>

    <div class="seg" style="align-items:center">
      <label for="countSelect" style="font-size:13px;padding:6px 8px;color:#8C5A4A">题量</label>
      <select id="countSelect" style="border-radius:8px;padding:6px 8px;border:1px solid rgba(0,0,0,0.06);background:linear-gradient(90deg,#fff,#FFF0D9);">
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="30">30</option>
      </select>
    </div>

    <div style="margin-left:8px" class="score" id="score">0 / 0</div>
  </div>

  <main>
    <div class="top-actions" style="display:flex;justify-content:center;gap:8px;margin-bottom:12px">
      <button id="startBtn" class="btn">开始游戏</button>
      <button id="resetBtn" class="btn ghost">重新开始</button>
    </div>

    <div class="board" id="board">
      <div class="col">
        <h3>过去式（左列）</h3>
        <div class="list" id="pastCol"></div>
      </div>
      <div class="col">
        <h3>原形（右列）</h3>
        <div class="list" id="baseCol"></div>
      </div>
    </div>
  </main>

  <div id="confetti"></div>

  <div class="footer">技术支持: 昕源在跑步    微信:skymapcn  微信公众号: 昕源在跑步</div>

  <script>
    // 词库（适合小学生的常用动词）
    const VERBS = [
      {base:'be', past:'was'}, {base:'have', past:'had'}, {base:'go', past:'went'}, {base:'do', past:'did'},
      {base:'say', past:'said'}, {base:'see', past:'saw'}, {base:'eat', past:'ate'}, {base:'make', past:'made'},
      {base:'take', past:'took'}, {base:'come', past:'came'}, {base:'get', past:'got'}, {base:'give', past:'gave'},
      {base:'know', past:'knew'}, {base:'think', past:'thought'}, {base:'write', past:'wrote'}, {base:'read', past:'read'},
      {base:'run', past:'ran'}, {base:'swim', past:'swam'}, {base:'sleep', past:'slept'}, {base:'play', past:'played'},
      {base:'walk', past:'walked'}, {base:'jump', past:'jumped'}, {base:'listen', past:'listened'}, {base:'watch', past:'watched'},
      {base:'study', past:'studied'}, {base:'like', past:'liked'}, {base:'live', past:'lived'}, {base:'help', past:'helped'},
      {base:'open', past:'opened'}, {base:'close', past:'closed'}, {base:'start', past:'started'}, {base:'end', past:'ended'},
      {base:'love', past:'loved'}, {base:'call', past:'called'}, {base:'look', past:'looked'}, {base:'find', past:'found'},
      {base:'bring', past:'brought'}, {base:'buy', past:'bought'}, {base:'teach', past:'taught'}, {base:'draw', past:'drew'},
      {base:'sing', past:'sang'}, {base:'fly', past:'flew'}, {base:'build', past:'built'}, {base:'break', past:'broke'},
      {base:'choose', past:'chose'}
    ];

    // DOM refs
    const pastCol = document.getElementById('pastCol');
    const baseCol = document.getElementById('baseCol');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const scoreEl = document.getElementById('score');
    const confettiRoot = document.getElementById('confetti');

    let selectedLeft = null; // {id, el}
    let pairs = []; // selected pairs for round
    let matchedCount = 0;
    let totalPairs = 0;

    function randShuffle(arr){
      for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;
    }

    function pickPairs(n){
      const pool = [...VERBS];
      const picked = [];
      randShuffle(pool);
      for(let i=0;i<Math.min(n,pool.length);i++) picked.push({...pool[i], id:i+1});
      return picked;
    }

    function renderBoard(){
      pastCol.innerHTML=''; baseCol.innerHTML=''; selectedLeft=null; matchedCount=0; updateScore();
      // create cards
      const leftCards = pairs.map(p => ({...p, kind:'past'}));
      const rightCards = pairs.map(p => ({...p, kind:'base'}));
      randShuffle(leftCards); randShuffle(rightCards);

      leftCards.forEach(item => {
        const el = document.createElement('div'); el.className='card'; el.dataset.id=item.id; el.dataset.kind='past'; el.textContent = item.past; el.setAttribute('role','button');
        el.addEventListener('click', onLeftClick);
        pastCol.appendChild(el);
      });

      rightCards.forEach(item => {
        const el = document.createElement('div'); el.className='card'; el.dataset.id=item.id; el.dataset.kind='base'; el.textContent = item.base; el.setAttribute('role','button');
        el.addEventListener('click', onRightClick);
        baseCol.appendChild(el);
      });
    }

    function updateScore(){ scoreEl.textContent = `${matchedCount} / ${totalPairs}`; }

    function onLeftClick(e){
      const el = e.currentTarget; if(el.classList.contains('matched')) return; // ignore
      // select left
      // clear previous selection styles
      document.querySelectorAll('.card.selected').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      selectedLeft = {id:el.dataset.id, el};
    }

    function onRightClick(e){
      const el = e.currentTarget; if(el.classList.contains('matched')) return;
      if(!selectedLeft) {
        // if no left selected, show a gentle pulse
        el.classList.add('selected'); setTimeout(()=>el.classList.remove('selected'),400); return;
      }
      const leftId = selectedLeft.id; const rightId = el.dataset.id;
      // clear selected style
      selectedLeft.el.classList.remove('selected');

      if(leftId === rightId){
        // correct
        markMatched(leftId);
      } else {
        // wrong -> 显示正确答案（短暂）
        el.classList.add('wrong');
        const correctRight = document.querySelector(`.card[data-kind=base][data-id='${leftId}']`);
        const correctLeft = document.querySelector(`.card[data-kind=past][data-id='${leftId}']`);
        if(correctRight) correctRight.classList.add('correct');
        if(correctLeft) correctLeft.classList.add('correct');
        setTimeout(()=>{
          el.classList.remove('wrong');
          if(correctRight) correctRight.classList.remove('correct');
          if(correctLeft) correctLeft.classList.remove('correct');
        },1400);
      }
      selectedLeft = null;
    }

    function markMatched(id){
      const left = document.querySelector(`.card[data-kind=past][data-id='${id}']`);
      const right = document.querySelector(`.card[data-kind=base][data-id='${id}']`);
      if(left) { left.classList.add('matched'); left.classList.add('correct'); }
      if(right) { right.classList.add('matched'); right.classList.add('correct'); }
      matchedCount++;
      updateScore();
      // celebrate
      burstConfetti();
      // small mascot animation (simple scale)
      animateMascot();
      // check end
      if(matchedCount >= totalPairs) {
        setTimeout(()=>{
          showFinish();
        },600);
      }
    }

    function showFinish(){
      const old = startBtn.textContent;
      startBtn.textContent = '已完成 ✓'; startBtn.disabled = true; startBtn.style.opacity=0.9;
      setTimeout(()=>{ startBtn.textContent = old; startBtn.disabled=false; },2500);
    }

    // mascot animation: simple scale
    function animateMascot(){
      const m = document.querySelector('.mascot');
      if(!m) return; m.style.transition='transform .36s cubic-bezier(.2,.9,.3,1)'; m.style.transform='scale(1.06)';
      setTimeout(()=>{ m.style.transform='scale(1)'; },360);
    }

    // confetti simple implementation
    function burstConfetti(){
      const count = 18; const colors = ['#FF7A7A','#FFD66B','#FFB85F','#8FE3C0','#9FD3FF'];
      for(let i=0;i<count;i++){
        const el = document.createElement('div');
        el.style.position='absolute'; el.style.left= (50 + (Math.random()-0.5)*50) + '%'; el.style.top = '10%';
        el.style.width='10px'; el.style.height = '18px'; el.style.borderRadius='2px'; el.style.background = colors[Math.floor(Math.random()*colors.length)];
        el.style.transform = `translateY(-10vh) rotate(${Math.random()*360}deg)`;
        el.style.opacity = '0.95'; el.style.zIndex = 9999;
        confettiRoot.appendChild(el);
        const dx = (Math.random()-0.5)*300; const dy = 300 + Math.random()*160; const rot = (Math.random()-0.5)*720;
        el.animate([
          { transform: `translate(${dx/10}px,0) rotate(0deg)`, opacity:1},
          { transform: `translate(${dx}px,${dy}px) rotate(${rot}deg)`, opacity:0.0}
        ],{duration:900+Math.random()*600,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish = ()=> el.remove();
      }
    }

    // start/reset handlers
    function getSelectedDifficulty(){ return document.getElementById('difficultySelect').value; }
    function getSelectedCount(){ return parseInt(document.getElementById('countSelect').value,10); }

    function startGame(){
      const diff = getSelectedDifficulty(); const cnt = getSelectedCount(); totalPairs = cnt; matchedCount=0; updateScore();
      // pick pairs
      pairs = pickPairs(cnt);
      // difficulty flavors
      if(diff==='easy'){
        // show short preview where right and left aligned by index (不打乱) for 2s
        renderBoard();
        // show alignment preview (no shuffle) - actually for preview render unshuffled columns
        const left = pairs.map(p => ({...p,kind:'past'}));
        const right = pairs.map(p => ({...p,kind:'base'}));
        pastCol.innerHTML=''; baseCol.innerHTML='';
        left.forEach(item=>{const el=document.createElement('div');el.className='card';el.textContent=item.past;pastCol.appendChild(el)});
        right.forEach(item=>{const el=document.createElement('div');el.className='card';el.textContent=item.base;baseCol.appendChild(el)});
        // after preview, render shuffled board
        setTimeout(()=>{ renderBoard(); },2000);
      } else {
        renderBoard();
      }
      startBtn.textContent='正在游戏';
    }

    function resetGame(){
      pairs=[]; pastCol.innerHTML=''; baseCol.innerHTML=''; selectedLeft=null; matchedCount=0; totalPairs=0; updateScore(); startBtn.textContent='开始游戏';
    }

    // wire buttons
    startBtn.addEventListener('click', ()=>{ startGame(); });
    resetBtn.addEventListener('click', ()=>{ resetGame(); });

    // accessibility: allow keyboard selection for cards (left col first)
    document.addEventListener('keydown', (e)=>{
      if(e.key==='r' || e.key==='R'){ resetGame(); }
    });

    // initial render: empty board with placeholder
    (function init(){
      pastCol.innerHTML = '<div style="opacity:.6;padding:14px;border-radius:10px;background:#fff;">点击"开始游戏"生成题目</div>';
      baseCol.innerHTML = '<div style="opacity:.6;padding:14px;border-radius:10px;background:#fff;">点击"开始游戏"生成题目</div>';
      scoreEl.textContent = '0 / 0';
    })();
  </script>
</body>
</html>
