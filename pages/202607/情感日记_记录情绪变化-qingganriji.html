                    <button class="filter-btn px-3 py-1.5 bg-gray-100 text-gray-700 rounded-full text-sm transition-all hover:bg-gray-200" data-filter="sad">难过</button>
                    <button class="filter-btn px-3 py-1.5 bg-gray-100 text-gray-700 rounded-full text-sm transition-all hover:bg-gray-200" data-filter="angry">愤怒</button>
                    <button class="filter-btn px-3 py-1.5 bg-gray-100 text-gray-700 rounded-full text-sm transition-all hover:bg-gray-200" data-filter="calm">平静</button>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 情绪数据管理
        const EmotionDiary = {
            // 初始化
            init() {
                this.entries = JSON.parse(localStorage.getItem('emotionEntries') || '[]');
                this.selectedEmotion = null;
                this.initEventListeners();
                this.renderEntries();
                this.initChart();
                this.updateEmotionPercentages();
            },
            
            // 初始化事件监听器
            initEventListeners() {
                // 情绪选择按钮
                document.querySelectorAll('.emotion-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.selectEmotion(btn.dataset.emotion);
                    });
                });
                
                // 保存记录按钮
                document.getElementById('saveEntryBtn').addEventListener('click', () => {
                    this.saveEntry();
                });
                
                // 事件描述输入框变化
                document.getElementById('eventDescription').addEventListener('input', () => {
                    this.updateSaveButtonState();
                });
                
                // 筛选按钮
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.filterEntries(btn.dataset.filter);
                        this.updateFilterButtons(btn);
                    });
                });
                
                // 时间范围按钮
                document.querySelectorAll('.time-range-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.changeTimeRange(btn.dataset.range);
                        this.updateTimeRangeButtons(btn);
                    });
                });
                
                // 清空记录按钮
                document.getElementById('clearEntriesBtn').addEventListener('click', () => {
                    if (confirm('确定要清空所有记录吗？此操作不可恢复。')) {
                        this.clearEntries();
                    }
                });
            },
            
            // 选择情绪
            selectEmotion(emotion) {
                this.selectedEmotion = emotion;
                
                // 更新按钮样式
                document.querySelectorAll('.emotion-btn').forEach(btn => {
                    if (btn.dataset.emotion === emotion) {
                        btn.classList.add('emotion-btn-active');
                    } else {
                        btn.classList.remove('emotion-btn-active');
                    }
                });
                
                this.updateSaveButtonState();
            },
            
            // 更新保存按钮状态
            updateSaveButtonState() {
                const saveBtn = document.getElementById('saveEntryBtn');
                const description = document.getElementById('eventDescription').value.trim();
                
                if (this.selectedEmotion && description) {
                    saveBtn.disabled = false;
                } else {
                    saveBtn.disabled = true;
                }
            },
            
            // 保存记录
            saveEntry() {
                const description = document.getElementById('eventDescription').value.trim();
                if (!this.selectedEmotion || !description) return;
                
                const today = new Date();
                const dateStr = today.toISOString().split('T')[0]; // YYYY-MM-DD
                
                // 检查今天是否已有记录
                const todayEntryIndex = this.entries.findIndex(
                    entry => entry.date === dateStr
                );
                
                const entry = {
                    id: todayEntryIndex !== -1 ? this.entries[todayEntryIndex].id : Date.now().toString(),
                    date: dateStr,
                    timestamp: today.getTime(),
                    emotion: this.selectedEmotion,
                    event: description
                };
                
                // 如果今天已有记录，则更新，否则添加新记录
                if (todayEntryIndex !== -1) {
                    this.entries[todayEntryIndex] = entry;
                } else {
                    this.entries.push(entry);
                }
                
                // 保存到localStorage
                localStorage.setItem('emotionEntries', JSON.stringify(this.entries));
                
                // 更新UI
                this.renderEntries();
                this.updateEmotionChart();
                this.updateEmotionPercentages();
                
                // 重置表单
                document.getElementById('eventDescription').value = '';
                document.querySelectorAll('.emotion-btn').forEach(btn => {
                    btn.classList.remove('emotion-btn-active');
                });
                this.selectedEmotion = null;
                this.updateSaveButtonState();
                
                // 显示提示
                this.showToast('记录已保存');
            },
            
            // 渲染记录列表
            renderEntries(filter = 'all') {
                const entriesList = document.getElementById('entriesList');
                entriesList.innerHTML = '';
                
                // 按时间排序（最新的在前）
                const sortedEntries = [...this.entries].sort((a, b) => b.timestamp - a.timestamp);
                
                // 应用筛选
                const filteredEntries = filter === 'all' 
                    ? sortedEntries 
                    : sortedEntries.filter(entry => entry.emotion === filter);
                
                if (filteredEntries.length === 0) {
                    entriesList.innerHTML = `
                        <div class="text-center text-gray-500 py-8 border border-dashed border-gray-200 rounded-lg">
                            <i class="fa fa-search text-3xl mb-2"></i>
                            <p>没有找到符合条件的记录</p>
                        </div>
                    `;
                    return;
                }
                
                // 生成记录HTML
                filteredEntries.forEach(entry => {
                    const date = new Date(entry.timestamp);
                    const formattedDate = `${date.getFullYear()}-${(date.getMonth() + 1).toString().padStart(2, '0')}-${date.getDate().toString().padStart(2, '0')}`;
                    const emotionClass = this.getEmotionClass(entry.emotion);
                    const emotionName = this.getEmotionName(entry.emotion);
                    
                    const entryElement = document.createElement('div');
                    entryElement.className = 'p-4 border border-gray-100 rounded-lg hover:border-gray-200 transition-all';
                    entryElement.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div>
                                <div class="flex items-center">
                                    <span class="inline-block w-2 h-2 rounded-full ${emotionClass.bgColor} mr-2"></span>
                                    <span class="font-medium">${emotionName}</span>
                                </div>
                                <p class="text-sm text-gray-500 mt-1">${formattedDate}</p>
                            </div>
                            <div class="flex gap-1">
                                <button class="edit-entry p-1 text-gray-400 hover:text-primary transition-colors" data-id="${entry.id}">
                                    <i class="fa fa-pencil"></i>
                                </button>
                                <button class="delete-entry p-1 text-gray-400 hover:text-red-500 transition-colors" data-id="${entry.id}">
                                    <i class="fa fa-trash-o"></i>
                                </button>
                            </div>
                        </div>
                        <p class="mt-3 text-gray-700">${entry.event}</p>
                    `;
                    
                    entriesList.appendChild(entryElement);
                });
                
                // 添加编辑和删除事件监听器
                this.addEntryActionListeners();
            },
            
            // 添加记录操作监听器
            addEntryActionListeners() {
                // 编辑记录
                document.querySelectorAll('.edit-entry').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const entryId = e.currentTarget.dataset.id;
                        this.editEntry(entryId);
                    });
                });
                
                // 删除记录
                document.querySelectorAll('.delete-entry').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const entryId = e.currentTarget.dataset.id;
                        if (confirm('确定要删除这条记录吗？')) {
                            this.deleteEntry(entryId);
                        }
                    });
                });
            },
            
            // 编辑记录
            editEntry(entryId) {
                const entry = this.entries.find(e => e.id === entryId);
                if (!entry) return;
                
                // 填充表单
                document.getElementById('eventDescription').value = entry.event;
                this.selectEmotion(entry.emotion);
                
                // 滚动到表单
                document.querySelector('section:first-of-type').scrollIntoView({ behavior: 'smooth' });
            },
            
            // 删除记录
            deleteEntry(entryId) {
                this.entries = this.entries.filter(entry => entry.id !== entryId);
                localStorage.setItem('emotionEntries', JSON.stringify(this.entries));
                
                // 更新UI
                this.renderEntries(this.getCurrentFilter());
                this.updateEmotionChart();
                this.updateEmotionPercentages();
                
                this.showToast('记录已删除');
            },
            
            // 清空所有记录
            clearEntries() {
                if (this.entries.length === 0) {
                    this.showToast('没有记录可清空', 'info');
                    return;
                }
                
                localStorage.removeItem('emotionEntries');
                this.entries = [];
                
                // 更新UI
                this.renderEntries();
                this.updateEmotionChart();
                this.updateEmotionPercentages();
                
                this.showToast('所有记录已清空', 'info');
            },
            
            // 筛选记录
            filterEntries(filter) {
                this.renderEntries(filter);
            },
            
            // 获取当前筛选条件
            getCurrentFilter() {
                const activeFilter = document.querySelector('.filter-btn.bg-primary\\/10');
                return activeFilter ? activeFilter.dataset.filter : 'all';
            },
            
            // 更新筛选按钮样式
            updateFilterButtons(activeBtn) {
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    if (btn === activeBtn) {
                        btn.classList.add('bg-primary/10', 'text-primary');
                        btn.classList.remove('bg-gray-100', 'text-gray-700');
                    } else {
                        btn.classList.remove('bg-primary/10', 'text-primary');
                        btn.classList.add('bg-gray-100', 'text-gray-700');
                    }
                });
            },
            
            // 初始化情绪图表
            initChart() {
                const ctx = document.getElementById('emotionChart').getContext('2d');
                this.chart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: [],
                        datasets: this.getChartDatasets()
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'top',
                                labels: {
                                    boxWidth: 12,
                                    usePointStyle: true,
                                    pointStyle: 'circle'
                                }
                            },
                            tooltip: {
                                mode: 'index',
                                intersect: false,
                                callbacks: {
                                    title: function(tooltipItems) {
                                        return tooltipItems[0].label;
                                    }
                                }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                max: 1,
                                ticks: {
                                    stepSize: 1,
                                    callback: function(value) {
                                        return value === 1 ? '有记录' : '';
                                    }
                                }
                            }
                        },
                        interaction: {
                            mode: 'nearest',
                            axis: 'x',
                            intersect: false
                        }
                    }
                });
                
                this.updateEmotionChart();
            },
            
            // 获取图表数据集
            getChartDatasets() {
                const emotions = [
                    { key: 'happy', name: '开心', color: '#10b981' },
                    { key: 'sad', name: '难过', color: '#3b82f6' },
                    { key: 'angry', name: '愤怒', color: '#ef4444' },
                    { key: 'calm', name: '平静', color: '#6366f1' },
                    { key: 'excited', name: '兴奋', color: '#f59e0b' },
                    { key: 'anxious', name: '焦虑', color: '#ec4899' },
                    { key: 'other', name: '其他', color: '#6b7280' }
                ];
                
                return emotions.map(emotion => ({
                    label: emotion.name,
                    data: [],
                    borderColor: emotion.color,
                    backgroundColor: `${emotion.color}33`,
                    borderWidth: 2,
                    pointBackgroundColor: emotion.color,
                    pointRadius: 4,
                    pointHoverRadius: 6,
                    tension: 0.3,
                    fill: false
                }));
            },
            
            // 更新情绪图表
            updateEmotionChart(range = 'week') {
                if (!this.chart) return;
                
                // 获取时间范围
                let startDate;
                const today = new Date();
                
                if (range === 'week') {
                    startDate = new Date();
                    startDate.setDate(today.getDate() - 6); // 近7天
                } else if (range === 'month') {
                    startDate = new Date();
                    startDate.setDate(today.getDate() - 29); // 近30天
                } else {
                    // 所有记录，找到最早的日期
                    if (this.entries.length === 0) {
                        startDate = new Date();
                    } else {
                        const earliestTimestamp = Math.min(...this.entries.map(e => e.timestamp));
                        startDate = new Date(earliestTimestamp);
                    }
                }
                
                // 生成日期标签
                const labels = [];
                const currentDate = new Date(startDate);
                
                while (currentDate <= today) {
                    const dateStr = currentDate.toISOString().split('T')[0];
                    labels.push(dateStr);
                    currentDate.setDate(currentDate.getDate() + 1);
                }
                
                // 准备数据集
                const datasets = this.getChartDatasets();
                
                // 填充数据
                labels.forEach((date, index) => {
                    const entry = this.entries.find(e => e.date === date);
                    
                    datasets.forEach(dataset => {
                        const emotionKey = datasets.findIndex(ds => ds.label === dataset.label);
                        const emotionType = [
                            'happy', 'sad', 'angry', 'calm', 'excited', 'anxious', 'other'
                        ][emotionKey];
                        
                        dataset.data[index] = entry && entry.emotion === emotionType ? 1 : null;
                    });
                });
                
                // 更新图表
                this.chart.data.labels = labels;
                this.chart.data.datasets = datasets;
                this.chart.update();
            },
            
            // 改变时间范围
            changeTimeRange(range) {
                this.updateEmotionChart(range);
            },
            
            // 更新时间范围按钮样式
            updateTimeRangeButtons(activeBtn) {
                document.querySelectorAll('.time-range-btn').forEach(btn => {
                    if (btn === activeBtn) {
                        btn.classList.add('bg-primary', 'text-white');
                        btn.classList.remove('bg-gray-100', 'text-gray-700');
                    } else {
                        btn.classList.remove('bg-primary', 'text-white');
                        btn.classList.add('bg-gray-100', 'text-gray-700');
                    }
                });
            },
            
            // 更新情绪占比
            updateEmotionPercentages() {
                if (this.entries.length === 0) {
                    document.getElementById('happyPercentage').textContent = '0%';
                    document.getElementById('sadPercentage').textContent = '0%';
                    document.getElementById('angryPercentage').textContent = '0%';
                    document.getElementById('otherPercentage').textContent = '0%';
                    return;
                }
                
                // 计算各类情绪数量
                const counts = {
                    happy: 0,
                    sad: 0,
                    angry: 0,
                    calm: 0,
                    excited: 0,
                    anxious: 0,
                    other: 0
                };
                
                this.entries.forEach(entry => {
                    counts[entry.emotion]++;
                });
                
                // 计算百分比
                const total = this.entries.length;
                const happyPercent = Math.round((counts.happy / total) * 100);
                const sadPercent = Math.round((counts.sad / total) * 100);
                const angryPercent = Math.round((counts.angry / total) * 100);
                const otherPercent = 100 - happyPercent - sadPercent - angryPercent;
                
                // 更新UI
                document.getElementById('happyPercentage').textContent = `${happyPercent}%`;
                document.getElementById('sadPercentage').textContent = `${sadPercent}%`;
                document.getElementById('angryPercentage').textContent = `${angryPercent}%`;
                document.getElementById('otherPercentage').textContent = `${otherPercent}%`;
            },
            
            // 获取情绪名称
            getEmotionName(emotionKey) {
                const names = {
                    happy: '开心',
                    sad: '难过',
                    angry: '愤怒',
                    calm: '平静',
                    excited: '兴奋',
                    anxious: '焦虑',
                    other: '其他'
                };
                return names[emotionKey] || '其他';
            },
            
            // 获取情绪样式类
            getEmotionClass(emotionKey) {
                const classes = {
                    happy: { bgColor: 'bg-happy', textColor: 'text-happy' },
                    sad: { bgColor: 'bg-sad', textColor: 'text-sad' },
                    angry: { bgColor: 'bg-angry', textColor: 'text-angry' },
                    calm: { bgColor: 'bg-calm', textColor: 'text-calm' },
                    excited: { bgColor: 'bg-excited', textColor: 'text-excited' },
                    anxious: { bgColor: 'bg-anxious', textColor: 'text-anxious' },
                    other: { bgColor: 'bg-gray-500', textColor: 'text-gray-600' }
                };
                return classes[emotionKey] || classes.other;
            },
            
            // 显示提示弹窗
            showToast(message, type = 'success') {
                const toast = document.getElementById('toast');
                const toastMsg = document.getElementById('toastMessage');
                
                toastMsg.textContent = message;
                
                // 设置样式
                if (type === 'success') {
                    toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs bg-green-500 text-white';
                    toast.querySelector('i').className = 'fa fa-check-circle mr-2';
                } else if (type === 'error') {
                    toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs bg-red-500 text-white';
                    toast.querySelector('i').className = 'fa fa-exclamation-circle mr-2';
                } else if (type === 'info') {
                    toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs bg-blue-500 text-white';
                    toast.querySelector('i').className = 'fa fa-info-circle mr-2';
                }
                
                // 3秒后隐藏
                setTimeout(() => {
                    toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs';
                }, 3000);
            }
        };
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            EmotionDiary.init();
        });
    </script>
</body>
</html>
