<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机数据集生成器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4361ee;
            --primary-light: #4895ef;
            --secondary: #3f37c9;
            --dark: #1d3557;
            --light: #f8f9fa;
            --success: #4caf50;
            --warning: #ff9800;
            --danger: #f44336;
            --gray: #6c757d;
            --border: #dee2e6;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7ff 0%, #eef2ff 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 30px 0;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            color: var(--dark);
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 700;
        }

        header p {
            font-size: 1.1rem;
            color: var(--gray);
            max-width: 700px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 30px;
            margin-bottom: 30px;
            transition: var(--transition);
        }

        .card:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        .card-title {
            font-size: 1.5rem;
            color: var(--dark);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title i {
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark);
        }

        input, select, button {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            transition: var(--transition);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.15);
        }

        button {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: var(--transition);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(67, 97, 238, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #6c757d, #5a6268);
        }

        .btn-secondary:hover {
            box-shadow: 0 6px 16px rgba(108, 117, 125, 0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #3d8b40);
        }

        .btn-success:hover {
            box-shadow: 0 6px 16px rgba(76, 175, 80, 0.3);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .preview-container {
            overflow-x: auto;
            max-height: 500px;
            overflow-y: auto;
            margin-top: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        th {
            background: var(--primary);
            color: white;
            text-align: left;
            padding: 16px;
            position: sticky;
            top: 0;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid var(--border);
        }

        tr:nth-child(even) {
            background-color: #f8f9ff;
        }

        tr:hover {
            background-color: #eef2ff;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            background: var(--success);
            color: white;
            border-radius: 10px;
            box-shadow: var(--shadow);
            transform: translateX(120%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .notification.show {
            transform: translateX(0);
        }

        footer {
            text-align: center;
            padding: 30px 0;
            color: var(--gray);
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
            
            .action-buttons {
                grid-template-columns: 1fr;
            }
            
            header h1 {
                font-size: 2.2rem;
            }
        }

        /* 数据类型选择复选框样式 */
        .data-types-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 10px;
        }
        
        .data-type-checkbox {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .data-type-input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary);
        }
        
        .data-type-label {
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 0;
            font-weight: 500;
        }
        
        .data-type-settings {
            background-color: #f8f9ff;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #e0e7ff;
            margin-bottom: 20px;
        }

        /* 添加更多数据类型的展开/折叠样式 */
        .more-types-section {
            margin-top: 10px;
            border-top: 1px dashed var(--border);
            padding-top: 15px;
            display: none;
        }
        
        .more-types-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 8px 0;
            margin: 5px 0;
            width: auto;
        }
        
        .more-types-btn:hover {
            color: var(--secondary);
        }
        
        .more-types-btn i {
            transition: transform 0.3s ease;
        }
        
        .more-types-btn.expanded i {
            transform: rotate(180deg);
        }

        /* 添加空数据提示样式 */
        .empty-message {
            text-align: center;
            padding: 40px 20px;
            color: var(--gray);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed var(--border);
            border-radius: 8px;
            margin: 20px 0;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>随机数据集生成器</h1>
            <p>轻松创建用于测试、演示和学习的自定义数据集</p>
        </header>

        <main>
            <div class="card">
                <h2 class="card-title"><i class="fas fa-sliders-h"></i> 数据集配置</h2>
                
                <div class="form-group">
                    <label for="rowCount">数据量</label>
                    <input type="number" id="rowCount" min="1" max="10000" value="50">
                </div>
                
                <div class="form-group">
                    <label>数据类型</label>
                    <div class="data-types-container">
                        <div class="data-type-checkbox">
                            <input type="checkbox" id="type-name" class="data-type-input" value="fullName" checked>
                            <label for="type-name" class="data-type-label">姓名</label>
                        </div>
                        <div class="data-type-checkbox">
                            <input type="checkbox" id="type-age" class="data-type-input" value="age" checked>
                            <label for="type-age" class="data-type-label">年龄</label>
                        </div>
                        <div class="data-type-checkbox">
                            <input type="checkbox" id="type-phone" class="data-type-input" value="phone" checked>
                            <label for="type-phone" class="data-type-label">电话号码</label>
                        </div>
                        <div class="data-type-checkbox">
                            <input type="checkbox" id="type-email" class="data-type-input" value="email" checked>
                            <label for="type-email" class="data-type-label">邮箱</label>
                        </div>
                        <div class="data-type-checkbox">
                            <input type="checkbox" id="type-city" class="data-type-input" value="city" checked>
                            <label for="type-city" class="data-type-label">城市</label>
                        </div>
                        <div class="data-type-checkbox">
                            <input type="checkbox" id="type-date" class="data-type-input" value="date" checked>
                            <label for="type-date" class="data-type-label">日期</label>
                        </div>
                    </div>
                    
                    <button class="more-types-btn" id="moreTypesBtn">
                        <i class="fas fa-chevron-down"></i> 更多数据类型
                    </button>
                    
                    <div class="more-types-section" id="moreTypesSection">
                        <div class="data-types-container">
                            <div class="data-type-checkbox">
                                <input type="checkbox" id="type-gender" class="data-type-input" value="gender">
                                <label for="type-gender" class="data-type-label">性别</label>
                            </div>
                            <div class="data-type-checkbox">
                                <input type="checkbox" id="type-address" class="data-type-input" value="address">
                                <label for="type-address" class="data-type-label">地址</label>
                            </div>
                            <div class="data-type-checkbox">
                                <input type="checkbox" id="type-company" class="data-type-input" value="company">
                                <label for="type-company" class="data-type-label">公司名称</label>
                            </div>
                            <div class="data-type-checkbox">
                                <input type="checkbox" id="type-job" class="data-type-input" value="job">
                                <label for="type-job" class="data-type-label">职位</label>
                            </div>
                            <div class="data-type-checkbox">
                                <input type="checkbox" id="type-education" class="data-type-input" value="education">
                                <label for="type-education" class="data-type-label">学历</label>
                            </div>
                            <div class="data-type-checkbox">
                                <input type="checkbox" id="type-university" class="data-type-input" value="university">
                                <label for="type-university" class="data-type-label">毕业院校</label>
                            </div>
                            <div class="data-type-checkbox">
                                <input type="checkbox" id="type-major" class="data-type-input" value="major">
                                <label for="type-major" class="data-type-label">专业</label>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="form-group data-type-settings" id="dataTypeSettings">
                    <!-- 数据类型参数设置将在这里动态生成 -->
                </div>
                
                <div class="grid-2">
                    <button id="generateBtn">
                        <i class="fas fa-bolt"></i> 生成数据集
                    </button>
                    <button class="btn-secondary" id="resetBtn">
                        <i class="fas fa-redo"></i> 重置配置
                    </button>
                </div>
            </div>

            <div class="card">
                <h2 class="card-title"><i class="fas fa-table"></i> 数据预览</h2>
                <div class="preview-container">
                    <table id="previewTable" style="display: none;">
                        <thead>
                            <tr>
                                <!-- 表头将动态生成 -->
                            </tr>
                        </thead>
                        <tbody>
                            <!-- 数据将在这里填充 -->
                        </tbody>
                    </table>
                    <div id="emptyMessage" class="empty-message">
                        请选择至少一种数据类型，然后点击"生成数据集"按钮
                    </div>
                </div>
                
                <div class="action-buttons">
                    <button class="btn-success" id="downloadBtn">
                        <i class="fas fa-file-csv"></i> 下载 CSV 文件
                    </button>
                    <button class="btn-secondary" id="copyBtn">
                        <i class="fas fa-copy"></i> 复制到剪贴板
                    </button>
                </div>
            </div>
        </main>

        <footer>
            <p>© 2025 随机数据集生成器 | 为开发者和数据分析师提供便捷的数据生成工具</p>
        </footer>
    </div>

    <div class="notification" id="notification">
        数据已成功复制到剪贴板！
    </div>

    <script>
        // 全局变量和配置
        let columns = [];
        
        const defaultColumns = [
            { id: 'id', name: 'ID', type: 'id' },
            { id: 'fullName', name: '姓名', type: 'fullName' },
            { id: 'age', name: '年龄', type: 'age', min: 18, max: 65 },
            { id: 'phone', name: '电话号码', type: 'phone' },
            { id: 'email', name: '邮箱', type: 'email' },
            { id: 'city', name: '城市', type: 'city' },
            { id: 'date', name: '日期', type: 'date', start: '2020-01-01', end: '2023-12-31' },
            { id: 'gender', name: '性别', type: 'gender' },
            { id: 'address', name: '地址', type: 'address' },
            { id: 'company', name: '公司名称', type: 'company' },
            { id: 'job', name: '职位', type: 'job' },
            { id: 'education', name: '学历', type: 'education' },
            { id: 'university', name: '毕业院校', type: 'university' },
            { id: 'major', name: '专业', type: 'major' }
        ];

        // 辅助函数
        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // 初始化数据类型
        function initDataTypes() {
            // 根据复选框状态生成列配置
            columns = [];
            
            // 始终添加ID列
            columns.push({ id: 'id', name: 'ID', type: 'id' });
            
            // 根据选中的复选框添加对应数据类型
            document.querySelectorAll('.data-type-input:checked').forEach(checkbox => {
                const type = checkbox.value;
                const defaultCol = defaultColumns.find(col => col.type === type);
                if (defaultCol) {
                    columns.push({...defaultCol});
                }
            });
            
            console.log('已更新数据列:', columns);
            
            // 更新数据类型设置区域
            updateDataTypeSettings();
            
            // 检查是否有选择数据类型(除了ID以外)
            const hasDataTypes = columns.length > 1;
            const previewTable = document.getElementById('previewTable');
            const emptyMessage = document.getElementById('emptyMessage');
            
            if (hasDataTypes) {
                previewTable.style.display = 'table';
                emptyMessage.style.display = 'none';
            } else {
                previewTable.style.display = 'none';
                emptyMessage.style.display = 'flex';
            }
        }
        
        // 更新数据类型设置区域
        function updateDataTypeSettings() {
            const container = document.getElementById('dataTypeSettings');
            container.innerHTML = '';
            
            columns.forEach(col => {
                if (col.type === 'id') return; // 跳过ID列
                
                let html = '';
                
                switch(col.type) {
                    case 'age':
                        html = `
                            <div style="margin-bottom: 15px;">
                                <h3 style="margin-bottom: 10px;">${col.name}设置</h3>
                                <div class="grid-2">
                                    <div>
                                        <label>最小值</label>
                                        <input type="number" class="param-min" value="${col.min || 18}" data-id="${col.id}">
                                    </div>
                                    <div>
                                        <label>最大值</label>
                                        <input type="number" class="param-max" value="${col.max || 65}" data-id="${col.id}">
                                    </div>
                                </div>
                            </div>
                        `;
                        break;
                    case 'date':
                        html = `
                            <div style="margin-bottom: 15px;">
                                <h3 style="margin-bottom: 10px;">${col.name}设置</h3>
                                <div class="grid-2">
                                    <div>
                                        <label>开始日期</label>
                                        <input type="date" class="param-start" value="${col.start || '2020-01-01'}" data-id="${col.id}">
                                    </div>
                                    <div>
                                        <label>结束日期</label>
                                        <input type="date" class="param-end" value="${col.end || '2023-12-31'}" data-id="${col.id}">
                                    </div>
                                </div>
                            </div>
                        `;
                        break;
                }
                
                if (html) {
                    const div = document.createElement('div');
                    div.innerHTML = html;
                    container.appendChild(div);
                }
            });
            
            // 如果没有设置选项，隐藏设置区域
            container.style.display = container.children.length > 0 ? 'block' : 'none';
        }

        // 数据生成函数
        function generateData() {
            try {
                const rowCount = parseInt(document.getElementById('rowCount').value) || 50;
                const data = [];
                
                // 如果只有ID列，返回空数据
                if (columns.length <= 1) {
                    return data;
                }
                
                for (let i = 0; i < rowCount; i++) {
                    const row = {};
                    
                    columns.forEach(col => {
                        switch(col.type) {
                            case 'id':
                                row[col.id] = i + 1;
                                break;
                            case 'fullName':
                                row[col.id] = generateFullName();
                                break;
                            case 'age':
                                const min = parseInt(col.min) || 18;
                                const max = parseInt(col.max) || 65;
                                row[col.id] = Math.floor(Math.random() * (max - min + 1)) + min;
                                break;
                            case 'email':
                                row[col.id] = generateEmail();
                                break;
                            case 'phone':
                                row[col.id] = generatePhone();
                                break;
                            case 'city':
                                row[col.id] = generateCity();
                                break;
                            case 'date':
                                const start = new Date(col.start || '2020-01-01');
                                const end = new Date(col.end || '2023-12-31');
                                row[col.id] = generateDate(start, end);
                                break;
                            case 'gender':
                                row[col.id] = generateGender();
                                break;
                            case 'address':
                                row[col.id] = generateAddress();
                                break;
                            case 'company':
                                row[col.id] = generateCompany();
                                break;
                            case 'job':
                                row[col.id] = generateJob();
                                break;
                            case 'education':
                                row[col.id] = generateEducation();
                                break;
                            case 'university':
                                row[col.id] = generateUniversity();
                                break;
                            case 'major':
                                row[col.id] = generateMajor();
                                break;
                            default:
                                row[col.id] = '';
                        }
                    });
                    
                    data.push(row);
                }
                
                console.log('生成的数据:', data);
                return data;
            } catch (error) {
                console.error('生成数据时出错:', error);
                alert('生成数据时出错: ' + error.message);
                return [];
            }
        }

        // 显示数据预览
        function displayDataPreview(data) {
            try {
                // 如果没有数据或只有ID列，显示空消息
                const hasDataTypes = columns.length > 1;
                const previewTable = document.getElementById('previewTable');
                const emptyMessage = document.getElementById('emptyMessage');
                
                if (!hasDataTypes || data.length === 0) {
                    previewTable.style.display = 'none';
                    emptyMessage.style.display = 'flex';
                    return;
                }
                
                previewTable.style.display = 'table';
                emptyMessage.style.display = 'none';
                
                const tableBody = document.querySelector('#previewTable tbody');
                tableBody.innerHTML = '';
                
                // 更新表头
                const tableHead = document.querySelector('#previewTable thead tr');
                tableHead.innerHTML = '';
                columns.forEach(col => {
                    const th = document.createElement('th');
                    th.textContent = col.name;
                    tableHead.appendChild(th);
                });
                
                // 添加数据行
                data.slice(0, 20).forEach(row => {
                    const tr = document.createElement('tr');
                    
                    columns.forEach(col => {
                        const td = document.createElement('td');
                        td.textContent = row[col.id];
                        tr.appendChild(td);
                    });
                    
                    tableBody.appendChild(tr);
                });
            } catch (error) {
                console.error('显示数据时出错:', error);
                alert('显示数据时出错: ' + error.message);
            }
        }
        
        // 生成函数
        function generateFullName() {
            const firstNames = ['张', '王', '李', '赵', '陈', '刘', '杨', '黄', '周', '吴'];
            const lastNames = ['伟', '芳', '娜', '秀英', '敏', '静', '丽', '强', '磊', '军'];
            return firstNames[Math.floor(Math.random() * firstNames.length)] + 
                   lastNames[Math.floor(Math.random() * lastNames.length)];
        }
        
        function generateEmail() {
            const domains = ['gmail.com', 'yahoo.com', 'hotmail.com', 'outlook.com', 'example.com'];
            const name = Math.random().toString(36).substring(2, 8);
            return `${name}@${domains[Math.floor(Math.random() * domains.length)]}`;
        }
        
        function generatePhone() {
            return '1' + Math.floor(Math.random() * 9000000000 + 1000000000).toString().substring(0, 10);
        }
        
        function generateCity() {
            const cities = ['北京', '上海', '广州', '深圳', '杭州', '成都', '重庆', '武汉', '西安', '南京'];
            return cities[Math.floor(Math.random() * cities.length)];
        }
        
        function generateDate(start, end) {
            const date = new Date(start.getTime() + Math.random() * (end.getTime() - start.getTime()));
            return date.toISOString().split('T')[0];
        }
        
        function generateText(wordCount) {
            const words = ['数据', '分析', '科学', '技术', '人工智能', '学习', '开发', '应用', '项目', '系统'];
            let text = '';
            
            for (let i = 0; i < wordCount; i++) {
                text += words[Math.floor(Math.random() * words.length)];
                if (i < wordCount - 1) text += ' ';
            }
            
            return text;
        }

        // 扩展生成函数
        function generateGender() {
            return Math.random() > 0.5 ? '男' : '女';
        }
        
        function generateAddress() {
            const provinces = ['北京市', '上海市', '广东省', '江苏省', '浙江省', '四川省', '湖北省'];
            const cities = ['北京', '上海', '广州', '深圳', '杭州', '成都', '武汉', '南京'];
            const districts = ['朝阳区', '海淀区', '浦东新区', '福田区', '西湖区', '锦江区', '武昌区'];
            const streets = ['中关村大街', '人民路', '解放大道', '天河路', '西湖路', '锦江大道', '中山路'];
            
            const province = provinces[Math.floor(Math.random() * provinces.length)];
            const city = cities[Math.floor(Math.random() * cities.length)];
            const district = districts[Math.floor(Math.random() * districts.length)];
            const street = streets[Math.floor(Math.random() * streets.length)];
            const number = Math.floor(Math.random() * 200) + 1 + '号';
            
            return `${province}${city}${district}${street}${number}`;
        }
        
        function generateCompany() {
            const prefixes = ['联合', '恒通', '东方', '万达', '京东', '阿里', '腾讯', '百度', '华为', '小米'];
            const types = ['科技', '网络', '电子', '信息', '通讯', '传媒', '教育', '医疗', '金融', '地产'];
            const suffixes = ['有限公司', '股份有限公司', '集团', '控股集团'];
            
            const prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
            const type = types[Math.floor(Math.random() * types.length)];
            const suffix = suffixes[Math.floor(Math.random() * suffixes.length)];
            
            return prefix + type + suffix;
        }
        
        function generateJob() {
            const jobs = ['软件工程师', '产品经理', 'UI设计师', '市场专员', '销售经理', 
                          '人力资源', '财务主管', '运营总监', '客服代表', '项目经理'];
            return jobs[Math.floor(Math.random() * jobs.length)];
        }
        
        function generateEducation() {
            const educations = ['高中', '专科', '本科', '硕士', '博士'];
            return educations[Math.floor(Math.random() * educations.length)];
        }
        
        function generateUniversity() {
            const universities = ['北京大学', '清华大学', '复旦大学', '浙江大学', '南京大学', 
                                '武汉大学', '上海交通大学', '中国人民大学', '华中科技大学', '四川大学'];
            return universities[Math.floor(Math.random() * universities.length)];
        }
        
        function generateMajor() {
            const majors = ['计算机科学', '软件工程', '数据科学', '电子工程', '机械工程', 
                           '金融学', '经济学', '市场营销', '心理学', '教育学', '医学', '生物学', '物理学'];
            return majors[Math.floor(Math.random() * majors.length)];
        }

        // 下载CSV文件
        function downloadCSV(data) {
            try {
                let csv = '';
                
                // 添加表头
                csv += columns.map(col => `"${col.name}"`).join(',') + '\n';
                
                // 添加数据行
                data.forEach(row => {
                    const values = columns.map(col => {
                        let value = row[col.id];
                        if (typeof value === 'string' && value.includes(',')) {
                            return `"${value}"`;
                        }
                        return value;
                    });
                    csv += values.join(',') + '\n';
                });
                
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', 'dataset.csv');
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (error) {
                console.error('下载CSV时出错:', error);
                alert('下载CSV时出错: ' + error.message);
            }
        }
        
        // 复制到剪贴板
        function copyToClipboard(data) {
            try {
                let text = '';
                
                // 添加表头
                text += columns.map(col => col.name).join('\t') + '\n';
                
                // 添加数据行
                data.forEach(row => {
                    text += columns.map(col => row[col.id]).join('\t') + '\n';
                });
                
                navigator.clipboard.writeText(text)
                    .then(() => showNotification('数据已成功复制到剪贴板！'))
                    .catch(err => {
                        console.error('复制失败:', err);
                        showNotification('复制失败，请手动选择并复制数据');
                    });
            } catch (error) {
                console.error('复制到剪贴板时出错:', error);
                alert('复制到剪贴板时出错: ' + error.message);
            }
        }

        // 事件绑定 - 使用窗口加载事件确保DOM完全加载
        window.addEventListener('load', function() {
            console.log('页面已加载，绑定事件...');
            
            // 初始化数据类型选择
            initDataTypes();
            
            // 生成初始数据
            const initialData = generateData();
            displayDataPreview(initialData);
            
            // 绑定更多数据类型按钮
            document.getElementById('moreTypesBtn').addEventListener('click', function() {
                const moreSection = document.getElementById('moreTypesSection');
                const isExpanded = moreSection.style.display === 'block';
                
                moreSection.style.display = isExpanded ? 'none' : 'block';
                this.classList.toggle('expanded');
                
                if (isExpanded) {
                    this.innerHTML = '<i class="fas fa-chevron-down"></i> 更多数据类型';
                } else {
                    this.innerHTML = '<i class="fas fa-chevron-up"></i> 收起更多类型';
                }
            });
            
            // 绑定按钮事件
            document.getElementById('generateBtn').addEventListener('click', function() {
                console.log('生成按钮被点击');
                try {
                    const data = generateData();
                    displayDataPreview(data);
                    showNotification(`成功生成 ${data.length} 条数据！`);
                } catch (error) {
                    console.error('生成数据时出错:', error);
                    alert('生成数据时出错: ' + error.message);
                }
            });
            
            document.getElementById('downloadBtn').addEventListener('click', function() {
                console.log('下载按钮被点击');
                const data = generateData();
                downloadCSV(data);
            });
            
            document.getElementById('copyBtn').addEventListener('click', function() {
                console.log('复制按钮被点击');
                const data = generateData();
                copyToClipboard(data);
            });
            
            document.getElementById('resetBtn').addEventListener('click', function() {
                console.log('重置按钮被点击');
                
                // 清空所有复选框选择
                document.querySelectorAll('.data-type-input').forEach(checkbox => {
                    checkbox.checked = false;
                });
                
                // 恢复数据量默认值
                document.getElementById('rowCount').value = 50;
                
                // 隐藏更多数据类型区域
                document.getElementById('moreTypesSection').style.display = 'none';
                document.getElementById('moreTypesBtn').innerHTML = '<i class="fas fa-chevron-down"></i> 更多数据类型';
                document.getElementById('moreTypesBtn').classList.remove('expanded');
                
                // 重新初始化数据类型
                initDataTypes();
                
                // 显示空消息（不生成新数据）
                document.getElementById('previewTable').style.display = 'none';
                document.getElementById('emptyMessage').style.display = 'flex';
                
                showNotification('配置已重置为默认值！');
            });
            
            // 绑定复选框变更事件
            document.querySelectorAll('.data-type-input').forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    console.log('复选框变更:', this.value, this.checked);
                    initDataTypes();
                });
            });
            
            // 绑定参数设置变更事件
            document.getElementById('dataTypeSettings').addEventListener('input', function(e) {
                if (e.target.classList.contains('param-min')) {
                    const id = e.target.dataset.id;
                    const col = columns.find(c => c.id === id);
                    if (col) col.min = e.target.value;
                } else if (e.target.classList.contains('param-max')) {
                    const id = e.target.dataset.id;
                    const col = columns.find(c => c.id === id);
                    if (col) col.max = e.target.value;
                } else if (e.target.classList.contains('param-start')) {
                    const id = e.target.dataset.id;
                    const col = columns.find(c => c.id === id);
                    if (col) col.start = e.target.value;
                } else if (e.target.classList.contains('param-end')) {
                    const id = e.target.dataset.id;
                    const col = columns.find(c => c.id === id);
                    if (col) col.end = e.target.value;
                } else if (e.target.classList.contains('param-length')) {
                    const id = e.target.dataset.id;
                    const col = columns.find(c => c.id === id);
                    if (col) col.length = e.target.value;
                }
            });
            

            console.log('所有事件绑定完成');
        });
    </script>
</body>
</html>
