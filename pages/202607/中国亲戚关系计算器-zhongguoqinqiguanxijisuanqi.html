<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国亲戚关系计算器</title>
    <script src="https://passer-by.com/relationship/dist/relationship.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 100%;
            max-width: 600px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .title {
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 8px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 14px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-label {
            font-size: 14px;
            color: #34495e;
            font-weight: 500;
        }

        .gender-select, .mode-select {
            padding: 8px 12px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            background: white;
            color: #2c3e50;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .gender-select:focus, .mode-select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-section {
            margin-bottom: 25px;
        }

        .input-box {
            width: 100%;
            padding: 15px 20px;
            border: 3px solid #e1e8ed;
            border-radius: 12px;
            font-size: 18px;
            color: #2c3e50;
            background: #f8fafc;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .input-box:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .input-box::placeholder {
            color: #95a5a6;
        }

        .quick-buttons {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 16px;
            color: #2c3e50;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .relation-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 8px;
            border: 2px solid #e1e8ed;
            border-radius: 10px;
            background: white;
            color: #2c3e50;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
        }

        .relation-btn:hover {
            border-color: #667eea;
            background: #f8fafc;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }

        .relation-btn:active {
            transform: translateY(0);
        }

        .relation-btn small {
            font-size: 11px;
            color: #7f8c8d;
            margin-top: 3px;
            font-weight: 400;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .action-btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .calculate-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }

        .calculate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .clear-btn {
            background: #95a5a6;
            color: white;
        }

        .clear-btn:hover {
            background: #7f8c8d;
        }

        .backspace-btn {
            background: #e74c3c;
            color: white;
        }

        .backspace-btn:hover {
            background: #c0392b;
        }

        .result-section {
            background: linear-gradient(135deg, #f8fafc 0%, #e8f4fd 100%);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 5px solid #667eea;
            border: 2px solid #e8f4fd;
            transition: all 0.3s ease;
        }

        .result-section.has-result {
            background: linear-gradient(135deg, #e8f5e8 0%, #f0f9ff 100%);
            border-color: #10b981;
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.15);
        }

        .result-section.has-error {
            background: linear-gradient(135deg, #fef2f2 0%, #fff1f2 100%);
            border-color: #ef4444;
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.15);
        }

        .result-title {
            font-size: 16px;
            color: #2c3e50;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .result-content {
            font-size: 24px;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
            min-height: 36px;
            display: flex;
            align-items: center;
        }

        .result-detail {
            font-size: 14px;
            color: #7f8c8d;
            line-height: 1.5;
        }

        .error-message {
            color: #e74c3c;
            font-size: 16px;
            text-align: center;
            padding: 15px;
            background: #fdf2f2;
            border-radius: 8px;
            border-left: 4px solid #e74c3c;
        }

        .examples {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            border-left: 4px solid #28a745;
        }

        .examples-title {
            font-size: 16px;
            color: #2c3e50;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .example-item {
            margin-bottom: 8px;
            font-size: 14px;
            color: #6c757d;
        }

        .example-input {
            color: #667eea;
            font-weight: 500;
        }

        .example-output {
            color: #28a745;
            font-weight: 600;
        }

        .footer {
            text-align: center;
            padding: 20px;
            margin-top: 30px;
            color: #7f8c8d;
            font-size: 14px;
            line-height: 1.6;
        }

        .footer p {
            margin: 5px 0;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .footer a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
                margin: 10px;
            }

            .title {
                font-size: 24px;
            }

            .controls {
                flex-direction: column;
                gap: 15px;
            }

            .button-grid {
                grid-template-columns: repeat(4, 1fr);
            }

            .action-buttons {
                flex-direction: column;
            }

            .result-section {
                position: sticky;
                top: 10px;
                z-index: 10;
                margin-bottom: 15px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            }

            .result-content {
                font-size: 20px;
                text-align: center;
            }

            .input-box {
                font-size: 16px;
                padding: 12px 15px;
            }

            .relation-btn {
                padding: 10px 6px;
                font-size: 14px;
            }

            .relation-btn small {
                font-size: 10px;
            }
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">中国亲戚关系计算器</h1>
            <p class="subtitle">逢年过节遇到三姑六婆，轻松搞定亲戚关系～</p>
        </div>

        <div class="controls">
            <div class="control-group">
                <label class="control-label">我的性别:</label>
                <select class="gender-select" id="genderSelect">
                    <option value="-1">未知</option>
                    <option value="1">男性</option>
                    <option value="0">女性</option>
                </select>
            </div>
            <div class="control-group">
                <label class="control-label">查询方式:</label>
                <select class="mode-select" id="modeSelect">
                    <option value="default">我叫TA什么</option>
                    <option value="reverse">TA叫我什么</option>
                    <option value="chain">解析关系链</option>
                </select>
            </div>
        </div>

        <div class="input-section">
            <input type="text" 
                   class="input-box" 
                   id="relationInput" 
                   placeholder="请输入亲戚关系，如：爸爸的妈妈的哥哥" 
                   autocomplete="off">
        </div>

        <div class="result-section">
            <div class="result-title">计算结果</div>
            <div class="result-content" id="resultContent">请输入关系后点击计算</div>
            <div class="result-detail" id="resultDetail"></div>
        </div>

        <div class="quick-buttons">
            <div class="section-title">快捷输入</div>
            
            <div class="button-grid">
                <button class="relation-btn" onclick="addRelation('父')">父<small>爸爸</small></button>
                <button class="relation-btn" onclick="addRelation('母')">母<small>妈妈</small></button>
                <button class="relation-btn" onclick="addRelation('夫')">夫<small>老公</small></button>
                <button class="relation-btn" onclick="addRelation('妻')">妻<small>老婆</small></button>
            </div>
            
            <div class="button-grid">
                <button class="relation-btn" onclick="addRelation('子')">子<small>儿子</small></button>
                <button class="relation-btn" onclick="addRelation('女')">女<small>女儿</small></button>
                <button class="relation-btn" onclick="addRelation('兄')">兄<small>哥哥</small></button>
                <button class="relation-btn" onclick="addRelation('弟')">弟<small>弟弟</small></button>
            </div>
            
            <div class="button-grid">
                <button class="relation-btn" onclick="addRelation('姐')">姐<small>姐姐</small></button>
                <button class="relation-btn" onclick="addRelation('妹')">妹<small>妹妹</small></button>
                <button class="relation-btn" onclick="addRelation('爷')">爷<small>爷爷</small></button>
                <button class="relation-btn" onclick="addRelation('奶')">奶<small>奶奶</small></button>
            </div>
            
            <div class="button-grid">
                <button class="relation-btn" onclick="addRelation('舅')">舅<small>舅舅</small></button>
                <button class="relation-btn" onclick="addRelation('姨')">姨<small>姨妈</small></button>
                <button class="relation-btn" onclick="addRelation('姑')">姑<small>姑姑</small></button>
                <button class="relation-btn" onclick="addRelation('叔')">叔<small>叔叔</small></button>
            </div>
        </div>

        <div class="action-buttons">
            <button class="action-btn calculate-btn" onclick="calculateRelation()">计算关系</button>
            <button class="action-btn backspace-btn" onclick="smartBackspace()">回退</button>
            <button class="action-btn clear-btn" onclick="clearInput()">清空</button>
        </div>

        <div class="examples">
            <div class="examples-title">使用示例</div>
            <div class="example-item">
                <span class="example-input">爸爸的妈妈</span> → 
                <span class="example-output">奶奶</span>
            </div>
            <div class="example-item">
                <span class="example-input">妈妈的哥哥</span> → 
                <span class="example-output">舅舅</span>
            </div>
            <div class="example-item">
                <span class="example-input">老公的姐姐</span> → 
                <span class="example-output">大姑子</span>
            </div>
            <div class="example-item">
                <span class="example-input">哥哥的儿子</span> → 
                <span class="example-output">侄子</span>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>由 老陈 使用 AI 生成，公众号：老陈的AI编程实验室</p>
        <p>（<a href="https://pan.quark.cn/s/326bf2796cdc" target="_blank">网页源码，点这领取</a>）</p>
    </div>

    <script>
        // 关系映射表
        const relationMap = {
            '父': '爸爸',
            '母': '妈妈',
            '夫': '老公',
            '妻': '老婆',
            '子': '儿子',
            '女': '女儿',
            '兄': '哥哥',
            '弟': '弟弟',
            '姐': '姐姐',
            '妹': '妹妹',
            '爷': '爷爷',
            '奶': '奶奶',
            '舅': '舅舅',
            '姨': '姨妈',
            '姑': '姑姑',
            '叔': '叔叔'
        };

        // 获取DOM元素
        const relationInput = document.getElementById('relationInput');
        const genderSelect = document.getElementById('genderSelect');
        const modeSelect = document.getElementById('modeSelect');
        const resultContent = document.getElementById('resultContent');
        const resultDetail = document.getElementById('resultDetail');

        // 检测是否为移动设备
        function isMobile() {
            return window.innerWidth <= 768 || /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        }

        // 添加关系到输入框
        function addRelation(shortName) {
            const fullName = relationMap[shortName];
            const currentText = relationInput.value.trim();
            
            if (currentText === '') {
                relationInput.value = fullName;
            } else {
                relationInput.value = currentText + '的' + fullName;
            }
            
            // 触发输入事件以便实时计算
            relationInput.dispatchEvent(new Event('input'));
            
            // 只在桌面端自动聚焦，移动端不自动聚焦避免弹出键盘
            if (!isMobile()) {
                relationInput.focus();
            }
        }

        // 智能回退功能
        function smartBackspace() {
            const text = relationInput.value;
            const lastIndex = text.lastIndexOf('的');
            
            if (lastIndex > 0) {
                relationInput.value = text.substring(0, lastIndex);
            } else {
                relationInput.value = '';
            }
            
            // 触发重新计算或清空
            relationInput.dispatchEvent(new Event('input'));
            
            // 只在桌面端自动聚焦
            if (!isMobile()) {
                relationInput.focus();
            }
        }

        // 清空输入框
        function clearInput() {
            relationInput.value = '';
            resultContent.textContent = '请输入关系后点击计算';
            resultDetail.textContent = '';
            clearResultStyle(); // 清空结果样式
            
            // 只在桌面端自动聚焦
            if (!isMobile()) {
                relationInput.focus();
            }
        }

        // 计算关系
        function calculateRelation() {
            const inputText = relationInput.value.trim();
            const gender = parseInt(genderSelect.value);
            const mode = modeSelect.value;

            if (!inputText) {
                showError('请输入亲戚关系');
                return;
            }

            // 检查relationship函数是否可用
            if (typeof relationship === 'undefined') {
                showError('亲戚关系计算库加载失败，请刷新页面重试');
                return;
            }

            try {
                // 显示加载状态
                resultContent.innerHTML = '<div class="loading"></div> 计算中...';
                resultDetail.textContent = '';

                // 构建查询选项
                const options = {
                    text: inputText,
                    sex: gender,
                    type: mode === 'chain' ? 'chain' : 'default',
                    reverse: mode === 'reverse'
                };

                // 调用计算函数
                const result = relationship(options);
                
                // 显示结果
                displayResult(result, inputText, mode);
                
            } catch (error) {
                console.error('计算错误:', error);
                showError('计算过程中出现错误：' + error.message);
            }
        }

        // 显示计算结果
        function displayResult(result, inputText, mode) {
            const resultSection = document.querySelector('.result-section');
            
            if (!result || result.length === 0) {
                showError('找不到对应的亲戚关系，请检查输入是否正确');
                return;
            }

            let resultText = '';
            let detailText = '';

            if (mode === 'chain') {
                // 关系链模式
                resultText = result.join(' / ');
                detailText = `"${inputText}" 的关系链解析`;
            } else if (mode === 'reverse') {
                // 反向查询模式
                resultText = result.join(' / ');
                detailText = `${inputText} 称呼我为：${resultText}`;
            } else {
                // 默认模式
                resultText = result.join(' / ');
                detailText = `我称呼 "${inputText}" 为：${resultText}`;
            }

            resultContent.textContent = resultText;
            resultDetail.textContent = detailText;
            
            // 更新结果区域样式
            resultSection.className = 'result-section has-result';
            
            // 移动端自动滚动到结果
            scrollToResult();
        }

        // 显示错误信息
        function showError(message) {
            const resultSection = document.querySelector('.result-section');
            resultContent.innerHTML = `<span style="color: #e74c3c;">${message}</span>`;
            resultDetail.textContent = '';
            
            // 更新结果区域样式
            resultSection.className = 'result-section has-error';
            
            // 移动端自动滚动到结果
            scrollToResult();
        }

        // 清空结果样式
        function clearResultStyle() {
            const resultSection = document.querySelector('.result-section');
            resultSection.className = 'result-section';
        }

        // 移动端自动滚动到结果区域
        function scrollToResult() {
            if (isMobile()) { // 使用统一的移动端检测函数
                setTimeout(() => {
                    const resultSection = document.querySelector('.result-section');
                    resultSection.scrollIntoView({ 
                        behavior: 'smooth', 
                        block: 'nearest' 
                    });
                }, 100);
            }
        }

        // 实时计算功能
        let calculationTimeout;
        relationInput.addEventListener('input', function() {
            // 防抖处理
            clearTimeout(calculationTimeout);
            calculationTimeout = setTimeout(() => {
                if (relationInput.value.trim()) {
                    calculateRelation();
                } else {
                    resultContent.textContent = '请输入关系后点击计算';
                    resultDetail.textContent = '';
                    clearResultStyle(); // 清空结果样式
                }
            }, 500);
        });

        // 回车键计算
        relationInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                calculateRelation();
            }
        });

        // 性别和模式改变时重新计算
        genderSelect.addEventListener('change', function() {
            if (relationInput.value.trim()) {
                calculateRelation();
            }
        });

        modeSelect.addEventListener('change', function() {
            if (relationInput.value.trim()) {
                calculateRelation();
            }
        });
    </script>
</body>
</html>
