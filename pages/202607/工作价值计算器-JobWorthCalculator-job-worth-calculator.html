<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作价值计算器 - Job Worth Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .slogan {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rainbow 3s ease-in-out infinite;
        }

        @keyframes rainbow {
            0%, 100% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(180deg); }
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        .language-toggle {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .lang-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* Developer Contact Styles */
        .developer-contact {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
            margin: 40px auto;
            max-width: 600px;
            text-align: center;
        }

        .developer-contact h3 {
            color: white;
            font-size: 24px;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .contact-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .qr-section img {
            width: 120px;
            height: 120px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .qr-section img:hover {
            transform: scale(1.05);
        }

        .qr-label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            margin: 0;
        }

        .account-name {
            color: white;
            font-size: 18px;
            font-weight: 600;
            margin: 0;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .contact-icon {
            font-size: 24px;
        }

        .contact-text {
            text-align: left;
        }

        .contact-label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            margin: 0 0 5px 0;
        }

        .contact-value {
            color: white;
            font-size: 16px;
            font-weight: 600;
            margin: 0;
        }

        .contact-desc {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            margin: 0;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .contact-content {
                flex-direction: column;
                gap: 25px;
            }

            .developer-contact {
                margin: 30px 20px;
                padding: 25px 20px;
            }

            .qr-section img {
                width: 100px;
                height: 100px;
            }
        }

        .lang-btn.active {
            background: rgba(255,255,255,0.3);
            border-color: rgba(255,255,255,0.5);
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .form-section, .result-section {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #2c3e50;
            border-bottom: 3px solid #3498db;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: white;
        }

        .form-control:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 20px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(52, 152, 219, 0.3);
        }

        .score-display {
            text-align: center;
            margin-bottom: 30px;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 900;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .score-excellent { background: linear-gradient(135deg, #27ae60, #2ecc71); }
        .score-good { background: linear-gradient(135deg, #f39c12, #e67e22); }
        .score-average { background: linear-gradient(135deg, #e74c3c, #c0392b); }

        .score-label {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2c3e50;
        }

        .analysis-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #3498db;
        }

        .analysis-item h4 {
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .analysis-item p {
            color: #7f8c8d;
            font-size: 0.9rem;
        }

        .report-section {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 30px;
            margin-top: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .share-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .share-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .share-download {
            background: #27ae60;
            color: white;
        }

        .share-copy {
            background: #3498db;
            color: white;
        }

        .share-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .feature-card {
            background: rgba(255,255,255,0.9);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .feature-card:hover {
            transform: translateY(-5px);
        }

        .feature-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .feature-title {
            font-weight: 700;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .feature-desc {
            color: #7f8c8d;
            font-size: 0.9rem;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .slogan {
                font-size: 2rem;
            }

            .main-content {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .share-buttons {
                flex-direction: column;
            }
        }

        .tooltip {
            position: relative;
            cursor: help;
        }

        .tooltip:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #2c3e50;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            white-space: nowrap;
            z-index: 1000;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3498db, #2980b9);
            transition: width 0.5s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1 class="slogan" id="slogan">这b班上得值不值</h1>
            <p class="subtitle" id="subtitle">全面评估你的工作真实价值 💼</p>
            
            <div class="language-toggle">
                <button class="lang-btn active" onclick="setLanguage('zh')">中文</button>
                <button class="lang-btn" onclick="setLanguage('en')">English</button>
            </div>
        </div>

        <!-- Features -->
        <div class="features">
            <div class="feature-card">
                <div class="feature-icon">💰</div>
                <div class="feature-title" data-zh="全面评估" data-en="Comprehensive Assessment">全面评估</div>
                <div class="feature-desc" data-zh="基于薪资、工作时间、通勤等多方面因素" data-en="Based on salary, work hours, commute and more">基于薪资、工作时间、通勤等多方面因素</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">🌏</div>
                <div class="feature-title" data-zh="PPP转换" data-en="PPP Conversion">PPP转换</div>
                <div class="feature-desc" data-zh="支持190多个国家的购买力平价比较" data-en="Support PPP comparison for 190+ countries">支持190多个国家的购买力平价比较</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">👩‍🎓</div>
                <div class="feature-title" data-zh="个人因素" data-en="Personal Factors">个人因素</div>
                <div class="feature-desc" data-zh="根据学历、经验等个人情况定制" data-en="Customized based on education and experience">根据学历、经验等个人情况定制</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">📱</div>
                <div class="feature-title" data-zh="详细报告" data-en="Detailed Report">详细报告</div>
                <div class="feature-desc" data-zh="生成可分享的工作分析报告" data-en="Generate shareable work analysis report">生成可分享的工作分析报告</div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Form Section -->
            <div class="form-section">
                <h2 class="section-title" data-zh="工作信息" data-en="Job Information">工作信息</h2>
                
                <div class="form-group">
                    <label data-zh="年薪 (当地货币)" data-en="Annual Salary (Local Currency)">年薪 (当地货币)</label>
                    <input type="number" id="salary" class="form-control" placeholder="100000" min="0">
                </div>

                <div class="form-group">
                    <label data-zh="工作国家/地区" data-en="Country/Region">工作国家/地区</label>
                    <select id="country" class="form-control">
                        <option value="CN">中国 China</option>
                        <option value="US">美国 United States</option>
                        <option value="JP">日本 Japan</option>
                        <option value="DE">德国 Germany</option>
                        <option value="UK">英国 United Kingdom</option>
                        <option value="SG">新加坡 Singapore</option>
                        <option value="AU">澳大利亚 Australia</option>
                        <option value="CA">加拿大 Canada</option>
                        <option value="FR">法国 France</option>
                        <option value="KR">韩国 South Korea</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label data-zh="每周工作天数" data-en="Work Days per Week">每周工作天数</label>
                        <input type="number" id="workDays" class="form-control" value="5" min="1" max="7">
                    </div>
                    <div class="form-group">
                        <label data-zh="每日工作小时" data-en="Work Hours per Day">每日工作小时</label>
                        <input type="number" id="workHours" class="form-control" value="8" min="1" max="24">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label data-zh="单程通勤时间(分钟)" data-en="Commute Time (minutes)">单程通勤时间(分钟)</label>
                        <input type="number" id="commuteTime" class="form-control" value="30" min="0">
                    </div>
                    <div class="form-group">
                        <label data-zh="远程工作比例(%)" data-en="Remote Work Ratio (%)">远程工作比例(%)</label>
                        <input type="number" id="remoteRatio" class="form-control" value="0" min="0" max="100">
                    </div>
                </div>

                <div class="form-group">
                    <label data-zh="工作城市类型" data-en="City Type">工作城市类型</label>
                    <select id="cityType" class="form-control">
                        <option value="tier1" data-zh="一线城市" data-en="Tier 1 City">一线城市</option>
                        <option value="tier2" data-zh="二线城市" data-en="Tier 2 City">二线城市</option>
                        <option value="tier3" data-zh="三线城市" data-en="Tier 3 City">三线城市</option>
                        <option value="rural" data-zh="乡镇" data-en="Rural Area">乡镇</option>
                    </select>
                </div>

                <div class="form-group">
                    <label data-zh="工作环境" data-en="Work Environment">工作环境</label>
                    <select id="workEnv" class="form-control">
                        <option value="excellent" data-zh="优秀" data-en="Excellent">优秀</option>
                        <option value="good" data-zh="良好" data-en="Good">良好</option>
                        <option value="average" data-zh="一般" data-en="Average">一般</option>
                        <option value="poor" data-zh="较差" data-en="Poor">较差</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label data-zh="学历" data-en="Education">学历</label>
                        <select id="education" class="form-control">
                            <option value="phd" data-zh="博士" data-en="PhD">博士</option>
                            <option value="master" data-zh="硕士" data-en="Master">硕士</option>
                            <option value="bachelor" data-zh="本科" data-en="Bachelor">本科</option>
                            <option value="college" data-zh="专科" data-en="College">专科</option>
                            <option value="high" data-zh="高中" data-en="High School">高中</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label data-zh="工作经验(年)" data-en="Work Experience (years)">工作经验(年)</label>
                        <input type="number" id="experience" class="form-control" value="3" min="0">
                    </div>
                </div>

                <button class="btn" onclick="calculateWorth()" data-zh="计算工作价值" data-en="Calculate Job Worth">计算工作价值</button>
            </div>

            <!-- Result Section -->
            <div class="result-section">
                <h2 class="section-title" data-zh="评估结果" data-en="Assessment Result">评估结果</h2>
                
                <div class="score-display">
                    <div class="score-circle score-average" id="scoreCircle">
                        <span id="scoreValue">--</span>
                    </div>
                    <div class="score-label" id="scoreLabel" data-zh="工作价值评分" data-en="Job Worth Score">工作价值评分</div>
                </div>

                <div id="analysisResults">
                    <div class="analysis-item">
                        <h4 data-zh="💡 使用提示" data-en="💡 Usage Tips">💡 使用提示</h4>
                        <p data-zh="填写左侧表单信息，点击计算按钮获取详细的工作价值分析报告" data-en="Fill in the form on the left and click calculate to get detailed job worth analysis">填写左侧表单信息，点击计算按钮获取详细的工作价值分析报告</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Report Section -->
        <div class="report-section hidden" id="reportSection">
            <h2 class="section-title" data-zh="详细报告" data-en="Detailed Report">详细报告</h2>
            <div id="reportContent"></div>
            
            <div class="share-buttons">
                <button class="share-btn share-download" onclick="downloadReport()" data-zh="📥 下载报告" data-en="📥 Download Report">📥 下载报告</button>
                <button class="share-btn share-copy" onclick="copyReport()" data-zh="📋 复制链接" data-en="📋 Copy Link">📋 复制链接</button>
            </div>
        </div>
    </div>

    <!-- Developer Contact Section -->
    <div class="developer-contact">
        <div class="contact-container">
            <h3 data-zh="开发者联系方式" data-en="Developer Contact">开发者联系方式</h3>
            <div class="contact-content">

    <script>
        // PPP数据 (相对于美国的购买力平价指数)
        const pppData = {
            'CN': 0.65,  // 中国
            'US': 1.00,  // 美国
            'JP': 0.75,  // 日本
            'DE': 0.85,  // 德国
            'UK': 0.80,  // 英国
            'SG': 0.90,  // 新加坡
            'AU': 0.85,  // 澳大利亚
            'CA': 0.85,  // 加拿大
            'FR': 0.82,  // 法国
            'KR': 0.70   // 韩国
        };

        // 当前语言
        let currentLang = 'zh';

        // 语言切换
        function setLanguage(lang) {
            currentLang = lang;
            
            // 更新按钮状态
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // 更新文本
            updateLanguage();
        }

        function updateLanguage() {
            // 更新标语
            const slogan = document.getElementById('slogan');
            const subtitle = document.getElementById('subtitle');
            
            if (currentLang === 'en') {
                slogan.textContent = 'Is This Job Worth It?';
                subtitle.textContent = 'Comprehensive Job Value Assessment 💼';
            } else {
                slogan.textContent = '这b班上得值不值';
                subtitle.textContent = '全面评估你的工作真实价值 💼';
            }

            // 更新所有带语言属性的元素
            document.querySelectorAll('[data-zh][data-en]').forEach(element => {
                const text = currentLang === 'zh' ? element.getAttribute('data-zh') : element.getAttribute('data-en');
                if (element.tagName === 'OPTION') {
                    element.textContent = text;
                } else {
                    element.textContent = text;
                }
            });

            // 更新选择框选项
            updateSelectOptions();
        }

        function updateSelectOptions() {
            const cityType = document.getElementById('cityType');
            const workEnv = document.getElementById('workEnv');
            const education = document.getElementById('education');

            [cityType, workEnv, education].forEach(select => {
                Array.from(select.options).forEach(option => {
                    const text = currentLang === 'zh' ? option.getAttribute('data-zh') : option.getAttribute('data-en');
                    if (text) option.textContent = text;
                });
            });
        }

        // 计算工作价值
        function calculateWorth() {
            // 获取表单数据
            const salary = parseFloat(document.getElementById('salary').value) || 0;
            const country = document.getElementById('country').value;
            const workDays = parseInt(document.getElementById('workDays').value) || 5;
            const workHours = parseFloat(document.getElementById('workHours').value) || 8;
            const commuteTime = parseFloat(document.getElementById('commuteTime').value) || 0;
            const remoteRatio = parseFloat(document.getElementById('remoteRatio').value) || 0;
            const cityType = document.getElementById('cityType').value;
            const workEnv = document.getElementById('workEnv').value;
            const education = document.getElementById('education').value;
            const experience = parseInt(document.getElementById('experience').value) || 0;

            if (salary <= 0) {
                alert(currentLang === 'zh' ? '请输入有效的年薪' : 'Please enter a valid annual salary');
                return;
            }

            // 计算基础指标
            const pppFactor = pppData[country] || 1;
            const adjustedSalary = salary * pppFactor;
            const workDaysPerYear = workDays * 52;
            const totalWorkHours = workDaysPerYear * workHours;
            const dailyCommute = (commuteTime * 2 * (100 - remoteRatio) / 100) / 60; // 转换为小时
            const totalCommuteHours = workDaysPerYear * dailyCommute;
            const totalTimeInvested = totalWorkHours + totalCommuteHours;
            const hourlyRate = adjustedSalary / totalTimeInvested;

            // 计算各项因子
            const workLifeBalance = calculateWorkLifeBalance(workHours, commuteTime, remoteRatio);
            const environmentFactor = calculateEnvironmentFactor(cityType, workEnv);
            const educationBonus = calculateEducationBonus(education);
            const experienceAdjustment = calculateExperienceAdjustment(experience);

            // 计算最终评分 (0-100)
            const baseScore = Math.min(hourlyRate / 50, 1) * 40; // 时薪部分，最高40分
            const balanceScore = workLifeBalance * 25; // 工作生活平衡，最高25分
            const envScore = environmentFactor * 20; // 环境因素，最高20分
            const eduScore = educationBonus * 10; // 学历加成，最高10分
            const expScore = experienceAdjustment * 5; // 经验调整，最高5分

            const finalScore = Math.round(baseScore + balanceScore + envScore + eduScore + expScore);

            // 显示结果
            displayResults(finalScore, {
                adjustedSalary,
                hourlyRate,
                totalTimeInvested,
                workLifeBalance,
                environmentFactor,
                educationBonus,
                experienceAdjustment,
                country,
                pppFactor
            });
        }

        function calculateWorkLifeBalance(workHours, commuteTime, remoteRatio) {
            let score = 1.0;
            
            // 工作时长影响
            if (workHours <= 8) score *= 1.0;
            else if (workHours <= 10) score *= 0.8;
            else if (workHours <= 12) score *= 0.6;
            else score *= 0.4;
            
            // 通勤时间影响
            if (commuteTime <= 30) score *= 1.0;
            else if (commuteTime <= 60) score *= 0.8;
            else if (commuteTime <= 90) score *= 0.6;
            else score *= 0.4;
            
            // 远程工作加成
            score *= (1 + remoteRatio / 200);
            
            return Math.min(score, 1.0);
        }

        function calculateEnvironmentFactor(cityType, workEnv) {
            const cityFactors = {
                'tier1': 0.9,
                'tier2': 1.0,
                'tier3': 1.1,
                'rural': 1.2
            };
            
            const envFactors = {
                'excellent': 1.0,
                'good': 0.8,
                'average': 0.6,
                'poor': 0.4
            };
            
            return (cityFactors[cityType] || 1.0) * (envFactors[workEnv] || 0.6);
        }

        function calculateEducationBonus(education) {
            const eduFactors = {
                'phd': 1.0,
                'master': 0.8,
                'bachelor': 0.6,
                'college': 0.4,
                'high': 0.2
            };
            
            return eduFactors[education] || 0.4;
        }

        function calculateExperienceAdjustment(experience) {
            if (experience <= 1) return 0.5;
            if (experience <= 3) return 0.7;
            if (experience <= 5) return 0.9;
            if (experience <= 10) return 1.0;
            return 0.9; // 经验过多可能面临职业瓶颈
        }

        function displayResults(score, details) {
            // 更新评分显示
            const scoreCircle = document.getElementById('scoreCircle');
            const scoreValue = document.getElementById('scoreValue');
            
            scoreValue.textContent = score;
            
            // 根据分数设置颜色
            scoreCircle.className = 'score-circle ';
            if (score >= 80) scoreCircle.classList.add('score-excellent');
            else if (score >= 60) scoreCircle.classList.add('score-good');
            else scoreCircle.classList.add('score-average');

            // 生成分析结果
            const analysisResults = document.getElementById('analysisResults');
            const lang = currentLang;
            
            analysisResults.innerHTML = `
                <div class="analysis-item">
                    <h4>${lang === 'zh' ? '💰 薪资分析' : '💰 Salary Analysis'}</h4>
                    <p>${lang === 'zh' ? 
                        `PPP调整后年薪: $${details.adjustedSalary.toLocaleString()}<br>
                         实际时薪: $${details.hourlyRate.toFixed(2)}<br>
                         年投入总时间: ${details.totalTimeInvested.toFixed(0)}小时` :
                        `PPP Adjusted Salary: $${details.adjustedSalary.toLocaleString()}<br>
                         Actual Hourly Rate: $${details.hourlyRate.toFixed(2)}<br>
                         Total Annual Time: ${details.totalTimeInvested.toFixed(0)} hours`
                    }</p>
                </div>
                <div class="analysis-item">
                    <h4>${lang === 'zh' ? '⚖️ 工作生活平衡' : '⚖️ Work-Life Balance'}</h4>
                    <p>${lang === 'zh' ? 
                        `平衡指数: ${(details.workLifeBalance * 100).toFixed(0)}%<br>
                         ${getBalanceAdvice(details.workLifeBalance, lang)}` :
                        `Balance Index: ${(details.workLifeBalance * 100).toFixed(0)}%<br>
                         ${getBalanceAdvice(details.workLifeBalance, lang)}`
                    }</p>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${details.workLifeBalance * 100}%"></div>
                    </div>
                </div>
                <div class="analysis-item">
                    <h4>${lang === 'zh' ? '🌍 环境评估' : '🌍 Environment Assessment'}</h4>
                    <p>${lang === 'zh' ? 
                        `环境指数: ${(details.environmentFactor * 100).toFixed(0)}%<br>
                         ${getEnvironmentAdvice(details.environmentFactor, lang)}` :
                        `Environment Index: ${(details.environmentFactor * 100).toFixed(0)}%<br>
                         ${getEnvironmentAdvice(details.environmentFactor, lang)}`
                    }</p>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${details.environmentFactor * 100}%"></div>
                    </div>
                </div>
                <div class="analysis-item">
                    <h4>${lang === 'zh' ? '🎯 综合建议' : '🎯 Overall Recommendation'}</h4>
                    <p>${getOverallAdvice(score, lang)}</p>
                </div>
            `;

            // 生成详细报告
            generateDetailedReport(score, details);
        }

        function getBalanceAdvice(balance, lang) {
            if (balance >= 0.8) {
                return lang === 'zh' ? '工作生活平衡良好，继续保持' : 'Excellent work-life balance, keep it up';
            } else if (balance >= 0.6) {
                return lang === 'zh' ? '平衡尚可，可考虑优化通勤或工作时间' : 'Decent balance, consider optimizing commute or work hours';
            } else {
                return lang === 'zh' ? '工作生活失衡，建议重新评估工作安排' : 'Poor work-life balance, consider reassessing work arrangements';
            }
        }

        function getEnvironmentAdvice(env, lang) {
            if (env >= 0.8) {
                return lang === 'zh' ? '工作环境优秀，有利于长期发展' : 'Excellent work environment, great for long-term growth';
            } else if (env >= 0.6) {
                return lang === 'zh' ? '环境一般，可寻求改善机会' : 'Average environment, look for improvement opportunities';
            } else {
                return lang === 'zh' ? '环境较差，建议考虑换工作' : 'Poor environment, consider changing jobs';
            }
        }

        function getOverallAdvice(score, lang) {
            if (score >= 80) {
                return lang === 'zh' ? 
                    '🎉 恭喜！这份工作价值很高，建议继续深耕。可以考虑争取更好的发展机会或薪资待遇。' :
                    '🎉 Congratulations! This job has high value. Consider pursuing better development opportunities or salary.';
            } else if (score >= 60) {
                return lang === 'zh' ? 
                    '👍 这份工作整体不错，但还有提升空间。可以从工作效率、技能提升或谈判薪资方面入手。' :
                    '👍 This job is decent overall but has room for improvement. Focus on efficiency, skill development, or salary negotiation.';
            } else if (score >= 40) {
                return lang === 'zh' ? 
                    '⚠️ 工作价值偏低，建议认真考虑是否继续。可以寻找更好的机会或改善当前工作条件。' :
                    '⚠️ Job value is below average. Seriously consider whether to continue or look for better opportunities.';
            } else {
                return lang === 'zh' ? 
                    '🚨 工作价值很低，强烈建议尽快寻找新机会。当前工作可能不利于你的长期发展。' :
                    '🚨 Very low job value. Strongly recommend finding new opportunities soon. Current job may harm long-term development.';
            }
        }

        function generateDetailedReport(score, details) {
            const reportSection = document.getElementById('reportSection');
            const reportContent = document.getElementById('reportContent');
            const lang = currentLang;
            
            const reportHtml = `
                <div style="background: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 20px;">
                    <h3 style="color: #2c3e50; margin-bottom: 15px;">
                        ${lang === 'zh' ? '📊 工作价值评估报告' : '📊 Job Worth Assessment Report'}
                    </h3>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                        <div style="background: white; padding: 15px; border-radius: 8px; text-align: center;">
                            <div style="font-size: 2rem; font-weight: bold; color: #3498db;">${score}</div>
                            <div style="color: #7f8c8d;">${lang === 'zh' ? '综合评分' : 'Overall Score'}</div>
                        </div>
                        <div style="background: white; padding: 15px; border-radius: 8px; text-align: center;">
                            <div style="font-size: 1.5rem; font-weight: bold; color: #27ae60;">$${details.hourlyRate.toFixed(2)}</div>
                            <div style="color: #7f8c8d;">${lang === 'zh' ? '实际时薪' : 'Actual Hourly Rate'}</div>
                        </div>
                        <div style="background: white; padding: 15px; border-radius: 8px; text-align: center;">
                            <div style="font-size: 1.5rem; font-weight: bold; color: #e74c3c;">${details.totalTimeInvested.toFixed(0)}h</div>
                            <div style="color: #7f8c8d;">${lang === 'zh' ? '年投入时间' : 'Annual Time Investment'}</div>
                        </div>
                        <div style="background: white; padding: 15px; border-radius: 8px; text-align: center;">
                            <div style="font-size: 1.5rem; font-weight: bold; color: #f39c12;">${(details.workLifeBalance * 100).toFixed(0)}%</div>
                            <div style="color: #7f8c8d;">${lang === 'zh' ? '工作生活平衡' : 'Work-Life Balance'}</div>
                        </div>
                    </div>
                </div>
                
                <div style="background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 20px;">
                    <h4 style="color: #2c3e50; margin-bottom: 15px;">
                        ${lang === 'zh' ? '📈 详细分析' : '📈 Detailed Analysis'}
                    </h4>
                    <ul style="list-style: none; padding: 0;">
                        <li style="margin-bottom: 10px; padding: 10px; background: #f8f9fa; border-radius: 5px;">
                            <strong>${lang === 'zh' ? '薪资竞争力:' : 'Salary Competitiveness:'}</strong> 
                            ${getSalaryCompetitiveness(details.hourlyRate, lang)}
                        </li>
                        <li style="margin-bottom: 10px; padding: 10px; background: #f8f9fa; border-radius: 5px;">
                            <strong>${lang === 'zh' ? '时间效率:' : 'Time Efficiency:'}</strong> 
                            ${getTimeEfficiency(details.totalTimeInvested, lang)}
                        </li>
                        <li style="margin-bottom: 10px; padding: 10px; background: #f8f9fa; border-radius: 5px;">
                            <strong>${lang === 'zh' ? '发展潜力:' : 'Growth Potential:'}</strong> 
                            ${getGrowthPotential(details.educationBonus, details.experienceAdjustment, lang)}
                        </li>
                        <li style="margin-bottom: 10px; padding: 10px; background: #f8f9fa; border-radius: 5px;">
                            <strong>${lang === 'zh' ? 'PPP调整:' : 'PPP Adjustment:'}</strong> 
                            ${lang === 'zh' ? 
                                `购买力调整系数 ${details.pppFactor}，实际购买力相当于美国的 ${(details.pppFactor * 100).toFixed(0)}%` :
                                `PPP factor ${details.pppFactor}, actual purchasing power equivalent to ${(details.pppFactor * 100).toFixed(0)}% of US`
                            }
                        </li>
                    </ul>
                </div>
            `;
            
            reportContent.innerHTML = reportHtml;
            reportSection.classList.remove('hidden');
        }

        function getSalaryCompetitiveness(hourlyRate, lang) {
            if (hourlyRate >= 50) {
                return lang === 'zh' ? '薪资水平优秀，在市场中具有竞争优势' : 'Excellent salary level with competitive market advantage';
            } else if (hourlyRate >= 30) {
                return lang === 'zh' ? '薪资水平良好，符合市场平均水平' : 'Good salary level, meets market average';
            } else if (hourlyRate >= 15) {
                return lang === 'zh' ? '薪资水平一般，有提升空间' : 'Average salary level with room for improvement';
            } else {
                return lang === 'zh' ? '薪资水平偏低，建议寻求更好机会' : 'Below-average salary, consider seeking better opportunities';
            }
        }

        function getTimeEfficiency(totalTime, lang) {
            if (totalTime <= 2000) {
                return lang === 'zh' ? '时间投入合理，工作效率高' : 'Reasonable time investment with high efficiency';
            } else if (totalTime <= 2500) {
                return lang === 'zh' ? '时间投入适中，可进一步优化' : 'Moderate time investment, can be further optimized';
            } else {
                return lang === 'zh' ? '时间投入过多，影响生活质量' : 'Excessive time investment affecting quality of life';
            }
        }

        function getGrowthPotential(eduBonus, expAdjustment, lang) {
            const potential = (eduBonus + expAdjustment) / 2;
            if (potential >= 0.8) {
                return lang === 'zh' ? '发展潜力很大，适合长期投入' : 'High growth potential, suitable for long-term investment';
            } else if (potential >= 0.6) {
                return lang === 'zh' ? '有一定发展空间，可继续提升' : 'Some growth potential, can continue improving';
            } else {
                return lang === 'zh' ? '发展空间有限，考虑转换赛道' : 'Limited growth potential, consider changing career track';
            }
        }

        function downloadReport() {
            const reportContent = document.getElementById('reportContent').innerHTML;
            const fullReport = `
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <title>${currentLang === 'zh' ? '工作价值评估报告' : 'Job Worth Assessment Report'}</title>
                    <style>
                        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
                        h3 { color: #2c3e50; }
                        .score { font-size: 2rem; font-weight: bold; color: #3498db; }
                    </style>
                </head>
                <body>
                    <h1>${currentLang === 'zh' ? '工作价值评估报告' : 'Job Worth Assessment Report'}</h1>
                    <p>${currentLang === 'zh' ? '生成时间:' : 'Generated:'} ${new Date().toLocaleString()}</p>
                    ${reportContent}
                    <hr>
                    <p style="text-align: center; color: #7f8c8d;">
                        ${currentLang === 'zh' ? '报告由工作价值计算器生成' : 'Report generated by Job Worth Calculator'}
                    </p>
                </body>
                </html>
            `;
            
            const blob = new Blob([fullReport], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `job-worth-report-${new Date().toISOString().split('T')[0]}.html`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function copyReport() {
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(() => {
                alert(currentLang === 'zh' ? '链接已复制到剪贴板' : 'Link copied to clipboard');
            }).catch(() => {
                alert(currentLang === 'zh' ? '复制失败，请手动复制链接' : 'Copy failed, please copy link manually');
            });
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            updateLanguage();
        });
    </script>
</body>
</html>
