<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多功能倒计时目标追踪器</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #4a6bdf;
            --warning-color: #ff6b6b;
            --success-color: #51cf66;
            --bg-color: #f8f9fa;
            --card-color: #ffffff;
            --text-color: #343a40;
            --border-color: #e9ecef;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 30px;
        }
        
        .goal-card {
            background-color: var(--card-color);
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }
        
        .goal-card:hover {
            transform: translateY(-5px);
        }
        
        .goal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .goal-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
        }
        
        .delete-goal {
            background-color: var(--warning-color);
            color: white;
            border: none;
            border-radius: 5px;
            padding: 5px 10px;
            cursor: pointer;
        }
        
        .setup-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        @media (max-width: 768px) {
            .setup-area {
                grid-template-columns: 1fr;
            }
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-size: 1rem;
        }
        
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 15px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #3a56c4;
        }
        
        .countdown-panel {
            background-color: #f1f3f9;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .countdown-timer {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 10px 0;
        }
        
        .progress-container {
            margin: 20px 0;
        }
        
        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        
        .progress-bar {
            height: 20px;
            background-color: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .progress-time {
            height: 100%;
            background-color: #adb5bd;
            width: 0%;
            float: left;
        }
        
        .progress-task {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            float: left;
        }
        
        .progress-warning {
            background-color: var(--warning-color);
        }
        
        .progress-success {
            background-color: var(--success-color);
        }
        
        .progress-info {
            text-align: center;
            font-size: 0.9rem;
            color: #6c757d;
            margin-top: 5px;
        }
        
        .progress-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        @media (max-width: 768px) {
            .progress-section {
                grid-template-columns: 1fr;
            }
        }
        
        .today-progress, .stats {
            background-color: var(--card-color);
            border-radius: 10px;
            padding: 15px;
        }
        
        .today-input {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .today-input input {
            flex: 1;
        }
        
        .completion-rate {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
        }
        
        .chart-container {
            margin-top: 30px;
            height: 300px;
        }
        
        .milestone {
            background-color: #fff3bf;
            border-left: 4px solid #ffd43b;
            padding: 10px;
            margin: 10px 0;
            border-radius: 0 5px 5px 0;
        }
        
        .add-goal {
            text-align: center;
            margin: 30px 0;
        }
        
        .footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            border-top: 1px solid var(--border-color);
            color: #6c757d;
            font-size: 0.9rem;
        }
        
        .footer a {
            color: var(--primary-color);
            text-decoration: none;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background-color: var(--card-color);
            padding: 20px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: #f00;
            border-radius: 50%;
            animation: fall 5s linear forwards;
            z-index: 1001;
        }
        
        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
        
        .tabs {
            display: flex;
            margin-bottom: 20px;
        }
        
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
        }
        
        .tab.active {
            border-bottom: 3px solid var(--primary-color);
            font-weight: bold;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .goal-type-examples {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        
        .goal-type-example {
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .goal-type-example:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        
        .goal-type-example.selected {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>多功能倒计时目标追踪器</h1>
        
        <div id="goals-container"></div>
        
        <div class="add-goal">
            <button id="add-goal-btn">+ 添加新目标</button>
        </div>
        
        <div class="modal" id="goal-modal">
            <div class="modal-content">
                <h2>设置新目标</h2>
                <div class="form-group">
                    <label for="goal-name">目标名称</label>
                    <input type="text" id="goal-name" placeholder="例如：完成论文写作">
                </div>
                
                <div class="form-group">
                    <label for="goal-type">目标类型</label>
                    <select id="goal-type">
                        <option value="custom">自定义类型</option>
                        <option value="money">赚钱目标</option>
                        <option value="fitness">健身目标</option>
                        <option value="study">学习目标</option>
                        <option value="work">工作目标</option>
                    </select>
                    
                    <div class="goal-type-examples">
                        <div class="goal-type-example" data-type="money" data-unit="元">赚钱</div>
                        <div class="goal-type-example" data-type="fitness" data-unit="分钟">运动时间</div>
                        <div class="goal-type-example" data-type="fitness" data-unit="公里">跑步距离</div>
                        <div class="goal-type-example" data-type="study" data-unit="页">阅读页数</div>
                        <div class="goal-type-example" data-type="study" data-unit="小时">学习时间</div>
                        <div class="goal-type-example" data-type="work" data-unit="个">完成任务数</div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="total-amount">总任务量</label>
                    <input type="number" id="total-amount" placeholder="例如：10000">
                </div>
                
                <div class="form-group">
                    <label for="unit">单位</label>
                    <input type="text" id="unit" placeholder="例如：元、分钟、公里、页">
                </div>
                
                <div class="form-group">
                    <label>时间设置</label>
                    <div>
                        <input type="radio" id="time-mode-deadline" name="time-mode" value="deadline" checked>
                        <label for="time-mode-deadline" style="display: inline;">固定截止日期</label>
                    </div>
                    <div>
                        <input type="radio" id="time-mode-days" name="time-mode" value="days">
                        <label for="time-mode-days" style="display: inline;">倒计时天数</label>
                    </div>
                </div>
                
                <div class="form-group" id="deadline-group">
                    <label for="deadline">截止日期</label>
                    <input type="date" id="deadline">
                </div>
                
                <div class="form-group" id="days-group" style="display: none;">
                    <label for="total-days">总天数</label>
                    <input type="number" id="total-days" placeholder="例如：30">
                </div>
                
                <div class="form-group">
                    <button id="save-goal">保存目标</button>
                    <button id="cancel-goal" style="background-color: #6c757d; margin-left: 10px;">取消</button>
                </div>
            </div>
        </div>
        
        <div class="modal" id="celebration-modal">
            <div class="modal-content" style="text-align: center;">
                <h2 style="color: var(--success-color);">🎉 目标达成! 🎉</h2>
                <p id="celebration-message"></p>
                <button id="close-celebration" style="margin-top: 20px;">关闭</button>
            </div>
        </div>
        
        <div class="footer">
            <p>如果对AI编程感兴趣，请联系微信：xiao1601，公众号：老苏成长笔记</p>
            <p><a href="https://wx.zsxq.com/group/51112188845244" target="_blank">技术支持和问题反馈</a></p>
        </div>
    </div>

    <script>
        // 全局变量
        let goals = JSON.parse(localStorage.getItem('goals')) || [];
        
        // DOM元素
        const goalsContainer = document.getElementById('goals-container');
        const addGoalBtn = document.getElementById('add-goal-btn');
        const goalModal = document.getElementById('goal-modal');
        const saveGoalBtn = document.getElementById('save-goal');
        const cancelGoalBtn = document.getElementById('cancel-goal');
        const celebrationModal = document.getElementById('celebration-modal');
        const closeCelebrationBtn = document.getElementById('close-celebration');
        const timeModeDeadline = document.getElementById('time-mode-deadline');
        const timeModeDays = document.getElementById('time-mode-days');
        const deadlineGroup = document.getElementById('deadline-group');
        const daysGroup = document.getElementById('days-group');
        const goalTypeSelect = document.getElementById('goal-type');
        const unitInput = document.getElementById('unit');
        const exampleButtons = document.querySelectorAll('.goal-type-example');
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            renderGoals();
            
            // 设置默认截止日期为明天
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            document.getElementById('deadline').valueAsDate = tomorrow;
        });
        
        // 事件监听
        addGoalBtn.addEventListener('click', () => {
            goalModal.style.display = 'flex';
        });
        
        cancelGoalBtn.addEventListener('click', () => {
            goalModal.style.display = 'none';
        });
        
        closeCelebrationBtn.addEventListener('click', () => {
            celebrationModal.style.display = 'none';
        });
        
        timeModeDeadline.addEventListener('change', () => {
            deadlineGroup.style.display = 'block';
            daysGroup.style.display = 'none';
        });
        
        timeModeDays.addEventListener('change', () => {
            deadlineGroup.style.display = 'none';
            daysGroup.style.display = 'block';
        });
        
        saveGoalBtn.addEventListener('click', saveGoal);
        
        // 目标类型示例点击事件
        exampleButtons.forEach(button => {
            button.addEventListener('click', () => {
                // 移除所有选中状态
                exampleButtons.forEach(btn => btn.classList.remove('selected'));
                
                // 添加当前选中状态
                button.classList.add('selected');
                
                // 设置目标类型和单位
                const type = button.dataset.type;
                const unit = button.dataset.unit;
                
                goalTypeSelect.value = type;
                unitInput.value = unit;
                
                // 根据类型设置默认目标名称
                const nameInput = document.getElementById('goal-name');
                if (!nameInput.value) {
                    const defaultNames = {
                        'money': '赚钱目标',
                        'fitness': unit === '分钟' ? '每日运动' : '跑步目标',
                        'study': unit === '页' ? '阅读计划' : '学习计划',
                        'work': '工作任务'
                    };
                    
                    if (defaultNames[type]) {
                        nameInput.value = defaultNames[type];
                    }
                }
            });
        });
        
        // 渲染所有目标
        function renderGoals() {
            goalsContainer.innerHTML = '';
            
            if (goals.length === 0) {
                goalsContainer.innerHTML = '<p style="text-align: center; color: #6c757d;">暂无目标，点击上方按钮添加一个新目标</p>';
                return;
            }
            
            goals.forEach((goal, index) => {
                const goalCard = document.createElement('div');
                goalCard.className = 'goal-card';
                goalCard.dataset.id = goal.id;
                
                const now = new Date();
                const startDate = new Date(goal.startDate);
                let endDate;
                
                if (goal.timeMode === 'deadline') {
                    endDate = new Date(goal.deadline);
                } else {
                    endDate = new Date(startDate);
                    endDate.setDate(startDate.getDate() + parseInt(goal.totalDays));
                }
                
                const totalTime = endDate - startDate;
                const elapsedTime = now - startDate;
                const remainingTime = endDate - now;
                
                // 计算进度
                const timeProgress = Math.min(100, (elapsedTime / totalTime) * 100);
                const taskProgress = Math.min(100, (goal.completed / goal.totalAmount) * 100);
                
                // 计算每日要求
                const daysTotal = Math.ceil(totalTime / (1000 * 60 * 60 * 24));
                const dailyRequired = goal.totalAmount / daysTotal;
                const daysElapsed = Math.floor(elapsedTime / (1000 * 60 * 60 * 24));
                const dailyAverage = daysElapsed > 0 ? goal.completed / daysElapsed : 0;
                
                // 创建倒计时显示
                const days = Math.floor(remainingTime / (1000 * 60 * 60 * 24));
                const hours = Math.floor((remainingTime % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((remainingTime % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((remainingTime % (1000 * 60)) / 1000);
                
                // 检查是否完成
                const isCompleted = goal.completed >= goal.totalAmount;
                const isExpired = remainingTime <= 0 && !isCompleted;
                
                // 创建HTML
                goalCard.innerHTML = `
                    <div class="goal-header">
                        <div class="goal-title">${goal.name}</div>
                        <button class="delete-goal" data-id="${goal.id}">删除</button>
                    </div>
                    
                    <div class="setup-area">
                        <div>
                            <div class="form-group">
                                <label>目标类型</label>
                                <div>${getTypeName(goal.type)} (单位: ${goal.unit})</div>
                            </div>
                            <div class="form-group">
                                <label>总任务量</label>
                                <div>${goal.totalAmount} ${goal.unit}</div>
                            </div>
                        </div>
                        <div>
                            <div class="form-group">
                                <label>已完成</label>
                                <div>${goal.completed} ${goal.unit} (${((goal.completed / goal.totalAmount) * 100).toFixed(1)}%)</div>
                            </div>
                            <div class="form-group">
                                <label>${goal.timeMode === 'deadline' ? '截止日期' : '总天数'}</label>
                                <div>${goal.timeMode === 'deadline' ? formatDate(new Date(goal.deadline)) : goal.totalDays + '天'}</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="countdown-panel">
                        <div>剩余时间</div>
                        <div class="countdown-timer" id="countdown-${goal.id}">
                            ${days}天 ${hours}小时 ${minutes}分 ${seconds}秒
                        </div>
                        ${isCompleted ? '<div style="color: var(--success-color); font-weight: bold;">目标已完成!</div>' : 
                          isExpired ? '<div style="color: var(--warning-color); font-weight: bold;">时间已用完!</div>' : ''}
                    </div>
                    
                    <div class="progress-container">
                        <div class="progress-label">
                            <span>时间进度</span>
                            <span>${timeProgress.toFixed(1)}%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-time" style="width: ${timeProgress}%"></div>
                        </div>
                        
                        <div class="progress-label" style="margin-top: 15px;">
                            <span>任务进度</span>
                            <span>${taskProgress.toFixed(1)}%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-task ${taskProgress < timeProgress - 10 ? 'progress-warning' : ''} ${isCompleted ? 'progress-success' : ''}" 
                                 style="width: ${taskProgress}%"></div>
                        </div>
                        
                        <div class="progress-info">
                            ${getProgressMessage(timeProgress, taskProgress, isCompleted, isExpired)}
                        </div>
                    </div>
                    
                    <div class="progress-section">
                        <div class="today-progress">
                            <h3>今日进度</h3>
                            <div class="today-input">
                                <input type="number" id="today-input-${goal.id}" placeholder="今日完成量">
                                <button class="add-progress" data-id="${goal.id}">添加</button>
                            </div>
                            <div class="completion-rate">
                                每日要求: ${dailyRequired.toFixed(1)} ${goal.unit}/天<br>
                                当前平均: ${dailyAverage.toFixed(1)} ${goal.unit}/天
                            </div>
                        </div>
                        <div class="stats">
                            <h3>统计信息</h3>
                            <div>剩余任务: ${goal.totalAmount - goal.completed} ${goal.unit}</div>
                            <div>剩余天数: ${Math.max(0, days)}</div>
                            <div>每日需完成: ${days > 0 ? ((goal.totalAmount - goal.completed) / days).toFixed(1) : 'N/A'} ${goal.unit}/天</div>
                        </div>
                    </div>
                    
                    <div class="tabs">
                        <div class="tab active" data-tab="chart-${goal.id}" data-goal="${goal.id}">进度图表</div>
                        <div class="tab" data-tab="milestones-${goal.id}" data-goal="${goal.id}">里程碑</div>
                    </div>
                    
                    <div class="tab-content active" id="chart-${goal.id}">
                        <div class="chart-container">
                            <canvas id="chart-canvas-${goal.id}"></canvas>
                        </div>
                    </div>
                    
                    <div class="tab-content" id="milestones-${goal.id}">
                        ${renderMilestones(goal)}
                    </div>
                `;
                
                goalsContainer.appendChild(goalCard);
                
                // 初始化图表
                if (!isExpired) {
                    renderChart(goal, index);
                }
                
                // 检查里程碑
                checkMilestones(goal);
            });
            
            // 添加事件监听
            document.querySelectorAll('.delete-goal').forEach(btn => {
                btn.addEventListener('click', deleteGoal);
            });
            
            document.querySelectorAll('.add-progress').forEach(btn => {
                btn.addEventListener('click', addProgress);
            });
            
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', switchTab);
            });
            
            // 启动倒计时
            startCountdowns();
        }
        
        // 获取类型名称
        function getTypeName(type) {
            const typeNames = {
                'custom': '自定义',
                'money': '赚钱',
                'fitness': '健身',
                'study': '学习',
                'work': '工作'
            };
            return typeNames[type] || '自定义';
        }
        
        // 渲染图表
        function renderChart(goal, index) {
            const ctx = document.getElementById(`chart-canvas-${goal.id}`).getContext('2d');
            
            const startDate = new Date(goal.startDate);
            let endDate;
            
            if (goal.timeMode === 'deadline') {
                endDate = new Date(goal.deadline);
            } else {
                endDate = new Date(startDate);
                endDate.setDate(startDate.getDate() + parseInt(goal.totalDays));
            }
            
            const totalDays = Math.ceil((endDate - startDate) / (1000 * 60 * 60 * 24));
            const labels = Array.from({length: totalDays}, (_, i) => `第${i+1}天`);
            
            // 理想进度线
            const idealData = Array.from({length: totalDays}, (_, i) => (goal.totalAmount / totalDays) * (i + 1));
            
            // 实际进度线 - 这里简化处理，实际应用中应该记录每日进度
            // 我们假设每天均匀完成，实际应该根据记录的数据
            const actualData = Array.from({length: totalDays}, (_, i) => {
                const progress = (goal.completed / goal.totalAmount) * 100;
                const dayProgress = (i + 1) / totalDays * 100;
                return dayProgress <= progress ? (goal.totalAmount / totalDays) * (i + 1) : null;
            });
            
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '理想进度',
                            data: idealData,
                            borderColor: '#adb5bd',
                            backgroundColor: 'transparent',
                            borderDash: [5, 5],
                            borderWidth: 2
                        },
                        {
                            label: '实际进度',
                            data: actualData,
                            borderColor: '#4a6bdf',
                            backgroundColor: 'rgba(74, 107, 223, 0.1)',
                            borderWidth: 2,
                            tension: 0.1,
                            fill: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: `完成量 (${goal.unit})`
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: '天数'
                            }
                        }
                    }
                }
            });
        }
        
        // 渲染里程碑
        function renderMilestones(goal) {
            const milestones = [
                {percent: 25, message: `已完成25%，继续加油！`},
                {percent: 50, message: `已完成一半，坚持就是胜利！`},
                {percent: 75, message: `已完成75%，胜利在望！`},
                {percent: 100, message: `恭喜完成目标！`}
            ];
            
            let html = '';
            const currentPercent = (goal.completed / goal.totalAmount) * 100;
            
            milestones.forEach(milestone => {
                const isAchieved = currentPercent >= milestone.percent;
                
                html += `
                    <div class="milestone" style="${isAchieved ? 'background-color: #ebfbee; border-left-color: var(--success-color);' : ''}">
                        <div style="display: flex; justify-content: space-between;">
                            <strong>${milestone.percent}% 里程碑</strong>
                            ${isAchieved ? '<span style="color: var(--success-color);">✓ 已完成</span>' : 
                             `<span>还需 ${Math.ceil(goal.totalAmount * milestone.percent / 100 - goal.completed)} ${goal.unit}</span>`}
                        </div>
                        <div style="margin-top: 5px;">${milestone.message}</div>
                    </div>
                `;
            });
            
            return html;
        }
        
        // 检查里程碑
        function checkMilestones(goal) {
            const currentPercent = (goal.completed / goal.totalAmount) * 100;
            const milestones = [25, 50, 75, 100];
            const lastMilestone = goal.lastMilestone || 0;
            
            milestones.forEach(percent => {
                if (currentPercent >= percent && lastMilestone < percent) {
                    showMilestoneMessage(goal, percent);
                    goal.lastMilestone = percent;
                    saveGoalsToLocalStorage();
                }
            });
            
            // 检查目标完成
            if (currentPercent >= 100 && !goal.completedDate) {
                goal.completedDate = new Date().toISOString();
                saveGoalsToLocalStorage();
                celebrateGoal(goal);
            }
        }
        
        // 显示里程碑消息
        function showMilestoneMessage(goal, percent) {
            const messages = {
                25: `恭喜！您已经完成了${goal.name}的25%！`,
                50: `太棒了！您已经完成了一半的${goal.name}！`,
                75: `接近成功了！${goal.name}已经完成75%！`,
                100: `恭喜您！${goal.name}目标已完成！`
            };
            
            alert(messages[percent]);
        }
        
        // 庆祝目标完成
        function celebrateGoal(goal) {
            document.getElementById('celebration-message').textContent = `恭喜您完成了目标: ${goal.name} (${goal.totalAmount} ${goal.unit})!`;
            celebrationModal.style.display = 'flex';
            createConfetti();
        }
        
        // 创建彩色纸屑效果
        function createConfetti() {
            const colors = ['#f94144', '#f3722c', '#f8961e', '#f9c74f', '#90be6d', '#43aa8b', '#577590'];
            
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = `${Math.random() * 100}vw`;
                confetti.style.top = '-10px';
                confetti.style.width = `${Math.random() * 10 + 5}px`;
                confetti.style.height = `${Math.random() * 10 + 5}px`;
                confetti.style.animationDuration = `${Math.random() * 3 + 2}s`;
                document.body.appendChild(confetti);
                
                // 动画结束后移除
                setTimeout(() => {
                    confetti.remove();
                }, 5000);
            }
        }
        
        // 保存目标
        function saveGoal() {
            const name = document.getElementById('goal-name').value.trim();
            const type = document.getElementById('goal-type').value;
            const totalAmount = parseInt(document.getElementById('total-amount').value);
            const unit = document.getElementById('unit').value.trim();
            const timeMode = document.querySelector('input[name="time-mode"]:checked').value;
            
            if (!name || isNaN(totalAmount) || !unit) {
                alert('请填写完整的目标信息');
                return;
            }
            
            let deadline, totalDays;
            
            if (timeMode === 'deadline') {
                deadline = document.getElementById('deadline').value;
                if (!deadline) {
                    alert('请选择截止日期');
                    return;
                }
            } else {
                totalDays = parseInt(document.getElementById('total-days').value);
                if (isNaN(totalDays) || totalDays <= 0) {
                    alert('请输入有效的天数');
                    return;
                }
            }
            
            const newGoal = {
                id: Date.now().toString(),
                name,
                type,
                totalAmount,
                unit,
                timeMode,
                deadline: timeMode === 'deadline' ? deadline : null,
                totalDays: timeMode === 'days' ? totalDays : null,
                startDate: new Date().toISOString(),
                completed: 0,
                lastMilestone: 0,
                completedDate: null
            };
            
            goals.push(newGoal);
            saveGoalsToLocalStorage();
            renderGoals();
            
            // 重置表单
            document.getElementById('goal-name').value = '';
            document.getElementById('total-amount').value = '';
            document.getElementById('unit').value = '';
            document.getElementById('deadline').valueAsDate = new Date(new Date().getTime() + 86400000);
            document.getElementById('total-days').value = '';
            document.getElementById('time-mode-deadline').checked = true;
            deadlineGroup.style.display = 'block';
            daysGroup.style.display = 'none';
            
            // 重置示例按钮选中状态
            document.querySelectorAll('.goal-type-example').forEach(btn => {
                btn.classList.remove('selected');
            });
            
            goalModal.style.display = 'none';
        }
        
        // 删除目标
        function deleteGoal(e) {
            if (confirm('确定要删除这个目标吗？')) {
                const id = e.target.dataset.id;
                goals = goals.filter(goal => goal.id !== id);
                saveGoalsToLocalStorage();
                renderGoals();
            }
        }
        
        // 添加进度
        function addProgress(e) {
            const id = e.target.dataset.id;
            const input = document.getElementById(`today-input-${id}`);
            const amount = parseInt(input.value);
            
            if (isNaN(amount) || amount <= 0) {
                alert('请输入有效的完成量');
                return;
            }
            
            const goal = goals.find(g => g.id === id);
            goal.completed += amount;
            
            // 不能超过总量
            if (goal.completed > goal.totalAmount) {
                goal.completed = goal.totalAmount;
            }
            
            saveGoalsToLocalStorage();
            renderGoals();
            input.value = '';
        }
        
        // 切换标签页
        function switchTab(e) {
            const tabId = e.target.dataset.tab;
            const goalId = e.target.dataset.goal;
            
            // 更新标签状态
            document.querySelectorAll(`.tab[data-goal="${goalId}"]`).forEach(tab => {
                tab.classList.remove('active');
            });
            e.target.classList.add('active');
            
            // 更新内容显示
            document.querySelectorAll(`.tab-content[data-goal="${goalId}"]`).forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(tabId).classList.add('active');
        }
        
        // 启动倒计时
        function startCountdowns() {
            goals.forEach(goal => {
                const countdownElement = document.getElementById(`countdown-${goal.id}`);
                if (!countdownElement) return;
                
                let endDate;
                
                if (goal.timeMode === 'deadline') {
                    endDate = new Date(goal.deadline);
                } else {
                    const startDate = new Date(goal.startDate);
                    endDate = new Date(startDate);
                    endDate.setDate(startDate.getDate() + parseInt(goal.totalDays));
                }
                
                updateCountdown(countdownElement, endDate);
                
                // 每秒更新一次
                const timer = setInterval(() => {
                    updateCountdown(countdownElement, endDate);
                }, 1000);
            });
        }
        
        // 更新倒计时显示
        function updateCountdown(element, endDate) {
            const now = new Date();
            const remainingTime = endDate - now;
            
            if (remainingTime <= 0) {
                element.innerHTML = '时间到!';
                return;
            }
            
            const days = Math.floor(remainingTime / (1000 * 60 * 60 * 24));
            const hours = Math.floor((remainingTime % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((remainingTime % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((remainingTime % (1000 * 60)) / 1000);
            
            element.innerHTML = `${days}天 ${hours}小时 ${minutes}分 ${seconds}秒`;
        }
        
        // 获取进度消息
        function getProgressMessage(timeProgress, taskProgress, isCompleted, isExpired) {
            if (isCompleted) {
                return '恭喜！您已经完成了目标！';
            }
            
            if (isExpired) {
                return '时间已用完，但目标尚未完成！';
            }
            
            const diff = taskProgress - timeProgress;
            
            if (diff > 10) {
                return '您的进度超前！继续保持！';
            } else if (diff >= -10) {
                return '您的进度正常，继续保持当前节奏！';
            } else {
                return '您的进度落后了，需要加快速度！';
            }
        }
        
        // 格式化日期
        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }
        
        // 保存到本地存储
        function saveGoalsToLocalStorage() {
            localStorage.setItem('goals', JSON.stringify(goals));
        }
    </script>
</body>
</html>
