<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国传统节日万年历</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Serif SC', serif;
        }
        
        body {
            background: linear-gradient(135deg, #f9f3e9 0%, #e8d5b5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #5a3921;
        }
        
        .container {
            display: flex;
            max-width: 1400px;
            width: 100%;
            background: #fffaf0;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(90, 57, 33, 0.2);
            overflow: hidden;
            position: relative;
            flex-direction: column;
            border: 2px solid #d4b78c;
        }
        
        .app-header {
            background: linear-gradient(135deg, #c53f3f 0%, #8b1a1a 100%);
            color: #fff3e6;
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #d4b78c;
        }
        
        .app-title {
            font-size: 36px;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            font-family: 'Ma Shan Zheng', cursive;
            letter-spacing: 2px;
        }
        
        .app-controls {
            display: flex;
            gap: 15px;
        }
        
        .date-display {
            background: rgba(255, 243, 230, 0.3);
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 500;
            border: 1px solid #e8c9a1;
        }
        
        .app-content {
            display: flex;
            flex-wrap: wrap;
            min-height: 700px;
        }
        
        /* 日历样式 */
        .calendar-container {
            flex: 3;
            min-width: 300px;
            padding: 30px;
            background: #fffaf0;
            border-right: 2px solid #e8d5b5;
        }
        
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e8d5b5;
        }
        
        .calendar-title {
            font-size: 28px;
            color: #8b1a1a;
            font-weight: 700;
            font-family: 'Ma Shan Zheng', cursive;
            letter-spacing: 1px;
        }
        
        .calendar-nav {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .calendar-nav button {
            background: #c53f3f;
            color: #fff3e6;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }
        
        .calendar-nav button:hover {
            background: #a82d2d;
            transform: scale(1.1);
        }
        
        .calendar-nav span {
            font-size: 22px;
            font-weight: 600;
            margin: 0 15px;
            color: #5a3921;
            min-width: 160px;
            text-align: center;
            font-family: 'Ma Shan Zheng', cursive;
        }
        
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            color: #8b1a1a;
            margin-bottom: 15px;
            padding: 12px 0;
            background: #f9f3e9;
            border-radius: 12px;
            font-size: 18px;
            border: 1px solid #e8d5b5;
        }
        
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }
        
        .day {
            height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            padding: 12px 5px 5px;
            border: 1px solid #e8d5b5;
            overflow: hidden;
            background: #fffdf8;
        }
        
        .day:hover {
            background: #f9f3e9;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(139, 26, 26, 0.1);
        }
        
        .day-number {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 3px;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            z-index: 2;
            color: #5a3921;
        }
        
        .lunar-date {
            font-size: 13px;
            color: #8b735b;
            margin-bottom: 5px;
            z-index: 2;
            font-weight: 500;
        }
        
        .event-markers {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 3px;
            width: 100%;
            z-index: 2;
        }
        
        .solar-term {
            font-size: 12px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 10px;
            background: rgba(86, 235, 173, 0.25);
            color: #10b981;
            text-align: center;
        }
        
        .festival {
            font-size: 12px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 10px;
            background: rgba(197, 63, 63, 0.25);
            color: #8b1a1a;
            text-align: center;
        }
        
        .day-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(197, 63, 63, 0.1) 0%, rgba(139, 26, 26, 0.1) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1;
        }
        
        .day.other-month {
            color: #b8a48f;
            background: #f9f3e9;
        }
        
        .day.today .day-number {
            background: #c53f3f;
            color: #fff3e6;
        }
        
        .day.selected {
            background: #8b1a1a;
            color: #fff3e6;
            border: 1px solid #5a0f0f;
        }
        
        .day.selected .day-number {
            color: #fff3e6;
        }
        
        .day.selected .lunar-date {
            color: rgba(255, 243, 230, 0.9);
        }
        
        .day.selected .solar-term {
            background: rgba(255, 255, 255, 0.3);
            color: #fff3e6;
        }
        
        .day.selected .festival {
            background: rgba(255, 255, 255, 0.3);
            color: #fff3e6;
        }
        
        .day.selected .day-bg {
            opacity: 1;
        }
        
        /* 右侧信息面板样式 */
        .info-panel {
            flex: 2;
            min-width: 300px;
            padding: 30px;
            background: #fffdf8;
            display: flex;
            flex-direction: column;
            border-left: 2px solid #e8d5b5;
        }
        
        .panel-section {
            background: white;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(139, 26, 26, 0.05);
            border: 1px solid #e8d5b5;
        }
        
        .panel-title {
            font-size: 24px;
            color: #8b1a1a;
            margin-bottom: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Ma Shan Zheng', cursive;
            letter-spacing: 1px;
        }
        
        .panel-title i {
            background: #f9f3e9;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c53f3f;
            border: 1px solid #e8d5b5;
        }
        
        .selected-date-display {
            font-size: 22px;
            font-weight: 600;
            text-align: center;
            padding: 15px;
            background: #f9f3e9;
            border-radius: 12px;
            margin-bottom: 20px;
            color: #5a3921;
            border: 1px solid #e8d5b5;
        }
        
        .countdown-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .target-date-input {
            flex: 1;
            padding: 14px;
            border: 2px solid #e8d5b5;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            background: #fffdf8;
        }
        
        .calculate-btn {
            background: #c53f3f;
            color: #fff3e6;
            border: none;
            padding: 14px 25px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            font-family: 'Ma Shan Zheng', cursive;
            letter-spacing: 1px;
        }
        
        .calculate-btn:hover {
            background: #a82d2d;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(139, 26, 26, 0.15);
        }
        
        .countdown-result {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #c53f3f 0%, #8b1a1a 100%);
            border-radius: 16px;
            color: #fff3e6;
            border: 1px solid #d4b78c;
        }
        
        .countdown-value {
            font-size: 56px;
            font-weight: 800;
            margin: 10px 0;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            font-family: 'Ma Shan Zheng', cursive;
        }
        
        .countdown-unit {
            font-size: 20px;
            font-weight: 500;
            opacity: 0.9;
        }
        
        .solar-terms-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        
        .solar-term-item {
            background: #f9f3e9;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            border: 1px solid #e8d5b5;
            cursor: pointer;
        }
        
        .solar-term-item:hover {
            background: #f0e5d0;
            transform: translateY(-3px);
            border-color: #d4b78c;
        }
        
        .solar-term-item.active {
            background: #8b1a1a;
            color: #fff3e6;
            border-color: #5a0f0f;
        }
        
        .festivals-list {
            max-height: 300px;
            overflow-y: auto;
            padding-right: 10px;
        }
        
        .festival-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 15px;
            border-bottom: 1px solid #e8d5b5;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        
        .festival-item:hover {
            background: #f9f3e9;
            border-radius: 8px;
        }
        
        .festival-date {
            font-weight: 600;
            color: #8b1a1a;
            min-width: 100px;
        }
        
        .festival-name {
            font-weight: 500;
            color: #5a3921;
            flex: 1;
            text-align: center;
        }
        
        .festival-type {
            font-size: 12px;
            background: #e8d5b5;
            padding: 2px 8px;
            border-radius: 10px;
            color: #5a3921;
        }
        
        /* 响应式设计 */
        @media (max-width: 1100px) {
            .app-content {
                flex-direction: column;
            }
            
            .calendar-container {
                border-right: none;
                border-bottom: 2px solid #e8d5b5;
            }
            
            .info-panel {
                border-left: none;
            }
            
            .solar-terms-grid {
                grid-template-columns: repeat(6, 1fr);
            }
        }
        
        @media (max-width: 768px) {
            .app-header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .calendar-nav {
                justify-content: center;
            }
            
            .countdown-controls {
                flex-direction: column;
            }
            
            .solar-terms-grid {
                grid-template-columns: repeat(4, 1fr);
            }
            
            .day {
                height: 85px;
                padding: 8px 3px 3px;
            }
        }
        
        @media (max-width: 480px) {
            .solar-terms-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .calendar-nav span {
                min-width: 120px;
                font-size: 18px;
            }
            
            .weekdays {
                font-size: 16px;
            }
            
            .day {
                height: 75px;
            }
            
            .app-title {
                font-size: 28px;
            }
        }
        
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #8b1a1a;
            color: #fff3e6;
            padding: 15px 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(139, 26, 26, 0.3);
            z-index: 1000;
            font-weight: 600;
            display: none;
            animation: fadeIn 0.3s, fadeOut 0.3s 2.7s;
            border: 1px solid #d4b78c;
            font-family: 'Ma Shan Zheng', cursive;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; top: 10px; }
            to { opacity: 1; top: 20px; }
        }
        
        @keyframes fadeOut {
            from { opacity: 1; top: 20px; }
            to { opacity: 0; top: 10px; }
        }
        
        /* 传统节日装饰元素 */
        .decoration {
            position: absolute;
            z-index: 0;
        }
        
        .lantern {
            position: absolute;
            top: -30px;
            left: 10%;
            width: 40px;
            height: 60px;
            background: #c53f3f;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(197, 63, 63, 0.5);
        }
        
        .lantern:before {
            content: "";
            position: absolute;
            top: -10px;
            left: 15px;
            width: 10px;
            height: 15px;
            background: #e8c9a1;
            border-radius: 5px 5px 0 0;
        }
        
        .lantern:after {
            content: "";
            position: absolute;
            bottom: -15px;
            left: 18px;
            width: 4px;
            height: 20px;
            background: #e8c9a1;
        }
        
        .lantern.right {
            left: auto;
            right: 10%;
        }
        
        .pattern {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 80px;
            height: 80px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50,10 C70,10 90,25 90,50 C90,75 70,90 50,90 C30,90 10,75 10,50 C10,25 30,10 50,10 Z" fill="none" stroke="%23d4b78c" stroke-width="2"/></svg>');
            opacity: 0.3;
        }
        
        /* 节日详情弹窗 */
        .festival-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(90, 57, 33, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        
        .festival-modal.active {
            opacity: 1;
            pointer-events: all;
        }
        
        .modal-content {
            background: #fffaf0;
            border-radius: 20px;
            width: 90%;
            max-width: 600px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(90, 57, 33, 0.5);
            border: 3px solid #d4b78c;
            position: relative;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }
        
        .festival-modal.active .modal-content {
            transform: translateY(0);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e8d5b5;
        }
        
        .modal-title {
            font-size: 28px;
            color: #8b1a1a;
            font-weight: 700;
            font-family: 'Ma Shan Zheng', cursive;
        }
        
        .close-modal {
            background: #c53f3f;
            color: #fff3e6;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }
        
        .festival-info {
            display: flex;
            margin-bottom: 20px;
        }
        
        .festival-date-info {
            background: #f9f3e9;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            min-width: 150px;
            margin-right: 20px;
            border: 1px solid #e8d5b5;
        }
        
        .festival-date-display {
            font-size: 24px;
            font-weight: 700;
            color: #8b1a1a;
            margin-bottom: 5px;
        }
        
        .festival-year {
            color: #5a3921;
        }
        
        .festival-description {
            flex: 1;
            color: #5a3921;
            line-height: 1.6;
        }
        
        .festival-traditions {
            background: #f9f3e9;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            border: 1px solid #e8d5b5;
        }
        
        .traditions-title {
            font-size: 20px;
            color: #8b1a1a;
            margin-bottom: 10px;
            font-family: 'Ma Shan Zheng', cursive;
        }
        
        .tradition-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .tradition-item i {
            color: #c53f3f;
            margin-right: 10px;
            min-width: 24px;
        }
    </style>
</head>
<body>
    <div class="notification" id="notification"></div>
    
    <!-- 节日装饰元素 -->
    <div class="decoration lantern"></div>
    <div class="decoration lantern right"></div>
    <div class="decoration pattern"></div>
    
    <!-- 节日详情弹窗 -->
    <div class="festival-modal" id="festival-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title">春节</h2>
                <button class="close-modal" id="close-modal"><i class="fas fa-times"></i></button>
            </div>
            <div class="festival-info">
                <div class="festival-date-info">
                    <div class="festival-date-display" id="modal-date">2月10日</div>
                    <div class="festival-year" id="modal-year">2024年</div>
                    <div class="festival-type" id="modal-type">农历节日</div>
                </div>
                <div class="festival-description" id="modal-description">
                    春节是中国最重要的传统节日，象征着新的开始和团圆。人们会贴春联、放鞭炮、吃年夜饭、发红包，共度佳节。
                </div>
            </div>
            <div class="festival-traditions">
                <h3 class="traditions-title">传统习俗</h3>
                <div class="tradition-item">
                    <i class="fas fa-dragon"></i>
                    <div>舞龙舞狮表演</div>
                </div>
                <div class="tradition-item">
                    <i class="fas fa-redo"></i>
                    <div>贴春联和福字</div>
                </div>
                <div class="tradition-item">
                    <i class="fas fa-gift"></i>
                    <div>长辈给晚辈发红包</div>
                </div>
                <div class="tradition-item">
                    <i class="fas fa-utensils"></i>
                    <div>全家团聚吃年夜饭</div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="container">
        <div class="app-header">
            <div class="app-title">
                <i class="fas fa-dragon"></i> 中国传统节日万年历
            </div>
            <div class="app-controls">
                <div class="date-display">
                    <i class="fas fa-calendar-day"></i> <span id="current-date">2024年1月1日 星期一</span>
                </div>
            </div>
        </div>
        
        <div class="app-content">
            <!-- 日历部分 -->
            <div class="calendar-container">
                <div class="calendar-header">
                    <div class="calendar-title">万年历</div>
                    <div class="calendar-nav">
                        <button id="prev-year" title="上一年"><i class="fas fa-angle-double-left"></i></button>
                        <button id="prev-month" title="上个月"><i class="fas fa-angle-left"></i></button>
                        <span id="current-month-year">2024年1月</span>
                        <button id="next-month" title="下个月"><i class="fas fa-angle-right"></i></button>
                        <button id="next-year" title="下一年"><i class="fas fa-angle-double-right"></i></button>
                    </div>
                </div>
                
                <div class="weekdays">
                    <div>日</div>
                    <div>一</div>
                    <div>二</div>
                    <div>三</div>
                    <div>四</div>
                    <div>五</div>
                    <div>六</div>
                </div>
                
                <div class="days-grid" id="calendar-days">
                    <!-- 日历日期将由JavaScript动态生成 -->
                </div>
            </div>
            
            <!-- 右侧信息面板 -->
            <div class="info-panel">
                <div class="panel-section">
                    <h2 class="panel-title"><i class="fas fa-calendar-star"></i> 当前日期</h2>
                    <div class="selected-date-display" id="selected-date-display">
                        未选择日期
                    </div>
                </div>
                
                <div class="panel-section">
                    <h2 class="panel-title"><i class="fas fa-hourglass-half"></i> 倒计时计算</h2>
                    <div class="countdown-controls">
                        <input type="date" id="target-date-input" class="target-date-input">
                        <button class="calculate-btn" id="calculate-btn">计算倒计时</button>
                    </div>
                    <div class="countdown-result">
                        <div class="countdown-unit">距离目标日期还有</div>
                        <div class="countdown-value" id="countdown-value">0</div>
                        <div class="countdown-unit" id="countdown-unit">天</div>
                    </div>
                </div>
                
                <div class="panel-section">
                    <h2 class="panel-title"><i class="fas fa-leaf"></i> 二十四节气</h2>
                    <div class="solar-terms-grid" id="solar-terms-grid">
                        <!-- 节气将由JavaScript动态生成 -->
                    </div>
                </div>
                
                <div class="panel-section">
                    <h2 class="panel-title"><i class="fas fa-dragon"></i> 传统节日</h2>
                    <div class="festivals-list" id="festivals-list">
                        <!-- 节日列表将由JavaScript动态生成 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 当前日期
            let currentDate = new Date();
            let selectedDate = new Date();
            
            // 获取DOM元素
            const calendarDays = document.getElementById('calendar-days');
            const currentMonthYear = document.getElementById('current-month-year');
            const selectedDateDisplay = document.getElementById('selected-date-display');
            const targetDateInput = document.getElementById('target-date-input');
            const calculateBtn = document.getElementById('calculate-btn');
            const countdownValue = document.getElementById('countdown-value');
            const countdownUnit = document.getElementById('countdown-unit');
            const solarTermsGrid = document.getElementById('solar-terms-grid');
            const festivalsList = document.getElementById('festivals-list');
            const notification = document.getElementById('notification');
            const currentDateDisplay = document.getElementById('current-date');
            const festivalModal = document.getElementById('festival-modal');
            const closeModal = document.getElementById('close-modal');
            const modalTitle = document.getElementById('modal-title');
            const modalDate = document.getElementById('modal-date');
            const modalYear = document.getElementById('modal-year');
            const modalType = document.getElementById('modal-type');
            const modalDescription = document.getElementById('modal-description');
            
            // 二十四节气数据（2024年）
            const solarTerms = [
                { name: '立春', date: '2024-02-04', description: '春季的开始' },
                { name: '雨水', date: '2024-02-19', description: '降雨开始增多' },
                { name: '惊蛰', date: '2024-03-05', description: '春雷惊醒冬眠动物' },
                { name: '春分', date: '2024-03-20', description: '昼夜平分' },
                { name: '清明', date: '2024-04-04', description: '天气晴朗，草木繁茂' },
                { name: '谷雨', date: '2024-04-19', description: '雨生百谷' },
                { name: '立夏', date: '2024-05-05', description: '夏季的开始' },
                { name: '小满', date: '2024-05-20', description: '麦类等夏熟作物籽粒饱满' },
                { name: '芒种', date: '2024-06-05', description: '麦类等有芒作物成熟' },
                { name: '夏至', date: '2024-06-21', description: '一年中白天最长的一天' },
                { name: '小暑', date: '2024-07-06', description: '天气开始炎热' },
                { name: '大暑', date: '2024-07-22', description: '一年中最热的时候' },
                { name: '立秋', date: '2024-08-07', description: '秋季的开始' },
                { name: '处暑', date: '2024-08-22', description: '炎热天气结束' },
                { name: '白露', date: '2024-09-07', description: '天气转凉，露凝而白' },
                { name: '秋分', date: '2024-09-22', description: '昼夜平分' },
                { name: '寒露', date: '2024-10-08', description: '露水以寒，将要结冰' },
                { name: '霜降', date: '2024-10-23', description: '天气渐冷，开始有霜' },
                { name: '立冬', date: '2024-11-07', description: '冬季的开始' },
                { name: '小雪', date: '2024-11-22', description: '开始下雪' },
                { name: '大雪', date: '2024-12-07', description: '降雪量增多' },
                { name: '冬至', date: '2024-12-21', description: '一年中白天最短的一天' },
                { name: '小寒', date: '2025-01-05', description: '天气寒冷但还未到极点' },
                { name: '大寒', date: '2025-01-20', description: '一年中最冷的时候' }
            ];
            
            // 中国传统节日数据（包含详细描述）
            const festivals = [
                { 
                    name: '春节', 
                    date: '2024-02-10', 
                    type: '农历节日',
                    description: '春节是中国最重要的传统节日，象征着新的开始和团圆。人们会贴春联、放鞭炮、吃年夜饭、发红包，共度佳节。',
                    traditions: ['贴春联和福字', '放鞭炮驱邪', '全家团聚吃年夜饭', '长辈给晚辈发红包', '舞龙舞狮表演']
                },
                { 
                    name: '元宵节', 
                    date: '2024-02-24', 
                    type: '农历节日',
                    description: '元宵节是春节后的第一个重要节日，也是中国的情人节。人们会吃元宵、赏花灯、猜灯谜。',
                    traditions: ['吃元宵或汤圆', '赏花灯', '猜灯谜', '舞龙舞狮', '放天灯']
                },
                { 
                    name: '清明节', 
                    date: '2024-04-04', 
                    type: '节气节日',
                    description: '清明节是祭祖扫墓的重要日子，也是踏青的好时节。人们会祭拜祖先、扫墓、踏青、放风筝。',
                    traditions: ['扫墓祭祖', '踏青郊游', '放风筝', '插柳戴柳', '吃青团']
                },
                { 
                    name: '端午节', 
                    date: '2024-06-10', 
                    type: '农历节日',
                    description: '端午节是纪念屈原的传统节日，人们会吃粽子、赛龙舟、挂艾草，以驱邪避灾。',
                    traditions: ['吃粽子', '赛龙舟', '挂艾草和菖蒲', '佩戴香囊', '饮雄黄酒']
                },
                { 
                    name: '七夕节', 
                    date: '2024-08-10', 
                    type: '农历节日',
                    description: '七夕是中国的情人节，源自牛郎织女的传说。年轻女性会乞巧、许愿，祈求美好姻缘。',
                    traditions: ['乞巧', '拜织女', '染指甲', '吃巧果', '许愿']
                },
                { 
                    name: '中秋节', 
                    date: '2024-09-17', 
                    type: '农历节日',
                    description: '中秋节是家人团聚的节日，人们会赏月、吃月饼，象征团圆和美满。',
                    traditions: ['赏月', '吃月饼', '玩花灯', '祭月', '饮桂花酒']
                },
                { 
                    name: '重阳节', 
                    date: '2024-10-11', 
                    type: '农历节日',
                    description: '重阳节是敬老爱老的节日，人们会登高、赏菊、佩戴茱萸，祈求健康长寿。',
                    traditions: ['登高', '赏菊', '插茱萸', '吃重阳糕', '敬老活动']
                },
                { 
                    name: '冬至', 
                    date: '2024-12-21', 
                    type: '节气节日',
                    description: '冬至是一年中白天最短的日子，北方有吃饺子、南方有吃汤圆的习俗，象征团圆。',
                    traditions: ['北方吃饺子', '南方吃汤圆', '祭祖', '数九', '进补']
                },
                { 
                    name: '腊八节', 
                    date: '2025-01-07', 
                    type: '农历节日',
                    description: '腊八节是春节的前奏，人们会喝腊八粥，祭祀祖先和神灵，祈求丰收和平安。',
                    traditions: ['喝腊八粥', '泡腊八蒜', '祭祀祖先', '制作腊八豆腐', '施粥行善']
                },
                { 
                    name: '小年', 
                    date: '2025-01-28', 
                    type: '农历节日',
                    description: '小年是春节的序曲，人们会祭灶神、扫尘、准备年货，迎接新年的到来。',
                    traditions: ['祭灶神', '扫尘', '贴窗花', '吃灶糖', '准备年货']
                }
            ];
            
            // 月份和年份导航按钮
            document.getElementById('prev-year').addEventListener('click', () => changeYear(-1));
            document.getElementById('prev-month').addEventListener('click', () => changeMonth(-1));
            document.getElementById('next-month').addEventListener('click', () => changeMonth(1));
            document.getElementById('next-year').addEventListener('click', () => changeYear(1));
            
            // 关闭模态框
            closeModal.addEventListener('click', () => {
                festivalModal.classList.remove('active');
            });
            
            // 初始化
            updateCurrentDate();
            renderCalendar(currentDate);
            renderSolarTerms();
            renderFestivals();
            updateSelectedDateDisplay();
            
            // 设置默认目标日期为下个月的同一天
            const nextMonthDate = new Date();
            nextMonthDate.setMonth(nextMonthDate.getMonth() + 1);
            const formattedDate = nextMonthDate.toISOString().split('T')[0];
            targetDateInput.value = formattedDate;
            
            // 更新当前日期显示
            function updateCurrentDate() {
                const now = new Date();
                const dayNames = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                currentDateDisplay.textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${dayNames[now.getDay()]}`;
            }
            
            // 渲染日历
            function renderCalendar(date) {
                // 更新标题
                const monthNames = ["一月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "十一月", "十二月"];
                currentMonthYear.textContent = `${date.getFullYear()}年${monthNames[date.getMonth()]}`;
                
                // 清空日历
                calendarDays.innerHTML = '';
                
                // 获取当前月的第一天和最后一天
                const firstDay = new Date(date.getFullYear(), date.getMonth(), 1);
                const lastDay = new Date(date.getFullYear(), date.getMonth() + 1, 0);
                
                // 获取上个月的最后几天
                const prevLastDay = new Date(date.getFullYear(), date.getMonth(), 0).getDate();
                
                // 获取第一天是星期几 (0 = 星期日, 6 = 星期六)
                const firstDayIndex = firstDay.getDay();
                
                // 获取最后一天是星期几
                const lastDayIndex = lastDay.getDay();
                
                // 下个月的前几天
                const nextDays = 7 - lastDayIndex - 1;
                
                // 生成日期格子
                let days = '';
                
                // 上个月的日期
                for (let i = firstDayIndex; i > 0; i--) {
                    const dayNum = prevLastDay - i + 1;
                    days += createDayElement(dayNum, false, date, -1);
                }
                
                // 当前月的日期
                const today = new Date();
                for (let i = 1; i <= lastDay.getDate(); i++) {
                    // 检查是否是今天
                    const isToday = 
                        i === today.getDate() && 
                        date.getMonth() === today.getMonth() && 
                        date.getFullYear() === today.getFullYear();
                    
                    // 检查是否是选中的日期
                    const isSelected = 
                        i === selectedDate.getDate() && 
                        date.getMonth() === selectedDate.getMonth() && 
                        date.getFullYear() === selectedDate.getFullYear();
                    
                    // 检查是否是节气
                    const solarTerm = findSolarTerm(date.getFullYear(), date.getMonth() + 1, i);
                    
                    // 检查是否是节日
                    const festival = findFestival(date.getFullYear(), date.getMonth() + 1, i);
                    
                    days += createDayElement(i, true, date, 0, isToday, isSelected, solarTerm, festival);
                }
                
                // 下个月的日期
                for (let i = 1; i <= nextDays; i++) {
                    days += createDayElement(i, false, date, 1);
                }
                
                calendarDays.innerHTML = days;
                
                // 为每个日期添加点击事件
                document.querySelectorAll('.day').forEach(day => {
                    day.addEventListener('click', function() {
                        if (this.classList.contains('other-month')) {
                            // 切换到上个月或下个月
                            const offset = parseInt(this.getAttribute('data-offset'));
                            const newDate = new Date(date.getFullYear(), date.getMonth() + offset, 1);
                            renderCalendar(newDate);
                            
                            // 更新选中的日期
                            const dayNum = parseInt(this.querySelector('.day-number').textContent);
                            selectedDate = new Date(newDate.getFullYear(), newDate.getMonth(), dayNum);
                            updateSelectedDateDisplay();
                            return;
                        }
                        
                        // 更新选中的日期
                        const dayNum = parseInt(this.querySelector('.day-number').textContent);
                        selectedDate = new Date(date.getFullYear(), date.getMonth(), dayNum);
                        
                        // 更新显示
                        updateSelectedDateDisplay();
                        
                        // 重新渲染日历以更新选中状态
                        renderCalendar(date);
                    });
                });
            }
            
            // 创建日期元素
            function createDayElement(dayNum, isCurrentMonth, currentDate, offset = 0, isToday = false, isSelected = false, solarTerm = null, festival = null) {
                const date = new Date(currentDate.getFullYear(), currentDate.getMonth() + offset, dayNum);
                
                // 农历日期（简化版）
                const lunarDate = getLunarDate(date);
                
                let classes = 'day';
                if (!isCurrentMonth) classes += ' other-month';
                if (isToday) classes += ' today';
                if (isSelected) classes += ' selected';
                
                // 事件标记
                let eventMarkers = '';
                
                if (solarTerm) {
                    eventMarkers += `<div class="solar-term">${solarTerm.name}</div>`;
                }
                
                if (festival) {
                    eventMarkers += `<div class="festival">${festival.name}</div>`;
                }
                
                return `
                    <div class="${classes}" data-offset="${offset}">
                        <div class="day-bg"></div>
                        <div class="day-number">${dayNum}</div>
                        <div class="lunar-date">${lunarDate}</div>
                        <div class="event-markers">${eventMarkers}</div>
                    </div>
                `;
            }
            
            // 获取农历日期（简化版）
            function getLunarDate(date) {
                // 这是一个简化的农历计算方法
                const lunarMonths = ['正月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '冬月', '腊月'];
                const lunarDays = ['初一', '初二', '初三', '初四', '初五', '初六', '初七', '初八', '初九', '初十',
                                 '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十',
                                 '廿一', '廿二', '廿三', '廿四', '廿五', '廿六', '廿七', '廿八', '廿九', '三十'];
                
                // 简化计算：使用固定偏移
                const monthIndex = (date.getMonth() + 1) % 12;
                const dayIndex = date.getDate() % 30;
                
                return lunarMonths[monthIndex] + lunarDays[dayIndex];
            }
            
            // 查找节气
            function findSolarTerm(year, month, day) {
                const dateStr = `${year}-${month.toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}`;
                return solarTerms.find(term => term.date === dateStr);
            }
            
            // 查找节日
            function findFestival(year, month, day) {
                const dateStr = `${year}-${month.toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}`;
                return festivals.find(f => f.date === dateStr);
            }
            
            // 渲染二十四节气
            function renderSolarTerms() {
                let html = '';
                solarTerms.forEach(term => {
                    const isActive = term.date === formatDate(selectedDate);
                    html += `
                        <div class="solar-term-item ${isActive ? 'active' : ''}" 
                             title="${term.date}: ${term.description}">
                            ${term.name}
                        </div>
                    `;
                });
                solarTermsGrid.innerHTML = html;
                
                // 为节气添加点击事件
                document.querySelectorAll('.solar-term-item').forEach(item => {
                    item.addEventListener('click', function() {
                        const termName = this.textContent;
                        const term = solarTerms.find(t => t.name === termName);
                        
                        if (term) {
                            const [year, month, day] = term.date.split('-').map(Number);
                            selectedDate = new Date(year, month - 1, day);
                            
                            // 更新日历显示
                            currentDate = new Date(year, month - 1, 1);
                            renderCalendar(currentDate);
                            updateSelectedDateDisplay();
                            
                            // 显示通知
                            showNotification(`已跳转到节气: ${term.name} (${term.date})`);
                        }
                    });
                });
            }
            
            // 渲染传统节日
            function renderFestivals() {
                let html = '';
                
                // 按日期排序
                const sortedFestivals = [...festivals].sort((a, b) => {
                    return new Date(a.date) - new Date(b.date);
                });
                
                sortedFestivals.forEach(festival => {
                    const [year, month, day] = festival.date.split('-');
                    const date = new Date(year, month - 1, day);
                    const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
                    
                    html += `
                        <div class="festival-item" data-name="${festival.name}">
                            <div class="festival-date">${parseInt(month)}月${parseInt(day)}日 (${dayNames[date.getDay()]})</div>
                            <div class="festival-name">${festival.name}</div>
                            <div class="festival-type">${festival.type}</div>
                        </div>
                    `;
                });
                
                festivalsList.innerHTML = html;
                
                // 为节日添加点击事件
                document.querySelectorAll('.festival-item').forEach(item => {
                    item.addEventListener('click', function() {
                        const festivalName = this.getAttribute('data-name');
                        const festival = festivals.find(f => f.name === festivalName);
                        
                        if (festival) {
                            // 显示节日详情弹窗
                            showFestivalModal(festival);
                        }
                    });
                });
            }
            
            // 显示节日详情弹窗
            function showFestivalModal(festival) {
                const [year, month, day] = festival.date.split('-');
                
                modalTitle.textContent = festival.name;
                modalDate.textContent = `${parseInt(month)}月${parseInt(day)}日`;
                modalYear.textContent = `${year}年`;
                modalType.textContent = festival.type;
                modalDescription.textContent = festival.description;
                
                // 更新传统习俗
                const traditionsContainer = document.querySelector('.festival-traditions');
                let traditionsHtml = `
                    <h3 class="traditions-title">传统习俗</h3>
                `;
                
                festival.traditions.forEach(tradition => {
                    traditionsHtml += `
                        <div class="tradition-item">
                            <i class="fas fa-star"></i>
                            <div>${tradition}</div>
                        </div>
                    `;
                });
                
                traditionsContainer.innerHTML = traditionsHtml;
                
                festivalModal.classList.add('active');
            }
            
            // 更新选中的日期显示
            function updateSelectedDateDisplay() {
                const formattedDate = formatDate(selectedDate, true);
                selectedDateDisplay.textContent = formattedDate;
                
                // 更新节气列表中的活动状态
                renderSolarTerms();
                
                // 检查是否是节气或节日
                const solarTerm = findSolarTerm(selectedDate.getFullYear(), 
                                              selectedDate.getMonth() + 1, 
                                              selectedDate.getDate());
                
                const festival = findFestival(selectedDate.getFullYear(), 
                                           selectedDate.getMonth() + 1, 
                                           selectedDate.getDate());
                
                if (solarTerm) {
                    showNotification(`今天是 ${solarTerm.name}: ${solarTerm.description}`);
                } else if (festival) {
                    showNotification(`今天是 ${festival.name}，${festival.type}`);
                    // 如果是节日，显示节日详情
                    showFestivalModal(festival);
                }
            }
            
            // 显示通知
            function showNotification(message) {
                notification.textContent = message;
                notification.style.display = 'block';
                notification.style.background = '#8b1a1a';
                
                setTimeout(() => {
                    notification.style.display = 'none';
                }, 3000);
            }
            
            // 改变月份
            function changeMonth(change) {
                currentDate.setMonth(currentDate.getMonth() + change);
                renderCalendar(currentDate);
            }
            
            // 改变年份
            function changeYear(change) {
                currentDate.setFullYear(currentDate.getFullYear() + change);
                renderCalendar(currentDate);
            }
            
            // 格式化日期
            function formatDate(date, withDayOfWeek = false) {
                const year = date.getFullYear();
                const month = (date.getMonth() + 1).toString().padStart(2, '0');
                const day = date.getDate().toString().padStart(2, '0');
                
                if (!withDayOfWeek) {
                    return `${year}-${month}-${day}`;
                }
                
                const dayNames = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                const dayOfWeek = dayNames[date.getDay()];
                
                return `${year}年${month}月${day}日 ${dayOfWeek}`;
            }
            
            // 计算倒计时
            calculateBtn.addEventListener('click', function() {
                const targetDate = new Date(targetDateInput.value);
                if (isNaN(targetDate.getTime())) {
                    showNotification('请输入有效的目标日期');
                    return;
                }
                
                // 计算天数差
                const timeDiff = targetDate.getTime() - selectedDate.getTime();
                const daysDiff = Math.ceil(timeDiff / (1000 * 3600 * 24));
                
                // 更新显示
                if (daysDiff > 0) {
                    countdownValue.textContent = daysDiff;
                    countdownUnit.textContent = '天';
                } else if (daysDiff === 0) {
                    countdownValue.textContent = '今天';
                    countdownUnit.textContent = '';
                } else {
                    countdownValue.textContent = Math.abs(daysDiff);
                    countdownUnit.textContent = '天（已过去）';
                }
                
                // 显示结果通知
                const formattedTarget = formatDate(targetDate, true);
                showNotification(`已计算到 ${formattedTarget} 的倒计时`);
            });
        });
    </script>
</body>
</html>
