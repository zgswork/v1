        // DOM 元素
        const sceneSelect = document.getElementById('scene-select');
        const languageSelect = document.getElementById('language-select');
        const generateBtn = document.getElementById('generate-btn');
        const resultsSection = document.getElementById('results');
        const initialPrompt = document.getElementById('initial-prompt');
        const resultTitle = document.querySelector('#result-title span');
        const resultSubtitle = document.getElementById('result-subtitle');
        const greetingContent = document.getElementById('greeting-content');
        const phoneticGuide = document.getElementById('phonetic-guide');
        const copyGreeting = document.getElementById('copy-greeting');
        const audioPronunciation = document.getElementById('audio-pronunciation');
        const anotherGreeting = document.getElementById('another-greeting');
        const notification = document.getElementById('notification');
        const notificationIcon = document.getElementById('notification-icon');
        const notificationText = document.getElementById('notification-text');

        // 当前选择的问候语索引
        let currentGreetingIndex = 0;
        let currentScene = '';
        let currentLanguage = '';

        // 检查是否可以生成问候语
        function checkGenerateAbility() {
            if (sceneSelect.value && languageSelect.value) {
                generateBtn.removeAttribute('disabled');
            } else {
                generateBtn.setAttribute('disabled', true);
            }
        }

        // 显示通知
        function showNotification(message, isSuccess = true) {
            notificationText.textContent = message;
            notificationIcon.className = isSuccess ? "fa fa-check-circle mr-2 text-xl text-green-500" : "fa fa-exclamation-circle mr-2 text-xl text-red-500";
            notification.classList.remove('translate-y-20', 'opacity-0');
            notification.classList.add(isSuccess ? 'bg-green-50 text-green-800' : 'bg-red-50 text-red-800');
            
            setTimeout(() => {
                notification.classList.add('translate-y-20', 'opacity-0');
                notification.classList.remove('bg-green-50', 'text-green-800', 'bg-red-50', 'text-red-800');
            }, 3000);
        }

        // 生成问候语
        function generateGreeting() {
            const scene = sceneSelect.value;
            const language = languageSelect.value;
            
            if (!scene || !language) {
                showNotification('请先选择场景和语言', false);
                return;
            }
            
            currentScene = scene;
            currentLanguage = language;
            
            const sceneData = greetingDatabase[scene];
            const languageData = sceneData[language];
            
            // 随机选择一个问候语
            currentGreetingIndex = Math.floor(Math.random() * languageData.length);
            const selectedGreeting = languageData[currentGreetingIndex];
            
            // 更新结果区域
            resultTitle.textContent = `${sceneData.name} - ${getLanguageName(language)}`;
            resultSubtitle.textContent = "标准、礼貌的问候语，适合跨语言交流使用";
            greetingContent.textContent = selectedGreeting.text;
            phoneticGuide.textContent = `发音参考：${selectedGreeting.phonetic}`;
            
            // 显示结果，隐藏初始提示
            initialPrompt.classList.add('hidden');
            resultsSection.classList.remove('hidden');
            
            // 平滑滚动到结果区域
            resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            
            // 添加动画效果
            greetingContent.classList.add('animate-pulse');
            setTimeout(() => {
                greetingContent.classList.remove('animate-pulse');
            }, 1000);
        }

        // 获取语言名称
        function getLanguageName(code) {
            const languageNames = {
                'english': '英语',
                'french': '法语',
                'spanish': '西班牙语',
                'german': '德语',
                'japanese': '日语',
                'korean': '韩语',
                'russian': '俄语',
                'arabic': '阿拉伯语'
            };
            return languageNames[code] || code;
        }

        // 复制问候语
        function copyToClipboard() {
            const textToCopy = greetingContent.textContent;
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                showNotification('问候语已复制到剪贴板');
            }).catch(err => {
                showNotification('复制失败，请手动复制', false);
                console.error('复制失败:', err);
            });
        }

        // 发音示范（模拟）
        function playPronunciation() {
            showNotification('发音示范功能已触发（实际应用中会播放音频）');
            // 实际应用中，这里会根据当前语言和问候语播放相应的音频
        }

        // 换一个问候语
        function loadAnotherGreeting() {
            if (!currentScene || !currentLanguage) return;
            
            const sceneData = greetingDatabase[currentScene];
            const languageData = sceneData[currentLanguage];
            
            // 确保不重复显示同一个问候语
            let newIndex = currentGreetingIndex;
            while (newIndex === currentGreetingIndex && languageData.length > 1) {
                newIndex = Math.floor(Math.random() * languageData.length);
            }
            
            currentGreetingIndex = newIndex;
            const selectedGreeting = languageData[currentGreetingIndex];
            
            // 更新问候语内容，添加过渡效果
            greetingContent.style.opacity = '0';
            phoneticGuide.style.opacity = '0';
            
            setTimeout(() => {
                greetingContent.textContent = selectedGreeting.text;
                phoneticGuide.textContent = `发音参考：${selectedGreeting.phonetic}`;
                greetingContent.style.opacity = '1';
                phoneticGuide.style.opacity = '1';
            }, 300);
        }

        // 事件监听
        sceneSelect.addEventListener('change', checkGenerateAbility);
        languageSelect.addEventListener('change', checkGenerateAbility);
        generateBtn.addEventListener('click', generateGreeting);
        copyGreeting.addEventListener('click', copyToClipboard);
        audioPronunciation.addEventListener('click', playPronunciation);
        anotherGreeting.addEventListener('click', loadAnotherGreeting);

        // 添加滚动效果
        window.addEventListener('scroll', function() {
            const header = document.querySelector('header');
            if (window.scrollY > 10) {
                header.classList.add('py-2', 'shadow');
                header.classList.remove('py-4', 'shadow-sm');
            } else {
                header.classList.add('py-4', 'shadow-sm');
                header.classList.remove('py-2', 'shadow');
            }
        });

        // 初始化检查
        checkGenerateAbility();

        // 添加自定义动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes pulse {
                0% { transform: scale(1); }
                50% { transform: scale(1.02); }
                100% { transform: scale(1); }
            }
            .animate-pulse {
                animation: pulse 1s ease-in-out;
            }
            #greeting-content, #phonetic-guide {
                transition: opacity 0.3s ease;
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
