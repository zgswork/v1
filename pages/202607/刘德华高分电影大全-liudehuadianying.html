        const generateBtn = document.getElementById('generateBtn');
        const changeBtn = document.getElementById('changeBtn');
        const movieContent = document.getElementById('movieContent');
        
        let currentMovieIndex = -1;
        let previousIndexes = [];
        
        function getRandomMovie() {
            if (previousIndexes.length === movies.length) {
                previousIndexes = [];
            }
            
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * movies.length);
            } while (previousIndexes.includes(randomIndex));
            
            previousIndexes.push(randomIndex);
            currentMovieIndex = randomIndex;
            return movies[randomIndex];
        }
        
        function displayMovie(movie) {
            const stars = '★'.repeat(Math.round(movie.rating / 2));
            
            movieContent.innerHTML = `
                <div class="movie-title">${movie.title}</div>
                <div class="stars">${stars}</div>
                <div class="movie-intro">${movie.intro}</div>
                <div class="movie-reason">推荐理由：${movie.reason}</div>
            `;
        }
        
        generateBtn.addEventListener('click', function() {
            const movie = getRandomMovie();
            displayMovie(movie);
            generateBtn.style.display = 'none';
            changeBtn.style.display = 'block';
        });
        
        changeBtn.addEventListener('click', function() {
            const movie = getRandomMovie();
            displayMovie(movie);
        });
    </script>
