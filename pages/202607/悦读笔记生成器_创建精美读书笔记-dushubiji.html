<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>悦读笔记生成器 | 创建精美读书笔记</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #4e54c8;
            --secondary-color: #8f94fb;
            --accent-color: #ff6b6b;
            --light-color: #f8f9fa;
            --dark-color: #343a40;
            --success-color: #28a745;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: var(--dark-color);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 30px 0;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.8rem;
            color: var(--primary-color);
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        header p {
            font-size: 1.2rem;
            color: var(--dark-color);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .app-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            margin-bottom: 40px;
        }

        .form-section {
            flex: 1;
            min-width: 300px;
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .preview-section {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .section-title {
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--secondary-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark-color);
        }

        input, textarea, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(78, 84, 200, 0.2);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .btn:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .btn-block {
            display: block;
            width: 100%;
        }

        .btn-accent {
            background: var(--accent-color);
        }

        .btn-accent:hover {
            background: #ff5252;
        }

        .btn-success {
            background: var(--success-color);
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .note-card {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease;
        }

        .note-card:hover {
            transform: translateY(-5px);
        }

        .card-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 25px;
            text-align: center;
            position: relative;
        }

        .book-title {
            font-size: 1.8rem;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .book-author {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .card-body {
            padding: 25px;
        }

        .book-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            color: #666;
            font-size: 0.95rem;
        }

        .book-cover {
            width: 100%;
            height: 200px;
            background: #f0f0f0;
            border-radius: 8px;
            margin-bottom: 20px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .book-cover img {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
        }

        .book-cover-placeholder {
            color: #999;
            font-size: 0.9rem;
        }

        .book-notes {
            line-height: 1.7;
            color: #444;
        }

        .card-footer {
            padding: 20px 25px;
            background: #f8f9fa;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #666;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
            width: 100%;
            max-width: 450px;
        }

        .color-options {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .color-option {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease;
        }

        .color-option:hover {
            transform: scale(1.1);
        }

        .color-option.active {
            transform: scale(1.15);
            border: 2px solid var(--dark-color);
        }

        .footer {
            text-align: center;
            padding: 30px 0;
            color: #666;
            font-size: 1rem;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }
            
            header h1 {
                font-size: 2.2rem;
            }
            
            .form-row {
                flex-direction: column;
                gap: 15px;
            }
            
            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-book-reader"></i> 悦读笔记生成器</h1>
            <p>创建精美的读书笔记卡片，记录你的阅读旅程。支持导出图片、自定义样式，适配手机和电脑使用。</p>
        </header>

        <div class="app-container">
            <div class="form-section">
                <h2 class="section-title"><i class="fas fa-edit"></i> 笔记信息</h2>
                
                <div class="form-group">
                    <label for="bookTitle">书名</label>
                    <input type="text" id="bookTitle" placeholder="输入书名" value="人类简史：从动物到上帝">
                </div>
                
                <div class="form-group">
                    <label for="bookAuthor">作者</label>
                    <input type="text" id="bookAuthor" placeholder="输入作者" value="尤瓦尔·赫拉利">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="readDate">阅读日期</label>
                        <input type="date" id="readDate" value="2023-08-15">
                    </div>
                    
                    <div class="form-group">
                        <label for="rating">评分</label>
                        <select id="rating">
                            <option value="5">★★★★★</option>
                            <option value="4">★★★★☆</option>
                            <option value="3" selected>★★★☆☆</option>
                            <option value="2">★★☆☆☆</option>
                            <option value="1">★☆☆☆☆</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="bookNotes">读书笔记</label>
                    <textarea id="bookNotes" placeholder="写下你的读书心得、摘录或感悟...">《人类简史》以独特视角审视人类发展历程，从认知革命到农业革命再到科学革命。作者提出，人类通过虚构故事的能力实现大规模合作，这是区别于其他物种的关键。书中关于农业革命是"史上最大骗局"的论述令人深思。</textarea>
                </div>
                
                <div class="form-group">
                    <label for="coverUpload">书籍封面</label>
                    <input type="file" id="coverUpload" accept="image/*">
                </div>
                
                <h2 class="section-title" style="margin-top: 30px;"><i class="fas fa-palette"></i> 自定义样式</h2>
                
                <div class="form-group">
                    <label>主题颜色</label>
                    <div class="color-options">
                        <div class="color-option active" style="background: #4e54c8;" data-color="primary"></div>
                        <div class="color-option" style="background: #ff6b6b;" data-color="accent"></div>
                        <div class="color-option" style="background: #28a745;" data-color="success"></div>
                        <div class="color-option" style="background: #6f42c1;" data-color="purple"></div>
                        <div class="color-option" style="background: #20c997;" data-color="teal"></div>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="fontSize">字体大小</label>
                        <select id="fontSize">
                            <option value="small">较小</option>
                            <option value="medium" selected>中等</option>
                            <option value="large">较大</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="cardStyle">卡片样式</label>
                        <select id="cardStyle">
                            <option value="rounded">圆角</option>
                            <option value="flat">扁平</option>
                            <option value="shadow">阴影</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="preview-section">
                <h2 class="section-title"><i class="fas fa-eye"></i> 笔记预览</h2>
                
                <div class="note-card" id="noteCard">
                    <div class="card-header" id="cardHeader">
                        <h2 class="book-title" id="previewTitle">人类简史：从动物到上帝</h2>
                        <p class="book-author" id="previewAuthor">尤瓦尔·赫拉利</p>
                    </div>
                    
                    <div class="card-body">
                        <div class="book-meta">
                            <span id="previewDate">阅读日期: 2023-08-15</span>
                            <span id="previewRating">评分: ★★★☆☆</span>
                        </div>
                        
                        <div class="book-cover" id="bookCover">
                            <div class="book-cover-placeholder">
                                <i class="fas fa-book-open fa-3x"></i>
                                <p>书籍封面</p>
                            </div>
                        </div>
                        
                        <div class="book-notes" id="previewNotes">
                            《人类简史》以独特视角审视人类发展历程，从认知革命到农业革命再到科学革命。作者提出，人类通过虚构故事的能力实现大规模合作，这是区别于其他物种的关键。书中关于农业革命是"史上最大骗局"的论述令人深思。
                        </div>
                    </div>
                    
                    <div class="card-footer">
                        <span>使用悦读笔记生成器创建</span>
                        <span id="previewFooterDate">2023年8月</span>
                    </div>
                </div>
                
                <div class="actions">
                    <button class="btn btn-block" id="saveBtn"><i class="fas fa-download"></i> 保存为图片</button>
                    <button class="btn btn-accent btn-block" id="shareBtn"><i class="fas fa-share-alt"></i> 生成分享链接</button>
                    <button class="btn btn-success btn-block" id="resetBtn"><i class="fas fa-redo"></i> 重置表单</button>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2023 悦读笔记生成器 | 让阅读留下美好印记</p>
        </div>
    </div>

    <script>
        // 获取DOM元素
        const bookTitle = document.getElementById('bookTitle');
        const bookAuthor = document.getElementById('bookAuthor');
        const readDate = document.getElementById('readDate');
        const rating = document.getElementById('rating');
        const bookNotes = document.getElementById('bookNotes');
        const coverUpload = document.getElementById('coverUpload');
        const fontSize = document.getElementById('fontSize');
        const cardStyle = document.getElementById('cardStyle');
        const colorOptions = document.querySelectorAll('.color-option');
        
        const previewTitle = document.getElementById('previewTitle');
        const previewAuthor = document.getElementById('previewAuthor');
        const previewDate = document.getElementById('previewDate');
        const previewRating = document.getElementById('previewRating');
        const previewNotes = document.getElementById('previewNotes');
        const bookCover = document.getElementById('bookCover');
        const previewFooterDate = document.getElementById('previewFooterDate');
        const cardHeader = document.getElementById('cardHeader');
        const noteCard = document.getElementById('noteCard');
        
        const saveBtn = document.getElementById('saveBtn');
        const shareBtn = document.getElementById('shareBtn');
        const resetBtn = document.getElementById('resetBtn');
        
        // 设置当前日期为默认值
        const today = new Date();
        const formattedDate = today.toISOString().split('T')[0];
        readDate.value = formattedDate;
        
        // 更新预览中的日期
        previewDate.textContent = `阅读日期: ${formattedDate}`;
        previewFooterDate.textContent = `${today.getFullYear()}年${today.getMonth() + 1}月`;
        
        // 初始化事件监听
        function initEventListeners() {
            // 输入事件监听
            bookTitle.addEventListener('input', updatePreview);
            bookAuthor.addEventListener('input', updatePreview);
            readDate.addEventListener('change', updatePreview);
            rating.addEventListener('change', updatePreview);
            bookNotes.addEventListener('input', updatePreview);
            fontSize.addEventListener('change', updateFontSize);
            cardStyle.addEventListener('change', updateCardStyle);
            
            // 颜色选择
            colorOptions.forEach(option => {
                option.addEventListener('click', changeColorTheme);
            });
            
            // 封面图片上传
            coverUpload.addEventListener('change', handleCoverUpload);
            
            // 按钮事件
            saveBtn.addEventListener('click', saveAsImage);
            shareBtn.addEventListener('click', shareNote);
            resetBtn.addEventListener('click', resetForm);
        }
        
        // 更新预览
        function updatePreview() {
            previewTitle.textContent = bookTitle.value || '未命名书籍';
            previewAuthor.textContent = bookAuthor.value || '未知作者';
            previewDate.textContent = `阅读日期: ${readDate.value}`;
            
            // 更新评分
            const ratingValue = parseInt(rating.value);
            let ratingText = '';
            switch(ratingValue) {
                case 5:
                    ratingText = '★★★★★';
                    break;
                case 4:
                    ratingText = '★★★★☆';
                    break;
                case 3:
                    ratingText = '★★★☆☆';
                    break;
                case 2:
                    ratingText = '★★☆☆☆';
                    break;
                case 1:
                    ratingText = '★☆☆☆☆';
                    break;
                default:
                    ratingText = '★★★☆☆';
            }
            previewRating.textContent = `评分: ${ratingText}`;
            
            previewNotes.textContent = bookNotes.value || '写下你的读书心得...';
            
            // 更新页脚日期
            const date = new Date(readDate.value);
            if (!isNaN(date.getTime())) {
                previewFooterDate.textContent = `${date.getFullYear()}年${date.getMonth() + 1}月`;
            }
        }
        
        // 更新字体大小
        function updateFontSize() {
            const size = fontSize.value;
            noteCard.style.fontSize = 
                size === 'small' ? '0.9rem' : 
                size === 'large' ? '1.1rem' : '1rem';
        }
        
        // 更新卡片样式
        function updateCardStyle() {
            const style = cardStyle.value;
            
            if (style === 'flat') {
                noteCard.style.boxShadow = 'none';
                noteCard.style.borderRadius = '0';
            } else if (style === 'rounded') {
                noteCard.style.boxShadow = '0 15px 35px rgba(0, 0, 0, 0.15)';
                noteCard.style.borderRadius = '12px';
            } else {
                noteCard.style.boxShadow = '0 20px 40px rgba(0, 0, 0, 0.25)';
                noteCard.style.borderRadius = '8px';
            }
        }
        
        // 更改颜色主题
        function changeColorTheme(e) {
            const color = e.target.getAttribute('data-color');
            
            // 移除所有active类
            colorOptions.forEach(option => {
                option.classList.remove('active');
            });
            
            // 添加active类到当前选项
            e.target.classList.add('active');
            
            // 根据选择的颜色更新主题
            let primaryColor, secondaryColor;
            
            switch(color) {
                case 'accent':
                    primaryColor = '#ff6b6b';
                    secondaryColor = '#ff8e8e';
                    break;
                case 'success':
                    primaryColor = '#28a745';
                    secondaryColor = '#34ce57';
                    break;
                case 'purple':
                    primaryColor = '#6f42c1';
                    secondaryColor = '#8a63d2';
                    break;
                case 'teal':
                    primaryColor = '#20c997';
                    secondaryColor = '#38d9a9';
                    break;
                default:
                    primaryColor = '#4e54c8';
                    secondaryColor = '#8f94fb';
            }
            
            cardHeader.style.background = `linear-gradient(135deg, ${primaryColor}, ${secondaryColor})`;
        }
        
        // 处理封面图片上传
        function handleCoverUpload(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    bookCover.innerHTML = '';
                    const img = document.createElement('img');
                    img.src = event.target.result;
                    img.alt = '书籍封面';
                    bookCover.appendChild(img);
                };
                reader.readAsDataURL(file);
            }
        }
        
        // 保存为图片
        function saveAsImage() {
            // 显示提示
            const originalText = saveBtn.innerHTML;
            saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 正在生成图片...';
            saveBtn.disabled = true;
            
            // 使用html2canvas生成图片
            html2canvas(noteCard).then(canvas => {
                const link = document.createElement('a');
                link.download = `读书笔记-${bookTitle.value || '未命名'}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                // 恢复按钮状态
                saveBtn.innerHTML = originalText;
                saveBtn.disabled = false;
            });
        }
        
        // 分享笔记
        function shareNote() {
            // 显示提示
            const originalText = shareBtn.innerHTML;
            shareBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 正在生成链接...';
            shareBtn.disabled = true;
            
            // 模拟生成分享链接（在实际应用中，这里应该调用后端API）
            setTimeout(() => {
                alert('分享链接已生成！\n\nhttps://deepseek.idoxu.com/share/读书笔记\n\n复制此链接与他人分享您的读书笔记');
                
                // 恢复按钮状态
                shareBtn.innerHTML = originalText;
                shareBtn.disabled = false;
            }, 1500);
        }
        
        // 重置表单
        function resetForm() {
            if (confirm('确定要重置所有内容吗？')) {
                bookTitle.value = '';
                bookAuthor.value = '';
                readDate.value = formattedDate;
                rating.value = '3';
                bookNotes.value = '';
                coverUpload.value = '';
                fontSize.value = 'medium';
                cardStyle.value = 'rounded';
                
                // 重置颜色主题
                colorOptions.forEach(option => {
                    option.classList.remove('active');
                    if (option.getAttribute('data-color') === 'primary') {
                        option.classList.add('active');
                    }
                });
                
                // 重置封面
                bookCover.innerHTML = `
                    <div class="book-cover-placeholder">
                        <i class="fas fa-book-open fa-3x"></i>
                        <p>书籍封面</p>
                    </div>
                `;
                
                // 重置样式
                cardHeader.style.background = 'linear-gradient(135deg, #4e54c8, #8f94fb)';
                noteCard.style.fontSize = '1rem';
                noteCard.style.boxShadow = '0 15px 35px rgba(0, 0, 0, 0.15)';
                noteCard.style.borderRadius = '12px';
                
                // 更新预览
                updatePreview();
            }
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initEventListeners();
            updatePreview();
        });
    </script>
</body>
</html>
