<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>薪资计算工具 - 税前税后计算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
        }

        .input-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #e9ecef;
        }

        .result-section {
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #e9ecef;
        }

        .section-title {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #4facfe;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #4facfe;
        }

        .toggle-buttons {
            display: flex;
            margin-bottom: 20px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #e9ecef;
        }

        .toggle-btn {
            flex: 1;
            padding: 12px;
            background: #f8f9fa;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
        }

        .toggle-btn.active {
            background: #4facfe;
            color: white;
        }

        .calculate-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .calculate-btn:hover {
            transform: translateY(-2px);
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .result-item:last-child {
            border-bottom: none;
            font-weight: bold;
            font-size: 1.1em;
            color: #4facfe;
        }

        .result-label {
            color: #666;
        }

        .result-value {
            font-weight: 500;
            color: #333;
        }

        .breakdown {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .breakdown-title {
            font-size: 1.1em;
            color: #333;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .footer {
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        .footer a {
            color: #4facfe;
            text-decoration: none;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2em;
            }
        }

        .error {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 5px;
        }

        .success {
            color: #27ae60;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>薪资计算工具</h1>
            <p>精准计算税前税后薪资，支持最新税率和社保政策</p>
        </div>

        <div class="main-content">
            <div class="input-section">
                <h2 class="section-title">薪资信息输入</h2>
                
                <div class="toggle-buttons">
                    <button class="toggle-btn active" id="pretaxBtn" onclick="toggleCalculationType('pretax')">税前转税后</button>
                    <button class="toggle-btn" id="aftertaxBtn" onclick="toggleCalculationType('aftertax')">税后转税前</button>
                </div>

                <div class="form-group">
                    <label for="salary" id="salaryLabel">税前月薪（元）</label>
                    <input type="number" id="salary" placeholder="请输入薪资金额" min="0" step="100">
                </div>

                <div class="form-group">
                    <label for="city">所在城市</label>
                    <select id="city">
                        <option value="beijing">北京</option>
                        <option value="shanghai">上海</option>
                        <option value="guangzhou">广州</option>
                        <option value="shenzhen">深圳</option>
                        <option value="hangzhou">杭州</option>
                        <option value="nanjing">南京</option>
                        <option value="chengdu">成都</option>
                        <option value="wuhan">武汉</option>
                        <option value="other">其他城市</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="socialBase">社保公积金基数（元）</label>
                    <input type="number" id="socialBase" placeholder="默认等于工资，可自定义" min="0">
                </div>

                <div class="form-group">
                    <label for="housingFund">公积金缴费比例（%）</label>
                    <select id="housingFund">
                        <option value="5">5%</option>
                        <option value="7">7%</option>
                        <option value="8">8%</option>
                        <option value="10">10%</option>
                        <option value="12" selected>12%</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="specialDeduction">专项附加扣除（元/月）</label>
                    <input type="number" id="specialDeduction" placeholder="子女教育、房贷利息等" min="0" value="0">
                </div>

                <button class="calculate-btn" onclick="calculateSalary()">开始计算</button>
            </div>

            <div class="result-section">
                <h2 class="section-title">计算结果</h2>
                <div id="results">
                    <div class="result-item">
                        <span class="result-label">税前月薪：</span>
                        <span class="result-value" id="pretaxSalary">¥0</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">个人所得税：</span>
                        <span class="result-value" id="personalTax">¥0</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">五险一金个人部分：</span>
                        <span class="result-value" id="socialInsurance">¥0</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">税后到手：</span>
                        <span class="result-value" id="aftertaxSalary">¥0</span>
                    </div>
                </div>

                <div class="breakdown" id="breakdown">
                    <div class="breakdown-title">详细扣除明细</div>
                    <div id="breakdownDetails">
                        <div class="result-item">
                            <span class="result-label">养老保险（8%）：</span>
                            <span class="result-value" id="pension">¥0</span>
                        </div>
                        <div class="result-item">
                            <span class="result-label">医疗保险（2%）：</span>
                            <span class="result-value" id="medical">¥0</span>
                        </div>
                        <div class="result-item">
                            <span class="result-label">失业保险（0.5%）：</span>
                            <span class="result-value" id="unemployment">¥0</span>
                        </div>
                        <div class="result-item">
                            <span class="result-label">住房公积金：</span>
                            <span class="result-value" id="housing">¥0</span>
                        </div>
                        <div class="result-item">
                            <span class="result-label">专项附加扣除：</span>
                            <span class="result-value" id="specialDeduct">¥0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>© 2024 薪资计算工具 | 数据仅供参考，具体以当地政策为准</p>
            <p>有任何问题联系作者微信：<strong>xd135341</strong></p>
        </div>
    </div>

    <script>
        // 税率表（2024年最新）
        const taxBrackets = [
            { min: 0, max: 3000, rate: 0.03, deduction: 0 },
            { min: 3000, max: 12000, rate: 0.10, deduction: 210 },
            { min: 12000, max: 25000, rate: 0.20, deduction: 1410 },
            { min: 25000, max: 35000, rate: 0.25, deduction: 2660 },
            { min: 35000, max: 55000, rate: 0.30, deduction: 4410 },
            { min: 55000, max: 80000, rate: 0.35, deduction: 7160 },
            { min: 80000, max: Infinity, rate: 0.45, deduction: 15160 }
        ];

        // 城市社保基数配置
        const cityConfig = {
            beijing: { name: '北京', minBase: 5869, maxBase: 31884 },
            shanghai: { name: '上海', minBase: 6520, maxBase: 34188 },
            guangzhou: { name: '广州', minBase: 2300, maxBase: 30876 },
            shenzhen: { name: '深圳', minBase: 2360, maxBase: 31014 },
            hangzhou: { name: '杭州', minBase: 3957, maxBase: 20292 },
            nanjing: { name: '南京', minBase: 4250, maxBase: 21821 },
            chengdu: { name: '成都', minBase: 3726, maxBase: 19158 },
            wuhan: { name: '武汉', minBase: 3739, maxBase: 18699 },
            other: { name: '其他城市', minBase: 3000, maxBase: 25000 }
        };

        let calculationType = 'pretax'; // 'pretax' 或 'aftertax'

        function toggleCalculationType(type) {
            calculationType = type;
            const pretaxBtn = document.getElementById('pretaxBtn');
            const aftertaxBtn = document.getElementById('aftertaxBtn');
            const salaryLabel = document.getElementById('salaryLabel');

            if (type === 'pretax') {
                pretaxBtn.classList.add('active');
                aftertaxBtn.classList.remove('active');
                salaryLabel.textContent = '税前月薪（元）';
            } else {
                aftertaxBtn.classList.add('active');
                pretaxBtn.classList.remove('active');
                salaryLabel.textContent = '税后月薪（元）';
            }
        }

        function calculateTax(taxableIncome) {
            for (let bracket of taxBrackets) {
                if (taxableIncome <= bracket.max) {
                    return Math.max(0, taxableIncome * bracket.rate - bracket.deduction);
                }
            }
            return 0;
        }

        function calculateSocialInsurance(base, housingFundRate) {
            const pension = base * 0.08; // 养老保险 8%
            const medical = base * 0.02; // 医疗保险 2%
            const unemployment = base * 0.005; // 失业保险 0.5%
            const housing = base * (housingFundRate / 100); // 公积金

            return {
                pension: Math.round(pension * 100) / 100,
                medical: Math.round(medical * 100) / 100,
                unemployment: Math.round(unemployment * 100) / 100,
                housing: Math.round(housing * 100) / 100,
                total: Math.round((pension + medical + unemployment + housing) * 100) / 100
            };
        }

        function calculateFromPretax(pretaxSalary, socialBase, housingFundRate, specialDeduction) {
            const socialInsurance = calculateSocialInsurance(socialBase, housingFundRate);
            const taxableIncome = Math.max(0, pretaxSalary - socialInsurance.total - 5000 - specialDeduction);
            const personalTax = Math.round(calculateTax(taxableIncome) * 100) / 100;
            const aftertaxSalary = Math.round((pretaxSalary - socialInsurance.total - personalTax) * 100) / 100;

            return {
                pretaxSalary,
                aftertaxSalary,
                personalTax,
                socialInsurance,
                specialDeduction
            };
        }

        function calculateFromAftertax(aftertaxSalary, socialBase, housingFundRate, specialDeduction) {
            // 使用二分查找法反推税前薪资
            let low = aftertaxSalary;
            let high = aftertaxSalary * 3;
            let result = null;

            for (let i = 0; i < 100; i++) {
                const mid = (low + high) / 2;
                const calc = calculateFromPretax(mid, socialBase, housingFundRate, specialDeduction);
                
                if (Math.abs(calc.aftertaxSalary - aftertaxSalary) < 0.01) {
                    result = calc;
                    break;
                }
                
                if (calc.aftertaxSalary < aftertaxSalary) {
                    low = mid;
                } else {
                    high = mid;
                }
            }

            return result || calculateFromPretax(aftertaxSalary * 1.5, socialBase, housingFundRate, specialDeduction);
        }

        function calculateSalary() {
            const salary = parseFloat(document.getElementById('salary').value) || 0;
            const city = document.getElementById('city').value;
            const socialBaseInput = parseFloat(document.getElementById('socialBase').value);
            const housingFundRate = parseFloat(document.getElementById('housingFund').value);
            const specialDeduction = parseFloat(document.getElementById('specialDeduction').value) || 0;

            if (salary <= 0) {
                alert('请输入有效的薪资金额');
                return;
            }

            // 确定社保基数
            const socialBase = socialBaseInput || salary;
            const cityInfo = cityConfig[city];
            const adjustedSocialBase = Math.min(Math.max(socialBase, cityInfo.minBase), cityInfo.maxBase);

            let result;
            if (calculationType === 'pretax') {
                result = calculateFromPretax(salary, adjustedSocialBase, housingFundRate, specialDeduction);
            } else {
                result = calculateFromAftertax(salary, adjustedSocialBase, housingFundRate, specialDeduction);
            }

            // 更新显示结果
            document.getElementById('pretaxSalary').textContent = `¥${result.pretaxSalary.toLocaleString()}`;
            document.getElementById('aftertaxSalary').textContent = `¥${result.aftertaxSalary.toLocaleString()}`;
            document.getElementById('personalTax').textContent = `¥${result.personalTax.toLocaleString()}`;
            document.getElementById('socialInsurance').textContent = `¥${result.socialInsurance.total.toLocaleString()}`;

            // 更新详细扣除明细
            document.getElementById('pension').textContent = `¥${result.socialInsurance.pension.toLocaleString()}`;
            document.getElementById('medical').textContent = `¥${result.socialInsurance.medical.toLocaleString()}`;
            document.getElementById('unemployment').textContent = `¥${result.socialInsurance.unemployment.toLocaleString()}`;
            document.getElementById('housing').textContent = `¥${result.socialInsurance.housing.toLocaleString()}`;
            document.getElementById('specialDeduct').textContent = `¥${result.specialDeduction.toLocaleString()}`;
        }

        // 自动设置社保基数
        document.getElementById('salary').addEventListener('input', function() {
            const salary = parseFloat(this.value) || 0;
            const socialBaseInput = document.getElementById('socialBase');
            if (!socialBaseInput.value) {
                socialBaseInput.placeholder = `默认：${salary}`;
            }
        });

        // 页面加载完成后的初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 可以在这里添加一些初始化逻辑
            console.log('薪资计算工具已加载完成');
        });
    </script>
</body>
</html>
