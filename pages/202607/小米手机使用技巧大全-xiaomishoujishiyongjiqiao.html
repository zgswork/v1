    <style>
        :root {
            --primary-color: #ff6700;
            --bg-color: #f5f5f5;
            --card-bg: #ffffff;

            --secondary-text: #757575;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "MiSans", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            width: 100%;
        }
        
        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: var(--primary-color);
            font-weight: 600;
        }
        
        .subtitle {
            color: var(--secondary-text);
            font-size: 1.1rem;
        }
        
        .tool-container {
            width: 100%;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            padding: 30px;
            margin-bottom: 40px;
            text-align: center;
        }
        
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            margin-bottom: 30px;
        }
        
        .btn:hover {
            background-color: #e65c00;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 103, 0, 0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .tip-container {
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            border-radius: 12px;
            background-color: rgba(255, 103, 0, 0.05);
            transition: opacity 0.3s ease;
        }
        
        .category {
            display: inline-block;
            padding: 6px 12px;
            background-color: var(--primary-color);
            color: white;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
        
        .tip-content {
            font-size: 1.2rem;
            line-height: 1.5;
        }
        
        footer {
            margin-top: auto;
            text-align: center;
            padding: 20px 0;
            color: var(--secondary-text);
            font-size: 0.9rem;
        }
        
        footer p {
            margin: 5px 0;
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .tool-container {
                padding: 20px;
            }
            
            .btn {
                padding: 12px 24px;
                font-size: 1rem;
            }
            
            .tip-content {
                font-size: 1.1rem;
            }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

        const randomBtn = document.getElementById('randomBtn');

        let currentIndex = -1;
        
        // 获取随机技巧
        function getRandomTip() {
            let newIndex;
            // 确保不连续出现相同的技巧
            do {
                newIndex = Math.floor(Math.random() * tipsDatabase.length);
            } while (newIndex === currentIndex && tipsDatabase.length > 1);
            
            currentIndex = newIndex;
            return tipsDatabase[currentIndex];
        }
        
        // 显示技巧
        function displayTip() {
            const tip = getRandomTip();
            
            tipContainer.classList.remove('fade-in');

            void tipContainer.offsetWidth;
            
            tipContainer.innerHTML = `
                <span class="category">${tip.category}</span>
                <p class="tip-content">${tip.content}</p>
            `;
            
            tipContainer.classList.add('fade-in');

            if (randomBtn.textContent === '随机学个小技巧') {
