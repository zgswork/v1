<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太空入侵者 - Space Invaders</title>
    <style>
        /* 
        游戏介绍：经典太空入侵者游戏 - 进化版
        游戏规则：控制飞船消灭不断进攻的外星舰队
        详细玩法：
        1. 使用左右箭头键或A/D键控制飞船移动
        2. 按空格键或点击屏幕发射子弹
        3. 消灭外星人获得分数，难度逐渐增加
        4. 外星人会横向移动并逐渐下降
        5. 收集道具获得强化武器和护盾
        6. 不同颜色的外星人有不同血量和分数
        7. 外星人碰到飞船或到达底部游戏结束
        8. 移动端支持触摸控制和虚拟按键
        */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            font-family: 'Courier New', monospace;
            color: #00ff00;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 10px 10px calc(90px + 12px) 10px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .game-container {
            background: #000;
            border: 2px solid #00ff00;
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 120px);
            min-height: 500px;
            max-height: 650px;
        }

        .title {
            font-size: 1.8em;
            text-align: center;
            margin: 5px 0;
            text-shadow: 0 0 10px #00ff00;
            animation: blink 1s infinite;
            flex-shrink: 0;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.5; }
        }

        .score {
            font-size: 1em;
            text-align: center;
            margin: 5px 0;
            flex-shrink: 0;
        }

        #gameCanvas {
            display: block;
            background: #000;
            border: 1px solid #00ff00;
            width: 100%;
            flex: 1;
            min-height: 300px;
        }

        .controls {
            margin: 5px 0;
            text-align: center;
            font-size: 0.8em;
            flex-shrink: 0;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: #ff0000;
            padding: 20px;
            border: 2px solid #ff0000;
            text-align: center;
            display: none;
        }

        .restart-btn {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-family: 'Courier New', monospace;
            font-size: 1em;
            cursor: pointer;
            margin-top: 10px;
        }

        .restart-btn:hover {
            background: #00cc00;
        }

        .game-info {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #00ff00;
            margin: 5px 0;
            padding: 8px;
            font-size: 0.75em;
            line-height: 1.3;
            flex-shrink: 0;
        }

        .game-stats {
            display: flex;
            justify-content: space-between;
            margin: 3px 0;
            font-size: 0.9em;
            flex-shrink: 0;
        }

        .virtual-controls {
            display: none;
            position: fixed;
            bottom: calc(90px + 12px);
            left: 0;
            right: 0;
            height: 50px;
            background: rgba(0, 0, 0, 0.8);
            border-top: 1px solid #00ff00;
            z-index: 100;
        }

        .control-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 100%;
            padding: 0 20px;
        }

        .control-btn {
            background: rgba(0, 255, 0, 0.2);
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 8px 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
        }

        .control-btn:active {
            background: rgba(0, 255, 0, 0.4);
        }

        @media (max-width: 768px) {
            body {
                padding: 5px 5px calc(90px + 50px + 12px) 5px;
            }
            
            .title {
                font-size: 1.4em;
            }
            
            .game-container {
                height: calc(100vh - 162px);
                min-height: 400px;
                max-height: 500px;
            }
            
            .virtual-controls {
                display: block;
            }
            
            .game-info {
                font-size: 0.7em;
                padding: 5px;
            }
        }

        @media (max-height: 600px) {
            .game-container {
                min-height: 350px;
                max-height: 450px;
            }
            
            .title {
                font-size: 1.2em;
                margin: 3px 0;
            }
            
            .game-info {
                font-size: 0.65em;
                padding: 4px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="title">SPACE INVADERS</div>
        <div class="game-stats">
            <span>SCORE: <span id="score">0</span></span>
            <span>WAVE: <span id="wave">1</span></span>
            <span>LIVES: <span id="lives">3</span></span>
        </div>
        <div class="game-info">
            🚀 使用左右键或A/D控制飞船 | 空格键射击 | 收集道具强化武器 | 不同颜色敌人有不同血量
        </div>
        <canvas id="gameCanvas"></canvas>
        <div class="controls">
            PC: ← → 移动 | SPACE 射击 | 手机：触摸控制
        </div>
        <div class="game-over" id="gameOver">
            <h2>GAME OVER</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <p>Wave Reached: <span id="finalWave">1</span></p>
            <button class="restart-btn" onclick="restartGame()">RESTART</button>
        </div>

    <div class="virtual-controls">
        <div class="control-buttons">
            <button class="control-btn" id="leftBtn">←</button>

        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverElement = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');

        // 游戏状态
        let gameRunning = true;
        let score = 0;
        let wave = 1;
        let lives = 3;
        let keys = {};
        let enemyDirection = 1;
        let enemySpeed = 0.5;
        let enemyDropDistance = 15; // 减少每次下降距离
        let enemyShootChance = 0.002;
        let lastShotTime = 0;
        let shootCooldown = 150;
        let waveStartTime = 0;
        let enemyShootCooldown = 0;

        // 游戏对象
        let player = {
            x: 0,
            y: 0,
            width: 30,
            height: 20,
            speed: 5,
            powerup: 0, // 0: normal, 1: double shot, 2: triple shot
            shield: 0,
            invulnerable: 0
        };
        
        let powerups = [];
        let explosions = [];
        let particles = [];

        let bullets = [];
        let enemies = [];
        let enemyBullets = [];

        // 初始化敌人
        function initEnemies() {
            enemies = [];
            // 更缓慢的难度增长
            const rows = Math.min(5 + Math.floor(wave / 4), 7); // 减少最大行数
            const cols = Math.min(8 + Math.floor(wave / 3), 10); // 减少最大列数
            
            // 确保敌人从顶部开始，给玩家足够反应时间
            const startY = wave === 1 ? 30 : -150; // 后续关卡从更高位置开始
            
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    let type = 0; // 默认类型
                    let hp = 1;
                    let points = 10;
                    let color = '#ff0000';
                    
                    if (row === 0) {
                        type = 2; // 黄色精英
                        hp = 3;
                        points = 50;
                        color = '#ffff00';
                    } else if (row < 3) {
                        type = 1; // 蓝色中级
                        hp = 2;
                        points = 20;
                        color = '#0080ff';
                    }
                    
                    enemies.push({
                        x: col * 35 + 30,
                        y: startY + row * 30, // 修改Y位置计算
                        width: 25,
                        height: 20,
                        alive: true,
                        type: type,
                        hp: hp,
                        maxHp: hp,
                        points: points,
                        color: color
                    });
                }
            }
        }

        // 绘制像素风格的形状
        function drawPixelRect(x, y, width, height, color) {
            ctx.fillStyle = color;
            ctx.fillRect(Math.floor(x), Math.floor(y), width, height);
        }

        // 绘制玩家
        function drawPlayer() {
            const alpha = player.invulnerable > 0 ? (Math.sin(Date.now() * 0.02) + 1) * 0.5 : 1;
            const color = player.invulnerable > 0 ? '#ffaa00' : '#00ff00';
            
            drawPixelRect(player.x, player.y, player.width, player.height, color);
            // 飞船细节
            drawPixelRect(player.x + 10, player.y - 5, 10, 5, color);
            drawPixelRect(player.x + 5, player.y + 20, 5, 5, color);
            drawPixelRect(player.x + 20, player.y + 20, 5, 5, color);
            
            // 护盾效果
            if (player.shield > 0) {
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(player.x + player.width/2, player.y + player.height/2, 25, 0, Math.PI * 2);
                ctx.stroke();
            }
            
            // 强化武器指示
            if (player.powerup > 0) {
                const powerColors = ['#00ff00', '#ffff00', '#ff00ff'];
                drawPixelRect(player.x - 2, player.y - 8, player.width + 4, 3, powerColors[player.powerup]);
            }
        }

        // 绘制敌人
        function drawEnemies() {
            enemies.forEach(enemy => {
                if (enemy.alive) {
                    // 根据血量计算透明度
                    const alpha = enemy.hp / enemy.maxHp;
                    const color = enemy.color;
                    
                    drawPixelRect(enemy.x, enemy.y, enemy.width, enemy.height, color);
                    
                    // 敌人细节
                    drawPixelRect(enemy.x + 5, enemy.y - 3, 15, 3, color);
                    drawPixelRect(enemy.x + 2, enemy.y + 20, 5, 5, color);
                    drawPixelRect(enemy.x + 18, enemy.y + 20, 5, 5, color);
                    
                    // 血量条
                    if (enemy.hp < enemy.maxHp) {
                        const barWidth = enemy.width;
                        const barHeight = 3;
                        drawPixelRect(enemy.x, enemy.y - 8, barWidth, barHeight, '#333');
                        drawPixelRect(enemy.x, enemy.y - 8, barWidth * (enemy.hp / enemy.maxHp), barHeight, '#00ff00');
                    }
                }
            });
        }

        // 绘制子弹
        function drawBullets() {
            bullets.forEach(bullet => {
                const color = bullet.type === 'power' ? '#ff00ff' : '#ffff00';
                drawPixelRect(bullet.x, bullet.y, 3, 8, color);
                
                // 子弹尾迹
                if (bullet.type === 'power') {
                    drawPixelRect(bullet.x, bullet.y + 8, 3, 4, '#aa00aa');
                }
            });
            
            enemyBullets.forEach(bullet => {
                drawPixelRect(bullet.x, bullet.y, 3, 8, '#ff0000');
            });
        }
        
        // 绘制道具
        function drawPowerups() {
            powerups.forEach(powerup => {
                const colors = {
                    'double': '#ffff00',
                    'triple': '#ff00ff', 
                    'shield': '#00ffff',
                    'life': '#00ff00'
                };
                
                drawPixelRect(powerup.x, powerup.y, powerup.width, powerup.height, colors[powerup.type]);
                
                // 道具图标
                ctx.fillStyle = '#000';
                ctx.font = '10px Courier';
                ctx.textAlign = 'center';
                const text = powerup.type === 'double' ? '2x' : 
                           powerup.type === 'triple' ? '3x' :
                           powerup.type === 'shield' ? 'S' : '+';
                ctx.fillText(text, powerup.x + powerup.width/2, powerup.y + powerup.height/2 + 3);
            });
        }
        
        // 绘制特效
        function drawEffects() {
            explosions.forEach(explosion => {
                const colors = ['#ffff00', '#ff8800', '#ff0000', '#880000'];
                const colorIndex = Math.floor(explosion.life / (explosion.maxLife / 4));
                const color = colors[Math.min(colorIndex, 3)];
                
                const size = explosion.size * (explosion.life / explosion.maxLife);
                drawPixelRect(
                    explosion.x - size/2, 
                    explosion.y - size/2, 
                    size, size, color
                );
            });
            
            particles.forEach(particle => {
                drawPixelRect(particle.x, particle.y, 2, 2, particle.color);
            });
        }

        // 更新游戏逻辑
        function update() {
            if (!gameRunning) return;

            // 移动玩家
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                player.x = Math.max(0, player.x - player.speed);
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                player.x = Math.min(canvas.width - player.width, player.x + player.speed);
            }
            
            // 更新无敌状态
            if (player.invulnerable > 0) {
                player.invulnerable--;
            }
            
            // 更新强化持续时间
            if (player.powerup > 0 && Math.random() < 0.002) {
                player.powerup = Math.max(0, player.powerup - 1);
            }
            
            if (player.shield > 0 && Math.random() < 0.001) {
                player.shield--;
            }
            
            // 移动敌人
            updateEnemyMovement();

            // 更新子弹
            bullets = bullets.filter(bullet => {
                bullet.y -= 7;
                return bullet.y > 0;
            });

            enemyBullets = enemyBullets.filter(bullet => {
                bullet.y += 5;
                return bullet.y < canvas.height;
            });

            // 敌人射击 - 改进平衡性
            if (enemyShootCooldown > 0) {
                enemyShootCooldown--;
            }
            
            const aliveEnemies = enemies.filter(e => e.alive);
            const timeSinceWaveStart = Date.now() - waveStartTime;
            
            // 确保敌人完全进入屏幕且等待足够时间后才开始射击
            const enemiesInPosition = aliveEnemies.every(e => e.y >= 50); // 要求敌人更深入屏幕
            const bufferTime = wave === 1 ? 1500 : 4000; // 第一关1.5秒，后续关卡4秒缓冲
            
            if (aliveEnemies.length > 0 && enemiesInPosition && timeSinceWaveStart > bufferTime && enemyShootCooldown === 0) {
                // 基础射击频率，随敌人数量减少而略微增加
                const baseChance = enemyShootChance;
                const enemyCountFactor = Math.max(0.8, aliveEnemies.length / 50); // 调整因子
                const waveBonus = Math.min(wave * 0.03, 0.2); // 进一步减少关卡加成
                const finalChance = baseChance * (1 + waveBonus) * enemyCountFactor;
                
                if (Math.random() < finalChance) {
                    const shooter = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
                    enemyBullets.push({
                        x: shooter.x + shooter.width / 2,
                        y: shooter.y + shooter.height
                    });
                    
                    // 设置射击间隔，防止连续射击
                    enemyShootCooldown = Math.floor(Math.random() * 30) + 10;
                }
            }
            
            // 更新道具
            updatePowerups();
            
            // 更新特效
            updateEffects();

            // 碰撞检测 - 玩家子弹击中敌人
            bullets.forEach((bullet, bulletIndex) => {
                enemies.forEach((enemy, enemyIndex) => {
                    if (enemy.alive && 
                        bullet.x < enemy.x + enemy.width &&
                        bullet.x + 3 > enemy.x &&
                        bullet.y < enemy.y + enemy.height &&
                        bullet.y + 8 > enemy.y) {
                        
                        enemy.hp--;
                        bullets.splice(bulletIndex, 1);
                        
                        if (enemy.hp <= 0) {
                            enemy.alive = false;
                            score += enemy.points;
                            createExplosion(enemy.x + enemy.width/2, enemy.y + enemy.height/2);
                            
                            // 随机掉落道具
                            if (Math.random() < 0.15) {
                                createPowerup(enemy.x + enemy.width/2, enemy.y + enemy.height/2);
                            }
                        } else {
                            // 击中但未死亡的特效
                            createHitEffect(enemy.x + enemy.width/2, enemy.y + enemy.height/2);
                        }
                        
                        score += 2; // 击中奖励
                        scoreElement.textContent = score;
                    }
                });
            });

            // 碰撞检测 - 敌人子弹击中玩家
            if (player.invulnerable === 0) {
                enemyBullets.forEach((bullet, bulletIndex) => {
                    if (bullet.x < player.x + player.width &&
                        bullet.x + 3 > player.x &&
                        bullet.y < player.y + player.height &&
                        bullet.y + 8 > player.y) {
                        
                        enemyBullets.splice(bulletIndex, 1);
                        
                        if (player.shield > 0) {
                            player.shield--;
                            player.invulnerable = 60;
                            createExplosion(player.x + player.width/2, player.y + player.height/2, '#00ffff');
                        } else {
                            lives--;
                            player.invulnerable = 120;
                            document.getElementById('lives').textContent = lives;
                            createExplosion(player.x + player.width/2, player.y + player.height/2, '#ff0000');
                            
                            if (lives <= 0) {
                                gameOver();
                            }
                        }
                    }
                });
            }

            // 检查是否所有敌人都被消灭
            if (enemies.every(enemy => !enemy.alive)) {
                wave++;
                enemySpeed += 0.1; // 进一步减缓速度增长
                enemyDropDistance = Math.min(enemyDropDistance + 2, 25); // 下降距离逐渐增加但有上限
                enemyShootChance += 0.0005; // 大幅减缓射击频率增长
                
                document.getElementById('wave').textContent = wave;
                score += 100 * wave;
                scoreElement.textContent = score;
                
                // 等待一段时间再生成新敌人
                setTimeout(() => {
                    if (gameRunning) {
                        // 清理残留的敌人子弹和道具，给玩家一个干净的开始
                        enemyBullets = [];
                        powerups = [];
                        // 重置敌人移动方向和参数
                        enemyDirection = 1;
                        initEnemies();
                        waveStartTime = Date.now(); // 记录新关卡开始时间
                        enemyShootCooldown = 240; // 进一步增加初始缓冲时间
                    }
                }, 2500); // 进一步增加等待时间
            }

            // 检查敌人是否到达底部
            if (enemies.some(enemy => enemy.alive && enemy.y + enemy.height > canvas.height - 50)) {
                gameOver();
            }
            
            // 玩家与道具碰撞检测
            powerups.forEach((powerup, index) => {
                if (powerup.x < player.x + player.width &&
                    powerup.x + powerup.width > player.x &&
                    powerup.y < player.y + player.height &&
                    powerup.y + powerup.height > player.y) {
                    
                    collectPowerup(powerup);
                    powerups.splice(index, 1);
                }
            });
        }

        // 绘制游戏画面
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (gameRunning) {
                drawPlayer();
                drawEnemies();
                drawBullets();
                drawPowerups();
                drawEffects();
            }
        }

        // 游戏循环
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // 敌人移动机制
        function updateEnemyMovement() {
            let shouldDrop = false;
            const aliveEnemies = enemies.filter(e => e.alive);
            
            if (aliveEnemies.length === 0) return;
            
            // 如果敌人还在屏幕上方，让它们缓慢下降到正常位置
            const topEnemy = Math.min(...aliveEnemies.map(e => e.y));
            if (topEnemy < 30) {
                enemies.forEach(enemy => {
                    if (enemy.alive) {
                        enemy.y += 0.5; // 更加缓慢地进入
                    }
                });
                return; // 进入阶段不做横向移动
            }
            
            // 检查是否需要转向
            const leftmost = Math.min(...aliveEnemies.map(e => e.x));
            const rightmost = Math.max(...aliveEnemies.map(e => e.x + e.width));
            
            if ((enemyDirection > 0 && rightmost >= canvas.width - 10) ||
                (enemyDirection < 0 && leftmost <= 10)) {
                enemyDirection *= -1;
                shouldDrop = true;
            }
            
            // 移动敌人
            enemies.forEach(enemy => {
                if (enemy.alive) {
                    if (shouldDrop) {
                        enemy.y += enemyDropDistance;
                    } else {
                        enemy.x += enemyDirection * enemySpeed;
                    }
                }
            });
            
            // 防止敌人过快接近玩家
            const lowestEnemy = Math.max(...aliveEnemies.map(e => e.y));
            if (lowestEnemy > canvas.height - 150) {
                // 如果敌人太接近底部，减慢所有移动
                enemySpeed = Math.max(enemySpeed * 0.8, 0.2);
                enemyDropDistance = Math.max(enemyDropDistance - 2, 5);
            }
        }
        
        // 道具系统
        function createPowerup(x, y) {
            const types = ['double', 'triple', 'shield', 'life'];
            const type = types[Math.floor(Math.random() * types.length)];
            
            powerups.push({
                x: x - 8,
                y: y,
                width: 16,
                height: 16,
                type: type,
                speed: 2
            });
        }
        
        function updatePowerups() {
            powerups = powerups.filter(powerup => {
                powerup.y += powerup.speed;
                return powerup.y < canvas.height;
            });
        }
        
        function collectPowerup(powerup) {
            switch(powerup.type) {
                case 'double':
                    player.powerup = Math.max(player.powerup, 1);
                    break;
                case 'triple':
                    player.powerup = 2;
                    break;
                case 'shield':
                    player.shield = Math.min(player.shield + 3, 5);
                    break;
                case 'life':
                    lives = Math.min(lives + 1, 5);
                    document.getElementById('lives').textContent = lives;
                    break;
            }
            
            // 特效
            createExplosion(powerup.x + powerup.width/2, powerup.y + powerup.height/2, '#00ff00');
        }
        
        // 特效系统
        function createExplosion(x, y, color = '#ffff00') {
            explosions.push({
                x: x,
                y: y,
                size: 20,
                life: 30,
                maxLife: 30,
                color: color
            });
            
            // 创建粒子
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 20,
                    color: color
                });
            }
        }
        
        function createHitEffect(x, y) {
            for (let i = 0; i < 4; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 3,
                    vy: (Math.random() - 0.5) * 3,
                    life: 10,
                    color: '#ffffff'
                });
            }
        }
        
        function updateEffects() {
            explosions = explosions.filter(explosion => {
                explosion.life--;
                return explosion.life > 0;
            });
            
            particles = particles.filter(particle => {
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.life--;
                particle.vy += 0.1; // 重力
                return particle.life > 0;
            });
        }
        
        // 游戏结束
        function gameOver() {
            gameRunning = false;
            finalScoreElement.textContent = score;
            document.getElementById('finalWave').textContent = wave;
            gameOverElement.style.display = 'block';
        }

        // 重新开始游戏
        function restartGame() {
            gameRunning = true;
            score = 0;
            wave = 1;
            lives = 3;
            enemyDirection = 1;
            enemySpeed = 0.5;
            enemyDropDistance = 15; // 重置下降距离
            enemyShootChance = 0.002;
            
            scoreElement.textContent = score;
            document.getElementById('wave').textContent = wave;
            document.getElementById('lives').textContent = lives;
            gameOverElement.style.display = 'none';
            
            bullets = [];
            enemyBullets = [];
            powerups = [];
            explosions = [];
            particles = [];
            
            player.x = canvas.width / 2 - 15;
            player.powerup = 0;
            player.shield = 0;
            player.invulnerable = 0;
            
            waveStartTime = Date.now();
            enemyShootCooldown = 180; // 初始缓冲更长
            initEnemies();
        }

        // 射击
        function shoot() {
            if (!gameRunning) return;
            
            const now = Date.now();
            if (now - lastShotTime < shootCooldown) return;
            lastShotTime = now;
            
            if (player.powerup === 0) {
                // 单发
                bullets.push({
                    x: player.x + player.width / 2 - 1,
                    y: player.y,
                    type: 'normal'
                });
            } else if (player.powerup === 1) {
                // 双发
                bullets.push({
                    x: player.x + 5,
                    y: player.y,
                    type: 'power'
                });
                bullets.push({
                    x: player.x + player.width - 5,
                    y: player.y,
                    type: 'power'
                });
            } else if (player.powerup === 2) {
                // 三发
                bullets.push({
                    x: player.x + player.width / 2 - 1,
                    y: player.y,
                    type: 'power'
                });
                bullets.push({
                    x: player.x + 5,
                    y: player.y,
                    type: 'power'
                });
                bullets.push({
                    x: player.x + player.width - 5,
                    y: player.y,
                    type: 'power'
                });
            }
        }

        // 键盘事件
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === ' ' || e.key === 'Spacebar') {
                e.preventDefault();
                shoot();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // 触摸控制
        let touchStartX = 0;
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            touchStartX = e.touches[0].clientX;
            shoot();
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touchX = e.touches[0].clientX;
            const deltaX = touchX - touchStartX;
            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x + deltaX * 0.5));
            touchStartX = touchX;
        });

        canvas.addEventListener('click', shoot);

        // 虚拟按键控制
        function setupVirtualControls() {
            const leftBtn = document.getElementById('leftBtn');
            const rightBtn = document.getElementById('rightBtn');
            const shootBtn = document.getElementById('shootBtn');
            
            leftBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                keys['ArrowLeft'] = true;
            });
            leftBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                keys['ArrowLeft'] = false;
            });
            
            rightBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                keys['ArrowRight'] = true;
            });
            rightBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                keys['ArrowRight'] = false;
            });
            
            shootBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                shoot();
            });
            
            // 防止默认行为
            [leftBtn, rightBtn, shootBtn].forEach(btn => {
                btn.addEventListener('touchmove', (e) => e.preventDefault());
                btn.addEventListener('contextmenu', (e) => e.preventDefault());
            });
        }
        
        // 响应式画布
        function resizeCanvas() {
            const container = document.querySelector('.game-container');
            if (window.innerWidth <= 768) {
                const availableWidth = window.innerWidth - 10;
                const availableHeight = window.innerHeight - 162;
                canvas.width = Math.min(380, availableWidth);
                canvas.height = Math.min(availableHeight - 100, 400);
            } else {
                canvas.width = 420;
                canvas.height = Math.min(window.innerHeight - 200, 550);
            }
            
            // 重新定位玩家
            player.x = canvas.width / 2 - player.width / 2;
            player.y = canvas.height - 40;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        setupVirtualControls();

        // 初始化游戏
        player.x = canvas.width / 2 - player.width / 2;
        player.y = canvas.height - 40;
        initEnemies();
        gameLoop();

        // Footer 脚本
        document.addEventListener('DOMContentLoaded', () => {
            const tpl = document.getElementById('site-footer');
            if (tpl && 'content' in tpl) {
                document.body.appendChild(tpl.content.cloneNode(true));
            }

            document.querySelectorAll('.qr-wrapper').forEach(w => {
                const link = w.querySelector('.qr-link');
                const img = w.querySelector('.qr-img');
                if (link && img && link.dataset.img) {
                    img.src = link.dataset.img.trim();
                }
            });
        });
    </script>
</body>
</html>
