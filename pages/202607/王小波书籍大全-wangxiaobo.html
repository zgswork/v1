        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            const recommendBtn = document.getElementById('recommendBtn');
            const changeBtn = document.getElementById('changeBtn');
            const bookInfo = document.getElementById('bookInfo');
            const counter = document.getElementById('counter');
            
            let previousIndex = -1;
            let recommendationCount = 0;

            // 获取随机书籍
            function getRandomBook() {
                let randomIndex;
                // 确保不重复推荐同一本书
                do {
                    randomIndex = Math.floor(Math.random() * books.length);
                } while (randomIndex === previousIndex && books.length > 1);
                
                previousIndex = randomIndex;
                return books[randomIndex];
            }

            // 显示书籍信息
            function displayBook(book) {
                const stars = '★'.repeat(Math.floor(book.rating));
                const emptyStars = '☆'.repeat(5 - Math.floor(book.rating));
                
                bookInfo.innerHTML = `
                    <div class="book-title">${book.title}</div>
                    <div class="rating">
                        <span class="star">${stars}${emptyStars}</span>
                        <span> (推荐指数: ${book.rating.toFixed(1)})</span>
                    </div>
                    <div class="intro">${book.intro}</div>
                    <div class="recommendation">
                        <strong>推荐理由：</strong>${book.reason}
                    </div>
                `;
                
                recommendationCount++;
                counter.textContent = `已推荐: ${recommendationCount} 部作品`;
            }

            // 绑定推荐按钮点击事件
            recommendBtn.addEventListener('click', function() {
                const book = getRandomBook();
                displayBook(book);
                recommendBtn.style.display = 'none';
                changeBtn.style.display = 'inline-block';
            });

            // 绑定换一本书按钮点击事件
            changeBtn.addEventListener('click', function() {
                const book = getRandomBook();
                displayBook(book);
            });

            // 添加键盘快捷键支持
            document.addEventListener('keydown', function(event) {
                if (event.key === 'Enter' || event.key === ' ') {
                    if (recommendBtn.style.display !== 'none') {
                        recommendBtn.click();
                    } else {
                        changeBtn.click();
                    }
                }
            });
        });
    </script>
