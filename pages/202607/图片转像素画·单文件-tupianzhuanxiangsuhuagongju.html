<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>图片转像素画 · 单文件</title>
<style>
:root{--bg:#0f1320;--panel:#141a2b;--text:#e8ecf3;--muted:#9aa4b2;--line:#27314f;--brand:#2b6cff;--ok:#10b981}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Inter,Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{margin:0;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
@media (max-width:980px){.grid{grid-template-columns:repeat(6,1fr)}}
@media (max-width:680px){.grid{grid-template-columns:repeat(1,1fr)}}
.panel{grid-column:span 12;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 12px 28px rgba(0,0,0,.22)}
.controls{grid-column:span 4}
.preview{grid-column:span 8}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:8px}
label>span{display:inline-block;min-width:120px;color:var(--muted)}
input[type=file],select,input[type=number],input[type=range],input[type=color]{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:6px 10px}
input[type=range]{padding:0;height:28px}
.btn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--text);padding:9px 12px;border-radius:12px;cursor:pointer}
.btn.brand{background:var(--brand);border-color:transparent;color:#fff}
.btn.ok{background:var(--ok);border-color:transparent;color:#07261b}
.pill{font-size:12px;padding:3px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.canvasBox{position:relative;background:#0003;border:1px solid var(--line);border-radius:12px;overflow:hidden}
canvas{max-width:100%;display:block;image-rendering: pixelated;}
#gridToggle:checked+label+canvas{outline:1px solid #ffffff55}
.grid-overlay{position:absolute;inset:0;pointer-events:none;background-size:var(--gs) var(--gs), var(--gs) var(--gs);background-image:linear-gradient(to right, #fff3 1px, transparent 1px),linear-gradient(to bottom, #fff3 1px, transparent 1px);opacity:.7}
.small{font-size:12px;color:var(--muted)}
hr{border:none;border-top:1px solid var(--line);margin:10px 0}
.color-list{display:flex;flex-wrap:wrap;gap:6px}
.color-item{display:flex;align-items:center;gap:6px}
.color-item input[type=color]{width:36px;height:28px;padding:0;border-radius:8px}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>图片转像素画 <span class="pill">单文件</span></h1>
      <div class="row">
        <button class="btn" id="reset" disabled>重置</button>
        <button class="btn ok" id="save-png" disabled>下载 PNG</button>
        <button class="btn" id="save-svg" disabled>下载 SVG</button>
      </div>
    </header>

    <section class="grid">
      <!-- 控制区 -->
      <div class="panel controls">
        <div class="stack">
          <div class="row">
            <input type="file" id="file" accept="image/*" />
            <button class="btn brand" id="run" disabled>生成像素画</button>
          </div>
          <hr/>
          <div class="stack">
            <div><b>尺寸与缩放</b> <span class="small">（优先设置每行像素数量，等比缩放）</span></div>
            <div class="row">
              <label><span>像素宽度（列）</span><input type="number" id="pxw" value="64" min="8" max="512" style="width:100px"></label>
              <label><span>放大倍数</span><input type="number" id="scale" value="8" min="1" max="40" style="width:100px"></label>
              <label class="small">注：最终画布宽 = 列 × 倍数，高度按原图等比</label>
            </div>
          </div>
          <hr/>
          <div class="stack">
            <div><b>调色方案</b></div>
            <div class="row">
              <label><span>方式</span>
                <select id="pal-mode">
                  <option value="auto" selected>自动聚类（K-Means）</option>
                  <option value="gb">Game Boy（4色）</option>
                  <option value="nes">NES（8色示例）</option>
                  <option value="c64">C64（16色）</option>
                  <option value="pico8">PICO-8（16色）</option>
                  <option value="gray8">灰阶（8色）</option>
                  <option value="custom">自定义</option>
                </select>
              </label>
              <label id="kwrap"><span>颜色数量</span><input type="number" id="k" value="8" min="2" max="32" style="width:80px"></label>
              <label><span>抖动</span>
                <select id="dither">
                  <option value="none" selected>无</option>
                  <option value="fs">Floyd–Steinberg</option>
                </select>
              </label>
            </div>
            <div id="customPal" class="stack" style="display:none">
              <div class="row">
                <button class="btn" id="addColor">+ 添加颜色</button>
                <button class="btn" id="clearColor">清空</button>
              </div>
              <div class="color-list" id="colorList"></div>
            </div>
          </div>
          <hr/>
          <div class="stack">
            <div><b>网格与背景</b></div>
            <div class="row">
              <label><input type="checkbox" id="showGrid"/> 显示网格</label>
              <label><span>背景</span><input type="color" id="bg" value="#000000"></label>
              <label><span>网格尺寸</span><input type="number" id="gsize" value="8" min="2" max="60" style="width:80px"></label>
            </div>
          </div>
        </div>
      </div>

      <!-- 预览区 -->
      <div class="panel preview">
        <div class="toolbar small">左：原图（自动缩放） · 右：像素化结果（最近邻放大）。建议先设定“像素宽度”和“颜色数量”，再点击“生成”。</div>
        <div class="grid" style="grid-template-columns:1fr 1fr;gap:10px">
          <div class="canvasBox"><canvas id="cvSrc"></canvas></div>
          <div class="canvasBox" style="position:relative">
            <input type="checkbox" id="gridToggle" hidden>
            <label for="gridToggle" hidden></label>
            <canvas id="cvDst"></canvas>
            <div id="grid" class="grid-overlay" style="display:none"></div>
          </div>
        </div>
      </div>
    </section>
  </div>

<script>
// ====== 基础 ======
const $=(s,r=document)=>r.querySelector(s); const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const cvS=$('#cvSrc'), ctxS=cvS.getContext('2d');
const cvD=$('#cvDst'), ctxD=cvD.getContext('2d');
let img=null, origW=0, origH=0;

function setSrcCanvas(w,h){ cvS.width=w; cvS.height=h; cvS.style.width='100%'; }
function setDstCanvas(w,h){ cvD.width=w; cvD.height=h; cvD.style.width='100%'; }

function drawSrcFit(){ if(!img) return; // 将原图按宽度适配源画布
  const max = 640; const scale = Math.min(1, max/img.width); setSrcCanvas(Math.round(img.width*scale), Math.round(img.height*scale)); ctxS.clearRect(0,0,cvS.width,cvS.height); ctxS.drawImage(img,0,0,cvS.width,cvS.height);
}

$('#file').addEventListener('change', e=>{
  const f=e.target.files?.[0]; if(!f) return; const url=URL.createObjectURL(f);
  img=new Image(); img.onload=()=>{ origW=img.width; origH=img.height; drawSrcFit(); $('#run').disabled=false; $('#reset').disabled=false; URL.revokeObjectURL(url); };
  img.src=url;
});
$('#reset').onclick=()=>{ if(!img) return; drawSrcFit(); ctxD.clearRect(0,0,cvD.width,cvD.height); $('#save-png').disabled=true; $('#save-svg').disabled=true; };

// ====== 工具函数 ======
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist2=(a,b)=>{const dr=a[0]-b[0],dg=a[1]-b[1],db=a[2]-b[2]; return dr*dr+dg*dg+db*db};
function nearestColor(c,pal){ let best=0, bv=1e20; for(let i=0;i<pal.length;i++){ const v=dist2(c,pal[i]); if(v<bv){bv=v; best=i;} } return pal[best]; }

// 固定调色板集合（RGB）
const PAL={
  gb:[[15,56,15],[48,98,48],[139,172,15],[155,188,15]],
  nes:[[84,84,84],[0,30,116],[8,16,144],[48,0,136],[68,0,100],[92,0,48],[84,4,0],[60,24,0]],
  c64:[[0,0,0],[255,255,255],[136,0,0],[170,255,238],[204,68,204],[0,204,85],[0,0,170],[238,238,119],[221,136,85],[102,68,0],[255,119,119],[51,51,51],[119,119,119],[170,255,102],[0,136,255],[187,187,187]],
  pico8:[[0,0,0],[29,43,83],[126,37,83],[0,135,81],[171,82,54],[95,87,79],[194,195,199],[255,241,232],[255,0,77],[255,163,0],[255,236,39],[0,228,54],[41,173,255],[131,118,156],[255,119,168],[255,204,170]],
  gray8:[[0,0,0],[36,36,36],[72,72,72],[108,108,108],[144,144,144],[180,180,180],[216,216,216],[252,252,252]]
};

// K-Means 生成调色板
function kmeansPalette(imgData,k){
  const {width:w,height:h,data:d}=imgData; const step=Math.max(1, Math.floor(Math.max(w,h)/256));
  const pts=[]; for(let y=0;y<h;y+=step){ for(let x=0;x<w;x+=step){ const i=(y*w+x)*4; pts.push([d[i],d[i+1],d[i+2]]); }}
  const centers=[]; for(let i=0;i<k;i++){ centers.push(pts[(Math.random()*pts.length)|0].slice()); }
  let changed=true, iter=0; const maxIter=16; const label=new Array(pts.length).fill(0);
  while(changed && iter++<maxIter){ changed=false; for(let i=0;i<pts.length;i++){ let best=0,bv=1e20; for(let c=0;c<k;c++){ const v=dist2(pts[i],centers[c]); if(v<bv){bv=v;best=c;} } if(label[i]!==best){label[i]=best; changed=true;} }
    const sum=Array.from({length:k},()=>[0,0,0,0]); for(let i=0;i<pts.length;i++){ const l=label[i]; sum[l][0]+=pts[i][0]; sum[l][1]+=pts[i][1]; sum[l][2]+=pts[i][2]; sum[l][3]++; }
    for(let c=0;c<k;c++){ if(sum[c][3]>0) centers[c]=[sum[c][0]/sum[c][3]|0, sum[c][1]/sum[c][3]|0, sum[c][2]/sum[c][3]|0]; }
  }
  return centers;
}

// Floyd–Steinberg 抖动
function ditherFS(srcW,srcH,arr,pal){
  // arr 为长为 w*h*3 的 RGB 数组
  const out=new Uint8ClampedArray(arr); const iof=(x,y)=> (y*srcW+x)*3;
  for(let y=0;y<srcH;y++){
    for(let x=0;x<srcW;x++){
      const i=iof(x,y); const old=[out[i],out[i+1],out[i+2]]; const nq=nearestColor(old,pal); out[i]=nq[0]; out[i+1]=nq[1]; out[i+2]=nq[2];
      const err=[old[0]-nq[0], old[1]-nq[1], old[2]-nq[2]];
      const spread=(xx,yy,f)=>{ if(xx<0||xx>=srcW||yy<0||yy>=srcH) return; const j=iof(xx,yy); out[j]=clamp(out[j]+err[0]*f,0,255); out[j+1]=clamp(out[j+1]+err[1]*f,0,255); out[j+2]=clamp(out[j+2]+err[2]*f,0,255); };
      spread(x+1,y,7/16); spread(x-1,y+1,3/16); spread(x,y+1,5/16); spread(x+1,y+1,1/16);
    }
  }
  return out;
}

// 主流程：像素化
async function pixelate(){ if(!img) return;
  const pxW = clamp(+$('#pxw').value||64, 8, 512); const scale = clamp(+$('#scale').value||8,1,40);
  // 计算小图尺寸（按宽设列数等比）
  const ratio = img.height/img.width; const smallW = pxW; const smallH = Math.max(1, Math.round(pxW*ratio));
  // 将原图缩到小图
  const small=document.createElement('canvas'); small.width=smallW; small.height=smallH; const sctx=small.getContext('2d', {willReadFrequently:true});
  sctx.imageSmoothingEnabled=true; sctx.drawImage(img,0,0,smallW,smallH);
  const sdata=sctx.getImageData(0,0,smallW,smallH);
  // 准备调色板
  let pal=[]; const mode=$('#pal-mode').value; const k=clamp(+$('#k').value||8,2,32);
  if(mode==='auto'){ pal = kmeansPalette(sdata,k); }
  else if(mode==='custom'){ pal = $$('#colorList input[type=color]').map(i=>hex2rgb(i.value)); if(pal.length===0) { alert('请添加至少一个自定义颜色'); return; } }
  else { pal = PAL[mode]; }
  // 抖动与量化
  const rgbArr=new Uint8ClampedArray(smallW*smallH*3); for(let i=0,j=0;i<sdata.data.length;i+=4){ rgbArr[j++]=sdata.data[i]; rgbArr[j++]=sdata.data[i+1]; rgbArr[j++]=sdata.data[i+2]; }
  let quanted = ($('#dither').value==='fs') ? ditherFS(smallW,smallH,rgbArr,pal) : rgbArr;
  // 写回小图像素
  for(let i=0,j=0;i<sdata.data.length;i+=4){ const c = ($('#dither').value==='fs') ? [quanted[j++],quanted[j++],quanted[j++]] : nearestColor([rgbArr[j++],rgbArr[j++],rgbArr[j++]], pal); sdata.data[i]=c[0]; sdata.data[i+1]=c[1]; sdata.data[i+2]=c[2]; sdata.data[i+3]=255; }
  sctx.putImageData(sdata,0,0);
  // 放大到目标画布（最近邻）
  const bigW = smallW*scale, bigH = smallH*scale; setDstCanvas(bigW,bigH); ctxD.imageSmoothingEnabled=false; ctxD.fillStyle=$('#bg').value; ctxD.fillRect(0,0,bigW,bigH); ctxD.drawImage(small,0,0,bigW,bigH);
  // 网格
  const grid=$('#grid'); if($('#showGrid').checked){ grid.style.display='block'; grid.style.setProperty('--gs', scale+'px'); } else { grid.style.display='none'; }
  $('#save-png').disabled=false; $('#save-svg').disabled=false;
}

$('#run').onclick=pixelate;
$('#pxw,#scale,#pal-mode,#k,#dither,#bg,#showGrid,#gsize').forEach?.call ? $('#pxw') : null; // no-op
$$('#pxw,#scale,#pal-mode,#k,#dither,#bg,#showGrid,#gsize').forEach(el=>el.addEventListener('change',()=>{ if(cvD.width) pixelate(); }));

// 自定义调色板 UI
$('#pal-mode').addEventListener('change',()=>{
  const mode=$('#pal-mode').value; $('#kwrap').style.display = (mode==='auto')?'inline-block':'none'; $('#customPal').style.display = (mode==='custom')?'block':'none';
});
$('#addColor').onclick=()=>{ const wrap=document.createElement('div'); wrap.className='color-item'; const c=document.createElement('input'); c.type='color'; c.value='#ff00ff'; const del=document.createElement('button'); del.className='btn'; del.textContent='—'; del.onclick=()=>wrap.remove(); wrap.append(c,del); $('#colorList').append(wrap); };
$('#clearColor').onclick=()=>$('#colorList').innerHTML='';

// 导出
$('#save-png').onclick=()=>{ cvD.toBlob(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='pixel_art.png'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500); },'image/png'); };
$('#save-svg').onclick=()=>{ // 每个像素一个矩形
  const scale=+$('#scale').value||8; const w=cvD.width/scale, h=cvD.height/scale; const sctx=document.createElement('canvas').getContext('2d');
  // 取回小图像素
  const small=document.createElement('canvas'); small.width=w; small.height=h; const t=small.getContext('2d'); t.imageSmoothingEnabled=false; t.drawImage(cvD,0,0,w,h); const im=t.getImageData(0,0,w,h).data;
  let svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges">`;
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const i=(y*w+x)*4; const r=im[i],g=im[i+1],b=im[i+2],a=im[i+3]/255; if(a===0) continue; svg+=`<rect x="${x}" y="${y}" width="1" height="1" fill="rgba(${r},${g},${b},${a.toFixed(3)})"/>`; }
  }
  svg+='</svg>';
  const blob=new Blob([svg],{type:'image/svg+xml'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='pixel_art.svg'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500);
};

// 辅助：HEX 转 RGB
function hex2rgb(h){ h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]; }
</script>
</body>
</html>
