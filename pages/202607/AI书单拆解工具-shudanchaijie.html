    // DOM元素
    const bookTitleInput = document.getElementById('book-title');
    const analyzeBtn = document.getElementById('analyze-btn');
    const bookList = document.getElementById('book-list');
    const bookModal = document.getElementById('book-modal');
    const modalContent = document.getElementById('modal-content');
    const modalTitle = document.getElementById('modal-title');
    const closeModal = document.getElementById('close-modal');
    const importBtn = document.getElementById('import-btn');

    // 初始化页面
    function init() {
      const savedBooks = JSON.parse(localStorage.getItem('feynmanBooks')) || sampleBooks;
      localStorage.setItem('feynmanBooks', JSON.stringify(savedBooks));
      renderBookList(savedBooks);
      setupEventListeners();
    }

    // 设置事件监听器
    function setupEventListeners() {
      analyzeBtn.addEventListener('click', analyzeBook);
      closeModal.addEventListener('click', () => bookModal.classList.add('hidden'));
      bookModal.addEventListener('click', (e) => {
        if (e.target === bookModal) bookModal.classList.add('hidden');
      });
      importBtn.addEventListener('click', importBooks);
    }

    // 调用豆包AI分析书籍
    async function analyzeWithDoubao(title) {
      try {
        const response = await fetch('https://api.doubao.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${DOUBAO_API_KEY}`
          },
          body: JSON.stringify({
            model: 'doubao-pro',
            messages: [
              {
                role: 'system',
                content: '你是一个书籍分析专家，请分析以下书籍并返回结构化的学习指南'
              },
              {
                role: 'user',
                content: `请分析《${title}》这本书，并提供以下内容：
                1. 详细的书籍简介
                2. 主要章节结构
                3. 核心概念和知识点
                4. 学习目标
                5. 适合的学习方法
                6. 难度评估和预计学习时间
                7. 必备的前置知识
                8. 实践建议和项目`
              }
            ]
          })
        });
        
        if (!response.ok) throw new Error('豆包AI调用失败');
        
        const data = await response.json();
        return data.choices[0].message.content;
      } catch (error) {
        console.error('豆包AI分析错误:', error);
        return null;
      }
    }

    // 分析书籍
    async function analyzeBook() {
      const title = bookTitleInput.value.trim();
      if (!title) return;
      
      bookTitleInput.value = '';
      bookList.innerHTML = `
        <div class="col-span-full text-center py-12">
          <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary mx-auto mb-4"></div>
          <p>正在使用豆包AI分析书籍：${title}</p>
          <p class="text-sm text-gray-500 mt-2">AI正在提取书籍信息和知识结构</p>
        </div>
      `;
      
      const aiResult = await analyzeWithDoubao(title);
      
      if (aiResult) {
        // 这里可以解析AI返回的结构化数据
        // 为简化，我们先创建一个基础书籍对象
        const newBook = {
          id: Date.now(),
          title: title,
          author: "AI分析中",
          publisher: "未知",
          year: new Date().getFullYear(),
          category: "AI分析中",
          difficulty: "中级",
          estimatedTime: "6周",
          prerequisites: ["基础知识"],
          coverUrl: `https://picsum.photos/seed/${title}/300/400`,
          description: aiResult.substring(0, 200) + "...",
          chapters: [
            { id: 1, title: "第1章 引言", keyConcepts: ["基础概念", "背景介绍"] },
            { id: 2, title: "第2章 核心原理", keyConcepts: ["基本原理", "理论框架"] }
          ],
          keyConcepts: ["概念1", "概念2", "概念3"],
          learningGoals: [
            "理解本书的核心概念和理论框架",
            "掌握书中介绍的方法和技巧"
          ]
        };
        
        const books = JSON.parse(localStorage.getItem('feynmanBooks')) || [];
        books.push(newBook);
        localStorage.setItem('feynmanBooks', JSON.stringify(books));
        renderBookList(books);
      } else {
        bookList.innerHTML = `
          <div class="col-span-full text-center py-12 text-red-500">
            <i class="fa fa-exclamation-circle text-4xl mb-4"></i>
            <p>AI分析失败，请稍后重试</p>
          </div>
        `;
      }
    }

    // 渲染书单列表
    function renderBookList(books) {
      if (!books.length) {
        bookList.innerHTML = `
          <div class="col-span-full text-center py-12 text-gray-500">
            <i class="fa fa-book-open text-4xl mb-4"></i>
            <p>尚未添加任何书籍</p>
            <p class="mt-2">输入书名并分析，开始构建你的学习书单</p>
          </div>
        `;
        return;
      }
      
      bookList.innerHTML = '';
      
      books.forEach(book => {
        const bookCard = document.createElement('div');
        bookCard.className = 'bg-white rounded-xl shadow-md overflow-hidden card-hover';
        bookCard.innerHTML = `
          <div class="md:flex">
            <div class="md:flex-shrink-0 md:w-1/3">
              <img class="h-48 w-full object-cover md:h-full md:w-full" src="${book.coverUrl}" alt="${book.title}">
            </div>
            <div class="p-6">
              <div class="flex justify-between items-start">
                <h3 class="text-lg font-medium text-gray-900">${book.title}</h3>
                <span class="px-2 py-1 text-xs font-medium rounded-full ${getDifficultyColor(book.difficulty)}">
                  ${book.difficulty}
                </span>
              </div>
              <p class="mt-1 text-sm text-gray-500">${book.author}</p>
              <div class="mt-4">
                <div class="flex items-center text-sm text-gray-500">
                  <i class="fa fa-clock-o mr-1"></i>
                  <span>预计学习：${book.estimatedTime}</span>
                </div>
                <div class="flex items-center text-sm text-gray-500 mt-1">
                  <i class="fa fa-folder-o mr-1"></i>
                  <span>${book.category}</span>
                </div>
              </div>
              <div class="mt-4 flex space-x-2">
                <button class="view-details bg-primary hover:bg-primary/90 text-white px-3 py-1 rounded text-sm transition-colors" data-id="${book.id}">
                  查看详情
                </button>
                <button class="start-learning bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded text-sm transition-colors" data-id="${book.id}">
                  <i class="fa fa-play-circle-o mr-1"></i> 开始学习
                </button>
              </div>
            </div>
          </div>
        `;
        
        bookList.appendChild(bookCard);
        
        bookCard.querySelector('.view-details').addEventListener('click', () => showBookDetails(book.id));
        bookCard.querySelector('.start-learning').addEventListener('click', () => startLearning(book.id));
      });
    }

    // 根据难度获取颜色类
    function getDifficultyColor(difficulty) {
      switch(difficulty.toLowerCase()) {
        case '初级': return 'bg-green-100 text-green-800';
        case '中级': return 'bg-yellow-100 text-yellow-800';
        case '高级': return 'bg-red-100 text-red-800';
        default: return 'bg-gray-100 text-gray-800';
      }
    }

    // 显示书籍详情

      let detailsHTML = `

                <p class="text-sm">${book.author}</p>

              <div>

              <div>

              </div>
              <div>

                <span class="px-2 py-1 text-xs font-medium rounded-full ${getDifficultyColor(book.difficulty)}">
                  ${book.difficulty}
                </span>
              </div>
              <div>
                <h4 class="text-sm font-medium text-gray-500">预计学习时间</h4>
                <p class="text-sm">${book.estimatedTime}</p>
              </div>
            </div>
          </div>
          
          <div class="md:col-span-2 space-y-6">
            <div>
              <h3 class="text-lg font-medium mb-2">书籍简介</h3>
              <p class="text-gray-700">${book.description || '暂无简介'}</p>
            </div>
            
            <div>
              <h3 class="text-lg font-medium mb-2">学习目标</h3>
              <ul class="space-y-2">
                ${book.learningGoals.map(goal => `
                  <li class="flex items-start">

                    <span>${goal}</span>
                  </li>
                `).join('')}
              </ul>
            </div>
            
            <div>
              <h3 class="text-lg font-medium mb-2">必备知识</h3>
              <div class="flex flex-wrap gap-2">
                ${book.prerequisites.map(prereq => `

                `).join('')}
              </div>
            </div>
            
            <div>
              <h3 class="text-lg font-medium mb-2">核心概念</h3>
              <div class="flex flex-wrap gap-2">
                ${book.keyConcepts.map(concept => `
                  <span class="px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-sm">
                    ${concept}
                  </span>
                `).join('')}
              </div>
            </div>
            
            <div>
              <h3 class="text-lg font-medium mb-2">章节概览</h3>
              <ul class="space-y-3">
                ${book.chapters.map(chapter => `
                  <li class="border-l-2 border-primary pl-3 py-1">
                    <div class="font-medium">${chapter.title}</div>
                    <div class="text-sm text-gray-600 mt-1">
                      ${chapter.keyConcepts.map(c => `<span class="bg-gray-100 px-2 py-0.5 rounded text-xs mr-1">${c}</span>`).join('')}
                    </div>
                  </li>
                `).join('')}
              </ul>
            </div>
          </div>
        </div>
        
        <div class="mt-8 flex justify-end">
          <button class="start-learning bg-primary hover:bg-primary/90 text-white px-6 py-3 rounded-lg transition-colors" data-id="${book.id}">
            <i class="fa fa-play-circle-o mr-2"></i> 开始学习之旅
          </button>
        </div>
      `;
      
      modalContent.innerHTML = detailsHTML;
      modalContent.querySelector('.start-learning').addEventListener('click', () => {
        startLearning(book.id);
        bookModal.classList.add('hidden');
      });
      
      bookModal.classList.remove('hidden');
    }

    // 开始学习
    function startLearning(bookId) {
      const books = JSON.parse(localStorage.getItem('feynmanBooks')) || [];
      const book = books.find(b => b.id === bookId);
      if (!book) return;
      
      alert(`开始学习《${book.title}》！\n\n我们将按照分析结果为你规划学习路径。`);
    }

    // 导入书单
    function importBooks() {
      alert('此功能将在后续版本中支持，可批量导入书籍信息！');
    }

    // 初始化应用
    document.addEventListener('DOMContentLoaded', init);
