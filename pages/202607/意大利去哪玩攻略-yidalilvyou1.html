                opening: "09:00-19:00"
            },
            {
                name: "科莫湖",
                description: "科莫湖是意大利最美丽的湖泊之一，以其倒金字塔形状和湖畔豪华别墅闻名。湖畔小镇贝拉焦被称为'科莫湖的明珠'，是著名的度假胜地。",
                address: "Lago di Como, 22100 Como CO, 意大利",
                transportation: "从米兰乘坐火车约1小时",
                ticket: "免费",
                opening: "全天开放"
            },
            {
                name: "阿西西圣方济各圣殿",
                description: "阿西西圣方济各圣殿是意大利最重要的宗教建筑之一，由上下两座教堂组成。教堂内有乔托创作的描述圣方济各生平的著名壁画系列。",
                address: "Piazza Inferiore di S. Francesco, 2, 06081 Assisi PG, 意大利",
                transportation: "从佩鲁贾乘坐巴士约30分钟",
                ticket: "免费",
                opening: "06:00-19:30（冬季至18:30）"
            },
            {
                name: "锡拉库萨考古公园",
                description: "锡拉库萨考古公园包含古希腊剧场、罗马圆形剧场和狄俄尼索斯之耳等遗址。公园内的古希腊剧场是西西里岛最大的古希腊剧场，至今仍用于演出。",
                address: "Via del Teatro Greco, 1, 96100 Siracusa SR, 意大利",
                transportation: "从卡塔尼亚乘坐火车约1小时",
                ticket: "10欧元",
                opening: "09:00-19:00（冬季至17:00）"
            }
        ];

        // 获取DOM元素
        const guideDisplay = document.getElementById('guideDisplay');
        const getGuideBtn = document.getElementById('getGuideBtn');
        const changeGuideBtn = document.getElementById('changeGuideBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const modal = document.getElementById('downloadModal');
        const span = document.getElementsByClassName('close')[0];

        // 记录已显示的景点索引
        let shownIndices = [];

        // 获取随机景点
        function getRandomAttraction() {
            if (shownIndices.length === attractions.length) {
                shownIndices = []; // 如果所有景点都已显示过，重置
            }
            
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * attractions.length);
            } while (shownIndices.includes(randomIndex));
            
            shownIndices.push(randomIndex);
            return attractions[randomIndex];
        }

        // 显示景点攻略
        function displayAttraction(attraction) {
            guideDisplay.innerHTML = `
                <div class="guide-item">
                    <h2>${attraction.name}</h2>
                </div>
                <div class="guide-item">
                    <h3>景点介绍</h3>
                    <p>${attraction.description}</p>
                </div>
                <div class="guide-item">
                    <h3>景点地址</h3>
                    <p>${attraction.address}</p>
                </div>
                <div class="guide-item">
                    <h3>交通工具</h3>
                    <p>${attraction.transportation}</p>
                </div>
                <div class="guide-item">
                    <h3>门票信息</h3>
                    <p>${attraction.ticket}</p>
                </div>
                <div class="guide-item">
                    <h3>开放时间</h3>
                    <p>${attraction.opening}</p>
                </div>
            `;
        }

        // 按钮事件监听
        getGuideBtn.addEventListener('click', function() {
            const attraction = getRandomAttraction();
            displayAttraction(attraction);
            getGuideBtn.style.display = 'none';
            changeGuideBtn.style.display = 'block';
        });

        changeGuideBtn.addEventListener('click', function() {
            const attraction = getRandomAttraction();
            displayAttraction(attraction);
        });

        // 下载按钮事件监听
        downloadBtn.onclick = function() {
            modal.style.display = "block";
        }

        span.onclick = function() {
            modal.style.display = "none";
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>
</body>
</html>
