<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI计算工具（中国标准）</title>
    <style>
        :root {
            --primary-color: #4a6fa5;
            --secondary-color: #6b8cbc;
            --light-color: #e8f1f8;
            --dark-color: #3a5a7a;
            --shadow: 8px 8px 15px #c9d3e0, -8px -8px 15px #ffffff;
            --inner-shadow: inset 3px 3px 5px #c9d3e0, inset -3px -3px 5px #ffffff;
            --text-color: #333;
            --border-radius: 15px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #e0e5ec;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: #e0e5ec;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 10px;
            font-weight: 600;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .card {
            background-color: #e0e5ec;
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-row {
            display: flex;
            gap: 15px;
        }

        .input-field {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--dark-color);
        }

        input {
            padding: 12px 15px;
            border: none;
            background-color: #e0e5ec;
            border-radius: var(--border-radius);
            box-shadow: var(--inner-shadow);
            font-size: 16px;
            color: var(--text-color);
            outline: none;
        }

        input:focus {
            box-shadow: inset 3px 3px 5px #c9d3e0, inset -3px -3px 5px #ffffff, 0 0 0 2px var(--secondary-color);
        }

        button {
            padding: 12px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            box-shadow: 5px 5px 10px #c9d3e0, -5px -5px 10px #ffffff;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
            box-shadow: var(--inner-shadow);
        }

        .result {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            border-radius: var(--border-radius);
            background-color: #e0e5ec;
            box-shadow: var(--inner-shadow);
        }

        .bmi-value {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        .bmi-category {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .advice {
            font-size: 16px;
            line-height: 1.6;
            text-align: left;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: var(--border-radius);
            margin-top: 15px;
        }

        .advice-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--dark-color);
        }

        .history {
            max-height: 300px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 15px;
            margin-bottom: 10px;
            background-color: #e0e5ec;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        .history-item-info {
            display: flex;
            flex-direction: column;
        }

        .history-item-value {
            font-weight: 600;
            color: var(--primary-color);
        }

        .history-item-date {
            font-size: 12px;
            color: #666;
        }

        .clear-btn {
            background-color: #e74c3c;
            margin-top: 15px;
        }

        .clear-btn:hover {
            background-color: #c0392b;
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #e0e5ec;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--secondary-color);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-color);
        }

        /* 响应式设计 */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            .input-row {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>BMI计算工具（中国标准）</h1>
        
        <div class="card">
            <div class="input-group">
                <div class="input-row">
                    <div class="input-field">
                        <label for="height">身高 (cm)</label>
                        <input type="number" id="height" placeholder="请输入身高" min="100" max="250">
                    </div>
                    <div class="input-field">
                        <label for="weight">体重 (kg)</label>
                        <input type="number" id="weight" placeholder="请输入体重" min="20" max="200">
                    </div>
                </div>
                <button id="calculate-btn">计算BMI</button>
            </div>
            
            <div id="result" class="result" style="display: none;">
                <div class="bmi-value" id="bmi-value"></div>
                <div class="bmi-category" id="bmi-category"></div>
                <div id="advice" class="advice" style="display: none;">
                    <div class="advice-title">健康建议：</div>
                    <div id="advice-content"></div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <h2 style="margin-bottom: 15px; color: var(--primary-color);">历史记录</h2>
            <div id="history" class="history"></div>
            <button id="clear-btn" class="clear-btn">清除历史记录</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const heightInput = document.getElementById('height');
            const weightInput = document.getElementById('weight');
            const calculateBtn = document.getElementById('calculate-btn');
            const resultDiv = document.getElementById('result');
            const bmiValue = document.getElementById('bmi-value');
            const bmiCategory = document.getElementById('bmi-category');
            const historyDiv = document.getElementById('history');
            const clearBtn = document.getElementById('clear-btn');
            const adviceDiv = document.getElementById('advice');
            const adviceContent = document.getElementById('advice-content');
            
            // 从本地存储加载历史记录
            let history = JSON.parse(localStorage.getItem('bmiHistory')) || [];
            renderHistory();
            
            // 计算BMI
            function calculateAndDisplayBMI() {
                const height = parseFloat(heightInput.value);
                const weight = parseFloat(weightInput.value);
                
                if (isNaN(height) || isNaN(weight)) {
                    alert('请输入有效的身高和体重');
                    return;
                }
                
                if (height < 100 || height > 250) {
                    alert('身高应在100-250cm之间');
                    return;
                }
                
                if (weight < 20 || weight > 200) {
                    alert('体重应在20-200kg之间');
                    return;
                }
                
                const bmi = calculateBMI(height, weight);
                const category = getBMICategory(bmi);
                const advice = getHealthAdvice(bmi);
                
                displayResult(bmi, category, advice);
                
                // 添加到历史记录
                addToHistory(height, weight, bmi, category);
            }
            
            // 计算BMI函数
            function calculateBMI(height, weight) {
                const heightInMeters = height / 100;
                return weight / (heightInMeters * heightInMeters);
            }
            
            // 根据中国标准获取BMI分类
            function getBMICategory(bmi) {
                if (bmi < 18.5) return '偏瘦';
                if (bmi >= 18.5 && bmi < 24) return '正常';
                if (bmi >= 24 && bmi < 28) return '超重';
                return '肥胖';
            }
            
            // 获取健康建议
            function getHealthAdvice(bmi) {
                if (bmi < 18.5) {
                    return {
                        title: '增重建议',
                        content: [
                            '增加热量摄入：选择营养密度高的食物如坚果、鳄梨、全脂乳制品',
                            '增加蛋白质摄入：鸡蛋、瘦肉、鱼类、豆类',
                            '力量训练：结合力量训练增加肌肉质量',
                            '少食多餐：每天5-6餐，避免饱腹感过强',
                            '健康零食：坚果、干果、奶酪等高热量零食'
                        ]
                    };
                } else if (bmi >= 18.5 && bmi < 24) {
                    return {
                        title: '保持健康',
                        content: [
                            '均衡饮食：保持蔬菜、水果、全谷物、蛋白质的均衡摄入',
                            '规律运动：每周至少150分钟中等强度有氧运动',
                            '控制加工食品：限制高糖、高盐、高脂肪的加工食品',
                            '充足水分：每天至少喝8杯水',
                            '保持作息：规律作息有助于维持健康体重'
                        ]
                    };
                } else if (bmi >= 24 && bmi < 28) {
                    return {
                        title: '减重建议',
                        content: [
                            '控制热量：减少每日摄入热量300-500卡路里',
                            '增加纤维：多吃蔬菜、水果和全谷物增加饱腹感',
                            '减少精制碳水：限制白面包、白米饭、甜食等高GI食物',
                            '有氧运动：每周至少150-300分钟中等强度有氧运动',
                            '力量训练：每周2-3次力量训练保持肌肉量'
                        ]
                    };
                } else {
                    return {
                        title: '健康减重建议',
                        content: [
                            '咨询专业人士：建议咨询医生或营养师制定个性化计划',
                            '控制饮食：减少高热量食物，增加蔬菜和蛋白质摄入',
                            '循序渐进运动：从低强度运动开始，逐渐增加运动量',
                            '行为改变：记录饮食日记，识别不良饮食习惯',
                            '长期坚持：设定合理目标，每周减重0.5-1公斤为宜'
                        ]
                    };
                }
            }
            
            // 显示结果
            function displayResult(bmi, category, advice) {
                bmiValue.textContent = `BMI: ${bmi.toFixed(1)}`;
                bmiCategory.textContent = `分类: ${category}`;
                
                // 根据BMI值设置不同的颜色
                if (bmi < 18.5) {
                    bmiValue.style.color = '#3498db'; // 偏瘦 - 蓝色
                    bmiCategory.style.color = '#3498db';
                } else if (bmi >= 18.5 && bmi < 24) {
                    bmiValue.style.color = '#2ecc71'; // 正常 - 绿色
                    bmiCategory.style.color = '#2ecc71';
                } else if (bmi >= 24 && bmi < 28) {
                    bmiValue.style.color = '#f39c12'; // 超重 - 橙色
                    bmiCategory.style.color = '#f39c12';
                } else {
                    bmiValue.style.color = '#e74c3c'; // 肥胖 - 红色
                    bmiCategory.style.color = '#e74c3c';
                }
                
                // 显示健康建议
                adviceContent.innerHTML = `
                    <p><strong>${advice.title}</strong></p>
                    <ul>
                        ${advice.content.map(item => `<li>${item}</li>`).join('')}
                    </ul>
                `;
                
                resultDiv.style.display = 'block';
                adviceDiv.style.display = 'block';
            }
            
            // 添加到历史记录
            function addToHistory(height, weight, bmi, category) {
                const record = {
                    height: height,
                    weight: weight,
                    bmi: bmi.toFixed(1),
                    category: category,
                    date: new Date().toLocaleString()
                };
                
                history.unshift(record); // 添加到开头
                if (history.length > 10) {
                    history = history.slice(0, 10); // 限制最多10条记录
                }
                
                localStorage.setItem('bmiHistory', JSON.stringify(history));
                renderHistory();
            }
            
            // 清除历史记录
            function clearHistory() {
                if (confirm('确定要清除所有历史记录吗？')) {
                    history = [];
                    localStorage.removeItem('bmiHistory');
                    renderHistory();
                }
            }
            
            // 渲染历史记录
            function renderHistory() {
                if (history.length === 0) {
                    historyDiv.innerHTML = '<p style="text-align: center; color: #666;">暂无历史记录</p>';
                    return;
                }
                
                historyDiv.innerHTML = '';
                history.forEach(record => {
                    const item = document.createElement('div');
                    item.className = 'history-item';
                    item.innerHTML = `
                        <div class="history-item-info">
                            <span>身高: ${record.height}cm / 体重: ${record.weight}kg</span>
                            <span class="history-item-date">${record.date}</span>
                        </div>
                        <div>
                            <span class="history-item-value">${record.bmi}</span>
                            <span>${record.category}</span>
                        </div>
                    `;
                    historyDiv.appendChild(item);
                });
            }
            
            // 事件监听器
            calculateBtn.addEventListener('click', calculateAndDisplayBMI);
            clearBtn.addEventListener('click', clearHistory);
            
            // 按键事件 - 优化后的版本
            [heightInput, weightInput].forEach(input => {
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault(); // 防止表单提交
                        calculateAndDisplayBMI();
                    }
                });
            });
        });
    </script>
</body>
</html>
