<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XML转换工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f8f9fa;
            padding: 20px;
            color: #2c3e50;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border: 1px solid #e9ecef;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            padding: 40px;
            background: white;
        }

        .tool-tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            background: #f8f9fa;
            border-radius: 8px;
            padding: 6px;
            flex-wrap: wrap;
            gap: 4px;
            border: 1px solid #dee2e6;
        }

        .tab-button {
            padding: 12px 24px;
            border: none;
            background: transparent;
            color: #6c757d;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 120px;
        }

        .tab-button.active {
            background: #667eea;
            color: white;
            box-shadow: 0 2px 4px rgba(102, 126, 234, 0.2);
        }

        .tab-button:hover:not(.active) {
            background: #f1f3f4;
            color: #495057;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .example-section {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .example-section h4 {
            color: #2c3e50;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .example-section h4::before {
            content: '💡';
            font-size: 1.2rem;
        }

        .example-section p {
            color: #6c757d;
        }

        .example-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* 示例按钮样式 - 使用绿色作为辅助色 */
        .btn-example {
            padding: 8px 16px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-example:hover {
            background: #059669;
            transform: translateY(-1px);
        }

        .converter-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 20px;
        }

        .input-panel, .output-panel {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 25px;
        }

        .input-panel {
            border: 2px solid #667eea;
        }

        .output-panel {
            border: 2px solid #11998e;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-panel .section-title {
            justify-content: space-between;
        }

        .section-title span {
            display: flex;
            align-items: center;
            gap: 10px;
        }



        .btn-upload {
            padding: 6px 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-upload:hover {
            background: #5a67d8;
            transform: translateY(-1px);
        }





        textarea {
            width: 100%;
            min-height: 300px;
            padding: 20px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
            transition: all 0.3s ease;
            background: white;
            color: #2c3e50;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .output-panel textarea {
            background: #f8f9fa;
            border-color: #11998e;
        }

        .output-panel textarea:focus {
            border-color: #11998e;
            box-shadow: 0 0 0 3px rgba(17, 153, 142, 0.1);
        }

        textarea::placeholder {
            color: #6c757d;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 0 0 auto;
            min-width: 120px;
        }

        .btn-clear {
            flex: 0 0 auto;
            min-width: 120px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        /* 修改主要按钮样式 */
        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        .control-section {
            grid-column: 1 / -1;
            text-align: center;
            margin: 20px 0;
        }

        /* 修改转换按钮样式 - 移除渐变效果 */
        .convert-button {
            padding: 15px 40px;
            font-size: 1.1rem;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
            font-weight: 600;
        }

        .convert-button:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        /* 修改状态消息样式 */
        .status-message {
            padding: 15px 20px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-weight: 500;
            display: none;
            border-left: 4px solid;
        }

        .status-success {
            background: #d1fae5;
            color: #065f46;
            border-left-color: #10b981;
            border: 1px solid #6ee7b7;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
            border-left-color: #dc3545;
            border: 1px solid #f5c6cb;
        }

        .csv-options, .format-options {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #dee2e6;
        }

        .csv-options h4, .format-options h4 {
            margin-bottom: 15px;
            color: #2c3e50;
            font-weight: 600;
        }

        .option-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .option-item label {
            font-weight: 500;
            color: #495057;
        }

        .option-item input, .option-item select {
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 14px;
            background: white;
            color: #495057;
        }

        .option-item input:focus, .option-item select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
        }

        .checkbox-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #667eea;
        }

        .checkbox-item label {
            font-weight: 500;
            color: #495057;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .main-content {
                padding: 20px;
            }

            .tool-tabs {
                flex-direction: column;
            }

            .tab-button {
                flex: none;
                width: 100%;
            }

            .converter-layout {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .input-panel, .output-panel {
                padding: 20px;
            }

            textarea {
                min-height: 250px;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                flex: none;
                width: 100%;
            }

            .option-group {
                flex-direction: column;
                align-items: flex-start;
            }

            .convert-button {
                padding: 12px 30px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>XML转换工具</h1>
            <p>支持XML转JSON、XML转CSV以及XML格式化验证</p>
        </div>

        <div class="main-content">
            <div class="tool-tabs">
                <button class="tab-button active" onclick="switchTab('json')">XML转JSON</button>
                <button class="tab-button" onclick="switchTab('csv')">XML转CSV</button>
                <button class="tab-button" onclick="switchTab('format')">XML格式化</button>
            </div>

            <!-- XML转JSON -->
            <div id="json-tab" class="tab-content active">
                <div class="example-section">
                    <h4>示例数据</h4>
                    <p style="margin-bottom: 15px; color: #495057;">点击下方按钮快速加载示例数据，了解工具使用方法：</p>
                    <div class="example-buttons">
                        <button class="btn-example" onclick="loadExample('json')">📄 加载示例</button>
                    </div>
                </div>

                <div class="converter-layout">
                    <div class="input-panel">
                        <h3 class="section-title">
                            <span>📝 输入XML数据</span>
                            <button class="btn-upload" onclick="document.getElementById('fileInput-json').click()">
                                📁 上传文件
                            </button>
                        </h3>
                        <input type="file" id="fileInput-json" accept=".xml,.xsd,.wsdl,.svg,.rss,.atom,.plist,.txt" style="display:none">
                        <textarea id="xml-input-json" placeholder="请输入XML数据，或点击上方示例按钮加载示例数据..."></textarea>
                        <div class="button-group">
                            <button class="btn btn-secondary btn-clear" onclick="clearInput('xml-input-json')">
                                🗑️ 清空输入
                            </button>
                        </div>
                    </div>

                    <div class="output-panel">
                        <h3 class="section-title">
                            <span>📤 JSON输出</span>
                        </h3>
                        <textarea id="json-output" readonly placeholder="转换后的JSON数据将显示在这里..."></textarea>
                        <div class="button-group">
                            <button class="btn btn-success" onclick="copyToClipboard('json-output')">
                                📋 复制结果
                            </button>
                            <button class="btn btn-secondary" onclick="downloadResult('json-output', 'converted.json')">
                                💾 下载JSON
                            </button>
                        </div>
                    </div>

                    <div class="control-section">
                        <div id="json-status" class="status-message"></div>
                    </div>
                </div>
            </div>

            <!-- XML转CSV -->
            <div id="csv-tab" class="tab-content">
                <div class="example-section">
                    <h4>示例数据</h4>
                    <p style="margin-bottom: 15px; color: #495057;">点击下方按钮快速加载示例数据，了解CSV转换效果：</p>
                    <div class="example-buttons">
                        <button class="btn-example" onclick="loadExample('csv')">📄 加载示例</button>
                    </div>
                </div>

                <div class="csv-options">
                    <h4>CSV选项</h4>
                    <div class="option-group">
                        <div class="option-item">
                            <label for="csv-delimiter">分隔符:</label>
                            <select id="csv-delimiter">
                                <option value=",">逗号 (,)</option>
                                <option value=";">分号 (;)</option>
                                <option value="\t">制表符</option>
                                <option value="|">竖线 (|)</option>
                            </select>
                        </div>
                        <div class="option-item">
                            <label for="include-headers">
                                <input type="checkbox" id="include-headers" checked>
                                包含表头
                            </label>
                        </div>
                    </div>
                </div>

                <div class="converter-layout">
                    <div class="input-panel">
                        <h3 class="section-title">
                            <span>📝 输入XML数据</span>
                            <button class="btn-upload" onclick="document.getElementById('fileInput-csv').click()">
                                📁 上传文件
                            </button>
                        </h3>
                        <input type="file" id="fileInput-csv" accept=".xml,.xsd,.wsdl,.svg,.rss,.atom,.plist,.txt" style="display:none">
                        <textarea id="xml-input-csv" placeholder="请输入XML数据，或点击上方示例按钮加载示例数据..."></textarea>
                        <div class="button-group">
                            <button class="btn btn-secondary btn-clear" onclick="clearInput('xml-input-csv')">
                                🗑️ 清空输入
                            </button>
                        </div>
                    </div>

                    <div class="output-panel">
                        <h3 class="section-title">
                            <span>📤 CSV输出</span>
                        </h3>
                        <textarea id="csv-output" readonly placeholder="转换后的CSV数据将显示在这里..."></textarea>
                        <div class="button-group">
                            <button class="btn btn-success" onclick="copyToClipboard('csv-output')">
                                📋 复制结果
                            </button>
                            <button class="btn btn-secondary" onclick="downloadResult('csv-output', 'converted.csv')">
                                💾 下载CSV
                            </button>
                        </div>
                    </div>

                    <div class="control-section">
                        <div id="csv-status" class="status-message"></div>
                    </div>
                </div>
            </div>

            <!-- XML格式化 -->
            <div id="format-tab" class="tab-content">
                <div class="example-section">
                    <h4>示例数据</h4>
                    <p style="margin-bottom: 15px; color: #495057;">点击下方按钮快速加载示例数据，体验格式化功能：</p>
                    <div class="example-buttons">
                        <button class="btn-example" onclick="loadExample('format')">📄 加载示例</button>
                    </div>
                </div>

                <div class="format-options">
                    <h4>格式化选项</h4>
                    <div class="checkbox-group">
                        <div class="checkbox-item">
                            <input type="checkbox" id="format-indent" checked>
                            <label for="format-indent">缩进格式化</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="format-validate" checked>
                            <label for="format-validate">验证XML格式</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="format-minify">
                            <label for="format-minify">压缩XML</label>
                        </div>
                    </div>
                </div>

                <div class="converter-layout">
                    <div class="input-panel">
                        <h3 class="section-title">
                            <span>📝 输入XML数据</span>
                            <button class="btn-upload" onclick="document.getElementById('fileInput-format').click()">
                                📁 上传文件
                            </button>
                        </h3>
                        <input type="file" id="fileInput-format" accept=".xml,.xsd,.wsdl,.svg,.rss,.atom,.plist,.txt" style="display:none">
                        <textarea id="xml-input-format" placeholder="请输入需要格式化或验证的XML数据，或点击上方示例按钮加载示例数据..."></textarea>
                        <div class="button-group">
                            <button class="btn btn-secondary btn-clear" onclick="clearInput('xml-input-format')">
                                🗑️ 清空输入
                            </button>
                        </div>
                    </div>

                    <div class="output-panel">
                        <h3 class="section-title">
                            <span>📤 格式化输出</span>
                        </h3>
                        <textarea id="format-output" readonly placeholder="格式化后的XML数据将显示在这里..."></textarea>
                        <div class="button-group">
                            <button class="btn btn-success" onclick="copyToClipboard('format-output')">
                                📋 复制结果
                            </button>
                            <button class="btn btn-secondary" onclick="downloadResult('format-output', 'formatted.xml')">
                                💾 下载XML
                            </button>
                        </div>
                    </div>

                    <div class="control-section">
                        <div id="format-status" class="status-message"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚信息 -->
    <style>
        .footer {
            margin-top: 30px;
            padding: 20px 0;
            text-align: center;
            font-size: 14px;
            color: #333;  /* 深灰接近黑色，更清晰 */
        }

        .footer a {
            color: #0066cc;  /* 更深的蓝色，对比度更高 */
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* 深色背景自动适配 */
        @media (prefers-color-scheme: dark) {
            .footer {
                color: #f0f0f0;  /* 接近白色，更清晰 */
            }
            .footer a {
                color: #4da6ff;  /* 亮蓝色，在深色背景下更清晰 */
            }
        }
    </style>

    <footer class="footer">
        <p>© 2025 XML转换工具 | <a href="https://t.zsxq.com/MlnIL" target="_blank">联系作者</a></p>
    </footer>

    <script>
        // 示例数据 - 简单易懂的示例
        const exampleData = {
            json: `<?xml version="1.0" encoding="UTF-8"?>
<user id="1001">
  <name>张三</name>
  <age>25</age>
  <email>zhangsan@example.com</email>
  <city>北京</city>
</user>`,
            csv: `<?xml version="1.0" encoding="UTF-8"?>
<users>
  <user>
    <name>张三</name>
    <age>25</age>
    <email>zhangsan@example.com</email>
  </user>
  <user>
    <name>李四</name>
    <age>30</age>
    <email>lisi@example.com</email>
  </user>
  <user>
    <name>王五</name>
    <age>28</age>
    <email>wangwu@example.com</email>
  </user>
</users>`,
            format: `<?xml version="1.0" encoding="UTF-8"?><root><user id="1"><name>张三</name><age>25</age></user><user id="2"><name>李四</name><age>30</age></user></root>`
        };

        // 加载示例数据
        function loadExample(tab) {
            const data = exampleData[tab];
            const inputId = `xml-input-${tab}`;
            document.getElementById(inputId).value = data;
            
            // 显示加载成功提示
            const button = event.target;
            const originalText = button.textContent;
            button.textContent = '✅ 已加载';
            button.style.background = '#28a745';
            
            setTimeout(() => {
                button.textContent = originalText;
                button.style.background = '#10b981';
            }, 1500);
            
            // 触发自动转换
            const inputEvent = new Event('input', { bubbles: true });
            document.getElementById(inputId).dispatchEvent(inputEvent);
        }

        // 切换标签页
        function switchTab(tabName) {
            // 隐藏所有标签内容
            const tabs = document.querySelectorAll('.tab-content');
            tabs.forEach(tab => tab.classList.remove('active'));
            
            // 移除所有按钮的激活状态
            const buttons = document.querySelectorAll('.tab-button');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            // 显示选中的标签内容
            document.getElementById(tabName + '-tab').classList.add('active');
            
            // 激活对应的按钮
            event.target.classList.add('active');
        }

        // XML转JSON
        function convertToJSON() {
            const xmlInput = document.getElementById('xml-input-json').value.trim();
            const statusDiv = document.getElementById('json-status');
            const outputTextarea = document.getElementById('json-output');

            if (!xmlInput) {
                showStatus(statusDiv, '请输入XML数据', 'error');
                outputTextarea.value = '';
                return;
            }

            try {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlInput, 'text/xml');
                
                // 检查解析错误
                const parseError = xmlDoc.querySelector('parsererror');
                if (parseError) {
                    throw new Error('XML格式错误: ' + parseError.textContent);
                }

                const jsonResult = xmlToJson(xmlDoc);
                outputTextarea.value = JSON.stringify(jsonResult, null, 2);
                showStatus(statusDiv, 'XML转换为JSON成功！', 'success');
            } catch (error) {
                showStatus(statusDiv, '转换失败: ' + error.message, 'error');
                outputTextarea.value = '';
            }
        }

        // XML转CSV
        function convertToCSV() {
            const xmlInput = document.getElementById('xml-input-csv').value.trim();
            const statusDiv = document.getElementById('csv-status');
            const outputTextarea = document.getElementById('csv-output');
            const delimiter = document.getElementById('csv-delimiter').value;
            const includeHeaders = document.getElementById('include-headers').checked;
            
            if (!xmlInput) {
                showStatus(statusDiv, '请输入XML数据', 'error');
                outputTextarea.value = '';
                return;
            }

            try {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlInput, 'text/xml');
                
                const parseError = xmlDoc.querySelector('parsererror');
                if (parseError) {
                    throw new Error('XML格式错误: ' + parseError.textContent);
                }

                const csvResult = xmlToCSV(xmlDoc, delimiter, includeHeaders);
                outputTextarea.value = csvResult;
                showStatus(statusDiv, 'XML转换为CSV成功！', 'success');
            } catch (error) {
                showStatus(statusDiv, '转换失败: ' + error.message, 'error');
                outputTextarea.value = '';
            }
        }

        // XML格式化
        function formatXML() {
            const xmlInput = document.getElementById('xml-input-format').value.trim();
            const statusDiv = document.getElementById('format-status');
            const outputTextarea = document.getElementById('format-output');
            const shouldIndent = document.getElementById('format-indent').checked;
            const shouldValidate = document.getElementById('format-validate').checked;
            const shouldMinify = document.getElementById('format-minify').checked;
            
            if (!xmlInput) {
                showStatus(statusDiv, '请输入XML数据', 'error');
                outputTextarea.value = '';
                return;
            }

            try {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlInput, 'text/xml');
                
                if (shouldValidate) {
                    const parseError = xmlDoc.querySelector('parsererror');
                    if (parseError) {
                        throw new Error('XML格式错误: ' + parseError.textContent);
                    }
                }

                let formattedXML;
                if (shouldMinify) {
                    formattedXML = minifyXML(xmlInput);
                } else if (shouldIndent) {
                    formattedXML = formatXMLWithIndent(xmlDoc);
                } else {
                    formattedXML = xmlInput;
                }

                outputTextarea.value = formattedXML;
                showStatus(statusDiv, 'XML格式化成功！', 'success');
            } catch (error) {
                showStatus(statusDiv, '格式化失败: ' + error.message, 'error');
                outputTextarea.value = '';
            }
        }

        // XML转JSON辅助函数
        function xmlToJson(xml) {
            let obj = {};
            
            if (xml.nodeType === 1) { // element
                if (xml.attributes.length > 0) {
                    obj["@attributes"] = {};
                    for (let j = 0; j < xml.attributes.length; j++) {
                        const attribute = xml.attributes.item(j);
                        obj["@attributes"][attribute.nodeName] = attribute.nodeValue;
                    }
                }
            } else if (xml.nodeType === 3) { // text
                obj = xml.nodeValue;
            }

            if (xml.hasChildNodes()) {
                for (let i = 0; i < xml.childNodes.length; i++) {
                    const item = xml.childNodes.item(i);
                    const nodeName = item.nodeName;
                    
                    if (typeof(obj[nodeName]) === "undefined") {
                        obj[nodeName] = xmlToJson(item);
                    } else {
                        if (typeof(obj[nodeName].push) === "undefined") {
                            const old = obj[nodeName];
                            obj[nodeName] = [];
                            obj[nodeName].push(old);
                        }
                        obj[nodeName].push(xmlToJson(item));
                    }
                }
            }
            return obj;
        }

        // XML转CSV辅助函数
        function xmlToCSV(xmlDoc, delimiter, includeHeaders) {
            const actualDelimiter = delimiter === '\\t' ? '\t' : delimiter;
            const rows = [];
            const headers = new Set();
            
            // 查找所有重复的元素节点
            const rootElement = xmlDoc.documentElement;
            const childElements = Array.from(rootElement.children);
            
            if (childElements.length === 0) {
                throw new Error('XML中没有找到可转换的数据行');
            }

            // 收集所有可能的列名
            childElements.forEach(element => {
                Array.from(element.children).forEach(child => {
                    headers.add(child.tagName);
                });
                // 也包括属性
                Array.from(element.attributes).forEach(attr => {
                    headers.add('@' + attr.name);
                });
            });

            const headerArray = Array.from(headers).sort();
            
            // 添加表头
            if (includeHeaders) {
                rows.push(headerArray.join(actualDelimiter));
            }

            // 添加数据行
            childElements.forEach(element => {
                const row = [];
                headerArray.forEach(header => {
                    let value = '';
                    if (header.startsWith('@')) {
                        // 属性
                        const attrName = header.substring(1);
                        value = element.getAttribute(attrName) || '';
                    } else {
                        // 子元素
                        const child = element.querySelector(header);
                        value = child ? child.textContent : '';
                    }
                    // 处理包含分隔符的值
                    if (value.includes(actualDelimiter) || value.includes('"') || value.includes('\n')) {
                        value = '"' + value.replace(/"/g, '""') + '"';
                    }
                    row.push(value);
                });
                rows.push(row.join(actualDelimiter));
            });

            return rows.join('\n');
        }

        // XML格式化辅助函数
        function formatXMLWithIndent(xmlDoc) {
            const serializer = new XMLSerializer();
            const xmlString = serializer.serializeToString(xmlDoc);
            return formatXMLString(xmlString);
        }

        function formatXMLString(xml) {
            let formatted = '';
            let indent = '';
            const tab = '  ';
            
            xml.split(/>\s*</).forEach(function(node) {
                if (node.match(/^\/\w/)) {
                    indent = indent.substring(tab.length);
                }
                formatted += indent + '<' + node + '>\r\n';
                if (node.match(/^<?\w[^>]*[^\/]$/)) {
                    indent += tab;
                }
            });
            
            return formatted.substring(1, formatted.length - 3);
        }

        function minifyXML(xml) {
            return xml.replace(/>\s+</g, '><').replace(/\s+/g, ' ').trim();
        }

        // 显示状态消息
        function showStatus(statusDiv, message, type) {
            statusDiv.textContent = message;
            statusDiv.className = 'status-message status-' + type;
            statusDiv.style.display = 'block';
            
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 5000);
        }

        // 清空输入
        function clearInput(inputId) {
            document.getElementById(inputId).value = '';
        }

        // 复制到剪贴板
        function copyToClipboard(textareaId) {
            const textarea = document.getElementById(textareaId);
            if (!textarea.value.trim()) {
                alert('没有内容可复制');
                return;
            }
            
            textarea.select();
            document.execCommand('copy');
            
            // 显示复制成功提示
            const originalText = event.target.textContent;
            event.target.textContent = '✅ 已复制';
            setTimeout(() => {
                event.target.textContent = originalText;
            }, 2000);
        }

        // 下载结果
        function downloadResult(textareaId, filename) {
            const textarea = document.getElementById(textareaId);
            if (!textarea.value.trim()) {
                alert('没有内容可下载');
                return;
            }
            
            const blob = new Blob([textarea.value], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // 在XML输入文本框事件处理部分添加自动转换功能
        function setupAutoConversion() {
            // 为XML输入框添加输入监听
            document.getElementById('xml-input-json').addEventListener('input', debounce(function() {
                convertToJSON();
            }, 500));
            
            document.getElementById('xml-input-csv').addEventListener('input', debounce(function() {
                convertToCSV();
            }, 500));
            
            document.getElementById('xml-input-format').addEventListener('input', debounce(function() {
                formatXML();
            }, 500));
            
            // CSV选项变更时自动更新
            document.getElementById('csv-delimiter').addEventListener('change', function() {
                if (document.getElementById('xml-input-csv').value.trim()) {
                    convertToCSV();
                }
            });
            
            document.getElementById('include-headers').addEventListener('change', function() {
                if (document.getElementById('xml-input-csv').value.trim()) {
                    convertToCSV();
                }
            });
            
            // 格式化选项变更时自动更新
            document.querySelectorAll('#format-tab input[type="checkbox"]').forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    if (document.getElementById('xml-input-format').value.trim()) {
                        formatXML();
                    }
                });
            });
        }

        // 添加防抖函数以避免频繁执行转换
        function debounce(func, wait) {
            let timeout;
            return function() {
                const context = this;
                const args = arguments;
                clearTimeout(timeout);
                timeout = setTimeout(() => {
                    func.apply(context, args);
                }, wait);
            };
        }

        // 页面加载完成后设置自动转换
        document.addEventListener('DOMContentLoaded', function() {
            setupAutoConversion();
        });

        // 文件上传处理函数
        function setupFileUpload(inputId, textareaId) {
            document.getElementById(inputId).addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    // 检查文件大小（限制为10MB）
                    if (file.size > 10 * 1024 * 1024) {
                        alert('❌ 文件过大，请选择小于10MB的文件');
                        return;
                    }

                    const reader = new FileReader();
                    reader.onload = function(e) {
                        document.getElementById(textareaId).value = e.target.result;
                        
                        // 显示成功提示
                        const button = document.querySelector(`button[onclick*="${inputId}"]`);
                        const originalText = button.textContent;
                        button.textContent = '✅ 已加载';
                        button.style.background = '#28a745';
                        
                        setTimeout(() => {
                            button.textContent = originalText;
                            button.style.background = '#667eea';
                        }, 1500);
                    };
                    
                    reader.onerror = function() {
                        alert('❌ 文件读取失败');
                    };
                    
                    reader.readAsText(file, 'UTF-8');
                }
                
                // 清空input，允许重复选择同一文件
                e.target.value = '';
            });
        }

        // 初始化所有文件上传功能
        setupFileUpload('fileInput-json', 'xml-input-json');
        setupFileUpload('fileInput-csv', 'xml-input-csv');
        setupFileUpload('fileInput-format', 'xml-input-format');
    </script>
