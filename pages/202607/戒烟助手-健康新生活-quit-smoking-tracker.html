<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>戒烟助手 - 健康新生活</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 顶部导航 */
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .nav-stats {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
        }

        .share-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .share-btn:hover {
            transform: translateY(-2px);
        }

        /* 卡片样式 */
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 主要统计区域 */
        .main-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .main-stat-card {
            text-align: center;
            padding: 30px;
        }

        .main-stat-value {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .main-stat-label {
            font-size: 16px;
            color: #666;
        }

        /* 身体恢复进度 */
        .recovery-item {
            margin-bottom: 15px;
        }

        .recovery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .recovery-label {
            font-weight: 500;
        }

        .recovery-percentage {
            color: #667eea;
            font-weight: bold;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: #e0e0e0;
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 6px;
            transition: width 0.8s ease;
        }

        /* 打卡区域 */
        .checkin-form {
            display: grid;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-label {
            font-weight: 500;
            color: #333;
        }

        .radio-group {
            display: flex;
            gap: 15px;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .radio-item input[type="radio"] {
            accent-color: #667eea;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .slider {
            flex: 1;
            height: 8px;
            border-radius: 4px;
            background: #e0e0e0;
            outline: none;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }

        .slider-value {
            min-width: 30px;
            text-align: center;
            font-weight: bold;
            color: #667eea;
        }

        .mood-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }

        .mood-option {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mood-option.selected {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        .submit-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: transform 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
        }

        /* 激励语 */
        .motivation-text {
            font-size: 18px;
            text-align: center;
            color: #667eea;
            font-weight: 500;
            line-height: 1.6;
            padding: 20px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 15px;
            border-left: 4px solid #667eea;
        }

        /* 图表容器 */
        .chart-container {
            position: relative;
            height: 300px;
            margin-top: 20px;
        }

        /* 应急方法 */
        .emergency-methods {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .emergency-item {
            padding: 15px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .emergency-item:hover {
            transform: scale(1.05);
        }

        .emergency-icon {
            font-size: 24px;
            margin-bottom: 10px;
        }

        /* 导出按钮 */
        .export-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 10px;
            transition: background 0.3s;
        }

        .export-btn:hover {
            background: #218838;
        }

        /* 底部 */
        .footer {
            text-align: center;
            padding: 30px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }

        /* 设置模态框 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            position: relative;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            position: absolute;
            right: 20px;
            top: 15px;
        }

        .close:hover {
            color: #000;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .nav-content {
                flex-direction: column;
                text-align: center;
            }

            .nav-stats {
                justify-content: center;
            }

            .main-stat-value {
                font-size: 28px;
            }

            .card {
                padding: 20px;
            }

            .chart-container {
                height: 250px;
            }
        }

        /* 动画效果 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            animation: fadeInUp 0.6s ease-out;
        }

        /* 成功提示 */
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #28a745;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部导航 -->
        <div class="header">
            <div class="nav-content">
                <div class="logo">🚭 戒烟助手</div>
                <div class="nav-stats">
                    <div class="stat-item">
                        <div class="stat-value" id="nav-days">0</div>
                        <div class="stat-label">已坚持天数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="nav-savings">¥0</div>
                        <div class="stat-label">节省金额</div>
                    </div>
                </div>
                <button class="share-btn" onclick="shareProgress()">分享成果</button>
            </div>
        </div>

        <!-- 设置按钮 -->
        <div style="text-align: right; margin-bottom: 20px;">
            <button class="export-btn" onclick="openSettings()">⚙️ 设置</button>
        </div>

        <!-- 主要统计 -->
        <div class="main-stats">
            <div class="card main-stat-card">
                <div class="main-stat-value" id="main-days">0</div>
                <div class="main-stat-label">🕒 已坚持天数</div>
            </div>
            <div class="card main-stat-card">
                <div class="main-stat-value" id="main-savings">¥0</div>
                <div class="main-stat-label">💰 节省金额</div>
            </div>
            <div class="card main-stat-card">
                <div class="main-stat-value" id="cigarettes-avoided">0</div>
                <div class="main-stat-label">🚭 避免香烟</div>
            </div>
        </div>

        <!-- 身体恢复进度 -->
        <div class="card">
            <div class="card-title">❤️ 身体恢复进度</div>
            <div id="recovery-progress">
                <!-- 动态生成恢复进度 -->
            </div>
        </div>

        <!-- 今日打卡 -->
        <div class="card">
            <div class="card-title">📋 今日打卡</div>
            <div class="success-message" id="checkin-success">
                ✅ 打卡成功！继续保持！
            </div>
            <form class="checkin-form" id="checkin-form">
                <div class="form-group">
                    <label class="form-label">今天是否吸烟？</label>
                    <div class="radio-group">
                        <label class="radio-item">
                            <input type="radio" name="smoked" value="no" checked>
                            <span>没有 ✅</span>
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="smoked" value="yes">
                            <span>吸了 ❌</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">今天的冲动指数（1-10）</label>
                    <div class="slider-container">
                        <span>1</span>
                        <input type="range" class="slider" id="craving-slider" min="1" max="10" value="1">
                        <span>10</span>
                        <div class="slider-value" id="craving-value">1</div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">今天的心情</label>
                    <div class="mood-options" id="mood-options">
                        <div class="mood-option" data-mood="开心">😊 开心</div>
                        <div class="mood-option" data-mood="平静">😌 平静</div>
                        <div class="mood-option" data-mood="焦虑">😰 焦虑</div>
                        <div class="mood-option" data-mood="愤怒">😠 愤怒</div>
                        <div class="mood-option" data-mood="疲惫">😴 疲惫</div>
                        <div class="mood-option" data-mood="兴奋">🤩 兴奋</div>
                    </div>
                </div>

                <button type="submit" class="submit-btn">提交打卡</button>
            </form>
        </div>

        <!-- 今日激励 -->
        <div class="card">
            <div class="card-title">🧠 今日激励</div>
            <div class="motivation-text" id="daily-motivation">
                <!-- 动态生成激励语 -->
            </div>
        </div>

        <!-- 数据可视化 -->
        <div class="card">
            <div class="card-title">📈 节省金额趋势</div>
            <div class="chart-container">
                <canvas id="savingsChart"></canvas>
            </div>
        </div>

        <div class="card">
            <div class="card-title">📊 心情变化趋势</div>
            <div class="chart-container">
                <canvas id="moodChart"></canvas>
            </div>
        </div>

        <!-- 应急方法 -->
        <div class="card">
            <div class="card-title">🛡️ 忍不住了怎么办？</div>
            <div class="emergency-methods">
                <div class="emergency-item" onclick="emergencyAction('water')">
                    <div class="emergency-icon">💧</div>
                    <div>喝一大杯冷水</div>
                </div>
                <div class="emergency-item" onclick="emergencyAction('gum')">
                    <div class="emergency-icon">🍃</div>
                    <div>嚼口香糖</div>
                </div>
                <div class="emergency-item" onclick="emergencyAction('exercise')">
                    <div class="emergency-icon">🏃</div>
                    <div>做10个俯卧撑</div>
                </div>
                <div class="emergency-item" onclick="emergencyAction('breathe')">
                    <div class="emergency-icon">🧘</div>
                    <div>深呼吸5次</div>
                </div>
                <div class="emergency-item" onclick="emergencyAction('call')">
                    <div class="emergency-icon">📞</div>
                    <div>给朋友打电话</div>
                </div>
                <div class="emergency-item" onclick="emergencyAction('walk')">
                    <div class="emergency-icon">🚶</div>
                    <div>出去走走</div>
                </div>
            </div>
        </div>

        <!-- 数据导出 -->
        <div class="card">
            <div class="card-title">📝 数据导出</div>
            <p style="margin-bottom: 20px;">下载您的戒烟成长记录，记录这段美好的改变历程。</p>
            <button class="export-btn" onclick="exportToPDF()">📄 导出PDF报告</button>
            <button class="export-btn" onclick="exportToText()">📝 导出文本记录</button>
        </div>
    </div>

    <!-- 底部 -->
    <div class="footer">
        <p>坚持就是胜利！为了更健康的自己加油！💪</p>
        <p style="margin-top: 10px;">有任何问题请联系作者微信：xd13531</p>
    </div>

    <!-- 设置模态框 -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeSettings()">&times;</span>
            <h2 style="margin-bottom: 20px;">⚙️ 设置</h2>
            <form id="settings-form">
                <label for="quit-date">戒烟开始日期：</label>
                <input type="date" id="quit-date" class="form-input" required>
                
                <label for="daily-cigarettes">每天吸烟数量：</label>
                <input type="number" id="daily-cigarettes" class="form-input" placeholder="例如：20" required>
                
                <label for="cigarette-price">每包香烟价格（元）：</label>
                <input type="number" id="cigarette-price" class="form-input" placeholder="例如：15" step="0.1" required>
                
                <label for="cigarettes-per-pack">每包香烟数量：</label>
                <input type="number" id="cigarettes-per-pack" class="form-input" placeholder="例如：20" required>
                
                <button type="submit" class="submit-btn" style="width: 100%;">保存设置</button>
            </form>
        </div>
    </div>

    <script>
        // 全局变量
        let userData = {
            quitDate: null,
            dailyCigarettes: 20,
            cigarettePrice: 15,
            cigarettesPerPack: 20,
            checkins: [],
            settings: {}
        };

        let savingsChart = null;
        let moodChart = null;

        // 激励语库
        const motivationalQuotes = [
            "你已经比90%的人更有毅力了！",
            "每一天的坚持都是对未来健康的投资！",
            "你的肺部正在感谢你的决定！",
            "戒烟不仅是为了自己，也是为了爱你的人！",
            "今天的你比昨天更强大！",
            "健康的生活方式从戒烟开始！",
            "你正在创造一个更好的自己！",
            "每一次拒绝香烟都是一次胜利！",
            "坚持下去，美好的改变正在发生！",
            "你的意志力令人敬佩！",
            "戒烟是送给自己最好的礼物！",
            "你正在重新掌控自己的生活！",
            "每一天都是新的开始和希望！",
            "你的身体正在修复和重生！",
            "相信自己，你一定可以做到！"
        ];

        // 身体恢复时间表
        const recoveryMilestones = [
            { hours: 0.33, label: "心率和血压开始下降", percentage: 100 },
            { hours: 2, label: "尼古丁开始从体内清除", percentage: 100 },
            { hours: 12, label: "血液中一氧化碳恢复正常", percentage: 100 },
            { hours: 24, label: "心脏病发作风险开始降低", percentage: 100 },
            { hours: 48, label: "味觉和嗅觉开始改善", percentage: 100 },
            { hours: 72, label: "呼吸变得更容易", percentage: 100 },
            { days: 7, label: "血液循环改善", percentage: 100 },
            { days: 30, label: "肺功能显著改善", percentage: 100 },
            { days: 90, label: "咳嗽和呼吸急促减少", percentage: 100 },
            { days: 365, label: "心脏病风险降低50%", percentage: 50 },
            { days: 1825, label: "中风风险降至非吸烟者水平", percentage: 20 },
            { days: 3650, label: "肺癌风险降低50%", percentage: 10 }
        ];

        // 初始化应用
        function initApp() {
            loadUserData();
            setupEventListeners();
            updateDisplay();
            generateDailyMotivation();
            checkTodayCheckin();
            initCharts();
            
            // 如果没有设置，显示设置模态框
            if (!userData.quitDate) {
                openSettings();
            }
        }

        // 加载用户数据
        function loadUserData() {
            const saved = localStorage.getItem('quitSmokingData');
            if (saved) {
                userData = { ...userData, ...JSON.parse(saved) };
                if (userData.quitDate) {
                    userData.quitDate = new Date(userData.quitDate);
                }
            }
        }

        // 保存用户数据
        function saveUserData() {
            localStorage.setItem('quitSmokingData', JSON.stringify(userData));
        }

        // 设置事件监听器
        function setupEventListeners() {
            // 冲动指数滑块
            const cravingSlider = document.getElementById('craving-slider');
            const cravingValue = document.getElementById('craving-value');
            
            cravingSlider.addEventListener('input', function() {
                cravingValue.textContent = this.value;
            });

            // 心情选择
            const moodOptions = document.querySelectorAll('.mood-option');
            moodOptions.forEach(option => {
                option.addEventListener('click', function() {
                    moodOptions.forEach(opt => opt.classList.remove('selected'));
                    this.classList.add('selected');
                });
            });

            // 打卡表单提交
            document.getElementById('checkin-form').addEventListener('submit', function(e) {
                e.preventDefault();
                submitCheckin();
            });

            // 设置表单提交
            document.getElementById('settings-form').addEventListener('submit', function(e) {
                e.preventDefault();
                saveSettings();
            });
        }

        // 更新显示
        function updateDisplay() {
            if (!userData.quitDate) return;

            const now = new Date();
            const quitDate = new Date(userData.quitDate);
            const daysDiff = Math.floor((now - quitDate) / (1000 * 60 * 60 * 24));
            const hoursDiff = Math.floor((now - quitDate) / (1000 * 60 * 60));

            // 更新天数
            document.getElementById('nav-days').textContent = daysDiff;
            document.getElementById('main-days').textContent = daysDiff;

            // 计算节省金额
            const dailyCost = (userData.dailyCigarettes / userData.cigarettesPerPack) * userData.cigarettePrice;
            const totalSavings = Math.floor(daysDiff * dailyCost);
            
            document.getElementById('nav-savings').textContent = `¥${totalSavings}`;
            document.getElementById('main-savings').textContent = `¥${totalSavings}`;

            // 计算避免的香烟数量
            const cigarettesAvoided = daysDiff * userData.dailyCigarettes;
            document.getElementById('cigarettes-avoided').textContent = cigarettesAvoided;

            // 更新身体恢复进度
            updateRecoveryProgress(hoursDiff, daysDiff);
        }

        // 更新身体恢复进度
        function updateRecoveryProgress(hoursDiff, daysDiff) {
            const container = document.getElementById('recovery-progress');
            container.innerHTML = '';

            recoveryMilestones.forEach(milestone => {
                const timeTarget = milestone.hours ? milestone.hours : milestone.days * 24;
                const isHours = milestone.hours !== undefined;
                const currentTime = isHours ? hoursDiff : daysDiff;
                const targetTime = isHours ? milestone.hours : milestone.days;

                let percentage = 0;
                if (currentTime >= targetTime) {
                    percentage = milestone.percentage;
                } else if (milestone.percentage < 100) {
                    // 对于长期目标，按比例计算
                    percentage = Math.min((currentTime / targetTime) * milestone.percentage, milestone.percentage);
                }

                const recoveryItem = document.createElement('div');
                recoveryItem.className = 'recovery-item';
                recoveryItem.innerHTML = `
                    <div class="recovery-header">
                        <span class="recovery-label">${milestone.label}</span>
                        <span class="recovery-percentage">${Math.round(percentage)}%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${percentage}%"></div>
                    </div>
                `;
                container.appendChild(recoveryItem);
            });
        }

        // 生成每日激励语
        function generateDailyMotivation() {
            const today = new Date().toDateString();
            const savedDate = localStorage.getItem('motivationDate');
            
            if (savedDate !== today) {
                const randomQuote = motivationalQuotes[Math.floor(Math.random() * motivationalQuotes.length)];
                document.getElementById('daily-motivation').textContent = randomQuote;
                localStorage.setItem('motivationDate', today);
                localStorage.setItem('dailyMotivation', randomQuote);
            } else {
                const savedQuote = localStorage.getItem('dailyMotivation');
                if (savedQuote) {
                    document.getElementById('daily-motivation').textContent = savedQuote;
                }
            }
        }

        // 检查今日是否已打卡
        function checkTodayCheckin() {
            const today = new Date().toDateString();
            const todayCheckin = userData.checkins.find(checkin => 
                new Date(checkin.date).toDateString() === today
            );

            if (todayCheckin) {
                // 如果已打卡，显示数据并禁用表单
                document.querySelector(`input[name="smoked"][value="${todayCheckin.smoked}"]`).checked = true;
                document.getElementById('craving-slider').value = todayCheckin.craving;
                document.getElementById('craving-value').textContent = todayCheckin.craving;
                
                if (todayCheckin.mood) {
                    const moodOption = document.querySelector(`[data-mood="${todayCheckin.mood}"]`);
                    if (moodOption) {
                        moodOption.classList.add('selected');
                    }
                }

                // 禁用表单
                const form = document.getElementById('checkin-form');
                const inputs = form.querySelectorAll('input, button');
                inputs.forEach(input => input.disabled = true);
                
                document.getElementById('checkin-success').style.display = 'block';
            }
        }

        // 提交打卡
        function submitCheckin() {
            const today = new Date().toDateString();
            
            // 检查是否已经打卡
            const existingCheckin = userData.checkins.find(checkin => 
                new Date(checkin.date).toDateString() === today
            );

            if (existingCheckin) {
                alert('今天已经打卡过了！');
                return;
            }

            const smoked = document.querySelector('input[name="smoked"]:checked').value;
            const craving = parseInt(document.getElementById('craving-slider').value);
            const selectedMood = document.querySelector('.mood-option.selected');
            const mood = selectedMood ? selectedMood.dataset.mood : null;

            const checkin = {
                date: new Date().toISOString(),
                smoked: smoked,
                craving: craving,
                mood: mood
            };

            userData.checkins.push(checkin);
            saveUserData();

            // 显示成功消息
            document.getElementById('checkin-success').style.display = 'block';
            
            // 禁用表单
            const form = document.getElementById('checkin-form');
            const inputs = form.querySelectorAll('input, button');
            inputs.forEach(input => input.disabled = true);

            // 更新图表
            updateCharts();

            // 如果吸烟了，给予鼓励
            if (smoked === 'yes') {
                setTimeout(() => {
                    alert('没关系，失败是成功之母！明天继续努力！💪');
                }, 1000);
            } else {
                setTimeout(() => {
                    alert('太棒了！又成功坚持了一天！🎉');
                }, 1000);
            }
        }

        // 初始化图表
        function initCharts() {
            initSavingsChart();
            initMoodChart();
        }

        // 初始化节省金额图表
        function initSavingsChart() {
            const ctx = document.getElementById('savingsChart').getContext('2d');
            
            if (savingsChart) {
                savingsChart.destroy();
            }

            const data = generateSavingsData();
            
            savingsChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.labels,
                    datasets: [{
                        label: '累计节省金额（元）',
                        data: data.values,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: {
                                color: 'rgba(0,0,0,0.1)'
                            }
                        },
                        x: {
                            grid: {
                                color: 'rgba(0,0,0,0.1)'
                            }
                        }
                    }
                }
            });
        }

        // 初始化心情图表
        function initMoodChart() {
            const ctx = document.getElementById('moodChart').getContext('2d');
            
            if (moodChart) {
                moodChart.destroy();
            }

            const data = generateMoodData();
            
            moodChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.labels,
                    datasets: [{
                        label: '冲动指数',
                        data: data.cravings,
                        backgroundColor: 'rgba(255, 99, 132, 0.6)',
                        borderColor: 'rgba(255, 99, 132, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 10,
                            grid: {
                                color: 'rgba(0,0,0,0.1)'
                            }
                        },
                        x: {
                            grid: {
                                color: 'rgba(0,0,0,0.1)'
                            }
                        }
                    }
                }
            });
        }

        // 生成节省金额数据
        function generateSavingsData() {
            if (!userData.quitDate) {
                return { labels: [], values: [] };
            }

            const labels = [];
            const values = [];
            const dailyCost = (userData.dailyCigarettes / userData.cigarettesPerPack) * userData.cigarettePrice;
            
            const startDate = new Date(userData.quitDate);
            const today = new Date();
            const daysDiff = Math.floor((today - startDate) / (1000 * 60 * 60 * 24));

            // 显示最近30天或全部天数（如果少于30天）
            const daysToShow = Math.min(daysDiff + 1, 30);
            const startDay = Math.max(0, daysDiff - daysToShow + 1);

            for (let i = startDay; i <= daysDiff; i++) {
                const date = new Date(startDate);
                date.setDate(date.getDate() + i);
                labels.push(date.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' }));
                values.push(Math.floor(i * dailyCost));
            }

            return { labels, values };
        }

        // 生成心情数据
        function generateMoodData() {
            const labels = [];
            const cravings = [];

            // 获取最近7天的打卡数据
            const recentCheckins = userData.checkins
                .slice(-7)
                .sort((a, b) => new Date(a.date) - new Date(b.date));

            recentCheckins.forEach(checkin => {
                const date = new Date(checkin.date);
                labels.push(date.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' }));
                cravings.push(checkin.craving);
            });

            return { labels, cravings };
        }

        // 更新图表
        function updateCharts() {
            initSavingsChart();
            initMoodChart();
        }

        // 应急方法
        function emergencyAction(action) {
            const actions = {
                water: '💧 很好！喝一大杯冷水可以帮助缓解烟瘾，让身体保持水分充足！',
                gum: '🍃 嚼口香糖是个好选择！可以让嘴巴保持忙碌，转移注意力！',
                exercise: '🏃 运动是最好的替代方案！10个俯卧撑可以释放内啡肽，让你感觉更好！',
                breathe: '🧘 深呼吸非常有效！慢慢吸气4秒，屏住4秒，呼气4秒，重复5次！',
                call: '📞 和朋友聊天是很好的支持！分享你的感受，获得鼓励！',
                walk: '🚶 出去走走，呼吸新鲜空气，让大自然帮助你放松心情！'
            };

            alert(actions[action]);
        }

        // 分享进度
        function shareProgress() {
            if (!userData.quitDate) {
                alert('请先设置戒烟开始日期！');
                return;
            }

            const daysDiff = Math.floor((new Date() - new Date(userData.quitDate)) / (1000 * 60 * 60 * 24));
            const dailyCost = (userData.dailyCigarettes / userData.cigarettesPerPack) * userData.cigarettePrice;
            const totalSavings = Math.floor(daysDiff * dailyCost);
            const cigarettesAvoided = daysDiff * userData.dailyCigarettes;

            const shareText = `🚭 我已经成功戒烟 ${daysDiff} 天了！
💰 节省了 ¥${totalSavings} 元
🚭 避免了 ${cigarettesAvoided} 支香烟
💪 为了健康，我会继续坚持！

#戒烟 #健康生活 #坚持就是胜利`;

            if (navigator.share) {
                navigator.share({
                    title: '我的戒烟成果',
                    text: shareText
                });
            } else {
                // 复制到剪贴板
                navigator.clipboard.writeText(shareText).then(() => {
                    alert('分享内容已复制到剪贴板！');
                }).catch(() => {
                    alert(shareText);
                });
            }
        }

        // 打开设置
        function openSettings() {
            document.getElementById('settingsModal').style.display = 'block';
            
            // 填充现有数据
            if (userData.quitDate) {
                document.getElementById('quit-date').value = userData.quitDate.toISOString().split('T')[0];
            }
            document.getElementById('daily-cigarettes').value = userData.dailyCigarettes;
            document.getElementById('cigarette-price').value = userData.cigarettePrice;
            document.getElementById('cigarettes-per-pack').value = userData.cigarettesPerPack;
        }

        // 关闭设置
        function closeSettings() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        // 保存设置
        function saveSettings() {
            const quitDate = document.getElementById('quit-date').value;
            const dailyCigarettes = parseInt(document.getElementById('daily-cigarettes').value);
            const cigarettePrice = parseFloat(document.getElementById('cigarette-price').value);
            const cigarettesPerPack = parseInt(document.getElementById('cigarettes-per-pack').value);

            if (!quitDate || !dailyCigarettes || !cigarettePrice || !cigarettesPerPack) {
                alert('请填写所有必填项！');
                return;
            }

            userData.quitDate = new Date(quitDate);
            userData.dailyCigarettes = dailyCigarettes;
            userData.cigarettePrice = cigarettePrice;
            userData.cigarettesPerPack = cigarettesPerPack;

            saveUserData();
            closeSettings();
            updateDisplay();
            updateCharts();

            alert('设置保存成功！');
        }

        // 导出PDF报告
        function exportToPDF() {
            if (!window.jsPDF) {
                alert('PDF导出功能暂时不可用，请稍后再试。');
                return;
            }

            const { jsPDF } = window.jsPDF;
            const doc = new jsPDF();

            // 设置中文字体（简化版本）
            doc.setFont('helvetica');
            
            const daysDiff = Math.floor((new Date() - new Date(userData.quitDate)) / (1000 * 60 * 60 * 24));
            const dailyCost = (userData.dailyCigarettes / userData.cigarettesPerPack) * userData.cigarettePrice;
            const totalSavings = Math.floor(daysDiff * dailyCost);
            const cigarettesAvoided = daysDiff * userData.dailyCigarettes;

            // 添加内容
            doc.setFontSize(20);
            doc.text('Quit Smoking Progress Report', 20, 30);
            
            doc.setFontSize(12);
            doc.text(`Quit Date: ${userData.quitDate.toLocaleDateString()}`, 20, 50);
            doc.text(`Days Smoke-Free: ${daysDiff} days`, 20, 65);
            doc.text(`Money Saved: ¥${totalSavings}`, 20, 80);
            doc.text(`Cigarettes Avoided: ${cigarettesAvoided}`, 20, 95);
            
            doc.text('Recent Check-ins:', 20, 120);
            
            let yPos = 135;
            userData.checkins.slice(-10).forEach((checkin, index) => {
                const date = new Date(checkin.date).toLocaleDateString();
                const status = checkin.smoked === 'no' ? 'Success' : 'Relapse';
                doc.text(`${date}: ${status}, Craving: ${checkin.craving}/10, Mood: ${checkin.mood || 'N/A'}`, 20, yPos);
                yPos += 15;
            });

            doc.save('quit-smoking-report.pdf');
        }

        // 导出文本记录
        function exportToText() {
            const daysDiff = Math.floor((new Date() - new Date(userData.quitDate)) / (1000 * 60 * 60 * 24));
            const dailyCost = (userData.dailyCigarettes / userData.cigarettesPerPack) * userData.cigarettePrice;
            const totalSavings = Math.floor(daysDiff * dailyCost);
            const cigarettesAvoided = daysDiff * userData.dailyCigarettes;

            let content = `戒烟成长记录\n`;
            content += `==================\n\n`;
            content += `戒烟开始日期: ${userData.quitDate.toLocaleDateString()}\n`;
            content += `已坚持天数: ${daysDiff} 天\n`;
            content += `节省金额: ¥${totalSavings} 元\n`;
            content += `避免香烟: ${cigarettesAvoided} 支\n\n`;
            
            content += `打卡记录:\n`;
            content += `----------\n`;
            
            userData.checkins.forEach(checkin => {
                const date = new Date(checkin.date).toLocaleDateString();
                const status = checkin.smoked === 'no' ? '✅ 成功' : '❌ 复吸';
                content += `${date}: ${status}, 冲动指数: ${checkin.craving}/10, 心情: ${checkin.mood || '未记录'}\n`;
            });

            content += `\n生成时间: ${new Date().toLocaleString()}\n`;
            content += `\n坚持就是胜利！为了更健康的自己加油！💪`;

            // 创建下载链接
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'quit-smoking-record.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initApp);

        // 点击模态框外部关闭
        window.onclick = function(event) {
            const modal = document.getElementById('settingsModal');
            if (event.target === modal) {
                closeSettings();
            }
        }
    </script>
