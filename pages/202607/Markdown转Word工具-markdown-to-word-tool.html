        .preview ul, .preview ol {

        .preview ul > li {

        .preview ul > li:before {

        @keyframes spin {

        .info-tooltip {

                <textarea class="editor" id="markdownEditor" placeholder="在这里输入Markdown内容..."># 欢迎使用Markdown转Word工具

## 功能特点

- ✅ 实时预览
- ✅ 导出Word文档
- ✅ 语法高亮
- ✅ 导入/导出Markdown文件

## 使用方法

2. 右侧会实时显示预览效果
3. 点击"转换为Word"按钮导出文档

### 支持的语法

**粗体文本** 和 *斜体文本*

// 代码块示例
function hello() {
    console.log('Hello, World!');
}

            <div class="preview-panel">
                <div class="panel-header">
                    <div>
                        👁️ 实时预览
                        <span class="info-tooltip" title="Markdown内容的实时预览效果">ⓘ</span>
                    </div>
                    <button class="btn btn-secondary" onclick="copyPreviewContent()" title="复制预览内容">📋 复制预览</button>

                    <!-- 预览内容将在这里显示 -->

    <div class="toast" id="toast"></div>
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div>处理中...</div>
    </div>

    <!-- 引入Marked.js库用于Markdown解析 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 引入docx库用于Word导出 -->
    <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
    <script src="https://unpkg.com/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    
    <script>
        // 获取DOM元素
        const editor = document.getElementById('markdownEditor');
        const preview = document.getElementById('preview');
        const toast = document.getElementById('toast');
        const loading = document.getElementById('loading');
        const fileInput = document.getElementById('fileInput');

        // 实时预览功能
        editor.addEventListener('input', updatePreview);
        editor.addEventListener('keyup', updatePreview);
        editor.addEventListener('paste', function() {
            setTimeout(updatePreview, 10);
        });
        
        // 文件导入功能
        fileInput.addEventListener('change', handleFileLoad);

        // 页面加载完成后初始化预览
        document.addEventListener('DOMContentLoaded', function() {
            updatePreview();
        });

        // 更新预览函数
        function updatePreview() {
            try {
                const markdownText = editor.value;
                let htmlContent;
                
                // 检查marked库是否加载成功
                if (typeof marked !== 'undefined' && marked.parse) {
                    // 配置marked选项
                    marked.setOptions({
                        breaks: true,
                        gfm: true,
                        sanitize: false
                    });
                    htmlContent = marked.parse(markdownText);
                } else {
                    // 备用简单解析器
                    htmlContent = simpleMarkdownToHtml(markdownText);
                }
                
                preview.innerHTML = htmlContent;
                
                // 为代码块添加复制按钮
                addCopyButtons();
                
            } catch (error) {
                console.error('预览更新失败:', error);
                preview.innerHTML = '<p style="color: red;">预览更新失败，请检查Markdown语法</p>';
            }
        }

        // 简单的Markdown解析器（备用）
        function simpleMarkdownToHtml(markdown) {
            let html = markdown
                // 标题
                .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                .replace(/^# (.*$)/gim, '<h1>$1</h1>')
                // 粗体和斜体
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                // 代码块
                .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                // 引用
                .replace(/^> (.*$)/gim, '<blockquote>$1</blockquote>')
                // 链接
                .replace(/\[([^\]]+)\]\(([^\)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
                // 列表
                .replace(/^\* (.*$)/gim, '<li>$1</li>')
                .replace(/^- (.*$)/gim, '<li>$1</li>')
                .replace(/^\d+\. (.*$)/gim, '<li>$1</li>')
                // 换行
                .replace(/\n/g, '<br>');
            
            // 包装列表项
            html = html.replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>');
            
            return html;
        }

        // 为代码块添加复制按钮
        function addCopyButtons() {
            const codeBlocks = preview.querySelectorAll('pre');
            codeBlocks.forEach(block => {
                if (!block.querySelector('.copy-btn')) {
                    const copyBtn = document.createElement('button');
                    copyBtn.className = 'copy-btn';
                    copyBtn.textContent = '复制';
                    copyBtn.onclick = function() {
                        const code = block.querySelector('code');
                        if (code) {
                            copyToClipboard(code.textContent);
                        }
                    };
                    block.appendChild(copyBtn);
                }
            });
        }

        // 复制预览内容
        function copyPreviewContent() {
            const previewElement = document.getElementById('preview');
            const textContent = previewElement.innerText || previewElement.textContent;
            copyToClipboard(textContent, '预览内容已复制到剪贴板！');
        }

        // 复制到剪贴板
        function copyToClipboard(text, successMessage = '代码已复制到剪贴板！') {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast(successMessage);
                }).catch(err => {
                    console.error('复制失败:', err);
                    fallbackCopyTextToClipboard(text, successMessage);
                });
            } else {
                fallbackCopyTextToClipboard(text, successMessage);
            }
        }

        // 备用复制方法
        function fallbackCopyTextToClipboard(text, successMessage = '代码已复制到剪贴板！') {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            textArea.style.top = '-999999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast(successMessage);
                } else {
                    showToast('复制失败，请手动复制', 'error');
                }
            } catch (err) {
                console.error('复制失败:', err);
                showToast('复制失败，请手动复制', 'error');
            }
            
            document.body.removeChild(textArea);
        }

        // 显示提示信息
        function showToast(message, type = 'success') {
            toast.textContent = message;
            toast.className = 'toast show';
            if (type === 'error') {
                toast.classList.add('error');
            } else {
                toast.classList.remove('error');
            }
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // 显示/隐藏加载状态
        function showLoading(show) {
            loading.style.display = show ? 'block' : 'none';
        }

        // 导入Markdown文件
        function loadMarkdownFile() {
            fileInput.click();
        }

        // 处理文件加载
        function handleFileLoad(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            if (!file.name.match(/\.(md|txt)$/i)) {
                showToast('请选择.md或.txt文件', 'error');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                editor.value = e.target.result;
                updatePreview();
                showToast('文件加载成功！');
            };
            reader.onerror = function() {
                showToast('文件读取失败', 'error');
            };
            reader.readAsText(file, 'UTF-8');
        }

        // 保存Markdown文件
        function saveMarkdown() {
            const content = editor.value;
            if (!content.trim()) {
                showToast('编辑器内容为空', 'error');
                return;
            }
            
            const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'document.md';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showToast('Markdown文件已保存！');
        }

        // 转换为Word文档
        async function convertToWord() {
            const content = editor.value;
            if (!content.trim()) {
                showToast('编辑器内容为空', 'error');
                return;
            }
            
            showLoading(true);
            
            try {
                // 检查docx库是否可用
                if (typeof docx !== 'undefined' && typeof saveAs !== 'undefined') {
                    await generateDocxFile(content);
                } else {
                    // 备用方案：使用html-docx-js
                    await generateDocxFallback(content);
                }
                
            } catch (error) {
                console.error('转换失败:', error);
                showToast('转换失败，请检查内容格式', 'error');
            } finally {
                showLoading(false);
            }
        }

        // 使用docx库生成真正的DOCX文件
        async function generateDocxFile(markdownContent) {
            try {
                const { Document, Packer, Paragraph, TextRun, HeadingLevel, AlignmentType } = docx;
                
                // 解析Markdown内容为段落
                const paragraphs = parseMarkdownToParagraphs(markdownContent);
                
                // 创建文档
                const doc = new Document({
                    styles: {
                        default: {
                            document: {
                                run: {
                                    font: "Microsoft YaHei",
                                    size: 24,
                                    color: "000000"
                                }
                            }
                        }
                    },
                    sections: [{
                        properties: {},
                        children: paragraphs
                    }]
                });
                
                // 生成并下载文件
                const blob = await Packer.toBlob(doc);
                saveAs(blob, 'document.docx');
                
                showToast('DOCX文档已生成并下载！');
                
            } catch (error) {
                console.error('DOCX生成失败:', error);
                throw error;
            }
        }

        // 解析Markdown为段落
        function parseMarkdownToParagraphs(markdown) {
            const { Paragraph, TextRun, HeadingLevel } = docx;
            const lines = markdown.split('\n');
            const paragraphs = [];
            
            for (let line of lines) {
                line = line.trim();
                
                if (!line) {
                    // 空行
                    paragraphs.push(new Paragraph({ text: '' }));
                    continue;
                }
                
                // 标题处理
                if (line.startsWith('# ')) {
                    paragraphs.push(new Paragraph({
                        children: [new TextRun({
                            text: line.substring(2),
                            color: "000000",
                            size: 32
                        })],
                        heading: HeadingLevel.HEADING_1
                    }));
                } else if (line.startsWith('## ')) {
                    paragraphs.push(new Paragraph({
                        children: [new TextRun({
                            text: line.substring(3),
                            color: "000000",
                            size: 28
                        })],
                        heading: HeadingLevel.HEADING_2
                    }));
                } else if (line.startsWith('### ')) {
                    paragraphs.push(new Paragraph({
                        children: [new TextRun({
                            text: line.substring(4),
                            color: "000000",
                            size: 26
                        })],
                        heading: HeadingLevel.HEADING_3
                    }));
                } else if (line.startsWith('#### ')) {
                    paragraphs.push(new Paragraph({
                        children: [new TextRun({
                            text: line.substring(5),
                            color: "000000",
                            size: 24
                        })],
                        heading: HeadingLevel.HEADING_4
                    }));
                } else if (line.startsWith('##### ')) {
                    paragraphs.push(new Paragraph({
                        children: [new TextRun({
                            text: line.substring(6),
                            color: "000000",
                            size: 22
                        })],
                        heading: HeadingLevel.HEADING_5
                    }));
                } else if (line.startsWith('###### ')) {
                    paragraphs.push(new Paragraph({
                        children: [new TextRun({
                            text: line.substring(7),
                            color: "000000",
                            size: 20
                        })],
                        heading: HeadingLevel.HEADING_6
                    }));
                } else {
                    // 普通段落，处理粗体、斜体等格式
                    const textRuns = parseInlineFormatting(line);
                    paragraphs.push(new Paragraph({
                        children: textRuns
                    }));
                }
            }
            
            return paragraphs;
        }

        // 解析行内格式（粗体、斜体等）
        function parseInlineFormatting(text) {
            const { TextRun } = docx;
            const textRuns = [];
            
            // 简单处理粗体和斜体
            const parts = text.split(/\*\*(.*?)\*\*|\*(.*?)\*/g);
            
            for (let i = 0; i < parts.length; i++) {
                const part = parts[i];
                if (!part) continue;
                
                if (i % 3 === 1) {
                    // 粗体
                    textRuns.push(new TextRun({
                        text: part,
                        bold: true,
                        color: "000000"
                    }));
                } else if (i % 3 === 2) {
                    // 斜体
                    textRuns.push(new TextRun({
                        text: part,
                        italics: true,
                        color: "000000"
                    }));
                } else {
                    // 普通文本
                    if (part.trim()) {
                        textRuns.push(new TextRun({
                            text: part,
                            color: "000000"
                        }));
                    }
                }
            }
            
            // 如果没有格式化文本，返回普通文本
            if (textRuns.length === 0) {
                textRuns.push(new TextRun({ 
                    text: text,
                    color: "000000"
                }));
            }
            
            return textRuns;
        }

        // 备用方案：使用html-docx-js或RTF
        async function generateDocxFallback(content) {
            let htmlContent;
            
            // 使用marked解析Markdown
            if (typeof marked !== 'undefined' && marked.parse) {
                htmlContent = marked.parse(content);
            } else {
                htmlContent = simpleMarkdownToHtml(content);
            }
            
            // 创建完整的HTML文档
            const fullHtml = `
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <style>
                        body { font-family: 'Microsoft YaHei', Arial, sans-serif; line-height: 1.6; margin: 40px; }
                        h1, h2, h3, h4, h5, h6 { color: #000000; }
                        h1 { border-bottom: 2px solid #3498db; padding-bottom: 10px; }
                        h2 { margin-top: 30px; }
                        h3 { margin-top: 25px; }
                        code { background: #f1f2f6; padding: 2px 6px; border-radius: 3px; }
                        pre { background: #f8f9fa; padding: 15px; border-radius: 8px; overflow-x: auto; }
                        blockquote { border-left: 4px solid #3498db; padding-left: 20px; margin: 20px 0; color: #7f8c8d; }
                        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
                        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
                        th { background: #f8f9fa; font-weight: bold; }
                    </style>
                </head>
                <body>
                    ${htmlContent}
                </body>
                </html>
            `;
            
            // 检查html-docx-js库是否可用
            if (typeof htmlDocx !== 'undefined') {
                const converted = htmlDocx.asBlob(fullHtml);
                const url = URL.createObjectURL(converted);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'document.docx';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                showToast('Word文档已生成并下载！');
            } else {
                // 最后备用方案：生成RTF格式
                const rtfContent = convertHtmlToRtf(htmlContent);
                const blob = new Blob([rtfContent], { type: 'application/rtf' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'document.rtf';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                showToast('RTF文档已生成并下载！（可用Word打开）');
            }
        }

        // 将HTML转换为RTF格式（备用方案）
        function convertHtmlToRtf(html) {
            // 简单的HTML到RTF转换
            let rtf = '{\\rtf1\\ansi\\deff0 {\\fonttbl {\\f0 Times New Roman;}}\\f0\\fs24 ';
            
            // 移除HTML标签并转换基本格式
            let text = html
                .replace(/<h1[^>]*>(.*?)<\/h1>/gi, '\\fs32\\b $1\\b0\\fs24\\par ')
                .replace(/<h2[^>]*>(.*?)<\/h2>/gi, '\\fs28\\b $1\\b0\\fs24\\par ')
                .replace(/<h3[^>]*>(.*?)<\/h3>/gi, '\\fs26\\b $1\\b0\\fs24\\par ')
                .replace(/<strong[^>]*>(.*?)<\/strong>/gi, '\\b $1\\b0 ')
                .replace(/<em[^>]*>(.*?)<\/em>/gi, '\\i $1\\i0 ')
                .replace(/<p[^>]*>(.*?)<\/p>/gi, '$1\\par ')
                .replace(/<br[^>]*>/gi, '\\par ')
                .replace(/<[^>]+>/g, '')
                .replace(/&nbsp;/g, ' ')
                .replace(/&lt;/g, '<')
                .replace(/&gt;/g, '>')
                .replace(/&amp;/g, '&');
            
            rtf += text + '}';
            return rtf;
        }

        // 清空编辑器
        function clearEditor() {
            if (confirm('确定要清空编辑器内容吗？')) {
                editor.value = '';
                updatePreview();
                showToast('编辑器已清空');
            }
        }

        // 错误处理
        window.addEventListener('error', function(e) {
            console.error('页面错误:', e.error);
        });

        // 检查库加载状态
        window.addEventListener('load', function() {
            setTimeout(function() {
                if (typeof marked === 'undefined') {
                    console.warn('marked.js未加载，将使用内置解析器');
                }
                if (typeof docx === 'undefined') {
                    console.warn('docx库未加载，将使用备用方案导出');
                }
                if (typeof saveAs === 'undefined') {
                    console.warn('FileSaver.js未加载，将使用备用下载方式');
                }
            }, 1000);
        });
    </script>
</body>
</html>
