<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>屏幕测试工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #ffffff;
            transition: all 0.3s ease;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
        }

        .test-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 3rem 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 900px;
            width: 100%;
            transition: all 0.3s ease;
        }

        .test-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #ffffff, #e0e7ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.8;
            margin-bottom: 2rem;
            font-weight: 400;
        }

        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .test-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .test-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .test-preview {
            width: 100%;
            height: 120px;
            border-radius: 12px;
            margin-bottom: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .test-item:hover .test-preview {
            border-color: rgba(255, 255, 255, 0.4);
        }

        .test-name {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .test-description {
            font-size: 0.9rem;
            opacity: 0.7;
            line-height: 1.4;
        }

        .usage-info {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem;
            margin-top: 2rem;
        }

        .usage-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #ffffff;
        }

        .usage-list {
            list-style: none;
            text-align: left;
        }

        .usage-list li {
            margin-bottom: 0.8rem;
            padding-left: 1.5rem;
            position: relative;
            font-size: 0.95rem;
            opacity: 0.8;
            line-height: 1.5;
        }

        .usage-list li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: #60a5fa;
            font-weight: bold;
        }

        .footer {
            padding: 1.5rem;
            text-align: center;
            background: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .footer-text {
            font-size: 0.9rem;
            opacity: 0.7;
            font-weight: 400;
        }

        /* 全屏测试样式 */
        .fullscreen-test {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            display: none;
            cursor: pointer;
            justify-content: center;
            align-items: center;
        }

        .test-info {
            position: absolute;
            top: 50px;
            left: 50px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-size: 1.1rem;
            backdrop-filter: blur(10px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .fullscreen-test:hover .test-info {
            opacity: 1;
        }

        .exit-hint {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .fullscreen-test:hover .exit-hint {
            opacity: 1;
        }

        /* 测试模式背景 */
        .white-test { background: #ffffff; }
        .black-test { background: #000000; }
        .red-test { background: #ff0000; }
        .green-test { background: #00ff00; }
        .blue-test { background: #0000ff; }
        
        /* 全屏灰阶测试特殊样式 */
        .fullscreen-test.gray-test {
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: stretch;
            padding: 0;
        }
        
        .gray-gradient-top {
            height: 33.33%;
            background: linear-gradient(to right, #000000, #ffffff);
        }
        
        .gray-gradient-middle {
            height: 33.33%;
            background: linear-gradient(to right, #ffffff, #000000);
        }
        
        .gray-blocks {
            height: 33.33%;
            display: flex;
            align-items: stretch;
        }
        
        .gray-block {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            position: relative;
            min-height: 100px;
        }
        
        .gray-block::after {
            content: attr(data-value);
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8), -1px -1px 2px rgba(255,255,255,0.8);
            font-weight: bold;
        }
        .gray-test {
            background: linear-gradient(to right, #000000, #808080, #ffffff);
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2rem;
            }
            
            .container {
                padding: 1rem;
            }
            
            .test-card {
                padding: 2rem 1.5rem;
            }
            
            .test-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            
            .test-preview {
                height: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="test-card">
            <h1 class="title">屏幕测试工具</h1>
            <p class="subtitle">选择测试模式检测您的屏幕显示效果</p>
            
            <div class="test-grid">
                <div class="test-item" onclick="startTest('white')">
                    <div class="test-preview white-test"></div>
                    <div class="test-name">纯白测试</div>
                    <div class="test-description">检测暗点、坏点</div>
                </div>
                
                <div class="test-item" onclick="startTest('black')">
                    <div class="test-preview black-test"></div>
                    <div class="test-name">纯黑测试</div>
                    <div class="test-description">检测亮点、漏光</div>
                </div>
                
                <div class="test-item" onclick="startTest('red')">
                    <div class="test-preview red-test"></div>
                    <div class="test-name">纯红测试</div>
                    <div class="test-description">检测红色通道</div>
                </div>
                
                <div class="test-item" onclick="startTest('green')">
                    <div class="test-preview green-test"></div>
                    <div class="test-name">纯绿测试</div>
                    <div class="test-description">检测绿色通道</div>
                </div>
                
                <div class="test-item" onclick="startTest('blue')">
                    <div class="test-preview blue-test"></div>
                    <div class="test-name">纯蓝测试</div>
                    <div class="test-description">检测蓝色通道</div>
                </div>
                
                <div class="test-item" onclick="startTest('gray')">
                    <div class="test-preview gray-test"></div>
                    <div class="test-name">灰阶测试</div>
                    <div class="test-description">检测灰度层次</div>
                </div>
            </div>
            
            <div class="usage-info">
                <div class="usage-title">使用说明</div>
                <ul class="usage-list">
                    <li>点击任意测试模式进入全屏测试界面</li>
                    <li>在测试过程中仔细观察屏幕，寻找异常像素点</li>
                    <li>按 ESC 键或点击屏幕退出测试</li>
                    <li>按 F 键可隐藏/显示说明文字</li>
                    <li>建议在正常室内光线下进行测试，避免强光干扰</li>
                </ul>
            </div>
        </div>
    </div>
    
    <footer class="footer">
        <p class="footer-text">由嗯哼开发，微信 125273616。</p>
    </footer>

    <!-- 全屏测试界面 -->
    <div id="fullscreenTest" class="fullscreen-test">
        <div class="test-info" id="testInfo">
            <div id="testTitle">测试模式</div>
        </div>
        <div class="exit-hint">点击屏幕或按 ESC 键退出测试</div>
    </div>

    <script>
        class ScreenTestTool {
            constructor() {
                this.currentTest = null;
                this.fullscreenElement = document.getElementById('fullscreenTest');
                this.testInfo = document.getElementById('testInfo');
                this.testTitle = document.getElementById('testTitle');
                
                this.initEventListeners();
            }
            
            initEventListeners() {
                // ESC 键退出测试
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        this.exitTest();
                    } else if (e.key === 'f' || e.key === 'F') {
                        this.toggleInfo();
                    }
                });
                
                // 点击退出测试
                this.fullscreenElement.addEventListener('click', () => {
                    this.exitTest();
                });
                
                // 阻止右键菜单
                this.fullscreenElement.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                });
            }
            
            startTest(testType) {
                this.currentTest = testType;
                
                // 清除之前的内容
                this.fullscreenElement.innerHTML = `
                    <div class="test-info" id="testInfo">
                        <div id="testTitle">测试模式</div>
                    </div>
                    <div class="exit-hint">点击屏幕或按 ESC 键退出测试</div>
                `;
                
                // 重新获取元素引用
                this.testInfo = document.getElementById('testInfo');
                this.testTitle = document.getElementById('testTitle');
                
                // 设置测试背景
                this.fullscreenElement.className = `fullscreen-test ${testType}-test`;
                
                // 设置测试信息
                const testNames = {
                    'white': '纯白测试 - 检测暗点、坏点',
                    'black': '纯黑测试 - 检测亮点、漏光',
                    'red': '纯红测试 - 检测红色通道',
                    'green': '纯绿测试 - 检测绿色通道',
                    'blue': '纯蓝测试 - 检测蓝色通道',
                    'gray': '灰阶测试 - 检测灰度层次'
                };
                
                this.testTitle.textContent = testNames[testType];
                
                // 如果是灰阶测试，添加特殊结构
                if (testType === 'gray') {
                    this.setupGrayTest();
                }
                
                // 显示全屏测试
                this.fullscreenElement.style.display = 'flex';
                
                // 请求全屏
                this.requestFullscreen();
            }
            
            setupGrayTest() {
                // 创建灰阶测试的特殊结构
                const grayContent = `
                    <div class="gray-gradient-top"></div>
                    <div class="gray-gradient-middle"></div>
                    <div class="gray-blocks">
                        <div class="gray-block" style="background-color: rgb(0,0,0);" data-value="0"></div>
                        <div class="gray-block" style="background-color: rgb(17,17,17);" data-value="17"></div>
                        <div class="gray-block" style="background-color: rgb(34,34,34);" data-value="34"></div>
                        <div class="gray-block" style="background-color: rgb(51,51,51);" data-value="51"></div>
                        <div class="gray-block" style="background-color: rgb(68,68,68);" data-value="68"></div>
                        <div class="gray-block" style="background-color: rgb(85,85,85);" data-value="85"></div>
                        <div class="gray-block" style="background-color: rgb(102,102,102);" data-value="102"></div>
                        <div class="gray-block" style="background-color: rgb(119,119,119);" data-value="119"></div>
                        <div class="gray-block" style="background-color: rgb(136,136,136);" data-value="136"></div>
                        <div class="gray-block" style="background-color: rgb(153,153,153);" data-value="153"></div>
                        <div class="gray-block" style="background-color: rgb(170,170,170);" data-value="170"></div>
                        <div class="gray-block" style="background-color: rgb(187,187,187);" data-value="187"></div>
                        <div class="gray-block" style="background-color: rgb(204,204,204);" data-value="204"></div>
                        <div class="gray-block" style="background-color: rgb(221,221,221);" data-value="221"></div>
                        <div class="gray-block" style="background-color: rgb(238,238,238);" data-value="238"></div>
                        <div class="gray-block" style="background-color: rgb(255,255,255);" data-value="255"></div>
                    </div>
                `;
                
                // 在退出提示之前插入灰阶内容
                const exitHint = this.fullscreenElement.querySelector('.exit-hint');
                exitHint.insertAdjacentHTML('beforebegin', grayContent);
            }
            
            exitTest() {
                this.fullscreenElement.style.display = 'none';
                this.currentTest = null;
                
                // 退出全屏
                if (document.fullscreenElement) {
                    document.exitFullscreen().catch(() => {});
                }
            }
            
            toggleInfo() {
                const info = this.testInfo;
                const hint = document.querySelector('.exit-hint');
                
                if (info.style.opacity === '0' || !info.style.opacity) {
                    info.style.opacity = '1';
                    hint.style.opacity = '1';
                } else {
                    info.style.opacity = '0';
                    hint.style.opacity = '0';
                }
            }
            
            requestFullscreen() {
                const element = this.fullscreenElement;
                
                if (element.requestFullscreen) {
                    element.requestFullscreen().catch(() => {});
                } else if (element.webkitRequestFullscreen) {
                    element.webkitRequestFullscreen().catch(() => {});
                } else if (element.msRequestFullscreen) {
                    element.msRequestFullscreen().catch(() => {});
                }
            }
        }
        
        // 全局函数
        let screenTestTool;
        
        function startTest(testType) {
            screenTestTool.startTest(testType);
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            screenTestTool = new ScreenTestTool();
        });
        
        // 全屏状态变化监听
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement && screenTestTool.currentTest) {
                screenTestTool.exitTest();
            }
        });
    </script>
</body>
</html>
