<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>五子棋</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.8rem;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
        }

        #board {
            width: 100%;
            background-color: #e9c270;
            border: 2px solid #8b4513;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            touch-action: manipulation;
        }

        #game-info {
            margin-top: 15px;
            font-size: 1.1rem;
            color: #333;
            text-align: center;
        }

        #restart-btn {
            margin-top: 15px;
            padding: 8px 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #restart-btn:hover {
            background-color: #45a049;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            width: 80%;
            max-width: 300px;
        }

        .modal-content h2 {
            margin-bottom: 15px;
            color: #333;
        }

        .modal-content button {
            padding: 8px 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>五子棋</h1>
    <div id="game-container">
        <canvas id="board" width="450" height="450"></canvas>
    </div>
    <div id="game-info">当前玩家: <span id="current-player">黑方</span></div>
    <button id="restart-btn">重新开始</button>

    <div id="win-modal" class="modal">
        <div class="modal-content">
            <h2 id="win-message">黑方获胜!</h2>
            <button id="close-modal">确定</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('board');
            const ctx = canvas.getContext('2d');
            const gameInfo = document.getElementById('game-info');
            const currentPlayerEl = document.getElementById('current-player');
            const restartBtn = document.getElementById('restart-btn');
            const winModal = document.getElementById('win-modal');
            const winMessage = document.getElementById('win-message');
            const closeModal = document.getElementById('close-modal');

            // 棋盘大小
            const BOARD_SIZE = 15;
            let cellSize;
            let board = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0)); // 0: 空, 1: 黑, 2: 白
            let currentPlayer = 1; // 1: 黑, 2: 白
            let gameOver = false;
            let moveCount = 0;

            // 初始化棋盘
            function initBoard() {
                // 调整棋盘大小以适应屏幕
                resizeCanvas();
                drawBoard();
                currentPlayer = 1;
                currentPlayerEl.textContent = '黑方';
                board = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
                gameOver = false;
                moveCount = 0;
            }

            // 调整Canvas大小
            function resizeCanvas() {
                const container = document.getElementById('game-container');
                const containerWidth = container.clientWidth;
                canvas.width = containerWidth;
                canvas.height = containerWidth;
                cellSize = canvas.width / (BOARD_SIZE + 1);
                drawBoard();
            }

            // 绘制棋盘
            function drawBoard() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#e9c270';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // 绘制网格线
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1;

                for (let i = 0; i < BOARD_SIZE; i++) {
                    // 横线
                    ctx.beginPath();
                    ctx.moveTo(cellSize, cellSize * (i + 1));
                    ctx.lineTo(cellSize * BOARD_SIZE, cellSize * (i + 1));
                    ctx.stroke();

                    // 竖线
                    ctx.beginPath();
                    ctx.moveTo(cellSize * (i + 1), cellSize);
                    ctx.lineTo(cellSize * (i + 1), cellSize * BOARD_SIZE);
                    ctx.stroke();
                }

                // 绘制天元和星位
                const starPoints = [3, 7, 11]; // 星位坐标
                const center = Math.floor(BOARD_SIZE / 2);
                const dotRadius = cellSize * 0.1;
                
                ctx.fillStyle = '#000';
                for (let i = 0; i < starPoints.length; i++) {
                    for (let j = 0; j < starPoints.length; j++) {
                        const x = cellSize * (starPoints[j] + 1);
                        const y = cellSize * (starPoints[i] + 1);
                        ctx.beginPath();
                        ctx.arc(x, y, dotRadius, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // 绘制棋子
                for (let i = 0; i < BOARD_SIZE; i++) {
                    for (let j = 0; j < BOARD_SIZE; j++) {
                        if (board[i][j] !== 0) {
                            drawPiece(i, j, board[i][j]);
                        }
                    }
                }
            }

            // 绘制棋子
            function drawPiece(row, col, player) {
                const x = cellSize * (col + 1);
                const y = cellSize * (row + 1);
                const radius = cellSize * 0.4;

                // 棋子阴影
                ctx.beginPath();
                ctx.arc(x, y + radius * 0.1, radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.fill();

                // 棋子主体
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fillStyle = player === 1 ? '#000' : '#fff';
                ctx.fill();

                // 边框
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1;
                ctx.stroke();

                // 高光效果
                if (player === 2) {
                    ctx.beginPath();
                    ctx.arc(x - radius * 0.3, y - radius * 0.3, radius * 0.2, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                    ctx.fill();
                }
            }

            // 处理点击/触摸事件
            function handleMove(event) {
                if (gameOver) return;

                let clientX, clientY;
                
                // 处理触摸事件
                if (event.type === 'touchstart' || event.type === 'touchmove') {
                    if (event.touches.length > 0) {
                        event.preventDefault(); // 阻止触摸滚动
                        clientX = event.touches[0].clientX;
                        clientY = event.touches[0].clientY;
                    } else {
                        return;
                    }
                } else {
                    // 鼠标事件
                    clientX = event.clientX;
                    clientY = event.clientY;
                }

                const rect = canvas.getBoundingClientRect();
                const x = clientX - rect.left;
                const y = clientY - rect.top;

                // 计算落子位置
                const col = Math.round(x / cellSize - 1);
                const row = Math.round(y / cellSize - 1);

                // 检查位置是否有效
                if (row >= 0 && row < BOARD_SIZE && col >= 0 && col < BOARD_SIZE && board[row][col] === 0) {
                    // 落子
                    board[row][col] = currentPlayer;
                    moveCount++;
                    drawBoard();

                    // 检查是否获胜
                    if (checkWin(row, col, currentPlayer)) {
                        gameOver = true;
                        winMessage.textContent = currentPlayer === 1 ? '黑方获胜!' : '白方获胜!';
                        winModal.style.display = 'flex';
                        return;
                    }
                    
                    // 检查是否平局
                    if (moveCount === BOARD_SIZE * BOARD_SIZE) {
                        gameOver = true;
                        winMessage.textContent = '平局!';
                        winModal.style.display = 'flex';
                        return;
                    }

                    // 切换玩家
                    currentPlayer = currentPlayer === 1 ? 2 : 1;
                    currentPlayerEl.textContent = currentPlayer === 1 ? '黑方' : '白方';
                }
            }

            // 检查是否获胜
            function checkWin(row, col, player) {
                // 检查方向: 水平, 垂直, 对角线1, 对角线2
                const directions = [
                    [0, 1],  // 水平
                    [1, 0],  // 垂直
                    [1, 1],  // 对角线1
                    [1, -1]  // 对角线2
                ];

                for (const [dx, dy] of directions) {
                    let count = 1;  // 当前位置已经有一个棋子

                    // 正方向检查
                    for (let i = 1; i < 5; i++) {
                        const newRow = row + dx * i;
                        const newCol = col + dy * i;
                        if (newRow >= 0 && newRow < BOARD_SIZE && newCol >= 0 && newCol < BOARD_SIZE && board[newRow][newCol] === player) {
                            count++;
                        } else {
                            break;
                        }
                    }

                    // 反方向检查
                    for (let i = 1; i < 5; i++) {
                        const newRow = row - dx * i;
                        const newCol = col - dy * i;
                        if (newRow >= 0 && newRow < BOARD_SIZE && newCol >= 0 && newCol < BOARD_SIZE && board[newRow][newCol] === player) {
                            count++;
                        } else {
                            break;
                        }
                    }

                    if (count >= 5) {
                        return true;
                    }
                }

                return false;
            }

            // 事件监听器
            canvas.addEventListener('click', handleMove);
            canvas.addEventListener('touchstart', handleMove, { passive: false });
            restartBtn.addEventListener('click', initBoard);
            closeModal.addEventListener('click', () => {
                winModal.style.display = 'none';
                initBoard();
            });
            window.addEventListener('resize', resizeCanvas);

            // 初始化游戏
            initBoard();
        });
    </script>
</body>
</html>
