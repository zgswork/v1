<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五线谱工作室 — 交互式五线谱</title>
<style>
  /* ===== Design tokens: Claymorphism, education-friendly ===== */
  :root{
    --primary:#4F46E5; --primary-soft:#818CF8;
    --cta:#22C55E; --cta-dark:#16A34A;
    --bg:#EEF2FF; --surface:#FFFFFF;
    --ink:#312E81; --ink-soft:#4F4A8A; --muted:#6B66A8;
    --danger:#EF4444; --warn:#F59E0B;
    --staff-line:#3C3A5E; --note:#4F46E5; --note-active:#F97316; --ghost:#A5B4FC;
    --staff-bg:#FBFBFF; --chip-bg:#EEF2FF;
    --radius:20px; --radius-sm:14px;
    --shadow-out:6px 6px 14px rgba(79,70,229,.18), -6px -6px 14px rgba(255,255,255,.9);
    --shadow-in:inset 4px 4px 9px rgba(79,70,229,.18), inset -4px -4px 9px rgba(255,255,255,.9);
    --tap:44px;
    font-family:"Trebuchet MS","Segoe UI Rounded","Comic Sans MS",system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  body[data-theme="dark"]{
    --primary:#A5B4FC; --primary-soft:#818CF8;
    --cta:#34D399; --cta-dark:#10B981;
    --bg:#211D33; --surface:#2A2640;
    --ink:#EDEBFF; --ink-soft:#CFCAF5; --muted:#9A93C8;
    --staff-line:#C4BFEA; --note:#A5B4FC; --note-active:#FB923C; --ghost:#5B5689;
    --staff-bg:#211D33; --chip-bg:#231F38;
    --shadow-out:6px 6px 16px rgba(0,0,0,.5), -4px -4px 12px rgba(255,255,255,.04);
    --shadow-in:inset 4px 4px 9px rgba(0,0,0,.55), inset -3px -3px 8px rgba(255,255,255,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(circle at 20% 0%, #F5F3FF 0%, var(--bg) 55%, #E4E9FF 100%);
    color:var(--ink); min-height:100vh; line-height:1.5; -webkit-font-smoothing:antialiased;
    transition:background .3s,color .3s;
  }
  body[data-theme="dark"]{ background:radial-gradient(circle at 20% 0%, #2A2540 0%, var(--bg) 55%, #14121F 100%); }
  .skip{position:absolute;left:-999px;top:0;background:var(--primary);color:#fff;padding:10px 16px;border-radius:0 0 12px 0;z-index:100;}
  .skip:focus{left:0;}

  header.app{max-width:1080px;margin:0 auto;padding:22px 20px 4px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .logo{width:52px;height:52px;border-radius:16px;flex:0 0 auto;background:linear-gradient(145deg,var(--primary),var(--primary-soft));box-shadow:var(--shadow-out);display:grid;place-items:center;color:#fff;}
  .logo svg{width:30px;height:30px;}
  .titles h1{margin:0;font-size:1.45rem;letter-spacing:.2px;}
  .titles p{margin:2px 0 0;color:var(--muted);font-size:.9rem;}
  .spacer{flex:1 1 auto;}
  .top-btns{display:flex;gap:8px;}

  main{max-width:1080px;margin:0 auto;padding:8px 20px 80px;}

  .card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-out);padding:18px;margin-top:18px;border:3px solid rgba(255,255,255,.6);}
  body[data-theme="dark"] .card{border-color:rgba(255,255,255,.06);}
  .card h2{margin:0 0 4px;font-size:1.05rem;}
  .card .hint{color:var(--muted);font-size:.86rem;margin:0 0 14px;}

  /* Toolbar */
  .toolbar{display:flex;flex-wrap:wrap;gap:16px 22px;align-items:flex-start;}
  .group{display:flex;flex-direction:column;gap:6px;}
  .sliders-wrap{display:flex;flex-wrap:wrap;gap:16px 22px;align-items:flex-start;margin-left:auto;}
  @media (max-width:760px){ .sliders-wrap{margin-left:0;} }
  .group > .label{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);}
  .seg{display:inline-flex;background:var(--bg);border-radius:var(--radius-sm);padding:5px;box-shadow:var(--shadow-in);gap:4px;}
  .seg button{min-width:var(--tap);min-height:38px;border:none;background:transparent;cursor:pointer;border-radius:10px;color:var(--ink-soft);font-weight:700;font-size:.95rem;padding:6px 12px;transition:background .18s,color .18s,transform .12s;display:inline-flex;align-items:center;gap:6px;}
  .seg button:hover{background:var(--surface);}
  .seg button:active{transform:scale(.94);}
  .seg button[aria-pressed="true"]{background:var(--primary);color:#fff;box-shadow:0 4px 10px rgba(79,70,229,.35);}
  body[data-theme="dark"] .seg button[aria-pressed="true"]{color:#1b1830;}
  .seg button svg{display:block;}
  .seg button small{font-weight:600;font-size:.7rem;opacity:.8;}

  .btn{min-height:var(--tap);border:none;cursor:pointer;border-radius:var(--radius-sm);font-weight:700;font-size:.95rem;padding:10px 18px;color:#fff;background:linear-gradient(145deg,var(--primary),var(--primary-soft));box-shadow:var(--shadow-out);transition:transform .14s,filter .18s;display:inline-flex;align-items:center;gap:8px;}
  .btn:hover{filter:brightness(1.05);}
  .btn:active{transform:scale(.96);}
  .btn svg{width:20px;height:20px;}
  .btn.sm{padding:8px 12px;font-size:.9rem;}
  .btn.play{background:linear-gradient(145deg,var(--cta),var(--cta-dark));}
  .btn.ghost{background:var(--surface);color:var(--primary);box-shadow:var(--shadow-out);}
  .btn.warn{background:linear-gradient(145deg,#FB923C,#F97316);}
  .btn.danger{background:linear-gradient(145deg,#F87171,var(--danger));}
  .btn:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.3);}

  .slider-row{display:flex;align-items:center;gap:10px;}
  input[type=range]{-webkit-appearance:none;appearance:none;width:140px;height:8px;border-radius:8px;background:linear-gradient(90deg,var(--primary-soft),var(--primary));box-shadow:var(--shadow-in);cursor:pointer;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--primary);box-shadow:0 2px 6px rgba(0,0,0,.2);cursor:pointer;}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--primary);cursor:pointer;}
  .val{font-variant-numeric:tabular-nums;font-weight:700;min-width:62px;}

  /* Staff */
  .staff-wrap{position:relative;overflow-x:auto;border-radius:var(--radius);background:var(--staff-bg);box-shadow:var(--shadow-in);padding:10px;}
  svg.staff{display:block;width:100%;min-width:0;height:auto;cursor:crosshair;touch-action:manipulation;}
  .gridline{stroke:var(--staff-line);stroke-width:2;}
  .ledger{stroke:var(--staff-line);stroke-width:2;stroke-linecap:round;}
  .barline{stroke:var(--muted);stroke-width:2;stroke-dasharray:4 5;opacity:.5;}
  .playhead{stroke:var(--note-active);stroke-width:2.5;opacity:.85;}
  .clef-stroke{fill:none;stroke:var(--primary);}
  .clef-fill{fill:var(--primary);stroke:none;}

  .note-group{cursor:pointer;}
  .note-head{fill:var(--note);stroke:none;}
  .note-head.hollow{fill:var(--staff-bg);stroke:var(--note);stroke-width:2.6;}
  .note-stem{stroke:var(--note);}
  .note-flag{fill:var(--note);stroke:none;}
  .note-acc{fill:none;stroke:var(--note);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .note-group:hover .note-head{filter:brightness(1.18);}
  .note-group.active .note-head{fill:var(--note-active);stroke:none;}
  .note-group.active .note-head.hollow{fill:var(--staff-bg);stroke:var(--note-active);}
  .note-group.active .note-stem{stroke:var(--note-active);}
  .note-group.active .note-flag{fill:var(--note-active);}
  .note-group.active .note-acc{stroke:var(--note-active);}
  .note-group.ghost{pointer-events:none;}
  .note-group.ghost .note-head{fill:none;stroke:var(--ghost);stroke-width:2.4;}
  .note-group.ghost .note-head.hollow{fill:none;stroke:var(--ghost);}
  .note-group.ghost .note-stem{stroke:var(--ghost);}
  .note-group.ghost .note-flag{fill:var(--ghost);}
  .note-group.ghost .note-acc{stroke:var(--ghost);}
  .note-group.ghost .ledger{stroke:var(--ghost);}

  .pitch-readout{position:absolute;left:12px;top:12px;background:var(--primary);color:#fff;font-weight:700;font-size:.95rem;padding:6px 12px;border-radius:10px;box-shadow:0 4px 12px rgba(79,70,229,.4);pointer-events:none;opacity:0;transition:opacity .15s;}
  body[data-theme="dark"] .pitch-readout{color:#1b1830;}
  .pitch-readout.show{opacity:1;}

  .melody-strip{display:flex;gap:8px;flex-wrap:wrap;min-height:46px;align-items:center;}
  .chip{background:var(--chip-bg);border-radius:12px;padding:5px 11px;font-weight:700;font-size:.85rem;box-shadow:var(--shadow-in);display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);}
  .chip .gly{display:inline-flex;align-items:center;}
  .chip.playing{background:var(--note-active);color:#fff;box-shadow:0 4px 10px rgba(249,115,22,.5);}
  .chip small{font-weight:600;color:var(--muted);}
  .chip.playing small{color:#FFE6D5;}
  .empty-msg{color:var(--muted);font-style:italic;}

  .status{margin-top:10px;font-size:.86rem;color:var(--muted);min-height:1.2em;}

  /* Help / guide (single merged panel) */
  details.guide{margin-top:18px;background:linear-gradient(145deg,rgba(129,140,248,.14),rgba(34,197,94,.10));border-radius:var(--radius);box-shadow:var(--shadow-out);padding:14px 18px;border:3px solid rgba(255,255,255,.6);}
  body[data-theme="dark"] details.guide{background:linear-gradient(145deg,rgba(129,140,248,.16),rgba(52,211,153,.10));border-color:rgba(255,255,255,.06);}
  details.guide summary{cursor:pointer;font-weight:700;color:var(--primary);font-size:1.05rem;padding:4px 0;}
  .guide-list{margin:10px 0 0;padding-left:1.3em;display:grid;gap:7px;font-size:.92rem;}
  .guide-list li{padding-left:4px;}
  .guide-list strong{color:var(--primary);}
  .guide-keys{margin:12px 0 0;font-size:.9rem;color:var(--ink-soft);}
  .legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:14px;}
  .legend div{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:.85rem;box-shadow:var(--shadow-in);}
  .legend .mnem{color:var(--muted);}
  kbd{background:var(--surface);border-radius:6px;padding:1px 7px;box-shadow:0 1px 0 rgba(0,0,0,.15);font-size:.85rem;border:1px solid rgba(0,0,0,.08);}

  .row-wrap{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;}
  .actions{display:flex;gap:10px;flex-wrap:wrap;}
  footer{max-width:1080px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:.8rem;text-align:center;}
  :focus-visible{outline:3px solid var(--note-active);outline-offset:2px;border-radius:8px;}

  @media (max-width:560px){ .titles h1{font-size:1.2rem;} input[type=range]{width:120px;} }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;animation:none !important;} }
</style>
</head>
<body data-theme="light">
<a class="skip" data-i18n="skip" href="#staff">跳到五线谱</a>

<header class="app">
  <div class="logo" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-2 0-3 2-3 4 0 6 4 7 4 11a3 3 0 1 1-3-3"/><path d="M12 3v15"/></svg>
  </div>
  <div class="titles">
    <h1 data-i18n="brand">五线谱工作室</h1>
    <p data-i18n="subtitle">点击五线谱放置音符 · 听辨音高 · 创作并播放旋律</p>
  </div>
  <span class="spacer"></span>
  <div class="top-btns">
    <button class="btn ghost sm" id="langBtn" aria-label="切换语言 / Switch language">EN</button>
    <button class="btn ghost sm" id="themeBtn" aria-pressed="false"></button>
  </div>
</header>

<main>
  <!-- ===== Merged usage + staff-basics panel ===== -->
  <details class="guide" id="guidePanel" open>
    <summary data-i18n="guide.title">📖 使用说明 &amp; 五线谱知识</summary>
    <ol class="guide-list">
      <li data-i18n-html="guide.s1"></li>
      <li data-i18n-html="guide.s2"></li>
      <li data-i18n-html="guide.s3"></li>
      <li data-i18n-html="guide.s4"></li>
      <li data-i18n-html="guide.s5"></li>
      <li data-i18n-html="guide.s6"></li>
    </ol>
    <p class="guide-keys" data-i18n-html="guide.keys"></p>
    <div class="legend">
      <div><strong data-i18n="help.linesLabel"></strong>：<b id="helpLines"></b> <span class="mnem" id="helpLinesMnem"></span></div>
      <div><strong data-i18n="help.spacesLabel"></strong>：<b id="helpSpaces"></b> <span class="mnem" id="helpSpacesMnem"></span></div>
      <div><strong data-i18n="help.middleCLabel"></strong>：<span id="helpMiddleC"></span></div>
      <div data-i18n-html="help.ledger"></div>
      <div data-i18n-html="help.clef"></div>
    </div>
  </details>

  <!-- ===== Tools ===== -->
  <section class="card" data-i18n-aria="aria.tools">
    <h2 data-i18n="tools.title">1 · 选择工具</h2>
    <p class="hint" data-i18n-html="tools.hint"></p>
    <div class="toolbar">
      <div class="group">
        <span class="label" id="clef-lbl" data-i18n="lbl.clef">谱号</span>
        <div class="seg" role="group" aria-labelledby="clef-lbl" id="clefSeg">
          <button data-clef="treble" aria-pressed="true"  data-i18n="clef.treble.btn" data-i18n-aria="clef.treble.aria" data-i18n-title="clef.treble.aria"></button>
          <button data-clef="bass"   aria-pressed="false" data-i18n="clef.bass.btn"   data-i18n-aria="clef.bass.aria"   data-i18n-title="clef.bass.aria"></button>
        </div>
      </div>

      <div class="group">
        <span class="label" id="dur-lbl" data-i18n="lbl.duration">时值</span>
        <div class="seg" role="group" aria-labelledby="dur-lbl" id="durSeg">
          <button data-dur="whole"   aria-pressed="false" data-i18n-aria="dur.whole.aria" data-i18n-title="dur.whole.aria"><svg viewBox="0 0 24 22" width="20" height="18" aria-hidden="true"><ellipse cx="12" cy="11" rx="7.5" ry="5.2" fill="none" stroke="currentColor" stroke-width="2.4" transform="rotate(-18 12 11)"/></svg><small>×4</small></button>
          <button data-dur="half"    aria-pressed="false" data-i18n-aria="dur.half.aria" data-i18n-title="dur.half.aria"><svg viewBox="0 0 24 26" width="20" height="22" aria-hidden="true"><ellipse cx="8" cy="19" rx="6.2" ry="4.5" fill="none" stroke="currentColor" stroke-width="2.4" transform="rotate(-18 8 19)"/><line x1="13.4" y1="18" x2="13.4" y2="4" stroke="currentColor" stroke-width="2"/></svg><small>×2</small></button>
          <button data-dur="quarter" aria-pressed="true"  data-i18n-aria="dur.quarter.aria" data-i18n-title="dur.quarter.aria"><svg viewBox="0 0 24 26" width="20" height="22" aria-hidden="true"><ellipse cx="8" cy="19" rx="6.2" ry="4.5" fill="currentColor" transform="rotate(-18 8 19)"/><line x1="13.4" y1="18" x2="13.4" y2="4" stroke="currentColor" stroke-width="2"/></svg><small>×1</small></button>
          <button data-dur="eighth"  aria-pressed="false" data-i18n-aria="dur.eighth.aria" data-i18n-title="dur.eighth.aria"><svg viewBox="0 0 26 26" width="22" height="22" aria-hidden="true"><ellipse cx="8" cy="19" rx="6.2" ry="4.5" fill="currentColor" transform="rotate(-18 8 19)"/><line x1="13.4" y1="18" x2="13.4" y2="4" stroke="currentColor" stroke-width="2"/><path d="M13.4 4 q 8 3 7 13" fill="none" stroke="currentColor" stroke-width="2"/></svg><small>×½</small></button>
        </div>
      </div>

      <div class="group">
        <span class="label" id="acc-lbl" data-i18n="lbl.accidental">变音记号</span>
        <div class="seg" role="group" aria-labelledby="acc-lbl" id="accSeg">
          <button data-acc="flat"    aria-pressed="false" data-i18n-aria="acc.flat.aria" data-i18n-title="acc.flat.aria">♭</button>
          <button data-acc="natural" aria-pressed="true"  data-i18n-aria="acc.natural.aria" data-i18n-title="acc.natural.aria">♮</button>
          <button data-acc="sharp"   aria-pressed="false" data-i18n-aria="acc.sharp.aria" data-i18n-title="acc.sharp.aria">♯</button>
        </div>
      </div>

      <div class="group">
        <span class="label" id="label-lbl" data-i18n="lbl.labels">音符标注</span>
        <div class="seg" role="group" aria-labelledby="label-lbl" id="labelSeg">
          <button data-label="names"   aria-pressed="true"  data-i18n="labels.names"   data-i18n-aria="labels.names.aria"   data-i18n-title="labels.names.aria"></button>
          <button data-label="solfege" aria-pressed="false" data-i18n="labels.solfege" data-i18n-aria="labels.solfege.aria" data-i18n-title="labels.solfege.aria"></button>
        </div>
      </div>

      <div class="sliders-wrap">
        <div class="group">
          <span class="label" id="tempo-lbl" data-i18n="lbl.tempo">速度</span>
          <div class="slider-row">
            <input type="range" id="tempo" min="40" max="200" value="100" step="2" aria-labelledby="tempo-lbl">
            <span class="val"><span id="tempoVal">100</span> <span data-i18n="unit.bpm">拍/分</span></span>
          </div>
        </div>

        <div class="group">
          <span class="label" id="vol-lbl" data-i18n="lbl.volume">音量</span>
          <div class="slider-row">
            <input type="range" id="vol" min="0" max="100" value="70" step="1" aria-labelledby="vol-lbl">
            <span class="val"><span id="volVal">70</span>%</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== Staff ===== -->
  <section class="card" id="staff" data-i18n-aria="aria.staffSection">
    <div class="row-wrap">
      <div>
        <h2 data-i18n="staff.title">2 · 点击五线谱写音符</h2>
        <p class="hint" data-i18n-html="staff.hint"></p>
      </div>
      <div class="actions">
        <button class="btn play" id="playBtn" disabled></button>
        <button class="btn warn" id="undoBtn" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg><span data-i18n="btn.undo">撤销</span></button>
        <button class="btn danger" id="clearBtn" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg><span data-i18n="btn.clear">清空</span></button>
      </div>
    </div>

    <div class="staff-wrap">
      <div class="pitch-readout" id="readout" aria-hidden="true"></div>
      <svg class="staff" id="staffSvg" role="group" tabindex="0" viewBox="0 0 920 280" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </section>

  <!-- ===== Melody timeline ===== -->
  <section class="card" data-i18n-aria="aria.melody">
    <h2 data-i18n="melody.title">3 · 你的旋律</h2>
    <p class="hint"><span data-i18n="melody.hint"></span> · <span data-i18n="melody.total">总计</span> <b id="beatTotal">0</b> <span data-i18n="unit.beats">拍</span></p>
    <div class="melody-strip" id="melodyStrip"></div>
  </section>
</main>

<footer data-i18n="footer"></footer>

<script>
"use strict";
(function(){
  // ============================================================
  // I18N
  // ============================================================
  const I18N = {
    zh: {
      "brand":"五线谱工作室",
      "title":"五线谱工作室 — 交互式五线谱",
      "subtitle":"点击五线谱放置音符 · 听辨音高 · 创作并播放旋律 — 交互式五线谱",
      "skip":"跳到五线谱",
      "lang.toggle":"切换语言 / Switch language",
      "theme.aria":"深色模式",
      "theme.dark":"深色","theme.light":"浅色",
      "guide.title":"📖 使用说明 & 五线谱知识",
      "guide.s1":"<strong>选谱号：</strong>顶部切换「高音谱号 (G)」或「低音谱号 (F)」。",
      "guide.s2":"<strong>选音符：</strong>挑选时值（全 / 二分 / 四分 / 八分音符），需要时再选变音记号（♭ 降 / ♮ 还原 / ♯ 升）。",

  let lang = ((navigator.language||navigator.userLanguage||"").toLowerCase().indexOf("zh")===0) ? "zh" : "en";
  function t(key, vars){
    const tbl = I18N[lang] || I18N.en;

    if(vars) for(const k in vars){ s = s.split("{"+k+"}").join(vars[k]); }

  }

  // ============================================================
  // MUSIC MODEL  (pitch stored as absolute diatonic index `dia`)
  //   dia = octave*7 + letterIndex (C=0..B=6); E4=30, G2=18, C4=28
  //   step (clef-relative) = dia - CLEF0[clef];  treble step0=E4, bass step0=G2
  // ============================================================
  const LETTERS = ["C","D","E","F","G","A","B"];
  const LETTER_SEMITONE = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};
  const SOLFEGE = {C:"Do",D:"Re",E:"Mi",F:"Fa",G:"Sol",A:"La",B:"Si"};
  const CLEF0 = { treble: 4*7+2 /* E4=30 */, bass: 2*7+4 /* G2=18 */ };
  const DUR_BEATS = { whole:4, half:2, quarter:1, eighth:0.5 };

  function step0(){ return CLEF0[clef]; }
  function stepToDia(step){ return step0()+step; }
  function diaToStep(dia){ return dia-step0(); }
  function diaToNote(dia, acc){
    const octave=Math.floor(dia/7), letterIdx=((dia%7)+7)%7, letter=LETTERS[letterIdx];
    let semitone=LETTER_SEMITONE[letter], accSym="";
    if(acc==="sharp"){ semitone+=1; accSym="♯"; } else if(acc==="flat"){ semitone-=1; accSym="♭"; }
    const midi=(octave+1)*12+semitone;          // C4=60, A4=69
    const freq=440*Math.pow(2,(midi-69)/12);     // A4=440Hz
    return { letter, octave, accSym, name:letter+accSym+octave, midi, freq };
  }
  function stepToNote(step, acc){ return diaToNote(stepToDia(step), acc); }

  // ============================================================
  // GEOMETRY — multi-system (rows) so notes wrap instead of cramming
  // ============================================================
  const LINE_X0 = 16;                    // left inset of the staff lines
  const NOTE_X0 = LINE_X0 + 96;          // first note x (room for the clef)
  const SLOT = 56;                       // fixed horizontal spacing per note
  const HALF = 11;                       // px per diatonic step (half a staff space)
  const STAFF_SPAN = 8*HALF;             // 88 px: bottom line (step0) -> top line (step8)
  const SYS_ABOVE = 70, SYS_BELOW = 70;  // ledger/stem room above & below each staff
  const SYSTEM_H = SYS_ABOVE + STAFF_SPAN + SYS_BELOW;  // 228
  const TOP_PAD = 12, BOTTOM_PAD = 14;
  const MIN_STEP = -6, MAX_STEP = 12;    // placeable visual range (both clefs)

  // Responsive: the viewBox width tracks the staff's real pixel width, so notes keep a
  // constant on-screen size and simply wrap into more rows on narrow screens (no scroll).
  let VB_W = 920, LINE_X1 = 904, PER_SYSTEM = 15;

    PER_SYSTEM = Math.max(1, Math.floor((LINE_X1 - NOTE_X0 - 8)/SLOT));  // no +1: keeps the last note (head+ledger) inside the right gridline
  }

    s = Math.max(0, Math.min(nSystems()-1, s));
    return Math.round((baseY(s) - y)/HALF);
  }
  function clampStep(s){ return Math.max(MIN_STEP, Math.min(MAX_STEP, s)); }

        "M16 -64 C 26 -56 30 -40 22 -24 C 14 -8 -2 2 -8 18 C -12 30 -6 44 8 44 "+

      g.appendChild(el("line",{x1:cx+3,y1:cy-12,x2:cx+3,y2:cy+7}));
      g.appendChild(el("line",{x1:cx-6,y1:cy-2,x2:cx+6,y2:cy-5}));
      g.appendChild(el("line",{x1:cx-6,y1:cy+6,x2:cx+6,y2:cy+3}));
    } else if(acc==="flat"){
      g.appendChild(el("line",{x1:cx-3,y1:cy-13,x2:cx-3,y2:cy+7}));
      g.appendChild(el("path",{d:"M"+(cx-3)+" "+(cy-2)+" q 9 -1 7 6 q -1 4 -7 4",fill:"none"}));
    }
    return g;

  function buildNoteEl(note, opts){

    const hollow=(note.dur==="whole"||note.dur==="half");

      if(note.dur==="eighth"){
        const d=stemUp? "M"+sx+" "+sy2+" q 13 5 11 21 q 0 -11 -11 -15" : "M"+sx+" "+sy2+" q 13 -5 11 -21 q 0 11 -11 15";
        g.appendChild(el("path",{d:d,class:"note-flag"}));
      }
    }
    g.appendChild(el("ellipse",{cx:x,cy:y,rx:9,ry:6.6,class:"note-head"+(hollow?" hollow":""),transform:"rotate(-20 "+x+" "+y+")"}));
    if(note.acc!=="natural"){ g.appendChild(accidentalGlyph(note.acc, x-19, y)); }
    return g;
  }

  function render(){
    computeLayout();
    drawStaffBase();
    while(dynLayer.firstChild) dynLayer.removeChild(dynLayer.firstChild);
    let beats=0;
    drawBarlines();
    notes.forEach((n,i)=>{ dynLayer.appendChild(buildNoteEl(n,{x:noteX(i),sys:noteSys(i),active:n._active})); beats+=DUR_BEATS[n.dur]; });
    renderMelodyStrip();
    beatTotalEl.textContent = Number.isInteger(beats)?beats:beats.toFixed(1);
    undoBtn.disabled = notes.length===0 || isPlaying;
    clearBtn.disabled = notes.length===0 || isPlaying;
    playBtn.disabled = notes.length===0 && !isPlaying;
  }
  function drawBarlines(){
    let acc=0;
    notes.forEach((n,i)=>{
      acc+=DUR_BEATS[n.dur];
      if(acc>=4 && i<notes.length-1){
        acc-=4;
        const s=noteSys(i);
        // within a row: midpoint between the two notes; at a row break: end-of-staff line
        const x = (s===noteSys(i+1)) ? (noteX(i)+noteX(i+1))/2 : LINE_X1;
        dynLayer.appendChild(el("line",{x1:x,y1:stepY(8,s)-6,x2:x,y2:stepY(0,s)+6,class:"barline"}));
      }
    });
  }
  function noteLabel(info){ return labelMode==="solfege" ? (SOLFEGE[info.letter]+info.accSym) : info.name; }
  function beatsLabel(b){ return lang==="zh" ? (b+"拍") : (b+" "+(b===1?"beat":"beats")); }  // "1拍" / "1 beat" / "2 beats"
  function durMini(dur){
    if(dur==="whole")   return '<svg viewBox="0 0 24 22" width="18" height="16" aria-hidden="true"><ellipse cx="12" cy="11" rx="7.2" ry="5" fill="none" stroke="currentColor" stroke-width="2.4" transform="rotate(-18 12 11)"/></svg>';
    if(dur==="half")    return '<svg viewBox="0 0 24 26" width="16" height="18" aria-hidden="true"><ellipse cx="8" cy="19" rx="6" ry="4.4" fill="none" stroke="currentColor" stroke-width="2.4" transform="rotate(-18 8 19)"/><line x1="13.2" y1="18" x2="13.2" y2="5" stroke="currentColor" stroke-width="2"/></svg>';
    if(dur==="quarter") return '<svg viewBox="0 0 24 26" width="16" height="18" aria-hidden="true"><ellipse cx="8" cy="19" rx="6" ry="4.4" fill="currentColor" transform="rotate(-18 8 19)"/><line x1="13.2" y1="18" x2="13.2" y2="5" stroke="currentColor" stroke-width="2"/></svg>';
    return '<svg viewBox="0 0 26 26" width="18" height="18" aria-hidden="true"><ellipse cx="8" cy="19" rx="6" ry="4.4" fill="currentColor" transform="rotate(-18 8 19)"/><line x1="13.2" y1="18" x2="13.2" y2="5" stroke="currentColor" stroke-width="2"/><path d="M13.2 5 q 7 3 6 12" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
  }
  function renderMelodyStrip(){
    melodyStrip.innerHTML="";
    if(notes.length===0){
      const sp=document.createElement("span"); sp.className="empty-msg"; sp.textContent=t("melody.empty"); melodyStrip.appendChild(sp); return;
    }
    notes.forEach(n=>{
      const info=diaToNote(n.dia,n.acc), b=DUR_BEATS[n.dur], chip=document.createElement("span");
      chip.className="chip"+(n._active?" playing":"");
      chip.innerHTML='<span class="gly">'+durMini(n.dur)+'</span> '+noteLabel(info)+' <small>'+beatsLabel(b)+'</small>';
      chip.title=info.name+" · "+t("dur."+n.dur)+" · "+beatsLabel(b);
      melodyStrip.appendChild(chip);
    });
  }

  // ============================================================
  // POINTER / KEYBOARD INPUT
  // ============================================================
  function svgPointFromEvent(e){
    const pt=svg.createSVGPoint(), p=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;
    pt.x=p.clientX; pt.y=p.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  // only accept clicks/hovers that land on a staff's playable band (not the inter-row gaps / padding)
  function inPlayableBand(y){
    const s=Math.max(0,Math.min(nSystems()-1, Math.floor((y-TOP_PAD)/SYSTEM_H)));
    const raw=(baseY(s)-y)/HALF;                 // unrounded step relative to that row
    return raw>=MIN_STEP-1.5 && raw<=MAX_STEP+1.5;
  }
  function placeReadoutNear(clientX, clientY){    // float the pitch label next to the pointer
    const r=svg.parentNode.getBoundingClientRect();
    readout.style.left=Math.max(6, Math.min(r.width-100, clientX-r.left+14))+"px";
    readout.style.top =Math.max(6, clientY-r.top-34)+"px";
  }
  function drawGhost(step){
    const i=notes.length;                         // ghost honestly previews the landing slot (append-only editor)
    hoverLayer.innerHTML="";
    hoverLayer.appendChild(buildNoteEl({dia:stepToDia(step),acc:selectedAcc,dur:selectedDur},{ghost:true,x:noteX(i),sys:noteSys(i)}));
    readout.textContent = noteLabel(stepToNote(step,selectedAcc))+" · "+t("dur."+selectedDur);
    readout.classList.add("show");
  }
  function onHover(e){
    if(isPlaying) return;
    const p=svgPointFromEvent(e);
    if(p.x < LINE_X0-4 || p.x > LINE_X1+8 || !inPlayableBand(p.y)){ hoverLayer.innerHTML=""; readout.classList.remove("show"); return; }
    drawGhost(clampStep(yToStepAt(p.y)));
    const c=(e.touches&&e.touches[0])||e; placeReadoutNear(c.clientX, c.clientY);
  }
  function onLeave(){ hoverLayer.innerHTML=""; readout.classList.remove("show"); }

  function placeAt(step){
    if(isPlaying) return;
    const note={id:nextId++, dia:stepToDia(clampStep(step)), acc:selectedAcc, dur:selectedDur};
    notes.push(note);
    const info=diaToNote(note.dia,note.acc);
    render(); save(); previewTone(info.freq, 0.5);
    setStatus(t("status.added",{name:info.name, dur:t("dur."+selectedDur), count:notesCount(notes.length)}));
    hoverLayer.innerHTML="";
  }
  function onPlace(e){
    if(isPlaying) return;
    const p=svgPointFromEvent(e);
    if(p.x < LINE_X0-4 || p.x > LINE_X1+8 || !inPlayableBand(p.y)) return;
    placeAt(yToStepAt(p.y));
  }
  function showCursorGhost(announce){
    readout.style.left=""; readout.style.top="";   // keyboard path: pin the readout to its default corner
    drawGhost(cursorStep);
    if(announce) setStatus(t("status.cursor",{name:stepToNote(cursorStep,selectedAcc).name}));
  }

  function onSvgClickCapture(e){
    const grp=e.target.closest && e.target.closest(".note-group:not(.ghost)");
    if(grp){ e.stopPropagation(); deleteNote(+grp.getAttribute("data-id")); }
  }
  function deleteNote(id){
    if(isPlaying) return;
    const idx=notes.findIndex(n=>n.id===id); if(idx<0) return;
    const ae=document.activeElement, wasFocused = ae && ae.getAttribute && ae.getAttribute("data-id")===String(id);
    const info=diaToNote(notes[idx].dia,notes[idx].acc);
    notes.splice(idx,1); render(); save();
    setStatus(t("status.removed",{name:info.name, count:notesCount(notes.length)}));
    if(wasFocused){
      const groups=dynLayer.querySelectorAll(".note-group[data-id]");
      const target=groups[Math.min(idx, groups.length-1)] || svg;
      try{ target.focus(); }catch(e2){}
    }
  }

  // ============================================================
  // WEB AUDIO
  // ============================================================
  let audioCtx=null, masterGain=null;
  function getCtx(){
    if(!audioCtx){
      const AC=window.AudioContext||window.webkitAudioContext;
      audioCtx=new AC(); masterGain=audioCtx.createGain(); masterGain.gain.value=volume; masterGain.connect(audioCtx.destination);
    }
    if(audioCtx.state==="suspended") audioCtx.resume();
    return audioCtx;
  }
  function setVolume(v){
    volume=v;
    if(masterGain){
      const now=audioCtx.currentTime, p=masterGain.gain;
      if(typeof p.cancelAndHoldAtTime==="function"){ p.cancelAndHoldAtTime(now); }
      else { p.cancelScheduledValues(now); p.setValueAtTime(Math.max(0.0001,p.value), now); }
      p.linearRampToValueAtTime(volume<=0?0:volume, now+0.02);   // linear ramp reaches exact 0
    }
  }
  function playTone(freq, startTime, duration){
    const ctx=getCtx(), dur=Math.max(0.12,duration);
    const osc1=ctx.createOscillator(); osc1.type="triangle"; osc1.frequency.value=freq;
    const osc2=ctx.createOscillator(); osc2.type="sine";     osc2.frequency.value=freq*2;
    const g1=ctx.createGain(); g1.gain.value=0.9;
    const g2=ctx.createGain(); g2.gain.value=0.16;
    const env=ctx.createGain(); const tt=startTime, peak=0.9;
    env.gain.setValueAtTime(0.0001,tt);
    env.gain.exponentialRampToValueAtTime(peak, tt+0.012);
    env.gain.exponentialRampToValueAtTime(peak*0.6, tt+0.12);
    env.gain.setValueAtTime(peak*0.6, tt+Math.max(0.13,dur*0.6));
    env.gain.exponentialRampToValueAtTime(0.0001, tt+dur+0.02);
    osc1.connect(g1); osc2.connect(g2); g1.connect(env); g2.connect(env); env.connect(masterGain);
    osc1.start(tt); osc2.start(tt); const st=tt+dur+0.06; osc1.stop(st); osc2.stop(st);
    return {osc1,osc2,env};
  }
  function previewTone(freq,dur){ const ctx=getCtx(); playTone(freq, ctx.currentTime, dur); }

  // ============================================================
  // PLAYBACK (scheduled on the audio clock; visuals via rAF)
  // ============================================================
  function play(){
    if(isPlaying){ stopPlayback(); return; }
    if(notes.length===0) return;
    const ctx=getCtx();
    isPlaying=true; activeIdx=-1; voices=[]; schedule=[];
    const secPerBeat=60/tempo; startAudioTime=ctx.currentTime+0.08; let when=startAudioTime;
    notes.forEach(n=>{ const info=diaToNote(n.dia,n.acc), d=DUR_BEATS[n.dur]*secPerBeat; voices.push(playTone(info.freq,when,d*0.92)); schedule.push({start:when,end:when+d}); when+=d; });
    updatePlayButton(true);
    undoBtn.disabled=true; clearBtn.disabled=true; svg.style.cursor="default";
    hoverLayer.innerHTML=""; readout.classList.remove("show");
    setStatus(t("status.playing")); playheadEl.style.display=""; rafId=requestAnimationFrame(rafTick);
  }
  function rafTick(){
    if(!isPlaying) return;
    const now=audioCtx.currentTime, last=schedule[schedule.length-1];
    if(now>=last.end){ finishPlayback(true); return; }
    let idx=0; for(let i=0;i<schedule.length;i++){ if(now<schedule[i].end){ idx=i; break; } }
    if(now<startAudioTime) idx=0;
    const seg=schedule[idx], s=noteSys(idx);
    const frac=reduceMotion?0:Math.min(1,Math.max(0,(now-seg.start)/(seg.end-seg.start)));
    const x0=noteX(idx);
    const x1=(idx<notes.length-1 && noteSys(idx+1)===s) ? noteX(idx+1) : Math.min(LINE_X1, noteX(idx)+SLOT);
    const x=x0+frac*(x1-x0);
    playheadEl.setAttribute("x1",x); playheadEl.setAttribute("x2",x);
    playheadEl.setAttribute("y1",stepY(8,s)-30); playheadEl.setAttribute("y2",stepY(0,s)+30);
    if(idx!==activeIdx) setActive(idx);
    rafId=requestAnimationFrame(rafTick);
  }
  function setActive(idx){
    notes.forEach((n,i)=>{ n._active=(i===idx); }); activeIdx=idx;
    dynLayer.querySelectorAll(".note-group").forEach((g,i)=>g.classList.toggle("active", i===idx));
    melodyStrip.querySelectorAll(".chip").forEach((c,i)=>c.classList.toggle("playing", i===idx));
  }
  function finishPlayback(natural){
    isPlaying=false; if(rafId){ cancelAnimationFrame(rafId); rafId=0; }
    notes.forEach(n=>{ n._active=false; }); activeIdx=-1;
    playheadEl.style.display="none"; updatePlayButton(false); svg.style.cursor="crosshair";
    pendingReflow=false;   // the render() below recomputes layout, applying any resize deferred during playback
    render(); setStatus(natural? t("status.finished") : t("status.stopped"));
  }
  function stopPlayback(){
    if(audioCtx){
      const now=audioCtx.currentTime;
      voices.forEach(v=>{ try{
        const p=v.env.gain;
        if(typeof p.cancelAndHoldAtTime==="function"){ p.cancelAndHoldAtTime(now); }
        else { p.cancelScheduledValues(now); p.setValueAtTime(Math.max(0.0001,p.value), now); }
        p.linearRampToValueAtTime(0.0001, now+0.06); v.osc1.stop(now+0.08); v.osc2.stop(now+0.08);
      }catch(err){} });
    }
    voices=[]; finishPlayback(false);
  }
  function updatePlayButton(playing){
    if(playing){ playBtn.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>'+t("btn.stop"); }
    else { playBtn.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'+t("btn.play"); }
  }

  // ============================================================
  // PERSISTENCE
  // ============================================================
  const LS_KEY="staffStudio.v3";
  function save(){
    try{ localStorage.setItem(LS_KEY, JSON.stringify({
      notes:notes.map(n=>({dia:n.dia,acc:n.acc,dur:n.dur})), clef, tempo, volume, labelMode, theme, lang
    })); }catch(err){}
  }
  function load(){
    try{
      const raw=localStorage.getItem(LS_KEY); if(!raw) return;
      const d=JSON.parse(raw); if(!d||typeof d!=="object") return;
      if(d.clef==="bass"||d.clef==="treble") clef=d.clef;
      if(typeof d.tempo==="number" && d.tempo>=40 && d.tempo<=200) tempo=Math.round(d.tempo);
      if(typeof d.volume==="number" && d.volume>=0 && d.volume<=1) volume=d.volume;
      if(d.labelMode==="solfege"||d.labelMode==="names") labelMode=d.labelMode;
      if(d.theme==="dark"||d.theme==="light") theme=d.theme;
      if(d.lang==="zh"||d.lang==="en") lang=d.lang;
      let dropped=false;
      if(Array.isArray(d.notes)){
        const clef0=CLEF0[clef];
        notes=d.notes.filter(n=>n && typeof n.dia==="number" && isFinite(n.dia)
              && ["whole","half","quarter","eighth"].includes(n.dur)
              && ["sharp","flat","natural"].includes(n.acc)
              && ((n.dia|0)-clef0)>=MIN_STEP && ((n.dia|0)-clef0)<=MAX_STEP)
          .map(n=>({id:nextId++, dia:n.dia|0, acc:n.acc, dur:n.dur}));
        if(notes.length!==d.notes.length) dropped=true;
      }
      if(dropped) save();
    }catch(err){ notes=[]; }
  }

  // ============================================================
  // I18N APPLY
  // ============================================================
  function applyLang(){
    document.documentElement.lang = lang==="zh" ? "zh-CN" : "en";
    document.title = t("title");
    document.querySelectorAll("[data-i18n]").forEach(e=>{ e.textContent=t(e.getAttribute("data-i18n")); });
    document.querySelectorAll("[data-i18n-html]").forEach(e=>{ e.innerHTML=t(e.getAttribute("data-i18n-html")); });
    document.querySelectorAll("[data-i18n-aria]").forEach(e=>{ e.setAttribute("aria-label", t(e.getAttribute("data-i18n-aria"))); });
    document.querySelectorAll("[data-i18n-title]").forEach(e=>{ e.setAttribute("title", t(e.getAttribute("data-i18n-title"))); });
    langBtn.textContent = lang==="zh" ? "EN" : "中";
    langBtn.setAttribute("aria-label", t("lang.toggle"));
    applyTheme();
    updatePlayButton(isPlaying);
    updateStaffLabel();
    updateHelpForClef();
    tempoEl.setAttribute("aria-valuetext", t("aria.bpm",{n:tempo}));
    volEl.setAttribute("aria-valuetext", t("aria.vol",{n:Math.round(volume*100)}));
    render();
  }

  // ============================================================
  // CONTROLS
  // ============================================================
  function setSegPressed(segId, attr, val){ const seg=document.getElementById(segId); [...seg.querySelectorAll("button")].forEach(b=>b.setAttribute("aria-pressed", b.getAttribute(attr)===val?"true":"false")); }
  function wireSeg(segId, onPick){ const seg=document.getElementById(segId); seg.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; [...seg.querySelectorAll("button")].forEach(x=>x.setAttribute("aria-pressed", x===b?"true":"false")); onPick(b); }); }

  wireSeg("clefSeg", b=>{
    clef=b.getAttribute("data-clef");
    let moved=false;
    notes.forEach(n=>{ let st=diaToStep(n.dia); while(st>MAX_STEP){ n.dia-=7; st-=7; moved=true; } while(st<MIN_STEP){ n.dia+=7; st+=7; moved=true; } });
    render(); save(); updateHelpForClef(); updateStaffLabel();
    setStatus(t("status.clef",{clef:t("clef."+clef), extra: moved? t("clef.moved") : t("clef.updated")}));
  });
  wireSeg("durSeg", b=>{ selectedDur=b.getAttribute("data-dur"); setStatus(t("status.durSel",{dur:t("dur."+selectedDur), beats:DUR_BEATS[selectedDur]})); });
  wireSeg("accSeg", b=>{ selectedAcc=b.getAttribute("data-acc"); setStatus(t("status.accSel",{acc:t("acc."+selectedAcc)})); });
  wireSeg("labelSeg", b=>{ labelMode=b.getAttribute("data-label"); render(); save(); setStatus(labelMode==="solfege"? t("status.labelSolfege") : t("status.labelNames")); });

  tempoEl.addEventListener("input",()=>{ tempo=+tempoEl.value; tempoVal.textContent=tempo; tempoEl.setAttribute("aria-valuetext", t("aria.bpm",{n:tempo})); });
  tempoEl.addEventListener("change", save);
  volEl.addEventListener("input",()=>{ setVolume(+volEl.value/100); volVal.textContent=volEl.value; volEl.setAttribute("aria-valuetext", t("aria.vol",{n:volEl.value})); });
  volEl.addEventListener("change", save);

  playBtn.addEventListener("click",()=>{ getCtx(); play(); });
  undoBtn.addEventListener("click",()=>{ if(notes.length===0||isPlaying) return; const r=notes.pop(), info=diaToNote(r.dia,r.acc); render(); save(); setStatus(t("status.undone",{name:info.name, count:notesCount(notes.length)})); });
  clearBtn.addEventListener("click",()=>{ if(notes.length===0||isPlaying) return; if(notes.length>2 && !confirm(t("confirm.clearAll"))) return; notes=[]; render(); save(); setStatus(t("status.cleared")); });
  themeBtn.addEventListener("click",()=>{ theme=(theme==="dark"?"light":"dark"); applyTheme(); save(); });
  langBtn.addEventListener("click",()=>{ lang=(lang==="zh"?"en":"zh"); applyLang(); save(); setStatus(t("status.lang")); });

  function applyTheme(){
    document.body.setAttribute("data-theme",theme);
    themeBtn.setAttribute("aria-pressed", theme==="dark"?"true":"false");
    themeBtn.setAttribute("aria-label", t("theme.aria"));
    themeBtn.innerHTML = theme==="dark"
      ? '<span aria-hidden="true">☀️</span> <span aria-hidden="true">'+t("theme.light")+'</span>'
      : '<span aria-hidden="true">🌙</span> <span aria-hidden="true">'+t("theme.dark")+'</span>';
  }
  function updateStaffLabel(){ svg.setAttribute("aria-label", t("aria.staff",{clef:t("clef."+clef)})); }
  function updateHelpForClef(){
    const L=document.getElementById("helpLines"), Lm=document.getElementById("helpLinesMnem"),
          S=document.getElementById("helpSpaces"), Sm=document.getElementById("helpSpacesMnem"), MC=document.getElementById("helpMiddleC");
    if(!L) return;
    if(clef==="treble"){
      L.textContent="E G B D F"; Lm.textContent=t("help.treble.linesMnem");
      S.textContent="F A C E";   Sm.textContent=t("help.treble.spacesMnem");
      MC.textContent=t("help.treble.middleC");
    }else{
      L.textContent="G B D F A"; Lm.textContent=t("help.bass.linesMnem");
      S.textContent="A C E G";   Sm.textContent=t("help.bass.spacesMnem");
      MC.textContent=t("help.bass.middleC");
    }
  }

  // staff interactions
  svg.addEventListener("mousemove", onHover);
  svg.addEventListener("mouseleave", onLeave);
  svg.addEventListener("click", onSvgClickCapture, true);
  svg.addEventListener("click", onPlace);
  svg.addEventListener("touchstart", e=>{ const grp=e.target.closest&&e.target.closest(".note-group:not(.ghost)"); e.preventDefault(); if(grp){ deleteNote(+grp.getAttribute("data-id")); return; } onPlace(e); }, {passive:false});
  svg.addEventListener("keydown", e=>{
    const grp=document.activeElement && document.activeElement.closest && document.activeElement.closest(".note-group:not(.ghost)");
    if(grp){ if(!isPlaying && (e.key==="Enter"||e.key===" "||e.key==="Delete"||e.key==="Backspace")){ e.preventDefault(); e.stopPropagation(); deleteNote(+grp.getAttribute("data-id")); } return; }
    if(isPlaying) return;
    if(e.key==="ArrowUp"||e.key==="ArrowDown"){ e.preventDefault(); cursorStep=clampStep(cursorStep+(e.key==="ArrowUp"?1:-1)); showCursorGhost(true); }
    else if(e.key==="Enter"){ e.preventDefault(); placeAt(cursorStep); showCursorGhost(false); }
  });
  svg.addEventListener("focus", ()=>{ if(!isPlaying) setStatus(t("status.staffFocus",{name:stepToNote(cursorStep,selectedAcc).name})); });
  svg.addEventListener("blur", ()=>{ hoverLayer.innerHTML=""; readout.classList.remove("show"); });

  document.addEventListener("keydown", e=>{
    if(/^(input|textarea|select|button|a)$/i.test(e.target.tagName)) return;
    const dmap={"1":"whole","2":"half","3":"quarter","4":"eighth"};
    if(dmap[e.key]){ pickSeg("durSeg","data-dur",dmap[e.key]); }
    else if(e.key==="-"){ pickSeg("accSeg","data-acc","flat"); }
    else if(e.key==="="||e.key==="+"){ pickSeg("accSeg","data-acc","sharp"); }
    else if(e.key==="0"){ pickSeg("accSeg","data-acc","natural"); }
    else if(e.key===" "){ e.preventDefault(); getCtx(); play(); }
    else if(e.key.toLowerCase()==="z"){ undoBtn.click(); }
    else if(e.key.toLowerCase()==="c"){ clearBtn.click(); }
  });
  function pickSeg(segId,attr,val){ const seg=document.getElementById(segId); const b=seg.querySelector("["+attr+"=\""+val+"\"]"); if(b) b.click(); }

  // reflow the staff (notes-per-row) when the window resizes — but not mid-playback (avoids a layout jump)
  let resizeRAF=0, pendingReflow=false;
  window.addEventListener("resize", ()=>{ if(resizeRAF) cancelAnimationFrame(resizeRAF); resizeRAF=requestAnimationFrame(()=>{ resizeRAF=0; if(isPlaying){ pendingReflow=true; return; } render(); }); });

  // ============================================================
  // INIT
  // ============================================================
  load();
  setSegPressed("clefSeg","data-clef",clef);
  setSegPressed("labelSeg","data-label",labelMode);
  tempoEl.value=tempo; tempoVal.textContent=tempo;
  volEl.value=Math.round(volume*100); volVal.textContent=Math.round(volume*100);
  applyLang();   // sets all text/attrs, theme, staff label, help, valuetexts, and renders
  setStatus(t("status.ready"));   // status is not data-i18n (so applyLang can't re-announce it); seed it here
})();
</script>
</body>
</html>
