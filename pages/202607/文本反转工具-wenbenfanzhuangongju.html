<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本反转工具</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #a0e6a0; /* 绿色背景 */
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            flex: 1;
        }
        
        h1 {
            text-align: center;
            color: #2e7d32;
        }
        
        .input-section, .output-section {
            margin-bottom: 20px;
        }
        
        textarea {
            width: 100%;
            min-height: 150px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: vertical;
            box-sizing: border-box;
        }
        
        .buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        .file-input {
            display: none;
        }
        
        .file-label {
            padding: 10px 15px;
            background-color: #2196F3;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            display: inline-block;
        }
        
        .file-label:hover {
            background-color: #0b7dda;
        }
        
        .footer {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            color: #2e7d32;
            font-size: 14px;
        }
        
        a {
            color: #1e88e5;
            text-decoration: none;
        }
        
        a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 600px) {
            .buttons {
                flex-direction: column;
            }
            
            button, .file-label {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>文本反转工具</h1>
        
        <div class="input-section">
            <h3>输入文本：</h3>
            <textarea id="inputText" placeholder="请输入要反转的文本..."></textarea>
        </div>
        
        <div class="buttons">
            <button id="reverseBtn">反转文本</button>
            <button id="clearBtn">清空文本</button>
            <label for="fileInput" class="file-label">上传TXT文件</label>
            <input type="file" id="fileInput" class="file-input" accept=".txt">
        </div>
        
        <div class="output-section">
            <h3>反转结果：</h3>
            <textarea id="outputText" readonly placeholder="反转后的文本将显示在这里..."></textarea>
        </div>
    </div>
    
    <div class="footer">
        本工具由兔子先生用deepseek开发<br>
        技术支持：<a href="https://t.zsxq.com/y1934" target="_blank">https://t.zsxq.com/y1934</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const inputText = document.getElementById('inputText');
            const outputText = document.getElementById('outputText');
            const reverseBtn = document.getElementById('reverseBtn');
            const clearBtn = document.getElementById('clearBtn');
            const fileInput = document.getElementById('fileInput');
            
            // 反转文本
            reverseBtn.addEventListener('click', function() {
                const text = inputText.value;
                const reversedText = text.split('').reverse().join('');
                outputText.value = reversedText;
            });
            
            // 清空文本
            clearBtn.addEventListener('click', function() {
                inputText.value = '';
                outputText.value = '';
            });
            
            // 处理文件上传
            fileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                const fileName = file.name.toLowerCase();
                
                if (!fileName.endsWith('.txt')) {
                    alert('请上传.txt格式的文本文件');
                    e.target.value = '';
                    return;
                }
                
                readTextFile(file);
                
                // 重置文件输入，允许重复选择同一文件
                e.target.value = '';
            });
            
            // 读取文本文件内容
            function readTextFile(file) {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    inputText.value = e.target.result;
                    // 自动反转
                    const text = inputText.value;
                    const reversedText = text.split('').reverse().join('');
                    outputText.value = reversedText;
                };
                
                reader.onerror = function() {
                    alert('读取文件时出错');
                };
                
                reader.readAsText(file, 'UTF-8');
            }
        });
    </script>
</body>
</html>
