            {
                title: "渔歌子（唐·张志和）",

            },
            {
                title: "观书有感（宋·朱熹）",

            // 五年级下册
            {

            {
                title: "稚子弄冰（宋·杨万里）",

            {
                title: "村晚（宋·雷震）",
                content: `草满池塘水满陂，山衔落日浸寒漪。\n牧童归去横牛背，短笛无腔信口吹。`
            },
            {
                title: "鸟鸣涧（唐·王维）",

            {
                title: "凉州词（唐·王之涣）",

            {
                title: "送元二使安西（唐·王维）",

            {
                title: "秋夜将晓出篱门迎凉有感（宋·陆游）",

            {
                title: "黄鹤楼送孟浩然之广陵（唐·李白）",

            {
                title: "寒菊（宋·郑思肖）",

            {
                title: "乡村四月（宋·翁卷）",

            // 六年级上册
            {

            {

            {

            {

            },
            {
                title: "春日（宋·朱熹）",
                content: `胜日寻芳泗水滨，无边光景一时新。\n等闲识得东风面，万紫千红总是春。`
            },
            {
                title: "回乡偶书（唐·贺知章）",
                content: `少小离家老大回，乡音无改鬓毛衰。\n儿童相见不相识，笑问客从何处来。`
            },
            {
                title: "浪淘沙（唐·刘禹锡）",
                content: `九曲黄河万里沙，浪淘风簸自天涯。\n如今直上银河去，同到牵牛织女家。`
            },
            {
                title: "江南春（唐·杜牧）",
                content: `千里莺啼绿映红，水村山郭酒旗风。\n南朝四百八十寺，多少楼台烟雨中。`
            },
            {
                title: "书湖阴先生壁（宋·王安石）",
                content: `茅檐长扫净无苔，花木成畦手自栽。\n一水护田将绿绕，两山排闼送青来。`
            },
            
            // 六年级下册
            {
                title: "寒食（唐·韩翃）",
                content: `春城无处不飞花，寒食东风御柳斜。\n日暮汉宫传蜡烛，轻烟散入五侯家。`
            },
            {
                title: "迢迢牵牛星（汉·佚名）",
                content: `迢迢牵牛星，皎皎河汉女。\n纤纤擢素手，札札弄机杼。\n终日不成章，泣涕零如雨。\n河汉清且浅，相去复几许。\n盈盈一水间，脉脉不得语。`
            },
            {
                title: "十五夜望月（唐·王建）",
                content: `中庭地白树栖鸦，冷露无声湿桂花。\n今夜月明人尽望，不知秋思落谁家。`
            },
            {
                title: "长歌行（汉乐府）",
                content: `青青园中葵，朝露待日晞。\n阳春布德泽，万物生光辉。\n常恐秋节至，焜黄华叶衰。\n百川东到海，何时复西归？\n少壮不努力，老大徒伤悲。`
            },
            {
                title: "马诗（唐·李贺）",
                content: `大漠沙如雪，燕山月似钩。\n何当金络脑，快走踏清秋。`
            },
            {
                title: "石灰吟（明·于谦）",
                content: `千锤万凿出深山，烈火焚烧若等闲。\n粉骨碎身浑不怕，要留清白在人间。`
            },
            {
                title: "竹石（清·郑燮）",
                content: `咬定青山不放松，立根原在破岩中。\n千磨万击还坚劲，任尔东西南北风。`
            },
            {
                title: "采薇（节选）（诗经）",
                content: `昔我往矣，杨柳依依。\n今我来思，雨雪霏霏。\n行道迟迟，载渴载饥。\n我心伤悲，莫知我哀！`
            },
            {
                title: "送杜少府之任蜀州（唐·王勃）",
                content: `城阙辅三秦，风烟望五津。\n与君离别意，同是宦游人。\n海内存知己，天涯若比邻。\n无为在歧路，儿女共沾巾。`
            },
            {
                title: "春夜喜雨（唐·杜甫）",
                content: `好雨知时节，当春乃发生。\n随风潜入夜，润物细无声。\n野径云俱黑，江船火独明。\n晓看红湿处，花重锦官城。`
            },
            {
                title: "江畔独步寻花（唐·杜甫）",
                content: `黄四娘家花满蹊，千朵万朵压枝低。\n留连戏蝶时时舞，自在娇莺恰恰啼。`
            },
            {
                title: "早春呈水部张十八员外（唐·韩愈）",
                content: `天街小雨润如酥，草色遥看近却无。\n最是一年春好处，绝胜烟柳满皇都。`
            },
            {
                title: "泊船瓜洲（宋·王安石）",
                content: `京口瓜洲一水间，钟山只隔数重山。\n春风又绿江南岸，明月何时照我还。`
            },
            {
                title: "游园不值（宋·叶绍翁）",
                content: `应怜屐齿印苍苔，小扣柴扉久不开。\n春色满园关不住，一枝红杏出墙来。`
            },
            {
                title: "卜算子·送鲍浩然之浙东（宋·王观）",
                content: `水是眼波横，山是眉峰聚。\n欲问行人去那边？眉眼盈盈处。\n才始送春归，又送君归去。\n若到江南赶上春，千万和春住。`
            },
            {
                title: "浣溪沙（宋·苏轼）",
                content: `游蕲水清泉寺，寺临兰溪，溪水西流。\n山下兰芽短浸溪，松间沙路净无泥。\n萧萧暮雨子规啼。\n谁道人生无再少？门前流水尚能西！\n休将白发唱黄鸡。`
            },
            {
                title: "清平乐（宋·黄庭坚）",
                content: `春归何处？寂寞无行路。\n若有人知春去处，唤取归来同住。\n春无踪迹谁知？除非问取黄鹂。\n百啭无人能解，因风飞过蔷薇。`
            }
        ];

        // 获取DOM元素
        const poemDisplay = document.getElementById('poemDisplay');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const showAnswerBtn = document.getElementById('showAnswerBtn');
        const answerModal = document.getElementById('answerModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalPoem = document.getElementById('modalPoem');
        const closeModalBtn = document.getElementById('closeModalBtn');

        let intervalId = null;
        let currentPoemIndex = -1;

        // 开始随机滚动
        startBtn.addEventListener('click', function() {
            startBtn.disabled = true;
            stopBtn.disabled = false;
            showAnswerBtn.disabled = true;
            
            intervalId = setInterval(function() {
                currentPoemIndex = Math.floor(Math.random() * poems.length);
                poemDisplay.textContent = poems[currentPoemIndex].title;
            }, 100);
        });

        // 暂停滚动
        stopBtn.addEventListener('click', function() {
            clearInterval(intervalId);
            startBtn.disabled = false;
            stopBtn.disabled = true;
            showAnswerBtn.disabled = false;
        });

        // 显示答案
        showAnswerBtn.addEventListener('click', function() {
            if (currentPoemIndex >= 0) {
                modalTitle.textContent = poems[currentPoemIndex].title;
                modalPoem.textContent = poems[currentPoemIndex].content;
                answerModal.style.display = 'flex';
            }
        });

        // 关闭弹窗
        closeModalBtn.addEventListener('click', function() {
            answerModal.style.display = 'none';
        });

        // 点击模态框外部关闭
        answerModal.addEventListener('click', function(e) {
            if (e.target === answerModal) {
                answerModal.style.display = 'none';
            }
        });
    </script>
</body>
