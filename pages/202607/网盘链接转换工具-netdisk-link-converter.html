<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>网盘链接转换工具</title>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        /* ===== CSS 变量定义 ===== */
        :root {
            --primary-color: #053063;
            --primary-hover: #042a56;
            --background-color: #f4f6f9;
            --container-bg: #ffffff;
            --text-color: #333333;
            --text-secondary: #666666;
            --input-bg: #ffffff;
            --input-border: #e0e4ea;
            --input-focus: var(--primary-color);
            --button-text: #ffffff;
            --button-bg: var(--primary-color);
            --button-hover: var(--primary-hover);
            --label-color: var(--primary-color);
            --toast-bg: rgba(0,0,0,0.8);
            --toast-text: #ffffff;
            --shadow-color: rgba(5, 48, 99, 0.1);
            --shadow-hover: rgba(5, 48, 99, 0.15);
            --icon-color: var(--primary-color);
            --button-icon-color: var(--button-text);
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --error-color: #ef4444;
            --border-radius: 8px;
            --border-radius-sm: 6px;
            --transition: all 0.3s ease;
        }

        /* ===== 暗色主题变量 ===== */
        [data-theme="dark"] {
            --primary-color: #5dadec;
            --primary-hover: #4a9bd1;
            --background-color: #1a1a1a;
            --container-bg: #2c2c2c;
            --text-color: #e0e0e0;
            --text-secondary: #a0a0a0;
            --input-bg: #3a3a3a;
            --input-border: #555555;
            --input-focus: var(--primary-color);
            --button-text: #1a1a1a;
            --button-bg: var(--primary-color);
            --button-hover: var(--primary-hover);
            --label-color: var(--primary-color);
            --toast-bg: rgba(240, 240, 240, 0.9);
            --toast-text: #1a1a1a;
            --shadow-color: rgba(93, 173, 236, 0.2);
            --shadow-hover: rgba(93, 173, 236, 0.3);
            --icon-color: var(--primary-color);
            --button-icon-color: var(--button-text);
            --success-color: #34d399;
            --warning-color: #fbbf24;
            --error-color: #f87171;
        }

        /* ===== 基础样式重置 ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== 主体样式 ===== */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
            transition: var(--transition);
        }

        /* ===== 主容器样式 ===== */
        .container {
            width: 95%;
            max-width: 450px;
            background-color: var(--container-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px var(--shadow-color);
            padding: 20px;
            position: relative;
            margin: 0 auto;
            transition: var(--transition);
        }

        .container:hover {
            box-shadow: 0 6px 12px var(--shadow-hover);
        }

        /* ===== 主题切换按钮 ===== */
        #themeToggleBtn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            color: var(--icon-color);
            border-radius: var(--border-radius-sm);
            transition: var(--transition);
        }

        #themeToggleBtn:hover {
            background-color: color-mix(in srgb, var(--primary-color) 10%, transparent);
        }

        #themeToggleBtn svg {
            width: 20px;
            height: 20px;
            vertical-align: middle;
        }

        /* ===== 表单组件样式 ===== */
        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--label-color);
            font-weight: 500;
            font-size: 14px;
        }

        .form-label > svg {
            color: var(--icon-color);
            vertical-align: middle;
            margin-right: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            gap: 8px;
        }

        .input-field {
            flex-grow: 1;
            height: 44px;
            padding: 0 12px;
            border: 2px solid var(--input-border);
            border-radius: var(--border-radius-sm);
            font-size: 16px;
            background-color: var(--input-bg);
            color: var(--text-color);
            transition: var(--transition);
        }

        .input-field:focus {
            outline: none;
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary-color) 10%, transparent);
        }

        .input-field::placeholder {
            color: var(--text-secondary);
        }

        /* ===== 按钮样式 ===== */
        .copy-btn {
            padding: 0 16px;
            min-height: 44px;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            white-space: nowrap;
        }

        .copy-btn:hover {
            background-color: var(--button-hover);
            transform: translateY(-1px);
            box-shadow: 0 2px 8px var(--shadow-color);
        }

        .copy-btn:active {
            transform: translateY(0);
        }

        .action-button {
            width: 100%;
            height: 48px;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            border-radius: var(--border-radius);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .action-button:hover {
            background-color: var(--button-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow-color);
        }

        .action-button:active {
            transform: translateY(0);
        }

        .copy-btn > svg, .action-button > svg {
            color: var(--button-icon-color);
            margin-right: 8px;
        }

        /* ===== 输入区域样式 ===== */
        .input-area {
            margin-bottom: 20px;
        }

        textarea#sourceInput {
            width: 100%;
            min-height: 120px;
            max-height: 300px;
            resize: vertical;
            padding: 12px;
            border: 2px solid var(--input-border);
            border-radius: var(--border-radius-sm);
            font-size: 16px;
            font-family: inherit;
            background-color: var(--input-bg);
            color: var(--text-color);
            transition: var(--transition);
            line-height: 1.5;
            position: relative;
        }

        textarea#sourceInput:focus {
            outline: none;
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary-color) 10%, transparent);
        }

        textarea#sourceInput::placeholder {
            color: var(--text-secondary);
        }

        /* 拖拽状态样式 */
        textarea#sourceInput.drag-over {
            border-color: var(--primary-color);
            background-color: color-mix(in srgb, var(--primary-color) 5%, var(--input-bg));
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary-color) 15%, transparent);
        }

        /* 拖拽提示 */
        .drag-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--primary-color);
            font-weight: 500;
            pointer-events: none;
            opacity: 0;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        textarea#sourceInput.drag-over + .drag-hint {
            opacity: 1;
        }

        /* ===== 网盘类型显示 ===== */
        .network-type {
            text-align: center;
            color: var(--label-color);
            margin-bottom: 20px;
            padding: 12px;
            background-color: color-mix(in srgb, var(--primary-color) 5%, transparent);
            border-radius: var(--border-radius-sm);
            border: 1px solid color-mix(in srgb, var(--primary-color) 20%, transparent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            transition: var(--transition);
        }

        .network-type > svg {
            color: var(--icon-color);
            margin-right: 8px;
        }

        .network-type svg, .form-label svg, .copy-btn svg, .action-button svg {
            margin-right: 8px;
        }

        /* ===== Toast通知样式 ===== */
        #toast {
            position: fixed;
            top: 24px;
            right: 24px;
            background-color: var(--success-color);
            color: white;
            padding: 16px 24px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            font-size: 14px;
            font-weight: 500;
            z-index: 1000;
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            display: flex;
            align-items: center;
            max-width: 300px;
        }

        #toast.show {
            opacity: 1;
            transform: translateX(0);
        }

        #toast.error {
            background-color: var(--error-color);
        }

        #toast.warning {
            background-color: var(--warning-color);
        }

        #toast::before {
            content: '✓';
            margin-right: 8px;
            font-weight: bold;
        }

        #toast.error::before {
            content: '✗';
        }

        #toast.warning::before {
            content: '⚠';
        }

        /* ===== 加载状态样式 ===== */
        .loading {
            position: relative;
            pointer-events: none;
            opacity: 0.7;
        }

        .loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin: -10px 0 0 -10px;
            border: 2px solid transparent;
            border-top: 2px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 1;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 按钮加载状态 */
        .action-button.loading {
            color: transparent;
        }

        .action-button.loading::after {
            border-top-color: var(--button-text);
        }

        /* 输入区域加载状态 */
        .input-area.loading textarea {
            background-color: color-mix(in srgb, var(--input-bg) 90%, var(--primary-color));
        }

        /* 处理进度条 */
        .progress-bar {
            width: 100%;
            height: 4px;
            background-color: color-mix(in srgb, var(--primary-color) 20%, transparent);
            border-radius: 2px;
            overflow: hidden;
            margin: 8px 0;
            opacity: 0;
            transition: var(--transition);
        }

        .progress-bar.show {
            opacity: 1;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary-color);
            border-radius: 2px;
            transition: width 0.3s ease;
            width: 0%;
        }

        /* ===== 响应式布局 ===== */
        @media screen and (max-width: 768px) {
            .container {
                margin: 16px;
                padding: 20px;
                max-width: calc(100vw - 32px);
            }
            
            .form-group {
                margin-bottom: 16px;
            }
            
            .input-wrapper {
                flex-direction: column;
                gap: 8px;
            }
            
            .copy-btn {
                width: 100%;
                margin-left: 0;
                justify-content: center;
            }
            
            .action-buttons {
                display: flex;
                flex-direction: column;
                gap: 12px;
            }
            
            .action-button {
                width: 100%;
                height: 48px;
                font-size: 16px;
            }
            
            textarea#sourceInput {
                min-height: 100px;
                font-size: 16px; /* 防止iOS缩放 */
            }
            
            .input-field {
                font-size: 16px; /* 防止iOS缩放 */
                height: 48px;
            }
        }
        
        @media screen and (max-width: 480px) {
            .container {
                margin: 12px;
                padding: 16px;
            }
            
            h1 {
                font-size: 20px;
                margin-bottom: 16px;
            }
            
            .form-label {
                font-size: 14px;
            }
            
            .network-type {
                font-size: 14px;
                padding: 10px;
            }
            
            .export-section {
                padding: 16px;
                margin-top: 20px;
            }
            
            .toast {
                top: 16px;
                right: 16px;
                left: 16px;
                max-width: none;
                padding: 12px 16px;
            }
        }
        
        @media screen and (max-width: 320px) {
            .container {
                margin: 8px;
                padding: 12px;
            }
            
            h1 {
                font-size: 18px;
            }
            
            .action-button {
                height: 44px;
                font-size: 14px;
            }
            
            .copy-btn {
                min-height: 44px;
                font-size: 12px;
                padding: 0 12px;
            }
        }

        @media (pointer: coarse) {
            .copy-btn, .action-button {
                min-height: 44px;
                padding: 0 15px;
            }
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .button-group .action-button {
            margin-top: 0;
            flex-grow: 1;
        }

        /* ===== 导出区域样式 ===== */
        .export-section {
            margin-top: 24px;
            padding: 20px;
            background-color: color-mix(in srgb, var(--primary-color) 3%, transparent);
            border-radius: var(--border-radius);
            border: 1px solid color-mix(in srgb, var(--primary-color) 15%, transparent);
            text-align: center;
            transition: var(--transition);
        }

        .export-section:hover {
            box-shadow: 0 2px 8px var(--shadow-color);
        }

        .export-section .action-button {
            width: auto;
            padding: 0 24px;
            margin-top: 12px;
            display: inline-flex;
            align-items: center;
        }

        .export-counter {
            color: var(--label-color);
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            margin-right: 15px;
        }

        .export-counter::before {
            content: '';
            width: 8px;
            height: 8px;
            background-color: var(--success-color);
            border-radius: 50%;
            margin-right: 8px;
        }

        /* ===== 开发者信息组件样式 ===== */
        .developer-trigger {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }
        
        .developer-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            color: var(--button-text);
            border: none;
            border-radius: 25px;
            padding: 12px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--shadow-color);
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }
        
        .developer-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--shadow-hover);
            background: linear-gradient(135deg, var(--primary-hover), var(--primary-color));
        }
        
        .btn-icon {
            font-size: 1.1rem;
        }
        
        .developer-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .developer-modal.show {
            opacity: 1;
            visibility: visible;
        }
        
        .developer-modal-content {
            background: var(--container-bg);
            backdrop-filter: blur(15px);
            border-radius: var(--border-radius);
            padding: 0;
            max-width: 400px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            transform: scale(0.9) translateY(20px);
            transition: all 0.3s ease;
            position: relative;
        }
        
        .developer-modal.show .developer-modal-content {
            transform: scale(1) translateY(0);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px 15px;
            border-bottom: 1px solid color-mix(in srgb, var(--text-color) 10%, transparent);
        }
        
        .modal-header h3 {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-color);
        }
        
        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            transition: all 0.2s ease;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .close-btn:hover {
            background: color-mix(in srgb, var(--text-color) 10%, transparent);
            color: var(--text-color);
        }
        
        .developer-details {
            padding: 25px;
            text-align: center;
        }
        
        .developer-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: var(--button-text);
            margin: 0 auto 15px;
            box-shadow: 0 8px 25px var(--shadow-color);
        }
        
        .developer-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 5px;
        }
        
        .developer-role {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 25px;
        }
        
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            background: color-mix(in srgb, var(--primary-color) 5%, transparent);
            border-radius: var(--border-radius-sm);
            transition: all 0.3s ease;
        }
        
        .contact-item:hover {
            background: color-mix(in srgb, var(--primary-color) 10%, transparent);
            transform: translateY(-2px);
        }
        
        .contact-icon {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }
        
        .contact-label {
            font-weight: 600;
            color: var(--text-color);
            min-width: 60px;
            text-align: left;
        }
        
        .contact-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        
        .contact-link:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }
        
        .wechat-id {
            font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
            font-weight: 600;
            color: var(--text-color);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s ease;
            position: relative;
        }
        
        .wechat-id:hover {
            background: color-mix(in srgb, var(--primary-color) 20%, transparent);
            color: var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 新增：主题切换按钮 -->
        <button id="themeToggleBtn" onclick="toggleTheme()">
            <!-- 图标将在 JS 中设置 -->
        </button>

        <div class="network-type" id="networkTypeArea">
            <i data-lucide="cloud"></i>等待识别网盘类型...
        </div>

        <div class="input-area">
            <textarea id="sourceInput" placeholder="粘贴网盘分享内容，如：我用夸克网盘分享了「文件名」，链接：https://... 提取码：xxxx

💡 提示：也可以拖拽文本文件到此处"></textarea>
            <div class="drag-hint">
                <i data-lucide="upload"></i>
                <span>释放文件以读取内容</span>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">
                <i data-lucide="file-text"></i>标题
            </label>
            <div class="input-wrapper">
                <input type="text" id="titleInput" class="input-field" placeholder="请输入文件标题">
                <button class="copy-btn" onclick="copyText('titleInput')">
                    <i data-lucide="copy"></i>复制
                </button>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">
                <i data-lucide="link"></i>链接
            </label>
            <div class="input-wrapper">
                <input type="text" id="linkInput" class="input-field" placeholder="请输入网盘链接">
                <button class="copy-btn" onclick="copyText('linkInput')">
                    <i data-lucide="copy"></i>复制
                </button>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">
                <i data-lucide="key"></i>提取码
            </label>
            <div class="input-wrapper">
                <input type="text" id="codeInput" class="input-field" placeholder="请输入提取码">
                <button class="copy-btn" onclick="copyText('codeInput')">
                    <i data-lucide="copy"></i>复制
                </button>
            </div>
        </div>

        <div class="button-group">
            <button class="action-button" onclick="generateLink()">
                <i data-lucide="share-2"></i>生成公众号链接
            </button>
            <button class="action-button" onclick="addToList()">

        // 性能优化：预编译常用正则表达式
        const commonPatterns = {

        // 缓存匹配结果以避免重复计算（性能优化版）
        const matchCache = new Map();
        const cacheAccessCount = new Map();
        const CACHE_SIZE_LIMIT = 100;
        const CACHE_CLEANUP_THRESHOLD = 150;
        let cacheHitCount = 0;
        let cacheMissCount = 0;

        /**
         * 智能缓存清理（基于LRU算法）
         */
        function cleanCache() {
            if (matchCache.size > CACHE_CLEANUP_THRESHOLD) {
                // 按访问频率排序，保留最常用的缓存
                const entries = Array.from(matchCache.entries())
                    .map(([key, value]) => [key, value, cacheAccessCount.get(key) || 0])
                    .sort((a, b) => b[2] - a[2]);
                
                matchCache.clear();
                cacheAccessCount.clear();
                
                // 保留访问频率最高的条目
                entries.slice(0, CACHE_SIZE_LIMIT).forEach(([key, value, count]) => {
                    matchCache.set(key, value);
                    cacheAccessCount.set(key, Math.max(1, Math.floor(count / 2)));
                });
            }
        }

        /**
         * 优化的文本匹配函数（带智能缓存）
         */
        function cachedMatch(text, regex, cacheKey) {
            // 优化缓存键生成，减少内存占用
            const textHash = text.length + '_' + (text.charCodeAt(0) || 0) + '_' + (text.charCodeAt(text.length - 1) || 0);
            const key = `${cacheKey}_${textHash}_${regex.source.slice(0, 30)}`;
            
            if (matchCache.has(key)) {
                cacheAccessCount.set(key, (cacheAccessCount.get(key) || 0) + 1);
                cacheHitCount++;
                return matchCache.get(key);
            }
            
            const result = text.match(regex);
            matchCache.set(key, result);
            cacheAccessCount.set(key, 1);
            cacheMissCount++;
            
            // 定期清理缓存
            if (matchCache.size % 50 === 0) {
                cleanCache();
            }
            
            return result;
        }

        /**
         * 获取缓存性能统计
         */
        function getCacheStats() {
            const total = cacheHitCount + cacheMissCount;
            return {
                hitRate: total > 0 ? (cacheHitCount / total * 100).toFixed(2) + '%' : '0%',
                cacheSize: matchCache.size,
                totalRequests: total
            };
        }

         * 清理所有缓存和内存

         */
        function parseSourceInput(text) {
            // 清空状态
            if (!text || !text.trim()) {
                updateNetworkType('cloud', '等待识别网盘类型...');
                clearFormInputs();
                return;
            }

            // 尝试匹配各种网盘类型
            const matchResult = findNetdiskMatch(text.trim());
            
            if (matchResult) {
                const { type, config, matches } = matchResult;
                updateNetworkType('cloud', config.name);
                updateFormInputs(matches);
            } else {
                updateNetworkType('help-circle', '未识别网盘类型');
                clearFormInputs();

        }

        /**
         * 优化的查找匹配网盘类型函数（带缓存）
         * @param {string} input - 输入文本
         * @returns {Object|null} 匹配结果
         */
        function findNetdiskMatch(input) {
            // 检查缓存
            const cacheKey = `netdisk_${input.substring(0, 200)}`;
            if (matchCache.has(cacheKey)) {
                return matchCache.get(cacheKey);
            }

            let result = null;
            
            // 优化：按使用频率排序的网盘类型（常用的放前面）
            const priorityOrder = ['baidu', 'aliyun', 'quark', 'thunder', 'lanzhou', '115'];
            const otherTypes = Object.keys(networkTypes).filter(type => !priorityOrder.includes(type));
            const orderedTypes = [...priorityOrder, ...otherTypes];
            
            for (const type of orderedTypes) {
                const config = networkTypes[type];
                if (!config) continue;
                
                const linkMatch = cachedMatch(input, config.linkRegex, `link_${type}`);
                
                if (linkMatch) {
                    // 提取标题 - 使用优化的匹配和智能提取
                    let titleMatch = null;
                    if (Array.isArray(config.titleRegex)) {
                        for (let i = 0; i < config.titleRegex.length; i++) {
                            titleMatch = cachedMatch(input, config.titleRegex[i], `title_${type}_${i}`);
                            if (titleMatch) break;
                        }
                    } else if (config.titleRegex) {
                        titleMatch = cachedMatch(input, config.titleRegex, `title_${type}`);
                    }
                    
                    // 如果没有匹配到标题，尝试智能提取
                    if (!titleMatch) {
                        titleMatch = extractTitleFromText(input, linkMatch[1]);
                    }

                    // 提取验证码 - 使用优化的匹配
                    let codeMatch = null;
                    if (config.codeRegex) {
                        codeMatch = cachedMatch(input, config.codeRegex, `code_${type}`);
                    }
                    
                    result = {
                        type,
                        config,
                        matches: {
                            title: titleMatch ? (titleMatch[1] || titleMatch).trim() : '',
                            link: linkMatch[1],
                            code: codeMatch ? codeMatch[1] : ''
                        }
                    };
                    break;
                }
            }
            
            // 缓存结果
            matchCache.set(cacheKey, result);
            cleanCache();
            
            return result;
        }

         /**

         async function batchProcess() {
             const input = sourceInput.value.trim();
             
             if (!input) {
                 showToast('请先输入要批量处理的内容', 'warning');
                 return;
             }

             // 按行分割内容并预处理
             const lines = input.split('\n')
                 .map(line => line.trim())
                 .filter(line => line && line.length > 10); // 过滤掉太短的行
                 
             if (lines.length === 0) {
                 showToast('没有找到有效的内容行', 'warning');
                 return;
             }

             // 显示加载状态
             const batchBtn = event.target;
             const progressBar = document.getElementById('progressBar');
             const progressFill = document.getElementById('progressFill');
             const inputArea = document.querySelector('.input-area');
             
             batchBtn.classList.add('loading');
             progressBar.classList.add('show');
             inputArea.classList.add('loading');
             
             let processedCount = 0;
             let failedCount = 0;
             const totalLines = lines.length;
             const batchResults = []; // 批量收集结果
             const existingLinks = new Set(processedRecords.map(record => 
                 record['公众号链接'] ? extractLinkFromHtml(record['公众号链接']) : null
             ).filter(Boolean)); // 预建立重复检查集合

             try {
                 showToast('开始批量处理...', 'success', 1000);

                 // 批量处理，减少DOM操作
                 for (let i = 0; i < lines.length; i++) {
                     const line = lines[i];
                     
                     // 批量更新进度条（每10个更新一次）
                     if (i % 10 === 0 || i === lines.length - 1) {
                         const progress = ((i + 1) / totalLines) * 100;
                         progressFill.style.width = `${progress}%`;
                     }
                     
                     // 处理当前行
                     const result = await processSingleLine(line, processedCount, existingLinks);
                     
                     if (result.success) {
                         batchResults.push(result.data);
                         existingLinks.add(result.data.link); // 更新重复检查集合
                         processedCount++;
                     } else {
                         failedCount++;
                     }
                     
                     // 减少延迟，提高处理速度
                     if (i % 5 === 0) {
                         await new Promise(resolve => setTimeout(resolve, 20));
                     }
                 }
                 
                 // 批量添加结果到记录列表
                 if (batchResults.length > 0) {
                     processedRecords.push(...batchResults.map(result => ({
                         '公众号链接': result.formatted
                     })));
                     
                     // 批量添加到历史记录
                     batchResults.forEach(result => {
                         addToHistory({
                             title: result.title,
                             link: result.link,
                             code: result.code,
                             formatted: result.formatted,
                             type: 'batch_process'
                         });
                     });
                 }
                 
                 // 处理完成
                 updateExportCounter();
                 
                 if (processedCount > 0) {
                     showToast(`批量处理完成：成功 ${processedCount} 个，失败 ${failedCount} 个`);
                     sourceInput.value = '';
                     updateNetworkType('cloud', '等待识别网盘类型...');
                 } else {
                     showToast('未识别到有效的网盘链接', 'warning');
                 }
                 
             } catch (error) {
                 console.error('批量处理时发生错误:', error);
                 showToast('批量处理失败，请重试', 'error');
             } finally {
                 // 隐藏加载状态
                 batchBtn.classList.remove('loading');
                 inputArea.classList.remove('loading');
                 
                 setTimeout(() => {
                     progressBar.classList.remove('show');
                     progressFill.style.width = '0%';
                 }, 1000);
             }
         }

         /**
          * 处理单行数据的辅助函数
          */
         async function processSingleLine(line, processedCount, existingLinks) {
             const matchResult = findNetdiskMatch(line);
             
             if (!matchResult || !matchResult.matches.link) {
                 return { success: false };
             }
             
             const { matches } = matchResult;
             const validation = validateInput(matches);
             
             if (!validation.isValid || existingLinks.has(matches.link)) {
                 return { success: false };
             }
             
             const title = matches.title || `网盘资源 ${processedCount + 1}`;
             const formatted = buildFormattedLink(matches.link, title, matches.code, matchResult.type);
             
             return {
                 success: true,
                 data: {
                     title,
                     link: matches.link,
                     code: matches.code,
                     formatted
                 }
             };
         }

         /**
          * 构建格式化链接的辅助函数
          */
         function buildFormattedLink(link, title, code, networkType) {
             // 对于支持URL参数的网盘，将提取码添加到链接中
             let finalLink = link;
             if (code && networkType) {
                 if (networkType === 'quark') {
                     // 夸克网盘：添加pwd参数
                     finalLink = link.includes('?') ? `${link}&pwd=${code}` : `${link}?pwd=${code}`;
                 } else if (networkType === 'baidu') {
                     // 百度网盘：添加pwd参数
                     finalLink = link.includes('?') ? `${link}&pwd=${code}` : `${link}?pwd=${code}`;
                 }
                 // 其他网盘类型可以在这里添加相应的参数处理逻辑
             }
             
             let resultText = `<a href="${finalLink}">`;
             resultText += title ? `点击此处获取「${title}」资料包` : '点击此处获取资料包';
             
             // 对于不支持URL参数的网盘，仍然在文本中显示提取码
             if (code && (!networkType || !['quark', 'baidu'].includes(networkType))) {
                 resultText += ` 提取码：${code}`;
             }
             
             resultText += '</a>';
             return resultText;
         }

         /**
          * 从HTML中提取链接的辅助函数
          */
         function extractLinkFromHtml(html) {
             const match = html.match(/href="([^"]+)"/);
             return match ? match[1] : null;
         }

         /**
          * 智能标题提取函数
          * 当正则表达式无法匹配时，尝试从文本中智能提取标题
          */
         function extractTitleFromText(text, link) {
              // 移除链接本身，避免干扰
              let cleanText = text.replace(link, '').trim();
              
              // 尝试多种标题提取模式（按优先级排序）
              const titlePatterns = [
                  // 1. 书名号、方括号等包围的内容（最高优先级）
                  /《([^》]+)》/,
                  /【([^】]+)】/,
                  /\[([^\]]+)\]/,
                  /「([^」]+)」/,
                  /『([^』]+)』/,
                  /\(([^\)]{3,30})\)/,
                  
                  // 2. 关键词后的内容
                  /(?:标题|名称|文件名)[：:\s]*([^\n\r]{2,50})/,
                  /(?:分享|资源|文件|资料|内容)[：:\s]*([^\n\r]{2,50})/,
                  /(?:课程|教程|视频|音频|图片)[：:\s]*([^\n\r]{2,50})/,
                  
                  // 3. 冒号后的内容
                  /[：:][\s]*([^\n\r]{3,50})/,
                  
                  // 4. 行首的标题（去除特殊字符）
                  /^[\s\-=*#•]*([^\n\r]{3,50})/,
                  
                  // 5. 提取第一行有意义的文本（最低优先级）
                  /([\u4e00-\u9fa5a-zA-Z0-9][\u4e00-\u9fa5a-zA-Z0-9\s]{2,30})/
              ];
              
              for (const pattern of titlePatterns) {
                  const match = cleanText.match(pattern);
                  if (match && match[1]) {
                      let title = match[1].trim();
                      
                      // 清理标题中的多余空格和特殊字符
                      title = title.replace(/[\s]+/g, ' ').replace(/^[\-=*#•\s]+|[\-=*#•\s]+$/g, '');
                      
                      // 过滤掉无意义的标题
                      if (title.length >= 2 && 
                          !title.match(/^[\d\s\-_=*#•]+$/) && // 不是纯数字或符号
                          !title.includes('http') && // 不包含链接
                          !title.match(/^[a-zA-Z0-9]{4,6}$/) && // 不是提取码格式
                          !title.match(/^(提取码|密码|验证码|分享码)/) && // 不是提取码相关
                          !title.match(/^(点击|复制|下载|保存)/) // 不是操作指令
                      ) {
                          return [null, title]; // 返回类似正则匹配的格式
                      }
                  }
              }
              
              return null;
          }

        /**
         * 更新导出计数显示
         */
        function updateExportCounter() {
            const counter = document.querySelector('.export-counter');
            if (counter) {
                counter.textContent = `已处理 ${processedRecords.length} 条记录`;
            }
        }

        // ===== 历史记录功能 =====
        /**
         * 保存历史记录到本地存储
         */
        function saveHistoryToStorage() {
            try {
                localStorage.setItem('netdisk_converter_history', JSON.stringify(historyRecords));
            } catch (error) {
                console.error('保存历史记录失败:', error);
            }
        }

        /**
         * 从本地存储加载历史记录
         */
        function loadHistoryFromStorage() {
            try {
                const stored = localStorage.getItem('netdisk_converter_history');
                if (stored) {
                    historyRecords = JSON.parse(stored);
                    // 限制历史记录数量
                    if (historyRecords.length > MAX_HISTORY_SIZE) {
                        historyRecords = historyRecords.slice(-MAX_HISTORY_SIZE);
                        saveHistoryToStorage();
                    }
                }
            } catch (error) {
                console.error('加载历史记录失败:', error);
                historyRecords = [];
            }
        }

        /**
         * 添加记录到历史
         * @param {Object} record - 要添加的记录
         */
        function addToHistory(record) {
            const historyItem = {
                ...record,
                timestamp: Date.now(),
                id: Date.now() + Math.random().toString(36).substr(2, 9)
            };
            
            // 检查是否已存在相同链接
            const existingIndex = historyRecords.findIndex(item => 
                item.link === record.link
            );
            
            if (existingIndex !== -1) {
                // 更新现有记录的时间戳
                historyRecords[existingIndex] = historyItem;
            } else {
                // 添加新记录
                historyRecords.push(historyItem);
                
                // 限制历史记录数量
                if (historyRecords.length > MAX_HISTORY_SIZE) {
                    historyRecords.shift(); // 移除最旧的记录
                }
            }
            
            // 按时间戳排序（最新的在前）
            historyRecords.sort((a, b) => b.timestamp - a.timestamp);
            
            saveHistoryToStorage();
        }

        /**
         * 清空历史记录
         */
        function clearHistory() {
            if (confirm('确定要清空所有历史记录吗？此操作不可撤销。')) {
                historyRecords = [];
                saveHistoryToStorage();
                showToast('历史记录已清空');
            }
        }

        /**
         * 获取历史记录（按时间排序）
         * @param {number} limit - 返回记录数量限制
         * @returns {Array} 历史记录数组
         */
        function getHistory(limit = 10) {
            return historyRecords.slice(0, limit);
        }

        async function checkClipboardOnLoad() {
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    const permission = await navigator.permissions.query({ name: 'clipboard-read', allowWithoutGesture: false });
                    if (permission.state === 'granted' || permission.state === 'prompt') {
                        const text = await navigator.clipboard.readText();
                        if (text) {
                            let isNetworkLink = false;
                            for (const type in networkTypes) {
                                if (text.match(networkTypes[type].linkRegex)) {
                                    isNetworkLink = true;
                                    break;
                                }
                            }

                            if (isNetworkLink) {
                                setTimeout(() => {
                                    if (confirm('检测到剪贴板中的网盘分享内容，是否自动填充？')) {
                                        sourceInput.value = text;
                                        const event = new Event('input', { bubbles: true, cancelable: true });
                                        sourceInput.dispatchEvent(event);
                                    }
                                }, 100);
                            }
                        }
                    } else {
                        console.log('剪贴板读取权限被拒绝。');
                    }
                } else {
                    console.log('浏览器不支持剪贴板读取 API 或非安全上下文。');
                }
            } catch (err) {
                console.error('读取剪贴板失败:', err);
            }
        }

        window.addEventListener('load', () => {
            checkClipboardOnLoad(); // 检查剪贴板
            applyInitialTheme(); // 应用初始主题
        });

        // ===== 数据验证函数 =====
        /**
         * 验证URL格式
         * @param {string} url - 要验证的URL
         * @returns {boolean} 是否为有效URL
         */
        function isValidUrl(url) {
            try {
                new URL(url);
                return true;
            } catch {
                return false;
            }
        }

        /**
         * 验证输入数据
         * @param {Object} data - 包含title, link, code的对象
         * @returns {Object} 验证结果
         */
        function validateInput(data) {
            const errors = [];
            
            if (!data.link || !data.link.trim()) {
                errors.push('链接不能为空');
            } else if (!isValidUrl(data.link.trim())) {
                errors.push('链接格式不正确');
            }
            
            if (data.title && data.title.length > 100) {
                errors.push('标题长度不能超过100个字符');
            }
            
            if (data.code && data.code.length > 20) {
                errors.push('提取码长度不能超过20个字符');
            }
            
            return {
                isValid: errors.length === 0,
                errors: errors
            };
        }

        /**
         * 添加到列表功能（改进版）
         */
        function addToList() {
            const title = titleInput.value.trim();
            const link = linkInput.value.trim();
            const code = codeInput.value.trim();

            // 验证输入
            const validation = validateInput({ title, link, code });
            if (!validation.isValid) {
                showToast(`输入错误：${validation.errors.join('，')}`, 'error');
                return;
            }

            // 检查是否重复
            const isDuplicate = processedRecords.some(record => record['公众号链接'] && record['公众号链接'].includes(link));
            if (isDuplicate) {
                showToast('该链接已存在于列表中', 'warning');
                return;
            }

            try {
                // 检测网盘类型
                const matchResult = findNetdiskMatch(link);
                const networkType = matchResult ? matchResult.type : null;
                
                // 使用统一的链接构建函数
                const resultText = buildFormattedLink(link, title, code, networkType);

                processedRecords.push({
                    '公众号链接': resultText 
                });

                // 添加到历史记录
                addToHistory({
                    title: title,
                    link: link,
                    code: code,
                    formatted: resultText,
                    type: 'manual_add'
                });

                exportCounter.textContent = `列表中有 ${processedRecords.length} 条记录`;

                // 清空输入框
                clearFormInputs();
                sourceInput.value = '';
                updateNetworkType('cloud', '等待识别网盘类型...');

                showToast('已成功添加到列表');
            } catch (error) {
                console.error('添加到列表时发生错误:', error);
                showToast('添加失败，请重试', 'error');
            }
        }

        async function exportToExcel() {
            if (processedRecords.length === 0) {
                showToast('列表为空，没有可导出的记录', 'warning');
                return;
            }

            // 显示加载状态
            const exportBtn = event.target;
            const exportSection = document.querySelector('.export-section');
            
            exportBtn.classList.add('loading');
            exportSection.classList.add('loading');

            try {
                // 显示处理提示
                showToast('正在生成Excel文件...', 'success', 1000);
                
                // 添加延迟，让用户看到加载状态
                await new Promise(resolve => setTimeout(resolve, 500));

                const ws = XLSX.utils.json_to_sheet(processedRecords, {
                    header: ['公众号链接']
                });

                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, '网盘链接');

                // 生成文件名（包含时间戳）
                const now = new Date();
                const timestamp = now.getFullYear() + 
                    String(now.getMonth() + 1).padStart(2, '0') + 
                    String(now.getDate()).padStart(2, '0') + '_' +
                    String(now.getHours()).padStart(2, '0') + 
                    String(now.getMinutes()).padStart(2, '0');
                const filename = `网盘链接导出_${timestamp}.xlsx`;

                XLSX.writeFile(wb, filename);
                showToast(`成功导出 ${processedRecords.length} 条记录`);
            } catch (error) {
                console.error("导出 Excel 失败:", error);
                showToast('导出 Excel 文件失败', 'error');
            } finally {
                // 隐藏加载状态
                exportBtn.classList.remove('loading');
                exportSection.classList.remove('loading');
            }
        }

        async function generateLink() {
            const title = titleInput.value;
            const link = linkInput.value;
            const code = codeInput.value;

            if (!link) {
                showToast('请先输入并识别网盘分享内容', 'warning');
                return;
            }

            // 显示加载状态
            const generateBtn = event.target;
            const inputArea = document.querySelector('.input-area');
            
            generateBtn.classList.add('loading');
            inputArea.classList.add('loading');

            try {
                // 添加小延迟，让用户看到加载状态
                await new Promise(resolve => setTimeout(resolve, 300));

                // 检测网盘类型
                const matchResult = findNetdiskMatch(link);
                const networkType = matchResult ? matchResult.type : null;
                
                // 使用统一的链接构建函数
                const resultText = buildFormattedLink(link, title, code, networkType);
                
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(resultText);
                    showToast('已复制公众号格式链接');
                } else {
                    // 降级方案：使用传统方法
                    const tempTextArea = document.createElement('textarea');
                    tempTextArea.value = resultText;
                    tempTextArea.style.position = 'fixed';
                    tempTextArea.style.opacity = '0';
                    document.body.appendChild(tempTextArea);
                    tempTextArea.select();
                    const success = document.execCommand('copy');
                    document.body.removeChild(tempTextArea);
                    
                    if (success) {
                        showToast('已复制公众号格式链接');
                    } else {
                        throw new Error('execCommand failed');
                    }
                }
            } catch (err) {
                console.error('复制失败:', err);
                showToast('复制失败，请手动复制', 'error');
            } finally {
                // 隐藏加载状态
                generateBtn.classList.remove('loading');
                inputArea.classList.remove('loading');
            }
        }

        // --- 新增：主题切换逻辑 ---
        function updateThemeIcon(theme) {
            if (!themeToggleBtn) return;
            themeToggleBtn.innerHTML = theme === 'dark'
                ? '<i data-lucide="sun"></i>'  // 暗色模式显示太阳图标
                : '<i data-lucide="moon"></i>'; // 亮色模式显示月亮图标
            lucide.createIcons(); // 重新渲染图标
        }

        function applyInitialTheme() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            let currentTheme = savedTheme || (prefersDark ? 'dark' : 'light');

            document.body.dataset.theme = currentTheme;
            updateThemeIcon(currentTheme);
        }

        function toggleTheme() {
            let currentTheme = document.body.dataset.theme || 'light';
            let newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.dataset.theme = newTheme;
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }



        // --- 主题切换逻辑结束 ---

        // --- 开发者信息组件功能 ---
        // 显示开发者信息弹出框
        function showDeveloperInfo() {
            const modal = document.getElementById('developerModal');
            modal.classList.add('show');
            document.body.style.overflow = 'hidden';
        }
        
        // 隐藏开发者信息弹出框
        function hideDeveloperInfo(event) {
            // 如果点击的是模态框背景或者是关闭按钮，则关闭模态框
            if (!event || event.target === event.currentTarget || event.target.classList.contains('close-btn')) {
                const modal = document.getElementById('developerModal');
                modal.classList.remove('show');
                document.body.style.overflow = 'auto';
            }
        }
        
        // 复制微信号功能
        function copyWechatId(element) {
            const wechatId = element.getAttribute('data-wechat');
            
            // 使用现代剪贴板API
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(wechatId).then(() => {
                    showDeveloperCopyTooltip(element, '复制成功！');
                }).catch(() => {
                    fallbackCopyTextToClipboard(wechatId, element);
                });
            } else {
                // 降级方案
                fallbackCopyTextToClipboard(wechatId, element);
            }
        }
        
        // 降级复制方案
        function fallbackCopyTextToClipboard(text, element) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            textArea.style.top = '-999999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showDeveloperCopyTooltip(element, '复制成功！');
                } else {
                    showDeveloperCopyTooltip(element, '复制失败');
                }
            } catch (err) {
                showDeveloperCopyTooltip(element, '复制失败');
            }
            
            document.body.removeChild(textArea);
        }
        
        // 显示复制提示
        function showDeveloperCopyTooltip(element, message) {
            // 创建临时提示元素
            const tooltip = document.createElement('div');
            tooltip.textContent = message;
            tooltip.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: var(--primary-color);
                color: var(--button-text);
                padding: 8px 16px;
                border-radius: 6px;
                font-size: 0.9rem;
                z-index: 3000;
                opacity: 0;
                transition: opacity 0.3s ease;
            `;
            
            document.body.appendChild(tooltip);
            
            // 显示动画
            setTimeout(() => {
                tooltip.style.opacity = '1';
            }, 10);
            
            // 隐藏并移除
            setTimeout(() => {
                tooltip.style.opacity = '0';
                setTimeout(() => {
                    if (tooltip.parentNode) {
                        tooltip.parentNode.removeChild(tooltip);
                    }
                }, 300);
            }, 2000);
        }
        
        // 键盘事件支持
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                hideDeveloperInfo();
            }
        });
        
        // 为微信号添加键盘支持
        document.addEventListener('DOMContentLoaded', function() {
            const wechatElement = document.querySelector('.wechat-id');
            if (wechatElement) {
                wechatElement.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        copyWechatId(this);
                    }
                });
            }
        });
        // --- 开发者信息组件功能结束 ---
    </script>
<script>window.parent.postMessage({ action: "ready" }, "*"); 
 
window.console = new Proxy(console, {
  get(target, prop) {
    if (['log', 'warn', 'error'].includes(prop)) {
      return new Proxy(target[prop], {
        apply(fn, thisArg, args) {
          fn.apply(thisArg, args);
          window.parent.postMessage({ action: 'console', 
            type: prop, 
            args: args.map((arg) => {
              try {
                return JSON.stringify(arg).replace(/^["']|["']$/g, '');
              } catch (e) {
                return arg;
              }
            }) 
          }, '*');
        }
      });
    }
    return target[prop];
  }
});
