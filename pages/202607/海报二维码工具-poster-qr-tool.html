<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海报二维码工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #1d1d1f;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(20px);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 18px;
            opacity: 0.9;
            font-weight: 400;
        }

        .content {
            padding: 40px;
        }

        .upload-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .upload-card {
            background: #f8f9fa;
            border: 2px dashed #d1d5db;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .upload-card:hover {
            border-color: #007AFF;
            background: #f0f8ff;
            transform: translateY(-2px);
        }

        .upload-card.dragover {
            border-color: #007AFF;
            background: #e6f3ff;
        }

        .upload-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 16px;
            background: #007AFF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
        }

        .upload-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1d1d1f;
        }

        .upload-subtitle {
            font-size: 14px;
            color: #6e6e73;
        }

        .file-input {
            display: none;
        }

        .canvas-container {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: flex-start;
            margin: 30px 0;
            flex-wrap: nowrap;
        }

        .canvas-wrapper {
            position: relative;
            display: inline-block;
            flex-shrink: 0;
        }

        #canvas {
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            cursor: crosshair;
            display: block;
        }

        .qr-preview-container {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            width: 200px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            align-self: flex-start;
        }

        .qr-preview-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #1d1d1f;
        }

        .qr-preview {
            width: 150px;
            height: 150px;
            border-radius: 8px;
            background: #ffffff;
            border: 1px solid #e5e5e5;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 0 auto;
        }

        .qr-preview img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .qr-preview-placeholder {
            color: #9ca3af;
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 768px) {
            .canvas-container {
                flex-direction: row;
                align-items: flex-start;
                justify-content: center;
                flex-wrap: wrap;
            }
            
            .qr-preview-container {
                width: 150px;
                margin-top: 0;
            }
        }

        .selection-overlay {
            position: absolute;
            border: 2px solid #007AFF;
            background: rgba(0, 122, 255, 0.1);
            pointer-events: none;
            display: none;
            z-index: 10;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-primary {
            background: #007AFF;
            color: white;
        }

        .btn-primary:hover {
            background: #0056b3;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #f2f2f7;
            color: #007AFF;
            border: 1px solid #007AFF;
        }

        .btn-secondary:hover {
            background: #e6f3ff;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .preview-section {
            margin-top: 40px;
            text-align: center;
            display: none;
        }

        .preview-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #1d1d1f;
        }

        #previewCanvas {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .status {
            padding: 12px 20px;
            border-radius: 8px;
            margin: 16px 0;
            font-size: 14px;
            text-align: center;
        }

        .status.success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #10b981;
        }

        .status.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #ef4444;
        }

        .status.info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #3b82f6;
        }

        /* 联系方式样式 */
        .contact-section {
            margin-top: 40px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 12px;
            text-align: center;
        }

        .contact-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #1d1d1f;
        }

        .contact-content {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .contact-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .contact-label {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 10px;
            color: #6e6e73;
        }

        .contact-value {
            font-size: 18px;
            font-weight: 600;
            color: #007AFF;
        }

        .qr-code {
            width: 120px;
            height: 120px;
            border-radius: 8px;
            background: #ffffff;
            border: 1px solid #e5e5e5;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-top: 5px;
        }

        .qr-code img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        @media (max-width: 768px) {
            .upload-section {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .content {
                padding: 20px;
            }
            
            .header {
                padding: 30px 20px;
            }
            
            .header h1 {
                font-size: 28px;
            }
            
            .contact-content {
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>海报二维码工具</h1>
            <p>智能替换海报中的二维码，一键生成完美海报</p>
        </div>
        
        <div class="content">
            <div class="upload-section">
                <div class="upload-card" id="posterUpload">
                    <div class="upload-icon">📄</div>
                    <div class="upload-title">上传海报图片</div>
                    <div class="upload-subtitle">支持 JPG、PNG、WEBP 格式</div>
                    <input type="file" id="posterInput" class="file-input" accept="image/*">
                </div>
                
                <div class="upload-card" id="qrUpload">
                    <div class="upload-icon">📱</div>
                    <div class="upload-title">上传二维码图片</div>
                    <div class="upload-subtitle">支持微信二维码、收款码等</div>
                    <input type="file" id="qrInput" class="file-input" accept="image/*">
                </div>
            </div>

            <div id="status" class="status" style="display: none;"></div>

            <div class="canvas-container" id="canvasContainer" style="display: none;">
                <div class="canvas-wrapper">
                    <canvas id="canvas"></canvas>
                    <div class="selection-overlay" id="selectionOverlay"></div>
                </div>
                <div class="qr-preview-container">
                    <div class="qr-preview-title">二维码预览</div>
                    <div class="qr-preview" id="qrPreview">
                        <div class="qr-preview-placeholder">请上传二维码</div>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-secondary" id="resetBtn" style="display: none;">重新选择</button>
                <button class="btn btn-primary" id="confirmBtn" style="display: none;">确认区域</button>
                <button class="btn btn-primary" id="generateBtn" style="display: none;">生成海报</button>
                <button class="btn btn-secondary" id="downloadBtn" style="display: none;">下载海报</button>
            </div>

            <div class="preview-section" id="previewSection">
                <h3 class="preview-title">预览效果</h3>
                <canvas id="previewCanvas"></canvas>
            </div>
            
            <!-- 联系方式 -->
            <div class="contact-section">
                <div class="contact-title">联系我们</div>
                <div class="contact-content">
                    <div class="contact-item">
                        <div class="contact-label">公众号</div>
                        <div class="contact-value">东哥说AI</div>

    <script>
        class PosterQRGenerator {
            constructor() {
                this.posterImage = null;
                this.qrImage = null;
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.previewCanvas = document.getElementById('previewCanvas');
                this.previewCtx = this.previewCanvas.getContext('2d');
                this.isSelecting = false;
                this.startX = 0;
                this.startY = 0;
                this.selection = null;
                
                this.initEventListeners();
            }

            initEventListeners() {
                // 文件上传
                document.getElementById('posterUpload').addEventListener('click', () => {
                    document.getElementById('posterInput').click();
                });
                
                document.getElementById('qrUpload').addEventListener('click', () => {
                    document.getElementById('qrInput').click();
                });

                document.getElementById('posterInput').addEventListener('change', (e) => {
                    this.handleFileUpload(e, 'poster');
                });
                
                document.getElementById('qrInput').addEventListener('change', (e) => {
                    this.handleFileUpload(e, 'qr');
                });

                // 拖拽上传
                this.setupDragAndDrop();

                // 画布事件
                this.canvas.addEventListener('mousedown', (e) => this.startSelection(e));
                this.canvas.addEventListener('mousemove', (e) => this.updateSelection(e));
                this.canvas.addEventListener('mouseup', (e) => this.endSelection(e));

                // 按钮事件
                document.getElementById('resetBtn').addEventListener('click', () => this.resetSelection());
                document.getElementById('confirmBtn').addEventListener('click', () => this.confirmSelection());
                document.getElementById('generateBtn').addEventListener('click', () => this.generatePoster());
                document.getElementById('downloadBtn').addEventListener('click', () => this.downloadPoster());
            }

            setupDragAndDrop() {
                const setupDropZone = (elementId, inputId) => {
                    const dropZone = document.getElementById(elementId);
                    const input = document.getElementById(inputId);

                    dropZone.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        dropZone.classList.add('dragover');
                    });

                    dropZone.addEventListener('dragleave', () => {
                        dropZone.classList.remove('dragover');
                    });

                    dropZone.addEventListener('drop', (e) => {
                        e.preventDefault();
                        dropZone.classList.remove('dragover');
                        const files = e.dataTransfer.files;
                        if (files.length > 0) {
                            input.files = files;
                            input.dispatchEvent(new Event('change'));
                        }
                    });
                };

                setupDropZone('posterUpload', 'posterInput');
                setupDropZone('qrUpload', 'qrInput');
            }

            handleFileUpload(event, type) {
                const file = event.target.files[0];
                if (!file) return;

                if (!file.type.startsWith('image/')) {
                    this.showStatus('请选择图片文件', 'error');
                    return;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        if (type === 'poster') {
                            this.posterImage = img;
                            this.resetSelection();
                            this.showStatus('海报图片上传成功', 'success');
                        } else {
                            this.qrImage = img;
                            this.showQRPreview(e.target.result);
                            this.showStatus('二维码图片上传成功', 'success');
                        }
                        this.checkReady();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }

            checkReady() {
                if (this.posterImage && this.qrImage) {
                    this.displayCanvas();
                    document.getElementById('resetBtn').style.display = 'inline-block';
                }
            }

            displayCanvas() {
                const container = document.getElementById('canvasContainer');
                container.style.display = 'block';

                const maxWidth = Math.min(800, window.innerWidth - 80);
                const scale = maxWidth / this.posterImage.width;
                
                this.canvas.width = this.posterImage.width * scale;
                this.canvas.height = this.posterImage.height * scale;
                
                // 设置canvas实际显示尺寸
                this.canvas.style.width = this.canvas.width + 'px';
                this.canvas.style.height = this.canvas.height + 'px';
                
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.ctx.drawImage(this.posterImage, 0, 0, this.canvas.width, this.canvas.height);
                
                this.showStatus('请在海报上拖拽选择二维码区域', 'info');
            }

            startSelection(e) {
                if (!this.posterImage) return;
                
                const rect = this.canvas.getBoundingClientRect();
                this.startX = e.clientX - rect.left;
                this.startY = e.clientY - rect.top;
                this.isSelecting = true;
                
                document.getElementById('selectionOverlay').style.display = 'block';
            }

            updateSelection(e) {
                if (!this.isSelecting) return;
                
                const rect = this.canvas.getBoundingClientRect();
                const currentX = e.clientX - rect.left;
                const currentY = e.clientY - rect.top;
                
                const left = Math.min(this.startX, currentX);
                const top = Math.min(this.startY, currentY);
                const width = Math.abs(currentX - this.startX);
                const height = Math.abs(currentY - this.startY);
                
                const overlay = document.getElementById('selectionOverlay');
                overlay.style.left = left + 'px';
                overlay.style.top = top + 'px';
                overlay.style.width = width + 'px';
                overlay.style.height = height + 'px';
            }

            endSelection(e) {
                if (!this.isSelecting) return;
                
                const rect = this.canvas.getBoundingClientRect();
                const endX = e.clientX - rect.left;
                const endY = e.clientY - rect.top;
                
                this.selection = {
                    x: Math.min(this.startX, endX),
                    y: Math.min(this.startY, endY),
                    width: Math.abs(endX - this.startX),
                    height: Math.abs(endY - this.startY)
                };
                
                this.isSelecting = false;
                
                if (this.selection.width > 10 && this.selection.height > 10) {
                    document.getElementById('confirmBtn').style.display = 'inline-block';
                }
            }

            resetSelection() {
                this.selection = null;
                document.getElementById('selectionOverlay').style.display = 'none';
                document.getElementById('confirmBtn').style.display = 'none';
                document.getElementById('generateBtn').style.display = 'none';
                document.getElementById('previewSection').style.display = 'none';
                document.getElementById('downloadBtn').style.display = 'none';
                if (this.posterImage) {
                    this.displayCanvas();
                }
            }

            showQRPreview(src) {
                const qrPreview = document.getElementById('qrPreview');
                qrPreview.innerHTML = `<img src="${src}" alt="二维码预览">`;
            }

            confirmSelection() {
                if (!this.selection) return;
                
                document.getElementById('confirmBtn').style.display = 'none';
                document.getElementById('generateBtn').style.display = 'inline-block';
                this.showStatus('区域已确认，点击生成海报', 'success');
            }

            generatePoster() {
                if (!this.selection || !this.posterImage || !this.qrImage) return;

                const scale = this.posterImage.width / this.canvas.width;
                const actualSelection = {
                    x: this.selection.x * scale,
                    y: this.selection.y * scale,
                    width: this.selection.width * scale,
                    height: this.selection.height * scale
                };

                this.previewCanvas.width = this.posterImage.width;
                this.previewCanvas.height = this.posterImage.height;

                this.previewCtx.clearRect(0, 0, this.previewCanvas.width, this.previewCanvas.height);
                this.previewCtx.drawImage(this.posterImage, 0, 0);

                // 计算二维码缩放比例，保持正方形
                const qrSize = Math.min(actualSelection.width, actualSelection.height);
                const centerX = actualSelection.x + actualSelection.width / 2 - qrSize / 2;
                const centerY = actualSelection.y + actualSelection.height / 2 - qrSize / 2;

                this.previewCtx.drawImage(
                    this.qrImage,
                    centerX,
                    centerY,
                    qrSize,
                    qrSize
                );

                document.getElementById('previewSection').style.display = 'block';
                document.getElementById('downloadBtn').style.display = 'inline-block';
                document.getElementById('generateBtn').style.display = 'none';
                
                this.showStatus('海报生成成功！可以下载了', 'success');
            }

            downloadPoster() {
                const link = document.createElement('a');
                link.download = `poster-with-qr-${Date.now()}.png`;
                link.href = this.previewCanvas.toDataURL('image/png', 1.0);
                link.click();
            }

            showStatus(message, type) {
                const status = document.getElementById('status');
                status.textContent = message;
                status.className = `status ${type}`;
                status.style.display = 'block';
                
                setTimeout(() => {
                    status.style.display = 'none';
                }, 3000);
            }
        }

        // 初始化应用
        document.addEventListener('DOMContentLoaded', () => {
            new PosterQRGenerator();
        });
    </script>
</body>
</html>
