<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情侣的100种互动体验</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e6e6e6;
            overflow-x: hidden;
        }
        
        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(25, 25, 46, 0.85);
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            position: relative;
            padding: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .header h1 {
            font-size: 2.8rem;
            background: linear-gradient(45deg, #ff6b6b, #ff8e53, #ff6b6b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(255, 107, 107, 0.2);
        }
        
        .header p {
            font-size: 1.1rem;
            color: #b8b8d1;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }
        
        .version-switch {
            position: absolute;
            top: 15px;
            right: 15px;
            background: linear-gradient(45deg, #ff6b6b, #ff8e53);
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
            transition: all 0.3s ease;
            border: none;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .version-switch:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
        }
        
        .main-content {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .wheel-container {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
            background: rgba(30, 30, 56, 0.7);
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* 水晶球转盘设计 */
        .crystal-ball {
            position: relative;
            width: 280px;
            height: 280px;
            margin-bottom: 30px;
            perspective: 1000px;
        }
        
        .ball-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.1));
            box-shadow: inset 0 0 50px rgba(255, 255, 255, 0.5),
                        inset 0 0 100px rgba(255, 107, 107, 0.3),
                        0 0 50px rgba(255, 107, 107, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transform-style: preserve-3d;
        }
        
        .ball-inner {
            width: 90%;
            height: 90%;
            border-radius: 50%;
            background: rgba(25, 25, 46, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5);
        }
        
        .number-display {
            font-size: 3.5rem;
            font-weight: bold;
            color: #ff6b6b;
            text-shadow: 0 0 15px rgba(255, 107, 107, 0.7);
            margin-bottom: 5px;
            transition: all 0.5s ease;
        }
        
        .result-label {
            color: #b8b8d1;
            font-size: 1.1rem;
        }
        
        .floating-numbers {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .floating-number {
            position: absolute;
            color: rgba(255, 255, 255, 0.4);
            font-size: 1.2rem;
            font-weight: bold;
            animation: float 15s infinite linear;
            text-shadow: 0 0 5px rgba(255, 107, 107, 0.5);
        }
        
        @keyframes float {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-150px) translateX(100px) rotate(360deg);
                opacity: 0;
            }
        }
        
        .spin-btn {
            background: linear-gradient(45deg, #ff6b6b, #ff8e53);
            color: white;
            border: none;
            padding: 16px 50px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 7px 20px rgba(255, 107, 107, 0.4);
            transition: all 0.3s ease;
            margin-top: 15px;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        
        .spin-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: 0.5s;
            z-index: -1;
        }
        
        .spin-btn:hover::before {
            left: 100%;
        }
        
        .spin-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.6);
        }
        
        .spin-btn:active {
            transform: translateY(1px);
        }
        
        .spin-btn:disabled {
            background: #444;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .spin-btn:disabled::before {
            display: none;
        }
        
        .result-container {
            flex: 1;
            min-width: 300px;
            background: rgba(30, 30, 56, 0.7);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .result-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .result-header i {
            font-size: 2rem;
            color: #ff6b6b;
            margin-right: 15px;
        }
        
        .result-header h2 {
            font-size: 1.8rem;
            color: #e6e6e6;
        }
        
        #result {
            font-size: 1.8rem;
            text-align: center;
            font-weight: bold;
            color: #ff8e53;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(35, 35, 62, 0.5);
            border-radius: 15px;
            margin-bottom: 25px;
            line-height: 1.4;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.3);
            transition: all 0.5s ease;
        }
        
        .history-container {
            background: rgba(35, 35, 62, 0.5);
            border-radius: 15px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.2);
        }
        
        .history-item {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
        }
        
        .history-item:last-child {
            border-bottom: none;
        }
        
        .history-item:hover {
            background: rgba(255, 107, 107, 0.1);
            transform: translateX(5px);
        }
        
        .history-number {
            width: 30px;
            height: 30px;
            background: linear-gradient(45deg, #ff6b6b, #ff8e53);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-weight: bold;
            flex-shrink: 0;
        }
        
        .history-content {
            flex: 1;
        }
        
        .custom-section {
            background: rgba(30, 30, 56, 0.7);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .custom-section h3 {
            font-size: 1.5rem;
            color: #e6e6e6;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        
        .custom-section h3 i {
            margin-right: 10px;
            color: #ff6b6b;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        #custom-input {
            flex: 1;
            padding: 15px 20px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s;
            background: rgba(35, 35, 62, 0.7);
            color: #e6e6e6;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.3);
        }
        
        #custom-input:focus {
            background: rgba(45, 45, 78, 0.7);
            box-shadow: 0 0 0 2px #ff6b6b, inset 0 0 10px rgba(0, 0, 0, 0.3);
        }
        
        #custom-input::placeholder {
            color: #b8b8d1;
        }
        
        #add-btn {
            background: linear-gradient(45deg, #6c5ce7, #5b4dee);
            color: white;
            border: none;
            padding: 0 30px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3);
        }
        
        #add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(108, 92, 231, 0.4);
        }
        
        .custom-list {
            max-height: 200px;
            overflow-y: auto;
            padding-right: 10px;
        }
        
        .custom-item {
            background: rgba(35, 35, 62, 0.7);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.5s ease;
            border-left: 3px solid #ff6b6b;
            transition: all 0.3s ease;
        }
        
        .custom-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .delete-btn {
            color: #ff7675;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 1.2rem;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .delete-btn:hover {
            background: rgba(255, 118, 117, 0.1);
            transform: rotate(90deg);
        }
        
        .footer {
            text-align: center;
            padding: 25px 0 10px;
            color: #b8b8d1;
            font-size: 1.1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 20px;
        }
        
        .footer p {
            margin: 8px 0;
        }
        
        .contact {
            font-weight: bold;
            color: #ff8e53;
            font-size: 1.2rem;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .header h1 {
                font-size: 2.2rem;
                margin-top: 20px;
            }
            
            .version-switch {
                position: relative;
                top: 0;
                right: 0;
                margin: 15px auto;
                display: inline-flex;
            }
            
            .crystal-ball {
                width: 240px;
                height: 240px;
            }
        }
        
        .hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .heart {
            position: absolute;
            opacity: 0;
            animation: floatHeart 8s infinite linear;
            color: #ff6b6b;
        }
        
        @keyframes floatHeart {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-800px) rotate(360deg);
                opacity: 0;
            }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
                text-shadow: 0 0 15px rgba(255, 107, 107, 0.7);
            }
            50% {
                transform: scale(1.05);
                text-shadow: 0 0 25px rgba(255, 107, 107, 1);
            }
            100% {
                transform: scale(1);
                text-shadow: 0 0 15px rgba(255, 107, 107, 0.7);
            }
        }
        
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(30, 30, 56, 0.5);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(45deg, #ff6b6b, #ff8e53);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(45deg, #ff8e53, #ff6b6b);
        }
    </style>
</head>
<body>
    <div class="hearts" id="hearts-container"></div>
    
    <div class="container">
        <div class="header">
            <h1>情侣的100种互动体验</h1>
            <p>转动水晶球，发现属于你们的独特浪漫体验！每次旋转都可能带来意想不到的惊喜约会</p>
            <div class="version-switch" id="version-switch">
                <i class="fas fa-star"></i> 浪漫版
            </div>
        </div>
        
        <div class="main-content">
            <div class="wheel-container">
                <div class="crystal-ball">
                    <div class="ball-outer">
                        <div class="ball-inner">
                            <div class="number-display" id="current-number">00</div>
                            <div class="result-label">当前活动</div>

                <div class="result-header">
                    <i class="fas fa-history"></i>
                    <h2>历史记录</h2>
                </div>
                <div class="history-container" id="history">
                    <!-- 历史记录将通过JS动态添加 -->
                </div>
            </div>
        </div>
        
        <div class="custom-section">
            <h3><i class="fas fa-plus-circle"></i> 添加自定义活动</h3>

            <div id="custom-list" class="custom-list">

        <div class="footer">
            <p>让每一次旋转都成为你们爱情的独特记忆</p>
            <div class="contact">
                <p>作者：林义贵</p>
                <p>合作联系：vblue728</p>
            </div>
        </div>
    </div>

    <script>
        // 活动数据 - 包含100个情侣活动
        const activities = [

        if (activities.length < 100) {
            for (let i = activities.length; i < 100; i++) {
                activities.push(`特别情侣活动 #${i + 1}`);

        // 初始化变量
        let customActivities = [];
        let history = [];
        let historyCount = 0;
        let isSpinning = false;

        // DOM 元素
        const currentNumber = document.getElementById('current-number');
        const spinBtn = document.getElementById('spin-btn');
        const resultEl = document.getElementById('result');
        const customInput = document.getElementById('custom-input');
        const addBtn = document.getElementById('add-btn');
        const customList = document.getElementById('custom-list');

        const versionSwitch = document.getElementById('version-switch');
        const heartsContainer = document.getElementById('hearts-container');
        const floatingNumbers = document.getElementById('floating-numbers');
        
        // 初始化转盘
        function initWheel() {
            createFloatingNumbers();
            createHearts();
        }
        
        // 创建浮动数字
        function createFloatingNumbers() {
            floatingNumbers.innerHTML = '';
            for (let i = 0; i < 30; i++) {
                const number = Math.floor(Math.random() * 100);
                const numberElement = document.createElement('div');
                numberElement.className = 'floating-number';
                numberElement.textContent = number < 10 ? `0${number}` : number;
                numberElement.style.left = `${Math.random() * 100}%`;
                numberElement.style.top = `${Math.random() * 100}%`;
                numberElement.style.animationDuration = `${10 + Math.random() * 20}s`;
                numberElement.style.animationDelay = `${Math.random() * 5}s`;
                floatingNumbers.appendChild(numberElement);
            }
        }
        
        // 旋转转盘
        function spinWheel() {
            if (isSpinning) return;
            
            isSpinning = true;
            spinBtn.disabled = true;
            resultEl.textContent = "旋转中...";
            resultEl.style.color = "#b8b8d1";
            currentNumber.textContent = "--";
            currentNumber.classList.remove("pulse");
            
            // 创建浮动数字动画
            createFloatingNumbers();
            
            // 随机旋转数字
            let counter = 0;
            const interval = setInterval(() => {
                const randomNum = Math.floor(Math.random() * 100);
                currentNumber.textContent = randomNum < 10 ? `0${randomNum}` : randomNum;
                counter++;
                
                if (counter > 20) {
                    clearInterval(interval);
                    finishSpin();
                }
            }, 100);
        }
        
        // 完成旋转
        function finishSpin() {
            // 随机选择活动编号
            const selectedNumber = Math.floor(Math.random() * 100);
            const selectedActivity = activities[selectedNumber];
            
            // 显示结果
            setTimeout(() => {
                currentNumber.textContent = selectedNumber < 10 ? `0${selectedNumber}` : selectedNumber;
                currentNumber.classList.add("pulse");
                resultEl.innerHTML = `<span>${selectedActivity}</span>`;
                resultEl.style.color = "#ff8e53";
                resultEl.style.animation = 'fadeIn 0.8s ease';
                
                // 添加到历史记录
                addToHistory(selectedActivity, selectedNumber);
                
                isSpinning = false;
                spinBtn.disabled = false;
                
                // 移除动画以便下次使用
                setTimeout(() => {
                    resultEl.style.animation = '';
                }, 800);
            }, 500);
        }
        
        // 添加到历史记录（按顺序递增）
        function addToHistory(activity, number) {
            historyCount++;
            history.push({activity, number, id: historyCount});
            
            // 更新历史记录显示（按顺序显示）
            updateHistoryDisplay();
        }
        
        // 更新历史记录显示
        function updateHistoryDisplay() {
            historyList.innerHTML = '';
            
            // 按顺序显示历史记录（1,2,3...）
            history.forEach(item => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                historyItem.innerHTML = `
                    <div class="history-number">${item.id}</div>
                    <div class="history-content">
                        <div><strong>#${item.number < 10 ? '0' : ''}${item.number}</strong></div>
                        <div>${item.activity}</div>
                    </div>
                `;
                historyList.appendChild(historyItem);
            });
            
            // 滚动到底部
            historyList.scrollTop = historyList.scrollHeight;
        }
        
        // 添加自定义活动
        function addCustomActivity() {
            const activity = customInput.value.trim();
            if (activity) {
                customActivities.push(activity);
                activities[activities.length] = activity; // 添加到活动列表
                
                // 添加自定义活动到列表
                const activityItem = document.createElement('div');
                activityItem.className = 'custom-item';
                activityItem.innerHTML = `
                    <span>${activity}</span>
                    <button class="delete-btn" data-activity="${activity}">
                        <i class="fas fa-times"></i>
                    </button>
                `;
                customList.appendChild(activityItem);
                
                // 添加删除事件
                activityItem.querySelector('.delete-btn').addEventListener('click', function() {
                    const activityToRemove = this.getAttribute('data-activity');
                    removeCustomActivity(activityToRemove);
                });
                
                // 清空输入
                customInput.value = '';
            }
        }
        
        // 删除自定义活动
        function removeCustomActivity(activity) {
            customActivities = customActivities.filter(a => a !== activity);
            const index = activities.indexOf(activity);
            if (index !== -1) {
                activities[index] = `特别情侣活动 #${index + 1}`;
            }
            
            // 从UI中移除
            const items = document.querySelectorAll('.custom-item');
            items.forEach(item => {
                if (item.querySelector('span').textContent === activity) {
                    item.remove();
                }
            });
        }
        
        // 切换版本
        function toggleVersion() {
            isAdultMode = !isAdultMode;
            
            if (isAdultMode) {
                versionSwitch.innerHTML = '<i class="fas fa-heart"></i> 成人版';
                versionSwitch.style.background = 'linear-gradient(45deg, #6c5ce7, #5b4dee)';
                // 这里可以切换到成人版活动
            } else {
                versionSwitch.innerHTML = '<i class="fas fa-star"></i> 浪漫版';
                versionSwitch.style.background = 'linear-gradient(45deg, #ff6b6b, #ff8e53)';
                // 这里可以切换回浪漫版活动
            }
        }
        
        // 创建漂浮爱心
        function createHearts() {
            const heartCount = 20;
            
            for (let i = 0; i < heartCount; i++) {
                setTimeout(() => {
                    createHeart();
                }, i * 300);
            }
        }
        
        function createHeart() {
            const heart = document.createElement('div');
            heart.innerHTML = '❤';
            heart.className = 'heart';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 6 + 4) + 's';
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            heart.style.opacity = 0.5 + Math.random() * 0.5;
            
            heartsContainer.appendChild(heart);
            
            // 动画结束后移除爱心
            setTimeout(() => {
                heart.remove();
            }, 10000);
        }
        
        // 事件监听
        spinBtn.addEventListener('click', spinWheel);
        addBtn.addEventListener('click', addCustomActivity);
        versionSwitch.addEventListener('click', toggleVersion);
        
        // 初始化
        window.onload = initWheel;
        
        // 添加键盘支持
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !isSpinning) {
                spinWheel();
            }
        });
    </script>
</body>
</html>
