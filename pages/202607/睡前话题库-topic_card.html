<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>睡前话题库</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.2em;
            font-weight: 300;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }
        
        .topic-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px 80px 30px 30px;
            margin: 30px 0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-left: 5px solid #667eea;
            position: relative;
        }
        
        .topic-text {
            font-size: 1.3em;
            line-height: 1.6;
            color: #333;
            font-weight: 400;
            transition: all 0.3s ease;
        }
        
        .topic-text.rolling {
            color: #667eea;
            font-weight: 500;
        }
        
        .placeholder {
            color: #aaa;
            font-style: italic;
        }
        
        .btn.rolling {
            background: linear-gradient(45deg, #ff6b6b, #ee5a52);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
        }
        
        .btn.rolling:hover {
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
        }
        
        .topic-card.rolling {
            border-left: 5px solid #ff6b6b;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.15);
        }
        
        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
            font-weight: 500;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .topic-number {
            position: absolute;
            top: 15px;
            right: 20px;
            background: #667eea;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 500;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }
        
        
        @media (max-width: 600px) {
            .container {
                padding: 25px;
                margin: 10px;
            }
            
            .topic-card {
                padding: 25px 70px 25px 25px;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .topic-text {
                font-size: 1.1em;
            }
            
            .btn {
                padding: 12px 30px;
                font-size: 1em;
            }
            
            .topic-number {
                top: 12px;
                right: 15px;
                padding: 6px 12px;
                font-size: 0.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌙 睡前话题库</h1>
        <p class="subtitle">点击开始，话题滚动起来，再次点击停下来～</p>
        
        <div class="topic-card">
            <div class="topic-number" id="topicNumber" style="display: none;">1/100</div>
            <div class="topic-text placeholder" id="topicText">
                准备好了吗？点击下面的按钮开始吧～
            </div>
        </div>
        
        <button class="btn" id="actionBtn" onclick="toggleRolling()">
            🎯 开始抽取
        </button>
    </div>

    <script>
        const topics = [
            "今天最让你开心的一件事是什么？详细说说那个让你笑起来的瞬间。",
            "回想一下今天一整天，你觉得最有成就感的是完成了什么事？（不管多小）",
            "说说今天你学到的一个新东西，可能是新知识，也可能是关于自己的新发现。",
            "今天有没有特别留意到的小细节？比如一朵花、一个表情、一种味道？",
            "如果给今天的自己打分（1-10分），你会打几分？为什么是这个分数？",
            "今天有什么让你觉得暖心的、让你有点意外的事情？是什么事？",
            "你觉得最舒服的时候是做什么事？那种感觉像什么？ (比如窝在被子里?)",
            "告诉我一个你最近自己独立完成的事情（无论多小），你是怎么做到的？",
            "今天让你感觉最温暖的一个小瞬间是什么？（比如一个拥抱或一句话）",
            "想想看，今天发生的事里，有哪一件是你想明天再试一次的？为什么？",
            "如果你养的宠物（或最喜欢的玩具）突然会说话了，你觉得它第一句会跟你说什么？",
            "想象一下，你有一朵能实现一个愿望的七色花，你会许什么愿望？为什么这个愿望对你这么重要？",
            "假装我们的沙发变成了一艘宇宙飞船，你想驾驶它去哪里探险？ 路上会遇到什么？",
            "如果你可以变成任何动物一整天，你想变成什么？变成它之后你最想做什么特别的事？",
            "你觉得天上的云朵像什么？ (说出至少3种不同的想象！)",
            "假设你能小草/树叶，选一片你觉得最特别的，描述一下它的形状、颜色和边缘。",
            "观察一只小蚂蚁/小虫子，猜猜看它在忙什么？ 它要去哪里？",
            "想想冬天踩在雪地上的感觉（或想象），那是什么声音？脚底有什么感觉？",
            "你发现风吹过树叶/头发/窗帘时，它们是什么样子的？发出了什么声音？",
            "你觉得太阳光晒在身上暖暖的是种什么感觉？ 像被什么包裹着吗？",
            "描述一下你吃最喜欢的水果时第一口的味道和口感，果汁多吗？是脆的还是软的？",
            "说说你和好朋友今天一起玩得最开心的游戏，你们是怎么玩的？谁扮演了什么角色？",
            "告诉我你的好朋友最有意思的一个特点或者习惯是什么？为什么你觉得这有意思？",
            "如果你邀请好朋友来家里做客，你想特别为他准备什么活动或惊喜？",
            "回想一下，你最近帮助了谁？你是怎样帮助他/她的？帮完之后你心里什么感觉和心里的感受！",
            "吹泡泡的时候，你是怎么吹的？ 你最喜欢泡泡的什么样子？ (大的？飞得高的？)",
            "画画时，你最喜欢用哪几种颜色来搭配？用这些颜色的时候，你一般想画什么？",
            "讲一讲你最近画的一幅你特别满意的画，画里都有什么？画的时候你在想什么？",
            "唱你最喜欢的歌时，你觉得这首歌哪里最吸引你？是旋律、歌词还是某个感觉？",
            "跳舞的时候，你觉得最自由自在的动作是什么？ (比如旋转、蹦跳？) 做那个动作时你感觉怎么样？",
            "说说你觉得最好笑的动画片片段，具体说说那里发生了什么？哪些动作或语言逗笑你了？",
            "如果在儿童房里加一个超级好玩的玩具或设施，你希望它是什么？怎么玩？",
            "猜猜看，小狗对你摇尾巴的时候，它想对你说什么？",
            "你觉得冰箱里的灯为什么会自己亮起来？",
            "想一想，小汽车装上轮子就好比我们穿了鞋子穿靴子的小猫在森林里迷路了，突然它看见…\" （请你接着往下编！）",
            "只看这本故事书的封面，你觉得书里面主要讲了一个什么故事？猜猜主角要去做什么？",
            "仔细看这张图片（找一张细节丰富的图），告诉我图片上有什么人/动物？他们在哪里？正在做什么事？",
            "别说话，只用动作表演出你最喜欢的小动物的样子或它常做的事情，等我来猜猜看！",
            "如果让你给小朋友讲一个自己编的搞笑小故事，你想讲一个关于什么的故事？（可以先起个头）",
            "试试看，给圆圆的月亮编一句很短很短的诗歌。（比如：\"银月亮，挂天上，偷偷看，我梦乡\"）",
            "现在告诉我一个你的小秘密（可以是真实发生的，也可以是你想象出来的）！",
            "假装你现在要教一个外星人玩地球上的小游戏（比如捉迷藏），你会怎么教他规则？",
            "长大后最想学会做的一件事是什么？为什么这么想？",
            "假装你是一个小厨师，你要为家人做一道特别的魔法料理，你会用什么神奇食材？怎么做？",
            "现在你是一个探险家，你正走进一个神秘的古老森林，你会带上哪三样东西？ 为什么选它们？",
            "如果你是老师，今天下午你要带小朋友玩一个特别有意思的新游戏，你会玩什么？规则是什么？",
            "想象你是一个玩具设计师，你想设计一个什么样的新奇玩具？ 它怎么玩？",
            "假装你是公园里的一棵会说话的大树，你会对来玩耍的小朋友说什么？",
            "如果你能和故事里的反派角色（不一定是坏人）聊聊天（比如温和版的格格巫），你想问它什么问题？",
            "现在你是一只住在冰箱里的小精灵，你每天的工作是什么？ 最喜欢冰箱里的哪一层？",
            "扮演一个迷路的小朋友在找妈妈，你会怎么向好心人描述你的妈妈？（长什么样子？穿什么衣服？）",
            "描述一下你听到\"我爱你\"这句话时，内心的感觉和身体的感受（暖暖的？软软的？）。",
            "你觉得今天从早上起床到现在，你经历的最美丽/最有意思的一个小片段是什么？为什么选它？",
            "仔细想想，今天你有没有做一个让自己都感到有点小自豪的决定或者小举动？"
        ];
        
        let usedTopics = [];
        let currentTopicIndex = -1;
        let isRolling = false;
        let rollingInterval = null;
        let rollingSpeed = 80; // 毫秒
        
        function toggleRolling() {
            if (!isRolling) {
                startRolling();
            } else {
                stopRolling();
            }
        }
        
        function startRolling() {
            isRolling = true;
            const btn = document.getElementById('actionBtn');
            const topicText = document.getElementById('topicText');
            const topicCard = document.querySelector('.topic-card');
            
            // 更新按钮状态
            btn.textContent = '⏹️ 停止';
            btn.classList.add('rolling');
            topicText.classList.add('rolling');
            topicCard.classList.add('rolling');
            topicText.classList.remove('placeholder');
            
            // 开始滚动动画
            rollingInterval = setInterval(() => {
                const randomIndex = Math.floor(Math.random() * topics.length);
                topicText.textContent = topics[randomIndex];
            }, rollingSpeed);
        }
        
        function stopRolling() {
            isRolling = false;
            clearInterval(rollingInterval);
            
            const btn = document.getElementById('actionBtn');
            const topicText = document.getElementById('topicText');
            const topicCard = document.querySelector('.topic-card');
            
            // 选择最终话题
            if (usedTopics.length === topics.length) {
                usedTopics = [];
            }
            
            let availableTopics = topics.filter((topic, index) => !usedTopics.includes(index));
            let randomIndex = Math.floor(Math.random() * availableTopics.length);
            let selectedTopic = availableTopics[randomIndex];
            currentTopicIndex = topics.indexOf(selectedTopic);
            
            usedTopics.push(currentTopicIndex);
            
            // 显示最终话题
            topicText.textContent = selectedTopic;
            document.getElementById('topicNumber').textContent = `${usedTopics.length}/100`;
            document.getElementById('topicNumber').style.display = 'block';
            
            // 更新按钮状态
            btn.textContent = '🎲 再来一次';
            btn.classList.remove('rolling');
            topicText.classList.remove('rolling');
            topicCard.classList.remove('rolling');
        }
    </script>
</body>
</html>
