<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坦克大战现代复刻版</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #2c3e50;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            color: white;
            overflow: hidden;
        }
        h1 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #e74c3c;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
            border-radius: 5px;
            overflow: hidden;
        }
        canvas {
            background-color: #000;
            display: block;
        }
        .game-info {
            display: flex;
            justify-content: space-between;
            width: 800px;
            margin-bottom: 15px;
            font-size: 18px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            padding: 30px 50px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        .game-over h2 {
            color: #e74c3c;
            margin-top: 0;
        }
        .game-over p {
            font-size: 20px;
            margin-bottom: 20px;
        }
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        .control-info {
            margin-top: 20px;
            font-size: 16px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>坦克大战现代复刻版</h1>
    <div class="game-info">
        <div>分数: <span id="score">0</span></div>
        <div>生命: <span id="lives">3</span></div>
        <div>关卡: <span id="level">1</span></div>
    </div>
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="game-over" id="gameOver">
            <h2>游戏结束</h2>
            <p>最终分数: <span id="finalScore">0</span></p>
            <button class="btn" id="restartBtn">重新开始</button>
        </div>
    </div>
    <div class="control-info">
        <p>使用方向键移动坦克，按S键发射子弹</p>
    </div>

    <script>
        // 游戏常量
        const GAME_WIDTH = 800;
        const GAME_HEIGHT = 600;
        const TANK_SIZE = 30;
        const BULLET_SIZE = 6;
        const BULLET_SPEED = 7/6;
        const TANK_SPEED = 2/3;
        const ENEMY_SPEED = 1/3;
        const ENEMY_SHOOT_INTERVAL = 2000; // 敌坦发射间隔(毫秒)

        // 获取DOM元素
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const levelElement = document.getElementById('level');
        const gameOverElement = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');

        // 游戏状态
        const gameState = {
            player: null,
            enemies: [],
            bullets: [],
            obstacles: [],
            base: null,
            score: 0,
            lives: 3,
            level: 1,
            gameOver: false,
            keys: {
                up: false,
                down: false,
                left: false,
                right: false,
                shoot: false
            }
        };

        // 工具函数 - 碰撞检测
        function collides(a, b, aSize = TANK_SIZE, bSize = TANK_SIZE) {
            return a.x < b.x + bSize &&
                   a.x + aSize > b.x &&
                   a.y < b.y + bSize &&
                   a.y + aSize > b.y;
        }

        // 工具函数 - 随机数生成
        function random(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // 坦克类
        class Tank {
            constructor(x, y, color, isPlayer = false) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.isPlayer = isPlayer;
                this.direction = 'up';
                this.speed = isPlayer ? TANK_SPEED : ENEMY_SPEED;
                this.lastShootTime = 0;
                this.shootCooldown = isPlayer ? 500 : ENEMY_SHOOT_INTERVAL;
                this.lastCollisionTime = null; // 初始化碰撞冷却时间
                this.invincible = false; // 无敌状态
                this.hit = false; // 被击中状态
            }

            move() {
                if (this.isPlayer) {
                    // 玩家坦克移动
                    const originalX = this.x;
                    const originalY = this.y;

                    if (gameState.keys.up) {
                        this.direction = 'up';
                        this.y = Math.max(0, this.y - this.speed);
                    }
                    if (gameState.keys.down) {
                        this.direction = 'down';
                        this.y = Math.min(GAME_HEIGHT - TANK_SIZE, this.y + this.speed);
                    }
                    if (gameState.keys.left) {
                        this.direction = 'left';
                        this.x = Math.max(0, this.x - this.speed);
                    }
                    if (gameState.keys.right) {
                        this.direction = 'right';
                        this.x = Math.min(GAME_WIDTH - TANK_SIZE, this.x + this.speed);
                    }

                    // 检测与障碍物碰撞
                    let collided = false;
                    for (const obstacle of gameState.obstacles) {
                        if (collides(this, obstacle)) {
                            this.x = originalX;
                            this.y = originalY;
                            collided = true;
                            break;
                        }
                    }

                    // 如果没有与障碍物碰撞，检测与敌坦碰撞
                    if (!collided) {
                        // 添加碰撞冷却机制
                        const currentTime = Date.now();
                        if (!this.lastCollisionTime || currentTime - this.lastCollisionTime > 1000) {
                            for (const enemy of gameState.enemies) {
                                if (enemy !== this && collides(this, enemy)) {
                                    collided = true;
                                    // 玩家被敌方坦克碰撞，消耗生命值
                                    gameState.lives--;
                                    updateGameInfo();
                                    this.lastCollisionTime = currentTime;
                                    
                                    // 立即重置位置到初始位置
                                    gameState.player = new Tank(GAME_WIDTH / 2 - 100,
                                        GAME_HEIGHT - TANK_SIZE * 2, '#0066ff', true);
                                    // 设置短暂无敌时间
                                    gameState.player.invincible = true;
                                    setTimeout(() => {
                                        if (gameState.player) {
                                            gameState.player.invincible = false;
                                        }
                                    }, 2000);
                                    
                                    if (gameState.lives <= 0) {
                                        gameOver();
                                    }
                                    break;
                                }
                            }
                        }
                    }

                    // 如果没有与敌坦碰撞，检测与基地碰撞
                    if (!collided && gameState.base && collides(this, gameState.base)) {
                        this.x = originalX;
                        this.y = originalY;
                    }

                    // 发射子弹
                    if (gameState.keys.shoot) {
                        this.shoot();
                    }
                } else {
                    // 敌坦AI移动
                    if (random(1, 100) < 5) {
                        // 随机改变方向
                        const directions = ['up', 'down', 'left', 'right'];
                        this.direction = directions[random(0, 3)];
                    }

                    const newX = this.x;
                    const newY = this.y;

                    switch (this.direction) {
                        case 'up':
                            this.y = Math.max(0, this.y - this.speed);
                            break;
                        case 'down':
                            this.y = Math.min(GAME_HEIGHT - TANK_SIZE, this.y + this.speed);
                            break;
                        case 'left':
                            this.x = Math.max(0, this.x - this.speed);
                            break;
                        case 'right':
                            this.x = Math.min(GAME_WIDTH - TANK_SIZE, this.x + this.speed);
                            break;
                    }

                    // 检测与障碍物碰撞
                    let collided = false;
                    for (const obstacle of gameState.obstacles) {
                        if (collides(this, obstacle)) {
                            this.x = newX;
                            this.y = newY;
                            // 碰撞后改变方向
                            const directions = ['up', 'down', 'left', 'right'];
                            this.direction = directions[random(0, 3)];
                            collided = true;
                            break;
                        }
                    }

                    // 检测与其他敌坦碰撞
                    if (!collided) {
                        for (const enemy of gameState.enemies) {
                            if (enemy !== this && collides(this, enemy)) {
                                this.x = newX;
                                this.y = newY;
                                // 碰撞后改变方向
                                const directions = ['up', 'down', 'left', 'right'];
                                this.direction = directions[random(0, 3)];
                                collided = true;
                                break;
                            }
                        }
                    }

                    // 检测与玩家坦克碰撞
                    if (!collided && gameState.player && collides(this, gameState.player)) {
                        this.x = newX;
                        this.y = newY;
                        // 碰撞后改变方向
                        const directions = ['up', 'down', 'left', 'right'];
                        this.direction = directions[random(0, 3)];
                    }

                    // 检测与基地碰撞
                    if (!collided && gameState.base && collides(this, gameState.base)) {
                        this.x = newX;
                        this.y = newY;
                        // 碰撞后改变方向
                        const directions = ['up', 'down', 'left', 'right'];
                        this.direction = directions[random(0, 3)];
                    }

                    // 随机发射子弹
                    const currentTime = Date.now();
                    if (currentTime - this.lastShootTime > this.shootCooldown) {
                        if (random(1, 100) < 10) { // 10%的几率发射子弹
                            this.shoot();
                            this.lastShootTime = currentTime;
                        }
                    }
                }
            }

            shoot() {
                const currentTime = Date.now();
                if (currentTime - this.lastShootTime < this.shootCooldown) {
                    return;
                }

                this.lastShootTime = currentTime;

                // 计算子弹初始位置（坦克中心）
                let bulletX = this.x + TANK_SIZE / 2 - BULLET_SIZE / 2;
                let bulletY = this.y + TANK_SIZE / 2 - BULLET_SIZE / 2;

                // 根据坦克方向调整子弹位置和速度
                switch (this.direction) {
                    case 'up':
                        bulletY -= BULLET_SIZE;
                        gameState.bullets.push(new Bullet(bulletX, bulletY, 'up', this.isPlayer));
                        break;
                    case 'down':
                        bulletY += TANK_SIZE;
                        gameState.bullets.push(new Bullet(bulletX, bulletY, 'down', this.isPlayer));
                        break;
                    case 'left':
                        bulletX -= BULLET_SIZE;
                        gameState.bullets.push(new Bullet(bulletX, bulletY, 'left', this.isPlayer));
                        break;
                    case 'right':
                        bulletX += TANK_SIZE;
                        gameState.bullets.push(new Bullet(bulletX, bulletY, 'right', this.isPlayer));
                        break;
                }
            }

            draw() {
                // 如果是玩家且处于被击中状态，添加闪烁效果
                if (this.isPlayer && this.hit && Math.floor(Date.now() / 100) % 2 === 0) {
                    ctx.fillStyle = '#ff0000';
                } else {
                    ctx.fillStyle = this.color;
                }

                // 绘制坦克车身
                ctx.fillRect(this.x, this.y, TANK_SIZE, TANK_SIZE);

                // 绘制坦克炮管
                ctx.fillStyle = '#333';
                const cannonSize = TANK_SIZE / 2;
                const cannonWidth = TANK_SIZE / 6;
                const centerX = this.x + TANK_SIZE / 2;
                const centerY = this.y + TANK_SIZE / 2;

                switch (this.direction) {
                    case 'up':
                        ctx.fillRect(centerX - cannonWidth / 2, this.y - cannonSize,
                            cannonWidth, cannonSize + TANK_SIZE / 4);
                        break;
                    case 'down':
                        ctx.fillRect(centerX - cannonWidth / 2, this.y + TANK_SIZE - TANK_SIZE / 4,
                            cannonWidth, cannonSize);
                        break;
                    case 'left':
                        ctx.fillRect(this.x - cannonSize, centerY - cannonWidth / 2,
                            cannonSize + TANK_SIZE / 4, cannonWidth);
                        break;
                    case 'right':
                        ctx.fillRect(this.x + TANK_SIZE - TANK_SIZE / 4, centerY - cannonWidth / 2,
                            cannonSize, cannonWidth);
                        break;
                }

                // 绘制坦克轮子
                ctx.fillStyle = '#555';
                const wheelWidth = TANK_SIZE / 6;
                const wheelHeight = TANK_SIZE;
                // 左轮
                ctx.fillRect(this.x, this.y, wheelWidth, wheelHeight);
                // 右轮
                ctx.fillRect(this.x + TANK_SIZE - wheelWidth, this.y, wheelWidth, wheelHeight);

                // 如果处于无敌状态，绘制透明护盾
                if (this.isPlayer && this.invincible) {
                    ctx.strokeStyle = 'rgba(0, 255, 255, 0.7)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(this.x + TANK_SIZE / 2, this.y + TANK_SIZE / 2, TANK_SIZE / 2 + 5, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }
        }

        // 子弹类
        class Bullet {
            constructor(x, y, direction, isPlayer) {
                this.x = x;
                this.y = y;
                this.direction = direction;
                this.isPlayer = isPlayer;
                this.speed = BULLET_SPEED;
                this.color = isPlayer ? '#00ff00' : '#ff0000';
            }

            update() {
                switch (this.direction) {
                    case 'up':
                        this.y -= this.speed;
                        break;
                    case 'down':
                        this.y += this.speed;
                        break;
                    case 'left':
                        this.x -= this.speed;
                        break;
                    case 'right':
                        this.x += this.speed;
                        break;
                }

                // 检测是否超出画布
                if (this.x < 0 || this.x > GAME_WIDTH || this.y < 0 || this.y > GAME_HEIGHT) {
                    return true; // 需要移除
                }

                // 检测是否击中障碍物
                for (let i = 0; i < gameState.obstacles.length; i++) {
                    const obstacle = gameState.obstacles[i];
                    if (collides(this, obstacle, BULLET_SIZE, BULLET_SIZE)) {
                        // 移除障碍物
                        gameState.obstacles.splice(i, 1);
                        return true; // 需要移除子弹
                    }
                }

                // 检测是否击中基地
                if (gameState.base && collides(this, gameState.base, BULLET_SIZE, BULLET_SIZE)) {
                    // 如果是敌坦子弹击中基地
                    if (!this.isPlayer) {
                        gameState.base.alive = false;
                        gameOver();
                    }
                    return true; // 需要移除子弹
                }

                // 检测是否击中坦克
                if (this.isPlayer) {
                    // 玩家子弹击中敌坦
                    for (let i = 0; i < gameState.enemies.length; i++) {
                        const enemy = gameState.enemies[i];
                        if (collides(this, enemy, BULLET_SIZE, BULLET_SIZE)) {
                            gameState.enemies.splice(i, 1);
                            gameState.score += 100;
                            updateGameInfo();

                            // 检查是否所有敌坦都被消灭
                            if (gameState.enemies.length === 0) {
                                // 进入下一关
                                setTimeout(() => {
                                    nextLevel();
                                }, 1000);
                            }

                            return true; // 需要移除子弹
                        }
                    }
                } else {
                    // 敌坦子弹击中玩家
                        if (gameState.player && !gameState.player.invincible) {
                            // 更精确的碰撞检测
                            const player = gameState.player;
                            const bulletRadius = BULLET_SIZE / 2;
                            const playerRadius = TANK_SIZE / 2;
                            const bulletCenterX = this.x + bulletRadius;
                            const bulletCenterY = this.y + bulletRadius;
                            const playerCenterX = player.x + playerRadius;
                            const playerCenterY = player.y + playerRadius;
                            const dx = bulletCenterX - playerCenterX;
                            const dy = bulletCenterY - playerCenterY;
                            const distance = Math.sqrt(dx * dx + dy * dy);

                            if (distance < bulletRadius + playerRadius || collides(this, player, BULLET_SIZE, BULLET_SIZE)) {
                                // 玩家坦克被击中
                                console.log('玩家被击中! 当前生命值:', gameState.lives);
                                gameState.lives--;
                                console.log('减少生命值后:', gameState.lives);
                                updateGameInfo();

                                // 添加被击中的视觉反馈
                                player.hit = true;
                                player.invincible = true;

                                // 1秒后取消无敌状态
                                setTimeout(() => {
                                    if (gameState.player === player) {
                                        player.invincible = false;
                                        player.hit = false;
                                        console.log('无敌状态结束');
                                    }
                                }, 1000);

                                if (gameState.lives <= 0) {
                                    gameOver();
                                } else {
                                    // 立即重置位置到初始位置
                                    const newPlayer = new Tank(GAME_WIDTH / 2 - 100,
                                        GAME_HEIGHT - TANK_SIZE * 2, '#0066ff', true);
                                    // 新生成的坦克设置短暂无敌时间
                                    newPlayer.invincible = true;
                                    setTimeout(() => {
                                        if (gameState.player === newPlayer) {
                                            newPlayer.invincible = false;
                                            console.log('重生无敌状态结束');
                                        }
                                    }, 2000);
                                    gameState.player = newPlayer;
                                    console.log('玩家坦克已重生');
                                }

                                return true; // 需要移除子弹
                            }
                        }
                }

                return false; // 不需要移除
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, BULLET_SIZE, BULLET_SIZE);
            }
        }

        // 障碍物类
        class Obstacle {
            constructor(x, y, type = 'brick') {
                this.x = x;
                this.y = y;
                this.type = type; // brick, steel, grass, river
                this.size = 30; // 障碍物大小
            }

            draw() {
                switch (this.type) {
                    case 'brick':
                        ctx.fillStyle = '#a52a2a';
                        ctx.fillRect(this.x, this.y, this.size, this.size);
                        // 添加砖块纹理
                        ctx.fillStyle = '#8b4513';
                        ctx.fillRect(this.x + 5, this.y + 5, 5, 5);
                        ctx.fillRect(this.x + 20, this.y + 5, 5, 5);
                        ctx.fillRect(this.x + 5, this.y + 20, 5, 5);
                        ctx.fillRect(this.x + 20, this.y + 20, 5, 5);
                        break;
                    case 'steel':
                        ctx.fillStyle = '#808080';
                        ctx.fillRect(this.x, this.y, this.size, this.size);
                        // 添加钢铁纹理
                        ctx.fillStyle = '#a0a0a0';
                        ctx.fillRect(this.x, this.y, this.size, 5);
                        ctx.fillRect(this.x, this.y + 12, this.size, 5);
                        ctx.fillRect(this.x, this.y + 24, this.size, 5);
                        break;
                    case 'grass':
                        ctx.fillStyle = '#008000';
                        ctx.fillRect(this.x, this.y, this.size, this.size);
                        // 添加草地纹理
                        ctx.fillStyle = '#006400';
                        for (let i = 0; i < 3; i++) {
                            for (let j = 0; j < 3; j++) {
                                if ((i + j) % 2 === 0) {
                                    ctx.fillRect(this.x + i * 10, this.y + j * 10, 10, 10);
                                }
                            }
                        }
                        break;
                    case 'river':
                        ctx.fillStyle = '#0000ff';
                        ctx.fillRect(this.x, this.y, this.size, this.size);
                        // 添加水纹理
                        ctx.fillStyle = '#0080ff';
                        ctx.fillRect(this.x + 5, this.y + 5, 5, 5);
                        ctx.fillRect(this.x + 20, this.y + 5, 5, 5);
                        ctx.fillRect(this.x + 5, this.y + 20, 5, 5);
                        ctx.fillRect(this.x + 20, this.y + 20, 5, 5);
                        break;
                }
            }
        }

        // 基地类
        class Base {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.alive = true;
                this.size = 40;
            }

            draw() {
                if (!this.alive) return;

                // 绘制金色星星基地
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                // 星星的中心点
                const centerX = this.x + this.size / 2;
                const centerY = this.y + this.size / 2;
                const radius = this.size / 2;

                // 绘制五角星
                ctx.moveTo(centerX, centerY - radius);
                for (let i = 1; i < 5; i++) {
                    // 计算角度（弧度）
                    const angle = (i * 2 * Math.PI / 5) - Math.PI / 2;
                    const x = centerX + Math.cos(angle) * radius * 0.38;
                    const y = centerY + Math.sin(angle) * radius * 0.38;
                    ctx.lineTo(x, y);

                    // 下一个顶点
                    const nextAngle = ((i + 1) * 2 * Math.PI / 5) - Math.PI / 2;
                    const nextX = centerX + Math.cos(nextAngle) * radius;
                    const nextY = centerY + Math.sin(nextAngle) * radius;
                    ctx.lineTo(nextX, nextY);
                }

                ctx.closePath();
                ctx.fill();
            }
        }

        // 生成障碍物
        function generateObstacles() {
            gameState.obstacles = [];

            // 随机生成砖块障碍物
            const obstacleCount = 20 + gameState.level * 5; // 随关卡增加障碍物
            for (let i = 0; i < obstacleCount; i++) {
                let x, y;
                let validPosition = false;

                // 确保障碍物不会生成在玩家、敌坦或基地位置
                while (!validPosition) {
                    x = random(0, GAME_WIDTH / 30 - 1) * 30;
                    y = random(0, GAME_HEIGHT / 30 - 1) * 30;

                    validPosition = true;

                    // 检查是否与玩家位置冲突
                    if (collides({x, y}, {x: GAME_WIDTH / 2 - TANK_SIZE / 2, y: GAME_HEIGHT - TANK_SIZE * 2})) {
                        validPosition = false;
                    }

                    // 检查是否与基地位置冲突
                    if (collides({x, y}, {x: GAME_WIDTH / 2 - 20, y: GAME_HEIGHT - 60}, 30, 40)) {
                        validPosition = false;
                    }

                    // 检查是否与其他障碍物冲突
                    for (const obstacle of gameState.obstacles) {
                        if (collides({x, y}, obstacle)) {
                            validPosition = false;
                            break;
                        }
                    }
                }

                // 随机选择障碍物类型
                const types = ['brick', 'brick', 'brick', 'steel', 'grass', 'river'];
                const type = types[random(0, types.length - 1)];
                gameState.obstacles.push(new Obstacle(x, y, type));
            }

            // 添加边界墙
            // 顶部边界
            for (let x = 0; x < GAME_WIDTH; x += 30) {
                gameState.obstacles.push(new Obstacle(x, 0, 'steel'));
            }
            // 底部边界（留出基地位置）
            for (let x = 0; x < GAME_WIDTH; x += 30) {
                if (x < GAME_WIDTH / 2 - 50 || x > GAME_WIDTH / 2 + 10) {
                    gameState.obstacles.push(new Obstacle(x, GAME_HEIGHT - 30, 'steel'));
                }
            }
            // 左侧边界
            for (let y = 30; y < GAME_HEIGHT - 30; y += 30) {
                gameState.obstacles.push(new Obstacle(0, y, 'steel'));
            }
            // 右侧边界
            for (let y = 30; y < GAME_HEIGHT - 30; y += 30) {
                gameState.obstacles.push(new Obstacle(GAME_WIDTH - 30, y, 'steel'));
            }
        }

        // 生成敌坦
        function generateEnemies() {
            gameState.enemies = [];
            const enemyCount = 3 + gameState.level; // 随关卡增加敌坦数量

            for (let i = 0; i < enemyCount; i++) {
                let x, y;
                let validPosition = false;

                // 确保敌坦不会生成在障碍物或玩家位置
                while (!validPosition) {
                    x = random(30, GAME_WIDTH - 60);
                    y = random(30, GAME_HEIGHT / 3);
                    validPosition = true;

                    // 检查是否与障碍物冲突
                    for (const obstacle of gameState.obstacles) {
                        if (collides({x, y}, obstacle)) {
                            validPosition = false;
                            break;
                        }
                    }

                    // 检查是否与其他敌坦冲突
                    for (const enemy of gameState.enemies) {
                        if (collides({x, y}, enemy)) {
                            validPosition = false;
                            break;
                        }
                    }
                }

                // 统一敌坦颜色为红色
                const color = '#ff0000'; // 红色
                gameState.enemies.push(new Tank(x, y, color, false));
            }
        }

        // 初始化游戏
        function initGame() {
            gameState.score = 0;
            gameState.lives = 3;
            gameState.level = 1;
            gameState.gameOver = false;
            gameOverElement.style.display = 'none';

            // 创建玩家坦克
            gameState.player = new Tank(
                GAME_WIDTH / 2 - 100,
                GAME_HEIGHT - TANK_SIZE * 2,
                '#0066ff',
                true
            );

            // 创建基地
            gameState.base = new Base(
                GAME_WIDTH / 2 - 20,
                GAME_HEIGHT - 60
            );

            // 生成障碍物和敌坦
            generateObstacles();
            generateEnemies();

            // 更新游戏信息
            updateGameInfo();

            // 开始游戏循环
            gameLoop();
        }

        // 下一关
        function nextLevel() {
            gameState.level++;
            updateGameInfo();

            // 创建新的玩家坦克
            gameState.player = new Tank(
                GAME_WIDTH / 2 - 100,
                GAME_HEIGHT - TANK_SIZE * 2,
                '#0066ff',
                true
            );

            // 生成新的障碍物和敌坦
            generateObstacles();
            generateEnemies();
        }

        // 游戏结束
        function gameOver() {
            gameState.gameOver = true;
            finalScoreElement.textContent = gameState.score;
            gameOverElement.style.display = 'block';
        }

        // 更新游戏信息
        function updateGameInfo() {
            scoreElement.textContent = gameState.score;
            livesElement.textContent = gameState.lives;
            levelElement.textContent = gameState.level;
        }

        // 更新游戏对象
        function updateGameObjects() {
            // 更新玩家坦克
            if (gameState.player) {
                gameState.player.move();
            }

            // 更新敌坦
            for (const enemy of gameState.enemies) {
                enemy.move();
            }

            // 更新子弹
            for (let i = gameState.bullets.length - 1; i >= 0; i--) {
                const bullet = gameState.bullets[i];
                if (bullet.update()) {
                    gameState.bullets.splice(i, 1);
                }
            }
        }

        // 绘制游戏对象
        function drawGameObjects() {
            // 清空画布
            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // 绘制网格背景
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 0.5;
            for (let x = 0; x < GAME_WIDTH; x += 30) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, GAME_HEIGHT);
                ctx.stroke();
            }
            for (let y = 0; y < GAME_HEIGHT; y += 30) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(GAME_WIDTH, y);
                ctx.stroke();
            }

            // 绘制障碍物
            for (const obstacle of gameState.obstacles) {
                obstacle.draw();
            }

            // 绘制基地
            if (gameState.base) {
                gameState.base.draw();
            }

            // 绘制玩家坦克
            if (gameState.player) {
                gameState.player.draw();
            }

            // 绘制敌坦
            for (const enemy of gameState.enemies) {
                enemy.draw();
            }

            // 绘制子弹
            for (const bullet of gameState.bullets) {
                bullet.draw();
            }
        }

        // 游戏主循环
        function gameLoop() {
            if (!gameState.gameOver) {
                updateGameObjects();
                drawGameObjects();
                requestAnimationFrame(gameLoop);
            }
        }

        // 设置事件监听
        function setupEventListeners() {
            // 键盘按下事件
            window.addEventListener('keydown', (e) => {
                switch (e.key) {
                    case 'ArrowUp':
                        gameState.keys.up = true;
                        e.preventDefault();
                        break;
                    case 'ArrowDown':
                        gameState.keys.down = true;
                        e.preventDefault();
                        break;
                    case 'ArrowLeft':
                        gameState.keys.left = true;
                        e.preventDefault();
                        break;
                    case 'ArrowRight':
                        gameState.keys.right = true;
                        e.preventDefault();
                        break;
                    case 's':
                    case 'S':
                        gameState.keys.shoot = true;
                        e.preventDefault();
                        break;
                }
            });

            // 键盘释放事件
            window.addEventListener('keyup', (e) => {
                switch (e.key) {
                    case 'ArrowUp':
                        gameState.keys.up = false;
                        e.preventDefault();
                        break;
                    case 'ArrowDown':
                        gameState.keys.down = false;
                        e.preventDefault();
                        break;
                    case 'ArrowLeft':
                        gameState.keys.left = false;
                        e.preventDefault();
                        break;
                    case 'ArrowRight':
                        gameState.keys.right = false;
                        e.preventDefault();
                        break;
                    case 's':
                    case 'S':
                        gameState.keys.shoot = false;
                        e.preventDefault();
                        break;
                }
            });

            // 重启按钮点击事件
            restartBtn.addEventListener('click', initGame);
        }

        // 初始化
        setupEventListeners();
        initGame();
    </script>
</body>
</html>
