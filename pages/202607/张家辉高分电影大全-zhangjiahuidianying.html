        const rating = document.getElementById('rating');
        const description = document.getElementById('description');
        const reason = document.getElementById('reason');

        let currentMovieIndex = -1;

        function recommendMovie() {
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * movies.length);
            } while (newIndex === currentMovieIndex && movies.length > 1);
            
            currentMovieIndex = newIndex;
            const movie = movies[currentMovieIndex];
            
            movieTitle.textContent = movie.title;
            
            // 计算星星数量（每0.5分对应半颗星）
            const starCount = Math.round(movie.rating / 2);
            let stars = '';
            for (let i = 0; i < 5; i++) {
                if (i < starCount) {
                    stars += '★';
                } else {
                    stars += '☆';
                }
            }
            rating.textContent = `推荐指数: ${stars} (豆瓣评分: ${movie.rating})`;
            
            description.textContent = movie.description;
            reason.textContent = `推荐理由: ${movie.reason}`;
            
            movieInfo.style.display = 'block';
            recommendBtn.textContent = '换一部电影';
        }
