<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三角形可视化生成工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            padding: 40px;
        }

        .input-section {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
        }

        .section-title {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-mode {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            padding: 10px 15px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            font-size: 14px;
        }

        .mode-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .mode-btn:hover {
            transform: translateY(-2px);
        }

        .calculate-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .calculate-btn:hover {
            transform: translateY(-2px);
        }

        .reset-btn {
            width: 100%;
            padding: 12px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 8px;
            margin-top: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .reset-btn:hover {
            background: #5a6268;
        }

        .canvas-section {
            text-align: center;
        }

        #triangleCanvas {
            border: 2px solid #ddd;
            border-radius: 10px;
            background: white;
            max-width: 100%;
            height: auto;
        }

        .properties {
            margin-top: 20px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
        }

        .properties h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .property-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .property-item:last-child {
            border-bottom: none;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }

        .footer-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 30px;
            background: #f8f9fa;
            border-top: 1px solid #eee;
        }

        .footer-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .developer-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .support-btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: white;
        }

        .footer-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }

        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 30px;
            border-radius: 15px;
            width: 80%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: #000;
        }

        .modal h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .modal p {
            margin-bottom: 10px;
            color: #666;
        }

        .modal a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .modal a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 20px;
            }
            
            .footer-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .footer-btn {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>三角形可视化生成工具</h1>
            <p>专业的三角形计算与可视化工具</p>
        </div>

        <div class="main-content">
            <div class="input-section">
                <h2 class="section-title">输入参数</h2>
                
                <div class="input-mode">
                    <div class="mode-btn active" data-mode="sss">边边边（SSS）</div>
                    <div class="mode-btn" data-mode="sas">边角边（SAS）</div>
                    <div class="mode-btn" data-mode="asa">角边角（ASA）</div>
                    <div class="mode-btn" data-mode="ssa">边边角（SSA）</div>
                </div>

                <div id="inputFields">
                    <!-- SSS模式 -->
                    <div id="sss-inputs" class="mode-inputs">
                        <div class="input-group">
                            <label>边长 a:</label>
                            <input type="number" id="side-a" placeholder="输入边长a" step="0.01" min="0">
                        </div>
                        <div class="input-group">
                            <label>边长 b:</label>
                            <input type="number" id="side-b" placeholder="输入边长b" step="0.01" min="0">
                        </div>
                        <div class="input-group">
                            <label>边长 c:</label>
                            <input type="number" id="side-c" placeholder="输入边长c" step="0.01" min="0">
                        </div>
                    </div>

                    <!-- SAS模式 -->
                    <div id="sas-inputs" class="mode-inputs" style="display: none;">
                        <div class="input-group">
                            <label>边长 a:</label>
                            <input type="number" id="sas-side-a" placeholder="输入边长a" step="0.01" min="0">
                        </div>
                        <div class="input-group">
                            <label>夹角 C (度):</label>
                            <input type="number" id="sas-angle-c" placeholder="输入夹角C" step="0.01" min="0" max="180">
                        </div>
                        <div class="input-group">
                            <label>边长 b:</label>
                            <input type="number" id="sas-side-b" placeholder="输入边长b" step="0.01" min="0">
                        </div>
                    </div>

                    <!-- ASA模式 -->
                    <div id="asa-inputs" class="mode-inputs" style="display: none;">
                        <div class="input-group">
                            <label>角 A (度):</label>
                            <input type="number" id="asa-angle-a" placeholder="输入角A" step="0.01" min="0" max="180">
                        </div>
                        <div class="input-group">
                            <label>边长 c:</label>
                            <input type="number" id="asa-side-c" placeholder="输入边长c" step="0.01" min="0">
                        </div>
                        <div class="input-group">
                            <label>角 B (度):</label>
                            <input type="number" id="asa-angle-b" placeholder="输入角B" step="0.01" min="0" max="180">
                        </div>
                    </div>

                    <!-- SSA模式 -->
                    <div id="ssa-inputs" class="mode-inputs" style="display: none;">
                        <div class="input-group">
                            <label>边长 a:</label>
                            <input type="number" id="ssa-side-a" placeholder="输入边长a" step="0.01" min="0">
                        </div>
                        <div class="input-group">
                            <label>边长 b:</label>
                            <input type="number" id="ssa-side-b" placeholder="输入边长b" step="0.01" min="0">
                        </div>
                        <div class="input-group">
                            <label>角 A (度):</label>
                            <input type="number" id="ssa-angle-a" placeholder="输入角A" step="0.01" min="0" max="180">
                        </div>
                    </div>
                </div>

                <button class="calculate-btn" onclick="calculateTriangle()">计算三角形</button>
                <button class="reset-btn" onclick="resetForm()">重置</button>
                
                <div id="error" class="error"></div>
            </div>

            <div class="canvas-section">
                <h2 class="section-title">三角形可视化</h2>
                <canvas id="triangleCanvas" width="400" height="300"></canvas>
                
                <div class="properties" id="properties" style="display: none;">
                    <h3>三角形属性</h3>
                    <div class="property-item">
                        <span>边长 a:</span>
                        <span id="result-side-a">-</span>
                    </div>
                    <div class="property-item">
                        <span>边长 b:</span>
                        <span id="result-side-b">-</span>
                    </div>
                    <div class="property-item">
                        <span>边长 c:</span>
                        <span id="result-side-c">-</span>
                    </div>
                    <div class="property-item">
                        <span>角 A:</span>
                        <span id="result-angle-a">-</span>
                    </div>
                    <div class="property-item">
                        <span>角 B:</span>
                        <span id="result-angle-b">-</span>
                    </div>
                    <div class="property-item">
                        <span>角 C:</span>
                        <span id="result-angle-c">-</span>
                    </div>
                    <div class="property-item">
                        <span>面积:</span>
                        <span id="result-area">-</span>
                    </div>
                    <div class="property-item">
                        <span>周长:</span>
                        <span id="result-perimeter">-</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer-buttons">
            <button class="footer-btn developer-btn" onclick="showDeveloperInfo()">开发者：兔子先生</button>
            <button class="footer-btn support-btn" onclick="showSupportInfo()">技术支持：AI编程星球</button>
        </div>
    </div>

    <!-- 开发者信息弹窗 -->
    <div id="developerModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('developerModal')">&times;</span>
            <h3>开发者信息</h3>
            <p><strong>开发者：兔子先生</strong></p>
            <p>合作联系vx：<strong>l932371716</strong></p>
            <p>感谢您的使用！</p>
        </div>
    </div>

    <!-- 技术支持弹窗 -->
    <div id="supportModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('supportModal')">&times;</span>
            <h3>技术支持</h3>
            <p><strong>技术支持：AI编程星球</strong></p>
            <p>访问链接：<a href="https://t.zsxq.com/y1934。" target="_blank">https://t.zsxq.com/y1934。</a></p>
            <p>获取更多AI编程资源和工具！</p>
        </div>
    </div>

    <script>
        let currentMode = 'sss';
        let triangleData = null;

        // 模式切换
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                currentMode = this.dataset.mode;
                document.querySelectorAll('.mode-inputs').forEach(div => div.style.display = 'none');
                document.getElementById(currentMode + '-inputs').style.display = 'block';
                
                clearError();
            });
        });

        function showDeveloperInfo() {
            document.getElementById('developerModal').style.display = 'block';
        }

        function showSupportInfo() {
            document.getElementById('supportModal').style.display = 'block';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        // 点击弹窗外部关闭
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
            }
        }

        function calculateTriangle() {
            clearError();
            
            try {
                let triangle = null;
                
                switch(currentMode) {
                    case 'sss':
                        triangle = calculateSSS();
                        break;
                    case 'sas':
                        triangle = calculateSAS();
                        break;
                    case 'asa':
                        triangle = calculateASA();
                        break;
                    case 'ssa':
                        triangle = calculateSSA();
                        break;
                }
                
                if (triangle) {
                    triangleData = triangle;
                    displayProperties(triangle);
                    drawTriangle(triangle);
                }
            } catch (error) {
                showError(error.message);
            }
        }

        function calculateSSS() {
            const a = parseFloat(document.getElementById('side-a').value);
            const b = parseFloat(document.getElementById('side-b').value);
            const c = parseFloat(document.getElementById('side-c').value);
            
            if (!a || !b || !c) throw new Error('请输入所有边长');
            if (a <= 0 || b <= 0 || c <= 0) throw new Error('边长必须为正数');
            
            // 验证三角形不等式
            if (a + b <= c || a + c <= b || b + c <= a) {
                throw new Error('输入的边长不能构成三角形');
            }
            
            // 计算角度（余弦定理）
            const angleA = Math.acos((b*b + c*c - a*a) / (2*b*c)) * 180 / Math.PI;
            const angleB = Math.acos((a*a + c*c - b*b) / (2*a*c)) * 180 / Math.PI;
            const angleC = 180 - angleA - angleB;
            
            // 计算面积（海伦公式）
            const s = (a + b + c) / 2;
            const area = Math.sqrt(s * (s - a) * (s - b) * (s - c));
            
            return {
                sides: {a, b, c},
                angles: {A: angleA, B: angleB, C: angleC},
                area,
                perimeter: a + b + c
            };
        }

        function calculateSAS() {
            const a = parseFloat(document.getElementById('sas-side-a').value);
            const b = parseFloat(document.getElementById('sas-side-b').value);
            const angleC = parseFloat(document.getElementById('sas-angle-c').value);
            
            if (!a || !b || !angleC) throw new Error('请输入所有参数');
            if (a <= 0 || b <= 0) throw new Error('边长必须为正数');
            if (angleC <= 0 || angleC >= 180) throw new Error('角度必须在0-180度之间');
            
            const angleCRad = angleC * Math.PI / 180;
            
            // 计算第三边
            const c = Math.sqrt(a*a + b*b - 2*a*b*Math.cos(angleCRad));
            
            // 计算其他角度
            const angleA = Math.asin(a * Math.sin(angleCRad) / c) * 180 / Math.PI;
            const angleB = 180 - angleA - angleC;
            
            // 计算面积
            const area = 0.5 * a * b * Math.sin(angleCRad);
            
            return {
                sides: {a, b, c},
                angles: {A: angleA, B: angleB, C: angleC},
                area,
                perimeter: a + b + c
            };
        }

        function calculateASA() {
            const angleA = parseFloat(document.getElementById('asa-angle-a').value);
            const angleB = parseFloat(document.getElementById('asa-angle-b').value);
            const c = parseFloat(document.getElementById('asa-side-c').value);
            
            if (!angleA || !angleB || !c) throw new Error('请输入所有参数');
            if (c <= 0) throw new Error('边长必须为正数');
            if (angleA <= 0 || angleA >= 180 || angleB <= 0 || angleB >= 180) {
                throw new Error('角度必须在0-180度之间');
            }
            if (angleA + angleB >= 180) {
                throw new Error('角度和不合法');
            }
            
            const angleCRad = (180 - angleA - angleB) * Math.PI / 180;
            const angleARad = angleA * Math.PI / 180;
            const angleBRad = angleB * Math.PI / 180;
            
            // 计算其他边
            const a = c * Math.sin(angleARad) / Math.sin(angleCRad);
            const b = c * Math.sin(angleBRad) / Math.sin(angleCRad);
            
            // 计算面积
            const area = 0.5 * a * b * Math.sin(angleCRad);
            
            return {
                sides: {a, b, c},
                angles: {A: angleA, B: angleB, C: 180 - angleA - angleB},
                area,
                perimeter: a + b + c
            };
        }

        function calculateSSA() {
            const a = parseFloat(document.getElementById('ssa-side-a').value);
            const b = parseFloat(document.getElementById('ssa-side-b').value);
            const angleA = parseFloat(document.getElementById('ssa-angle-a').value);
            
            if (!a || !b || !angleA) throw new Error('请输入所有参数');
            if (a <= 0 || b <= 0) throw new Error('边长必须为正数');
            if (angleA <= 0 || angleA >= 180) throw new Error('角度必须在0-180度之间');
            
            const angleARad = angleA * Math.PI / 180;
            
            // 计算可能的解
            const sinB = b * Math.sin(angleARad) / a;
            
            if (sinB > 1) {
                throw new Error('无解：不能构成三角形');
            }
            
            let angleB1 = Math.asin(sinB) * 180 / Math.PI;
            let angleB2 = 180 - angleB1;
            
            // 选择有效的解
            let angleB = angleB1;
            if (angleB + angleA >= 180) {
                if (angleB2 + angleA >= 180) {
                    throw new Error('无解：角度和不合法');
                }
                angleB = angleB2;
            }
            
            const angleC = 180 - angleA - angleB;
            const angleCRad = angleC * Math.PI / 180;
            
            // 计算第三边
            const c = a * Math.sin(angleCRad) / Math.sin(angleARad);
            
            // 计算面积
            const area = 0.5 * a * b * Math.sin(angleCRad);
            
            return {
                sides: {a, b, c},
                angles: {A: angleA, B: angleB, C: angleC},
                area,
                perimeter: a + b + c
            };
        }

        function displayProperties(triangle) {
            document.getElementById('result-side-a').textContent = triangle.sides.a.toFixed(2);
            document.getElementById('result-side-b').textContent = triangle.sides.b.toFixed(2);
            document.getElementById('result-side-c').textContent = triangle.sides.c.toFixed(2);
            document.getElementById('result-angle-a').textContent = triangle.angles.A.toFixed(2) + '°';
            document.getElementById('result-angle-b').textContent = triangle.angles.B.toFixed(2) + '°';
            document.getElementById('result-angle-c').textContent = triangle.angles.C.toFixed(2) + '°';
            document.getElementById('result-area').textContent = triangle.area.toFixed(2);
            document.getElementById('result-perimeter').textContent = triangle.perimeter.toFixed(2);
            
            document.getElementById('properties').style.display = 'block';
        }

        function drawTriangle(triangle) {
            const canvas = document.getElementById('triangleCanvas');
            const ctx = canvas.getContext('2d');
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const {a, b, c} = triangle.sides;
            const {A, B, C} = triangle.angles;
            
            // 计算合适的缩放比例
            const maxSide = Math.max(a, b, c);
            const scale = 150 / maxSide;
            
            // 计算顶点坐标
            const x1 = 50;
            const y1 = 250;
            const x2 = 50 + c * scale;
            const y2 = 250;
            
            // 使用余弦定理计算第三个顶点
            const x3 = 50 + b * scale * Math.cos(A * Math.PI / 180);
            const y3 = 250 - b * scale * Math.sin(A * Math.PI / 180);
            
            // 绘制三角形
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.lineTo(x3, y3);
            ctx.closePath();
            
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // 填充
            ctx.fillStyle = 'rgba(102, 126, 234, 0.1)';
            ctx.fill();
            
            // 标注边长
            ctx.fillStyle = '#333';
            ctx.font = '14px Arial';
            ctx.textAlign = 'center';
            
            // 边长标注
            ctx.fillText(`a=${a.toFixed(1)}`, (x2 + x3) / 2 + 15, (y2 + y3) / 2);
            ctx.fillText(`b=${b.toFixed(1)}`, (x1 + x3) / 2 - 15, (y1 + y3) / 2);
            ctx.fillText(`c=${c.toFixed(1)}`, (x1 + x2) / 2, y1 + 20);
            
            // 角度标注
            ctx.font = '12px Arial';
            ctx.fillText(`A=${A.toFixed(1)}°`, x3 + 15, y3 - 5);
            ctx.fillText(`B=${B.toFixed(1)}°`, x2 - 15, y2 - 5);
            ctx.fillText(`C=${C.toFixed(1)}°`, x1 + 15, y1 - 5);
        }

        function resetForm() {
            document.querySelectorAll('input[type="number"]').forEach(input => input.value = '');
            document.getElementById('properties').style.display = 'none';
            
            const canvas = document.getElementById('triangleCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            clearError();
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function clearError() {
            document.getElementById('error').style.display = 'none';
        }
    </script>
</body>
</html>
