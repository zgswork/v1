<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI计算器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        
        body {
            background-color: #4CAF50; /* 绿色背景 */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            padding: 30px;
            width: 100%;
            max-width: 500px;
        }
        
        h1 {
            color: #2E7D32;
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #2E7D32;
            font-weight: bold;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        
        button {
            background-color: #2E7D32;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #1B5E20;
        }
        
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            font-size: 18px;
            display: none;
        }
        
        .advice {
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
            font-size: 16px;
            display: none;
            text-align: left;
            line-height: 1.6;
        }
        
        .bmi-info {
            margin-top: 30px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        
        .bmi-info h3 {
            color: #2E7D32;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .bmi-info ul {
            list-style-type: none;
        }
        
        .bmi-info li {
            padding: 5px 0;
            display: flex;
            justify-content: space-between;
        }
        
        .bmi-info li span:first-child {
            font-weight: bold;
        }
        
        .footer {
            margin-top: 30px;
            text-align: center;
            color: white;
            font-size: 14px;
        }
        
        .footer a {
            color: white;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>BMI 计算器</h1>
        <div class="input-group">
            <label for="height">身高 (cm)</label>
            <input type="number" id="height" placeholder="请输入您的身高（厘米）">
        </div>
        <div class="input-group">
            <label for="weight">体重 (kg)</label>
            <input type="number" id="weight" placeholder="请输入您的体重（公斤）">
        </div>
        <button onclick="calculateBMI()">计算 BMI</button>
        
        <div class="result" id="result"></div>
        <div class="advice" id="advice"></div>
        
        <div class="bmi-info">
            <h3>BMI 分类标准</h3>
            <ul>
                <li><span>低于18.5</span><span>体重过轻</span></li>
                <li><span>18.5 - 24.9</span><span>正常范围</span></li>
                <li><span>25 - 29.9</span><span>超重</span></li>
                <li><span>30 - 34.9</span><span>肥胖（一级）</span></li>
                <li><span>35 - 39.9</span><span>肥胖（二级）</span></li>
                <li><span>40及以上</span><span>极度肥胖</span></li>
            </ul>
        </div>
    </div>
    
    <div class="footer">
        本工具由兔子先生用deepseek开发<br>
        技术支持：<a href="https://t.zsxq.com/y1934" target="_blank">https://t.zsxq.com/y1934</a>
    </div>
    
    <script>
        function calculateBMI() {
            const heightInput = document.getElementById('height');
            const weightInput = document.getElementById('weight');
            const resultDiv = document.getElementById('result');
            const adviceDiv = document.getElementById('advice');
            
            const height = parseFloat(heightInput.value);
            const weight = parseFloat(weightInput.value);
            
            // 验证输入
            if (isNaN(height) || isNaN(weight) || height <= 0 || weight <= 0) {
                resultDiv.textContent = '请输入有效的身高和体重数值';
                resultDiv.style.display = 'block';
                resultDiv.style.backgroundColor = '#FFCDD2';
                resultDiv.style.color = '#C62828';
                adviceDiv.style.display = 'none';
                return;
            }
            
            // 计算BMI（身高转换为米）
            const bmi = weight / Math.pow(height / 100, 2);
            const roundedBMI = bmi.toFixed(1);
            
            // 显示结果
            resultDiv.textContent = `您的 BMI 是: ${roundedBMI}`;
            resultDiv.style.display = 'block';
            
            // 根据BMI值设置不同的背景颜色和健康建议
            let advice = '';
            if (bmi < 18.5) {
                resultDiv.style.backgroundColor = '#B3E5FC';
                resultDiv.style.color = '#0277BD';
                advice = '您的体重偏轻，建议：\n1. 增加营养摄入，多吃富含蛋白质的食物\n2. 适当进行力量训练增加肌肉量\n3. 保持规律作息，确保充足睡眠\n4. 可以咨询营养师制定增重计划';
            } else if (bmi >= 18.5 && bmi < 25) {
                resultDiv.style.backgroundColor = '#C8E6C9';
                resultDiv.style.color = '#2E7D32';
                advice = '恭喜！您的体重在健康范围内，建议：\n1. 继续保持均衡饮食\n2. 坚持每周3-5次中等强度运动\n3. 定期监测体重变化\n4. 保持积极乐观的心态';
            } else if (bmi >= 25 && bmi < 30) {
                resultDiv.style.backgroundColor = '#FFF9C4';
                resultDiv.style.color = '#F9A825';
                advice = '您的体重超重，建议：\n1. 适当控制饮食，减少高热量食物摄入\n2. 增加有氧运动，如快走、游泳等\n3. 减少久坐时间，每小时起来活动5分钟\n4. 设定合理的减重目标（每周0.5-1公斤）';
            } else {
                resultDiv.style.backgroundColor = '#FFCDD2';
                resultDiv.style.color = '#C62828';
                advice = '您的BMI显示肥胖，建议：\n1. 咨询医生或营养师制定科学减重计划\n2. 逐步增加运动量，从低强度开始\n3. 改变不良饮食习惯，控制总热量摄入\n4. 保持耐心，健康减重需要时间\n5. 记录饮食和运动情况，监测进展';
            }
            
            adviceDiv.textContent = advice;
            adviceDiv.style.display = 'block';
            adviceDiv.style.backgroundColor = resultDiv.style.backgroundColor;
            adviceDiv.style.color = resultDiv.style.color;
        }
    </script>
</body>
</html>
