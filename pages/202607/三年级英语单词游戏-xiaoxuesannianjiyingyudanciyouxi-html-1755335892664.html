<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三年级英语单词游戏</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Microsoft YaHei', sans-serif;
            background-color: #f0f9ff;
            padding: 20px;
            color: #333;
            text-align: center;
        }
        h1 {
            color: #ff6b6b;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .game-container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .tab-buttons {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .tab-btn {
            padding: 10px 20px;
            margin: 0 5px;
            background-color: #74b9ff;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }
        .tab-btn:hover {
            background-color: #0984e3;
            transform: scale(1.05);
        }
        .tab-btn.active {
            background-color: #e84393;
        }
        .game-section {
            display: none;
            min-height: 400px;
        }
        .game-section.active {
            display: block;
        }
        .word-card {
            background-color: #ffeaa7;
            display: inline-block;
            padding: 15px;
            margin: 10px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 200px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .word-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .word {
            font-size: 24px;
            font-weight: bold;
            color: #e84393;
            margin-bottom: 5px;
        }
        .pronunciation {
            color: #636e72;
            font-style: italic;
            margin-bottom: 10px;
        }
        .meaning {
            background-color: white;
            padding: 5px;
            border-radius: 5px;
            color: #00b894;
        }
        .match-container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }
        .match-column {
            width: 45%;
        }
        .match-item {
            background-color: #a29bfe;
            color: white;
            padding: 15px;
            margin: 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .match-item:hover {
            background-color: #6c5ce7;
        }
        .match-item.selected {
            background-color: #00b894;
        }
        .match-item.matched {
            background-color: #636e72;
            cursor: default;
        }
        .quiz-question {
            font-size: 20px;
            margin: 20px 0;
        }
        .quiz-options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        .quiz-option {
            background-color: #dfe6e9;
            padding: 10px 15px;
            margin: 10px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .quiz-option:hover {
            background-color: #b2bec3;
        }
        .quiz-option.correct {
            background-color: #55efc4;
            color: white;
        }
        .quiz-option.wrong {
            background-color: #ff7675;
            color: white;
        }
        .score-display {
            font-size: 24px;
            margin: 20px 0;
            color: #e84393;
        }
        .next-btn {
            background-color: #fdcb6e;
            color: #2d3436;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }
        .next-btn:hover {
            background-color: #ffeaa7;
            transform: scale(1.05);
        }
        .feedback {
            font-size: 18px;
            margin: 10px 0;
            min-height: 27px;
        }
        .progress-bar {
            width: 100%;
            background-color: #dfe6e9;
            border-radius: 10px;
            margin: 20px 0;
        }
        .progress {
            height: 20px;
            background-color: #00b894;
            border-radius: 10px;
            width: 0%;
            transition: width 0.5s;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎮 三年级英语单词游戏 🎮</h1>
        
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="openGame('flashcards')">单词卡片</button>
            <button class="tab-btn" onclick="openGame('matching')">配对游戏</button>
            <button class="tab-btn" onclick="openGame('quiz')">小测验</button>
        </div>
        
        <!-- 单词卡片游戏 -->
        <div id="flashcards" class="game-section active">
            <h2>📚 单词卡片</h2>
            <p>点击卡片查看中文意思</p>
            <div id="flashcard-container"></div>
        </div>
        
        <!-- 配对游戏 -->
        <div id="matching" class="game-section">
            <h2>🔤 单词配对</h2>
            <p>点击英文单词和对应的中文意思进行配对</p>
            <div class="match-container">
                <div class="match-column" id="english-words">
                    <h3>英文单词</h3>
                </div>
                <div class="match-column" id="chinese-meanings">
                    <h3>中文意思</h3>
                </div>
            </div>
            <div class="score-display" id="matching-score">已配对: 0/6</div>
        </div>
        
        <!-- 小测验 -->
        <div id="quiz" class="game-section">
            <h2>✏️ 单词小测验</h2>
            <div class="progress-bar">
                <div class="progress" id="quiz-progress"></div>
            </div>
            <div class="quiz-question" id="quiz-question"></div>
            <div class="quiz-options" id="quiz-options"></div>
            <div class="feedback" id="quiz-feedback"></div>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">下一题</button>
            <div class="score-display" id="quiz-score">得分: 0</div>
        </div>
    </div>

    <script>
        // 单词数据
        const words = [
            { english: "Book", pronunciation: "/bʊk/", chinese: "书", example: "I have a new book." },
            { english: "Pencil", pronunciation: "/ˈpensəl/", chinese: "铅笔", example: "This is my red pencil." },
            { english: "Cat", pronunciation: "/kæt/", chinese: "猫", example: "The cat is cute." },
            { english: "Dog", pronunciation: "/dɒɡ/", chinese: "狗", example: "I like the small dog." },
            { english: "Red", pronunciation: "/red/", chinese: "红色", example: "The apple is red." },
            { english: "Blue", pronunciation: "/bluː/", chinese: "蓝色", example: "The sky is blue." },
            { english: "Mother", pronunciation: "/ˈmʌðər/", chinese: "妈妈", example: "My mother is kind." },
            { english: "Run", pronunciation: "/rʌn/", chinese: "跑", example: "Don't run in the classroom!" },
            { english: "One", pronunciation: "/wʌn/", chinese: "一", example: "I have one brother." },
            { english: "Ten", pronunciation: "/ten/", chinese: "十", example: "Count to ten!" }
        ];

        // 游戏切换
        function openGame(gameName) {
            document.querySelectorAll('.game-section').forEach(section => {
                section.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            document.getElementById(gameName).classList.add('active');
            event.currentTarget.classList.add('active');
            
            // 初始化游戏
            if (gameName === 'flashcards') initFlashcards();
            if (gameName === 'matching') initMatching();
            if (gameName === 'quiz') initQuiz();
        }

        // 初始化单词卡片
        function initFlashcards() {
            const container = document.getElementById('flashcard-container');
            container.innerHTML = '';
            
            words.forEach(word => {
                const card = document.createElement('div');
                card.className = 'word-card';
                card.innerHTML = `
                    <div class="word">${word.english}</div>
                    <div class="pronunciation">${word.pronunciation}</div>
                    <div class="meaning" style="display:none;">${word.chinese} (${word.example})</div>
                `;
                card.addEventListener('click', function() {
                    const meaning = this.querySelector('.meaning');
                    if (meaning.style.display === 'none') {
                        meaning.style.display = 'block';
                        this.style.backgroundColor = '#55efc4';
                    } else {
                        meaning.style.display = 'none';
                        this.style.backgroundColor = '#ffeaa7';
                    }
                });
                container.appendChild(card);
            });
        }

        // 初始化配对游戏
        let selectedItem = null;
        let matchedPairs = 0;
        
        function initMatching() {
            const englishContainer = document.getElementById('english-words');
            const chineseContainer = document.getElementById('chinese-meanings');
            
            // 清空容器
            englishContainer.innerHTML = '<h3>英文单词</h3>';
            chineseContainer.innerHTML = '<h3>中文意思</h3>';
            
            // 随机选择6个单词
            const shuffledWords = [...words].sort(() => 0.5 - Math.random()).slice(0, 6);
            const shuffledChinese = [...shuffledWords].sort(() => 0.5 - Math.random());
            
            matchedPairs = 0;
            document.getElementById('matching-score').textContent = `已配对: 0/${shuffledWords.length}`;
            
            // 创建英文单词项
            shuffledWords.forEach((word, index) => {
                const item = document.createElement('div');
                item.className = 'match-item';
                item.textContent = word.english;
                item.dataset.index = index;
                item.addEventListener('click', handleMatchClick);
                englishContainer.appendChild(item);
            });
            
            // 创建中文意思项
            shuffledChinese.forEach((word, index) => {
                const item = document.createElement('div');
                item.className = 'match-item';
                item.textContent = word.chinese;
                item.dataset.englishIndex = shuffledWords.findIndex(w => w.english === word.english);
                item.addEventListener('click', handleMatchClick);
                chineseContainer.appendChild(item);
            });
        }
        
        function handleMatchClick() {
            if (this.classList.contains('matched')) return;
            
            if (!selectedItem) {
                // 第一次选择
                selectedItem = this;
                this.classList.add('selected');
            } else if (selectedItem === this) {
                // 点击同一个项目
                selectedItem.classList.remove('selected');
                selectedItem = null;
            } else {
                // 第二次选择
                const isEnglishFirst = selectedItem.parentElement.id === 'english-words';
                const englishItem = isEnglishFirst ? selectedItem : this;
                const chineseItem = isEnglishFirst ? this : selectedItem;
                
                // 检查是否匹配
                if (englishItem.dataset.index === chineseItem.dataset.englishIndex) {
                    // 匹配成功
                    englishItem.classList.remove('selected');
                    englishItem.classList.add('matched');
                    chineseItem.classList.add('matched');
                    matchedPairs++;
                    document.getElementById('matching-score').textContent = `已配对: ${matchedPairs}/6`;
                    
                    // 检查是否完成游戏
                    if (matchedPairs === 6) {
                        setTimeout(() => {
                            alert('🎉 太棒了！你完成了所有配对！');
                        }, 500);
                    }
                } else {
                    // 匹配失败
                    this.classList.add('selected');
                    setTimeout(() => {
                        selectedItem.classList.remove('selected');
                        this.classList.remove('selected');
                    }, 500);
                }
                
                selectedItem = null;
            }
        }

        // 初始化小测验
        let currentQuestion = 0;
        let score = 0;
        const quizQuestions = [];
        
        function initQuiz() {
            // 创建测验问题
            quizQuestions.length = 0;
            
            // 添加翻译题
            words.forEach(word => {
                quizQuestions.push({
                    type: 'translate',
                    question: `"${word.english}" 的中文意思是什么？`,
                    options: getRandomOptions(word.chinese, words.map(w => w.chinese), 4),
                    answer: word.chinese
                });
            });
            
            // 添加选择题
            words.forEach(word => {
                quizQuestions.push({
                    type: 'choose',
                    question: `哪个是"${word.chinese}"的英文单词？`,
                    options: getRandomOptions(word.english, words.map(w => w.english), 4),
                    answer: word.english
                });
            });
            
            // 打乱问题顺序
            quizQuestions.sort(() => 0.5 - Math.random());
            currentQuestion = 0;
            score = 0;
            document.getElementById('quiz-score').textContent = `得分: 0`;
            showQuestion();
        }
        
        function getRandomOptions(correct, allOptions, count) {
            const options = [correct];
            const otherOptions = allOptions.filter(opt => opt !== correct);
            
            while (options.length < count && options.length <= otherOptions.length) {
                const randomOption = otherOptions[Math.floor(Math.random() * otherOptions.length)];
                if (!options.includes(randomOption)) {
                    options.push(randomOption);
                }
            }
            
            // 打乱选项顺序
            return options.sort(() => 0.5 - Math.random());
        }
        
        function showQuestion() {
            if (currentQuestion >= quizQuestions.length) {
                // 测验结束
                document.getElementById('quiz-question').textContent = `测验完成！你的最终得分是: ${score}/${quizQuestions.length}`;
                document.getElementById('quiz-options').innerHTML = '';
                document.getElementById('quiz-feedback').textContent = '';
                document.getElementById('next-btn').style.display = 'none';
                document.getElementById('quiz-progress').style.width = '100%';
                return;
            }
            
            const question = quizQuestions[currentQuestion];
            document.getElementById('quiz-question').textContent = question.question;
            document.getElementById('quiz-feedback').textContent = '';
            
            // 更新进度条
            document.getElementById('quiz-progress').style.width = `${(currentQuestion / quizQuestions.length) * 100}%`;
            
            // 创建选项
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';
            
            question.options.forEach(option => {
                const optionElement = document.createElement('div');
                optionElement.className = 'quiz-option';
                optionElement.textContent = option;
                optionElement.addEventListener('click', function() {
                    checkAnswer(option, question.answer);
                });
                optionsContainer.appendChild(optionElement);
            });
            
            document.getElementById('next-btn').style.display = 'none';
        }
        
        function checkAnswer(selected, correct) {
            const options = document.querySelectorAll('.quiz-option');
            options.forEach(option => {
                option.classList.remove('correct', 'wrong');
                if (option.textContent === correct) {
                    option.classList.add('correct');
                }
                if (option.textContent === selected && selected !== correct) {
                    option.classList.add('wrong');
                }
                option.style.pointerEvents = 'none';
            });
            
            if (selected === correct) {
                score++;
                document.getElementById('quiz-score').textContent = `得分: ${score}`;
                document.getElementById('quiz-feedback').textContent = '✅ 答对了！太棒了！';
            } else {
                document.getElementById('quiz-feedback').textContent = `❌ 答错了！正确答案是: ${correct}`;
            }
            
            document.getElementById('next-btn').style.display = 'inline-block';
        }
        
        function nextQuestion() {
            currentQuestion++;
            showQuestion();
        }

        // 页面加载时初始化第一个游戏
        window.onload = initFlashcards;
    </script>
