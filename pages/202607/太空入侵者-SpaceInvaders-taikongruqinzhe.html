<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>太空入侵者 - Space Invaders</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1a237e, #000051);
            font-family: 'Orbitron', sans-serif;
            color: #00ffea;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-shadow: 0 0 5px #00ffea;
        }
        
        .container {
            position: relative;
            width: 100%;
            max-width: 800px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            letter-spacing: 3px;
            color: #ff4081;
            text-shadow: 0 0 10px #ff4081;
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 10px 20px;
            background: rgba(0, 20, 40, 0.7);
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 1.4rem;
            border: 2px solid #00bcd4;
        }
        
        .score-container, .lives-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        
        .key {
            background: rgba(0, 40, 80, 0.7);
            border: 2px solid #00bcd4;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 1.1rem;
        }
        
        .game-container {
            position: relative;
            width: 100%;
            height: 70vh;
            max-height: 500px;
            border: 3px solid #00bcd4;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 188, 212, 0.5);
            background: #000;
        }
        
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        #touch-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 20px;
            padding: 0 10%;
        }
        
        .touch-btn {
            width: 70px;
            height: 70px;
            background: rgba(0, 80, 120, 0.7);
            border: 2px solid #00bcd4;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            touch-action: manipulation;
            user-select: none;
        }
        
        .touch-btn:active {
            background: rgba(0, 188, 212, 0.9);
            transform: scale(0.95);
        }
        
        .game-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 10, 20, 0.9);
            z-index: 10;
            color: white;
        }
        
        .hidden {
            display: none;
        }
        
        .btn {
            background: linear-gradient(135deg, #ff4081, #d500f9);
            color: white;
            border: none;
            padding: 12px 30px;
            margin: 15px;
            border-radius: 50px;
            font-size: 1.3rem;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 64, 129, 0.7);
            transition: all 0.2s;
        }
        
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 64, 129, 0.9);
        }
        
        .message {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-align: center;
            color: #ff4081;
            text-shadow: 0 0 10px #ff4081;
        }
        
        .instructions {
            text-align: center;
            max-width: 600px;
            margin: 20px 0;
            padding: 15px;
            background: rgba(0, 20, 40, 0.7);
            border-radius: 10px;
            font-size: 1.1rem;
            line-height: 1.6;
            border: 2px solid #00bcd4;
        }
        
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
            }
            
            .game-info {
                font-size: 1.2rem;
                padding: 8px 15px;
            }
            
            .key {
                padding: 8px 12px;
                font-size: 0.9rem;
            }
            
            .touch-btn {
                width: 60px;
                height: 60px;
                font-size: 1.8rem;
            }
            
            .message {
                font-size: 2rem;
            }
            
            .btn {
                padding: 10px 25px;
                font-size: 1.1rem;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .game-info {
                font-size: 1rem;
            }
            
            .key {
                padding: 6px 10px;
                font-size: 0.8rem;
            }
            
            .touch-btn {
                width: 50px;
                height: 50px;
                font-size: 1.5rem;
            }
            
            .message {
                font-size: 1.6rem;
            }
            
            .btn {
                padding: 8px 20px;
                font-size: 1rem;
            }
            
            .instructions {
                font-size: 0.9rem;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="stars" id="stars"></div>
    
    <div class="container">
        <div class="header">
            <h1>太空入侵者</h1>
            <div class="game-info">
                <div class="score-container">
                    <span>分数:</span>
                    <span id="score">0</span>
                </div>
                <div class="lives-container">
                    <span>生命:</span>
                    <span id="lives">3</span>
                </div>
            </div>
            
            <div class="controls">
                <div class="key">← → : 移动飞船</div>
                <div class="key">空格键 : 发射子弹</div>
                <div class="key">P : 暂停游戏</div>
            </div>
        </div>
        
        <div class="game-container">
            <canvas id="gameCanvas"></canvas>
            
            <div id="startScreen" class="game-overlay">
                <div class="message">太空入侵者</div>
                <button id="startBtn" class="btn">开始游戏</button>
                <div class="instructions">
                    使用键盘左右箭头移动飞船，空格键发射子弹！<br>
                    消灭所有外星人并避免被它们击中或碰到！
                </div>
            </div>
            
            <div id="gameOverScreen" class="game-overlay hidden">
                <div class="message">游戏结束</div>
                <div id="finalScore">最终得分: 0</div>
                <button id="restartBtn" class="btn">重新开始</button>
            </div>
            
            <div id="pauseScreen" class="game-overlay hidden">
                <div class="message">游戏暂停</div>
                <button id="resumeBtn" class="btn">继续游戏</button>
            </div>
        </div>
        
        <div id="touch-controls">
            <div class="touch-btn" id="leftBtn">←</div>
            <div class="touch-btn" id="shootBtn">🔥</div>
            <div class="touch-btn" id="rightBtn">→</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 创建星空背景
            createStars();
            
            // 获取Canvas元素
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            
            // 设置Canvas尺寸
            function setCanvasSize() {
                const container = canvas.parentElement;
                canvas.width = container.clientWidth;
                canvas.height = container.clientHeight;
            }
            
            setCanvasSize();
            window.addEventListener('resize', setCanvasSize);
            
            // 游戏状态
            const gameState = {
                score: 0,
                lives: 3,
                gameOver: false,
                paused: false,
                level: 1,
                aliensKilled: 0
            };
            
            // 玩家飞船
            const player = {
                x: canvas.width / 2 - 25,
                y: canvas.height - 60,
                width: 50,
                height: 40,
                speed: 8,
                dx: 0,
                color: '#00bcd4',
                shootCooldown: 0
            };
            
            // 子弹数组
            const bullets = [];
            
            // 外星人数组
            const aliens = [];
            const alienRows = 4;
            const alienCols = 8;
            const alienPadding = 20;
            
            // 外星人子弹数组
            const alienBullets = [];
            
            // 创建外星人
            function createAliens() {
                aliens.length = 0;
                
                const alienWidth = 40;
                const alienHeight = 30;
                const startX = (canvas.width - (alienCols * alienWidth + (alienCols - 1) * alienPadding)) / 2;
                const startY = 60;
                
                for (let row = 0; row < alienRows; row++) {
                    for (let col = 0; col < alienCols; col++) {
                        aliens.push({
                            x: startX + col * (alienWidth + alienPadding),
                            y: startY + row * (alienHeight + alienPadding),
                            width: alienWidth,
                            height: alienHeight,
                            color: row === 0 ? '#ff4081' : 
                                   row === 1 ? '#d500f9' : 
                                   row === 2 ? '#651fff' : '#00e676',
                            alive: true
                        });
                    }
                }
            }
            
            // 绘制玩家飞船
            function drawPlayer() {
                ctx.fillStyle = player.color;
                
                // 绘制飞船主体
                ctx.beginPath();
                ctx.moveTo(player.x + player.width/2, player.y);
                ctx.lineTo(player.x, player.y + player.height);
                ctx.lineTo(player.x + player.width, player.y + player.height);
                ctx.closePath();
                ctx.fill();
                
                // 添加发光效果
                ctx.shadowColor = player.color;
                ctx.shadowBlur = 15;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            
            // 绘制子弹
            function drawBullets() {
                bullets.forEach(bullet => {
                    ctx.fillStyle = '#ffeb3b';
                    ctx.beginPath();
                    ctx.arc(bullet.x, bullet.y, 4, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 添加发光效果
                    ctx.shadowColor = '#ffeb3b';
                    ctx.shadowBlur = 10;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                });
            }
            
            // 绘制外星人
            function drawAliens() {
                aliens.forEach(alien => {
                    if (alien.alive) {
                        ctx.fillStyle = alien.color;
                        ctx.beginPath();
                        ctx.arc(alien.x + alien.width/2, alien.y + alien.height/2, alien.width/2, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // 添加发光效果
                        ctx.shadowColor = alien.color;
                        ctx.shadowBlur = 15;
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }
                });
            }
            
            // 绘制外星人子弹
            function drawAlienBullets() {
                alienBullets.forEach(bullet => {
                    ctx.fillStyle = '#ff4081';
                    ctx.beginPath();
                    ctx.arc(bullet.x, bullet.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 添加发光效果
                    ctx.shadowColor = '#ff4081';
                    ctx.shadowBlur = 10;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                });
            }
            
            // 更新玩家位置
            function updatePlayer() {
                player.x += player.dx;
                
                // 边界检查
                if (player.x < 0) {
                    player.x = 0;
                } else if (player.x + player.width > canvas.width) {
                    player.x = canvas.width - player.width;
                }
                
                // 射击冷却
                if (player.shootCooldown > 0) {
                    player.shootCooldown--;
                }
            }
            
            // 更新子弹位置
            function updateBullets() {
                // 玩家子弹
                for (let i = bullets.length - 1; i >= 0; i--) {
                    bullets[i].y -= bullets[i].speed;
                    
                    // 移除超出屏幕的子弹
                    if (bullets[i].y < 0) {
                        bullets.splice(i, 1);
                        continue;
                    }
                    
                    // 检测子弹与外星人的碰撞
                    for (let j = aliens.length - 1; j >= 0; j--) {
                        if (aliens[j].alive && checkCollision(bullets[i], aliens[j])) {
                            bullets.splice(i, 1);
                            aliens[j].alive = false;
                            gameState.score += 100;
                            gameState.aliensKilled++;
                            document.getElementById('score').textContent = gameState.score;
                            break;
                        }
                    }
                }
                
                // 外星人子弹
                for (let i = alienBullets.length - 1; i >= 0; i--) {
                    alienBullets[i].y += alienBullets[i].speed;
                    
                    // 移除超出屏幕的子弹
                    if (alienBullets[i].y > canvas.height) {
                        alienBullets.splice(i, 1);
                        continue;
                    }
                    
                    // 检测子弹与玩家的碰撞
                    if (checkCollision(alienBullets[i], player)) {
                        alienBullets.splice(i, 1);
                        gameState.lives--;
                        document.getElementById('lives').textContent = gameState.lives;
                        if (gameState.lives <= 0) {
                            endGame();
                        }
                        break;
                    }
                }
            }
            
            // 更新外星人位置
            function updateAliens() {
                // 移动外星人
                const alienSpeed = 1 + gameState.level * 0.2;
                const direction = Math.sin(Date.now() / 2000) > 0 ? 1 : -1;
                
                aliens.forEach(alien => {
                    if (alien.alive) {
                        alien.x += alienSpeed * direction;
                    }
                });
                
                // 随机发射子弹
                if (Math.random() < 0.01 && aliens.some(alien => alien.alive)) {
                    // 从存活的外星人中随机选择一个
                    const liveAliens = aliens.filter(alien => alien.alive);
                    if (liveAliens.length > 0) {
                        const shooter = liveAliens[Math.floor(Math.random() * liveAliens.length)];
                        alienBullets.push({
                            x: shooter.x + shooter.width/2,
                            y: shooter.y + shooter.height,
                            width: 4,
                            height: 10,
                            speed: 4
                        });
                    }
                }
                
                // 检测外星人与玩家的碰撞
                aliens.forEach(alien => {
                    if (alien.alive && checkCollision(player, alien)) {
                        endGame();
                    }
                });
                
                // 检测是否所有外星人都被消灭
                if (aliens.every(alien => !alien.alive)) {
                    nextLevel();
                }
            }
            
            // 碰撞检测
            function checkCollision(obj1, obj2) {
                return obj1.x < obj2.x + obj2.width &&
                       obj1.x + obj1.width > obj2.x &&
                       obj1.y < obj2.y + obj2.height &&
                       obj1.y + obj1.height > obj2.y;
            }
            
            // 玩家射击
            function playerShoot() {
                if (player.shootCooldown === 0) {
                    bullets.push({
                        x: player.x + player.width/2,
                        y: player.y,
                        width: 4,
                        height: 10,
                        speed: 10
                    });
                    player.shootCooldown = 15;
                }
            }
            
            // 游戏循环
            function gameLoop() {
                if (gameState.gameOver || gameState.paused) return;
                
                // 清除画布
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // 绘制游戏元素
                drawPlayer();
                drawBullets();
                drawAliens();
                drawAlienBullets();
                
                // 更新游戏状态
                updatePlayer();
                updateBullets();
                updateAliens();
                
                // 继续游戏循环
                requestAnimationFrame(gameLoop);
            }
            
            // 开始游戏
            function startGame() {
                gameState.score = 0;
                gameState.lives = 3;
                gameState.level = 1;
                gameState.aliensKilled = 0;
                gameState.gameOver = false;
                gameState.paused = false;
                
                document.getElementById('score').textContent = gameState.score;
                document.getElementById('lives').textContent = gameState.lives;
                
                player.x = canvas.width / 2 - player.width / 2;
                bullets.length = 0;
                alienBullets.length = 0;
                
                createAliens();
                
                document.getElementById('startScreen').classList.add('hidden');
                document.getElementById('gameOverScreen').classList.add('hidden');
                document.getElementById('pauseScreen').classList.add('hidden');
                
                gameLoop();
            }
            
            // 结束游戏
            function endGame() {
                gameState.gameOver = true;
                document.getElementById('finalScore').textContent = `最终得分: ${gameState.score}`;
                document.getElementById('gameOverScreen').classList.remove('hidden');
            }
            
            // 暂停游戏
            function pauseGame() {
                gameState.paused = true;
                document.getElementById('pauseScreen').classList.remove('hidden');
            }
            
            // 继续游戏
            function resumeGame() {
                gameState.paused = false;
                document.getElementById('pauseScreen').classList.add('hidden');
                gameLoop();
            }
            
            // 下一关
            function nextLevel() {
                gameState.level++;
                bullets.length = 0;
                alienBullets.length = 0;
                createAliens();
                
                // 增加玩家生命
                if (gameState.level % 2 === 0 && gameState.lives < 5) {
                    gameState.lives++;
                    document.getElementById('lives').textContent = gameState.lives;
                }
            }
            
            // 创建星空背景
            function createStars() {
                const starsContainer = document.getElementById('stars');
                starsContainer.innerHTML = '';
                
                const starCount = 200;
                
                for (let i = 0; i < starCount; i++) {
                    const star = document.createElement('div');
                    star.classList.add('star');
                    
                    // 随机位置
                    const left = Math.random() * 100;
                    const top = Math.random() * 100;
                    
                    // 随机大小
                    const size = Math.random() * 3;
                    
                    // 随机闪烁动画
                    const duration = 2 + Math.random() * 3;
                    const delay = Math.random() * 5;
                    
                    star.style.left = `${left}%`;
                    star.style.top = `${top}%`;
                    star.style.width = `${size}px`;
                    star.style.height = `${size}px`;
                    star.style.animation = `twinkle ${duration}s ${delay}s infinite`;
                    
                    starsContainer.appendChild(star);
                }
                
                // 添加CSS动画
                const style = document.createElement('style');
                style.textContent = `
                    @keyframes twinkle {
                        0%, 100% { opacity: 0.2; }
                        50% { opacity: 1; }
                    }
                `;
                document.head.appendChild(style);
            }
            
            // 事件监听器
            document.getElementById('startBtn').addEventListener('click', startGame);
            document.getElementById('restartBtn').addEventListener('click', startGame);
            document.getElementById('resumeBtn').addEventListener('click', resumeGame);
            
            // 键盘控制
            document.addEventListener('keydown', (e) => {
                if (gameState.gameOver || gameState.paused) return;
                
                switch (e.key) {
                    case 'ArrowLeft':
                        player.dx = -player.speed;
                        break;
                    case 'ArrowRight':
                        player.dx = player.speed;
                        break;
                    case ' ':
                        playerShoot();
                        break;
                    case 'p':
                    case 'P':
                        pauseGame();
                        break;
                }
            });
            
            document.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                    player.dx = 0;
                }
            });
            
            // 触摸控制
            document.getElementById('leftBtn').addEventListener('touchstart', () => {
                if (!gameState.gameOver && !gameState.paused) {
                    player.dx = -player.speed;
                }
            });
            
            document.getElementById('rightBtn').addEventListener('touchstart', () => {
                if (!gameState.gameOver && !gameState.paused) {
                    player.dx = player.speed;
                }
            });
            
            document.getElementById('shootBtn').addEventListener('touchstart', () => {
                if (!gameState.gameOver && !gameState.paused) {
                    playerShoot();
                }
            });
            
            // 触摸结束事件
            document.getElementById('leftBtn').addEventListener('touchend', () => {
                if (player.dx < 0) player.dx = 0;
            });
            
            document.getElementById('rightBtn').addEventListener('touchend', () => {
                if (player.dx > 0) player.dx = 0;
            });
            
            // 防止触摸事件的默认行为
            document.querySelectorAll('.touch-btn').forEach(btn => {
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                });
            });
            
            // 初始化游戏
            createAliens();
            drawPlayer();
            drawAliens();
        });
    </script>
</body>
</html>
