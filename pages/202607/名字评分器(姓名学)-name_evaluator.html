                    score = 18;
                } else if (wuxingRelations.克[elem1] === elem2 || wuxingRelations.克[elem2] === elem1) {
                    analysis += `⚠️ 五行相克（${elem1}克${elem2} 或 ${elem2}克${elem1}），可能产生冲突，需要调和。`;
                    score = 12;
                } else {
                    analysis += `✅ 五行并存（${elem1}、${elem2}），相对平衡。`;
                    score = 15;
                }
            } else {
                analysis += `🌟 五行丰富（${uniqueElements.join('、')}），平衡性极佳，有利于全面发展。`;
                score = 20;
            }
            analysis += '</div>';
            
            // 五行建议
            analysis += '<div><strong>五行建议：</strong><br>';
            if (uniqueElements.length <= 1) {
                const missingElements = ['木', '火', '土', '金', '水'].filter(e => !uniqueElements.includes(e));
                analysis += `建议补充：${missingElements.slice(0, 2).join('、')}属性的字，以达到五行平衡。`;
            } else if (uniqueElements.length === 2) {
                analysis += '可考虑适当调整字的搭配，或在日常生活中注意五行调和。';
            } else {
                analysis += '五行配置良好，有利于个人运势和性格发展。';
            }
            analysis += '</div>';
            
            return { analysis, score };
        }

        // 详细风水分析
        function analyzeFengshui(name) {
            let analysis = '';
            let score = 0;
            
            // 分析吉祥字
            analysis += '<div style="margin-bottom: 15px;"><strong>吉祥字分析：</strong><br>';
            let auspiciousLevel = '';
            let auspiciousChars = [];
            
            for (let char of name) {
                let found = false;
                for (let level in fengshuiChars) {
                    if (fengshuiChars[level].includes(char)) {
                        auspiciousChars.push({ char, level });
                        found = true;
                        break;
                    }
                }
                if (!found) {
                    auspiciousChars.push({ char, level: '普通' });
                }
            }
            
            auspiciousChars.forEach(item => {
                const color = item.level === '大吉' ? '#28a745' : item.level === '中吉' ? '#ffc107' : item.level === '小吉' ? '#17a2b8' : '#6c757d';
                analysis += `<span style="color: ${color}; font-weight: bold;">${item.char} (${item.level})</span> `;
            });
            
            const dajiCount = auspiciousChars.filter(item => item.level === '大吉').length;
            const zhongjiCount = auspiciousChars.filter(item => item.level === '中吉').length;
            const xiaojiCount = auspiciousChars.filter(item => item.level === '小吉').length;
            
            score += dajiCount * 8 + zhongjiCount * 5 + xiaojiCount * 3;
            analysis += '</div>';
            
            // 笔画风水分析
            const totalStrokes = name.split('').reduce((sum, char) => sum + getStrokeCount(char), 0);
            const remainder = totalStrokes % 9;
            
            analysis += '<div style="margin-bottom: 15px;"><strong>笔画风水：</strong><br>';
            analysis += `总笔画数：${totalStrokes}画，九宫余数：${remainder}<br>`;
            
            const strokeMeanings = {
                1: '太极之数，万物开泰，生发无穷，利禄亨通。',
                2: '两仪之数，混沌未开，进退保守，志望难达。',
                3: '三才之数，天地人和，大事大业，繁荣昌隆。',
                4: '四象之数，待于生发，万事慎重，不具营谋。',
                5: '五行之数，循环相生，圆通畅达，福祉无穷。',
                6: '六爻之数，发展变化，天赋美德，吉祥安泰。',
                7: '七政之数，精悍严谨，天赋之力，吉星高照。',
                8: '八卦之数，乾坎艮震，巽离坤兑，无穷无尽。',
                0: '万物终局，充满损耗，晦暗不明，不宜使用。'
            };
            
            analysis += `风水寓意：${strokeMeanings[remainder] || '数理平常，无特殊寓意。'}<br>`;
            
            if ([1, 3, 5, 6, 7, 8].includes(remainder)) {
                analysis += '✅ 笔画数理吉利，有利运势发展。';
                score += 7;
            } else if ([2, 4].includes(remainder)) {
                analysis += '⚠️ 笔画数理一般，建议谨慎行事。';
                score += 3;
            } else {
                analysis += '❌ 笔画数理不佳，建议重新考虑。';
                score += 1;
            }
            analysis += '</div>';
            
            // 音韵风水
            analysis += '<div style="margin-bottom: 15px;"><strong>音韵风水：</strong><br>';
            if (name.length >= 2) {
                analysis += '✅ 名字音韵和谐，朗朗上口，有利于人际交往和事业发展。';
                score += 5;
            } else {
                analysis += '⚠️ 单字名较为简单，建议搭配合适的字以增强音韵效果。';
                score += 2;
            }
            analysis += '</div>';
            
            // 综合建议
            analysis += '<div><strong>风水建议：</strong><br>';
            if (score >= 15) {
                analysis += '🌟 风水配置优秀，名字具有良好的气场和运势，有利于各方面发展。';
            } else if (score >= 10) {
                analysis += '✅ 风水配置良好，名字整体运势不错，可稍稍优化细节。';
            } else if (score >= 5) {
                analysis += '⚠️ 风水配置一般，建议在某些方面进行调整以提升运势。';
            } else {
                analysis += '❌ 风水配置需要改善，建议重新选择更合适的字词组合。';
            }
            analysis += '</div>';
            
            return { analysis, score: Math.min(score, 20) };
        }

        // 检查五行平衡（简化版，用于总评分）
        function checkWuxingBalance(name) {
            const elements = [];
            for (let char of name) {
                const element = getWuxing(char);
                if (element) {
                    elements.push(element);
                }
            }
            
            const uniqueElements = [...new Set(elements)];
            if (uniqueElements.length >= 3) {
                return 20;
            } else if (uniqueElements.length === 2) {
                return 15;
            } else if (uniqueElements.length === 1) {
                return 10;
            }
            return 5;
        }

        // 音韵评分（简化版）
        function evaluatePhonetics(name) {
            if (name.length >= 2) {
                return 20;
            }
            return 10;
        }

        // 结构评分
        function evaluateStructure(name) {
            let score = 0;
            
            if (name.length >= 2 && name.length <= 3) {
                score += 15;
            } else if (name.length === 4) {
                score += 10;
            } else {
                score += 5;
            }
            
            let hasCommonChars = true;
            for (let char of name) {
                if (!strokeData[char]) {
                    hasCommonChars = false;
                    break;
                }
            }
            
            if (hasCommonChars) {
                score += 5;
            }
            
            return Math.min(score, 20);
        }

        // 风水评分（简化版，用于总评分）
        function evaluateFengshui(name) {
            let score = 0;
            
            for (let char of name) {
                for (let level in fengshuiChars) {
                    if (fengshuiChars[level].includes(char)) {
                        score += level === '大吉' ? 8 : level === '中吉' ? 5 : 3;
                        break;
                    }
                }
            }
            
            const totalStrokes = name.split('').reduce((sum, char) => sum + getStrokeCount(char), 0);
            const remainder = totalStrokes % 9;
            if ([1, 3, 5, 6, 7, 8].includes(remainder)) {
                score += 7;
            }
            
            return Math.min(score, 20);
        }

        // 主评分函数
        function evaluateName() {
            const nameInput = document.getElementById('nameInput');
            const name = nameInput.value.trim();
            
            if (!name) {
                alert('请输入姓名');
                return;
            }
            
            if (name.length < 2 || name.length > 4) {
                alert('请输入2-4个汉字的姓名');
                return;
            }
            
            const chineseRegex = /^[\u4e00-\u9fa5]+$/;
            if (!chineseRegex.test(name)) {
                alert('请输入中文姓名');
                return;
            }
            
            // 详细分析（必须在使用前定义）
            const wuxingResult = analyzeWuxing(name);
            const fengshuiResult = analyzeFengshui(name);
            
            // 计算各项评分
            let baseScore = 40;
            let strokeScore = 0;
            let phoneticScore = evaluatePhonetics(name);
            let structureScore = evaluateStructure(name);
            let meaningScore = 0;
            let wuxingScore = wuxingResult.score;
            let fengshuiScore = fengshuiResult.score;
            
            // 笔画评分
            const totalStrokes = name.split('').reduce((sum, char) => sum + getStrokeCount(char), 0);
            if (luckyStrokes.includes(totalStrokes)) {
                strokeScore = 20;
            }
            
            // 美好字词评分
            for (let char of name) {
                if (isGoodWord(char)) {
                    meaningScore += 10;
                }
            }
            meaningScore = Math.min(meaningScore, 30);
            
            // 计算总分
            let totalScore = baseScore + strokeScore + phoneticScore + structureScore + meaningScore + wuxingScore + fengshuiScore;
            totalScore = Math.min(totalScore, 100);
            
            // 显示结果
            document.getElementById('totalScore').textContent = totalScore;
            document.getElementById('baseScore').textContent = baseScore + '分';
            document.getElementById('strokeScore').textContent = strokeScore + '分';
            document.getElementById('phoneticScore').textContent = phoneticScore + '分';
            document.getElementById('structureScore').textContent = structureScore + '分';
            document.getElementById('meaningScore').textContent = meaningScore + '分';
            document.getElementById('wuxingScore').textContent = wuxingScore + '分';
            document.getElementById('fengshuiScore').textContent = fengshuiScore + '分';
            
            // 显示详细分析
            document.getElementById('wuxingAnalysis').innerHTML = wuxingResult.analysis;
            document.getElementById('fengshuiAnalysis').innerHTML = fengshuiResult.analysis;
            
            // 生成评价
            let evaluation = generateEvaluation(totalScore, name, totalStrokes);
            document.getElementById('evaluation').textContent = evaluation;
            
            // 显示结果区域
            document.getElementById('result').style.display = 'block';
        }

        // 生成评价文字
        function generateEvaluation(score, name, strokes) {
            let evaluation = `「${name}」总笔画数为${strokes}画。`;
            
            if (score >= 90) {
                evaluation += '此名字音义兼美，寓意吉祥，五行调和，风水极佳，是难得的好名字。';
            } else if (score >= 80) {
                evaluation += '此名字整体不错，音韵和谐，寓意美好，五行较为平衡，是个好名字。';
            } else if (score >= 70) {
                evaluation += '此名字中等偏上，有一定的美好寓意，音韵尚可，可以考虑使用。';
            } else if (score >= 60) {
                evaluation += '此名字一般，建议可以考虑在某些方面进行优化，如音韵搭配或寓意选择。';
            } else {
                evaluation += '此名字评分较低，建议重新考虑，可以选择寓意更好、音韵更和谐的字词组合。';
            }
            
            return evaluation;
        }

        // 清除结果
        function clearResult() {
            document.getElementById('nameInput').value = '';
            document.getElementById('result').style.display = 'none';
        }

        // 回车键评分
        document.getElementById('nameInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                evaluateName();
            }
        });
    </script>
