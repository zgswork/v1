<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>透明圆角图片生成工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 350px 1fr 350px;
            gap: 20px;
            margin-bottom: 20px;
        }

        .sidebar {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            height: fit-content;
        }

        .preview-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            min-height: 600px;
            display: flex;
            flex-direction: column;
        }

        .section-title {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 8px;
        }

        .upload-area {
            border: 3px dashed #ddd;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            background: #f8f9fa;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .upload-area.dragover {
            border-color: #667eea;
            background: #e3f2fd;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 3em;
            color: #667eea;
            margin-bottom: 15px;
        }

        .upload-text {
            font-size: 1.1em;
            color: #666;
            margin-bottom: 10px;
        }

        .upload-hint {
            font-size: 0.9em;
            color: #999;
        }

        .file-input {
            display: none;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: #555;
        }

        .control-input {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .control-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .range-input {
            width: 100%;
            margin: 10px 0;
        }

        .range-value {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            margin-left: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 5px 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #333;
            border: 2px solid #e0e0e0;
        }

        .btn-secondary:hover {
            background: #e9ecef;
        }

        .btn-success {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #dc3545 0%, #e83e8c 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.3);
        }

        .preview-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            border-radius: 10px;
            position: relative;
            min-height: 400px;
            overflow: hidden;
        }

        .preview-background {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(45deg, #ccc 25%, transparent 25%), 
                linear-gradient(-45deg, #ccc 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #ccc 75%), 
                linear-gradient(-45deg, transparent 75%, #ccc 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            opacity: 0.3;
        }

        .preview-image {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: relative;
            z-index: 1;
        }

        .no-image {
            text-align: center;
            color: #999;
            font-style: italic;
            position: relative;
            z-index: 1;
        }

        .preset-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .preset-btn {
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            color: #666;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .preset-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .preset-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .color-picker-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .color-picker {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .export-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .image-info {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            padding: 5px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .info-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .info-label {
            font-weight: 500;
            color: #555;
        }

        .info-value {
            color: #333;
            font-weight: 600;
        }

        .batch-list {
            max-height: 200px;
            overflow-y: auto;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
        }

        .batch-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 12px;
        }

        .batch-item:last-child {
            border-bottom: none;
        }

        .batch-item.processing {
            background: #fff3cd;
        }

        .batch-item.completed {
            background: #d4edda;
        }

        .batch-item.error {
            background: #f8d7da;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }
            
            .preset-buttons {
                grid-template-columns: 1fr;
            }
            
            .export-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 透明圆角图片生成工具</h1>
            <p>为图片添加透明背景和圆角效果，支持批量处理和多种导出格式</p>
        </div>
        
        <div class="main-content">
            <!-- 左侧控制面板 -->
            <div class="sidebar">
                <div class="section-title">📁 图片上传</div>
                
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">🖼️</div>
                    <div class="upload-text">点击或拖拽图片到这里</div>
                    <div class="upload-hint">支持 JPG、PNG、GIF、WebP 格式</div>
                    <input type="file" id="fileInput" class="file-input" accept="image/*" multiple>
                </div>
                
                <button class="btn btn-primary" onclick="selectFiles()">📁 选择图片文件</button>
                
                <div class="section-title">🎛️ 圆角设置</div>
                
                <div class="preset-buttons">
                    <button class="preset-btn" onclick="setRadius(0)">无圆角</button>
                    <button class="preset-btn" onclick="setRadius(10)">轻微圆角</button>
                    <button class="preset-btn" onclick="setRadius(20)">中等圆角</button>
                    <button class="preset-btn" onclick="setRadius(50)">大圆角</button>
                    <button class="preset-btn" onclick="setRadius(999)">圆形</button>
                    <button class="preset-btn active" onclick="setRadius(15)">默认</button>
                </div>
                
                <div class="control-group">
                    <label class="control-label">圆角半径 (px)</label>
                    <input type="range" class="range-input" id="radiusSlider" min="0" max="100" value="15" oninput="updateRadius(this.value)">
                    <span class="range-value" id="radiusValue">15px</span>
                </div>
                
                <div class="control-group">
                    <label class="control-label">圆角类型</label>
                    <select class="control-input" id="radiusType" onchange="updatePreview()">
                        <option value="uniform">统一圆角</option>
                        <option value="top">仅顶部圆角</option>
                        <option value="bottom">仅底部圆角</option>
                        <option value="left">仅左侧圆角</option>
                        <option value="right">仅右侧圆角</option>
                        <option value="custom">自定义圆角</option>
                    </select>
                </div>
                
                <div id="customRadiusControls" style="display: none;">
                    <div class="control-group">
                        <label class="control-label">左上角</label>
                        <input type="range" class="range-input" id="topLeftRadius" min="0" max="100" value="15" oninput="updateCustomRadius()">
                        <span class="range-value" id="topLeftValue">15px</span>
                    </div>
                    <div class="control-group">
                        <label class="control-label">右上角</label>
                        <input type="range" class="range-input" id="topRightRadius" min="0" max="100" value="15" oninput="updateCustomRadius()">
                        <span class="range-value" id="topRightValue">15px</span>
                    </div>
                    <div class="control-group">
                        <label class="control-label">左下角</label>
                        <input type="range" class="range-input" id="bottomLeftRadius" min="0" max="100" value="15" oninput="updateCustomRadius()">
                        <span class="range-value" id="bottomLeftValue">15px</span>
                    </div>
                    <div class="control-group">
                        <label class="control-label">右下角</label>
                        <input type="range" class="range-input" id="bottomRightRadius" min="0" max="100" value="15" oninput="updateCustomRadius()">
                        <span class="range-value" id="bottomRightValue">15px</span>
                    </div>
                </div>
            </div>
            
            <!-- 中间预览区域 -->
            <div class="preview-section">
                <div class="section-title">🖼️ 预览效果</div>
                
                <div class="preview-container" id="previewContainer">
                    <div class="preview-background"></div>
                    <div class="no-image">请上传图片查看效果</div>
                </div>
                
                <div id="imageInfoContainer" style="display: none;">
                    <div class="image-info">
                        <div class="info-item">
                            <span class="info-label">原始尺寸:</span>
                            <span class="info-value" id="originalSize">-</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">处理后尺寸:</span>
                            <span class="info-value" id="processedSize">-</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">文件格式:</span>
                            <span class="info-value" id="fileFormat">PNG</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">透明背景:</span>
                            <span class="info-value">是</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 右侧设置面板 -->
            <div class="sidebar">
                <div class="section-title">🎨 背景设置</div>
                
                <div class="control-group">
                    <label class="control-label">背景类型</label>
                    <select class="control-input" id="backgroundType" onchange="updateBackgroundType()">
                        <option value="transparent">透明背景</option>
                        <option value="solid">纯色背景</option>
                        <option value="gradient">渐变背景</option>
                    </select>
                </div>
                
                <div id="solidColorControls" style="display: none;">
                    <div class="control-group">
                        <label class="control-label">背景颜色</label>
                        <div class="color-picker-group">
                            <input type="color" class="color-picker" id="backgroundColor" value="#ffffff" onchange="updatePreview()">
                            <input type="text" class="control-input" id="backgroundColorText" value="#ffffff" onchange="updateBackgroundColor()" style="flex: 1;">
                        </div>
                    </div>
                </div>
                
                <div id="gradientControls" style="display: none;">
                    <div class="control-group">
                        <label class="control-label">起始颜色</label>
                        <div class="color-picker-group">
                            <input type="color" class="color-picker" id="gradientStart" value="#667eea" onchange="updatePreview()">
                            <input type="text" class="control-input" id="gradientStartText" value="#667eea" onchange="updateGradientStart()" style="flex: 1;">
                        </div>
                    </div>
                    <div class="control-group">
                        <label class="control-label">结束颜色</label>
                        <div class="color-picker-group">
                            <input type="color" class="color-picker" id="gradientEnd" value="#764ba2" onchange="updatePreview()">
                            <input type="text" class="control-input" id="gradientEndText" value="#764ba2" onchange="updateGradientEnd()" style="flex: 1;">
                        </div>
                    </div>
                    <div class="control-group">
                        <label class="control-label">渐变方向</label>
                        <select class="control-input" id="gradientDirection" onchange="updatePreview()">
                            <option value="135deg">左上到右下</option>
                            <option value="45deg">左下到右上</option>
                            <option value="0deg">从左到右</option>
                            <option value="90deg">从上到下</option>
                            <option value="180deg">从右到左</option>
                            <option value="270deg">从下到上</option>
                        </select>
                    </div>
                </div>
                
                <div class="section-title">📏 尺寸设置</div>
                
                <div class="control-group">
                    <label class="control-label">输出尺寸</label>
                    <select class="control-input" id="outputSize" onchange="updateOutputSize()">
                        <option value="original">保持原始尺寸</option>
                        <option value="custom">自定义尺寸</option>
                        <option value="square">正方形 (1:1)</option>
                        <option value="16:9">宽屏 (16:9)</option>
                        <option value="4:3">标准 (4:3)</option>
                        <option value="3:2">照片 (3:2)</option>
                    </select>
                </div>
                
                <div id="customSizeControls" style="display: none;">
                    <div class="control-group">
                        <label class="control-label">宽度 (px)</label>
                        <input type="number" class="control-input" id="customWidth" value="800" min="1" max="4000" onchange="updatePreview()">
                    </div>
                    <div class="control-group">
                        <label class="control-label">高度 (px)</label>
                        <input type="number" class="control-input" id="customHeight" value="600" min="1" max="4000" onchange="updatePreview()">
                    </div>
                    <div class="control-group">
                        <label>
                            <input type="checkbox" id="keepAspectRatio" checked onchange="updatePreview()"> 保持宽高比
                        </label>
                    </div>
                </div>
                
                <div class="section-title">📤 导出设置</div>
                
                <div class="control-group">
                    <label class="control-label">输出格式</label>
                    <select class="control-input" id="outputFormat">
                        <option value="png">PNG (支持透明)</option>
                        <option value="webp">WebP (支持透明)</option>
                        <option value="jpg">JPG (不支持透明)</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label class="control-label">图片质量</label>
                    <input type="range" class="range-input" id="qualitySlider" min="0.1" max="1" step="0.1" value="0.9" oninput="updateQuality(this.value)">
                    <span class="range-value" id="qualityValue">90%</span>
                </div>
                
                <div class="export-options">
                    <button class="btn btn-success" onclick="downloadImage()">💾 下载图片</button>
                    <button class="btn btn-primary" onclick="copyToClipboard()">📋 复制图片</button>
                </div>
                
                <div class="section-title">📦 批量处理</div>
                
                <div class="batch-list" id="batchList">
                    <div class="no-image">暂无批量任务</div>
                </div>
                
                <div class="progress-bar" id="progressBar" style="display: none;">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                
                <button class="btn btn-primary" onclick="batchProcess()">🚀 批量处理</button>
                <button class="btn btn-success" onclick="downloadBatch()">📦 打包下载</button>
                
                <div class="section-title">💾 快速操作</div>
                
                <button class="btn btn-secondary" onclick="resetSettings()">🔄 重置设置</button>
                <button class="btn btn-secondary" onclick="clearAll()">🗑️清空所有</button>
                <button class="btn btn-secondary" onclick="loadPreset()">📝 加载预设</button>
            </div>
        </div>
    </div>

    <script>
        class RoundedImageGenerator {
            constructor() {
                this.images = [];
                this.currentImageIndex = -1;
                this.processedImages = [];
                this.canvas = document.createElement('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.init();
            }
            
            init() {
                this.bindEvents();
                this.setupDragAndDrop();
                this.updateRadiusType();
            }
            
            bindEvents() {
                // 文件输入变化
                document.getElementById('fileInput').addEventListener('change', (e) => {
                    this.handleFiles(e.target.files);
                });
                
                // 圆角类型变化
                document.getElementById('radiusType').addEventListener('change', () => {
                    this.updateRadiusType();
                });
            }
            
            setupDragAndDrop() {
                const uploadArea = document.getElementById('uploadArea');
                
                uploadArea.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    uploadArea.classList.add('dragover');
                });
                
                uploadArea.addEventListener('dragleave', (e) => {
                    e.preventDefault();
                    uploadArea.classList.remove('dragover');
                });
                
                uploadArea.addEventListener('drop', (e) => {
                    e.preventDefault();
                    uploadArea.classList.remove('dragover');
                    this.handleFiles(e.dataTransfer.files);
                });
                
                uploadArea.addEventListener('click', () => {
                    document.getElementById('fileInput').click();
                });
            }
            
            handleFiles(files) {
                Array.from(files).forEach(file => {
                    if (file.type.startsWith('image/')) {
                        this.addImage(file);
                    }
                });
            }
            
            addImage(file) {
                const reader = new FileReader();
                
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const imageData = {
                            file: file,
                            name: file.name,
                            size: file.size,
                            type: file.type,
                            image: img,
                            width: img.width,
                            height: img.height
                        };
                        
                        this.images.push(imageData);
                        this.currentImageIndex = this.images.length - 1;
                        this.updateBatchList();
                        this.displayCurrentImage();
                        this.updatePreview();
                    };
                    img.src = e.target.result;
                };
                
                reader.readAsDataURL(file);
            }
            
            displayCurrentImage() {
                if (this.currentImageIndex === -1 || !this.images[this.currentImageIndex]) {
                    document.getElementById('previewContainer').innerHTML = `
                        <div class="preview-background"></div>
                        <div class="no-image">请上传图片查看效果</div>
                    `;
                    document.getElementById('imageInfoContainer').style.display = 'none';
                    return;
                }
                
                const imageData = this.images[this.currentImageIndex];
                
                // 更新图片信息
                document.getElementById('originalSize').textContent = `${imageData.width} × ${imageData.height}`;
                document.getElementById('imageInfoContainer').style.display = 'block';
                
                this.updatePreview();
            }
            
            updatePreview() {
                if (this.currentImageIndex === -1 || !this.images[this.currentImageIndex]) return;
                
                const imageData = this.images[this.currentImageIndex];
                const processedCanvas = this.processImage(imageData);
                
                // 更新预览
                const container = document.getElementById('previewContainer');
                container.innerHTML = `
                    <div class="preview-background"></div>
                    <canvas class="preview-image" width="${processedCanvas.width}" height="${processedCanvas.height}"></canvas>
                `;
                
                const previewCanvas = container.querySelector('canvas');
                const previewCtx = previewCanvas.getContext('2d');
                previewCtx.drawImage(processedCanvas, 0, 0);
                
                // 更新处理后尺寸信息
                document.getElementById('processedSize').textContent = `${processedCanvas.width} × ${processedCanvas.height}`;
            }
            
            processImage(imageData) {
                const img = imageData.image;
                
                // 获取输出尺寸
                const outputSize = this.getOutputSize(img.width, img.height);
                
                // 设置画布尺寸
                this.canvas.width = outputSize.width;
                this.canvas.height = outputSize.height;
                
                // 清空画布
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                // 设置背景
                this.setBackground();
                
                // 创建圆角路径
                this.createRoundedPath();
                
                // 裁剪并绘制图片
                this.ctx.clip();
                this.ctx.drawImage(img, 0, 0, this.canvas.width, this.canvas.height);
                
                return this.canvas;
            }
            
            getOutputSize(originalWidth, originalHeight) {
                const outputSizeType = document.getElementById('outputSize').value;
                
                switch (outputSizeType) {
                    case 'original':
                        return { width: originalWidth, height: originalHeight };
                    
                    case 'custom':
                        const customWidth = parseInt(document.getElementById('customWidth').value);
                        const customHeight = parseInt(document.getElementById('customHeight').value);
                        
                        if (document.getElementById('keepAspectRatio').checked) {
                            const aspectRatio = originalWidth / originalHeight;
                            if (customWidth / customHeight > aspectRatio) {
                                return { width: customHeight * aspectRatio, height: customHeight };
                            } else {
                                return { width: customWidth, height: customWidth / aspectRatio };
                            }
                        }
                        
                        return { width: customWidth, height: customHeight };
                    
                    case 'square':
                        const size = Math.min(originalWidth, originalHeight);
                        return { width: size, height: size };
                    
                    case '16:9':
                        const width16_9 = originalWidth;
                        const height16_9 = width16_9 * 9 / 16;
                        return { width: width16_9, height: height16_9 };
                    
                    case '4:3':
                        const width4_3 = originalWidth;
                        const height4_3 = width4_3 * 3 / 4;
                        return { width: width4_3, height: height4_3 };
                    
                    case '3:2':
                        const width3_2 = originalWidth;
                        const height3_2 = width3_2 * 2 / 3;
                        return { width: width3_2, height: height3_2 };
                    
                    default:
                        return { width: originalWidth, height: originalHeight };
                }
            }
            
            setBackground() {
                const backgroundType = document.getElementById('backgroundType').value;
                
                switch (backgroundType) {
                    case 'transparent':
                        // 透明背景，不需要绘制
                        break;
                    
                    case 'solid':
                        const backgroundColor = document.getElementById('backgroundColor').value;
                        this.ctx.fillStyle = backgroundColor;
                        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                        break;
                    
                    case 'gradient':
                        const startColor = document.getElementById('gradientStart').value;
                        const endColor = document.getElementById('gradientEnd').value;
                        const direction = document.getElementById('gradientDirection').value;
                        
                        const gradient = this.createGradient(direction, startColor, endColor);
                        this.ctx.fillStyle = gradient;
                        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                        break;
                }
            }
            
            createGradient(direction, startColor, endColor) {
                const angle = parseFloat(direction);
                const radians = (angle - 90) * Math.PI / 180;
                
                const x1 = this.canvas.width / 2 + Math.cos(radians) * this.canvas.width / 2;
                const y1 = this.canvas.height / 2 + Math.sin(radians) * this.canvas.height / 2;
                const x2 = this.canvas.width / 2 - Math.cos(radians) * this.canvas.width / 2;
                const y2 = this.canvas.height / 2 - Math.sin(radians) * this.canvas.height / 2;
                
                const gradient = this.ctx.createLinearGradient(x1, y1, x2, y2);
                gradient.addColorStop(0, startColor);
                gradient.addColorStop(1, endColor);
                
                return gradient;
            }
            
            createRoundedPath() {
                const radiusType = document.getElementById('radiusType').value;
                const width = this.canvas.width;
                const height = this.canvas.height;
                
                let topLeft, topRight, bottomLeft, bottomRight;
                
                if (radiusType === 'custom') {
                    topLeft = parseInt(document.getElementById('topLeftRadius').value);
                    topRight = parseInt(document.getElementById('topRightRadius').value);
                    bottomLeft = parseInt(document.getElementById('bottomLeftRadius').value);
                    bottomRight = parseInt(document.getElementById('bottomRightRadius').value);
                } else {
                    const radius = parseInt(document.getElementById('radiusSlider').value);
                    
                    switch (radiusType) {
                        case 'uniform':
                            topLeft = topRight = bottomLeft = bottomRight = radius;
                            break;
                        case 'top':
                            topLeft = topRight = radius;
                            bottomLeft = bottomRight = 0;
                            break;
                        case 'bottom':
                            topLeft = topRight = 0;
                            bottomLeft = bottomRight = radius;
                            break;
                        case 'left':
                            topLeft = bottomLeft = radius;
                            topRight = bottomRight = 0;
                            break;
                        case 'right':
                            topLeft = bottomLeft = 0;
                            topRight = bottomRight = radius;
                            break;
                        default:
                            topLeft = topRight = bottomLeft = bottomRight = radius;
                    }
                }
                
                // 限制圆角半径
                const maxRadius = Math.min(width, height) / 2;
                topLeft = Math.min(topLeft, maxRadius);
                topRight = Math.min(topRight, maxRadius);
                bottomLeft = Math.min(bottomLeft, maxRadius);
                bottomRight = Math.min(bottomRight, maxRadius);
                
                // 创建圆角路径
                this.ctx.beginPath();
                this.ctx.moveTo(topLeft, 0);
                this.ctx.lineTo(width - topRight, 0);
                this.ctx.quadraticCurveTo(width, 0, width, topRight);
                this.ctx.lineTo(width, height - bottomRight);
                this.ctx.quadraticCurveTo(width, height, width - bottomRight, height);
                this.ctx.lineTo(bottomLeft, height);
                this.ctx.quadraticCurveTo(0, height, 0, height - bottomLeft);
                this.ctx.lineTo(0, topLeft);
                this.ctx.quadraticCurveTo(0, 0, topLeft, 0);
                this.ctx.closePath();
            }
            
            updateRadiusType() {
                const radiusType = document.getElementById('radiusType').value;
                const customControls = document.getElementById('customRadiusControls');
                
                if (radiusType === 'custom') {
                    customControls.style.display = 'block';
                } else {
                    customControls.style.display = 'none';
                }
                
                this.updatePreview();
            }
            
            updateBatchList() {
                const container = document.getElementById('batchList');
                
                if (this.images.length === 0) {
                    container.innerHTML = '<div class="no-image">暂无批量任务</div>';
                    return;
                }
                
                container.innerHTML = '';
                
                this.images.forEach((image, index) => {
                    const item = document.createElement('div');
                    item.className = 'batch-item';
                    item.innerHTML = `
                        <span>${image.name}</span>
                        <span>${this.formatFileSize(image.size)}</span>
                    `;
                    
                    item.addEventListener('click', () => {
                        this.currentImageIndex = index;
                        this.displayCurrentImage();
                    });
                    
                    if (index === this.currentImageIndex) {
                        item.style.background = '#e3f2fd';
                    }
                    
                    container.appendChild(item);
                });
            }
            
            formatFileSize(bytes) {
                if (bytes === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }
            
            downloadImage() {
                if (this.currentImageIndex === -1) {
                    alert('请先选择一张图片');
                    return;
                }
                
                const imageData = this.images[this.currentImageIndex];
                const processedCanvas = this.processImage(imageData);
                
                const format = document.getElementById('outputFormat').value;
                const quality = parseFloat(document.getElementById('qualitySlider').value);
                
                let mimeType, extension;
                switch (format) {
                    case 'png':
                        mimeType = 'image/png';
                        extension = 'png';
                        break;
                    case 'webp':
                        mimeType = 'image/webp';
                        extension = 'webp';
                        break;
                    case 'jpg':
                        mimeType = 'image/jpeg';
                        extension = 'jpg';
                        break;
                }
                
                processedCanvas.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${imageData.name.split('.')[0]}_rounded.${extension}`;
                    a.click();
                    URL.revokeObjectURL(url);
                }, mimeType, quality);
            }
            
            copyToClipboard() {
                if (this.currentImageIndex === -1) {
                    alert('请先选择一张图片');
                    return;
                }
                
                const imageData = this.images[this.currentImageIndex];
                const processedCanvas = this.processImage(imageData);
                
                processedCanvas.toBlob((blob) => {
                    const item = new ClipboardItem({ 'image/png': blob });
                    navigator.clipboard.write([item]).then(() => {
                        alert('图片已复制到剪贴板');
                    }).catch(() => {
                        alert('复制失败，请使用下载功能');
                    });
                }, 'image/png');
            }
            
            batchProcess() {
                if (this.images.length === 0) {
                    alert('没有图片需要处理');
                    return;
                }
                
                this.processedImages = [];
                const progressBar = document.getElementById('progressBar');
                const progressFill = document.getElementById('progressFill');
                
                progressBar.style.display = 'block';
                
                this.images.forEach((imageData, index) => {
                    setTimeout(() => {
                        const processedCanvas = this.processImage(imageData);
                        
                        const format = document.getElementById('outputFormat').value;
                        const quality = parseFloat(document.getElementById('qualitySlider').value);
                        
                        let mimeType;
                        switch (format) {
                            case 'png':
                                mimeType = 'image/png';
                                break;
                            case 'webp':
                                mimeType = 'image/webp';
                                break;
                            case 'jpg':
                                mimeType = 'image/jpeg';
                                break;
                        }
                        
                        processedCanvas.toBlob((blob) => {
                            this.processedImages.push({
                                name: `${imageData.name.split('.')[0]}_rounded.${format}`,
                                blob: blob
                            });
                            
                            const progress = ((index + 1) / this.images.length) * 100;
                            progressFill.style.width = progress + '%';
                            
                            if (index === this.images.length - 1) {
                                setTimeout(() => {
                                    progressBar.style.display = 'none';
                                    alert('批量处理完成！');
                                }, 500);
                            }
                        }, mimeType, quality);
                    }, index * 100);
                });
            }
            
            downloadBatch() {
                if (this.processedImages.length === 0) {
                    alert('请先进行批量处理');
                    return;
                }
                
                // 创建ZIP文件（简化版本，实际需要JSZip库）
                this.processedImages.forEach(image => {
                    const url = URL.createObjectURL(image.blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = image.name;
                    a.click();
                    URL.revokeObjectURL(url);
                });
            }
            
            resetSettings() {
                document.getElementById('radiusSlider').value = 15;
                document.getElementById('radiusValue').textContent = '15px';
                document.getElementById('radiusType').value = 'uniform';
                document.getElementById('backgroundType').value = 'transparent';
                document.getElementById('outputSize').value = 'original';
                document.getElementById('outputFormat').value = 'png';
                document.getElementById('qualitySlider').value = 0.9;
                document.getElementById('qualityValue').textContent = '90%';
                
                this.updateRadiusType();
                this.updateBackgroundType();
                this.updateOutputSize();
                this.updatePreview();
            }
            
            clearAll() {
                this.images = [];
                this.currentImageIndex = -1;
                this.processedImages = [];
                
                this.updateBatchList();
                this.displayCurrentImage();
            }
            
            loadPreset() {
                const presets = {
                    'avatar': { radius: 999, background: 'transparent', size: 'square' },
                    'button': { radius: 10, background: 'solid', size: 'original' },
                    'card': { radius: 15, background: 'transparent', size: 'original' },
                    'banner': { radius: 20, background: 'gradient', size: '16:9' }
                };
                
                const presetName = prompt('选择预设:\n1. avatar (头像)\n2. button (按钮)\n3. card (卡片)\n4. banner (横幅)\n\n请输入预设名称:');
                
                if (presets[presetName]) {
                    const preset = presets[presetName];
                    document.getElementById('radiusSlider').value = preset.radius;
                    document.getElementById('radiusValue').textContent = preset.radius + 'px';
                    document.getElementById('backgroundType').value = preset.background;
                    document.getElementById('outputSize').value = preset.size;
                    
                    this.updateBackgroundType();
                    this.updateOutputSize();
                    this.updatePreview();
                }
            }
        }
        
        // 全局变量和函数
        let generator;
        
        function selectFiles() {
            document.getElementById('fileInput').click();
        }
        
        function setRadius(value) {
            document.getElementById('radiusSlider').value = value;
            updateRadius(value);
            
            // 更新按钮状态
            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }
        
        function updateRadius(value) {
            document.getElementById('radiusValue').textContent = value + 'px';
            generator.updatePreview();
        }
        
        function updateCustomRadius() {
            const topLeft = document.getElementById('topLeftRadius').value;
            const topRight = document.getElementById('topRightRadius').value;
            const bottomLeft = document.getElementById('bottomLeftRadius').value;
            const bottomRight = document.getElementById('bottomRightRadius').value;
            
            document.getElementById('topLeftValue').textContent = topLeft + 'px';
            document.getElementById('topRightValue').textContent = topRight + 'px';
            document.getElementById('bottomLeftValue').textContent = bottomLeft + 'px';
            document.getElementById('bottomRightValue').textContent = bottomRight + 'px';
            
            generator.updatePreview();
        }
        
        function updateBackgroundType() {
            const backgroundType = document.getElementById('backgroundType').value;
            const solidControls = document.getElementById('solidColorControls');
            const gradientControls = document.getElementById('gradientControls');
            
            solidControls.style.display = backgroundType === 'solid' ? 'block' : 'none';
            gradientControls.style.display = backgroundType === 'gradient' ? 'block' : 'none';
            
            generator.updatePreview();
        }
        
        function updateBackgroundColor() {
            const color = document.getElementById('backgroundColorText').value;
            document.getElementById('backgroundColor').value = color;
            generator.updatePreview();
        }
        
        function updateGradientStart() {
            const color = document.getElementById('gradientStartText').value;
            document.getElementById('gradientStart').value = color;
            generator.updatePreview();
        }
        
        function updateGradientEnd() {
            const color = document.getElementById('gradientEndText').value;
            document.getElementById('gradientEnd').value = color;
            generator.updatePreview();
        }
        
        function updateOutputSize() {
            const outputSize = document.getElementById('outputSize').value;
            const customControls = document.getElementById('customSizeControls');
            
            customControls.style.display = outputSize === 'custom' ? 'block' : 'none';
            
            generator.updatePreview();
        }
        
        function updateQuality(value) {
            document.getElementById('qualityValue').textContent = Math.round(value * 100) + '%';
        }
        
        function downloadImage() {
            generator.downloadImage();
        }
        
        function copyToClipboard() {
            generator.copyToClipboard();
        }
        
        function batchProcess() {
            generator.batchProcess();
        }
        
        function downloadBatch() {
            generator.downloadBatch();
        }
        
        function resetSettings() {
            generator.resetSettings();
        }
        
        function clearAll() {
            generator.clearAll();
        }
        
        function loadPreset() {
            generator.loadPreset();
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            generator = new RoundedImageGenerator();
        });
    </script>
</body>
