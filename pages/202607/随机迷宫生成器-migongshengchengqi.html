<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机迷宫生成器</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #4CAF50; /* 绿色背景 */
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        
        .container {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 800px;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #2E7D32;
            text-align: center;
            margin-top: 0;
        }
        
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }
        
        button, select {
            padding: 8px 15px;
            background-color: #2E7D32;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        
        button:hover {
            background-color: #1B5E20;
        }
        
        .maze-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            overflow: auto;
            max-width: 100%;
        }
        
        canvas {
            border: 2px solid #2E7D32;
            background-color: white;
            max-width: 100%;
        }
        
        .footer {
            color: white;
            text-align: center;
            margin-top: auto;
            padding: 20px;
            font-size: 14px;
        }
        
        a {
            color: #FFEB3B;
            text-decoration: none;
        }
        
        a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 600px) {
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            button, select {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>随机迷宫生成器</h1>
        
        <div class="controls">
            <select id="size">
                <option value="10">10×10</option>
                <option value="20" selected>20×20</option>
                <option value="30">30×30</option>
                <option value="40">40×40</option>
                <option value="50">50×50</option>
            </select>
            
            <button id="generate">生成迷宫</button>
            <button id="download">下载迷宫</button>
        </div>
        
        <div class="maze-container">
            <canvas id="maze"></canvas>
        </div>
    </div>
    
    <div class="footer">
        本工具由兔子先生用deepseek开发<br>
        技术支持：<a href="https://t.zsxq.com/y1934" target="_blank">https://t.zsxq.com/y1934</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const canvas = document.getElementById('maze');
            const ctx = canvas.getContext('2d');
            const generateBtn = document.getElementById('generate');
            const downloadBtn = document.getElementById('download');
            const sizeSelect = document.getElementById('size');
            
            let maze = [];
            let cellSize = 20;
            let rows = 20;
            let cols = 20;
            
            // 初始化迷宫
            function initMaze() {
                rows = parseInt(sizeSelect.value);
                cols = parseInt(sizeSelect.value);
                
                // 调整画布大小
                const maxWidth = Math.min(window.innerWidth - 40, 800);
                const maxHeight = Math.min(window.innerHeight - 200, 800);
                
                const maxCellSize = Math.min(
                    Math.floor(maxWidth / cols),
                    Math.floor(maxHeight / rows),
                    30
                );
                
                cellSize = Math.max(10, maxCellSize);
                canvas.width = cols * cellSize;
                canvas.height = rows * cellSize;
                
                // 生成迷宫
                generateMaze();
                drawMaze();
            }
            
            // 生成迷宫
            function generateMaze() {
                // 初始化迷宫网格
                maze = new Array(rows);
                for (let i = 0; i < rows; i++) {
                    maze[i] = new Array(cols);
                    for (let j = 0; j < cols; j++) {
                        maze[i][j] = {
                            top: true,
                            right: true,
                            bottom: true,
                            left: true,
                            visited: false
                        };
                    }
                }
                
                // 随机选择一个起点
                const startRow = Math.floor(Math.random() * rows);
                const startCol = Math.floor(Math.random() * cols);
                
                // 使用深度优先搜索生成迷宫
                const stack = [[startRow, startCol]];
                maze[startRow][startCol].visited = true;
                
                while (stack.length > 0) {
                    const [currentRow, currentCol] = stack[stack.length - 1];
                    const neighbors = getUnvisitedNeighbors(currentRow, currentCol);
                    
                    if (neighbors.length === 0) {
                        stack.pop();
                    } else {
                        const [nextRow, nextCol, direction] = neighbors[Math.floor(Math.random() * neighbors.length)];
                        
                        // 移除墙壁
                        switch (direction) {
                            case 'top':
                                maze[currentRow][currentCol].top = false;
                                maze[nextRow][nextCol].bottom = false;
                                break;
                            case 'right':
                                maze[currentRow][currentCol].right = false;
                                maze[nextRow][nextCol].left = false;
                                break;
                            case 'bottom':
                                maze[currentRow][currentCol].bottom = false;
                                maze[nextRow][nextCol].top = false;
                                break;
                            case 'left':
                                maze[currentRow][currentCol].left = false;
                                maze[nextRow][nextCol].right = false;
                                break;
                        }
                        
                        maze[nextRow][nextCol].visited = true;
                        stack.push([nextRow, nextCol]);
                    }
                }
                
                // 设置入口和出口
                const entrance = findEdgeCell();
                const exit = findEdgeCell(entrance);
                
                maze[entrance.row][entrance.col].entrance = true;
                maze[exit.row][exit.col].exit = true;
                
                // 确保有一条从入口到出口的路径
                ensurePath(entrance, exit);
            }
            
            // 获取未访问的邻居
            function getUnvisitedNeighbors(row, col) {
                const neighbors = [];
                
                if (row > 0 && !maze[row - 1][col].visited) {
                    neighbors.push([row - 1, col, 'top']);
                }
                if (col < cols - 1 && !maze[row][col + 1].visited) {
                    neighbors.push([row, col + 1, 'right']);
                }
                if (row < rows - 1 && !maze[row + 1][col].visited) {
                    neighbors.push([row + 1, col, 'bottom']);
                }
                if (col > 0 && !maze[row][col - 1].visited) {
                    neighbors.push([row, col - 1, 'left']);
                }
                
                return neighbors;
            }
            
            // 找到边缘单元格
            function findEdgeCell(avoid = null) {
                let edgeCells = [];
                
                // 收集所有边缘单元格
                for (let i = 0; i < rows; i++) {
                    for (let j = 0; j < cols; j++) {
                        if (i === 0 || i === rows - 1 || j === 0 || j === cols - 1) {
                            if (!avoid || i !== avoid.row || j !== avoid.col) {
                                edgeCells.push({row: i, col: j});
                            }
                        }
                    }
                }
                
                // 随机选择一个边缘单元格
                return edgeCells[Math.floor(Math.random() * edgeCells.length)];
            }
            
            // 确保有一条从入口到出口的路径
            function ensurePath(entrance, exit) {
                const visited = new Array(rows);
                for (let i = 0; i < rows; i++) {
                    visited[i] = new Array(cols).fill(false);
                }
                
                const stack = [[entrance.row, entrance.col]];
                visited[entrance.row][entrance.col] = true;
                
                while (stack.length > 0) {
                    const [currentRow, currentCol] = stack.pop();
                    
                    // 检查是否到达出口
                    if (currentRow === exit.row && currentCol === exit.col) {
                        return true;
                    }
                    
                    // 检查所有方向
                    if (!maze[currentRow][currentCol].top && currentRow > 0 && !visited[currentRow - 1][currentCol]) {
                        visited[currentRow - 1][currentCol] = true;
                        stack.push([currentRow - 1, currentCol]);
                    }
                    if (!maze[currentRow][currentCol].right && currentCol < cols - 1 && !visited[currentRow][currentCol + 1]) {
                        visited[currentRow][currentCol + 1] = true;
                        stack.push([currentRow, currentCol + 1]);
                    }
                    if (!maze[currentRow][currentCol].bottom && currentRow < rows - 1 && !visited[currentRow + 1][currentCol]) {
                        visited[currentRow + 1][currentCol] = true;
                        stack.push([currentRow + 1, currentCol]);
                    }
                    if (!maze[currentRow][currentCol].left && currentCol > 0 && !visited[currentRow][currentCol - 1]) {
                        visited[currentRow][currentCol - 1] = true;
                        stack.push([currentRow, currentCol - 1]);
                    }
                }
                
                // 如果没有路径，创建一个
                createPath(entrance, exit);
            }
            
            // 创建从入口到出口的路径
            function createPath(entrance, exit) {
                let currentRow = entrance.row;
                let currentCol = entrance.col;
                
                while (currentRow !== exit.row || currentCol !== exit.col) {
                    // 决定移动方向
                    let direction;
                    if (currentRow < exit.row) {
                        direction = 'bottom';
                    } else if (currentRow > exit.row) {
                        direction = 'top';
                    } else if (currentCol < exit.col) {
                        direction = 'right';
                    } else {
                        direction = 'left';
                    }
                    
                    // 移除墙壁
                    switch (direction) {
                        case 'top':
                            if (currentRow > 0) {
                                maze[currentRow][currentCol].top = false;
                                maze[currentRow - 1][currentCol].bottom = false;
                                currentRow--;
                            }
                            break;
                        case 'right':
                            if (currentCol < cols - 1) {
                                maze[currentRow][currentCol].right = false;
                                maze[currentRow][currentCol + 1].left = false;
                                currentCol++;
                            }
                            break;
                        case 'bottom':
                            if (currentRow < rows - 1) {
                                maze[currentRow][currentCol].bottom = false;
                                maze[currentRow + 1][currentCol].top = false;
                                currentRow++;
                            }
                            break;
                        case 'left':
                            if (currentCol > 0) {
                                maze[currentRow][currentCol].left = false;
                                maze[currentRow][currentCol - 1].right = false;
                                currentCol--;
                            }
                            break;
                    }
                }
            }
            
            // 绘制迷宫
            function drawMaze() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                
                // 绘制墙壁
                for (let i = 0; i < rows; i++) {
                    for (let j = 0; j < cols; j++) {
                        const x = j * cellSize;
                        const y = i * cellSize;
                        
                        if (maze[i][j].top) {
                            ctx.beginPath();
                            ctx.moveTo(x, y);
                            ctx.lineTo(x + cellSize, y);
                            ctx.stroke();
                        }
                        
                        if (maze[i][j].right) {
                            ctx.beginPath();
                            ctx.moveTo(x + cellSize, y);
                            ctx.lineTo(x + cellSize, y + cellSize);
                            ctx.stroke();
                        }
                        
                        if (maze[i][j].bottom) {
                            ctx.beginPath();
                            ctx.moveTo(x, y + cellSize);
                            ctx.lineTo(x + cellSize, y + cellSize);
                            ctx.stroke();
                        }
                        
                        if (maze[i][j].left) {
                            ctx.beginPath();
                            ctx.moveTo(x, y);
                            ctx.lineTo(x, y + cellSize);
                            ctx.stroke();
                        }
                    }
                }
                
                // 标记入口和出口
                for (let i = 0; i < rows; i++) {
                    for (let j = 0; j < cols; j++) {
                        if (maze[i][j].entrance) {
                            const x = j * cellSize;
                            const y = i * cellSize;
                            ctx.fillStyle = '#4CAF50';
                            ctx.fillRect(x + 2, y + 2, cellSize - 4, cellSize - 4);
                        }
                        
                        if (maze[i][j].exit) {
                            const x = j * cellSize;
                            const y = i * cellSize;
                            ctx.fillStyle = '#F44336';
                            ctx.fillRect(x + 2, y + 2, cellSize - 4, cellSize - 4);
                        }
                    }
                }
            }
            
            // 下载迷宫图片
            function downloadMaze() {
                const link = document.createElement('a');
                link.download = 'maze.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }
            
            // 事件监听
            generateBtn.addEventListener('click', initMaze);
            downloadBtn.addEventListener('click', downloadMaze);
            
            // 窗口大小改变时调整迷宫大小
            window.addEventListener('resize', function() {
                if (maze.length > 0) {
                    initMaze();
                }
            });
            
            // 初始化
            initMaze();
        });
    </script>
</body>
</html>
