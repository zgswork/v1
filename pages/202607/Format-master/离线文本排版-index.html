<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Format</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div><h1><img id="appLogo" src="Format Logo-remove-bg-io.png" alt="" />Format</h1><p class="meta">Ver 1.0 · 作者：Alfred Shi&nbsp;&nbsp;&nbsp;&nbsp;<a id="coffeeLink" href="javascript:void(0)">请作者喝杯咖啡☕️</a></p></div>
      <div class="top-actions">
        <button class="primary" id="exportCurrentBtn">导出当前</button>
        <button id="exportAllBtn">批量导出</button>
        <button id="importTemplateBtn">导入模板</button>
        <button id="saveTemplateBtn">保存模板</button>
        <button id="downloadLogsBtn">下载日志</button>
      </div>
    </header>
    <main class="workspace">
      <section class="panel">
        <div class="panel-head"><h2>输入区</h2><span>文本 / 文件 / 队列</span></div>
        <div class="panel-body stack">
          <section class="card">
            <div class="card-head"><h3>文本输入</h3><button id="clearTextBtn">清空文本</button><span id="countLabel">0 / 20000</span></div>
            <div class="card-body">
              <textarea id="textInput" placeholder="粘贴文本、Markdown 或直接输入会议纪要、草稿等内容"></textarea>
              <div class="row wrap mt-12">
                <label><input type="checkbox" id="cleanBlank" checked /> 去除多余空行</label>
                <label><input type="checkbox" id="fullWidth" checked /> 全角转半角</label>
                <label><input type="checkbox" id="mdDetect" checked /> 自动识别 Markdown</label>
              </div>
            </div>
          </section>
          <section class="card">
            <div class="card-head">
              <h3>文件导入</h3>
              <button id="clearFilesBtn">清除所有文件</button>
              <button id="pickFilesBtn">选择文件</button>
              <input id="fileInput" class="hidden" type="file" multiple accept=".txt,.md,.docx" />
            </div>
            <div class="card-body">
              <div class="hint">支持 `.txt`、`.md`、`.docx`。拖拽文件也可。</div>
              <div id="queueList" class="queue"></div>
            </div>
          </section>
        </div>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>样式设置</h2><span id="templateBadge">未加载模板</span></div>
        <div class="panel-body scroll">
          <section class="acc">
            <details open>
              <summary>页面设置</summary>
              <div class="grid two">
                <label>纸张<select id="paperPreset"><option>A4</option><option>Letter</option><option>B5</option><option>Custom</option></select></label>
                <label>宽度(mm)<input id="pageWidth" type="number" step="0.1" /></label>
                <label>高度(mm)<input id="pageHeight" type="number" step="0.1" /></label>
              </div>
              <div class="grid two mt-12">
                <label><input id="enablePageNumber" type="checkbox" checked /> 启用页码</label>
                <label>页码对齐<select id="footerAlign"><option value="left">左</option><option value="center">中</option><option value="right">右</option><option value="oddEven">奇偶分页</option></select></label>
                <label>页脚距底边(mm)<input id="footerDistance" type="number" step="0.5" /></label>
                <label>页码字体<select id="footerFontSelect"><option>宋体</option><option>黑体</option><option>仿宋_GB2312</option><option>方正小标宋简体</option><option>楷体GB2312</option><option>Times New Roman</option><option value="__custom__">自定义…</option></select><input id="footerFont" type="text" class="hidden" placeholder="输入字体名" /></label>
              </div>
              <div class="grid two mt-12">
                <label>上边距(mm)<input id="marginTop" type="number" step="0.5" /></label>
                <label>下边距(mm)<input id="marginBottom" type="number" step="0.5" /></label>
                <label>左边距(mm)<input id="marginLeft" type="number" step="0.5" /></label>
                <label>右边距(mm)<input id="marginRight" type="number" step="0.5" /></label>
              </div>
            </details>
            <details open>
              <summary>标题样式</summary>
              <div class="grid two">
                <label>标题字体<select id="titleFontSelect"><option>宋体</option><option>黑体</option><option>仿宋_GB2312</option><option>方正小标宋简体</option><option>楷体GB2312</option><option>Times New Roman</option><option value="__custom__">自定义…</option></select><input id="titleFont" type="text" class="hidden" placeholder="输入字体名" /></label>
                <label>标题颜色<input id="titleColor" type="color" /></label>
                <label>标题字号<select id="titleSize"></select></label>
                <label>标题行距(磅)<input id="titleLineSpacingPt" type="number" step="0.5" /></label>
                <label><input id="titleBold" type="checkbox" /> 标题加粗</label>
              </div>
              <div class="grid two mt-12">
                <label>副标题字体<select id="subtitleFontSelect"><option>宋体</option><option>黑体</option><option>仿宋_GB2312</option><option>方正小标宋简体</option><option>楷体GB2312</option><option>Times New Roman</option><option value="__custom__">自定义…</option></select><input id="subtitleFont" type="text" class="hidden" placeholder="输入字体名" /></label>
                <label>副标题颜色<input id="subtitleColor" type="color" /></label>
                <label>副标题字号<select id="subtitleSize"></select></label>
                <label>副标题行距(磅)<input id="subtitleLineSpacingPt" type="number" step="0.5" /></label>
                <label><input id="subtitleBold" type="checkbox" /> 副标题加粗</label>
              </div>
              <div class="grid two mt-12">
                <label>1级标题字体<select id="h1FontSelect"><option>宋体</option><option>黑体</option><option>仿宋_GB2312</option><option>方正小标宋简体</option><option>楷体GB2312</option><option>Times New Roman</option><option value="__custom__">自定义…</option></select><input id="h1Font" type="text" class="hidden" placeholder="输入字体名" /></label>
                <label>1级标题颜色<input id="h1Color" type="color" /></label>
                <label>1级标题字号<select id="h1Size"></select></label>
                <label><input id="h1Bold" type="checkbox" checked /> 1级标题加粗</label>
              </div>
              <div class="grid two mt-12">
                <label>2级标题字体<select id="h2FontSelect"><option>宋体</option><option>黑体</option><option>仿宋_GB2312</option><option>方正小标宋简体</option><option>楷体GB2312</option><option>Times New Roman</option><option value="__custom__">自定义…</option></select><input id="h2Font" type="text" class="hidden" placeholder="输入字体名" /></label>
                <label>2级标题颜色<input id="h2Color" type="color" /></label>
                <label>2级标题字号<select id="h2Size"></select></label>
                <label><input id="h2Bold" type="checkbox" checked /> 2级标题加粗</label>
              </div>
              <div class="grid two mt-12">
                <label>3级标题字体<select id="h3FontSelect"><option>宋体</option><option>黑体</option><option>仿宋_GB2312</option><option>方正小标宋简体</option><option>楷体GB2312</option><option>Times New Roman</option><option value="__custom__">自定义…</option></select><input id="h3Font" type="text" class="hidden" placeholder="输入字体名" /></label>
                <label>3级标题颜色<input id="h3Color" type="color" /></label>
                <label>3级标题字号<select id="h3Size"></select></label>
                <label><input id="h3Bold" type="checkbox" checked /> 3级标题加粗</label>
              </div>
              <div class="grid two mt-12">
                <label>4级标题字体<select id="h4FontSelect"><option>宋体</option><option>黑体</option><option>仿宋_GB2312</option><option>方正小标宋简体</option><option>楷体GB2312</option><option>Times New Roman</option><option value="__custom__">自定义…</option></select><input id="h4Font" type="text" class="hidden" placeholder="输入字体名" /></label>
                <label>4级标题颜色<input id="h4Color" type="color" /></label>
                <label>4级标题字号<select id="h4Size"></select></label>
                <label><input id="h4Bold" type="checkbox" checked /> 4级标题加粗</label>
              </div>
            </details>

            <details open>
              <summary>正文样式</summary>
              <div class="grid two">
                <label>正文字体<select id="bodyFontSelect"><option>宋体</option><option>黑体</option><option>仿宋_GB2312</option><option>方正小标宋简体</option><option>楷体GB2312</option><option>Times New Roman</option><option value="__custom__">自定义…</option></select><input id="bodyFont" type="text" class="hidden" placeholder="输入字体名" /></label>
                <label>正文颜色<input id="bodyColor" type="color" /></label>
                <label>正文字号<select id="bodySize"></select></label>
                <label>正文行距(磅)<input id="bodyLineSpacingPt" type="number" step="0.5" /></label>
                <label>西文字体<select id="latinFontSelect"><option>宋体</option><option>黑体</option><option>仿宋_GB2312</option><option>方正小标宋简体</option><option>楷体GB2312</option><option>Times New Roman</option><option value="__custom__">自定义…</option></select><input id="latinFont" type="text" class="hidden" placeholder="输入字体名" /></label>
                <label>首行缩进(字符)<input id="firstLineIndent" type="number" step="0.5" /></label>
                <label>左缩进(mm)<input id="bodyIndentLeft" type="number" step="0.5" /></label>
                <label>右缩进(mm)<input id="bodyIndentRight" type="number" step="0.5" /></label>
              </div>
            </details>
            <details>
              <summary>高级选项</summary>
              <div class="grid two">
                <label><input id="enableToc" type="checkbox" /> 自动生成目录</label>
                <label>目录标题<input id="tocTitle" type="text" /></label>
                <label>包含层级<input id="tocLevels" type="text" /></label>
                <label><input id="pageBreakBeforeHeading" type="checkbox" /> 标题前分页</label>
                <label><input id="autoLatinFont" type="checkbox" checked /> 自动区分中西文字体</label>
              </div>
            </details>
            <details>
              <summary>模板管理</summary>
              <div class="grid two">
                <label>模板名称<input id="templateName" type="text" /></label>
                <label>版本<input id="templateVersion" type="text" /></label>
              </div>
              <div class="row end mt-12">
                <button id="resetBtn">恢复默认</button>
                <button class="primary" id="saveTemplateBtn2">保存当前模板</button>
              </div>
            </details>
          </section>
        </div>
      </section>
      <section class="panel preview-panel">
        <div class="panel-head"><h2>预览与输出</h2><span id="fileBadge">未选择文件</span></div>
        <div class="panel-body stack">
          <div id="previewWarn" class="warning hidden"></div>
          <div id="previewErr" class="error hidden"></div>
          <div class="row wrap">
            <div class="seg"><button id="prevPageBtn">上一页</button><button id="nextPageBtn">下一页</button></div>
            <div class="seg"><button id="zoomOutBtn">-</button><button id="zoomLabelBtn" disabled>100%</button><button id="zoomInBtn">+</button></div>
            <button id="openOutputBtn">打开输出文件夹</button>
          </div>
          <div class="row wrap"><span class="tag" id="pageIndicator">1 / 1</span><span class="tag" id="docStats">0 段落</span></div>
          <div id="previewFrame" class="preview-frame"></div>
        </div>
      </section>
    </main>
    <footer class="statusbar">
      <div class="status-left"><span id="runtimePill" class="pill">Ready</span><span id="statusText">等待输入内容。</span></div>
      <div class="status-right"><span id="itemsCount">Items: 0</span><span id="logCount">Log: 0</span><span>Ver 1.0</span><span>Alfred Shi</span></div>
    </footer>
  </div>
  <div id="qrOverlay" class="qr-overlay hidden" onclick="this.classList.add('hidden')"><div class="qr-box"><img src="QR_code.JPG" alt="请作者喝杯咖啡" /><p>微信扫码 · 请作者喝杯咖啡☕️</p></div></div>
  <script src="./app.js"></script>
</body>
</html>
