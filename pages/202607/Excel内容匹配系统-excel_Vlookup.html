<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel内容匹配系统</title>
    <!-- 引入xlsx库 -->
    <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .description {
            color: #7f8c8d;
            margin-bottom: 20px;
        }
        
        .upload-section {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .file-card {
            flex: 1;
            min-width: 300px;
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        
        .file-card h3 {
            margin-bottom: 15px;
            color: #3498db;
            display: flex;
            align-items: center;
        }
        
        .file-card h3 span {
            margin-right: 10px;
        }
        
        .file-upload {
            border: 2px dashed #3498db;
            border-radius: 5px;
            padding: 20px;
            text-align: center;
            margin-bottom: 15px;
            background: #ecf0f1;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .file-upload:hover {
            background: #dfe6e9;
        }
        
        .file-upload p {
            margin: 10px 0;
            color: #7f8c8d;
        }
        
        .file-info {
            margin-top: 15px;
            padding: 10px;
            background: white;
            border-radius: 5px;
            border-left: 4px solid #3498db;
        }
        
        .config-section {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        
        .config-section h3 {
            margin-bottom: 15px;
            color: #2c3e50;
        }
        
        .config-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .matching-columns-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        
        .value-columns-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #34495e;
        }
        
        select, button, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        
        select {
            background: white;
        }
        
        button {
            background: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
            margin-top: 10px;
        }
        
        button:hover {
            background: #2980b9;
        }
        
        .download-btn {
            background: #27ae60;
            width: auto;
            padding: 10px 20px;
            margin-left: 10px;
        }
        
        .download-btn:hover {
            background: #219653;
        }
        
        .results-section {
            display: none;
            margin-top: 30px;
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .stats {
            display: flex;
            gap: 15px;
        }
        
        .stat-card {
            flex: 1;
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            min-width: 120px;
        }
        
        .stat-card h4 {
            color: #7f8c8d;
            margin-bottom: 5px;
        }
        
        .stat-card p {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .match {
            color: #27ae60;
        }
        
        .no-match {
            color: #e74c3c;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        th {
            background-color: #3498db;
            color: white;
            font-weight: 600;
            position: sticky;
            top: 0;
        }
        
        tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        
        tr:hover {
            background-color: #ecf0f1;
        }
        
        .match-row {
            border-left: 4px solid #27ae60;
        }
        
        .no-match-row {
            border-left: 4px solid #e74c3c;
        }
        
        .icon {
            font-size: 24px;
            margin-right: 10px;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            gap: 10px;
        }
        
        .pagination button {
            width: auto;
            padding: 8px 15px;
        }
        
        .pagination span {
            padding: 8px 15px;
            background: #f8f9fa;
            border-radius: 5px;
        }
        
        .table-container {
            max-height: 500px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        
        .formula-info {
            background: #e8f4fc;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 14px;
        }
        
        .value-columns-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .value-column-group {
            flex: 1;
            min-width: 200px;
        }
        
        @media (max-width: 768px) {
            .upload-section {
                flex-direction: column;
            }
            
            .stats {
                flex-direction: column;
            }
            
            .results-header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .config-grid {
                grid-template-columns: 1fr;
            }
            
            .value-columns-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Excel内容匹配系统</h1>
            <p class="description">上传源文件和目标文件，系统将帮助您匹配数据（类似VLOOKUP功能）</p>
        </header>
        
        <div class="upload-section">
            <div class="file-card">
                <h3><span class="icon">📁</span> 源Excel文件</h3>
                <div class="file-upload" id="source-drop">
                    <p>拖放源文件到这里或点击上传</p>
                    <p><small>支持.xlsx, .xls格式</small></p>
                    <input type="file" id="source-file" accept=".xlsx, .xls" style="display: none;">
                    <button onclick="document.getElementById('source-file').click()">选择文件</button>
                </div>
                <div class="file-info" id="source-info">未选择文件</div>
            </div>
            
            <div class="file-card">
                <h3><span class="icon">📁</span> 目标Excel文件</h3>
                <div class="file-upload" id="target-drop">
                    <p>拖放目标文件到这里或点击上传</p>
                    <p><small>支持.xlsx, .xls格式</small></p>
                    <input type="file" id="target-file" accept=".xlsx, .xls" style="display: none;">
                    <button onclick="document.getElementById('target-file').click()">选择文件</button>
                </div>
                <div class="file-info" id="target-info">未选择文件</div>
            </div>
        </div>
        
        <div class="config-section">
            <h3>匹配配置</h3>
            <div class="config-grid">
                <div class="matching-columns-container">
                    <div class="form-group">
                        <label for="source-column">选择源文件中的匹配列:</label>
                        <select id="source-column" disabled>
                            <option value="">请先上传源文件</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="target-column">选择目标文件中的匹配列:</label>
                        <select id="target-column" disabled>
                            <option value="">请先上传目标文件</option>
                        </select>
                    </div>
                </div>
                
                <div class="value-columns-container">
                    <div class="form-group value-column-group">
                        <label for="source-value-column">源文件中的值列:</label>
                        <select id="source-value-column" disabled>
                            <option value="">请先上传源文件</option>
                        </select>
                    </div>
                    
                    <div class="form-group value-column-group">
                        <label for="target-value-column">目标文件中的值列:</label>
                        <select id="target-value-column" disabled>
                            <option value="">请先上传目标文件</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="formula">计算公式 (使用变量 b 表示目标值):</label>
                <input type="text" id="formula" placeholder="例如: =b+1" value="=b+1">
                <div class="formula-info">
                    提示: 使用变量 b 表示目标值，例如: =b+1, =b*2, =b-5
                </div>
            </div>
            
            <button id="match-btn" disabled>开始匹配</button>
        </div>
        
        <div class="results-section" id="results-section">
            <div class="results-header">
                <h2>匹配结果</h2>
                <div class="stats">
                    <div class="stat-card">
                        <h4>总记录数</h4>
                        <p id="total-records">0</p>
                    </div>
                    <div class="stat-card">
                        <h4>匹配数</h4>
                        <p id="match-count" class="match">0</p>
                    </div>
                    <div class="stat-card">
                        <h4>不匹配数</h4>
                        <p id="no-match-count" class="no-match">0</p>
                    </div>
                </div>
                <button id="download-btn" class="download-btn">下载结果</button>
            </div>
            
            <div class="table-container">
                <table id="results-table">
                    <thead>
                        <tr id="results-header">
                            <th>序号</th>
                            <!-- 表头将在这里动态生成 -->
                        </tr>
                    </thead>
                    <tbody>
                        <!-- 结果将在这里动态生成 -->
                    </tbody>
                </table>
            </div>
            
            <div class="pagination">
                <button id="prev-page">上一页</button>
                <span id="page-info">第 1 页</span>
                <button id="next-page">下一页</button>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let sourceData = [];
        let targetData = [];
        let sourceHeaders = [];
        let targetHeaders = [];
        let currentPage = 1;
        const rowsPerPage = 100;
        let allResults = [];
        let sourceFileName = '';
        let targetFileName = '';
        
        // 文件上传处理
        document.getElementById('source-file').addEventListener('change', function(e) {
            handleFile(e.target.files[0], 'source');
        });
        
        document.getElementById('target-file').addEventListener('change', function(e) {
            handleFile(e.target.files[0], 'target');
        });
        
        // 拖放功能
        const sourceDrop = document.getElementById('source-drop');
        const targetDrop = document.getElementById('target-drop');
        
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            sourceDrop.addEventListener(eventName, preventDefaults, false);
            targetDrop.addEventListener(eventName, preventDefaults, false);
        });
        
        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }
        
        ['dragenter', 'dragover'].forEach(eventName => {
            sourceDrop.addEventListener(eventName, highlight, false);
            targetDrop.addEventListener(eventName, highlight, false);
        });
        
        ['dragleave', 'drop'].forEach(eventName => {
            sourceDrop.addEventListener(eventName, unhighlight, false);
            targetDrop.addEventListener(eventName, unhighlight, false);
        });
        
        function highlight(e) {
            this.style.backgroundColor = '#d6eaf8';
        }
        
        function unhighlight(e) {
            this.style.backgroundColor = '#ecf0f1';
        }
        
        sourceDrop.addEventListener('drop', handleDrop, false);
        targetDrop.addEventListener('drop', handleDrop, false);
        
        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            const type = this.id === 'source-drop' ? 'source' : 'target';
            handleFile(files[0], type);
        }
        
        // 处理上传的Excel文件
        function handleFile(file, type) {
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                
                // 获取第一个工作表
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet, {header: 1});
                
                if (jsonData.length === 0) {
                    alert('文件为空或无法读取');
                    return;
                }
                
                // 保存数据
                if (type === 'source') {
                    sourceData = jsonData;
                    sourceHeaders = jsonData[0];
                    sourceFileName = file.name;
                    
                    // 更新UI
                    document.getElementById('source-info').textContent = `已选择: ${file.name} (${jsonData.length - 1} 行数据)`;
                    
                    // 填充下拉选项
                    const select = document.getElementById('source-column');
                    const valueSelect = document.getElementById('source-value-column');
                    select.innerHTML = '';
                    valueSelect.innerHTML = '';
                    sourceHeaders.forEach((header, index) => {
                        const option = document.createElement('option');
                        option.value = index;
                        option.textContent = header;
                        select.appendChild(option);
                        
                        const valueOption = option.cloneNode(true);
                        valueSelect.appendChild(valueOption);
                    });
                    select.disabled = false;
                    valueSelect.disabled = false;
                    
                    // 默认选择B列
                    if (sourceHeaders.length > 1) {
                        valueSelect.value = 1;
                    }
                } else {
                    targetData = jsonData;
                    targetHeaders = jsonData[0];
                    targetFileName = file.name;
                    
                    // 更新UI
                    document.getElementById('target-info').textContent = `已选择: ${file.name} (${jsonData.length - 1} 行数据)`;
                    
                    // 填充下拉选项
                    const select = document.getElementById('target-column');
                    const valueSelect = document.getElementById('target-value-column');
                    select.innerHTML = '';
                    valueSelect.innerHTML = '';
                    targetHeaders.forEach((header, index) => {
                        const option = document.createElement('option');
                        option.value = index;
                        option.textContent = header;
                        select.appendChild(option);
                        
                        const valueOption = option.cloneNode(true);
                        valueSelect.appendChild(valueOption);
                    });
                    select.disabled = false;
                    valueSelect.disabled = false;
                    
                    // 默认选择B列
                    if (targetHeaders.length > 1) {
                        valueSelect.value = 1;
                    }
                }
                
                // 如果两个文件都已上传，启用匹配按钮
                if (sourceData.length > 0 && targetData.length > 0) {
                    document.getElementById('match-btn').disabled = false;
                }
            };
            reader.readAsArrayBuffer(file);
        }
        
        // 匹配功能
        document.getElementById('match-btn').addEventListener('click', function() {
            const sourceColIndex = document.getElementById('source-column').value;
            const targetColIndex = document.getElementById('target-column').value;
            const sourceValueColIndex = document.getElementById('source-value-column').value;
            const targetValueColIndex = document.getElementById('target-value-column').value;
            const formula = document.getElementById('formula').value;
            
            if (!sourceColIndex || !targetColIndex || !sourceValueColIndex || !targetValueColIndex) {
                alert('请选择所有必要的列');
                return;
            }
            
            if (!formula || !formula.startsWith('=')) {
                alert('请输入有效的计算公式，以=开头，例如=b+1');
                return;
            }
            
            // 执行匹配
            performMatch(
                parseInt(sourceColIndex), 
                parseInt(targetColIndex),
                parseInt(sourceValueColIndex),
                parseInt(targetValueColIndex),
                formula
            );
        });
        
        // 分页功能
        document.getElementById('prev-page').addEventListener('click', function() {
            if (currentPage > 1) {
                currentPage--;
                displayPage(currentPage);
            }
        });
        
        document.getElementById('next-page').addEventListener('click', function() {
            const totalPages = Math.ceil(allResults.length / rowsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                displayPage(currentPage);
            }
        });
        
        // 下载功能
        document.getElementById('download-btn').addEventListener('click', function() {
            if (allResults.length === 0) {
                alert('没有可下载的数据');
                return;
            }
            
            // 创建工作簿
            const wb = XLSX.utils.book_new();
            
            // 准备数据
            const downloadData = [createHeaderRow()];
            
            allResults.forEach((result, index) => {
                downloadData.push(createResultRow(result, index));
            });
            
            // 创建工作表
            const ws = XLSX.utils.aoa_to_sheet(downloadData);
            
            // 将工作表添加到工作簿
            XLSX.utils.book_append_sheet(wb, ws, '匹配结果');
            
            // 生成Excel文件并下载
            XLSX.writeFile(wb, '匹配结果.xlsx');
        });
        
        // 创建表头行
        function createHeaderRow() {
            const sourceMatchHeader = sourceHeaders[document.getElementById('source-column').value] || '源匹配列';
            const targetMatchHeader = targetHeaders[document.getElementById('target-column').value] || '目标匹配列';
            const sourceValueHeader = sourceHeaders[document.getElementById('source-value-column').value] || '源值列';
            const targetValueHeader = targetHeaders[document.getElementById('target-value-column').value] || '目标值列';
            const formula = document.getElementById('formula').value;
            
            return [
                '序号',
                `${sourceFileName} - ${sourceMatchHeader}`,
                `${targetFileName} - ${targetMatchHeader}`,
                `${sourceFileName} - ${sourceValueHeader}`,
                `${targetFileName} - ${targetValueHeader}`,
                `计算结果 (${formula})`,
                '匹配状态'
            ];
        }
        
        // 创建结果行
        function createResultRow(result, index) {
            return [
                index + 1,
                result.sourceValue,
                result.targetValue,
                result.sourceValueCol,
                result.targetValueCol,
                result.calculatedValue,
                result.isMatch ? '匹配' : (result.hasTargetMatch ? '值不匹配' : '未找到匹配项')
            ];
        }
        
        // 计算公式
        function calculateFormula(formula, bValue) {
            try {
                // 提取公式表达式（去掉=号）
                const expression = formula.substring(1);
                
                // 替换变量b为实际值
                const expressionWithValues = expression.replace(/b/g, bValue);
                
                // 使用eval计算表达式（注意：在生产环境中应使用更安全的表达式求值方法）
                return eval(expressionWithValues);
            } catch (error) {
                console.error('计算公式错误:', error);
                return '计算错误';
            }
        }
        
        function performMatch(sourceColIndex, targetColIndex, sourceValueColIndex, targetValueColIndex, formula) {
            const sourceColData = sourceData.slice(1).map(row => row[sourceColIndex]);
            const sourceValueColData = sourceData.slice(1).map(row => row[sourceValueColIndex]);
            const targetColData = targetData.slice(1).map(row => row[targetColIndex]);
            const targetValueColData = targetData.slice(1).map(row => row[targetValueColIndex]);
            
            let matchCount = 0;
            let noMatchCount = 0;
            
            // 执行匹配
            allResults = sourceColData.map((value, index) => {
                const targetIndex = targetColData.findIndex(targetValue => targetValue === value);
                const isMatch = targetIndex !== -1;
                
                let targetValueCol = '未找到匹配项';
                let calculatedValue = 'N/A';
                let valueMatch = false;
                
                if (isMatch) {
                    targetValueCol = targetValueColData[targetIndex];
                    calculatedValue = calculateFormula(formula, targetValueCol);
                    
                    // 检查计算值是否与源值列匹配
                    valueMatch = sourceValueColData[index] === calculatedValue;
                    
                    if (valueMatch) {
                        matchCount++;
                    } else {
                        noMatchCount++;
                    }
                } else {
                    noMatchCount++;
                }
                
                return {
                    sourceValue: value,
                    targetValue: isMatch ? targetColData[targetIndex] : '未找到匹配项',
                    sourceValueCol: sourceValueColData[index],
                    targetValueCol: targetValueCol,
                    calculatedValue: calculatedValue,
                    isMatch: valueMatch,
                    hasTargetMatch: isMatch
                };
            });
            
            // 更新统计信息
            document.getElementById('total-records').textContent = sourceColData.length;
            document.getElementById('match-count').textContent = matchCount;
            document.getElementById('no-match-count').textContent = noMatchCount;
            
            // 更新表头
            updateTableHeader();
            
            // 显示第一页
            currentPage = 1;
            displayPage(currentPage);
            
            // 显示结果区域
            document.getElementById('results-section').style.display = 'block';
        }
        
        // 更新表头
        function updateTableHeader() {
            const headerRow = document.getElementById('results-header');
            headerRow.innerHTML = '<th>序号</th>';
            
            const sourceMatchHeader = sourceHeaders[document.getElementById('source-column').value] || '源匹配列';
            const targetMatchHeader = targetHeaders[document.getElementById('target-column').value] || '目标匹配列';
            const sourceValueHeader = sourceHeaders[document.getElementById('source-value-column').value] || '源值列';
            const targetValueHeader = targetHeaders[document.getElementById('target-value-column').value] || '目标值列';
            const formula = document.getElementById('formula').value;
            
            // 添加源表列
            headerRow.innerHTML += `<th>${sourceFileName} - ${sourceMatchHeader}</th>`;
            
            // 添加目标表列
            headerRow.innerHTML += `<th>${targetFileName} - ${targetMatchHeader}</th>`;
            
            // 分别添加源值列和目标值列
            headerRow.innerHTML += `<th>${sourceFileName} - ${sourceValueHeader}</th>`;
            headerRow.innerHTML += `<th>${targetFileName} - ${targetValueHeader}</th>`;
            
            // 添加计算列
            headerRow.innerHTML += `<th>计算结果 (${formula})</th>`;
            
            // 添加匹配状态列
            headerRow.innerHTML += '<th>匹配状态</th>';
        }
        
        function displayPage(page) {
            const startIndex = (page - 1) * rowsPerPage;
            const endIndex = Math.min(startIndex + rowsPerPage, allResults.length);
            
            // 准备结果表格
            const resultsBody = document.querySelector('#results-table tbody');
            resultsBody.innerHTML = '';
            
            // 添加当前页的数据
            for (let i = startIndex; i < endIndex; i++) {
                const result = allResults[i];
                const row = document.createElement('tr');
                row.className = result.isMatch ? 'match-row' : 'no-match-row';
                
                // 分别显示源值和目标值
                row.innerHTML = `
                    <td>${i + 1}</td>
                    <td>${result.sourceValue}</td>
                    <td>${result.targetValue}</td>
                    <td>${result.sourceValueCol}</td>
                    <td>${result.hasTargetMatch ? result.targetValueCol : 'N/A'}</td>
                    <td>${result.hasTargetMatch ? result.calculatedValue : 'N/A'}</td>
                    <td>${result.isMatch ? '<span style="color: #27ae60;">匹配</span>' : 
                         (result.hasTargetMatch ? '<span style="color: #e74c3c;">值不匹配</span>' : 
                         '<span style="color: #e67e22;">未找到匹配项</span>')}</td>
                `;
                
                resultsBody.appendChild(row);
            }
            
            // 更新分页信息
            const totalPages = Math.ceil(allResults.length / rowsPerPage);
            document.getElementById('page-info').textContent = `第 ${page} 页，共 ${totalPages} 页`;
            
            // 更新分页按钮状态
            document.getElementById('prev-page').disabled = page === 1;
            document.getElementById('next-page').disabled = page === totalPages;
        }
    </script>
</body>
</html>
