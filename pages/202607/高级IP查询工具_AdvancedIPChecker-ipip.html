<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 多语言SEO元素 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="免费IP查询工具，可显示公网IP和精确地理位置。支持手动IP查询和多API自动切换。Free IP lookup tool with geolocation and automatic API fallback.">
    <meta name="keywords" content="IP查询,公网IP,地理位置,IP定位,网络工具,IP checker,public IP,geolocation,IP lookup">
    <meta name="author" content="IP Checker Tool">
    <meta property="og:title" content="高级IP查询工具（支持中英文）| Advanced IP Checker">
    <meta property="og:description" content="免费查询IP地址和地理位置/Free IP and geolocation lookup tool">
    <title id="page-title">高级IP查询工具 | Advanced IP Checker</title>
    
    <!-- 样式 -->
    <style>
        :root {
            --primary-color: #2c7be5;
            --secondary-color: #1a68d1;
            --error-color: #e74c3c;
            --success-color: #2ecc71;
            --text-color: #333;
            --light-text: #666;
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            padding: 30px;
            box-sizing: border-box;
        }
        h1 {
            color: var(--primary-color);
            margin-top: 0;
            text-align: center;
        }
        .language-switcher {
            position: absolute;
            top: 20px;
            right: 20px;
        }
        .language-switcher button {
            background: none;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 5px;
        }
        .language-switcher button.active {
            background: var(--primary-color);
            color: white;
        }
        .section {
            margin-bottom: 25px;
            padding: 20px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.7);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--primary-color);
            display: flex;
            align-items: center;
        }
        .section-title svg {
            margin-right: 8px;
        }
        #ip-display {
            font-size: 28px;
            font-weight: bold;
            margin: 15px 0;
            word-break: break-all;
        }
        .geo-info {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        .geo-item {
            background: rgba(44, 123, 229, 0.1);
            padding: 10px;
            border-radius: 6px;
        }
        .geo-label {
            font-size: 12px;
            color: var(--light-text);
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .geo-value {
            font-weight: 500;
        }
        .input-group {
            display: flex;
            margin-top: 15px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px 0 0 4px;
            font-size: 16px;
        }
        button {
            padding: 12px 20px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }
        button:hover {
            background: var(--secondary-color);
        }
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        .status {
            font-size: 14px;
            margin-top: 10px;
            min-height: 20px;
        }
        .success {
            color: var(--success-color);
        }
        .error {
            color: var(--error-color);
        }
        .loading {
            color: var(--light-text);
        }
        .rate-limit {
            font-size: 12px;
            color: var(--light-text);
            margin-top: 5px;
        }
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 12px;
            color: var(--light-text);
        }
        #map {
            height: 300px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            .geo-info {
                grid-template-columns: 1fr;
            }
            .language-switcher {
                position: static;
                text-align: center;
                margin-bottom: 15px;
            }
        }
    </style>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <div class="container">
        <!-- 语言切换器 -->
        <div class="language-switcher">
            <button id="lang-zh" class="active">中文</button>
            <button id="lang-en">English</button>
        </div>
        
        <h1 id="main-title">高级IP查询工具</h1>
        
        <div class="section">
            <div class="section-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span id="section-ip">您的公网IP地址</span>
            </div>
            <div id="ip-display">⏳ 正在检测IP...</div>
            <div id="ip-status" class="status loading"></div>
            <button id="refresh-btn" data-zh="刷新" data-en="Refresh">刷新</button>
            <div class="rate-limit" data-zh="(每10秒只能刷新一次)" data-en="(Refresh limited to once every 10 seconds)">(每10秒只能刷新一次)</div>
        </div>
        
        <div class="section">
            <div class="section-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                    <circle cx="12" cy="10" r="3"></circle>
                </svg>
                <span id="section-geo">地理位置信息</span>
            </div>
            <div id="geo-display" class="geo-info">
                <div class="geo-item">
                    <div class="geo-label" data-zh="国家" data-en="Country">国家</div>
                    <div id="geo-country" class="geo-value">-</div>
                </div>
                <div class="geo-item">
                    <div class="geo-label" data-zh="地区" data-en="Region">地区</div>
                    <div id="geo-region" class="geo-value">-</div>
                </div>
                <div class="geo-item">
                    <div class="geo-label" data-zh="城市" data-en="City">城市</div>
                    <div id="geo-city" class="geo-value">-</div>
                </div>
                <div class="geo-item">
                    <div class="geo-label" data-zh="运营商" data-en="ISP">运营商</div>
                    <div id="geo-isp" class="geo-value">-</div>
                </div>
            </div>
            <div id="geo-status" class="status loading"></div>
            <div id="map"></div>
        </div>
        
        <div class="section">
            <div class="section-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <span id="section-lookup">手动IP查询</span>
            </div>
            <div class="input-group">
                <input type="text" id="custom-ip" placeholder="输入IP地址 (例如: 8.8.8.8)" data-zh-placeholder="输入IP地址 (例如: 8.8.8.8)" data-en-placeholder="Enter IP (e.g., 8.8.8.8)">
                <button id="lookup-btn" data-zh="查询" data-en="Lookup">查询</button>
            </div>
            <div id="custom-ip-status" class="status"></div>
        </div>
        
        <div class="footer">
            <p id="footer-api" data-zh="使用免费API: ip-api.com, ipinfo.io, ipify (自动切换)" data-en="Uses free APIs: ip-api.com, ipinfo.io, ipify (auto fallback)">使用免费API: ip-api.com, ipinfo.io, ipify (自动切换)</p>
            <p id="footer-copyright" data-zh="© 2024 IP查询工具 | 频率限制防止滥用" data-en="© 2024 IP Checker Tool | Rate limited">© 2024 IP查询工具 | 频率限制防止滥用</p>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // ================== 多语言配置 ==================
        const translations = {
            zh: {
                "main-title": "高级IP查询工具",
                "section-ip": "您的公网IP地址",
                "section-geo": "地理位置信息",
                "section-lookup": "手动IP查询",
                "loading-ip": "正在检测IP...",
                "loading-geo": "正在获取地理位置...",
                "try-api": "正在尝试 {api}...",
                "success-api": "✓ 成功通过 {api}",
                "rate-limit": "请等待 {seconds} 秒后再刷新",
                "all-failed": "所有API都失败了，请稍后再试",
                "enter-ip": "请输入IP地址",
                "invalid-ip": "IP地址格式无效",
                "lookup-failed": "查询失败: {error}",
                "geo-unavailable": "地理位置不可用",
                "country": "国家",
                "region": "地区",
                "city": "城市",
                "isp": "运营商",
                "refresh": "刷新",
                "lookup": "查询",
                "unknown": "未知"
            },
            en: {
                "main-title": "Advanced IP Checker",
                "section-ip": "Your Public IP Address",
                "section-geo": "Geolocation Information",
                "section-lookup": "Manual IP Lookup",
                "loading-ip": "Detecting your IP...",
                "loading-geo": "Fetching geolocation...",
                "try-api": "Trying {api}...",
                "success-api": "✓ Success via {api}",
                "rate-limit": "Please wait {seconds} seconds before refreshing",
                "all-failed": "All APIs failed. Please try again later",
                "enter-ip": "Please enter an IP address",
                "invalid-ip": "Invalid IP address format",
                "lookup-failed": "Lookup failed: {error}",
                "geo-unavailable": "Geolocation unavailable",
                "country": "Country",
                "region": "Region",
                "city": "City",
                "isp": "ISP",
                "refresh": "Refresh",
                "lookup": "Lookup",
                "unknown": "Unknown"
            }
        };

        let currentLang = 'zh';
        
        // 切换语言
        function setLanguage(lang) {
            currentLang = lang;
            
            // 更新文本元素
            document.querySelectorAll('[data-zh], [data-en]').forEach(el => {
                if (el.dataset[lang]) {
                    if (el.tagName === 'INPUT') {
                        el.placeholder = el.dataset[`${lang}-placeholder`] || el.dataset[lang];
                    } else {
                        el.textContent = el.dataset[lang];
                    }
                }
            });
            
            // 更新翻译文本
            document.getElementById('main-title').textContent = translations[lang]['main-title'];
            document.getElementById('section-ip').textContent = translations[lang]['section-ip'];
            document.getElementById('section-geo').textContent = translations[lang]['section-geo'];
            document.getElementById('section-lookup').textContent = translations[lang]['section-lookup'];
            document.getElementById('footer-api').textContent = translations[lang]['footer-api'];
            document.getElementById('footer-copyright').textContent = translations[lang]['footer-copyright'];
            
            // 更新按钮状态
            document.querySelector('.language-switcher button.active').classList.remove('active');
            document.getElementById(`lang-${lang}`).classList.add('active');
            
            // 更新页面标题
            document.getElementById('page-title').textContent = 
                lang === 'zh' ? '高级IP查询工具 | Advanced IP Checker' : 'Advanced IP Checker | 高级IP查询工具';
        }

        // 翻译函数
        function t(key, params = {}) {
            let text = translations[currentLang][key] || key;
            for (const [k, v] of Object.entries(params)) {
                text = text.replace(`{${k}}`, v);
            }
            return text;
        }

        // ================== IP查询逻辑 ==================
        const IP_APIS = [
            {
                name: "ip-api.com",
                url: "https://ip-api.com/json/",
                parser: (data) => ({
                    ip: data.query,
                    country: data.country,
                    region: data.regionName,
                    city: data.city,
                    isp: data.isp,
                    lat: data.lat,
                    lon: data.lon,
                    as: data.as
                }),
                geoFallback: null
            },
            {
                name: "ipinfo.io",
                url: "https://ipinfo.io/json",
                parser: (data) => ({
                    ip: data.ip,
                    country: data.country,
                    region: data.region,
                    city: data.city,
                    isp: data.org,
                    ...(data.loc ? { 
                        lat: parseFloat(data.loc.split(',')[0]),
                        lon: parseFloat(data.loc.split(',')[1])
                    } : {})
                }),
                geoFallback: "https://ipapi.co/{ip}/json/"
            },
            {
                name: "ipwhois",
                url: "https://ipwho.is/",
                parser: (data) => ({
                    ip: data.ip,
                    country: data.country,
                    region: data.region,
                    city: data.city,
                    isp: data.connection?.isp,
                    lat: data.latitude,
                    lon: data.longitude
                }),
                geoFallback: null
            }
        ];

        // 状态元素
        const elements = {
            ip: document.getElementById('ip-display'),
            ipStatus: document.getElementById('ip-status'),
            geoStatus: document.getElementById('geo-status'),
            customIpStatus: document.getElementById('custom-ip-status'),
            refreshBtn: document.getElementById('refresh-btn'),
            lookupBtn: document.getElementById('lookup-btn'),
            customIpInput: document.getElementById('custom-ip'),
            geoFields: {
                country: document.getElementById('geo-country'),
                region: document.getElementById('geo-region'),
                city: document.getElementById('geo-city'),
                isp: document.getElementById('geo-isp')
            },
            map: document.getElementById('map')
        };

        // 速率控制 (10秒冷却)
        let lastRequestTime = 0;
        const RATE_LIMIT_MS = 10000;
        let mapInstance = null;

        // 初始化事件监听
        function initEventListeners() {
            elements.refreshBtn.addEventListener('click', fetchIPWithFallback);
            elements.lookupBtn.addEventListener('click', lookupCustomIP);
            elements.customIpInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') lookupCustomIP();
            });
            
            // 语言切换
            document.getElementById('lang-zh').addEventListener('click', () => setLanguage('zh'));
            document.getElementById('lang-en').addEventListener('click', () => setLanguage('en'));
        }

        // 获取地理位置备用数据
        async function fetchGeoFallback(ip, fallbackUrl) {
            if (!fallbackUrl) return null;
            
            try {
                const url = fallbackUrl.replace('{ip}', ip);
                const response = await fetch(url);
                if (!response.ok) throw new Error('Fallback API failed');
                
                const data = await response.json();
                return {
                    country: data.country_name || data.country,
                    region: data.region_name || data.region,
                    city: data.city,
                    isp: data.organization || data.org,
                    ...(data.latitude && { 
                        lat: parseFloat(data.latitude),
                        lon: parseFloat(data.longitude) 
                    })
                };
            } catch (error) {
                console.warn('Geo fallback failed:', error);
                return null;
            }
        }

        // 更新地图显示
        function updateMap(lat, lon, ip) {
            if (!lat || !lon) {
                elements.map.style.display = 'none';
                if (mapInstance) mapInstance.remove();
                return;
            }

            elements.map.style.display = 'block';
            
            if (!mapInstance) {
                mapInstance = L.map('map').setView([lat, lon], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
                }).addTo(mapInstance);
            } else {
                mapInstance.setView([lat, lon], 13);
            }

            // 清除旧标记
            mapInstance.eachLayer(layer => {
                if (layer instanceof L.Marker) {
                    mapInstance.removeLayer(layer);
                }
            });

            L.marker([lat, lon]).addTo(mapInstance)
                .bindPopup(`IP: ${ip}`)
                .openPopup();
        }

        // 更新显示
        function updateDisplay(data) {
            elements.ip.textContent = data.ip || t('unknown');
            
            // 设置默认值
            elements.geoFields.country.textContent = data.country || t('unknown');
            elements.geoFields.region.textContent = data.region || t('unknown');
            elements.geoFields.city.textContent = data.city || t('unknown');
            elements.geoFields.isp.textContent = data.isp || t('unknown');
            
            // 更新地图
            if (data.lat && data.lon) {
                updateMap(data.lat, data.lon, data.ip);
            } else {
                elements.map.style.display = 'none';
            }
        }

        // 主函数：获取IP和地理位置
        async function fetchIPWithFallback() {
            const now = Date.now();
            if (now - lastRequestTime < RATE_LIMIT_MS) {
                elements.ipStatus.textContent = t('rate-limit', { 
                    seconds: Math.ceil((RATE_LIMIT_MS - (now - lastRequestTime)) / 1000) 
                });
                elements.ipStatus.className = 'status error';
                return;
            }

            lastRequestTime = now;
            elements.refreshBtn.disabled = true;
            elements.ip.textContent = "⏳ " + t('loading-ip');
            elements.ipStatus.textContent = t('loading-ip');
            elements.ipStatus.className = 'status loading';
            elements.geoStatus.textContent = t('loading-geo');
            elements.geoStatus.className = 'status loading';
            
            try {
                // 尝试所有API直到成功
                for (let i = 0; i < IP_APIS.length; i++) {
                    const api = IP_APIS[i];
                    elements.ipStatus.textContent = t('try-api', { api: api.name });
                    
                    try {
                        const response = await fetch(api.url);
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        
                        const data = await response.json();
                        const result = api.parser(data);
                        
                        // 如果主API没有返回地理信息，尝试备用API
                        if ((!result.country || !result.city) && api.geoFallback) {
                            const geoData = await fetchGeoFallback(result.ip, api.geoFallback);
                            if (geoData) {
                                result.country = geoData.country || result.country;
                                result.region = geoData.region || result.region;
                                result.city = geoData.city || result.city;
                                result.isp = geoData.isp || result.isp;
                                result.lat = geoData.lat || result.lat;
                                result.lon = geoData.lon || result.lon;
                            }
                        }
                        
                        updateDisplay(result);
                        
                        elements.ipStatus.textContent = t('success-api', { api: api.name });
                        elements.ipStatus.className = 'status success';
                        elements.geoStatus.textContent = t('success-api', { api: api.name });
                        elements.geoStatus.className = 'status success';
                        return;
                    } catch (err) {
                        console.warn(`API ${api.name} failed:`, err);
                        if (i === IP_APIS.length - 1) throw err;
                    }
                }
            } catch (error) {
                elements.ip.textContent = "❌ " + t('unknown');
                elements.ipStatus.textContent = t('all-failed');
                elements.ipStatus.className = 'status error';
                elements.geoStatus.textContent = t('geo-unavailable');
                elements.geoStatus.className = 'status error';
                updateDisplay({}); // Reset display
            } finally {
                elements.refreshBtn.disabled = false;
            }
        }

        // 手动查询IP
        async function lookupCustomIP() {
            const ip = elements.customIpInput.value.trim();
            if (!ip) {
                elements.customIpStatus.textContent = t('enter-ip');
                elements.customIpStatus.className = 'status error';
                return;
            }

            // IP格式验证
            if (!/^(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)(\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)){3}$/.test(ip)) {
                elements.customIpStatus.textContent = t('invalid-ip');
                elements.customIpStatus.className = 'status error';
                return;
            }

            elements.lookupBtn.disabled = true;
            elements.customIpStatus.textContent = "⏳ " + t('loading-geo');
            elements.customIpStatus.className = 'status loading';
            
            try {
                // 使用ip-api.com进行查询（支持手动IP查询）
                const response = await fetch(`https://ip-api.com/json/${ip}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                if (data.status !== 'success') throw new Error(data.message || t('lookup-failed'));
                
                // 更新显示
                updateDisplay({
                    ip: data.query,
                    country: data.country,
                    region: data.regionName,
                    city: data.city,
                    isp: data.isp,
                    lat: data.lat,
                    lon: data.lon
                });
                
                elements.customIpStatus.textContent = "✅ " + t('success-api', { api: 'ip-api.com' });
                elements.customIpStatus.className = 'status success';
                elements.geoStatus.textContent = t('success-api', { api: 'ip-api.com' });
                elements.geoStatus.className = 'status success';
            } catch (error) {
                elements.customIpStatus.textContent = "❌ " + t('lookup-failed', { error: error.message });
                elements.customIpStatus.className = 'status error';
                updateDisplay({ ip });
            } finally {
                elements.lookupBtn.disabled = false;
            }
        }

        // 初始化
        function init() {
            initEventListeners();
            fetchIPWithFallback();
        }

        // 页面加载时初始化
        window.onload = init;
    </script>
</body>
</html>
