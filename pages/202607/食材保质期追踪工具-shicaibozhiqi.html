<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食材保质期追踪工具</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        :root {
            --primary: #4CAF50;
            --primary-dark: #388E3C;
            --secondary: #FF9800;
            --danger: #F44336;
            --light: #F9F9F9;
            --dark: #333;
            --gray: #777;
            --light-gray: #EEE;
            --border: #DDD;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
        }
        
        body {
            background-color: #f5f7fa;
            color: var(--dark);
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 30px 20px;
            border-radius: 10px 10px 0 0;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px 25px;
            border-radius: 8px;
            text-align: center;
            min-width: 150px;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
        }
        
        .stat-label {
            font-size: 0.9rem;
            margin-top: 5px;
        }
        
        .content {
            display: flex;
            gap: 30px;
            margin-bottom: 40px;
        }
        
        .form-section {
            flex: 1;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: var(--shadow);
        }
        
        .list-section {
            flex: 2;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: var(--shadow);
        }
        
        .section-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--light-gray);
            color: var(--primary-dark);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            transition: border 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.2);
        }
        
        .btn {
            display: inline-block;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
            text-align: center;
        }
        
        .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }
        
        .btn-block {
            display: block;
            width: 100%;
        }
        
        .btn-danger {
            background: var(--danger);
        }
        
        .btn-danger:hover {
            background: #D32F2F;
        }
        
        .btn-secondary {
            background: var(--secondary);
        }
        
        .btn-secondary:hover {
            background: #F57C00;
        }
        
        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .category-filter {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .category-btn {
            background: var(--light);
            border: 1px solid var(--border);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .category-btn.active, .category-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        
        .food-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .food-table th {
            background: var(--light);
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: var(--gray);
        }
        
        .food-table td {
            padding: 15px;
            border-bottom: 1px solid var(--light-gray);
        }
        
        .food-table tr:hover {
            background-color: rgba(76, 175, 80, 0.05);
        }
        
        .food-item.expired {
            background-color: rgba(244, 67, 54, 0.1);
        }
        
        .food-item.expiring-soon {
            background-color: rgba(255, 152, 0, 0.1);
        }
        
        .actions {
            display: flex;
            gap: 10px;
        }
        
        .action-btn {
            background: none;
            border: none;
            color: var(--gray);
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s;
            padding: 5px;
        }
        
        .action-btn:hover {
            color: var(--primary);
        }
        
        .expiry-indicator {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .expiry-normal {
            background: rgba(76, 175, 80, 0.1);
            color: var(--primary);
        }
        
        .expiry-soon {
            background: rgba(255, 152, 0, 0.1);
            color: var(--secondary);
        }
        
        .expiry-expired {
            background: rgba(244, 67, 54, 0.1);
            color: var(--danger);
        }
        
        .no-items {
            text-align: center;
            padding: 40px 0;
            color: var(--gray);
        }
        
        .food-category {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            background: #E3F2FD;
            color: #1976D2;
        }
        
        /* 响应式设计 */
        @media (max-width: 900px) {
            .content {
                flex-direction: column;
            }
            
            .stats {
                flex-direction: column;
                align-items: center;
            }
            
            .stat-card {
                width: 100%;
                max-width: 300px;
            }
        }
        
        @media (max-width: 600px) {
            header {
                padding: 20px 15px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .section-title {
                font-size: 1.3rem;
            }
            
            .food-table {
                display: block;
                overflow-x: auto;
            }
            
            .actions {
                gap: 5px;
            }
            
            .category-filter {
                gap: 5px;
            }
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: var(--gray);
            font-size: 0.9rem;
            margin-top: 20px;
        }
        
        /* 动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-carrot"></i> 食材保质期追踪工具</h1>
            <p class="subtitle">轻松管理您的食材库存，避免浪费，减少过期</p>
            
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="total-items">0</div>
                    <div class="stat-label">总食材数量</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="expiring-soon">0</div>
                    <div class="stat-label">即将过期</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="expired-items">0</div>
                    <div class="stat-label">已过期</div>
                </div>
            </div>
        </header>
        
        <div class="content">
            <div class="form-section">
                <h2 class="section-title"><i class="fas fa-plus-circle"></i> 添加新食材</h2>
                <form id="food-form">
                    <div class="form-group">
                        <label for="food-name">食材名称</label>
                        <input type="text" id="food-name" placeholder="例如：牛奶、鸡蛋、西红柿..." required>
                    </div>
                    
                    <div class="form-group">
                        <label for="expiry-date">保质期</label>
                        <input type="date" id="expiry-date" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="food-category">食材类别</label>
                        <select id="food-category">
                            <option value="dairy">乳制品</option>
                            <option value="meat">肉类</option>
                            <option value="vegetable">蔬菜</option>
                            <option value="fruit">水果</option>
                            <option value="grain">谷物</option>
                            <option value="beverage">饮料</option>
                            <option value="condiment">调味品</option>
                            <option value="other">其他</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="food-note">备注（可选）</label>
                        <input type="text" id="food-note" placeholder="例如：冷藏保存、未开封...">
                    </div>
                    
                    <button type="submit" class="btn btn-block">
                        <i class="fas fa-save"></i> 保存食材
                    </button>
                </form>
            </div>
            
            <div class="list-section">
                <h2 class="section-title"><i class="fas fa-list"></i> 食材清单</h2>
                
                <div class="search-container">
                    <input type="text" id="search-input" placeholder="搜索食材...">
                    <button class="btn" id="clear-search">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                
                <div class="category-filter">
                    <div class="category-btn active" data-category="all">全部</div>
                    <div class="category-btn" data-category="dairy">乳制品</div>
                    <div class="category-btn" data-category="meat">肉类</div>
                    <div class="category-btn" data-category="vegetable">蔬菜</div>
                    <div class="category-btn" data-category="fruit">水果</div>
                    <div class="category-btn" data-category="grain">谷物</div>
                </div>
                
                <div class="table-responsive">
                    <table class="food-table">
                        <thead>
                            <tr>
                                <th>食材名称</th>
                                <th>保质期</th>
                                <th>状态</th>
                                <th>类别</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="food-list">
                            <!-- 动态填充内容 -->
                        </tbody>
                    </table>
                </div>
                
                <div id="no-items-message" class="no-items">
                    <i class="fas fa-inbox" style="font-size: 3rem; margin-bottom: 15px;"></i>
                    <h3>暂无食材记录</h3>
                    <p>请添加您的第一种食材开始追踪</p>
                </div>
            </div>
        </div>
        
        <footer>
            <p>食材保质期追踪工具 &copy; 2023 | 让食材管理更简单</p>
        </footer>
    </div>
    
    <script>
        // 食材数据
        let foodItems = JSON.parse(localStorage.getItem('foodItems')) || [];
        let currentEditId = null;
        
        // DOM 元素
        const foodForm = document.getElementById('food-form');
        const foodList = document.getElementById('food-list');
        const noItemsMessage = document.getElementById('no-items-message');
        const searchInput = document.getElementById('search-input');
        const clearSearch = document.getElementById('clear-search');
        const categoryBtns = document.querySelectorAll('.category-btn');
        const stats = {
            total: document.getElementById('total-items'),
            expiringSoon: document.getElementById('expiring-soon'),
            expired: document.getElementById('expired-items')
        };
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 设置默认日期为今天
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('expiry-date').value = today;
            
            renderFoodList();
            updateStats();
            
            // 添加事件监听器
            foodForm.addEventListener('submit', handleFormSubmit);
            searchInput.addEventListener('input', renderFoodList);
            clearSearch.addEventListener('click', () => {
                searchInput.value = '';
                renderFoodList();
            });
            
            categoryBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    categoryBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderFoodList();
                });
            });
        });
        
        // 处理表单提交
        function handleFormSubmit(e) {
            e.preventDefault();
            
            const name = document.getElementById('food-name').value;
            const expiry = document.getElementById('expiry-date').value;
            const category = document.getElementById('food-category').value;
            const note = document.getElementById('food-note').value;
            
            const foodItem = {
                id: Date.now().toString(),
                name,
                expiry,
                category,
                note,
                added: new Date().toISOString().split('T')[0]
            };
            
            if (currentEditId) {
                // 更新现有食材
                const index = foodItems.findIndex(item => item.id === currentEditId);
                if (index !== -1) {
                    foodItems[index] = {...foodItems[index], name, expiry, category, note};
                }
                currentEditId = null;
            } else {
                // 添加新食材
                foodItems.push(foodItem);
            }
            
            // 保存到本地存储
            localStorage.setItem('foodItems', JSON.stringify(foodItems));
            
            // 重置表单
            foodForm.reset();
            document.getElementById('expiry-date').value = new Date().toISOString().split('T')[0];
            
            // 更新UI
            renderFoodList();
            updateStats();
            
            // 更改按钮文本
            const submitBtn = foodForm.querySelector('button');
            submitBtn.innerHTML = '<i class="fas fa-save"></i> 保存食材';
        }
        
        // 渲染食材列表
        function renderFoodList() {
            const searchTerm = searchInput.value.toLowerCase();
            const activeCategory = document.querySelector('.category-btn.active').dataset.category;
            
            // 筛选食材
            let filteredItems = foodItems.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(searchTerm) || 
                                     (item.note && item.note.toLowerCase().includes(searchTerm));
                const matchesCategory = activeCategory === 'all' || item.category === activeCategory;
                return matchesSearch && matchesCategory;
            });
            
            // 按保质期排序（最近过期的排前面）
            filteredItems.sort((a, b) => new Date(a.expiry) - new Date(b.expiry));
            
            // 渲染列表
            if (filteredItems.length === 0) {
                foodList.innerHTML = '';
                noItemsMessage.style.display = 'block';
                return;
            }
            
            noItemsMessage.style.display = 'none';
            foodList.innerHTML = '';
            
            filteredItems.forEach(item => {
                const row = document.createElement('tr');
                row.className = 'food-item fade-in';
                
                // 检查食材状态
                const today = new Date();
                const expiryDate = new Date(item.expiry);
                const diffTime = expiryDate - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                if (diffDays < 0) {
                    row.classList.add('expired');
                    statusText = '已过期';
                    statusClass = 'expiry-expired';
                } else if (diffDays <= 3) {
                    row.classList.add('expiring-soon');
                    statusText = '即将过期';
                    statusClass = 'expiry-soon';
                } else {
                    statusText = '状态正常';
                    statusClass = 'expiry-normal';
                }
                
                // 类别映射
                const categoryMap = {
                    'dairy': {text: '乳制品', class: 'dairy'},
                    'meat': {text: '肉类', class: 'meat'},
                    'vegetable': {text: '蔬菜', class: 'vegetable'},
                    'fruit': {text: '水果', class: 'fruit'},
                    'grain': {text: '谷物', class: 'grain'},
                    'beverage': {text: '饮料', class: 'beverage'},
                    'condiment': {text: '调味品', class: 'condiment'},
                    'other': {text: '其他', class: 'other'}
                };
                
                row.innerHTML = `
                    <td>
                        <div class="food-name">${item.name}</div>
                        ${item.note ? `<div class="food-note">${item.note}</div>` : ''}
                    </td>
                    <td>${formatDate(item.expiry)}</td>
                    <td><span class="expiry-indicator ${statusClass}">${statusText} (${Math.abs(diffDays)}天)</span></td>
                    <td><span class="food-category">${categoryMap[item.category].text}</span></td>
                    <td>
                        <div class="actions">
                            <button class="action-btn edit-btn" data-id="${item.id}">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="action-btn delete-btn" data-id="${item.id}">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </td>
                `;
                
                foodList.appendChild(row);
            });
            
            // 添加编辑和删除事件
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', () => editFoodItem(btn.dataset.id));
            });
            
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', () => deleteFoodItem(btn.dataset.id));
            });
        }
        
        // 编辑食材
        function editFoodItem(id) {
            const item = foodItems.find(item => item.id === id);
            if (!item) return;
            
            document.getElementById('food-name').value = item.name;
            document.getElementById('expiry-date').value = item.expiry;
            document.getElementById('food-category').value = item.category;
            document.getElementById('food-note').value = item.note || '';
            
            currentEditId = id;
            
            // 更改按钮文本
            const submitBtn = foodForm.querySelector('button');
            submitBtn.innerHTML = '<i class="fas fa-sync-alt"></i> 更新食材';
            
            // 滚动到表单
            document.querySelector('.form-section').scrollIntoView({behavior: 'smooth'});
        }
        
        // 删除食材
        function deleteFoodItem(id) {
            if (confirm('确定要删除这个食材吗？')) {
                foodItems = foodItems.filter(item => item.id !== id);
                localStorage.setItem('foodItems', JSON.stringify(foodItems));
                renderFoodList();
                updateStats();
            }
        }
        
        // 更新统计信息
        function updateStats() {
            stats.total.textContent = foodItems.length;
            
            const today = new Date();
            const soonThreshold = new Date();
            soonThreshold.setDate(today.getDate() + 3);
            
            const expiringSoon = foodItems.filter(item => {
                const expiry = new Date(item.expiry);
                return expiry > today && expiry <= soonThreshold;
            }).length;
            
            const expired = foodItems.filter(item => {
                return new Date(item.expiry) < today;
            }).length;
            
            stats.expiringSoon.textContent = expiringSoon;
            stats.expired.textContent = expired;
        }
        
        // 格式化日期为 YYYY-MM-DD
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });
        }
    </script>
</body>
</html>
