<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数独练习工具</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 100%;
            margin: 0;
            padding: 10px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #333;
            font-size: 24px;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 8px 15px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background-color: #45a049;
        }
        #difficulty {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 1px;
            background-color: #333;
            border: 2px solid #333;
            width: 100%;
            aspect-ratio: 1/1;
            max-width: 100%;
        }
        .cell {
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
        .cell:nth-child(3n) {
            margin-right: 2px;
        }
        .cell:nth-child(9n) {
            margin-right: 0;
        }
        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) {
            margin-bottom: 2px;
        }
        .cell.fixed {
            color: #000;
        }
        .cell.user-input {
            color: #1E88E5;
        }
        .cell.highlighted {
            background-color: #E3F2FD;
        }
        .cell.error {
            color: #E53935;
        }
        .number-pad {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            margin-top: 15px;
        }
        .number-btn {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 10px;
            font-size: 18px;
            border-radius: 4px;
            cursor: pointer;
        }
        .number-btn.clear {
            background-color: #f44336;
        }
        .number-btn.note {
            background-color: #FF9800;
        }
        .timer {
            text-align: center;
            font-size: 18px;
            margin: 10px 0;
        }
        @media (max-width: 400px) {
            .cell {
                font-size: 16px;
            }
            .number-btn {
                padding: 8px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>数独练习工具</h1>
        
        <div class="controls">
            <select id="difficulty">
                <option value="easy">简单</option>
                <option value="medium">中等</option>
                <option value="hard">困难</option>
            </select>
            <button id="new-game">新游戏</button>
            <button id="check">检查答案</button>
            <button id="solve">显示答案</button>
        </div>
        
        <div class="timer">时间: <span id="time">00:00</span></div>
        
        <div class="sudoku-grid" id="grid"></div>
        
        <div class="number-pad">
            <button class="number-btn" data-number="1">1</button>
            <button class="number-btn" data-number="2">2</button>
            <button class="number-btn" data-number="3">3</button>
            <button class="number-btn" data-number="4">4</button>
            <button class="number-btn" data-number="5">5</button>
            <button class="number-btn" data-number="6">6</button>
            <button class="number-btn" data-number="7">7</button>
            <button class="number-btn" data-number="8">8</button>
            <button class="number-btn" data-number="9">9</button>
            <button class="number-btn clear">清除</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const grid = document.getElementById('grid');
            const newGameBtn = document.getElementById('new-game');
            const checkBtn = document.getElementById('check');
            const solveBtn = document.getElementById('solve');
            const difficultySelect = document.getElementById('difficulty');
            const timeDisplay = document.getElementById('time');
            const numberBtns = document.querySelectorAll('.number-btn[data-number]');
            const clearBtn = document.querySelector('.number-btn.clear');
            
            let selectedCell = null;
            let board = Array(9).fill().map(() => Array(9).fill(0));
            let solution = Array(9).fill().map(() => Array(9).fill(0));
            let startTime = null;
            let timerInterval = null;
            
            // 初始化数独网格
            function initializeGrid() {
                grid.innerHTML = '';
                for (let i = 0; i < 81; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = Math.floor(i / 9);
                    cell.dataset.col = i % 9;
                    cell.addEventListener('click', selectCell);
                    grid.appendChild(cell);
                }
            }
            
            // 选择单元格
            function selectCell(e) {
                if (selectedCell) {
                    selectedCell.classList.remove('highlighted');
                }
                
                selectedCell = e.target;
                selectedCell.classList.add('highlighted');
                
                // 高亮同行同列和同宫格的单元格
                const row = parseInt(selectedCell.dataset.row);
                const col = parseInt(selectedCell.dataset.col);
                
                document.querySelectorAll('.cell').forEach(cell => {
                    cell.classList.remove('highlighted');
                    const cellRow = parseInt(cell.dataset.row);
                    const cellCol = parseInt(cell.dataset.col);
                    
                    if (cellRow === row || cellCol === col || 
                        (Math.floor(cellRow / 3) === Math.floor(row / 3) && 
                         Math.floor(cellCol / 3) === Math.floor(col / 3))) {
                        cell.classList.add('highlighted');
                    }
                });
                
                selectedCell.classList.add('highlighted');
            }
            
            // 生成新的数独游戏
            function newGame() {
                const difficulty = difficultySelect.value;
                let clues;
                
                switch(difficulty) {
                    case 'easy': clues = 36; break;
                    case 'medium': clues = 27; break;
                    case 'hard': clues = 17; break;
                    default: clues = 27;
                }
                
                // 生成完整解
                generateSolution();
                
                // 复制解到board
                for (let i = 0; i < 9; i++) {
                    for (let j = 0; j < 9; j++) {
                        board[i][j] = solution[i][j];
                    }
                }
                
                // 挖空
                let cellsToRemove = 81 - clues;
                while (cellsToRemove > 0) {
                    const row = Math.floor(Math.random() * 9);
                    const col = Math.floor(Math.random() * 9);
                    
                    if (board[row][col] !== 0) {
                        const temp = board[row][col];
                        board[row][col] = 0;
                        
                        // 检查是否唯一解
                        if (countSolutions(board) !== 1) {
                            board[row][col] = temp;
                        } else {
                            cellsToRemove--;
                        }
                    }
                }
                
                updateGrid();
                startTimer();
            }
            
            // 生成完整的数独解
            function generateSolution() {
                // 重置solution
                solution = Array(9).fill().map(() => Array(9).fill(0));
                
                // 填充对角线上的3x3宫格
                fillDiagonal();
                
                // 解剩余部分
                solveSudoku(solution);
            }
            
            // 填充对角线上的3x3宫格
            function fillDiagonal() {
                for (let box = 0; box < 9; box += 3) {
                    fillBox(box, box);
                }
            }
            
            // 填充一个3x3宫格
            function fillBox(row, col) {
                const nums = [1, 2, 3, 4, 5, 6, 7, 8, 9];
                shuffleArray(nums);
                
                let index = 0;
                for (let i = 0; i < 3; i++) {
                    for (let j = 0; j < 3; j++) {
                        solution[row + i][col + j] = nums[index++];
                    }
                }
            }
            
            // 打乱数组
            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }
            
            // 解数独
            function solveSudoku(grid) {
                const emptyCell = findEmptyCell(grid);
                if (!emptyCell) return true;
                
                const [row, col] = emptyCell;
                
                for (let num = 1; num <= 9; num++) {
                    if (isValid(grid, row, col, num)) {
                        grid[row][col] = num;
                        
                        if (solveSudoku(grid)) {
                            return true;
                        }
                        
                        grid[row][col] = 0;
                    }
                }
                
                return false;
            }
            
            // 查找空格
            function findEmptyCell(grid) {
                for (let i = 0; i < 9; i++) {
                    for (let j = 0; j < 9; j++) {
                        if (grid[i][j] === 0) {
                            return [i, j];
                        }
                    }
                }
                return null;
            }
            
            // 检查数字是否有效
            function isValid(grid, row, col, num) {
                // 检查行
                for (let x = 0; x < 9; x++) {
                    if (grid[row][x] === num) return false;
                }
                
                // 检查列
                for (let x = 0; x < 9; x++) {
                    if (grid[x][col] === num) return false;
                }
                
                // 检查3x3宫格
                const boxStartRow = row - row % 3;
                const boxStartCol = col - col % 3;
                
                for (let i = 0; i < 3; i++) {
                    for (let j = 0; j < 3; j++) {
                        if (grid[boxStartRow + i][boxStartCol + j] === num) return false;
                    }
                }
                
                return true;
            }
            
            // 计算解的个数
            function countSolutions(grid) {
                const tempGrid = JSON.parse(JSON.stringify(grid));
                let count = 0;
                
                function backtrack() {
                    const emptyCell = findEmptyCell(tempGrid);
                    if (!emptyCell) {
                        count++;
                        return;
                    }
                    
                    const [row, col] = emptyCell;
                    
                    for (let num = 1; num <= 9 && count < 2; num++) {
                        if (isValid(tempGrid, row, col, num)) {
                            tempGrid[row][col] = num;
                            backtrack();
                            tempGrid[row][col] = 0;
                        }
                    }
                }
                
                backtrack();
                return count;
            }
            
            // 更新网格显示
            function updateGrid() {
                const cells = document.querySelectorAll('.cell');
                cells.forEach(cell => {
                    const row = parseInt(cell.dataset.row);
                    const col = parseInt(cell.dataset.col);
                    const value = board[row][col];
                    
                    cell.textContent = value !== 0 ? value : '';
                    cell.className = 'cell';
                    
                    if (value !== 0) {
                        cell.classList.add('fixed');
                    } else {
                        cell.classList.add('user-input');
                    }
                });
            }
            
            // 检查答案
            function checkSolution() {
                let isComplete = true;
                let isCorrect = true;
                
                const cells = document.querySelectorAll('.cell');
                cells.forEach(cell => {
                    const row = parseInt(cell.dataset.row);
                    const col = parseInt(cell.dataset.col);
                    const value = board[row][col];
                    
                    if (value === 0) {
                        isComplete = false;
                    } else if (value !== solution[row][col]) {
                        isCorrect = false;
                        cell.classList.add('error');
                    }
                });
                
                if (!isComplete) {
                    alert(isCorrect ? '当前填写的数字都是正确的，但还没有完成！' : '有一些错误，请检查标红的格子！');
                } else {
                    alert(isCorrect ? '恭喜！解答正确！' : '解答有误，请再检查一下！');
                    if (isCorrect) {
                        stopTimer();
                    }
                }
            }
            
            // 显示答案
            function showSolution() {
                for (let i = 0; i < 9; i++) {
                    for (let j = 0; j < 9; j++) {
                        board[i][j] = solution[i][j];
                    }
                }
                updateGrid();
                stopTimer();
            }
            
            // 开始计时器
            function startTimer() {
                if (timerInterval) clearInterval(timerInterval);
                startTime = new Date();
                timerInterval = setInterval(updateTimer, 1000);
            }
            
            // 停止计时器
            function stopTimer() {
                if (timerInterval) clearInterval(timerInterval);
            }
            
            // 更新计时器显示
            function updateTimer() {
                const now = new Date();
                const elapsed = Math.floor((now - startTime) / 1000);
                const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
                const seconds = (elapsed % 60).toString().padStart(2, '0');
                timeDisplay.textContent = `${minutes}:${seconds}`;
            }
            
            // 输入数字
            function inputNumber(num) {
                if (!selectedCell || selectedCell.classList.contains('fixed')) return;
                
                const row = parseInt(selectedCell.dataset.row);
                const col = parseInt(selectedCell.dataset.col);
                
                board[row][col] = num;
                selectedCell.textContent = num;
                selectedCell.classList.remove('error');
                
                // 检查是否完成
                let isComplete = true;
                for (let i = 0; i < 9; i++) {
                    for (let j = 0; j < 9; j++) {
                        if (board[i][j] === 0) {
                            isComplete = false;
                            break;
                        }
                    }
                    if (!isComplete) break;
                }
                
                if (isComplete) {
                    checkSolution();
                }
            }
            
            // 清除单元格
            function clearCell() {
                if (!selectedCell || selectedCell.classList.contains('fixed')) return;
                
                const row = parseInt(selectedCell.dataset.row);
                const col = parseInt(selectedCell.dataset.col);
                
                board[row][col] = 0;
                selectedCell.textContent = '';
                selectedCell.classList.remove('error');
            }
            
            // 事件监听
            newGameBtn.addEventListener('click', newGame);
            checkBtn.addEventListener('click', checkSolution);
            solveBtn.addEventListener('click', showSolution);
            
            numberBtns.forEach(btn => {
                btn.addEventListener('click', () => inputNumber(parseInt(btn.dataset.number)));
            });
            
            clearBtn.addEventListener('click', clearCell);
            
            // 键盘输入
            document.addEventListener('keydown', (e) => {
                if (!selectedCell) return;
                
                if (e.key >= '1' && e.key <= '9') {
                    inputNumber(parseInt(e.key));
                } else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') {
                    clearCell();
                }
            });
            
            // 初始化
            initializeGrid();
            newGame();
        });
    </script>
</body>
</html>
