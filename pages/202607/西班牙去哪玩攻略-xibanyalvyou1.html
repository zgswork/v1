        // 获取DOM元素
        const generateBtn = document.getElementById('generateBtn');
        const changeBtn = document.getElementById('changeBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const modal = document.getElementById('myModal');
        const closeBtn = document.querySelector('.close');
        const resultContainer = document.getElementById('resultContainer');
        const resultTitle = document.getElementById('resultTitle');
        const resultDescription = document.getElementById('resultDescription');
        const resultAddress = document.getElementById('resultAddress');
        const resultTransport = document.getElementById('resultTransport');
        const resultTicket = document.getElementById('resultTicket');
        const resultHours = document.getElementById('resultHours');
        
        // 记录已显示的景点索引
        let shownAttractions = [];
        
        // 生成随机景点
        function generateRandomAttraction() {
            // 如果所有景点都已显示过，重置记录
            if (shownAttractions.length === attractions.length) {
                shownAttractions = [];
            }
            
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * attractions.length);
            } while (shownAttractions.includes(randomIndex));
            
            shownAttractions.push(randomIndex);
            return attractions[randomIndex];
        }
        
        // 显示景点信息
        function displayAttraction(attraction) {
            resultTitle.textContent = attraction.name;
            resultDescription.textContent = attraction.description;
            resultAddress.textContent = attraction.address;
            resultTransport.textContent = attraction.transport;
            resultTicket.textContent = attraction.ticket;
            resultHours.textContent = attraction.hours;
            
            resultContainer.style.display = 'block';
            generateBtn.style.display = 'none';
            changeBtn.style.display = 'inline-block';
        }
        
        // 事件监听
        generateBtn.addEventListener('click', function() {
            const attraction = generateRandomAttraction();
            displayAttraction(attraction);
        });
        
        changeBtn.addEventListener('click', function() {
            const attraction = generateRandomAttraction();
            displayAttraction(attraction);
        });
        
        // 下载按钮事件
        downloadBtn.addEventListener('click', function() {
            modal.style.display = 'block';
        });
        
        // 关闭模态框事件
        closeBtn.addEventListener('click', function() {
            modal.style.display = 'none';
        });
        
        // 点击模态框外部关闭
        window.addEventListener('click', function(event) {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });
    </script>
