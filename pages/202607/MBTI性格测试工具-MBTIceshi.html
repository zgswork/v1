        .question {
            margin-bottom: 25px;
            display: none;
        }

        .question.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 15px;
            color: var(--secondary-color);
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background-color: var(--light-gray);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option:hover {
            background-color: #d1d7dc;
        }

        .option input {
            margin-right: 10px;
            cursor: pointer;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

            padding: 10px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: var(--secondary-color);
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .progress-container {
            width: 100%;
            background-color: var(--light-gray);
            border-radius: 8px;
            margin: 20px 0;
            height: 10px;
        }

        .progress-bar {
            height: 100%;
            border-radius: 8px;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-color);
            margin-bottom: 10px;
        }

        .result-container {
            display: none;
            background-color: var(--white);
            border-radius: 8px;
            padding: 30px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;

            text-align: center;
            margin-bottom: 30px;
        }

        .mbti-type {
            font-size: 2.5rem;
            color: var(--primary-color);
            font-weight: bold;
            margin-bottom: 10px;

        .type-description {
            font-size: 1.1rem;
            margin-bottom: 20px;
            line-height: 1.7;

            color: var(--secondary-color);

            // 生成问题HTML
            const questionsContainer = document.getElementById('questionsContainer');
            questions.forEach((question, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question';
                questionDiv.id = `question-${index}`;
                if (index === 0) questionDiv.classList.add('active');

                const questionText = document.createElement('div');
                questionText.className = 'question-text';
                questionText.textContent = `${index + 1}. ${question.text}`;

                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'options';

                question.options.forEach((option, optionIndex) => {
                    const optionDiv = document.createElement('label');
                    optionDiv.className = 'option';

                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `q${index}`;
                    input.value = optionIndex;
                    input.dataset.dimension = question.dimension;
                    input.dataset.direction = question.direction;

                    const span = document.createElement('span');
                    span.textContent = option;

                    optionDiv.appendChild(input);
                    optionDiv.appendChild(span);
                    optionsDiv.appendChild(optionDiv);
                });

                questionDiv.appendChild(questionText);
                questionDiv.appendChild(optionsDiv);
                questionsContainer.appendChild(questionDiv);
            });

            // 测试逻辑
            const testContainer = document.getElementById('testContainer');
            const resultContainer = document.getElementById('resultContainer');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const restartBtn = document.getElementById('restartBtn');
            const currentQuestionSpan = document.getElementById('currentQuestion');
            const progressBar = document.getElementById('progressBar');

            let currentQuestion = 0;
            const answers = Array(questions.length).fill(null);
            const scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };

            // 更新进度条
            function updateProgress() {
                const progress = ((currentQuestion + 1) / questions.length) * 100;
                progressBar.style.width = `${progress}%`;
                currentQuestionSpan.textContent = currentQuestion + 1;
            }

            // 显示当前问题
            function showQuestion(index) {
                document.querySelectorAll('.question').forEach(q => q.classList.remove('active'));
                document.getElementById(`question-${index}`).classList.add('active');

                // 更新按钮状态
                prevBtn.disabled = index === 0;
                nextBtn.textContent = index === questions.length - 1 ? '查看结果' : '下一题';

                // 恢复已选择的答案
                if (answers[index] !== null) {
                    const inputs = document.querySelectorAll(`#question-${index} input`);
                    inputs[answers[index]].checked = true;
                }

                updateProgress();
            }

            // 保存答案
            function saveAnswer() {
                const selectedOption = document.querySelector(`#question-${currentQuestion} input:checked`);
                if (selectedOption) {
                    answers[currentQuestion] = parseInt(selectedOption.value);

                    // 更新分数
                    const dimension = selectedOption.dataset.dimension;
                    const direction = parseInt(selectedOption.dataset.direction);
                    const trait = selectedOption.value == direction ? dimension[0] : dimension[1];
                    scores[trait]++;
                }
            }

            // 导航按钮事件
            nextBtn.addEventListener('click', function() {
                saveAnswer();

                if (currentQuestion < questions.length - 1) {
                    currentQuestion++;
                    showQuestion(currentQuestion);
                } else {
                    // 计算最终结果
                    calculateResult();
                    testContainer.style.display = 'none';
                    resultContainer.style.display = 'block';
                }
            });

            prevBtn.addEventListener('click', function() {
                saveAnswer();
                currentQuestion--;
                showQuestion(currentQuestion);
            });

            // 重新开始测试
            restartBtn.addEventListener('click', function() {
                // 重置所有状态
                currentQuestion = 0;
                answers.fill(null);
                for (let key in scores) scores[key] = 0;

                // 清除所有选择
                document.querySelectorAll('input[type="radio"]').forEach(input => {
                    input.checked = false;
                });

                // 显示测试界面
                testContainer.style.display = 'block';
                resultContainer.style.display = 'none';
                showQuestion(0);
            });

            // 计算MBTI结果
            function calculateResult() {
                const ei = scores.E > scores.I ? 'E' : 'I';
                const sn = scores.S > scores.N ? 'S' : 'N';
                const tf = scores.T > scores.F ? 'T' : 'F';
                const jp = scores.J > scores.P ? 'J' : 'P';
                const mbtiType = ei + sn + tf + jp;

                // 显示结果
                document.getElementById('mbtiType').textContent = mbtiType;
                document.getElementById('eiDimension').textContent = `${ei} (外向 ${scores.E} : 内向 ${scores.I})`;
                document.getElementById('snDimension').textContent = `${sn} (实感 ${scores.S} : 直觉 ${scores.N})`;
                document.getElementById('tfDimension').textContent = `${tf} (思考 ${scores.T} : 情感 ${scores.F})`;
                document.getElementById('jpDimension').textContent = `${jp} (判断 ${scores.J} : 感知 ${scores.P})`;

                // 设置类型描述
                setTypeDescription(mbtiType);
            }
