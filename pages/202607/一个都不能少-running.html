<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一个都不能少</title>
    
    <!-- CSS 样式 -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        * {
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Orbitron', monospace;
            background: linear-gradient(135deg, #0a0a23 0%, #1a1a3e 25%, #2d1b69 50%, #4c2885 75%, #663399 100%);
            background-attachment: fixed;
            color: #fff;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(120, 219, 255, 0.2) 0%, transparent 50%);
            animation: backgroundPulse 4s ease-in-out infinite alternate;
            z-index: -1;
        }
        
        @keyframes backgroundPulse {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        #game-container {
            position: relative;
            width: 1200px;
            height: 800px;
            border: 3px solid #00ffff;
            background: linear-gradient(145deg, #1a1a3e, #0a0a23);
            box-shadow: 
                0 0 30px rgba(0, 255, 255, 0.5),
                inset 0 0 30px rgba(0, 255, 255, 0.1),
                0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            overflow: hidden;
            animation: containerGlow 2s ease-in-out infinite alternate;
        }
        
        @keyframes containerGlow {
            0% { box-shadow: 0 0 30px rgba(0, 255, 255, 0.5), inset 0 0 30px rgba(0, 255, 255, 0.1), 0 10px 30px rgba(0, 0, 0, 0.5); }
            100% { box-shadow: 0 0 50px rgba(0, 255, 255, 0.8), inset 0 0 50px rgba(0, 255, 255, 0.2), 0 15px 40px rgba(0, 0, 0, 0.7); }
        }

        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 12px;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-sizing: border-box;
            padding: 40px;
            border-radius: 12px;
        }

        #menu-screen {
            background: linear-gradient(135deg, rgba(26, 26, 62, 0.95), rgba(45, 27, 105, 0.95));
            backdrop-filter: blur(10px);
        }

        #game-over-screen {
            background: linear-gradient(135deg, rgba(45, 27, 105, 0.95), rgba(76, 40, 133, 0.95));
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 64px;
            font-weight: 900;
            margin-bottom: 50px;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #ffff00);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textGlow 3s ease-in-out infinite, gradientShift 4s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            letter-spacing: 3px;
        }
        
        @keyframes textGlow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.8)); }
            50% { filter: drop-shadow(0 0 20px rgba(255, 0, 255, 0.8)); }
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h2 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 25px;
            color: #00ffff;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
            letter-spacing: 2px;
        }

        p {
            margin: 10px 0;
            font-size: 20px;
            color: #b8b8ff;
            text-shadow: 0 0 10px rgba(184, 184, 255, 0.5);
        }

        .score {
            font-size: 56px;
            font-weight: 900;
            background: linear-gradient(45deg, #ffff00, #ff6600);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 25px 0;
            animation: scoreGlow 2s ease-in-out infinite alternate;
            letter-spacing: 2px;
        }
        
        @keyframes scoreGlow {
            0% { filter: drop-shadow(0 0 10px rgba(255, 255, 0, 0.8)); }
            100% { filter: drop-shadow(0 0 25px rgba(255, 102, 0, 0.8)); }
        }

        button {
            padding: 15px 35px;
            font-size: 18px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            margin: 15px 10px;
            border: 2px solid #00ffff;
            background: linear-gradient(145deg, #1a1a3e, #2d1b69);
            color: #00ffff;
            cursor: pointer;
            border-radius: 25px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 
                0 0 20px rgba(0, 255, 255, 0.3),
                inset 0 0 20px rgba(0, 255, 255, 0.1);
        }
        
        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.4), transparent);
            transition: left 0.5s;
        }
        
        button:hover::before {
            left: 100%;
        }
        
        button.disabled {
            cursor: not-allowed;
            background: linear-gradient(145deg, #333, #555);
            color: #888;
            border-color: #555;
            box-shadow: none;
        }
        
        button.disabled::before {
            display: none;
        }

        button:not(.disabled):hover {
            background: linear-gradient(145deg, #2d1b69, #4c2885);
            color: #ffffff;
            transform: translateY(-3px) scale(1.05);
            box-shadow: 
                0 0 30px rgba(0, 255, 255, 0.6),
                inset 0 0 30px rgba(0, 255, 255, 0.2),
                0 10px 25px rgba(0, 0, 0, 0.3);
            animation: buttonPulse 0.3s ease;
        }
        
        @keyframes buttonPulse {
            0% { transform: translateY(-3px) scale(1.05); }
            50% { transform: translateY(-3px) scale(1.1); }
            100% { transform: translateY(-3px) scale(1.05); }
        }

        button:not(.disabled):active {
            transform: translateY(-1px) scale(1.02);
            animation: clickEffect 0.2s ease;
        }
        
        @keyframes clickEffect {
            0% { box-shadow: 0 0 30px rgba(0, 255, 255, 0.6), inset 0 0 30px rgba(0, 255, 255, 0.2); }
            50% { box-shadow: 0 0 50px rgba(255, 0, 255, 0.8), inset 0 0 50px rgba(255, 0, 255, 0.3); }
            100% { box-shadow: 0 0 30px rgba(0, 255, 255, 0.6), inset 0 0 30px rgba(0, 255, 255, 0.2); }
        }

        #restart-button {
            background: linear-gradient(145deg, #ff6600, #ff0066);
            border-color: #ff00ff;
            color: #ffffff;
            box-shadow: 
                0 0 20px rgba(255, 0, 255, 0.4),
                inset 0 0 20px rgba(255, 0, 255, 0.1);
        }

        #restart-button:hover {
            background: linear-gradient(145deg, #ff0066, #ff6600);
            box-shadow: 
                0 0 30px rgba(255, 0, 255, 0.7),
                inset 0 0 30px rgba(255, 0, 255, 0.2),
                0 10px 25px rgba(0, 0, 0, 0.3);
        }
        
        #loading-text {
            animation: loadingPulse 1.5s ease-in-out infinite;
        }
        
        @keyframes loadingPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        /* 粒子效果容器 */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00ffff;
            border-radius: 50%;
            pointer-events: none;
            animation: particleFloat 2s ease-out forwards;
        }
        
        @keyframes particleFloat {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(0);
            }
        }
    </style>
</head>
<body>
    <!-- HTML 结构 -->
    <div id="game-container">
        <canvas id="game-canvas"></canvas>

        <div id="menu-screen" class="screen">
            <h1 style="font-weight: bold;">一个都不能少</h1>
            <button class="menu-button disabled" data-difficulty="nightmare" data-name="噩梦模式">噩梦模式 (2条)</button>
            <button class="menu-button disabled" data-difficulty="hell" data-name="地狱模式">地狱模式 (3条)</button>
            <button class="menu-button disabled" data-difficulty="purgatory" data-name="炼狱模式">炼狱模式 (4条)</button>
            <p id="loading-text" style="margin-top: 15px; color: #888;">资源加载中...</p>
        </div>

        <div id="game-over-screen" class="screen" style="display: none;">
            <h2 id="final-mode-title"></h2>
            <p>新纪录</p>
            <p class="score" id="final-score">0.000秒</p>
            <p>最佳 <span id="best-score">0.000</span>秒</p>
            <button id="restart-button">返回游戏主界面</button>
        </div>
    </div>

    <!-- JavaScript 游戏逻辑 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // ======== 1. 初始化和全局变量 ========
            const canvas = document.getElementById('game-canvas');
            const ctx = canvas.getContext('2d');
            const gameContainer = document.getElementById('game-container');

            canvas.width = gameContainer.offsetWidth;
            canvas.height = gameContainer.offsetHeight;

            const menuScreen = document.getElementById('menu-screen');
            const gameOverScreen = document.getElementById('game-over-screen');
            const finalScoreEl = document.getElementById('final-score');
            const bestScoreEl = document.getElementById('best-score');
            const finalModeTitleEl = document.getElementById('final-mode-title');
            const loadingText = document.getElementById('loading-text');

            let gameState = 'menu';
            let players = [];
            let obstacles = [];
            let gameSpeed = 5;
            let score = 0;
            let animationFrameId;
            let spawnTimers = [];
            let currentDifficulty = '';
            let difficultyName = '';
            
            // 新增: 用于存储加载后的SVG图片对象
            let playerImages = [];
            let obstacleImages = []; // 存储障碍物图片
            let currentFrame = 0;
            let frameCounter = 0;

            // ======== 2. SVG定义与加载 ========
            // 障碍物SVG定义
            const obstacleSvgFrames = [
                // 尖刺障碍
                `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 40">
                    <defs>
                        <linearGradient id="spikeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#ff0066;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#ff3388;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <polygon points="15,5 25,35 5,35" fill="url(#spikeGrad)" stroke="#ffffff" stroke-width="1"/>
                    <polygon points="10,15 20,35 0,35" fill="url(#spikeGrad)" stroke="#ffffff" stroke-width="1"/>
                    <polygon points="20,10 30,35 10,35" fill="url(#spikeGrad)" stroke="#ffffff" stroke-width="1"/>
                </svg>`,
                
                // 圆形障碍
                `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30">
                    <defs>
                        <radialGradient id="circleGrad" cx="50%" cy="30%" r="70%">
                            <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
                            <stop offset="50%" style="stop-color:#ff0066;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#990033;stop-opacity:1" />
                        </radialGradient>
                    </defs>
                    <circle cx="15" cy="15" r="12" fill="url(#circleGrad)" stroke="#ffffff" stroke-width="2"/>
                    <circle cx="15" cy="15" r="6" fill="#ffffff" opacity="0.6"/>
                </svg>`,
                
                // 钻石障碍
                `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 40">
                    <defs>
                        <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
                            <stop offset="50%" style="stop-color:#0066ff;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#003399;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <polygon points="15,5 25,20 15,35 5,20" fill="url(#diamondGrad)" stroke="#ffffff" stroke-width="2"/>
                    <polygon points="15,10 20,20 15,30 10,20" fill="#ffffff" opacity="0.4"/>
                </svg>`,
                
                // 锯齿障碍
                `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 30">
                    <defs>
                        <linearGradient id="sawGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#ffff00;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#ff6600;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <polygon points="0,25 8,5 16,25 24,5 32,25 40,5 40,30 0,30" fill="url(#sawGrad)" stroke="#ffffff" stroke-width="1"/>
                </svg>`,
                
                // 十字障碍
                `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30">
                    <defs>
                        <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#ff00ff;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#8800ff;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <rect x="10" y="5" width="10" height="20" fill="url(#crossGrad)" stroke="#ffffff" stroke-width="1"/>
                    <rect x="5" y="10" width="20" height="10" fill="url(#crossGrad)" stroke="#ffffff" stroke-width="1"/>
                    <rect x="12" y="7" width="6" height="16" fill="#ffffff" opacity="0.3"/>
                    <rect x="7" y="12" width="16" height="6" fill="#ffffff" opacity="0.3"/>
                </svg>`
            ];
            
            // 创建多个跑步动画帧
            const playerSvgFrames = [
                // 帧1: 左腿前，右腿后，左臂后，右臂前
                `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 40">
                    <g stroke="black" stroke-width="3" stroke-linecap="round">
                        <circle cx="15" cy="7" r="6" fill="black"/>
                        <line x1="15" y1="13" x2="15" y2="25" fill="none"/>
                        <line x1="13" y1="16" x2="8" y2="20" fill="none"/>
                        <line x1="17" y1="16" x2="22" y2="20" fill="none"/>
                        <polyline points="15,25 10,35" fill="none"/>
                        <polyline points="15,25 20,35" fill="none"/>
                    </g>
                </svg>`,
                // 帧2: 中间姿态
                `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 40">
                    <g stroke="black" stroke-width="3" stroke-linecap="round">
                        <circle cx="15" cy="6" r="6" fill="black"/>
                        <line x1="15" y1="12" x2="15" y2="24" fill="none"/>
                        <line x1="13" y1="15" x2="10" y2="18" fill="none"/>
                        <line x1="17" y1="15" x2="20" y2="18" fill="none"/>
                        <polyline points="15,24 12,34" fill="none"/>
                        <polyline points="15,24 18,34" fill="none"/>
                    </g>
                </svg>`,
                // 帧3: 右腿前，左腿后，右臂后，左臂前
                `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 40">
                    <g stroke="black" stroke-width="3" stroke-linecap="round">
                        <circle cx="15" cy="7" r="6" fill="black"/>
                        <line x1="15" y1="13" x2="15" y2="25" fill="none"/>
                        <line x1="13" y1="16" x2="18" y2="20" fill="none"/>
                        <line x1="17" y1="16" x2="12" y2="20" fill="none"/>
                        <polyline points="15,25 20,35" fill="none"/>
                        <polyline points="15,25 10,35" fill="none"/>
                    </g>
                </svg>`,
                // 帧4: 中间姿态2
                `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 40">
                    <g stroke="black" stroke-width="3" stroke-linecap="round">
                        <circle cx="15" cy="6" r="6" fill="black"/>
                        <line x1="15" y1="12" x2="15" y2="24" fill="none"/>
                        <line x1="13" y1="15" x2="16" y2="18" fill="none"/>
                        <line x1="17" y1="15" x2="14" y2="18" fill="none"/>
                        <polyline points="15,24 18,34" fill="none"/>
                        <polyline points="15,24 12,34" fill="none"/>
                    </g>
                </svg>`
            ];

            function createSvgImage(svgString) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    const blob = new Blob([svgString], { type: 'image/svg+xml' });
                    const url = URL.createObjectURL(blob);
                    img.onload = () => {
                        URL.revokeObjectURL(url);
                        resolve(img);
                    };
                    img.onerror = (err) => {
                        URL.revokeObjectURL(url);
                        reject(err);
                    };
                    img.src = url;
                });
            }

            // 加载所有动画帧
            async function loadAllPlayerFrames() {
                try {
                    const promises = playerSvgFrames.map(frame => createSvgImage(frame));
                    playerImages = await Promise.all(promises);
                    return true;
                } catch (error) {
                    console.error("Failed to load player frames:", error);
                    return false;
                }
            }
            
            // 加载所有障碍物图片
            async function loadAllObstacleFrames() {
                try {
                    const promises = obstacleSvgFrames.map(frame => createSvgImage(frame));
                    obstacleImages = await Promise.all(promises);
                    return true;
                } catch (error) {
                    console.error("Failed to load obstacle frames:", error);
                    return false;
                }
            }
            
            // 加载所有资源
            async function loadAllAssets() {
                try {
                    const [playerSuccess, obstacleSuccess] = await Promise.all([
                        loadAllPlayerFrames(),
                        loadAllObstacleFrames()
                    ]);
                    return playerSuccess && obstacleSuccess;
                } catch (error) {
                    console.error("Failed to load assets:", error);
                    return false;
                }
            }


            // ======== 3. 游戏对象类定义 ========
            class Player {
                constructor(laneIndex, totalLanes) {
                    this.height = 40;
                    // 根据高度计算宽度以保持SVG比例
                    this.width = this.height * (30 / 40);
                    
                    // 确保每个跑道有足够的高度，最小120像素
                    const minLaneHeight = 120;
                    const availableHeight = canvas.height - 40; // 留出上下边距
                    const calculatedLaneHeight = availableHeight / totalLanes;
                    const laneHeight = Math.max(minLaneHeight, calculatedLaneHeight);
                    
                    const trackLineOffset = 20;
                    this.groundY = 20 + (laneIndex + 1) * laneHeight - trackLineOffset;

                    this.x = 50;
                    this.y = this.groundY - this.height;
                    
                    this.velocityY = 0;
                    this.gravity = 0.6;
                    // 根据跑道高度动态调整跳跃强度，确保不会撞到天花板
                    const maxJumpHeight = laneHeight * 0.6; // 跳跃高度不超过跑道高度的60%
                    this.jumpStrength = -Math.sqrt(2 * this.gravity * maxJumpHeight);
                    this.isJumping = false;
                    this.laneHeight = laneHeight; // 保存跑道高度用于边界检查
                    this.jumpParticles = []; // 跳跃粒子数组
                }

                jump() {
                    if (!this.isJumping) {
                        this.isJumping = true;
                        this.velocityY = this.jumpStrength;
                        
                        // 播放跳跃音效
                        playJumpSound();
                        
                        // 创建跳跃粒子
                        this.createJumpParticles();
                    }
                }
                
                createJumpParticles() {
                    for (let i = 0; i < 8; i++) {
                        this.jumpParticles.push({
                            x: this.x + this.width / 2,
                            y: this.y + this.height,
                            vx: (Math.random() - 0.5) * 10,
                            vy: Math.random() * -8 - 2,
                            life: 30,
                            maxLife: 30,
                            color: `hsl(${180 + Math.random() * 60}, 100%, 70%)`
                        });
                    }
                }
                
                drawJumpParticles(ctx) {
                    for (let i = this.jumpParticles.length - 1; i >= 0; i--) {
                        const particle = this.jumpParticles[i];
                        
                        // 更新粒子
                        particle.x += particle.vx;
                        particle.y += particle.vy;
                        particle.vy += 0.3; // 重力
                        particle.life--;
                        
                        // 绘制粒子
                        const alpha = particle.life / particle.maxLife;
                        ctx.save();
                        ctx.globalAlpha = alpha;
                        ctx.shadowColor = particle.color;
                        ctx.shadowBlur = 8;
                        ctx.fillStyle = particle.color;
                        ctx.beginPath();
                        ctx.arc(particle.x, particle.y, 3 * alpha, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                        
                        // 移除死亡粒子
                        if (particle.life <= 0) {
                            this.jumpParticles.splice(i, 1);
                        }
                    }
                }

                update() {
                    this.velocityY += this.gravity;
                    this.y += this.velocityY;

                    // 地面碰撞检测
                    if (this.y + this.height > this.groundY) {
                        this.y = this.groundY - this.height;
                        this.velocityY = 0;
                        this.isJumping = false;
                    }
                    
                    // 上边界检测，防止跳得太高超出跑道
                    const laneTopY = this.groundY - this.laneHeight + 20;
                    if (this.y < laneTopY) {
                        this.y = laneTopY;
                        this.velocityY = 0;
                    }
                }

                draw(ctx, totalLanes) {
                    // 绘制霓虹风格跑道线
                    const trackLineY = this.groundY + 20;
                    ctx.save();
                    ctx.shadowColor = '#00ffff';
                    ctx.shadowBlur = 10;
                    ctx.strokeStyle = '#00ffff';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(0, trackLineY);
                    ctx.lineTo(canvas.width, trackLineY);
                    ctx.stroke();
                    
                    // 添加第二层发光效果
                    ctx.shadowColor = '#ffffff';
                    ctx.shadowBlur = 5;
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(0, trackLineY);
                    ctx.lineTo(canvas.width, trackLineY);
                    ctx.stroke();
                    ctx.restore();
                    
                    // 绘制当前动画帧
                    if (playerImages.length > 0) {
                        const currentImage = playerImages[currentFrame];
                        ctx.save();
                        
                        // 增强对比度 - 多层发光效果
                        ctx.shadowColor = '#ffffff';
                        ctx.shadowBlur = 15;
                        ctx.drawImage(currentImage, this.x, this.y, this.width, this.height);
                        
                        ctx.shadowColor = '#00ffff';
                        ctx.shadowBlur = 10;
                        ctx.drawImage(currentImage, this.x, this.y, this.width, this.height);
                        
                        ctx.shadowColor = '#ffff00';
                        ctx.shadowBlur = 5;
                        ctx.drawImage(currentImage, this.x, this.y, this.width, this.height);
                        
                        // 跑步拖尾效果
                        if (!this.isJumping) {
                            for (let i = 1; i <= 3; i++) {
                                ctx.globalAlpha = 0.3 / i;
                                ctx.shadowBlur = 3;
                                ctx.drawImage(currentImage, this.x - i * 8, this.y, this.width, this.height);
                            }
                        }
                        
                        // 跳跃特效
                        if (this.isJumping) {
                            ctx.globalAlpha = 0.6;
                            ctx.shadowColor = '#ff00ff';
                            ctx.shadowBlur = 20;
                            ctx.drawImage(currentImage, this.x, this.y, this.width, this.height);
                            
                            // 跳跃粒子效果
                            this.drawJumpParticles(ctx);
                        }
                        
                        ctx.restore();
                    }
                }
            }

            class Obstacle {
                constructor(laneIndex, totalLanes, speed, delayOffset = 0) {
                    // 使用与Player类相同的跑道高度计算逻辑
                    const minLaneHeight = 120;
                    const availableHeight = canvas.height - 40;
                    const calculatedLaneHeight = availableHeight / totalLanes;
                    const laneHeight = Math.max(minLaneHeight, calculatedLaneHeight);
                    
                    const trackLineOffset = 20;
                    const groundY = 20 + (laneIndex + 1) * laneHeight - trackLineOffset;
                    
                    // 随机选择障碍物类型
                    this.obstacleType = Math.floor(Math.random() * obstacleImages.length);
                    
                    // 根据障碍物类型设置尺寸
                    switch(this.obstacleType) {
                        case 0: // 尖刺
                            this.width = 25 + Math.random() * 15;
                            this.height = 35 + Math.random() * 20;
                            break;
                        case 1: // 圆形
                            this.width = this.height = 25 + Math.random() * 15;
                            break;
                        case 2: // 钻石
                            this.width = 20 + Math.random() * 15;
                            this.height = 30 + Math.random() * 20;
                            break;
                        case 3: // 锯齿
                            this.width = 35 + Math.random() * 20;
                            this.height = 20 + Math.random() * 15;
                            break;
                        case 4: // 十字
                            this.width = this.height = 25 + Math.random() * 10;
                            break;
                        default:
                            this.width = 25;
                            this.height = 30;
                    }
                    
                    this.x = canvas.width + delayOffset; // 添加延迟偏移
                    this.y = groundY - this.height;
                    this.speed = speed;
                    this.laneIndex = laneIndex;
                    
                    // 添加旋转动画
                    this.rotation = 0;
                    this.rotationSpeed = (Math.random() - 0.5) * 0.1;
                }
                
                update() { 
                    this.x -= this.speed;
                    this.rotation += this.rotationSpeed;
                }
                
                draw(ctx) {
                    if (this.obstacleType >= obstacleImages.length) return;
                    
                    const obstacleImage = obstacleImages[this.obstacleType];
                    if (!obstacleImage) return;
                    
                    ctx.save();
                    
                    // 移动到障碍物中心进行旋转
                    ctx.translate(this.x + this.width/2, this.y + this.height/2);
                    ctx.rotate(this.rotation);
                    
                    // 添加发光效果
                    ctx.shadowColor = '#ff0066';
                    ctx.shadowBlur = 15;
                    
                    // 绘制SVG障碍物
                    ctx.drawImage(obstacleImage, -this.width/2, -this.height/2, this.width, this.height);
                    
                    // 添加额外的霓虹效果
                    ctx.shadowColor = '#ffffff';
                    ctx.shadowBlur = 8;
                    ctx.globalAlpha = 0.6;
                    ctx.drawImage(obstacleImage, -this.width/2, -this.height/2, this.width, this.height);
                    
                    ctx.restore();
                }
            }

            // ======== 4. 核心游戏流程函数 ========
            // (startGame, endGame, resetGame等函数保持不变)
            function startGame(difficulty, name) {
                gameState = 'playing';
                currentDifficulty = difficulty;
                difficultyName = name;
                menuScreen.style.display = 'none';
                gameOverScreen.style.display = 'none';
                let laneCount;
                switch(difficulty) {
                    case 'hell': laneCount = 3; break;
                    case 'purgatory': laneCount = 4; break;
                    case 'nightmare': default: laneCount = 2; break;
                }
                players = []; obstacles = []; spawnTimers = [];
                for (let i = 0; i < laneCount; i++) {
                    players.push(new Player(i, laneCount));
                    obstacles.push([]);
                    spawnTimers.push(90);
                }
                score = 0; gameSpeed = 5;
                
                // 启动背景音乐
                startBackgroundMusic();
                
                gameLoop();
            }
            function endGame() {
                gameState = 'gameOver';
                cancelAnimationFrame(animationFrameId);
                
                // 停止背景音乐并播放碰撞音效
                stopBackgroundMusic();
                playCollisionSound();
                
                const bestScoreKey = 'bestScore_' + currentDifficulty;
                const bestScore = parseFloat(localStorage.getItem(bestScoreKey) || 0);
                if (score > bestScore) {
                    localStorage.setItem(bestScoreKey, score);
                    bestScoreEl.textContent = `${score.toFixed(3)}秒`;
                } else {
                    bestScoreEl.textContent = `${bestScore.toFixed(3)}秒`;
                }
                finalModeTitleEl.textContent = difficultyName;
                finalScoreEl.textContent = `${score.toFixed(3)}秒`;
                gameOverScreen.style.display = 'flex';
            }
            function resetGame() {
                gameOverScreen.style.display = 'none';
                menuScreen.style.display = 'flex';
                gameState = 'menu';
            }

            // ======== 5. 游戏循环、更新与绘制 ========
            // (gameLoop, updateGame, drawGame等函数保持不变)
             function gameLoop() {
                if (gameState !== 'playing') return;
                updateGame();
                drawGame();
                animationFrameId = requestAnimationFrame(gameLoop);
            }
            function updateGame() {
                score += (1/60); 
                gameSpeed += 0.001;
                
                // 更新动画帧
                frameCounter++;
                if (frameCounter >= 8) { // 每8帧切换一次动画帧
                    frameCounter = 0;
                    currentFrame = (currentFrame + 1) % playerImages.length;
                    
                    // 播放跑步音效（每次切换动画帧时）
                    if (Math.random() < 0.3) { // 30%概率播放，避免过于频繁
                        playRunningSound();
                    }
                }
                
                players.forEach(player => player.update());
                obstacles.forEach(laneObstacles => {
                    for (let i = laneObstacles.length - 1; i >= 0; i--) {
                        const obstacle = laneObstacles[i];
                        obstacle.update();
                        if (obstacle.x + obstacle.width < 0) {
                            laneObstacles.splice(i, 1);
                        }
                    }
                });
                spawnObstacles();
                checkCollisions();
            }
            function drawGame() {
                // 绘制街机风格背景
                const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                gradient.addColorStop(0, '#0a0a23');
                gradient.addColorStop(0.5, '#1a1a3e');
                gradient.addColorStop(1, '#2d1b69');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 添加网格背景效果
                ctx.strokeStyle = 'rgba(0, 255, 255, 0.1)';
                ctx.lineWidth = 1;
                const gridSize = 50;
                for (let x = 0; x < canvas.width; x += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                    ctx.stroke();
                }
                for (let y = 0; y < canvas.height; y += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }
                
                // 绘制游戏元素
                players.forEach(player => player.draw(ctx, players.length));
                obstacles.forEach(laneObstacles => {
                    laneObstacles.forEach(obstacle => obstacle.draw(ctx));
                });
                
                // 绘制霓虹风格分数
                ctx.save();
                ctx.shadowColor = '#00ffff';
                ctx.shadowBlur = 20;
                ctx.fillStyle = '#00ffff';
                ctx.font = 'bold 28px Orbitron, monospace';
                ctx.textAlign = 'right';
                ctx.fillText(`SCORE: ${score.toFixed(3)}`, canvas.width - 30, 50);
                
                // 添加发光效果
                ctx.shadowColor = '#ff00ff';
                ctx.shadowBlur = 15;
                ctx.fillStyle = '#ff00ff';
                ctx.fillText(`SCORE: ${score.toFixed(3)}`, canvas.width - 32, 52);
                ctx.restore();
            }

            // ======== 6. 游戏逻辑辅助函数 ========
            function spawnObstacles() {
                const safeDistance = 300 + Math.random() * 200;
                for (let i = 0; i < players.length; i++) {
                    spawnTimers[i] -= 1;
                    if (spawnTimers[i] <= 0) {
                        const lastObstacle = obstacles[i][obstacles[i].length - 1];
                        if (!lastObstacle || lastObstacle.x < canvas.width - safeDistance) {
                            // 为第一组障碍物添加不同的延迟偏移
                            let delayOffset = 0;
                            if (obstacles[i].length === 0) { // 第一个障碍物
                                delayOffset = i * (100 + Math.random() * 150); // 每个跑道延迟不同时间
                            } else {
                                // 后续障碍物也添加一些随机延迟，避免过于规律
                                delayOffset = Math.random() * 50;
                            }
                            
                            obstacles[i].push(new Obstacle(i, players.length, gameSpeed, delayOffset));
                            spawnTimers[i] = 70 + Math.random() * 100 - (gameSpeed * 2);
                        }
                    }
                }
            }
            function checkCollisions() {
                for (let i = 0; i < players.length; i++) {
                    const player = players[i];
                    for (const obstacle of obstacles[i]) {
                        if (player.x < obstacle.x + obstacle.width &&
                            player.x + player.width > obstacle.x &&
                            player.y < obstacle.y + obstacle.height &&
                            player.y + player.height > obstacle.y) {
                            endGame();
                            return;
                        }
                    }
                }
            }
            
            // ======== 7. 音效系统 ========
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            
            // 创建音效
            function createBeep(frequency, duration, type = 'sine') {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
                oscillator.type = type;
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + duration);
            }
            
            function playJumpSound() {
                // 跳跃音效 - 上升音调
                createBeep(400, 0.1, 'square');
                setTimeout(() => createBeep(600, 0.1, 'square'), 50);
            }
            
            function playRunningSound() {
                // 跑步音效 - 低频节拍
                createBeep(150, 0.05, 'sawtooth');
            }
            
            function playCollisionSound() {
                // 碰撞音效 - 噪音效果
                createBeep(200, 0.3, 'sawtooth');
                setTimeout(() => createBeep(150, 0.2, 'square'), 100);
            }
            
            function playButtonSound() {
                // 按钮音效
                createBeep(800, 0.1, 'sine');
            }
            
            // 背景音乐循环
            let backgroundMusicInterval;
            function startBackgroundMusic() {
                const notes = [262, 294, 330, 349, 392, 440, 494, 523]; // C大调音阶
                let noteIndex = 0;
                
                backgroundMusicInterval = setInterval(() => {
                    if (gameState === 'playing') {
                        createBeep(notes[noteIndex], 0.2, 'triangle');
                        noteIndex = (noteIndex + 1) % notes.length;
                    }
                }, 800);
            }
            
            function stopBackgroundMusic() {
                if (backgroundMusicInterval) {
                    clearInterval(backgroundMusicInterval);
                }
            }
            
            // ======== 8. 粒子效果系统 ========
            function createParticles(x, y, count = 10) {
                for (let i = 0; i < count; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.left = x + 'px';
                    particle.style.top = y + 'px';
                    particle.style.background = `hsl(${Math.random() * 60 + 180}, 100%, 50%)`;
                    
                    const angle = (Math.PI * 2 * i) / count;
                    const velocity = 50 + Math.random() * 50;
                    const vx = Math.cos(angle) * velocity;
                    const vy = Math.sin(angle) * velocity;
                    
                    particle.style.setProperty('--vx', vx + 'px');
                    particle.style.setProperty('--vy', vy + 'px');
                    
                    document.body.appendChild(particle);
                    
                    setTimeout(() => {
                        if (particle.parentNode) {
                            particle.parentNode.removeChild(particle);
                        }
                    }, 2000);
                }
            }
            
            // ======== 8. 事件监听器与启动逻辑 ========
            function initializeGame() {
                loadingText.style.display = 'none'; // 隐藏加载文本
                const menuButtons = document.querySelectorAll('.menu-button');
                menuButtons.forEach(button => {
                    button.classList.remove('disabled'); // 激活按钮
                    
                    // 添加粒子效果
                     button.addEventListener('click', (e) => {
                         playButtonSound(); // 播放按钮音效
                         
                         const rect = button.getBoundingClientRect();
                         const x = rect.left + rect.width / 2;
                         const y = rect.top + rect.height / 2;
                         createParticles(x, y, 15);
                         
                         setTimeout(() => {
                             const difficulty = button.getAttribute('data-difficulty');
                             const name = button.getAttribute('data-name');
                             startGame(difficulty, name);
                         }, 200);
                     });
                    
                    // 悬停音效模拟
                    button.addEventListener('mouseenter', () => {
                        button.style.filter = 'hue-rotate(30deg)';
                    });
                    
                    button.addEventListener('mouseleave', () => {
                        button.style.filter = 'none';
                    });
                });
            }

            // 首先加载所有资源，加载成功后再初始化游戏
            loadAllAssets()
                .then(success => {
                    if (success) {
                        initializeGame();
                    } else {
                        loadingText.textContent = "资源加载失败，请刷新重试！";
                    }
                })
                .catch(error => {
                    console.error("Failed to load assets:", error);
                    loadingText.textContent = "资源加载失败，请刷新重试！";
                });
            
            // 为重启按钮添加粒子效果
             document.getElementById('restart-button').addEventListener('click', (e) => {
                 playButtonSound(); // 播放按钮音效
                 
                 const rect = e.target.getBoundingClientRect();
                 const x = rect.left + rect.width / 2;
                 const y = rect.top + rect.height / 2;
                 createParticles(x, y, 20);
                 
                 setTimeout(() => {
                     resetGame();
                 }, 300);
             });
            canvas.addEventListener('click', (event) => {
                if (gameState !== 'playing') return;
                const rect = canvas.getBoundingClientRect();
                const clickY = event.clientY - rect.top;
                const laneHeight = canvas.height / players.length;
                const clickedLaneIndex = Math.floor(clickY / laneHeight);
                if (players[clickedLaneIndex]) {
                    players[clickedLaneIndex].jump();
                }
            });
        });
    </script>
</body>
</html>
