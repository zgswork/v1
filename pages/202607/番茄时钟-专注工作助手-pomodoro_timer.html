<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄时钟 - 专注工作助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            position: relative;
            color: #333;
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
            min-width: min(450px, 90vw);
            backdrop-filter: blur(10px);
            margin: 10px auto;
            flex-shrink: 0;
        }

        h1 {
            color: #FF6B6B;
            margin-bottom: 30px;
            font-size: 3em;
            font-weight: 300;
        }

        .timer-circle {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: conic-gradient(#FF6B6B 0deg, #FFE66D 360deg);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 30px auto;
            position: relative;
            transition: all 0.3s ease;
        }

        .timer-inner {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .time-display {
            font-size: 3em;
            font-weight: bold;
            color: #2C3E50;
            margin-bottom: 10px;
        }

        .status-text {
            font-size: 1.2em;
            color: #7F8C8D;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .btn-primary {
            background: #FF6B6B;
            color: white;
        }

        .btn-primary:hover {
            background: #FF5252;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #95A5A6;
            color: white;
        }

        .btn-secondary:hover {
            background: #7F8C8D;
            transform: translateY(-2px);
        }

        .btn-pause {
            background: #FFE66D;
            color: #2C3E50;
        }

        .btn-pause:hover {
            background: #FFD93D;
            transform: translateY(-2px);
        }

        .stats {
            background: rgba(255, 255, 255, 0.7);
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .stats-label {
            color: #7F8C8D;
        }

        .stats-value {
            color: #2C3E50;
            font-weight: bold;
        }

        .settings {
            margin-top: 20px;
            text-align: left;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .setting-input {
            width: 60px;
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
            text-align: center;
        }

        .progress-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .progress-circle {
            fill: none;
            stroke: #FF6B6B;
            stroke-width: 8;
            stroke-linecap: round;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            transition: stroke-dasharray 1s ease;
        }

        @media (max-width: 600px) {
            body {
                padding: 5px 0;
            }

            .container {
                padding: 20px;
                width: 95%;
                margin: 5px auto;
            }

            h1 {
                font-size: 2.5em;
                margin-bottom: 20px;
            }

            .timer-circle {
                width: 200px;
                height: 200px;
                margin: 20px auto;
            }

            .timer-inner {
                width: 170px;
                height: 170px;
            }

            .time-display {
                font-size: 2.2em;
            }

            .status-text {
                font-size: 1em;
            }

            .controls {
                flex-direction: row;
                justify-content: center;
                gap: 10px;
                margin: 20px 0;
            }

            .btn {
                flex: 1;
                max-width: 120px;
                padding: 10px 16px;
                font-size: 1em;
            }

            .stats {
                padding: 15px;
                margin-top: 20px;
            }

            .stats-row {
                margin-bottom: 8px;
            }

            .settings {
                margin-top: 15px;
            }

            .setting-item {
                margin-bottom: 12px;
                font-size: 0.9em;
            }

            .setting-input {
                width: 50px;
            }
        }

        @media (max-width: 400px) {
            .container {
                padding: 15px;
                width: 98%;
            }

            h1 {
                font-size: 2.2em;
                margin-bottom: 15px;
            }

            .timer-circle {
                width: 180px;
                height: 180px;
                margin: 15px auto;
            }

            .timer-inner {
                width: 150px;
                height: 150px;
            }

            .time-display {
                font-size: 2em;
            }

            .status-text {
                font-size: 0.9em;
                margin-bottom: 15px;
            }

            .controls {
                gap: 8px;
                margin: 15px 0;
            }

            .btn {
                max-width: 100px;
                padding: 8px 12px;
                font-size: 0.9em;
            }

            .stats {
                padding: 12px;
                margin-top: 15px;
            }

            .stats-row {
                font-size: 0.9em;
            }

            .settings h3 {
                font-size: 1.1em;
                margin-bottom: 10px;
            }

            .setting-item {
                font-size: 0.85em;
                margin-bottom: 10px;
            }

            .setting-input {
                width: 45px;
                padding: 4px;
                font-size: 0.9em;
            }
        }

        .hidden {
            display: none;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #51CF66;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }

        .notification.show {
            transform: translateX(0);
        }

        /* 页脚 */
        .footer {
            text-align: center;
            padding: 5px 20px;
            color: #666;
            font-size: 13px;
            border-top: 1px solid #E0E0E0;
            margin-top: 40px;
            white-space: nowrap;
        }

        .footer strong {
            font-weight: 600;
            color: #333;
        }

        @media (max-width: 500px) {
            .footer {
                white-space: normal;
                padding: 10px 15px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🍅 番茄时钟</h1>

        <div class="timer-circle" id="timerCircle">
            <svg class="progress-ring" width="250" height="250">
                <circle class="progress-circle" cx="125" cy="125" r="115" stroke-dasharray="722.566"
                    stroke-dashoffset="722.566" id="progressCircle"></circle>
            </svg>
            <div class="timer-inner">
                <div class="time-display" id="timeDisplay">25:00</div>
                <div class="status-text" id="statusText">准备开始工作</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="startBtn" onclick="toggleTimer()">开始</button>
            <button class="btn btn-pause" id="pauseBtn" onclick="pauseTimer()" style="display: none;">暂停</button>
            <button class="btn btn-secondary" id="resetBtn" onclick="resetTimer()">重置</button>
        </div>

        <div class="stats">
            <div class="stats-row">
                <span class="stats-label">今日完成:</span>
                <span class="stats-value" id="todayCount">0 个番茄</span>
            </div>
            <div class="stats-row">
                <span class="stats-label">当前轮次:</span>
                <span class="stats-value" id="currentRound">1/4</span>
            </div>
            <div class="stats-row">
                <span class="stats-label">总专注时间:</span>
                <span class="stats-value" id="totalTime">0 分钟</span>
            </div>
        </div>

        <div class="settings">
            <h3 style="margin-bottom: 15px; color: #2C3E50;">设置</h3>
            <div class="setting-item">
                <span>工作时间 (分钟):</span>
                <input type="number" class="setting-input" id="workTime" value="25" min="1" max="60">
            </div>
            <div class="setting-item">
                <span>短休息 (分钟):</span>
                <input type="number" class="setting-input" id="shortBreak" value="5" min="1" max="30">
            </div>
            <div class="setting-item">
                <span>长休息 (分钟):</span>
                <input type="number" class="setting-input" id="longBreak" value="15" min="1" max="60">
            </div>
        </div>

        <!-- 页脚 -->
        <div class="footer">
            本工具用AI编程实现，如有定制工具的需求可联系微信 <strong>L94026958</strong>
        </div>
    </div>

    <div class="notification" id="notification">
        <span id="notificationText">番茄时钟提醒</span>
    </div>

    <script>
        // 应用状态
        const PomodoroStates = {
            WORK: 'work',
            SHORT_BREAK: 'short_break',
            LONG_BREAK: 'long_break'
        };

        let currentState = PomodoroStates.WORK;
        let isRunning = false;
        let timeLeft = 25 * 60; // 秒
        let totalTime = 25 * 60;
        let timerInterval = null;
        let completedPomodoros = 0;
        let currentRound = 1;
        let todayCompleted = 0;
        let totalFocusTime = 0;

        // DOM 元素
        const timeDisplay = document.getElementById('timeDisplay');
        const statusText = document.getElementById('statusText');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const progressCircle = document.getElementById('progressCircle');
        const timerCircle = document.getElementById('timerCircle');
        const todayCount = document.getElementById('todayCount');
        const currentRoundDisplay = document.getElementById('currentRound');
        const totalTimeDisplay = document.getElementById('totalTime');
        const notification = document.getElementById('notification');
        const notificationText = document.getElementById('notificationText');

        // 设置输入框
        const workTimeInput = document.getElementById('workTime');
        const shortBreakInput = document.getElementById('shortBreak');
        const longBreakInput = document.getElementById('longBreak');

        // 初始化
        function init() {
            loadSettings();
            loadStats();
            initializeTimer(); // 根据设置初始化计时器
            updateDisplay();
            updateStats();
        }

        // 根据当前设置初始化计时器
        function initializeTimer() {
            const settings = JSON.parse(localStorage.getItem('pomodoroSettings') || '{}');
            const workTime = settings.workTime || 25;

            // 初始化时总是从工作状态开始
            currentState = PomodoroStates.WORK;
            timeLeft = workTime * 60;
            totalTime = timeLeft;
        }

        // 加载设置
        function loadSettings() {
            const settings = JSON.parse(localStorage.getItem('pomodoroSettings') || '{}');
            const workTime = settings.workTime || 25;
            const shortBreak = settings.shortBreak || 5;
            const longBreak = settings.longBreak || 15;

            // 更新输入框值
            workTimeInput.value = workTime;
            shortBreakInput.value = shortBreak;
            longBreakInput.value = longBreak;

            // 监听设置变化
            [workTimeInput, shortBreakInput, longBreakInput].forEach(input => {
                input.addEventListener('change', saveSettings);
            });
        }

        // 保存设置
        function saveSettings() {
            const settings = {
                workTime: parseInt(workTimeInput.value),
                shortBreak: parseInt(shortBreakInput.value),
                longBreak: parseInt(longBreakInput.value)
            };
            localStorage.setItem('pomodoroSettings', JSON.stringify(settings));

            // 如果当前没有运行，更新时间
            if (!isRunning) {
                resetTimer();
            }
        }

        // 加载统计数据
        function loadStats() {
            const today = new Date().toDateString();
            const stats = JSON.parse(localStorage.getItem('pomodoroStats') || '{}');

            if (stats.date === today) {
                todayCompleted = stats.todayCompleted || 0;
                totalFocusTime = stats.totalFocusTime || 0;
                completedPomodoros = stats.completedPomodoros || 0;
                // 根据已完成的番茄数计算当前轮次
                // 当前轮次应该是下一个要开始的番茄序号
                currentRound = (completedPomodoros % 4) + 1;
            } else {
                // 新的一天，重置所有统计数据
                todayCompleted = 0;
                totalFocusTime = 0;
                completedPomodoros = 0;
                currentRound = 1;
                // 保存重置后的数据
                saveStats();
            }
        }

        // 保存统计数据
        function saveStats() {
            const today = new Date().toDateString();
            const stats = {
                date: today,
                todayCompleted: todayCompleted,
                totalFocusTime: totalFocusTime,
                completedPomodoros: completedPomodoros,
                currentRound: currentRound
            };
            localStorage.setItem('pomodoroStats', JSON.stringify(stats));
        }

        // 更新显示
        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timeDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            // 更新进度环
            const progress = (totalTime - timeLeft) / totalTime;
            const circumference = 2 * Math.PI * 115;
            const offset = circumference - (progress * circumference);
            progressCircle.style.strokeDashoffset = offset;

            // 更新状态文本和颜色
            updateStatusDisplay();
        }

        // 更新状态显示
        function updateStatusDisplay() {
            let statusMessage = '';
            let circleColor = '#FF6B6B';

            switch (currentState) {
                case PomodoroStates.WORK:
                    statusMessage = isRunning ? '专注工作中...' : '准备开始工作';
                    circleColor = '#FF6B6B';
                    break;
                case PomodoroStates.SHORT_BREAK:
                    statusMessage = isRunning ? '短暂休息中...' : '准备短暂休息';
                    circleColor = '#51CF66';
                    break;
                case PomodoroStates.LONG_BREAK:
                    statusMessage = isRunning ? '长时间休息中...' : '准备长时间休息';
                    circleColor = '#4DABF7';
                    break;
            }

            statusText.textContent = statusMessage;
            progressCircle.style.stroke = circleColor;
            timerCircle.style.background = `conic-gradient(${circleColor} 0deg, #FFE66D 360deg)`;
        }

        // 更新统计信息
        function updateStats() {
            todayCount.textContent = `${todayCompleted} 个番茄`;
            currentRoundDisplay.textContent = `${currentRound}/4`;
            totalTimeDisplay.textContent = `${totalFocusTime} 分钟`;
        }

        // 开始/暂停计时器
        function toggleTimer() {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        // 开始计时器
        function startTimer() {
            isRunning = true;
            startBtn.style.display = 'none';
            pauseBtn.style.display = 'inline-block';

            timerInterval = setInterval(() => {
                timeLeft--;
                updateDisplay();

                if (timeLeft <= 0) {
                    completeSession();
                }
            }, 1000);
        }

        // 暂停计时器
        function pauseTimer() {
            isRunning = false;
            startBtn.style.display = 'inline-block';
            pauseBtn.style.display = 'none';

            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }

            updateDisplay();
        }

        // 重置计时器
        function resetTimer() {
            pauseTimer();

            const settings = JSON.parse(localStorage.getItem('pomodoroSettings') || '{}');

            switch (currentState) {
                case PomodoroStates.WORK:
                    timeLeft = (settings.workTime || 25) * 60;
                    break;
                case PomodoroStates.SHORT_BREAK:
                    timeLeft = (settings.shortBreak || 5) * 60;
                    break;
                case PomodoroStates.LONG_BREAK:
                    timeLeft = (settings.longBreak || 15) * 60;
                    break;
            }

            totalTime = timeLeft;
            updateDisplay();
        }

        // 完成一个会话
        function completeSession() {
            pauseTimer();

            // 播放提醒音效（简单的beep）
            playNotificationSound();

            // 显示通知
            showNotification();

            // 更新统计
            if (currentState === PomodoroStates.WORK) {
                completedPomodoros++;
                todayCompleted++;
                totalFocusTime += parseInt(workTimeInput.value);
                saveStats();
                updateStats(); // 立即更新统计显示
            }

            // 切换到下一个状态
            switchToNextState();
            // switchToNextState() 中已经调用了 updateStats()，这里不需要重复调用
        }

        // 切换到下一个状态
        function switchToNextState() {
            const settings = JSON.parse(localStorage.getItem('pomodoroSettings') || '{}');

            if (currentState === PomodoroStates.WORK) {
                if (completedPomodoros % 4 === 0) {
                    // 每4个番茄后长休息
                    currentState = PomodoroStates.LONG_BREAK;
                    timeLeft = (settings.longBreak || 15) * 60;
                    // 长休息时轮次保持为4/4，因为刚完成第4个番茄
                    currentRound = 4;
                } else {
                    // 短休息
                    currentState = PomodoroStates.SHORT_BREAK;
                    timeLeft = (settings.shortBreak || 5) * 60;
                    // 短休息时轮次应该是下一个要开始的番茄序号
                    currentRound = (completedPomodoros % 4) + 1;
                }
            } else {
                // 休息结束，回到工作
                const previousState = currentState;
                currentState = PomodoroStates.WORK;
                timeLeft = (settings.workTime || 25) * 60;
                // 如果是长休息结束，重置轮次到1（开始新的4番茄循环）
                if (previousState === PomodoroStates.LONG_BREAK) {
                    currentRound = 1;
                } else {
                    // 短休息结束后，轮次应该是下一个要开始的番茄序号
                    currentRound = (completedPomodoros % 4) + 1;
                }
            }

            totalTime = timeLeft;
            updateDisplay();
            saveStats(); // 保存状态变化
            updateStats(); // 更新统计显示
        }

        // 播放通知音效
        function playNotificationSound() {
            // 创建简单的beep音效
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = 800;
            oscillator.type = 'sine';

            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
        }

        // 显示通知
        function showNotification() {
            let message = '';

            switch (currentState) {
                case PomodoroStates.WORK:
                    message = '工作时间结束！该休息一下了 🎉';
                    break;
                case PomodoroStates.SHORT_BREAK:
                case PomodoroStates.LONG_BREAK:
                    message = '休息时间结束！准备开始新的工作 💪';
                    break;
            }

            notificationText.textContent = message;
            notification.classList.add('show');

            // 3秒后自动隐藏
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);

            // 尝试显示浏览器通知
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification('番茄时钟提醒', {
                    body: message,
                    icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🍅</text></svg>'
                });
            }
        }

        // 请求通知权限
        function requestNotificationPermission() {
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
        }

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                toggleTimer();
            } else if (e.code === 'KeyR') {
                e.preventDefault();
                resetTimer();
            }
        });

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            init();
            requestNotificationPermission();
        });

        // 页面可见性变化时暂停/恢复
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && isRunning) {
                // 页面隐藏时可以选择暂停或继续运行
                // 这里选择继续运行，让用户在后台也能专注
            }
        });
    </script>
</body>

</html>
