                const fatItems = fatSlot.querySelectorAll('.food-item');
                
                carbItems[0].textContent = currentSelection.carb;
                proteinItems[0].textContent = currentSelection.protein;
                fatItems[0].textContent = currentSelection.fat;
            }, 300);
        }

        // 事件监听
        startBtn.addEventListener('click', startSpinning);
        stopBtn.addEventListener('click', stopSpinning);

        // 初始化
        window.addEventListener('load', initializeSlots);

        // 响应式调整
        window.addEventListener('resize', () => {
            // 重新初始化以确保布局正确
            initializeSlots();
        });
    </script>
</body>
</html>
