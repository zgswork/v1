<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>经典打砖块游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        header {
            text-align: center;
            padding: 15px;
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            background: linear-gradient(to right, #ff9a9e, #fad0c4, #fad0c4, #a1c4fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            font-size: 1rem;
            opacity: 0.8;
        }
        
        .game-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            background: rgba(0, 10, 30, 0.8);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4);
        }
        
        canvas {
            display: block;
            width: 100%;
            background: #0a1929;
        }
        
        .stats {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 15px 20px;
            background: rgba(0, 30, 60, 0.7);
            font-size: 1.2rem;
            font-weight: bold;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            min-width: 140px;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
        }
        
        button:active {
            transform: translateY(1px);
        }
        
        #startBtn {
            background: linear-gradient(45deg, #00b09b, #96c93d);
        }
        
        #resetBtn {
            background: linear-gradient(45deg, #2193b0, #6dd5ed);
        }
        
        .instructions {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
            width: 100%;
            max-width: 600px;
        }
        
        .instructions h2 {
            text-align: center;
            margin-bottom: 15px;
            color: #ffd700;
        }
        
        .instructions ul {
            padding-left: 25px;
        }
        
        .instructions li {
            margin-bottom: 8px;
            line-height: 1.5;
        }
        
        .mobile-controls {
            display: none;
            justify-content: space-between;
            width: 100%;
            max-width: 300px;
            margin-top: 20px;
        }
        
        .mobile-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            user-select: none;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .stats {
                font-size: 1rem;
                padding: 10px 15px;
            }
            
            button {
                padding: 10px 20px;
                font-size: 0.9rem;
                min-width: 120px;
            }
            
            .mobile-controls {
                display: flex;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            button {
                width: 100%;
                max-width: 300px;
            }
        }
        
        .game-over, .level-complete {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        
        .message {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 30px;
            text-align: center;
            color: #ff416c;
            text-shadow: 0 0 10px rgba(255, 65, 108, 0.7);
        }
        
        .level-complete .message {
            color: #00b09b;
            text-shadow: 0 0 10px rgba(0, 176, 155, 0.7);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>经典打砖块</h1>
            <p class="subtitle">移动挡板接住球，击碎所有砖块！</p>
        </header>
        
        <div class="game-container">
            <div class="stats">
                <div>分数: <span id="score">0</span></div>
                <div>生命: <span id="lives">3</span></div>
                <div>关卡: <span id="level">1</span></div>
            </div>
            
            <canvas id="gameCanvas" width="600" height="400"></canvas>
            
            <div class="game-over">
                <div class="message">游戏结束</div>
                <button id="restartBtn">重新开始</button>
            </div>
            
            <div class="level-complete">
                <div class="message">关卡完成!</div>
                <button id="nextLevelBtn">下一关</button>
            </div>
        </div>
        
        <div class="controls">
            <button id="startBtn">开始游戏</button>
            <button id="pauseBtn">暂停</button>
            <button id="resetBtn">重置</button>
        </div>
        
        <div class="mobile-controls">
            <div class="mobile-btn" id="leftBtn">←</div>
            <div class="mobile-btn" id="rightBtn">→</div>
        </div>
        
        <div class="instructions">
            <h2>游戏说明</h2>
            <ul>
                <li>使用鼠标或手指（移动设备）左右移动挡板</li>
                <li>不要让球掉落，否则会失去一条生命</li>
                <li>击碎所有砖块即可进入下一关</li>
                <li>不同颜色的砖块需要不同次数的撞击才能击碎</li>
                <li>收集特殊道具可获得额外能力</li>
                <li>获得500分奖励一条生命</li>
            </ul>
        </div>
    </div>

    <script>
        // 获取Canvas和上下文
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 调整Canvas大小以适应容器
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = Math.min(container.clientWidth * 0.66, 500);
            
            // 如果游戏正在运行，重绘游戏元素
            if (gameRunning) {
                draw();
            }
        }
        
        // 游戏变量
        let gameRunning = false;
        let gamePaused = false;
        let score = 0;
        let lives = 3;
        let level = 1;
        let bricks = [];
        let paddle = {};
        let ball = {};
        let rightPressed = false;
        let leftPressed = false;
        let touchX = null;
        
        // 初始化游戏
        function initGame() {
            // 初始化挡板
            paddle = {
                width: canvas.width / 6,
                height: 12,
                x: (canvas.width - (canvas.width / 6)) / 2,
                speed: 8,
                color: '#FF416C'
            };
            
            // 初始化球
            ball = {
                x: canvas.width / 2,
                y: canvas.height - 30,
                radius: 8,
                dx: 4,
                dy: -4,
                speed: 4,
                color: '#FFFFFF'
            };
            
            // 初始化砖块
            createBricks();
        }
        
        // 创建砖块
        function createBricks() {
            bricks = [];
            const brickRows = 5 + level;
            const brickCols = 8;
            const brickWidth = canvas.width / brickCols - 6;
            const brickHeight = 20;
            const brickPadding = 4;
            const brickOffsetTop = 40;
            const brickOffsetLeft = 3;
            
            const colors = [
                '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFBE0B', '#FB5607',
                '#8338EC', '#3A86FF', '#FF006E', '#8AC926', '#1982C4'
            ];
            
            for (let c = 0; c < brickCols; c++) {
                for (let r = 0; r < brickRows; r++) {
                    // 随机确定砖块强度（1-3）
                    const strength = Math.floor(Math.random() * 3) + 1;
                    
                    const brick = {
                        x: c * (brickWidth + brickPadding) + brickOffsetLeft,
                        y: r * (brickHeight + brickPadding) + brickOffsetTop,
                        width: brickWidth,
                        height: brickHeight,
                        color: colors[(r + c) % colors.length],
                        strength: strength,
                        visible: true
                    };
                    bricks.push(brick);
                }
            }
        }
        
        // 绘制游戏元素
        function draw() {
            // 清除画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制背景
            drawBackground();
            
            // 绘制挡板
            drawPaddle();
            
            // 绘制球
            drawBall();
            
            // 绘制砖块
            drawBricks();
            
            // 绘制分数
            drawScore();
        }
        
        // 绘制背景
        function drawBackground() {
            // 创建渐变背景
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#0a1929');
            gradient.addColorStop(1, '#142850');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制网格线
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            
            // 垂直线
            for (let x = 0; x < canvas.width; x += 30) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            
            // 水平线
            for (let y = 0; y < canvas.height; y += 30) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }
        
        // 绘制挡板
        function drawPaddle() {
            ctx.beginPath();
            ctx.rect(paddle.x, canvas.height - paddle.height, paddle.width, paddle.height);
            
            // 创建挡板渐变
            const gradient = ctx.createLinearGradient(paddle.x, 0, paddle.x + paddle.width, 0);
            gradient.addColorStop(0, '#FF416C');
            gradient.addColorStop(1, '#FF4B2B');
            
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.closePath();
            
            // 添加挡板光泽效果
            ctx.beginPath();
            ctx.rect(paddle.x + 2, canvas.height - paddle.height, paddle.width - 4, 4);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.fill();
            ctx.closePath();
        }
        
        // 绘制球
        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            
            // 创建球渐变
            const gradient = ctx.createRadialGradient(
                ball.x - 3, ball.y - 3, 1,
                ball.x, ball.y, ball.radius
            );
            gradient.addColorStop(0, '#FFFFFF');
            gradient.addColorStop(1, '#4ECDC4');
            
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.closePath();
            
            // 添加球高光
            ctx.beginPath();
            ctx.arc(ball.x - ball.radius/3, ball.y - ball.radius/3, ball.radius/3, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.fill();
            ctx.closePath();
        }
        
        // 绘制砖块
        function drawBricks() {
            bricks.forEach(brick => {
                if (brick.visible) {
                    ctx.beginPath();
                    ctx.rect(brick.x, brick.y, brick.width, brick.height);
                    
                    // 根据砖块强度调整颜色
                    let colorOpacity = 1 - (brick.strength - 1) * 0.3;
                    ctx.fillStyle = brick.color;
                    ctx.fill();
                    
                    // 绘制砖块边框
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    
                    // 绘制砖块强度指示器
                    if (brick.strength > 1) {
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                        ctx.font = '10px Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText(brick.strength, brick.x + brick.width/2, brick.y + brick.height/2 + 4);
                    }
                    
                    ctx.closePath();
                }
            });
        }
        
        // 绘制分数
        function drawScore() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.font = '16px Arial';
            ctx.textAlign = 'left';
            ctx.fillText(`分数: ${score}`, 10, 20);
            ctx.fillText(`生命: ${lives}`, canvas.width - 80, 20);
        }
        
        // 碰撞检测
        function collisionDetection() {
            bricks.forEach(brick => {
                if (brick.visible) {
                    if (ball.x > brick.x && 
                        ball.x < brick.x + brick.width && 
                        ball.y > brick.y && 
                        ball.y < brick.y + brick.height) {
                        
                        brick.strength--;
                        
                        if (brick.strength <= 0) {
                            brick.visible = false;
                            score += 10;
                            
                            // 每500分奖励一条生命
                            if (score % 500 === 0) {
                                lives++;
                                document.getElementById('lives').textContent = lives;
                            }
                            
                            // 检查是否所有砖块都被击碎
                            if (bricks.every(b => !b.visible)) {
                                levelComplete();
                            }
                        }
                        
                        ball.dy = -ball.dy;
                    }
                }
            });
        }
        
        // 移动球
        function moveBall() {
            // 碰撞左右墙
            if (ball.x + ball.dx > canvas.width - ball.radius || ball.x + ball.dx < ball.radius) {
                ball.dx = -ball.dx;
            }
            
            // 碰撞上墙
            if (ball.y + ball.dy < ball.radius) {
                ball.dy = -ball.dy;
            }
            
            // 碰撞挡板
            if (ball.y + ball.dy > canvas.height - ball.radius - paddle.height) {
                if (ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
                    // 根据击中挡板的位置改变反弹角度
                    let hitPoint = (ball.x - (paddle.x + paddle.width/2)) / (paddle.width/2);
                    ball.dx = hitPoint * 5;
                    ball.dy = -ball.dy;
                    
                    // 增加球速（最多10）
                    if (Math.abs(ball.dx) < 10 && Math.abs(ball.dy) < 10) {
                        ball.dx *= 1.02;
                        ball.dy *= 1.02;
                    }
                }
            }
            
            // 球掉落
            if (ball.y + ball.dy > canvas.height - ball.radius) {
                lives--;
                document.getElementById('lives').textContent = lives;
                
                if (lives <= 0) {
                    gameOver();
                } else {
                    // 重置球的位置
                    ball.x = canvas.width / 2;
                    ball.y = canvas.height - 30;
                    ball.dx = 4;
                    ball.dy = -4;
                    paddle.x = (canvas.width - paddle.width) / 2;
                }
            }
            
            ball.x += ball.dx;
            ball.y += ball.dy;
        }
        
        // 移动挡板
        function movePaddle() {
            if (rightPressed && paddle.x < canvas.width - paddle.width) {
                paddle.x += paddle.speed;
            } else if (leftPressed && paddle.x > 0) {
                paddle.x -= paddle.speed;
            } else if (touchX !== null) {
                // 触摸控制
                let newPaddleX = touchX - paddle.width / 2;
                
                if (newPaddleX < 0) {
                    newPaddleX = 0;
                } else if (newPaddleX > canvas.width - paddle.width) {
                    newPaddleX = canvas.width - paddle.width;
                }
                
                paddle.x = newPaddleX;
            }
        }
        
        // 游戏循环
        function gameLoop() {
            if (!gameRunning || gamePaused) return;
            
            movePaddle();
            moveBall();
            collisionDetection();
            draw();
            
            requestAnimationFrame(gameLoop);
        }
        
        // 游戏结束
        function gameOver() {
            gameRunning = false;
            document.querySelector('.game-over').style.display = 'flex';
        }
        
        // 关卡完成
        function levelComplete() {
            gameRunning = false;
            document.querySelector('.level-complete').style.display = 'flex';
        }
        
        // 下一关
        function nextLevel() {
            level++;
            document.getElementById('level').textContent = level;
            document.querySelector('.level-complete').style.display = 'none';
            initGame();
            startGame();
        }
        
        // 开始游戏
        function startGame() {
            if (!gameRunning) {
                gameRunning = true;
                gamePaused = false;
                document.getElementById('startBtn').textContent = '重新开始';
                document.querySelector('.game-over').style.display = 'none';
                document.querySelector('.level-complete').style.display = 'none';
                gameLoop();
            }
        }
        
        // 暂停游戏
        function pauseGame() {
            gamePaused = !gamePaused;
            document.getElementById('pauseBtn').textContent = gamePaused ? '继续' : '暂停';
            
            if (!gamePaused && gameRunning) {
                gameLoop();
            }
        }
        
        // 重置游戏
        function resetGame() {
            gameRunning = false;
            gamePaused = false;
            score = 0;
            lives = 3;
            level = 1;
            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
            document.getElementById('level').textContent = level;
            document.getElementById('pauseBtn').textContent = '暂停';
            document.getElementById('startBtn').textContent = '开始游戏';
            document.querySelector('.game-over').style.display = 'none';
            document.querySelector('.level-complete').style.display = 'none';
            initGame();
            draw();
        }
        
        // 事件监听器
        function setupEventListeners() {
            // 键盘控制
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Right' || e.key === 'ArrowRight') {
                    rightPressed = true;
                } else if (e.key === 'Left' || e.key === 'ArrowLeft') {
                    leftPressed = true;
                }
            });
            
            document.addEventListener('keyup', (e) => {
                if (e.key === 'Right' || e.key === 'ArrowRight') {
                    rightPressed = false;
                } else if (e.key === 'Left' || e.key === 'ArrowLeft') {
                    leftPressed = false;
                }
            });
            
            // 鼠标控制
            canvas.addEventListener('mousemove', (e) => {
                const relativeX = e.clientX - canvas.getBoundingClientRect().left;
                if (relativeX > 0 && relativeX < canvas.width) {
                    touchX = relativeX;
                }
            });
            
            canvas.addEventListener('mouseout', () => {
                touchX = null;
            });
            
            // 触摸控制
            canvas.addEventListener('touchmove', (e) => {
                const touch = e.touches[0];
                const relativeX = touch.clientX - canvas.getBoundingClientRect().left;
                if (relativeX > 0 && relativeX < canvas.width) {
                    touchX = relativeX;
                    e.preventDefault();
                }
            }, { passive: false });
            
            canvas.addEventListener('touchend', () => {
                touchX = null;
            });
            
            // 移动设备按钮控制
            document.getElementById('leftBtn').addEventListener('touchstart', () => {
                leftPressed = true;
            });
            
            document.getElementById('leftBtn').addEventListener('touchend', () => {
                leftPressed = false;
            });
            
            document.getElementById('rightBtn').addEventListener('touchstart', () => {
                rightPressed = true;
            });
            
            document.getElementById('rightBtn').addEventListener('touchend', () => {
                rightPressed = false;
            });
            
            // 按钮事件
            document.getElementById('startBtn').addEventListener('click', () => {
                if (!gameRunning) {
                    startGame();
                } else {
                    resetGame();
                    startGame();
                }
            });
            
            document.getElementById('pauseBtn').addEventListener('click', pauseGame);
            document.getElementById('resetBtn').addEventListener('click', resetGame);
            document.getElementById('restartBtn').addEventListener('click', () => {
                resetGame();
                startGame();
            });
            
            document.getElementById('nextLevelBtn').addEventListener('click', nextLevel);
        }
        
        // 初始化
        window.addEventListener('load', () => {
            resizeCanvas();
            initGame();
            draw();
            setupEventListeners();
        });
        
        window.addEventListener('resize', resizeCanvas);
    </script>
</body>
</html>
