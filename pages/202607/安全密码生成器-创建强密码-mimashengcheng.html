<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全密码生成器 - 创建强密码</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #2575fc);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.6s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        header {
            background: linear-gradient(to right, #3494e6, #ec6ead);
            color: white;
            text-align: center;
            padding: 25px 20px;
        }
        
        header h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        header p {
            opacity: 0.9;
            font-size: 0.95rem;
        }
        
        .content {
            padding: 30px;
        }
        
        .password-display {
            position: relative;
            margin-bottom: 25px;
        }
        
        .password-field {
            width: 100%;
            padding: 15px 50px 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1.1rem;
            background: #f9f9f9;
            transition: all 0.3s;
        }
        
        .password-field:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }
        
        .copy-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: #3498db;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .copy-btn:hover {
            background: #2980b9;
            transform: translateY(-50%) scale(1.05);
        }
        
        .copy-btn:active {
            transform: translateY(-50%) scale(0.95);
        }
        
        .settings {
            margin-bottom: 25px;
        }
        
        .setting-group {
            margin-bottom: 20px;
        }
        
        .setting-group h3 {
            margin-bottom: 12px;
            color: #2c3e50;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .length-control {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .length-slider {
            flex: 1;
            height: 8px;
            -webkit-appearance: none;
            background: #e0e0e0;
            border-radius: 10px;
            outline: none;
        }
        
        .length-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #3498db;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .length-slider::-webkit-slider-thumb:hover {
            background: #2980b9;
            transform: scale(1.1);
        }
        
        .length-value {
            font-weight: bold;
            min-width: 30px;
            text-align: center;
            color: #3498db;
            font-size: 1.1rem;
        }
        
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        @media (max-width: 480px) {
            .options {
                grid-template-columns: 1fr;
            }
        }
        
        .option {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .option input {
            width: 20px;
            height: 20px;
            accent-color: #3498db;
            cursor: pointer;
        }
        
        .option label {
            cursor: pointer;
            font-size: 0.95rem;
        }
        
        .strength-meter {
            margin-top: 30px;
        }
        
        .strength-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .strength-bars {
            display: flex;
            gap: 5px;
            height: 8px;
        }
        
        .strength-bar {
            flex: 1;
            background: #e0e0e0;
            border-radius: 4px;
            transition: all 0.3s;
        }
        
        .generate-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(to right, #3494e6, #ec6ead);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(52, 148, 230, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .generate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(52, 148, 230, 0.6);
        }
        
        .generate-btn:active {
            transform: translateY(0);
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            background: rgba(46, 204, 113, 0.9);
            color: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .notification.show {
            opacity: 1;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
        }
        
        footer a {
            color: white;
            text-decoration: none;
        }
        
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-lock"></i> 安全密码生成器</h1>
            <p>创建高强度、随机的安全密码</p>
        </header>
        
        <div class="content">
            <div class="password-display">
                <input type="text" id="password" class="password-field" placeholder="点击生成密码" readonly>
                <button id="copy" class="copy-btn" title="复制密码">
                    <i class="fas fa-copy"></i>
                </button>
            </div>
            
            <div class="settings">
                <div class="setting-group">
                    <h3><i class="fas fa-ruler"></i> 密码长度</h3>
                    <div class="length-control">
                        <input type="range" id="length" class="length-slider" min="6" max="32" value="12">
                        <span id="length-value" class="length-value">12</span>
                    </div>
                </div>
                
                <div class="setting-group">
                    <h3><i class="fas fa-cog"></i> 包含字符类型</h3>
                    <div class="options">
                        <div class="option">
                            <input type="checkbox" id="uppercase" checked>
                            <label for="uppercase">大写字母 (A-Z)</label>
                        </div>
                        <div class="option">
                            <input type="checkbox" id="lowercase" checked>
                            <label for="lowercase">小写字母 (a-z)</label>
                        </div>
                        <div class="option">
                            <input type="checkbox" id="numbers" checked>
                            <label for="numbers">数字 (0-9)</label>
                        </div>
                        <div class="option">
                            <input type="checkbox" id="symbols" checked>
                            <label for="symbols">特殊符号 (!@#$%)</label>
                        </div>
                    </div>
                </div>
                
                <div class="strength-meter">
                    <div class="strength-header">
                        <h3><i class="fas fa-shield-alt"></i> 密码强度</h3>
                        <span id="strength-text">中等</span>
                    </div>
                    <div class="strength-bars">
                        <div class="strength-bar" id="bar1"></div>
                        <div class="strength-bar" id="bar2"></div>
                        <div class="strength-bar" id="bar3"></div>
                        <div class="strength-bar" id="bar4"></div>
                    </div>
                </div>
            </div>
            
            <button id="generate" class="generate-btn">
                <i class="fas fa-sync-alt"></i> 生成新密码
            </button>
        </div>
    </div>
    
    <div class="notification" id="notification">
        <i class="fas fa-check-circle"></i> 密码已复制到剪贴板！
    </div>
    
    <footer>
        <p>© 2023 安全密码生成器 | 保护您的在线安全</p>
    </footer>
    
    <script>
        // DOM元素
        const passwordEl = document.getElementById('password');
        const copyBtn = document.getElementById('copy');
        const lengthEl = document.getElementById('length');
        const lengthValueEl = document.getElementById('length-value');
        const uppercaseEl = document.getElementById('uppercase');
        const lowercaseEl = document.getElementById('lowercase');
        const numbersEl = document.getElementById('numbers');
        const symbolsEl = document.getElementById('symbols');
        const generateBtn = document.getElementById('generate');
        const notification = document.getElementById('notification');
        const strengthText = document.getElementById('strength-text');
        const bars = [
            document.getElementById('bar1'),
            document.getElementById('bar2'),
            document.getElementById('bar3'),
            document.getElementById('bar4')
        ];
        
        // 字符集
        const uppercaseChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const lowercaseChars = 'abcdefghijklmnopqrstuvwxyz';
        const numberChars = '0123456789';
        const symbolChars = '!@#$%^&*()_+-=[]{}|;:,.<>?';
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            updateLengthValue();
            generatePassword();
        });
        
        // 更新长度显示
        lengthEl.addEventListener('input', () => {
            updateLengthValue();
            generatePassword();
        });
        
        function updateLengthValue() {
            lengthValueEl.textContent = lengthEl.value;
        }
        
        // 选项更改时重新生成密码
        [uppercaseEl, lowercaseEl, numbersEl, symbolsEl].forEach(el => {
            el.addEventListener('change', generatePassword);
        });
        
        // 生成密码
        function generatePassword() {
            let charSet = '';
            let password = '';
            
            if (uppercaseEl.checked) charSet += uppercaseChars;
            if (lowercaseEl.checked) charSet += lowercaseChars;
            if (numbersEl.checked) charSet += numberChars;
            if (symbolsEl.checked) charSet += symbolChars;
            
            // 如果没有选择任何字符类型
            if (charSet.length === 0) {
                passwordEl.value = '请至少选择一种字符类型';
                updateStrengthMeter(0);
                return;
            }
            
            // 生成随机密码
            const length = parseInt(lengthEl.value);
            for (let i = 0; i < length; i++) {
                const randomIndex = Math.floor(Math.random() * charSet.length);
                password += charSet[randomIndex];
            }
            
            passwordEl.value = password;
            updateStrengthMeter(calculatePasswordStrength(password));
        }
        
        // 计算密码强度
        function calculatePasswordStrength(password) {
            let strength = 0;
            const length = password.length;
            
            // 长度得分
            if (length >= 12) strength += 2;
            else if (length >= 8) strength += 1;
            
            // 字符类型得分
            if (/[A-Z]/.test(password)) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            
            return strength;
        }
        
        // 更新密码强度指示器
        function updateStrengthMeter(strength) {
            // 重置所有条
            bars.forEach(bar => {
                bar.style.background = '#e0e0e0';
            });
            
            // 设置强度和文本
            let strengthLabel, color;
            if (strength === 0) {
                strengthLabel = '无效';
                color = '#e74c3c';
            } else if (strength <= 2) {
                strengthLabel = '弱';
                color = '#e74c3c';
            } else if (strength <= 4) {
                strengthLabel = '中等';
                color = '#f39c12';
            } else {
                strengthLabel = '强';
                color = '#2ecc71';
            }
            
            strengthText.textContent = strengthLabel;
            
            // 激活相应数量的条
            const activeBars = Math.min(Math.max(Math.ceil(strength / 2), 1), 4);
            for (let i = 0; i < activeBars; i++) {
                bars[i].style.background = color;
            }
        }
        
        // 复制密码
        copyBtn.addEventListener('click', () => {
            const password = passwordEl.value;
            
            // 检查是否生成了密码
            if (!password || password.includes('请至少选择一种字符类型')) {
                return;
            }
            
            // 复制到剪贴板
            navigator.clipboard.writeText(password).then(() => {
                // 显示通知
                notification.classList.add('show');
                
                // 3秒后隐藏通知
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            });
        });
        
        // 生成按钮点击事件
        generateBtn.addEventListener('click', generatePassword);
        
        // 初始生成密码
        generatePassword();
    </script>
</body>
</html>
