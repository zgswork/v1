<!DOCTYPE html>
<html>
<head>
    <title>骰子游戏 / Dice Game</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 { color: #333; }
        .controls {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        button { 
            padding: 10px 20px; 
            font-size: 16px; 
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #diceContainer {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            min-height: 120px;
        }
        .dice {
            font-size: 80px;
            transition: transform 0.2s;
        }
        .dice.rolling {
            animation: shake 0.5s infinite;
        }
        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-5px, 5px) rotate(-5deg); }
            50% { transform: translate(5px, -5px) rotate(5deg); }
            75% { transform: translate(-5px, 5px) rotate(-5deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        #result {
            font-size: 24px;
            margin: 20px 0;
            min-height: 36px;
        }
        label {
            font-size: 16px;
            margin-right: 10px;
        }
        input[type="number"] {
            width: 60px;
            padding: 8px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .total {
            font-weight: bold;
            color: #e91e63;
            font-size: 28px;
            margin-top: 10px;
        }
        .footer {
            margin-top: 40px;
            color: #666;
            font-size: 14px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .footer a {
            color: #4CAF50;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .lang-switch {
            position: absolute;
            top: 20px;
            right: 20px;
        }
        .lang-btn {
            padding: 5px 10px;
            font-size: 14px;
            background-color: #f1f1f1;
            color: #333;
            border: 1px solid #ddd;
        }
        .lang-btn.active {
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>
<body>
    <div class="lang-switch">
        <button id="langCn" class="lang-btn active">中文</button>
        <button id="langEn" class="lang-btn">English</button>
    </div>

    <h1 id="gameTitle">骰子游戏</h1>
    
    <div class="controls">
        <label id="diceCountLabel">骰子数量:</label>
        <input type="number" id="diceCount" min="1" max="5" value="1">
        <button id="rollButton">掷骰子</button>
    </div>
    
    <div id="diceContainer"></div>
    
    <div id="result"></div>
    
    <div class="footer">
        <p id="authorInfo">作者：文璧 | 合作邮箱：<a href="/cdn-cgi/l/email-protection#9eaca8a9aba9aaafa7a9abdeefefb0fdf1f3"><span class="__cf_email__" data-cfemail="ddefebeae8eae9ece4eae89dacacf3beb2b0">[email&#160;protected]</span></a></p>
    </div>
    
    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 语言资源
        const resources = {
            cn: {
                title: "骰子游戏",
                diceCount: "骰子数量:",
                rollBtn: "掷骰子",
                rolling: "骰子滚动中...",
                resultSingle: "你掷出了 <span class='total'>{{total}}</span> 点",
                resultMulti: "掷出了: {{results}} <br><span class='total'>总和 = {{total}}</span>",
                author: "作者：文璧 | 合作邮箱："
            },
            en: {
                title: "Dice Game",
                diceCount: "Number of dice:",
                rollBtn: "Roll Dice",
                rolling: "Rolling dice...",
                resultSingle: "You rolled <span class='total'>{{total}}</span>",
                resultMulti: "Rolled: {{results}} <br><span class='total'>Total = {{total}}</span>",
                author: "Author: Wen Bi | Contact: "
            }
        };

        let currentLang = 'cn';
        const diceFaces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
        let isRolling = false;
        
        // 切换语言
        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('langCn').classList.toggle('active', lang === 'cn');
            document.getElementById('langEn').classList.toggle('active', lang === 'en');
            
            // 更新界面文本
            document.getElementById('gameTitle').textContent = resources[lang].title;
            document.getElementById('diceCountLabel').textContent = resources[lang].diceCount;
            document.getElementById('rollButton').textContent = resources[lang].rollBtn;
            document.getElementById('authorInfo').innerHTML = resources[lang].author + 
                `<a href="mailto:2675741975@qq.com">2675741975@qq.com</a>`;
        }
        
        // 初始化语言切换按钮
        document.getElementById('langCn').addEventListener('click', () => setLanguage('cn'));
        document.getElementById('langEn').addEventListener('click', () => setLanguage('en'));
        
        function rollDice() {
            if (isRolling) return;
            
            const diceCount = parseInt(document.getElementById('diceCount').value) || 1;
            const diceContainer = document.getElementById('diceContainer');
            const resultDisplay = document.getElementById('result');
            const rollButton = document.getElementById('rollButton');
            
            // 验证骰子数量
            const validatedCount = Math.min(Math.max(diceCount, 1), 5);
            document.getElementById('diceCount').value = validatedCount;
            
            // 清空容器
            diceContainer.innerHTML = '';
            resultDisplay.innerHTML = '';
            
            // 创建骰子元素
            const diceElements = [];
            for (let i = 0; i < validatedCount; i++) {
                const dice = document.createElement('div');
                dice.className = 'dice rolling';
                dice.textContent = '🎲';
                diceContainer.appendChild(dice);
                diceElements.push(dice);
            }
            
            // 禁用按钮
            isRolling = true;
            rollButton.disabled = true;
            resultDisplay.textContent = resources[currentLang].rolling;
            
            // 骰子动画
            let rolls = 0;
            const rollInterval = setInterval(() => {
                diceElements.forEach(dice => {
                    const random = Math.floor(Math.random() * 6) + 1;
                    dice.textContent = diceFaces[random - 1];
                });
                
                rolls++;
                if (rolls > 15) {
                    clearInterval(rollInterval);
                    finishRoll(diceElements, validatedCount);
                }
            }, 100);
        }
        
        function finishRoll(diceElements, diceCount) {
            const resultDisplay = document.getElementById('result');
            const rollButton = document.getElementById('rollButton');
            
            // 确定最终点数
            const results = [];
            let total = 0;
            
            diceElements.forEach((dice, index) => {
                dice.classList.remove('rolling');
                const finalNumber = Math.floor(Math.random() * 6) + 1;
                dice.textContent = diceFaces[finalNumber - 1];
                results.push(finalNumber);
                total += finalNumber;
            });
            
            // 显示结果
            const langRes = resources[currentLang];
            if (diceCount > 1) {
                resultDisplay.innerHTML = langRes.resultMulti
                    .replace('{{results}}', results.join(' + '))
                    .replace('{{total}}', total);
            } else {
                resultDisplay.innerHTML = langRes.resultSingle
                    .replace('{{total}}', total);
            }
            
            // 启用按钮
            isRolling = false;
            rollButton.disabled = false;
        }
        
        // 初始化骰子显示
        document.getElementById('diceCount').addEventListener('change', function() {
            const count = parseInt(this.value) || 1;
            this.value = Math.min(Math.max(count, 1), 5);
        });
        
        // 初始化掷骰子按钮
        document.getElementById('rollButton').addEventListener('click', rollDice);
        
        // 设置默认语言
        setLanguage('cn');
    </script>
</body>
</html>
