<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smashing Simulator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.18.0/matter.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        h1 {
            color: #333;
        }
        
        #game-container {
            width: 800px;
            height: 500px;
            margin: 20px auto;
            position: relative;
            border: 3px solid #333;
            border-radius: 10px;
            overflow: hidden;
            background-color: #ddd;
        }
        
        #physics-canvas {
            display: block;
        }
        
        .controls {
            margin: 20px 0;
        }
        
        button {
            padding: 10px 20px;
            margin: 0 10px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        #score {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
        }
        
        .debug {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255,255,255,0.7);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>Smashing Simulator</h1>
    <div id="score">Objects smashed: <span>0</span></div>
    
    <div id="game-container">
        <canvas id="physics-canvas"></canvas>
        <div class="debug">
            Objects: <span id="obj-count">0</span> | 
            FPS: <span id="fps">0</span>
        </div>
    </div>
    
    <div class="controls">
        <button id="add-btn">Add Object</button>
        <button id="reset-btn">Reset</button>
        <button id="smash-btn">Smash Mode</button>
    </div>

    <script>
        // Wait for DOM to load
        document.addEventListener('DOMContentLoaded', function() {
            console.log("Initializing smashing simulator...");
            
            // Check if Matter.js loaded
            if (typeof Matter === 'undefined') {
                alert("Physics engine failed to load. Please check your internet connection.");
                return;
            }
            
            // Physics modules
            const Engine = Matter.Engine,
                  Render = Matter.Render,
                  Runner = Matter.Runner,
                  Bodies = Matter.Bodies,
                  Body = Matter.Body,
                  Composite = Matter.Composite,
                  Mouse = Matter.Mouse,
                  MouseConstraint = Matter.MouseConstraint;
            
            // Create engine
            const engine = Engine.create({
                gravity: { x: 0, y: 0.5 }
            });
            
            // Create renderer
            const canvas = document.getElementById('physics-canvas');
            const render = Render.create({
                canvas: canvas,
                engine: engine,
                options: {
                    width: 800,
                    height: 500,
                    wireframes: false,
                    background: '#ddd'
                }
            });
            
            // Set canvas size
            function resizeCanvas() {
                canvas.width = 800;
                canvas.height = 500;
                console.log("Canvas size set to:", canvas.width, "x", canvas.height);
            }
            resizeCanvas();
            
            // Start renderer
            Render.run(render);
            const runner = Runner.create();
            Runner.run(runner, engine);
            
            // Game variables
            let score = 0;
            let smashMode = false;
            const scoreDisplay = document.querySelector('#score span');
            const objCountDisplay = document.querySelector('#obj-count');
            const fpsDisplay = document.querySelector('#fps');
            
            // Materials
            const materials = [
                { name: 'glass', color: 'rgba(52, 152, 219, 0.7)', density: 0.8 },
                { name: 'ceramic', color: 'rgba(231, 76, 60, 0.7)', density: 1.2 },
                { name: 'wood', color: 'rgba(155, 89, 182, 0.7)', density: 0.5 },
                { name: 'metal', color: 'rgba(189, 195, 199, 0.7)', density: 5 }
            ];
            
            // Create object function
            function createObject() {
                const material = materials[Math.floor(Math.random() * materials.length)];
                const size = Math.random() * 40 + 30;
                const x = Math.random() * (render.options.width - size) + size/2;
                const y = Math.random() * 100 + 50;
                
                const object = Bodies.rectangle(x, y, size, size, {
                    density: material.density,
                    restitution: 0.3,
                    friction: 0.1,
                    render: {
                        fillStyle: material.color,
                        strokeStyle: '#333',
                        lineWidth: 2
                    }
                });
                
                console.log(`Created ${material.name} object at ${x},${y}`);
                
                Composite.add(engine.world, object);
                updateObjectCount();
                return object;
            }
            
            // Update object counter
            function updateObjectCount() {
                objCountDisplay.textContent = Composite.allBodies(engine.world).length - 3; // Subtract walls
            }
            
            // Smash object
            function smashObject(object) {
                Composite.remove(engine.world, object);
                score++;
                scoreDisplay.textContent = score;
                updateObjectCount();
                console.log("Object smashed! Total:", score);
            }
            
            // Create walls
            const ground = Bodies.rectangle(400, 505, 810, 10, { isStatic: true, render: { visible: false } });
            const leftWall = Bodies.rectangle(-5, 250, 10, 500, { isStatic: true, render: { visible: false } });
            const rightWall = Bodies.rectangle(805, 250, 10, 500, { isStatic: true, render: { visible: false } });
            Composite.add(engine.world, [ground, leftWall, rightWall]);
            
            // Mouse control
            const mouse = Mouse.create(render.canvas);
            const mouseConstraint = MouseConstraint.create(engine, {
                mouse: mouse,
                constraint: {
                    stiffness: 0.2,
                    render: {
                        visible: false
                    }
                }
            });
            Composite.add(engine.world, mouseConstraint);
            
            // Mouse click to smash
            Matter.Events.on(mouseConstraint, 'mousedown', function(event) {
                if (!smashMode) return;
                
                const mousePos = event.mouse.position;
                const bodies = Matter.Query.point(Composite.allBodies(engine.world), mousePos);
                
                if (bodies.length > 0) {
                    smashObject(bodies[0]);
                }
            });
            
            // Button events
            document.getElementById('add-btn').addEventListener('click', function() {
                createObject();
            });
            
            document.getElementById('reset-btn').addEventListener('click', function() {
                // Remove all objects except walls
                const bodies = Composite.allBodies(engine.world).filter(body => 
                    body !== ground && body !== leftWall && body !== rightWall
                );
                Composite.remove(engine.world, bodies);
                score = 0;
                scoreDisplay.textContent = score;
                updateObjectCount();
                console.log("Reset game");
            });
            
            document.getElementById('smash-btn').addEventListener('click', function() {
                smashMode = !smashMode;
                this.textContent = smashMode ? 'Normal Mode' : 'Smash Mode';
                console.log("Smash mode:", smashMode);
            });
            
            // FPS counter
            let lastTime = performance.now();
            let frameCount = 0;
            function updateFPS() {
                const now = performance.now();
                frameCount++;
                
                if (now - lastTime >= 1000) {
                    fpsDisplay.textContent = frameCount;
                    frameCount = 0;
                    lastTime = now;
                }
                
                requestAnimationFrame(updateFPS);
            }
            updateFPS();
            
            // Add initial objects
            for (let i = 0; i < 5; i++) {
                createObject();
            }
            
            console.log("Smashing simulator ready!");
        });
    </script>
</body>
</html>
