<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF合并工具</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            background: #f0f0ff;
            border-color: #764ba2;
        }

        .upload-area.dragover {
            background: #e0e0ff;
            border-color: #764ba2;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 64px;
            margin-bottom: 15px;
        }

        .upload-text {
            color: #667eea;
            font-size: 18px;
            font-weight: 600;
        }

        .upload-hint {
            color: #999;
            font-size: 14px;
            margin-top: 8px;
        }

        #fileInput {
            display: none;
        }

        .file-list {
            margin-bottom: 20px;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .file-item:hover {
            background: #e9ecef;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .file-icon {
            font-size: 24px;
        }

        .file-name {
            color: #333;
            font-weight: 500;
        }

        .file-size {
            color: #999;
            font-size: 12px;
        }

        .file-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-remove {
            background: #ff6b6b;
            color: white;
        }

        .btn-remove:hover {
            background: #ee5a5a;
        }

        .btn-up {
            background: #4ecdc4;
            color: white;
        }

        .btn-up:hover {
            background: #3dbdb5;
        }

        .btn-down {
            background: #4ecdc4;
            color: white;
        }

        .btn-down:hover {
            background: #3dbdb5;
        }

        .merge-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .merge-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .merge-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .progress-container {
            display: none;
            margin-top: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        .success-message {
            display: none;
            text-align: center;
            padding: 20px;
            background: #d4edda;
            border: 1px solid #c3e6cb;
            border-radius: 10px;
            margin-top: 20px;
            color: #155724;
        }

        .error-message {
            display: none;
            padding: 15px;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 10px;
            margin-top: 20px;
            color: #721c24;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
            padding: 15px 20px;
            font-size: 14px;
            line-height: 1.8;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.2);
        }

        .footer a {
            color: #fff;
            font-weight: bold;
            text-decoration: underline;
        }

        .footer a:hover {
            text-decoration: none;
        }

        /* 为底部固定定位留出空间 */
        body {
            padding-bottom: 80px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 PDF合并工具</h1>
        <p class="subtitle">选择多个PDF文件，轻松合并为一个文件</p>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <div class="upload-text">点击或拖拽PDF文件到此处</div>
            <div class="upload-hint">支持选择多个PDF文件</div>
        </div>
        <input type="file" id="fileInput" accept=".pdf" multiple>

        <div class="file-list" id="fileList">
            <div class="empty-state">
                <div class="empty-state-icon">📭</div>
                <p>暂无文件，请添加PDF文件</p>
            </div>
        </div>

        <button class="merge-btn" id="mergeBtn" disabled>🔄 开始合并</button>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">准备中...</div>
        </div>

        <div class="success-message" id="successMessage"></div>
        <div class="error-message" id="errorMessage"></div>
    </div>

    <div class="footer">
        <p>&copy;2026三横王者 | 获取更多免费工具来<a href="https://t.zsxq.com/vNy05" target="_blank">「王者·OpenClaw小龙虾·副业写作」</a></p>
        <p>📱 如有任何建议或问题，请+微信：13942493</p>
    </div>

    <script>
        const { PDFDocument } = PDFLib;
        let pdfFiles = [];
        let pdfContents = [];

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const mergeBtn = document.getElementById('mergeBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = Array.from(e.dataTransfer.files).filter(f => f.type === 'application/pdf');
            addFiles(files);
        });

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            addFiles(files);
            fileInput.value = '';
        });

        function addFiles(files) {
            files.forEach(file => {
                if (!pdfFiles.find(f => f.name === file.name)) {
                    pdfFiles.push(file);
                }
            });
            renderFileList();
            loadPdfContents();
        }

        function renderFileList() {
            if (pdfFiles.length === 0) {
                fileList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>暂无文件，请添加PDF文件</p>
                    </div>
                `;
                mergeBtn.disabled = true;
                return;
            }

            mergeBtn.disabled = false;
            fileList.innerHTML = pdfFiles.map((file, index) => `
                <div class="file-item">
                    <div class="file-info">
                        <span class="file-icon">📄</span>
                        <div>
                            <div class="file-name">${file.name}</div>
                            <div class="file-size">${formatFileSize(file.size)}</div>
                        </div>
                    </div>
                    <div class="file-actions">
                        <button class="btn btn-up" onclick="moveFile(${index}, -1)" ${index === 0 ? 'disabled' : ''}>↑</button>
                        <button class="btn btn-down" onclick="moveFile(${index}, 1)" ${index === pdfFiles.length - 1 ? 'disabled' : ''}>↓</button>
                        <button class="btn btn-remove" onclick="removeFile(${index})">删除</button>
                    </div>
                </div>
            `).join('');
        }

        function removeFile(index) {
            pdfFiles.splice(index, 1);
            pdfContents.splice(index, 1);
            renderFileList();
            hideMessages();
        }

        function moveFile(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= pdfFiles.length) return;
            
            [pdfFiles[index], pdfFiles[newIndex]] = [pdfFiles[newIndex], pdfFiles[index]];
            [pdfContents[index], pdfContents[newIndex]] = [pdfContents[newIndex], pdfContents[index]];
            renderFileList();
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }

        async function loadPdfContents() {
            hideMessages();
            for (let i = pdfContents.length; i < pdfFiles.length; i++) {
                try {
                    const arrayBuffer = await pdfFiles[i].arrayBuffer();
                    pdfContents[i] = arrayBuffer;
                } catch (error) {
                    console.error('加载PDF失败:', error);
                    showError(`加载 ${pdfFiles[i].name} 失败`);
                }
            }
        }

        mergeBtn.addEventListener('click', async () => {
            if (pdfFiles.length < 2) {
                showError('请至少选择2个PDF文件进行合并');
                return;
            }

            hideMessages();
            mergeBtn.disabled = true;
            progressContainer.style.display = 'block';

            try {
                const mergedPdf = await PDFDocument.create();
                
                for (let i = 0; i < pdfContents.length; i++) {
                    const progress = ((i + 1) / pdfContents.length) * 100;
                    progressFill.style.width = progress + '%';
                    progressText.textContent = `正在合并第 ${i + 1} / ${pdfContents.length} 个文件...`;
                    
                    if (pdfContents[i]) {
                        const pdf = await PDFDocument.load(pdfContents[i]);
                        const pages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                        pages.forEach(page => mergedPdf.addPage(page));
                    }
                }

                progressText.textContent = '正在生成合并后的PDF...';
                const mergedPdfBytes = await mergedPdf.save();
                
                downloadPdf(mergedPdfBytes, '合并后的PDF.pdf');
                
                showSuccess(`成功合并 ${pdfFiles.length} 个PDF文件！`);
                progressFill.style.width = '100%';
                progressText.textContent = '合并完成！';
                
            } catch (error) {
                console.error('合并失败:', error);
                showError('合并失败: ' + error.message);
            } finally {
                mergeBtn.disabled = false;
                setTimeout(() => {
                    progressContainer.style.display = 'none';
                    progressFill.style.width = '0%';
                }, 3000);
            }
        });

        function downloadPdf(bytes, filename) {
            const blob = new Blob([bytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        function hideMessages() {
            successMessage.style.display = 'none';
            errorMessage.style.display = 'none';
        }
    </script>
</body>
</html>
