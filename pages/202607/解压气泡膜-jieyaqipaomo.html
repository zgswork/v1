<!doctype html>
<html lang="zh-CN">

  <style>
    :root{--bg:#f8f9fa;--c1:#e3f2fd;--c2:#fff3e0;--c3:#e8f5e9;--ui:#0d6efd;--text:#34495e}
    *{box-sizing:border-box}

    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;color:var(--text);background:var(--bg);display:flex;flex-direction:column}

    .header{position:sticky;top:0;background:rgba(255,255,255,.8);backdrop-filter:blur(6px);z-index:5;flex-wrap:wrap}
    .group{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
    select,button,.chip{border:1px solid #dee2e6;background:#fff;color:var(--text);border-radius:10px;padding:8px 10px;cursor:pointer;transition:.15s;outline:none}
    button:active,.chip:active{transform:scale(.97)}button:hover,.chip:hover{background:#f1f3f5}
    .label{font-size:12px;opacity:.7;margin-right:4px}
    #wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 12px}
    .stage{width:100%;height:70vh;max-width:1100px;border-radius:16px;background:#ffffffcc;box-shadow:0 6px 24px rgba(0,0,0,.06);position:relative;overflow:hidden;transition:opacity .25s ease}
    .stage.fade{opacity:.3}
    canvas{display:block;width:100%;height:100%}
    /* 震屏动画 */
    @keyframes shakeK{0%{transform:translate(0,0)}25%{transform:translate(2px,-2px)}50%{transform:translate(-2px,2px)}75%{transform:translate(2px,2px)}100%{transform:translate(0,0)}}
    .stage.shake{animation:shakeK .3s ease}
    /* 浮动文本与HUD */
    #fx,#hud{position:absolute;inset:0;pointer-events:none}
    .pop-fx{position:absolute;color:#ff6b6b;font-weight:700;text-shadow:0 1px 0 #fff;opacity:0;transform:translate(-50%,-50%) translateY(0);animation:floatUp .7s ease forwards}
    @keyframes floatUp{0%{opacity:0;transform:translate(-50%,-50%) translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) translateY(-24px)}}
    #comboBadge{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#ffe5ec,#fff3bf);border:1px solid #ffd6a5;border-radius:999px;padding:4px 10px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.08);opacity:.95;display:none}
    #comboBadge.show{display:block}
    @keyframes pulseIn{0%{transform:translateX(-50%) scale(.9)}60%{transform:translateX(-50%) scale(1.08)}100%{transform:translateX(-50%) scale(1)}}
    #comboBadge.pulse{animation:pulseIn .28s ease}
    /* 计时进度条 */
    #timebar{position:absolute;top:8px;right:8px;left:8px;height:6px;border-radius:6px;background:rgba(0,0,0,.06);overflow:hidden}
    #timebar .bar{height:100%;width:0;background:linear-gradient(90deg,#51cf66,#15aabf);transition:width .25s ease}
    /* 里程碑文本 */
    #milestone{position:absolute;top:38%;left:50%;transform:translateX(-50%);font-size:36px;font-weight:900;color:#ff922b;text-shadow:0 2px 8px rgba(0,0,0,.15);opacity:0}
    #milestone.show{opacity:1;animation:popScale .5s ease}
    @keyframes popScale{0%{transform:translateX(-50%) scale(.6)}70%{transform:translateX(-50%) scale(1.2)}100%{transform:translateX(-50%) scale(1)}}
    .footer{font-size:13px;opacity:.8}
    .footer a{color:#0d6efd;text-decoration:none}
  </style>
</head>

</header>

<script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
(function(){
  const $=s=>document.querySelector(s);
  const stage=$('#stage');
  const cv=$('#cv');
  const ctx=cv.getContext('2d');
  let W=0,H=0,cellW=0,cellH=0,rad=12;
  let rows=12,cols=18;
  // 主题与音效
  let pattern='classic';
  let size='m';
  let bg='#ffffffcc';
  let soundType='soft';
  let muted=false;
  let AC=null;
  // 颜色与图案资源
  const pColors=['#f8f9fa','#fff3bf','#e3f2fd','#ffe8cc','#e6fcf5','#e7f5ff','#f3d9fa','#ffd8a8'];
  const animals=['😀','😎','🥳','🦄','🐶','🐱','🐼','🐧','🐣','🐸'];
  const fests=['🎉','✨','🎈','🎊','💫','🌟','🧨','🍭','🍬','🎁'];
  // 状态
  let bubbles=[]; let total=0; let broken=0;
  let particles=[]; let trail=[];
  let lastPt=null;
  let DPR=2; // 默认，运行时以真实 devicePixelRatio 覆盖
  let isDown=false; let lastIndex=-1;
  let combo=0,bestCombo=0,lastPopAt=0,score=0;
  let gameOn=false,timerId=null,timerDur=30,timerLeft=0;
  // DOM refs
  const timebarBar=$('#timebar .bar');
  const fx=$('#fx');
  const comboBadge=$('#comboBadge');
  const milestone=$('#milestone');

  function save(){localStorage.setItem('popper',JSON.stringify({size,pattern,bg,soundType,muted}))}
  function load(){try{const o=JSON.parse(localStorage.getItem('popper')||'{}');size=o.size||size;pattern=o.pattern||pattern;bg=o.bg||bg;soundType=o.soundType||soundType;muted=!!o.muted}catch{}}

  function setCanvas(){const r=stage.getBoundingClientRect();DPR=window.devicePixelRatio||1;W=cv.width=Math.floor(r.width*DPR);H=cv.height=Math.floor(r.height*DPR);cv.style.width=r.width+'px';cv.style.height=r.height+'px';cols=Math.max(6,Math.floor(r.width/50));rows=Math.max(6,Math.floor(r.height/50));cellW=W/cols;cellH=H/rows;const f={s:.70,m:.85,l:.95}[size];rad=Math.min(cellW,cellH)*f/2}

  function decorate(b){if(pattern==='classic'){b.col='rgba(255,255,255,.6)'}else if(pattern==='dots'){b.col=pColors[(Math.random()*pColors.length)|0]}else if(pattern==='animals'){b.emo=animals[(Math.random()*animals.length)|0]}else if(pattern==='geometry'){b.geo=(Math.random()*3|0)}else{b.emo=fests[(Math.random()*fests.length)|0]}}

  function makeBubbles(keepPop=false){bubbles=[];broken=0;for(let r=0;r<rows;r++){for(let c=0;c<cols;c++){const x=(c+.5)*cellW,y=(r+.5)*cellH;const b={x,y,popped:false,t:0};decorate(b);bubbles.push(b)}}if(keepPop){bubbles.forEach(b=>{if(b._keep){b.popped=true;broken++}})}total=bubbles.length;$('#total').textContent=total;$('#broken').textContent=broken;draw()}

  function drawBubble(b){const rr=rad*(b.popped?0.5:1)-(b.t?rad*.15*b.t:0);const g=ctx.createRadialGradient(b.x-rr*.3,b.y-rr*.3,rr*.2,b.x,b.y,rr);
    if(pattern==='classic'||pattern==='dots'){
      const base=pattern==='classic'?'rgba(200,220,255,.9)':b.col;g.addColorStop(0,'#ffffff');g.addColorStop(.5,base);g.addColorStop(1,'rgba(0,0,0,.06)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,Math.max(2,rr),0,Math.PI*2);ctx.fill()
    }else{
      ctx.beginPath();ctx.arc(b.x,b.y,Math.max(2,rr),0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.9)';ctx.fill();
      if(b.emo){ctx.font=(rr*1.2)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.globalAlpha=.9;ctx.fillText(b.emo,b.x,b.y);ctx.globalAlpha=1}
      if(b.geo!=null){ctx.save();ctx.translate(b.x,b.y);ctx.strokeStyle='#7f8c8d';ctx.lineWidth=Math.max(1,rad*.08);if(b.geo===0){const qq=rr*.5;ctx.strokeRect(-qq,-qq,qq*2,qq*2)}else if(b.geo===1){ctx.beginPath();ctx.moveTo(0,-rr*.6);ctx.lineTo(rr*.6,rr*.6);ctx.lineTo(-rr*.6,rr*.6);ctx.closePath();ctx.stroke()}else{ctx.beginPath();ctx.moveTo(-rr*.6,0);ctx.lineTo(rr*.6,0);ctx.moveTo(0,-rr*.6);ctx.lineTo(0,rr*.6);ctx.stroke()}ctx.restore()}
    }
    if(b.popped||b.t){ctx.save();ctx.globalCompositeOperation='multiply';ctx.fillStyle='rgba(0,0,0,'+(b.popped?0.08:0.08+0.15*b.t)+')';ctx.beginPath();ctx.arc(b.x,b.y,Math.max(2,rr*0.9),0,Math.PI*2);ctx.fill();ctx.restore();
      ctx.save();ctx.strokeStyle='rgba(0,0,0,'+(0.35*(b.popped?1:b.t))+')';ctx.lineWidth=Math.max(1,rad*.06);ctx.beginPath();for(let i=0;i<4;i++){const a=Math.random()*Math.PI*2;const r2=rr*(.2+.5*Math.random())*(b.popped?1:b.t);ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+Math.cos(a)*r2,b.y+Math.sin(a)*r2)}ctx.stroke();ctx.restore()}
  }

  function draw(){ctx.clearRect(0,0,W,H);bubbles.forEach(drawBubble);
    // 拖尾
    if(trail.length>1){ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';ctx.lineJoin='round';const w=Math.max(2,Math.min(rad*0.35,3+combo*0.4));ctx.lineWidth=w;ctx.strokeStyle=comboColor(combo);ctx.beginPath();for(let i=0;i<trail.length;i++){const p=trail[i];if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)}ctx.stroke();ctx.restore()}
    for(let i=trail.length-1;i>=0;i--){if(!isDown) trail[i].life=(trail[i].life||1)-0.12;if(trail[i].life<=0)trail.splice(i,1)}
    // 粒子
    for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.vx*=0.98;p.vy+=0.15;p.x+=p.vx;p.y+=p.vy;p.life-=0.03;if(p.life<=0){particles.splice(i,1);continue}ctx.globalAlpha=Math.max(0,Math.min(1,p.life));ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
  }
  function comboColor(c){if(c<5)return '#74c0fc';if(c<10)return '#51cf66';if(c<20)return '#ffd43b';return '#ff6b6b'}

  function indexFromXY(x,y){const c=(x/cellW)|0,r=(y/cellH)|0;if(c<0||c>=cols||r<0||r>=rows)return -1;return r*cols+c}
  function processPoint(x,y){const idx=indexFromXY(x,y);if(idx<0||idx===lastIndex) return;lastIndex=idx;const b=bubbles[idx];pop(b)}
  function processAtClientXY(cx,cy){const r=cv.getBoundingClientRect();const x=(cx-r.left)*DPR,y=(cy-r.top)*DPR;trail.push({x,y,life:1});if(trail.length>18)trail.shift();if(lastPt){const dx=x-lastPt.x,dy=y-lastPt.y;const dist=Math.hypot(dx,dy);const step=Math.max(1,Math.min(cellW,cellH)*0.6);const steps=Math.min(60,Math.ceil(dist/step));for(let s=1;s<=steps;s++){const sx=lastPt.x+dx*(s/steps);const sy=lastPt.y+dy*(s/steps);processPoint(sx,sy)}}else{processPoint(x,y)}lastPt={x,y}}

  function updateComboUI(){const cEl=$('#combo'),bEl=$('#bestCombo');if(cEl)cEl.textContent=combo;if(bEl)bEl.textContent=bestCombo}
  function updateTimerUI(){const tEl=$('#timer');if(tEl)tEl.textContent=gameOn? (timerLeft+'s') : '--';if(timebarBar){const p=gameOn? (timerLeft/timerDur*100):0;timebarBar.style.width=p+'%'}}
  function updateScoreUI(){const sEl=$('#score'),mEl=$('#mult');if(sEl)sEl.textContent=score;const m=getMult();if(mEl)mEl.textContent='x'+m}
  function getMult(){if(combo>=50)return 5; if(combo>=30)return 3; if(combo>=15)return 2; return 1}

  let animing=false;function loop(){let any=false;for(const b of bubbles){if(b.t>0&&b.t<1){b.t=Math.min(1,b.t+.05);any=true;}}if(particles.length>0) any=true;if(!isDown && trail.length>0) any=true;draw();if(any){requestAnimationFrame(loop)}else animing=false}

  function spawnParticles(b){for(let i=0;i<14;i++){const a=Math.random()*Math.PI*2;const sp=1+Math.random()*2;particles.push({x:b.x,y:b.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:1+Math.random()*1.8,life:1,color:['#ffd43b','#ff8787','#69db7c','#74c0fc'][Math.random()*4|0]});}}
  function spawnPlusOne(b,pts){if(!fx) return;const el=document.createElement('span');el.className='pop-fx';el.textContent='+'+pts;el.style.left=(b.x/2)+'px';el.style.top=(b.y/2)+'px';fx.appendChild(el);setTimeout(()=>{el.remove()},750);if(comboBadge){comboBadge.textContent='连击 x'+combo;comboBadge.classList.add('show','pulse');setTimeout(()=>comboBadge&&comboBadge.classList.remove('pulse'),300)}}
  function showMilestone(n){if(!milestone)return;milestone.textContent='COMBO '+n+'!';milestone.classList.add('show');setTimeout(()=>milestone.classList.remove('show'),700)}
  function spawnBurst(x,y){for(let i=0;i<40;i++){const a=Math.random()*Math.PI*2;const sp=2+Math.random()*3;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:1.5+Math.random()*2,life:1,color:['#ffd43b','#ff8787','#69db7c','#74c0fc'][Math.random()*4|0]});}}

  function vib(){if(navigator.vibrate)try{navigator.vibrate(10)}catch{}}
  function initAudio(){if(AC) return;AC=new (window.AudioContext||window.webkitAudioContext)()}
  function play(){if(muted) return;initAudio();const t=soundType;const o=AC;const dur=.12;const now=o.currentTime;const g=o.createGain();g.connect(o.destination);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.6,now+.01);g.gain.exponentialRampToValueAtTime(.001,now+dur);
    const comboBoost=1+Math.min(combo,20)/50;
    if(t==='soft'){const osc=o.createOscillator();osc.type='sine';osc.frequency.setValueAtTime(220*comboBoost,now);osc.frequency.exponentialRampToValueAtTime(1200*comboBoost,now+.03);osc.connect(g);osc.start(now);osc.stop(now+dur)}
    else if(t==='sharp'){const osc=o.createOscillator();osc.type='triangle';osc.frequency.setValueAtTime(800*comboBoost,now);osc.frequency.exponentialRampToValueAtTime(200*comboBoost,now+.08);osc.connect(g);osc.start(now);osc.stop(now+dur)}
    else{const buf=o.createBuffer(1,o.sampleRate*dur,o.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++){const a=i/d.length;d[i]=(Math.random()*2-1)*(1-a)*.7}const src=o.createBufferSource();src.playbackRate.value=comboBoost;src.buffer=buf;src.connect(g);src.start(now)} }
  
  // 新增：确保在用户手势下恢复音频上下文（移动端首声）
  function ensureAudio(){try{initAudio();if(AC&&AC.state==='suspended'){AC.resume()}}catch{}}

  function applyBG(c){stage.style.background=c;bg=c}
  function fadeRedraw(cb){stage.classList.add('fade');setTimeout(()=>{cb&&cb();draw();stage.classList.remove('fade')},160)}

  // 交互 UI 绑定
  const patSel=$('#pattern'),sndSel=$('#sound'),muteEl=$('#mute');
  patSel.onchange=()=>{pattern=patSel.value;save();fadeRedraw(()=>{bubbles.forEach(b=>{b._keep=b.popped;decorate(b)});makeBubbles(true)})};
  sndSel.onchange=()=>{soundType=sndSel.value;save()};
  muteEl.onchange=()=>{muted=muteEl.checked;save()};

  $('.size').addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn) return;size=btn.dataset.size;[...$('.size').children].forEach(x=>x.classList.remove('on'));btn.classList.add('on');save();setCanvas();makeBubbles(true)});

  $('#reset').onclick=$('#reset2').onclick=()=>{bubbles.forEach(b=>{b.popped=false;b.popping=false;b.t=0});broken=0;$('#broken').textContent=broken;combo=0;updateComboUI();lastIndex=-1;draw()};

  $('#bg').innerHTML=pColors.map(c=>`<button class="chip" data-c="${c}" style="background:${c}"></button>`).join('');
  $('#bg').onclick=e=>{const c=e.target.dataset.c;if(!c) return;applyBG(c);save()};

  // 点击
  cv.addEventListener('click',e=>{ensureAudio();const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*DPR,y=(e.clientY-r.top)*DPR;const idx=indexFromXY(x,y);if(idx>=0)pop(bubbles[idx])});
  // 鼠标拖动
  cv.addEventListener('mousedown',e=>{ensureAudio();lastPt=null;isDown=true;processAtClientXY(e.clientX,e.clientY)});
  window.addEventListener('mousemove',e=>{if(isDown)processAtClientXY(e.clientX,e.clientY)});
  window.addEventListener('mouseup',()=>{isDown=false;lastIndex=-1;lastPt=null});
  // 触摸拖动
  cv.addEventListener('touchstart',e=>{ensureAudio();lastPt=null;isDown=true;const t=e.touches[0];if(t)processAtClientXY(t.clientX,t.clientY)},{passive:true});
  cv.addEventListener('touchmove',e=>{if(!isDown)return;e.preventDefault();const t=e.touches[0];if(t)processAtClientXY(t.clientX,t.clientY)},{passive:false});
  window.addEventListener('touchend',()=>{isDown=false;lastIndex=-1;lastPt=null});

  function pop(b){if(!b||b.popped||b.popping) return;b.popping=true;b.t=0.01;play();vib();
    // 连击与分数
    const now=performance.now();if(now-lastPopAt<600){combo++}else{combo=1}lastPopAt=now;if(combo>bestCombo)bestCombo=combo;updateComboUI();const pts=getMult();score+=pts;updateScoreUI();
    // 震屏 & 里程碑
    if(combo>0 && combo%10===0){stage.classList.add('shake');setTimeout(()=>stage.classList.remove('shake'),300);showMilestone(combo);spawnBurst(b.x,b.y)}
    // 粒子与文字反馈
    spawnParticles(b);
    spawnPlusOne(b,pts);
    if(!animing){animing=true;loop()}
    setTimeout(()=>{b.popped=true;b.popping=false;b.t=1;broken++;$('#broken').textContent=broken},300)
  }

  // 计时玩法
  function startGame(){gameOn=true;timerLeft=timerDur;timerStart=performance.now();combo=0;bestCombo=0;score=0;updateScoreUI();updateComboUI();lastIndex=-1;bubbles.forEach(b=>{b.popped=false;b.popping=false;b.t=0});broken=0;$('#broken').textContent=broken;draw();updateTimerUI();if(timerId)clearInterval(timerId);timerId=setInterval(()=>{const elapsed=(performance.now()-timerStart)/1000;timerLeft=Math.max(0,Math.ceil(timerDur - elapsed));updateTimerUI();if(timerLeft<=0){endGame()}},200);const btn=$('#gameToggle');if(btn)btn.textContent='停止挑战'}
  function spawnConfetti(){for(let i=0;i<20;i++){const a=Math.random()*Math.PI*2;const sp=2+Math.random()*3;particles.push({x:W/2,y:H*0.3,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:2+Math.random()*2,life:1,color:['#ffd43b','#ff8787','#69db7c','#74c0fc'][Math.random()*4|0]});} if(!animing){animing=true;loop()}}
  function endGame(cancel){if(!gameOn)return;gameOn=false;if(timerId){clearInterval(timerId);timerId=null}updateTimerUI();const btn=$('#gameToggle');if(btn)btn.textContent='开始30s挑战';if(!cancel){spawnConfetti();setTimeout(()=>{try{alert(`挑战结束！总爆破：${broken}，最佳连击：${bestCombo}，得分：${score}`)}catch{}},100)}combo=0;updateComboUI()}
  $('#gameToggle').onclick=()=>{ensureAudio();if(gameOn)endGame(true);else startGame()}

  window.addEventListener('resize',()=>{
    fadeRedraw(()=>{
      bubbles.forEach(b=>{b._keep=b.popped});
      setCanvas();
      makeBubbles(true);
    });
  });

  // 启动
  load();
  $('#pattern').value=pattern; $('#sound').value=soundType; $('#mute').checked=muted;
  applyBG(bg); setCanvas(); makeBubbles(); save(); updateComboUI(); updateTimerUI(); updateScoreUI();
})();
</script>
</body>
</html>
