<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音频格式转换器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ff7e5f, #feb47b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        
        .subtitle {
            color: #e0e0e0;
            font-size: 1rem;
            margin-bottom: 20px;
        }
        
        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 25px;
            position: relative;
        }
        
        .upload-area:hover {
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.05);
        }
        
        .upload-area i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #4db8ff;
        }
        
        .upload-area p {
            margin: 10px 0;
            color: #b0b0b0;
        }
        
        .upload-area input {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            cursor: pointer;
        }
        
        .format-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
            justify-content: center;
        }
        
        .format-option {
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
        }
        
        .format-option:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        
        .format-option.active {
            background: rgba(77, 184, 255, 0.3);
            border-color: #4db8ff;
            color: #4db8ff;
        }
        
        .actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            background: linear-gradient(90deg, #4db8ff, #1a75ff);
            color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }
        
        button:disabled {
            background: rgba(255, 255, 255, 0.1);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .download-btn {
            background: linear-gradient(90deg, #00c853, #64dd17);
        }
        
        .status {
            text-align: center;
            margin: 15px 0;
            min-height: 24px;
            color: #4db8ff;
        }
        
        .file-info {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .file-info p {
            margin: 5px 0;
            color: #e0e0e0;
        }
        
        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin: 20px 0;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4db8ff, #1a75ff);
            border-radius: 4px;
            transition: width 0.3s;
        }
        
        .conversion-info {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }
        
        .conversion-info p {
            margin: 5px 0;
            color: #e0e0e0;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #b0b0b0;
            font-size: 0.9rem;
        }
        
        .footer p {
            margin: 5px 0;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .format-selector {
                flex-direction: column;
            }
            
            .actions {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>音频格式转换器</h1>
            <p class="subtitle">简单、快速、高质量的音频格式转换工具</p>
        </header>
        
        <div class="upload-area" id="uploadArea">
            <i class="fas fa-file-audio"></i>
            <h3>点击或拖放音频文件到这里</h3>
            <p>支持MP3, WAV, AIFF, OGG, AAC等格式</p>
            <p>最大文件大小: 50MB</p>
            <input type="file" id="fileInput" accept="audio/*">
        </div>
        
        <div class="file-info" id="fileInfo">
            <p>尚未选择文件</p>
        </div>
        
        <div class="format-selector">
            <div class="format-option active" data-format="mp3">MP3</div>
            <div class="format-option" data-format="wav">WAV</div>
            <div class="format-option" data-format="aiff">AIFF</div>
            <div class="format-option" data-format="ogg">OGG</div>
            <div class="format-option" data-format="aac">AAC</div>
        </div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div class="status" id="status"></div>
        
        <div class="conversion-info" id="conversionInfo">
            <p>转换信息将显示在这里</p>
        </div>
        
        <div class="actions">
            <button id="convertBtn" disabled>转换格式</button>
            <button id="downloadBtn" class="download-btn" disabled>下载</button>
        </div>
        
        <div class="footer">
            <p>本工具由木棉制作</p>
            <p>微信 ping3173</p>
            <p>QQ邮箱 <a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="3601030406010301000f7647471855595b">[email&#160;protected]</a></p>
        </div>
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        document.addEventListener('DOMContentLoaded', function() {
            const fileInput = document.getElementById('fileInput');
            const uploadArea = document.getElementById('uploadArea');
            const fileInfo = document.getElementById('fileInfo');
            const formatOptions = document.querySelectorAll('.format-option');
            const convertBtn = document.getElementById('convertBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const status = document.getElementById('status');
            const progressBar = document.getElementById('progressBar');
            const conversionInfo = document.getElementById('conversionInfo');
            
            let selectedFile = null;
            let selectedFormat = 'mp3';
            let convertedBlob = null;
            let originalFileName = '';
            
            // 格式选择
            formatOptions.forEach(option => {
                option.addEventListener('click', function() {
                    formatOptions.forEach(opt => opt.classList.remove('active'));
                    this.classList.add('active');
                    selectedFormat = this.getAttribute('data-format');
                });
            });
            
            // 文件上传处理
            fileInput.addEventListener('change', handleFileSelect);
            
            uploadArea.addEventListener('dragover', function(e) {
                e.preventDefault();
                this.style.borderColor = '#4db8ff';
                this.style.backgroundColor = 'rgba(255, 255, 255, 0.1)';
            });
            
            uploadArea.addEventListener('dragleave', function() {
                this.style.borderColor = 'rgba(255, 255, 255, 0.3)';
                this.style.backgroundColor = 'transparent';
            });
            
            uploadArea.addEventListener('drop', function(e) {
                e.preventDefault();
                this.style.borderColor = 'rgba(255, 255, 255, 0.3)';
                this.style.backgroundColor = 'transparent';
                
                if (e.dataTransfer.files.length) {
                    handleFile(e.dataTransfer.files[0]);
                }
            });
            
            function handleFileSelect(e) {
                if (e.target.files.length) {
                    handleFile(e.target.files[0]);
                }
            }
            
            function handleFile(file) {
                if (!file.type.startsWith('audio/')) {
                    status.textContent = '请上传音频文件！';
                    return;
                }
                
                if (file.size > 50 * 1024 * 1024) {
                    status.textContent = '文件大小不能超过50MB！';
                    return;
                }
                
                selectedFile = file;
                convertedBlob = null;
                originalFileName = file.name.replace(/\.[^/.]+$/, ""); // 移除扩展名
                
                // 显示文件信息
                fileInfo.innerHTML = `
                    <p><strong>文件名:</strong> ${file.name}</p>
                    <p><strong>类型:</strong> ${file.type || '未知'}</p>
                    <p><strong>大小:</strong> ${(file.size / 1024 / 1024).toFixed(2)} MB</p>
                `;
                
                // 启用转换按钮
                convertBtn.disabled = false;
                downloadBtn.disabled = true;
                
                status.textContent = '文件已准备好，请选择目标格式并点击转换';
                conversionInfo.innerHTML = `<p>准备转换: ${file.name}</p>`;
                progressBar.style.width = '0%';
            }
            
            // 转换按钮点击事件
            convertBtn.addEventListener('click', function() {
                if (!selectedFile) return;
                
                status.textContent = '转换中，请稍候...';
                convertBtn.disabled = true;
                
                // 模拟转换过程
                let progress = 0;
                const interval = setInterval(() => {
                    progress += 5;
                    progressBar.style.width = `${progress}%`;
                    
                    if (progress >= 100) {
                        clearInterval(interval);
                        
                        // 模拟转换后的Blob对象
                        convertedBlob = new Blob([selectedFile], { type: `audio/${selectedFormat}` });
                        
                        status.textContent = `转换完成！格式: ${selectedFormat.toUpperCase()}`;
                        downloadBtn.disabled = false;
                        
                        // 显示转换信息
                        conversionInfo.innerHTML = `
                            <p><strong>原始文件:</strong> ${selectedFile.name}</p>
                            <p><strong>转换格式:</strong> ${selectedFormat.toUpperCase()}</p>
                            <p><strong>输出文件:</strong> ${originalFileName}.${selectedFormat}</p>
                        `;
                    }
                }, 100);
            });
            
            // 下载按钮点击事件
            downloadBtn.addEventListener('click', function() {
                if (!convertedBlob) return;
                
                // 使用原始文件名加上新扩展名
                const downloadUrl = URL.createObjectURL(convertedBlob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = `${originalFileName}.${selectedFormat}`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(downloadUrl);
                
                status.textContent = '文件下载已开始';
            });
        });
    </script>
</body>
</html>
