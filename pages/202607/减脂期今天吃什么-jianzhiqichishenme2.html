            const gender = document.getElementById('gender').value;

            const weight = parseFloat(document.getElementById('weight').value);
            const targetWeight = parseFloat(document.getElementById('targetWeight').value);
            const duration = parseFloat(document.getElementById('duration').value);
            
            // 验证输入
            if (!height || !weight || !targetWeight || !duration) {
                alert('请填写完整信息');
                return;
            }
            
            if (targetWeight >= weight) {
                alert('目标体重应小于当前体重');
                return;
            }
            
            // 转换为公斤
            const weightKg = weight / 2;
            const targetWeightKg = targetWeight / 2;
            
            // 计算基础代谢率(BMR)
            let bmr;
            if (gender === 'male') {
                bmr = 66 + (13.7 * weightKg) + (5 * height) - (6.8 * 30); // 假设年龄30岁
            } else {
                bmr = 655 + (9.6 * weightKg) + (1.8 * height) - (4.7 * 30);
            }
            
            // 每日总消耗(TDEE) - 假设轻度活动
            const tdee = bmr * 1.375;
            
            // 计算总需要减少的体重(kg)
            const weightToLose = weightKg - targetWeightKg;
            
            // 计算总需要减少的热量(1kg脂肪≈7700大卡)
            const totalCalorieDeficit = weightToLose * 7700;
            
            // 计算每日需要减少的热量
            const days = duration * 30;
            const dailyCalorieDeficit = totalCalorieDeficit / days;
            
            // 推荐的每日摄入热量(TDEE - 每日热量缺口)
            const recommendedDailyCalories = Math.round(tdee - dailyCalorieDeficit);
            
            // 显示结果
            resultContent.innerHTML = `

            const tomorrowPlan = mealPlans[tomorrowIndex];
            const totalTomorrowCalories = tomorrowPlan.breakfast.calories + tomorrowPlan.lunch.calories + tomorrowPlan.dinner.calories;

            // 显示明日饮食计划

                    <div class="calorie-info">热量: ${plan.dinner.calories} 大卡</div>
                </div>
                
                <div style="text-align: center; margin-top: 15px; font-weight: bold; background-color: #f0f7ff; padding: 10px; border-radius: 5px;">
                    总摄入: ${totalCalories} 大卡 (目标: ${recommendedCalories} 大卡) | 
                    进餐时间窗口: ${plan.breakfast.time} - ${plan.dinner.time} (符合16:8轻断食)
                </div>
            `;
        }
        
        // 标签切换
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // 移除所有active类
                tabBtns.forEach(b => b.classList.remove('active'));
                tabContents.forEach(c => c.classList.remove('active'));
                
                // 添加active类到当前点击的标签
                btn.classList.add('active');
                const tabId = btn.getAttribute('data-tab');
                document.getElementById(`${tabId}Tab`).classList.add('active');
            });
        });
    </script>
</body>
</html>
