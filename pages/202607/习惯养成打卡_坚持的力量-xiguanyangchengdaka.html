                        <!-- 星期标题 -->

                        </div>
                        
                        <!-- 日历网格 -->
                        <div id="calendarGrid" class="grid grid-cols-7 gap-1 text-center">
                            <!-- 日历将通过JS动态生成 -->

                    </div>
                    
                    <!-- 习惯统计 -->
                    <div class="habit-card">
                        <h2 class="text-xl font-bold mb-4 flex items-center">
                            <i class="fa fa-bar-chart text-primary mr-2"></i>习惯统计
                        </h2>
                        
                        <div id="habitsStats" class="space-y-4">
                            <!-- 统计信息将通过JS动态生成 -->
                            <div class="text-center text-gray-500 py-6">
                                <p>添加习惯并开始打卡后显示统计数据</p>
                            </div>
                        </div>
                    </div>

            </section>
        </main>

    <!-- 底部备注 -->
    <footer class="mt-10 py-4 border-t border-gray-200">

                <a href="https://dkfile.com/Dx25214" target="_blank" rel="noopener" class="text-primary hover:underline">🌌</a>
            </p>
        </div>

    <!-- 提示弹窗 -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs">
        <i class="fa fa-check-circle mr-2"></i>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 习惯养成工具主类
        const HabitTracker = {
            // 初始化
            init() {
                // 初始化数据
                this.loadData();
                
                // 设置当前日期显示
                const today = new Date();
                this.currentDate = today;
                this.currentMonth = today.getMonth();
                this.currentYear = today.getFullYear();
                
                // 更新今日日期显示
                document.getElementById('todayDate').textContent = this.formatDate(today);
                
                // 初始化事件监听
                this.initEventListeners();
                
                // 渲染页面
                this.renderHabitsList();
                this.renderTodayHabits();
                this.renderCalendar();
                this.renderHabitsStats();
            },
            
            // 从本地存储加载数据
            loadData() {
                const savedHabits = localStorage.getItem('habits');
                const savedCheckins = localStorage.getItem('habitCheckins');
                
                this.habits = savedHabits ? JSON.parse(savedHabits) : [];
                this.checkins = savedCheckins ? JSON.parse(savedCheckins) : {};
            },
            
            // 保存数据到本地存储
            saveData() {
                localStorage.setItem('habits', JSON.stringify(this.habits));
                localStorage.setItem('habitCheckins', JSON.stringify(this.checkins));
            },
            
            // 初始化事件监听
            initEventListeners() {
                // 添加新习惯表单提交
                document.getElementById('addHabitForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.addNewHabit();
                });
                
                // 月份切换
                document.getElementById('prevMonth').addEventListener('click', () => {
                    this.currentMonth--;
                    if (this.currentMonth < 0) {
                        this.currentMonth = 11;
                        this.currentYear--;
                    }
                    this.renderCalendar();
                });
                
                document.getElementById('nextMonth').addEventListener('click', () => {
                    this.currentMonth++;
                    if (this.currentMonth > 11) {
                        this.currentMonth = 0;
                        this.currentYear++;
                    }
                    this.renderCalendar();
                });
                
                // 清空所有数据
                // （隐藏功能，用于开发测试，可通过控制台调用）
                this.clearAllData = () => {
                    if (confirm('确定要清空所有习惯和打卡记录吗？此操作不可恢复。')) {
                        localStorage.removeItem('habits');
                        localStorage.removeItem('habitCheckins');
                        this.habits = [];
                        this.checkins = {};
                        this.renderAll();
                        this.showToast('所有数据已清空', 'info');
                    }
                };
            },
            
            // 添加新习惯
            addNewHabit() {
                const habitNameInput = document.getElementById('newHabitName');
                const habitName = habitNameInput.value.trim();
                
                if (!habitName) {
                    this.showToast('请输入习惯名称', 'error');
                    return;
                }
                
                // 检查是否已存在同名习惯
                const exists = this.habits.some(habit => habit.name.toLowerCase() === habitName.toLowerCase());
                if (exists) {
                    this.showToast('该习惯已存在', 'error');
                    return;
                }
                
                // 创建新习惯对象
                const newHabit = {
                    id: Date.now().toString(),
                    name: habitName,
                    createdAt: new Date().toISOString()
                };
                
                // 添加到习惯列表
                this.habits.push(newHabit);
                
                // 保存数据
                this.saveData();
                
                // 更新UI
                this.renderAll();
                
                // 清空输入框
                habitNameInput.value = '';
                
                this.showToast(`已添加习惯：${habitName}`);
            },
            
            // 切换习惯打卡状态
            toggleCheckin(habitId) {
                const today = this.getDateString(new Date());
                
                // 如果该习惯今天还没打卡
                if (!this.isCheckedIn(habitId, today)) {
                    // 打卡
                    if (!this.checkins[habitId]) {
                        this.checkins[habitId] = {};
                    }
                    this.checkins[habitId][today] = true;
                    this.showToast('打卡成功！继续保持！');
                } else {
                    // 取消打卡
                    if (this.checkins[habitId]) {
                        delete this.checkins[habitId][today];
                        // 如果该习惯没有任何打卡记录了，删除整个对象
                        if (Object.keys(this.checkins[habitId]).length === 0) {
                            delete this.checkins[habitId];
                        }
                    }
                    this.showToast('已取消今日打卡');
                }
                
                // 保存数据
                this.saveData();
                
                // 更新UI
                this.renderAll();
            },
            
            // 删除习惯
            deleteHabit(habitId) {
                const habit = this.habits.find(h => h.id === habitId);
                if (!habit) return;
                
                if (confirm(`确定要删除习惯"${habit.name}"吗？相关打卡记录也会被删除。`)) {
                    // 从习惯列表中删除
                    this.habits = this.habits.filter(h => h.id !== habitId);
                    
                    // 删除相关打卡记录
                    delete this.checkins[habitId];
                    
                    // 保存数据
                    this.saveData();
                    
                    // 更新UI
                    this.renderAll();
                    
                    this.showToast(`已删除习惯：${habit.name}`);
                }
            },
            
            // 检查某天是否已打卡
            isCheckedIn(habitId, dateString) {
                return this.checkins[habitId] && this.checkins[habitId][dateString] === true;
            },
            
            // 获取习惯的打卡记录数量
            getCheckinCount(habitId) {
                return this.checkins[habitId] ? Object.keys(this.checkins[habitId]).length : 0;
            },
            
            // 获取习惯的连续打卡天数
            getStreakCount(habitId) {
                if (!this.checkins[habitId]) return 0;
                
                const checkinDates = Object.keys(this.checkins[habitId]).sort();
                if (checkinDates.length === 0) return 0;
                
                // 从今天开始往前计算连续天数
                let streak = 0;
                const today = new Date();
                
                // 检查今天是否打卡
                const todayStr = this.getDateString(today);
                if (this.isCheckedIn(habitId, todayStr)) {
                    streak = 1;
                } else {
                    // 如果今天没打卡，检查昨天
                    const yesterday = new Date(today);
                    yesterday.setDate(today.getDate() - 1);
                    const yesterdayStr = this.getDateString(yesterday);
                    
                    if (!this.isCheckedIn(habitId, yesterdayStr)) {
                        return 0;
                    }
                    streak = 1;
                    today.setDate(today.getDate() - 1); // 从昨天开始计算
                }
                
                // 继续往前检查
                let currentDate = new Date(today);
                currentDate.setDate(currentDate.getDate() - 1);
                
                while (true) {
                    const dateStr = this.getDateString(currentDate);
                    if (this.isCheckedIn(habitId, dateStr)) {
                        streak++;
                        currentDate.setDate(currentDate.getDate() - 1);
                    } else {
                        break;
                    }
                }
                
                return streak;
            },
            
            // 获取习惯的最长连续打卡记录
            getBestStreak(habitId) {
                if (!this.checkins[habitId]) return 0;
                
                const checkinDates = Object.keys(this.checkins[habitId]).sort();
                if (checkinDates.length === 0) return 0;
                
                let maxStreak = 1;
                let currentStreak = 1;
                
                // 遍历所有打卡日期计算最长连续记录
                for (let i = 1; i < checkinDates.length; i++) {
                    const prevDate = new Date(checkinDates[i-1]);
                    const currDate = new Date(checkinDates[i]);
                    
                    // 计算日期差（天数）
                    const diffTime = currDate - prevDate;
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    
                    if (diffDays === 1) {
                        currentStreak++;
                        maxStreak = Math.max(maxStreak, currentStreak);
                    } else {
                        currentStreak = 1;
                    }
                }
                
                return maxStreak;
            },
            
            // 获取习惯的完成率（过去30天）
            getCompletionRate(habitId) {
                if (!this.checkins[habitId]) return 0;
                
                const today = new Date();
                const thirtyDaysAgo = new Date();
                thirtyDaysAgo.setDate(today.getDate() - 30);
                
                let totalDays = 0;
                let checkedDays = 0;
                
                const currentDate = new Date(thirtyDaysAgo);
                while (currentDate <= today) {
                    totalDays++;
                    const dateStr = this.getDateString(currentDate);
                    
                    if (this.isCheckedIn(habitId, dateStr)) {
                        checkedDays++;
                    }
                    
                    currentDate.setDate(currentDate.getDate() + 1);
                }
                
                return totalDays > 0 ? Math.round((checkedDays / totalDays) * 100) : 0;
            },
            
            // 渲染所有UI元素
            renderAll() {
                this.renderHabitsList();
                this.renderTodayHabits();
                this.renderCalendar();
                this.renderHabitsStats();
            },
            
            // 渲染习惯列表
            renderHabitsList() {
                const habitsListEl = document.getElementById('habitsList');
                
                if (this.habits.length === 0) {
                    habitsListEl.innerHTML = `
                        <div class="text-center text-gray-500 py-6">
                            <p>还没有添加习惯</p>
                            <p class="text-sm mt-1">添加您想要养成的习惯吧</p>
                        </div>
                    `;
                    return;
                }
                
                // 按创建时间排序（最新的在前）
                const sortedHabits = [...this.habits].sort((a, b) => 
                    new Date(b.createdAt) - new Date(a.createdAt)
                );
                
                habitsListEl.innerHTML = '';
                sortedHabits.forEach(habit => {
                    const checkinCount = this.getCheckinCount(habit.id);
                    const streakCount = this.getStreakCount(habit.id);
                    const today = this.getDateString(new Date());
                    const isCheckedInToday = this.isCheckedIn(habit.id, today);
                    
                    const habitEl = document.createElement('div');
                    habitEl.className = 'flex justify-between items-center p-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition-colors';
                    habitEl.innerHTML = `
                        <div>
                            <div class="font-medium">${habit.name}</div>
                            <div class="text-sm text-gray-500 mt-0.5">
                                <span class="mr-3"><i class="fa fa-calendar-check-o text-secondary mr-1"></i>${checkinCount}次</span>
                                <span><i class="fa fa-fire text-accent mr-1"></i>连续${streakCount}天</span>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button class="delete-habit p-2 text-gray-400 hover:text-danger transition-colors" data-id="${habit.id}">
                                <i class="fa fa-trash-o"></i>
                            </button>
                        </div>
                    `;
                    
                    habitsListEl.appendChild(habitEl);
                });
                
                // 添加删除事件监听
                document.querySelectorAll('.delete-habit').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const habitId = e.currentTarget.dataset.id;
                        this.deleteHabit(habitId);
                    });
                });
            },
            
            // 渲染今日打卡区
            renderTodayHabits() {
                const todayHabitsEl = document.getElementById('todayHabits');
                const today = this.getDateString(new Date());
                
                if (this.habits.length === 0) {
                    todayHabitsEl.innerHTML = `
                        <div class="col-span-full text-center text-gray-500 py-8 border border-dashed border-gray-200 rounded-lg">
                            <p>请先添加习惯，然后在这里进行每日打卡</p>
                        </div>
                    `;
                    return;
                }
                
                todayHabitsEl.innerHTML = '';
                this.habits.forEach(habit => {
                    const isCheckedIn = this.isCheckedIn(habit.id, today);
                    const streakCount = this.getStreakCount(habit.id);
                    
                    const habitEl = document.createElement('div');
                    habitEl.className = `p-4 rounded-lg border transition-all ${isCheckedIn ? 'border-secondary bg-secondary/5' : 'border-gray-200 hover:border-primary/30'}`;
                    habitEl.innerHTML = `
                        <div class="flex justify-between items-center">
                            <div class="font-medium">${habit.name}</div>
                            <button class="checkin-btn w-10 h-10 rounded-full flex items-center justify-center transition-all ${isCheckedIn ? 'bg-secondary text-white' : 'bg-gray-100 text-gray-600 hover:bg-primary hover:text-white'}" data-id="${habit.id}">
                                <i class="fa ${isCheckedIn ? 'fa-check' : 'fa-plus'}"></i>
                            </button>
                        </div>
                        ${streakCount > 0 ? `
                            <div class="text-sm text-gray-500 mt-2">
                                <i class="fa fa-fire text-accent mr-1"></i>已连续${streakCount}天
                            </div>
                        ` : ''}
                    `;
                    
                    todayHabitsEl.appendChild(habitEl);
                });
                
                // 添加打卡事件监听
                document.querySelectorAll('.checkin-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const habitId = e.currentTarget.dataset.id;
                        this.toggleCheckin(habitId);
                    });
                });
            },
            
            // 渲染日历
            renderCalendar() {
                // 更新月份显示
                const monthNames = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];
                document.getElementById('currentMonthDisplay').textContent = `${this.currentYear}年${monthNames[this.currentMonth]}`;
                
                const calendarGridEl = document.getElementById('calendarGrid');
                calendarGridEl.innerHTML = '';
                
                // 获取当月第一天
                const firstDay = new Date(this.currentYear, this.currentMonth, 1);
                // 获取当月最后一天
                const lastDay = new Date(this.currentYear, this.currentMonth + 1, 0);
                
                // 获取当月第一天是星期几（0是星期日）
                const firstDayOfWeek = firstDay.getDay();
                
                // 添加上个月的占位天数
                for (let i = 0; i < firstDayOfWeek; i++) {
                    const emptyDay = document.createElement('div');
                    emptyDay.className = 'calendar-day opacity-0';
                    calendarGridEl.appendChild(emptyDay);
                }
                
                // 获取今天的日期字符串
                const today = new Date();
                const todayStr = this.getDateString(today);
                
                // 添加当月的天数
                for (let day = 1; day <= lastDay.getDate(); day++) {
                    const currentDate = new Date(this.currentYear, this.currentMonth, day);
                    const dateStr = this.getDateString(currentDate);
                    const isToday = dateStr === todayStr;
                    
                    // 检查这一天是否有任何习惯打卡
                    let hasCheckin = false;
                    Object.keys(this.checkins).forEach(habitId => {
                        if (this.checkins[habitId] && this.checkins[habitId][dateStr]) {
                            hasCheckin = true;
                        }
                    });
                    
                    const dayEl = document.createElement('div');
                    dayEl.className = `calendar-day ${hasCheckin ? 'calendar-day打卡' : 'calendar-day其他'} ${isToday ? 'calendar-day今天' : ''}`;
                    dayEl.innerHTML = `<span>${day}</span>`;
                    
                    // 添加日期点击事件（显示当天打卡情况）
                    dayEl.addEventListener('click', () => {
                        this.showDateCheckins(currentDate);
                    });
                    
                    calendarGridEl.appendChild(dayEl);
                }
            },
            
            // 显示某天的打卡情况
            showDateCheckins(date) {
                const dateStr = this.getDateString(date);
                const formattedDate = this.formatDate(date);
                
                // 收集当天的打卡情况
                const checkedHabits = [];
                const uncheckedHabits = [];
                
                this.habits.forEach(habit => {
                    if (this.isCheckedIn(habit.id, dateStr)) {
                        checkedHabits.push(habit);
                    } else {
                        uncheckedHabits.push(habit);
                    }
                });
                
                // 构建弹窗内容
                let content = `<h3 class="font-bold text-lg mb-3">${formattedDate} 打卡情况</h3>`;
                
                if (this.habits.length === 0) {
                    content += `<p>还没有添加任何习惯</p>`;
                } else {
                    if (checkedHabits.length > 0) {
                        content += `
                            <div class="mb-4">
                                <h4 class="font-medium text-secondary mb-2">已打卡 (${checkedHabits.length})</h4>
                                <ul class="list-disc list-inside text-gray-700 space-y-1">
                                    ${checkedHabits.map(habit => `<li>${habit.name}</li>`).join('')}
                                </ul>
                            </div>
                        `;
                    }
                    
                    if (uncheckedHabits.length > 0) {
                        content += `
                            <div>
                                <h4 class="font-medium text-gray-500 mb-2">未打卡 (${uncheckedHabits.length})</h4>
                                <ul class="list-disc list-inside text-gray-600 space-y-1">
                                    ${uncheckedHabits.map(habit => `<li>${habit.name}</li>`).join('')}
                                </ul>
                            </div>
                        `;
                    }
                }
                
                // 创建弹窗
                this.showModal(formattedDate + ' 打卡情况', content);
            },
            
            // 渲染习惯统计
            renderHabitsStats() {
                const statsEl = document.getElementById('habitsStats');
                
                if (this.habits.length === 0) {
                    statsEl.innerHTML = `
                        <div class="text-center text-gray-500 py-6">
                            <p>添加习惯并开始打卡后显示统计数据</p>
                        </div>
                    `;
                    return;
                }
                
                // 按连续天数排序（从高到低）
                const sortedHabits = [...this.habits].sort((a, b) => 
                    this.getStreakCount(b.id) - this.getStreakCount(a.id)
                );
                
                statsEl.innerHTML = '';
                sortedHabits.forEach(habit => {
                    const streakCount = this.getStreakCount(habit.id);
                    const bestStreak = this.getBestStreak(habit.id);
                    const checkinCount = this.getCheckinCount(habit.id);
                    const completionRate = this.getCompletionRate(habit.id);
                    
                    const statsItem = document.createElement('div');
                    statsItem.className = 'p-4 bg-gray-50 rounded-lg';
                    statsItem.innerHTML = `
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold">${habit.name}</h3>
                            <span class="px-3 py-1 rounded-full text-sm font-medium ${streakCount > 0 ? 'bg-accent/10 text-accent' : 'bg-gray-200 text-gray-600'}">
                                连续${streakCount}天
                            </span>
                        </div>
                        
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-3">
                            <div class="bg-white p-2 rounded shadow-sm">
                                <div class="text-sm text-gray-500">总打卡次数</div>
                                <div class="font-bold text-lg">${checkinCount}</div>
                            </div>
                            <div class="bg-white p-2 rounded shadow-sm">
                                <div class="text-sm text-gray-500">最长连续</div>
                                <div class="font-bold text-lg">${bestStreak}天</div>
                            </div>
                            <div class="bg-white p-2 rounded shadow-sm">
                                <div class="text-sm text-gray-500">30天完成率</div>
                                <div class="font-bold text-lg">${completionRate}%</div>
                            </div>
                        </div>
                        
                        <div class="w-full bg-gray-200 rounded-full h-2">
                            <div class="bg-primary h-2 rounded-full" style="width: ${completionRate}%"></div>
                        </div>
                    `;
                    
                    statsEl.appendChild(statsItem);
                });
            },
            
            // 显示模态框
            showModal(title, content) {
                // 检查是否已有模态框，如有则移除
                const existingModal = document.getElementById('customModal');
                if (existingModal) {
                    existingModal.remove();
                }
                
                // 创建模态框
                const modal = document.createElement('div');
                modal.id = 'customModal';
                modal.className = 'fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4';
                modal.innerHTML = `
                    <div class="bg-white rounded-xl shadow-lg max-w-md w-full max-h-[80vh] overflow-y-auto">
                        <div class="p-5 border-b border-gray-100 flex justify-between items-center">
                            <h2 class="text-lg font-bold">${title}</h2>
                            <button id="closeModal" class="text-gray-400 hover:text-gray-600">
                                <i class="fa fa-times"></i>
                            </button>
                        </div>
                        <div class="p-5">
                            ${content}
                        </div>
                    </div>
                `;
                
                // 添加到页面
                document.body.appendChild(modal);
                
                // 添加关闭事件
                document.getElementById('closeModal').addEventListener('click', () => {
                    modal.remove();
                });
                
                // 点击背景关闭
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) {
                        modal.remove();
                    }
                });
            },
            
            // 显示提示消息
            showToast(message, type = 'success') {
                const toast = document.getElementById('toast');
                const toastMsg = document.getElementById('toastMessage');
                
                toastMsg.textContent = message;
                
                // 设置样式
                if (type === 'success') {
                    toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs bg-green-500 text-white';
                    toast.querySelector('i').className = 'fa fa-check-circle mr-2';
                } else if (type === 'error') {
                    toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs bg-red-500 text-white';
                    toast.querySelector('i').className = 'fa fa-exclamation-circle mr-2';
                } else if (type === 'info') {
                    toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs bg-blue-500 text-white';
                    toast.querySelector('i').className = 'fa fa-info-circle mr-2';
                }
                
                // 3秒后隐藏
                setTimeout(() => {
                    toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs';
                }, 3000);
            },
            
            // 工具函数：格式化日期为字符串（YYYY-MM-DD）
            getDateString(date) {
                return date.toISOString().split('T')[0];
            },
            
            // 工具函数：格式化日期为可读性更高的格式（YYYY年MM月DD日 星期X）
            formatDate(date) {
                const year = date.getFullYear();
                const month = date.getMonth() + 1;
                const day = date.getDate();
                const weekDays = ["日", "一", "二", "三", "四", "五", "六"];
                const weekDay = weekDays[date.getDay()];
                
                return `${year}年${month}月${day}日 星期${weekDay}`;
            }
        };
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            HabitTracker.init();
        });
    </script>
</body>
</html>
