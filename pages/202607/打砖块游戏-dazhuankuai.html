<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打砖块游戏</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        
        #game-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        
        #game-canvas {
            background-color: #0a192f;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: block;
            margin: 0 auto;
            touch-action: none;
        }
        
        #score-display {
            color: white;
            font-size: 24px;
            margin: 10px 0;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #start-button {
            background: linear-gradient(to right, #ff5e62, #ff9966);
            border: none;
            color: white;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 94, 98, 0.4);
            transition: all 0.3s ease;
            outline: none;
            margin-top: 20px;
        }
        
        #start-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 94, 98, 0.6);
        }
        
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            color: white;
            display: none;
        }
        
        @media (max-width: 600px) {
            #game-canvas {
                width: 95%;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="score-display">分数: 0</div>
        <canvas id="game-canvas" width="600" height="400"></canvas>
        <button id="start-button">开始游戏</button>
        <div id="game-over">
            <h2>游戏结束!</h2>
            <p id="final-score">最终分数: 0</p>
            <button id="restart-button">再玩一次</button>
        </div>
    </div>

    <script>
        // 游戏变量
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const startButton = document.getElementById('start-button');
        const gameOverDiv = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const restartButton = document.getElementById('restart-button');
        
        // 调整画布大小以适应移动设备
        function resizeCanvas() {
            const maxWidth = Math.min(600, window.innerWidth - 40);
            const ratio = 400 / 600;
            canvas.width = maxWidth;
            canvas.height = maxWidth * ratio;
        }
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // 游戏对象
        let ball = {
            x: canvas.width / 2,
            y: canvas.height - 30,
            radius: 8,
            dx: 4,
            dy: -4,
            color: '#ff5e62'
        };
        
        let paddle = {
            width: 100,
            height: 12,
            x: canvas.width / 2 - 50,
            y: canvas.height - 20,
            color: '#4ecdc4',
            speed: 8,
            isMovingLeft: false,
            isMovingRight: false
        };
        
        let bricks = [];
        const brickRowCount = 5;
        const brickColumnCount = 8;
        const brickWidth = canvas.width / brickColumnCount - 6;
        const brickHeight = 20;
        const brickPadding = 2;
        const brickOffsetTop = 60;
        const brickOffsetLeft = 3;
        
        let score = 0;
        let lives = 3;
        let gameRunning = false;
        let animationId;
        
        // 初始化砖块
        function initBricks() {
            bricks = [];
            const colors = ['#ff9a9e', '#fad0c4', '#fbc2eb', '#a6c1ee', '#84fab0'];
            
            for (let c = 0; c < brickColumnCount; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickRowCount; r++) {
                    const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
                    const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                    bricks[c][r] = {
                        x: brickX,
                        y: brickY,
                        width: brickWidth,
                        height: brickHeight,
                        color: colors[r % colors.length],
                        visible: true
                    };
                }
            }
        }
        
        // 绘制球
        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = ball.color;
            ctx.fill();
            ctx.closePath();
            
            // 添加发光效果
            ctx.shadowBlur = 15;
            ctx.shadowColor = ball.color;
        }
        
        // 绘制挡板
        function drawPaddle() {
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 6);
            ctx.fillStyle = paddle.color;
            ctx.fill();
            ctx.closePath();
            
            // 添加发光效果
            ctx.shadowBlur = 10;
            ctx.shadowColor = paddle.color;
        }
        
        // 绘制砖块
        function drawBricks() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    if (bricks[c][r].visible) {
                        const brick = bricks[c][r];
                        ctx.beginPath();
                        ctx.roundRect(brick.x, brick.y, brick.width, brick.height, 4);
                        ctx.fillStyle = brick.color;
                        ctx.fill();
                        ctx.closePath();
                        
                        // 添加边框效果
                        ctx.strokeStyle = 'rgba(0, 0, 0, 0.1)';
                        ctx.stroke();
                    }
                }
            }
            ctx.shadowBlur = 0; // 重置阴影
        }
        
        // 碰撞检测
        function collisionDetection() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    const brick = bricks[c][r];
                    if (brick.visible) {
                        if (
                            ball.x > brick.x &&
                            ball.x < brick.x + brick.width &&
                            ball.y > brick.y &&
                            ball.y < brick.y + brick.height
                        ) {
                            ball.dy = -ball.dy;
                            brick.visible = false;
                            score += 10;
                            scoreDisplay.textContent = `分数: ${score}`;
                            
                            // 检查是否所有砖块都被击破
                            if (score === brickRowCount * brickColumnCount * 10) {
                                gameWin();
                            }
                        }
                    }
                }
            }
        }
        
        // 移动球
        function moveBall() {
            // 边界碰撞检测
            if (ball.x + ball.dx > canvas.width - ball.radius || ball.x + ball.dx < ball.radius) {
                ball.dx = -ball.dx;
            }
            
            if (ball.y + ball.dy < ball.radius) {
                ball.dy = -ball.dy;
            } else if (ball.y + ball.dy > paddle.y - ball.radius) {
                // 球接近挡板区域
                if (ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
                    // 球碰到挡板
                    ball.dy = -Math.abs(ball.dy); // 确保球向上反弹
                    
                    // 根据击打位置改变球的方向
                    const hitPosition = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
                    ball.dx = hitPosition * 5;
                } else if (ball.y + ball.dy > canvas.height - ball.radius) {
                    // 球没碰到挡板且落到底部 - 游戏结束
                    gameOver();
                }
            }
            
            ball.x += ball.dx;
            ball.y += ball.dy;
        }
        
        // 移动挡板
        function movePaddle() {
            if (paddle.isMovingLeft && paddle.x > 0) {
                paddle.x -= paddle.speed;
            }
            
            if (paddle.isMovingRight && paddle.x < canvas.width - paddle.width) {
                paddle.x += paddle.speed;
            }
        }
        
        // 重置球和挡板位置
        function resetBallAndPaddle() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height - 30;
            ball.dx = 4 * (Math.random() > 0.5 ? 1 : -1);
            ball.dy = -4;
            
            paddle.x = canvas.width / 2 - paddle.width / 2;
        }
        
        // 绘制游戏
        function draw() {
            // 清除画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制游戏元素
            drawBricks();
            drawBall();
            drawPaddle();
            
            // 绘制生命值
            ctx.fillStyle = 'white';
            ctx.font = '16px Arial';
            ctx.fillText(`生命: ${lives}`, 20, 30);
            
            // 碰撞检测
            collisionDetection();
            
            // 移动游戏元素
            moveBall();
            movePaddle();
            
            // 继续动画
            if (gameRunning) {
                animationId = requestAnimationFrame(draw);
            }
        }
        
        // 游戏结束
        function gameOver() {
            gameRunning = false;
            cancelAnimationFrame(animationId);
            finalScoreDisplay.textContent = `最终分数: ${score}`;
            gameOverDiv.style.display = 'block';
        }
        
        // 游戏胜利
        function gameWin() {
            gameRunning = false;
            cancelAnimationFrame(animationId);
            finalScoreDisplay.textContent = `胜利! 最终分数: ${score}`;
            gameOverDiv.style.display = 'block';
        }
        
        // 开始游戏
        function startGame() {
            score = 0;
            lives = 3;
            scoreDisplay.textContent = `分数: ${score}`;
            gameOverDiv.style.display = 'none';
            initBricks();
            resetBallAndPaddle();
            gameRunning = true;
            draw();
        }
        
        // 事件监听
        startButton.addEventListener('click', () => {
            startButton.style.display = 'none';
            startGame();
        });
        
        restartButton.addEventListener('click', () => {
            gameOverDiv.style.display = 'none';
            startGame();
        });
        
        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'Left') {
                paddle.isMovingLeft = true;
            } else if (e.key === 'ArrowRight' || e.key === 'Right') {
                paddle.isMovingRight = true;
            }
        });
        
        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'Left') {
                paddle.isMovingLeft = false;
            } else if (e.key === 'ArrowRight' || e.key === 'Right') {
                paddle.isMovingRight = false;
            }
        });
        
        // 触摸控制
        let touchX = 0;
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            touchX = e.touches[0].clientX;
        });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const newTouchX = e.touches[0].clientX;
            const rect = canvas.getBoundingClientRect();
            const canvasX = newTouchX - rect.left;
            
            paddle.x = canvasX - paddle.width / 2;
            
            // 确保挡板不超出画布
            if (paddle.x < 0) {
                paddle.x = 0;
            }
            if (paddle.x > canvas.width - paddle.width) {
                paddle.x = canvas.width - paddle.width;
            }
        });
    </script>
</body>
</html>
