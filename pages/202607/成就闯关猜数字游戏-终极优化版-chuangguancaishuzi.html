<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成就闯关猜数字游戏 - 终极优化版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-tertiary: #0f3460;
            --accent-primary: #e94560;
            --accent-secondary: #f39c12;
            --accent-success: #27ae60;
            --text-primary: #ffffff;
            --text-secondary: #b8c1d4;
            --text-muted: #6c7a89;
            --border-color: #2c3e50;
            --shadow-light: 0 2px 8px rgba(0, 0, 0, 0.1);
            --shadow-medium: 0 4px 16px rgba(0, 0, 0, 0.2);
            --shadow-heavy: 0 8px 32px rgba(0, 0, 0, 0.3);
            --border-radius: 12px;
            --border-radius-large: 16px;
            --border-radius-small: 8px;
            
            --bronze: #cd7f32;
            --silver: #c0c0c0;
            --gold: #ffd700;
            --platinum: #e5e4e2;
            --diamond: #b9f2ff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary), var(--bg-secondary));
            min-height: 100vh;
            padding: 20px;
            color: var(--text-primary);
            line-height: 1.6;
        }

        .game-container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--bg-tertiary);
            border-radius: var(--border-radius-large);
            box-shadow: var(--shadow-heavy);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-primary));
            padding: 30px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .game-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .level-progress {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        .level-node {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .level-node.active {
            background: var(--accent-primary);
            border-color: var(--accent-secondary);
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        }

        .level-node.completed {
            background: var(--accent-success);
            border-color: var(--accent-success);
        }

        .progress-line {
            height: 2px;
            width: 40px;
            background: var(--border-color);
            position: relative;
        }

        .progress-line.active {
            background: linear-gradient(90deg, var(--accent-success), var(--accent-primary));
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            padding: 30px;
            min-height: 70vh;
        }

        .sidebar {
            background: var(--bg-secondary);
            border-radius: var(--border-radius);
            padding: 25px;
            border: 1px solid var(--border-color);
        }

        .center-panel {
            background: var(--bg-secondary);
            border-radius: var(--border-radius);
            padding: 30px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .sidebar-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--accent-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stats-panel {
            background: var(--bg-primary);
            border-radius: var(--border-radius-small);
            padding: 20px;
            margin-bottom: 20px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .stat-value {
            color: var(--accent-secondary);
            font-weight: 700;
            font-size: 1.1rem;
        }

        .level-info {
            text-align: center;
            margin-bottom: 25px;
        }

        .level-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--accent-primary);
        }

        .range-display {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-secondary);
            margin-bottom: 15px;
            text-align: center;
            padding: 15px;
            background: var(--bg-primary);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
        }

        .attempts-counter {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: 700;
            display: inline-block;
            box-shadow: var(--shadow-medium);
        }

        .tools-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        .tool-btn {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-small);
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 1rem;
            color: var(--text-primary);
        }

        .tool-btn:hover:not(:disabled) {
            background: var(--bg-tertiary);
            border-color: var(--accent-secondary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-medium);
        }

        .tool-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .result-display {
            background: var(--bg-primary);
            border-radius: var(--border-radius);
            padding: 30px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 500;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            width: 100%;
        }

        .result-display.correct {
            background: linear-gradient(135deg, var(--accent-success), #2ecc71);
            color: white;
            animation: celebrationPulse 0.6s ease-out;
        }

        .result-display.wrong {
            background: linear-gradient(135deg, var(--accent-primary), #e74c3c);
            color: white;
        }

        .result-display.hint {
            background: linear-gradient(135deg, var(--accent-secondary), #f1c40f);
            color: var(--bg-primary);
        }

        @keyframes celebrationPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .input-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 400px;
        }

        .number-input {
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-small);
            padding: 20px;
            font-size: 1.5rem;
            text-align: center;
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .number-input:focus {
            outline: none;
            border-color: var(--accent-secondary);
            box-shadow: 0 0 0 3px rgba(243, 156, 18, 0.3);
        }

        .submit-btn {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            border-radius: var(--border-radius-small);
            padding: 18px 40px;
            font-size: 1.3rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 150px;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: var(--shadow-heavy);
        }

        .achievements-panel {
            max-height: none;
            overflow-y: visible;
        }

        .achievement-category {
            margin-bottom: 25px;
        }

        .achievement-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .achievement-item {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-small);
            padding: 15px;
            transition: all 0.3s ease;
            position: relative;
            cursor: pointer;
        }

        .achievement-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-medium);
            border-color: var(--accent-secondary);
        }

        .achievement-item.unlocked {
            border-color: var(--gold);
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 215, 0, 0.08));
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .achievement-item.locked {
            opacity: 0.4;
            background: var(--bg-primary);
            border-color: var(--border-color);
            filter: grayscale(100%);
        }

        .achievement-item.unlocked .achievement-icon {
            animation: achievementGlow 2s ease-in-out infinite alternate;
        }

        .achievement-item.locked .achievement-icon {
            opacity: 0.5;
        }

        .achievement-item.unlocked .achievement-name {
            color: var(--gold);
            font-weight: 800;
        }

        .achievement-item.locked .achievement-name {
            color: var(--text-muted);
        }

        .achievement-item.locked .achievement-desc {
            color: var(--text-muted);
        }

        @keyframes achievementGlow {
            from {
                text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
            }
            to {
                text-shadow: 0 0 15px rgba(255, 215, 0, 0.8), 0 0 25px rgba(255, 215, 0, 0.5);
            }
        }

        .achievement-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            position: relative;
        }

        .achievement-status {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
            z-index: 2;
        }

        .achievement-item.unlocked .achievement-status {
            background: var(--gold);
            color: var(--bg-primary);
            border: 2px solid var(--bg-secondary);
            content: "✓";
        }

        .achievement-item.locked .achievement-status {
            background: var(--text-muted);
            color: var(--bg-primary);
            border: 2px solid var(--bg-secondary);
            content: "🔒";
        }

        .achievement-icon {
            font-size: 1.5rem;
            width: 30px;
            text-align: center;
        }

        .achievement-content {
            flex: 1;
        }

        .achievement-name {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 2px;
            color: var(--text-primary);
        }

        .achievement-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .achievement-progress-bar {
            height: 4px;
            background: var(--border-color);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .achievement-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-secondary), var(--gold));
            transition: width 0.3s ease;
        }

        .achievement-progress-text {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: right;
        }

        .achievement-rarity {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 0.7rem;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: 700;
        }

        .rarity-bronze { 
            background: linear-gradient(135deg, var(--bronze), #b8860b); 
            color: white; 
        }
        .rarity-silver { 
            background: linear-gradient(135deg, var(--silver), #a8a8a8); 
            color: var(--bg-primary); 
        }
        .rarity-gold { 
            background: linear-gradient(135deg, var(--gold), #ffa500); 
            color: var(--bg-primary); 
        }
        .rarity-platinum { 
            background: linear-gradient(135deg, var(--platinum), #d3d3d3); 
            color: var(--bg-primary); 
        }

        /* 模态框优化 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-large);
            padding: 40px;
            text-align: center;
            box-shadow: var(--shadow-heavy);
            max-width: 500px;
            width: 90%;
            position: relative;
        }

        .achievement-unlock-modal {
            background: linear-gradient(135deg, var(--gold), var(--accent-secondary));
            color: var(--bg-primary);
            border: none;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
        }

        /* 响应式设计优化 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .main-layout {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 20px;
            }

            .game-title {
                font-size: 2rem;
            }

            .level-progress {
                gap: 15px;
            }

            .level-node {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }

            .range-display {
                font-size: 1.5rem;
            }

            .input-section {
                max-width: 100%;
            }
        }

        /* 动画效果 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in-up {
            animation: fadeInUp 0.5s ease-out;
        }

        /* 成就解锁动画 */
        @keyframes achievementUnlock {
            0% { 
                transform: scale(0.8) rotate(-5deg); 
                opacity: 0; 
            }
            50% { 
                transform: scale(1.1) rotate(2deg); 
                opacity: 1; 
            }
            100% { 
                transform: scale(1) rotate(0deg); 
                opacity: 1; 
            }
        }

        .achievement-unlocked {
            animation: achievementUnlock 0.6s ease-out;
        }

        /* 范围输入动画 */
        @keyframes rangeUpdate {
            0% { transform: scale(0.95); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .range-update {
            animation: rangeUpdate 0.3s ease-out;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1 class="game-title">🏆 成就闯关猜数字</h1>
            <p class="subtitle">挑战智慧，解锁荣耀，成为猜数字大师！</p>
            
            <div class="level-progress">
                <div class="level-node active" data-level="1">1</div>
                <div class="progress-line"></div>
                <div class="level-node" data-level="2">2</div>
                <div class="progress-line"></div>
                <div class="level-node" data-level="3">3</div>
                <div class="progress-line"></div>
                <div class="level-node" data-level="4">4</div>
                <div class="progress-line"></div>
                <div class="level-node" data-level="5">5</div>
            </div>
        </div>

        <div class="main-layout">
            <!-- 左侧：游戏状态 -->
            <div class="sidebar">
                <div class="sidebar-title">🎮 游戏状态</div>
                
                <div class="stats-panel">
                    <div class="stat-item">
                        <span class="stat-label">当前关卡</span>
                        <span class="stat-value" id="current-level">1</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">总猜测次数</span>
                        <span class="stat-value" id="total-guesses">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">成就解锁</span>
                        <span class="stat-value" id="achievements-unlocked">0/6</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">游戏得分</span>
                        <span class="stat-value" id="game-score">0</span>
                    </div>
                </div>

                <div class="level-info">
                    <div class="level-name" id="level-name">第1关：新手试炼</div>
                    <div class="attempts-counter">
                        剩余 <span id="attempts-left">7</span> 次
                    </div>
                </div>

                <div class="tools-grid">
                    <button class="tool-btn" id="hint-btn">
                        <span>💡 提示</span>
                        <span id="hint-count">1</span>
                    </button>
                    <button class="tool-btn" id="chance-btn">
                        <span>🔄 机会</span>
                        <span id="chance-count">1</span>
                    </button>
                    <button class="tool-btn" id="skip-btn">
                        <span>⏭️ 跳过</span>
                        <span id="skip-count">1</span>
                    </button>
                    <button class="tool-btn" id="reset-btn">
                        <span>🔄 重置关卡</span>
                        <span>保持成就</span>
                    </button>
                </div>

                <!-- 成就系统移到左侧 -->
                <div class="sidebar-title" style="margin-top: 30px;">🏆 成就系统</div>
                <div class="achievement-grid">
                    <div class="achievement-item" id="achievement-first-guess" data-id="first_guess">
                        <div class="achievement-header">
                            <div class="achievement-icon">🎯</div>
                            <div class="achievement-status">✓</div>
                            <div class="achievement-content">
                                <div class="achievement-name">初出茅庐</div>
                                <div class="achievement-desc">完成第一次有效猜测</div>
                            </div>
                        </div>
                        <div class="achievement-progress-bar">
                            <div class="achievement-progress-fill" style="width: 0%"></div>
                        </div>
                        <div class="achievement-progress-text">0/1</div>
                        <div class="achievement-rarity rarity-bronze">铜</div>
                    </div>

                    <div class="achievement-item" id="achievement-first-level" data-id="first_level">
                        <div class="achievement-header">
                            <div class="achievement-icon">🌟</div>
                            <div class="achievement-status">✓</div>
                            <div class="achievement-content">
                                <div class="achievement-name">旗开得胜</div>
                                <div class="achievement-desc">通过第1关</div>
                            </div>
                        </div>
                        <div class="achievement-progress-bar">
                            <div class="achievement-progress-fill" style="width: 0%"></div>
                        </div>
                        <div class="achievement-progress-text">0/1</div>
                        <div class="achievement-rarity rarity-bronze">铜</div>
                    </div>

                    <div class="achievement-item" id="achievement-lucky-guess" data-id="lucky_guess">
                        <div class="achievement-header">
                            <div class="achievement-icon">🍀</div>
                            <div class="achievement-status">✓</div>
                            <div class="achievement-content">
                                <div class="achievement-name">幸运一击</div>
                                <div class="achievement-desc">第一次猜测就猜中正确答案</div>
                            </div>
                        </div>
                        <div class="achievement-progress-bar">
                            <div class="achievement-progress-fill" style="width: 0%"></div>
                        </div>
                        <div class="achievement-progress-text">0/1</div>
                        <div class="achievement-rarity rarity-silver">银</div>
                    </div>

                    <div class="achievement-item" id="achievement-speed-demon" data-id="speed_demon">
                        <div class="achievement-header">
                            <div class="achievement-icon">⚡</div>
                            <div class="achievement-status">✓</div>
                            <div class="achievement-content">
                                <div class="achievement-name">极速猎手</div>
                                <div class="achievement-desc">在3次内猜中正确答案</div>
                            </div>
                        </div>
                        <div class="achievement-progress-bar">
                            <div class="achievement-progress-fill" style="width: 0%"></div>
                        </div>
                        <div class="achievement-progress-text">0/1</div>
                        <div class="achievement-rarity rarity-gold">金</div>
                    </div>

                    <div class="achievement-item" id="achievement-persistent" data-id="persistent">
                        <div class="achievement-header">
                            <div class="achievement-icon">🎯</div>
                            <div class="achievement-status">✓</div>
                            <div class="achievement-content">
                                <div class="achievement-name">坚持不懈</div>
                                <div class="achievement-desc">累计完成30次有效猜测</div>
                            </div>
                        </div>
                        <div class="achievement-progress-bar">
                            <div class="achievement-progress-fill" style="width: 0%"></div>
                        </div>
                        <div class="achievement-progress-text">0/30</div>
                        <div class="achievement-rarity rarity-silver">银</div>
                    </div>

                    <div class="achievement-item" id="achievement-master" data-id="master">
                        <div class="achievement-header">
                            <div class="achievement-icon">👑</div>
                            <div class="achievement-status">✓</div>
                            <div class="achievement-content">
                                <div class="achievement-name">数字大师</div>
                                <div class="achievement-desc">成功通关所有5个关卡</div>
                            </div>
                        </div>
                        <div class="achievement-progress-bar">
                            <div class="achievement-progress-fill" style="width: 0%"></div>
                        </div>
                        <div class="achievement-progress-text">0/5</div>
                        <div class="achievement-rarity rarity-platinum">白金</div>
                    </div>
                </div>
            </div>

            <!-- 中间：游戏主区域 -->
            <div class="center-panel">
                <div class="result-display" id="result-display">
                    输入数字开始游戏，解锁成就吧！
                </div>
                
                <div class="range-display" id="range-display">
                    1 - 50
                </div>

                <div class="input-section">
                    <input type="number" class="number-input" id="guess-input" placeholder="输入数字" min="1" max="1000">
                    <button class="submit-btn" id="submit-btn">猜！</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 成就解锁模态框 -->
    <div class="modal" id="achievement-modal">
        <div class="modal-content achievement-unlock-modal">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div class="achievement-icon-large">🏆</div>
            <div class="modal-title">成就解锁！</div>
            <div id="modal-achievement-name" style="font-size: 1.3rem; font-weight: 700; margin-bottom: 10px;"></div>
            <div id="modal-achievement-desc" style="font-size: 1rem; opacity: 0.9;"></div>
            <button class="submit-btn" onclick="closeModal()" style="margin-top: 20px; background: var(--bg-primary);">太棒了！</button>
        </div>
    </div>

    <script>
        // 游戏状态
        let gameState = {
            currentLevel: 1,
            targetNumber: 0,
            attemptsLeft: 7,
            totalGuesses: 0,
            gameScore: 0,
            maxLevel: 5,
            hints: 1,
            chances: 1,
            skips: 1,
            minRange: 1,
            maxRange: 50,
            achievements: {
                first_guess: { unlocked: false, progress: 0, max: 1 },
                first_level: { unlocked: false, progress: 0, max: 1 },
                lucky_guess: { unlocked: false, progress: 0, max: 1 },
                speed_demon: { unlocked: false, progress: 0, max: 1 },
                persistent: { unlocked: false, progress: 0, max: 30 },
                master: { unlocked: false, progress: 0, max: 5 }
            }
        };

        // 关卡配置
        const levels = [
            { name: "新手试炼", range: [1, 50], attempts: 7 },
            { name: "进阶挑战", range: [1, 100], attempts: 8 },
            { name: "高手对决", range: [1, 200], attempts: 9 },
            { name: "大师考验", range: [1, 500], attempts: 10 },
            { name: "终极挑战", range: [1, 1000], attempts: 12 }
        ];

        // DOM元素
        const elements = {
            currentLevel: document.getElementById('current-level'),
            totalGuesses: document.getElementById('total-guesses'),
            achievementsUnlocked: document.getElementById('achievements-unlocked'),
            gameScore: document.getElementById('game-score'),
            levelName: document.getElementById('level-name'),
            attemptsLeft: document.getElementById('attempts-left'),
            hintCount: document.getElementById('hint-count'),
            chanceCount: document.getElementById('chance-count'),
            skipCount: document.getElementById('skip-count'),
            resultDisplay: document.getElementById('result-display'),
            rangeDisplay: document.getElementById('range-display'),
            guessInput: document.getElementById('guess-input'),
            submitBtn: document.getElementById('submit-btn'),
            hintBtn: document.getElementById('hint-btn'),
            chanceBtn: document.getElementById('chance-btn'),
            skipBtn: document.getElementById('skip-btn'),
            resetBtn: document.getElementById('reset-btn')
        };

        // 初始化游戏
        function initGame() {
            startNewLevel();
            updateUI();
            loadGameState();
        }

        // 开始新关卡
        function startNewLevel() {
            const level = levels[gameState.currentLevel - 1];
            gameState.targetNumber = Math.floor(Math.random() * (level.range[1] - level.range[0] + 1)) + level.range[0];
            gameState.attemptsLeft = level.attempts;
            gameState.minRange = level.range[0];
            gameState.maxRange = level.range[1];
            
            elements.guessInput.max = level.range[1];
            elements.guessInput.min = level.range[0];
            elements.guessInput.placeholder = `输入数字`;
            
            updateRangeDisplay();
            updateUI();
        }

        // 更新范围显示
        function updateRangeDisplay() {
            elements.rangeDisplay.textContent = `${gameState.minRange} - ${gameState.maxRange}`;
            elements.rangeDisplay.classList.add('range-update');
            setTimeout(() => {
                elements.rangeDisplay.classList.remove('range-update');
            }, 300);
        }

        // 更新UI
        function updateUI() {
            const level = levels[gameState.currentLevel - 1];
            elements.currentLevel.textContent = gameState.currentLevel;
            elements.totalGuesses.textContent = gameState.totalGuesses;
            elements.gameScore.textContent = gameState.gameScore;
            elements.levelName.textContent = `第${gameState.currentLevel}关：${level.name}`;
            elements.attemptsLeft.textContent = gameState.attemptsLeft;
            elements.hintCount.textContent = gameState.hints;
            elements.chanceCount.textContent = gameState.chances;
            elements.skipCount.textContent = gameState.skips;

            // 更新成就计数
            const unlockedCount = Object.values(gameState.achievements).filter(a => a.unlocked).length;
            elements.achievementsUnlocked.textContent = `${unlockedCount}/6`;

            // 更新工具按钮状态
            elements.hintBtn.disabled = gameState.hints <= 0;
            elements.chanceBtn.disabled = gameState.chances <= 0;
            elements.skipBtn.disabled = gameState.skips <= 0;

            // 更新进度条
            updateAchievementProgress();

            // 更新关卡节点
            updateLevelNodes();
        }

        // 更新成就进度
        function updateAchievementProgress() {
            Object.keys(gameState.achievements).forEach(key => {
                const achievement = gameState.achievements[key];
                const element = document.getElementById(`achievement-${key}`);
                if (element) {
                    const progressBar = element.querySelector('.achievement-progress-fill');
                    const progressText = element.querySelector('.achievement-progress-text');
                    
                    if (progressBar && progressText) {
                        const percentage = (achievement.progress / achievement.max) * 100;
                        progressBar.style.width = `${percentage}%`;
                        progressText.textContent = `${achievement.progress}/${achievement.max}`;
                        
                        if (achievement.unlocked) {
                            element.classList.add('unlocked');
                            element.classList.remove('locked');
                        } else {
                            element.classList.add('locked');
                            element.classList.remove('unlocked');
                        }
                    }
                }
            });
        }

        // 更新关卡节点
        function updateLevelNodes() {
            const nodes = document.querySelectorAll('.level-node');
            const lines = document.querySelectorAll('.progress-line');
            
            nodes.forEach((node, index) => {
                const level = index + 1;
                if (level < gameState.currentLevel) {
                    node.classList.add('completed');
                    node.classList.remove('active');
                } else if (level === gameState.currentLevel) {
                    node.classList.add('active');
                    node.classList.remove('completed');
                } else {
                    node.classList.remove('active', 'completed');
                }
            });

            lines.forEach((line, index) => {
                if (index < gameState.currentLevel - 1) {
                    line.classList.add('active');
                } else {
                    line.classList.remove('active');
                }
            });
        }

        // 检查成就
        function checkAchievements(guess, isCorrect, attemptsInLevel) {
            const achievement = gameState.achievements;
            
            // 初出茅庐：第一次有效猜测就解锁
            if (gameState.totalGuesses === 1) {
                unlockAchievement('first_guess');
            }
            
            // 幸运一击：第一次猜测就猜中目标数字
            if (isCorrect && attemptsInLevel === 1) {
                unlockAchievement('lucky_guess');
            }
            
            // 极速猎手：3次内猜中
            if (isCorrect && attemptsInLevel <= 3) {
                unlockAchievement('speed_demon');
            }
            
            // 旗开得胜：通过第1关
            if (isCorrect && gameState.currentLevel === 1) {
                unlockAchievement('first_level');
            }
            
            // 坚持不懈：累计猜测次数
            achievement.persistent.progress = Math.min(gameState.totalGuesses, achievement.persistent.max);
            if (achievement.persistent.progress >= achievement.persistent.max) {
                unlockAchievement('persistent');
            }
            
            // 数字大师：只有答对才增加进度
            if (isCorrect) {
                achievement.master.progress = gameState.currentLevel;
                if (achievement.master.progress >= achievement.master.max) {
                    unlockAchievement('master');
                }
            }
        }

        // 解锁成就
        function unlockAchievement(achievementId) {
            const achievement = gameState.achievements[achievementId];
            if (!achievement.unlocked) {
                achievement.unlocked = true;
                gameState.gameScore += getAchievementScore(achievementId);
                
                // 显示成就解锁动画
                showAchievementModal(achievementId);
                
                // 保存游戏状态
                saveGameState();
            }
        }

        // 获取成就分数
        function getAchievementScore(achievementId) {
            const scores = {
                first_guess: 10,
                first_level: 20,
                lucky_guess: 50,
                speed_demon: 100,
                persistent: 30,
                master: 200
            };
            return scores[achievementId] || 10;
        }

        // 显示成就模态框
        function showAchievementModal(achievementId) {
            const names = {
                first_guess: "初出茅庐",
                first_level: "旗开得胜",
                lucky_guess: "幸运一击",
                speed_demon: "极速猎手",
                persistent: "坚持不懈",
                master: "数字大师"
            };
            
            const descs = {
                first_guess: "恭喜完成第一次猜测！",
                first_level: "成功通过第1关！",
                lucky_guess: "第一次就猜中了，运气爆棚！",
                speed_demon: "3次内猜中，速度惊人！",
                persistent: "累计猜测30次，毅力可嘉！",
                master: "通关所有5关，成为真正的数字大师！"
            };

            document.getElementById('modal-achievement-name').textContent = names[achievementId];
            document.getElementById('modal-achievement-desc').textContent = descs[achievementId];
            
            const modal = document.getElementById('achievement-modal');
            modal.style.display = 'flex';
            
            // 添加解锁动画
            const achievementElement = document.getElementById(`achievement-${achievementId}`);
            if (achievementElement) {
                achievementElement.classList.add('achievement-unlocked');
                setTimeout(() => {
                    achievementElement.classList.remove('achievement-unlocked');
                }, 1000);
            }
        }

        // 关闭模态框
        function closeModal() {
            document.getElementById('achievement-modal').style.display = 'none';
        }

        // 保存游戏状态
        function saveGameState() {
            localStorage.setItem('guessNumberGameStateUltimate', JSON.stringify(gameState));
        }

        // 加载游戏状态
        function loadGameState() {
            const saved = localStorage.getItem('guessNumberGameStateUltimate');
            if (saved) {
                try {
                    const savedState = JSON.parse(saved);
                    gameState = { ...gameState, ...savedState };
                    updateUI();
                    updateRangeDisplay();
                } catch (e) {
                    console.error('Failed to load game state:', e);
                }
            }
        }

        // 处理猜测
        function handleGuess() {
            const guess = parseInt(elements.guessInput.value);
            if (isNaN(guess)) {
                elements.resultDisplay.textContent = "请输入有效的数字！";
                elements.resultDisplay.className = "result-display wrong";
                return;
            }

            if (guess < gameState.minRange || guess > gameState.maxRange) {
                elements.resultDisplay.textContent = `请输入 ${gameState.minRange}-${gameState.maxRange} 之间的数字！`;
                elements.resultDisplay.className = "result-display wrong";
                return;
            }

            gameState.totalGuesses++;
            gameState.attemptsLeft--;

            const isCorrect = guess === gameState.targetNumber;
            const attemptsInLevel = levels[gameState.currentLevel - 1].attempts - gameState.attemptsLeft;
            
            if (isCorrect) {
                elements.resultDisplay.textContent = `🎉 恭喜！数字就是 ${gameState.targetNumber}！`;
                elements.resultDisplay.className = "result-display correct";
                
                const score = calculateLevelScore();
                gameState.gameScore += score;
                
                setTimeout(() => {
                    if (gameState.currentLevel < gameState.maxLevel) {
                        gameState.currentLevel++;
                        startNewLevel();
                        elements.resultDisplay.textContent = "进入下一关！继续挑战！";
                        elements.resultDisplay.className = "result-display";
                    } else {
                        elements.resultDisplay.textContent = "🎊 恭喜通关！你是真正的数字大师！";
                        elements.resultDisplay.className = "result-display correct";
                    }
                }, 1500);
            } else {
                // 更新范围显示
                if (guess < gameState.targetNumber) {
                    gameState.minRange = Math.max(gameState.minRange, guess + 1);
                    elements.resultDisplay.textContent = `${guess} 太小了！`;
                } else {
                    gameState.maxRange = Math.min(gameState.maxRange, guess - 1);
                    elements.resultDisplay.textContent = `${guess} 太大了！`;
                }
                
                elements.resultDisplay.className = "result-display hint";
                updateRangeDisplay();
                
                if (gameState.attemptsLeft <= 0) {
                    elements.resultDisplay.textContent = `游戏结束！正确答案是 ${gameState.targetNumber}`;
                    elements.resultDisplay.className = "result-display wrong";
                    setTimeout(() => {
                        startNewLevel();
                        elements.resultDisplay.textContent = "重新开始，继续挑战！";
                        elements.resultDisplay.className = "result-display";
                    }, 2000);
                }
            }

            checkAchievements(guess, isCorrect, attemptsInLevel);
            elements.guessInput.value = '';
            updateUI();
            saveGameState();
        }

        // 计算关卡得分
        function calculateLevelScore() {
            const baseScore = 100;
            const attemptsBonus = gameState.attemptsLeft * 10;
            const levelBonus = gameState.currentLevel * 50;
            return baseScore + attemptsBonus + levelBonus;
        }

        // 事件监听器
        elements.submitBtn.addEventListener('click', handleGuess);
        elements.guessInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleGuess();
        });

        elements.hintBtn.addEventListener('click', () => {
            if (gameState.hints > 0) {
                gameState.hints--;
                const midPoint = Math.floor((gameState.minRange + gameState.maxRange) / 2);
                const hint = gameState.targetNumber > midPoint ? 
                    `数字大于 ${midPoint}` : 
                    `数字小于等于 ${midPoint}`;
                elements.resultDisplay.textContent = `💡 提示：${hint}`;
                elements.resultDisplay.className = "result-display hint";
                updateUI();
                saveGameState();
            }
        });

        elements.chanceBtn.addEventListener('click', () => {
            if (gameState.chances > 0) {
                gameState.chances--;
                gameState.attemptsLeft += 3;
                elements.resultDisplay.textContent = "🔄 获得3次额外机会！";
                elements.resultDisplay.className = "result-display hint";
                updateUI();
                saveGameState();
            }
        });

        elements.skipBtn.addEventListener('click', () => {
            if (gameState.skips > 0) {
                gameState.skips--;
                if (gameState.currentLevel < gameState.maxLevel) {
                    gameState.currentLevel++;
                    startNewLevel();
                    elements.resultDisplay.textContent = "⏭️ 跳过当前关卡！";
                    elements.resultDisplay.className = "result-display hint";
                } else {
                    elements.resultDisplay.textContent = "已经是最后一关了！";
                    elements.resultDisplay.className = "result-display hint";
                }
                updateUI();
                saveGameState();
            }
        });

        elements.resetBtn.addEventListener('click', () => {
            // 重置当前关卡，但保留成就和统计数据
            elements.resultDisplay.textContent = "🔄 正在重置当前关卡...";
            elements.resultDisplay.className = "result-display hint";
            
            setTimeout(() => {
                startNewLevel();
                elements.resultDisplay.textContent = "关卡已重置！成就进度已保留";
                elements.resultDisplay.className = "result-display";
                updateUI();
                saveGameState();
            }, 1000);
        });

        // 点击模态框外部关闭
        document.getElementById('achievement-modal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                closeModal();
            }
        });

        // 初始化游戏
        initGame();
    </script>
</body>
</html>
