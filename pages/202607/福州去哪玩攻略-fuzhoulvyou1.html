        // 获取DOM元素
        const getBtn = document.getElementById('getBtn');
        const changeBtn = document.getElementById('changeBtn');
        const result = document.getElementById('result');
        const placeName = document.getElementById('placeName');
        const desc = document.getElementById('desc');
        const address = document.getElementById('address');
        const transport = document.getElementById('transport');
        const ticket = document.getElementById('ticket');
        const time = document.getElementById('time');
        const downloadBtn = document.getElementById('downloadBtn');
        const modal = document.getElementById('downloadModal');
        const span = document.getElementsByClassName('close')[0];

        let usedIndexes = [];

        // 获取随机景点
        function getRandomPlace() {
            if (usedIndexes.length >= places.length) {
                usedIndexes = [];
            }
            
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * places.length);
            } while (usedIndexes.includes(randomIndex));
            
            usedIndexes.push(randomIndex);
            return places[randomIndex];
        }

        // 显示景点信息
        function showPlace() {
            const place = getRandomPlace();
            placeName.textContent = place.name;
            desc.textContent = place.desc;
            address.textContent = place.address;
            transport.textContent = place.transport;
            ticket.textContent = place.ticket;
            time.textContent = place.time;
            
            result.style.display = 'block';
            changeBtn.style.display = 'inline-block';
            getBtn.textContent = '再玩一次';
        }

        // 按钮事件
        getBtn.addEventListener('click', showPlace);
        changeBtn.addEventListener('click', showPlace);

        // 下载按钮事件
        downloadBtn.onclick = function() {
            modal.style.display = "block";
        }

        // 关闭弹窗
        span.onclick = function() {
            modal.style.display = "none";
        }

        // 点击弹窗外部关闭
        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
