        // 获取DOM元素
        const getGuideBtn = document.getElementById('getGuideBtn');
        const changeGuideBtn = document.getElementById('changeGuideBtn');
        const guideContainer = document.getElementById('guideContainer');
        const guideTitle = document.getElementById('guideTitle');
        const guideDescription = document.getElementById('guideDescription');
        const guideAddress = document.getElementById('guideAddress');
        const guideTransport = document.getElementById('guideTransport');
        const guideTicket = document.getElementById('guideTicket');
        const guideHours = document.getElementById('guideHours');
        const downloadBtn = document.getElementById('downloadBtn');
        const modal = document.getElementById('downloadModal');
        const span = document.getElementsByClassName('close')[0];

        // 存储已展示的景点索引
        let shownAttractions = [];
        
        // 随机获取一个新景点
        function getRandomAttraction() {
            if (shownAttractions.length === attractions.length) {
                shownAttractions = []; // 如果所有景点都已展示过，重置列表
            }
            
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * attractions.length);
            } while (shownAttractions.includes(randomIndex));
            
            shownAttractions.push(randomIndex);
            return attractions[randomIndex];
        }
        
        // 显示景点攻略
        function showAttractionGuide() {
            const attraction = getRandomAttraction();
            
            guideTitle.textContent = attraction.name;
            guideDescription.textContent = attraction.description;
            guideAddress.textContent = attraction.address;
            guideTransport.textContent = attraction.transport;
            guideTicket.textContent = attraction.ticket;
            guideHours.textContent = attraction.hours;
            
            guideContainer.classList.add('active');
            changeGuideBtn.disabled = false;
        }
        
        // 事件监听
        getGuideBtn.addEventListener('click', showAttractionGuide);
        changeGuideBtn.addEventListener('click', showAttractionGuide);
        
        // 下载按钮点击事件
        downloadBtn.addEventListener('click', function() {
            modal.style.display = "block";
        });
        
        // 关闭按钮点击事件
        span.addEventListener('click', function() {
            modal.style.display = "none";
        });
        
        // 点击模态框外部关闭
        window.addEventListener('click', function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        });
    </script>
