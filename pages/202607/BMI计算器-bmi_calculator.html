<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI 计算器</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            color: #333;
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 900px;
            text-align: center;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .main-content {
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }

        .left-panel {
            flex: 0 0 auto;
            width: 400px;
            min-width: 350px;
        }

        .right-panel {
            flex: 0 0 auto;
            width: 380px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 2.2em;
            font-weight: 600;
            position: relative;
        }

        h1::before {
            content: '⚖️';
            margin-right: 10px;
            font-size: 0.9em;
        }
        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 10px;
            color: #34495e;
            font-weight: 600;
            font-size: 1.1em;
        }
        .input-group input, .input-group select {
            padding: 15px 20px;
            border: 2px solid #e3f2fd;
            border-radius: 15px;
            font-size: 1em;
            box-sizing: border-box;
            transition: all 0.3s ease;
            background-color: #fafafa;
        }
        /* 确保体重输入框保持原有长度 */
        .input-group #weight {
            width: 100%;
        }
        .height-input-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .height-input-wrapper input {
            flex-grow: 1;
        }
        .height-input-wrapper select {
            width: auto;
            min-width: 100px;
            border-radius: 15px;
        }
        .input-group input:focus, .input-group select:focus {
            border-color: #42a5f5;
            box-shadow: 0 0 0 4px rgba(66, 165, 245, 0.15);
            outline: none;
            background-color: #ffffff;
        }
        .input-group .error-message {
            color: #e53935;
            font-size: 0.9em;
            margin-top: 8px;
            display: none;
            font-weight: 500;
            padding: 8px 12px;
            background: linear-gradient(135deg, #ffebee 0%, #ffcdd2 100%);
            border-radius: 10px;
            border: 1px solid #ef5350;
        }
        button {
            background: linear-gradient(135deg, #42a5f5 0%, #1e88e5 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            width: auto;
            min-width: 200px;
            max-width: 250px;
            margin: 0 auto;
            display: block;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(66, 165, 245, 0.3);
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            background: linear-gradient(135deg, #1e88e5 0%, #1565c0 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(66, 165, 245, 0.4);
        }
        .result-section {
            margin-top: 30px;
            padding: 30px;
            background: linear-gradient(135deg, #f8f9ff 0%, #e8f4fd 100%);
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(66, 165, 245, 0.1);
            text-align: center;
            border: 2px solid #e3f2fd;
        }
        .result-section h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.8em;
            font-weight: 600;
        }
        .result-item {
            margin-bottom: 15px;
            font-size: 1.2em;
            color: #495057;
            font-weight: 500;
        }
        #bmiValue {
            font-size: 2.6em;
            font-weight: bold;
            color: #1565c0;
            margin-bottom: 15px;
            text-shadow: 0 2px 4px rgba(21, 101, 192, 0.2);
        }
        #bmiStatus {
            font-size: 1.4em;
            font-weight: 600;
            margin-bottom: 25px;
            padding: 12px 24px;
            border-radius: 25px;
            display: inline-block;
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .status-thin {
            background: linear-gradient(135deg, #ffc107 0%, #ffb300 100%);
        }
        .status-normal {
            background: linear-gradient(135deg, #4caf50 0%, #388e3c 100%);
        }
        .status-overweight {
            background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
        }
        .status-obese {
            background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
        }

        .bmi-range-chart {
            width: 100%;
            height: 35px;
            background: linear-gradient(to right,
                #ffc107 0%, #ffc107 18.5%,
                #4caf50 18.5%, #4caf50 50%,
                #ff9800 50%, #ff9800 65%,
                #f44336 65%, #f44336 100%
            );
            border-radius: 15px;
            margin-top: 35px;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .bmi-indicator {
            position: absolute;
            width: 6px;
            height: 50px;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            top: -10px;
            transform: translateX(-50%);
            border-radius: 5px;
            box-shadow: 0 0 12px rgba(0,0,0,0.5);
            transition: left 0.5s ease-out;
        }
        .bmi-indicator::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            border: 10px solid transparent;
            border-bottom-color: #2c3e50;
        }
        .bmi-indicator::after {
            content: attr(data-bmi);
            position: absolute;
            top: 55px;
            left: 50%;
            transform: translateX(-50%);
            color: #2c3e50;
            font-weight: bold;
            font-size: 1em;
            white-space: nowrap;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 4px 8px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .reference-info {
            margin-bottom: 25px;
            text-align: left;
            font-size: 1em;
            color: #495057;
            background: rgba(255, 255, 255, 0.7);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(66, 165, 245, 0.2);
        }
        .reference-info h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.3em;
            font-weight: 600;
        }
        .reference-info ul {
            list-style: none;
            padding: 0;
        }
        .reference-info ul li {
            margin-bottom: 8px;
            padding: 8px 12px;
            background: rgba(66, 165, 245, 0.05);
            border-radius: 8px;
            border-left: 4px solid #42a5f5;
        }
        .health-advice {
            text-align: left;
            font-size: 1em;
            color: #495057;
            background: rgba(255, 255, 255, 0.7);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(66, 165, 245, 0.2);
        }
        .health-advice h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.3em;
            font-weight: 600;
        }
        .health-advice p {
            line-height: 1.6;
            margin: 0;
        }

        /* 页脚样式 */
        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 14px;
            border-top: 1px solid #e3f2fd;
            margin-top: 20px;
        }

        .footer strong {
            font-weight: 600;
            color: #333;
        }

        /* 响应式设计 */
        @media (max-width: 900px) {
            .main-content {
                flex-direction: column;
                gap: 25px;
            }
            .left-panel {
                width: 100%;
                min-width: auto;
            }
            .right-panel {
                width: 100%;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            .container {
                padding: 25px;
                border-radius: 15px;
                max-width: 100%;
            }
            .main-content {
                gap: 20px;
            }
            h1 {
                font-size: 1.8em;
            }
            .input-group input, .input-group select {
                padding: 12px 16px;
                border-radius: 12px;
            }
            .height-input-wrapper {
                gap: 10px;
            }
            .height-input-wrapper select {
                min-width: 80px;
            }
            button {
                padding: 12px 24px;
                font-size: 1em;
                border-radius: 20px;
                min-width: 180px;
                max-width: 220px;
            }
            .result-section {
                padding: 20px;
                border-radius: 15px;
            }
            #bmiValue {
                font-size: 2em;
            }
            #bmiStatus {
                font-size: 1.2em;
                padding: 10px 20px;
                border-radius: 20px;
            }
            .bmi-range-chart {
                height: 30px;
                border-radius: 12px;
            }
            .reference-info, .health-advice {
                padding: 15px;
                border-radius: 12px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 1.6em;
            }
            .input-group {
                margin-bottom: 20px;
            }
            .input-group input, .input-group select {
                padding: 10px 14px;
                font-size: 0.95em;
            }
            .height-input-wrapper {
                flex-direction: row;
                gap: 8px;
            }
            .height-input-wrapper input {
                flex: 1;
                min-width: 0;
            }
            .height-input-wrapper select {
                width: auto;
                min-width: 110px;
                flex-shrink: 0;
            }
            button {
                padding: 10px 20px;
                font-size: 0.95em;
                min-width: 160px;
                max-width: 200px;
            }
            .result-section {
                padding: 15px;
            }
            #bmiValue {
                font-size: 1.8em;
            }
            #bmiStatus {
                font-size: 1.1em;
                padding: 8px 16px;
            }
            .reference-info h3, .health-advice h3 {
                font-size: 1.2em;
            }
            .reference-info, .health-advice {
                padding: 12px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>BMI 计算器</h1>

        <div class="main-content">
            <div class="left-panel">
                <div class="input-group">
                    <label for="height">身高:</label>
                    <div class="height-input-wrapper">
                        <input type="number" id="height" placeholder="请输入身高" step="0.01" min="0" required>
                        <select id="heightUnit">
                            <option value="cm">厘米 (cm)</option>
                            <option value="m">米 (m)</option>
                        </select>
                    </div>
                    <div class="error-message" id="heightError">请输入有效的身高数值。</div>
                </div>

                <div class="input-group">
                    <label for="weight">体重 (kg):</label>
                    <input type="number" id="weight" placeholder="请输入体重" step="0.01" min="0" required>
                    <div class="error-message" id="weightError">请输入有效的体重数值。</div>
                </div>

                <button onclick="calculateBMI()">计算 BMI</button>

                <div class="result-section" id="resultSection" style="display: none;">
                    <h2>您的 BMI 结果</h2>
                    <div class="result-item">BMI 值: <span id="bmiValue">--</span></div>
                    <div class="result-item">健康状态: <span id="bmiStatus">--</span></div>

                    <div class="bmi-range-chart">
                        <div class="bmi-indicator" id="bmiIndicator" data-bmi="--"></div>
                    </div>
                </div>
            </div>

            <div class="right-panel">
                <div class="reference-info">
                    <h3>BMI 标准范围 (中国标准):</h3>
                    <ul>
                        <li>偏瘦: < 18.5</li>
                        <li>正常: 18.5 - 23.9</li>
                        <li>过重: 24.0 - 27.9</li>
                        <li>肥胖: &ge; 28.0</li>
                    </ul>
                </div>

                <div class="health-advice">
                    <h3>健康建议:</h3>
                    <p id="adviceText">
                        根据您的BMI结果，这里给您一些通用的健康建议。请记住，这些建议不能替代专业的医疗诊断和指导。
                    </p>
                </div>
            </div>
        </div>

        <!-- 页脚 -->
        <div class="footer">
            本工具使用AI编程实现，如有定制工具的需求可联系微信 <strong>L94026958</strong>
        </div>
    </div>

    <script>
        function calculateBMI() {
            const heightInput = document.getElementById('height');
            const weightInput = document.getElementById('weight');
            const heightUnit = document.getElementById('heightUnit').value;

            const heightError = document.getElementById('heightError');
            const weightError = document.getElementById('weightError');

            let height = parseFloat(heightInput.value);
            let weight = parseFloat(weightInput.value);

            // 数值验证
            let isValid = true;
            if (isNaN(height) || height <= 0) {
                heightError.style.display = 'block';
                isValid = false;
            } else {
                heightError.style.display = 'none';
            }

            if (isNaN(weight) || weight <= 0) {
                weightError.style.display = 'block';
                isValid = false;
            } else {
                weightError.style.display = 'none';
            }

            if (!isValid) {
                document.getElementById('resultSection').style.display = 'none';
                return;
            }

            // 将身高转换为米
            if (heightUnit === 'cm') {
                height /= 100;
            }

            const bmi = weight / (height * height);
            // 四舍五入保留1位小数，用于显示和判断
            const bmiRounded = Math.round(bmi * 10) / 10;
            
            const bmiValueElement = document.getElementById('bmiValue');
            const bmiStatusElement = document.getElementById('bmiStatus');
            const adviceTextElement = document.getElementById('adviceText');
            const resultSection = document.getElementById('resultSection');
            const bmiIndicator = document.getElementById('bmiIndicator');

            bmiValueElement.textContent = bmiRounded.toFixed(1); // 保留一位小数
            resultSection.style.display = 'block'; // 显示结果区域

            let status = '';
            let statusClass = '';
            let advice = '';

            if (bmiRounded < 18.5) {
                status = '偏瘦';
                statusClass = 'status-thin';
                advice = '您可能体重过轻。建议咨询医生或营养师，制定健康的增重计划，注重均衡饮食和适量运动。';
            } else if (bmiRounded >= 18.5 && bmiRounded <= 23.9) {
                status = '正常';
                statusClass = 'status-normal';
                advice = '您的BMI处于健康范围。请继续保持均衡饮食和规律运动，维持健康的生活方式。';
            } else if (bmiRounded >= 24.0 && bmiRounded <= 27.9) {
                status = '过重';
                statusClass = 'status-overweight';
                advice = '您可能体重过重。建议调整饮食结构，减少高热量食物摄入，增加有氧运动和力量训练。';
            } else { // bmiRounded >= 28.0
                status = '肥胖';
                statusClass = 'status-obese';
                advice = '您可能处于肥胖状态。强烈建议咨询医生或专业人士，制定个性化的减重方案，以降低相关健康风险。';
            }

            bmiStatusElement.textContent = status;
            bmiStatusElement.className = ''; // 清除旧的class
            bmiStatusElement.classList.add(statusClass);
            adviceTextElement.textContent = advice;

            // 更新BMI指示器位置
            // 根据BMI值和健康分类，映射到颜色条的正确位置
            // 颜色条分段：偏瘦(0-18.5%) 正常(18.5-50%) 过重(50-65%) 肥胖(65-100%)
            let positionPercentage;
            
            if (bmiRounded < 18.5) {
                // 偏瘦区域：BMI 0-18.5 映射到 0%-18.5%
                positionPercentage = (bmiRounded / 18.5) * 18.5;
            } else if (bmiRounded <= 23.9) {
                // 正常区域：BMI 18.5-23.9 映射到 18.5%-50%
                positionPercentage = 18.5 + ((bmiRounded - 18.5) / (23.9 - 18.5)) * (50 - 18.5);
            } else if (bmiRounded <= 27.9) {
                // 过重区域：BMI 24.0-27.9 映射到 50%-65%
                positionPercentage = 50 + ((bmiRounded - 24.0) / (27.9 - 24.0)) * (65 - 50);
            } else {
                // 肥胖区域：BMI 28.0+ 映射到 65%-100%
                // 假设BMI 35为最大值映射到100%
                positionPercentage = 65 + Math.min(((bmiRounded - 28.0) / (35 - 28.0)) * (100 - 65), 35);
            }

            // 限制位置在0%到100%之间
            positionPercentage = Math.max(0, Math.min(100, positionPercentage));

            bmiIndicator.style.left = `${positionPercentage}%`;
            bmiIndicator.setAttribute('data-bmi', bmiRounded.toFixed(1)); // 显示BMI值在指示器上
        }
    </script>
</body>
</html>
