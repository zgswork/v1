<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>简体转繁体</title><style>*,*::before,*::after{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Helvetica,Arial,'Apple Color Emoji','Segoe UI Emoji';line-height:1.55;background:#f6f7f9;color:#222;transition:background .2s,color .2s}.dark{background:#0f1216;color:#e6e6e6}.container{max-width:980px;margin:0 auto;padding:20px}.header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.title{font-weight:700;font-size:18px}.status{font-size:12px;opacity:.7}.row{display:flex;gap:12px}.col{flex:1;display:flex;flex-direction:column;gap:8px;position:relative}.area{width:100%;min-height:220px;resize:vertical;padding:12px;border:1px solid #d0d7de;border-radius:10px;background:#fff;color:#111;outline:none;transition:border .2s,background .2s,color .2s}.dark .area{background:#0c0f13;border-color:#263041;color:#e6e6e6}.tools{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:8px 12px;border:1px solid #d0d7de;border-radius:10px;background:#fff;color:#111;cursor:pointer;transition:background .2s,border .2s,color .2s}.btn:hover{background:#f1f5f9}.dark .btn{background:#10151b;color:#e6e6e6;border-color:#2b3647}.dark .btn:hover{background:#18202b}.select{padding:8px 12px;border:1px solid #d0d7de;border-radius:10px;background:#fff;color:#111}.dark .select{background:#10151b;color:#e6e6e6;border-color:#2b3647}.out{white-space:pre-wrap;border-style:dashed}.drop-indicator{position:absolute;inset:8px;border:2px dashed #2f7bfd;border-radius:10px;background:rgba(47,123,253,.06);color:#2f7bfd;display:none;align-items:center;justify-content:center;font-weight:600;pointer-events:none}.drop-indicator.show{display:flex}.dark .drop-indicator{border-color:#5aa0ff;color:#5aa0ff;background:rgba(90,160,255,.08)}mark.diff-chg{background:#fff3a8;color:inherit;border-radius:3px;padding:0 1px}.dark mark.diff-chg{background:#3a3200}.panel{border:1px dashed #d0d7de;border-radius:10px;padding:8px;background:#fff}.dark .panel{border-color:#2b3647;background:#10151b;color:#e6e6e6}.footer{margin-top:16px;font-size:12px;opacity:.7}.stats{margin-top:10px}.stats .pill{display:inline-block;padding:4px 8px;border:1px solid #d0d7de;border-radius:999px;background:#fff;color:#111;margin-right:6px}.dark .stats .pill{background:#10151b;color:#e6e6e6;border-color:#2b3647}@media (max-width:860px){.row{flex-direction:column}.header{flex-direction:column;align-items:flex-start;gap:6px}}</style></head><body><div class="container"><div class="header"><div class="title">简体转繁体 · 单文件版</div><div class="status" id="engineStatus">引擎检测中…</div><div style="display:flex;gap:8px;align-items:center"><button id="themeToggle" class="btn" aria-label="切换主题">🌞 浅色</button><select id="variant" class="select" aria-label="选择繁体地区"><option value="twp">台湾（含常用词）</option><option value="tw">台湾（标准）</option><option value="hk">香港</option></select><label class="status" style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" id="highlight"/> 高亮差异（目标侧只读）</label></div></div><div class="row"><div class="col"><div class="tools"><button id="clear" class="btn">清空</button><button id="demo" class="btn">填充示例</button><button id="import" class="btn">导入TXT</button><button id="toggleDict" class="btn">自定义词汇</button><input id="fileInput" type="file" accept=".txt,text/plain" style="display:none"></div><div id="drop" class="drop-indicator">释放以导入 TXT</div><textarea id="in" class="area" placeholder="在此粘贴或输入中文文本…"></textarea><div id="inView" class="area out" style="display:none" aria-label="左侧只读预览"></div><div id="dictPanel" class="panel" style="display:none"><div class="status">每行一个规则，支持“源=目标”或“源=>目标”。示例：<code>自行车=腳踏車</code></div><textarea id="customDict" class="area" style="min-height:140px" placeholder="示例：\n自行车=腳踏車\n电话=電話\n腳踏車=自行车（反向示例）"></textarea><div class="tools"><button id="saveDict" class="btn">保存词汇</button><button id="clearDict" class="btn">清空词汇</button></div></div></div><div class="col"><div class="tools"><button id="copy" class="btn">复制右侧</button><button id="download" class="btn">下载右侧为 TXT</button></div><textarea id="out" class="area" placeholder="在此粘贴或输入中文文本…"></textarea><div id="outView" class="area out" style="display:none" aria-label="右侧只读预览"></div></div></div><div class="status stats" id="stats"><span class="pill">左侧 0 字</span><span class="pill">右侧 0 字</span><span class="pill" id="modePill">自动方向：待检测 · 地区：台湾（常用词）</span></div><div class="footer">• 单文件 · 支持浅色/深色 · 响应式设计 •<br/>• 引擎：优先使用 OpenCC（CDN），若离线则使用内置简易映射 •<br/>• 快捷键：Ctrl+Shift+C 复制右侧，Ctrl+Shift+D 下载右侧，Ctrl+Shift+L 切主题 •</div></div><script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script><script>const elIn=document.getElementById('in');const elOut=document.getElementById('out');const elCopy=document.getElementById('copy');const elClear=document.getElementById('clear');const elDemo=document.getElementById('demo');const elTheme=document.getElementById('themeToggle');const elEngineStatus=document.getElementById('engineStatus');const elVariant=document.getElementById('variant');const elImport=document.getElementById('import');const elFile=document.getElementById('fileInput');const elStats=document.getElementById('stats');const elModePill=document.getElementById('modePill');const elHighlight=document.getElementById('highlight');const elToggleDict=document.getElementById('toggleDict');const elDictPanel=document.getElementById('dictPanel');const elCustomDict=document.getElementById('customDict');const elSaveDict=document.getElementById('saveDict');const elClearDict=document.getElementById('clearDict');const elDrop=document.getElementById('drop');const elOutView=document.getElementById('outView');const elInView=document.getElementById('inView');const nameMap={twp:'台湾（常用词）',tw:'台湾（标准）',hk:'香港'};function dirLabel(d){return d==='s2t'?'简体→繁体':'繁体→简体'}let convS2T=s=>s,convT2S=s=>s;let lastDir='s2t';let isSyncing=false;let lastRightText='';let lastLeftText='';if(localStorage.getItem('theme')==='dark'){document.body.classList.add('dark');elTheme.textContent='🌙 深色'}elTheme.onclick=()=>{document.body.classList.toggle('dark');const dark=document.body.classList.contains('dark');elTheme.textContent=dark?'🌙 深色':'🌞 浅色';localStorage.setItem('theme',dark?'dark':'light')};const savedVar=localStorage.getItem('variant')||'twp';elVariant.value=savedVar;elHighlight.checked=localStorage.getItem('highlight')==='1';const savedLeft=localStorage.getItem('inputText');const savedRight=localStorage.getItem('outputText');if(savedLeft){elIn.value=savedLeft}if(savedRight){elOut.value=savedRight}function msg(t){elEngineStatus.textContent=t}function updatePill(){elModePill.textContent='自动方向：'+dirLabel(lastDir)+' · 地区：'+(nameMap[elVariant.value]||elVariant.value)}function getConverter(dir,varLoc){if(window.OpenCC&&typeof OpenCC.Converter==='function'){if(dir==='s2t'){return OpenCC.Converter({from:'cn',to:varLoc})}else{const fromLoc=(varLoc==='twp')?'tw':varLoc;return OpenCC.Converter({from:fromLoc,to:'cn'})}}else{return dir==='s2t'?simpleS2T:simpleT2S}}function buildConverters(){convS2T=getConverter('s2t',elVariant.value);convT2S=getConverter('t2s',elVariant.value);if(window.OpenCC&&typeof OpenCC.Converter==='function'){msg('引擎：OpenCC 可用（'+(nameMap[elVariant.value]||elVariant.value)+'）')}else{msg('引擎：简易映射（离线）')}}function escapeRegex(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}function escapeHTML(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function parseCustomDict(){const raw=localStorage.getItem('customDict')||'';const lines=raw.split(/\r?\n/);const pairs=[];for(const ln0 of lines){const ln=ln0.trim();if(!ln)continue;const m=ln.match(/^(.+?)(?:=>|=)(.+)$/);if(m){pairs.push({from:m[1].trim(),to:m[2].trim()})}}return pairs}function applyCustomDict(text,dir){const pairs=parseCustomDict();if(!pairs.length)return text;for(const p of pairs){const src=dir==='s2t'?p.from:p.to;const dst=dir==='s2t'?p.to:p.from;if(!src)continue;text=text.replace(new RegExp(escapeRegex(src),'g'),dst)}return text}function countDiff(a,b){const len=Math.max(a.length,b.length);let n=0;for(let i=0;i<len;i++){if((a[i]||'')!==(b[i]||'')){n++}}return n}function autoDetectDir(text){const s2t=convS2T(text);const t2s=convT2S(text);const ds=countDiff(text,s2t);const dt=countDiff(text,t2s);if(ds===0&&dt===0){return lastDir}return ds>=dt?'s2t':'t2s'}function diffMarkup(a,b){const len=Math.max(a.length,b.length);let out='';for(let i=0;i<len;i++){const ch=b[i]||'';if(a[i]===b[i]&&a[i]!==undefined){out+=escapeHTML(ch)}else{if(ch){out+='<mark class=\"diff-chg\">'+escapeHTML(ch)+'</mark>'}}}return out}function showRight(output,input){lastRightText=output;if(elHighlight&&elHighlight.checked){elOut.style.display='none';elOutView.style.display='block';elOutView.innerHTML=diffMarkup(input,output)}else{elOutView.style.display='none';elOut.style.display='block';elOut.value=output}}function showLeft(output,input){lastLeftText=output;if(elHighlight&&elHighlight.checked){elIn.style.display='none';elInView.style.display='block';elInView.innerHTML=diffMarkup(input,output)}else{elInView.style.display='none';elIn.style.display='block';elIn.value=output}}function updateStats(){const l=(elIn.style.display!=='none'?elIn.value:lastLeftText||'').length;const r=(elOut.style.display!=='none'?elOut.value:lastRightText||'').length;elStats.querySelectorAll('.pill')[0].textContent='左侧 '+l+' 字';elStats.querySelectorAll('.pill')[1].textContent='右侧 '+r+' 字'}function fromLeft(){if(isSyncing)return;isSyncing=true;const input=elIn.value||'';const dir=autoDetectDir(input);lastDir=dir;const base=dir==='s2t'?convS2T(input):convT2S(input);const output=applyCustomDict(base,dir);showRight(output,input);localStorage.setItem('inputText',input);localStorage.setItem('outputText',output);updatePill();updateStats();isSyncing=false}function fromRight(){if(isSyncing)return;isSyncing=true;const input=elOut.value||'';const dir=autoDetectDir(input);lastDir=dir;const base=dir==='s2t'?convS2T(input):convT2S(input);const output=applyCustomDict(base,dir);showLeft(output,input);localStorage.setItem('outputText',input);localStorage.setItem('inputText',output);updatePill();updateStats();isSyncing=false}function simpleS2T(s){const phrases=[{from:'自行车',to:'腳踏車'},{from:'电话',to:'電話'},{from:'电脑',to:'電腦'}];phrases.forEach(p=>{s=s.replace(new RegExp(p.from,'g'),p.to)});const map={'“':'「','”':'」','‘':'『','’':'』','里':'裡','后':'後','台':'臺','万':'萬','与':'與','云':'雲','书':'書','产':'產','众':'眾','优':'優','会':'會','传':'傳','体':'體','党':'黨','内':'內','两':'兩','击':'擊','国':'國','图':'圖','够':'夠','声':'聲','头':'頭','学':'學','实':'實','对':'對','当':'當','爱':'愛','时':'時','气':'氣','汉':'漢','汤':'湯','沟':'溝','湾':'灣','车':'車'};return s.replace(/[“”‘’里后台万与云书产众优会传体党内两击国图够声头学实对当爱时气汉汤沟湾车]/g,ch=>map[ch]||ch)}function simpleT2S(s){const phrases=[{from:'腳踏車',to:'自行车'},{from:'電話',to:'电话'},{from:'電腦',to:'电脑'}];phrases.forEach(p=>{s=s.replace(new RegExp(p.from,'g'),p.to)});const map={'「':'“','」':'”','『':'‘','』':'’','裡':'里','後':'后','臺':'台','萬':'万','與':'与','雲':'云','書':'书','產':'产','眾':'众','優':'优','會':'会','傳':'传','體':'体','黨':'党','內':'内','兩':'两','擊':'击','國':'国','圖':'图','夠':'够','聲':'声','頭':'头','學':'学','實':'实','對':'对','當':'当','愛':'爱','時':'时','氣':'气','漢':'汉','湯':'汤','溝':'沟','灣':'湾','車':'车'};return s.replace(/[「」『』裡後臺萬與雲書產眾優會傳體黨內兩擊國圖夠聲頭學實對當愛時氣漢湯溝灣車]/g,ch=>map[ch]||ch)}elIn.addEventListener('input',fromLeft);elOut.addEventListener('input',fromRight);elClear.onclick=()=>{elIn.value='';elOut.value='';lastRightText='';lastLeftText='';elIn.style.display='block';elOut.style.display='block';elInView.style.display='none';elOutView.style.display='none';updateStats();msg('已清空')};elCopy.onclick=async()=>{const t=(elOut.style.display!=='none'?elOut.value:lastRightText)||'';if(!t){msg('右侧无内容可复制');return}try{await navigator.clipboard.writeText(t);msg('已复制右侧内容')}catch{msg('复制失败')}};elDemo.onclick=()=>{elIn.value='简体示例：那边的自行车、电脑和电话都在里屋。\n引号示例：“你好”，她说。';fromLeft()};elVariant.onchange=()=>{localStorage.setItem('variant',elVariant.value);buildConverters();fromLeft()};elImport.onclick=()=>elFile.click();elFile.onchange=async(e)=>{const f=e.target.files&&e.target.files[0];if(!f){return}try{const t=await f.text();elIn.value=t;fromLeft();msg('已导入 TXT：'+(f.name||'未命名'))}catch{msg('导入失败')}};elToggleDict.onclick=()=>{const show=elDictPanel.style.display!=='none';elDictPanel.style.display=show?'none':'block';if(!show){elCustomDict.value=localStorage.getItem('customDict')||''}};elSaveDict.onclick=()=>{localStorage.setItem('customDict',elCustomDict.value||'');msg('已保存自定义词汇');fromLeft()};elClearDict.onclick=()=>{elCustomDict.value='';localStorage.removeItem('customDict');msg('已清空自定义词汇');fromLeft()};elHighlight.onchange=()=>{localStorage.setItem('highlight',elHighlight.checked?'1':'0');if(elHighlight.checked){msg('差异高亮开启：目标侧变为只读视图')}else{msg('差异高亮关闭：两侧均可编辑');elIn.style.display='block';elOut.style.display='block';elInView.style.display='none';elOutView.style.display='none'}fromLeft()};elIn.addEventListener('dragenter',e=>{e.preventDefault();elDrop.classList.add('show')});elIn.addEventListener('dragover',e=>{e.preventDefault();elDrop.classList.add('show')});elIn.addEventListener('dragleave',()=>{elDrop.classList.remove('show')});elIn.addEventListener('drop',async e=>{e.preventDefault();elDrop.classList.remove('show');const dt=e.dataTransfer;if(dt&&dt.files&&dt.files.length){const f=dt.files[0];try{const t=await f.text();elIn.value=t;fromLeft();msg('已拖拽导入：'+(f.name||'未命名'))}catch{msg('拖拽导入失败')}}else if(dt){const t=dt.getData&&dt.getData('text');if(t){elIn.value=t;fromLeft();msg('已拖拽导入文本')}}});document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.shiftKey){const k=e.key.toLowerCase();if(k==='c'){elCopy.click();e.preventDefault()}else if(k==='d'){document.getElementById('download').click();e.preventDefault()}else if(k==='l'){elTheme.click();e.preventDefault()}else if(k==='i'){elImport.click();e.preventDefault()}else if(k==='h'){if(elHighlight){elHighlight.checked=!elHighlight.checked;localStorage.setItem('highlight',elHighlight.checked?'1':'0');if(elHighlight.checked){msg('差异高亮开启：目标侧变为只读视图')}else{msg('差异高亮关闭：两侧均可编辑');elIn.style.display='block';elOut.style.display='block';elInView.style.display='none';elOutView.style.display='none'}fromLeft();e.preventDefault()}}else if(k==='r'){fromLeft();e.preventDefault()}}});buildConverters();updatePill();fromLeft();document.getElementById('download').onclick=()=>{const nameSuffix=lastDir==='s2t'?((nameMap[elVariant.value]||elVariant.value)+'_繁体'):'简体';const text=(elOut.style.display!=='none'?elOut.value:lastRightText)||'';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download='右侧内容_'+nameSuffix+'.txt';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},0)};</script></body></html>
