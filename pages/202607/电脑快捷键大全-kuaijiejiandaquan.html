<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电脑快捷键大全</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f7f9fc;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .description {
            color: #7f8c8d;
            font-size: 1.1em;
        }
        
        .search-section {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }
        
        select, button {
            padding: 12px 15px;
            border-radius: 5px;
            border: 1px solid #ddd;
            font-size: 16px;
        }
        
        select {
            flex-grow: 1;
            min-width: 250px;
            background-color: white;
        }
        
        button {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #2980b9;
        }
        
        .results-section {
            margin-top: 20px;
        }
        
        .shortcut-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .shortcut-table th, .shortcut-table td {
            border: 1px solid #ddd;
            padding: 12px 15px;
            text-align: left;
        }
        
        .shortcut-table th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        
        .shortcut-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        
        .shortcut-table tr:hover {
            background-color: #f1f1f1;
        }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #7f8c8d;
            line-height: 1.8;
        }
        
        @media (max-width: 768px) {
            .search-section {
                flex-direction: column;
            }
            
            select, button {
                width: 100%;
            }
            
            .shortcut-table {
                font-size: 14px;
            }
            
            .shortcut-table th, .shortcut-table td {
                padding: 8px 10px;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .container {
                padding: 15px;
                border-radius: 5px;
            }
            
            h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>电脑快捷键大全</h1>
            <p class="description">一站式查询Windows、macOS及常用软件的快捷键，提高您的工作效率</p>
        </header>
        
        <div class="search-section">
            <select id="shortcutCategory">
                <option value="" selected disabled>请选择快捷键类别</option>
                <option value="windows">Windows电脑快捷键</option>
                <option value="mac">苹果电脑快捷键</option>
                <option value="excel">Excel快捷键</option>
                <option value="word">Word快捷键</option>
                <option value="ppt">PPT快捷键</option>
                <option value="ps">Photoshop快捷键</option>
                <option value="jianying">剪映快捷键</option>
            </select>
            
            <button id="searchButton">查询快捷键</button>
        </div>
        
        <div class="results-section">
            <h2 id="resultTitle">请选择类别并点击查询</h2>
            <table class="shortcut-table">
                <thead>
                    <tr>
                        <th width="30%">快捷键</th>
                        <th width="70%">功能说明</th>
                    </tr>
                </thead>
                <tbody id="shortcutResults">
                    <!-- 结果将动态生成 -->
                </tbody>
            </table>
        </div>
        
        <div class="footer">
            <p>本工具由叁贰壹制作</p>
            <p>微信 coolman88886666</p>
            <p>QQ邮箱 <a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="c6fef2f5f4f4f0fff6f286b7b7e8a5a9ab">[email&#160;protected]</a></p>
            <p>Gmail <a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="7d0e45494e4f4f4b444d493d1a101c1411531e1210">[email&#160;protected]</a></p>
        </div>
    </div>

                    { shortcut: 'Ctrl + Y', description: '重做被撤销的操作' },

                    { shortcut: 'Win + D', description: '显示或隐藏桌面' },
                    { shortcut: 'Win + E', description: '打开文件资源管理器' },
                    { shortcut: 'Win + L', description: '锁定计算机' },
                    { shortcut: 'Ctrl + Shift + Esc', description: '打开任务管理器' },
                    { shortcut: 'Alt + F4', description: '关闭当前活动窗口' }
                ],
                mac: [
                    { shortcut: 'Cmd + C', description: '复制选中的内容' },
                    { shortcut: 'Cmd + V', description: '粘贴复制的内容' },
                    { shortcut: 'Cmd + X', description: '剪切选中的内容' },
                    { shortcut: 'Cmd + Z', description: '撤销上一步操作' },
                    { shortcut: 'Cmd + Shift + Z', description: '重做被撤销的操作' },
                    { shortcut: 'Cmd + A', description: '选中所有内容' },
                    { shortcut: 'Cmd + Space', description: '打开Spotlight搜索' },
                    { shortcut: 'Cmd + Tab', description: '在打开的应用程序之间切换' },
                    { shortcut: 'Cmd + H', description: '隐藏当前应用程序窗口' },
                    { shortcut: 'Cmd + Q', description: '退出当前应用程序' },
                    { shortcut: 'Cmd + W', description: '关闭当前窗口' },
                    { shortcut: 'Option + Cmd + Esc', description: '强制退出应用程序' }
                ],
                excel: [
                    { shortcut: 'Ctrl + N', description: '新建工作簿' },
                    { shortcut: 'Ctrl + O', description: '打开现有工作簿' },
                    { shortcut: 'Ctrl + S', description: '保存工作簿' },
                    { shortcut: 'F2', description: '编辑活动单元格' },
                    { shortcut: 'F4', description: '重复上一个操作或绝对引用切换' },
                    { shortcut: 'Ctrl + 1', description: '打开设置单元格格式对话框' },
                    { shortcut: 'Ctrl + Arrow Key', description: '移动到数据区域的边缘' },
                    { shortcut: 'Shift + Space', description: '选择整行' },
                    { shortcut: 'Ctrl + Space', description: '选择整列' },
                    { shortcut: 'Alt + =', description: '自动求和' },
                    { shortcut: 'Ctrl + ;', description: '输入当前日期' },
                    { shortcut: 'Ctrl + Shift + :', description: '输入当前时间' }
                ],
                word: [
                    { shortcut: 'Ctrl + N', description: '新建文档' },
                    { shortcut: 'Ctrl + O', description: '打开现有文档' },
                    { shortcut: 'Ctrl + S', description: '保存文档' },
                    { shortcut: 'Ctrl + B', description: '文字加粗' },
                    { shortcut: 'Ctrl + I', description: '文字斜体' },
                    { shortcut: 'Ctrl + U', description: '文字下划线' },
                    { shortcut: 'Ctrl + ]', description: '增大字号' },
                    { shortcut: 'Ctrl + [', description: '减小字号' },
                    { shortcut: 'Ctrl + L', description: '左对齐文本' },
                    { shortcut: 'Ctrl + E', description: '居中对齐文本' },
                    { shortcut: 'Ctrl + R', description: '右对齐文本' },
                    { shortcut: 'Ctrl + J', description: '两端对齐文本' },
                    { shortcut: 'F7', description: '拼写和语法检查' }
                ],
                ppt: [
                    { shortcut: 'Ctrl + N', description: '新建演示文稿' },
                    { shortcut: 'Ctrl + M', description: '插入新幻灯片' },
                    { shortcut: 'Ctrl + D', description: '复制所选幻灯片' },
                    { shortcut: 'F5', description: '从头开始放映幻灯片' },
                    { shortcut: 'Shift + F5', description: '从当前幻灯片开始放映' },
                    { shortcut: 'Ctrl + Z', description: '撤销上一步操作' },
                    { shortcut: 'Ctrl + Y', description: '重做被撤销的操作' },
                    { shortcut: 'Ctrl + B', description: '应用或取消粗体格式' },
                    { shortcut: 'Ctrl + I', description: '应用或取消斜体格式' },
                    { shortcut: 'Ctrl + Enter', description: '在当前幻灯片后插入新幻灯片' },
                    { shortcut: 'Ctrl + Shift + C', description: '复制格式' },
                    { shortcut: 'Ctrl + Shift + V', description: '粘贴格式' }
                ],
                ps: [
                    { shortcut: 'Ctrl + N', description: '新建文档' },
                    { shortcut: 'Ctrl + O', description: '打开现有图像' },
                    { shortcut: 'Ctrl + S', description: '保存当前图像' },
                    { shortcut: 'Ctrl + Shift + S', description: '另存为' },
                    { shortcut: 'Ctrl + Z', description: '撤销上一步操作' },
                    { shortcut: 'Ctrl + Alt + Z', description: '逐步撤销多个操作' },
                    { shortcut: 'Ctrl + +', description: '放大图像' },
                    { shortcut: 'Ctrl + -', description: '缩小图像' },
                    { shortcut: 'Ctrl + T', description: '自由变换' },
                    { shortcut: 'Ctrl + J', description: '通过拷贝创建新图层' },
                    { shortcut: 'Ctrl + E', description: '合并所选图层' },
                    { shortcut: 'V', description: '移动工具' },
                    { shortcut: 'M', description: '矩形选框工具' },
                    { shortcut: 'L', description: '套索工具' }
                ],
                jianying: [
                    { shortcut: 'Ctrl + N', description: '新建项目' },
                    { shortcut: 'Ctrl + O', description: '打开现有项目' },
                    { shortcut: 'Ctrl + S', description: '保存项目' },
                    { shortcut: 'Ctrl + I', description: '导入媒体文件' },
                    { shortcut: 'Space', description: '播放/暂停预览' },
                    { shortcut: 'Ctrl + Z', description: '撤销上一步操作' },
                    { shortcut: 'Ctrl + Y', description: '重做被撤销的操作' },
                    { shortcut: 'Ctrl + X', description: '剪切选中的片段' },
                    { shortcut: 'Ctrl + C', description: '复制选中的片段' },
                    { shortcut: 'Ctrl + V', description: '粘贴剪贴板中的内容' },
                    { shortcut: 'Ctrl + B', description: '分割视频片段' },
                    { shortcut: 'Delete', description: '删除选中的片段' },
                    { shortcut: 'Ctrl + R', description: '替换素材' }
                ]
            };
            
            // 类别标题映射
            const categoryTitles = {
                windows: "Windows电脑快捷键",
                mac: "苹果电脑快捷键",
                excel: "Excel快捷键",
                word: "Word快捷键",
                ppt: "PPT快捷键",
                ps: "Photoshop快捷键",
                jianying: "剪映快捷键"
            };
            
            const selectElement = document.getElementById('shortcutCategory');
            const searchButton = document.getElementById('searchButton');
            const resultTitle = document.getElementById('resultTitle');
            const resultsBody = document.getElementById('shortcutResults');
            
            // 添加事件监听器
            searchButton.addEventListener('click', function() {
                const selectedCategory = selectElement.value;
                
                if (!selectedCategory) {
                    resultTitle.textContent = "请先选择一个类别";
                    resultsBody.innerHTML = "<tr><td colspan='2'>请从下拉菜单中选择一个快捷键类别</td></tr>";
                    return;
                }
                
                // 更新标题
                resultTitle.textContent = categoryTitles[selectedCategory];
                
                // 清空现有结果
                resultsBody.innerHTML = "";
                
                // 获取选定类别的快捷键数据
                const shortcuts = shortcutDatabase[selectedCategory];
                
                // 填充表格
                if (shortcuts && shortcuts.length > 0) {
                    shortcuts.forEach(function(item) {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td><strong>${item.shortcut}</strong></td>
                            <td>${item.description}</td>
                        `;
                        resultsBody.appendChild(row);
                    });
                } else {
                    resultsBody.innerHTML = "<tr><td colspan='2'>未找到相关快捷键数据</td></tr>";
                }
            });
        });
    </script>
</body>
</html>
