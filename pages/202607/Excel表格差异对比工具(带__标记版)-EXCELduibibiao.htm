<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel表格差异对比工具(带**标记版)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .upload-section {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .upload-box {
            border: 2px dashed #ccc;
            padding: 20px;
            width: 45%;
            min-width: 300px;
            margin-bottom: 20px;
        }
        .upload-box h3 {
            margin-top: 0;
        }
        .sheet-selector {
            margin: 20px 0;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .options {
            margin: 20px 0;
        }
        .status {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
        }
        .status.success {
            background-color: #dff0d8;
            color: #3c763d;
        }
        .status.error {
            background-color: #f2dede;
            color: #a94442;
        }
        .status.info {
            background-color: #d9edf7;
            color: #31708f;
        }
        .progress-container {
            margin: 20px 0;
            display: none;
        }
        progress {
            width: 100%;
            height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Excel表格差异对比工具(带**标记版)</h1>
        <p>此版本在输出差异数据时会将所在行所有数据输出，并将不同的部分单元格内容左右加**标记。</p>
        
        <div class="upload-section">
            <div class="upload-box">
                <h3>基准表</h3>
                <input type="file" id="baseFile" accept=".xlsx, .xls">
                <div id="baseFileName" class="file-name"></div>
                <div id="baseSheets" class="sheet-selector" style="display: none;">
                    <label for="baseSheetSelect">选择页签:</label>
                    <select id="baseSheetSelect"></select>
                </div>
            </div>
            
            <div class="upload-box">
                <h3>对比表</h3>
                <input type="file" id="compareFile" accept=".xlsx, .xls">
                <div id="compareFileName" class="file-name"></div>
                <div id="compareSheets" class="sheet-selector" style="display: none;">
                    <label for="compareSheetSelect">选择页签:</label>
                    <select id="compareSheetSelect"></select>
                </div>
            </div>
        </div>
        
        <div class="options">
            <label>
                <input type="radio" name="outputType" value="full" checked> 输出完整基准表(标记差异)
            </label>
            <label>
                <input type="radio" name="outputType" value="diff"> 仅输出差异数据(基准表数据)
            </label>
            <label>
                <input type="radio" name="outputType" value="diff-compare"> 仅输出差异数据(对比表数据)
            </label>
        </div>
        
        <div class="progress-container" id="progressContainer">
            <p>正在处理数据，请稍候...</p>
            <progress id="progressBar" value="0" max="100"></progress>
            <p id="progressText">0%</p>
        </div>
        
        <button id="compareBtn" disabled>开始对比并下载</button>
        
        <div id="status" class="status"></div>
    </div>

    <script>
        // 全局变量
        let baseWorkbook = null;
        let compareWorkbook = null;
        
        // DOM元素
        const baseFileInput = document.getElementById('baseFile');
        const compareFileInput = document.getElementById('compareFile');
        const baseFileName = document.getElementById('baseFileName');
        const compareFileName = document.getElementById('compareFileName');
        const baseSheetsDiv = document.getElementById('baseSheets');
        const compareSheetsDiv = document.getElementById('compareSheets');
        const baseSheetSelect = document.getElementById('baseSheetSelect');
        const compareSheetSelect = document.getElementById('compareSheetSelect');
        const compareBtn = document.getElementById('compareBtn');
        const statusDiv = document.getElementById('status');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        
        // 文件上传事件处理
        baseFileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            baseFileName.textContent = `已选择: ${file.name}`;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    baseWorkbook = XLSX.read(data, {type: 'array'});
                    
                    // 填充页签选择器
                    baseSheetSelect.innerHTML = '';
                    baseWorkbook.SheetNames.forEach(sheetName => {
                        const option = document.createElement('option');
                        option.value = sheetName;
                        option.textContent = sheetName;
                        baseSheetSelect.appendChild(option);
                    });
                    
                    baseSheetsDiv.style.display = 'block';
                    checkReadyState();
                } catch (error) {
                    showStatus(`解析基准表失败: ${error.message}`, 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        });
        
        compareFileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            compareFileName.textContent = `已选择: ${file.name}`;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    compareWorkbook = XLSX.read(data, {type: 'array'});
                    
                    // 填充页签选择器
                    compareSheetSelect.innerHTML = '';
                    compareWorkbook.SheetNames.forEach(sheetName => {
                        const option = document.createElement('option');
                        option.value = sheetName;
                        option.textContent = sheetName;
                        compareSheetSelect.appendChild(option);
                    });
                    
                    compareSheetsDiv.style.display = 'block';
                    checkReadyState();
                } catch (error) {
                    showStatus(`解析对比表失败: ${error.message}`, 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        });
        
        // 检查是否准备好对比
        function checkReadyState() {
            if (baseWorkbook && compareWorkbook && 
                baseSheetSelect.value && compareSheetSelect.value) {
                compareBtn.disabled = false;
            } else {
                compareBtn.disabled = true;
            }
        }
        
        // 页签选择变化事件
        baseSheetSelect.addEventListener('change', checkReadyState);
        compareSheetSelect.addEventListener('change', checkReadyState);
        
        // 对比按钮点击事件
        compareBtn.addEventListener('click', async function() {
            try {
                // 禁用按钮，防止重复点击
                compareBtn.disabled = true;
                
                // 显示进度条
                progressContainer.style.display = 'block';
                progressBar.value = 0;
                progressText.textContent = '0%';
                
                // 获取选中的页签数据
                const baseSheetName = baseSheetSelect.value;
                const compareSheetName = compareSheetSelect.value;
                
                showStatus('开始处理数据，请稍候...', 'info');
                
                // 使用setTimeout让UI有机会更新
                setTimeout(async () => {
                    try {
                        // 获取表格数据
                        const baseSheetData = XLSX.utils.sheet_to_json(
                            baseWorkbook.Sheets[baseSheetName], 
                            {header: 1, defval: ''}
                        );
                        
                        updateProgress(10);
                        
                        const compareSheetData = XLSX.utils.sheet_to_json(
                            compareWorkbook.Sheets[compareSheetName], 
                            {header: 1, defval: ''}
                        );
                        
                        updateProgress(20);
                        
                        // 对比数据
                        const result = await compareSheetsWithProgress(baseSheetData, compareSheetData);
                        
                        updateProgress(90);
                        
                        // 导出文件
                        const outputType = document.querySelector('input[name="outputType"]:checked').value;
                        let dataToExport = [];
                        let sheetName = '';
                        
                        if (outputType === 'full') {
                            dataToExport = result.baseDataWithDiff;
                            sheetName = `基准表(差异标记)_${baseSheetName}`;
                        } else if (outputType === 'diff') {
                            dataToExport = result.diffOnlyBaseWithStars;
                            sheetName = `差异数据(基准表)_${baseSheetName}`;
                        } else if (outputType === 'diff-compare') {
                            dataToExport = result.diffOnlyCompareWithStars;
                            sheetName = `差异数据(对比表)_${compareSheetName}`;
                        }
                        
                        // 创建工作簿
                        const wb = XLSX.utils.book_new();
                        const ws = XLSX.utils.aoa_to_sheet(dataToExport);
                        XLSX.utils.book_append_sheet(wb, ws, sheetName);
                        
                        updateProgress(95);
                        
                        // 导出文件
                        const fileName = `对比结果_${new Date().toISOString().slice(0, 10)}.xlsx`;
                        XLSX.writeFile(wb, fileName);
                        
                        updateProgress(100);
                        
                        showStatus('对比完成，文件下载已开始!', 'success');
                    } catch (error) {
                        showStatus(`对比过程中出错: ${error.message}`, 'error');
                    } finally {
                        // 重新启用按钮
                        compareBtn.disabled = false;
                        progressContainer.style.display = 'none';
                    }
                }, 100);
            } catch (error) {
                showStatus(`初始化对比时出错: ${error.message}`, 'error');
                compareBtn.disabled = false;
                progressContainer.style.display = 'none';
            }
        });
        
        // 带进度更新的对比函数
        function compareSheetsWithProgress(baseData, compareData) {
            return new Promise((resolve) => {
                // 使用setTimeout分割任务，避免UI阻塞
                setTimeout(() => {
                    const result = {
                        baseDataWithDiff: [],          // 带差异标记的基准表数据
                        diffOnlyBase: [],              // 仅差异数据(基准表)
                        diffOnlyCompare: [],           // 仅差异数据(对比表)
                        diffOnlyBaseWithStars: [],     // 带**标记的差异数据(基准表)
                        diffOnlyCompareWithStars: [],  // 带**标记的差异数据(对比表)
                        diffCells: []                  // 记录所有差异单元格
                    };
                    
                    // 确保数据是二维数组
                    if (!Array.isArray(baseData) || !Array.isArray(compareData)) {
                        throw new Error('表格数据格式不正确');
                    }
                    
                    // 获取最大行数和列数
                    const maxRows = Math.max(baseData.length, compareData.length);
                    let maxCols = 0;
                    for (let i = 0; i < maxRows; i++) {
                        const baseRow = baseData[i] || [];
                        const compareRow = compareData[i] || [];
                        maxCols = Math.max(maxCols, baseRow.length, compareRow.length);
                    }
                    
                    // 处理表头
                    const baseHeader = baseData[0] || [];
                    const compareHeader = compareData[0] || [];
                    const headerRow = [];
                    
                    for (let j = 0; j < maxCols; j++) {
                        const baseHeaderCell = baseHeader[j] || '';
                        const compareHeaderCell = compareHeader[j] || '';
                        
                        if (baseHeaderCell === compareHeaderCell) {
                            headerRow.push(baseHeaderCell);
                        } else {
                            headerRow.push(`${baseHeaderCell} → ${compareHeaderCell}`);
                            result.diffCells.push({row: 0, col: j});
                        }
                    }
                    
                    result.baseDataWithDiff.push(headerRow);
                    result.diffOnlyBase.push(headerRow);
                    result.diffOnlyCompare.push(headerRow);
                    result.diffOnlyBaseWithStars.push(headerRow);
                    result.diffOnlyCompareWithStars.push(headerRow);
                    
                    updateProgress(30);
                    
                    // 处理数据行 - 分批次处理以避免阻塞
                    const batchSize = 100; // 每批处理100行
                    let currentRow = 1;
                    
                    function processBatch() {
                        const endRow = Math.min(currentRow + batchSize, maxRows);
                        
                        for (; currentRow < endRow; currentRow++) {
                            const baseRow = baseData[currentRow] || [];
                            const compareRow = compareData[currentRow] || [];
                            const baseRowWithDiff = [];
                            const diffOnlyBaseRow = [];
                            const diffOnlyCompareRow = [];
                            const diffOnlyBaseRowWithStars = [];
                            const diffOnlyCompareRowWithStars = [];
                            let hasDiffInRow = false;
                            
                            for (let j = 0; j < maxCols; j++) {
                                const baseCell = baseRow[j] || '';
                                const compareCell = compareRow[j] || '';
                                
                                if (baseCell === compareCell) {
                                    baseRowWithDiff.push(baseCell);
                                    diffOnlyBaseRow.push(baseCell);
                                    diffOnlyCompareRow.push(compareCell);
                                } else {
                                    // 标记差异
                                    baseRowWithDiff.push({
                                        value: `${baseCell} → ${compareCell}`,
                                        isDiff: true
                                    });
                                    
                                    // 原始差异数据
                                    diffOnlyBaseRow.push(baseCell);
                                    diffOnlyCompareRow.push(compareCell);
                                    
                                    // 带**标记的差异数据
                                    diffOnlyBaseRowWithStars.push(`**${baseCell}**`);
                                    diffOnlyCompareRowWithStars.push(`**${compareCell}**`);
                                    
                                    result.diffCells.push({row: currentRow, col: j});
                                    hasDiffInRow = true;
                                }
                            }
                            
                            // 添加到结果中
                            result.baseDataWithDiff.push(baseRowWithDiff);
                            
                            // 如果有差异，添加到仅差异结果中
                            if (hasDiffInRow) {
                                result.diffOnlyBase.push(diffOnlyBaseRow);
                                result.diffOnlyCompare.push(diffOnlyCompareRow);
                                
                                // 对于带**标记的版本，需要输出整行数据，但只标记差异部分
                                const fullBaseRowWithStars = [];
                                const fullCompareRowWithStars = [];
                                
                                for (let j = 0; j < maxCols; j++) {
                                    const isDiffCell = result.diffCells.some(
                                        diff => diff.row === currentRow && diff.col === j
                                    );
                                    
                                    const baseCell = baseRow[j] || '';
                                    const compareCell = compareRow[j] || '';
                                    
                                    if (isDiffCell) {
                                        fullBaseRowWithStars.push(`**${baseCell}**`);
                                        fullCompareRowWithStars.push(`**${compareCell}**`);
                                    } else {
                                        fullBaseRowWithStars.push(baseCell);
                                        fullCompareRowWithStars.push(compareCell);
                                    }
                                }
                                
                                result.diffOnlyBaseWithStars.push(fullBaseRowWithStars);
                                result.diffOnlyCompareWithStars.push(fullCompareRowWithStars);
                            }
                            
                            // 更新进度
                            if (currentRow % 10 === 0) {
                                const progress = 30 + (currentRow / maxRows * 60);
                                updateProgress(progress);
                            }
                        }
                        
                        if (currentRow < maxRows) {
                            // 继续处理下一批
                            setTimeout(processBatch, 0);
                        } else {
                            // 处理完成
                            updateProgress(90);
                            resolve(result);
                        }
                    }
                    
                    // 开始分批处理
                    setTimeout(processBatch, 0);
                }, 0);
            });
        }
        
        // 更新进度条
        function updateProgress(percent) {
            progressBar.value = percent;
            progressText.textContent = `${Math.round(percent)}%`;
        }
        
        // 显示状态信息
        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }
    </script>
</body>
</html>
