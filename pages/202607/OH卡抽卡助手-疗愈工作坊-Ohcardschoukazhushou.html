<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OH卡抽卡助手 - 疗愈工作坊</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e6e6e6;
            position: relative;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px 20px;
            background: rgba(26, 26, 46, 0.7);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(92, 107, 192, 0.2) 0%, transparent 70%);
            transform: rotate(0deg);
            animation: rotate 30s linear infinite;
            pointer-events: none;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        h1 {
            color: #8a8dff;
            font-size: 2.8rem;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(138, 141, 255, 0.5);
            position: relative;
            letter-spacing: 2px;
        }
        
        .subtitle {
            color: #a0a0c0;
            font-size: 1.2rem;
            position: relative;
        }
        
        .card-type-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 25px 0;
        }
        
        .card-type-btn {
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(138, 141, 255, 0.3);
            color: #e6e6e6;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .card-type-btn.active {
            background: linear-gradient(to right, #667eea, #764ba2);
            box-shadow: 0 0 20px rgba(118, 75, 162, 0.5);
            border-color: #8a8dff;
        }
        
        .card-type-btn:hover:not(.active) {
            background: rgba(138, 141, 255, 0.2);
            transform: translateY(-3px);
        }
        
        .main-content {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .card-section {
            flex: 1;
            min-width: 300px;
            background: rgba(26, 26, 46, 0.7);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .section-title {
            color: #8a8dff;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(138, 141, 255, 0.3);
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .card-display {
            text-align: center;
            margin: 20px 0;
            min-height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            position: relative;
            overflow: hidden;
        }
        
        .card-display::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, transparent 30%, rgba(0, 0, 0, 0.5) 100%);
            pointer-events: none;
        }
        
        .card-image {
            max-width: 100%;
            max-height: 350px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            transition: transform 0.5s ease, box-shadow 0.5s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .card-image:hover {
            transform: scale(1.03) rotate(1deg);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
        }
        
        .word-card {
            font-size: 3.5rem;
            font-weight: bold;
            color: #8a8dff;
            text-shadow: 0 0 15px rgba(138, 141, 255, 0.5);
            padding: 20px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            transition: all 0.5s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 200px;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .word-card:hover {
            transform: scale(1.03);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
        }
        
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }
        
        .random-draw {
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 16px 25px;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .random-draw:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(118, 75, 162, 0.6);
        }
        
        .random-draw:active {
            transform: translateY(1px);
        }
        
        .specific-draw {
            display: flex;
            gap: 10px;
        }
        
        .card-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid rgba(138, 141, 255, 0.3);
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
            background: rgba(255, 255, 255, 0.1);
            color: #e6e6e6;
        }
        
        .card-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
        }
        
        .draw-btn {
            background: linear-gradient(to right, #4caf50, #2e7d32);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .draw-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(46, 125, 50, 0.4);
        }
        
        .history-section {
            background: rgba(26, 26, 46, 0.7);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .history-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .history-item {
            position: relative;
            cursor: pointer;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .history-item:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 20px rgba(138, 141, 255, 0.3);
            z-index: 1;
        }
        
        .history-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }
        
        .history-word {
            width: 100%;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            font-size: 1.5rem;
            font-weight: bold;
            color: #8a8dff;
        }
        
        .card-number {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px;
            text-align: center;
            font-size: 0.9rem;
        }
        
        .card-custom-name {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: #8a8dff;
            padding: 5px;
            text-align: center;
            font-size: 0.8rem;
            max-height: 40px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .clear-history {
            background: linear-gradient(to right, #ff5252, #b33939);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }
        
        .clear-history:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(179, 57, 57, 0.4);
        }
        
        .shuffle-animation {
            animation: shuffle 0.5s infinite;
        }
        
        @keyframes shuffle {
            0% { transform: translateX(0) rotate(0deg); }
            25% { transform: translateX(-10px) rotate(-5deg); }
            50% { transform: translateX(10px) rotate(5deg); }
            75% { transform: translateX(-5px) rotate(-2deg); }
            100% { transform: translateX(0) rotate(0deg); }
        }
        
        .card-counter {
            text-align: center;
            margin-top: 10px;
            font-size: 1.2rem;
            color: #8a8dff;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .empty-history {
            text-align: center;
            padding: 30px;
            color: #a0a0c0;
            font-style: italic;
            grid-column: 1 / -1;
        }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #a0a0c0;
            font-size: 0.9rem;
            line-height: 1.6;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .card-info {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            font-size: 0.9rem;
            color: #a0a0c0;
        }
        
        /* 自定义弹框样式 */
        .custom-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(138, 141, 255, 0.3);
            text-align: center;
            position: relative;
            animation: modalAppear 0.3s ease-out;
        }
        
        @keyframes modalAppear {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .modal-icon {
            font-size: 4rem;
            color: #4caf50;
            margin-bottom: 20px;
        }
        
        .modal-title {
            color: #8a8dff;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }
        
        .modal-message {
            color: #e6e6e6;
            font-size: 1.1rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        
        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        
        .modal-btn {
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .modal-confirm {
            background: linear-gradient(to right, #4caf50, #2e7d32);
            color: white;
        }
        
        .modal-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: #e6e6e6;
            border: 1px solid rgba(138, 141, 255, 0.3);
        }
        
        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .toast-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(to right, #4caf50, #2e7d32);
            color: white;
            padding: 15px 25px;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1001;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .toast-notification.show {
            opacity: 1;
        }
        
        /* 重命名弹框样式 */
        .rename-modal .modal-content {
            max-width: 500px;
        }
        
        .rename-input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid rgba(138, 141, 255, 0.3);
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
            background: rgba(255, 255, 255, 0.1);
            color: #e6e6e6;
            margin-bottom: 20px;
        }
        
        .rename-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
        }
        
        .rename-preview {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .rename-preview-image {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
        }
        
        .rename-preview-word {
            font-size: 1.5rem;
            font-weight: bold;
            color: #8a8dff;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
        }
        
        .rename-preview-info {
            text-align: left;
            flex: 1;
        }
        
        .rename-preview-info div {
            margin-bottom: 5px;
        }
        
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .card-type-selector {
                flex-direction: column;
                align-items: center;
            }
            
            .card-type-btn {
                width: 100%;
                justify-content: center;
            }
            
            .specific-draw {
                flex-direction: column;
            }
            
            .history-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
            
            .word-card {
                font-size: 2.5rem;
                min-height: 150px;
            }
            
            .modal-buttons {
                flex-direction: column;
            }
            
            .rename-preview {
                flex-direction: column;
                text-align: center;
            }
            
            .rename-preview-info {
                text-align: center;
            }
        }
        
        .card-type-indicator {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-left: 10px;
            background: rgba(138, 141, 255, 0.2);
            color: #8a8dff;
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(138, 141, 255, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(138, 141, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(138, 141, 255, 0); }
        }
        
        .history-item-menu {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            width: 25px;
            height: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            cursor: pointer;
            z-index: 2;
        }
        
        .history-item:hover .history-item-menu {
            opacity: 1;
        }
        
        .history-item-menu i {
            font-size: 0.8rem;
            color: #8a8dff;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-cards"></i> Oh-cards 抽卡助手</h1>
            <p class="subtitle">以卡为镜，探索潜意识与内在智慧</p>
            
            <div class="card-type-selector">
                <button id="image-cards-btn" class="card-type-btn active">
                    <i class="fas fa-image"></i> 图卡抽取
                </button>
                <button id="word-cards-btn" class="card-type-btn">
                    <i class="fas fa-font"></i> 字卡抽取
                </button>
            </div>
        </header>
        
        <div class="main-content">
            <div class="card-section">
                <h2 class="section-title">
                    <i class="fas fa-star"></i> 卡片抽取
                    <span id="card-type-indicator" class="card-type-indicator">图卡</span>
                </h2>
                
                <div class="card-display">
                    <img id="current-card" class="card-image" src="https://via.placeholder.com/300x450/1a1a2e/8a8dff?text=选择卡片类型+开始抽卡" alt="当前卡片">
                    <div id="current-word" class="word-card" style="display: none;"></div>
                </div>
                
                <div class="card-counter">
                    <i class="fas fa-layer-group"></i> 已抽取: <span id="draw-count">0</span> 张卡片
                </div>
                
                <div class="card-info">
                    <i class="fas fa-info-circle"></i> 当前模式: <span id="current-mode">图卡</span> | 总数: <span id="total-cards">88</span> 张
                </div>
                
                <div class="controls">
                    <button id="random-draw" class="random-draw pulse">
                        <i class="fas fa-random"></i> 随机抽取卡片
                    </button>
                    
                    <div class="specific-draw">
                        <input type="number" id="card-number" class="card-input" placeholder="输入卡片编号 (1-88)" min="1" max="88">
                        <button id="specific-draw" class="draw-btn">
                            <i class="fas fa-search"></i> 抽取指定卡片
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="history-section">
                <h2 class="section-title"><i class="fas fa-history"></i> 抽卡历史记录</h2>
                <div id="history-container" class="history-grid">
                    <div class="empty-history">暂无抽卡记录</div>
                </div>
                <button id="clear-history" class="clear-history">
                    <i class="fas fa-trash"></i> 清空历史记录
                </button>
            </div>
        </div>
        
        <div class="footer">
            <p>本工具由木棉制作</p>
            <p>微信: ping3173</p>
            <p>QQ邮箱: <a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="90a7a5a2a0a7a5a7a6a9d0e1e1bef3fffd">[email&#160;protected]</a></p>
        </div>
    </div>

    <!-- 确认清空弹框 -->
    <div id="confirm-modal" class="custom-modal">
        <div class="modal-content">
            <div class="modal-icon">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h2 class="modal-title">确认操作</h2>
            <p class="modal-message">确定要清空所有抽卡历史记录吗？此操作不可撤销。</p>
            <div class="modal-buttons">
                <button id="modal-cancel" class="modal-btn modal-cancel">
                    <i class="fas fa-times"></i> 取消
                </button>
                <button id="modal-confirm" class="modal-btn modal-confirm">
                    <i class="fas fa-check"></i> 确认清空
                </button>
            </div>
        </div>
    </div>

    <!-- 重命名弹框 -->
    <div id="rename-modal" class="custom-modal rename-modal">
        <div class="modal-content">
            <div class="modal-icon">
                <i class="fas fa-edit"></i>
            </div>
            <h2 class="modal-title">重命名卡片</h2>
            <div class="rename-preview" id="rename-preview">
                <!-- 预览内容将通过JavaScript动态生成 -->
            </div>
            <input type="text" id="rename-input" class="rename-input" placeholder="输入卡片自定义名称（最多20个字符）" maxlength="20">
            <div class="modal-buttons">
                <button id="rename-cancel" class="modal-btn modal-cancel">
                    <i class="fas fa-times"></i> 取消
                </button>
                <button id="rename-confirm" class="modal-btn modal-confirm">
                    <i class="fas fa-check"></i> 确认重命名
                </button>
            </div>
        </div>
    </div>

    <!-- 操作成功提示 -->
    <div id="toast" class="toast-notification">
        <i class="fas fa-check-circle"></i>
        <span id="toast-message">操作成功</span>
    </div>

        const cardSets = {

            },
            wordCards: {

            }

        // 字卡文字内容（完整88个）
        const wordCardContents = [
            "喜悦", "循环", "孩童", "成功", "开始", "夸赞", "躲藏", "姿态",
            "消除", "母亲", "家", "弄巧成拙", "陌生人", "抗拒", "憎恨", "依赖",
            "聪明", "道歉", "孤独", "哀伤", "丢脸", "前进", "色情", "危险",
            "上司", "父亲", "丑陋", "受害者", "憎恶", "厌烦", "犹豫", "退省",
            "不喜欢", "恐惧", "希望", "男性", "破坏", "女人", "压抑", "幻想",
            "感情", "痛苦", "同性恋", "固执", "腐朽", "罪恶感", "混乱", "奴隶",
            "疲惫", "强迫", "顺应", "专家", "威胁", "谎言", "敌对", "羞愧",
            "尴尬", "放开", "奇妙", "改变", "违背", "亏欠", "坚定", "执着",
            "习惯", "失败", "错误", "付出", "生气", "焦虑", "权利游戏", "欢笑",
            "攻击", "吸引", "愚蠢", "诙谐", "攫取", "恐吓", "裸体", "梦想",
            "游戏", "停止", "等候", "分享", "外表", "爱情", "羞辱", "应该"
        ];
        
        // 当前选中的卡片类型
        let currentCardType = "imageCards";
        
        // DOM元素
        const currentCardElement = document.getElementById('current-card');
        const currentWordElement = document.getElementById('current-word');
        const randomDrawButton = document.getElementById('random-draw');
        const specificDrawButton = document.getElementById('specific-draw');
        const cardNumberInput = document.getElementById('card-number');
        const historyContainer = document.getElementById('history-container');
        const clearHistoryButton = document.getElementById('clear-history');
        const drawCountElement = document.getElementById('draw-count');
        const imageCardsBtn = document.getElementById('image-cards-btn');
        const wordCardsBtn = document.getElementById('word-cards-btn');
        const cardTypeIndicator = document.getElementById('card-type-indicator');
        const currentModeElement = document.getElementById('current-mode');
        const totalCardsElement = document.getElementById('total-cards');
        
        // 弹框相关元素
        const confirmModal = document.getElementById('confirm-modal');
        const modalCancel = document.getElementById('modal-cancel');
        const modalConfirm = document.getElementById('modal-confirm');
        const renameModal = document.getElementById('rename-modal');
        const renameCancel = document.getElementById('rename-cancel');
        const renameConfirm = document.getElementById('rename-confirm');
        const renameInput = document.getElementById('rename-input');
        const renamePreview = document.getElementById('rename-preview');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');
        
        // 当前正在重命名的卡片
        let currentRenamingCard = null;
        
        // 抽卡历史记录
        let drawHistory = JSON.parse(localStorage.getItem('ohCardHistory')) || [];
        let drawCount = drawHistory.length;
        
        // 初始化显示
        updateDrawCount();
        renderHistory();
        updateCardTypeUI();
        
        // 卡片类型切换
        imageCardsBtn.addEventListener('click', () => {
            currentCardType = "imageCards";
            updateCardTypeUI();
        });
        
        wordCardsBtn.addEventListener('click', () => {
            currentCardType = "wordCards";
            updateCardTypeUI();
        });
        
        function updateCardTypeUI() {
            // 更新按钮状态
            imageCardsBtn.classList.toggle('active', currentCardType === "imageCards");
            wordCardsBtn.classList.toggle('active', currentCardType === "wordCards");
            
            // 更新指示器
            cardTypeIndicator.textContent = cardSets[currentCardType].name;
            currentModeElement.textContent = cardSets[currentCardType].name;
            totalCardsElement.textContent = cardSets[currentCardType].count;
            
            // 更新输入框的max属性
            cardNumberInput.max = cardSets[currentCardType].count;
            cardNumberInput.placeholder = `输入卡片编号 (1-${cardSets[currentCardType].count})`;
            
            // 重置当前显示的卡片
            if (currentCardType === "imageCards") {
                currentCardElement.style.display = "block";
                currentWordElement.style.display = "none";
                currentCardElement.src = cardSets[currentCardType].placeholder + "1";
                currentCardElement.alt = `准备抽取${cardSets[currentCardType].name}`;
            } else {
                currentCardElement.style.display = "none";
                currentWordElement.style.display = "flex";
                currentWordElement.textContent = "准备抽取字卡";
            }
        }
        
        // 生成卡片URL
        function getCardUrl(index, type) {
            const cardSet = cardSets[type];
            const cardNumber = index + 1;
            
            // 尝试使用真实图片，如果失败则使用占位图
            const realUrl = `${cardSet.baseUrl}${cardNumber}.jpg`;
            
            return realUrl;
        }
        
        // 随机抽卡
        randomDrawButton.addEventListener('click', () => {
            // 防止重复点击
            if (randomDrawButton.disabled) return;
            
            // 添加洗牌动画
            if (currentCardType === "imageCards") {
                currentCardElement.classList.add('shuffle-animation');
            } else {
                currentWordElement.classList.add('shuffle-animation');
            }
            randomDrawButton.disabled = true;
            
            // 模拟洗牌过程
            const shuffleDuration = 1500 + Math.random() * 1500;
            let shuffleCount = 0;
            const maxShuffle = 8 + Math.floor(Math.random() * 8);
            
            const shuffleInterval = setInterval(() => {
                const randomIndex = Math.floor(Math.random() * cardSets[currentCardType].count);
                
                if (currentCardType === "imageCards") {
                    currentCardElement.src = getCardUrl(randomIndex, currentCardType);
                    currentCardElement.alt = `${cardSets[currentCardType].name} ${randomIndex + 1}`;
                } else {
                    currentWordElement.textContent = wordCardContents[randomIndex];
                }
                
                shuffleCount++;
                if (shuffleCount >= maxShuffle) {
                    clearInterval(shuffleInterval);
                    
                    // 最终卡片选择
                    const finalIndex = Math.floor(Math.random() * cardSets[currentCardType].count);
                    
                    // 直接显示最终卡片
                    setTimeout(() => {
                        if (currentCardType === "imageCards") {
                            currentCardElement.src = getCardUrl(finalIndex, currentCardType);
                            currentCardElement.alt = `${cardSets[currentCardType].name} ${finalIndex + 1}`;
                            currentCardElement.classList.remove('shuffle-animation');
                        } else {
                            currentWordElement.textContent = wordCardContents[finalIndex];
                            currentWordElement.classList.remove('shuffle-animation');
                        }
                        randomDrawButton.disabled = false;
                        
                        // 添加到历史记录
                        addToHistory(finalIndex);
                    }, 300);
                }
            }, 200);
        });
        
        // 指定编号抽卡
        specificDrawButton.addEventListener('click', () => {
            const cardNumber = parseInt(cardNumberInput.value);
            const maxCardNumber = cardSets[currentCardType].count;
            
            if (isNaN(cardNumber) || cardNumber < 1 || cardNumber > maxCardNumber) {
                showToast(`请输入有效的卡片编号 (1-${maxCardNumber})`, 'error');
                return;
            }
            
            showCard(cardNumber - 1);
        });
        
        // 显示卡片
        function showCard(index) {
            if (currentCardType === "imageCards") {
                currentCardElement.src = getCardUrl(index, currentCardType);
                currentCardElement.alt = `${cardSets[currentCardType].name} ${index + 1}`;
            } else {
                currentWordElement.textContent = wordCardContents[index];
            }
            
            // 添加到历史记录
            addToHistory(index);
        }
        
        // 添加到历史记录
        function addToHistory(index) {
            const cardData = {
                id: Date.now(),
                index: index,
                number: index + 1,
                type: currentCardType,
                typeName: cardSets[currentCardType].name,
                timestamp: new Date().toLocaleString(),
                customName: "" // 添加自定义名称字段
            };
            
            // 检查是否已存在相同卡片，避免重复
            const exists = drawHistory.some(card => 
                card.index === index && card.type === currentCardType
            );
            
            if (!exists) {
                drawHistory.unshift(cardData);
                if (drawHistory.length > 20) {
                    drawHistory.pop();
                }
                
                saveHistory();
                renderHistory();
                updateDrawCount();
                
                showToast(`成功抽取${cardSets[currentCardType].name} #${index + 1}`, 'success');
            }
        }
        
        // 保存历史记录到localStorage
        function saveHistory() {
            localStorage.setItem('ohCardHistory', JSON.stringify(drawHistory));
        }
        
        // 渲染历史记录
        function renderHistory() {
            if (drawHistory.length === 0) {
                historyContainer.innerHTML = '<div class="empty-history">暂无抽卡记录</div>';
                return;
            }
            
            historyContainer.innerHTML = '';
            drawHistory.forEach(card => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                
                // 添加菜单按钮
                const menuButton = document.createElement('div');
                menuButton.className = 'history-item-menu';
                menuButton.innerHTML = '<i class="fas fa-edit"></i>';
                menuButton.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openRenameModal(card);
                });
                
                if (card.type === "imageCards") {
                    historyItem.innerHTML = `
                        <img src="${getCardUrl(card.index, card.type)}" alt="${card.typeName} ${card.number}" class="history-image">
                        ${card.customName ? `<div class="card-custom-name">${card.customName}</div>` : ''}
                        <div class="card-number">${card.typeName} #${card.number}</div>
                    `;
                } else {
                    historyItem.innerHTML = `
                        <div class="history-word">${wordCardContents[card.index]}</div>
                        ${card.customName ? `<div class="card-custom-name">${card.customName}</div>` : ''}
                        <div class="card-number">${card.typeName} #${card.number}</div>
                    `;
                }
                
                historyItem.appendChild(menuButton);
                
                // 点击历史记录只显示卡片，不添加到历史记录
                historyItem.addEventListener('click', (e) => {
                    if (e.target.classList.contains('history-item-menu')) return;
                    
                    // 切换到对应卡片类型
                    if (currentCardType !== card.type) {
                        currentCardType = card.type;
                        updateCardTypeUI();
                    }
                    
                    // 直接显示卡片，不添加到历史记录
                    if (card.type === "imageCards") {
                        currentCardElement.src = getCardUrl(card.index, card.type);
                        currentCardElement.alt = `${card.typeName} ${card.number}`;
                    } else {
                        currentWordElement.textContent = wordCardContents[card.index];
                    }
                });
                
                historyContainer.appendChild(historyItem);
            });
        }
        
        // 打开重命名弹框
        function openRenameModal(card) {
            currentRenamingCard = card;
            
            // 设置预览内容
            if (card.type === "imageCards") {
                renamePreview.innerHTML = `
                    <img src="${getCardUrl(card.index, card.type)}" alt="${card.typeName} ${card.number}" class="rename-preview-image">
                    <div class="rename-preview-info">
                        <div><strong>${card.typeName} #${card.number}</strong></div>
                        <div>${card.customName ? `当前名称: ${card.customName}` : '尚未命名'}</div>
                    </div>
                `;
            } else {
                renamePreview.innerHTML = `
                    <div class="rename-preview-word">${wordCardContents[card.index]}</div>
                    <div class="rename-preview-info">
                        <div><strong>${card.typeName} #${card.number}</strong></div>
                        <div>${card.customName ? `当前名称: ${card.customName}` : '尚未命名'}</div>
                    </div>
                `;
            }
            
            // 设置输入框的值
            renameInput.value = card.customName || '';
            
            // 显示弹框
            renameModal.style.display = 'flex';
            renameInput.focus();
        }
        
        // 确认重命名
        renameConfirm.addEventListener('click', () => {
            if (currentRenamingCard) {
                const newName = renameInput.value.trim();
                
                // 更新卡片的自定义名称
                currentRenamingCard.customName = newName;
                
                // 保存到本地存储
                saveHistory();
                
                // 重新渲染历史记录
                renderHistory();
                
                // 关闭弹框
                renameModal.style.display = 'none';
                
                // 显示成功提示
                showToast(newName ? '卡片重命名成功' : '已移除卡片名称', 'success');
            }
        });
        
        // 取消重命名
        renameCancel.addEventListener('click', () => {
            renameModal.style.display = 'none';
        });
        
        // 点击弹框外部关闭
        renameModal.addEventListener('click', (e) => {
            if (e.target === renameModal) {
                renameModal.style.display = 'none';
            }
        });
        
        // 按Enter键确认重命名
        renameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                renameConfirm.click();
            }
        });
        
        // 更新抽卡计数
        function updateDrawCount() {
            drawCount = drawHistory.length;
            drawCountElement.textContent = drawCount;
        }
        
        // 显示确认弹框
        clearHistoryButton.addEventListener('click', () => {
            if (drawHistory.length === 0) {
                showToast('历史记录已经是空的', 'info');
                return;
            }
            
            confirmModal.style.display = 'flex';
        });
        
        // 确认清空历史记录
        modalConfirm.addEventListener('click', () => {
            drawHistory = [];
            saveHistory();
            renderHistory();
            updateDrawCount();
            confirmModal.style.display = 'none';
            showToast('历史记录已清空', 'success');
        });
        
        // 取消清空历史记录
        modalCancel.addEventListener('click', () => {
            confirmModal.style.display = 'none';
        });
        
        // 点击弹框外部关闭
        confirmModal.addEventListener('click', (e) => {
            if (e.target === confirmModal) {
                confirmModal.style.display = 'none';
            }
        });
        
        // 显示提示消息
        function showToast(message, type = 'success') {
            toastMessage.textContent = message;
            
            // 根据类型设置不同的样式
            if (type === 'error') {
                toast.style.background = 'linear-gradient(to right, #ff5252, #b33939)';
            } else if (type === 'info') {
                toast.style.background = 'linear-gradient(to right, #2196F3, #0D47A1)';
            } else {
                toast.style.background = 'linear-gradient(to right, #4caf50, #2e7d32)';
            }
            
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
        
        // 支持按Enter键进行指定抽卡
        cardNumberInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                specificDrawButton.click();
            }
        });
        
        // 添加初始化动画
        setTimeout(() => {
            document.querySelector('header').style.opacity = 1;
            document.querySelector('.main-content').style.opacity = 1;
        }, 300);
        
        // 图片加载错误处理
        currentCardElement.addEventListener('error', function() {
            // 如果真实图片加载失败，使用占位图
            const cardSet = cardSets[currentCardType];
            const currentSrc = this.src;
            const cardNumberMatch = currentSrc.match(/(\d+)\.jpg$/);
            
            if (cardNumberMatch) {
                const cardNumber = cardNumberMatch[1];
                this.src = cardSet.placeholder + cardNumber;
            }
        });
        
        // 为历史记录中的图片也添加错误处理
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('history-image')) {
                e.target.addEventListener('error', function() {
                    const parent = this.closest('.history-item');
                    if (parent) {
                        const cardNumber = parent.querySelector('.card-number').textContent.match(/#(\d+)/)[1];
                        const cardType = parent.querySelector('.card-number').textContent.includes('图卡') ? 'imageCards' : 'wordCards';
                        this.src = cardSets[cardType].placeholder + cardNumber;
                    }
                });
            }
        });
    </script>
</body>
</html>
