<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文本统计工具 - 工具站</title>
    <meta
      name="description"
      content="在线文本统计工具，统计字符数、单词数、行数、段落数等信息"
    />
    <meta name="keywords" content="文本统计,字符统计,单词统计,AI工具" />

    <!-- 内联样式 - 包含common.css, theme.css和工具特定样式 -->
    <style>
      /* ==========================================================================
         通用样式 - AI工具集共享CSS库
         ========================================================================== */

      /* CSS自定义属性 - 设计系统变量 */
      :root {
        /* 主色调 */
        --primary-color: #6a7bff;
        --primary-color-light: #7a9eff;
        --primary-color-dark: #5a6bef;
        --primary-color-alpha: rgba(106, 123, 255, 0.1);
        
        --secondary-color: #9b8aff;
        --secondary-color-light: #ab9aff;
        --secondary-color-dark: #8b7aef;
        
        --accent-color: linear-gradient(135deg, #7a9eff 0%, #9b8aff 100%);
        --success-color: #10b981;
        --warning-color: #f59e0b;
        --error-color: #ef4444;
        
        /* 背景色 */
        --bg-primary: #ffffff;
        --bg-secondary: #f8fafc;
        --bg-tertiary: #f1f5f9;
        --card-bg: #ffffff;
        --input-bg: #ffffff;
        --code-bg: #f8fafc;
        
        /* 文字颜色 */
        --text-primary: #1e293b;
        --text-secondary: #64748b;
        --text-tertiary: #94a3b8;
        --text-inverse: #ffffff;
        
        /* 边框和分割线 */
        --border-color: #e2e8f0;
        --border-color-light: #f1f5f9;
        --border-color-dark: #cbd5e1;
        
        /* 阴影 */
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        
        /* 圆角 */
        --border-radius: 8px;
        --border-radius-sm: 4px;
        --border-radius-lg: 12px;
        --border-radius-xl: 16px;
        --border-radius-full: 9999px;
        
        /* 间距 */
        --spacing-xs: 0.25rem;
        --spacing-sm: 0.5rem;
        --spacing-md: 1rem;
        --spacing-lg: 1.5rem;
        --spacing-xl: 2rem;
        --spacing-2xl: 3rem;
        
        /* 动画 */
        --transition-fast: 0.15s ease;
        --transition-normal: 0.2s ease;
        --transition-slow: 0.3s ease;
        
        /* 字体 */
        --font-family-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-family-mono: 'Fira Code', 'Consolas', 'Monaco', 'Courier New', monospace;
        
        /* 字体大小 */
        --font-size-xs: 0.75rem;
        --font-size-sm: 0.875rem;
        --font-size-base: 1rem;
        --font-size-lg: 1.125rem;
        --font-size-xl: 1.25rem;
        --font-size-2xl: 1.5rem;
        --font-size-3xl: 1.875rem;
        --font-size-4xl: 2.25rem;
        
        /* 行高 */
        --line-height-tight: 1.25;
        --line-height-normal: 1.5;
        --line-height-relaxed: 1.75;
        
        /* Z-index层级 */
        --z-dropdown: 1000;
        --z-sticky: 1020;
        --z-fixed: 1030;
        --z-modal: 1040;
        --z-popover: 1050;
        --z-tooltip: 1060;
      }

      /* 暗色主题 */
      [data-theme="dark"] {
        --bg-primary: #0f172a;
        --bg-secondary: #1e293b;
        --bg-tertiary: #334155;
        --card-bg: #1e293b;
        --input-bg: #334155;
        --code-bg: #1e293b;
        
        --text-primary: #f8fafc;
        --text-secondary: #cbd5e1;
        --text-tertiary: #94a3b8;
        
        --border-color: #334155;
        --border-color-light: #475569;
        --border-color-dark: #1e293b;
        
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -2px rgba(0, 0, 0, 0.3);
        --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
      }

      /* 基础重置样式 */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
        font-size: 16px;
      }

      body {
        font-family: var(--font-family-sans);
        font-size: var(--font-size-base);
        line-height: var(--line-height-normal);
        color: var(--text-primary);
        background-color: var(--bg-primary);
        transition: background-color var(--transition-normal), color var(--transition-normal);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* 通用容器 */
      .container {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 var(--spacing-md);
      }

      /* 按钮样式 */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--spacing-xs);
        padding: 0.75rem 1.5rem;
        font-size: var(--font-size-sm);
        font-weight: 500;
        line-height: 1;
        border: 1px solid transparent;
        border-radius: var(--border-radius);
        cursor: pointer;
        transition: all var(--transition-fast);
        text-decoration: none;
        white-space: nowrap;
        user-select: none;
        outline: none;
      }

      .btn:focus {
        box-shadow: 0 0 0 3px var(--primary-color-alpha);
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      /* 次要按钮 */
      .btn-secondary {
        background: var(--bg-secondary);
        color: var(--text-primary);
        border-color: var(--border-color);
      }

      .btn-secondary:hover:not(:disabled) {
        background: var(--bg-tertiary);
        border-color: var(--border-color-dark);
        transform: translateY(-1px);
        box-shadow: var(--shadow-sm);
      }

      /* 幽灵按钮 */
      .btn-ghost {
        background: transparent;
        color: var(--text-secondary);
        border-color: transparent;
      }

      .btn-ghost:hover:not(:disabled) {
        background: var(--bg-secondary);
        color: var(--text-primary);
      }

      /* 按钮大小变体 */
      .btn-sm {
        padding: 0.5rem 1rem;
        font-size: var(--font-size-xs);
      }

      /* 图标 */
      .icon {
        width: 1rem;
        height: 1rem;
        stroke-width: 2;
        flex-shrink: 0;
      }

      .btn .icon {
        width: 0.875rem;
        height: 0.875rem;
      }

      /* 表单元素 */
      .form-group {
        margin-bottom: var(--spacing-lg);
      }

      .form-label {
        display: block;
        font-size: var(--font-size-sm);
        font-weight: 500;
        color: var(--text-primary);
        margin-bottom: var(--spacing-xs);
      }

      .form-input,
      .form-textarea,
      .form-select {
        width: 100%;
        padding: 0.75rem;
        font-size: var(--font-size-base);
        line-height: var(--line-height-normal);
        color: var(--text-primary);
        background: var(--input-bg);
        border: 1px solid var(--border-color);
        border-radius: var(--border-radius);
        transition: all var(--transition-fast);
        outline: none;
      }

      .form-input:focus,
      .form-textarea:focus,
      .form-select:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px var(--primary-color-alpha);
      }

      .form-textarea {
        resize: vertical;
        min-height: 120px;
        font-family: var(--font-family-mono);
      }

      /* 主题切换按钮样式 */
      .theme-toggle {
        position: relative;
        width: 2.5rem;
        height: 2.5rem;
        padding: 0.5rem;
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: var(--border-radius);
        cursor: pointer;
        transition: all var(--transition-normal);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .theme-toggle:hover {
        background: var(--bg-tertiary);
        border-color: var(--border-color-dark);
        transform: scale(1.05);
      }

      .theme-toggle:focus {
        outline: none;
        box-shadow: 0 0 0 3px var(--primary-color-alpha);
      }

      /* 主题图标样式 */
      .theme-toggle .icon {
        width: 1.25rem;
        height: 1.25rem;
        transition: all var(--transition-normal);
        position: absolute;
      }

      .sun-icon {
        opacity: 1;
        transform: rotate(0deg) scale(1);
      }

      .moon-icon {
        opacity: 0;
        transform: rotate(180deg) scale(0.8);
      }

      [data-theme="dark"] .sun-icon {
        opacity: 0;
        transform: rotate(-180deg) scale(0.8);
      }

      [data-theme="dark"] .moon-icon {
        opacity: 1;
        transform: rotate(0deg) scale(1);
      }

      /* 主题切换动画效果 */
      .theme-switching {
        animation: themeSwitch 0.6s ease-in-out;
      }

      @keyframes themeSwitch {
        0% {
          transform: scale(1) rotate(0deg);
        }
        50% {
          transform: scale(0.8) rotate(180deg);
        }
        100% {
          transform: scale(1) rotate(360deg);
        }
      }

      /* 顶部导航 */
      .top-nav {
        background: var(--card-bg);
        border-bottom: 1px solid var(--border-color);
        padding: var(--spacing-md) 0;
        position: sticky;
        top: 0;
        z-index: var(--z-sticky);
        backdrop-filter: blur(8px);
        transition: all var(--transition-normal);
      }

      .nav-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 var(--spacing-md);
        display: flex;
        align-items: center;
        justify-content: flex-end;
      }

      /* 工具特定样式 */
      .tool-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem;
      }

      .tool-header {
        text-align: center;
        margin-bottom: 2rem;
      }

      .tool-title {
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
        background: linear-gradient(
          135deg,
          var(--primary-color),
          var(--primary-color-light)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .tool-description {
        font-size: 1.125rem;
        color: var(--text-secondary);
        max-width: 600px;
        margin: 0 auto;
      }

      .tool-content {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
        margin-bottom: 2rem;
      }

      .input-section,
      .output-section {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: var(--border-radius-lg);
        padding: 1.5rem;
        box-shadow: var(--shadow-sm);
      }

      .section-title {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 1rem;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .section-icon {
        width: 1.25rem;
        height: 1.25rem;
        color: var(--primary-color);
      }

      .form-textarea {
        width: 100%;
        min-height: 300px;
        padding: 1rem;
        border: 1px solid var(--border-color);
        border-radius: var(--border-radius);
        background: var(--input-bg);
        color: var(--text-primary);
        font-size: 0.875rem;
        font-family: "Consolas", "Monaco", "Courier New", monospace;
        line-height: 1.5;
        resize: vertical;
        transition: all var(--transition-fast);
      }

      .form-textarea:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px var(--primary-color-alpha);
      }

      .btn-group {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 1rem;
      }

      .stat-item {
        text-align: center;
        padding: 1rem;
        background: var(--bg-tertiary);
        border-radius: var(--border-radius);
        border: 1px solid var(--border-color);
        transition: all var(--transition-fast);
      }

      .stat-item:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
      }

      .stat-value {
        display: block;
        font-size: 1.75rem;
        font-weight: 700;
        color: var(--primary-color);
        margin-bottom: 0.25rem;
      }

      .stat-label {
        font-size: 0.75rem;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .detailed-stats {
        margin-top: 1.5rem;
        padding: 1rem;
        background: var(--code-bg);
        border: 1px solid var(--border-color);
        border-radius: var(--border-radius);
        font-family: "Consolas", "Monaco", "Courier New", monospace;
        font-size: 0.875rem;
        line-height: 1.6;
      }

      .detailed-stats h4 {
        margin: 0 0 0.5rem 0;
        color: var(--text-primary);
        font-size: 0.875rem;
        font-weight: 600;
      }

      .detailed-stats ul {
        margin: 0;
        padding-left: 1.5rem;
        color: var(--text-secondary);
      }

      .detailed-stats li {
        margin-bottom: 0.25rem;
      }

      .action-buttons {
        display: flex;
        gap: 0.5rem;
        margin-top: 1rem;
        flex-wrap: wrap;
      }

      .real-time-indicator {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.75rem;
        color: var(--text-tertiary);
        margin-top: 0.5rem;
      }

      .real-time-dot {
        width: 0.5rem;
        height: 0.5rem;
        background: var(--success-color);
        border-radius: 50%;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      /* Toast样式 */
      .toast-container {
        position: fixed;
        top: 1rem;
        right: 1rem;
        z-index: 9999;
        pointer-events: none;
      }
      
      .toast {
        background: var(--bg-primary, #ffffff);
        border: 1px solid var(--border-color, #e5e7eb);
        border-radius: var(--border-radius, 0.5rem);
        box-shadow: var(--shadow-lg, 0 10px 15px -3px rgba(0, 0, 0, 0.1));
        margin-bottom: 0.5rem;
        max-width: 400px;
        opacity: 0;
        pointer-events: auto;
        transform: translateX(100%);
        transition: all 0.3s ease;
      }
      
      .toast.toast-show {
        opacity: 1;
        transform: translateX(0);
      }
      
      .toast.toast-hide {
        opacity: 0;
        transform: translateX(100%);
      }
      
      .toast-content {
        display: flex;
        align-items: center;
        padding: 0.75rem 1rem;
        gap: 0.5rem;
      }
      
      .toast-icon {
        flex-shrink: 0;
      }
      
      .toast-message {
        flex: 1;
        font-size: 0.875rem;
        line-height: 1.25rem;
        color: var(--text-primary, #111827);
      }
      
      .toast-close {
        background: none;
        border: none;
        color: var(--text-tertiary, #6b7280);
        cursor: pointer;
        flex-shrink: 0;
        padding: 0.25rem;
        border-radius: 0.25rem;
        transition: all 0.2s ease;
      }
      
      .toast-close:hover {
        background: var(--bg-tertiary, #f3f4f6);
        color: var(--text-primary, #111827);
      }
      
      .toast-success {
        border-left: 4px solid #10b981;
      }
      
      .toast-success .toast-icon {
        color: #10b981;
      }
      
      .toast-error {
        border-left: 4px solid #ef4444;
      }
      
      .toast-error .toast-icon {
        color: #ef4444;
      }
      
      .toast-warning {
        border-left: 4px solid #f59e0b;
      }
      
      .toast-warning .toast-icon {
        color: #f59e0b;
      }
      
      .toast-info {
        border-left: 4px solid #3b82f6;
      }
      
      .toast-info .toast-icon {
        color: #3b82f6;
      }

      /* 响应式设计 */
      @media (max-width: 768px) {
        .tool-container {
          padding: 1rem;
        }

        .tool-title {
          font-size: 2rem;
        }

        .tool-content {
          grid-template-columns: 1fr;
          gap: 1.5rem;
        }

        .stats-grid {
          grid-template-columns: repeat(2, 1fr);
        }

        .btn-group {
          justify-content: center;
        }

        .action-buttons {
          justify-content: center;
        }

        .toast-container {
          left: 1rem;
          right: 1rem;
          top: 1rem;
        }
        
        .toast {
          max-width: none;
        }
      }

      @media (max-width: 480px) {
        .tool-container {
          padding: 0.5rem;
        }

        .input-section,
        .output-section {
          padding: 1rem;
        }

        .form-textarea {
          min-height: 200px;
        }

        .stats-grid {
          grid-template-columns: 1fr;
        }
      }

      /* 暗色模式下的特殊样式调整 */
      [data-theme="dark"] {
        /* 滚动条样式 */
        scrollbar-width: thin;
        scrollbar-color: var(--border-color-dark) var(--bg-secondary);
      }

      [data-theme="dark"] ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      [data-theme="dark"] ::-webkit-scrollbar-track {
        background: var(--bg-secondary);
        border-radius: var(--border-radius-sm);
      }

      [data-theme="dark"] ::-webkit-scrollbar-thumb {
        background: var(--border-color-dark);
        border-radius: var(--border-radius-sm);
        transition: background var(--transition-fast);
      }

      [data-theme="dark"] ::-webkit-scrollbar-thumb:hover {
        background: var(--text-tertiary);
      }

      /* 暗色模式下的选中文本样式 */
      [data-theme="dark"] ::selection {
        background: var(--primary-color-alpha);
        color: var(--text-primary);
      }

      [data-theme="dark"] ::-moz-selection {
        background: var(--primary-color-alpha);
        color: var(--text-primary);
      }

      /* 暗色模式下的表单元素特殊处理 */
      [data-theme="dark"] .form-input,
      [data-theme="dark"] .form-textarea,
      [data-theme="dark"] .form-select {
        background: var(--input-bg);
        border-color: var(--border-color);
        color: var(--text-primary);
      }

      [data-theme="dark"] .form-input::placeholder,
      [data-theme="dark"] .form-textarea::placeholder {
        color: var(--text-tertiary);
      }

      [data-theme="dark"] .form-input:focus,
      [data-theme="dark"] .form-textarea:focus,
      [data-theme="dark"] .form-select:focus {
        background: var(--input-bg);
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px var(--primary-color-alpha);
      }

      /* 暗色模式下的按钮特殊样式 */
      [data-theme="dark"] .btn-secondary {
        background: var(--bg-tertiary);
        border-color: var(--border-color);
        color: var(--text-primary);
      }

      [data-theme="dark"] .btn-secondary:hover:not(:disabled) {
        background: var(--border-color);
        border-color: var(--border-color-dark);
      }

      [data-theme="dark"] .btn-ghost:hover:not(:disabled) {
        background: var(--bg-tertiary);
        color: var(--text-primary);
      }

      /* 主题切换过渡效果 */
      html {
        transition: background-color var(--transition-slow), color var(--transition-slow);
      }

      body {
        transition: background-color var(--transition-slow), color var(--transition-slow);
      }

      /* 为所有可能受主题影响的元素添加过渡 */
      *,
      *::before,
      *::after {
        transition-property: background-color, border-color, color, fill, stroke, box-shadow;
        transition-duration: var(--transition-normal);
        transition-timing-function: ease;
      }

      /* 但排除一些不需要过渡的元素 */
      .no-transition,
      .no-transition *,
      input[type="range"],
      progress {
        transition: none !important;
      }

      /* 减少动画的用户偏好设置 */
      @media (prefers-reduced-motion: reduce) {
        .theme-toggle,
        .theme-toggle .icon,
        .theme-switching {
          transition: none !important;
          animation: none !important;
        }
        
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- 顶部导航 -->
    <nav class="top-nav">
      <div class="nav-container">
        <button
          class="theme-toggle"
          onclick="toolUtils.toggleTheme()"
          title="切换主题 (Ctrl+D)"
          aria-label="切换主题"
        >
          <svg
            class="icon sun-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="5"></circle>
            <path

    <script>
      /* ==========================================================================
         通用工具函数 - 工具站JavaScript工具库
         ========================================================================== */

      /**
       * 工具站通用工具类
       * 提供主题管理、页面导航、剪贴板操作、消息提示等功能
       */
      class ToolUtils {
        constructor() {
          this.theme = "light";
          this.toastContainer = null;
          this.debounceTimers = new Map();
          this.throttleTimers = new Map();

          this.init();
        }

        /**
         * 初始化工具类
         */
        init() {
          this.initTheme();
          this.initToastContainer();
          this.initKeyboardShortcuts();
        }

        // ==========================================================================
        // 主题管理
        // ==========================================================================

        /**
         * 初始化主题
         */
        initTheme() {
          // 从本地存储获取主题设置
          const savedTheme = this.getStorage("theme");
          const systemTheme = window.matchMedia("(prefers-color-scheme: dark)")
            .matches
            ? "dark"
            : "light";

          this.theme = savedTheme || systemTheme;
          this.setTheme(this.theme);

          // 监听系统主题变化
          window
            .matchMedia("(prefers-color-scheme: dark)")
            .addEventListener("change", (e) => {
              if (!this.getStorage("theme")) {
                this.setTheme(e.matches ? "dark" : "light");
              }
            });
        }

        /**
         * 设置主题
         * @param {string} theme - 主题名称 ('light' | 'dark')
         */
        setTheme(theme) {
          this.theme = theme;
          document.documentElement.setAttribute("data-theme", theme);
          this.setStorage("theme", theme);
          this.updateThemeIcon();

          // 触发主题变化事件
          window.dispatchEvent(
            new CustomEvent("themeChanged", {
              detail: { theme },
            })
          );
        }

        /**
         * 切换主题
         */
        toggleTheme() {
          const newTheme = this.theme === "light" ? "dark" : "light";

          // 添加切换动画类
          document.body.classList.add("theme-switching");

          setTimeout(() => {
            this.setTheme(newTheme);
            document.body.classList.remove("theme-switching");
          }, 150);
        }

        /**
         * 更新主题图标
         */
        updateThemeIcon() {
          const themeToggle = document.querySelector(".theme-toggle");
          if (themeToggle) {
            const title =
              this.theme === "light"
                ? "切换到暗色模式 (Ctrl+D)"
                : "切换到亮色模式 (Ctrl+D)";
            themeToggle.setAttribute("title", title);
            themeToggle.setAttribute("aria-label", title);
          }
        }

        // ==========================================================================
        // 剪贴板操作
        // ==========================================================================

        /**
         * 复制文本到剪贴板
         * @param {string} text - 要复制的文本
         * @param {string} successMessage - 成功提示消息
         * @returns {Promise<boolean>} 是否复制成功
         */
        async copyToClipboard(text, successMessage = "已复制到剪贴板") {
          try {
            if (navigator.clipboard && window.isSecureContext) {
              await navigator.clipboard.writeText(text);
            } else {
              // 降级方案
              const textArea = document.createElement("textarea");
              textArea.value = text;
              textArea.style.position = "fixed";
              textArea.style.left = "-999999px";
              textArea.style.top = "-999999px";
              document.body.appendChild(textArea);
              textArea.focus();
              textArea.select();
              document.execCommand("copy");
              textArea.remove();
            }

            this.showToast(successMessage, "success");
            return true;
          } catch (error) {
            console.error("复制失败:", error);
            this.showToast("复制失败，请手动复制", "error");
            return false;
          }
        }

        // ==========================================================================
        // 消息提示
        // ==========================================================================

        /**
         * 初始化Toast容器
         */
        initToastContainer() {
          if (!this.toastContainer) {
            this.toastContainer = document.createElement("div");
            this.toastContainer.className = "toast-container";
            document.body.appendChild(this.toastContainer);
          }
        }

        /**
         * 显示Toast消息
         * @param {string} message - 消息内容
         * @param {string} type - 消息类型 ('success' | 'error' | 'warning' | 'info')
         * @param {number} duration - 显示时长（毫秒）
         */
        showToast(message, type = "info", duration = 3000) {
          const toast = document.createElement("div");
          toast.className = `toast toast-${type}`;
          toast.innerHTML = `
            <div class="toast-content">
              <span class="toast-icon">${this.getToastIcon(type)}</span>
              <span class="toast-message">${message}</span>
              <button class="toast-close" aria-label="关闭">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>
          `;

          // 添加关闭事件
          const closeBtn = toast.querySelector(".toast-close");
          closeBtn.addEventListener("click", () => this.removeToast(toast));

          // 添加到容器
          this.toastContainer.appendChild(toast);

          // 触发动画
          requestAnimationFrame(() => {
            toast.classList.add("toast-show");
          });

          // 自动移除
          if (duration > 0) {
            setTimeout(() => this.removeToast(toast), duration);
          }

          return toast;
        }

        /**
         * 移除Toast
         * @param {HTMLElement} toast - Toast元素
         */
        removeToast(toast) {
          if (toast && toast.parentNode) {
            toast.classList.add("toast-hide");
            setTimeout(() => {
              if (toast.parentNode) {
                toast.parentNode.removeChild(toast);
              }
            }, 300);
          }
        }

        /**
         * 获取Toast图标
         * @param {string} type - 消息类型
         * @returns {string} SVG图标
         */
        getToastIcon(type) {
          const icons = {
            success:
              '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20,6 9,17 4,12"></polyline></svg>',
            error:
              '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>',
            warning:
              '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>',
            info: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>',
          };
          return icons[type] || icons.info;
        }

        // ==========================================================================
        // 文件操作
        // ==========================================================================

        /**
         * 下载文件
         * @param {string} content - 文件内容
         * @param {string} filename - 文件名
         * @param {string} mimeType - MIME类型
         */
        downloadFile(content, filename, mimeType = "text/plain") {
          const blob = new Blob([content], { type: mimeType });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = filename;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);

          this.showToast(`文件 ${filename} 下载成功`, "success");
        }

        // ==========================================================================
        // 键盘快捷键
        // ==========================================================================

        /**
         * 初始化键盘快捷键
         */
        initKeyboardShortcuts() {
          document.addEventListener("keydown", (e) => {
            // Ctrl+D 或 Cmd+D: 切换主题
            if ((e.ctrlKey || e.metaKey) && e.key === "d") {
              e.preventDefault();
              this.toggleTheme();
            }
          });
        }

        // ==========================================================================
        // 本地存储
        // ==========================================================================

        /**
         * 设置本地存储
         * @param {string} key - 键名
         * @param {any} value - 值
         */
        setStorage(key, value) {
          try {
            localStorage.setItem(`ai-tools-${key}`, JSON.stringify(value));
          } catch (error) {
            console.warn("本地存储设置失败:", error);
          }
        }

        /**
         * 获取本地存储
         * @param {string} key - 键名
         * @param {any} defaultValue - 默认值
         * @returns {any} 存储的值
         */
        getStorage(key, defaultValue = null) {
          try {
            const item = localStorage.getItem(`ai-tools-${key}`);
            return item ? JSON.parse(item) : defaultValue;
          } catch (error) {
            console.warn("本地存储获取失败:", error);
            return defaultValue;
          }
        }
      }

      // 创建全局实例
      const toolUtils = new ToolUtils();

      // 导出到全局作用域
      if (typeof window !== "undefined") {
        window.toolUtils = toolUtils;
      }

      /* ==========================================================================
         工具特定JavaScript
         ========================================================================== */

      // 统计数据对象
      let stats = {
        totalChars: 0,
        charsNoSpaces: 0,
        wordCount: 0,
        lineCount: 0,
        paragraphCount: 0,
        sentenceCount: 0,
        chineseChars: 0,
        englishChars: 0,
        numberChars: 0,
        punctuationChars: 0,
        spaceChars: 0,
        newlineChars: 0,
        specialChars: 0,
        avgCharsPerLine: 0,
        avgCharsPerParagraph: 0,
        maxLineLength: 0,
      };

      // 更新统计信息
      function updateStats() {
        const text = document.getElementById("inputText").value;

        // 基础统计
        stats.totalChars = text.length;
        stats.charsNoSpaces = text.replace(/\s/g, "").length;
        stats.spaceChars = text.length - stats.charsNoSpaces;
        stats.newlineChars = (text.match(/\n/g) || []).length;

        // 行数和段落数
        const lines = text.split("\n");
        stats.lineCount = text ? lines.length : 0;
        stats.paragraphCount = text
          ? text.split(/\n\s*\n/).filter((p) => p.trim()).length
          : 0;

        // 单词数（支持中英文）
        const words = text
          .trim()
          .split(/\s+/)
          .filter((word) => word.length > 0);
        stats.wordCount = text.trim() ? words.length : 0;

        // 句子数
        stats.sentenceCount = text
          ? (text.match(/[.!?。！？]+/g) || []).length
          : 0;

        // 字符类型统计
        stats.chineseChars = (text.match(/[\u4e00-\u9fff]/g) || []).length;
        stats.englishChars = (text.match(/[a-zA-Z]/g) || []).length;
        stats.numberChars = (text.match(/[0-9]/g) || []).length;
        stats.punctuationChars = (
          text.match(/[.,;:!?"'()\[\]{}。，；：！？""（）【】《》、]/g) || []
        ).length;

        // 特殊字符（除了中英文、数字、标点、空格、换行外的字符）
        const knownChars =
          stats.chineseChars +
          stats.englishChars +
          stats.numberChars +
          stats.punctuationChars +
          stats.spaceChars +
          stats.newlineChars;
        stats.specialChars = stats.totalChars - knownChars;

        // 计算平均值和最大值
        if (stats.lineCount > 0) {
          stats.avgCharsPerLine =
            Math.round((stats.totalChars / stats.lineCount) * 100) / 100;
          stats.maxLineLength = Math.max(...lines.map((line) => line.length));
        } else {
          stats.avgCharsPerLine = 0;
          stats.maxLineLength = 0;
        }

        if (stats.paragraphCount > 0) {
          stats.avgCharsPerParagraph =
            Math.round((stats.totalChars / stats.paragraphCount) * 100) / 100;
        } else {
          stats.avgCharsPerParagraph = 0;
        }

        // 更新DOM显示
        updateStatsDisplay();
      }

      // 更新统计显示
      function updateStatsDisplay() {
        // 更新基础统计
        document.getElementById("totalChars").textContent =
          stats.totalChars.toLocaleString();
        document.getElementById("charsNoSpaces").textContent =
          stats.charsNoSpaces.toLocaleString();
        document.getElementById("wordCount").textContent =
          stats.wordCount.toLocaleString();
        document.getElementById("lineCount").textContent =
          stats.lineCount.toLocaleString();
        document.getElementById("paragraphCount").textContent =
          stats.paragraphCount.toLocaleString();
        document.getElementById("sentenceCount").textContent =
          stats.sentenceCount.toLocaleString();

        // 更新详细统计
        document.getElementById("chineseChars").textContent =
          stats.chineseChars.toLocaleString();
        document.getElementById("englishChars").textContent =
          stats.englishChars.toLocaleString();
        document.getElementById("numberChars").textContent =
          stats.numberChars.toLocaleString();
        document.getElementById("punctuationChars").textContent =
          stats.punctuationChars.toLocaleString();
        document.getElementById("spaceChars").textContent =
          stats.spaceChars.toLocaleString();
        document.getElementById("newlineChars").textContent =
          stats.newlineChars.toLocaleString();
        document.getElementById("specialChars").textContent =
          stats.specialChars.toLocaleString();
        document.getElementById("avgCharsPerLine").textContent =
          stats.avgCharsPerLine;
        document.getElementById("avgCharsPerParagraph").textContent =
          stats.avgCharsPerParagraph;
        document.getElementById("maxLineLength").textContent =
          stats.maxLineLength.toLocaleString();
      }

      // 清空输入
      function clearInput() {
        document.getElementById("inputText").value = "";
        updateStats();
        toolUtils.showToast("文本已清空", "success");
      }

      // 加载示例文本
      function loadExample() {
        const exampleText = `这是一个文本统计工具的示例文本。

This is an example text for the text statistics tool. It contains both Chinese and English characters, numbers like 123 and 456, and various punctuation marks!

本工具可以统计：
1. 总字符数
2. 不含空格的字符数
3. 单词数量
4. 行数和段落数
5. 句子数量
6. 中英文字符分布
7. 数字和标点符号统计

功能特点：
• 实时统计更新
• 支持中英文混合文本
• 详细的字符类型分析
• 可复制统计结果
• 可下载统计报告

Welcome to use our text statistics tool! 欢迎使用我们的文本统计工具！`;

        document.getElementById("inputText").value = exampleText;
        updateStats();
        toolUtils.showToast("示例文本已加载", "success");
      }

      // 复制统计结果
      function copyStats() {
        const report = generateStatsReport();
        toolUtils.copyToClipboard(report, "统计结果已复制到剪贴板");
      }

      // 下载统计报告
      function downloadStats() {
        const report = generateStatsReport();
        const timestamp = new Date().toISOString().slice(0, 19).replace(/:/g, "-");
        const filename = `文本统计报告_${timestamp}.txt`;
        toolUtils.downloadFile(report, filename, "text/plain;charset=utf-8");
      }

      // 生成统计报告
      function generateStatsReport() {
        const text = document.getElementById("inputText").value;
        const timestamp = new Date().toLocaleString("zh-CN");

        return `文本统计报告
${"".padEnd(50, "=")}

生成时间: ${timestamp}

基础统计:
${"".padEnd(30, "-")}
总字符数: ${stats.totalChars.toLocaleString()}
不含空格字符数: ${stats.charsNoSpaces.toLocaleString()}
单词数: ${stats.wordCount.toLocaleString()}
行数: ${stats.lineCount.toLocaleString()}
段落数: ${stats.paragraphCount.toLocaleString()}
句子数: ${stats.sentenceCount.toLocaleString()}

详细统计:
${"".padEnd(30, "-")}
中文字符: ${stats.chineseChars.toLocaleString()}
英文字符: ${stats.englishChars.toLocaleString()}
数字字符: ${stats.numberChars.toLocaleString()}
标点符号: ${stats.punctuationChars.toLocaleString()}
空格字符: ${stats.spaceChars.toLocaleString()}
换行符: ${stats.newlineChars.toLocaleString()}
特殊字符: ${stats.specialChars.toLocaleString()}

平均统计:
${"".padEnd(30, "-")}
平均每行字符数: ${stats.avgCharsPerLine}
平均每段字符数: ${stats.avgCharsPerParagraph}
最长行字符数: ${stats.maxLineLength.toLocaleString()}

原始文本:
${"".padEnd(30, "-")}
${text}

${"".padEnd(50, "=")}
报告结束`;
      }

      // 页面加载完成后初始化
      document.addEventListener("DOMContentLoaded", function () {
        // 初始化统计
        updateStats();

        // 监听主题变化
        window.addEventListener("themeChanged", function (e) {
          console.log("主题已切换到:", e.detail.theme);
        });

        // 添加键盘快捷键
        document.addEventListener("keydown", function (e) {
          // Ctrl/Cmd + Enter: 加载示例
          if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
            e.preventDefault();
            loadExample();
          }

          // Ctrl/Cmd + Shift + C: 复制统计
          if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === "C") {
            e.preventDefault();
            copyStats();
          }

          // Ctrl/Cmd + Shift + S: 下载报告
          if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === "S") {
            e.preventDefault();
            downloadStats();
          }

          // Ctrl/Cmd + Shift + Delete: 清空文本
          if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === "Delete") {
            e.preventDefault();
            clearInput();
          }
        });

        console.log("文本统计工具已初始化");
      });
    </script>
  </body>
</html>
