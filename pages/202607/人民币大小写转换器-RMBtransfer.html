<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人民币大小写转换器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .title {
            color: #333;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            color: #666;
            font-size: 16px;
            margin-bottom: 8px;
            text-align: left;
        }

        .input-field {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .input-field:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn {
            flex: 1;
            padding: 15px 20px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .result {
            background: #f8f9fa;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            padding: 15px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #333;
            font-weight: 500;
            text-align: center;
            word-break: break-all;
        }

        .result.empty {
            color: #999;
            font-style: italic;
        }

        .bottom-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .copy-btn {
            padding: 10px 20px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            background: white;
            color: #666;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .copy-btn:hover {
            border-color: #667eea;
            color: #667eea;
            transform: translateY(-1px);
        }

        .copy-btn:active {
            transform: translateY(0);
        }

        .copy-btn.copied {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .clear-btn {
            padding: 10px 20px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            background: white;
            color: #666;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .clear-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            .title {
                font-size: 24px;
            }
            
            .bottom-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .copy-btn, .clear-btn {
                width: 100%;
                max-width: 200px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">人民币大小写转换器</h1>
        
        <div class="input-group">
            <label for="amount">请输入金额：</label>
            <input type="text" id="amount" class="input-field" placeholder="例如：1234.56 或 壹仟贰佰叁拾肆元伍角陆分">
        </div>
        
        <div class="button-group">
            <button class="btn" onclick="convertToChinese()">转换为大写</button>
            <button class="btn" onclick="convertToNumber()">转换为小写</button>
        </div>
        
        <div class="input-group">
            <label>转换结果：</label>
            <div id="result" class="result empty">请输入金额并选择转换方式</div>
        </div>
        
        <div class="bottom-buttons">
            <button class="clear-btn" onclick="clearAll()">清空</button>
            <button id="copyBtn" class="copy-btn" onclick="copyResult()" style="display: none;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                复制
            </button>
        </div>
    </div>

    <script>
        // 数字到中文的映射
        const numToChinese = {
            '0': '零', '1': '壹', '2': '贰', '3': '叁', '4': '肆',
            '5': '伍', '6': '陆', '7': '柒', '8': '捌', '9': '玖'
        };

        // 位数到中文的映射
        const digitToChinese = ['', '拾', '佰', '仟'];
        const unitToChinese = ['', '万', '亿'];

        // 中文到数字的映射
        const chineseToNum = {
            '零': 0, '壹': 1, '贰': 2, '叁': 3, '肆': 4,
            '伍': 5, '陆': 6, '柒': 7, '捌': 8, '玖': 9
        };

        // 中文位数映射
        const chineseDigitMap = {
            '拾': 10, '佰': 100, '仟': 1000, '万': 10000, '亿': 100000000
        };

        function convertToChinese() {
            const input = document.getElementById('amount').value.trim();
            if (!input) {
                showResult('请输入金额');
                return;
            }

            // 检查是否已经是中文大写格式
            if (isChineseFormat(input)) {
                showResult(input);
                return;
            }

            const num = parseFloat(input);
            if (isNaN(num) || num < 0) {
                showResult('请输入有效的正数金额');
                return;
            }

            if (num > 999999999999.99) {
                showResult('金额过大，请输入小于1万亿的金额');
                return;
            }

            const result = numberToChinese(num);
            showResult(result);
        }

        function convertToNumber() {
            const input = document.getElementById('amount').value.trim();
            if (!input) {
                showResult('请输入金额');
                return;
            }

            // 检查是否已经是数字格式
            if (isNumberFormat(input)) {
                showResult(input);
                return;
            }

            const result = chineseToNumber(input);
            if (result === null) {
                showResult('请输入有效的中文金额格式');
                return;
            }

            showResult(result.toFixed(2));
        }

        function isChineseFormat(text) {
            // 检查是否包含中文数字字符且格式正确
            const chineseChars = /[零壹贰叁肆伍陆柒捌玖拾佰仟万亿角分元整]/;
            const hasChineseChars = chineseChars.test(text);
            
            // 检查是否包含"元"字（人民币大写的基本特征）
            const hasYuan = text.includes('元');
            
            return hasChineseChars && hasYuan;
        }

        function isNumberFormat(text) {
            // 检查是否为纯数字格式（包含小数点和数字）
            const numberPattern = /^[0-9]+(\.[0-9]{1,2})?$/;
            return numberPattern.test(text);
        }

        function numberToChinese(num) {
            const yuan = Math.floor(num);
            const jiao = Math.round((num - yuan) * 100);
            
            let result = '';
            
            if (yuan > 0) {
                result += convertInteger(yuan) + '元';
            }
            
            if (jiao > 0) {
                if (jiao >= 10) {
                    const jiaoInt = Math.floor(jiao / 10);
                    const fen = jiao % 10;
                    result += numToChinese[jiaoInt] + '角';
                    if (fen > 0) {
                        result += numToChinese[fen] + '分';
                    }
                } else {
                    result += numToChinese[jiao] + '分';
                }
            } else if (yuan > 0) {
                result += '整';
            }
            
            return result || '零元整';
        }

        function convertInteger(num) {
            if (num === 0) return '零';
            
            const str = num.toString();
            const len = str.length;
            let result = '';
            
            // 处理万和亿
            if (len > 8) {
                const yi = Math.floor(num / 100000000);
                const wan = Math.floor((num % 100000000) / 10000);
                const ge = num % 10000;
                
                if (yi > 0) {
                    result += convertInteger(yi) + '亿';
                }
                if (wan > 0) {
                    result += convertInteger(wan) + '万';
                } else if (yi > 0 && ge > 0) {
                    result += '零';
                }
                if (ge > 0) {
                    result += convertInteger(ge);
                }
            } else if (len > 4) {
                const wan = Math.floor(num / 10000);
                const ge = num % 10000;
                
                if (wan > 0) {
                    result += convertInteger(wan) + '万';
                }
                if (ge > 0) {
                    if (ge < 1000 && wan > 0) {
                        result += '零';
                    }
                    result += convertInteger(ge);
                }
            } else {
                // 处理个位数到千位数
                for (let i = 0; i < len; i++) {
                    const digit = parseInt(str[i]);
                    const position = len - i - 1;
                    
                    if (digit === 0) {
                        if (result && !result.endsWith('零')) {
                            result += '零';
                        }
                    } else {
                        result += numToChinese[digit] + digitToChinese[position];
                    }
                }
            }
            
            // 清理多余的零
            result = result.replace(/零+$/, '');
            result = result.replace(/零+/g, '零');
            
            return result;
        }

        function chineseToNumber(chinese) {
            try {
                // 移除空格和"整"字
                chinese = chinese.replace(/\s+/g, '').replace(/整$/, '');
                
                let result = 0;
                let currentNum = 0;
                let tempNum = 0;
                let hasYuan = false;
                let hasJiao = false;
                let hasFen = false;
                
                for (let i = 0; i < chinese.length; i++) {
                    const char = chinese[i];
                    
                    if (chineseToNum.hasOwnProperty(char)) {
                        currentNum = chineseToNum[char];
                    } else if (chineseDigitMap.hasOwnProperty(char)) {
                        if (char === '万' || char === '亿') {
                            tempNum = (tempNum + currentNum) * chineseDigitMap[char];
                            result += tempNum;
                            tempNum = 0;
                            currentNum = 0;
                        } else {
                            tempNum += currentNum * chineseDigitMap[char];
                            currentNum = 0;
                        }
                    } else if (char === '元') {
                        result += tempNum + currentNum;
                        tempNum = 0;
                        currentNum = 0;
                        hasYuan = true;
                    } else if (char === '角') {
                        result += (tempNum + currentNum) * 0.1;
                        tempNum = 0;
                        currentNum = 0;
                        hasJiao = true;
                    } else if (char === '分') {
                        result += (tempNum + currentNum) * 0.01;
                        tempNum = 0;
                        currentNum = 0;
                        hasFen = true;
                    }
                }
                
                // 处理最后的数字
                if (currentNum > 0 || tempNum > 0) {
                    if (!hasYuan && !hasJiao && !hasFen) {
                        result += tempNum + currentNum;
                    }
                }
                
                return result;
            } catch (e) {
                return null;
            }
        }

        function showResult(text) {
            const resultDiv = document.getElementById('result');
            const copyBtn = document.getElementById('copyBtn');
            
            resultDiv.textContent = text;
            resultDiv.className = 'result';
            
            // 显示复制按钮（除了提示信息）
            if (text && !text.includes('请输入') && !text.includes('请输入有效')) {
                copyBtn.style.display = 'flex';
            } else {
                copyBtn.style.display = 'none';
            }
        }

        function copyResult() {
            const resultText = document.getElementById('result').textContent;
            const copyBtn = document.getElementById('copyBtn');
            
            if (navigator.clipboard) {
                navigator.clipboard.writeText(resultText).then(() => {
                    copyBtn.classList.add('copied');
                    copyBtn.innerHTML = `
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="20,6 9,17 4,12"></polyline>
                        </svg>
                        已复制
                    `;
                    
                    setTimeout(() => {
                        copyBtn.classList.remove('copied');
                        copyBtn.innerHTML = `
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                            复制
                        `;
                    }, 2000);
                }).catch(err => {
                    console.error('复制失败:', err);
                    alert('复制失败，请手动复制');
                });
            } else {
                // 兼容旧浏览器
                const textArea = document.createElement('textarea');
                textArea.value = resultText;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    copyBtn.classList.add('copied');
                    copyBtn.innerHTML = `
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="20,6 9,17 4,12"></polyline>
                        </svg>
                        已复制
                    `;
                    
                    setTimeout(() => {
                        copyBtn.classList.remove('copied');
                        copyBtn.innerHTML = `
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                            复制
                        `;
                    }, 2000);
                } catch (err) {
                    console.error('复制失败:', err);
                    alert('复制失败，请手动复制');
                }
                document.body.removeChild(textArea);
            }
        }

        function clearAll() {
            document.getElementById('amount').value = '';
            document.getElementById('result').textContent = '请输入金额并选择转换方式';
            document.getElementById('result').className = 'result empty';
            document.getElementById('copyBtn').style.display = 'none';
        }

        // 回车键触发转换
        document.getElementById('amount').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                convertToChinese();
            }
        });
    </script>
</body>
</html>
