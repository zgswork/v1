<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数独 - 简洁优雅的益智游戏</title>
    <style>
        :root {
            --apple-black: #1d1d1f;
            --apple-white: #f5f5f7;
            --apple-gray: #86868b;
            --apple-light-gray: #e8e8ed;
            --apple-blue: #0071e3;
            --apple-blue-hover: #0077ed;
            --apple-blue-active: #0062b9;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--apple-white);
            color: var(--apple-black);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        
        .container {
            max-width: 980px;
            margin: 0 auto;
            padding: 0 22px;
        }
        
        header {
            padding: 22px 0;
            border-bottom: 1px solid var(--apple-light-gray);
            margin-bottom: 44px;
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 24px;
            font-weight: 600;
            color: var(--apple-black);
            text-decoration: none;
        }
        
        .nav-links {
            display: flex;
            gap: 30px;
        }
        
        .nav-link {
            color: var(--apple-gray);
            text-decoration: none;
            font-size: 14px;
            font-weight: 400;
            transition: color 0.3s;
        }
        
        .nav-link:hover {
            color: var(--apple-black);
        }
        
        .hero {
            text-align: center;
            margin-bottom: 44px;
        }
        
        h1 {
            font-size: 56px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        
        .subtitle {
            font-size: 28px;
            color: var(--apple-gray);
            margin-bottom: 22px;
        }
        
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 66px;
        }
        
        .sudoku-board {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            gap: 1px;
            width: 468px;
            height: 468px;
            margin-bottom: 22px;
            background-color: var(--apple-black);
            border: 1px solid var(--apple-black);
            border-radius: 12px;
            overflow: hidden;
        }
        
        .cell {
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
        }
        
        .cell:hover {
            background-color: rgba(0, 113, 227, 0.05);
        }
        
        .cell.selected {
            background-color: rgba(0, 113, 227, 0.1);
        }
        
        .cell.fixed {
            color: var(--apple-black);
            font-weight: 600;
        }
        
        .cell.user-input {
            color: var(--apple-blue);
        }
        
        .cell.error {
            color: #ff3b30;
        }
        
        .cell:nth-child(3n) {
            margin-right: 2px;
        }
        
        .cell:nth-child(9n+1) {
            margin-left: 0;
        }
        
        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) {
            margin-bottom: 2px;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 22px;
        }
        
        .btn {
            padding: 8px 16px;
            background-color: var(--apple-blue);
            color: white;
            border: none;
            border-radius: 980px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .btn:hover {
            background-color: var(--apple-blue-hover);
        }
        
        .btn:active {
            background-color: var(--apple-blue-active);
        }
        
        .btn.secondary {
            background-color: transparent;
            color: var(--apple-blue);
            border: 1px solid var(--apple-blue);
        }
        
        .btn.secondary:hover {
            background-color: rgba(0, 113, 227, 0.05);
        }
        
        .difficulty-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 22px;
        }
        
        .difficulty-btn {
            padding: 8px 16px;
            background-color: transparent;
            color: var(--apple-gray);
            border: 1px solid var(--apple-light-gray);
            border-radius: 980px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .difficulty-btn.active {
            background-color: var(--apple-black);
            color: white;
            border-color: var(--apple-black);
        }
        
        .difficulty-btn:hover:not(.active) {
            background-color: rgba(0, 0, 0, 0.02);
        }
        
        .number-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 22px;
        }
        
        .number-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: transparent;
            border: 1px solid var(--apple-light-gray);
            color: var(--apple-black);
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .number-btn:hover {
            background-color: rgba(0, 0, 0, 0.02);
        }
        
        .number-btn.active {
            background-color: var(--apple-blue);
            color: white;
            border-color: var(--apple-blue);
        }
        
        .action-buttons {
            display: flex;
            gap: 8px;
        }
        
        .action-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: transparent;
            border: 1px solid var(--apple-light-gray);
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .action-btn:hover {
            background-color: rgba(0, 0, 0, 0.02);
        }
        
        .action-btn.active {
            background-color: var(--apple-blue);
            color: white;
            border-color: var(--apple-blue);
        }
        
        .status {
            text-align: center;
            margin-bottom: 22px;
            font-size: 14px;
            min-height: 20px;
        }
        
        .success {
            color: #34c759;
        }
        
        .error {
            color: #ff3b30;
        }
        
        footer {
            padding: 44px 0;
            border-top: 1px solid var(--apple-light-gray);
            color: var(--apple-gray);
            font-size: 12px;
            text-align: center;
        }
        
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 10px;
        }
        
        .footer-link {
            color: var(--apple-gray);
            text-decoration: none;
        }
        
        .footer-link:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .sudoku-board {
                width: 100%;
                height: auto;
                aspect-ratio: 1/1;
                max-width: 468px;
            }
            
            .controls {
                flex-direction: column;
                width: 100%;
                max-width: 468px;
            }
            
            .btn {
                width: 100%;
            }
            
            .number-selector {
                flex-wrap: wrap;
                justify-content: center;
                max-width: 468px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <a href="#" class="logo">数独</a>
            <div class="nav-links">
                <a href="#" class="nav-link">游戏</a>
                <a href="#" class="nav-link">技巧</a>
                <a href="#" class="nav-link">关于</a>
            </div>
        </div>
    </header>
    
    <main class="container">
        <section class="hero">
            <h1>数独</h1>
            <p class="subtitle">挑战你的逻辑思维</p>
        </section>
        
        <section class="game-container">
            <div class="difficulty-selector">
                <button class="difficulty-btn active" data-difficulty="easy">简单</button>
                <button class="difficulty-btn" data-difficulty="medium">中等</button>
                <button class="difficulty-btn" data-difficulty="hard">困难</button>
                <button class="difficulty-btn" data-difficulty="expert">专家</button>
            </div>
            
            <div class="status" id="status"></div>
            
            <div class="sudoku-board" id="board"></div>
            
            <div class="controls">
                <button class="btn" id="new-game">新游戏</button>
                <button class="btn secondary" id="solve">解决</button>
                <button class="btn secondary" id="check">验证</button>
            </div>
            
            <div class="number-selector">
                <button class="number-btn" data-number="1">1</button>
                <button class="number-btn" data-number="2">2</button>
                <button class="number-btn" data-number="3">3</button>
                <button class="number-btn" data-number="4">4</button>
                <button class="number-btn" data-number="5">5</button>
                <button class="number-btn" data-number="6">6</button>
                <button class="number-btn" data-number="7">7</button>
                <button class="number-btn" data-number="8">8</button>
                <button class="number-btn" data-number="9">9</button>
            </div>
            
            <div class="action-buttons">
                <button class="action-btn" id="erase" title="擦除">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6 19L19 6M6 6L19 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
                <button class="action-btn" id="notes-mode" title="笔记模式">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 6H12.01M12 12H12.01M12 18H12.01M13 6C13 6.55228 12.5523 7 12 7C11.4477 7 11 6.55228 11 6C11 5.44772 11.4477 5 12 5C12.5523 5 13 5.44772 13 6ZM13 12C13 12.5523 12.5523 13 12 13C11.4477 13 11 12.5523 11 12C11 11.4477 11.4477 11 12 11C12.5523 11 13 11.4477 13 12ZM13 18C13 18.5523 12.5523 19 12 19C11.4477 19 11 18.5523 11 18C11 17.4477 11.4477 17 12 17C12.5523 17 13 17.4477 13 18Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
                <button class="action-btn" id="clear" title="清除">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M19 7L18.1327 19.1425C18.0579 20.1891 17.187 21 16.1378 21H7.86224C6.81296 21 5.94208 20.1891 5.86732 19.1425L5 7M10 11V17M14 11V17M15 7V4C15 3.44772 14.5523 3 14 3H10C9.44772 3 9 3.44772 9 4V7M4 7H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </section>
    </main>
    
    <footer>
        <div class="container">
            <div class="footer-links">
                     <a href="https://t.zsxq.com/y1934" class="footer-link" target="_blank" rel="noopener noreferrer">AI编程商业化</a>
        </div>
        <p>© 2025 数独游戏. 保留所有权利。</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const board = document.getElementById('board');
            const newGameBtn = document.getElementById('new-game');
            const solveBtn = document.getElementById('solve');
            const checkBtn = document.getElementById('check');
            const clearBtn = document.getElementById('clear');
            const statusEl = document.getElementById('status');
            const difficultyBtns = document.querySelectorAll('.difficulty-btn');
            const eraseBtn = document.getElementById('erase');
            const notesModeBtn = document.getElementById('notes-mode');
            const numberBtns = document.querySelectorAll('.number-btn[data-number]');
            
            let cells = [];
            let selectedCell = null;
            let notesMode = false;
            let solution = [];
            let initialBoard = [];
            let currentDifficulty = 'easy';
            
            // 初始化数独板
            function initializeBoard() {
                board.innerHTML = '';
                cells = [];
                
                for (let i = 0; i < 81; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.index = i;
                    cell.addEventListener('click', () => selectCell(i));
                    board.appendChild(cell);
                    cells.push(cell);
                }
            }
            
            // 选择单元格
            function selectCell(index) {
                if (selectedCell !== null) {
                    cells[selectedCell].classList.remove('selected');
                }
                
                selectedCell = index;
                cells[index].classList.add('selected');
                
                // 更新数字按钮状态
                updateNumberButtons();
            }
            
            // 更新数字按钮状态
            function updateNumberButtons() {
                if (selectedCell === null) return;
                
                const cellValue = cells[selectedCell].textContent;
                const isFixed = cells[selectedCell].classList.contains('fixed');
                
                numberBtns.forEach(btn => {
                    btn.classList.remove('active');
                    
                    if (!isFixed && cellValue === btn.dataset.number) {
                        btn.classList.add('active');
                    }
                });
            }
            
            // 生成新游戏
            function generateNewGame() {
                statusEl.textContent = '';
                statusEl.className = 'status';
                
                // 生成完整解决方案
                solution = generateSolution();
                
                // 根据难度移除数字
                initialBoard = removeNumbers([...solution], currentDifficulty);
                
                // 显示初始板
                displayBoard(initialBoard);
                
                // 重置选择
                if (selectedCell !== null) {
                    cells[selectedCell].classList.remove('selected');
                    selectedCell = null;
                }
                
                // 更新按钮状态
                updateNumberButtons();
            }
            
            // 生成完整的数独解决方案
            function generateSolution() {
                const grid = Array(81).fill(0);
                
                // 填充对角线上的3x3方块
                for (let box = 0; box < 9; box += 3) {
                    fillBox(grid, box, box);
                }
                
                // 解决剩余的格子
                solveSudoku(grid);
                
                return grid;
            }
            
            // 填充3x3方块
            function fillBox(grid, row, col) {
                const nums = [1, 2, 3, 4, 5, 6, 7, 8, 9];
                shuffleArray(nums);
                
                let index = 0;
                for (let i = 0; i < 3; i++) {
                    for (let j = 0; j < 3; j++) {
                        grid[(row + i) * 9 + (col + j)] = nums[index++];
                    }
                }
            }
            
            // 随机打乱数组
            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }
            
            // 解决数独
            function solveSudoku(grid) {
                const emptyCell = findEmptyCell(grid);
                if (!emptyCell) return true;
                
                const [row, col] = emptyCell;
                
                for (let num = 1; num <= 9; num++) {
                    if (isValid(grid, row, col, num)) {
                        grid[row * 9 + col] = num;
                        
                        if (solveSudoku(grid)) {
                            return true;
                        }
                        
                        grid[row * 9 + col] = 0;
                    }
                }
                
                return false;
            }
            
            // 查找空格子
            function findEmptyCell(grid) {
                for (let i = 0; i < 81; i++) {
                    if (grid[i] === 0) {
                        return [Math.floor(i / 9), i % 9];
                    }
                }
                return null;
            }
            
            // 检查数字是否有效
            function isValid(grid, row, col, num) {
                // 检查行
                for (let i = 0; i < 9; i++) {
                    if (grid[row * 9 + i] === num) return false;
                }
                
                // 检查列
                for (let i = 0; i < 9; i++) {
                    if (grid[i * 9 + col] === num) return false;
                }
                
                // 检查3x3方块
                const boxRow = Math.floor(row / 3) * 3;
                const boxCol = Math.floor(col / 3) * 3;
                
                for (let i = 0; i < 3; i++) {
                    for (let j = 0; j < 3; j++) {
                        if (grid[(boxRow + i) * 9 + (boxCol + j)] === num) return false;
                    }
                }
                
                return true;
            }
            
            // 根据难度移除数字
            function removeNumbers(grid, difficulty) {
                let cellsToRemove;
                
                switch (difficulty) {
                    case 'easy':
                        cellsToRemove = 40; // 保留41个数字
                        break;
                    case 'medium':
                        cellsToRemove = 50; // 保留31个数字
                        break;
                    case 'hard':
                        cellsToRemove = 60; // 保留21个数字
                        break;
                    case 'expert':
                        cellsToRemove = 64; // 保留17个数字
                        break;
                    default:
                        cellsToRemove = 40;
                }
                
                // 随机选择要移除的格子
                const indices = Array.from({length: 81}, (_, i) => i);
                shuffleArray(indices);
                
                for (let i = 0; i < cellsToRemove; i++) {
                    grid[indices[i]] = 0;
                }
                
                return grid;
            }
            
            // 显示数独板
            function displayBoard(board) {
                for (let i = 0; i < 81; i++) {
                    cells[i].className = 'cell';
                    cells[i].textContent = '';
                    
                    if (board[i] !== 0) {
                        cells[i].textContent = board[i];
                        cells[i].classList.add('fixed');
                    }
                }
            }
            
            // 解决当前数独
            function solveCurrentSudoku() {
                if (!solution || solution.length === 0) {
                    statusEl.textContent = '请先生成一个新游戏';
                    statusEl.className = 'status error';
                    return;
                }
                
                displayBoard(solution);
                statusEl.textContent = '已解决！';
                statusEl.className = 'status success';
                
                // 重置选择
                if (selectedCell !== null) {
                    cells[selectedCell].classList.remove('selected');
                    selectedCell = null;
                }
                
                // 更新按钮状态
                updateNumberButtons();
            }
            
            // 验证当前数独
            function checkCurrentSudoku() {
                const currentBoard = getCurrentBoard();
                
                // 检查是否有空格
                if (currentBoard.includes(0)) {
                    statusEl.textContent = '还有空格未填！';
                    statusEl.className = 'status error';
                    return;
                }
                
                // 检查是否正确
                if (JSON.stringify(currentBoard) === JSON.stringify(solution)) {
                    statusEl.textContent = '恭喜！解答正确！';
                    statusEl.className = 'status success';
                } else {
                    statusEl.textContent = '解答有误，请检查！';
                    statusEl.className = 'status error';
                    highlightErrors(currentBoard);
                }
            }
            
            // 获取当前数独状态
            function getCurrentBoard() {
                const currentBoard = [];
                
                for (let i = 0; i < 81; i++) {
                    if (cells[i].classList.contains('fixed')) {
                        currentBoard.push(parseInt(cells[i].textContent));
                    } else {
                        const value = cells[i].textContent;
                        currentBoard.push(value ? parseInt(value) : 0);
                    }
                }
                
                return currentBoard;
            }
            
            // 高亮显示错误
            function highlightErrors(currentBoard) {
                for (let i = 0; i < 81; i++) {
                    if (currentBoard[i] !== solution[i] && !cells[i].classList.contains('fixed')) {
                        cells[i].classList.add('error');
                    }
                }
            }
            
            // 清除用户输入
            function clearUserInput() {
                for (let i = 0; i < 81; i++) {
                    if (!cells[i].classList.contains('fixed')) {
                        cells[i].textContent = '';
                        cells[i].className = 'cell';
                    }
                }
                statusEl.textContent = '';
                statusEl.className = 'status';
                
                // 更新按钮状态
                updateNumberButtons();
            }
            
            // 输入数字
            function inputNumber(num) {
                if (selectedCell === null || cells[selectedCell].classList.contains('fixed')) {
                    return;
                }
                
                if (notesMode) {
                    // 笔记模式 - 添加小数字
                    if (!cells[selectedCell].textContent.includes(num)) {
                        cells[selectedCell].textContent += num;
                    }
                } else {
                    // 正常模式 - 替换数字
                    cells[selectedCell].textContent = num;
                    cells[selectedCell].className = 'cell user-input';
                }
                
                // 更新按钮状态
                updateNumberButtons();
            }
            
            // 擦除数字
            function eraseNumber() {
                if (selectedCell === null || cells[selectedCell].classList.contains('fixed')) {
                    return;
                }
                
                cells[selectedCell].textContent = '';
                cells[selectedCell].className = 'cell';
                
                // 更新按钮状态
                updateNumberButtons();
            }
            
            // 切换笔记模式
            function toggleNotesMode() {
                notesMode = !notesMode;
                notesModeBtn.classList.toggle('active', notesMode);
            }
            
            // 设置难度
            function setDifficulty(difficulty) {
                currentDifficulty = difficulty;
                
                difficultyBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.difficulty === difficulty);
                });
            }
            
            // 事件监听
            newGameBtn.addEventListener('click', generateNewGame);
            solveBtn.addEventListener('click', solveCurrentSudoku);
            checkBtn.addEventListener('click', checkCurrentSudoku);
            clearBtn.addEventListener('click', clearUserInput);
            eraseBtn.addEventListener('click', eraseNumber);
            notesModeBtn.addEventListener('click', toggleNotesMode);
            
            numberBtns.forEach(btn => {
                btn.addEventListener('click', () => inputNumber(btn.dataset.number));
            });
            
            difficultyBtns.forEach(btn => {
                btn.addEventListener('click', () => setDifficulty(btn.dataset.difficulty));
            });
            
            // 键盘输入支持
            document.addEventListener('keydown', function(e) {
                if (selectedCell === null) return;
                
                if (e.key >= '1' && e.key <= '9') {
                    inputNumber(e.key);
                } else if (e.key === 'Backspace' || e.key === 'Delete') {
                    eraseNumber();
                } else if (e.key === 'n') {
                    toggleNotesMode();
                }
            });
            
            // 初始化
            initializeBoard();
            setDifficulty('easy');
        });
    </script>
</body>
</html>
