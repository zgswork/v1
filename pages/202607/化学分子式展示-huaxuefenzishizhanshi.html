<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>化学分子式展示</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --card: #f7f8fa;
      --border: #e5e7eb;
      --accent: #2563eb;
      --btn-bg: #edf2ff;
      --btn-text: #1f2937;
      --input-bg: #ffffff;
    }

    html[data-theme="dark"] {
      --bg: #0b0f14;
      --text: #e5e7eb;
      --muted: #9aa0a6;
      --card: #121820;
      --border: #202a36;
      --accent: #60a5fa;
      --btn-bg: #111827;
      --btn-text: #e5e7eb;
      --input-bg: #0f141a;
    }

    @media (prefers-color-scheme: dark) {
      html[data-theme="auto"] {
        --bg: #0b0f14;
        --text: #e5e7eb;
        --muted: #9aa0a6;
        --card: #121820;
        --border: #202a36;
        --accent: #60a5fa;
        --btn-bg: #111827;
        --btn-text: #e5e7eb;
        --input-bg: #0f141a;
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Noto Sans", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 16px 48px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      font-size: clamp(20px, 3.2vw, 28px);
      margin: 0;
      line-height: 1.2;
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--btn-bg);
      color: var(--btn-text);
      cursor: pointer;
      user-select: none;
    }

    .card {
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 12px;
      padding: 14px;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: clamp(16px, 2.8vw, 18px);
      outline: none;
    }

    .btn {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--btn-bg);
      color: var(--btn-text);
      cursor: pointer;
    }

    .preview {
      font-size: clamp(24px, 6vw, 56px);
      line-height: 1.3;
      word-wrap: break-word;
      overflow-wrap: anywhere;
      min-height: 2.4em;
    }

    .examples {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 8px;
    }

    .example-btn {
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      text-align: left;
    }

    .muted { color: var(--muted); font-size: 0.92em; }
    .accent { color: var(--accent); }

    footer { color: var(--muted); font-size: 12px; text-align: center; padding-top: 8px; }

    .warn { color: #ef4444; }

    /* SVG 分子结构样式 */
    .mol-toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .svg-wrap { border: 1px solid var(--border); border-radius: 12px; overflow:hidden; background: var(--card); }
    #molSvg { width: 100%; height: 420px; touch-action: none; }
    .atom-label { font-size: 14px; font-weight: 600; fill: var(--text); pointer-events: none; }
    .atom-circle { fill: var(--input-bg); stroke: var(--border); stroke-width: 2; }
    .atom-selected .atom-circle { stroke: var(--accent); }
    .bond-line { stroke: var(--text); stroke-width: 2.5; stroke-linecap: round; }
    .bond-line.light { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>化学分子式展示</h1>
      <button id="themeBtn" class="theme-toggle" aria-label="切换主题">切换主题</button>
    </div>

    <div class="card toolbar" aria-label="快捷符号与字号">
      <div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center;">
        <div class="muted">快捷插入：</div>
        <button class="btn" data-insert="→">→</button>
        <button class="btn" data-insert="·">·</button>
        <button class="btn" data-insert="^+">^+</button>
        <button class="btn" data-insert="^2-">^2-</button>
        <button class="btn" data-insert="()">()</button>
        <button class="btn" data-insert="[]">[]</button>
        <button class="btn" data-insert="{}">{}</button>
        <button class="btn" data-insert="<=>"><span class="muted">⇌</span></button>
        <button class="btn" data-insert="<->"><span class="muted">↔</span></button>
        <div style="flex:1"></div>
        <label class="muted" for="sizeRange">字号</label>
        <input id="sizeRange" type="range" min="28" max="72" step="1" value="56" style="width:160px;" />
      </div>
    </div>

    <div class="card">
      <div class="input-row">
        <input id="formulaInput" class="input" type="text" placeholder="输入分子式，例如：Fe2(SO4)3·9H2O、SO4^2-、NH4^+、[Cu(NH3)4]^2+" />
        <button id="clearBtn" class="btn" aria-label="清空">清空</button>
      </div>
      <div class="muted" style="margin-top:8px;">
        规则：数字自动下标；“^”后的数字和正负号变上标；“->”显示为“→”；“.”自动显示为“·”（中点）。
      </div>
      <div id="warn" class="warn" style="margin-top:6px; display:none;"></div>
      <div class="action-row" style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;">
        <button id="copyHtml" class="btn">复制HTML</button>
        <button id="copyText" class="btn">复制纯文本</button>
        <button id="copyUnicode" class="btn">复制Unicode分子式</button>
        <button id="shareLink" class="btn">复制分享链接</button>
      </div>
    </div>

    <div class="card">
      <div class="preview" id="output" aria-live="polite">在上方输入分子式进行展示</div>
      <div class="action-row" style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
        <button id="exportPNG" class="btn">导出PNG</button>
        <button id="exportSVG" class="btn">导出SVG</button>
      </div>
    </div>

    <div class="card">
      <div class="muted" style="margin-bottom:6px;">示例（点击填充）：</div>
      <div class="examples" id="examples"></div>
    </div>

    <div class="card">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;">
        <div class="muted">批量转换（每行一个分子式）</div>
        <div style="display:flex; gap:8px;">
          <button id="batchCopyHtml" class="btn">复制整表HTML</button>
          <button id="batchCopyUnicode" class="btn">复制整表Unicode</button>
        </div>
      </div>
      <textarea id="batchInput" class="input" rows="4" placeholder="示例：\nH2O\nSO4^2-\n[Cu(NH3)4]^2+\nFe2(SO4)3·9H2O" style="margin-top:8px; resize:vertical;"></textarea>
      <div id="batchOutput" class="examples" style="margin-top:8px;"></div>
    </div>

    <div class="card">
      <div class="muted" style="margin-bottom:6px;">配置（本地保存）</div>
      <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:8px;">
        <label><input type="checkbox" id="optDots" checked> 将 . 转为 ·（中点）</label>
        <label><input type="checkbox" id="optArrows" checked> 转换箭头符号（->、<->、<=> 等）</label>
        <label><input type="checkbox" id="optStarDot" checked> 将 * 转为 ·</label>
        <label><input type="checkbox" id="optAutoBracket" checked> 自动补全括号与跳过</label>
      </div>
    </div>

    <div class="card">
      <div class="muted" style="margin-bottom:6px;">历史记录（本地）</div>
      <div class="examples" id="history"></div>
      <div style="margin-top:8px;">
        <button id="clearHistory" class="btn">清空历史</button>
      </div>
    </div>

    <!-- SVG 分子结构绘制 -->
    <div class="card">
      <div class="mol-toolbar" style="margin-bottom:8px;">
        <div class="muted">结构图绘制 (SVG)</div>
        <label class="muted" for="atomSymbol" style="margin-left:12px;">原子</label>
        <input id="atomSymbol" class="input" style="max-width:90px;" value="C" />
        <button id="addAtomMode" class="btn">添加原子</button>
        <button id="bondSingle" class="btn">单键</button>
        <button id="bondDouble" class="btn">双键</button>
        <button id="bondTriple" class="btn">三键</button>
        <button id="applyLabel" class="btn">更新选中标签</button>
        <button id="deleteSelection" class="btn">删除选中</button>
        <button id="clearMol" class="btn">清空结构</button>
        <button id="exportMolSvg" class="btn">导出结构SVG</button>
      </div>
      <div class="svg-wrap">
        <svg id="molSvg" viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" aria-label="分子结构绘制"></svg>
      </div>
      <div class="muted" style="margin-top:8px;">
        操作：
        - 点击“添加原子”后在画布点按添加；
        - 点击原子可选择（再次点击取消）；
        - 拖拽原子可移动；
        - 选择两个原子后点“单/双/三键”创建键；
        - 选中原子后可“更新选中标签”。
      </div>
    </div>

    <footer>
      说明：本工具为单页HTML，支持浅/深主题与移动端自适应。
    </footer>
  </div>

  <script>
    (function themeInit(){
      const root = document.documentElement;
      const btn = document.getElementById('themeBtn');
      const saved = localStorage.getItem('chem-theme');
      let current = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      function apply(mode){
        root.setAttribute('data-theme', mode);
        btn.textContent = mode === 'dark' ? '切换为浅色' : '切换为深色';
      }
      apply(current);
      btn.addEventListener('click', () => {
        current = current === 'dark' ? 'light' : 'dark';
        localStorage.setItem('chem-theme', current);
        apply(current);
      });
    })();

    const options = (function(){
      const def = { dots: true, arrows: true, starDot: true, autoBracket: true };
      try { return Object.assign(def, JSON.parse(localStorage.getItem('chem-options')||'{}')); } catch { return def; }
    })();

    function saveOptions(){ try { localStorage.setItem('chem-options', JSON.stringify(options)); } catch {} }

    function formatFormula(input) {
      if (!input) return '';
      let s = String(input).trim();
      if (!s) return '';

      // 统一箭头与中点
      if (options.arrows) {
        s = s.replace(/<=>/g, '⇌')
             .replace(/<->/g, '↔')
             .replace(/<-{1,2}>/g, '↔')
             .replace(/<-{1,2}/g, '←')
             .replace(/-{1,2}>/g, '→')
             .replace(/->/g, '→');
      }
      // 将分隔用的点替换为中点（避免小数误伤，简单策略：字母或右括号后跟点再跟字母/括号/数字）
      if (options.dots) {
        s = s.replace(/([A-Za-z\)\]\}])\s*\.(?=\s*[A-Za-z\(\[\{\d])/g, '$1·');
      }

      // 处理 ^{...} 上标（如 ^{14}C 或复杂上标）
      s = s.replace(/\^\{([^}]+)\}/g, '<sup>$1</sup>');
      // 处理电荷与一般上标：^2+、^+、^-
      s = s.replace(/\^([0-9]*)([+-]+)/g, (m, d, pm) => `<sup>${d}${pm}</sup>`);
      // 兜底：^后跟数字或单个+/-
      s = s.replace(/\^([+-]|\d+)/g, '<sup>$1</sup>');

      // 数字下标：紧跟元素/右括号/右方括号/右花括号的数字
      s = s.replace(/([A-Za-z\)\]\}])(\d+)/g, '$1<sub>$2</sub>');

      // 可选：将 * 号显示为中点（某些文本可能用*表示·）
      if (options.starDot) {
        s = s.replace(/\*/g, '·');
      }

      return s;
    }

    function toUnicodeFormula(input) {
      if (!input) return '';
      let s = String(input).trim();
      if (!s) return '';

      // 箭头与中点
      s = s.replace(/<=>/g, '⇌')
           .replace(/<->/g, '↔')
           .replace(/<-{1,2}>/g, '↔')
           .replace(/<-{1,2}/g, '←')
           .replace(/-{1,2}>/g, '→')
           .replace(/->/g, '→');
      s = s.replace(/([A-Za-z\)\]\}])\s*\.(?=\s*[A-Za-z\(\[\{\d])/g, '$1·');

      const subMap = { '0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉' };
      const supMap = { '0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','-':'⁻' };

      // ^{...} 转上标字符
      s = s.replace(/\^\{([^}]+)\}/g, (_, inner) => inner.replace(/[0-9+-]/g, ch => supMap[ch] || ch));
      // ^2-、^+ 等
      s = s.replace(/\^([0-9]*)([+-]+)/g, (_, d, pm) => {
        const dSup = d.replace(/[0-9]/g, ch => supMap[ch] || ch);
        const pmSup = pm.replace(/[+-]/g, ch => supMap[ch] || ch);
        return dSup + pmSup;
      });
      s = s.replace(/\^([+-]|\d+)/g, m => m.slice(1).replace(/[0-9+-]/g, ch => supMap[ch] || ch));

      // 紧跟元素或右括号后的数字转下标
      s = s.replace(/([A-Za-z\)\]\}])(\d+)/g, (_, pre, digits) => pre + digits.replace(/[0-9]/g, ch => subMap[ch]));

      return s;
    }

    function render() {
      const input = document.getElementById('formulaInput').value;
      const out = document.getElementById('output');
      const html = formatFormula(input);
      out.innerHTML = html || '<span class="muted">在上方输入分子式进行展示</span>';
      validateAndWarn(input);
      updateHash(input);
      addToHistory(input);
    }

    function fillExamples() {
      const list = [
        'H2O',
        'CO2',
        'NH4^+',
        'SO4^2-',
        'Fe2(SO4)3·9H2O',
        '[Cu(NH3)4]^2+',
        'CH3CH2OH',
        'CaCO3',
        'Al2O3',
        'Na^+'
      ];
      const wrap = document.getElementById('examples');
      wrap.innerHTML = '';
      for (const item of list) {
        const btn = document.createElement('button');
        btn.className = 'example-btn';
        btn.type = 'button';
        btn.textContent = item;
        btn.addEventListener('click', () => {
          document.getElementById('formulaInput').value = item;
          render();
        });
        wrap.appendChild(btn);
      }
    }

    document.getElementById('formulaInput').addEventListener('input', render);
    document.getElementById('clearBtn').addEventListener('click', () => {
      document.getElementById('formulaInput').value = '';
      render();
    });

    // 工具栏插入
    (function initToolbar(){
      const inputEl = document.getElementById('formulaInput');
      function insertAtCursor(text){
        const start = inputEl.selectionStart ?? inputEl.value.length;
        const end = inputEl.selectionEnd ?? inputEl.value.length;
        const before = inputEl.value.slice(0, start);
        const after = inputEl.value.slice(end);
        inputEl.value = before + text + after;
        const pos = start + text.length;
        inputEl.setSelectionRange(pos, pos);
        inputEl.focus();
        render();
      }
      // 自动补全括号与跳过
      inputEl.addEventListener('keydown', (e) => {
        if (!options.autoBracket) return;
        const pairs = { '(': ')', '[': ']', '{': '}' };
        const closers = new Set([')',']','}']);
        const val = inputEl.value;
        const start = inputEl.selectionStart ?? val.length;
        const end = inputEl.selectionEnd ?? val.length;
        const next = val[end] || '';
        // 开括号：自动补全
        if (pairs[e.key] && !e.ctrlKey && !e.metaKey && !e.altKey) {
          e.preventDefault();
          const before = val.slice(0, start);
          const after = val.slice(end);
          const ins = e.key + pairs[e.key];
          inputEl.value = before + ins + after;
          const pos = start + 1;
          inputEl.setSelectionRange(pos, pos);
          render();
          return;
        }
        // 右括号：若下一个字符正好是对应闭括号，则跳过
        if (closers.has(e.key) && next === e.key && !e.ctrlKey && !e.metaKey && !e.altKey) {
          e.preventDefault();
          const pos = end + 1;
          inputEl.setSelectionRange(pos, pos);
          return;
        }
      });
      document.querySelectorAll('.toolbar .btn[data-insert]').forEach(btn => {
        btn.addEventListener('click', () => {
          const ins = btn.getAttribute('data-insert');
          insertAtCursor(ins);
        });
      });
      const range = document.getElementById('sizeRange');
      const out = document.getElementById('output');
      const applySize = () => { out.style.fontSize = range.value + 'px'; };
      range.addEventListener('input', applySize);
      applySize();
    })();

    // 复制与分享
    (function initCopy(){
      const inputEl = document.getElementById('formulaInput');
      document.getElementById('copyHtml').addEventListener('click', async () => {
        const html = formatFormula(inputEl.value);
        await navigator.clipboard.writeText(html);
      });
      document.getElementById('copyText').addEventListener('click', async () => {
        const txt = document.getElementById('output').textContent || '';
        await navigator.clipboard.writeText(txt);
      });
      document.getElementById('copyUnicode').addEventListener('click', async () => {
        const uni = toUnicodeFormula(inputEl.value);
        await navigator.clipboard.writeText(uni);
      });
      document.getElementById('shareLink').addEventListener('click', async () => {
        const url = location.origin + location.pathname + '#' + encodeURIComponent(inputEl.value);
        await navigator.clipboard.writeText(url);
      });
    })();

    // 批量转换
    (function initBatch(){
      const input = document.getElementById('batchInput');
      const out = document.getElementById('batchOutput');
      function renderBatch(){
        const lines = (input.value || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
        out.innerHTML = '';
        for (const line of lines){
          const div = document.createElement('div');
          div.className = 'example-btn';
          div.innerHTML = formatFormula(line);
          out.appendChild(div);
        }
      }
      input.addEventListener('input', renderBatch);
      renderBatch();
      document.getElementById('batchCopyHtml').addEventListener('click', async () => {
        const lines = (input.value || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
        const html = lines.map(l => formatFormula(l)).join('\n');
        await navigator.clipboard.writeText(html);
      });
      document.getElementById('batchCopyUnicode').addEventListener('click', async () => {
        const lines = (input.value || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
        const uni = lines.map(l => toUnicodeFormula(l)).join('\n');
        await navigator.clipboard.writeText(uni);
      });
    })();

    // 选项绑定
    (function initOptions(){
      const map = [
        ['optDots','dots'],
        ['optArrows','arrows'],
        ['optStarDot','starDot'],
        ['optAutoBracket','autoBracket'],
      ];
      for (const [id, key] of map){
        const el = document.getElementById(id);
        if (!el) continue;
        el.checked = !!options[key];
        el.addEventListener('change', () => { options[key] = !!el.checked; saveOptions(); render(); });
      }
    })();

    // 导出PNG / SVG（foreignObject）
    (function initExport(){
      const out = document.getElementById('output');
      async function exportImage(type){
        // 度量尺寸
        const rect = out.getBoundingClientRect();
        const width = Math.max(300, Math.ceil(rect.width));
        const height = Math.max(100, Math.ceil(rect.height));
        // 克隆内容并内联样式
        const clone = out.cloneNode(true);
        const cs = getComputedStyle(out);
        clone.style.margin = '0';
        clone.style.background = 'transparent';
        clone.style.color = cs.color;
        clone.style.fontFamily = cs.fontFamily;
        clone.style.fontSize = cs.fontSize;
        clone.style.lineHeight = cs.lineHeight;
        const svg = `<?xml version="1.0" encoding="UTF-8"?>\n` +
          `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">` +
          `<foreignObject width="100%" height="100%">` +
          `<div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:${getComputedStyle(document.body).backgroundColor};color:${cs.color};font-family:${cs.fontFamily};font-size:${cs.fontSize};line-height:${cs.lineHeight};">` +
          clone.innerHTML.replace(/</g,'&lt;').replace(/>/g,'&gt;') +
          `</div></foreignObject></svg>`;

        const svgBlob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
        const svgUrl = URL.createObjectURL(svgBlob);
        if (type === 'svg') {
          const a = document.createElement('a');
          a.href = svgUrl; a.download = 'formula.svg'; a.click();
          setTimeout(() => URL.revokeObjectURL(svgUrl), 1000);
          return;
        }
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          canvas.toBlob(blob => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'formula.png'; a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            URL.revokeObjectURL(svgUrl);
          }, 'image/png');
        };
        img.onerror = () => { alert('导出失败：浏览器不支持或内容超出限制'); URL.revokeObjectURL(svgUrl); };
        img.src = svgUrl;
      }
      document.getElementById('exportPNG').addEventListener('click', () => exportImage('png'));
      document.getElementById('exportSVG').addEventListener('click', () => exportImage('svg'));
    })();

    // SVG 分子结构绘制
    (function initMol(){
      const svg = document.getElementById('molSvg');
      const symbolInput = document.getElementById('atomSymbol');
      const addAtomBtn = document.getElementById('addAtomMode');
      const singleBtn = document.getElementById('bondSingle');
      const doubleBtn = document.getElementById('bondDouble');
      const tripleBtn = document.getElementById('bondTriple');
      const applyLabelBtn = document.getElementById('applyLabel');
      const delSelBtn = document.getElementById('deleteSelection');
      const clearBtn = document.getElementById('clearMol');
      const exportBtn = document.getElementById('exportMolSvg');

      let nodes = [];
      let bonds = [];
      let nextId = 1;
      let mode = 'select'; // 'select' | 'addAtom' | 'bond1' | 'bond2' | 'bond3'
      const selected = new Set();
      let draggingId = null;

      function save(){ try { localStorage.setItem('chem-mol', JSON.stringify({nodes,bonds,nextId})); } catch {} }
      function load(){
        try {
          const d = JSON.parse(localStorage.getItem('chem-mol')||'{}');
          nodes = Array.isArray(d.nodes)? d.nodes: [];
          bonds = Array.isArray(d.bonds)? d.bonds: [];
          nextId = typeof d.nextId==='number' ? d.nextId : 1;
        } catch {}
      }

      function perp(dx,dy){ const len = Math.hypot(dx,dy)||1; return {px:-dy/len, py:dx/len}; }

      function render(){
        const parts = [];
        // bonds first
        for (const b of bonds){
          const a = nodes.find(n=>n.id===b.a); const c = nodes.find(n=>n.id===b.b);
          if (!a||!c) continue;
          const dx = c.x - a.x, dy = c.y - a.y; const {px,py} = perp(dx,dy); const d = 4;
          const lines = [];
          if (b.type===1){ lines.push({ox:0, oy:0}); }
          if (b.type===2){ lines.push({ox: d, oy: d*0}); lines.push({ox:-d, oy: -d*0}); }
          if (b.type===3){ lines.push({ox:-d, oy:0}); lines.push({ox:0, oy:0}); lines.push({ox:d, oy:0}); }
          for (const L of lines){
            const ox = L.ox*px, oy = L.oy*py;
            parts.push(`<line class="bond-line" x1="${a.x+ox}" y1="${a.y+oy}" x2="${c.x+ox}" y2="${c.y+oy}" />`);
          }
        }
        // atoms
        for (const n of nodes){
          const sel = selected.has(n.id) ? ' atom-selected' : '';
          parts.push(`<g class="atom${sel}" data-node-id="${n.id}">`+
            `<circle class="atom-circle" cx="${n.x}" cy="${n.y}" r="14" />`+
            `<text class="atom-label" x="${n.x}" y="${n.y+5}" text-anchor="middle">${escapeHtml(n.label||'C')}</text>`+
          `</g>`);
        }
        svg.innerHTML = parts.join('');
      }

      function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

      function addAtomAt(x,y){
        const label = (symbolInput.value||'C').trim()||'C';
        nodes.push({id: nextId++, x, y, label});
        save(); render();
      }

      function createBond(type){
        if (selected.size!==2) return;
        const ids = Array.from(selected);
        const a=ids[0], b=ids[1];
        if (a===b) return;
        // avoid duplicate exact bond
        if (bonds.some(x => (x.a===a && x.b===b) || (x.a===b && x.b===a))) return;
        bonds.push({id: nextId++, a, b, type});
        save(); render();
      }

      function deleteSelection(){
        if (selected.size===0) return;
        const keepIds = new Set(nodes.filter(n => !selected.has(n.id)).map(n => n.id));
        nodes = nodes.filter(n => keepIds.has(n.id));
        bonds = bonds.filter(b => keepIds.has(b.a) && keepIds.has(b.b));
        selected.clear();
        save(); render();
      }

      function clearAll(){ nodes=[]; bonds=[]; selected.clear(); nextId=1; save(); render(); }

      function svgPoint(evt){
        const rect = svg.getBoundingClientRect();
        const x = (evt.clientX - rect.left) / rect.width * 800;
        const y = (evt.clientY - rect.top) / rect.height * 420;
        return {x,y};
      }

      // interactions
      svg.addEventListener('mousedown', (e) => {
        const target = e.target.closest('[data-node-id]');
        if (target){
          const id = Number(target.getAttribute('data-node-id'));
          draggingId = id;
        } else if (mode==='addAtom'){
          const p = svgPoint(e);
          addAtomAt(p.x, p.y);
        }
      });

      svg.addEventListener('mousemove', (e) => {
        if (draggingId!=null){
          const p = svgPoint(e);
          const n = nodes.find(x=>x.id===draggingId);
          if (n){ n.x = p.x; n.y = p.y; render(); }
        }
      });
      window.addEventListener('mouseup', () => { if (draggingId!=null){ save(); draggingId=null; } });

      svg.addEventListener('click', (e) => {
        const el = e.target.closest('[data-node-id]');
        if (el){
          const id = Number(el.getAttribute('data-node-id'));
          if (selected.has(id)) selected.delete(id); else {
            if (selected.size>=2){ selected.clear(); }
            selected.add(id);
          }
          render();
        }
      });

      // toolbar actions
      addAtomBtn.addEventListener('click', () => { mode = mode==='addAtom' ? 'select' : 'addAtom'; addAtomBtn.textContent = mode==='addAtom' ? '添加原子(点按画布)' : '添加原子'; });
      singleBtn.addEventListener('click', () => createBond(1));
      doubleBtn.addEventListener('click', () => createBond(2));
      tripleBtn.addEventListener('click', () => createBond(3));
      applyLabelBtn.addEventListener('click', () => {
        const label = (symbolInput.value||'C').trim()||'C';
        for (const id of selected){ const n = nodes.find(x=>x.id===id); if (n) n.label = label; }
        save(); render();
      });
      delSelBtn.addEventListener('click', deleteSelection);
      clearBtn.addEventListener('click', clearAll);

      exportBtn.addEventListener('click', () => {
        const parts = [];
        parts.push(`<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">`);
        // bonds
        for (const b of bonds){
          const a = nodes.find(n=>n.id===b.a); const c = nodes.find(n=>n.id===b.b);
          if (!a||!c) continue;
          const dx = c.x - a.x, dy = c.y - a.y; const {px,py} = perp(dx,dy); const d = 4;
          const lines = [];
          if (b.type===1){ lines.push({ox:0, oy:0}); }
          if (b.type===2){ lines.push({ox: d, oy: 0}); lines.push({ox:-d, oy: 0}); }
          if (b.type===3){ lines.push({ox:-d, oy:0}); lines.push({ox:0, oy:0}); lines.push({ox:d, oy:0}); }
          for (const L of lines){
            const ox = L.ox*px, oy = L.oy*py;
            parts.push(`<line stroke="#000" stroke-width="2.5" x1="${a.x+ox}" y1="${a.y+oy}" x2="${c.x+ox}" y2="${c.y+oy}" />`);
          }
        }
        // atoms
        for (const n of nodes){
          parts.push(`<circle cx="${n.x}" cy="${n.y}" r="14" fill="#fff" stroke="#000" stroke-width="2" />`);
          parts.push(`<text x="${n.x}" y="${n.y+5}" text-anchor="middle" font-size="14" font-weight="600" fill="#000">${escapeHtml(n.label||'C')}</text>`);
        }
        parts.push(`</svg>`);
        const blob = new Blob(parts, {type:'image/svg+xml'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href=url; a.download='molecule.svg'; a.click();
        setTimeout(()=>URL.revokeObjectURL(url),1000);
      });

      // init
      load(); render();
    })();

    // 哈希与历史
    function updateHash(s){
      try { location.hash = encodeURIComponent(s || ''); } catch {}
    }
    function readHash(){
      const h = location.hash ? location.hash.slice(1) : '';
      try { return decodeURIComponent(h); } catch { return h; }
    }
    function getHistory(){
      try { return JSON.parse(localStorage.getItem('chem-history') || '[]'); } catch { return []; }
    }
    function setHistory(arr){
      try { localStorage.setItem('chem-history', JSON.stringify(arr.slice(0,50))); } catch {}
    }
    function renderHistory(){
      const wrap = document.getElementById('history');
      wrap.innerHTML = '';
      for (const item of getHistory()){
        const btn = document.createElement('button');
        btn.className = 'example-btn';
        btn.type = 'button';
        btn.textContent = item;
        btn.addEventListener('click', () => { document.getElementById('formulaInput').value = item; render(); });
        wrap.appendChild(btn);
      }
    }
    function addToHistory(s){
      s = (s||'').trim();
      if (!s) return;
      const h = getHistory();
      if (h[0] === s) return;
      const filtered = [s, ...h.filter(x => x !== s)].slice(0,50);
      setHistory(filtered);
      renderHistory();
    }
    document.getElementById('clearHistory').addEventListener('click', () => { setHistory([]); renderHistory(); });

    // 校验与警告
    function validateAndWarn(s){
      const warnEl = document.getElementById('warn');
      let msg = '';
      const stack = [];
      const pairs = { '(':')', '[':']', '{':'}' };
      for (const ch of s){
        if (pairs[ch]) stack.push(ch);
        else if (ch === ')' || ch === ']' || ch === '}'){
          const top = stack.pop();
          if (!top || pairs[top] !== ch){ msg = '括号不匹配'; break; }
        }
      }
      if (!msg && stack.length) msg = '存在未关闭的括号';
      // 简单非法字符提示（放宽允许范围）
      const allowed = /[A-Za-z0-9\(\)\[\]\{\}\^\+\-\s\.·→←↔⇌]/;
      if (!msg && s && !Array.from(s).every(c => allowed.test(c))) msg = '包含可能的非法字符';
      if (msg){ warnEl.style.display = 'block'; warnEl.textContent = msg; }
      else { warnEl.style.display = 'none'; warnEl.textContent = ''; }
    }

    // 初始加载
    fillExamples();
    const fromHash = readHash();
    document.getElementById('formulaInput').value = fromHash || 'Fe2(SO4)3·9H2O';
    renderHistory();
    render();
  </script>
</body>
