<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线图片处理工具 - 实用工具箱</title>
    <meta name="description" content="在线图片处理工具，支持图片裁剪、缩放、旋转、滤镜、格式转换、压缩等功能">
    <style>
        :root {
            --primary-color: #5B6AFF;
            --secondary-color: #8C54FF;
            --accent-color: #667EEA;
            --bg-primary: #FFFFFF;
            --bg-secondary: #F5F7FA;
            --bg-card: #FFFFFF;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-muted: #999999;
            --border-color: #E0E0E0;
            --success-color: #10B981;
            --warning-color: #F59E0B;
            --error-color: #EF4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            align-items: start;
        }

        .sidebar {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: sticky;
            top: 20px;
        }

        .main-content {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .upload-section {
            margin-bottom: 25px;
        }

        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 30px 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .upload-area:hover {
            border-color: var(--primary-color);
            background-color: rgba(91, 106, 255, 0.05);
        }

        .upload-area.dragover {
            border-color: var(--primary-color);
            background-color: rgba(91, 106, 255, 0.1);
        }

        .upload-icon {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .upload-text {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .upload-hint {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .file-input {
            display: none;
        }

        .tool-section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tool-group {
            margin-bottom: 20px;
        }

        .tool-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }

        .tool-btn {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-primary);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            text-align: center;
        }

        .tool-btn:hover {
            border-color: var(--primary-color);
            background: rgba(91, 106, 255, 0.05);
        }

        .tool-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 5px;
            color: var(--text-primary);
        }

        .control-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .control-range {
            width: 100%;
            margin: 5px 0;
        }

        .range-value {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-align: center;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            margin-bottom: 8px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--secondary-color);
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--border-color);
        }

        .canvas-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: #f8f9fa;
            overflow: hidden;
        }

        .canvas-wrapper {
            position: relative;
            max-width: 100%;
            max-height: 600px;
        }

        #imageCanvas {
            max-width: 100%;
            max-height: 100%;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .crop-overlay {
            position: absolute;
            border: 2px dashed var(--primary-color);
            background: rgba(91, 106, 255, 0.1);
            cursor: move;
            display: none;
        }

        .crop-handle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--primary-color);
            border: 1px solid white;
            cursor: nw-resize;
        }

        .crop-handle.nw { top: -4px; left: -4px; }
        .crop-handle.ne { top: -4px; right: -4px; cursor: ne-resize; }
        .crop-handle.sw { bottom: -4px; left: -4px; cursor: sw-resize; }
        .crop-handle.se { bottom: -4px; right: -4px; cursor: se-resize; }

        .image-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
            padding: 15px;
            background: var(--bg-secondary);
            border-radius: 8px;
        }

        .info-item {
            text-align: center;
        }

        .info-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .info-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 8px;
        }

        .filter-btn {
            padding: 8px 4px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--bg-primary);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.8rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            border-color: var(--primary-color);
            background: rgba(91, 106, 255, 0.05);
        }

        .filter-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .status-message {
            padding: 10px 15px;
            border-radius: 6px;
            margin: 15px 0;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .status-success {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-error {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        @media (max-width: 1024px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
            
            .sidebar {
                position: static;
                order: 2;
            }
            
            .main-content {
                order: 1;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .tool-buttons {
                grid-template-columns: 1fr;
            }
            
            .filter-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🖼️ 在线图片处理工具</h1>
            <p>支持图片裁剪、缩放、旋转、滤镜、格式转换、压缩等功能</p>
        </div>

        <div class="main-layout">
            <div class="sidebar">
                <div class="upload-section">
                    <h3 class="section-title">📁 上传图片</h3>
                    <div class="upload-area" onclick="document.getElementById('imageInput').click()">
                        <div class="upload-icon">🖼️</div>
                        <div class="upload-text">点击或拖拽上传</div>
                        <div class="upload-hint">支持 JPG, PNG, GIF, WebP</div>
                    </div>
                    <input type="file" id="imageInput" class="file-input" accept="image/*">
                </div>

                <div class="tool-section">
                    <h3 class="section-title">🛠️ 基础工具</h3>
                    <div class="tool-buttons">
                        <div class="tool-btn" onclick="setTool('crop')">✂️ 裁剪</div>
                        <div class="tool-btn" onclick="setTool('resize')">📏 缩放</div>
                        <div class="tool-btn" onclick="setTool('rotate')">🔄 旋转</div>
                        <div class="tool-btn" onclick="setTool('flip')">🔀 翻转</div>
                    </div>
                </div>

                <div class="tool-section">
                    <h3 class="section-title">🎨 滤镜效果</h3>
                    <div class="filter-grid">
                        <div class="filter-btn" onclick="applyFilter('none')">原图</div>
                        <div class="filter-btn" onclick="applyFilter('grayscale')">黑白</div>
                        <div class="filter-btn" onclick="applyFilter('sepia')">复古</div>
                        <div class="filter-btn" onclick="applyFilter('blur')">模糊</div>
                        <div class="filter-btn" onclick="applyFilter('sharpen')">锐化</div>
                        <div class="filter-btn" onclick="applyFilter('vintage')">怀旧</div>
                    </div>
                </div>

                <div class="tool-section">
                    <h3 class="section-title">⚙️ 调整参数</h3>
                    
                    <div class="control-group">
                        <label class="control-label">亮度</label>
                        <input type="range" class="control-range" id="brightnessRange" min="-100" max="100" value="0" oninput="updateAdjustment()">
                        <div class="range-value" id="brightnessValue">0</div>
                    </div>
                    
                    <div class="control-group">
                        <label class="control-label">对比度</label>
                        <input type="range" class="control-range" id="contrastRange" min="-100" max="100" value="0" oninput="updateAdjustment()">
                        <div class="range-value" id="contrastValue">0</div>
                    </div>
                    
                    <div class="control-group">
                        <label class="control-label">饱和度</label>
                        <input type="range" class="control-range" id="saturationRange" min="-100" max="100" value="0" oninput="updateAdjustment()">
                        <div class="range-value" id="saturationValue">0</div>
                    </div>
                </div>

                <div class="tool-section">
                    <h3 class="section-title">💾 导出设置</h3>
                    
                    <div class="control-group">
                        <label class="control-label">输出格式</label>
                        <select class="control-input" id="outputFormat">
                            <option value="image/jpeg">JPEG</option>
                            <option value="image/png">PNG</option>
                            <option value="image/webp">WebP</option>
                        </select>
                    </div>
                    
                    <div class="control-group">
                        <label class="control-label">图片质量</label>
                        <input type="range" class="control-range" id="qualityRange" min="10" max="100" value="90" oninput="updateQuality()">
                        <div class="range-value" id="qualityValue">90%</div>
                    </div>
                    
                    <button class="btn btn-primary" onclick="downloadImage()" disabled id="downloadBtn">
                        💾 下载图片
                    </button>
                    
                    <button class="btn btn-secondary" onclick="resetImage()">
                        🔄 重置图片
                    </button>
                    
                    <button class="btn btn-secondary" onclick="clearAll()">
                        🗑️清空重置
                    </button>
                </div>
            </div>

            <div class="main-content">
                <div id="imageInfo" class="image-info" style="display: none;"></div>
                
                <div class="canvas-container">
                    <div class="canvas-wrapper">
                        <canvas id="imageCanvas"></canvas>
                        <div class="crop-overlay" id="cropOverlay">
                            <div class="crop-handle nw"></div>
                            <div class="crop-handle ne"></div>
                            <div class="crop-handle sw"></div>
                            <div class="crop-handle se"></div>
                        </div>
                    </div>
                </div>
                
                <div id="statusMessage"></div>
                
                <!-- 工具特定控制面板 -->
                <div id="resizeControls" class="tool-section" style="display: none;">
                    <h3 class="section-title">📏 缩放设置</h3>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <div class="control-group">
                            <label class="control-label">宽度 (px)</label>
                            <input type="number" class="control-input" id="resizeWidth" min="1">
                        </div>
                        <div class="control-group">
                            <label class="control-label">高度 (px)</label>
                            <input type="number" class="control-input" id="resizeHeight" min="1">
                        </div>
                    </div>
                    <div style="margin: 10px 0;">
                        <label style="display: flex; align-items: center; gap: 8px;">
                            <input type="checkbox" id="keepAspectRatio" checked>
                            <span>保持宽高比</span>
                        </label>
                    </div>
                    <button class="btn btn-primary" onclick="applyResize()">应用缩放</button>
                </div>
                
                <div id="rotateControls" class="tool-section" style="display: none;">
                    <h3 class="section-title">🔄 旋转设置</h3>
                    <div class="tool-buttons">
                        <div class="tool-btn" onclick="rotateImage(-90)">↺ 左转90°</div>
                        <div class="tool-btn" onclick="rotateImage(90)">↻ 右转90°</div>
                        <div class="tool-btn" onclick="rotateImage(180)">↻ 转180°</div>
                        <div class="tool-btn" onclick="rotateImage(0)">⟲ 重置</div>
                    </div>
                    <div class="control-group">
                        <label class="control-label">自定义角度</label>
                        <input type="range" class="control-range" id="rotateRange" min="-180" max="180" value="0" oninput="updateRotation()">
                        <div class="range-value" id="rotateValue">0°</div>
                    </div>
                </div>
                
                <div id="flipControls" class="tool-section" style="display: none;">
                    <h3 class="section-title">🔀 翻转设置</h3>
                    <div class="tool-buttons">
                        <div class="tool-btn" onclick="flipImage('horizontal')">↔️ 水平翻转</div>
                        <div class="tool-btn" onclick="flipImage('vertical')">↕️ 垂直翻转</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let originalImage = null;
        let currentImage = null;
        let canvas = null;
        let ctx = null;
        let currentTool = null;
        let imageHistory = [];
        let historyIndex = -1;
        
        // 图片调整参数
        let adjustments = {
            brightness: 0,
            contrast: 0,
            saturation: 0,
            rotation: 0,
            flipH: false,
            flipV: false
        };
        
        // 裁剪相关
        let cropData = {
            x: 0, y: 0, width: 0, height: 0,
            isDragging: false, isResizing: false,
            startX: 0, startY: 0
        };

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            canvas = document.getElementById('imageCanvas');
            ctx = canvas.getContext('2d');
            
            const imageInput = document.getElementById('imageInput');
            const uploadArea = document.querySelector('.upload-area');
            
            // 文件选择事件
            imageInput.addEventListener('change', handleFileSelect);
            
            // 拖拽事件
            uploadArea.addEventListener('dragover', handleDragOver);
            uploadArea.addEventListener('dragleave', handleDragLeave);
            uploadArea.addEventListener('drop', handleDrop);
            
            // 裁剪事件
            setupCropEvents();
            
            // 缩放输入事件
            document.getElementById('resizeWidth').addEventListener('input', handleResizeInput);
            document.getElementById('resizeHeight').addEventListener('input', handleResizeInput);
        });

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file && file.type.startsWith('image/')) {
                loadImage(file);
            }
        }

        function handleDragOver(event) {
            event.preventDefault();
            event.currentTarget.classList.add('dragover');
        }

        function handleDragLeave(event) {
            event.currentTarget.classList.remove('dragover');
        }

        function handleDrop(event) {
            event.preventDefault();
            event.currentTarget.classList.remove('dragover');
            
            const files = event.dataTransfer.files;
            if (files.length > 0 && files[0].type.startsWith('image/')) {
                loadImage(files[0]);
            }
        }

        function loadImage(file) {
            const reader = new FileReader();
            
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    originalImage = img;
                    currentImage = img;
                    
                    // 重置所有参数
                    resetAdjustments();
                    
                    // 绘制图片
                    drawImage();
                    
                    // 显示图片信息
                    showImageInfo(file, img);
                    
                    // 启用下载按钮
                    document.getElementById('downloadBtn').disabled = false;
                    
                    // 保存到历史记录
                    saveToHistory();
                    
                    showStatus('图片加载成功', 'success');
                };
                img.src = e.target.result;
            };
            
            reader.readAsDataURL(file);
        }

        function drawImage() {
            if (!currentImage) return;
            
            // 计算画布尺寸
            const maxWidth = 800;
            const maxHeight = 600;
            let { width, height } = calculateDisplaySize(currentImage.width, currentImage.height, maxWidth, maxHeight);
            
            canvas.width = width;
            canvas.height = height;
            
            // 清空画布
            ctx.clearRect(0, 0, width, height);
            
            // 应用变换
            ctx.save();
            
            // 移动到中心点
            ctx.translate(width / 2, height / 2);
            
            // 应用旋转
            if (adjustments.rotation !== 0) {
                ctx.rotate(adjustments.rotation * Math.PI / 180);
            }
            
            // 应用翻转
            if (adjustments.flipH) ctx.scale(-1, 1);
            if (adjustments.flipV) ctx.scale(1, -1);
            
            // 绘制图片
            ctx.drawImage(currentImage, -width / 2, -height / 2, width, height);
            
            ctx.restore();
            
            // 应用滤镜和调整
            applyAdjustments();
        }

        function calculateDisplaySize(imgWidth, imgHeight, maxWidth, maxHeight) {
            let width = imgWidth;
            let height = imgHeight;
            
            // 按比例缩放以适应容器
            if (width > maxWidth) {
                height = (height * maxWidth) / width;
                width = maxWidth;
            }
            
            if (height > maxHeight) {
                width = (width * maxHeight) / height;
                height = maxHeight;
            }
            
            return { width: Math.round(width), height: Math.round(height) };
        }

        function applyAdjustments() {
            if (!ctx) return;
            
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            for (let i = 0; i < data.length; i += 4) {
                let r = data[i];
                let g = data[i + 1];
                let b = data[i + 2];
                
                // 亮度调整
                if (adjustments.brightness !== 0) {
                    r += adjustments.brightness * 2.55;
                    g += adjustments.brightness * 2.55;
                    b += adjustments.brightness * 2.55;
                }
                
                // 对比度调整
                if (adjustments.contrast !== 0) {
                    const factor = (259 * (adjustments.contrast + 255)) / (255 * (259 - adjustments.contrast));
                    r = factor * (r - 128) + 128;
                    g = factor * (g - 128) + 128;
                    b = factor * (b - 128) + 128;
                }
                
                // 饱和度调整
                if (adjustments.saturation !== 0) {
                    const gray = 0.299 * r + 0.587 * g + 0.114 * b;
                    const satFactor = 1 + adjustments.saturation / 100;
                    r = gray + satFactor * (r - gray);
                    g = gray + satFactor * (g - gray);
                    b = gray + satFactor * (b - gray);
                }
                
                // 限制值范围
                data[i] = Math.max(0, Math.min(255, r));
                data[i + 1] = Math.max(0, Math.min(255, g));
                data[i + 2] = Math.max(0, Math.min(255, b));
            }
            
            ctx.putImageData(imageData, 0, 0);
        }

        function setTool(tool) {
            // 清除之前的工具状态
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('[id$="Controls"]').forEach(panel => panel.style.display = 'none');
            hideCropOverlay();
            
            // 设置新工具
            currentTool = tool;
            event.target.classList.add('active');
            
            // 显示对应的控制面板
            const controlPanel = document.getElementById(tool + 'Controls');
            if (controlPanel) {
                controlPanel.style.display = 'block';
            }
            
            // 特殊处理
            if (tool === 'crop') {
                showCropOverlay();
            } else if (tool === 'resize') {
                updateResizeInputs();
            }
        }

        function applyFilter(filterType) {
            if (!originalImage) return;
            
            // 清除滤镜按钮状态
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // 创建临时画布应用滤镜
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = originalImage.width;
            tempCanvas.height = originalImage.height;
            
            // 绘制原图
            tempCtx.drawImage(originalImage, 0, 0);
            
            // 应用滤镜
            switch (filterType) {
                case 'none':
                    // 不做处理
                    break;
                case 'grayscale':
                    applyGrayscaleFilter(tempCtx, tempCanvas.width, tempCanvas.height);
                    break;
                case 'sepia':
                    applySepiaFilter(tempCtx, tempCanvas.width, tempCanvas.height);
                    break;
                case 'blur':
                    tempCtx.filter = 'blur(2px)';
                    tempCtx.drawImage(tempCanvas, 0, 0);
                    tempCtx.filter = 'none';
                    break;
                case 'sharpen':
                    applySharpenFilter(tempCtx, tempCanvas.width, tempCanvas.height);
                    break;
                case 'vintage':
                    applyVintageFilter(tempCtx, tempCanvas.width, tempCanvas.height);
                    break;
            }
            
            // 创建新的图片对象
            const img = new Image();
            img.onload = function() {
                currentImage = img;
                drawImage();
                saveToHistory();
            };
            img.src = tempCanvas.toDataURL();
        }

        function applyGrayscaleFilter(ctx, width, height) {
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            
            for (let i = 0; i < data.length; i += 4) {
                const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                data[i] = gray;
                data[i + 1] = gray;
                data[i + 2] = gray;
            }
            
            ctx.putImageData(imageData, 0, 0);
        }

        function applySepiaFilter(ctx, width, height) {
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                
                data[i] = Math.min(255, (r * 0.393) + (g * 0.769) + (b * 0.189));
                data[i + 1] = Math.min(255, (r * 0.349) + (g * 0.686) + (b * 0.168));
                data[i + 2] = Math.min(255, (r * 0.272) + (g * 0.534) + (b * 0.131));
            }
            
            ctx.putImageData(imageData, 0, 0);
        }

        function applySharpenFilter(ctx, width, height) {
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            const output = new Uint8ClampedArray(data);
            
            const kernel = [
                0, -1, 0,
                -1, 5, -1,
                0, -1, 0
            ];
            
            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    for (let c = 0; c < 3; c++) {
                        let sum = 0;
                        for (let ky = -1; ky <= 1; ky++) {
                            for (let kx = -1; kx <= 1; kx++) {
                                const idx = ((y + ky) * width + (x + kx)) * 4 + c;
                                sum += data[idx] * kernel[(ky + 1) * 3 + (kx + 1)];
                            }
                        }
                        output[(y * width + x) * 4 + c] = Math.max(0, Math.min(255, sum));
                    }
                }
            }
            
            const newImageData = new ImageData(output, width, height);
            ctx.putImageData(newImageData, 0, 0);
        }

        function applyVintageFilter(ctx, width, height) {
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            
            for (let i = 0; i < data.length; i += 4) {
                let r = data[i];
                let g = data[i + 1];
                let b = data[i + 2];
                
                // 增加红色和黄色调
                r = Math.min(255, r * 1.2);
                g = Math.min(255, g * 1.1);
                b = Math.max(0, b * 0.8);
                
                // 降低饱和度
                const gray = 0.299 * r + 0.587 * g + 0.114 * b;
                r = gray * 0.4 + r * 0.6;
                g = gray * 0.4 + g * 0.6;
                b = gray * 0.4 + b * 0.6;
                
                data[i] = r;
                data[i + 1] = g;
                data[i + 2] = b;
            }
            
            ctx.putImageData(imageData, 0, 0);
        }

        function updateAdjustment() {
            adjustments.brightness = parseInt(document.getElementById('brightnessRange').value);
            adjustments.contrast = parseInt(document.getElementById('contrastRange').value);
            adjustments.saturation = parseInt(document.getElementById('saturationRange').value);
            
            document.getElementById('brightnessValue').textContent = adjustments.brightness;
            document.getElementById('contrastValue').textContent = adjustments.contrast;
            document.getElementById('saturationValue').textContent = adjustments.saturation;
            
            drawImage();
        }

        function updateQuality() {
            const quality = document.getElementById('qualityRange').value;
            document.getElementById('qualityValue').textContent = quality + '%';
        }

        function updateResizeInputs() {
            if (!currentImage) return;
            
            document.getElementById('resizeWidth').value = currentImage.width;
            document.getElementById('resizeHeight').value = currentImage.height;
        }

        function handleResizeInput() {
            if (!document.getElementById('keepAspectRatio').checked) return;
            
            const widthInput = document.getElementById('resizeWidth');
            const heightInput = document.getElementById('resizeHeight');
            const aspectRatio = currentImage.width / currentImage.height;
            
            if (event.target === widthInput) {
                heightInput.value = Math.round(widthInput.value / aspectRatio);
            } else {
                widthInput.value = Math.round(heightInput.value * aspectRatio);
            }
        }

        function applyResize() {
            if (!currentImage) return;
            
            const newWidth = parseInt(document.getElementById('resizeWidth').value);
            const newHeight = parseInt(document.getElementById('resizeHeight').value);
            
            if (newWidth <= 0 || newHeight <= 0) {
                showStatus('请输入有效的尺寸', 'error');
                return;
            }
            
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = newWidth;
            tempCanvas.height = newHeight;
            
            tempCtx.drawImage(currentImage, 0, 0, newWidth, newHeight);
            
            const img = new Image();
            img.onload = function() {
                currentImage = img;
                drawImage();
                saveToHistory();
                showStatus('缩放应用成功', 'success');
            };
            img.src = tempCanvas.toDataURL();
        }

        function rotateImage(angle) {
            if (angle === 0) {
                adjustments.rotation = 0;
                document.getElementById('rotateRange').value = 0;
                document.getElementById('rotateValue').textContent = '0°';
            } else {
                adjustments.rotation = (adjustments.rotation + angle) % 360;
                document.getElementById('rotateRange').value = adjustments.rotation;
                document.getElementById('rotateValue').textContent = adjustments.rotation + '°';
            }
            
            drawImage();
        }

        function updateRotation() {
            adjustments.rotation = parseInt(document.getElementById('rotateRange').value);
            document.getElementById('rotateValue').textContent = adjustments.rotation + '°';
            drawImage();
        }

        function flipImage(direction) {
            if (direction === 'horizontal') {
                adjustments.flipH = !adjustments.flipH;
            } else {
                adjustments.flipV = !adjustments.flipV;
            }
            
            drawImage();
        }

        function setupCropEvents() {
            const cropOverlay = document.getElementById('cropOverlay');
            
            cropOverlay.addEventListener('mousedown', startCrop);
            document.addEventListener('mousemove', updateCrop);
            document.addEventListener('mouseup', endCrop);
        }

        function showCropOverlay() {
            if (!currentImage) return;
            
            const cropOverlay = document.getElementById('cropOverlay');
            const canvasRect = canvas.getBoundingClientRect();
            
            // 初始化裁剪区域为图片中心的50%
            const cropWidth = canvas.width * 0.5;
            const cropHeight = canvas.height * 0.5;
            const cropX = (canvas.width - cropWidth) / 2;
            const cropY = (canvas.height - cropHeight) / 2;
            
            cropData = {
                x: cropX, y: cropY,
                width: cropWidth, height: cropHeight,
                isDragging: false, isResizing: false,
                startX: 0, startY: 0
            };
            
            updateCropOverlay();
            cropOverlay.style.display = 'block';
        }

        function hideCropOverlay() {
            document.getElementById('cropOverlay').style.display = 'none';
        }

        function updateCropOverlay() {
            const cropOverlay = document.getElementById('cropOverlay');
            const canvasRect = canvas.getBoundingClientRect();
            
            cropOverlay.style.left = cropData.x + 'px';
            cropOverlay.style.top = cropData.y + 'px';
            cropOverlay.style.width = cropData.width + 'px';
            cropOverlay.style.height = cropData.height + 'px';
        }

        function startCrop(event) {
            event.preventDefault();
            cropData.isDragging = true;
            cropData.startX = event.clientX;
            cropData.startY = event.clientY;
        }

        function updateCrop(event) {
            if (!cropData.isDragging) return;
            
            const deltaX = event.clientX - cropData.startX;
            const deltaY = event.clientY - cropData.startY;
            
            cropData.x = Math.max(0, Math.min(canvas.width - cropData.width, cropData.x + deltaX));
            cropData.y = Math.max(0, Math.min(canvas.height - cropData.height, cropData.y + deltaY));
            
            cropData.startX = event.clientX;
            cropData.startY = event.clientY;
            
            updateCropOverlay();
        }

        function endCrop() {
            cropData.isDragging = false;
        }

        function applyCrop() {
            if (!currentImage || currentTool !== 'crop') return;
            
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            
            // 计算实际裁剪区域（考虑显示缩放）
            const scaleX = currentImage.width / canvas.width;
            const scaleY = currentImage.height / canvas.height;
            
            const cropX = cropData.x * scaleX;
            const cropY = cropData.y * scaleY;
            const cropWidth = cropData.width * scaleX;
            const cropHeight = cropData.height * scaleY;
            
            tempCanvas.width = cropWidth;
            tempCanvas.height = cropHeight;
            
            tempCtx.drawImage(currentImage, cropX, cropY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);
            
            const img = new Image();
            img.onload = function() {
                currentImage = img;
                drawImage();
                hideCropOverlay();
                saveToHistory();
                showStatus('裁剪应用成功', 'success');
            };
            img.src = tempCanvas.toDataURL();
        }

        function showImageInfo(file, img) {
            const fileSize = (file.size / 1024).toFixed(2);
            const imageInfo = document.getElementById('imageInfo');
            
            imageInfo.innerHTML = `
                <div class="info-item">
                    <div class="info-value">${img.width}</div>
                    <div class="info-label">宽度</div>
                </div>
                <div class="info-item">
                    <div class="info-value">${img.height}</div>
                    <div class="info-label">高度</div>
                </div>
                <div class="info-item">
                    <div class="info-value">${fileSize} KB</div>
                    <div class="info-label">文件大小</div>
                </div>
                <div class="info-item">
                    <div class="info-value">${file.type.split('/')[1].toUpperCase()}</div>
                    <div class="info-label">格式</div>
                </div>
            `;
            
            imageInfo.style.display = 'grid';
        }

        function downloadImage() {
            if (!canvas) return;
            
            const format = document.getElementById('outputFormat').value;
            const quality = document.getElementById('qualityRange').value / 100;
            
            const link = document.createElement('a');
            link.download = `processed_image.${format.split('/')[1]}`;
            link.href = canvas.toDataURL(format, quality);
            link.click();
            
            showStatus('图片下载成功', 'success');
        }

        function resetImage() {
            if (!originalImage) return;
            
            currentImage = originalImage;
            resetAdjustments();
            drawImage();
            saveToHistory();
            showStatus('图片已重置', 'success');
        }

        function resetAdjustments() {
            adjustments = {
                brightness: 0,
                contrast: 0,
                saturation: 0,
                rotation: 0,
                flipH: false,
                flipV: false
            };
            
            // 重置UI控件
            document.getElementById('brightnessRange').value = 0;
            document.getElementById('contrastRange').value = 0;
            document.getElementById('saturationRange').value = 0;
            document.getElementById('rotateRange').value = 0;
            document.getElementById('brightnessValue').textContent = '0';
            document.getElementById('contrastValue').textContent = '0';
            document.getElementById('saturationValue').textContent = '0';
            document.getElementById('rotateValue').textContent = '0°';
        }

        function clearAll() {
            originalImage = null;
            currentImage = null;
            currentTool = null;
            imageHistory = [];
            historyIndex = -1;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            document.getElementById('imageInput').value = '';
            document.getElementById('imageInfo').style.display = 'none';
            document.getElementById('downloadBtn').disabled = true;
            
            // 清除工具状态
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('[id$="Controls"]').forEach(panel => panel.style.display = 'none');
            
            hideCropOverlay();
            resetAdjustments();
            
            showStatus('已清空重置', 'success');
        }

        function saveToHistory() {
            if (!canvas) return;
            
            // 限制历史记录数量
            if (imageHistory.length > 10) {
                imageHistory.shift();
            }
            
            const imageData = canvas.toDataURL();
            imageHistory.push(imageData);
            historyIndex = imageHistory.length - 1;
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.className = `status-message status-${type === 'error' ? 'error' : 'success'}`;
            statusDiv.textContent = message;
            statusDiv.style.display = 'block';
            
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
