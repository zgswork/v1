<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批量图片转圆形图标工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #8BC6EC 0%, #9599E2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            margin-top: 20px;
        }
        
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
            font-size: 2.2rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        
        .upload-container {
            border: 3px dashed #6a89cc;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            margin-bottom: 25px;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.5);
        }
        
        .upload-container:hover {
            background: rgba(255, 255, 255, 0.7);
        }
        
        .upload-container.drag-over {
            background: rgba(106, 137, 204, 0.3);
            border-color: #4a69bd;
        }
        
        .upload-icon {
            font-size: 50px;
            color: #6a89cc;
            margin-bottom: 15px;
        }
        
        .upload-text {
            margin-bottom: 20px;
            font-size: 18px;
            color: #4a69bd;
        }
        
        .btn {
            background: linear-gradient(to right, #6a89cc, #4a69bd);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-secondary {
            background: linear-gradient(to right, #82ccdd, #60a3bc);
        }
        
        .btn-danger {
            background: linear-gradient(to right, #e55039, #eb2f06);
        }
        
        .btn-disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        
        .btn-disabled:hover {
            transform: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }
        
        .preview-container {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        
        .preview-title {
            margin-bottom: 15px;
            font-size: 20px;
            color: #4a69bd;
        }
        
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        
        .preview-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .preview-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid #82ccdd;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            object-fit: cover;
            margin-bottom: 10px;
        }
        
        .preview-name {
            font-size: 14px;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
            max-width: 120px;
            text-align: center;
            color: #4a69bd;
            font-weight: 500;
        }
        
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        
        .file-input {
            display: none;
        }
        
        .hint {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }
        
        .counter {
            text-align: center;
            margin: 10px 0;
            font-weight: 600;
            color: #4a69bd;
        }
        
        .selected-files {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }
        
        .selected-files h3 {
            margin-bottom: 10px;
            color: #4a69bd;
            font-size: 16px;
            text-align: center;
        }
        
        .file-list {
            list-style-type: none;
        }
        
        .file-list li {
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .file-list li:last-child {
            border-bottom: none;
        }
        
        .remove-btn {
            background: #e55039;
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .remove-btn:hover {
            background: #eb2f06;
            transform: scale(1.1);
        }
        
        .status-message {
            text-align: center;
            margin: 10px 0;
            padding: 10px;
            border-radius: 8px;
            font-weight: 500;
        }
        
        .status-success {
            background: #d1f0d9;
            color: #2e8b57;
        }
        
        .status-error {
            background: #f8d7da;
            color: #dc3545;
        }
        
        .footer {
            margin-top: 30px;
            text-align: center;
            color: white;
            font-size: 14px;
        }
        
        .signature {
            color: #ff0000;
            font-weight: bold;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .upload-container {
                padding: 20px;
            }
            
            .action-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                margin-bottom: 10px;
            }
            
            .preview-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <h1>批量图片转圆形图标工具</h1>
    <p class="subtitle">上传最多10张图片，批量生成圆形图标，一键下载</p>
    
    <div class="container">
        <div class="upload-container" id="dropArea">
            <div class="upload-icon">📁</div>
            <p class="upload-text">拖放图片到这里或点击上传</p>
            <p class="counter">已选择 <span id="fileCount">0</span>/10 张图片</p>
            <input type="file" id="fileInput" class="file-input" accept="image/*" multiple>
            <button class="btn" id="selectButton">选择图片</button>
        </div>
        
        <div class="selected-files" id="selectedFilesContainer">
            <h3>已选文件</h3>
            <ul class="file-list" id="fileList"></ul>
        </div>
        
        <div id="statusMessage" class="status-message" style="display: none;"></div>
        
        <div class="preview-container" id="previewContainer">
            <h3 class="preview-title">预览</h3>
            <div class="preview-grid" id="previewGrid"></div>
            
            <div class="action-buttons">
                <button class="btn" id="downloadAllBtn">下载全部图标</button>
                <button class="btn btn-secondary" id="downloadZipBtn">打包下载(ZIP)</button>
                <button class="btn btn-danger" id="resetBtn">重新选择</button>
            </div>
        </div>
        
        <p class="hint">支持JPG、PNG、GIF等格式，单文件最大5MB，最多10张</p>
    </div>

    <div class="footer">
        本工具由<span class="signature">@深圳老易</span>使用AI制作
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const fileInput = document.getElementById('fileInput');
            const selectButton = document.getElementById('selectButton');
            const dropArea = document.getElementById('dropArea');
            const previewContainer = document.getElementById('previewContainer');
            const previewGrid = document.getElementById('previewGrid');
            const downloadAllBtn = document.getElementById('downloadAllBtn');
            const downloadZipBtn = document.getElementById('downloadZipBtn');
            const resetBtn = document.getElementById('resetBtn');
            const fileList = document.getElementById('fileList');
            const fileCount = document.getElementById('fileCount');
            const selectedFilesContainer = document.getElementById('selectedFilesContainer');
            const statusMessage = document.getElementById('statusMessage');
            
            let files = [];
            let processedImages = []; // 存储已处理的图像数据
            const MAX_FILES = 10;
            const MAX_SIZE = 5 * 1024 * 1024; // 5MB
            
            // 点击选择按钮触发文件输入
            selectButton.addEventListener('click', () => {
                fileInput.click();
            });
            
            // 文件选择处理
            fileInput.addEventListener('change', handleFileSelect);
            
            // 拖放事件处理
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, preventDefaults, false);
            });
            
            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }
            
            ['dragenter', 'dragover'].forEach(eventName => {
                dropArea.addEventListener(eventName, highlight, false);
            });
            
            ['dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, unhighlight, false);
            });
            
            function highlight() {
                dropArea.classList.add('drag-over');
            }
            
            function unhighlight() {
                dropArea.classList.remove('drag-over');
            }
            
            dropArea.addEventListener('drop', handleDrop, false);
            
            function handleDrop(e) {
                const dt = e.dataTransfer;
                const newFiles = dt.files;
                handleFiles(newFiles);
            }
            
            function handleFileSelect(e) {
                const newFiles = e.target.files;
                handleFiles(newFiles);
            }
            
            function handleFiles(newFiles) {
                if (newFiles.length === 0) return;
                
                // 检查文件数量限制
                if (files.length + newFiles.length > MAX_FILES) {
                    showMessage(`最多只能上传${MAX_FILES}张图片！您已选择${files.length}张，还可以选择${MAX_FILES - files.length}张`, 'error');
                    return;
                }
                
                let validFilesAdded = 0;
                
                for (let i = 0; i < newFiles.length; i++) {
                    const file = newFiles[i];
                    
                    // 检查文件类型
                    if (!file.type.match('image.*')) {
                        showMessage(`"${file.name}"不是图像文件！`, 'error');
                        continue;
                    }
                    
                    // 检查文件大小
                    if (file.size > MAX_SIZE) {
                        showMessage(`"${file.name}"大小超过5MB限制！`, 'error');
                        continue;
                    }
                    
                    // 检查是否已存在同名文件
                    if (files.some(f => f.name === file.name)) {
                        showMessage(`"${file.name}"已经存在！`, 'error');
                        continue;
                    }
                    
                    // 添加到文件列表
                    if (files.length < MAX_FILES) {
                        files.push(file);
                        addFileToList(file);
                        validFilesAdded++;
                    }
                }
                
                if (validFilesAdded > 0) {
                    showMessage(`成功添加${validFilesAdded}张图片`, 'success');
                    processNewFiles(); // 只处理新添加的文件
                }
                
                updateFileCount();
            }
            
            function addFileToList(file) {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span>${file.name}</span>
                    <button class="remove-btn" data-name="${file.name}">×</button>
                `;
                fileList.appendChild(li);
                
                // 添加移除按钮事件
                li.querySelector('.remove-btn').addEventListener('click', function() {
                    const fileName = this.getAttribute('data-name');
                    removeFile(fileName);
                });
            }
            
            function removeFile(fileName) {
                files = files.filter(file => file.name !== fileName);
                processedImages = processedImages.filter(img => img.fileName !== fileName);
                updateFileList();
                updateFileCount();
                renderPreviews();
                showMessage(`已移除: ${fileName}`, 'success');
            }
            
            function updateFileList() {
                fileList.innerHTML = '';
                files.forEach(file => addFileToList(file));
            }
            
            function updateFileCount() {
                fileCount.textContent = files.length;
                
                // 显示/隐藏已选文件列表
                if (files.length > 0) {
                    selectedFilesContainer.style.display = 'block';
                } else {
                    selectedFilesContainer.style.display = 'none';
                    previewContainer.style.display = 'none';
                }
            }
            
            function showMessage(message, type) {
                statusMessage.textContent = message;
                statusMessage.className = `status-message status-${type}`;
                statusMessage.style.display = 'block';
                
                // 3秒后隐藏消息
                setTimeout(() => {
                    statusMessage.style.display = 'none';
                }, 3000);
            }
            
            function processNewFiles() {
                if (files.length === 0) {
                    previewContainer.style.display = 'none';
                    return;
                }
                
                // 只处理尚未处理的文件
                const unprocessedFiles = files.filter(file => 
                    !processedImages.some(img => img.fileName === file.name)
                );
                
                if (unprocessedFiles.length === 0) {
                    renderPreviews();
                    return;
                }
                
                let processed = 0;
                
                // 处理每个新文件
                unprocessedFiles.forEach((file) => {
                    const reader = new FileReader();
                    
                    reader.onload = function(e) {
                        const img = new Image();
                        img.onload = function() {
                            // 创建圆形图标
                            const canvas = document.createElement('canvas');
                            const size = Math.min(img.width, img.height);
                            canvas.width = size;
                            canvas.height = size;
                            
                            const ctx = canvas.getContext('2d');
                            
                            // 绘制圆形路径
                            ctx.beginPath();
                            ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
                            ctx.closePath();
                            ctx.clip();
                            
                            // 绘制图像
                            ctx.drawImage(
                                img,
                                (img.width - size) / 2,
                                (img.height - size) / 2,
                                size,
                                size,
                                0,
                                0,
                                size,
                                size
                            );
                            
                            // 存储处理后的图像数据
                            processedImages.push({
                                fileName: file.name,
                                dataUrl: canvas.toDataURL('image/png')
                            });
                            
                            processed++;
                            
                            // 当所有新文件处理完成时，重新渲染预览
                            if (processed === unprocessedFiles.length) {
                                renderPreviews();
                                showMessage(`已处理 ${processed} 张新图片`, 'success');
                            }
                        };
                        img.src = e.target.result;
                    };
                    
                    reader.readAsDataURL(file);
                });
            }
            
            function renderPreviews() {
                if (processedImages.length === 0) {
                    previewContainer.style.display = 'none';
                    return;
                }
                
                previewGrid.innerHTML = '';
                
                // 渲染所有已处理的图片
                processedImages.forEach((img, index) => {
                    // 创建预览项
                    const previewItem = document.createElement('div');
                    previewItem.className = 'preview-item';
                    
                    const imgElement = document.createElement('img');
                    imgElement.className = 'preview-img';
                    imgElement.src = img.dataUrl;
                    imgElement.dataset.index = index;
                    
                    const fileName = document.createElement('div');
                    fileName.className = 'preview-name';
                    fileName.textContent = img.fileName;
                    
                    const downloadBtn = document.createElement('button');
                    downloadBtn.className = 'btn';
                    downloadBtn.textContent = '下载';
                    downloadBtn.style.padding = '8px 15px';
                    downloadBtn.style.marginTop = '8px';
                    downloadBtn.style.fontSize = '14px';
                    downloadBtn.onclick = function() {
                        downloadImage(img.dataUrl, img.fileName);
                    };
                    
                    previewItem.appendChild(imgElement);
                    previewItem.appendChild(fileName);
                    previewItem.appendChild(downloadBtn);
                    previewGrid.appendChild(previewItem);
                });
                
                previewContainer.style.display = 'block';
            }
            
            function downloadImage(dataUrl, fileName) {
                const link = document.createElement('a');
                link.download = getCircleFileName(fileName);
                link.href = dataUrl;
                link.click();
                showMessage(`已下载: ${getCircleFileName(fileName)}`, 'success');
            }
            
            function downloadAllImages() {
                if (processedImages.length === 0) {
                    showMessage('没有可下载的图片', 'error');
                    return;
                }
                
                processedImages.forEach(img => {
                    const link = document.createElement('a');
                    link.download = getCircleFileName(img.fileName);
                    link.href = img.dataUrl;
                    link.click();
                });
                
                showMessage(`已下载全部${processedImages.length}张图片`, 'success');
            }
            
            function downloadAsZip() {
                if (processedImages.length === 0) {
                    showMessage('没有可打包的图片', 'error');
                    return;
                }
                
                showMessage('正在创建ZIP文件，请稍候...', 'success');
                
                const zip = new JSZip();
                
                processedImages.forEach(img => {
                    // 从dataURL中提取base64数据
                    const base64Data = img.dataUrl.split(',')[1];
                    zip.file(getCircleFileName(img.fileName), base64Data, {base64: true});
                });
                
                zip.generateAsync({type: "blob"})
                .then(function(content) {
                    saveAs(content, "圆形图标合集.zip");
                    showMessage(`ZIP文件已生成，包含${processedImages.length}张图片`, 'success');
                })
                .catch(function(err) {
                    showMessage('创建ZIP文件时出错: ' + err.message, 'error');
                });
            }
            
            function getCircleFileName(originalName) {
                const dotIndex = originalName.lastIndexOf('.');
                const name = dotIndex !== -1 ? originalName.substring(0, dotIndex) : originalName;
                const ext = dotIndex !== -1 ? originalName.substring(dotIndex) : '.png';
                return `${name}_圆形${ext}`;
            }
            
            // 下载全部按钮
            downloadAllBtn.addEventListener('click', downloadAllImages);
            
            // 打包下载按钮
            downloadZipBtn.addEventListener('click', downloadAsZip);
            
            // 重置按钮
            resetBtn.addEventListener('click', function() {
                files = [];
                processedImages = [];
                fileInput.value = '';
                updateFileList();
                updateFileCount();
                previewContainer.style.display = 'none';
                showMessage('已重置所有选择', 'success');
            });
            
            // 初始化
            updateFileCount();
        });
    </script>
</body>
</html>
