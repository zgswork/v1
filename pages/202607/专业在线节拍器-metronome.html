<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专业在线节拍器</title>
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --accent-color: #4cc9f0;
            --background-color: #f8f9fa;
            --card-color: #ffffff;
            --text-color: #212529;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .dark-theme {
            --background-color: #121212;
            --card-color: #1e1e1e;
            --text-color: #f8f9fa;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background-color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: var(--card-color);
            border-radius: 16px;
            padding: 30px;
            box-shadow: var(--shadow);
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
        }

        h1 {
            margin-bottom: 24px;
            font-weight: 600;
            color: var(--primary-color);
        }

        .instructions {
            background-color: rgba(67, 97, 238, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: left;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .instructions h3 {
            margin-bottom: 8px;
            color: var(--primary-color);
        }

        .instructions ul {
            padding-left: 20px;
        }

        .instructions li {
            margin-bottom: 5px;
        }

        .bpm-control {
            margin-bottom: 30px;
        }

        .bpm-display {
            font-size: 5rem;
            font-weight: 700;
            margin: 20px 0;
            color: var(--primary-color);
            transition: all 0.15s ease;
        }

        .bpm-display.active {
            color: var(--accent-color);
            transform: scale(1.05);
        }

        .slider-container {
            width: 100%;
            margin: 20px 0;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 10px;
            border-radius: 5px;
            background: #ddd;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: var(--secondary-color);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: var(--primary-color);
            color: white;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.secondary {
            background-color: #6c757d;
        }

        .btn.secondary:hover {
            background-color: #5a6268;
        }

        .btn:after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: rgba(255, 255, 255, 0.5);
            opacity: 0;
            border-radius: 100%;
            transform: scale(1, 1) translate(-50%, -50%);
            transform-origin: 50% 50%;
        }

        .btn:focus:not(:active)::after {
            animation: ripple 0.6s ease-out;
        }

        @keyframes ripple {
            0% {
                transform: scale(0, 0);
                opacity: 0.5;
            }
            100% {
                transform: scale(20, 20);
                opacity: 0;
            }
        }

        .settings {
            margin-top: 30px;
            text-align: left;
        }

        .setting-item {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary-color);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        .visualizer {
            position: relative;
            height: 150px;
            margin: 25px 0;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 5px;
        }

        .visualizer-bar {
            width: 12px;
            background: var(--accent-color);
            border-radius: 6px 6px 0 0;
            transition: height 0.1s ease;
        }

        .preset-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 15px 0;
            justify-content: center;
        }

        .preset-btns button {
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid var(--primary-color);
            background: transparent;
            color: var(--primary-color);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .preset-btns button:hover {
            background: var(--primary-color);
            color: white;
        }

        select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            background: var(--card-color);
            color: var(--text-color);
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .theme-toggle button {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .theme-toggle button:hover {
            background: rgba(0,0,0,0.1);
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            .bpm-display {
                font-size: 4rem;
            }
            
            .instructions {
                font-size: 0.8rem;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="theme-toggle">
            <button id="themeBtn">🌓</button>
        </div>
        
        <h1>专业在线节拍器</h1>
        
        <div class="instructions">
            <h3>使用说明</h3>
            <ul>
                <li><strong>开始/停止</strong>：点击中央按钮控制节拍器运行</li>
                <li><strong>调整速度</strong>：拖动滑块或使用±10按钮调整BPM（每分钟节拍数）</li>
                <li><strong>预设速度</strong>：点击预设按钮快速设置常用速度</li>
                <li><strong>节拍模式</strong>：选择不同的拍号（如4/4、3/4等）</li>
                <li><strong>音色选择</strong>：切换不同的节拍音色</li>
                <li><strong>强拍音效</strong>：开启后第一拍会使用不同的音高</li>
                <li><strong>震动反馈</strong>：在支持的设备上提供触觉反馈</li>
                <li><strong>主题切换</strong>：点击右上角图标切换亮/暗模式</li>
            </ul>
            <p>提示：所有设置会自动保存，下次使用时将恢复您的偏好设置。</p>
        </div>
        
        <div class="bpm-display" id="bpmDisplay">120</div>
        
        <div class="visualizer" id="visualizer"></div>
        
        <div class="preset-btns">
            <button data-bpm="40">极慢 (40)</button>
            <button data-bpm="60">慢速 (60)</button>
            <button data-bpm="90">中速 (90)</button>
            <button data-bpm="120">标准 (120)</button>
            <button data-bpm="180">快速 (180)</button>
        </div>
        
        <div class="slider-container">
            <input type="range" id="bpmSlider" min="40" max="240" value="120" step="1">
        </div>
        
        <div class="controls">
            <button class="btn secondary" id="decreaseBpm">-10</button>
            <button class="btn" id="toggleMetronome">开始</button>
            <button class="btn secondary" id="increaseBpm">+10</button>
        </div>
        
        <div class="settings">
            <div class="setting-item">
                <span>声音提示</span>
                <label class="switch">
                    <input type="checkbox" id="soundToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-item">
                <span>震动反馈</span>
                <label class="switch">
                    <input type="checkbox" id="vibrationToggle">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-item">
                <span>强拍音效</span>
                <label class="switch">
                    <input type="checkbox" id="accentToggle">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-item">
                <span>节拍模式</span>
                <select id="beatPattern">
                    <option value="1">1/4</option>
                    <option value="2">2/4</option>
                    <option value="3">3/4</option>
                    <option value="4" selected>4/4</option>
                    <option value="6">6/8</option>
                </select>
            </div>
            <div class="setting-item">
                <span>音色选择</span>
                <select id="soundType">
                    <option value="sine">正弦波</option>
                    <option value="square">方波</option>
                    <option value="sawtooth">锯齿波</option>
                    <option value="triangle">三角波</option>
                </select>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // DOM元素
            const bpmDisplay = document.getElementById('bpmDisplay');
            const bpmSlider = document.getElementById('bpmSlider');
            const toggleBtn = document.getElementById('toggleMetronome');
            const decreaseBtn = document.getElementById('decreaseBpm');
            const increaseBtn = document.getElementById('increaseBpm');
            const soundToggle = document.getElementById('soundToggle');
            const vibrationToggle = document.getElementById('vibrationToggle');
            const accentToggle = document.getElementById('accentToggle');
            const visualizer = document.getElementById('visualizer');
            const themeBtn = document.getElementById('themeBtn');
            
            // 音频上下文和计时器
            let audioContext;
            let nextBeatTime = 0;
            let timerId = null;
            let isPlaying = false;
            let currentBpm = 120;
            let beatCount = 0;
            let lastVisualUpdate = 0;
            
            // 初始化动态条
            const bars = [];
            for (let i = 0; i < 16; i++) {
                const bar = document.createElement('div');
                bar.className = 'visualizer-bar';
                bar.style.height = '5px';
                visualizer.appendChild(bar);
                bars.push(bar);
            }
            
            // 初始化音频上下文
            function initAudioContext() {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            
            // 更新BPM显示
            function updateBpmDisplay() {
                bpmDisplay.style.transform = 'scale(1.1)';
                bpmDisplay.style.color = '#ff2d75';
                setTimeout(() => {
                    bpmDisplay.textContent = currentBpm;
                    bpmDisplay.style.transform = 'scale(1)';
                    bpmDisplay.style.color = '';
                }, 150);
                bpmSlider.value = currentBpm;
            }
            
            // 安排节拍
            function scheduleBeat(time, isAccent) {
                if (!soundToggle.checked) return;
                
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                const soundType = document.getElementById('soundType').value;
                
                oscillator.type = soundType;
                oscillator.frequency.value = isAccent ? 
                    (soundType === 'sine' ? 1000 : 800) : 
                    (soundType === 'sine' ? 800 : 600);
                gainNode.gain.value = isAccent ? 0.5 : 0.3;
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.start(time);
                gainNode.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
                oscillator.stop(time + 0.1);
                
                // 视觉反馈
                if (Date.now() - lastVisualUpdate > 16) { // 约60fps
                    lastVisualUpdate = Date.now();
                    requestAnimationFrame(() => {
                        bars.forEach((bar, index) => {
                            if (index === beatCount % 16) {
                                bar.style.height = isAccent ? '100%' : '70%';
                                bar.style.background = isAccent ? '#ff2d75' : 'var(--accent-color)';
                            } else {
                                const currentHeight = parseInt(bar.style.height);
                                bar.style.height = Math.max(5, currentHeight * 0.7) + 'px';
                            }
                        });
                    });
                }
                
                // 震动反馈
                if (vibrationToggle.checked && navigator.vibrate) {
                    navigator.vibrate(isAccent ? [100] : [50]);
                }
            }
            
            // 开始节拍器
            function startMetronome() {
                if (timerId) cancelAnimationFrame(timerId);
                
                initAudioContext();
                nextBeatTime = audioContext.currentTime;
                beatCount = 0;
                const pattern = parseInt(document.getElementById('beatPattern').value);
                
                function scheduler() {
                    while (nextBeatTime < audioContext.currentTime + 0.1) {
                        beatCount++;
                        const isAccent = accentToggle.checked && (beatCount % pattern === 1);
                        scheduleBeat(nextBeatTime, isAccent);
                        nextBeatTime += 60 / currentBpm;
                    }
                    timerId = requestAnimationFrame(scheduler);
                }
                
                scheduler();
                isPlaying = true;
                toggleBtn.textContent = '停止';
                bpmDisplay.classList.add('active');
            }
            
            // 停止节拍器
            function stopMetronome() {
                cancelAnimationFrame(timerId);
                timerId = null;
                isPlaying = false;
                toggleBtn.textContent = '开始';
                bpmDisplay.classList.remove('active');
                
                // 重置动态条
                bars.forEach(bar => {
                    bar.style.height = '5px';
                });
            }
            
            // 切换节拍器状态
            function toggleMetronome() {
                if (isPlaying) {
                    stopMetronome();
                } else {
                    startMetronome();
                }
                saveSettings();
            }
            
            // 保存设置
            function saveSettings() {
                const settings = {
                    bpm: currentBpm,
                    sound: soundToggle.checked,
                    vibration: vibrationToggle.checked,
                    accent: accentToggle.checked,
                    pattern: document.getElementById('beatPattern').value,
                    soundType: document.getElementById('soundType').value,
                    theme: document.body.classList.contains('dark-theme') ? 'dark' : 'light',
                    playing: isPlaying
                };
                localStorage.setItem('metronomeSettings', JSON.stringify(settings));
            }
            
            // 加载设置
            function loadSettings() {
                const saved = JSON.parse(localStorage.getItem('metronomeSettings'));
                if (saved) {
                    currentBpm = saved.bpm || 120;
                    soundToggle.checked = saved.sound !== false;
                    vibrationToggle.checked = saved.vibration || false;
                    accentToggle.checked = saved.accent || false;
                    document.getElementById('beatPattern').value = saved.pattern || '4';
                    document.getElementById('soundType').value = saved.soundType || 'sine';
                    
                    if (saved.theme === 'dark' || 
                        (window.matchMedia('(prefers-color-scheme: dark)').matches && saved.theme !== 'light')) {
                        document.body.classList.add('dark-theme');
                    }
                    
                    updateBpmDisplay();
                    bpmSlider.value = currentBpm;
                    
                    if (saved.playing) {
                        // 延迟启动以确保音频上下文已初始化
                        setTimeout(() => toggleMetronome(), 100);
                    }
                }
            }
            
            // 事件监听
            bpmSlider.addEventListener('input', function() {
                currentBpm = parseInt(this.value);
                updateBpmDisplay();
                
                if (isPlaying) {
                    stopMetronome();
                    startMetronome();
                }
                saveSettings();
            });
            
            toggleBtn.addEventListener('click', toggleMetronome);
            
            decreaseBtn.addEventListener('click', function() {
                currentBpm = Math.max(40, currentBpm - 10);
                updateBpmDisplay();
                bpmSlider.value = currentBpm;
                
                if (isPlaying) {
                    stopMetronome();
                    startMetronome();
                }
                saveSettings();
            });
            
            increaseBtn.addEventListener('click', function() {
                currentBpm = Math.min(240, currentBpm + 10);
                updateBpmDisplay();
                bpmSlider.value = currentBpm;
                
                if (isPlaying) {
                    stopMetronome();
                    startMetronome();
                }
                saveSettings();
            });
            
            // 预设BPM按钮
            document.querySelectorAll('.preset-btns button').forEach(btn => {
                btn.addEventListener('click', function() {
                    currentBpm = parseInt(this.dataset.bpm);
                    updateBpmDisplay();
                    bpmSlider.value = currentBpm;
                    
                    if (isPlaying) {
                        stopMetronome();
                        startMetronome();
                    }
                    saveSettings();
                });
            });
            
            // 主题切换
            themeBtn.addEventListener('click', function() {
                document.body.classList.toggle('dark-theme');
                saveSettings();
            });
            
            // 设置变化监听
            document.querySelectorAll('input, select').forEach(el => {
                el.addEventListener('change', function() {
                    if (isPlaying) {
                        stopMetronome();
                        startMetronome();
                    }
                    saveSettings();
                });
            });
            
            // 触摸设备上的事件处理
            document.addEventListener('touchstart', initAudioContext, { once: true });
            
            // 初始化
            loadSettings();
            updateBpmDisplay();
        });
    </script>
</body>
</html>
