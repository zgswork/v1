<!DOCTYPE html>
<html lang="zh-CN">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>离线文档对比工具 - 实时对比</title>
        <style>
            /* CSS 样式 */
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            }

            body {
                background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
                min-height: 100vh;
                padding: 20px;
                color: #333;
            }

            .container {
                max-width: 1800px;
                margin: 0 auto;
                background-color: white;
                border-radius: 16px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
                overflow: hidden;
                min-height: 95vh;
                position: relative;
            }

            header {
                background: linear-gradient(90deg, #4b6cb7 0%, #182848 100%);
                color: white;
                padding: 20px 30px;
            }

            header h1 {
                font-size: 2.2rem;
                margin-bottom: 8px;
                font-weight: 700;
            }

            .subtitle {
                opacity: 0.9;
                font-size: 1.05rem;
                margin-bottom: 10px;
            }

            .shortcut-info {
                font-size: 0.9rem;
                opacity: 0.8;
                margin-bottom: 15px;
                padding: 5px 10px;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 6px;
                display: inline-block;
            }

            .shortcut-info kbd {
                background: rgba(255, 255, 255, 0.2);
                padding: 2px 8px;
                border-radius: 4px;
                margin: 0 3px;
                font-family: monospace;
            }

            .controls {
                display: flex;
                align-items: center;
                gap: 20px;
                flex-wrap: wrap;
            }

            button {
                padding: 12px 28px;
                border: none;
                border-radius: 8px;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
                display: inline-flex;
                align-items: center;
                gap: 8px;
            }

            #compareBtn {
                background-color: #2ecc71;
                color: white;
            }

            #compareBtn:hover {
                background-color: #27ae60;
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(46, 204, 113, 0.3);
            }

            #clearBtn {
                background-color: #e74c3c;
                color: white;
            }

            #clearBtn:hover {
                background-color: #c0392b;
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(231, 76, 60, 0.3);
            }

            .legend {
                display: flex;
                gap: 20px;
                margin-left: auto;
            }

            .legend-item {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 0.9rem;
            }

            .sample {
                width: 20px;
                height: 20px;
                border-radius: 4px;
                border: 1px solid rgba(0, 0, 0, 0.1);
            }

            .sample.ins {
                background-color: #a8e6cf;
            }

            .sample.del {
                background-color: #ffaaa5;
            }

            /* 主对比区域 - 上下两部分 */
            .comparison-main-area {
                display: flex;
                padding: 25px;
                gap: 25px;
                min-height: 400px;
            }

            .comparison-result-area {
                display: flex;
                padding: 25px;
                gap: 25px;
                min-height: 400px;
            }

            /* 统计条样式 - 精简一行高度 */
            .stats-bar {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 30px;
                padding: 12px 25px;
                background: linear-gradient(90deg, #f8f9fa 0%, #e9ecef 100%);
                border-top: 1px solid #dee2e6;
                border-bottom: 1px solid #dee2e6;
                margin: 0;
                flex-wrap: wrap;
                min-height: 60px;
            }

            .stat-item {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 0.95rem;
                padding: 5px 15px;
                background: white;
                border-radius: 8px;
                box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
                border: 1px solid #e1e5e9;
            }

            .stat-label {
                font-weight: 600;
                color: #495057;
            }

            .stat-value {
                font-weight: bold;
                color: #4b6cb7;
            }

            .stat-value.added {
                color: #2ecc71;
            }

            .stat-value.deleted {
                color: #e74c3c;
            }

            .editor-panel {
                flex: 1;
                display: flex;
                flex-direction: column;
                background: #f8f9fa;
                border-radius: 12px;
                overflow: hidden;
                border: 1px solid #e1e5e9;
            }

            .input-panel {
                border: 2px solid #4b6cb7;
            }

            .output-panel {
                border: 2px solid #27ae60;
                background: #f0f9ff;
            }

            .editor-panel h3 {
                color: white;
                padding: 15px 20px;
                margin: 0;
                font-size: 1.2rem;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            .input-panel h3 {
                background: #4b6cb7;
            }

            .output-panel h3 {
                background: #27ae60;
            }

            .word-count {
                font-size: 0.85rem;
                font-weight: normal;
                color: #e0e0e0;
                background: rgba(255, 255, 255, 0.2);
                padding: 3px 10px;
                border-radius: 12px;
                margin-left: 10px;
            }

            .rich-editor {
                flex: 1;
                padding: 20px;
                overflow-y: auto;
                line-height: 1.6;
                font-size: 16px;
                outline: none;
                min-height: 300px;
                border: none;
                resize: none;
            }

            .input-editor {
                background-color: white;
            }

            .output-editor {
                background-color: #f8fdf0;
            }

            .rich-editor[contenteditable="true"]:empty:before {
                content: attr(placeholder);
                color: #adb5bd;
                font-style: italic;
                display: block;
            }

            /* 高亮样式 */
            .highlight-ins {
                background-color: #a8e6cf !important;
                border-bottom: 2px solid #4caf50;
                padding: 0 2px;
                border-radius: 3px;
                display: inline;
            }

            .highlight-del {
                background-color: #ffaaa5 !important;
                text-decoration: line-through;
                padding: 0 2px;
                border-radius: 3px;
                color: #555;
                display: inline;
            }

            .rich-editor strong .highlight-ins,
            .rich-editor strong .highlight-del,
            .rich-editor em .highlight-ins,
            .rich-editor em .highlight-del {
                display: inline;
            }

            /* 回到顶部按钮 */
            #backToTop {
                position: fixed;
                bottom: 30px;
                right: 30px;
                width: 50px;
                height: 50px;
                background: linear-gradient(135deg, #4b6cb7, #182848);
                color: white;
                border: none;
                border-radius: 50%;
                font-size: 22px;
                cursor: pointer;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
                z-index: 1000;
                display: none;
                justify-content: center;
                align-items: center;
                transition: all 0.3s ease;
            }

            #backToTop:hover {
                background: linear-gradient(135deg, #182848, #4b6cb7);
                transform: translateY(-3px);
                box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            }

            #backToTop.show {
                display: flex;
                animation: fadeIn 0.3s ease;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            /* 状态指示器 */
            .status-indicator {
                display: inline-block;
                width: 12px;
                height: 12px;
                border-radius: 50%;
                margin-right: 8px;
            }

            .status-active {
                background-color: #2ecc71;
                box-shadow: 0 0 10px #2ecc71;
            }

            .status-inactive {
                background-color: #95a5a6;
            }

            @media (max-width: 1024px) {

                .comparison-main-area,
                .comparison-result-area {
                    flex-direction: column;
                }

                .editor-panel {
                    min-height: 250px;
                }

                .controls {
                    flex-direction: column;
                    align-items: flex-start;
                }

                .legend {
                    margin-left: 0;
                }

                .stats-bar {
                    gap: 15px;
                    padding: 10px 15px;
                }

                .stat-item {
                    padding: 5px 10px;
                    font-size: 0.9rem;
                }

                #backToTop {
                    bottom: 20px;
                    right: 20px;
                    width: 45px;
                    height: 45px;
                }
            }

            /* 滚动条样式 */
            .rich-editor::-webkit-scrollbar {
                width: 8px;
            }

            .rich-editor::-webkit-scrollbar-track {
                background: #f1f1f1;
                border-radius: 4px;
            }

            .rich-editor::-webkit-scrollbar-thumb {
                background: #c1c1c1;
                border-radius: 4px;
            }

            .rich-editor::-webkit-scrollbar-thumb:hover {
                background: #a8a8a8;
            }
        </style>
    </head>

    <body>
        <div class="container">
            <header>
                <h1>📄 离线文档对比工具 - 实时对比</h1>
                <p class="subtitle">上方输入文档，下方实时显示对比结果</p>
                <div class="shortcut-info">
                    快捷键：<kbd>Ctrl</kbd> + <kbd>Enter</kbd> 对比文档，<kbd>Esc</kbd> 清空所有
                </div>
                <div class="controls">
                    <button id="compareBtn">🔄 开始对比</button>
                    <button id="clearBtn">🗑️ 清空所有</button>
                    <div class="auto-compare-info">
                        <span class="status-indicator status-active" id="statusIndicator"></span>
                        实时对比已启用
                    </div>
                    <div class="legend">
                        <span class="legend-item"><span class="sample ins"></span> B文档新增</span>
                        <span class="legend-item"><span class="sample del"></span> A文档删除</span>
                    </div>
                </div>
            </header>
            <main>
                <!-- 上方：输入区域 -->
                <div class="comparison-main-area">
                    <div class="editor-panel input-panel">
                        <h3 id="titleAInput">📝 文档A (输入) <span class="word-count">共0字</span></h3>
                        <div id="editorAInput" class="rich-editor input-editor" contenteditable="true"
                            placeholder="在此输入或粘贴文档A的内容..."></div>
                    </div>
                    <div class="editor-panel input-panel">
                        <h3 id="titleBInput">📝 文档B (输入) <span class="word-count">共0字</span></h3>
                        <div id="editorBInput" class="rich-editor input-editor" contenteditable="true"
                            placeholder="在此输入或粘贴文档B的内容..."></div>
                    </div>
                </div>
                <!-- 统计条 -->
                <div class="stats-bar" id="statsBar"></div>
                <!-- 下方：结果区域 -->
                <div class="comparison-result-area">
                    <div class="editor-panel output-panel">
                        <h3 id="titleAOutput">📊 文档A (结果) <span class="word-count">共0字</span></h3>
                        <div id="editorAOutput" class="rich-editor output-editor" contenteditable="false"
                            placeholder="文档A的对比结果将显示在这里..."></div>
                    </div>
                    <div class="editor-panel output-panel">
                        <h3 id="titleBOutput">📊 文档B (结果) <span class="word-count">共0字</span></h3>
                        <div id="editorBOutput" class="rich-editor output-editor" contenteditable="false"
                            placeholder="文档B的对比结果将显示在这里..."></div>
                    </div>
                </div>
            </main>
        </div>
        <!-- 回到顶部按钮 -->
        <button id="backToTop" title="回到顶部">↑</button>

        <script>
            // JavaScript 代码
            // 输入编辑器
            const editorAInput = document.getElementById('editorAInput');
            const editorBInput = document.getElementById('editorBInput');
            // 输出编辑器
            const editorAOutput = document.getElementById('editorAOutput');
            const editorBOutput = document.getElementById('editorBOutput');
            // 标题元素
            const titleAInput = document.getElementById('titleAInput');
            const titleBInput = document.getElementById('titleBInput');
            const titleAOutput = document.getElementById('titleAOutput');
            const titleBOutput = document.getElementById('titleBOutput');
            // 控制元素
            const compareBtn = document.getElementById('compareBtn');
            const clearBtn = document.getElementById('clearBtn');
            const backToTopBtn = document.getElementById('backToTop');
            const statsBar = document.getElementById('statsBar');
            const statusIndicator = document.getElementById('statusIndicator');
            // 状态变量
            let isComparing = false;
            let lastCompareTime = 0;
            const DEBOUNCE_DELAY = 500; // 防抖延迟500ms
            /**
             * 计算字符数（包含所有字符）
             */
            function countCharacters(text) {
                if (!text) return 0;
                return text.length;
            }
            /**
             * 计算非空字符数（去除空格、换行等空白字符）
             */
            function countNonEmptyCharacters(text) {
                if (!text) return 0;
                return text.replace(/\s+/g, '').length;
            }
            /**
             * 更新字数显示
             */
            function updateWordCount(side, type) {
                let editor, title;
                if (type === 'input') {
                    editor = side === 'A' ? editorAInput : editorBInput;
                    title = side === 'A' ? titleAInput : titleBInput;
                } else {
                    editor = side === 'A' ? editorAOutput : editorBOutput;
                    title = side === 'A' ? titleAOutput : titleBOutput;
                }
                const text = getTextContent(editor);
                const charCount = countCharacters(text);
                const wordCount = countNonEmptyCharacters(text);
                const countSpan = title.querySelector('.word-count');
                if (countSpan) {
                    countSpan.textContent = `共${wordCount}字`;
                    countSpan.title = `总字符数: ${charCount}（包含空格）`;
                }
                return { charCount, wordCount };
            }
            /**
             * 获取纯文本内容
             */
            function getTextContent(element) {
                return element.innerText || element.textContent || '';
            }
            /**
             * 防抖函数
             */
            function debounce(func, wait) {
                let timeout;
                return function executedFunction(...args) {
                    const later = () => {
                        clearTimeout(timeout);
                        func(...args);
                    };
                    clearTimeout(timeout);
                    timeout = setTimeout(later, wait);

            }
            /**
             * 实时对比函数（防抖处理）

            const debouncedCompare = debounce(function () {
                if (!isComparing) {
                    performComparison();
                }
            }, DEBOUNCE_DELAY);
            /**
             * 执行对比

            function performComparison() {
                isComparing = true;
                statusIndicator.className = 'status-indicator status-active';
                try {
                    // 获取输入编辑区内的纯文本
                    const textA = getTextContent(editorAInput);
                    const textB = getTextContent(editorBInput);

                    if (!textA.trim() && !textB.trim()) {
                        editorAOutput.innerHTML = '';
                        editorBOutput.innerHTML = '';
                        updateWordCount('A', 'output');
                        updateWordCount('B', 'output');

                        isComparing = false;
                        return;
                    }
                    // 如果内容完全相同
                    if (textA === textB) {
                        // 保留换行和分段
                        const formattedText = formatTextWithLineBreaks(textA);

                        editorBOutput.innerHTML = `<div>${formattedText}</div>`;
                        // 更新统计信息
                        updateStatsForIdentical(textA, textB);
                        updateWordCount('A', 'output');
                        updateWordCount('B', 'output');
                        isComparing = false;
                        return;
                    }
                    // 使用diff-match-patch进行差异分析
                    const dmp = new diff_match_patch();
                    const diffs = dmp.diff_main(textA, textB);
                    dmp.diff_cleanupSemantic(diffs);
                    // 为每个文档构建高亮结果
                    const resultA = buildHighlightedHtml(diffs, 'A');
                    const resultB = buildHighlightedHtml(diffs, 'B');
                    // 更新输出内容
                    editorAOutput.innerHTML = resultA;
                    editorBOutput.innerHTML = resultB;
                    // 更新统计信息
                    updateStats(textA, textB, diffs);
                    // 更新输出区域的字数统计
                    updateWordCount('A', 'output');
                    updateWordCount('B', 'output');
                    lastCompareTime = Date.now();
                    console.log('对比完成，时间:', new Date().toLocaleTimeString());
                } catch (error) {
                    console.error('对比错误:', error);
                    editorAOutput.innerHTML = `<div style="color:#e74c3c">对比出错: ${error.message}</div>`;
                    editorBOutput.innerHTML = `<div style="color:#e74c3c">对比出错: ${error.message}</div>`;
                    clearStats();
                } finally {
                    isComparing = false;
                    statusIndicator.className = 'status-indicator status-active';
                }
            }
            /**
             * 格式化文本，保留换行和分段
             */
            function formatTextWithLineBreaks(text) {
                if (!text) return '';
                // 转义HTML特殊字符
                let escaped = text
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
                // 保留换行和分段
                escaped = escaped.replace(/\n/g, '<br>');
                escaped = escaped.replace(/\n\n+/g, '<br><br>');
                return escaped;
            }
            /**
             * 构建高亮HTML
             */
            function buildHighlightedHtml(diffs, side) {
                let result = '';
                for (const [diffType, diffText] of diffs) {
                    if (side === 'A') {
                        // 文档A：只显示删除和相同的内容
                        if (diffType === -1) {
                            // 删除的内容
                            result += `<span class="highlight-del">${escapeHtml(diffText)}</span>`;
                        } else if (diffType === 0) {
                            // 相同的内容
                            result += escapeHtml(diffText);
                        }
                        // 新增的内容在A中不显示
                    } else if (side === 'B') {
                        // 文档B：只显示新增和相同的内容
                        if (diffType === 1) {
                            // 新增的内容
                            result += `<span class="highlight-ins">${escapeHtml(diffText)}</span>`;
                        } else if (diffType === 0) {
                            // 相同的内容
                            result += escapeHtml(diffText);
                        }
                        // 删除的内容在B中不显示
                    }
                }
                // 保留换行和分段
                result = result.replace(/\n/g, '<br>');
                result = result.replace(/\n\n+/g, '<br><br>');
                return `<div>${result}</div>`;
            }
            /**
             * HTML转义
             */
            function escapeHtml(text) {
                if (!text) return '';
                return text
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }
            /**
             * 更新统计信息
             */
            function updateStats(textA, textB, diffs) {
                // 计算总字符数
                const totalCharsA = countCharacters(textA);
                const totalCharsB = countCharacters(textB);
                const totalWordsA = countNonEmptyCharacters(textA);
                const totalWordsB = countNonEmptyCharacters(textB);
                // 计算差异字符数
                let insertedChars = 0;
                let deletedChars = 0;
                let unchangedChars = 0;
                for (const [type, text] of diffs) {
                    if (type === 1) {
                        insertedChars += text.length;
                    } else if (type === -1) {
                        deletedChars += text.length;
                    } else {
                        unchangedChars += text.length;
                    }
                }
                // 更新统计条
                statsBar.innerHTML = `
                <div class="stat-item">
                    <span class="stat-label">文档A:</span>
                    <span class="stat-value">${totalWordsA}字 (${totalCharsA}字符)</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">文档B:</span>
                    <span class="stat-value">${totalWordsB}字 (${totalCharsB}字符)</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">新增:</span>
                    <span class="stat-value added">${insertedChars}字符</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">删除:</span>
                    <span class="stat-value deleted">${deletedChars}字符</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">相同:</span>
                    <span class="stat-value">${unchangedChars}字符</span>
                </div>
            `;
            }
            /**
             * 更新完全相同时的统计信息
             */
            function updateStatsForIdentical(textA, textB) {
                const totalCharsA = countCharacters(textA);
                const totalCharsB = countCharacters(textB);
                const totalWordsA = countNonEmptyCharacters(textA);
                const totalWordsB = countNonEmptyCharacters(textB);
                statsBar.innerHTML = `
                <div class="stat-item">
                    <span class="stat-label">文档A:</span>
                    <span class="stat-value">${totalWordsA}字 (${totalCharsA}字符)</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">文档B:</span>
                    <span class="stat-value">${totalWordsB}字 (${totalCharsB}字符)</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">状态:</span>
                    <span class="stat-value" style="color:#27ae60;">完全相同</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">相同字符:</span>
                    <span class="stat-value">${totalCharsA}字符</span>
                </div>
            `;
            }
            /**
             * 清空统计信息
             */
            function clearStats() {
                statsBar.innerHTML = '';
            }
            /**
             * 清空所有内容
             */
            function clearAll() {
                if (confirm('确定要清空所有内容吗？')) {
                    // 清空输入区域
                    editorAInput.innerHTML = '';
                    editorBInput.innerHTML = '';
                    // 清空输出区域
                    editorAOutput.innerHTML = '';
                    editorBOutput.innerHTML = '';
                    // 更新字数统计
                    updateWordCount('A', 'input');
                    updateWordCount('B', 'input');
                    updateWordCount('A', 'output');
                    updateWordCount('B', 'output');
                    // 清空统计信息
                    clearStats();
                    // 焦点回到输入区域
                    editorAInput.focus();
                    console.log('已清空所有内容');
                }
            }
            /**
             * 回到顶部功能
             */
            function scrollToTop() {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            }
            /**
             * 监听滚动，显示/隐藏回到顶部按钮
             */
            function handleScroll() {
                if (window.scrollY > 300) {
                    backToTopBtn.classList.add('show');
                } else {
                    backToTopBtn.classList.remove('show');
                }
            }
            // 页面加载时初始化
            window.onload = function () {
                // 初始化字数显示
                updateWordCount('A', 'input');
                updateWordCount('B', 'input');
                updateWordCount('A', 'output');
                updateWordCount('B', 'output');
                // 设置按钮事件
                compareBtn.onclick = performComparison;
                clearBtn.onclick = clearAll;
                backToTopBtn.onclick = scrollToTop;
                // 添加输入事件监听（实时对比）
                editorAInput.addEventListener('input', function () {
                    updateWordCount('A', 'input');
                    debouncedCompare();
                });
                editorBInput.addEventListener('input', function () {
                    updateWordCount('B', 'input');
                    debouncedCompare();
                });
                // 添加粘贴事件监听
                editorAInput.addEventListener('paste', function () {
                    setTimeout(() => {
                        updateWordCount('A', 'input');
                        debouncedCompare();
                    }, 10);
                });
                editorBInput.addEventListener('paste', function () {
                    setTimeout(() => {
                        updateWordCount('B', 'input');
                        debouncedCompare();
                    }, 10);
                });
                // 添加快捷键支持
                document.addEventListener('keydown', function (e) {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                        e.preventDefault();
                        performComparison();
                    }
                    if (e.key === 'Escape') {
                        clearAll();
                    }
                });
                // 监听滚动事件
                window.addEventListener('scroll', handleScroll);
                console.log('文档对比工具已加载，实时对比已启用');
            };
        </script>
    </body>

</html>
