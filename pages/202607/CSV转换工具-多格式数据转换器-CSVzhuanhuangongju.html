<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV转换工具 - 多格式数据转换器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #4361ee;
            --primary-dark: #3a56d4;
            --secondary: #7209b7;
            --success: #06d6a0;
            --dark: #1a1a2e;
            --light: #f8f9fa;
            --gray: #6c757d;
            --border: #dee2e6;
            --card-bg: #ffffff;
            --shadow: rgba(0, 0, 0, 0.1);
        }
        
        [data-theme="dark"] {
            --dark: #f8f9fa;
            --light: #121212;
            --card-bg: #1e1e2e;
            --border: #2d3748;
            --gray: #a0aec0;
            --shadow: rgba(0, 0, 0, 0.3);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e7f1 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }
        
        [data-theme="dark"] body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 100%);
            color: #e2e8f0;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 20px;
            padding: 10px 0;
        }
        
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        
        .logo i {
            font-size: 1.8rem;
            color: var(--primary);
            background: rgba(67, 97, 238, 0.1);
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        
        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 700;
        }
        
        .subtitle {
            font-size: 0.95rem;
            color: var(--gray);
            max-width: 600px;
            margin: 0 auto 10px;
        }
        
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px var(--shadow);
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid var(--border);
        }
        
        .card-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--primary);
        }
        
        .card-title i {
            font-size: 1.6rem;
        }
        
        .input-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .input-methods {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .input-method {
            flex: 1;
            min-width: 250px;
        }
        
        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
            background: var(--card-bg);
            color: inherit;
        }
        
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }
        
        .file-upload {
            border: 2px dashed var(--border);
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .file-upload:hover {
            border-color: var(--primary);
            background: rgba(67, 97, 238, 0.05);
        }
        
        .file-upload i {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 15px;
        }
        
        .file-upload p {
            margin-bottom: 15px;
            color: var(--gray);
        }
        
        .btn {
            display: inline-block;
            padding: 12px 25px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.3);
        }
        
        .btn-secondary {
            background: var(--secondary);
        }
        
        .btn-secondary:hover {
            background: #5a08a0;
        }
        
        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }
        
        .btn-outline:hover {
            background: rgba(67, 97, 238, 0.1);
        }
        
        .settings {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 20px 0;
        }
        
        .setting-group {
            flex: 1;
            min-width: 200px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--gray);
        }
        
        select, input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: var(--card-bg);
            color: inherit;
            font-size: 16px;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .format-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 20px 0;
        }
        
        .format-btn {
            padding: 12px 20px;
            background: rgba(67, 97, 238, 0.1);
            color: var(--primary);
            border: 2px solid transparent;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .format-btn:hover, .format-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        
        .output-container {
            position: relative;
        }
        
        .output-actions {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        
        .copy-btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            color: inherit;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .copy-btn:hover {
            background: var(--primary);
            color: white;
        }
        
        .theme-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 100;
            border: none;
        }
        
        footer {
            text-align: center;
            padding: 20px 0;
            color: var(--gray);
            font-size: 0.9rem;
            margin-top: 30px;
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .feature {
            background: rgba(67, 97, 238, 0.05);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid var(--border);
        }
        
        .feature i {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 15px;
        }
        
        .feature h3 {
            margin-bottom: 10px;
            color: var(--primary);
        }
        
        @media (max-width: 768px) {
            .input-methods {
                flex-direction: column;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .card {
                padding: 20px;
            }
            
            .format-btn {
                flex: 1;
                min-width: calc(50% - 10px);
                justify-content: center;
            }
        }
        
        @media (max-width: 480px) {
            .format-btn {
                min-width: 100%;
            }
            
            .btn {
                width: 100%;
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-file-csv"></i>
            </div>
            <h1>CSV转换工具</h1>
            <p class="subtitle">将CSV数据快速转换为JSON、HTML、Markdown、Excel、Python等多种格式</p>
        </header>
        
        <main>
            <div class="card">
                <h2 class="card-title"><i class="fas fa-file-upload"></i> 输入CSV数据</h2>
                <div class="input-area">
                    <div class="input-methods">
                        <div class="input-method">
                            <textarea id="csvInput" placeholder="在此粘贴CSV内容，或者使用下面的文件上传功能...">Name,Email,Role,Department
张明,zhang@example.com,产品经理,产品部
李华,li@example.com,前端开发,技术部
王芳,wang@example.com,UI设计师,设计部
刘伟,liu@example.com,后端开发,技术部</textarea>
                        </div>
                        <div class="input-method">
                            <div class="file-upload" id="fileUpload">
                                <i class="fas fa-cloud-upload-alt"></i>
                                <p>拖放CSV文件到此处或点击上传</p>
                                <button class="btn btn-outline"><i class="fas fa-folder-open"></i> 选择文件</button>
                                <input type="file" id="fileInput" accept=".csv" style="display: none;">
                            </div>
                        </div>
                    </div>
                    
                    <div class="settings">
                        <div class="setting-group">
                            <h3 style="margin-bottom: 15px; color: var(--primary); font-size: 1.1rem;">CSV选项</h3>
                            <div style="margin-bottom: 15px;">
                                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                    <input type="checkbox" id="header" checked style="width: auto; margin: 0;">
                                    包含标题行
                                </label>
                            </div>
                            <div>
                                <label for="delimiter" style="margin-bottom: 8px;">分隔符：</label>
                                <select id="delimiter">
                                    <option value=",">逗号 (,)</option>
                                    <option value=";">分号 (;)</option>
                                    <option value="\t">制表符 (\t)</option>
                                    <option value="|">竖线 (|)</option>
                                </select>
                            </div>
                        </div>
                        <div class="setting-group">
                            <h3 style="margin-bottom: 15px; color: var(--primary); font-size: 1.1rem;">输出选项</h3>
                            <div style="margin-bottom: 15px;">
                                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                    <input type="checkbox" id="beautify" checked style="width: auto; margin: 0;">
                                    美化输出格式
                                </label>
                            </div>
                            <div>
                                <label for="encoding" style="margin-bottom: 8px;">编码格式：</label>
                                <select id="encoding">
                                    <option value="utf-8">UTF-8</option>
                                    <option value="gbk">GBK</option>
                                    <option value="gb2312">GB2312</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <button id="convertBtn" class="btn"><i class="fas fa-sync-alt"></i> 转换数据</button>
                </div>
            </div>
            
            <div class="card">
                <h2 class="card-title"><i class="fas fa-file-export"></i> 输出格式</h2>
                <div class="format-selector">
                    <button class="format-btn active" data-format="json">
                        <i class="fab fa-js"></i> JSON
                    </button>
                    <button class="format-btn" data-format="html">
                        <i class="fab fa-html5"></i> HTML表格
                    </button>
                    <button class="format-btn" data-format="markdown">
                        <i class="fab fa-markdown"></i> Markdown
                    </button>
                    <button class="format-btn" data-format="excel">
                        <i class="fas fa-file-excel"></i> Excel
                    </button>
                    <button class="format-btn" data-format="python">
                        <i class="fab fa-python"></i> Python字典
                    </button>
                </div>
                
                <div class="output-container">
                    <textarea id="output" placeholder="转换结果将显示在这里..." readonly></textarea>
                    <div class="output-actions">
                        <button class="copy-btn" id="copyBtn" title="复制到剪贴板">
                            <i class="fas fa-copy"></i>
                        </button>
                        <button class="copy-btn" id="downloadBtn" title="下载文件">
                            <i class="fas fa-download"></i>
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="features">
                <div class="feature">
                    <i class="fas fa-bolt"></i>
                    <h3>快速转换</h3>
                    <p>即时转换CSV数据，无需等待</p>
                </div>
                <div class="feature">
                    <i class="fas fa-lock"></i>
                    <h3>隐私保护</h3>
                    <p>所有处理在浏览器完成，数据不上传服务器</p>
                </div>
                <div class="feature">
                    <i class="fas fa-mobile-alt"></i>
                    <h3>响应式设计</h3>
                    <p>在手机、平板和桌面设备上完美运行</p>
                </div>
                <div class="feature">
                    <i class="fas fa-code"></i>
                    <h3>开发者友好</h3>
                    <p>支持多种开发常用格式</p>
                </div>
            </div>
        </main>
        
        <footer>
            <p>© 2025 CSV转换工具</p>
        </footer>
    </div>
    
    <button class="theme-toggle" id="themeToggle">
        <i class="fas fa-moon"></i>
    </button>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const csvInput = document.getElementById('csvInput');
            const fileInput = document.getElementById('fileInput');
            const fileUpload = document.getElementById('fileUpload');
            const convertBtn = document.getElementById('convertBtn');
            const output = document.getElementById('output');
            const formatButtons = document.querySelectorAll('.format-btn');
            const copyBtn = document.getElementById('copyBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const themeToggle = document.getElementById('themeToggle');
            
            let currentFormat = 'json';
            let csvData = [];
            let headers = [];
            
            // 设置当前活动格式按钮
            function setActiveFormat(format) {
                formatButtons.forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.dataset.format === format) {
                        btn.classList.add('active');
                    }
                });
                currentFormat = format;
                convertData();
            }
            
            // 处理文件上传
            fileUpload.addEventListener('click', () => fileInput.click());
            
            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        csvInput.value = event.target.result;
                        convertData();
                    };
                    reader.readAsText(file);
                }
            });
            
            // 格式按钮点击事件
            formatButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    setActiveFormat(btn.dataset.format);
                });
            });
            
            // 转换数据
            function convertData() {
                const csvText = csvInput.value.trim();
                if (!csvText) {
                    output.value = '请输入CSV数据';
                    return;
                }
                
                const delimiter = document.getElementById('delimiter').value;
                const hasHeader = document.getElementById('header').checked;
                
                try {
                    // 使用PapaParse解析CSV
                    const results = Papa.parse(csvText, {
                        delimiter: delimiter,
                        header: hasHeader,
                        skipEmptyLines: true
                    });
                    
                    if (results.errors.length > 0) {
                        throw new Error(results.errors[0].message);
                    }
                    
                    csvData = results.data;
                    
                    if (hasHeader && csvData.length > 0) {
                        headers = Object.keys(csvData[0]);
                    }
                    
                    // 根据选择的格式进行转换
                    let result;
                    switch(currentFormat) {
                        case 'json':
                            result = convertToJSON();
                            break;
                        case 'html':
                            result = convertToHTML();
                            break;
                        case 'markdown':
                            result = convertToMarkdown();
                            break;
                        case 'excel':
                            result = "点击下载按钮导出Excel文件";
                            break;
                        case 'python':
                            result = convertToPython();
                            break;
                        default:
                            result = convertToJSON();
                    }
                    
                    output.value = result;
                } catch (error) {
                    output.value = `转换错误: ${error.message}`;
                }
            }
            
            // 转换为JSON
            function convertToJSON() {
                const beautify = document.getElementById('beautify').checked;
                return JSON.stringify(csvData, null, beautify ? 2 : 0);
            }
            
            // 转换为HTML表格
            function convertToHTML() {
                if (csvData.length === 0) return '';
                
                let html = '<table>\n';
                
                // 表头
                if (headers.length > 0) {
                    html += '  <thead>\n    <tr>\n';
                    headers.forEach(header => {
                        html += `      <th>${header}</th>\n`;
                    });
                    html += '    </tr>\n  </thead>\n';
                }
                
                // 表格内容
                html += '  <tbody>\n';
                csvData.forEach(row => {
                    html += '    <tr>\n';
                    Object.values(row).forEach(cell => {
                        html += `      <td>${cell || ''}</td>\n`;
                    });
                    html += '    </tr>\n';
                });
                html += '  </tbody>\n</table>';
                
                return html;
            }
            
            // 转换为Markdown表格
            function convertToMarkdown() {
                if (csvData.length === 0) return '';
                
                let md = '';
                
                // 表头
                if (headers.length > 0) {
                    md += '| ' + headers.join(' | ') + ' |\n';
                    md += '|' + headers.map(() => '---').join('|') + '|\n';
                }
                
                // 表格内容
                csvData.forEach(row => {
                    md += '| ' + Object.values(row).join(' | ') + ' |\n';
                });
                
                return md;
            }
            
            // 转换为Python字典
            function convertToPython() {
                if (csvData.length === 0) return '';
                
                let py = '[\n';
                
                csvData.forEach((row, index) => {
                    py += '    {\n';
                    Object.entries(row).forEach(([key, value], i, arr) => {
                        py += `        "${key}": "${value}"`;
                        if (i < arr.length - 1) py += ',';
                        py += '\n';
                    });
                    py += '    }';
                    if (index < csvData.length - 1) py += ',';
                    py += '\n';
                });
                
                py += ']';
                return py;
            }
            
            // 下载文件
            function downloadFile() {
                const content = output.value;
                const format = currentFormat;
                
                if (!content || content.includes('错误') || content.includes('请输入')) {
                    alert('没有有效内容可下载');
                    return;
                }
                
                let filename = 'converted_data';
                let mimeType = 'text/plain';
                let extension = '.txt';
                
                switch(format) {
                    case 'json':
                        extension = '.json';
                        mimeType = 'application/json';
                        break;
                    case 'html':
                        extension = '.html';
                        mimeType = 'text/html';
                        break;
                    case 'markdown':
                        extension = '.md';
                        break;
                    case 'excel':
                        return downloadExcel();
                    case 'python':
                        extension = '.py';
                        break;
                }
                
                const blob = new Blob([content], { type: `${mimeType};charset=utf-8` });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename + extension;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
            
            // 下载Excel文件
            function downloadExcel() {
                if (csvData.length === 0) {
                    alert('没有数据可导出');
                    return;
                }
                
                try {
                    // 创建工作簿
                    const wb = XLSX.utils.book_new();
                    
                    // 如果数据有表头
                    let ws;
                    if (headers.length > 0) {
                        // 创建带标题的工作表
                        const dataWithHeaders = [headers, ...csvData.map(row => Object.values(row))];
                        ws = XLSX.utils.aoa_to_sheet(dataWithHeaders);
                    } else {
                        // 如果没有标题，直接使用数据
                        ws = XLSX.utils.json_to_sheet(csvData);
                    }
                    
                    // 将工作表添加到工作簿
                    XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
                    
                    // 生成Excel文件并下载
                    XLSX.writeFile(wb, "converted_data.xlsx");
                } catch (error) {
                    alert(`导出Excel失败: ${error.message}`);
                }
            }
            
            // 复制到剪贴板
            function copyToClipboard() {
                output.select();
                document.execCommand('copy');
                
                // 显示复制成功反馈
                const originalText = copyBtn.innerHTML;
                copyBtn.innerHTML = '<i class="fas fa-check"></i> 已复制';
                setTimeout(() => {
                    copyBtn.innerHTML = originalText;
                }, 2000);
            }
            
            // 切换主题
            function toggleTheme() {
                const currentTheme = document.body.getAttribute('data-theme') || 'light';
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                document.body.setAttribute('data-theme', newTheme);
                
                // 更新按钮图标
                const icon = themeToggle.querySelector('i');
                icon.className = newTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
                
                // 保存主题偏好
                localStorage.setItem('theme', newTheme);
            }
            
            // 事件监听
            convertBtn.addEventListener('click', convertData);
            copyBtn.addEventListener('click', copyToClipboard);
            downloadBtn.addEventListener('click', downloadFile);
            themeToggle.addEventListener('click', toggleTheme);
            csvInput.addEventListener('input', convertData);
            
            // 初始化
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.body.setAttribute('data-theme', savedTheme);
            
            // 设置主题按钮图标
            const themeIcon = themeToggle.querySelector('i');
            themeIcon.className = savedTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            
            // 初始转换
            convertData();
        });
    </script>
</body>
</html>
