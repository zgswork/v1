<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF页面批量删除工具 | 简洁高效</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        :root {
            --primary-color: #4a6cf7;
            --primary-dark: #3a5ae0;
            --secondary-color: #6c757d;
            --light-gray: #f8f9fa;
            --border-color: #dee2e6;
            --success-color: #28a745;
            --danger-color: #dc3545;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f7ff;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 30px 0;
            background: linear-gradient(135deg, #4a6cf7, #6a11cb);
            color: white;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(74, 108, 247, 0.3);
        }
        
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        header p {
            font-size: 1.1rem;
            max-width: 700px;
            margin: 0 auto;
            opacity: 0.9;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }
        
        @media (min-width: 768px) {
            .main-content {
                grid-template-columns: 1fr 1fr;
            }
        }
        
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            padding: 25px;
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .card h2 {
            color: var(--primary-color);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--light-gray);
        }
        
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background-color: var(--light-gray);
        }
        
        .upload-area:hover, .upload-area.drag-over {
            border-color: var(--primary-color);
            background-color: rgba(74, 108, 247, 0.05);
        }
        
        .upload-icon {
            font-size: 48px;
            color: var(--primary-color);
            margin-bottom: 15px;
        }
        
        .btn {
            display: inline-block;
            background: var(--primary-color);
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            border: none;
            transition: all 0.3s;
            text-align: center;
            font-size: 16px;
        }
        
        .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }
        
        .btn:disabled {
            background: var(--secondary-color);
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-success {
            background: var(--success-color);
        }
        
        .btn-success:hover {
            background: #218838;
        }
        
        .btn-danger {
            background: var(--danger-color);
        }
        
        .btn-danger:hover {
            background: #bd2130;
        }
        
        .thumbnail-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 20px;
            max-height: 500px;
            overflow-y: auto;
            padding: 10px;
        }
        
        .page-thumbnail {
            position: relative;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            cursor: pointer;
            aspect-ratio: 1 / 1.414; /* A4 aspect ratio */
        }
        
        .page-thumbnail.selected {
            border-color: var(--danger-color);
            box-shadow: 0 0 0 3px rgba(220, 53, 69, 0.3);
        }
        
        .page-thumbnail canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        .page-number {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            text-align: center;
            padding: 3px 0;
            font-size: 12px;
        }
        
        .page-controls {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .control-group {
            margin-bottom: 20px;
        }
        
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 30px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .status-message {
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }
        
        .status-success {
            background-color: rgba(40, 167, 69, 0.1);
            color: var(--success-color);
            border: 1px solid var(--success-color);
        }
        
        .status-error {
            background-color: rgba(220, 53, 69, 0.1);
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
        }
        
        .hidden {
            display: none;
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: var(--secondary-color);
            font-size: 0.9rem;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .page-info {
            margin-top: 15px;
            padding: 10px;
            background: var(--light-gray);
            border-radius: 6px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>PDF页面批量删除工具</h1>
            <p>简洁高效地删除PDF文档中的指定页面 - 无需上传服务器，完全在浏览器中处理</p>
        </header>
        
        <div class="main-content">
            <div class="card">
                <h2>上传PDF文件</h2>
                <div id="uploadArea" class="upload-area">
                    <div class="upload-icon">📄</div>
                    <h3>拖放PDF文件到此处</h3>
                    <p>或</p>
                    <button id="selectFileBtn" class="btn">选择PDF文件</button>
                    <p style="margin-top: 15px; font-size: 0.9rem;">最大文件大小: 20MB</p>
                    <input type="file" id="fileInput" accept=".pdf" class="hidden">
                </div>
                
                <div id="loadingIndicator" class="loading hidden">
                    <div class="spinner"></div>
                    <p>正在处理PDF文件，请稍候...</p>
                </div>
                
                <div id="fileInfo" class="hidden">
                    <div class="page-info">
                        <p>文件名: <span id="fileName"></span></p>
                        <p>总页数: <span id="totalPages"></span></p>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <h2>选择要删除的页面</h2>
                <div id="thumbnailContainer" class="thumbnail-container">
                    <p id="noFileMessage">请先上传PDF文件</p>
                </div>
                
                <div class="page-controls">
                    <div>
                        <button id="selectAllBtn" class="btn" disabled>全选</button>
                        <button id="deselectAllBtn" class="btn" disabled>取消全选</button>
                    </div>
                    <button id="deletePagesBtn" class="btn btn-danger" disabled>删除选定页面</button>
                </div>
                
                <div id="statusMessage" class="status-message hidden"></div>
                
                <div id="downloadSection" class="hidden">
                    <div class="status-message status-success">
                        <p>PDF处理成功！请下载新文件</p>
                    </div>
                    <div class="action-buttons">
                        <button id="downloadBtn" class="btn btn-success">下载新PDF</button>
                        <button id="resetBtn" class="btn">处理新文件</button>
                    </div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>© 2023 PDF页面批量删除工具 | 完全在浏览器中运行，您的文件不会上传到任何服务器</p>
        </footer>
    </div>

    <script>
        // 初始化全局变量
        let pdfDoc = null;
        let totalPages = 0;
        let selectedPages = new Set();
        let processedPdf = null;
        
        // 获取DOM元素
        const fileInput = document.getElementById('fileInput');
        const selectFileBtn = document.getElementById('selectFileBtn');
        const uploadArea = document.getElementById('uploadArea');
        const thumbnailContainer = document.getElementById('thumbnailContainer');
        const noFileMessage = document.getElementById('noFileMessage');
        const fileNameElement = document.getElementById('fileName');
        const totalPagesElement = document.getElementById('totalPages');
        const fileInfo = document.getElementById('fileInfo');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const selectAllBtn = document.getElementById('selectAllBtn');
        const deselectAllBtn = document.getElementById('deselectAllBtn');
        const deletePagesBtn = document.getElementById('deletePagesBtn');
        const statusMessage = document.getElementById('statusMessage');
        const downloadSection = document.getElementById('downloadSection');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');
        
        // 设置事件监听器
        selectFileBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFileSelect);
        uploadArea.addEventListener('dragover', handleDragOver);
        uploadArea.addEventListener('dragleave', handleDragLeave);
        uploadArea.addEventListener('drop', handleDrop);
        selectAllBtn.addEventListener('click', selectAllPages);
        deselectAllBtn.addEventListener('click', deselectAllPages);
        deletePagesBtn.addEventListener('click', deleteSelectedPages);
        downloadBtn.addEventListener('click', downloadNewPdf);
        resetBtn.addEventListener('click', resetTool);
        
        // 处理文件选择
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file && file.type === 'application/pdf') {
                processPdfFile(file);
            } else {
                showStatus('请选择有效的PDF文件', 'error');
            }
        }
        
        // 处理拖放事件
        function handleDragOver(event) {
            event.preventDefault();
            uploadArea.classList.add('drag-over');
        }
        
        function handleDragLeave(event) {
            event.preventDefault();
            uploadArea.classList.remove('drag-over');
        }
        
        function handleDrop(event) {
            event.preventDefault();
            uploadArea.classList.remove('drag-over');
            
            const file = event.dataTransfer.files[0];
            if (file && file.type === 'application/pdf') {
                processPdfFile(file);
            } else {
                showStatus('请拖放有效的PDF文件', 'error');
            }
        }
        
        // 处理PDF文件
        function processPdfFile(file) {
            if (file.size > 20 * 1024 * 1024) {
                showStatus('文件大小超过20MB限制', 'error');
                return;
            }
            
            // 显示加载指示器
            loadingIndicator.classList.remove('hidden');
            noFileMessage.classList.add('hidden');
            fileInfo.classList.add('hidden');
            thumbnailContainer.innerHTML = '';
            selectedPages.clear();
            
            // 设置文件名
            fileNameElement.textContent = file.name;
            
            const fileReader = new FileReader();
            fileReader.onload = function() {
                const typedarray = new Uint8Array(this.result);
                
                // 使用PDF.js加载PDF
                pdfjsLib.getDocument(typedarray).promise.then(pdf => {
                    pdfDoc = pdf;
                    totalPages = pdf.numPages;
                    
                    // 更新页面信息
                    totalPagesElement.textContent = totalPages;
                    fileInfo.classList.remove('hidden');
                    
                    // 启用按钮
                    selectAllBtn.disabled = false;
                    deselectAllBtn.disabled = false;
                    deletePagesBtn.disabled = false;
                    
                    // 生成缩略图
                    generateThumbnails();
                    
                    // 隐藏加载指示器
                    loadingIndicator.classList.add('hidden');
                }).catch(error => {
                    console.error('PDF加载错误:', error);
                    showStatus('无法加载PDF文件，请检查文件格式', 'error');
                    loadingIndicator.classList.add('hidden');
                });
            };
            
            fileReader.readAsArrayBuffer(file);
        }
        
        // 生成PDF缩略图
        function generateThumbnails() {
            thumbnailContainer.innerHTML = '';
            
            for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
                const pageContainer = document.createElement('div');
                pageContainer.className = 'page-thumbnail';
                pageContainer.dataset.page = pageNum;
                
                const canvas = document.createElement('canvas');
                pageContainer.appendChild(canvas);
                
                const pageNumber = document.createElement('div');
                pageNumber.className = 'page-number';
                pageNumber.textContent = `第 ${pageNum} 页`;
                pageContainer.appendChild(pageNumber);
                
                // 点击选择/取消选择页面
                pageContainer.addEventListener('click', () => {
                    togglePageSelection(pageNum, pageContainer);
                });
                
                thumbnailContainer.appendChild(pageContainer);
                
                // 渲染缩略图
                renderThumbnail(pageNum, canvas);
            }
        }
        
        // 渲染缩略图
        function renderThumbnail(pageNum, canvas) {
            pdfDoc.getPage(pageNum).then(page => {
                const viewport = page.getViewport({ scale: 0.2 });
                const context = canvas.getContext('2d');
                
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                
                const renderContext = {
                    canvasContext: context,
                    viewport: viewport
                };
                
                page.render(renderContext);
            });
        }
        
        // 切换页面选择状态
        function togglePageSelection(pageNum, container) {
            if (selectedPages.has(pageNum)) {
                selectedPages.delete(pageNum);
                container.classList.remove('selected');
            } else {
                selectedPages.add(pageNum);
                container.classList.add('selected');
            }
            
            updateButtonState();
        }
        
        // 更新按钮状态
        function updateButtonState() {
            deletePagesBtn.disabled = selectedPages.size === 0;
        }
        
        // 全选页面
        function selectAllPages() {
            selectedPages.clear();
            const thumbnails = thumbnailContainer.querySelectorAll('.page-thumbnail');
            
            for (let i = 0; i < thumbnails.length; i++) {
                const pageNum = parseInt(thumbnails[i].dataset.page);
                selectedPages.add(pageNum);
                thumbnails[i].classList.add('selected');
            }
            
            updateButtonState();
        }
        
        // 取消全选
        function deselectAllPages() {
            selectedPages.clear();
            const thumbnails = thumbnailContainer.querySelectorAll('.page-thumbnail');
            
            for (let i = 0; i < thumbnails.length; i++) {
                thumbnails[i].classList.remove('selected');
            }
            
            updateButtonState();
        }
        
        // 删除选定页面
        function deleteSelectedPages() {
            if (selectedPages.size === 0) return;
            
            loadingIndicator.classList.remove('hidden');
            statusMessage.classList.add('hidden');
            
            // 创建新的PDF文档
            const newPdf = new pdfjsLib.PDFDocument();
            
            // 复制未选择的页面到新文档
            for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
                if (!selectedPages.has(pageNum)) {
                    pdfDoc.getPage(pageNum).then(page => {
                        return newPdf.copyPage(page);
                    }).then(newPage => {
                        newPdf.addPage(newPage);
                    });
                }
            }
            
            // 保存新PDF
            newPdf.save().then(pdfBytes => {
                processedPdf = pdfBytes;
                
                // 显示下载部分
                downloadSection.classList.remove('hidden');
                loadingIndicator.classList.add('hidden');
                
                // 显示成功消息
                const deletedCount = selectedPages.size;
                const remainingCount = totalPages - deletedCount;
                showStatus(`已成功删除 ${deletedCount} 页，新文档包含 ${remainingCount} 页`, 'success');
            }).catch(error => {
                console.error('PDF处理错误:', error);
                showStatus('处理PDF时出错，请重试', 'error');
                loadingIndicator.classList.add('hidden');
            });
        }
        
        // 下载新PDF
        function downloadNewPdf() {
            if (!processedPdf) return;
            
            const blob = new Blob([processedPdf], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `processed_${fileNameElement.textContent}`;
            document.body.appendChild(a);
            a.click();
            
            // 清理
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 100);
        }
        
        // 重置工具
        function resetTool() {
            // 重置所有状态
            pdfDoc = null;
            totalPages = 0;
            selectedPages.clear();
            processedPdf = null;
            
            // 重置UI
            fileInput.value = '';
            thumbnailContainer.innerHTML = '';
            noFileMessage.classList.remove('hidden');
            fileInfo.classList.add('hidden');
            downloadSection.classList.add('hidden');
            statusMessage.classList.add('hidden');
            
            selectAllBtn.disabled = true;
            deselectAllBtn.disabled = true;
            deletePagesBtn.disabled = true;
        }
        
        // 显示状态消息
        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = 'status-message';
            
            if (type === 'success') {
                statusMessage.classList.add('status-success');
            } else if (type === 'error') {
                statusMessage.classList.add('status-error');
            }
            
            statusMessage.classList.remove('hidden');
        }
    </script>
</body>
</html>
