    <style>
        * {

        }

            min-height: 100vh;
            padding: 20px;
            padding-bottom: 110px; /* 底部预留90px + 20px额外空间 */
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            padding: 25px;
            text-align: center;
            color: white;
        }

        .title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 16px;
            opacity: 0.9;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 3px solid #e9ecef;
        }

        .stat-item {
            text-align: center;
            flex: 1;
        }

        .stat-label {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #495057;
        }

        .pinyin-progress {
            color: #ff6b6b;
        }

        .hanzi-progress {
            color: #4ecdc4;
        }

        .card-container {
            padding: 30px;
        }

        .pinyin-card {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            color: white;
            margin-bottom: 30px;
            box-shadow: 0 15px 35px rgba(116, 185, 255, 0.3);
            transform: scale(1);
            transition: all 0.3s ease;
        }

        .pinyin-card:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 40px rgba(116, 185, 255, 0.4);
        }

        .pinyin-text {
            font-size: 60px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .pinyin-label {
            font-size: 18px;
            opacity: 0.9;
        }

        .examples-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .example-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            border: 3px solid transparent;
        }

        .example-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        .tone-1 {
            border-color: #ff6b6b;
            background: linear-gradient(135deg, #fff5f5, #ffe0e0);
        }

        .tone-2 {
            border-color: #4ecdc4;
            background: linear-gradient(135deg, #f0fffe, #d4f8f6);
        }

        .tone-3 {
            border-color: #45b7d1;
            background: linear-gradient(135deg, #f0f9ff, #dbeafe);
        }

        .tone-4 {
            border-color: #f9ca24;
            background: linear-gradient(135deg, #fffbeb, #fef3c7);
        }

        .example-emoji {
            font-size: 40px;
            margin-bottom: 10px;
            display: block;
        }

        .example-word {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #2d3436;
        }

        .tone-indicator {
            font-size: 14px;
            padding: 5px 10px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
        }

        .tone-1 .tone-indicator {
            background: #ff6b6b;
        }

        .tone-2 .tone-indicator {
            background: #4ecdc4;
        }

        .tone-3 .tone-indicator {
            background: #45b7d1;
        }

        .tone-4 .tone-indicator {
            background: #f9ca24;
        }

        .next-button {
            width: 100%;
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(108, 92, 231, 0.3);
        }

        .next-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(108, 92, 231, 0.4);
        }

        .next-button:active {
            transform: translateY(0);
        }

        /* 移动端优化 */
        @media (max-width: 768px) {
            body {
                padding: 15px;
                padding-bottom: 110px;
            }

            .container {
                border-radius: 20px;
            }

            .header {
                padding: 20px;
            }

            .title {

            .pinyin-text {
                font-size: 48px;
            }

            .examples-grid {

                gap: 12px;
            }

            .example-card {
                padding: 15px;
            }

            .example-emoji {
                font-size: 35px;
            }

            .example-word {
                font-size: 20px;
            }

            .next-button {
                padding: 18px;
                font-size: 18px;
            }
        }

            .stats {
                padding: 15px;
            }

            .stat-value {

            }

                padding: 30px;
            }

            .pinyin-text {
                font-size: 42px;
            }
        }

        /* 动画效果 */
        @keyframes cardFlip {
            from {
                transform: rotateY(-90deg);
                opacity: 0;
            }
            to {
                transform: rotateY(0deg);
                opacity: 1;
            }
        }

        .card-flip {
            animation: cardFlip 0.6s ease-out;
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

        // 学习进度状态
        let currentIndex = 0;
        let learnedPinyinSet = new Set();
        let learnedHanziSet = new Set();

        // 初始化
        function init() {
            updateStats();
            displayCurrentPinyin();
        }

        // 更新统计信息
        function updateStats() {
            const totalPinyin = pinyinData.length;
            const totalHanzi = pinyinData.reduce((sum, item) => sum + item.examples.length, 0);
            
            document.getElementById('learnedPinyin').textContent = learnedPinyinSet.size;
            document.getElementById('totalPinyin').textContent = totalPinyin;
            document.getElementById('learnedHanzi').textContent = learnedHanziSet.size;
            document.getElementById('totalHanzi').textContent = totalHanzi;
        }

        // 显示当前拼音
        function displayCurrentPinyin() {
            const currentData = pinyinData[currentIndex];
            
            // 添加动画效果
            const card = document.getElementById('pinyinCard');
            const examplesGrid = document.getElementById('examplesGrid');
            
            card.classList.add('card-flip');
            
            // 更新拼音文本
            document.getElementById('pinyinText').textContent = currentData.pinyin;
            
            // 生成例子卡片
            examplesGrid.innerHTML = '';
            currentData.examples.forEach((example, index) => {
                const exampleCard = document.createElement('div');
                exampleCard.className = `example-card tone-${example.tone}`;
                exampleCard.innerHTML = `
                    <span class="example-emoji">${example.emoji}</span>
                    <div class="example-word">${example.word}</div>
                    <span class="tone-indicator">${['一', '二', '三', '四'][example.tone - 1]}声</span>
                `;
                
                // 添加延迟动画
                setTimeout(() => {
                    exampleCard.style.opacity = '0';
                    exampleCard.style.transform = 'translateY(20px)';
                    examplesGrid.appendChild(exampleCard);
                    
                    setTimeout(() => {
                        exampleCard.style.transition = 'all 0.5s ease';
                        exampleCard.style.opacity = '1';
                        exampleCard.style.transform = 'translateY(0)';
                    }, 50);
                }, index * 100);
            });
            
            // 记录学习进度
            learnedPinyinSet.add(currentData.pinyin);
            currentData.examples.forEach(example => {
                learnedHanziSet.add(example.word);
            });
            
            updateStats();
            
            // 移除动画类
            setTimeout(() => {
                card.classList.remove('card-flip');
            }, 600);
        }

        // 下一个拼音
        function nextPinyin() {
            // 随机选择下一个拼音
            let nextIndex;
            do {
                nextIndex = Math.floor(Math.random() * pinyinData.length);
            } while (nextIndex === currentIndex && pinyinData.length > 1);
            
            currentIndex = nextIndex;
            displayCurrentPinyin();
            
            // 按钮点击效果
            const button = document.getElementById('nextButton');
            button.style.transform = 'scale(0.95)';
            setTimeout(() => {
                button.style.transform = 'scale(1)';
            }, 150);
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);

        // 添加键盘支持
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowRight') {
                e.preventDefault();
                nextPinyin();
            }
        });

        // 添加触摸手势支持
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });

        document.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleGesture();
        });

        function handleGesture() {
            const swipeThreshold = 50;
            const diff = touchStartX - touchEndX;
            
            if (Math.abs(diff) > swipeThreshold) {
                if (diff > 0) {
                    // 向左滑动，切换到下一个
                    nextPinyin();
                }
            }
        }
        document.addEventListener('DOMContentLoaded', () => {
            const tpl = document.getElementById('site-footer');
            if (tpl && 'content' in tpl) {
            document.body.appendChild(tpl.content.cloneNode(true));
            }

            // 用 data-img 填充 <img src>
            document.querySelectorAll('.qr-wrapper').forEach(w => {
            const link = w.querySelector('.qr-link');
            const img  = w.querySelector('.qr-img');
            if (link && img && link.dataset.img) {
                img.src = link.dataset.img.trim();
            }
            });
        });
