<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>成语填空 · DKFile</title>
  <meta name="description" content="从公开词库随机出题，练习四字成语填空。">
  <style>
    :root {
      --green: #059669;
      --green-mid: #10b981;
      --green-soft: #d1fae5;
      --green-faint: #ecfdf5;
      --ink: #0f172a;
      --ink-soft: #475569;
      --muted: #94a3b8;
      --line: #e2e8f0;
      --card: #ffffff;
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 22px 50px -12px rgba(15, 23, 42, 0.12);
      --radius: 16px;
      --radius-sm: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      line-height: 1.55;
      background: linear-gradient(165deg, var(--green-faint) 0%, #f8fafc 42%, #ffffff 100%);
      background-attachment: fixed;
    }
    .wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: clamp(20px, 4vw, 40px) clamp(16px, 4vw, 28px) 48px;
    }
    .hero {
      text-align: center;
      margin-bottom: clamp(18px, 3vw, 28px);
    }
    .hero-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--green);
      background: rgba(16, 185, 129, 0.12);
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    .hero-title {
      margin: 0;
      font-size: clamp(1.45rem, 4vw, 1.8rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .hero-desc {
      margin: 10px auto 0;
      max-width: 420px;
      font-size: 0.9rem;
      color: var(--ink-soft);
    }
    .hero-hosted {
      margin: 14px auto 0;
      max-width: 480px;
      font-size: 0.86rem;
      color: var(--ink-soft);
      line-height: 1.55;
    }
    .hero-hosted a {
      color: var(--green);
      font-weight: 600;
      text-decoration: none;
    }
    .hero-hosted a:hover { text-decoration: underline; }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(226, 232, 240, 0.85);
      padding: clamp(22px, 4vw, 32px);
    }
    .status {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 20px;
      font-size: 0.85rem;
      color: var(--ink-soft);
    }
    .status strong { color: var(--green); font-weight: 700; }
    .load-panel {
      text-align: center;
      padding: 28px 12px;
      color: var(--ink-soft);
      font-size: 0.95rem;
    }
    .load-panel.err { color: #b91c1c; }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--line);
      border-top-color: var(--green-mid);
      border-radius: 50%;
      margin: 0 auto 14px;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
    .idiom-row {
      display: flex;
      justify-content: center;
      gap: clamp(8px, 2vw, 12px);
      margin: 8px 0 22px;
      flex-wrap: wrap;
    }
    .cell {
      width: clamp(52px, 14vw, 68px);
      height: clamp(56px, 15vw, 72px);
      border-radius: var(--radius-sm);
      border: 2px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.35rem, 5vw, 1.75rem);
      font-weight: 700;
      color: var(--ink);
      background: #fafafa;
    }
    .cell.blank {
      border-color: var(--green-mid);
      background: var(--green-faint);
      padding: 0;
    }
    .cell.blank input {
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
      text-align: center;
      font: inherit;
      font-weight: 700;
      color: var(--ink);
      outline: none;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 8px;
    }
    button {
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 12px 22px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    }
    button:active { transform: scale(0.98); }
    .btn-primary {
      background: linear-gradient(135deg, var(--green-mid), var(--green));
      color: #fff;
      box-shadow: 0 8px 20px rgba(5, 150, 105, 0.28);
    }
    .btn-primary:hover { box-shadow: 0 10px 24px rgba(5, 150, 105, 0.35); }
    .btn-ghost {
      background: #fff;
      color: var(--ink-soft);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    .btn-ghost:hover { border-color: rgba(5, 150, 105, 0.35); color: var(--green); }
    .feedback {
      min-height: 1.5em;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 600;
      margin-top: 14px;
    }
    .feedback.ok { color: var(--green); }
    .feedback.bad { color: #b45309; }
    .hint {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      background: rgba(236, 253, 245, 0.9);
      border: 1px solid rgba(16, 185, 129, 0.2);
      font-size: 0.82rem;
      color: var(--ink-soft);
      line-height: 1.5;
    }
    .footer-note {
      margin-top: 28px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .footer-note a {
      color: var(--green);
      text-decoration: none;
    }
    .footer-note a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="hero-badge">DKFile · 静态小工具</div>
      <h1 class="hero-title">成语填空</h1>
      <p class="hero-desc">从公开词库随机抽取四字成语，挖去一字，补全即可进入下一题。</p>
      <p class="hero-hosted">
        本页是用 DKFile
        <a href="https://dkfile.net/hosted-data" target="_blank" rel="noopener noreferrer">数据托管</a>
        做的一个演示：页面只需发布一次，词库在云端在线维护，更新数据后刷新页面即可生效（热更新）。
      </p>
    </header>

    <main class="card">
      <div id="loadPanel" class="load-panel">
        <div class="spinner" aria-hidden="true"></div>
        <div>正在加载词库…</div>
      </div>

      <div id="gamePanel" class="hidden">
        <div class="status">
          <span>词库：<strong id="libCount">—</strong> 条</span>
          <span>连续答对：<strong id="streak">0</strong></span>
        </div>
        <div class="idiom-row" id="idiomRow" aria-live="polite"></div>
        <div class="actions">
          <button type="button" class="btn-primary" id="btnCheck">核对</button>
          <button type="button" class="btn-ghost" id="btnSkip">换一题</button>
          <button type="button" class="btn-ghost hidden" id="btnNext">下一题</button>
        </div>
        <div class="feedback" id="feedback" aria-live="assertive"></div>
        <div class="hint">
          说明：输入框内填写<strong>一个汉字</strong>；支持输入法确认后的单字。若加载失败，请检查网络或稍后重试。
        </div>
      </div>
    </main>

    <p class="footer-note">
      词库来源：
      <a href="https://dkfile.net/dkfile-data/pub/f5d8d830b8487f558005acca25e705e6" target="_blank" rel="noopener noreferrer">dkfile 公开数据</a>
    </p>
  </div>

  <script>
(function () {
  var DATA_URL = 'https://dkfile.net/dkfile-data/pub/f5d8d830b8487f558005acca25e705e6';

  var loadPanel = document.getElementById('loadPanel');
  var gamePanel = document.getElementById('gamePanel');
  var idiomRow = document.getElementById('idiomRow');
  var libCountEl = document.getElementById('libCount');
  var streakEl = document.getElementById('streak');
  var feedbackEl = document.getElementById('feedback');
  var btnCheck = document.getElementById('btnCheck');
  var btnSkip = document.getElementById('btnSkip');
  var btnNext = document.getElementById('btnNext');

  var words = [];
  var streak = 0;
  var current = null;
  var answered = false;

  function isFourHan(s) {
    return typeof s === 'string' && /^[\u4e00-\u9fff]{4}$/.test(s);
  }

  function normalizeChar(ch) {
    if (!ch) return '';
    var t = String(ch).trim();
    if (!t) return '';
    return t.charAt(t.length - 1);
  }

  function showLoadError(msg) {
    loadPanel.classList.add('err');
    loadPanel.innerHTML = '<div style="margin-bottom:10px;font-weight:600;">' + (msg || '加载失败') + '</div>' +
      '<button type="button" class="btn-primary" id="btnRetry" style="margin-top:6px;">重试</button>';
    document.getElementById('btnRetry').addEventListener('click', function () {
      loadPanel.classList.remove('err');
      loadPanel.innerHTML = '<div class="spinner" aria-hidden="true"></div><div>正在加载词库…</div>';
      fetchWords();
    });
  }

  function fetchWords() {
    fetch(DATA_URL, { credentials: 'omit' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        var raw = (data && data.words) ? data.words : [];
        words = raw.filter(isFourHan);
        if (!words.length) {
          showLoadError('词库为空或格式不符');
          return;
        }
        loadPanel.classList.add('hidden');
        gamePanel.classList.remove('hidden');
        libCountEl.textContent = String(words.length);
        newRound();
      })
      .catch(function () {
        showLoadError('无法拉取词库（网络或跨域限制）。请直接在本站域名下打开，或稍后重试。');
      });
  }

  function pickRandom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function newRound() {
    answered = false;
    feedbackEl.textContent = '';
    feedbackEl.className = 'feedback';
    btnCheck.classList.remove('hidden');
    btnSkip.classList.remove('hidden');
    btnNext.classList.add('hidden');

    var w = pickRandom(words);
    var blankIndex = Math.floor(Math.random() * 4);
    current = { word: w, blankIndex: blankIndex };

    idiomRow.innerHTML = '';
    for (var i = 0; i < 4; i++) {
      var cell = document.createElement('div');
      cell.className = 'cell';
      if (i === blankIndex) {
        cell.className += ' blank';
        var inp = document.createElement('input');
        inp.setAttribute('type', 'text');
        inp.setAttribute('inputmode', 'text');
        inp.setAttribute('autocomplete', 'off');
        inp.setAttribute('autocorrect', 'off');
        inp.setAttribute('autocapitalize', 'off');
        inp.setAttribute('spellcheck', 'false');
        inp.setAttribute('maxlength', '4');
        inp.setAttribute('aria-label', '填入缺字');
        inp.id = 'blankInput';
        cell.appendChild(inp);
      } else {
        cell.textContent = w.charAt(i);
      }
      idiomRow.appendChild(cell);
    }

    var input = document.getElementById('blankInput');
    if (input) {
      input.value = '';
      setTimeout(function () { input.focus(); }, 50);
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          checkAnswer();
        }
      });
    }
  }

  function checkAnswer() {
    if (!current || answered) return;
    var input = document.getElementById('blankInput');
    var got = normalizeChar(input && input.value);
    var need = current.word.charAt(current.blankIndex);
    if (!got) {
      feedbackEl.textContent = '请先输入一个汉字。';
      feedbackEl.className = 'feedback bad';
      return;
    }
    if (got === need) {
      answered = true;
      streak += 1;
      streakEl.textContent = String(streak);
      feedbackEl.textContent = '正确，成语为「' + current.word + '」。';
      feedbackEl.className = 'feedback ok';
      btnCheck.classList.add('hidden');
      btnSkip.classList.add('hidden');
      btnNext.classList.remove('hidden');
    } else {
      streak = 0;
      streakEl.textContent = '0';
      feedbackEl.textContent = '再想想。提示：正确答案是「' + need + '」。';
      feedbackEl.className = 'feedback bad';
    }
  }

  btnCheck.addEventListener('click', checkAnswer);
  btnSkip.addEventListener('click', newRound);
  btnNext.addEventListener('click', newRound);

  fetchWords();
})();
  </script>
</body>
</html>
