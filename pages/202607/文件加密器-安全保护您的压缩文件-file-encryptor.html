<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件加密器 - 安全保护您的压缩文件</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .tab-container {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
        }

        .tab {
            flex: 1;
            padding: 12px 24px;
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            color: #666;
            transition: all 0.3s ease;
            position: relative;
        }

        .tab.active {
            color: #667eea;
            font-weight: 600;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: #667eea;
        }

        .content {
            display: none;
        }

        .content.active {
            display: block;
        }

        .upload-area {
            border: 2px dashed #ddd;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: #667eea;
            background-color: #f8f9ff;
        }

        .upload-area.dragover {
            border-color: #667eea;
            background-color: #f8f9ff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 10px;
        }

        .file-info {
            margin: 20px 0;
            padding: 15px;
            background: #f8f9ff;
            border-radius: 10px;
            display: none;
        }

        .file-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .file-size {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .password-strength {
            height: 4px;
            background: #eee;
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
            display: none;
        }

        .password-strength-bar {
            height: 100%;
            transition: width 0.3s ease, background-color 0.3s ease;
            width: 0%;
        }

        .password-strength-text {
            font-size: 12px;
            margin-top: 5px;
            color: #666;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .progress {
            margin: 20px 0;
            display: none;
        }

        .progress-bar {
            height: 8px;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            margin-top: 10px;
            color: #666;
            font-size: 14px;
        }

        .error {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        .success {
            color: #27ae60;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
                margin: 10px;
            }
            
            .header h1 {
                font-size: 24px;
            }
            
            .upload-area {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 文件加密器</h1>
            <p>安全加密您的压缩文件，保护您的隐私</p>
            <p style="color: #ff6b6b; font-size: 13px; margin-top: 8px; font-weight: 600;">
                ⚠️ 请先将要加密的文件压缩成 .zip/.7z/.rar 等格式后再上传加密
            </p>
        </div>

        <div class="tab-container">
            <button class="tab active" onclick="switchTab('encrypt')">加密文件</button>
            <button class="tab" onclick="switchTab('decrypt')">解密文件</button>
        </div>

        <div id="encrypt-content" class="content active">
            <div class="upload-area" id="encrypt-upload-area">
                <div class="upload-icon">📁</div>
                <p>点击或拖拽上传压缩文件</p>
                <p style="font-size: 12px; color: #999; margin-top: 5px;">支持 .zip, .7z, .rar 等格式</p>
            </div>
            <input type="file" id="encrypt-file-input" style="display: none;" accept=".zip,.7z,.rar,.tar,.gz">
            
            <div class="file-info" id="encrypt-file-info">
                <div class="file-name" id="encrypt-file-name"></div>
                <div class="file-size" id="encrypt-file-size"></div>
            </div>

            <div class="form-group">
                <label for="encrypt-password1">输入密码</label>
                <input type="password" id="encrypt-password1" placeholder="请输入密码">
                <div class="password-strength" id="encrypt-strength">
                    <div class="password-strength-bar" id="encrypt-strength-bar"></div>
                </div>
                <div class="password-strength-text" id="encrypt-strength-text"></div>
            </div>

            <div class="form-group">
                <label for="encrypt-password2">确认密码</label>
                <input type="password" id="encrypt-password2" placeholder="请再次输入密码">
                <div class="error" id="encrypt-password-error">两次输入的密码不一致</div>
            </div>

            <button class="btn" id="encrypt-btn" onclick="encryptFile()" disabled>开始加密</button>

            <div class="progress" id="encrypt-progress">
                <div class="progress-bar">
                    <div class="progress-fill" id="encrypt-progress-fill"></div>
                </div>
                <div class="progress-text" id="encrypt-progress-text">准备中...</div>
            </div>

            <div class="success" id="encrypt-success">加密成功！文件已下载到您的设备。</div>
        </div>

        <div id="decrypt-content" class="content">
            <div class="upload-area" id="decrypt-upload-area">
                <div class="upload-icon">🔓</div>
                <p>点击或拖拽上传加密文件</p>
                <p style="font-size: 12px; color: #999; margin-top: 5px;">支持 .enc 格式</p>
            </div>
            <input type="file" id="decrypt-file-input" style="display: none;" accept=".enc">
            
            <div class="file-info" id="decrypt-file-info">
                <div class="file-name" id="decrypt-file-name"></div>
                <div class="file-size" id="decrypt-file-size"></div>
            </div>

            <div class="form-group">
                <label for="decrypt-password">输入密码</label>
                <input type="password" id="decrypt-password" placeholder="请输入解密密码">
            </div>

            <button class="btn" id="decrypt-btn" onclick="decryptFile()" disabled>开始解密</button>

            <div class="progress" id="decrypt-progress">
                <div class="progress-bar">
                    <div class="progress-fill" id="decrypt-progress-fill"></div>
                </div>
                <div class="progress-text" id="decrypt-progress-text">准备中...</div>
            </div>

            <div class="success" id="decrypt-success">解密成功！原始文件已下载到您的设备。</div>
            <div class="error" id="decrypt-error">解密失败，请检查密码是否正确。</div>
        </div>
    </div>

    <script>
        // 全局变量
        let encryptFileData = null;
        let decryptFileData = null;

        // 切换标签
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            
            document.querySelector(`[onclick="switchTab('${tab}')"]`).classList.add('active');
            document.getElementById(`${tab}-content`).classList.add('active');
        }

        // 加密上传区域事件
        const encryptUploadArea = document.getElementById('encrypt-upload-area');
        const encryptFileInput = document.getElementById('encrypt-file-input');

        encryptUploadArea.addEventListener('click', () => encryptFileInput.click());
        encryptUploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            encryptUploadArea.classList.add('dragover');
        });
        encryptUploadArea.addEventListener('dragleave', () => {
            encryptUploadArea.classList.remove('dragover');
        });
        encryptUploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            encryptUploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleEncryptFile(files[0]);
            }
        });

        encryptFileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleEncryptFile(e.target.files[0]);
            }
        });

        // 解密上传区域事件
        const decryptUploadArea = document.getElementById('decrypt-upload-area');
        const decryptFileInput = document.getElementById('decrypt-file-input');

        decryptUploadArea.addEventListener('click', () => decryptFileInput.click());
        decryptUploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            decryptUploadArea.classList.add('dragover');
        });
        decryptUploadArea.addEventListener('dragleave', () => {
            decryptUploadArea.classList.remove('dragover');
        });
        decryptUploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            decryptUploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleDecryptFile(files[0]);
            }
        });

        decryptFileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleDecryptFile(e.target.files[0]);
            }
        });

        // 处理加密文件
        function handleEncryptFile(file) {
            encryptFileData = file;
            document.getElementById('encrypt-file-info').style.display = 'block';
            document.getElementById('encrypt-file-name').textContent = file.name;
            document.getElementById('encrypt-file-size').textContent = formatFileSize(file.size);
            checkEncryptButton();
        }

        // 处理解密文件
        function handleDecryptFile(file) {
            decryptFileData = file;
            document.getElementById('decrypt-file-info').style.display = 'block';
            document.getElementById('decrypt-file-name').textContent = file.name;
            document.getElementById('decrypt-file-size').textContent = formatFileSize(file.size);
            document.getElementById('decrypt-btn').disabled = false;
        }

        // 密码强度检测
        document.getElementById('encrypt-password1').addEventListener('input', function() {
            const password = this.value;
            const strengthBar = document.getElementById('encrypt-strength-bar');
            const strengthText = document.getElementById('encrypt-strength-text');
            const strengthContainer = document.getElementById('encrypt-strength');
            
            strengthContainer.style.display = 'block';
            
            let strength = 0;
            if (password.length >= 8) strength += 25;
            if (/[a-z]/.test(password)) strength += 25;
            if (/[A-Z]/.test(password)) strength += 25;
            if (/[0-9]/.test(password)) strength += 25;
            if (/[^A-Za-z0-9]/.test(password)) strength += 25;
            
            strength = Math.min(strength, 100);
            strengthBar.style.width = strength + '%';
            
            if (strength < 25) {
                strengthBar.style.backgroundColor = '#e74c3c';
                strengthText.textContent = '弱';
            } else if (strength < 50) {
                strengthBar.style.backgroundColor = '#f39c12';
                strengthText.textContent = '一般';
            } else if (strength < 75) {
                strengthBar.style.backgroundColor = '#3498db';
                strengthText.textContent = '良好';
            } else {
                strengthBar.style.backgroundColor = '#27ae60';
                strengthText.textContent = '强';
            }
            
            checkEncryptButton();
        });

        // 检查密码匹配
        document.getElementById('encrypt-password2').addEventListener('input', checkEncryptButton);

        function checkEncryptButton() {
            const password1 = document.getElementById('encrypt-password1').value;
            const password2 = document.getElementById('encrypt-password2').value;
            const error = document.getElementById('encrypt-password-error');
            
            if (password1 && password2 && password1 === password2 && encryptFileData) {
                document.getElementById('encrypt-btn').disabled = false;
                error.style.display = 'none';
            } else {
                document.getElementById('encrypt-btn').disabled = true;
                if (password1 && password2 && password1 !== password2) {
                    error.style.display = 'block';
                } else {
                    error.style.display = 'none';
                }
            }
        }

        // 加密文件
        async function encryptFile() {
            const password = document.getElementById('encrypt-password1').value;
            const progress = document.getElementById('encrypt-progress');
            const progressFill = document.getElementById('encrypt-progress-fill');
            const progressText = document.getElementById('encrypt-progress-text');
            
            progress.style.display = 'block';
            document.getElementById('encrypt-btn').disabled = true;
            
            try {
                const arrayBuffer = await encryptFileData.arrayBuffer();
                const encrypted = await encryptData(arrayBuffer, password);
                
                // 模拟进度
                let currentProgress = 0;
                const interval = setInterval(() => {
                    currentProgress += 5;
                    progressFill.style.width = currentProgress + '%';
                    progressText.textContent = `加密中... ${currentProgress}%`;
                    
                    if (currentProgress >= 100) {
                        clearInterval(interval);
                        
                        // 创建下载
                        const blob = new Blob([encrypted], { type: 'application/octet-stream' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = encryptFileData.name + '.enc';
                        a.click();
                        URL.revokeObjectURL(url);
                        
                        document.getElementById('encrypt-success').style.display = 'block';
                        progress.style.display = 'none';
                        
                        // 重置表单
                        setTimeout(() => {
                            resetEncryptForm();
                        }, 3000);
                    }
                }, 50);
                
            } catch (error) {
                console.error('加密失败:', error);
                alert('加密失败，请重试');
                document.getElementById('encrypt-btn').disabled = false;
                progress.style.display = 'none';
            }
        }

        // 解密文件
        async function decryptFile() {
            const password = document.getElementById('decrypt-password').value;
            const progress = document.getElementById('decrypt-progress');
            const progressFill = document.getElementById('decrypt-progress-fill');
            const progressText = document.getElementById('decrypt-progress-text');
            const error = document.getElementById('decrypt-error');
            
            progress.style.display = 'block';
            document.getElementById('decrypt-btn').disabled = true;
            error.style.display = 'none';
            
            try {
                const arrayBuffer = await decryptFileData.arrayBuffer();
                const decrypted = await decryptData(arrayBuffer, password);
                
                // 模拟进度
                let currentProgress = 0;
                const interval = setInterval(() => {
                    currentProgress += 5;
                    progressFill.style.width = currentProgress + '%';
                    progressText.textContent = `解密中... ${currentProgress}%`;
                    
                    if (currentProgress >= 100) {
                        clearInterval(interval);
                        
                        // 创建下载
                        const blob = new Blob([decrypted], { type: 'application/octet-stream' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        
                        // 移除.enc后缀
                        const originalName = decryptFileData.name.replace(/\.enc$/, '');
                        a.download = originalName;
                        a.click();
                        URL.revokeObjectURL(url);
                        
                        document.getElementById('decrypt-success').style.display = 'block';
                        progress.style.display = 'none';
                        
                        // 重置表单
                        setTimeout(() => {
                            resetDecryptForm();
                        }, 3000);
                    }
                }, 50);
                
            } catch (error) {
                console.error('解密失败:', error);
                error.style.display = 'block';
                document.getElementById('decrypt-btn').disabled = false;
                progress.style.display = 'none';
            }
        }

        // 加密数据 (使用 Web Crypto API)
        async function encryptData(data, password) {
            const encoder = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey(
                'raw',
                encoder.encode(password),
                { name: 'PBKDF2' },
                false,
                ['deriveKey']
            );
            
            const salt = crypto.getRandomValues(new Uint8Array(16));
            const key = await crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
                keyMaterial,
                { name: 'AES-GCM', length: 256 },
                false,
                ['encrypt']
            );
            
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const encrypted = await crypto.subtle.encrypt(
                { name: 'AES-GCM', iv: iv },
                key,
                data
            );
            
            // 组合 salt + iv + 加密数据
            const result = new Uint8Array(salt.length + iv.length + encrypted.byteLength);
            result.set(salt, 0);
            result.set(iv, salt.length);
            result.set(new Uint8Array(encrypted), salt.length + iv.length);
            
            return result;
        }

        // 解密数据
        async function decryptData(encryptedData, password) {
            const encoder = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey(
                'raw',
                encoder.encode(password),
                { name: 'PBKDF2' },
                false,
                ['deriveKey']
            );
            
            const salt = encryptedData.slice(0, 16);
            const iv = encryptedData.slice(16, 28);
            const data = encryptedData.slice(28);
            
            const key = await crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
                keyMaterial,
                { name: 'AES-GCM', length: 256 },
                false,
                ['decrypt']
            );
            
            const decrypted = await crypto.subtle.decrypt(
                { name: 'AES-GCM', iv: iv },
                key,
                data
            );
            
            return decrypted;
        }

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // 重置加密表单
        function resetEncryptForm() {
            encryptFileData = null;
            document.getElementById('encrypt-file-info').style.display = 'none';
            document.getElementById('encrypt-password1').value = '';
            document.getElementById('encrypt-password2').value = '';
            document.getElementById('encrypt-strength').style.display = 'none';
            document.getElementById('encrypt-success').style.display = 'none';
            document.getElementById('encrypt-btn').disabled = true;
        }

        // 重置解密表单
        function resetDecryptForm() {
            decryptFileData = null;
            document.getElementById('decrypt-file-info').style.display = 'none';
            document.getElementById('decrypt-password').value = '';
            document.getElementById('decrypt-success').style.display = 'none';
            document.getElementById('decrypt-error').style.display = 'none';
            document.getElementById('decrypt-btn').disabled = true;
        }
    </script>
</body>
</html>
