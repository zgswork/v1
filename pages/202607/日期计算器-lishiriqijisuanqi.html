<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日期计算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #2e7d32 0%, #66bb6a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            transition: transform 0.3s ease;
        }
        
        .container:hover {
            transform: translateY(-5px);
        }
        
        h1 {
            color: #2e7d32;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .description {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        
        .today-section {
            background-color: #e8f5e9;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            border-left: 4px solid #4caf50;
        }
        
        .today-label {
            font-weight: 600;
            color: #2e7d32;
            margin-bottom: 5px;
        }
        
        .today-date {
            font-size: 1.2em;
            color: #333;
        }
        
        .input-section {
            margin-bottom: 30px;
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }
        
        label {
            text-align: left;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
        }
        
        input {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #4caf50;
        }
        
        button {
            background: linear-gradient(to right, #4caf50, #2e7d32);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            width: 100%;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .result-section {
            background-color: #f1f8e9;
            padding: 20px;
            border-radius: 10px;
            margin-top: 25px;
            border-left: 4px solid #2e7d32;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.5s ease;
        }
        
        .result-section.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        .result-label {
            font-weight: 600;
            color: #2e7d32;
            margin-bottom: 10px;
        }
        
        .result-date {
            font-size: 1.5em;
            font-weight: 700;
            color: #333;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }
            
            h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>历史日期计算器</h1>
        <p class="description">输入天数，计算从今天起多少天前的具体日期</p>
        
        <div class="today-section">
            <div class="today-label">今天是：</div>
            <div class="today-date" id="todayDate">2025年09月28日</div>
        </div>
        
        <div class="input-section">
            <div class="input-group">
                <label for="daysInput">输入天数：</label>
                <input type="number" id="daysInput" min="1" max="10000" placeholder="例如：30">
            </div>
            
            <button id="calculateBtn">计算日期</button>
        </div>
        
        <div class="result-section" id="resultSection">
            <div class="result-label">计算结果：</div>
            <div class="result-date" id="resultDate">-</div>
        </div>
    </div>

    <script>
        // 获取当前日期并显示
        const today = new Date();
        const todayDateElement = document.getElementById('todayDate');
        todayDateElement.textContent = formatDate(today);
        
        // 获取DOM元素
        const daysInput = document.getElementById('daysInput');
        const calculateBtn = document.getElementById('calculateBtn');
        const resultSection = document.getElementById('resultSection');
        const resultDateElement = document.getElementById('resultDate');
        
        // 计算按钮点击事件
        calculateBtn.addEventListener('click', calculateDate);
        
        // 输入框回车事件
        daysInput.addEventListener('keyup', function(event) {
            if (event.key === 'Enter') {
                calculateDate();
            }
        });
        
        // 计算日期函数
        function calculateDate() {
            const days = parseInt(daysInput.value);
            
            if (isNaN(days) || days <= 0) {
                alert('请输入有效的天数（大于0的数字）');
                return;
            }
            
            // 计算过去日期
            const pastDate = new Date(today);
            pastDate.setDate(today.getDate() - days);
            
            // 显示结果
            resultDateElement.textContent = formatDate(pastDate);
            resultSection.classList.add('show');
        }
        
        // 格式化日期函数
        function formatDate(date) {
            const year = date.getFullYear();
            const month = date.getMonth() + 1; // 月份从0开始，需要加1
            const day = date.getDate();
            
            return `${year}年${month}月${day}日`;
        }
        
        // 页面加载后自动聚焦输入框
        window.onload = function() {
            daysInput.focus();
        };
    </script>
