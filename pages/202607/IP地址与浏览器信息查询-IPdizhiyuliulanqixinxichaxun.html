<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>IP地址与浏览器信息查询</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --card: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --border: #334155;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --accent: #16a34a;
        --warn: #b45309;
        --danger: #b91c1c;
        --border: #e2e8f0;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }
    header {
      margin-bottom: 24px;
    }
    h1 { font-size: 22px; margin: 0 0 8px; }
    .desc { color: var(--muted); font-size: 14px; }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    @media (min-width: 640px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }
    @media (min-width: 960px) {
      .grid { grid-template-columns: 1fr 1fr 1fr; }
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.08);
    }
    .card h2 { font-size: 16px; margin: 0 0 12px; }
    .value-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .value {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 15px;
      background: rgba(255,255,255,0.06);
      border: 1px dashed var(--border);
      padding: 6px 8px;
      border-radius: 8px;
      word-break: break-all;
    }
    .btn {
      appearance: none; border: 1px solid var(--border);
      background: transparent; color: var(--text);
      padding: 6px 10px; border-radius: 8px; cursor: pointer;
      font-size: 13px;
    }
    .btn:hover { border-color: var(--accent); }
    .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn.warn { border-color: var(--warn); color: var(--warn); }
    .kvs { display: grid; grid-template-columns: 160px 1fr; gap: 8px 12px; }
    @media (max-width: 480px) { .kvs { grid-template-columns: 1fr; } }
    .key { color: var(--muted); font-size: 13px; }
    .val { font-size: 14px; }
    footer { margin-top: 24px; color: var(--muted); font-size: 12px; }
    .small { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>IP地址与浏览器信息查询</h1>
      <div class="desc">显示您当前的公网IP（IPv4/IPv6）与浏览器环境信息。页面自适应，适配电脑与手机。</div>
    </header>

    <section class="grid" aria-label="IP信息">
      <div class="card">
        <h2>公网 IPv4</h2>
        <div class="value-row">
          <div id="ipv4" class="value">正在获取…</div>
          <button class="btn" id="copyV4">复制</button>
          <button class="btn" id="refreshV4">刷新</button>
        </div>
        <div class="small" id="ipv4Status">数据来源：ipify 等多源回退</div>
      </div>
      <div class="card">
        <h2>公网 IPv6</h2>
        <div class="value-row">
          <div id="ipv6" class="value">正在获取…</div>
          <button class="btn" id="copyV6">复制</button>
          <button class="btn" id="refreshV6">刷新</button>
        </div>
        <div class="small" id="ipv6Status">数据来源：ipify(v6) / ident.me 回退</div>
      </div>
      <div class="card">
        <h2>用户代理 UA</h2>
        <div class="value-row">
          <div id="ua" class="value">—</div>
          <button class="btn" id="copyUA">复制</button>
        </div>
        <div class="small">某些浏览器可能对 UA 做隐私保护与裁剪</div>
      </div>
    </section>

    <section class="card" style="margin-top:12px" aria-label="浏览器环境">
      <h2>浏览器环境</h2>
      <div class="kvs" id="envList">
        <!-- 动态填充 -->
      </div>
      <div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn primary" id="refreshAll">全部刷新</button>
        <button class="btn" id="copyAll">复制全部信息</button>
      </div>
    </section>

    <footer>
      外部服务：ipify、ident.me 等。若网络或跨域受限，IP查询可能失败，可点击刷新重试。
    </footer>
  </div>

  <script>
    const setText = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text ?? '—'; };
    const setStatus = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };

    async function fetchWithTimeout(url, { timeout = 6000, headers } = {}) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeout);
      try {
        const res = await fetch(url, { signal: controller.signal, headers });
        return res;
      } finally {
        clearTimeout(timer);
      }
    }

    async function getIPv4() {
      const sources = [
        async () => {
          const r = await fetchWithTimeout('https://api.ipify.org?format=json');
          const j = await r.json(); return { ip: j.ip, source: 'api.ipify.org' };
        },
        async () => {
          const r = await fetchWithTimeout('https://ipapi.co/ip/');
          const t = await r.text(); return { ip: t.trim(), source: 'ipapi.co/ip' };
        },
        async () => {
          const r = await fetchWithTimeout('https://api.myip.com');
          const j = await r.json(); return { ip: j.ip, source: 'api.myip.com' };
        }
      ];
      for (const s of sources) {
        try {
          const { ip, source } = await s();
          if (ip && ip.length) { setText('ipv4', ip); setStatus('ipv4Status', `数据来源：${source}`); return ip; }
        } catch (e) { /* try next */ }
      }
      setText('ipv4', '获取失败');
      setStatus('ipv4Status', '数据来源：所有接口失败');
      return null;
    }

    async function getIPv6() {
      const sources = [
        async () => {
          const r = await fetchWithTimeout('https://api64.ipify.org?format=json');
          const j = await r.json(); return { ip: j.ip, source: 'api64.ipify.org' };
        },
        async () => {
          const r = await fetchWithTimeout('https://v6.ident.me');
          const t = await r.text(); return { ip: t.trim(), source: 'v6.ident.me' };
        }
      ];
      for (const s of sources) {
        try {
          const { ip, source } = await s();
          // 简单判定含冒号认为是 IPv6
          if (ip && ip.includes(':')) { setText('ipv6', ip); setStatus('ipv6Status', `数据来源：${source}`); return ip; }
        } catch (e) { /* try next */ }
      }
      setText('ipv6', '未获取到或不支持');
      setStatus('ipv6Status', '数据来源：所有接口失败或当前网络未启用IPv6');
      return null;
    }

    function detectBrowser() {
      const ua = navigator.userAgent || '';
      const vendor = navigator.vendor || '';
      const isEdge = /Edg\//.test(ua);
      const isChrome = /Chrome\//.test(ua) && vendor.includes('Google');
      const isFirefox = /Firefox\//.test(ua);
      const isSafari = /Safari\//.test(ua) && !/Chrome\//.test(ua) && !/Edg\//.test(ua);
      let name = '未知';
      if (isEdge) name = 'Microsoft Edge';
      else if (isChrome) name = 'Google Chrome';
      else if (isFirefox) name = 'Mozilla Firefox';
      else if (isSafari) name = 'Apple Safari';
      // 大致版本号
      const verMatch = ua.match(/(Chrome|Edg|Firefox)\/([\d.]+)/) || ua.match(/Version\/([\d.]+)/);
      const version = verMatch ? (verMatch[2] || verMatch[1]) : '未知';
      return { name, version };
    }

    function detectOS() {
      const plat = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '';
      const ua = navigator.userAgent || '';
      if (/Win/.test(plat)) return 'Windows';
      if (/Mac/.test(plat)) return 'macOS';
      if (/Linux/.test(plat)) return 'Linux';
      if (/Android/.test(ua)) return 'Android';
      if (/iPhone|iPad|iPod/.test(ua)) return 'iOS';
      return plat || '未知';
    }

    function buildEnv() {
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      const { name: browserName, version: browserVersion } = detectBrowser();
      const os = detectOS();
      const langs = (navigator.languages || []).join(', ') || navigator.language || '未知';
      const dpr = window.devicePixelRatio || 1;
      const touch = (navigator.maxTouchPoints || 0) > 0 || 'ontouchstart' in window;
      const mem = navigator.deviceMemory ? `${navigator.deviceMemory} GB` : '未知或未公开';
      const hw = navigator.hardwareConcurrency || '未知';
      const colorDepth = screen.colorDepth || '未知';
      const online = navigator.onLine ? '是' : '否';
      const cookieEnabled = navigator.cookieEnabled ? '已启用' : '未启用';

      const kvs = [
        ['操作系统', os],
        ['浏览器', `${browserName} ${browserVersion}`],
        ['用户代理 UA', navigator.userAgent || '—'],
        ['平台 Platform', (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '—'],
        ['语言（优先级）', langs],
        ['时区', tz],
        ['屏幕分辨率', `${screen.width} × ${screen.height}`],
        ['窗口大小', `${window.innerWidth} × ${window.innerHeight}`],
        ['设备像素比 DPR', String(dpr)],
        ['颜色深度', String(colorDepth)],
        ['触摸支持', touch ? '是' : '否'],
        ['设备内存', mem],
        ['硬件并发线程', String(hw)],
        ['在线状态', online],
        ['Cookie', cookieEnabled],
      ];
      return kvs;
    }

    function renderEnv() {
      const kvs = buildEnv();
      const list = document.getElementById('envList');
      list.innerHTML = '';
      for (const [k, v] of kvs) {
        const key = document.createElement('div'); key.className = 'key'; key.textContent = k;
        const val = document.createElement('div'); val.className = 'val'; val.textContent = v;
        list.appendChild(key); list.appendChild(val);
      }
      setText('ua', navigator.userAgent || '—');
    }

    async function refreshAll() {
      await Promise.all([getIPv4(), getIPv6()]);
      renderEnv();
    }

    async function copyText(text) {
      try { await navigator.clipboard.writeText(text); alert('已复制到剪贴板'); }
      catch (e) { alert('复制失败，请手动选择文本复制'); }
    }

    function bindEvents() {
      document.getElementById('refreshAll').addEventListener('click', refreshAll);
      document.getElementById('copyAll').addEventListener('click', () => {
        const kvs = buildEnv().map(([k, v]) => `${k}: ${v}`).join('\n');
        const dump = `IPv4: ${document.getElementById('ipv4').textContent}\nIPv6: ${document.getElementById('ipv6').textContent}\n` + kvs;
        copyText(dump);
      });
      document.getElementById('copyUA').addEventListener('click', () => copyText(navigator.userAgent || ''));
      document.getElementById('copyV4').addEventListener('click', () => copyText(document.getElementById('ipv4').textContent || ''));
      document.getElementById('copyV6').addEventListener('click', () => copyText(document.getElementById('ipv6').textContent || ''));
      document.getElementById('refreshV4').addEventListener('click', getIPv4);
      document.getElementById('refreshV6').addEventListener('click', getIPv6);
      window.addEventListener('resize', () => {
        // 仅更新窗口大小与屏幕相关信息
        renderEnv();
      });
    }

    (function init(){
      bindEvents();
      refreshAll();
    })();
  </script>
</body>
</html>
