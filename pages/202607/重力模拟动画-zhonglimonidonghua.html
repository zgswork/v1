<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>重力模拟动画</title>
  <style>
    :root {
      --bg: #f5f6fa;
      --text: #1f2328;
      --panel-bg: #ffffff;
      --panel-border: #e2e4e8;
      --accent: #3b82f6;
      --accent-contrast: #ffffff;
      --muted: #64748b;
    }
    [data-theme="dark"] {
      --bg: #0b0f14;
      --text: #e5e7eb;
      --panel-bg: #111827;
      --panel-border: #1f2937;
      --accent: #60a5fa;
      --accent-contrast: #0b0f14;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--panel-border);
    }
    .title {
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--panel-border);
      background: var(--panel-bg);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(4, minmax(160px, 1fr));
      gap: 12px;
      padding: 12px 16px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--panel-border);
    }
    .control {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .control label { font-weight: 600; }
    .control .hint { color: var(--muted); font-size: 12px; }
    input[type="range"] { width: 100%; }
    .btn {
      border: none;
      background: var(--accent);
      color: var(--accent-contrast);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--panel-border);
    }
    .canvas-wrap { flex: 1; position: relative; }
    canvas { display: block; width: 100%; height: 100%; background: transparent; touch-action: none; }
    footer {
      padding: 10px 16px;
      border-top: 1px solid var(--panel-border);
      background: var(--panel-bg);
      color: var(--muted);
      font-size: 12px;
    }
    @media (max-width: 900px) {
      .controls { grid-template-columns: repeat(2, minmax(140px, 1fr)); }
    }
    @media (max-width: 520px) {
      header { padding: 10px 12px; }
      .controls { grid-template-columns: 1fr; padding: 10px 12px; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header>
      <div class="title">重力模拟动画</div>
      <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
        <span id="themeIcon">🌞</span>
        <span id="themeText">浅色</span>
      </button>
    </header>
    <section class="controls">
      <div class="control">
        <label for="gravity">重力加速度</label>
        <input id="gravity" type="range" min="0" max="3000" step="10" value="1500">
        <div class="hint"><span id="gravityVal">1500</span> px/s²</div>
      </div>
      <div class="control">
        <label for="bounce">弹性系数</label>
        <input id="bounce" type="range" min="0" max="1" step="0.02" value="0.75">
        <div class="hint"><span id="bounceVal">0.75</span></div>
      </div>
      <div class="control">
        <label for="radius">粒子半径</label>
        <input id="radius" type="range" min="4" max="24" step="1" value="10">
        <div class="hint"><span id="radiusVal">10</span> px</div>
      </div>
      <div class="control" style="align-self: end;">
        <div style="display:flex; gap:8px; flex-wrap: wrap;">
          <button class="btn" id="spawn">随机添加10个</button>
          <button class="btn secondary" id="pause">暂停</button>
          <button class="btn secondary" id="clear">清空</button>
        </div>
        <div class="hint">提示：在画布上按住拖动可"投掷"粒子</div>
      </div>
      <div class="control">
        <label for="drag">空气阻力</label>
        <input id="drag" type="range" min="0" max="1" step="0.01" value="0.02">
        <div class="hint"><span id="dragVal">0.02</span> /s</div>
      </div>
      <div class="control">
        <label for="collide">粒子碰撞</label>
        <div style="display:flex; align-items:center; gap:8px;">
          <input id="collide" type="checkbox">
          <span class="hint">开启后粒子会相互弹碰</span>
        </div>
      </div>
      <div class="control">
        <label for="trails">拖影效果</label>
        <div style="display:flex; align-items:center; gap:8px;">
          <input id="trails" type="checkbox">
          <span class="hint">不清屏，产生淡淡轨迹</span>
        </div>
      </div>
      <div class="control" style="align-self: end;">
        <div style="display:flex; gap:8px; flex-wrap: wrap;">
          <button class="btn secondary" id="save">保存场景</button>
          <button class="btn secondary" id="load">加载场景</button>
          <button class="btn secondary" id="reset">重置默认</button>
        </div>
        <div class="hint">保存到浏览器本地，仅当前设备可用</div>
      </div>
    </section>
    <div class="canvas-wrap">
      <canvas id="canvas"></canvas>
    </div>
    <footer>
      <span>交互：点击添加，拖动可投掷；支持手机与电脑。</span>
      <span style="margin-left:12px">主题已记忆</span>
      <span style="margin-left:12px">FPS：<span id="fps">0</span></span>
    </footer>
  </div>
  <script>
    (function themeInit(){
      const stored = localStorage.getItem('gravity-theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = stored || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      icon.textContent = theme === 'dark' ? '🌙' : '🌞';
      text.textContent = theme === 'dark' ? '深色' : '浅色';
    })();

    document.getElementById('themeToggle').addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      const next = current === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('gravity-theme', next);
      document.getElementById('themeIcon').textContent = next === 'dark' ? '🌙' : '🌞';
      document.getElementById('themeText').textContent = next === 'dark' ? '深色' : '浅色';
    });

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const gravitySlider = document.getElementById('gravity');
    const bounceSlider = document.getElementById('bounce');
    const radiusSlider = document.getElementById('radius');
    const gravityVal = document.getElementById('gravityVal');
    const bounceVal = document.getElementById('bounceVal');
    const radiusVal = document.getElementById('radiusVal');
    const spawnBtn = document.getElementById('spawn');
    const pauseBtn = document.getElementById('pause');
    const clearBtn = document.getElementById('clear');
    const fpsText = document.getElementById('fps');
    const dragSlider = document.getElementById('drag');
    const dragVal = document.getElementById('dragVal');
    const collideToggle = document.getElementById('collide');
    const trailsToggle = document.getElementById('trails');
    const saveBtn = document.getElementById('save');
    const loadBtn = document.getElementById('load');
    const resetBtn = document.getElementById('reset');

    let W = 0, H = 0, DPR = Math.max(1, Math.floor(window.devicePixelRatio || 1));
    let particles = [];
    let running = true;
    let lastT = performance.now();
    let pointerDown = false;
    let pointerPath = [];
    const maxParticles = 400;
    let fpsSamples = [];

    function resize(){
      const rect = canvas.parentElement.getBoundingClientRect();
      W = Math.max(100, Math.floor(rect.width));
      H = Math.max(100, Math.floor(rect.height));
      DPR = Math.max(1, Math.floor(window.devicePixelRatio || 1));
      canvas.width = W * DPR;
      canvas.height = H * DPR;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    function rand(min, max){ return Math.random() * (max - min) + min; }
    function color(){
      const hues = [200, 210, 220, 230, 240, 250, 260, 0, 20, 40];
      const h = hues[Math.floor(Math.random() * hues.length)];
      return `hsl(${h}deg 70% 60%)`;
    }
    function addParticle(x, y, vx, vy, r){
      if (particles.length >= maxParticles) return;
      particles.push({ x, y, vx, vy, r, c: color() });
    }

    gravitySlider.addEventListener('input', () => { gravityVal.textContent = gravitySlider.value; });
    bounceSlider.addEventListener('input', () => { bounceVal.textContent = bounceSlider.value; });
    radiusSlider.addEventListener('input', () => { radiusVal.textContent = radiusSlider.value; });
    dragSlider.addEventListener('input', () => { dragVal.textContent = dragSlider.value; });

    spawnBtn.addEventListener('click', () => {
      const r = parseFloat(radiusSlider.value);
      for(let i=0;i<10;i++){
        const x = rand(r, W - r);
        const y = rand(r, Math.min(H * 0.5, H - r));
        addParticle(x, y, rand(-120, 120), rand(-50, 50), r);
      }
    });

    pauseBtn.addEventListener('click', () => {
      running = !running;
      pauseBtn.textContent = running ? '暂停' : '继续';
      lastT = performance.now();
    });
    clearBtn.addEventListener('click', () => { particles = []; });

    const STORAGE_KEY = 'gravity-sim-scene';
    saveBtn.addEventListener('click', () => {
      const scene = {
        gravity: gravitySlider.value,
        bounce: bounceSlider.value,
        radius: radiusSlider.value,
        drag: dragSlider.value,
        collide: !!collideToggle.checked,
        trails: !!trailsToggle.checked,
        particles: particles.map(p => ({ x:p.x, y:p.y, vx:p.vx, vy:p.vy, r:p.r, c:p.c }))
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(scene));
    });
    loadBtn.addEventListener('click', () => {
      const data = localStorage.getItem(STORAGE_KEY);
      if (!data) return;
      try {
        const s = JSON.parse(data);
        gravitySlider.value = s.gravity ?? gravitySlider.value; gravityVal.textContent = gravitySlider.value;
        bounceSlider.value = s.bounce ?? bounceSlider.value; bounceVal.textContent = bounceSlider.value;
        radiusSlider.value = s.radius ?? radiusSlider.value; radiusVal.textContent = radiusSlider.value;
        dragSlider.value = s.drag ?? dragSlider.value; dragVal.textContent = dragSlider.value;
        collideToggle.checked = !!s.collide;
        trailsToggle.checked = !!s.trails;
        particles = (s.particles || []).map(p => ({...p}));
      } catch(err){ /* ignore */ }
    });
    resetBtn.addEventListener('click', () => {
      gravitySlider.value = 1500; gravityVal.textContent = '1500';
      bounceSlider.value = 0.75; bounceVal.textContent = '0.75';
      radiusSlider.value = 10; radiusVal.textContent = '10';
      dragSlider.value = 0.02; dragVal.textContent = '0.02';
      collideToggle.checked = false;
      trailsToggle.checked = false;
      particles = [];
      running = true; pauseBtn.textContent = '暂停';
      seed();
    });

    function draw(){
      if (trailsToggle && trailsToggle.checked){
        const fadeColor = getComputedStyle(document.body).backgroundColor;
        ctx.globalAlpha = 0.08;
        ctx.fillStyle = fadeColor;
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = 1;
      } else {
        ctx.clearRect(0, 0, W, H);
      }
      for(const p of particles){
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.c;
        ctx.fill();
      }
    }

    function handleCollisions(e){
      if (!collideToggle || !collideToggle.checked) return;
      const n = particles.length;
      for (let i=0;i<n;i++){
        const a = particles[i];
        for (let j=i+1;j<n;j++){
          const b = particles[j];
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          let dist = Math.hypot(dx, dy);
          const rs = a.r + b.r;
          if (dist === 0) { dist = 0.0001; }
          if (dist < rs){
            const overlap = rs - dist;
            const nx = dx / dist;
            const ny = dy / dist;
            const sep = overlap / 2;
            a.x -= nx * sep; a.y -= ny * sep;
            b.x += nx * sep; b.y += ny * sep;
            const rvn = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
            if (rvn < 0){
              const j = -(1 + e) * rvn / 2;
              a.vx += j * nx; a.vy += j * ny;
              b.vx -= j * nx; b.vy -= j * ny;
            }
          }
        }
      }
    }

    function step(dt){
      const g = parseFloat(gravitySlider.value);
      const e = parseFloat(bounceSlider.value);
      const d = parseFloat(dragSlider.value);
      for(const p of particles){
        p.vy += g * dt;
        const damp = Math.exp(-d * dt);
        p.vx *= damp;
        p.vy *= damp;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        if (p.x - p.r < 0){ p.x = p.r; p.vx = -p.vx * e; }
        if (p.x + p.r > W){ p.x = W - p.r; p.vx = -p.vx * e; }
        if (p.y - p.r < 0){ p.y = p.r; p.vy = -p.vy * e; }
        if (p.y + p.r > H){
          p.y = H - p.r;
          p.vy = -p.vy * e;
          p.vx *= 0.992;
          if (Math.abs(p.vy) < 10) p.vy = 0;
        }
      }
      handleCollisions(e);
    }

    function loop(t){
      const now = t || performance.now();
      let dt = Math.min(0.033, Math.max(0.0005, (now - lastT) / 1000));
      lastT = now;
      if (running) step(dt);
      draw();
      const fps = dt > 0 ? (1 / dt) : 0;
      fpsSamples.push(fps);
      if (fpsSamples.length > 60) fpsSamples.shift();
      const avg = fpsSamples.reduce((a,b)=>a+b,0) / fpsSamples.length;
      fpsText.textContent = Math.round(avg).toString();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    function pointerClientPos(ev){
      const rect = canvas.getBoundingClientRect();
      if (ev.touches && ev.touches[0]){
        const t0 = ev.touches[0];
        return { x: t0.clientX - rect.left, y: t0.clientY - rect.top };
      }
      return { x: ev.clientX - rect.left, y: ev.clientY - rect.top };
    }
    canvas.addEventListener('pointerdown', (ev) => {
      pointerDown = true;
      pointerPath = [];
      const { x, y } = pointerClientPos(ev);
      pointerPath.push({ x, y, t: performance.now() });
    });
    canvas.addEventListener('pointermove', (ev) => {
      if (!pointerDown) return;
      const { x, y } = pointerClientPos(ev);
      pointerPath.push({ x, y, t: performance.now() });
    });
    canvas.addEventListener('pointerup', (ev) => {
      pointerDown = false;
      const r = parseFloat(radiusSlider.value);
      const { x, y } = pointerClientPos(ev);
      let vx = 0, vy = 0;
      if (pointerPath.length >= 2){
        const a = pointerPath[Math.max(0, pointerPath.length - 4)];
        const b = pointerPath[pointerPath.length - 1];
        const dt = Math.max(1, b.t - a.t) / 1000;
        vx = (b.x - a.x) / dt * 0.6;
        vy = (b.y - a.y) / dt * 0.6;
      }
      addParticle(x, y, vx, vy, r);
    });
    canvas.addEventListener('pointercancel', () => { pointerDown = false; pointerPath = []; });

    function seed(){
      const r = parseFloat(radiusSlider.value);
      for(let i=0;i<18;i++){
        const x = rand(r, W - r);
        const y = rand(r, Math.min(H * 0.5, H - r));
        addParticle(x, y, rand(-80, 80), rand(-40, 40), r);
      }
    }
    seed();
  </script>
</body>
</html>
