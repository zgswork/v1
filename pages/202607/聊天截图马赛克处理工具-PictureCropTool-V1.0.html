<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天截图马赛克处理工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 10px;
            color: #333;
            overflow: hidden;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            height: calc(100vh - 20px);
            display: flex;
            flex-direction: column;
        }
        
        header {
            background: linear-gradient(90deg, #4b6cb7 0%, #182848 100%);
            color: white;
            padding: 15px 20px;
            text-align: center;
            flex-shrink: 0;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .subtitle {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
            padding: 15px;
            gap: 15px;
        }
        
        .control-panel {
            flex: 0 0 280px;
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 10px;
            overflow-y: auto;
            max-height: 100%;
        }
        
        .preview-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        
        .section {
            margin-bottom: 20px;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #2c3e50;
            padding-bottom: 6px;
            border-bottom: 2px solid #eaeaea;
        }
        
        .upload-area {
            border: 2px dashed #4b6cb7;
            border-radius: 10px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background-color: #f0f4ff;
        }
        
        .upload-area:hover {
            background-color: #e6ebff;
        }
        
        .upload-icon {
            font-size: 36px;
            color: #4b6cb7;
            margin-bottom: 8px;
        }
        
        .upload-text {
            font-size: 14px;
            margin-bottom: 12px;
        }
        
        .upload-btn {
            background-color: #4b6cb7;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            transition: background-color 0.3s;
        }
        
        .upload-btn:hover {
            background-color: #3a5795;
        }
        
        .mosaic-type {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        
        .mosaic-btn {
            flex: 1;
            padding: 10px 6px;
            background-color: #eaeaea;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .mosaic-btn.active {
            background-color: #4b6cb7;
            color: white;
        }
        
        .mosaic-preview {
            width: 60px;
            height: 45px;
            margin-bottom: 5px;
            border-radius: 4px;
            overflow: hidden;
            border: 2px solid #ddd;
        }
        
        .mosaic-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .watermark-controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .watermark-input-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .watermark-input-group label {
            min-width: 55px;
            font-size: 13px;
        }
        
        .watermark-input-group input,
        .watermark-input-group select {
            flex: 1;
            padding: 7px 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
        }
        
        .watermark-orientation {
            display: flex;
            gap: 8px;
        }
        
        .watermark-orientation-btn {
            flex: 1;
            padding: 7px 8px;
            background-color: #eaeaea;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
            font-size: 12px;
        }
        
        .watermark-orientation-btn.active {
            background-color: #4b6cb7;
            color: white;
        }
        
        .preview-container {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
            background-color: #f9f9f9;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            max-height: calc(100vh - 200px);
        }
        
        #previewImage {
            max-width: 100%;
            max-height: 100%;
            display: none;
        }
        
        .placeholder-text {
            color: #888;
            text-align: center;
            padding: 25px;
        }
        
        .zoom-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
            width: 100%;
        }
        
        .zoom-btn {
            background-color: #4b6cb7;
            color: white;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s;
        }
        
        .zoom-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        
        .zoom-btn:hover:not(:disabled) {
            background-color: #3a5795;
        }
        
        .zoom-level {
            font-size: 13px;
            font-weight: 600;
            color: #2c3e50;
            min-width: 55px;
            text-align: center;
        }
        
        .reset-zoom-btn {
            background-color: #7f8c8d;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: background-color 0.3s;
        }
        
        .reset-zoom-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        
        .reset-zoom-btn:hover:not(:disabled) {
            background-color: #636e72;
        }
        
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }
        
        .action-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            flex: 1;
        }
        
        .reset-btn {
            background-color: #e74c3c;
            color: white;
        }
        
        .reset-btn:hover {
            background-color: #c0392b;
        }
        
        .save-btn {
            background-color: #2ecc71;
            color: white;
        }
        
        .save-btn:hover {
            background-color: #27ae60;
        }
        
        .undo-btn {
            background-color: #f39c12;
            color: white;
        }
        
        .undo-btn:hover {
            background-color: #d35400;
        }
        
        .canvas-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
            max-height: 100%;
            overflow: hidden;
        }
        
        .selection-box {
            position: absolute;
            border: 2px dashed #e74c3c;
            background-color: rgba(231, 76, 60, 0.2);
            pointer-events: none;
        }
        
        .instructions {
            background-color: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 13px;
            color: #555;
        }
        
        .instructions h3 {
            margin-bottom: 8px;
            color: #2c3e50;
            font-size: 14px;
        }
        
        .instructions ul {
            padding-left: 18px;
        }
        
        .instructions li {
            margin-bottom: 6px;
        }
        
        .loading {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(255, 255, 255, 0.8);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            z-index: 100;
        }
        
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #4b6cb7;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            animation: spin 1s linear infinite;
            margin: 0 auto 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .drag-hint {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .drag-hint.show {
            opacity: 1;
        }
        
        footer {
            text-align: center;
            padding: 15px;
            color: #7f8c8d;
            font-size: 13px;
            border-top: 1px solid #eee;
            flex-shrink: 0;
        }
        
        /* 移动设备优化 */
        @media (max-width: 768px) {
            body {
                padding: 5px;
            }
            
            .container {
                height: calc(100vh - 10px);
                border-radius: 10px;
            }
            
            .main-content {
                flex-direction: column;
                padding: 10px;
            }
            
            .control-panel {
                flex: 0 0 auto;
                margin-right: 0;
                margin-bottom: 15px;
                max-height: 40vh;
                overflow-y: auto;
            }
            
            .preview-area {
                flex: 1;
                min-height: 0;
            }
            
            .preview-container {
                max-height: calc(100vh - 400px);
                min-height: 250px;
            }
            
            .mosaic-type {
                flex-direction: row;
                overflow-x: auto;
                padding-bottom: 5px;
            }
            
            .mosaic-btn {
                min-width: 100px;
            }
            
            .action-buttons {
                flex-wrap: wrap;
            }
            
            .action-btn {
                flex: 0 0 calc(50% - 6px);
            }
        }
        
        /* 大屏幕优化 */
        @media (min-width: 1200px) {
            .control-panel {
                flex: 0 0 300px;
            }
            
            .preview-container {
                max-height: calc(100vh - 180px);
            }
        }
        
        /* 小屏幕手机优化 */
        @media (max-width: 480px) {
            header {
                padding: 12px 15px;
            }
            
            h1 {
                font-size: 20px;
            }
            
            .subtitle {
                font-size: 12px;
            }
            
            .main-content {
                padding: 8px;
            }
            
            .control-panel {
                padding: 12px;
            }
            
            .section {
                margin-bottom: 15px;
            }
            
            .preview-container {
                min-height: 200px;
                max-height: calc(100vh - 350px);
            }
            
            .action-btn {
                padding: 8px 12px;
                font-size: 13px;
            }
        }
        
        /* 横屏模式优化 */
        @media (max-height: 500px) and (orientation: landscape) {
            .container {
                height: auto;
                min-height: calc(100vh - 20px);
            }
            
            .control-panel {
                max-height: 70vh;
            }
            
            .preview-container {
                max-height: 60vh;
            }
        }
    </style>
</head>

                            </div>
                            模糊效果

                        <button class="mosaic-btn" data-type="stripe">
                            <div class="mosaic-preview">
                                <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA4MCA2MCI+PHJlY3Qgd2lkdGg9IjgwIiBoZWlnaHQ9IjYwIiBmaWxsPSIjZmZmIi8+PHJlY3QgeD0iMCIgeT0iMCIgd2lkdGg9IjgwIiBoZWlnaHQ9IjYiIGZpbGw9IiMwMDAiLz48cmVjdCB4PSIwIiB5PSIxMiIgd2lkdGg9IjgwIiBoZWlnaHQ9IjYiIGZpbGw9IiMwMDAiLz48cmVjdCB4PSIwIiB5PSIyNCIgd2lkdGg9IjgwIiBoZWlnaHQ9IjYiIGZpbGw9IiMwMDAiLz48cmVjdCB4PSIwIiB5PSIzNiIgd2lkdGg9IjgwIiBoZWlnaHQ9IjYiIGZpbGw9IiMwMDAiLz48cmVjdCB4PSIwIiB5PSI0OCIgd2lkdGg9IjgwIiBoZWlnaHQ9IjYiIGZpbGw9IiMwMDAiLz48cmVjdCB4PSIwIiB5PSI1NCIgd2lkdGg9IjgwIiBoZWlnaHQ9IjYiIGZpbGw9IiMwMDAiLz48L3N2Zz4=" alt="条纹马赛克">
                            </div>
                            条纹马赛克
                        </button>
                    </div>
                </div>
                
                <div class="section">
                    <h2 class="section-title">水印设置</h2>
                    <div class="watermark-controls">
                        <div class="watermark-input-group">
                            <label for="watermarkText">水印内容:</label>
                            <input type="text" id="watermarkText" placeholder="输入水印文字" value="示例水印">
                        </div>
                        <div class="watermark-input-group">
                            <label for="watermarkFont">字体:</label>
                            <select id="watermarkFont">
                                <option value="Arial">Arial</option>
                                <option value="Microsoft YaHei">微软雅黑</option>
                                <option value="SimSun">宋体</option>
                                <option value="SimHei">黑体</option>
                                <option value="KaiTi">楷体</option>
                            </select>
                        </div>
                        <div class="watermark-input-group">
                            <label for="watermarkColor">颜色:</label>
                            <input type="color" id="watermarkColor" value="#ffffff">
                        </div>
                        <div class="watermark-input-group">
                            <label for="watermarkSize">大小:</label>
                            <input type="range" id="watermarkSize" min="10" max="50" value="20">
                        </div>
                        <div class="watermark-input-group">
                            <label>方向:</label>
                            <div class="watermark-orientation">
                                <button class="watermark-orientation-btn active" data-orientation="horizontal">水平</button>
                                <button class="watermark-orientation-btn" data-orientation="vertical">竖向</button>
                                <button class="watermark-orientation-btn" data-orientation="diagonal">斜45°</button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="instructions">
                    <h3>使用说明</h3>
                    <ul>
                        <li>上传您的聊天截图</li>
                        <li>选择喜欢的马赛克样式</li>
                        <li>在图片上拖动选择需要打码的区域</li>
                        <li>设置水印内容、字体、颜色和方向</li>
                        <li>点击撤销按钮可撤销上一步操作</li>
                        <li>点击保存按钮下载处理后的图片</li>
                        <li>双击图片进入拖拽模式，再次双击退出</li>
                    </ul>
                </div>
            </div>
            
            <div class="preview-area">
                <h2 class="section-title">预览区域</h2>
                
                <div class="zoom-controls">
                    <button class="zoom-btn" id="zoomOutBtn" disabled>-</button>
                    <span class="zoom-level" id="zoomLevel">100%</span>
                    <button class="zoom-btn" id="zoomInBtn" disabled>+</button>
                    <button class="reset-zoom-btn" id="resetZoomBtn" disabled>重置视图</button>
                </div>
                
                <div class="preview-container" id="previewContainer">
                    <div class="placeholder-text" id="placeholder">
                        请上传图片开始编辑
                    </div>
                    <div class="loading" id="loadingIndicator">
                        <div class="spinner"></div>
                        <p>正在生成高清图片...</p>
                    </div>
                    <div class="drag-hint" id="dragHint">双击图片进入拖拽模式，再次双击退出</div>
                    <div class="canvas-container" id="canvasContainer">
                        <canvas id="previewCanvas"></canvas>
                        <img id="previewImage" src="" alt="预览图片">
                    </div>
                </div>
                
                <div class="action-buttons">
                    <button class="action-btn undo-btn" id="undoBtn">撤销上一步</button>
                    <button class="action-btn reset-btn" id="resetBtn">重置图片</button>
                    <button class="action-btn save-btn" id="saveBtn">保存图片</button>
                </div>
            </div>
        </div>
        
        <footer>
            <p>© 2023 聊天截图马赛克处理工具 | 保护您的隐私安全</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const fileInput = document.getElementById('fileInput');
            const uploadArea = document.getElementById('uploadArea');
            const previewCanvas = document.getElementById('previewCanvas');
            const previewImage = document.getElementById('previewImage');
            const placeholder = document.getElementById('placeholder');
            const resetBtn = document.getElementById('resetBtn');
            const saveBtn = document.getElementById('saveBtn');
            const undoBtn = document.getElementById('undoBtn');
            const mosaicBtns = document.querySelectorAll('.mosaic-btn');
            const zoomInBtn = document.getElementById('zoomInBtn');
            const zoomOutBtn = document.getElementById('zoomOutBtn');
            const resetZoomBtn = document.getElementById('resetZoomBtn');
            const zoomLevel = document.getElementById('zoomLevel');
            const canvasContainer = document.getElementById('canvasContainer');
            const previewContainer = document.getElementById('previewContainer');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const dragHint = document.getElementById('dragHint');
            
            // 水印相关元素
            const watermarkText = document.getElementById('watermarkText');
            const watermarkFont = document.getElementById('watermarkFont');
            const watermarkColor = document.getElementById('watermarkColor');
            const watermarkSize = document.getElementById('watermarkSize');
            const watermarkOrientationBtns = document.querySelectorAll('.watermark-orientation-btn');
            
            const ctx = previewCanvas.getContext('2d', { willReadFrequently: true });
            let originalImage = null;
            let isDrawing = false;
            let startX, startY;
            let selectionBox = null;
            let currentMosaicType = 'pixel';
            let originalImageWidth, originalImageHeight;
            
            // 水印设置
            let watermarkSettings = {
                text: '示例水印',
                font: 'Arial',
                color: '#ffffff',
                size: 20,
                orientation: 'horizontal'
            };
            
            // 缩放相关变量 - 使用基于Canvas绘制的缩放
            let currentScale = 1;
            const MIN_SCALE = 0.1;
            const MAX_SCALE = 5;
            const SCALE_STEP = 0.1;
            
            // 平移相关变量
            let isDragging = false;
            let isDoubleClickMode = false;
            let lastX, lastY;
            let offsetX = 0, offsetY = 0;
            
            // 历史记录栈
            let historyStack = [];
            const MAX_HISTORY = 20; // 最大历史记录数
            
            // 马赛克操作记录
            let mosaicOperations = [];
            
            // 上传区域点击事件
            uploadArea.addEventListener('click', () => fileInput.click());
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.style.backgroundColor = '#e6ebff';
            });
            uploadArea.addEventListener('dragleave', () => {
                uploadArea.style.backgroundColor = '#f0f4ff';
            });
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.style.backgroundColor = '#f0f4ff';
                if (e.dataTransfer.files.length) {
                    handleImageUpload(e.dataTransfer.files[0]);
                }
            });
            
            // 文件选择事件
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length) {
                    handleImageUpload(e.target.files[0]);
                }
            });
            
            // 马赛克样式选择
            mosaicBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    mosaicBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentMosaicType = this.getAttribute('data-type');
                });
            });
            
            // 水印设置事件
            watermarkText.addEventListener('input', updateWatermarkSettings);
            watermarkFont.addEventListener('change', updateWatermarkSettings);
            watermarkColor.addEventListener('input', updateWatermarkSettings);
            watermarkSize.addEventListener('input', updateWatermarkSettings);
            
            watermarkOrientationBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    watermarkOrientationBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    watermarkSettings.orientation = this.getAttribute('data-orientation');
                });
            });
            
            // 撤销按钮
            undoBtn.addEventListener('click', undoLastAction);
            
            // 缩放按钮
            zoomInBtn.addEventListener('click', () => zoomImage(SCALE_STEP));
            zoomOutBtn.addEventListener('click', () => zoomImage(-SCALE_STEP));
            resetZoomBtn.addEventListener('click', resetZoom);
            
            // 鼠标滚轮缩放（仅在已上传图片时可用）
            previewContainer.addEventListener('wheel', handleWheel, { passive: false });
            
            // 更新水印设置
            function updateWatermarkSettings() {
                watermarkSettings.text = watermarkText.value;
                watermarkSettings.font = watermarkFont.value;
                watermarkSettings.color = watermarkColor.value;
                watermarkSettings.size = parseInt(watermarkSize.value);
            }
            
            // 处理图片上传
            function handleImageUpload(file) {
                if (!file.type.match('image.*')) {
                    alert('请上传图片文件！');
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    originalImage = new Image();
                    originalImage.onload = function() {
                        // 记录原始图片尺寸
                        originalImageWidth = originalImage.width;
                        originalImageHeight = originalImage.height;
                        
                        // 设置canvas尺寸为预览容器尺寸
                        const containerRect = previewContainer.getBoundingClientRect();
                        const maxWidth = containerRect.width - 20; // 减少边距
                        const maxHeight = containerRect.height - 20;
                        
                        // 计算适应尺寸
                        let { width, height } = calculateAspectRatioFit(
                            originalImage.width, 
                            originalImage.height, 
                            maxWidth, 
                            maxHeight
                        );
                        
                        previewCanvas.width = width;
                        previewCanvas.height = height;
                        
                        // 启用高质量渲染
                        ctx.imageSmoothingEnabled = true;
                        ctx.imageSmoothingQuality = 'high';
                        
                        // 绘制图片到canvas
                        drawImageToCanvas();
                        
                        // 显示canvas，隐藏占位符
                        placeholder.style.display = 'none';
                        previewCanvas.style.display = 'block';
                        
                        // 启用缩放按钮
                        zoomInBtn.disabled = false;
                        zoomOutBtn.disabled = false;
                        resetZoomBtn.disabled = false;
                        
                        // 清空历史记录
                        historyStack = [];
                        
                        // 清空马赛克操作记录
                        mosaicOperations = [];
                        
                        // 重置缩放和平移
                        resetZoom();
                        
                        // 保存初始状态
                        saveState();
                        
                        // 添加canvas事件监听
                        setupCanvasEvents();
                    };
                    originalImage.src = e.target.result;
                    previewImage.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
            
            // 计算图片适应尺寸
            function calculateAspectRatioFit(srcWidth, srcHeight, maxWidth, maxHeight) {
                const ratio = Math.min(maxWidth / srcWidth, maxHeight / srcHeight);
                return {
                    width: srcWidth * ratio,
                    height: srcHeight * ratio
                };
            }
            
            // 绘制图片到canvas（考虑缩放和平移）
            function drawImageToCanvas() {
                if (!originalImage) return;
                
                // 清空canvas
                ctx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
                
                // 计算缩放后的尺寸
                const scaledWidth = previewCanvas.width * currentScale;
                const scaledHeight = previewCanvas.height * currentScale;
                
                // 计算绘制位置（居中）
                const drawX = (previewCanvas.width - scaledWidth) / 2 + offsetX;
                const drawY = (previewCanvas.height - scaledHeight) / 2 + offsetY;
                
                // 启用高质量缩放
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                
                // 绘制缩放后的图片
                ctx.drawImage(originalImage, drawX, drawY, scaledWidth, scaledHeight);
                
                // 如果有马赛克操作，重新应用
                if (mosaicOperations.length > 0) {
                    applyMosaicOperations();
                }
            }
            
            // 应用所有马赛克操作
            function applyMosaicOperations() {
                mosaicOperations.forEach(operation => {
                    // 计算缩放后的坐标和尺寸
                    const scaledX = (operation.x * currentScale) + (previewCanvas.width - previewCanvas.width * currentScale) / 2 + offsetX;
                    const scaledY = (operation.y * currentScale) + (previewCanvas.height - previewCanvas.height * currentScale) / 2 + offsetY;
                    const scaledWidth = operation.width * currentScale;
                    const scaledHeight = operation.height * currentScale;
                    
                    // 获取选择区域的图像数据
                    const imageData = ctx.getImageData(scaledX, scaledY, scaledWidth, scaledHeight);
                    
                    // 根据操作类型应用马赛克
                    switch(operation.type) {
                        case 'pixel':
                            applyPixelMosaic(imageData, 10 * currentScale);
                            break;
                        case 'blur':
                            applyBlurMosaic(imageData, 5 * currentScale);
                            break;
                        case 'stripe':
                            applyStripeMosaic(imageData);
                            break;
                    }
                    
                    // 将处理后的图像数据放回canvas
                    ctx.putImageData(imageData, scaledX, scaledY);
                });
            }
            
            // 设置canvas事件
            function setupCanvasEvents() {
                previewCanvas.addEventListener('mousedown', startSelection);
                previewCanvas.addEventListener('mousemove', drawSelection);
                previewCanvas.addEventListener('mouseup', endSelection);
                previewCanvas.addEventListener('dblclick', toggleDragMode);
                
                // 移动端触摸事件
                previewCanvas.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const mouseEvent = new MouseEvent('mousedown', {
                        clientX: touch.clientX,
                        clientY: touch.clientY
                    });
                    previewCanvas.dispatchEvent(mouseEvent);
                });
                
                previewCanvas.addEventListener('touchmove', function(e) {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const mouseEvent = new MouseEvent('mousemove', {
                        clientX: touch.clientX,
                        clientY: touch.clientY
                    });
                    previewCanvas.dispatchEvent(mouseEvent);
                });
                
                previewCanvas.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    const mouseEvent = new MouseEvent('mouseup', {});
                    previewCanvas.dispatchEvent(mouseEvent);
                });
                
                // 移动端双击事件模拟
                let lastTap = 0;
                previewCanvas.addEventListener('touchend', function(e) {
                    const currentTime = new Date().getTime();
                    const tapLength = currentTime - lastTap;
                    if (tapLength < 500 && tapLength > 0) {
                        // 双击事件
                        const touch = e.changedTouches[0];
                        const mouseEvent = new MouseEvent('dblclick', {
                            clientX: touch.clientX,
                            clientY: touch.clientY
                        });
                        previewCanvas.dispatchEvent(mouseEvent);
                    }
                    lastTap = currentTime;
                });
            }
            
            // 切换拖拽模式
            function toggleDragMode(e) {
                if (!originalImage) return;
                
                isDoubleClickMode = !isDoubleClickMode;
                
                if (isDoubleClickMode) {
                    previewCanvas.style.cursor = 'grabbing';
                    dragHint.textContent = "拖拽模式已激活，再次双击退出";
                    dragHint.classList.add('show');
                } else {
                    previewCanvas.style.cursor = 'default';
                    dragHint.textContent = "双击图片进入拖拽模式，再次双击退出";
                    if (currentScale > 1) {
                        dragHint.classList.add('show');
                    } else {
                        dragHint.classList.remove('show');
                    }
                }
            }
            
            // 开始选择区域
            function startSelection(e) {
                // 如果处于拖拽模式，则开始拖拽
                if (isDoubleClickMode) {
                    isDragging = true;
                    lastX = e.clientX;
                    lastY = e.clientY;
                    previewCanvas.style.cursor = 'grabbing';
                    return;
                }
                
                // 如果正在平移，则不开始选择
                if (isDragging) return;
                
                isDrawing = true;
                const rect = previewCanvas.getBoundingClientRect();
                
                // 计算鼠标在canvas上的位置
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                
                // 将鼠标位置转换为缩放前的坐标
                const drawX = (previewCanvas.width - previewCanvas.width * currentScale) / 2 + offsetX;
                const drawY = (previewCanvas.height - previewCanvas.height * currentScale) / 2 + offsetY;
                
                startX = (mouseX - drawX) / currentScale;
                startY = (mouseY - drawY) / currentScale;
                
                // 确保坐标在有效范围内
                startX = Math.max(0, Math.min(startX, previewCanvas.width));
                startY = Math.max(0, Math.min(startY, previewCanvas.height));
                
                // 创建选择框
                if (selectionBox) {
                    selectionBox.remove();
                }
                selectionBox = document.createElement('div');
                selectionBox.className = 'selection-box';
                selectionBox.style.left = (startX * currentScale + drawX) + 'px';
                selectionBox.style.top = (startY * currentScale + drawY) + 'px';
                selectionBox.style.width = '0px';
                selectionBox.style.height = '0px';
                
                canvasContainer.appendChild(selectionBox);
            }
            
            // 绘制选择区域 - 修复框选方向问题
            function drawSelection(e) {
                if (isDragging) {
                    // 拖拽图片
                    const deltaX = e.clientX - lastX;
                    const deltaY = e.clientY - lastY;
                    
                    offsetX += deltaX;
                    offsetY += deltaY;
                    
                    lastX = e.clientX;
                    lastY = e.clientY;
                    
                    updateZoom();
                    return;
                }
                
                if (!isDrawing) return;
                
                const rect = previewCanvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                
                // 将鼠标位置转换为缩放前的坐标
                const drawX = (previewCanvas.width - previewCanvas.width * currentScale) / 2 + offsetX;
                const drawY = (previewCanvas.height - previewCanvas.height * currentScale) / 2 + offsetY;
                
                const currentX = (mouseX - drawX) / currentScale;
                const currentY = (mouseY - drawY) / currentScale;
                
                // 确保坐标在有效范围内
                const validX = Math.max(0, Math.min(currentX, previewCanvas.width));
                const validY = Math.max(0, Math.min(currentY, previewCanvas.height));
                
                // 计算选择框的左上角坐标和尺寸
                const boxX = Math.min(startX, validX) * currentScale + drawX;
                const boxY = Math.min(startY, validY) * currentScale + drawY;
                const boxWidth = Math.abs(validX - startX) * currentScale;
                const boxHeight = Math.abs(validY - startY) * currentScale;
                
                // 更新选择框位置和尺寸
                selectionBox.style.left = boxX + 'px';
                selectionBox.style.top = boxY + 'px';
                selectionBox.style.width = boxWidth + 'px';
                selectionBox.style.height = boxHeight + 'px';
            }
            
            // 结束选择并应用马赛克
            function endSelection(e) {
                if (isDragging) {
                    isDragging = false;
                    if (isDoubleClickMode) {
                        previewCanvas.style.cursor = 'grabbing';
                    } else {
                        previewCanvas.style.cursor = 'default';
                    }
                    return;
                }
                
                if (!isDrawing) return;
                isDrawing = false;
                
                const rect = previewCanvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                
                // 将鼠标位置转换为缩放前的坐标
                const drawX = (previewCanvas.width - previewCanvas.width * currentScale) / 2 + offsetX;
                const drawY = (previewCanvas.height - previewCanvas.height * currentScale) / 2 + offsetY;
                
                const endX = (mouseX - drawX) / currentScale;
                const endY = (mouseY - drawY) / currentScale;
                
                // 确保坐标在有效范围内
                const validEndX = Math.max(0, Math.min(endX, previewCanvas.width));
                const validEndY = Math.max(0, Math.min(endY, previewCanvas.height));
                
                // 计算选择区域的左上角坐标和尺寸
                const x = Math.min(startX, validEndX);
                const y = Math.min(startY, validEndY);
                const width = Math.abs(validEndX - startX);
                const height = Math.abs(validEndY - startY);
                
                // 移除选择框
                if (selectionBox) {
                    selectionBox.remove();
                    selectionBox = null;
                }
                
                // 应用马赛克
                if (width > 5 && height > 5) {
                    saveState(); // 保存当前状态
                    
                    // 记录马赛克操作
                    mosaicOperations.push({
                        x, y, width, height,
                        type: currentMosaicType
                    });
                    
                    // 重新绘制图像并应用马赛克
                    drawImageToCanvas();
                }
            }
            
            // 像素马赛克
            function applyPixelMosaic(imageData, blockSize) {
                const data = imageData.data;
                const width = imageData.width;
                const height = imageData.height;
                
                // 确保块大小至少为1
                const actualBlockSize = Math.max(1, Math.floor(blockSize));
                
                for (let y = 0; y < height; y += actualBlockSize) {
                    for (let x = 0; x < width; x += actualBlockSize) {
                        // 获取块的平均颜色
                        let r = 0, g = 0, b = 0, count = 0;
                        
                        for (let dy = 0; dy < actualBlockSize && y + dy < height; dy++) {
                            for (let dx = 0; dx < actualBlockSize && x + dx < width; dx++) {
                                const index = ((y + dy) * width + (x + dx)) * 4;
                                r += data[index];
                                g += data[index + 1];
                                b += data[index + 2];
                                count++;
                            }
                        }
                        
                        r = Math.floor(r / count);
                        g = Math.floor(g / count);
                        b = Math.floor(b / count);
                        
                        // 将整个块设置为平均颜色
                        for (let dy = 0; dy < actualBlockSize && y + dy < height; dy++) {
                            for (let dx = 0; dx < actualBlockSize && x + dx < width; dx++) {
                                const index = ((y + dy) * width + (x + dx)) * 4;
                                data[index] = r;
                                data[index + 1] = g;
                                data[index + 2] = b;
                            }
                        }
                    }
                }
            }
            
            // 模糊马赛克
            function applyBlurMosaic(imageData, radius) {
                const data = imageData.data;
                const width = imageData.width;
                const height = imageData.height;
                
                // 确保半径至少为1
                const actualRadius = Math.max(1, Math.floor(radius));
                
                // 简单的高斯模糊近似
                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const index = (y * width + x) * 4;
                        
                        let r = 0, g = 0, b = 0, count = 0;
                        
                        for (let dy = -actualRadius; dy <= actualRadius; dy++) {
                            for (let dx = -actualRadius; dx <= actualRadius; dx++) {
                                const ny = y + dy;
                                const nx = x + dx;
                                
                                if (ny >= 0 && ny < height && nx >= 0 && nx < width) {
                                    const nIndex = (ny * width + nx) * 4;
                                    r += data[nIndex];
                                    g += data[nIndex + 1];
                                    b += data[nIndex + 2];
                                    count++;
                                }
                            }
                        }
                        
                        data[index] = r / count;
                        data[index + 1] = g / count;
                        data[index + 2] = b / count;
                    }
                }
            }
            
            // 条纹马赛克
            function applyStripeMosaic(imageData) {
                const data = imageData.data;
                const width = imageData.width;
                const height = imageData.height;
                
                const stripeWidth = 5;
                
                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const index = (y * width + x) * 4;
                        
                        // 创建条纹效果
                        if (Math.floor(x / stripeWidth) % 2 === 0) {
                            data[index] = 0; // R
                            data[index + 1] = 0; // G
                            data[index + 2] = 0; // B
                        } else {
                            data[index] = 255; // R
                            data[index + 1] = 255; // G
                            data[index + 2] = 255; // B
                        }
                    }
                }
            }
            
            // 保存当前状态到历史记录
            function saveState() {
                // 如果历史记录已达到最大数量，移除最旧的一条
                if (historyStack.length >= MAX_HISTORY) {
                    historyStack.shift();
                }
                
                // 保存当前canvas状态
                const imageData = ctx.getImageData(0, 0, previewCanvas.width, previewCanvas.height);
                historyStack.push(imageData);
            }
            
            // 撤销上一步操作
            function undoLastAction() {
                if (historyStack.length <= 1) {
                    alert('没有更多操作可以撤销');
                    return;
                }
                
                // 移除当前状态
                historyStack.pop();
                
                // 移除最后一个马赛克操作
                mosaicOperations.pop();
                
                // 恢复到上一个状态
                const previousState = historyStack[historyStack.length - 1];
                ctx.putImageData(previousState, 0, 0);
            }
            
            // 缩放图片
            function zoomImage(step) {
                // 如果没有上传图片，则不允许缩放
                if (!originalImage) return;
                
                const newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, currentScale + step));
                
                if (newScale !== currentScale) {
                    currentScale = newScale;
                    updateZoom();
                }
            }
            
            // 重置缩放
            function resetZoom() {
                // 如果没有上传图片，则不允许重置
                if (!originalImage) return;
                
                currentScale = 1;
                offsetX = 0;
                offsetY = 0;
                isDoubleClickMode = false;
                previewCanvas.style.cursor = 'default';
                dragHint.classList.remove('show');
                updateZoom();
            }
            
            // 更新缩放状态
            function updateZoom() {
                // 重新绘制图像
                drawImageToCanvas();
                
                // 更新缩放比例显示
                zoomLevel.textContent = Math.round(currentScale * 100) + '%';
                
                // 如果放大后，显示拖拽提示
                if (currentScale > 1 && !isDoubleClickMode) {
                    dragHint.classList.add('show');
                } else if (!isDoubleClickMode) {
                    dragHint.classList.remove('show');
                }
            }
            
            // 处理鼠标滚轮缩放
            function handleWheel(e) {
                // 如果没有上传图片，则不允许缩放
                if (!originalImage) return;
                
                e.preventDefault();
                
                // 计算缩放方向
                const delta = e.deltaY > 0 ? -SCALE_STEP : SCALE_STEP;
                zoomImage(delta);
            }
            
            // 添加水印到图片
            function addWatermark(canvas) {
                const ctx = canvas.getContext('2d');
                const width = canvas.width;
                const height = canvas.height;
                
                // 设置水印样式
                ctx.font = `${watermarkSettings.size}px ${watermarkSettings.font}`;
                ctx.fillStyle = watermarkSettings.color;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.globalAlpha = 0.7; // 设置透明度
                
                // 根据方向设置水印位置
                switch(watermarkSettings.orientation) {
                    case 'horizontal':
                        // 水平水印，放在图片中央
                        ctx.fillText(watermarkSettings.text, width / 2, height / 2);
                        break;
                    case 'vertical':
                        // 垂直水印，需要旋转90度
                        ctx.save();
                        ctx.translate(width / 2, height / 2);
                        ctx.rotate(-Math.PI / 2);
                        ctx.fillText(watermarkSettings.text, 0, 0);
                        ctx.restore();
                        break;
                    case 'diagonal':
                        // 斜45度水印
                        ctx.save();
                        ctx.translate(width / 2, height / 2);
                        ctx.rotate(-Math.PI / 4);
                        ctx.fillText(watermarkSettings.text, 0, 0);
                        ctx.restore();
                        break;
                }
                
                ctx.globalAlpha = 1.0; // 恢复透明度
            }
            
            // 重置图片
            resetBtn.addEventListener('click', () => {
                if (originalImage) {
                    // 清空canvas
                    ctx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
                    
                    // 重新绘制原始图像
                    drawImageToCanvas();
                    
                    // 重置历史记录
                    historyStack = [];
                    saveState();
                    
                    // 清空马赛克操作记录
                    mosaicOperations = [];
                    
                    // 重置缩放
                    resetZoom();
                }
            });
            
            // 保存图片（优化质量 - 高分辨率保存）
            saveBtn.addEventListener('click', () => {
                if (!originalImage) {
                    alert('请先上传图片！');
                    return;
                }
                
                // 弹出输入框让用户输入文件名
                const fileName = prompt('请输入保存的文件名（不含扩展名）:', 'mosaic_chat_screenshot');
                
                // 如果用户取消输入，则不保存
                if (fileName === null) {
                    return;
                }
                
                // 显示加载指示器
                loadingIndicator.style.display = 'block';
                
                // 使用setTimeout让UI有机会更新
                setTimeout(() => {
                    try {
                        // 创建一个高分辨率的canvas用于保存
                        const highResCanvas = document.createElement('canvas');
                        const highResCtx = highResCanvas.getContext('2d', { 
                            willReadFrequently: true,
                            alpha: true 
                        });
                        
                        // 设置高分辨率canvas的尺寸为原始图片尺寸
                        highResCanvas.width = originalImageWidth;
                        highResCanvas.height = originalImageHeight;
                        
                        // 启用高质量图像平滑处理
                        highResCtx.imageSmoothingEnabled = true;
                        highResCtx.imageSmoothingQuality = 'high';
                        
                        // 第一步：先绘制原始高清图片作为背景
                        highResCtx.drawImage(originalImage, 0, 0, originalImageWidth, originalImageHeight);
                        
                        // 第二步：如果有马赛克操作，重新在高分辨率canvas上应用
                        if (mosaicOperations.length > 0) {
                            applyHighResolutionMosaics(highResCtx);
                        }
                        
                        // 第三步：添加水印
                        addWatermark(highResCanvas);
                        
                        // 第四步：使用高质量PNG格式输出
                        const dataURL = highResCanvas.toDataURL('image/png', 1.0); // 最高质量
                        
                        // 创建下载链接
                        const link = document.createElement('a');
                        link.download = fileName + '.png';
                        link.href = dataURL;
                        
                        // 添加点击事件以确保下载
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        
                        // 隐藏加载指示器
                        loadingIndicator.style.display = 'none';
                        
                    } catch (error) {
                        console.error('保存图片时出错:', error);
                        alert('保存失败，请重试');
                        loadingIndicator.style.display = 'none';
                    }
                }, 100);
            });
            
            // 在高分辨率canvas上应用马赛克效果
            function applyHighResolutionMosaics(highResCtx) {
                // 计算预览canvas与原始图片的缩放比例
                const scaleX = originalImageWidth / previewCanvas.width;
                const scaleY = originalImageHeight / previewCanvas.height;
                
                mosaicOperations.forEach(operation => {
                    // 计算高分辨率下的坐标和尺寸
                    const x = operation.x * scaleX;
                    const y = operation.y * scaleY;
                    const width = operation.width * scaleX;
                    const height = operation.height * scaleY;
                    
                    // 获取高分辨率下的图像数据
                    const imageData = highResCtx.getImageData(x, y, width, height);
                    
                    // 根据操作类型应用高分辨率马赛克
                    switch(operation.type) {
                        case 'pixel':
                            applyHighResPixelMosaic(imageData, 15);
                            break;
                        case 'blur':
                            applyHighResBlurMosaic(imageData, 8);
                            break;
                        case 'stripe':
                            applyHighResStripeMosaic(imageData, 8);
                            break;
                    }
                    
                    // 将处理后的图像数据放回高分辨率canvas
                    highResCtx.putImageData(imageData, x, y);
                });
            }
            
            // 高分辨率像素马赛克
            function applyHighResPixelMosaic(imageData, blockSize) {
                const data = imageData.data;
                const width = imageData.width;
                const height = imageData.height;
                
                // 动态调整块大小，根据区域大小自适应
                const adaptiveBlockSize = Math.min(blockSize, Math.max(8, Math.floor(Math.min(width, height) / 10)));
                
                for (let y = 0; y < height; y += adaptiveBlockSize) {
                    for (let x = 0; x < width; x += adaptiveBlockSize) {
                        // 获取块的平均颜色
                        let r = 0, g = 0, b = 0, count = 0;
                        
                        const blockWidth = Math.min(adaptiveBlockSize, width - x);
                        const blockHeight = Math.min(adaptiveBlockSize, height - y);
                        
                        for (let dy = 0; dy < blockHeight; dy++) {
                            for (let dx = 0; dx < blockWidth; dx++) {
                                const index = ((y + dy) * width + (x + dx)) * 4;
                                r += data[index];
                                g += data[index + 1];
                                b += data[index + 2];
                                count++;
                            }
                        }
                        
                        r = Math.floor(r / count);
                        g = Math.floor(g / count);
                        b = Math.floor(b / count);
                        
                        // 将整个块设置为平均颜色
                        for (let dy = 0; dy < blockHeight; dy++) {
                            for (let dx = 0; dx < blockWidth; dx++) {
                                const index = ((y + dy) * width + (x + dx)) * 4;
                                data[index] = r;
                                data[index + 1] = g;
                                data[index + 2] = b;
                            }
                        }
                    }
                }
            }
            
            // 高分辨率模糊马赛克
            function applyHighResBlurMosaic(imageData, radius) {
                const data = imageData.data;
                const width = imageData.width;
                const height = imageData.height;
                
                // 创建临时数据副本
                const tempData = new Uint8ClampedArray(data);
                
                // 应用高斯模糊
                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const index = (y * width + x) * 4;
                        
                        let r = 0, g = 0, b = 0, count = 0;
                        
                        for (let dy = -radius; dy <= radius; dy++) {
                            for (let dx = -radius; dx <= radius; dx++) {
                                const ny = y + dy;
                                const nx = x + dx;
                                
                                if (ny >= 0 && ny < height && nx >= 0 && nx < width) {
                                    const nIndex = (ny * width + nx) * 4;
                                    r += tempData[nIndex];
                                    g += tempData[nIndex + 1];
                                    b += tempData[nIndex + 2];
                                    count++;
                                }
                            }
                        }
                        
                        data[index] = r / count;
                        data[index + 1] = g / count;
                        data[index + 2] = b / count;
                    }
                }
            }
            
            // 高分辨率条纹马赛克
            function applyHighResStripeMosaic(imageData, stripeWidth) {
                const data = imageData.data;
                const width = imageData.width;
                const height = imageData.height;
                
                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const index = (y * width + x) * 4;
                        
                        // 创建条纹效果
                        if (Math.floor(x / stripeWidth) % 2 === 0) {
                            data[index] = 0;     // R
                            data[index + 1] = 0; // G
                            data[index + 2] = 0; // B
                            // A保持不变
                        } else {
                            data[index] = 255;     // R
                            data[index + 1] = 255; // G
                            data[index + 2] = 255; // B
                            // A保持不变
                        }
                    }
                }
            }
        });
    </script>
