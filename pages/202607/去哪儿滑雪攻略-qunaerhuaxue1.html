        const downloadBtn = document.getElementById('downloadBtn');
        const resultContainer = document.getElementById('resultContainer');
        const resultTitle = document.getElementById('resultTitle');
        const resultIntro = document.getElementById('resultIntro');
        const resultAddress = document.getElementById('resultAddress');
        const resultTransport = document.getElementById('resultTransport');
        const resultTicket = document.getElementById('resultTicket');
        const resultOpenTime = document.getElementById('resultOpenTime');
        const resultHotels = document.getElementById('resultHotels');
        const modal = document.getElementById('downloadModal');
        const span = document.getElementsByClassName('close')[0];
        
        // 显示随机滑雪场攻略
        function showRandomSkiResort() {
            const randomIndex = Math.floor(Math.random() * skiResorts.length);
            const resort = skiResorts[randomIndex];
            
            resultTitle.textContent = resort.name;
            resultIntro.textContent = resort.intro;
            resultAddress.textContent = resort.address;
            resultTransport.textContent = resort.transport;
            resultTicket.textContent = resort.ticket;
            resultOpenTime.textContent = resort.openTime;
            resultHotels.textContent = resort.hotels;
            
            resultContainer.style.display = 'block';
            generateBtn.style.display = 'none';
        }
        
        // 显示下载弹窗
        function showDownloadModal() {
            modal.style.display = 'block';
        }
        
        // 关闭弹窗
        function closeModal() {
            modal.style.display = 'none';
        }
        
        // 点击弹窗外部关闭
        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }
        
        // 事件监听
        generateBtn.addEventListener('click', showRandomSkiResort);
        changeBtn.addEventListener('click', showRandomSkiResort);
        downloadBtn.addEventListener('click', showDownloadModal);
        span.addEventListener('click', closeModal);
    </script>
