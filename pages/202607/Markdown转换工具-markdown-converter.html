<script>
        // 改进的Markdown解析器
        function parseMarkdown(markdown) {
            let html = markdown;
            
            // 首先处理代码块（防止其中的内容被误解析）
            const codeBlocks = [];
            html = html.replace(/```[\s\S]*?```/g, (match) => {
                const index = codeBlocks.length;
                codeBlocks.push(match);
                return `__CODE_BLOCK_${index}__`;
            });
            
            // 处理行内代码（防止其中的内容被误解析）
            const inlineCodes = [];
            html = html.replace(/`([^`]+)`/g, (match, code) => {
                const index = inlineCodes.length;
                inlineCodes.push(code);
                return `__INLINE_CODE_${index}__`;
            });
            
            // 处理表格（在其他元素之前处理）
            html = processMarkdownTables(html);
            
            // 处理图片链接
            html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (match, alt, src) => {
                // 检查是否是data URL（Base64图片）
                if (src.startsWith('data:image/')) {
                    return `<img src="${src}" alt="${alt}" style="max-width: 100%; height: auto; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">`;
                }
                // 检查是否是网络图片
                else if (src.startsWith('http')) {
                    return `<img src="${src}" alt="${alt}" style="max-width: 100%; height: auto; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">`;
                }
                // 本地文件路径显示占位符
                else if (src.startsWith('file://') || src.includes('C:/') || src.includes('D:/') || 
                        (!src.startsWith('http') && !src.startsWith('data:') && !src.startsWith('blob:'))) {
                    return `<div class="image-placeholder">📷 图片: ${alt || '本地图片'}<br><small style="color: #666;">路径: ${src}</small><br><small style="color: #999;">请重新上传Markdown文件并选择上传此图片</small></div>`;
                }
                return `<img src="${src}" alt="${alt}" style="max-width: 100%; height: auto;">`;
            });
            
            // 处理链接
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
            
            // 标题 (H1-H6) - 修复4级标题问题
            html = html.replace(/^###### (.*$)/gim, '<h6>$1</h6>');
            html = html.replace(/^##### (.*$)/gim, '<h5>$1</h5>');
            html = html.replace(/^#### (.*$)/gim, '<h4>$1</h4>');
            html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
            html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
            html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
            
            // 粗体和斜体
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
            
            // 恢复代码块
            codeBlocks.forEach((block, index) => {
                const codeMatch = block.match(/```(\w+)?\n?([\s\S]*?)```/);
                if (codeMatch) {
                    const language = codeMatch[1] || '';
                    const code = codeMatch[2];
                    // 对代码内容进行HTML转义，防止XML等被渲染
                    const escapedCode = code
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                        .replace(/"/g, '&quot;')
                        .replace(/'/g, '&#39;');
                    html = html.replace(`__CODE_BLOCK_${index}__`, 
                        `<pre><code class="language-${language}">${escapedCode}</code></pre>`);
                }
            });
            
            // 恢复行内代码
            inlineCodes.forEach((code, index) => {
                const escapedCode = code
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
                html = html.replace(`__INLINE_CODE_${index}__`, `<code>${escapedCode}</code>`);
            });
            
            // 列表
            html = html.replace(/^\* (.+)$/gm, '<li>$1</li>');
            html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
            
            // 段落
            // 换行处理 - 修复换行渲染问题
            // 先处理双换行（段落分隔）
            html = html.replace(/\n\s*\n/g, '\n\n__PARAGRAPH_BREAK__\n\n');
            // 处理单换行（行内换行）
            html = html.replace(/([^\n])\n([^\n])/g, '$1<br>$2');
            // 恢复段落分隔
            html = html.replace(/\n\n__PARAGRAPH_BREAK__\n\n/g, '</p><p>');
            
            // 段落处理
            html = '<p>' + html + '</p>';
            
            // 清理空段落和标签嵌套
            html = html.replace(/<p><\/p>/g, '');
            html = html.replace(/<p>(<h[1-6]>)/g, '$1');
            html = html.replace(/(<\/h[1-6]>)<\/p>/g, '$1');
            html = html.replace(/<p>(<ul>)/g, '$1');
            html = html.replace(/(<\/ul>)<\/p>/g, '$1');
            html = html.replace(/<p>(<pre>)/g, '$1');
            html = html.replace(/(<\/pre>)<\/p>/g, '$1');
            html = html.replace(/<p>(<div class="image-placeholder">)/g, '$1');
            html = html.replace(/(<\/div>)<\/p>/g, '$1');
            html = html.replace(/<p>(<table)/g, '$1');
            html = html.replace(/(<\/table>)<\/p>/g, '$1');
            
            return html;
        }
        
        // 处理Markdown表格
        function processMarkdownTables(text) {
            // 匹配表格部分
            const tableRegex = /^\|(.+)\|[\r\n]+\|([-:\s|]+)\|[\r\n]+((?:\|.+\|[\r\n]+)+)/gm;
            
            return text.replace(tableRegex, (match) => {
                // 分割表格行
                const rows = match.split('\n').filter(row => row.trim() !== '');
                
                if (rows.length < 2) return match; // 不是有效的表格
                
                // 提取表头
                const headerRow = rows[0];
                const headerCells = headerRow.split('|').filter(cell => cell.trim() !== '');
                
                // 提取分隔行，确定对齐方式
                const separatorRow = rows[1];
                const separators = separatorRow.split('|').filter(sep => sep.trim() !== '');
                
                // 确定每列的对齐方式
                const alignments = separators.map(sep => {
                    const trimmed = sep.trim();
                    if (trimmed.startsWith(':') && trimmed.endsWith(':')) return 'center';
                    if (trimmed.endsWith(':')) return 'right';
                    return 'left';
                });
                
                // 构建HTML表格
                let tableHtml = '<table>';
                
                // 添加表头
                tableHtml += '<thead><tr>';
                headerCells.forEach((cell, index) => {
                    const align = alignments[index] || 'left';
                    tableHtml += `<th style="text-align: ${align}">${cell.trim()}</th>`;
                });
                tableHtml += '</tr></thead>';
                
                // 添加表格内容
                tableHtml += '<tbody>';
                for (let i = 2; i < rows.length; i++) {
                    const row = rows[i];
                    const cells = row.split('|').filter(cell => cell.trim() !== '');
                    
                    tableHtml += '<tr>';
                    cells.forEach((cell, index) => {
                        const align = alignments[index] || 'left';
                        tableHtml += `<td style="text-align: ${align}">${cell.trim()}</td>`;
                    });
                    tableHtml += '</tr>';
                }
                tableHtml += '</tbody></table>';
                
                return tableHtml;
            });
        }

        class MarkdownConverter {
            constructor() {
                this.editor = document.getElementById('markdownEditor');
                this.preview = document.getElementById('previewContent');
                this.fileInput = document.getElementById('fileInput');
                this.fileInfo = document.getElementById('fileInfo');
                this.exportPdfBtn = document.getElementById('exportPdf');
                this.exportWordBtn = document.getElementById('exportWord');
                
                // 图片缓存管理
                this.imageCache = new Map(); // 存储图片的Blob URL
                this.imageFiles = new Map(); // 存储原始文件对象
                
                this.initializeEventListeners();
                this.updatePreview();
            }

            initializeEventListeners() {
                // 实时预览
                this.editor.addEventListener('input', () => {
                    this.updatePreview();
                });

                        this.processFile(files[0]);

            updatePreview() {
                const markdownText = this.editor.value;
                if (markdownText.trim() === '') {
                    this.preview.innerHTML = '<p style="color: #a0aec0; font-style: italic;">在左侧编辑器中输入Markdown内容，这里将显示实时预览...</p>';
                    return;
                }

                try {
                    const html = parseMarkdown(markdownText);
                    this.preview.innerHTML = html;
                } catch (error) {
                    console.error('Markdown解析错误:', error);
                    this.preview.innerHTML = '<p style="color: #e53e3e;">Markdown解析出错，请检查语法</p>';
                }
            }
            
            insertTableExample() {
                const tpl =
                    '\n\n' +
                    '| 姓名 | 年龄 | 城市 |\n' +
                    '|:----|----:|:---:|\n' +
                    '| 张三 | 28 | 北京 |\n' +
                    '| 李四 | 32 | 上海 |\n';
                const el = this.editor;
                const start = typeof el.selectionStart === 'number' ? el.selectionStart : el.value.length;
                const end = typeof el.selectionEnd === 'number' ? el.selectionEnd : start;
                const before = el.value.slice(0, start);
                const after = el.value.slice(end);
                el.value = before + tpl + after;
                try {
                    el.focus();
                    const pos = before.length + tpl.length;
                    el.selectionStart = el.selectionEnd = pos;
                } catch (_) {}
                this.updatePreview();
            }

            // 预览模式切换：normal / print / dark
            changePreviewMode(mode) {
                const el = this.preview;
                if (!el) return;
                // reset
                el.style.background = '';
                el.style.color = '';
                el.style.maxWidth = '';
                el.style.margin = '';
                el.style.boxShadow = '';
                el.style.filter = '';
                if (mode === 'print') {
                    el.style.background = 'white';
                    el.style.color = '#000';
                    el.style.maxWidth = '820px';
                    el.style.margin = '0 auto';
                    el.style.boxShadow = 'none';
                } else if (mode === 'dark') {
                    el.style.background = '#1f2937';
                    el.style.color = '#e5e7eb';
                } // normal: use default CSS
            }

            // 表格样式应用：default / striped / bordered / compact
            applyTableStyle(style) {
                const styleId = 'table-style-dynamic';
                let node = document.getElementById(styleId);
                if (!node) {
                    node = document.createElement('style');
                    node.id = styleId;
                    document.head.appendChild(node);
                }
                let css = '';
                if (style === 'striped') {
                    css =
                        '.preview-content table{border-collapse:collapse;width:100%}\n' +
                        '.preview-content th,.preview-content td{border:1px solid #e2e8f0;padding:8px}\n' +
                        '.preview-content tbody tr:nth-child(odd){background:#f9fafb}\n';
                } else if (style === 'bordered') {
                    css =
                        '.preview-content table{border-collapse:collapse;width:100%;border:2px solid #2d3748}\n' +
                        '.preview-content th,.preview-content td{border:1px solid #2d3748;padding:10px}\n' +
                        '.preview-content th{background:#edf2f7}\n';
                } else if (style === 'compact') {
                    css =
                        '.preview-content table{border-collapse:collapse;width:100%}\n' +
                        '.preview-content th,.preview-content td{border:1px solid #e2e8f0;padding:6px;font-size:12px}\n';
                } else {
                    css = ''; // default -> remove custom
                }
                node.textContent = css;
            }

            // 动态加载外部脚本（避免重复加载）
            loadScript(url) {
                return new Promise((resolve, reject) => {
                    const exists = Array.from(document.getElementsByTagName('script'))
                        .some(s => s.src && s.src.indexOf(url) !== -1);
                    if (exists) return resolve(true);
                    const s = document.createElement('script');
                    s.src = url;
                    s.onload = () => resolve(true);
                    s.onerror = (e) => reject(e);
                    document.head.appendChild(s);
                });
            }

            // 获取导出文件名：优先文件名，其次 H1 文本，兜底“文档”
            getFileName() {
                const f = this.fileInput && this.fileInput.files && this.fileInput.files[0];
                if (f && f.name) return f.name.replace(/\.[^.]*$/, '');
                const h1 = this.preview ? this.preview.querySelector('h1') : null;
                const t = h1 && h1.textContent ? h1.textContent.trim() : '';
                return t || '文档';
            }

            // 读取 PDF 设置（表单优先，其次 localStorage，最后默认）
            getPDFSettings() {
                const saved = (() => {
                    try { return JSON.parse(localStorage.getItem('exportSettings') || '{}'); } catch (_) { return {}; }
                })();
                const pageSizeEl = document.getElementById('pdfPageSize');
                const orientEl = document.getElementById('pdfOrientation');
                const marginEl = document.getElementById('pdfMargin');
                return {
                    pageSize: (pageSizeEl && pageSizeEl.value) || saved.pageSize || 'a4',
                    orientation: (orientEl && orientEl.value) || saved.orientation || 'portrait',
                    margin: parseInt((marginEl && marginEl.value) || saved.margin || '15', 10)
                };
            }

            loadExportSettings() {
                let saved = null;
                try { saved = JSON.parse(localStorage.getItem('exportSettings') || '{}'); } catch (_) { saved = null; }
                if (!saved) return;
                const pageSizeEl = document.getElementById('pdfPageSize');
                const orientEl = document.getElementById('pdfOrientation');
                const marginEl = document.getElementById('pdfMargin');
                const wordFontFamily = document.getElementById('wordFontFamily');
                const wordFontSize = document.getElementById('wordFontSize');
                if (pageSizeEl && saved.pageSize) pageSizeEl.value = saved.pageSize;
                if (orientEl && saved.orientation) orientEl.value = saved.orientation;
                if (marginEl && typeof saved.margin !== 'undefined') marginEl.value = saved.margin;
                if (wordFontFamily && saved.wordFontFamily) wordFontFamily.value = saved.wordFontFamily;
                if (wordFontSize && saved.wordFontSize) wordFontSize.value = saved.wordFontSize;
            }

            saveExportSettings() {
                const pageSizeEl = document.getElementById('pdfPageSize');
                const orientEl = document.getElementById('pdfOrientation');
                const marginEl = document.getElementById('pdfMargin');
                const wordFontFamily = document.getElementById('wordFontFamily');
                const wordFontSize = document.getElementById('wordFontSize');
                const data = {
                    pageSize: pageSizeEl ? pageSizeEl.value : 'a4',
                    orientation: orientEl ? orientEl.value : 'portrait',
                    margin: marginEl ? parseInt(marginEl.value || '15', 10) : 15,
                    wordFontFamily: wordFontFamily ? wordFontFamily.value : 'SimSun',
                    wordFontSize: wordFontSize ? parseInt(wordFontSize.value || '12', 10) : 12
                };
                try { localStorage.setItem('exportSettings', JSON.stringify(data)); } catch (_) {}
            }

            // 导出为 Word（简单 HTML 打包为 .doc）
            exportToWord() {
                if (this.editor.value.trim() === '') {
                    alert('请先输入Markdown内容');
                    return;
                }
                const title = this.getFileName();
                const html =
                    '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + title + '</title>' +
                    '</head><body>' + this.preview.innerHTML + '</body></html>';
                const blob = new Blob([html], { type: 'application/msword;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = title + '.doc';
                document.body.appendChild(a);
                a.click();
                setTimeout(function(){ URL.revokeObjectURL(url); document.body.removeChild(a); }, 200);
            }

            handleFileUpload(event) {
                const file = event.target.files[0];
                if (file) {
                    this.processFile(file);
                }
            }

            processFile(file) {
                if (!file.name.match(/\.(md|markdown|txt)$/i)) {
                    alert('请选择Markdown文件 (.md, .markdown, .txt)');
                    return;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    this.editor.value = e.target.result;
                    this.processImagesInMarkdown(file);
                    this.updatePreview();
                    this.fileInfo.textContent = `已加载: ${file.name}`;
                };
                reader.readAsText(file, 'UTF-8');
            }

            async processImagesInMarkdown(markdownFile) {
                // 等待一小段时间确保文件内容已加载
                setTimeout(async () => {
                    const content = this.editor.value;
                    console.log('检查内容:', content.substring(0, 200));
                    
                    const imageRegex = /!\[([^\]]*)\]\(([^)]+)\)/g;
                    const matches = [];
                    let match;

                    // 收集所有图片引用
                    while ((match = imageRegex.exec(content)) !== null) {
                        const [fullMatch, alt, src] = match;
                        console.log('发现图片:', { fullMatch, alt, src });
                        
                        // 检查是否是本地图片路径
                        if (src.includes('C:/') || src.includes('D:/') || src.includes('file://') || 
                            (!src.startsWith('http') && !src.startsWith('data:') && !src.startsWith('blob:'))) {
                            matches.push({ fullMatch, alt, src });
                        }
                    }

                    console.log('找到的本地图片:', matches);

                    if (matches.length > 0) {
                        // 显示发现的图片数量并询问是否自动处理
                        this.fileInfo.textContent = `已加载: ${markdownFile.name} (发现 ${matches.length} 张本地图片)`;
                        
                        // 显示自动处理选项
                        this.showAutoProcessOption(matches, markdownFile.name);
                    }
                }, 100);
            }

            startIndividualUpload(matches, fileName) {
                let currentIndex = 0;
                let processedContent = this.editor.value;

                const processNextImage = () => {
                    if (currentIndex >= matches.length) {
                        this.fileInfo.textContent = `已加载: ${fileName} (已处理所有图片)`;
                        alert('所有图片处理完成！');
                        return;
                    }

                    const match = matches[currentIndex];
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = 'image/*';
                    input.style.display = 'none';

                    input.onchange = (e) => {
                        const file = e.target.files[0];
                        if (file) {
                            const reader = new FileReader();
                            reader.onload = (e) => {
                                const dataUrl = e.target.result;
                                processedContent = processedContent.replace(match.fullMatch, `![${match.alt}](${dataUrl})`);
                                this.editor.value = processedContent;
                                this.updatePreview();
                                
                                currentIndex++;
                                setTimeout(processNextImage, 100);
                            };
                            reader.readAsDataURL(file);
                        } else {
                            currentIndex++;
                            setTimeout(processNextImage, 100);
                        }
                        document.body.removeChild(input);
                    };

                    document.body.appendChild(input);
                    
                    // 显示当前处理的图片信息
                    const message = `请选择图片文件 (${currentIndex + 1}/${matches.length}):\n\n` +
                                  `图片描述: ${match.alt || '无描述'}\n` +
                                  `原始路径: ${match.src}`;
                    
                    if (confirm(message + '\n\n点击确定选择文件，点击取消跳过此图片')) {
                        input.click();
                    } else {
                        currentIndex++;
                        setTimeout(processNextImage, 100);
                    }
                };

                processNextImage();
            }

            startBatchUpload(matches, fileName) {
                const input = document.createElement('input');
                input.type = 'file';
                input.multiple = true;
                input.accept = 'image/*';
                input.webkitdirectory = true; // 支持选择文件夹
                input.style.display = 'none';

                input.onchange = (e) => {
                    const files = Array.from(e.target.files);
                    let processedContent = this.editor.value;
                    let matchedCount = 0;

                    // 为每个图片引用尝试匹配文件
                    matches.forEach(match => {
                        // 提取文件名（不含路径）
                        let targetFileName = match.src.split(/[/\\]/).pop();
                        
                        // 尝试匹配文件
                        const matchedFile = files.find(file => {
                            const fileName = file.name;
                            // 精确匹配文件名
                            if (fileName === targetFileName) return true;
                            
                            // 尝试匹配不含扩展名的文件名
                            const nameWithoutExt = targetFileName.replace(/\.[^.]*$/, '');
                            const fileNameWithoutExt = fileName.replace(/\.[^.]*$/, '');
                            if (fileNameWithoutExt === nameWithoutExt) return true;
                            
                            return false;
                        });

                        if (matchedFile) {
                            const reader = new FileReader();
                            reader.onload = (e) => {
                                const dataUrl = e.target.result;
                                processedContent = processedContent.replace(match.fullMatch, `![${match.alt}](${dataUrl})`);
                                this.editor.value = processedContent;
                                this.updatePreview();
                            };
                            reader.readAsDataURL(matchedFile);
                            matchedCount++;
                        }
                    });

                    setTimeout(() => {
                        this.fileInfo.textContent = `已加载: ${fileName} (批量处理 ${matchedCount}/${matches.length} 张图片)`;
                        
                        if (matchedCount === matches.length) {
                            alert(`🎉 批量上传完成！\n\n成功匹配并处理了所有 ${matchedCount} 张图片！`);
                        } else if (matchedCount > 0) {
                            alert(`⚡ 批量上传完成！\n\n成功处理: ${matchedCount} 张\n未匹配: ${matches.length - matchedCount} 张\n\n建议检查未匹配图片的文件名是否正确。`);
                        } else {
                            alert(`❌ 批量上传失败\n\n没有找到匹配的图片文件。\n\n请确保：\n1. 选择了正确的文件夹\n2. 图片文件名与Markdown中的引用一致\n3. 图片格式为常见的图片格式`);
                        }
                    }, 1000);

                    document.body.removeChild(input);
                };

                document.body.appendChild(input);
                
                const message = `批量上传说明：\n\n` +
                              `1. 点击确定后选择包含图片的文件夹\n` +
                              `2. 系统会自动匹配文件名\n` +
                              `3. 支持不同扩展名的同名文件\n\n` +
                              `需要处理 ${matches.length} 张图片`;
                
                if (confirm(message)) {
                    input.click();
                } else {
                    this.fileInfo.textContent = `已加载: ${fileName} (取消批量上传)`;
                }
            }

            async startIndividualUpload(matches, fileName) {
                let processedContent = this.editor.value;
                let successCount = 0;
                
                for (let i = 0; i < matches.length; i++) {
                    const match = matches[i];
                    
                    this.fileInfo.textContent = `上传图片 ${i + 1}/${matches.length}: ${match.alt || '未命名'}`;
                    
                    try {
                        const file = await this.selectSingleImage(match, i + 1, matches.length);
                        
                        if (file) {
                            const dataUrl = await this.fileToDataUrl(file);
                            const replacement = `![${match.alt}](${dataUrl})`;
                            
                            // 替换图片引用
                            processedContent = processedContent.replace(match.fullMatch, replacement);
                            successCount++;
                            
                            // 实时更新
                            this.editor.value = processedContent;
                            this.updatePreview();
                            
                            console.log(`✅ 成功处理: ${match.src}`);
                        } else {
                            console.log(`⏭️ 跳过: ${match.src}`);
                        }
                    } catch (error) {
                        console.error(`❌ 处理失败: ${match.src}`, error);
                    }
                }
                
                this.fileInfo.textContent = '已加载: ' + fileName + ' (成功处理 ' + successCount + '/' + matches.length + ' 张图片)';
                
                if (successCount > 0) {
                    setTimeout(() => {
                        alert(`🎉 图片上传完成！\n\n成功处理: ${successCount} 张\n跳过: ${matches.length - successCount} 张`);
                    }, 500);
                }
            }

                    const dialog = document.createElement('div');

            async processBatchUpload(matches, directoryFiles, fileName) {
                let processedContent = this.editor.value;
                let successCount = 0;
                
                // 创建文件名映射（忽略大小写）
                const fileMap = new Map();
                directoryFiles.forEach(file => {
                    const filename = file.name.toLowerCase();
                    fileMap.set(filename, file);
                    
                    // 同时添加不带扩展名的映射
                    const nameWithoutExt = filename.replace(/\.[^.]*$/, '');
                    if (!fileMap.has(nameWithoutExt)) {
                        fileMap.set(nameWithoutExt, file);
                    }
                });
                
                console.log('文件映射表:', Array.from(fileMap.keys()));
                
                for (let i = 0; i < matches.length; i++) {
                    const match = matches[i];
                    
                    // 提取文件名
                    let filename = '';
                    if (match.src.includes('/')) {
                        filename = match.src.split('/').pop();
                    } else if (match.src.includes('\\')) {
                        filename = match.src.split('\\').pop();
                    } else {
                        filename = match.src;
                    }
                    
                    this.fileInfo.textContent = `批量处理 ${i + 1}/${matches.length}: ${filename}`;
                    
                    // 尝试匹配文件
                    const matchedFile = this.findMatchingFile(filename, fileMap);
                    
                    if (matchedFile) {
                        try {
                            const dataUrl = await this.fileToDataUrl(matchedFile);
                            const replacement = `![${match.alt}](${dataUrl})`;
                            
                            // 替换图片引用
                            processedContent = processedContent.replace(match.fullMatch, replacement);
                            successCount++;
                            
                            // 实时更新
                            this.editor.value = processedContent;
                            this.updatePreview();
                            
                            console.log(`✅ 成功匹配: ${filename} -> ${matchedFile.name}`);
                        } catch (error) {
                            console.error(`❌ 处理失败: ${filename}`, error);
                        }
                    } else {
                        console.warn(`⚠️ 未找到匹配文件: ${filename}`);
                    }
                }
                
                this.fileInfo.textContent = `已加载: ${fileName} (批量处理 ${successCount}/${matches.length} 张图片)`;
                
                setTimeout(() => {
                    if (successCount === matches.length) {
                        alert(`🎉 批量上传完成！\n\n成功处理所有 ${successCount} 张图片！`);
                    } else if (successCount > 0) {
                        alert(`⚡ 批量上传完成！\n\n成功: ${successCount} 张\n未匹配: ${matches.length - successCount} 张\n\n建议使用"逐个上传"处理剩余图片。`);
                    } else {
                        alert(`❌ 批量上传失败\n\n未找到匹配的图片文件，请检查文件名是否一致。`);
                    }
                }, 500);
            }

            findMatchingFile(targetFilename, fileMap) {
                const target = targetFilename.toLowerCase();
                
                // 1. 完全匹配
                if (fileMap.has(target)) {
                    return fileMap.get(target);
                }
                
                // 2. 忽略扩展名匹配
                const targetBase = target.replace(/\.[^.]*$/, '');
                if (fileMap.has(targetBase)) {
                    return fileMap.get(targetBase);
                }
                
                // 3. 模糊匹配
                for (const [filename, file] of fileMap) {
                    const fileBase = filename.replace(/\.[^.]*$/, '');
                    
                    // 包含匹配
                    if (filename.includes(targetBase) || targetBase.includes(fileBase)) {
                        return file;
                    }
                    
                    // 去除特殊字符后匹配
                    const cleanTarget = targetBase.replace(/[^a-z0-9]/g, '');
                    const cleanFile = fileBase.replace(/[^a-z0-9]/g, '');
                    if (cleanTarget === cleanFile) {
                        return file;
                    }
                }
                
                return null;
            }

            async tryAutoLoadImage(match) {
                try {
                    // 尝试多种路径解析方式
                    const possiblePaths = this.generatePossiblePaths(match.src);
                    
                    for (const path of possiblePaths) {
                        try {
                            console.log(`尝试加载路径: ${path}`);
                            
                            // 尝试通过fetch加载图片
                            const response = await fetch(path);
                            if (response.ok) {
                                const blob = await response.blob();
                                const dataUrl = await this.blobToDataUrl(blob);
                                return `![${match.alt}](${dataUrl})`;
                            }
                        } catch (e) {
                            // 继续尝试下一个路径
                            console.log(`路径加载失败: ${path}`);
                        }
                    }
                    
                    // 如果fetch失败，尝试创建img元素加载
                    return await this.tryImageElementLoad(match);
                    
                } catch (error) {
                    console.error('自动加载图片失败:', error);
                    return null;
                }
            }

            generatePossiblePaths(originalPath) {
                const paths = [];
                
                // 原始路径
                paths.push(originalPath);
                
                // 如果是绝对路径，转换为file://协议
                if (originalPath.match(/^[A-Z]:/i)) {
                    paths.push(`file:///${originalPath.replace(/\\/g, '/')}`);
                }
                
                // 如果包含反斜杠，转换为正斜杠
                if (originalPath.includes('\\')) {
                    paths.push(originalPath.replace(/\\/g, '/'));
                }
                
                // 尝试相对路径（假设图片在当前目录或子目录）
                const filename = originalPath.split(/[/\\]/).pop();
                if (filename) {
                    paths.push(`./${filename}`);
                    paths.push(`./images/${filename}`);
                    paths.push(`./assets/${filename}`);
                    paths.push(`./img/${filename}`);
                }
                
                return [...new Set(paths)]; // 去重
            }

            async tryImageElementLoad(match) {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    
                    img.onload = () => {
                        try {
                            // 创建canvas转换为base64
                            const canvas = document.createElement('canvas');
                            const ctx = canvas.getContext('2d');
                            canvas.width = img.width;
                            canvas.height = img.height;
                            ctx.drawImage(img, 0, 0);
                            
                            const dataUrl = canvas.toDataURL();
                            resolve(`![${match.alt}](${dataUrl})`);
                        } catch (e) {
                            console.error('Canvas转换失败:', e);
                            resolve(null);
                        }
                    };
                    
                    img.onerror = () => {
                        console.log('图片元素加载失败');
                        resolve(null);
                    };
                    
                    // 尝试加载图片
                    img.src = match.src;
                    
                    // 设置超时
                    setTimeout(() => {
                        resolve(null);
                    }, 3000);
                });
            }

            blobToDataUrl(blob) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (event) => resolve(event.target.result);
                    reader.onerror = (error) => reject(error);
                    reader.readAsDataURL(blob);
                });
            }

                        dirPath = parts.slice(0, -1).join('/');
                    } else if (match.src.includes('\\')) {
                        const parts = match.src.split('\\');

                            images: []
                        });

                        match: match

                return Array.from(directories.values());

                let processedContent = this.editor.value;
                let successCount = 0;

                for (let i = 0; i < uploadTasks.length; i++) {
                    const { file, match } = uploadTasks[i];
                    
                    this.fileInfo.textContent = '处理图片 ' + (i + 1) + '/' + uploadTasks.length + ': ' + match.src;
                    
                    try {
                        const dataUrl = await this.fileToDataUrl(file);
                        const replacement = '![' + match.alt + '](' + dataUrl + ')';
                        
                        // 替换图片引用
                        processedContent = processedContent.replace(match.fullMatch, replacement);
                        successCount++;
                        
                        // 实时更新
                        this.editor.value = processedContent;
                        this.updatePreview();
                        
                            console.log('成功处理第 ' + (i + 1) + ' 张图片');
                    } catch (error) {
                        console.error('处理图片失败: ' + match.src, error);
                    }
                }

                this.fileInfo.textContent = '已加载: ' + fileName + ' (成功处理 ' + successCount + '/' + uploadTasks.length + ' 张图片)';
            }

            fileToDataUrl(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (event) => resolve(event.target.result);
                    reader.onerror = (error) => reject(error);
                    reader.readAsDataURL(file);
                });
            }

            async processImagesSequentially(matches, fileName) {
                let processedContent = this.editor.value;
                let successCount = 0;

                for (let i = 0; i < matches.length; i++) {
                    const { fullMatch, alt, src } = matches[i];
                    
                    // 更新进度
                    this.fileInfo.textContent = '处理图片 ' + (i + 1) + '/' + matches.length + ': ' + src;
                    
                    try {
                        const result = await this.loadSingleImage(src, alt, fullMatch);
                        if (result) {
                            console.log('替换前:', result.original);
                            console.log('替换后:', result.replacement.substring(0, 100) + '...');
                            
                            // 确保替换成功
                            const beforeReplace = processedContent;
                            processedContent = processedContent.replace(result.original, result.replacement);
                            
                            if (beforeReplace === processedContent) {
                                console.warn('替换失败，尝试其他方法');
                                // 尝试转义特殊字符后再替换
                                const escapedOriginal = result.original.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                                processedContent = processedContent.replace(new RegExp(escapedOriginal, 'g'), result.replacement);
                            }
                            
                            successCount++;
                            
                            // 实时更新编辑器和预览
                            this.editor.value = processedContent;
                            this.updatePreview();
                            
                            console.log('成功处理第 ' + (i + 1) + ' 张图片');
                        }
                    } catch (error) {
                        console.error('处理图片失败: ' + src, error);
                    }
                }

                // 显示最终结果
                this.fileInfo.textContent = '已加载: ' + fileName + ' (成功处理 ' + successCount + '/' + matches.length + ' 张图片)';
                console.log('所有图片处理完成');
            }

            loadSingleImage(src, alt, original) {
                return new Promise((resolve) => {
                    console.log('开始处理图片:', { src, alt, original });
                    
                    // 创建文件输入元素
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = 'image/*';
                    input.style.display = 'none';
                    
                    // 设置超时处理，避免无限等待
                    const timeout = setTimeout(() => {
                        console.log('文件选择超时，自动取消');
                        if (document.body.contains(input)) {
                            document.body.removeChild(input);
                        }
                        resolve(null);
                    }, 30000); // 30秒超时
                    
                    input.onchange = (e) => {
                        clearTimeout(timeout);
                        const file = e.target.files[0];
                        console.log('用户选择的文件:', file);
                        
                        if (file) {
                            const reader = new FileReader();
                            reader.onload = (event) => {
                                const dataUrl = event.target.result;
                                console.log('Base64转换完成，长度:', dataUrl.length);
                                
                                const result = {
                                    original: original,
                                    replacement: '![' + alt + '](' + dataUrl + ')'
                                };
                                
                                console.log('返回结果:', result);
                                resolve(result);
                            };
                            reader.onerror = (error) => {
                                console.error('读取图片文件失败:', error);
                                resolve(null);
                            };
                            reader.readAsDataURL(file);
                        } else {
                            console.log('没有选择文件');
                            resolve(null);
                        }
                        
                        // 清理DOM
                        if (document.body.contains(input)) {
                            document.body.removeChild(input);
                        }
                    };
                    
                    // 处理用户取消选择
                    const handleCancel = () => {
                        clearTimeout(timeout);
                        console.log('用户取消文件选择');
                        resolve(null);
                        if (document.body.contains(input)) {
                            document.body.removeChild(input);
                        }
                    };
                    
                    // 监听窗口焦点事件来检测取消
                    const focusHandler = () => {
                        setTimeout(() => {
                            if (!input.files || input.files.length === 0) {
                                handleCancel();
                                window.removeEventListener('focus', focusHandler);
                            }
                        }, 100);
                    };
                    
                    // 询问用户并直接触发文件选择
                    const shouldUpload = confirm('图片: ' + (alt || '未命名') + '\n路径: ' + src + '\n\n点击"确定"选择要上传的图片文件，点击"取消"跳过此图片。');
                    
                    if (!shouldUpload) {
                        clearTimeout(timeout);
                        console.log('用户选择跳过此图片');
                        resolve(null);
                        return;
                    }
                    
                    // 添加到DOM并触发点击
                    document.body.appendChild(input);
                    window.addEventListener('focus', focusHandler);
                    
                    // 使用setTimeout确保在用户交互上下文中触发
                    setTimeout(() => {
                        input.click();
                    }, 100);
                });
            }

  // DOM -> pdfmake 内容映射（覆盖常见元素：h1/h2/h3/p/ul/ol/pre/code/table）
  function domToPdfMakeContent(root) {
    const content = [];
    function walk(node) {
      if (node.nodeType !== 1) return;
      const tag = node.tagName.toLowerCase();

      if (tag === 'h1' || tag === 'h2' || tag === 'h3') {
        const text = node.textContent.trim();
        if (text) {
          content.push({
            text,
            style: tag,
            margin: [0, 6, 0, tag === 'h1' ? 10 : tag === 'h2' ? 8 : 6]
          });
        }
        return;
      }

      if (tag === 'p') {
        const text = node.textContent.replace(/\s+\n/g, '\n').trim();
        if (text) content.push({ text, style: 'p', margin: [0, 0, 0, 6] });
        return;
      }

      if (tag === 'pre') {
        const code = node.textContent.replace(/\r/g, '');
        content.push({
          table: {
            widths: ['*'],
            body: [[{ text: code, style: 'code' }]]
          },
          layout: {
            hLineWidth: () => 0.5,
            vLineWidth: () => 0.5,
            hLineColor: () => '#dddddd',
            vLineColor: () => '#dddddd',
            paddingLeft: () => 6,
            paddingRight: () => 6,
            paddingTop: () => 6,
            paddingBottom: () => 6
          },
          margin: [0, 4, 0, 8]
        });
        return;
      }

      if (tag === 'ul' || tag === 'ol') {
        const items = [];
        node.querySelectorAll(':scope > li').forEach(li => {
          const t = li.textContent.trim();
          if (t) items.push(t);
        });
        if (items.length) {
          content.push(tag === 'ul' ? { ul: items, margin: [0, 0, 0, 6] } : { ol: items, margin: [0, 0, 0, 6] });
        }
        return;
      }

      if (tag === 'table') {
        const rows = [];
        const thead = node.querySelector('thead');
        const tbody = node.querySelector('tbody') || node;

        if (thead) {
          const headerRow = [];
          thead.querySelectorAll('th').forEach(th => headerRow.push({ text: th.textContent.trim(), bold: true, alignment: 'center' }));
          if (headerRow.length) rows.push(headerRow);
        } else {
          // 无 thead，第一行作为表头
          const firstRow = node.querySelector('tr');
          if (firstRow) {
            const headerRow = [];
            firstRow.querySelectorAll('th,td').forEach(c => headerRow.push({ text: c.textContent.trim(), bold: true, alignment: 'center' }));
            if (headerRow.length) rows.push(headerRow);
          }
        }

        // 其余行
        const bodyRows = [];
        node.querySelectorAll('tr').forEach((tr, idx) => {
          if (idx === 0 && rows.length) return; // 已作表头
          const cells = [];
          tr.querySelectorAll('td,th').forEach(td => cells.push({ text: td.textContent.trim(), alignment: 'left' }));
          if (cells.length) bodyRows.push(cells);
        });
        rows.push(...bodyRows);

        if (rows.length) {
          const colCount = rows[0].length;
          const widths = Array.from({ length: colCount }, () => '*');
          content.push({
            table: { headerRows: 1, widths, body: rows },
            layout: 'lightHorizontalLines',
            margin: [0, 6, 0, 10]
          });
        }
        return;
      }

      // 递归遍历其它容器
      node.childNodes.forEach(walk);
    }

    root.childNodes.forEach(walk);
    return content;
  }

  // 生成 pdfmake 文档定义
  function buildDocDefinition(previewEl, fileName) {
    return {
      info: { title: fileName || '文档' },

        h2: { font: 'CJK', bold: true, fontSize: 16 },
        h3: { font: 'CJK', bold: true, fontSize: 14 },
        p:  { font: 'CJK', fontSize: 11 },
        code: { font: 'CJK', fontSize: 10 }
      },
      content: domToPdfMakeContent(previewEl)
    };
  }

  // 若 pdfmake 可用，则将导出方法切换为 pdfmake；否则保持原实现（jsPDF/系统打印）
  async function patchExportIfPossible() {
    if (!window.MarkdownConverter) return;
    const proto = window.MarkdownConverter.prototype;
    const originalExport = proto.exportToPDF;

    proto.exportToPDF = async function() {
      try {
        const ok = await ensurePdfMakeReady();
        if (ok && window.pdfMake && window.pdfMake.vfs) {
          const fileName = this.getFileName() + '.pdf';
          const doc = buildDocDefinition(this.preview, fileName);
          window.pdfMake.createPdf(doc).download(fileName);
          return;
        }
      } catch (e) {
        console.warn('pdfmake 导出失败，自动回退原导出逻辑：', e);
      }
      // 回退：调用原有实现（无需人工干预）
      return originalExport.apply(this, arguments);
    };
  }

  // DOM 就绪后尝试打补丁
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', patchExportIfPossible);
  } else {
    patchExportIfPossible();
  }
})();
