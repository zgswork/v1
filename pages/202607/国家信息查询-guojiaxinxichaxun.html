<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>国家信息查询</title>
    <style>
      :root {
        --bg: #ffffff;
        --text: #1f2937;
        --muted-text: #4b5563;
        --card-bg: #f8fafc;
        --border: #e5e7eb;
        --primary: #2563eb;
        --primary-contrast: #ffffff;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }
      html[data-theme="dark"] {
        --bg: #0b1220;
        --text: #e5e7eb;
        --muted-text: #9ca3af;
        --card-bg: #0f172a;
        --border: #1f2937;
        --primary: #60a5fa;
        --primary-contrast: #0b1220;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: -apple-system, blinkmacsystemfont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
        color: var(--text);
        background: radial-gradient(1200px 600px at 10% -20%, rgba(37, 99, 235, .08), transparent 60%),
                    radial-gradient(900px 700px at 110% -10%, rgba(2, 6, 23, .06), transparent 60%),
                    var(--bg);
      }

      .container {
        max-width: 980px;
        padding: 20px;
        margin: 0 auto;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
      }

      h1 {
        font-size: 22px;
        margin: 0;
        letter-spacing: .5px;
      }

      .controls {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }

      .select-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      label { color: var(--muted-text); }
      select {
        appearance: none;
        -webkit-appearance: none;
        background: var(--card-bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        min-width: 220px;
        box-shadow: var(--shadow);
      }

      input[type="text"] {
        background: var(--card-bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        min-width: 240px;
        box-shadow: var(--shadow);
      }

      .counter { color: var(--muted-text); font-size: 12px; }

      .btn {
        border: 1px solid var(--border);
        background: var(--card-bg);
        color: var(--text);
        border-radius: 10px;
        padding: 10px 14px;
        cursor: pointer;
        box-shadow: var(--shadow);
        transition: transform .06s ease, background .2s ease, border-color .2s ease;
      }
      .btn:active { transform: scale(.98); }
      .btn.primary { background: var(--primary); color: var(--primary-contrast); border-color: transparent; }

      .card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 18px;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .grid .item {
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px dashed var(--border);
        background: transparent;
      }
      .label { color: var(--muted-text); font-size: 13px; }
      .value { font-size: 16px; margin-top: 6px; }

      .flag-title {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
      }
      .flag {
        font-size: 32px;
        line-height: 1;
      }
      .title {
        display: flex;
        flex-direction: column;
      }
      .title .name { font-size: 18px; font-weight: 600; }
      .title .official { font-size: 13px; color: var(--muted-text); }

      footer { margin-top: 22px; color: var(--muted-text); font-size: 12px; text-align: center; }

      @media (max-width: 720px) {
        .grid { grid-template-columns: 1fr; }
        header { flex-direction: column; align-items: stretch; }
        .controls { justify-content: space-between; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>国家信息查询</h1>
        <div class="controls">
          <div class="select-wrap">
            <label for="countrySelect">选择国家</label>
            <select id="countrySelect" aria-label="选择国家">
              <option value="" selected>请选择国家…</option>
            </select>
            <span id="resultCount" class="counter"></span>
          </div>
          <div class="select-wrap">
            <label for="regionSelect">地区</label>
            <select id="regionSelect" aria-label="地区筛选">
              <option value="">全部地区</option>
            </select>
          </div>
          <div class="select-wrap">
            <label for="searchInput">搜索</label>
            <input id="searchInput" type="text" placeholder="输入国家名或ISO代码" aria-label="搜索国家" />
          </div>
          <button id="themeToggle" class="btn" aria-pressed="false">🌞 浅色主题</button>
        </div>
      </header>

      <section id="infoCard" class="card" aria-live="polite">
        <div class="flag-title">
          <div id="flag" class="flag" aria-hidden="true">🏳️</div>
          <div class="title">
            <div id="countryName" class="name">未选择</div>
            <div id="countryOfficial" class="official">请选择国家以查看详情</div>
          </div>
        </div>

        <div class="grid">
          <div class="item">
            <div class="label">首都</div>
            <div id="capital" class="value">—</div>
          </div>
          <div class="item">
            <div class="label">所属地区</div>
            <div id="region" class="value">—</div>
          </div>
          <div class="item">
            <div class="label">人口</div>
            <div id="population" class="value">—</div>
          </div>
          <div class="item">
            <div class="label">国土面积</div>
            <div id="area" class="value">—</div>
          </div>
          <div class="item">
            <div class="label">货币</div>
            <div id="currency" class="value">—</div>
          </div>
          <div class="item">
            <div class="label">语言</div>
            <div id="languages" class="value">—</div>
          </div>
          <div class="item">
            <div class="label">时区</div>
            <div id="timezones" class="value">—</div>
          </div>
          <div class="item">
            <div class="label">国际区号</div>
            <div id="callingCode" class="value">—</div>
          </div>
          <div class="item">
            <div class="label">ISO 代码</div>
            <div id="iso" class="value">—</div>
          </div>
        </div>
      </section>

      <footer>数据为常见近似值，仅用于参考展示；本工具离线可用。</footer>
    </div>

        { name: "爱沙尼亚", official: "爱沙尼亚共和国", iso2: "EE", iso3: "EST", capital: "塔林", region: "欧洲 · 北欧", population: 1326000, area: 45227, currency: { code: "EUR", name: "欧元", symbol: "€" }, languages: ["爱沙尼亚语"], timezones: ["UTC+2", "UTC+3(夏令时)"], callingCode: "+372", flagEmoji: "🇪🇪" },
        { name: "拉脱维亚", official: "拉脱维亚共和国", iso2: "LV", iso3: "LVA", capital: "里加", region: "欧洲 · 北欧", population: 1907000, area: 64559, currency: { code: "EUR", name: "欧元", symbol: "€" }, languages: ["拉脱维亚语"], timezones: ["UTC+2", "UTC+3(夏令时)"], callingCode: "+371", flagEmoji: "🇱🇻" },
        { name: "立陶宛", official: "立陶宛共和国", iso2: "LT", iso3: "LTU", capital: "维尔纽斯", region: "欧洲 · 北欧", population: 2794000, area: 65300, currency: { code: "EUR", name: "欧元", symbol: "€" }, languages: ["立陶宛语"], timezones: ["UTC+2", "UTC+3(夏令时)"], callingCode: "+370", flagEmoji: "🇱🇹" }
      );

      function numberFmt(value) {
        if (value === null || value === undefined || value === "N/A") return "—";
        if (typeof value === "number") return new Intl.NumberFormat("zh-CN").format(value);
        return String(value);
      }

      function joinArr(arr) {
        return Array.isArray(arr) && arr.length ? arr.join("，") : "—";
      }

      function renderCountry(country) {
        const flag = document.getElementById("flag");
        const name = document.getElementById("countryName");
        const official = document.getElementById("countryOfficial");
        const capital = document.getElementById("capital");
        const region = document.getElementById("region");
        const population = document.getElementById("population");
        const area = document.getElementById("area");
        const currency = document.getElementById("currency");
        const languages = document.getElementById("languages");
        const timezones = document.getElementById("timezones");
        const callingCode = document.getElementById("callingCode");
        const iso = document.getElementById("iso");

        if (!country) {
          flag.textContent = "🏳️";
          name.textContent = "未选择";
          official.textContent = "请选择国家以查看详情";
          capital.textContent = region.textContent = population.textContent = area.textContent = currency.textContent = languages.textContent = timezones.textContent = callingCode.textContent = iso.textContent = "—";
          return;
        }

        flag.textContent = country.flagEmoji || "🏳️";
        name.textContent = country.name;
        official.textContent = country.official;
        capital.textContent = country.capital || "—";
        region.textContent = country.region || "—";
        population.textContent = country.population ? numberFmt(country.population) + " 人" : "—";
        area.textContent = country.area ? numberFmt(country.area) + " km²" : "—";
        currency.textContent = country.currency ? `${country.currency.name}（${country.currency.code} ${country.currency.symbol || ''}）` : "—";
        languages.textContent = joinArr(country.languages);
        timezones.textContent = joinArr(country.timezones);
        callingCode.textContent = country.callingCode || "—";
        iso.textContent = country.iso2 && country.iso3 ? `${country.iso2} / ${country.iso3}` : "—";
      }

      function ensureTheme() {
        const saved = localStorage.getItem("country_tool_theme");
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const current = saved || (prefersDark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", current);
        const btn = document.getElementById("themeToggle");
        btn.setAttribute("aria-pressed", current === "dark" ? "true" : "false");
        btn.textContent = current === "dark" ? "🌙 深色主题" : "🌞 浅色主题";
      }

      function toggleTheme() {
        const html = document.documentElement;
        const next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
        html.setAttribute("data-theme", next);
        localStorage.setItem("country_tool_theme", next);
        const btn = document.getElementById("themeToggle");
        btn.setAttribute("aria-pressed", next === "dark" ? "true" : "false");
        btn.textContent = next === "dark" ? "🌙 深色主题" : "🌞 浅色主题";
      }

      function mainRegion(region) {
        if (!region) return "其他";
        return region.split("·")[0].split("/")[0].trim();
      }

      function rebuildOptions() {
        const select = document.getElementById("countrySelect");
        const regionSel = document.getElementById("regionSelect");
        const query = document.getElementById("searchInput").value.trim().toLowerCase();
        const targetRegion = regionSel.value;

        // 保留当前选择
        const prev = select.value;

        // 清空并重建
        select.innerHTML = "";
        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = "请选择国家…";
        select.appendChild(placeholder);

        const filtered = [...COUNTRIES]
          .filter(c => !targetRegion || mainRegion(c.region) === targetRegion)
          .filter(c => {
            if (!query) return true;
            const hay = [c.name, c.official, c.iso2, c.iso3].join(" ").toLowerCase();
            return hay.includes(query);
          })
          .sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));

        for (const c of filtered) {
          const opt = document.createElement("option");
          opt.value = c.iso2;
          opt.textContent = `${c.flagEmoji || ''} ${c.name}`.trim();
          select.appendChild(opt);
        }

        document.getElementById("resultCount").textContent = filtered.length ? `（${filtered.length} 项）` : "（无结果）";

        // 尝试恢复选择
        if (prev) {
          const exists = filtered.find(c => c.iso2 === prev);
          if (exists) select.value = prev; else select.value = "";
        } else {
          select.value = "";
        }
      }

      function init() {
        const select = document.getElementById("countrySelect");

        // 准备地区集合
        const regions = Array.from(new Set(COUNTRIES.map(c => mainRegion(c.region)))).sort((a,b)=>a.localeCompare(b,'zh-CN'));
        const regionSel = document.getElementById("regionSelect");
        for (const r of regions) {
          const opt = document.createElement("option");
          opt.value = r; opt.textContent = r; regionSel.appendChild(opt);
        }

        // 初次重建
        rebuildOptions();

        select.addEventListener("change", () => {
          const iso2 = select.value;
          const c = COUNTRIES.find(x => x.iso2 === iso2);
          renderCountry(c || null);
        });
        regionSel.addEventListener("change", () => { rebuildOptions(); });
        document.getElementById("searchInput").addEventListener("input", () => { rebuildOptions(); });

        document.getElementById("themeToggle").addEventListener("click", toggleTheme);

        ensureTheme();
        renderCountry(null);
      }

      document.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
</html>
