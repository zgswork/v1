        :root {

            --secondary-color: #2980b9;
            --text-color: #333;
            --light-color: #f8f9fa;
            --dark-color: #343a40;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
            color: var(--text-color);
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 500px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-bottom: 20px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--dark-color);
            font-weight: 300;
        }
        
        .timer-name {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            outline: none;
            transition: border 0.3s;
        }
        
        .timer-name:focus {
            border-color: var(--primary-color);
        }
        
        .time-selectors {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
        }
        
        .time-selector {
            flex: 1;
            margin: 0 5px;
        }
        
        .time-selector label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #666;
        }
        
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: white;
            font-size: 16px;
            outline: none;
            transition: border 0.3s;
        }
        
        select:focus {
            border-color: var(--primary-color);
        }
        
        .timer-display {
            font-size: 48px;
            text-align: center;
            margin: 25px 0;
            font-weight: 300;
            letter-spacing: 2px;
        }
        
        .buttons {
            display: flex;
            justify-content: space-between;
        }
        
        button {
            flex: 1;
            margin: 0 5px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        .start-btn {
            background-color: var(--primary-color);
            color: white;
        }
        
        .start-btn:hover {
            background-color: var(--secondary-color);
        }
        
        .pause-btn {
            background-color: #f39c12;
            color: white;
        }
        
        .pause-btn:hover {
            background-color: #e67e22;
        }
        
        .reset-btn {
            background-color: #e74c3c;
            color: white;
        }
        
        .reset-btn:hover {
            background-color: #c0392b;
        }
        
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            
            .time-selectors {
                flex-direction: column;
            }
            
            .time-selector {
                margin: 5px 0;
            }
            
            .timer-display {
                font-size: 36px;
            }
            
            .buttons {
                flex-direction: column;
            }
            
            button {
                margin: 5px 0;
            }
        }
    </style>
</head>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        document.addEventListener('DOMContentLoaded', function() {
            const timerName = document.getElementById('timerName');
            const hoursSelect = document.getElementById('hours');
            const minutesSelect = document.getElementById('minutes');
            const secondsSelect = document.getElementById('seconds');
            const timerDisplay = document.getElementById('timerDisplay');
            const startBtn = document.getElementById('startBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const resetBtn = document.getElementById('resetBtn');
            
            let timer;
            let totalSeconds = 0;
            let remainingSeconds = 0;
            let isPaused = false;
            
            // 更新时间显示
            function updateDisplay(seconds) {
                const hours = Math.floor(seconds / 3600);
                const minutes = Math.floor((seconds % 3600) / 60);
                const secs = seconds % 60;
                
                timerDisplay.textContent = 
                    `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                
                // 更新标题
                if (timerName.value) {
                    document.title = `${timerName.value} - ${timerDisplay.textContent}`;
                } else {
                    document.title = `倒计时 - ${timerDisplay.textContent}`;
                }
            }
            
            // 开始倒计时
            function startTimer() {
                if (timer) {
                    clearInterval(timer);
                }
                
                const hours = parseInt(hoursSelect.value);
                const minutes = parseInt(minutesSelect.value);
                const seconds = parseInt(secondsSelect.value);
                
                totalSeconds = hours * 3600 + minutes * 60 + seconds;
                remainingSeconds = totalSeconds;
                
                if (remainingSeconds <= 0) {
                    alert('请设置一个有效的时间');
                    return;
                }
                
                updateDisplay(remainingSeconds);
                
                timer = setInterval(function() {
                    if (!isPaused) {
                        remainingSeconds--;
                        updateDisplay(remainingSeconds);
                        
                        if (remainingSeconds <= 0) {
                            clearInterval(timer);
                            timer = null;
                            startBtn.disabled = false;
                            pauseBtn.disabled = true;
                            resetBtn.disabled = false;
                            
                            // 播放提示音
                            const audio = new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU...');
                            audio.play().catch(e => console.log('音频播放失败:', e));
                            
                            alert('时间到！');
                        }
                    }
                }, 1000);
                
                startBtn.disabled = true;
                pauseBtn.disabled = false;
                resetBtn.disabled = false;
                hoursSelect.disabled = true;
                minutesSelect.disabled = true;
                secondsSelect.disabled = true;
            }
            
            // 暂停/继续倒计时
            function togglePause() {
                isPaused = !isPaused;
                pauseBtn.textContent = isPaused ? '继续' : '暂停';
            }
            
            // 重置倒计时
            function resetTimer() {
                clearInterval(timer);
                timer = null;
                remainingSeconds = 0;
                updateDisplay(totalSeconds);
                
                startBtn.disabled = false;
                pauseBtn.disabled = true;
                resetBtn.disabled = true;
                pauseBtn.textContent = '暂停';
                isPaused = false;
                
                hoursSelect.disabled = false;
                minutesSelect.disabled = false;
                secondsSelect.disabled = false;
                
                document.title = timerName.value ? `${timerName.value}` : '简约倒计时';
            }
            
            // 事件监听
            startBtn.addEventListener('click', startTimer);
            pauseBtn.addEventListener('click', togglePause);
            resetBtn.addEventListener('click', resetTimer);
            
            // 名称输入框变化时更新标题
            timerName.addEventListener('input', function() {
                if (!timer) {
                    document.title = this.value || '简约倒计时';
                }
            });
        });
    </script>
