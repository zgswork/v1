<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>缘分测试</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            color: #5a3e36;
            text-align: center;
        }
        
        .container {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            position: relative;
        }
        
        h1 {
            color: #e67e7e;
            margin-bottom: 20px;
            font-size: 28px;
        }
        
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #e67e7e;
        }
        
        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #fad0c4;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        
        button {
            background-color: #e67e7e;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            width: 100%;
        }
        
        button:hover {
            background-color: #d45d5d;
            transform: translateY(-2px);
        }
        
        .result {
            margin-top: 30px;
            display: none;
        }
        
        .score {
            font-size: 48px;
            font-weight: bold;
            color: #e67e7e;
            margin: 15px 0;
        }
        
        .progress-container {
            width: 100%;
            height: 20px;
            background-color: #f3f3f3;
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff9a9e 0%, #fad0c4 100%);
            border-radius: 10px;
            transition: width 1s;
        }
        
        .message {
            font-size: 18px;
            margin-top: 15px;
            font-style: italic;
        }
        
        .hearts {
            font-size: 24px;
            margin: 15px 0;
            animation: pulse 1.5s infinite;
        }
        
        .disclaimer {
            font-size: 12px;
            color: #999;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed #e67e7e;
            line-height: 1.5;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌸 缘分测试 🌸</h1>
        
        <div class="input-group">
            <label for="name1">第一个名字</label>
            <input type="text" id="name1" placeholder="输入名字">
        </div>
        
        <div class="input-group">
            <label for="name2">第二个名字</label>
            <input type="text" id="name2" placeholder="输入名字">
        </div>
        
        <button id="testBtn">测试缘分</button>
        
        <div class="result" id="result">
            <div class="hearts">❤️ ❤️ ❤️</div>
            <div class="score" id="score">0%</div>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="message" id="message"></div>
        </div>
        
        <div class="disclaimer">
            本缘分测试仅供娱乐，无科学依据，不构成专业建议。
            请理性看待测试结果，因依赖结果产生的后果，本网页不承担责任。
        </div>
    </div>
    
    <script>
        const testBtn = document.getElementById('testBtn');
        const resultDiv = document.getElementById('result');
        const scoreDiv = document.getElementById('score');
        const progressBar = document.getElementById('progressBar');
        const messageDiv = document.getElementById('message');
        
        testBtn.addEventListener('click', () => {
            const name1 = document.getElementById('name1').value.trim();
            const name2 = document.getElementById('name2').value.trim();
            
            if (!name1 || !name2) {
                alert('请输入两个名字');
                return;
            }
            
            // 计算缘分分数 (随机+名字长度因素)
            const baseScore = Math.abs(name1.length - name2.length) * 5;
            const randomFactor = Math.random() * 60;
            let score = Math.round(100 - baseScore + randomFactor);
            score = Math.max(10, Math.min(100, score)); // 确保在10-100之间
            
            // 显示结果
            resultDiv.style.display = 'block';
            progressBar.style.width = '0%';
            scoreDiv.textContent = '0%';
            
            // 动画效果
            let current = 0;
            const interval = setInterval(() => {
                current += 1;
                scoreDiv.textContent = current + '%';
                progressBar.style.width = current + '%';
                
                if (current >= score) {
                    clearInterval(interval);
                    setMessage(score, name1, name2);
                }
            }, 20);
        });
        
        function setMessage(score, name1, name2) {
            let message = '';
            
            if (score >= 90) {
                message = `天作之合！${name1}和${name2}简直是绝配！`;
            } else if (score >= 70) {
                message = `很相配！${name1}和${name2}在一起会很幸福~`;
            } else if (score >= 50) {
                message = `还不错！${name1}和${name2}需要更多了解彼此`;
            } else if (score >= 30) {
                message = `需要努力！${name1}和${name2}要多培养感情`;
            } else {
                message = `不太合适...${name1}和${name2}可能需要重新考虑`;
            }
            
            messageDiv.textContent = message;
        }
    </script>
</body>
</html>
