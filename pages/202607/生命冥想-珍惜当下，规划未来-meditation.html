<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生命冥想 - 珍惜当下，规划未来</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            padding-bottom:90px;
        }

        /* === 背景层：渐变 + 图片叠加到同一层 === */
        .background-overlay {
            position: fixed;
            inset: 0; /* top/right/bottom/left: 0; */
            z-index: -1;
            background-image:
                linear-gradient(135deg,
                    rgba(255, 236, 210, 0.45) 0%,
                    rgba(252, 182, 159, 0.45) 100%),
                url('https://github.com/anneeeee/programming_exercise/blob/main/76467315-8f97-4f59-afbf-9dc248ee233d.png?raw=true');
            background-size: cover;
            background-position: center;
            background-attachment: fixed; /* 需要时可去掉以兼容低端移动端 */
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .title {
            font-size: 2.5rem;
            color: #8b4513;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .subtitle {
            font-size: 1.2rem;
            color: #a0522d;
            opacity: 0.8;
        }

        .main-content {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }

        /* 其余样式保持不变 ↓↓↓ */
        .form-section { margin-bottom: 40px; }
        .form-group { margin-bottom: 25px; }
        .form-group label {
            display: block; margin-bottom: 8px;
            font-weight: 600; color: #8b4513; font-size: 1.1rem;
        }
        .form-group input,
        .form-group select {
            width: 100%; padding: 15px;
            border: 2px solid #deb887; border-radius: 10px;
            font-size: 1rem; background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none; border-color: #cd853f;
            box-shadow: 0 0 10px rgba(205, 133, 63, 0.3);
        }
        .calculate-btn {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, #cd853f 0%, #daa520 100%);
            color: white; border: none; border-radius: 10px;
            font-size: 1.2rem; font-weight: 600; cursor: pointer;
            transition: all 0.3s ease; margin-top: 20px;
        }
        .calculate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(205, 133, 63, 0.3);
        }
        .results-section { display: none; text-align: center; margin-top: 40px; }
        .character-display { margin-bottom: 30px; }
        .character-icon { font-size: 4rem; margin-bottom: 10px; }
        .character-description { font-size: 1.1rem; color: #8b4513; font-style: italic; }

        .life-progress {
            background: rgba(255, 255, 255, 0.8);
            padding: 20px; border-radius: 10px; margin: 20px 0;
        }
        .progress-bar {
            background: #f0f0f0; height: 20px;
            border-radius: 10px; overflow: hidden; margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #cd853f 0%, #daa520 100%);
            transition: width 1s ease; border-radius: 10px;
        }
        .progress-text { font-size: 1rem; color: #8b4513; text-align: center; margin-top: 10px; }

        .countdown-container {
            background: linear-gradient(135deg, #fff8dc 0%, #f5deb3 100%);
            padding: 30px; border-radius: 15px; margin: 30px 0;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.1);
        }
        .countdown-title { font-size: 1.3rem; color: #8b4513; margin-bottom: 20px; font-weight: 600; }
        .countdown-display { font-size: 1.5rem; color: #a0522d; font-weight: 700; margin-bottom: 15px; }

        .time-units {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 15px; margin-top: 20px;
        }
        .time-unit {
            background: rgba(255, 255, 255, 0.8);
            padding: 15px; border-radius: 10px; text-align: center;
        }
        .time-number { font-size: 1.5rem; font-weight: 700; color: #8b4513; display: block; }
        .time-label  { font-size: 0.9rem; color: #a0522d; margin-top: 5px; }

        .meditation-section {
            background: linear-gradient(135deg, #fdf5e6 0%, #f5e6d3 100%);
            padding: 30px; border-radius: 15px; margin-top: 30px; text-align: center;
        }
        .meditation-text {
            font-size: 1.2rem; color: #8b4513; line-height: 1.8;
            margin-bottom: 20px;font-style: italic;
        }
        .reflection-prompt {
            background: rgba(255, 255, 255, 0.8);
            padding: 25px; border-radius: 10px; border-left: 5px solid #cd853f; margin-top: 20px;
        }
        .reflection-prompt h3 { color: #8b4513; margin-bottom: 15px; font-size: 1.2rem; }
        .reflection-prompt p  { color: #a0522d; font-size: 1.1rem; line-height: 1.6; }

        @media (max-width: 768px) {
            .container { padding: 15px; }
            .title { font-size: 2rem; }
            .main-content { padding: 25px; }
            .time-units { grid-template-columns: repeat(2, 1fr); }
            .meditation-text { font-size: 1.1rem; }
        }
        @media (max-width: 480px) {
            .title { font-size: 1.8rem; }
            .main-content { padding: 20px; }
            .time-units { grid-template-columns: 1fr; }
        }

        .fade-in { animation: fadeIn 1s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0);} }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { transform: scale(1);} 50% { transform: scale(1.05);} }
    </style>
</head>
<body>
    <!-- 只保留这一层背景 -->
    <div class="background-overlay"></div>

    <div class="container">
        <header class="header">
            <h1 class="title">生命冥想</h1>
            <p class="subtitle">珍惜当下，规划未来</p>
        </header>

        <main class="main-content">
            <!-- 表单 -->
            <section class="form-section">
                <div class="form-group">
                    <label for="birthdate">你的生日：</label>
                    <input type="date" id="birthdate" required>
                </div>

                <div class="form-group">
                    <label for="gender">性别：</label>
                    <select id="gender" required>
                        <option value="">请选择</option>
                        <option value="male">男</option>
                        <option value="female">女</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="lifeExpectancy">预期寿命（岁）：</label>
                    <input type="number" id="lifeExpectancy" min="1" max="150" value="80" required>
                </div>

                <button class="calculate-btn" onclick="calculateLifeTime()">开始生命冥想</button>
            </section>

            <!-- 结果 -->
            <section class="results-section" id="resultsSection">
                <div class="character-display">
                    <div class="character-icon" id="characterIcon"></div>
                    <div class="character-description" id="characterDescription"></div>
                </div>

                <div class="life-progress">
                    <h3 style="color: #8b4513; margin-bottom: 10px;">人生进度</h3>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-text" id="progressText"></div>
                </div>

                <div class="countdown-container">
                    <h3 class="countdown-title">生命倒计时</h3>
                    <div class="countdown-display" id="countdownDisplay"></div>
                    <div class="time-units" id="timeUnits"></div>
                </div>

                <div class="meditation-section">
                    <p class="meditation-text">
                        想象一下，当你到达生命的终点时，你希望看到什么样的画面？<br>
                        家人围绕在你身边，孩子们拍手庆祝你度过的美好人生，<br>
                        桌上的生日蛋糕见证着你一生的成就与爱的传承...
                    </p>

                    <div class="reflection-prompt">
                        <h3>正念思考</h3>
                        <p>想象到那些美好的画面了吗？为了实现这样的理想，现在，你应该着手去做什么？</p>
                    </div>
                </div>
            </section>
        </main>
        <template id="site-footer">
        <style>
            .footer {
            position: fixed;   /* 贴底 */
            bottom: 45px;
            left: 0;
            width: 100%;
            padding: .75rem 1rem;
            font-size: 14px;
            background: #fafafa;
            border-top: 1px solid #eaeaea;
            display: flex;
            flex-wrap: wrap;
            gap: .5rem;
            justify-content: center;
            align-items: center;
            z-index: 999;
            }
            .footer a { color: #0077cc; text-decoration: none; }
            .footer a:hover { text-decoration: underline; }

            .qr-wrapper { position: relative; display: inline-block; }
            .qr-img {
            /* 初始隐藏 */
            display: none;
            position: absolute;
            bottom: 1.8rem;   /* 调整图片出现的位置 */
            left: 50%;
            transform: translateX(-50%);
            max-width: 140px;
            border: 1px solid #ddd;
            background: #fff;
            padding: 4px;
            border-radius: 6px;
            box-shadow: 0 4px 12px rgba(0,0,0,.15);
            }
            .qr-wrapper:hover .qr-img { display: block; }
        </style>

        <div class="footer card">
            Created&nbsp;by：
            <!-- 广告示例 1 -->
                <span class="qr-wrapper">
                <a class="qr-link"
                    href="https://mp.weixin.qq.com/mp/profile_ext?action=home&__biz=MzI0MzUzOTEwMw==&scene=124#wechat_redirect"
                    target="_blank"
                    data-img="https://youke1.picui.cn/s1/2025/07/12/6872600d20281.jpg">系统1与系统2</a>
                <img class="qr-img" alt="系统1与系统2公众号二维码">
                </span>
            &nbsp;||&nbsp;广告位：
            <!-- 广告示例 1 -->
            <span class="qr-wrapper">
            <a class="qr-link"
                href="https://t.zsxq.com/SjYuX"
                target="_blank"
                data-img="https://youke1.picui.cn/s1/2025/07/12/6871f995b3e7a.jpg">AI编程星球</a>
            <img class="qr-img" alt="AI编程星球二维码">
            </span> |
            <!-- 广告示例 2 -->
            <span class="qr-wrapper">
            <a class="qr-link"
                href="https://t.zsxq.com/VTCya"
                target="_blank"
                data-img="https://youke1.picui.cn/s1/2025/07/12/6871f9c361e7d.jpg">副业避坑星球</a>
            <img class="qr-img" alt="副业避坑星球二维码">
            </span> |
            <!-- 广告示例 3（如果没有 data-img 就不会弹出图片） -->
            <span class="qr-wrapper">
            <a class="qr-link"
                href="https://www.xiaobot.net/p/ai07?refer=a9625ad2-ec04-4cc8-8549-7511079cb3b5"
                target="_blank"
                data-img="https://youke1.picui.cn/s1/2025/07/12/6871f9ef3edba.jpg">AI&nbsp;产品日报</a>
            <img class="qr-img" alt="AI产品日报二维码">
            </span> |
            <span class="qr-wrapper">
            <a class="qr-link"
                href="https://t.zsxq.com/jcaEa"
                target="_blank"
                data-img="https://youke1.picui.cn/s1/2025/07/12/6871fa39eab33.jpg">AI&nbsp;产品经理大本营</a>
            <img class="qr-img" alt="AI产品经理大本营二维码">
            </span>
        </div>
    </template>
    </div>

    <script>
        let countdownInterval;

        function calculateLifeTime() {
            const birthdate = document.getElementById('birthdate').value;
            const gender = document.getElementById('gender').value;
            const lifeExpectancy = parseInt(document.getElementById('lifeExpectancy').value);

            if (!birthdate || !gender || !lifeExpectancy) {
                alert('请填写完整信息');
                return;
            }

            const birthDate = new Date(birthdate);
            const currentDate = new Date();
            const endDate = new Date(birthDate.getFullYear() + lifeExpectancy, birthDate.getMonth(), birthDate.getDate());

            // 计算年龄和剩余时间
            const age = Math.floor((currentDate - birthDate) / (365.25 * 24 * 60 * 60 * 1000));
            const lifeProgress = (age / lifeExpectancy) * 100;

            // 显示角色
            const characterIcon = document.getElementById('characterIcon');
            const characterDescription = document.getElementById('characterDescription');

            if (gender === 'male') {
                characterIcon.textContent = '👴';
                characterDescription.textContent = '一位慈祥的老爷爷，脸上洋溢着满足的笑容';
            } else {
                characterIcon.textContent = '👵';
                characterDescription.textContent = '一位和蔼的老奶奶，眼中闪烁着智慧的光芒';
            }

            // 更新人生进度条
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            progressFill.style.width = Math.min(lifeProgress, 100) + '%';
            progressText.textContent = `已度过 ${age} 年，完成人生进度 ${Math.min(lifeProgress, 100).toFixed(1)}%`;

            // 显示结果区域
            const resultsSection = document.getElementById('resultsSection');
            resultsSection.style.display = 'block';
            resultsSection.classList.add('fade-in');

            // 开始倒计时
            startCountdown(endDate);

            // 滚动到结果区域
            setTimeout(() => {
                resultsSection.scrollIntoView({ behavior: 'smooth' });
            }, 500);
        }

        function startCountdown(endDate) {
            if (countdownInterval) clearInterval(countdownInterval);

            function updateCountdown() {
                const now = new Date().getTime();
                const distance = endDate.getTime() - now;

                if (distance < 0) {
                    document.getElementById('countdownDisplay').textContent = '生命已达到预期终点';
                    document.getElementById('timeUnits').innerHTML =
                        '<div class="time-unit"><span class="time-number">∞</span><div class="time-label">永恒的回忆</div></div>';
                    clearInterval(countdownInterval);
                    return;
                }

                const years   = Math.floor(distance / (1000 * 60 * 60 * 24 * 365.25));
                const days    = Math.floor((distance % (1000 * 60 * 60 * 24 * 365.25)) / (1000 * 60 * 60 * 24));
                const hours   = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                const totalDays     = Math.floor(distance / (1000 * 60 * 60 * 24));
                const totalHours    = Math.floor(distance / (1000 * 60 * 60));
                const totalMinutes  = Math.floor(distance / (1000 * 60));

                document.getElementById('countdownDisplay').textContent =
                    `剩余时间：${years} 年 ${days} 天 ${hours} 小时 ${minutes} 分钟 ${seconds} 秒`;

                document.getElementById('timeUnits').innerHTML = `
                    <div class="time-unit">
                        <span class="time-number">${years}</span>
                        <div class="time-label">年</div>
                    </div>
                    <div class="time-unit">
                        <span class="time-number">${totalDays.toLocaleString()}</span>
                        <div class="time-label">总天数</div>
                    </div>
                    <div class="time-unit">
                        <span class="time-number">${totalHours.toLocaleString()}</span>
                        <div class="time-label">总小时</div>
                    </div>
                    <div class="time-unit">
                        <span class="time-number">${totalMinutes.toLocaleString()}</span>
                        <div class="time-label">总分钟</div>
                    </div>
                `;
            }

            updateCountdown();
            countdownInterval = setInterval(updateCountdown, 1000);
        }

        // 页面加载时设置默认生日为30年前
        window.addEventListener('load', () => {
            const today = new Date();
            const defaultBirthDate = new Date(today.getFullYear() - 30, today.getMonth(), today.getDate());
            document.getElementById('birthdate').value = defaultBirthDate.toISOString().split('T')[0];
        });

        // 微交互：输入框上下浮动
        document.querySelectorAll('input, select').forEach(el => {
            el.addEventListener('focus', () => {
                el.parentElement.style.transform = 'translateY(-2px)';
                el.parentElement.style.transition = 'transform 0.3s ease';
            });
            el.addEventListener('blur', () => {
                el.parentElement.style.transform = 'translateY(0)';
            });
        });

        // 把模板克隆到页面底部
        document.addEventListener('DOMContentLoaded', () => {
            const tpl = document.getElementById('site-footer');
            if (tpl && 'content' in tpl) {
            document.body.appendChild(tpl.content.cloneNode(true));
            }

            // 用 data-img 填充 <img src>
            document.querySelectorAll('.qr-wrapper').forEach(w => {
            const link = w.querySelector('.qr-link');
            const img  = w.querySelector('.qr-img');
            if (link && img && link.dataset.img) {
                img.src = link.dataset.img.trim();
            }
            });
        });
    </script>
</body>
</html>
