<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>HTML代码导出工具</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }
        .container {
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 20px;
        }
        .editor-container {
            margin-bottom: 20px;
        }
        #codeEditor {
            width: 100%;
            height: 400px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            margin-bottom: 10px;
        }
        .download-section {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        input[type="text"] {
            padding: 8px;
            width: 300px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        .tips {
            color: #666;
            margin-top: 10px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>HTML代码导出工具</h1>
        <div class="editor-container">
            <textarea id="codeEditor" placeholder="在此处粘贴或编写HTML代码..."></textarea>
        </div>
        
        <div class="download-section">
            <input type="text" id="fileName" placeholder="输入文件名（默认：index.html）">
            <button onclick="exportHTML()">导出HTML文件</button>
        </div>
        
        <div class="tips">
            <p>使用说明：</p>
            <ul>
                <li>在编辑区输入完整的HTML代码</li>
                <li>自定义文件名（可选，默认使用index.html）</li>
                <li>点击导出按钮保存文件</li>
                <li>保存位置由浏览器下载设置决定</li>
            </ul>
        </div>
    </div>

    <script>
        function exportHTML() {
            const code = document.getElementById('codeEditor').value;
            const fileNameInput = document.getElementById('fileName').value;
            
            // 处理文件名
            let fileName = fileNameInput.trim() || 'index';
            if (!fileName.endsWith('.html')) {
                fileName += '.html';
            }

            // 创建Blob对象
            const blob = new Blob([code], { type: 'text/html' });
            
            // 创建下载链接
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = fileName;
            
            // 触发下载
            document.body.appendChild(link);
            link.click();
            
            // 清理
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        }
    </script>
</body>
</html>
