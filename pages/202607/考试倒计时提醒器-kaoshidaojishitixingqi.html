<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考试倒计时提醒器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#3B82F6',
            secondary: '#10B981',
            danger: '#EF4444',
            warning: '#F59E0B',
            info: '#3B82F6',
            light: '#F3F4F6',
            dark: '#1F2937',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .card-shadow {
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      .card-hover {
        transition: all 0.3s ease;
      }
      .card-hover:hover {
        transform: translateY(-2px);

      }
      .countdown-item {
        transition: all 0.3s ease;

      .countdown-item.warning {
        animation: pulse 1.5s infinite;

      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }

      .task-complete {
        transition: all 0.3s ease;

      .slide-in {
        animation: slideIn 0.3s ease-out;

        to { transform: translateY(0); opacity: 1; }
      }
      .fade-in {
        animation: fadeIn 0.3s ease-out;
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }

      .priority-high {
        border-left: 4px solid #EF4444;
      }
      .priority-medium {
        border-left: 4px solid #F59E0B;
      }
      .priority-low {
        border-left: 4px solid #10B981;

</head>
<body class="bg-gray-50 font-sans text-gray-800 min-h-screen">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- 标题区 -->
    <header class="text-center mb-8">
      <h1 class="text-[clamp(1.8rem,4vw,2.5rem)] font-bold text-primary mb-2">考试倒计时提醒器</h1>
      <p class="text-gray-600 max-w-2xl mx-auto">高效管理考试时间，制定复习计划，不错过任何重要考试</p>
    </header>

    <!-- 主内容区 -->
    <main class="space-y-8">
      <!-- 添加考试表单 -->
      <section class="bg-white rounded-xl shadow-md p-6">
        <h2 class="text-xl font-semibold mb-4 flex items-center">
          <i class="fa fa-plus-circle text-primary mr-2"></i>添加考试
        </h2>
        <form id="addExamForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
          <div class="space-y-1">
            <label for="examSubject" class="block text-sm font-medium text-gray-700">科目名称</label>
            <input type="text" id="examSubject" required
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition-colors">
          </div>
          <div class="space-y-1">
            <label for="examDate" class="block text-sm font-medium text-gray-700">考试日期</label>
            <input type="datetime-local" id="examDate" required
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition-colors">
          </div>
          <div class="space-y-1">
            <label for="examPriority" class="block text-sm font-medium text-gray-700">重要程度</label>
            <select id="examPriority" required
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition-colors">
              <option value="high">高</option>
              <option value="medium">中</option>
              <option value="low">低</option>
            </select>
          </div>
          <div class="space-y-1">
            <label for="reminderTime" class="block text-sm font-medium text-gray-700">提前提醒时间</label>
            <select id="reminderTime" required
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition-colors">
              <option value="1">提前1天</option>
              <option value="3">提前3天</option>
              <option value="7" selected>提前7天</option>
              <option value="14">提前14天</option>
              <option value="30">提前30天</option>
            </select>
          </div>
          <div class="md:col-span-4 text-right">
            <button type="submit" class="px-6 py-2 bg-primary hover:bg-primary/90 text-white font-medium rounded-lg shadow-md transition-all duration-300 flex items-center justify-center">
              <i class="fa fa-check mr-2"></i> 添加考试
            </button>
          </div>
        </form>
      </section>

      <!-- 统计概览 -->
      <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-white rounded-xl shadow-md p-6 flex items-center">
          <div class="w-16 h-16 bg-primary/10 rounded-full flex items-center justify-center mr-4">
            <i class="fa fa-calendar text-2xl text-primary"></i>
          </div>
          <div>
            <h3 class="text-gray-500 text-sm">即将到来的考试</h3>
            <p id="upcomingExamsCount" class="text-2xl font-bold text-primary">0</p>
          </div>
        </div>
        <div class="bg-white rounded-xl shadow-md p-6 flex items-center">
          <div class="w-16 h-16 bg-secondary/10 rounded-full flex items-center justify-center mr-4">
            <i class="fa fa-check-square text-2xl text-secondary"></i>
          </div>
          <div>
            <h3 class="text-gray-500 text-sm">今日待复习任务</h3>
            <p id="todayTasksCount" class="text-2xl font-bold text-secondary">0</p>
          </div>
        </div>
        <div class="bg-white rounded-xl shadow-md p-6 flex items-center">
          <div class="w-16 h-16 bg-warning/10 rounded-full flex items-center justify-center mr-4">
            <i class="fa fa-pie-chart text-2xl text-warning"></i>
          </div>
          <div>
            <h3 class="text-gray-500 text-sm">复习完成率</h3>
            <p id="completionRate" class="text-2xl font-bold text-warning">0%</p>
          </div>
        </div>
      </section>

      <!-- 图表统计 -->
      <section class="bg-white rounded-xl shadow-md p-6">
        <h2 class="text-xl font-semibold mb-4 flex items-center">
          <i class="fa fa-bar-chart text-primary mr-2"></i>复习进度统计
        </h2>
        <div class="h-[300px]">
          <canvas id="studyProgressChart"></canvas>
        </div>
      </section>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <!-- 考试列表 -->
        <section>
          <h2 class="text-xl font-semibold mb-4 flex items-center">
            <i class="fa fa-calendar-check-o text-primary mr-2"></i>考试列表
          </h2>
          <div id="examsList" class="space-y-4">
            <!-- 考试卡片将通过JavaScript动态生成 -->
            <div class="text-center py-8 text-gray-500">
              <i class="fa fa-calendar-o text-4xl mb-2"></i>
              <p>暂无考试信息，点击上方添加考试按钮添加您的第一个考试</p>
            </div>
          </div>
        </section>

        <!-- 复习计划 -->
        <section>
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-semibold flex items-center">
              <i class="fa fa-book text-primary mr-2"></i>复习计划
            </h2>
            <button id="toggleAddTaskForm" class="text-primary hover:text-primary/80 flex items-center">
              <i class="fa fa-plus-circle mr-1"></i> 添加任务
            </button>
          </div>
          
          <!-- 添加复习任务表单 -->
          <div id="addTaskForm" class="bg-white rounded-xl shadow-md p-6 mb-4 hidden">
            <form id="taskForm">
              <div class="space-y-4">
                <div class="space-y-1">
                  <label for="taskExam" class="block text-sm font-medium text-gray-700">关联考试</label>
                  <select id="taskExam" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition-colors">
                    <option value="">请选择考试</option>
                    <!-- 选项将通过JavaScript动态生成 -->
                  </select>
                </div>
                <div class="space-y-1">
                  <label for="taskName" class="block text-sm font-medium text-gray-700">任务名称</label>
                  <input type="text" id="taskName" required placeholder="例如：复习第一章内容"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition-colors">
                </div>
                <div class="space-y-1">
                  <label for="taskDate" class="block text-sm font-medium text-gray-700">计划完成日期</label>
                  <input type="date" id="taskDate" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition-colors">
                </div>
                <div class="text-right">
                  <button type="submit" class="px-4 py-2 bg-primary hover:bg-primary/90 text-white font-medium rounded-lg shadow-md transition-all duration-300">
                    <i class="fa fa-save mr-1"></i> 保存任务
                  </button>
                </div>
              </div>
            </form>
          </div>
          
          <!-- 复习任务列表 -->
          <div id="tasksList" class="space-y-4">
            <!-- 任务卡片将通过JavaScript动态生成 -->
            <div class="text-center py-8 text-gray-500">
              <i class="fa fa-tasks text-4xl mb-2"></i>
              <p>暂无复习任务，点击添加任务按钮开始创建您的复习计划</p>
            </div>
          </div>
        </section>
      </div>
    </main>

    <!-- 编辑考试模态框 -->
    <div id="editExamModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden fade-in">
      <div class="bg-white rounded-xl shadow-lg p-6 w-full max-w-lg mx-4 slide-in">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-xl font-semibold">编辑考试</h3>
          <button id="closeEditModal" class="text-gray-500 hover:text-gray-700">
            <i class="fa fa-times text-xl"></i>
          </button>
        </div>
        <form id="editExamForm" class="space-y-4">
          <input type="hidden" id="editExamId">
          <div class="space-y-1">
            <label for="editExamSubject" class="block text-sm font-medium text-gray-700">科目名称</label>
            <input type="text" id="editExamSubject" required
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition-colors">
          </div>
          <div class="space-y-1">
            <label for="editExamDate" class="block text-sm font-medium text-gray-700">考试日期</label>
            <input type="datetime-local" id="editExamDate" required
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition-colors">
          </div>
          <div class="space-y-1">
            <label for="editExamPriority" class="block text-sm font-medium text-gray-700">重要程度</label>
            <select id="editExamPriority" required
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition-colors">
              <option value="high">高</option>
              <option value="medium">中</option>
              <option value="low">低</option>
            </select>
          </div>
          <div class="space-y-1">
            <label for="editReminderTime" class="block text-sm font-medium text-gray-700">提前提醒时间</label>
            <select id="editReminderTime" required
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition-colors">
              <option value="1">提前1天</option>
              <option value="3">提前3天</option>
              <option value="7">提前7天</option>
              <option value="14">提前14天</option>
              <option value="30">提前30天</option>
            </select>
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" id="deleteExamBtn" class="px-4 py-2 bg-danger hover:bg-danger/90 text-white font-medium rounded-lg shadow-md transition-all duration-300">
              <i class="fa fa-trash mr-1"></i> 删除
            </button>
            <button type="submit" class="px-4 py-2 bg-primary hover:bg-primary/90 text-white font-medium rounded-lg shadow-md transition-all duration-300">
              <i class="fa fa-save mr-1"></i> 保存修改
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- 编辑任务模态框 -->
    <div id="editTaskModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden fade-in">
      <div class="bg-white rounded-xl shadow-lg p-6 w-full max-w-lg mx-4 slide-in">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-xl font-semibold">编辑复习任务</h3>
          <button id="closeEditTaskModal" class="text-gray-500 hover:text-gray-700">
            <i class="fa fa-times text-xl"></i>
          </button>
        </div>
        <form id="editTaskForm" class="space-y-4">
          <input type="hidden" id="editTaskId">
          <div class="space-y-1">
            <label for="editTaskExam" class="block text-sm font-medium text-gray-700">关联考试</label>
            <select id="editTaskExam" required
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition-colors">
              <option value="">请选择考试</option>
              <!-- 选项将通过JavaScript动态生成 -->
            </select>
          </div>
          <div class="space-y-1">
            <label for="editTaskName" class="block text-sm font-medium text-gray-700">任务名称</label>
            <input type="text" id="editTaskName" required
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition-colors">
          </div>
          <div class="space-y-1">
            <label for="editTaskDate" class="block text-sm font-medium text-gray-700">计划完成日期</label>
            <input type="date" id="editTaskDate" required
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition-colors">
          </div>
          <div class="space-y-1">
            <label for="editTaskCompleted" class="flex items-center text-sm font-medium text-gray-700">
              <input type="checkbox" id="editTaskCompleted" class="w-4 h-4 text-primary focus:ring-primary border-gray-300 rounded">
              <span class="ml-2">已完成</span>
            </label>
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" id="deleteTaskBtn" class="px-4 py-2 bg-danger hover:bg-danger/90 text-white font-medium rounded-lg shadow-md transition-all duration-300">
              <i class="fa fa-trash mr-1"></i> 删除
            </button>
            <button type="submit" class="px-4 py-2 bg-primary hover:bg-primary/90 text-white font-medium rounded-lg shadow-md transition-all duration-300">
              <i class="fa fa-save mr-1"></i> 保存修改
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- 底部备注 -->
    <footer class="mt-12 text-center text-gray-500 text-sm pb-8">
      <p class="mb-1">本工具由幸川制作</p>
      <p class="mb-1">微信号stevexing</p>
      <p>QQ邮箱<a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="0e3c3a3a393b383839384e7f7f206d6163">[email&#160;protected]</a></p>
    </footer>
  </div>

  <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
    // DOM元素获取
    const addExamForm = document.getElementById('addExamForm');
    const examsList = document.getElementById('examsList');
    const toggleAddTaskForm = document.getElementById('toggleAddTaskForm');
    const addTaskForm = document.getElementById('addTaskForm');
    const taskForm = document.getElementById('taskForm');
    const tasksList = document.getElementById('tasksList');
    const taskExamSelect = document.getElementById('taskExam');
    const upcomingExamsCount = document.getElementById('upcomingExamsCount');
    const todayTasksCount = document.getElementById('todayTasksCount');
    const completionRate = document.getElementById('completionRate');
    const editExamModal = document.getElementById('editExamModal');
    const closeEditModal = document.getElementById('closeEditModal');
    const editExamForm = document.getElementById('editExamForm');
    const deleteExamBtn = document.getElementById('deleteExamBtn');
    const editTaskModal = document.getElementById('editTaskModal');
    const closeEditTaskModal = document.getElementById('closeEditTaskModal');
    const editTaskForm = document.getElementById('editTaskForm');
    const deleteTaskBtn = document.getElementById('deleteTaskBtn');
    const editTaskExamSelect = document.getElementById('editTaskExam');

    // 应用状态
    let appState = {
      exams: [],
      tasks: [],
      currentEditExamId: null,
      currentEditTaskId: null
    };

    // 初始化应用
    function init() {
      // 从localStorage加载数据
      loadFromLocalStorage();
      
      // 设置事件监听
      setupEventListeners();
      
      // 更新UI
      updateExamsList();
      updateTasksList();
      updateStatistics();
      initializeChart();
      
      // 请求通知权限
      requestNotificationPermission();
      
      // 启动计时器和检查器
      startIntervalUpdates();
    }

    // 设置事件监听
    function setupEventListeners() {
      // 添加考试表单提交
      addExamForm.addEventListener('submit', handleAddExam);
      
      // 切换添加任务表单显示
      toggleAddTaskForm.addEventListener('click', () => {
        addTaskForm.classList.toggle('hidden');
      });
      
      // 添加任务表单提交
      taskForm.addEventListener('submit', handleAddTask);
      
      // 编辑考试模态框
      closeEditModal.addEventListener('click', () => {
        editExamModal.classList.add('hidden');
      });
      
      editExamForm.addEventListener('submit', handleEditExam);
      
      deleteExamBtn.addEventListener('click', handleDeleteExam);
      
      // 编辑任务模态框
      closeEditTaskModal.addEventListener('click', () => {
        editTaskModal.classList.add('hidden');
      });
      
      editTaskForm.addEventListener('submit', handleEditTask);
      
      deleteTaskBtn.addEventListener('click', handleDeleteTask);
      
      // 点击模态框外部关闭
      editExamModal.addEventListener('click', (e) => {
        if (e.target === editExamModal) editExamModal.classList.add('hidden');
      });
      
      editTaskModal.addEventListener('click', (e) => {
        if (e.target === editTaskModal) editTaskModal.classList.add('hidden');
      });
    }

    // 请求通知权限
    function requestNotificationPermission() {
      if ('Notification' in window) {
        Notification.requestPermission();
      }
    }

    // 发送通知
    function sendNotification(title, body) {
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification(title, {
          body: body,
          icon: 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjM0I4MkY2IiBzdHJva2Utd2lkdGg9IjIiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIgY2xhc3M9ImZlYXRoZXIgZmVhdGhlci1jYWxlbmRhciI+PHJlY3Qgd2lkdGg9IjIyIiBoZWlnaHQ9IjIyIiBmaWxsPSJ1cmwoI2xpbmVhckdyYWRpZW50KSIvPjxyZWN0IHg9IjEiIHk9IjEiIHdpZHRoPSIyMiIgaGVpZ2h0PSIyMiIgZmlsbD0iI0ZGRkZGRiIvPjxsaW5lIHgxPSI2IiB5MT0iMTIiIHgyPSI2IiB5Mj0iMTciIHN0cm9rZT0iIzNCODI2NiIgc3Ryb2tlLXdpZHRoPSIyIi8+PGxpbmUgeDE9IjE4IiB5MT0iMTIiIHgyPSIxOCIgeTI9IjE3IiBzdHJva2U9IiMzQjgyNjYiIHN0cm9rZS13aWR0aD0iMiIvPjxwYXRoIGQ9Ik0xMiA2aDR2MnYyaDJ2Nmg0djJoLTR2MmgtMnYtMmgtNHYtMmgtMnYtNHptMCAxMmgyVjE4SDh2MnYyaDR2Mmgydi0yem0wLTZINnY0aDJ2MmgydjJ2MmgtMnYtMmgtMnYtNHoiIHN0cm9rZT0iIzNCODI2NiIgc3Ryb2tlLXdpZHRoPSIyIi8+PC9zdmc+'
        });
      }
    }

    // 从localStorage加载数据
    function loadFromLocalStorage() {
      try {
        const savedExams = localStorage.getItem('examReminderExams');
        const savedTasks = localStorage.getItem('examReminderTasks');
        
        if (savedExams) {
          appState.exams = JSON.parse(savedExams);
        }
        
        if (savedTasks) {
          appState.tasks = JSON.parse(savedTasks);
        }
      } catch (error) {
        console.error('加载数据失败:', error);
      }
    }

    // 保存数据到localStorage
    function saveToLocalStorage() {
      try {
        localStorage.setItem('examReminderExams', JSON.stringify(appState.exams));
        localStorage.setItem('examReminderTasks', JSON.stringify(appState.tasks));
      } catch (error) {
        console.error('保存数据失败:', error);
      }
    }

    // 处理添加考试
    function handleAddExam(e) {
      e.preventDefault();
      
      const subject = document.getElementById('examSubject').value.trim();
      const date = new Date(document.getElementById('examDate').value).getTime();
      const priority = document.getElementById('examPriority').value;
      const reminderDays = parseInt(document.getElementById('reminderTime').value);
      
      // 表单验证
      if (!subject) {
        alert('请输入科目名称');
        return;
      }
      
      if (date <= Date.now()) {
        alert('考试日期必须在当前时间之后');
        return;
      }
      
      const newExam = {
        id: Date.now().toString(),
        subject,
        date,
        priority,
        reminderDays
      };
      
      appState.exams.push(newExam);
      saveToLocalStorage();
      updateExamsList();
      updateStatistics();
      updateTaskExamSelects();
      
      // 重置表单
      addExamForm.reset();
      
      // 提示成功

    // 格式化日期时间
    function formatDateTime(timestamp) {
      const date = new Date(timestamp);
      return date.toLocaleString('zh-CN', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    // 格式化日期
    function formatDate(timestamp) {
      const date = new Date(timestamp);
      return date.toLocaleDateString('zh-CN', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      });
    }

    // 计算倒计时
    function calculateCountdown(targetTime) {
      const now = Date.now();
      const difference = Math.max(0, targetTime - now);
      
      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);
      
      return { days, hours, minutes, seconds, isOver: difference <= 0 };
    }

    // 获取优先级样式类
    function getPriorityClass(priority) {
      switch (priority) {
        case 'high': return 'priority-high';
        case 'medium': return 'priority-medium';
        case 'low': return 'priority-low';
        default: return '';
      }
    }

    // 获取优先级文本
    function getPriorityText(priority) {
      switch (priority) {
        case 'high': return '高';
        case 'medium': return '中';
        case 'low': return '低';
        default: return '';
      }
    }

    // 获取优先级颜色
    function getPriorityColor(priority) {
      switch (priority) {
        case 'high': return 'bg-danger/20 text-danger';
        case 'medium': return 'bg-warning/20 text-warning';
        case 'low': return 'bg-secondary/20 text-secondary';
        default: return 'bg-gray-200 text-gray-600';
      }
    }

    // 更新统计信息
    function updateStatistics() {
      // 计算即将到来的考试数量（未来30天内）
      const now = Date.now();
      const thirtyDaysLater = now + (30 * 24 * 60 * 60 * 1000);
      const upcomingExams = appState.exams.filter(exam => exam.date > now && exam.date <= thirtyDaysLater);
      upcomingExamsCount.textContent = upcomingExams.length;
      
      // 计算今日待复习任务数量
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const tomorrow = new Date(today);
      tomorrow.setDate(tomorrow.getDate() + 1);
      
      const todayTasks = appState.tasks.filter(task => {
        const taskDate = new Date(task.date);
        taskDate.setHours(0, 0, 0, 0);
        return taskDate.getTime() === today.getTime() && !task.completed;
      });
      todayTasksCount.textContent = todayTasks.length;
      
      // 计算复习完成率
      const totalTasks = appState.tasks.length;
      const completedTasks = appState.tasks.filter(task => task.completed).length;
      const rate = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;
      completionRate.textContent = `${rate}%`;
      
      // 更新图表
      updateChart();
    }

    // 更新图表
    function updateChart() {
      if (!studyProgressChart) return;
      
      const labels = [];
      const completedData = [];
      const incompleteData = [];
      
      // 按日期排序考试
      const sortedExams = [...appState.exams].sort((a, b) => a.date - b.date);
      
      sortedExams.forEach(exam => {
        const examTasks = appState.tasks.filter(task => task.examId === exam.id);
        const completedCount = examTasks.filter(task => task.completed).length;
        const incompleteCount = examTasks.length - completedCount;
        
        // 只显示有任务的考试
        if (examTasks.length > 0) {
          labels.push(exam.subject);
          completedData.push(completedCount);
          incompleteData.push(incompleteCount);
        }
      });
      
      // 如果没有数据，显示默认提示
      if (labels.length === 0) {
        labels.push('暂无数据');
        completedData.push(0);
        incompleteData.push(0);
      }
      
      // 确保chart和datasets存在
      if (studyProgressChart.data && studyProgressChart.data.datasets && studyProgressChart.data.datasets.length >= 2) {
        studyProgressChart.data.labels = labels;
        studyProgressChart.data.datasets[0].data = completedData;
        studyProgressChart.data.datasets[1].data = incompleteData;
        studyProgressChart.update();
      }
    }

      setInterval(updateCountdowns, 1000);

      setInterval(checkReminders, 60000);
      
      // 立即检查一次提醒
      checkReminders();

    // 更新所有倒计时
    function updateCountdowns() {
      const examCards = examsList.querySelectorAll('[data-exam-id]');
      
      examCards.forEach(card => {
        const examId = card.dataset.examId;
        const exam = appState.exams.find(e => e.id === examId);
        
        if (exam) {
          const countdown = calculateCountdown(exam.date);
          
          // 更新倒计时显示
          const countdownItems = card.querySelectorAll('.countdown-item .text-xl.font-bold');
          if (countdownItems.length >= 4) {
            countdownItems[0].textContent = countdown.days;
            countdownItems[1].textContent = String(countdown.hours).padStart(2, '0');
            countdownItems[2].textContent = String(countdown.minutes).padStart(2, '0');
            countdownItems[3].textContent = String(countdown.seconds).padStart(2, '0');
          }
          
          // 更新警告状态
          const isUrgent = countdown.days <= 7;
          card.querySelectorAll('.countdown-item').forEach(item => {
            if (isUrgent) {
              item.classList.add('warning');
            } else {
              item.classList.remove('warning');
            }
          });
        }
      });
      
      // 更新任务过期状态
      const taskCards = tasksList.querySelectorAll('[data-id]');
      taskCards.forEach(card => {
        const taskId = card.querySelector('.task-checkbox').dataset.id;
        const task = appState.tasks.find(t => t.id === taskId);
        
        if (task) {
          const isOverdue = task.date < Date.now() && !task.completed;
          if (isOverdue) {
            card.classList.add('border-l-4', 'border-danger');
            // 确保有过期标记
            if (!card.querySelector('.text-danger')) {
              const dateElement = card.querySelector('.text-sm.text-gray-600');
              if (dateElement) {
                dateElement.innerHTML += '<span class="ml-2 text-xs px-1 py-0.5 rounded bg-danger/20 text-danger">已过期</span>';
              }
            }
          }
        }
      });
    }

    // 检查提醒
    function checkReminders() {
      const now = Date.now();
      
      // 检查考试提醒
      appState.exams.forEach(exam => {
        const reminderDate = exam.date - (exam.reminderDays * 24 * 60 * 60 * 1000);
        const oneHour = 60 * 60 * 1000;
        
        // 检查是否在提醒时间的一小时内
        if (reminderDate <= now && reminderDate > now - oneHour) {
          // 检查是否已经提醒过（使用localStorage记录已提醒的考试）
          const remindedExams = JSON.parse(localStorage.getItem('remindedExams') || '[]');
          if (!remindedExams.includes(exam.id)) {
            sendNotification(`考试提醒：${exam.subject}`, 
                            `${exam.subject} 考试将在 ${exam.reminderDays} 天后举行，别忘了复习！`);
            
            // 记录已提醒
            remindedExams.push(exam.id);
            localStorage.setItem('remindedExams', JSON.stringify(remindedExams));
          }
        }
      });
      
      // 检查今日任务提醒
      const today = new Date();
      today.setHours(9, 0, 0, 0); // 早上9点提醒
      const isNineAM = now >= today && now < today + (15 * 60 * 1000); // 9:00-9:15之间检查
      
      if (isNineAM) {
        // 检查是否已经提醒过今日任务
        const lastReminderDate = localStorage.getItem('lastTaskReminderDate');
        const todayString = new Date().toDateString();
        
        if (lastReminderDate !== todayString) {
          const todayTasks = appState.tasks.filter(task => {
            const taskDate = new Date(task.date);
            taskDate.setHours(0, 0, 0, 0);
            const todayStart = new Date();
            todayStart.setHours(0, 0, 0, 0);
            return taskDate.getTime() === todayStart.getTime() && !task.completed;
          });
          
          if (todayTasks.length > 0) {
            sendNotification(`今日复习任务提醒`, 
                           `您今天有 ${todayTasks.length} 个复习任务需要完成，请记得按时复习！`);
          }
          
          // 更新最后提醒日期
          localStorage.setItem('lastTaskReminderDate', todayString);
        }
      }
    }

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
