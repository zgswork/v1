<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Elegance - 苹果风格拼图游戏</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        header {
            text-align: center;
            padding: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .logo i {
            font-size: 36px;
            color: #0071e3;
            background: rgba(0, 113, 227, 0.1);
            padding: 15px;
            border-radius: 20px;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #86868b;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .game-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
        }

        .game-board {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            flex: 1;
            min-width: 300px;
            max-width: 600px;
            aspect-ratio: 1/1;
            display: flex;
            flex-wrap: wrap;
            position: relative;
        }

        .puzzle-piece {
            background-size: 100% 100%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: bold;
            position: relative;
        }

        .puzzle-piece:hover {
            transform: scale(1.02);
            z-index: 2;
        }

        .puzzle-piece.empty {
            background: #f5f5f7;
            border: 1px dashed #d2d2d7;
            cursor: default;
        }

        .control-panel {
            background: white;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            flex: 1;
            min-width: 300px;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .panel-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 10px;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .stat-card {
            background: #f5f5f7;
            border-radius: 18px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 2.2rem;
            font-weight: 700;
            color: #0071e3;
            margin: 5px 0;
        }

        .stat-label {
            font-size: 0.95rem;
            color: #86868b;
        }

        .btn {
            background: #0071e3;
            color: white;
            border: none;
            border-radius: 14px;
            padding: 16px 24px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover {
            background: #0077ed;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #0071e3;
            color: #0071e3;
        }

        .btn-outline:hover {
            background: rgba(0, 113, 227, 0.05);
        }

        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .difficulty-selector {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .difficulty-btn {
            flex: 1;
            min-width: 100px;
            padding: 14px;
            background: #f5f5f7;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .difficulty-btn.active {
            background: #0071e3;
            color: white;
        }

        .difficulty-btn:hover:not(.active) {
            background: #e6e6e9;
        }

        .image-upload {
            position: relative;
            overflow: hidden;
            border-radius: 14px;
            background: #f5f5f7;
            height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .image-upload:hover {
            background: #e6e6e9;
        }

        .image-upload i {
            font-size: 36px;
            color: #86868b;
        }

        .image-upload span {
            color: #86868b;
            font-weight: 500;
        }

        #file-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .preview-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 10;
            border-radius: 24px;
        }

        .game-over.show {
            opacity: 1;
            pointer-events: all;
        }

        .game-over h2 {
            font-size: 2.5rem;
            color: #1d1d1f;
        }

        .game-over p {
            font-size: 1.2rem;
            color: #86868b;
            margin-bottom: 20px;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #ffd700;
            opacity: 0;
        }

        @media (max-width: 768px) {
            .game-container {
                flex-direction: column;
                align-items: center;
            }
            
            .control-panel, .game-board {
                max-width: 100%;
                width: 100%;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-puzzle-piece"></i>
            </div>
            <h1>Puzzle Elegance</h1>
            <p class="subtitle">体验苹果风格的优雅拼图游戏，挑战你的思维与耐心。上传自定义图片或使用默认图片，选择难度级别开始游戏。</p>
        </header>
        
        <div class="game-container">
            <div class="game-board" id="game-board">
                <!-- 拼图碎片将通过JS动态生成 -->
                <div class="game-over" id="game-over">
                    <h2>恭喜完成!</h2>
                    <p>你成功完成了拼图</p>
                    <div class="stats">
                        <div class="stat-card">
                            <div class="stat-value" id="final-time">00:00</div>
                            <div class="stat-label">完成时间</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="final-moves">0</div>
                            <div class="stat-label">移动步数</div>
                        </div>
                    </div>
                    <button class="btn" id="play-again-btn">
                        <i class="fas fa-redo"></i> 再玩一次
                    </button>
                </div>
            </div>
            
            <div class="control-panel">
                <div>
                    <h2 class="panel-title">游戏状态</h2>
                    <div class="stats">
                        <div class="stat-card">
                            <div class="stat-value" id="timer">00:00</div>
                            <div class="stat-label">用时</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="move-count">0</div>
                            <div class="stat-label">移动步数</div>
                        </div>
                    </div>
                </div>
                
                <div>
                    <h2 class="panel-title">难度级别</h2>
                    <div class="difficulty-selector">
                        <button class="difficulty-btn active" data-difficulty="3">简单 (3×3)</button>
                        <button class="difficulty-btn" data-difficulty="4">中等 (4×4)</button>
                        <button class="difficulty-btn" data-difficulty="5">困难 (5×5)</button>
                    </div>
                </div>
                
                <div>
                    <h2 class="panel-title">选择图片</h2>
                    <div class="image-upload" id="image-upload">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <span>点击上传图片</span>
                        <img class="preview-image" id="preview-image" alt="预览图">
                        <input type="file" id="file-input" accept="image/*">
                    </div>
                </div>
                
                <div class="btn-group">
                    <button class="btn" id="start-btn">
                        <i class="fas fa-play"></i> 开始游戏
                    </button>
                    <button class="btn btn-outline" id="reset-btn">
                        <i class="fas fa-sync-alt"></i> 重置游戏
                    </button>
                    <button class="btn btn-outline" id="solve-btn">
                        <i class="fas fa-lightbulb"></i> 显示答案
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 游戏变量
            let gameBoard = document.getElementById('game-board');
            let timerDisplay = document.getElementById('timer');
            let moveCountDisplay = document.getElementById('move-count');
            let finalTimeDisplay = document.getElementById('final-time');
            let finalMovesDisplay = document.getElementById('final-moves');
            let gameOverScreen = document.getElementById('game-over');
            let startBtn = document.getElementById('start-btn');
            let resetBtn = document.getElementById('reset-btn');
            let solveBtn = document.getElementById('solve-btn');
            let playAgainBtn = document.getElementById('play-again-btn');
            let fileInput = document.getElementById('file-input');
            let previewImage = document.getElementById('preview-image');
            let difficultyButtons = document.querySelectorAll('.difficulty-btn');
            
            let gameStarted = false;
            let timerInterval;
            let seconds = 0;
            let moveCount = 0;
            let difficulty = 3; // 默认3x3
            let emptyIndex;
            let pieces = [];
            let imageUrl = 'https://images.unsplash.com/photo-1501854140801-50d01698950b?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1200&q=80';
            
            // 初始化游戏
            function initGame() {
                // 清除现有拼图
                gameBoard.innerHTML = '';
                gameBoard.appendChild(gameOverScreen);
                
                // 创建拼图碎片
                createPuzzlePieces();
                
                // 打乱拼图
                shufflePuzzle();
                
                // 重置游戏状态
                resetGameState();
                
                // 开始游戏
                gameStarted = true;
                startTimer();
            }
            
            // 创建拼图碎片
            function createPuzzlePieces() {
                const boardSize = gameBoard.clientWidth;
                const pieceSize = boardSize / difficulty;
                
                gameBoard.style.display = 'grid';
                gameBoard.style.gridTemplateColumns = `repeat(${difficulty}, 1fr)`;
                
                // 创建碎片
                for (let i = 0; i < difficulty * difficulty; i++) {
                    const piece = document.createElement('div');
                    piece.className = 'puzzle-piece';
                    piece.dataset.index = i;
                    
                    // 设置碎片位置
                    const row = Math.floor(i / difficulty);
                    const col = i % difficulty;
                    
                    if (i === difficulty * difficulty - 1) {
                        piece.classList.add('empty');
                        piece.innerHTML = '';
                        emptyIndex = i;
                    } else {
                        piece.style.backgroundImage = `url(${imageUrl})`;
                        piece.style.backgroundSize = `${boardSize}px ${boardSize}px`;
                        piece.style.backgroundPosition = `-${col * pieceSize}px -${row * pieceSize}px`;
                        piece.innerHTML = i + 1;
                    }
                    
                    piece.addEventListener('click', () => movePiece(i));
                    gameBoard.appendChild(piece);
                    pieces.push(piece);
                }
            }
            
            // 打乱拼图
            function shufflePuzzle() {
                // 简单打乱算法 - 在实际应用中应使用更复杂的打乱算法
                for (let i = 0; i < 1000; i++) {
                    const movablePieces = getMovablePieces();
                    const randomIndex = Math.floor(Math.random() * movablePieces.length);
                    movePiece(movablePieces[randomIndex]);
                }
                
                // 重置移动计数
                moveCount = 0;
                moveCountDisplay.textContent = moveCount;
            }
            
            // 获取可移动的碎片
            function getMovablePieces() {
                const movable = [];
                const emptyRow = Math.floor(emptyIndex / difficulty);
                const emptyCol = emptyIndex % difficulty;
                
                // 检查上方
                if (emptyRow > 0) {
                    movable.push(emptyIndex - difficulty);
                }
                
                // 检查下方
                if (emptyRow < difficulty - 1) {
                    movable.push(emptyIndex + difficulty);
                }
                
                // 检查左侧
                if (emptyCol > 0) {
                    movable.push(emptyIndex - 1);
                }
                
                // 检查右侧
                if (emptyCol < difficulty - 1) {
                    movable.push(emptyIndex + 1);
                }
                
                return movable;
            }
            
            // 移动碎片
            function movePiece(index) {
                if (!gameStarted) return;
                
                const emptyRow = Math.floor(emptyIndex / difficulty);
                const emptyCol = emptyIndex % difficulty;
                const pieceRow = Math.floor(index / difficulty);
                const pieceCol = index % difficulty;
                
                // 检查是否相邻
                const isAdjacent = 
                    (Math.abs(emptyRow - pieceRow) === 1 && emptyCol === pieceCol) ||
                    (Math.abs(emptyCol - pieceCol) === 1 && emptyRow === pieceRow);
                
                if (isAdjacent) {
                    // 交换位置
                    pieces[emptyIndex].style.backgroundImage = pieces[index].style.backgroundImage;
                    pieces[emptyIndex].style.backgroundPosition = pieces[index].style.backgroundPosition;
                    pieces[emptyIndex].innerHTML = pieces[index].innerHTML;
                    pieces[emptyIndex].classList.remove('empty');
                    
                    pieces[index].style.backgroundImage = '';
                    pieces[index].style.backgroundPosition = '';
                    pieces[index].innerHTML = '';
                    pieces[index].classList.add('empty');
                    
                    // 更新索引
                    emptyIndex = index;
                    
                    // 更新移动计数
                    moveCount++;
                    moveCountDisplay.textContent = moveCount;
                    
                    // 检查是否完成
                    checkCompletion();
                }
            }
            
            // 检查是否完成
            function checkCompletion() {
                let solved = true;
                
                for (let i = 0; i < pieces.length; i++) {
                    if (i === emptyIndex) continue;
                    
                    const currentText = pieces[i].innerHTML;
                    const expectedText = (i + 1).toString();
                    
                    if (currentText !== expectedText) {
                        solved = false;
                        break;
                    }
                }
                
                if (solved) {
                    endGame();
                }
            }
            
            // 结束游戏
            function endGame() {
                clearInterval(timerInterval);
                gameStarted = false;
                
                // 更新最终统计
                finalTimeDisplay.textContent = timerDisplay.textContent;
                finalMovesDisplay.textContent = moveCount;
                
                // 显示游戏结束画面
                gameOverScreen.classList.add('show');
                
                // 添加庆祝效果
                createConfetti();
            }
            
            // 创建庆祝彩花
            function createConfetti() {
                for (let i = 0; i < 150; i++) {
                    setTimeout(() => {
                        const confetti = document.createElement('div');
                        confetti.className = 'confetti';
                        confetti.style.left = `${Math.random() * 100}%`;
                        confetti.style.top = `${Math.random() * 100}%`;
                        confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 70%, 60%)`;
                        confetti.style.transform = `scale(${Math.random() * 0.8 + 0.2})`;
                        confetti.style.opacity = '1';
                        gameOverScreen.appendChild(confetti);
                        
                        // 移除彩花
                        setTimeout(() => {
                            confetti.style.opacity = '0';
                            confetti.style.transform = 'translateY(100px) rotate(360deg)';
                            setTimeout(() => {
                                gameOverScreen.removeChild(confetti);
                            }, 1000);
                        }, 1000);
                    }, i * 20);
                }
            }
            
            // 重置游戏状态
            function resetGameState() {
                clearInterval(timerInterval);
                seconds = 0;
                moveCount = 0;
                timerDisplay.textContent = '00:00';
                moveCountDisplay.textContent = '0';
                gameOverScreen.classList.remove('show');
            }
            
            // 开始计时器
            function startTimer() {
                clearInterval(timerInterval);
                seconds = 0;
                updateTimer();
                
                timerInterval = setInterval(() => {
                    seconds++;
                    updateTimer();
                }, 1000);
            }
            
            // 更新计时器显示
            function updateTimer() {
                const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                const secs = (seconds % 60).toString().padStart(2, '0');
                timerDisplay.textContent = `${mins}:${secs}`;
            }
            
            // 事件监听器
            startBtn.addEventListener('click', initGame);
            
            resetBtn.addEventListener('click', () => {
                resetGameState();
                shufflePuzzle();
                startTimer();
            });
            
            solveBtn.addEventListener('click', () => {
                // 在实际应用中应实现求解算法
                alert('求解功能将在完整版本中提供');
            });
            
            playAgainBtn.addEventListener('click', () => {
                resetGameState();
                shufflePuzzle();
                startTimer();
                gameStarted = true;
            });
            
            // 难度选择
            difficultyButtons.forEach(button => {
                button.addEventListener('click', () => {
                    difficultyButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    difficulty = parseInt(button.dataset.difficulty);
                    resetGameState();
                    initGame();
                });
            });
            
            // 图片上传
            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        imageUrl = event.target.result;
                        previewImage.src = imageUrl;
                        previewImage.style.display = 'block';
                        
                        // 如果游戏已经开始，更新拼图
                        if (gameStarted) {
                            initGame();
                        }
                    };
                    reader.readAsDataURL(file);
                }
            });
            
            // 初始化默认游戏
            initGame();
        });
    </script>
</body>
</html>
