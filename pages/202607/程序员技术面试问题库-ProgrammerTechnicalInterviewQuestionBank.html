<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>程序员技术面试问题库</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #2c3e50);
            color: #f5f5f5;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 30px 0;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00c9ff, #92fe9d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 700px;
            margin: 0 auto;
        }
        
        .search-container {
            display: flex;
            max-width: 800px;
            margin: 30px auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            border-radius: 50px;
            overflow: hidden;
        }
        
        #search-input {
            flex: 1;
            padding: 18px 25px;
            border: none;
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            backdrop-filter: blur(10px);
        }
        
        #search-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        
        #search-btn {
            padding: 0 30px;
            background: linear-gradient(90deg, #00c9ff, #92fe9d);
            border: none;
            color: #1a2a6c;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        
        #search-btn:hover {
            background: linear-gradient(90deg, #00a6ff, #7dff8d);
            transform: scale(1.02);
        }
        
        .categories {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
        }
        
        .category-btn {
            padding: 12px 25px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        
        .category-btn:hover, .category-btn.active {
            background: rgba(0, 201, 255, 0.3);
            border-color: #00c9ff;
            transform: translateY(-3px);
        }
        
        .questions-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }
        
        .question-card {
            background: rgba(30, 40, 80, 0.7);
            border-radius: 15px;
            padding: 25px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            position: relative;
        }
        
        .question-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            background: rgba(40, 50, 100, 0.8);
        }
        
        .question-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: linear-gradient(to bottom, #00c9ff, #92fe9d);
        }
        
        .question-card h3 {
            font-size: 1.4rem;
            margin-bottom: 15px;
            color: #00c9ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .question-card h3 i {
            color: #92fe9d;
        }
        
        .answer {
            margin-top: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            font-size: 0.95rem;
            line-height: 1.7;
            border-left: 3px solid #92fe9d;
        }
        
        .difficulty {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-top: 15px;
        }
        
        .easy {
            background: rgba(146, 254, 157, 0.2);
            color: #92fe9d;
        }
        
        .medium {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }
        
        .hard {
            background: rgba(255, 87, 87, 0.2);
            color: #ff5757;
        }
        
        .category-tag {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            background: rgba(0, 201, 255, 0.2);
            color: #00c9ff;
        }
        
        footer {
            text-align: center;
            padding: 30px 0;
            margin-top: 50px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .questions-container {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .categories {
                gap: 10px;
            }
            
            .category-btn {
                padding: 10px 15px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-laptop-code"></i> 程序员技术面试问题库</h1>
            <p class="subtitle">精心整理的常见面试问题集锦，涵盖数据结构、算法、系统设计、编程语言等多个技术领域，助您轻松备战技术面试</p>
        </header>
        
        <div class="search-container">
            <input type="text" id="search-input" placeholder="搜索面试问题，例如：'二叉树'、'多线程'、'RESTful'...">
            <button id="search-btn"><i class="fas fa-search"></i> 搜索</button>
        </div>
        
        <div class="categories">
            <button class="category-btn active">全部</button>
            <button class="category-btn">数据结构</button>
            <button class="category-btn">算法</button>
            <button class="category-btn">系统设计</button>
            <button class="category-btn">数据库</button>
            <button class="category-btn">网络</button>
            <button class="category-btn">操作系统</button>
            <button class="category-btn">面向对象</button>
        </div>
        
        <div class="questions-container">
            <!-- 问题卡片将通过JavaScript动态生成 -->
        </div>
        
        <footer>
            <p>© 2023 程序员技术面试问题库 | 持续更新中</p>
        </footer>
    </div>
    
    <script>
        // 面试问题数据
        const questions = [
            {
                id: 1,
                title: "数组和链表有什么区别？",
                answer: "数组在内存中连续存储，支持随机访问，但插入和删除操作效率较低（O(n)）。链表通过指针连接元素，内存不连续，插入和删除效率高（O(1)），但访问元素需要遍历（O(n)）。",
                category: "数据结构",
                difficulty: "easy"
            },
            {
                id: 2,
                title: "解释快速排序算法及其时间复杂度",
                answer: "快速排序使用分治策略：1) 选择基准元素；2) 分区：小于基准的移到左边，大于基准的移到右边；3) 递归排序左右分区。平均时间复杂度为O(n log n)，最坏情况O(n²)（当数组已排序时）。空间复杂度O(log n)。",
                category: "算法",
                difficulty: "medium"
            },
            {
                id: 3,
                title: "什么是RESTful API设计原则？",
                answer: "RESTful API设计原则：1) 客户端-服务器分离；2) 无状态：每个请求包含完整信息；3) 可缓存；4) 统一接口；5) 分层系统；6) 按需代码（可选）。使用HTTP方法：GET(获取)、POST(创建)、PUT(更新)、DELETE(删除)。",
                category: "系统设计",
                difficulty: "medium"
            },
            {
                id: 4,
                title: "数据库索引如何工作？",
                answer: "数据库索引是一种数据结构（通常是B+树），用于快速查找数据。它类似于书籍的目录，存储列值和对应行的物理位置。优点：加快查询速度；缺点：占用额外存储空间，降低写入速度（需要维护索引）。",
                category: "数据库",
                difficulty: "medium"
            },
            {
                id: 5,
                title: "TCP和UDP的主要区别是什么？",
                answer: "TCP：面向连接、可靠传输（确认和重传）、保证顺序、流量控制、拥塞控制，适用于文件传输、网页浏览等。UDP：无连接、不可靠传输、不保证顺序、无流量控制，速度快，适用于视频流、在线游戏等实时应用。",
                category: "网络",
                difficulty: "easy"
            },
            {
                id: 6,
                title: "进程和线程的区别？",
                answer: "进程是操作系统资源分配的基本单位，有独立的内存空间。线程是CPU调度的基本单位，属于同一进程的线程共享内存空间。多线程比多进程更轻量，上下文切换开销小，但需要处理同步问题。",
                category: "操作系统",
                difficulty: "easy"
            },
            {
                id: 7,
                title: "解释面向对象编程的四大特性",
                answer: "1) 封装：隐藏内部实现，通过接口访问；2) 继承：子类继承父类的属性和方法；3) 多态：同一操作作用于不同对象产生不同行为；4) 抽象：提取共同特征形成类或接口。",
                category: "面向对象",
                difficulty: "easy"
            },
            {
                id: 8,
                title: "如何设计一个短网址服务？",
                answer: "1) 生成短码：使用哈希算法（如MD5）或自增ID转62进制；2) 存储映射：数据库存储原始URL和短码；3) 重定向：服务端收到短码请求后查询原始URL并返回302重定向；4) 考虑：防止重复、过期机制、统计访问量、分布式ID生成等。",
                category: "系统设计",
                difficulty: "hard"
            },
            {
                id: 9,
                title: "什么是死锁？如何预防死锁？",
                answer: "死锁指多个进程因竞争资源而相互等待的现象。必要条件：互斥、持有并等待、非抢占、循环等待。预防方法：1) 破坏循环等待（资源有序分配）；2) 破坏持有并等待（一次性申请所有资源）；3) 允许资源抢占；4) 破坏互斥（使用共享资源）。",
                category: "操作系统",
                difficulty: "medium"
            },
            {
                id: 10,
                title: "解释HTTP和HTTPS的区别",
                answer: "HTTP是超文本传输协议，数据明文传输，默认端口80。HTTPS是HTTP的安全版，通过SSL/TLS加密传输数据，默认端口443。HTTPS提供：1) 数据加密；2) 身份验证（CA证书）；3) 数据完整性保护。",
                category: "网络",
                difficulty: "easy"
            },
            {
                id: 11,
                title: "什么是数据库事务的ACID特性？",
                answer: "ACID指：1) 原子性(Atomicity)：事务要么全部完成，要么全部不完成；2) 一致性(Consistency)：事务使数据库从一个有效状态变为另一个有效状态；3) 隔离性(Isolation)：并发事务互不干扰；4) 持久性(Durability)：事务提交后结果永久保存。",
                category: "数据库",
                difficulty: "medium"
            },
            {
                id: 12,
                title: "解释二叉树的前序、中序和后序遍历",
                answer: "前序遍历：根节点 → 左子树 → 右子树；中序遍历：左子树 → 根节点 → 右子树；后序遍历：左子树 → 右子树 → 根节点。递归实现简单，非递归实现需使用栈。",
                category: "数据结构",
                difficulty: "medium"
            }
        ];

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            renderQuestions(questions);
            
            // 搜索功能
            document.getElementById('search-btn').addEventListener('click', searchQuestions);
            document.getElementById('search-input').addEventListener('keyup', function(e) {
                if (e.key === 'Enter') {
                    searchQuestions();
                }
            });
            
            // 分类筛选
            document.querySelectorAll('.category-btn').forEach(button => {
                button.addEventListener('click', function() {
                    document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                    
                    const category = this.textContent;
                    if (category === '全部') {
                        renderQuestions(questions);
                    } else {
                        const filtered = questions.filter(q => q.category === category);
                        renderQuestions(filtered);
                    }
                });
            });
        });

        // 渲染问题列表
        function renderQuestions(questionsArray) {
            const container = document.querySelector('.questions-container');
            container.innerHTML = '';
            
            if (questionsArray.length === 0) {
                container.innerHTML = '<div class="no-results">未找到相关问题</div>';
                return;
            }
            
            questionsArray.forEach(q => {
                const card = document.createElement('div');
                card.className = 'question-card';
                
                // 难度颜色
                let difficultyClass = '';
                if (q.difficulty === 'easy') difficultyClass = 'easy';
                else if (q.difficulty === 'medium') difficultyClass = 'medium';
                else if (q.difficulty === 'hard') difficultyClass = 'hard';
                
                card.innerHTML = `
                    <h3><i class="fas fa-question-circle"></i> ${q.title}</h3>
                    <div class="answer">${q.answer}</div>
                    <div class="difficulty ${difficultyClass}">${q.difficulty === 'easy' ? '简单' : q.difficulty === 'medium' ? '中等' : '困难'}</div>
                    <div class="category-tag">${q.category}</div>
                `;
                
                container.appendChild(card);
            });
        }
        
        // 搜索问题
        function searchQuestions() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase().trim();
            
            if (searchTerm === '') {
                renderQuestions(questions);
                return;
            }
            
            const filtered = questions.filter(q => 
                q.title.toLowerCase().includes(searchTerm) || 
                q.answer.toLowerCase().includes(searchTerm) ||
                q.category.toLowerCase().includes(searchTerm)
            );
            
            renderQuestions(filtered);
        }
    </script>
</body>
</html>
