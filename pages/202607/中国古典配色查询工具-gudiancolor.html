<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国古典配色查询工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#8C2318', // 中国红作为主色调
                        secondary: '#D4AF37', // 金色作为辅助色
                    },
                    fontFamily: {
                        song: ['SimSun', 'serif'],
                        kai: ['KaiTi', 'STKaiti', 'serif']
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .color-card-shadow {
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
                transition: all 0.3s ease;
            }
            .color-card-shadow:hover {
                transform: translateY(-5px);
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            }
            .scrollbar-hide::-webkit-scrollbar {
                display: none;
            }
            .scrollbar-hide {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
        }
    </style>
</head>
<body class="bg-gray-50 font-song text-gray-800 min-h-screen flex flex-col">
    <!-- 页面头部 -->
    <header class="bg-primary text-white shadow-md">
        <div class="container mx-auto px-4 py-6">
            <h1 class="text-[clamp(1.8rem,5vw,3rem)] font-kai font-bold text-center">中国古典配色查询</h1>
            <p class="text-center mt-2 text-sm md:text-base opacity-90">探索传统色彩的魅力与文化底蕴</p>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="flex-grow container mx-auto px-4 py-8">
        <!-- 搜索和分类区域 -->
        <section class="mb-10">
            <div class="flex flex-col md:flex-row gap-4">
                <div class="relative flex-grow">
                    <input
                        type="text"
                        id="color-search"
                        placeholder="搜索颜色名称..."
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-secondary/50 focus:border-secondary"
                    >
                    <i class="fa fa-search absolute right-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                </div>
                <div class="flex flex-wrap gap-2">
                    <button class="category-btn px-4 py-2 rounded-lg bg-secondary text-white hover:bg-secondary/90 transition-colors" data-category="all">全部</button>
                    <button class="category-btn px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 transition-colors" data-category="red">红色系</button>
                    <button class="category-btn px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 transition-colors" data-category="yellow">黄色系</button>
                    <button class="category-btn px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 transition-colors" data-category="blue">蓝色系</button>
                    <button class="category-btn px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 transition-colors" data-category="green">绿色系</button>
                    <button class="category-btn px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 transition-colors" data-category="purple">紫色系</button>
                    <button class="category-btn px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 transition-colors" data-category="brown">棕色系</button>
                </div>
            </div>
        </section>

        <!-- 颜色展示区域 -->
        <section class="mb-12">
            <h2 class="text-xl font-bold mb-6 pb-2 border-b border-gray-200 flex items-center">
                <i class="fa fa-paint-brush text-secondary mr-2"></i>古典颜色库
            </h2>
            <div id="color-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
                <!-- 颜色卡片将通过JavaScript动态生成 -->
            </div>
        </section>

        <!-- 配色方案推荐 -->
        <section>
            <h2 class="text-xl font-bold mb-6 pb-2 border-b border-gray-200 flex items-center">
                <i class="fa fa-th-large text-secondary mr-2"></i>经典配色方案
            </h2>
            <div id="color-schemes" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- 配色方案将通过JavaScript动态生成 -->
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer class="bg-gray-800 text-white py-6 mt-12">
        <div class="container mx-auto px-4 text-center text-sm">
            <p>中国古典配色查询工具 &copy; 2023 | 传承传统文化，探索色彩之美</p>
        </div>
    </footer>

    <!-- 复制成功提示 -->
    <div id="copy-toast" class="fixed bottom-6 right-6 bg-green-500 text-white px-4 py-2 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 flex items-center">
        <i class="fa fa-check-circle mr-2"></i>
        <span>色值已复制到剪贴板</span>
    </div>

    <script>
        // 中国古典颜色数据
        const chineseColors = [
            { name: "中国红", hex: "#8C2318", rgb: "140, 35, 24", category: "red", description: "象征喜庆、吉祥、热情，是中国传统文化中最重要的颜色" },
            { name: "朱砂红", hex: "#C93756", rgb: "201, 55, 86", category: "red", description: "传统矿物颜料，常用于宫殿建筑和书画" },
            { name: "胭脂红", hex: "#D94E5D", rgb: "217, 78, 93", category: "red", description: "源自胭脂花的颜色，古代女性常用的化妆品颜色" },
            { name: "妃色", hex: "#DE5D83", rgb: "222, 93, 131", category: "red", description: "古代贵族女性服饰常用色，淡雅的粉红色" },
            { name: "石榴红", hex: "#E25822", rgb: "226, 88, 34", category: "red", description: "如成熟石榴般的颜色，鲜艳而富有活力" },
            { name: "明黄", hex: "#FFD700", rgb: "255, 215, 0", category: "yellow", description: "古代皇家专用色，象征权力与尊贵" },
            { name: "赭石黄", hex: "#C19A6B", rgb: "193, 154, 107", category: "yellow", description: "传统矿物颜料，呈现温暖的土黄色调" },
            { name: "蜜合色", hex: "#F9E076", rgb: "249, 224, 118", category: "yellow", description: "如蜂蜜般温暖的淡黄色，常用于古代女性服饰" },
            { name: "秋香色", hex: "#D4B996", rgb: "212, 185, 150", category: "yellow", description: "秋天草木的颜色，温暖而沉稳" },
            { name: "石黄", hex: "#F0C674", rgb: "240, 198, 116", category: "yellow", description: "传统矿物颜料，常用于敦煌壁画" },
            { name: "天青", hex: "#4A6FA5", rgb: "74, 111, 165", category: "blue", description: "雨后天空的颜色，宋代汝窑瓷器的代表色" },
            { name: "月白", hex: "#E0E7FF", rgb: "224, 231, 255", category: "blue", description: "如月光般的淡蓝色，清雅脱俗" },
            { name: "靛蓝", hex: "#1A5276", rgb: "26, 82, 118", category: "blue", description: "传统染织品常用色，深邃而沉稳" },
            { name: "宝蓝", hex: "#003366", rgb: "0, 51, 102", category: "blue", description: "如宝石般的深蓝色，象征高贵与吉祥" },
            { name: "湖蓝", hex: "#5DADEC", rgb: "93, 173, 236", category: "blue", description: "如湖水般清澈的蓝色，明亮而宁静" },
            { name: "翡翠绿", hex: "#00A86B", rgb: "0, 168, 107", category: "green", description: "如翡翠般的绿色，象征生命与吉祥" },
            { name: "松绿", hex: "#3A5F0B", rgb: "58, 95, 11", category: "green", description: "松树的颜色，深沉而富有生命力" },
            { name: "柳绿", hex: "#7CCD7C", rgb: "124, 205, 124", category: "green", description: "春天柳叶的颜色，清新淡雅" },
            { name: "豆绿", hex: "#B7CE63", rgb: "183, 206, 99", category: "green", description: "如青豆般的淡绿色，柔和而自然" },
            { name: "葱绿", hex: "#98FB98", rgb: "152, 251, 152", category: "green", description: "如青葱般的翠绿色，鲜嫩而富有生机" },
            { name: "紫罗兰", hex: "#9966CC", rgb: "153, 102, 204", category: "purple", description: "如紫罗兰花般的颜色，神秘而优雅" },
            { name: "雪青", hex: "#9370DB", rgb: "147, 112, 219", category: "purple", description: "如雪后初晴的青紫色，清冷而高贵" },
            { name: "墨紫", hex: "#4A2545", rgb: "74, 37, 69", category: "purple", description: "深紫色，如墨般沉稳，常用于古代官员服饰" },
            { name: "青莲", hex: "#9013FE", rgb: "144, 19, 254", category: "purple", description: "如莲花般的紫色，清雅而高洁" },
            { name: "紫檀", hex: "#552583", rgb: "85, 37, 131", category: "purple", description: "紫檀木的颜色，深沉而华贵" },
            { name: "赭石棕", hex: "#8B4513", rgb: "139, 69, 19", category: "brown", description: "传统矿物颜料，呈现自然的棕色调" },
            { name: "茶色", hex: "#80461B", rgb: "128, 70, 27", category: "brown", description: "如茶水般的颜色，温暖而沉稳" },
            { name: "沉香色", hex: "#6B4423", rgb: "107, 68, 35", category: "brown", description: "如沉香木的颜色，深沉而典雅" },
            { name: "琥珀棕", hex: "#DAA520", rgb: "218, 165, 32", category: "brown", description: "如琥珀般的棕黄色，温润而富有光泽" },
            { name: "乌木黑", hex: "#2D2926", rgb: "45, 41, 38", category: "brown", description: "如乌木般的深黑色，沉稳而庄重" },
            { name: "玉色", hex: "#E8F4F8", rgb: "232, 244, 248", category: "other", description: "如白玉般温润的颜色，纯洁而高雅" },
            { name: "象牙白", hex: "#FFFFF0", rgb: "255, 255, 240", category: "other", description: "如象牙般的乳白色，温暖而柔和" },
            { name: "银灰", hex: "#C0C0C0", rgb: "192, 192, 192", category: "other", description: "如银器般的灰色，高贵而典雅" },
            { name: "石青", hex: "#34495E", rgb: "52, 73, 94", category: "blue", description: "传统矿物颜料，常用于古代官服" },
            { name: "石绿", hex: "#1ABC9C", rgb: "26, 188, 156", category: "green", description: "传统矿物颜料，常用于壁画和服饰" }
        ];

        // 经典配色方案
        const colorSchemes = [
            {
                name: "皇家富贵",
                description: "传统皇家宫殿配色，象征权力与尊贵",
                colors: ["#8C2318", "#FFD700", "#4A6FA5", "#C0C0C0"]
            },
            {
                name: "水墨丹青",
                description: "传统书画配色，体现文人雅士的审美情趣",
                colors: ["#2D2926", "#4A6FA5", "#1ABC9C", "#FFFFF0"]
            },
            {
                name: "敦煌飞天",
                description: "源自敦煌壁画的经典配色，绚丽而神秘",
                colors: ["#DE5D83", "#F0C674", "#1A5276", "#8B4513"]
            },
            {
                name: "江南烟雨",
                description: "江南水乡的淡雅配色，清新脱俗",
                colors: ["#E0E7FF", "#7CCD7C", "#D4B996", "#6B4423"]
            },
            {
                name: "岁朝清供",
                description: "传统年节装饰配色，喜庆而典雅",
                colors: ["#C93756", "#FFD700", "#00A86B", "#9370DB"]
            },
            {
                name: "青花瓷",
                description: "源自青花瓷器的经典蓝白配色",
                colors: ["#1A5276", "#E8F4F8", "#34495E", "#FFFFF0"]
            }
        ];

        // DOM元素引用
        const colorGrid = document.getElementById('color-grid');
        const colorSchemesContainer = document.getElementById('color-schemes');
        const colorSearch = document.getElementById('color-search');
        const categoryButtons = document.querySelectorAll('.category-btn');
        const copyToast = document.getElementById('copy-toast');

        // 初始化颜色卡片
        function initColorCards(colors = chineseColors) {
            colorGrid.innerHTML = '';
            colors.forEach(color => {
                const colorCard = document.createElement('div');
                colorCard.className = 'bg-white rounded-xl shadow-md overflow-hidden color-card-shadow transition-all duration-300 group';
                colorCard.dataset.category = color.category;
                colorCard.dataset.name = color.name.toLowerCase();

                colorCard.innerHTML = `
                    <div class="h-40 w-full" style="background-color: ${color.hex}"></div>
                    <div class="p-4">
                        <h3 class="text-lg font-bold mb-1 group-hover:text-primary transition-colors">${color.name}</h3>
                        <div class="flex items-center text-sm text-gray-600 mb-2">
                            <span class="mr-3">${color.hex}</span>
                            <span>${color.rgb}</span>
                        </div>
                        <p class="text-xs text-gray-500 line-clamp-2 mb-3">${color.description}</p>
                        <button class="copy-btn w-full py-1.5 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm transition-colors flex items-center justify-center gap-1"
                                data-hex="${color.hex}" data-rgb="${color.rgb}">
                            <i class="fa fa-copy"></i>
                            <span>复制色值</span>
                        </button>
                    </div>
                `;

                colorGrid.appendChild(colorCard);
            });

            // 添加复制按钮事件
            document.querySelectorAll('.copy-btn').forEach(btn => {
                btn.addEventListener('click', handleCopyColor);
            });
        }

        // 初始化配色方案
        function initColorSchemes() {
            colorSchemesContainer.innerHTML = '';
            colorSchemes.forEach(scheme => {
                const schemeCard = document.createElement('div');
                schemeCard.className = 'bg-white rounded-xl shadow-md overflow-hidden p-5';

                // 生成配色方案的颜色条
                const colorBars = scheme.colors.map(color => `
                    <div class="h-16 w-full" style="background-color: ${color}" title="${getColorNameByHex(color)}"></div>
                `).join('');

                schemeCard.innerHTML = `
                    <h3 class="text-xl font-bold mb-3 text-primary">${scheme.name}</h3>
                    <p class="text-gray-600 mb-4">${scheme.description}</p>
                    <div class="flex gap-2 mb-4">
                        ${colorBars}
                    </div>
                    <div class="flex flex-wrap gap-2 mt-2">
                        ${scheme.colors.map(color => `
                            <span class="inline-block px-3 py-1 bg-gray-100 rounded-full text-xs"
                                  data-hex="${color}">${color}</span>
                        `).join('')}
                    </div>
                `;

                colorSchemesContainer.appendChild(schemeCard);
            });

            // 为配色方案中的色值添加复制功能
            document.querySelectorAll('[data-hex]').forEach(el => {
                if (!el.classList.contains('copy-btn')) {
                    el.addEventListener('click', handleCopyColor);
                }
            });
        }

        // 根据色值获取颜色名称
        function getColorNameByHex(hex) {
            const color = chineseColors.find(c => c.hex.toUpperCase() === hex.toUpperCase());
            return color ? color.name : '未知颜色';
        }

        // 处理颜色复制
        function handleCopyColor(e) {
            const hexValue = this.dataset.hex;
            navigator.clipboard.writeText(hexValue).then(() => {
                showToast();
            }).catch(err => {
                console.error('无法复制文本: ', err);
                // 降级处理：创建临时输入框
                const tempInput = document.createElement('input');
                tempInput.value = hexValue;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);
                showToast();
            });
        }

        // 显示复制成功提示
        function showToast() {
            copyToast.classList.remove('translate-y-20', 'opacity-0');
            copyToast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                copyToast.classList.remove('translate-y-0', 'opacity-100');
                copyToast.classList.add('translate-y-20', 'opacity-0');
            }, 2000);
        }

        // 过滤颜色
        function filterColors() {
            const searchTerm = colorSearch.value.toLowerCase().trim();
            const activeCategory = document.querySelector('.category-btn.bg-secondary')?.dataset.category || 'all';

            const filteredColors = chineseColors.filter(color => {
                const matchesSearch = color.name.toLowerCase().includes(searchTerm) ||
                                      color.description.toLowerCase().includes(searchTerm);
                const matchesCategory = activeCategory === 'all' || color.category === activeCategory;
                return matchesSearch && matchesCategory;
            });

            initColorCards(filteredColors);

            // 如果没有找到结果
            if (filteredColors.length === 0) {
                colorGrid.innerHTML = `
                    <div class="col-span-full py-16 text-center">
                        <i class="fa fa-search text-gray-300 text-5xl mb-4"></i>
                        <p class="text-gray-500">没有找到匹配的颜色</p>
                        <button id="reset-search" class="mt-4 px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary/90 transition-colors">
                            重置搜索
                        </button>
                    </div>
                `;
                document.getElementById('reset-search').addEventListener('click', () => {
                    colorSearch.value = '';
                    categoryButtons.forEach(btn => btn.classList.remove('bg-secondary', 'text-white'));
                    categoryButtons.forEach(btn => btn.classList.add('bg-gray-200'));
                    document.querySelector('[data-category="all"]').classList.add('bg-secondary', 'text-white');
                    document.querySelector('[data-category="all"]').classList.remove('bg-gray-200');
                    initColorCards();
                });
            }
        }

        // 事件监听
        colorSearch.addEventListener('input', filterColors);

        categoryButtons.forEach(button => {
            button.addEventListener('click', () => {
                // 更新按钮样式
                categoryButtons.forEach(btn => btn.classList.remove('bg-secondary', 'text-white'));
                categoryButtons.forEach(btn => btn.classList.add('bg-gray-200'));
                button.classList.add('bg-secondary', 'text-white');
                button.classList.remove('bg-gray-200');

                filterColors();
            });
        });

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            initColorCards();
            initColorSchemes();
        });
    </script>
