<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时区转换器 | Time Zone Converter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
            color: #333;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            margin: 20px;
        }
        
        header {
            background: linear-gradient(to right, #1a2a6c, #3a7bd5);
            color: white;
            padding: 25px 30px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            font-weight: 700;
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            font-weight: 300;
        }
        
        .converter-container {
            display: flex;
            flex-wrap: wrap;
            padding: 30px;
        }
        
        .input-section {
            flex: 1;
            min-width: 300px;
            padding: 20px;
            border-right: 1px solid #eee;
        }
        
        .result-section {
            flex: 1;
            min-width: 300px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .section-title {
            font-size: 1.4rem;
            color: #1a2a6c;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #3a7bd5;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
        }
        
        input, select {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            background: #f8f9fa;
            transition: all 0.3s ease;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #3a7bd5;
            box-shadow: 0 0 0 3px rgba(58, 123, 213, 0.2);
        }
        
        .datetime-input {
            display: flex;
            gap: 15px;
        }
        
        .datetime-input input {
            flex: 1;
        }
        
        button {
            background: linear-gradient(to right, #1a2a6c, #3a7bd5);
            color: white;
            border: none;
            padding: 14px 25px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            font-weight: 600;
            margin-top: 10px;
        }
        
        button:hover {
            background: linear-gradient(to right, #3a7bd5, #1a2a6c);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .result-display {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 12px;
            padding: 25px;
            margin-top: 15px;
            text-align: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .result-time {
            font-size: 2.2rem;
            font-weight: 700;
            color: #1a2a6c;
            margin: 15px 0;
        }
        
        .result-date {
            font-size: 1.3rem;
            color: #555;
            margin-bottom: 10px;
        }
        
        .result-timezone {
            font-size: 1.2rem;
            color: #3a7bd5;
            font-weight: 600;
            margin-top: 20px;
            padding: 10px;
            background: rgba(58, 123, 213, 0.1);
            border-radius: 8px;
            display: inline-block;
        }
        
        .time-difference {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 215, 0, 0.15);
            border-radius: 8px;
            font-size: 1.1rem;
        }
        
        footer {
            text-align: center;
            padding: 25px;
            background: #f1f3f5;
            color: #666;
            font-size: 0.9rem;
        }
        
        .timezone-info {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 0.9rem;
            color: #666;
        }
        
        @media (max-width: 768px) {
            .converter-container {
                flex-direction: column;
            }
            
            .input-section {
                border-right: none;
                border-bottom: 1px solid #eee;
                padding-bottom: 30px;
            }
            
            .result-section {
                padding-top: 30px;
            }
            
            .result-time {
                font-size: 1.8rem;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>时区转换器</h1>
            <div class="subtitle">Time Zone Converter - 全球时间即时转换</div>
        </header>
        
        <div class="converter-container">
            <div class="input-section">
                <h2 class="section-title">输入时间与时区</h2>
                
                <div class="form-group">
                    <label for="date">日期</label>
                    <input type="date" id="date">
                </div>
                
                <div class="form-group">
                    <label for="time">时间</label>
                    <input type="time" id="time">
                </div>
                
                <div class="form-group">
                    <label for="from-timezone">原始时区</label>
                    <select id="from-timezone">
                        <!-- Options will be populated by JavaScript -->
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="to-timezone">目标时区</label>
                    <select id="to-timezone">
                        <!-- Options will be populated by JavaScript -->
                    </select>
                </div>
                
                <button id="convert-btn">转换时区</button>
            </div>
            
            <div class="result-section">
                <h2 class="section-title">转换结果</h2>
                
                <div class="result-display">
                    <div class="result-date" id="result-date">2025年7月31日</div>
                    <div class="result-time" id="result-time">14:30:45</div>
                    <div class="result-timezone" id="result-timezone">Asia/Shanghai</div>
                    
                    <div class="time-difference" id="time-difference">
                        时间差: +0小时 (相同时区)
                    </div>
                </div>
                
                <div class="timezone-info">
                    <div>原始时区: <span id="from-tz-label">UTC+08:00</span></div>
                    <div>目标时区: <span id="to-tz-label">UTC+08:00</span></div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>© 2025 时区转换器 | Time Zone Converter - 免费HTML网页托管平台</p>
            <p>本工具支持全球400多个时区转换，数据实时准确</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const dateInput = document.getElementById('date');
            const timeInput = document.getElementById('time');
            const fromTimezone = document.getElementById('from-timezone');
            const toTimezone = document.getElementById('to-timezone');
            const convertBtn = document.getElementById('convert-btn');
            const resultDate = document.getElementById('result-date');
            const resultTime = document.getElementById('result-time');
            const resultTimezone = document.getElementById('result-timezone');
            const timeDifference = document.getElementById('time-difference');
            const fromTzLabel = document.getElementById('from-tz-label');
            const toTzLabel = document.getElementById('to-tz-label');
            
            // 主要时区列表
            const timezones = [
                { id: 'Asia/Shanghai', name: '中国标准时间 (北京, 上海)', offset: 8 },
                { id: 'Asia/Tokyo', name: '日本标准时间 (东京)', offset: 9 },
                { id: 'Australia/Sydney', name: '澳大利亚东部时间 (悉尼)', offset: 10 },
                { id: 'Europe/London', name: '格林尼治标准时间 (伦敦)', offset: 0 },
                { id: 'Europe/Paris', name: '中欧时间 (巴黎, 柏林)', offset: 1 },
                { id: 'Europe/Moscow', name: '莫斯科时间', offset: 3 },
                { id: 'America/New_York', name: '美国东部时间 (纽约)', offset: -5 },
                { id: 'America/Chicago', name: '美国中部时间 (芝加哥)', offset: -6 },
                { id: 'America/Denver', name: '美国山地时间 (丹佛)', offset: -7 },
                { id: 'America/Los_Angeles', name: '美国太平洋时间 (洛杉矶)', offset: -8 },
                { id: 'Pacific/Honolulu', name: '夏威夷时间', offset: -10 },
                { id: 'Asia/Singapore', name: '新加坡时间', offset: 8 },
                { id: 'Asia/Dubai', name: '海湾标准时间 (迪拜)', offset: 4 },
                { id: 'Asia/Kolkata', name: '印度标准时间 (孟买, 新德里)', offset: 5.5 },
                { id: 'UTC', name: '协调世界时 (UTC)', offset: 0 }
            ];
            
            // 填充时区选择框
            function populateTimezones() {
                timezones.forEach(tz => {
                    const optionFrom = document.createElement('option');
                    optionFrom.value = tz.id;
                    optionFrom.textContent = `${tz.name} (UTC${tz.offset >= 0 ? '+' : ''}${tz.offset})`;
                    
                    const optionTo = optionFrom.cloneNode(true);
                    
                    fromTimezone.appendChild(optionFrom);
                    toTimezone.appendChild(optionTo);
                });
                
                // 设置默认时区（用户本地时区或上海）
                const localTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
                const defaultFrom = timezones.find(tz => tz.id === localTimezone) || timezones[0];
                const defaultTo = timezones.find(tz => tz.id === 'Europe/London') || timezones[3];
                
                fromTimezone.value = defaultFrom.id;
                toTimezone.value = defaultTo.id;
                
                // 更新标签
                fromTzLabel.textContent = `UTC${defaultFrom.offset >= 0 ? '+' : ''}${defaultFrom.offset}`;
                toTzLabel.textContent = `UTC${defaultTo.offset >= 0 ? '+' : ''}${defaultTo.offset}`;
            }
            
            // 设置当前日期时间
            function setCurrentDateTime() {
                const now = new Date();
                
                // 格式化日期 YYYY-MM-DD
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                dateInput.value = `${year}-${month}-${day}`;
                
                // 格式化时间 HH:MM
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                timeInput.value = `${hours}:${minutes}`;
                
                // 设置初始结果
                updateResultDisplay(now, fromTimezone.value);
            }
            
            // 转换时区
            function convertTimezone() {
                const dateStr = dateInput.value;
                const timeStr = timeInput.value;
                
                if (!dateStr || !timeStr) {
                    alert('请选择日期和时间');
                    return;
                }
                
                // 创建本地日期对象
                const localDate = new Date(`${dateStr}T${timeStr}:00`);
                
                // 获取目标时区
                const toTz = toTimezone.value;
                
                // 更新结果显示
                updateResultDisplay(localDate, toTz);
            }
            
            // 更新结果展示
            function updateResultDisplay(date, targetTimezone) {
                // 获取目标时区信息
                const targetTz = timezones.find(tz => tz.id === targetTimezone);
                
                // 转换到目标时区的时间
                const options = {
                    timeZone: targetTimezone,
                    hour12: false,
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                };
                
                const formatter = new Intl.DateTimeFormat('zh-CN', options);
                const formatted = formatter.format(date);
                
                // 提取日期和时间部分
                const [datePart, timePart] = formatted.split(' ');
                
                // 更新显示
                resultDate.textContent = datePart;
                resultTime.textContent = timePart;
                resultTimezone.textContent = targetTz.name.split(' (')[0];
                
                // 更新时区标签
                fromTzLabel.textContent = `UTC${timezones.find(tz => tz.id === fromTimezone.value).offset >= 0 ? '+' : ''}${timezones.find(tz => tz.id === fromTimezone.value).offset}`;
                toTzLabel.textContent = `UTC${targetTz.offset >= 0 ? '+' : ''}${targetTz.offset}`;
                
                // 计算并显示时间差
                const fromOffset = timezones.find(tz => tz.id === fromTimezone.value).offset;
                const toOffset = targetTz.offset;
                const diff = toOffset - fromOffset;
                
                let diffText;
                if (diff === 0) {
                    diffText = "时间差: +0小时 (相同时区)";
                } else {
                    diffText = `时间差: ${diff >= 0 ? '+' : ''}${diff}小时`;
                }
                
                timeDifference.textContent = diffText;
            }
            
            // 初始化
            populateTimezones();
            setCurrentDateTime();
            convertTimezone(); // 初始转换
            
            // 事件监听
            convertBtn.addEventListener('click', convertTimezone);
            fromTimezone.addEventListener('change', convertTimezone);
            toTimezone.addEventListener('change', convertTimezone);
            dateInput.addEventListener('change', convertTimezone);
            timeInput.addEventListener('change', convertTimezone);
        });
    </script>
</body>
</html>
