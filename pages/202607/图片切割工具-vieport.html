<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片切割工具</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        
        header {
            text-align: center;
            padding: 25px 20px;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
        }
        
        h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
        }
        
        .subtitle {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 300;
        }
        
        .upload-area {
            padding: 30px 20px;
            border-bottom: 1px solid #eee;
        }
        
        .upload-container {
            max-width: 700px;
            margin: 0 auto;
        }
        
        .upload-box {
            border: 3px dashed #6a11cb;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            background-color: #f9f9ff;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 20px;
        }
        
        .upload-box:hover {
            background-color: #f0f2ff;
            border-color: #2575fc;
        }
        
        .upload-box.drag-over {
            background-color: #e8ebff;
            border-color: #2575fc;
            border-style: solid;
        }
        
        .upload-icon {
            font-size: 3.5rem;
            color: #6a11cb;
            margin-bottom: 15px;
        }
        
        .upload-text {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #444;
        }
        
        .upload-subtext {
            color: #666;
            margin-bottom: 20px;
        }
        
        .file-input {
            display: none;
        }
        
        .upload-btn {
            background-color: #6a11cb;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .upload-btn:hover {
            background-color: #5a0db5;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(106, 17, 203, 0.3);
        }
        
        .progress-container {
            margin-top: 20px;
            display: none;
        }
        
        .progress-bar {
            height: 8px;
            background-color: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        
        .progress-fill {
            height: 100%;
            background-color: #2575fc;
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .progress-text {
            font-size: 0.9rem;
            color: #666;
            text-align: center;
        }
        
        .preview-area {
            padding: 30px 20px;
            border-bottom: 1px solid #eee;
        }
        
        .canvas-container {
            max-width: 800px;
            margin: 0 auto;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            background-color: #f8f8f8;
            position: relative;
        }
        
        canvas {
            display: block;
            max-width: 100%;
            max-height: 500px;
            margin: 0 auto;
        }
        
        .no-image {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }
        
        .no-image i {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #ccc;
        }
        
        .controls-area {
            padding: 30px 20px;
        }
        
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .control-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .control-label {
            font-weight: 600;
            color: #444;
        }
        
        select {
            padding: 10px 15px;
            border-radius: 6px;
            border: 2px solid #ddd;
            background-color: white;
            font-size: 1rem;
            color: #333;
            cursor: pointer;
            min-width: 120px;
        }
        
        select:focus {
            outline: none;
            border-color: #6a11cb;
        }
        
        .download-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .download-btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
            transform: none;
        }
        
        .download-btn:not(:disabled):hover {
            background-color: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.3);
        }
        
        .download-btn.processing {
            background-color: #3498db;
        }
        
        .download-btn.complete {
            animation: pulse 1.5s ease;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(46, 204, 113, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }
        
        .status-area {
            margin-top: 25px;
            text-align: center;
            font-size: 1rem;
            min-height: 24px;
        }
        
        .status {
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
            font-weight: 500;
        }
        
        .status.uploading {
            background-color: #e3f2fd;
            color: #1976d2;
        }
        
        .status.processing {
            background-color: #fff8e1;
            color: #ff8f00;
        }
        
        .status.packaging {
            background-color: #e8f5e9;
            color: #388e3c;
        }
        
        .status.complete {
            background-color: #e8f5e9;
            color: #388e3c;
        }
        
        .status.error {
            background-color: #ffebee;
            color: #d32f2f;
        }
        
        footer {
            text-align: center;
            padding: 25px 20px;
            color: #777;
            font-size: 0.9rem;
            border-top: 1px solid #eee;
        }
        
        .error-message {
            background-color: #ffebee;
            color: #d32f2f;
            padding: 12px 20px;
            border-radius: 6px;
            margin-top: 15px;
            display: none;
        }
        
        .image-info {
            text-align: center;
            margin-top: 15px;
            color: #666;
            font-size: 0.9rem;
        }
        
        /* 移动端适配 */
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .control-group {
                justify-content: space-between;
            }
            
            .download-btn {
                justify-content: center;
                margin-top: 10px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .upload-box {
                padding: 30px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-cut"></i> 图片切割工具</h1>
            <p class="subtitle">上传图片并切割成网格，支持多种切割模式，一键打包下载</p>
        </header>
        
        <section class="upload-area">
            <div class="upload-container">
                <div class="upload-box" id="dropArea">
                    <div class="upload-icon">
                        <i class="fas fa-cloud-upload-alt"></i>
                    </div>
                    <p class="upload-text">拖放图片到此处或点击选择文件</p>
                    <p class="upload-subtext">支持 JPG, PNG, GIF, WebP 格式，最大 10MB</p>
                    <button class="upload-btn" id="selectBtn">选择图片</button>
                    <input type="file" id="fileInput" class="file-input" accept="image/jpeg,image/png,image/gif,image/webp">
                </div>
                
                <div class="progress-container" id="progressContainer">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-text" id="progressText">正在读取图片...</div>
                </div>
                
                <div class="error-message" id="errorMessage"></div>
            </div>
        </section>
        
        <section class="preview-area">
            <div class="canvas-container">
                <canvas id="imageCanvas"></canvas>
                <div class="no-image" id="noImage">
                    <i class="fas fa-image"></i>
                    <p>上传图片后，这里将显示预览和切割网格</p>
                </div>
            </div>
            <div class="image-info" id="imageInfo"></div>
        </section>
        
        <section class="controls-area">
            <div class="controls">
                <div class="control-group">
                    <span class="control-label">切割模式：</span>
                    <select id="gridSelect">
                        <option value="2">2×2 网格</option>
                        <option value="3" selected>3×3 网格</option>
                        <option value="4">4×4 网格</option>
                        <option value="5">5×5 网格</option>
                        <option value="6">6×6 网格</option>
                    </select>
                </div>
                
                <button class="download-btn" id="downloadBtn" disabled>
                    <i class="fas fa-download"></i>
                    <span>下载切割图片包</span>
                </button>
            </div>
            
            <div class="status-area">
                <div class="status" id="statusIndicator">等待上传图片</div>
            </div>
        </section>
        
        <footer>
            
            <p>© 2026 图片切割工具 | 老徐8年合伙人，文章，vx：wenzhang131499</p>
            <p>零门槛建站，3分钟上线</p><a href="http://deepseek.idoxu.com/register?code=131499">点击这里注册有惊喜</a>
            <p>免服务器、免域名、免备案，一键推送给全球用户</p>
            
        </footer>
    </div>

    <script>
        // 获取DOM元素
        const dropArea = document.getElementById('dropArea');
        const fileInput = document.getElementById('fileInput');
        const selectBtn = document.getElementById('selectBtn');
        const canvas = document.getElementById('imageCanvas');
        const ctx = canvas.getContext('2d');
        const noImage = document.getElementById('noImage');
        const gridSelect = document.getElementById('gridSelect');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusIndicator = document.getElementById('statusIndicator');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const errorMessage = document.getElementById('errorMessage');
        const imageInfo = document.getElementById('imageInfo');
        
        // 状态变量
        let originalImage = null;
        let imageLoaded = false;
        let gridSize = 3;
        let canvasWidth = 0;
        let canvasHeight = 0;
        let imageWidth = 0;
        let imageHeight = 0;
        let scale = 1;
        
        // 初始化事件监听
        function init() {
            // 文件选择按钮点击事件
            selectBtn.addEventListener('click', () => fileInput.click());
            
            // 文件输入变化事件
            fileInput.addEventListener('change', handleFileSelect);
            
            // 拖放事件
            dropArea.addEventListener('dragover', handleDragOver);
            dropArea.addEventListener('dragleave', handleDragLeave);
            dropArea.addEventListener('drop', handleDrop);
            
            // 网格选择变化事件
            gridSelect.addEventListener('change', () => {
                gridSize = parseInt(gridSelect.value);
                if (imageLoaded) {
                    drawImageWithGrid();
                    updateStatus('网格已更新');
                }
            });
            
            // 下载按钮点击事件
            downloadBtn.addEventListener('click', handleDownload);
            
            // 初始状态设置
            updateStatus('等待上传图片');
        }
        
        // 处理文件选择
        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                processImageFile(file);
            }
        }
        
        // 处理拖放
        function handleDragOver(e) {
            e.preventDefault();
            dropArea.classList.add('drag-over');
        }
        
        function handleDragLeave(e) {
            e.preventDefault();
            dropArea.classList.remove('drag-over');
        }
        
        function handleDrop(e) {
            e.preventDefault();
            dropArea.classList.remove('drag-over');
            
            const file = e.dataTransfer.files[0];
            if (file) {
                processImageFile(file);
            }
        }
        
        // 处理图片文件
        function processImageFile(file) {
            // 验证文件类型
            const validTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
            if (!validTypes.includes(file.type)) {
                showError('不支持的文件格式，请选择 JPG、PNG、GIF 或 WebP 格式的图片');
                return;
            }
            
            // 验证文件大小 (最大10MB)
            const maxSize = 10 * 1024 * 1024; // 10MB
            if (file.size > maxSize) {
                showError('文件过大，请选择小于 10MB 的图片');
                return;
            }
            
            // 清除错误消息
            clearError();
            
            // 显示进度
            progressContainer.style.display = 'block';
            progressFill.style.width = '0%';
            progressText.textContent = '正在读取图片...';
            updateStatus('上传中');
            
            // 使用FileReader读取图片
            const reader = new FileReader();
            
            reader.onprogress = (e) => {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    progressFill.style.width = `${percent}%`;
                    progressText.textContent = `正在读取图片... ${percent}%`;
                }
            };
            
            reader.onload = (e) => {
                progressFill.style.width = '100%';
                progressText.textContent = '读取完成，正在加载图片...';
                
                // 创建图片对象
                const img = new Image();
                img.onload = () => {
                    // 隐藏无图片提示
                    noImage.style.display = 'none';
                    
                    // 存储原始图片
                    originalImage = img;
                    imageLoaded = true;
                    
                    // 设置画布尺寸并绘制图片
                    setupCanvas(img);
                    
                    // 隐藏进度条
                    setTimeout(() => {
                        progressContainer.style.display = 'none';
                    }, 500);
                    
                    // 更新图片信息
                    imageInfo.textContent = `图片尺寸: ${img.width} × ${img.height} 像素 | 文件大小: ${formatFileSize(file.size)}`;
                    
                    // 激活下载按钮
                    downloadBtn.disabled = false;
                    updateStatus('图片已加载，选择网格模式后点击下载');
                };
                
                img.onerror = () => {
                    showError('图片加载失败，请尝试其他图片');
                    progressContainer.style.display = 'none';
                };
                
                img.src = e.target.result;
            };
            
            reader.onerror = () => {
                showError('文件读取失败，请重试');
                progressContainer.style.display = 'none';
            };
            
            reader.readAsDataURL(file);
        }
        
        // 设置画布并绘制图片
        function setupCanvas(img) {
            // 获取容器尺寸
            const container = canvas.parentElement;
            const maxWidth = container.clientWidth;
            const maxHeight = 500;
            
            // 计算缩放比例，保持图片原始比例
            const widthRatio = maxWidth / img.width;
            const heightRatio = maxHeight / img.height;
            scale = Math.min(widthRatio, heightRatio, 1); // 不超过原图尺寸
            
            canvasWidth = img.width * scale;
            canvasHeight = img.height * scale;
            imageWidth = img.width;
            imageHeight = img.height;
            
            // 设置画布尺寸
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
            
            // 绘制图片
            drawImageWithGrid();
        }
        
        // 绘制图片和网格
        function drawImageWithGrid() {
            if (!originalImage || !imageLoaded) return;
            
            // 清除画布
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);
            
            // 绘制图片
            ctx.drawImage(originalImage, 0, 0, canvasWidth, canvasHeight);
            
            // 绘制网格线
            drawGrid();
        }
        
        // 绘制网格线
        function drawGrid() {
            const cols = gridSize;
            const rows = gridSize;
            
            // 计算每个格子的宽度和高度
            const cellWidth = canvasWidth / cols;
            const cellHeight = canvasHeight / rows;
            
            // 设置线条样式
            ctx.strokeStyle = 'rgba(255, 0, 0, 0.7)';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            
            // 绘制垂直线
            for (let i = 1; i < cols; i++) {
                ctx.beginPath();
                ctx.moveTo(i * cellWidth, 0);
                ctx.lineTo(i * cellWidth, canvasHeight);
                ctx.stroke();
            }
            
            // 绘制水平线
            for (let i = 1; i < rows; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * cellHeight);
                ctx.lineTo(canvasWidth, i * cellHeight);
                ctx.stroke();
            }
            
            // 恢复实线
            ctx.setLineDash([]);
            
            // 绘制网格标签
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // 在每个格子中心添加编号
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const x = col * cellWidth + cellWidth / 2;
                    const y = row * cellHeight + cellHeight / 2;
                    
                    // 添加半透明背景
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                    ctx.fillRect(x - 20, y - 12, 40, 24);
                    
                    // 添加文本
                    ctx.fillStyle = '#333';
                    ctx.fillText(`${row+1}-${col+1}`, x, y);
                }
            }
        }
        
        // 处理下载
        async function handleDownload() {
            if (!originalImage || !imageLoaded) return;
            
            // 更新状态和按钮
            updateStatus('处理中...');
            downloadBtn.classList.add('processing');
            downloadBtn.disabled = true;
            downloadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>处理中...</span>';
            
            try {
                // 创建Zip文件
                const zip = new JSZip();
                const cols = gridSize;
                const rows = gridSize;
                
                // 计算每个切割块的实际尺寸（基于原始图片）
                const cellWidth = Math.floor(imageWidth / cols);
                const cellHeight = Math.floor(imageHeight / rows);
                
                // 更新状态
                updateStatus('正在切割图片...');
                
                // 创建离屏画布用于切割
                const offscreenCanvas = document.createElement('canvas');
                const offscreenCtx = offscreenCanvas.getContext('2d');
                
                // 设置离屏画布尺寸为每个切割块的大小
                offscreenCanvas.width = cellWidth;
                offscreenCanvas.height = cellHeight;
                
                // 切割图片并添加到Zip
                for (let row = 0; row < rows; row++) {
                    for (let col = 0; col < cols; col++) {
                        // 计算当前块的坐标
                        const sx = col * cellWidth;
                        const sy = row * cellHeight;
                        
                        // 对于最后一行/列，确保包含剩余像素
                        let width = cellWidth;
                        let height = cellHeight;
                        
                        if (col === cols - 1) {
                            width = imageWidth - sx; // 最后一列使用剩余宽度
                        }
                        if (row === rows - 1) {
                            height = imageHeight - sy; // 最后一行使用剩余高度
                        }
                        
                        // 设置离屏画布尺寸为当前块的实际大小
                        offscreenCanvas.width = width;
                        offscreenCanvas.height = height;
                        
                        // 清除离屏画布
                        offscreenCtx.clearRect(0, 0, width, height);
                        
                        // 绘制当前块到离屏画布
                        offscreenCtx.drawImage(
                            originalImage,
                            sx, sy, width, height, // 源图像区域
                            0, 0, width, height     // 目标区域
                        );
                        
                        // 将离屏画布转换为Blob
                        updateStatus(`正在处理第 ${row+1} 行，第 ${col+1} 列`);
                        
                        await new Promise((resolve) => {
                            offscreenCanvas.toBlob((blob) => {
                                // 添加到Zip文件
                                zip.file(`${row+1}-${col+1}.png`, blob);
                                resolve();
                            }, 'image/png');
                        });
                    }
                }
                
                // 更新状态
                updateStatus('正在打包文件...');
                
                // 生成Zip文件
                const zipBlob = await zip.generateAsync({type: 'blob'}, (metadata) => {
                    progressContainer.style.display = 'block';
                    progressFill.style.width = `${metadata.percent.toFixed(2)}%`;
                    progressText.textContent = `打包进度: ${metadata.percent.toFixed(2)}%`;
                });
                
                // 隐藏进度条
                progressContainer.style.display = 'none';
                
                // 创建下载链接
                const url = URL.createObjectURL(zipBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `图片切割_${gridSize}x${gridSize}_${Date.now()}.zip`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                // 释放URL对象
                setTimeout(() => URL.revokeObjectURL(url), 100);
                
                // 更新状态
                updateStatus('下载完成');
                downloadBtn.classList.remove('processing');
                downloadBtn.classList.add('complete');
                
                // 恢复按钮状态
                setTimeout(() => {
                    downloadBtn.classList.remove('complete');
                    downloadBtn.disabled = false;
                    downloadBtn.innerHTML = '<i class="fas fa-download"></i><span>下载切割图片包</span>';
                    updateStatus('可以继续切割或上传新图片');
                }, 3000);
                
            } catch (error) {
                console.error('下载处理失败:', error);
                showError('处理失败: ' + error.message);
                
                // 恢复按钮状态
                downloadBtn.classList.remove('processing');
                downloadBtn.disabled = false;
                downloadBtn.innerHTML = '<i class="fas fa-download"></i><span>下载切割图片包</span>';
                updateStatus('处理失败，请重试');
            }
        }
        
        // 更新状态指示器
        function updateStatus(text, type = 'default') {
            statusIndicator.textContent = text;
            statusIndicator.className = 'status';
            
            if (type === 'uploading') {
                statusIndicator.classList.add('uploading');
            } else if (type === 'processing') {
                statusIndicator.classList.add('processing');
            } else if (type === 'packaging') {
                statusIndicator.classList.add('packaging');
            } else if (type === 'complete') {
                statusIndicator.classList.add('complete');
            } else if (type === 'error') {
                statusIndicator.classList.add('error');
            }
        }
        
        // 显示错误消息
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            updateStatus('错误: ' + message, 'error');
            
            // 5秒后自动隐藏错误消息
            setTimeout(() => {
                clearError();
            }, 5000);
        }
        
        // 清除错误消息
        function clearError() {
            errorMessage.style.display = 'none';
            errorMessage.textContent = '';
        }
        
        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            else if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            else return (bytes / 1048576).toFixed(1) + ' MB';
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
