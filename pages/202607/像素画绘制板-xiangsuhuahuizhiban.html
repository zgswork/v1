<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>像素画绘制板</title>
  <style>
    :root {
      --bg: #f8f9fb;
      --text: #1f2328;
      --panel-bg: #ffffff;
      --panel-border: #d0d7de;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-contrast: #ffffff;
      --control-bg: #ffffff;
      --control-border: #d1d5db;
      --control-hover: #e5e7eb;
      --grid: #e5e7eb;
      --canvas-bg: #ffffff;
      --warn: #ef4444;
    }
    [data-theme="dark"] {
      --bg: #0b0f13;
      --text: #e6edf3;
      --panel-bg: #0f141a;
      --panel-border: #263041;
      --muted: #9aa4b2;
      --accent: #3b82f6;
      --accent-contrast: #0b0f13;
      --control-bg: #0f141a;
      --control-border: #334155;
      --control-hover: #1a232e;
      --grid: #283241;
      --canvas-bg: #10161d;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, PingFang SC, Helvetica, Arial, "Noto Sans SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--panel-border);
    }
    .title {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .title h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }
    .subtitle {
      font-size: 12px;
      color: var(--muted);
    }
    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--control-border);
      background: var(--control-bg);
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
    }
    .theme-toggle:hover { background: var(--control-hover); }
    .container {
      max-width: 1024px;
      margin: 16px auto;
      padding: 0 12px 20px;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 12px;
      margin-bottom: 12px;
    }
    .group {
      grid-column: span 12;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
    }
    @media (min-width: 640px) {
      .group.size { grid-column: span 5; }
      .group.color { grid-column: span 4; }
      .group.tools { grid-column: span 3; }
      .group.actions { grid-column: span 12; }
    }
    @media (min-width: 900px) {
      .group.actions { grid-column: span 12; }
    }
    .group label {
      font-size: 12px;
      color: var(--muted);
    }
    .row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    input[type="number"], input[type="text"], input[type="color"], select {
      height: 32px;
      padding: 0 8px;
      border: 1px solid var(--control-border);
      background: var(--control-bg);
      color: var(--text);
      border-radius: 6px;
      outline: none;
    }
    input[type="number"] { width: 80px; }
    input[type="color"] {
      width: 36px; padding: 0; border: none; background: transparent;
    }
    .palette {
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .swatch {
      width: 22px; height: 22px; border-radius: 4px;
      border: 1px solid var(--control-border);
      cursor: pointer;
    }
    .buttons {
      display: flex; flex-wrap: wrap; gap: 8px;
    }
    button {
      height: 32px;
      padding: 0 12px;
      border: 1px solid var(--control-border);
      background: var(--control-bg);
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: var(--control-hover); }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-contrast);
    }
    .btn-primary:hover { filter: brightness(1.05); }
    .btn-danger {
      background: #ef44441a;
      border-color: #ef444433;
      color: var(--warn);
    }
    .tool-toggle {
      display: inline-flex; gap: 6px; flex-wrap: wrap;
    }
    .tool {
      height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--control-border);
      background: var(--control-bg); cursor: pointer;
    }
    .tool.active {
      background: var(--accent); border-color: var(--accent); color: var(--accent-contrast);
    }
    .canvas-wrap {
      padding: 10px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
    }
    canvas {
      width: 100%;
      height: auto;
      aspect-ratio: var(--ratio);
      display: block;
      background: var(--canvas-bg);
      image-rendering: pixelated;
      border-radius: 8px;
      touch-action: none;
    }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
    }
    .kbd {
      display: inline-block;
      border: 1px solid var(--control-border);
      background: var(--control-bg);
      color: var(--text);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="title">
      <h1>像素画绘制板</h1>
      <div class="subtitle">轻松绘制像素风格图案，支持手机与电脑</div>
    </div>
    <button id="themeToggle" class="theme-toggle" title="切换浅/深主题">切换主题</button>
  </header>
  <div class="container">
    <div class="controls">
      <div class="group size">
        <label>画布尺寸</label>
        <div class="row">
          <input id="wInput" type="number" min="8" max="128" step="1" value="32" aria-label="宽度(像素格)">
          <span>×</span>
          <input id="hInput" type="number" min="8" max="128" step="1" value="32" aria-label="高度(像素格)">
          <button id="newCanvasBtn" class="btn-primary">新建画布</button>
          <label style="margin-left:8px;display:inline-flex;align-items:center;gap:6px;">
            <input id="gridToggle" type="checkbox" checked>
            <span>显示网格</span>
          </label>
          <label style="margin-left:8px;display:inline-flex;align-items:center;gap:6px;">
            网格颜色
            <input id="gridColorPicker" type="color" value="#e5e7eb">
          </label>
        </div>
      </div>
      <div class="group color">
        <label>颜色</label>
        <div class="row">
          <input id="colorPicker" type="color" value="#ff0000" aria-label="颜色选择器">
          <div id="palette" class="palette" aria-label="调色板">
            <!-- 动态生成色块 -->
          </div>
        </div>
      </div>
      <div class="group tools">
        <label>工具</label>
        <div class="tool-toggle" role="tablist" aria-label="绘制工具">
          <button class="tool active" data-tool="pencil" title="画笔(P)">画笔</button>
          <button class="tool" data-tool="eraser" title="橡皮(E)">橡皮</button>
          <button class="tool" data-tool="fill" title="填充(F)">填充</button>
          <button class="tool" data-tool="dropper" title="吸管(I)">吸管</button>
          <button class="tool" data-tool="line" title="直线(L)">直线</button>
        </div>
        <div class="row" style="margin-top:8px;">
          <label>笔刷大小</label>
          <input id="brushSize" type="number" min="1" max="12" step="1" value="1" aria-label="笔刷大小">
          <label style="display:inline-flex;align-items:center;gap:6px;">
            <input id="mirrorH" type="checkbox">
            <span>水平对称</span>
          </label>
          <label style="display:inline-flex;align-items:center;gap:6px;">
            <input id="mirrorV" type="checkbox">
            <span>垂直对称</span>
          </label>
        </div>
      </div>
      <div class="group actions">
        <label>操作</label>
        <div class="buttons">
          <button id="importBgBtn">导入背景图片</button>
          <button id="pixelImportBtn">像素化导入到画布</button>
          <button id="clearBgBtn">清除背景</button>
          <button id="undoBtn">撤销 Ctrl+Z</button>
          <button id="redoBtn">重做 Ctrl+Y</button>
          <button id="clearBtn" class="btn-danger">清空画布</button>
          <label style="display:inline-flex;align-items:center;gap:6px;margin-left:8px;">
            <input id="transparentToggle" type="checkbox">
            <span>透明背景</span>
          </label>
          <label style="display:inline-flex;align-items:center;gap:6px;margin-left:8px;">
            背景不透明度
            <input id="bgOpacity" type="range" min="0" max="100" step="1" value="100">
          </label>
          <label style="display:inline-flex;align-items:center;gap:6px;margin-left:8px;">
            导出倍数
            <input id="exportScale" type="number" min="1" max="64" step="1" value="16" style="width:70px;">
          </label>
          <button id="exportBtn" class="btn-primary">导出 PNG</button>
          <button id="saveBtn">保存工程</button>
          <button id="loadBtn">加载工程</button>
          <input id="fileInput" type="file" accept="application/json" style="display:none;">
          <input id="imageInput" type="file" accept="image/png,image/jpeg,image/jpg,image/webp,image/gif,image/bmp" style="display:none;">
          <input id="pixelImageInput" type="file" accept="image/png,image/jpeg,image/jpg,image/webp,image/gif,image/bmp" style="display:none;">
        </div>
      </div>
    </div>

    <div class="canvas-wrap">
      <canvas id="canvas" aria-label="像素画画布"></canvas>
      <div class="hint">
        提示：拖动在画布上绘制。快捷键
        <span class="kbd">P</span> 画笔，
        <span class="kbd">E</span> 橡皮，
        <span class="kbd">F</span> 填充，
        <span class="kbd">I</span> 吸管；
        <span class="kbd">G</span> 切换网格。
      </div>
    </div>
  </div>

  <script>
    // 主题持久化与切换
    const bodyEl = document.body;
    const themeToggleBtn = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('pixel_theme');
    if (savedTheme === 'dark' || savedTheme === 'light') {
      bodyEl.setAttribute('data-theme', savedTheme);
    } else {
      bodyEl.setAttribute('data-theme', 'light');
    }
    function toggleTheme() {
      const now = bodyEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      bodyEl.setAttribute('data-theme', now);
      localStorage.setItem('pixel_theme', now);
    }
    themeToggleBtn.addEventListener('click', toggleTheme);

    // 元素引用
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const wInput = document.getElementById('wInput');
    const hInput = document.getElementById('hInput');
    const newCanvasBtn = document.getElementById('newCanvasBtn');
    const colorPicker = document.getElementById('colorPicker');
    const paletteEl = document.getElementById('palette');
    const toolButtons = Array.from(document.querySelectorAll('.tool'));
    const clearBtn = document.getElementById('clearBtn');
    const exportBtn = document.getElementById('exportBtn');
    const gridToggle = document.getElementById('gridToggle');
    const brushSizeInput = document.getElementById('brushSize');
    const mirrorHInput = document.getElementById('mirrorH');
    const mirrorVInput = document.getElementById('mirrorV');
    const gridColorPicker = document.getElementById('gridColorPicker');
    const undoBtn = document.getElementById('undoBtn');
    const redoBtn = document.getElementById('redoBtn');
    const transparentToggle = document.getElementById('transparentToggle');
    const exportScaleInput = document.getElementById('exportScale');
    const saveBtn = document.getElementById('saveBtn');
    const loadBtn = document.getElementById('loadBtn');
    const fileInput = document.getElementById('fileInput');
    const importBgBtn = document.getElementById('importBgBtn');
    const imageInput = document.getElementById('imageInput');
    const pixelImportBtn = document.getElementById('pixelImportBtn');
    const pixelImageInput = document.getElementById('pixelImageInput');
    const clearBgBtn = document.getElementById('clearBgBtn');
    const bgOpacityInput = document.getElementById('bgOpacity');

    // 默认调色板
    const defaultPalette = [
      '#000000','#ffffff','#ff0000','#00a2ff','#00c853','#ffcc00',
      '#ff7f00','#9c27b0','#795548','#c0c0c0','#3e4aef','#ff4081'
    ];
    defaultPalette.forEach(c => {
      const sw = document.createElement('button');
      sw.className = 'swatch';
      sw.style.background = c;
      sw.title = c;
      sw.addEventListener('click', () => {
        state.currentColor = c;
        colorPicker.value = toColorInput(c);
      });
      paletteEl.appendChild(sw);
    });

    // 状态
    const state = {
      width: clamp(parseInt(wInput.value,10)||32, 8, 128),
      height: clamp(parseInt(hInput.value,10)||32, 8, 128),
      pixels: [],
      currentColor: colorPicker.value,
      tool: 'pencil',
      showGrid: gridToggle.checked,
      drawing: false,
      brushSize: clamp(parseInt(brushSizeInput.value,10)||1, 1, 12),
      transparentBg: false,
      bgOpacity: 1,
      exportScale: clamp(parseInt(exportScaleInput.value,10)||16, 1, 64),
      mirrorH: !!(mirrorHInput && mirrorHInput.checked),
      mirrorV: !!(mirrorVInput && mirrorVInput.checked),
      lineStart: null,
      gridColor: getComputedStyle(document.body).getPropertyValue('--grid').trim(),
      undoStack: [],
      redoStack: [],
      snapshotBefore: null,
      maxHistory: 50,
      bgImage: null,
      bgImageData: null
    };

    function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }
    function toColorInput(hex){ 
      // 规范化为 #rrggbb
      const h = hex.toLowerCase();
      if (/^#([0-9a-f]{3})$/.test(h)) {
        return '#' + h.slice(1).split('').map(x=>x+x).join('');
      }
      return h;
    }

    function createPixels(w,h) {
      state.pixels = new Array(w*h).fill(null);
    }

    function setTool(tool) {
      state.tool = tool;
      toolButtons.forEach(b => b.classList.toggle('active', b.dataset.tool === tool));
    }
    toolButtons.forEach(btn => {
      btn.addEventListener('click', () => setTool(btn.dataset.tool));
    });

    function initCanvasSize() {
      // 使用 CSS aspect-ratio 保持纵横比，再将实际像素尺寸与显示尺寸同步
      canvas.style.setProperty('--ratio', state.width + '/' + state.height);
      // 下一帧读取完成后的尺寸
      requestAnimationFrame(resizeCanvasToDisplaySize);
    }
    function resizeCanvasToDisplaySize() {
      const displayWidth = Math.floor(canvas.clientWidth);
      const displayHeight = Math.floor(canvas.clientHeight);
      if (!displayWidth || !displayHeight) {
        // 如果尚未布局完成，稍后再次尝试
        requestAnimationFrame(resizeCanvasToDisplaySize);
        return;
      }
      if (canvas.width !== displayWidth) canvas.width = displayWidth;
      if (canvas.height !== displayHeight) canvas.height = displayHeight;
      render();
    }
    window.addEventListener('resize', resizeCanvasToDisplaySize);

    function newCanvas() {
      const w = clamp(parseInt(wInput.value,10)||32, 8, 128);
      const h = clamp(parseInt(hInput.value,10)||32, 8, 128);
      state.width = w; state.height = h;
      createPixels(w,h);
      state.undoStack = []; state.redoStack = []; state.snapshotBefore = null;
      initCanvasSize();
    }
    newCanvasBtn.addEventListener('click', newCanvas);
    gridToggle.addEventListener('change', () => {
      state.showGrid = gridToggle.checked;
      render();
    });
    colorPicker.addEventListener('input', () => {
      state.currentColor = colorPicker.value;
    });
    clearBtn.addEventListener('click', () => {
      pushHistorySnapshot();
      createPixels(state.width, state.height);
      render();
    });
    brushSizeInput.addEventListener('input', () => {
      state.brushSize = clamp(parseInt(brushSizeInput.value,10)||1, 1, 12);
    });
    if (gridColorPicker) {
      try { gridColorPicker.value = toColorInput(state.gridColor); } catch {}
      gridColorPicker.addEventListener('input', () => {
        state.gridColor = gridColorPicker.value;
        document.body.style.setProperty('--grid', state.gridColor);
        render();
      });
    }
    if (mirrorHInput) mirrorHInput.addEventListener('change', () => { state.mirrorH = mirrorHInput.checked; });
    if (mirrorVInput) mirrorVInput.addEventListener('change', () => { state.mirrorV = mirrorVInput.checked; });
    transparentToggle.addEventListener('change', () => {
      state.transparentBg = transparentToggle.checked;
      render();
    });
    exportScaleInput.addEventListener('input', () => {
      state.exportScale = clamp(parseInt(exportScaleInput.value,10)||16, 1, 64);
    });
    bgOpacityInput.addEventListener('input', () => {
      state.bgOpacity = clamp(parseInt(bgOpacityInput.value,10)||100, 0, 100)/100;
      render();
    });
    clearBgBtn.addEventListener('click', () => {
      state.bgImage = null;
      state.bgImageData = null;
      render();
    });

    // 绘制逻辑
    function render() {
      const cw = canvas.width, ch = canvas.height;
      const cellW = cw / state.width;
      const cellH = ch / state.height;
      // 背景（优先绘制导入的图片，否则透明棋盘/主题色）
      if (state.bgImage) {
        ctx.clearRect(0,0,cw,ch);
        ctx.save();
        ctx.globalAlpha = clamp(state.bgOpacity, 0, 1);
        ctx.drawImage(state.bgImage, 0, 0, cw, ch);
        ctx.restore();
      } else {
        if (state.transparentBg) {
          const tile = 12; // 棋盘格大小
          for (let y=0; y<ch; y+=tile) {
            for (let x=0; x<cw; x+=tile) {
              const even = ((x/tile) + (y/tile)) % 2 === 0;
              ctx.fillStyle = even ? '#dfe3e8' : '#b8bec6';
              ctx.fillRect(x, y, tile, tile);
            }
          }
        } else {
          ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--canvas-bg').trim();
          ctx.fillRect(0, 0, cw, ch);
        }
      }
      // 像素
      for (let y=0; y<state.height; y++) {
        for (let x=0; x<state.width; x++) {
          const c = state.pixels[y*state.width + x];
          if (!c) continue;
          ctx.fillStyle = c;
          ctx.fillRect(Math.floor(x*cellW), Math.floor(y*cellH), Math.ceil(cellW), Math.ceil(cellH));
        }
      }
      // 网格
      if (state.showGrid) {
        ctx.lineWidth = 1;
        ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--grid').trim();
        ctx.beginPath();
        for (let x=0; x<=state.width; x++) {
          const gx = Math.round(x*cellW) + 0.5;
          ctx.moveTo(gx, 0); ctx.lineTo(gx, ch);
        }
        for (let y=0; y<=state.height; y++) {
          const gy = Math.round(y*cellH) + 0.5;
          ctx.moveTo(0, gy); ctx.lineTo(cw, gy);
        }
        ctx.stroke();
      }
    }

    function posToCell(evt) {
      const rect = canvas.getBoundingClientRect();
      const x = (evt.clientX ?? (evt.touches && evt.touches[0]?.clientX)) - rect.left;
      const y = (evt.clientY ?? (evt.touches && evt.touches[0]?.clientY)) - rect.top;
      const cellW = canvas.width / state.width;
      const cellH = canvas.height / state.height;
      const cx = clamp(Math.floor(x / cellW), 0, state.width-1);
      const cy = clamp(Math.floor(y / cellH), 0, state.height-1);
      return {cx, cy};
    }
    function applyBrushAt(cx, cy, fn) {
      const half = Math.floor(state.brushSize/2);
      for (let by=-half; by<state.brushSize-half; by++) {
        for (let bx=-half; bx<state.brushSize-half; bx++) {
          const px = clamp(cx+bx, 0, state.width-1);
          const py = clamp(cy+by, 0, state.height-1);
          fn(px, py);
        }
      }
    }
    function forSymmetryPositions(cx, cy) {
      const positions = [];
      const add = (x,y) => {
        if (!positions.some(p => p.x===x && p.y===y)) positions.push({x,y});
      };
      add(cx, cy);
      if (state.mirrorV) add(state.width-1-cx, cy);
      if (state.mirrorH) add(cx, state.height-1-cy);
      if (state.mirrorH && state.mirrorV) add(state.width-1-cx, state.height-1-cy);
      return positions;
    }
    function drawLineWithBrush(x0, y0, x1, y1, fn) {
      let dx = Math.abs(x1-x0), sx = x0<x1 ? 1 : -1;
      let dy = -Math.abs(y1-y0), sy = y0<y1 ? 1 : -1;
      let err = dx + dy;
      let x = x0, y = y0;
      while (true) {
        applyBrushAt(x, y, fn);
        if (x===x1 && y===y1) break;
        const e2 = 2*err;
        if (e2 >= dy) { err += dy; x += sx; }
        if (e2 <= dx) { err += dx; y += sy; }
      }
    }
    function drawAt(cx, cy) {
      if (state.tool === 'pencil') {
        const positions = forSymmetryPositions(cx, cy);
        positions.forEach(p => applyBrushAt(p.x, p.y, (x,y)=>{ state.pixels[y*state.width + x] = state.currentColor; }));
        render();
      } else if (state.tool === 'eraser') {
        const positions = forSymmetryPositions(cx, cy);
        positions.forEach(p => applyBrushAt(p.x, p.y, (x,y)=>{ state.pixels[y*state.width + x] = null; }));
        render();
      } else if (state.tool === 'dropper') {
        const idx = cy*state.width + cx;
        const c = state.pixels[idx];
        if (c) {
          state.currentColor = c;
          colorPicker.value = toColorInput(c);
        } else if (state.bgImageData) {
          const off = idx*4;
          const d = state.bgImageData.data;
          const r = d[off], g = d[off+1], b = d[off+2];
          const hex = '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
          state.currentColor = hex;
          colorPicker.value = toColorInput(hex);
        }
      } else if (state.tool === 'fill') {
        pushHistorySnapshot();
        floodFill(cx, cy, state.pixels[cy*state.width + cx], state.currentColor);
      }
    }
    function floodFill(sx, sy, targetColor, newColor) {
      if (targetColor === newColor) return;
      const w = state.width, h = state.height;
      const stack = [[sx,sy]];
      const visited = new Set();
      function key(x,y){ return y*w+x; }
      while (stack.length) {
        const [x,y] = stack.pop();
        const k = key(x,y);
        if (visited.has(k)) continue;
        visited.add(k);
        const idx = k;
        const cur = state.pixels[idx];
        if (cur !== targetColor) continue;
        state.pixels[idx] = newColor;
        if (x>0) stack.push([x-1,y]);
        if (x<w-1) stack.push([x+1,y]);
        if (y>0) stack.push([x,y-1]);
        if (y<h-1) stack.push([x,y+1]);
      }
      render();
    }

    // 指针事件（统一鼠标与触控）
    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      canvas.setPointerCapture(e.pointerId);
      state.drawing = true;
      if (state.tool === 'pencil' || state.tool === 'eraser' || state.tool === 'line') {
        state.snapshotBefore = makeSnapshot();
      }
      const {cx, cy} = posToCell(e);
      if (state.tool === 'line') {
        state.lineStart = {cx, cy};
      } else {
        drawAt(cx, cy);
      }
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!state.drawing) return;
      const {cx, cy} = posToCell(e);
      if (state.tool === 'line') {
        // 直线工具在松开时绘制，这里不实时绘制，避免干扰像素状态
      } else {
        drawAt(cx, cy);
      }
    });
    const endDraw = (e) => {
      if (state.drawing) {
        state.drawing = false;
        try { canvas.releasePointerCapture(e.pointerId); } catch {}
        if (state.tool === 'line' && state.lineStart) {
          const {cx, cy} = posToCell(e);
          drawLineWithBrush(state.lineStart.cx, state.lineStart.cy, cx, cy, (x,y)=>{
            state.pixels[y*state.width + x] = state.currentColor;
          });
          state.lineStart = null;
          render();
        }
        if (state.snapshotBefore && (state.tool === 'pencil' || state.tool === 'eraser' || state.tool === 'line')) {
          pushSnapshot(state.snapshotBefore);
          state.snapshotBefore = null;
        }
      }
    };
    canvas.addEventListener('pointerup', endDraw);
    canvas.addEventListener('pointerleave', endDraw);
    canvas.addEventListener('pointercancel', endDraw);
    canvas.addEventListener('contextmenu', (e)=> e.preventDefault());

    // 键盘快捷键
    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'p') setTool('pencil');
      else if (k === 'e') setTool('eraser');
      else if (k === 'f') setTool('fill');
      else if (k === 'i') setTool('dropper');
      else if (k === 'g') { gridToggle.checked = !gridToggle.checked; gridToggle.dispatchEvent(new Event('change')); }
      else if (k === 'l') setTool('line');
      else if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); undo(); }
      else if ((e.ctrlKey || e.metaKey) && (k === 'y' || (k === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
    });

    // 导出 PNG（不含网格，像素完美）
    exportBtn.addEventListener('click', () => {
      const scale = state.exportScale; // 可调导出倍数
      const ow = state.width * scale, oh = state.height * scale;
      const oc = document.createElement('canvas');
      oc.width = ow; oc.height = oh;
      const octx = oc.getContext('2d');
      if (state.bgImage && !state.transparentBg) {
        octx.save();
        octx.globalAlpha = clamp(state.bgOpacity, 0, 1);
        octx.drawImage(state.bgImage, 0, 0, ow, oh);
        octx.restore();
      } else {
        if (!state.transparentBg) {
          octx.fillStyle = '#ffffff';
          octx.fillRect(0,0,ow,oh);
        } else {
          octx.clearRect(0,0,ow,oh);
        }
      }
      for (let y=0; y<state.height; y++) {
        for (let x=0; x<state.width; x++) {
          const c = state.pixels[y*state.width + x];
          if (!c) continue;
          octx.fillStyle = c;
          octx.fillRect(x*scale, y*scale, scale, scale);
        }
      }
      const url = oc.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = url;
      a.download = `像素画_${state.width}x${state.height}.png`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    });

    // 导入背景图片并同步画布尺寸
    importBgBtn.addEventListener('click', () => imageInput.click());
    imageInput.addEventListener('change', () => {
      const file = imageInput.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        // 生成像素数据用于吸管
        const bw = img.naturalWidth, bh = img.naturalHeight;
        const bc = document.createElement('canvas');
        bc.width = bw; bc.height = bh;
        const bctx = bc.getContext('2d');
        bctx.drawImage(img, 0, 0);
        try {
          state.bgImageData = bctx.getImageData(0,0,bw,bh);
        } catch { state.bgImageData = null; }
        // 同步画布尺寸到图片大小
        pushHistorySnapshot();
        state.bgImage = img;
        state.width = bw; state.height = bh;
        wInput.value = bw; hInput.value = bh;
        createPixels(state.width, state.height);
        initCanvasSize();
        render();
        imageInput.value = '';
      };
      img.src = url;
    });
    // 像素化导入到画布（按当前尺寸）
    pixelImportBtn.addEventListener('click', () => pixelImageInput.click());
    pixelImageInput.addEventListener('change', () => {
      const file = pixelImageInput.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        const ow = state.width, oh = state.height;
        const oc = document.createElement('canvas');
        oc.width = ow; oc.height = oh;
        const octx = oc.getContext('2d');
        octx.imageSmoothingEnabled = false;
        octx.drawImage(img, 0, 0, ow, oh);
        const data = octx.getImageData(0, 0, ow, oh).data;
        pushHistorySnapshot();
        for (let y=0; y<oh; y++) {
          for (let x=0; x<ow; x++) {
            const off = (y*ow + x)*4;
            const r = data[off], g = data[off+1], b = data[off+2], a = data[off+3];
            if (a === 0) {
              state.pixels[y*ow + x] = null;
            } else {
              const hex = '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
              state.pixels[y*ow + x] = hex;
            }
          }
        }
        render();
        pixelImageInput.value = '';
      };
      img.src = url;
    });

    // 历史与工程保存/加载
    function makeSnapshot() {
      return { width: state.width, height: state.height, pixels: state.pixels.slice() };
    }
    function pushSnapshot(snap) {
      state.undoStack.push(snap);
      if (state.undoStack.length > state.maxHistory) state.undoStack.shift();
      state.redoStack = [];
    }
    function pushHistorySnapshot(){
      pushSnapshot(makeSnapshot());
    }
    function undo() {
      const snap = state.undoStack.pop();
      if (!snap) return;
      const cur = makeSnapshot();
      state.redoStack.push(cur);
      applySnapshot(snap);
    }
    function redo() {
      const snap = state.redoStack.pop();
      if (!snap) return;
      const cur = makeSnapshot();
      state.undoStack.push(cur);
      applySnapshot(snap);
    }
    function applySnapshot(snap) {
      if (snap.width !== state.width || snap.height !== state.height) {
        state.width = snap.width; state.height = snap.height;
        wInput.value = snap.width; hInput.value = snap.height;
        initCanvasSize();
      }
      state.pixels = snap.pixels.slice();
      render();
    }
    undoBtn.addEventListener('click', undo);
    redoBtn.addEventListener('click', redo);

    saveBtn.addEventListener('click', () => {
      const data = makeSnapshot();
      localStorage.setItem('pixel_board', JSON.stringify(data));
      // 同时生成可下载 JSON
      const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = '像素画工程.json';
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    });
    loadBtn.addEventListener('click', () => {
      const local = localStorage.getItem('pixel_board');
      if (local) {
        try { applySnapshot(JSON.parse(local)); } catch {}
      } else {
        fileInput.click();
      }
    });
    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try { const data = JSON.parse(reader.result); applySnapshot(data); } catch {}
        fileInput.value = '';
      };
      reader.readAsText(file);
    });

    // 初始化
    setTool('pencil');
    newCanvas();
    // 在初次布局后渲染
    requestAnimationFrame(render);
  </script>
</body>
</html>
