<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        :root {
            --bg: #f7f1ea;
            --panel: rgba(255,255,255,0.76);
            --panel-strong: rgba(255,255,255,0.92);
            --line: rgba(116,79,56,0.14);
            --text: #2f221d;
            --muted: #7c675d;
            --accent: #d7654d;
            --accent-deep: #b94a34;
            --accent-soft: #fde4dc;
            --shadow: 0 24px 60px rgba(95,61,42,0.12);
            --radius-xl: 28px;
            --radius-lg: 22px;
            --radius-md: 18px;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(255,221,202,0.92), transparent 30%),
                radial-gradient(circle at top right, rgba(255,243,224,0.9), transparent 26%),
                linear-gradient(180deg, #fffaf6 0%, #f6efe8 48%, #f4ece4 100%);
        }

        a { color: inherit; }

        .page-shell {
            width: min(1240px, calc(100vw - 32px));
            margin: 0 auto;
            padding: 32px 0 48px;
        }

        .hero {
            display: grid;
            gap: 14px;
            margin-bottom: 24px;
        }

        .hero-badge {
            width: fit-content;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(255,255,255,0.68);
            border: 1px solid rgba(185,74,52,0.14);
            color: var(--accent-deep);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        h1 {
            margin: 0;
            font-size: clamp(32px, 5vw, 54px);
            line-height: 1.04;
        }

        .hero-subtitle {
            margin: 0;
            max-width: 720px;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.7;
        }

        .upgrade-link {
            width: fit-content;
            padding: 14px 18px;
            border-radius: 18px;
            background: linear-gradient(135deg, #fff8f3 0%, #ffe7dd 100%);
            border: 1px solid rgba(215,101,77,0.16);
            box-shadow: 0 10px 28px rgba(185,74,52,0.08);
            text-decoration: none;
            font-weight: 700;
        }

        .content-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.12fr) minmax(360px, 0.88fr);
            gap: 22px;
            align-items: start;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow);
            backdrop-filter: blur(18px);
        }

        .panel-inner { padding: 24px; }

        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .section-head h2,
        .section-head h3 {
            margin: 0;
            font-size: 20px;
        }

        .section-head span {
            color: var(--muted);
            font-size: 13px;
        }

        .upload-card {
            position: relative;
            overflow: hidden;
            border: 1px dashed rgba(185,74,52,0.24);
            border-radius: 26px;
            background:
                radial-gradient(circle at right top, rgba(255,224,211,0.75), transparent 30%),
                linear-gradient(180deg, rgba(255,255,255,0.92) 0%, rgba(255,248,243,0.96) 100%);
            padding: 30px;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .upload-card:hover,
        .upload-card.dragover {
            transform: translateY(-2px);
            border-color: rgba(215,101,77,0.54);
            box-shadow: 0 18px 40px rgba(185,74,52,0.12);
        }

        .upload-emoji {
            width: 62px;
            height: 62px;
            display: grid;
            place-items: center;
            border-radius: 20px;
            background: var(--accent-soft);
            color: var(--accent-deep);
            font-size: 28px;
            margin-bottom: 18px;
        }

        .upload-card h2 {
            margin: 0 0 10px;
            font-size: 30px;
        }

        .upload-card p {
            margin: 0;
            color: var(--muted);
            line-height: 1.7;
        }

        .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 22px;
        }

        .btn {
            appearance: none;
            border: none;
            border-radius: 16px;
            padding: 13px 18px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.18s ease, opacity 0.18s ease, box-shadow 0.18s ease;
        }

        .btn:hover { transform: translateY(-1px); }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);
            color: #fff;
            box-shadow: 0 16px 34px rgba(185,74,52,0.2);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.9);
            color: var(--text);
            border: 1px solid rgba(116,79,56,0.12);
        }

        .status-bar {
            min-height: 24px;
            margin-top: 16px;
            color: var(--accent-deep);
            font-size: 14px;
            font-weight: 600;
        }

        .hidden { display: none; }

        .template-grid,
        .page-grid {
            display: grid;
            gap: 14px;
        }

        .template-grid {
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        }

        .template-card {
            position: relative;
            border-radius: 22px;
            background: var(--panel-strong);
            border: 1px solid transparent;
            padding: 12px;
            cursor: pointer;
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .template-card:hover,
        .template-card.active {
            transform: translateY(-2px);
            border-color: rgba(215,101,77,0.4);
            box-shadow: 0 14px 30px rgba(75,45,31,0.1);
        }

        .template-swatch,
        .template-preview {
            height: 160px;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(116,79,56,0.08);
        }

        .template-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .template-copy {
            display: grid;
            gap: 6px;
            margin-top: 12px;
        }

        .template-copy strong { font-size: 16px; }
        .template-copy span {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }

        .template-delete {
            position: absolute;
            top: 20px;
            right: 20px;
            border: none;
            border-radius: 999px;
            padding: 8px 12px;
            background: rgba(35,24,19,0.78);
            color: #fff;
            font-size: 12px;
            cursor: pointer;
        }

        .toolbar {
            display: none;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }

        .toolbar .btn { padding: 11px 15px; }

        .page-grid {
            grid-template-columns: repeat(auto-fit, minmax(138px, 1fr));
            max-height: 560px;
            overflow: auto;
            padding-right: 4px;
        }

        .page-card {
            appearance: none;
            width: 100%;
            text-align: left;
            border: 1px solid rgba(116,79,56,0.1);
            background: rgba(255,255,255,0.88);
            border-radius: 18px;
            padding: 10px;
            cursor: pointer;
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .page-card:hover,
        .page-card.current {
            transform: translateY(-2px);
            border-color: rgba(215,101,77,0.36);
            box-shadow: 0 10px 26px rgba(95,61,42,0.1);
        }

        .page-card.selected {
            background: linear-gradient(180deg, #fff9f5 0%, #ffece5 100%);
            border-color: rgba(215,101,77,0.54);
        }

        .page-thumb {
            display: block;
            aspect-ratio: 3 / 4;
            overflow: hidden;
            border-radius: 12px;
            background: #f4ece7;
        }

        .page-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .page-meta {
            display: grid;
            gap: 4px;
            margin-top: 10px;
        }

        .page-meta small { color: var(--muted); }

        .preview-shell {
            position: sticky;
            top: 22px;
        }

        .preview-stage {
            min-height: 620px;
            display: grid;
            place-items: center;
            border-radius: 28px;
            background:
                radial-gradient(circle at top, rgba(255,231,220,0.92), transparent 34%),
                linear-gradient(180deg, rgba(255,255,255,0.94) 0%, rgba(252,245,240,0.98) 100%);
            border: 1px solid rgba(116,79,56,0.1);
            padding: 20px;
        }

        .preview-stage img {
            width: min(100%, 360px);
            display: block;
            border-radius: 28px;
            box-shadow: 0 26px 54px rgba(55,35,25,0.16);
        }

        .preview-empty {
            color: var(--muted);
            text-align: center;
            line-height: 1.8;
        }

        .preview-toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 12px;
            margin-top: 18px;
        }

        .preview-toolbar .btn-row { margin-top: 0; }

        .page-counter {
            align-self: center;
            color: var(--muted);
            font-weight: 700;
        }

        .footer {
            margin-top: 28px;
            padding: 22px 24px;
            border-radius: 24px;
            background: rgba(255,255,255,0.72);
            border: 1px solid rgba(116,79,56,0.1);
            color: var(--muted);
            line-height: 1.8;
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            display: none;
            place-items: center;
            padding: 24px;
            background: rgba(42,28,21,0.24);
            backdrop-filter: blur(10px);
            z-index: 20;
        }

        .loading-overlay.show { display: grid; }

        .loading-card {
            width: min(360px, 100%);
            padding: 26px;
            border-radius: 24px;
            background: rgba(255,255,255,0.94);
            border: 1px solid rgba(116,79,56,0.12);
            box-shadow: var(--shadow);
        }

        .loading-card h3 {
            margin: 0 0 8px;
            font-size: 22px;
        }

        .loading-card p {
            margin: 0;
            color: var(--muted);
            line-height: 1.7;
        }

        @media (max-width: 980px) {
            .content-grid { grid-template-columns: 1fr; }
            .preview-shell { position: static; }
            .preview-stage { min-height: 420px; }
        }

        @media (max-width: 640px) {
            .page-shell { width: calc(100vw - 20px); padding-top: 18px; }
            .panel-inner, .footer { padding: 18px; }
            .upload-card { padding: 22px; }
            .upload-card h2 { font-size: 26px; }
        }
    </style>
</head>
<body>
    <main class="page-shell">
        <section class="hero">
            <div class="hero-badge" id="heroBadge">PDF / DOC / DOCX TO XHS</div>
            <h1 id="heroTitle"></h1>
            <p class="hero-subtitle" id="heroSubtitle"></p>
            <a class="upgrade-link" id="upgradeLink" href="https://xhs.yujianaigc.com" target="_blank" rel="noopener noreferrer"></a>
        </section>

        <section class="content-grid">
            <div class="left-col">
                <section class="panel">
                    <div class="panel-inner">
                        <div class="upload-card" id="uploadArea">
                            <div class="upload-emoji" id="uploadEmoji"></div>
                            <h2 id="uploadTitle"></h2>
                            <p id="uploadDesc"></p>
                            <div class="btn-row">
                                <button class="btn btn-primary" id="uploadBtn" type="button"></button>
                                <button class="btn btn-secondary" id="resetBtn" type="button"></button>
                            </div>
                            <input id="fileInput" type="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
                        </div>
                        <div class="status-bar" id="statusBar"></div>
                    </div>
                </section>

                <section class="panel hidden" id="templateSection" style="margin-top:22px;">
                    <div class="panel-inner">
                        <div class="section-head">
                            <h2 id="templateTitle"></h2>
                            <span id="templateHint"></span>
                        </div>
                        <div class="btn-row" style="margin:0 0 16px;">
                            <button class="btn btn-secondary" id="uploadTemplateBtn" type="button"></button>
                            <input id="customTemplateInput" type="file" accept="image/*" hidden>
                        </div>
                        <div class="template-grid" id="templateGrid"></div>
                    </div>
                </section>

                <section class="panel hidden" id="pagesSection" style="margin-top:22px;">
                    <div class="panel-inner">
                        <div class="section-head">
                            <h2 id="pagesTitle"></h2>
                            <span id="selectionMeta"></span>
                        </div>
                        <div class="toolbar" id="pageToolbar">
                            <button class="btn btn-secondary" id="selectFirstNineBtn" type="button"></button>
                            <button class="btn btn-secondary" id="selectAllBtn" type="button"></button>
                            <button class="btn btn-secondary" id="clearSelectionBtn" type="button"></button>
                        </div>
                        <div class="page-grid" id="pageGrid"></div>
                    </div>
                </section>
            </div>

            <aside class="preview-shell">
                <section class="panel">
                    <div class="panel-inner">
                        <div class="section-head">
                            <h3 id="previewTitle"></h3>
                            <span id="pageCounter">0 / 0</span>
                        </div>
                        <div class="preview-stage" id="previewFrame">
                            <div class="preview-empty" id="previewEmpty"></div>
                        </div>
                        <div class="preview-toolbar">
                            <div class="btn-row">
                                <button class="btn btn-secondary" id="prevBtn" type="button"></button>
                                <button class="btn btn-secondary" id="nextBtn" type="button"></button>
                            </div>
                            <div class="btn-row">
                                <button class="btn btn-secondary" id="downloadCurrentBtn" type="button"></button>
                                <button class="btn btn-primary" id="downloadSelectedBtn" type="button"></button>
                            </div>
                        </div>
                    </div>
                </section>

                <footer class="footer">
                    <div id="footerLine1"></div>
                    <div id="footerLine2"></div>
                    <div id="footerLine3"></div>
                </footer>
            </aside>
        </section>
    </main>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <h3 id="loadingTitle"></h3>
            <p id="loadingText"></p>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js";

        class App {
            constructor() {
                this.refs = {
                    heroTitle: document.getElementById("heroTitle"),
                    heroSubtitle: document.getElementById("heroSubtitle"),
                    upgradeLink: document.getElementById("upgradeLink"),
                    uploadEmoji: document.getElementById("uploadEmoji"),
                    uploadTitle: document.getElementById("uploadTitle"),
                    uploadDesc: document.getElementById("uploadDesc"),
                    uploadArea: document.getElementById("uploadArea"),
                    uploadBtn: document.getElementById("uploadBtn"),
                    resetBtn: document.getElementById("resetBtn"),
                    fileInput: document.getElementById("fileInput"),
                    statusBar: document.getElementById("statusBar"),
                    templateSection: document.getElementById("templateSection"),
                    templateTitle: document.getElementById("templateTitle"),
                    templateHint: document.getElementById("templateHint"),
                    uploadTemplateBtn: document.getElementById("uploadTemplateBtn"),
                    customTemplateInput: document.getElementById("customTemplateInput"),
                    templateGrid: document.getElementById("templateGrid"),
                    pagesSection: document.getElementById("pagesSection"),
                    pagesTitle: document.getElementById("pagesTitle"),
                    pageToolbar: document.getElementById("pageToolbar"),
                    pageGrid: document.getElementById("pageGrid"),
                    selectionMeta: document.getElementById("selectionMeta"),
                    selectFirstNineBtn: document.getElementById("selectFirstNineBtn"),
                    selectAllBtn: document.getElementById("selectAllBtn"),
                    clearSelectionBtn: document.getElementById("clearSelectionBtn"),
                    previewTitle: document.getElementById("previewTitle"),
                    previewFrame: document.getElementById("previewFrame"),
                    previewEmpty: document.getElementById("previewEmpty"),
                    pageCounter: document.getElementById("pageCounter"),
                    prevBtn: document.getElementById("prevBtn"),
                    nextBtn: document.getElementById("nextBtn"),
                    downloadCurrentBtn: document.getElementById("downloadCurrentBtn"),
                    downloadSelectedBtn: document.getElementById("downloadSelectedBtn"),
                    footerLine1: document.getElementById("footerLine1"),
                    footerLine2: document.getElementById("footerLine2"),
                    footerLine3: document.getElementById("footerLine3"),
                    loadingOverlay: document.getElementById("loadingOverlay"),
                    loadingTitle: document.getElementById("loadingTitle"),
                    loadingText: document.getElementById("loadingText")
                };

                this.text = {
                    title: "文档转小红书图片工具",
                    heroTitle: "文档一键转成更适合发布的小红书图片",
                    heroSubtitle: "支持 PDF、Word 文档上传，自动拆页、选择模板、批量导出。上传后默认勾选前 9 张，也可以按需切换单页下载和打包下载。",
                    upgradeLink: "升级版：xhs.yujianaigc.com",
                    uploadEmoji: "文",
                    uploadTitle: "选择文档开始转换",
                    uploadDesc: "拖拽文件到这里，或点击按钮上传。已修复按钮冒泡导致的重复触发问题，支持 PDF、DOC、DOCX。",
                    uploadBtn: "选择文档",
                    resetBtn: "重置内容",
                    templateTitle: "模板样式",
                    templateHint: "点击模板立即切换预览",
                    uploadTemplateBtn: "上传自定义模板",
                    pagesTitle: "页面选择",
                    selectFirstNineBtn: "默认前 9 张",
                    selectAllBtn: "全选",
                    clearSelectionBtn: "清空选择",
                    previewTitle: "成品预览",
                    previewEmpty: "上传文档后会在这里看到成品预览",
                    prevBtn: "上一页",
                    nextBtn: "下一页",
                    downloadCurrentBtn: "下载当前页",
                    downloadSelectedBtn: "打包下载已选",
                    footerLine1: "本工具由 遇见AIGC 制作",
                    footerLine2: "微信 yujianaigc",
                    footerLine3: "QQ邮箱 1042730028@qq.com",
                    loadingTitle: "处理中",
                    loadingText: "请稍候...",
                    warmName: "暖杏奶油",
                    warmNote: "适合知识卡片和封面摘要",
                    tealName: "清透青灰",
                    tealNote: "适合教程干货和步骤说明",
                    roseName: "柔粉白桃",
                    roseNote: "适合美妆情绪和生活方式内容",
                    forestName: "森系薄荷",
                    forestNote: "适合清单复盘和阅读摘记",
                    selectHintSelected: "已选中",
                    selectHintUnselected: "未选中",
                    pagePrefix: "第",
                    pageSuffix: "页",
                    chooseFileAlert: "请选择 PDF、DOC 或 DOCX 文件。",
                    parseFailedAlert: "没有成功解析出页面，请换一个文件再试。",
                    statusLoadedPrefix: "已载入 ",
                    statusLoadedMiddle: "，共 ",
                    statusLoadedPages: " 页，默认选中前 ",
                    statusLoadedTail: " 页。",
                    zipNeedSelect: "请先选择至少一页。",
                    imageOnlyAlert: "请上传 JPG、PNG 或 WebP 图片作为模板。",
                    customTemplateNote: "使用上传图片作为边框或底图",
                    templateAddedPrefix: "已添加模板：",
                    deleteTemplateConfirm: "确定删除这个自定义模板吗？",
                    loadingProcess: "正在处理文档",
                    loadingCurrentPage: "正在生成当前页",
                    loadingZip: "正在打包下载",
                    zipTotalPrefix: "共 ",
                    zipTotalSuffix: " 张图片",
                    zipProgressPrefix: "正在生成第 ",
                    zipProgressMiddle: " / ",
                    zipProgressSuffix: " 张",
                    pdfProgressPrefix: "PDF ",
                    pageThumbAltPrefix: "第 ",
                    pageThumbAltSuffix: " 页缩略图",
                    previewAltSuffix: " 页预览"
                };

                this.state = {
                    file: null,
                    pages: [],
                    currentPageIndex: 0,
                    selectedPageIndexes: new Set(),
                    selectedTemplateId: "warm",
                    busy: false,
                    customTemplates: this.loadCustomTemplates()
                };

                this.bindEvents();
                this.applyText();
                this.renderTemplates();
            }

            applyText() {
                document.title = this.text.title;
                this.refs.heroTitle.textContent = this.text.heroTitle;
                this.refs.heroSubtitle.textContent = this.text.heroSubtitle;
                this.refs.upgradeLink.textContent = this.text.upgradeLink;
                this.refs.uploadEmoji.textContent = this.text.uploadEmoji;
                this.refs.uploadTitle.textContent = this.text.uploadTitle;
                this.refs.uploadDesc.textContent = this.text.uploadDesc;
                this.refs.uploadBtn.textContent = this.text.uploadBtn;
                this.refs.resetBtn.textContent = this.text.resetBtn;
                this.refs.templateTitle.textContent = this.text.templateTitle;
                this.refs.templateHint.textContent = this.text.templateHint;
                this.refs.uploadTemplateBtn.textContent = this.text.uploadTemplateBtn;
                this.refs.pagesTitle.textContent = this.text.pagesTitle;
                this.refs.selectFirstNineBtn.textContent = this.text.selectFirstNineBtn;
                this.refs.selectAllBtn.textContent = this.text.selectAllBtn;
                this.refs.clearSelectionBtn.textContent = this.text.clearSelectionBtn;
                this.refs.previewTitle.textContent = this.text.previewTitle;
                this.refs.previewEmpty.textContent = this.text.previewEmpty;
                this.refs.prevBtn.textContent = this.text.prevBtn;
                this.refs.nextBtn.textContent = this.text.nextBtn;
                this.refs.downloadCurrentBtn.textContent = this.text.downloadCurrentBtn;
                this.refs.downloadSelectedBtn.textContent = this.text.downloadSelectedBtn;
                this.refs.footerLine1.textContent = this.text.footerLine1;
                this.refs.footerLine2.textContent = this.text.footerLine2;
                this.refs.footerLine3.textContent = this.text.footerLine3;
                this.refs.loadingTitle.textContent = this.text.loadingTitle;
                this.refs.loadingText.textContent = this.text.loadingText;
            }

            getTemplates() {
                return [
                    { id: "warm", type: "builtin", name: this.text.warmName, note: this.text.warmNote, swatch: "linear-gradient(160deg,#fff8f2 0%,#ffe3d0 100%)", bg: ["#fffaf5", "#fee7da"], line: "#e9b69d", accent: "#d55b47", text: "#5f463d" },
                    { id: "teal", type: "builtin", name: this.text.tealName, note: this.text.tealNote, swatch: "linear-gradient(160deg,#f2f7f8 0%,#dbe8eb 100%)", bg: ["#f7fbfc", "#dce9ec"], line: "#8bb2be", accent: "#3d7382", text: "#27424b" },
                    { id: "rose", type: "builtin", name: this.text.roseName, note: this.text.roseNote, swatch: "linear-gradient(160deg,#fff6f5 0%,#ffd9d4 100%)", bg: ["#fff8f8", "#ffd9d4"], line: "#f0a7a2", accent: "#df655c", text: "#5e3835" },
                    { id: "forest", type: "builtin", name: this.text.forestName, note: this.text.forestNote, swatch: "linear-gradient(160deg,#f4fbf8 0%,#dceee4 100%)", bg: ["#f9fdfb", "#dceee4"], line: "#9dbda7", accent: "#46795b", text: "#284235" }
                ].concat(this.state.customTemplates);
            }

            bindEvents() {
                this.refs.uploadBtn.addEventListener("click", (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    this.openFilePicker();
                });

                this.refs.resetBtn.addEventListener("click", () => this.reset(true));

                this.refs.uploadArea.addEventListener("click", (event) => {
                    if (!event.target.closest("button")) this.openFilePicker();
                });

                this.refs.uploadArea.addEventListener("dragover", (event) => {
                    event.preventDefault();
                    this.refs.uploadArea.classList.add("dragover");
                });

                this.refs.uploadArea.addEventListener("dragleave", () => {
                    this.refs.uploadArea.classList.remove("dragover");
                });

                this.refs.uploadArea.addEventListener("drop", async (event) => {
                    event.preventDefault();
                    this.refs.uploadArea.classList.remove("dragover");
                    const file = event.dataTransfer.files && event.dataTransfer.files[0];
                    if (file) await this.handleFile(file);
                });

                this.refs.fileInput.addEventListener("change", async (event) => {
                    const file = event.target.files && event.target.files[0];
                    if (file) await this.handleFile(file);
                    event.target.value = "";
                });

                this.refs.uploadTemplateBtn.addEventListener("click", () => this.openTemplatePicker());

                this.refs.customTemplateInput.addEventListener("change", async (event) => {
                    const file = event.target.files && event.target.files[0];
                    if (file) await this.addCustomTemplate(file);
                    event.target.value = "";
                });

                this.refs.prevBtn.addEventListener("click", () => this.changePage(-1));
                this.refs.nextBtn.addEventListener("click", () => this.changePage(1));
                this.refs.downloadCurrentBtn.addEventListener("click", () => this.downloadCurrentPage());
                this.refs.downloadSelectedBtn.addEventListener("click", () => this.downloadSelectedPages());

                this.refs.selectFirstNineBtn.addEventListener("click", () => {
                    this.state.selectedPageIndexes = new Set(this.state.pages.slice(0, 9).map((_, index) => index));
                    this.renderPageGrid();
                });

                this.refs.selectAllBtn.addEventListener("click", () => {
                    this.state.selectedPageIndexes = new Set(this.state.pages.map((_, index) => index));
                    this.renderPageGrid();
                });

                this.refs.clearSelectionBtn.addEventListener("click", () => {
                    this.state.selectedPageIndexes = new Set();
                    this.renderPageGrid();
                });
            }

            openFilePicker() {
                if (this.state.busy) return;
                this.refs.fileInput.value = "";
                this.refs.fileInput.click();
            }

            openTemplatePicker() {
                if (this.state.busy) return;
                this.refs.customTemplateInput.value = "";
                this.refs.customTemplateInput.click();
            }

            async handleFile(file) {
                if (this.state.busy) return;

                const ext = (file.name.split(".").pop() || "").toLowerCase();
                if (!["pdf", "doc", "docx"].includes(ext)) {
                    alert(this.text.chooseFileAlert);
                    return;
                }

                this.reset(false);
                this.state.file = file;

                await this.withLoading(this.text.loadingProcess, file.name, async () => {
                    if (ext === "pdf") await this.processPdf(file);
                    else await this.processWord(file);
                });

                if (!this.state.pages.length) {
                    alert(this.text.parseFailedAlert);
                    return;
                }

                this.state.selectedPageIndexes = new Set(this.state.pages.slice(0, 9).map((_, index) => index));
                this.refs.templateSection.classList.remove("hidden");
                this.refs.pagesSection.classList.remove("hidden");
                this.refs.pageToolbar.style.display = "flex";
                this.showStatus(`${this.text.statusLoadedPrefix}${file.name}${this.text.statusLoadedMiddle}${this.state.pages.length}${this.text.statusLoadedPages}${Math.min(9, this.state.pages.length)}${this.text.statusLoadedTail}`);
                this.renderTemplates();
                this.renderPageGrid();
                await this.renderPreview();
            }

            async processPdf(file) {
                const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
                const pages = [];

                for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
                    this.setLoadingText(`${this.text.pdfProgressPrefix}${pageNumber} / ${pdf.numPages}`);
                    const page = await pdf.getPage(pageNumber);
                    const viewport = page.getViewport({ scale: 1.8 });
                    const canvas = document.createElement("canvas");
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
                    pages.push({ image: canvas.toDataURL("image/png"), pageNumber });
                }

                this.state.pages = pages;
            }

            async processWord(file) {
                const result = await mammoth.convertToHtml({ arrayBuffer: await file.arrayBuffer() });
                const temp = document.createElement("div");
                temp.style.cssText = "position:fixed;left:-10000px;top:0;width:820px;padding:48px 56px;background:#fff;color:#222;line-height:1.8;font-family:'Microsoft YaHei','PingFang SC',sans-serif;box-sizing:border-box;";
                temp.innerHTML = result.value;
                document.body.appendChild(temp);

                try {
                    const canvas = await html2canvas(temp, {
                        scale: 2,
                        useCORS: true,
                        backgroundColor: "#ffffff",
                        width: temp.scrollWidth,
                        height: temp.scrollHeight,
                        windowWidth: temp.scrollWidth,
                        windowHeight: temp.scrollHeight
                    });

                    const sliceHeight = Math.max(1, Math.floor(canvas.width * (1000 / 750)));
                    const pages = [];
                    let y = 0;
                    let pageNumber = 1;

                    while (y < canvas.height) {
                        const height = Math.min(sliceHeight, canvas.height - y);
                        const pageCanvas = document.createElement("canvas");
                        pageCanvas.width = canvas.width;
                        pageCanvas.height = height;
                        pageCanvas.getContext("2d").drawImage(canvas, 0, y, canvas.width, height, 0, 0, canvas.width, height);
                        pages.push({ image: pageCanvas.toDataURL("image/png"), pageNumber });
                        y += height;
                        pageNumber += 1;
                    }

                    this.state.pages = pages;
                } finally {
                    temp.remove();
                }
            }

            renderTemplates() {
                const templates = this.getTemplates();

                this.refs.templateGrid.innerHTML = templates.map((template) => {
                    const active = template.id === this.state.selectedTemplateId ? "active" : "";
                    const preview = template.type === "custom"
                        ? `<div class="template-preview"><img src="${template.preview}" alt="${this.escape(template.name)}"></div>`
                        : `<div class="template-swatch" style="background:${template.swatch};"></div>`;
                    const deleteButton = template.type === "custom"
                        ? `<button class="template-delete" type="button" data-delete="${template.id}">删除</button>`
                        : "";

                    return `
                        <article class="template-card ${active}" data-template="${template.id}">
                            ${preview}
                            <div class="template-copy">
                                <strong>${this.escape(template.name)}</strong>
                                <span>${this.escape(template.note || "")}</span>
                            </div>
                            ${deleteButton}
                        </article>
                    `;
                }).join("");

                this.refs.templateGrid.querySelectorAll("[data-template]").forEach((card) => {
                    card.addEventListener("click", async (event) => {
                        if (event.target.closest("[data-delete]")) return;
                        this.state.selectedTemplateId = card.dataset.template;
                        this.renderTemplates();
                        if (this.state.pages.length) await this.renderPreview();
                    });
                });

                this.refs.templateGrid.querySelectorAll("[data-delete]").forEach((button) => {
                    button.addEventListener("click", (event) => {
                        event.stopPropagation();
                        this.deleteCustomTemplate(button.dataset.delete);
                    });
                });
            }

            renderPageGrid() {
                const { pages, currentPageIndex, selectedPageIndexes } = this.state;
                this.refs.selectionMeta.textContent = pages.length ? `已选择 ${selectedPageIndexes.size} 张` : "";

                this.refs.pageGrid.innerHTML = pages.map((page, index) => {
                    const selected = selectedPageIndexes.has(index) ? "selected" : "";
                    const current = index === currentPageIndex ? "current" : "";

                    return `
                        <button class="page-card ${selected} ${current}" type="button" data-page="${index}">
                            <span class="page-thumb"><img src="${page.image}" alt="${this.text.pageThumbAltPrefix}${page.pageNumber}${this.text.pageThumbAltSuffix}"></span>
                            <span class="page-meta">
                                <strong>${this.text.pagePrefix} ${page.pageNumber} ${this.text.pageSuffix}</strong>
                                <small>${selectedPageIndexes.has(index) ? this.text.selectHintSelected : this.text.selectHintUnselected}</small>
                            </span>
                        </button>
                    `;
                }).join("");

                this.refs.pageGrid.querySelectorAll("[data-page]").forEach((button) => {
                    button.addEventListener("click", async () => {
                        const index = Number(button.dataset.page);
                        this.state.currentPageIndex = index;
                        if (this.state.selectedPageIndexes.has(index)) this.state.selectedPageIndexes.delete(index);
                        else this.state.selectedPageIndexes.add(index);
                        this.renderPageGrid();
                        await this.renderPreview();
                    });
                });
            }

            async renderPreview() {
                const { pages, currentPageIndex } = this.state;

                if (!pages.length) {
                    this.refs.previewFrame.innerHTML = `<div class="preview-empty">${this.text.previewEmpty}</div>`;
                    this.refs.pageCounter.textContent = "0 / 0";
                    return;
                }

                const page = pages[currentPageIndex];
                const dataUrl = await this.composePage(page.image, currentPageIndex);
                this.refs.previewFrame.innerHTML = `<img src="${dataUrl}" alt="${this.text.pagePrefix} ${page.pageNumber}${this.text.previewAltSuffix}">`;
                this.refs.pageCounter.textContent = `${currentPageIndex + 1} / ${pages.length}`;
            }

            async changePage(step) {
                if (!this.state.pages.length) return;
                const next = this.state.currentPageIndex + step;
                if (next < 0 || next >= this.state.pages.length) return;
                this.state.currentPageIndex = next;
                this.renderPageGrid();
                await this.renderPreview();
            }

            async composePage(sourceImage, pageIndex) {
                const templates = this.getTemplates();
                const template = templates.find((item) => item.id === this.state.selectedTemplateId) || templates[0];
                const canvas = document.createElement("canvas");
                canvas.width = 750;
                canvas.height = 1000;
                const ctx = canvas.getContext("2d");
                const source = await this.loadImage(sourceImage);
                if (template.type === "custom") {
                    const frame = await this.loadImage(template.frame);
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);
                    this.drawImageFit(ctx, source, template.box.x, template.box.y, template.box.width, template.box.height, 20);
                } else {
                    const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                    gradient.addColorStop(0, template.bg[0]);
                    gradient.addColorStop(1, template.bg[1]);
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    ctx.strokeStyle = template.line;
                    ctx.lineWidth = 2;
                    ctx.strokeRect(28, 28, canvas.width - 56, canvas.height - 56);

                    ctx.fillStyle = "rgba(255,255,255,0.95)";
                    this.roundRect(ctx, 72, 96, 606, 808, 32);
                    ctx.fill();

                    this.drawImageFit(ctx, source, 92, 116, 566, 768, 24);
                }

                return canvas.toDataURL("image/png");
            }

            async downloadCurrentPage() {
                if (!this.state.pages.length) return;

                await this.withLoading(this.text.loadingCurrentPage, `${this.text.pagePrefix} ${this.state.currentPageIndex + 1} ${this.text.pageSuffix}`, async () => {
                    const dataUrl = await this.composePage(this.state.pages[this.state.currentPageIndex].image, this.state.currentPageIndex);
                    this.downloadDataUrl(dataUrl, `xhs-page-${this.state.currentPageIndex + 1}.png`);
                });
            }

            async downloadSelectedPages() {
                if (!this.state.selectedPageIndexes.size) {
                    alert(this.text.zipNeedSelect);
                    return;
                }

                const indexes = Array.from(this.state.selectedPageIndexes).sort((a, b) => a - b);
                await this.withLoading(this.text.loadingZip, `${this.text.zipTotalPrefix}${indexes.length}${this.text.zipTotalSuffix}`, async () => {
                    const zip = new JSZip();

                    for (let i = 0; i < indexes.length; i += 1) {
                        const index = indexes[i];
                        this.setLoadingText(`${this.text.zipProgressPrefix}${i + 1}${this.text.zipProgressMiddle}${indexes.length}${this.text.zipProgressSuffix}`);
                        const dataUrl = await this.composePage(this.state.pages[index].image, index);
                        zip.file(`xhs-page-${index + 1}.png`, this.dataUrlToBlob(dataUrl));
                    }

                    const blob = await zip.generateAsync({ type: "blob" });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement("a");
                    link.href = url;
                    link.download = "xhs-pages.zip";
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                    URL.revokeObjectURL(url);
                });
            }

            async addCustomTemplate(file) {
                if (!file.type.startsWith("image/")) {
                    alert(this.text.imageOnlyAlert);
                    return;
                }

                const preview = await this.fileToDataUrl(file);
                this.state.customTemplates.push({
                    id: `custom-${Date.now()}`,
                    type: "custom",
                    name: (file.name || "自定义模板").replace(/\.[^.]+$/, ""),
                    note: this.text.customTemplateNote,
                    preview,
                    frame: preview,
                    box: { x: 58, y: 120, width: 634, height: 760 }
                });
                this.saveCustomTemplates();
                this.renderTemplates();
                this.showStatus(`${this.text.templateAddedPrefix}${file.name}`);
            }

            deleteCustomTemplate(id) {
                if (!window.confirm(this.text.deleteTemplateConfirm)) return;
                this.state.customTemplates = this.state.customTemplates.filter((item) => item.id !== id);
                if (this.state.selectedTemplateId === id) this.state.selectedTemplateId = "warm";
                this.saveCustomTemplates();
                this.renderTemplates();
                if (this.state.pages.length) this.renderPreview();
            }

            drawImageFit(ctx, image, x, y, width, height, radius = 0) {
                const scale = Math.min(width / image.width, height / image.height);
                const drawWidth = image.width * scale;
                const drawHeight = image.height * scale;
                const dx = x + (width - drawWidth) / 2;
                const dy = y + (height - drawHeight) / 2;

                ctx.save();
                if (radius > 0) {
                    this.roundRect(ctx, x, y, width, height, radius);
                    ctx.clip();
                }
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(x, y, width, height);
                ctx.drawImage(image, dx, dy, drawWidth, drawHeight);
                ctx.restore();
            }

            roundRect(ctx, x, y, width, height, radius) {
                const r = Math.min(radius, width / 2, height / 2);
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.arcTo(x + width, y, x + width, y + height, r);
                ctx.arcTo(x + width, y + height, x, y + height, r);
                ctx.arcTo(x, y + height, x, y, r);
                ctx.arcTo(x, y, x + width, y, r);
                ctx.closePath();
            }

            shorten(text, max) {
                return text.length > max ? `${text.slice(0, max)}...` : text;
            }

            showStatus(message) {
                this.refs.statusBar.textContent = message || "";
            }

            setLoadingText(text) {
                this.refs.loadingText.textContent = text || "";
            }

            async withLoading(title, text, task) {
                this.state.busy = true;
                this.refs.loadingOverlay.classList.add("show");
                this.refs.loadingTitle.textContent = title || this.text.loadingTitle;
                this.refs.loadingText.textContent = text || "";
                try {
                    await task();
                } finally {
                    this.state.busy = false;
                    this.refs.loadingOverlay.classList.remove("show");
                }
            }

            reset(clearStatus = true) {
                this.state.file = null;
                this.state.pages = [];
                this.state.currentPageIndex = 0;
                this.state.selectedPageIndexes = new Set();
                this.refs.templateSection.classList.add("hidden");
                this.refs.pagesSection.classList.add("hidden");
                this.refs.pageToolbar.style.display = "none";
                this.refs.pageGrid.innerHTML = "";
                this.refs.previewFrame.innerHTML = `<div class="preview-empty">${this.text.previewEmpty}</div>`;
                this.refs.pageCounter.textContent = "0 / 0";
                this.refs.selectionMeta.textContent = "";
                if (clearStatus) this.showStatus("");
                this.renderTemplates();
            }

            loadCustomTemplates() {
                try {
                    const raw = localStorage.getItem("xhs-pdfframe-custom-templates");
                    const list = raw ? JSON.parse(raw) : [];
                    return Array.isArray(list)
                        ? list.filter((item) => item && item.type === "custom" && item.id && item.frame && item.box)
                        : [];
                } catch (error) {
                    return [];
                }
            }

            saveCustomTemplates() {
                localStorage.setItem("xhs-pdfframe-custom-templates", JSON.stringify(this.state.customTemplates));
            }

            fileToDataUrl(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            }

            loadImage(src) {
                return new Promise((resolve, reject) => {
                    const image = new Image();
                    image.onload = () => resolve(image);
                    image.onerror = reject;
                    image.src = src;
                });
            }

            dataUrlToBlob(dataUrl) {
                const [header, body] = dataUrl.split(",");
                const mimeMatch = header.match(/data:(.*?);base64/);
                const mime = mimeMatch ? mimeMatch[1] : "image/png";
                const binary = atob(body);
                const array = new Uint8Array(binary.length);

                for (let i = 0; i < binary.length; i += 1) {
                    array[i] = binary.charCodeAt(i);
                }

                return new Blob([array], { type: mime });
            }

            downloadDataUrl(dataUrl, filename) {
                const link = document.createElement("a");
                link.href = dataUrl;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                link.remove();
            }

            escape(text) {
                return String(text).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&apos;" }[char]));
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            new App();
        });
    </script>
</body>
