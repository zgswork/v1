        const showAnswerBtn = document.getElementById('showAnswerBtn');
        
        let currentQuestionIndex = -1;
        let previousQuestionIndex = -1;
        
        // 生成随机题目
        function generateRandomQuestion() {
            // 确保不重复上一题
            do {
                currentQuestionIndex = Math.floor(Math.random() * questions.length);
            } while (currentQuestionIndex === previousQuestionIndex && questions.length > 1);
            
            previousQuestionIndex = currentQuestionIndex;
            
            questionContainer.textContent = questions[currentQuestionIndex].question;
            answerContainer.style.display = 'none';
            generateBtn.textContent = '换一个';
        }
        
        // 显示答案
        function showAnswer() {
            if (currentQuestionIndex === -1) {
                alert('请先生成题目');
                return;
            }
            
            answerContainer.textContent = questions[currentQuestionIndex].answer;
            answerContainer.style.display = 'block';
        }
        
        // 事件监听
        generateBtn.addEventListener('click', generateRandomQuestion);
        showAnswerBtn.addEventListener('click', showAnswer);
