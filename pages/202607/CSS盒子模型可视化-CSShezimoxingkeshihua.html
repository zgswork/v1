<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CSS盒子模型可视化</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --panel: #ffffff;
      --text: #1b1f24;
      --muted-text: #4b5563;
      --border: #e5e7eb;
      --primary: #3b82f6;
      --btn-bg: #eef2ff;
      --btn-text: #1e293b;

      --margin-bg: rgba(245, 158, 11, 0.18); /* amber-500 */
      --padding-bg: rgba(34, 197, 94, 0.18); /* green-500 */
      --border-bg: rgba(59, 130, 246, 0.10); /* blue-500 light wash */
      --content-bg: rgba(167, 139, 250, 0.22); /* violet-400 */

      --tag-margin: #b45309;
      --tag-padding: #166534;
      --tag-border: #1d4ed8;
      --tag-content: #6d28d9;
    }
    [data-theme="dark"] {
      --bg: #0f1115;
      --panel: #12161e;
      --text: #e5e7eb;
      --muted-text: #9aa4b2;
      --border: #1f2937;
      --primary: #60a5fa;
      --btn-bg: #1f2330;
      --btn-text: #e5e7eb;

      --margin-bg: rgba(245, 158, 11, 0.22);
      --padding-bg: rgba(34, 197, 94, 0.22);
      --border-bg: rgba(59, 130, 246, 0.18);
      --content-bg: rgba(167, 139, 250, 0.28);

      --tag-margin: #f59e0b;
      --tag-padding: #22c55e;
      --tag-border: #60a5fa;
      --tag-content: #c084fc;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      background: var(--bg);
      color: var(--text);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }
    .topbar h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }
    .theme-btn {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--btn-bg);
      color: var(--btn-text);
      cursor: pointer;
    }
    .container {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) 1fr;
      gap: 16px;
      padding: 16px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .panel h2 {
      margin: 0 0 10px 0;
      font-size: 16px;
      font-weight: 600;
    }
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .control {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label { font-size: 13px; color: var(--muted-text); }
    input[type="number"], select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--text);
    }
    /* Color input: show native swatch clearly in light/dark modes */
    input[type="color"] {
      width: 100%;
      height: 34px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 6px; }
    input[type="color"]::-moz-color-swatch { border: none; border-radius: 6px; }
    input[type="color"]::-moz-focus-inner { border: 0; padding: 0; }
    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
    }
    .row-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }
    .row-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .row-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }
    .btn {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--btn-bg);
      color: var(--btn-text);
      cursor: pointer;
    }

    /* Preview area */
    .preview-area {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 10px;
      min-height: 380px;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: center;
      font-size: 12px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 10px;
      background: transparent;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .chip .label { color: var(--muted-text); }

    .canvas {
      display: grid;
      place-items: center;
      border: 1px dashed var(--border);
      border-radius: 12px;
      min-height: 280px;
      padding: 12px;
      background: linear-gradient(45deg, rgba(0,0,0,0.03), rgba(0,0,0,0.0));
    }
    .layer.tagged { position: relative; }
    .tag {
      position: absolute;
      top: 6px; left: 8px;
      font-size: 11px;
      padding: 3px 6px;
      border-radius: 6px;
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(2px);
      border: 1px solid var(--border);
    }
    [data-theme="dark"] .tag { background: rgba(16,18,24,0.5); }

    /* Layers */
    #margin-layer {
      background: var(--margin-bg);
      border-radius: 8px;
    }
    #border-layer {
      background: var(--border-bg);
      box-sizing: border-box; /* for border-box sizing case */
    }
    #padding-layer {
      background: var(--padding-bg);
    }
    #content-layer {
      background: var(--content-bg);
      display: grid;
      place-items: center;
      color: var(--text);
      font-size: 13px;
      border-radius: 4px;
      outline: 1px dotted rgba(0,0,0,0.2);
    }
    [data-theme="dark"] #content-layer { outline-color: rgba(255,255,255,0.18); }

    /* Details panel */
    .details-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .metric {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
    }
    .metric-title { color: var(--muted-text); font-size: 12px; }
    .code {
      margin-top: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      background: rgba(0,0,0,0.04);
      color: var(--text);
      overflow: auto;
      line-height: 1.6;
    }
    [data-theme="dark"] .code { background: rgba(255,255,255,0.04); }

    @media (max-width: 900px) {
      .container { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>CSS盒子模型可视化</h1>
    <button id="theme-toggle" class="theme-btn" aria-label="切换主题">🌞 浅/深</button>
  </header>

  <main class="container">
    <section class="panel">
      <h2>参数设置</h2>
      <div class="controls-grid">
        <div class="control">
          <label for="width">内容/边框宽度 (px)</label>
          <input id="width" type="number" min="0" value="240" />
        </div>
        <div class="control">
          <label for="height">内容/边框高度 (px)</label>
          <input id="height" type="number" min="0" value="140" />
        </div>
        <div class="control">
          <label for="boxSizing">box-sizing</label>
          <select id="boxSizing">
            <option value="content-box" selected>content-box（宽高指内容盒）</option>
            <option value="border-box">border-box（宽高指边框盒）</option>
          </select>
        </div>
        <div class="control">
          <label for="contentColor">内容背景色</label>
          <input id="contentColor" type="color" value="#a78bfa" />
        </div>

        <div class="control" style="grid-column: 1 / -1;">
          <label>内边距 Padding（上 右 下 左，单位px）</label>
          <div class="row-4">
            <input id="pTop" type="number" min="0" value="16" />
            <input id="pRight" type="number" min="0" value="16" />
            <input id="pBottom" type="number" min="0" value="16" />
            <input id="pLeft" type="number" min="0" value="16" />
          </div>
          <div class="row-4" style="margin-top:6px;">
            <input id="pTopRange" type="range" min="0" max="120" step="1" value="16" />
            <input id="pRightRange" type="range" min="0" max="120" step="1" value="16" />
            <input id="pBottomRange" type="range" min="0" max="120" step="1" value="16" />
            <input id="pLeftRange" type="range" min="0" max="120" step="1" value="16" />
          </div>
        </div>

        <div class="control" style="grid-column: 1 / -1;">
          <label>边框 Border（宽度/样式/颜色）</label>
          <div class="row-3">
            <input id="bWidth" type="number" min="0" value="8" />
            <select id="bStyle">
              <option value="solid" selected>solid</option>
              <option value="dashed">dashed</option>
              <option value="dotted">dotted</option>
              <option value="double">double</option>
            </select>
            <input id="bColor" type="color" value="#3b82f6" />
          </div>
          <div class="row-2" style="margin-top:6px;">
            <div style="grid-column: 1 / -1;">
              <input id="bWidthRange" type="range" min="0" max="40" step="1" value="8" />
            </div>
          </div>
        </div>

        <div class="control" style="grid-column: 1 / -1;">
          <label>外边距 Margin（上 右 下 左，单位px）</label>
          <div class="row-4">
            <input id="mTop" type="number" min="0" value="20" />
            <input id="mRight" type="number" min="0" value="20" />
            <input id="mBottom" type="number" min="0" value="20" />
            <input id="mLeft" type="number" min="0" value="20" />
          </div>
          <div class="row-4" style="margin-top:6px;">
            <input id="mTopRange" type="range" min="0" max="120" step="1" value="20" />
            <input id="mRightRange" type="range" min="0" max="120" step="1" value="20" />
            <input id="mBottomRange" type="range" min="0" max="120" step="1" value="20" />
            <input id="mLeftRange" type="range" min="0" max="120" step="1" value="20" />
          </div>
        </div>

        <div class="actions" style="grid-column: 1 / -1;">
          <button id="reset" class="btn">重置默认值</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>可视化预览</h2>
      <div class="preview-area">
        <div class="legend">
          <span class="chip"><span class="dot" style="background: var(--margin-bg)"></span><span class="label" style="color: var(--tag-margin)">Margin</span></span>
          <span class="chip"><span class="dot" style="background: var(--border-bg)"></span><span class="label" style="color: var(--tag-border)">Border</span></span>
          <span class="chip"><span class="dot" style="background: var(--padding-bg)"></span><span class="label" style="color: var(--tag-padding)">Padding</span></span>
          <span class="chip"><span class="dot" style="background: var(--content-bg)"></span><span class="label" style="color: var(--tag-content)">Content</span></span>
        </div>
        <div class="canvas" id="canvas">
          <div id="margin-layer" class="layer tagged">
            <span class="tag" style="color: var(--tag-margin)">margin</span>
            <div id="border-layer" class="layer tagged">
              <span class="tag" style="color: var(--tag-border)">border</span>
              <div id="padding-layer" class="layer tagged">
                <span class="tag" style="color: var(--tag-padding)">padding</span>
                <div id="content-layer" class="layer tagged">
                  <span class="tag" style="color: var(--tag-content)">content</span>
                  内容区域
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>尺寸计算与CSS代码</h2>
      <div class="details-grid">
        <div class="metric">
          <div class="metric-title">内容盒 (content-box)</div>
          <div id="metric-content">宽 0 × 高 0</div>
        </div>
        <div class="metric">
          <div class="metric-title">边框盒 (border-box)</div>
          <div id="metric-border">宽 0 × 高 0</div>
        </div>
        <div class="metric">
          <div class="metric-title">包含外边距的总尺寸</div>
          <div id="metric-total">宽 0 × 高 0</div>
        </div>
        <div class="metric">
          <div class="metric-title">各层合计（水平/垂直）</div>
          <div id="metric-sums">P: 0/0, B: 0/0, M: 0/0</div>
        </div>
      </div>
      <pre class="code" id="css-code"></pre>
    </section>
  </main>

  <script>
    // Theme toggle
    const root = document.documentElement;
    const themeToggleBtn = document.getElementById('theme-toggle');
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark' || savedTheme === 'light') {
      root.setAttribute('data-theme', savedTheme);
      themeToggleBtn.textContent = savedTheme === 'dark' ? '🌙 深/浅' : '🌞 浅/深';
    }
    themeToggleBtn.addEventListener('click', () => {
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      themeToggleBtn.textContent = next === 'dark' ? '🌙 深/浅' : '🌞 浅/深';
    });

    // Inputs
    const widthEl = document.getElementById('width');
    const heightEl = document.getElementById('height');
    const boxSizingEl = document.getElementById('boxSizing');
    const contentColorEl = document.getElementById('contentColor');
    const pTopEl = document.getElementById('pTop');
    const pRightEl = document.getElementById('pRight');
    const pBottomEl = document.getElementById('pBottom');
    const pLeftEl = document.getElementById('pLeft');
    const pTopRangeEl = document.getElementById('pTopRange');
    const pRightRangeEl = document.getElementById('pRightRange');
    const pBottomRangeEl = document.getElementById('pBottomRange');
    const pLeftRangeEl = document.getElementById('pLeftRange');
    const bWidthEl = document.getElementById('bWidth');
    const bStyleEl = document.getElementById('bStyle');
    const bColorEl = document.getElementById('bColor');
    const bWidthRangeEl = document.getElementById('bWidthRange');
    const mTopEl = document.getElementById('mTop');
    const mRightEl = document.getElementById('mRight');
    const mBottomEl = document.getElementById('mBottom');
    const mLeftEl = document.getElementById('mLeft');
    const mTopRangeEl = document.getElementById('mTopRange');
    const mRightRangeEl = document.getElementById('mRightRange');
    const mBottomRangeEl = document.getElementById('mBottomRange');
    const mLeftRangeEl = document.getElementById('mLeftRange');
    const resetBtn = document.getElementById('reset');

    // Layers
    const marginLayer = document.getElementById('margin-layer');
    const borderLayer = document.getElementById('border-layer');
    const paddingLayer = document.getElementById('padding-layer');
    const contentLayer = document.getElementById('content-layer');

    // Metrics
    const metricContent = document.getElementById('metric-content');
    const metricBorder = document.getElementById('metric-border');
    const metricTotal = document.getElementById('metric-total');
    const metricSums = document.getElementById('metric-sums');
    const cssCode = document.getElementById('css-code');

    function valInt(el) { return Math.max(parseInt(el.value || '0', 10) || 0, 0); }

    function update() {
      const w = valInt(widthEl);
      const h = valInt(heightEl);
      const boxSizing = boxSizingEl.value;
      const pTop = valInt(pTopEl), pRight = valInt(pRightEl), pBottom = valInt(pBottomEl), pLeft = valInt(pLeftEl);
      const bWidth = valInt(bWidthEl);
      const bStyle = bStyleEl.value;
      const bColor = bColorEl.value;
      const mTop = valInt(mTopEl), mRight = valInt(mRightEl), mBottom = valInt(mBottomEl), mLeft = valInt(mLeftEl);

      // Layer colors
      contentLayer.style.backgroundColor = hexToRgba(contentColorEl.value, root.getAttribute('data-theme') === 'dark' ? 0.28 : 0.22);

      // Margin visualized via outer padding on a wrapper
      marginLayer.style.paddingTop = mTop + 'px';
      marginLayer.style.paddingRight = mRight + 'px';
      marginLayer.style.paddingBottom = mBottom + 'px';
      marginLayer.style.paddingLeft = mLeft + 'px';

      // Border settings on the border layer
      borderLayer.style.borderWidth = bWidth + 'px';
      borderLayer.style.borderStyle = bStyle;
      borderLayer.style.borderColor = bColor;

      // Padding settings
      paddingLayer.style.paddingTop = pTop + 'px';
      paddingLayer.style.paddingRight = pRight + 'px';
      paddingLayer.style.paddingBottom = pBottom + 'px';
      paddingLayer.style.paddingLeft = pLeft + 'px';

      // Width / Height handling with box-sizing
      if (boxSizing === 'content-box') {
        contentLayer.style.width = w + 'px';
        contentLayer.style.height = h + 'px';
        borderLayer.style.width = '';
        borderLayer.style.height = '';
      } else {
        // border-box => set width/height on border layer to include padding + border
        borderLayer.style.width = w + 'px';
        borderLayer.style.height = h + 'px';
        contentLayer.style.width = '';
        contentLayer.style.height = '';
      }

      // Compute metrics
      const sumPadX = pLeft + pRight, sumPadY = pTop + pBottom;
      const sumBorderX = bWidth * 2, sumBorderY = bWidth * 2;
      const sumMarginX = mLeft + mRight, sumMarginY = mTop + mBottom;

      let contentW, contentH, borderW, borderH, totalW, totalH;
      if (boxSizing === 'content-box') {
        contentW = w; contentH = h;
        borderW = w + sumPadX + sumBorderX;
        borderH = h + sumPadY + sumBorderY;
      } else {
        borderW = w; borderH = h;
        contentW = Math.max(w - sumPadX - sumBorderX, 0);
        contentH = Math.max(h - sumPadY - sumBorderY, 0);
      }
      totalW = borderW + sumMarginX;
      totalH = borderH + sumMarginY;

      metricContent.textContent = `宽 ${contentW}px × 高 ${contentH}px`;
      metricBorder.textContent = `宽 ${borderW}px × 高 ${borderH}px`;
      metricTotal.textContent = `宽 ${totalW}px × 高 ${totalH}px`;
      metricSums.textContent = `P: ${sumPadX}/${sumPadY}, B: ${sumBorderX}/${sumBorderY}, M: ${sumMarginX}/${sumMarginY}`;

      // CSS code suggestion for a single element representation
      const css = [
        '/* 下方是对应单元素的CSS属性示例 */',
        '.box {',
        `  box-sizing: ${boxSizing};`,
        `  width: ${w}px;`,
        `  height: ${h}px;`,
        `  padding: ${pTop}px ${pRight}px ${pBottom}px ${pLeft}px;`,
        `  border: ${bWidth}px ${bStyle} ${bColor};`,
        `  margin: ${mTop}px ${mRight}px ${mBottom}px ${mLeft}px;`,
        `  background: ${contentColorEl.value};`,
        '}',
        boxSizing === 'border-box'
          ? `/* 小贴士：在 border-box 下，内容区域约为 ${contentW}px × ${contentH}px */`
          : `/* 小贴士：在 content-box 下，边框盒约为 ${borderW}px × ${borderH}px */`
      ].join('\n');
      cssCode.textContent = css;
    }

    function hexToRgba(hex, alpha = 1) {
      const m = hex.replace('#', '');
      const r = parseInt(m.substring(0,2), 16);
      const g = parseInt(m.substring(2,4), 16);
      const b = parseInt(m.substring(4,6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function addListeners() {
      [widthEl, heightEl, boxSizingEl, contentColorEl,
       pTopEl, pRightEl, pBottomEl, pLeftEl,
       pTopRangeEl, pRightRangeEl, pBottomRangeEl, pLeftRangeEl,
       bWidthEl, bStyleEl, bColorEl, bWidthRangeEl,
       mTopEl, mRightEl, mBottomEl, mLeftEl,
       mTopRangeEl, mRightRangeEl, mBottomRangeEl, mLeftRangeEl].forEach(el => {
        el.addEventListener('input', update);
        el.addEventListener('change', update);
      });

      const bindPair = (numEl, rangeEl) => {
        const clamp = (val, min, max) => Math.min(Math.max(val, min), max);
        numEl.addEventListener('input', () => {
          const v = clamp(valInt(numEl), parseInt(rangeEl.min,10), parseInt(rangeEl.max,10));
          rangeEl.value = v;
          update();
        });
        rangeEl.addEventListener('input', () => {
          numEl.value = rangeEl.value;
          update();
        });
        rangeEl.addEventListener('change', () => { numEl.value = rangeEl.value; update(); });
      };

      // Bind padding pairs
      bindPair(pTopEl, pTopRangeEl);
      bindPair(pRightEl, pRightRangeEl);
      bindPair(pBottomEl, pBottomRangeEl);
      bindPair(pLeftEl, pLeftRangeEl);

      // Bind border width
      bindPair(bWidthEl, bWidthRangeEl);

      // Bind margin pairs
      bindPair(mTopEl, mTopRangeEl);
      bindPair(mRightEl, mRightRangeEl);
      bindPair(mBottomEl, mBottomRangeEl);
      bindPair(mLeftEl, mLeftRangeEl);

      resetBtn.addEventListener('click', () => {
        widthEl.value = 240; heightEl.value = 140; boxSizingEl.value = 'content-box';
        pTopEl.value = 16; pRightEl.value = 16; pBottomEl.value = 16; pLeftEl.value = 16;
        pTopRangeEl.value = 16; pRightRangeEl.value = 16; pBottomRangeEl.value = 16; pLeftRangeEl.value = 16;
        bWidthEl.value = 8; bStyleEl.value = 'solid'; bColorEl.value = '#3b82f6';
        bWidthRangeEl.value = 8;
        mTopEl.value = 20; mRightEl.value = 20; mBottomEl.value = 20; mLeftEl.value = 20;
        mTopRangeEl.value = 20; mRightRangeEl.value = 20; mBottomRangeEl.value = 20; mLeftRangeEl.value = 20;
        contentColorEl.value = '#a78bfa';
        update();
      });
    }

    addListeners();
    update();
  </script>
</body>
</html>
