        .footer a { color: #0077cc; text-decoration: none; }

        .qr-wrapper { position: relative; display: inline-block; }

    </style>

    <script>
        // 配置 marked
        marked.setOptions({
            breaks: true,
            gfm: true,
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    try {
                        return hljs.highlight(code, { language: lang }).value;
                    } catch (err) {}
                }
                return hljs.highlightAuto(code).value;
            }
        });

        const markdownInput = document.getElementById('markdown-input');
        const previewContent = document.getElementById('preview-content');
        const charCount = document.getElementById('char-count');
        const wordCount = document.getElementById('word-count');
        const lineCount = document.getElementById('line-count');

        // 实时渲染 Markdown
        function renderMarkdown() {
            const markdownText = markdownInput.value;
            previewContent.innerHTML = marked.parse(markdownText);
            updateStats(markdownText);
        }

        // 更新统计信息
        function updateStats(text) {
            charCount.textContent = text.length;
            wordCount.textContent = text.trim() ? text.trim().split(/\s+/).length : 0;
            lineCount.textContent = text.split('\n').length;
        }

        // 监听输入
        markdownInput.addEventListener('input', renderMarkdown);

        // 清空内容
        function clearAll() {
            if (confirm('确定要清空所有内容吗?')) {
                markdownInput.value = '';
                renderMarkdown();
                showToast('内容已清空');
            }
        }

        // 加载示例
        function loadSample() {
            const sample = `# Markdown 示例文档

## 1. 文本格式

这是一段普通文本。你可以使用 **粗体**、*斜体*、~~删除线~~ 来强调内容。

你也可以使用 \`行内代码\` 来标记代码片段。

## 2. 列表

### 无序列表
- 项目 1
- 项目 2
  - 子项目 2.1
  - 子项目 2.2
- 项目 3

### 有序列表
1. 第一步
2. 第二步
3. 第三步

## 3. 代码块

\`\`\`javascript

    console.log(\`Hello, \${name}!\`);
}

greet('World');
\`\`\`

\`\`\`python
def fibonacci(n):
    if n <= 1:
        return n
    return fibonacci(n-1) + fibonacci(n-2)

print(fibonacci(10))
\`\`\`

## 4. 引用

> 这是一段引用文本。
>
> 引用可以包含多个段落。

## 5. 链接和图片

这是一个 [链接示例](https://www.example.com)

## 6. 表格

| 姓名 | 年龄 | 职业 |
|------|------|------|
| 张三 | 28 | 工程师 |
| 李四 | 32 | 设计师 |
| 王五 | 25 | 产品经理 |

## 7. 分隔线

---

## 8. 任务列表

- [x] 完成需求分析
- [x] 设计界面
- [ ] 编写代码
- [ ] 测试功能

---

**提示**: 点击"导出为图片"按钮可以将渲染后的内容保存为图片!`;

            markdownInput.value = sample;
            renderMarkdown();
            showToast('示例已加载');
        }

        // 导出为图片
        async function exportAsImage() {
            const button = event.target;
            const originalText = button.textContent;

            try {
                button.textContent = '生成中...';
                button.disabled = true;

                // 创建临时容器用于导出
                const exportContainer = document.createElement('div');
                exportContainer.style.cssText = `
                    position: fixed;
                    left: -9999px;
                    top: 0;
                    background: white;
                    padding: 40px;
                    width: 800px;
                    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
                                 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
                    line-height: 1.7;
                    color: #2d3748;
                `;
                exportContainer.innerHTML = previewContent.innerHTML;
                document.body.appendChild(exportContainer);

                // 使用 html2canvas 生成图片
                const canvas = await html2canvas(exportContainer, {
                    backgroundColor: '#ffffff',
                    scale: 2,
                    logging: false,
                    useCORS: true
                });

                // 移除临时容器
                document.body.removeChild(exportContainer);

                // 下载图片
                const link = document.createElement('a');
                const timestamp = new Date().toISOString().slice(0, 19).replace(/[:-]/g, '');
                link.download = `markdown-export-${timestamp}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();

                showToast('图片已导出成功!');
            } catch (error) {
                console.error('导出失败:', error);
                showToast('导出失败,请重试', 'error');
            } finally {
                button.textContent = originalText;
                button.disabled = false;
            }
        }

        // 导出为 PDF
        async function exportAsPDF() {
            const button = event.target;
            const originalText = button.textContent;

            try {
                button.textContent = '生成中...';
                button.disabled = true;

                // 创建临时容器用于导出
                const exportContainer = document.createElement('div');
                exportContainer.style.cssText = `
                    position: fixed;
                    left: -9999px;
                    top: 0;
                    background: white;
                    padding: 40px;
                    width: 800px;
                    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
                                 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
                    line-height: 1.7;
                    color: #2d3748;
                `;
                exportContainer.innerHTML = previewContent.innerHTML;
                document.body.appendChild(exportContainer);

                // 使用 html2canvas 生成图片
                const canvas = await html2canvas(exportContainer, {
                    backgroundColor: '#ffffff',
                    scale: 2,
                    logging: false,
                    useCORS: true
                });

                // 移除临时容器
                document.body.removeChild(exportContainer);

                // 创建 PDF
                const { jsPDF } = window.jspdf;
                const imgData = canvas.toDataURL('image/png');

                // A4 纸张尺寸 (210mm x 297mm)
                const pdfWidth = 210;
                const pdfHeight = 297;

                // 计算图片在 PDF 中的尺寸
                const imgWidth = pdfWidth;
                const imgHeight = (canvas.height * pdfWidth) / canvas.width;

                // 创建 PDF 文档
                const pdf = new jsPDF({
                    orientation: imgHeight > pdfWidth ? 'portrait' : 'portrait',
                    unit: 'mm',
                    format: 'a4'
                });

                // 如果内容高度超过一页,需要分页
                let heightLeft = imgHeight;
                let position = 0;

                // 添加第一页
                pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                heightLeft -= pdfHeight;

                // 添加剩余页面
                while (heightLeft > 0) {
                    position = heightLeft - imgHeight;
                    pdf.addPage();
                    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                    heightLeft -= pdfHeight;
                }

                // 下载 PDF
                const timestamp = new Date().toISOString().slice(0, 19).replace(/[:-]/g, '');
                pdf.save(`markdown-export-${timestamp}.pdf`);

                showToast('PDF已导出成功!');
            } catch (error) {
                console.error('导出失败:', error);
                showToast('导出失败,请重试', 'error');
            } finally {
                button.textContent = originalText;
                button.disabled = false;
            }
        }

        // 显示提示信息
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.background = type === 'success' ? '#28a745' : '#dc3545';
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // 页面加载时渲染初始内容
        window.addEventListener('load', () => {
            renderMarkdown();
        });

        // 支持 Tab 键缩进
        markdownInput.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 4;
            }
        });

        // Footer 初始化
        document.addEventListener('DOMContentLoaded', () => {
            const tpl = document.getElementById('site-footer');
            if (tpl && 'content' in tpl) {
                document.body.appendChild(tpl.content.cloneNode(true));
            }

            // 用 data-img 填充 <img src>
            document.querySelectorAll('.qr-wrapper').forEach(w => {
                const link = w.querySelector('.qr-link');
                const img  = w.querySelector('.qr-img');
                if (link && img && link.dataset.img) {
                    img.src = link.dataset.img.trim();
                }
            });
