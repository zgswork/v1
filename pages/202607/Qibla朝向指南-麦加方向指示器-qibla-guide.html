<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qibla朝向指南 - 麦加方向指示器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.2em;
            font-weight: 700;
        }

        .subtitle {
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .input-section {
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #34495e;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .input-row input {
            flex: 1;
        }

        button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 10px 5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .compass-container {
            margin: 30px 0;
            position: relative;
        }

        .compass {
            width: 250px;
            height: 250px;
            border: 8px solid #34495e;
            border-radius: 50%;
            margin: 0 auto;
            position: relative;
            background: radial-gradient(circle, #f8f9fa 0%, #e9ecef 100%);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .compass-needle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 100px;
            background: linear-gradient(to top, #e74c3c 0%, #c0392b 50%, #27ae60 50%, #229954 100%);
            transform-origin: bottom center;
            transform: translate(-50%, -100%) rotate(0deg);
            border-radius: 2px;
            transition: transform 0.5s ease;
            z-index: 2;
        }

        .compass-center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            background: #2c3e50;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
        }

        .compass-directions {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .direction {
            position: absolute;
            font-weight: bold;
            font-size: 18px;
            color: #2c3e50;
        }

        .direction.north {
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #e74c3c;
        }

        .direction.south {
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
        }

        .direction.east {
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
        }

        .direction.west {
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
        }

        .qibla-marker {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: #27ae60;
            color: white;
            padding: 4px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .qibla-marker.show {
            opacity: 1;
        }

        .result-section {
            margin-top: 20px;
            padding: 20px;
            background: rgba(52, 73, 94, 0.1);
            border-radius: 15px;
            display: none;
        }

        .result-section.show {
            display: block;
        }

        .result-item {
            margin: 10px 0;
            font-size: 16px;
        }

        .result-value {
            font-weight: bold;
            color: #2c3e50;
        }

        .error {
            color: #e74c3c;
            margin-top: 10px;
            font-weight: 600;
        }

        .footer {
            margin-top: 40px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            font-size: 14px;
            color: #7f8c8d;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
                margin: 10px;
            }

            h1 {
                font-size: 1.8em;
            }

            .compass {
                width: 200px;
                height: 200px;
            }

            .compass-needle {
                height: 80px;
            }

            .input-row {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🕌 Qibla朝向指南</h1>
        <p class="subtitle">准确指示麦加方向，助您正确礼拜</p>

        <div class="input-section">
            <div class="input-group">
                <label>选择定位方式：</label>
                <button onclick="toggleInputMode('coords')">经纬度坐标</button>
                <button onclick="toggleInputMode('city')">城市名称</button>
            </div>

            <div id="coords-input" class="input-mode">
                <div class="input-row">
                    <div class="input-group">
                        <label>纬度 (Latitude):</label>
                        <input type="number" id="latitude" placeholder="例: 39.9042" step="any">
                    </div>
                    <div class="input-group">
                        <label>经度 (Longitude):</label>
                        <input type="number" id="longitude" placeholder="例: 116.4074" step="any">
                    </div>
                </div>
            </div>

            <div id="city-input" class="input-mode" style="display: none;">
                <div class="input-group">
                    <label>城市名称:</label>
                    <input type="text" id="cityName" placeholder="例: 北京, Beijing, New York">
                </div>
            </div>

            <button onclick="calculateQibla()">🧭 计算朝向</button>
            <button onclick="getCurrentLocation()">📍 获取当前位置</button>
        </div>

        <div class="compass-container">
            <div class="compass">
                <div class="compass-directions">
                    <div class="direction north">N</div>
                    <div class="direction south">S</div>
                    <div class="direction east">E</div>
                    <div class="direction west">W</div>
                </div>
                <div class="qibla-marker" id="qiblaMarker">麦加</div>
                <div class="compass-needle" id="compassNeedle"></div>
                <div class="compass-center"></div>
            </div>
        </div>

        <div class="result-section" id="resultSection">
            <div class="result-item">
                <span>朝向角度: </span>
                <span class="result-value" id="qiblaAngle">--°</span>
            </div>
            <div class="result-item">
                <span>距离麦加: </span>
                <span class="result-value" id="distanceToMecca">-- km</span>
            </div>
            <div class="result-item">
                <span>方向描述: </span>
                <span class="result-value" id="directionDesc">--</span>
            </div>
        </div>

        <div class="error" id="errorMessage"></div>
    </div>

    <div class="footer">
        <p>📱 有任何问题请联系作者微信：<strong>xd135341</strong></p>
        <p>🕌 愿真主指引您的礼拜方向</p>
    </div>

    <script>
        // 麦加坐标 (沙特阿拉伯)
        const MECCA_LAT = 21.4225;
        const MECCA_LNG = 39.8262;

        let currentInputMode = 'coords';

        // 城市坐标数据库
        const cityCoordinates = {
            '北京': [39.9042, 116.4074],
            'beijing': [39.9042, 116.4074],
            '上海': [31.2304, 121.4737],
            'shanghai': [31.2304, 121.4737],
            '广州': [23.1291, 113.2644],
            'guangzhou': [23.1291, 113.2644],
            '深圳': [22.5431, 114.0579],
            'shenzhen': [22.5431, 114.0579],
            '杭州': [30.2741, 120.1551],
            'hangzhou': [30.2741, 120.1551],
            '南京': [32.0603, 118.7969],
            'nanjing': [32.0603, 118.7969],
            '成都': [30.5728, 104.0668],
            'chengdu': [30.5728, 104.0668],
            '西安': [34.3416, 108.9398],
            'xian': [34.3416, 108.9398],
            '武汉': [30.5928, 114.3055],
            'wuhan': [30.5928, 114.3055],
            '重庆': [29.5630, 106.5516],
            'chongqing': [29.5630, 106.5516],
            'new york': [40.7128, -74.0060],
            'london': [51.5074, -0.1278],
            'paris': [48.8566, 2.3522],
            'tokyo': [35.6762, 139.6503],
            'dubai': [25.2048, 55.2708],
            'istanbul': [41.0082, 28.9784],
            'cairo': [30.0444, 31.2357],
            'riyadh': [24.7136, 46.6753],
            'jakarta': [6.2088, 106.8456],
            'kuala lumpur': [3.1390, 101.6869],
            'singapore': [1.3521, 103.8198],
            'sydney': [33.8688, 151.2093],
            'melbourne': [37.8136, 144.9631],
            'toronto': [43.6532, -79.3832],
            'vancouver': [49.2827, -123.1207]
        };

        function toggleInputMode(mode) {
            currentInputMode = mode;
            const coordsInput = document.getElementById('coords-input');
            const cityInput = document.getElementById('city-input');
            
            if (mode === 'coords') {
                coordsInput.style.display = 'block';
                cityInput.style.display = 'none';
            } else {
                coordsInput.style.display = 'none';
                cityInput.style.display = 'block';
            }
            
            clearError();
        }

        function showError(message) {
            document.getElementById('errorMessage').textContent = message;
        }

        function clearError() {
            document.getElementById('errorMessage').textContent = '';
        }

        function getCurrentLocation() {
            if (!navigator.geolocation) {
                showError('您的浏览器不支持地理定位功能');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    document.getElementById('latitude').value = lat.toFixed(6);
                    document.getElementById('longitude').value = lng.toFixed(6);
                    
                    toggleInputMode('coords');
                    calculateQibla();
                },
                function(error) {
                    let errorMsg = '无法获取位置信息: ';
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            errorMsg += '用户拒绝了地理定位请求';
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMsg += '位置信息不可用';
                            break;
                        case error.TIMEOUT:
                            errorMsg += '获取位置信息超时';
                            break;
                        default:
                            errorMsg += '未知错误';
                            break;
                    }
                    showError(errorMsg);
                }
            );
        }

        function getCityCoordinates(cityName) {
            const normalizedCity = cityName.toLowerCase().trim();
            return cityCoordinates[normalizedCity] || null;
        }

        function calculateQibla() {
            clearError();
            
            let lat, lng;
            
            if (currentInputMode === 'coords') {
                lat = parseFloat(document.getElementById('latitude').value);
                lng = parseFloat(document.getElementById('longitude').value);
                
                if (isNaN(lat) || isNaN(lng)) {
                    showError('请输入有效的经纬度坐标');
                    return;
                }
                
                if (lat < -90 || lat > 90) {
                    showError('纬度必须在 -90 到 90 之间');
                    return;
                }
                
                if (lng < -180 || lng > 180) {
                    showError('经度必须在 -180 到 180 之间');
                    return;
                }
            } else {
                const cityName = document.getElementById('cityName').value.trim();
                if (!cityName) {
                    showError('请输入城市名称');
                    return;
                }
                
                const coords = getCityCoordinates(cityName);
                if (!coords) {
                    showError('未找到该城市的坐标信息，请尝试使用经纬度输入');
                    return;
                }
                
                lat = coords[0];
                lng = coords[1];
            }

            // 计算朝向角度和距离
            const qiblaData = calculateQiblaDirection(lat, lng);
            
            // 更新界面显示
            updateCompass(qiblaData.bearing);
            updateResults(qiblaData);
        }

        function calculateQiblaDirection(lat, lng) {
            // 将度数转换为弧度
            const lat1 = toRadians(lat);
            const lng1 = toRadians(lng);
            const lat2 = toRadians(MECCA_LAT);
            const lng2 = toRadians(MECCA_LNG);

            // 计算方位角 (bearing)
            const dLng = lng2 - lng1;
            const y = Math.sin(dLng) * Math.cos(lat2);
            const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLng);
            
            let bearing = Math.atan2(y, x);
            bearing = toDegrees(bearing);
            bearing = (bearing + 360) % 360; // 确保角度为正数

            // 计算距离 (使用 Haversine 公式)
            const R = 6371; // 地球半径 (km)
            const dLat = lat2 - lat1;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                     Math.cos(lat1) * Math.cos(lat2) *
                     Math.sin(dLng/2) * Math.sin(dLng/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            const distance = R * c;

            return {
                bearing: bearing,
                distance: distance,
                direction: getDirectionDescription(bearing)
            };
        }

        function toRadians(degrees) {
            return degrees * (Math.PI / 180);
        }

        function toDegrees(radians) {
            return radians * (180 / Math.PI);
        }

        function getDirectionDescription(bearing) {
            const directions = [
                { name: '北', min: 0, max: 11.25 },
                { name: '北北东', min: 11.25, max: 33.75 },
                { name: '东北', min: 33.75, max: 56.25 },
                { name: '东北东', min: 56.25, max: 78.75 },
                { name: '东', min: 78.75, max: 101.25 },
                { name: '东南东', min: 101.25, max: 123.75 },
                { name: '东南', min: 123.75, max: 146.25 },
                { name: '南南东', min: 146.25, max: 168.75 },
                { name: '南', min: 168.75, max: 191.25 },
                { name: '南南西', min: 191.25, max: 213.75 },
                { name: '西南', min: 213.75, max: 236.25 },
                { name: '西南西', min: 236.25, max: 258.75 },
                { name: '西', min: 258.75, max: 281.25 },
                { name: '西北西', min: 281.25, max: 303.75 },
                { name: '西北', min: 303.75, max: 326.25 },
                { name: '北北西', min: 326.25, max: 348.75 },
                { name: '北', min: 348.75, max: 360 }
            ];

            for (let dir of directions) {
                if (bearing >= dir.min && bearing < dir.max) {
                    return dir.name;
                }
            }
            return '北';
        }

        function updateCompass(bearing) {
            const needle = document.getElementById('compassNeedle');
            const marker = document.getElementById('qiblaMarker');
            
            // 旋转指针指向麦加方向
            needle.style.transform = `translate(-50%, -100%) rotate(${bearing}deg)`;
            
            // 显示麦加标记
            marker.classList.add('show');
            
            // 旋转麦加标记到正确位置
            const markerAngle = bearing - 90; // 调整标记位置
            const radius = 110; // 标记距离中心的距离
            const x = Math.cos(toRadians(markerAngle)) * radius;
            const y = Math.sin(toRadians(markerAngle)) * radius;
            
            marker.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
        }

        function updateResults(qiblaData) {
            document.getElementById('qiblaAngle').textContent = qiblaData.bearing.toFixed(1) + '°';
            document.getElementById('distanceToMecca').textContent = qiblaData.distance.toFixed(0) + ' km';
            document.getElementById('directionDesc').textContent = qiblaData.direction;
            
            document.getElementById('resultSection').classList.add('show');
        }

        // 页面加载完成后的初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 设置默认示例坐标 (北京)
            document.getElementById('latitude').value = '39.9042';
            document.getElementById('longitude').value = '116.4074';
        });
    </script>
</body>
</html>
