<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>单词卡片</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #0b1220;
      --card: #111827;
      --card-fore: #ffffff;
      --brand: #4f46e5;
      --brand-2: #22d3ee;
      --muted: #94a3b8;
      --border: #1f2937;
      --good: #10b981;
      --bad: #ef4444;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, var(--bg), #111827 60%);
      color: var(--card-fore);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px;
    }

    .title {
      font-weight: 700;
      letter-spacing: 0.5px;
      text-align: center;
      background: linear-gradient(90deg, var(--brand), var(--brand-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-size: clamp(18px, 3.5vw, 28px);
    }

    .card-wrap {
      perspective: 1200px;
      width: min(92vw, 560px);
      height: clamp(200px, 48vh, 360px);
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.35);
      overflow: hidden;
      border: 1px solid var(--border);
      background: radial-gradient(1200px 500px at 10% 0%, #0e1a34 0%, var(--card) 35%, #0b1220 75%);
    }

    .card-inner {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(.2,.65,.22,1);
    }

    .card-inner.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      inset: 0;
      padding: clamp(16px, 3.5vw, 24px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      backface-visibility: hidden;
    }

    .label {
      font-size: clamp(12px, 2.6vw, 14px);
      color: var(--muted);
      letter-spacing: .5px;
    }

    .front .term {
      font-weight: 800;
      text-align: center;
      line-height: 1.25;
      font-size: clamp(24px, 8vw, 40px);
    }

    .back { transform: rotateY(180deg); }
    .back .def {
      text-align: center;
      line-height: 1.5;
      font-size: clamp(16px, 5.6vw, 22px);
    }

    .progress {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--muted);
    }

    .bar {
      position: relative;
      height: 6px;
      width: min(70vw, 360px);
      background: #0b1220;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .bar > span {
      position: absolute;
      inset: 0 0 0 0;
      width: var(--pct, 0%);
      background: linear-gradient(90deg, var(--brand), var(--brand-2));
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
    }
    button {
      appearance: none;
      border: 1px solid var(--border);
      background: #0b1220;
      color: #e5e7eb;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      transition: transform .05s ease, background .2s ease, border-color .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover { background: #111827; border-color: #1f2937; }
    button:active { transform: translateY(1px); }
    button.primary { background: linear-gradient(90deg, var(--brand), var(--brand-2)); border-color: transparent; color: white; }

    .editor {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 10px;
      width: min(92vw, 560px);
    }
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b1220;
      color: #e5e7eb;
      font-size: 14px;
    }

    .tips {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 420px) {
      .editor { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="title">单词卡片 · 可翻转记忆工具</div>

    <!-- 工具栏：搜索、导入/导出、仅未掌握 -->
    <div class="toolbar" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;width:min(92vw,560px)">
      <input type="text" id="searchInput" placeholder="搜索：单词或释义（/ 聚焦）" autocomplete="off" style="flex:1;min-width:200px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:#0b1220;color:#e5e7eb;font-size:14px;" />
      <button id="onlyUnknownBtn" title="仅显示未掌握（F）">仅未掌握</button>
      <button id="importBtn" title="导入（I）">导入</button>
      <button id="exportBtn" title="导出（E）">导出</button>
    </div>

    <div class="card-wrap">
      <div class="card" id="card">
        <div class="card-inner" id="cardInner">
          <div class="card-face front">
            <div class="label">正面 · 单词 / 概念</div>
            <div class="term" id="term">Loading...</div>
            <div class="known-badge" id="knownBadgeFront" aria-hidden="true" style="position:absolute;top:10px;right:10px;font-size:12px;color:#10b981;display:none">已掌握</div>
          </div>
          <div class="card-face back">
            <div class="label">背面 · 释义 / 提示</div>
            <div class="def" id="def">Loading...</div>
            <div class="known-badge" id="knownBadgeBack" aria-hidden="true" style="position:absolute;top:10px;right:10px;font-size:12px;color:#10b981;display:none">已掌握</div>
          </div>
        </div>
      </div>
    </div>

    <div class="progress">
      <div id="counter">0 / 0</div>
      <div class="bar" aria-hidden="true"><span id="barFill" style="--pct:0%"></span></div>
    </div>

    <div class="controls">
      <button id="prevBtn" title="上一张（←）">上一张</button>
      <button id="flipBtn" class="primary" title="翻转（空格）">翻转</button>
      <button id="nextBtn" title="下一张（→）">下一张</button>
      <button id="shuffleBtn" title="随机（S）">随机</button>
      <button id="deleteBtn" title="删除当前（D）" style="border-color:#3f3f46;color:#d1d5db">删除当前</button>
      <button id="markKnownBtn" title="标记为掌握（K）" style="border-color:#065f46;color:#a7f3d0">标记掌握</button>
      <button id="unmarkKnownBtn" title="取消掌握（U）" style="border-color:#6b7280;color:#e5e7eb">取消掌握</button>
    </div>

    <div class="editor">
      <input type="text" id="wordInput" placeholder="单词 / 概念" autocomplete="off" />
      <input type="text" id="meaningInput" placeholder="释义 / 提示" autocomplete="off" />
      <button id="addBtn" class="primary">添加</button>
    </div>

    <div class="tips">快捷键：← → 切换，空格翻转，S 随机，D 删除</div>

    <!-- 导入弹窗 -->
    <div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter: blur(2px);z-index:50;align-items:center;justify-content:center;padding:16px;">
      <div style="width:min(92vw,640px);background:#0b1220;border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:0 20px 40px rgba(0,0,0,.35);color:#e5e7eb;">
        <div style="font-weight:700;margin-bottom:8px">导入卡片</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:8px">支持两种格式：
          <br/>1) 文本每行：单词 分隔符 释义（分隔符可为逗号、冒号、短横线、制表符）
          <br/>2) JSON：如 [{"term":"hello","def":"你好","known":false}]
        </div>
        <textarea id="importText" placeholder="在此粘贴文本或JSON" style="width:100%;min-height:160px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:#0b1220;color:#e5e7eb;font-size:14px;resize:vertical"></textarea>
        <div style="display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:10px">
          <label style="font-size:12px;color:var(--muted)"><input type="checkbox" id="importAppend" checked style="vertical-align:middle;margin-right:6px"/>追加到现有卡组（取消则会覆盖）</label>
          <div style="display:flex;gap:10px">
            <button id="importConfirmBtn" class="primary">确认导入</button>
            <button id="importCancelBtn">取消</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 初始示例卡片
    const defaultDeck = [
      { term: 'hello', def: '你好；用于问候', known: false },
      { term: 'world', def: '世界；人类社会与自然界的总称', known: false },
      { term: 'apple', def: '苹果；一种常见的水果', known: false },
      { term: 'concept', def: '概念；对事物的抽象认识', known: false },
      { term: 'algorithm', def: '算法；解决问题的明确步骤集合', known: false }
    ];

    const LS_KEY = 'wordCardsDeck.v1';
    const LS_IDX = 'wordCardsIndex.v1';

    const cardInner = document.getElementById('cardInner');
    const termEl = document.getElementById('term');
    const defEl = document.getElementById('def');
    const counterEl = document.getElementById('counter');
    const barFill = document.getElementById('barFill');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const flipBtn = document.getElementById('flipBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const deleteBtn = document.getElementById('deleteBtn');
    const markKnownBtn = document.getElementById('markKnownBtn');
    const unmarkKnownBtn = document.getElementById('unmarkKnownBtn');
    const wordInput = document.getElementById('wordInput');
    const meaningInput = document.getElementById('meaningInput');
    const addBtn = document.getElementById('addBtn');
    const searchInput = document.getElementById('searchInput');
    const onlyUnknownBtn = document.getElementById('onlyUnknownBtn');
    const importBtn = document.getElementById('importBtn');
    const exportBtn = document.getElementById('exportBtn');
    const modal = document.getElementById('modal');
    const importText = document.getElementById('importText');
    const importAppend = document.getElementById('importAppend');
    const importConfirmBtn = document.getElementById('importConfirmBtn');
    const importCancelBtn = document.getElementById('importCancelBtn');
    const knownBadgeFront = document.getElementById('knownBadgeFront');
    const knownBadgeBack = document.getElementById('knownBadgeBack');

    let deck = [];
    let index = 0; // 当前视图索引（可能为过滤后的视图）
    let searchTerm = '';
    let onlyUnknown = false;

    function buildView() {
      let list = deck;
      if (searchTerm) {
        const q = searchTerm.toLowerCase();
        list = list.filter(item => (item.term||'').toLowerCase().includes(q) || (item.def||'').toLowerCase().includes(q));
      }
      if (onlyUnknown) {
        list = list.filter(item => !item.known);
      }
      return list;
    }

    function load() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        deck = raw ? JSON.parse(raw) : defaultDeck.slice();
        // 兼容旧数据：补充 known 字段
        deck.forEach(d => { if (typeof d.known !== 'boolean') d.known = false; });
      } catch (e) { deck = defaultDeck.slice(); }
      try {
        const i = localStorage.getItem(LS_IDX);
        index = i ? Math.min(Math.max(parseInt(i,10)||0,0), Math.max(deck.length-1,0)) : 0;
      } catch (e) { index = 0; }
    }
    function save() {
      localStorage.setItem(LS_KEY, JSON.stringify(deck));
      // 仅在无过滤情况下保存索引
      const viewFiltered = !!searchTerm || onlyUnknown;
      if (!viewFiltered) localStorage.setItem(LS_IDX, String(index));
    }

    function clampIndex(view) {
      if (view.length === 0) { index = 0; return; }
      if (index < 0) index = view.length - 1;
      if (index >= view.length) index = 0;
    }

    function render() {
      const view = buildView();
      clampIndex(view);
      const empty = view.length === 0;
      const cur = empty ? {term: '暂无卡片', def: '请在下方添加内容', known:false} : view[index];
      termEl.textContent = cur.term || '';
      defEl.textContent = cur.def || '';
      counterEl.textContent = `${empty?0:index+1} / ${view.length}`;
      const pct = view.length ? ((index+1)/view.length*100).toFixed(2) + '%' : '0%';
      barFill.style.setProperty('--pct', pct);

      // 按钮可用状态
      prevBtn.disabled = empty || view.length <= 1;
      nextBtn.disabled = empty || view.length <= 1;
      shuffleBtn.disabled = deck.length <= 1; // 洗牌基于原始 deck
      deleteBtn.disabled = empty;

      // 掌握徽标与按钮状态
      const showKnown = !!cur.known;
      knownBadgeFront.style.display = showKnown ? 'block' : 'none';
      knownBadgeBack.style.display = showKnown ? 'block' : 'none';
      markKnownBtn.disabled = empty || showKnown;
      unmarkKnownBtn.disabled = empty || !showKnown;
    }

    function flip() { cardInner.classList.toggle('flipped'); }
    function resetFlip() { cardInner.classList.remove('flipped'); }
    function next() { index++; resetFlip(); render(); save(); }
    function prev() { index--; resetFlip(); render(); save(); }
    function shuffle() {
      // Fisher–Yates 洗牌
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      index = 0;
      resetFlip();
      render();
      save();
    }

    function add() {
      const t = wordInput.value.trim();
      const d = meaningInput.value.trim();
      if (!t || !d) {
        // 简单反馈动画
        [wordInput, meaningInput].forEach(el => { el.style.borderColor = '#ef4444'; setTimeout(() => el.style.borderColor = 'var(--border)', 400); });
        return;
      }
      deck.push({ term: t, def: d, known: false });
      wordInput.value = '';
      meaningInput.value = '';
      // 若当前视图有过滤，新增卡可能不在视图中
      index = deck.length - 1;
      resetFlip();
      render();
      save();
      addBtn.blur();
    }

    function del() {
      const view = buildView();
      if (view.length === 0) return;
      const cur = view[index];
      const realIdx = deck.indexOf(cur);
      if (realIdx >= 0) deck.splice(realIdx, 1);
      index = Math.min(index, Math.max(buildView().length - 1, 0));
      resetFlip();
      render();
      save();
    }

    function markKnown(known=true) {
      const view = buildView();
      if (view.length === 0) return;
      view[index].known = !!known;
      render();
      save();
    }

    function setSearch(value) {
      searchTerm = value.trim();
      index = 0;
      render();
      // 不保存索引，因为视图为过滤态
      localStorage.setItem(LS_KEY, JSON.stringify(deck));
    }

    function toggleOnlyUnknown() {
      onlyUnknown = !onlyUnknown;
      onlyUnknownBtn.classList.toggle('primary', onlyUnknown);
      index = 0;
      render();
      localStorage.setItem(LS_KEY, JSON.stringify(deck));
    }

    function openModal() { modal.style.display = 'flex'; importText.value=''; }
    function closeModal() { modal.style.display = 'none'; }

    function parseImport(text) {
      const trimmed = text.trim();
      if (!trimmed) return [];
      // JSON
      if (trimmed.startsWith('[') || trimmed.startsWith('{')) {
        try {
          const data = JSON.parse(trimmed);
          const arr = Array.isArray(data) ? data : [data];
          return arr.map(x => ({ term: String(x.term||'').trim(), def: String(x.def||'').trim(), known: !!x.known })).filter(x => x.term && x.def);
        } catch (e) { alert('JSON 解析失败'); return []; }
      }
      // 文本行
      const lines = trimmed.split(/\r?\n/);
      const res = [];
      for (const line of lines) {
        const l = line.trim(); if (!l) continue;
        const parts = l.split(/\t|\s*[,;:\-]\s*/);
        const term = (parts[0]||'').trim();
        const def = (parts.slice(1).join(' ')||'').trim();
        if (term && def) res.push({ term, def, known: false });
      }
      return res;
    }

    function doImport() {
      const items = parseImport(importText.value);
      if (!items.length) { alert('没有可导入的项目'); return; }
      if (importAppend.checked) {
        deck.push(...items);
      } else {
        deck = items;
      }
      closeModal();
      index = 0;
      render();
      save();
    }

    function doExport() {
      const data = JSON.stringify(deck, null, 2);
      // 下载 JSON 文件
      const blob = new Blob([data], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const ts = new Date().toISOString().replace(/[:.]/g,'-');
      a.href = url;
      a.download = `word-cards-${ts}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      // 复制到剪贴板（可选）
      if (navigator.clipboard) { navigator.clipboard.writeText(data).catch(()=>{}); }
    }

    // 事件绑定
    document.getElementById('card').addEventListener('click', flip);
    flipBtn.addEventListener('click', flip);
    nextBtn.addEventListener('click', next);
    prevBtn.addEventListener('click', prev);
    shuffleBtn.addEventListener('click', shuffle);
    deleteBtn.addEventListener('click', del);
    markKnownBtn.addEventListener('click', () => markKnown(true));
    unmarkKnownBtn.addEventListener('click', () => markKnown(false));
    searchInput.addEventListener('input', (e)=> setSearch(e.target.value));
    onlyUnknownBtn.addEventListener('click', toggleOnlyUnknown);
    importBtn.addEventListener('click', openModal);
    exportBtn.addEventListener('click', doExport);
    importCancelBtn.addEventListener('click', closeModal);
    importConfirmBtn.addEventListener('click', doImport);
    addBtn.addEventListener('click', add);
    meaningInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') add(); });

    window.addEventListener('keydown', (e) => {
      if (e.target === wordInput || e.target === meaningInput) return;
      if (e.key === ' ') { e.preventDefault(); flip(); }
      else if (e.key === 'ArrowRight') { next(); }
      else if (e.key === 'ArrowLeft') { prev(); }
      else if (e.key.toLowerCase() === 's') { shuffle(); }
      else if (e.key.toLowerCase() === 'd') { del(); }
      else if (e.key === '/') { e.preventDefault(); searchInput.focus(); }
      else if (e.key.toLowerCase() === 'f') { toggleOnlyUnknown(); }
      else if (e.key.toLowerCase() === 'e') { doExport(); }
      else if (e.key.toLowerCase() === 'i') { openModal(); }
      else if (e.key.toLowerCase() === 'k') { markKnown(true); }
      else if (e.key.toLowerCase() === 'u') { markKnown(false); }
    });

    // 初始化
    load();
    render();
  </script>
</body>
</html>
