<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>解压气泡膜模拟器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial Rounded MT Bold', 'Microsoft YaHei', sans-serif;
            user-select: none;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #fff;
            touch-action: none;
        }
        
        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-top: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.8;
        }
        
        .controls {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 20px;
            gap: 15px;
        }
        
        .control-group {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 12px;
            flex: 1;
            min-width: 150px;
        }
        
        .control-group h3 {
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
        
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .option {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        
        .option:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .option.active {
            background: #ff9d00;
            color: #333;
            font-weight: bold;
        }
        
        .stats-section {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        
        .stats-section h2 {
            margin-bottom: 15px;
            text-align: center;
            font-size: 1.3rem;
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            text-align: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .stat-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 10px;
            min-width: 110px;
        }
        
        .stat-value {
            font-size: 1.6rem;
            font-weight: bold;
            margin: 5px 0;
        }
        
        .stat-label {
            font-size: 0.85rem;
            opacity: 0.8;
        }
        
        .buttons-section {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .action-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            background: #ff9d00;
            color: #333;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        
        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }
        
        .action-btn:active {
            transform: translateY(1px);
        }
        
        .bubble-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            min-height: 300px;
            cursor: crosshair;
            touch-action: none;
        }
        
        .bubble {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
            pointer-events: auto;
        }
        
        .bubble:before {
            content: '';
            position: absolute;
            top: 10%;
            left: 20%;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
        }
        
        .bubble.popped {
            transform: scale(0.8);
            opacity: 0.3;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .bubble.popped:before {
            display: none;
        }
        
        /* 几何图案气泡 */
        .bubble.geometric {
            border-radius: 10px;
        }
        
        .bubble.geometric:before {
            display: none;
        }
        
        .bubble.geometric:after {
            content: '';
            position: absolute;
            width: 60%;
            height: 60%;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 5px;
        }
        
        .bubble.geometric.square:after {
            border-radius: 0;
        }
        
        .bubble.geometric.triangle:after {
            width: 0;
            height: 0;
            background: transparent;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 25px solid rgba(255, 255, 255, 0.6);
        }
        
        .bubble.geometric.hexagon:after {
            width: 60%;
            height: 60%;
            background: rgba(255, 255, 255, 0.6);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }
        
        /* 节日图案气泡 */
        .bubble.festival {
            background: linear-gradient(45deg, #ff0000, #ff8800);
        }
        
        .bubble.festival:before {
            display: none;
        }
        
        .bubble.festival:after {
            content: '🎉';
            font-size: 24px;
            position: absolute;
        }
        
        .bubble.festival.christmas {
            background: linear-gradient(45deg, #ff0000, #ffffff);
        }
        
        .bubble.festival.christmas:after {
            content: '🎄';
        }
        
        .bubble.festival.newyear {
            background: linear-gradient(45deg, #ffcc00, #ff0000);
        }
        
        .bubble.festival.newyear:after {
            content: '🧧';
        }
        
        .footer {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        
        .footer-btn {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .footer-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        
        .modal h2 {
            margin-bottom: 20px;
        }
        
        .modal p {
            margin: 10px 0;
            font-size: 1.1rem;
        }
        
        .close-btn {
            margin-top: 20px;
            padding: 8px 20px;
            background: #ff9d00;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .combo-display {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff9d00;
            z-index: 50;
            display: none;
        }
        
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
            }
            
            .bubble {
                width: 40px;
                height: 40px;
            }
            
            .bubble-container {
                grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            }
            
            .stat-item {
                min-width: 90px;
            }
            
            .action-btn {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>解压气泡膜模拟器</h1>
        <div class="subtitle">点击或滑动气泡释放压力，享受解压乐趣！</div>
    </header>
    
    <div class="combo-display" id="comboDisplay">连击 +0</div>
    
    <div class="container">
        <div class="controls">
            <div class="control-group">
                <h3>大小</h3>
                <div class="options">
                    <div class="option" data-type="size" data-value="small">小</div>
                    <div class="option active" data-type="size" data-value="medium">中</div>
                    <div class="option" data-type="size" data-value="large">大</div>
                </div>
            </div>
            
            <div class="control-group">
                <h3>图案</h3>
                <div class="options">
                    <div class="option active" data-type="pattern" data-value="classic">经典</div>
                    <div class="option" data-type="pattern" data-value="colorful">缤纷</div>
                    <div class="option" data-type="pattern" data-value="emoji">表情</div>
                    <div class="option" data-type="pattern" data-value="geometric">几何</div>
                    <div class="option" data-type="pattern" data-value="festival">节日</div>
                </div>
            </div>
            
            <div class="control-group">
                <h3>音效</h3>
                <div class="options">
                    <div class="option" data-type="sound" data-value="soft">柔和</div>
                    <div class="option active" data-type="sound" data-value="crisp">清脆</div>
                    <div class="option" data-type="sound" data-value="puff">噗哧</div>
                    <div class="option" data-type="sound" data-value="mute">静音</div>
                </div>
            </div>
        </div>
        
        <div class="stats-section">
            <h2>游戏状态</h2>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-label">总气泡数</div>
                    <div class="stat-value" id="totalBubbles">616</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">已爆气泡</div>
                    <div class="stat-value" id="poppedBubbles">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">连击数</div>
                    <div class="stat-value" id="combo">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">最佳连击</div>
                    <div class="stat-value" id="bestCombo">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">计时</div>
                    <div class="stat-value" id="timer">--</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">分数</div>
                    <div class="stat-value" id="score">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">倍率</div>
                    <div class="stat-value" id="multiplier">x1</div>
                </div>
            </div>
        </div>
        
        <div class="buttons-section">
            <button class="action-btn" id="resetBtn">重置</button>
            <button class="action-btn" id="newSheetBtn">再来一膜</button>
            <button class="action-btn" id="challengeBtn">开始30s挑战</button>
        </div>
        
        <div class="bubble-container" id="bubbleContainer">
            <!-- 气泡将通过JavaScript动态生成 -->
        </div>
    </div>
    
    <div class="footer">
        <div class="footer-btn" id="developerBtn">开发者：兔子先生</div>
        <div class="footer-btn" id="techSupportBtn">技术支持：AI编程星球</div>
    </div>
    
    <div class="modal" id="developerModal">
        <div class="modal-content">
            <h2>开发者联系方式</h2>
            <p>微信：l932371716</p>
            <p>邮箱：<a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="44257c7075767c7d73747304213c25293428216a272b29">[email&#160;protected]</a></p>
            <button class="close-btn" id="closeDeveloperModal">关闭</button>
        </div>
    </div>
    
    <div class="modal" id="techSupportModal">
        <div class="modal-content">
            <h2>技术支持</h2>
            <p>AI编程星球为您提供技术支持</p>
            <p>如有问题请联系我们</p>
            <button class="close-btn" id="closeTechSupportModal">关闭</button>
        </div>
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 初始化变量
        let totalBubbles = 616;
        let poppedBubbles = 0;
        let combo = 0;
        let bestCombo = 0;
        let score = 0;
        let multiplier = 1;
        let timerInterval = null;
        let timeLeft = 0;
        let isChallengeMode = false;
        let isMouseDown = false;
        let lastComboTime = 0;
        let comboTimeout = null;
        
        // 音频上下文和音效
        let audioContext;
        let currentSoundType = 'crisp';
        
        // DOM元素
        const bubbleContainer = document.getElementById('bubbleContainer');
        const totalBubblesEl = document.getElementById('totalBubbles');
        const poppedBubblesEl = document.getElementById('poppedBubbles');
        const comboEl = document.getElementById('combo');
        const bestComboEl = document.getElementById('bestCombo');
        const timerEl = document.getElementById('timer');
        const scoreEl = document.getElementById('score');
        const multiplierEl = document.getElementById('multiplier');
        const comboDisplay = document.getElementById('comboDisplay');
        
        const resetBtn = document.getElementById('resetBtn');
        const newSheetBtn = document.getElementById('newSheetBtn');
        const challengeBtn = document.getElementById('challengeBtn');
        
        const developerBtn = document.getElementById('developerBtn');
        const techSupportBtn = document.getElementById('techSupportBtn');
        const developerModal = document.getElementById('developerModal');
        const techSupportModal = document.getElementById('techSupportModal');
        const closeDeveloperModal = document.getElementById('closeDeveloperModal');
        const closeTechSupportModal = document.getElementById('closeTechSupportModal');
        
        // 初始化音频上下文
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        
        // 播放音效
        function playPopSound() {
            if (currentSoundType === 'mute') return;
            
            initAudio();
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            // 根据音效类型设置参数
            let frequency = 200;
            let duration = 0.1;
            
            switch(currentSoundType) {
                case 'soft':
                    frequency = 150;
                    duration = 0.2;
                    break;
                case 'crisp':
                    frequency = 250;
                    duration = 0.08;
                    break;
                case 'puff':
                    frequency = 100;
                    duration = 0.15;
                    break;
            }
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration);
        }
        
        // 初始化气泡
        function initBubbles() {
            bubbleContainer.innerHTML = '';
            
            // 根据当前设置调整气泡大小
            const sizeOption = document.querySelector('.option.active[data-type="size"]').dataset.value;
            let bubbleSize = 50;
            
            if (sizeOption === 'small') bubbleSize = 40;
            else if (sizeOption === 'large') bubbleSize = 60;
            
            // 设置气泡容器样式
            bubbleContainer.style.gridTemplateColumns = `repeat(auto-fill, minmax(${bubbleSize}px, 1fr))`;
            
            // 获取当前图案类型
            const pattern = document.querySelector('.option.active[data-type="pattern"]').dataset.value;
            
            // 创建气泡
            for (let i = 0; i < totalBubbles; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.style.width = `${bubbleSize}px`;
                bubble.style.height = `${bubbleSize}px`;
                
                // 根据图案类型设置气泡样式
                switch(pattern) {
                    case 'colorful':
                        const hue = Math.floor(Math.random() * 360);
                        bubble.style.background = `hsl(${hue}, 70%, 70%)`;
                        break;
                    case 'emoji':
                        const emojis = ['😊', '😄', '😍', '🤩', '🎯', '🌟', '💥', '✨'];
                        bubble.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
                        bubble.style.fontSize = `${bubbleSize * 0.6}px`;
                        break;
                    case 'geometric':
                        const geometricTypes = ['square', 'triangle', 'hexagon'];
                        const geoType = geometricTypes[Math.floor(Math.random() * geometricTypes.length)];
                        bubble.classList.add('geometric', geoType);
                        break;
                    case 'festival':
                        const festivalTypes = ['christmas', 'newyear'];
                        const festType = festivalTypes[Math.floor(Math.random() * festivalTypes.length)];
                        bubble.classList.add('festival', festType);
                        break;
                    default: // classic
                        // 保持默认样式
                        break;
                }
                
                bubble.addEventListener('mousedown', popBubble);
                bubble.addEventListener('touchstart', popBubble);
                bubbleContainer.appendChild(bubble);
            }
        }
        
        // 鼠标事件处理
        function setupMouseEvents() {
            // 鼠标按下
            bubbleContainer.addEventListener('mousedown', (e) => {
                isMouseDown = true;
                if (e.target.classList.contains('bubble')) {
                    popBubble(e);
                }
            });
            
            // 鼠标移动
            bubbleContainer.addEventListener('mousemove', (e) => {
                if (isMouseDown && e.target.classList.contains('bubble') && !e.target.classList.contains('popped')) {
                    popBubble(e);
                }
            });
            
            // 鼠标松开
            document.addEventListener('mouseup', () => {
                isMouseDown = false;
            });
            
            // 触摸事件
            bubbleContainer.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const element = document.elementFromPoint(touch.clientX, touch.clientY);
                if (element && element.classList.contains('bubble') && !element.classList.contains('popped')) {
                    popBubble({ target: element });
                }
            });
        }
        
        // 气泡点击事件
        function popBubble(e) {
            const bubble = e.target;
            
            if (bubble.classList.contains('popped')) return;
            
            // 播放音效
            playPopSound();
            
            // 更新状态
            bubble.classList.add('popped');
            poppedBubbles++;
            
            // 连击逻辑
            const now = Date.now();
            if (now - lastComboTime < 1000) { // 1秒内连续点击
                combo++;
                showComboEffect();
            } else {
                combo = 1;
            }
            
            lastComboTime = now;
            
            // 清除之前的连击超时
            if (comboTimeout) clearTimeout(comboTimeout);
            
            // 设置连击超时
            comboTimeout = setTimeout(() => {
                combo = 0;
                comboDisplay.style.display = 'none';
            }, 1000);
            
            if (combo > bestCombo) {
                bestCombo = combo;
            }
            
            // 计算分数
            score += 10 * multiplier;
            
            // 根据连击增加倍数
            if (combo >= 10) {
                multiplier = 3;
            } else if (combo >= 5) {
                multiplier = 2;
            } else {
                multiplier = 1;
            }
            
            // 更新显示
            updateDisplay();
        }
        
        // 显示连击效果
        function showComboEffect() {
            if (combo <= 1) return;
            
            comboDisplay.textContent = `连击 +${combo}`;
            comboDisplay.style.display = 'block';
            
            // 添加动画效果
            comboDisplay.style.transform = 'scale(1.2)';
            comboDisplay.style.color = combo >= 10 ? '#ff0000' : combo >= 5 ? '#ff9900' : '#ff9d00';
            
            setTimeout(() => {
                comboDisplay.style.transform = 'scale(1)';
            }, 100);
        }
        
        // 更新显示
        function updateDisplay() {
            poppedBubblesEl.textContent = poppedBubbles;
            comboEl.textContent = combo;
            bestComboEl.textContent = bestCombo;
            scoreEl.textContent = score;
            multiplierEl.textContent = `x${multiplier}`;
        }
        
        // 重置游戏
        function resetGame() {
            poppedBubbles = 0;
            combo = 0;
            score = 0;
            multiplier = 1;
            lastComboTime = 0;
            
            if (comboTimeout) {
                clearTimeout(comboTimeout);
                comboTimeout = null;
            }
            
            comboDisplay.style.display = 'none';
            
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            
            timerEl.textContent = '--';
            isChallengeMode = false;
            
            initBubbles();
            updateDisplay();
        }
        
        // 开始挑战模式
        function startChallenge() {
            resetGame();
            isChallengeMode = true;
            timeLeft = 30;
            timerEl.textContent = timeLeft;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    alert(`挑战结束！您的得分是：${score}`);
                }
            }, 1000);
        }
        
        // 选项点击事件
        document.querySelectorAll('.option').forEach(option => {
            option.addEventListener('click', function() {
                const type = this.dataset.type;
                const value = this.dataset.value;
                
                // 移除同组其他选项的active类
                document.querySelectorAll(`.option[data-type="${type}"]`).forEach(opt => {
                    opt.classList.remove('active');
                });
                
                // 添加active类到当前选项
                this.classList.add('active');
                
                // 更新音效类型
                if (type === 'sound') {
                    currentSoundType = value;
                }
                
                // 重新初始化气泡
                initBubbles();
            });
        });
        
        // 按钮事件
        resetBtn.addEventListener('click', resetGame);
        newSheetBtn.addEventListener('click', initBubbles);
        challengeBtn.addEventListener('click', startChallenge);
        
        // 底部按钮事件
        developerBtn.addEventListener('click', () => {
            developerModal.style.display = 'flex';
        });
        
        techSupportBtn.addEventListener('click', () => {
            techSupportModal.style.display = 'flex';
        });
        
        closeDeveloperModal.addEventListener('click', () => {
            developerModal.style.display = 'none';
        });
        
        closeTechSupportModal.addEventListener('click', () => {
            techSupportModal.style.display = 'none';
        });
        
        // 点击模态框外部关闭
        window.addEventListener('click', (e) => {
            if (e.target === developerModal) {
                developerModal.style.display = 'none';
            }
            if (e.target === techSupportModal) {
                techSupportModal.style.display = 'none';
            }
        });
        
        // 初始化
        initBubbles();
        setupMouseEvents();
        updateDisplay();
    </script>
</body>
</html>
