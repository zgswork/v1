        // 获取DOM元素
        const recommendBtn = document.getElementById('recommend-btn');
        const changeBtn = document.getElementById('change-btn');
        const movieDisplay = document.getElementById('movie-display');
        const movieTitle = document.getElementById('movie-title');
        const doubanRating = document.getElementById('douban-rating');
        const stars = document.getElementById('stars');
        const description = document.getElementById('description');
        const reason = document.getElementById('reason');

        // 记录已显示的电影索引
        let shownMovies = [];

        // 推荐电影函数
        function recommendMovie() {
            // 如果所有电影都已显示过，重置记录
            if (shownMovies.length === movies.length) {
                shownMovies = [];
            }
            
            // 随机选择一部未显示过的电影
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * movies.length);
            } while (shownMovies.includes(randomIndex));
            
            // 记录已显示的电影
            shownMovies.push(randomIndex);
            
            // 显示电影信息
            displayMovie(movies[randomIndex]);
        }

        // 显示电影信息
        function displayMovie(movie) {
            movieTitle.textContent = movie.title;
            doubanRating.textContent = movie.rating;
            
            // 计算星星数量（根据豆瓣评分）
            const starCount = Math.round(movie.rating / 2);
            stars.textContent = '★'.repeat(starCount) + '☆'.repeat(5 - starCount);
            
            description.textContent = movie.description;
            reason.textContent = movie.reason;
            
            // 显示电影信息区域
            movieDisplay.style.display = 'block';
            
            // 显示"换一部电影"按钮
            changeBtn.style.display = 'inline-block';
        }

        // 事件监听
        document.addEventListener('DOMContentLoaded', function() {
            recommendBtn.addEventListener('click', function() {
                recommendMovie();
                recommendBtn.style.display = 'none';
            });

            changeBtn.addEventListener('click', recommendMovie);
        });
    </script>
