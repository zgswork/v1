<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务目标管理系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4a6cf7;
            --secondary-color: #f0f2ff;
            --text-color: #333;
            --light-text: #666;
            --border-color: #e0e0e0;
            --completed-color: #d0d0d0;
            --success-color: #4caf50;
            --danger-color: #f44336;
            --card-shadow: 0 2px 10px rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f9fafb;
            color: var(--text-color);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .date-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        #date-picker {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 16px;
            width: 180px;
        }

        .dimension-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .dimension-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            background-color: white;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
        }

        .dimension-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .content {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }

        @media (min-width: 768px) {
            .content {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background-color: white;
            border-radius: 10px;
            box-shadow: var(--card-shadow);
            padding: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary-color);
        }

        .task-list, .goal-list {
            list-style: none;
        }

        .task-item, .goal-item {
            display: flex;
            align-items: center;
            padding: 12px 10px;
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.2s ease;
        }

        .task-item:hover, .goal-item:hover {
            background-color: var(--secondary-color);
        }

        .task-item.completed, .goal-item.completed {
            background-color: var(--secondary-color);
        }

        .task-item.completed .task-name,
        .goal-item.completed .goal-name {
            text-decoration: line-through;
            color: var(--completed-color);
        }

        .checkbox {
            margin-right: 15px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .task-name, .goal-name {
            flex-grow: 1;
        }

        .task-duration {
            margin-right: 15px;
            color: var(--light-text);
            font-size: 14px;
            background-color: var(--secondary-color);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-size: 18px;
            transition: color 0.2s ease;
        }

        .delete-btn:hover {
            color: #d32f2f;
        }

        .add-task-form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .form-group {
            flex-grow: 1;
            min-width: 150px;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 16px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: #3a5ae7;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .stat-card {
            background-color: white;
            border-radius: 10px;
            box-shadow: var(--card-shadow);
            padding: 20px;
            text-align: center;
            flex: 1;
            min-width: 150px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .stat-label {
            color: var(--light-text);
            font-size: 14px;
        }

        .accordion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background-color: var(--secondary-color);
            border-radius: 6px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .accordion-content.active {
            max-height: 500px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>任务目标管理系统</h1>
            <div class="date-controls">
                <input type="date" id="date-picker">
                <div class="dimension-buttons">
                    <button class="dimension-btn active" data-dimension="day">日</button>
                    <button class="dimension-btn" data-dimension="week">周</button>
                    <button class="dimension-btn" data-dimension="month">月</button>
                    <button class="dimension-btn" data-dimension="quarter">季</button>
                    <button class="dimension-btn" data-dimension="year">年</button>
                </div>
            </div>
        </header>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="today-completion">0%</div>
                <div class="stat-label">今日完成率</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="week-completion">0%</div>
                <div class="stat-label">本周完成率</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="month-completion">0%</div>
                <div class="stat-label">本月完成率</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="long-term-goals">0/0</div>
                <div class="stat-label">长期目标进度</div>
            </div>
        </div>

        <div class="content">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title" id="day-title">今日任务</h2>
                </div>
                <ul class="task-list" id="task-list"></ul>
                <form class="add-task-form" id="add-task-form">
                    <div class="form-group">
                        <input type="text" class="form-control" id="task-name" placeholder="任务名称" required>
                    </div>
                    <div class="form-group">
                        <input type="number" class="form-control" id="task-duration" placeholder="预计时间(分钟)" min="1" required>
                    </div>
                    <button type="submit" class="btn btn-primary">添加任务</button>
                </form>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">长期目标</h2>
                </div>

                <div class="accordion">
                    <div class="accordion-item">
                        <div class="accordion-header" data-target="week-goals">
                            <h3 id="week-goals-title">本周目标</h3>
                            <i class="fas fa-chevron-down"></i>
                        </div>
                        <div class="accordion-content active" id="week-goals">
                            <ul class="goal-list" id="week-goal-list"></ul>
                            <form class="add-task-form" id="add-week-goal-form">
                                <div class="form-group">
                                    <input type="text" class="form-control" id="week-goal-name" placeholder="添加周目标" required>
                                </div>
                                <button type="submit" class="btn btn-primary">添加</button>
                            </form>
                        </div>
                    </div>

                    <div class="accordion-item">
                        <div class="accordion-header" data-target="month-goals">
                            <h3 id="month-goals-title">本月目标</h3>
                            <i class="fas fa-chevron-down"></i>
                        </div>
                        <div class="accordion-content" id="month-goals">
                            <ul class="goal-list" id="month-goal-list"></ul>
                            <form class="add-task-form" id="add-month-goal-form">
                                <div class="form-group">
                                    <input type="text" class="form-control" id="month-goal-name" placeholder="添加月目标" required>
                                </div>
                                <button type="submit" class="btn btn-primary">添加</button>
                            </form>
                        </div>
                    </div>

                    <div class="accordion-item">
                        <div class="accordion-header" data-target="quarter-goals">
                            <h3 id="quarter-goals-title">本季目标</h3>
                            <i class="fas fa-chevron-down"></i>
                        </div>
                        <div class="accordion-content" id="quarter-goals">
                            <ul class="goal-list" id="quarter-goal-list"></ul>
                            <form class="add-task-form" id="add-quarter-goal-form">
                                <div class="form-group">
                                    <input type="text" class="form-control" id="quarter-goal-name" placeholder="添加季目标" required>
                                </div>
                                <button type="submit" class="btn btn-primary">添加</button>
                            </form>
                        </div>
                    </div>

                    <div class="accordion-item">
                        <div class="accordion-header" data-target="year-goals">
                            <h3 id="year-goals-title">本年目标</h3>
                            <i class="fas fa-chevron-down"></i>
                        </div>
                        <div class="accordion-content" id="year-goals">
                            <ul class="goal-list" id="year-goal-list"></ul>
                            <form class="add-task-form" id="add-year-goal-form">
                                <div class="form-group">
                                    <input type="text" class="form-control" id="year-goal-name" placeholder="添加年目标" required>
                                </div>
                                <button type="submit" class="btn btn-primary">添加</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 数据存储模块
        const TaskManager = {
            // 初始化数据
            init() {
                if (!localStorage.getItem('taskData')) {
                    localStorage.setItem('taskData', JSON.stringify({}));
                }
            },

            // 获取数据
            getData() {
                return JSON.parse(localStorage.getItem('taskData') || '{}');
            },

            // 保存数据
            saveData(data) {
                localStorage.setItem('taskData', JSON.stringify(data));
            },

            // 添加任务
            addTask(date, task) {
                const data = this.getData();
                if (!data[date]) {
                    data[date] = { tasks: [] };
                }
                data[date].tasks.push(task);
                this.saveData(data);
            },

            // 添加目标
            addGoal(period, goal) {
                const data = this.getData();
                if (!data[period]) {
                    data[period] = { goals: [] };
                }
                data[period].goals.push(goal);
                this.saveData(data);
            },

            // 切换任务完成状态
            toggleTaskStatus(date, taskId) {
                const data = this.getData();
                if (data[date] && data[date].tasks) {
                    const task = data[date].tasks.find(t => t.id === taskId);
                    if (task) {
                        task.completed = !task.completed;
                        this.saveData(data);
                        return true;
                    }
                }
                return false;
            },

            // 切换目标完成状态
            toggleGoalStatus(period, goalId) {
                const data = this.getData();
                if (data[period] && data[period].goals) {
                    const goal = data[period].goals.find(g => g.id === goalId);
                    if (goal) {
                        goal.completed = !goal.completed;
                        this.saveData(data);
                        return true;
                    }
                }
                return false;
            },

            // 删除任务
            deleteTask(date, taskId) {
                const data = this.getData();
                if (data[date] && data[date].tasks) {
                    data[date].tasks = data[date].tasks.filter(t => t.id !== taskId);
                    this.saveData(data);
                    return true;
                }
                return false;
            },

            // 删除目标
            deleteGoal(period, goalId) {
                const data = this.getData();
                if (data[period] && data[period].goals) {
                    data[period].goals = data[period].goals.filter(g => g.id !== goalId);
                    this.saveData(data);
                    return true;
                }
                return false;
            },

            // 获取特定日期的任务
            getTasksByDate(date) {
                const data = this.getData();
                return data[date]?.tasks || [];
            },

            // 获取特定周期的目标
            getGoalsByPeriod(period) {
                const data = this.getData();
                return data[period]?.goals || [];
            },

            // 计算完成率
            calculateCompletionRate(items) {
                if (items.length === 0) return 0;
                const completed = items.filter(item => item.completed).length;
                return Math.round((completed / items.length) * 100);
            }
        };

        // 日期处理模块
        const DateUtils = {
            // 获取当前日期
            getCurrentDate() {
                const today = new Date();
                return this.formatDate(today);
            },

            // 格式化日期为 YYYY-MM-DD
            formatDate(date) {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            },

            // 获取日期对应的周标识 (YYYY-WW)
            getWeekIdentifier(date) {
                const year = date.getFullYear();
                // 计算ISO周数
                const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
                const dayNum = d.getUTCDay() || 7; // 周日为7
                d.setUTCDate(d.getUTCDate() + 4 - dayNum); // 移至周四
                const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
                const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
                return `${year}-W${String(weekNo).padStart(2, '0')}`;
            },

            // 获取日期对应的月标识 (YYYY-MM)
            getMonthIdentifier(date) {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                return `${year}-${month}`;
            },

            // 获取日期对应的季度标识 (YYYY-Q[1-4])
            getQuarterIdentifier(date) {
                const year = date.getFullYear();
                const month = date.getMonth() + 1;
                const quarter = Math.ceil(month / 3);
                return `${year}-Q${quarter}`;
            },

            // 获取日期对应的年标识 (YYYY)
            getYearIdentifier(date) {
                return date.getFullYear().toString();
            },

            // 获取周的开始和结束日期
            getWeekRange(weekIdentifier) {
                const [year, week] = weekIdentifier.split('-W');
                const d = new Date(Date.UTC(year, 0, 1));
                const dayNum = d.getUTCDay() || 7; // 周日为7
                d.setUTCDate(d.getUTCDate() + 4 - dayNum); // 移至周四
                d.setUTCDate(d.getUTCDate() + (week - 1) * 7); // 移至目标周的周四
                const start = new Date(d);
                start.setUTCDate(d.getUTCDate() - 3); // 周一
                const end = new Date(d);
                end.setUTCDate(d.getUTCDate() + 3); // 周日
                return {
                    start: this.formatDate(start),
                    end: this.formatDate(end)
                };
            },

            // 获取月的开始和结束日期
            getMonthRange(monthIdentifier) {
                const [year, month] = monthIdentifier.split('-');
                const start = new Date(year, month - 1, 1);
                const end = new Date(year, month, 0);
                return {
                    start: this.formatDate(start),
                    end: this.formatDate(end)
                };
            },

            // 获取季度的开始和结束日期
            getQuarterRange(quarterIdentifier) {
                const [year, quarterPart] = quarterIdentifier.split('-Q');
                const quarter = parseInt(quarterPart);
                const startMonth = (quarter - 1) * 3;
                const endMonth = startMonth + 2;
                const start = new Date(year, startMonth, 1);
                const end = new Date(year, endMonth + 1, 0);
                return {
                    start: this.formatDate(start),
                    end: this.formatDate(end)
                };
            },

            // 获取年的开始和结束日期
            getYearRange(yearIdentifier) {
                const year = parseInt(yearIdentifier);
                const start = new Date(year, 0, 1);
                const end = new Date(year, 11, 31);
                return {
                    start: this.formatDate(start),
                    end: this.formatDate(end)
                };
            }
        };

        // UI渲染模块
        const UIRenderer = {
            // 初始化UI
            init() {
                // 设置默认日期为今天
                const today = DateUtils.getCurrentDate();
                document.getElementById('date-picker').value = today;

                // 初始化事件监听
                this.initEventListeners();

                // 渲染初始数据
                this.renderAll();
            },

            // 初始化事件监听
            initEventListeners() {
                // 日期选择器变化
                document.getElementById('date-picker').addEventListener('change', () => {
                    this.renderAll();
                });

                // 维度切换按钮
            document.querySelectorAll('.dimension-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.dimension-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                     
                    // 新增：自动展开对应维度的目标区域
                    const dimension = btn.getAttribute('data-dimension');
                    let targetId = '';
                    
                    switch(dimension) {
                        case 'week':
                            targetId = 'week-goals';
                            break;
                        case 'month':
                            targetId = 'month-goals';
                            break;
                        case 'quarter':
                            targetId = 'quarter-goals';
                            break;
                        case 'year':
                            targetId = 'year-goals';
                            break;
                        default:
                            // 日维度不需要展开长期目标区域
                            break;
                    }
                    
                    if (targetId) {
                        // 先关闭所有区域
                        document.querySelectorAll('.accordion-content').forEach(content => {
                            content.classList.remove('active');
                            const icon = content.previousElementSibling.querySelector('i');
                            icon.classList.remove('fa-chevron-up');
                            icon.classList.add('fa-chevron-down');
                        });
                        
                        // 再打开目标区域
                        const targetContent = document.getElementById(targetId);
                        targetContent.classList.add('active');
                        const targetIcon = targetContent.previousElementSibling.querySelector('i');
                        targetIcon.classList.remove('fa-chevron-down');
                        targetIcon.classList.add('fa-chevron-up');
                    }
                     
                    this.renderAll();
                });
            });

                // 添加任务表单
                document.getElementById('add-task-form').addEventListener('submit', (e) => {
                    e.preventDefault();
                    const taskName = document.getElementById('task-name').value;
                    const taskDuration = parseInt(document.getElementById('task-duration').value);
                    const date = document.getElementById('date-picker').value;

                    const task = {
                        id: Date.now().toString(),
                        name: taskName,
                        duration: taskDuration,
                        completed: false,
                        createdAt: new Date().toISOString()
                    };

                    TaskManager.addTask(date, task);
                    document.getElementById('task-name').value = '';
                    document.getElementById('task-duration').value = '';
                    this.renderTasks();
                    this.updateStats();
                });

                // 添加周目标表单
                document.getElementById('add-week-goal-form').addEventListener('submit', (e) => {
                    e.preventDefault();
                    const goalName = document.getElementById('week-goal-name').value;
                    const date = new Date(document.getElementById('date-picker').value);
                    const weekId = DateUtils.getWeekIdentifier(date);

                    const goal = {
                        id: Date.now().toString() + '1',
                        name: goalName,
                        completed: false,
                        createdAt: new Date().toISOString()
                    };

                    TaskManager.addGoal(weekId, goal);
                    document.getElementById('week-goal-name').value = '';
                    this.renderWeekGoals();
                    this.updateStats();
                });

                // 添加月目标表单
                document.getElementById('add-month-goal-form').addEventListener('submit', (e) => {
                    e.preventDefault();
                    const goalName = document.getElementById('month-goal-name').value;
                    const date = new Date(document.getElementById('date-picker').value);
                    const monthId = DateUtils.getMonthIdentifier(date);

                    const goal = {
                        id: Date.now().toString() + '2',
                        name: goalName,
                        completed: false,
                        createdAt: new Date().toISOString()
                    };

                    TaskManager.addGoal(monthId, goal);
                    document.getElementById('month-goal-name').value = '';
                    this.renderMonthGoals();
                    this.updateStats();
                });

                // 添加季目标表单
                document.getElementById('add-quarter-goal-form').addEventListener('submit', (e) => {
                    e.preventDefault();
                    const goalName = document.getElementById('quarter-goal-name').value;
                    const date = new Date(document.getElementById('date-picker').value);
                    const quarterId = DateUtils.getQuarterIdentifier(date);

                    const goal = {
                        id: Date.now().toString() + '3',
                        name: goalName,
                        completed: false,
                        createdAt: new Date().toISOString()
                    };

                    TaskManager.addGoal(quarterId, goal);
                    document.getElementById('quarter-goal-name').value = '';
                    this.renderQuarterGoals();
                    this.updateStats();
                });

                // 添加年目标表单
                document.getElementById('add-year-goal-form').addEventListener('submit', (e) => {
                    e.preventDefault();
                    const goalName = document.getElementById('year-goal-name').value;
                    const date = new Date(document.getElementById('date-picker').value);
                    const yearId = DateUtils.getYearIdentifier(date);

                    const goal = {
                        id: Date.now().toString() + '4',
                        name: goalName,
                        completed: false,
                        createdAt: new Date().toISOString()
                    };

                    TaskManager.addGoal(yearId, goal);
                    document.getElementById('year-goal-name').value = '';
                    this.renderYearGoals();
                    this.updateStats();
                });

                // 手风琴效果
                document.querySelectorAll('.accordion-header').forEach(header => {
                    header.addEventListener('click', () => {
                        const targetId = header.getAttribute('data-target');
                        const content = document.getElementById(targetId);
                        content.classList.toggle('active');

                        // 切换图标
                        const icon = header.querySelector('i');
                        if (content.classList.contains('active')) {
                            icon.classList.remove('fa-chevron-down');
                            icon.classList.add('fa-chevron-up');
                        } else {
                            icon.classList.remove('fa-chevron-up');
                            icon.classList.add('fa-chevron-down');
                        }
                    });
                });
            },

            // 渲染所有内容
            renderAll() {
                this.renderTasks();
                this.renderWeekGoals();
                this.renderMonthGoals();
                this.renderQuarterGoals();
                this.renderYearGoals();
                this.updateStats();
                this.updateTitles();
            },

            // 渲染任务列表
            renderTasks() {
                const date = document.getElementById('date-picker').value;
                const tasks = TaskManager.getTasksByDate(date);
                const taskListEl = document.getElementById('task-list');

                taskListEl.innerHTML = '';

                if (tasks.length === 0) {
                    taskListEl.innerHTML = '<li class="task-item">暂无任务，请添加</li>';
                    return;
                }

                tasks.forEach(task => {
                    const li = document.createElement('li');
                    li.className = `task-item ${task.completed ? 'completed' : ''}`;

                    li.innerHTML = `
                        <input type="checkbox" class="checkbox" data-task-id="${task.id}" ${task.completed ? 'checked' : ''}>
                        <span class="task-name">${task.name}</span>
                        <span class="task-duration">${task.duration} 分钟</span>
                        <button class="delete-btn" data-task-id="${task.id}"><i class="fas fa-trash-alt"></i></button>
                    `;

                    taskListEl.appendChild(li);
                });

                // 添加任务项事件监听
                this.addTaskEventListeners();
            },

            // 添加任务项事件监听
            addTaskEventListeners() {
                // 完成状态切换
                document.querySelectorAll('.task-item .checkbox').forEach(checkbox => {
                    checkbox.addEventListener('change', (e) => {
                        const taskId = e.target.getAttribute('data-task-id');
                        const date = document.getElementById('date-picker').value;
                        TaskManager.toggleTaskStatus(date, taskId);
                        this.renderTasks();
                        this.updateStats();
                    });
                });

                // 删除任务
                document.querySelectorAll('.task-item .delete-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const taskId = e.target.closest('.delete-btn').getAttribute('data-task-id');
                        const date = document.getElementById('date-picker').value;
                        TaskManager.deleteTask(date, taskId);
                        this.renderTasks();
                        this.updateStats();
                    });
                });
            },

            // 渲染周目标
            renderWeekGoals() {
                const date = new Date(document.getElementById('date-picker').value);
                const weekId = DateUtils.getWeekIdentifier(date);
                const goals = TaskManager.getGoalsByPeriod(weekId);
                const goalListEl = document.getElementById('week-goal-list');

                goalListEl.innerHTML = '';

                if (goals.length === 0) {
                    goalListEl.innerHTML = '<li class="goal-item">暂无周目标，请添加</li>';
                    return;
                }

                goals.forEach(goal => {
                    const li = document.createElement('li');
                    li.className = `goal-item ${goal.completed ? 'completed' : ''}`;

                    li.innerHTML = `
                        <input type="checkbox" class="checkbox" data-goal-id="${goal.id}" data-period="${weekId}" ${goal.completed ? 'checked' : ''}>
                        <span class="goal-name">${goal.name}</span>
                        <button class="delete-btn" data-goal-id="${goal.id}" data-period="${weekId}"><i class="fas fa-trash-alt"></i></button>
                    `;

                    goalListEl.appendChild(li);
                });

                this.addGoalEventListeners('week-goal-list');
            },

            // 渲染月目标
            renderMonthGoals() {
                const date = new Date(document.getElementById('date-picker').value);
                const monthId = DateUtils.getMonthIdentifier(date);
                const goals = TaskManager.getGoalsByPeriod(monthId);
                const goalListEl = document.getElementById('month-goal-list');

                goalListEl.innerHTML = '';

                if (goals.length === 0) {
                    goalListEl.innerHTML = '<li class="goal-item">暂无月目标，请添加</li>';
                    return;
                }

                goals.forEach(goal => {
                    const li = document.createElement('li');
                    li.className = `goal-item ${goal.completed ? 'completed' : ''}`;

                    li.innerHTML = `
                        <input type="checkbox" class="checkbox" data-goal-id="${goal.id}" data-period="${monthId}" ${goal.completed ? 'checked' : ''}>
                        <span class="goal-name">${goal.name}</span>
                        <button class="delete-btn" data-goal-id="${goal.id}" data-period="${monthId}"><i class="fas fa-trash-alt"></i></button>
                    `;

                    goalListEl.appendChild(li);
                });

                this.addGoalEventListeners('month-goal-list');
            },

            // 渲染季目标
            renderQuarterGoals() {
                const date = new Date(document.getElementById('date-picker').value);
                const quarterId = DateUtils.getQuarterIdentifier(date);
                const goals = TaskManager.getGoalsByPeriod(quarterId);
                const goalListEl = document.getElementById('quarter-goal-list');

                goalListEl.innerHTML = '';

                if (goals.length === 0) {
                    goalListEl.innerHTML = '<li class="goal-item">暂无季目标，请添加</li>';
                    return;
                }

                goals.forEach(goal => {
                    const li = document.createElement('li');
                    li.className = `goal-item ${goal.completed ? 'completed' : ''}`;

                    li.innerHTML = `
                        <input type="checkbox" class="checkbox" data-goal-id="${goal.id}" data-period="${quarterId}" ${goal.completed ? 'checked' : ''}>
                        <span class="goal-name">${goal.name}</span>
                        <button class="delete-btn" data-goal-id="${goal.id}" data-period="${quarterId}"><i class="fas fa-trash-alt"></i></button>
                    `;

                    goalListEl.appendChild(li);
                });

                this.addGoalEventListeners('quarter-goal-list');
            },

            // 渲染年目标
            renderYearGoals() {
                const date = new Date(document.getElementById('date-picker').value);
                const yearId = DateUtils.getYearIdentifier(date);
                const goals = TaskManager.getGoalsByPeriod(yearId);
                const goalListEl = document.getElementById('year-goal-list');

                goalListEl.innerHTML = '';

                if (goals.length === 0) {
                    goalListEl.innerHTML = '<li class="goal-item">暂无年目标，请添加</li>';
                    return;
                }

                goals.forEach(goal => {
                    const li = document.createElement('li');
                    li.className = `goal-item ${goal.completed ? 'completed' : ''}`;

                    li.innerHTML = `
                        <input type="checkbox" class="checkbox" data-goal-id="${goal.id}" data-period="${yearId}" ${goal.completed ? 'checked' : ''}>
                        <span class="goal-name">${goal.name}</span>
                        <button class="delete-btn" data-goal-id="${goal.id}" data-period="${yearId}"><i class="fas fa-trash-alt"></i></button>
                    `;

                    goalListEl.appendChild(li);
                });

                this.addGoalEventListeners('year-goal-list');
            },

            // 添加目标项事件监听
            addGoalEventListeners(listId) {
                // 完成状态切换
                document.querySelectorAll(`#${listId} .checkbox`).forEach(checkbox => {
                    checkbox.addEventListener('change', (e) => {
                        const goalId = e.target.getAttribute('data-goal-id');
                        const period = e.target.getAttribute('data-period');
                        TaskManager.toggleGoalStatus(period, goalId);
                        this.renderAll();
                    });
                });

                // 删除目标
                document.querySelectorAll(`#${listId} .delete-btn`).forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const goalId = e.target.closest('.delete-btn').getAttribute('data-goal-id');
                        const period = e.target.closest('.delete-btn').getAttribute('data-period');
                        TaskManager.deleteGoal(period, goalId);
                        this.renderAll();
                    });
                });
            },

            // 更新统计信息
            updateStats() {
                const date = document.getElementById('date-picker').value;
                const dateObj = new Date(date);

                // 今日完成率
                const todayTasks = TaskManager.getTasksByDate(date);
                const todayCompletion = TaskManager.calculateCompletionRate(todayTasks);
                document.getElementById('today-completion').textContent = `${todayCompletion}%`;

                // 本周完成率
                const weekId = DateUtils.getWeekIdentifier(dateObj);
                const weekGoals = TaskManager.getGoalsByPeriod(weekId);
                const weekCompletion = TaskManager.calculateCompletionRate(weekGoals);
                document.getElementById('week-completion').textContent = `${weekCompletion}%`;

                // 本月完成率
                const monthId = DateUtils.getMonthIdentifier(dateObj);
                const monthGoals = TaskManager.getGoalsByPeriod(monthId);
                const monthCompletion = TaskManager.calculateCompletionRate(monthGoals);
                document.getElementById('month-completion').textContent = `${monthCompletion}%`;

                // 长期目标进度
                const quarterId = DateUtils.getQuarterIdentifier(dateObj);
                const yearId = DateUtils.getYearIdentifier(dateObj);

                const quarterGoals = TaskManager.getGoalsByPeriod(quarterId);
                const yearGoals = TaskManager.getGoalsByPeriod(yearId);

                const allLongTermGoals = [...weekGoals, ...monthGoals, ...quarterGoals, ...yearGoals];
                const completedLongTermGoals = allLongTermGoals.filter(g => g.completed).length;
                document.getElementById('long-term-goals').textContent = `${completedLongTermGoals}/${allLongTermGoals.length}`;
            },

            // 更新标题
            updateTitles() {
                const date = document.getElementById('date-picker').value;
                const dateObj = new Date(date);
                const formattedDate = dateObj.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
                document.getElementById('day-title').textContent = `${formattedDate} 任务`;

                // 更新周目标标题
                const weekId = DateUtils.getWeekIdentifier(dateObj);
                const weekRange = DateUtils.getWeekRange(weekId);
                const weekStart = new Date(weekRange.start).toLocaleDateString('zh-CN', { month: 'long', day: 'numeric' });
                const weekEnd = new Date(weekRange.end).toLocaleDateString('zh-CN', { month: 'long', day: 'numeric' });
                document.getElementById('week-goals-title').textContent = `第 ${weekId.split('-W')[1]} 周目标 (${weekStart} - ${weekEnd})`;

                // 更新月目标标题
                const monthId = DateUtils.getMonthIdentifier(dateObj);
                const monthRange = DateUtils.getMonthRange(monthId);
                const monthName = new Date(monthRange.start).toLocaleDateString('zh-CN', { year: 'numeric', month: 'long' });
                document.getElementById('month-goals-title').textContent = `${monthName} 目标`;

                // 更新季目标标题
                const quarterId = DateUtils.getQuarterIdentifier(dateObj);
                const [year, quarter] = quarterId.split('-Q');
                document.getElementById('quarter-goals-title').textContent = `${year}年 第${quarter}季度目标`;

                // 更新年目标标题
                const yearId = DateUtils.getYearIdentifier(dateObj);
                document.getElementById('year-goals-title').textContent = `${yearId}年 目标`;
            }
        };

        // 初始化应用
        document.addEventListener('DOMContentLoaded', () => {
            TaskManager.init();
            UIRenderer.init();
        });
    </script>
</body>
</html>
