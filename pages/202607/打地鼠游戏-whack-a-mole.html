<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打地鼠游戏</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .game-container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1.2em;
            font-weight: bold;
        }

        .score {
            color: #e74c3c;
        }

        .timer {
            color: #3498db;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            margin: 20px 0;
            width: 400px;
            height: 400px;
        }

        .hole {
            width: 90px;
            height: 90px;
            background: #8B4513;
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            border: 3px solid #654321;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.3);
            transition: all 0.1s ease;
        }

        .hole:hover {
            transform: scale(1.05);
        }

        .mole {
            width: 70px;
            height: 70px;
            background: #8B4513;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            cursor: pointer;
            z-index: 2;
            border: 2px solid #654321;
        }

        .mole::before {
            content: '';
            position: absolute;
            width: 15px;
            height: 15px;
            background: #000;
            border-radius: 50%;
            top: 20px;
            left: 15px;
        }

        .mole::after {
            content: '';
            position: absolute;
            width: 15px;
            height: 15px;
            background: #000;
            border-radius: 50%;
            top: 20px;
            right: 15px;
        }

        .mole.active {
            display: block;
            animation: pop-up 0.3s ease-out;
        }

        .mole.hit {
            animation: hit 0.3s ease-out;
        }

        @keyframes pop-up {
            0% { transform: translate(-50%, -50%) scale(0); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        @keyframes hit {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.2); background: #e74c3c; }
            100% { transform: translate(-50%, -50%) scale(0); }
        }

        .start-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .start-btn:hover {
            background: #2ecc71;
        }

        .start-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }

        .game-over {
            color: #e74c3c;
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 20px;
        }

        .sound-control {
            margin: 10px 0;
        }

        .sound-toggle {
            background: #3498db;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
            transition: background 0.3s ease;
        }

        .sound-toggle:hover {
            background: #2980b9;
        }

        .sound-toggle.muted {
            background: #95a5a6;
        }

        .sound-toggle.muted:hover {
            background: #7f8c8d;
        }

        .developer-info {
            margin-top: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            border: 2px solid #e0e6ed;
        }

        .developer-info h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .contact-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 10px 0;
        }

        .qr-code {
            width: 100px;
            height: 100px;
            border: 2px solid #3498db;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            color: #7f8c8d;
            font-size: 12px;
            text-align: center;
        }

        .contact-text {
            flex: 1;
            text-align: left;
        }

        .contact-text p {
            margin: 5px 0;
            color: #34495e;
            font-size: 14px;
        }

        .contact-text strong {
            color: #2980b9;
        }

        .social-links {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .social-link {
            background: #3498db;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .social-link:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }
    </style>

                this.createGrid();
                this.startBtn.addEventListener('click', () => this.startGame());
                this.soundToggle.addEventListener('click', () => this.toggleSound());
            }

            createGrid() {
                this.gameGrid.innerHTML = '';
                for (let i = 0; i < 16; i++) {
                    const hole = document.createElement('div');
                    hole.className = 'hole';
                    hole.dataset.index = i;
                    
                    const mole = document.createElement('div');
                    mole.className = 'mole';
                    mole.addEventListener('click', () => this.whackMole(i));
                    
                    hole.appendChild(mole);
                    this.gameGrid.appendChild(hole);
                }
            }

            startGame() {
                this.score = 0;
                this.timeLeft = 30;
                this.gameActive = true;
                this.currentMole = null;
                
                this.scoreElement.textContent = this.score;
                this.timerElement.textContent = this.timeLeft;
                this.startBtn.textContent = '游戏中...';
                this.startBtn.disabled = true;
                this.gameOverElement.style.display = 'none';
                
                this.hideAllMoles();
                this.startGameTimer();
                this.spawnMole();
            }

            startGameTimer() {
                this.gameTimer = setInterval(() => {
                    this.timeLeft--;
                    this.timerElement.textContent = this.timeLeft;
                    
                    if (this.timeLeft <= 0) {
                        this.endGame();
                    }
                }, 1000);
            }

            spawnMole() {
                if (!this.gameActive) return;
                
                this.hideAllMoles();
                
                const randomIndex = Math.floor(Math.random() * 16);
                const mole = this.gameGrid.children[randomIndex].querySelector('.mole');
                
                mole.classList.add('active');
                this.currentMole = randomIndex;
                
                if (this.soundEnabled) {
                    this.playSound(this.moleSpawnSound, 0.3);
                }
                
                const moleDuration = Math.random() * 1000 + 800; // 0.8-1.8秒
                
                setTimeout(() => {
                    if (this.currentMole === randomIndex) {
                        mole.classList.remove('active');
                        this.currentMole = null;
                    }
                }, moleDuration);
                
                const nextSpawnTime = Math.random() * 1000 + 1000; // 1-2秒
                this.moleTimer = setTimeout(() => this.spawnMole(), nextSpawnTime);
            }

            whackMole(index) {
                if (!this.gameActive || this.currentMole !== index) return;
                
                const mole = this.gameGrid.children[index].querySelector('.mole');
                mole.classList.remove('active');
                mole.classList.add('hit');
                
                if (this.soundEnabled) {
                    this.playSound(this.moleHitSound, 0.5);
                }
                
                this.score++;
                this.scoreElement.textContent = this.score;
                this.currentMole = null;
                
                setTimeout(() => {
                    mole.classList.remove('hit');
                }, 300);
            }

            hideAllMoles() {
                const moles = this.gameGrid.querySelectorAll('.mole');
                moles.forEach(mole => {
                    mole.classList.remove('active', 'hit');
                });
            }

            endGame() {
                this.gameActive = false;
                clearInterval(this.gameTimer);
                clearTimeout(this.moleTimer);
                
                if (this.soundEnabled) {
                    this.playSound(this.gameOverSound, 0.7);
                }
                
                this.hideAllMoles();
                this.startBtn.textContent = '重新开始';
                this.startBtn.disabled = false;
                
                this.gameOverElement.textContent = `游戏结束！最终得分: ${this.score}`;
                this.gameOverElement.style.display = 'block';
            }
            playSound(audioElement, volume = 0.5) {
                try {
                    audioElement.volume = volume;
                    audioElement.currentTime = 0;
                    audioElement.play().catch(e => {
                        console.log('音频播放失败:', e);
                    });
                } catch (e) {
                    console.log('音频播放错误:', e);
                }
            }

            toggleSound() {
                this.soundEnabled = !this.soundEnabled;
                this.soundToggle.textContent = this.soundEnabled ? '开启' : '关闭';
                this.soundToggle.classList.toggle('muted', !this.soundEnabled);
            }
        }

        // 游戏初始化
        document.addEventListener('DOMContentLoaded', () => {
            new WhackAMoleGame();
        });
    </script>
</body>
</html>
