<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霓虹贪吃蛇</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial Rounded MT Bold', 'Segoe UI', sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            overflow: hidden;
            padding: 20px;
        }
        
        .game-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        .header {
            text-align: center;
            width: 100%;
        }
        
        h1 {
            color: #fff;
            font-size: 2.8rem;
            text-shadow: 0 0 10px #00eeff, 0 0 20px #00eeff, 0 0 30px #00eeff;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }
        
        .stats {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 0 10px;
        }
        
        .score, .high-score {
            color: #fff;
            font-size: 1.5rem;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 238, 255, 0.5);
            text-shadow: 0 0 5px #00eeff;
        }
        
        .canvas-container {
            position: relative;
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 238, 255, 0.6);
        }
        
        canvas {
            display: block;
            background: rgba(0, 10, 20, 0.85);
            width: 100%;
            border: 2px solid rgba(0, 238, 255, 0.5);
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
            margin-top: 10px;
        }
        
        .btn {
            background: linear-gradient(to right, #00eeff, #0077ff);
            border: none;
            border-radius: 50px;
            color: white;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 238, 255, 0.7);
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 238, 255, 0.9);
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .mobile-controls {
            display: none;
            width: 100%;
            max-width: 300px;
            margin-top: 20px;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
        }
        
        .control-btn {
            background: rgba(0, 238, 255, 0.2);
            border: 2px solid rgba(0, 238, 255, 0.5);
            border-radius: 10px;
            color: white;
            font-size: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 70px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }
        
        .control-btn:active {
            background: rgba(0, 238, 255, 0.4);
            transform: scale(0.95);
        }
        
        .up {
            grid-column: 2;
            grid-row: 1;
        }
        
        .down {
            grid-column: 2;
            grid-row: 3;
        }
        
        .left {
            grid-column: 1;
            grid-row: 2;
        }
        
        .right {
            grid-column: 3;
            grid-row: 2;
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 15px;
        }
        
        .overlay h2 {
            color: white;
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff;
            text-align: center;
        }
        
        .overlay p {
            color: #00eeff;
            font-size: 1.8rem;
            margin-bottom: 30px;
            text-shadow: 0 0 5px #00eeff;
        }
        
        .instructions {
            color: #aaa;
            text-align: center;
            margin-top: 20px;
            font-size: 1.1rem;
            line-height: 1.6;
            max-width: 500px;
        }
        
        .instructions .highlight {
            color: #00eeff;
            font-weight: bold;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
            }
            
            .score, .high-score {
                font-size: 1.2rem;
                padding: 8px 15px;
            }
            
            .mobile-controls {
                display: grid;
            }
            
            .overlay h2 {
                font-size: 2.2rem;
            }
            
            .overlay p {
                font-size: 1.5rem;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .btn {
                padding: 10px 20px;
                font-size: 1rem;
            }
            
            .overlay h2 {
                font-size: 1.8rem;
            }
            
            .overlay p {
                font-size: 1.3rem;
            }
            
            .control-btn {
                height: 60px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>霓虹贪吃蛇</h1>
            <div class="stats">
                <div class="score">分数: <span id="score">0</span></div>
                <div class="high-score">最高分: <span id="high-score">0</span></div>
            </div>
        </div>
        
        <div class="canvas-container">
            <canvas id="gameCanvas" width="600" height="450"></canvas>
            <div id="game-over" class="overlay" style="display: none;">
                <h2>游戏结束!</h2>
                <p>你的分数: <span id="final-score">0</span></p>
                <button id="restart-btn" class="btn">重新开始</button>
            </div>
            <div id="start-screen" class="overlay">
                <h2>霓虹贪吃蛇</h2>
                <button id="start-btn" class="btn">开始游戏</button>
                <div class="instructions">
                    <p>电脑: 使用<span class="highlight">方向键</span>或<span class="highlight">WASD</span>控制</p>
                    <p>手机: 使用<span class="highlight">方向按钮</span>控制</p>
                    <p>吃到<span class="highlight">发光食物</span>增加分数和长度</p>
                </div>
            </div>
        </div>
        
        <div class="controls">
            <button id="pause-btn" class="btn">暂停</button>
            <button id="reset-btn" class="btn">重置</button>
        </div>
        
        <div class="mobile-controls">
            <div class="control-btn up">↑</div>
            <div class="control-btn left">←</div>
            <div class="control-btn right">→</div>
            <div class="control-btn down">↓</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 游戏常量
            const GRID_SIZE = 20;
            const SNAKE_SPEED = 120; // 毫秒
            
            // 游戏元素
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreElement = document.getElementById('score');
            const highScoreElement = document.getElementById('high-score');
            const finalScoreElement = document.getElementById('final-score');
            const startScreen = document.getElementById('start-screen');
            const gameOverScreen = document.getElementById('game-over');
            const startBtn = document.getElementById('start-btn');
            const restartBtn = document.getElementById('restart-btn');
            const pauseBtn = document.getElementById('pause-btn');
            const resetBtn = document.getElementById('reset-btn');
            
            // 移动控制按钮
            const upBtn = document.querySelector('.control-btn.up');
            const downBtn = document.querySelector('.control-btn.down');
            const leftBtn = document.querySelector('.control-btn.left');
            const rightBtn = document.querySelector('.control-btn.right');
            
            // 游戏变量
            let snake = [];
            let food = {};
            let direction = 'right';
            let nextDirection = 'right';
            let score = 0;
            let highScore = localStorage.getItem('snakeHighScore') || 0;
            let gameInterval;
            let gameRunning = false;
            let gamePaused = false;
            
            // 设置高分显示
            highScoreElement.textContent = highScore;
            
            // 初始化游戏
            function initGame() {
                // 初始化蛇
                snake = [
                    {x: 5, y: 10},
                    {x: 4, y: 10},
                    {x: 3, y: 10}
                ];
                
                // 初始方向
                direction = 'right';
                nextDirection = 'right';
                
                // 重置分数
                score = 0;
                scoreElement.textContent = score;
                
                // 生成食物
                generateFood();
                
                // 隐藏游戏结束屏幕
                gameOverScreen.style.display = 'none';
                
                // 开始游戏循环
                if (gameInterval) clearInterval(gameInterval);
                gameInterval = setInterval(gameLoop, SNAKE_SPEED);
                gameRunning = true;
                gamePaused = false;
                pauseBtn.textContent = '暂停';
            }
            
            // 生成食物
            function generateFood() {
                const maxX = Math.floor(canvas.width / GRID_SIZE) - 1;
                const maxY = Math.floor(canvas.height / GRID_SIZE) - 1;
                
                // 确保食物不出现在蛇身上
                let newFood;
                let onSnake;
                
                do {
                    onSnake = false;
                    newFood = {
                        x: Math.floor(Math.random() * maxX),
                        y: Math.floor(Math.random() * maxY)
                    };
                    
                    // 检查是否在蛇身上
                    for (let segment of snake) {
                        if (segment.x === newFood.x && segment.y === newFood.y) {
                            onSnake = true;
                            break;
                        }
                    }
                } while (onSnake);
                
                food = newFood;
            }
            
            // 游戏主循环
            function gameLoop() {
                if (gamePaused) return;
                
                // 更新蛇的位置
                moveSnake();
                
                // 检查碰撞
                if (checkCollision()) {
                    gameOver();
                    return;
                }
                
                // 检查是否吃到食物
                checkFood();
                
                // 绘制游戏
                draw();
            }
            
            // 移动蛇
            function moveSnake() {
                direction = nextDirection;
                
                // 根据方向计算新头部位置
                const head = {...snake[0]};
                
                switch (direction) {
                    case 'up':
                        head.y -= 1;
                        break;
                    case 'down':
                        head.y += 1;
                        break;
                    case 'left':
                        head.x -= 1;
                        break;
                    case 'right':
                        head.x += 1;
                        break;
                }
                
                // 添加新头部
                snake.unshift(head);
                
                // 如果没有吃到食物，移除尾部
                if (head.x !== food.x || head.y !== food.y) {
                    snake.pop();
                }
            }
            
            // 检查碰撞
            function checkCollision() {
                const head = snake[0];
                
                // 检查撞墙
                if (
                    head.x < 0 || 
                    head.x >= canvas.width / GRID_SIZE ||
                    head.y < 0 || 
                    head.y >= canvas.height / GRID_SIZE
                ) {
                    return true;
                }
                
                // 检查撞到自己
                for (let i = 1; i < snake.length; i++) {
                    if (head.x === snake[i].x && head.y === snake[i].y) {
                        return true;
                    }
                }
                
                return false;
            }
            
            // 检查是否吃到食物
            function checkFood() {
                const head = snake[0];
                
                if (head.x === food.x && head.y === food.y) {
                    // 增加分数
                    score += 10;
                    scoreElement.textContent = score;
                    
                    // 生成新食物
                    generateFood();
                    
                    // 添加蛇身长度在移动中处理
                }
            }
            
            // 游戏结束
            function gameOver() {
                clearInterval(gameInterval);
                gameRunning = false;
                
                // 更新最高分
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('snakeHighScore', highScore);
                    highScoreElement.textContent = highScore;
                }
                
                // 显示最终分数
                finalScoreElement.textContent = score;
                
                // 显示游戏结束屏幕
                gameOverScreen.style.display = 'flex';
            }
            
            // 绘制游戏
            function draw() {
                // 清除画布
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // 绘制网格背景
                drawGrid();
                
                // 绘制食物
                drawFood();
                
                // 绘制蛇
                drawSnake();
                
                // 绘制霓虹边框
                drawNeonBorder();
            }
            
            // 绘制网格背景
            function drawGrid() {
                ctx.strokeStyle = 'rgba(0, 100, 150, 0.1)';
                ctx.lineWidth = 0.5;
                
                // 绘制垂直线
                for (let x = 0; x <= canvas.width; x += GRID_SIZE) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                    ctx.stroke();
                }
                
                // 绘制水平线
                for (let y = 0; y <= canvas.height; y += GRID_SIZE) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }
            }
            
            // 绘制食物
            function drawFood() {
                // 食物发光效果
                ctx.shadowColor = '#ff0055';
                ctx.shadowBlur = 15;
                
                // 绘制食物
                ctx.fillStyle = '#ff0055';
                ctx.beginPath();
                ctx.arc(
                    food.x * GRID_SIZE + GRID_SIZE / 2,
                    food.y * GRID_SIZE + GRID_SIZE / 2,
                    GRID_SIZE / 2 - 2,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
                
                // 重置阴影
                ctx.shadowBlur = 0;
            }
            
            // 绘制蛇
            function drawSnake() {
                // 绘制蛇身
                snake.forEach((segment, index) => {
                    if (index === 0) {
                        // 蛇头
                        drawSnakeHead(segment);
                    } else {
                        // 蛇身
                        drawSnakeSegment(segment);
                    }
                });
            }
            
            // 绘制蛇身段
            function drawSnakeSegment(segment) {
                // 发光效果
                ctx.shadowColor = '#00eeff';
                ctx.shadowBlur = 10;
                
                // 蛇身
                ctx.fillStyle = '#00eeff';
                ctx.fillRect(
                    segment.x * GRID_SIZE + 2,
                    segment.y * GRID_SIZE + 2,
                    GRID_SIZE - 4,
                    GRID_SIZE - 4
                );
                
                // 蛇身内部
                ctx.fillStyle = '#00aaff';
                ctx.fillRect(
                    segment.x * GRID_SIZE + 4,
                    segment.y * GRID_SIZE + 4,
                    GRID_SIZE - 8,
                    GRID_SIZE - 8
                );
                
                // 重置阴影
                ctx.shadowBlur = 0;
            }
            
            // 绘制蛇头
            function drawSnakeHead(head) {
                // 头部发光效果
                ctx.shadowColor = '#00eeff';
                ctx.shadowBlur = 15;
                
                // 蛇头
                ctx.fillStyle = '#00eeff';
                ctx.fillRect(
                    head.x * GRID_SIZE + 2,
                    head.y * GRID_SIZE + 2,
                    GRID_SIZE - 4,
                    GRID_SIZE - 4
                );
                
                // 蛇眼
                ctx.fillStyle = '#000';
                const eyeSize = GRID_SIZE / 8;
                
                // 根据方向调整眼睛位置
                let leftEyeX, leftEyeY, rightEyeX, rightEyeY;
                
                switch (direction) {
                    case 'up':
                        leftEyeX = head.x * GRID_SIZE + GRID_SIZE / 3;
                        leftEyeY = head.y * GRID_SIZE + GRID_SIZE / 3;
                        rightEyeX = head.x * GRID_SIZE + 2 * GRID_SIZE / 3;
                        rightEyeY = head.y * GRID_SIZE + GRID_SIZE / 3;
                        break;
                    case 'down':
                        leftEyeX = head.x * GRID_SIZE + GRID_SIZE / 3;
                        leftEyeY = head.y * GRID_SIZE + 2 * GRID_SIZE / 3;
                        rightEyeX = head.x * GRID_SIZE + 2 * GRID_SIZE / 3;
                        rightEyeY = head.y * GRID_SIZE + 2 * GRID_SIZE / 3;
                        break;
                    case 'left':
                        leftEyeX = head.x * GRID_SIZE + GRID_SIZE / 3;
                        leftEyeY = head.y * GRID_SIZE + GRID_SIZE / 3;
                        rightEyeX = head.x * GRID_SIZE + GRID_SIZE / 3;
                        rightEyeY = head.y * GRID_SIZE + 2 * GRID_SIZE / 3;
                        break;
                    case 'right':
                        leftEyeX = head.x * GRID_SIZE + 2 * GRID_SIZE / 3;
                        leftEyeY = head.y * GRID_SIZE + GRID_SIZE / 3;
                        rightEyeX = head.x * GRID_SIZE + 2 * GRID_SIZE / 3;
                        rightEyeY = head.y * GRID_SIZE + 2 * GRID_SIZE / 3;
                        break;
                }
                
                ctx.beginPath();
                ctx.arc(leftEyeX, leftEyeY, eyeSize, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(rightEyeX, rightEyeY, eyeSize, 0, Math.PI * 2);
                ctx.fill();
                
                // 重置阴影
                ctx.shadowBlur = 0;
            }
            
            // 绘制霓虹边框
            function drawNeonBorder() {
                ctx.strokeStyle = '#00eeff';
                ctx.lineWidth = 4;
                ctx.shadowColor = '#00eeff';
                ctx.shadowBlur = 10;
                
                ctx.beginPath();
                ctx.rect(0, 0, canvas.width, canvas.height);
                ctx.stroke();
                
                // 重置阴影
                ctx.shadowBlur = 0;
            }
            
            // 键盘控制
            document.addEventListener('keydown', (e) => {
                if (!gameRunning) return;
                
                switch (e.key) {
                    case 'ArrowUp':
                    case 'w':
                    case 'W':
                        if (direction !== 'down') nextDirection = 'up';
                        break;
                    case 'ArrowDown':
                    case 's':
                    case 'S':
                        if (direction !== 'up') nextDirection = 'down';
                        break;
                    case 'ArrowLeft':
                    case 'a':
                    case 'A':
                        if (direction !== 'right') nextDirection = 'left';
                        break;
                    case 'ArrowRight':
                    case 'd':
                    case 'D':
                        if (direction !== 'left') nextDirection = 'right';
                        break;
                }
            });
            
            // 移动控制按钮事件
            upBtn.addEventListener('click', () => {
                if (gameRunning && direction !== 'down') nextDirection = 'up';
            });
            
            downBtn.addEventListener('click', () => {
                if (gameRunning && direction !== 'up') nextDirection = 'down';
            });
            
            leftBtn.addEventListener('click', () => {
                if (gameRunning && direction !== 'right') nextDirection = 'left';
            });
            
            rightBtn.addEventListener('click', () => {
                if (gameRunning && direction !== 'left') nextDirection = 'right';
            });
            
            // 触摸滑动控制
            let touchStartX = 0;
            let touchStartY = 0;
            
            canvas.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                e.preventDefault();
            });
            
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
            });
            
            canvas.addEventListener('touchend', (e) => {
                if (!gameRunning) return;
                
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;
                
                const dx = touchEndX - touchStartX;
                const dy = touchEndY - touchStartY;
                
                // 确定主要移动方向
                if (Math.abs(dx) > Math.abs(dy)) {
                    // 水平移动
                    if (dx > 0 && direction !== 'left') {
                        nextDirection = 'right';
                    } else if (dx < 0 && direction !== 'right') {
                        nextDirection = 'left';
                    }
                } else {
                    // 垂直移动
                    if (dy > 0 && direction !== 'up') {
                        nextDirection = 'down';
                    } else if (dy < 0 && direction !== 'down') {
                        nextDirection = 'up';
                    }
                }
                
                e.preventDefault();
            });
            
            // 按钮事件监听
            startBtn.addEventListener('click', () => {
                startScreen.style.display = 'none';
                initGame();
            });
            
            restartBtn.addEventListener('click', () => {
                gameOverScreen.style.display = 'none';
                initGame();
            });
            
            pauseBtn.addEventListener('click', () => {
                if (!gameRunning) return;
                
                gamePaused = !gamePaused;
                pauseBtn.textContent = gamePaused ? '继续' : '暂停';
            });
            
            resetBtn.addEventListener('click', () => {
                if (gameInterval) clearInterval(gameInterval);
                initGame();
            });
            
            // 初始调整画布大小
            function resizeCanvas() {
                const container = canvas.parentElement;
                const containerWidth = container.clientWidth;
                
                // 保持16:9的宽高比
                canvas.width = containerWidth;
                canvas.height = Math.floor(containerWidth * 0.75);
            }
            
            // 窗口大小变化时调整画布
            window.addEventListener('resize', resizeCanvas);
            
            // 初始调整
            resizeCanvas();
        });
    </script>
</body>
</html>
