<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水印处理 - 图片处理工具集</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {}
            }
        }
    </script>
    <style>
        :root {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
            --bg-primary: #0f0f23;
            --bg-secondary: #1a1a2e;
            --bg-accent: #16213e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent-color: #667eea;
            --accent-secondary: #764ba2;
            --success-color: #10b981;
            --error-color: #ef4444;
            --warning-color: #f59e0b;
            --info-color: #3b82f6;
        }
        
        body {
            background: linear-gradient(-45deg, #0f0f23, #1a1a2e, #667eea, #0f0f23);
            min-height: 100vh;
        }
        
        body.animated {
            background: linear-gradient(-45deg, #0f0f23, #1a1a2e, #16213e, #0f0f23);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }
        
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        
        .gradient-button {
            background: linear-gradient(135deg, var(--accent-color), var(--accent-secondary));
            border: none;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .gradient-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        
        .gradient-button:hover::before {
            left: 100%;
        }
        
        .gradient-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
        }
        
        .watermark-type-button {
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        
        .watermark-type-button.active {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.2);
        }
        
        .position-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
        }
        
        .position-button {
            aspect-ratio: 1;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        
        .position-button.active {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.3);
        }
        
        .position-button:hover {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }
        
        .file-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .file-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-color), var(--accent-secondary));
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }
        
        .file-item:hover::before {
            transform: scaleX(1);
        }
        
        .file-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        
        .progress-bar {
            background: linear-gradient(90deg, var(--accent-color), var(--accent-secondary));
            transition: width 0.3s ease;
            border-radius: 4px;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .floating {
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(102, 126, 234, 0.3); }
            50% { box-shadow: 0 0 30px rgba(102, 126, 234, 0.6); }
        }
        
        .glow {
            animation: glow 2s ease-in-out infinite;
        }
        
        .dropzone {
            border: 2px dashed rgba(59, 130, 246, 0.5);
            transition: all 0.3s ease;
        }
        
        .dropzone.dragover {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }
        
        .preview-canvas {
            max-width: 100%;
            max-height: 300px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0.5rem;
        }
        
        /* 修复下拉选择框样式 */
        select {
            background-color: rgba(26, 26, 46, 0.8) !important;
            color: #ffffff !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
        }
        
        select option {
            background-color: #1a1a2e !important;
            color: #ffffff !important;
            padding: 8px !important;
        }
        
        select option:hover {
            background-color: #16213e !important;
        }
    </style>
</head>
<body class="text-white">
    <!-- Header -->
    <header class="glass-card border-b border-white/20 sticky top-0 z-50">
        <div class="px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 bg-gradient-to-r from-blue-500 to-purple-600 rounded-lg flex items-center justify-center">
                        <span class="text-white font-bold text-sm">IT</span>
                    </div>
                    <span class="text-xl font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">
                        图片工具集 - 水印处理
                    </span>
                </div>
                
                <div class="flex items-center space-x-4">
                    <button id="colorToggle" class="gradient-button px-4 py-2 rounded-lg text-sm font-medium text-white">
                        <svg class="w-4 h-4 mr-2 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zM21 5a2 2 0 00-2-2h-4a2 2 0 00-2 2v6a2 2 0 002 2h4a2 2 0 002-2V5z"></path>
                        </svg>
                        切换颜色
                    </button>
                    <div class="flex items-center space-x-3 glass-card px-3 py-2">
                        <div class="w-8 h-8 bg-gradient-to-r from-green-400 to-blue-500 rounded-full flex items-center justify-center">
                            <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path>
                            </svg>
                        </div>
                        <div class="hidden sm:block">
                            <div class="text-sm font-medium text-white">风沙</div>
                            <div class="text-xs text-gray-400">开发者</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-6 py-8 space-y-8">
        <!-- Page Title -->
        <div class="text-center relative">
            <h1 class="text-4xl font-bold text-white mb-4">
                <svg class="inline-block w-10 h-10 mr-3 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zM21 5a2 2 0 00-2-2h-4a2 2 0 00-2 2v12a4 4 0 004 4h4a2 2 0 002-2V5z"></path>
                </svg>
                图片水印处理
            </h1>
            <p class="text-xl text-gray-400">
                为图片添加文字或图片水印，保护版权
            </p>
        </div>

        <!-- Watermark Type Selection -->
        <div class="glass-card p-6">
            <h3 class="text-lg font-semibold text-white mb-4 flex items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zM21 5a2 2 0 00-2-2h-4a2 2 0 00-2 2v12a4 4 0 004 4h4a2 2 0 002-2V5z"></path>
                </svg>
                水印类型
            </h3>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <button class="watermark-type-button glass-card p-4 text-center active" data-type="text">
                    <div class="text-2xl mb-2">📝</div>
                    <div class="font-semibold text-white">文字水印</div>
                    <div class="text-sm text-gray-400">添加自定义文字水印</div>
                </button>
                
                <button class="watermark-type-button glass-card p-4 text-center" data-type="image">
                    <div class="text-2xl mb-2">🖼️</div>
                    <div class="font-semibold text-white">图片水印</div>
                    <div class="text-sm text-gray-400">上传图片作为水印</div>
                </button>
            </div>
        </div>

        <!-- Watermark Settings -->
        <div class="glass-card p-6">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-semibold text-white flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    水印设置
                </h3>
                <button id="toggleSettings" class="text-blue-400 hover:text-blue-300 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </button>
            </div>
            
            <div id="settingsContent" class="space-y-6">
                <!-- Text Watermark Settings -->
                <div id="textSettings" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">水印文字</label>
                            <input type="text" id="watermarkText" value="© 2025 风沙" class="w-full px-3 py-2 bg-white/10 border border-white/20 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">字体大小</label>
                            <div class="flex items-center space-x-3">
                                <input type="range" id="fontSizeSlider" min="12" max="72" value="24" class="flex-1">
                                <span id="fontSizeValue" class="text-blue-400 font-medium min-w-[3rem]">24px</span>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">文字颜色</label>
                            <input type="color" id="textColor" value="#ffffff" class="w-full h-10 rounded-lg border border-white/20">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">字体</label>
                            <select id="fontFamily" class="w-full px-3 py-2 bg-white/10 border border-white/20 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="Arial">Arial</option>
                                <option value="Microsoft YaHei">微软雅黑</option>
                                <option value="SimHei">黑体</option>
                                <option value="SimSun">宋体</option>
                                <option value="Times New Roman">Times New Roman</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <!-- Image Watermark Settings -->
                <div id="imageSettings" class="space-y-4 hidden">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">水印图片</label>
                            <input type="file" id="watermarkImageInput" accept="image/*" class="w-full px-3 py-2 bg-white/10 border border-white/20 rounded-lg text-white file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-blue-600 file:text-white hover:file:bg-blue-700">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">缩放比例</label>
                            <div class="flex items-center space-x-3">
                                <input type="range" id="scaleSlider" min="0.1" max="2" step="0.1" value="0.3" class="flex-1">
                                <span id="scaleValue" class="text-blue-400 font-medium min-w-[3rem]">0.3</span>
                            </div>
                        </div>
                    </div>
                    
                    <div id="watermarkImagePreview" class="hidden">
                        <img id="watermarkImageDisplay" class="max-w-32 max-h-32 object-contain rounded-lg border border-white/20">
                    </div>
                </div>
                
                <!-- Common Settings -->
                <div class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">透明度</label>
                            <div class="flex items-center space-x-3">
                                <input type="range" id="opacitySlider" min="0.1" max="1" step="0.1" value="0.7" class="flex-1">
                                <span id="opacityValue" class="text-blue-400 font-medium min-w-[3rem]">0.7</span>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">水印位置</label>
                            <div class="position-grid">
                                <button class="position-button glass-card rounded-lg" data-position="top-left" title="左上">↖</button>
                                <button class="position-button glass-card rounded-lg" data-position="top-center" title="上中">↑</button>
                                <button class="position-button glass-card rounded-lg" data-position="top-right" title="右上">↗</button>
                                <button class="position-button glass-card rounded-lg" data-position="middle-left" title="左中">←</button>
                                <button class="position-button glass-card rounded-lg active" data-position="center" title="居中">⊙</button>
                                <button class="position-button glass-card rounded-lg" data-position="middle-right" title="右中">→</button>
                                <button class="position-button glass-card rounded-lg" data-position="bottom-left" title="左下">↙</button>
                                <button class="position-button glass-card rounded-lg" data-position="bottom-center" title="下中">↓</button>
                                <button class="position-button glass-card rounded-lg" data-position="bottom-right" title="右下">↘</button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Preview -->
                <div id="previewSection" class="hidden">
                    <label class="block text-sm font-medium text-gray-300 mb-2">预览效果</label>
                    <div class="text-center">
                        <canvas id="previewCanvas" class="preview-canvas"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Upload Area -->
        <div class="glass-card p-8">
            <div id="dropzone" class="dropzone rounded-lg p-8 text-center cursor-pointer">
                <svg class="mx-auto h-12 w-12 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                </svg>
                <p class="text-lg font-medium text-gray-300 mb-2">拖拽图片到此处或点击选择</p>
                <p class="text-sm text-gray-400">支持 JPG、PNG、WebP、BMP 格式</p>
                <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
            </div>
        </div>

        <!-- File List -->
        <div id="fileList" class="space-y-4"></div>

        <!-- Batch Actions -->
        <div id="batchActions" class="glass-card p-4 hidden">
            <div class="flex flex-wrap gap-4 justify-center">
                <button id="batchWatermark" class="gradient-button px-6 py-2 rounded-lg font-medium text-white">
                    批量添加水印
                </button>
                <button id="batchDownload" class="bg-green-600 hover:bg-green-700 px-6 py-2 rounded-lg font-medium text-white transition-colors">
                    批量下载
                </button>
                <button id="downloadZip" class="bg-purple-600 hover:bg-purple-700 px-6 py-2 rounded-lg font-medium text-white transition-colors">
                    打包下载ZIP
                </button>
                <button id="clearAll" class="bg-red-600 hover:bg-red-700 px-6 py-2 rounded-lg font-medium text-white transition-colors">
                    清空所有
                </button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="glass-card border-t border-white/20 mt-auto">
        <div class="px-6 py-4">
            <div class="flex flex-col md:flex-row items-center justify-between space-y-4 md:space-y-0">
                <div class="flex items-center space-x-4 text-sm text-gray-400">
                    <div class="flex items-center space-x-2">
                        <span>&copy; 2025 图片处理工具集</span>
                        <span class="text-gray-600">|</span>
                        <span class="flex items-center space-x-1">
                            <span>Made with</span>
                            <svg class="w-4 h-4 text-red-400" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd"></path>
                            </svg>
                            <span>by 风沙</span>
                        </span>
                    </div>
                </div>
                
                <div class="flex items-center text-sm">
                    <div class="flex items-center space-x-2 glass-card px-4 py-2">
                        <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                        <span class="text-white font-medium" id="currentTime"></span>
                    </div>
                </div>
                
                <div class="flex items-center space-x-4 text-xs text-gray-500">
                    <span>联系作者</span>
                    <div class="flex items-center space-x-2">
                        <span class="px-2 py-1 bg-green-500/20 text-green-300 rounded">微信: Love_Gws_1314</span>
                        <span class="px-2 py-1 bg-blue-500/20 text-blue-300 rounded">作者: 风沙</span>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // 全局变量
        let files = [];
        let watermarkType = 'text';
        let watermarkImage = null;
        let settings = {
            text: '© 2025 风沙',
            fontSize: 24,
            fontFamily: 'Arial',
            color: '#ffffff',
            opacity: 0.7,
            position: 'center',
            scale: 0.3
        };

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initializeEventListeners();
            updateTime();
            setInterval(updateTime, 1000);
        });

        function initializeEventListeners() {
            // 水印类型选择
            document.querySelectorAll('.watermark-type-button').forEach(button => {
                button.addEventListener('click', selectWatermarkType);
            });
            
            // 位置选择
            document.querySelectorAll('.position-button').forEach(button => {
                button.addEventListener('click', selectPosition);
            });
            
            // 设置面板切换
            document.getElementById('toggleSettings').addEventListener('click', toggleSettings);
            
            // 设置项监听
            document.getElementById('watermarkText').addEventListener('input', updateSettings);
            document.getElementById('fontSizeSlider').addEventListener('input', updateFontSize);
            document.getElementById('textColor').addEventListener('input', updateSettings);
            document.getElementById('fontFamily').addEventListener('change', updateSettings);
            document.getElementById('opacitySlider').addEventListener('input', updateOpacity);
            document.getElementById('scaleSlider').addEventListener('input', updateScale);
            document.getElementById('watermarkImageInput').addEventListener('change', handleWatermarkImageUpload);
            
            // 文件上传
            const dropzone = document.getElementById('dropzone');
            const fileInput = document.getElementById('fileInput');
            
            dropzone.addEventListener('click', () => fileInput.click());
            dropzone.addEventListener('dragover', handleDragOver);
            dropzone.addEventListener('dragleave', handleDragLeave);
            dropzone.addEventListener('drop', handleDrop);
            fileInput.addEventListener('change', handleFileSelect);
            
            // 批量操作
            document.getElementById('batchWatermark').addEventListener('click', batchWatermark);
            document.getElementById('batchDownload').addEventListener('click', batchDownload);
            document.getElementById('downloadZip').addEventListener('click', downloadZip);
            document.getElementById('clearAll').addEventListener('click', clearAll);
            
            // 颜色切换按钮
            document.getElementById('colorToggle').addEventListener('click', toggleColorAnimation);
        }

        function selectWatermarkType(e) {
            document.querySelectorAll('.watermark-type-button').forEach(btn => btn.classList.remove('active'));
            e.currentTarget.classList.add('active');
            watermarkType = e.currentTarget.dataset.type;
            
            // 切换设置面板
            document.getElementById('textSettings').style.display = watermarkType === 'text' ? 'block' : 'none';
            document.getElementById('imageSettings').style.display = watermarkType === 'image' ? 'block' : 'none';
            
            updatePreview();
        }

        function selectPosition(e) {
            document.querySelectorAll('.position-button').forEach(btn => btn.classList.remove('active'));
            e.currentTarget.classList.add('active');
            settings.position = e.currentTarget.dataset.position;
            updatePreview();
        }

        function toggleSettings() {
            const content = document.getElementById('settingsContent');
            const button = document.getElementById('toggleSettings');
            const isHidden = content.style.display === 'none';
            
            content.style.display = isHidden ? 'block' : 'none';
            button.style.transform = isHidden ? 'rotate(180deg)' : 'rotate(0deg)';
        }

        function updateFontSize() {
            const value = document.getElementById('fontSizeSlider').value;
            document.getElementById('fontSizeValue').textContent = value + 'px';
            settings.fontSize = parseInt(value);
            updatePreview();
        }

        function updateOpacity() {
            const value = document.getElementById('opacitySlider').value;
            document.getElementById('opacityValue').textContent = value;
            settings.opacity = parseFloat(value);
            updatePreview();
        }

        function updateScale() {
            const value = document.getElementById('scaleSlider').value;
            document.getElementById('scaleValue').textContent = value;
            settings.scale = parseFloat(value);
            updatePreview();
        }

        function updateSettings() {
            settings.text = document.getElementById('watermarkText').value;
            settings.color = document.getElementById('textColor').value;
            settings.fontFamily = document.getElementById('fontFamily').value;
            updatePreview();
        }

        function handleWatermarkImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            if (!file.type.startsWith('image/')) {
                showToast('请选择有效的图片文件', 'error');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(event) {
                watermarkImage = new Image();
                watermarkImage.onload = function() {
                    document.getElementById('watermarkImageDisplay').src = event.target.result;
                    document.getElementById('watermarkImagePreview').classList.remove('hidden');
                    updatePreview();
                };
                watermarkImage.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function updatePreview() {
            if (files.length === 0) return;
            
            const firstFile = files[0];
            if (!firstFile) return;
            
            const canvas = document.getElementById('previewCanvas');
            const ctx = canvas.getContext('2d');
            
            const img = new Image();
            img.onload = function() {
                // 设置画布尺寸
                const maxWidth = 400;
                const maxHeight = 300;
                const scale = Math.min(maxWidth / img.width, maxHeight / img.height);
                
                canvas.width = img.width * scale;
                canvas.height = img.height * scale;
                
                // 绘制原图
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                
                // 添加水印
                addWatermarkToCanvas(ctx, canvas.width, canvas.height);
                
                document.getElementById('previewSection').classList.remove('hidden');
            };
            img.src = firstFile.preview;
        }

        function addWatermarkToCanvas(ctx, width, height) {
            ctx.globalAlpha = settings.opacity;
            
            if (watermarkType === 'text' && settings.text) {
                // 文字水印
                ctx.font = `${settings.fontSize}px ${settings.fontFamily}`;
                ctx.fillStyle = settings.color;
                
                const textMetrics = ctx.measureText(settings.text);
                const { x, y } = getWatermarkPosition(width, height, textMetrics.width, settings.fontSize);
                
                ctx.fillText(settings.text, x, y);
            } else if (watermarkType === 'image' && watermarkImage) {
                // 图片水印
                const wmWidth = watermarkImage.width * settings.scale;
                const wmHeight = watermarkImage.height * settings.scale;
                const { x, y } = getWatermarkPosition(width, height, wmWidth, wmHeight);
                
                ctx.drawImage(watermarkImage, x, y, wmWidth, wmHeight);
            }
            
            ctx.globalAlpha = 1;
        }

        function getWatermarkPosition(canvasWidth, canvasHeight, wmWidth, wmHeight) {
            const padding = 20;
            let x = 0, y = 0;
            
            switch (settings.position) {
                case 'top-left':
                    x = padding;
                    y = padding + (watermarkType === 'text' ? 0 : 0);
                    break;
                case 'top-center':
                    x = (canvasWidth - wmWidth) / 2;
                    y = padding + (watermarkType === 'text' ? 0 : 0);
                    break;
                case 'top-right':
                    x = canvasWidth - wmWidth - padding;
                    y = padding + (watermarkType === 'text' ? 0 : 0);
                    break;
                case 'middle-left':
                    x = padding;
                    y = (canvasHeight - wmHeight) / 2 + (watermarkType === 'text' ? wmHeight / 2 : 0);
                    break;
                case 'center':
                    x = (canvasWidth - wmWidth) / 2;
                    y = (canvasHeight - wmHeight) / 2 + (watermarkType === 'text' ? wmHeight / 2 : 0);
                    break;
                case 'middle-right':
                    x = canvasWidth - wmWidth - padding;
                    y = (canvasHeight - wmHeight) / 2 + (watermarkType === 'text' ? wmHeight / 2 : 0);
                    break;
                case 'bottom-left':
                    x = padding;
                    y = canvasHeight - padding - (watermarkType === 'text' ? 0 : wmHeight);
                    break;
                case 'bottom-center':
                    x = (canvasWidth - wmWidth) / 2;
                    y = canvasHeight - padding - (watermarkType === 'text' ? 0 : wmHeight);
                    break;
                case 'bottom-right':
                    x = canvasWidth - wmWidth - padding;
                    y = canvasHeight - padding - (watermarkType === 'text' ? 0 : wmHeight);
                    break;
            }
            
            return { x, y };
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.currentTarget.classList.add('dragover');
        }

        function handleDragLeave(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('dragover');
        }

        function handleDrop(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('dragover');
            const droppedFiles = Array.from(e.dataTransfer.files);
            addFiles(droppedFiles);
        }

        function handleFileSelect(e) {
            const selectedFiles = Array.from(e.target.files);
            addFiles(selectedFiles);
        }

        function addFiles(newFiles) {
            const validFiles = newFiles.filter(file => {
                if (!file.type.startsWith('image/')) {
                    showToast(`${file.name} 不是有效的图片文件`, 'error');
                    return false;
                }
                if (file.size > 50 * 1024 * 1024) {
                    showToast(`${file.name} 文件过大 (>50MB)`, 'error');
                    return false;
                }
                return true;
            });

            validFiles.forEach(file => {
                const fileObj = {
                    id: Date.now() + Math.random(),
                    file: file,
                    name: file.name,
                    size: file.size,
                    type: file.type,
                    preview: URL.createObjectURL(file),
                    watermarked: null,
                    status: 'pending'
                };
                files.push(fileObj);
            });

            if (validFiles.length > 0) {
                showToast(`成功添加 ${validFiles.length} 个文件`, 'success');
                renderFileList();
                updateBatchActions();
                updatePreview();
            }
        }

        function renderFileList() {
            const container = document.getElementById('fileList');
            container.innerHTML = '';

            files.forEach(fileObj => {
                const fileElement = createFileElement(fileObj);
                container.appendChild(fileElement);
            });
        }

        function createFileElement(fileObj) {
            const div = document.createElement('div');
            div.className = 'glass-card p-4 file-item';
            div.innerHTML = `
                <div class="flex items-center space-x-4">
                    <img src="${fileObj.preview}" alt="${fileObj.name}" class="w-16 h-16 object-cover rounded-lg">
                    <div class="flex-1">
                        <h4 class="font-medium text-white">${fileObj.name}</h4>
                        <p class="text-sm text-gray-400">${formatFileSize(fileObj.size)} • ${fileObj.type}</p>
                        ${fileObj.status === 'processing' ? `
                            <div class="mt-2">
                                <div class="w-full bg-gray-700 rounded-full h-2">
                                    <div class="progress-bar h-2 rounded-full" style="width: ${fileObj.progress || 0}%"></div>
                                </div>
                            </div>
                        ` : ''}
                        ${fileObj.watermarked ? `
                            <p class="text-sm text-green-400 mt-1">
                                水印添加完成 • ${formatFileSize(fileObj.watermarked.size)}
                            </p>
                        ` : ''}
                    </div>
                    <div class="flex space-x-2">
                        ${fileObj.status === 'pending' ? `
                            <button onclick="addWatermarkToFile('${fileObj.id}')" class="gradient-button px-4 py-2 rounded-lg text-sm font-medium text-white">
                                添加水印
                            </button>
                        ` : ''}
                        ${fileObj.watermarked ? `
                            <button onclick="downloadFile('${fileObj.id}')" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded-lg text-sm font-medium text-white transition-colors">
                                下载
                            </button>
                        ` : ''}
                        <button onclick="removeFile('${fileObj.id}')" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg text-sm font-medium text-white transition-colors">
                            删除
                        </button>
                    </div>
                </div>
            `;
            return div;
        }

        async function addWatermarkToFile(fileId) {
            const fileObj = files.find(f => f.id == fileId);
            if (!fileObj) return;

            if (watermarkType === 'text' && !settings.text) {
                showToast('请输入水印文字', 'warning');
                return;
            }
            
            if (watermarkType === 'image' && !watermarkImage) {
                showToast('请上传水印图片', 'warning');
                return;
            }

            fileObj.status = 'processing';
            fileObj.progress = 0;
            renderFileList();

            try {
                const watermarked = await applyWatermark(fileObj.file);
                fileObj.watermarked = watermarked;
                fileObj.status = 'completed';
                fileObj.progress = 100;
                showToast(`${fileObj.name} 水印添加完成`, 'success');
            } catch (error) {
                fileObj.status = 'error';
                showToast(`${fileObj.name} 水印添加失败: ${error.message}`, 'error');
            }

            renderFileList();
        }

        async function applyWatermark(file) {
            return new Promise((resolve, reject) => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const img = new Image();

                img.onload = function() {
                    canvas.width = img.width;
                    canvas.height = img.height;

                    // 绘制原图
                    ctx.drawImage(img, 0, 0);

                    // 添加水印
                    addWatermarkToCanvas(ctx, canvas.width, canvas.height);

                    // 转换为blob
                    canvas.toBlob((blob) => {
                        if (blob) {
                            resolve({
                                blob: blob,
                                size: blob.size,
                                name: file.name.replace(/\.[^/.]+$/, '_watermarked$&')
                            });
                        } else {
                            reject(new Error('水印添加失败'));
                        }
                    }, file.type, 0.9);
                };

                img.onerror = () => reject(new Error('图片加载失败'));
                img.src = URL.createObjectURL(file);
            });
        }

        function downloadFile(fileId) {
            const fileObj = files.find(f => f.id == fileId);
            if (!fileObj || !fileObj.watermarked) return;

            const url = URL.createObjectURL(fileObj.watermarked.blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileObj.watermarked.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showToast('下载成功', 'success');
        }

        function removeFile(fileId) {
            files = files.filter(f => f.id != fileId);
            renderFileList();
            updateBatchActions();
            updatePreview();
        }

        async function batchWatermark() {
            const pendingFiles = files.filter(f => f.status === 'pending');
            if (pendingFiles.length === 0) {
                showToast('没有可处理的文件', 'warning');
                return;
            }

            for (const fileObj of pendingFiles) {
                await addWatermarkToFile(fileObj.id);
            }
        }

        function batchDownload() {
            const watermarkedFiles = files.filter(f => f.watermarked);
            if (watermarkedFiles.length === 0) {
                showToast('没有可下载的水印文件', 'warning');
                return;
            }

            watermarkedFiles.forEach(fileObj => {
                downloadFile(fileObj.id);
            });
        }

        async function downloadZip() {
            const watermarkedFiles = files.filter(f => f.watermarked);
            if (watermarkedFiles.length === 0) {
                showToast('没有可下载的水印文件', 'warning');
                return;
            }

            try {
                const zip = new JSZip();
                const timestamp = new Date().toISOString().slice(0, 19).replace(/:/g, '-');
                
                // 添加文件到ZIP
                for (const fileObj of watermarkedFiles) {
                    zip.file(fileObj.watermarked.name, fileObj.watermarked.blob);
                }

                // 生成ZIP文件
                const zipBlob = await zip.generateAsync({type: 'blob'});
                
                // 下载ZIP文件
                const url = URL.createObjectURL(zipBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `watermarked_images_${timestamp}.zip`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                showToast(`成功打包下载 ${watermarkedFiles.length} 个文件`, 'success');
            } catch (error) {
                showToast('ZIP打包失败: ' + error.message, 'error');
            }
        }

        function clearAll() {
            if (files.length === 0) return;
            
            if (confirm('确定要清空所有文件吗？')) {
                files.forEach(fileObj => {
                    if (fileObj.preview) URL.revokeObjectURL(fileObj.preview);
                });
                files = [];
                renderFileList();
                updateBatchActions();
                document.getElementById('previewSection').classList.add('hidden');
                showToast('已清空所有文件', 'info');
            }
        }

        function updateBatchActions() {
            const batchActions = document.getElementById('batchActions');
            batchActions.style.display = files.length > 0 ? 'block' : 'none';
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                weekday: 'long'
            }) + ' ' + now.toLocaleTimeString('zh-CN', {
                hour12: false
            });
            document.getElementById('currentTime').textContent = timeString;
        }

        function toggleColorAnimation() {
            const body = document.body;
            const button = document.getElementById('colorToggle');
            
            if (body.classList.contains('animated')) {
                body.classList.remove('animated');
                button.textContent = '开启颜色';
                showToast('颜色动画已关闭', 'info');
            } else {
                body.classList.add('animated');
                button.textContent = '关闭颜色';
                showToast('颜色动画已开启', 'success');
            }
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            const colors = {
                success: 'linear-gradient(135deg, var(--success-color), #059669)',
                error: 'linear-gradient(135deg, var(--error-color), #dc2626)',
                warning: 'linear-gradient(135deg, var(--warning-color), #d97706)',
                info: 'linear-gradient(135deg, var(--info-color), #2563eb)'
            };
            
            toast.className = 'toast';
            toast.style.background = colors[type];
            toast.style.backdropFilter = 'blur(10px)';
            toast.style.border = '1px solid rgba(255, 255, 255, 0.1)';
            toast.style.boxShadow = '0 8px 32px rgba(0, 0, 0, 0.3)';
            toast.textContent = message;
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('show');
            }, 100);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    if (document.body.contains(toast)) {
                        document.body.removeChild(toast);
                    }
                }, 400);
            }, 3000);
        }
    </script>
</body>
</html>
