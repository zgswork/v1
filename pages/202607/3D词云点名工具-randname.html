<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 词云点名工具</title>
    
    <!-- 1. 引入必要的 JS 库 (CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://www.goat1000.com/tagcanvas.min.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <!-- 2. 引入字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- 基础与背景样式 --- */
        :root {
            --glow-color: hsl(193, 100%, 50%);
            --glow-color-stop: hsl(293, 100%, 50%);
            --background-start: #1b2735;
            --background-end: #090a0f;
            --text-color: #f0f0f0;
            --panel-bg: rgba(20, 20, 30, 0.6);
            --panel-border: rgba(255, 255, 255, 0.1);
            --font-main: 'Poppins', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            color: var(--text-color);
            overflow: hidden;
            height: 100vh;
            background: radial-gradient(ellipse at bottom, var(--background-start) 0%, var(--background-end) 100%);
        }

        /* --- V5: 20倍星空效果 --- */
        @keyframes move-stars {
            from { transform: translateY(0px); }
            to { transform: translateY(-2000px); }
        }
        .stars, .stars2, .stars3 { position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; display: block; background: transparent; }
        
        .stars {
            background-image: 
                radial-gradient(1px 1px at 1% 92%, #eee, rgba(0,0,0,0)), radial-gradient(1px 1px at 5% 7%, #fff, rgba(0,0,0,0)), radial-gradient(1px 1px at 8% 49%, #ddd, rgba(0,0,0,0)), radial-gradient(1px 1px at 14% 3%, #fff, rgba(0,0,0,0)), radial-gradient(1px 1px at 18% 73%, #ddd, rgba(0,0,0,0)), radial-gradient(1px 1px at 22% 19%, #fff, rgba(0,0,0,0)), radial-gradient(1px 1px at 28% 88%, #ddd, rgba(0,0,0,0)), radial-gradient(1px 1px at 34% 31%, #eee, rgba(0,0,0,0)), radial-gradient(1px 1px at 39% 64%, #fff, rgba(0,0,0,0)), radial-gradient(1px 1px at 43% 12%, #ddd, rgba(0,0,0,0)), radial-gradient(1px 1px at 48% 95%, #fff, rgba(0,0,0,0)), radial-gradient(1px 1px at 53% 40%, #ddd, rgba(0,0,0,0)), radial-gradient(1px 1px at 59% 81%, #fff, rgba(0,0,0,0)), radial-gradient(1px 1px at 64% 25%, #ddd, rgba(0,0,0,0)), radial-gradient(1px 1px at 69% 70%, #eee, rgba(0,0,0,0)), radial-gradient(1px 1px at 73% 8%, #fff, rgba(0,0,0,0)), radial-gradient(1px 1px at 78% 52%, #ddd, rgba(0,0,0,0)), radial-gradient(1px 1px at 84% 37%, #fff, rgba(0,0,0,0)), radial-gradient(1px 1px at 89% 89%, #ddd, rgba(0,0,0,0)), radial-gradient(1px 1px at 94% 18%, #eee, rgba(0,0,0,0)), radial-gradient(1px 1px at 99% 60%, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 500px 500px;
            animation: move-stars 220s linear infinite;
        }
        .stars2 {
            background-image: 
                radial-gradient(2px 2px at 3% 85%, #fff, rgba(0,0,0,0)), radial-gradient(1px 1px at 9% 12%, #ddd, rgba(0,0,0,0)), radial-gradient(2px 2px at 16% 48%, #fff, rgba(0,0,0,0)), radial-gradient(1px 1px at 23% 78%, #ddd, rgba(0,0,0,0)), radial-gradient(2px 2px at 29% 22%, #eee, rgba(0,0,0,0)), radial-gradient(1px 1px at 36% 60%, #fff, rgba(0,0,0,0)), radial-gradient(2px 2px at 42% 4%, #ddd, rgba(0,0,0,0)), radial-gradient(1px 1px at 49% 94%, #eee, rgba(0,0,0,0)), radial-gradient(2px 2px at 55% 33%, #fff, rgba(0,0,0,0)), radial-gradient(1px 1px at 61% 71%, #ddd, rgba(0,0,0,0)), radial-gradient(2px 2px at 68% 15%, #fff, rgba(0,0,0,0)), radial-gradient(1px 1px at 74% 88%, #ddd, rgba(0,0,0,0)), radial-gradient(2px 2px at 80% 28%, #eee, rgba(0,0,0,0)), radial-gradient(1px 1px at 87% 65%, #fff, rgba(0,0,0,0)), radial-gradient(2px 2px at 93% 9%, #ddd, rgba(0,0,0,0)), radial-gradient(1px 1px at 98% 50%, #eee, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 400px 400px;
            animation: move-stars 160s linear infinite;
        }
        .stars3 {
            background-image: 
                radial-gradient(3px 3px at 4% 60%, #fff, rgba(0,0,0,0)), radial-gradient(2px 2px at 12% 80%, #ddd, rgba(0,0,0,0)), radial-gradient(3px 3px at 24% 15%, #fff, rgba(0,0,0,0)), radial-gradient(2px 2px at 33% 40%, #eee, rgba(0,0,0,0)), radial-gradient(3px 3px at 45% 70%, #fff, rgba(0,0,0,0)), radial-gradient(2px 2px at 57% 5%, #ddd, rgba(0,0,0,0)), radial-gradient(3px 3px at 66% 90%, #fff, rgba(0,0,0,0)), radial-gradient(2px 2px at 77% 30%, #eee, rgba(0,0,0,0)), radial-gradient(3px 3px at 88% 55%, #fff, rgba(0,0,0,0)), radial-gradient(2px 2px at 96% 85%, #ddd, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 300px 300px;
            animation: move-stars 100s linear infinite;
        }
        
        /* --- 整体布局 --- */
        .container { display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; height: 100%; padding: 20px; text-align: center; position: relative; z-index: 10; }

        /* --- 玻璃拟态面板 --- */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px) saturate(150%);
            -webkit-backdrop-filter: blur(12px) saturate(150%);
            border-radius: 20px;
            border: 1px solid var(--panel-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            padding: 40px;
        }

        /* --- 初始输入区域 --- */
        #input-section h1 { font-size: 2.5em; font-weight: 700; margin-bottom: 15px; text-shadow: 0 0 10px rgba(255, 255, 255, 0.3); }
        #input-section p { font-size: 1.1em; color: #ccc; margin-bottom: 30px; }
        #name-textarea { width: 100%; height: 150px; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--panel-border); border-radius: 10px; color: var(--text-color); padding: 15px; font-size: 1em; font-family: var(--font-main); resize: none; margin-bottom: 20px; transition: all 0.3s ease; }
        #name-textarea:focus { background: rgba(0, 0, 0, 0.2); border-color: var(--glow-color); box-shadow: 0 0 15px var(--glow-color); }
        #file-upload-wrapper { position: relative; display: inline-block; margin-top: 10px; }
        #file-input { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

        /* --- 主程序区域 --- */
        #app-section { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; align-items: center; }
        #tag-canvas-container { width: 100%; flex-grow: 1; display: flex; justify-content: center; align-items: center; }
        #tag-canvas { max-width: 100%; max-height: 100%; }
        
        /* 控制面板 */
        #controls-panel { width: 100%; padding: 15px 0; display: flex; justify-content: center; align-items: center; gap: 20px; position: relative; }
        #counter { position: absolute; left: 20px; font-size: 1.2em; font-weight: 600; color: #aaa; }
        
        /* 音乐控制按钮 */
        #music-toggle {
            position: absolute;
            right: 20px;
            background: transparent;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 24px;
            transition: all 0.3s ease;
        }
        #music-toggle:hover { color: #fff; transform: scale(1.1); }

        /* --- 按钮样式 (升级) --- */
        .btn { background: linear-gradient(45deg, #00aaff, #0077cc); color: white; padding: 14px 35px; border: none; border-radius: 50px; cursor: pointer; font-size: 1.2em; font-weight: 600; font-family: var(--font-main); transition: all 0.3s ease; position: relative; overflow: hidden; box-shadow: 0 5px 15px rgba(0, 170, 255, 0.3); }
        .btn:before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.4), transparent); transition: all 0.6s ease; }
        .btn:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0, 170, 255, 0.5); }
        .btn:hover:before { left: 100%; }
        .btn:active { transform: translateY(-2px); }
        #btn-stop { background: linear-gradient(45deg, #ff4757, #cc0011); box-shadow: 0 5px 15px rgba(255, 71, 87, 0.3); }
        #btn-stop:hover { box-shadow: 0 10px 25px rgba(255, 71, 87, 0.5); }
        #btn-reset { background: linear-gradient(45deg, #57606f, #2f3542); box-shadow: 0 5px 15px rgba(116, 125, 140, 0.3); }
        #btn-reset:hover { box-shadow: 0 10px 25px rgba(116, 125, 140, 0.5); }

        /* --- 结果弹窗 (升级) --- */
        #result-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; z-index: 1000; transition: opacity 0.3s ease; }
        #modal-overlay { position: absolute; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px); }
        #modal-content { position: relative; z-index: 1001; padding: 60px; text-align: center; background: var(--panel-bg); border-radius: 25px; border: 1px solid var(--panel-border); box-shadow: 0 0 50px var(--glow-color); transform: scale(0.5); transition: transform 0.5s cubic-bezier(0.18, 1.25, 0.4, 1.25); }
        #result-modal.visible #modal-content { transform: scale(1); }
        #winner-name { font-size: 5em; font-weight: 700; color: var(--glow-color); margin-bottom: 40px; text-shadow: 0 0 25px var(--glow-color), 0 0 40px var(--glow-color-stop); animation: pulse-text 2s infinite; }
        @keyframes pulse-text { 0% { text-shadow: 0 0 25px var(--glow-color), 0 0 40px var(--glow-color-stop); } 50% { text-shadow: 0 0 35px var(--glow-color), 0 0 50px var(--glow-color-stop); } 100% { text-shadow: 0 0 25px var(--glow-color), 0 0 40px var(--glow-color-stop); } }

        /* --- 彩带画布 --- */
        #confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }

        /* --- 工具类 --- */
        .hidden { display: none !important; }
        .visible { opacity: 1; pointer-events: auto; }
        .invisible { opacity: 0; pointer-events: none; }
        
        /* --- 加载动画 --- */
        .loader { width: 50px; height: 50px; border: 5px solid #fff; border-bottom-color: transparent; border-radius: 50%; display: inline-block; box-sizing: border-box; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>
    
    <canvas id="confetti-canvas"></canvas>
    <!-- FIX: Replaced broken audio link with a new, stable one -->
    <audio id="bg-music" loop src="https://cdn.pixabay.com/audio/2022/11/21/audio_a29a39899e.mp3"></audio>

    <div id="star-background">
        <div class="stars"></div>
        <div class="stars2"></div>
        <div class="stars3"></div>
    </div>

    <div class="container">
        <!-- 初始输入界面 -->
        <div id="input-section" class="glass-panel">
            <h1>3D 随机点名</h1>
            <p>粘贴名单或上传文件，开启你的随机之旅</p>
            <textarea id="name-textarea" placeholder="在此粘贴名单，每行一个..."></textarea>
            <div id="file-upload-wrapper">
                <button class="btn" id="btn-upload-dummy">上传文件</button>
                <input type="file" id="file-input" accept=".txt,.xlsx">
            </div>
            <button id="btn-load" class="btn" style="margin-left: 15px;">开始加载</button>
            <div id="loader-container" class="hidden" style="margin-top:20px;"><div class="loader"></div></div>
        </div>

        <!-- 主程序界面 -->
        <div id="app-section" class="hidden">
            <div id="tag-canvas-container">
                <canvas id="tag-canvas">
                    <p>您的浏览器不支持 HTML5 Canvas</p>
                </canvas>
            </div>
            <div id="controls-panel" class="glass-panel">
                <div id="counter">0 / 0</div>
                <button id="btn-start" class="btn">开始</button>
                <button id="btn-stop" class="btn">停止</button>
                <button id="btn-reset" class="btn">重置</button>
                <button id="music-toggle">🔊</button>
            </div>
        </div>
    </div>
    
    <!-- 结果弹窗 -->
    <div id="result-modal" class="invisible">
        <div id="modal-overlay"></div>
        <div id="modal-content">
            <h2 id="winner-name"></h2>
            <button id="btn-close-modal" class="btn">确定</button>
        </div>
    </div>

    <script>
        // --- 1. DOM Element Retrieval ---
        const inputSection = document.getElementById('input-section');
        const appSection = document.getElementById('app-section');
        const nameTextarea = document.getElementById('name-textarea');
        const fileInput = document.getElementById('file-input');
        const btnLoad = document.getElementById('btn-load');
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const btnReset = document.getElementById('btn-reset');
        const tagCanvas = document.getElementById('tag-canvas');
        const resultModal = document.getElementById('result-modal');
        const winnerName = document.getElementById('winner-name');
        const btnCloseModal = document.getElementById('btn-close-modal');
        const confettiCanvas = document.getElementById('confetti-canvas');
        const counter = document.getElementById('counter');
        const loaderContainer = document.getElementById('loader-container');
        const bgMusic = document.getElementById('bg-music');
        const musicToggle = document.getElementById('music-toggle');

        // --- 2. State Variables ---
        let allNames = [];
        let remainingNames = [];
        let selectedNames = [];
        let isSpinning = false;
        let canvasInitialized = false;
        let confettiInterval = null;
        let isMusicPlaying = false;
        let googleMandarinVoice = null;

        // --- 3. Core Functions ---
        function updateCounter() {
            counter.textContent = `${remainingNames.length} / ${allNames.length}`;
        }

        function initializeTagCanvas() {
            let listHtml = '<ul id="tag-list" style="display:none;">';
            allNames.forEach(name => {
                const color = selectedNames.includes(name) ? '#ff4757' : '#00aaff';
                listHtml += `<li><a href="#" style="color:${color}; font-weight: ${selectedNames.includes(name) ? '400' : '600'};">${name}</a></li>`;
            });
            listHtml += '</ul>';

            const existingList = document.getElementById('tag-list');
            if (existingList) existingList.remove();
            document.body.insertAdjacentHTML('beforeend', listHtml);

            const canvasContainer = document.getElementById('tag-canvas-container');
            tagCanvas.width = canvasContainer.clientWidth;
            tagCanvas.height = canvasContainer.clientHeight;
            
            const options = {
                textColour: null,
                outlineColour: '#0000',
                reverse: true,
                depth: 0.9,
                maxSpeed: 0.05,
                initial: [0, 0],
                weight: true,
                weightMode: 'size',
                dragControl: true,
                decel: 0.98,
                ease: 'ease-out',
                shadow: 'rgba(0,0,0,0.5)',
                shadowBlur: 10,
                textHeight: 20,
                textFont: '"Poppins", sans-serif',
            };
            
            try {
                if (!canvasInitialized) {
                    TagCanvas.Start('tag-canvas', 'tag-list', options);
                    canvasInitialized = true;
                } else {
                    TagCanvas.Update('tag-canvas');
                }
            } catch(e) {
                console.error("TagCanvas Error:", e);
                document.getElementById('tag-canvas-container').style.display = 'block';
            }
        }

        function parseFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                const fileExtension = file.name.split('.').pop().toLowerCase();

                if (fileExtension === 'txt') {
                    reader.onload = (e) => {
                        const names = e.target.result.split(/\r?\n/).map(n => n.trim()).filter(Boolean);
                        resolve(names);
                    };
                    reader.onerror = reject;
                    reader.readAsText(file, 'UTF-8');
                } else if (fileExtension === 'xlsx') {
                    reader.onload = (e) => {
                        try {
                            const data = new Uint8Array(e.target.result);
                            const workbook = XLSX.read(data, { type: 'array' });
                            const firstSheetName = workbook.SheetNames[0];
                            const worksheet = workbook.Sheets[firstSheetName];
                            const json = XLSX.utils.sheet_to_json(worksheet, { header: 1, range: 'A2:A9999' });
                            const names = json.map(row => row[0]?.toString().trim()).filter(Boolean);
                            resolve(names);
                        } catch (err) {
                            reject(err);
                        }
                    };
                    reader.onerror = reject;
                    reader.readAsArrayBuffer(file);
                } else {
                    reject(new Error('Unsupported file format! Please use .txt or .xlsx.'));
                }
            });
        }
        
        function startGame(names) {
            if (names.length === 0) {
                alert('名单为空，请检查您的输入。');
                loaderContainer.classList.add('hidden');
                return;
            }
            allNames = [...new Set(names)];
            remainingNames = [...allNames];
            selectedNames = [];

            inputSection.classList.add('hidden');
            appSection.classList.remove('hidden');
            
            initializeTagCanvas();
            updateCounter();

            bgMusic.play().then(() => {
                isMusicPlaying = true;
                musicToggle.textContent = '🔊';
            }).catch(error => {
                console.log("音乐自动播放失败，需要用户交互。", error);
                isMusicPlaying = false;
                musicToggle.textContent = '🔇';
            });

            setTimeout(() => {
                TagCanvas.SetSpeed('tag-canvas', [0.05, 0.02]);
            }, 100);
        }

        function fireConfetti() {
            if (confettiInterval) clearInterval(confettiInterval);

            const myConfetti = confetti.create(confettiCanvas, { resize: true, useWorker: true });
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 1000 };
            function randomInRange(min, max) { return Math.random() * (max - min) + min; }

            confettiInterval = setInterval(function() {
                const particleCount = 50;
                myConfetti({ ...defaults, particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } });
                myConfetti({ ...defaults, particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } });
            }, 300);
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 1.0;
                if (googleMandarinVoice) {
                    utterance.voice = googleMandarinVoice;
                }
                window.speechSynthesis.speak(utterance);
            } else {
                console.log('浏览器不支持语音播报功能。');
            }
        }

        function loadVoices() {
            const voices = speechSynthesis.getVoices();
            googleMandarinVoice = voices.find(voice => voice.name === 'Google 普通话' && voice.lang === 'zh-CN');
            if (!googleMandarinVoice) {
                googleMandarinVoice = voices.find(voice => voice.lang === 'zh-CN');
            }
        }

        // --- 4. Event Listeners and Handlers ---
        
        speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();

        btnLoad.addEventListener('click', async () => {
            let names = [];
            const file = fileInput.files[0];
            loaderContainer.classList.remove('hidden');

            if (nameTextarea.value.trim()) {
                names = nameTextarea.value.split(/\r?\n/).map(n => n.trim()).filter(Boolean);
            } else if (file) {
                try {
                    names = await parseFile(file);
                } catch (error) {
                    alert('文件读取失败: ' + error.message);
                    loaderContainer.classList.add('hidden');
                    return;
                }
            } else {
                alert('请粘贴名单或上传文件！');
                loaderContainer.classList.add('hidden');
                return;
            }
            
            setTimeout(() => startGame(names), 500);
        });

        btnStart.addEventListener('click', () => {
            if (!isSpinning) {
                if (remainingNames.length === 0) {
                    alert('所有人都已经点过啦！请重置。');
                    return;
                }
                TagCanvas.SetSpeed('tag-canvas', [0.6, 0.4]);
                isSpinning = true;
            }
        });

        btnStop.addEventListener('click', () => {
            if (isSpinning) {
                TagCanvas.SetSpeed('tag-canvas', [0, 0]);
                isSpinning = false;
                
                const winnerIndex = Math.floor(Math.random() * remainingNames.length);
                const winner = remainingNames[winnerIndex];

                selectedNames.push(winner);
                remainingNames.splice(winnerIndex, 1);
                
                fireConfetti();
                updateCounter();
                speak(winner);

                setTimeout(() => {
                    winnerName.textContent = winner;
                    resultModal.classList.remove('invisible');
                    resultModal.classList.add('visible');
                    
                    const tagIndex = allNames.indexOf(winner);
                    if (tagIndex > -1) {
                        TagCanvas.TagToFront('tag-canvas', { index: tagIndex + 1, time: 500 });
                    }
                }, 500);
            }
        });
        
        btnCloseModal.addEventListener('click', () => {
            resultModal.classList.remove('visible');
            resultModal.classList.add('invisible');
            
            if (confettiInterval) {
                clearInterval(confettiInterval);
                confettiInterval = null;
            }
            
            initializeTagCanvas();
            TagCanvas.SetSpeed('tag-canvas', [0.05, 0.02]);
        });
        
        btnReset.addEventListener('click', () => {
            allNames = [];
            remainingNames = [];
            selectedNames = [];
            isSpinning = false;

            if (confettiInterval) {
                clearInterval(confettiInterval);
                confettiInterval = null;
            }

            bgMusic.pause();
            bgMusic.currentTime = 0;
            isMusicPlaying = false;
            musicToggle.textContent = '🔇';
            
            appSection.classList.add('hidden');
            inputSection.classList.remove('hidden');
            loaderContainer.classList.add('hidden');
            nameTextarea.value = '';
            fileInput.value = '';

            if (canvasInitialized) {
                TagCanvas.Delete('tag-canvas');
                const existingList = document.getElementById('tag-list');
                if (existingList) existingList.remove();
                canvasInitialized = false;
            }

            if (resultModal.classList.contains('visible')) {
                resultModal.classList.remove('visible');
                resultModal.classList.add('invisible');
            }
        });

        musicToggle.addEventListener('click', () => {
            if (isMusicPlaying) {
                bgMusic.pause();
                musicToggle.textContent = '🔇';
            } else {
                bgMusic.play();
                musicToggle.textContent = '🔊';
            }
            isMusicPlaying = !isMusicPlaying;
        });

        window.addEventListener('resize', () => {
            if (canvasInitialized) {
                initializeTagCanvas();
                if (!isSpinning) {
                    TagCanvas.SetSpeed('tag-canvas', [0.05, 0.02]);
                }
            }
        });

    </script>
</body>
</html>
