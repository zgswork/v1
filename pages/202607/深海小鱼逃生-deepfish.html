<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深海小鱼逃生</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #001122 0%, #003366 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 20px;
        }
        
        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            box-shadow: 0 0 30px rgba(0, 200, 255, 0.5);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #game-canvas {
            background: linear-gradient(to bottom, #006, #001 80%);
            display: block;
        }
        
        #ui-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            background: rgba(0, 20, 40, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(0, 200, 255, 0.5);
            min-width: 150px;
        }
        
        #score, #lives, #time {
            font-size: 16px;
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px black;
            font-weight: bold;
        }
        
        #start-screen, #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 15, 30, 0.85);
            z-index: 20;
            text-align: center;
            padding: 25px 20px;
            overflow: hidden;
        }
        
        #game-over {
            display: none;
        }
        
        .game-title {
            color: #0ff;
            text-shadow: 0 0 15px #0ff;
            font-size: 36px;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }
        
        .game-subtitle {
            color: #8ff;
            font-size: 18px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #0ff;
            padding: 0 10px;
            line-height: 1.2;
        }
        
        .instructions {
            background: rgba(0, 40, 80, 0.6);
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            width: 90%;
            max-width: 650px;
            border: 1px solid rgba(0, 200, 255, 0.4);
            box-shadow: 0 0 15px rgba(0, 200, 255, 0.3);
        }
        
        .rules-section {
            margin: 12px 0;
            padding: 12px;
            background: rgba(0, 30, 60, 0.5);
            border-radius: 8px;
        }
        
        .rules-section h3 {
            color: #0ff;
            margin-bottom: 8px;
            font-size: 18px;
        }
        
        .rules-section ul {
            text-align: left;
            margin-left: 20px;
        }
        
        .rules-section li {
            margin-bottom: 6px;
            line-height: 1.3;
            font-size: 15px;
        }
        
        .highlight {
            color: #ffaa00;
            font-weight: bold;
        }
        
        button {
            background: linear-gradient(to bottom, #0cf, #08a);
            color: #003;
            border: none;
            padding: 12px 28px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s;
            box-shadow: 0 0 15px #0cf, 0 5px 10px rgba(0, 0, 0, 0.3);
            letter-spacing: 1px;
        }
        
        button:hover {
            background: linear-gradient(to bottom, #0ff, #0ac);
            transform: scale(1.05);
            box-shadow: 0 0 20px #0ff, 0 5px 15px rgba(0, 0, 0, 0.4);
        }
        
        /* 财富自由文字样式 */
        .wealth-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            font-weight: bold;
            color: gold;
            text-shadow: 
                0 0 10px gold,
                0 0 20px orange,
                0 0 30px red;
            z-index: 30;
            opacity: 0;
            pointer-events: none;
            animation: wealthAnimation 2.5s ease-out;
        }
        
        @keyframes wealthAnimation {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
                text-shadow: 0 0 0px gold;
            }
            20% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.2);
                text-shadow: 
                    0 0 20px gold,
                    0 0 40px orange,
                    0 0 60px red;
            }
            40% {
                transform: translate(-50%, -50%) scale(1);
                text-shadow: 
                    0 0 30px gold,
                    0 0 60px orange,
                    0 0 90px red;
            }
            70% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.1);
                text-shadow: 
                    0 0 40px gold,
                    0 0 80px orange,
                    0 0 120px red;
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.5);
                text-shadow: 
                    0 0 60px gold,
                    0 0 120px orange,
                    0 0 180px red;
            }
        }
        
        .bonus-text {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #0ff;
            text-shadow: 0 0 5px #0ff;
            z-index: 25;
            opacity: 0;
            pointer-events: none;
            animation: bonusAnimation 1.5s ease-out;
        }
        
        @keyframes bonusAnimation {
            0% {
                opacity: 0;
                transform: translateY(0);
            }
            20% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(-50px);
            }
        }
        
        .footer {
            margin-top: 12px;
            font-size: 14px;
            color: #8ff;
            opacity: 0.8;
            padding: 0 10px;
            line-height: 1.2;
        }
        
        hr {
            border: none;
            height: 1px;
            background: linear-gradient(to right, transparent, #0ff, transparent);
            margin: 12px 0;
            width: 80%;
        }
        
        .content-wrapper {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="800" height="600"></canvas>
        
        <div id="ui-overlay">
            <div id="score">分数: 0</div>
            <div id="lives">生命: 3</div>
            <div id="time">时间: 0秒</div>
        </div>
        
        <div id="start-screen">
            <div class="content-wrapper">
                <h1 class="game-title">深海小鱼逃生</h1>
                
                <div class="game-subtitle">躲避大鱼，生存越久得分越高！</div>
                
                <hr>
                
                <div class="instructions">
                    <div class="rules-section">
                        <h3>游戏规则</h3>
                        <ul>
                            <li>使用鼠标控制小鱼的移动</li>
                            <li>躲避大鱼攻击，被碰到会失去生命</li>
                        </ul>
                    </div>
                    
                    <div class="rules-section">
                        <h3>得分方式</h3>
                        <ul>
                            <li>大鱼离开屏幕：<span class="highlight">+5分</span></li>
                            <li>存活时间奖励：<span class="highlight">每秒+2分</span></li>
                            <li>连续躲避大鱼可获得额外分数加成</li>
                            <li>达到1000分后进入<span class="highlight">"财富自由"</span>模式！</li>
                        </ul>
                    </div>
                </div>
                
                <button id="start-button">开始游戏</button>
                
                <div class="footer">移动鼠标控制小鱼 | 生存越久分数越高</div>
            </div>
        </div>
        
        <div id="game-over">
            <h1 class="game-title">游戏结束</h1>
            <div id="final-score" style="font-size: 24px; margin-bottom: 30px;">最终分数: 0</div>
            <button id="restart-button">再玩一次</button>
        </div>
    </div>

    <script>
        // 游戏变量
        let canvas, ctx;
        let gameActive = false;
        let score = 0;
        let lives = 3;
        let player;
        let enemies = [];
        let bubbles = [];
        let particles = [];
        let lastTime = 0;
        let enemySpawnRate = 1200; // 初始敌人生成间隔(毫秒)
        let lastEnemySpawn = 0;
        let difficultyTimer = 0;
        let wealthFreeMode = false; // 财富自由模式标志
        let wealthFreeActivated = false; // 记录是否已经激活财富自由模式
        
        // 新增加的变量
        let gameTime = 0; // 游戏时间（秒）
        let comboCounter = 0; // 连击计数器
        let lastComboTime = 0; // 上次获得连击的时间
        let comboMultiplier = 1; // 连击倍率
        let comboTimeout = 3000; // 连击超时时间（毫秒）
        let maxEnemies = 15; // 屏幕上最多同时存在的大鱼数量
        let lastTimeBonus = 0; // 上次获得时间奖励的时间
        let gameStartTime = 0; // 游戏开始时间

        // 初始化游戏
        function init() {
            canvas = document.getElementById('game-canvas');
            ctx = canvas.getContext('2d');
            
            // 设置玩家初始位置
            player = {
                x: canvas.width / 2,
                y: canvas.height / 2,
                radius: 15,
                color: '#FFAA00',
                speed: 0.2,
                tail: []
            };
            
            // 设置事件监听器
            document.getElementById('start-button').addEventListener('click', startGame);
            document.getElementById('restart-button').addEventListener('click', restartGame);
            
            canvas.addEventListener('mousemove', movePlayer);
        }

        // 开始游戏
        function startGame() {
            gameActive = true;
            score = 0;
            lives = 3;
            gameTime = 0;
            comboCounter = 0;
            comboMultiplier = 1;
            enemies = [];
            bubbles = [];
            particles = [];
            enemySpawnRate = 1200;
            lastEnemySpawn = 0;
            difficultyTimer = 0;
            wealthFreeMode = false;
            wealthFreeActivated = false;
            lastTimeBonus = 0;
            gameStartTime = performance.now(); // 记录游戏开始时间
            
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-over').style.display = 'none';
            updateUI();
            
            // 启动游戏循环
            requestAnimationFrame(gameLoop);
        }

        // 重新开始游戏
        function restartGame() {
            startGame();
        }

        // 游戏结束
        function gameOver() {
            gameActive = false;
            document.getElementById('final-score').textContent = `最终分数: ${score}`;
            document.getElementById('game-over').style.display = 'flex';
        }

        // 更新UI
        function updateUI() {
            document.getElementById('score').textContent = `分数: ${score}`;
            document.getElementById('lives').textContent = `生命: ${lives}`;
            document.getElementById('time').textContent = `时间: ${Math.floor(gameTime)}秒`;
        }

        // 显示奖励文字
        function showBonusText(text, x, y, color = '#0ff') {
            const bonusText = document.createElement('div');
            bonusText.className = 'bonus-text';
            bonusText.textContent = text;
            bonusText.style.color = color;
            bonusText.style.left = `${x}px`;
            bonusText.style.top = `${y}px`;
            document.getElementById('game-container').appendChild(bonusText);
            
            // 动画结束后移除元素
            setTimeout(() => {
                if (bonusText.parentNode) {
                    bonusText.parentNode.removeChild(bonusText);
                }
            }, 1500);
        }

        // 移动玩家
        function movePlayer(e) {
            if (!gameActive) return;
            
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            // 平滑移动玩家
            player.x += (mouseX - player.x) * player.speed;
            player.y += (mouseY - player.y) * player.speed;
            
            // 记录尾部位置
            player.tail.unshift({x: player.x, y: player.y});
            if (player.tail.length > 10) {
                player.tail.pop();
            }
        }

        // 生成敌人
        function spawnEnemy(timestamp) {
            // 检查是否达到最大敌人数量
            if (enemies.length >= maxEnemies) return;
            
            if (timestamp - lastEnemySpawn > enemySpawnRate) {
                const side = Math.floor(Math.random() * 4); // 0:上, 1:右, 2:下, 3:左
                let x, y;
                
                switch(side) {
                    case 0: // 上
                        x = Math.random() * canvas.width;
                        y = -30;
                        break;
                    case 1: // 右
                        x = canvas.width + 30;
                        y = Math.random() * canvas.height;
                        break;
                    case 2: // 下
                        x = Math.random() * canvas.width;
                        y = canvas.height + 30;
                        break;
                    case 3: // 左
                        x = -30;
                        y = Math.random() * canvas.height;
                        break;
                }
                
                const size = 20 + Math.random() * 20;
                // 增加大鱼的基础速度和随分数增长的速度
                const speed = 1.8 + Math.random() * 2.2 + score/1800;
                
                enemies.push({
                    x: x,
                    y: y,
                    radius: size,
                    color: `hsl(${Math.random() * 60}, 100%, 50%)`,
                    speed: speed,
                    angle: Math.atan2(player.y - y, player.x - x)
                });
                
                lastEnemySpawn = timestamp;
            }
        }

        // 生成气泡
        function spawnBubble() {
            if (Math.random() < 0.05) {
                bubbles.push({
                    x: Math.random() * canvas.width,
                    y: canvas.height + 10,
                    radius: 2 + Math.random() * 8,
                    speed: 1 + Math.random() * 3
                });
            }
        }

        // 显示财富自由文字
        function showWealthText() {
            const wealthText = document.createElement('div');
            wealthText.className = 'wealth-text';
            wealthText.textContent = '财富自由';
            document.getElementById('game-container').appendChild(wealthText);
            
            // 动画结束后移除元素
            setTimeout(() => {
                if (wealthText.parentNode) {
                    wealthText.parentNode.removeChild(wealthText);
                }
            }, 2500);
        }

        // 更新连击系统
        function updateComboSystem(timestamp) {
            // 检查连击是否超时
            if (timestamp - lastComboTime > comboTimeout) {
                if (comboCounter > 0) {
                    comboCounter = 0;
                    comboMultiplier = 1;
                }
                return;
            }
            
            // 更新连击倍率
            const newMultiplier = Math.min(5, 1 + Math.floor(comboCounter / 10));
            if (newMultiplier !== comboMultiplier) {
                comboMultiplier = newMultiplier;
                showBonusText(`连击加成!`, canvas.width/2, canvas.height/2, '#FFD700');
            }
        }

        // 增加分数
        function addScore(points, source, x, y) {
            if (wealthFreeMode) return;
            
            const bonusPoints = Math.floor(points * comboMultiplier);
            score += bonusPoints;
            
            // 显示得分文字
            if (source) {
                showBonusText(`+${bonusPoints}`, x || player.x, y || player.y, '#0ff');
            }
            
            updateUI();
        }

        // 更新游戏状态
        function update(timestamp, deltaTime) {
            if (!gameActive) return;
            
            // 更新游戏时间 - 从游戏开始时间计算
            gameTime = (timestamp - gameStartTime) / 1000;
            
            // 检查是否达到财富自由模式
            if (score >= 1000 && !wealthFreeActivated) {
                wealthFreeMode = true;
                wealthFreeActivated = true;
                showWealthText();
                
                // 添加金色粒子效果
                createParticles(canvas.width/2, canvas.height/2, 100, 'gold');
                createParticles(canvas.width/2, canvas.height/2, 100, 'orange');
                createParticles(canvas.width/2, canvas.height/2, 100, 'yellow');
            }
            
            // 增加难度（财富自由模式下停止增加难度）
            if (!wealthFreeMode) {
                difficultyTimer += deltaTime;
                if (difficultyTimer > 8000) { // 每8秒增加一次难度
                    difficultyTimer = 0;
                    enemySpawnRate = Math.max(500, enemySpawnRate - 40); // 降低难度增加速度
                    maxEnemies = Math.min(25, maxEnemies + 1); // 缓慢增加最大敌人数
                }
            }
            
            // 更新连击系统
            updateComboSystem(timestamp);
            
            // 生成敌人
            spawnEnemy(timestamp);
            
            // 生成气泡
            spawnBubble();
            
            // 更新敌人位置
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                
                // 稍微调整角度朝向玩家
                const targetAngle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
                enemy.angle += (targetAngle - enemy.angle) * 0.02;
                
                // 移动敌人
                enemy.x += Math.cos(enemy.angle) * enemy.speed;
                enemy.y += Math.sin(enemy.angle) * enemy.speed;
                
                // 检测碰撞
                const dx = player.x - enemy.x;
                const dy = player.y - enemy.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < player.radius + enemy.radius) {
                    // 碰撞发生
                    createParticles(player.x, player.y, 10, '#FFAA00');
                    
                    // 财富自由模式下不减少生命值，而是显示财富自由文字
                    if (wealthFreeMode) {
                        showWealthText();
                        // 添加金色粒子效果
                        createParticles(player.x, player.y, 20, 'gold');
                        createParticles(player.x, player.y, 20, 'orange');
                    } else {
                        lives--;
                        comboCounter = 0;
                        comboMultiplier = 1;
                        updateUI();
                        
                        if (lives <= 0) {
                            gameOver();
                            return;
                        }
                    }
                    
                    // 移除敌人
                    enemies.splice(i, 1);
                }
                
                // 移除超出屏幕的敌人
                if (enemy.x < -100 || enemy.x > canvas.width + 100 || 
                    enemy.y < -100 || enemy.y > canvas.height + 100) {
                    enemies.splice(i, 1);
                    
                    // 财富自由模式下不再增加分数
                    if (!wealthFreeMode) {
                        addScore(5, "enemy_escape", enemy.x, enemy.y);
                        comboCounter++;
                        lastComboTime = timestamp;
                    }
                }
            }
            
            // 更新气泡位置
            for (let i = bubbles.length - 1; i >= 0; i--) {
                bubbles[i].y -= bubbles[i].speed;
                
                // 移除超出屏幕的气泡
                if (bubbles[i].y < -10) {
                    bubbles.splice(i, 1);
                }
            }
            
            // 更新粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].x += particles[i].vx;
                particles[i].y += particles[i].vy;
                particles[i].alpha -= 0.02;
                
                // 移除消失的粒子
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
            
            // 时间奖励 - 每2秒获得一次基础时间奖励
            if (timestamp - lastTimeBonus > 2000) {
                addScore(4, "time_bonus");
                lastTimeBonus = timestamp;
            }
            
            // 更新UI中的时间显示
            updateUI();
        }

        // 创建粒子效果
        function createParticles(x, y, count, color) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3;
                
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: 1 + Math.random() * 3,
                    color: color,
                    alpha: 1
                });
            }
        }

        // 渲染游戏
        function render() {
            // 清除画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制深海背景渐变
            const gradient = ctx.createRadialGradient(
                canvas.width / 2, canvas.height / 2, 0,
                canvas.width / 2, canvas.height / 2, canvas.width
            );
            gradient.addColorStop(0, 'rgba(0, 20, 50, 0.5)');
            gradient.addColorStop(1, 'rgba(0, 0, 20, 0.8)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制气泡
            for (const bubble of bubbles) {
                ctx.beginPath();
                ctx.arc(bubble.x, bubble.y, bubble.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(173, 216, 230, 0.5)';
                ctx.fill();
                ctx.strokeStyle = 'rgba(173, 216, 230, 0.8)';
                ctx.stroke();
            }
            
            // 绘制粒子
            for (const particle of particles) {
                ctx.globalAlpha = particle.alpha;
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
                ctx.fillStyle = particle.color;
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            
            // 绘制敌人
            for (const enemy of enemies) {
                // 绘制鱼身
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
                ctx.fillStyle = enemy.color;
                ctx.fill();
                
                // 绘制鱼尾
                ctx.beginPath();
                ctx.moveTo(enemy.x, enemy.y);
                ctx.lineTo(
                    enemy.x - Math.cos(enemy.angle) * enemy.radius * 1.5,
                    enemy.y - Math.sin(enemy.angle) * enemy.radius * 1.5
                );
                ctx.lineWidth = 3;
                ctx.strokeStyle = enemy.color;
                ctx.stroke();
                
                // 绘制鱼眼
                ctx.beginPath();
                ctx.arc(
                    enemy.x + Math.cos(enemy.angle) * enemy.radius * 0.6,
                    enemy.y + Math.sin(enemy.angle) * enemy.radius * 0.6,
                    enemy.radius * 0.3, 0, Math.PI * 2
                );
                ctx.fillStyle = 'white';
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(
                    enemy.x + Math.cos(enemy.angle) * enemy.radius * 0.7,
                    enemy.y + Math.sin(enemy.angle) * enemy.radius * 0.7,
                    enemy.radius * 0.15, 0, Math.PI * 2
                );
                ctx.fillStyle = 'black';
                ctx.fill();
            }
            
            // 绘制玩家小鱼
            if (gameActive) {
                // 绘制尾部
                for (let i = 0; i < player.tail.length; i++) {
                    const point = player.tail[i];
                    const alpha = 1 - (i / player.tail.length);
                    const size = player.radius * (1 - i / player.tail.length * 0.5);
                    
                    ctx.beginPath();
                    ctx.arc(point.x, point.y, size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 170, 0, ${alpha * 0.5})`;
                    ctx.fill();
                }
                
                // 绘制鱼身
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
                ctx.fillStyle = player.color;
                ctx.fill();
                
                // 绘制鱼眼
                ctx.beginPath();
                ctx.arc(player.x + player.radius * 0.5, player.y - player.radius * 0.3, player.radius * 0.4, 0, Math.PI * 2);
                ctx.fillStyle = 'white';
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(player.x + player.radius * 0.6, player.y - player.radius * 0.3, player.radius * 0.2, 0, Math.PI * 2);
                ctx.fillStyle = 'black';
                ctx.fill();
                
                // 绘制鱼尾
                ctx.beginPath();
                ctx.moveTo(player.x - player.radius, player.y);
                ctx.lineTo(player.x - player.radius * 1.8, player.y - player.radius);
                ctx.lineTo(player.x - player.radius * 1.8, player.y + player.radius);
                ctx.closePath();
                ctx.fillStyle = player.color;
                ctx.fill();
            }
        }

        // 游戏循环
        function gameLoop(timestamp) {
            const deltaTime = lastTime ? timestamp - lastTime : 0;
            lastTime = timestamp;
            
            update(timestamp, deltaTime);
            render();
            
            if (gameActive) {
                requestAnimationFrame(gameLoop);
            }
        }

        // 初始化游戏
        window.onload = init;
    </script>
</body>
</html>
