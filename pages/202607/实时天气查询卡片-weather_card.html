<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时天气查询卡片</title>
    <style>
        :root {
            /* 明亮主题 */
            --bg-primary: #e6f3ff;
            --bg-secondary: #ffffff;
            --text-primary: #2c3e50;
            --text-secondary: #7f8c8d;
            --accent-color: #3498db;
            --shadow-light: rgba(255, 255, 255, 0.8);
            --shadow-dark: rgba(0, 0, 0, 0.1);
            --gradient-start: #74b9ff;
            --gradient-end: #0984e3;
        }

        [data-theme="dark"] {
            /* 暗黑主题 */
            --bg-primary: #1a1a1a;
            --bg-secondary: #2c2c2c;
            --text-primary: #ecf0f1;
            --text-secondary: #bdc3c7;
            --accent-color: #e74c3c;
            --shadow-light: rgba(255, 255, 255, 0.05);
            --shadow-dark: rgba(0, 0, 0, 0.4);
            --gradient-start: #e74c3c;
            --gradient-end: #c0392b;
        }

        [data-theme="natural"] {
            /* 自然主题 */
            --bg-primary: #f0f5f0;
            --bg-secondary: #ffffff;
            --text-primary: #27ae60;
            --text-secondary: #2c3e50;
            --accent-color: #27ae60;
            --shadow-light: rgba(255, 255, 255, 0.9);
            --shadow-dark: rgba(0, 0, 0, 0.08);
            --gradient-start: #27ae60;
            --gradient-end: #2ecc71;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .weather-container {
            background: var(--bg-secondary);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 
                20px 20px 40px var(--shadow-dark),
                -20px -20px 40px var(--shadow-light);
            max-width: 420px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.8s ease-in-out;
            transition: all 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .search-box {
            margin-bottom: 30px;
        }

        .search-input, .city-select {
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            outline: none;
            background: var(--bg-secondary);
            color: var(--text-primary);
            box-shadow: 
                inset 8px 8px 16px var(--shadow-dark),
                inset -8px -8px 16px var(--shadow-light);
            transition: all 0.3s ease;
        }

        .search-input:focus, .city-select:focus {
            box-shadow: 
                inset 12px 12px 24px var(--shadow-dark),
                inset -12px -12px 24px var(--shadow-light);
        }

        .search-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
            box-shadow: 
                8px 8px 16px var(--shadow-dark),
                -8px -8px 16px var(--shadow-light);
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 
                12px 12px 24px var(--shadow-dark),
                -12px -12px 24px var(--shadow-light);
        }

        .search-btn:active {
            transform: translateY(0);
            box-shadow: 
                inset 6px 6px 12px var(--shadow-dark),
                inset -6px -6px 12px var(--shadow-light);
        }

        .weather-card {
            margin-top: 30px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .weather-card.show {
            opacity: 1;
            transform: translateY(0);
        }

        .city-name {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .weather-icon {
            font-size: 80px;
            margin: 20px 0;
            padding: 20px;
            border-radius: 50%;
            background: var(--bg-secondary);
            box-shadow: 
                10px 10px 20px var(--shadow-dark),
                -10px -10px 20px var(--shadow-light);
            display: inline-block;
        }

        .temperature {
            font-size: 48px;
            font-weight: bold;
            color: var(--text-primary);
            margin: 20px 0;
        }

        .weather-description {
            font-size: 18px;
            color: var(--text-secondary);
            margin-bottom: 25px;
        }

        .weather-details {
            display: flex;
            justify-content: space-between;
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 25px;
            margin-top: 20px;
            box-shadow: 
                inset 8px 8px 16px var(--shadow-dark),
                inset -8px -8px 16px var(--shadow-light);
        }

        .detail-item {
            text-align: center;
            flex: 1;
            padding: 10px;
            border-radius: 15px;
            margin: 0 5px;
            background: var(--bg-secondary);
            box-shadow: 
                6px 6px 12px var(--shadow-dark),
                -6px -6px 12px var(--shadow-light);
        }

        .detail-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .detail-value {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-primary);
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: var(--accent-color);
        }

        .loading.show {
            display: block;
        }

        .error {
            color: var(--accent-color);
            padding: 20px;
            display: none;
            background: var(--bg-secondary);
            border-radius: 15px;
            margin-top: 20px;
            box-shadow: 
                inset 6px 6px 12px var(--shadow-dark),
                inset -6px -6px 12px var(--shadow-light);
        }

        .error.show {
            display: block;
        }

        .spinner {
            border: 3px solid var(--shadow-light);
            border-top: 3px solid var(--accent-color);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .current-time {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 20px;
        }

        .api-info {
            background: var(--bg-secondary);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            font-size: 14px;
            color: var(--text-secondary);
            box-shadow: 
                inset 6px 6px 12px var(--shadow-dark),
                inset -6px -6px 12px var(--shadow-light);
        }

        .api-info strong {
            color: var(--text-primary);
        }

        /* 穿衣小提示 */
        .clothing-tip {
            background: var(--bg-secondary);
            border-radius: 15px;
            padding: 15px 20px;
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 
                inset 6px 6px 12px var(--shadow-dark),
                inset -6px -6px 12px var(--shadow-light);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.5s ease;
        }

        .clothing-tip.show {
            opacity: 1;
            transform: translateY(0);
        }

        .clothing-tip-icon {
            font-size: 20px;
            padding: 8px;
            border-radius: 50%;
            background: var(--bg-secondary);
            box-shadow: 
                4px 4px 8px var(--shadow-dark),
                -4px -4px 8px var(--shadow-light);
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 36px;
            height: 36px;
        }

        .clothing-tip-text {
            flex: 1;
            text-align: left;
        }

        .clothing-tip-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .clothing-tip-suggestion {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* 主题切换器 */
        .theme-selector {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .theme-button {
            padding: 12px 20px;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--bg-secondary);
            color: var(--text-primary);
            box-shadow: 
                6px 6px 12px var(--shadow-dark),
                -6px -6px 12px var(--shadow-light);
        }

        .theme-button:hover {
            transform: translateY(-2px);
            box-shadow: 
                8px 8px 16px var(--shadow-dark),
                -8px -8px 16px var(--shadow-light);
        }

        .theme-button:active,
        .theme-button.active {
            transform: translateY(0);
            box-shadow: 
                inset 4px 4px 8px var(--shadow-dark),
                inset -4px -4px 8px var(--shadow-light);
        }

        .theme-button.light {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            color: white;
        }

        .theme-button.dark {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
        }

        .theme-button.natural {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
        }

        @media (max-width: 480px) {
            .weather-container {
                padding: 25px;
                margin: 10px;
            }
            
            .temperature {
                font-size: 36px;
            }
            
            .weather-icon {
                font-size: 60px;
                padding: 15px;
            }

            .weather-details {
                flex-direction: column;
                gap: 15px;
            }

            .detail-item {
                margin: 0;
            }

            .clothing-tip {
                padding: 12px 15px;
            }

            .clothing-tip-icon {
                font-size: 18px;
                min-width: 32px;
                height: 32px;
            }

            .theme-selector {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body data-theme="light">

                    <option value="呼和浩特">呼和浩特（内蒙古）</option>

                    <option value="青岛">青岛</option>
                    <option value="宁波">宁波</option>
                    <option value="无锡">无锡</option>
                    <option value="温州">温州</option>
                    <option value="厦门">厦门</option>
                    <option value="珠海">珠海</option>
                    <option value="中山">中山</option>
                    <option value="深圳">深圳</option>
                </optgroup>
                <optgroup label="国际城市">
                    <option value="Tokyo">东京</option>
                    <option value="London">伦敦</option>
                    <option value="New York">纽约</option>

                </optgroup>
            </select>
            <input type="text" class="search-input" id="customCity" placeholder="或输入其他城市名称" style="margin-top: 15px;">
            <button class="search-btn" onclick="searchWeather()">🔍 查询天气</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>正在获取天气信息...</div>
        </div>

        <div class="error" id="error">
            <div>获取天气信息失败，请检查城市名称是否正确</div>
        </div>

        <div class="weather-card" id="weatherCard">
            <div class="city-name" id="cityName"></div>
            <div class="weather-icon" id="weatherIcon"></div>
            <div class="temperature" id="temperature"></div>
            <div class="weather-description" id="weatherDescription"></div>
            
            <div class="weather-details">
                <div class="detail-item">
                    <div class="detail-label">体感温度</div>
                    <div class="detail-value" id="feelsLike"></div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">湿度</div>
                    <div class="detail-value" id="humidity"></div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">风速</div>
                    <div class="detail-value" id="windSpeed"></div>
                </div>
            </div>

            <!-- 穿衣小提示 -->
            <div class="clothing-tip" id="clothingTip">
                <div class="clothing-tip-icon" id="clothingIcon">👕</div>
                <div class="clothing-tip-text">
                    <div class="clothing-tip-title">穿衣建议</div>
                    <div class="clothing-tip-suggestion" id="clothingSuggestion"></div>
                </div>
            </div>
            
            <div class="current-time" id="currentTime"></div>
        </div>
    </div>

    <!-- 主题切换器 -->
    <div class="theme-selector">
        <button class="theme-button light active" onclick="setTheme('light')">🌞 明亮</button>
        <button class="theme-button dark" onclick="setTheme('dark')">🌙 暗黑</button>
        <button class="theme-button natural" onclick="setTheme('natural')">🌿 自然</button>
    </div>

    <script>
        // 天气状况图标映射
        const weatherIcons = {
            'clear': '☀️',
            'sunny': '☀️',
            'partly-cloudy': '⛅',
            'cloudy': '☁️',
            'overcast': '☁️',
            'mist': '🌫️',
            'fog': '🌫️',
            'light-rain': '🌦️',
            'heavy-rain': '🌧️',
            'light-snow': '❄️',
            'heavy-snow': '❄️',
            'thunderstorm': '⛈️',
            'light-drizzle': '🌦️',
            'heavy-drizzle': '🌧️',
            'light-sleet': '🌨️',
            'heavy-sleet': '🌨️',
            'light-showers': '🌦️',
            'heavy-showers': '🌧️',
            'light-snow-showers': '🌨️',
            'heavy-snow-showers': '🌨️',
            'unknown': '🌤️'
        };

        // 天气状况中文翻译
        const weatherTranslations = {
            'Clear': '晴天',
            'Sunny': '晴天',
            'Partly cloudy': '多云',
            'Cloudy': '阴天',
            'Overcast': '阴天',
            'Mist': '薄雾',
            'Fog': '雾',
            'Light rain': '小雨',
            'Heavy rain': '大雨',
            'Light snow': '小雪',
            'Heavy snow': '大雪',
            'Thunderstorm': '雷暴',
            'Light drizzle': '小雨',
            'Heavy drizzle': '中雨',
            'Light sleet': '小雨夹雪',
            'Heavy sleet': '大雨夹雪',
            'Light showers': '阵雨',
            'Heavy showers': '大雨',
            'Light snow showers': '阵雪',
            'Heavy snow showers': '大雪',
            'Patchy rain possible': '可能有雨',
            'Patchy snow possible': '可能有雪',
            'Patchy sleet possible': '可能有雨夹雪',
            'Patchy freezing drizzle possible': '可能有冻雨',
            'Blowing snow': '风雪',
            'Blizzard': '暴风雪',
            'Unknown': '未知'
        };

        // 简化的穿衣建议
        function getClothingTip(temperature, weatherDesc) {
            let icon = '👕';
            let suggestion = '';
            
            // 根据温度范围给出建议
            if (temperature >= 30) {
                icon = '🩱';
                suggestion = '炎热天气，建议穿短袖、短裤，注意防晒';
            } else if (temperature >= 25) {
                icon = '👕';
                suggestion = '温暖舒适，适合短袖或薄长袖';
            } else if (temperature >= 20) {
                icon = '👔';
                suggestion = '温度适中，建议穿长袖衬衫或薄外套';
            } else if (temperature >= 15) {
                icon = '🧥';
                suggestion = '稍凉，建议穿外套或薄毛衣';
            } else if (temperature >= 10) {
                icon = '🧥';
                suggestion = '凉爽天气，建议穿厚外套或卫衣';
            } else if (temperature >= 0) {
                icon = '🧥';
                suggestion = '寒冷，建议穿羽绒服或厚外套';
            } else {
                icon = '🧥';
                suggestion = '严寒天气，建议多层保暖，羽绒服必备';
            }
            
            // 根据天气状况调整建议
            if (weatherDesc.includes('rain') || weatherDesc.includes('雨')) {
                suggestion += '，记得带雨伞';
                if (icon === '🩱' || icon === '👕') {
                    icon = '☔';
                }
            } else if (weatherDesc.includes('snow') || weatherDesc.includes('雪')) {
                suggestion += '，注意防滑保暖';
                icon = '❄️';
            } else if (weatherDesc.includes('wind') || weatherDesc.includes('风')) {
                suggestion += '，注意防风';
            }
            
            return { icon, suggestion };
        }

        // 显示穿衣小提示
        function displayClothingTip(temperature, weatherDesc) {
            const tip = getClothingTip(temperature, weatherDesc);
            
            document.getElementById('clothingIcon').textContent = tip.icon;
            document.getElementById('clothingSuggestion').textContent = tip.suggestion;
            
            setTimeout(() => {
                document.getElementById('clothingTip').classList.add('show');
            }, 300);
        }

        // 主题切换
        function setTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            
            // 更新按钮状态
            document.querySelectorAll('.theme-button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`.theme-button.${theme}`).classList.add('active');
            
            // 保存主题设置
            localStorage.setItem('weather-theme', theme);
        }

        // 加载保存的主题
        function loadTheme() {
            const savedTheme = localStorage.getItem('weather-theme') || 'light';
            setTheme(savedTheme);
        }

        // 获取天气图标
        function getWeatherIcon(condition) {
            const lowerCondition = condition.toLowerCase().replace(/\s+/g, '-');
            return weatherIcons[lowerCondition] || weatherIcons['unknown'];
        }

        // 翻译天气状况
        function translateWeather(condition) {
            return weatherTranslations[condition] || condition;
        }

        // 搜索天气
        async function searchWeather() {
            const citySelect = document.getElementById('citySelect');
            const customCity = document.getElementById('customCity');
            
            let cityName = citySelect.value || customCity.value.trim();
            
            if (!cityName) {
                alert('请选择或输入城市名称');
                return;
            }

            showLoading();
            hideError();
            hideWeatherCard();

            try {
                // 使用wttr.in API获取天气数据
                const response = await fetch(`https://wttr.in/${encodeURIComponent(cityName)}?format=j1`);
                
                if (!response.ok) {
                    throw new Error('城市未找到或网络错误');
                }

                const data = await response.json();
                
                // 解析天气数据
                const current = data.current_condition[0];
                const location = data.nearest_area[0];
                
                const weatherData = {
                    name: location.areaName[0].value + (location.country[0].value !== location.areaName[0].value ? ', ' + location.country[0].value : ''),
                    temperature: parseInt(current.temp_C),
                    feelsLike: parseInt(current.FeelsLikeC),
                    humidity: parseInt(current.humidity),
                    windSpeed: parseFloat(current.windspeedKmph) / 3.6, // 转换为 m/s
                    description: current.weatherDesc[0].value,
                    icon: getWeatherIcon(current.weatherDesc[0].value)
                };

                displayWeather(weatherData);
                displayClothingTip(weatherData.temperature, weatherData.description);
                hideLoading();
                
            } catch (error) {
                console.error('获取天气数据失败:', error);
                hideLoading();
                showError('获取天气信息失败，请检查城市名称是否正确');
            }
        }

        // 显示天气信息
        function displayWeather(data) {
            const cityName = document.getElementById('cityName');
            const weatherIcon = document.getElementById('weatherIcon');
            const temperature = document.getElementById('temperature');
            const weatherDescription = document.getElementById('weatherDescription');
            const feelsLike = document.getElementById('feelsLike');
            const humidity = document.getElementById('humidity');
            const windSpeed = document.getElementById('windSpeed');
            const currentTime = document.getElementById('currentTime');

            cityName.textContent = data.name;
            weatherIcon.textContent = data.icon;
            temperature.textContent = `${data.temperature}°C`;
            weatherDescription.textContent = translateWeather(data.description);
            feelsLike.textContent = `${data.feelsLike}°C`;
            humidity.textContent = `${data.humidity}%`;
            windSpeed.textContent = `${data.windSpeed.toFixed(1)} m/s`;
            
            // 显示当前时间
            const now = new Date();
            currentTime.textContent = `更新时间: ${now.toLocaleString('zh-CN')}`;

            showWeatherCard();
        }

        // 显示/隐藏元素
        function showLoading() {
            document.getElementById('loading').classList.add('show');
        }

        function hideLoading() {
            document.getElementById('loading').classList.remove('show');
        }

        function showError(message) {
            const errorElement = document.getElementById('error');
            if (message) {
                errorElement.innerHTML = `<div>${message}</div>`;
            }
            errorElement.classList.add('show');
        }

        function hideError() {
            document.getElementById('error').classList.remove('show');
        }

        function showWeatherCard() {
            document.getElementById('weatherCard').classList.add('show');
        }

        function hideWeatherCard() {
            document.getElementById('weatherCard').classList.remove('show');
            document.getElementById('clothingTip').classList.remove('show');
        }

        // 回车键搜索
        document.getElementById('customCity').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchWeather();
            }
        });

        // 城市选择改变时清空自定义输入
        document.getElementById('citySelect').addEventListener('change', function() {
            if (this.value) {
                document.getElementById('customCity').value = '';
            }
        });

        // 自定义城市输入时清空选择
        document.getElementById('customCity').addEventListener('input', function() {
            if (this.value.trim()) {
                document.getElementById('citySelect').value = '';
            }
        });

        // 页面加载时的初始化
        window.addEventListener('load', function() {
            loadTheme();
            document.getElementById('citySelect').value = '北京';
            searchWeather();
        });
    </script>
</body>
</html>
