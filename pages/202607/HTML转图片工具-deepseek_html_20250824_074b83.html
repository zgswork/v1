<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3a0ca3;
            --success: #4cc9f0;
            --light: #f8f9fa;
            --dark: #212529;
            --gray: #6c757d;
            --border-radius: 10px;
            --box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: var(--dark);
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: #fff;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(120deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 25px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .description {
            font-size: 1.1rem;
            max-width: 800px;
            margin: 0 auto;
            opacity: 0.9;
        }
        
        .main-content {
            display: flex;
            flex-wrap: wrap;
            padding: 25px;
            gap: 25px;
        }
        
        .input-section, .output-section {
            flex: 1;
            min-width: 300px;
        }
        
        .section-title {
            font-size: 1.3rem;
            color: var(--primary);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eaeaea;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .section-title i {
            font-size: 1.5rem;
        }
        
        #html-input {
            width: 100%;
            height: 300px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: var(--border-radius);
            resize: vertical;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            background-color: var(--light);
            transition: var(--transition);
        }
        
        #html-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }
        
        .format-options {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .format-option {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .format-option input {
            width: 18px;
            height: 18px;
        }
        
        .actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        button {
            padding: 12px 20px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        button:hover {
            background-color: var(--secondary);
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        #convert-btn {
            background-color: #2ecc71;
        }
        
        #convert-btn:hover {
            background-color: #27ae60;
        }
        
        #download-btn {
            background-color: #9b59b6;
        }
        
        #download-btn:hover {
            background-color: #8e44ad;
        }
        
        #reset-btn {
            background-color: #e74c3c;
        }
        
        #reset-btn:hover {
            background-color: #c0392b;
        }
        
        .preview-container {
            border: 2px dashed #ddd;
            border-radius: var(--border-radius);
            padding: 20px;
            background-color: var(--light);
            min-height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
        }
        
        #preview {
            max-width: 100%;
            text-align: center;
        }
        
        .message {
            padding: 15px;
            border-radius: var(--border-radius);
            margin-top: 20px;
            display: none;
        }
        
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        footer {
            background-color: var(--light);
            padding: 20px;
            text-align: center;
            border-top: 1px solid #eaeaea;
        }
        
        .footer-content {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .footer-content p {
            margin-bottom: 10px;
            color: var(--gray);
        }
        
        .contact-info {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--gray);
            text-decoration: none;
        }
        
        .contact-item:hover {
            color: var(--primary);
        }
        
        .privacy-note {
            background-color: #e9f7fe;
            padding: 15px;
            border-radius: var(--border-radius);
            margin-top: 15px;
            font-size: 0.9rem;
            color: var(--gray);
        }
        
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .actions {
                flex-direction: column;
            }
            
            button {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-code"></i> HTML转图片工具</h1>
            <p class="description">简单易用的在线工具，将您的HTML代码转换为多种格式的图片。完全在浏览器中运行，保障您的隐私安全。</p>
        </header>
        
        <div class="main-content">
            <div class="input-section">
                <h2 class="section-title"><i class="fas fa-pencil-alt"></i> HTML代码输入</h2>
                <textarea id="html-input" placeholder="请输入HTML代码..."><div style="text-align: center; padding: 30px; background: linear-gradient(135deg, #6e8efb, #a777e3); color: white; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
    <h1>欢迎使用HTML转图片工具</h1>
    <p>这是一个示例HTML内容</p>
    <p>输入您的HTML代码，然后点击"转换为图片"按钮</p>
    <p style="margin-top: 20px;">
        <span style="background-color: #fff; color: #6e8efb; padding: 5px 10px; border-radius: 20px; display: inline-block;">简单易用</span>
        <span style="background-color: #fff; color: #6e8efb; padding: 5px 10px; border-radius: 20px; display: inline-block; margin-left: 10px;">多种格式</span>
        <span style="background-color: #fff; color: #6e8efb; padding: 5px 10px; border-radius: 20px; display: inline-block; margin-left: 10px;">本地运行</span>
    </p>
</div></textarea>
                
                <h2 class="section-title"><i class="fas fa-cog"></i> 输出设置</h2>
                <div class="format-options">
                    <label class="format-option">
                        <input type="radio" name="format" value="png" checked> PNG
                    </label>
                    <label class="format-option">
                        <input type="radio" name="format" value="jpeg"> JPEG
                    </label>
                    <label class="format-option">
                        <input type="radio" name="format" value="webp"> WEBP
                    </label>
                    <label class="format-option">
                        <input type="radio" name="format" value="bmp"> BMP
                    </label>
                </div>
                
                <div class="actions">
                    <button id="convert-btn">
                        <i class="fas fa-sync-alt"></i>转换为图片
                    </button>
                    <button id="download-btn" disabled>
                        <i class="fas fa-download"></i>下载图片
                    </button>
                    <button id="reset-btn">
                        <i class="fas fa-trash-alt"></i>重置
                    </button>
                </div>
                
                <div id="message" class="message"></div>
            </div>
            
            <div class="output-section">
                <h2 class="section-title"><i class="fas fa-image"></i> 图片预览</h2>
                <div class="preview-container">
                    <div id="preview">
                        <p style="color: #999;"><i class="fas fa-image fa-3x"></i></p>
                        <p style="color: #999; margin-top: 15px;">图片预览区域，转换后的图片将显示在这里</p>
                    </div>
                </div>
            </div>
        </div>
        
        <footer>
            <div class="footer-content">
                <p>© 2025 HTML转图片工具 | 最后更新: 2025年8月24日</p>
                <p>所有转换操作均在您的浏览器中完成，不会上传到任何服务器，保障您的隐私安全</p>
                
                <div class="contact-info">
                    <a href="/cdn-cgi/l/email-protection#65575056525152545757512514144b060a08" class="contact-item">
                        <i class="fas fa-envelope"></i> 邮箱: <span class="__cf_email__" data-cfemail="74464147434043454646403405055a171b19">[email&#160;protected]</span>
                    </a>
                    <span class="contact-item">
                        <i class="fab fa-weixin"></i> 微信: 2537471224
                    </span>
                </div>
                
                <div class="privacy-note">
                    <i class="fas fa-shield-alt"></i> 隐私说明: 本工具完全在浏览器中运行，您的HTML代码不会离开您的计算机，不会被上传到任何服务器。
                </div>
            </div>
        </footer>
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        document.addEventListener('DOMContentLoaded', function() {
            const htmlInput = document.getElementById('html-input');
            const convertBtn = document.getElementById('convert-btn');
            const downloadBtn = document.getElementById('download-btn');
            const resetBtn = document.getElementById('reset-btn');
            const preview = document.getElementById('preview');
            const message = document.getElementById('message');
            const formatOptions = document.querySelectorAll('input[name="format"]');
            
            let convertedImage = null;
            let selectedFormat = 'png';
            
            // 监听格式选择变化
            formatOptions.forEach(option => {
                option.addEventListener('change', function() {
                    selectedFormat = this.value;
                });
            });
            
            // 转换按钮点击事件
            convertBtn.addEventListener('click', function() {
                const htmlCode = htmlInput.value.trim();
                
                if (!htmlCode) {
                    showMessage('请输入HTML代码', 'error');
                    return;
                }
                
                showMessage('正在转换，请稍候...', 'success');
                
                // 将HTML代码设置到预览区域
                preview.innerHTML = htmlCode;
                
                // 使用html2canvas转换
                setTimeout(() => {
                    html2canvas(preview, {
                        backgroundColor: '#ffffff',
                        scale: 2 // 提高输出图片质量
                    }).then(canvas => {
                        const imageData = canvas.toDataURL(`image/${selectedFormat}`);
                        const img = new Image();
                        img.src = imageData;
                        img.style.maxWidth = '100%';
                        
                        preview.innerHTML = '';
                        preview.appendChild(img);
                        
                        convertedImage = imageData;
                        downloadBtn.disabled = false;
                        
                        showMessage(`转换成功！格式: ${selectedFormat.toUpperCase()}。点击"下载图片"按钮保存图片。`, 'success');
                    }).catch(error => {
                        showMessage('转换失败: ' + error.message, 'error');
                        console.error('转换错误:', error);
                    });
                }, 100);
            });
            
            // 下载按钮点击事件
            downloadBtn.addEventListener('click', function() {
                if (!convertedImage) {
                    showMessage('请先转换HTML代码', 'error');
                    return;
                }
                
                const downloadLink = document.createElement('a');
                const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
                downloadLink.href = convertedImage;
                downloadLink.download = `html-image-${timestamp}.${selectedFormat}`;
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
                
                showMessage('图片下载已开始', 'success');
            });
            
            // 重置按钮点击事件
            resetBtn.addEventListener('click', function() {
                htmlInput.value = '';
                preview.innerHTML = '<p style="color: #999;"><i class="fas fa-image fa-3x"></i></p><p style="color: #999; margin-top: 15px;">图片预览区域，转换后的图片将显示在这里</p>';
                downloadBtn.disabled = true;
                convertedImage = null;
                message.style.display = 'none';
                
                // 重置格式选项为PNG
                document.querySelector('input[value="png"]').checked = true;
                selectedFormat = 'png';
            });
            
            // 显示消息函数
            function showMessage(text, type) {
                message.textContent = text;
                message.className = 'message ' + type;
                message.style.display = 'block';
                
                // 5秒后自动隐藏消息
                setTimeout(() => {
                    message.style.display = 'none';
                }, 5000);
            }
        });
    </script>
</body>
</html>
