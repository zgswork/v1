                        summary = `<span class="tc-summary">${escapeHtml(truncate(e.content, 120))}</span>`;
                    } else {
                        summary = `<span class="tc-summary">${escapeHtml(truncate(e.content, 120))}</span>`;
                    }
                    const metaBits = [];
                    if (e.meta?.durationMs) metaBits.push(`<span class="tc-dur">${e.meta.durationMs}ms</span>`);
                    if (e.meta?.usage) {
                        const u = e.meta.usage;
                        if (u.inputTokens || u.outputTokens) metaBits.push(`<span class="tc-tokens">↑${u.inputTokens || 0} ↓${u.outputTokens || 0}</span>`);
                    }
                    html += `<div class="trace-row">
      <div class="trace-ts">${fmtTime(e.ts)}</div>
      <div class="trace-icon">${icon}</div>
      <div class="trace-content">${summary} ${metaBits.join(' ')}</div>
    </div>`;
                }
                html += '</div>';
                if (evs.length === 0) html = filtersHtml + '<div class="placeholder">无事件</div>';
                container.innerHTML = html;
            }

            function toggleTraceFilter(k) {
                traceFilters[k] = !traceFilters[k];
                renderTrace();
            }

            /* ---------- 遥测视图 ---------- */
            let telemPrefixFilter = '';
            let telemTraceFilter = '';

            function renderTelemetry() {
                const container = document.getElementById('tab-telemetry');
                const sess = getActiveSession();
                if (!sess || !sess.session.telemetry) {
                    container.innerHTML = `<div class="placeholder"><div class="big">📡</div>选择 ZCode 遥测日志查看事件</div>`;
                    return;
                }
                const telems = sess.session.telemetry;
                const prefixes = sess.session.eventPrefixes || {};

                let controls = '<div class="telemetry-controls">';
                controls += `<span style="color:var(--text-dim);font-size:11px;">前缀:</span><select onchange="telemPrefixFilter=this.value;renderTelemetry()">`;
                controls += `<option value="">全部</option>`;
                for (const [p, c] of Object.entries(prefixes).sort((a, b) => b[1] - a[1])) {
                    controls += `<option value="${escapeHtml(p)}" ${telemPrefixFilter === p ? 'selected' : ''}>${escapeHtml(p)} (${c})</option>`;
                }
                controls += `</select>`;
                controls += `<input type="text" placeholder="🔍 搜索 traceId / 事件 / 消息..." value="${escapeHtml(telemTraceFilter)}" oninput="telemTraceFilter=this.value;renderTelemetry()">`;
                controls += `<span style="color:var(--text-dim);font-size:11px;">共 ${telems.length} 条</span>`;
                controls += '</div>';

                let filtered = telems;
                if (telemPrefixFilter) {
                    filtered = filtered.filter(t => (t.event || '').startsWith(telemPrefixFilter + '.') || (t.event || '') === telemPrefixFilter);
                }
                if (telemTraceFilter) {
                    const q = telemTraceFilter.toLowerCase();
                    filtered = filtered.filter(t => (t.traceId || '').toLowerCase().includes(q) || (t.event || '').toLowerCase().includes(q) || (t.message || '').toLowerCase().includes(q) || (t.module || '').toLowerCase().includes(q));
                }

                let html = controls + '<table class="telemetry-table"><thead><tr><th>时间</th><th>事件</th><th>级别</th><th>模块</th><th>耗时</th><th>消息</th><th>traceId</th><th>上下文</th></tr></thead><tbody>';
                for (const t of filtered) {
                    html += `<tr>
      <td>${fmtTime(t.ts)}</td>
      <td class="ev-name">${escapeHtml(t.event)}</td>
      <td class="lvl-${t.level}">${escapeHtml(t.level)}</td>
      <td>${escapeHtml(t.module)}</td>
      <td class="dur">${t.durationMs != null ? t.durationMs + 'ms' : ''}</td>
      <td>${escapeHtml(truncate(t.message, 100))}</td>
      <td style="color:var(--text-dim)">${escapeHtml(truncate(t.traceId, 12))}</td>
      <td class="ctx" title="${escapeHtml(JSON.stringify(t.context))}">${escapeHtml(JSON.stringify(t.context))}</td>
    </tr>`;
                }
                html += '</tbody></table>';
                if (filtered.length === 0) html = controls + '<div class="placeholder">无匹配事件</div>';
                container.innerHTML = html;
            }

            /* ---------- 元数据视图 ---------- */
            function renderMetadata() {
                const container = document.getElementById('tab-metadata');
                const sess = getActiveSession();
                if (!sess) {
                    container.innerHTML = `<div class="placeholder"><div class="big">ℹ️</div>选择左侧会话查看元数据</div>`;
                    return;
                }
                const s = sess.session;
                const evs = s.events || [];
                // 统计
                const stats = { messages: 0, tool_calls: 0, tool_results: 0, reasoning: 0, turns: 0, snapshots: 0, total_tokens_in: 0, total_tokens_out: 0 };
                for (const e of evs) {
                    if (e.kind === 'message') stats.messages++;
                    else if (e.kind === 'tool_call') stats.tool_calls++;
                    else if (e.kind === 'tool_result') stats.tool_results++;
                    else if (e.kind === 'reasoning') stats.reasoning++;
                    else if (e.kind === 'turn_marker') stats.turns++;
                    else if (e.kind === 'file_snapshot') stats.snapshots++;
                    if (e.meta?.usage) {
                        stats.total_tokens_in += e.meta.usage.inputTokens || 0;
                        stats.total_tokens_out += e.meta.usage.outputTokens || 0;
                    }
                }

                let html = '<div class="meta-section-title">基本信息</div><div class="meta-grid">';
                const rows = [
                    ['来源', s.source],
                    ['文件', sess.name || s.fileName],
                    ['会话 ID', s.sessionId],
                    ['标题', s.title],
                    ['模型', s.model],
                    ['工作目录', s.cwd],
                    ['开始时间', fmtDateTime(s.startedAt)],
                    ['结束时间', fmtDateTime(s.completedAt)],
                    ['原始记录数', s.rawCalls],
                ];
                for (const [k, v] of rows) {
                    html += `<div class="mk">${k}</div><div class="mv">${escapeHtml(v || '—')}</div>`;
                }
                html += '</div>';

                html += '<div class="meta-section-title">事件统计</div><div class="meta-grid">';
                html += `<div class="mk">消息</div><div class="mv">${stats.messages}</div>`;
                html += `<div class="mk">工具调用</div><div class="mv">${stats.tool_calls}</div>`;
                html += `<div class="mk">工具结果</div><div class="mv">${stats.tool_results}</div>`;
                html += `<div class="mk">推理块</div><div class="mv">${stats.reasoning}</div>`;
                html += `<div class="mk">Turn 标记</div><div class="mv">${stats.turns}</div>`;
                html += `<div class="mk">文件快照</div><div class="mv">${stats.snapshots}</div>`;
                if (stats.total_tokens_in || stats.total_tokens_out) {
                    html += `<div class="mk">总输入 Token</div><div class="mv" style="color:var(--cyan)">${stats.total_tokens_in.toLocaleString()}</div>`;
                    html += `<div class="mk">总输出 Token</div><div class="mv" style="color:var(--cyan)">${stats.total_tokens_out.toLocaleString()}</div>`;
                }
                html += '</div>';

                if (s.systemPrompts && s.systemPrompts.length) {
                    html += '<div class="meta-section-title">系统提示词</div>';
                    for (let i = 0; i < s.systemPrompts.length; i++) {
                        html += `<div class="collapsible open" onclick="this.classList.toggle('open')">
        <div class="col-header"><span class="arrow">▾</span>系统提示词 ${i + 1} (${s.systemPrompts[i].length} 字符)</div>
        <div class="col-body"><pre style="max-height:500px;overflow:auto;">${escapeHtml(s.systemPrompts[i])}</pre></div>
      </div>`;
                    }
                }

                if (s.telemetry) {
                    html += '<div class="meta-section-title">遥测事件前缀分布</div><div class="meta-grid">';
                    for (const [p, c] of Object.entries(s.eventPrefixes || {}).sort((a, b) => b[1] - a[1])) {
                        html += `<div class="mk">${escapeHtml(p)}.*</div><div class="mv">${c}</div>`;
                    }
                    html += '</div>';
                }

                container.innerHTML = html;
            }

            /* ================================================================
             *  事件绑定
             * ================================================================ */
            document.getElementById('fileInput').addEventListener('change', e => {
                for (const f of e.target.files) loadFile(f);
                e.target.value = '';
            });

            document.getElementById('searchBox').addEventListener('input', e => {
                const val = e.target.value.trim();
                // debounce: 大会话搜索时避免每次按键都重渲染
                clearTimeout(searchDebounceTimer);
                searchDebounceTimer = setTimeout(() => {
                    searchQuery = val;
                    if (activeTab === 'conversation') renderConversation();
                }, 180);
            });

            document.querySelectorAll('.tab').forEach(t => {
                t.addEventListener('click', () => {
                    if (t.style.display === 'none') return;
                    switchTab(t.dataset.tab);
                });
            });

            // 拖拽
            const dragOverlay = document.getElementById('dragOverlay');
            let dragCounter = 0;
            window.addEventListener('dragenter', e => {
                e.preventDefault();
                dragCounter++;
                dragOverlay.classList.add('active');
            });
            window.addEventListener('dragleave', e => {
                e.preventDefault();
                dragCounter--;
                if (dragCounter <= 0) { dragCounter = 0; dragOverlay.classList.remove('active'); }
            });
            window.addEventListener('dragover', e => e.preventDefault());
            window.addEventListener('drop', e => {
                e.preventDefault();
                dragCounter = 0;
                dragOverlay.classList.remove('active');
                if (e.dataTransfer.files) {
                    for (const f of e.dataTransfer.files) loadFile(f);
                }
            });

        </script>
    </body>

</html>
