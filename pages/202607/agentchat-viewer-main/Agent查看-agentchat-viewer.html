<!DOCTYPE html>
<html lang="zh-CN">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AgentChat Viewer</title>
        <style>
            :root {
                --bg: #1a1b26;
                --bg-panel: #16161e;
                --bg-elev: #1f2031;
                --bg-hover: #2a2b3d;
                --bg-active: #2d2e44;
                --border: #2a2b3d;
                --text: #c0caf5;
                --text-dim: #7a7d99;
                --text-bright: #e6e7f5;
                --accent: #7aa2f7;
                --accent-dim: #565f89;
                --green: #9ece6a;
                --yellow: #e0af68;
                --red: #f7768e;
                --magenta: #bb9af7;
                --cyan: #7dcfff;
                --orange: #ff9e64;
                --user: #7aa2f7;
                --assistant: #9ece6a;
                --system: #e0af68;
                --tool: #bb9af7;
                --reasoning: #7dcfff;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html,
            body {
                height: 100%;
                overflow: hidden;
            }

            body {
                background: var(--bg);
                color: var(--text);
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
                font-size: 16px;
                line-height: 1.5;
                display: flex;
                flex-direction: column;
            }

            /* ===== 顶栏 ===== */
            .topbar {
                background: var(--bg-panel);
                border-bottom: 1px solid var(--border);
                padding: 8px 14px;
                display: flex;
                align-items: center;
                gap: 10px;
                flex-shrink: 0;
                min-height: 48px;
            }

            .topbar .logo {
                font-weight: 600;
                color: var(--text-bright);
                font-size: 16px;
                white-space: nowrap;
            }

            .topbar .logo .icon {
                color: var(--accent);
                margin-right: 4px;
            }

            .btn {
                background: var(--bg-elev);
                color: var(--text);
                border: 1px solid var(--border);
                padding: 5px 12px;
                border-radius: 5px;
                cursor: pointer;
                font-size: 12px;
                transition: all .12s;
                white-space: nowrap;
            }

            .btn:hover {
                background: var(--bg-hover);
                border-color: var(--accent-dim);
            }

            .btn.primary {
                background: var(--accent);
                color: #0d0e16;
                border-color: var(--accent);
                font-weight: 500;
            }

            .btn.primary:hover {
                background: #8db4ff;
            }

            .search-box {
                flex: 1;
                max-width: 360px;
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: 5px;
                padding: 4px 10px;
                color: var(--text);
                font-size: 16px;
                outline: none;
            }

            .search-box:focus {
                border-color: var(--accent);
            }

            .spacer {
                flex: 1;
            }

            .file-count {
                color: var(--text-dim);
                font-size: 11px;
            }

            .drop-hint {
                color: var(--text-dim);
                font-size: 16px;
                border: 1px dashed var(--border);
                padding: 3px 8px;
                border-radius: 4px;
            }

            /* ===== 主体 ===== */
            .main {
                flex: 1;
                display: flex;
                overflow: hidden;
            }

            /* ===== 左侧会话列表 ===== */
            .sidebar {
                width: 280px;
                background: var(--bg-panel);
                border-right: 1px solid var(--border);
                display: flex;
                flex-direction: column;
                flex-shrink: 0;
            }

            .sidebar-header {
                padding: 10px 12px;
                border-bottom: 1px solid var(--border);
                color: var(--text-dim);
                font-size: 16px;
                text-transform: uppercase;
                letter-spacing: .5px;
                font-weight: 600;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .session-list {
                flex: 1;
                overflow-y: auto;
                padding: 6px;
            }

            .group-label {
                color: var(--text-dim);
                font-size: 16px;
                text-transform: uppercase;
                letter-spacing: .6px;
                padding: 10px 8px 4px;
                font-weight: 600;
                display: flex;
                align-items: center;
                gap: 6px;
            }

            .group-label .dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
            }

            .dot.zcode {
                background: var(--accent);
            }

            .dot.codex {
                background: var(--green);
            }

            .dot.workbuddy {
                background: var(--orange);
            }

            .dot.zcode-log {
                background: var(--cyan);
            }

            .session-item {
                padding: 8px 10px;
                border-radius: 6px;
                cursor: pointer;
                margin: 2px 0;
                transition: background .1s;
                border: 1px solid transparent;
            }

            .session-item:hover {
                background: var(--bg-hover);
            }

            .session-item.active {
                background: var(--bg-active);
                border-color: var(--accent-dim);
            }

            .session-item .si-title {
                color: var(--text-bright);
                font-size: 16px;
                font-weight: 500;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .session-item .si-meta {
                color: var(--text-dim);
                font-size: 16px;
                margin-top: 3px;
                display: flex;
                gap: 8px;
                align-items: center;
            }

            .session-item .si-remove {
                float: right;
                color: var(--text-dim);
                opacity: 0;
                transition: opacity .1s;
                font-size: 16px;
                line-height: 1;
                padding: 0 4px;
            }

            .session-item:hover .si-remove {
                opacity: .7;
            }

            .session-item .si-remove:hover {
                opacity: 1;
                color: var(--red);
            }

            .empty-list {
                color: var(--text-dim);
                text-align: center;
                padding: 40px 16px;
                font-size: 16px;
                line-height: 1.8;
            }

            /* ===== 右侧主视图 ===== */
            .content {
                flex: 1;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            .tabs {
                display: flex;
                border-bottom: 1px solid var(--border);
                background: var(--bg-panel);
                flex-shrink: 0;
                padding: 0 8px;
            }

            .tab {
                padding: 10px 16px;
                cursor: pointer;
                color: var(--text-dim);
                font-size: 12px;
                border-bottom: 2px solid transparent;
                transition: all .12s;
                white-space: nowrap;
            }

            .tab:hover {
                color: var(--text);
            }

            .tab.active {
                color: var(--text-bright);
                border-bottom-color: var(--accent);
            }

            .tab .badge {
                background: var(--bg-elev);
                color: var(--text-dim);
                padding: 1px 6px;
                border-radius: 8px;
                font-size: 16px;
                margin-left: 4px;
            }

            .tab.active .badge {
                background: var(--accent);
                color: #0d0e16;
            }

            .tab-content {
                flex: 1;
                overflow-y: auto;
                padding: 16px 20px;
            }

            .tab-content.hidden {
                display: none;
            }

            .placeholder {
                color: var(--text-dim);
                text-align: center;
                padding: 80px 20px;
                line-height: 2;
            }

            .placeholder .big {
                font-size: 40px;
                margin-bottom: 12px;
                opacity: .4;
            }

            /* ===== 消息气泡 ===== */
            .msg {
                margin-bottom: 14px;
                display: flex;
                flex-direction: column;
            }

            .msg.user {
                align-items: flex-end;
            }

            .msg.assistant,
            .msg.system,
            .msg.developer {
                align-items: flex-start;
            }

            .msg-header {
                font-size: 16px;
                color: var(--text-dim);
                margin-bottom: 4px;
                padding: 0 2px;
                display: flex;
                gap: 8px;
                align-items: center;
            }

            .role-tag {
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: .4px;
                font-size: 16px;
            }

            .role-tag.user {
                color: var(--user);
            }

            .role-tag.assistant {
                color: var(--assistant);
            }

            .role-tag.system,
            .role-tag.developer {
                color: var(--system);
            }

            .bubble {
                max-width: 88%;
                padding: 10px 14px;
                border-radius: 10px;
                font-size: 16px;
                word-wrap: break-word;
                overflow-wrap: break-word;
                border: 1px solid var(--border);
            }

            .msg.user .bubble {
                background: rgba(122, 162, 247, .12);
                border-color: rgba(122, 162, 247, .3);
            }

            .msg.assistant .bubble {
                background: var(--bg-elev);
            }

            .msg.system .bubble,
            .msg.developer .bubble {
                background: rgba(224, 175, 104, .08);
                border-color: rgba(224, 175, 104, .25);
            }

            .bubble pre {
                background: #0f1018;
                padding: 10px 12px;
                border-radius: 6px;
                overflow-x: auto;
                margin: 8px 0;
                font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
                font-size: 16px;
                border: 1px solid var(--border);
                white-space: pre-wrap;
                word-break: break-word;
            }

            .bubble code {
                font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
                font-size: 16px;
            }

            .bubble p {
                margin: 6px 0;
            }

            .bubble p:first-child {
                margin-top: 0;
            }

            .bubble p:last-child {
                margin-bottom: 0;
            }

            .bubble ul,
            .bubble ol {
                margin: 6px 0;
                padding-left: 22px;
            }

            .bubble a {
                color: var(--accent);
            }

            .collapsible {
                margin: 6px 0;
                border: 1px solid var(--border);
                border-radius: 6px;
                overflow: hidden;
            }

            .collapsible>.col-header {
                padding: 6px 10px;
                background: var(--bg-panel);
                cursor: pointer;
                font-size: 16px;
                color: var(--text-dim);
                display: flex;
                align-items: center;
                gap: 6px;
                user-select: none;
            }

            .collapsible>.col-header:hover {
                background: var(--bg-hover);
                color: var(--text);
            }

            .collapsible>.col-header .arrow {
                transition: transform .15s;
                display: inline-block;
            }

            .collapsible.open>.col-header .arrow {
                transform: rotate(90deg);
            }

            .collapsible>.col-body {
                display: none;
                padding: 8px 10px;
            }

            .collapsible.open>.col-body {
                display: block;
            }

            /* ===== 工具调用卡片 ===== */
            .tool-card {
                margin: 8px 0;
                border: 1px solid var(--border);
                border-radius: 7px;
                overflow: hidden;
                background: rgba(187, 154, 247, .05);
            }

            .tool-card .tc-header {
                padding: 7px 11px;
                background: rgba(187, 154, 247, .1);
                cursor: pointer;
                font-size: 16px;
                display: flex;
                align-items: center;
                gap: 7px;
                user-select: none;
            }

            .tool-card .tc-header:hover {
                background: rgba(187, 154, 247, .18);
            }

            .tool-card .tc-header .tc-icon {
                color: var(--tool);
                font-size: 16px;
            }

            .tool-card .tc-header .tc-name {
                color: var(--tool);
                font-weight: 600;
                font-family: "JetBrains Mono", Consolas, monospace;
            }

            .tool-card .tc-header .tc-status {
                margin-left: auto;
                font-size: 16px;
                color: var(--text-dim);
            }

            .tool-card .tc-header .tc-status.ok {
                color: var(--green);
            }

            .tool-card .tc-header .tc-status.err {
                color: var(--red);
            }

            .tool-card .tc-body {
                display: none;
                padding: 10px;
            }

            .tool-card.open .tc-body {
                display: block;
            }

            .tool-card .tc-section {
                margin-bottom: 8px;
            }

            .tool-card .tc-section:last-child {
                margin-bottom: 0;
            }

            .tool-card .tc-label {
                font-size: 16px;
                color: var(--text-dim);
                text-transform: uppercase;
                letter-spacing: .4px;
                margin-bottom: 3px;
                font-weight: 600;
            }

            .tool-card .tc-args,
            .tool-card .tc-output {
                background: #0f1018;
                border: 1px solid var(--border);
                border-radius: 5px;
                padding: 8px 10px;
                font-family: "JetBrains Mono", Consolas, monospace;
                font-size: 16px;
                white-space: pre-wrap;
                word-break: break-word;
                max-height: 400px;
                overflow-y: auto;
            }

            .tool-card .tc-args.lang-json,
            .tool-card .tc-output.lang-json {
                color: var(--text);
            }

            /* ===== reasoning 折叠块 ===== */
            .reasoning-block {
                margin: 6px 0;
                border-left: 3px solid var(--reasoning);
                background: rgba(125, 207, 255, .05);
                border-radius: 0 6px 6px 0;
                padding: 7px 11px;
            }

            .reasoning-block .rb-header {
                cursor: pointer;
                color: var(--reasoning);
                font-size: 16px;
                font-weight: 600;
                display: flex;
                align-items: center;
                gap: 6px;
                user-select: none;
            }

            .reasoning-block .rb-header .arrow {
                transition: transform .15s;
                display: inline-block;
            }

            .reasoning-block.open .rb-header .arrow {
                transform: rotate(90deg);
            }

            .reasoning-block .rb-body {
                display: none;
                margin-top: 6px;
                color: var(--text-dim);
                font-size: 16px;
                white-space: pre-wrap;
                word-break: break-word;
                line-height: 1.6;
            }

            .reasoning-block.open .rb-body {
                display: block;
            }

            /* ===== 调用轨迹时间线 ===== */
            .trace-filters {
                display: flex;
                gap: 6px;
                flex-wrap: wrap;
                margin-bottom: 14px;
                align-items: center;
            }

            .filter-chip {
                background: var(--bg-elev);
                border: 1px solid var(--border);
                color: var(--text-dim);
                padding: 3px 10px;
                border-radius: 12px;
                font-size: 16px;
                cursor: pointer;
                transition: all .1s;
                user-select: none;
            }

            .filter-chip:hover {
                border-color: var(--accent-dim);
            }

            .filter-chip.active {
                background: var(--accent);
                color: #0d0e16;
                border-color: var(--accent);
            }

            .trace-list {
                font-family: "JetBrains Mono", Consolas, monospace;
                font-size: 16px;
            }

            .trace-row {
                display: flex;
                padding: 4px 0;
                border-bottom: 1px solid rgba(42, 43, 61, .4);
                gap: 10px;
                align-items: flex-start;
            }

            .trace-row:hover {
                background: var(--bg-panel);
            }

            .trace-ts {
                color: var(--text-dim);
                white-space: nowrap;
                flex-shrink: 0;
                width: 95px;
            }

            .trace-icon {
                width: 18px;
                text-align: center;
                flex-shrink: 0;
            }

            .trace-content {
                flex: 1;
                min-width: 0;
                word-break: break-word;
            }

            .trace-content .tc-role {
                font-weight: 600;
            }

            .trace-content .tc-role.user {
                color: var(--user);
            }

            .trace-content .tc-role.assistant {
                color: var(--assistant);
            }

            .trace-content .tc-role.system,
            .trace-content .tc-role.developer {
                color: var(--system);
            }

            .trace-content .tc-tool {
                color: var(--tool);
                font-weight: 600;
            }

            .trace-content .tc-summary {
                color: var(--text-dim);
            }

            .trace-content .tc-dur {
                color: var(--yellow);
                font-size: 16px;
            }

            .trace-content .tc-tokens {
                color: var(--cyan);
                font-size: 16px;
            }

            /* ===== 遥测表格 ===== */
            .telemetry-controls {
                display: flex;
                gap: 8px;
                margin-bottom: 12px;
                flex-wrap: wrap;
                align-items: center;
            }

            .telemetry-controls select,
            .telemetry-controls input {
                background: var(--bg-elev);
                border: 1px solid var(--border);
                color: var(--text);
                padding: 4px 8px;
                border-radius: 4px;
                font-size: 16px;
                outline: none;
            }

            .telemetry-controls input {
                min-width: 200px;
            }

            .telemetry-controls input:focus,
            .telemetry-controls select:focus {
                border-color: var(--accent);
            }

            .telemetry-table {
                width: 100%;
                border-collapse: collapse;
                font-size: 16px;
            }

            .telemetry-table th {
                text-align: left;
                padding: 7px 10px;
                background: var(--bg-panel);
                color: var(--text-dim);
                font-weight: 600;
                font-size: 16px;
                text-transform: uppercase;
                letter-spacing: .4px;
                position: sticky;
                top: 0;
                border-bottom: 1px solid var(--border);
            }

            .telemetry-table td {
                padding: 5px 10px;
                border-bottom: 1px solid rgba(42, 43, 61, .4);
                vertical-align: top;
                font-family: "JetBrains Mono", Consolas, monospace;
            }

            .telemetry-table tr:hover td {
                background: var(--bg-panel);
            }

            .telemetry-table .ev-name {
                color: var(--accent);
            }

            .telemetry-table .lvl-warn {
                color: var(--yellow);
            }

            .telemetry-table .lvl-info {
                color: var(--green);
            }

            .telemetry-table .lvl-error {
                color: var(--red);
            }

            .telemetry-table .dur {
                color: var(--yellow);
            }

            .telemetry-table .ctx {
                color: var(--text-dim);
                max-width: 400px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            /* ===== 元数据 ===== */
            .meta-grid {
                display: grid;
                grid-template-columns: 140px 1fr;
                gap: 6px 14px;
                margin-bottom: 18px;
                max-width: 800px;
            }

            .meta-grid .mk {
                color: var(--text-dim);
                font-size: 16px;
                text-transform: uppercase;
                letter-spacing: .4px;
                font-weight: 600;
            }

            .meta-grid .mv {
                color: var(--text-bright);
                font-family: "JetBrains Mono", Consolas, monospace;
                font-size: 16px;
                word-break: break-all;
            }

            .meta-section-title {
                color: var(--accent);
                font-size: 16px;
                font-weight: 600;
                margin: 20px 0 8px;
                padding-bottom: 5px;
                border-bottom: 1px solid var(--border);
            }

            /* ===== 拖拽遮罩 ===== */
            .drag-overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(122, 162, 247, .15);
                border: 3px dashed var(--accent);
                z-index: 9999;
                align-items: center;
                justify-content: center;
                font-size: 22px;
                color: var(--accent);
                font-weight: 600;
            }

            .drag-overlay.active {
                display: flex;
            }

            /* ===== Loading 遮罩 ===== */
            .loading-overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, .5);
                z-index: 9998;
                align-items: center;
                justify-content: center;
                flex-direction: column;
                gap: 14px;
                color: var(--accent);
                font-size: 16px;
            }

            .loading-overlay.active {
                display: flex;
            }

            .loading-spinner {
                width: 36px;
                height: 36px;
                border: 3px solid var(--border);
                border-top-color: var(--accent);
                border-radius: 50%;
                animation: spin .8s linear infinite;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            /* ===== 滚动条 ===== */
            ::-webkit-scrollbar {
                width: 10px;
                height: 10px;
            }

            ::-webkit-scrollbar-track {
                background: transparent;
            }

            ::-webkit-scrollbar-thumb {
                background: var(--border);
                border-radius: 5px;
            }

            ::-webkit-scrollbar-thumb:hover {
                background: var(--accent-dim);
            }

            .truncate-toggle {
                color: var(--accent);
                cursor: pointer;
                font-size: 16px;
                margin-top: 4px;
                display: inline-block;
            }

            .truncate-toggle:hover {
                text-decoration: underline;
            }

            .text-truncated {
                max-height: 200px;
                overflow: hidden;
                position: relative;
            }

            .text-truncated::after {
                content: "";
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                height: 40px;
                background: linear-gradient(transparent, var(--bg-elev));
            }
        </style>
    </head>

    <body>

        <div class="topbar">
            <div class="logo"><span class="icon">◈</span>AgentChat Viewer <span
                    style="color:var(--text-dim);font-weight:400;font-size:16px;">Agent 对话查看器</span></div>
            <button class="btn primary" onclick="document.getElementById('fileInput').click()">📂 选择 JSONL 文件</button>
            <input type="file" id="fileInput" multiple accept=".jsonl,.json,.log" style="display:none">
            <span class="drop-hint">或拖拽文件到此</span>
            <input type="text" class="search-box" id="searchBox" placeholder="🔍 搜索消息内容...">
            <div class="spacer"></div>
            <span class="file-count" id="fileCount"></span>
        </div>

        <div class="main">
            <div class="sidebar">
                <div class="sidebar-header">
                    <span>会话列表</span>
                    <span id="sessionCount"></span>
                </div>
                <div class="session-list" id="sessionList">
                    <div class="empty-list">
                        点击「选择 JSONL 文件」<br>或拖拽文件到窗口<br><br>
                        支持:<br>
                        <span style="color:var(--accent)">●</span> ZCode rollout<br>
                        <span style="color:var(--cyan)">●</span> ZCode 遥测日志<br>
                        <span style="color:var(--green)">●</span> Codex rollout<br>
                        <span style="color:var(--orange)">●</span> Workbuddy projects
                    </div>
                </div>
            </div>

            <div class="content">
                <div class="tabs" id="tabs">
                    <div class="tab active" data-tab="conversation">对话 <span class="badge" id="badge-conv">0</span>
                    </div>
                    <div class="tab" data-tab="trace">调用轨迹 <span class="badge" id="badge-trace">0</span></div>
                    <div class="tab" data-tab="telemetry" data-only="zcode-log">遥测 <span class="badge"
                            id="badge-telem">0</span></div>
                    <div class="tab" data-tab="metadata">元数据</div>
                </div>
                <div class="tab-content" id="tab-conversation">
                    <div class="placeholder">
                        <div class="big">💬</div>选择左侧会话查看对话内容
                    </div>
                </div>
                <div class="tab-content hidden" id="tab-trace">
                    <div class="placeholder">
                        <div class="big">📊</div>选择左侧会话查看调用轨迹
                    </div>
                </div>
                <div class="tab-content hidden" id="tab-telemetry">
                    <div class="placeholder">
                        <div class="big">📡</div>选择 ZCode 遥测日志查看事件
                    </div>
                </div>
                <div class="tab-content hidden" id="tab-metadata">
                    <div class="placeholder">
                        <div class="big">ℹ️</div>选择左侧会话查看元数据
                    </div>
                </div>
            </div>
        </div>

        <div class="drag-overlay" id="dragOverlay">放下文件以加载</div>

        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner"></div>
            <div id="loadingText">加载中...</div>
        </div>

        <script>
            /* ================================================================
             *  AgentChat Viewer — AI Agent 会话记录可视化
             *  支持: ZCode rollout / ZCode 遥测日志 / Codex rollout / Workbuddy
             * ================================================================ */

            // ---------- 工具函数 ----------
            function tryParseJson(line) {
                try { return JSON.parse(line); } catch { return null; }
            }
            function splitLines(text) { return text.split(/\r?\n/); }
            function firstNonEmptyLine(text) {
                for (const l of splitLines(text)) { if (l.trim()) return l; }
                return '';
            }
            function fmtTime(ts) {
                if (!ts) return '';
                let d;
                if (typeof ts === 'number') d = ts > 1e12 ? new Date(ts) : new Date(ts * 1000);
                else d = new Date(ts);
                if (isNaN(d)) return String(ts);
                const p = n => String(n).padStart(2, '0');
                return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
            }
            function fmtDateTime(ts) {
                if (!ts) return '';
                let d;
                if (typeof ts === 'number') d = ts > 1e12 ? new Date(ts) : new Date(ts * 1000);
                else d = new Date(ts);
                if (isNaN(d)) return String(ts);
                const p = n => String(n).padStart(2, '0');
                return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
            }
            function escapeHtml(s) {
                if (s == null) return '';
                return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }
            function prettyJson(obj) {
                if (obj == null) return '';
                if (typeof obj === 'string') {
                    // try parse
                    const p = tryParseJson(obj);
                    if (p) return JSON.stringify(p, null, 2);
                    return obj;
                }
                try { return JSON.stringify(obj, null, 2); } catch { return String(obj); }
            }
            function truncate(s, n) {
                if (!s) return '';
                s = String(s);
                return s.length > n ? s.slice(0, n) + '…' : s;
            }

            // 极简 markdown 渲染 (代码块、行内代码、加粗、链接、段落、列表)
            function renderMarkdown(text) {
                if (!text) return '';
                text = String(text);
                const parts = [];
                // 提取 ```代码块```
                const codeBlockRe = /```(\w*)\n?([\s\S]*?)```/g;
                let lastIdx = 0, m;
                while ((m = codeBlockRe.exec(text)) !== null) {
                    if (m.index > lastIdx) parts.push(renderInline(text.slice(lastIdx, m.index)));
                    parts.push(`<pre><code>${escapeHtml(m[2].replace(/\n$/, ''))}</code></pre>`);
                    lastIdx = m.index + m[0].length;
                }
                if (lastIdx < text.length) parts.push(renderInline(text.slice(lastIdx)));
                return parts.join('');
            }
            function renderInline(text) {
                let t = escapeHtml(text);
                // 行内代码
                t = t.replace(/`([^`\n]+)`/g, '<code style="background:#0f1018;padding:1px 5px;border-radius:3px;">$1</code>');
                // 加粗
                t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                // 链接
                t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
                // 标题 (h1-h4, 系统提示词中常见)
                t = t.replace(/^#### (.+)$/gm, '<p style="font-weight:600;font-size:12px;margin-top:6px;color:var(--text-bright);">$1</p>');
                t = t.replace(/^### (.+)$/gm, '<p style="font-weight:600;font-size:13px;margin-top:8px;color:var(--text-bright);">$1</p>');
                t = t.replace(/^## (.+)$/gm, '<p style="font-weight:600;font-size:14px;margin-top:8px;color:var(--text-bright);">$1</p>');
                t = t.replace(/^# (.+)$/gm, '<p style="font-weight:700;font-size:15px;margin-top:10px;color:var(--text-bright);">$1</p>');
                // 段落 / 换行
                const lines = t.split(/\n/);
                const out = [];
                let buf = [];
                const flush = () => { if (buf.length) { out.push('<p>' + buf.join('<br>') + '</p>'); buf = []; } };
                for (const ln of lines) {
                    if (ln.startsWith('<pre>') || ln.startsWith('<p style')) { flush(); out.push(ln); }
                    else if (ln.trim() === '') flush();
                    else if (/^\s*[-*] /.test(ln)) { flush(); out.push('<p style="padding-left:14px;">' + ln + '</p>'); }
                    else buf.push(ln);
                }
                flush();
                return out.join('');
            }

            // ---------- 格式检测 ----------
            function detectFormat(text) {
                const first = firstNonEmptyLine(text);
                const o = tryParseJson(first);
                if (!o) return 'unknown';
                // ZCode rollout: type=model_io
                if (o.type === 'model_io' && o.request && o.request.body) return 'zcode-rollout';
                // ZCode 遥测日志: event + module
                if (o.event && o.module && o.timestamp) return 'zcode-log';
                // Codex rollout: type=session_meta
                if (o.type === 'session_meta' || (o.type === 'response_item') || (o.type === 'event_msg') || (o.type === 'turn_context')) return 'codex';
                // Workbuddy: type=message + content 数组 + 整数时间戳
                if (o.type === 'message' && Array.isArray(o.content) && typeof o.timestamp === 'number') return 'workbuddy';
                if (o.type === 'reasoning' || o.type === 'function_call' || o.type === 'function_call_result' || o.type === 'file-history-snapshot' || o.type === 'ai-title') return 'workbuddy';
                // Codex session_index
                if (o.id && o.thread_name && o.updated_at) return 'codex-index';
                return 'unknown';
            }

            /* ================================================================
             *  适配器 1: ZCode rollout
             *  每行 = 1 次 model call (request + response)
             * ================================================================ */
            function parseZCodeRollout(text) {
                const lines = splitLines(text).filter(l => l.trim());
                const calls = [];
                for (const l of lines) {
                    const o = tryParseJson(l);
                    if (o) calls.push(o);
                }
                if (!calls.length) return null;

                const sessionId = calls[0].sessionId || '';
                const events = [];
                let title = '';
                const systemPrompts = [];
                const model = calls[0].model?.modelId || '';
                const cwd = '';

                // 用于去重 messages (每行重放全部历史)
                const seenMsgKeys = new Set();

                for (const call of calls) {
                    const req = call.request || {};
                    const body = req.body || {};
                    const resp = call.response || {};
                    const meta = {
                        model: call.model?.modelId,
                        role: call.model?.role,
                        requestId: call.requestId,
                        turnId: call.turnId,
                        traceId: call.traceId,
                        durationMs: call.durationMs,
                        usage: resp.usage,
                        startedAt: call.startedAt,
                        attempt: call.attempt
                    };

                    // 系统提示词 (取第一个 system 块,去重)
                    if (Array.isArray(body.system) && body.system.length) {
                        const sysText = body.system.map(s => s.text || '').join('\n\n');
                        const sysKey = sysText.slice(0, 200);
                        if (!systemPrompts.includes(sysKey)) {
                            systemPrompts.push(sysKey);
                            events.push({
                                kind: 'message', role: 'system', ts: call.startedAt,
                                content: sysText, meta: { source: 'system-prompt' }
                            });
                        }
                    }

                    // messages (增量去重)
                    const msgs = req.messages || [];
                    const offset = req.messageOffset || 0;
                    for (let i = 0; i < msgs.length; i++) {
                        // 简单去重: 用 role + content前80字符 + index
                        const msg = msgs[i];
                        const contentStr = extractZCodeMsgContent(msg);
                        const key = `${msg.role}|${contentStr.slice(0, 120)}`;
                        if (seenMsgKeys.has(key)) continue;
                        seenMsgKeys.add(key);

                        if (msg.role === 'assistant') {
                            // 可能含 reasoning + text + toolCalls
                            const reasoning = extractZCodeAssistantReasoning(msg);
                            const textPart = extractZCodeAssistantText(msg);
                            const toolCalls = msg.toolCalls || (Array.isArray(msg.content) ? msg.content.filter(c => c.type === 'tool_use').map(c => ({ id: c.id, name: c.name, input: c.input })) : []);
                            events.push({
                                kind: 'message', role: 'assistant', ts: call.startedAt,
                                content: textPart, reasoning, toolCalls: toolCalls.length ? toolCalls : undefined,
                                meta
                            });
                        } else if (msg.role === 'tool') {
                            // tool result
                            events.push({
                                kind: 'tool_result', ts: call.startedAt,
                                toolResults: [{ callId: msg.toolCallId, output: typeof msg.content === 'string' ? msg.content : JSON.stringify(msg.content), toolName: msg.toolName, isError: msg.isError }],
                                meta
                            });
                        } else {
                            events.push({
                                kind: 'message', role: msg.role, ts: call.startedAt,
                                content: contentStr, meta
                            });
                        }
                    }

                    // response 的 assistant 输出 (若 messages 里没有则补充)
                    if (resp.text || (resp.toolCalls && resp.toolCalls.length)) {
                        const respText = resp.text || '';
                        const respKey = `assistant|${respText.slice(0, 120)}`;
                        if (respText && !seenMsgKeys.has(respKey)) {
                            seenMsgKeys.add(respKey);
                            events.push({
                                kind: 'message', role: 'assistant', ts: call.completedAt || call.startedAt,
                                content: respText, toolCalls: resp.toolCalls, meta
                            });
                        } else if (resp.toolCalls && resp.toolCalls.length && !seenMsgKeys.has('resp_tc_' + call.requestId)) {
                            seenMsgKeys.add('resp_tc_' + call.requestId);
                            // tool calls 可能已在 messages 中, 不重复
                        }
                    }
                }

                // 提取标题: 第一个 user 消息截断
                const firstUser = events.find(e => e.role === 'user' && e.content);
                if (firstUser) title = truncate(firstUser.content.replace(/<[^>]+>/g, '').trim(), 40);

                return {
                    source: 'zcode-rollout',
                    sessionId,
                    title: title || `ZCode ${sessionId.slice(0, 8)}`,
                    model,
                    cwd,
                    startedAt: calls[0].startedAt,
                    completedAt: calls[calls.length - 1].completedAt,
                    events,
                    rawCalls: calls.length,
                    systemPrompts
                };
            }

            function extractZCodeMsgContent(msg) {
                if (!msg) return '';
                if (typeof msg.content === 'string') return msg.content;
                if (Array.isArray(msg.content)) {
                    return msg.content
                        .filter(c => c.type === 'text' || c.type === 'input_text')
                        .map(c => c.text || '')
                        .join('\n');
                }
                return '';
            }
            function extractZCodeAssistantReasoning(msg) {
                if (!msg || !Array.isArray(msg.content)) return null;
                const parts = msg.content.filter(c => c.type === 'reasoning').map(c => c.text || c.reasoning || '').filter(Boolean);
                return parts.length ? parts.join('\n') : null;
            }
            function extractZCodeAssistantText(msg) {
                if (!msg) return '';
                if (typeof msg.content === 'string') return msg.content;
                if (Array.isArray(msg.content)) {
                    return msg.content.filter(c => c.type === 'text').map(c => c.text || '').join('\n');
                }
                return '';
            }

            /* ================================================================
             *  适配器 2: ZCode 遥测日志
             *  每行 = 1 个 telemetry 事件
             * ================================================================ */
            function parseZCodeLog(text) {
                const lines = splitLines(text).filter(l => l.trim());
                const telemetry = [];
                let traceId = '';
                for (const l of lines) {
                    const o = tryParseJson(l);
                    if (!o) continue;
                    telemetry.push({
                        ts: o.timestamp,
                        event: o.event || '',
                        level: o.level || 'info',
                        module: o.module || '',
                        message: o.message || '',
                        durationMs: o.durationMs,
                        status: o.status,
                        traceId: o.traceId || '',
                        spanId: o.spanId || '',
                        context: o.context || {}
                    });
                    if (!traceId && o.traceId) traceId = o.traceId;
                }
                if (!telemetry.length) return null;

                // 按 event 前缀统计
                const eventPrefixes = {};
                for (const t of telemetry) {
                    const prefix = (t.event.split('.')[0]) || 'other';
                    eventPrefixes[prefix] = (eventPrefixes[prefix] || 0) + 1;
                }

                return {
                    source: 'zcode-log',
                    sessionId: traceId,
                    title: `遥测日志 ${fmtDate(telemetry[0].ts)}`,
                    model: '',
                    cwd: '',
                    startedAt: telemetry[0].ts,
                    completedAt: telemetry[telemetry.length - 1].ts,
                    events: [],
                    telemetry,
                    eventPrefixes,
                    rawCalls: telemetry.length
                };
            }
            function fmtDate(ts) {
                const d = new Date(ts);
                if (isNaN(d)) return '';
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            }

            /* ================================================================
             *  适配器 3: Codex rollout
             *  每行 = 1 个事件 (session_meta / turn_context / event_msg / response_item)
             * ================================================================ */
            function parseCodexRollout(text) {
                const lines = splitLines(text).filter(l => l.trim());
                const records = [];
                for (const l of lines) {
                    const o = tryParseJson(l);
                    if (o) records.push(o);
                }
                if (!records.length) return null;

                let sessionId = '', cwd = '', model = '', systemPrompt = '', title = '';
                const events = [];
                // call_id → tool_call event index (用于配对 output)
                const callIdMap = {};

                for (const rec of records) {
                    const ts = rec.timestamp;
                    const type = rec.type;
                    const payload = rec.payload || {};

                    if (type === 'session_meta') {
                        sessionId = payload.session_id || payload.id || '';
                        cwd = payload.cwd || '';
                        model = payload.model_provider || '';
                        if (payload.base_instructions && payload.base_instructions.text) {
                            systemPrompt = payload.base_instructions.text;
                            events.push({ kind: 'message', role: 'system', ts, content: systemPrompt, meta: { source: 'base_instructions', cli_version: payload.cli_version, originator: payload.originator } });
                        }
                    } else if (type === 'turn_context') {
                        events.push({ kind: 'turn_marker', ts, content: `Turn: ${payload.turn_id || ''}`, meta: { sandbox: payload.sandbox_policy, approval: payload.approval_policy } });
                    } else if (type === 'event_msg') {
                        const et = payload.type;
                        if (et === 'token_count') {
                            events.push({ kind: 'meta_event', ts, content: `token_count: in=${payload.input_tokens} out=${payload.output_tokens}`, meta: { turn_id: payload.turn_id } });
                        } else if (et === 'task_started') {
                            events.push({ kind: 'turn_marker', ts, content: `任务开始 (turn ${truncate(payload.turn_id, 8)})`, meta: { model_context_window: payload.model_context_window } });
                        } else if (et === 'task_complete') {
                            events.push({ kind: 'turn_marker', ts, content: `任务完成` });
                        } else if (et === 'agent_message') {
                            events.push({ kind: 'message', role: 'assistant', ts, content: payload.text || '', meta: { turn_id: payload.turn_id } });
                        } else if (et === 'user_message') {
                            events.push({ kind: 'message', role: 'user', ts, content: payload.text || '', meta: { turn_id: payload.turn_id } });
                        } else {
                            events.push({ kind: 'meta_event', ts, content: `${et}`, meta: payload });
                        }
                    } else if (type === 'response_item') {
                        const pt = payload.type;
                        const turnId = payload.internal_chat_message_metadata_passthrough?.turn_id;

                        if (pt === 'message') {
                            const role = payload.role || 'user';
                            const text = (payload.content || []).map(c => c.text || '').join('\n');
                            events.push({ kind: 'message', role, ts, content: text, meta: { turn_id: turnId } });
                        } else if (pt === 'reasoning') {
                            const summary = (payload.summary || []).map(s => s.text || '').join('\n');
                            const encrypted = payload.encrypted_content ? '\n[已加密内容,无法显示]' : '';
                            events.push({ kind: 'reasoning', ts, content: (summary || '(无摘要)') + encrypted, meta: { turn_id: turnId, encrypted: !!payload.encrypted_content } });
                        } else if (pt === 'function_call') {
                            const args = payload.arguments ? (tryParseJson(payload.arguments) || payload.arguments) : {};
                            const ev = { kind: 'tool_call', ts, content: '', toolCalls: [{ id: payload.call_id, name: payload.name, input: args }], meta: { turn_id: turnId } };
                            events.push(ev);
                            if (payload.call_id) callIdMap[payload.call_id] = events.length - 1;
                        } else if (pt === 'function_call_output') {
                            const out = payload.output || '';
                            events.push({ kind: 'tool_result', ts, toolResults: [{ callId: payload.call_id, output: typeof out === 'string' ? out : JSON.stringify(out, null, 2) }], meta: { turn_id: turnId } });
                        } else if (pt === 'custom_tool_call') {
                            const input = payload.input ? (typeof payload.input === 'string' ? (tryParseJson(payload.input) || payload.input) : payload.input) : {};
                            const ev = { kind: 'tool_call', ts, content: '', toolCalls: [{ id: payload.call_id, name: payload.name, input }], meta: { turn_id: turnId, custom: true, status: payload.status } };
                            events.push(ev);
                            if (payload.call_id) callIdMap[payload.call_id] = events.length - 1;
                        } else if (pt === 'custom_tool_call_output') {
                            const out = payload.output || '';
                            events.push({ kind: 'tool_result', ts, toolResults: [{ callId: payload.call_id, output: typeof out === 'string' ? out : JSON.stringify(out, null, 2) }], meta: { turn_id: turnId, custom: true } });
                        }
                    }
                }

                // 标题: 跳过框架注入的上下文消息, 找真正的用户输入
                const realUserMsg = events.find(e => e.role === 'user' && e.content
                    && !e.content.trim().startsWith('<environment')
                    && !e.content.trim().startsWith('<permissions')
                    && !e.content.trim().startsWith('# Files mentioned')
                    && !e.content.trim().startsWith('# In app browser')
                    && !e.content.trim().startsWith('<user_instructions')
                    && !e.content.trim().startsWith('# User message')
                    && e.content.trim().length > 0);
                if (realUserMsg) title = truncate(realUserMsg.content.replace(/<[^>]+>/g, '').trim(), 40);

                return {
                    source: 'codex',
                    sessionId,
                    title: title || `Codex ${sessionId.slice(0, 8)}`,
                    model,
                    cwd,
                    startedAt: records[0].timestamp,
                    completedAt: records[records.length - 1].timestamp,
                    events,
                    systemPrompts: systemPrompt ? [systemPrompt] : [],
                    rawCalls: records.length
                };
            }

            /* ================================================================
             *  适配器 4: Workbuddy projects
             *  每行 = 1 个事件, parentId 构建树
             * ================================================================ */
            function parseWorkbuddy(text) {
                const lines = splitLines(text).filter(l => l.trim());
                const records = [];
                for (const l of lines) {
                    const o = tryParseJson(l);
                    if (o) records.push(o);
                }
                if (!records.length) return null;

                let sessionId = '', title = '', model = '', cwd = '';
                const events = [];

                for (const rec of records) {
                    const ts = rec.timestamp;
                    const type = rec.type;
                    sessionId = rec.sessionId || sessionId;
                    cwd = rec.cwd || cwd;

                    if (type === 'ai-title') {
                        title = rec.aiTitle || title;
                        continue;
                    }

                    if (type === 'message') {
                        const role = rec.role || 'user';
                        const text = (rec.content || []).map(c => c.text || '').join('\n');
                        events.push({
                            kind: 'message', role, ts, content: text,
                            meta: { id: rec.id, parentId: rec.parentId, agent: rec.providerData?.agent }
                        });
                    } else if (type === 'reasoning') {
                        const rawText = (rec.rawContent || []).map(c => c.text || '').join('\n');
                        const contentText = (rec.content || []).map(c => c.text || '').join('\n');
                        events.push({
                            kind: 'reasoning', ts,
                            content: rawText || contentText || '(无推理内容)',
                            meta: { id: rec.id, parentId: rec.parentId, model: rec.providerData?.model, traceId: rec.providerData?.traceId }
                        });
                    } else if (type === 'function_call') {
                        const args = rec.arguments ? (tryParseJson(rec.arguments) || rec.arguments) : {};
                        const reasoning = rec.providerData?.reasoning || null;
                        events.push({
                            kind: 'tool_call', ts, content: '',
                            toolCalls: [{ id: rec.callId, name: rec.name, input: args }],
                            reasoning,
                            meta: { id: rec.id, parentId: rec.parentId, model: rec.providerData?.model, traceId: rec.providerData?.traceId }
                        });
                    } else if (type === 'function_call_result') {
                        const out = rec.output;
                        let outText = '';
                        if (typeof out === 'string') outText = out;
                        else if (out && out.text) outText = out.text;
                        else outText = JSON.stringify(out, null, 2);
                        events.push({
                            kind: 'tool_result', ts,
                            toolResults: [{ callId: rec.callId, output: outText, toolName: rec.name, status: rec.status, isError: rec.status && rec.status !== 'completed' && rec.status !== 'success' }],
                            meta: { id: rec.id, parentId: rec.parentId }
                        });
                    } else if (type === 'file-history-snapshot') {
                        const files = rec.snapshot?.trackedFileBackups || {};
                        const fileCount = Object.keys(files).length;
                        events.push({
                            kind: 'file_snapshot', ts,
                            content: `文件快照 (${fileCount} 个文件)`,
                            meta: { id: rec.id, isSnapshotUpdate: rec.isSnapshotUpdate, messageId: rec.snapshot?.messageId, files }
                        });
                    }
                }

                // model 从 providerData 取
                for (const r of records) {
                    if (r.providerData?.model) { model = r.providerData.model; break; }
                    if (r.providerData?.requestModelName) { model = r.providerData.requestModelName; break; }
                }

                if (!title) {
                    const firstUser = events.find(e => e.role === 'user' && e.content);
                    if (firstUser) title = truncate(firstUser.content.replace(/<system-reminder[\s\S]*?<\/system-reminder>/g, '').replace(/<[^>]+>/g, '').trim(), 40);
                }

                return {
                    source: 'workbuddy',
                    sessionId,
                    title: title || `Workbuddy ${sessionId.slice(0, 8) || truncate(cwd, 30)}`,
                    model,
                    cwd,
                    startedAt: records[0].timestamp,
                    completedAt: records[records.length - 1].timestamp,
                    events,
                    systemPrompts: [],
                    rawCalls: records.length
                };
            }

            /* ================================================================
             *  文件加载 & 会话管理
             * ================================================================ */
            const sessions = []; // {id, name, source, session(normalized), searchTexts[]}
            let activeSessionId = null;
            let activeTab = 'conversation';
            let searchQuery = '';
            let searchDebounceTimer = null;

            // 为一个 session 预计算每个事件的可搜索文本, 避免每次按键都 JSON.stringify
            function buildSearchTexts(session) {
                const evs = session.events || [];
                const arr = new Array(evs.length);
                for (let i = 0; i < evs.length; i++) {
                    const e = evs[i];
                    let t = (e.content || '') + ' ' + (e.reasoning || '');
                    if (e.toolCalls) t += ' ' + safeStringify(e.toolCalls);
                    if (e.toolResults) t += ' ' + safeStringify(e.toolResults);
                    arr[i] = t.toLowerCase();
                }
                session._searchTexts = arr;
            }
            function safeStringify(v) {
                try { return JSON.stringify(v); } catch { return String(v); }
            }

            function loadFile(file) {
                const reader = new FileReader();
                reader.onload = e => {
                    const text = e.target.result;
                    // 大文件解析可能耗时, 先显示 loading 再让出主线程
                    showLoading(`解析 ${file.name} ...`);
                    setTimeout(() => {
                        const fmt = detectFormat(text);
                        let session = null;
                        let sourceLabel = '';
                        if (fmt === 'zcode-rollout') { session = parseZCodeRollout(text); sourceLabel = 'zcode'; }
                        else if (fmt === 'zcode-log') { session = parseZCodeLog(text); sourceLabel = 'zcode-log'; }
                        else if (fmt === 'codex') { session = parseCodexRollout(text); sourceLabel = 'codex'; }
                        else if (fmt === 'workbuddy') { session = parseWorkbuddy(text); sourceLabel = 'workbuddy'; }

                        if (!session) {
                            hideLoading();
                            alert(`无法识别文件格式: ${file.name}\n(检测到: ${fmt})`);
                            return;
                        }
                        session.fileName = file.name;
                        session.sourceLabel = sourceLabel;
                        buildSearchTexts(session);
                        const id = 's_' + Math.random().toString(36).slice(2, 9);
                        sessions.push({ id, name: file.name, session });
                        hideLoading();
                        renderSessionList();
                        selectSession(id);
                    }, 30);
                };
                reader.readAsText(file);
            }
            function showLoading(msg) {
                const ov = document.getElementById('loadingOverlay');
                document.getElementById('loadingText').textContent = msg || '加载中...';
                ov.classList.add('active');
            }
            function hideLoading() {
                document.getElementById('loadingOverlay').classList.remove('active');
            }

            function renderSessionList() {
                const list = document.getElementById('sessionList');
                const groups = { 'zcode': [], 'zcode-log': [], 'codex': [], 'workbuddy': [] };
                for (const s of sessions) {
                    const g = s.session.sourceLabel || s.session.source;
                    if (!groups[g]) groups[g] = [];
                    groups[g].push(s);
                }

                if (sessions.length === 0) {
                    list.innerHTML = `<div class="empty-list">点击「选择 JSONL 文件」<br>或拖拽文件到窗口<br><br>支持:<br><span style="color:var(--accent)">●</span> ZCode rollout<br><span style="color:var(--cyan)">●</span> ZCode 遥测日志<br><span style="color:var(--green)">●</span> Codex rollout<br><span style="color:var(--orange)">●</span> Workbuddy projects</div>`;
                    document.getElementById('sessionCount').textContent = '';
                    document.getElementById('fileCount').textContent = '';
                    return;
                }

                const labels = {
                    'zcode': ['ZCode Rollout', 'zcode'],
                    'zcode-log': ['ZCode 遥测日志', 'zcode-log'],
                    'codex': ['Codex', 'codex'],
                    'workbuddy': ['Workbuddy', 'workbuddy']
                };
                let html = '';
                for (const [g, items] of Object.entries(groups)) {
                    if (!items.length) continue;
                    const [label, dotClass] = labels[g] || [g, 'zcode'];
                    html += `<div class="group-label"><span class="dot ${dotClass}"></span>${label} (${items.length})</div>`;
                    for (const s of items) {
                        const sess = s.session;
                        const active = s.id === activeSessionId ? 'active' : '';
                        const evCount = sess.events.length + (sess.telemetry ? sess.telemetry.length : 0);
                        html += `<div class="session-item ${active}" onclick="selectSession('${s.id}')">
        <span class="si-remove" onclick="event.stopPropagation();removeSession('${s.id}')" title="移除">×</span>
        <div class="si-title">${escapeHtml(sess.title || s.name)}</div>
        <div class="si-meta">
          <span>${fmtDateTime(sess.startedAt)}</span>
          ${sess.model ? `<span style="color:var(--magenta)">${escapeHtml(sess.model)}</span>` : ''}
          <span>${evCount} 事件</span>
        </div>
      </div>`;
                    }
                }
                list.innerHTML = html;
                document.getElementById('sessionCount').textContent = sessions.length + ' 个';
                document.getElementById('fileCount').textContent = `${sessions.length} 个会话已加载`;
            }

            function removeSession(id) {
                const idx = sessions.findIndex(s => s.id === id);
                if (idx >= 0) sessions.splice(idx, 1);
                if (activeSessionId === id) {
                    activeSessionId = null;
                    renderContent();
                }
                renderSessionList();
            }

            function selectSession(id) {
                activeSessionId = id;
                renderSessionList();
                renderContent();
            }

            function getActiveSession() {
                return sessions.find(s => s.id === activeSessionId);
            }

            /* ================================================================
             *  渲染层
             * ================================================================ */
            function renderContent() {
                const sess = getActiveSession();
                // 更新 tab 可见性
                const telemTab = document.querySelector('.tab[data-tab="telemetry"]');
                if (sess && sess.session.source === 'zcode-log') {
                    telemTab.style.display = '';
                } else {
                    telemTab.style.display = 'none';
                    if (activeTab === 'telemetry') switchTab('conversation');
                }

                // 更新 badges
                if (sess) {
                    const evs = sess.session.events || [];
                    document.getElementById('badge-conv').textContent = evs.filter(e => e.kind === 'message' || e.kind === 'reasoning').length;
                    document.getElementById('badge-trace').textContent = evs.length;
                    document.getElementById('badge-telem').textContent = sess.session.telemetry ? sess.session.telemetry.length : 0;
                } else {
                    document.getElementById('badge-conv').textContent = 0;
                    document.getElementById('badge-trace').textContent = 0;
                    document.getElementById('badge-telem').textContent = 0;
                }

                if (activeTab === 'conversation') renderConversation();
                else if (activeTab === 'trace') renderTrace();
                else if (activeTab === 'telemetry') renderTelemetry();
                else if (activeTab === 'metadata') renderMetadata();
            }

            function switchTab(name) {
                activeTab = name;
                document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
                document.getElementById('tab-' + name).classList.remove('hidden');
                renderContent();
            }

            /* ---------- 对话视图 ---------- */
            function renderConversation() {
                const container = document.getElementById('tab-conversation');
                const sess = getActiveSession();
                if (!sess) {
                    container.innerHTML = `<div class="placeholder"><div class="big">💬</div>选择左侧会话查看对话内容</div>`;
                    return;
                }
                const evs = sess.session.events || [];
                if (sess.session.source === 'zcode-log') {
                    container.innerHTML = `<div class="placeholder"><div class="big">📡</div>这是遥测日志,请切换到「遥测」标签查看</div>`;
                    return;
                }

                // 按搜索过滤 (使用预缓存的可搜索文本)
                let filtered = evs;
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    const cache = sess.session._searchTexts;
                    filtered = evs.filter((e, i) => (cache ? cache[i] : ((e.content || '') + (e.reasoning || '')).toLowerCase()).includes(q));
                }

                let html = '';
                // 系统提示词折叠
                if (sess.session.systemPrompts && sess.session.systemPrompts.length) {
                    for (let i = 0; i < sess.session.systemPrompts.length; i++) {
                        const sp = sess.session.systemPrompts[i];
                        html += `<div class="msg system">
        <div class="msg-header"><span class="role-tag system">SYSTEM PROMPT ${i + 1}</span></div>
        <div class="bubble">
          <div class="collapsible" onclick="this.classList.toggle('open')">
            <div class="col-header"><span class="arrow">▸</span>系统提示词 (${sp.length} 字符)</div>
            <div class="col-body"><pre>${escapeHtml(sp)}</pre></div>
          </div>
        </div>
      </div>`;
                    }
                }

                // 工具结果缓存 (callId → output), 用于在 tool_call 旁显示结果
                const toolResultsByCallId = {};
                for (const e of filtered) {
                    if (e.kind === 'tool_result' && e.toolResults) {
                        for (const r of e.toolResults) {
                            if (r.callId) toolResultsByCallId[r.callId] = r;
                        }
                    }
                }

                for (const e of filtered) {
                    if (e.kind === 'message') {
                        const role = e.role || 'user';
                        const roleLabel = { user: 'USER', assistant: 'ASSISTANT', system: 'SYSTEM', developer: 'DEVELOPER' }[role] || role.toUpperCase();
                        let body = '';
                        if (role === 'user' && e.content && e.content.includes('<system-reminder')) {
                            // 折叠 system-reminder
                            const cleaned = e.content.replace(/<system-reminder[\s\S]*?<\/system-reminder>/g, '').trim();
                            const reminders = (e.content.match(/<system-reminder[\s\S]*?<\/system-reminder>/g) || []);
                            if (reminders.length) {
                                body += `<div class="collapsible" onclick="this.classList.toggle('open')">
            <div class="col-header"><span class="arrow">▸</span>system-reminder × ${reminders.length}</div>
            <div class="col-body"><pre>${escapeHtml(reminders.join('\n\n'))}</pre></div>
          </div>`;
                            }
                            if (cleaned) body += renderMarkdown(cleaned);
                        } else {
                            body = renderMarkdown(e.content || '(空)');
                        }
                        // assistant 附带 tool calls
                        if (e.toolCalls && e.toolCalls.length) {
                            for (const tc of e.toolCalls) {
                                body += renderToolCard(tc, toolResultsByCallId[tc.id]);
                            }
                        }
                        const metaBits = [];
                        if (e.meta?.model) metaBits.push(`<span style="color:var(--magenta)">${escapeHtml(e.meta.model)}</span>`);
                        if (e.meta?.durationMs) metaBits.push(`<span class="tc-dur">${e.meta.durationMs}ms</span>`);
                        if (e.meta?.usage) {
                            const u = e.meta.usage;
                            metaBits.push(`<span class="tc-tokens">↑${u.inputTokens || 0} ↓${u.outputTokens || 0}</span>`);
                        }
                        html += `<div class="msg ${role}">
        <div class="msg-header"><span class="role-tag ${role}">${roleLabel}</span>${metaBits.join('')}<span>${fmtTime(e.ts)}</span></div>
        <div class="bubble">${body}</div>
      </div>`;
                    } else if (e.kind === 'tool_call') {
                        // 单独的 tool_call (workbuddy 风格)
                        if (e.reasoning) {
                            html += renderReasoningBlock(e.reasoning, e.ts);
                        }
                        if (e.toolCalls) {
                            for (const tc of e.toolCalls) {
                                html += `<div class="msg assistant"><div class="msg-header"><span class="role-tag assistant">TOOL CALL</span><span>${fmtTime(e.ts)}</span></div><div class="bubble">${renderToolCard(tc, toolResultsByCallId[tc.id])}</div></div>`;
                            }
                        }
                    } else if (e.kind === 'tool_result') {
                        // 已在 tool_card 内显示, 这里跳过避免重复 (除非没配对)
                        if (e.toolResults) {
                            for (const r of e.toolResults) {
                                if (!r.callId || !toolResultsByCallId[r.callId] || toolResultsByCallId[r.callId] === r) {
                                    // 配对的已在卡片显示; 未配对的单独显示
                                    if (!r.callId) {
                                        html += `<div class="msg assistant"><div class="msg-header"><span class="role-tag assistant">TOOL RESULT</span><span>${fmtTime(e.ts)}</span></div><div class="bubble">${renderToolCard(null, r)}</div></div>`;
                                    }
                                }
                            }
                        }
                    } else if (e.kind === 'reasoning') {
                        html += renderReasoningBlock(e.content, e.ts);
                    } else if (e.kind === 'turn_marker') {
                        html += `<div style="text-align:center;color:var(--text-dim);font-size:11px;padding:10px;margin:6px 0;border-top:1px dashed var(--border);">─ ${escapeHtml(e.content || 'turn')} ─</div>`;
                    } else if (e.kind === 'file_snapshot') {
                        const files = e.meta?.files || {};
                        const fileList = Object.keys(files);
                        html += `<div class="msg assistant"><div class="msg-header"><span class="role-tag assistant">📁 FILE SNAPSHOT</span><span>${fmtTime(e.ts)}</span></div><div class="bubble">
        <div class="collapsible" onclick="this.classList.toggle('open')">
          <div class="col-header"><span class="arrow">▸</span>文件快照 (${fileList.length} 文件)</div>
          <div class="col-body"><pre>${escapeHtml(fileList.join('\n'))}</pre></div>
        </div></div></div>`;
                    } else if (e.kind === 'meta_event') {
                        html += `<div style="color:var(--text-dim);font-size:11px;padding:2px 6px;">ℹ️ ${escapeHtml(e.content || '')}</div>`;
                    }
                }

                if (!html) html = `<div class="placeholder"><div class="big">🔍</div>没有匹配的消息</div>`;
                container.innerHTML = html;
            }

            function renderToolCard(tc, result) {
                const name = tc?.name || result?.toolName || 'tool';
                let header = `<div class="tc-header" onclick="this.parentElement.classList.toggle('open')">
    <span class="tc-icon">🔧</span><span class="tc-name">${escapeHtml(name)}</span>`;
                if (result) {
                    const cls = result.isError ? 'err' : 'ok';
                    const label = result.isError ? 'ERROR' : (result.status || 'OK');
                    header += `<span class="tc-status ${cls}">${escapeHtml(String(label))}</span>`;
                }
                header += `</div>`;
                let body = '';
                if (tc) {
                    body += `<div class="tc-section"><div class="tc-label">输入参数</div><div class="tc-args lang-json">${escapeHtml(prettyJson(tc.input || {}))}</div></div>`;
                }
                if (result) {
                    body += `<div class="tc-section"><div class="tc-label">输出</div><div class="tc-output">${escapeHtml(truncateOutput(result.output))}</div></div>`;
                }
                return `<div class="tool-card">${header}<div class="tc-body">${body}</div></div>`;
            }
            function truncateOutput(out) {
                if (!out) return '(空)';
                out = String(out);
                return out; // 完整显示, 由 CSS max-height 滚动
            }

            function renderReasoningBlock(text, ts) {
                if (!text) return '';
                return `<div class="reasoning-block" onclick="this.classList.toggle('open')">
    <div class="rb-header"><span class="arrow">▸</span>🧠 推理过程</div>
    <div class="rb-body">${escapeHtml(text)}</div>
  </div>`;
            }

            /* ---------- 调用轨迹视图 ---------- */
            let traceFilters = { message: true, tool_call: true, tool_result: true, reasoning: true, turn_marker: true, file_snapshot: true, meta_event: false };

            function renderTrace() {
                const container = document.getElementById('tab-trace');
                const sess = getActiveSession();
                if (!sess) {
                    container.innerHTML = `<div class="placeholder"><div class="big">📊</div>选择左侧会话查看调用轨迹</div>`;
                    return;
                }
                if (sess.session.source === 'zcode-log') {
                    container.innerHTML = `<div class="placeholder"><div class="big">📡</div>这是遥测日志,请切换到「遥测」标签</div>`;
                    return;
                }
                const evs = sess.session.events || [];

                let filtersHtml = '<div class="trace-filters"><span style="color:var(--text-dim);font-size:11px;">筛选:</span>';
                const filterDefs = [
                    ['message', '💬 消息'],
                    ['tool_call', '🔧 工具调用'],
                    ['tool_result', '📤 工具结果'],
                    ['reasoning', '🧠 推理'],
                    ['turn_marker', '↳ Turn'],
                    ['file_snapshot', '📁 快照'],
                    ['meta_event', 'ℹ️ 元事件']
                ];
                for (const [k, label] of filterDefs) {
                    const active = traceFilters[k] ? 'active' : '';
                    filtersHtml += `<span class="filter-chip ${active}" onclick="toggleTraceFilter('${k}')">${label}</span>`;
                }
                filtersHtml += '</div>';

                let html = filtersHtml + '<div class="trace-list">';
                const icons = {
                    message: '💬', tool_call: '🔧', tool_result: '📤', reasoning: '🧠',
                    turn_marker: '↳', file_snapshot: '📁', meta_event: 'ℹ️'
                };
                for (const e of evs) {
                    if (!traceFilters[e.kind]) continue;
                    const icon = icons[e.kind] || '•';
                    let summary = '';
                    let roleClass = '';
                    if (e.kind === 'message') {
                        roleClass = `tc-role ${e.role || ''}`;
                        summary = `<span class="${roleClass}">[${escapeHtml((e.role || '').toUpperCase())}]</span> ${escapeHtml(truncate(e.content, 120))}`;
                    } else if (e.kind === 'tool_call' && e.toolCalls) {
                        summary = e.toolCalls.map(tc => `<span class="tc-tool">${escapeHtml(tc.name)}</span> ${escapeHtml(truncate(JSON.stringify(tc.input), 100))}`).join('<br>');
                    } else if (e.kind === 'tool_result' && e.toolResults) {
                        summary = e.toolResults.map(r => `<span class="tc-tool">${escapeHtml(r.toolName || r.callId || '')}</span> → <span class="tc-summary">${escapeHtml(truncate(r.output, 100))}</span> ${r.isError ? '<span style="color:var(--red)">ERR</span>' : ''}`).join('<br>');
                    } else if (e.kind === 'reasoning') {
