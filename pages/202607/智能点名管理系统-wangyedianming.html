                    '2025/9/8': '出勤',
                    '2025/9/9': '出勤',
                    '2025/9/10': '出勤'
                }
            ];
            
            const csv = Papa.unparse(attendanceData);
            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '考勤数据示例.csv';
            link.click();
            URL.revokeObjectURL(link.href);
            
            console.log('✅ 考勤数据示例下载完成');
        }
        
        // 启动应用
        let app;
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🚀 开始启动系统...');
            
            try {
                // 获取设置（如果已存在）
                const settings = JSON.parse(localStorage.getItem('settings') || '{}');
                const showSplash = settings.ui?.showSplash !== false; // 默认显示封面
                
                // 检查是否为首次访问
                const firstVisit = localStorage.getItem('firstVisit');
                if (!firstVisit) {
                    console.log('🎉 首次访问，显示封面页面');
                    // 首次访问显示封面
                    localStorage.setItem('firstVisit', new Date().toISOString());
                } else {
                    console.log('📅 欢迎回来，上次访问:', firstVisit);
                }
                
                // 根据设置决定是否显示封面
                if (!showSplash) {
                    console.log('⚙️ 设置中关闭了封面，直接进入应用');
                    setTimeout(() => {
                        startApp();
                    }, 100);
                }
                
                // 初始化应用（后台运行）
                app = new RollCallApp();
                await app.init(); // 确保完全初始化
                window.app = app; // 全局访问
                
                // 更新访问时间
                localStorage.setItem('lastVisit', new Date().toISOString());
                
                console.log('✅ 系统启动完成，可以使用了');
                
                // 如果封面被跳过，确保应用界面可见
                const splashScreen = document.getElementById('splash-screen');
                if (splashScreen && splashScreen.style.display === 'none') {
                    document.getElementById('app-container').classList.add('active');
                }
                
            } catch (error) {
                console.error('❌ 系统启动失败:', error);
                alert('系统启动失败，请刷新页面重试');
            }
        });
        
        console.log('🎉 点名系统开发完成！');
        
        // 显示当前时间
        
        // ========== 测试套件 ==========
        class SystemTestSuite {
            constructor() {
                this.testResults = [];
                this.testStartTime = Date.now();
            }
            
            // 运行所有测试
            async runAllTests() {
                console.log('🧪 开始系统测试...');
                
                try {
                    // 等待应用初始化完成
                    await this.waitForAppInit();
                    
                    // 执行各项测试
                    await this.testLocalStorage();
                    await this.testDataManager();
                    await this.testStudentManager();
                    await this.testRollCallManager();
                    await this.testStatisticsManager();
                    await this.testUIComponents();
                    await this.testPerformance();
                    
                    this.generateTestReport();
                } catch (error) {
                    console.error('❌ 测试过程中发生错误:', error);
                }
            }
            
            // 等待应用初始化
            async waitForAppInit() {
                return new Promise((resolve) => {
                    const checkInterval = setInterval(() => {
                        if (window.app && window.app.isInitialized) {
                            clearInterval(checkInterval);
                            resolve();
                        }
                    }, 100);
                    
                    // 10秒超时
                    setTimeout(() => {
                        clearInterval(checkInterval);
                        console.warn('⚠️ 应用初始化超时，继续测试...');
                        resolve();
                    }, 10000);
                });
            }
            
            // 测试本地存储
            async testLocalStorage() {
                console.log('📦 测试本地存储...');
                const testName = '本地存储功能';
                
                try {
                    // 测试基本存储操作
                    const testData = { test: 'value', timestamp: Date.now() };
                    localStorage.setItem('test_key', JSON.stringify(testData));
                    const retrieved = JSON.parse(localStorage.getItem('test_key'));
                    
                    if (retrieved.test === 'value') {
                        this.addTestResult(testName, '✅ 通过', '基本存储功能正常');
                    } else {
                        this.addTestResult(testName, '❌ 失败', '数据存储/读取失败');
                    }
                    
                    // 清理测试数据
                    localStorage.removeItem('test_key');
                    
                } catch (error) {
                    this.addTestResult(testName, '❌ 失败', error.message);
                }
            }
            
            // 测试数据管理器
            async testDataManager() {
                console.log('📊 测试数据管理器...');
                const testName = '数据管理器';
                
                try {
                    if (!window.app || !window.app.dataManager) {
                        this.addTestResult(testName, '❌ 失败', '数据管理器未初始化');
                        return;
                    }
                    
                    const dm = window.app.dataManager;
                    
                    // 测试数据验证
                    const testStudent = {
                        name: '测试学员',
                        studentId: 'TEST001',
                        class: '测试班级'
                    };
                    
                    const validated = dm.validateData([testStudent]);
                    if (validated.length > 0 && validated[0].name === '测试学员') {
                        this.addTestResult(testName, '✅ 通过', '数据验证功能正常');
                    } else {
                        this.addTestResult(testName, '❌ 失败', '数据验证功能异常');
                    }
                    
                } catch (error) {
                    this.addTestResult(testName, '❌ 失败', error.message);
                }
            }
            
            // 测试学员管理器
            async testStudentManager() {
                console.log('👥 测试学员管理器...');
                const testName = '学员管理器';
                
                try {
                    if (!window.app || !window.app.studentManager) {
                        this.addTestResult(testName, '❌ 失败', '学员管理器未初始化');
                        return;
                    }
                    
                    const sm = window.app.studentManager;
                    
                    // 测试添加学员
                    const testStudent = {
                        id: sm.generateId(),
                        name: '测试学员',
                        studentId: 'TEST001',
                        class: '测试班级',
                        phone: '13800138000',
                        email: 'test@example.com',
                        remarks: '测试备注',
                        createTime: new Date().toISOString(),
                        updateTime: new Date().toISOString()
                    };
                    
                    await sm.addStudent(testStudent);
                    
                    // 验证学员是否添加成功
                    const students = sm.getStudents();
                    const found = students.find(s => s.id === testStudent.id);
                    
                    if (found && found.name === '测试学员') {
                        this.addTestResult(testName, '✅ 通过', '学员添加功能正常');
                        
                        // 测试删除学员
                        await sm.deleteStudent(testStudent.id);
                        const afterDelete = sm.getStudents();
                        if (!afterDelete.find(s => s.id === testStudent.id)) {
                            this.addTestResult(testName + ' - 删除', '✅ 通过', '学员删除功能正常');
                        } else {
                            this.addTestResult(testName + ' - 删除', '❌ 失败', '学员删除功能异常');
                        }
                    } else {
                        this.addTestResult(testName, '❌ 失败', '学员添加功能异常');
                    }
                    
                } catch (error) {
                    this.addTestResult(testName, '❌ 失败', error.message);
                }
            }
            
            // 测试点名管理器
            async testRollCallManager() {
                console.log('🎯 测试点名管理器...');
                const testName = '点名管理器';
                
                try {
                    if (!window.app || !window.app.rollCallManager) {
                        this.addTestResult(testName, '❌ 失败', '点名管理器未初始化');
                        return;
                    }
                    
                    const rcm = window.app.rollCallManager;
                    
                    // 测试创建点名会话
                    const sessionId = rcm.createSession('测试会话', '测试班级');
                    
                    if (sessionId && rcm.getCurrentSession()) {
                        this.addTestResult(testName, '✅ 通过', '点名会话创建正常');
                        
                        // 测试结束会话
                        rcm.endSession();
                        if (!rcm.getCurrentSession()) {
                            this.addTestResult(testName + ' - 会话管理', '✅ 通过', '点名会话管理正常');
                        } else {
                            this.addTestResult(testName + ' - 会话管理', '❌ 失败', '点名会话管理异常');
                        }
                    } else {
                        this.addTestResult(testName, '❌ 失败', '点名会话创建异常');
                    }
                    
                } catch (error) {
                    this.addTestResult(testName, '❌ 失败', error.message);
                }
            }
            
            // 测试统计管理器
            async testStatisticsManager() {
                console.log('📈 测试统计管理器...');
                const testName = '统计管理器';
                
                try {
                    if (!window.app || !window.app.statisticsManager) {
                        this.addTestResult(testName, '❌ 失败', '统计管理器未初始化');
                        return;
                    }
                    
                    const sm = window.app.statisticsManager;
                    
                    // 测试获取基本统计
                    const stats = sm.getBasicStatistics();
                    
                    if (stats && typeof stats === 'object') {
                        this.addTestResult(testName, '✅ 通过', '基本统计功能正常');
                    } else {
                        this.addTestResult(testName, '❌ 失败', '基本统计功能异常');
                    }
                    
                } catch (error) {
                    this.addTestResult(testName, '❌ 失败', error.message);
                }
            }
            
            // 测试UI组件
            async testUIComponents() {
                console.log('🎨 测试UI组件...');
                const testName = 'UI组件';
                
                try {
                    if (!window.app) {
                        this.addTestResult(testName, '❌ 失败', '应用未初始化');
                        return;
                    }
                    
                    // 检查主要UI元素是否存在
                    const requiredElements = [
                        'students',
                        'rollcall', 
                        'statistics'
                    ];
                    
                    let allExist = true;
                    requiredElements.forEach(elementId => {
                        const element = document.getElementById(elementId);
                        if (!element) {
                            allExist = false;
                            this.addTestResult(testName + ' - ' + elementId, '❌ 失败', 'UI元素不存在');
                        }
                    });
                    
                    if (allExist) {
                        this.addTestResult(testName, '✅ 通过', '主要UI组件存在');
                    }
                    
                } catch (error) {
                    this.addTestResult(testName, '❌ 失败', error.message);
                }
            }
            
            // 测试性能
            async testPerformance() {
                console.log('⚡ 测试性能...');
                const testName = '性能测试';
                
                try {
                    // 测试大量数据处理
                    const startTime = Date.now();
                    
                    // 生成测试数据
                    const testStudents = [];
                    for (let i = 0; i < 1000; i++) {
                        testStudents.push({
                            id: 'test_' + i,
                            name: '测试学员' + i,
                            studentId: 'TEST' + i.toString().padStart(3, '0'),
                            class: '测试班级',
                            createTime: new Date().toISOString(),
                            updateTime: new Date().toISOString()
                        });
                    }
                    
                    // 测试数据处理性能
                    if (window.app && window.app.studentManager) {
                        for (const student of testStudents) {
                            await window.app.studentManager.addStudent(student);
                        }
                        
                        const endTime = Date.now();
                        const duration = endTime - startTime;
                        
                        if (duration < 5000) { // 5秒内完成
                            this.addTestResult(testName, '✅ 通过', `处理1000条数据耗时${duration}ms`);
                        } else {
                            this.addTestResult(testName, '⚠️ 警告', `处理1000条数据耗时${duration}ms，性能有待优化`);
                        }
                        
                        // 清理测试数据
                        for (const student of testStudents) {
                            await window.app.studentManager.deleteStudent(student.id);
                        }
                    } else {
                        this.addTestResult(testName, '❌ 失败', '学员管理器未初始化');
                    }
                    
                } catch (error) {
                    this.addTestResult(testName, '❌ 失败', error.message);
                }
            }
            
            // 添加测试结果
            addTestResult(testName, status, message) {
                this.testResults.push({
                    name: testName,
                    status: status,
                    message: message,
                    timestamp: new Date().toISOString()
                });
                
                console.log(`${status} ${testName}: ${message}`);
            }
            
            // 生成测试报告
            generateTestReport() {
                const totalTests = this.testResults.length;
                const passedTests = this.testResults.filter(r => r.status.includes('✅')).length;
                const failedTests = this.testResults.filter(r => r.status.includes('❌')).length;
                const warningTests = this.testResults.filter(r => r.status.includes('⚠️')).length;
                
                const passRate = totalTests > 0 ? ((passedTests / totalTests) * 100).toFixed(2) : 0;
                
                console.log('\n🧪 测试报告');
                console.log('='.repeat(50));
                console.log(`总测试数: ${totalTests}`);
                console.log(`通过: ${passedTests}`);
                console.log(`失败: ${failedTests}`);
                console.log(`警告: ${warningTests}`);
                console.log(`通过率: ${passRate}%`);
                console.log('='.repeat(50));
                
                // 显示详细结果
                this.testResults.forEach(result => {
                    console.log(`${result.status} ${result.name}: ${result.message}`);
                });
                
                // 保存测试报告
                const report = {
                    testTime: new Date().toISOString(),
                    duration: Date.now() - this.testStartTime,
                    totalTests,
                    passedTests,
                    failedTests,
                    warningTests,
                    passRate,
                    details: this.testResults
                };
                
                localStorage.setItem('system_test_report', JSON.stringify(report));
                console.log('\n📄 测试报告已保存到本地存储');
                
                return report;
            }
        }
        
        // 自动运行测试
        setTimeout(() => {
            const testSuite = new SystemTestSuite();
            testSuite.runAllTests();
        }, 2000);
        
        // 兼容性检查
        function checkCompatibility() {
            const checks = {
                localStorage: typeof(Storage) !== "undefined",
                fileReader: typeof(FileReader) !== "undefined",
                blob: typeof(Blob) !== "undefined",
                promise: typeof(Promise) !== "undefined",
                arrowFunction: (() => {}).toString().includes('=>'),
                templateLiteral: `test`.includes('test'),
                fetch: typeof(fetch) !== "undefined",
               classList: 'classList' in document.createElement('div')
            };
            
            const supported = Object.values(checks).filter(v => v).length;
            const total = Object.keys(checks).length;
            const supportRate = (supported / total * 100).toFixed(2);
            
            console.log('🔍 浏览器兼容性检查');
            console.log('='.repeat(30));
            Object.entries(checks).forEach(([feature, supported]) => {
                console.log(`${supported ? '✅' : '❌'} ${feature}: ${supported ? '支持' : '不支持'}`);
            });
            console.log(`兼容性: ${supportRate}% (${supported}/${total})`);
            
            if (supportRate < 100) {
                console.warn('⚠️ 浏览器兼容性不足，某些功能可能无法正常工作');
            }
            
            return checks;
        }
        
        // 运行兼容性检查
        checkCompatibility();
        
        console.log('🎯 系统测试套件已加载');
    </script>
</body>
