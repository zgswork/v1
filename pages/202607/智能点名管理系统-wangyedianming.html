            renderIdleContent() {
                const students = this.app.storageManager.getStudents();
                const classes = [...new Set(students.map(s => s.class))];
                
                return `
                    <div class="rollcall-idle">
                        <div class="idle-content">
                            <div class="idle-icon">🎯</div>
                            <h3>准备开始点名</h3>
                            <p>请选择班级和点名模式，然后点击"开始点名"按钮</p>
                            
                            <div class="quick-stats">
                                <div class="stat-item">
                                    <div class="stat-value">${students.length}</div>
                                    <div class="stat-label">总学员数</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-value">${classes.length}</div>
                                    <div class="stat-label">班级数</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-value">${this.app.storageManager.getAttendance().length}</div>
                                    <div class="stat-label">考勤记录</div>
                                </div>
                            </div>
                            
                            <div class="recent-sessions">
                                <h4>📋 最近的点名会话</h4>
                                <div class="session-list">
                                    ${this.getRecentSessions().map(session => 
                                        `<div class="session-item">
                                            <div class="session-info">
                                                <div class="session-time">${new Date(session.startTime).toLocaleString('zh-CN')}</div>
                                                <div class="session-mode">${this.getModeText(session.mode)}</div>
                                            </div>
                                            <div class="session-stats">
                                                <span>${session.students?.length || 0}人</span>
                                                <span>${session.attendanceRecords?.length || 0}记录</span>
                                            </div>
                                        </div>`
                                    ).join('') || '<div class="empty-sessions">暂无历史会话</div>'}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            bindEvents() {
                // 班级选择
                const classSelect = this.container.querySelector('#rollcall-class');
                if (classSelect) {
                    classSelect.addEventListener('change', (e) => {
                        this.currentClass = e.target.value;
                    });
                }
                
                // 模式选择
                this.container.querySelectorAll('.mode-btn').forEach(btn => {
                    console.log('🔗 找到模式按钮:', btn, '模式:', btn.dataset.mode);
                    btn.addEventListener('click', (e) => {
                        console.log('🎯 模式按钮被点击:', e.target.dataset.mode);
                        if (e.target.disabled) {
                            console.log('❌ 按钮已禁用');
                            return;
                        }
                        this.currentMode = e.target.dataset.mode;
                        console.log('✅ 当前模式设置为:', this.currentMode);
                        this.updateModeButtons();
                    });
                });
                
                // 开始/结束点名
                const startBtn = this.container.querySelector('#start-rollcall');
                if (startBtn) {
                    console.log('🔗 找到开始点名按钮:', startBtn);
                    startBtn.addEventListener('click', () => {
                        console.log('🚀 开始点名按钮被点击');
                        this.startRollCall();
                    });
                } else {
                    console.error('❌ 未找到开始点名按钮');
                }
                
                const stopBtn = this.container.querySelector('#stop-rollcall');
                if (stopBtn) {
                    stopBtn.addEventListener('click', () => {
                        this.stopRollCall();
                    });
                }
                
                const pauseBtn = this.container.querySelector('#pause-rollcall');
                if (pauseBtn) {
                    pauseBtn.addEventListener('click', () => {
                        this.pauseRollCall();
                    });
                }
                
                // 考勤状态按钮（随机点名模式）
                this.container.querySelectorAll('.attendance-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const status = e.target.dataset.status;
                        this.recordAttendance(status);
                    });
                });
                
                // 下一位学员（随机点名模式）
                const nextBtn = this.container.querySelector('#next-student');
                if (nextBtn) {
                    nextBtn.addEventListener('click', () => {
                        this.nextStudent();
                    });
                }
                // 顶部“下一位”（随机点名模式，增强可见性）
                const nextTopBtn = this.container.querySelector('#next-student-top');
                if (nextTopBtn) {
                    nextTopBtn.addEventListener('click', () => {
                        this.nextStudent();
                    });
                }
                
                // 跳过学员（随机点名模式）
                const skipBtn = this.container.querySelector('#skip-student');
                if (skipBtn) {
                    skipBtn.addEventListener('click', () => {
                        this.skipStudent();
                    });
                }
                
                // 撤销考勤（随机点名模式）
                const undoBtn = this.container.querySelector('#undo-attendance');
                if (undoBtn) {
                    undoBtn.addEventListener('click', () => {
                        this.undoAttendance();
                    });
                }
                
                // 顺序点名的"下一位"按钮
                const nextSequentialBtn = this.container.querySelector('#next-sequential');
                if (nextSequentialBtn) {
                    nextSequentialBtn.addEventListener('click', () => {
                        this.nextSequentialStudent();
                    });
                }
                
                // 手动点名的"全部出勤"按钮
                const markAllPresentBtn = this.container.querySelector('#mark-all-present');
                if (markAllPresentBtn) {
                    markAllPresentBtn.addEventListener('click', () => {
                        this.markAllPresent();
                    });
                }
                
                // 学生卡片上的考勤按钮
                this.container.querySelectorAll('.attendance-btn-small').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const studentId = e.target.dataset.studentId;
                        const status = e.target.dataset.status;
                        this.recordStudentAttendance(studentId, status);
                    });
                });
                
                // 键盘快捷键
                document.addEventListener('keydown', (e) => {
                    if (!this.isRollCalling) return;
                    
                    const session = this.app.rollCallManager.getCurrentSession();
                    if (!session) return;
                    
                    // 随机点名模式的快捷键
                    if (session.mode === 'random' && this.currentStudent) {
                        switch(e.key) {
                            case '1':
                                this.recordAttendance('present');
                                break;
                            case '2':
                                this.recordAttendance('absent');
                                break;
                            case '3':
                                this.recordAttendance('late');
                                break;
                            case '4':
                                this.recordAttendance('leave');
                                break;
                            case ' ':
                                e.preventDefault();
                                this.nextStudent();
                                break;
                        }
                    }
                    
                    // 顺序点名模式的快捷键
                    if (session.mode === 'sequential') {
                        switch(e.key) {
                            case ' ':
                                e.preventDefault();
                                this.nextSequentialStudent();
                                break;
                        }
                    }
                    
                    // 通用快捷键
                    switch(e.key) {
                        case 'Escape':
                            this.stopRollCall();
                            break;
                    }
                });
            }
            
            updateModeButtons() {
                console.log('🔄 更新模式按钮，当前模式:', this.currentMode);
                this.container.querySelectorAll('.mode-btn').forEach(btn => {
                    const shouldBeActive = btn.dataset.mode === this.currentMode;
                    console.log(`按钮 ${btn.dataset.mode} 应该${shouldBeActive ? '激活' : '未激活'}`);
                    btn.classList.toggle('active', shouldBeActive);
                });
            }
            
            async startRollCall() {
                try {
                    const students = this.getFilteredStudentsFromStorage();
                    if (students.length === 0) {
                        this.showToast('❌ 没有找到学员数据', 'error');
                        return;
                    }
                    
                    console.log('🚀 开始点名:', {
                        mode: this.currentMode,
                        className: this.currentClass,
                        studentsCount: students.length
                    });
                    
                    await this.app.rollCallManager.startRollCall(this.currentMode, {
                        classFilter: this.currentClass,
                        students: students
                    });
                    
                    this.isRollCalling = true;
                    this.currentStudent = null;
                    this.render();
                    this.bindEvents();
                    
                    this.showToast('🚀 点名已开始', 'success');
                } catch (error) {
                    this.showToast(`❌ 开始点名失败：${error.message}`, 'error');
                }
            }
            
            async stopRollCall() {
                try {
                    const summary = await this.app.rollCallManager.endRollCall();
                    
                    this.isRollCalling = false;
                    this.currentStudent = null;
                    this.render();
                    this.bindEvents();
                    
                    this.showSessionSummary(summary);
                    
                    // 刷新统计数据
                    if (this.app.statisticsManager) {
                        this.app.statisticsManager.clearCache();
                    }
                    
                    // 如果当前在统计页面，刷新统计数据
                    const statsSection = document.getElementById('statistics');
                    if (statsSection && statsSection.classList.contains('active')) {
                        this.app.loadStatisticsData();
                    }
                    
                    this.showToast('⏹️ 点名已结束', 'success');
                } catch (error) {
                    this.showToast(`❌ 结束点名失败：${error.message}`, 'error');
                }
            }
            
            pauseRollCall() {
                // 暂停功能实现
                this.showToast('⏸️ 点名已暂停', 'info');
            }
            
            nextStudent() {
                try {
                    const student = this.app.rollCallManager.getNextStudent();
                    if (student) {
                        this.currentStudent = student;
                        this.render();
                        this.bindEvents();
                        
                        // 播放提示音（可选）
                        this.playNotificationSound();
                    } else {
                        this.showToast('🎉 所有学员已点名完毕', 'success');
                        this.stopRollCall();
                    }
                } catch (error) {
                    this.showToast(`❌ 获取下一位学员失败：${error.message}`, 'error');
                }
            }
            
            skipStudent() {
                if (this.currentStudent) {
                    this.app.rollCallManager.skipStudent(this.currentStudent.id);
                    this.currentStudent = null;
                    this.render();
                    this.bindEvents();
                    
                    this.showToast('⏭️ 已跳过当前学员', 'info');
                }
            }
            
            recordAttendance(status) {
                if (!this.currentStudent) return;
                
                try {
                    this.app.rollCallManager.recordAttendance(
                        this.currentStudent.id, 
                        status, 
                        '' // 可以添加备注
                    );
                    
                    this.currentStudent = null;
                    this.render();
                    this.bindEvents();
                    
                    this.showToast(`✅ 已记录为${this.getStatusText(status)}`, 'success');
                    
                    // 自动进入下一位（遵循设置）
                    const settings = this.app.storageManager.getSettings?.() || {};
                    const autoNext = settings.rollCall?.autoNext === true;
                    const delay = Number.isFinite(settings.rollCall?.autoNextDelay) ? (settings.rollCall.autoNextDelay * 1000) : 1000;
                    if (autoNext) {
                        setTimeout(() => {
                            this.nextStudent();
                        }, Math.max(0, delay));
                    }
                } catch (error) {
                    this.showToast(`❌ 记录考勤失败：${error.message}`, 'error');
                }
            }
            
            // 顺序点名的下一位学员
            nextSequentialStudent() {
                try {
                    const student = this.app.rollCallManager.getNextStudent();
                    if (student) {
                        this.currentStudent = student;
                        this.render();
                        this.bindEvents();
                        
                        // 高亮显示当前学员
                        this.highlightCurrentStudent();
                        
                        this.showToast(`🎯 当前学员：${student.name}`, 'info');
                    } else {
                        this.showToast('🎉 所有学员已点名完毕', 'success');
                        this.stopRollCall();
                    }
                } catch (error) {
                    this.showToast(`❌ 获取下一位学员失败：${error.message}`, 'error');
                }
            }
            
            // 手动点名的学生考勤记录
            recordStudentAttendance(studentId, status) {
                try {
                    const session = this.app.rollCallManager.getCurrentSession();
                    if (!session) {
                        throw new Error('请先开始点名会话');
                    }
                    
                    // 记录考勤状态
                    this.app.rollCallManager.recordAttendance(studentId, status, '');
                    
                    // 检查学员是否已在已点名列表中，如果不在则添加
                    const isAlreadyCalled = session.calledStudents.some(s => s.id === studentId);
                    if (!isAlreadyCalled) {
                        const student = session.students.find(s => s.id === studentId);
                        if (student) {
                            session.calledStudents.push(student);
                            console.log(`📝 学员 ${student.name} 已添加到已点名列表`);
                        }
                    }
                    
                    // 保存会话状态
                    this.app.rollCallManager.saveSession();
                    
                    // 重新渲染界面
                    this.render();
                    this.bindEvents();
                    
                    const student = this.app.storageManager.getStudents().find(s => s.id === studentId);
                    const studentName = student ? student.name : '学员';
                    this.showToast(`✅ ${studentName} 已记录为${this.getStatusText(status)}`, 'success');
                } catch (error) {
                    this.showToast(`❌ 记录考勤失败：${error.message}`, 'error');
                }
            }
            
            // 从存储获取最新学员并按当前班级筛选
            getFilteredStudentsFromStorage() {
                let students = [];
                try {
                    students = (this.app?.storageManager?.getStudents?.() || []).slice();
                } catch (e) {
                    students = [];
                }
                if (this.currentClass) {
                    students = students.filter(s => s.class === this.currentClass);
                }
                return students;
            }

            // 手动点名模式：全部标记为出勤
            markAllPresent() {
                try {
                    const session = this.app.rollCallManager.getCurrentSession();
                    if (!session) return;
                    
                    let markedCount = 0;
                    session.students.forEach(student => {
                        // 只为还没有考勤记录的学员标记出勤
                        if (!session.attendanceRecords.find(r => r.studentId === student.id)) {
                            this.app.rollCallManager.recordAttendance(student.id, 'present', '');
                            markedCount++;
                        }
                    });
                    
                    this.render();
                    this.bindEvents();
                    
                    this.showToast(`✅ 已将${markedCount}名学员标记为出勤`, 'success');
                } catch (error) {
                    this.showToast(`❌ 批量标记出勤失败：${error.message}`, 'error');
                }
            }
            
            // 高亮显示当前学员（顺序点名模式）
            highlightCurrentStudent() {
                // 移除所有高亮
                this.container.querySelectorAll('.student-card').forEach(card => {
                    card.classList.remove('current');
                });
                
                // 添加当前学员高亮
                if (this.currentStudent) {
                    const currentCard = this.container.querySelector(`[data-student-id="${this.currentStudent.id}"]`);
                    if (currentCard) {
                        currentCard.classList.add('current');
                        currentCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
            }
            
            undoAttendance() {
                if (!this.currentStudent) return;
                
                try {
                    this.app.rollCallManager.undoAttendance(this.currentStudent.id);
                    this.showToast('↩️ 已撤销考勤记录', 'success');
                } catch (error) {
                    this.showToast(`❌ 撤销失败：${error.message}`, 'error');
                }
            }
            
            getFilteredStudents() {
                let students = this.studentManager.students;
                console.log('📋 所有学员数据:', students);
                
                if (this.currentClass) {
                    students = students.filter(s => s.class === this.currentClass);
                    console.log(`📋 班级"${this.currentClass}"学员:`, students);
                }
                
                console.log('📋 最终筛选结果:', students);
                return students;
            }
            
            calculateProgress(session) {
                const total = session.students?.length || 0;
                const called = session.calledStudents?.length || 0;
                const percentage = total > 0 ? Math.round(called / total * 100) : 0;
                
                return { total, called, percentage, remaining: total - called };
            }
            
            getAttendanceRate(session) {
                const total = session.attendanceRecords.length;
                if (total === 0) return 0;
                
                const present = session.attendanceRecords.filter(r => 
                    ['present', 'late', 'early'].includes(r.status)
                ).length;
                
                return Math.round(present / total * 100);
            }
            
            isAttendanceRecorded(studentId, session) {
                return session.attendanceRecords.some(r => r.studentId === studentId);
            }
            
            getRecentSessions() {
                return this.app.rollCallManager.getHistorySessions(5);
            }
            
            getModeText(mode) {
                const modeTexts = {
                    'random': '随机点名',
                    'sequential': '顺序点名',
                    'manual': '手动点名'
                };
                return modeTexts[mode] || mode;
            }
            
            getStatusIcon(status) {
                const icons = {
                    'present': '✅',
                    'absent': '❌',
                    'late': '⏰',
                    'leave': '📝',
                    'early': '🏃'
                };
                return icons[status] || '❓';
            }
            
            getStatusText(status) {
                const statusTexts = {
                    'present': '出勤',
                    'absent': '缺勤',
                    'late': '迟到',
                    'leave': '请假',
                    'early': '早退'

            formatDuration(seconds) {
                const minutes = Math.floor(seconds / 60);

            playNotificationSound() {
                // 创建音频上下文播放提示音
                try {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                    gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                    
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.1);
                } catch (error) {
                    // 忽略音频播放错误
                }
            }
            
            showToast(message, type = 'info') {
                const toast = document.createElement('div');
                toast.className = `toast toast-${type}`;
                toast.textContent = message;
                
                document.body.appendChild(toast);
                
                setTimeout(() => {
                    toast.classList.add('show');
                }, 100);
                
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }

                    // Ctrl/Cmd + O: 打开文件
                    if ((e.ctrlKey || e.metaKey) && e.key === 'o') {
                        e.preventDefault();

                    // F1: 帮助
                    if (e.key === 'F1') {
                        e.preventDefault();
                        this.navigationBar.showHelp();

                        e.preventDefault();

                });

                window.addEventListener('beforeunload', (e) => {
                    if (this.hasUnsavedChanges()) {
                        e.preventDefault();
                        e.returnValue = '';
                    }
                });
                
                // 在线/离线状态检测
                window.addEventListener('online', () => {
                    this.showToast('🌐 网络已连接', 'success');

            initSidebarControls() {
                const container = document.querySelector('.container');
                const sidebar = document.getElementById('sidebar');
                const toggleBtn = document.getElementById('toggle-sidebar');
                const resizer = document.getElementById('sidebar-resizer');

                if (!container || !sidebar || !toggleBtn || !resizer) return;

                // 读取保存的状态
                try {
                    const savedCollapsed = localStorage.getItem('ui_sidebar_collapsed');
                    const savedWidth = localStorage.getItem('ui_sidebar_width');
                    if (savedCollapsed !== null) this._sidebar.isCollapsed = savedCollapsed === '1';
                    if (savedWidth !== null) this._sidebar.width = Math.min(this._sidebar.max, Math.max(this._sidebar.min, parseInt(savedWidth, 10) || 250));
                } catch (e) {}

                // 应用状态
                this.applySidebarState();

                // 切换显示/隐藏
                toggleBtn.addEventListener('click', () => {
                    this._sidebar.isCollapsed = !this._sidebar.isCollapsed;
                    try { localStorage.setItem('ui_sidebar_collapsed', this._sidebar.isCollapsed ? '1' : '0'); } catch (e) {}
                    this.applySidebarState();
                });

                // 拖拽调整宽度
                let isDragging = false;
                let startX = 0;
                let startWidth = this._sidebar.width;

                const onMouseDown = (e) => {
                    if (this._sidebar.isCollapsed) return; // 折叠时不允许拖拽
                    isDragging = true;
                    startX = e.clientX;
                    startWidth = this._sidebar.width;
                    document.body.style.userSelect = 'none';
                    document.body.style.cursor = 'col-resize';
                };

                const onMouseMove = (e) => {
                    if (!isDragging) return;
                    const dx = e.clientX - startX;
                    const newWidth = Math.min(this._sidebar.max, Math.max(this._sidebar.min, startWidth + dx));
                    this._sidebar.width = newWidth;
                    this.applySidebarState(false);
                };

                const onMouseUp = () => {
                    if (!isDragging) return;
                    isDragging = false;
                    document.body.style.userSelect = '';
                    document.body.style.cursor = '';
                    try { localStorage.setItem('ui_sidebar_width', String(this._sidebar.width)); } catch (e) {}
                };

                resizer.addEventListener('mousedown', onMouseDown);
                window.addEventListener('mousemove', onMouseMove);
                window.addEventListener('mouseup', onMouseUp);
            }

            applySidebarState(animate = true) {
                const container = document.querySelector('.container');
                const sidebar = document.getElementById('sidebar');
                if (!container || !sidebar) return;

                if (this._sidebar.isCollapsed) {
                    container.classList.add('sidebar-collapsed');
                } else {
                    container.classList.remove('sidebar-collapsed');
                }

                // 设置宽度（未折叠时）
                if (!this._sidebar.isCollapsed) {
                    container.style.gridTemplateColumns = `${this._sidebar.width}px 1fr`;
                }

                // 控制拖拽手柄显示
                const resizer = document.getElementById('sidebar-resizer');
                if (resizer) {
                    resizer.style.display = this._sidebar.isCollapsed ? 'none' : 'block';
                }
            }
            
            bindStatisticsEvents() {
                const statisticsContainer = document.getElementById('statistics');
                if (!statisticsContainer) return;
                
                // 使用事件委托处理统计界面的所有点击事件
                statisticsContainer.addEventListener('click', (e) => {
                    const target = e.target;
                    
                    // 刷新数据按钮
                    if (target.id === 'refresh-stats' || target.closest('#refresh-stats')) {
                        e.preventDefault();
                        this.loadStatisticsData();
                        return;
                    }
                    
                    // 导出报告按钮
                    if (target.id === 'export-stats' || target.closest('#export-stats')) {
                        e.preventDefault();
                        this.exportStatisticsReport();
                        return;
                    }
                    
                    // 生成报告按钮
                    if (target.id === 'generate-report' || target.closest('#generate-report')) {
                        e.preventDefault();
                        this.generateStatisticsReport();
                        return;
                    }
                    
                    // 生成测试数据按钮
                    if (target.id === 'generate-test-data' || target.closest('#generate-test-data')) {
                        e.preventDefault();
                        this.generateTestData();
                        return;
                    }
                    
                    // 调试数据状态按钮
                    if (target.id === 'debug-data-status' || target.closest('#debug-data-status')) {
                        e.preventDefault();
                        this.debugDataStatus();
                        return;
                    }
                    
                    // 统计类型切换按钮
                    if (target.classList.contains('stats-type-btn') || target.closest('.stats-type-btn')) {
                        const btn = target.classList.contains('stats-type-btn') ? target : target.closest('.stats-type-btn');
                        e.preventDefault();
                        
                        // 更新激活状态
                        document.querySelectorAll('.stats-type-btn').forEach(b => 
                            b.classList.remove('active')
                        );
                        btn.classList.add('active');
                        
                        // 重新加载数据
                        this.loadStatisticsData();
                        return;
                    }
                    
                    // 查看班级详情按钮
                    if (target.classList.contains('btn-view-class') || target.closest('.btn-view-class')) {
                        const btn = target.classList.contains('btn-view-class') ? target : target.closest('.btn-view-class');
                        const className = btn.dataset.class;
                        if (className) {
                            document.querySelector('#stats-class').value = className;
                            this.loadStatisticsData();
                        }
                        return;
                    }
                    
                    // 查看学员详情按钮
                    if (target.classList.contains('btn-view-student') || target.closest('.btn-view-student')) {
                        const btn = target.classList.contains('btn-view-student') ? target : target.closest('.btn-view-student');
                        const key = btn.dataset.student;
                        if (key) {
                            const student = this.storageManager.getStudents().find(s => s.id === key || s.studentId === key);
                            if (student) {
                                this.studentManagement.showStudentStats(student);
                            } else {
                                this.showToast('未找到该学员详情', 'warning');
                            }
                        }
                        return;
                    }
                    
                    // 重试加载按钮
                    if (target.id === 'retry-load-stats' || target.closest('#retry-load-stats')) {
                        e.preventDefault();
                        this.loadStatisticsData();
                        return;
                    }
                    
                    // 导出考勤数据
                    if (target.id === 'export-attendance-data' || target.closest('#export-attendance-data')) {
                        e.preventDefault();
                        this.showExportAttendanceDialog();
                        return;
                    }
                    
                    // 导入考勤数据
                    if (target.id === 'import-attendance-data' || target.closest('#import-attendance-data')) {
                        e.preventDefault();
                        this.showImportAttendanceDialog();
                        return;
                    }
                    
                    // 清空考勤数据
                    if (target.id === 'clear-attendance-data' || target.closest('#clear-attendance-data')) {
                        e.preventDefault();
                        this.clearAttendanceData();
                        return;
                    }
                    
                    // 备份所有数据
                    if (target.id === 'backup-all-data' || target.closest('#backup-all-data')) {
                        e.preventDefault();
                        this.backupAllData();
                        return;
                    }
                });
                
                // 处理下拉框变化事件
                statisticsContainer.addEventListener('change', (e) => {
                    const target = e.target;
                    
                    // 统计范围变化
                    if (target.id === 'stats-range') {
                        this.loadStatisticsData();
                        return;
                    }
                    
                    // 班级筛选变化
                    if (target.id === 'stats-class') {
                        this.loadStatisticsData();
                        return;
                    }
                });
            }

                    });

                if (lastUpdateElement) {

            async loadStatisticsData() {
                console.log('🔄 开始加载统计数据...');
                const container = document.getElementById('statistics');
                if (!container) {
                    console.error('❌ 找不到统计容器 #statistics');
                    return;
                }
                
                const contentArea = container.querySelector('#statistics-content-area');
                if (!contentArea) {
                    console.error('❌ 找不到内容区域 #statistics-content-area');
                    return;
                }
                
                const range = container.querySelector('#stats-range');
                const rangeValue = range ? range.value : '30';
                const className = container.querySelector('#stats-class');
                const classValue = className ? className.value : '';
                const typeBtn = container.querySelector('.stats-type-btn.active');
                const type = typeBtn ? typeBtn.dataset.type : 'overview';
                
                console.log('📊 统计参数:', { range: rangeValue, className: classValue, type });
                
                try {
                    contentArea.innerHTML = `
                        <div class="loading-stats">
                            <div class="loading-spinner"></div>
                            <p>正在加载统计数据...</p>
                        </div>
                    `;
                    
                    // 计算日期范围
                    const endDate = new Date().toISOString().split('T')[0];
                    const startDate = this.getStartDate(rangeValue);
                    
                    console.log('📅 日期范围:', { startDate, endDate });
                    
                    // 更新班级选项
                    await this.updateClassOptions(classValue);
                    
                    // 检查是否有考勤数据
                    const attendance = this.storageManager.getAttendance();
                    console.log('📋 考勤数据数量:', attendance.length);
                    
                    let statsContent = '';
                    
                    switch (type) {
                        case 'overview':
                            statsContent = await this.renderOverviewStats(startDate, endDate, classValue);
                            break;
                        case 'trend':
                            statsContent = await this.renderTrendStats(startDate, endDate, classValue);
                            break;
                        case 'ranking':
                            statsContent = await this.renderRankingStats(startDate, endDate, classValue);
                            break;
                        case 'abnormal':
                            statsContent = await this.renderAbnormalStats(startDate, endDate, classValue);
                            break;
                    }
                    
                    console.log('📊 统计内容生成完成，长度:', statsContent.length);
                    
                    contentArea.innerHTML = statsContent;
                    
                    // 绑定统计页面的事件
                    this.bindStatisticsContentEvents();
                    
                    // 初始化图表
                    setTimeout(() => {
                        this.initStatisticsCharts(type, className);
                    }, 100);
                    
                } catch (error) {
                    console.error('加载统计数据失败:', error);
                    contentArea.innerHTML = `
                        <div class="error-stats">
                            <div class="error-icon">❌</div>
                            <p>加载统计数据失败</p>
                            <button class="btn btn-secondary" id="retry-load-stats">
                                🔄 重试
                            </button>
                        </div>
                    `;
                    
                    // 绑定重试按钮事件
                    const retryBtn = document.getElementById('retry-load-stats');
                    if (retryBtn) {
                        retryBtn.addEventListener('click', () => {
                            this.loadStatisticsData();
                        });
                    }
                }
            }

                                    callbacks: {

                if (trendCanvas) {

                    const recentPresent = (trend.present || []).slice(-dayCount);
                    const recentAbsent = (trend.absent || []).slice(-dayCount);
                    const recentLate = (trend.late || []).slice(-dayCount);
                    const recentLeave = (trend.leave || []).slice(-dayCount);
                    const recentEarly = (trend.early || []).slice(-dayCount);
                    
                    const statusData = {
                        present: recentPresent.reduce((sum, count) => sum + count, 0),
                        absent: recentAbsent.reduce((sum, count) => sum + count, 0),
                        late: recentLate.reduce((sum, count) => sum + count, 0),
                        leave: recentLeave.reduce((sum, count) => sum + count, 0),
                        early: recentEarly.reduce((sum, count) => sum + count, 0)
                    };
                    
                    new Chart(statusCanvas, {
                        type: 'bar',
                        data: {
                            labels: ['出勤', '缺勤', '迟到', '请假', '早退'],
                            datasets: [{
                                label: '最近7天',
                                data: [statusData.present, statusData.absent, statusData.late, statusData.leave, statusData.early],
                                backgroundColor: [
                                    '#10B981', '#EF4444', '#F59E0B', '#3B82F6', '#8B5CF6'
                                ]
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    display: false
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true
                                }
                            }
                        }
                    });
                }
            }

            async checkDataIntegrity() {
                try {
                    // 检查存储结构
                    const students = this.storageManager.getStudents();
                    const attendance = this.storageManager.getAttendance();
                    const sessions = this.storageManager.getSessions();
                    
                    // 检查数据一致性
                    const studentIds = new Set(students.map(s => s.id));
                    const invalidAttendance = attendance.filter(a => !studentIds.has(a.studentId));
                    
                    if (invalidAttendance.length > 0) {
                        console.warn(`发现${invalidAttendance.length}条无效的考勤记录`);
                        // 清理无效数据
                        const validAttendance = attendance.filter(a => studentIds.has(a.studentId));
                        this.storageManager.saveAttendance(validAttendance);
                    }
                    
                    // 检查设置完整性
                    const settings = this.storageManager.getSettings();
                    const defaultSettings = this.getDefaultSettings();
                    const mergedSettings = { ...defaultSettings, ...settings };
                    this.storageManager.saveSettings(mergedSettings);
                    
                    console.log('✅ 数据完整性检查完成');
                    
                } catch (error) {
                    console.error('❌ 数据完整性检查失败:', error);
                    throw new Error('数据完整性检查失败');
                }
            }

            async backupData() {
                try {
                    const backup = {
                        timestamp: new Date().toISOString(),
                        version: '1.0.0',
                        students: this.storageManager.getStudents(),
                        attendance: this.storageManager.getAttendance(),
                        sessions: this.storageManager.getSessions(),
                        settings: this.storageManager.getSettings()
                    };
                    
                    const blob = new Blob([JSON.stringify(backup, null, 2)], { 
                        type: 'application/json;charset=utf-8;' 
                    });
                    
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = `点名系统备份_${new Date().toISOString().split('T')[0]}.json`;
                    link.click();
                    URL.revokeObjectURL(link.href);
                    
                    this.showToast('✅ 数据备份成功', 'success');
                } catch (error) {
                    this.showToast(`❌ 数据备份失败：${error.message}`, 'error');
                }
            }
            
            async importData() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json';
                
                input.addEventListener('change', async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    
                    try {
                        const text = await file.text();
                        const backup = JSON.parse(text);
                        
                        // 验证备份格式
                        if (!backup.version || !backup.students) {
                            throw new Error('无效的备份文件格式');
                        }
                        
                        // 确认导入
                        if (confirm('确定要导入备份数据吗？这将覆盖当前所有数据。')) {
                            // 恢复数据
                            this.storageManager.saveStudents(backup.students || []);
                            this.storageManager.saveAttendance(backup.attendance || []);
                            this.storageManager.saveSessions(backup.sessions || []);
                            this.storageManager.saveSettings(backup.settings || this.getDefaultSettings());
                            
                            // 刷新界面
                            this.refreshData();
                            this.updateSystemInfo(); // 更新系统信息
                            
                            this.showToast('✅ 数据导入成功', 'success');
                        }
                    } catch (error) {
                        this.showToast(`❌ 数据导入失败：${error.message}`, 'error');
                    }
                });
                
                input.click();
            }
            
            async exportData() {
                await this.backupData();

            generateStatisticsReport() {
                try {
                    const container = document.getElementById('statistics');
                    if (!container) {
                        throw new Error('找不到统计容器');
                    }
                    
                    const range = container.querySelector('#stats-range');
                    const rangeValue = range ? range.value : '30';
                    const className = container.querySelector('#stats-class');
                    const classValue = className ? className.value : '';
                    
                    const endDate = new Date().toISOString().split('T')[0];

                                    // 重新加载学员数据以确保获取正确的ID

                            if (!student && options.importStudents && row['学号'] && row['姓名']) {

                                    if (savedStudent) {

                                        studentMap.set(student.name, student);
                                        console.log('👤 创建新学员并获取正确ID:', student.name, 'ID:', student.id);

            // 从行数据创建学员
            createStudentFromRow(row) {
                try {
                    const studentData = {
                        studentId: row['学号'] || row['studentId'] || '',
                        name: row['姓名'] || row['name'] || '',
                        class: row['班级'] || row['class'] || '',
                        phone: row['电话'] || row['phone'] || '',
                        email: row['邮箱'] || row['email'] || '',
                        remarks: row['备注'] || row['remarks'] || ''
                    };
                    
                    // 验证必填字段
                    if (!studentData.studentId || !studentData.name) {
                        console.warn('⚠️ 学员数据不完整:', studentData);
                        return null;
                    }
                    
                    const student = new Student(studentData);
                    console.log('✅ 创建学员:', student);
                    return student;
                } catch (error) {
                    console.error('❌ 创建学员失败:', row, error);
                    return null;
                }
            }
            
            // 提取日期列
            extractDateColumns(row) {
                const dateColumns = [];
                const datePatterns = [
                    /^\d{4}\/\d{1,2}\/\d{1,2}$/, // 2025/9/5
                    /^\d{4}-\d{1,2}-\d{1,2}$/, // 2025-09-05
                    /^\d{1,2}\/\d{1,2}\/\d{4}$/, // 9/5/2025
                ];
                
                Object.keys(row).forEach(column => {
                    if (datePatterns.some(pattern => pattern.test(column))) {
                        dateColumns.push(column);
                    }
                });
                
                return dateColumns.sort();
            }
            
            // 解析日期字符串
            parseDateString(dateStr) {
                try {
                    // 尝试不同的日期格式
                    const formats = [
                        /(\d{4})\/(\d{1,2})\/(\d{1,2})/, // 2025/9/5
                        /(\d{4})-(\d{1,2})-(\d{1,2})/, // 2025-09-05
                        /(\d{1,2})\/(\d{1,2})\/(\d{4})/, // 9/5/2025
                    ];
                    
                    for (const format of formats) {
                        const match = dateStr.match(format);
                        if (match) {
                            const [, year, month, day] = match;
                            return new Date(year, month - 1, day).toISOString();
                        }
                    }
                    
                    // 如果都匹配不上，尝试直接解析
                    return new Date(dateStr).toISOString();
                } catch (error) {
                    console.error('❌ 日期解析失败:', dateStr, error);
                    return new Date().toISOString();
                }
            }
            
            // 解析考勤状态
            parseAttendanceStatus(status) {
                const statusMap = {
                    // 文字状态
                    '出勤': 'present',
                    '缺勤': 'absent',
                    '迟到': 'late',
                    '请假': 'leave',
                    '早退': 'early',
                    
                    // 符号状态
                    '√': 'present',
                    '✓': 'present',
                    '✔': 'present',
                    '×': 'absent',
                    '✕': 'absent',
                    '✗': 'absent',
                    'L': 'late',
                    'l': 'late',
                    'O': 'leave',
                    'o': 'leave',
                    'E': 'early',
                    'e': 'early',
                    
                    // 英文状态
                    'present': 'present',
                    'absent': 'absent',
                    'late': 'late',
                    'leave': 'leave',
                    'early': 'early'
                };
                
                const normalizedStatus = status.toString().toLowerCase().trim();
                return statusMap[normalizedStatus] || statusMap[status] || null;
            }
            
            exportToCSV(data, filename) {
                // 转换为CSV格式
                const headers = Object.keys(data[0]);
                const csvContent = [
                    headers.join(','),
                    ...data.map(row => 
                        headers.map(header => {
                            const value = row[header] || '';
                            // 处理包含逗号或引号的值
                            if (value.toString().includes(',') || value.toString().includes('"')) {
                                return `"${value.toString().replace(/"/g, '""')}"`;
                            }
                            return value;
                        }).join(',')
                    )
                ].join('\n');
                
                // 添加BOM以支持中文
                const BOM = '\uFEFF';
                const blob = new Blob([BOM + csvContent], { type: 'text/csv;charset=utf-8;' });
                
                // 下载文件
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `${filename}.csv`;
                link.click();
                
                // 清理
                setTimeout(() => URL.revokeObjectURL(link.href), 100);
            }
            
            exportToXLSX(data, filename) {
                if (typeof XLSX === 'undefined') {
                    this.showToast('❌ Excel导出功能不可用，请检查网络连接', 'error');
                    return;
                }
                
                // 创建工作簿
                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.json_to_sheet(data);
                
                // 设置列宽

            importAttendanceData(format) {

                    // 创建文件输入元素

                        if (!file) return;
                        (async () => {

                                let data;
                                if (format === 'csv') {
                                    const text = await this.decodeCSVFile(file);

            parseCSVData(csvText) {
                // 使用Papa Parse解析CSV
                if (typeof Papa === 'undefined') {
                    throw new Error('CSV解析功能不可用');
                }
                
                const results = Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true
                });
                
                if (results.errors.length > 0) {
                    console.warn('CSV解析警告:', results.errors);
                }
                
                return results.data;
            }
            
            parseXLSXData(arrayBuffer) {
                if (typeof XLSX === 'undefined') {
                    throw new Error('Excel解析功能不可用');
                }
                // 先尝试限制行数的解析，避免OOM
                let workbook;
                try {
                    workbook = XLSX.read(arrayBuffer, { type: 'array', dense: true, sheetRows: 5000 });
                } catch (e) {
                    console.warn('XLSX首次解析失败，尝试更小范围:', e?.message || e);
                    workbook = XLSX.read(arrayBuffer, { type: 'array', dense: true, sheetRows: 2000 });
                }
                const sheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[sheetName];
                let rows = [];
                try {
                    rows = XLSX.utils.sheet_to_json(worksheet, { defval: '' });
                } catch (e) {
                    console.warn('sheet_to_json 默认解析失败，使用按行解析:', e?.message || e);
                    rows = [];
                }
                
                // 如为空则按行+安全范围解析并自动定位表头
                if (!Array.isArray(rows) || rows.length === 0) {
                    const ref = worksheet['!ref'] || 'A1:Z5000';
                    let range = XLSX.utils.decode_range(ref);
                    const maxCols = 50;
                    const maxRows = 5000;
                    range.e.c = Math.min(range.e.c, range.s.c + maxCols - 1);
                    range.e.r = Math.min(range.e.r, range.s.r + maxRows - 1);
                    const safeRef = XLSX.utils.encode_range(range);
                    const table = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '', range: safeRef, blankrows: false });
                    if (Array.isArray(table) && table.length > 0) {
                        // 直接把第一行视为表头（或再探测一次常见字段）
                        let headerIdx = table.findIndex(r => Array.isArray(r) && r.some(c => ['姓名','name','学号','studentId','班级','class','学员姓名','日期','考勤','状态'].includes(String(c).trim())));
                        if (headerIdx < 0) headerIdx = 0;
                        const header = (table[headerIdx] || []).map(h => String(h || '').trim());
                        const dataRows = table.slice(headerIdx + 1);
                        // 清理全空列
                        const colCount = header.length;
                        const keepCol = new Array(colCount).fill(false);
                        const sample = Math.min(dataRows.length, 200);
                        for (let c = 0; c < colCount; c++) {
                            const isKey = ['姓名','name','学号','studentId','班级','class','学员姓名','日期','考勤','状态','时间','备注','notes'].includes(header[c]);
                            if (isKey) { keepCol[c] = true; continue; }
                            for (let r = 0; r < sample; r++) {
                                const v = (dataRows[r] || [])[c];
                                if (v !== null && v !== undefined && String(v).trim() !== '') { keepCol[c] = true; break; }
                            }
                        }
                        rows = dataRows.filter(r => Array.isArray(r) && r.some(v => String(v).trim() !== ''))
                                       .map(r => {
                                           const obj = {};
                                           for (let c = 0; c < header.length; c++) {
                                               if (!keepCol[c]) continue;
                                               const key = header[c] || `列${c+1}`;
                                               obj[key] = ((r[c] ?? '') + '').toString();
                                           }
                                           return obj;
                                       });
                        console.log('🧹 XLSX已清理列:', header.map((h,i)=>keepCol[i]?null:(h||`列${i+1}`)).filter(Boolean));
                    }
                }
                return rows;
            }

            // 自动检测CSV文件编码并返回文本
            async decodeCSVFile(file) {
                const buffer = await file.arrayBuffer();
                const uint8 = new Uint8Array(buffer);
                const hasBOM = uint8.length >= 3 && uint8[0] === 0xEF && uint8[1] === 0xBB && uint8[2] === 0xBF;
                let decoder = new TextDecoder('utf-8', { fatal: false });
                let text = decoder.decode(uint8);
                const replacementCount = (text.match(/�/g) || []).length;
                if (!hasBOM && replacementCount > 0) {
                    try {
                        decoder = new TextDecoder('gb18030', { fatal: false });
                        text = decoder.decode(uint8);
                    } catch (e) {
                        console.warn('GB18030解码不可用，回退到UTF-8');
                    }
                }
                return text;
            }
            
            // 智能查找字段名
            findFieldName(record, possibleNames) {
                const rowKeys = Object.keys(record);
                for (const name of possibleNames) {
                    if (rowKeys.includes(name)) {
                        return name;
                    }
                }
                return null;
            }
            
            // 从考勤数据导入学员信息

                data.forEach((record, index) => {

                        const studentIdField = this.findFieldName(record, ['studentId', '学号', '学生编号', '工号']);
                        const classField = this.findFieldName(record, ['class', '班级', '班级名称', '部门']);
                        
                        if (!nameField || !record[nameField]) {
                            console.warn(`第${index + 1}行：缺少姓名字段，跳过`, record);
                            skippedCount++;
                            return;
                        }
                        
                        const name = record[nameField].toString().trim();
                        const studentId = studentIdField ? (record[studentIdField] || '').toString().trim() : '';
                        const className = classField ? (record[classField] || '').toString().trim() : '未分类';
                        
                        // 检查是否已存在
                        let existingStudent = null;
                        if (studentId) {
                            existingStudent = currentStudentMap.get(studentId);
                        }
                        if (!existingStudent) {
                            existingStudent = currentStudentMap.get(name);
                        }
                        
                        if (existingStudent) {
                            // 学员已存在，检查是否需要更新
                            const hasChanges = 
                                existingStudent.name !== name ||
                                existingStudent.studentId !== studentId ||
                                existingStudent.class !== className;
                            
                            if (hasChanges) {
                                // 更新学员信息
                                const updatedStudent = {
                                    ...existingStudent,
                                    name: name,
                                    studentId: studentId || existingStudent.studentId,
                                    class: className || existingStudent.class,
                                    updateTime: new Date().toISOString()
                                };
                                
                                // 找到并更新学员
                                const studentIndex = currentStudents.findIndex(s => s.id === existingStudent.id);

                                    currentStudents[studentIndex] = updatedStudent;

                                    importedCount++;

                                console.log(`⏭️ 跳过无变化学员: ${name} (${studentId})`);

                                class: className,
                                phone: '',
                                email: '',

                            };
                            
                            currentStudents.push(newStudent);
                            console.log(`➕ 创建新学员: ${name} (${studentId})`);
                            importedCount++;
                        }
                        
                    } catch (error) {
                        console.error(`第${index + 1}行处理失败:`, error);
                        errorCount++;

                });
                
                // 如果有导入或更新，保存数据
                if (importedCount > 0) {
                    this.storageManager.saveStudents(currentStudents);

            // 导入横向格式的考勤数据（学员信息 + 日期列）

            clearAttendanceData() {
                if (!confirm('⚠️ 确定要清空所有考勤数据吗？此操作将清空考勤记录和点名会话记录！')) {
                    return;
                }
                
                try {
                    console.log('🗑️ 清空考勤数据');
                    
                    // 先停止当前的点名会话
                    if (this.rollCallInterface && this.rollCallManager && this.rollCallManager.getCurrentSession()) {
                        try {
                            this.rollCallManager.endRollCall();
                            console.log('📝 已停止当前点名会话');
                        } catch (error) {
                            console.warn('停止点名会话时出错:', error);
                        }
                    }
                    
                    // 清空考勤数据
                    const attendanceResult = this.storageManager.clearAttendance();
                    if (!attendanceResult) {
                        throw new Error('清空考勤数据失败');

                    // 清空点名会话数据
                    const sessionsResult = this.storageManager.clearSessions();
                    if (!sessionsResult) {
                        throw new Error('清空点名会话数据失败');

                    // 清空统计数据缓存
                    if (this.statisticsManager) {
                        this.statisticsManager.clearCache();
                    }
                    
                    // 重置点名界面状态
                    if (this.rollCallInterface) {
                        this.rollCallInterface.currentClass = '';

                        this.rollCallInterface.currentStudent = null;
                        this.rollCallInterface.render();
                        this.rollCallInterface.bindEvents();

            }

            fixDataMatching() {
                console.log('🔧 开始修复数据匹配问题...');
                
                try {
                    const students = this.storageManager.getStudents();
                    const attendance = this.storageManager.getAttendance();
                    
                    console.log(`📊 当前数据: 学员${students.length}条, 考勤${attendance.length}条`);
                    
                    let fixedCount = 0;
                    const fixedAttendance = attendance.map(record => {
                        // 首先检查是否已经匹配
                        const currentMatch = students.find(s => s.id === record.studentId);
                        if (currentMatch) {
                            return record;  // 已经匹配，无需修复
                        }
                        
                        // 尝试多种匹配策略
                        let student = null;
                        
                        // 策略1: 通过学号匹配
                        if (record.studentId) {
                            student = students.find(s => s.studentId === record.studentId);
                        }
                        
                        // 策略2: 通过姓名匹配
                        if (!student && record.studentName) {
                            student = students.find(s => s.name === record.studentName);
                        }
                        
                        // 策略3: 如果studentId看起来像姓名，尝试匹配
                        if (!student && record.studentId && !record.studentId.startsWith('student_')) {
                            student = students.find(s => s.name === record.studentId);
                        }
                        
                        if (student) {
                            console.log(`🔧 修复记录: ${record.studentName} (${record.studentId} -> ${student.id})`);
                            fixedCount++;
                            return {
                                ...record,
                                studentId: student.id  // 使用系统ID
                            };
                        } else {
                            console.log(`❌ 无法匹配: ${record.studentName} (${record.studentId})`);
                        }
                        
                        return record;
                    });
                    
                    if (fixedCount > 0) {
                        // 保存修复后的数据
                        this.storageManager.saveAttendance(fixedAttendance);
                        console.log(`✅ 数据修复完成: ${fixedCount}条记录已修复`);
                        
                        // 刷新统计数据
                        this.refreshStats();
                        
                        // 重新加载统计界面
                        setTimeout(() => {
                            if (typeof window.app.loadStatisticsData === 'function') {
                                window.app.loadStatisticsData();
                            }
                        }, 100);
                        
                        this.showToast(`✅ 数据修复完成: ${fixedCount}条记录已修复`, 'success');
                        return true;
                    } else {
                        console.log('✅ 数据匹配正常，无需修复');
                        this.showToast('✅ 数据匹配正常，无需修复', 'success');
                        return false;
                    }
                    
                } catch (error) {
                    console.error('❌ 修复失败:', error);
                    this.showToast(`❌ 修复失败：${error.message}`, 'error');
                    return false;
                }
            }
