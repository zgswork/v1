        // ========== 随机点名算法 ==========
        
        class RandomCallAlgorithm {
            constructor(students, options = {}) {
                this.students = students;
                this.options = {
                    weightFactor: options.weightFactor || 0.1,
                    historySize: options.historySize || 10,
                    maxWeight: options.maxWeight || 5,
                    minWeight: options.minWeight || 0.1,
                    ...options
                };
                this.callHistory = [];
                this.weights = {};
                this.initializeWeights();
            }
            
            // 初始化权重
            initializeWeights() {
                this.students.forEach(student => {
                    this.weights[student.id] = 1;
                });
            }
            
            // 选择下一个学员
            selectStudent() {
                const availableStudents = this.getAvailableStudents();
                
                if (availableStudents.length === 0) {
                    this.resetWeights();
                    return this.selectStudent();
                }
                
                const selected = this.weightedRandomSelect(availableStudents);
                
                // 记录历史
                this.addToHistory(selected);
                
                // 更新权重
                this.updateWeights(selected.id);
                
                return selected;
            }
            
            // 获取可点名的学员
            getAvailableStudents() {
                const recentIds = this.callHistory
                    .slice(-this.options.historySize)
                    .map(record => record.studentId);
                
                return this.students.filter(s => !recentIds.includes(s.id));
            }
            
            // 加权随机选择
            weightedRandomSelect(students) {
                const weightedList = this.buildWeightedList(students);
                const randomIndex = Math.floor(Math.random() * weightedList.length);
                return weightedList[randomIndex];
            }
            
            // 构建权重列表
            buildWeightedList(students) {
                const weightedList = [];
                
                students.forEach(student => {
                    const weight = this.weights[student.id] || 1;
                    const normalizedWeight = Math.max(this.options.minWeight, Math.min(this.options.maxWeight, weight));
                    
                    for (let i = 0; i < Math.ceil(normalizedWeight * 10); i++) {
                        weightedList.push(student);
                    }
                });
                
                return weightedList;
            }
            
            // 更新权重
            updateWeights(selectedId) {
                // 增加选中学员的权重
                this.weights[selectedId] = (this.weights[selectedId] || 1) * (1 + this.options.weightFactor);
                
                // 限制最大权重
                this.weights[selectedId] = Math.min(this.weights[selectedId], this.options.maxWeight);
                
                // 其他学员权重衰减
                Object.keys(this.weights).forEach(id => {
                    if (id !== selectedId) {
                        this.weights[id] *= (1 - this.options.weightFactor * 0.5);
                        this.weights[id] = Math.max(this.weights[id], this.options.minWeight);
                    }
                });
            }
            
            // 添加到历史记录
            addToHistory(student) {
                this.callHistory.push({
                    studentId: student.id,
                    studentName: student.name,
                    timestamp: Date.now()
                });
                
                // 限制历史记录大小
                if (this.callHistory.length > this.options.historySize * 2) {
                    this.callHistory = this.callHistory.slice(-this.options.historySize * 2);
                }
            }
            
            // 重置权重
            resetWeights() {
                this.initializeWeights();
                this.callHistory = [];
            }
            
            // 获取历史记录
            getCallHistory() {
                return this.callHistory.slice();
            }
            
            // 获取权重信息
            getWeights() {
                return { ...this.weights };
            }
            
            // 设置权重
            setWeight(studentId, weight) {
                if (this.students.some(s => s.id === studentId)) {
                    this.weights[studentId] = Math.max(this.options.minWeight, 
                        Math.min(this.options.maxWeight, weight));
                    return true;
                }
                return false;
            }
            
            // 批量设置权重
            setWeights(weightsMap) {
                Object.keys(weightsMap).forEach(studentId => {
                    this.setWeight(studentId, weightsMap[studentId]);
                });
            }
            
            // 获取学员统计信息
            getStudentStats(studentId) {
                const history = this.callHistory.filter(record => record.studentId === studentId);
                const totalCalls = this.callHistory.length;
                const studentCalls = history.length;
                const callRate = totalCalls > 0 ? (studentCalls / totalCalls * 100).toFixed(1) : 0;
                const currentWeight = this.weights[studentId] || 1;
                
                return {
                    studentId: studentId,
                    totalCalls: studentCalls,
                    callRate: callRate,
                    currentWeight: currentWeight,
                    lastCalled: history.length > 0 ? history[history.length - 1].timestamp : null
                };
            }
            
            // 获取所有学员统计信息
            getAllStats() {
                return this.students.map(student => ({
                    ...student,
                    ...this.getStudentStats(student.id)
                }));
            }
            
            // 检查学员是否在最近被点过名
            isRecentlyCalled(studentId) {
                const recentIds = this.callHistory
                    .slice(-Math.floor(this.options.historySize / 2))
                    .map(record => record.studentId);
                
                return recentIds.includes(studentId);
            }
            
            // 获取推荐点名列表（基于权重和历史）
            getRecommendedStudents(count = 5) {
                const availableStudents = this.getAvailableStudents();
                
                return availableStudents
                    .map(student => ({
                        ...student,
                        weight: this.weights[student.id] || 1,
                        lastCalled: this.getLastCalledTime(student.id)
                    }))
                    .sort((a, b) => {
                        // 按权重升序，权重低的优先
                        if (a.weight !== b.weight) {
                            return a.weight - b.weight;
                        }
                        // 权重相同的情况下，按最后点名时间排序
                        return (a.lastCalled || 0) - (b.lastCalled || 0);
                    })
                    .slice(0, count)
                    .map(item => ({
                        id: item.id,
                        name: item.name,
                        studentId: item.studentId,
                        class: item.class,
                        weight: item.weight,
                        lastCalled: item.lastCalled
                    }));
            }
            
            // 获取学员最后点名时间
            getLastCalledTime(studentId) {
                const history = this.callHistory.filter(record => record.studentId === studentId);
                return history.length > 0 ? history[history.length - 1].timestamp : null;
            }
            
            // 导出权重配置
            exportWeights() {
                return {
                    weights: this.weights,
                    options: this.options,
                    timestamp: new Date().toISOString()
                };
            }
            
            // 导入权重配置
            importWeights(weightData) {
                if (weightData.weights) {
                    this.weights = { ...weightData.weights };
                }
                if (weightData.options) {
                    this.options = { ...this.options, ...weightData.options };
                }
                return true;
            }
            
            // 重置算法
            reset() {
                this.resetWeights();
                this.callHistory = [];
            }
            
            // 更新学员列表
            updateStudents(students) {
                this.students = students;
                
                // 为新学员初始化权重
                students.forEach(student => {
                    if (!this.weights[student.id]) {
                        this.weights[student.id] = 1;
                    }
                });
                
                // 移除不存在学员的权重
                const studentIds = students.map(s => s.id);
                Object.keys(this.weights).forEach(id => {
                    if (!studentIds.includes(id)) {
                        delete this.weights[id];
                    }
                });
            }
            
            // 生成唯一ID（为系统测试添加）
            generateId() {
                return 'student_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            }
        }

        // ========== 点名管理模块 ==========
        
        class RollCallManager {
            constructor() {
                this.storage = new LocalStorageManager();
                this.studentManager = new StudentManager();
                this.currentSession = null;
                this.randomAlgorithm = null;
                this.sequentialIndex = 0;
                this.settings = this.storage.getSettings();
            }
            
            // 开始点名会话
            startRollCall(mode, options = {}) {
                // 优先使用外部传入的学员列表（UI已按班级筛选）
                let students = Array.isArray(options.students) && options.students.length
                    ? options.students
                    : this.getFilteredStudents(options);
                
                if (!students || students.length === 0) {
                    throw new Error('没有可点名的学员，请先导入学员信息');
                }
                
                // 结束当前会话（如果有）
                if (this.currentSession) {
                    this.endRollCall();
                }
                
                // 创建新会话
                this.currentSession = new RollCallSession({
                    mode: mode,
                    students: students,
                    options: { ...options, ...this.settings }
                });
                
                // 初始化随机算法
                if (mode === 'random') {
                    this.randomAlgorithm = new RandomCallAlgorithm(students, this.settings);
                }
                
                // 重置顺序索引
                this.sequentialIndex = 0;
                
                // 保存会话到存储
                this.saveSession();
                
                return this.currentSession;
            }
            
            // 获取过滤后的学员列表
            getFilteredStudents(options) {
                // 始终从存储中获取最新学员，避免使用过期的内存副本
                let students = this.storage.getStudents();
                
                // 班级筛选
                if (options.classFilter) {
                    students = students.filter(s => s.class === options.classFilter);
                }
                
                // 随机打乱（可选）
                if (options.shuffle) {
                    students = this.shuffleArray(students);
                }
                
                return students;
            }
            
            // 获取下一个学员
            getNextStudent() {
                if (!this.currentSession) {
                    throw new Error('请先开始点名会话');
                }
                
                let student;
                
                switch (this.currentSession.mode) {
                    case 'random':
                        student = this.getRandomStudent();
                        break;
                        
                    case 'sequential':
                        student = this.getSequentialStudent();
                        break;
                        
                    case 'manual':
                        student = null; // 手动模式需要用户选择
                        break;
                        
                    default:
                        throw new Error('不支持的点名模式');
                }
                
                if (student) {
                    this.currentSession.calledStudents.push(student);
                    this.saveSession();
                }
                
                return student;
            }
            
            // 获取随机学员
            getRandomStudent() {
                if (!this.randomAlgorithm) {
                    throw new Error('随机算法未初始化');
                }
                
                return this.randomAlgorithm.selectStudent();
            }
            
            // 获取顺序学员
            getSequentialStudent() {
                const remainingStudents = this.currentSession.students.filter(
                    student => !this.currentSession.calledStudents.some(
                        called => called.id === student.id
                    )
                );
                
                if (remainingStudents.length === 0) {
                    return null;
                }
                
                return remainingStudents[0];
            }
            
            // 手动选择学员
            selectStudent(studentId) {
                if (!this.currentSession) {
                    throw new Error('请先开始点名会话');
                }
                
                if (this.currentSession.mode !== 'manual') {
                    throw new Error('手动选择仅在手动模式下可用');
                }
                
                const student = this.currentSession.students.find(s => s.id === studentId);
                if (!student) {
                    throw new Error('学员不存在');
                }
                
                // 检查是否已经点过名
                if (this.currentSession.calledStudents.some(s => s.id === studentId)) {
                    throw new Error('该学员已经点过名');
                }
                
                this.currentSession.calledStudents.push(student);
                this.saveSession();
                
                return student;
            }
            
            // 记录考勤状态
            recordAttendance(studentId, status, remarks = '') {
                if (!this.currentSession) {
                    throw new Error('请先开始点名会话');
                }
                
                const student = this.currentSession.students.find(s => s.id === studentId);
                if (!student) {
                    throw new Error('学员不存在');
                }
                
                // 检查是否已经记录过考勤
                const existingRecord = this.currentSession.attendanceRecords.find(
                    record => record.studentId === studentId
                );
                
                if (existingRecord) {
                    // 更新现有记录（使用本地时间）
                    existingRecord.status = status;
                    existingRecord.remarks = remarks;
                    const now = new Date();
                    const hh = String(now.getHours()).padStart(2, '0');
                    const mi = String(now.getMinutes()).padStart(2, '0');
                    const ss = String(now.getSeconds()).padStart(2, '0');
                    existingRecord.time = `${hh}:${mi}:${ss}`;
                } else {
                    // 创建新记录
                    const record = new AttendanceRecord({
                        studentId: studentId,
                        studentName: student.name,
                        status: status,
                        remarks: remarks,
                        sessionId: this.currentSession.id
                    });
                    
                    this.currentSession.attendanceRecords.push(record);
                    
                    // 保存到本地存储
                    this.saveAttendanceRecord(record);
                }
                
                this.saveSession();
                
                return existingRecord || this.currentSession.attendanceRecords[this.currentSession.attendanceRecords.length - 1];
            }
            
            // 跳过学员
            skipStudent(studentId, remarks = '') {
                return this.recordAttendance(studentId, 'skipped', remarks);
            }
            
            // 结束点名会话
            endRollCall() {
                if (!this.currentSession) {
                    throw new Error('没有进行中的点名会话');
                }
                
                // 结束会话
                this.currentSession.end();
                
                // 保存会话记录
                this.saveSessionRecord(this.currentSession);
                
                // 清理当前会话
                const session = this.currentSession;
                this.currentSession = null;
                this.randomAlgorithm = null;
                this.sequentialIndex = 0;
                
                return session;
            }
            
            // 获取当前会话状态
            getCurrentSession() {
                return this.currentSession;
            }
            
            // 获取会话进度
            getSessionProgress() {
                if (!this.currentSession) {
                    return null;
                }
                
                const total = this.currentSession.students.length;
                const called = this.currentSession.calledStudents.length;
                const recorded = this.currentSession.attendanceRecords.length;
                
                return {
                    total: total,
                    called: called,
                    recorded: recorded,
                    progress: total > 0 ? Math.round((called / total) * 100) : 0,
                    completion: total > 0 ? Math.round((recorded / total) * 100) : 0
                };
            }
            
            // 获取会话摘要
            getSessionSummary() {
                if (!this.currentSession) {
                    return null;
                }
                
                this.currentSession.generateSummary();
                return this.currentSession.summary;
            }
            
            // 获取未点名的学员
            getRemainingStudents() {
                if (!this.currentSession) {
                    return [];
                }
                
                const calledIds = this.currentSession.calledStudents.map(s => s.id);
                return this.currentSession.students.filter(s => !calledIds.includes(s.id));
            }
            
            // 获取已点名但未记录考勤的学员
            getUnrecordedStudents() {
                if (!this.currentSession) {
                    return [];
                }
                
                const recordedIds = this.currentSession.attendanceRecords.map(r => r.studentId);
                return this.currentSession.calledStudents.filter(s => !recordedIds.includes(s.id));
            }
            
            // 撤销考勤记录
            undoAttendance(studentId) {
                if (!this.currentSession) {
                    throw new Error('没有进行中的点名会话');
                }
                
                const index = this.currentSession.attendanceRecords.findIndex(
                    record => record.studentId === studentId
                );
                
                if (index === -1) {
                    throw new Error('未找到该学员的考勤记录');
                }
                
                const record = this.currentSession.attendanceRecords.splice(index, 1)[0];
                
                // 从本地存储中删除
                this.deleteAttendanceRecord(record.id);
                
                this.saveSession();
                
                return record;
            }
            
            // 重新开始点名
            restartRollCall() {
                if (!this.currentSession) {
                    throw new Error('没有进行中的点名会话');
                }
                
                // 保存当前进度
                const summary = this.getSessionSummary();
                
                // 重置会话状态
                this.currentSession.calledStudents = [];
                this.currentSession.attendanceRecords = [];
                this.currentSession.startTime = new Date().toISOString();
                this.currentSession.endTime = null;
                this.currentSession.summary = null;
                
                // 重置算法
                if (this.randomAlgorithm) {
                    this.randomAlgorithm.reset();
                }
                this.sequentialIndex = 0;
                
                this.saveSession();
                
                return summary;
            }
            
            // 保存会话
            saveSession() {
                if (this.currentSession) {
                    const sessions = this.storage.getSessions();
                    const existingIndex = sessions.findIndex(s => s.id === this.currentSession.id);
                    
                    if (existingIndex !== -1) {
                        sessions[existingIndex] = this.currentSession.toJSON();
                    } else {
                        sessions.push(this.currentSession.toJSON());
                    }
                    
                    this.storage.saveSessions(sessions);
                }
            }
            
            // 保存会话记录
            saveSessionRecord(session) {
                const sessions = this.storage.getSessions();
                const existingIndex = sessions.findIndex(s => s.id === session.id);
                
                if (existingIndex !== -1) {
                    sessions[existingIndex] = session.toJSON();
                } else {
                    sessions.push(session.toJSON());
                }
                
                this.storage.saveSessions(sessions);
            }
            
            // 保存考勤记录
            saveAttendanceRecord(record) {
                const attendance = this.storage.getAttendance();
                attendance.push(record.toJSON());
                this.storage.saveAttendance(attendance);
                
                // 保存考勤记录后刷新统计数据缓存
                if (window.app && window.app.statisticsManager) {
                    window.app.statisticsManager.clearCache();
                    
                    // 如果当前在统计页面，刷新统计数据
                    const statsSection = document.getElementById('statistics');
                    if (statsSection && statsSection.classList.contains('active')) {
                        window.app.loadStatisticsData();
                    }
                }
            }
            
            // 删除考勤记录
            deleteAttendanceRecord(recordId) {
                const attendance = this.storage.getAttendance();
                const filtered = attendance.filter(r => r.id !== recordId);
                this.storage.saveAttendance(filtered);
                
                // 删除考勤记录后刷新统计数据缓存
                if (window.app && window.app.statisticsManager) {
                    window.app.statisticsManager.clearCache();
                    
                    // 如果当前在统计页面，刷新统计数据
                    const statsSection = document.getElementById('statistics');
                    if (statsSection && statsSection.classList.contains('active')) {
                        window.app.loadStatisticsData();
                    }
                }
            }
            
            // 获取历史会话
            getHistorySessions(limit = 10) {
                const sessions = this.storage.getSessions();
                return sessions
                    .sort((a, b) => new Date(b.startTime) - new Date(a.startTime))
                    .slice(0, limit);
            }
            
            // 获取会话详情
            getSessionDetails(sessionId) {
                const sessions = this.storage.getSessions();
                return sessions.find(s => s.id === sessionId);
            }
            
            // 删除会话
            deleteSession(sessionId) {
                const sessions = this.storage.getSessions();
                const filtered = sessions.filter(s => s.id !== sessionId);
                this.storage.saveSessions(filtered);
            }
            
            // 导出会话报告
            exportSessionReport(sessionId) {
                const session = this.getSessionDetails(sessionId);
                if (!session) {
                    throw new Error('会话不存在');
                }
                
                const reportData = {
                    sessionInfo: {

        // ========== 统计分析模块 ==========
        class StatisticsManager {
            constructor(storageManager) {
                this.storage = storageManager;
                this.cache = new Map();
                this.cacheExpiry = 5 * 60 * 1000; // 5分钟缓存
            }
            
            // 清除缓存
            clearCache() {
                this.cache.clear();
            }
            
            // 刷新统计数据
            refreshStats() {
                console.log('🔄 刷新统计数据');
                this.clearCache();
                
                // 重新加载统计界面数据
                if (window.app && typeof window.app.loadStatisticsData === 'function') {
                    window.app.loadStatisticsData();
                    console.log('✅ 统计数据已刷新并重新加载');
                } else {
                    console.log('✅ 统计数据已刷新（缓存已清空）');
                }
            }
            
            // 获取缓存键
            getCacheKey(prefix, ...args) {
                return `${prefix}_${args.join('_')}`;
            }
            
            // 设置缓存
            setCache(key, data) {
                this.cache.set(key, {
                    data: data,
                    timestamp: Date.now()
                });
            }
            
            // 获取缓存
            getCache(key) {
                const cached = this.cache.get(key);
                if (cached && Date.now() - cached.timestamp < this.cacheExpiry) {
                    return cached.data;
                }
                this.cache.delete(key);
                return null;
            }
            
            // 获取学员考勤统计
            getStudentAttendanceStats(studentId, startDate = null, endDate = null) {
                const cacheKey = this.getCacheKey('student_stats', studentId, startDate, endDate);
                const cached = this.getCache(cacheKey);
                if (cached) return cached;
                
                const attendance = this.storage.getAttendance();
                let filtered = attendance.filter(record => record.studentId === studentId);
                
                // 日期筛选
                if (startDate && endDate) {
                    filtered = filtered.filter(record => {
                        const recordDate = record.date;
                        return recordDate >= startDate && recordDate <= endDate;
                    });
                }
                
                const stats = {
                    total: filtered.length,
                    present: filtered.filter(r => r.status === 'present').length,
                    absent: filtered.filter(r => r.status === 'absent').length,
                    late: filtered.filter(r => r.status === 'late').length,
                    leave: filtered.filter(r => r.status === 'leave').length,
                    early: filtered.filter(r => r.status === 'early').length,
                    attendanceRate: 0,
                    details: filtered
                };
                
                // 计算出勤率（出勤+迟到+早退）/总次数
                const validAttendances = stats.present + stats.late + stats.early;
                stats.attendanceRate = stats.total > 0 ? 
                    Math.round(validAttendances / stats.total * 100 * 10) / 10 : 0;
                
                this.setCache(cacheKey, stats);
                return stats;
            }
            
            // 获取班级考勤统计
            getClassAttendanceStats(className, startDate = null, endDate = null) {
                const cacheKey = this.getCacheKey('class_stats', className, startDate, endDate);
                const cached = this.getCache(cacheKey);
                if (cached) return cached;
                
                const students = this.storage.getStudents().filter(s => s.class === className);
                const attendance = this.storage.getAttendance();
                
                console.log(`🔍 getClassAttendanceStats: 班级${className}, 学员${students.length}人, 考勤记录${attendance.length}条`);
                
                let filtered = attendance.filter(record => {
                    const student = students.find(s => s.id === record.studentId);
                    if (!student) {
                        // 尝试其他匹配方式
                        const altMatch = students.find(s => 
                            s.studentId === record.studentId || s.name === record.studentId || s.name === record.studentName
                        );
                        if (altMatch) {
                            console.log(`🔧 找到替代匹配: ${record.studentName} -> ${altMatch.name} (${altMatch.id})`);
                        }
                        return altMatch && altMatch.class === className;
                    }
                    return student && student.class === className;
                });
                
                console.log(`🔍 过滤后考勤记录: ${filtered.length}条`);
                
                // 日期筛选
                if (startDate && endDate) {
                    filtered = filtered.filter(record => {
                        const recordDate = record.date;
                        return recordDate >= startDate && recordDate <= endDate;
                    });
                }
                
                const stats = {
                    className,
                    totalStudents: students.length,
                    totalRecords: filtered.length,
                    present: filtered.filter(r => r.status === 'present').length,
                    absent: filtered.filter(r => r.status === 'absent').length,
                    late: filtered.filter(r => r.status === 'late').length,
                    leave: filtered.filter(r => r.status === 'leave').length,
                    early: filtered.filter(r => r.status === 'early').length,
                    attendanceRate: 0,
                    studentStats: []
                };
                
                // 计算班级出勤率
                const validAttendances = stats.present + stats.late + stats.early;
                stats.attendanceRate = stats.totalRecords > 0 ? 
                    Math.round(validAttendances / stats.totalRecords * 100 * 10) / 10 : 0;
                
                // 统计每个学员的情况
                students.forEach(student => {
                    const studentRecords = filtered.filter(r => r.studentId === student.id);
                    const studentPresent = studentRecords.filter(r => r.status === 'present').length;
                    const studentLate = studentRecords.filter(r => r.status === 'late').length;
                    const studentEarly = studentRecords.filter(r => r.status === 'early').length;
                    
                    stats.studentStats.push({
                        studentId: student.id,
                        studentName: student.name,
                        totalRecords: studentRecords.length,
                        attendanceRate: studentRecords.length > 0 ? 
                            Math.round((studentPresent + studentLate + studentEarly) / studentRecords.length * 100 * 10) / 10 : 0,
                        present: studentPresent,
                        absent: studentRecords.filter(r => r.status === 'absent').length,
                        late: studentLate,
                        leave: studentRecords.filter(r => r.status === 'leave').length,
                        early: studentEarly
                    });
                });
                
                // 按出勤率排序
                stats.studentStats.sort((a, b) => b.attendanceRate - a.attendanceRate);
                
                this.setCache(cacheKey, stats);
                return stats;
            }
            
            // 获取时间范围统计
            getDateRangeStats(startDate, endDate, groupBy = 'day') {
                const cacheKey = this.getCacheKey('date_range_stats', startDate, endDate, groupBy);
                const cached = this.getCache(cacheKey);
                if (cached) return cached;
                
                const attendance = this.storage.getAttendance();
                const filtered = attendance.filter(record => 
                    record.date >= startDate && record.date <= endDate
                );
                
                const stats = {
                    startDate,
                    endDate,
                    groupBy,
                    total: filtered.length,
                    present: filtered.filter(r => r.status === 'present').length,
                    absent: filtered.filter(r => r.status === 'absent').length,
                    late: filtered.filter(r => r.status === 'late').length,
                    leave: filtered.filter(r => r.status === 'leave').length,
                    early: filtered.filter(r => r.status === 'early').length,
                    attendanceRate: 0,
                    groupedData: this.groupDataByDate(filtered, groupBy)
                };
                
                // 计算总体出勤率
                const validAttendances = stats.present + stats.late + stats.early;
                stats.attendanceRate = stats.total > 0 ? 
                    Math.round(validAttendances / stats.total * 100 * 10) / 10 : 0;
                
                this.setCache(cacheKey, stats);
                return stats;
            }
            
            // 按日期分组数据
            groupDataByDate(data, groupBy) {
                const grouped = {};
                
                data.forEach(record => {
                    let key;
                    const date = new Date(record.date);
                    
                    switch (groupBy) {
                        case 'day':
                            key = record.date;
                            break;
                        case 'week':
                            const weekStart = new Date(date);
                            weekStart.setDate(date.getDate() - date.getDay());
                            key = weekStart.toISOString().split('T')[0];
                            break;
                        case 'month':
                            key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
                            break;
                        default:
                            key = record.date;
                    }
                    
                    if (!grouped[key]) {
                        grouped[key] = {
                            date: key,
                            total: 0,
                            present: 0,
                            absent: 0,
                            late: 0,
                            leave: 0,
                            early: 0
                        };
                    }
                    
                    grouped[key].total++;
                    grouped[key][record.status]++;
                });
                
                return Object.values(grouped).sort((a, b) => a.date.localeCompare(b.date));
            }
            
            // 获取考勤趋势分析
            getAttendanceTrend(days = 30) {
                const cacheKey = this.getCacheKey('attendance_trend', days);
                const cached = this.getCache(cacheKey);
                if (cached) return cached;
                
                const endDate = new Date().toISOString().split('T')[0];
                const startDate = new Date(Date.now() - days * 24 * 60 * 60 * 1000)
                    .toISOString().split('T')[0];
                
                const rangeStats = this.getDateRangeStats(startDate, endDate, 'day');
                
                // 计算趋势
                const trend = {
                    dates: rangeStats.groupedData.map(d => d.date),
                    total: rangeStats.groupedData.map(d => d.total),
                    present: rangeStats.groupedData.map(d => d.present),
                    absent: rangeStats.groupedData.map(d => d.absent),
                    late: rangeStats.groupedData.map(d => d.late),
                    leave: rangeStats.groupedData.map(d => d.leave),
                    early: rangeStats.groupedData.map(d => d.early),
                    attendanceRates: rangeStats.groupedData.map(d => 
                        d.total > 0 ? Math.round((d.present + d.late + d.early) / d.total * 100 * 10) / 10 : 0
                    )
                };
                
                // 计算趋势指标
                const rates = trend.attendanceRates;
                const recentRates = rates.slice(-7); // 最近7天
                const earlierRates = rates.slice(-14, -7); // 前7天
                
                trend.indicators = {
                    currentRate: rates.length > 0 ? rates[rates.length - 1] : 0,
                    avgRate: rates.length > 0 ? 
                        Math.round(rates.reduce((sum, rate) => sum + rate, 0) / rates.length * 10) / 10 : 0,
                    trend: recentRates.length > 0 && earlierRates.length > 0 ? 
                        this.calculateTrend(earlierRates, recentRates) : 'stable',
                    weeklyAvg: recentRates.length > 0 ? 
                        Math.round(recentRates.reduce((sum, rate) => sum + rate, 0) / recentRates.length * 10) / 10 : 0
                };
                
                this.setCache(cacheKey, trend);
                return trend;
            }
            
            // 计算趋势方向
            calculateTrend(earlier, recent) {
                const earlierAvg = earlier.reduce((sum, val) => sum + val, 0) / earlier.length;
                const recentAvg = recent.reduce((sum, val) => sum + val, 0) / recent.length;
                const change = ((recentAvg - earlierAvg) / earlierAvg) * 100;
                
                if (change > 5) return 'improving';
                if (change < -5) return 'declining';
                return 'stable';
            }
            
            // 获取学员排名统计
            getStudentRanking(className = null, limit = 20) {
                const cacheKey = this.getCacheKey('student_ranking', className, limit);
                const cached = this.getCache(cacheKey);
                if (cached) return cached;
                
                const students = className ? 
                    this.storage.getStudents().filter(s => s.class === className) :
                    this.storage.getStudents();
                
                const rankings = students.map(student => {
                    const stats = this.getStudentAttendanceStats(student.id);
                    return {
                        studentId: student.id,
                        studentName: student.name,
                        className: student.class,
                        attendanceRate: stats.attendanceRate,
                        totalRecords: stats.total,
                        present: stats.present,
                        absent: stats.absent,
                        late: stats.late,
                        leave: stats.leave,
                        early: stats.early
                    };
                });
                
                // 按出勤率排序
                rankings.sort((a, b) => {
                    // 先按出勤率排序
                    if (b.attendanceRate !== a.attendanceRate) {
                        return b.attendanceRate - a.attendanceRate;
                    }
                    // 出勤率相同则按总记录数排序
                    return b.totalRecords - a.totalRecords;
                });
                
                const result = {
                    className,
                    totalStudents: students.length,
                    rankings: rankings.slice(0, limit),
                    avgAttendanceRate: rankings.length > 0 ? 
                        Math.round(rankings.reduce((sum, r) => sum + r.attendanceRate, 0) / rankings.length * 10) / 10 : 0
                };
                
                this.setCache(cacheKey, result);
                return result;
            }
            
            // 获取异常考勤报告
            getAbnormalAttendanceReport(thresholds = {}) {
                const cacheKey = this.getCacheKey('abnormal_report', JSON.stringify(thresholds));
                const cached = this.getCache(cacheKey);
                if (cached) return cached;
                
                const defaultThresholds = {
                    consecutiveAbsence: 3, // 连续缺勤天数
                    lowAttendanceRate: 60, // 低出勤率阈值
                    frequentLate: 5, // 频繁迟到次数
                    frequentLeave: 3 // 频繁请假次数
                };
                
                const finalThresholds = { ...defaultThresholds, ...thresholds };
                const students = this.storage.getStudents();
                const attendance = this.storage.getAttendance();
                
                const report = {
                    generatedAt: new Date().toISOString(),
                    thresholds: finalThresholds,
                    abnormalStudents: []
                };
                
                students.forEach(student => {
                    const studentAttendance = attendance
                        .filter(r => r.studentId === student.id)
                        .sort((a, b) => a.date.localeCompare(b.date));
                    
                    const abnormalities = [];
                    
                    // 检查连续缺勤
                    const consecutiveAbsences = this.checkConsecutiveAbsences(
                        studentAttendance, finalThresholds.consecutiveAbsence
                    );
                    if (consecutiveAbsences.length > 0) {
                        abnormalities.push({
                            type: 'consecutive_absence',
                            description: `连续缺勤${finalThresholds.consecutiveAbsence}天以上`,
                            details: consecutiveAbsences
                        });
                    }
                    
                    // 检查出勤率
                    const stats = this.getStudentAttendanceStats(student.id);
                    if (stats.attendanceRate < finalThresholds.lowAttendanceRate && stats.total >= 5) {
                        abnormalities.push({
                            type: 'low_attendance_rate',
                            description: `出勤率过低(${stats.attendanceRate}%)`,
                            details: { attendanceRate: stats.attendanceRate, totalRecords: stats.total }
                        });
                    }
                    
                    // 检查频繁迟到
                    if (stats.late >= finalThresholds.frequentLate) {
                        abnormalities.push({
                            type: 'frequent_late',
                            description: `频繁迟到(${stats.late}次)`,
                            details: { lateCount: stats.late }
                        });
                    }
                    
                    // 检查频繁请假
                    if (stats.leave >= finalThresholds.frequentLeave) {
                        abnormalities.push({
                            type: 'frequent_leave',
                            description: `频繁请假(${stats.leave}次)`,
                            details: { leaveCount: stats.leave }
                        });
                    }
                    
                    if (abnormalities.length > 0) {
                        report.abnormalStudents.push({
                            studentId: student.id,
                            studentName: student.name,
                            className: student.class,
                            abnormalities,
                            severity: this.calculateAbnormalitySeverity(abnormalities)
                        });
                    }
                });
                
                // 按严重程度排序
                report.abnormalStudents.sort((a, b) => b.severity - a.severity);
                
                this.setCache(cacheKey, report);
                return report;
            }
            
            // 检查连续缺勤
            checkConsecutiveAbsences(attendance, threshold) {
                const consecutive = [];
                let currentCount = 0;
                let startDate = null;
                
                attendance.forEach(record => {
                    if (record.status === 'absent') {
                        if (currentCount === 0) {
                            startDate = record.date;
                        }
                        currentCount++;
                    } else {
                        if (currentCount >= threshold) {
                            consecutive.push({
                                startDate,
                                endDate: record.date,
                                days: currentCount
                            });
                        }
                        currentCount = 0;
                        startDate = null;
                    }
                });
                
                // 检查最后一次连续缺勤
                if (currentCount >= threshold) {
                    consecutive.push({
                        startDate,
                        endDate: attendance[attendance.length - 1].date,
                        days: currentCount
                    });
                }
                
                return consecutive;
            }
            
            // 计算异常严重程度
            calculateAbnormalitySeverity(abnormalities) {
                let severity = 0;
                abnormalities.forEach(abnormal => {
                    switch (abnormal.type) {
                        case 'consecutive_absence':
                            severity += 3;
                            break;
                        case 'low_attendance_rate':
                            severity += 2;
                            break;
                        case 'frequent_late':
                            severity += 1;
                            break;
                        case 'frequent_leave':
                            severity += 1;
                            break;
                    }
                });
                return severity;
            }
            
            // 生成统计报告
            generateStatisticsReport(options = {}) {
                const {
                    startDate = null,
                    endDate = null,
                    className = null,
                    includeCharts = true,
                    includeDetails = true
                } = options;
                
                const report = {
                    generatedAt: new Date().toISOString(),
                    period: { startDate, endDate },
                    className,
                    summary: {},
                    charts: {},
                    details: {}
                };
                
                // 基础统计
                if (className) {
                    report.summary.classStats = this.getClassAttendanceStats(className, startDate, endDate);
                } else {
                    const allStudents = this.storage.getStudents();
                    report.summary.overallStats = {
                        totalStudents: allStudents.length,
                        totalAttendance: this.storage.getAttendance().length,
                        avgAttendanceRate: 0
                    };
                    
                    if (startDate && endDate) {
                        report.summary.dateRangeStats = this.getDateRangeStats(startDate, endDate);
                    }
                }
                
                // 趋势分析
                if (includeCharts) {
                    report.charts.attendanceTrend = this.getAttendanceTrend(30);
                    report.charts.studentRanking = this.getStudentRanking(className, 20);
                }
                
                // 详细数据
                if (includeDetails) {
                    if (className) {
                        report.details.classDetails = this.getClassAttendanceStats(className, startDate, endDate);
                    } else {
                        report.details.allClasses = this.getAllClassesStats(startDate, endDate);
                    }
                    
                    report.details.abnormalReport = this.getAbnormalAttendanceReport();
                }
                
                return report;
            }
            
            // 获取所有班级统计
            getAllClassesStats(startDate = null, endDate = null) {
                const students = this.storage.getStudents();
                const classes = [...new Set(students.map(s => s.class))];
                
                return classes.map(className => 
                    this.getClassAttendanceStats(className, startDate, endDate)
                );
            }
            
            // 导出统计数据
            exportStatistics(report, format = 'json') {
                if (format === 'json') {
                    const blob = new Blob([JSON.stringify(report, null, 2)], { 
                        type: 'application/json;charset=utf-8;' 
                    });
                    
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = `考勤统计报告_${new Date().toISOString().split('T')[0]}.json`;
                    link.click();
                    URL.revokeObjectURL(link.href);
                } else if (format === 'csv') {
                    const csvData = this.convertReportToCSV(report);
                    const blob = new Blob([csvData], { 
                        type: 'text/csv;charset=utf-8;' 
                    });
                    
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = `考勤统计报告_${new Date().toISOString().split('T')[0]}.csv`;
                    link.click();
                    URL.revokeObjectURL(link.href);
                }
            }
            
            // 转换报告为CSV格式
            convertReportToCSV(report) {
                const rows = [];
                rows.push(['学员姓名', '班级', '总记录数', '出勤次数', '缺勤次数', '迟到次数', '请假次数', '早退次数', '出勤率']);
                
                if (report.details.classDetails) {
                    report.details.classDetails.studentStats.forEach(student => {
                        rows.push([
                            student.studentName,
                            report.details.classDetails.className,
                            student.totalRecords,
                            student.present,
                            student.absent,
                            student.late,
                            student.leave,
                            student.early,
                            `${student.attendanceRate}%`
                        ]);
                    });
                }
                
                return rows.map(row => row.join(',')).join('\n');
            }
            
            // 获取基本统计信息（为系统测试添加）
            getBasicStatistics() {
                console.log('📊 获取基本统计信息...');
                
                const students = this.storage.getStudents();
                const attendance = this.storage.getAttendance();
                
                // 基本统计
                const stats = {
                    totalStudents: students.length,
                    totalAttendance: attendance.length,
                    totalClasses: [...new Set(students.map(s => s.class))].length,
                    totalSessions: [...new Set(attendance.map(a => a.date))].length,
                    attendanceRate: 0
                };
                
                // 计算出勤率
                if (stats.totalStudents > 0 && stats.totalAttendance > 0) {
                    const presentCount = attendance.filter(a => a.status === 'present').length;
                    stats.attendanceRate = Math.round((presentCount / stats.totalAttendance) * 100 * 10) / 10;
                }
                
                // 按班级统计
                const classStats = {};
                students.forEach(student => {
                    if (!classStats[student.class]) {
                        classStats[student.class] = {
                            studentCount: 0,
                            attendanceCount: 0
                        };
                    }
                    classStats[student.class].studentCount++;
                });
                
                attendance.forEach(record => {
                    const student = students.find(s => s.studentId === record.studentId || s.name === record.studentId);
                    if (student && classStats[student.class]) {
                        classStats[student.class].attendanceCount++;
                    }
                });
                
                stats.classStats = classStats;
                
                console.log('✅ 基本统计信息获取完成:', stats);
                return stats;
            }
        }

        // 统一的模态框管理器
        class ModalManager {
            constructor() {
                this.activeModals = 0;
            }
            
            // 显示模态框
            showModal(html, options = {}) {
                return new Promise((resolve) => {
                    // 添加body样式防止背景滚动
                    document.body.classList.add('modal-open');
                    
                    // 插入HTML
                    document.body.insertAdjacentHTML('beforeend', html);
                    
                    // 等待DOM更新后初始化
                    setTimeout(() => {
                        const modal = document.querySelector('.modal-overlay');
                        if (!modal) {
                            console.error('❌ 模态框元素未找到');
                            document.body.classList.remove('modal-open');
                            return;
                        }
                        
                        // 确保模态框可见
                        modal.style.display = 'flex';
                        modal.style.opacity = '1';
                        modal.style.visibility = 'visible';
                        
                        // 统一的关闭函数
                        const closeModal = () => {
                            if (modal) {
                                modal.style.opacity = '0';
                                modal.style.visibility = 'hidden';
                                setTimeout(() => {
                                    modal.remove();
                                    document.body.classList.remove('modal-open');
                                    if (options.onClose) {
                                        options.onClose();
                                    }
                                }, 300);
                            }
                        };
                        
                        // 绑定关闭事件
                        const closeBtn = modal.querySelector('.close-modal');
                        if (closeBtn) {
                            closeBtn.addEventListener('click', closeModal);
                        }
                        
                        // 点击背景关闭
                        modal.addEventListener('click', (e) => {
                            if (e.target === modal) {
                                closeModal();
                            }
                        });
                        
                        // 防止内容点击冒泡
                        const modalContent = modal.querySelector('.modal');
                        if (modalContent) {
                            modalContent.addEventListener('click', (e) => {
                                e.stopPropagation();
                            });
                        }
                        
                        // 绑定自定义关闭按钮
                        if (options.closeButtons) {
                            options.closeButtons.forEach(btnId => {
                                const btn = document.getElementById(btnId);
                                if (btn) {
                                    btn.addEventListener('click', closeModal);
                                }
                            });
                        }
                        
                        // 返回控制对象
                        resolve({
                            modal,
                            closeModal,
                            getElement: (selector) => modal.querySelector(selector)
                        });
                    }, 100);
                });
            }
        }

                    if (e.target.classList.contains('btn-edit')) {
                        this.showStudentForm(student);
                    } else if (e.target.classList.contains('btn-delete')) {
                        this.deleteStudent(studentId);
                    } else if (e.target.classList.contains('btn-stats')) {
                        this.showStudentStats(student);
                    }
                });
            }
            
            filterStudents() {
                let filtered = [...this.students];
                
                // 搜索过滤
                if (this.searchKeyword) {
                    const keyword = this.searchKeyword.toLowerCase();
                    filtered = filtered.filter(student => 
                        student.name.toLowerCase().includes(keyword) ||
                        (student.studentId && student.studentId.toLowerCase().includes(keyword)) ||
                        (student.class && student.class.toLowerCase().includes(keyword)) ||
                        (student.phone && student.phone.toLowerCase().includes(keyword)) ||
                        (student.email && student.email.toLowerCase().includes(keyword))
                    );
                }
                
                // 班级过滤
                if (this.currentFilter) {
                    filtered = filtered.filter(student => student.class === this.currentFilter);
                }
                
                this.filteredStudents = filtered;
                this.render();
            }
            
            sortStudents(sortBy) {
                this.currentSort = sortBy;
                this.filteredStudents.sort((a, b) => {
                    let aValue = a[sortBy];
                    let bValue = b[sortBy];
                    
                    // 中文排序
                    if (typeof aValue === 'string' && typeof bValue === 'string') {
                        return aValue.localeCompare(bValue, 'zh-CN');
                    }
                    
                    // 日期排序
                    if (sortBy === 'createTime') {
                        return new Date(bValue) - new Date(aValue);
                    }
                    
                    // 数字排序
                    return aValue - bValue;
                });
                
                this.render();
            }

                        throw new Error('学员姓名不能为空');
                    }
                    
                    // 创建学员对象
                    const student = new Student({
                        ...studentData,
                        id: this.generateId(),
                        createTime: new Date().toISOString(),
                        updateTime: new Date().toISOString()
                    });
                    
                    console.log('👤 创建的学员对象:', student);
                    
                    // 验证学员数据
                    const errors = student.validate();
                    if (errors.length > 0) {
                        console.warn('👤 学员数据验证警告:', errors);
                        // 不抛出错误，只显示警告
                    }
                    
                    // 检查学号是否重复
                    if (student.studentId) {
                        const existingStudent = this.students.find(s => s.studentId === student.studentId);
                        if (existingStudent) {
                            console.warn('👤 学号已存在，将覆盖原有信息:', student.studentId);
                            // 不抛出错误，允许更新
                        }
                    }
                    
                    this.students.push(student);
                    console.log('👤 学员列表长度:', this.students.length);
                    
                    const studentsData = this.students.map(s => s.toJSON());
                    console.log('👤 准备保存的数据:', studentsData);
                    
                    // 保存到本地存储
                    const saveResult = this.app.storageManager.saveStudents(studentsData);
                    if (!saveResult) {
                        throw new Error('保存学员数据失败');
                    }
                    
                    // 重新加载数据
                    this.loadStudents();
                    this.filterStudents();
                    
                    this.showToast('✅ 学员添加成功', 'success');
                    console.log('👤 学员添加完成');
                } catch (error) {
                    console.error('👤 添加学员失败:', error);
                    this.showToast('❌ 添加学员失败: ' + error.message, 'error');
                }
            }
            
            updateStudent(studentId, studentData) {
                const index = this.students.findIndex(s => s.id === studentId);
                if (index === -1) return;
                
                this.students[index] = new Student({
                    ...this.students[index].toJSON(),
                    ...studentData,
                    updateTime: new Date().toISOString()
                });
                
                this.app.storageManager.saveStudents(this.students.map(s => s.toJSON()));
                
                this.loadStudents();
                this.filterStudents();
                
                this.showToast('✅ 学员信息更新成功', 'success');
            }
            
            deleteStudent(studentId) {
                const student = this.students.find(s => s.id === studentId);
                if (!student) return;
                
                if (confirm(`确定要删除学员"${student.name}"吗？此操作不可恢复。`)) {
                    this.students = this.students.filter(s => s.id !== studentId);
                    this.app.storageManager.saveStudents(this.students.map(s => s.toJSON()));
                    
                    this.loadStudents();

            importStudents() {

                    console.log('📥 文件选择事件触发');

                        console.log('📥 没有选择文件');

                    console.log('📥 选择的文件:', file.name, file.size, file.type);
                    
                    try {
                        // 显示加载状态
                        this.showToast('📥 正在导入学员数据...', 'info');
                        
                        console.log('📥 开始调用 dataManager.importStudents');
                        const studentObjects = await this.app.dataManager.importStudents(file);
                        console.log('📥 导入结果:', studentObjects);
                        
                        if (!Array.isArray(studentObjects)) {
                            throw new Error('导入返回的数据格式不正确');
                        }
                        
                        // 保存学员数据
                        console.log('📥 开始保存学员数据');
                        const currentStudents = this.app.storageManager.getStudents();
                        console.log('📥 当前学员数:', currentStudents.length);
                        
                        // 过滤掉无效数据
                        const validStudents = studentObjects.filter(s => s && s.name && s.name.trim());
                        console.log('📥 有效学员数:', validStudents.length);
                        
                        if (validStudents.length === 0) {
                            throw new Error('没有找到有效的学员数据');
                        }
                        
                        // 根据学号去重处理
                        const currentStudentMap = new Map();
                        currentStudents.forEach(student => {
                            if (student.studentId) {
                                currentStudentMap.set(student.studentId, student);
                                console.log(`📋 当前学员: ${student.name} (${student.studentId})`);
                            }
                        });
                        
                        let newCount = 0;
                        let updateCount = 0;
                        let skipCount = 0;
                        const finalStudents = [...currentStudents];
                        
                        validStudents.forEach(newStudent => {
                            const studentData = newStudent.toJSON();
                            console.log(`📋 处理导入学员: ${studentData.name} (${studentData.studentId})`);
                            
                            if (studentData.studentId) {
                                const existingStudent = currentStudentMap.get(studentData.studentId);
                                if (existingStudent) {
                                    console.log(`🔄 发现重复学号: ${studentData.studentId}`);
                                    console.log(`🔄 原有学员: ${existingStudent.name}`);
                                    console.log(`🔄 导入学员: ${studentData.name}`);
                                    
                                    // 检查是否有实际变化
                                    const hasChanges = 
                                        existingStudent.name !== studentData.name ||
                                        existingStudent.class !== studentData.class ||
                                        existingStudent.phone !== studentData.phone ||
                                        existingStudent.email !== studentData.email ||
                                        existingStudent.remarks !== studentData.remarks;
                                    
                                    if (hasChanges) {
                                        // 学号已存在，更新学员信息
                                        const index = finalStudents.findIndex(s => s.studentId === studentData.studentId);
                                        if (index !== -1) {
                                            // 合并学员信息，保留原有ID，更新其他字段
                                            finalStudents[index] = {
                                                ...finalStudents[index],
                                                name: studentData.name || finalStudents[index].name,
                                                class: studentData.class || finalStudents[index].class,
                                                phone: studentData.phone || finalStudents[index].phone,
                                                email: studentData.email || finalStudents[index].email,
                                                remarks: studentData.remarks || finalStudents[index].remarks,
                                                updateTime: new Date().toISOString()
                                            };
                                            updateCount++;
                                            console.log(`🔄 更新学员: ${studentData.name} (${studentData.studentId})`);
                                        }
                                    } else {
                                        // 没有变化，跳过
                                        skipCount++;
                                        console.log(`⏭️ 跳过无变化学员: ${studentData.name} (${studentData.studentId})`);
                                    }
                                } else {
                                    // 新学员，直接添加
                                    finalStudents.push(studentData);
                                    newCount++;
                                    console.log(`➕ 新增学员: ${studentData.name} (${studentData.studentId})`);
                                }
                            } else {
                                // 没有学号的学员，直接添加
                                finalStudents.push(studentData);
                                newCount++;
                                console.log(`➕ 新增无学号学员: ${studentData.name}`);
                            }
                        });
                        
                        console.log('📥 最终学员数:', finalStudents.length);
                        console.log('📥 新增学员数:', newCount);
                        console.log('📥 更新学员数:', updateCount);

                        this.loadStudents();
                        this.filterStudents();
                        
                        // 更新点名界面的学员列表

                toast.textContent = message;
                
                document.body.appendChild(toast);
                
                setTimeout(() => {
                    toast.classList.add('show');

            debounce(func, wait) {
                let timeout;
                return function executedFunction(...args) {
                    const later = () => {
                        clearTimeout(timeout);
                        func(...args);
                    };
                    clearTimeout(timeout);
                    timeout = setTimeout(later, wait);
                };
            }

                                            ⏹️ 结束点名

                        <!-- 学生列表和侧边栏容器 -->
                        <div class="content-area">

                                                <div class="student-card-actions">

                                                            <span class="current-status ${attendanceRecord.status}">
                                                                ${this.getStatusIcon(attendanceRecord.status)} 
                                                                ${this.getStatusText(attendanceRecord.status)}
                                                            </span>
                                                            <div class="attendance-buttons-small">
                                                                <button class="attendance-btn-small present" 
                                                                        data-student-id="${student.id}" 
                                                                        data-status="present"
                                                                        title="出勤">
                                                                    ✅
                                                                </button>
                                                                <button class="attendance-btn-small absent" 
                                                                        data-student-id="${student.id}" 
                                                                        data-status="absent"
                                                                        title="缺勤">
                                                                    ❌
                                                                </button>
                                                                <button class="attendance-btn-small late" 
                                                                        data-student-id="${student.id}" 
                                                                        data-status="late"
                                                                        title="迟到">
                                                                    ⏰
                                                                </button>
                                                                <button class="attendance-btn-small leave" 
                                                                        data-student-id="${student.id}" 
                                                                        data-status="leave"

                                                                </button>

                                                        `<div class="attendance-buttons-small">
                                                            <button class="attendance-btn-small present" 
                                                                    data-student-id="${student.id}" 
                                                                    data-status="present"
                                                                    title="出勤">
                                                                ✅
                                                            </button>
                                                            <button class="attendance-btn-small absent" 
                                                                    data-student-id="${student.id}" 
                                                                    data-status="absent"
                                                                    title="缺勤">
                                                                ❌
                                                            </button>
                                                            <button class="attendance-btn-small late" 
                                                                    data-student-id="${student.id}" 
                                                                    data-status="late"
                                                                    title="迟到">
                                                                ⏰
                                                            </button>
                                                            <button class="attendance-btn-small leave" 
                                                                    data-student-id="${student.id}" 
                                                                    data-status="leave"
                                                                    title="请假">
                                                                📝
                                                            </button>
                                                        </div>`
                                                    }
                                                </div>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                            
                            <div class="rollcall-sidebar">
                                <div class="session-stats">
                                    <h4>📊 本次点名统计</h4>
                                    <div class="stats-grid">
                                        <div class="stat-item">
                                            <div class="stat-value">${progress.called}</div>
                                            <div class="stat-label">已点名</div>
                                        </div>
                                        <div class="stat-item">
                                            <div class="stat-value">${progress.remaining}</div>
                                            <div class="stat-label">剩余</div>
                                        </div>
                                        <div class="stat-item">
                                            <div class="stat-value">${session.attendanceRecords.length}</div>
                                            <div class="stat-label">已记录</div>
                                        </div>
                                        <div class="stat-item">
                                            <div class="stat-value">${this.getAttendanceRate(session)}%</div>
                                            <div class="stat-label">出勤率</div>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="recent-attendance">
                                    <h4>📝 最近考勤记录</h4>
                                    <div class="attendance-list">
                                        ${session.attendanceRecords.slice(-5).reverse().map(record => 
                                            `<div class="attendance-item">
                                                <span class="student-name">${record.studentName}</span>
                                                <span class="attendance-status ${record.status}">
                                                    ${this.getStatusIcon(record.status)} ${this.getStatusText(record.status)}
                                                </span>
                                            </div>`
                                        ).join('') || '<div class="empty-attendance">暂无考勤记录</div>'}
                                    </div>
                                </div>
                                
                                <div class="status-legend">
                                    <h4>📋 状态说明</h4>
                                    <div class="legend-items">
                                        <div class="legend-item">
                                            <span class="legend-icon present">✅</span>
                                            <span class="legend-text">出勤</span>
                                        </div>
                                        <div class="legend-item">
                                            <span class="legend-icon absent">❌</span>
                                            <span class="legend-text">缺勤</span>
                                        </div>
                                        <div class="legend-item">
                                            <span class="legend-icon late">⏰</span>
                                            <span class="legend-text">迟到</span>
                                        </div>
                                        <div class="legend-item">
                                            <span class="legend-icon leave">📝</span>
