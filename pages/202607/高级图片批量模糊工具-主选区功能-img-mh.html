<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高级图片批量模糊工具 - 主选区功能</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --accent-color: #f72585;
            --light-bg: #f8f9fa;
            --card-bg: #ffffff;
            --border-color: #dee2e6;
            --text-primary: #212529;
            --text-secondary: #6c757d;
            --success: #4cc9f0;
            --warning: #f8961e;
            --danger: #e5383b;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --border-radius: 12px;
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 700px;
            margin: 0 auto;
        }

        .app-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
        }

        @media (min-width: 992px) {
            .app-container {
                grid-template-columns: 320px 1fr;
            }
        }

        /* 控制面板样式 */
        .control-panel {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .panel-section {
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .panel-section:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .section-title i {
            background: rgba(67, 97, 238, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
        }

        .control-group {
            margin-bottom: 18px;
        }

        .control-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .range-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type="range"] {
            flex: 1;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(to right, var(--primary-color), var(--accent-color));
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: white;
            border: 2px solid var(--primary-color);
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        input[type="number"] {
            width: 70px;
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 1rem;
            text-align: center;
            background: var(--light-bg);
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 10px;
        }

        .btn {
            padding: 12px 20px;
            border-radius: var(--border-radius);
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 1rem;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(67, 97, 238, 0.3);
        }

        .btn-accent {
            background: var(--accent-color);
            color: white;
        }

        .btn-accent:hover {
            background: #d91a6a;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(248, 37, 133, 0.3);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
        }

        .btn-outline:hover {
            background: rgba(67, 97, 238, 0.1);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* 预览区域样式 */
        .preview-area {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 25px;
            display: flex;
            flex-direction: column;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .preview-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            flex: 1;
            overflow-y: auto;
            max-height: 70vh;
            padding: 5px;
        }

        .image-card {
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            overflow: hidden;
            background: var(--light-bg);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            transition: var(--transition);
            position: relative;
        }

        .image-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            height: 200px;
            overflow: hidden;
            background: #f0f4f8;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-preview {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .selection-box {
            position: absolute;
            border: 2px dashed var(--accent-color);
            background-color: rgba(247, 37, 133, 0.2);
            display: none;
            pointer-events: none;
        }

        .master .selection-box {
            border: 2px solid var(--primary-color);
            background-color: rgba(67, 97, 238, 0.2);
        }

        .image-info {
            padding: 12px;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            color: var(--text-secondary);
        }

        .image-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .image-size {
            font-size: 0.8rem;
            background: rgba(108, 117, 125, 0.1);
            padding: 2px 8px;
            border-radius: 20px;
        }

        /* 进度条样式 */
        .progress-container {
            margin-top: 20px;
            background: var(--light-bg);
            border-radius: var(--border-radius);
            padding: 15px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: #e9ecef;
            border-radius: 6px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            border-radius: 6px;
            width: 0%;
            transition: width 0.4s ease;
        }

        .status-text {
            text-align: center;
            margin-top: 15px;
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-style: italic;
        }

        /* 页脚样式 */
        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: var(--text-secondary);
            font-size: 0.95rem;
            border-top: 1px solid var(--border-color);
        }

        /* 设置模式下的样式 */
        .setting-mode .image-wrapper {
            cursor: crosshair;
        }

        .setting-mode .btn-setting {
            background: var(--accent-color);
            color: white;
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .preview-container {
                grid-template-columns: 1fr;
            }
            
            .btn {
                padding: 10px 15px;
                font-size: 0.9rem;
            }
        }

        /* 自定义滚动条 */
        .preview-container::-webkit-scrollbar {
            width: 8px;
        }

        .preview-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        .preview-container::-webkit-scrollbar-thumb {
            background: #c5c5c5;
            border-radius: 4px;
        }

        .preview-container::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>
                <i class="fas fa-images"></i>
                高级图片批量模糊工具
            </h1>
            <p class="subtitle">
                支持全局模糊和局部模糊，使用主选区功能可一键应用到所有图片的相同位置
            </p>
        </header>
        
        <div class="app-container">
            <!-- 左侧控制面板 -->
            <div class="control-panel">
                <div class="panel-section">
                    <div class="section-title">
                        <i class="fas fa-sliders-h"></i>
                        <span>基本设置</span>
                    </div>
                    
                    <div class="control-group">
                        <label class="control-label" for="fileInput">
                            <i class="fas fa-folder-open"></i> 选择图片
                        </label>
                        <div class="btn-group">
                            <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">
                            <button class="btn btn-primary" id="uploadBtn">
                                <i class="fas fa-upload"></i> 选择图片
                            </button>
                        </div>
                    </div>
                    
                    <div class="control-group">
                        <label class="control-label">
                            <i class="fas fa-crop-alt"></i> 处理模式
                        </label>
                        <div class="btn-group">
                            <button id="globalModeBtn" class="btn btn-outline active">
                                <i class="fas fa-globe-americas"></i> 全局模糊
                            </button>
                            <button id="localModeBtn" class="btn btn-outline">
                                <i class="fas fa-draw-polygon"></i> 局部模糊
                            </button>
                        </div>
                    </div>
                    
                    <div class="control-group">
                        <label class="control-label" for="blurAmount">
                            <i class="fas fa-blur"></i> 模糊程度
                        </label>
                        <div class="range-container">
                            <input type="range" id="blurAmount" min="0" max="20" value="5" step="1">
                            <input type="number" id="blurValue" min="0" max="20" value="5">
                        </div>
                    </div>
                </div>
                
                <div class="panel-section">
                    <div class="section-title">
                        <i class="fas fa-object-group"></i>
                        <span>主选区设置</span>
                    </div>
                    
                    <div class="control-group">
                        <p style="color: var(--text-secondary); margin-bottom: 15px; font-size: 0.95rem;">
                            设置一个主选区，所有图片的相同位置将应用相同的模糊处理。
                        </p>
                        
                        <div class="btn-group">
                            <button id="setMasterBtn" class="btn btn-outline" disabled>
                                <i class="fas fa-mouse-pointer"></i> 设置主选区
                            </button>
                            <button id="applyToAllBtn" class="btn btn-accent" disabled>
                                <i class="fas fa-clone"></i> 应用到全部
                            </button>
                        </div>
                    </div>
                    
                    <div class="control-group" style="margin-top: 20px;">
                        <div class="btn-group">
                            <button id="processBtn" class="btn btn-primary" disabled>
                                <i class="fas fa-magic"></i> 处理图片
                            </button>
                            <button id="downloadAllBtn" class="btn btn-accent" disabled>
                                <i class="fas fa-download"></i> 下载全部
                            </button>
                        </div>
                    </div>
                </div>
                
                <div class="progress-container">
                    <div class="progress-header">
                        <span>处理进度</span>
                        <span id="progressText">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress" id="progressBar"></div>
                    </div>
                    <div class="status-text" id="statusText">等待操作...</div>
                </div>
            </div>
            
            <!-- 右侧预览区域 -->
            <div class="preview-area">
                <div class="preview-header">
                    <h2><i class="fas fa-eye"></i> 图片预览</h2>
                    <div id="imageCount">0 张图片</div>
                </div>
                
                <div class="preview-container" id="previewContainer">
                    <div class="empty-state">
                        <i class="fas fa-cloud-upload-alt" style="font-size: 5rem; color: #dee2e6; margin-bottom: 20px;"></i>
                        <h3>尚未上传图片</h3>
                        <p>点击"选择图片"按钮上传一张或多张图片</p>
                    </div>
                </div>
            </div>
        </div>
        
        <footer>
            制作者：晋人在秦 老K | 高级图片处理工具 © 2023
        </footer>
    </div>

    <script>
        // DOM元素
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const blurAmount = document.getElementById('blurAmount');
        const blurValue = document.getElementById('blurValue');
        const processBtn = document.getElementById('processBtn');
        const downloadAllBtn = document.getElementById('downloadAllBtn');
        const previewContainer = document.getElementById('previewContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const statusText = document.getElementById('statusText');
        const globalModeBtn = document.getElementById('globalModeBtn');
        const localModeBtn = document.getElementById('localModeBtn');
        const setMasterBtn = document.getElementById('setMasterBtn');
        const applyToAllBtn = document.getElementById('applyToAllBtn');
        const imageCount = document.getElementById('imageCount');

        // 全局变量
        let uploadedImages = [];
        let processedImages = [];
        let currentMode = 'global';
        let masterSelection = null;
        let masterImageIndex = null;
        let isSettingMaster = false;

        // 初始化事件监听
        function initEventListeners() {
            // 模糊程度控制
            blurAmount.addEventListener('input', () => {
                blurValue.value = blurAmount.value;
            });
            
            blurValue.addEventListener('input', () => {
                if (blurValue.value > 20) blurValue.value = 20;
                if (blurValue.value < 0) blurValue.value = 0;
                blurAmount.value = blurValue.value;
            });
            
            // 模式切换
            globalModeBtn.addEventListener('click', () => {
                currentMode = 'global';
                globalModeBtn.classList.add('active');
                localModeBtn.classList.remove('active');
                updateSelectionBoxesVisibility();
            });
            
            localModeBtn.addEventListener('click', () => {
                currentMode = 'local';
                localModeBtn.classList.add('active');
                globalModeBtn.classList.remove('active');
                updateSelectionBoxesVisibility();
            });
            
            // 上传按钮
            uploadBtn.addEventListener('click', () => {
                fileInput.click();
            });
            
            // 文件选择
            fileInput.addEventListener('change', handleFileSelect);
            
            // 设置主选区
            setMasterBtn.addEventListener('click', () => {
                isSettingMaster = true;
                setMasterBtn.classList.add('setting-mode');
                setMasterBtn.innerHTML = '<i class="fas fa-times"></i> 取消设置';
                statusText.textContent = "请点击并拖动鼠标选择主选区区域";
                previewContainer.classList.add('setting-mode');
            });
            
            // 应用到全部
            applyToAllBtn.addEventListener('click', applyMasterSelectionToAll);
            
            // 处理图片
            processBtn.addEventListener('click', processImages);
            
            // 下载全部
            downloadAllBtn.addEventListener('click', downloadAllProcessedImages);
        }
        
        // 处理文件选择
        function handleFileSelect(e) {
            const files = e.target.files;
            if (files.length === 0) return;
            
            uploadedImages = [];
            processedImages = [];
            previewContainer.innerHTML = '';
            masterSelection = null;
            masterImageIndex = null;
            isSettingMaster = false;
            
            // 更新状态
            statusText.textContent = `正在加载 ${files.length} 张图片...`;
            progressBar.style.width = '0%';
            progressText.textContent = '0%';
            processBtn.disabled = true;
            downloadAllBtn.disabled = true;
            setMasterBtn.disabled = true;
            applyToAllBtn.disabled = true;
            
            let loadedCount = 0;
            
            // 加载每张图片
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const reader = new FileReader();
                
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        createImageCard(file, event.target.result, img, loadedCount, files.length);
                        loadedCount++;
                        
                        if (loadedCount === files.length) {
                            finalizeImageLoading(files.length);
                        }
                    };
                    
                    img.onerror = () => {
                        handleImageError(file, loadedCount, files.length);
                        loadedCount++;
                    };
                    
                    img.src = event.target.result;
                };
                
                reader.onerror = () => {
                    handleImageError(file, loadedCount, files.length);
                    loadedCount++;
                };
                
                reader.readAsDataURL(file);
            }
        }
        
        // 创建图片卡片
        function createImageCard(file, dataUrl, img, index, total) {
            const card = document.createElement('div');
            card.className = 'image-card';
            if (index === 0) card.classList.add('master');
            
            const wrapper = document.createElement('div');
            wrapper.className = 'image-wrapper';
            
            const preview = document.createElement('img');
            preview.className = 'image-preview';
            preview.src = dataUrl;
            
            const selectionBox = document.createElement('div');
            selectionBox.className = 'selection-box';
            selectionBox.style.display = currentMode === 'local' ? 'block' : 'none';
            
            wrapper.appendChild(preview);
            wrapper.appendChild(selectionBox);
            
            const info = document.createElement('div');
            info.className = 'image-info';
            
            const name = document.createElement('div');
            name.className = 'image-name';
            name.textContent = file.name;
            
            const size = document.createElement('div');
            size.className = 'image-size';
            size.textContent = formatFileSize(file.size);
            
            info.appendChild(name);
            info.appendChild(size);
            
            card.appendChild(wrapper);
            card.appendChild(info);
            previewContainer.appendChild(card);
            
            // 存储图片数据
            uploadedImages.push({
                file: file,
                originalData: dataUrl,
                element: preview,
                wrapper: wrapper,
                selectionBox: selectionBox,
                selection: null,
                naturalWidth: img.naturalWidth,
                naturalHeight: img.naturalHeight
            });
            
            // 添加事件监听
            setupSelectionEvents(uploadedImages.length - 1);
            
            // 更新进度
            const progress = Math.round(((index + 1) / total) * 100);
            progressBar.style.width = `${progress}%`;
            progressText.textContent = `${progress}%`;
        }
        
        // 完成图片加载
        function finalizeImageLoading(total) {
            statusText.textContent = `已加载 ${total} 张图片，准备处理`;
            processBtn.disabled = false;
            setMasterBtn.disabled = false;
            imageCount.textContent = `${total} 张图片`;
            
            // 默认将第一张图片设为主选区
            if (uploadedImages.length > 0) {
                uploadedImages[0].wrapper.classList.add('master');
            }
        }
        
        // 处理图片错误
        function handleImageError(file, index, total) {
            statusText.textContent = `加载失败: ${file.name}`;
            
            if (index === total - 1 && uploadedImages.length > 0) {
                statusText.textContent = `已加载 ${uploadedImages.length}/${total} 张图片，准备处理`;
                processBtn.disabled = false;
                setMasterBtn.disabled = false;
                imageCount.textContent = `${uploadedImages.length} 张图片`;
            }
        }
        
        // 设置选区事件
        function setupSelectionEvents(index) {
            const imgData = uploadedImages[index];
            const wrapper = imgData.wrapper;
            const selectionBox = imgData.selectionBox;
            
            let isSelecting = false;
            let startX, startY;
            
            wrapper.addEventListener('mousedown', (e) => {
                if (currentMode !== 'local' && !isSettingMaster) return;
                
                isSelecting = true;
                const rect = wrapper.getBoundingClientRect();
                startX = e.clientX - rect.left;
                startY = e.clientY - rect.top;
                
                // 初始化选择框
                selectionBox.style.left = startX + 'px';
                selectionBox.style.top = startY + 'px';
                selectionBox.style.width = '0px';
                selectionBox.style.height = '0px';
                
                // 设置主选区模式处理
                if (isSettingMaster) {
                    // 清除其他主选区标记
                    uploadedImages.forEach(img => {
                        img.wrapper.classList.remove('master');
                    });
                    // 设置当前为主选区
                    wrapper.classList.add('master');
                    masterImageIndex = index;
                }
            });
            
            wrapper.addEventListener('mousemove', (e) => {
                if (!isSelecting) return;
                
                const rect = wrapper.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                
                const width = mouseX - startX;
                const height = mouseY - startY;
                
                selectionBox.style.width = Math.abs(width) + 'px';
                selectionBox.style.height = Math.abs(height) + 'px';
                selectionBox.style.left = (width < 0 ? mouseX : startX) + 'px';
                selectionBox.style.top = (height < 0 ? mouseY : startY) + 'px';
            });
            
            wrapper.addEventListener('mouseup', () => {
                if (!isSelecting) return;
                
                isSelecting = false;
                
                // 保存选择区域
                if (parseInt(selectionBox.style.width) > 5 && parseInt(selectionBox.style.height) > 5) {
                    imgData.selection = {
                        x: parseInt(selectionBox.style.left),
                        y: parseInt(selectionBox.style.top),
                        width: parseInt(selectionBox.style.width),
                        height: parseInt(selectionBox.style.height)
                    };
                    
                    // 主选区模式处理
                    if (isSettingMaster) {
                        masterSelection = imgData.selection;
                        isSettingMaster = false;
                        setMasterBtn.classList.remove('setting-mode');
                        setMasterBtn.innerHTML = '<i class="fas fa-mouse-pointer"></i> 设置主选区';
                        previewContainer.classList.remove('setting-mode');
                        applyToAllBtn.disabled = false;
                        statusText.textContent = "主选区已设置，点击'应用到全部'按钮应用到所有图片";
                    }
                } else {
                    imgData.selection = null;
                    selectionBox.style.width = '0px';
                    selectionBox.style.height = '0px';
                }
            });
            
            wrapper.addEventListener('mouseleave', () => {
                isSelecting = false;
            });
        }
        
        // 应用主选区到所有图片
        function applyMasterSelectionToAll() {
            if (!masterSelection || masterImageIndex === null) return;
            
            const masterImg = uploadedImages[masterImageIndex];
            
            uploadedImages.forEach((imgData, index) => {
                if (index === masterImageIndex) return;
                
                // 计算相对比例
                const scaleX = imgData.wrapper.offsetWidth / masterImg.wrapper.offsetWidth;
                const scaleY = imgData.wrapper.offsetHeight / masterImg.wrapper.offsetHeight;
                
                imgData.selection = {
                    x: masterSelection.x * scaleX,
                    y: masterSelection.y * scaleY,
                    width: masterSelection.width * scaleX,
                    height: masterSelection.height * scaleY
                };
                
                // 更新选择框显示
                imgData.selectionBox.style.left = imgData.selection.x + 'px';
                imgData.selectionBox.style.top = imgData.selection.y + 'px';
                imgData.selectionBox.style.width = imgData.selection.width + 'px';
                imgData.selectionBox.style.height = imgData.selection.height + 'px';
            });
            
            statusText.textContent = `主选区已应用到所有图片`;
        }
        
        // 更新选区框可见性
        function updateSelectionBoxesVisibility() {
            document.querySelectorAll('.selection-box').forEach(box => {
                box.style.display = currentMode === 'local' ? 'block' : 'none';
            });
        }
        
        // 处理图片
        function processImages() {
            if (uploadedImages.length === 0) return;
            
            const blur = parseInt(blurAmount.value);
            processedImages = [];
            
            statusText.textContent = `正在处理 ${uploadedImages.length} 张图片...`;
            progressBar.style.width = '0%';
            progressText.textContent = '0%';
            processBtn.disabled = true;
            
            let processedCount = 0;
            
            // 使用Canvas处理每张图片
            for (let i = 0; i < uploadedImages.length; i++) {
                processImage(i, blur, () => {
                    processedCount++;
                    const progress = Math.round((processedCount / uploadedImages.length) * 100);
                    progressBar.style.width = `${progress}%`;
                    progressText.textContent = `${progress}%`;
                    
                    if (processedCount === uploadedImages.length) {
                        statusText.textContent = `已完成处理 ${uploadedImages.length} 张图片`;
                        downloadAllBtn.disabled = false;
                        processBtn.disabled = false;
                    }
                });
            }
        }
        
        // 处理单张图片
        function processImage(index, blur, callback) {
            const imgData = uploadedImages[index];
            const img = new Image();
            
            img.onload = () => {
                // 创建Canvas
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // 设置Canvas尺寸
                canvas.width = img.width;
                canvas.height = img.height;
                
                // 绘制原始图片
                ctx.drawImage(img, 0, 0);
                
                if (currentMode === 'global') {
                    // 全局模糊
                    ctx.filter = `blur(${blur}px)`;
                    ctx.drawImage(img, 0, 0);
                    ctx.filter = 'none';
                } else {
                    // 局部模糊
                    if (imgData.selection) {
                        // 计算选择区域在原始图片中的位置和尺寸
                        const scaleX = img.width / imgData.wrapper.offsetWidth;
                        const scaleY = img.height / imgData.wrapper.offsetHeight;
                        
                        const x = imgData.selection.x * scaleX;
                        const y = imgData.selection.y * scaleY;
                        const width = imgData.selection.width * scaleX;
                        const height = imgData.selection.height * scaleY;
                        
                        // 只模糊选择区域
                        ctx.save();
                        ctx.beginPath();
                        ctx.rect(x, y, width, height);
                        ctx.closePath();
                        ctx.clip();
                        ctx.filter = `blur(${blur}px)`;
                        ctx.drawImage(img, 0, 0);
                        ctx.restore();
                    }
                }
                
                // 获取处理后的图片数据
                const processedData = canvas.toDataURL('image/jpeg');
                
                // 更新预览
                imgData.element.src = processedData;
                
                // 存储处理后的图片
                processedImages.push({
                    originalName: imgData.file.name,
                    data: processedData
                });
                
                callback();
            };
            
            img.onerror = () => {
                callback();
            };
            
            img.src = imgData.originalData;
        }
        
        // 下载所有处理后的图片
        function downloadAllProcessedImages() {
            if (processedImages.length === 0) return;
            
            statusText.textContent = `正在准备下载 ${processedImages.length} 张图片...`;
            downloadAllBtn.disabled = true;
            
            let downloadedCount = 0;
            
            // 为每张图片创建下载链接
            processedImages.forEach((img, index) => {
                setTimeout(() => {
                    const link = document.createElement('a');
                    link.href = img.data;
                    link.download = `blurred_${img.originalName}`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    
                    // 更新状态
                    downloadedCount++;
                    const progress = Math.round((downloadedCount / processedImages.length) * 100);
                    progressBar.style.width = `${progress}%`;
                    progressText.textContent = `${progress}%`;
                    
                    if (downloadedCount === processedImages.length) {
                        statusText.textContent = `已下载 ${processedImages.length} 张图片`;
                        downloadAllBtn.disabled = false;
                    }
                }, index * 300);
            });
        }
        
        // 辅助函数：格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initEventListeners();
        });
    </script>
</body>
</html>
