        document.addEventListener('DOMContentLoaded', function() {
            const recommendBtn = document.getElementById('recommendBtn');
            const changeBtn = document.getElementById('changeBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const movieCard = document.getElementById('movieCard');
            const movieName = document.getElementById('movieName');
            const movieCountry = document.getElementById('movieCountry');
            const movieActors = document.getElementById('movieActors');
            const movieStars = document.getElementById('movieStars');
            const movieDesc = document.getElementById('movieDesc');
            const movieReason = document.getElementById('movieReason');
            const downloadModal = document.getElementById('downloadModal');
            const modalClose = document.querySelector('.modal-close');

            let currentMovieIndex = -1;

            function getRandomMovie() {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * movies.length);
                } while (newIndex === currentMovieIndex && movies.length > 1);
                
                currentMovieIndex = newIndex;
                return movies[currentMovieIndex];
            }

            function displayMovie(movie) {
                movieName.textContent = movie.name;
                movieCountry.textContent = movie.country;
                movieActors.textContent = movie.actors;
                movieDesc.textContent = movie.desc;
                movieReason.textContent = movie.reason;
                
                // Calculate stars based on rating
                const starCount = Math.round(movie.rating / 2);
                movieStars.innerHTML = '★'.repeat(starCount) + '☆'.repeat(5 - starCount);
                
                movieCard.style.display = 'block';
                recommendBtn.style.display = 'none';
                changeBtn.style.display = 'inline-block';
            }

            recommendBtn.addEventListener('click', function() {
                const movie = getRandomMovie();
                displayMovie(movie);
            });

            changeBtn.addEventListener('click', function() {
                const movie = getRandomMovie();
                displayMovie(movie);
            });

            downloadBtn.addEventListener('click', function() {
                downloadModal.style.display = 'flex';
            });

            modalClose.addEventListener('click', function() {
                downloadModal.style.display = 'none';
            });

            // Close modal when clicking outside of it
            downloadModal.addEventListener('click', function(e) {
                if (e.target === downloadModal) {
                    downloadModal.style.display = 'none';
                }
            });
        });
    </script>
