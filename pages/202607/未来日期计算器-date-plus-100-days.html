<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>未来日期计算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .header {
            margin-bottom: 30px;
        }

        .title {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .subtitle {
            font-size: 16px;
            color: #666;
        }

        .current-date {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .current-date h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .current-date p {
            font-size: 20px;
            color: #333;
            font-weight: 500;
        }

        .result-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .result-label {
            font-size: 18px;
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .result-date {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .result-weekday {
            font-size: 24px;
            opacity: 0.9;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
        }

        .info-item h4 {
            color: #667eea;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .info-item p {
            font-size: 18px;
            color: #333;
            font-weight: 600;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 40px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .refresh-btn:active {
            transform: translateY(0);
        }

        .input-section {
            margin-bottom: 30px;
        }

        .input-section label {
            display: block;
            margin-bottom: 10px;
            font-size: 16px;
            color: #333;
            font-weight: 500;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        #daysInput {
            flex: 1;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.3s ease;
            text-align: center;
            font-weight: 600;
        }

        #daysInput:focus {
            border-color: #667eea;
        }

        #daysInput:hover {
            border-color: #667eea;
        }

        .input-suffix {
            position: absolute;
            right: 15px;
            color: #666;
            font-size: 16px;
            pointer-events: none;
        }

        .input-hint {
            margin-top: 8px;
            font-size: 14px;
            color: #999;
        }

        .mode-switcher {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            justify-content: center;
        }

        .mode-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
        }

        .mode-btn:hover {
            background: #f0f0ff;
        }

        .mode-btn.active {
            background: #667eea;
            color: white;
        }

        .date-picker {
            display: none;
        }

        .date-picker.active {
            display: block;
        }

        .date-input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.3s ease;
            font-family: inherit;
        }

        .date-input:focus {
            border-color: #667eea;
        }

        .horoscope-section {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        .horoscope-icon {
            font-size: 36px;
            margin-bottom: 8px;
            animation: pulse 2s ease-in-out infinite;
        }

        .horoscope-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #fff;
        }

        .horoscope-luck {
            font-size: 14px;
            opacity: 0.9;
            line-height: 1.4;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            
            .title {
                font-size: 24px;
            }
            
            .result-date {
                font-size: 28px;
            }
            
            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">日期计算器</h1>
            <div class="mode-switcher">
                <button class="mode-btn active" data-mode="future">计算未来日期</button>
                <button class="mode-btn" data-mode="past">计算天数差</button>
            </div>
            <p class="subtitle" id="modeSubtitle">轻松计算从今天起任意天数后的日期和星期</p>
        </div>

        <div class="current-date fade-in">
            <h3>今天</h3>
            <p id="todayDisplay">加载中...</p>
        </div>

        <div class="input-section fade-in">
            <label id="inputLabel">输入天数：</label>
            <div class="input-group future-mode">
                <input type="number" id="daysInput" value="100" min="1" max="10000" placeholder="请输入天数">
                <span class="input-suffix">天</span>
            </div>
            <div class="date-picker past-mode">
                <input type="date" id="dateInput" class="date-input">
            </div>
            <div class="input-hint" id="inputHint">支持1-10000天</div>
        </div>

        <div class="result-card fade-in">
            <div class="result-label" id="resultLabel">100天后是</div>
            <div class="result-date" id="resultDate">计算中...</div>
            <div class="result-weekday" id="resultWeekday">星期...</div>
            <div class="result-days" id="resultDays" style="display: none;"></div>
            <div class="horoscope-section" id="horoscopeSection">
                <div class="horoscope-icon" id="horoscopeIcon">♈</div>
                <div class="horoscope-name" id="horoscopeName">白羊座</div>
                <div class="horoscope-luck" id="horoscopeLuck">今日运势极佳！</div>
            </div>
        </div>

        <div class="info-grid fade-in">
            <div class="info-item">
                <h4 id="infoTitle1">总天数</h4>
                <p id="infoValue1">100天</p>
            </div>
            <div class="info-item">
                <h4 id="infoTitle2">约等于</h4>
                <p id="infoValue2">3个月10天</p>
            </div>
        </div>

        <button class="refresh-btn" onclick="refreshCalculation()">
            重新计算
        </button>
    </div>

    <script>
        // 星期中文映射
        const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];

        // 格式化日期
        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const weekday = weekdays[date.getDay()];
            return `${year}年${month}月${day}日 ${weekday}`;
        }

        // 计算N天后的日期
        function calculateFutureDate(days) {
            const today = new Date();
            const futureDate = new Date(today);
            futureDate.setDate(today.getDate() + days);
            
            return {
                today: today,
                future: futureDate
            };
        }

        // 计算大概时间（月+天）
        function calculateApproximateTime(days) {
            const months = Math.floor(days / 30.44); // 平均每月30.44天
            const remainingDays = Math.round(days % 30.44);
            
            if (months === 0) {
                return `${remainingDays}天`;
            } else if (remainingDays === 0) {
                return `${months}个月`;
            } else {
                return `${months}个月${remainingDays}天`;
            }
        }

        // 星座数据
        const zodiacData = [
            { name: '白羊座', symbol: '♈', date: '3.21-4.19', luck: ['充满活力，适合开启新计划', '事业运势上升，抓住机会', '感情甜蜜，适合表白'] },
            { name: '金牛座', symbol: '♉', date: '4.20-5.20', luck: ['财运亨通，适合投资', '工作稳定，收获满满', '生活惬意，享受当下'] },
            { name: '双子座', symbol: '♊', date: '5.21-6.21', luck: ['思维活跃，创意无限', '社交运旺，结识贵人', '学习进步，知识增长'] },
            { name: '巨蟹座', symbol: '♋', date: '6.22-7.22', luck: ['家庭和睦，温馨满满', '情感丰富，善解人意', '工作顺利，同事融洽'] },
            { name: '狮子座', symbol: '♌', date: '7.23-8.22', luck: ['自信满满，光芒四射', '领导赏识，升职加薪', '魅力四射，桃花旺盛'] },
            { name: '处女座', symbol: '♍', date: '8.23-9.22', luck: ['细致入微，完美主义', '健康运佳，精力充沛', '工作有序，效率提升'] },
            { name: '天秤座', symbol: '♎', date: '9.23-10.23', luck: ['人际和谐，贵人相助', '审美提升，艺术灵感', '爱情美满，甜蜜如初'] },
            { name: '天蝎座', symbol: '♏', date: '10.24-11.22', luck: ['洞察力强，直觉敏锐', '事业突破，收获成功', '感情深沉，忠诚专一'] },
            { name: '射手座', symbol: '♐', date: '11.23-12.21', luck: ['乐观开朗，好运连连', '旅行运旺，开阔视野', '学习进步，知识丰富'] },
            { name: '摩羯座', symbol: '♑', date: '12.22-1.19', luck: ['脚踏实地，稳步前进', '事业有成，目标达成', '财富积累，收获满满'] },
            { name: '水瓶座', symbol: '♒', date: '1.20-2.18', luck: ['创新思维，独特见解', '人缘极佳，朋友众多', '事业突破，创意无限'] },
            { name: '双鱼座', symbol: '♓', date: '2.19-3.20', luck: ['浪漫多情，艺术天赋', '直觉敏锐，灵感不断', '感情丰富，温柔体贴'] }
        ];

        // 根据日期获取星座
        function getZodiacSign(month, day) {
            const dates = [20, 19, 21, 20, 21, 22, 23, 23, 23, 24, 23, 22];
            const signs = ["摩羯座", "水瓶座", "双鱼座", "白羊座", "金牛座", "双子座", "巨蟹座", "狮子座", "处女座", "天秤座", "天蝎座", "射手座", "摩羯座"];
            
            if (day <= dates[month - 1]) {
                return zodiacData[month - 1] || zodiacData[11];
            } else {
                return zodiacData[month] || zodiacData[0];
            }
        }

        // 获取随机运势
        function getRandomLuck(luckArray) {
            return luckArray[Math.floor(Math.random() * luckArray.length)];
        }

        // 更新星座运势
        function updateHoroscope(date) {
            const month = date.getMonth() + 1;
            const day = date.getDate();
            const zodiac = getZodiacSign(month, day);
            
            document.getElementById('horoscopeIcon').textContent = zodiac.symbol;
            document.getElementById('horoscopeName').textContent = zodiac.name;
            document.getElementById('horoscopeLuck').textContent = getRandomLuck(zodiac.luck);
        }

        // 更新显示
        function updateDisplay() {
            const daysInput = document.getElementById('daysInput');
            let days = parseInt(daysInput.value) || 100;
            
            // 限制范围
            days = Math.max(1, Math.min(10000, days));
            daysInput.value = days;
            
            const { today, future } = calculateFutureDate(days);
            
            document.getElementById('todayDisplay').textContent = formatDate(today);
            
            const futureDateStr = `${future.getFullYear()}年${future.getMonth() + 1}月${future.getDate()}日`;
            const futureWeekdayStr = weekdays[future.getDay()];
            
            document.getElementById('resultLabel').textContent = `${days}天后是`;
            document.getElementById('futureDate').textContent = futureDateStr;
            document.getElementById('futureWeekday').textContent = futureWeekdayStr;
            document.getElementById('totalDays').textContent = `${days}天`;
            document.getElementById('approximateTime').textContent = calculateApproximateTime(days);
            
            // 添加动画效果
            const elements = document.querySelectorAll('.fade-in');
            elements.forEach(el => {
                el.style.animation = 'none';
                setTimeout(() => {
                    el.style.animation = 'fadeIn 0.5s ease-out';
                }, 10);
            });
        }

        // 刷新计算
        function refreshCalculation() {
            const btn = document.querySelector('.refresh-btn');
            btn.style.transform = 'scale(0.95)';
            setTimeout(() => {
                btn.style.transform = 'scale(1)';
                updateDisplay();
            }, 150);
        }

        // 当前模式
        let currentMode = 'future';

        // 计算两个日期之间的天数差
        function calculateDaysBetween(startDate, endDate) {
            const start = new Date(startDate);
            const end = new Date(endDate);
            const diffTime = end - start;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            return diffDays;
        }

        // 切换模式
        function switchMode(mode) {
            currentMode = mode;
            const modeBtns = document.querySelectorAll('.mode-btn');
            const futureMode = document.querySelector('.future-mode');
            const pastMode = document.querySelector('.past-mode');
            
            modeBtns.forEach(btn => btn.classList.remove('active'));
            document.querySelector(`[data-mode="${mode}"]`).classList.add('active');
            
            if (mode === 'future') {
                futureMode.style.display = 'block';
                pastMode.style.display = 'none';
                document.getElementById('inputLabel').textContent = '输入天数：';
                document.getElementById('inputHint').textContent = '支持1-10000天';
                document.getElementById('modeSubtitle').textContent = '轻松计算从今天起任意天数后的日期和星期';
            } else {
                futureMode.style.display = 'none';
                pastMode.style.display = 'block';
                document.getElementById('inputLabel').textContent = '选择日期：';
                document.getElementById('inputHint').textContent = '选择任意日期计算与今天的天数差';
                document.getElementById('modeSubtitle').textContent = '计算指定日期距离今天有多少天';
                
                // 设置日期输入框的默认值为明天
                const tomorrow = new Date();
                tomorrow.setDate(tomorrow.getDate() + 1);
                document.getElementById('dateInput').value = tomorrow.toISOString().split('T')[0];
            }
            
            updateDisplay();
        }

        // 更新显示（支持两种模式）
        function updateDisplay() {
            if (currentMode === 'future') {
                updateFutureMode();
            } else {
                updatePastMode();
            }
        }

        // 更新未来日期模式
        function updateFutureMode() {
            const daysInput = document.getElementById('daysInput');
            let days = parseInt(daysInput.value) || 100;
            
            days = Math.max(1, Math.min(10000, days));
            daysInput.value = days;
            
            const { today, future } = calculateFutureDate(days);
            
            document.getElementById('todayDisplay').textContent = formatDate(today);
            document.getElementById('resultLabel').textContent = `${days}天后是`;
            document.getElementById('resultDate').textContent = `${future.getFullYear()}年${future.getMonth() + 1}月${future.getDate()}日`;
            document.getElementById('resultWeekday').textContent = weekdays[future.getDay()];
            document.getElementById('resultWeekday').style.display = 'block';
            document.getElementById('resultDays').style.display = 'none';
            
            document.getElementById('infoTitle1').textContent = '总天数';
            document.getElementById('infoValue1').textContent = `${days}天`;
            document.getElementById('infoTitle2').textContent = '约等于';
            document.getElementById('infoValue2').textContent = calculateApproximateTime(days);
            
            // 更新星座运势
            updateHoroscope(future);
        }

        // 更新过去日期模式
        function updatePastMode() {
            const dateInput = document.getElementById('dateInput');
            const selectedDate = new Date(dateInput.value);
            const today = new Date();
            
            if (isNaN(selectedDate.getTime())) {
                document.getElementById('resultLabel').textContent = '请选择有效日期';
                document.getElementById('resultDate').textContent = '--';
                document.getElementById('resultWeekday').style.display = 'none';
                document.getElementById('resultDays').style.display = 'none';
                return;
            }
            
            const daysDiff = calculateDaysBetween(today, selectedDate);
            const absDaysDiff = Math.abs(daysDiff);
            
            document.getElementById('todayDisplay').textContent = formatDate(today);
            
            if (daysDiff === 0) {
                document.getElementById('resultLabel').textContent = '就是今天';
                document.getElementById('resultDate').textContent = formatDate(selectedDate);
                document.getElementById('resultWeekday').textContent = weekdays[selectedDate.getDay()];
                document.getElementById('resultWeekday').style.display = 'block';
                document.getElementById('resultDays').style.display = 'none';
            } else if (daysDiff > 0) {
                // 未来日期
                document.getElementById('resultLabel').textContent = '距离今天还有';
                document.getElementById('resultDate').textContent = formatDate(selectedDate);
                document.getElementById('resultWeekday').textContent = weekdays[selectedDate.getDay()];
                document.getElementById('resultWeekday').style.display = 'block';
                document.getElementById('resultDays').style.display = 'block';
                document.getElementById('resultDays').textContent = `${absDaysDiff}天`;
            } else {
                // 过去日期
                document.getElementById('resultLabel').textContent = '距离今天已过去';
                document.getElementById('resultDate').textContent = formatDate(selectedDate);
                document.getElementById('resultWeekday').textContent = weekdays[selectedDate.getDay()];
                document.getElementById('resultWeekday').style.display = 'block';
                document.getElementById('resultDays').style.display = 'block';
                document.getElementById('resultDays').textContent = `${absDaysDiff}天`;
            }
            
            document.getElementById('infoTitle1').textContent = '总天数差';
            document.getElementById('infoValue1').textContent = `${absDaysDiff}天`;
            document.getElementById('infoTitle2').textContent = '约等于';
            document.getElementById('infoValue2').textContent = calculateApproximateTime(absDaysDiff);
            
            // 更新星座运势
            updateHoroscope(selectedDate);
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 设置日期输入框的最小值为2020年
            const dateInput = document.getElementById('dateInput');
            dateInput.setAttribute('min', '2020-01-01');
            dateInput.setAttribute('max', '2050-12-31');
            
            // 模式切换事件
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', () => switchMode(btn.dataset.mode));
            });
            
            // 日期输入事件
            document.getElementById('dateInput').addEventListener('change', updateDisplay);
            
            // 监听天数输入变化
            const daysInput = document.getElementById('daysInput');
            daysInput.addEventListener('input', function() {
                clearTimeout(this.debounceTimer);
                this.debounceTimer = setTimeout(updateDisplay, 300);
            });
            daysInput.addEventListener('change', updateDisplay);
            daysInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    updateDisplay();
                }
            });
            
            // 初始显示
            switchMode('future');
        });

        // 每分钟自动更新（防止长时间停留页面导致日期不准确）
        setInterval(updateDisplay, 60000);
    </script>
</body>
</html>

<style>
    /* 响应式底部样式 */
    @media (max-width: 768px) {
        div[style*="text-align: center"] {
            margin: 20px 10px;
            padding: 15px;
        }
        
        div[style*="text-align: center"] p {

        div[style*="text-align: center"] strong {

        }

    /* 动画效果 */
    div[style*="text-align: center"] {
        animation: slideUp 0.6s ease-out;
    }
    
    @keyframes slideUp {
        from {
