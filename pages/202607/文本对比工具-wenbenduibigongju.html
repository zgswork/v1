<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本对比工具</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .compare-area {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .text-box {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        textarea {
            width: 100%;
            height: 300px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            resize: vertical;
            font-size: 14px;
        }
        label {
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 10px 0;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        .result {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 4px;
            background-color: #f9f9f9;
            min-height: 100px;
            white-space: pre-wrap;
        }
        .difference {
            background-color: #ffcccc;
        }
        .match {
            color: #999;
        }
        .disclaimer {
            margin-top: 30px;
            padding: 15px;
            background-color: #fff8e1;
            border-left: 4px solid #ffc107;
            font-size: 14px;
            color: #5d4037;
        }
        .disclaimer h3 {
            margin-top: 0;
            color: #e65100;
        }
        .author-info {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #666;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .author-info a {
            color: #1a73e8;
            text-decoration: none;
        }
        .author-info a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>文本对比工具</h1>
        
        <div class="compare-area">
            <div class="text-box">
                <label for="text1">文本1:</label>
                <textarea id="text1" placeholder="在此输入第一段文本..."></textarea>
            </div>
            
            <div class="text-box">
                <label for="text2">文本2:</label>
                <textarea id="text2" placeholder="在此输入第二段文本..."></textarea>
            </div>
        </div>
        
        <div style="text-align: center;">
            <button onclick="compareTexts()">对比文本</button>
            <button onclick="clearTexts()">清空文本</button>
        </div>
        
        <h2>对比结果:</h2>
        <div id="result" class="result"></div>
        
        <div class="disclaimer">
            <h3>免责声明</h3>
            <p>1. 本工具仅提供文本对比功能，不存储、记录或传输您输入的任何文本内容。</p>
            <p>2. 所有文本处理均在您的浏览器本地完成，不会发送到任何服务器。</p>
            <p>3. 请勿输入敏感或机密信息，使用者需自行承担因使用本工具而产生的所有风险。</p>
            <p>4. 本工具按"现状"提供，不提供任何形式的明示或暗示的保证。</p>
            <p>5. 对于因使用本工具导致的任何直接或间接损失，开发者不承担任何责任。</p>
        </div>
        
        <div class="author-info">
            <p>开发者: 文璧 | 联系邮箱: <a href="/cdn-cgi/l/email-protection#be8c88898b898a8f87898bfecfcf90ddd1d3"><span class="__cf_email__" data-cfemail="75474342404241444c42403504045b161a18">[email&#160;protected]</span></a></p>
            <p>© 2025 文本对比工具 - 所有权利保留</p>
        </div>
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        function compareTexts() {
            const text1 = document.getElementById('text1').value;
            const text2 = document.getElementById('text2').value;
            const resultDiv = document.getElementById('result');
            
            if (!text1 || !text2) {
                resultDiv.innerHTML = '请在两边的文本框中输入要对比的内容';
                return;
            }
            
            const lines1 = text1.split('\n');
            const lines2 = text2.split('\n');
            const maxLines = Math.max(lines1.length, lines2.length);
            
            let resultHTML = '';
            
            for (let i = 0; i < maxLines; i++) {
                const line1 = lines1[i] || '';
                const line2 = lines2[i] || '';
                
                if (line1 === line2) {
                    resultHTML += `<div class="match">${escapeHtml(line1)}</div>`;
                } else {
                    resultHTML += `<div><span class="difference">${escapeHtml(line1)}</span> ↔ <span class="difference">${escapeHtml(line2)}</span></div>`;
                }
            }
            
            resultDiv.innerHTML = resultHTML;
        }
        
        function clearTexts() {
            document.getElementById('text1').value = '';
            document.getElementById('text2').value = '';
            document.getElementById('result').innerHTML = '';
        }
        
        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
