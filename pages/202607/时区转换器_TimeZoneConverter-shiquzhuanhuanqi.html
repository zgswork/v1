<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时区转换器 | Time Zone Converter</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
            color: #333;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
            position: relative;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
        }
        
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        
        input[type="datetime-local"] {
            padding: 9px;
        }
        
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: background-color 0.3s;
            margin-bottom: 10px;
        }
        
        button:hover {
            background-color: #2980b9;
        }
        
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
            font-size: 18px;
            display: none;
        }
        
        .author {
            margin-top: 20px;
            font-size: 14px;
            color: #7f8c8d;
            text-align: center;
        }
        
        .author a {
            color: #3498db;
            text-decoration: none;
        }
        
        .author a:hover {
            text-decoration: underline;
        }
        
        .language-switch {
            position: absolute;
            top: 15px;
            right: 15px;
        }
        
        .language-btn {
            background: none;
            border: 1px solid #3498db;
            color: #3498db;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            width: auto;
            margin-left: 5px;
        }
        
        .language-btn:hover {
            background-color: #3498db;
            color: white;
        }
        
        .time-display {
            font-size: 24px;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .timezone-info {
            font-size: 16px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="language-switch">
            <button class="language-btn" onclick="switchLanguage('zh')">中文</button>
            <button class="language-btn" onclick="switchLanguage('en')">EN</button>
        </div>
        
        <h1 id="title">时区转换器</h1>
        
        <div class="input-group">
            <label id="datetime-label" for="datetime">日期和时间</label>
            <input type="datetime-local" id="datetime">
        </div>
        
        <div class="input-group">
            <label id="from-tz-label">从时区</label>
            <select id="from-tz">
                <option value="UTC">协调世界时 (UTC)</option>
                <option value="Asia/Shanghai">中国标准时间 (UTC+8)</option>
                <option value="America/New_York">东部时间 (UTC-5/-4)</option>
                <option value="America/Los_Angeles">太平洋时间 (UTC-8/-7)</option>
                <option value="Europe/London">伦敦时间 (UTC+0/+1)</option>
                <option value="Europe/Paris">巴黎时间 (UTC+1/+2)</option>
                <option value="Asia/Tokyo">东京时间 (UTC+9)</option>
                <option value="Australia/Sydney">悉尼时间 (UTC+10/+11)</option>
            </select>
        </div>
        
        <div class="input-group">
            <label id="to-tz-label">转换为时区</label>
            <select id="to-tz">
                <option value="Asia/Shanghai">中国标准时间 (UTC+8)</option>
                <option value="UTC">协调世界时 (UTC)</option>
                <option value="America/New_York">东部时间 (UTC-5/-4)</option>
                <option value="America/Los_Angeles">太平洋时间 (UTC-8/-7)</option>
                <option value="Europe/London">伦敦时间 (UTC+0/+1)</option>
                <option value="Europe/Paris">巴黎时间 (UTC+1/+2)</option>
                <option value="Asia/Tokyo">东京时间 (UTC+9)</option>
                <option value="Australia/Sydney">悉尼时间 (UTC+10/+11)</option>
            </select>
        </div>
        
        <button id="convert-btn" onclick="convertTimezone()">转换</button>
        
        <div class="result" id="result">
            <div class="time-display" id="converted-time"></div>
            <div class="timezone-info" id="timezone-info"></div>
        </div>
        
        <div class="author">
            <span id="author-text">作者：文璧 | 邮箱：</span><a href="/cdn-cgi/l/email-protection#bc8e8a8b898b888d858b89fccdcd92dfd3d1"><span class="__cf_email__" data-cfemail="3e0c08090b090a0f07090b7e4f4f105d5153">[email&#160;protected]</span></a>
        </div>
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 语言资源
        const resources = {
            zh: {
                title: "时区转换器",
                datetimeLabel: "日期和时间",
                fromTzLabel: "从时区",
                toTzLabel: "转换为时区",
                convertBtn: "转换",
                authorText: "作者：文璧 | 邮箱：",
                timezoneOptions: {
                    "UTC": "协调世界时 (UTC)",
                    "Asia/Shanghai": "中国标准时间 (UTC+8)",
                    "America/New_York": "东部时间 (UTC-5/-4)",
                    "America/Los_Angeles": "太平洋时间 (UTC-8/-7)",
                    "Europe/London": "伦敦时间 (UTC+0/+1)",
                    "Europe/Paris": "巴黎时间 (UTC+1/+2)",
                    "Asia/Tokyo": "东京时间 (UTC+9)",
                    "Australia/Sydney": "悉尼时间 (UTC+10/+11)"
                },
                resultPrefix: "转换结果：",
                invalidDate: "请输入有效的日期和时间"
            },
            en: {
                title: "Time Zone Converter",
                datetimeLabel: "Date and Time",
                fromTzLabel: "From Time Zone",
                toTzLabel: "To Time Zone",
                convertBtn: "Convert",
                authorText: "Author: Wen Bi | Email: ",
                timezoneOptions: {
                    "UTC": "Coordinated Universal Time (UTC)",
                    "Asia/Shanghai": "China Standard Time (UTC+8)",
                    "America/New_York": "Eastern Time (UTC-5/-4)",
                    "America/Los_Angeles": "Pacific Time (UTC-8/-7)",
                    "Europe/London": "London Time (UTC+0/+1)",
                    "Europe/Paris": "Paris Time (UTC+1/+2)",
                    "Asia/Tokyo": "Tokyo Time (UTC+9)",
                    "Australia/Sydney": "Sydney Time (UTC+10/+11)"
                },
                resultPrefix: "Converted Result: ",
                invalidDate: "Please enter a valid date and time"
            }
        };

        // 切换语言
        function switchLanguage(lang) {
            document.getElementById('title').textContent = resources[lang].title;
            document.getElementById('datetime-label').textContent = resources[lang].datetimeLabel;
            document.getElementById('from-tz-label').textContent = resources[lang].fromTzLabel;
            document.getElementById('to-tz-label').textContent = resources[lang].toTzLabel;
            document.getElementById('convert-btn').textContent = resources[lang].convertBtn;
            document.getElementById('author-text').textContent = resources[lang].authorText;
            
            // 更新下拉选项
            updateTimezoneOptions(lang);
            
            // 更新结果文本（如果有）
            updateResultText(lang);
        }

        // 更新时区选项
        function updateTimezoneOptions(lang) {
            const fromTz = document.getElementById('from-tz');
            const toTz = document.getElementById('to-tz');
            const currentFromValue = fromTz.value;
            const currentToValue = toTz.value;
            
            // 清空选项
            fromTz.innerHTML = '';
            toTz.innerHTML = '';
            
            // 添加新选项
            for (const [value, text] of Object.entries(resources[lang].timezoneOptions)) {
                const fromOption = document.createElement('option');
                fromOption.value = value;
                fromOption.text = text;
                fromTz.add(fromOption);
                
                const toOption = document.createElement('option');
                toOption.value = value;
                toOption.text = text;
                toTz.add(toOption);
            }
            
            // 恢复之前选中的值
            fromTz.value = currentFromValue;
            toTz.value = currentToValue;
            
            // 如果之前选中的值不存在于新语言选项中，使用默认值
            if (!fromTz.value) fromTz.value = 'UTC';
            if (!toTz.value) toTz.value = 'Asia/Shanghai';
        }

        // 更新结果文本
        function updateResultText(lang) {
            const resultElement = document.getElementById('result');
            if (resultElement.style.display === 'block') {
                convertTimezone();
            }
        }

        // 格式化日期时间
        function formatDateTime(date, timezone, lang) {
            const options = {
                timeZone: timezone,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            };
            
            let formattedDate;
            try {
                formattedDate = new Intl.DateTimeFormat(lang === 'en' ? 'en-US' : 'zh-CN', options).format(date);
            } catch (e) {
                // 如果Intl.DateTimeFormat失败，使用简单格式
                formattedDate = date.toLocaleString();
            }
            
            // 获取时区缩写
            let timezoneAbbr = '';
            try {
                timezoneAbbr = date.toLocaleTimeString(lang === 'en' ? 'en-US' : 'zh-CN', {
                    timeZone: timezone,
                    timeZoneName: 'short'
                }).split(' ')[2];
            } catch (e) {
                timezoneAbbr = '';
            }
            
            return {
                formattedDate,
                timezoneAbbr
            };
        }

        // 时区转换函数
        function convertTimezone() {
            const datetimeInput = document.getElementById('datetime').value;
            if (!datetimeInput) {
                const currentLang = document.getElementById('convert-btn').textContent === 'Convert' ? 'en' : 'zh';
                alert(resources[currentLang].invalidDate);
                return;
            }
            
            const fromTz = document.getElementById('from-tz').value;
            const toTz = document.getElementById('to-tz').value;
            const currentLang = document.getElementById('convert-btn').textContent === 'Convert' ? 'en' : 'zh';
            
            // 创建Date对象
            const date = new Date(datetimeInput);
            if (isNaN(date.getTime())) {
                alert(resources[currentLang].invalidDate);
                return;
            }
            
            // 格式化原始时间
            const originalFormat = formatDateTime(date, fromTz, currentLang);
            
            // 转换时区
            const convertedFormat = formatDateTime(date, toTz, currentLang);
            
            // 显示结果
            document.getElementById('result').style.display = 'block';
            document.getElementById('converted-time').textContent = convertedFormat.formattedDate;
            
            // 构建时区信息
            const fromTzName = resources[currentLang].timezoneOptions[fromTz] || fromTz;
            const toTzName = resources[currentLang].timezoneOptions[toTz] || toTz;
            
            let timezoneInfo = `${fromTzName} → ${toTzName}`;
            if (convertedFormat.timezoneAbbr) {
                timezoneInfo += ` (${convertedFormat.timezoneAbbr})`;
            }
            
            document.getElementById('timezone-info').textContent = timezoneInfo;
        }

        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            // 设置默认日期时间为当前时间
            const now = new Date();
            const timezoneOffset = now.getTimezoneOffset() * 60000;
            const localISOTime = new Date(now - timezoneOffset).toISOString().slice(0, 16);
            document.getElementById('datetime').value = localISOTime;
            
            // 设置默认语言
            switchLanguage('zh');
        });
    </script>
</body>
</html>
