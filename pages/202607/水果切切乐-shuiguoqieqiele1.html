<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>水果切切乐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        
        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: linear-gradient(to bottom, #1a2a6c, #b21f1f, #fdbb2d);
            touch-action: manipulation;
        }
        
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        
        #start-screen, #game-over-screen, #help-screen, #download-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            z-index: 100;
        }
        
        #game-over-screen, #help-screen, #download-modal {
            display: none;
        }
        
        #help-content, #download-content {
            max-width: 80%;
            max-height: 60%;
            overflow-y: auto;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 2rem;
            text-shadow: 2px 2px 4px #000;
        }
        
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }
        
        button {
            padding: 15px 30px;
            font-size: 1.5rem;
            background-color: #ff6b6b;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
        }
        
        button:hover {
            background-color: #ff8e8e;
            transform: scale(1.05);
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 2rem;
            color: white;
            text-shadow: 2px 2px 4px #000;
            z-index: 10;
        }
        
        #time-display {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 2rem;
            color: white;
            text-shadow: 2px 2px 4px #000;
            z-index: 10;
        }
        
        #pause-button {
            position: absolute;
            top: 70px;
            right: 20px;
            font-size: 1.5rem;
            padding: 10px 20px;
            z-index: 10;
        }
        
        #help-button {
            position: absolute;
            top: 70px;
            left: 20px;
            font-size: 1.5rem;
            padding: 10px 20px;
            z-index: 10;
        }
        
        #download-link {
            display: block;
            width: 80%;
            margin: 20px auto;
            padding: 10px;
            background-color: #f5f5f5;
            color: #333;
            border: 1px solid #ddd;
            border-radius: 5px;
            text-align: center;
            font-size: 1.2rem;
            word-break: break-all;
            cursor: text;
            user-select: text;
            -webkit-user-select: text;
        }
        
        #copy-button {
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #copy-button:hover {
            background-color: #45a049;
        }
        
        .fruit {
            position: absolute;
            width: 60px;
            height: 60px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            z-index: 5;
            transition: transform 0.1s;
            font-size: 50px;
            text-align: center;
            line-height: 60px;
        }
        
        .fruit.cut {
            transform: scale(0.9);
            opacity: 0.8;
        }
        
        .slice {
            position: absolute;
            width: 60px;
            height: 60px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 6;
            font-size: 25px;
            text-align: center;
            line-height: 30px;
        }
        
        .juice {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.7);
            z-index: 4;
        }
        
        .trail {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.5);
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 20;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            button {
                padding: 10px 20px;
                font-size: 1.2rem;
            }
            
            #score-display, #time-display {
                font-size: 1.5rem;
            }
            
            #pause-button, #help-button {
                font-size: 1.2rem;
                padding: 8px 16px;
            }
            
            .fruit {
                width: 50px;
                height: 50px;
                font-size: 40px;
                line-height: 50px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="start-screen">
            <h1>水果切切乐</h1>
            <div class="button-container">
                <button id="start-button">开始游戏</button>
                <button id="help-button-start">玩法介绍</button>
                <button id="download-button-start">下载游戏</button>
            </div>
        </div>
        
        <div id="game-over-screen">
            <h1>游戏结束</h1>
            <p id="final-score" style="font-size: 2rem; margin-bottom: 2rem;">得分: 0</p>
            <button id="restart-button">再玩一次</button>
        </div>
        
        <div id="help-screen">
            <div id="help-content">
                <h2>玩法介绍</h2>
                <p style="margin: 1rem 0; font-size: 1.2rem;">
                    1. 用手指或鼠标划过水果来切开它们<br>
                    2. 切开普通水果获得分数：🍎+1分 🍌+2分 🍊+1分 🍉+3分<br>
                    3. 避开炸弹💣，切到炸弹会扣5分<br>
                    4. 游戏时间为60秒<br>
                    5. 点击暂停按钮可以暂停游戏<br>
                    6. 暂停后点击继续可以恢复游戏<br>
                    7. 尽可能获得高分吧！
                </p>
            </div>
            <button id="close-help-button">返回</button>
        </div>
        
        <div id="download-modal">
            <div id="download-content">
                <h2>下载游戏</h2>
                <p>复制以下夸克网盘链接在浏览器打开可以转存下载工具</p>
                <input type="text" id="download-link" value="https://pan.quark.cn/s/a6ecc4988679" readonly>
                <button id="copy-button">复制链接</button>
                <button id="close-download">关闭</button>
            </div>
        </div>
        
        <div id="score-display">得分: 0</div>
        <div id="time-display">时间: 60</div>
        <button id="pause-button">暂停</button>
        <button id="help-button">帮助</button>
    </div>

    <script>
        // 游戏状态
        const gameState = {
            score: 0,
            timeLeft: 60,
            isPlaying: false,
            isPaused: false,
            fruits: [],
            slices: [],
            juices: [],
            trail: [],
            lastFruitSpawn: 0,
            fruitSpawnInterval: 800,
            trailLength: 10,
            mouseX: 0,
            mouseY: 0,
            isMouseDown: false,
            animationFrameId: null
        };
        
        // 水果类型
        const fruitTypes = [
            { name: 'apple', color: '#ff3b30', points: 1, image: '🍎' },
            { name: 'banana', color: '#ffcc00', points: 2, image: '🍌' },
            { name: 'orange', color: '#ff9500', points: 1, image: '🍊' },
            { name: 'watermelon', color: '#5ac8fa', points: 3, image: '🍉' },
            { name: 'bomb', color: '#000000', points: -5, image: '💣' }
        ];
        
        // DOM元素
        const gameContainer = document.getElementById('game-container');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const helpScreen = document.getElementById('help-screen');
        const downloadModal = document.getElementById('download-modal');
        const startButton = document.getElementById('start-button');
        const restartButton = document.getElementById('restart-button');
        const helpButtonStart = document.getElementById('help-button-start');
        const downloadButtonStart = document.getElementById('download-button-start');
        const helpButton = document.getElementById('help-button');
        const closeHelpButton = document.getElementById('close-help-button');
        const pauseButton = document.getElementById('pause-button');
        const downloadLink = document.getElementById('download-link');
        const copyButton = document.getElementById('copy-button');
        const closeDownload = document.getElementById('close-download');
        const scoreDisplay = document.getElementById('score-display');
        const timeDisplay = document.getElementById('time-display');
        const finalScoreDisplay = document.getElementById('final-score');
        
        // 初始化游戏
        function initGame() {
            // 清除所有水果和切片
            clearGameElements();
            
            // 重置游戏状态
            gameState.score = 0;
            gameState.timeLeft = 60;
            gameState.isPlaying = true;
            gameState.isPaused = false;
            gameState.fruits = [];
            gameState.slices = [];
            gameState.juices = [];
            gameState.trail = [];
            
            // 更新显示
            updateScore();
            updateTime();
            pauseButton.textContent = '暂停';
            
            // 隐藏开始界面，显示游戏
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            helpScreen.style.display = 'none';
            downloadModal.style.display = 'none';
            
            // 开始游戏循环
            gameLoop();
        }
        
        // 游戏主循环
        function gameLoop() {
            if (!gameState.isPlaying || gameState.isPaused) return;
            
            // 生成水果
            spawnFruit();
            
            // 更新水果位置
            updateFruits();
            
            // 更新切片
            updateSlices();
            
            // 更新果汁粒子
            updateJuices();
            
            // 更新鼠标轨迹
            updateTrail();
            
            // 继续循环
            gameState.animationFrameId = requestAnimationFrame(gameLoop);
        }
        
        // 生成水果
        function spawnFruit() {
            const now = Date.now();
            if (now - gameState.lastFruitSpawn < gameState.fruitSpawnInterval) return;
            
            gameState.lastFruitSpawn = now;
            
            const fruitType = fruitTypes[Math.floor(Math.random() * fruitTypes.length)];
            
            const fruit = document.createElement('div');
            fruit.className = 'fruit';
            fruit.dataset.type = fruitType.name;
            fruit.dataset.points = fruitType.points;
            fruit.style.color = fruitType.color;
            fruit.textContent = fruitType.image;
            
            const x = Math.random() * (window.innerWidth - 60);
            const y = window.innerHeight * 0.8;
            
            fruit.style.left = x + 'px';
            fruit.style.top = y + 'px';
            
            const speed = 6 + Math.random() * 4;
            const angle = -Math.PI / 2 + (Math.random() * Math.PI / 3 - Math.PI / 6);
            
            gameState.fruits.push({
                element: fruit,
                x: x,
                y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                rotation: Math.random() * 360,
                rotationSpeed: (Math.random() - 0.5) * 10,
                gravity: 0.1,
                isCut: false
            });
            
            gameContainer.appendChild(fruit);
        }
        
        // 更新水果位置
        function updateFruits() {
            for (let i = gameState.fruits.length - 1; i >= 0; i--) {
                const fruit = gameState.fruits[i];
                
                if (fruit.isCut) {
                    fruit.vy += fruit.gravity * 0.5;
                } else {
                    fruit.vy += fruit.gravity;
                }
                
                fruit.x += fruit.vx;
                fruit.y += fruit.vy;
                fruit.rotation += fruit.rotationSpeed;
                
                fruit.element.style.left = fruit.x + 'px';
                fruit.element.style.top = fruit.y + 'px';
                fruit.element.style.transform = `rotate(${fruit.rotation}deg)`;
                
                if (fruit.y > window.innerHeight + 100 || 
                    fruit.x < -100 || 
                    fruit.x > window.innerWidth + 100) {
                    
                    if (!fruit.isCut && fruit.element.dataset.type !== 'bomb') {
                        gameState.score -= 1;
                        updateScore();
                    }
                    
                    gameContainer.removeChild(fruit.element);
                    gameState.fruits.splice(i, 1);
                }
            }
        }
        
        // 切开水果
        function cutFruit(fruit) {
            if (fruit.isCut) return;
            
            fruit.isCut = true;
            fruit.element.classList.add('cut');
            
            const points = parseInt(fruit.element.dataset.points);
            gameState.score += points;
            updateScore();
            
            if (fruit.element.dataset.type === 'bomb') {
                createExplosion(fruit.x, fruit.y);
                return;
            }
            
            createSlices(fruit);
            createJuice(fruit.x, fruit.y, fruit.element.dataset.type);
        }
        
        // 创建切片
        function createSlices(fruit) {
            const type = fruit.element.dataset.type;
            const color = fruitTypes.find(f => f.name === type).color;
            
            for (let i = 0; i < 2; i++) {
                const slice = document.createElement('div');
                slice.className = 'slice';
                slice.style.color = color;
                slice.textContent = fruit.element.textContent;
                
                slice.style.left = fruit.x + 'px';
                slice.style.top = fruit.y + 'px';
                
                const angle = i === 0 ? Math.PI / 4 : -Math.PI / 4;
                const speed = 3 + Math.random() * 2;
                
                gameState.slices.push({
                    element: slice,
                    x: fruit.x,
                    y: fruit.y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    rotation: fruit.rotation,
                    rotationSpeed: (Math.random() - 0.5) * 20,
                    gravity: 0.2,
                    life: 100 + Math.random() * 50
                });
                
                gameContainer.appendChild(slice);
            }
        }
        
        // 更新切片
        function updateSlices() {
            for (let i = gameState.slices.length - 1; i >= 0; i--) {
                const slice = gameState.slices[i];
                
                slice.vy += slice.gravity;
                slice.x += slice.vx;
                slice.y += slice.vy;
                slice.rotation += slice.rotationSpeed;
                slice.life--;
                
                slice.element.style.left = slice.x + 'px';
                slice.element.style.top = slice.y + 'px';
                slice.element.style.transform = `rotate(${slice.rotation}deg)`;
                slice.element.style.opacity = slice.life / 150;
                
                if (slice.life <= 0 || 
                    slice.y > window.innerHeight + 100 || 
                    slice.x < -100 || 
                    slice.x > window.innerWidth + 100) {
                    
                    gameContainer.removeChild(slice.element);
                    gameState.slices.splice(i, 1);
                }
            }
        }
        
        // 创建果汁粒子
        function createJuice(x, y, type) {
            const color = fruitTypes.find(f => f.name === type).color;
            const particleCount = 10 + Math.floor(Math.random() * 10);
            
            for (let i = 0; i < particleCount; i++) {
                const juice = document.createElement('div');
                juice.className = 'juice';
                juice.style.backgroundColor = color;
                
                juice.style.left = x + 'px';
                juice.style.top = y + 'px';
                
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 3;
                const size = 5 + Math.random() * 10;
                const life = 30 + Math.random() * 50;
                
                gameState.juices.push({
                    element: juice,
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: size,
                    life: life,
                    gravity: 0.1
                });
                
                gameContainer.appendChild(juice);
            }
        }
        
        // 更新果汁粒子
        function updateJuices() {
            for (let i = gameState.juices.length - 1; i >= 0; i--) {
                const juice = gameState.juices[i];
                
                juice.vy += juice.gravity;
                juice.x += juice.vx;
                juice.y += juice.vy;
                juice.life--;
                
                juice.element.style.left = juice.x + 'px';
                juice.element.style.top = juice.y + 'px';
                juice.element.style.width = juice.size + 'px';
                juice.element.style.height = juice.size + 'px';
                juice.element.style.opacity = juice.life / 80;
                
                if (juice.life <= 0) {
                    gameContainer.removeChild(juice.element);
                    gameState.juices.splice(i, 1);
                }
            }
        }
        
        // 创建爆炸效果
        function createExplosion(x, y) {
            const particleCount = 20;
            const explosionColor = '#ff0000';
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'juice';
                particle.style.backgroundColor = explosionColor;
                
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 5;
                const size = 10 + Math.random() * 20;
                const life = 40 + Math.random() * 60;
                
                gameState.juices.push({
                    element: particle,
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: size,
                    life: life,
                    gravity: 0.05
                });
                
                gameContainer.appendChild(particle);
            }
        }
        
        // 更新分数显示
        function updateScore() {
            scoreDisplay.textContent = `得分: ${gameState.score}`;
        }
        
        // 更新时间显示
        function updateTime() {
            timeDisplay.textContent = `时间: ${gameState.timeLeft}`;
            
            if (gameState.isPlaying && !gameState.isPaused) {
                gameState.timeLeft--;
                
                if (gameState.timeLeft > 0) {
                    setTimeout(updateTime, 1000);
                } else {
                    endGame();
                }
            }
        }
        
        // 暂停/继续游戏
        function togglePause() {
            gameState.isPaused = !gameState.isPaused;
            
            if (gameState.isPaused) {
                pauseButton.textContent = '继续';
                cancelAnimationFrame(gameState.animationFrameId);
            } else {
                pauseButton.textContent = '暂停';
                gameLoop();
            }
        }
        
        // 显示帮助界面
        function showHelp() {
            if (gameState.isPlaying && !gameState.isPaused) {
                togglePause();
            }
            helpScreen.style.display = 'flex';
        }
        
        // 关闭帮助界面
        function closeHelp() {
            helpScreen.style.display = 'none';
            if (gameState.isPlaying) {
                togglePause();
            }
        }
        
        // 显示下载弹窗
        function showDownloadModal() {
            if (gameState.isPlaying && !gameState.isPaused) {
                togglePause();
            }
            downloadModal.style.display = 'flex';
        }
        
        // 关闭下载弹窗
        function closeDownloadModal() {
            downloadModal.style.display = 'none';
            if (gameState.isPlaying) {
                togglePause();
            }
        }
        
        // 复制下载链接
        function copyDownloadLink() {
            downloadLink.select();
            document.execCommand('copy');
            
            // 显示复制成功提示
            const originalText = copyButton.textContent;
            copyButton.textContent = '已复制!';
            setTimeout(() => {
                copyButton.textContent = originalText;
            }, 2000);
        }
        
        // 结束游戏
        function endGame() {
            gameState.isPlaying = false;
            finalScoreDisplay.textContent = `得分: ${gameState.score}`;
            gameOverScreen.style.display = 'flex';
        }
        
        // 清除所有游戏元素
        function clearGameElements() {
            gameState.fruits.forEach(fruit => {
                if (fruit.element.parentNode) {
                    gameContainer.removeChild(fruit.element);
                }
            });
            
            gameState.slices.forEach(slice => {
                if (slice.element.parentNode) {
                    gameContainer.removeChild(slice.element);
                }
            });
            
            gameState.juices.forEach(juice => {
                if (juice.element.parentNode) {
                    gameContainer.removeChild(juice.element);
                }
            });
            
            gameState.trail.forEach(t => {
                if (t.element.parentNode) {
                    gameContainer.removeChild(t.element);
                }
            });
        }
        
        // 更新鼠标轨迹
        function updateTrail() {
            if (!gameState.isMouseDown) return;
            
            const trailDot = document.createElement('div');
            trailDot.className = 'trail';
            trailDot.style.left = gameState.mouseX + 'px';
            trailDot.style.top = gameState.mouseY + 'px';
            
            gameContainer.appendChild(trailDot);
            
            gameState.trail.push({
                element: trailDot,
                life: gameState.trailLength
            });
            
            for (let i = gameState.trail.length - 1; i >= 0; i--) {
                const dot = gameState.trail[i];
                dot.life--;
                dot.element.style.opacity = dot.life / gameState.trailLength;
                
                if (dot.life <= 0) {
                    gameContainer.removeChild(dot.element);
                    gameState.trail.splice(i, 1);
                }
            }
            
            checkFruitCollision();
        }
        
        // 检查轨迹与水果的碰撞
        function checkFruitCollision() {
            if (gameState.trail.length < 2) return;
            
            const point1 = gameState.trail[gameState.trail.length - 2];
            const point2 = gameState.trail[gameState.trail.length - 1];
            
            if (!point1 || !point2) return;
            
            const x1 = parseFloat(point1.element.style.left);
            const y1 = parseFloat(point1.element.style.top);
            const x2 = parseFloat(point2.element.style.left);
            const y2 = parseFloat(point2.element.style.top);
            
            for (let i = gameState.fruits.length - 1; i >= 0; i--) {
                const fruit = gameState.fruits[i];
                
                if (fruit.isCut) continue;
                
                const fruitX = fruit.x + 30;
                const fruitY = fruit.y + 30;
                const radius = 30;
                
                const distance = pointToLineDistance(fruitX, fruitY, x1, y1, x2, y2);
                
                if (distance <= radius) {
                    cutFruit(fruit);
                }
            }
        }
        
        // 计算点到线段的距离
        function pointToLineDistance(px, py, x1, y1, x2, y2) {
            const A = px - x1;
            const B = py - y1;
            const C = x2 - x1;
            const D = y2 - y1;
            
            const dot = A * C + B * D;
            const len_sq = C * C + D * D;
            let param = -1;
            
            if (len_sq !== 0) {
                param = dot / len_sq;
            }
            
            let xx, yy;
            
            if (param < 0) {
                xx = x1;
                yy = y1;
            } else if (param > 1) {
                xx = x2;
                yy = y2;
            } else {
                xx = x1 + param * C;
                yy = y1 + param * D;
            }
            
            const dx = px - xx;
            const dy = py - yy;
            
            return Math.sqrt(dx * dx + dy * dy);
        }
        
        // 事件监听器
        startButton.addEventListener('click', initGame);
        restartButton.addEventListener('click', initGame);
        helpButtonStart.addEventListener('click', showHelp);
        downloadButtonStart.addEventListener('click', showDownloadModal);
        helpButton.addEventListener('click', showHelp);
        closeHelpButton.addEventListener('click', closeHelp);
        pauseButton.addEventListener('click', togglePause);
        copyButton.addEventListener('click', copyDownloadLink);
        closeDownload.addEventListener('click', closeDownloadModal);
        
        // 鼠标事件
        gameContainer.addEventListener('mousemove', (e) => {
            gameState.mouseX = e.clientX;
            gameState.mouseY = e.clientY;
        });
        
        gameContainer.addEventListener('mousedown', () => {
            gameState.isMouseDown = true;
        });
        
        gameContainer.addEventListener('mouseup', () => {
            gameState.isMouseDown = false;
        });
        
        gameContainer.addEventListener('mouseleave', () => {
            gameState.isMouseDown = false;
        });
        
        // 触摸事件
        gameContainer.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            gameState.mouseX = touch.clientX;
            gameState.mouseY = touch.clientY;
            gameState.isMouseDown = true;
        }, { passive: false });
        
        gameContainer.addEventListener('touchend', () => {
            gameState.isMouseDown = false;
        });
        
        // 窗口大小调整
        window.addEventListener('resize', () => {
            // 响应式调整
        });
    </script>
</body>
</html>
