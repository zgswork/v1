        // 获取DOM元素
        const generateBtn = document.getElementById('generateBtn');
        const changeBtn = document.getElementById('changeBtn');
        const attractionInfo = document.getElementById('attractionInfo');
        const downloadBtn = document.getElementById('downloadBtn');
        const modal = document.getElementById('downloadModal');
        const closeBtn = document.querySelector('.close');
        
        // 存储已显示的景点索引
        let shownAttractions = [];
        
        // 生成随机景点
        function generateRandomAttraction() {
            // 如果所有景点都已显示过，重置列表
            if (shownAttractions.length === attractions.length) {
                shownAttractions = [];
            }
            
            // 获取未显示的随机景点
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * attractions.length);
            } while (shownAttractions.includes(randomIndex));
            
            shownAttractions.push(randomIndex);
            return attractions[randomIndex];
        }
        
        // 显示景点信息
        function displayAttraction(attraction) {
            attractionInfo.innerHTML = `
                <h2>${attraction.name}</h2>
                <div class="info-item"><strong>介绍:</strong> ${attraction.description}</div>
                <div class="info-item"><strong>地址:</strong> ${attraction.address}</div>
                <div class="info-item"><strong>交通:</strong> ${attraction.transport}</div>
                <div class="info-item"><strong>门票:</strong> ${attraction.ticket}</div>
                <div class="info-item"><strong>开放时间:</strong> ${attraction.opening}</div>
            `;
            attractionInfo.style.display = 'block';
            changeBtn.disabled = false;
        }
        
        // 按钮事件监听
        generateBtn.addEventListener('click', function() {
            const attraction = generateRandomAttraction();
            displayAttraction(attraction);
        });
        
        changeBtn.addEventListener('click', function() {
            const attraction = generateRandomAttraction();
            displayAttraction(attraction);
        });
        
        // 下载按钮事件监听
        downloadBtn.addEventListener('click', function() {
            modal.style.display = 'block';
        });
        
        // 关闭弹窗
        closeBtn.addEventListener('click', function() {
            modal.style.display = 'none';
        });
        
        // 点击弹窗外部关闭
        window.addEventListener('click', function(event) {
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        });
    </script>
