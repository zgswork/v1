<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的游戏日记</title>
    <style>
        :root {
            --primary-color: #6a5acd;
            --secondary-color: #9370db;
            --background-color: #f8f9fa;
            --text-color: #333;
            --card-color: #fff;
        }
        
        body.dark-mode {
            --primary-color: #9370db;
            --secondary-color: #6a5acd;
            --background-color: #1a1a1a;
            --text-color: #f0f0f0;
            --card-color: #2d2d2d;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            transition: all 0.3s ease;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--secondary-color);
        }
        
        h1 {
            color: var(--primary-color);
        }
        
        .theme-toggle {
            background: none;
            border: none;
            color: var(--primary-color);
            cursor: pointer;
            font-size: 1.2rem;
        }
        
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
        }
        
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
        }
        
        .tab.active {
            border-bottom: 3px solid var(--primary-color);
            font-weight: bold;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: var(--card-color);
            color: var(--text-color);
        }
        
        textarea {
            min-height: 150px;
            resize: vertical;
        }
        
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: var(--secondary-color);
        }
        
        .game-card {
            background-color: var(--card-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .game-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .game-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
        }
        
        .game-platform {
            background-color: var(--secondary-color);
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
        }
        
        .game-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: #666;
        }
        
        .game-meta span {
            display: flex;
            align-items: center;
        }
        
        .game-meta i {
            margin-right: 5px;
        }
        
        .mood-emoji {
            font-size: 1.2rem;
        }
        
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background-color: var(--card-color);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 10px 0;
        }
        
        .hidden {
            display: none;
        }
        
        @media (max-width: 768px) {
            .stats-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>我的游戏日记</h1>
        <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
    </header>
    
    <div class="tabs">
        <div class="tab active" onclick="openTab('add-game')">添加记录</div>
        <div class="tab" onclick="openTab('timeline')">时间线</div>
        <div class="tab" onclick="openTab('library')">游戏库</div>
        <div class="tab" onclick="openTab('stats')">统计</div>
    </div>
    
    <div id="add-game" class="tab-content active">
        <form id="game-form">
            <div class="form-group">
                <label for="game-name">游戏名称</label>
                <input type="text" id="game-name" required>
            </div>
            
            <div class="form-group">
                <label for="game-platform">平台</label>
                <select id="game-platform" required>
                    <option value="">选择平台</option>
                    <option value="PC">PC</option>
                    <option value="PS5">PS5</option>
                    <option value="Xbox">Xbox</option>
                    <option value="Switch">Switch</option>
                    <option value="手机">手机</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="start-date">开始日期</label>
                <input type="date" id="start-date" required>
            </div>
            
            <div class="form-group">
                <label for="end-date">结束日期（可选）</label>
                <input type="date" id="end-date">
            </div>
            
            <div class="form-group">
                <label for="play-time">游戏时长（小时）</label>
                <input type="number" id="play-time" min="0" step="0.1">
            </div>
            
            <div class="form-group">
                <label>进度状态</label>
                <div>
                    <input type="radio" id="status-playing" name="status" value="进行中" checked>
                    <label for="status-playing">进行中</label>
                    
                    <input type="radio" id="status-completed" name="status" value="已通关">
                    <label for="status-completed">已通关</label>
                    
                    <input type="radio" id="status-dropped" name="status" value="弃坑">
                    <label for="status-dropped">弃坑</label>
                </div>
            </div>
            
            <div class="form-group">
                <label for="game-mood">游戏心情</label>
                <select id="game-mood" required>
                    <option value="😊">😊 喜欢</option>
                    <option value="😟">😟 一般</option>
                    <option value="😠">😠 不喜欢</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="game-moments">关键瞬间（可选，用逗号分隔）</label>
                <input type="text" id="game-moments" placeholder="例如: 最终boss战, 剧情转折点">
            </div>
            
            <div class="form-group">
                <label for="game-notes">游戏笔记</label>
                <textarea id="game-notes" placeholder="写下你的游戏感受..."></textarea>
            </div>
            
            <button type="submit">保存记录</button>
        </form>
    </div>
    
    <div id="timeline" class="tab-content">
        <h2>游戏时间线</h2>
        <div id="timeline-content"></div>
    </div>
    
    <div id="library" class="tab-content">
        <h2>游戏库</h2>
        <div id="filter-controls">
            <select id="filter-platform">
                <option value="">所有平台</option>
                <option value="PC">PC</option>
                <option value="PS5">PS5</option>
                <option value="Xbox">Xbox</option>
                <option value="Switch">Switch</option>
                <option value="手机">手机</option>
                <option value="其他">其他</option>
            </select>
            
            <select id="filter-status">
                <option value="">所有状态</option>
                <option value="进行中">进行中</option>
                <option value="已通关">已通关</option>
                <option value="弃坑">弃坑</option>
            </select>
            
            <select id="filter-mood">
                <option value="">所有心情</option>
                <option value="😊">喜欢</option>
                <option value="😟">一般</option>
                <option value="😠">不喜欢</option>
            </select>
        </div>
        <div id="library-content"></div>
    </div>
    
    <div id="stats" class="tab-content">
        <h2>游戏统计</h2>
        <div class="stats-container">
            <div class="stat-card">
                <div>总游戏数</div>
                <div class="stat-value" id="total-games">0</div>
            </div>
            
            <div class="stat-card">
                <div>总游戏时长</div>
                <div class="stat-value" id="total-hours">0</div>
                <div>小时</div>
            </div>
            
            <div class="stat-card">
                <div>已通关</div>
                <div class="stat-value" id="completed-games">0</div>
            </div>
            
            <div class="stat-card">
                <div>进行中</div>
                <div class="stat-value" id="playing-games">0</div>
            </div>
        </div>
        
        <h3>平台分布</h3>
        <div id="platform-chart"></div>
        
        <h3>心情分布</h3>
        <div id="mood-chart"></div>
    </div>
    
    <script>
        // 初始化数据
        let games = JSON.parse(localStorage.getItem('gameDiary')) || [];
        
        // DOM加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 检查主题偏好
            if (localStorage.getItem('darkMode') === 'true') {
                document.body.classList.add('dark-mode');
            }
            
            // 设置今天为默认开始日期
            document.getElementById('start-date').valueAsDate = new Date();
            
            // 表单提交事件
            document.getElementById('game-form').addEventListener('submit', function(e) {
                e.preventDefault();
                saveGame();
            });
            
            // 筛选器事件
            document.getElementById('filter-platform').addEventListener('change', renderLibrary);
            document.getElementById('filter-status').addEventListener('change', renderLibrary);
            document.getElementById('filter-mood').addEventListener('change', renderLibrary);
            
            // 初始渲染
            renderTimeline();
            renderLibrary();
            updateStats();
        });
        
        // 保存游戏记录
        function saveGame() {
            const gameName = document.getElementById('game-name').value;
            const platform = document.getElementById('game-platform').value;
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            const playTime = parseFloat(document.getElementById('play-time').value) || 0;
            const status = document.querySelector('input[name="status"]:checked').value;
            const mood = document.getElementById('game-mood').value;
            const moments = document.getElementById('game-moments').value;
            const notes = document.getElementById('game-notes').value;
            
            const game = {
                id: Date.now(),
                name: gameName,
                platform: platform,
                startDate: startDate,
                endDate: endDate,
                playTime: playTime,
                status: status,
                mood: mood,
                moments: moments ? moments.split(',') : [],
                notes: notes,
                createdAt: new Date().toISOString()
            };
            
            games.unshift(game);
            saveToLocalStorage();
            
            // 重置表单
            document.getElementById('game-form').reset();
            document.getElementById('start-date').valueAsDate = new Date();
            
            // 更新UI
            renderTimeline();
            renderLibrary();
            updateStats();
            
            alert('游戏记录已保存！');
        }
        
        // 保存到本地存储
        function saveToLocalStorage() {
            localStorage.setItem('gameDiary', JSON.stringify(games));
        }
        
        // 切换标签页
        function openTab(tabName) {
            // 隐藏所有标签内容
            const tabContents = document.getElementsByClassName('tab-content');
            for (let i = 0; i < tabContents.length; i++) {
                tabContents[i].classList.remove('active');
            }
            
            // 取消所有标签的活动状态
            const tabs = document.getElementsByClassName('tab');
            for (let i = 0; i < tabs.length; i++) {
                tabs[i].classList.remove('active');
            }
            
            // 显示当前标签内容并设置活动状态
            document.getElementById(tabName).classList.add('active');
            event.currentTarget.classList.add('active');
            
            // 如果是统计标签，更新统计数据
            if (tabName === 'stats') {
                updateStats();
            }
        }
        
        // 渲染时间线
        function renderTimeline() {
            const timelineContent = document.getElementById('timeline-content');
            timelineContent.innerHTML = '';
            
            if (games.length === 0) {
                timelineContent.innerHTML = '<p>暂无游戏记录，快去添加吧！</p>';
                return;
            }
            
            // 按日期排序（最新的在前面）
            const sortedGames = [...games].sort((a, b) => new Date(b.startDate) - new Date(a.startDate));
            
            sortedGames.forEach(game => {
                const gameCard = document.createElement('div');
                gameCard.className = 'game-card';
                
                const startDate = formatDate(game.startDate);
                const endDate = game.endDate ? formatDate(game.endDate) : '至今';
                
                gameCard.innerHTML = `
                    <div class="game-header">
                        <div class="game-title">${game.name}</div>
                        <div class="game-platform">${game.platform}</div>
                    </div>
                    <div class="game-meta">
                        <span><i>📅</i> ${startDate} ~ ${endDate}</span>
                        <span><i>⏱️</i> ${game.playTime || '0'} 小时</span>
                        <span><i>${game.mood}</i> ${getMoodText(game.mood)}</span>
                        <span><i>📊</i> ${game.status}</span>
                    </div>
                    ${game.notes ? `<p>${game.notes}</p>` : ''}
                    ${game.moments.length > 0 ? `
                        <div class="game-moments">
                            <strong>关键瞬间:</strong> ${game.moments.join(', ')}
                        </div>
                    ` : ''}
                `;
                
                timelineContent.appendChild(gameCard);
            });
        }
        
        // 渲染游戏库
        function renderLibrary() {
            const libraryContent = document.getElementById('library-content');
            libraryContent.innerHTML = '';
            
            if (games.length === 0) {
                libraryContent.innerHTML = '<p>游戏库为空，快去添加游戏吧！</p>';
                return;
            }
            
            const platformFilter = document.getElementById('filter-platform').value;
            const statusFilter = document.getElementById('filter-status').value;
            const moodFilter = document.getElementById('filter-mood').value;
            
            const filteredGames = games.filter(game => {
                return (!platformFilter || game.platform === platformFilter) &&
                       (!statusFilter || game.status === statusFilter) &&
                       (!moodFilter || game.mood === moodFilter);
            });
            
            if (filteredGames.length === 0) {
                libraryContent.innerHTML = '<p>没有匹配的游戏记录</p>';
                return;
            }
            
            // 按游戏名称排序
            const sortedGames = [...filteredGames].sort((a, b) => a.name.localeCompare(b.name));
            
            sortedGames.forEach(game => {
                const gameCard = document.createElement('div');
                gameCard.className = 'game-card';
                
                const startDate = formatDate(game.startDate);
                const endDate = game.endDate ? formatDate(game.endDate) : '进行中';
                
                gameCard.innerHTML = `
                    <div class="game-header">
                        <div class="game-title">${game.name}</div>
                        <div class="game-platform">${game.platform}</div>
                    </div>
                    <div class="game-meta">
                        <span><i>📅</i> ${startDate} ~ ${endDate}</span>
                        <span><i>⏱️</i> ${game.playTime || '0'} 小时</span>
                        <span class="mood-emoji">${game.mood}</span>
                        <span><i>📊</i> ${game.status}</span>
                    </div>
                    ${game.notes ? `<p class="game-notes">${game.notes}</p>` : ''}
                    <button onclick="deleteGame(${game.id})">删除</button>
                `;
                
                libraryContent.appendChild(gameCard);
            });
        }
        
        // 更新统计数据
        function updateStats() {
            document.getElementById('total-games').textContent = games.length;
            
            const totalHours = games.reduce((sum, game) => sum + (game.playTime || 0), 0);
            document.getElementById('total-hours').textContent = totalHours.toFixed(1);
            
            const completedGames = games.filter(game => game.status === '已通关').length;
            document.getElementById('completed-games').textContent = completedGames;
            
            const playingGames = games.filter(game => game.status === '进行中').length;
            document.getElementById('playing-games').textContent = playingGames;
            
            // 简单平台分布图表
            const platformChart = document.getElementById('platform-chart');
            platformChart.innerHTML = '';
            
            const platformCounts = {};
            games.forEach(game => {
                platformCounts[game.platform] = (platformCounts[game.platform] || 0) + 1;
            });
            
            for (const platform in platformCounts) {
                const count = platformCounts[platform];
                const bar = document.createElement('div');
                bar.style.margin = '5px 0';
                bar.innerHTML = `
                    <div style="display: flex; justify-content: space-between;">
                        <span>${platform}</span>
                        <span>${count}</span>
                    </div>
                    <div style="height: 10px; background: #ddd; width: 100%; border-radius: 5px;">
                        <div style="height: 100%; width: ${(count / games.length) * 100}%; 
                             background: var(--primary-color); border-radius: 5px;"></div>
                    </div>
                `;
                platformChart.appendChild(bar);
            }
            
            // 简单心情分布图表
            const moodChart = document.getElementById('mood-chart');
            moodChart.innerHTML = '';
            
            const moodCounts = {
                '😊': 0,
                '😟': 0,
                '😠': 0
            };
            
            games.forEach(game => {
                moodCounts[game.mood]++;
            });
            
            for (const mood in moodCounts) {
                const count = moodCounts[mood];
                const bar = document.createElement('div');
                bar.style.margin = '5px 0';
                bar.innerHTML = `
                    <div style="display: flex; justify-content: space-between;">
                        <span>${mood} ${getMoodText(mood)}</span>
                        <span>${count}</span>
                    </div>
                    <div style="height: 10px; background: #ddd; width: 100%; border-radius: 5px;">
                        <div style="height: 100%; width: ${(count / games.length) * 100}%; 
                             background: var(--primary-color); border-radius: 5px;"></div>
                    </div>
                `;
                moodChart.appendChild(bar);
            }
        }
        
        // 删除游戏
        function deleteGame(id) {
            if (confirm('确定要删除这条游戏记录吗？')) {
                games = games.filter(game => game.id !== id);
                saveToLocalStorage();
                renderTimeline();
                renderLibrary();
                updateStats();
            }
        }
        
        // 切换主题
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark);
        }
        
        // 辅助函数：格式化日期
        function formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toLocaleDateString('zh-CN');
        }
        
        // 辅助函数：获取心情文本
        function getMoodText(mood) {
            switch (mood) {
                case '😊': return '喜欢';
                case '😟': return '一般';
                case '😠': return '不喜欢';
                default: return '';
            }
        }
    </script>
</body>
</html>
