        // 获取DOM元素
        const recommendBtn = document.getElementById('recommendBtn');
        const changeBtn = document.getElementById('changeBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const movieInfo = document.getElementById('movieInfo');
        const welcomeMessage = document.querySelector('.welcome-message');
        const modal = document.getElementById('downloadModal');
        const span = document.getElementsByClassName('close')[0];
        
        let currentMovieIndex = -1;
        
        // 随机推荐电影函数
        function recommendRandomMovie() {
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * movies.length);
            } while (randomIndex === currentMovieIndex && movies.length > 1);
            
            currentMovieIndex = randomIndex;
            const movie = movies[currentMovieIndex];
            
            // 生成星级评分
            const starCount = Math.round(movie.rating / 4.8 * 5);
            const stars = '★'.repeat(starCount) + '☆'.repeat(5 - starCount);
            
            // 显示电影信息
            movieInfo.innerHTML = `
                <h2 class="movie-title">${movie.title}</h2>
                <div class="movie-meta">
                    <div class="meta-item">
                        <span class="meta-label">国家:</span>
                        <span>${movie.country}</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">主演:</span>
                        <span>${movie.actors}</span>
                    </div>
                </div>
                <div class="stars">${stars}</div>
                <p class="movie-description">${movie.description}</p>
                <div class="recommend-reason">
                    <strong>推荐理由:</strong> ${movie.reason}
                </div>
            `;
            
            // 切换显示
            movieInfo.classList.add('active');
            welcomeMessage.style.display = 'none';
            recommendBtn.style.display = 'none';
            changeBtn.style.display = 'block';
        }
        
        // 点击下载按钮显示弹窗
        downloadBtn.onclick = function() {
            modal.style.display = "block";
        }
        
        // 点击关闭按钮隐藏弹窗
        span.onclick = function() {
            modal.style.display = "none";
        }
        
        // 点击弹窗外部区域隐藏弹窗
        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
        
        // 事件监听
        recommendBtn.addEventListener('click', recommendRandomMovie);
        changeBtn.addEventListener('click', recommendRandomMovie);
    </script>
