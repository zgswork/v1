<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情绪垃圾桶</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .header {
            text-align: center;
            padding: 20px;
        }
        
        .title {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.8;
        }
        
        .workspace {
            display: flex;
            width: 100%;
            max-width: 1000px;
            height: 60vh;
            flex-grow: 1;
        }
        
        .creation-panel {
            width: 40%;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        
        .trash-can-area {
            width: 60%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        
        .trash-can {
            width: 200px;
            height: 250px;
            background: linear-gradient(160deg, #4a4a4a, #2b2b2b);
            border-radius: 0 0 20px 20px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 10;
            overflow: hidden;
        }
        
        .trash-can:before {
            content: '';
            position: absolute;
            top: -20px;
            left: 10px;
            right: 10px;
            height: 40px;
            background: linear-gradient(160deg, #6a6a6a, #4a4a4a);
            border-radius: 10px 10px 0 0;
        }
        
        .trash-can:after {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 15px;
            background: #333;
            border-radius: 5px;
        }
        
        .emotion-input {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        
        textarea {
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 15px;
            color: white;
            font-size: 1rem;
            margin-bottom: 15px;
            resize: none;
        }
        
        .sticker-selection {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .sticker {
            font-size: 2rem;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .sticker:hover {
            transform: scale(1.2);
        }
        
        button {
            background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 25px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
            margin-bottom: 10px;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 20px rgba(255, 107, 107, 0.6);
        }
        
        .emotion-bubble {
            position: absolute;
            background: rgba(255, 107, 107, 0.8);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.1s;
            z-index: 5;
        }
        
        .emotion-bubble.text {
            font-size: 1rem;
            padding: 10px;
            text-align: center;
            word-break: break-word;
        }
        
        .counter {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1.2rem;
        }
        
        .trash-contents {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .particle {
            position: absolute;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            animation: fadeOut 1s forwards;
        }
        
        @keyframes fadeOut {
            to { opacity: 0; transform: translateY(20px); }
        }
        
        .empty-trash-btn {
            background: linear-gradient(135deg, #4a6bff, #6b8cff);
        }
        
        .selected-sticker {
            transform: scale(1.3);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
        }
        
        .click-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1rem;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="title">情绪垃圾桶</h1>
        <p class="subtitle">点击你的负面情绪，把它们扔进垃圾桶</p>
    </div>
    
    <div class="workspace">
        <div class="creation-panel">
            <div class="emotion-input">
                <textarea id="emotion-text" placeholder="写下你想丢弃的负面情绪..."></textarea>
                
                <div class="sticker-selection">
                    <div class="sticker" data-emoji="😠">😠</div>
                    <div class="sticker" data-emoji="😢">😢</div>
                    <div class="sticker" data-emoji="😩">😩</div>
                    <div class="sticker" data-emoji="😤">😤</div>
                    <div class="sticker" data-emoji="😰">😰</div>
                    <div class="sticker" data-emoji="😞">😞</div>
                    <div class="sticker" data-emoji="🤬">🤬</div>
                    <div class="sticker" data-emoji="😔">😔</div>
                </div>
                
                <button id="create-bubble">创建情绪垃圾</button>
                <button id="empty-trash" class="empty-trash-btn">清空垃圾桶</button>
            </div>
        </div>
        
        <div class="trash-can-area">
            <div class="trash-can">
                <div class="trash-contents"></div>
            </div>
        </div>
    </div>
    
    <div class="counter">今日已清理: <span id="trash-count">0</span> 份情绪垃圾</div>
    <div class="click-hint">点击情绪气泡扔进垃圾桶</div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const trashCan = document.querySelector('.trash-can');
            const trashContents = document.querySelector('.trash-contents');
            const trashCanArea = document.querySelector('.trash-can-area');
            const createButton = document.getElementById('create-bubble');
            const emptyButton = document.getElementById('empty-trash');
            const textarea = document.getElementById('emotion-text');
            const stickers = document.querySelectorAll('.sticker');
            const trashCountElement = document.getElementById('trash-count');
            const clickHint = document.querySelector('.click-hint');
            
            let trashCount = 0;
            
            // 选择表情 - 将表情插入输入框
            stickers.forEach(sticker => {
                sticker.addEventListener('click', function() {
                    const emoji = this.getAttribute('data-emoji');
                    
                    // 获取当前光标位置
                    const startPos = textarea.selectionStart;
                    const endPos = textarea.selectionEnd;
                    
                    // 插入表情到光标位置
                    textarea.value = textarea.value.substring(0, startPos) + 
                                     emoji + 
                                     textarea.value.substring(endPos);
                    
                    // 移动光标到插入的表情后面
                    textarea.selectionStart = textarea.selectionEnd = startPos + emoji.length;
                    
                    // 聚焦到输入框
                    textarea.focus();
                    
                    // 视觉反馈
                    stickers.forEach(s => s.classList.remove('selected-sticker'));
                    this.classList.add('selected-sticker');
                    
                    // 移除选中状态
                    setTimeout(() => {
                        this.classList.remove('selected-sticker');
                    }, 500);
                });
            });
            
            // 创建情绪泡泡
            createButton.addEventListener('click', function() {
                const text = textarea.value.trim();
                
                if (!text) {
                    alert('请写下你的情绪或添加表情');
                    return;
                }
                
                createEmotionBubble(text);
                textarea.value = '';
            });
            
            // 清空垃圾桶
            emptyButton.addEventListener('click', function() {
                const bubbles = trashContents.querySelectorAll('.emotion-bubble');
                if (bubbles.length === 0) {
                    alert('垃圾桶已经是空的啦！');
                    return;
                }
                
                // 创建粉碎动画
                createParticles(bubbles);
                
                // 移除所有气泡
                bubbles.forEach(bubble => bubble.remove());
                
                // 隐藏提示
                clickHint.style.display = 'none';
            });
            
            function createEmotionBubble(text) {
                const bubble = document.createElement('div');
                bubble.className = 'emotion-bubble text';
                
                // 随机大小和颜色
                const size = Math.max(Math.min(text.length * 8 + 40, 150), 60);
                const hue = Math.random() * 60 + 340; // 红色到紫色范围
                
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;
                bubble.style.background = `hsla(${hue}, 80%, 70%, 0.8)`;
                
                // 随机位置（在创建面板区域）
                const left = Math.random() * 200 + 20;
                const top = Math.random() * 200 + 100;
                
                bubble.style.left = `${left}px`;
                bubble.style.top = `${top}px`;
                
                // 设置内容
                bubble.textContent = text.length > 30 ? text.substring(0, 30) + '...' : text;
                
                // 添加到垃圾桶区域
                trashCanArea.appendChild(bubble);
                
                // 点击事件 - 扔进垃圾桶
                bubble.addEventListener('click', function() {
                    throwIntoTrash(bubble);
                });
                
                // 显示提示
                clickHint.style.display = 'block';
            }
            
            function throwIntoTrash(bubble) {
                // 禁用再次点击
                bubble.style.pointerEvents = 'none';
                
                const trashRect = trashCan.getBoundingClientRect();
                const bubbleRect = bubble.getBoundingClientRect();
                
                // 计算抛物线终点（垃圾桶内随机位置）
                const targetX = Math.random() * (trashRect.width - bubbleRect.width);
                const targetY = Math.random() * (trashRect.height - bubbleRect.height);
                
                // 起点坐标
                const startX = bubbleRect.left - trashRect.left;
                const startY = bubbleRect.top - trashRect.top;
                
                // 抛物线控制点
                const controlX = (startX + targetX) / 2;
                const controlY = startY - 100; // 抛物线高度
                
                // 动画参数
                const duration = 800; // 动画持续时间(ms)
                const startTime = performance.now();
                
                function animate(timestamp) {
                    const elapsed = timestamp - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    
                    // 计算贝塞尔曲线位置
                    const x = quadraticBezier(startX, controlX, targetX, progress);
                    const y = quadraticBezier(startY, controlY, targetY, progress);
                    
                    // 更新位置
                    bubble.style.left = `${x}px`;
                    bubble.style.top = `${y}px`;
                    
                    // 旋转效果
                    bubble.style.transform = `rotate(${progress * 720}deg)`;
                    
                    // 缩放效果
                    const scale = 1 - (progress * 0.2);
                    bubble.style.transform += ` scale(${scale})`;
                    
                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        // 动画完成，移动到垃圾桶内容区
                        bubble.style.position = 'absolute';
                        bubble.style.left = `${targetX}px`;
                        bubble.style.top = `${targetY}px`;
                        bubble.style.transform = 'none';
                        trashContents.appendChild(bubble);
                        
                        // 更新计数器
                        trashCount++;
                        trashCountElement.textContent = trashCount;
                        
                        // 如果没有气泡了，隐藏提示
                        const bubbles = trashCanArea.querySelectorAll('.emotion-bubble');
                        if (bubbles.length === 0) {
                            clickHint.style.display = 'none';
                        }
                    }
                }
                
                requestAnimationFrame(animate);
            }
            
            function quadraticBezier(p0, p1, p2, t) {
                return (1-t)*(1-t)*p0 + 2*(1-t)*t*p1 + t*t*p2;
            }
            
            function createParticles(bubbles) {
                bubbles.forEach(bubble => {
                    const rect = bubble.getBoundingClientRect();
                    const trashRect = trashCan.getBoundingClientRect();
                    
                    // 计算相对于垃圾桶的位置
                    const x = rect.left - trashRect.left;
                    const y = rect.top - trashRect.top;
                    
                    // 创建多个粒子
                    for (let i = 0; i < 10; i++) {
                        const particle = document.createElement('div');
                        particle.className = 'particle';
                        
                        // 随机大小和位置
                        const size = Math.random() * 5 + 2;
                        const offsetX = (Math.random() - 0.5) * 20;
                        const offsetY = (Math.random() - 0.5) * 20;
                        
                        particle.style.width = `${size}px`;
                        particle.style.height = `${size}px`;
                        particle.style.left = `${x + rect.width/2 + offsetX}px`;
                        particle.style.top = `${y + rect.height/2 + offsetY}px`;
                        particle.style.background = bubble.style.background;
                        
                        trashContents.appendChild(particle);
                        
                        // 动画结束后移除粒子
                        setTimeout(() => {
                            particle.remove();
                        }, 1000);
                    }
                });
            }
        });
    </script>
</body>
</html>
