<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q版打砖块游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            width: 375px;
            height: 667px;
            background: linear-gradient(180deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .game-header {
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .score-info {
            color: white;
            font-weight: bold;
        }

        .score {
            font-size: 18px;
            margin-bottom: 2px;
        }

        .level {
            font-size: 14px;
            opacity: 0.9;
        }

        .lives-container {
            display: flex;
            gap: 5px;
        }

        .life {
            width: 25px;
            height: 25px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .life::before {
            content: '♥';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 14px;
        }

        #gameCanvas {
            display: block;
            background: linear-gradient(180deg, #e3f2fd 0%, #bbdefb 100%);
            flex: 1;
        }

        .controls {
            height: 60px;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 0 0 20px 20px;
            flex-shrink: 0;
        }

        .control-btn {
            flex: 1;
            padding: 8px 12px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border: none;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
            transition: all 0.3s ease;
            height: 40px;
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 172, 254, 0.6);
        }

        .control-btn:active {
            transform: translateY(0);
        }

        .pause-btn {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%) !important;
        }

        .reset-btn {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%) !important;
        }

        .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .game-over-content {
            background: rgba(0, 0, 0, 0.6);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            color: white;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .game-over-title {
            font-size: 32px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .final-score {
            font-size: 24px;
            margin-bottom: 30px;
            color: #ffd700;
        }

        .restart-btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
        }

        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.6);
        }

        @media (max-width: 400px) {
            .game-container {
                width: 100vw;
                height: 100vh;
                border-radius: 0;
            }
            
            .controls {
                border-radius: 0;
            }
            
            .control-btn {
                font-size: 12px;
                padding: 6px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <div class="score-info">
                <div class="score">分数: <span id="scoreDisplay">0</span></div>
                <div class="level">关卡: <span id="levelDisplay">1</span></div>
            </div>
            <div class="lives-container" id="livesContainer">
                <div class="life"></div>
                <div class="life"></div>
                <div class="life"></div>
            </div>
        </div>

        <canvas id="gameCanvas" width="375" height="527"></canvas>

        <div class="controls">
            <button class="control-btn pause-btn" id="pauseBtn">暂停</button>
            <button class="control-btn reset-btn" id="resetBtn">重置游戏</button>
        </div>

        <div class="game-over-screen" id="gameOverScreen">
            <div class="game-over-content">
                <h2 class="game-over-title" id="gameOverTitle">游戏结束</h2>
                <div class="final-score">最终分数: <span id="finalScore">0</span></div>
                <button class="restart-btn" id="restartBtn">重新开始</button>
            </div>
        </div>
    </div>

    <script>
        class BreakoutGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.scoreDisplay = document.getElementById('scoreDisplay');
                this.levelDisplay = document.getElementById('levelDisplay');
                this.livesContainer = document.getElementById('livesContainer');
                this.gameOverScreen = document.getElementById('gameOverScreen');
                this.finalScore = document.getElementById('finalScore');
                this.gameOverTitle = document.getElementById('gameOverTitle');
                
                // 游戏状态
                this.gameState = 'playing'; // playing, paused, gameOver
                this.animationId = null;
                
                // 玩家数据
                this.score = 0;
                this.level = 1;
                this.lives = 3;
                this.maxLevel = 100;
                
                // 游戏对象
                this.paddle = null;
                this.ball = null;
                this.bricks = [];
                this.particles = [];
                
                // 控制
                this.keys = {};
                this.mouseX = 0;
                this.touchX = 0;
                
                this.init();
                this.loadGame();
                this.setupEventListeners();
                this.gameLoop();
            }
            
            init() {
                // 初始化挡板
                this.paddle = {
                    x: this.canvas.width / 2 - 50,
                    y: this.canvas.height - 25,
                    width: 100,
                    height: 15,
                    speed: 8
                };
                
                // 初始化球
                this.ball = {
                    x: this.canvas.width / 2,
                    y: this.canvas.height - 45,
                    radius: 8,
                    dx: 4,
                    dy: -4,
                    speed: 4
                };
                
                this.createBricks();
                this.updateUI();
            }
            
            createBricks() {
                this.bricks = [];
                const rows = Math.min(6 + Math.floor(this.level / 10), 12);
                const cols = 8;
                const brickWidth = (this.canvas.width - 40) / cols;
                const brickHeight = 25;
                const colors = [
                    '#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', 
                    '#ffeaa7', '#dda0dd', '#98d8c8', '#f7dc6f'
                ];
                
                for (let row = 0; row < rows; row++) {
                    for (let col = 0; col < cols; col++) {
                        this.bricks.push({
                            x: col * brickWidth + 20,
                            y: row * brickHeight + 50,
                            width: brickWidth - 2,
                            height: brickHeight - 2,
                            color: colors[row % colors.length],
                            destroyed: false,
                            health: Math.floor(this.level / 20) + 1
                        });
                    }
                }
            }
            
            setupEventListeners() {
                // 键盘控制
                document.addEventListener('keydown', (e) => {
                    this.keys[e.code] = true;
                    if (e.code === 'Space') {
                        e.preventDefault();
                        this.togglePause();
                    }
                });
                
                document.addEventListener('keyup', (e) => {
                    this.keys[e.code] = false;
                });
                
                // 鼠标控制
                this.canvas.addEventListener('mousemove', (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    this.mouseX = (e.clientX - rect.left) * (this.canvas.width / rect.width);
                });
                
                // 触摸控制
                this.canvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const rect = this.canvas.getBoundingClientRect();
                    this.touchX = (e.touches[0].clientX - rect.left) * (this.canvas.width / rect.width);
                }, { passive: false });
                
                // 按钮事件
                document.getElementById('pauseBtn').addEventListener('click', () => {
                    this.togglePause();
                });
                
                document.getElementById('resetBtn').addEventListener('click', () => {
                    this.resetGame();
                });
                
                document.getElementById('restartBtn').addEventListener('click', () => {
                    this.restartGame();
                });
            }
            
            update() {
                if (this.gameState !== 'playing') return;
                
                // 更新挡板位置
                if (this.keys['ArrowLeft'] || this.keys['KeyA']) {
                    this.paddle.x -= this.paddle.speed;
                }
                if (this.keys['ArrowRight'] || this.keys['KeyD']) {
                    this.paddle.x += this.paddle.speed;
                }
                
                // 鼠标/触摸控制挡板
                const targetX = this.touchX || this.mouseX;
                if (targetX > 0) {
                    this.paddle.x = targetX - this.paddle.width / 2;
                }
                
                // 限制挡板在画布内
                this.paddle.x = Math.max(0, Math.min(this.canvas.width - this.paddle.width, this.paddle.x));
                
                // 更新球的位置
                this.ball.x += this.ball.dx;
                this.ball.y += this.ball.dy;
                
                // 球与边界碰撞
                if (this.ball.x <= this.ball.radius || this.ball.x >= this.canvas.width - this.ball.radius) {
                    this.ball.dx = -this.ball.dx;
                    this.createParticles(this.ball.x, this.ball.y, '#4ecdc4');
                }
                
                if (this.ball.y <= this.ball.radius) {
                    this.ball.dy = -this.ball.dy;
                    this.createParticles(this.ball.x, this.ball.y, '#4ecdc4');
                }
                
                // 球与挡板碰撞
                if (this.ball.y + this.ball.radius >= this.paddle.y &&
                    this.ball.x >= this.paddle.x &&
                    this.ball.x <= this.paddle.x + this.paddle.width &&
                    this.ball.dy > 0) {
                    
                    const hitPos = (this.ball.x - this.paddle.x) / this.paddle.width;
                    this.ball.dx = (hitPos - 0.5) * 8;
                    this.ball.dy = -Math.abs(this.ball.dy);
                    this.createParticles(this.ball.x, this.ball.y, '#ffd700');
                }
                
                // 球掉落
                if (this.ball.y > this.canvas.height) {
                    this.lives--;
                    this.updateLives();
                    
                    if (this.lives <= 0) {
                        this.gameOver();
                    } else {
                        this.resetBall();
                    }
                }
                
                // 球与砖块碰撞
                this.checkBrickCollisions();
                
                // 更新粒子效果
                this.updateParticles();
                
                // 检查关卡完成
                if (this.bricks.every(brick => brick.destroyed)) {
                    this.nextLevel();
                }
            }
            
            checkBrickCollisions() {
                for (let brick of this.bricks) {
                    if (brick.destroyed) continue;
                    
                    if (this.ball.x + this.ball.radius >= brick.x &&
                        this.ball.x - this.ball.radius <= brick.x + brick.width &&
                        this.ball.y + this.ball.radius >= brick.y &&
                        this.ball.y - this.ball.radius <= brick.y + brick.height) {
                        
                        brick.health--;
                        if (brick.health <= 0) {
                            brick.destroyed = true;
                            this.score += 10 * this.level;
                            this.createParticles(brick.x + brick.width/2, brick.y + brick.height/2, brick.color);
                        }
                        
                        // 计算碰撞方向
                        const ballCenterX = this.ball.x;
                        const ballCenterY = this.ball.y;
                        const brickCenterX = brick.x + brick.width / 2;
                        const brickCenterY = brick.y + brick.height / 2;
                        
                        const dx = ballCenterX - brickCenterX;
                        const dy = ballCenterY - brickCenterY;
                        
                        if (Math.abs(dx) > Math.abs(dy)) {
                            this.ball.dx = -this.ball.dx;
                        } else {
                            this.ball.dy = -this.ball.dy;
                        }
                        
                        this.updateUI();
                        break;
                    }
                }
            }
            
            createParticles(x, y, color) {
                for (let i = 0; i < 8; i++) {
                    this.particles.push({
                        x: x,
                        y: y,
                        dx: (Math.random() - 0.5) * 8,
                        dy: (Math.random() - 0.5) * 8,
                        life: 30,
                        maxLife: 30,
                        color: color
                    });
                }
            }
            
            updateParticles() {
                this.particles = this.particles.filter(particle => {
                    particle.x += particle.dx;
                    particle.y += particle.dy;
                    particle.life--;
                    particle.dx *= 0.95;
                    particle.dy *= 0.95;
                    return particle.life > 0;
                });
            }
            
            render() {
                // 清空画布
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                // 绘制背景渐变
                const gradient = this.ctx.createLinearGradient(0, 0, 0, this.canvas.height);
                gradient.addColorStop(0, '#e3f2fd');
                gradient.addColorStop(1, '#bbdefb');
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // 绘制砖块
                this.renderBricks();
                
                // 绘制挡板
                this.renderPaddle();
                
                // 绘制球
                this.renderBall();
                
                // 绘制粒子效果
                this.renderParticles();
                
                // 绘制暂停提示
                if (this.gameState === 'paused') {
                    this.renderPauseScreen();
                }
            }
            
            renderBricks() {
                for (let brick of this.bricks) {
                    if (brick.destroyed) continue;
                    
                    this.ctx.save();
                    
                    // 砖块阴影
                    this.ctx.shadowColor = 'rgba(0,0,0,0.3)';
                    this.ctx.shadowBlur = 5;
                    this.ctx.shadowOffsetY = 2;
                    
                    // 砖块渐变
                    const gradient = this.ctx.createLinearGradient(brick.x, brick.y, brick.x, brick.y + brick.height);
                    gradient.addColorStop(0, brick.color);
                    gradient.addColorStop(1, this.darkenColor(brick.color, 0.3));
                    
                    this.ctx.fillStyle = gradient;
                    this.ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
                    
                    // 砖块边框
                    this.ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                    this.ctx.lineWidth = 1;
                    this.ctx.strokeRect(brick.x, brick.y, brick.width, brick.height);
                    
                    // 显示血量
                    if (brick.health > 1) {
                        this.ctx.fillStyle = 'white';
                        this.ctx.font = 'bold 12px Arial';
                        this.ctx.textAlign = 'center';
                        this.ctx.fillText(brick.health, brick.x + brick.width/2, brick.y + brick.height/2 + 4);
                    }
                    
                    this.ctx.restore();
                }
            }
            
            renderPaddle() {
                this.ctx.save();
                
                // 挡板阴影
                this.ctx.shadowColor = 'rgba(0,0,0,0.3)';
                this.ctx.shadowBlur = 8;
                this.ctx.shadowOffsetY = 3;
                
                // 挡板渐变
                const gradient = this.ctx.createLinearGradient(this.paddle.x, this.paddle.y, this.paddle.x, this.paddle.y + this.paddle.height);
                gradient.addColorStop(0, '#4facfe');
                gradient.addColorStop(1, '#00f2fe');
                
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(this.paddle.x, this.paddle.y, this.paddle.width, this.paddle.height);
                
                // 挡板高光
                this.ctx.fillStyle = 'rgba(255,255,255,0.3)';
                this.ctx.fillRect(this.paddle.x, this.paddle.y, this.paddle.width, this.paddle.height / 3);
                
                this.ctx.restore();
            }
            
            renderBall() {
                this.ctx.save();
                
                // 球的阴影
                this.ctx.shadowColor = 'rgba(0,0,0,0.4)';
                this.ctx.shadowBlur = 10;
                this.ctx.shadowOffsetY = 4;
                
                // 球的渐变
                const gradient = this.ctx.createRadialGradient(
                    this.ball.x - 3, this.ball.y - 3, 0,
                    this.ball.x, this.ball.y, this.ball.radius
                );
                gradient.addColorStop(0, '#ffd700');
                gradient.addColorStop(1, '#ff8c00');
                
                this.ctx.beginPath();
                this.ctx.arc(this.ball.x, this.ball.y, this.ball.radius, 0, Math.PI * 2);
                this.ctx.fillStyle = gradient;
                this.ctx.fill();
                
                // 球的高光
                this.ctx.beginPath();
                this.ctx.arc(this.ball.x - 2, this.ball.y - 2, 3, 0, Math.PI * 2);
                this.ctx.fillStyle = 'rgba(255,255,255,0.6)';
                this.ctx.fill();
                
                this.ctx.restore();
            }
            
            renderParticles() {
                for (let particle of this.particles) {
                    const alpha = particle.life / particle.maxLife;
                    this.ctx.save();
                    this.ctx.globalAlpha = alpha;
                    this.ctx.fillStyle = particle.color;
                    this.ctx.beginPath();
                    this.ctx.arc(particle.x, particle.y, 2, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.restore();
                }
            }
            
            renderPauseScreen() {
                this.ctx.save();
                this.ctx.fillStyle = 'rgba(0,0,0,0.5)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                this.ctx.fillStyle = 'white';
                this.ctx.font = 'bold 24px Arial';
                this.ctx.textAlign = 'center';
                this.ctx.fillText('游戏暂停', this.canvas.width/2, this.canvas.height/2);
                
                this.ctx.font = '16px Arial';
                this.ctx.fillText('按空格键继续', this.canvas.width/2, this.canvas.height/2 + 40);
                this.ctx.restore();
            }
            
            resetBall() {
                this.ball.x = this.canvas.width / 2;
                this.ball.y = this.canvas.height - 45;
                this.ball.dx = 4 * (Math.random() > 0.5 ? 1 : -1);
                this.ball.dy = -4;
            }
            
            nextLevel() {
                if (this.level >= this.maxLevel) {
                    this.gameOverTitle.textContent = '恭喜通关！';
                    this.gameOver();
                    return;
                }
                
                this.level++;
                this.score += 100 * this.level;
                
                // 增加球速
                const speedMultiplier = 1 + (this.level - 1) * 0.1;
                this.ball.speed = 4 * speedMultiplier;
                this.ball.dx = this.ball.dx > 0 ? this.ball.speed : -this.ball.speed;
                this.ball.dy = -this.ball.speed;
                
                this.createBricks();
                this.resetBall();
                this.updateUI();
                this.saveGame();
            }
            
            gameOver() {
                this.gameState = 'gameOver';
                this.finalScore.textContent = this.score;
                this.gameOverScreen.style.display = 'flex';
                this.saveGame();
            }
            
            togglePause() {
                if (this.gameState === 'playing') {
                    this.gameState = 'paused';
                    document.getElementById('pauseBtn').textContent = '继续';
                } else if (this.gameState === 'paused') {
                    this.gameState = 'playing';
                    document.getElementById('pauseBtn').textContent = '暂停';
                }
            }
            
            resetGame() {
                if (confirm('确定要重置游戏数据吗？')) {
                    localStorage.removeItem('breakoutGameData');
                    this.restartGame();
                }
            }
            
            restartGame() {
                this.gameState = 'playing';
                this.score = 0;
                this.level = 1;
                this.lives = 3;
                this.gameOverScreen.style.display = 'none';
                this.gameOverTitle.textContent = '游戏结束';
                document.getElementById('pauseBtn').textContent = '暂停';
                this.init();
                this.saveGame();
            }
            
            updateUI() {
                this.scoreDisplay.textContent = this.score;
                this.levelDisplay.textContent = this.level;
            }
            
            updateLives() {
                const lives = this.livesContainer.children;
                for (let i = 0; i < lives.length; i++) {
                    lives[i].style.opacity = i < this.lives ? '1' : '0.3';
                }
            }
            
            saveGame() {
                const gameData = {
                    score: this.score,
                    level: this.level,
                    lives: this.lives,
                    timestamp: Date.now()
                };
                localStorage.setItem('breakoutGameData', JSON.stringify(gameData));
            }
            
            loadGame() {
                const savedData = localStorage.getItem('breakoutGameData');
                if (savedData) {
                    try {
                        const gameData = JSON.parse(savedData);
                        this.score = gameData.score || 0;
                        this.level = gameData.level || 1;
                        this.lives = gameData.lives || 3;
                        this.updateUI();
                        this.updateLives();
                    } catch (e) {
                        console.log('加载游戏数据失败');
                    }
                }
            }
            
            darkenColor(color, factor) {
                const hex = color.replace('#', '');
                const r = Math.max(0, parseInt(hex.substr(0, 2), 16) * (1 - factor));
                const g = Math.max(0, parseInt(hex.substr(2, 2), 16) * (1 - factor));
                const b = Math.max(0, parseInt(hex.substr(4, 2), 16) * (1 - factor));
                return `rgb(${Math.floor(r)}, ${Math.floor(g)}, ${Math.floor(b)})`;
            }
            
            gameLoop() {
                this.update();
                this.render();
                this.animationId = requestAnimationFrame(() => this.gameLoop());
            }
        }
        
        // 启动游戏
        window.addEventListener('load', () => {
            new BreakoutGame();
        });
        
        // 禁用右键菜单
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });
    </script>
</body>
</html>
