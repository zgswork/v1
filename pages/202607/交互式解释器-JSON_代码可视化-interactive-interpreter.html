<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交互式解释器 - JSON/代码可视化</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .panel {
            flex: 1;
            padding: 20px;
            background: white;
            margin: 10px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .file-name {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            color: #4a5568;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            margin: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .panel h2 {
            margin-bottom: 15px;
            color: #4a5568;
            font-size: 18px;
            font-weight: 600;
        }

        .input-section {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #inputText {
            flex: 1;
            width: 100%;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
        }

        #inputText:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        #parseBtn {
            background: #667eea;
            color: white;
        }

        #parseBtn:hover {
            background: #5a67d8;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        #clearBtn {
            background: #e2e8f0;
            color: #4a5568;
        }

        #clearBtn:hover {
            background: #cbd5e0;
        }

        .output-section {
            flex: 1;
            overflow: auto;
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
        }

        #treeContainer {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 13px;
            line-height: 1.6;
        }

        .tree-node {
            margin: 2px 0;
        }

        .node-header {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .node-header:hover {
            background: #e6fffa;
        }

        .node-header.collapsed {
            background: #fef5e7;
        }

        .toggle-btn {
            width: 16px;
            height: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: #667eea;
            background: white;
            border: 1px solid #cbd5e0;
            border-radius: 3px;
            user-select: none;
        }

        .toggle-btn:hover {
            background: #f7fafc;
        }

        .node-content {
            margin-left: 20px;
            border-left: 1px dashed #cbd5e0;
            padding-left: 10px;
        }

        .node-type {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: 500;
            margin-left: 6px;
        }

        .type-object {
            background: #e6fffa;
            color: #2b6cb0;
        }

        .type-array {
            background: #fffaf0;
            color: #d69e2e;
        }

        .type-string {
            background: #f0fff4;
            color: #2f855a;
        }

        .type-number {
            background: #edf2f7;
            color: #4a5568;
        }

        .type-boolean {
            background: #fef5e7;
            color: #dd6b20;
        }

        .type-null {
            background: #f7fafc;
            color: #a0aec0;
        }

        .node-key {
            color: #2b6cb0;
            font-weight: 500;
        }

        .node-value {
            color: #2f855a;
        }

        .node-value.number {
            color: #dd6b20;
        }

        .node-value.boolean {
            color: #d69e2e;
        }

        .node-value.null {
            color: #a0aec0;
        }

        .error {
            color: #e53e3e;
            background: #fed7d7;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
        }

        .success {
            color: #38a169;
            background: #c6f6d5;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
        }

        /* Scrollbar styling */
        .output-section::-webkit-scrollbar {
            width: 8px;
        }

        .output-section::-webkit-scrollbar-track {
            background: #f7fafc;
        }

        .output-section::-webkit-scrollbar-thumb {
            background: #cbd5e0;
            border-radius: 4px;
        }

        .output-section::-webkit-scrollbar-thumb:hover {
            background: #a0aec0;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            
            .panel {
                margin: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="file-name">📄 交互式解释器.html</div>
    <div class="container">
        <!-- Left Panel: Input -->
        <div class="panel">
            <h2>📝 输入 JSON/代码</h2>
            <div class="input-section">
                <textarea id="inputText" placeholder='请输入 JSON 数据，例如：
{
  "name": "交互式解释器",
  "version": 1.0,
  "features": [
    "JSON 解析",
    "树状可视化",
    "交互式折叠"
  ],
  "settings": {
    "theme": "light",
    "autoParse": false
  },
  "active": true
}'></textarea>
                <div class="controls">
                    <button id="parseBtn">🔍 解析并可视化</button>
                    <button id="clearBtn">🗑️ 清空</button>
                </div>
            </div>
        </div>

        <!-- Right Panel: Output -->
        <div class="panel">
            <h2>🌳 可视化树状图</h2>
            <div class="output-section">
                <div id="treeContainer"></div>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const inputText = document.getElementById('inputText');
        const parseBtn = document.getElementById('parseBtn');
        const clearBtn = document.getElementById('clearBtn');
        const treeContainer = document.getElementById('treeContainer');

        // Generate tree node HTML
        function generateTreeNode(key, value, depth = 0) {
            const nodeType = getValueType(value);
            const isExpandable = nodeType === 'object' || nodeType === 'array';
            const hasChildren = isExpandable && Object.keys(value).length > 0;
            
            let html = '';
            
            // Node header
            html += `<div class="tree-node">
                <div class="node-header" data-expanded="true">`;
            
            if (hasChildren) {
                html += `<span class="toggle-btn" onclick="toggleNode(this)">-</span>`;
            } else {
                html += `<span class="toggle-btn" style="visibility: hidden;"> </span>`;
            }
            
            if (key !== null) {
                html += `<span class="node-key">"${key}"</span>: `;
            }
            
            // Value representation
            if (isExpandable) {
                const brace = nodeType === 'object' ? '{ }' : '[ ]';
                html += `<span>${brace}</span>
                <span class="node-type type-${nodeType}">${nodeType}</span>`;
            } else {
                let valueDisplay;
                if (nodeType === 'string') {
                    valueDisplay = `"${value}"`;
                } else if (nodeType === 'null') {
                    valueDisplay = 'null';
                } else {
                    valueDisplay = value;
                }
                html += `<span class="node-value ${nodeType}">${valueDisplay}</span>
                <span class="node-type type-${nodeType}">${nodeType}</span>`;
            }
            
            html += `</div>`;
            
            // Node content (children)
            if (hasChildren) {
                html += `<div class="node-content">`;
                
                if (nodeType === 'object') {
                    for (const [childKey, childValue] of Object.entries(value)) {
                        html += generateTreeNode(childKey, childValue, depth + 1);
                    }
                } else if (nodeType === 'array') {
                    value.forEach((item, index) => {
                        html += generateTreeNode(index, item, depth + 1);
                    });
                }
                
                html += `</div>`;
            }
            
            html += `</div>`;
            
            return html;
        }

        // Get value type
        function getValueType(value) {
            if (value === null) return 'null';
            if (Array.isArray(value)) return 'array';
            return typeof value;
        }

        // Toggle node expansion
        function toggleNode(toggleBtn) {
            const nodeHeader = toggleBtn.parentElement;
            const nodeContent = nodeHeader.nextElementSibling;
            const isExpanded = nodeHeader.dataset.expanded === 'true';
            
            if (isExpanded) {
                nodeHeader.dataset.expanded = 'false';
                nodeHeader.classList.add('collapsed');
                toggleBtn.textContent = '+';
                if (nodeContent) {
                    nodeContent.style.display = 'none';
                }
            } else {
                nodeHeader.dataset.expanded = 'true';
                nodeHeader.classList.remove('collapsed');
                toggleBtn.textContent = '-';
                if (nodeContent) {
                    nodeContent.style.display = 'block';
                }
            }
        }

        // Parse input and generate tree
        function parseAndGenerateTree() {
            const input = inputText.value.trim();
            
            if (!input) {
                treeContainer.innerHTML = '<div class="error">请输入 JSON 数据</div>';
                return;
            }
            
            try {
                // Parse JSON
                const parsedData = JSON.parse(input);
                
                // Generate tree
                const treeHtml = generateTreeNode(null, parsedData);
                treeContainer.innerHTML = `<div class="success">✅ 解析成功！点击 +/- 图标折叠/展开节点</div>${treeHtml}`;
            } catch (error) {
                treeContainer.innerHTML = `<div class="error">❌ 解析错误：${error.message}</div>`;
            }
        }

        // Clear input and output
        function clearAll() {
            inputText.value = '';
            treeContainer.innerHTML = '';
        }

        // Event listeners
        parseBtn.addEventListener('click', parseAndGenerateTree);
        clearBtn.addEventListener('click', clearAll);
        
        // Auto-parse on Ctrl+Enter
        inputText.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                parseAndGenerateTree();
            }
        });

        // Initialize with sample data
        window.addEventListener('load', () => {
            // Sample JSON in input
            const sampleJson = {
                "name": "交互式解释器",
                "version": 1.0,
                "features": [
                    "JSON 解析",
                    "树状可视化",
                    "交互式折叠"
                ],
                "settings": {
                    "theme": "light",
                    "autoParse": false
                },
                "active": true
            };
            
            inputText.value = JSON.stringify(sampleJson, null, 2);
            parseAndGenerateTree();
        });
    </script>
</body>
</html>
