<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3D校徽展示平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2c3e50;
            --accent-color: #e74c3c;
            --light-bg: #f8f9fa;
            --dark-bg: #2c3e50;
            --card-bg: #ffffff;
            --text-color: #333;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --border-radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        header {
            text-align: center;
            padding: 30px 0;
            color: white;
            animation: fadeInDown 1s ease;
        }

        header h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        header p {
            font-size: 1.2rem;
            max-width: 700px;
            margin: 0 auto;
            opacity: 0.9;
        }

        .main-content {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
        }

        .control-panel {
            flex: 1;
            min-width: 300px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 25px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .preview-area {
            flex: 2;
            min-width: 300px;
            min-height: 500px;
            background: var(--dark-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .panel-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--secondary-color);
            padding-bottom: 8px;
            border-bottom: 2px solid #eee;
        }

        .panel-title i {
            color: var(--primary-color);
        }

        .upload-area {
            border: 2px dashed #ddd;
            border-radius: 8px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .upload-area:hover {
            border-color: var(--primary-color);
            background: #f0f7ff;
        }

        .upload-icon {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .upload-text {
            margin-bottom: 15px;
        }

        .btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
        }

        .btn i {
            font-size: 1.1rem;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-label {
            font-weight: 500;
            font-size: 0.95rem;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .slider {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: #e0e0e0;
            border-radius: 3px;
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.2);
        }

        .material-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .material-btn {
            flex: 1;
            padding: 12px;
            background: #f1f1f1;
            border: 2px solid #ddd;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 80px;
        }

        .material-btn:hover {
            border-color: var(--primary-color);
            background: #eaf5ff;
        }

        .material-btn.active {
            border-color: var(--primary-color);
            background: #d4ebff;
            color: var(--primary-color);
            font-weight: 600;
        }

        .color-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .color-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
            transition: all 0.2s ease;
        }

        .color-btn:hover {
            transform: scale(1.1);
        }

        .color-btn.active {
            transform: scale(1.15);
            border: 2px solid #fff;
            box-shadow: 0 0 0 3px var(--primary-color);
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .action-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 120px;
        }

        .btn-secondary {
            background: var(--secondary-color);
        }

        .btn-secondary:hover {
            background: #1a252f;
        }

        .btn-accent {
            background: var(--accent-color);
        }

        .btn-accent:hover {
            background: #c0392b;
        }

        /* 3D Emblem Styles */
        .emblem-container {
            perspective: 1200px;
            width: 300px;
            height: 300px;
            position: relative;
        }

        .emblem-3d {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transform: rotate3d(1, 1, 0, 0deg);
            transition: transform 0.5s ease;
        }

        .emblem {
            width: 100%;
            height: 100%;
            position: absolute;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            backface-visibility: hidden;
            border-radius: 50%;
            box-shadow: 
                0 0 40px rgba(255, 255, 255, 0.1),
                0 20px 60px rgba(0, 0, 0, 0.3);
            transition: filter 0.3s ease;
            transform-style: preserve-3d;
        }

        /* 3D厚度效果 - 创建多层来模拟厚度 */
        .emblem::before {
            content: "";
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            background: inherit;
            background-size: inherit;
            background-repeat: inherit;
            background-position: inherit;
            border-radius: 50%;
            transform: translateZ(-5px);
            filter: brightness(0.8) blur(0.5px);
            z-index: -1;
        }

        .emblem::after {
            content: "";
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            background: inherit;
            background-size: inherit;
            background-repeat: inherit;
            background-position: inherit;
            border-radius: 50%;
            transform: translateZ(-10px);
            filter: brightness(0.6) blur(1px);
            z-index: -2;
        }

        /* 默认校徽样式 - 当没有上传图片时显示 */
        .emblem.default-emblem {
            background: radial-gradient(circle at 30% 30%, #3498db, #1a5276);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        /* 侧面厚度效果 */
        .emblem-side {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(45deg, #2c3e50, #34495e);
            transform: translateZ(-15px);
            filter: brightness(0.4);
            box-shadow: 
                0 0 20px rgba(0, 0, 0, 0.5),
                inset 0 0 30px rgba(0, 0, 0, 0.3);
        }

        /* 增强3D边缘效果 */
        .emblem-3d::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50%;
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.3) 0%,
                rgba(255, 255, 255, 0.1) 25%,
                rgba(0, 0, 0, 0.1) 75%,
                rgba(0, 0, 0, 0.3) 100%);
            transform: translateZ(1px);
            pointer-events: none;
            z-index: 10;
        }

        /* 高光效果 */
        .emblem-3d::after {
            content: '';
            position: absolute;
            top: 15%;
            left: 15%;
            width: 30%;
            height: 30%;
            border-radius: 50%;
            background: radial-gradient(circle, 
                rgba(255, 255, 255, 0.4) 0%,
                rgba(255, 255, 255, 0.2) 40%,
                transparent 70%);
            transform: translateZ(2px);
            pointer-events: none;
            z-index: 11;
        }

        /* Material effects */
        .metal-effect {
            filter: brightness(1.2) contrast(1.3) saturate(1.2);
            box-shadow: 
                0 0 30px rgba(255, 215, 0, 0.6),
                0 0 60px rgba(255, 140, 0, 0.4);
        }

        .matte-effect {
            filter: brightness(0.95) contrast(1.1) saturate(0.9);
            box-shadow: 
                0 0 20px rgba(0, 0, 0, 0.3),
                inset 0 0 20px rgba(0, 0, 0, 0.1);
        }

        /* Environment colors */
        .sunlight { background: radial-gradient(circle, #ffdd99, #ff9966); }
        .warmlight { background: radial-gradient(circle, #ffcc99, #ff9966); }
        .coldlight { background: radial-gradient(circle, #99ccff, #6699ff); }
        .purplelight { background: radial-gradient(circle, #cc99ff, #9966cc); }
        .greenlight { background: radial-gradient(circle, #99ff99, #66cc66); }

        /* Interaction prompt */
        .interaction-prompt {
            position: absolute;
            bottom: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            text-align: center;
            width: 100%;
            padding: 0 20px;
            animation: pulse 2s infinite;
        }

        .fullscreen-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.3);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .fullscreen-btn:hover {
            background: rgba(0, 0, 0, 0.5);
            transform: scale(1.1);
        }

        /* Animations */
        @keyframes rotate {
            0% { transform: rotate3d(1, 1, 0, 0deg); }
            100% { transform: rotate3d(1, 1, 0, 360deg); }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .emblem-container {
                width: 250px;
                height: 250px;
            }
            
            header h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>CSS 3D校徽展示平台</h1>
            <p>上传您的校徽，体验沉浸式3D展示效果 - 支持材质切换、环境光调整与多平台分享</p>
        </header>
        
        <div class="main-content">
            <div class="control-panel">
                <div class="panel-section">
                    <h2 class="panel-title"><i class="fas fa-upload"></i> 校徽上传</h2>
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-icon">
                            <i class="fas fa-cloud-upload-alt"></i>
                        </div>
                        <div class="upload-text">
                            <p>拖放校徽图片到此处或点击上传</p>
                            <p class="small">推荐使用PNG格式透明背景图片</p>
                        </div>
                        <button class="btn" id="uploadBtn">
                            <i class="fas fa-folder-open"></i> 选择文件
                        </button>
                        <input type="file" id="fileInput" accept="image/*" style="display: none;">
                    </div>
                </div>
                
                <div class="panel-section">
                    <h2 class="panel-title"><i class="fas fa-cog"></i> 效果控制</h2>
                    <div class="controls">
                        <div class="control-group">
                            <label class="control-label">旋转速度</label>
                            <div class="slider-container">
                                <input type="range" min="1" max="20" value="10" class="slider" id="speedSlider">
                                <span id="speedValue">中速</span>
                            </div>
                        </div>
                        
                        <div class="control-group">
                            <label class="control-label">缩放大小</label>
                            <div class="slider-container">
                                <input type="range" min="50" max="150" value="100" class="slider" id="sizeSlider">
                                <span id="sizeValue">100%</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="control-group">
                        <label class="control-label">材质效果</label>
                        <div class="material-options">
                            <div class="material-btn active" data-effect="default">默认</div>
                            <div class="material-btn" data-effect="metal">金属</div>
                            <div class="material-btn" data-effect="matte">磨砂</div>
                        </div>
                    </div>
                    
                    <div class="control-group">
                        <label class="control-label">环境光</label>
                        <div class="color-options">
                            <div class="color-btn active" style="background: linear-gradient(135deg, #ffdd99, #ff9966);" data-light="sunlight"></div>
                            <div class="color-btn" style="background: linear-gradient(135deg, #ffcc99, #ff9966);" data-light="warmlight"></div>
                            <div class="color-btn" style="background: linear-gradient(135deg, #99ccff, #6699ff);" data-light="coldlight"></div>
                            <div class="color-btn" style="background: linear-gradient(135deg, #cc99ff, #9966cc);" data-light="purplelight"></div>
                            <div class="color-btn" style="background: linear-gradient(135deg, #99ff99, #66cc66);" data-light="greenlight"></div>
                        </div>
                    </div>
                </div>
                
                <div class="panel-section">
                    <h2 class="panel-title"><i class="fas fa-share-alt"></i> 分享与导出</h2>
                    <div class="action-buttons">
                        <button class="btn action-btn">
                            <i class="fas fa-link"></i> 复制链接
                        </button>
                        <button class="btn btn-accent action-btn">
                            <i class="fas fa-download"></i> 下载GIF
                        </button>
                        <button class="btn btn-secondary action-btn">
                            <i class="fas fa-code"></i> 嵌入代码
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="preview-area" id="previewArea">
                <div class="fullscreen-btn" id="fullscreenBtn">
                    <i class="fas fa-expand"></i>
                </div>
                
                <div class="emblem-container">
                    <div class="emblem-3d" id="emblem3d">
                        <div class="emblem default-emblem" id="emblem">校徽</div>
                        <div class="emblem-side"></div>
                    </div>
                </div>
                
                <div class="interaction-prompt" id="interactionPrompt">
                    <i class="fas fa-mouse-pointer"></i> 拖拽旋转视角 | 
                    <i class="fas fa-mobile-alt"></i> 倾斜手机控制
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const emblem3d = document.getElementById('emblem3d');
            const emblem = document.getElementById('emblem');
            const uploadArea = document.getElementById('uploadArea');
            const uploadBtn = document.getElementById('uploadBtn');
            const fileInput = document.getElementById('fileInput');
            const speedSlider = document.getElementById('speedSlider');
            const speedValue = document.getElementById('speedValue');
            const sizeSlider = document.getElementById('sizeSlider');
            const sizeValue = document.getElementById('sizeValue');
            const materialBtns = document.querySelectorAll('.material-btn');
            const colorBtns = document.querySelectorAll('.color-btn');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const previewArea = document.getElementById('previewArea');
            const interactionPrompt = document.getElementById('interactionPrompt');
            
            // 初始旋转动画
            let animationSpeed = 10;
            emblem3d.style.animation = `rotate ${30 - animationSpeed}s infinite linear`;
            
            // 上传功能
            uploadBtn.addEventListener('click', () => fileInput.click());
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = '#3498db';
                uploadArea.style.backgroundColor = '#e3f2fd';
            });
            
            uploadArea.addEventListener('dragleave', () => {
                uploadArea.style.borderColor = '#ddd';
                uploadArea.style.backgroundColor = '#fafafa';
            });
            
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = '#ddd';
                uploadArea.style.backgroundColor = '#fafafa';
                
                if (e.dataTransfer.files.length) {
                    handleFileUpload(e.dataTransfer.files[0]);
                }
            });
            
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length) {
                    handleFileUpload(e.target.files[0]);
                }
            });
            
            function handleFileUpload(file) {
                if (!file.type.match('image.*')) {
                    alert('请上传图片文件！');
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    // 移除默认校徽样式
                    emblem.classList.remove('default-emblem');
                    emblem.textContent = '';
                    
                    // 设置上传的图片
                    emblem.style.backgroundImage = `url(${e.target.result})`;
                    emblem.style.backgroundColor = 'transparent';
                    
                    // 更新侧面厚度效果的背景
                    const emblemSide = document.querySelector('.emblem-side');
                    emblemSide.style.backgroundImage = `url(${e.target.result})`;
                    emblemSide.style.backgroundSize = 'contain';
                    emblemSide.style.backgroundRepeat = 'no-repeat';
                    emblemSide.style.backgroundPosition = 'center';
                    
                    // 添加成功提示
                    const uploadText = uploadArea.querySelector('.upload-text p');
                    const originalText = uploadText.textContent;
                    uploadText.textContent = '✓ 校徽上传成功！';
                    uploadText.style.color = '#27ae60';
                    
                    setTimeout(() => {
                        uploadText.textContent = originalText;
                        uploadText.style.color = '';
                    }, 2000);
                };
                reader.readAsDataURL(file);
            }
            
            // 旋转速度控制
            speedSlider.addEventListener('input', function() {
                animationSpeed = parseInt(this.value);
                emblem3d.style.animation = `rotate ${30 - animationSpeed}s infinite linear`;
                
                // 更新速度文本
                if (animationSpeed < 7) {
                    speedValue.textContent = '慢速';
                } else if (animationSpeed < 14) {
                    speedValue.textContent = '中速';
                } else {
                    speedValue.textContent = '快速';
                }
            });
            
            // 缩放控制
            sizeSlider.addEventListener('input', function() {
                const size = parseInt(this.value);
                emblem3d.style.transform = `scale(${size/100})`;
                sizeValue.textContent = `${size}%`;
            });
            
            // 材质效果切换
            materialBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    materialBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    
                    emblem.classList.remove('metal-effect', 'matte-effect');
                    
                    if (this.dataset.effect === 'metal') {
                        emblem.classList.add('metal-effect');
                    } else if (this.dataset.effect === 'matte') {
                        emblem.classList.add('matte-effect');
                    }
                });
            });
            
            // 环境光切换
            colorBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    colorBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    
                    document.querySelector('.preview-area').className = 
                        `preview-area ${this.dataset.light}`;
                });
            });
            
            // 鼠标拖拽交互
            let isDragging = false;
            let lastX, lastY;
            let rotationX = 0;
            let rotationY = 0;
            
            emblem3d.addEventListener('mousedown', function(e) {
                isDragging = true;
                lastX = e.clientX;
                lastY = e.clientY;
                emblem3d.style.animation = 'none';
            });
            
            document.addEventListener('mousemove', function(e) {
                if (isDragging) {
                    const deltaX = e.clientX - lastX;
                    const deltaY = e.clientY - lastY;
                    
                    rotationY += deltaX * 0.5;
                    rotationX -= deltaY * 0.5;
                    
                    emblem3d.style.transform = `rotateX(${rotationX}deg) rotateY(${rotationY}deg)`;
                    
                    lastX = e.clientX;
                    lastY = e.clientY;
                }
            });
            
            document.addEventListener('mouseup', function() {
                isDragging = false;
                if (!isDragging) {
                    emblem3d.style.animation = `rotate ${30 - animationSpeed}s infinite linear`;
                }
            });
            
            // 触摸屏旋转交互
            emblem3d.addEventListener('touchstart', function(e) {
                isDragging = true;
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
                emblem3d.style.animation = 'none';
                e.preventDefault();
            });
            
            document.addEventListener('touchmove', function(e) {
                if (isDragging) {
                    const deltaX = e.touches[0].clientX - lastX;
                    const deltaY = e.touches[0].clientY - lastY;
                    
                    rotationY += deltaX * 0.5;
                    rotationX -= deltaY * 0.5;
                    
                    emblem3d.style.transform = `rotateX(${rotationX}deg) rotateY(${rotationY}deg)`;
                    
                    lastX = e.touches[0].clientX;
                    lastY = e.touches[0].clientY;
                    e.preventDefault();
                }
            });
            
            document.addEventListener('touchend', function() {
                isDragging = false;
                emblem3d.style.animation = `rotate ${30 - animationSpeed}s infinite linear`;
            });
            
            // 全屏功能
            fullscreenBtn.addEventListener('click', function() {
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                } else {
                    previewArea.requestFullscreen().catch(err => {
                        console.error(`全屏请求错误: ${err.message}`);
                    });
                }
            });
            
            document.addEventListener('fullscreenchange', function() {
                if (document.fullscreenElement) {
                    fullscreenBtn.innerHTML = '<i class="fas fa-compress"></i>';
                } else {
                    fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i>';
                }
            });
            
            // 分享与导出功能
            const actionButtons = document.querySelectorAll('.action-btn');
            
            // 复制链接功能
            actionButtons[0].addEventListener('click', function() {
                const currentUrl = window.location.href;
                navigator.clipboard.writeText(currentUrl).then(() => {
                    // 显示成功提示
                    const originalText = this.innerHTML;
                    this.innerHTML = '<i class="fas fa-check"></i> 已复制';
                    this.style.background = '#27ae60';
                    
                    setTimeout(() => {
                        this.innerHTML = originalText;
                        this.style.background = '';
                    }, 2000);
                }).catch(err => {
                    alert('复制失败，请手动复制链接：' + currentUrl);
                });
            });
            
            // 下载GIF功能
            actionButtons[1].addEventListener('click', function() {
                // 创建canvas来捕获3D场景
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 400;
                canvas.height = 400;
                
                // 获取校徽元素的样式
                const emblemElement = document.getElementById('emblem');
                const computedStyle = window.getComputedStyle(emblemElement);
                
                // 创建一个临时的2D版本用于导出
                ctx.fillStyle = '#2c3e50';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 绘制圆形校徽
                ctx.beginPath();
                ctx.arc(200, 200, 150, 0, 2 * Math.PI);
                ctx.fillStyle = '#3498db';
                ctx.fill();
                
                // 添加文字或图片
                if (emblemElement.style.backgroundImage) {
                    // 如果有上传的图片，创建图片元素
                    const img = new Image();
                    img.onload = function() {
                        ctx.drawImage(img, 50, 50, 300, 300);
                        downloadCanvas(canvas, 'school-emblem-3d.png');
                    };
                    img.src = emblemElement.style.backgroundImage.slice(5, -2); // 移除url("")
                } else {
                    // 绘制默认文字
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 48px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('校徽', 200, 220);
                    downloadCanvas(canvas, 'school-emblem-3d.png');
                }
                
                // 显示下载提示
                const originalText = this.innerHTML;
                this.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 生成中...';
                
                setTimeout(() => {
                    this.innerHTML = originalText;
                }, 3000);
            });
            
            // 嵌入代码功能
            actionButtons[2].addEventListener('click', function() {
                const embedCode = `<iframe src="${window.location.href}" width="800" height="600" frameborder="0" allowfullscreen></iframe>`;
                
                // 创建模态框显示嵌入代码
                const modal = document.createElement('div');
                modal.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(0, 0, 0, 0.8);
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    z-index: 1000;
                `;
                
                const modalContent = document.createElement('div');
                modalContent.style.cssText = `
                    background: white;
                    padding: 30px;
                    border-radius: 12px;
                    max-width: 600px;
                    width: 90%;
                `;
                
                modalContent.innerHTML = `
                    <h3 style="margin-top: 0; color: #2c3e50;">嵌入代码</h3>
                    <p style="color: #666; margin-bottom: 15px;">复制以下代码到您的网站中：</p>
                    <textarea readonly style="width: 100%; height: 100px; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-family: monospace; resize: none;">${embedCode}</textarea>
                    <div style="margin-top: 20px; text-align: right;">
                        <button onclick="navigator.clipboard.writeText('${embedCode}').then(() => alert('代码已复制到剪贴板！'))" style="background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; margin-right: 10px;">复制代码</button>
                        <button onclick="this.closest('.modal').remove()" style="background: #95a5a6; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer;">关闭</button>
                    </div>
                `;
                
                modal.className = 'modal';
                modal.appendChild(modalContent);
                document.body.appendChild(modal);
                
                // 点击背景关闭模态框
                modal.addEventListener('click', function(e) {
                    if (e.target === modal) {
                        modal.remove();
                    }
                });
            });
            
            // 下载canvas的辅助函数
            function downloadCanvas(canvas, filename) {
                const link = document.createElement('a');
                link.download = filename;
                link.href = canvas.toDataURL();
                link.click();
            }
            
            // 设备检测
            function detectDevice() {
                if (window.matchMedia("(pointer: coarse)").matches) {
                    interactionPrompt.innerHTML = '<i class="fas fa-mobile-alt"></i> 倾斜手机控制视角';
                } else {
                    interactionPrompt.innerHTML = '<i class="fas fa-mouse-pointer"></i> 拖拽旋转视角 | <i class="fas fa-mobile-alt"></i> 倾斜手机控制';
                }
            }
            
            detectDevice();
            window.addEventListener('resize', detectDevice);
            
            // 陀螺仪支持
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', function(event) {
                    const beta = event.beta;  // -180 to 180
                    const gamma = event.gamma; // -90 to 90
                    
                    if (beta !== null && gamma !== null) {
                        emblem3d.style.animation = 'none';
                        
                        // 限制旋转角度
                        const x = Math.max(-45, Math.min(45, beta)) * 2;
                        const y = Math.max(-45, Math.min(45, gamma)) * 2;
                        
                        emblem3d.style.transform = `rotateX(${x}deg) rotateY(${y}deg)`;
                    }
                });
            }
        });
    </script>
</body>
</html>
