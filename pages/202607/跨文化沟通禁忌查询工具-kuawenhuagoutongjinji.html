                        <i class="fa ${category.icon} mr-2"></i>${category.category}
                    </h4>
                    <ul class="list-disc pl-5 space-y-2 text-gray-700">
                        ${category.items.map(item => `<li class="py-1">${item}</li>`).join('')}
                    </ul>
                `;
                
                tabooContent.appendChild(categoryElement);
            });
            
            // 显示结果区域，隐藏初始提示
            initialPrompt.classList.add('hidden');
            resultsSection.classList.remove('hidden');
            
            // 平滑滚动到结果区域
            resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // 添加滚动效果
        window.addEventListener('scroll', function() {
            const header = document.querySelector('header');
            if (window.scrollY > 10) {
                header.classList.add('py-2', 'shadow');
                header.classList.remove('py-4', 'shadow-sm');
            } else {
                header.classList.add('py-4', 'shadow-sm');
                header.classList.remove('py-2', 'shadow');
            }
        });

        // 添加动画样式
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
            .animate-fadeIn {
                animation: fadeIn 0.5s ease forwards;
            }
            .taboo-category:nth-child(1) { animation-delay: 0.1s; }
            .taboo-category:nth-child(2) { animation-delay: 0.2s; }
            .taboo-category:nth-child(3) { animation-delay: 0.3s; }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
