<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML表格生成器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        
        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(90deg, #4b6cb7, #182848);
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }
        
        .header h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .header p {
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
            font-size: 1.05rem;
        }
        
        .page {
            padding: 25px;
            min-height: 500px;
            display: none;
        }
        
        .page.active {
            display: block;
        }
        
        /* 尺寸选择页面样式 */
        .size-selector {
            text-align: center;
        }
        
        .grid-container {
            display: inline-block;
            margin: 25px auto;
            border: 3px solid #4b6cb7;
            border-radius: 8px;
            overflow: hidden;
            background: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            max-width: 100%;
            overflow-x: auto;
        }
        
        .grid {
            display: grid;
            gap: 1px;
            background: #ddd;
        }
        
        .grid-cell {
            width: 40px;
            height: 40px;
            background: #f8f9fa;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: #777;
        }
        
        .grid-cell.selected {
            background: #4b6cb7;
            color: white;
        }
        
        .grid-cell.hover {
            background: #a0b9f0;
        }
        
        .selection-info {
            margin: 20px 0;
            font-size: 1.4rem;
            font-weight: 500;
            color: #182848;
        }
        
        .selection-info span {
            font-weight: 700;
            color: #4b6cb7;
        }
        
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            min-width: 150px;
        }
        
        .btn-primary {
            background: linear-gradient(90deg, #4b6cb7, #182848);
            color: white;
            box-shadow: 0 4px 10px rgba(75, 108, 183, 0.4);
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(75, 108, 183, 0.6);
        }
        
        .btn-secondary {
            background: white;
            color: #4b6cb7;
            border: 2px solid #4b6cb7;
        }
        
        .btn-secondary:hover {
            background: #f0f4ff;
        }
        
        /* 表格编辑页面样式 */
        .table-container {
            margin: 20px auto;
            overflow-x: auto;
            max-width: 100%;
        }
        
        .edit-table {
            border-collapse: collapse;
            width: 100%;
            margin: 0 auto;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }
        
        .edit-table td {
            border: 1px solid #ddd;
            padding: 15px;
            min-width: 80px;
            height: 60px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }
        
        .edit-table td.selected {
            background-color: #e3eeff;
            border: 2px solid #4b6cb7;
        }
        
        .edit-table td.header-cell {
            background-color: #4b6cb7;
            color: white;
            font-weight: 600;
        }
        
        .edit-table td.highlight {
            background-color: #ffeb3b;
        }
        
        .controls {
            margin: 25px 0;
        }
        
        .controls h2 {
            margin-bottom: 15px;
            color: #182848;
            text-align: center;
        }
        
        .control-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        .control-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #4b6cb7;
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .control-btn:hover {
            background: #3a5ca0;
            transform: translateY(-2px);
        }
        
        .control-btn.delete {
            background: #e74c3c;
        }
        
        .control-btn.delete:hover {
            background: #c0392b;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }
            
            .grid-cell {
                width: 30px;
                height: 30px;
            }
            
            .btn {
                padding: 10px 20px;
                min-width: 130px;
                font-size: 1rem;
            }
            
            .edit-table td {
                padding: 10px;
                height: 50px;
            }
        }
        
        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.5rem;
            }
            
            .grid-cell {
                width: 25px;
                height: 25px;
                font-size: 0.6rem;
            }
            
            .btn {
                padding: 8px 15px;
                min-width: 100px;
                font-size: 0.9rem;
            }
            
            .edit-table td {
                padding: 8px;
                height: 45px;
            }
            
            .control-btn {
                padding: 8px 15px;
                font-size: 0.9rem;
            }
        }
        
        /* 动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>HTML表格生成器</h1>
            <p>轻松创建和自定义HTML表格 - 支持手机和平板设备</p>
        </div>
        
        <!-- 尺寸选择页面 -->
        <div id="sizePage" class="page active fade-in">
            <div class="size-selector">
                <h2>选择表格尺寸</h2>
                <p>点击并拖动以选择所需的行数和列数</p>
                
                <div class="grid-container">
                    <div class="grid" id="sizeGrid"></div>
                </div>
                
                <div class="selection-info">
                    当前选择: <span id="rowsCount">0</span> 行 × <span id="colsCount">0</span> 列
                </div>
                
                <div class="btn-group">
                    <button id="createTableBtn" class="btn btn-primary" disabled>
                        创建表格
                    </button>
                    <button id="resetBtn" class="btn btn-secondary">
                        重置选择
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 表格编辑页面 -->
        <div id="editPage" class="page">
            <div style="text-align: center; margin-bottom: 20px;">
                <h2>编辑您的表格</h2>
                <p>点击单元格进行编辑，使用下方控件自定义表格</p>
            </div>
            
            <div class="table-container">
                <table class="edit-table" id="editableTable"></table>
            </div>
            
            <div class="controls">
                <h3>表格操作</h3>
                <div class="control-group">
                    <button id="addRowBtn" class="control-btn">
                        <i>+</i> 添加行
                    </button>
                    <button id="addColBtn" class="control-btn">
                        <i>+</i> 添加列
                    </button>
                    <button id="deleteRowBtn" class="control-btn delete">
                        <i>-</i> 删除行
                    </button>
                    <button id="deleteColBtn" class="control-btn delete">
                        <i>-</i> 删除列
                    </button>
                    <button id="headerRowBtn" class="control-btn">
                        <i>H</i> 切换标题行
                    </button>
                </div>
            </div>
            
            <div class="btn-group">
                <button id="backToSizeBtn" class="btn btn-secondary">
                    &larr; 返回尺寸选择
                </button>
                <button id="downloadBtn" class="btn btn-primary">
                    下载HTML代码
                </button>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let selectedRows = 0;
        let selectedCols = 0;
        let isMouseDown = false;
        let startCell = null;
        let currentTable = {
            rows: 0,
            cols: 0,
            data: [],
            hasHeader: false
        };
        let selectedCell = null;

        // DOM 元素
        const sizePage = document.getElementById('sizePage');
        const editPage = document.getElementById('editPage');
        const sizeGrid = document.getElementById('sizeGrid');
        const rowsCount = document.getElementById('rowsCount');
        const colsCount = document.getElementById('colsCount');
        const createTableBtn = document.getElementById('createTableBtn');
        const resetBtn = document.getElementById('resetBtn');
        const editableTable = document.getElementById('editableTable');
        const backToSizeBtn = document.getElementById('backToSizeBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const addRowBtn = document.getElementById('addRowBtn');
        const addColBtn = document.getElementById('addColBtn');
        const deleteRowBtn = document.getElementById('deleteRowBtn');
        const deleteColBtn = document.getElementById('deleteColBtn');
        const headerRowBtn = document.getElementById('headerRowBtn');

        // 初始化网格
        function initSizeGrid() {
            sizeGrid.innerHTML = '';
            sizeGrid.style.gridTemplateColumns = 'repeat(10, 1fr)';
            
            for (let row = 0; row < 10; row++) {
                for (let col = 0; col < 10; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    
                    // 显示行列号
                    if (row === 0 && col === 0) {
                        cell.textContent = '1x1';
                    } else if (row === 0) {
                        cell.textContent = col + 1;
                    } else if (col === 0) {
                        cell.textContent = row + 1;
                    }
                    
                    cell.addEventListener('mousedown', handleGridMouseDown);
                    cell.addEventListener('mouseenter', handleGridMouseEnter);
                    cell.addEventListener('touchstart', handleGridTouchStart, { passive: false });
                    
                    sizeGrid.appendChild(cell);
                }
            }
            
            // 添加全局事件监听器
            document.addEventListener('mouseup', handleGridMouseUp);
            document.addEventListener('touchend', handleGridTouchEnd);
        }

        // 网格鼠标事件处理
        function handleGridMouseDown(e) {
            e.preventDefault();
            isMouseDown = true;
            const cell = e.target;
            startCell = {
                row: parseInt(cell.dataset.row),
                col: parseInt(cell.dataset.col)
            };
            updateGridSelection(startCell.row, startCell.col);
        }

        function handleGridMouseEnter(e) {
            if (!isMouseDown) return;
            const cell = e.target;
            const row = parseInt(cell.dataset.row);
            const col = parseInt(cell.dataset.col);
            updateGridSelection(row, col);
        }

        function handleGridMouseUp() {
            isMouseDown = false;
            startCell = null;
        }

        // 网格触摸事件处理
        function handleGridTouchStart(e) {
            if (e.touches.length !== 1) return;
            e.preventDefault();
            isMouseDown = true;
            const touch = e.touches[0];
            const cell = document.elementFromPoint(touch.clientX, touch.clientY);
            if (cell && cell.classList.contains('grid-cell')) {
                startCell = {
                    row: parseInt(cell.dataset.row),
                    col: parseInt(cell.dataset.col)
                };
                updateGridSelection(startCell.row, startCell.col);
            }
            
            // 添加触摸移动事件
            document.addEventListener('touchmove', handleGridTouchMove, { passive: false });
        }

        function handleGridTouchMove(e) {
            if (e.touches.length !== 1) return;
            e.preventDefault();
            const touch = e.touches[0];
            const cell = document.elementFromPoint(touch.clientX, touch.clientY);
            if (cell && cell.classList.contains('grid-cell')) {
                const row = parseInt(cell.dataset.row);
                const col = parseInt(cell.dataset.col);
                updateGridSelection(row, col);
            }
        }

        function handleGridTouchEnd() {
            isMouseDown = false;
            startCell = null;
            document.removeEventListener('touchmove', handleGridTouchMove);
        }

        // 更新网格选择
        function updateGridSelection(endRow, endCol) {
            if (!startCell) return;
            
            const minRow = Math.min(startCell.row, endRow);
            const maxRow = Math.max(startCell.row, endRow);
            const minCol = Math.min(startCell.col, endCol);
            const maxCol = Math.max(startCell.col, endCol);
            
            selectedRows = maxRow - minRow + 1;
            selectedCols = maxCol - minCol + 1;
            
            // 更新显示
            rowsCount.textContent = selectedRows;
            colsCount.textContent = selectedCols;
            
            // 启用创建按钮
            createTableBtn.disabled = selectedRows === 0 || selectedCols === 0;
            
            // 更新网格选择状态
            const cells = sizeGrid.querySelectorAll('.grid-cell');
            cells.forEach(cell => {
                const row = parseInt(cell.dataset.row);
                const col = parseInt(cell.dataset.col);
                
                if (row >= minRow && row <= maxRow && col >= minCol && col <= maxCol) {
                    cell.classList.add('selected');
                } else {
                    cell.classList.remove('selected');
                }
            });
        }

        // 创建表格
        function createTable() {
            if (selectedRows === 0 || selectedCols === 0) return;
            
            // 保存表格信息
            currentTable.rows = selectedRows;
            currentTable.cols = selectedCols;
            currentTable.data = [];
            currentTable.hasHeader = false;
            
            // 生成表格HTML
            let tableHTML = '';
            for (let row = 0; row < selectedRows; row++) {
                tableHTML += '<tr>';
                for (let col = 0; col < selectedCols; col++) {
                    tableHTML += `<td data-row="${row}" data-col="${col}">`;
                    tableHTML += `单元格 ${row + 1}-${col + 1}`;
                    tableHTML += '</td>';
                    
                    // 初始化数据
                    if (!currentTable.data[row]) currentTable.data[row] = [];
                    currentTable.data[row][col] = `单元格 ${row + 1}-${col + 1}`;
                }
                tableHTML += '</tr>';
            }
            
            editableTable.innerHTML = tableHTML;
            
            // 添加事件监听器
            const cells = editableTable.querySelectorAll('td');
            cells.forEach(cell => {
                cell.addEventListener('click', handleCellClick);
            });
            
            // 切换到编辑页面
            sizePage.classList.remove('active');
            editPage.classList.add('active');
            editPage.classList.add('fade-in');
        }

        // 处理单元格点击
        function handleCellClick(e) {
            const cell = e.target;
            
            // 移除之前选中的单元格
            const prevSelected = editableTable.querySelector('.selected');
            if (prevSelected) prevSelected.classList.remove('selected');
            
            // 选中当前单元格
            cell.classList.add('selected');
            selectedCell = cell;
            
            // 直接调用编辑功能
            handleCellDoubleClick(e);
        }

        // 添加行
        function addRow() {
            currentTable.rows++;
            const rowIndex = currentTable.rows - 1;
            
            // 创建新行数据
            currentTable.data[rowIndex] = [];
            for (let col = 0; col < currentTable.cols; col++) {
                currentTable.data[rowIndex][col] = `单元格 ${rowIndex + 1}-${col + 1}`;
            }
            
            renderTable();
        }

        // 添加列
        function addColumn() {
            currentTable.cols++;
            
            // 更新每行的数据
            for (let row = 0; row < currentTable.rows; row++) {
                if (!currentTable.data[row]) currentTable.data[row] = [];
                currentTable.data[row][currentTable.cols - 1] = `单元格 ${row + 1}-${currentTable.cols}`;
            }
            
            renderTable();
        }

        // 删除行
        function deleteRow() {
            if (!selectedCell || currentTable.rows <= 1) return;
            
            const rowIndex = parseInt(selectedCell.dataset.row);
            
            // 删除行数据
            currentTable.data.splice(rowIndex, 1);
            currentTable.rows--;
            
            renderTable();
        }

        // 删除列
        function deleteColumn() {
            if (!selectedCell || currentTable.cols <= 1) return;
            
            const colIndex = parseInt(selectedCell.dataset.col);
            
            // 删除每行的该列数据
            for (let row = 0; row < currentTable.rows; row++) {
                currentTable.data[row].splice(colIndex, 1);
            }
            currentTable.cols--;
            
            renderTable();
        }

        // 切换标题行
        function toggleHeaderRow() {
            currentTable.hasHeader = !currentTable.hasHeader;
            renderTable();
        }

        // 渲染表格
        // 在renderTable函数中，修改单元格事件监听
        function renderTable() {
            let tableHTML = '';
            
            for (let row = 0; row < currentTable.rows; row++) {
                tableHTML += '<tr>';
                for (let col = 0; col < currentTable.cols; col++) {
                    const isHeader = currentTable.hasHeader && row === 0;
                    const tag = isHeader ? 'th' : 'td';
                    
                    tableHTML += `<${tag} class="${isHeader ? 'header-cell' : ''}" data-row="${row}" data-col="${col}">`;
                    tableHTML += currentTable.data[row]?.[col] || `单元格 ${row + 1}-${col + 1}`;
                    tableHTML += `</${tag}>`;
                }
                tableHTML += '</tr>';
            }
            
            editableTable.innerHTML = tableHTML;
            
            // 重新添加事件监听器
            const cells = editableTable.querySelectorAll('td, th');
            cells.forEach(cell => {
                cell.addEventListener('click', handleCellClick);
                cell.addEventListener('click', handleCellDoubleClick); // 将dblclick改为click
            });
        }

        // 在handleCellClick函数中，添加编辑功能
        function handleCellClick(e) {
            const cell = e.target;
            
            // 移除之前选中的单元格
            const prevSelected = editableTable.querySelector('.selected');
            if (prevSelected) prevSelected.classList.remove('selected');
            
            // 选中当前单元格
            cell.classList.add('selected');
            selectedCell = cell;
            
            // 直接调用编辑功能
            handleCellDoubleClick(e);
        }

        // 处理单元格双击编辑
        function handleCellDoubleClick(e) {
            const cell = e.target;
            const originalContent = cell.innerHTML;
            
            // 创建输入框
            const input = document.createElement('input');
            input.type = 'text';
            input.value = originalContent;
            input.style.width = '100%';
            input.style.height = '100%';
            input.style.border = 'none';
            input.style.padding = '5px';
            input.style.fontSize = 'inherit';
            input.style.textAlign = 'center';
            input.style.outline = '2px solid #4b6cb7';
            
            // 替换单元格内容
            cell.innerHTML = '';
            cell.appendChild(input);
            input.focus();
            
            // 保存编辑内容
            input.addEventListener('blur', function() {
                const newContent = input.value.trim() || originalContent;
                cell.innerHTML = newContent;
                
                // 更新数据
                const row = parseInt(cell.dataset.row);
                const col = parseInt(cell.dataset.col);
                if (currentTable.data[row]) {
                    currentTable.data[row][col] = newContent;
                }
            });
            
            // 按回车保存
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    input.blur();
                }
            });
        }

        // 下载HTML代码
        function downloadHTML() {
            let htmlCode = '<!DOCTYPE html>\n<html>\n<head>\n';
            htmlCode += '<meta charset="UTF-8">\n';
            htmlCode += '<title>生成的表格</title>\n';
            htmlCode += '<style>\n';
            htmlCode += 'table { border-collapse: collapse; width: 100%; }\n';
            htmlCode += 'th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }\n';
            htmlCode += 'th { background-color: #4b6cb7; color: white; }\n';
            htmlCode += '</style>\n</head>\n<body>\n';
            
            htmlCode += '<table>\n';
            
            // 表头
            if (currentTable.hasHeader && currentTable.rows > 0) {
                htmlCode += '  <tr>\n';
                for (let col = 0; col < currentTable.cols; col++) {
                    htmlCode += `    <th>${currentTable.data[0][col]}</th>\n`;
                }
                htmlCode += '  </tr>\n';
            }
            
            // 表格内容
            const startRow = currentTable.hasHeader ? 1 : 0;
            for (let row = startRow; row < currentTable.rows; row++) {
                htmlCode += '  <tr>\n';
                for (let col = 0; col < currentTable.cols; col++) {
                    htmlCode += `    <td>${currentTable.data[row][col]}</td>\n`;
                }
                htmlCode += '  </tr>\n';
            }
            
            htmlCode += '</table>\n</body>\n</html>';
            
            // 创建下载链接
            const blob = new Blob([htmlCode], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'generated-table.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // 初始化应用
        function initApp() {
            initSizeGrid();
            
            // 事件监听器
            createTableBtn.addEventListener('click', createTable);
            resetBtn.addEventListener('click', initSizeGrid);
            backToSizeBtn.addEventListener('click', () => {
                editPage.classList.remove('active');
                sizePage.classList.add('active');
                sizePage.classList.add('fade-in');
            });
            downloadBtn.addEventListener('click', downloadHTML);
            addRowBtn.addEventListener('click', addRow);
            addColBtn.addEventListener('click', addColumn);
            deleteRowBtn.addEventListener('click', deleteRow);
            deleteColBtn.addEventListener('click', deleteColumn);
            headerRowBtn.addEventListener('click', toggleHeaderRow);
            
            // 初始化显示
            rowsCount.textContent = '0';
            colsCount.textContent = '0';
            createTableBtn.disabled = true;
        }

        // 页面加载时初始化
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
