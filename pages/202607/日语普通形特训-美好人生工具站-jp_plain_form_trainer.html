<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日语普通形特训 - 美好人生工具站</title>
    <meta name="description" content="日语动词、一类形容词、二类形容词普通形变换练习工具，支持进度保存和历史记录">
    <meta name="keywords" content="日语学习, 普通形, 动词变形, 形容词变形, 日语语法">
    <meta property="og:title" content="日语普通形特训">
    <meta property="og:description" content="日语动词、形容词普通形变换练习工具">
    <meta property="og:type" content="website">
    <style>
        :root {
            --primary-color: #4a90e2;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            position: relative;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
            color: var(--text-main);
            letter-spacing: 1px;
        }

        /* 卡片 */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            padding: 30px 20px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        /* 菜单 */
        .menu-grid {
            display: grid;
            gap: 15px;
            margin-bottom: 30px;
        }

        .menu-btn {
            background: #fff;
            border: 2px solid #e1e4e8;
            color: var(--text-main);
            padding: 20px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .menu-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.15);
        }

        .menu-btn .icon { font-size: 24px; }

        /* 答题区 */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 14px;
            color: #999;
        }

        .quit-btn {
            color: var(--text-sub);
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px 10px;
        }
        .quit-btn:hover { color: var(--error-color); }

        .progress-container {
            width: 100%;
            background-color: #edf2f7;
            height: 8px;
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-area {
            text-align: center;
            margin: 20px 0;
        }

        .target-form-label {
            font-size: 22px;
            color: var(--primary-color);
            font-weight: bold;
            margin-bottom: 10px;
            display: inline-block;
            background: #eef5ff;
            padding: 8px 20px;
            border-radius: 30px;
        }

        .original-word {
            font-size: 32px;
            font-weight: 800;
            margin: 15px 0 30px 0;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            font-size: 20px;
            border: 2px solid #e1e4e8;
            border-radius: 10px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
            background: #fafafa;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(74, 144, 226, 0.1);
        }

        .action-btn {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit { background-color: var(--primary-color); color: white; }
        .btn-submit:hover { background-color: #357abd; }

        .btn-next { background-color: var(--success-color); color: white; display: none; }
        .btn-next:hover { background-color: #27ae60; }

        /* 反馈 */
        .feedback-card {
            margin-top: 20px;
            padding: 20px;
            background: #fff5f5;
            border-radius: 10px;
            border-left: 5px solid var(--error-color);
            display: none;
            text-align: left;
            animation: slideDown 0.3s ease;
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback-title { color: var(--error-color); font-weight: bold; margin-bottom: 5px; }
        .feedback-answer { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 10px; }
        .feedback-rule { font-size: 14px; color: #666; line-height: 1.5; }

        /* 历史 */
        .history-section { margin-top: 30px; }
        .history-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--text-sub);
            padding-left: 10px;
            border-left: 3px solid var(--text-sub);
        }
        .history-list { display: flex; flex-direction: column; gap: 10px; }
        .history-item {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #eee;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .tag { padding: 2px 8px; border-radius: 4px; font-size: 12px; background: #eee; margin-right: 8px; }
        .tag.verb { background: #e3f2fd; color: #1565c0; }
        .tag.adj-i { background: #e8f5e9; color: #2e7d32; }
        .tag.adj-na { background: #fff3e0; color: #ef6c00; }
        .tag.mode { background: #e8eaf6; color: #3f51b5; }
        .tag.voice { background: #fce4ec; color: #c2185b; }

        .hidden { display: none !important; }

        /* 输入模式切换 */
        .input-mode-toggle {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .input-mode-btn {
            padding: 8px 16px;
            border: 2px solid #e1e4e8;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .input-mode-btn.active {
            border-color: var(--primary-color);
            background: var(--primary-color);
            color: white;
        }
        .input-mode-btn:hover:not(.active) {
            border-color: var(--primary-color);
        }

        /* 语音输入区域 */
        .voice-input-area {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .voice-input-area.active { display: flex; }
        .text-input-area { display: block; }
        .text-input-area.hidden { display: none; }

        .mic-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 32px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .mic-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }
        .mic-btn.listening {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.4); }
            50% { box-shadow: 0 0 0 15px rgba(231, 76, 60, 0); }
        }

        .voice-status {
            font-size: 14px;
            color: var(--text-sub);
            min-height: 20px;
        }
        .voice-result {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-main);
            min-height: 36px;
            padding: 10px 20px;
            background: #f8f9fa;
            border-radius: 10px;
            min-width: 200px;
            text-align: center;
        }
        .voice-hint {
            font-size: 12px;
            color: #999;
        }
        .browser-warning {
            background: #fff3e0;
            border: 1px solid #ffb74d;
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 13px;
            color: #e65100;
            margin-bottom: 15px;
        }

        /* 模式选择弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .modal-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            color: var(--text-main);
        }
        .mode-btn {
            width: 100%;
            padding: 15px;
            margin-bottom: 12px;
            border: 2px solid #e1e4e8;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }
        .mode-btn:hover {
            border-color: var(--primary-color);
            background: #f8faff;
        }
        .mode-btn .mode-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            display: block;
        }
        .mode-btn .mode-desc {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 4px;
        }
        .mode-btn .mode-count {
            font-size: 12px;
            color: var(--primary-color);
            margin-top: 6px;
        }
        .modal-close {
            width: 100%;
            padding: 12px;
            border: none;
            background: #f0f0f0;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-sub);
            margin-top: 8px;
        }
        .modal-close:hover {
            background: #e0e0e0;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="menuPage">
        <h1>日语普通形特训</h1>
        
        <div class="menu-grid">
            <button class="menu-btn" onclick="checkProgressAndStart('verb', '动词')">
                <span>动词 (Verb)</span>
                <span class="icon">🏃</span>
            </button>
            <button class="menu-btn" onclick="checkProgressAndStart('adj-i', '一类形容词')">
                <span>一类形容词 (い)</span>
                <span class="icon">😊</span>
            </button>
            <button class="menu-btn" onclick="checkProgressAndStart('adj-na', '二类形/名词')">
                <span>二类形容词/名词 (な)</span>
                <span class="icon">🌸</span>
            </button>
        </div>

        <div class="history-section">
            <div class="history-title">最近练习历史</div>
            <div class="history-list" id="historyList">
                <div style="text-align: center; color: #999; padding: 20px;">暂无记录</div>
            </div>
        </div>
    </div>

    <!-- 模式选择弹窗 -->
    <div id="modeModal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">选择练习模式</div>
            <button class="mode-btn" onclick="selectMode('all')">
                <span class="mode-name">📚 全部练习</span>
                <span class="mode-desc">从头开始练习所有题目</span>
                <span class="mode-count" id="allCount"></span>
            </button>
            <button class="mode-btn" onclick="selectMode('smart')">
                <span class="mode-name">🎯 智能练习</span>
                <span class="mode-desc">只练习未做过的题目和错题</span>
                <span class="mode-count" id="smartCount"></span>
            </button>
            <button class="modal-close" onclick="closeModal()">取消</button>
        </div>
    </div>

    <div id="quizPage" class="card hidden">
        <div class="quiz-header">
            <span id="statsText">进度: 1/10 | 正确率: -</span>
            <button class="quit-btn" onclick="confirmQuit()">✕ 退出 / 保存</button>
        </div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="question-area">
            <div class="target-form-label" id="targetForm">普通形 (过去否定)</div>
            <div class="original-word" id="questionWord">買います</div>

            <!-- 输入模式切换 -->
            <div class="input-mode-toggle">
                <button class="input-mode-btn active" data-mode="text" onclick="switchInputMode('text')">⌨️ 打字</button>
                <button class="input-mode-btn" data-mode="voice" onclick="switchInputMode('voice')">🎤 语音</button>
            </div>

            <!-- 文字输入区域 -->
            <div class="text-input-area" id="textInputArea">
                <input type="text" id="answerInput" placeholder="输入答案后按 Enter" autocomplete="off">
            </div>

            <!-- 语音输入区域 -->
            <div class="voice-input-area" id="voiceInputArea">
                <div id="browserWarning" class="browser-warning hidden">
                    ⚠️ 您的浏览器不支持语音识别，请使用 Chrome 或 Edge
                </div>
                <button class="mic-btn" id="micBtn" onclick="toggleVoiceInput()">🎤</button>
                <div class="voice-status" id="voiceStatus">点击麦克风开始说话</div>
                <div class="voice-result" id="voiceResult">-</div>
                <div class="voice-hint">自动连续识别 · 点击麦克风可暂停</div>
            </div>

            <button class="action-btn btn-submit" id="submitBtn" onclick="checkAnswer()">提交 (Enter)</button>
            <button class="action-btn btn-next" id="nextBtn" onclick="nextQuestion()">下一题 (Space)</button>
        </div>

        <div class="feedback-card" id="feedback">
            <div class="feedback-title">回答错误</div>
            <div class="feedback-answer" id="correctAnswer"></div>
            <div class="feedback-rule" id="ruleTip"></div>
        </div>
    </div>
</div>

<script>
    // --- 数据源 (保持不变) ---
    const verbs = [
        ["買います", "買う", "買わない", "買った", "買わなかった", "v1"],
        ["待ちます", "待つ", "待たない", "待った", "待たなかった", "v1"],
        ["わかります", "わかる", "わからない", "わかった", "わからなかった", "v1"],
        ["あります", "ある", "ない", "あった", "なかった", "v1-special"],
        ["頑張ります", "頑張る", "頑張らない", "頑張った", "頑張らなかった", "v1"],
        ["死にます", "死ぬ", "死なない", "死んだ", "死ななかった", "v1"],
        ["遊びます", "遊ぶ", "遊ばない", "遊んだ", "遊ばなかった", "v1"],
        ["休みます", "休む", "休まない", "休んだ", "休まなかった", "v1"],
        ["聞きます", "聞く", "聞かない", "聞いた", "聞かなかった", "v1"],
        ["急ぎます", "急ぐ", "急がない", "急いだ", "急がなかった", "v1"],
        ["話します", "話す", "話さない", "話した", "話さなかった", "v1"],
        ["出します", "出す", "出さない", "出した", "出さなかった", "v1"],
        ["返します", "返す", "返さない", "返した", "返さなかった", "v1"],
        ["行きます", "行く", "行かない", "行った", "行かなかった", "v1-special"],
        ["使います", "使う", "使わない", "使った", "使わなかった", "v1"],
        ["作ります", "作る", "作らない", "作った", "作らなかった", "v1"],
        ["調べます", "調べる", "調べない", "調べた", "調べなかった", "v2"],
        ["食べます", "食べる", "食べない", "食べた", "食べなかった", "v2"],
        ["見せます", "見せる", "見せない", "見せた", "見せなかった", "v2"],
        ["開けます", "開ける", "開けない", "開けた", "開けなかった", "v2"],
        ["閉めます", "閉める", "閉めない", "閉めた", "閉めなかった", "v2"],
        ["起きます", "起きる", "起きない", "起きた", "起きなかった", "v2"],
        ["寝ます", "寝る", "寝ない", "寝た", "寝なかった", "v2"],
        ["見ます", "見る", "見ない", "見た", "見なかった", "v2"],
        ["借ります", "借りる", "借りない", "借りた", "借りなかった", "v2"],
        ["います", "いる", "いない", "いた", "いなかった", "v2"],
        ["来ます", "来る", "来ない", "来た", "来なかった", "v3"],
        ["持って来ます", "持って来る", "持って来ない", "持って来た", "持って来なかった", "v3"],
        ["します", "する", "しない", "した", "しなかった", "v3"],
        ["勉強します", "勉強する", "勉強しない", "勉強した", "勉強しなかった", "v3"],
        ["会議します", "会議する", "会議しない", "会議した", "会議しなかった", "v3"],
        ["買い物します", "買い物する", "買い物しない", "買い物した", "買い物しなかった", "v3"],
        ["結婚します", "結婚する", "結婚しない", "結婚した", "結婚しなかった", "v3"],
        ["住みます", "住む", "住まない", "住んだ", "住まなかった", "v1"],
        ["持ちます", "持つ", "持たない", "持った", "持たなかった", "v1"],
        ["知ります", "知る", "知らない", "知った", "知らなかった", "v1"],
        ["座ります", "座る", "座らない", "座った", "座らなかった", "v1"]
    ];

    const adjI = [
        ["大きいです", "大きい", "大きくない", "大きかった", "大きくなかった", "adj-i"],
        ["小さいです", "小さい", "小さくない", "小さかった", "小さくなかった", "adj-i"],
        ["新しいです", "新しい", "新しくない", "新しかった", "新しくなかった", "adj-i"],
        ["古いです", "古い", "古くない", "古かった", "古くなかった", "adj-i"],
        ["いいです", "いい", "よくない", "よかった", "よくなかった", "adj-i-good"],
        ["悪いです", "悪い", "悪くない", "悪かった", "悪くなかった", "adj-i"],
        ["暑いです", "暑い", "暑くない", "暑かった", "暑くなかった", "adj-i"],
        ["寒いです", "寒い", "寒くない", "寒かった", "寒くなかった", "adj-i"],
        ["高いです", "高い", "高くない", "高かった", "高くなかった", "adj-i"],
        ["安いです", "安い", "安くない", "安かった", "安くなかった", "adj-i"],
        ["難しいです", "難しい", "難しくない", "難しかった", "難しくなかった", "adj-i"],
        ["おいしいです", "おいしい", "おいしくない", "おいしかった", "おいしくなかった", "adj-i"],
        ["楽しいです", "楽しい", "楽しくない", "楽しかった", "楽しくなかった", "adj-i"],
        ["忙しいです", "忙しい", "忙しくない", "忙しかった", "忙しくなかった", "adj-i"],
        ["眠いです", "眠い", "眠くない", "眠かった", "眠くなかった", "adj-i"]
    ];

    const adjNa = [
        ["綺麗です", "綺麗だ", "綺麗じゃない", "綺麗だった", "綺麗じゃなかった", "adj-na"],
        ["暇です", "暇だ", "暇じゃない", "暇だった", "暇じゃなかった", "adj-na"],
        ["便利です", "便利だ", "便利じゃない", "便利だった", "便利じゃなかった", "adj-na"],
        ["有名です", "有名だ", "有名じゃない", "有名だった", "有名じゃなかった", "adj-na"],
        ["好きです", "好きだ", "好きじゃない", "好きだった", "好きじゃなかった", "adj-na"],
        ["簡単です", "簡単だ", "簡単じゃない", "簡単だった", "簡単じゃなかった", "adj-na"],
        ["大変です", "大変だ", "大変じゃない", "大変だった", "大変じゃなかった", "adj-na"],
        ["大切です", "大切だ", "大切じゃない", "大切だった", "大切じゃなかった", "adj-na"],
        ["大事です", "大事だ", "大事じゃない", "大事だった", "大事じゃなかった", "adj-na"],
        ["無理です", "無理だ", "無理じゃない", "無理だった", "無理じゃなかった", "adj-na"],
        ["無駄です", "無駄だ", "無駄じゃない", "無駄だった", "無駄じゃなかった", "adj-na"],
        ["真面目です", "真面目だ", "真面目じゃない", "真面目だった", "真面目じゃなかった", "adj-na"],
        ["心配です", "心配だ", "心配じゃない", "心配だった", "心配じゃなかった", "adj-na"],
        ["同僚です", "同僚だ", "同僚じゃない", "同僚だった", "同僚じゃなかった", "noun"],
        ["中国人です", "中国人だ", "中国人じゃない", "中国人だった", "中国人じゃなかった", "noun"]
    ];

    const rules = {
        "v1": {
            "plain": "一类动词：去「ます」，词尾「i」段变「u」段。",
            "neg": "一类否定：去「ます」，词尾「i」段变「a」段 + ない。(い→わ)",
            "past": "一类过去：根据词尾音变 (い·ち·り→った, み·に·び→んだ, き→いた) + た/だ。",
            "pastNeg": "一类过去否定：先变「ない」形，去「い」加「かった」。"
        },
        "v2": {
            "plain": "二类动词：去「ます」加「る」。",
            "neg": "二类否定：去「ます」加「ない」。",
            "past": "二类过去：去「ます」加「た」。",
            "pastNeg": "二类过去否定：先变「ない」形，去「い」加「かった」。"
        },
        "v3": {
            "plain": "三类：します→する；来(き)ます→来(く)る。",
            "neg": "三类否定：します→しない；来(き)ます→来(こ)ない。",
            "past": "三类过去：します→した；来(き)ます→来(き)た。",
            "pastNeg": "三类过去否定：しない→しなかった；こない→こなかった。"
        },
        "adj-i": {
            "plain": "一类形容词：去掉「です」。",
            "neg": "一类形否定：去掉「い」加「くない」。",
            "past": "一类形过去：去掉「い」加「かった」。",
            "pastNeg": "一类形过去否定：去掉「い」加「くなかった」。"
        },
        "adj-na": {
            "plain": "二类形/名词：去「です」加「だ」。",
            "neg": "二类形否定：去「です」加「じゃない」。",
            "past": "二类形过去：去「です」加「だった」。",
            "pastNeg": "二类形过去否定：去「です」加「じゃなかった」。"
        }
    };
    rules["v1-special"] = { ...rules["v1"], "past": "特例：行きます → 行った (促音变)" };
    rules["adj-i-good"] = { "plain": "いい", "neg": "よくない", "past": "よかった", "pastNeg": "よくなかった" };
    rules["noun"] = rules["adj-na"];

    // --- 状态 ---
    let state = {
        quizList: [],
        currentIndex: 0,
        correctCount: 0,
        category: '',
        categoryName: '',
        startTime: null,
        accumulatedTime: 0,
        isWaitingNext: false, // 状态机
        mode: 'all', // 'all' 或 'smart'
        pendingCategory: null,
        pendingCategoryName: null,
        inputMode: 'text', // 'text' 或 'voice'
        isListening: false,
        voiceModeActive: false // 语音模式是否激活（用于自动连续识别）
    };

    // ============ 语音识别相关 ============
    let recognition = null;
    let speechSupported = false;

    // 初始化语音识别
    function initSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            speechSupported = false;
            return;
        }

        speechSupported = true;
        recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.continuous = false;
        recognition.interimResults = true;

        recognition.onstart = () => {
            state.isListening = true;
            document.getElementById('micBtn').classList.add('listening');
            document.getElementById('voiceStatus').textContent = '正在听...请说日语';
            document.getElementById('voiceResult').textContent = '...';
        };

        recognition.onresult = (event) => {
            const result = event.results[0];
            const transcript = result[0].transcript;
            document.getElementById('voiceResult').textContent = transcript;

            if (result.isFinal) {
                // 识别完成，立即提交（无延迟）
                checkVoiceAnswer(transcript);
            }
        };

        recognition.onerror = (event) => {
            console.error('Speech recognition error:', event.error);
            state.isListening = false;
            document.getElementById('micBtn').classList.remove('listening');

            if (event.error === 'no-speech') {
                document.getElementById('voiceStatus').textContent = '没有检测到声音，请再试一次';
            } else if (event.error === 'not-allowed') {
                document.getElementById('voiceStatus').textContent = '请允许麦克风权限';
            } else {
                document.getElementById('voiceStatus').textContent = '识别出错，请再试一次';
            }
        };

        recognition.onend = () => {
            state.isListening = false;
            document.getElementById('micBtn').classList.remove('listening');
            if (document.getElementById('voiceResult').textContent === '...') {
                document.getElementById('voiceStatus').textContent = '点击麦克风开始说话';
            }

            // 语音模式下自动重新开始识别（如果不是在等待下一题）
            if (state.inputMode === 'voice' && !state.isWaitingNext && state.voiceModeActive) {
                setTimeout(() => {
                    if (state.inputMode === 'voice' && !state.isWaitingNext && state.voiceModeActive) {
                        document.getElementById('voiceResult').textContent = '-';
                        document.getElementById('voiceStatus').textContent = '请说出答案...';
                        recognition.start();
                    }
                }, 200);
            }
        };
    }

    // 切换输入模式
    function switchInputMode(mode) {
        state.inputMode = mode;

        // 更新按钮状态
        document.querySelectorAll('.input-mode-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.mode === mode);
        });

        // 切换显示区域
        const textArea = document.getElementById('textInputArea');
        const voiceArea = document.getElementById('voiceInputArea');

        if (mode === 'text') {
            state.voiceModeActive = false;
            textArea.classList.remove('hidden');
            voiceArea.classList.remove('active');
            document.getElementById('submitBtn').style.display = state.isWaitingNext ? 'none' : 'block';
            // 停止当前识别
            if (recognition && state.isListening) {
                recognition.stop();
            }
        } else {
            textArea.classList.add('hidden');
            voiceArea.classList.add('active');
            document.getElementById('submitBtn').style.display = 'none';

            // 检查浏览器支持
            if (!speechSupported) {
                document.getElementById('browserWarning').classList.remove('hidden');
                return;
            }

            // 激活语音模式并自动开始识别
            state.voiceModeActive = true;
            if (!state.isWaitingNext && !state.isListening) {
                document.getElementById('voiceResult').textContent = '-';
                document.getElementById('voiceStatus').textContent = '请说出答案...';
                setTimeout(() => {
                    if (state.voiceModeActive && !state.isListening) {
                        recognition.start();
                    }
                }, 100);
            }
        }
    }

    // 开始/停止语音输入（点击麦克风按钮）
    function toggleVoiceInput() {
        if (!speechSupported) {
            alert('您的浏览器不支持语音识别，请使用 Chrome 或 Edge 浏览器');
            return;
        }

        // 如果在等待下一题，点击麦克风进入下一题
        if (state.isWaitingNext) {
            nextQuestion();
            return;
        }

        // 切换暂停/继续语音识别
        if (state.isListening) {
            state.voiceModeActive = false;
            recognition.stop();
            document.getElementById('voiceStatus').textContent = '已暂停，点击麦克风继续';
        } else {
            state.voiceModeActive = true;
            document.getElementById('voiceResult').textContent = '-';
            document.getElementById('voiceStatus').textContent = '请说出答案...';
            recognition.start();
        }
    }

    // 检查语音答案
    function checkVoiceAnswer(spoken) {
        if (state.isWaitingNext) return;

        const currentQ = state.quizList[state.currentIndex];
        const questionKey = getQuestionKey(currentQ);
        const correctAnswer = currentQ.a;

        // 使用智能比较
        if (compareAnswers(spoken, correctAnswer)) {
            // 正确
            document.getElementById('voiceStatus').textContent = '✅ 正确！';
            saveQuestionStatus(state.category, questionKey, true);
            state.correctCount++;
            // 快速进入下一题
            setTimeout(() => nextQuestion(), 600);
        } else {
            // 错误 - 暂停自动识别，等待用户点击下一题
            document.getElementById('voiceStatus').textContent = '❌ 点击麦克风看下一题';
            saveQuestionStatus(state.category, questionKey, false);
            showError(currentQ);
        }
    }

    // 日语汉字转平假名映射表（按长度排序，长的优先匹配）
    const kanaMap = [
        // 复合词（优先匹配）
        ['分から', 'わから'], ['分かり', 'わかり'], ['分かる', 'わかる'], ['分かっ', 'わかっ'],
        ['頑張', 'がんば'], ['勉強', 'べんきょう'], ['会議', 'かいぎ'], ['買物', 'かいもの'],
        ['買い物', 'かいもの'], ['結婚', 'けっこん'], ['綺麗', 'きれい'], ['便利', 'べんり'],
        ['有名', 'ゆうめい'], ['簡単', 'かんたん'], ['大変', 'たいへん'], ['大切', 'たいせつ'],
        ['大事', 'だいじ'], ['無理', 'むり'], ['無駄', 'むだ'], ['真面目', 'まじめ'],
        ['心配', 'しんぱい'], ['同僚', 'どうりょう'], ['中国人', 'ちゅうごくじん'],
        ['持って来', 'もってき'], ['持って来', 'もってく'],
        // 动词（单字）
        ['買', 'か'], ['待', 'ま'], ['死', 'し'], ['遊', 'あそ'], ['休', 'やす'],
        ['聞', 'き'], ['急', 'いそ'], ['話', 'はな'], ['出', 'だ'], ['返', 'かえ'],
        ['行', 'い'], ['使', 'つか'], ['作', 'つく'], ['調', 'しら'], ['食', 'た'],
        ['見', 'み'], ['開', 'あ'], ['閉', 'し'], ['起', 'お'], ['寝', 'ね'],
        ['借', 'か'], ['来', 'き'], ['来', 'く'], ['来', 'こ'], ['持', 'も'],
        ['住', 'す'], ['知', 'し'], ['座', 'すわ'],
        // 形容词
        ['大き', 'おおき'], ['小さ', 'ちいさ'], ['新し', 'あたらし'], ['古', 'ふる'],
        ['悪', 'わる'], ['暑', 'あつ'], ['寒', 'さむ'], ['高', 'たか'], ['安', 'やす'],
        ['難し', 'むずかし'], ['楽し', 'たのし'], ['忙し', 'いそがし'], ['眠', 'ねむ'],
        ['暇', 'ひま'], ['好', 'す']
    ];

    // 标准化日语文本（转为平假名，用于比较）
    function toHiragana(str) {
        if (!str) return '';
        let result = str;

        // 按顺序替换（长词优先）
        for (const [kanji, hiragana] of kanaMap) {
            result = result.split(kanji).join(hiragana);
        }

        // 片假名转平假名
        result = result.replace(/[\u30A1-\u30F6]/g, char =>
            String.fromCharCode(char.charCodeAt(0) - 0x60)
        );

        return result;
    }

    // 智能答案比较（处理同音异字、写法差异、语音截断）
    function compareAnswers(spoken, correct) {
        if (!spoken || !correct) return false;

        const spokenClean = spoken.trim();
        const correctClean = correct.trim();

        // 1. 完全匹配
        if (spokenClean === correctClean) return true;

        // 2. 转换为平假名后比较
        const spokenHira = toHiragana(spokenClean);
        const correctHira = toHiragana(correctClean);
        if (spokenHira === correctHira) return true;

        // 3. 处理常见的等价写法
        const equivalents = {
            'じゃ': 'では',
            'では': 'じゃ'
        };

        let spokenAlt = spokenHira;
        for (const [from, to] of Object.entries(equivalents)) {
            spokenAlt = spokenAlt.split(from).join(to);
        }
        if (spokenAlt === correctHira) return true;

        // 4. 处理语音识别截断问题（结尾被吃掉1-2个字符）
        // 例如：「頑張らなかっ」应该匹配「頑張らなかった」
        const truncationPatterns = [
            // 检查是否只差结尾的た
            { suffix: 'た', missing: '' },
            { suffix: 'った', missing: 'っ' },
            { suffix: 'かった', missing: 'かっ' },
            { suffix: 'なかった', missing: 'なかっ' },
            { suffix: 'だ', missing: '' },
            { suffix: 'んだ', missing: 'ん' },
        ];

        for (const pattern of truncationPatterns) {
            if (correctHira.endsWith(pattern.suffix)) {
                const expectedTruncated = correctHira.slice(0, -pattern.suffix.length) + pattern.missing;
                if (spokenHira === expectedTruncated) return true;
            }
        }

        // 5. 通用截断检测：如果说的是正确答案去掉最后1-2个字符
        if (correctHira.length > 2) {
            if (spokenHira === correctHira.slice(0, -1) ||
                spokenHira === correctHira.slice(0, -2)) {
                return true;
            }
        }

        return false;
    }

    // 获取题目状态存储
    function getQuestionStatus(category) {
        const key = 'jp_quiz_status_' + category;
        return JSON.parse(localStorage.getItem(key) || '{}');
    }

    // 保存题目状态
    function saveQuestionStatus(category, questionKey, isCorrect) {
        const key = 'jp_quiz_status_' + category;
        const status = getQuestionStatus(category);
        status[questionKey] = isCorrect ? 'correct' : 'wrong';
        localStorage.setItem(key, JSON.stringify(status));
    }

    // 生成题目唯一键
    function getQuestionKey(q) {
        return q.q + '_' + q.ruleType;
    }

    // 计算智能模式题目数量
    function countSmartQuestions(category) {
        let source = (category === 'verb') ? verbs : (category === 'adj-i') ? adjI : adjNa;
        const allQuestions = generateQuestions(source);
        const status = getQuestionStatus(category);

        return allQuestions.filter(q => {
            const key = getQuestionKey(q);
            return status[key] !== 'correct'; // 未做或错题
        }).length;
    }

    window.onload = function() {
        renderHistory();
        setupKeyHandlers();
        initSpeechRecognition();
    };

    function generateQuestions(sourceData) {
        let qList = [];
        sourceData.forEach(item => {
            const polite = item[0];
            const type = item[5];
            qList.push({ q: polite, target: "普通形 (肯定)", a: item[1], type: type, ruleType: "plain" });
            qList.push({ q: polite, target: "普通形 (否定)", a: item[2], type: type, ruleType: "neg" });
            qList.push({ q: polite, target: "普通形 (过去)", a: item[3], type: type, ruleType: "past" });
            qList.push({ q: polite, target: "普通形 (过去否定)", a: item[4], type: type, ruleType: "pastNeg" });
        });
        return qList;
    }

    function checkProgressAndStart(category, categoryName) {
        // 保存待选分类
        state.pendingCategory = category;
        state.pendingCategoryName = categoryName;

        // 计算题目数量
        let source = (category === 'verb') ? verbs : (category === 'adj-i') ? adjI : adjNa;
        const allCount = generateQuestions(source).length;
        const smartCount = countSmartQuestions(category);

        // 更新弹窗显示
        document.getElementById('modalTitle').innerText = `${categoryName} - 选择练习模式`;
        document.getElementById('allCount').innerText = `共 ${allCount} 题`;

        if (smartCount === 0) {
            document.getElementById('smartCount').innerText = '🎉 太棒了！全部正确，无需复习';
        } else if (smartCount === allCount) {
            document.getElementById('smartCount').innerText = `共 ${smartCount} 题（全部未做）`;
        } else {
            document.getElementById('smartCount').innerText = `共 ${smartCount} 题（未做 + 错题）`;
        }

        // 显示弹窗
        document.getElementById('modeModal').classList.remove('hidden');
    }

    function closeModal() {
        document.getElementById('modeModal').classList.add('hidden');
        state.pendingCategory = null;
        state.pendingCategoryName = null;
    }

    function selectMode(mode) {
        const category = state.pendingCategory;
        const categoryName = state.pendingCategoryName;
        state.mode = mode;

        closeModal();

        // 检查是否有未完成的进度
        const saved = localStorage.getItem('jp_quiz_progress_' + category);
        if (saved && mode === 'all') {
            const data = JSON.parse(saved);
            if (data.index < data.total && data.mode === mode) {
                if(confirm(`检测到【${categoryName}】有未完成的进度（第 ${data.index + 1} 题），是否继续？`)) {
                    startQuiz(category, categoryName, true, data);
                    return;
                }
            }
        }

        startQuiz(category, categoryName, false);
    }

    function startQuiz(category, categoryName, isResume, savedData = null) {
        let source = (category === 'verb') ? verbs : (category === 'adj-i') ? adjI : adjNa;
        let allQuestions = generateQuestions(source);

        // 根据模式筛选题目
        if (state.mode === 'smart') {
            const status = getQuestionStatus(category);
            allQuestions = allQuestions.filter(q => {
                const key = getQuestionKey(q);
                return status[key] !== 'correct'; // 只保留未做和错题
            });

            if (allQuestions.length === 0) {
                alert('🎉 太棒了！所有题目都已正确完成，无需复习！');
                return;
            }
        }

        state.quizList = allQuestions;
        state.category = category;
        state.categoryName = categoryName;
        state.startTime = Date.now();
        state.isWaitingNext = false;
        state.inputMode = 'text';
        state.voiceModeActive = false;

        if (isResume && savedData) {
            state.currentIndex = savedData.index;
            state.correctCount = savedData.correct;
            state.accumulatedTime = savedData.accTime || 0;
        } else {
            state.currentIndex = 0;
            state.correctCount = 0;
            state.accumulatedTime = 0;
        }

        document.getElementById('menuPage').classList.add('hidden');
        document.getElementById('quizPage').classList.remove('hidden');

        // 重置输入模式UI
        document.querySelectorAll('.input-mode-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.mode === 'text');
        });
        document.getElementById('textInputArea').classList.remove('hidden');
        document.getElementById('voiceInputArea').classList.remove('active');

        loadQuestion();
    }

    function loadQuestion() {
        state.isWaitingNext = false;
        const q = state.quizList[state.currentIndex];
        const total = state.quizList.length;

        // 1. UI 内容更新
        document.getElementById('targetForm').innerText = q.target;
        document.getElementById('questionWord').innerText = q.q;

        // 2. 更新进度与准确率显示
        updateStats();

        document.getElementById('progressBar').style.width = `${((state.currentIndex) / total) * 100}%`;

        // 3. 重置输入框 (强制清空)
        const input = document.getElementById('answerInput');
        input.value = '';
        input.disabled = false;
        if (state.inputMode === 'text') {
            input.focus();
        }

        // 4. 按钮状态重置
        document.getElementById('submitBtn').style.display = state.inputMode === 'text' ? 'block' : 'none';
        document.getElementById('nextBtn').style.display = 'none';
        document.getElementById('feedback').style.display = 'none';

        // 5. 重置语音输入状态并自动开始识别
        if (state.inputMode === 'voice') {
            document.getElementById('voiceResult').textContent = '-';
            if (state.voiceModeActive) {
                document.getElementById('voiceStatus').textContent = '请说出答案...';
                // 短延迟后启动识别
                setTimeout(() => {
                    if (state.voiceModeActive && !state.isListening && state.inputMode === 'voice') {
                        recognition.start();
                    }
                }, 150);
            } else {
                document.getElementById('voiceStatus').textContent = '点击麦克风开始说话';
            }
        }

        saveProgress();
    }

    function updateStats() {
        // 计算公式：已做题目 = 当前索引 (因为index从0开始，index 5 表示前 5 题已完成)
        // 但如果在做第 6 题（index 5），准确率应该是基于前5题的。
        // 如果答错了当前题，在Error页，我们希望准确率把当前题算作"已尝试且错误"。
        
        let attempted = state.currentIndex; 
        if (state.isWaitingNext) {
            // 如果正在等待下一题（说明当前题答错了），那么尝试次数要+1
            attempted += 1;
        }

        let accText = "-";
        if (attempted > 0) {
            const acc = Math.round((state.correctCount / attempted) * 100);
            accText = `${acc}% (${state.correctCount}/${attempted})`;
        }

        document.getElementById('statsText').innerText = 
            `进度: ${state.currentIndex + 1}/${state.quizList.length} | 正确率: ${accText}`;
    }

    function checkAnswer() {
        const input = document.getElementById('answerInput');
        const val = input.value.trim();
        if (!val) return;

        const currentQ = state.quizList[state.currentIndex];
        const questionKey = getQuestionKey(currentQ);

        if (val === currentQ.a) {
            // 正确：保存状态并自动跳下一题
            saveQuestionStatus(state.category, questionKey, true);
            state.correctCount++;
            nextQuestion();
        } else {
            // 错误：保存状态并显示反馈
            saveQuestionStatus(state.category, questionKey, false);
            showError(currentQ);
        }
    }

    function showError(q) {
        state.isWaitingNext = true; // 进入等待状态
        
        // 立即更新准确率（把这道错题算进去）
        updateStats();

        const fb = document.getElementById('feedback');
        fb.style.display = 'block';
        document.getElementById('correctAnswer').innerText = `正确答案：${q.a}`;
        
        let rText = (rules[q.type] && rules[q.type][q.ruleType]) ? rules[q.type][q.ruleType] : "暂无";
        document.getElementById('ruleTip').innerText = rText;

        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('nextBtn').style.display = 'block';
    }

    function nextQuestion() {
        state.currentIndex++;
        if (state.currentIndex < state.quizList.length) {
            loadQuestion();
        } else {
            finishQuiz();
        }
    }

    // --- 键盘事件处理 (核心修改) ---
    function setupKeyHandlers() {
        // 1. 输入框 Enter 处理 (防输入法冲突)
        const input = document.getElementById('answerInput');
        
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                // 如果正在输入法选词中 (isComposing 为 true)，则不提交
                if (e.isComposing) {
                    return; 
                }
                // 只有在非等待状态下，Enter 才提交答案
                if (!state.isWaitingNext) {
                    checkAnswer();
                }
            }
        });

        // 2. 全局 Space 处理 (下一题)
        document.addEventListener('keydown', function(e) {
            // 只有在等待下一题（回答错误显示结果）时，Space 才生效
            if (state.isWaitingNext && e.code === 'Space') {
                e.preventDefault(); // 防止页面滚动
                nextQuestion();
            }
        });
    }

    // --- 辅助功能 ---

    function saveProgress() {
        const data = {
            index: state.currentIndex,
            total: state.quizList.length,
            correct: state.correctCount,
            accTime: getCurrentDuration(),
            mode: state.mode
        };
        localStorage.setItem('jp_quiz_progress_' + state.category, JSON.stringify(data));
    }

    function clearProgress() {
        localStorage.removeItem('jp_quiz_progress_' + state.category);
    }

    function getCurrentDuration() {
        const now = Date.now();
        const sessionTime = Math.floor((now - state.startTime) / 1000);
        return state.accumulatedTime + sessionTime;
    }

    function confirmQuit() {
        if(confirm("确定要退出吗？您的进度已自动保存。")) {
            saveProgress(); 
            addHistoryRecord(false); 
            returnToMenu();
        }
    }

    function finishQuiz() {
        saveProgress();
        const acc = Math.round((state.correctCount / state.quizList.length) * 100);
        const timeStr = formatDuration(getCurrentDuration());
        
        alert(`恭喜完成！\n正确率：${acc}%\n总耗时：${timeStr}`);
        
        addHistoryRecord(true);
        clearProgress();
        returnToMenu();
    }

    function addHistoryRecord(isComplete) {
        // 防止除以0
        let effectiveTotal = state.currentIndex;
        if (isComplete) effectiveTotal = state.quizList.length;
        if (effectiveTotal === 0) return;

        const record = {
            date: new Date().toLocaleString(),
            category: state.categoryName,
            count: effectiveTotal,
            total: state.quizList.length,
            duration: formatDuration(getCurrentDuration()),
            accuracy: Math.round((state.correctCount / effectiveTotal) * 100),
            mode: state.mode, // 保存练习模式
            inputMode: state.inputMode // 保存输入模式（打字/语音）
        };

        let history = JSON.parse(localStorage.getItem('jp_quiz_history') || '[]');
        history.unshift(record);
        if (history.length > 20) history.pop();
        localStorage.setItem('jp_quiz_history', JSON.stringify(history));
    }

    function renderHistory() {
        const list = document.getElementById('historyList');
        const history = JSON.parse(localStorage.getItem('jp_quiz_history') || '[]');

        if (history.length === 0) {
            list.innerHTML = '<div style="text-align: center; color: #999; padding: 20px;">暂无记录</div>';
            return;
        }

        let html = '';
        history.forEach(item => {
            let tagClass = 'tag';
            if(item.category.includes('动词')) tagClass += ' verb';
            else if(item.category.includes('一类')) tagClass += ' adj-i';
            else tagClass += ' adj-na';

            // 模式标签
            const modeText = item.mode === 'smart' ? '🎯智能' : '📚全部';
            // 输入模式标签
            const inputModeText = item.inputMode === 'voice' ? '🎤语音' : '⌨️打字';

            html += `
            <div class="history-item">
                <div>
                    <div style="margin-bottom:5px;">
                        <span class="${tagClass}">${item.category}</span>
                        <span class="tag mode">${modeText}</span>
                        <span class="tag voice">${inputModeText}</span>
                        <span style="font-weight:bold; color: #2c3e50;">正确率 ${item.accuracy}%</span>
                    </div>
                    <div style="color: #999; font-size: 12px;">
                        ${item.date} · 耗时 ${item.duration}
                    </div>
                </div>
                <div style="text-align: right;">
                    <div style="font-size: 16px; font-weight: bold;">${item.count}题</div>
                </div>
            </div>`;
        });
        list.innerHTML = html;
    }

    function returnToMenu() {
        // 停止语音识别
        state.voiceModeActive = false;
        if (recognition && state.isListening) {
            recognition.stop();
        }
        // 重置输入模式为打字
        state.inputMode = 'text';

        document.getElementById('quizPage').classList.add('hidden');
        document.getElementById('menuPage').classList.remove('hidden');
        renderHistory();
    }

    function formatDuration(seconds) {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return (m > 0 ? `${m}分` : "") + `${s}秒`;
    }

</script>
