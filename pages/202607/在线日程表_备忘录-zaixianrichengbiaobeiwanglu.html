<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线日程表/备忘录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            gap: 20px;
            height: calc(100vh - 200px);
        }

        .sidebar {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow-y: auto;
        }

        .calendar-area {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .section-title {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 8px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #555;
        }

        .control-group input,
        .control-group select,
        .control-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .control-group input:focus,
        .control-group select:focus,
        .control-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #333;
            border: 2px solid #e0e0e0;
        }

        .btn-secondary:hover {
            background: #e9ecef;
        }

        .btn-success {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #dc3545 0%, #e83e8c 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.3);
        }

        .btn-small {
            padding: 5px 10px;
            font-size: 12px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        .calendar-nav {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .calendar-title {
            font-size: 1.5em;
            font-weight: 600;
            color: #333;
        }

        .nav-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: #f8f9fa;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background: #667eea;
            color: white;
        }

        .calendar-grid {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .calendar-table {
            width: 100%;
            border-collapse: collapse;
        }

        .calendar-table th,
        .calendar-table td {
            border: 1px solid #e0e0e0;
            text-align: center;
            vertical-align: top;
            position: relative;
        }

        .calendar-table th {
            background: #f8f9fa;
            padding: 10px;
            font-weight: 600;
            color: #555;
        }

        .calendar-table td {
            height: 100px;
            padding: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .calendar-table td:hover {
            background: #f0f4ff;
        }

        .calendar-table td.other-month {
            color: #ccc;
            background: #fafafa;
        }

        .calendar-table td.today {
            background: #667eea;
            color: white;
            font-weight: bold;
        }

        .calendar-table td.selected {
            background: #764ba2;
            color: white;
        }

        .date-number {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .event-item {
            background: #667eea;
            color: white;
            padding: 2px 5px;
            border-radius: 3px;
            font-size: 10px;
            margin-bottom: 2px;
            cursor: pointer;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .event-item.high {
            background: #dc3545;
        }

        .event-item.medium {
            background: #ffc107;
            color: #333;
        }

        .event-item.low {
            background: #28a745;
        }

        .memo-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .memo-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .memo-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .memo-item.completed {
            opacity: 0.6;
            text-decoration: line-through;
            border-left-color: #28a745;
        }

        .memo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .memo-title {
            font-weight: 600;
            color: #333;
        }

        .memo-priority {
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 500;
        }

        .memo-priority.high {
            background: #dc3545;
            color: white;
        }

        .memo-priority.medium {
            background: #ffc107;
            color: #333;
        }

        .memo-priority.low {
            background: #28a745;
            color: white;
        }

        .memo-content {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .memo-actions {
            display: flex;
            gap: 5px;
        }

        .quick-add {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .quick-add:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 1.5em;
            font-weight: 600;
            color: #333;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }

        .close-btn:hover {
            color: #333;
        }

        .view-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .view-btn {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .view-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .search-box {
            position: relative;
            margin-bottom: 15px;
        }

        .search-box input {
            padding-left: 40px;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .stat-number {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr;
            }
            
            .sidebar {
                height: auto;
                max-height: 300px;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }
            
            .calendar-header {
                flex-direction: column;
                gap: 15px;
            }
            
            .calendar-table td {
                height: 80px;
            }
            
            .quick-add {
                width: 50px;
                height: 50px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📅 在线日程表/备忘录</h1>
            <p>高效管理您的时间和任务，支持日程安排、备忘录记录和提醒功能</p>
        </div>
        
        <div class="main-content">
            <!-- 左侧边栏 -->
            <div class="sidebar">
                <div class="section-title">📊 统计概览</div>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-number" id="totalEvents">0</div>
                        <div class="stat-label">总事件</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="todayEvents">0</div>
                        <div class="stat-label">今日事件</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="totalMemos">0</div>
                        <div class="stat-label">备忘录</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="completedMemos">0</div>
                        <div class="stat-label">已完成</div>
                    </div>
                </div>
                
                <div class="section-title">🔍 搜索过滤</div>
                <div class="control-group">
                    <div class="search-box">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="searchInput" placeholder="搜索事件或备忘录...">
                    </div>
                </div>
                
                <div class="control-group">
                    <label>优先级过滤</label>
                    <select id="priorityFilter">
                        <option value="all">全部优先级</option>
                        <option value="high">高优先级</option>
                        <option value="medium">中优先级</option>
                        <option value="low">低优先级</option>
                    </select>
                </div>
                
                <div class="section-title">⚙️ 快速操作</div>
                <div class="control-group">
                    <button class="btn btn-primary" onclick="showEventModal()">➕ 添加事件</button>
                    <button class="btn btn-success" onclick="showMemoModal()">📝 添加备忘录</button>
                </div>
                
                <div class="control-group">
                    <button class="btn btn-secondary" onclick="exportData()">📤 导出数据</button>
                    <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importData(event)">
                    <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">📥 导入数据</button>
                </div>
                
                <div class="control-group">
                    <button class="btn btn-danger" onclick="clearAllData()">🗑️ 清空数据</button>
                </div>
            </div>
            
            <!-- 中间日历区域 -->
            <div class="calendar-area">
                <div class="calendar-header">
                    <div class="calendar-nav">
                        <button class="nav-btn" onclick="previousMonth()">‹</button>
                        <div class="calendar-title" id="calendarTitle">2024年1月</div>
                        <button class="nav-btn" onclick="nextMonth()">›</button>
                    </div>
                    <div class="view-toggle">
                        <button class="view-btn active" onclick="switchView('month')">月视图</button>
                        <button class="view-btn" onclick="switchView('week')">周视图</button>
                        <button class="view-btn" onclick="switchView('day')">日视图</button>
                    </div>
                </div>
                <div class="calendar-grid">
                    <table class="calendar-table" id="calendarTable">
                        <!-- 日历内容将通过JavaScript生成 -->
                    </table>
                </div>
            </div>
            
            <!-- 右侧边栏 -->
            <div class="sidebar">
                <div class="section-title">📋 今日备忘录</div>
                <div class="memo-list" id="memoList">
                    <div style="text-align: center; color: #999; padding: 20px;">
                        暂无备忘录
                    </div>
                </div>
                
                <div class="section-title">📅 近期事件</div>
                <div class="memo-list" id="upcomingEvents">
                    <div style="text-align: center; color: #999; padding: 20px;">
                        暂无近期事件
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 快速添加按钮 -->
    <button class="quick-add" onclick="showEventModal()" title="快速添加事件">+</button>
    
    <!-- 事件模态框 -->
    <div class="modal" id="eventModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="eventModalTitle">添加事件</h3>
                <button class="close-btn" onclick="closeModal('eventModal')">&times;</button>
            </div>
            <div class="control-group">
                <label>事件标题</label>
                <input type="text" id="eventTitle" placeholder="输入事件标题">
            </div>
            <div class="control-group">
                <label>事件描述</label>
                <textarea id="eventDescription" rows="3" placeholder="输入事件描述（可选）"></textarea>
            </div>
            <div class="control-group">
                <label>开始时间</label>
                <input type="datetime-local" id="eventStartTime">
            </div>
            <div class="control-group">
                <label>结束时间</label>
                <input type="datetime-local" id="eventEndTime">
            </div>
            <div class="control-group">
                <label>优先级</label>
                <select id="eventPriority">
                    <option value="low">低优先级</option>
                    <option value="medium" selected>中优先级</option>
                    <option value="high">高优先级</option>
                </select>
            </div>
            <div class="control-group">
                <label>
                    <input type="checkbox" id="eventReminder"> 设置提醒
                </label>
            </div>
            <div class="control-group">
                <button class="btn btn-primary" onclick="saveEvent()">保存事件</button>
                <button class="btn btn-secondary" onclick="closeModal('eventModal')">取消</button>
            </div>
        </div>
    </div>
    
    <!-- 备忘录模态框 -->
    <div class="modal" id="memoModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="memoModalTitle">添加备忘录</h3>
                <button class="close-btn" onclick="closeModal('memoModal')">&times;</button>
            </div>
            <div class="control-group">
                <label>备忘录标题</label>
                <input type="text" id="memoTitle" placeholder="输入备忘录标题">
            </div>
            <div class="control-group">
                <label>备忘录内容</label>
                <textarea id="memoContent" rows="4" placeholder="输入备忘录内容"></textarea>
            </div>
            <div class="control-group">
                <label>优先级</label>
                <select id="memoPriority">
                    <option value="low">低优先级</option>
                    <option value="medium" selected>中优先级</option>
                    <option value="high">高优先级</option>
                </select>
            </div>
            <div class="control-group">
                <label>截止日期</label>
                <input type="date" id="memoDueDate">
            </div>
            <div class="control-group">
                <button class="btn btn-success" onclick="saveMemo()">保存备忘录</button>
                <button class="btn btn-secondary" onclick="closeModal('memoModal')">取消</button>
            </div>
        </div>
    </div>

    <script>
        class ScheduleManager {
            constructor() {
                this.currentDate = new Date();
                this.selectedDate = new Date();
                this.currentView = 'month';
                this.events = JSON.parse(localStorage.getItem('schedule_events') || '[]');
                this.memos = JSON.parse(localStorage.getItem('schedule_memos') || '[]');
                this.editingEvent = null;
                this.editingMemo = null;
                
                this.init();
            }
            
            init() {
                this.renderCalendar();
                this.renderMemos();
                this.renderUpcomingEvents();
                this.updateStats();
                this.bindEvents();
                
                // 设置默认日期时间
                const now = new Date();
                const startTime = new Date(now.getTime() + 60 * 60 * 1000); // 1小时后
                const endTime = new Date(startTime.getTime() + 60 * 60 * 1000); // 2小时后
                
                document.getElementById('eventStartTime').value = this.formatDateTimeLocal(startTime);
                document.getElementById('eventEndTime').value = this.formatDateTimeLocal(endTime);
            }
            
            bindEvents() {
                // 搜索功能
                document.getElementById('searchInput').addEventListener('input', () => {
                    this.filterAndRender();
                });
                
                // 优先级过滤
                document.getElementById('priorityFilter').addEventListener('change', () => {
                    this.filterAndRender();
                });
                
                // 键盘快捷键
                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey || e.metaKey) {
                        switch (e.key) {
                            case 'n':
                                e.preventDefault();
                                this.showEventModal();
                                break;
                            case 'm':
                                e.preventDefault();
                                this.showMemoModal();
                                break;
                        }
                    }
                });
            }
            
            formatDateTimeLocal(date) {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                const hours = String(date.getHours()).padStart(2, '0');
                const minutes = String(date.getMinutes()).padStart(2, '0');
                return `${year}-${month}-${day}T${hours}:${minutes}`;
            }
            
            renderCalendar() {
                const table = document.getElementById('calendarTable');
                const title = document.getElementById('calendarTitle');
                
                // 更新标题
                const year = this.currentDate.getFullYear();
                const month = this.currentDate.getMonth();
                const monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', 
                                   '7月', '8月', '9月', '10月', '11月', '12月'];
                title.textContent = `${year}年${monthNames[month]}`;
                
                // 生成日历表格
                let html = '<thead><tr>';
                const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
                dayNames.forEach(day => {
                    html += `<th>${day}</th>`;
                });
                html += '</tr></thead><tbody>';
                
                // 获取当月第一天和最后一天
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const startDate = new Date(firstDay);
                startDate.setDate(startDate.getDate() - firstDay.getDay());
                
                // 生成6周的日期
                for (let week = 0; week < 6; week++) {
                    html += '<tr>';
                    for (let day = 0; day < 7; day++) {
                        const currentDate = new Date(startDate);
                        currentDate.setDate(startDate.getDate() + week * 7 + day);
                        
                        const isCurrentMonth = currentDate.getMonth() === month;
                        const isToday = this.isToday(currentDate);
                        const isSelected = this.isSameDate(currentDate, this.selectedDate);
                        
                        let cellClass = '';
                        if (!isCurrentMonth) cellClass += ' other-month';
                        if (isToday) cellClass += ' today';
                        if (isSelected) cellClass += ' selected';
                        
                        const dayEvents = this.getEventsForDate(currentDate);
                        let eventsHtml = '';
                        dayEvents.slice(0, 3).forEach(event => {
                            eventsHtml += `<div class="event-item ${event.priority}" onclick="editEvent('${event.id}')" title="${event.title}">${event.title}</div>`;
                        });
                        
                        if (dayEvents.length > 3) {
                            eventsHtml += `<div class="event-item" style="background: #999;">+${dayEvents.length - 3}</div>`;
                        }
                        
                        html += `
                            <td class="${cellClass}" onclick="selectDate('${currentDate.toISOString()}')">
                                <div class="date-number">${currentDate.getDate()}</div>
                                ${eventsHtml}
                            </td>
                        `;
                    }
                    html += '</tr>';
                }
                
                html += '</tbody>';
                table.innerHTML = html;
            }
            
            renderMemos() {
                const container = document.getElementById('memoList');
                const searchTerm = document.getElementById('searchInput').value.toLowerCase();
                const priorityFilter = document.getElementById('priorityFilter').value;
                
                let filteredMemos = this.memos.filter(memo => {
                    const matchesSearch = memo.title.toLowerCase().includes(searchTerm) || 
                                        memo.content.toLowerCase().includes(searchTerm);
                    const matchesPriority = priorityFilter === 'all' || memo.priority === priorityFilter;
                    return matchesSearch && matchesPriority;
                });
                
                if (filteredMemos.length === 0) {
                    container.innerHTML = '<div style="text-align: center; color: #999; padding: 20px;">暂无备忘录</div>';
                    return;
                }
                
                const html = filteredMemos.map(memo => `
                    <div class="memo-item ${memo.completed ? 'completed' : ''}">
                        <div class="memo-header">
                            <div class="memo-title">${memo.title}</div>
                            <div class="memo-priority ${memo.priority}">${this.getPriorityText(memo.priority)}</div>
                        </div>
                        <div class="memo-content">${memo.content}</div>
                        ${memo.dueDate ? `<div class="memo-content">截止：${new Date(memo.dueDate).toLocaleDateString()}</div>` : ''}
                        <div class="memo-actions">
                            <button class="btn btn-secondary btn-small" onclick="toggleMemoComplete('${memo.id}')">
                                ${memo.completed ? '取消完成' : '标记完成'}
                            </button>
                            <button class="btn btn-secondary btn-small" onclick="editMemo('${memo.id}')">编辑</button>
                            <button class="btn btn-danger btn-small" onclick="deleteMemo('${memo.id}')">删除</button>
                        </div>
                    </div>
                `).join('');
                
                container.innerHTML = html;
            }
            
            renderUpcomingEvents() {
                const container = document.getElementById('upcomingEvents');
                const now = new Date();
                const nextWeek = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);
                
                const upcomingEvents = this.events
                    .filter(event => {
                        const eventDate = new Date(event.startTime);
                        return eventDate >= now && eventDate <= nextWeek;
                    })
                    .sort((a, b) => new Date(a.startTime) - new Date(b.startTime))
                    .slice(0, 5);
                
                if (upcomingEvents.length === 0) {
                    container.innerHTML = '<div style="text-align: center; color: #999; padding: 20px;">暂无近期事件</div>';
                    return;
                }
                
                const html = upcomingEvents.map(event => {
                    const startDate = new Date(event.startTime);
                    const timeStr = startDate.toLocaleString();
                    
                    return `
                        <div class="memo-item">
                            <div class="memo-header">
                                <div class="memo-title">${event.title}</div>
                                <div class="memo-priority ${event.priority}">${this.getPriorityText(event.priority)}</div>
                            </div>
                            <div class="memo-content">${timeStr}</div>
                            ${event.description ? `<div class="memo-content">${event.description}</div>` : ''}
                            <div class="memo-actions">
                                <button class="btn btn-secondary btn-small" onclick="editEvent('${event.id}')">编辑</button>
                                <button class="btn btn-danger btn-small" onclick="deleteEvent('${event.id}')">删除</button>
                            </div>
                        </div>
                    `;
                }).join('');
                
                container.innerHTML = html;
            }
            
            updateStats() {
                const today = new Date();
                const todayEvents = this.events.filter(event => 
                    this.isSameDate(new Date(event.startTime), today)
                ).length;
                
                const completedMemos = this.memos.filter(memo => memo.completed).length;
                
                document.getElementById('totalEvents').textContent = this.events.length;
                document.getElementById('todayEvents').textContent = todayEvents;
                document.getElementById('totalMemos').textContent = this.memos.length;
                document.getElementById('completedMemos').textContent = completedMemos;
            }
            
            getEventsForDate(date) {
                return this.events.filter(event => {
                    const eventDate = new Date(event.startTime);
                    return this.isSameDate(eventDate, date);
                });
            }
            
            isToday(date) {
                const today = new Date();
                return this.isSameDate(date, today);
            }
            
            isSameDate(date1, date2) {
                return date1.getFullYear() === date2.getFullYear() &&
                       date1.getMonth() === date2.getMonth() &&
                       date1.getDate() === date2.getDate();
            }
            
            getPriorityText(priority) {
                const texts = {
                    high: '高',
                    medium: '中',
                    low: '低'
                };
                return texts[priority] || '中';
            }
            
            selectDate(dateStr) {
                this.selectedDate = new Date(dateStr);
                this.renderCalendar();
            }
            
            previousMonth() {
                this.currentDate.setMonth(this.currentDate.getMonth() - 1);
                this.renderCalendar();
            }
            
            nextMonth() {
                this.currentDate.setMonth(this.currentDate.getMonth() + 1);
                this.renderCalendar();
            }
            
            switchView(view) {
                this.currentView = view;
                document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
                event.target.classList.add('active');
                // 这里可以实现不同视图的渲染逻辑
                this.renderCalendar();
            }
            
            showEventModal(eventId = null) {
                const modal = document.getElementById('eventModal');
                const title = document.getElementById('eventModalTitle');
                
                if (eventId) {
                    const event = this.events.find(e => e.id === eventId);
                    if (event) {
                        title.textContent = '编辑事件';
                        document.getElementById('eventTitle').value = event.title;
                        document.getElementById('eventDescription').value = event.description || '';
                        document.getElementById('eventStartTime').value = this.formatDateTimeLocal(new Date(event.startTime));
                        document.getElementById('eventEndTime').value = this.formatDateTimeLocal(new Date(event.endTime));
                        document.getElementById('eventPriority').value = event.priority;
                        document.getElementById('eventReminder').checked = event.reminder || false;
                        this.editingEvent = event;
                    }
                } else {
                    title.textContent = '添加事件';
                    document.getElementById('eventTitle').value = '';
                    document.getElementById('eventDescription').value = '';
                    document.getElementById('eventPriority').value = 'medium';
                    document.getElementById('eventReminder').checked = false;
                    this.editingEvent = null;
                    
                    // 设置选中日期的时间
                    const selectedDateTime = new Date(this.selectedDate);
                    selectedDateTime.setHours(new Date().getHours() + 1, 0, 0, 0);
                    const endDateTime = new Date(selectedDateTime.getTime() + 60 * 60 * 1000);
                    
                    document.getElementById('eventStartTime').value = this.formatDateTimeLocal(selectedDateTime);
                    document.getElementById('eventEndTime').value = this.formatDateTimeLocal(endDateTime);
                }
                
                modal.style.display = 'flex';
            }
            
            showMemoModal(memoId = null) {
                const modal = document.getElementById('memoModal');
                const title = document.getElementById('memoModalTitle');
                
                if (memoId) {
                    const memo = this.memos.find(m => m.id === memoId);
                    if (memo) {
                        title.textContent = '编辑备忘录';
                        document.getElementById('memoTitle').value = memo.title;
                        document.getElementById('memoContent').value = memo.content;
                        document.getElementById('memoPriority').value = memo.priority;
                        document.getElementById('memoDueDate').value = memo.dueDate || '';
                        this.editingMemo = memo;
                    }
                } else {
                    title.textContent = '添加备忘录';
                    document.getElementById('memoTitle').value = '';
                    document.getElementById('memoContent').value = '';
                    document.getElementById('memoPriority').value = 'medium';
                    document.getElementById('memoDueDate').value = '';
                    this.editingMemo = null;
                }
                
                modal.style.display = 'flex';
            }
            
            closeModal(modalId) {
                document.getElementById(modalId).style.display = 'none';
                this.editingEvent = null;
                this.editingMemo = null;
            }
            
            saveEvent() {
                const title = document.getElementById('eventTitle').value.trim();
                const description = document.getElementById('eventDescription').value.trim();
                const startTime = document.getElementById('eventStartTime').value;
                const endTime = document.getElementById('eventEndTime').value;
                const priority = document.getElementById('eventPriority').value;
                const reminder = document.getElementById('eventReminder').checked;
                
                if (!title || !startTime || !endTime) {
                    alert('请填写完整的事件信息');
                    return;
                }
                
                if (new Date(startTime) >= new Date(endTime)) {
                    alert('结束时间必须晚于开始时间');
                    return;
                }
                
                const eventData = {
                    id: this.editingEvent ? this.editingEvent.id : Date.now().toString(),
                    title,
                    description,
                    startTime,
                    endTime,
                    priority,
                    reminder,
                    createdAt: this.editingEvent ? this.editingEvent.createdAt : new Date().toISOString()
                };
                
                if (this.editingEvent) {
                    const index = this.events.findIndex(e => e.id === this.editingEvent.id);
                    this.events[index] = eventData;
                } else {
                    this.events.push(eventData);
                }
                
                this.saveToStorage();
                this.renderCalendar();
                this.renderUpcomingEvents();
                this.updateStats();
                this.closeModal('eventModal');
                
                // 设置提醒
                if (reminder) {
                    this.setReminder(eventData);
                }
            }
            
            saveMemo() {
                const title = document.getElementById('memoTitle').value.trim();
                const content = document.getElementById('memoContent').value.trim();
                const priority = document.getElementById('memoPriority').value;
                const dueDate = document.getElementById('memoDueDate').value;
                
                if (!title || !content) {
                    alert('请填写完整的备忘录信息');
                    return;
                }
                
                const memoData = {
                    id: this.editingMemo ? this.editingMemo.id : Date.now().toString(),
                    title,
                    content,
                    priority,
                    dueDate,
                    completed: this.editingMemo ? this.editingMemo.completed : false,
                    createdAt: this.editingMemo ? this.editingMemo.createdAt : new Date().toISOString()
                };
                
                if (this.editingMemo) {
                    const index = this.memos.findIndex(m => m.id === this.editingMemo.id);
                    this.memos[index] = memoData;
                } else {
                    this.memos.push(memoData);
                }
                
                this.saveToStorage();
                this.renderMemos();
                this.updateStats();
                this.closeModal('memoModal');
            }
            
            editEvent(eventId) {
                this.showEventModal(eventId);
            }
            
            editMemo(memoId) {
                this.showMemoModal(memoId);
            }
            
            deleteEvent(eventId) {
                if (confirm('确定要删除这个事件吗？')) {
                    this.events = this.events.filter(e => e.id !== eventId);
                    this.saveToStorage();
                    this.renderCalendar();
                    this.renderUpcomingEvents();
                    this.updateStats();
                }
            }
            
            deleteMemo(memoId) {
                if (confirm('确定要删除这个备忘录吗？')) {
                    this.memos = this.memos.filter(m => m.id !== memoId);
                    this.saveToStorage();
                    this.renderMemos();
                    this.updateStats();
                }
            }
            
            toggleMemoComplete(memoId) {
                const memo = this.memos.find(m => m.id === memoId);
                if (memo) {
                    memo.completed = !memo.completed;
                    this.saveToStorage();
                    this.renderMemos();
                    this.updateStats();
                }
            }
            
            setReminder(event) {
                const eventTime = new Date(event.startTime);
                const now = new Date();
                const timeDiff = eventTime.getTime() - now.getTime();
                
                if (timeDiff > 0 && timeDiff <= 24 * 60 * 60 * 1000) { // 24小时内
                    const reminderTime = Math.max(0, timeDiff - 15 * 60 * 1000); // 提前15分钟
                    
                    setTimeout(() => {
                        if (Notification.permission === 'granted') {
                            new Notification(`事件提醒: ${event.title}`, {
                                body: `事件将在15分钟后开始`,
                                icon: '📅'
                            });
                        } else {
                            alert(`事件提醒: ${event.title}\n事件将在15分钟后开始`);
                        }
                    }, reminderTime);
                }
            }
            
            filterAndRender() {
                this.renderMemos();
                this.renderUpcomingEvents();
            }
            
            exportData() {
                const data = {
                    events: this.events,
                    memos: this.memos,
                    exportDate: new Date().toISOString()
                };
                
                const dataStr = JSON.stringify(data, null, 2);
                const blob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = `schedule-backup-${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                
                URL.revokeObjectURL(url);
            }
            
            importData(event) {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const data = JSON.parse(e.target.result);
                            
                            if (data.events && data.memos) {
                                if (confirm('导入数据将覆盖现有数据，确定继续吗？')) {
                                    this.events = data.events;
                                    this.memos = data.memos;
                                    this.saveToStorage();
                                    this.renderCalendar();
                                    this.renderMemos();
                                    this.renderUpcomingEvents();
                                    this.updateStats();
                                    alert('数据导入成功！');
                                }
                            } else {
                                alert('文件格式错误，请选择有效的备份文件');
                            }
                        } catch (error) {
                            alert('文件解析失败，请检查文件格式');
                        }
                    };
                    reader.readAsText(file);
                }
            }
            
            clearAllData() {
                if (confirm('确定要清空所有数据吗？此操作不可撤销！')) {
                    this.events = [];
                    this.memos = [];
                    this.saveToStorage();
                    this.renderCalendar();
                    this.renderMemos();
                    this.renderUpcomingEvents();
                    this.updateStats();
                    alert('所有数据已清空');
                }
            }
            
            saveToStorage() {
                localStorage.setItem('schedule_events', JSON.stringify(this.events));
                localStorage.setItem('schedule_memos', JSON.stringify(this.memos));
            }
        }
        
        // 全局变量和函数
        let scheduleManager;
        
        function selectDate(dateStr) {
            scheduleManager.selectDate(dateStr);
        }
        
        function previousMonth() {
            scheduleManager.previousMonth();
        }
        
        function nextMonth() {
            scheduleManager.nextMonth();
        }
        
        function switchView(view) {
            scheduleManager.switchView(view);
        }
        
        function showEventModal(eventId) {
            scheduleManager.showEventModal(eventId);
        }
        
        function showMemoModal(memoId) {
            scheduleManager.showMemoModal(memoId);
        }
        
        function closeModal(modalId) {
            scheduleManager.closeModal(modalId);
        }
        
        function saveEvent() {
            scheduleManager.saveEvent();
        }
        
        function saveMemo() {
            scheduleManager.saveMemo();
        }
        
        function editEvent(eventId) {
            scheduleManager.editEvent(eventId);
        }
        
        function editMemo(memoId) {
            scheduleManager.editMemo(memoId);
        }
        
        function deleteEvent(eventId) {
            scheduleManager.deleteEvent(eventId);
        }
        
        function deleteMemo(memoId) {
            scheduleManager.deleteMemo(memoId);
        }
        
        function toggleMemoComplete(memoId) {
            scheduleManager.toggleMemoComplete(memoId);
        }
        
        function exportData() {
            scheduleManager.exportData();
        }
        
        function importData(event) {
            scheduleManager.importData(event);
        }
        
        function clearAllData() {
            scheduleManager.clearAllData();
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            scheduleManager = new ScheduleManager();
            
            // 请求通知权限
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
            
            // 点击模态框外部关闭
            document.querySelectorAll('.modal').forEach(modal => {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) {
                        modal.style.display = 'none';
                    }
                });
            });
        });
    </script>
</body>
</html>
