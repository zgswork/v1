<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>自定义视频播放器</title>
<style>
:root{--bg:#f6f7fb;--surface:#fff;--text:#111;--muted:#666;--accent:#2563eb;--border:#e5e7eb}
[data-theme=dark]{--bg:#0f1115;--surface:#171923;--text:#e5e7eb;--muted:#9aa0a6;--accent:#7c3aed;--border:#2a2f3a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,Segoe UI,Roboto,Arial}
.container{max-width:900px;margin:0 auto;padding:16px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.title{font-weight:600}
.theme-toggle{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 12px;border-radius:10px;cursor:pointer}
.player{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);overflow:hidden}
.video-wrap{background:#000;position:relative}
video{width:100%;height:auto;display:block;max-height:65vh}
.controls{display:grid;gap:8px;padding:10px;border-top:1px solid var(--border);transition:opacity .2s ease,transform .2s ease}
.controls-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,input[type=range]{-webkit-tap-highlight-color:transparent}
button{padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.6;cursor:not-allowed}
.time{min-width:84px;text-align:center;color:var(--muted)}
.range{flex:1 1 240px}
input[type=range]{width:100%}
select, input[type=file], input[type=url]{padding:8px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text)}
@media (max-width:640px){
  .controls{padding:8px}
  button{padding:10px}
  .range{flex:1 1 160px}
  video{max-height:52vh}
}
.help{color:var(--muted);font-size:12px;margin-top:6px}
.badge{font-size:12px;color:var(--muted)}
.playlist{max-height:140px;overflow:auto;border:1px solid var(--border);border-radius:10px;padding:6px;background:var(--surface)}
.playlist-item{padding:6px 8px;border-radius:8px;cursor:pointer;color:var(--text)}
.playlist-item:hover{background:rgba(0,0,0,.06)}
[data-theme=dark] .playlist-item:hover{background:rgba(255,255,255,.06)}
.playlist-item.active{background:var(--border)}
.playlist-item{display:flex;align-items:center;justify-content:space-between}
.ops{display:flex;gap:6px}
.op-btn{padding:2px 6px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12px;cursor:pointer}
.op-btn:hover{color:var(--text)}
.zones{position:absolute;inset:0;display:flex}
.zone{flex:1 1 50%;}
.feedback{position:absolute;top:50%;transform:translateY(-50%);padding:6px 10px;background:rgba(0,0,0,.6);color:#fff;border-radius:8px;opacity:0;pointer-events:none}
#fbLeft{left:12px}
#fbRight{right:12px}
.feedback.show{opacity:1;transition:opacity .2s ease}
.video-wrap.dragover::after{content:'释放以加载视频';position:absolute;inset:0;background:rgba(37,99,235,.2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:100}
.overlay.show{display:flex}
.overlay-content{background:var(--surface);color:var(--text);padding:16px;border-radius:12px;max-width:720px;width:min(90vw,720px);box-shadow:0 6px 24px rgba(0,0,0,.2)}
.controls.hidden{opacity:0;transform:translateY(6px);pointer-events:none}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title">自定义视频播放器<span class="badge"> · 单文件版</span></div>
    <button id="themeBtn" class="theme-toggle" aria-label="切换主题">浅/深主题</button>
  </div>
  <div class="player" id="player">
    <div class="video-wrap" id="videoWrap">
      <video id="video" preload="metadata" playsinline></video>
      <div class="zones" id="zones">
        <div class="zone zone-left" id="zoneLeft" aria-label="后退10秒"></div>
        <div class="zone zone-right" id="zoneRight" aria-label="快进10秒"></div>
        <div class="feedback" id="fbLeft">后退 10 秒</div>
        <div class="feedback" id="fbRight">快进 10 秒</div>
      </div>
    </div>
    <div class="controls">
      <div class="controls-row">
        <label for="file" style="display:flex;align-items:center;gap:8px">选择视频<input id="file" type="file" accept="video/*" multiple></label>
        <button id="play" class="primary">播放</button>
        <button id="mute">静音</button>
        <span class="time" id="time">00:00 / 00:00</span>
      </div>
      <div class="controls-row">
        <input id="progress" class="range" type="range" min="0" max="100" step="0.1" value="0">
      </div>
      <div class="controls-row">
        <label style="flex:1">URL<input id="url" type="url" placeholder="输入视频URL，如 https://..."></label>
        <button id="loadUrl">加载URL</button>
      </div>
      <div class="controls-row">
        <label>音量<input id="volume" type="range" min="0" max="1" step="0.01" value="1"></label>
        <label>速度<select id="speed">
          <option value="0.5">0.5x</option><option value="0.75">0.75x</option>
          <option value="1" selected>1x</option><option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option><option value="2">2x</option>
        </select></label>
        <button id="loop">循环:关</button>
        <button id="pip">画中画</button>
        <button id="fs">全屏</button>
      </div>
      <div class="controls-row">
        <button id="prev">上一条</button>
        <button id="next">下一条</button>
        <button id="setA">设置A点</button>
        <button id="setB">设置B点</button>
        <button id="abToggle">AB循环:关</button>
        <button id="abReset">重置AB</button>
        <button id="clearList">清空列表</button>
      </div>
      <div class="controls-row">
        <div id="playlist" class="playlist" aria-label="播放列表"></div>
      </div>
      <div class="controls-row">
        <label for="subtitleFile" style="display:flex;align-items:center;gap:8px">字幕<input id="subtitleFile" type="file" accept=".vtt"></label>
        <button id="subToggle">字幕:关</button>
      </div>
      <div class="help">提示：支持多文件播放列表、URL加载、拖拽到视频区域加载、字幕文件（VTT）、双击左/右快退/快进、截图保存、全屏与画中画。</div>
    </div>
  </div>
</div>
<script>
(() => {
  const el = id => document.getElementById(id);
  const video = el('video'), file = el('file'), play = el('play'), mute = el('mute');
  const progress = el('progress'), time = el('time'), volume = el('volume'), speed = el('speed');
  const loopBtn = el('loop'), fs = el('fs'), pip = el('pip'), themeBtn = el('themeBtn'), player = el('player'), wrap = el('videoWrap');

  const urlInput = el('url'), loadUrlBtn = el('loadUrl');
  const playlistEl = el('playlist');
  const subFile = el('subtitleFile'), subToggle = el('subToggle');
  const prevBtn = el('prev'), nextBtn = el('next');
  const setA = el('setA'), setB = el('setB'), abToggle = el('abToggle'), abReset = el('abReset');
  const clearList = el('clearList');
  const zoneLeft = el('zoneLeft'), zoneRight = el('zoneRight'), fbLeft = el('fbLeft'), fbRight = el('fbRight');

  // theme
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme) document.documentElement.dataset.theme = savedTheme;
  themeBtn.onclick = () => {
    const cur = document.documentElement.dataset.theme === 'dark' ? '' : 'dark';
    if (cur) document.documentElement.dataset.theme = cur; else delete document.documentElement.dataset.theme;
    localStorage.setItem('theme', cur || '');
  };

  // state
  let playlist = [];
  let currentIndex = -1;
  let hideTimer;
  let subTrack = null;
  let pointA = null, pointB = null, abEnabled = false;
  let progressMap = {};
  try { progressMap = JSON.parse(localStorage.getItem('vid_progress') || '{}'); } catch(e) {}
  let lastSaveTs = 0;

  function renderPlaylist() {
    playlistEl.innerHTML = '';
    playlist.forEach((item, idx) => {
      const div = document.createElement('div');
      div.className = 'playlist-item' + (idx === currentIndex ? ' active' : '');
      const title = document.createElement('span');
      title.textContent = item.name;
      title.style.flex = '1';
      div.appendChild(title);
      const ops = document.createElement('span');
      ops.className = 'ops';
      const up = document.createElement('button'); up.className = 'op-btn'; up.textContent = '↑'; up.title = '上移';
      const down = document.createElement('button'); down.className = 'op-btn'; down.textContent = '↓'; down.title = '下移';
      const del = document.createElement('button'); del.className = 'op-btn'; del.textContent = '✕'; del.title = '删除';
      up.onclick = (e) => { e.stopPropagation(); if (idx > 0) { const tmp = playlist[idx-1]; playlist[idx-1] = playlist[idx]; playlist[idx] = tmp; if (currentIndex === idx) currentIndex = idx-1; else if (currentIndex === idx-1) currentIndex = idx; renderPlaylist(); persistRemotePlaylist(); } };
      down.onclick = (e) => { e.stopPropagation(); if (idx < playlist.length-1) { const tmp = playlist[idx+1]; playlist[idx+1] = playlist[idx]; playlist[idx] = tmp; if (currentIndex === idx) currentIndex = idx+1; else if (currentIndex === idx+1) currentIndex = idx; renderPlaylist(); persistRemotePlaylist(); } };
      del.onclick = (e) => { e.stopPropagation(); const wasCurrent = idx === currentIndex; playlist.splice(idx,1); if (wasCurrent) { if (playlist.length) { currentIndex = Math.min(idx, playlist.length-1); playIndex(currentIndex); } else { currentIndex = -1; video.removeAttribute('src'); video.load(); time.textContent = '00:00 / 00:00'; } } else if (currentIndex > idx) { currentIndex--; } renderPlaylist(); persistRemotePlaylist(); };
      ops.appendChild(up); ops.appendChild(down); ops.appendChild(del);
      div.appendChild(ops);
      div.onclick = () => playIndex(idx);
      playlistEl.appendChild(div);
    });
  }

  function playIndex(idx) {
    currentIndex = idx;
    const item = playlist[idx];
    if (!item) return;
    video.src = item.url;
    const resume = progressMap[item.url];
    const applyResume = () => {
      if (resume && isFinite(video.duration)) {
        try { video.currentTime = Math.min(resume, Math.max(0, video.duration - 0.5)); } catch(e) {}
      }
    };
    if (video.readyState >= 1) applyResume(); else video.addEventListener('loadedmetadata', applyResume, { once: true });
    video.play().catch(()=>{});
    renderPlaylist();
  }

  function addToPlaylist(name, url) {
    const remote = /^https?:\/\//i.test(url);
    playlist.push({ name, url, remote });
    renderPlaylist();
    persistRemotePlaylist();
    if (currentIndex === -1) playIndex(0);
  }

  function processFiles(files) {
    const arr = Array.from(files || []);
    if (!arr.length) return;
    arr.forEach(f => addToPlaylist(f.name, URL.createObjectURL(f)));
  }

  // load local files (multiple)
  file.addEventListener('change', () => { processFiles(file.files); });

  // drag & drop
  wrap.addEventListener('dragover', (e) => { e.preventDefault(); wrap.classList.add('dragover'); });
  wrap.addEventListener('dragleave', () => { wrap.classList.remove('dragover'); });
  wrap.addEventListener('drop', (e) => { e.preventDefault(); wrap.classList.remove('dragover'); processFiles(e.dataTransfer.files); });

  // load URL
  loadUrlBtn.onclick = () => {
    const u = (urlInput.value || '').trim();
    if (!u) return;
    const name = u.split('/').pop() || '网络视频';
    video.crossOrigin = 'anonymous';
    addToPlaylist(name, u);
    urlInput.blur();
  };

  // playlist persistence (remote only)
  function persistRemotePlaylist(){
    const remote = playlist.filter(p => p.remote).map(p => ({name:p.name,url:p.url}));
    localStorage.setItem('vid_remote_playlist', JSON.stringify(remote));
  }
  function restoreRemotePlaylist(){
    try {
      const list = JSON.parse(localStorage.getItem('vid_remote_playlist') || '[]');
      list.forEach(it => addToPlaylist(it.name, it.url));
    } catch(e) {}
  }
  restoreRemotePlaylist();

  // nav buttons
  prevBtn.onclick = () => { if (currentIndex > 0) playIndex(currentIndex - 1); };
  nextBtn.onclick = () => { if (currentIndex >= 0 && currentIndex < playlist.length - 1) playIndex(currentIndex + 1); };
  video.addEventListener('ended', () => { if (!video.loop) nextBtn.click(); });

  // AB loop controls
  setA.onclick = () => { if (isFinite(video.currentTime)) { pointA = video.currentTime; }};
  setB.onclick = () => { if (isFinite(video.currentTime)) { pointB = video.currentTime; }};
  abToggle.onclick = () => { abEnabled = !abEnabled; abToggle.textContent = 'AB循环:' + (abEnabled ? '开' : '关'); };
  abReset.onclick = () => { pointA = null; pointB = null; abEnabled = false; abToggle.textContent = 'AB循环:关'; };

  // clear playlist
  clearList.onclick = () => {
    playlist = [];
    currentIndex = -1;
    persistRemotePlaylist();
    renderPlaylist();
    video.removeAttribute('src');
    video.load();
    time.textContent = '00:00 / 00:00';
  };

  // play/pause toggles
  const updatePlayBtn = () => { play.textContent = video.paused ? '播放' : '暂停'; };
  play.onclick = () => video.paused ? video.play() : video.pause();
  video.addEventListener('play', updatePlayBtn);
  video.addEventListener('pause', updatePlayBtn);
  wrap.addEventListener('click', (e) => {
    if (e.target === zoneLeft || e.target === zoneRight) return;
    if (!video.src) return;
    video.paused ? video.play() : video.pause();
  });

  // auto-hide controls
  const controls = document.querySelector('.controls');
  const showControls = () => {
    controls.classList.remove('hidden');
    clearTimeout(hideTimer);
    if (!video.paused) hideTimer = setTimeout(()=>controls.classList.add('hidden'), 2500);
  };
  ['mousemove','touchstart'].forEach(evt => player.addEventListener(evt, showControls));
  video.addEventListener('play', showControls);
  video.addEventListener('pause', () => { controls.classList.remove('hidden'); clearTimeout(hideTimer); });
  showControls();

  // mute & volume (remember)
  const savedVol = localStorage.getItem('vid_volume');
  if (savedVol !== null) { video.volume = +savedVol; volume.value = savedVol; }
  mute.onclick = () => { video.muted = !video.muted; mute.textContent = video.muted ? '取消静音' : '静音'; };
  volume.oninput = () => {
    video.volume = +volume.value;
    localStorage.setItem('vid_volume', volume.value);
    video.muted = (video.volume === 0);
    mute.textContent = video.muted ? '取消静音' : '静音';
  };

  // speed (remember)
  const savedSpeed = localStorage.getItem('vid_speed');
  if (savedSpeed !== null) { speed.value = savedSpeed; video.playbackRate = +savedSpeed; }
  speed.onchange = () => {
    video.playbackRate = +speed.value;
    localStorage.setItem('vid_speed', speed.value);
  };

  // loop
  loopBtn.onclick = () => { video.loop = !video.loop; loopBtn.textContent = '循环:' + (video.loop ? '开' : '关'); };

  // progress
  const fmt = s => {
    if (!isFinite(s)) return '00:00';
    s = Math.floor(s);
    const m = Math.floor(s/60).toString().padStart(2,'0');
    const sec = (s%60).toString().padStart(2,'0');
    return m+':'+sec;
  };
  const setTimeText = () => time.textContent = `${fmt(video.currentTime)} / ${fmt(video.duration)}`;
  video.addEventListener('loadedmetadata', () => { setTimeText(); progress.value = 0; progress.max = 100; });
  video.addEventListener('timeupdate', () => {
    if (video.duration) progress.value = (video.currentTime / video.duration) * 100;
    // AB loop logic
    if (abEnabled && pointA != null && pointB != null && pointB > pointA && video.currentTime >= pointB) {
      video.currentTime = pointA;
    }
    // progress save (throttled)
    const now = Date.now();
    if (currentIndex >= 0 && playlist[currentIndex]) {
      const url = playlist[currentIndex].url;
      if (now - lastSaveTs > 1000) {
        progressMap[url] = video.currentTime;
        try { localStorage.setItem('vid_progress', JSON.stringify(progressMap)); } catch(e) {}
        lastSaveTs = now;
      }
    }
    setTimeText();
  });
  progress.oninput = () => { if (video.duration) video.currentTime = (+progress.value / 100) * video.duration; };

  // fullscreen
  fs.onclick = async () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else await player.requestFullscreen();
    } catch(e) {
      if (video.webkitEnterFullscreen) video.webkitEnterFullscreen(); // iOS fallback
    }
  };

  // Picture-in-Picture
  pip.onclick = async () => {
    try {
      if ('pictureInPictureEnabled' in document) {
        if (document.pictureInPictureElement) document.exitPictureInPicture();
        else await video.requestPictureInPicture();
      }
    } catch(e) { console.warn(e); }
  };

  // subtitles
  subFile.addEventListener('change', () => {
    const f = subFile.files[0]; if (!f) return;
    const u = URL.createObjectURL(f);
    if (subTrack) subTrack.remove();
    subTrack = document.createElement('track');
    subTrack.kind = 'subtitles'; subTrack.label = '字幕'; subTrack.srclang = 'zh'; subTrack.src = u; subTrack.default = true;
    video.appendChild(subTrack);
    Array.from(video.textTracks).forEach(t => t.mode = 'showing');
    subToggle.textContent = '字幕:开';
  });
  subToggle.onclick = () => {
    const anyShowing = Array.from(video.textTracks).some(t => t.mode === 'showing');
    const next = !anyShowing;
    Array.from(video.textTracks).forEach(t => t.mode = next ? 'showing' : 'hidden');
    subToggle.textContent = '字幕:' + (next ? '开' : '关');
  };



  // double-tap/double-click seek
  function attachDouble(zone, onDouble) {
    let last = 0;
    zone.addEventListener('click', (e) => {
      e.stopPropagation();
      const now = Date.now();
      if (now - last < 300) { onDouble(); last = 0; }
      else last = now;
    });
    zone.addEventListener('dblclick', (e) => { e.stopPropagation(); onDouble(); });
  }
  const flash = (el) => { el.classList.add('show'); setTimeout(()=>el.classList.remove('show'), 400); };
  attachDouble(zoneLeft, () => { if (!isNaN(video.currentTime)) { video.currentTime = Math.max(video.currentTime - 10, 0); flash(fbLeft); }});
  attachDouble(zoneRight, () => { if (!isNaN(video.currentTime)) { video.currentTime = Math.min(video.currentTime + 10, video.duration||video.currentTime); flash(fbRight); }});

  // keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (!video.src) return;
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    const key = e.key.toLowerCase();
    switch (key) {
      case ' ': e.preventDefault(); video.paused ? video.play() : video.pause(); break;
      case 'k': video.paused ? video.play() : video.pause(); break;
      case 'm': mute.click(); break;
      case 'f': fs.click(); break;
      case 'p': pip.click(); break;
      case 'l': loopBtn.click(); break;
      case 'n': prevBtn.click(); break;
      case 'b': nextBtn.click(); break;
      case 'arrowleft': video.currentTime = Math.max(video.currentTime - 5, 0); break;
      case 'arrowright': video.currentTime = Math.min(video.currentTime + 5, video.duration||video.currentTime); break;
      case ',': video.currentTime = Math.max(video.currentTime - 0.04, 0); break; // frame-ish back
      case '.': video.currentTime = Math.min(video.currentTime + 0.04, video.duration||video.currentTime); break; // frame-ish forward
      case '[': {
        const v = Math.max(0.5, (+speed.value - 0.25));
        speed.value = String(Math.round(v*100)/100);
        speed.dispatchEvent(new Event('change'));
      } break;
      case ']': {
        const v = Math.min(2, (+speed.value + 0.25));
        speed.value = String(Math.round(v*100)/100);
        speed.dispatchEvent(new Event('change'));
      } break;
      default: {
        if (e.code === 'Space') { e.preventDefault(); video.paused ? video.play() : video.pause(); }
      }
    }
  });



  // init defaults
  updatePlayBtn();
  if (savedVol === null) video.volume = 1;
})();
</script>

</body>
</html>
