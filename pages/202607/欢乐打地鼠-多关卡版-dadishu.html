<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢乐打地鼠 - 多关卡版</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* 基础样式 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #f0f0f0;
            color: #333;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .screen.active {
            display: flex;
        }

        h1, h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #e74c3c;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 10px;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .btn:hover {
            background-color: #27ae60;
            transform: scale(1.05);
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 14px;
        }

        /* 关卡选择界面 */
        .levels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            width: 100%;
            margin: 20px 0;
        }

        .level-card {
            background-color: #3498db;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .level-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .level-card.locked {
            background-color: #95a5a6;
            cursor: not-allowed;
        }

        .level-card .level-name {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .level-card .level-difficulty {
            font-size: 12px;
            margin-bottom: 5px;
        }

        .level-card .high-score {
            font-size: 12px;
        }

        /* 游戏界面 */
        .game-header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 20px;
            background-color: #34495e;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            flex-wrap: wrap;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
            margin-bottom: 20px;
        }

        .hole {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            background-color: #8b4513;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
        }

        .hole:after {
            content: '';
            position: absolute;
            width: 100%;
            height: 50%;
            bottom: 0;
            background-color: #5d2906;
            border-radius: 0 0 50% 50%;
        }

        .mole {
            position: absolute;
            width: 80%;
            height: 80%;
            bottom: -30%;
            left: 10%;
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48Y2lyY2xlIGN4PSI1MCIgY3k9IjUwIiByPSI0MCIgZmlsbD0iI2IzODA0ZCIvPjxjaXJjbGUgY3g9IjM1IiBjeT0iNDAiIHI9IjUiIGZpbGw9IiMwMDAiLz48Y2lyY2xlIGN4PSI2NSIgY3k9IjQwIiByPSI1IiBmaWxsPSIjMDAwIi8+PHBhdGggZD0iTTQwIDY1IHEyMCAxMCAyMCAwIiBzdHJva2U9IiMwMDAiIHN0cm9rZS13aWR0aD0iMiIgZmlsbD0ibm9uZSIvPjwvc3ZnPg==');

            z-index: 1;
        }

        .mole.up {
            bottom: 20%;
        }

        .mole.golden {
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48Y2lyY2xlIGN4PSI1MCIgY3k9IjUwIiByPSI0MCIgZmlsbD0iI2ZmYzEwNyIvPjxjaXJjbGUgY3g9IjM1IiBjeT0iNDAiIHI9IjUiIGZpbGw9IiMwMDAiLz48Y2lyY2xlIGN4PSI2NSIgY3k9IjQwIiByPSI1IiBmaWxsPSIjMDAwIi8+PHBhdGggZD0iTTQwIDY1IHEyMCAxMCAyMCAwIiBzdHJva2U9IiMwMDAiIHN0cm9rZS13aWR0aD0iMiIgZmlsbD0ibm9uZSIvPjxjaXJjbGUgY3g9IjUwIiBjeT0iMzUiIHI9IjEwIiBmaWxsPSIjZmZlMDgyIi8+PC9zdmc+');

        }

        .mole.teleport {
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48Y2lyY2xlIGN4PSI1MCIgY3k9IjUwIiByPSI0MCIgZmlsbD0iIzAwYjNlYiIvPjxjaXJjbGUgY3g9IjM1IiBjeT0iNDAiIHI9IjUiIGZpbGw9IiMwMDAiLz48Y2lyY2xlIGN4PSI2NSIgY3k9IjQwIiByPSI1IiBmaWxsPSIjMDAwIi8+PHBhdGggZD0iTTQwIDY1IHEyMCAxMCAyMCAwIiBzdHJva2U9IiMwMDAiIHN0cm9rZS13aWR0aD0iMiIgZmlsbD0ibm9uZSIvPjxwYXRoIGQ9Ik0yMCAyMCBsMTUgMTUiIHN0cm9rZT0iI2ZmZiIgc3Ryb2tlLXdpZHRoPSIzIi8+PHBhdGggZD0iTTgwIDIwIGwtMTUgMTUiIHN0cm9rZT0iI2ZmZiIgc3Ryb2tlLXdpZHRoPSIzIi8+PC9zdmc+');
        }

        /* 游戏结束界面 */
        .result {
            background-color: #ecf0f1;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* 响应式设计 */
        @media (max-width: 600px) {
            .game-header {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
            
            .levels-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .btn {
                padding: 10px 15px;
                font-size: 14px;
            }
        }

        /* 动画效果 */
        @keyframes molePop {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }

        .hit-effect {
            animation: molePop 0.3s;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- 开始界面 -->
        <div id="start-screen" class="screen active">
            <h1>欢乐打地鼠</h1>
            <button id="start-btn" class="btn">开始游戏</button>
        </div>
        
        <!-- 关卡选择界面 -->
        <div id="level-select-screen" class="screen">
            <h2>选择关卡</h2>
            <div class="levels-grid">
                <!-- 关卡将通过JS动态生成 -->
            </div>
            <button id="back-to-menu" class="btn">返回菜单</button>
        </div>
        
        <!-- 游戏界面 -->
        <div id="game-screen" class="screen">
            <div class="game-header">
                <div class="score">分数: <span id="score">0</span></div>
                <div class="time">时间: <span id="time">60</span>s</div>
                <div class="level">关卡: <span id="level-name">新手草原</span></div>
                <button id="back-to-levels-btn" class="btn btn-small">返回关卡选择</button>
            </div>
            
            <div class="game-board">
                <!-- 游戏板将通过JS动态生成 -->
            </div>
            
            <div class="game-controls">
                <button id="pause-btn" class="btn">暂停</button>
            </div>
        </div>
        
        <!-- 游戏结束界面 -->
        <div id="game-over-screen" class="screen">
            <h2 id="game-over-title">游戏结束!</h2>
            <div class="result">
                <p>最终分数: <span id="final-score">0</span></p>
                <p id="level-result"></p>
            </div>
            <div class="actions">
                <button id="replay-btn" class="btn">再玩一次</button>
                <button id="next-level-btn" class="btn">下一关</button>
                <button id="back-to-levels" class="btn">选择关卡</button>
            </div>
        </div>
        
    </div>

    <script>
        // 游戏配置
        const CONFIG = {
            levels: [
                {
                    id: 1,
                    name: "新手草原",
                    difficulty: "★☆☆☆☆",
                    gridSize: 3,
                    moleSpeed: 1200,
                    moleDuration: 1000,
                    targetScore: 200,
                    timeLimit: 60,
                    specialMoles: [],
                    background: "#8bc34a",
                    unlocked: true
                },
                {

                },
                {

                    moleDuration: 700,

                    specialMoles: ["bomb"],
                    bombRatio: 0.15,
                    background: "#607d8b",
                    unlocked: false
                },
                {
                    id: 4,
                    name: "疯狂实验室",
                    difficulty: "★★★★☆",
                    gridSize: 3,
                    moleSpeed: 500,
                    moleDuration: 500,
                    targetScore: 500,
                    timeLimit: 60,
                    specialMoles: ["golden", "crazy"],
                    goldenRatio: 0.15,
                    crazyRatio: 0.1,
                    background: "#9c27b0",
                    unlocked: false
                },
                {
                    id: 5,
                    name: "地狱厨房",
                    difficulty: "★★★★★",
                    gridSize: 5,
                    moleSpeed: 300,
                    moleDuration: 400,
                    targetScore: 600,
                    timeLimit: 60,
                    specialMoles: ["golden", "bomb", "teleport"],
                    goldenRatio: 0.2,
                    bombRatio: 0.15,
                    teleportRatio: 0.1,
                    background: "#f44336",
                    unlocked: false
                },
                {
                    id: 6,
                    name: "地鼠天堂",
                    difficulty: "无尽模式",
                    gridSize: 5,
                    moleSpeed: 1000,
                    moleDuration: 800,
                    targetScore: 0,
                    timeLimit: 0,
                    specialMoles: ["golden", "bomb", "crazy", "teleport"],
                    goldenRatio: 0.15,
                    bombRatio: 0.1,
                    crazyRatio: 0.1,
                    teleportRatio: 0.1,
                    background: "#00bcd4",
                    unlocked: true,
                    endless: true
                }
            ],
            molePoints: {
                normal: 10,
                golden: 20,
                bomb: -15,
                crazy: 15,
                teleport: 10
            }
        };

        // 游戏状态
        let gameState = {
            currentLevel: null,
            score: 0,
            timeLeft: 0,
            timer: null,
            moleInterval: null,
            isPlaying: false,
            missedMoles: 0,
            progress: JSON.parse(localStorage.getItem("whackAMoleProgress")) || {
                unlockedLevels: [1, 6], // 默认解锁第一关和无尽模式
                highScores: {}
            }
        };

        // DOM元素
        const elements = {
            startScreen: document.getElementById("start-screen"),
            levelSelectScreen: document.getElementById("level-select-screen"),
            gameScreen: document.getElementById("game-screen"),
            gameOverScreen: document.getElementById("game-over-screen"),
            startBtn: document.getElementById("start-btn"),
            backToMenu: document.getElementById("back-to-menu"),
            backToLevelsBtn: document.getElementById("back-to-levels-btn"),
            pauseBtn: document.getElementById("pause-btn"),
            replayBtn: document.getElementById("replay-btn"),
            nextLevelBtn: document.getElementById("next-level-btn"),
            backToLevels: document.getElementById("back-to-levels"),
            scoreDisplay: document.getElementById("score"),
            timeDisplay: document.getElementById("time"),
            levelNameDisplay: document.getElementById("level-name"),
            finalScoreDisplay: document.getElementById("final-score"),
            levelResult: document.getElementById("level-result"),
            gameOverTitle: document.getElementById("game-over-title"),
            levelsGrid: document.querySelector(".levels-grid"),
            gameBoard: document.querySelector(".game-board"),
            popSound: document.getElementById("pop-sound"),
            goldSound: document.getElementById("gold-sound"),
            bombSound: document.getElementById("bomb-sound"),
            bgMusic: document.getElementById("bg-music")
        };

        // 初始化游戏
        function initGame() {
            setupEventListeners();
            renderLevelSelect();
            elements.bgMusic.volume = 0.3;
        }

        // 设置事件监听器
        function setupEventListeners() {
            elements.startBtn.addEventListener("click", showLevelSelect);
            elements.backToMenu.addEventListener("click", showStartScreen);
            elements.backToLevelsBtn.addEventListener("click", showLevelSelect);
            elements.pauseBtn.addEventListener("click", togglePause);
            elements.replayBtn.addEventListener("click", replayGame);
            elements.nextLevelBtn.addEventListener("click", startNextLevel);
            elements.backToLevels.addEventListener("click", showLevelSelect);
        }

        // 显示开始界面
        function showStartScreen() {
            elements.startScreen.classList.add("active");
            elements.levelSelectScreen.classList.remove("active");
            elements.gameScreen.classList.remove("active");
            elements.gameOverScreen.classList.remove("active");
            stopBgMusic();
        }

        // 显示关卡选择界面
        function showLevelSelect() {
            elements.startScreen.classList.remove("active");
            elements.levelSelectScreen.classList.add("active");
            elements.gameScreen.classList.remove("active");
            elements.gameOverScreen.classList.remove("active");
            renderLevelSelect();
            playBgMusic();
        }

        // 渲染关卡选择界面
        function renderLevelSelect() {
            elements.levelsGrid.innerHTML = "";
            
            CONFIG.levels.forEach(level => {
                const isUnlocked = gameState.progress.unlockedLevels.includes(level.id);
                const highScore = gameState.progress.highScores[level.id] || 0;
                
                const levelCard = document.createElement("div");
                levelCard.className = `level-card ${isUnlocked ? "" : "locked"}`;
                levelCard.innerHTML = `
                    <div class="level-name">${level.name}</div>
                    <div class="level-difficulty">难度: ${level.difficulty}</div>
                    <div class="high-score">最高分: ${highScore}</div>
                `;
                
                if (isUnlocked) {
                    levelCard.addEventListener("click", () => startGame(level.id));
                }
                
                elements.levelsGrid.appendChild(levelCard);
            });
        }

        // 开始游戏
        function startGame(levelId) {
            const level = CONFIG.levels.find(l => l.id === levelId);
            if (!level) return;
            
            gameState.currentLevel = level;
            gameState.score = 0;
            gameState.timeLeft = level.timeLimit;
            gameState.isPlaying = true;
            gameState.missedMoles = 0;
            
            // 更新UI
            elements.scoreDisplay.textContent = gameState.score;
            elements.timeDisplay.textContent = level.endless ? "∞" : gameState.timeLeft;
            elements.levelNameDisplay.textContent = level.name;
            
            // 设置游戏板
            setupGameBoard(level.gridSize);
            
            // 开始游戏循环
            startGameLoop();
            
            // 切换屏幕
            elements.levelSelectScreen.classList.remove("active");
            elements.gameScreen.classList.add("active");
            elements.gameOverScreen.classList.remove("active");
            
            // 背景音乐
            playBgMusic();
        }

        // 设置游戏板
        function setupGameBoard(gridSize) {
            elements.gameBoard.innerHTML = "";
            elements.gameBoard.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            
            for (let i = 0; i < gridSize * gridSize; i++) {
                const hole = document.createElement("div");
                hole.className = "hole";
                hole.dataset.index = i;
                hole.addEventListener("click", handleHoleClick);
                elements.gameBoard.appendChild(hole);
            }
        }

        // 开始游戏循环
        function startGameLoop() {
            // 清除之前的计时器
            if (gameState.timer) clearInterval(gameState.timer);
            if (gameState.moleInterval) clearInterval(gameState.moleInterval);
            
            // 如果不是无尽模式，设置倒计时
            if (!gameState.currentLevel.endless) {
                gameState.timer = setInterval(() => {
                    gameState.timeLeft--;
                    elements.timeDisplay.textContent = gameState.timeLeft;
                    
                    if (gameState.timeLeft <= 0) {
                        endGame(false);
                    }
                }, 1000);
            }
            
            // 地鼠出现
            gameState.moleInterval = setInterval(() => {
                popUpMole();
                
                // 无尽模式难度递增
                if (gameState.currentLevel.endless) {
                    const speedDecrease = Math.floor(gameState.score / 500) * 50;
                    const newSpeed = Math.max(300, gameState.currentLevel.moleSpeed - speedDecrease);
                    
                    // 每500分增加难度
                    if (newSpeed !== gameState.currentLevel.moleSpeed) {
                        gameState.currentLevel.moleSpeed = newSpeed;
                        clearInterval(gameState.moleInterval);
                        gameState.moleInterval = setInterval(() => {
                            popUpMole();
                        }, newSpeed);
                    }
                }
            }, gameState.currentLevel.moleSpeed);
        }

        // 地鼠弹出
        function popUpMole() {
            if (!gameState.isPlaying) return;
            
            const holes = document.querySelectorAll(".hole");
            const randomIndex = Math.floor(Math.random() * holes.length);
            const hole = holes[randomIndex];
            
            // 创建地鼠
            const mole = document.createElement("div");
            mole.className = "mole";
            
            // 确定地鼠类型
            const moleType = determineMoleType();
            if (moleType !== "normal") {
                mole.classList.add(moleType);
            }
            
            hole.appendChild(mole);
            
            // 显示地鼠
            setTimeout(() => {
                mole.classList.add("up");
            }, 10);
            
            // 地鼠停留时间后消失
            setTimeout(() => {
                if (mole.parentNode && mole.classList.contains("up")) {
                    // 地鼠未被点击，自动消失
                    mole.classList.remove("up");
                    setTimeout(() => {
                        if (mole.parentNode) {
                            hole.removeChild(mole);
                            
                            // 无尽模式记录错过地鼠
                            if (gameState.currentLevel.endless) {
                                gameState.missedMoles++;
                                if (gameState.missedMoles >= 10) {
                                    endGame(true);
                                }
                            }
                        }
                    }, 300);
                }
            }, gameState.currentLevel.moleDuration);
        }

        // 确定地鼠类型
        function determineMoleType() {
            const level = gameState.currentLevel;
            const rand = Math.random();
            
            if (level.specialMoles.includes("golden") && rand < (level.goldenRatio || 0.1)) {
                return "golden";
            }
            
            if (level.specialMoles.includes("bomb") && rand < (level.bombRatio || 0.1)) {
                return "bomb";
            }
            
            if (level.specialMoles.includes("crazy") && rand < (level.crazyRatio || 0.1)) {
                return "crazy";
            }
            
            if (level.specialMoles.includes("teleport") && rand < (level.teleportRatio || 0.1)) {
                return "teleport";
            }
            
            return "normal";
        }

        // 处理点击地鼠
        function handleHoleClick(e) {
            if (!gameState.isPlaying) return;
            
            const hole = e.currentTarget;
            const mole = hole.querySelector(".mole.up");
            
            if (mole) {
                // 根据类型处理点击
                const moleType = getMoleType(mole);
                handleMoleHit(mole, moleType);
            }
        }

        // 获取地鼠类型
        function getMoleType(mole) {
            if (mole.classList.contains("golden")) return "golden";
            if (mole.classList.contains("bomb")) return "bomb";
            if (mole.classList.contains("crazy")) return "crazy";
            if (mole.classList.contains("teleport")) return "teleport";
            return "normal";
        }

        // 处理击中地鼠
        function handleMoleHit(mole, type) {
            // 播放音效
            playHitSound(type);
            
            // 添加点击效果
            mole.classList.add("hit-effect");
            
            // 更新分数
            const points = CONFIG.molePoints[type] || 0;
            gameState.score += points;
            elements.scoreDisplay.textContent = gameState.score;
            
            // 特殊地鼠效果
            if (type === "crazy") {
                // 疯狂地鼠 - 连续出现3只
                for (let i = 0; i < 3; i++) {
                    setTimeout(() => popUpMole(), i * 300);
                }
            } else if (type === "teleport") {
                // 瞬移地鼠 - 快速改变位置
                mole.classList.remove("up");
                setTimeout(() => {
                    if (mole.parentNode) {
                        mole.parentNode.removeChild(mole);
                        setTimeout(() => popUpMole(), 200);
                    }
                }, 300);
            }
            
            // 移除地鼠
            setTimeout(() => {
                if (mole.parentNode) {
                    mole.parentNode.removeChild(mole);
                }
            }, 300);
        }

        // 播放击中音效
        function playHitSound(type) {
            try {
                if (type === "golden") {
                    elements.goldSound.currentTime = 0;
                    elements.goldSound.play();
                } else if (type === "bomb") {
                    elements.bombSound.currentTime = 0;
                    elements.bombSound.play();
                } else {
                    elements.popSound.currentTime = 0;
                    elements.popSound.play();
                }
            } catch (e) {
                console.log("音效播放失败:", e);
            }
        }

        // 播放背景音乐
        function playBgMusic() {
            try {
                elements.bgMusic.currentTime = 0;
                elements.bgMusic.play().catch(e => console.log("自动播放被阻止:", e));
            } catch (e) {
                console.log("背景音乐播放失败:", e);
            }
        }

        // 停止背景音乐
        function stopBgMusic() {
            try {
                elements.bgMusic.pause();
            } catch (e) {
                console.log("背景音乐停止失败:", e);
            }
        }

        // 暂停/继续游戏
        function togglePause() {
            gameState.isPlaying = !gameState.isPlaying;
            
            if (gameState.isPlaying) {
                elements.pauseBtn.textContent = "暂停";
                startGameLoop();
                playBgMusic();
            } else {
                elements.pauseBtn.textContent = "继续";
                clearInterval(gameState.timer);
                clearInterval(gameState.moleInterval);
                stopBgMusic();
            }
        }

        // 结束游戏
        function endGame(isEndlessGameOver) {
            gameState.isPlaying = false;
            clearInterval(gameState.timer);
            clearInterval(gameState.moleInterval);
            
            // 更新游戏结束标题
            elements.gameOverTitle.textContent = isEndlessGameOver ? "游戏结束!" : "关卡完成!";
            
            // 更新进度
            updateProgress();
            
            // 显示游戏结束界面
            showGameOverScreen();
        }

        // 更新游戏进度
        function updateProgress() {
            const levelId = gameState.currentLevel.id;
            
            // 更新最高分
            if (!gameState.progress.highScores[levelId] || 
                gameState.score > gameState.progress.highScores[levelId]) {
                gameState.progress.highScores[levelId] = gameState.score;
            }
            
            // 如果不是无尽模式且达到目标分数，解锁下一关
            if (!gameState.currentLevel.endless && 
                gameState.score >= gameState.currentLevel.targetScore) {
                const nextLevelId = levelId + 1;
                if (nextLevelId <= CONFIG.levels.length && 
                    !gameState.progress.unlockedLevels.includes(nextLevelId)) {
                    gameState.progress.unlockedLevels.push(nextLevelId);
                }
            }
            
            // 保存进度
            localStorage.setItem("whackAMoleProgress", JSON.stringify(gameState.progress));
        }

        // 显示游戏结束界面
        function showGameOverScreen() {
            elements.gameScreen.classList.remove("active");
            elements.gameOverScreen.classList.add("active");
            
            elements.finalScoreDisplay.textContent = gameState.score;
            
            // 检查是否通过当前关卡
            if (gameState.currentLevel.endless) {
                elements.levelResult.textContent = `你错过了 ${gameState.missedMoles} 只地鼠`;
            } else {
                const passed = gameState.score >= gameState.currentLevel.targetScore;
                elements.levelResult.textContent = passed ? 
                    `恭喜! 你通过了${gameState.currentLevel.name}关卡!` : 
                    `未达到目标分数 ${gameState.currentLevel.targetScore}`;
            }
            
            // 检查是否有下一关
            const nextLevelId = gameState.currentLevel.id + 1;
            const hasNextLevel = !gameState.currentLevel.endless && 
                                nextLevelId <= CONFIG.levels.length && 
                                gameState.progress.unlockedLevels.includes(nextLevelId);
            
            elements.nextLevelBtn.style.display = hasNextLevel ? "block" : "none";
        }

        // 重新开始当前关卡
        function replayGame() {
            startGame(gameState.currentLevel.id);
        }

        // 开始下一关
        function startNextLevel() {
            const nextLevelId = gameState.currentLevel.id + 1;
            startGame(nextLevelId);
        }

        // 初始化游戏
        window.addEventListener("DOMContentLoaded", initGame);
    </script>
</body>
</html>
