            <!-- 添加新项目 -->

                    <div>

            <!-- 四象限项目分布 -->

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- 操作按钮 -->

    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs">

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 项目优先级排序工具主类
        const ProjectPrioritySorter = {
            // 初始化
            init() {
                // 初始化数据
                this.loadProjects();
                
                // 设置默认截止日期为今天
                const today = new Date();
                const tomorrow = new Date(today);
                tomorrow.setDate(today.getDate() + 1);
                document.getElementById('deadline').value = tomorrow.toISOString().split('T')[0];
                
                // 初始化事件监听
                this.initEventListeners();
                
                // 初始化图表
                this.initChart();
                
                // 渲染页面
                this.renderAll();
            },
            
            // 从本地存储加载项目
            loadProjects() {
                const savedProjects = localStorage.getItem('priorityProjects');
                this.projects = savedProjects ? JSON.parse(savedProjects) : [];
            },
            
            // 保存项目到本地存储
            saveProjects() {
                localStorage.setItem('priorityProjects', JSON.stringify(this.projects));
            },
            
            // 初始化事件监听
            initEventListeners() {
                // 重要度滑块事件
                const importanceSlider = document.getElementById('importance');
                const importanceValue = document.getElementById('importanceValue');
                const importanceIndicator = document.getElementById('importanceIndicator');
                
                // 更新滑块显示
                const updateImportanceDisplay = () => {
                    const value = importanceSlider.value;
                    let label = '';
                    
                    if (value <= 3) label = '（低）';
                    else if (value <= 7) label = '（中等）';
                    else label = '（高）';
                    
                    importanceValue.textContent = `${value}${label}`;
                    // 更新指示器宽度
                    importanceIndicator.style.width = `${(value / 10) * 100}%`;
                };
                
                // 初始化显示
                updateImportanceDisplay();
                
                // 滑块变动时更新
                importanceSlider.addEventListener('input', updateImportanceDisplay);
                
                // 项目表单提交
                document.getElementById('projectForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.saveProject();
                });
                
                // 取消编辑
                document.getElementById('cancelEditBtn').addEventListener('click', () => {
                    this.resetForm();
                });
                
                // 清空所有项目
                document.getElementById('clearAllBtn').addEventListener('click', () => {
                    if (this.projects.length === 0) {
                        this.showToast('没有项目可清空', 'info');
                        return;
                    }
                    
                    if (confirm('确定要清空所有项目吗？此操作不可恢复。')) {
                        this.projects = [];
                        this.saveProjects();
                        this.renderAll();
                        this.showToast('所有项目已清空', 'info');
                    }
                });
                
                // 导出项目列表
                document.getElementById('exportBtn').addEventListener('click', () => {
                    if (this.projects.length === 0) {
                        this.showToast('没有项目可导出', 'info');
                        return;
                    }
                    
                    this.exportProjects();
                });
            },
            
            // 初始化四象限图表
            initChart() {
                const ctx = document.getElementById('quadrantChart').getContext('2d');
                
                // 创建图表
                this.quadrantChart = new Chart(ctx, {
                    type: 'scatter',
                    data: {
                        datasets: [
                            {
                                label: '1. 紧急重要',
                                data: [],
                                backgroundColor: '#ef4444',
                                pointRadius: 8,
                                pointHoverRadius: 10
                            },
                            {
                                label: '2. 重要不紧急',
                                data: [],
                                backgroundColor: '#f59e0b',
                                pointRadius: 8,
                                pointHoverRadius: 10
                            },
                            {
                                label: '3. 紧急不重要',
                                data: [],
                                backgroundColor: '#60a5fa',
                                pointRadius: 8,
                                pointHoverRadius: 10
                            },
                            {
                                label: '4. 不紧急不重要',
                                data: [],
                                backgroundColor: '#10b981',
                                pointRadius: 8,
                                pointHoverRadius: 10
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: {
                                type: 'linear',
                                position: 'center',
                                min: 0,
                                max: 10,
                                grid: {
                                    display: true,
                                    color: 'rgba(0, 0, 0, 0.05)'
                                },
                                ticks: {
                                    stepSize: 2,
                                    callback: function(value) {
                                        if (value == 0) return '不紧急';
                                        if (value == 10) return '紧急';
                                        return '';
                                    }
                                },
                                title: {
                                    display: true,
                                    text: '紧急度',
                                    font: {
                                        weight: 'bold'
                                    }
                                }
                            },
                            y: {
                                type: 'linear',
                                position: 'center',
                                min: 0,
                                max: 10,
                                grid: {
                                    display: true,
                                    color: 'rgba(0, 0, 0, 0.05)'
                                },
                                ticks: {
                                    stepSize: 2,
                                    callback: function(value) {
                                        if (value == 0) return '不重要';
                                        if (value == 10) return '重要';
                                        return '';
                                    }
                                },
                                title: {
                                    display: true,
                                    text: '重要度',
                                    font: {
                                        weight: 'bold'
                                    }
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: false
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        const project = context.raw.project;
                                        return [
                                            project.name,
                                            `截止日期: ${project.deadline}`,
                                            `重要度: ${project.importance}`,
                                            `优先级评分: ${project.priorityScore.toFixed(1)}`
                                        ];
                                    }
                                }
                            }
                        },
                        onClick: (e, elements) => {
                            if (elements.length > 0) {
                                const datasetIndex = elements[0].datasetIndex;
                                const index = elements[0].index;
                                const project = this.quadrantChart.data.datasets[datasetIndex].data[index].project;
                                this.editProject(project.id);
                            }
                        }
                    }
                });
            },
            
            // 计算项目的紧急度
            calculateUrgency(deadline) {
                const today = new Date();
                const deadlineDate = new Date(deadline);
                
                // 计算天数差（截止日期 - 今天）
                const timeDiff = deadlineDate - today;
                const dayDiff = Math.ceil(timeDiff / (1000 * 60 * 60 * 24));
                
                // 根据天数差计算紧急度（0-10）
                if (dayDiff <= 0) return 10; // 已过期或今天截止，最紧急
                if (dayDiff <= 1) return 9;
                if (dayDiff <= 3) return 7;
                if (dayDiff <= 7) return 5;
                if (dayDiff <= 14) return 3;
                if (dayDiff <= 30) return 2;
                return 1; // 超过30天，最不紧急
            },
            
            // 计算项目的优先级评分
            calculatePriorityScore(urgency, importance) {
                // 紧急度和重要度各占50%权重
                return (urgency * 0.5) + (importance * 0.5);
            },
            
            // 确定项目所属象限
            determineQuadrant(urgency, importance) {
                // 紧急度和重要度的阈值（5分）
                const threshold = 5;
                
                if (urgency >= threshold && importance >= threshold) {
                    return 1; // 紧急重要
                } else if (urgency < threshold && importance >= threshold) {
                    return 2; // 重要不紧急
                } else if (urgency >= threshold && importance < threshold) {
                    return 3; // 紧急不重要
                } else {
                    return 4; // 不紧急不重要
                }
            },
            
            // 处理项目数据（计算各项指标）
            processProjects() {
                return this.projects.map(project => {
                    const urgency = this.calculateUrgency(project.deadline);
                    const importance = parseInt(project.importance);
                    const priorityScore = this.calculatePriorityScore(urgency, importance);
                    const quadrant = this.determineQuadrant(urgency, importance);
                    
                    return {
                        ...project,
                        urgency,
                        priorityScore,
                        quadrant
                    };
                });
            },
            
            // 保存项目
            saveProject() {
                const projectId = document.getElementById('projectId').value;
                const name = document.getElementById('projectName').value.trim();
                const deadline = document.getElementById('deadline').value;
                const importance = document.getElementById('importance').value;
                const description = document.getElementById('projectDescription').value.trim();
                
                // 验证必填字段
                if (!name || !deadline) {
                    this.showToast('请填写项目名称和截止日期', 'error');
                    return;
                }
                
                // 创建项目对象
                const project = {
                    name,
                    deadline,
                    importance,
                    description,
                    updatedAt: new Date().toISOString()
                };
                
                // 检查是新增还是编辑
                if (projectId) {
                    // 更新现有项目
                    const index = this.projects.findIndex(p => p.id === projectId);
                    if (index !== -1) {
                        project.id = projectId;
                        project.createdAt = this.projects[index].createdAt; // 保留创建时间
                        this.projects[index] = project;
                    }
                } else {
                    // 添加新项目
                    project.id = Date.now().toString();
                    project.createdAt = new Date().toISOString();
                    this.projects.push(project);
                }
                
                // 保存数据
                this.saveProjects();
                
                // 更新UI
                this.renderAll();
                
                // 重置表单
                this.resetForm();
                
                // 显示提示
                this.showToast(projectId ? '项目已更新' : '项目已添加');
            },
            
            // 编辑项目
            editProject(id) {
                const project = this.projects.find(p => p.id === id);
                if (!project) return;
                
                // 填充表单
                document.getElementById('projectId').value = project.id;
                document.getElementById('projectName').value = project.name;
                document.getElementById('deadline').value = project.deadline;
                document.getElementById('importance').value = project.importance;
                document.getElementById('projectDescription').value = project.description || '';
                
                // 更新重要度显示
                const importanceValue = document.getElementById('importanceValue');
                const importanceIndicator = document.getElementById('importanceIndicator');
                const value = project.importance;
                let label = '';
                
                if (value <= 3) label = '（低）';
                else if (value <= 7) label = '（中等）';
                else label = '（高）';
                
                importanceValue.textContent = `${value}${label}`;
                importanceIndicator.style.width = `${(value / 10) * 100}%`;
                
                // 显示取消按钮
                document.getElementById('cancelEditBtn').classList.remove('hidden');
                
                // 滚动到表单
                document.getElementById('projectForm').scrollIntoView({ behavior: 'smooth' });
            },
            
            // 删除项目
            deleteProject(id) {
                const project = this.projects.find(p => p.id === id);
                if (!project) return;
                
                if (confirm(`确定要删除项目"${project.name}"吗？`)) {
                    this.projects = this.projects.filter(p => p.id !== id);
                    this.saveProjects();
                    this.renderAll();
                    this.showToast('项目已删除');
                }
            },
            
            // 重置表单
            resetForm() {
                document.getElementById('projectForm').reset();
                document.getElementById('projectId').value = '';
                
                // 设置默认截止日期为明天
                const tomorrow = new Date();
                tomorrow.setDate(tomorrow.getDate() + 1);
                document.getElementById('deadline').value = tomorrow.toISOString().split('T')[0];
                
                // 重置重要度显示
                const importanceSlider = document.getElementById('importance');
                importanceSlider.value = 5;
                document.getElementById('importanceValue').textContent = '5（中等）';
                document.getElementById('importanceIndicator').style.width = '50%';
                
                // 隐藏取消按钮
                document.getElementById('cancelEditBtn').classList.add('hidden');
            },
            
            // 导出项目列表
            exportProjects() {
                const processedProjects = this.processProjects();
                
                // 按优先级排序
                const sortedProjects = [...processedProjects].sort((a, b) => 
                    b.priorityScore - a.priorityScore
                );
                
                // 构建CSV内容
                let csvContent = "项目名称,截止日期,重要度,紧急度,优先级评分,象限,描述\n";
                
                sortedProjects.forEach(project => {
                    const quadrantNames = {
                        1: "紧急重要",
                        2: "重要不紧急",
                        3: "紧急不重要",
                        4: "不紧急不重要"
                    };
                    
                    // 处理CSV中的特殊字符
                    const name = `"${project.name.replace(/"/g, '""')}"`;
                    const description = project.description ? `"${project.description.replace(/"/g, '""')}"` : "";
                    
                    csvContent += `${name},${project.deadline},${project.importance},${project.urgency.toFixed(1)},${project.priorityScore.toFixed(1)},${quadrantNames[project.quadrant]},${description}\n`;
                });
                
                // 创建并下载CSV文件
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                
                // 文件名包含当前日期
                const today = new Date();
                const dateStr = today.toISOString().split('T')[0];
                link.setAttribute('download', `项目优先级列表_${dateStr}.csv`);
                
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                this.showToast('项目列表已导出为CSV文件');
            },
            
            // 渲染所有UI元素
            renderAll() {
                const processedProjects = this.processProjects();
                this.renderPriorityList(processedProjects);
                this.renderQuadrants(processedProjects);
                this.updateChart(processedProjects);
            },
            
            // 渲染优先级排序列表
            renderPriorityList(projects) {
                const priorityListEl = document.getElementById('priorityList');
                
                if (projects.length === 0) {
                    priorityListEl.innerHTML = `
                        <div class="text-center text-gray-500 py-10">
                            <i class="fa fa-list-ul text-3xl mb-3 text-gray-300"></i>
                            <p>还没有添加项目</p>
                            <p class="text-sm mt-1">添加项目后将按优先级排序显示</p>
                        </div>
                    `;
                    return;
                }
                
                // 按优先级评分排序（从高到低）
                const sortedProjects = [...projects].sort((a, b) => 
                    b.priorityScore - a.priorityScore
                );
                
                priorityListEl.innerHTML = '';
                sortedProjects.forEach((project, index) => {
                    const quadrantClass = `quadrant-${project.quadrant}`;
                    const quadrantNames = {
                        1: "紧急重要",
                        2: "重要不紧急",
                        3: "紧急不重要",
                        4: "不紧急不重要"
                    };
                    
                    const projectEl = document.createElement('div');
                    projectEl.className = `flex items-center p-3 border border-gray-200 rounded-lg hover:shadow-sm transition-all ${quadrantClass}`;
                    projectEl.innerHTML = `
                        <div class="flex-shrink-0 w-8 h-8 bg-primary text-white rounded-full flex items-center justify-center font-bold mr-3">
                            ${index + 1}
                        </div>
                        <div class="flex-grow min-w-0">
                            <div class="font-medium truncate">${project.name}</div>
                            <div class="flex flex-wrap items-center gap-x-4 text-xs text-gray-500 mt-1">
                                <span><i class="fa fa-calendar mr-1"></i>${project.deadline}</span>
                                <span><i class="fa fa-flag mr-1"></i>优先级: ${project.priorityScore.toFixed(1)}</span>
                                <span class="px-1.5 py-0.5 rounded-full text-white text-[10px]" style="background-color: var(--tw-text-opacity); --tw-text-opacity: 1; color: white; background-color: ${this.getQuadrantColor(project.quadrant)}">
                                    ${quadrantNames[project.quadrant]}
                                </span>
                            </div>
                        </div>
                        <div class="flex gap-1 ml-3">
                            <button class="edit-project p-1.5 text-gray-400 hover:text-primary transition-colors" data-id="${project.id}">
                                <i class="fa fa-pencil"></i>
                            </button>
                            <button class="delete-project p-1.5 text-gray-400 hover:text-red-500 transition-colors" data-id="${project.id}">
                                <i class="fa fa-trash-o"></i>
                            </button>
                        </div>
                    `;
                    
                    priorityListEl.appendChild(projectEl);
                });
                
                // 添加编辑和删除事件监听
                this.addProjectActionListeners();
            },
            
            // 渲染四象限项目分布
            renderQuadrants(projects) {
                // 按象限分组
                const quadrants = {
                    1: [],
                    2: [],
                    3: [],
                    4: []
                };
                
                projects.forEach(project => {
                    quadrants[project.quadrant].push(project);
                });
                
                // 为每个象限排序（优先级从高到低）
                Object.keys(quadrants).forEach(key => {
                    quadrants[key].sort((a, b) => b.priorityScore - a.priorityScore);
                });
                
                // 更新每个象限的项目列表
                for (let i = 1; i <= 4; i++) {
                    const quadrantProjects = quadrants[i];
                    const quadrantEl = document.getElementById(`quadrant${i}Projects`);
                    const countEl = document.getElementById(`countQuadrant${i}`);
                    
                    // 更新计数
                    countEl.textContent = `${quadrantProjects.length}个项目`;
                    
                    if (quadrantProjects.length === 0) {
                        quadrantEl.innerHTML = `
                            <div class="p-4 text-center text-gray-500 border border-dashed border-gray-200 rounded-lg">
                                暂无项目
                            </div>
                        `;
                        continue;
                    }
                    
                    // 生成项目列表
                    quadrantEl.innerHTML = '';
                    quadrantProjects.forEach(project => {
                        const projectEl = document.createElement('div');
                        projectEl.className = `quadrant-card quadrant-${i}`;
                        projectEl.innerHTML = `
                            <div class="flex justify-between items-start">
                                <div class="font-medium">${project.name}</div>
                                <div class="flex gap-1">
                                    <button class="edit-project p-1 text-gray-400 hover:text-primary transition-colors" data-id="${project.id}">
                                        <i class="fa fa-pencil"></i>
                                    </button>
                                    <button class="delete-project p-1 text-gray-400 hover:text-red-500 transition-colors" data-id="${project.id}">
                                        <i class="fa fa-trash-o"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="text-sm text-gray-600 mt-2">
                                <div class="flex items-center mb-1">
                                    <i class="fa fa-calendar-o mr-2 text-gray-500"></i>
                                    <span>截止日期: ${project.deadline}</span>
                                </div>
                                <div class="flex items-center mb-1">
                                    <i class="fa fa-star-o mr-2 text-gray-500"></i>
                                    <span>重要度: ${project.importance}</span>
                                </div>
                                <div class="flex items-center">
                                    <i class="fa fa-clock-o mr-2 text-gray-500"></i>
                                    <span>紧急度: ${project.urgency.toFixed(1)}</span>
                                </div>
                            </div>
                            ${project.description ? `
                                <div class="mt-2 text-sm text-gray-700 text-gray-600">
                                    <strong class="text-gray-700">描述:</strong> ${project.description}
                                </div>
                            ` : ''}
                        `;
                        
                        // 添加点击事件（编辑项目）
                        projectEl.addEventListener('click', (e) => {
                            // 避免按钮点击时触发
                            if (!e.target.closest('button')) {
                                this.editProject(project.id);
                            }
                        });
                        
                        quadrantEl.appendChild(projectEl);
                    });
                }
                
                // 添加编辑和删除事件监听
                this.addProjectActionListeners();
            },
            
            // 更新四象限图表
            updateChart(projects) {
                // 清空图表数据
                for (let i = 0; i < 4; i++) {
                    this.quadrantChart.data.datasets[i].data = [];
                }
                
                if (projects.length === 0) {
                    this.quadrantChart.update();
                    return;
                }
                
                // 为每个项目添加到相应的数据集
                projects.forEach(project => {
                    // 象限索引 = 象限编号 - 1
                    const datasetIndex = project.quadrant - 1;
                    
                    // 添加项目数据点（x: 紧急度, y: 重要度）
                    this.quadrantChart.data.datasets[datasetIndex].data.push({
                        x: project.urgency,
                        y: parseInt(project.importance),
                        project: project // 存储完整项目信息用于 tooltip
                    });
                });
                
                this.quadrantChart.update();
            },
            
            // 添加项目操作监听器
            addProjectActionListeners() {
                // 编辑项目
                document.querySelectorAll('.edit-project').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation(); // 防止触发卡片的点击事件
                        const projectId = e.currentTarget.dataset.id;
                        this.editProject(projectId);
                    });
                });
                
                // 删除项目
                document.querySelectorAll('.delete-project').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation(); // 防止触发卡片的点击事件
                        const projectId = e.currentTarget.dataset.id;
                        this.deleteProject(projectId);
                    });
                });
            },
            
            // 获取象限颜色
            getQuadrantColor(quadrant) {
                const colors = {
                    1: '#ef4444',
                    2: '#f59e0b',
                    3: '#60a5fa',
                    4: '#10b981'
                };
                return colors[quadrant] || '#64748b';
            },
            
            // 显示提示消息
            showToast(message, type = 'success') {
                const toast = document.getElementById('toast');
                const toastMsg = document.getElementById('toastMessage');
                
                toastMsg.textContent = message;
                
                // 设置样式
                if (type === 'success') {
                    toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs bg-green-500 text-white';
                    toast.querySelector('i').className = 'fa fa-check-circle mr-2';
                } else if (type === 'error') {
                    toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs bg-red-500 text-white';
                    toast.querySelector('i').className = 'fa fa-exclamation-circle mr-2';
                } else if (type === 'info') {
                    toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs bg-blue-500 text-white';
                    toast.querySelector('i').className = 'fa fa-info-circle mr-2';
                }
                
                // 3秒后隐藏
                setTimeout(() => {
                    toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs';
                }, 3000);
            }
        };
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            ProjectPrioritySorter.init();
        });
    </script>
</body>
</html>
