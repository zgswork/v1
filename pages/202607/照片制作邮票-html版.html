<!DOCTYPE html>
<html lang="zh-CN">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>照片邮票制作工具</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            }

            body {
                background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
                color: #333;
                min-height: 100vh;
                padding: 20px;
            }

            .container {
                max-width: 1400px;
                margin: 0 auto;
                display: flex;
                flex-direction: column;
                gap: 25px;
            }

            header {
                text-align: center;
                padding: 20px;
                background: linear-gradient(90deg, #2c3e50, #4a6491);
                color: white;
                border-radius: 15px;
                box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            }

            header h1 {
                font-size: 2.5rem;
                margin-bottom: 10px;
            }

            header p {
                font-size: 1.1rem;
                opacity: 0.9;
            }

            .main-content {
                display: flex;
                flex-wrap: wrap;
                gap: 25px;
            }

            .control-panel {
                flex: 1;
                min-width: 300px;
                background: white;
                border-radius: 15px;
                padding: 25px;
                box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            }

            .stamp-preview {
                flex: 2;
                min-width: 500px;
                background: white;
                border-radius: 15px;
                padding: 25px;
                box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
                display: flex;
                flex-direction: column;
            }

            .section-title {
                font-size: 1.4rem;
                color: #2c3e50;
                margin-bottom: 20px;
                padding-bottom: 10px;
                border-bottom: 2px solid #eaeaea;
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .section-title i {
                color: #3498db;
            }

            .control-group {
                margin-bottom: 25px;
            }

            .control-label {
                display: block;
                margin-bottom: 8px;
                font-weight: 600;
                color: #444;
            }

            input,
            select,
            textarea {
                width: 100%;
                padding: 12px 15px;
                border: 2px solid #e0e0e0;
                border-radius: 8px;
                font-size: 1rem;
                transition: all 0.3s;
            }

            input:focus,
            select:focus,
            textarea:focus {
                border-color: #3498db;
                outline: none;
                box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
            }

            .range-container {
                display: flex;
                align-items: center;
                gap: 15px;
            }

            .range-value {
                min-width: 50px;
                text-align: center;
                font-weight: bold;
                color: #3498db;
            }

            .checkbox-group {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 15px;
            }

            .checkbox-group input {
                width: 20px;
                height: 20px;
            }

            .button-group {
                display: flex;
                flex-wrap: wrap;
                gap: 15px;
                margin-top: 30px;
            }

            .btn {
                flex: 1;
                min-width: 140px;
                padding: 14px 20px;
                border: none;
                border-radius: 8px;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                transition: all 0.3s;
            }

            .btn-primary {
                background: #3498db;
                color: white;
            }

            .btn-primary:hover {
                background: #2980b9;
                transform: translateY(-3px);
                box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
            }

            .btn-success {
                background: #2ecc71;
                color: white;
            }

            .btn-success:hover {
                background: #27ae60;
                transform: translateY(-3px);
                box-shadow: 0 5px 15px rgba(46, 204, 113, 0.3);
            }

            .btn-warning {
                background: #f39c12;
                color: white;
            }

            .btn-warning:hover {
                background: #d35400;
                transform: translateY(-3px);
                box-shadow: 0 5px 15px rgba(243, 156, 18, 0.3);
            }

            .btn-danger {
                background: #e74c3c;
                color: white;
            }

            .btn-danger:hover {
                background: #c0392b;
                transform: translateY(-3px);
                box-shadow: 0 5px 15px rgba(231, 76, 60, 0.3);
            }

            .preview-container {
                flex: 1;
                background: #f8f9fa;
                border-radius: 10px;
                padding: 20px;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: auto;
                margin-bottom: 20px;
                border: 2px dashed #ddd;
            }

            .stamp-sheet {
                display: grid;
                gap: 15px;
                padding: 20px;
                background: white;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
                border-radius: 5px;
                position: relative;
            }

            .stamp-item {
                position: relative;
                border: 1px solid #ccc;
                background: white;
                overflow: hidden;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            }

            .stamp-image {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .stamp-perforation {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-image:
                    radial-gradient(circle at 0 0, transparent 5px, white 5px, white 7px, transparent 7px),
                    radial-gradient(circle at 100% 0, transparent 5px, white 5px, white 7px, transparent 7px),
                    radial-gradient(circle at 0 100%, transparent 5px, white 5px, white 7px, transparent 7px),
                    radial-gradient(circle at 100% 100%, transparent 5px, white 5px, white 7px, transparent 7px),
                    radial-gradient(circle at 50% 0, transparent 5px, white 5px, white 7px, transparent 7px),
                    radial-gradient(circle at 50% 100%, transparent 5px, white 5px, white 7px, transparent 7px),
                    radial-gradient(circle at 0 50%, transparent 5px, white 5px, white 7px, transparent 7px),
                    radial-gradient(circle at 100% 50%, transparent 5px, white 5px, white 7px, transparent 7px);
                background-size: 20% 20%;
                background-repeat: repeat-x, repeat-x, repeat-x, repeat-x, repeat-x, repeat-x, repeat-y, repeat-y;
                background-position: 0 0, 100% 0, 0 100%, 100% 100%, 50% 0, 50% 100%, 0 50%, 100% 50%;
                pointer-events: none;
            }

            .stamp-value {
                position: absolute;
                bottom: 8px;
                right: 8px;
                background: rgba(255, 255, 255, 0.9);
                padding: 2px 8px;
                border-radius: 3px;
                font-weight: bold;
                color: #c0392b;
                font-size: 14px;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            }

            .stamp-text {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(255, 255, 255, 0.85);
                padding: 5px 15px;
                border-radius: 5px;
                font-weight: bold;
                color: #2c3e50;
                text-align: center;
                max-width: 90%;
                font-size: 16px;
                box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
            }

            .stamp-postmark {
                position: absolute;
                top: 10px;
                left: 10px;
                width: 70px;
                height: 70px;
                border-radius: 50%;
                border: 3px dashed #7f8c8d;
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                font-size: 10px;
                font-weight: bold;
                color: #7f8c8d;
                background: rgba(255, 255, 255, 0.9);
                padding: 5px;
                transform: rotate(-15deg);
                overflow: hidden;
            }

            .empty-preview {
                text-align: center;
                color: #7f8c8d;
            }

            .empty-preview i {
                font-size: 4rem;
                margin-bottom: 15px;
                color: #bdc3c7;
            }

            .empty-preview p {
                font-size: 1.2rem;
            }

            .instructions {
                background: #f8f9fa;
                border-radius: 10px;
                padding: 20px;
                margin-top: 25px;
                border-left: 5px solid #3498db;
            }

            .instructions h3 {
                color: #2c3e50;
                margin-bottom: 10px;
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .instructions ul {
                padding-left: 20px;
            }

            .instructions li {
                margin-bottom: 8px;
                line-height: 1.5;
            }

            footer {
                text-align: center;
                padding: 20px;
                color: #7f8c8d;
                font-size: 0.9rem;
                margin-top: 10px;
            }

            @media (max-width: 1100px) {
                .main-content {
                    flex-direction: column;
                }

                .stamp-preview {
                    min-width: 100%;
                }
            }

            @media (max-width: 768px) {
                .button-group {
                    flex-direction: column;
                }

                .btn {
                    width: 100%;
                }
            }
        </style>
    </head>

    <body>
        <div class="container">
            <header>
                <h1><i class="fas fa-stamp"></i> 照片邮票制作工具</h1>
                <p>上传您的照片，自定义设计成个性化邮票样式</p>
            </header>
            <div class="main-content">
                <div class="control-panel">
                    <h2 class="section-title"><i class="fas fa-sliders-h"></i> 邮票设置</h2>
                    <div class="control-group">
                        <label class="control-label">1. 上传照片</label>
                        <input type="file" id="imageUpload" accept="image/*" class="file-input">
                    </div>
                    <div class="control-group">
                        <label class="control-label">2. 邮票尺寸 (px)</label>
                        <div class="range-container">
                            <input type="range" id="stampSize" min="100" max="300" value="180" step="10"
                                class="range-slider">
                            <span id="sizeValue" class="range-value">180px</span>
                        </div>
                    </div>
                    <div class="control-group">
                        <label class="control-label">3. 每版邮票数量</label>
                        <select id="stampsPerSheet">
                            <option value="1">1张</option>
                            <option value="4" selected>4张 (2×2)</option>
                            <option value="6">6张 (2×3)</option>
                            <option value="9">9张 (3×3)</option>
                            <option value="12">12张 (3×4)</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label class="control-label">4. 邮票面值</label>
                        <input type="text" id="stampValue" placeholder="例如: ¥1.20" value="¥1.20">
                    </div>
                    <div class="control-group">
                        <div class="checkbox-group">
                            <input type="checkbox" id="showText" checked>
                            <label for="showText">在票面显示文字</label>
                        </div>
                        <input type="text" id="stampText" placeholder="输入要在邮票上显示的文字" value="中国邮政">
                    </div>
                    <div class="control-group">
                        <div class="checkbox-group">
                            <input type="checkbox" id="showPostmark" checked>
                            <label for="showPostmark">显示邮戳</label>
                        </div>
                        <input type="text" id="postmarkText" placeholder="输入邮戳内容" value="北京 2023.08.15">
                    </div>
                    <div class="button-group">
                        <button id="saveBtn" class="btn btn-success">
                            <i class="fas fa-save"></i> 另存为图片
                        </button>
                        <button id="printBtn" class="btn btn-warning">
                            <i class="fas fa-print"></i> 打印邮票
                        </button>
                        <button id="clearBtn" class="btn btn-danger">
                            <i class="fas fa-trash-alt"></i> 清空所有
                        </button>
                    </div>
                </div>
                <div class="stamp-preview">
                    <h2 class="section-title"><i class="fas fa-eye"></i> 邮票预览</h2>
                    <div class="preview-container" id="previewContainer">
                        <div class="empty-preview" id="emptyPreview">
                            <i class="fas fa-stamp"></i>
                            <p>上传照片后，邮票将在此处显示</p>
                        </div>
                        <div id="stampSheet" class="stamp-sheet" style="display: none;"></div>
                    </div>
                    <div class="instructions">
                        <h3><i class="fas fa-lightbulb"></i> 使用说明</h3>
                        <ul>
                            <li>上传照片后，系统会自动生成邮票样式</li>
                            <li>调整尺寸滑块可以改变邮票大小</li>
                            <li>选择每版邮票数量可以创建邮票版面</li>
                            <li>可以自定义邮票面值、文字和邮戳内容</li>
                            <li>使用"另存为图片"保存邮票到本地</li>
                            <li>使用"打印邮票"可直接打印邮票版面</li>
                            <li>使用"清空所有"重置所有设置</li>
                        </ul>
                    </div>
                </div>
            </div>
            <footer>
                <p>© 2026 照片邮票制作工具 | 设计用于创建个性化邮票样式</p>
            </footer>
        </div>
        <script>
            // DOM元素引用
            const imageUpload = document.getElementById('imageUpload');
            const stampSize = document.getElementById('stampSize');
            const sizeValue = document.getElementById('sizeValue');
            const stampsPerSheet = document.getElementById('stampsPerSheet');
            const stampValue = document.getElementById('stampValue');
            const showText = document.getElementById('showText');
            const stampText = document.getElementById('stampText');
            const showPostmark = document.getElementById('showPostmark');
            const postmarkText = document.getElementById('postmarkText');
            const saveBtn = document.getElementById('saveBtn');
            const printBtn = document.getElementById('printBtn');
            const clearBtn = document.getElementById('clearBtn');
            const previewContainer = document.getElementById('previewContainer');
            const emptyPreview = document.getElementById('emptyPreview');
            const stampSheet = document.getElementById('stampSheet');
            // 全局变量
            let uploadedImage = null;
            let stampSheetHTML = '';
            // 初始化
            function init() {
                // 显示当前尺寸值
                sizeValue.textContent = `${stampSize.value}px`;
                // 监听尺寸变化
                stampSize.addEventListener('input', function () {
                    sizeValue.textContent = `${this.value}px`;
                    updateStampPreview();
                });
                // 监听其他设置变化
                stampsPerSheet.addEventListener('change', updateStampPreview);
                stampValue.addEventListener('input', updateStampPreview);
                stampText.addEventListener('input', updateStampPreview);
                postmarkText.addEventListener('input', updateStampPreview);
                showText.addEventListener('change', updateStampPreview);
                showPostmark.addEventListener('change', updateStampPreview);
                // 上传图片
                imageUpload.addEventListener('change', handleImageUpload);
                // 按钮事件
                saveBtn.addEventListener('click', saveStampSheet);
                printBtn.addEventListener('click', printStampSheet);
                clearBtn.addEventListener('click', clearAll);
                // 初始化示例
                loadExampleImage();
            }
            // 加载示例图片
            function loadExampleImage() {
                // 创建一个示例图片（这里使用一个在线图片URL作为示例）
                const exampleImage = new Image();
                exampleImage.crossOrigin = "anonymous";
                exampleImage.src = "https://images.unsplash.com/photo-1506744038136-46273834b3fb?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=500&q=80";
                exampleImage.onload = function () {
                    uploadedImage = exampleImage;
                    emptyPreview.style.display = 'none';
                    stampSheet.style.display = 'grid';
                    updateStampPreview();
                };
            }
            // 处理图片上传
            function handleImageUpload(event) {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function (e) {
                    const img = new Image();
                    img.onload = function () {
                        uploadedImage = img;
                        emptyPreview.style.display = 'none';
                        stampSheet.style.display = 'grid';
                        updateStampPreview();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
            // 更新邮票预览
            function updateStampPreview() {
                if (!uploadedImage) return;
                const size = parseInt(stampSize.value);
                const perSheet = parseInt(stampsPerSheet.value);
                const cols = getColumns(perSheet);
                const rows = Math.ceil(perSheet / cols);
                // 设置邮票版面的网格布局
                stampSheet.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
                stampSheet.style.width = `${cols * (size + 30)}px`;
                stampSheet.style.maxWidth = '100%';
                // 清空当前邮票版面
                stampSheet.innerHTML = '';
                // 创建邮票
                for (let i = 0; i < perSheet; i++) {
                    const stamp = createStampElement(size);
                    stampSheet.appendChild(stamp);
                }
            }
            // 根据数量确定列数
            function getColumns(count) {
                switch (count) {
                    case 1: return 1;
                    case 4: return 2;
                    case 6: return 3;
                    case 9: return 3;
                    case 12: return 4;
                    default: return 2;
                }
            }
            // 创建单个邮票元素
            function createStampElement(size) {
                const stampItem = document.createElement('div');
                stampItem.className = 'stamp-item';
                stampItem.style.width = `${size}px`;
                stampItem.style.height = `${size}px`;
                // 添加图片
                const img = document.createElement('img');
                img.className = 'stamp-image';
                img.src = uploadedImage.src;
                stampItem.appendChild(img);
                // 添加齿孔效果
                const perforation = document.createElement('div');
                perforation.className = 'stamp-perforation';
                stampItem.appendChild(perforation);
                // 添加面值
                const value = document.createElement('div');
                value.className = 'stamp-value';
                value.textContent = stampValue.value || '¥1.20';
                stampItem.appendChild(value);
                // 添加文字（如果启用）
                if (showText.checked && stampText.value) {
                    const text = document.createElement('div');
                    text.className = 'stamp-text';
                    text.textContent = stampText.value;
                    stampItem.appendChild(text);
                }
                // 添加邮戳（如果启用）
                if (showPostmark.checked && postmarkText.value) {
                    const postmark = document.createElement('div');
                    postmark.className = 'stamp-postmark';
                    // 将邮戳文本分成两行
                    const words = postmarkText.value.split(' ');
                    if (words.length > 1) {
                        postmark.innerHTML = `${words[0]}<br>${words.slice(1).join(' ')}`;
                    } else {
                        postmark.textContent = postmarkText.value;
                    }
                    stampItem.appendChild(postmark);
                }
                return stampItem;
            }
            // 保存邮票版面为图片
            function saveStampSheet() {
                if (!uploadedImage) {
                    alert('请先上传图片！');
                    return;
                }
                // 使用html2canvas库将邮票版面转换为图片
                // 由于没有实际引入html2canvas，这里模拟保存功能
                // 实际使用时需要引入html2canvas库
                alert('保存功能需要引入html2canvas库。在实际应用中，这里会将邮票版面转换为图片并下载。\n\n示例中已创建邮票样式，您可以截图保存。');
                // 以下为模拟的保存功能代码
                /*
                html2canvas(stampSheet).then(canvas => {
                    const link = document.createElement('a');
                    link.download = '我的邮票.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                });
                */
            }
            // 打印邮票版面
            function printStampSheet() {
                if (!uploadedImage) {
                    alert('请先上传图片！');
                    return;
                }
                // 创建一个打印友好的版本
                const printContent = document.createElement('div');
                printContent.innerHTML = `
                <div style="padding: 20px; font-family: sans-serif;">
                    <h1 style="text-align: center; margin-bottom: 20px;">邮票打印版</h1>
                    <div style="display: grid; gap: 15px; justify-content: center;">
                        ${stampSheet.innerHTML}
                    </div>
                    <p style="text-align: center; margin-top: 30px; color: #666; font-size: 14px;">
                        打印时间: ${new Date().toLocaleString()}
                    </p>
                </div>
            `;
                // 打开打印窗口
                const printWindow = window.open('', '_blank');
                printWindow.document.write(`
                <html>
                    <head>
                        <title>邮票打印</title>
                        <style>
                            ${document.querySelector('style').innerHTML}
                            @media print {
                                .stamp-item {
                                    break-inside: avoid;
                                }
                            }
                        </style>
                    </head>
                    <body>
                        ${printContent.innerHTML}
                        <script>
                            window.onload = function() {
                                window.print();
                                setTimeout(() => window.close(), 500);
                            };
                        <\/script>
                    </body>
                </html>
            `);
                printWindow.document.close();
            }
            // 清空所有设置
            function clearAll() {
                if (!confirm('确定要清空所有设置和上传的图片吗？')) return;
                // 重置表单
                imageUpload.value = '';
                stampSize.value = 180;
                sizeValue.textContent = '180px';
                stampsPerSheet.value = 4;
                stampValue.value = '¥1.20';
                showText.checked = true;
                stampText.value = '中国邮政';
                showPostmark.checked = true;
                postmarkText.value = '北京 2023.08.15';
                // 重置预览
                uploadedImage = null;
                emptyPreview.style.display = 'block';
                stampSheet.style.display = 'none';
                stampSheet.innerHTML = '';
            }
            // 初始化应用
            window.onload = init;
        </script>
    </body>

</html>
