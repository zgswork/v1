<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小红书创作技巧大全</title>
    <style>
        :root {
            --primary-color: #ff2742;
            --secondary-color: #8a2387;
            --background-color: #f8f9fa;
            --card-color: #ffffff;
            --text-color: #333333;
            --light-text: #666666;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            width: 100%;
        }
        
        h1 {
            color: var(--primary-color);
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .subtitle {
            color: var(--light-text);
            font-size: 1.1rem;
        }
        
        .button-container {
            margin: 30px 0;
        }
        
        #generateBtn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(138, 35, 135, 0.3);
        }
        
        #generateBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(138, 35, 135, 0.4);
        }
        
        #generateBtn:active {
            transform: translateY(0);
        }
        
        .tip-container {
            width: 100%;
            min-height: 200px;
            margin-bottom: 40px;
            perspective: 1000px;
        }
        
        .tip-card {
            background-color: var(--card-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            transition: transform 0.6s, opacity 0.6s;
            transform-style: preserve-3d;
            opacity: 0;
            display: none;
        }
        
        .tip-card.active {
            opacity: 1;
            display: block;
            animation: fadeIn 0.6s forwards;
        }
        
        @keyframes fadeIn {
            from { 
                opacity: 0;
                transform: rotateY(90deg);
            }
            to { 
                opacity: 1;
                transform: rotateY(0);
            }
        }
        
        .category {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
        
        .tip-content {
            font-size: 1.2rem;
            line-height: 1.8;
            margin-bottom: 20px;
        }
        
        .tip-number {
            color: var(--light-text);
            font-size: 0.9rem;
            text-align: right;
        }
        
        footer {
            text-align: center;
            margin-top: auto;
            padding: 20px 0;
            color: var(--light-text);
            font-size: 0.9rem;
            width: 100%;
        }
        
        footer p {
            margin: 5px 0;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .tip-content {
                font-size: 1.1rem;
            }
            
            #generateBtn {
                padding: 12px 30px;
            }
        }
    </style>
</head>
<body>

        </header>
        
        <div class="button-container">
            <button id="generateBtn">随机学个小技巧</button>
        </div>
        
        <div class="tip-container">
            <div class="tip-card">
                <!-- 内容将由JavaScript动态生成 -->
            </div>
        </div>
    </div>
    
    <footer>
        <p>本工具由叁贰壹制作</p>

            { id: 2, category: "内容策划", content: "选题紧跟热点与趋势：结合当下热点事件、节假日或流行趋势创作内容，提高笔记时效性和关注度。" },
            { id: 3, category: "内容策划", content: "建立内容矩阵规划：平衡日常笔记(30%)、商品/种草笔记(60%)和活动笔记(10%)的比例，保持内容多样性和持续性。" },
            { id: 4, category: "标题创作", content: "采用'痛点+解决方案'结构：在20字内直击核心，快速传递价值。例如：'毛孔插秧怎么办？医学生教你正确刷酸'。" },
            { id: 5, category: "标题创作", content: "巧用数字和量化结果：奇数和不完整数字(如3、5、7)更易引发好奇。示例：'7天减脂食谱｜小基数也能瘦出马甲线'。" },
            { id: 6, category: "标题创作", content: "制造反差与悬念：使用'痛点+反常识'模式或'对比冲突'设计，激活读者记忆区，提升信息留存率。" },
            { id: 7, category: "标题创作", content: "精准定位人群与场景：标题中明确目标人群(如'早八人'、'INFJ人格')和具体使用场景，提高互动转化率。" },
            { id: 8, category: "标题创作", content: "前置核心关键词：遵循SEO黄金法则，标题开头嵌入'品类词+功效词'，提升搜索匹配度。" },
            { id: 9, category: "视觉优化", content: "使用高清竖版图片：采用3:4比例的竖版图片，占地面积大，易于被点击。确保图片清晰、构图合理。" },
            { id: 10, category: "视觉优化", content: "营造生活化场景氛围：将产品置于真实的生活化场景中拍摄，营造氛围感和代入感，拒绝生硬的特写镜头。" },
            { id: 11, category: "视觉优化", content: "优化视频笔记结构：使用竖版视频，首帧要抓人眼球，60秒内突出1-2个产品特点。添加字幕突出特性。" },
            { id: 12, category: "文案撰写", content: "采用简洁明了的语言：使用短句、排比句和疑问句，避免专业术语和生僻词。文案要简洁易懂，重点突出。" },
            { id: 13, category: "文案撰写", content: "注入情感与个人故事：通过讲述个人使用产品时的亲身体验或特别回忆，增加笔记的亲和力和真实感。" },
            { id: 14, category: "文案撰写", content: "提供实用技巧与深度知识：分享实用的小技巧、窍门或专业知识，让笔记具有参考价值。" },

            { id: 17, category: "互动推广", content: "善用话题标签：添加与产品、内容相关的热门话题标签，提高笔记曝光度。选择适当且相关的标签，避免过多使用。" },
            { id: 18, category: "互动推广", content: "及时回复与反馈优化：积极回复用户评论，增进交流，提升账号活跃度。关注读者反馈，优化后续内容。" },
            { id: 19, category: "互动推广", content: "进行A/B测试与数据优化：同一内容创作3-5个标题变体，初期投放10%流量测试点击率，48小时后保留CTR最高版本。" },
            { id: 20, category: "账号运营", content: "明确账号类型与定位：选择'主理人式账号'(以人为主，突出个人风格)或'橱窗式账号'(以产品为主，通过不同场景展示)。" },
            { id: 21, category: "账号运营", content: "分阶段运营策略：冷启动期日更，日常、种草、商品笔记按3:2:1发布；起步期一周10更以上；成熟期稳定日更。" },
            { id: 22, category: "账号运营", content: "遵循平台规则与算法：了解小红书社区规范和推荐算法，避免使用违禁词或敏感话题。" },
            { id: 23, category: "账号运营", content: "持续学习与迭代：关注行业动态和平台新规，利用数据分析工具跟踪点赞、收藏、评论等指标，基于数据反馈优化内容策略。" }
        ];

        const generateBtn = document.getElementById('generateBtn');
        const tipCard = document.querySelector('.tip-card');
        let previousIndex = -1;

        // 生成随机技巧
        function generateRandomTip() {
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * tipsDatabase.length);
            } while (randomIndex === previousIndex && tipsDatabase.length > 1);
            
            previousIndex = randomIndex;
            const tip = tipsDatabase[randomIndex];
            
            tipCard.innerHTML = `
                <span class="category">${tip.category}</span>
                <p class="tip-content">${tip.content}</p>
                <p class="tip-number">技巧 #${tip.id}</p>
            `;
            
            tipCard.classList.add('active');
        }

        // 按钮点击事件
        generateBtn.addEventListener('click', function() {
            generateRandomTip();
            this.textContent = '换一个小技巧';
        });

        // 初始加载时显示一个技巧
        window.addEventListener('load', function() {
            generateRandomTip();
        });
