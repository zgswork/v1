<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信公众号文章封面图提取工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .title {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .author-info {
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 500;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 16px;
        }

        .url-input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e1e8ed;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .url-input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .extract-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .extract-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .extract-btn:active {
            transform: translateY(0);
        }

        .extract-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .result-section {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            border: 2px dashed #e1e8ed;
            text-align: center;
            display: none;
        }

        .result-section.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .cover-image {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            margin-bottom: 20px;
        }

        .download-btn {
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 10px;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }

        .error-message {
            color: #e74c3c;
            background: #fdf2f2;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #e74c3c;
            margin-top: 15px;
            display: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .tips {
            background: #e8f4fd;
            border: 1px solid #bee5eb;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            color: #0c5460;
        }

        .tips-title {
            font-weight: 600;
            margin-bottom: 8px;
        }

        .tips ul {
            margin-left: 20px;
        }

        .tips li {
            margin-bottom: 5px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
                margin: 10px;
            }
            
            .title {
                font-size: 24px;
            }
            
            .download-btn {
                display: block;
                width: 100%;
                margin: 10px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">微信公众号文章封面图提取工具</h1>
            <p class="subtitle">输入链接，一键获取封面图！</p>
            <div class="author-info">
                🌟 工具作者的公众号：阑梦清川 🌟
            </div>
        </div>

        <div class="input-group">
            <label class="input-label" for="articleUrl">请输入微信公众号文章链接：</label>
            <input type="url" id="articleUrl" class="url-input" placeholder="https://mp.weixin.qq.com/s/...">
        </div>

        <button class="extract-btn" onclick="extractCover()">一键提取封面图</button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在智能提取封面图，请稍候...</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="result-section" id="resultSection">
            <img id="coverImage" class="cover-image" alt="文章封面图">
            <div>
                <button class="download-btn" onclick="downloadImage()">下载图片</button>
                <button class="download-btn" onclick="copyImageUrl()">复制图片链接</button>
            </div>
        </div>

        <div class="tips">
            <div class="tips-title">✨ 智能提取特色：</div>
            <ul>
                <li>🚀 一键操作，无需手动查找</li>
                <li>🎯 智能识别多种封面图格式</li>
                <li>📱 支持所有微信公众号文章</li>
                <li>💾 支持高清图片下载</li>
            </ul>
        </div>
    </div>

    <script>
        let currentImageUrl = '';

        async function extractCover() {
            const urlInput = document.getElementById('articleUrl');
            const url = urlInput.value.trim();
            
            if (!url) {
                showError('请输入文章链接');
                return;
            }

            if (!isValidWechatUrl(url)) {
                showError('请输入有效的微信公众号文章链接');
                return;
            }

            showLoading(true);
            hideError();
            hideResult();

            try {
                // 使用多种方法智能提取封面图
                const coverUrl = await intelligentExtractCover(url);
                
                if (coverUrl) {
                    await displayImage(coverUrl);
                } else {
                    throw new Error('未能找到封面图片');
                }

            } catch (error) {
                console.error('提取失败:', error);
                showError('提取失败，请检查链接是否正确或稍后重试');
            } finally {
                showLoading(false);
            }
        }

        async function intelligentExtractCover(url) {
            // 方法1: 尝试从URL中提取文章ID，然后构造API请求
            try {
                const articleId = extractArticleId(url);
                if (articleId) {
                    const apiUrl = `https://mp.weixin.qq.com/mp/profile_ext?action=getmsg&__biz=${articleId.biz}&mid=${articleId.mid}&idx=${articleId.idx}&sn=${articleId.sn}`;
                    const coverFromApi = await tryExtractFromApi(apiUrl);
                    if (coverFromApi) return coverFromApi;
                }
            } catch (e) {
                console.log('API方法失败，尝试其他方法');
            }

            // 方法2: 使用代理服务获取页面内容
            try {
                const proxyServices = [
                    'https://api.allorigins.win/get?url=',
                    'https://cors-anywhere.herokuapp.com/',
                    'https://thingproxy.freeboard.io/fetch/'
                ];

                for (const proxy of proxyServices) {
                    try {
                        const response = await fetch(proxy + encodeURIComponent(url));
                        if (response.ok) {
                            const data = await response.json();
                            const html = data.contents || data;
                            const coverUrl = extractCoverFromHtml(html);
                            if (coverUrl) return coverUrl;
                        }
                    } catch (e) {
                        continue;
                    }
                }
            } catch (e) {
                console.log('代理方法失败');
            }

            // 方法3: 智能猜测封面图URL
            try {
                const guessedUrl = guessImageUrl(url);
                if (guessedUrl && await testImageUrl(guessedUrl)) {
                    return guessedUrl;
                }
            } catch (e) {
                console.log('猜测方法失败');
            }

            // 方法4: 使用iframe方式（受限但可能有效）
            try {
                return await extractViaIframe(url);
            } catch (e) {
                console.log('iframe方法失败');
            }

            return null;
        }

        function extractArticleId(url) {
            // 从URL中提取文章参数
            const urlObj = new URL(url);
            const params = new URLSearchParams(urlObj.search);
            
            return {
                biz: params.get('__biz'),
                mid: params.get('mid'),
                idx: params.get('idx') || '1',
                sn: params.get('sn')
            };
        }

        function extractCoverFromHtml(html) {
            // 多种正则表达式匹配封面图
            const patterns = [
                // 微信文章封面图的常见模式
                /var\s+msg_cdn_url\s*=\s*["']([^"']+)["']/,
                /"cdn_url"\s*:\s*["']([^"']+)["']/,
                /"cover"\s*:\s*["']([^"']+)["']/,
                /<meta\s+property=["']og:image["']\s+content=["']([^"']+)["']/,
                /data-src=["']([^"']*mmbiz[^"']*)["']/,
                /src=["']([^"']*mmbiz[^"']*)["']/,
                // 新增更多模式
                /"msg_cdn_url"\s*:\s*["']([^"']+)["']/,
                /cover_url["']?\s*[:=]\s*["']([^"']+)["']/,
                /thumb["']?\s*[:=]\s*["']([^"']*mmbiz[^"']*)["']/
            ];

            for (const pattern of patterns) {
                const match = html.match(pattern);
                if (match && match[1]) {
                    let imageUrl = match[1];
                    // 处理URL格式
                    if (imageUrl.startsWith('//')) {
                        imageUrl = 'https:' + imageUrl;
                    } else if (imageUrl.startsWith('/')) {
                        imageUrl = 'https://mmbiz.qpic.cn' + imageUrl;
                    }
                    // 确保是有效的图片URL
                    if (imageUrl.includes('mmbiz') || imageUrl.includes('qpic')) {
                        return imageUrl;
                    }
                }
            }
            return null;
        }

        function guessImageUrl(articleUrl) {
            // 基于文章URL智能猜测封面图URL
            try {
                const urlObj = new URL(articleUrl);
                const params = new URLSearchParams(urlObj.search);
                const sn = params.get('sn');
                
                if (sn) {
                    // 构造可能的封面图URL
                    const possibleUrls = [
                        `https://mmbiz.qpic.cn/mmbiz_jpg/${sn}/0?wx_fmt=jpeg`,
                        `https://mmbiz.qpic.cn/mmbiz_png/${sn}/0?wx_fmt=png`,
                        `https://mmbiz.qpic.cn/sz_mmbiz_jpg/${sn}/0?wx_fmt=jpeg`,
                        `https://mmbiz.qpic.cn/sz_mmbiz_png/${sn}/0?wx_fmt=png`
                    ];
                    
                    return possibleUrls[0]; // 返回第一个尝试
                }
            } catch (e) {
                console.log('URL解析失败');
            }
            return null;
        }

        async function testImageUrl(url) {
            // 测试图片URL是否有效
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
                // 设置超时
                setTimeout(() => resolve(false), 5000);
            });
        }

        async function extractViaIframe(url) {
            // 使用隐藏iframe尝试获取内容（受同源策略限制）
            return new Promise((resolve, reject) => {
                const iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = url;
                
                iframe.onload = () => {
                    try {
                        const doc = iframe.contentDocument || iframe.contentWindow.document;
                        const metaImage = doc.querySelector('meta[property="og:image"]');
                        if (metaImage) {
                            resolve(metaImage.getAttribute('content'));
                        } else {
                            reject(new Error('未找到封面图'));
                        }
                    } catch (e) {
                        reject(e);
                    } finally {
                        document.body.removeChild(iframe);
                    }
                };
                
                iframe.onerror = () => {
                    document.body.removeChild(iframe);
                    reject(new Error('iframe加载失败'));
                };
                
                document.body.appendChild(iframe);
                
                // 超时处理
                setTimeout(() => {
                    if (iframe.parentNode) {
                        document.body.removeChild(iframe);
                        reject(new Error('超时'));
                    }
                }, 10000);
            });
        }

        async function displayImage(imageUrl) {
            // 显示图片，支持多种加载方式
            const img = document.getElementById('coverImage');
            
            return new Promise((resolve, reject) => {
                const testImg = new Image();
                testImg.crossOrigin = 'anonymous';
                
                testImg.onload = () => {
                    currentImageUrl = imageUrl;
                    img.src = imageUrl;
                    showResult();
                    resolve();
                };
                
                testImg.onerror = () => {
                    // 如果直接加载失败，尝试使用图片代理服务
                    const proxyImageUrl = 'https://images.weserv.nl/?url=' + encodeURIComponent(imageUrl);
                    
                    const proxyImg = new Image();
                    proxyImg.onload = () => {
                        currentImageUrl = proxyImageUrl;
                        img.src = proxyImageUrl;
                        showResult();
                        resolve();
                    };
                    
                    proxyImg.onerror = () => {
                        reject(new Error('图片加载失败'));
                    };
                    
                    proxyImg.src = proxyImageUrl;
                };
                
                testImg.src = imageUrl;
            });
        }

        function isValidWechatUrl(url) {
            const wechatPattern = /^https?:\/\/(mp\.weixin\.qq\.com|weixin\.qq\.com)\/s\//;
            return wechatPattern.test(url);
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            document.querySelector('.extract-btn').disabled = show;
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function hideError() {
            document.getElementById('errorMessage').style.display = 'none';
        }

        function showResult() {
            document.getElementById('resultSection').classList.add('show');
        }

        function hideResult() {
            document.getElementById('resultSection').classList.remove('show');
        }

        async function downloadImage() {
            if (!currentImageUrl) return;
            
            try {
                const response = await fetch(currentImageUrl);
                const blob = await response.blob();
                
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'wechat_cover_' + Date.now() + '.jpg';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            } catch (error) {
                // 备用下载方法
                const a = document.createElement('a');
                a.href = currentImageUrl;
                a.download = 'wechat_cover_' + Date.now() + '.jpg';
                a.target = '_blank';
                a.click();
            }
        }

        function copyImageUrl() {
            if (!currentImageUrl) return;
            
            navigator.clipboard.writeText(currentImageUrl).then(() => {
                alert('图片链接已复制到剪贴板！');
            }).catch(() => {
                // 备用复制方法
                const textArea = document.createElement('textarea');
                textArea.value = currentImageUrl;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert('图片链接已复制到剪贴板！');
            });
        }

        // 回车键提交
        document.getElementById('articleUrl').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                extractCover();
            }
        });

        // 自动提取功能：当用户粘贴链接时自动开始提取
        document.getElementById('articleUrl').addEventListener('paste', function(e) {
            setTimeout(() => {
                const url = e.target.value.trim();
                if (url && isValidWechatUrl(url)) {
                    extractCover();
                }
            }, 100);
        });

        // 页面加载完成提示
        window.addEventListener('load', function() {
            console.log('🚀 微信公众号封面图智能提取工具已就绪！');
            console.log('✨ 工具作者公众号：阑梦清川');
        });
    </script>
</body>
</html>
