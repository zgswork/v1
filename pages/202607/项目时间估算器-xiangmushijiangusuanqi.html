<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>项目时间估算器</title>
  <style>
    :root {
      --radius: 12px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    html[data-theme="light"] {
      --bg: #f7f7f8;
      --card-bg: #ffffff;
      --text: #111827;
      --muted-text: #6b7280;
      --border: #e5e7eb;
      --accent: #2563eb;
      --accent-contrast: #ffffff;
      --shadow: 0 8px 24px rgba(16, 24, 40, 0.08);
    }

    html[data-theme="dark"] {
      --bg: #0b0e13;
      --card-bg: #11151b;
      --text: #e5e7eb;
      --muted-text: #a1a1aa;
      --border: #1f2937;
      --accent: #60a5fa;
      --accent-contrast: #0b0e13;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px clamp(16px, 4vw, 32px);
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      backdrop-filter: saturate(1.2) blur(8px);
    }
    .topbar h1 { margin: 0; font-size: clamp(18px, 2.6vw, 24px); }
    .topbar-actions { display: flex; gap: 12px; align-items: center; }

    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 clamp(16px, 4vw, 24px);
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(16px, 3.2vw, 24px);
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: clamp(18px, 2.2vw, 20px);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
    }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 14px; color: var(--muted-text); }
    .field small { color: var(--muted-text); }

    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    input[type="text"], input[type="number"], input[type="date"], select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 20%, transparent); }

    .switch { position: relative; width: 52px; height: 30px; display: inline-flex; align-items: center; }
    .switch input { display: none; }
    .switch .slider {
      position: absolute; inset: 0; border-radius: 999px; background: #d1d5db; transition: all .25s;
    }
    .switch .slider::after {
      content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; background: #fff; border-radius: 50%; box-shadow: 0 2px 6px rgba(0,0,0,.15); transition: all .25s;
    }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider::after { transform: translateX(22px); background: var(--accent-contrast); }

    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead th { text-align: left; padding: 10px; color: var(--muted-text); font-weight: 600; border-bottom: 1px solid var(--border); }
    tbody td { padding: 10px; border-bottom: 1px solid var(--border); }

    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }

    button {
      border: none; border-radius: 10px; padding: 10px 14px; cursor: pointer; font-weight: 600; transition: all .2s; color: var(--accent-contrast);
      background: var(--accent);
    }
    button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    button.primary { background: var(--accent); color: var(--accent-contrast); }
    button:hover { filter: brightness(1.05); }
    
    .muted { color: var(--muted-text); }

    /* 新增：小按钮与任务摘要样式 */
    .row-actions { display: flex; gap: 6px; }
    button.tiny { padding: 6px 10px; font-size: 12px; }
    .tasks-summary { margin-top: 8px; font-size: 13px; color: var(--muted-text); }
    
    .result-grid {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;
    }
    @media (max-width: 640px) {
      .result-grid { grid-template-columns: 1fr; }
    }

    .stat {
      background: color-mix(in oklab, var(--card-bg) 90%, var(--accent) 10%);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }
    .stat .label { color: var(--muted-text); font-size: 13px; }
    .stat .value { font-size: 20px; font-weight: 700; }

    .footer {
      text-align: center; color: var(--muted-text); padding: 24px; font-size: 13px;
    }

    .topbar-btn { display: inline-flex; align-items: center; gap: 8px; }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>项目时间估算器</h1>
    <div class="topbar-actions">
      <button id="themeToggle" class="topbar-btn" aria-label="切换主题">🌙 切换为深色</button>
    </div>
  </header>

  <main class="container">
    <section class="card settings">
      <h2>基础设置</h2>
      <div class="grid">
        <div class="field">
          <label for="startDate">开始日期</label>
          <input type="date" id="startDate" />
        </div>
        <div class="field">
          <label for="teamMembers">团队人数</label>
          <input type="number" id="teamMembers" min="1" step="1" value="1" />
        </div>
        <div class="field">
          <label for="hoursPerDay">每日可投入小时数</label>
          <input type="number" id="hoursPerDay" min="1" step="0.5" value="6">
        </div>
        <div class="field">
          <label for="efficiency">效率系数（0.1-1）</label>
          <input type="number" id="efficiency" min="0.1" max="1" step="0.05" value="0.8" />
          <small class="muted">考虑会议、沟通与环境切换等不可用时间；越低表示效率越低</small>
        </div>
        <div class="field">
          <label for="bufferPercent">缓冲百分比（风险预留）</label>
          <input type="number" id="bufferPercent" min="0" step="1" value="20">
        </div>
        <div class="field">
          <label for="taskUnit">任务工时单位</label>
          <select id="taskUnit">
            <option value="hour" selected>小时</option>
            <option value="day">天</option>
          </select>
        </div>
        <div class="field">
          <label>跳过周末</label>
          <div class="row">
            <label class="switch" title="跳过周末(仅工作日)">
              <input type="checkbox" id="skipWeekends" checked>
              <span class="slider"></span>
            </label>
            <small class="muted">（仅工作日）</small>
          </div>
        </div>
        <div class="field">
          <label for="nonWorkingDays">非工作日（逗号分隔 YYYY-MM-DD）</label>
          <input type="text" id="nonWorkingDays" placeholder="如：2025-01-01,2025-02-10">
        </div>
      </div>
    <div class="actions" style="margin-top:8px">
      <span class="muted">预设：</span>
      <button class="secondary tiny" id="presetAggressive" type="button">激进</button>
      <button class="secondary tiny" id="presetStandard" type="button">标准</button>
      <button class="secondary tiny" id="presetConservative" type="button">保守</button>
    </div>
    </section>

    <section class="card tasks">
      <h2>任务列表</h2>
      <div class="table-responsive">
        <table id="tasksTable" aria-label="任务列表">
          <thead>
            <tr>
              <th style="width: 55%">任务名称</th>
              <th style="width: 30%">预计时长（小时）</th>
              <th style="width: 15%">操作</th>
            </tr>
          </thead>
          <tbody id="tasksBody"></tbody>
        </table>
      </div>
      <div id="tasksSummary" class="tasks-summary">当前任务数：0，总小时：0</div>
      <div class="actions">
        <button id="addTask">新增任务</button>
        <button id="clearTasks" class="secondary">清空任务</button>
        <button id="calculate" class="primary">计算</button>
        <button id="exportJson" class="secondary" type="button">导出JSON</button>
        <button id="importJson" class="secondary" type="button">导入JSON</button>
        <input id="importFile" type="file" accept="application/json" style="display:none">
        <button id="exportCsv" class="secondary" type="button">导出CSV</button>
        <button id="shareLink" class="secondary" type="button">复制分享链接</button>
        <span id="autosaveHint" class="muted" aria-live="polite" style="align-self:center">已开启自动保存</span>
      </div>
    </section>

    <section class="card result">
      <h2>估算结果</h2>
      <div id="resultContent">
        <p class="muted">添加任务并点击“计算”后显示结果。</p>
      </div>
      <div class="actions" style="margin-top: 12px;">
        <button id="copyResult" class="secondary">复制结果</button>
        <button id="printResult" class="secondary" type="button">打印结果</button>
      </div>
    </section>

    <section class="card tips">
      <details>
        <summary>使用说明</summary>
        <ul>
          <li>在任务列表中填写每个任务的预计工时。</li>
          <li>效率系数考虑会议、沟通等不可用时间，典型在 0.7-0.9。</li>
          <li>风险缓冲用于覆盖不确定性与返工，常用 10%-30%。</li>
          <li>开启“跳过周末”后，完工日期不计入周六与周日。</li>
        </ul>
      </details>
    </section>
  </main>

  <footer class="footer">© 项目时间估算器 — 单文件工具，支持浅/深主题与手机/电脑自适应</footer>

  <script>
    // Theme handling
    const rootEl = document.documentElement;
    const themeToggleBtn = document.getElementById('themeToggle');

    function applyTheme(theme) {
      const next = theme || 'light';
      rootEl.setAttribute('data-theme', next);
      localStorage.setItem('pte-theme', next);
      themeToggleBtn.textContent = next === 'dark' ? '☀️ 切换为浅色' : '🌙 切换为深色';
    }

    function initTheme() {
      const saved = localStorage.getItem('pte-theme');
      if (saved) {
        applyTheme(saved);
      } else {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        applyTheme(prefersDark ? 'dark' : 'light');
      }
    }

    themeToggleBtn.addEventListener('click', () => {
    const current = rootEl.getAttribute('data-theme') || 'light';
    applyTheme(current === 'dark' ? 'light' : 'dark');
  });
  // 简易提示与自动保存提示
  function toast(msg) {
    try { console.log(msg); } finally { alert(msg); }
  }
  function autoSaveTip(msg) {
    const hint = document.getElementById('autosaveHint');
    if (!hint) return;
    hint.textContent = msg;
    setTimeout(() => { hint.textContent = '已开启自动保存'; }, 1200);
  }

    // Tasks handling
    const tasksBody = document.getElementById('tasksBody');
    const addTaskBtn = document.getElementById('addTask');
    const clearTasksBtn = document.getElementById('clearTasks');
    const calcBtn = document.getElementById('calculate');
    const exportBtn = document.getElementById('exportJson');
  const importBtn = document.getElementById('importJson');
  const importFileInput = document.getElementById('importFile');
  const copyResultBtn = document.getElementById('copyResult');
  const tasksSummaryEl = document.getElementById('tasksSummary');
  // 新增引用
  const taskUnitSel = document.getElementById('taskUnit');
  const nonWorkingDaysInput = document.getElementById('nonWorkingDays');
  const presetAggressive = document.getElementById('presetAggressive');
  const presetStandard = document.getElementById('presetStandard');
  const presetConservative = document.getElementById('presetConservative');
  const exportCsvBtn = document.getElementById('exportCsv');
  const shareLinkBtn = document.getElementById('shareLink');
  const printResultBtn = document.getElementById('printResult');

    function createRow(name = '', hours = '') {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>
          <input type="text" placeholder="例如：需求梳理" value="${name}" aria-label="任务名称" />
        </td>
        <td>
          <input type="number" placeholder="例如：8" value="${hours}" aria-label="预计工时(小时)" min="0" step="0.5" />
        </td>
        <td>
          <div class="row-actions">
            <button class="secondary tiny" type="button" aria-label="上移">上移</button>
            <button class="secondary tiny" type="button" aria-label="下移">下移</button>
            <button class="secondary tiny" type="button" aria-label="删除任务">删除</button>
          </div>
        </td>
      `;
      const [nameEl, hoursEl] = tr.querySelectorAll('input');
      const [upBtn, downBtn, delBtn] = tr.querySelectorAll('button');
      upBtn.addEventListener('click', () => {
        const prev = tr.previousElementSibling;
        if (prev) tasksBody.insertBefore(tr, prev);
        saveTasks();
        updateTasksSummary();
      });
      downBtn.addEventListener('click', () => {
        const next = tr.nextElementSibling;
        if (next) tasksBody.insertBefore(next, tr);
        saveTasks();
        updateTasksSummary();
      });
      delBtn.addEventListener('click', () => {
        tr.remove();
        saveTasks();
        updateTasksSummary();
      });
      nameEl.addEventListener('input', () => { saveTasks(); updateTasksSummary(); });
      hoursEl.addEventListener('input', () => { saveTasks(); updateTasksSummary(); });
      tasksBody.appendChild(tr);
    }

    function getTasks() {
      const rows = Array.from(tasksBody.querySelectorAll('tr'));
      const unit = taskUnitSel ? taskUnitSel.value : 'hour';
      const hoursPerDayVal = parseFloat(document.getElementById('hoursPerDay').value || '0') || 0;
      const tasks = [];
      rows.forEach((row, idx) => {
        const [nameEl, hoursEl] = row.querySelectorAll('input');
        const name = (nameEl.value||'').trim() || `任务${idx+1}`;
        const valRaw = parseFloat(hoursEl.value||'0');
        if (!isFinite(valRaw) || valRaw <= 0) return;
        const hours = unit === 'day' ? valRaw * hoursPerDayVal : valRaw;
        tasks.push({ name, hours });
      });
      return tasks;
    }

    function formatNum(n) { return Number(n.toFixed(2)); }

    // 新增：本地存储与任务摘要
    function getSettings() {
      return {
        startDate: document.getElementById('startDate').value,
        teamMembers: parseInt(document.getElementById('teamMembers').value || '0', 10),
        hoursPerDay: parseFloat(document.getElementById('hoursPerDay').value || '0'),
        efficiency: parseFloat(document.getElementById('efficiency').value || '1'),
        bufferPercent: parseFloat(document.getElementById('bufferPercent').value || '0'),
        skipWeekends: document.getElementById('skipWeekends').checked,
        taskUnit: taskUnitSel ? taskUnitSel.value : 'hour',
        nonWorkingDays: nonWorkingDaysInput ? nonWorkingDaysInput.value : ''
      };
    }

    function setSettings(s) {
      if (!s) return;
      if (s.startDate !== undefined) document.getElementById('startDate').value = s.startDate;
      if (s.teamMembers !== undefined) document.getElementById('teamMembers').value = s.teamMembers;
      if (s.hoursPerDay !== undefined) document.getElementById('hoursPerDay').value = s.hoursPerDay;
      if (s.efficiency !== undefined) document.getElementById('efficiency').value = s.efficiency;
      if (s.bufferPercent !== undefined) document.getElementById('bufferPercent').value = s.bufferPercent;
      if (s.skipWeekends !== undefined) document.getElementById('skipWeekends').checked = !!s.skipWeekends;
      if (s.taskUnit !== undefined && taskUnitSel) taskUnitSel.value = s.taskUnit;
      if (s.nonWorkingDays !== undefined && nonWorkingDaysInput) nonWorkingDaysInput.value = s.nonWorkingDays;
    }

    function saveSettings() {
      const s = getSettings();
      try { localStorage.setItem('pte_settings', JSON.stringify(s)); } catch (e) { /* ignore */ }
      autoSaveTip('设置已自动保存');
    }

    function loadSettings() {
      try {
        const raw = localStorage.getItem('pte_settings');
        if (!raw) return false;
        const s = JSON.parse(raw);
        setSettings(s);
        return true;
      } catch (e) { return false; }
    }

    function getRawTasks() {
      const rows = Array.from(tasksBody.querySelectorAll('tr'));
      return rows.map(row => {
        const [nameEl, hoursEl] = row.querySelectorAll('input');
        return { name: nameEl.value || '', hours: hoursEl.value || '' };
      });
    }

    function saveTasks() {
      try { localStorage.setItem('pte-tasks', JSON.stringify(getRawTasks())); } catch {}
    }

    function loadTasks() {
      try {
        const raw = localStorage.getItem('pte-tasks');
        if (!raw) return false;
        const arr = JSON.parse(raw);
        tasksBody.innerHTML = '';
        (arr || []).forEach(item => createRow(item.name || '', item.hours || ''));
        updateTasksSummary();
        return (arr || []).length > 0;
      } catch { return false; }
    }

    function updateTasksSummary() {
      const tasks = getTasks();
      const total = tasks.reduce((sum, t) => sum + t.hours, 0);
      document.getElementById('tasksSummary').textContent = `共 ${tasks.length} 项任务，合计 ${total.toFixed(2)} 小时`;
    }

    function addWorkingDays(startDateStr, neededDays, skipWeekends, nonWorkSet) {
      const d = new Date(startDateStr);
      if (isNaN(d)) return null;
      let added = 0;
      const MAX_LOOP = 100000;
      let loops = 0;
      while (added < neededDays && loops < MAX_LOOP) {
        d.setDate(d.getDate() + 1);
        const day = d.getDay();
        const dateStr = ymd(d);
        const isWeekend = (day === 0 || day === 6);
        const isCustomOff = nonWorkSet && nonWorkSet.has(dateStr);
        if (skipWeekends && isWeekend) { loops++; continue; }
        if (isCustomOff) { loops++; continue; }
        added++;
        loops++;
      }
      return d;
    }

    function ymd(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const da = String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${da}`;
    }

    // 补齐：解析自定义非工作日，返回 Set('YYYY-MM-DD')
    function parseNonWorkingDays(str) {
      const set = new Set();
      if (!str) return set;
      const parts = String(str).replace(/，/g, ',').split(/[,;\s]+/);
      for (const p of parts) {
        const s = (p || '').trim();
        if (!s) continue;
        const d = new Date(s);
        if (isNaN(d)) continue;
        set.add(ymd(d));
      }
      return set;
    }

    function calculate() {
      const settings = getSettings();
      const tasks = getTasks();
      if (!settings.startDate) { toast('请设置开始日期'); return; }
      if (!settings.teamMembers || settings.teamMembers <= 0) { toast('请设置团队人数'); return; }
      if (!settings.hoursPerDay || settings.hoursPerDay <= 0) { toast('请设置每日可投入小时数'); return; }
      if (!tasks.length) { toast('请添加至少一项任务并填写有效时长'); return; }
    
      const rawHours = tasks.reduce((sum, t) => sum + t.hours, 0);
      const efficiencyHours = rawHours / (settings.efficiency || 1);
      const adjustedHours = efficiencyHours * (1 + (settings.bufferPercent || 0) / 100);
      const teamDailyCapacity = settings.teamMembers * settings.hoursPerDay;
      const neededDays = Math.ceil(adjustedHours / teamDailyCapacity);
    
      const nonWorkSet = parseNonWorkingDays(settings.nonWorkingDays);
      const endDate = addWorkingDays(settings.startDate, neededDays, settings.skipWeekends, nonWorkSet);
      const endDateStr = endDate ? endDate.toISOString().slice(0,10) : '无效日期';
    
      const resultHtml = `
        <p>总任务时长：<strong>${rawHours.toFixed(2)}</strong> 小时</p>
        <p>效率调整后：<strong>${efficiencyHours.toFixed(2)}</strong> 小时（效率 ${settings.efficiency}）</p>
        <p>缓冲后总计：<strong>${adjustedHours.toFixed(2)}</strong> 小时（缓冲 ${settings.bufferPercent}%）</p>
        <p>团队每日产能：<strong>${teamDailyCapacity.toFixed(2)}</strong> 小时/日（${settings.teamMembers} 人 × ${settings.hoursPerDay} 小时）</p>
        <p>预计总天数：<strong>${neededDays}</strong> 天</p>
        <p>预计完成日期：<strong>${endDateStr}</strong></p>
        <p class="muted">说明：${settings.skipWeekends ? '跳过周末；' : ''}${nonWorkSet.size ? '包含自定义非工作日；' : ''}开始日期为 ${settings.startDate}，结束日期为向后推算的第 ${neededDays} 个工作日。</p>
      `;
      document.getElementById('resultContent').innerHTML = resultHtml;
    }

    // === 绑定操作按钮事件 ===
    addTaskBtn.addEventListener('click', () => {
      createRow('', '');
      saveTasks();
      updateTasksSummary();
    });

    clearTasksBtn.addEventListener('click', () => {
      tasksBody.innerHTML = '';
      saveTasks();
      updateTasksSummary();
    });

    calcBtn.addEventListener('click', () => {
      calculate();
    });

    // 导出 JSON
    exportBtn.addEventListener('click', () => {
      const data = { settings: getSettings(), tasks: getRawTasks() };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '项目时间估算.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    // 导入 JSON
    importBtn.addEventListener('click', () => { if (importFileInput) importFileInput.click(); });
    if (importFileInput) {
      importFileInput.addEventListener('change', () => {
        const file = importFileInput.files && importFileInput.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const obj = JSON.parse(String(reader.result || ''));
            if (obj && obj.settings) setSettings(obj.settings);
            tasksBody.innerHTML = '';
            if (obj && Array.isArray(obj.tasks)) {
              obj.tasks.forEach(t => createRow(t.name || '', t.hours || ''));
            }
            saveSettings();
            saveTasks();
            updateTasksSummary();
            calculate();
            toast('已导入JSON');
          } catch (e) {
            toast('导入失败，请检查JSON格式');
          } finally {
            importFileInput.value = '';
          }
        };
        reader.readAsText(file);
      });
    }

    // 复制结果
    copyResultBtn.addEventListener('click', () => {
      const el = document.getElementById('resultContent');
      const text = (el && el.textContent) ? el.textContent.trim() : '';
      if (!text) { toast('请先计算结果'); return; }
      const fallback = () => {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        ta.remove();
        toast('结果已复制');
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => toast('结果已复制到剪贴板')).catch(fallback);
      } else { fallback(); }
    });

    // 预设效率/缓冲
    presetAggressive.addEventListener('click', () => {
      document.getElementById('efficiency').value = 0.9;
      document.getElementById('bufferPercent').value = 10;
      saveSettings();
      calculate();
    });
    presetStandard.addEventListener('click', () => {
      document.getElementById('efficiency').value = 0.8;
      document.getElementById('bufferPercent').value = 15;
      saveSettings();
      calculate();
    });
    presetConservative.addEventListener('click', () => {
      document.getElementById('efficiency').value = 0.7;
      document.getElementById('bufferPercent').value = 30;
      saveSettings();
      calculate();
    });
    // 导出CSV
    exportCsvBtn.addEventListener('click', () => {
      const s = getSettings();
      const tasks = getTasks();
      if (!tasks.length) { toast('没有可导出的任务'); return; }
      const rawHours = tasks.reduce((sum, t) => sum + t.hours, 0);
      const efficiencyHours = rawHours / (s.efficiency || 1);
      const adjustedHours = efficiencyHours * (1 + (s.bufferPercent || 0) / 100);
      const teamDailyCapacity = s.teamMembers * s.hoursPerDay;
      const neededDays = Math.ceil(adjustedHours / teamDailyCapacity);
      const nonWorkSet = parseNonWorkingDays(s.nonWorkingDays);
      const endDate = addWorkingDays(s.startDate, neededDays, s.skipWeekends, nonWorkSet);
      const endDateStr = endDate ? endDate.toISOString().slice(0,10) : '';
    
      const lines = [];
      lines.push('\ufeff任务名称,预计时长(小时)');
      tasks.forEach(t => lines.push(`${t.name.replace(/[,\n]/g,' ')} , ${t.hours.toFixed(2)}`));
      lines.push('');
      lines.push(`开始日期,${s.startDate}`);
      lines.push(`团队人数,${s.teamMembers}`);
      lines.push(`每日可投入小时数,${s.hoursPerDay}`);
      lines.push(`效率,${s.efficiency}`);
      lines.push(`缓冲百分比,${s.bufferPercent}%`);
      lines.push(`跳过周末,${s.skipWeekends ? '是' : '否'}`);
      lines.push(`自定义非工作日,${s.nonWorkingDays || ''}`);
      lines.push('');
      lines.push(`总任务时长(小时),${rawHours.toFixed(2)}`);
      lines.push(`效率调整后(小时),${efficiencyHours.toFixed(2)}`);
      lines.push(`缓冲后总计(小时),${adjustedHours.toFixed(2)}`);
      lines.push(`团队每日产能(小时/日),${teamDailyCapacity.toFixed(2)}`);
      lines.push(`预计总天数(天),${neededDays}`);
      lines.push(`预计完成日期,${endDateStr}`);
    
      const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '项目时间估算.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
    // 分享链接
    function b64EncodeUnicode(str) {
      return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,
        function toSolidBytes(match, p1) { return String.fromCharCode('0x' + p1); }));
    }
    function b64DecodeUnicode(str) {
      return decodeURIComponent(Array.prototype.map.call(atob(str), function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
    }
    shareLinkBtn.addEventListener('click', async () => {
      const data = { settings: getSettings(), tasks: getRawTasks() };
      const json = JSON.stringify(data);
      const encoded = b64EncodeUnicode(json);
      const url = `${location.origin}${location.pathname}#d=${encoded}`;
      try {
        await navigator.clipboard.writeText(url);
        toast('分享链接已复制到剪贴板');
      } catch (e) {
        toast('复制失败，请手动复制');
        alert(url);
      }
    });
    function tryLoadFromHash() {
      const h = location.hash || '';
      const m = h.match(/#d=([^&]+)/);
      if (!m) return false;
      try {
        const json = b64DecodeUnicode(m[1]);
        const obj = JSON.parse(json);
        if (obj && obj.settings) setSettings(obj.settings);
        if (obj && obj.tasks && Array.isArray(obj.tasks)) {
          const body = document.getElementById('tasksBody');
          body.innerHTML = '';
          obj.tasks.forEach(t => createRow(t.name || '', t.hours || ''));
          updateTasksSummary();
        }
        toast('已从分享链接载入数据');
        return true;
      } catch (e) { return false; }
    }
    // 打印
    printResultBtn.addEventListener('click', () => { window.print(); });

    // 监听设置变更（自动保存）
    ['startDate','teamMembers','hoursPerDay','efficiency','bufferPercent','skipWeekends','taskUnit','nonWorkingDays']
      .forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        const evt = (el.tagName === 'INPUT' || el.tagName === 'SELECT') ? 'change' : 'input';
        el.addEventListener(evt, () => { saveSettings(); updateTasksSummary(); });
      });

    initTheme();
    const loadedFromHash = tryLoadFromHash();
    const loadedS = loadedFromHash ? true : loadSettings();
    const loadedT = loadedFromHash ? true : loadTasks();
    if (!loadedS) {
      document.getElementById('startDate').value = new Date().toISOString().slice(0,10);
    }
    if (!loadedT) {
      createRow('需求分析', 8);
      createRow('UI设计', 12);
      createRow('开发与联调', 40);
    }
    updateTasksSummary();
    calculate();
  </script>
</body>
