<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的日记本 - 2025年</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/zh.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --accent: #4895ef;
            --success: #4cc9f0;
            --light: #f8f9fa;
            --dark: #212529;
            --gray: #6c757d;
            --border: #dee2e6;
            --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e7f1 100%);
            color: var(--dark);
            min-height: 100vh;
            padding: 20px;
        }
        
        .app-container {
            display: grid;
            grid-template-columns: 250px 1fr 300px;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
            height: calc(100vh - 40px);
        }
        
        /* 左侧分类面板 */
        .categories-panel {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }
        
        .panel-header h2 {
            font-size: 1.4rem;
            color: var(--primary);
        }
        
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn:hover {
            background: var(--secondary);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(67, 97, 238, 0.3);
        }
        
        .btn-outline {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
        }
        
        .btn-outline:hover {
            background: var(--primary);
            color: white;
        }
        
        .categories-list {
            overflow-y: auto;
            flex-grow: 1;
        }
        
        .category-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .category-item:hover {
            background: #f8f9ff;
        }
        
        .category-item.active {
            background: #edf2ff;
            border-left: 4px solid var(--primary);
        }
        
        .category-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 12px;
        }
        
        .category-name {
            flex-grow: 1;
            font-weight: 500;
        }
        
        .category-actions {
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .category-item:hover .category-actions {
            opacity: 1;
        }
        
        .category-actions i {
            font-size: 14px;
            color: var(--gray);
            transition: color 0.2s;
        }
        
        .category-actions i:hover {
            color: var(--primary);
        }
        
        /* 中间日记区域 */
        .diary-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .diary-list {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--card-shadow);
            flex: 1;
            overflow-y: auto;
            position: relative;
        }
        
        .diary-item {
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid var(--border);
            position: relative;
        }
        
        .diary-item:hover {
            border-color: var(--accent);
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.1);
        }
        
        .diary-item.active {
            background: #edf2ff;
            border-color: var(--primary);
        }
        
        .diary-date {
            font-size: 0.85rem;
            color: var(--gray);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .diary-date i {
            font-size: 12px;
        }
        
        .diary-title {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }
        
        .diary-preview {
            color: var(--gray);
            font-size: 0.95rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }
        
        .diary-editor {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            flex: 2;
        }
        
        .editor-header {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .date-picker-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .date-picker-container i {
            color: var(--primary);
        }
        
        .editor-title {
            width: 100%;
            font-size: 1.5rem;
            padding: 10px 0;
            border: none;
            border-bottom: 1px solid var(--border);
            margin-bottom: 5px;
            font-weight: 600;
        }
        
        .editor-title:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .editor-content {
            width: 100%;
            flex-grow: 1;
            border: none;
            resize: none;
            font-size: 1rem;
            line-height: 1.6;
            min-height: 200px;
        }
        
        .editor-content:focus {
            outline: none;
        }
        
        .editor-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .media-upload {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .media-btn {
            padding: 8px 16px;
            border-radius: 8px;
            background: #f1f3f9;
            border: 1px dashed var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        
        .media-btn:hover {
            background: #e9ecef;
            border-color: var(--primary);
        }
        
        .media-btn input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        
        /* 右侧预览面板 */
        .preview-panel {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .preview-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px 0;
            line-height: 1.7;
        }
        
        .preview-title {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: var(--dark);
        }
        
        .preview-date {
            color: var(--gray);
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .preview-date i {
            font-size: 14px;
        }
        
        .preview-text {
            margin-bottom: 25px;
            white-space: pre-wrap;
        }
        
        .preview-media {
            margin-top: 20px;
        }
        
        .media-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        
        .media-item {
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            padding-top: 100%;
        }
        
        .media-item img, .media-item video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .export-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }
        
        .export-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        
        .export-btn {
            background: #f8f9fa;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .export-btn:hover {
            border-color: var(--primary);
            background: #edf2ff;
        }
        
        .export-btn i {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: var(--primary);
        }
        
        /* 模态框样式 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        
        .modal.active {
            opacity: 1;
            pointer-events: all;
        }
        
        .modal-content {
            background: white;
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            transform: translateY(20px);
            transition: transform 0.3s;
        }
        
        .modal.active .modal-content {
            transform: translateY(0);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-title {
            font-size: 1.4rem;
            color: var(--dark);
        }
        
        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--gray);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .color-picker {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .color-option {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }
        
        .color-option.selected {
            border-color: var(--dark);
        }
        
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        
        /* 响应式设计 */
        @media (max-width: 1200px) {
            .app-container {
                grid-template-columns: 200px 1fr;
            }
            
            .preview-panel {
                display: none;
            }
        }
        
        @media (max-width: 768px) {
            .app-container {
                grid-template-columns: 1fr;
                height: auto;
            }
            
            .categories-panel {
                margin-bottom: 20px;
            }
        }
        
        /* 日期选择器自定义样式 */
        .flatpickr-input {
            padding: 10px 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            width: 100%;
        }
        
        .flatpickr-input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        /* 导出加载状态 */
        .export-loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        
        .export-loading.active {
            opacity: 1;
            pointer-events: all;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(67, 97, 238, 0.3);
            border-top: 5px solid #4361ee;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        .loading-text {
            font-size: 1.2rem;
            color: var(--primary);
            font-weight: 500;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .media-counter {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--primary);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 左侧分类面板 -->
        <div class="categories-panel">
            <div class="panel-header">
                <h2>日记分类</h2>
                <button class="btn" id="add-category-btn">
                    <i class="fas fa-plus"></i> 添加
                </button>
            </div>
            <div class="categories-list" id="categories-list">
                <div class="category-item active" data-id="all">
                    <div class="category-color" style="background-color: #4361ee;"></div>
                    <div class="category-name">全部日记</div>
                </div>
                <!-- 分类项将通过JavaScript动态生成 -->
            </div>
        </div>
        
        <!-- 中间日记区域 -->
        <div class="diary-panel">
            <div class="diary-list">
                <div class="panel-header">
                    <h2>我的日记</h2>
                    <button class="btn" id="new-diary-btn">
                        <i class="fas fa-plus"></i> 新日记
                    </button>
                </div>
                <div class="diary-items-container" id="diary-items-container">
                    <!-- 日记项将通过JavaScript动态生成 -->
                </div>
            </div>
            
            <div class="diary-editor">
                <div class="editor-header">
                    <div class="date-picker-container">
                        <i class="fas fa-calendar-alt"></i>
                        <input type="text" id="diary-date" class="flatpickr-input" placeholder="选择日期">
                    </div>
                    <input type="text" class="editor-title" id="diary-title" placeholder="日记标题">
                </div>
                <textarea class="editor-content" id="diary-content" placeholder="写下你的想法..."></textarea>
                
                <div class="media-upload">
                    <div class="media-btn" id="add-image-btn">
                        <i class="fas fa-image"></i> 添加图片
                        <input type="file" id="image-upload" accept="image/*" multiple>
                        <span class="media-counter" id="image-counter">0</span>
                    </div>
                    <div class="media-btn" id="add-video-btn">
                        <i class="fas fa-video"></i> 添加视频
                        <input type="file" id="video-upload" accept="video/*" multiple>
                        <span class="media-counter" id="video-counter">0</span>
                    </div>
                </div>
                
                <div class="editor-actions">
                    <button class="btn" id="save-diary-btn">
                        <i class="fas fa-save"></i> 保存日记
                    </button>
                    <button class="btn btn-outline" id="delete-diary-btn">
                        <i class="fas fa-trash"></i> 删除
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 右侧预览面板 -->
        <div class="preview-panel">
            <div class="panel-header">
                <h2>日记预览</h2>
            </div>
            
            <div class="preview-content" id="preview-content">
                <div class="preview-title" id="preview-title">请选择或创建一篇日记</div>
                <div class="preview-date" id="preview-date">
                    <i class="fas fa-calendar-alt"></i>
                    <span id="preview-date-text">-</span>
                </div>
                <div class="preview-text" id="preview-text"></div>
                
                <div class="preview-media" id="preview-media" style="display: none;">
                    <h3><i class="fas fa-images"></i> 媒体</h3>
                    <div class="media-grid" id="preview-media-grid">
                        <!-- 媒体内容将通过JavaScript动态生成 -->
                    </div>
                </div>
            </div>
            
            <div class="export-section">
                <h3><i class="fas fa-download"></i> 导出日记</h3>
                <div class="export-options">
                    <div class="export-btn" id="export-pdf-btn">
                        <i class="fas fa-file-pdf"></i>
                        <span>PDF格式</span>
                    </div>
                    <div class="export-btn" id="export-word-btn">
                        <i class="fas fa-file-word"></i>
                        <span>Word文档</span>
                    </div>
                    <div class="export-btn" id="export-text-btn">
                        <i class="fas fa-file-alt"></i>
                        <span>纯文本</span>
                    </div>
                    <div class="export-btn" id="export-all-btn">
                        <i class="fas fa-file-archive"></i>
                        <span>导出全部</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 添加分类模态框 -->
    <div class="modal" id="category-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">添加新分类</h3>
                <button class="close-btn">&times;</button>
            </div>
            <div class="form-group">
                <label class="form-label">分类名称</label>
                <input type="text" class="form-input" id="category-name" placeholder="输入分类名称">
            </div>
            <div class="form-group">
                <label class="form-label">选择颜色</label>
                <div class="color-picker">
                    <div class="color-option selected" style="background-color: #4361ee;"></div>
                    <div class="color-option" style="background-color: #4cc9f0;"></div>
                    <div class="color-option" style="background-color: #f72585;"></div>
                    <div class="color-option" style="background-color: #7209b7;"></div>
                    <div class="color-option" style="background-color: #3a0ca3;"></div>
                    <div class="color-option" style="background-color: #2ec4b6;"></div>
                    <div class="color-option" style="background-color: #ff9f1c;"></div>
                    <div class="color-option" style="background-color: #e71d36;"></div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-outline" id="cancel-category-btn">取消</button>
                <button class="btn" id="save-category-btn">保存分类</button>
            </div>
        </div>
    </div>
    
    <!-- 导出加载指示器 -->
    <div class="export-loading" id="export-loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">正在导出，请稍候...</div>
    </div>
    
    <script>
        // 数据存储键
        const CATEGORIES_STORAGE_KEY = 'diary_categories';
        const DIARIES_STORAGE_KEY = 'diary_entries';
        
        // 从本地存储加载数据或使用初始数据
        let categories = JSON.parse(localStorage.getItem(CATEGORIES_STORAGE_KEY)) || [
            { id: "1", name: "工作日志", color: "#4cc9f0" },
            { id: "2", name: "个人感悟", color: "#f72585" },
            { id: "3", name: "旅行记录", color: "#7209b7" },
            { id: "4", name: "读书笔记", color: "#3a0ca3" }
        ];
        
        let diaries = JSON.parse(localStorage.getItem(DIARIES_STORAGE_KEY)) || [
            {
                id: "1",
                title: "2025项目启动",
                content: "今天是2025年的第一个工作日，我们启动了新项目。团队充满热情，制定了详细的项目计划。\n\n今年的目标是开发一款创新的AI助手，帮助人们提高生产力。我们计划在6个月内完成第一个版本。",
                date: "2025-01-02",
                category: "1",
                media: [
                    "https://images.unsplash.com/photo-1553877522-43269d4ea984?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80"
                ]
            },
            {
                id: "2",
                title: "2025新年计划",
                content: "2025年开始了！我制定了今年的个人发展计划：\n1. 学习一门新语言（西班牙语）\n2. 每月阅读两本书\n3. 坚持每周锻炼三次\n4. 完成一次海外旅行\n\n希望年底回顾时，我能完成这些目标！",
                date: "2025-01-01",
                category: "2",
                media: []
            },
            {
                id: "3",
                title: "巴黎之旅",
                content: "第一次来到巴黎，这座浪漫之都完全超出了我的预期。\n\n今天参观了埃菲尔铁塔和卢浮宫。蒙娜丽莎的微笑比我想象的要小得多，但整个博物馆的艺术珍品令人叹为观止。\n\n傍晚在塞纳河畔散步，欣赏夕阳下的城市美景。",
                date: "2025-03-15",
                category: "3",
                media: [
                    "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80",
                    "https://images.unsplash.com/photo-1499856871958-5b9627545d1a?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=600&q=80"
                ]
            },
            {
                id: "4",
                title: "《未来简史》读后感",
                content: "刚刚读完尤瓦尔·赫拉利的《未来简史》，这本书让我对人类的未来有了全新的思考。\n\n书中预测，人工智能和生物技术将重新定义人类的意义。最震撼的观点是：数据主义可能成为新的宗教，算法可能比我们更了解自己。\n\n在这个快速变化的时代，保持学习和适应能力比任何时候都重要。",
                date: "2025-02-20",
                category: "4",
                media: []
            }
        ];
        
        // 保存数据到本地存储
        function saveToLocalStorage() {
            localStorage.setItem(CATEGORIES_STORAGE_KEY, JSON.stringify(categories));
            localStorage.setItem(DIARIES_STORAGE_KEY, JSON.stringify(diaries));
        }
        
        // 当前选中的日记和分类
        let currentDiaryId = null;
        let currentCategoryId = "all";
        let uploadedImages = [];
        let uploadedVideos = [];
        
        // DOM 元素
        const categoryModal = document.getElementById('category-modal');
        const addCategoryBtn = document.getElementById('add-category-btn');
        const closeModalBtn = document.querySelector('.close-btn');
        const cancelCategoryBtn = document.getElementById('cancel-category-btn');
        const saveCategoryBtn = document.getElementById('save-category-btn');
        const newDiaryBtn = document.getElementById('new-diary-btn');
        const diaryItemsContainer = document.getElementById('diary-items-container');
        const saveDiaryBtn = document.getElementById('save-diary-btn');
        const deleteDiaryBtn = document.getElementById('delete-diary-btn');
        const categoriesList = document.getElementById('categories-list');
        const previewTitle = document.getElementById('preview-title');
        const previewDateText = document.getElementById('preview-date-text');
        const previewText = document.getElementById('preview-text');
        const previewMedia = document.getElementById('preview-media');
        const previewMediaGrid = document.getElementById('preview-media-grid');
        const diaryTitleInput = document.getElementById('diary-title');
        const diaryContentInput = document.getElementById('diary-content');
        const exportLoading = document.getElementById('export-loading');
        const imageUploadInput = document.getElementById('image-upload');
        const videoUploadInput = document.getElementById('video-upload');
        const imageCounter = document.getElementById('image-counter');
        const videoCounter = document.getElementById('video-counter');
        
        // 初始化日期选择器 (设置为2025年)
        const datePicker = flatpickr("#diary-date", {
            locale: "zh",
            defaultDate: new Date(),
            dateFormat: "Y-m-d",
            minDate: "2025-01-01",
            maxDate: "2025-12-31",
            disableMobile: true
        });
        
        // 日期格式化函数
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                weekday: 'long'
            });
        }
        
        // 渲染分类列表
        function renderCategories() {
            categoriesList.innerHTML = '';
            
            // 添加"全部日记"分类
            const allCategoryItem = document.createElement('div');
            allCategoryItem.className = 'category-item active';
            allCategoryItem.dataset.id = "all";
            allCategoryItem.innerHTML = `
                <div class="category-color" style="background-color: #4361ee;"></div>
                <div class="category-name">全部日记</div>
            `;
            allCategoryItem.addEventListener('click', () => {
                selectCategory("all");
            });
            categoriesList.appendChild(allCategoryItem);
            
            // 添加其他分类
            categories.forEach(category => {
                const categoryItem = document.createElement('div');
                categoryItem.className = 'category-item';
                categoryItem.dataset.id = category.id;
                
                categoryItem.innerHTML = `
                    <div class="category-color" style="background-color: ${category.color};"></div>
                    <div class="category-name">${category.name}</div>
                    <div class="category-actions">
                        <i class="fas fa-pen edit-category"></i>
                        <i class="fas fa-trash delete-category"></i>
                    </div>
                `;
                
                categoryItem.addEventListener('click', (e) => {
                    // 防止点击操作按钮时触发分类选择
                    if (e.target.closest('.category-actions')) return;
                    
                    selectCategory(category.id);
                });
                
                // 添加编辑事件
                const editBtn = categoryItem.querySelector('.edit-category');
                editBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    // 这里可以添加编辑分类的功能
                    alert('编辑功能将在后续版本中实现');
                });
                
                // 添加删除事件
                const deleteBtn = categoryItem.querySelector('.delete-category');
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteCategory(category.id);
                });
                
                categoriesList.appendChild(categoryItem);
            });
        }
        
        // 渲染日记列表
        function renderDiaries(categoryId = "all") {
            diaryItemsContainer.innerHTML = '';
            
            let filteredDiaries = diaries;
            if (categoryId !== "all") {
                filteredDiaries = diaries.filter(diary => diary.category === categoryId);
            }
            
            if (filteredDiaries.length === 0) {
                diaryItemsContainer.innerHTML = `<div class="no-diary">该分类下还没有日记</div>`;
                return;
            }
            
            filteredDiaries.forEach(diary => {
                const category = categories.find(cat => cat.id === diary.category);
                
                const diaryItem = document.createElement('div');
                diaryItem.className = 'diary-item';
                if (diary.id === currentDiaryId) {
                    diaryItem.classList.add('active');
                }
                diaryItem.dataset.id = diary.id;
                
                diaryItem.innerHTML = `
                    <div class="diary-date">
                        <i class="fas fa-calendar"></i> ${formatDate(diary.date)}
                    </div>
                    <div class="diary-title">${diary.title}</div>
                    <div class="diary-preview">${diary.content.substring(0, 100)}${diary.content.length > 100 ? '...' : ''}</div>
                    ${category ? `<div class="diary-category" style="margin-top: 8px; display: inline-flex; align-items: center; padding: 4px 10px; background: ${category.color}20; border-radius: 20px; color: ${category.color}; font-size: 0.8rem;">
                        <div style="width: 10px; height: 10px; background: ${category.color}; border-radius: 50%; margin-right: 6px;"></div>
                        ${category.name}
                    </div>` : ''}
                `;
                
                diaryItem.addEventListener('click', () => {
                    loadDiary(diary.id);
                });
                
                diaryItemsContainer.appendChild(diaryItem);
            });
        }
        
        // 加载日记到编辑器
        function loadDiary(diaryId) {
            const diary = diaries.find(d => d.id === diaryId);
            if (!diary) return;
            
            currentDiaryId = diaryId;
            
            // 更新编辑器
            diaryTitleInput.value = diary.title;
            diaryContentInput.value = diary.content;
            datePicker.setDate(diary.date);
            
            // 更新预览
            previewTitle.textContent = diary.title;
            previewDateText.textContent = formatDate(diary.date);
            previewText.textContent = diary.content;
            
            // 更新媒体预览
            previewMediaGrid.innerHTML = '';
            if (diary.media && diary.media.length > 0) {
                previewMedia.style.display = 'block';
                diary.media.forEach(mediaUrl => {
                    const mediaItem = document.createElement('div');
                    mediaItem.className = 'media-item';
                    
                    if (mediaUrl.includes('.mp4') || mediaUrl.includes('.mov')) {
                        mediaItem.innerHTML = `<video src="${mediaUrl}" controls></video>`;
                    } else {
                        mediaItem.innerHTML = `<img src="${mediaUrl}" alt="日记图片">`;
                    }
                    
                    previewMediaGrid.appendChild(mediaItem);
                });
            } else {
                previewMedia.style.display = 'none';
            }
            
            // 更新UI状态
            document.querySelectorAll('.diary-item').forEach(item => {
                item.classList.remove('active');
                if (item.dataset.id === diaryId) {
                    item.classList.add('active');
                }
            });
            
            // 重置媒体计数器
            uploadedImages = [];
            uploadedVideos = [];
            updateMediaCounters();
        }
        
        // 更新媒体计数器
        function updateMediaCounters() {
            imageCounter.textContent = uploadedImages.length;
            videoCounter.textContent = uploadedVideos.length;
        }
        
        // 添加新日记
        function createNewDiary() {
            currentDiaryId = null;
            
            // 清空编辑器
            diaryTitleInput.value = '';
            diaryContentInput.value = '';
            
            // 设置默认日期为今天
            const today = new Date();
            datePicker.setDate(today);
            
            // 更新预览
            previewTitle.textContent = '新日记';
            previewDateText.textContent = formatDate(today);
            previewText.textContent = '';
            previewMedia.style.display = 'none';
            previewMediaGrid.innerHTML = '';
            
            // 移除所有活动日记项
            document.querySelectorAll('.diary-item').forEach(item => {
                item.classList.remove('active');
            });
            
            // 重置媒体上传
            uploadedImages = [];
            uploadedVideos = [];
            updateMediaCounters();
        }
        
        // 保存日记
        function saveDiary() {
            const title = diaryTitleInput.value.trim();
            const content = diaryContentInput.value.trim();
            const date = datePicker.selectedDates[0] ? 
                          datePicker.formatDate(datePicker.selectedDates[0], 'Y-m-d') : 
                          new Date().toISOString().split('T')[0];
            
            if (!title || !content) {
                alert('请填写标题和内容');
                return;
            }
            
            // 收集媒体文件
            const mediaFiles = [...uploadedImages, ...uploadedVideos].map(file => URL.createObjectURL(file));
            
            if (currentDiaryId) {
                // 更新现有日记
                const index = diaries.findIndex(d => d.id === currentDiaryId);
                if (index !== -1) {
                    diaries[index].title = title;
                    diaries[index].content = content;
                    diaries[index].date = date;
                    diaries[index].media = [...diaries[index].media, ...mediaFiles];
                }
            } else {
                // 创建新日记
                const newDiary = {
                    id: Date.now().toString(),
                    title,
                    content,
                    date,
                    category: currentCategoryId === "all" ? "2" : currentCategoryId,
                    media: mediaFiles
                };
                diaries.unshift(newDiary);
                currentDiaryId = newDiary.id;
            }
            
            // 重新渲染日记列表
            renderDiaries(currentCategoryId);
            
            // 加载当前日记
            loadDiary(currentDiaryId);
            
            // 保存到本地存储
            saveToLocalStorage();
            
            alert('日记保存成功！');
        }
        
        // 删除当前日记
        function deleteDiary() {
            if (!currentDiaryId) {
                alert('没有选择日记');
                return;
            }
            
            if (confirm('确定要删除这篇日记吗？')) {
                const index = diaries.findIndex(d => d.id === currentDiaryId);
                if (index !== -1) {
                    diaries.splice(index, 1);
                    createNewDiary();
                    renderDiaries(currentCategoryId);
                    
                    // 保存到本地存储
                    saveToLocalStorage();
                }
            }
        }
        
        // 添加新分类
        function addCategory() {
            categoryModal.classList.add('active');
        }
        
        // 保存新分类
        function saveCategory() {
            const name = document.getElementById('category-name').value.trim();
            const color = document.querySelector('.color-option.selected').style.backgroundColor;
            
            if (!name) {
                alert('请输入分类名称');
                return;
            }
            
            // 创建新分类
            const newCategory = {
                id: Date.now().toString(),
                name,
                color
            };
            
            categories.push(newCategory);
            
            // 重新渲染分类列表
            renderCategories();
            
            // 关闭模态框
            categoryModal.classList.remove('active');
            document.getElementById('category-name').value = '';
            
            // 保存到本地存储
            saveToLocalStorage();
            
            alert(`分类"${name}"添加成功！`);
        }
        
        // 删除分类
        function deleteCategory(categoryId) {
            if (confirm('确定要删除这个分类吗？分类下的日记不会被删除，但会被标记为未分类。')) {
                // 从分类数组中移除
                const categoryIndex = categories.findIndex(cat => cat.id === categoryId);
                if (categoryIndex !== -1) {
                    categories.splice(categoryIndex, 1);
                }
                
                // 将该分类下的日记设置为未分类
                diaries.forEach(diary => {
                    if (diary.category === categoryId) {
                        diary.category = "";
                    }
                });
                
                // 如果当前选中的是这个分类，切换到"全部日记"
                if (currentCategoryId === categoryId) {
                    currentCategoryId = "all";
                    document.querySelectorAll('.category-item').forEach(item => {
                        item.classList.remove('active');
                        if (item.dataset.id === "all") {
                            item.classList.add('active');
                        }
                    });
                }
                
                // 重新渲染分类列表
                renderCategories();
                
                // 重新渲染日记列表
                renderDiaries(currentCategoryId);
                
                // 保存到本地存储
                saveToLocalStorage();
                
                alert('分类已删除！');
            }
        }
        
        // 选择分类
        function selectCategory(categoryId) {
            currentCategoryId = categoryId;
            
            // 更新UI
            document.querySelectorAll('.category-item').forEach(item => {
                item.classList.remove('active');
                if (item.dataset.id === categoryId) {
                    item.classList.add('active');
                }
            });
            
            // 重新渲染日记列表
            renderDiaries(categoryId);
        }
        
        // 导出为Word文档
        function exportToWord() {
            if (!currentDiaryId) {
                alert('请先选择一篇日记');
                return;
            }
            
            exportLoading.classList.add('active');
            
            // 模拟导出过程
            setTimeout(() => {
                const diary = diaries.find(d => d.id === currentDiaryId);
                if (!diary) {
                    exportLoading.classList.remove('active');
                    alert('日记不存在');
                    return;
                }
                
                // 创建Word文档内容
                const content = `
                    <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                    <head>
                        <meta charset='utf-8'>
                        <title>${diary.title}</title>
                        <style>
                            body { font-family: 'Microsoft YaHei', sans-serif; line-height: 1.6; }
                            h1 { color: #2c3e50; border-bottom: 2px solid #4361ee; padding-bottom: 10px; }
                            .date { color: #7f8c8d; margin-bottom: 20px; }
                            .content { white-space: pre-wrap; margin-top: 20px; }
                        </style>
                    </head>
                    <body>
                        <h1>${diary.title}</h1>
                        <div class="date">${formatDate(diary.date)}</div>
                        <div class="content">${diary.content.replace(/\n/g, '<br>')}</div>
                    </body>
                    </html>
                `;
                
                // 创建Blob对象
                const blob = new Blob([content], {type: 'application/msword'});
                
                // 创建下载链接
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `${diary.title}.doc`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                exportLoading.classList.remove('active');
            }, 1500);
        }
        
        // 导出为PDF
        function exportToPDF() {
            if (!currentDiaryId) {
                alert('请先选择一篇日记');
                return;
            }
            
            exportLoading.classList.add('active');
            
            setTimeout(() => {
                const diary = diaries.find(d => d.id === currentDiaryId);
                if (!diary) {
                    exportLoading.classList.remove('active');
                    alert('日记不存在');
                    return;
                }
                
                // 创建PDF文档
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                // 设置字体
                doc.setFont('helvetica');
                
                // 添加标题
                doc.setFontSize(22);
                doc.setTextColor(33, 37, 41);
                doc.text(diary.title, 105, 20, { align: 'center' });
                
                // 添加日期
                doc.setFontSize(12);
                doc.setTextColor(108, 117, 125);
                doc.text(formatDate(diary.date), 105, 30, { align: 'center' });
                
                // 添加内容
                doc.setFontSize(14);
                doc.setTextColor(33, 37, 41);
                
                // 分割文本以适应PDF宽度
                const splitText = doc.splitTextToSize(diary.content, 180);
                doc.text(splitText, 15, 45);
                
                // 保存PDF
                doc.save(`${diary.title}.pdf`);
                
                exportLoading.classList.remove('active');
            }, 1500);
        }
        
        // 导出全部日记
        function exportAllDiaries() {
            if (diaries.length === 0) {
                alert('没有日记可以导出');
                return;
            }
            
            exportLoading.classList.add('active');
            
            setTimeout(() => {
                const zip = new JSZip();
                
                // 为每篇日记创建Word文件
                diaries.forEach(diary => {
                    const content = `
                        <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                        <head>
                            <meta charset='utf-8'>
                            <title>${diary.title}</title>
                            <style>
                                body { font-family: 'Microsoft YaHei', sans-serif; line-height: 1.6; }
                                h1 { color: #2c3e50; border-bottom: 2px solid #4361ee; padding-bottom: 10px; }
                                .date { color: #7f8c8d; margin-bottom: 20px; }
                                .content { white-space: pre-wrap; margin-top: 20px; }
                            </style>
                        </head>
                        <body>
                            <h1>${diary.title}</h1>
                            <div class="date">${formatDate(diary.date)}</div>
                            <div class="content">${diary.content.replace(/\n/g, '<br>')}</div>
                        </body>
                        </html>
                    `;
                    
                    zip.file(`${diary.title}.doc`, content);
                });
                
                // 生成ZIP文件并下载
                zip.generateAsync({ type: "blob" })
                   .then(function(content) {
                       saveAs(content, "我的全部日记.zip");
                       exportLoading.classList.remove('active');
                   });
            }, 2000);
        }
        
        // 事件监听器
        document.addEventListener('DOMContentLoaded', () => {
            // 初始化分类和日记列表
            renderCategories();
            renderDiaries();
            
            // 默认加载第一篇日记
            if (diaries.length > 0) {
                loadDiary(diaries[0].id);
            }
            
            // 添加新分类按钮
            addCategoryBtn.addEventListener('click', addCategory);
            
            // 关闭模态框
            closeModalBtn.addEventListener('click', () => {
                categoryModal.classList.remove('active');
            });
            
            cancelCategoryBtn.addEventListener('click', () => {
                categoryModal.classList.remove('active');
            });
            
            // 保存分类
            saveCategoryBtn.addEventListener('click', saveCategory);
            
            // 新日记按钮
            newDiaryBtn.addEventListener('click', createNewDiary);
            
            // 保存日记按钮
            saveDiaryBtn.addEventListener('click', saveDiary);
            
            // 删除日记按钮
            deleteDiaryBtn.addEventListener('click', deleteDiary);
            
            // 图片上传
            imageUploadInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    uploadedImages = [...uploadedImages, ...Array.from(e.target.files)];
                    updateMediaCounters();
                    alert(`已添加 ${e.target.files.length} 张图片`);
                }
            });
            
            // 视频上传
            videoUploadInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    uploadedVideos = [...uploadedVideos, ...Array.from(e.target.files)];
                    updateMediaCounters();
                    alert(`已添加 ${e.target.files.length} 个视频`);
                }
            });
            
            // PDF导出按钮
            document.getElementById('export-pdf-btn').addEventListener('click', exportToPDF);
            
            // Word导出按钮
            document.getElementById('export-word-btn').addEventListener('click', exportToWord);
            
            // 文本导出按钮
            document.getElementById('export-text-btn').addEventListener('click', () => {
                if (!currentDiaryId) {
                    alert('请先选择一篇日记');
                    return;
                }
                
                const diary = diaries.find(d => d.id === currentDiaryId);
                if (!diary) return;
                
                const content = `${diary.title}\n\n日期: ${formatDate(diary.date)}\n\n${diary.content}`;
                const blob = new Blob([content], {type: 'text/plain'});
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `${diary.title}.txt`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
            
            // 导出全部按钮
            document.getElementById('export-all-btn').addEventListener('click', exportAllDiaries);
            
            // 颜色选择
            document.querySelectorAll('.color-option').forEach(option => {
                option.addEventListener('click', () => {
                    document.querySelector('.color-option.selected').classList.remove('selected');
                    option.classList.add('selected');
                });
            });
            
            // 编辑器和预览的实时同步
            diaryTitleInput.addEventListener('input', () => {
                previewTitle.textContent = diaryTitleInput.value || '无标题';
            });
            
            diaryContentInput.addEventListener('input', () => {
                previewText.textContent = diaryContentInput.value;
            });
            
            // 日期选择器变化事件
            datePicker.config.onChange.push((selectedDates) => {
                if (selectedDates.length > 0) {
                    previewDateText.textContent = formatDate(selectedDates[0]);
                }
            });
        });
    </script>
</body>
</html>
