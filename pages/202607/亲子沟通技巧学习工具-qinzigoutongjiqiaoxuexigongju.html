    // 应用状态
    const state = {
      currentTab: 'skills',
      favorites: [],
      recentViews: [],
      completedPractices: 0,
      journals: []
    };

    // 初始化应用
    function initializeApp() {
      loadState();
      renderSkills();
      renderCases();
      renderPractice();
      renderJournals();
      updateFavoritesList();
      updateRecentViewsList();
      updatePracticeCount();
      setupEventListeners();
    }

    // 加载状态
    function loadState() {
      // 加载收藏列表
      const savedFavorites = localStorage.getItem('favorites');
      if (savedFavorites) {
        state.favorites = JSON.parse(savedFavorites);
        // 更新技巧的收藏状态
        appData.skills.forEach(skill => {
          skill.isFavorite = state.favorites.includes(skill.id);
        });
      }

      // 加载最近浏览
      const savedRecentViews = localStorage.getItem('recentViews');
      if (savedRecentViews) {
        state.recentViews = JSON.parse(savedRecentViews);
      }

      // 加载已完成练习数
      const savedCompletedPractices = localStorage.getItem('completedPractices');
      if (savedCompletedPractices) {
        state.completedPractices = parseInt(savedCompletedPractices);
        // 更新练习的完成状态
        appData.practices.forEach(practice => {
          practice.isCompleted = JSON.parse(localStorage.getItem(`practice_${practice.id}_completed`) || 'false');
        });
      }

      // 加载沟通日志
      const savedJournals = localStorage.getItem('journals');
      if (savedJournals) {
        state.journals = JSON.parse(savedJournals);
      }
    }

    // 保存收藏
    function saveFavorites() {
      localStorage.setItem('favorites', JSON.stringify(state.favorites));
    }

    // 保存最近浏览
    function saveRecentViews() {
      localStorage.setItem('recentViews', JSON.stringify(state.recentViews));
    }

    // 保存已完成练习数
    function saveCompletedPractices() {
      localStorage.setItem('completedPractices', state.completedPractices.toString());
    }

    // 保存沟通日志
    function saveJournals() {
      localStorage.setItem('journals', JSON.stringify(state.journals));
    }

    // 渲染技巧卡片
    function renderSkills(filter = 'all', category = 'all') {
      let filteredSkills = appData.skills;
      
      // 应用收藏过滤
      if (filter === 'favorite') {
        filteredSkills = filteredSkills.filter(skill => skill.isFavorite);
      }
      
      // 应用分类过滤
      if (category !== 'all') {
        filteredSkills = filteredSkills.filter(skill => skill.category === category);
      }
      
      // 清空容器
      skillsContainer.innerHTML = '';
      
      // 渲染卡片
      filteredSkills.forEach(skill => {
        const skillCard = document.createElement('div');
        skillCard.className = 'bg-white rounded-xl shadow-sm overflow-hidden card-hover';
        skillCard.dataset.id = skill.id;
        
        skillCard.innerHTML = `
          <div class="relative">
            <div class="absolute top-3 right-3">
              <button class="favorite-btn text-2xl ${skill.isFavorite ? 'text-primary' : 'text-gray-300'} favorite-animation ${skill.isFavorite ? 'active' : ''}" aria-label="${skill.isFavorite ? '取消收藏此技巧' : '收藏此技巧'}">
                <i class="fa fa-star"></i>
              </button>
            </div>
            <div class="p-5">
              <span class="inline-block px-2 py-1 bg-primary/10 text-primary text-xs font-medium rounded-full mb-3">${skill.categoryName}</span>
              <h3 class="text-lg font-semibold mb-2">${skill.title}</h3>
              <p class="text-gray-600 mb-4">${skill.description}</p>
              <div class="skill-details hidden">
                <h4 class="font-medium mb-2 text-gray-700">操作步骤：</h4>
                <ul class="list-disc pl-5 space-y-1 text-gray-600">
                  ${skill.steps.map(step => `<li>${step}</li>`).join('')}
                </ul>
              </div>
              <button class="toggle-details text-primary font-medium flex items-center mt-2">
                <span class="details-text">查看详情</span>
                <i class="fa fa-chevron-down ml-1 details-icon"></i>
              </button>
            </div>
          </div>
        `;
        
        skillsContainer.appendChild(skillCard);
      });
      
      // 处理空状态
      if (filteredSkills.length === 0) {
        skillsContainer.innerHTML = `
          <div class="col-span-full text-center py-12 text-gray-500">
            <i class="fa fa-book text-3xl mb-2"></i>
            <p>${filter === 'favorite' ? '暂无收藏的技巧' : '暂无相关技巧'}</p>
          </div>
        `;
      }
      
      // 添加事件监听器
      attachSkillCardListeners();
    }

    // 渲染案例卡片
    function renderCases() {
      casesContainer.innerHTML = '';
      
      appData.cases.forEach(caseItem => {
        const caseCard = document.createElement('div');
        caseCard.className = 'bg-white rounded-xl shadow-sm overflow-hidden';
        caseCard.dataset.id = caseItem.id;
        
        caseCard.innerHTML = `
          <div class="p-5">
            <h3 class="text-lg font-semibold mb-4">${caseItem.title}</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="bg-gray-50 p-4 rounded-lg border-l-4 border-danger">
                <h4 class="text-sm font-medium text-danger mb-2">问题场景</h4>
                <p class="text-gray-700 text-sm">${caseItem.problem}</p>
              </div>
              <div class="bg-gray-50 p-4 rounded-lg border-l-4 border-success">
                <h4 class="text-sm font-medium text-success mb-2">改进方案</h4>
                <p class="text-gray-700 text-sm">${caseItem.solution}</p>
              </div>
            </div>
            <button class="view-case-detail w-full mt-4 py-2 border border-primary text-primary rounded-lg hover:bg-primary/5 transition-colors">
              查看完整案例
            </button>
          </div>
        `;
        
        casesContainer.appendChild(caseCard);
      });
      
      // 添加事件监听器
      document.querySelectorAll('.view-case-detail').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const caseId = parseInt(e.currentTarget.closest('[data-id]').dataset.id);
          showCaseDetail(caseId);
        });
      });
    }

    // 渲染互动练习
    function renderPractice() {
      practiceContainer.innerHTML = '';
      
      appData.practices.forEach(practice => {
        const practiceCard = document.createElement('div');
        practiceCard.className = 'bg-white rounded-xl shadow-sm overflow-hidden';
        practiceCard.dataset.id = practice.id;
        
        if (practice.isCompleted) {
          practiceCard.classList.add('border-2', 'border-success');
        }
        
        practiceCard.innerHTML = `
          <div class="p-5">
            ${practice.isCompleted ? '<span class="inline-block px-2 py-1 bg-success/10 text-success text-xs font-medium rounded-full mb-3"><i class="fa fa-check mr-1"></i>已完成</span>' : ''}
            <h3 class="text-lg font-semibold mb-4">模拟场景 ${practice.id}</h3>
            <div class="bg-gray-100 p-4 rounded-lg mb-4">
              <div class="flex items-start">
                <div class="w-8 h-8 bg-gray-300 rounded-full flex-shrink-0 flex items-center justify-center text-white">
                  <i class="fa fa-child"></i>
                </div>
                <div class="ml-3 bg-gray-200 rounded-lg rounded-tl-none p-3 max-w-full">
                  <p class="text-gray-700">${practice.scenario}</p>
                </div>
              </div>
            </div>
            <div class="space-y-3">
              ${practice.options.map((option, index) => `
                <button class="practice-option w-full text-left p-3 border rounded-lg hover:border-primary hover:bg-primary/5 transition-colors ${practice.isCompleted ? (option.isCorrect ? 'border-success bg-success/5' : 'border-gray-300 bg-gray-50') : ''}" data-option-index="${index}">
                  <div class="flex items-center">
                    <span class="w-6 h-6 rounded-full border ${practice.isCompleted ? (option.isCorrect ? 'bg-success text-white border-success' : 'border-gray-300') : 'border-gray-300'} flex items-center justify-center mr-3 flex-shrink-0">
                      ${practice.isCompleted ? (option.isCorrect ? '<i class="fa fa-check"></i>' : '') : (index + 1)}
                    </span>
                    <p class="text-gray-700">${option.text}</p>
                  </div>
                  ${practice.isCompleted ? `<div class="mt-2 ml-9 text-sm ${option.isCorrect ? 'text-success' : 'text-danger'}">${option.explanation}</div>` : ''}
                </button>
              `).join('')}
            </div>
          </div>
        `;
        
        practiceContainer.appendChild(practiceCard);
      });
      
      // 添加事件监听器
      document.querySelectorAll('.practice-option').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const practiceCard = e.currentTarget.closest('[data-id]');
          const practiceId = parseInt(practiceCard.dataset.id);
          const optionIndex = parseInt(e.currentTarget.dataset.optionIndex);
          
          const practice = appData.practices.find(p => p.id === practiceId);
          if (!practice.isCompleted) {
            handlePracticeOptionClick(practiceCard, practiceId, optionIndex);
          }
        });
      });
    }

    // 渲染沟通日志

      if (state.journals.length === 0) {
        journalList.innerHTML = `
          <div class="text-center py-8 text-gray-500">
            <i class="fa fa-calendar text-3xl mb-2"></i>
            <p>暂无日志记录，开始记录您的第一次亲子沟通吧！</p>
          </div>
        `;
        return;
      }
      
      journalList.innerHTML = '';
      
      // 按时间倒序排序
      const sortedJournals = [...state.journals].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      
      sortedJournals.forEach(journal => {
        const journalCard = document.createElement('div');

        journalCard.innerHTML = `
          <div class="p-5">
            <div class="flex justify-between items-start mb-3">
              <div>
                <span class="inline-block px-2 py-1 bg-primary/10 text-primary text-xs font-medium rounded-full mb-1">${journal.scene}</span>
                <p class="text-sm text-gray-500">${formattedDate}</p>
              </div>
              <button class="edit-journal text-gray-400 hover:text-primary transition-colors" aria-label="编辑日志">
                <i class="fa fa-pencil"></i>
              </button>
            </div>
            <p class="text-gray-700 mb-3 line-clamp-2">${journal.description}</p>
            <div class="flex flex-wrap gap-2">
              ${journal.improvements.map(imp => `
                <span class="px-2 py-1 bg-gray-100 text-gray-700 text-xs rounded-full">${imp}</span>
              `).join('')}
            </div>
          </div>
        `;
        
        journalList.appendChild(journalCard);
      });
      
      // 添加编辑事件监听
      document.querySelectorAll('.edit-journal').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const journalId = parseInt(e.currentTarget.closest('[data-id]').dataset.id);
          editJournal(journalId);
        });
      });
    }

    // 更新收藏列表
    function updateFavoritesList() {
      const favoriteSkills = appData.skills.filter(skill => skill.isFavorite);
      
      // 桌面端收藏列表
      if (favoriteSkills.length === 0) {
        favoritesList.innerHTML = `
          <div class="text-center py-4 text-gray-500 text-sm">
            <i class="fa fa-star-o mb-1"></i>
            <p>暂无收藏的技巧</p>
          </div>
        `;
      } else {
        favoritesList.innerHTML = favoriteSkills.map(skill => `
          <div class="favorite-item p-2 rounded-lg hover:bg-gray-50 transition-colors cursor-pointer flex items-center justify-between">
            <span class="text-sm">${skill.title}</span>
            <i class="fa fa-star text-primary"></i>
          </div>
        `).join('');
        
        // 添加点击事件
        document.querySelectorAll('.favorite-item').forEach(item => {
          item.addEventListener('click', (e) => {
            const title = e.currentTarget.querySelector('span').textContent;
            const skill = appData.skills.find(s => s.title === title);
            if (skill) {
              // 切换到技巧库标签
              switchTab('skills');
              // 滚动到对应卡片
              setTimeout(() => {
                const skillCard = document.querySelector(`[data-id="${skill.id}"]`);
                if (skillCard) {
                  skillCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                  // 高亮显示
                  skillCard.classList.add('ring-2', 'ring-primary');
                  setTimeout(() => {
                    skillCard.classList.remove('ring-2', 'ring-primary');
                  }, 2000);
                }
              }, 300);
            }
          });
        });
      }
      
      // 移动端收藏列表
      if (favoriteSkills.length === 0) {
        mobileFavoritesList.innerHTML = `
          <div class="text-center py-8 text-gray-500 text-sm">
            <i class="fa fa-star-o mb-2"></i>
            <p>暂无收藏的技巧</p>
          </div>
        `;
      } else {
        mobileFavoritesList.innerHTML = favoriteSkills.map(skill => `
          <div class="favorite-item p-3 rounded-lg border border-gray-100 hover:border-primary hover:bg-primary/5 transition-colors cursor-pointer">
            <div class="flex justify-between items-center">
              <span class="font-medium">${skill.title}</span>
              <i class="fa fa-star text-primary"></i>
            </div>
            <p class="text-xs text-gray-500 mt-1">${skill.categoryName}</p>
          </div>
        `).join('');
        
        // 添加点击事件
        document.querySelectorAll('#mobile-favorites-list .favorite-item').forEach(item => {
          item.addEventListener('click', (e) => {
            const title = e.currentTarget.querySelector('span').textContent;
            const skill = appData.skills.find(s => s.title === title);
            if (skill) {
              // 关闭收藏面板
              mobileFavoritesPanel.classList.add('hidden');
              // 切换到技巧库标签
              switchTab('skills');
              // 滚动到对应卡片
              setTimeout(() => {
                const skillCard = document.querySelector(`[data-id="${skill.id}"]`);
                if (skillCard) {
                  skillCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                  // 高亮显示
                  skillCard.classList.add('ring-2', 'ring-primary');
                  setTimeout(() => {
                    skillCard.classList.remove('ring-2', 'ring-primary');
                  }, 2000);
                }
              }, 300);
            }
          });
        });
      }
    }

    // 更新最近浏览列表
    function updateRecentViewsList() {
      if (state.recentViews.length === 0) {
        recentViewsList.innerHTML = `
          <div class="text-center py-4 text-gray-500 text-sm">
            <i class="fa fa-history mb-1"></i>
            <p>暂无浏览记录</p>
          </div>
        `;
      } else {
        recentViewsList.innerHTML = state.recentViews.map((view, index) => {
          const date = new Date(view.timestamp);
          const formattedDate = `${date.getMonth() + 1}/${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2, '0')}`;
          
          return `
            <div class="recent-item p-2 rounded-lg hover:bg-gray-50 transition-colors cursor-pointer flex items-center justify-between">
              <div class="flex-1 min-w-0">
                <span class="text-xs text-gray-500">${getTabName(view.tab)}</span>
                <p class="text-sm truncate">${view.title}</p>
              </div>
              <button class="delete-recent ml-2 text-gray-400 hover:text-danger transition-colors" data-index="${index}" aria-label="删除此浏览记录">
                <i class="fa fa-times"></i>
              </button>
            </div>
          `;
        }).join('');
        
        // 添加点击和删除事件
        document.querySelectorAll('.recent-item').forEach(item => {
          item.querySelector('div').addEventListener('click', (e) => {
            const title = e.currentTarget.querySelector('p').textContent;
            const tabName = e.currentTarget.querySelector('span').textContent;
            
            // 获取对应的标签
            let tabId;
            switch (tabName) {
              case '技巧库':
                tabId = 'skills';
                break;
              case '案例解析':
                tabId = 'cases';
                break;
              case '互动练习':
                tabId = 'practice';
                break;
              case '沟通日志':
                tabId = 'journal';
                break;
            }
            
            // 切换到对应标签
            switchTab(tabId);
          });
        });
        
        document.querySelectorAll('.delete-recent').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const index = parseInt(e.currentTarget.dataset.index);
            state.recentViews.splice(index, 1);
            saveRecentViews();
            updateRecentViewsList();
          });
        });
      }
    }

    // 更新已完成练习数
    function updatePracticeCount() {
      practiceCount.textContent = state.completedPractices;
      mobilePracticeCount.textContent = state.completedPractices;
    }

    // 获取标签名称
    function getTabName(tabId) {
      switch (tabId) {
        case 'skills':
          return '技巧库';
        case 'cases':
          return '案例解析';
        case 'practice':
          return '互动练习';
        case 'journal':
          return '沟通日志';
        default:
          return '';
      }
    }

    // 添加技巧卡片事件监听器
    function attachSkillCardListeners() {
      // 收藏按钮事件
      document.querySelectorAll('.favorite-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const skillCard = e.currentTarget.closest('[data-id]');
          const skillId = parseInt(skillCard.dataset.id);
          const skill = appData.skills.find(s => s.id === skillId);
          
          // 切换收藏状态
          skill.isFavorite = !skill.isFavorite;
          btn.classList.toggle('text-primary');
          btn.classList.toggle('text-gray-300');
          btn.classList.toggle('active');
          btn.setAttribute('aria-label', skill.isFavorite ? '取消收藏此技巧' : '收藏此技巧');
          
          // 更新收藏列表
          if (skill.isFavorite) {
            if (!state.favorites.includes(skillId)) {
              state.favorites.push(skillId);
            }
          } else {
            state.favorites = state.favorites.filter(id => id !== skillId);
          }
          
          saveFavorites();
          updateFavoritesList();
        });
      });
      
      // 查看详情按钮事件
      document.querySelectorAll('.toggle-details').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const skillCard = e.currentTarget.closest('[data-id]');
          const details = skillCard.querySelector('.skill-details');
          const detailsText = btn.querySelector('.details-text');
          const detailsIcon = btn.querySelector('.details-icon');
          
          // 切换详情显示
          details.classList.toggle('hidden');
          
          if (details.classList.contains('hidden')) {
            detailsText.textContent = '查看详情';
            detailsIcon.classList.remove('fa-chevron-up');
            detailsIcon.classList.add('fa-chevron-down');
          } else {
            detailsText.textContent = '收起详情';
            detailsIcon.classList.remove('fa-chevron-down');
            detailsIcon.classList.add('fa-chevron-up');
          }
        });
      });
      
      // 点击卡片添加到最近浏览
      document.querySelectorAll('#skills-container > div').forEach(card => {
        card.addEventListener('click', (e) => {
          // 如果点击的是按钮，不添加到最近浏览
          if (e.target.closest('button')) return;
          
          const skillId = parseInt(card.dataset.id);
          const skill = appData.skills.find(s => s.id === skillId);
          addToRecentViews('skills', skill.title);
        });
      });
    }

    // 添加到最近浏览
    function addToRecentViews(tab, title) {
      // 移除重复项
      state.recentViews = state.recentViews.filter(view => !(view.tab === tab && view.title === title));
      
      // 添加到开头
      state.recentViews.unshift({
        tab,
        title,
        timestamp: new Date().toISOString()
      });
      
      // 限制数量为5
      if (state.recentViews.length > 5) {
        state.recentViews = state.recentViews.slice(0, 5);
      }
      
      saveRecentViews();
      updateRecentViewsList();
    }

    // 切换标签
    function switchTab(tabId) {
      if (state.currentTab === tabId) return;
      
      // 更新当前标签
      state.currentTab = tabId;
      
      // 更新导航样式
      navTabs.forEach(tab => {
        if (tab.dataset.tab === tabId) {
          tab.classList.add('tab-active', 'text-primary');
          tab.classList.remove('text-gray-500', 'text-gray-600');
        } else {
          tab.classList.remove('tab-active', 'text-primary');
          tab.classList.add(tab.classList.contains('md:hidden') ? 'text-gray-500' : 'text-gray-600');
        }
      });
      
      // 更新内容显示
      tabContents.forEach(content => {
        content.classList.add('hidden');
      });
      document.getElementById(`${tabId}-section`).classList.remove('hidden');
      document.getElementById(`${tabId}-section`).classList.add('fade-in');
      
      // 添加到最近浏览
      if (tabId !== 'journal') { // 日志页面不需要添加到最近浏览
        addToRecentViews(tabId, getTabName(tabId));
      }
    }

    // 显示案例详情
    function showCaseDetail(caseId) {
      const caseItem = appData.cases.find(c => c.id === caseId);
      if (!caseItem) return;
      
      // 更新浮层内容
      caseDetailTitle.textContent = caseItem.title;
      caseDetailContent.innerHTML = `
        <div class="mb-4">
          <h4 class="text-sm font-medium text-gray-700 mb-2">背景</h4>
          <p class="text-gray-600">${caseItem.fullDescription.background}</p>
        </div>
        <div class="mb-4">
          <h4 class="text-sm font-medium text-danger mb-2">问题场景</h4>
          <div class="bg-gray-50 p-4 rounded-lg">
            <p class="text-gray-700">${caseItem.fullDescription.problemDetails}</p>
          </div>
        </div>
        <div class="mb-4">
          <h4 class="text-sm font-medium text-success mb-2">改进方案</h4>
          <div class="bg-gray-50 p-4 rounded-lg">
            <p class="text-gray-700">${caseItem.fullDescription.solutionDetails}</p>
          </div>
        </div>
        <div class="mb-4">
          <h4 class="text-sm font-medium text-gray-700 mb-2">结果</h4>
          <p class="text-gray-600">${caseItem.fullDescription.result}</p>
        </div>
        <div>
          <h4 class="text-sm font-medium text-gray-700 mb-2">关键要点</h4>
          <p class="text-gray-600">${caseItem.fullDescription.keyPoint}</p>
        </div>
        ${caseItem.relatedSkills.length > 0 ? `
          <div class="mt-4">
            <h4 class="text-sm font-medium text-gray-700 mb-2">相关技巧</h4>
            <div class="flex flex-wrap gap-2">
              ${caseItem.relatedSkills.map(skillId => {
                const skill = appData.skills.find(s => s.id === skillId);
                return `<span class="px-2 py-1 bg-primary/10 text-primary text-xs rounded-full">${skill?.title || ''}</span>`;
              }).join('')}
            </div>
          </div>
        ` : ''}
      `;
      
      // 显示浮层
      caseDetailModal.classList.remove('hidden');
      
      // 添加到最近浏览
      addToRecentViews('cases', caseItem.title);
    }

    // 处理练习选项点击
    function handlePracticeOptionClick(practiceCard, practiceId, optionIndex) {
      const practice = appData.practices.find(p => p.id === practiceId);
      const option = practice.options[optionIndex];
      
      // 更新练习状态
      practice.isCompleted = true;
      localStorage.setItem(`practice_${practiceId}_completed`, 'true');
      
      // 更新已完成练习数
      if (!JSON.parse(localStorage.getItem(`practice_${practiceId}_completed_before`) || 'false')) {
        state.completedPractices++;
        saveCompletedPractices();
        updatePracticeCount();
        localStorage.setItem(`practice_${practiceId}_completed_before`, 'true');
      }
      
      // 更新UI
      practiceCard.classList.add('border-2', 'border-success');
      
      // 更新所有选项样式
      const options = practiceCard.querySelectorAll('.practice-option');
      options.forEach((optBtn, index) => {
        const opt = practice.options[index];
        
        if (index === optionIndex) {
          // 当前选择的选项
          optBtn.classList.add(opt.isCorrect ? 'border-success' : 'border-danger');
          optBtn.classList.add(opt.isCorrect ? 'bg-success/5' : 'bg-danger/5');
        } else {
          // 其他选项
          optBtn.classList.add('border-gray-300', 'bg-gray-50', 'opacity-70');
        }
        
        // 添加解析
        let explanationDiv = optBtn.querySelector('.mt-2');
        if (!explanationDiv) {
          explanationDiv = document.createElement('div');
          explanationDiv.className = 'mt-2 ml-9 text-sm';
          optBtn.appendChild(explanationDiv);
        }
        explanationDiv.className = `mt-2 ml-9 text-sm ${opt.isCorrect ? 'text-success' : 'text-danger'}`;
        explanationDiv.textContent = opt.explanation;
        
        // 更新选项编号
        const optionNumber = optBtn.querySelector('span');
        optionNumber.className = `w-6 h-6 rounded-full border ${opt.isCorrect ? 'bg-success text-white border-success' : 'border-gray-300'} flex items-center justify-center mr-3 flex-shrink-0`;
        optionNumber.innerHTML = opt.isCorrect ? '<i class="fa fa-check"></i>' : '';
      });
      
      // 显示通知
      showNotification(option.isCorrect ? '回答正确！你掌握了有效的沟通方法。' : '回答可以改进，再看看正确的方式吧。');
    }

    // 显示通知
    function showNotification(message) {
      notificationText.textContent = message;
      notification.classList.remove('hidden');
      
      setTimeout(() => {
        notification.classList.add('hidden');
      }, 3000);
    }

    // 保存沟通日志
    function saveJournal() {
      const scene = document.getElementById('journal-scene').value;
      const description = document.getElementById('journal-description').value;
      const improvements = Array.from(document.querySelectorAll('.improvement-tag:checked')).map(checkbox => checkbox.value);
      
      // 验证表单
      if (!description.trim()) {
        showNotification('请填写问题描述');
        return;
      }
      
      // 创建新日志
      const newJournal = {
        id: Date.now(),
        scene,
        description: description.trim(),
        improvements: improvements.length > 0 ? improvements : ['其他'],
        timestamp: new Date().toISOString()
      };
      
      // 添加到日志列表
      state.journals.push(newJournal);
      saveJournals();
      
      // 清空表单
      document.getElementById('journal-scene').value = '写作业';
      document.getElementById('journal-description').value = '';
      document.querySelectorAll('.improvement-tag').forEach(checkbox => checkbox.checked = false);
      
      // 更新UI
      renderJournals();
      showNotification('日志保存成功！');
    }

    // 编辑沟通日志
    function editJournal(journalId) {
      const journal = state.journals.find(j => j.id === journalId);
      if (!journal) return;
      
      // 填充表单
      document.getElementById('journal-scene').value = journal.scene;
      document.getElementById('journal-description').value = journal.description;
      document.querySelectorAll('.improvement-tag').forEach(checkbox => {
        checkbox.checked = journal.improvements.includes(checkbox.value);
      });
      
      // 滚动到表单
      document.getElementById('journal-section').scrollIntoView({ behavior: 'smooth' });
      
      // 移除原日志
      state.journals = state.journals.filter(j => j.id !== journalId);
      saveJournals();
    }

    // 设置事件监听器
    function setupEventListeners() {
      // 标签切换事件
      navTabs.forEach(tab => {
        tab.addEventListener('click', () => {
          const tabId = tab.dataset.tab;
          switchTab(tabId);
        });
      });
      
      // 过滤器按钮事件
      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b => {
            b.classList.remove('bg-primary', 'text-white');
            b.classList.add('bg-white', 'border', 'border-gray-300');
          });
          btn.classList.remove('bg-white', 'border', 'border-gray-300');
          btn.classList.add('bg-primary', 'text-white');
          
          const filter = btn.id === 'filter-all' ? 'all' : 'favorite';
          const activeCategory = document.querySelector('.category-btn.bg-primary\/10');
          const category = activeCategory ? activeCategory.dataset.category : 'all';
          renderSkills(filter, category);
        });
      });
      
      // 分类按钮事件
      categoryBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          categoryBtns.forEach(b => {
            b.classList.remove('bg-primary/10', 'text-primary');
            b.classList.add('bg-white', 'border', 'border-gray-200');
          });
          btn.classList.remove('bg-white', 'border', 'border-gray-200');
          btn.classList.add('bg-primary/10', 'text-primary');
          
          const category = btn.dataset.category;
          const activeFilter = document.querySelector('.filter-btn.bg-primary');
          const filter = activeFilter ? (activeFilter.id === 'filter-all' ? 'all' : 'favorite') : 'all';
          renderSkills(filter, category);
        });
      });
      
      // 保存日志按钮事件
      saveJournalBtn.addEventListener('click', saveJournal);
      
      // 移动端收藏面板事件
      mobileFavoritesBtn.addEventListener('click', () => {
        mobileFavoritesPanel.classList.remove('hidden');
      });
      
      closeFavoritesBtn.addEventListener('click', () => {
        mobileFavoritesPanel.classList.add('hidden');
      });
      
      mobileFavoritesPanel.addEventListener('click', (e) => {
        if (e.target === mobileFavoritesPanel) {
          mobileFavoritesPanel.classList.add('hidden');
        }
      });
      
      // 案例详情浮层关闭事件
      closeCaseModal.addEventListener('click', () => {
        caseDetailModal.classList.add('hidden');
      });
      
      caseDetailModal.addEventListener('click', (e) => {
        if (e.target === caseDetailModal) {
          caseDetailModal.classList.add('hidden');
        }
      });
      
      // 阻止浮层内容点击事件冒泡
      caseDetailContent.addEventListener('click', (e) => {
        e.stopPropagation();
      });
      
      // ESC键关闭浮层
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          caseDetailModal.classList.add('hidden');
          mobileFavoritesPanel.classList.add('hidden');
        }
      });
    }

    // 初始化应用
    document.addEventListener('DOMContentLoaded', initializeApp);
  </script>
</body>
</html>
