<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海报设计工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
                    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
                    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script>
        // Tailwind 配置
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e40af',
                        secondary: '#3b82f6',
                        accent: '#0ea5e9',
                        neutral: '#f1f5f9',
                        'neutral-dark': '#334155',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                },
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .shadow-soft {
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            }
            .transition-smooth {
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .resize-handle {
                position: absolute;
                width: 10px;
                height: 10px;
                background-color: rgba(255, 255, 255, 0.7);
                border: 1px solid #333;
                display: none;
            }
            .resize-handle-tl {
                top: -5px;
                left: -5px;
                cursor: nw-resize;
            }
            .resize-handle-tr {
                top: -5px;
                right: -5px;
                cursor: ne-resize;
            }
            .resize-handle-bl {
                bottom: -5px;
                left: -5px;
                cursor: sw-resize;
            }
            .resize-handle-br {
                bottom: -5px;
                right: -5px;
                cursor: se-resize;
            }
            .text-element.active {
                outline: 2px dashed #3b82f6;
            }
            .text-element:hover .resize-handle {
                display: block;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-neutral-dark">
    <!-- 导航栏 -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="fa fa-line-chart text-primary text-2xl"></i>
                <h1 class="text-xl font-bold text-primary">海报设计工具</h1>
            </div>
            <div class="flex gap-3">
                <button id="export-btn" class="bg-primary hover:bg-primary/90 text-white py-2 px-4 rounded-md transition-smooth flex items-center gap-2">
                    <i class="fa fa-download"></i>
                    <span>导出海报</span>
                </button>
                <button id="reset-btn" class="bg-gray-200 hover:bg-gray-300 text-gray-700 py-2 px-4 rounded-md transition-smooth flex items-center gap-2">
                    <i class="fa fa-refresh"></i>
                    <span>重置</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="container mx-auto px-4 py-6 flex flex-col lg:flex-row gap-6">
        <!-- 左侧工具栏 -->
        <aside class="lg:w-1/4 bg-white rounded-lg shadow-soft p-4 h-fit sticky top-20">
            <h2 class="text-lg font-bold mb-4 pb-2 border-b border-gray-200 flex items-center gap-2">
                <i class="fa fa-sliders text-primary"></i>
                <span>设计工具</span>
            </h2>

            <!-- 海报格式选择 -->
            <div class="mb-6">
                <h3 class="font-semibold mb-2 text-gray-700">海报格式</h3>
                <div class="grid grid-cols-2 gap-2" id="format-options">
                    <button data-width="1080" data-height="1080" class="format-btn bg-gray-100 hover:bg-gray-200 py-2 px-3 rounded-md transition-smooth text-sm font-medium active">
                        正方形
                        <span class="text-xs text-gray-500 block mt-1">1:1 (社交媒体)</span>
                    </button>
                    <button data-width="1080" data-height="1920" class="format-btn bg-gray-100 hover:bg-gray-200 py-2 px-3 rounded-md transition-smooth text-sm font-medium">
                        竖版
                        <span class="text-xs text-gray-500 block mt-1">9:16 (小红书)</span>
                    </button>
                    <button data-width="1920" data-height="1080" class="format-btn bg-gray-100 hover:bg-gray-200 py-2 px-3 rounded-md transition-smooth text-sm font-medium">
                        横版
                        <span class="text-xs text-gray-500 block mt-1">16:9 (网站)</span>
                    </button>
                    <button data-width="800" data-height="1200" class="format-btn bg-gray-100 hover:bg-gray-200 py-2 px-3 rounded-md transition-smooth text-sm font-medium">
                        长图
                        <span class="text-xs text-gray-500 block mt-1">2:3 (公众号)</span>
                    </button>
                </div>
            </div>

            <!-- 渐变颜色选择 -->
            <div class="mb-6">
                <h3 class="font-semibold mb-2 text-gray-700">渐变颜色</h3>
                <div class="flex gap-2 mb-2">
                    <div class="flex-1">
                        <label class="text-xs text-gray-500 block mb-1">起始颜色</label>
                        <input type="color" id="gradient-color1" value="#1e40af" class="w-full h-8 rounded-md cursor-pointer">
                    </div>
                    <div class="flex-1">
                        <label class="text-xs text-gray-500 block mb-1">结束颜色</label>
                        <input type="color" id="gradient-color2" value="#3b82f6" class="w-full h-8 rounded-md cursor-pointer">
                    </div>
                </div>
                <div class="w-full h-10 rounded-md mt-2" id="gradient-preview" style="background: linear-gradient(to bottom right, #1e40af, #3b82f6);"></div>
            </div>

            <!-- 水印设置 -->
            <div class="mb-6">
                <h3 class="font-semibold mb-2 text-gray-700">水印设置</h3>
                <div class="flex gap-2 mb-3">
                    <button id="watermark-text-btn" class="flex-1 bg-primary text-white py-2 px-3 rounded-md transition-smooth text-sm">文字水印</button>
                    <button id="watermark-image-btn" class="flex-1 bg-gray-100 hover:bg-gray-200 py-2 px-3 rounded-md transition-smooth text-sm">图片水印</button>
                </div>
                
                <!-- 文字水印选项 -->
                <div id="text-watermark-options" class="space-y-3">
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">水印文字</label>
                        <input type="text" id="watermark-text" placeholder="输入水印文字" value="水印" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-primary/50">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">文字颜色</label>
                        <input type="color" id="watermark-text-color" value="#ffffff" class="w-full h-8 rounded-md cursor-pointer">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">透明度</label>
                        <input type="range" id="watermark-opacity" min="10" max="100" value="30" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">位置</label>
                        <div class="grid grid-cols-3 gap-1">
                            <button class="watermark-position-btn py-1 px-2 bg-gray-100 hover:bg-gray-200 rounded text-xs" data-position="top-left">左上</button>
                            <button class="watermark-position-btn py-1 px-2 bg-gray-100 hover:bg-gray-200 rounded text-xs active" data-position="center">居中</button>
                            <button class="watermark-position-btn py-1 px-2 bg-gray-100 hover:bg-gray-200 rounded text-xs" data-position="top-right">右上</button>
                            <button class="watermark-position-btn py-1 px-2 bg-gray-100 hover:bg-gray-200 rounded text-xs" data-position="middle-left">左中</button>
                            <button class="watermark-position-btn py-1 px-2 bg-gray-100 hover:bg-gray-200 rounded text-xs" data-position="middle-right">右中</button>
                            <button class="watermark-position-btn py-1 px-2 bg-gray-100 hover:bg-gray-200 rounded text-xs" data-position="bottom-left">左下</button>
                            <button class="watermark-position-btn py-1 px-2 bg-gray-100 hover:bg-gray-200 rounded text-xs" data-position="bottom-center">中下</button>
                            <button class="watermark-position-btn py-1 px-2 bg-gray-100 hover:bg-gray-200 rounded text-xs" data-position="bottom-right">右下</button>
                        </div>
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">大小</label>
                        <input type="range" id="watermark-size" min="12" max="48" value="24" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                    </div>
                </div>
                
                <!-- 图片水印选项 -->
                <div id="image-watermark-options" class="hidden space-y-3">
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">上传图片</label>
                        <input type="file" id="watermark-image" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-medium file:bg-primary file:text-white hover:file:bg-primary/90">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">透明度</label>
                        <input type="range" id="watermark-image-opacity" min="10" max="100" value="50" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">位置</label>
                        <div class="grid grid-cols-3 gap-1">
                            <button class="watermark-image-position-btn py-1 px-2 bg-gray-100 hover:bg-gray-200 rounded text-xs" data-position="top-left">左上</button>
                            <button class="watermark-image-position-btn py-1 px-2 bg-gray-100 hover:bg-gray-200 rounded text-xs active" data-position="center">居中</button>
                            <button class="watermark-image-position-btn py-1 px-2 bg-gray-100 hover:bg-gray-200 rounded text-xs" data-position="top-right">右上</button>
                            <button class="watermark-image-position-btn py-1 px-2 bg-gray-100 hover:bg-gray-200 rounded text-xs" data-position="middle-left">左中</button>
                            <button class="watermark-image-position-btn py-1 px-2 bg-gray-100 hover:bg-gray-200 rounded text-xs" data-position="middle-right">右中</button>
                            <button class="watermark-image-position-btn py-1 px-2 bg-gray-100 hover:bg-gray-200 rounded text-xs" data-position="bottom-left">左下</button>
                            <button class="watermark-image-position-btn py-1 px-2 bg-gray-100 hover:bg-gray-200 rounded text-xs" data-position="bottom-center">中下</button>
                            <button class="watermark-image-position-btn py-1 px-2 bg-gray-100 hover:bg-gray-200 rounded text-xs" data-position="bottom-right">右下</button>
                        </div>
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">大小</label>
                        <input type="range" id="watermark-image-size" min="20" max="200" value="100" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                    </div>
                </div>
            </div>

            <!-- 添加文字按钮 -->
            <div>
                <button id="add-text-btn" class="w-full bg-accent hover:bg-accent/90 text-white py-2 px-3 rounded-md transition-smooth flex items-center justify-center gap-2">
                    <i class="fa fa-font"></i>
                    <span>添加文字</span>
                </button>
            </div>
        </aside>

        <!-- 右侧预览区 -->
        <div class="lg:w-3/4 flex justify-center">
            <div class="relative bg-white rounded-lg shadow-soft p-4 w-full max-w-2xl">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-gray-700">海报预览</h2>
                    <div class="text-sm text-gray-500" id="canvas-size-info">尺寸: 1080 × 1080 px</div>
                </div>
                
                <!-- 画布区域 -->
                <div class="flex justify-center">
                    <div id="poster-canvas" class="relative border border-gray-300 rounded-lg overflow-hidden" style="width: 100%; max-width: 540px; height: 540px; background: linear-gradient(to bottom right, #1e40af, #3b82f6);">
                        <!-- 水印层 -->
                        <div id="watermark-layer" class="absolute inset-0">
                            <div id="text-watermark" class="absolute inset-0 flex items-center justify-center text-white/30 text-2xl pointer-events-none">水印</div>
                            <div id="image-watermark" class="absolute hidden cursor-move"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 文字编辑模态框 -->
    <div id="text-editor-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg shadow-xl p-5 w-full max-w-md">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-700">编辑文字</h3>
                <button id="close-modal-btn" class="text-gray-500 hover:text-gray-700">
                    <i class="fa fa-times text-xl"></i>
                </button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">文字内容</label>
                    <textarea id="text-content-input" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50" rows="3"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">文字颜色</label>
                        <input type="color" id="text-color-input" class="w-full h-10 rounded-md cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">字体大小</label>
                        <input type="number" id="text-size-input" min="8" max="120" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">字体选择</label>
                        <select id="text-font-input" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50">
                            <option value="sans-serif">默认字体</option>
                            <option value="serif">衬线字体</option>
                            <option value="monospace">等宽字体</option>
                            <option value="'Microsoft YaHei'">微软雅黑</option>
                            <option value="'SimSun'">宋体</option>
                            <option value="'SimHei'">黑体</option>
                            <option value="'KaiTi'">楷体</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">字体粗细</label>
                        <select id="text-weight-input" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50">
                            <option value="normal">正常</option>
                            <option value="bold">粗体</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">文字对齐</label>
                        <select id="text-align-input" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50">
                            <option value="center">居中</option>
                            <option value="left">左对齐</option>
                            <option value="right">右对齐</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="mt-6 flex gap-3 justify-end">
                <button id="delete-text-btn" class="bg-red-500 hover:bg-red-600 text-white py-2 px-4 rounded-md transition-smooth">删除文字</button>
                <button id="save-text-btn" class="bg-primary hover:bg-primary/90 text-white py-2 px-4 rounded-md transition-smooth">保存</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const canvas = document.getElementById('poster-canvas');
            const gradientColor1 = document.getElementById('gradient-color1');
            const gradientColor2 = document.getElementById('gradient-color2');
            const gradientPreview = document.getElementById('gradient-preview');
            const formatOptions = document.querySelectorAll('.format-btn');
            const canvasSizeInfo = document.getElementById('canvas-size-info');
            const textElements = document.querySelectorAll('.text-element');
            const textEditorModal = document.getElementById('text-editor-modal');
            const textContentInput = document.getElementById('text-content-input');
            const textColorInput = document.getElementById('text-color-input');
            const textSizeInput = document.getElementById('text-size-input');
            const textWeightInput = document.getElementById('text-weight-input');
            const textAlignInput = document.getElementById('text-align-input');
            const textFontInput = document.getElementById('text-font-input');
            const closeModalBtn = document.getElementById('close-modal-btn');
            const saveTextBtn = document.getElementById('save-text-btn');
            const deleteTextBtn = document.getElementById('delete-text-btn');
            const addTextBtn = document.getElementById('add-text-btn');
            const exportBtn = document.getElementById('export-btn');
            const resetBtn = document.getElementById('reset-btn');
            const watermarkTextBtn = document.getElementById('watermark-text-btn');
            const watermarkImageBtn = document.getElementById('watermark-image-btn');
            const textWatermarkOptions = document.getElementById('text-watermark-options');
            const imageWatermarkOptions = document.getElementById('image-watermark-options');
            const watermarkText = document.getElementById('text-watermark');
            const imageWatermark = document.getElementById('image-watermark');
            const watermarkTextInput = document.getElementById('watermark-text');
            const watermarkTextColor = document.getElementById('watermark-text-color');
            const watermarkOpacity = document.getElementById('watermark-opacity');
            const watermarkSize = document.getElementById('watermark-size');
            const watermarkPositionBtns = document.querySelectorAll('.watermark-position-btn');
            const watermarkImageFile = document.getElementById('watermark-image');
            const watermarkImageOpacity = document.getElementById('watermark-image-opacity');
            const watermarkImageSize = document.getElementById('watermark-image-size');
            const watermarkImagePositionBtns = document.querySelectorAll('.watermark-image-position-btn');

            // 当前选中的文字元素
            let currentTextElement = null;
            let currentCanvasWidth = 1080;
            let currentCanvasHeight = 1080;

            // 更新渐变预览
            function updateGradient() {
                const gradient = `linear-gradient(to bottom right, ${gradientColor1.value}, ${gradientColor2.value})`;
                gradientPreview.style.background = gradient;
                canvas.style.background = gradient;
            }

            // 绑定渐变颜色选择事件
            gradientColor1.addEventListener('input', updateGradient);
            gradientColor2.addEventListener('input', updateGradient);

            // 选择海报格式
            formatOptions.forEach(btn => {
                btn.addEventListener('click', function() {
                    formatOptions.forEach(b => b.classList.remove('active', 'bg-primary/10', 'text-primary'));
                    btn.classList.add('active', 'bg-primary/10', 'text-primary');
                    
                    const width = parseInt(this.dataset.width);
                    const height = parseInt(this.dataset.height);
                    currentCanvasWidth = width;
                    currentCanvasHeight = height;
                    
                    // 更新画布尺寸显示
                    canvasSizeInfo.textContent = `尺寸: ${width} × ${height} px`;
                    
                    // 计算画布在预览区的尺寸比例
                    const maxPreviewSize = 540;
                    let newWidth, newHeight;
                    
                    if (width > height) {
                        // 横版
                        newWidth = maxPreviewSize;
                        newHeight = (height / width) * maxPreviewSize;
                    } else {
                        // 竖版或正方形
                        newHeight = maxPreviewSize;
                        newWidth = (width / height) * maxPreviewSize;
                    }
                    
                    canvas.style.width = `${newWidth}px`;
                    canvas.style.height = `${newHeight}px`;
                });
            });

            // 打开文字编辑模态框
            function openTextEditor(element) {
                currentTextElement = element;
                
                // 填充当前文字属性
                textContentInput.value = element.textContent.trim();
                textColorInput.value = getComputedStyle(element).color;
                textSizeInput.value = parseInt(getComputedStyle(element).fontSize);
                textWeightInput.value = getComputedStyle(element).fontWeight === 'bold' ? 'bold' : 'normal';
                textAlignInput.value = getComputedStyle(element).textAlign;
                
                // 设置字体
                const fontFamily = getComputedStyle(element).fontFamily;
                textFontInput.value = fontFamily.includes('Microsoft YaHei') ? 'Microsoft YaHei' : 
                                    fontFamily.includes('SimSun') ? 'SimSun' : 
                                    fontFamily.includes('SimHei') ? 'SimHei' : 
                                    fontFamily.includes('KaiTi') ? 'KaiTi' : 
                                    fontFamily.includes('monospace') ? 'monospace' : 
                                    fontFamily.includes('serif') ? 'serif' : 'sans-serif';
                
                // 显示模态框
                textEditorModal.classList.remove('hidden');
            }

            // 关闭文字编辑模态框
            function closeTextEditor() {
                textEditorModal.classList.add('hidden');
                currentTextElement = null;
            }

            // 保存文字编辑
            function saveTextEditor() {
                if (currentTextElement) {
                    currentTextElement.textContent = textContentInput.value;
                    currentTextElement.style.color = textColorInput.value;
                    currentTextElement.style.fontSize = `${textSizeInput.value}px`;
                    currentTextElement.style.fontWeight = textWeightInput.value;
                    currentTextElement.style.textAlign = textAlignInput.value;
                    currentTextElement.style.fontFamily = textFontInput.value;
                    closeTextEditor();
                }
            }

            // 删除文字元素
            function deleteTextElement() {
                if (currentTextElement) {
                    currentTextElement.remove();
                    closeTextEditor();
                }
            }

            // 添加新文字元素
            function addNewTextElement() {
                const newText = document.createElement('div');
                newText.className = 'text-element absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-white text-xl font-medium text-center cursor-move p-2';
                newText.draggable = true;
                newText.innerHTML = '点击编辑文字<br><div class="resize-handle resize-handle-tl"></div><div class="resize-handle resize-handle-tr"></div><div class="resize-handle resize-handle-bl"></div><div class="resize-handle resize-handle-br"></div>';
                
                // 添加拖拽功能
                setupDraggable(newText);
                
                // 添加双击编辑功能
                newText.addEventListener('dblclick', function() {
                    openTextEditor(this);
                });
                
                canvas.appendChild(newText);
            }

            // 设置拖拽功能
            function setupDraggable(element) {
                let isDragging = false;
                let offsetX, offsetY;
                
                element.addEventListener('mousedown', function(e) {
                    if (e.target.classList.contains('resize-handle')) {
                        return; // 调整大小的手柄不触发拖拽
                    }
                    
                    isDragging = true;
                    const rect = this.getBoundingClientRect();
                    const canvasRect = canvas.getBoundingClientRect();
                    
                    offsetX = e.clientX - rect.left;
                    offsetY = e.clientY - rect.top;
                    
                    // 移除其他元素的选中状态
                    document.querySelectorAll('.text-element').forEach(el => el.classList.remove('active'));
                    this.classList.add('active');
                    
                    // 提高当前元素的层级
                    this.style.zIndex = 10;
                    
                    // 阻止文本选择
                    e.preventDefault();
                });
                
                document.addEventListener('mousemove', function(e) {
                    if (!isDragging) return;
                    
                    const canvasRect = canvas.getBoundingClientRect();
                    const left = e.clientX - canvasRect.left - offsetX;
                    const top = e.clientY - canvasRect.top - offsetY;
                    
                    // 限制在画布内
                    const maxLeft = canvasRect.width - element.offsetWidth;
                    const maxTop = canvasRect.height - element.offsetHeight;
                    
                    element.style.left = `${Math.max(0, Math.min(left, maxLeft))}px`;
                    element.style.top = `${Math.max(0, Math.min(top, maxTop))}px`;
                    element.style.transform = 'none'; // 清除初始的transform
                });
                
                document.addEventListener('mouseup', function() {
                    isDragging = false;
                });
            }

            // 为现有的文字元素添加事件监听
            function setupTextElements() {
                const textElements = document.querySelectorAll('.text-element');
                textElements.forEach(element => {
                    // 确保元素有正确的类和属性
                    element.classList.add('cursor-move');
                    element.setAttribute('draggable', 'true');
                    
                    // 移除旧的事件监听器并重新添加
                    const newElement = element.cloneNode(true);
                    element.parentNode.replaceChild(newElement, element);
                    
                    // 为新元素添加事件监听
                    setupDraggable(newElement);
                    setupResizable(newElement);
                    
                    newElement.addEventListener('dblclick', function() {
                        openTextEditor(this);
                    });
                });
            }
            
            // 注意：不再需要为初始文字元素添加功能，因为初始文字已被删除
            // 当用户通过"添加文字"按钮添加新文字时，会自动为新文字添加所有必要的功能

            // 设置文字大小调整功能
            function setupResizable(element) {
                const handles = element.querySelectorAll('.resize-handle');
                let currentHandle = null;
                let startX, startY, startWidth, startHeight;
                
                handles.forEach(handle => {
                    handle.addEventListener('mousedown', function(e) {
                        currentHandle = this;
                        startX = e.clientX;
                        startY = e.clientY;
                        startWidth = element.offsetWidth;
                        startHeight = element.offsetHeight;
                        
                        // 防止拖拽
                        e.stopPropagation();
                        e.preventDefault();
                    });
                });
                
                document.addEventListener('mousemove', function(e) {
                    if (!currentHandle) return;
                    
                    const dx = e.clientX - startX;
                    const dy = e.clientY - startY;
                    let newWidth = startWidth;
                    let newHeight = startHeight;
                    let newLeft = element.offsetLeft;
                    let newTop = element.offsetTop;
                    
                    if (currentHandle.classList.contains('resize-handle-br')) {
                        newWidth = startWidth + dx;
                        newHeight = startHeight + dy;
                    } else if (currentHandle.classList.contains('resize-handle-tr')) {
                        newWidth = startWidth + dx;
                        newHeight = startHeight - dy;
                        newTop = element.offsetTop + dy;
                    } else if (currentHandle.classList.contains('resize-handle-bl')) {
                        newWidth = startWidth - dx;
                        newHeight = startHeight + dy;
                        newLeft = element.offsetLeft + dx;
                    } else if (currentHandle.classList.contains('resize-handle-tl')) {
                        newWidth = startWidth - dx;
                        newHeight = startHeight - dy;
                        newLeft = element.offsetLeft + dx;
                        newTop = element.offsetTop + dy;
                    }
                    
                    // 限制最小尺寸
                    if (newWidth < 50) newWidth = 50;
                    if (newHeight < 20) newHeight = 20;
                    
                    element.style.width = `${newWidth}px`;
                    element.style.height = `${newHeight}px`;
                    element.style.left = `${newLeft}px`;
                    element.style.top = `${newTop}px`;
                    element.style.transform = 'none'; // 清除初始的transform
                });
                
                document.addEventListener('mouseup', function() {
                    currentHandle = null;
                });
            }

            // 添加新文字元素
            function addNewTextElement() {
                const newText = document.createElement('div');
                newText.className = 'text-element absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-white text-xl font-medium text-center cursor-move p-2';
                newText.draggable = true;
                newText.innerHTML = '点击编辑文字<br><div class="resize-handle resize-handle-tl"></div><div class="resize-handle resize-handle-tr"></div><div class="resize-handle resize-handle-bl"></div><div class="resize-handle resize-handle-br"></div>';
                
                canvas.appendChild(newText);
                
                // 为新元素添加功能
                setupDraggable(newText);
                setupResizable(newText);
                
                newText.addEventListener('dblclick', function() {
                    openTextEditor(this);
                });
            }

            // 水印设置
            watermarkTextBtn.addEventListener('click', function() {
                watermarkTextBtn.classList.add('bg-primary', 'text-white');
                watermarkTextBtn.classList.remove('bg-gray-100', 'hover:bg-gray-200');
                watermarkImageBtn.classList.add('bg-gray-100', 'hover:bg-gray-200');
                watermarkImageBtn.classList.remove('bg-primary', 'text-white');
                textWatermarkOptions.classList.remove('hidden');
                imageWatermarkOptions.classList.add('hidden');
                watermarkText.classList.remove('hidden');
                imageWatermark.classList.add('hidden');
            });

            watermarkImageBtn.addEventListener('click', function() {
                watermarkImageBtn.classList.add('bg-primary', 'text-white');
                watermarkImageBtn.classList.remove('bg-gray-100', 'hover:bg-gray-200');
                watermarkTextBtn.classList.add('bg-gray-100', 'hover:bg-gray-200');
                watermarkTextBtn.classList.remove('bg-primary', 'text-white');
                imageWatermarkOptions.classList.remove('hidden');
                textWatermarkOptions.classList.add('hidden');
                imageWatermark.classList.remove('hidden');
                watermarkText.classList.add('hidden');
            });

            // 文字水印设置
            watermarkTextInput.addEventListener('input', function() {
                watermarkText.textContent = this.value;
            });

            watermarkTextColor.addEventListener('input', function() {
                const opacity = watermarkOpacity.value / 100;
                const color = this.value;
                // 将HEX颜色转换为带透明度的RGBA
                const r = parseInt(color.slice(1, 3), 16);
                const g = parseInt(color.slice(3, 5), 16);
                const b = parseInt(color.slice(5, 7), 16);
                watermarkText.style.color = `rgba(${r}, ${g}, ${b}, ${opacity})`;
            });

            watermarkOpacity.addEventListener('input', function() {
                const opacity = this.value / 100;
                const color = watermarkTextColor.value;
                // 将HEX颜色转换为带透明度的RGBA
                const r = parseInt(color.slice(1, 3), 16);
                const g = parseInt(color.slice(3, 5), 16);
                const b = parseInt(color.slice(5, 7), 16);
                watermarkText.style.color = `rgba(${r}, ${g}, ${b}, ${opacity})`;
            });

            watermarkSize.addEventListener('input', function() {
                watermarkText.style.fontSize = `${this.value}px`;
            });

            // 文字水印位置
            watermarkPositionBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    watermarkPositionBtns.forEach(b => b.classList.remove('active', 'bg-primary/10', 'text-primary'));
                    btn.classList.add('active', 'bg-primary/10', 'text-primary');
                    
                    const position = this.dataset.position;
                    
                    // 重置所有定位属性
                    watermarkText.style.display = 'flex';
                    watermarkText.style.justifyContent = 'center';
                    watermarkText.style.alignItems = 'center';
                    
                    switch(position) {
                        case 'top-left':
                            watermarkText.style.justifyContent = 'flex-start';
                            watermarkText.style.alignItems = 'flex-start';
                            break;
                        case 'top-right':
                            watermarkText.style.justifyContent = 'flex-end';
                            watermarkText.style.alignItems = 'flex-start';
                            break;
                        case 'bottom-left':
                            watermarkText.style.justifyContent = 'flex-start';
                            watermarkText.style.alignItems = 'flex-end';
                            break;
                        case 'bottom-right':
                            watermarkText.style.justifyContent = 'flex-end';
                            watermarkText.style.alignItems = 'flex-end';
                            break;
                        case 'middle-left':
                            watermarkText.style.justifyContent = 'flex-start';
                            break;
                        case 'middle-right':
                            watermarkText.style.justifyContent = 'flex-end';
                            break;
                        case 'bottom-center':
                            watermarkText.style.alignItems = 'flex-end';
                            break;
                        default: // center
                            // 默认就是居中
                            break;
                    }
                });
            });

            // 图片水印设置
            watermarkImageFile.addEventListener('change', function(e) {
                if (e.target.files && e.target.files[0]) {
                    const reader = new FileReader();
                    
                    reader.onload = function(event) {
                        imageWatermark.innerHTML = `<img src="${event.target.result}" alt="水印">`;
                    }
                    
                    reader.readAsDataURL(e.target.files[0]);
                }
            });

            watermarkImageOpacity.addEventListener('input', function() {
                const opacity = this.value / 100;
                imageWatermark.style.opacity = opacity;
            });

            watermarkImageSize.addEventListener('input', function() {
                const img = imageWatermark.querySelector('img');
                if (img) {
                    img.style.width = `${this.value}px`;
                    img.style.height = 'auto';
                }
            });

            // 图片水印位置
            watermarkImagePositionBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    watermarkImagePositionBtns.forEach(b => b.classList.remove('active', 'bg-primary/10', 'text-primary'));
                    btn.classList.add('active', 'bg-primary/10', 'text-primary');
                    
                    const position = this.dataset.position;
                    
                    // 重置所有定位属性
                    imageWatermark.style.display = 'flex';
                    imageWatermark.style.justifyContent = 'center';
                    imageWatermark.style.alignItems = 'center';
                    
                    switch(position) {
                        case 'top-left':
                            imageWatermark.style.justifyContent = 'flex-start';
                            imageWatermark.style.alignItems = 'flex-start';
                            break;
                        case 'top-right':
                            imageWatermark.style.justifyContent = 'flex-end';
                            imageWatermark.style.alignItems = 'flex-start';
                            break;
                        case 'bottom-left':
                            imageWatermark.style.justifyContent = 'flex-start';
                            imageWatermark.style.alignItems = 'flex-end';
                            break;
                        case 'bottom-right':
                            imageWatermark.style.justifyContent = 'flex-end';
                            imageWatermark.style.alignItems = 'flex-end';
                            break;
                        case 'middle-left':
                            imageWatermark.style.justifyContent = 'flex-start';
                            break;
                        case 'middle-right':
                            imageWatermark.style.justifyContent = 'flex-end';
                            break;
                        case 'bottom-center':
                            imageWatermark.style.alignItems = 'flex-end';
                            break;
                        default: // center
                            // 默认就是居中
                            break;
                    }
                });
            });

            // 导出海报功能
            exportBtn.addEventListener('click', function() {
                // 创建一个临时的canvas元素，用于以实际尺寸渲染海报
                const tempCanvas = document.createElement('canvas');
                const ctx = tempCanvas.getContext('2d');
                
                // 设置画布尺寸为实际海报尺寸
                tempCanvas.width = currentCanvasWidth;
                tempCanvas.height = currentCanvasHeight;
                
                // 显示加载提示
                const originalText = exportBtn.querySelector('span').textContent;
                exportBtn.querySelector('span').textContent = '正在导出...';
                exportBtn.disabled = true;
                
                // 使用html2canvas将海报转换为图片
                html2canvas(canvas, {
                    scale: 2, // 提高清晰度
                    useCORS: true,
                    logging: false,
                    backgroundColor: null
                }).then(canvasImage => {
                    // 创建一个新的图片对象来调整尺寸
                    const img = new Image();
                    img.onload = function() {
                        // 在临时画布上绘制调整后的图片
                        ctx.drawImage(img, 0, 0, tempCanvas.width, tempCanvas.height);
                        
                        // 生成下载链接
                        const link = document.createElement('a');
                        link.download = 'poster.png';
                        link.href = tempCanvas.toDataURL('image/png');
                        link.click();
                        
                        // 恢复按钮状态
                        exportBtn.querySelector('span').textContent = originalText;
                        exportBtn.disabled = false;
                    };
                    img.src = canvasImage.toDataURL('image/png');
                }).catch(error => {
                    console.error('导出失败:', error);
                    alert('导出失败，请重试');
                    exportBtn.querySelector('span').textContent = originalText;
                    exportBtn.disabled = false;
                });
            });

            // 重置功能
            resetBtn.addEventListener('click', function() {
                if (confirm('确定要重置所有设置吗？这将清除所有自定义内容。')) {
                    // 刷新页面以重置所有设置
                    location.reload();
                }
            });

            // 绑定模态框事件
            closeModalBtn.addEventListener('click', closeTextEditor);
            saveTextBtn.addEventListener('click', saveTextEditor);
            deleteTextBtn.addEventListener('click', deleteTextElement);
            addTextBtn.addEventListener('click', addNewTextElement);

            // 点击模态框外部关闭模态框
            textEditorModal.addEventListener('click', function(e) {
                if (e.target === textEditorModal) {
                    closeTextEditor();
                }
            });

            // 设置图片水印拖拽功能
            function setupWatermarkDraggable(element) {
                let isDragging = false;
                let offsetX, offsetY;
                
                element.addEventListener('mousedown', function(e) {
                    isDragging = true;
                    const rect = this.getBoundingClientRect();
                    const canvasRect = canvas.getBoundingClientRect();
                    
                    offsetX = e.clientX - rect.left;
                    offsetY = e.clientY - rect.top;
                    
                    // 提高当前元素的层级
                    this.style.zIndex = 10;
                    
                    // 阻止文本选择
                    e.preventDefault();
                });
                
                document.addEventListener('mousemove', function(e) {
                    if (!isDragging || !element.contains(e.target)) return;
                    
                    const canvasRect = canvas.getBoundingClientRect();
                    const left = e.clientX - canvasRect.left - offsetX;
                    const top = e.clientY - canvasRect.top - offsetY;
                    
                    // 限制在画布内
                    const maxLeft = canvasRect.width - element.offsetWidth;
                    const maxTop = canvasRect.height - element.offsetHeight;
                    
                    element.style.left = `${Math.max(0, Math.min(left, maxLeft))}px`;
                    element.style.top = `${Math.max(0, Math.min(top, maxTop))}px`;
                    element.style.transform = 'none'; // 清除初始的transform
                    element.style.justifyContent = 'flex-start';
                    element.style.alignItems = 'flex-start';
                });
                
                document.addEventListener('mouseup', function() {
                    isDragging = false;
                });
            }

            // 为图片水印添加拖拽功能
            setupWatermarkDraggable(imageWatermark);

            // 图片水印文件上传后重新设置拖拽
            watermarkImageFile.addEventListener('change', function(e) {
                if (e.target.files && e.target.files[0]) {
                    const reader = new FileReader();
                    
                    reader.onload = function(event) {
                        imageWatermark.innerHTML = `<img src="${event.target.result}" alt="水印">`;
                        // 重新设置拖拽功能
                        setupWatermarkDraggable(imageWatermark);
                    }
                    
                    reader.readAsDataURL(e.target.files[0]);
                }
            });

            // 初始化
            updateGradient();
        });
    </script>
</body>
</html>
