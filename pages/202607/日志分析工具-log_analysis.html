<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日志分析工具</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            margin-top: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.8rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            background: linear-gradient(45deg, #3498db, #2c3e50);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .description {
            color: #5a6c7d;
            font-size: 1.2rem;
            line-height: 1.6;
            font-weight: 500;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .main-content {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
        }
        
        .left-panel {
            flex: 1;
            min-width: 300px;
        }
        
        .right-panel {
            flex: 2;
            min-width: 300px;
        }
        
        .panel {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        
        .panel-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #2c3e50;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .upload-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
            border: 2px dashed #3498db;
            border-radius: 12px;
            background: #f8f9fa;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .upload-container:hover {
            background: #e8f4fc;
            border-color: #2980b9;
        }
        
        .upload-icon {
            font-size: 3rem;
            color: #3498db;
            margin-bottom: 15px;
        }
        
        .upload-text {
            font-size: 1.2rem;
            color: #5a6c7d;
            text-align: center;
            margin-bottom: 15px;
        }
        
        .file-input {
            display: none;
        }
        
        .btn {
            background: linear-gradient(to right, #3498db, #2980b9);
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s;
            box-shadow: 0 4px 8px rgba(52, 152, 219, 0.3);
            border: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(52, 152, 219, 0.4);
        }
        
        .btn-primary {
            background: linear-gradient(to right, #2ecc71, #27ae60);
        }
        
        .btn-primary:hover {
            box-shadow: 0 6px 12px rgba(46, 204, 113, 0.4);
        }
        
        .btn-secondary {
            background: linear-gradient(to right, #e74c3c, #c0392b);
        }
        
        .btn-secondary:hover {
            box-shadow: 0 6px 12px rgba(231, 76, 60, 0.4);
        }
        
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #5a6c7d;
            font-weight: 500;
        }
        
        input[type="text"], select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        input[type="text"]:focus, select:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.3);
        }
        
        .filter-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .filter-input {
            flex: 1;
        }
        
        .log-container {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            background: #f8f9fa;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        
        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid #eee;
            white-space: pre-wrap;
        }
        
        .log-entry.error {
            color: #e74c3c;
            background: #fdedec;
        }
        
        .log-entry.warning {
            color: #f39c12;
            background: #fef5e7;
        }
        
        .log-entry.info {
            color: #3498db;
        }
        
        .log-entry.debug {
            color: #7f8c8d;
        }
        
        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #3498db;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #5a6c7d;
        }
        
        .chart-container {
            height: 200px;
            margin-top: 20px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .chart-bar {
            flex: 1;
            background: #3498db;
            border-radius: 4px 4px 0 0;
            position: relative;
            min-height: 5px;
        }
        
        .chart-bar.error {
            background: #e74c3c;
        }
        
        .chart-bar.warning {
            background: #f39c12;
        }
        
        .chart-bar.info {
            background: #3498db;
        }
        
        .chart-bar.debug {
            background: #7f8c8d;
        }
        
        .chart-label {
            position: absolute;
            bottom: -25px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.8rem;
            color: #5a6c7d;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        
        .file-info {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #5a6c7d;
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            background: #2ecc71;
            color: white;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transform: translateX(100%);
            transition: transform 0.3s;
            z-index: 1000;
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        .highlight {
            background: yellow;
            color: black;
            padding: 0 2px;
            border-radius: 2px;
        }
        
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .controls {
                grid-template-columns: 1fr;
            }
            
            .stats-container {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .description {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-file-alt"></i> 日志分析工具</h1>
            <p class="description">上传日志文件，提取错误信息，分析日志内容</p>
        </header>
        
        <div class="main-content">
            <div class="left-panel">
                <div class="panel">
                    <h2 class="panel-title"><i class="fas fa-upload"></i> 上传日志</h2>
                    <div class="upload-container" id="upload-area">
                        <i class="fas fa-cloud-upload-alt upload-icon"></i>
                        <p class="upload-text">点击或拖放日志文件到此处</p>
                        <button class="btn"><i class="fas fa-file"></i> 选择日志文件</button>
                        <input type="file" id="file-input" class="file-input" accept=".log,.txt">
                    </div>
                    <div class="file-info" id="file-info">尚未选择文件</div>
                </div>
                
                <div class="panel">
                    <h2 class="panel-title"><i class="fas fa-filter"></i> 过滤设置</h2>
                    
                    <div class="filter-container">
                        <input type="text" id="filter-input" class="filter-input" placeholder="输入关键词过滤日志...">
                        <button class="btn" id="filter-btn"><i class="fas fa-search"></i></button>
                    </div>
                    
                    <div class="control-group">
                        <label>日志级别</label>
                        <select id="level-select">
                            <option value="all">所有级别</option>
                            <option value="error">仅错误</option>
                            <option value="warning">警告和错误</option>
                            <option value="info">信息、警告和错误</option>
                        </select>
                    </div>
                    
                    <div class="action-buttons">
                        <button class="btn" id="reset-btn"><i class="fas fa-redo"></i> 重置</button>
                        <button class="btn btn-primary" id="analyze-btn" disabled><i class="fas fa-chart-pie"></i> 分析日志</button>
                        <button class="btn btn-secondary" id="export-btn" disabled><i class="fas fa-download"></i> 导出结果</button>
                    </div>
                </div>
                
                <div class="panel">
                    <h2 class="panel-title"><i class="fas fa-chart-bar"></i> 统计信息</h2>
                    
                    <div class="stats-container">
                        <div class="stat-box">
                            <div class="stat-value" id="total-lines">0</div>
                            <div class="stat-label">总行数</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value" id="error-count">0</div>
                            <div class="stat-label">错误数</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value" id="warning-count">0</div>
                            <div class="stat-label">警告数</div>
                        </div>
                    </div>
                    
                    <div class="chart-container" id="chart-container">
                        <!-- 图表将由JavaScript动态生成 -->
                    </div>
                </div>
            </div>
            
            <div class="right-panel">
                <div class="panel">
                    <h2 class="panel-title"><i class="fas fa-list"></i> 日志内容</h2>
                    <div class="log-container" id="log-container">
                        <div class="log-entry">请上传日志文件以开始分析...</div>
                    </div>
                </div>
                
                <div class="panel">
                    <h2 class="panel-title"><i class="fas fa-bug"></i> 错误摘要</h2>
                    <div class="log-container" id="error-container">
                        <div class="log-entry">错误信息将显示在这里...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="notification" id="notification">日志分析完成！</div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const fileInput = document.getElementById('file-input');
            const uploadArea = document.getElementById('upload-area');
            const fileInfo = document.getElementById('file-info');
            const logContainer = document.getElementById('log-container');
            const errorContainer = document.getElementById('error-container');
            const filterInput = document.getElementById('filter-input');
            const filterBtn = document.getElementById('filter-btn');
            const levelSelect = document.getElementById('level-select');
            const resetBtn = document.getElementById('reset-btn');
            const analyzeBtn = document.getElementById('analyze-btn');
            const exportBtn = document.getElementById('export-btn');
            const totalLines = document.getElementById('total-lines');
            const errorCount = document.getElementById('error-count');
            const warningCount = document.getElementById('warning-count');
            const chartContainer = document.getElementById('chart-container');
            const notification = document.getElementById('notification');
            
            let logData = [];
            let filteredData = [];
            let errorLines = [];
            
            // 上传区域点击事件
            uploadArea.addEventListener('click', function() {
                fileInput.click();
            });
            
            // 拖放功能
            uploadArea.addEventListener('dragover', function(e) {
                e.preventDefault();
                uploadArea.style.background = '#e1f5fe';
                uploadArea.style.borderColor = '#0288d1';
            });
            
            uploadArea.addEventListener('dragleave', function() {
                uploadArea.style.background = '#f8f9fa';
                uploadArea.style.borderColor = '#3498db';
            });
            
            uploadArea.addEventListener('drop', function(e) {
                e.preventDefault();
                uploadArea.style.background = '#f8f9fa';
                uploadArea.style.borderColor = '#3498db';
                
                if (e.dataTransfer.files.length) {
                    fileInput.files = e.dataTransfer.files;
                    handleFileSelect(e.dataTransfer.files[0]);
                }
            });
            
            // 文件选择处理
            fileInput.addEventListener('change', function(e) {
                if (e.target.files.length) {
                    handleFileSelect(e.target.files[0]);
                }
            });
            
            function handleFileSelect(file) {
                if (!file.type.match('text.*') && !file.name.match(/\.(log|txt)$/i)) {
                    showNotification('请上传文本或日志文件！', 'error');
                    return;
                }
                
                fileInfo.textContent = `文件名: ${file.name} | 大小: ${(file.size / 1024).toFixed(2)} KB`;
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    const content = e.target.result;
                    processLogContent(content);
                    analyzeBtn.disabled = false;
                };
                reader.readAsText(file);
            }
            
            function processLogContent(content) {
                logData = content.split('\n').filter(line => line.trim() !== '');
                filteredData = [...logData];
                
                // 更新统计信息
                totalLines.textContent = logData.length;
                
                // 分析错误和警告
                analyzeLog();
                
                // 显示日志内容
                displayLogs();
                
                showNotification('日志文件已加载！');
            }
            
            function analyzeLog() {
                // 重置计数
                let errors = 0;
                let warnings = 0;
                errorLines = [];
                
                // 分析每一行日志
                logData.forEach(line => {
                    const lowerLine = line.toLowerCase();
                    
                    if (lowerLine.includes('error') || lowerLine.includes('exception') || 
                        lowerLine.includes('fail') || lowerLine.includes('致命') || 
                        lowerLine.includes('错误')) {
                        errors++;
                        errorLines.push(line);
                    } else if (lowerLine.includes('warn') || lowerLine.includes('警告')) {
                        warnings++;
                    }
                });
                
                // 更新统计信息
                errorCount.textContent = errors;
                warningCount.textContent = warnings;
                
                // 显示错误摘要
                displayErrors();
                
                // 生成图表
                generateChart(errors, warnings, logData.length - errors - warnings);
                
                // 根据错误数量启用或禁用导出按钮
                exportBtn.disabled = errorLines.length === 0;
            }
            
            function displayLogs() {
                logContainer.innerHTML = '';
                
                if (filteredData.length === 0) {
                    logContainer.innerHTML = '<div class="log-entry">没有匹配的日志内容</div>';
                    return;
                }
                
                filteredData.forEach(line => {
                    const logEntry = document.createElement('div');
                    logEntry.classList.add('log-entry');
                    
                    // 根据日志级别添加样式
                    const lowerLine = line.toLowerCase();
                    if (lowerLine.includes('error') || lowerLine.includes('exception') || 
                        lowerLine.includes('fail') || lowerLine.includes('致命') || 
                        lowerLine.includes('错误')) {
                        logEntry.classList.add('error');
                    } else if (lowerLine.includes('warn') || lowerLine.includes('警告')) {
                        logEntry.classList.add('warning');
                    } else if (lowerLine.includes('info') || lowerLine.includes('信息')) {
                        logEntry.classList.add('info');
                    } else if (lowerLine.includes('debug') || lowerLine.includes('调试')) {
                        logEntry.classList.add('debug');
                    }
                    
                    // 高亮关键词
                    let displayLine = line;
                    const filterText = filterInput.value.trim();
                    if (filterText) {
                        const regex = new RegExp(filterText, 'gi');
                        displayLine = line.replace(regex, match => `<span class="highlight">${match}</span>`);
                    }
                    
                    logEntry.innerHTML = displayLine;
                    logContainer.appendChild(logEntry);
                });
            }
            
            function displayErrors() {
                errorContainer.innerHTML = '';
                
                if (errorLines.length === 0) {
                    errorContainer.innerHTML = '<div class="log-entry">未发现错误</div>';
                    return;
                }
                
                errorLines.forEach(line => {
                    const logEntry = document.createElement('div');
                    logEntry.classList.add('log-entry', 'error');
                    
                    // 高亮关键词
                    let displayLine = line;
                    const filterText = filterInput.value.trim();
                    if (filterText) {
                        const regex = new RegExp(filterText, 'gi');
                        displayLine = line.replace(regex, match => `<span class="highlight">${match}</span>`);
                    }
                    
                    logEntry.innerHTML = displayLine;
                    errorContainer.appendChild(logEntry);
                });
            }
            
            function generateChart(errors, warnings, others) {
                chartContainer.innerHTML = '';
                
                const maxValue = Math.max(errors, warnings, others, 1);
                const total = errors + warnings + others;
                
                // 错误柱状图
                if (errors > 0) {
                    const errorBar = document.createElement('div');
                    errorBar.classList.add('chart-bar', 'error');
                    errorBar.style.height = `${(errors / maxValue) * 100}%`;
                    
                    const errorLabel = document.createElement('div');
                    errorLabel.classList.add('chart-label');
                    errorLabel.textContent = `错误 (${errors})`;
                    
                    errorBar.appendChild(errorLabel);
                    chartContainer.appendChild(errorBar);
                }
                
                // 警告柱状图
                if (warnings > 0) {
                    const warningBar = document.createElement('div');
                    warningBar.classList.add('chart-bar', 'warning');
                    warningBar.style.height = `${(warnings / maxValue) * 100}%`;
                    
                    const warningLabel = document.createElement('div');
                    warningLabel.classList.add('chart-label');
                    warningLabel.textContent = `警告 (${warnings})`;
                    
                    warningBar.appendChild(warningLabel);
                    chartContainer.appendChild(warningBar);
                }
                
                // 其他柱状图
                if (others > 0) {
                    const otherBar = document.createElement('div');
                    otherBar.classList.add('chart-bar', 'info');
                    otherBar.style.height = `${(others / maxValue) * 100}%`;
                    
                    const otherLabel = document.createElement('div');
                    otherLabel.classList.add('chart-label');
                    otherLabel.textContent = `其他 (${others})`;
                    
                    otherBar.appendChild(otherLabel);
                    chartContainer.appendChild(otherBar);
                }
            }
            
            // 过滤按钮点击事件
            filterBtn.addEventListener('click', function() {
                applyFilters();
            });
            
            // 级别选择变化事件
            levelSelect.addEventListener('change', function() {
                applyFilters();
            });
            
            // 输入框回车键触发过滤
            filterInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    applyFilters();
                }
            });
            
            function applyFilters() {
                const filterText = filterInput.value.trim().toLowerCase();
                const level = levelSelect.value;
                
                filteredData = logData.filter(line => {
                    const lowerLine = line.toLowerCase();
                    
                    // 应用级别过滤
                    let levelMatch = true;
                    if (level === 'error') {
                        levelMatch = lowerLine.includes('error') || lowerLine.includes('exception') || 
                                   lowerLine.includes('fail') || lowerLine.includes('致命') || 
                                   lowerLine.includes('错误');
                    } else if (level === 'warning') {
                        levelMatch = lowerLine.includes('error') || lowerLine.includes('exception') || 
                                   lowerLine.includes('fail') || lowerLine.includes('致命') || 
                                   lowerLine.includes('错误') || lowerLine.includes('warn') || 
                                   lowerLine.includes('警告');
                    } else if (level === 'info') {
                        levelMatch = lowerLine.includes('error') || lowerLine.includes('exception') || 
                                   lowerLine.includes('fail') || lowerLine.includes('致命') || 
                                   lowerLine.includes('错误') || lowerLine.includes('warn') || 
                                   lowerLine.includes('警告') || lowerLine.includes('info') || 
                                   lowerLine.includes('信息');
                    }
                    
                    // 应用关键词过滤
                    const textMatch = filterText ? lowerLine.includes(filterText) : true;
                    
                    return levelMatch && textMatch;
                });
                
                displayLogs();
                displayErrors();
            }
            
            // 分析按钮点击事件
            analyzeBtn.addEventListener('click', function() {
                analyzeLog();
                showNotification('日志分析完成！');
            });
            
            // 导出按钮点击事件 - 修复版
            exportBtn.addEventListener('click', function() {
                if (errorLines.length === 0) {
                    showNotification('没有错误信息可导出！', 'error');
                    return;
                }
                
                const content = errorLines.join('\n');
                const blob = new Blob([content], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = 'error-summary.txt';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                showNotification('错误摘要已导出！');
            });
            
            // 重置按钮点击事件
            resetBtn.addEventListener('click', function() {
                fileInput.value = '';
                fileInfo.textContent = '尚未选择文件';
                logContainer.innerHTML = '<div class="log-entry">请上传日志文件以开始分析...</div>';
                errorContainer.innerHTML = '<div class="log-entry">错误信息将显示在这里...</div>';
                filterInput.value = '';
                levelSelect.value = 'all';
                totalLines.textContent = '0';
                errorCount.textContent = '0';
                warningCount.textContent = '0';
                chartContainer.innerHTML = '';
                logData = [];
                filteredData = [];
                errorLines = [];
                analyzeBtn.disabled = true;
                exportBtn.disabled = true;
                
                showNotification('已重置所有设置！');
            });
            
            // 显示通知
            function showNotification(message, type = 'success') {
                notification.textContent = message;
                notification.style.background = type === 'success' ? '#2ecc71' : '#e74c3c';
                notification.classList.add('show');
                
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            }
        });
    </script>
</body>
</html>
