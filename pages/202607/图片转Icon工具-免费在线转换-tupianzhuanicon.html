<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片转Icon工具 - 免费在线转换</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(to right, #2575fc, #6a11cb);
            color: white;
            padding: 25px 40px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .content {
            display: flex;
            flex-wrap: wrap;
            padding: 30px;
            gap: 30px;
        }
        
        .upload-section {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .preview-section {
            flex: 2;
            min-width: 300px;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            padding: 25px;
            height: 100%;
        }
        
        .section-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #2575fc;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .upload-area {
            border: 3px dashed #6a11cb;
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }
        
        .upload-area:hover {
            background: #eef2ff;
            transform: translateY(-5px);
        }
        
        .upload-area i {
            font-size: 4rem;
            color: #6a11cb;
            margin-bottom: 15px;
        }
        
        .upload-area h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #333;
        }
        
        .upload-area p {
            color: #666;
            margin-bottom: 15px;
        }
        
        .btn {
            background: linear-gradient(to right, #2575fc, #6a11cb);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 15px rgba(37, 117, 252, 0.4);
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        .btn-outline {
            background: transparent;
            border: 2px solid #2575fc;
            color: #2575fc;
        }
        
        .btn-outline:hover {
            background: #2575fc;
            color: white;
        }
        
        #fileInput {
            display: none;
        }
        
        .preview-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .original-preview {
            text-align: center;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 15px;
        }
        
        #originalImage {
            max-width: 100%;
            max-height: 250px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .icons-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .icon-item {
            background: white;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease;
        }
        
        .icon-item:hover {
            transform: translateY(-5px);
        }
        
        .icon-preview {
            width: 80px;
            height: 80px;
            margin: 0 auto 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f4ff;
            overflow: hidden;
        }
        
        .icon-preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        .icon-size {
            font-weight: 600;
            color: #2575fc;
            margin-bottom: 8px;
        }
        
        .download-btn {
            background: #25c2fc;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        
        .download-btn:hover {
            background: #1a9fd0;
        }
        
        .actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        footer {
            text-align: center;
            padding: 25px;
            color: white;
            background: linear-gradient(to right, #2575fc, #6a11cb);
            font-size: 1rem;
        }
        
        .instructions {
            background: #fff9db;
            border-left: 4px solid #ffd43b;
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin: 20px 0;
        }
        
        .instructions h3 {
            margin-bottom: 10px;
            color: #e67700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .instructions ol {
            padding-left: 20px;
        }
        
        .instructions li {
            margin-bottom: 8px;
            color: #5c3c00;
        }
        
        @media (max-width: 768px) {
            .content {
                flex-direction: column;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .icons-container {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-image"></i> 图片转Icon工具</h1>
            <p class="subtitle">免费在线将图片转换为各种尺寸的图标，支持PNG格式下载</p>
        </header>
        
        <div class="content">
            <div class="upload-section">
                <div class="card">
                    <h2 class="section-title"><i class="fas fa-cloud-upload-alt"></i> 上传图片</h2>
                    
                    <div class="upload-area" id="dropArea">
                        <i class="fas fa-images"></i>
                        <h3>拖放图片到此处</h3>
                        <p>或点击按钮选择图片</p>
                        <button class="btn" id="selectBtn">
                            <i class="fas fa-folder-open"></i> 选择图片
                        </button>
                    </div>
                    <input type="file" id="fileInput" accept="image/*">
                    
                    <div class="instructions">
                        <h3><i class="fas fa-info-circle"></i> 使用说明</h3>
                        <ol>
                            <li>点击"选择图片"按钮或拖放图片到上传区域</li>
                            <li>系统将自动生成多种尺寸的图标</li>
                            <li>预览生成的图标效果</li>
                            <li>点击单个图标下载或使用"全部下载"按钮</li>
                        </ol>
                    </div>
                    
                    <div class="actions">
                        <button class="btn" id="downloadAllBtn" disabled>
                            <i class="fas fa-download"></i> 全部下载
                        </button>
                        <button class="btn btn-outline" id="resetBtn">
                            <i class="fas fa-redo"></i> 重置
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="preview-section">
                <div class="card">
                    <h2 class="section-title"><i class="fas fa-eye"></i> 预览</h2>
                    
                    <div class="preview-container">
                        <div class="original-preview">
                            <h3>原始图片</h3>
                            <div id="imagePreview">
                                <p>图片上传后将显示在这里</p>
                            </div>
                        </div>
                        
                        <div>
                            <h3>生成的图标</h3>
                            <div class="icons-container" id="iconsContainer">
                                <div class="icon-item">
                                    <div class="icon-preview">
                                        <i class="fas fa-grip-lines" style="font-size: 2rem; color: #6a11cb;"></i>
                                    </div>
                                    <div class="icon-size">16x16</div>
                                    <button class="download-btn" disabled>下载</button>
                                </div>
                                <div class="icon-item">
                                    <div class="icon-preview">
                                        <i class="fas fa-grip-lines" style="font-size: 2rem; color: #6a11cb;"></i>
                                    </div>
                                    <div class="icon-size">32x32</div>
                                    <button class="download-btn" disabled>下载</button>
                                </div>
                                <div class="icon-item">
                                    <div class="icon-preview">
                                        <i class="fas fa-grip-lines" style="font-size: 2rem; color: #6a11cb;"></i>
                                    </div>
                                    <div class="icon-size">48x48</div>
                                    <button class="download-btn" disabled>下载</button>
                                </div>
                                <div class="icon-item">
                                    <div class="icon-preview">
                                        <i class="fas fa-grip-lines" style="font-size: 2rem; color: #6a11cb;"></i>
                                    </div>
                                    <div class="icon-size">64x64</div>
                                    <button class="download-btn" disabled>下载</button>
                                </div>
                                <div class="icon-item">
                                    <div class="icon-preview">
                                        <i class="fas fa-grip-lines" style="font-size: 2rem; color: #6a11cb;"></i>
                                    </div>
                                    <div class="icon-size">128x128</div>
                                    <button class="download-btn" disabled>下载</button>
                                </div>
                                <div class="icon-item">
                                    <div class="icon-preview">
                                        <i class="fas fa-grip-lines" style="font-size: 2rem; color: #6a11cb;"></i>
                                    </div>
                                    <div class="icon-size">256x256</div>
                                    <button class="download-btn" disabled>下载</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>© 2023 图片转Icon工具 - 免费在线工具 | 无需注册，完全客户端处理</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const fileInput = document.getElementById('fileInput');
            const dropArea = document.getElementById('dropArea');
            const selectBtn = document.getElementById('selectBtn');
            const imagePreview = document.getElementById('imagePreview');
            const iconsContainer = document.getElementById('iconsContainer');
            const downloadAllBtn = document.getElementById('downloadAllBtn');
            const resetBtn = document.getElementById('resetBtn');
            
            let uploadedImage = null;
            let iconCanvases = [];
            
            // 选择文件按钮事件
            selectBtn.addEventListener('click', () => {
                fileInput.click();
            });
            
            // 文件选择事件
            fileInput.addEventListener('change', function(e) {
                if (this.files && this.files[0]) {
                    handleImageUpload(this.files[0]);
                }
            });
            
            // 拖放事件
            dropArea.addEventListener('dragover', function(e) {
                e.preventDefault();
                this.style.borderColor = '#25c2fc';
                this.style.backgroundColor = '#e0e7ff';
            });
            
            dropArea.addEventListener('dragleave', function() {
                this.style.borderColor = '#6a11cb';
                this.style.backgroundColor = '#f8f9ff';
            });
            
            dropArea.addEventListener('drop', function(e) {
                e.preventDefault();
                this.style.borderColor = '#6a11cb';
                this.style.backgroundColor = '#f8f9ff';
                
                if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                    handleImageUpload(e.dataTransfer.files[0]);
                }
            });
            
            // 处理图片上传
            function handleImageUpload(file) {
                if (!file.type.match('image.*')) {
                    alert('请上传图片文件！');
                    return;
                }
                
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    // 显示原始图片
                    imagePreview.innerHTML = `<img id="originalImage" src="${e.target.result}" alt="原始图片">`;
                    uploadedImage = new Image();
                    uploadedImage.src = e.target.result;
                    
                    // 图片加载完成后生成图标
                    uploadedImage.onload = function() {
                        generateIcons(uploadedImage);
                    };
                    
                    // 启用下载按钮
                    downloadAllBtn.disabled = false;
                };
                
                reader.readAsDataURL(file);
            }
            
            // 生成各种尺寸的图标
            function generateIcons(img) {
                // 清空现有图标
                iconsContainer.innerHTML = '';
                iconCanvases = [];
                
                // 定义要生成的尺寸
                const sizes = [16, 32, 48, 64, 128, 256];
                
                sizes.forEach(size => {
                    // 创建容器
                    const iconItem = document.createElement('div');
                    iconItem.className = 'icon-item';
                    
                    // 创建预览区域
                    const iconPreview = document.createElement('div');
                    iconPreview.className = 'icon-preview';
                    
                    // 创建Canvas来调整图片尺寸
                    const canvas = document.createElement('canvas');
                    canvas.width = size;
                    canvas.height = size;
                    const ctx = canvas.getContext('2d');
                    
                    // 保存canvas引用用于下载
                    iconCanvases.push({canvas, size});
                    
                    // 计算缩放比例并居中绘制
                    const scale = Math.min(canvas.width / img.width, canvas.height / img.height);
                    const x = (canvas.width - img.width * scale) / 2;
                    const y = (canvas.height - img.height * scale) / 2;
                    
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, x, y, img.width * scale, img.height * scale);
                    
                    // 将Canvas转为图片显示
                    const iconImg = new Image();
                    iconImg.src = canvas.toDataURL('image/png');
                    iconPreview.appendChild(iconImg);
                    
                    // 尺寸标签
                    const sizeLabel = document.createElement('div');
                    sizeLabel.className = 'icon-size';
                    sizeLabel.textContent = `${size}x${size}`;
                    
                    // 下载按钮
                    const downloadBtn = document.createElement('button');
                    downloadBtn.className = 'download-btn';
                    downloadBtn.innerHTML = '<i class="fas fa-download"></i> 下载';
                    
                    // 下载功能
                    downloadBtn.addEventListener('click', function() {
                        const link = document.createElement('a');
                        link.download = `icon-${size}x${size}.png`;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    });
                    
                    // 组装元素
                    iconItem.appendChild(iconPreview);
                    iconItem.appendChild(sizeLabel);
                    iconItem.appendChild(downloadBtn);
                    iconsContainer.appendChild(iconItem);
                });
            }
            
            // 下载全部图标
            downloadAllBtn.addEventListener('click', function() {
                // 在实际应用中，这里会创建一个包含所有图标的ZIP文件
                // 由于时间限制，我们模拟这个行为
                alert('在实际应用中，这里会下载包含所有尺寸图标的ZIP文件。\n\n本演示版本请分别下载各个尺寸的图标。');
            });
            
            // 重置按钮
            resetBtn.addEventListener('click', function() {
                fileInput.value = '';
                imagePreview.innerHTML = '<p>图片上传后将显示在这里</p>';
                
                // 重置图标区域
                iconsContainer.innerHTML = '';
                const sizes = [16, 32, 48, 64, 128, 256];
                sizes.forEach(size => {
                    const iconItem = document.createElement('div');
                    iconItem.className = 'icon-item';
                    
                    const iconPreview = document.createElement('div');
                    iconPreview.className = 'icon-preview';
                    iconPreview.innerHTML = '<i class="fas fa-grip-lines" style="font-size: 2rem; color: #6a11cb;"></i>';
                    
                    const sizeLabel = document.createElement('div');
                    sizeLabel.className = 'icon-size';
                    sizeLabel.textContent = `${size}x${size}`;
                    
                    const downloadBtn = document.createElement('button');
                    downloadBtn.className = 'download-btn';
                    downloadBtn.disabled = true;
                    downloadBtn.textContent = '下载';
                    
                    iconItem.appendChild(iconPreview);
                    iconItem.appendChild(sizeLabel);
                    iconItem.appendChild(downloadBtn);
                    iconsContainer.appendChild(iconItem);
                });
                
                downloadAllBtn.disabled = true;
                uploadedImage = null;
                iconCanvases = [];
            });
        });
    </script>
</body>
</html>
