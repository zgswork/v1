        // 获取DOM元素
        const getGuideBtn = document.getElementById('getGuide');
        const changeMountainBtn = document.getElementById('changeMountain');
        const downloadBtn = document.getElementById('downloadBtn');
        const resultDiv = document.getElementById('result');
        const mountainName = document.getElementById('mountainName');
        const province = document.getElementById('province');
        const introduction = document.getElementById('introduction');
        const address = document.getElementById('address');
        const transportation = document.getElementById('transportation');
        const ticket = document.getElementById('ticket');
        const openingHours = document.getElementById('openingHours');
        const modal = document.getElementById('downloadModal');
        const closeBtn = document.querySelector('.close');
        
        // 记录已显示的景点索引
        let shownIndices = [];
        
        // 获取随机景点
        function getRandomMountain() {
            // 如果所有景点都已显示过，重置记录
            if (shownIndices.length >= mountains.length) {
                shownIndices = [];
            }
            
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * mountains.length);
            } while (shownIndices.includes(randomIndex));
            
            shownIndices.push(randomIndex);
            return mountains[randomIndex];
        }
        
        // 显示景点信息
        function displayMountain(mountain) {
            mountainName.textContent = mountain.name;
            province.textContent = mountain.province;
            introduction.textContent = mountain.introduction;
            address.textContent = mountain.address;
            transportation.textContent = mountain.transportation;
            ticket.textContent = mountain.ticket;
            openingHours.textContent = mountain.openingHours;
            
            resultDiv.style.display = 'block';
        }
        
        // 按钮事件监听
        getGuideBtn.addEventListener('click', function() {
            const mountain = getRandomMountain();
            displayMountain(mountain);
        });
        
        changeMountainBtn.addEventListener('click', function() {
            const mountain = getRandomMountain();
            displayMountain(mountain);
        });
        
        // 下载按钮事件监听
        downloadBtn.addEventListener('click', function() {
            modal.style.display = 'block';
        });
        
        // 关闭弹窗事件监听
        closeBtn.addEventListener('click', function() {
            modal.style.display = 'none';
        });
        
        // 点击弹窗外部关闭
        window.addEventListener('click', function(event) {
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        });
