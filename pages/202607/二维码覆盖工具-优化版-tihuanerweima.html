<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码覆盖工具 - 优化版</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 15px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            padding: 20px;
            overflow: hidden;
        }
        
        header {
            text-align: center;
            margin-bottom: 20px;
            padding: 0 10px;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }
        
        .description {
            color: #7f8c8d;
            font-size: 0.95rem;
        }
        
        .upload-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .upload-box {
            background: #f8f9fa;
            border: 2px dashed #ced4da;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .upload-box:hover {
            border-color: #3498db;
            background: #e8f4fc;
        }
        
        .upload-box h3 {
            margin-bottom: 12px;
            color: #2c3e50;
            font-size: 1.1rem;
        }
        
        .file-input {
            display: none;
        }
        
        .file-label {
            display: inline-block;
            padding: 10px 20px;
            background: #3498db;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 12px;
            font-size: 0.95rem;
            touch-action: manipulation;
        }
        
        .file-label:hover, .file-label:active {
            background: #2980b9;
        }
        
        .preview-container {
            margin-top: 15px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            background: white;
            overflow: hidden;
        }
        
        .preview-image {
            max-width: 100%;
            max-height: 200px;
            display: none;
        }
        
        .action-section {
            text-align: center;
            margin: 25px 0;
        }
        
        .process-btn {
            padding: 14px 35px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
            touch-action: manipulation;
            width: 100%;
            max-width: 300px;
        }
        
        .process-btn:hover, .process-btn:active {
            background: #27ae60;
        }
        
        .process-btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }
        
        .result-section {
            text-align: center;
            margin-top: 25px;
            display: none;
        }
        
        .result-section h2 {
            margin-bottom: 15px;
            color: #2c3e50;
            font-size: 1.4rem;
        }
        
        #resultCanvas {
            max-width: 100%;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            background: white;
            margin-bottom: 15px;
        }
        
        .download-btn {
            padding: 12px 25px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            display: inline-block;
            transition: background 0.3s;
            touch-action: manipulation;
            font-size: 0.95rem;
        }
        
        .download-btn:hover, .download-btn:active {
            background: #2980b9;
        }
        
        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            display: none;
            font-size: 0.9rem;
            transition: opacity 0.5s ease;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .instructions {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px;
            margin: 15px 0;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        
        .instructions h3 {
            color: #856404;
            margin-bottom: 8px;
            font-size: 1rem;
        }
        
        .instructions ol {
            padding-left: 20px;
        }
        
        .instructions li {
            margin-bottom: 6px;
        }
        
        /* 移动设备特定样式 */
        @media (min-width: 768px) {
            .upload-section {
                flex-direction: row;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .preview-container {
                min-height: 200px;
            }
            
            .process-btn {
                width: auto;
            }
        }
        
        /* 小屏幕设备优化 */
        @media (max-width: 360px) {
            .container {
                padding: 15px;
                border-radius: 10px;
            }
            
            h1 {
                font-size: 1.6rem;
            }
            
            .file-label, .process-btn, .download-btn {
                padding: 10px 15px;
                font-size: 0.9rem;
            }
            
            .upload-box {
                padding: 12px;
            }
        }
        
        /* 防止iOS缩放 */
        input, button, select, textarea {
            font-size: 16px !important;
        }
        
        /* 加载指示器 */
        .loader {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 提示信息动画 */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 25px;
            border-radius: 8px;
            background: rgba(46, 204, 113, 0.9);
            color: white;
            font-weight: 500;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease, top 0.3s ease;
        }
        
        .toast.show {
            opacity: 1;
            top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>二维码覆盖工具</h1>
            <p class="description">上传包含二维码的图片和要覆盖的图片，系统将自动识别二维码位置并用新图片覆盖</p>
        </header>
        
        <div class="instructions">
            <h3>使用说明</h3>
            <ol>
                <li>上传包含二维码的原始图片</li>
                <li>上传要覆盖二维码的新图片</li>
                <li>点击"处理图片"按钮</li>
                <li>系统将自动识别二维码位置并进行覆盖</li>
                <li>下载处理后的图片</li>
            </ol>
        </div>
        
        <div class="upload-section">
            <div class="upload-box">
                <h3>原始图片（包含二维码）</h3>
                <input type="file" id="originalImage" accept="image/*" class="file-input">
                <label for="originalImage" class="file-label">选择图片</label>
                <div class="preview-container">
                    <img id="originalPreview" class="preview-image" alt="原始图片预览">
                    <p id="originalPlaceholder">预览将显示在这里</p>
                </div>
            </div>
            
            <div class="upload-box">
                <h3>覆盖图片</h3>
                <input type="file" id="overlayImage" accept="image/*" class="file-input">
                <label for="overlayImage" class="file-label">选择图片</label>
                <div class="preview-container">
                    <img id="overlayPreview" class="preview-image" alt="覆盖图片预览">
                    <p id="overlayPlaceholder">预览将显示在这里</p>
                </div>
            </div>
        </div>
        
        <div class="action-section">
            <div class="loader" id="loader"></div>
            <button id="processBtn" class="process-btn" disabled>处理图片</button>
        </div>
        
        <div id="status" class="status"></div>
        
        <div class="result-section" id="resultSection">
            <h2>处理结果</h2>
            <canvas id="resultCanvas"></canvas>
            <br>
            <a id="downloadLink" class="download-btn" download="result.png">下载图片</a>
        </div>
    </div>

    <div class="toast" id="successToast">二维码已成功识别并覆盖！</div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const originalInput = document.getElementById('originalImage');
            const overlayInput = document.getElementById('overlayImage');
            const originalPreview = document.getElementById('originalPreview');
            const overlayPreview = document.getElementById('overlayPreview');
            const originalPlaceholder = document.getElementById('originalPlaceholder');
            const overlayPlaceholder = document.getElementById('overlayPlaceholder');
            const processBtn = document.getElementById('processBtn');
            const resultSection = document.getElementById('resultSection');
            const resultCanvas = document.getElementById('resultCanvas');
            const downloadLink = document.getElementById('downloadLink');
            const statusDiv = document.getElementById('status');
            const loader = document.getElementById('loader');
            const successToast = document.getElementById('successToast');
            
            let originalImage = null;
            let overlayImage = null;
            let toastTimeout = null;
            
            // 显示短暂的成功提示
            function showSuccessToast() {
                // 清除之前的定时器
                if (toastTimeout) {
                    clearTimeout(toastTimeout);
                }
                
                // 显示提示
                successToast.classList.add('show');
                
                // 3秒后隐藏提示
                toastTimeout = setTimeout(() => {
                    successToast.classList.remove('show');
                }, 3000);
            }
            
            // 处理原始图片上传
            originalInput.addEventListener('change', function(e) {
                if (e.target.files && e.target.files[0]) {
                    const reader = new FileReader();
                    
                    reader.onload = function(e) {
                        originalPreview.src = e.target.result;
                        originalPreview.style.display = 'block';
                        originalPlaceholder.style.display = 'none';
                        
                        originalImage = new Image();
                        originalImage.src = e.target.result;
                        originalImage.onload = checkImagesReady;
                    };
                    
                    reader.readAsDataURL(e.target.files[0]);
                }
            });
            
            // 处理覆盖图片上传
            overlayInput.addEventListener('change', function(e) {
                if (e.target.files && e.target.files[0]) {
                    const reader = new FileReader();
                    
                    reader.onload = function(e) {
                        overlayPreview.src = e.target.result;
                        overlayPreview.style.display = 'block';
                        overlayPlaceholder.style.display = 'none';
                        
                        overlayImage = new Image();
                        overlayImage.src = e.target.result;
                        overlayImage.onload = checkImagesReady;
                    };
                    
                    reader.readAsDataURL(e.target.files[0]);
                }
            });
            
            // 检查图片是否都已加载
            function checkImagesReady() {
                if (originalImage && overlayImage && 
                    originalImage.complete && overlayImage.complete) {
                    processBtn.disabled = false;
                }
            }
            
            // 处理按钮点击事件
            processBtn.addEventListener('click', function() {
                processBtn.disabled = true;
                loader.style.display = 'block';
                statusDiv.style.display = 'none';
                
                // 使用setTimeout让UI有机会更新加载状态
                setTimeout(function() {
                    try {
                        // 创建canvas上下文
                        const ctx = resultCanvas.getContext('2d');
                        
                        // 设置canvas尺寸与原始图片相同
                        resultCanvas.width = originalImage.width;
                        resultCanvas.height = originalImage.height;
                        
                        // 绘制原始图片
                        ctx.drawImage(originalImage, 0, 0);
                        
                        // 获取图像数据用于二维码识别
                        const imageData = ctx.getImageData(0, 0, resultCanvas.width, resultCanvas.height);
                        
                        // 使用jsQR库识别二维码
                        const code = jsQR(imageData.data, imageData.width, imageData.height);
                        
                        if (code) {
                            // 找到二维码，获取其位置
                            const qrLocation = code.location;
                            
                            // 计算二维码的尺寸和位置
                            const qrSize = Math.max(
                                Math.abs(qrLocation.topRightCorner.x - qrLocation.topLeftCorner.x),
                                Math.abs(qrLocation.bottomRightCorner.x - qrLocation.topRightCorner.x)
                            );
                            
                            // 绘制覆盖图片到二维码位置
                            ctx.drawImage(
                                overlayImage,
                                qrLocation.topLeftCorner.x,
                                qrLocation.topLeftCorner.y,
                                qrSize,
                                qrSize
                            );
                            
                            // 显示短暂的成功提示
                            showSuccessToast();
                        } else {
                            // 如果没有找到二维码，在中心位置绘制覆盖图片
                            const centerX = (resultCanvas.width - overlayImage.width) / 2;
                            const centerY = (resultCanvas.height - overlayImage.height) / 2;
                            
                            ctx.drawImage(overlayImage, centerX, centerY);
                            
                            showStatus('未检测到二维码，已将图片放置在中心位置', 'error');
                        }
                        
                        // 显示结果区域
                        resultSection.style.display = 'block';
                        
                        // 设置下载链接
                        downloadLink.href = resultCanvas.toDataURL('image/png');
                        
                    } catch (error) {
                        showStatus('处理过程中发生错误: ' + error.message, 'error');
                    } finally {
                        processBtn.disabled = false;
                        loader.style.display = 'none';
                    }
                }, 100);
            });
            
            // 显示状态消息
            function showStatus(message, type) {
                statusDiv.textContent = message;
                statusDiv.className = 'status ' + type;
                statusDiv.style.display = 'block';
                
                // 自动滚动到状态消息
                statusDiv.scrollIntoView({behavior: 'smooth', block: 'nearest'});
            }
            
            // 防止移动设备上的图片拖动默认行为
            document.addEventListener('touchmove', function(e) {
                if (e.target.tagName === 'IMG') {
                    e.preventDefault();
                }
            }, { passive: false });
        });
    </script>
</body>
</html>
