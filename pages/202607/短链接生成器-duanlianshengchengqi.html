<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>短链接生成器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --accent: #4895ef;
            --success: #4cc9f0;
            --text: #2b2d42;
            --light: #f8f9fa;
            --dark: #212529;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text);
            line-height: 1.6;
        }
        
        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        
        header p {
            color: #6c757d;
            font-size: 1.1rem;
            max-width: 90%;
            margin: 0 auto;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .input-group {
            margin-bottom: 25px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text);
            font-size: 1.1rem;
        }
        
        .input-container {
            position: relative;
            display: flex;
        }
        
        .input-container input {
            flex: 1;
            padding: 15px 20px;
            border: none;
            background: #f1f5f9;
            border-radius: 12px;
            font-size: 1rem;
            color: var(--dark);
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }
        
        .input-container input:focus {
            outline: none;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1), 0 0 0 3px rgba(67, 97, 238, 0.15);
            background: #fff;
        }
        
        .input-container input::placeholder {
            color: #a0aec0;
        }
        
        .btn {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3);
            margin-left: 10px;
            min-width: 120px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(67, 97, 238, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn i {
            margin-right: 8px;
        }
        
        .result-container {
            background: #f1f5f9;
            border-radius: 12px;
            padding: 20px;
            display: none;
            margin-top: 20px;
            animation: fadeIn 0.5s ease;
            position: relative;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .result-container.show {
            display: block;
        }
        
        .result-container p {
            margin-bottom: 15px;
            font-weight: 500;
            color: var(--text);
            font-size: 1.1rem;
        }
        
        .result {
            display: flex;
            align-items: center;
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.05);
        }
        
        .result input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 1rem;
            color: var(--dark);
            padding: 0;
        }
        
        .result input:focus {
            outline: none;
        }
        
        .copy-btn {
            background: #edf2f7;
            border: none;
            border-radius: 8px;
            padding: 8px 15px;
            color: var(--primary);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
        }
        
        .copy-btn:hover {
            background: #e2e8f0;
        }
        
        .copy-btn i {
            margin-right: 5px;
        }
        
        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }
        
        .stat-box {
            text-align: center;
            flex: 1;
        }
        
        .stat-box .number {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .stat-box .label {
            font-size: 0.9rem;
            color: #6c757d;
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 30px;
        }
        
        .feature {
            background: rgba(241, 245, 249, 0.7);
            padding: 15px;
            border-radius: 12px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
        }
        
        .feature i {
            color: var(--primary);
            margin-right: 10px;
            font-size: 1.2rem;
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            color: #6c757d;
            font-size: 0.9rem;
        }
        
        @media (max-width: 576px) {
            .card {
                padding: 25px 20px;
            }
            
            header h1 {
                font-size: 2rem;
            }
            
            .input-container {
                flex-direction: column;
            }
            
            .btn {
                margin-left: 0;
                margin-top: 15px;
                width: 100%;
                padding: 15px;
            }
            
            .features {
                grid-template-columns: 1fr;
            }
            
            .stats {
                flex-direction: column;
                gap: 20px;
            }
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--dark);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>短链接生成器</h1>
            <p>将冗长的URL转换为简洁、易分享的短链接</p>
        </header>
        
        <main class="card">
            <div class="input-group">
                <label for="url-input">输入长链接</label>
                <div class="input-container">
                    <input type="url" id="url-input" placeholder="https://example.com/very/long/url/here" autocomplete="off">
                    <button id="generate-btn" class="btn">
                        <i class="fas fa-link"></i> 生成短链接
                    </button>
                </div>
            </div>
            
            <div id="result-container" class="result-container">
                <p>您的短链接已生成：</p>
                <div class="result">
                    <input type="text" id="short-url" value="" readonly>
                    <button id="copy-btn" class="copy-btn">
                        <i class="fas fa-copy"></i> 复制
                    </button>
                </div>
            </div>
            
            <div class="stats">
                <div class="stat-box">
                    <div class="number">15.8K</div>
                    <div class="label">链接已生成</div>
                </div>
                <div class="stat-box">
                    <div class="number">98.7%</div>
                    <div class="label">正常运行</div>
                </div>
                <div class="stat-box">
                    <div class="number">24/7</div>
                    <div class="label">服务支持</div>
                </div>
            </div>
            
            <div class="features">
                <div class="feature">
                    <i class="fas fa-bolt"></i>
                    <span>即时生成</span>
                </div>
                <div class="feature">
                    <i class="fas fa-shield-alt"></i>
                    <span>安全可靠</span>
                </div>
                <div class="feature">
                    <i class="fas fa-mobile-alt"></i>
                    <span>移动端优化</span>
                </div>
                <div class="feature">
                    <i class="fas fa-infinity"></i>
                    <span>永久有效</span>
                </div>
            </div>
        </main>
        
        <footer>
            <p>© 2025 短链接生成器 | 所有链接安全加密</p>
        </footer>
    </div>
    
    <div id="toast" class="toast">链接已复制到剪贴板！</div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlInput = document.getElementById('url-input');
            const generateBtn = document.getElementById('generate-btn');
            const resultContainer = document.getElementById('result-container');
            const shortUrl = document.getElementById('short-url');
            const copyBtn = document.getElementById('copy-btn');
            const toast = document.getElementById('toast');
            
            // 真实短链接生成API
            async function generateShortUrl(longUrl) {
                try {
                    // 使用 TinyURL API
                    const response = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(longUrl)}`);
                    
                    if (!response.ok) {
                        throw new Error('网络请求失败');
                    }
                    
                    const shortUrl = await response.text();
                    
                    // 检查返回的是否是有效的短链接
                    if (shortUrl.startsWith('http') && shortUrl.includes('tinyurl.com')) {
                        return shortUrl;
                    } else {
                        throw new Error('生成短链接失败');
                    }
                } catch (error) {
                    console.error('TinyURL API 失败，尝试备用方案:', error);
                    
                    // 备用方案：使用 is.gd API
                    try {
                        const response = await fetch('https://is.gd/create.php', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/x-www-form-urlencoded',
                            },
                            body: `format=simple&url=${encodeURIComponent(longUrl)}`
                        });
                        
                        if (!response.ok) {
                            throw new Error('备用API请求失败');
                        }
                        
                        const shortUrl = await response.text();
                        
                        if (shortUrl.startsWith('http') && shortUrl.includes('is.gd')) {
                            return shortUrl;
                        } else {
                            throw new Error('备用API生成失败');
                        }
                    } catch (backupError) {
                        console.error('备用API也失败:', backupError);
                        throw new Error('所有短链接服务暂时不可用，请稍后重试');
                    }
                }
            }
            
            // 生成短链接
            generateBtn.addEventListener('click', async function() {
                const longUrl = urlInput.value.trim();
                
                if (!longUrl) {
                    urlInput.focus();
                    showToast('请输入有效的URL');
                    return;
                }
                
                // 验证URL格式
                if (!isValidUrl(longUrl)) {
                    showToast('请输入有效的URL');
                    urlInput.focus();
                    return;
                }
                
                // 禁用按钮并显示加载状态
                generateBtn.disabled = true;
                generateBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 生成中...';
                
                try {
                    const shortUrlValue = await generateShortUrl(longUrl);
                    shortUrl.value = shortUrlValue;
                    resultContainer.classList.add('show');
                    
                    // 滚动到结果区域
                    resultContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } catch (error) {
                    console.error('生成短链接失败:', error);
                    showToast(error.message || '生成失败，请重试');
                } finally {
                    // 恢复按钮状态
                    generateBtn.disabled = false;
                    generateBtn.innerHTML = '<i class="fas fa-link"></i> 生成短链接';
                }
            });
            
            // 复制短链接
            copyBtn.addEventListener('click', function() {
                shortUrl.select();
                document.execCommand('copy');
                
                // 在移动设备上可能需要不同的处理
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(shortUrl.value);
                }
                
                showToast('链接已复制到剪贴板！');
            });
            
            // URL验证函数
            function isValidUrl(string) {
                try {
                    const url = new URL(string);
                    return url.protocol === 'http:' || url.protocol === 'https:';
                } catch (_) {
                    return false;
                }
            }
            
            // 显示通知
            function showToast(message) {
                toast.textContent = message;
                toast.classList.add('show');
                
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }
            
            // 按回车键生成
            urlInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    generateBtn.click();
                }
            });
        });
    </script>
</body>
</html>
