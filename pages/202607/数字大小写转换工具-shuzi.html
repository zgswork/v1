<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字大小写转换工具</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f0f5f9;
            color: #333;
        }
        .container {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
        }
        .input-group {
            margin-bottom: 15px;
            position: relative;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #2c3e50;
        }
        input[type="number"], input[type="text"], textarea {
            padding: 10px 70px 10px 10px;
            margin: 5px 0;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #d1d8e0;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus {
            border-color: #3498db;
            outline: none;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            margin: 10px 0;
        }
        .checkbox-container input {
            width: auto;
            margin-right: 8px;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            flex: 1;
            transition: all 0.3s;
        }
        #convertToUpper {
            background-color: #3498db;
            color: white;
        }
        #convertToUpper:hover {
            background-color: #2980b9;
        }
        #convertToLower {
            background-color: #2ecc71;
            color: white;
        }
        #convertToLower:hover {
            background-color: #27ae60;
        }
        #resetAll {
            background-color: #95a5a6;
            color: white;
            width: 100%;
            margin-top: 10px;
        }
        #resetAll:hover {
            background-color: #7f8c8d;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        .explanation {
            margin-top: 25px;
            padding: 15px;
            background-color: #e8f4f8;
            border-radius: 8px;
            border-left: 4px solid #3498db;
        }
        .explanation h3 {
            color: #2c3e50;
            margin-top: 0;
        }
        .tab-container {
            display: flex;
            margin-bottom: 15px;
        }
        .tab {
            padding: 10px 15px;
            cursor: pointer;
            background-color: #ecf0f1;
            border-radius: 5px 5px 0 0;
            margin-right: 5px;
            font-weight: 500;
            transition: all 0.3s;
        }
        .tab.active {
            background-color: #3498db;
            color: white;
        }
        .action-buttons {
            position: absolute;
            right: 8px;
            top: 33px;
            display: flex;
            gap: 5px;
        }
        .clear-btn {
            background: none;
            border: none;
            color: #95a5a6;
            cursor: pointer;
            font-size: 16px;
            padding: 5px;
            opacity: 0.7;
            transition: all 0.2s;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
        }
        .clear-btn:hover {
            opacity: 1;
            background-color: #f0f0f0;
            color: #e74c3c;
        }
        .copy-btn-container {
            position: absolute;
            left: 8px;
            bottom: 8px;
        }
        .copy-btn {
            background-color: #9b59b6;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 5px 10px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .copy-btn:hover {
            background-color: #8e44ad;
        }
        .tooltip {
            position: relative;
            display: inline-block;
        }
        .tooltip .tooltiptext {
            visibility: hidden;
            width: 120px;
            background-color: #555;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            margin-left: -60px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 12px;
        }
        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #2ecc71;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            animation: slideIn 0.5s, fadeOut 0.5s 2.5s forwards;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>数字大小写转换工具</h1>
        
        <div class="tab-container">
            <div class="tab active" onclick="switchTab('upper')">小写转大写</div>
            <div class="tab" onclick="switchTab('lower')">大写转小写</div>
        </div>
        
        <div id="upperTab">
            <div class="input-group">
                <label for="numberInput">请输入阿拉伯数字(可粘贴)：</label>
                <div class="input-wrapper">
                    <input type="number" id="numberInput" placeholder="例如：1234.56" step="0.01">
                    <div class="action-buttons">
                        <div class="tooltip">
                            <button class="clear-btn" onclick="clearInput('numberInput')">×</button>
                            <span class="tooltiptext">清空输入</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="checkbox-container">
                <input type="checkbox" id="yuanCheckbox">
                <label for="yuanCheckbox">使用"圆"代替"元"</label>
            </div>
            
            <div class="button-group">
                <button id="convertToUpper" onclick="convertToUpper()">转换为大写</button>
            </div>
            
            <div class="input-group">
                <label for="upperResult">大写金额：</label>
                <div class="input-wrapper">
                    <textarea id="upperResult" readonly></textarea>
                    <div class="copy-btn-container">
                        <button class="copy-btn" onclick="copyToClipboard('upperResult')">复制结果</button>
                    </div>
                    <div class="action-buttons">
                        <div class="tooltip">
                            <button class="clear-btn" onclick="clearInput('upperResult')">×</button>
                            <span class="tooltiptext">清空结果</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <button id="resetAll" onclick="resetAll('upper')">重置所有</button>
        </div>
        
        <div id="lowerTab" style="display: none;">
            <div class="input-group">
                <label for="chineseInput">请输入中文大写数字(可粘贴)：</label>
                <div class="input-wrapper">
                    <input type="text" id="chineseInput" placeholder="例如：壹仟贰佰叁拾肆圆伍角陆分">
                    <div class="action-buttons">
                        <div class="tooltip">
                            <button class="clear-btn" onclick="clearInput('chineseInput')">×</button>
                            <span class="tooltiptext">清空输入</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="button-group">
                <button id="convertToLower" onclick="convertToLower()">转换为小写</button>
            </div>
            
            <div class="input-group">
                <label for="lowerResult">阿拉伯数字：</label>
                <div class="input-wrapper">
                    <textarea id="lowerResult" readonly></textarea>
                    <div class="copy-btn-container">
                        <button class="copy-btn" onclick="copyToClipboard('lowerResult')">复制结果</button>
                    </div>
                    <div class="action-buttons">
                        <div class="tooltip">
                            <button class="clear-btn" onclick="clearInput('lowerResult')">×</button>
                            <span class="tooltiptext">清空结果</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <button id="resetAll" onclick="resetAll('lower')">重置所有</button>
        </div>
        
        <div class="explanation">
            <h3>关于"元"和"圆"的区别：</h3>
            <p><strong>"元"</strong>是现代简体中文中人民币的标准货币单位，是日常生活中最常用的写法。</p>
            <p><strong>"圆"</strong>是"元"的繁体字形式，在正式场合、会计凭证、支票等金融文件中更为常见，具有更强的防伪性和正式性。</p>
            <p>两者在法律效力和实际价值上完全相同，只是书写形式不同。在会计和金融领域，"圆"的使用更为传统和正式。</p>
        </div>
    </div>

    <script>
        // 标签页切换
        function switchTab(tab) {
            document.getElementById('upperTab').style.display = tab === 'upper' ? 'block' : 'none';
            document.getElementById('lowerTab').style.display = tab === 'lower' ? 'block' : 'none';
            
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(t => t.classList.remove('active'));
            
            if (tab === 'upper') {
                document.querySelectorAll('.tab')[0].classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
            }
        }
        
        // 小写转大写
        function convertToUpper() {
            const numberInput = document.getElementById('numberInput').value;
            const useYuan = document.getElementById('yuanCheckbox').checked;
            const resultOutput = document.getElementById('upperResult');
            
            if (!numberInput) {
                alert('请输入数字');
                return;
            }
            
            const number = parseFloat(numberInput);
            if (isNaN(number)) {
                alert('请输入有效的数字');
                return;
            }
            
            const result = convertToChinese(number, useYuan);
            resultOutput.value = result;
        }
        
        // 大写转小写
        function convertToLower() {
            const chineseInput = document.getElementById('chineseInput').value.trim();
            const resultOutput = document.getElementById('lowerResult');
            
            if (!chineseInput) {
                alert('请输入中文大写数字');
                return;
            }
            
            const result = convertToArabic(chineseInput);
            resultOutput.value = result !== null ? result : '转换失败，请检查输入格式';
        }
        
        // 数字转中文大写
        function convertToChinese(num, useYuan) {
            if (num === 0) return useYuan ? "零圆整" : "零元整";
            
            const digits = ["零", "壹", "贰", "叁", "肆", "伍", "陆", "柒", "捌", "玖"];
            const units = ["", "拾", "佰", "仟"];
            const bigUnits = ["", "万", "亿", "兆"];
            
            // 处理小数部分
            const yuanUnit = useYuan ? "圆" : "元";
            let str = "";
            let decimalStr = "";
            
            // 分离整数和小数部分
            const integerPart = Math.floor(num);
            const decimalPart = Math.round((num - integerPart) * 100);
            
            // 处理整数部分
            if (integerPart > 0) {
                let integerStr = "";
                let temp = integerPart;
                let zeroFlag = false;
                let unitPos = 0;
                
                while (temp > 0) {
                    const section = temp % 10000;
                    if (section > 0) {
                        let sectionStr = "";
                        let sectionTemp = section;
                        let digitPos = 0;
                        
                        while (sectionTemp > 0) {
                            const digit = sectionTemp % 10;
                            if (digit > 0) {
                                sectionStr = digits[digit] + units[digitPos] + sectionStr;
                                zeroFlag = false;
                            } else if (!zeroFlag) {
                                sectionStr = digits[0] + sectionStr;
                                zeroFlag = true;
                            }
                            sectionTemp = Math.floor(sectionTemp / 10);
                            digitPos++;
                        }
                        
                        // 去除多余的零
                        if (sectionStr.endsWith(digits[0])) {
                            sectionStr = sectionStr.substring(0, sectionStr.length - 1);
                        }
                        
                        integerStr = sectionStr + bigUnits[unitPos] + integerStr;
                    } else {
                        // 处理连续的零
                        if (integerStr && !integerStr.startsWith(digits[0])) {
                            integerStr = digits[0] + integerStr;
                        }
                    }
                    
                    temp = Math.floor(temp / 10000);
                    unitPos++;
                }
                
                str += integerStr + yuanUnit;
            } else {
                str += digits[0] + yuanUnit;
            }
            
            // 处理小数部分
            if (decimalPart > 0) {
                const jiao = Math.floor(decimalPart / 10);
                const fen = decimalPart % 10;
                
                if (jiao > 0) {
                    decimalStr += digits[jiao] + "角";
                }
                if (fen > 0) {
                    decimalStr += digits[fen] + "分";
                }
            } else {
                decimalStr = "整";
            }
            
            // 如果没有小数部分，且整数部分不为零，则添加"整"
            if (decimalPart === 0 && integerPart > 0) {
                decimalStr = "整";
            }
            
            return str + decimalStr;
        }
        
        // 中文大写转数字
        function convertToArabic(chineseNum) {
            // 去除"整"字
            chineseNum = chineseNum.replace(/整/g, '');
            
            // 判断使用"元"还是"圆"
            const hasYuan = chineseNum.includes('元');
            const hasYuanCircle = chineseNum.includes('圆');
            
            if (!hasYuan && !hasYuanCircle) {
                return null;
            }
            
            // 分离整数和小数部分
            const splitChar = hasYuan ? '元' : '圆';
            let [integerPart, decimalPart = ''] = chineseNum.split(splitChar);
            
            // 处理整数部分
            const digitMap = {
                '零': 0, '壹': 1, '贰': 2, '叁': 3, '肆': 4,
                '伍': 5, '陆': 6, '柒': 7, '捌': 8, '玖': 9
            };
            const unitMap = {
                '拾': 10, '佰': 100, '仟': 1000, '万': 10000, '亿': 100000000
            };
            
            let integerValue = 0;
            let tempValue = 0;
            let lastUnit = 1;
            
            for (let i = 0; i < integerPart.length; i++) {
                const char = integerPart[i];
                
                if (digitMap[char] !== undefined) {
                    tempValue = digitMap[char];
                } else if (unitMap[char] !== undefined) {
                    if (unitMap[char] >= lastUnit) {
                        integerValue = (integerValue + tempValue) * unitMap[char];
                    } else {
                        integerValue += tempValue * unitMap[char];
                    }
                    tempValue = 0;
                    lastUnit = unitMap[char];
                }
            }
            
            integerValue += tempValue;
            
            // 处理小数部分
            let decimalValue = 0;
            if (decimalPart.includes('角')) {
                const jiaoIndex = decimalPart.indexOf('角');
                const jiaoChar = decimalPart[jiaoIndex - 1];
                decimalValue += digitMap[jiaoChar] * 10;
            }
            if (decimalPart.includes('分')) {
                const fenIndex = decimalPart.indexOf('分');
                const fenChar = decimalPart[fenIndex - 1];
                decimalValue += digitMap[fenChar];
            }
            
            // 组合结果
            const result = integerValue + decimalValue / 100;
            return result.toFixed(2);
        }
        
        // 复制到剪贴板
        function copyToClipboard(id) {
            const textarea = document.getElementById(id);
            textarea.select();
            document.execCommand('copy');
            
            // 显示右上角通知
            showNotification('已复制到剪贴板！');
        }
        
        // 显示通知
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            document.body.appendChild(notification);
            
            // 3秒后自动移除
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
        
        // 清空输入框
        function clearInput(id) {
            document.getElementById(id).value = '';
            if (id === 'numberInput' || id === 'chineseInput') {
                document.getElementById(id === 'numberInput' ? 'upperResult' : 'lowerResult').value = '';
            }
        }
        
        // 重置所有
        function resetAll(tab) {
            if (tab === 'upper') {
                document.getElementById('numberInput').value = '';
                document.getElementById('upperResult').value = '';
                document.getElementById('yuanCheckbox').checked = false;
            } else {
                document.getElementById('chineseInput').value = '';
                document.getElementById('lowerResult').value = '';
            }
        }
    </script>
</body>
</html>
