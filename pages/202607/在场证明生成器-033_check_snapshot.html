<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在场证明生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            color: white;
            font-size: 2.5em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .proof-icon {
            background: #4CAF50;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.8em;
        }

        .header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1em;
            margin-top: 10px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .settings-panel, .preview-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .panel-title {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }

        .text-input, .select-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .text-input:focus, .select-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .template-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .template-option {
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
        }

        .template-option:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .template-option.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .generate-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .preview-area {
            min-height: 400px;
            border: 2px dashed #ddd;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            position: relative;
            overflow: hidden;
        }

        .preview-placeholder {
            text-align: center;
            color: #6c757d;
        }

        .preview-placeholder i {
            font-size: 3em;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .proof-certificate {
            width: 100%;
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .download-btn {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.3s ease;
        }

        .download-btn:hover {
            background: #218838;
        }

        .download-btn.visible {
            display: flex;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .template-selector {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <span class="proof-icon">✅</span>
                在场证明生成器
            </h1>
            <p>一键生成带有时间戳的在场证明截图，适用于线上会议、活动签到等场景</p>
        </div>

        <div class="main-content">
            <div class="settings-panel">
                <h2 class="panel-title">📝 证明设置</h2>
                
                <div class="form-group">
                    <label for="event-name">活动/会议名称</label>
                    <input type="text" id="event-name" class="text-input" placeholder="例如：产品评审会议" value="产品评审会议">
                </div>

                <div class="form-group">
                    <label for="participant-name">参与者姓名</label>
                    <input type="text" id="participant-name" class="text-input" placeholder="例如：张三" value="张三">
                </div>

                <div class="form-group">
                    <label for="custom-text">自定义文字（可选）</label>
                    <input type="text" id="custom-text" class="text-input" placeholder="例如：准时参加，全程在线">
                </div>

                <div class="form-group">
                    <label>证明模板</label>
                    <div class="template-selector">
                        <div class="template-option active" data-template="formal">
                            📋 正式模板
                        </div>
                        <div class="template-option" data-template="simple">
                            📄 简洁模板
                        </div>
                        <div class="template-option" data-template="colorful">
                            🎨 彩色模板
                        </div>
                        <div class="template-option" data-template="meeting">
                            💼 会议模板
                        </div>
                    </div>
                </div>

                <button class="generate-btn" id="generateBtn">
                    <span>📸 生成在场证明</span>
                </button>
            </div>

            <div class="preview-panel">
                <h2 class="panel-title">🖼️ 证明预览</h2>
                
                <div class="preview-area" id="previewArea">
                    <div class="preview-placeholder">
                        <div style="font-size: 3em; margin-bottom: 15px; opacity: 0.5;">📋</div>
                        <p>在场证明将在这里显示</p>
                        <p style="font-size: 0.9em; color: #999; margin-top: 5px;">
                            填写信息后点击"生成在场证明"
                        </p>
                    </div>
                </div>

                <button class="download-btn" id="downloadBtn">
                    💾 下载证明图片
                </button>
            </div>
        </div>

        <div class="footer">
            <p>© 小苏趣研AI 在场证明生成器 | 快速生成专业的在场证明</p>
        </div>
    </div>

    <script>
        class ProofOfPresenceGenerator {
            constructor() {
                this.initializeElements();
                this.bindEvents();
                this.currentTemplate = 'formal';
                this.currentImageData = null;
            }

            initializeElements() {
                this.eventNameInput = document.getElementById('event-name');
                this.participantNameInput = document.getElementById('participant-name');
                this.customTextInput = document.getElementById('custom-text');
                this.generateBtn = document.getElementById('generateBtn');
                this.previewArea = document.getElementById('previewArea');
                this.downloadBtn = document.getElementById('downloadBtn');
                this.templateOptions = document.querySelectorAll('.template-option');
            }

            bindEvents() {
                this.generateBtn.addEventListener('click', () => this.generateProof());
                this.downloadBtn.addEventListener('click', () => this.downloadProof());
                
                this.templateOptions.forEach(option => {
                    option.addEventListener('click', (e) => this.selectTemplate(e.target.closest('.template-option')));
                });

                // 回车键快速生成
                [this.eventNameInput, this.participantNameInput, this.customTextInput].forEach(input => {
                    input.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') {
                            this.generateProof();
                        }
                    });
                });
            }

            selectTemplate(option) {
                this.templateOptions.forEach(opt => opt.classList.remove('active'));
                option.classList.add('active');
                this.currentTemplate = option.dataset.template;
            }

            generateProof() {
                const eventName = this.eventNameInput.value.trim();
                const participantName = this.participantNameInput.value.trim();
                const customText = this.customTextInput.value.trim();

                if (!eventName || !participantName) {
                    alert('请填写活动名称和参与者姓名');
                    return;
                }

                // 创建证明画布
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // 设置画布尺寸
                canvas.width = 800;
                canvas.height = 600;

                // 根据模板绘制证明
                this.drawProofTemplate(ctx, eventName, participantName, customText);

                // 转换为图片并显示
                const imageData = canvas.toDataURL('image/png');
                this.currentImageData = imageData;
                this.showPreview(imageData);
            }

            drawProofTemplate(ctx, eventName, participantName, customText) {
                const now = new Date();
                const dateStr = now.toLocaleDateString('zh-CN', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
                const timeStr = now.toLocaleTimeString('zh-CN', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });

                switch (this.currentTemplate) {
                    case 'formal':
                        this.drawFormalTemplate(ctx, eventName, participantName, customText, dateStr, timeStr);
                        break;
                    case 'simple':
                        this.drawSimpleTemplate(ctx, eventName, participantName, customText, dateStr, timeStr);
                        break;
                    case 'colorful':
                        this.drawColorfulTemplate(ctx, eventName, participantName, customText, dateStr, timeStr);
                        break;
                    case 'meeting':
                        this.drawMeetingTemplate(ctx, eventName, participantName, customText, dateStr, timeStr);
                        break;
                }
            }

            drawFormalTemplate(ctx, eventName, participantName, customText, dateStr, timeStr) {
                // 背景
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 800, 600);

                // 边框
                ctx.strokeStyle = '#333333';
                ctx.lineWidth = 3;
                ctx.strokeRect(20, 20, 760, 560);

                // 内边框
                ctx.strokeStyle = '#666666';
                ctx.lineWidth = 1;
                ctx.strokeRect(40, 40, 720, 520);

                // 标题
                ctx.fillStyle = '#333333';
                ctx.font = 'bold 36px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('在场证明', 400, 120);

                // 证明内容
                ctx.font = '24px Arial';
                ctx.fillText('兹证明', 400, 200);

                ctx.font = 'bold 28px Arial';
                ctx.fillStyle = '#0066cc';
                ctx.fillText(participantName, 400, 250);

                ctx.fillStyle = '#333333';
                ctx.font = '24px Arial';
                ctx.fillText('于 ' + dateStr + ' ' + timeStr, 400, 300);
                ctx.fillText('参加了', 400, 340);

                ctx.font = 'bold 26px Arial';
                ctx.fillStyle = '#cc6600';
                ctx.fillText(eventName, 400, 380);

                if (customText) {
                    ctx.fillStyle = '#666666';
                    ctx.font = '20px Arial';
                    ctx.fillText(customText, 400, 420);
                }

                // 时间戳
                ctx.fillStyle = '#999999';
                ctx.font = '16px Arial';
                ctx.textAlign = 'right';
                ctx.fillText('生成时间：' + new Date().toLocaleString('zh-CN'), 760, 540);

                // 印章效果
                ctx.strokeStyle = '#cc0000';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(650, 450, 60, 0, 2 * Math.PI);
                ctx.stroke();
                
                ctx.fillStyle = '#cc0000';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('在场', 650, 445);
                ctx.fillText('证明', 650, 465);
            }

            drawSimpleTemplate(ctx, eventName, participantName, customText, dateStr, timeStr) {
                // 背景
                ctx.fillStyle = '#f8f9fa';
                ctx.fillRect(0, 0, 800, 600);

                // 主要内容区域
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(50, 50, 700, 500);
                ctx.strokeStyle = '#dee2e6';
                ctx.lineWidth = 1;
                ctx.strokeRect(50, 50, 700, 500);

                // 标题
                ctx.fillStyle = '#495057';
                ctx.font = 'bold 32px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('✅ 在场证明', 400, 130);

                // 分隔线
                ctx.strokeStyle = '#dee2e6';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(100, 160);
                ctx.lineTo(700, 160);
                ctx.stroke();

                // 内容
                ctx.fillStyle = '#212529';
                ctx.font = '22px Arial';
                ctx.fillText('参与者：' + participantName, 400, 220);
                ctx.fillText('活动：' + eventName, 400, 260);
                ctx.fillText('时间：' + dateStr + ' ' + timeStr, 400, 300);

                if (customText) {
                    ctx.fillText('备注：' + customText, 400, 340);
                }

                // 底部信息
                ctx.fillStyle = '#6c757d';
                ctx.font = '16px Arial';
                ctx.fillText('此证明由系统自动生成', 400, 480);
                ctx.textAlign = 'right';
                ctx.fillText('生成于：' + new Date().toLocaleString('zh-CN'), 720, 520);
            }

            drawColorfulTemplate(ctx, eventName, participantName, customText, dateStr, timeStr) {
                // 渐变背景
                const gradient = ctx.createLinearGradient(0, 0, 800, 600);
                gradient.addColorStop(0, '#667eea');
                gradient.addColorStop(1, '#764ba2');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, 800, 600);

                // 白色内容区域
                ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
                ctx.fillRect(60, 60, 680, 480);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.lineWidth = 2;
                ctx.strokeRect(60, 60, 680, 480);

                // 装饰性元素
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                ctx.arc(120, 120, 20, 0, 2 * Math.PI);
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(680, 120, 20, 0, 2 * Math.PI);
                ctx.fill();

                // 标题
                ctx.fillStyle = '#333333';
                ctx.font = 'bold 34px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('🎉 在场证明 🎉', 400, 150);

                // 内容
                ctx.fillStyle = '#495057';
                ctx.font = '24px Arial';
                ctx.fillText('🙋‍♂️ 参与者：' + participantName, 400, 220);
                ctx.fillText('📅 活动：' + eventName, 400, 260);
                ctx.fillText('⏰ 时间：' + dateStr + ' ' + timeStr, 400, 300);

                if (customText) {
                    ctx.fillText('📝 ' + customText, 400, 340);
                }

                // 认证标记
                ctx.fillStyle = '#28a745';
                ctx.font = 'bold 20px Arial';
                ctx.fillText('✓ 已认证', 400, 420);

                // 底部
                ctx.fillStyle = '#6c757d';
                ctx.font = '14px Arial';
                ctx.textAlign = 'right';
                ctx.fillText('Generated at ' + new Date().toLocaleString('zh-CN'), 720, 510);
            }

            drawMeetingTemplate(ctx, eventName, participantName, customText, dateStr, timeStr) {
                // 背景
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 800, 600);

                // 顶部横条
                ctx.fillStyle = '#0066cc';
                ctx.fillRect(0, 0, 800, 80);

                // 公司/组织标识区域
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'left';
                ctx.fillText('💼 会议系统', 30, 50);

                // 主标题
                ctx.fillStyle = '#333333';
                ctx.font = 'bold 30px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('会议参与证明', 400, 140);

                // 信息表格样式
                const infoY = 200;
                const lineHeight = 40;
                
                ctx.fillStyle = '#f8f9fa';
                ctx.fillRect(100, infoY - 10, 600, lineHeight * 4 + 20);
                
                ctx.strokeStyle = '#dee2e6';
                ctx.lineWidth = 1;
                ctx.strokeRect(100, infoY - 10, 600, lineHeight * 4 + 20);

                // 信息内容
                ctx.fillStyle = '#333333';
                ctx.font = '20px Arial';
                ctx.textAlign = 'left';
                
                ctx.fillText('参与者姓名：', 120, infoY + 20);
                ctx.fillStyle = '#0066cc';
                ctx.font = 'bold 20px Arial';
                ctx.fillText(participantName, 280, infoY + 20);

                ctx.fillStyle = '#333333';
                ctx.font = '20px Arial';
                ctx.fillText('会议名称：', 120, infoY + 60);
                ctx.fillStyle = '#cc6600';
                ctx.font = 'bold 20px Arial';
                ctx.fillText(eventName, 280, infoY + 60);

                ctx.fillStyle = '#333333';
                ctx.font = '20px Arial';
                ctx.fillText('参与日期：', 120, infoY + 100);
                ctx.fillText(dateStr, 280, infoY + 100);

                ctx.fillText('参与时间：', 120, infoY + 140);
                ctx.fillText(timeStr, 280, infoY + 140);

                if (customText) {
                    ctx.fillText('备注说明：', 120, infoY + 180);
                    ctx.fillText(customText, 280, infoY + 180);
                }

                // 底部签名区域
                ctx.fillStyle = '#666666';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('此证明由会议系统自动生成，具有法律效力', 400, 480);
                
                ctx.textAlign = 'right';
                ctx.fillText('证明生成时间：' + new Date().toLocaleString('zh-CN'), 680, 520);

                // 二维码占位符
                ctx.strokeStyle = '#cccccc';
                ctx.lineWidth = 2;
                ctx.strokeRect(650, 350, 80, 80);
                ctx.fillStyle = '#999999';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('验证码', 690, 395);
            }

            showPreview(imageData) {
                this.previewArea.innerHTML = `
                    <img src="${imageData}" alt="在场证明" class="proof-certificate">
                `;
                this.downloadBtn.classList.add('visible');
            }

            downloadProof() {
                if (!this.currentImageData) {
                    alert('没有可下载的证明');
                    return;
                }

                const link = document.createElement('a');
                const timestamp = new Date().toISOString().slice(0, 19).replace(/:/g, '-');
                link.download = `在场证明_${timestamp}.png`;
                link.href = this.currentImageData;
                link.click();
            }
        }

        // 初始化生成器
        document.addEventListener('DOMContentLoaded', () => {
            new ProofOfPresenceGenerator();
        });
    </script>
</body>
</html>
