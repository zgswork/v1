<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>JSON格式化与校验工具</title>
  <style>
    :root {
      --bg: #0f172a; /* slate-900 */
      --panel: #111827; /* gray-900 */
      --text: #e5e7eb; /* gray-200 */
      --muted: #9ca3af; /* gray-400 */
      --accent: #22d3ee; /* cyan-400 */
      --danger: #f87171; /* red-400 */
      --ok: #34d399;     /* green-400 */
      --btn-bg: #1f2937; /* gray-800 */
      --btn-border: #374151; /* gray-700 */
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--btn-border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      background: var(--panel);
      position: sticky; top: 0; z-index: 10;
    }
    h1 { font-size: 18px; margin: 0; }
    .sub { color: var(--muted); font-size: 13px; }
    .container {
      padding: 16px;
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    @media (min-width: 960px) {
      .container { grid-template-columns: 1fr 1fr; }
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--btn-border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      min-height: 40vh;
    }
    .panel-header {
      padding: 10px 12px;
      border-bottom: 1px solid var(--btn-border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .panel-title { font-weight: 600; }
    .panel-body { padding: 8px; }
    textarea {
      width: 100%;
      height: 48vh;
      min-height: 240px;
      resize: vertical;
      background: #0b1222;
      color: var(--text);
      border: 1px solid var(--btn-border);
      border-radius: 8px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 13px;
      line-height: 1.55;
    }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid var(--btn-border);
      background: #0b1222;
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
    }
    button, select, label.checkbox {
      background: var(--btn-bg);
      color: var(--text);
      border: 1px solid var(--btn-border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.primary { border-color: var(--accent); color: var(--accent); }
    button.danger { border-color: var(--danger); color: var(--danger); }
    .status {
      margin-top: 8px;
      font-size: 13px;
    }
    .status .ok { color: var(--ok); }
    .status .err { color: var(--danger); }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .grow { flex: 1; }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>JSON格式化与校验工具</h1>
      <div class="sub">美化与压缩 JSON，校验格式并定位错误，电脑与手机可用</div>
    </div>
    <div class="row grow" style="justify-content: flex-end;">
      <label class="checkbox"><input id="liveValidate" type="checkbox" checked /> 实时校验</label>
      <label class="checkbox">缩进：
        <select id="indent">
          <option value="2">2 空格</option>
          <option value="4">4 空格</option>
          <option value="\t">Tab</option>
        </select>
      </label>
    </div>
  </header>

  <div class="container">
    <section class="panel">
      <div class="panel-header">
        <div class="panel-title">输入 JSON</div>
        <div class="row">
          <button id="sampleBtn">填充示例</button>
          <button id="pasteBtn">粘贴剪贴板</button>
          <button id="clearBtn" class="danger">清空</button>
        </div>
      </div>
      <div class="panel-body">
        <textarea id="inputArea" placeholder="在此粘贴或输入 JSON 字符串"></textarea>
        <div id="inputStatus" class="status muted">输入后可自动或手动校验</div>
      </div>
      <div class="toolbar">
        <button id="validateBtn">校验</button>
        <button id="formatBtn" class="primary">美化</button>
        <button id="minifyBtn">压缩</button>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <div class="panel-title">输出结果</div>
        <div class="row">
          <button id="copyBtn">复制输出</button>
          <button id="downloadBtn">下载输出</button>
        </div>
      </div>
      <div class="panel-body">
        <textarea id="outputArea" placeholder="格式化或压缩后的结果显示在此" readonly></textarea>
        <div id="outputStatus" class="status muted">尚无输出</div>
      </div>
    </section>
  </div>

  <script>
    const inputArea = document.getElementById('inputArea');
    const outputArea = document.getElementById('outputArea');
    const indentSelect = document.getElementById('indent');
    const liveValidate = document.getElementById('liveValidate');
    const inputStatus = document.getElementById('inputStatus');
    const outputStatus = document.getElementById('outputStatus');

    const formatBtn = document.getElementById('formatBtn');
    const minifyBtn = document.getElementById('minifyBtn');
    const validateBtn = document.getElementById('validateBtn');
    const copyBtn = document.getElementById('copyBtn');
    const clearBtn = document.getElementById('clearBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const pasteBtn = document.getElementById('pasteBtn');
    const sampleBtn = document.getElementById('sampleBtn');

    function indexToLineCol(text, index) {
      if (index < 0) return { line: null, col: null };
      const upto = text.slice(0, index);
      const lines = upto.split(/\r?\n/);
      const line = lines.length;
      const col = lines[lines.length - 1].length + 1; // 1-based
      return { line, col };
    }

    function parseJSONWithErrorPosition(text) {
      try {
        const obj = JSON.parse(text);
        return { ok: true, value: obj };
      } catch (e) {
        let idx = -1;
        const msg = String(e && e.message || '解析失败');
        const m1 = msg.match(/position\s+(\d+)/i);
        const m2 = msg.match(/at\s+position\s+(\d+)/i);
        const m3 = msg.match(/column\s+(\d+)/i); // 某些引擎
        if (m1) idx = parseInt(m1[1], 10);
        else if (m2) idx = parseInt(m2[1], 10);
        else if (m3) {
          // 没有绝对索引时不准确，仅作为参考
          const col = parseInt(m3[1], 10);
          // 尝试从当前光标行估计，保守处理
          idx = inputArea.selectionStart + (col - 1);
        }
        const { line, col } = indexToLineCol(text, idx);
        return { ok: false, message: msg, index: idx, line, col };
      }
    }

    function setInputErrorHighlight(index) {
      if (typeof index === 'number' && index >= 0) {
        inputArea.focus();
        const start = Math.max(0, index);
        inputArea.setSelectionRange(start, Math.min(start + 1, inputArea.value.length));
      }
    }

    function showInputStatusOk(extra) {
      inputStatus.innerHTML = `<span class="ok">JSON 有效 ✔️</span>${extra ? ' · ' + extra : ''}`;
    }
    function showInputStatusError(info) {
      const pos = (info.line && info.col) ? `，行 ${info.line}，列 ${info.col}` : '';
      inputStatus.innerHTML = `<span class="err">${info.message}${pos}</span>`;
    }
    function showOutputStatus(text) {
      outputStatus.textContent = text;
    }

    function getIndent() {
      const v = indentSelect.value;
      return v === '\\t' ? '\t' : ' '.repeat(parseInt(v, 10));
    }

    function doValidate(explicit = false) {
      const txt = inputArea.value.trim();
      if (!txt) {
        inputStatus.innerHTML = '<span class="muted">输入为空</span>';
        return { ok: false };
      }
      const res = parseJSONWithErrorPosition(txt);
      if (res.ok) {
        showInputStatusOk(`长度 ${txt.length}，键值对 ${Object.keys(res.value || {}).length}`);
      } else {
        showInputStatusError(res);
        if (explicit) setInputErrorHighlight(res.index);
      }
      return res;
    }

    formatBtn.addEventListener('click', () => {
      const res = doValidate(true);
      if (!res.ok) return;
      const indent = getIndent();
      try {
        const pretty = JSON.stringify(res.value, null, indent);
        outputArea.value = pretty;
        showOutputStatus(`已美化 · ${pretty.length} 字符`);
      } catch (e) {
        showOutputStatus('美化失败：' + e.message);
      }
    });

    minifyBtn.addEventListener('click', () => {
      const res = doValidate(true);
      if (!res.ok) return;
      try {
        const compact = JSON.stringify(res.value);
        outputArea.value = compact;
        showOutputStatus(`已压缩 · ${compact.length} 字符`);
      } catch (e) {
        showOutputStatus('压缩失败：' + e.message);
      }
    });

    validateBtn.addEventListener('click', () => {
      doValidate(true);
    });

    copyBtn.addEventListener('click', async () => {
      const text = outputArea.value;
      if (!text) { showOutputStatus('输出为空，无可复制内容'); return; }
      try {
        await navigator.clipboard.writeText(text);
        showOutputStatus('已复制到剪贴板 ✔️');
      } catch (e) {
        showOutputStatus('复制失败：' + e.message);
      }
    });

    clearBtn.addEventListener('click', () => {
      inputArea.value = '';
      outputArea.value = '';
      inputStatus.innerHTML = '<span class="muted">输入为空</span>';
      showOutputStatus('尚无输出');
    });

    downloadBtn.addEventListener('click', () => {
      const text = outputArea.value;
      if (!text) { showOutputStatus('输出为空，无法下载'); return; }
      const blob = new Blob([text], { type: 'application/json;charset=utf-8' });
      const a = document.createElement('a');
      const isPretty = /\n/.test(text);
      a.download = isPretty ? 'formatted.json' : 'minified.json';
      a.href = URL.createObjectURL(blob);
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 0);
      showOutputStatus('已触发下载');
    });

    pasteBtn.addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        inputArea.value = text;
        inputArea.focus();
        if (liveValidate.checked) doValidate(false);
      } catch (e) {
        inputStatus.innerHTML = '<span class="err">无法读取剪贴板：' + e.message + '</span>';
      }
    });

    sampleBtn.addEventListener('click', () => {
      const sample = {
        name: "示例",
        count: 3,
        items: [1, 2, 3],
        active: true,
        created: "2025-01-01T00:00:00Z",
        nested: { a: 1, b: [ { x: 1 }, { x: 2 } ] }
      };
      inputArea.value = JSON.stringify(sample, null, 2);
      inputArea.scrollTop = 0;
      if (liveValidate.checked) doValidate(false);
    });

    inputArea.addEventListener('input', () => {
      if (liveValidate.checked) doValidate(false);
    });

    // 初始填充示例，便于上手
    (function init() {
      sampleBtn.click();
      showOutputStatus('尚无输出');
    })();
  </script>
</body>
</html>
