<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>迷宫小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
        }

        .game-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .game-title {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            color: #495057;
        }

        .info-value {
            color: #007bff;
            font-size: 1.1rem;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn-primary:hover {
            background: #0056b3;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #1e7e34;
            transform: translateY(-2px);
        }

        .game-board {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        #maze {
            border: 3px solid #333;
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .instructions {
            text-align: center;
            color: #666;
            font-size: 1.1rem;
            margin-top: 15px;
        }

        .victory-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            padding: 30px 50px;
            border-radius: 15px;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            display: none;
            animation: victoryPulse 0.6s ease-in-out;
        }

        @keyframes victoryPulse {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.1); }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        @media (max-width: 768px) {
            .game-title {
                font-size: 2rem;
            }
            
            .game-info {
                justify-content: center;
                text-align: center;
            }
            
            .controls {
                justify-content: center;
            }
            
            .btn {
                padding: 8px 16px;
                font-size: 0.9rem;
            }
            
            .instructions {
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .game-title {
                font-size: 1.8rem;
            }
            
            .game-container {
                padding: 15px;
            }
            
            .victory-message {
                padding: 20px 30px;
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1 class="game-title">🎮 迷宫小游戏</h1>
        </div>
        
        <div class="game-info">
            <div class="info-item">
                <span>步数:</span>
                <span class="info-value" id="steps">0</span>
            </div>
            <div class="info-item">
                <span>时间:</span>
                <span class="info-value" id="time">00:00</span>
            </div>
            <div class="controls">
                <button class="btn btn-primary" onclick="generateNewMaze()">新迷宫</button>
                <button class="btn btn-success" onclick="resetGame()">重新开始</button>
            </div>
        </div>
        
        <div class="game-board">
            <canvas id="maze"></canvas>
        </div>
        
        <div class="instructions">
            🎯 使用方向键 ↑↓←→ 控制角色移动，找到出口！
        </div>
    </div>

    <div class="victory-message" id="victoryMessage">
        <div>🎉 恭喜通关！🎉</div>
        <div style="margin-top: 10px; font-size: 1.2rem;">
            用时: <span id="finalTime"></span> | 步数: <span id="finalSteps"></span>
        </div>
        <button class="btn btn-success" style="margin-top: 15px;" onclick="hideVictory()">继续游戏</button>
    </div>

    <script>
        class MazeGame {
            constructor() {
                this.canvas = document.getElementById('maze');
                this.ctx = this.canvas.getContext('2d');
                this.cellSize = 20;
                this.mazeWidth = 25;
                this.mazeHeight = 25;
                this.steps = 0;
                this.startTime = Date.now();
                this.gameWon = false;
                
                // 玩家位置
                this.player = { x: 1, y: 1 };
                // 终点位置
                this.exit = { x: this.mazeWidth - 2, y: this.mazeHeight - 2 };
                
                this.maze = [];
                this.visited = [];
                
                this.setupCanvas();
                this.generateMaze();
                this.setupEventListeners();
                this.startTimer();
                this.draw();
            }
            
            setupCanvas() {
                const maxWidth = Math.min(window.innerWidth - 80, 800);
                const maxHeight = Math.min(window.innerHeight - 300, 600);
                
                this.cellSize = Math.min(
                    Math.floor(maxWidth / this.mazeWidth),
                    Math.floor(maxHeight / this.mazeHeight),
                    25
                );
                
                this.canvas.width = this.mazeWidth * this.cellSize;
                this.canvas.height = this.mazeHeight * this.cellSize;
            }
            
            generateMaze() {
                // 初始化迷宫 - 全部为墙
                this.maze = Array(this.mazeHeight).fill().map(() => Array(this.mazeWidth).fill(1));
                this.visited = Array(this.mazeHeight).fill().map(() => Array(this.mazeWidth).fill(false));
                
                // 使用递归回溯算法生成迷宫
                this.carvePath(1, 1);
                
                // 确保起点和终点是通路
                this.maze[1][1] = 0;
                this.maze[this.mazeHeight - 2][this.mazeWidth - 2] = 0;
            }
            
            carvePath(x, y) {
                this.visited[y][x] = true;
                this.maze[y][x] = 0;
                
                // 获取所有可能的邻居
                const neighbors = [
                    { x: x + 2, y: y },
                    { x: x - 2, y: y },
                    { x: x, y: y + 2 },
                    { x: x, y: y - 2 }
                ].filter(pos => 
                    pos.x > 0 && pos.x < this.mazeWidth - 1 &&
                    pos.y > 0 && pos.y < this.mazeHeight - 1 &&
                    !this.visited[pos.y][pos.x]
                );
                
                // 随机打乱邻居顺序
                this.shuffleArray(neighbors);
                
                for (let neighbor of neighbors) {
                    if (!this.visited[neighbor.y][neighbor.x]) {
                        // 打通墙壁
                        const wallX = (x + neighbor.x) / 2;
                        const wallY = (y + neighbor.y) / 2;
                        this.maze[wallY][wallX] = 0;
                        
                        this.carvePath(neighbor.x, neighbor.y);
                    }
                }
            }
            
            shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }
            
            setupEventListeners() {
                document.addEventListener('keydown', (e) => {
                    if (this.gameWon) return;
                    
                    let newX = this.player.x;
                    let newY = this.player.y;
                    
                    switch (e.key) {
                        case 'ArrowUp':
                            newY--;
                            break;
                        case 'ArrowDown':
                            newY++;
                            break;
                        case 'ArrowLeft':
                            newX--;
                            break;
                        case 'ArrowRight':
                            newX++;
                            break;
                        default:
                            return;
                    }
                    
                    e.preventDefault();
                    this.movePlayer(newX, newY);
                });
                
                // 触摸控制（移动端）
                let touchStartX, touchStartY;
                
                this.canvas.addEventListener('touchstart', (e) => {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                });
                
                this.canvas.addEventListener('touchend', (e) => {
                    if (this.gameWon) return;
                    
                    const touchEndX = e.changedTouches[0].clientX;
                    const touchEndY = e.changedTouches[0].clientY;
                    
                    const deltaX = touchEndX - touchStartX;
                    const deltaY = touchEndY - touchStartY;
                    
                    const minSwipeDistance = 30;
                    
                    let newX = this.player.x;
                    let newY = this.player.y;
                    
                    if (Math.abs(deltaX) > Math.abs(deltaY)) {
                        if (Math.abs(deltaX) > minSwipeDistance) {
                            if (deltaX > 0) newX++;
                            else newX--;
                        }
                    } else {
                        if (Math.abs(deltaY) > minSwipeDistance) {
                            if (deltaY > 0) newY++;
                            else newY--;
                        }
                    }
                    
                    this.movePlayer(newX, newY);
                });
            }
            
            movePlayer(newX, newY) {
                // 检查边界
                if (newX < 0 || newX >= this.mazeWidth || newY < 0 || newY >= this.mazeHeight) {
                    return;
                }
                
                // 检查碰撞
                if (this.maze[newY][newX] === 1) {
                    return;
                }
                
                // 移动玩家
                this.player.x = newX;
                this.player.y = newY;
                this.steps++;
                
                // 检查是否到达终点
                if (this.player.x === this.exit.x && this.player.y === this.exit.y) {
                    this.gameWon = true;
                    this.showVictory();
                }
                
                this.updateUI();
                this.draw();
            }
            
            draw() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                // 绘制迷宫
                for (let y = 0; y < this.mazeHeight; y++) {
                    for (let x = 0; x < this.mazeWidth; x++) {
                        const cellX = x * this.cellSize;
                        const cellY = y * this.cellSize;
                        
                        if (this.maze[y][x] === 1) {
                            // 墙壁
                            this.ctx.fillStyle = '#2c3e50';
                            this.ctx.fillRect(cellX, cellY, this.cellSize, this.cellSize);
                            
                            // 墙壁边框
                            this.ctx.strokeStyle = '#34495e';
                            this.ctx.lineWidth = 1;
                            this.ctx.strokeRect(cellX, cellY, this.cellSize, this.cellSize);
                        } else {
                            // 通道
                            this.ctx.fillStyle = '#ecf0f1';
                            this.ctx.fillRect(cellX, cellY, this.cellSize, this.cellSize);
                        }
                    }
                }
                
                // 绘制终点
                const exitX = this.exit.x * this.cellSize;
                const exitY = this.exit.y * this.cellSize;
                this.ctx.fillStyle = '#27ae60';
                this.ctx.fillRect(exitX, exitY, this.cellSize, this.cellSize);
                
                // 终点标记
                this.ctx.fillStyle = '#fff';
                this.ctx.font = `${this.cellSize * 0.6}px Arial`;
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle';
                this.ctx.fillText('🎯', exitX + this.cellSize / 2, exitY + this.cellSize / 2);
                
                // 绘制玩家
                const playerX = this.player.x * this.cellSize + this.cellSize / 2;
                const playerY = this.player.y * this.cellSize + this.cellSize / 2;
                
                this.ctx.fillStyle = '#e74c3c';
                this.ctx.beginPath();
                this.ctx.arc(playerX, playerY, this.cellSize * 0.35, 0, 2 * Math.PI);
                this.ctx.fill();
                
                // 玩家眼睛
                this.ctx.fillStyle = '#fff';
                this.ctx.beginPath();
                this.ctx.arc(playerX - this.cellSize * 0.1, playerY - this.cellSize * 0.1, this.cellSize * 0.08, 0, 2 * Math.PI);
                this.ctx.arc(playerX + this.cellSize * 0.1, playerY - this.cellSize * 0.1, this.cellSize * 0.08, 0, 2 * Math.PI);
                this.ctx.fill();
            }
            
            updateUI() {
                document.getElementById('steps').textContent = this.steps;
            }
            
            startTimer() {
                this.timerInterval = setInterval(() => {
                    if (!this.gameWon) {
                        const elapsed = Math.floor((Date.now() - this.startTime) / 1000);
                        const minutes = Math.floor(elapsed / 60);
                        const seconds = elapsed % 60;
                        document.getElementById('time').textContent = 
                            `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                    }
                }, 1000);
            }
            
            showVictory() {
                clearInterval(this.timerInterval);
                const elapsed = Math.floor((Date.now() - this.startTime) / 1000);
                const minutes = Math.floor(elapsed / 60);
                const seconds = elapsed % 60;
                
                document.getElementById('finalTime').textContent = 
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                document.getElementById('finalSteps').textContent = this.steps;
                document.getElementById('victoryMessage').style.display = 'block';
            }
            
            reset() {
                this.player = { x: 1, y: 1 };
                this.steps = 0;
                this.startTime = Date.now();
                this.gameWon = false;
                
                clearInterval(this.timerInterval);
                this.startTimer();
                this.updateUI();
                this.draw();
            }
            
            newMaze() {
                this.generateMaze();
                this.reset();
            }
        }
        
        // 游戏实例
        let game;
        
        // 初始化游戏
        function initGame() {
            game = new MazeGame();
        }
        
        // 生成新迷宫
        function generateNewMaze() {
            if (game) {
                game.newMaze();
            }
        }
        
        // 重新开始当前迷宫
        function resetGame() {
            if (game) {
                game.reset();
            }
        }
        
        // 隐藏胜利消息
        function hideVictory() {
            document.getElementById('victoryMessage').style.display = 'none';
            generateNewMaze();
        }
        
        // 窗口大小改变时重新初始化
        window.addEventListener('resize', () => {
            if (game) {
                game.setupCanvas();
                game.draw();
            }
        });
        
        // 页面加载完成后初始化游戏
        window.addEventListener('load', initGame);
    </script>
</body>
</html>
