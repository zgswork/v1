<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高级颜色提取工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 30px 0;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .main-content {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
        }
        
        .upload-section {
            flex: 1;
            min-width: 300px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }
        
        .drop-area {
            border: 3px dashed rgba(255,255,255,0.5);
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .drop-area:hover, .drop-area.dragover {
            background: rgba(255,255,255,0.15);
            border-color: #fff;
        }
        
        .drop-area i {
            font-size: 4rem;
            margin-bottom: 20px;
            color: rgba(255,255,255,0.7);
        }
        
        .drop-area h3 {
            font-size: 1.5rem;
            margin-bottom: 15px;
        }
        
        .drop-area p {
            margin-bottom: 20px;
            opacity: 0.8;
        }
        
        .btn {
            background: linear-gradient(to right, #4facfe, #00f2fe);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            font-weight: 600;
            margin-top: 10px;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        #file-input {
            display: none;
        }
        
        .results-section {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
        }
        
        .image-preview {
            background: rgba(0,0,0,0.2);
            border-radius: 15px;
            overflow: hidden;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        #preview {
            max-width: 100%;
            max-height: 100%;
            display: none;
        }
        
        .placeholder-text {
            text-align: center;
            color: rgba(255,255,255,0.6);
        }
        
        .colors-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            flex-grow: 1;
        }
        
        .section-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .colors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
        }
        
        .color-card {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
        }
        
        .color-card:hover {
            transform: translateY(-5px);
        }
        
        .color-preview {
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        
        .color-info {
            background: rgba(0,0,0,0.3);
            padding: 10px;
            text-align: center;
            font-size: 0.9rem;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            background: rgba(0,0,0,0.7);
            color: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transform: translateX(200%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        footer {
            text-align: center;
            padding: 30px 0;
            margin-top: 40px;
            font-size: 0.9rem;
            opacity: 0.7;
            width: 100%;
        }
        
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .colors-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>高级颜色提取工具</h1>
            <p class="subtitle">上传图片，自动提取图片中的主要颜色，获取十六进制颜色代码</p>
        </header>
        
        <div class="main-content">
            <div class="upload-section">
                <h2 class="section-title">上传图片</h2>
                <div class="drop-area" id="drop-area">
                    <i>📁</i>
                    <h3>拖放图片到这里</h3>
                    <p>支持 JPG, PNG, GIF 格式的图片</p>
                    <button class="btn" id="upload-btn">选择图片</button>
                    <input type="file" id="file-input" accept="image/*">
                </div>
            </div>
            
            <div class="results-section">
                <div class="image-preview">
                    <img id="preview" alt="图片预览">
                    <div class="placeholder-text" id="preview-placeholder">图片预览区域</div>
                </div>
                
                <div class="colors-container">
                    <h2 class="section-title">提取的颜色</h2>
                    <div class="colors-grid" id="colors-grid">
                        <div class="placeholder-text">上传图片后，这里将显示提取的颜色</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="notification" id="notification">颜色已复制到剪贴板!</div>
    </div>
    
    <footer>
        <p>© 2023 高级颜色提取工具 | 在手机和电脑上完美运行</p>
    </footer>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const dropArea = document.getElementById('drop-area');
            const fileInput = document.getElementById('file-input');
            const uploadBtn = document.getElementById('upload-btn');
            const preview = document.getElementById('preview');
            const previewPlaceholder = document.getElementById('preview-placeholder');
            const colorsGrid = document.getElementById('colors-grid');
            const notification = document.getElementById('notification');
            
            // 点击按钮触发文件选择
            uploadBtn.addEventListener('click', () => {
                fileInput.click();
            });
            
            // 文件选择变化
            fileInput.addEventListener('change', function() {
                if (this.files && this.files[0]) {
                    handleFile(this.files[0]);
                }
            });
            
            // 拖放功能
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, preventDefaults, false);
            });
            
            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }
            
            ['dragenter', 'dragover'].forEach(eventName => {
                dropArea.addEventListener(eventName, highlight, false);
            });
            
            ['dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, unhighlight, false);
            });
            
            function highlight() {
                dropArea.classList.add('dragover');
            }
            
            function unhighlight() {
                dropArea.classList.remove('dragover');
            }
            
            // 处理拖放文件
            dropArea.addEventListener('drop', handleDrop, false);
            
            function handleDrop(e) {
                const dt = e.dataTransfer;
                const file = dt.files[0];
                handleFile(file);
            }
            
            // 处理文件
            function handleFile(file) {
                // 检查文件类型
                if (!file.type.match('image.*')) {
                    alert('请上传图片文件!');
                    return;
                }
                
                // 显示预览
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    previewPlaceholder.style.display = 'none';
                    
                    // 提取颜色
                    extractColors(preview);
                }
                
                reader.readAsDataURL(file);
            }
            
            // 提取颜色函数
            function extractColors(img) {
                // 创建临时canvas
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // 设置canvas尺寸
                const maxSize = 200;
                let width = img.width;
                let height = img.height;
                
                if (width > height) {
                    if (width > maxSize) {
                        height *= maxSize / width;
                        width = maxSize;
                    }
                } else {
                    if (height > maxSize) {
                        width *= maxSize / height;
                        height = maxSize;
                    }
                }
                
                canvas.width = width;
                canvas.height = height;
                
                // 绘制图片到canvas
                ctx.drawImage(img, 0, 0, width, height);
                
                // 获取图片数据
                const imageData = ctx.getImageData(0, 0, width, height);
                const data = imageData.data;
                
                // 颜色统计
                const colorMap = {};
                
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];
                    const a = data[i + 3];
                    
                    // 忽略透明像素
                    if (a < 128) continue;
                    
                    const hex = rgbToHex(r, g, b);
                    
                    // 统计颜色出现次数
                    colorMap[hex] = (colorMap[hex] || 0) + 1;
                }
                
                // 转换为数组并排序
                const colors = Object.entries(colorMap)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 8) // 取前8个主要颜色
                    .map(item => item[0]);
                
                // 显示颜色
                displayColors(colors);
            }
            
            // RGB转十六进制
            function rgbToHex(r, g, b) {
                return '#' + [r, g, b]
                    .map(x => {
                        const hex = x.toString(16);
                        return hex.length === 1 ? '0' + hex : hex;
                    })
                    .join('');
            }
            
            // 显示颜色
            function displayColors(colors) {
                colorsGrid.innerHTML = '';
                
                colors.forEach(color => {
                    const colorCard = document.createElement('div');
                    colorCard.className = 'color-card';
                    
                    const colorPreview = document.createElement('div');
                    colorPreview.className = 'color-preview';
                    colorPreview.style.backgroundColor = color;
                    colorPreview.innerHTML = '<span style="background: rgba(0,0,0,0.5); padding: 3px 6px; border-radius: 4px;">点击复制</span>';
                    
                    const colorInfo = document.createElement('div');
                    colorInfo.className = 'color-info';
                    colorInfo.textContent = color;
                    
                    colorCard.appendChild(colorPreview);
                    colorCard.appendChild(colorInfo);
                    colorsGrid.appendChild(colorCard);
                    
                    // 添加点击复制功能
                    colorCard.addEventListener('click', () => {
                        copyToClipboard(color);
                        showNotification();
                    });
                });
            }
            
            // 复制到剪贴板
            function copyToClipboard(text) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
            }
            
            // 显示通知
            function showNotification() {
                notification.classList.add('show');
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 2000);
            }
            
            // 初始示例图片
            const sampleImage = new Image();
            sampleImage.onload = function() {
                extractColors(sampleImage);
            };
            sampleImage.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"><rect width="100%" height="100%" fill="%231a2a6c"/><rect x="20" y="20" width="160" height="50" fill="%23b21f1f" rx="10"/><circle cx="100" cy="120" r="40" fill="%23fdbb2d"/></svg>';
        });
    </script>
</body>
</html>
