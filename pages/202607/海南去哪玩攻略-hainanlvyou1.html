        // 获取DOM元素
        const resultDiv = document.getElementById('result');
        const getGuideBtn = document.getElementById('getGuide');
        const changeGuideBtn = document.getElementById('changeGuide');
        const downloadBtn = document.getElementById('downloadBtn');
        const modal = document.getElementById('downloadModal');
        const closeBtn = document.querySelector('.close');
        
        // 当前显示的景点索引
        let currentIndex = -1;
        
        // 获取随机景点
        function getRandomAttraction() {
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * attractions.length);
            } while (randomIndex === currentIndex && attractions.length > 1);
            
            currentIndex = randomIndex;
            return attractions[currentIndex];
        }
        
        // 显示景点攻略
        function showAttractionGuide() {
            const attraction = getRandomAttraction();
            
            resultDiv.innerHTML = `
                <h2>${attraction.name}</h2>
                <p><span class="info-label">景点介绍：</span>${attraction.description}</p>
                <p><span class="info-label">具体地址：</span>${attraction.address}</p>
                <p><span class="info-label">交通指南：</span>${attraction.transportation}</p>
                <p><span class="info-label">门票信息：</span>${attraction.ticket}</p>
                <p><span class="info-label">开放时间：</span>${attraction.openingHours}</p>
            `;
            
            resultDiv.style.display = 'block';
            changeGuideBtn.disabled = false;
        }
        
        // 显示下载弹窗
        function showDownloadModal() {
            modal.style.display = 'block';
        }
        
        // 关闭弹窗
        function closeModal() {
            modal.style.display = 'none';
        }
        
        // 点击弹窗外部关闭
        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }
        
        // 事件监听
        getGuideBtn.addEventListener('click', showAttractionGuide);
        changeGuideBtn.addEventListener('click', showAttractionGuide);
        downloadBtn.addEventListener('click', showDownloadModal);
        closeBtn.addEventListener('click', closeModal);
    </script>
</body>
</html>
