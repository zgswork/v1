<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日喝水打卡</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f0f8ff;
            color: #333;
            text-align: center;
        }
        
        h1 {
            color: #1e90ff;
            margin-bottom: 30px;
        }
        
        .streak {
            font-size: 18px;
            color: #ff6b6b;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .water-cup {
            width: 200px;
            height: 300px;
            margin: 0 auto 30px;
            background-color: #e6f2ff;
            border: 5px solid #1e90ff;
            border-radius: 0 0 50px 50px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.5s ease;
        }
        
        .water {
            position: absolute;
            bottom: 0;
            width: 100%;
            background-color: #1e90ff;
            transition: height 0.5s ease;
            border-radius: 0 0 45px 45px;
            animation: wave 5s infinite linear;
        }
        
        .water-level {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-weight: bold;
            font-size: 24px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
            z-index: 2;
        }
        
        .input-section {
            margin-bottom: 30px;
        }
        
        input {
            padding: 10px;
            width: 150px;
            border: 2px solid #1e90ff;
            border-radius: 5px;
            font-size: 16px;
            margin-right: 10px;
        }
        
        button {
            padding: 10px 20px;
            background-color: #1e90ff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #0066cc;
        }
        
        .total {
            font-size: 18px;
            margin-bottom: 20px;
            color: #1e90ff;
            font-weight: bold;
        }
        
        .log {
            margin-top: 30px;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
            padding: 10px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .log-entry {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            color: #0066cc;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes wave {
            0% { transform: translateX(0) translateY(0) rotate(0); }
            50% { transform: translateX(-5px) translateY(-5px) rotate(2deg); }
            100% { transform: translateX(0) translateY(0) rotate(0); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .goal-section {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        
        .goal {
            font-size: 16px;
            color: #666;
        }
        
        .progress-bar {
            height: 10px;
            background-color: #e6f2ff;
            border-radius: 5px;
            margin: 10px 0;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            background-color: #1e90ff;
            width: 0%;
            transition: width 0.5s ease;
        }
        
        .edit-goal {
            color: #1e90ff;
            cursor: pointer;
            font-size: 14px;
        }
        
        .goal-input {
            display: none;
            width: 80px;
        }
        
        .reset-notice {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            animation: fadeIn 0.5s ease;
            display: none;
        }
        
        .celebration h2 {
            color: #1e90ff;
            font-size: 32px;
            margin-bottom: 20px;
        }
        
        .celebration p {
            font-size: 20px;
            margin-bottom: 30px;
        }
        
        .celebration button {
            background-color: #ff6b6b;
            font-size: 18px;
        }
        
        .celebration button:hover {
            background-color: #ff4757;
        }
        
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            opacity: 0.7;
            animation: confettiFall 5s linear forwards;
        }
        
        @keyframes confettiFall {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
        
        .full-cup {
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 rgba(30, 144, 255, 0.7); }
            50% { transform: scale(1.05); box-shadow: 0 0 20px rgba(30, 144, 255, 0.7); }
            100% { transform: scale(1); box-shadow: 0 0 0 rgba(30, 144, 255, 0.7); }
        }
    </style>
</head>
<body>
    <h1>每日喝水打卡</h1>
    
    <div class="streak" id="streak">连续打卡第1天</div>
    
    <div class="water-cup" id="water-cup">
        <div class="water" id="water"></div>
        <div class="water-level" id="water-level">0ml</div>
    </div>
    
    <div class="total" id="total">今日喝水量: 0ml</div>
    
    <div class="progress-bar">
        <div class="progress" id="progress"></div>
    </div>
    
    <div class="goal-section">
        <div class="goal" id="goal">目标: 2000ml (0%)</div>
        <span class="edit-goal" onclick="showGoalInput()">修改</span>
        <input type="number" id="goal-input" class="goal-input" min="100" value="2000">
        <button id="save-goal-btn" class="goal-input" onclick="saveGoal()">保存</button>
    </div>
    
    <div class="input-section">
        <input type="number" id="water-input" placeholder="输入水量(ml)" min="0">
        <button onclick="addWater()">打卡喝水</button>
    </div>
    
    <div class="reset-notice" id="reset-notice">新的一天开始了！昨日数据已存档，今日重新开始记录。</div>
    
    <div class="log" id="log"></div>
    
    <div class="celebration" id="celebration">
        <h2>🎉 恭喜！ 🎉</h2>
        <p>你今天已经喝够了<span id="goal-amount"></span>ml水！</p>
        <p>继续保持健康的生活习惯！</p>
        <button onclick="closeCelebration()">太棒了！</button>
    </div>
    
    <script>
        // 从本地存储加载数据
        let today = new Date().toLocaleDateString();
        let waterData = JSON.parse(localStorage.getItem('waterData')) || {};
        let streakData = JSON.parse(localStorage.getItem('streakData')) || {};
        let hasShownCelebration = false;
        
        // 检查是否是连续打卡
        function checkStreak() {
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            const yesterdayStr = yesterday.toLocaleDateString();
            
            // 如果是第一次使用
            if (!streakData.lastDate) {
                streakData = {
                    lastDate: today,
                    streakDays: 1
                };
            } 
            // 如果是新的一天
            else if (streakData.lastDate !== today) {
                // 检查是否是连续打卡（昨天有记录）
                if (streakData.lastDate === yesterdayStr) {
                    streakData.streakDays += 1;
                } else {
                    streakData.streakDays = 1; // 不连续，重置为1
                }
                streakData.lastDate = today;
                
                // 显示新一天通知
                document.getElementById('reset-notice').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('reset-notice').style.display = 'none';
                }, 5000);
            }
            
            localStorage.setItem('streakData', JSON.stringify(streakData));
            document.getElementById('streak').textContent = `连续打卡第${streakData.streakDays}天`;
        }
        
        // 如果不是今天的数据，重置今日数据但保留目标
        if (waterData.date !== today) {
            const dailyGoal = waterData.dailyGoal || 2000; // 保留之前设置的目标
            
            waterData = {
                date: today,
                total: 0,
                logs: [],
                dailyGoal: dailyGoal,
                history: waterData.history || [], // 保留历史记录
                goalReached: false // 重置目标达成状态
            };
            
            // 将昨天的数据存入历史
            if (waterData.date) {
                waterData.history.push({
                    date: waterData.date,
                    total: waterData.total,
                    goal: waterData.dailyGoal,
                    goalReached: waterData.goalReached || false
                });
            }
            
            saveData();
            hasShownCelebration = false;
        } else {
            hasShownCelebration = waterData.goalReached || false;
        }
        
        // 初始化页面
        checkStreak();
        updateWaterDisplay();
        
        // 添加水量
        function addWater() {
            const input = document.getElementById('water-input');
            const amount = parseInt(input.value);
            
            if (isNaN(amount) || amount <= 0) {
                alert('请输入有效的水量');
                return;
            }
            
            // 更新数据
            waterData.total += amount;
            waterData.logs.push({
                time: new Date().toLocaleTimeString(),
                amount: amount
            });
            
            // 检查是否达到目标
            const dailyGoal = waterData.dailyGoal || 2000;
            if (waterData.total >= dailyGoal && !waterData.goalReached) {
                waterData.goalReached = true;
                showCelebration();
            }
            
            // 保存到本地存储
            saveData();
            
            // 更新显示
            updateWaterDisplay();
            
            // 添加日志条目
            addLogEntry(amount);
            
            // 清空输入框
            input.value = '';
            
            // 水波动画
            animateWater();
        }
        
        // 显示庆祝效果
        function showCelebration() {
            const celebration = document.getElementById('celebration');
            const goalAmount = document.getElementById('goal-amount');
            const dailyGoal = waterData.dailyGoal || 2000;
            
            goalAmount.textContent = dailyGoal;
            celebration.style.display = 'flex';
            
            // 添加彩色纸屑效果
            createConfetti();
            
            // 水杯动画
            document.getElementById('water-cup').classList.add('full-cup');
            
            hasShownCelebration = true;
        }
        
        // 关闭庆祝效果
        function closeCelebration() {
            document.getElementById('celebration').style.display = 'none';
            document.getElementById('water-cup').classList.remove('full-cup');
        }
        
        // 创建彩色纸屑
        function createConfetti() {
            const colors = ['#f00', '#0f0', '#00f', '#ff0', '#f0f', '#0ff'];
            
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.width = Math.random() * 10 + 5 + 'px';
                confetti.style.height = Math.random() * 10 + 5 + 'px';
                confetti.style.animationDuration = Math.random() * 3 + 2 + 's';
                document.getElementById('celebration').appendChild(confetti);
                
                // 动画结束后移除
                setTimeout(() => {
                    confetti.remove();
                }, 5000);
            }
        }
        
        // 更新水杯显示
        function updateWaterDisplay() {
            const total = waterData.total;
            const dailyGoal = waterData.dailyGoal || 2000;
            const waterElement = document.getElementById('water');
            const waterLevelElement = document.getElementById('water-level');
            const totalElement = document.getElementById('total');
            const progressElement = document.getElementById('progress');
            const goalElement = document.getElementById('goal');
            
            // 计算水的高度(最大为杯子高度的90%)
            const maxHeight = 270; // 杯子高度300px - 30px底部空间
            const height = Math.min(maxHeight, (total / dailyGoal) * maxHeight);
            
            waterElement.style.height = `${height}px`;
            waterLevelElement.textContent = `${total}ml`;
            totalElement.textContent = `今日喝水量: ${total}ml`;
            
            // 更新进度条
            const percentage = Math.min(100, Math.round((total / dailyGoal) * 100));
            progressElement.style.width = `${percentage}%`;
            goalElement.textContent = `目标: ${dailyGoal}ml (${percentage}%)`;
            
            // 根据水量改变水的颜色
            if (percentage >= 100) {
                waterElement.style.backgroundColor = '#00bfff'; // 达到目标后变为亮蓝色
                goalElement.innerHTML = `目标: ${dailyGoal}ml (<span style="color:green;font-weight:bold">已完成!</span>)`;
                
                // 如果是刚刚达到目标，显示庆祝效果
                if (!hasShownCelebration && waterData.goalReached) {
                    showCelebration();
                }
            } else if (percentage > 70) {
                waterElement.style.backgroundColor = '#1e90ff'; // 深蓝色
            } else if (percentage > 30) {
                waterElement.style.backgroundColor = '#4da6ff'; // 中等蓝色
            } else {
                waterElement.style.backgroundColor = '#80c1ff'; // 浅蓝色
            }
        }
        
        // 添加日志条目
        function addLogEntry(amount) {
            const logElement = document.getElementById('log');
            const now = new Date();
            const timeString = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `[${timeString}] 喝水量增加了 <strong>${amount}ml</strong>，你的身体感谢你！`;
            
            logElement.insertBefore(entry, logElement.firstChild);
            
            // 限制日志条目数量
            if (logElement.children.length > 10) {
                logElement.removeChild(logElement.lastChild);
            }
        }
        
        // 水波动画
        function animateWater() {
            const water = document.getElementById('water');
            water.style.animation = 'none';
            void water.offsetWidth; // 触发重绘
            water.style.animation = 'wave 5s infinite linear';
        }
        
        // 保存数据到本地存储
        function saveData() {
            localStorage.setItem('waterData', JSON.stringify(waterData));
        }
        
        // 显示目标输入框
        function showGoalInput() {
            document.querySelector('.goal').style.display = 'none';
            document.querySelector('.edit-goal').style.display = 'none';
            document.getElementById('goal-input').style.display = 'inline-block';
            document.getElementById('save-goal-btn').style.display = 'inline-block';
            document.getElementById('goal-input').value = waterData.dailyGoal || 2000;
            document.getElementById('goal-input').focus();
        }
        
        // 保存目标水量
        function saveGoal() {
            const goalInput = document.getElementById('goal-input');
            const newGoal = parseInt(goalInput.value);
            
            if (isNaN(newGoal) || newGoal < 100) {
                alert('请输入有效的目标水量（至少100ml）');
                return;
            }
            
            waterData.dailyGoal = newGoal;
            saveData();
            
            // 隐藏输入框，显示目标
            document.querySelector('.goal').style.display = 'block';
            document.querySelector('.edit-goal').style.display = 'inline';
            document.getElementById('goal-input').style.display = 'none';
            document.getElementById('save-goal-btn').style.display = 'none';
            
            // 更新显示
            updateWaterDisplay();
        }
        
        // 按回车键也可以打卡
        document.getElementById('water-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addWater();
            }
        });
        
        // 目标输入框也可以按回车保存
        document.getElementById('goal-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                saveGoal();
            }
        });
        
        // 初始化日志
        function initLog() {
            const logElement = document.getElementById('log');
            logElement.innerHTML = '';
            
            if (waterData.logs.length === 0) {
                const entry = document.createElement('div');
                entry.className = 'log-entry';
                entry.textContent = '今天还没有喝水记录，快喝第一杯水吧！';
                logElement.appendChild(entry);
            } else {
                waterData.logs.slice().reverse().forEach(log => {
                    const entry = document.createElement('div');
                    entry.className = 'log-entry';
                    entry.innerHTML = `[${log.time}] 喝水量增加了 <strong>${log.amount}ml</strong>，你的身体感谢你！`;
                    logElement.appendChild(entry);
                });
            }
        }
        
        // 初始化日志显示
        initLog();
    </script>
</body>
</html>
