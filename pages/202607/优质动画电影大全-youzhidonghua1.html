        // 获取DOM元素
        const recommendBtn = document.getElementById('recommend-btn');
        const changeBtn = document.getElementById('change-btn');
        const downloadBtn = document.getElementById('download-btn');
        const modal = document.getElementById('download-modal');
        const closeBtn = document.querySelector('.close-btn');
        const moviePlaceholder = document.querySelector('.movie-placeholder');
        const movieInfo = document.querySelector('.movie-info');
        const movieTitle = document.querySelector('.movie-title');
        const movieCountry = document.querySelector('.movie-country');
        const movieCast = document.querySelector('.movie-cast');
        const movieDescription = document.querySelector('.movie-description');
        const ratingStars = document.querySelector('.rating-stars');
        const ratingText = document.querySelector('.rating-text');
        const reasonText = document.querySelector('.reason-text');

        // 记录已推荐的电影索引
        let recommendedMovies = [];
        let currentMovieIndex = -1;

        // 推荐电影函数
        function recommendMovie() {
            // 如果所有电影都已推荐过，重置记录
            if (recommendedMovies.length === movies.length) {
                recommendedMovies = [];
            }

            // 随机选择一部未推荐过的电影
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * movies.length);
            } while (recommendedMovies.includes(randomIndex));

            recommendedMovies.push(randomIndex);
            currentMovieIndex = randomIndex;
            displayMovie(randomIndex);

            // 启用"换一部"按钮
            changeBtn.disabled = false;
        }

        // 换一部电影函数
        function changeMovie() {
            // 如果所有电影都已推荐过，重置记录
            if (recommendedMovies.length === movies.length) {
                recommendedMovies = [];
            }

            // 随机选择一部未推荐过的电影
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * movies.length);
            } while (recommendedMovies.includes(randomIndex));

            recommendedMovies.push(randomIndex);
            currentMovieIndex = randomIndex;
            displayMovie(randomIndex);
        }

        // 显示电影信息函数
        function displayMovie(index) {
            const movie = movies[index];

            // 隐藏占位符，显示电影信息
            moviePlaceholder.style.display = 'none';
            movieInfo.style.display = 'block';

            // 填充电影信息
            movieTitle.textContent = movie.title;
            movieCountry.textContent = `国家: ${movie.country}`;
            movieCast.textContent = `主演: ${movie.cast}`;
            movieDescription.textContent = movie.description;
            reasonText.textContent = movie.reason;

            // 计算评分对应的星星
            const rating = movie.rating;
            const fullStars = Math.floor(rating / 2);
            const halfStar = rating % 2 >= 0.5 ? 1 : 0;
            const emptyStars = 5 - fullStars - halfStar;

            let starsHtml = '';
            for (let i = 0; i < fullStars; i++) {
                starsHtml += '★';
            }
            if (halfStar) {
                starsHtml += '☆';
            }
            for (let i = 0; i < emptyStars; i++) {
                starsHtml += '☆';
            }

            ratingStars.innerHTML = starsHtml;
            ratingText.textContent = `豆瓣评分: ${rating}/10`;
        }

        // 弹窗显示函数
        function showModal() {
            modal.style.display = 'block';
        }

        // 弹窗隐藏函数
        function hideModal() {
            modal.style.display = 'none';
        }

        // 点击弹窗外部关闭
        window.onclick = function(event) {
            if (event.target == modal) {
                hideModal();
            }
        }

        // 添加事件监听器
        recommendBtn.addEventListener('click', recommendMovie);
        changeBtn.addEventListener('click', changeMovie);
        downloadBtn.addEventListener('click', showModal);
        closeBtn.addEventListener('click', hideModal);
    </script>
