                复制结果

            <button 
                id="clearBtn"

        <div class="mt-8 bg-neutral rounded-lg p-5 border border-gray-200">
            <h3 class="font-semibold text-gray-800 mb-2">使用说明</h3>
            <ul class="list-disc list-inside text-gray-700 space-y-1">
                <li>1. 在左侧输入框中粘贴需要精简的PPT文案（支持大段文字）</li>
                <li>2. 点击「开始精简」按钮，系统会自动提取核心观点（保留主谓宾，去除修饰词）</li>
                <li>3. 精简结果显示在右侧输入框，可点击「复制结果」直接粘贴到PPT中</li>
                <li>4. 点击「清空内容」可重置输入和输出框</li>
            </ul>
        </div>
    </main>
