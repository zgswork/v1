<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">专业化妆补光灯 | Professional Makeup Light</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }
        
        .author-info {
            position: absolute;
            top: 20px;
            right: 20px;
            text-align: right;
            color: #666;
            font-size: 14px;
            line-height: 1.4;
        }
        
        .author-info a {
            color: #4dabf7;
            text-decoration: none;
        }
        
        .author-info a:hover {
            text-decoration: underline;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            margin-top: 40px;
        }
        
        .light-container {
            width: 300px;
            height: 400px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s;
            background-color: #fff8e1;
            position: relative;
        }
        
        .light-container.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border-radius: 0;
            z-index: 1000;
            margin: 0;
            cursor: none;
        }
        
        .controls {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            width: 300px;
            z-index: 1001;
            transition: all 0.3s ease-out;
        }
        
        .controls.fullscreen {
            position: fixed;
            bottom: -200px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            width: 80%;
            max-width: 500px;
        }
        
        .controls.fullscreen.visible {
            bottom: 20px;
            opacity: 1;
        }
        
        .color-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .color-btn {
            height: 40px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }
        
        .color-btn::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255,255,255,0.3);
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .color-btn.active::after {
            opacity: 1;
        }
        
        .color-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
        }
        
        .brightness-control {
            width: 100%;
            margin: 20px 0;
        }
        
        .power-btn {
            width: 100%;
            padding: 12px;
            background-color: #ff6b6b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-bottom: 10px;
        }
        
        .power-btn.on {
            background-color: #51cf66;
        }
        
        .fullscreen-btn {
            width: 100%;
            padding: 12px;
            background-color: #4dabf7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-bottom: 10px;
        }
        
        .language-btn {
            width: 100%;
            padding: 12px;
            background-color: #7950f2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .description {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
            text-align: center;
            max-width: 300px;
        }
        
        .fullscreen-close {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: rgba(0,0,0,0.5);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            z-index: 1002;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .fullscreen-close.visible {
            opacity: 1;
        }
        
        .mouse-move-detector {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            display: none;
        }
        
        .fullscreen-hint {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            z-index: 1003;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        
        .fullscreen-hint.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="author-info">
        作者：老木头<br>
        合作邮箱：<a href="/cdn-cgi/l/email-protection#c0aba5b9b5a5f0f2f0f280afb5b4acafafabeea3afad"><span class="__cf_email__" data-cfemail="deb5bba7abbbeeeceeec9eb1abaab2b1b1b5f0bdb1b3">[email&#160;protected]</span></a>
    </div>

    <h1 id="main-heading">专业化妆补光灯</h1>
    
    <div class="light-container" id="light"></div>
    
    <div class="controls" id="controls">
        <h3 id="color-heading">选择光线色调</h3>
        <div class="color-options">
            <button class="color-btn active" style="background-color: #fff8e1;" onclick="changeColor('#fff8e1', '暖白光', 'Warm White', this)"></button>
            <button class="color-btn" style="background-color: #fffaf0;" onclick="changeColor('#fffaf0', '自然光', 'Natural Light', this)"></button>
            <button class="color-btn" style="background-color: #f0fff0;" onclick="changeColor('#f0fff0', '冷白光', 'Cool White', this)"></button>
            <button class="color-btn" style="background-color: #fff0f5;" onclick="changeColor('#fff0f5', '粉色调', 'Pink Tone', this)"></button>
            <button class="color-btn" style="background-color: #f0f8ff;" onclick="changeColor('#f0f8ff', '蓝调光', 'Blue Tone', this)"></button>
            <button class="color-btn" style="background-color: #fffff0;" onclick="changeColor('#fffff0', '黄调光', 'Yellow Tone', this)"></button>
        </div>
        
        <h3 id="brightness-heading">亮度调节</h3>
        <input type="range" min="10" max="100" value="50" class="brightness-control" id="brightness">
        
        <button class="power-btn" id="power" onclick="togglePower()">开启补光灯</button>
        <button class="fullscreen-btn" id="fullscreen" onclick="toggleLightFullscreen()">进入全屏模式</button>
        <button class="language-btn" id="language" onclick="toggleLanguage()">Switch to English</button>
    </div>
    
    <div class="description" id="description">
        <p>根据不同化妆需求选择光线色调：暖光适合日常妆，冷光适合精致妆容，粉色适合腮红修容。</p>
    </div>
    
    <button class="fullscreen-close" id="fullscreenClose" onclick="exitLightFullscreen()">×</button>
    <div class="mouse-move-detector" id="mouseMoveDetector"></div>
    <div class="fullscreen-hint" id="fullscreenHint">按ESC退出全屏模式</div>
    
    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        const light = document.getElementById('light');
        const powerBtn = document.getElementById('power');
        const brightnessControl = document.getElementById('brightness');
        const fullscreenBtn = document.getElementById('fullscreen');
        const languageBtn = document.getElementById('language');
        const controls = document.getElementById('controls');
        const fullscreenClose = document.getElementById('fullscreenClose');
        const mouseMoveDetector = document.getElementById('mouseMoveDetector');
        const fullscreenHint = document.getElementById('fullscreenHint');
        const colorButtons = document.querySelectorAll('.color-btn');
        let isOn = false;
        let currentColor = '#fff8e1';
        let isEnglish = false;
        let isLightFullscreen = false;
        let controlsTimeout;
        let lastMouseMoveTime = 0;
        let mouseY = 0;
        
        // 初始化灯光颜色
        light.style.backgroundColor = currentColor;
        
        // 文本内容对象
        const textContent = {
            zh: {
                title: "专业化妆补光灯",
                heading: "专业化妆补光灯",
                colorHeading: "选择光线色调",
                brightnessHeading: "亮度调节",
                powerOn: "开启补光灯",
                powerOff: "关闭补光灯",
                fullscreen: "进入全屏模式",
                exitFullscreen: "退出全屏模式",
                switchLanguage: "Switch to English",
                description: "根据不同化妆需求选择光线色调：暖光适合日常妆，冷光适合精致妆容，粉色适合腮红修容。",
                colorNames: {
                    warmWhite: "暖白光",
                    naturalLight: "自然光",
                    coolWhite: "冷白光",
                    pinkTone: "粉色调",
                    blueTone: "蓝调光",
                    yellowTone: "黄调光"
                },
                hint: "按ESC退出全屏模式"
            },
            en: {
                title: "Professional Makeup Light",
                heading: "Professional Makeup Light",
                colorHeading: "Select Light Tone",
                brightnessHeading: "Brightness Control",
                powerOn: "Turn On Light",
                powerOff: "Turn Off Light",
                fullscreen: "Enter Fullscreen",
                exitFullscreen: "Exit Fullscreen",
                switchLanguage: "切换至中文",
                description: "Choose light tones for different makeup needs: warm light for daily makeup, cool light for precision makeup, pink tone for blush and contouring.",
                colorNames: {
                    warmWhite: "Warm White",
                    naturalLight: "Natural Light",
                    coolWhite: "Cool White",
                    pinkTone: "Pink Tone",
                    blueTone: "Blue Tone",
                    yellowTone: "Yellow Tone"
                },
                hint: "Press ESC to exit fullscreen"
            }
        };
        
        function togglePower() {
            isOn = !isOn;
            if (isOn) {
                light.style.backgroundColor = currentColor;
                powerBtn.textContent = isEnglish ? textContent.en.powerOff : textContent.zh.powerOff;
                powerBtn.classList.add('on');
            } else {
                light.style.backgroundColor = '#ffffff';
                powerBtn.textContent = isEnglish ? textContent.en.powerOn : textContent.zh.powerOn;
                powerBtn.classList.remove('on');
            }
        }
        
        function changeColor(color, zhName, enName, button) {
            currentColor = color;
            light.style.backgroundColor = color;
            
            // 更新按钮激活状态
            colorButtons.forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
            
            // 如果灯光关闭状态选择了颜色，自动开启灯光
            if (!isOn) {
                isOn = true;
                powerBtn.textContent = isEnglish ? textContent.en.powerOff : textContent.zh.powerOff;
                powerBtn.classList.add('on');
            }
            
            console.log(isEnglish ? `Selected ${enName} tone` : `已选择 ${zhName} 色调`);
        }
        
        brightnessControl.addEventListener('input', function() {
            const opacity = this.value / 100;
            light.style.opacity = opacity;
        });
        
        function toggleLightFullscreen() {
            if (!isLightFullscreen) {
                // 进入灯光全屏模式
                light.classList.add('fullscreen');
                controls.classList.add('fullscreen');
                mouseMoveDetector.style.display = 'block';
                fullscreenClose.style.display = 'block';
                setTimeout(() => {
                    fullscreenClose.classList.add('visible');
                }, 10);
                fullscreenBtn.textContent = isEnglish ? textContent.en.exitFullscreen : textContent.zh.exitFullscreen;
                isLightFullscreen = true;
                
                // 显示提示信息
                showHint();
                
                // 3秒后隐藏控制面板
                controlsTimeout = setTimeout(hideControls, 3000);
            } else {
                exitLightFullscreen();
            }
        }
        
        function exitLightFullscreen() {
            light.classList.remove('fullscreen');
            controls.classList.remove('fullscreen');
            controls.classList.remove('visible');
            mouseMoveDetector.style.display = 'none';
            fullscreenClose.style.display = 'none';
            fullscreenClose.classList.remove('visible');
            fullscreenBtn.textContent = isEnglish ? textContent.en.fullscreen : textContent.zh.fullscreen;
            isLightFullscreen = false;
            clearTimeout(controlsTimeout);
        }
        
        function showControls() {
            if (isLightFullscreen) {
                controls.classList.add('visible');
                fullscreenClose.classList.add('visible');
                clearTimeout(controlsTimeout);
                controlsTimeout = setTimeout(hideControls, 3000);
            }
        }
        
        function hideControls() {
            if (isLightFullscreen) {
                controls.classList.remove('visible');
                fullscreenClose.classList.remove('visible');
            }
        }
        
        function showHint() {
            fullscreenHint.textContent = isEnglish ? textContent.en.hint : textContent.zh.hint;
            fullscreenHint.classList.add('visible');
            setTimeout(() => {
                fullscreenHint.classList.remove('visible');
            }, 3000);
        }
        
        // 鼠标移动检测
        let lastY = 0;
        let movementThreshold = 50; // 鼠标移动阈值
        let lastShowTime = 0;
        let showCooldown = 1000; // 显示冷却时间(毫秒)
        
        mouseMoveDetector.addEventListener('mousemove', (e) => {
            const now = Date.now();
            const currentY = e.clientY;
            
            // 检测上下挥动动作
            if (Math.abs(currentY - lastY) > movementThreshold && 
                (now - lastShowTime) > showCooldown) {
                showControls();
                lastShowTime = now;
            }
            
            lastY = currentY;
            
            // 普通鼠标移动也显示控制面板
            showControls();
        });
        
        // 控制面板区域鼠标交互
        controls.addEventListener('mouseenter', () => {
            clearTimeout(controlsTimeout);
        });
        
        controls.addEventListener('mouseleave', () => {
            if (isLightFullscreen) {
                controlsTimeout = setTimeout(hideControls, 1000);
            }
        });
        
        // 监听ESC键退出全屏
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && isLightFullscreen) {
                exitLightFullscreen();
            }
        });
        
        function toggleLanguage() {
            isEnglish = !isEnglish;
            updateLanguage();
        }
        
        function updateLanguage() {
            const lang = isEnglish ? 'en' : 'zh';
            document.getElementById('page-title').textContent = textContent[lang].title;
            document.getElementById('main-heading').textContent = textContent[lang].heading;
            document.getElementById('color-heading').textContent = textContent[lang].colorHeading;
            document.getElementById('brightness-heading').textContent = textContent[lang].brightnessHeading;
            document.getElementById('description').innerHTML = `<p>${textContent[lang].description}</p>`;
            languageBtn.textContent = textContent[lang].switchLanguage;
            
            // 更新按钮文本
            powerBtn.textContent = isOn ? 
                (isEnglish ? textContent.en.powerOff : textContent.zh.powerOff) : 
                (isEnglish ? textContent.en.powerOn : textContent.zh.powerOn);
                
            fullscreenBtn.textContent = isLightFullscreen ? 
                (isEnglish ? textContent.en.exitFullscreen : textContent.zh.exitFullscreen) : 
                (isEnglish ? textContent.en.fullscreen : textContent.zh.fullscreen);
        }
    </script>
</body>
</html>
