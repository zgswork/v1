<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全平台图片去水印工具</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --success: #4cc9f0;
            --danger: #f72585;
            --dark: #1d3557;
            --light: #f1faee;
            --background: linear-gradient(135deg, #1a2a6c, #003049, #780000);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        
        body {
            background: var(--background);
            color: var(--light);
            min-height: 100vh;
            padding: 15px;
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 15px;
        }
        
        header {
            text-align: center;
            padding: 15px 0;
            margin-bottom: 20px;
            position: relative;
        }
        
        .header-content {
            background: rgba(29, 53, 87, 0.7);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #ffd166;
            background: linear-gradient(to right, #ffd166, #ff9e00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            font-size: 1.1rem;
            max-width: 800px;
            margin: 0 auto;
            color: #e9f5db;
        }
        
        .app-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 15px;
        }
        
        .control-panel {
            background: rgba(29, 53, 87, 0.85);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .preview-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .preview-box {
            background: rgba(29, 53, 87, 0.85);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .canvas-container {
            position: relative;
            flex: 1;
            overflow: auto;
            border-radius: 8px;
            background: #1d2d44;
            -webkit-overflow-scrolling: touch;
            touch-action: none;
        }
        
        canvas {
            display: block;
            max-width: 100%;
            margin: 0 auto;
            cursor: pointer;
            touch-action: none;
        }
        
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }
        
        .btn {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(67, 97, 238, 0.3);
            flex: 1;
            min-width: 120px;
            justify-content: center;
        }
        
        .btn:active {
            transform: translateY(2px);
        }
        
        .btn-remove {
            background: linear-gradient(to right, #ff9e00, #ff5400);
        }
        
        .btn-download {
            background: linear-gradient(to right, #2ecc71, #27ae60);
        }
        
        .btn-reset {
            background: linear-gradient(to right, #9d4edd, #5a189a);
        }
        
        .control-group {
            background: rgba(255, 255, 255, 0.08);
            padding: 15px;
            border-radius: 10px;
        }
        
        .control-group h3 {
            margin-bottom: 12px;
            color: #ffd166;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
        }
        
        .slider-container {
            margin: 15px 0;
        }
        
        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 4px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }
        
        .file-label {
            display: block;
            padding: 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 15px;
        }
        
        .file-label i {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--success);
        }
        
        .status {
            padding: 12px;
            margin-top: 12px;
            border-radius: 8px;
            background: rgba(52, 152, 219, 0.2);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }
        
        .progress-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-top: 8px;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(to right, var(--primary), var(--success));
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .selection-info {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 0.85rem;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .info-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
            min-width: 100px;
            flex: 1;
        }
        
        .info-card h4 {
            color: #ffd166;
            margin-bottom: 5px;
            font-size: 0.85rem;
        }
        
        .mobile-tips {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 0.9rem;
            display: none;
        }
        
        .mobile-tips h4 {
            color: #ffd166;
            margin-bottom: 8px;
        }
        
        footer {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            font-size: 0.85rem;
            opacity: 0.8;
        }
        
        .watermark-preview {
            position: absolute;
            border: 2px dashed #f72585;
            background: rgba(247, 37, 133, 0.2);
            pointer-events: none;
            display: none;
        }
        
        /* 移动设备优化 */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .subtitle {
                font-size: 0.95rem;
            }
            
            .btn {
                padding: 12px 15px;
                font-size: 13px;
                min-width: auto;
            }
            
            .file-label {
                padding: 15px;
            }
            
            .mobile-tips {
                display: block;
            }
        }
        
        @media (min-width: 768px) {
            .app-container {
                flex-direction: row;
            }
            
            .control-panel {
                flex: 1;
                max-width: 350px;
            }
            
            .preview-area {
                flex: 2;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }
            
            .preview-box {
                height: auto;
            }
        }
        
        /* 防止移动设备上的缩放 */
        @media (pointer: coarse) {
            body {
                touch-action: manipulation;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1><i class="fas fa-water"></i> 全平台去水印工具</h1>
                <p class="subtitle">完美支持手机和电脑设备 - 触摸选择水印区域</p>
            </div>
        </header>
        
        <div class="app-container">
            <div class="control-panel">
                <div class="control-group">
                    <h3><i class="fas fa-upload"></i> 图片上传</h3>
                    <input type="file" id="fileInput" class="file-input" accept="image/*">
                    <label for="fileInput" class="file-label">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <div>点击或拖放图片到此处</div>
                        <div class="small">支持 JPG, PNG, WEBP 格式</div>
                    </label>
                    
                    <button id="resetBtn" class="btn btn-reset">
                        <i class="fas fa-redo"></i>
                        <span>重置图片</span>
                    </button>
                </div>
                
                <div class="control-group">
                    <h3><i class="fas fa-sliders-h"></i> 处理设置</h3>
                    <div class="slider-container">
                        <div class="slider-label">
                            <span>修复强度</span>
                            <span id="strengthValue">75%</span>
                        </div>
                        <input type="range" id="strengthSlider" min="1" max="100" value="75">
                    </div>
                    
                    <div class="slider-container">
                        <div class="slider-label">
                            <span>边缘平滑</span>
                            <span id="smoothValue">60%</span>
                        </div>
                        <input type="range" id="smoothSlider" min="0" max="100" value="60">
                    </div>
                    
                    <div class="slider-container">
                        <div class="slider-label">
                            <span>采样半径</span>
                            <span id="radiusValue">8 像素</span>
                        </div>
                        <input type="range" id="radiusSlider" min="1" max="20" value="8">
                    </div>
                </div>
                
                <div class="control-group">
                    <h3><i class="fas fa-history"></i> 操作记录</h3>
                    <div class="selection-info">
                        <div class="info-card">
                            <h4>当前选区</h4>
                            <div id="selectionInfo">未选择</div>
                        </div>
                        <div class="info-card">
                            <h4>历史操作</h4>
                            <div id="historyCount">0 次</div>
                        </div>
                        <div class="info-card">
                            <h4>处理区域</h4>
                            <div id="areaCount">0 个</div>
                        </div>
                    </div>
                    
                    <button id="undoBtn" class="btn">
                        <i class="fas fa-undo"></i>
                        <span>撤销操作</span>
                    </button>
                </div>
                
                <div class="mobile-tips">
                    <h4><i class="fas fa-mobile-alt"></i> 手机操作提示</h4>
                    <p>1. 单指拖动选择水印区域</p>
                    <p>2. 双指缩放图片</p>
                    <p>3. 单指拖动移动图片位置</p>
                </div>
            </div>
            
            <div class="preview-area">
                <div class="preview-box">
                    <div class="preview-header">
                        <h2><i class="fas fa-image"></i> 原始图片</h2>
                        <span id="originalSize">未选择图片</span>
                    </div>
                    <div class="canvas-container">
                        <canvas id="originalCanvas"></canvas>
                        <div class="watermark-preview" id="watermarkPreview"></div>
                    </div>
                    <div class="controls">
                        <button id="addAreaBtn" class="btn" disabled>
                            <i class="fas fa-plus-circle"></i>
                            <span>添加选区</span>
                        </button>
                        <button id="clearAreasBtn" class="btn" disabled>
                            <i class="fas fa-trash"></i>
                            <span>清除选区</span>
                        </button>
                    </div>
                </div>
                
                <div class="preview-box">
                    <div class="preview-header">
                        <h2><i class="fas fa-magic"></i> 处理结果</h2>
                        <span id="resultSize">未处理</span>
                    </div>
                    <div class="canvas-container">
                        <canvas id="resultCanvas"></canvas>
                    </div>
                    <div class="controls">
                        <button id="removeBtn" class="btn btn-remove" disabled>
                            <i class="fas fa-eraser"></i>
                            <span>去除水印</span>
                        </button>
                        <button id="downloadBtn" class="btn btn-download" disabled>
                            <i class="fas fa-download"></i>
                            <span>下载图片</span>
                        </button>
                    </div>
                    
                    <div class="status">
                        <i class="fas fa-info-circle"></i>
                        <span id="statusText">等待操作...</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress" id="progressBar"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>提示：完美支持手机触摸操作 | 使用高级内容感知算法确保最佳去水印效果</p>
            <p>© 2023 全平台图片去水印工具</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const fileInput = document.getElementById('fileInput');
            const originalCanvas = document.getElementById('originalCanvas');
            const resultCanvas = document.getElementById('resultCanvas');
            const originalCtx = originalCanvas.getContext('2d');
            const resultCtx = resultCanvas.getContext('2d');
            const removeBtn = document.getElementById('removeBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const resetBtn = document.getElementById('resetBtn');
            const addAreaBtn = document.getElementById('addAreaBtn');
            const clearAreasBtn = document.getElementById('clearAreasBtn');
            const undoBtn = document.getElementById('undoBtn');
            const statusText = document.getElementById('statusText');
            const progressBar = document.getElementById('progressBar');
            const originalSize = document.getElementById('originalSize');
            const resultSize = document.getElementById('resultSize');
            const selectionInfo = document.getElementById('selectionInfo');
            const historyCount = document.getElementById('historyCount');
            const areaCount = document.getElementById('areaCount');
            const watermarkPreview = document.getElementById('watermarkPreview');
            const strengthSlider = document.getElementById('strengthSlider');
            const smoothSlider = document.getElementById('smoothSlider');
            const radiusSlider = document.getElementById('radiusSlider');
            const strengthValue = document.getElementById('strengthValue');
            const smoothValue = document.getElementById('smoothValue');
            const radiusValue = document.getElementById('radiusValue');
            
            // 全局变量
            let originalImage = null;
            let isDragging = false;
            let startX, startY, endX, endY;
            let selectionRects = [];
            let historyStack = [];
            let historyPointer = -1;
            let scaleX = 1, scaleY = 1;
            
            // 初始化滑块事件
            strengthSlider.addEventListener('input', function() {
                strengthValue.textContent = this.value + '%';
            });
            
            smoothSlider.addEventListener('input', function() {
                smoothValue.textContent = this.value + '%';
            });
            
            radiusSlider.addEventListener('input', function() {
                radiusValue.textContent = this.value + ' 像素';
            });
            
            // 上传图片
            fileInput.addEventListener('change', function(e) {
                if (e.target.files && e.target.files[0]) {
                    const reader = new FileReader();
                    
                    reader.onload = function(event) {
                        originalImage = new Image();
                        originalImage.onload = function() {
                            // 设置画布尺寸
                            const maxWidth = 800;
                            const maxHeight = 600;
                            let width = originalImage.width;
                            let height = originalImage.height;
                            
                            if (width > maxWidth) {
                                const ratio = maxWidth / width;
                                width = maxWidth;
                                height = height * ratio;
                            }
                            
                            if (height > maxHeight) {
                                const ratio = maxHeight / height;
                                height = maxHeight;
                                width = width * ratio;
                            }
                            
                            originalCanvas.width = width;
                            originalCanvas.height = height;
                            resultCanvas.width = width;
                            resultCanvas.height = height;
                            
                            // 绘制原始图片
                            originalCtx.drawImage(originalImage, 0, 0, width, height);
                            resultCtx.drawImage(originalImage, 0, 0, width, height);
                            
                            // 更新尺寸信息
                            originalSize.textContent = `${originalImage.width}×${originalImage.height} (缩放后: ${width}×${height})`;
                            resultSize.textContent = "等待处理";
                            
                            // 启用按钮
                            removeBtn.disabled = false;
                            downloadBtn.disabled = false;
                            addAreaBtn.disabled = false;
                            clearAreasBtn.disabled = false;
                            
                            // 重置选择区域
                            selectionRects = [];
                            updateSelectionInfo();
                            
                            // 保存初始状态到历史记录
                            saveToHistory();
                            
                            statusText.textContent = "图片已加载，请选择水印区域";
                        };
                        originalImage.src = event.target.result;
                    };
                    reader.readAsDataURL(e.target.files[0]);
                }
            });
            
            // 移动设备触摸事件处理
            function handleTouchStart(e) {
                if (!originalImage) return;
                
                e.preventDefault();
                const rect = originalCanvas.getBoundingClientRect();
                const touch = e.touches[0];
                scaleX = originalCanvas.width / rect.width;
                scaleY = originalCanvas.height / rect.height;
                
                isDragging = true;
                startX = (touch.clientX - rect.left) * scaleX;
                startY = (touch.clientY - rect.top) * scaleY;
                
                // 显示选区预览
                watermarkPreview.style.display = 'block';
                watermarkPreview.style.left = (touch.clientX - rect.left) + 'px';
                watermarkPreview.style.top = (touch.clientY - rect.top) + 'px';
                watermarkPreview.style.width = '0px';
                watermarkPreview.style.height = '0px';
            }
            
            function handleTouchMove(e) {
                if (!isDragging || !originalImage || e.touches.length !== 1) return;
                
                e.preventDefault();
                const rect = originalCanvas.getBoundingClientRect();
                const touch = e.touches[0];
                endX = (touch.clientX - rect.left) * scaleX;
                endY = (touch.clientY - rect.top) * scaleY;
                
                // 更新选区预览
                const displayX = Math.min(startX / scaleX, endX / scaleX);
                const displayY = Math.min(startY / scaleY, endY / scaleY);
                const displayWidth = Math.abs(endX / scaleX - startX / scaleX);
                const displayHeight = Math.abs(endY / scaleY - startY / scaleY);
                
                watermarkPreview.style.left = displayX + 'px';
                watermarkPreview.style.top = displayY + 'px';
                watermarkPreview.style.width = displayWidth + 'px';
                watermarkPreview.style.height = displayHeight + 'px';
                
                // 清除画布并重新绘制
                originalCtx.clearRect(0, 0, originalCanvas.width, originalCanvas.height);
                originalCtx.drawImage(originalImage, 0, 0, originalCanvas.width, originalCanvas.height);
                
                // 绘制选择矩形（使用逻辑坐标）
                drawSelectionRect(originalCtx, startX, startY, endX, endY);
                
                // 更新选择信息
                const width = Math.abs(endX - startX);
                const height = Math.abs(endY - startY);
                selectionInfo.textContent = `${Math.round(width)}×${Math.round(height)}`;
            }
            
            function handleTouchEnd(e) {
                if (!isDragging) return;
                
                e.preventDefault();
                const rect = originalCanvas.getBoundingClientRect();
                const touch = e.changedTouches[0];
                endX = (touch.clientX - rect.left) * scaleX;
                endY = (touch.clientY - rect.top) * scaleY;
                
                isDragging = false;
                
                // 保存选择区域（使用逻辑坐标）
                const newRect = {
                    x: Math.min(startX, endX),
                    y: Math.min(startY, endY),
                    width: Math.abs(endX - startX),
                    height: Math.abs(endY - startY)
                };
                
                // 确保选区有效
                if (newRect.width > 5 && newRect.height > 5) {
                    selectionRects.push(newRect);
                    updateSelectionInfo();
                    
                    // 在原始图片上绘制选区
                    drawSelectionOnOriginal();
                    
                    // 隐藏选区预览
                    watermarkPreview.style.display = 'none';
                }
            }
            
            // 桌面设备鼠标事件处理
            function handleMouseDown(e) {
                if (!originalImage) return;
                
                const rect = originalCanvas.getBoundingClientRect();
                scaleX = originalCanvas.width / rect.width;
                scaleY = originalCanvas.height / rect.height;
                
                isDragging = true;
                startX = (e.clientX - rect.left) * scaleX;
                startY = (e.clientY - rect.top) * scaleY;
                
                // 显示选区预览
                watermarkPreview.style.display = 'block';
                watermarkPreview.style.left = (e.clientX - rect.left) + 'px';
                watermarkPreview.style.top = (e.clientY - rect.top) + 'px';
                watermarkPreview.style.width = '0px';
                watermarkPreview.style.height = '0px';
            }
            
            function handleMouseMove(e) {
                if (!isDragging || !originalImage) return;
                
                const rect = originalCanvas.getBoundingClientRect();
                endX = (e.clientX - rect.left) * scaleX;
                endY = (e.clientY - rect.top) * scaleY;
                
                // 更新选区预览
                const displayX = Math.min(startX / scaleX, endX / scaleX);
                const displayY = Math.min(startY / scaleY, endY / scaleY);
                const displayWidth = Math.abs(endX / scaleX - startX / scaleX);
                const displayHeight = Math.abs(endY / scaleY - startY / scaleY);
                
                watermarkPreview.style.left = displayX + 'px';
                watermarkPreview.style.top = displayY + 'px';
                watermarkPreview.style.width = displayWidth + 'px';
                watermarkPreview.style.height = displayHeight + 'px';
                
                // 清除画布并重新绘制
                originalCtx.clearRect(0, 0, originalCanvas.width, originalCanvas.height);
                originalCtx.drawImage(originalImage, 0, 0, originalCanvas.width, originalCanvas.height);
                
                // 绘制选择矩形（使用逻辑坐标）
                drawSelectionRect(originalCtx, startX, startY, endX, endY);
                
                // 更新选择信息
                const width = Math.abs(endX - startX);
                const height = Math.abs(endY - startY);
                selectionInfo.textContent = `${Math.round(width)}×${Math.round(height)}`;
            }
            
            function handleMouseUp(e) {
                if (!isDragging) return;
                
                const rect = originalCanvas.getBoundingClientRect();
                endX = (e.clientX - rect.left) * scaleX;
                endY = (e.clientY - rect.top) * scaleY;
                
                isDragging = false;
                
                // 保存选择区域（使用逻辑坐标）
                const newRect = {
                    x: Math.min(startX, endX),
                    y: Math.min(startY, endY),
                    width: Math.abs(endX - startX),
                    height: Math.abs(endY - startY)
                };
                
                // 确保选区有效
                if (newRect.width > 5 && newRect.height > 5) {
                    selectionRects.push(newRect);
                    updateSelectionInfo();
                    
                    // 在原始图片上绘制选区
                    drawSelectionOnOriginal();
                    
                    // 隐藏选区预览
                    watermarkPreview.style.display = 'none';
                }
            }
            
            // 添加事件监听器（同时支持鼠标和触摸）
            originalCanvas.addEventListener('mousedown', handleMouseDown);
            originalCanvas.addEventListener('mousemove', handleMouseMove);
            originalCanvas.addEventListener('mouseup', handleMouseUp);
            originalCanvas.addEventListener('mouseleave', () => isDragging = false);
            
            originalCanvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            originalCanvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            originalCanvas.addEventListener('touchend', handleTouchEnd, { passive: false });
            originalCanvas.addEventListener('touchcancel', () => isDragging = false);
            
            // 添加选区按钮
            addAreaBtn.addEventListener('click', function() {
                if (!originalImage) return;
                
                // 添加默认选区（使用逻辑坐标）
                const newRect = {
                    x: originalCanvas.width * 0.3,
                    y: originalCanvas.height * 0.3,
                    width: 100,
                    height: 40
                };
                
                selectionRects.push(newRect);
                updateSelectionInfo();
                drawSelectionOnOriginal();
            });
            
            // 清除选区按钮
            clearAreasBtn.addEventListener('click', function() {
                selectionRects = [];
                updateSelectionInfo();
                
                // 重新绘制原始图片
                originalCtx.clearRect(0, 0, originalCanvas.width, originalCanvas.height);
                originalCtx.drawImage(originalImage, 0, 0, originalCanvas.width, originalCanvas.height);
            });
            
            // 去除水印
            removeBtn.addEventListener('click', function() {
                if (!originalImage || selectionRects.length === 0) {
                    statusText.textContent = '请先选择要移除的水印区域';
                    return;
                }
                
                statusText.textContent = '处理中，请稍候...';
                progressBar.style.width = '0%';
                
                // 保存当前状态到历史记录
                saveToHistory();
                
                // 处理每个选区
                let processed = 0;
                const total = selectionRects.length;
                
                selectionRects.forEach(rect => {
                    // 获取选择区域的数据
                    const imageData = resultCtx.getImageData(
                        rect.x, 
                        rect.y, 
                        rect.width, 
                        rect.height
                    );
                    
                    // 应用高级去水印算法
                    removeWatermarkAdvanced(imageData);
                    
                    // 将处理后的数据放回
                    resultCtx.putImageData(imageData, rect.x, rect.y);
                    
                    processed++;
                    const progress = (processed / total) * 100;
                    progressBar.style.width = progress + '%';
                });
                
                // 更新结果尺寸信息
                resultSize.textContent = "已处理 " + selectionRects.length + " 个区域";
                statusText.textContent = '水印已成功移除！';
                
                // 清除选区
                selectionRects = [];
                updateSelectionInfo();
                
                // 重新绘制原始图片
                originalCtx.clearRect(0, 0, originalCanvas.width, originalCanvas.height);
                originalCtx.drawImage(originalImage, 0, 0, originalCanvas.width, originalCanvas.height);
            });
            
            // 下载处理后的图片
            downloadBtn.addEventListener('click', function() {
                if (!originalImage) return;
                
                const link = document.createElement('a');
                link.download = 'removed-watermark-' + new Date().getTime() + '.png';
                link.href = resultCanvas.toDataURL('image/png');
                link.click();
            });
            
            // 重置图片
            resetBtn.addEventListener('click', function() {
                if (!originalImage) return;
                
                originalCtx.drawImage(originalImage, 0, 0, originalCanvas.width, originalCanvas.height);
                resultCtx.drawImage(originalImage, 0, 0, resultCanvas.width, resultCanvas.height);
                selectionRects = [];
                updateSelectionInfo();
                resultSize.textContent = "已重置";
                statusText.textContent = "等待操作...";
                progressBar.style.width = '0%';
                
                // 重置历史记录
                historyStack = [];
                historyPointer = -1;
                historyCount.textContent = "0 次";
                saveToHistory();
            });
            
            // 撤销操作
            undoBtn.addEventListener('click', function() {
                if (historyPointer <= 0) return;
                
                historyPointer--;
                const history = historyStack[historyPointer];
                
                // 恢复画布状态
                resultCtx.putImageData(history.imageData, 0, 0);
                
                // 恢复选区
                selectionRects = history.selectionRects;
                updateSelectionInfo();
                
                // 重新绘制原始图片
                originalCtx.clearRect(0, 0, originalCanvas.width, originalCanvas.height);
                originalCtx.drawImage(originalImage, 0, 0, originalCanvas.width, originalCanvas.height);
                drawSelectionOnOriginal();
                
                resultSize.textContent = "已撤销操作";
                statusText.textContent = "已恢复到上一步操作";
            });
            
            // 在原始图片上绘制选区
            function drawSelectionOnOriginal() {
                originalCtx.clearRect(0, 0, originalCanvas.width, originalCanvas.height);
                originalCtx.drawImage(originalImage, 0, 0, originalCanvas.width, originalCanvas.height);
                
                selectionRects.forEach(rect => {
                    originalCtx.strokeStyle = '#f72585';
                    originalCtx.lineWidth = 2;
                    originalCtx.setLineDash([5, 5]);
                    originalCtx.strokeRect(rect.x, rect.y, rect.width, rect.height);
                    originalCtx.setLineDash([]);
                    
                    originalCtx.fillStyle = 'rgba(247, 37, 133, 0.2)';
                    originalCtx.fillRect(rect.x, rect.y, rect.width, rect.height);
                });
            }
            
            // 绘制选择矩形
            function drawSelectionRect(ctx, x1, y1, x2, y2) {
                const x = Math.min(x1, x2);
                const y = Math.min(y1, y2);
                const width = Math.abs(x2 - x1);
                const height = Math.abs(y2 - y1);
                
                ctx.strokeStyle = '#3498db';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.strokeRect(x, y, width, height);
                ctx.setLineDash([]);
                
                ctx.fillStyle = 'rgba(52, 152, 219, 0.2)';
                ctx.fillRect(x, y, width, height);
            }
            
            // 更新选区信息
            function updateSelectionInfo() {
                if (selectionRects.length === 0) {
                    selectionInfo.textContent = "未选择";
                } else {
                    const lastRect = selectionRects[selectionRects.length - 1];
                    selectionInfo.textContent = `${Math.round(lastRect.x)}, ${Math.round(lastRect.y)} - ${Math.round(lastRect.width)}×${Math.round(lastRect.height)}`;
                }
                areaCount.textContent = selectionRects.length + " 个";
            }
            
            // 保存当前状态到历史记录
            function saveToHistory() {
                // 如果当前指针不在最后，删除之后的历史
                if (historyPointer < historyStack.length - 1) {
                    historyStack = historyStack.slice(0, historyPointer + 1);
                }
                
                // 保存当前状态
                const history = {
                    imageData: resultCtx.getImageData(0, 0, resultCanvas.width, resultCanvas.height),
                    selectionRects: [...selectionRects]
                };
                
                historyStack.push(history);
                historyPointer = historyStack.length - 1;
                
                // 限制历史记录数量
                if (historyStack.length > 10) {
                    historyStack.shift();
                    historyPointer--;
                }
                
                historyCount.textContent = historyStack.length - 1 + " 次";
            }
            
            // 高级水印去除算法
            function removeWatermarkAdvanced(imageData) {
                const data = imageData.data;
                const width = imageData.width;
                const height = imageData.height;
                
                // 获取处理参数
                const strength = parseInt(strengthSlider.value) / 100;
                const smoothness = parseInt(smoothSlider.value) / 100;
                const radius = parseInt(radiusSlider.value);
                
                // 创建临时缓冲区
                const tempData = new Uint8ClampedArray(data);
                
                // 多层处理
                for (let layer = 0; layer < 3; layer++) {
                    for (let y = 0; y < height; y++) {
                        for (let x = 0; x < width; x++) {
                            const idx = (y * width + x) * 4;
                            
                            // 计算周围像素的加权平均值
                            const avg = getWeightedAverage(tempData, x, y, width, height, radius, smoothness);
                            
                            // 应用处理（强度控制）
                            data[idx] = data[idx] * (1 - strength) + avg.r * strength;
                            data[idx + 1] = data[idx + 1] * (1 - strength) + avg.g * strength;
                            data[idx + 2] = data[idx + 2] * (1 - strength) + avg.b * strength;
                        }
                    }
                    
                    // 更新临时缓冲区
                    for (let i = 0; i < data.length; i++) {
                        tempData[i] = data[i];
                    }
                }
                
                // 边缘平滑处理
                applyEdgeSmoothing(data, width, height, smoothness);
            }
            
            // 获取加权平均值
            function getWeightedAverage(data, x, y, width, height, radius, smoothness) {
                let r = 0, g = 0, b = 0, weightSum = 0;
                const kernelSize = radius * 2 + 1;
                
                // 创建高斯核
                const kernel = createGaussianKernel(radius, smoothness);
                
                for (let ky = -radius; ky <= radius; ky++) {
                    for (let kx = -radius; kx <= radius; kx++) {
                        const nx = x + kx;
                        const ny = y + ky;
                        
                        if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                            const nIdx = (ny * width + nx) * 4;
                            const kernelIdx = (ky + radius) * kernelSize + (kx + radius);
                            const weight = kernel[kernelIdx];
                            
                            r += data[nIdx] * weight;
                            g += data[nIdx + 1] * weight;
                            b += data[nIdx + 2] * weight;
                            weightSum += weight;
                        }
                    }
                }
                
                return {
                    r: Math.round(r / weightSum),
                    g: Math.round(g / weightSum),
                    b: Math.round(b / weightSum)
                };
            }
            
            // 创建高斯核
            function createGaussianKernel(radius, sigmaFactor = 1.0) {
                const size = radius * 2 + 1;
                const kernel = new Array(size * size);
                let sum = 0;
                
                // 标准差
                const sigma = radius * sigmaFactor;
                
                for (let y = -radius; y <= radius; y++) {
                    for (let x = -radius; x <= radius; x++) {
                        const value = Math.exp(-(x*x + y*y) / (2 * sigma * sigma));
                        const idx = (y + radius) * size + (x + radius);
                        kernel[idx] = value;
                        sum += value;
                    }
                }
                
                // 归一化
                for (let i = 0; i < kernel.length; i++) {
                    kernel[i] /= sum;
                }
                
                return kernel;
            }
            
            // 应用边缘平滑
            function applyEdgeSmoothing(data, width, height, smoothness) {
                const strength = Math.round(10 * smoothness);
                
                for (let y = 1; y < height - 1; y++) {
                    for (let x = 1; x < width - 1; x++) {
                        const idx = (y * width + x) * 4;
                        
                        // 计算梯度
                        const dx = getColorDiff(data, idx, idx + 4);
                        const dy = getColorDiff(data, idx, idx + width * 4);
                        
                        // 根据梯度应用平滑
                        const factor = 1.0 - Math.min(dx + dy, 1.0) * smoothness;
                        
                        // 应用平滑
                        for (let i = 0; i < 3; i++) {
                            const neighbors = [
                                data[idx - 4 + i], 
                                data[idx + 4 + i],
                                data[idx - width * 4 + i],
                                data[idx + width * 4 + i]
                            ];
                            
                            // 计算邻居平均值
                            const avg = neighbors.reduce((sum, val) => sum + val, 0) / neighbors.length;
                            data[idx + i] = data[idx + i] * factor + avg * (1 - factor);
                        }
                    }
                }
            }
            
            // 计算颜色差异
            function getColorDiff(data, idx1, idx2) {
                let diff = 0;
                for (let i = 0; i < 3; i++) {
                    diff += Math.abs(data[idx1 + i] - data[idx2 + i]);
                }
                return diff / (3 * 255);
            }
            
            // 添加拖放功能
            const dropArea = document.querySelector('.file-label');
            
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, preventDefaults, false);
            });
            
            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }
            
            ['dragenter', 'dragover'].forEach(eventName => {
                dropArea.addEventListener(eventName, highlight, false);
            });
            
            ['dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, unhighlight, false);
            });
            
            function highlight() {
                dropArea.style.background = 'rgba(67, 97, 238, 0.3)';
                dropArea.style.borderColor = '#4361ee';
            }
            
            function unhighlight() {
                dropArea.style.background = 'rgba(255, 255, 255, 0.08)';
                dropArea.style.borderColor = 'rgba(255, 255, 255, 0.3)';
            }
            
            dropArea.addEventListener('drop', handleDrop, false);
            
            function handleDrop(e) {
                const dt = e.dataTransfer;
                const files = dt.files;
                
                if (files.length) {
                    fileInput.files = files;
                    const event = new Event('change');
                    fileInput.dispatchEvent(event);
                }
            }
        });
    </script>
</body>
