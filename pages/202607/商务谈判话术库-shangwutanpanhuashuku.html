        // 渲染话术模板
        function renderScripts(scripts) {
            // 清空容器
            scriptsContainer.innerHTML = '';
            
            // 检查是否有匹配的话术
            if (scripts.length === 0) {
                emptyState.classList.remove('hidden');

            }

            emptyState.classList.add('hidden');

                const sceneLabels = {
                    'price': { text: '价格谈判', class: 'bg-blue-100 text-blue-800' },
                    'delay': { text: '延期请求', class: 'bg-yellow-100 text-yellow-800' },

                    'contract': { text: '合同条款', class: 'bg-purple-100 text-purple-800' },
                    'cooperation': { text: '合作意向', class: 'bg-green-100 text-green-800' },
                    'termination': { text: '终止合作', class: 'bg-gray-100 text-gray-800' },
                    'delivery': { text: '交货期谈判', class: 'bg-indigo-100 text-indigo-800' },
                    'service': { text: '售后服务', class: 'bg-pink-100 text-pink-800' }
                };

                                <i class="fa fa-copy"></i>
                            </button>
                        </div>
                        <h3 class="text-lg font-semibold mb-2 text-gray-800">${script.title}</h3>
                        <p class="text-gray-600 text-sm leading-relaxed">${script.content}</p>
                    </div>
                `;
                
                scriptsContainer.appendChild(scriptCard);
            });
            
            // 为复制按钮添加事件监听
            document.querySelectorAll('.copy-btn').forEach(btn => {

            });
        }

        // 处理复制功能，增加错误处理
        function handleCopy(e) {
            e.preventDefault();
            const scriptId = parseInt(e.currentTarget.getAttribute('data-id'));
            const script = negotiationScripts.find(s => s.id === scriptId);
            
            if (script) {
                // 复制到剪贴板
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(script.content).then(() => {
                        showCopyToast();
                    }).catch(err => {
                        console.error('无法复制内容: ', err);
                        fallbackCopyText(script.content);
                    });
                } else {
                    // 浏览器不支持Clipboard API时使用 fallback 方法
                    fallbackCopyText(script.content);
                }
            }
        }

        // 复制功能的 fallback 方法，兼容不支持Clipboard API的浏览器
        function fallbackCopyText(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            
            // 确保文本区域不在可视区域
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showCopyToast();
                } else {
                    alert('复制失败，请手动复制');
                }
            } catch (err) {
                console.error('复制失败: ', err);
                alert('复制失败，请手动复制');
            }
            
            document.body.removeChild(textArea);
        }

        function showCopyToast() {
            copyToast.classList.remove('opacity-0');
            copyToast.classList.add('opacity-100');

                copyToast.classList.remove('opacity-100');

        }

                sceneButtons.forEach(btn => {
                    btn.classList.remove('active', 'bg-primary', 'text-white');
                    btn.classList.add('bg-white', 'text-gray-700', 'shadow-sm', 'hover:bg-gray-50');
                });
                
                button.classList.add('active', 'bg-primary', 'text-white');
                button.classList.remove('bg-white', 'text-gray-700', 'shadow-sm', 'hover:bg-gray-50');
                
                // 获取选中的场景
                const scene = button.getAttribute('data-scene');
                
                // 筛选并渲染相应的话术
                if (scene === 'all') {
                    renderScripts(negotiationScripts);
                } else {
                    const filteredScripts = negotiationScripts.filter(script => script.scene === scene);
                    renderScripts(filteredScripts);
                }
                
                // 滚动到内容顶部
                scriptsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
        });

        // 搜索功能，增加对特殊字符的处理
        searchInput.addEventListener('input', () => {
            // 处理特殊字符，移除可能影响搜索的字符
            let searchTerm = searchInput.value.toLowerCase().trim()
                .replace(/[.*+?^${}()|[\]\\]/g, ''); // 移除正则表达式特殊字符
            
            if (searchTerm === '') {
                // 如果搜索为空，显示所有话术
                renderScripts(negotiationScripts);
                
                // 重置场景按钮状态
                sceneButtons.forEach(btn => {
                    if (btn.getAttribute('data-scene') === 'all') {
                        btn.classList.add('active', 'bg-primary', 'text-white');
                        btn.classList.remove('bg-white', 'text-gray-700', 'shadow-sm', 'hover:bg-gray-50');
                    } else {
                        btn.classList.remove('active', 'bg-primary', 'text-white');
                        btn.classList.add('bg-white', 'text-gray-700', 'shadow-sm', 'hover:bg-gray-50');
                    }
                });
                
                return;
            }
            
            // 搜索匹配逻辑：匹配场景、标题或内容
            const matchedScripts = negotiationScripts.filter(script => {
                const sceneMatch = script.scene.toLowerCase().includes(searchTerm);
                const titleMatch = script.title.toLowerCase().includes(searchTerm);
                const contentMatch = script.content.toLowerCase().includes(searchTerm);
                
                return sceneMatch || titleMatch || contentMatch;
            });
            
            // 渲染匹配的话术
            renderScripts(matchedScripts);
            
            // 更新场景按钮状态为未选中
            sceneButtons.forEach(btn => {
                btn.classList.remove('active', 'bg-primary', 'text-white');
                btn.classList.add('bg-white', 'text-gray-700', 'shadow-sm', 'hover:bg-gray-50');
            });
        });

        // 处理页面加载完成后的动画效果
        window.addEventListener('load', () => {
            document.body.classList.add('opacity-100');
            document.body.classList.remove('opacity-0');
        });
    </script>
</body>
</html>
