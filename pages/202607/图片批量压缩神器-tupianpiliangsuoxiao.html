<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片批量压缩神器</title>
    <style>
        :root {
            --primary: #4a6cf7;
            --primary-dark: #3a5ae0;
            --dark: #1e293b;
            --light: #f8fafc;
            --gray: #64748b;
            --gray-light: #e2e8f0;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            color: var(--light);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-top: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #4a6cf7, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }
        
        .subtitle {
            color: var(--gray-light);
            font-size: 1.1rem;
        }
        
        .upload-area {
            border: 2px dashed var(--gray);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }
        
        .upload-area:hover, .upload-area.dragover {
            border-color: var(--primary);
            background: rgba(74, 108, 247, 0.05);
        }
        
        .upload-icon {
            font-size: 48px;
            color: var(--primary);
            margin-bottom: 15px;
        }
        
        .upload-text {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }
        
        .upload-hint {
            color: var(--gray);
            font-size: 0.9rem;
        }
        
        #file-input {
            display: none;
        }
        
        .button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .button:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }
        
        .button:disabled {
            background: var(--gray);
            cursor: not-allowed;
            transform: none;
        }
        
        .button i {
            margin-right: 8px;
        }
        
        .control-section {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .control-group {
            flex: 1;
            min-width: 200px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--gray);
            background: rgba(255, 255, 255, 0.1);
            color: var(--light);
            font-size: 1rem;
        }
        
        input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .preview-section {
            margin-bottom: 30px;
        }
        
        .preview-title {
            font-size: 1.3rem;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .image-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            max-height: 300px;
            overflow-y: auto;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }
        
        .image-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.05);
        }
        
        .image-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .image-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px;
            font-size: 0.7rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .action-section {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .progress-section {
            margin-bottom: 30px;
            display: none;
        }
        
        .progress-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #8b5cf6);
            border-radius: 4px;
            width: 0%;
            transition: width 0.3s;
        }
        
        .progress-text {
            text-align: center;
            font-size: 0.9rem;
            color: var(--gray-light);
        }
        
        .result-section {
            display: none;
            text-align: center;
            padding: 20px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 8px;
            margin-bottom: 30px;
        }
        
        .result-icon {
            font-size: 48px;
            color: var(--success);
            margin-bottom: 15px;
        }
        
        .result-text {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
        }
        
        .footer p {
            margin: 5px 0;
            color: var(--gray);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: var(--dark);
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .modal-icon {
            font-size: 48px;
            color: var(--warning);
            margin-bottom: 15px;
        }
        
        .modal-title {
            font-size: 1.5rem;
            margin-bottom: 15px;
        }
        
        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
        
        .button-secondary {
            background: var(--gray);
        }
        
        .button-secondary:hover {
            background: #55657b;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .control-section {
                flex-direction: column;
            }
            
            .action-section {
                flex-direction: column;
            }
            
            .image-list {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>图片批量压缩神器</h1>
            <p class="subtitle">快速压缩图片，保持画质，一键下载</p>
        </header>
        
        <div class="upload-area" id="upload-area">
            <div class="upload-icon">📁</div>
            <p class="upload-text">点击或拖拽图片到此区域</p>
            <p class="upload-hint">支持JPG、PNG、GIF格式，最多100张图片</p>
            <input type="file" id="file-input" multiple accept="image/jpeg,image/png,image/gif">
        </div>
        
        <div class="control-section">
            <div class="control-group">
                <label for="target-size">目标大小 (KB)</label>
                <input type="number" id="target-size" min="10" max="10000" value="100" placeholder="例如：50">
            </div>
            <div class="control-group">
                <label for="quality">压缩质量 (1-100)</label>
                <input type="number" id="quality" min="1" max="100" value="80" placeholder="80">
            </div>
        </div>
        
        <div class="preview-section">
            <div class="preview-title">
                <span>已选择图片 (<span id="image-count">0</span>/100)</span>
                <button class="button button-secondary" id="clear-all">清空</button>
            </div>
            <div class="image-list" id="image-list"></div>
        </div>
        
        <div class="action-section">
            <button class="button" id="compress-btn">
                <i>⚡</i> 开始压缩
            </button>
            <button class="button" id="download-btn" disabled>
                <i>📥</i> 下载全部
            </button>
        </div>
        
        <div class="progress-section" id="progress-section">
            <div class="progress-bar">
                <div class="progress" id="progress-bar"></div>
            </div>
            <div class="progress-text" id="progress-text">准备压缩...</div>
        </div>
        
        <div class="result-section" id="result-section">
            <div class="result-icon">✅</div>
            <p class="result-text">压缩完成！节省了 <span id="saved-size">0</span> KB 空间</p>
            <button class="button" id="download-result">
                <i>📥</i> 下载压缩后的图片
            </button>
        </div>
    </div>
    
    <div class="footer">
        <p>本工具由木棉制作</p>
        <p>微信 ping3173</p>
        <p>QQ邮箱 <a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="86b1b3b4b6b1b3b1b0bfc6f7f7a8e5e9eb">[email&#160;protected]</a></p>
    </div>
    
    <div class="modal" id="warning-modal">
        <div class="modal-content">
            <div class="modal-icon">⚠️</div>
            <h3 class="modal-title">压缩警告</h3>
            <p>您设置的目标大小可能会导致图片质量严重下降。是否继续压缩？</p>
            <div class="modal-buttons">
                <button class="button button-secondary" id="cancel-compress">取消</button>
                <button class="button" id="confirm-compress">继续压缩</button>
            </div>
        </div>
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 全局变量
        let originalImages = [];
        let compressedImages = [];
        let totalOriginalSize = 0;
        let totalCompressedSize = 0;
        
        // DOM元素
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const imageList = document.getElementById('image-list');
        const imageCount = document.getElementById('image-count');
        const clearAllBtn = document.getElementById('clear-all');
        const compressBtn = document.getElementById('compress-btn');
        const downloadBtn = document.getElementById('download-btn');
        const progressSection = document.getElementById('progress-section');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const resultSection = document.getElementById('result-section');
        const savedSize = document.getElementById('saved-size');
        const downloadResult = document.getElementById('download-result');
        const warningModal = document.getElementById('warning-modal');
        const cancelCompress = document.getElementById('cancel-compress');
        const confirmCompress = document.getElementById('confirm-compress');
        const targetSizeInput = document.getElementById('target-size');
        const qualityInput = document.getElementById('quality');
        
        // 事件监听器
        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });
        
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });
        
        clearAllBtn.addEventListener('click', clearAllImages);
        compressBtn.addEventListener('click', startCompression);
        downloadBtn.addEventListener('click', downloadAll);
        downloadResult.addEventListener('click', downloadAll);
        cancelCompress.addEventListener('click', () => {
            warningModal.style.display = 'none';
        });
        confirmCompress.addEventListener('click', () => {
            warningModal.style.display = 'none';
            performCompression();
        });
        
        // 处理上传的文件
        function handleFiles(files) {
            if (files.length === 0) return;
            
            // 检查是否超过100张
            if (originalImages.length + files.length > 100) {
                alert('最多只能上传100张图片');
                return;
            }
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                
                // 检查文件类型
                if (!file.type.match('image/jpeg') && 
                    !file.type.match('image/png') && 
                    !file.type.match('image/gif')) {
                    alert(`文件 "${file.name}" 不是支持的图片格式（JPG、PNG、GIF）`);
                    continue;
                }
                
                // 添加到图片列表
                addImageToList(file);
            }
            
            updateImageCount();
        }
        
        // 添加图片到预览列表
        function addImageToList(file) {
            const reader = new FileReader();
            
            reader.onload = (e) => {
                const imageItem = document.createElement('div');
                imageItem.className = 'image-item';
                
                const img = document.createElement('img');
                img.src = e.target.result;
                img.alt = file.name;
                
                const imageName = document.createElement('div');
                imageName.className = 'image-name';
                imageName.textContent = file.name;
                
                imageItem.appendChild(img);
                imageItem.appendChild(imageName);
                imageList.appendChild(imageItem);
                
                // 存储原始图片信息
                originalImages.push({
                    file: file,
                    url: e.target.result,
                    element: imageItem
                });
                
                totalOriginalSize += file.size;
            };
            
            reader.readAsDataURL(file);
        }
        
        // 更新图片计数
        function updateImageCount() {
            imageCount.textContent = originalImages.length;
            downloadBtn.disabled = originalImages.length === 0 || compressedImages.length === 0;
        }
        
        // 清空所有图片
        function clearAllImages() {
            originalImages = [];
            compressedImages = [];
            imageList.innerHTML = '';
            totalOriginalSize = 0;
            totalCompressedSize = 0;
            updateImageCount();
            resultSection.style.display = 'none';
            progressSection.style.display = 'none';
        }
        
        // 开始压缩
        function startCompression() {
            if (originalImages.length === 0) {
                alert('请先上传图片');
                return;
            }
            
            const targetSize = parseInt(targetSizeInput.value) * 1024; // 转换为字节
            const quality = parseInt(qualityInput.value) / 100;
            
            // 检查目标大小是否过小
            const avgSize = totalOriginalSize / originalImages.length;
            if (targetSize < avgSize * 0.1) {
                // 目标大小小于原图大小的10%，显示警告
                warningModal.style.display = 'flex';
                return;
            }
            
            performCompression();
        }
        
        // 执行压缩
        function performCompression() {
            const targetSize = parseInt(targetSizeInput.value) * 1024; // 转换为字节
            const quality = parseInt(qualityInput.value) / 100;
            
            progressSection.style.display = 'block';
            resultSection.style.display = 'none';
            compressBtn.disabled = true;
            
            compressedImages = [];
            totalCompressedSize = 0;
            
            let processed = 0;
            
            // 压缩每张图片
            originalImages.forEach((image, index) => {
                compressImage(image.file, targetSize, quality, (compressedDataUrl, compressedSize) => {
                    processed++;
                    
                    // 更新进度
                    const progress = (processed / originalImages.length) * 100;
                    progressBar.style.width = `${progress}%`;
                    progressText.textContent = `正在压缩 ${processed}/${originalImages.length}...`;
                    
                    // 存储压缩后的图片
                    compressedImages.push({
                        name: image.file.name,
                        dataUrl: compressedDataUrl,
                        size: compressedSize
                    });
                    
                    totalCompressedSize += compressedSize;
                    
                    // 所有图片处理完成
                    if (processed === originalImages.length) {
                        progressText.textContent = '压缩完成！';
                        
                        // 显示结果
                        setTimeout(() => {
                            progressSection.style.display = 'none';
                            resultSection.style.display = 'block';
                            const saved = Math.round((totalOriginalSize - totalCompressedSize) / 1024);
                            savedSize.textContent = saved;
                            updateImageCount();
                            compressBtn.disabled = false;
                        }, 500);
                    }
                });
            });
        }
        
        // 压缩单张图片
        function compressImage(file, targetSize, quality, callback) {
            const img = new Image();
            const reader = new FileReader();
            
            reader.onload = (e) => {
                img.src = e.target.result;
                
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // 计算新尺寸，保持宽高比
                    let width = img.width;
                    let height = img.height;
                    
                    // 如果图片很大，先缩小尺寸
                    const maxDimension = 2000; // 最大尺寸
                    if (width > maxDimension || height > maxDimension) {
                        if (width > height) {
                            height = (height * maxDimension) / width;
                            width = maxDimension;
                        } else {
                            width = (width * maxDimension) / height;
                            height = maxDimension;
                        }
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    
                    // 绘制图片
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // 获取压缩后的数据URL
                    let compressedDataUrl = canvas.toDataURL(file.type, quality);
                    let compressedSize = getDataUrlSize(compressedDataUrl);
                    
                    // 如果压缩后的大小仍然大于目标大小，进一步降低质量
                    if (compressedSize > targetSize) {
                        let low = 0.1;
                        let high = quality;
                        let mid;
                        
                        // 二分查找合适的质量值
                        for (let i = 0; i < 10; i++) {
                            mid = (low + high) / 2;
                            compressedDataUrl = canvas.toDataURL(file.type, mid);
                            compressedSize = getDataUrlSize(compressedDataUrl);
                            
                            if (compressedSize > targetSize) {
                                high = mid;
                            } else {
                                low = mid;
                            }
                        }
                    }
                    
                    callback(compressedDataUrl, compressedSize);
                };
            };
            
            reader.readAsDataURL(file);
        }
        
        // 计算DataURL的大小（字节）
        function getDataUrlSize(dataUrl) {
            // 去除DataURL前缀
            const base64 = dataUrl.split(',')[1];
            // 计算大小（Base64编码的数据比原始数据大约33%）
            return (base64.length * 3) / 4;
        }
        
        // 下载所有压缩后的图片
        function downloadAll() {
            if (compressedImages.length === 0) {
                alert('没有可下载的图片');
                return;
            }
            
            // 如果是单张图片，直接下载
            if (compressedImages.length === 1) {
                const image = compressedImages[0];
                downloadImage(image.dataUrl, image.name);
                return;
            }
            
            // 多张图片打包下载
            const zip = new JSZip();
            
            compressedImages.forEach(image => {
                // 将DataURL转换为Blob
                const blob = dataURLToBlob(image.dataUrl);
                // 清理文件名，移除特殊字符
                const cleanName = cleanFileName(image.name);
                zip.file(cleanName, blob);
            });
            
            // 生成ZIP文件并下载
            zip.generateAsync({
                type: 'blob',
                compression: 'STORE', // 使用STORE而不是DEFLATE，减少兼容性问题
                compressionOptions: {level: 0}
            }).then(content => {
                const url = URL.createObjectURL(content);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'compressed_images.zip';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }).catch(error => {
                console.error('ZIP生成错误:', error);
                alert('生成ZIP文件时出错，请尝试单张下载或减少图片数量');
            });
        }
        
        // 清理文件名，移除可能引起问题的字符
        function cleanFileName(filename) {
            return filename.replace(/[<>:"/\\|?*]/g, '_');
        }
        
        // 下载单张图片
        function downloadImage(dataUrl, filename) {
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = cleanFileName(filename);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
        
        // 将DataURL转换为Blob
        function dataURLToBlob(dataUrl) {
            const arr = dataUrl.split(',');
            const mime = arr[0].match(/:(.*?);/)[1];
            const bstr = atob(arr[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            
            while (n--) {
                u8arr[n] = bstr.charCodeAt(n);
            }
            
            return new Blob([u8arr], {type: mime});
        }
    </script>
    
    <!-- 使用更稳定的JSZip版本 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</body>
</html>
