<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四象限待办事项 | 艾森豪威尔矩阵</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.8rem;
            color: #2c3e50;
            margin-bottom: 10px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
        }

        .subtitle {
            font-size: 1.2rem;
            color: #7f8c8d;
            max-width: 700px;
            margin: 0 auto 20px;
            line-height: 1.6;
        }

        .matrix-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 20px;
            height: 70vh;
            min-height: 500px;
        }

        .quadrant {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden;
            position: relative;
        }

        .quadrant:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.12);
        }

        .quadrant-header {
            padding: 10px 0 15px;
            border-bottom: 2px solid rgba(0,0,0,0.08);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .quadrant-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 18px;
        }

        .quadrant-title {
            font-size: 1.4rem;
            font-weight: 600;
        }

        .quadrant-description {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-top: 3px;
        }

        .tasks-container {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
            margin-bottom: 15px;
        }

        .task {
            background: #f8f9fa;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .task:hover {
            background: #edf2f7;
            transform: translateX(3px);
        }

        .task.completed {
            background: #f0fff4;
            opacity: 0.8;
        }

        .task.completed .task-text {
            text-decoration: line-through;
            color: #718096;
        }

        .task-checkbox {
            margin-right: 12px;
            width: 20px;
            height: 20px;
            border: 2px solid #cbd5e0;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .task.completed .task-checkbox {
            background: #48bb78;
            border-color: #48bb78;
            color: white;
        }

        .task-text {
            flex: 1;
            word-break: break-word;
            padding-right: 10px;
        }

        .task-delete {
            color: #e53e3e;
            cursor: pointer;
            opacity: 0.7;
            padding: 5px;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }

        .task-delete:hover {
            opacity: 1;
        }

        .add-task {
            display: flex;
            margin-top: auto;
        }

        .task-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px 0 0 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .task-input:focus {
            border-color: #4299e1;
        }

        .add-btn {
            background: #4299e1;
            color: white;
            border: none;
            border-radius: 0 8px 8px 0;
            padding: 0 20px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .add-btn:hover {
            background: #3182ce;
        }

        /* Quadrant specific styles */
        #quadrant1 {
            border-top: 5px solid #e53e3e;
        }
        #quadrant1 .quadrant-icon {
            background: #fed7d7;
            color: #e53e3e;
        }

        #quadrant2 {
            border-top: 5px solid #38a169;
        }
        #quadrant2 .quadrant-icon {
            background: #c6f6d5;
            color: #38a169;
        }

        #quadrant3 {
            border-top: 5px solid #d69e2e;
        }
        #quadrant3 .quadrant-icon {
            background: #fefcbf;
            color: #d69e2e;
        }

        #quadrant4 {
            border-top: 5px solid #805ad5;
        }
        #quadrant4 .quadrant-icon {
            background: #e9d8fd;
            color: #805ad5;
        }

        /* Statistics */
        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            min-width: 200px;
            text-align: center;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #718096;
            font-size: 1rem;
        }

        .completed-tasks .stat-value {
            color: #38a169;
        }

        .pending-tasks .stat-value {
            color: #e53e3e;
        }

        /* Responsive design */
        @media (max-width: 900px) {
            .matrix-container {
                height: auto;
                min-height: 0;
            }
            
            .quadrant {
                min-height: 350px;
            }
        }

        @media (max-width: 600px) {
            .matrix-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .stats {
                flex-direction: column;
                align-items: center;
            }
            
            .stat-card {
                width: 100%;
            }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e0;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a0aec0;
        }

        /* Footer */
        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #718096;
            font-size: 0.9rem;
        }

        .empty-state {
            text-align: center;
            padding: 30px 0;
            color: #a0aec0;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>四象限待办事项</h1>
            <p class="subtitle">基于艾森豪威尔矩阵的时间管理工具，帮助您根据任务的重要性和紧急性进行分类，优先处理真正重要的事项。</p>
        </header>

        <div class="matrix-container">
            <!-- Quadrant 1: Important & Urgent -->
            <div class="quadrant" id="quadrant1">
                <div class="quadrant-header">
                    <div class="quadrant-icon">
                        <i class="fas fa-fire"></i>
                    </div>
                    <div>
                        <div class="quadrant-title">重要且紧急</div>
                        <div class="quadrant-description">立即处理这些任务</div>
                    </div>
                </div>
                <div class="tasks-container" id="tasks1">
                    <div class="empty-state">
                        <i class="fas fa-fire"></i>
                        <p>没有紧急重要任务</p>
                    </div>
                </div>
                <div class="add-task">
                    <input type="text" class="task-input" id="input1" placeholder="添加新任务...">
                    <button class="add-btn" onclick="addTask(1)">添加</button>
                </div>
            </div>

            <!-- Quadrant 2: Important & Not Urgent -->
            <div class="quadrant" id="quadrant2">
                <div class="quadrant-header">
                    <div class="quadrant-icon">
                        <i class="fas fa-seedling"></i>
                    </div>
                    <div>
                        <div class="quadrant-title">重要不紧急</div>
                        <div class="quadrant-description">计划时间处理这些任务</div>
                    </div>
                </div>
                <div class="tasks-container" id="tasks2">
                    <div class="empty-state">
                        <i class="fas fa-seedling"></i>
                        <p>没有重要不紧急任务</p>
                    </div>
                </div>
                <div class="add-task">
                    <input type="text" class="task-input" id="input2" placeholder="添加新任务...">
                    <button class="add-btn" onclick="addTask(2)">添加</button>
                </div>
            </div>

            <!-- Quadrant 3: Not Important & Urgent -->
            <div class="quadrant" id="quadrant3">
                <div class="quadrant-header">
                    <div class="quadrant-icon">
                        <i class="fas fa-hourglass-half"></i>
                    </div>
                    <div>
                        <div class="quadrant-title">紧急不重要</div>
                        <div class="quadrant-description">委托他人或快速处理</div>
                    </div>
                </div>
                <div class="tasks-container" id="tasks3">
                    <div class="empty-state">
                        <i class="fas fa-hourglass-half"></i>
                        <p>没有紧急不重要任务</p>
                    </div>
                </div>
                <div class="add-task">
                    <input type="text" class="task-input" id="input3" placeholder="添加新任务...">
                    <button class="add-btn" onclick="addTask(3)">添加</button>
                </div>
            </div>

            <!-- Quadrant 4: Not Important & Not Urgent -->
            <div class="quadrant" id="quadrant4">
                <div class="quadrant-header">
                    <div class="quadrant-icon">
                        <i class="fas fa-trash-alt"></i>
                    </div>
                    <div>
                        <div class="quadrant-title">不重要不紧急</div>
                        <div class="quadrant-description">尽量不做或最后处理</div>
                    </div>
                </div>
                <div class="tasks-container" id="tasks4">
                    <div class="empty-state">
                        <i class="fas fa-trash-alt"></i>
                        <p>没有不重要不紧急任务</p>
                    </div>
                </div>
                <div class="add-task">
                    <input type="text" class="task-input" id="input4" placeholder="添加新任务...">
                    <button class="add-btn" onclick="addTask(4)">添加</button>
                </div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card completed-tasks">
                <div class="stat-value" id="completed-count">0</div>
                <div class="stat-label">已完成任务</div>
            </div>
            <div class="stat-card pending-tasks">
                <div class="stat-value" id="pending-count">0</div>
                <div class="stat-label">待完成任务</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-count">0</div>
                <div class="stat-label">总任务数</div>
            </div>
        </div>

        <footer>
            <p>© 2023 四象限待办事项 | 使用localStorage保存数据，刷新页面不会丢失</p>
        </footer>
    </div>

    <script>
        // 初始化任务数据
        let tasks = {
            quadrant1: [],
            quadrant2: [],
            quadrant3: [],
            quadrant4: []
        };

        // 页面加载时
        document.addEventListener('DOMContentLoaded', function() {
            // 从localStorage加载数据
            loadTasks();
            
            // 渲染所有任务
            renderAllTasks();
            
            // 更新统计数据
            updateStats();
            
            // 添加输入框回车事件
            setupInputEvents();
        });

        // 从localStorage加载任务
        function loadTasks() {
            const savedTasks = localStorage.getItem('quadrantTasks');
            if (savedTasks) {
                tasks = JSON.parse(savedTasks);
            }
        }

        // 保存任务到localStorage
        function saveTasks() {
            localStorage.setItem('quadrantTasks', JSON.stringify(tasks));
            updateStats();
        }

        // 渲染所有象限的任务
        function renderAllTasks() {
            for (let i = 1; i <= 4; i++) {
                renderTasks(i);
            }
        }

        // 渲染特定象限的任务
        function renderTasks(quadrantId) {
            const quadrantKey = `quadrant${quadrantId}`;
            const tasksContainer = document.getElementById(`tasks${quadrantId}`);
            const quadrantTasks = tasks[quadrantKey];
            
            // 清空容器
            tasksContainer.innerHTML = '';
            
            if (quadrantTasks.length === 0) {
                // 添加空状态
                const emptyIcons = ['fa-fire', 'fa-seedling', 'fa-hourglass-half', 'fa-trash-alt'];
                tasksContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas ${emptyIcons[quadrantId-1]}"></i>
                        <p>${quadrantId === 1 ? '没有紧急重要任务' : 
                           quadrantId === 2 ? '没有重要不紧急任务' : 
                           quadrantId === 3 ? '没有紧急不重要任务' : 
                           '没有不重要不紧急任务'}</p>
                    </div>
                `;
                return;
            }
            
            // 添加任务
            quadrantTasks.forEach((task, index) => {
                const taskElement = document.createElement('div');
                taskElement.className = `task${task.completed ? ' completed' : ''}`;
                taskElement.innerHTML = `
                    <div class="task-checkbox">${task.completed ? '<i class="fas fa-check"></i>' : ''}</div>
                    <div class="task-text">${task.text}</div>
                    <div class="task-delete"><i class="fas fa-times"></i></div>
                `;
                
                // 添加事件监听器
                taskElement.querySelector('.task-checkbox').addEventListener('click', () => toggleTask(quadrantId, index));
                taskElement.querySelector('.task-delete').addEventListener('click', () => deleteTask(quadrantId, index));
                
                tasksContainer.appendChild(taskElement);
            });
        }

        // 添加新任务
        function addTask(quadrantId) {
            const input = document.getElementById(`input${quadrantId}`);
            const text = input.value.trim();
            
            if (text === '') return;
            
            const quadrantKey = `quadrant${quadrantId}`;
            tasks[quadrantKey].push({
                text: text,
                completed: false,
                createdAt: new Date().toISOString()
            });
            
            // 清空输入框
            input.value = '';
            
            // 保存并重新渲染
            saveTasks();
            renderTasks(quadrantId);
        }

        // 切换任务完成状态
        function toggleTask(quadrantId, taskIndex) {
            const quadrantKey = `quadrant${quadrantId}`;
            tasks[quadrantKey][taskIndex].completed = !tasks[quadrantKey][taskIndex].completed;
            
            saveTasks();
            renderTasks(quadrantId);
        }

        // 删除任务
        function deleteTask(quadrantId, taskIndex) {
            const quadrantKey = `quadrant${quadrantId}`;
            tasks[quadrantKey].splice(taskIndex, 1);
            
            saveTasks();
            renderTasks(quadrantId);
        }

        // 更新统计信息
        function updateStats() {
            let total = 0;
            let completed = 0;
            
            for (let i = 1; i <= 4; i++) {
                const quadrantKey = `quadrant${i}`;
                tasks[quadrantKey].forEach(task => {
                    total++;
                    if (task.completed) completed++;
                });
            }
            
            document.getElementById('completed-count').textContent = completed;
            document.getElementById('pending-count').textContent = total - completed;
            document.getElementById('total-count').textContent = total;
        }

        // 设置输入框回车事件
        function setupInputEvents() {
            for (let i = 1; i <= 4; i++) {
                const input = document.getElementById(`input${i}`);
                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        addTask(i);
                    }
                });
            }
        }
    </script>
</body>
</html>
