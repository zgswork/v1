<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Navigator - 离线代码导航工具</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- 顶部工具栏 -->
    <header class="toolbar">
        <div class="toolbar-section">
            <button id="upload-btn" class="toolbar-btn">
                <i class="fas fa-upload"></i>
                <span>上传 ZIP</span>
            </button>
            <input type="file" id="file-input" accept=".zip" style="display: none;">
            <button id="clear-data-btn" class="toolbar-btn">
                <i class="fas fa-trash"></i>
                <span>清除数据</span>
            </button>
        </div>

        <div class="toolbar-section search-section">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="搜索函数、类、变量...">
            </div>
            <div id="search-results" class="search-results"></div>
        </div>

        <div class="toolbar-section">
            <button id="theme-toggle" class="toolbar-btn">
                <i class="fas fa-moon"></i>
                <span>暗黑模式</span>
            </button>
        </div>
    </header>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 左侧面板 -->
        <aside class="sidebar">
            <!-- 书签区域 -->
            <div class="sidebar-section">
                <div class="sidebar-header">
                    <i class="fas fa-bookmark"></i>
                    <span>书签</span>
                </div>
                <div id="bookmarks" class="bookmark-list"></div>
            </div>

            <!-- 最近文件 -->
            <div class="sidebar-section">
                <div class="sidebar-header">
                    <i class="fas fa-history"></i>
                    <span>最近打开</span>
                </div>
                <div id="recent-files" class="recent-list"></div>
            </div>

            <!-- 目录树 -->
            <div class="sidebar-section">
                <div class="sidebar-header">
                    <i class="fas fa-folder-tree"></i>
                    <span>文件结构</span>
                </div>
                <div id="directory-tree" class="directory-tree"></div>
            </div>
        </aside>

        <!-- 右侧代码查看 -->
        <main class="code-viewer">
            <div class="code-header">
                <h2 id="current-file-name">请上传代码文件</h2>
                <button id="toggle-bookmark" class="bookmark-btn">
                    <i class="far fa-star"></i>
                </button>
            </div>
            <div class="code-container" id="code-container">
                <div class="empty-state">
                    <i class="fas fa-code"></i>
                    <p>上传 ZIP 文件开始浏览代码</p>
                </div>
            </div>
        </main>
    </div>

    <!-- 底部状态栏 -->
    <footer class="status-bar">
        <div class="status-item">
            <span id="status-file-path">-</span>
        </div>
        <div class="status-item">
            <span id="status-line-col">行: 0 / 列: 0</span>
        </div>
        <div class="status-item">
            <span id="status-language">语言: -</span>
        </div>
        <div class="status-item">
            <span id="status-file-size">大小: 0 KB</span>
        </div>
    </footer>

    <!-- 进度条 -->
    <div id="progress-overlay" class="progress-overlay" style="display: none;">
        <div class="progress-container">
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
            <span id="progress-text">正在解析...</span>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
