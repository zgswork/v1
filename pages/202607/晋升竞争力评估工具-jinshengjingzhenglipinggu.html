    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>

        // 不同岗位类型的维度权重调整
        const jobTypeWeights = {
            technical: {

            },

            },
            management: {
                leadership: 1.8,
                leadershipEvaluation: 1.6,
                communication: 1.4
            }
        };
        
        // 提升建议库
        const improvementSuggestions = {
            projectExperience: {
                title: "提升项目经验",
                suggestions: [
                    "主动申请参与核心项目或跨部门项目",
                    "在现有项目中承担更多责任，争取担任负责人角色",

            },
            leadership: {

                suggestions: [
                    "主动带领小型团队完成任务，积累管理经验",

                    "参与部门决策讨论，提出建设性意见",
                    "指导新员工，培养辅导能力"
                ]
            },
            professionalSkills: {
                title: "提升专业技能",
                suggestions: [
                    "参加相关培训课程和行业研讨会",
                    "学习前沿技术和工具，保持专业竞争力",
                    "考取行业认证，提升专业认可度",
                    "与团队分享专业知识，形成个人品牌"
                ]
            },
            performance: {
                title: "提升工作业绩",
                suggestions: [
                    "设定明确的业绩目标，并制定可行的实现计划",
                    "分析高绩效同事的工作方法，借鉴并优化",
                    "专注核心KPI，确保关键指标达成或超越",
                    "定期复盘工作成果，总结经验并改进"
                ]
            },
            communication: {
                title: "提升沟通能力",
                suggestions: [
                    "主动参与跨部门会议，练习表达和倾听",
                    "学习高效沟通技巧，提升表达清晰度",
                    "增强同理心，学会从对方角度思考问题",
                    "定期与上级沟通工作进展和规划"
                ]
            },
            innovation: {
                title: "提升创新能力",
                suggestions: [
                    "定期阅读行业资讯，了解最新趋势和技术",
                    "尝试用新方法解决现有问题，勇于提出改进建议",
                    "参与创新项目或活动，拓展思维边界",
                    "与不同背景的同事交流，获取新视角"
                ]
            },
            learningAbility: {
                title: "提升学习能力",
                suggestions: [
                    "制定系统的学习计划，定期学习新知识",
                    "将学到的知识应用到实际工作中，强化理解",
                    "向行业专家学习，参加专业社群",
                    "培养快速抓住重点的能力，提高学习效率"
                ]
            },
            leadershipEvaluation: {
                title: "提升领导评价",
                suggestions: [
                    "明确理解上级对自己的期望和要求",
                    "定期向上级汇报工作进展，主动反馈问题",
                    "超出预期完成任务，创造额外价值",
                    "展现积极的工作态度和团队合作精神"
                ]
            }
        };
        
        // DOM元素
        const assessmentFormSection = document.getElementById('assessmentFormSection');
        const resultsSection = document.getElementById('resultsSection');
        const assessmentDimensionsEl = document.getElementById('assessmentDimensions');
        const jobTypeSelect = document.getElementById('jobType');
        const calculateBtn = document.getElementById('calculateBtn');
        const restartBtn = document.getElementById('restartBtn');
        
        const comparisonChart = document.getElementById('comparisonChart');
        const priorityList = document.getElementById('priorityList');
        const improvementSuggestionsEl = document.getElementById('improvementSuggestions');
        
        const toast = document.getElementById('toast');
        const toastIcon = document.getElementById('toastIcon');
        const toastMessage = document.getElementById('toastMessage');
        
        // 图表实例
        let chartInstance = null;
        
        // 初始化
        function init() {
            // 生成评估维度表单
            generateAssessmentForm();
            
            // 设置事件监听器
            setupEventListeners();
        }
        
        // 生成评估维度表单
        function generateAssessmentForm() {
            assessmentDimensionsEl.innerHTML = '';
            
            assessmentDimensions.forEach(dimension => {
                const dimensionEl = document.createElement('div');
                dimensionEl.className = 'p-4 border rounded-lg';
                
                dimensionEl.innerHTML = `
                    <div class="flex flex-col md:flex-row md:items-center justify-between mb-2">
                        <div>
                            <label class="block font-medium text-gray-800">${dimension.name}</label>
                            <p class="text-sm text-gray-500">${dimension.description}</p>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">你的评分</label>
                            <div class="flex items-center">
                                <input type="range" id="yourScore-${dimension.id}" min="1" max="10" value="5" 
                                    class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-primary">
                                <span id="yourScoreValue-${dimension.id}" class="ml-3 w-8 text-center">5</span>
                            </div>
                            <div class="flex justify-between text-xs text-gray-500 mt-1 px-1">
                                <span>1</span>
                                <span>5</span>
                                <span>10</span>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">主要竞争对手评分</label>
                            <div class="flex items-center">
                                <input type="range" id="competitorScore-${dimension.id}" min="1" max="10" value="5" 
                                    class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-danger">
                                <span id="competitorScoreValue-${dimension.id}" class="ml-3 w-8 text-center">5</span>
                            </div>
                            <div class="flex justify-between text-xs text-gray-500 mt-1 px-1">
                                <span>1</span>
                                <span>5</span>
                                <span>10</span>
                            </div>
                        </div>
                    </div>
                `;
                
                assessmentDimensionsEl.appendChild(dimensionEl);
                
                // 添加评分滑块事件监听
                const yourScoreSlider = document.getElementById(`yourScore-${dimension.id}`);
                const yourScoreValue = document.getElementById(`yourScoreValue-${dimension.id}`);
                const competitorScoreSlider = document.getElementById(`competitorScore-${dimension.id}`);
                const competitorScoreValue = document.getElementById(`competitorScoreValue-${dimension.id}`);
                
                yourScoreSlider.addEventListener('input', () => {
                    yourScoreValue.textContent = yourScoreSlider.value;
                });
                
                competitorScoreSlider.addEventListener('input', () => {
                    competitorScoreValue.textContent = competitorScoreSlider.value;
                });
            });
        }
        
        // 设置事件监听器
        function setupEventListeners() {
            // 岗位类型变化时调整权重
            jobTypeSelect.addEventListener('change', adjustWeightsByJobType);
            
            // 计算提升建议
            calculateBtn.addEventListener('click', calculateImprovementPlan);
            
            // 重新评估
            restartBtn.addEventListener('click', restartAssessment);
        }
        
        // 根据岗位类型调整权重
        function adjustWeightsByJobType() {
            const jobType = jobTypeSelect.value;
            if (!jobType || !jobTypeWeights[jobType]) return;
            
            // 更新维度权重
            Object.keys(jobTypeWeights[jobType]).forEach(dimensionId => {
                const dimension = assessmentDimensions.find(d => d.id === dimensionId);
                if (dimension) {
                    dimension.weight = jobTypeWeights[jobType][dimensionId];
                }
            });
            
            showToast(`已根据${jobTypeSelect.options[jobTypeSelect.selectedIndex].text}岗位调整评估权重`, 'info');
        }
        
        // 计算提升计划
        function calculateImprovementPlan() {
            // 验证岗位类型是否选择
            if (!jobTypeSelect.value) {
                showToast('请先选择你的岗位类型', 'error');
                jobTypeSelect.focus();
                return;
            }
            
            // 收集评分数据
            const scores = [];
            let allFieldsFilled = true;
            
            assessmentDimensions.forEach(dimension => {
                const yourScore = parseInt(document.getElementById(`yourScore-${dimension.id}`).value);
                const competitorScore = parseInt(document.getElementById(`competitorScore-${dimension.id}`).value);
                
                // 简单验证（虽然滑块有默认值，但还是检查一下）
                if (isNaN(yourScore) || isNaN(competitorScore)) {
                    allFieldsFilled = false;
                }
                
                // 计算差距（竞争力指数）
                // 正值表示你有优势，负值表示需要提升
                const gap = yourScore - competitorScore;
                
                // 计算提升优先级：权重越高、差距越大（越负），优先级越高
                const priorityScore = (competitorScore - yourScore) * dimension.weight;
                
                scores.push({
                    ...dimension,
                    yourScore,
                    competitorScore,
                    gap,
                    priorityScore
                });
            });
            
            if (!allFieldsFilled) {
                showToast('请完成所有评分项', 'error');
                return;
            }
            
            // 生成对比图表
            generateComparisonChart(scores);
            
            // 生成提升优先级列表
            generatePriorityList(scores);
            
            // 生成提升建议
            generateImprovementSuggestions(scores);
            
            // 显示结果区域
            assessmentFormSection.classList.add('hidden');
            resultsSection.classList.remove('hidden');
            
            // 滚动到结果区域
            resultsSection.scrollIntoView({ behavior: 'smooth' });
            
            // 添加动画效果
            setTimeout(() => {
                document.querySelectorAll('#resultsSection > div').forEach((el, index) => {
                    el.classList.add('slide-up', 'opacity-0');
                    el.style.animationDelay = `${index * 100}ms`;
                });
            }, 100);
        }
        
        // 生成对比图表
        function generateComparisonChart(scores) {
            // 准备图表数据
            const labels = scores.map(d => d.name);
            const yourScores = scores.map(d => d.yourScore);
            const competitorScores = scores.map(d => d.competitorScore);
            
            // 销毁现有图表
            if (chartInstance) {
                chartInstance.destroy();
            }
            
            // 创建新图表
            const ctx = comparisonChart.getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '你的评分',
                            data: yourScores,
                            backgroundColor: 'rgba(59, 130, 246, 0.2)',
                            borderColor: 'rgba(59, 130, 246, 1)',
                            pointBackgroundColor: 'rgba(59, 130, 246, 1)',
                            pointBorderColor: '#fff',
                            pointHoverBackgroundColor: '#fff',
                            pointHoverBorderColor: 'rgba(59, 130, 246, 1)'
                        },
                        {
                            label: '竞争对手评分',
                            data: competitorScores,
                            backgroundColor: 'rgba(239, 68, 68, 0.2)',
                            borderColor: 'rgba(239, 68, 68, 1)',
                            pointBackgroundColor: 'rgba(239, 68, 68, 1)',
                            pointBorderColor: '#fff',
                            pointHoverBackgroundColor: '#fff',
                            pointHoverBorderColor: 'rgba(239, 68, 68, 1)'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            angleLines: {
                                display: true
                            },
                            suggestedMin: 0,
                            suggestedMax: 10
                        }
                    }
                }
            });
        }
        
        // 生成提升优先级列表
        function generatePriorityList(scores) {
            priorityList.innerHTML = '';
            
            // 按优先级排序（只包含需要提升的维度）
            const priorityItems = scores
                .filter(d => d.gap < 0) // 只显示你落后的维度
                .sort((a, b) => b.priorityScore - a.priorityScore) // 优先级从高到低
                .slice(0, 5); // 只显示前5个最需要提升的维度
            
            if (priorityItems.length === 0) {
                priorityList.innerHTML = `
                    <div class="text-center py-6 text-gray-600">
                        <i class="fa fa-trophy text-3xl text-warning mb-3"></i>
                        <p>恭喜！你在所有维度上都优于竞争对手，具备很强的晋升竞争力。</p>
                    </div>
                `;
                return;
            }
            
            priorityItems.forEach((item, index) => {
                const priorityClass = index === 0 ? 'bg-danger/10 border-danger/30' :
                                    index === 1 ? 'bg-warning/10 border-warning/30' :
                                    'bg-primary/10 border-primary/30';
                
                const priorityLabel = index === 0 ? '最高优先级' :
                                    index === 1 ? '高优先级' : '中优先级';
                
                const priorityLabelClass = index === 0 ? 'bg-danger text-white' :
                                        index === 1 ? 'bg-warning text-white' : 'bg-primary text-white';
                
                const itemEl = document.createElement('div');
                itemEl.className = `p-4 rounded-lg border ${priorityClass} transition-all duration-300`;
                itemEl.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <h3 class="font-bold">${item.name}</h3>
                            <p class="text-sm text-gray-600">${item.description}</p>
                        </div>
                        <span class="px-2 py-1 rounded-full text-xs font-medium ${priorityLabelClass}">${priorityLabel}</span>
                    </div>
                    
                    <div class="flex justify-between items-center mb-2">
                        <div>
                            <span class="text-sm text-gray-600">你的评分：</span>
                            <span class="font-medium">${item.yourScore}</span>
                        </div>
                        <div>
                            <span class="text-sm text-gray-600">竞争对手：</span>
                            <span class="font-medium">${item.competitorScore}</span>
                        </div>
                        <div>
                            <span class="text-sm text-gray-600">差距：</span>
                            <span class="font-medium text-danger">${item.gap}</span>
                        </div>
                    </div>
                    
                    <div class="w-full bg-gray-200 rounded-full h-2 mt-2">
                        <div class="progress-bar h-2 rounded-full bg-primary" style="width: ${(item.yourScore / 10) * 100}%"></div>
                        <div class="progress-bar absolute h-2 rounded-full bg-danger" style="width: ${(item.competitorScore / 10) * 100}%"></div>
                    </div>
                `;
                
                priorityList.appendChild(itemEl);
            });
        }
        
        // 生成提升建议
        function generateImprovementSuggestions(scores) {
            improvementSuggestionsEl.innerHTML = '';
            
            // 按优先级排序（只包含需要提升的维度）
            const priorityItems = scores
                .filter(d => d.gap < 0)
                .sort((a, b) => b.priorityScore - a.priorityScore)
                .slice(0, 3); // 只显示前3个最需要提升的维度
            
            if (priorityItems.length === 0) {
                improvementSuggestionsEl.innerHTML = `
                    <div class="p-6 bg-gray-50 rounded-lg text-center">
                        <h3 class="text-lg font-bold mb-3">保持优势</h3>
                        <p class="text-gray-600">
                            你在所有评估维度上都表现优秀，建议继续保持现有优势，同时关注行业发展趋势，
                            持续提升自己的综合能力，为晋升做好充分准备。
                        </p>
                    </div>
                `;
                return;
            }
            
            priorityItems.forEach((item, index) => {
                const suggestion = improvementSuggestions[item.id];
                
                if (suggestion) {
                    const suggestionEl = document.createElement('div');
                    suggestionEl.className = `p-5 rounded-lg border border-gray-200`;
                    suggestionEl.innerHTML = `
                        <h3 class="text-lg font-bold mb-4 flex items-center">
                            <span class="w-6 h-6 rounded-full bg-primary text-white flex items-center justify-center mr-2 text-sm">${index + 1}</span>
                            ${suggestion.title}
                        </h3>
                        <ul class="space-y-2">
                            ${suggestion.suggestions.map(s => `
                                <li class="flex items-start">
                                    <i class="fa fa-check-circle text-secondary mt-1 mr-2"></i>
                                    <span>${s}</span>
                                </li>
                            `).join('')}
                        </ul>
                    `;
                    
                    improvementSuggestionsEl.appendChild(suggestionEl);
                }
            });
            
            // 添加总体建议
            const generalAdvice = document.createElement('div');
            generalAdvice.className = `p-5 rounded-lg bg-gray-50 mt-4`;
            generalAdvice.innerHTML = `
                <h3 class="text-lg font-bold mb-3 flex items-center">
                    <i class="fa fa-lightbulb-o text-warning mr-2"></i>
                    总体晋升策略
                </h3>
                <p class="text-gray-700 mb-3">
                    根据你的评估结果，建议采取以下策略提升晋升竞争力：
                </p>
                <ol class="list-decimal list-inside space-y-2 text-gray-600 pl-2">
                    <li>优先提升上述高优先级维度，制定30-60天的具体行动计划</li>
                    <li>与直属领导沟通，了解其对晋升的具体期望和要求</li>
                    <li>寻找导师或资深同事指导，加速能力提升</li>
                    <li>定期复盘进展，调整提升计划</li>
                    <li>在团队中主动承担更多责任，展示领导力和潜力</li>
                </ol>
            `;
            
            improvementSuggestionsEl.appendChild(generalAdvice);
        }
        
        // 重新评估
        function restartAssessment() {
            // 重置表单
            jobTypeSelect.value = '';
            generateAssessmentForm();
            
            // 重置图表
            if (chartInstance) {
                chartInstance.destroy();
                chartInstance = null;
            }
            
            // 显示表单区域
            resultsSection.classList.add('hidden');
            assessmentFormSection.classList.remove('hidden');
            
            // 滚动到顶部
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        // 显示提示消息
        function showToast(message, type = 'success') {
            toastMessage.textContent = message;
            
            if (type === 'success') {
                toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs bg-green-50 text-green-800';
                toastIcon.className = 'fa fa-check-circle mr-2 text-green-500';
            } else if (type === 'error') {
                toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs bg-red-50 text-red-800';
                toastIcon.className = 'fa fa-exclamation-circle mr-2 text-red-500';
            } else if (type === 'info') {
                toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs bg-blue-50 text-blue-800';
                toastIcon.className = 'fa fa-info-circle mr-2 text-blue-500';
            }
            
            // 3秒后隐藏
            setTimeout(() => {
                toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs';
            }, 3000);
        }
        
        // 初始化应用
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
