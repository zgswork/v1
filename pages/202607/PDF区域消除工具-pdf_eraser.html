<!DOCTYPE html>
<html>
<head>
    <title>PDF区域消除工具</title>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #control-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #f5f5f5;
            padding: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 1000;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        #pdf-container {
            margin-top: 120px;
            height: calc(100vh - 120px);
            overflow-y: auto;
            padding: 20px;
            background: #eee;
        }
        
        .pdf-page-container {
            margin-bottom: 20px;
            background: white;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
            position: relative;
            display: inline-block;
        }
        
        .erase-area {
            position: absolute;
            border: 2px dashed red;
            background-color: rgba(255, 255, 255, 0.5);
            cursor: move;
        }
        
        .erase-area .delete-btn {
            position: absolute;
            right: -10px;
            top: -10px;
            width: 20px;
            height: 20px;
            background: red;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-weight: bold;
        }
        
        button, input {
            padding: 5px 10px;
        }
    </style>
</head>
<body>
    <div id="control-panel">
        <h2 style="margin: 0 20px 0 0;">鸿猷PDF处理小工具</h2>
        <input type="file" id="pdf-input" accept=".pdf">
        <label>填充色: 
            <input type="color" id="fill-color" value="#ffffff">
        </label>
        <div class="size-controls">
            <label>宽度: <input type="number" id="area-width" value="100">px</label>
            <label>高度: <input type="number" id="area-height" value="50">px</label>
        </div>
        <button id="sync-all">同步到所有页面</button>
        <button id="clear-all">清除所有区域</button>
        <button id="download">下载处理后的PDF</button>
    </div>
    
    <div id="pdf-container"></div>

    <!-- 使用PDF.js v2.12.313稳定版本 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.12.313/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        // 设置PDF.js worker路径
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.12.313/pdf.worker.min.js';
        
        const { jsPDF } = window.jspdf;
        const pdfInput = document.getElementById('pdf-input');
        const pdfContainer = document.getElementById('pdf-container');
        const fillColor = document.getElementById('fill-color');
        const areaWidth = document.getElementById('area-width');
        const areaHeight = document.getElementById('area-height');
        const syncAllBtn = document.getElementById('sync-all');
        const clearAllBtn = document.getElementById('clear-all');
        const downloadBtn = document.getElementById('download');
        
        let pdfDoc = null;
        let eraseAreas = {}; // 存储各页面的消除区域 {pageNum: [areas]}
        
        pdfInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const fileReader = new FileReader();
                
                fileReader.onload = function() {
                    const typedArray = new Uint8Array(this.result);
                    loadPDF(typedArray);
                };
                
                fileReader.onerror = function(error) {
                    console.error('文件读取错误:', error);
                    alert('文件读取失败');
                };
                
                fileReader.readAsArrayBuffer(file);
            }
        });
        
        async function loadPDF(data) {
            try {
                pdfContainer.innerHTML = '<p>正在加载PDF...</p>';
                eraseAreas = {};
                
                const loadingTask = pdfjsLib.getDocument(data);
                pdfDoc = await loadingTask.promise;
                
                pdfContainer.innerHTML = '';
                
                // 渲染所有页面
                for (let i = 1; i <= pdfDoc.numPages; i++) {
                    await renderPage(i);
                }
                
            } catch (error) {
                console.error('PDF加载错误:', error);
                pdfContainer.innerHTML = '<p style="color:red">PDF加载失败: ' + error.message + '</p>';
            }
        }
        
        async function renderPage(pageNum) {
            try {
                const page = await pdfDoc.getPage(pageNum);
                const viewport = page.getViewport({ scale: 1.5 });
                
                const pageDiv = document.createElement('div');
                pageDiv.className = 'pdf-page-container';
                pageDiv.dataset.pageNum = pageNum;
                
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                
                pageDiv.appendChild(canvas);
                pdfContainer.appendChild(pageDiv);
                
                await page.render({
                    canvasContext: context,
                    viewport: viewport
                }).promise;
                
                // 添加点击事件创建消除区域
                pageDiv.addEventListener('click', function(e) {
                    if (e.target === canvas) {
                        createEraseArea(pageNum, e.offsetX, e.offsetY);
                    }
                });
                
                // 渲染该页面已有的消除区域
                if (eraseAreas[pageNum]) {
                    eraseAreas[pageNum].forEach(area => {
                        renderEraseArea(pageDiv, area);
                    });
                }
                
            } catch (pageError) {
                console.error(`第${pageNum}页渲染错误:`, pageError);
            }
        }
        
        function createEraseArea(pageNum, x, y) {
            if (!eraseAreas[pageNum]) {
                eraseAreas[pageNum] = [];
            }
            
            const width = parseInt(areaWidth.value) || 100;
            const height = parseInt(areaHeight.value) || 50;
            
            const area = {
                x: x - width/2,
                y: y - height/2,
                width: width,
                height: height,
                color: fillColor.value
            };
            
            eraseAreas[pageNum].push(area);
            
            const pageDiv = document.querySelector(`.pdf-page-container[data-page-num="${pageNum}"]`);
            renderEraseArea(pageDiv, area);
        }
        
        function renderEraseArea(pageDiv, area) {
            const areaDiv = document.createElement('div');
            areaDiv.className = 'erase-area';
            areaDiv.style.left = area.x + 'px';
            areaDiv.style.top = area.y + 'px';
            areaDiv.style.width = area.width + 'px';
            areaDiv.style.height = area.height + 'px';
            areaDiv.style.backgroundColor = area.color;
            
            // 添加删除按钮
            const deleteBtn = document.createElement('div');
            deleteBtn.className = 'delete-btn';
            deleteBtn.innerHTML = '×';
            deleteBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                areaDiv.remove();
                const pageNum = parseInt(pageDiv.dataset.pageNum);
                eraseAreas[pageNum] = eraseAreas[pageNum].filter(a => a !== area);
            });
            
            areaDiv.appendChild(deleteBtn);
            
            // 拖动功能
            makeDraggable(areaDiv, area);
            
            pageDiv.appendChild(areaDiv);
        }
        
        function makeDraggable(element, areaData) {
            let isDragging = false;
            let offsetX, offsetY;
            
            element.addEventListener('mousedown', function(e) {
                if (e.target === element) {
                    isDragging = true;
                    offsetX = e.clientX - element.getBoundingClientRect().left;
                    offsetY = e.clientY - element.getBoundingClientRect().top;
                    element.style.cursor = 'grabbing';
                }
            });
            
            document.addEventListener('mousemove', function(e) {
                if (!isDragging) return;
                
                const pageDiv = element.parentElement;
                const pageRect = pageDiv.getBoundingClientRect();
                
                let newX = e.clientX - pageRect.left - offsetX;
                let newY = e.clientY - pageRect.top - offsetY;
                
                // 限制在页面范围内
                newX = Math.max(0, Math.min(newX, pageRect.width - element.offsetWidth));
                newY = Math.max(0, Math.min(newY, pageRect.height - element.offsetHeight));
                
                element.style.left = newX + 'px';
                element.style.top = newY + 'px';
                
                // 更新数据
                areaData.x = newX;
                areaData.y = newY;
            });
            
            document.addEventListener('mouseup', function() {
                isDragging = false;
                element.style.cursor = 'move';
            });
        }
        
        // 修复后的同步到所有页面功能
        syncAllBtn.addEventListener('click', function() {
            if (!pdfDoc) {
                alert('请先加载PDF文件');
                return;
            }
            
            // 获取当前可见的最后一页（假设这是用户想要同步的页面）
            const visiblePages = Array.from(document.querySelectorAll('.pdf-page-container'))
                .filter(page => {
                    const rect = page.getBoundingClientRect();
                    return rect.top < window.innerHeight && rect.bottom > 0;
                });
            
            if (visiblePages.length === 0) {
                alert('没有找到可见的PDF页面');
                return;
            }
            
            const currentPage = visiblePages[0]; // 取第一个可见页面
            const currentPageNum = parseInt(currentPage.dataset.pageNum);
            
            if (!eraseAreas[currentPageNum] || eraseAreas[currentPageNum].length === 0) {
                alert('当前页面没有可同步的消除区域');
                return;
            }
            
            // 深度复制当前页面的消除区域
            const areasToSync = JSON.parse(JSON.stringify(eraseAreas[currentPageNum]));
            
            // 同步到所有页面
            let syncedPages = 0;
            for (let i = 1; i <= pdfDoc.numPages; i++) {
                if (i !== currentPageNum) {
                    // 更新内存中的区域数据
                    eraseAreas[i] = JSON.parse(JSON.stringify(areasToSync));
                    
                    // 更新页面显示
                    const pageDiv = document.querySelector(`.pdf-page-container[data-page-num="${i}"]`);
                    if (pageDiv) {
                        // 清除现有区域
                        const existingAreas = pageDiv.querySelectorAll('.erase-area');
                        existingAreas.forEach(area => area.remove());
                        
                        // 渲染新区域
                        eraseAreas[i].forEach(area => {
                            renderEraseArea(pageDiv, area);
                        });
                        
                        syncedPages++;
                    }
                }
            }
            
            alert(`已将第${currentPageNum}页的${eraseAreas[currentPageNum].length}个消除区域同步到${syncedPages}个页面`);
        });
        
        // 清除所有消除区域
        clearAllBtn.addEventListener('click', function() {
            if (confirm('确定要清除所有消除区域吗？')) {
                eraseAreas = {};
                const areas = document.querySelectorAll('.erase-area');
                areas.forEach(area => area.remove());
            }
        });
        
        // 下载处理后的PDF
        downloadBtn.addEventListener('click', async function() {
            if (!pdfDoc) {
                alert('请先加载PDF文件');
                return;
            }
            
            const doc = new jsPDF();
            
            for (let i = 1; i <= pdfDoc.numPages; i++) {
                const page = await pdfDoc.getPage(i);
                const viewport = page.getViewport({ scale: 1.5 });
                
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                
                await page.render({
                    canvasContext: context,
                    viewport: viewport
                }).promise;
                
                // 添加页面到PDF
                if (i > 1) doc.addPage();
                
                const imgData = canvas.toDataURL('image/jpeg', 1.0);
                doc.addImage(imgData, 'JPEG', 0, 0, doc.internal.pageSize.getWidth(), doc.internal.pageSize.getHeight());
                
                // 添加消除区域
                if (eraseAreas[i]) {
                    eraseAreas[i].forEach(area => {
                        // 计算PDF中的坐标和尺寸
                        const pdfX = (area.x / viewport.width) * doc.internal.pageSize.getWidth();
                        const pdfY = (area.y / viewport.height) * doc.internal.pageSize.getHeight();
                        const pdfWidth = (area.width / viewport.width) * doc.internal.pageSize.getWidth();
                        const pdfHeight = (area.height / viewport.height) * doc.internal.pageSize.getHeight();
                        
                        doc.setFillColor(area.color);
                        doc.rect(pdfX, pdfY, pdfWidth, pdfHeight, 'F');
                    });
                }
            }
            
            doc.save('processed.pdf');
        });
    </script>
</body>
</html>
