<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>阅读理解测验</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --muted: #666666;
      --card: #f7f7f8;
      --border: #e5e6eb;
      --primary: #2563eb;
      --primary-contrast: #ffffff;
      --accent: #10b981;
      --danger: #ef4444;
      --shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    :root[data-theme="dark"] {
      --bg: #0b0f14;
      --text: #e5e7eb;
      --muted: #9aa4b2;
      --card: #111827;
      --border: #243041;
      --primary: #60a5fa;
      --primary-contrast: #0b0f14;
      --accent: #34d399;
      --danger: #f87171;
      --shadow: 0 12px 28px rgba(0,0,0,0.45);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0 16px;
    }
    .title-wrap { display: flex; align-items: center; gap: 10px; }
    h1 { font-size: 24px; margin: 0; }
    .desc { color: var(--muted); font-size: 14px; }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: var(--shadow);
      user-select: none;
    }
    .theme-toggle .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    @media (min-width: 920px) {
      .grid { grid-template-columns: 1.2fr 1fr; }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 14px;
    }
    .card h2 { font-size: 18px; margin: 0 0 8px; }
    .card .small { color: var(--muted); font-size: 13px; }

    .passage {
      white-space: pre-wrap;
      font-size: 16px;
    }

    .q-item { border-top: 1px dashed var(--border); padding-top: 12px; margin-top: 12px; }
    .q-title { font-weight: 600; }
    .options { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 8px; }
    @media (min-width: 560px) { .options { grid-template-columns: 1fr 1fr; } }

    .opt {
      display: flex; align-items: center; gap: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
    }
    .opt input { width: 18px; height: 18px; }
    .opt .opt-text { flex: 1; }

    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .btn {
      border: none;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-primary { background: var(--primary); color: var(--primary-contrast); }
    .btn-accent { background: var(--accent); color: var(--primary-contrast); }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }

    .result {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(16, 185, 129, 0.12);
      color: var(--text);
    }
    .result.error { background: rgba(239, 68, 68, 0.13); }
    .score { font-size: 18px; font-weight: 700; }
    .explain { margin-top: 8px; color: var(--muted); }

    /* 进度条 */
    .progress-wrap { margin-top: 8px; }
    .progress-bg { height: 10px; background: var(--border); border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: var(--primary); transition: width .2s ease; }
    .progress-text { margin-top: 6px; font-size: 13px; color: var(--muted); }

    footer { margin-top: 18px; color: var(--muted); font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="title-wrap">
        <h1>阅读理解测验</h1>
        <div class="desc">支持浅/深主题，页面自适应，电脑与手机均可用。</div>
      </div>
      <button id="themeToggle" class="theme-toggle" aria-label="切换主题">
        <span id="themeLabel">浅主题</span>
        <span class="dot" aria-hidden="true"></span>
      </button>
    </header>

    <div class="grid">
      <section class="card" aria-label="阅读材料">
        <h2>阅读材料</h2>
        <div id="passage" class="passage"></div>
      </section>

      <section class="card" aria-label="测验题目">
        <h2>测验题目</h2>
        <div class="small">每道题均基于左侧阅读材料，请选择最合理的答案。</div>
        <div class="progress-wrap" aria-label="答题进度">
          <div class="progress-bg"><div id="progressFill" class="progress-fill"></div></div>
          <div id="progressText" class="progress-text">已作答 0 / 0</div>
        </div>
        <div id="questions"></div>
        <div class="btn-row">
          <button id="submit" class="btn btn-primary">提交答案</button>
          <button id="reset" class="btn btn-outline">重置</button>
          <button id="shuffle" class="btn btn-accent">换一组题</button>
          <button id="importSet" class="btn btn-outline">导入题组</button>
          <button id="exportSet" class="btn btn-outline">导出题组</button>
          <button id="deleteSet" class="btn btn-outline">删除题组</button>
        </div>
        <div id="result" class="result" role="alert"></div>
        <div id="importCard" class="card" style="display:none; margin-top:12px" aria-label="导入题组">
          <h2>导入题组</h2>
          <div class="small">粘贴 JSON（包含阅读材料与题目）。导入后会作为新的题组加入并自动切换到该题组。</div>
          <div style="margin-top:8px">
            <textarea id="importText" rows="10" style="width:100%; padding:10px; border:1px solid var(--border); border-radius:10px; background:transparent; color:var(--text)">{
  "text": "在此粘贴阅读材料……",
  "questions": [
    { "title": "问题1",
      "options": ["选项A", "选项B", "选项C", "选项D"],
      "answer": 0,
      "explain": "答案解析……" }
  ]
}</textarea>
          </div>
          <div id="importMsg" class="small" style="margin-top:8px"></div>
          <div class="btn-row" style="margin-top:10px">
            <button id="doImport" class="btn btn-primary">确认导入</button>
            <button id="cancelImport" class="btn btn-outline">取消</button>
          </div>
        </div>
      </section>
    </div>

    <footer>
      温馨提示：在手机端可上下滑动阅读材料与题目；横屏下布局自动并列。
    </footer>
  </div>

  <script>
    // 主题切换与持久化
    const root = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    const themeLabel = document.getElementById('themeLabel');
    const savedTheme = localStorage.getItem('reading-theme');
    if (savedTheme === 'dark' || savedTheme === 'light') {
      root.setAttribute('data-theme', savedTheme);
      themeLabel.textContent = savedTheme === 'dark' ? '深主题' : '浅主题';
    }
    themeToggle.addEventListener('click', () => {
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      themeLabel.textContent = next === 'dark' ? '深主题' : '浅主题';
      try { localStorage.setItem('reading-theme', next); } catch (e) {}
    });

    // 示例阅读材料与题库（可扩展）
    const passages = [
      {
        id: 'p1',
        text: `在城市更新的过程中，越来越多的公共空间被重新设计，以满足居民的多样化需求。\n\n以某社区为例，原本闲置的旧厂房被改造为开放式图书馆与共享工作区，周边配套了步行道、绿地与儿童活动设施。这一改造不仅提升了空间利用效率，也鼓励了不同年龄群体之间的互动。\n\n然而，改造并非没有挑战。如何在保留历史记忆的同时，引入现代功能；如何处理停车、噪音与夜间照明等问题；如何确保弱势群体也能公平地使用这些空间，都是需要持续协商的议题。`,
        questions: [
          {
            type: 'single',
            title: '改造后的公共空间最直接的效果是：',
            options: [
              '提升空间利用效率并促进人群互动',
              '减少社区绿地面积以用于停车',
              '限制儿童活动以降低噪音',
              '鼓励夜间照明关闭以节能'
            ],
            answer: 0,
            explain: '文中明确指出“提升空间利用效率”“鼓励不同年龄群体互动”。'
          },
          {
            type: 'single',
            title: '以下哪项是改造过程中的挑战之一？',
            options: [
              '确保弱势群体公平使用空间',
              '取消步行道以减少拥堵',
              '全部拆除历史建筑以统一风格',
              '将共享空间改为仅会员可用'
            ],
            answer: 0,
            explain: '文中列出“弱势群体公平使用”作为需要协商的议题。'
          },
          {
            type: 'single',
            title: '改造后的配套设施不包含：',
            options: [
              '开放式图书馆',
              '共享工作区',
              '步行道与绿地',
              '大型室内滑雪场'
            ],
            answer: 3,
            explain: '文中未提及室内滑雪场。'
          },
          {
            type: 'single',
            title: '“保留历史记忆”与“引入现代功能”的关系更可能是：',
            options: [
              '需要平衡与协调的双重目标',
              '互不相关，可独立实现',
              '前者完全阻碍后者',
              '后者必然取代前者'
            ],
            answer: 0,
            explain: '“需要持续协商”暗示两者需平衡并协调。'
          },
          {
            type: 'single',
            title: '从文段看，社区改造强调的价值取向是：',
            options: [
              '效率与包容并重',
              '以商业收益为唯一目标',
              '优先减少公共活动',
              '完全否定夜间照明'
            ],
            answer: 0,
            explain: '既提到效率与空间利用，又强调弱势群体公平使用。'
          }
        ]
      },
      {
        id: 'p2',
        text: `近年来，城市公共交通系统在数字化方面取得显著进展。\n\n一方面，实时到站信息让乘客能够更精准地规划出行；另一方面，移动支付与二维码检票减少了排队时间，提高了通行效率。\n\n但数字化也带来新的问题，如老年人使用难度、隐私数据保护以及系统在极端天气下的稳定性。为此，部分城市推出了“无障碍模式”与线下服务窗口，力求在技术便利与公平性之间取得平衡。`,
        questions: [
          {
            type: 'single',
            title: '数字化给公共交通带来的正面影响是：',
            options: [
              '更精准的出行规划与更高的通行效率',
              '更长的排队时间与更低的稳定性',
              '取消实时信息以保护隐私',
              '仅支持现金支付以便老年人'
            ],
            answer: 0,
            explain: '文中明确指出实时信息和移动支付提升效率。'
          },
          {
            type: 'single',
            title: '为缓解数字化带来的负面影响，文中提到的措施不包括：',
            options: [
              '无障碍模式',
              '线下服务窗口',
              '全面停止二维码检票',
              '在公平性与便利之间平衡'
            ],
            answer: 2,
            explain: '文中未提到全面停止二维码检票。'
          },
          {
            type: 'single',
            title: '隐私数据保护问题说明：',
            options: [
              '数字化需要配套制度与技术保障',
              '隐私保护与数字化不可兼容',
              '无需考虑隐私即可推广',
              '仅在极端天气时出现'
            ],
            answer: 0,
            explain: '提出问题即提示需要制度与技术应对。'
          },
          {
            type: 'single',
            title: '“老年人使用难度”提示的政策方向更可能是：',
            options: [
              '多渠道与多层次的服务供给',
              '取消所有线下服务',
              '强制所有人使用同一APP',
              '停用实时到站信息'
            ],
            answer: 0,
            explain: '文中提到推出无障碍模式与线下窗口，强调多渠道。'
          },
          {
            type: 'single',
            title: '关于系统稳定性，最合理的推断是：',
            options: [
              '需提升应对极端天气的韧性',
              '稳定性与效率二者不可兼得',
              '只要支付顺畅即可忽略',
              '重点放在取消实时信息'
            ],
            answer: 0,
            explain: '“极端天气下的稳定性”提示需提升系统韧性。'
          }
        ]
      }
    ];

    // 简单工具函数
    function el(id) { return document.getElementById(id); }
    function create(tag, cls) { const x = document.createElement(tag); if (cls) x.className = cls; return x; }

    // 当前状态
    let currentPassageIndex = 0;

    function renderPassage() {
      el('passage').textContent = passages[currentPassageIndex].text;
    }

    function renderQuestions() {
      const wrap = el('questions');
      wrap.innerHTML = '';
      const qs = passages[currentPassageIndex].questions;
      qs.forEach((q, i) => {
        const item = create('div', 'q-item');
        const title = create('div', 'q-title');
        title.textContent = `第 ${i+1} 题：${q.title}`;
        item.appendChild(title);
        const opts = create('div', 'options');
        // 选项乱序显示，但单选值仍为原始索引，确保判题正确
        const order = Array.from({length: q.options.length}, (_, k) => k);
        for (let m = order.length - 1; m > 0; m--) {
          const r = Math.floor(Math.random() * (m + 1));
          const tmp = order[m]; order[m] = order[r]; order[r] = tmp;
        }
        order.forEach((oi) => {
          const label = create('label', 'opt');
          const input = document.createElement('input');
          input.type = 'radio';
          input.name = `q_${i}`;
          input.value = String(oi);
          const span = create('span', 'opt-text');
          span.textContent = q.options[oi];
          label.appendChild(input);
          label.appendChild(span);
          opts.appendChild(label);
        });
        item.appendChild(opts);
        wrap.appendChild(item);
      });
      // 绑定变更事件更新进度
      qs.forEach((_, i) => {
        document.querySelectorAll(`input[name="q_${i}"]`).forEach(inp => {
          inp.addEventListener('change', updateProgress);
        });
      });
      updateProgress();
    }

    function submitAnswers() {
      const qs = passages[currentPassageIndex].questions;
      let correct = 0;
      let unanswered = 0;
      let details = '';
      qs.forEach((q, i) => {
        const sel = document.querySelector(`input[name="q_${i}"]:checked`);
        if (!sel) { unanswered++; details += `第${i+1}题：未作答\n`; return; }
        const ans = Number(sel.value);
        if (ans === q.answer) {
          correct++;
          details += `第${i+1}题：正确\n`;
        } else {
          details += `第${i+1}题：错误；参考解析：${q.explain}\n`;
        }
      });
      const total = qs.length;
      const scoreText = `得分：${correct}/${total}（正确率 ${(correct/total*100).toFixed(0)}%）`;
      const result = el('result');
      result.className = 'result' + (correct/total < 0.6 ? ' error' : '');
      result.innerHTML = `<div class="score">${scoreText}</div><div class="explain">${details.replace(/\n/g,'<br>')}</div>`;
      result.style.display = 'block';
    }

    function resetAll() {
      renderQuestions();
      const result = el('result');
      result.style.display = 'none';
      result.className = 'result';
      result.textContent = '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function shufflePassage() {
      currentPassageIndex = (currentPassageIndex + 1) % passages.length;
      renderPassage();
      resetAll();
    }

    // 事件绑定
    el('submit').addEventListener('click', submitAnswers);
    el('reset').addEventListener('click', resetAll);
    el('shuffle').addEventListener('click', shufflePassage);
    el('importSet').addEventListener('click', () => toggleImportCard(true));
    el('cancelImport').addEventListener('click', () => toggleImportCard(false));
    el('doImport').addEventListener('click', importFromJson);

    // 初始化
    renderPassage();
    renderQuestions();

    // 进度条更新
    function updateProgress() {
      const qs = passages[currentPassageIndex].questions;
      const total = qs.length;
      let answered = 0;
      qs.forEach((_, i) => {
        const sel = document.querySelector(`input[name="q_${i}"]:checked`);
        if (sel) answered++;
      });
      const pct = total ? Math.round(answered / total * 100) : 0;
      el('progressFill').style.width = pct + '%';
      el('progressText').textContent = `已作答 ${answered} / ${total}`;
    }

    // 额外事件绑定（导出/删除）
    el('exportSet').addEventListener('click', exportCurrentPassage);
    el('deleteSet').addEventListener('click', deleteCurrentPassage);

    // 导入题组相关逻辑
    function toggleImportCard(show) {
      el('importCard').style.display = show ? 'block' : 'none';
      el('importMsg').textContent = '';
    }

    function importFromJson() {
      const msg = el('importMsg');
      msg.style.color = '';
      msg.textContent = '';
      let data;
      try {
        data = JSON.parse(el('importText').value);
      } catch (e) {
        msg.style.color = 'var(--danger)';
        msg.textContent = 'JSON解析失败：请检查格式是否正确。';
        return;
      }

      // 基本结构校验
      if (!data || typeof data !== 'object') {
        msg.style.color = 'var(--danger)';
        msg.textContent = '数据格式错误：根节点需为对象。';
        return;
      }
      if (typeof data.text !== 'string' || !Array.isArray(data.questions) || data.questions.length === 0) {
        msg.style.color = 'var(--danger)';
        msg.textContent = '缺少必填字段：text（字符串）与 questions（非空数组）。';
        return;
      }

      for (let i = 0; i < data.questions.length; i++) {
        const q = data.questions[i];
        if (!q || typeof q.title !== 'string' || !Array.isArray(q.options) || q.options.length < 2 || typeof q.answer !== 'number') {
          msg.style.color = 'var(--danger)';
          msg.textContent = `第 ${i+1} 题结构不合法：需要 title、options(≥2)、answer(数字索引)。`;
          return;
        }
        if (q.answer < 0 || q.answer >= q.options.length) {
          msg.style.color = 'var(--danger)';
          msg.textContent = `第 ${i+1} 题的 answer 超出 options 范围。`;
          return;
        }
      }

      // 生成ID并加入题库
      const newPassage = {
        id: 'custom_' + Date.now(),
        text: String(data.text),
        questions: data.questions.map(q => ({
          type: 'single',
          title: String(q.title),
          options: q.options.map(o => String(o)),
          answer: Number(q.answer),
          explain: typeof q.explain === 'string' ? q.explain : ''
        }))
      };

      passages.push(newPassage);
      currentPassageIndex = passages.length - 1;
      renderPassage();
      resetAll();
      toggleImportCard(false);
      alert('导入成功，已切换到新题组。');
    }

    // 导出当前题组为JSON
    function exportCurrentPassage() {
      const p = passages[currentPassageIndex];
      const data = {
        text: p.text,
        questions: p.questions.map(q => ({
          title: q.title,
          options: q.options,
          answer: q.answer,
          explain: q.explain || ''
        }))
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `阅读理解题组_${p.id}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // 删除当前题组（仅自定义）
    function deleteCurrentPassage() {
      const p = passages[currentPassageIndex];
      if (!String(p.id).startsWith('custom_')) {
        alert('内置题组不可删除');
        return;
      }
      if (!confirm('确定删除当前自定义题组吗？此操作不可恢复。')) return;
      passages.splice(currentPassageIndex, 1);
      if (passages.length === 0) {
        alert('已删除所有题组。请导入新的题组。');
        return;
      }
      currentPassageIndex = Math.max(0, Math.min(currentPassageIndex, passages.length - 1));
      renderPassage();
      resetAll();
      alert('已删除当前题组。');
    }
  </script>
</body>
</html>
