<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幼儿园一级识字</title>
    <style>
        :root {
            --primary-color: #ff6b88;
            --secondary-color: #5d9bff;
            --accent-color: #66bb6a;
            --text-color: #333;
            --bg-color: #f0f9ff;
            --card-bg: #fff;
            --panel-bg: #fff9c4;
        }
        
        body {
            font-family: 'Comic Sans MS', '楷体', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 10px;
            color: var(--text-color);
        }
        
        h1 {
            color: var(--primary-color);
            font-size: 1.8em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            text-align: center;
        }
        
        .mode-switcher {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .mode-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 15px;
            background-color: var(--secondary-color);
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .mode-btn.active {
            background-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .mode-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            max-width: 100%;
            margin: 0 auto;
        }
        
        .card {
            width: 70px;
            height: 90px;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }
        
        .card.favorite::after {
            content: "★";
            position: absolute;
            top: 5px;
            right: 5px;
            color: gold;
            font-size: 14px;
            text-shadow: 0 0 3px rgba(0,0,0,0.5);
        }
        
        .character {
            font-size: 36px;
            color: var(--secondary-color);
            margin-bottom: 5px;
        }
        
        .pinyin {
            font-size: 14px;
            color: #ff8c66;
        }
        
        .info-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--panel-bg);
            padding: 15px;
            border-top: 3px dashed #ffca28;
            display: none;
            z-index: 100;
        }
        
        .info-content {
            max-width: 100%;
            margin: 0 auto;
            position: relative;
            padding: 0 10px;
        }
        
        .word-example {
            font-size: 18px;
            color: var(--accent-color);
            margin: 8px 0;
        }
        
        .sentence {
            font-size: 16px;
            color: var(--secondary-color);
        }
        
        .close-btn {
            position: absolute;
            top: -35px;
            right: 10px;
            background-color: #ff7043;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 16px;
            cursor: pointer;
            z-index: 101;
        }
        
        .action-btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 5px 10px;
            margin: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        .action-btn:hover {
            background-color: var(--primary-color);
            transform: scale(1.05);
        }
        
        .decoration {
            position: absolute;
            font-size: 16px;
            opacity: 0.3;
        }
        
        /* 卡片模式样式 */
        .card-mode {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        
        .big-card {
            width: 150px;
            height: 200px;
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            cursor: pointer;
        }
        
        .big-character {
            font-size: 80px;
            color: var(--primary-color);
            margin-bottom: 10px;
        }
        
        .big-pinyin {
            font-size: 20px;
            color: #ff8c66;
        }
        
        .nav-buttons {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
        
        /* 游戏模式样式 */
        .game-mode {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }
        
        .game-question {
            font-size: 20px;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .game-options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            max-width: 100%;
            margin-bottom: 15px;
        }
        
        .game-card {
            width: 70px;
            height: 90px;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }
        
        .game-character {
            font-size: 36px;
            color: var(--secondary-color);
        }
        
        .game-settings {
            margin: 15px 0;
            padding: 12px;
            background-color: rgba(255,255,255,0.7);
            border-radius: 10px;
            text-align: center;
            width: 90%;
        }
        
        .game-feedback {
            margin-top: 15px;
            font-size: 18px;
            min-height: 30px;
            text-align: center;
        }
        
        .stats-panel {
            background-color: rgba(255,255,255,0.8);
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            text-align: center;
            width: 90%;
        }
        
        .timer {
            font-size: 16px;
            color: #ff6b88;
            margin: 8px 0;
        }
        
        .correct {
            color: var(--accent-color);
        }
        
        .incorrect {
            color: #ff4444;
        }
        
        /* 收藏夹和错题本样式 */
        .favorites-section, .wrong-answers-section {
            margin-top: 20px;
            padding: 15px;
            background-color: rgba(255,255,255,0.7);
            border-radius: 12px;
            display: none;
            width: 90%;
        }
        
        .section-title {
            color: var(--primary-color);
            font-size: 1.5em;
            margin-bottom: 12px;
            text-align: center;
        }
        
        /* 休息提醒模态框 */
        .rest-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .rest-content {
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            max-width: 90%;
            width: 300px;
        }
        
        .math-question {
            font-size: 20px;
            margin: 15px 0;
        }
        
        .math-answer {
            padding: 8px;
            font-size: 16px;
            margin: 10px;
            width: 80px;
        }
        
        /* 动画效果 */
        @keyframes celebrate {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        
        .celebrate {
            animation: celebrate 0.5s ease;
        }
        
        .shake {
            animation: shake 0.5s ease;
        }
        
        .confetti {
            position: fixed;
            width: 8px;
            height: 8px;
            background-color: #f00;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
        }
        
        /* 游戏问题区域 */
        .game-question-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            margin-bottom: 15px;
        }
        
        .game-question-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        
        /* 响应式设计 - 更大屏幕 */
        @media (min-width: 768px) {
            .card {
                width: 90px;
                height: 110px;
            }
            
            .character {
                font-size: 50px;
            }
            
            .big-card {
                width: 200px;
                height: 250px;
            }
            
            .big-character {
                font-size: 100px;
            }
            
            .mode-switcher {
                gap: 15px;
            }
            
            .mode-btn {
                padding: 10px 20px;
                font-size: 16px;
            }
            
            .game-card {
                width: 80px;
                height: 100px;
            }
        }
    </style>
</head>
<body>
    <h1>🎨 幼儿园一级识字 🎨</h1>
    
    <div class="mode-switcher">
        <button class="mode-btn active" id="grid-mode-btn">平铺模式</button>
        <button class="mode-btn" id="card-mode-btn">卡片模式</button>
        <button class="mode-btn" id="game-mode-btn">游戏模式</button>
        <button class="mode-btn" id="favorites-btn">我的收藏</button>
        <button class="mode-btn" id="wrong-answers-btn">我的错题本</button>
    </div>
    
    <!-- 平铺模式 -->
    <div id="grid-mode" class="mode-container">
        <div class="container" id="card-container">
            <!-- 卡片将通过JavaScript动态生成 -->
        </div>
    </div>
    
    <!-- 卡片模式 -->
    <div id="card-mode" class="card-mode mode-container">
        <div class="big-card" id="current-card">
            <div class="big-character" id="current-char"></div>
            <div class="big-pinyin" id="current-pinyin"></div>
        </div>
        <div class="word-example" id="current-word"></div>
        <div class="sentence" id="current-sentence"></div>
        <div class="nav-buttons">
            <button class="action-btn" id="prev-btn">上一个</button>
            <button class="action-btn" id="next-btn">下一个</button>
            <button class="action-btn" id="toggle-favorite-btn">收藏</button>
        </div>
    </div>
    
    <!-- 游戏模式 -->
    <div id="game-mode" class="game-mode mode-container">
        <div class="game-settings">
            <div>
                <label for="difficulty">选择难度:</label>
                <select id="difficulty">
                    <option value="2">2个选项</option>
                    <option value="3">3个选项</option>
                    <option value="4" selected>4个选项</option>
                    <option value="5">5个选项</option>
                    <option value="6">6个选项</option>
                </select>
            </div>
            <div style="margin-top: 10px;">
                <input type="checkbox" id="use-wrong-answers">
                <label for="use-wrong-answers">使用错题本中的汉字</label>
            </div>
            <button class="action-btn" id="start-game-btn">开始游戏</button>
        </div>
        
        <!-- 统计面板 -->
        <div class="stats-panel">
            <div>答题次数: <span id="total-answers">0</span></div>
            <div>答对次数: <span id="correct-answers">0</span></div>
            <div>答错次数: <span id="wrong-answers">0</span></div>
            <div class="timer">使用时间: <span id="usage-time">0</span>分钟</div>
        </div>
        
        <div id="game-area" style="display: none;">
            <div class="game-question-container">
                <div class="game-question-wrapper">
                    <div class="game-question" id="game-question"></div>
                    <button class="action-btn" id="next-question-btn" style="display: none; margin-top: 10px;">下一题</button>
                </div>
            </div>
            <div class="game-options" id="game-options"></div>
            <div class="game-feedback" id="game-feedback"></div>
        </div>
    </div>
    
    <!-- 收藏夹 -->
    <div class="favorites-section mode-container" id="favorites-section">
        <h2 class="section-title">⭐ 我的收藏 ⭐</h2>
        <div class="container" id="favorites-container"></div>
    </div>
    
    <!-- 错题本 -->
    <div class="wrong-answers-section mode-container" id="wrong-answers-section">
        <h2 class="section-title">📝 我的错题本</h2>
        <div class="container" id="wrong-answers-container"></div>
    </div>
    
    <!-- 信息面板 -->
    <div class="info-panel" id="info-panel">
        <button class="close-btn" id="close-btn">×</button>
        <div class="info-content">
            <div class="character-display">
                <span id="display-char" class="character"></span>
                <span id="display-pinyin" class="pinyin"></span>
            </div>
            <div class="word-example" id="word-example"></div>
            <div class="sentence" id="sentence"></div>
            <button class="action-btn" id="add-favorite-btn">收藏这个字</button>
        </div>
    </div>

    <!-- 休息提醒模态框 -->
    <div class="rest-modal" id="rest-modal">
        <div class="rest-content">
            <h2>请休息一会儿</h2>
            <p>您已经学习了25分钟，建议休息5分钟后再继续。</p>
            <div id="math-question-container" style="display: none;">
                <div class="math-question" id="math-question"></div>
                <input type="number" class="math-answer" id="math-answer" placeholder="输入答案">
                <button class="action-btn" id="submit-math-answer">提交</button>
            </div>
            <button class="action-btn" id="continue-btn" style="display: none;">继续学习</button>
        </div>
    </div>

    <!-- 音频元素 -->
    <audio id="correct-sound" src="https://www.soundjay.com/buttons/sounds/button-09.mp3" preload="auto"></audio>
    <audio id="wrong-sound" src="https://www.soundjay.com/buttons/sounds/button-10.mp3" preload="auto"></audio>

    <script>
        // 汉字数据
        const characters = [
            { char: "一", pinyin: "yī", word: "一天", sentence: "我今天玩了一天。" },
            { char: "二", pinyin: "èr", word: "二月", sentence: "二月是春天的开始。" },

            { char: "可", pinyin: "kě", word: "可爱", sentence: "小兔子真可爱。" },

            { char: "好", pinyin: "hǎo", word: "好朋友", sentence: "他是我的好朋友。" },
            { char: "少", pinyin: "shǎo", word: "多少", sentence: "你有多少糖果？" },
            { char: "大", pinyin: "dà", word: "大树", sentence: "大树高高站。" },
            { char: "山", pinyin: "shān", word: "高山", sentence: "高山真雄伟。" },
            { char: "阳", pinyin: "yáng", word: "阳光", sentence: "阳光暖洋洋。" },
            { char: "草", pinyin: "cǎo", word: "青草", sentence: "小羊吃青草。" },
            { char: "快", pinyin: "kuài", word: "快乐", sentence: "我很快乐。" },

            { char: "吃", pinyin: "chī", word: "吃饭", sentence: "我要自己吃饭。" },
            { char: "牛", pinyin: "niú", word: "牛奶", sentence: "我每天喝牛奶。" },
            { char: "鸟", pinyin: "niǎo", word: "小鸟", sentence: "小鸟在唱歌。" },
            { char: "跑", pinyin: "pǎo", word: "跑步", sentence: "我喜欢跑步。" },
            { char: "兴", pinyin: "xìng", word: "高兴", sentence: "我今天真高兴。" }
        ];

        // 状态管理
        let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
        let wrongAnswers = JSON.parse(localStorage.getItem('wrongAnswers')) || [];
        let currentMode = 'grid';
        let currentCardIndex = 0;
        let currentGameQuestion = null;
        let gameCharacters = [...characters];
        
        // 游戏统计
        let stats = {
            total: 0,
            correct: 0,
            wrong: 0,
            time: 0
        };
        let timerInterval;
        let restTimer;
        
        // DOM元素
        const gridModeBtn = document.getElementById('grid-mode-btn');
        const cardModeBtn = document.getElementById('card-mode-btn');
        const gameModeBtn = document.getElementById('game-mode-btn');
        const favoritesBtn = document.getElementById('favorites-btn');
        const wrongAnswersBtn = document.getElementById('wrong-answers-btn');
        
        const gridMode = document.getElementById('grid-mode');
        const cardMode = document.getElementById('card-mode');
        const gameMode = document.getElementById('game-mode');
        const favoritesSection = document.getElementById('favorites-section');
        const wrongAnswersSection = document.getElementById('wrong-answers-section');
        
        const cardContainer = document.getElementById('card-container');
        const favoritesContainer = document.getElementById('favorites-container');
        const wrongAnswersContainer = document.getElementById('wrong-answers-container');
        
        // 音频元素
        const correctSound = document.getElementById('correct-sound');
        const wrongSound = document.getElementById('wrong-sound');
        
        // 初始化
        initGridMode();
        updateFavoriteButton();
        renderFavorites();
        renderWrongAnswers();
        loadStats();
        
        // 事件监听
        gridModeBtn.addEventListener('click', () => switchMode('grid'));
        cardModeBtn.addEventListener('click', () => switchMode('card'));
        gameModeBtn.addEventListener('click', () => switchMode('game'));
        favoritesBtn.addEventListener('click', () => switchMode('favorites'));
        wrongAnswersBtn.addEventListener('click', () => switchMode('wrong-answers'));
        
        document.getElementById('prev-btn').addEventListener('click', showPrevCard);
        document.getElementById('next-btn').addEventListener('click', showNextCard);
        document.getElementById('toggle-favorite-btn').addEventListener('click', toggleCurrentFavorite);
        
        document.getElementById('current-card').addEventListener('click', speakCurrentCard);
        
        document.getElementById('start-game-btn').addEventListener('click', startGame);
        document.getElementById('next-question-btn').addEventListener('click', nextQuestion);
        
        document.getElementById('close-btn').addEventListener('click', () => {
            document.getElementById('info-panel').style.display = 'none';
        });
        
        document.getElementById('add-favorite-btn').addEventListener('click', addCurrentToFavorites);
        
        document.getElementById('continue-btn').addEventListener('click', () => {
            document.getElementById('rest-modal').style.display = 'none';
        });
        
        document.getElementById('submit-math-answer').addEventListener('click', checkMathAnswer);
        
        // 初始化平铺模式
        function initGridMode() {
            cardContainer.innerHTML = '';
            characters.forEach((char, index) => {
                const card = createCard(char, index);
                cardContainer.appendChild(card);
            });
        }
        
        // 创建卡片
        function createCard(char, index) {
            const card = document.createElement('div');
            card.className = 'card';
            if (favorites.includes(char.char)) {
                card.classList.add('favorite');
            }
            
            // 添加装饰元素
            const deco1 = document.createElement('div');
            deco1.className = 'decoration';
            deco1.style.top = '5px';
            deco1.style.left = '5px';
            deco1.textContent = '✨';
            
            const deco2 = document.createElement('div');
            deco2.className = 'decoration';
            deco2.style.bottom = '5px';
            deco2.style.right = '5px';
            deco2.textContent = '⭐';
            
            const charElement = document.createElement('div');
            charElement.className = 'character';
            charElement.textContent = char.char;
            
            const pinyinElement = document.createElement('div');
            pinyinElement.className = 'pinyin';
            pinyinElement.textContent = char.pinyin;
            
            card.appendChild(deco1);
            card.appendChild(deco2);
            card.appendChild(charElement);
            card.appendChild(pinyinElement);
            
            // 点击事件
            card.addEventListener('click', () => {
                speak(`${char.char}，${char.word}，${char.sentence}`);
                showCharacterInfo(char);
            });
            
            return card;
        }
        
        // 显示字符信息
        function showCharacterInfo(char) {
            document.getElementById('display-char').textContent = char.char;
            document.getElementById('display-pinyin').textContent = char.pinyin;
            document.getElementById('word-example').textContent = `词语: ${char.word}`;
            document.getElementById('sentence').textContent = `句子: ${char.sentence}`;
            
            updateFavoriteButton(char.char);
            
            document.getElementById('info-panel').style.display = 'block';
            currentCardIndex = characters.findIndex(c => c.char === char.char);
        }
        
        // 切换模式
        function switchMode(mode) {
            currentMode = mode;
            
            // 隐藏所有模式
            document.querySelectorAll('.mode-container').forEach(el => {
                el.style.display = 'none';
            });
            
            // 更新按钮状态
            gridModeBtn.classList.remove('active');
            cardModeBtn.classList.remove('active');
            gameModeBtn.classList.remove('active');
            favoritesBtn.classList.remove('active');
            wrongAnswersBtn.classList.remove('active');
            
            // 显示当前模式
            switch (mode) {
                case 'grid':
                    gridMode.style.display = 'block';
                    gridModeBtn.classList.add('active');
                    break;
                case 'card':
                    cardMode.style.display = 'flex';
                    cardModeBtn.classList.add('active');
                    showCard(currentCardIndex);
                    break;
                case 'game':
                    gameMode.style.display = 'flex';
                    gameModeBtn.classList.add('active');
                    break;
                case 'favorites':
                    favoritesSection.style.display = 'block';
                    favoritesBtn.classList.add('active');
                    renderFavorites();
                    break;
                case 'wrong-answers':
                    wrongAnswersSection.style.display = 'block';
                    wrongAnswersBtn.classList.add('active');
                    renderWrongAnswers();
                    break;
            }
        }
        
        // 卡片模式功能
        function showCard(index) {
            if (index < 0) index = characters.length - 1;
            if (index >= characters.length) index = 0;
            
            currentCardIndex = index;
            const char = characters[index];
            
            document.getElementById('current-char').textContent = char.char;
            document.getElementById('current-pinyin').textContent = char.pinyin;
            document.getElementById('current-word').textContent = `词语: ${char.word}`;
            document.getElementById('current-sentence').textContent = `句子: ${char.sentence}`;
            
            updateFavoriteButton(char.char);
            
            speakCurrentCard();
        }
        
        function showPrevCard() {
            showCard(currentCardIndex - 1);
        }
        
        function showNextCard() {
            showCard(currentCardIndex + 1);
        }
        
        function speakCurrentCard() {
            const char = characters[currentCardIndex];
            speak(`${char.char}，${char.word}，${char.sentence}`);
        }
        
        function toggleCurrentFavorite() {
            const char = characters[currentCardIndex].char;
            toggleFavorite(char);
            updateFavoriteButton(char);
        }
        
        // 收藏功能
        function toggleFavorite(char) {
            const index = favorites.indexOf(char);
            if (index === -1) {
                favorites.push(char);
            } else {
                favorites.splice(index, 1);
            }
            localStorage.setItem('favorites', JSON.stringify(favorites));
            renderFavorites();
        }
        
        function addCurrentToFavorites() {
            const char = document.getElementById('display-char').textContent;
            toggleFavorite(char);
            updateFavoriteButton(char);
            
            // 更新卡片显示
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                if (card.querySelector('.character').textContent === char) {
                    if (favorites.includes(char)) {
                        card.classList.add('favorite');
                    } else {
                        card.classList.remove('favorite');
                    }
                }
            });
        }
        
        function updateFavoriteButton(char = '') {
            const isFavorite = favorites.includes(char);
            const btn = document.getElementById('toggle-favorite-btn');
            const addBtn = document.getElementById('add-favorite-btn');
            
            if (btn) btn.textContent = isFavorite ? '取消收藏' : '收藏';
            if (addBtn) addBtn.textContent = isFavorite ? '取消收藏' : '收藏这个字';
        }
        
        function renderFavorites() {
            favoritesContainer.innerHTML = '';
            
            if (favorites.length === 0) {
                favoritesContainer.innerHTML = '<p>你还没有收藏任何汉字哦，快去学习吧！</p>';
                return;
            }
            
            favorites.forEach(char => {
                const character = characters.find(c => c.char === char);
                if (character) {
                    const card = createCard(character);
                    favoritesContainer.appendChild(card);
                }
            });
        }
        
        // 错题本功能
        function renderWrongAnswers() {
            wrongAnswersContainer.innerHTML = '';
            
            if (wrongAnswers.length === 0) {
                wrongAnswersContainer.innerHTML = '<p>错题本为空，答错的字会自动加入这里</p>';
                return;
            }
            
            wrongAnswers.forEach(char => {
                const character = characters.find(c => c.char === char);
                if (character) {
                    const card = createCard(character);
                    
                    // 添加移除功能
                    card.addEventListener('click', function() {
                        if (confirm(`是否要从错题本中移除"${char}"？`)) {
                            removeFromWrongAnswers(char);
                        }
                    });
                    
                    wrongAnswersContainer.appendChild(card);
                }
            });
        }
        
        function addToWrongAnswers(char) {
            if (!wrongAnswers.includes(char)) {
                wrongAnswers.push(char);
                localStorage.setItem('wrongAnswers', JSON.stringify(wrongAnswers));
                renderWrongAnswers();
            }
        }
        
        function removeFromWrongAnswers(char) {
            const index = wrongAnswers.indexOf(char);
            if (index !== -1) {
                wrongAnswers.splice(index, 1);
                localStorage.setItem('wrongAnswers', JSON.stringify(wrongAnswers));
                renderWrongAnswers();
            }
        }
        
        // 游戏模式功能
        function startGame() {
            document.getElementById('game-area').style.display = 'block';
            document.getElementById('start-game-btn').style.display = 'none';
            document.getElementById('next-question-btn').style.display = 'none';
            document.getElementById('game-feedback').textContent = '';
            
            // 重置游戏题库
            const useWrongAnswers = document.getElementById('use-wrong-answers').checked;
            if (useWrongAnswers && wrongAnswers.length > 0) {
                gameCharacters = wrongAnswers.map(char => characters.find(c => c.char === char)).filter(Boolean);
            } else {
                gameCharacters = [...characters];
            }
            
            // 开始计时
            startTimer();
            
            nextQuestion();
        }
        
        function nextQuestion() {
            const difficulty = parseInt(document.getElementById('difficulty').value);
            document.getElementById('next-question-btn').style.display = 'none';
            document.getElementById('game-feedback').textContent = '';
            
            // 随机选择一个问题
            if (gameCharacters.length === 0) {
                const useWrongAnswers = document.getElementById('use-wrong-answers').checked;
                if (useWrongAnswers && wrongAnswers.length > 0) {
                    gameCharacters = wrongAnswers.map(char => characters.find(c => c.char === char)).filter(Boolean);
                } else {
                    gameCharacters = [...characters];
                }
            }
            
            const questionIndex = Math.floor(Math.random() * gameCharacters.length);
            const question = gameCharacters[questionIndex];
            gameCharacters.splice(questionIndex, 1);
            
            currentGameQuestion = question;
            
            // 朗读问题
            speak(`${question.char}`);
            
            // 显示问题
            document.getElementById('game-question').textContent = "请选择正确答案";
            document.getElementById('game-question').dataset.correctChar = question.char;
            
            // 生成选项
            const options = [question];
            while (options.length < difficulty) {
                const randomChar = characters[Math.floor(Math.random() * characters.length)];
                if (!options.some(opt => opt.char === randomChar.char)) {
                    options.push(randomChar);
                }
            }
            
            // 打乱选项顺序
            shuffleArray(options);
            
            // 显示选项
            const optionsContainer = document.getElementById('game-options');
            optionsContainer.innerHTML = '';
            
            options.forEach(option => {
                const card = document.createElement('div');
                card.className = 'game-card';
                
                const charElement = document.createElement('div');
                charElement.className = 'game-character';
                charElement.textContent = option.char;
                
                card.appendChild(charElement);
                
                card.addEventListener('click', () => checkAnswer(option.char === question.char, card));
                
                optionsContainer.appendChild(card);
            });
        }
        
        function checkAnswer(isCorrect, cardElement) {
            const feedback = document.getElementById('game-feedback');
            const correctChar = document.getElementById('game-question').dataset.correctChar;
            
            // 更新统计
            updateStats(isCorrect);
            
            if (isCorrect) {
                // 正确反馈
                feedback.textContent = `✓ 答对了！正确答案是"${correctChar}"`;
                feedback.className = 'game-feedback correct';
                correctSound.play();
                
                // 如果这个字在错题本中，移除它
                removeFromWrongAnswers(correctChar);
                
                // 庆祝动画
                cardElement.classList.add('celebrate');
                createConfetti();
                
                // 语音鼓励
                setTimeout(() => speak(`答对了！正确答案是${correctChar}`), 800);
            } else {
                // 错误反馈
                feedback.textContent = `✗ 答错了！正确答案是"${correctChar}"`;
                feedback.className = 'game-feedback incorrect';
                wrongSound.play();
                
                // 添加到错题本
                addToWrongAnswers(correctChar);
                
                // 抖动动画
                cardElement.classList.add('shake');
                
                // 语音鼓励
                setTimeout(() => speak(`答错了，正确答案是${correctChar}`), 800);
            }
            
            // 移除动画类
            setTimeout(() => {
                cardElement.classList.remove('celebrate', 'shake');
            }, 1000);
            
            document.getElementById('next-question-btn').style.display = 'block';
        }
        
        // 统计功能
        function loadStats() {
            const savedStats = localStorage.getItem('gameStats');
            if (savedStats) {
                stats = JSON.parse(savedStats);
                updateStatsDisplay();
            }
        }
        
        function updateStats(isCorrect) {
            if (isCorrect !== undefined) {
                stats.total++;
                if (isCorrect) {
                    stats.correct++;
                } else {
                    stats.wrong++;
                }
                localStorage.setItem('gameStats', JSON.stringify(stats));
            }
            updateStatsDisplay();
        }
        
        function updateStatsDisplay() {
            document.getElementById('total-answers').textContent = stats.total;
            document.getElementById('correct-answers').textContent = stats.correct;
            document.getElementById('wrong-answers').textContent = stats.wrong;
            document.getElementById('usage-time').textContent = Math.floor(stats.time / 60);
        }
        
        // 计时器功能
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                stats.time++;
                if (stats.time % 10 === 0) {
                    localStorage.setItem('gameStats', JSON.stringify(stats));
                }
                updateStatsDisplay();
                
                // 每25分钟提醒休息
                if (stats.time % (25 * 60) === 0 && stats.time > 0) {
                    showRestModal();
                }
            }, 1000);
        }
        
        // 休息提醒
        function showRestModal() {
            const modal = document.getElementById('rest-modal');
            const mathContainer = document.getElementById('math-question-container');
            const continueBtn = document.getElementById('continue-btn');
            
            modal.style.display = 'flex';
            mathContainer.style.display = 'none';
            continueBtn.style.display = 'none';
            
            // 5分钟后显示继续按钮
            setTimeout(() => {
                continueBtn.style.display = 'inline-block';
            }, 300000); // 5分钟
            
            // 随机决定是否显示数学题
            if (Math.random() > 0.5) {
                mathContainer.style.display = 'block';
                generateMathQuestion();
            }
        }
        
        function generateMathQuestion() {
            const a = Math.floor(Math.random() * 8) + 2; // 2-9
            const b = Math.floor(Math.random() * 8) + 2; // 2-9
            document.getElementById('math-question').textContent = `${a} × ${b} = ?`;
            document.getElementById('math-question').dataset.answer = a * b;
        }
        
        function checkMathAnswer() {
            const answer = parseInt(document.getElementById('math-answer').value);
            const correctAnswer = parseInt(document.getElementById('math-question').dataset.answer);
            
            if (answer === correctAnswer) {
                alert('回答正确！可以继续学习了。');
                document.getElementById('rest-modal').style.display = 'none';
            } else {
                alert('回答错误，请再试一次！');
            }
        }
        
        // 创建庆祝彩花
        function createConfetti() {
            const colors = ['#f00', '#0f0', '#00f', '#ff0', '#f0f', '#0ff'];
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.top = '-10px';
                document.body.appendChild(confetti);
                
                // 动画
                const animation = confetti.animate([
                    { top: '-10px', transform: 'rotate(0deg)', opacity: 1 },
                    { top: window.innerHeight + 'px', transform: 'rotate(360deg)', opacity: 0 }
                ], {
                    duration: 1000 + Math.random() * 2000,
                    easing: 'cubic-bezier(0.1, 0.8, 0.9, 1)'
                });
                
                animation.onfinish = () => confetti.remove();
            }
        }
        
        // 辅助函数
        function speak(text) {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.8;
                speechSynthesis.speak(utterance);
            } else {
                alert('您的浏览器不支持语音合成功能，请使用Chrome或Edge浏览器。');
            }
        }
        
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }
    </script>
</body>
</html>
