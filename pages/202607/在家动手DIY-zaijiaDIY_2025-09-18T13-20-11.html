<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在家动手DIY</title>
    <style>
        :root {
            --color1: #A3B8C5;
            --color2: #B8A3C5;
            --color3: #C5A3B8;
            --color4: #A3C5B8;
            --color5: #C5B8A3;
            --color6: #B8C5A3;
            --color7: #A3A3C5;
            --color8: #C5A3A3;
            --color9: #A3C5A3;
            --color10: #C5C5A3;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        
        .card {
            width: 100%;
            min-height: 500px;
            border-radius: 15px;
            padding: 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            margin-bottom: 30px;
            background-color: var(--color1);
            color: #333;
        }
        
        .craft-name {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        .emoji-container {
            font-size: 100px;
            margin-bottom: 20px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .craft-desc {
            font-size: 16px;
            line-height: 1.6;
            max-width: 600px;
            text-align: left;
            white-space: pre-line;
        }
        
        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #333;
            color: white;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        button:hover {
            opacity: 0.8;
        }
        
        .color-options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .color-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s;
        }
        
        .color-option:hover {
            transform: scale(1.1);
        }
        
        .color-option.selected {
            border-color: #333;
        }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }
        
        @media (max-width: 600px) {
            .card {
                height: auto;
                padding: 20px;
            }
            
            .craft-name {
                font-size: 24px;
            }
            
            .emoji-container {
                font-size: 80px;
                height: 120px;
            }
            
            .buttons {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>在家动手DIY</h1>
        
        <div class="card" id="craftCard">
            <div class="craft-name" id="craftName"></div>
            <div class="emoji-container" id="emojiContainer"></div>
            <div class="craft-desc" id="craftDesc"></div>
        </div>
        
        <div class="buttons">
            <button id="changeCraftBtn">换一个DIY教程</button>
            <button id="exportBtn">导出DIY卡片</button>
        </div>
        
        <div class="color-options" id="colorOptions"></div>
    </div>
    
    <div class="footer">
        <div>本工具由777制作</div>
        <div>微信 wsnd15708717192</div>
    </div>
    
    <script>
        // 莫兰迪色系
        const colors = [
            { name: '灰蓝', value: 'var(--color1)' },
            { name: '灰紫', value: 'var(--color2)' },
            { name: '灰粉', value: 'var(--color3)' },
            { name: '灰绿', value: 'var(--color4)' },
            { name: '灰黄', value: 'var(--color5)' },
            { name: '灰绿黄', value: 'var(--color6)' },
            { name: '灰蓝紫', value: 'var(--color7)' },
            { name: '灰红', value: 'var(--color8)' },
            { name: '灰绿', value: 'var(--color9)' },
            { name: '灰黄', value: 'var(--color10)' }
        ];
        
        // DIY小摆件数据库 - 使用emoji代替图片
        const diyCrafts = [
            {
                name: "纸杯小夜灯",
                emoji: "💡",
                desc: `材料准备：
- 纸杯 1个
- LED小灯串 1串
- 剪刀 1把
- 马克笔 1支
- 尺子 1把

制作步骤：
1. 设计图案：在纸杯外侧用马克笔画出你喜欢的图案轮廓
2. 剪裁图案：用剪刀沿着轮廓线小心剪出图案
3. 安装灯串：将LED灯串从杯口放入，灯珠均匀分布在杯内
4. 固定灯串：将灯串开关固定在杯口边缘方便操作
5. 测试效果：接通电源，检查灯光效果

小贴士：
- 可以尝试不同图案，如星星、月亮、爱心等
- 使用彩色纸杯效果更佳
- 灯串长度可根据杯子大小调整`
            },
            {
                name: "瓶盖象棋",
                emoji: "♟️",
                desc: `材料准备：
- 瓶盖 32个（16红16黑）
- 丙烯颜料 红黑两色
- 细毛笔 1支
- 清漆 1小瓶
- 尺子 1把

制作步骤：
1. 清洗瓶盖：将所有瓶盖彻底清洗干净并晾干
2. 上底色：将瓶盖分成两组，分别涂成红色和黑色
3. 绘制字符：等底色干后，用细毛笔写上象棋字符
   - 将：帅、士、仕、象、相、车、马、炮、兵、卒
4. 上保护层：待颜料干透后，涂上一层清漆保护
5. 制作棋盘：用硬纸板画出标准象棋棋盘

小贴士：
- 字符书写要清晰易辨认
- 可以先用铅笔打底再上色
- 清漆可以使棋子更耐用`
            },
            {
                name: "纸筒笔筒",
                emoji: "✏️",
                desc: `材料准备：
- 卫生纸筒 3-4个
- 包装纸 1张
- 白胶 1瓶
- 剪刀 1把
- 尺子 1把

制作步骤：
1. 裁剪包装纸：根据纸筒高度和周长裁剪合适大小
2. 粘贴包装纸：在纸筒外侧均匀涂抹白胶，小心贴上包装纸
3. 修饰边缘：用剪刀修剪多余部分，确保边缘整齐
4. 组合造型：将多个装饰好的纸筒用胶水粘合成喜欢的形状
   - 可做成三角形、直线形等
5. 加固底部：剪圆形硬纸板粘贴在底部增加稳定性

小贴士：
- 可以使用不同花纹的包装纸创造多彩效果
- 可以在表面添加贴纸、丝带等装饰
- 多个纸筒组合时注意保持平衡`
            },
            {
                name: "蛋壳盆栽",
                emoji: "🥚",
                desc: `材料准备：
- 鸡蛋壳 数个
- 小植物或多肉植物 若干
- 营养土 适量
- 小勺子 1把
- 蛋托 1个

制作步骤：
1. 准备蛋壳：在鸡蛋顶部开小孔，倒出内容物，清洗干净
2. 装饰蛋壳：可以用颜料在蛋壳上绘制简单图案
3. 填充土壤：用小勺子将营养土装入蛋壳约2/3满
4. 种植植物：小心将小植物栽入蛋壳中，压实土壤
5. 摆放展示：将完成的蛋壳盆栽放在蛋托中固定

小贴士：
- 蛋壳底部可钻小孔作为排水孔
- 适合种植小型多肉植物或微型绿植
- 可制作多个组成蛋壳盆栽系列`
            },
            {
                name: "吸管风铃",
                emoji: "🎐",
                desc: `材料准备：
- 彩色吸管 20-30根
- 细绳或鱼线 适量
- 小铃铛 数个
- 剪刀 1把
- 圆环或树枝 1个

制作步骤：
1. 剪裁吸管：将吸管剪成5-15cm不等长度
2. 设计排列：规划吸管长度排列顺序，形成渐变效果
3. 串连吸管：用细绳将吸管按设计顺序串连
4. 固定上端：将串好的吸管组均匀系在圆环或树枝上
5. 添加铃铛：在最下方系上小铃铛

小贴士：
- 可使用不同颜色吸管创造多彩效果
- 吸管长度差异越大，声音变化越丰富
- 挂在通风处效果最佳`
            },
            {
                name: "纽扣画",
                emoji: "🖼️",
                desc: `材料准备：
- 各种纽扣 50-100个
- 胶水 1瓶
- 画板或硬纸板 1块
- 铅笔 1支
- 颜料 可选

制作步骤：
1. 设计图案：在画板上用铅笔勾勒出简单图案
2. 分类纽扣：按颜色、大小将纽扣分类
3. 粘贴纽扣：根据设计图案用胶水粘贴纽扣
4. 填充细节：用不同大小纽扣填充图案细节
5. 加固完成：待胶水干透后检查是否牢固

小贴士：
- 可以先在纸上练习图案设计
- 使用不同材质纽扣增加质感
- 完成后可喷一层清漆保护`
            },
            {
                name: "瓶盖磁贴",
                emoji: "🧲",
                desc: `材料准备：
- 瓶盖 10-20个
- 小磁铁 10-20个
- 装饰材料（贴纸、颜料等）
- 胶水 1瓶
- 剪刀 1把

制作步骤：
1. 清洗瓶盖：彻底清洗并晾干所有瓶盖
2. 装饰瓶盖：用颜料、贴纸等装饰瓶盖表面
3. 粘贴磁铁：在瓶盖内侧用胶水固定小磁铁
4. 等待干燥：确保磁铁牢固粘贴
5. 使用测试：将完成的磁贴吸附在金属表面测试

小贴士：
- 可以制作成字母、数字或图案系列
- 使用强力胶确保磁铁牢固
- 可作为冰箱贴或留言板使用`
            },
            {
                name: "纸盒收纳",
                emoji: "🗃️",
                desc: `材料准备：
- 纸盒 数个
- 包装纸或布料
- 剪刀 1把
- 胶水或双面胶
- 尺子 1把

制作步骤：
1. 清洁纸盒：确保纸盒干净无污渍
2. 测量尺寸：测量纸盒各面尺寸
3. 裁剪材料：根据尺寸裁剪包装纸或布料
4. 粘贴装饰：将材料粘贴在纸盒表面
5. 组合使用：将多个装饰好的纸盒组合成收纳系统

小贴士：
- 可以使用统一风格的材料创造系列感
- 内部可添加分隔板增加功能性
- 适合收纳文具、化妆品等小物品`
            },
            {
                name: "毛线杯垫",
                emoji: "🧶",
                desc: `材料准备：
- 彩色毛线 1卷
- 硬纸板 1块
- 剪刀 1把
- 胶水 1瓶
- 圆规或圆形模板

制作步骤：
1. 制作基底：在硬纸板上画出圆形并剪下
2. 剪裁毛线：将毛线剪成适当长度
3. 缠绕毛线：从中心开始将毛线缠绕在纸板上
4. 固定末端：用胶水固定毛线末端
5. 装饰完成：可添加流苏等装饰

小贴士：
- 使用不同颜色毛线创造多彩效果
- 缠绕时保持力度均匀
- 可制作多个组成系列`
            },
            {
                name: "石头彩绘",
                emoji: "🎨",
                desc: `材料准备：
- 光滑石头 数个
- 丙烯颜料
- 画笔 数支
- 调色盘
- 清漆 1小瓶

制作步骤：
1. 清洗石头：彻底清洗并晾干石头
2. 设计图案：在石头上用铅笔勾勒图案
3. 上色绘制：用丙烯颜料绘制图案
4. 等待干燥：确保颜料完全干透
5. 上保护层：涂上一层清漆保护图案

小贴士：
- 选择表面光滑的石头更易绘制
- 可以从简单图案开始练习
- 完成后可作为装饰或镇纸使用`
            }
        ];
        
        // 获取DOM元素
        const craftCard = document.getElementById('craftCard');
        const craftName = document.getElementById('craftName');
        const emojiContainer = document.getElementById('emojiContainer');
        const craftDesc = document.getElementById('craftDesc');
        const changeCraftBtn = document.getElementById('changeCraftBtn');
        const exportBtn = document.getElementById('exportBtn');
        const colorOptions = document.getElementById('colorOptions');
        
        // 初始化颜色选项
        colors.forEach((color, index) => {
            const colorDiv = document.createElement('div');
            colorDiv.className = 'color-option';
            colorDiv.style.backgroundColor = color.value;
            colorDiv.dataset.color = color.value;
            if (index === 0) {
                colorDiv.classList.add('selected');
            }
            colorDiv.addEventListener('click', () => {
                document.querySelectorAll('.color-option').forEach(option => {
                    option.classList.remove('selected');
                });
                colorDiv.classList.add('selected');
                craftCard.style.backgroundColor = color.value;
            });
            colorOptions.appendChild(colorDiv);
        });
        
        // 设置初始颜色
        craftCard.style.backgroundColor = colors[0].value;
        
        // 随机获取DIY项目
        function getRandomCraft() {
            const randomIndex = Math.floor(Math.random() * diyCrafts.length);
            return diyCrafts[randomIndex];
        }
        
        // 更新DIY项目
        function updateCraft() {
            const craft = getRandomCraft();
            craftName.textContent = craft.name;
            emojiContainer.textContent = craft.emoji;
            craftDesc.textContent = craft.desc;
        }
        
        // 导出图片
        function exportAsImage() {
            const card = document.getElementById('craftCard');
            
            html2canvas(card).then(canvas => {
                const link = document.createElement('a');
                link.download = 'DIY卡片.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
        
        // 添加事件监听器
        changeCraftBtn.addEventListener('click', updateCraft);
        exportBtn.addEventListener('click', exportAsImage);
        
        // 初始化
        updateCraft();
    </script>
    
    <!-- html2canvas库用于导出图片 -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</body>
</html>
