<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人情账本</title>
    <style>
        :root {
            --primary-color: #4a6baf;
            --secondary-color: #f0f2f5;
            --income-color: #27ae60;
            --expense-color: #e74c3c;
            --pending-color: #f39c12;
            --paid-color: #2ecc71;
            --text-color: #333;
            --light-text: #7f8c8d;
            --border-color: #ddd;
            --white: #fff;
            --delete-color: #d63031;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--secondary-color);
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        
        h1 {
            color: var(--primary-color);
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: var(--light-text);
            font-size: 1rem;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .stat-card {
            background: var(--white);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .stat-title {
            font-size: 0.9rem;
            color: var(--light-text);
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        .income {
            color: var(--income-color);
        }
        
        .expense {
            color: var(--expense-color);
        }
        
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        select, input, button {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 0.95rem;
        }
        
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        button:hover {
            opacity: 0.9;
        }
        
        button i {
            font-size: 1rem;
        }
        
        .btn-add {
            padding: 8px 15px;
        }
        
        .btn-export {
            background-color: var(--light-text);
        }
        
        .btn-delete {
            background-color: var(--delete-color);
        }
        
        .close-btn {
            background-color: var(--light-text);
        }
        
        .records-container {
            background: var(--white);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .record {
            display: grid;
            grid-template-columns: 1fr auto;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.2s;
            position: relative;
        }
        
        .record:last-child {
            border-bottom: none;
        }
        
        .record:hover {
            background-color: #f9f9f9;
        }
        
        .record-info {
            display: flex;
            flex-direction: column;
        }
        
        .record-person {
            font-weight: 600;
            margin-bottom: 3px;
        }
        
        .record-meta {
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
            color: var(--light-text);
        }
        
        .record-amount {
            font-weight: bold;
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        
        .amount-value {
            font-size: 1.1rem;
            margin-bottom: 3px;
        }
        
        .record-status {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 10px;
            color: white;
        }
        
        .record-actions {
            position: absolute;
            right: 20px;
            bottom: 15px;
            display: flex;
            gap: 5px;
        }
        
        .action-btn {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            padding: 0;
        }
        
        .status-pending {
            background-color: var(--pending-color);
        }
        
        .status-paid {
            background-color: var(--paid-color);
        }
        
        .received {
            color: var(--income-color);
        }
        
        .given {
            color: var(--expense-color);
        }
        
        .no-records {
            text-align: center;
            padding: 40px 20px;
            color: var(--light-text);
        }
        
        /* 模态框样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background-color: var(--white);
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            animation: modalFadeIn 0.3s;
        }
        
        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .modal-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-title {
            font-size: 1.2rem;
            font-weight: 600;
        }
        
        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--light-text);
            cursor: pointer;
            padding: 5px;
        }
        
        .modal-body {
            padding: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: var(--text-color);
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
        }
        
        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }
        
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 15px 20px;
            border-top: 1px solid var(--border-color);
        }
        
        .btn-cancel {
            background-color: var(--light-text);
        }
        
        /* 确认删除模态框 */
        .confirm-modal {
            text-align: center;
        }
        
        .confirm-message {
            margin-bottom: 20px;
            font-size: 1.1rem;
        }
        
        .confirm-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        
        /* 响应式调整 */
        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr 1fr;
            }
            
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            
            .filters {
                flex-direction: column;
                gap: 8px;
            }
            
            .record-meta {
                flex-direction: column;
                gap: 3px;
            }
        }
        
        @media (max-width: 480px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            
            .record {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            
            .record-amount {
                align-items: flex-start;
            }
            
            .record-actions {
                position: static;
                justify-content: flex-end;
                margin-top: 10px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <h1>人情账本</h1>
        <p class="subtitle">记录每一份人情往来，维系美好人际关系</p>
    </header>
    
    <div class="dashboard">
        <div class="stat-card">
            <div class="stat-title">本月收礼</div>
            <div class="stat-value income" id="month-income">¥0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">本月送礼</div>
            <div class="stat-value expense" id="month-expense">¥0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">待收回礼</div>
            <div class="stat-value income" id="pending-receive">¥0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">待还人情</div>
            <div class="stat-value expense" id="pending-pay">¥0</div>
        </div>
    </div>
    
    <div class="toolbar">
        <div class="filters">
            <select id="filter-type">
                <option value="all">所有类型</option>
                <option value="received">收礼</option>
                <option value="given">送礼</option>
            </select>
            <select id="filter-status">
                <option value="all">所有状态</option>
                <option value="pending">未还</option>
                <option value="paid">已还</option>
            </select>
            <select id="filter-month">
                <option value="all">所有时间</option>
                <option value="this-month">本月</option>
                <option value="last-month">上月</option>
                <option value="this-year">今年</option>
            </select>
        </div>
        <div>
            <button class="btn-export" id="export-btn">
                <i class="fas fa-download"></i> 导出
            </button>
            <button class="btn-add" id="add-record-btn">
                <i class="fas fa-plus"></i> 添加记录
            </button>
        </div>
    </div>
    
    <div class="records-container">
        <div id="record-list">
            <!-- 记录将通过JavaScript动态加载 -->
        </div>
    </div>
    
    <!-- 添加/编辑记录模态框 -->
    <div class="modal" id="record-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title">添加新记录</h3>
                <button class="close-btn" id="close-modal">&times;</button>
            </div>
            <form id="record-form">
                <div class="modal-body">
                    <input type="hidden" id="record-id">
                    <div class="form-group">
                        <label for="record-date">日期</label>
                        <input type="date" id="record-date" required>
                    </div>
                    <div class="form-group">
                        <label for="record-person">人物</label>
                        <input type="text" id="record-person" placeholder="输入姓名" required>
                    </div>
                    <div class="form-group">
                        <label for="record-amount">金额</label>
                        <input type="number" id="record-amount" placeholder="输入金额" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="record-event">场合</label>
                        <select id="record-event" required>
                            <option value="">选择场合</option>
                            <option value="婚礼">婚礼</option>
                            <option value="生日">生日</option>
                            <option value="节日">节日</option>
                            <option value="满月酒">满月酒</option>
                            <option value="乔迁">乔迁</option>
                            <option value="升学">升学</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="record-type">类型</label>
                        <select id="record-type" required>
                            <option value="">选择类型</option>
                            <option value="received">收礼</option>
                            <option value="given">送礼</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="record-status">状态</label>
                        <select id="record-status" required>
                            <option value="pending">未还</option>
                            <option value="paid">已还</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="record-notes">备注</label>
                        <textarea id="record-notes" placeholder="可添加备注信息（如礼品详情、特殊说明等）"></textarea>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-cancel" id="cancel-btn">取消</button>
                    <button type="submit" id="save-btn">保存记录</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- 导出数据模态框 -->
    <div class="modal" id="export-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">导出数据</h3>
                <button class="close-btn" id="close-export-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>选择导出格式</label>
                    <div style="display: flex; gap: 10px; margin-top: 10px;">
                        <button type="button" id="export-json" style="flex: 1;">JSON</button>
                        <button type="button" id="export-csv" style="flex: 1;">CSV</button>
                    </div>
                </div>
                <div class="form-group" style="margin-top: 20px;">
                    <label>导出数据预览</label>
                    <textarea id="export-preview" style="height: 150px;" readonly></textarea>
                </div>
            </div>
            <div class="form-actions">
                <button type="button" class="btn-cancel" id="cancel-export">关闭</button>
                <button type="button" id="copy-export">复制到剪贴板</button>
            </div>
        </div>
    </div>
    
    <!-- 确认删除模态框 -->
    <div class="modal" id="delete-modal">
        <div class="modal-content confirm-modal">
            <div class="modal-header">
                <h3 class="modal-title">确认删除</h3>
                <button class="close-btn" id="close-delete-modal">&times;</button>
            </div>
            <div class="modal-body">
                <p class="confirm-message">确定要删除这条记录吗？此操作无法撤销。</p>
                <div class="confirm-buttons">
                    <button type="button" class="btn-cancel" id="cancel-delete">取消</button>
                    <button type="button" class="btn-delete" id="confirm-delete">确认删除</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 初始化数据
        let records = JSON.parse(localStorage.getItem('renqingRecords')) || [];
        let editingId = null;
        let deletingId = null;
        
        // DOM元素
        const recordList = document.getElementById('record-list');
        const addRecordBtn = document.getElementById('add-record-btn');
        const exportBtn = document.getElementById('export-btn');
        const recordModal = document.getElementById('record-modal');
        const exportModal = document.getElementById('export-modal');
        const deleteModal = document.getElementById('delete-modal');
        const recordForm = document.getElementById('record-form');
        const closeModalBtn = document.getElementById('close-modal');
        const closeExportModalBtn = document.getElementById('close-export-modal');
        const closeDeleteModalBtn = document.getElementById('close-delete-modal');
        const cancelBtn = document.getElementById('cancel-btn');
        const cancelExportBtn = document.getElementById('cancel-export');
        const cancelDeleteBtn = document.getElementById('cancel-delete');
        const confirmDeleteBtn = document.getElementById('confirm-delete');
        const copyExportBtn = document.getElementById('copy-export');
        const exportJsonBtn = document.getElementById('export-json');
        const exportCsvBtn = document.getElementById('export-csv');
        const exportPreview = document.getElementById('export-preview');
        
        // 筛选元素
        const filterType = document.getElementById('filter-type');
        const filterStatus = document.getElementById('filter-status');
        const filterMonth = document.getElementById('filter-month');
        
        // 统计元素
        const monthIncomeEl = document.getElementById('month-income');
        const monthExpenseEl = document.getElementById('month-expense');
        const pendingReceiveEl = document.getElementById('pending-receive');
        const pendingPayEl = document.getElementById('pending-pay');
        
        // 初始化
        renderRecords();
        updateSummary();
        
        // 事件监听
        addRecordBtn.addEventListener('click', openAddModal);
        exportBtn.addEventListener('click', openExportModal);
        closeModalBtn.addEventListener('click', closeModal);
        closeExportModalBtn.addEventListener('click', closeExportModal);
        closeDeleteModalBtn.addEventListener('click', closeDeleteModal);
        cancelBtn.addEventListener('click', closeModal);
        cancelExportBtn.addEventListener('click', closeExportModal);
        cancelDeleteBtn.addEventListener('click', closeDeleteModal);
        confirmDeleteBtn.addEventListener('click', deleteRecord);
        copyExportBtn.addEventListener('click', copyExportData);
        exportJsonBtn.addEventListener('click', () => previewExportData('json'));
        exportCsvBtn.addEventListener('click', () => previewExportData('csv'));
        recordForm.addEventListener('submit', saveRecord);
        
        // 筛选器事件
        filterType.addEventListener('change', renderRecords);
        filterStatus.addEventListener('change', renderRecords);
        filterMonth.addEventListener('change', renderRecords);
        
        // 函数：打开添加记录模态框
        function openAddModal() {
            editingId = null;
            document.getElementById('modal-title').textContent = '添加新记录';
            document.getElementById('record-form').reset();
            document.getElementById('record-date').valueAsDate = new Date();
            recordModal.style.display = 'flex';
        }
        
        // 函数：打开导出模态框
        function openExportModal() {
            exportModal.style.display = 'flex';
            previewExportData('json'); // 默认显示JSON预览
        }
        
        // 函数：打开删除确认模态框
        function openDeleteModal(id) {
            deletingId = id;
            deleteModal.style.display = 'flex';
        }
        
        // 函数：关闭模态框
        function closeModal() {
            recordModal.style.display = 'none';
        }
        
        function closeExportModal() {
            exportModal.style.display = 'none';
        }
        
        function closeDeleteModal() {
            deleteModal.style.display = 'none';
        }
        
        // 函数：渲染记录列表
        function renderRecords() {
            const typeFilter = filterType.value;
            const statusFilter = filterStatus.value;
            const monthFilter = filterMonth.value;
            
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();
            
            const filteredRecords = records.filter(record => {
                // 类型筛选
                const typeMatch = typeFilter === 'all' || 
                                 (typeFilter === 'received' && record.type === 'received') || 
                                 (typeFilter === 'given' && record.type === 'given');
                
                // 状态筛选
                const statusMatch = statusFilter === 'all' || 
                                   (statusFilter === 'pending' && record.status === 'pending') || 
                                   (statusFilter === 'paid' && record.status === 'paid');
                
                // 时间筛选
                let monthMatch = true;
                if (monthFilter !== 'all') {
                    const recordDate = new Date(record.date);
                    const recordMonth = recordDate.getMonth();
                    const recordYear = recordDate.getFullYear();
                    
                    if (monthFilter === 'this-month') {
                        monthMatch = recordMonth === currentMonth && recordYear === currentYear;
                    } else if (monthFilter === 'last-month') {
                        const lastMonth = currentMonth === 0 ? 11 : currentMonth - 1;
                        const lastYear = currentMonth === 0 ? currentYear - 1 : currentYear;
                        monthMatch = recordMonth === lastMonth && recordYear === lastYear;
                    } else if (monthFilter === 'this-year') {
                        monthMatch = recordYear === currentYear;
                    }
                }
                
                return typeMatch && statusMatch && monthMatch;
            }).sort((a, b) => new Date(b.date) - new Date(a.date)); // 按日期倒序排序
            
            if (filteredRecords.length === 0) {
                recordList.innerHTML = '<div class="no-records">没有符合条件的记录</div>';
                return;
            }
            
            recordList.innerHTML = '';
            
            filteredRecords.forEach(record => {
                const recordEl = document.createElement('div');
                recordEl.className = 'record';
                
                const date = new Date(record.date);
                const formattedDate = `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
                
                recordEl.innerHTML = `
                    <div class="record-info">
                        <div class="record-person">${record.person}</div>
                        <div class="record-meta">
                            <span>${record.event}</span>
                            <span>${formattedDate}</span>
                        </div>
                    </div>
                    <div class="record-amount">
                        <div class="amount-value ${record.type === 'received' ? 'received' : 'given'}">
                            ${record.type === 'received' ? '+' : '-'}¥${record.amount}
                        </div>
                        <div class="record-status status-${record.status}">
                            ${record.status === 'pending' ? '未还' : '已还'}
                        </div>
                    </div>
                    <div class="record-actions">
                        <button class="action-btn" title="编辑" data-id="${record.id}">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="action-btn btn-delete" title="删除" data-id="${record.id}">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
                
                // 添加编辑和删除事件
                const editBtn = recordEl.querySelector('.fa-edit').closest('button');
                const deleteBtn = recordEl.querySelector('.fa-trash').closest('button');
                
                editBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    editRecord(editBtn.dataset.id);
                });
                
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openDeleteModal(deleteBtn.dataset.id);
                });
                
                // 整行点击也可以编辑
                recordEl.addEventListener('click', () => {
                    editRecord(editBtn.dataset.id);
                });
                
                recordList.appendChild(recordEl);
            });
        }
        
        // 函数：保存记录
        function saveRecord(e) {
            e.preventDefault();
            
            const id = editingId || Date.now().toString();
            const date = document.getElementById('record-date').value;
            const person = document.getElementById('record-person').value;
            const amount = parseInt(document.getElementById('record-amount').value);
            const event = document.getElementById('record-event').value;
            const type = document.getElementById('record-type').value;
            const status = document.getElementById('record-status').value;
            const notes = document.getElementById('record-notes').value;
            
            const newRecord = {
                id,
                date,
                person,
                amount,
                event,
                type,
                status,
                notes
            };
            
            if (editingId) {
                // 更新现有记录
                const index = records.findIndex(r => r.id === editingId);
                records[index] = newRecord;
            } else {
                // 添加新记录
                records.unshift(newRecord);
            }
            
            localStorage.setItem('renqingRecords', JSON.stringify(records));
            closeModal();
            renderRecords();
            updateSummary();
        }
        
        // 函数：编辑记录
        function editRecord(id) {
            const record = records.find(r => r.id === id);
            if (!record) return;
            
            editingId = id;
            document.getElementById('modal-title').textContent = '编辑记录';
            document.getElementById('record-id').value = id;
            document.getElementById('record-date').value = record.date;
            document.getElementById('record-person').value = record.person;
            document.getElementById('record-amount').value = record.amount;
            document.getElementById('record-event').value = record.event;
            document.getElementById('record-type').value = record.type;
            document.getElementById('record-status').value = record.status;
            document.getElementById('record-notes').value = record.notes || '';
            
            recordModal.style.display = 'flex';
        }
        
        // 函数：删除记录
        function deleteRecord() {
            if (!deletingId) return;
            
            records = records.filter(record => record.id !== deletingId);
            localStorage.setItem('renqingRecords', JSON.stringify(records));
            
            closeDeleteModal();
            renderRecords();
            updateSummary();
        }
        
        // 函数：更新统计信息
        function updateSummary() {
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();
            
            let monthIncome = 0;
            let monthExpense = 0;
            let pendingReceive = 0;
            let pendingPay = 0;
            
            records.forEach(record => {
                const recordDate = new Date(record.date);
                const isCurrentMonth = recordDate.getMonth() === currentMonth && 
                                      recordDate.getFullYear() === currentYear;
                
                if (record.type === 'received') {
                    if (isCurrentMonth) monthIncome += record.amount;
                    if (record.status === 'pending') pendingReceive += record.amount;
                } else {
                    if (isCurrentMonth) monthExpense += record.amount;
                    if (record.status === 'pending') pendingPay += record.amount;
                }
            });
            
            monthIncomeEl.textContent = `¥${monthIncome}`;
            monthExpenseEl.textContent = `¥${monthExpense}`;
            pendingReceiveEl.textContent = `¥${pendingReceive}`;
            pendingPayEl.textContent = `¥${pendingPay}`;
        }
        
        // 函数：预览导出数据
        function previewExportData(format) {
            let exportData;
            
            if (format === 'json') {
                exportData = JSON.stringify(records, null, 2);
            } else {
                // CSV格式
                const headers = ['日期', '人物', '金额', '场合', '类型', '状态', '备注'];
                const csvRows = [];
                
                // 添加表头
                csvRows.push(headers.join(','));
                
                // 添加数据行
                records.forEach(record => {
                    const row = [
                        record.date,
                        `"${record.person}"`,
                        record.amount,
                        record.event,
                        record.type === 'received' ? '收礼' : '送礼',
                        record.status === 'pending' ? '未还' : '已还',
                        `"${record.notes || ''}"`
                    ];
                    csvRows.push(row.join(','));
                });
                
                exportData = csvRows.join('\n');
            }
            
            exportPreview.value = exportData;
        }
        
        // 函数：复制导出数据
        function copyExportData() {
            exportPreview.select();
            document.execCommand('copy');
            alert('数据已复制到剪贴板');
        }
    </script>
</body>
</html>
