    <style>
        :root {
            /* 明亮主题 */
            --primary-color: #5B6AFF;
            --secondary-color: #8C54FF;
            --accent-color: #667EEA;
            --bg-primary: #FFFFFF;
            --bg-secondary: #F5F7FA;
            --bg-card: #FFFFFF;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-muted: #999999;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --border: 1px solid #eaeaea;
        }

        [data-theme="dark"] {
            /* 暗黑主题 */
            --primary-color: #7386FF;
            --secondary-color: #9D6CFF;
            --accent-color: #7B91FF;
            --bg-primary: #1A1A1A;
            --bg-secondary: #2D2D2D;
            --bg-card: #2D2D2D;
            --text-primary: #F5F5F5;
            --text-secondary: #CCCCCC;
            --text-muted: #999999;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
            --border: 1px solid #444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            display: grid;
            grid-template-areas:
                "header header"
                "sidebar main";
            grid-template-columns: 240px 1fr;
            grid-template-rows: 60px 1fr;
            min-height: 100vh;
        }

        /* 顶部导航栏 */
        header {
            grid-area: header;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background-color: var(--bg-secondary);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 1.2rem;
            color: var(--primary-color);
        }

        .logo i {
            font-size: 1.5rem;
        }

        .search-container {
            flex: 1;
            max-width: 600px;
            margin: 0 24px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border-radius: 12px;
            border: var(--border);
            background-color: var(--bg-card);
            color: var(--text-primary);
            font-size: 1rem;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(91, 106, 255, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
        }

        .theme-toggle:hover {
            background-color: rgba(91, 106, 255, 0.1);
            color: var(--primary-color);
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
        }

        /* 左侧导航栏 */
        .sidebar {
            grid-area: sidebar;
            background-color: var(--bg-secondary);
            padding: 24px 0;
            border-right: var(--border);
            overflow-y: auto;
        }

        .nav-category {
            padding: 0 16px;
            margin-bottom: 24px;
        }

        .nav-category h3 {
            font-size: 0.9rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            border-radius: 8px;
            margin-bottom: 4px;
            cursor: pointer;
            color: var(--text-secondary);
            text-decoration: none;
        }

        .nav-item:hover {
            background-color: rgba(91, 106, 255, 0.1);
            color: var(--primary-color);
        }

        .nav-item.active {
            background-color: rgba(91, 106, 255, 0.2);
            color: var(--primary-color);
            font-weight: 500;
        }

        .nav-item i {
            margin-right: 12px;
            width: 20px;
            text-align: center;
        }

        .nav-item .badge {
            margin-left: auto;
            background-color: var(--primary-color);
            color: white;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 10px;
        }

        /* 主内容区 */
        .main-content {
            grid-area: main;
            padding: 24px;
            background-color: var(--bg-primary);
            overflow-y: auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .sort-filter {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sort-select {
            padding: 8px 12px;
            border-radius: 8px;
            border: var(--border);
            background-color: var(--bg-card);
            color: var(--text-primary);
            cursor: pointer;
        }

        /* 工具卡片网格 */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .tool-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            border: var(--border);
        }

        .tool-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        .tool-card:active {
            transform: translateY(-2px) scale(0.98);
        }

        .tool-image {
            height: 160px;
            background-color: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            position: relative;
            overflow: hidden;
        }

        .tool-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .tool-details {
            padding: 16px;
        }

        .tool-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .tool-description {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .tool-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .tool-price {
            font-weight: 600;
            color: var(--primary-color);
            font-size: 1.1rem;
        }

        .tool-rating {
            display: flex;
            align-items: center;
            color: var(--accent-color);
            font-size: 0.9rem;
        }

        .tool-rating i {
            margin-right: 4px;
        }

        .tool-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 16px;
        }

        .tag {
            background-color: rgba(91, 106, 255, 0.1);
            color: var(--primary-color);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .tool-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
        }

        .btn-primary:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-secondary {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background-color: rgba(91, 106, 255, 0.1);
        }

        .btn-secondary:active {
            transform: scale(0.95);
        }

        .btn-favorite {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .btn-favorite:hover {
            color: var(--accent-color);
        }

        .btn-favorite.active {
            color: #ff4757;
        }

        /* 骨架加载效果 */
        .skeleton {
            background-color: var(--bg-secondary);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }

        .skeleton::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* 响应式设计 */
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 200px 1fr;
            }

            .tools-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            }
        }

        @media (max-width: 768px) {
            .container {
                grid-template-areas:
                    "header header"
                    "main main";
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: fixed;
                top: 60px;
                left: -100%;
                width: 240px;
                height: calc(100vh - 60px);
                transition: left 0.3s ease;
                z-index: 90;
            }

            .sidebar.active {
                left: 0;
            }

            .search-container {
                margin: 0 12px;
                max-width: 400px;
            }

            .menu-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
                background: none;
                border: none;
                color: var(--text-primary);
                font-size: 1.2rem;
                cursor: pointer;
                margin-right: 12px;
            }
        }

        @media (max-width: 576px) {
            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .sort-filter {
                width: 100%;
                justify-content: flex-end;
            }

            .tools-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

                description: "AI生成个性化礼物包装教程视频",
                price: 0,
                priceText: "免费",
                rating: 4.5,
                tags: ["教程", "视频", "包装"],
                category: ["recommend"],
                occasion: ["birthday", "valentine", "graduation", "wedding"],
                type: ["home"],
                priceRange: "under100",
                image: "https://images.unsplash.com/photo-1542744173-8e7e53415bb0?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=60",
                createdAt: "2023-05-01"
            },
            {
                id: 11,
                title: "礼物情感分析",
                description: "分析收礼人的社交媒体，了解他们的真实喜好",
                price: 99,
                priceText: "¥99",
                rating: 4.2,
                tags: ["AI分析", "社交媒体", "喜好"],
                category: ["new"],
                occasion: ["birthday", "valentine"],
                type: ["electronics"],
                priceRange: "100-300",
                image: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=60",
                createdAt: "2023-07-20"
            },
            {
                id: 12,
                title: "礼物配送追踪",
                description: "实时追踪礼物配送状态，确保准时送达",
                price: 0,
                priceText: "免费",
                rating: 4.8,
                tags: ["物流", "追踪", "实用工具"],
                category: ["recommend"],
                occasion: ["birthday", "valentine", "graduation", "wedding"],
                type: ["electronics"],
                priceRange: "under100",
                image: "https://images.unsplash.com/photo-1507676184212-d03ab07a01bf?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=60",
                createdAt: "2023-04-10"
            }
        ];

        // DOM元素
        const toolsGrid = document.getElementById('toolsGrid');
        const searchInput = document.getElementById('searchInput');
        const themeToggle = document.getElementById('themeToggle');
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        const sortSelect = document.getElementById('sortSelect');
        const navItems = document.querySelectorAll('.nav-item');

        // 状态管理
        let currentTheme = localStorage.getItem('theme') || 'light';
        let currentCategory = 'recommend';
        let favorites = JSON.parse(localStorage.getItem('favorites')) || [];

        // 初始化主题
        function initTheme() {
            document.documentElement.setAttribute('data-theme', currentTheme);
            themeToggle.innerHTML = currentTheme === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        }

        // 渲染工具卡片
        function renderTools(toolsToRender) {
            toolsGrid.innerHTML = '';
            
            if (toolsToRender.length === 0) {
                toolsGrid.innerHTML = '<div class="no-results" style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-secondary)">没有找到匹配的工具，请尝试其他关键词</div>';
                return;
            }
            
            toolsToRender.forEach(tool => {
                const isFavorite = favorites.includes(tool.id);
                const card = document.createElement('div');
                card.className = 'tool-card';
                card.innerHTML = `
                    <div class="tool-image">
                        <img src="${tool.image}" alt="${tool.title}" loading="lazy">
                    </div>
                    <div class="tool-details">
                        <h3 class="tool-title">${tool.title}</h3>
                        <p class="tool-description">${tool.description}</p>
                        <div class="tool-meta">
                            <span class="tool-price">${tool.priceText}</span>
                            <span class="tool-rating">
                                <i class="fas fa-star"></i>
                                ${tool.rating}
                            </span>
                        </div>
                        <div class="tool-tags">
                            ${tool.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                        <div class="tool-actions">
                            <button class="btn btn-primary" data-id="${tool.id}">
                                <i class="fas fa-play"></i>
                                使用工具
                            </button>
                            <button class="btn-favorite ${isFavorite ? 'active' : ''}" data-id="${tool.id}">
                                <i class="${isFavorite ? 'fas' : 'far'} fa-heart"></i>
                            </button>
                        </div>
                    </div>
                `;
                toolsGrid.appendChild(card);
            });

            // 添加事件监听器
            document.querySelectorAll('.btn-primary').forEach(btn => {
                btn.addEventListener('click', function() {
                    const toolId = parseInt(this.getAttribute('data-id'));
                    const tool = tools.find(t => t.id === toolId);
                    alert(`正在打开: ${tool.title}\n这是一个演示功能，实际应用中会跳转到工具页面`);
                });
            });

            document.querySelectorAll('.btn-favorite').forEach(btn => {
                btn.addEventListener('click', function() {
                    const toolId = parseInt(this.getAttribute('data-id'));
                    toggleFavorite(toolId);
                });
            });
        }

        // 切换收藏状态
        function toggleFavorite(toolId) {
            const index = favorites.indexOf(toolId);
            if (index === -1) {
                favorites.push(toolId);
            } else {
                favorites.splice(index, 1);
            }
            localStorage.setItem('favorites', JSON.stringify(favorites));
            renderTools(filterAndSortTools());
        }

        // 筛选和排序工具
        function filterAndSortTools() {
            let filteredTools = [...tools];
            
            // 分类筛选
            if (currentCategory === 'recommend') {
                filteredTools = filteredTools.filter(tool => tool.category.includes('recommend'));
            } else if (currentCategory === 'popular') {
                filteredTools = filteredTools.filter(tool => tool.category.includes('popular'));
            } else if (currentCategory === 'new') {
                filteredTools = filteredTools.filter(tool => tool.category.includes('new'));
            } else if (currentCategory === 'birthday') {
                filteredTools = filteredTools.filter(tool => tool.occasion.includes('birthday'));
            } else if (currentCategory === 'valentine') {
                filteredTools = filteredTools.filter(tool => tool.occasion.includes('valentine'));
            } else if (currentCategory === 'graduation') {
                filteredTools = filteredTools.filter(tool => tool.occasion.includes('graduation'));
            } else if (currentCategory === 'wedding') {
                filteredTools = filteredTools.filter(tool => tool.occasion.includes('wedding'));
            } else if (currentCategory === 'baby') {
                filteredTools = filteredTools.filter(tool => tool.occasion.includes('baby'));
            } else if (currentCategory === 'clothing') {
                filteredTools = filteredTools.filter(tool => tool.type.includes('clothing'));
            } else if (currentCategory === 'electronics') {
                filteredTools = filteredTools.filter(tool => tool.type.includes('electronics'));
            } else if (currentCategory === 'books') {
                filteredTools = filteredTools.filter(tool => tool.type.includes('books'));
            } else if (currentCategory === 'home') {
                filteredTools = filteredTools.filter(tool => tool.type.includes('home'));
            } else if (currentCategory === 'food') {
                filteredTools = filteredTools.filter(tool => tool.type.includes('food'));
            } else if (currentCategory === 'under100') {
                filteredTools = filteredTools.filter(tool => tool.priceRange === 'under100');
            } else if (currentCategory === '100-300') {
                filteredTools = filteredTools.filter(tool => tool.priceRange === '100-300');
            } else if (currentCategory === '300-500') {
                filteredTools = filteredTools.filter(tool => tool.priceRange === '300-500');
            } else if (currentCategory === 'over500') {
                filteredTools = filteredTools.filter(tool => tool.priceRange === 'over500');
            }
            
            // 搜索筛选
            const searchTerm = searchInput.value.toLowerCase();
            if (searchTerm) {
                filteredTools = filteredTools.filter(tool => 
                    tool.title.toLowerCase().includes(searchTerm) || 
                    tool.description.toLowerCase().includes(searchTerm) ||
                    tool.tags.some(tag => tag.toLowerCase().includes(searchTerm))
                );
            }
            
            // 排序
            const sortValue = sortSelect.value;
            switch (sortValue) {
                case 'price-low':
                    filteredTools.sort((a, b) => a.price - b.price);
                    break;
                case 'price-high':
                    filteredTools.sort((a, b) => b.price - a.price);
                    break;
                case 'rating':
                    filteredTools.sort((a, b) => b.rating - a.rating);
                    break;
                case 'newest':
                    filteredTools.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                    break;
                default:
                    // 默认排序
                    break;
            }
            
            return filteredTools;
        }

        // 主题切换
        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', currentTheme);
            localStorage.setItem('theme', currentTheme);
            themeToggle.innerHTML = currentTheme === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        }

        // 移动端菜单切换
        function toggleMenu() {
            sidebar.classList.toggle('active');
        }

        // 分类导航点击
        function handleNavClick(e) {
            e.preventDefault();
            const category = this.getAttribute('data-category');
            
            // 更新活动状态
            navItems.forEach(item => item.classList.remove('active'));
            this.classList.add('active');
            
            // 更新当前分类并重新渲染
            currentCategory = category;
            renderTools(filterAndSortTools());
        }

        // 事件监听
        searchInput.addEventListener('input', () => renderTools(filterAndSortTools()));
        themeToggle.addEventListener('click', toggleTheme);
        menuToggle.addEventListener('click', toggleMenu);
        sortSelect.addEventListener('change', () => renderTools(filterAndSortTools()));
        navItems.forEach(item => item.addEventListener('click', handleNavClick));

        // 初始化
        initTheme();
        renderTools(filterAndSortTools());
    </script>
</body>
</html>
