        // 获取DOM元素
        const movieDisplay = document.getElementById('movieDisplay');
        const recommendBtn = document.getElementById('recommendBtn');
        const changeBtn = document.getElementById('changeBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const modal = document.getElementById('downloadModal');
        const closeBtn = document.querySelector('.close');
        
        // 记录已显示的电影索引
        let shownMovies = [];
        
        // 随机推荐一部电影
        function recommendMovie() {
            // 如果所有电影都已显示过，重置记录
            if (shownMovies.length >= movies.length) {
                shownMovies = [];
            }
            
            // 获取未显示过的电影索引
            let availableMovies = [];
            for (let i = 0; i < movies.length; i++) {
                if (!shownMovies.includes(i)) {
                    availableMovies.push(i);
                }
            }
            
            // 随机选择一部
            const randomIndex = Math.floor(Math.random() * availableMovies.length);
            const movieIndex = availableMovies[randomIndex];
            shownMovies.push(movieIndex);
            
            // 显示电影信息
            displayMovie(movies[movieIndex]);
            
            // 切换按钮显示
            recommendBtn.style.display = 'none';
            changeBtn.style.display = 'block';
        }
        
        // 显示电影信息
        function displayMovie(movie) {
            // 生成星级评分
            const stars = '★'.repeat(Math.round(movie.rating / 2)) + 
                          '☆'.repeat(5 - Math.round(movie.rating / 2));
            
            movieDisplay.innerHTML = `
                <h2 class="movie-title">${movie.title}</h2>
                <div class="movie-info"><span>国家/地区：</span>${movie.country}</div>
                <div class="movie-info"><span>主演：</span>${movie.actors}</div>
                <div class="movie-desc">${movie.description}</div>
                <div class="rating">推荐指数：${stars} (${movie.rating.toFixed(1)}/5.0)</div>
                <div class="recommend-reason">推荐理由：${movie.reason}</div>
            `;
        }
        
        // 事件监听
        recommendBtn.addEventListener('click', recommendMovie);
        changeBtn.addEventListener('click', recommendMovie);
        
        // 下载按钮事件
        downloadBtn.addEventListener('click', function() {
            modal.style.display = 'block';
        });
        
        // 关闭弹窗事件
        closeBtn.addEventListener('click', function() {
            modal.style.display = 'none';
        });
        
        // 点击模态框外部关闭
        window.addEventListener('click', function(event) {
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        });
    </script>
