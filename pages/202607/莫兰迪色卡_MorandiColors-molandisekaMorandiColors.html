<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>莫兰迪色卡 | Morandi Colors</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f3f3f3;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #6d6d6d;
            margin-bottom: 30px;
            font-weight: 300;
        }
        .color-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .color-card {
            height: 180px;
            border-radius: 8px;
            position: relative;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            cursor: pointer;
        }
        .color-card:hover {
            transform: translateY(-5px);
        }
        .color-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            text-align: center;
        }
        .color-name {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .color-hex {
            font-family: monospace;
            font-size: 14px;
        }
        .controls {
            text-align: center;
            margin: 30px 0;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        button {
            background-color: #a8b6b9;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 120px;
        }
        button:hover {
            background-color: #8a9a9e;
        }
        .toggle-btn {
            position: relative;
            padding-left: 40px;
        }
        .toggle-btn::before {
            content: "✓";
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .toggle-btn.active::before {
            opacity: 1;
        }
        .export-btn {
            background-color: #b5c4b1;
        }
        .export-btn:hover {
            background-color: #97a693;
        }
        .language-switcher {
            position: absolute;
            top: 20px;
            right: 20px;
        }
        .language-btn {
            background: none;
            border: 1px solid #a8b6b9;
            color: #6d6d6d;
            padding: 5px 10px;
            min-width: auto;
        }
        .language-btn.active {
            background-color: #a8b6b9;
            color: white;
        }
        .copied-notice {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #8a9a9e;
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="language-switcher">
        <button id="langZh" class="language-btn active">中文</button>
        <button id="langEn" class="language-btn">English</button>
    </div>
    
    <h1 id="title">莫兰迪色卡 | Morandi Colors</h1>
    
    <div class="controls">
        <button id="exportAll" class="export-btn">导出全部色值</button>
        <button id="toggleNames" class="toggle-btn">隐藏颜色名称</button>
    </div>
    
    <div class="color-grid" id="colorGrid">
        <!-- 颜色卡片将通过JavaScript动态生成 -->
    </div>
    
    <div class="copied-notice" id="copiedNotice">已复制到剪贴板</div>
    
    <script>
        // 多语言文本
        const translations = {
            zh: {
                title: "莫兰迪色卡 | Morandi Colors",
                exportAll: "导出全部色值",
                showNames: "显示颜色名称",
                hideNames: "隐藏颜色名称",
                copied: "已复制到剪贴板",
                colors: [
                    { name: "灰粉", hex: "#d8b4a0" },
                    { name: "雾蓝", hex: "#a7b8c2" },
                    { name: "灰绿", hex: "#b5c4b1" },
                    { name: "米白", hex: "#e8d8c5" },
                    { name: "灰紫", hex: "#c4b2bc" },
                    { name: "灰褐", hex: "#b7a791" },
                    { name: "灰黄", hex: "#d9c7b8" },
                    { name: "灰红", hex: "#c6a4a4" },
                    { name: "灰蓝", hex: "#9ab0b9" },
                    { name: "灰绿2", hex: "#a8b6a8" },
                    { name: "灰橙", hex: "#d1b6a3" },
                    { name: "灰紫2", hex: "#b8a9c7" },
                    { name: "灰粉2", hex: "#e2c1c0" },
                    { name: "灰蓝2", hex: "#8aa2ae" },
                    { name: "灰褐2", hex: "#a99b8f" },
                    { name: "灰绿3", hex: "#97a693" },
                    { name: "灰红2", hex: "#ba9a9a" },
                    { name: "灰黄2", hex: "#d4c4a5" },
                    { name: "灰紫3", hex: "#b3a2c2" },
                    { name: "灰蓝3", hex: "#7d9aa8" }
                ]
            },
            en: {
                title: "Morandi Color Palette",
                exportAll: "Export All Colors",
                showNames: "Show Names",
                hideNames: "Hide Names",
                copied: "Copied to clipboard",
                colors: [
                    { name: "Dusty Pink", hex: "#d8b4a0" },
                    { name: "Misty Blue", hex: "#a7b8c2" },
                    { name: "Grayish Green", hex: "#b5c4b1" },
                    { name: "Cream White", hex: "#e8d8c5" },
                    { name: "Muted Purple", hex: "#c4b2bc" },
                    { name: "Taupe", hex: "#b7a791" },
                    { name: "Pale Yellow", hex: "#d9c7b8" },
                    { name: "Dusty Red", hex: "#c6a4a4" },
                    { name: "Slate Blue", hex: "#9ab0b9" },
                    { name: "Sage Green", hex: "#a8b6a8" },
                    { name: "Muted Orange", hex: "#d1b6a3" },
                    { name: "Lavender Gray", hex: "#b8a9c7" },
                    { name: "Blush Pink", hex: "#e2c1c0" },
                    { name: "Stone Blue", hex: "#8aa2ae" },
                    { name: "Warm Gray", hex: "#a99b8f" },
                    { name: "Olive Gray", hex: "#97a693" },
                    { name: "Rose Dust", hex: "#ba9a9a" },
                    { name: "Sand Beige", hex: "#d4c4a5" },
                    { name: "Mauve Gray", hex: "#b3a2c2" },
                    { name: "Dusty Blue", hex: "#7d9aa8" }
                ]
            }
        };

        // 当前语言状态
        let currentLang = 'zh';
        let showNames = true;
        const colorGrid = document.getElementById('colorGrid');
        const copiedNotice = document.getElementById('copiedNotice');
        
        // 初始化页面
        function initPage() {
            renderColorCards();
            setupEventListeners();
            updateToggleButton();
        }
        
        // 渲染颜色卡片
        function renderColorCards() {
            colorGrid.innerHTML = '';
            const colors = translations[currentLang].colors;
            
            colors.forEach(color => {
                const card = document.createElement('div');
                card.className = 'color-card';
                card.style.backgroundColor = color.hex;
                
                const info = document.createElement('div');
                info.className = 'color-info';
                
                const name = document.createElement('div');
                name.className = 'color-name';
                name.textContent = showNames ? color.name : '';
                
                const hex = document.createElement('div');
                hex.className = 'color-hex';
                hex.textContent = color.hex;
                
                info.appendChild(name);
                info.appendChild(hex);
                card.appendChild(info);
                
                card.addEventListener('click', () => {
                    copyToClipboard(color.hex);
                });
                
                colorGrid.appendChild(card);
            });
            
            // 更新界面文本
            document.getElementById('title').textContent = translations[currentLang].title;
            document.getElementById('exportAll').textContent = translations[currentLang].exportAll;
            updateToggleButton();
        }
        
        // 更新切换按钮状态
        function updateToggleButton() {
            const btn = document.getElementById('toggleNames');
            if (showNames) {
                btn.textContent = translations[currentLang].hideNames;
                btn.classList.remove('active');
            } else {
                btn.textContent = translations[currentLang].showNames;
                btn.classList.add('active');
            }
        }
        
        // 设置事件监听
        function setupEventListeners() {
            // 语言切换
            document.getElementById('langZh').addEventListener('click', () => {
                if (currentLang !== 'zh') {
                    currentLang = 'zh';
                    document.getElementById('langZh').classList.add('active');
                    document.getElementById('langEn').classList.remove('active');
                    renderColorCards();
                }
            });
            
            document.getElementById('langEn').addEventListener('click', () => {
                if (currentLang !== 'en') {
                    currentLang = 'en';
                    document.getElementById('langEn').classList.add('active');
                    document.getElementById('langZh').classList.remove('active');
                    renderColorCards();
                }
            });
            
            // 导出所有色值
            document.getElementById('exportAll').addEventListener('click', exportAllColors);
            
            // 切换显示名称
            document.getElementById('toggleNames').addEventListener('click', () => {
                showNames = !showNames;
                renderColorCards();
            });
        }
        
        // 导出所有颜色
        function exportAllColors() {
            const colors = translations[currentLang].colors;
            let exportText = `Morandi Color Palette\n${new Date().toLocaleString()}\n\n`;
            
            colors.forEach(color => {
                exportText += `${color.hex}  ${showNames ? color.name : ''}\n`;
            });
            
            // 创建Blob对象
            const blob = new Blob([exportText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            
            // 创建下载链接
            const a = document.createElement('a');
            a.href = url;
            a.download = `morandi-colors_${new Date().getTime()}.txt`;
            document.body.appendChild(a);
            a.click();
            
            // 清理
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 100);
        }
        
        // 复制到剪贴板
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                copiedNotice.textContent = translations[currentLang].copied;
                copiedNotice.style.opacity = 1;
                setTimeout(() => {
                    copiedNotice.style.opacity = 0;
                }, 2000);
            });
        }
        
        // 初始化页面
        initPage();
    </script>
</body>
</html>
