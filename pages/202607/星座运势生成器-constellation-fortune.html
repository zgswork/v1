<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星座运势生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            flex: 1;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .constellation-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .constellation-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
        }

        .constellation-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .constellation-card.selected {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        .constellation-symbol {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .constellation-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .constellation-date {
            font-size: 0.9em;
            color: #666;
        }

        .generate-btn {
            display: block;
            width: 200px;
            margin: 30px auto;
            padding: 15px 30px;
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .generate-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .fortune-result {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            margin-top: 30px;
            display: none;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fortune-header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }

        .fortune-constellation {
            font-size: 1.5em;
            color: #667eea;
            margin-bottom: 10px;
        }

        .fortune-date {
            color: #666;
            font-size: 0.9em;
        }

        .fortune-content {
            display: grid;
            gap: 20px;
        }

        .fortune-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .fortune-item h3 {
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .fortune-item p {
            color: #555;
            line-height: 1.6;
        }

        .lucky-elements {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .lucky-item {
            background: rgba(102, 126, 234, 0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .lucky-item strong {
            color: #667eea;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
        }

        .action-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .copy-btn {
            background: #28a745;
            color: white;
        }

        .regenerate-btn {
            background: #17a2b8;
            color: white;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .footer {
            background: rgba(0, 0, 0, 0.2);
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

        .footer p {
            margin: 5px 0;
        }

        .loading {
            display: none;
            text-align: center;
            color: white;
            margin: 20px 0;
        }

        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .constellation-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }
            
            .constellation-card {
                padding: 15px;
            }
            
            .fortune-result {
                padding: 20px;
            }
            
            .action-buttons {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✨ 星座运势生成器 ✨</h1>
            <p>选择你的星座，获取今日专属运势</p>
        </div>

        <div class="constellation-grid" id="constellationGrid">
            <!-- 星座卡片将通过JavaScript生成 -->
        </div>

        <button class="generate-btn" id="generateBtn" disabled>
            🔮 生成我的运势
        </button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在为你生成专属运势...</p>
        </div>

        <div class="fortune-result" id="fortuneResult">
            <!-- 运势结果将通过JavaScript生成 -->
        </div>
    </div>

    <div class="footer">
        <p>✨ 愿星辰指引你的人生道路 ✨</p>
        <p>有任何问题联系作者微信：<strong>xd135341</strong></p>
    </div>

    <script>
        // 星座数据
        const constellations = [
            { name: '白羊座', symbol: '♈', date: '3.21-4.19', element: '火', lucky: { color: '红色', number: 9, direction: '东方' } },
            { name: '金牛座', symbol: '♉', date: '4.20-5.20', element: '土', lucky: { color: '绿色', number: 6, direction: '东南' } },
            { name: '双子座', symbol: '♊', date: '5.21-6.21', element: '风', lucky: { color: '黄色', number: 5, direction: '西方' } },
            { name: '巨蟹座', symbol: '♋', date: '6.22-7.22', element: '水', lucky: { color: '银色', number: 2, direction: '北方' } },
            { name: '狮子座', symbol: '♌', date: '7.23-8.22', element: '火', lucky: { color: '金色', number: 1, direction: '南方' } },
            { name: '处女座', symbol: '♍', date: '8.23-9.22', element: '土', lucky: { color: '深蓝', number: 7, direction: '西南' } },
            { name: '天秤座', symbol: '♎', date: '9.23-10.23', element: '风', lucky: { color: '粉色', number: 8, direction: '西方' } },
            { name: '天蝎座', symbol: '♏', date: '10.24-11.22', element: '水', lucky: { color: '深红', number: 4, direction: '北方' } },
            { name: '射手座', symbol: '♐', date: '11.23-12.21', element: '火', lucky: { color: '紫色', number: 3, direction: '南方' } },
            { name: '摩羯座', symbol: '♑', date: '12.22-1.19', element: '土', lucky: { color: '黑色', number: 10, direction: '北方' } },
            { name: '水瓶座', symbol: '♒', date: '1.20-2.18', element: '风', lucky: { color: '蓝色', number: 11, direction: '东方' } },
            { name: '双鱼座', symbol: '♓', date: '2.19-3.20', element: '水', lucky: { color: '海蓝', number: 12, direction: '西方' } }
        ];

        // 运势模板
        const fortuneTemplates = {
            overall: [
                "今天的你充满活力，适合尝试新的挑战和机遇。保持积极的心态，好运将会眷顾你。",
                "今日运势平稳，适合处理日常事务。虽然没有大的突破，但稳扎稳打会为未来打下良好基础。",
                "今天可能会遇到一些小挫折，但这正是成长的机会。保持耐心，困难很快就会过去。",
                "今日是你的幸运日！无论做什么都会比较顺利，可以大胆地追求自己的目标。",
                "今天适合反思和规划，不要急于做重大决定。静下心来思考，会有意想不到的收获。"
            ],
            love: [
                "单身的你今天有机会遇到心仪的人，保持开放的心态。有伴侣的你们感情会更加甜蜜。",
                "今天在感情方面需要多一些耐心和理解，避免因小事发生争执。",
                "爱情运势不错，适合表达内心的想法。勇敢地说出你的爱意吧！",
                "今天可能会收到来自远方的消息，或者与老朋友重新联系。",
                "感情方面需要给彼此一些空间，过度的关注可能会带来压力。"
            ],
            career: [
                "工作上会有新的机会出现，要抓住时机展现自己的能力。",
                "今天适合团队合作，与同事的配合会让工作事半功倍。",
                "可能会遇到一些工作上的挑战，但这正是证明自己的好机会。",
                "今天不适合做重大的职业决定，先观察一段时间再行动。",
                "工作效率很高的一天，可以完成很多积压的任务。"
            ],
            wealth: [
                "财运不错，可能会有意外的收入或者投资回报。",
                "今天在金钱方面要谨慎，避免冲动消费。",
                "适合进行理财规划，为未来做好准备。",
                "可能会有朋友向你借钱，要根据自己的情况量力而行。",
                "今天的财运平平，保持现状即可，不要有太大的金钱动作。"
            ],
            health: [
                "身体状况良好，精力充沛。适合进行一些运动锻炼。",
                "注意休息，不要过度劳累。保持规律的作息时间。",
                "今天可能会感到有些疲惫，多喝水，注意营养补充。",
                "心情愉悦对健康很有帮助，保持积极乐观的态度。",
                "注意饮食健康，避免过于油腻或刺激的食物。"
            ]
        };

        let selectedConstellation = null;

        // 初始化页面
        function init() {
            renderConstellations();
        }

        // 渲染星座网格
        function renderConstellations() {
            const grid = document.getElementById('constellationGrid');
            grid.innerHTML = '';

            constellations.forEach((constellation, index) => {
                const card = document.createElement('div');
                card.className = 'constellation-card';
                card.innerHTML = `
                    <div class="constellation-symbol">${constellation.symbol}</div>
                    <div class="constellation-name">${constellation.name}</div>
                    <div class="constellation-date">${constellation.date}</div>
                `;
                
                card.addEventListener('click', () => selectConstellation(index));
                grid.appendChild(card);
            });
        }

        // 选择星座
        function selectConstellation(index) {
            // 移除之前的选中状态
            document.querySelectorAll('.constellation-card').forEach(card => {
                card.classList.remove('selected');
            });

            // 添加新的选中状态
            document.querySelectorAll('.constellation-card')[index].classList.add('selected');
            
            selectedConstellation = constellations[index];
            document.getElementById('generateBtn').disabled = false;
        }

        // 生成运势
        function generateFortune() {
            if (!selectedConstellation) return;

            // 显示加载动画
            document.getElementById('loading').style.display = 'block';
            document.getElementById('fortuneResult').style.display = 'none';

            // 模拟加载时间
            setTimeout(() => {
                const fortune = createFortune(selectedConstellation);
                displayFortune(fortune);
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('fortuneResult').style.display = 'block';
            }, 2000);
        }

        // 创建运势内容
        function createFortune(constellation) {
            const today = new Date();
            const dateStr = `${today.getFullYear()}年${today.getMonth() + 1}月${today.getDate()}日`;

            return {
                constellation: constellation.name,
                date: dateStr,
                overall: getRandomTemplate('overall'),
                love: getRandomTemplate('love'),
                career: getRandomTemplate('career'),
                wealth: getRandomTemplate('wealth'),
                health: getRandomTemplate('health'),
                lucky: constellation.lucky
            };
        }

        // 获取随机模板
        function getRandomTemplate(type) {
            const templates = fortuneTemplates[type];
            return templates[Math.floor(Math.random() * templates.length)];
        }

        // 显示运势结果
        function displayFortune(fortune) {
            const result = document.getElementById('fortuneResult');
            result.innerHTML = `
                <div class="fortune-header">
                    <div class="fortune-constellation">${fortune.constellation} 今日运势</div>
                    <div class="fortune-date">${fortune.date}</div>
                </div>
                
                <div class="fortune-content">
                    <div class="fortune-item">
                        <h3>🌟 综合运势</h3>
                        <p>${fortune.overall}</p>
                    </div>
                    
                    <div class="fortune-item">
                        <h3>💕 爱情运势</h3>
                        <p>${fortune.love}</p>
                    </div>
                    
                    <div class="fortune-item">
                        <h3>💼 事业运势</h3>
                        <p>${fortune.career}</p>
                    </div>
                    
                    <div class="fortune-item">
                        <h3>💰 财运运势</h3>
                        <p>${fortune.wealth}</p>
                    </div>
                    
                    <div class="fortune-item">
                        <h3>🏥 健康运势</h3>
                        <p>${fortune.health}</p>
                    </div>
                </div>
                
                <div class="lucky-elements">
                    <div class="lucky-item">
                        <strong>幸运颜色</strong><br>${fortune.lucky.color}
                    </div>
                    <div class="lucky-item">
                        <strong>幸运数字</strong><br>${fortune.lucky.number}
                    </div>
                    <div class="lucky-item">
                        <strong>幸运方位</strong><br>${fortune.lucky.direction}
                    </div>
                </div>
                
                <div class="action-buttons">
                    <button class="action-btn copy-btn" onclick="copyFortune()">📋 复制运势</button>
                    <button class="action-btn regenerate-btn" onclick="generateFortune()">🔄 重新生成</button>
                </div>
            `;
        }

        // 复制运势到剪贴板
        function copyFortune() {
            const fortuneText = document.querySelector('.fortune-result').innerText;
            navigator.clipboard.writeText(fortuneText).then(() => {
                alert('运势已复制到剪贴板！');
            }).catch(() => {
                alert('复制失败，请手动复制');
            });
        }

        // 事件监听
        document.getElementById('generateBtn').addEventListener('click', generateFortune);

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
