<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绿色记忆翻牌游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #1b5e20;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(76, 175, 80, 0.2);
            padding: 30px;
            text-align: center;
            border: 2px solid #4caf50;
        }
        
        .header {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px dashed #a5d6a7;
        }
        
        h1 {
            color: #2e7d32;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.1);
        }
        
        .subtitle {
            color: #388e3c;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }
        
        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 25px 0;
            background-color: #f1f8e9;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #c5e1a5;
        }
        
        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .stat-value {
            font-size: 2.2rem;
            font-weight: bold;
            color: #1b5e20;
            min-width: 80px;
            background-color: white;
            padding: 5px 15px;
            border-radius: 8px;
            border: 2px solid #81c784;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 1rem;
            color: #4caf50;
            font-weight: 500;
        }
        
        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin: 30px auto;
            max-width: 600px;
            perspective: 1000px;
        }
        
        .card {
            height: 100px;
            border-radius: 12px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .card.flipped {
            transform: rotateY(180deg);
        }
        
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
        }
        
        .card-front {
            background: linear-gradient(145deg, #66bb6a, #43a047);
            color: white;
            transform: rotateY(180deg);
        }
        
        .card-back {
            background: linear-gradient(145deg, #a5d6a7, #81c784);
            color: #1b5e20;
            border: 3px solid #66bb6a;
        }
        
        .card.matched .card-front {
            background: linear-gradient(145deg, #388e3c, #2e7d32);
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.3);
        }
        
        .controls {
            margin: 25px 0;
        }
        
        .btn {
            background: linear-gradient(to bottom, #4caf50, #388e3c);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            margin: 0 10px;
            transition: all 0.3s;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
        }
        
        .btn:hover {
            background: linear-gradient(to bottom, #43a047, #2e7d32);
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(76, 175, 80, 0.4);
        }
        
        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 5px rgba(76, 175, 80, 0.3);
        }
        
        .win-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        
        .win-content {
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 3px solid #4caf50;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .win-content h2 {
            color: #2e7d32;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        
        .win-stats {
            font-size: 1.4rem;
            margin: 25px 0;
            color: #1b5e20;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #a5d6a7;
        }
        
        .footer {
            margin-top: 30px;
            color: #388e3c;
            font-size: 0.9rem;
            padding-top: 15px;
            border-top: 1px dashed #a5d6a7;
        }
        
        @media (max-width: 600px) {
            .game-board {
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
            }
            
            .card {
                height: 80px;
            }
            
            .card-front, .card-back {
                font-size: 2rem;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .stats {
                gap: 20px;
            }
            
            .stat-value {
                font-size: 1.8rem;
                min-width: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌿 绿色记忆翻牌游戏</h1>
            <p class="subtitle">翻开两张相同的卡片即可匹配，用最少的步数和时间完成游戏！</p>
        </div>
        
        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">步数</div>
                <div id="steps" class="stat-value">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">时间</div>
                <div id="timer" class="stat-value">0 秒</div>
            </div>
        </div>
        
        <div class="game-board" id="gameBoard">
            <!-- 卡片将通过JavaScript动态生成 -->
        </div>
        
        <div class="controls">
            <button id="restartBtn" class="btn">重新开始</button>
            <button id="hintBtn" class="btn">提示 (3次)</button>
        </div>
        
        <div class="footer">
            <p>绿色记忆翻牌游戏 | 单文件HTML版本 | 基于原版复刻</p>
        </div>
    </div>
    
    <div id="winModal" class="win-modal">
        <div class="win-content">
            <h2>🎉 恭喜你赢了!</h2>
            <div class="win-stats">
                <p>你用了 <span id="finalSteps">0</span> 步和 <span id="finalTime">0</span> 秒完成游戏!</p>
            </div>
            <button id="playAgainBtn" class="btn">再玩一次</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 游戏配置
            const emojis = ['🎁', '⚽', '🌟', '🚗', '🍎', '❤️', '🎈', '📚'];
            const cardCount = 16; // 4x4网格，8对卡片
            let cards = [];
            let flippedCards = [];
            let matchedPairs = 0;
            let steps = 0;
            let seconds = 0;
            let timer = null;
            let gameStarted = false;
            let hintCount = 3;
            
            // DOM元素
            const gameBoard = document.getElementById('gameBoard');
            const stepsElement = document.getElementById('steps');
            const timerElement = document.getElementById('timer');
            const restartBtn = document.getElementById('restartBtn');
            const hintBtn = document.getElementById('hintBtn');
            const winModal = document.getElementById('winModal');
            const finalSteps = document.getElementById('finalSteps');
            const finalTime = document.getElementById('finalTime');
            const playAgainBtn = document.getElementById('playAgainBtn');
            
            // 初始化游戏
            function initGame() {
                // 重置游戏状态
                cards = [];
                flippedCards = [];
                matchedPairs = 0;
                steps = 0;
                seconds = 0;
                gameStarted = false;
                hintCount = 3;
                
                // 更新显示
                stepsElement.textContent = steps;
                timerElement.textContent = `${seconds} 秒`;
                hintBtn.textContent = `提示 (${hintCount}次)`;
                hintBtn.disabled = false;
                
                // 清除定时器
                if (timer) {
                    clearInterval(timer);
                    timer = null;
                }
                
                // 关闭胜利模态框
                winModal.style.display = 'none';
                
                // 创建卡片
                createCards();
                
                // 渲染卡片
                renderCards();
            }
            
            // 创建卡片数组
            function createCards() {
                // 复制emoji以创建对
                let cardEmojis = [...emojis, ...emojis];
                
                // 随机排序
                for (let i = cardEmojis.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [cardEmojis[i], cardEmojis[j]] = [cardEmojis[j], cardEmojis[i]];
                }
                
                // 创建卡片对象
                cards = cardEmojis.map((emoji, index) => ({
                    id: index,
                    emoji: emoji,
                    flipped: false,
                    matched: false
                }));
            }
            
            // 渲染卡片到游戏板
            function renderCards() {
                gameBoard.innerHTML = '';
                
                cards.forEach(card => {
                    const cardElement = document.createElement('div');
                    cardElement.className = 'card';
                    if (card.flipped) cardElement.classList.add('flipped');
                    if (card.matched) cardElement.classList.add('matched');
                    
                    cardElement.dataset.id = card.id;
                    
                    // 卡片背面
                    const cardBack = document.createElement('div');
                    cardBack.className = 'card-back';
                    cardBack.textContent = '?';
                    
                    // 卡片正面
                    const cardFront = document.createElement('div');
                    cardFront.className = 'card-front';
                    cardFront.textContent = card.emoji;
                    
                    cardElement.appendChild(cardFront);
                    cardElement.appendChild(cardBack);
                    
                    // 添加点击事件
                    cardElement.addEventListener('click', () => flipCard(card.id));
                    
                    gameBoard.appendChild(cardElement);
                });
            }
            
            // 翻转卡片
            function flipCard(cardId) {
                // 如果游戏尚未开始，开始计时
                if (!gameStarted) {
                    startTimer();
                    gameStarted = true;
                }
                
                const card = cards.find(c => c.id === cardId);
                const cardElement = document.querySelector(`.card[data-id="${cardId}"]`);
                
                // 如果卡片已经匹配或已经翻转，则忽略点击
                if (card.matched || card.flipped || flippedCards.length >= 2) {
                    return;
                }
                
                // 翻转卡片
                card.flipped = true;
                cardElement.classList.add('flipped');
                flippedCards.push(card);
                
                // 如果翻开了两张卡片
                if (flippedCards.length === 2) {
                    steps++;
                    stepsElement.textContent = steps;
                    
                    // 检查是否匹配
                    const [card1, card2] = flippedCards;
                    
                    if (card1.emoji === card2.emoji) {
                        // 匹配成功
                        card1.matched = true;
                        card2.matched = true;
                        
                        // 更新卡片元素
                        document.querySelector(`.card[data-id="${card1.id}"]`).classList.add('matched');
                        document.querySelector(`.card[data-id="${card2.id}"]`).classList.add('matched');
                        
                        matchedPairs++;
                        
                        // 清空翻转卡片数组
                        flippedCards = [];
                        
                        // 检查游戏是否结束
                        if (matchedPairs === emojis.length) {
                            endGame();
                        }
                    } else {
                        // 不匹配，稍后翻转回来
                        setTimeout(() => {
                            card1.flipped = false;
                            card2.flipped = false;
                            
                            document.querySelector(`.card[data-id="${card1.id}"]`).classList.remove('flipped');
                            document.querySelector(`.card[data-id="${card2.id}"]`).classList.remove('flipped');
                            
                            flippedCards = [];
                        }, 1000);
                    }
                }
            }
            
            // 开始计时器
            function startTimer() {
                seconds = 0;
                timer = setInterval(() => {
                    seconds++;
                    timerElement.textContent = `${seconds} 秒`;
                }, 1000);
            }
            
            // 结束游戏
            function endGame() {
                // 停止计时器
                clearInterval(timer);
                
                // 显示胜利模态框
                finalSteps.textContent = steps;
                finalTime.textContent = seconds;
                winModal.style.display = 'flex';
            }
            
            // 提示功能
            function showHint() {
                if (hintCount <= 0) return;
                
                // 找到未匹配的卡片
                const unmatchedCards = cards.filter(card => !card.matched && !card.flipped);
                
                if (unmatchedCards.length < 2) return;
                
                // 随机选择一对未匹配的相同卡片
                const emojiMap = {};
                let hintCard1 = null, hintCard2 = null;
                
                for (const card of unmatchedCards) {
                    if (emojiMap[card.emoji]) {
                        hintCard1 = emojiMap[card.emoji];
                        hintCard2 = card;
                        break;
                    } else {
                        emojiMap[card.emoji] = card;
                    }
                }
                
                if (!hintCard1 || !hintCard2) return;
                
                // 短暂显示提示
                const card1Element = document.querySelector(`.card[data-id="${hintCard1.id}"]`);
                const card2Element = document.querySelector(`.card[data-id="${hintCard2.id}"]`);
                
                card1Element.classList.add('flipped');
                card2Element.classList.add('flipped');
                
                setTimeout(() => {
                    card1Element.classList.remove('flipped');
                    card2Element.classList.remove('flipped');
                }, 800);
                
                // 更新提示次数
                hintCount--;
                hintBtn.textContent = `提示 (${hintCount}次)`;
                
                if (hintCount <= 0) {
                    hintBtn.disabled = true;
                }
            }
            
            // 事件监听器
            restartBtn.addEventListener('click', initGame);
            playAgainBtn.addEventListener('click', initGame);
            hintBtn.addEventListener('click', showHint);
            
            // 点击模态框外部关闭
            winModal.addEventListener('click', (e) => {
                if (e.target === winModal) {
                    winModal.style.display = 'none';
                }
            });
            
            // 初始化游戏
            initGame();
        });
    </script>
</body>
</html>
