<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>词云图生成器</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts-wordcloud@2.1.0/dist/echarts-wordcloud.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .upload-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }
        .upload-btn {
            display: inline-block;
            padding: 10px 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.3s;
        }
        .upload-btn:hover {
            background-color: #2980b9;
        }
        #fileInput {
            display: none;
        }
        .options-section {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }
        .option-group {
            flex: 1;
            min-width: 200px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .generate-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 20px;
            transition: background-color 0.3s;
        }
        .generate-btn:hover {
            background-color: #27ae60;
        }
        .chart-container {
            width: 100%;
            height: 500px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .export-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 20px;
            transition: background-color 0.3s;
        }
        .export-btn:hover {
            background-color: #c0392b;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            font-size: 14px;
            color: #7f8c8d;
        }
        .file-info {
            margin-top: 10px;
            font-size: 14px;
            color: #7f8c8d;
        }
        @media (max-width: 768px) {
            .options-section {
                flex-direction: column;
            }
            .chart-container {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>词云图生成器</h1>
        
        <div class="upload-section">
            <label for="fileInput" class="upload-btn">上传关键词文件</label>
            <input type="file" id="fileInput" accept=".txt,.csv,.xlsx,.xls">
            <div class="file-info" id="fileInfo">未选择文件</div>
        </div>
        
        <div class="options-section">
            <div class="option-group">
                <label for="shapeSelect">选择形状</label>
                <select id="shapeSelect">
                    <option value="circle">圆形</option>
                    <option value="cardioid">心形</option>
                    <option value="diamond">菱形</option>
                    <option value="triangle-forward">正三角形</option>
                    <option value="triangle">倒三角形</option>
                    <option value="pentagon">五边形</option>
                    <option value="star">星形</option>
                    <option value="square">正方形</option>
                    <option value="ellipse">椭圆形</option>
                    <option value="triangle-upright">直角三角形</option>
                </select>
            </div>
            
            <div class="option-group">
                <label for="colorSelect">选择颜色</label>
                <select id="colorSelect">
                    <option value="random">随机多彩</option>
                    <option value="red">红色系</option>
                    <option value="blue">蓝色系</option>
                    <option value="green">绿色系</option>
                    <option value="purple">紫色系</option>
                    <option value="orange">橙色系</option>
                    <option value "pink">粉色系</option>
                    <option value="gray">灰色系</option>
                    <option value="black">黑白</option>
                    <option value="rainbow">彩虹色</option>
                </select>
            </div>
        </div>
        
        <button class="generate-btn" id="generateBtn">生成词云图</button>
        
        <div id="chart" class="chart-container"></div>
        
        <button class="export-btn" id="exportBtn">导出词云图</button>
        
        <div class="footer">
            <p>本工具由叁贰壹制作</p>
            <p>微信coolman88886666</p>
            <p>QQ邮箱<a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="0a323e3938383c333a3e4a7b7b24696567">[email&#160;protected]</a></p>
            <p>gmail <a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="116229252223232728212451767c70787d3f727e7c">[email&#160;protected]</a></p>
        </div>
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 初始化图表
        const chartDom = document.getElementById('chart');
        const myChart = echarts.init(chartDom);
        
        // 文件上传处理
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        let wordData = [];
        
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            fileInfo.textContent = `已选择文件: ${file.name}`;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                
                if (file.name.endsWith('.txt')) {
                    processTextFile(content);
                } else if (file.name.endsWith('.csv')) {
                    processCSVFile(content);
                } else if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) {
                    processExcelFile(content);
                }
            };
            
            if (file.name.endsWith('.txt')) {
                reader.readAsText(file);
            } else if (file.name.endsWith('.csv')) {
                reader.readAsText(file);
            } else if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) {
                reader.readAsArrayBuffer(file);
            }
        });
        
        function processTextFile(content) {
            const lines = content.split(/\r?\n/);
            wordData = countWords(lines);
        }
        
        function processCSVFile(content) {
            const lines = content.split(/\r?\n/);
            const words = [];
            
            lines.forEach(line => {
                const columns = line.split(',');
                words.push(...columns.map(col => col.trim()));
            });
            
            wordData = countWords(words);
        }
        
        function processExcelFile(content) {
            const data = new Uint8Array(content);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
            
            const words = [];
            jsonData.forEach(row => {
                if (Array.isArray(row)) {
                    words.push(...row.filter(cell => cell !== undefined && cell !== null).map(String));
                }
            });
            
            wordData = countWords(words);
        }
        
        function countWords(words) {
            const wordCount = {};
            
            words.forEach(word => {
                if (word && word.trim() !== '') {
                    word = word.trim();
                    wordCount[word] = (wordCount[word] || 0) + 1;
                }
            });
            
            return Object.entries(wordCount).map(([name, value]) => ({
                name,
                value
            }));
        }
        
        // 生成词云图
        document.getElementById('generateBtn').addEventListener('click', function() {
            if (wordData.length === 0) {
                alert('请先上传包含关键词的文件！');
                return;
            }
            
            const shape = document.getElementById('shapeSelect').value;
            const colorScheme = document.getElementById('colorSelect').value;
            
            const option = getWordCloudOption(wordData, shape, colorScheme);
            myChart.setOption(option);
        });
        
        function getWordCloudOption(data, shape, colorScheme) {
            const colorMap = {
                random: ['#c23531','#2f4554','#61a0a8','#d48265','#91c7ae','#749f83','#ca8622','#bda29a','#6e7074','#546570','#c4ccd3'],
                red: ['#ff0000','#cc0000','#990000','#ff3333','#ff6666','#ff9999','#ffcccc','#660000','#330000','#ff1a1a'],
                blue: ['#0000ff','#0000cc','#000099','#3333ff','#6666ff','#9999ff','#ccccff','#000066','#000033','#1a1aff'],
                green: ['#00ff00','#00cc00','#009900','#33ff33','#66ff66','#99ff99','#ccffcc','#006600','#003300','#1aff1a'],
                purple: ['#800080','#660066','#4d004d','#993399','#b366b3','#cc99cc','#e6cce6','#330033','#1a001a','#a64da6'],
                orange: ['#ffa500','#cc8400','#996300','#ffb733','#ffc966','#ffdb99','#ffedcc','#664200','#332100','#ffae1a'],
                pink: ['#ff69b4','#cc5490','#993f6c','#ff87c3','#ffa5d2','#ffc3e1','#ffe1f0','#662a48','#331524','#ff7eb9'],
                gray: ['#808080','#666666','#4d4d4d','#999999','#b3b3b3','#cccccc','#e6e6e6','#333333','#1a1a1a','#a6a6a6'],
                black: ['#000000','#000000','#000000','#000000','#000000','#000000','#000000','#000000','#000000','#000000'],
                rainbow: ['#ff0000','#ff7f00','#ffff00','#00ff00','#0000ff','#4b0082','#9400d3','#ff1493','#00ffff','#ff00ff']
            };
            
            return {
                series: [{
                    type: 'wordCloud',
                    shape: shape,
                    left: 'center',
                    top: 'center',
                    width: '90%',
                    height: '90%',
                    right: null,
                    bottom: null,
                    sizeRange: [12, 60],
                    rotationRange: [-45, 45],
                    rotationStep: 15,
                    gridSize: 8,
                    drawOutOfBound: false,
                    textStyle: {
                        fontFamily: 'sans-serif',
                        fontWeight: 'bold',
                        color: function () {
                            return colorMap[colorScheme][Math.floor(Math.random() * colorMap[colorScheme].length)];
                        }
                    },
                    emphasis: {
                        textStyle: {
                            shadowBlur: 10,
                            shadowColor: '#333'
                        }
                    },
                    data: data
                }]
            };
        }
        
        // 导出词云图
        document.getElementById('exportBtn').addEventListener('click', function() {
            if (wordData.length === 0) {
                alert('请先生成词云图！');
                return;
            }
            
            const url = myChart.getDataURL({
                type: 'png',
                pixelRatio: 2,
                backgroundColor: '#fff'
            });
            
            const link = document.createElement('a');
            link.href = url;
            link.download = '词云图.png';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
        
        // 响应式调整
        window.addEventListener('resize', function() {
            myChart.resize();
        });
    </script>
</body>
</html>
