<body class="bg-gradient-to-b from-light to-slate-100 min-h-screen font-sans text-dark">

        <!-- 页脚备注 -->
        <footer class="text-center text-neutral text-sm py-4 border-t border-slate-200">
            <p>

                <a href="https://dkfile.com/Dx25214" target="_blank" rel="noopener" class="text-primary hover:underline">🌌</a>

    <!-- 核心逻辑JS -->
    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // 全局变量
        const qrContent = document.getElementById('qrContent');
        const generateBtn = document.getElementById('generateBtn');
        const foregroundColor = document.getElementById('foregroundColor');
        const foregroundColorCode = document.getElementById('foregroundColorCode');
        const backgroundColor = document.getElementById('backgroundColor');
        const backgroundColorCode = document.getElementById('backgroundColorCode');
        const dotShapeRadios = document.querySelectorAll('input[name="dotShape"]');
        const logoInput = document.getElementById('logoInput');
        const logoPreviewContainer = document.getElementById('logoPreviewContainer');
        const logoPreview = document.getElementById('logoPreview');
        const logoSize = document.getElementById('logoSize');
        const removeLogoBtn = document.getElementById('removeLogoBtn');
        const emptyPreviewTip = document.getElementById('emptyPreviewTip');
        const qrPreviewContainer = document.getElementById('qrPreviewContainer');
        const originalQrCode = document.getElementById('originalQrCode');
        const beautifulQrCode = document.getElementById('beautifulQrCode');
        const qrSize = document.getElementById('qrSize');
        const qrSizeValue = document.getElementById('qrSizeValue');
        const downloadSection = document.getElementById('downloadSection');
        const downloadPngBtn = document.getElementById('downloadPngBtn');
        const downloadJpgBtn = document.getElementById('downloadJpgBtn');
        const downloadSvgBtn = document.getElementById('downloadSvgBtn');
        
        // 存储logo图片
        let logoImage = null;
        // 存储原始二维码图像数据
        let qrImageData = null;
        
        // 1. 初始化事件监听
        function initEventListeners() {
            // 生成二维码按钮
            generateBtn.addEventListener('click', generateQrCode);
            
            // 颜色选择器事件
            foregroundColor.addEventListener('input', () => {
                foregroundColorCode.value = foregroundColor.value;
                if (qrImageData) {
                    beautifyQrCode();
                }
            });
            
            foregroundColorCode.addEventListener('input', () => {
                if (/^#([0-9A-F]{3}){1,2}$/i.test(foregroundColorCode.value)) {
                    foregroundColor.value = foregroundColorCode.value;
                    if (qrImageData) {
                        beautifyQrCode();
                    }
                }
            });
            
            backgroundColor.addEventListener('input', () => {
                backgroundColorCode.value = backgroundColor.value;
                if (qrImageData) {
                    beautifyQrCode();
                }
            });
            
            backgroundColorCode.addEventListener('input', () => {
                if (/^#([0-9A-F]{3}){1,2}$/i.test(backgroundColorCode.value)) {
                    backgroundColor.value = backgroundColorCode.value;
                    if (qrImageData) {
                        beautifyQrCode();
                    }
                }
            });
            
            // 形状选择事件
            dotShapeRadios.forEach(radio => {
                radio.addEventListener('change', () => {
                    if (qrImageData) {
                        beautifyQrCode();
                    }
                });
            });
            
            // Logo上传事件
            logoInput.addEventListener('change', handleLogoUpload);
            
            // 移除Logo事件
            removeLogoBtn.addEventListener('click', removeLogo);
            
            // Logo大小调整事件
            logoSize.addEventListener('input', () => {
                if (qrImageData) {
                    beautifyQrCode();
                }
            });
            
            // 二维码尺寸调整事件
            qrSize.addEventListener('input', () => {
                qrSizeValue.textContent = `${qrSize.value}px`;
                if (qrImageData) {
                    generateQrCode(); // 重新生成以改变尺寸
                }
            });
            
            // 下载按钮事件
            downloadPngBtn.addEventListener('click', () => downloadQrCode('png'));
            downloadJpgBtn.addEventListener('click', () => downloadQrCode('jpeg'));
            downloadSvgBtn.addEventListener('click', downloadSvgQrCode);
        }
        
        // 2. 生成原始二维码
        function generateQrCode() {
            const content = qrContent.value.trim();
            if (!content) {
                alert('请输入网址或文本内容');
                return;
            }
            
            const size = parseInt(qrSize.value);
            
            // 清空原始二维码容器
            originalQrCode.innerHTML = '';
            
            // 使用qrcode.js生成原始二维码
            QRCode.toCanvas(originalQrCode, content, {
                width: size,
                margin: 1,
                color: {
                    dark: '#000000', // 临时使用黑色，后续会替换
                    light: '#ffffff'
                }
            }, (error, canvas) => {
                if (error) {
                    console.error('生成二维码失败:', error);
                    alert('生成二维码失败，请重试');
                    return;
                }
                
                // 存储原始二维码图像数据
                const ctx = canvas.getContext('2d');
                qrImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                
                // 显示预览容器，隐藏空提示
                emptyPreviewTip.classList.add('hidden');
                qrPreviewContainer.classList.remove('hidden');
                downloadSection.classList.remove('hidden');
                
                // 美化二维码
                beautifyQrCode();
            });
        }
        
        // 3. 美化二维码（核心功能）
        function beautifyQrCode() {
            if (!qrImageData) return;
            
            const size = parseInt(qrSize.value);
            const foreColor = foregroundColor.value;
            const backColor = backgroundColor.value;
            const dotShape = document.querySelector('input[name="dotShape"]:checked').value;
            
            // 设置Canvas尺寸
            beautifulQrCode.width = size;
            beautifulQrCode.height = size;
            const ctx = beautifulQrCode.getContext('2d');
            
            // 填充背景色
            ctx.fillStyle = backColor;
            ctx.fillRect(0, 0, size, size);
            
            // 获取图像数据
            const imageData = new ImageData(
                new Uint8ClampedArray(qrImageData.data),
                qrImageData.width,
                qrImageData.height
            );
            
            // 解析颜色值为RGBA
            const foreRgba = hexToRgba(foreColor);
            const backRgba = hexToRgba(backColor);
            
            // 二维码模块大小（每个点的像素大小）
            const moduleSize = Math.floor(size / imageData.width);
            
            // 绘制二维码点
            for (let y = 0; y < imageData.height; y++) {
                for (let x = 0; x < imageData.width; x++) {
                    // 计算像素索引（RGBA）
                    const index = (y * imageData.width + x) * 4;
                    const isDark = imageData.data[index] === 0; // 原始二维码黑色点
                    
                    if (isDark) {
                        // 绘制前景点
                        const drawX = x * moduleSize;
                        const drawY = y * moduleSize;
                        
                        ctx.fillStyle = foreColor;
                        
                        if (dotShape === 'square') {
                            // 方形点
                            ctx.fillRect(drawX, drawY, moduleSize, moduleSize);
                        } else {
                            // 圆形点
                            ctx.beginPath();
                            ctx.arc(
                                drawX + moduleSize / 2,
                                drawY + moduleSize / 2,
                                moduleSize / 2,
                                0,
                                Math.PI * 2
                            );
                            ctx.fill();
                        }
                    }
                }
            }
            
            // 如果有Logo，添加Logo
            if (logoImage) {
                addLogoToQrCode(ctx, size);
            }
        }
        
        // 4. 添加Logo到二维码
        function addLogoToQrCode(ctx, qrSize) {
            const logo = new Image();
            logo.onload = () => {
                // 计算Logo大小（占二维码的百分比）
                const logoPercent = parseInt(logoSize.value) / 100;
                const logoSizePx = qrSize * logoPercent;
                
                // 计算Logo位置（居中）
                const x = (qrSize - logoSizePx) / 2;
                const y = (qrSize - logoSizePx) / 2;
                
                // 绘制Logo背景（可选，增加对比度）
                ctx.fillStyle = backgroundColor.value;
                ctx.beginPath();
                ctx.arc(qrSize / 2, qrSize / 2, logoSizePx / 2 + 5, 0, Math.PI * 2);
                ctx.fill();
                
                // 绘制Logo
                ctx.drawImage(logo, x, y, logoSizePx, logoSizePx);
            };
            logo.src = logoImage;
        }
        
        // 5. 处理Logo上传
        function handleLogoUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            // 检查文件类型
            if (!file.type.startsWith('image/')) {
                alert('请上传图片文件！');
                return;
            }
            
            // 读取图片
            const reader = new FileReader();
            reader.onload = (readerEvent) => {
                logoImage = readerEvent.target.result;
                logoPreview.src = logoImage;
                logoPreviewContainer.classList.remove('hidden');
                
                // 如果已有二维码，重新美化
                if (qrImageData) {
                    beautifyQrCode();
                }
            };
            reader.readAsDataURL(file);
            
            // 清空input值
            logoInput.value = '';
        }
        
        // 6. 移除Logo
        function removeLogo() {
            logoImage = null;
            logoPreviewContainer.classList.add('hidden');
            
            // 如果已有二维码，重新美化
            if (qrImageData) {
                beautifyQrCode();
            }
        }
        
        // 7. 下载二维码
        function downloadQrCode(format) {
            if (!qrImageData) return;
            
            // 创建下载链接
            const link = document.createElement('a');
            link.download = `qrcode.${format}`;
            
            // 转换Canvas为对应格式
            beautifulQrCode.toDataURL(`image/${format}`, 0.95)
                .then(url => {
                    link.href = url;
                    link.click();
                })
                .catch(error => {
                    console.error('下载失败:', error);
                    alert('下载失败，请重试');
                });
        }
        
        // 8. 下载SVG格式二维码
        function downloadSvgQrCode() {
            if (!qrImageData) return;
            
            const content = qrContent.value.trim();
            const size = parseInt(qrSize.value);
            const foreColor = foregroundColor.value;
            const backColor = backgroundColor.value;
            const dotShape = document.querySelector('input[name="dotShape"]:checked').value;
            
            // 创建SVG元素
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("width", size);
            svg.setAttribute("height", size);
            svg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
            
            // 添加背景
            const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            rect.setAttribute("width", "100%");
            rect.setAttribute("height", "100%");
            rect.setAttribute("fill", backColor);
            svg.appendChild(rect);
            
            // 二维码模块大小
            const moduleSize = Math.floor(size / qrImageData.width);
            
            // 绘制二维码点
            for (let y = 0; y < qrImageData.height; y++) {
                for (let x = 0; x < qrImageData.width; x++) {
                    const index = (y * qrImageData.width + x) * 4;
                    const isDark = qrImageData.data[index] === 0;
                    
                    if (isDark) {
                        const drawX = x * moduleSize;
                        const drawY = y * moduleSize;
                        
                        if (dotShape === 'square') {
                            // 方形点
                            const dot = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                            dot.setAttribute("x", drawX);
                            dot.setAttribute("y", drawY);
                            dot.setAttribute("width", moduleSize);
                            dot.setAttribute("height", moduleSize);
                            dot.setAttribute("fill", foreColor);
                            svg.appendChild(dot);
                        } else {
                            // 圆形点
                            const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                            dot.setAttribute("cx", drawX + moduleSize / 2);
                            dot.setAttribute("cy", drawY + moduleSize / 2);
                            dot.setAttribute("r", moduleSize / 2);
                            dot.setAttribute("fill", foreColor);
                            svg.appendChild(dot);
                        }
                    }
                }
            }
            
            // 如果有Logo，添加Logo
            if (logoImage) {
                const logoPercent = parseInt(logoSize.value) / 100;
                const logoSizePx = size * logoPercent;
                const x = (size - logoSizePx) / 2;
                const y = (size - logoSizePx) / 2;
                
                // Logo背景
                const logoBg = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                logoBg.setAttribute("cx", size / 2);
                logoBg.setAttribute("cy", size / 2);
                logoBg.setAttribute("r", logoSizePx / 2 + 5);
                logoBg.setAttribute("fill", backColor);
                svg.appendChild(logoBg);
                
                // Logo图片
                const logo = document.createElementNS("http://www.w3.org/2000/svg", "image");
                logo.setAttribute("x", x);
                logo.setAttribute("y", y);
                logo.setAttribute("width", logoSizePx);
                logo.setAttribute("height", logoSizePx);
                logo.setAttribute("href", logoImage);
                svg.appendChild(logo);
            }
            
            // 转换为SVG数据并下载
            const serializer = new XMLSerializer();
            const source = serializer.serializeToString(svg);
            const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(source);
            
            const link = document.createElement("a");
            link.download = "qrcode.svg";
            link.href = url;
            link.click();
        }
        
        // 辅助函数：将十六进制颜色转换为RGBA
        function hexToRgba(hex) {
            // 去掉#号
            hex = hex.replace('#', '');
            
            // 解析RGB值
            let r, g, b;
            if (hex.length === 3) {
                // 简写形式（如：#f00）
                r = parseInt(hex[0] + hex[0], 16);
                g = parseInt(hex[1] + hex[1], 16);
                b = parseInt(hex[2] + hex[2], 16);
            } else {
                // 完整形式（如：#ff0000）
                r = parseInt(hex.substring(0, 2), 16);
                g = parseInt(hex.substring(2, 4), 16);
                b = parseInt(hex.substring(4, 6), 16);
            }
            
            return { r, g, b, a: 255 };
        }
        
        // 初始化页面
        function init() {
            initEventListeners();
            // 初始化尺寸显示
            qrSizeValue.textContent = `${qrSize.value}px`;
            // 默认生成一个二维码
            generateQrCode();
        }
        
        // 页面加载完成后初始化
        window.addEventListener('load', init);
    </script>
</body>
