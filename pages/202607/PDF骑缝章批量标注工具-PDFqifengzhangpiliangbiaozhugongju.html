<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF骑缝章批量标注工具</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            padding: 40px;
        }

        .section {
            margin-bottom: 40px;
            padding: 30px;
            border: 2px solid #f0f0f0;
            border-radius: 10px;
            background: #fafafa;
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin: 0;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .progress-container {
            margin-top: 20px;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
        }

        .progress-text {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }

        .file-list {
            max-height: 200px;
            overflow-y: auto;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            background: white;
        }

        .file-item {
            padding: 8px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .remove-file {
            background: #ff4757;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .preview-area {
            border: 2px dashed #ddd;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
        }

        .seal-preview {
            max-width: 150px;
            max-height: 150px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .page-range-input {
            display: none;
        }

        .page-range-input.show {
            display: block;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        @media (max-width: 768px) {
            .main-content {
                padding: 20px;
            }

            .settings-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>PDF骑缝章批量标注工具</h1>
            <p>专业的PDF印章批量处理工具，支持骑缝章、数字签名、自定义印章</p>
        </div>

        <div class="main-content">
            <div id="alerts"></div>

            <!-- 文件上传区域 -->
            <div class="section">
                <h2>📁 文件管理</h2>
                <div class="form-group">
                    <label for="pdfFiles">选择PDF文件（支持批量选择）</label>
                    <input type="file" id="pdfFiles" accept=".pdf" multiple>
                </div>
                <div class="file-list" id="fileList"></div>
                <button class="btn btn-secondary" onclick="clearFiles()">清空文件列表</button>
            </div>

            <!-- 印章设置区域 -->
            <div class="section">
                <h2>🔖 印章设置</h2>
                <div class="settings-grid">
                    <div>
                        <div class="form-group">
                            <label for="sealFile">上传印章图片</label>
                            <input type="file" id="sealFile" accept=".png,.jpg,.jpeg,.gif">
                        </div>
                        <div class="form-group">
                            <label for="sealType">印章类型</label>
                            <select id="sealType">
                                <option value="normal">普通印章</option>
                                <option value="cross">骑缝章</option>
                                <option value="both">普通+骑缝章</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="sealSize">印章大小 (像素)</label>
                            <input type="number" id="sealSize" value="100" min="20" max="300">
                        </div>
                        <div class="form-group">
                            <label for="sealOpacity">透明度 (%)</label>
                            <input type="range" id="sealOpacity" min="10" max="100" value="80">
                            <span id="opacityValue">80%</span>
                        </div>
                    </div>
                    <div>
                        <div class="preview-area">
                            <div id="sealPreview">
                                <p>印章预览区域<br>请上传印章图片</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 位置设置区域 -->
            <div class="section">
                <h2>📍 位置设置</h2>
                <div class="settings-grid">
                    <div>
                        <div class="form-group">
                            <label for="positionType">印章位置</label>
                            <select id="positionType">
                                <option value="bottom-right">右下角</option>
                                <option value="bottom-left">左下角</option>
                                <option value="top-right">右上角</option>
                                <option value="top-left">左上角</option>
                                <option value="center">居中</option>
                                <option value="custom">自定义位置</option>
                            </select>
                        </div>
                        <div class="form-group" id="customPosition" style="display: none;">
                            <label>自定义位置 (X, Y坐标)</label>
                            <div style="display: flex; gap: 10px;">
                                <input type="number" id="customX" placeholder="X坐标" value="50">
                                <input type="number" id="customY" placeholder="Y坐标" value="50">
                            </div>
                        </div>
                    </div>
                    <div>
                        <div class="form-group">
                            <label for="marginX">水平边距 (像素)</label>
                            <input type="number" id="marginX" value="20" min="0">
                        </div>
                        <div class="form-group">
                            <label for="marginY">垂直边距 (像素)</label>
                            <input type="number" id="marginY" value="20" min="0">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 页面设置区域 -->
            <div class="section">
                <h2>📄 页面设置</h2>
                <div class="checkbox-group">
                    <input type="radio" id="allPages" name="pageOption" value="all" checked>
                    <label for="allPages">所有页面</label>
                </div>
                <div class="checkbox-group">
                    <input type="radio" id="specificPages" name="pageOption" value="specific">
                    <label for="specificPages">指定页面</label>
                </div>
                <div class="form-group page-range-input" id="pageRangeInput">
                    <label for="pageRange">页面范围 (例如: 1,3,5-8)</label>
                    <input type="text" id="pageRange" placeholder="1,3,5-8">
                    <small>支持单页(1)、多页(1,3,5)、范围(1-5)的组合</small>
                </div>
            </div>

            <!-- 数字签名设置 -->
            <div class="section">
                <h2>🔐 数字签名设置</h2>
                <div class="checkbox-group">
                    <input type="checkbox" id="enableDigitalSign">
                    <label for="enableDigitalSign">启用数字签名</label>
                </div>
                <div class="form-group">
                    <label for="signReason">签名原因</label>
                    <input type="text" id="signReason" placeholder="文件审批" value="文件审批">
                </div>
                <div class="form-group">
                    <label for="signLocation">签名地点</label>
                    <input type="text" id="signLocation" placeholder="北京" value="北京">
                </div>
            </div>

            <!-- 处理按钮区域 -->
            <div class="section">
                <h2>⚡ 批量处理</h2>
                <button class="btn" onclick="processFiles()">开始批量处理</button>
                <button class="btn btn-success" onclick="downloadAll()">下载所有文件</button>
                <button class="btn btn-secondary" onclick="previewSample()">预览效果</button>

                <div class="progress-container" id="progressContainer">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-text" id="progressText">处理中...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedFiles = [];
        let processedFiles = [];
        let sealImage = null;

        // 初始化事件监听器
        document.addEventListener('DOMContentLoaded', function () {
            initializeEventListeners();
        });

        function initializeEventListeners() {
            // 文件选择
            document.getElementById('pdfFiles').addEventListener('change', handleFileSelect);
            document.getElementById('sealFile').addEventListener('change', handleSealUpload);

            // 透明度滑块
            document.getElementById('sealOpacity').addEventListener('input', updateOpacityDisplay);

            // 位置类型选择
            document.getElementById('positionType').addEventListener('change', toggleCustomPosition);

            // 页面选项
            document.querySelectorAll('input[name="pageOption"]').forEach(radio => {
                radio.addEventListener('change', togglePageRange);
            });
        }

        function handleFileSelect(event) {
            const files = Array.from(event.target.files);
            selectedFiles = [...selectedFiles, ...files];
            updateFileList();
        }

        function updateFileList() {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';

            selectedFiles.forEach((file, index) => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.innerHTML = `
                    <span>${file.name} (${formatFileSize(file.size)})</span>
                    <button class="remove-file" onclick="removeFile(${index})">删除</button>
                `;
                fileList.appendChild(fileItem);
            });
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
        }

        function clearFiles() {
            selectedFiles = [];
            processedFiles = [];
            updateFileList();
            document.getElementById('pdfFiles').value = '';
        }

        function handleSealUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    sealImage = e.target.result;
                    updateSealPreview();
                };
                reader.readAsDataURL(file);
            }
        }

        function updateSealPreview() {
            const preview = document.getElementById('sealPreview');
            const opacity = document.getElementById('sealOpacity').value / 100;

            if (sealImage) {
                preview.innerHTML = `<img src="${sealImage}" class="seal-preview" style="opacity: ${opacity};">`;
            }
        }

        function updateOpacityDisplay() {
            const value = document.getElementById('sealOpacity').value;
            document.getElementById('opacityValue').textContent = value + '%';
            updateSealPreview();
        }

        function toggleCustomPosition() {
            const positionType = document.getElementById('positionType').value;
            const customPosition = document.getElementById('customPosition');
            customPosition.style.display = positionType === 'custom' ? 'block' : 'none';
        }

        function togglePageRange() {
            const specificPages = document.getElementById('specificPages').checked;
            const pageRangeInput = document.getElementById('pageRangeInput');
            pageRangeInput.classList.toggle('show', specificPages);
        }

        function showAlert(message, type = 'info') {
            const alertsContainer = document.getElementById('alerts');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            alert.style.display = 'block';

            alertsContainer.appendChild(alert);

            setTimeout(() => {
                alert.remove();
            }, 5000);
        }

        function updateProgress(current, total) {
            const progressContainer = document.getElementById('progressContainer');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');

            progressContainer.style.display = 'block';
            const percentage = (current / total) * 100;
            progressFill.style.width = percentage + '%';
            progressText.textContent = `处理进度: ${current}/${total} (${Math.round(percentage)}%)`;
        }

        function hideProgress() {
            document.getElementById('progressContainer').style.display = 'none';
        }

        async function processFiles() {
            if (selectedFiles.length === 0) {
                showAlert('请先选择PDF文件', 'error');
                return;
            }

            if (!sealImage) {
                showAlert('请先上传印章图片', 'error');
                return;
            }

            try {
                processedFiles = [];

                for (let i = 0; i < selectedFiles.length; i++) {
                    updateProgress(i, selectedFiles.length);
                    const processedFile = await processSingleFile(selectedFiles[i]);
                    processedFiles.push(processedFile);
                }

                updateProgress(selectedFiles.length, selectedFiles.length);
                showAlert(`成功处理 ${selectedFiles.length} 个文件`, 'success');

                setTimeout(hideProgress, 2000);
            } catch (error) {
                console.error('处理文件时出错:', error);
                showAlert('处理文件时出错: ' + error.message, 'error');
                hideProgress();
            }
        }

        async function processSingleFile(file) {
            const arrayBuffer = await file.arrayBuffer();
            const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);

            // 获取设置
            const sealType = document.getElementById('sealType').value;
            const sealSize = parseInt(document.getElementById('sealSize').value);
            const opacity = document.getElementById('sealOpacity').value / 100;
            const positionType = document.getElementById('positionType').value;
            const marginX = parseInt(document.getElementById('marginX').value);
            const marginY = parseInt(document.getElementById('marginY').value);

            // 获取页面范围
            const pageIndices = getPageIndices(pdfDoc.getPageCount());

            // 嵌入印章图片
            const sealImageBytes = await fetch(sealImage).then(res => res.arrayBuffer());
            let embeddedImage;

            if (sealImage.includes('data:image/png')) {
                embeddedImage = await pdfDoc.embedPng(sealImageBytes);
            } else {
                embeddedImage = await pdfDoc.embedJpg(sealImageBytes);
            }

            // 处理每一页
            pageIndices.forEach(pageIndex => {
                const page = pdfDoc.getPage(pageIndex);
                const { width, height } = page.getSize();

                if (sealType === 'normal' || sealType === 'both') {
                    const position = calculatePosition(positionType, width, height, sealSize, marginX, marginY);
                    page.drawImage(embeddedImage, {
                        x: position.x,
                        y: position.y,
                        width: sealSize,
                        height: sealSize,
                        opacity: opacity
                    });
                }

                if (sealType === 'cross' || sealType === 'both') {
                    // 骑缝章 - 在页面右边缘中间
                    page.drawImage(embeddedImage, {
                        x: width - sealSize / 2,
                        y: height / 2 - sealSize / 2,
                        width: sealSize,
                        height: sealSize,
                        opacity: opacity
                    });
                }
            });

            // 数字签名
            if (document.getElementById('enableDigitalSign').checked) {
                // 这里可以添加数字签名逻辑
                // 由于pdf-lib的限制，这里只是添加元数据
                pdfDoc.setTitle('已签名文档');
                pdfDoc.setSubject(document.getElementById('signReason').value);
                pdfDoc.setCreator('PDF骑缝章批量标注工具');
            }

            const pdfBytes = await pdfDoc.save();

            return {
                name: file.name.replace('.pdf', '_已盖章.pdf'),
                data: pdfBytes
            };
        }

        function getPageIndices(totalPages) {
            const allPages = document.getElementById('allPages').checked;

            if (allPages) {
                return Array.from({ length: totalPages }, (_, i) => i);
            }

            const pageRange = document.getElementById('pageRange').value;
            const indices = [];

            if (!pageRange.trim()) {
                return [0]; // 默认第一页
            }

            const parts = pageRange.split(',');
            parts.forEach(part => {
                part = part.trim();
                if (part.includes('-')) {
                    const [start, end] = part.split('-').map(n => parseInt(n.trim()));
                    for (let i = start - 1; i < Math.min(end, totalPages); i++) {
                        if (i >= 0 && !indices.includes(i)) {
                            indices.push(i);
                        }
                    }
                } else {
                    const pageNum = parseInt(part) - 1;
                    if (pageNum >= 0 && pageNum < totalPages && !indices.includes(pageNum)) {
                        indices.push(pageNum);
                    }
                }
            });

            return indices.sort((a, b) => a - b);
        }

        function calculatePosition(positionType, pageWidth, pageHeight, sealSize, marginX, marginY) {
            switch (positionType) {
                case 'bottom-right':
                    return {
                        x: pageWidth - sealSize - marginX,
                        y: marginY
                    };
                case 'bottom-left':
                    return {
                        x: marginX,
                        y: marginY
                    };
                case 'top-right':
                    return {
                        x: pageWidth - sealSize - marginX,
                        y: pageHeight - sealSize - marginY
                    };
                case 'top-left':
                    return {
                        x: marginX,
                        y: pageHeight - sealSize - marginY
                    };
                case 'center':
                    return {
                        x: (pageWidth - sealSize) / 2,
                        y: (pageHeight - sealSize) / 2
                    };
                case 'custom':
                    return {
                        x: parseInt(document.getElementById('customX').value),
                        y: parseInt(document.getElementById('customY').value)
                    };
                default:
                    return {
                        x: pageWidth - sealSize - marginX,
                        y: marginY
                    };
            }
        }

        function downloadAll() {
            if (processedFiles.length === 0) {
                showAlert('没有已处理的文件可供下载', 'error');
                return;
            }

            processedFiles.forEach((file, index) => {
                setTimeout(() => {
                    try {
                        const blob = new Blob([file.data], { type: 'application/pdf' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = file.name;
                        a.style.display = 'none';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        setTimeout(() => URL.revokeObjectURL(url), 1000);
                    } catch (error) {
                        console.error('下载文件失败:', error);
                        showAlert(`下载文件 ${file.name} 失败`, 'error');
                    }
                }, index * 500); // 延迟下载避免浏览器阻止
            });

            showAlert(`开始下载 ${processedFiles.length} 个文件`, 'success');
        }

        async function previewSample() {
            if (selectedFiles.length === 0) {
                showAlert('请先选择PDF文件', 'error');
                return;
            }

            if (!sealImage) {
                showAlert('请先上传印章图片', 'error');
                return;
            }

            try {
                showAlert('正在生成预览...', 'info');
                const previewFile = await processSingleFile(selectedFiles[0]);

                const blob = new Blob([previewFile.data], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                window.open(url, '_blank');

                showAlert('预览已在新窗口打开', 'success');
            } catch (error) {
                console.error('预览失败:', error);
                showAlert('预览失败: ' + error.message, 'error');
            }
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
    </script>
</body>

</html>
