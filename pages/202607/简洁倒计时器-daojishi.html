<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简洁倒计时器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .input-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .time-input {
            width: 80px;
            padding: 10px;
            font-size: 18px;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .separator {
            display: flex;
            align-items: center;
            font-size: 24px;
            color: #333;
        }

        .timer-display {
            font-size: 48px;
            font-weight: bold;
            margin: 20px 0;
            color: #333;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #start-btn {
            background-color: #4CAF50;
            color: white;
        }

        #start-btn:hover {
            background-color: #45a049;
        }

        #pause-btn {
            background-color: #ff9800;
            color: white;
        }

        #pause-btn:hover {
            background-color: #e68a00;
        }

        #reset-btn {
            background-color: #f44336;
            color: white;
        }

        #reset-btn:hover {
            background-color: #d32f2f;
        }

        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ff5722;
            color: white;
            padding: 15px 25px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            animation: fadeIn 0.5s;
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; top: 0; }
            to { opacity: 1; top: 20px; }
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .timer-display {
                font-size: 36px;
            }

            .time-input {
                width: 60px;
                font-size: 16px;
            }

            button {
                padding: 8px 16px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>倒计时器</h1>
        <div class="input-container">
            <input type="number" id="hours" class="time-input" placeholder="时" min="0" max="99">
            <div class="separator">:</div>
            <input type="number" id="minutes" class="time-input" placeholder="分" min="0" max="59">
            <div class="separator">:</div>
            <input type="number" id="seconds" class="time-input" placeholder="秒" min="0" max="59">
        </div>
        <div class="timer-display" id="timer">00:00:00</div>
        <div class="button-container">
            <button id="start-btn">开始</button>
            <button id="pause-btn">暂停</button>
            <button id="reset-btn">重置</button>
        </div>
    </div>

    <div class="notification" id="notification">时间到！</div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const hoursInput = document.getElementById('hours');
            const minutesInput = document.getElementById('minutes');
            const secondsInput = document.getElementById('seconds');
            const timerDisplay = document.getElementById('timer');
            const startBtn = document.getElementById('start-btn');
            const pauseBtn = document.getElementById('pause-btn');
            const resetBtn = document.getElementById('reset-btn');
            const notification = document.getElementById('notification');

            let timer; // 计时器变量
            let totalSeconds = 0; // 总秒数
            let isRunning = false; // 是否运行中

            // 格式化时间显示
            function formatTime(seconds) {
                if (seconds < 0) seconds = 0;
                const hours = Math.floor(seconds / 3600);
                const minutes = Math.floor((seconds % 3600) / 60);
                const remainingSeconds = seconds % 60;

                return (
                    `${hours.toString().padStart(2, '0')}:` +
                    `${minutes.toString().padStart(2, '0')}:` +
                    `${remainingSeconds.toString().padStart(2, '0')}`
                );
            }

            // 显示通知
            function showNotification() {
                notification.style.display = 'block';
                setTimeout(() => {
                    notification.style.display = 'none';
                }, 3000);
            }

            // 播放提示音
            function playAlertSound() {
                const audio = new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU...');
                audio.play().catch(e => console.log('无法播放提示音:', e));
            }

            // 开始倒计时
            function startTimer() {
                if (isRunning) return;

                // 获取输入值
                const hours = parseInt(hoursInput.value) || 0;
                const minutes = parseInt(minutesInput.value) || 0;
                const seconds = parseInt(secondsInput.value) || 0;

                // 如果没有设置时间，不启动
                if (hours === 0 && minutes === 0 && seconds === 0) {
                    alert('请设置倒计时时间');
                    return;
                }

                // 如果是第一次启动，则设置总秒数
                if (totalSeconds === 0) {
                    totalSeconds = hours * 3600 + minutes * 60 + seconds;
                }

                isRunning = true;

                timer = setInterval(function() {
                    if (totalSeconds <= 0) {
                        clearInterval(timer);
                        isRunning = false;
                        timerDisplay.textContent = '00:00:00';
                        playAlertSound();
                        showNotification();
                        return;
                    }

                    totalSeconds--;
                    timerDisplay.textContent = formatTime(totalSeconds);
                }, 1000);
            }

            // 暂停倒计时
            function pauseTimer() {
                if (!isRunning) return;

                clearInterval(timer);
                isRunning = false;
            }

            // 重置倒计时
            function resetTimer() {
                clearInterval(timer);
                isRunning = false;
                totalSeconds = 0;
                timerDisplay.textContent = '00:00:00';
                hoursInput.value = '';
                minutesInput.value = '';
                secondsInput.value = '';
            }

            // 事件监听
            startBtn.addEventListener('click', startTimer);
            pauseBtn.addEventListener('click', pauseTimer);
            resetBtn.addEventListener('click', resetTimer);

            // 输入限制
            hoursInput.addEventListener('change', function() {
                if (this.value > 99) this.value = 99;
                if (this.value < 0) this.value = 0;
            });

            minutesInput.addEventListener('change', function() {
                if (this.value > 59) this.value = 59;
                if (this.value < 0) this.value = 0;
            });

            secondsInput.addEventListener('change', function() {
                if (this.value > 59) this.value = 59;
                if (this.value < 0) this.value = 0;
            });
        });
    </script>
</body>
</html>
