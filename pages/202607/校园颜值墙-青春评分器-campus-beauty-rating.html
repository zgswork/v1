<!DOCTYPE html>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .author-info {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px 25px;
            margin-bottom: 20px;
            text-align: center;
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .author-info .author-label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .author-info .author-contact {
            font-size: 1.1em;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .author-info .wechat-icon {

            font-size: 1.2em;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .upload-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 3em;
            color: #667eea;
            margin-bottom: 15px;
        }

        .upload-text {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 15px;
        }

        .file-input {
            display: none;
        }

        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .beauty-wall {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .beauty-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            animation: slideIn 0.5s ease-out;
            cursor: pointer;
            position: relative;
        }

        .beauty-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .beauty-card::after {
            content: '点击查看详情';
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .beauty-card:hover::after {
            opacity: 1;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-image {
            width: 100%;
            height: 280px;
            object-fit: contain;
            object-position: center top;
            background: #f8f9ff;
            border-bottom: 3px solid #f0f0f0;
        }

        .card-content {
            padding: 20px;
        }

        .score-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .score {
            font-size: 2.5em;
            font-weight: bold;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tag {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .comment {
            color: #555;
            line-height: 1.6;
            font-size: 1em;
            font-style: italic;
            background: #f8f9ff;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .wall-title {
            color: white;
            font-size: 2em;
            text-align: center;
            margin: 40px 0 20px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .stats {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            color: white;
            text-align: center;
        }

        .stats-item {
            display: inline-block;
            margin: 0 20px;
        }

        .stats-number {
            font-size: 2em;
            font-weight: bold;
            display: block;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-size: 1.2em;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 模态框样式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            animation: fadeIn 0.3s ease;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            border-radius: 25px;
            max-width: 700px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.3s ease;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }

                opacity: 1;
                transform: translateY(0);
            }

            padding: 20px;
            border-radius: 25px 25px 0 0;
            text-align: center;
            position: relative;

        .modal-title {

            font-weight: bold;
            margin: 0;
        }

        .close-btn {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            font-size: 1.5em;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;

        .close-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-50%) scale(1.1);

        .modal-image {

            max-height: 400px;
            object-fit: contain;
            object-position: center;
            background: #f8f9ff;

            padding: 30px;
        }

        .detail-section {
            margin-bottom: 25px;

            font-weight: bold;
            color: #667eea;
            font-size: 1.1em;
            margin-bottom: 8px;
            display: block;

            background: #f8f9ff;

            border-radius: 15px;

            border-radius: 25px;
            font-size: 1.1em;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;

            background: #f8f9ff;
            padding: 20px;
            border-radius: 15px;
            border-left: 5px solid #667eea;
        }

        .comment-item {
            margin-bottom: 15px;
            padding: 12px 15px;
            background: white;
            border-radius: 10px;
            font-style: italic;
            line-height: 1.6;
            color: #555;
            border-left: 3px solid #667eea;
            position: relative;
        }

        .comment-item:before {
            content: '"';
            font-size: 2em;
            color: #667eea;
            position: absolute;
            left: -5px;
            top: -5px;
            font-weight: bold;
        }

        .comment-item:after {
            content: '"';
            font-size: 2em;
            color: #667eea;
            position: absolute;
            right: 5px;
            bottom: -15px;
            font-weight: bold;
        }

        .comment-item:last-child {
            margin-bottom: 0;
        }

        .detail-timestamp {
            color: #999;
            font-size: 0.9em;
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;

        .rating-breakdown {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;

        .rating-item {
            text-align: center;
            background: #f8f9ff;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #e8ebff;
        }

            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;

        .rating-item-score {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }
    </style>
</head>

            initializeEventListeners() {
                const fileInput = document.getElementById('fileInput');
                const uploadArea = document.getElementById('uploadArea');

                fileInput.addEventListener('change', (e) => this.handleFileSelect(e));
                
                uploadArea.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    uploadArea.classList.add('dragover');
                });

                uploadArea.addEventListener('dragleave', () => {
                    uploadArea.classList.remove('dragover');
                });

                uploadArea.addEventListener('drop', (e) => {
                    e.preventDefault();
                    uploadArea.classList.remove('dragover');
                    this.handleFileSelect(e);
                });

                // 模态框点击外部关闭
                document.getElementById('detailModal').addEventListener('click', (e) => {
                    if (e.target.id === 'detailModal') {
                        this.closeModal();
                    }
                });

                // ESC键关闭模态框
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        this.closeModal();
                    }
                });
            }

            handleFileSelect(event) {
                const files = event.target.files || event.dataTransfer.files;
                
                for (let file of files) {
                    if (file.type.startsWith('image/')) {
                        this.processImage(file);
                    }
                }
            }

            processImage(file) {
                const reader = new FileReader();
                
                reader.onload = (e) => {
                    // 显示加载状态
                    this.showLoading();
                    
                    // 模拟评分延迟
                    setTimeout(() => {
                        const rating = this.generateRating(e.target.result);
                        this.beautyData.unshift(rating); // 新的放在前面
                        this.saveData();
                        this.renderBeautyWall();
                        this.updateStats();
                        this.hideLoading();
                    }, 1500);
                };
                
                reader.readAsDataURL(file);
            }

            generateRating(imageData) {
                // 生成随机评分 (30-98分，更大范围)
                const score = Math.floor(Math.random() * 69) + 30;
                
                // 递增照片编号
                this.photoCounter++;
                const photoNumber = `#${this.photoCounter.toString().padStart(3, '0')}`;
                
                // 随机生成姓名和系别
                const surname = this.surnames[Math.floor(Math.random() * this.surnames.length)];
                const department = this.departments[Math.floor(Math.random() * this.departments.length)];
                const studentInfo = `（${surname}某，${department}）`;
                
                // 根据分数选择标签
                const styleLabel = this.styleLabels[Math.floor(Math.random() * this.styleLabels.length)];
                
                // 根据分数范围选择评语库
                let commentsPool;
                if (score >= 80) {
                    commentsPool = this.highScoreComments;
                } else if (score >= 60) {
                    commentsPool = this.midScoreComments;
                } else {
                    commentsPool = this.lowScoreComments;
                }
                
                // 随机选择4-5条不重复的评语
                const numComments = Math.floor(Math.random() * 2) + 4; // 4-5条
                const selectedComments = [];
                const usedIndices = new Set();
                
                while (selectedComments.length < numComments && selectedComments.length < commentsPool.length) {
                    const randomIndex = Math.floor(Math.random() * commentsPool.length);
                    if (!usedIndices.has(randomIndex)) {
                        usedIndices.add(randomIndex);
                        selectedComments.push(commentsPool[randomIndex]);
                    }
                }
                
                // 生成细分评分
                const beautyScore = Math.max(30, Math.min(100, score + Math.floor(Math.random() * 10) - 5));
                const temperamentScore = Math.max(30, Math.min(100, score + Math.floor(Math.random() * 12) - 6));
                const campusScore = Math.max(30, Math.min(100, score + Math.floor(Math.random() * 8) - 4));
                
                return {
                    id: Date.now() + Math.random(),
                    image: imageData,
                    score: score,
                    photoNumber: photoNumber,
                    studentInfo: studentInfo,
                    styleLabel: styleLabel,
                    comments: selectedComments,
                    beautyScore: beautyScore,
                    temperamentScore: temperamentScore,
                    campusScore: campusScore,
                    timestamp: new Date().toLocaleString()
                };
            }

            showLoading() {
                const beautyWall = document.getElementById('beautyWall');
                const loadingDiv = document.createElement('div');
                loadingDiv.className = 'loading';
                loadingDiv.id = 'loading';
                loadingDiv.innerHTML = `
                    <div class="spinner"></div>
                    <div>AI正在分析颜值中...</div>
                `;
                beautyWall.insertBefore(loadingDiv, beautyWall.firstChild);
            }

            hideLoading() {
                const loading = document.getElementById('loading');
                if (loading) {
                    loading.remove();
                }
            }

            renderBeautyWall() {
                const beautyWall = document.getElementById('beautyWall');
                
                // 清除加载状态
                const loading = document.getElementById('loading');
                if (loading) loading.remove();
                
                // 清除现有内容
                beautyWall.innerHTML = '';
                
                this.beautyData.forEach(item => {
                    const card = this.createBeautyCard(item);
                    beautyWall.appendChild(card);
                });
            }

            createBeautyCard(data) {
                const card = document.createElement('div');
                card.className = 'beauty-card';
                card.addEventListener('click', () => this.showDetail(data));
                
                // 显示第一条评语作为预览
                const previewComment = data.comments ? data.comments[0] : "点击查看更多评语...";
                
                card.innerHTML = `
                    <img src="${data.image}" alt="校园美女" class="card-image">
                    <div class="card-content">
                        <div class="score-section">
                            <div class="score">${data.score}</div>
                            <div class="tag">${data.styleLabel || data.tag}</div>
                        </div>
                        <div class="comment">${previewComment}</div>
                    </div>
                `;
                
                return card;
            }

            showDetail(data) {
                const modal = document.getElementById('detailModal');
                
                // 填充模态框内容
                document.getElementById('modalImage').src = data.image;
                document.getElementById('photoNumber').textContent = data.photoNumber || '#001';
                document.getElementById('studentInfo').textContent = data.studentInfo || '（某某，某某系）';
                document.getElementById('modalScore').textContent = data.score;
                document.getElementById('modalTag').textContent = data.styleLabel || data.tag;
                document.getElementById('modalTimestamp').textContent = `上传时间：${data.timestamp}`;
                
                // 填充细分评分
                document.getElementById('beautyScore').textContent = data.beautyScore || data.score;
                document.getElementById('temperamentScore').textContent = data.temperamentScore || (data.score + Math.floor(Math.random() * 10) - 5);
                document.getElementById('campusScore').textContent = data.campusScore || (data.score + Math.floor(Math.random() * 8) - 4);
                
                // 填充评语列表
                const commentsList = document.getElementById('commentsList');
                commentsList.innerHTML = '';
                
                const comments = data.comments || [data.comment || "暂无评语"];
                comments.forEach(comment => {
                    const commentDiv = document.createElement('div');
                    commentDiv.className = 'comment-item';
                    commentDiv.textContent = comment;
                    commentsList.appendChild(commentDiv);
                });
                
                // 显示模态框
                modal.classList.add('show');
                document.body.style.overflow = 'hidden';
            }

            closeModal() {
                const modal = document.getElementById('detailModal');
                modal.classList.remove('show');
                document.body.style.overflow = 'auto';
            }

            updateStats() {
                const totalCount = this.beautyData.length;
                const avgScore = totalCount > 0 ? 
                    Math.round(this.beautyData.reduce((sum, item) => sum + item.score, 0) / totalCount) : 0;
                const highestScore = totalCount > 0 ? 
                    Math.max(...this.beautyData.map(item => item.score)) : 0;

                document.getElementById('totalCount').textContent = totalCount;
                document.getElementById('avgScore').textContent = avgScore;
                document.getElementById('highestScore').textContent = highestScore;
            }

            saveData() {
                localStorage.setItem('campusBeautyData', JSON.stringify(this.beautyData));
                localStorage.setItem('photoCounter', this.photoCounter.toString());
            }
        }

        // 全局函数供HTML调用
        let beautyRater;

        function closeModal() {
            beautyRater.closeModal();
        }

        // 初始化应用
        document.addEventListener('DOMContentLoaded', () => {
            beautyRater = new CampusBeautyRater();
        });
    </script>
</body>
</html>
