        * {

            padding: 30px;
            margin: 40px 0;
            position: relative;
            overflow: hidden;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #6ecbf5, #e54086, #ffcb3c);

        h1 {

            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #6ecbf5, #e54086, #ffcb3c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            font-size: 1.1rem;
            color: #86868b;
            margin-bottom: 30px;
        }
        
        .tip-container {
            min-height: 220px;
            background: #f8f9fa;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            position: relative;
            transition: all 0.3s ease;
            border: 1px solid #e0e0e0;
        }
        
        .tip-type {
            display: inline-block;
            padding: 6px 12px;
            background: linear-gradient(90deg, #6ecbf5, #8a77f7);
            color: white;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 15px;
        }
        
        .tip-content {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #1d1d1f;
        }
        
        .btn {
            background: linear-gradient(90deg, #6ecbf5, #8a77f7);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            margin: 0 auto;
            width: 100%;
            max-width: 280px;
            box-shadow: 0 4px 14px rgba(110, 203, 245, 0.4);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(110, 203, 245, 0.5);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            color: #86868b;
            font-size: 0.9rem;
            line-height: 1.8;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
                margin: 20px 0;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .tip-content {
                font-size: 1.1rem;
            }
            
            .btn {
                padding: 12px 24px;
                font-size: 1rem;
            }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

        const tipTypeElement = document.getElementById('tipType');
        const tipContentElement = document.getElementById('tipContent');
        const randomTipBtn = document.getElementById('randomTipBtn');
        
        let currentTipIndex = -1;
        
        // 获取随机技巧
        function getRandomTip() {
            let newIndex;
            // 确保不重复连续显示相同的技巧
            do {
                newIndex = Math.floor(Math.random() * tipsDatabase.length);
            } while (newIndex === currentTipIndex && tipsDatabase.length > 1);
            
            currentTipIndex = newIndex;
            return tipsDatabase[currentTipIndex];
        }
        
        // 显示随机技巧
        function displayRandomTip() {
            const tip = getRandomTip();
            
            tipTypeElement.textContent = tip.type;
            tipContentElement.textContent = tip.content;
            
            // 添加动画效果
            const tipContainer = document.querySelector('.tip-container');
            tipContainer.classList.remove('fade-in');
            void tipContainer.offsetWidth; // 触发重排以重置动画
            tipContainer.classList.add('fade-in');
            
            // 更改按钮文本（如果不是第一次）
            if (randomTipBtn.textContent === '随机学个小技巧') {
                randomTipBtn.textContent = '换一个小技巧';
