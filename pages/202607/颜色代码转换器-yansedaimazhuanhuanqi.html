<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>颜色代码转换器</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 500px;
        }

        .instructions {
            margin-bottom: 2rem;
        }

        .instructions h2 {
            margin-bottom: 1rem;
        }

        .instructions ul {
            padding-left: 20px;
        }

        .instructions li {
            margin-bottom: 0.5rem;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        #reset-btn {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 4px;
            background-color: #dc3545;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1.5rem;
        }

        #reset-btn:hover {
            background-color: #c82333;
        }

        .color-preview {
            width: 100%;
            height: 100px;
            border-radius: 4px;
            background-color: #ffffff;
            border: 1px solid #ccc;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>颜色代码转换器</h1>
        <div class="instructions">
            <h2>使用说明</h2>
            <p>在下面任一输入框中输入颜色代码，页面将自动转换并显示其他格式的颜色代码以及颜色预览。</p>
            <ul>
                <li><b>HEX:</b> 输入十六进制颜色代码，例如: #FF5733</li>
                <li><b>RGB:</b> 输入 RGB 颜色代码，例如: rgb(255, 87, 51)</li>
                <li><b>HSL:</b> 输入 HSL 颜色代码，例如: hsl(12, 100%, 60%)</li>
            </ul>
        </div>
        <div class="converter">
            <div class="input-group">
                <label for="hex-input">HEX</label>
                <input type="text" id="hex-input" placeholder="#ffffff">
            </div>
            <div class="input-group">
                <label for="rgb-input">RGB</label>
                <input type="text" id="rgb-input" placeholder="rgb(255, 255, 255)">
            </div>
            <div class="input-group">
                <label for="hsl-input">HSL</label>
                <input type="text" id="hsl-input" placeholder="hsl(0, 0%, 100%)">
            </div>
            <div class="color-preview"></div>
            <button id="reset-btn">重置</button>
        </div>
    </div>
    <script>
        const hexInput = document.getElementById('hex-input');
        const rgbInput = document.getElementById('rgb-input');
        const hslInput = document.getElementById('hsl-input');
         const colorPreview = document.querySelector('.color-preview');
         const resetBtn = document.getElementById('reset-btn');
 
         function isValidHex(hex) {
             return /^#?([0-9A-F]{3}){1,2}$/i.test(hex);
         }

         function clamp(num, min, max) {
             return Math.min(Math.max(num, min), max);
         }

         // More tolerant RGB parser: accepts "rgb(255, 87, 51)", "255,87,51", "255 87 51"
         function parseRgb(str) {
             const m = str.match(/(\d{1,3})[^\d]+(\d{1,3})[^\d]+(\d{1,3})/i);
             if (!m) return null;
             const r = clamp(parseInt(m[1], 10), 0, 255);
             const g = clamp(parseInt(m[2], 10), 0, 255);
             const b = clamp(parseInt(m[3], 10), 0, 255);
             return { r, g, b };
         }

         // More tolerant HSL parser: accepts "hsl(12, 100%, 60%)", "12,100,60", "12 100 60", allows optional % for S/L
         function parseHsl(str) {
             const m = str.match(/(\d{1,3})[^\d]+(\d{1,3})%?[^\d]+(\d{1,3})%?/i);
             if (!m) return null;
             let h = parseInt(m[1], 10);
             let s = parseInt(m[2], 10);
             let l = parseInt(m[3], 10);
             h = ((h % 360) + 360) % 360; // normalize to [0,360)
             s = clamp(s, 0, 100);
             l = clamp(l, 0, 100);
             return { h, s, l };
         }

        function hexToRgb(hex) {
            let r = 0, g = 0, b = 0;
            if (hex.length === 4) {
                r = parseInt(hex[1] + hex[1], 16);
                g = parseInt(hex[2] + hex[2], 16);
                b = parseInt(hex[3] + hex[3], 16);
            } else if (hex.length === 7) {
                r = parseInt(hex.substring(1, 3), 16);
                g = parseInt(hex.substring(3, 5), 16);
                b = parseInt(hex.substring(5, 7), 16);
            }
            return { r, g, b };
        }

        function rgbToHex(r, g, b) {
            return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
        }

        function rgbToHsl(r, g, b) {
            r /= 255, g /= 255, b /= 255;
            let max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;

            if (max === min) {
                h = s = 0; // achromatic
            } else {
                let d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }

            return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
        }

        function hslToRgb(h, s, l) {
            s /= 100;
            l /= 100;
            let c = (1 - Math.abs(2 * l - 1)) * s,
                x = c * (1 - Math.abs((h / 60) % 2 - 1)),
                m = l - c/2,
                r = 0,
                g = 0,
                b = 0;

            if (0 <= h && h < 60) {
                r = c; g = x; b = 0;
            } else if (60 <= h && h < 120) {
                r = x; g = c; b = 0;
            } else if (120 <= h && h < 180) {
                r = 0; g = c; b = x;
            } else if (180 <= h && h < 240) {
                r = 0; g = x; b = c;
            } else if (240 <= h && h < 300) {
                r = x; g = 0; b = c;
            } else if (300 <= h && h < 360) {
                r = c; g = 0; b = x;
            }
            r = Math.round((r + m) * 255);
            g = Math.round((g + m) * 255);
            b = Math.round((b + m) * 255);

            return { r, g, b };
        }

        function updateColor(source) {
            let hex, rgb, hsl;

            if (source === 'hex') {
                hex = hexInput.value;
                if (isValidHex(hex)) {
                    if (hex.charAt(0) !== '#') {
                        hex = '#' + hex;
                    }
                    rgb = hexToRgb(hex);
                    hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
                    rgbInput.value = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
                    hslInput.value = `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`;
                    colorPreview.style.backgroundColor = hex;
                }
            } else if (source === 'rgb') {
                const rgbVals = parseRgb(rgbInput.value);
                if (rgbVals) {
                    const { r, g, b } = rgbVals;
                    hex = rgbToHex(r, g, b);
                    hsl = rgbToHsl(r, g, b);
                    hexInput.value = hex;
                    hslInput.value = `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`;
                    colorPreview.style.backgroundColor = hex;
                }
            } else if (source === 'hsl') {
                const hslVals = parseHsl(hslInput.value);
                if (hslVals) {
                    const { h, s, l } = hslVals;
                    rgb = hslToRgb(h, s, l);
                    hex = rgbToHex(rgb.r, rgb.g, rgb.b);
                    hexInput.value = hex;
                    rgbInput.value = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
                    colorPreview.style.backgroundColor = hex;
                }
            }
        }

        hexInput.addEventListener('input', () => updateColor('hex'));
        rgbInput.addEventListener('input', () => updateColor('rgb'));
        hslInput.addEventListener('input', () => updateColor('hsl'));

        resetBtn.addEventListener('click', () => {
            hexInput.value = '';
            rgbInput.value = '';
            hslInput.value = '';
            colorPreview.style.backgroundColor = '#ffffff';
        });
    </script>
</body>
</html>
