<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>离线背景移除工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #fff;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 30px 0;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .features {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin: 20px 0 30px;
        }
        
        .feature {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
        }
        
        .feature i {
            margin-right: 8px;
            font-size: 1.1rem;
        }
        
        .app-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            margin-bottom: 40px;
        }
        
        .upload-section {
            flex: 1;
            min-width: 300px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }
        
        .preview-section {
            flex: 1;
            min-width: 300px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
        }
        
        .section-title {
            font-size: 1.4rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        
        .section-title i {
            margin-right: 10px;
            font-size: 1.6rem;
        }
        
        .upload-area {
            border: 3px dashed rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        
        .upload-area:hover {
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.05);
        }
        
        .upload-area i {
            font-size: 3.5rem;
            margin-bottom: 15px;
            opacity: 0.8;
        }
        
        .upload-text {
            font-size: 1.1rem;
            margin-bottom: 15px;
        }
        
        .upload-hint {
            font-size: 0.9rem;
            opacity: 0.7;
        }
        
        .file-input {
            display: none;
        }
        
        .btn {
            background: linear-gradient(90deg, #ff8a00, #ff0058);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(255, 0, 88, 0.3);
        }
        
        .btn i {
            margin-right: 8px;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 20px rgba(255, 0, 88, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-remove {
            background: linear-gradient(90deg, #00c9ff, #0072ff);
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.3);
            margin-bottom: 20px;
        }
        
        .btn-remove:hover {
            box-shadow: 0 7px 20px rgba(0, 114, 255, 0.4);
        }
        
        .btn-download {
            background: linear-gradient(90deg, #00b09b, #96c93d);
            box-shadow: 0 4px 15px rgba(0, 176, 155, 0.3);
        }
        
        .btn-download:hover {
            box-shadow: 0 7px 20px rgba(0, 176, 155, 0.4);
        }
        
        .preview-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex-grow: 1;
        }
        
        .preview-box {
            flex: 1;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            background: 
                linear-gradient(45deg, #222 25%, transparent 25%), 
                linear-gradient(-45deg, #222 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #222 75%),
                linear-gradient(-45deg, transparent 75%, #222 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        
        .preview-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }
        
        .preview-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            padding: 20px;
        }
        
        .preview-placeholder i {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        
        .slider-container {
            margin-bottom: 20px;
        }
        
        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .slider {
            width: 100%;
            height: 10px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            -webkit-appearance: none;
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ff0058;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        
        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
            opacity: 0.8;
            margin-top: auto;
        }
        
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>离线背景移除工具</h1>
            <p class="subtitle">无需网络连接，直接在浏览器中移除图片背景。完全免费，100%离线运行！</p>
            
            <div class="features">
                <div class="feature">
                    <i class="fas fa-wifi-slash"></i>
                    <span>无需网络</span>
                </div>
                <div class="feature">
                    <i class="fas fa-mobile-alt"></i>
                    <span>手机支持</span>
                </div>
                <div class="feature">
                    <i class="fas fa-lock"></i>
                    <span>隐私保护</span>
                </div>
                <div class="feature">
                    <i class="fas fa-bolt"></i>
                    <span>快速处理</span>
                </div>
                <div class="feature">
                    <i class="fas fa-download"></i>
                    <span>一键下载</span>
                </div>
            </div>
        </header>
        
        <div class="app-container">
            <div class="upload-section">
                <h2 class="section-title"><i class="fas fa-cloud-upload-alt"></i>上传图片</h2>
                
                <div class="upload-area" id="dropZone">
                    <i class="fas fa-file-image"></i>
                    <p class="upload-text">拖放图片到此处或点击上传</p>
                    <p class="upload-hint">支持 JPG, PNG 格式 (最大 5MB)</p>
                </div>
                
                <input type="file" id="fileInput" class="file-input" accept="image/*">
                
                <div class="slider-container">
                    <div class="slider-label">
                        <span>背景移除强度</span>
                        <span id="thresholdValue">5</span>
                    </div>
                    <input type="range" min="1" max="10" value="5" class="slider" id="thresholdSlider">
                </div>
                
                <div class="slider-container">
                    <div class="slider-label">
                        <span>边缘平滑度</span>
                        <span id="smoothValue">3</span>
                    </div>
                    <input type="range" min="1" max="10" value="3" class="slider" id="smoothSlider">
                </div>
                
                <button class="btn btn-remove" id="removeBgBtn">
                    <i class="fas fa-magic"></i>移除背景
                </button>
            </div>
            
            <div class="preview-section">
                <h2 class="section-title"><i class="fas fa-image"></i>预览结果</h2>
                
                <div class="preview-container">
                    <div class="preview-box">
                        <img id="originalImage" alt="原始图片">
                        <div class="preview-placeholder" id="originalPlaceholder">
                            <i class="fas fa-image"></i>
                            <p>原始图片预览</p>
                        </div>
                    </div>
                    
                    <div class="preview-box">
                        <img id="resultImage" alt="处理结果">
                        <div class="preview-placeholder" id="resultPlaceholder">
                            <i class="fas fa-cogs"></i>
                            <p>处理结果预览</p>
                        </div>
                    </div>
                </div>
                
                <div class="controls">
                    <button class="btn btn-download" id="downloadBtn" disabled>
                        <i class="fas fa-download"></i>下载结果
                    </button>
                </div>
            </div>
        </div>
        
        <footer>
            <p>© 2023 离线背景移除工具 | 完全在浏览器中运行，不传输任何数据到服务器</p>
        </footer>
    </div>

    <script>
        // DOM元素引用
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const originalImage = document.getElementById('originalImage');
        const resultImage = document.getElementById('resultImage');
        const originalPlaceholder = document.getElementById('originalPlaceholder');
        const resultPlaceholder = document.getElementById('resultPlaceholder');
        const removeBgBtn = document.getElementById('removeBgBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const thresholdSlider = document.getElementById('thresholdSlider');
        const smoothSlider = document.getElementById('smoothSlider');
        const thresholdValue = document.getElementById('thresholdValue');
        const smoothValue = document.getElementById('smoothValue');
        
        // 当前处理的图像
        let currentImage = null;
        
        // 事件监听器设置
        dropZone.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', handleFileSelect);
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#ff0058';
        });
        
        dropZone.addEventListener('dragleave', () => {
            dropZone.style.borderColor = 'rgba(255, 255, 255, 0.3)';
        });
        
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'rgba(255, 255, 255, 0.3)';
            
            if (e.dataTransfer.files.length) {
                handleFiles(e.dataTransfer.files);
            }
        });
        
        removeBgBtn.addEventListener('click', processImage);
        downloadBtn.addEventListener('click', downloadResult);
        
        thresholdSlider.addEventListener('input', () => {
            thresholdValue.textContent = thresholdSlider.value;
        });
        
        smoothSlider.addEventListener('input', () => {
            smoothValue.textContent = smoothSlider.value;
        });
        
        // 文件处理函数
        function handleFileSelect(e) {
            handleFiles(e.target.files);
        }
        
        function handleFiles(files) {
            if (files.length === 0) return;
            
            const file = files[0];
            if (!file.type.match('image.*')) {
                alert('请上传图片文件！');
                return;
            }
            
            if (file.size > 5 * 1024 * 1024) {
                alert('文件大小不能超过5MB！');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                originalImage.src = e.target.result;
                originalImage.onload = function() {
                    originalPlaceholder.style.display = 'none';
                    originalImage.style.display = 'block';
                    
                    // 重置结果区域
                    resultImage.style.display = 'none';
                    resultPlaceholder.style.display = 'flex';
                    downloadBtn.disabled = true;
                    
                    currentImage = originalImage;
                };
            };
            reader.readAsDataURL(file);
        }
        
        // 图像处理函数
        function processImage() {
            if (!currentImage) {
                alert('请先上传图片！');
                return;
            }
            
            // 显示加载状态
            resultPlaceholder.innerHTML = '<i class="fas fa-spinner fa-spin"></i><p>处理中，请稍候...</p>';
            
            // 使用setTimeout让UI有机会更新
            setTimeout(() => {
                try {
                    // 创建Canvas
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // 设置Canvas尺寸
                    canvas.width = currentImage.naturalWidth;
                    canvas.height = currentImage.naturalHeight;
                    
                    // 绘制图像
                    ctx.drawImage(currentImage, 0, 0);
                    
                    // 获取图像数据
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;
                    
                    // 获取阈值参数
                    const threshold = parseInt(thresholdSlider.value) * 10;
                    const smoothness = parseInt(smoothSlider.value);
                    
                    // 创建临时Canvas用于边缘检测
                    const tempCanvas = document.createElement('canvas');
                    const tempCtx = tempCanvas.getContext('2d');
                    tempCanvas.width = canvas.width;
                    tempCanvas.height = canvas.height;
                    tempCtx.putImageData(imageData, 0, 0);
                    
                    // 应用简单高斯模糊进行平滑处理
                    for (let i = 0; i < smoothness; i++) {
                        const blurred = applyBlur(tempCtx, tempCanvas);
                        tempCtx.putImageData(blurred, 0, 0);
                    }
                    
                    const blurredData = tempCtx.getImageData(0, 0, canvas.width, canvas.height).data;
                    
                    // 移除背景
                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        
                        // 计算亮度
                        const brightness = (r + g + b) / 3;
                        
                        // 计算模糊后的颜色差异
                        const br = blurredData[i];
                        const bg = blurredData[i + 1];
                        const bb = blurredData[i + 2];
                        const colorDiff = Math.abs(r - br) + Math.abs(g - bg) + Math.abs(b - bb);
                        
                        // 判断是否为背景
                        if (brightness > threshold && colorDiff < 50) {
                            // 设置为透明
                            data[i + 3] = 0;
                        } else if (brightness > threshold - 30) {
                            // 半透明边缘
                            data[i + 3] = 150;
                        }
                    }
                    
                    // 放回处理后的图像数据
                    ctx.putImageData(imageData, 0, 0);
                    
                    // 显示结果
                    resultImage.src = canvas.toDataURL('image/png');
                    resultImage.style.display = 'block';
                    resultPlaceholder.style.display = 'none';
                    downloadBtn.disabled = false;
                    
                } catch (error) {
                    console.error('图像处理错误:', error);
                    resultPlaceholder.innerHTML = '<i class="fas fa-exclamation-triangle"></i><p>处理失败，请重试</p>';
                }
            }, 100);
        }
        
        // 应用简单模糊效果
        function applyBlur(ctx, canvas) {
            const width = canvas.width;
            const height = canvas.height;
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            const output = new ImageData(width, height);
            const outputData = output.data;
            
            // 简单均值模糊
            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    const idx = (y * width + x) * 4;
                    
                    let r = 0, g = 0, b = 0;
                    for (let ky = -1; ky <= 1; ky++) {
                        for (let kx = -1; kx <= 1; kx++) {
                            const kidx = ((y + ky) * width + (x + kx)) * 4;
                            r += data[kidx];
                            g += data[kidx + 1];
                            b += data[kidx + 2];
                        }
                    }
                    
                    outputData[idx] = r / 9;
                    outputData[idx + 1] = g / 9;
                    outputData[idx + 2] = b / 9;
                    outputData[idx + 3] = data[idx + 3];
                }
            }
            
            return output;
        }
        
        // 下载结果
        function downloadResult() {
            if (!resultImage.src) return;
            
            const link = document.createElement('a');
            link.download = 'background-removed.png';
            link.href = resultImage.src;
            link.click();
        }
    </script>
</body>
</html>
