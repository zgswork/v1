<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><title>日期计算器</title>
<style>
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f7f7f7;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .container {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 32px 24px;
    margin-top: 48px;
    max-width: 420px;
    width: 100%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h2 {
    margin-bottom: 24px;
    font-size: 1.7rem;
    color: #333;
    text-align: center;
  }
  .section {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    padding: 24px 18px;
    margin-bottom: 24px;
    width: 100%;
    max-width: 340px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }
  .section h3 {
    margin-bottom: 16px;
    font-size: 1.15rem;
    color: #222;
    text-align: left;
  }
  label {
    font-size: 1rem;
    color: #444;
    margin-bottom: 6px;
    display: block;
  }
  input[type="date"], input[type="number"] {
    width: 100%;
    padding: 8px 10px;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 6px;
    margin-bottom: 10px;
    box-sizing: border-box;
  }
  .result {
    font-size: 1.1rem;
    color: #1976d2;
    margin-top: 4px;
    min-height: 24px;
  }
  footer {
    margin-top: 48px;
    text-align: center;
    font-size: 14px;
    line-height: 1.7;
    color: #666;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  footer div {
    margin-bottom: 4px;
  }
  @media (min-width: 900px) {
    .container {
      margin-top: 80px;
      max-width: 520px;
      padding: 40px 32px;
    }
    .section {
      max-width: 420px;
      padding: 32px 24px;
    }
    h2 {
      font-size: 2.1rem;
    }
    footer {
      font-size: 15px;
    }
  }
</style>
</head>
<body>
<div class="container">
  <h2>日期计算器</h2>
  <div class="section">
    <h3>计算日期差（相差几天）</h3>
    <label for="date1">起始日期：</label>
    <input type="date" id="date1">
    <label for="date2">结束日期：</label>
    <input type="date" id="date2">
    <div id="result-diff" class="result"></div>
  </div>
  <div class="section">
    <h3>计算日期（起始日期+间隔天数）</h3>
    <label for="start-date">起始日期：</label>
    <input type="date" id="start-date">
    <label for="days">间隔天数：</label>
    <input type="number" id="days" min="0" value="0">
    <div id="result-date" class="result"></div>
  </div>
</div>
<footer style="margin:24px auto 0 auto;max-width:420px;text-align:center;font-size:14px;color:#444;line-height:1.7;">
  <div style="margin-bottom:4px;">
    获取本工具（<a href="https://pan.quark.cn/s/45a094265239" target="_blank" style="color:#1976d2;text-decoration:underline;">点这领取</a>）
  </div>
  <div style="margin-bottom:4px;">
    更多工具请关注公众号：<span style="color:#d32f2f;font-weight:bold;">老陈的AI编程实验室</span>
  </div>
  <div style="margin-bottom:4px;white-space:nowrap;">
    如有任何建议或问题，请联系微信：<span style="color:#388e3c;font-weight:bold;">chenlin241214</span>（添加请备注AI老陈）
  </div>
  <div>
    我正在「AI编程·垂直小流量复利商业化」，你⼀起来吧？<a href="https://t.zsxq.com/teUBo" target="_blank" style="color:#1976d2;text-decoration:underline;">点此加入</a>
  </div>
</footer>
<script>
function calcDiff(){
  var d1=document.getElementById('date1').value;
  var d2=document.getElementById('date2').value;
  if(!d1||!d2){
    document.getElementById('result-diff').innerText='请填写完整日期';
    return;
  }
  var date1=new Date(d1);
  var date2=new Date(d2);
  var diff=Math.abs(date2-date1);
  var days=Math.floor(diff/(1000*60*60*24));
  document.getElementById('result-diff').innerText='相差 '+days+' 天';
}
function calcDate(){
  var start=document.getElementById('start-date').value;
  var days=parseInt(document.getElementById('days').value,10);
  if(!start||isNaN(days)){
    document.getElementById('result-date').innerText='请填写起始日期和间隔天数';
    return;
  }
  var startDate=new Date(start);
  startDate.setDate(startDate.getDate()+days);
  var yyyy=startDate.getFullYear();
  var mm=(startDate.getMonth()+1).toString().padStart(2,'0');
  var dd=startDate.getDate().toString().padStart(2,'0');
  document.getElementById('result-date').innerText='结果日期：'+yyyy+'-'+mm+'-'+dd;
}
document.getElementById('date1').addEventListener('input',calcDiff);
document.getElementById('date2').addEventListener('input',calcDiff);
document.getElementById('start-date').addEventListener('input',calcDate);
document.getElementById('days').addEventListener('input',calcDate);
</script>
</body>
</html>
