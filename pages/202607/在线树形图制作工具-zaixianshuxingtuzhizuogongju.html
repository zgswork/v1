<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线树形图制作工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            height: calc(100vh - 200px);
        }

        .sidebar {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow-y: auto;
        }

        .canvas-area {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .section-title {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 8px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #555;
        }

        .control-group input,
        .control-group select,
        .control-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .control-group input:focus,
        .control-group select:focus,
        .control-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #333;
            border: 2px solid #e0e0e0;
        }

        .btn-secondary:hover {
            background: #e9ecef;
        }

        .btn-success {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #dc3545 0%, #e83e8c 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.3);
        }

        .color-input {
            width: 50px !important;
            height: 40px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .range-input {
            width: 100%;
        }

        .template-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .template-item {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 12px;
        }

        .template-item:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .toolbar {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .toolbar-left,
        .toolbar-right {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .zoom-btn {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            background: #f8f9fa;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .zoom-btn:hover {
            background: #e9ecef;
        }

        .zoom-level {
            min-width: 60px;
            text-align: center;
            font-weight: 500;
        }

        #treeCanvas {
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        #treeCanvas:active {
            cursor: grabbing;
        }

        .node {
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .node:hover {
            filter: brightness(1.1);
        }

        .node-rect {
            fill: #667eea;
            stroke: #4c63d2;
            stroke-width: 2;
            rx: 8;
            ry: 8;
        }

        .node-text {
            fill: white;
            font-family: 'Segoe UI', sans-serif;
            font-size: 14px;
            font-weight: 500;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
        }

        .link {
            fill: none;
            stroke: #999;
            stroke-width: 2;
            stroke-opacity: 0.8;
        }

        .selected {
            filter: drop-shadow(0 0 10px rgba(102, 126, 234, 0.5));
        }

        .context-menu {
            position: absolute;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            padding: 5px 0;
            z-index: 1000;
            display: none;
        }

        .context-menu-item {
            padding: 8px 15px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .context-menu-item:hover {
            background: #f0f4ff;
        }

        .node-editor {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            z-index: 1000;
            display: none;
            min-width: 300px;
        }

        .node-editor h3 {
            margin-bottom: 20px;
            color: #333;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
            }
            
            .sidebar {
                height: auto;
                max-height: 300px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .toolbar {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌳 在线树形图制作工具</h1>
            <p>专业的组织架构图、思维导图制作工具，支持拖拽编辑和多种导出格式</p>
        </div>
        
        <div class="main-content">
            <div class="sidebar">
                <div class="section-title">📝 节点编辑</div>
                <div class="control-group">
                    <label>节点文本</label>
                    <input type="text" id="nodeText" placeholder="输入节点文本">
                </div>
                <div class="control-group">
                    <button class="btn btn-primary" onclick="addNode()">➕ 添加子节点</button>
                    <button class="btn btn-secondary" onclick="editNode()">✏️ 编辑节点</button>
                    <button class="btn btn-danger" onclick="deleteNode()">🗑️ 删除节点</button>
                </div>
                
                <div class="section-title">🎨 样式设置</div>
                <div class="control-group">
                    <label>节点颜色</label>
                    <input type="color" id="nodeColor" class="color-input" value="#667eea">
                </div>
                <div class="control-group">
                    <label>文字颜色</label>
                    <input type="color" id="textColor" class="color-input" value="#ffffff">
                </div>
                <div class="control-group">
                    <label>连线颜色</label>
                    <input type="color" id="linkColor" class="color-input" value="#999999">
                </div>
                <div class="control-group">
                    <label>字体大小</label>
                    <input type="range" id="fontSize" class="range-input" min="10" max="24" value="14">
                    <span id="fontSizeValue">14px</span>
                </div>
                <div class="control-group">
                    <label>节点间距</label>
                    <input type="range" id="nodeSpacing" class="range-input" min="50" max="200" value="100">
                    <span id="nodeSpacingValue">100px</span>
                </div>
                
                <div class="section-title">📋 预设模板</div>
                <div class="template-grid">
                    <div class="template-item" onclick="loadTemplate('company')">
                        🏢 公司架构
                    </div>
                    <div class="template-item" onclick="loadTemplate('family')">
                        👨‍👩‍👧‍👦 家族树
                    </div>
                    <div class="template-item" onclick="loadTemplate('project')">
                        📊 项目结构
                    </div>
                    <div class="template-item" onclick="loadTemplate('mind')">
                        🧠 思维导图
                    </div>
                </div>
                
                <div class="section-title">💾 文件操作</div>
                <div class="control-group">
                    <button class="btn btn-success" onclick="exportSVG()">📄 导出SVG</button>
                    <button class="btn btn-success" onclick="exportPNG()">🖼️ 导出PNG</button>
                </div>
                <div class="control-group">
                    <button class="btn btn-secondary" onclick="saveData()">💾 保存数据</button>
                    <input type="file" id="loadFile" accept=".json" style="display: none;" onchange="loadData(event)">
                    <button class="btn btn-secondary" onclick="document.getElementById('loadFile').click()">📂 加载数据</button>
                </div>
                <div class="control-group">
                    <button class="btn btn-danger" onclick="clearAll()">🗑️ 清空画布</button>
                </div>
            </div>
            
            <div class="canvas-area">
                <div class="toolbar">
                    <div class="toolbar-left">
                        <button class="btn btn-secondary" onclick="undo()">↶ 撤销</button>
                        <button class="btn btn-secondary" onclick="redo()">↷ 重做</button>
                        <button class="btn btn-secondary" onclick="centerView()">🎯 居中</button>
                    </div>
                    <div class="toolbar-right">
                        <div class="zoom-controls">
                            <button class="zoom-btn" onclick="zoomOut()">-</button>
                            <span class="zoom-level" id="zoomLevel">100%</span>
                            <button class="zoom-btn" onclick="zoomIn()">+</button>
                        </div>
                    </div>
                </div>
                <svg id="treeCanvas"></svg>
            </div>
        </div>
    </div>
    
    <!-- 右键菜单 -->
    <div class="context-menu" id="contextMenu">
        <div class="context-menu-item" onclick="addChildNode()">➕ 添加子节点</div>
        <div class="context-menu-item" onclick="editSelectedNode()">✏️ 编辑节点</div>
        <div class="context-menu-item" onclick="deleteSelectedNode()">🗑️ 删除节点</div>
        <div class="context-menu-item" onclick="changeNodeColor()">🎨 更改颜色</div>
    </div>
    
    <!-- 节点编辑器 -->
    <div class="overlay" id="overlay" onclick="closeNodeEditor()"></div>
    <div class="node-editor" id="nodeEditor">
        <h3>编辑节点</h3>
        <div class="control-group">
            <label>节点文本</label>
            <input type="text" id="editNodeText">
        </div>
        <div class="control-group">
            <label>节点颜色</label>
            <input type="color" id="editNodeColor" class="color-input">
        </div>
        <div class="control-group">
            <button class="btn btn-primary" onclick="saveNodeEdit()">保存</button>
            <button class="btn btn-secondary" onclick="closeNodeEditor()">取消</button>
        </div>
    </div>

    <script>
        class TreeDiagram {
            constructor() {
                this.svg = document.getElementById('treeCanvas');
                this.width = 0;
                this.height = 0;
                this.zoom = 1;
                this.panX = 0;
                this.panY = 0;
                this.selectedNode = null;
                this.nodeIdCounter = 1;
                this.history = [];
                this.historyIndex = -1;
                
                this.data = {
                    id: 'root',
                    text: '根节点',
                    color: '#667eea',
                    textColor: '#ffffff',
                    children: []
                };
                
                this.initSVG();
                this.bindEvents();
                this.render();
                this.saveState();
            }
            
            initSVG() {
                this.updateSize();
                
                // 创建定义区域
                const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
                this.svg.appendChild(defs);
                
                // 创建主容器组
                this.container = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                this.svg.appendChild(this.container);
                
                // 创建连线组和节点组
                this.linksGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                this.nodesGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                this.container.appendChild(this.linksGroup);
                this.container.appendChild(this.nodesGroup);
            }
            
            updateSize() {
                const rect = this.svg.getBoundingClientRect();
                this.width = rect.width;
                this.height = rect.height;
                this.svg.setAttribute('viewBox', `0 0 ${this.width} ${this.height}`);
            }
            
            bindEvents() {
                // 窗口大小变化
                window.addEventListener('resize', () => {
                    this.updateSize();
                    this.render();
                });
                
                // 鼠标事件
                let isDragging = false;
                let lastX, lastY;
                
                this.svg.addEventListener('mousedown', (e) => {
                    if (e.target === this.svg || e.target === this.container) {
                        isDragging = true;
                        lastX = e.clientX;
                        lastY = e.clientY;
                        this.svg.style.cursor = 'grabbing';
                    }
                });
                
                this.svg.addEventListener('mousemove', (e) => {
                    if (isDragging) {
                        const deltaX = e.clientX - lastX;
                        const deltaY = e.clientY - lastY;
                        this.panX += deltaX;
                        this.panY += deltaY;
                        this.updateTransform();
                        lastX = e.clientX;
                        lastY = e.clientY;
                    }
                });
                
                this.svg.addEventListener('mouseup', () => {
                    isDragging = false;
                    this.svg.style.cursor = 'grab';
                });
                
                // 滚轮缩放
                this.svg.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const delta = e.deltaY > 0 ? 0.9 : 1.1;
                    this.zoom *= delta;
                    this.zoom = Math.max(0.1, Math.min(3, this.zoom));
                    this.updateTransform();
                    this.updateZoomDisplay();
                });
                
                // 右键菜单
                this.svg.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    if (e.target.closest('.node')) {
                        this.showContextMenu(e.clientX, e.clientY);
                    }
                });
                
                // 点击空白处隐藏菜单
                document.addEventListener('click', () => {
                    this.hideContextMenu();
                });
                
                // 控件事件
                document.getElementById('fontSize').addEventListener('input', (e) => {
                    document.getElementById('fontSizeValue').textContent = e.target.value + 'px';
                    this.render();
                });
                
                document.getElementById('nodeSpacing').addEventListener('input', (e) => {
                    document.getElementById('nodeSpacingValue').textContent = e.target.value + 'px';
                    this.render();
                });
            }
            
            updateTransform() {
                this.container.setAttribute('transform', 
                    `translate(${this.panX}, ${this.panY}) scale(${this.zoom})`);
            }
            
            updateZoomDisplay() {
                document.getElementById('zoomLevel').textContent = Math.round(this.zoom * 100) + '%';
            }
            
            calculateLayout(node, x = this.width / 2, y = 100, level = 0) {
                const spacing = parseInt(document.getElementById('nodeSpacing').value);
                node.x = x;
                node.y = y;
                
                if (node.children && node.children.length > 0) {
                    const totalWidth = (node.children.length - 1) * spacing;
                    const startX = x - totalWidth / 2;
                    
                    node.children.forEach((child, i) => {
                        const childX = startX + i * spacing;
                        const childY = y + 120;
                        this.calculateLayout(child, childX, childY, level + 1);
                    });
                }
            }
            
            render() {
                // 清空现有内容
                this.linksGroup.innerHTML = '';
                this.nodesGroup.innerHTML = '';
                
                // 计算布局
                this.calculateLayout(this.data);
                
                // 渲染连线
                this.renderLinks(this.data);
                
                // 渲染节点
                this.renderNodes(this.data);
            }
            
            renderLinks(node) {
                if (node.children) {
                    node.children.forEach(child => {
                        const link = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        const linkColor = document.getElementById('linkColor').value;
                        
                        const d = `M ${node.x} ${node.y + 25} 
                                  C ${node.x} ${node.y + 70} 
                                    ${child.x} ${child.y - 45} 
                                    ${child.x} ${child.y - 25}`;
                        
                        link.setAttribute('d', d);
                        link.setAttribute('class', 'link');
                        link.setAttribute('stroke', linkColor);
                        
                        this.linksGroup.appendChild(link);
                        
                        // 递归渲染子节点的连线
                        this.renderLinks(child);
                    });
                }
            }
            
            renderNodes(node) {
                const nodeGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                nodeGroup.setAttribute('class', 'node');
                nodeGroup.setAttribute('data-id', node.id);
                
                // 节点矩形
                const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                const textWidth = Math.max(80, node.text.length * 8 + 20);
                
                rect.setAttribute('x', node.x - textWidth / 2);
                rect.setAttribute('y', node.y - 25);
                rect.setAttribute('width', textWidth);
                rect.setAttribute('height', 50);
                rect.setAttribute('class', 'node-rect');
                rect.setAttribute('fill', node.color || '#667eea');
                
                // 节点文本
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', node.x);
                text.setAttribute('y', node.y);
                text.setAttribute('class', 'node-text');
                text.setAttribute('fill', node.textColor || '#ffffff');
                text.setAttribute('font-size', document.getElementById('fontSize').value);
                text.textContent = node.text;
                
                nodeGroup.appendChild(rect);
                nodeGroup.appendChild(text);
                
                // 添加点击事件
                nodeGroup.addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.selectNode(node);
                });
                
                nodeGroup.addEventListener('dblclick', (e) => {
                    e.stopPropagation();
                    this.openNodeEditor(node);
                });
                
                this.nodesGroup.appendChild(nodeGroup);
                
                // 递归渲染子节点
                if (node.children) {
                    node.children.forEach(child => {
                        this.renderNodes(child);
                    });
                }
            }
            
            selectNode(node) {
                // 清除之前的选择
                document.querySelectorAll('.node').forEach(n => {
                    n.classList.remove('selected');
                });
                
                // 选择当前节点
                const nodeElement = document.querySelector(`[data-id="${node.id}"]`);
                if (nodeElement) {
                    nodeElement.classList.add('selected');
                }
                
                this.selectedNode = node;
                
                // 更新侧边栏
                document.getElementById('nodeText').value = node.text;
                document.getElementById('nodeColor').value = node.color || '#667eea';
                document.getElementById('textColor').value = node.textColor || '#ffffff';
            }
            
            findNode(data, id) {
                if (data.id === id) return data;
                if (data.children) {
                    for (let child of data.children) {
                        const found = this.findNode(child, id);
                        if (found) return found;
                    }
                }
                return null;
            }
            
            addChildNode(parentNode = null) {
                const parent = parentNode || this.selectedNode || this.data;
                const text = document.getElementById('nodeText').value || '新节点';
                
                const newNode = {
                    id: 'node_' + this.nodeIdCounter++,
                    text: text,
                    color: document.getElementById('nodeColor').value,
                    textColor: document.getElementById('textColor').value,
                    children: []
                };
                
                if (!parent.children) {
                    parent.children = [];
                }
                
                parent.children.push(newNode);
                this.saveState();
                this.render();
                
                // 清空输入框
                document.getElementById('nodeText').value = '';
            }
            
            editSelectedNode() {
                if (this.selectedNode) {
                    this.openNodeEditor(this.selectedNode);
                }
            }
            
            deleteSelectedNode() {
                if (this.selectedNode && this.selectedNode.id !== 'root') {
                    this.deleteNodeById(this.data, this.selectedNode.id);
                    this.selectedNode = null;
                    this.saveState();
                    this.render();
                }
            }
            
            deleteNodeById(parent, targetId) {
                if (parent.children) {
                    parent.children = parent.children.filter(child => {
                        if (child.id === targetId) {
                            return false;
                        }
                        this.deleteNodeById(child, targetId);
                        return true;
                    });
                }
            }
            
            openNodeEditor(node) {
                document.getElementById('editNodeText').value = node.text;
                document.getElementById('editNodeColor').value = node.color || '#667eea';
                document.getElementById('overlay').style.display = 'block';
                document.getElementById('nodeEditor').style.display = 'block';
                this.editingNode = node;
            }
            
            closeNodeEditor() {
                document.getElementById('overlay').style.display = 'none';
                document.getElementById('nodeEditor').style.display = 'none';
                this.editingNode = null;
            }
            
            saveNodeEdit() {
                if (this.editingNode) {
                    this.editingNode.text = document.getElementById('editNodeText').value;
                    this.editingNode.color = document.getElementById('editNodeColor').value;
                    this.saveState();
                    this.render();
                    this.closeNodeEditor();
                }
            }
            
            showContextMenu(x, y) {
                const menu = document.getElementById('contextMenu');
                menu.style.display = 'block';
                menu.style.left = x + 'px';
                menu.style.top = y + 'px';
            }
            
            hideContextMenu() {
                document.getElementById('contextMenu').style.display = 'none';
            }
            
            saveState() {
                this.history = this.history.slice(0, this.historyIndex + 1);
                this.history.push(JSON.parse(JSON.stringify(this.data)));
                this.historyIndex++;
                
                // 限制历史记录数量
                if (this.history.length > 50) {
                    this.history.shift();
                    this.historyIndex--;
                }
            }
            
            undo() {
                if (this.historyIndex > 0) {
                    this.historyIndex--;
                    this.data = JSON.parse(JSON.stringify(this.history[this.historyIndex]));
                    this.render();
                }
            }
            
            redo() {
                if (this.historyIndex < this.history.length - 1) {
                    this.historyIndex++;
                    this.data = JSON.parse(JSON.stringify(this.history[this.historyIndex]));
                    this.render();
                }
            }
            
            centerView() {
                this.panX = 0;
                this.panY = 0;
                this.zoom = 1;
                this.updateTransform();
                this.updateZoomDisplay();
            }
            
            zoomIn() {
                this.zoom = Math.min(3, this.zoom * 1.2);
                this.updateTransform();
                this.updateZoomDisplay();
            }
            
            zoomOut() {
                this.zoom = Math.max(0.1, this.zoom / 1.2);
                this.updateTransform();
                this.updateZoomDisplay();
            }

            exportSVG() {
                const svgData = this.svg.outerHTML;
                const blob = new Blob([svgData], { type: 'image/svg+xml' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = 'tree-diagram.svg';
                a.click();
                
                URL.revokeObjectURL(url);
            }
            
            exportPNG() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const svgData = this.svg.outerHTML;
                
                const img = new Image();
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.fillStyle = 'white';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                    
                    canvas.toBlob((blob) => {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = 'tree-diagram.png';
                        a.click();
                        URL.revokeObjectURL(url);
                    });
                };
                
                const svgBlob = new Blob([svgData], { type: 'image/svg+xml' });
                img.src = URL.createObjectURL(svgBlob);
            }
            
            saveData() {
                const dataStr = JSON.stringify(this.data, null, 2);
                const blob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = 'tree-data.json';
                a.click();
                
                URL.revokeObjectURL(url);
            }
            
            loadData(event) {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            this.data = JSON.parse(e.target.result);
                            this.saveState();
                            this.render();
                            this.centerView();
                        } catch (error) {
                            alert('文件格式错误，请选择有效的JSON文件');
                        }
                    };
                    reader.readAsText(file);
                }
            }

                    this.selectedNode = null;
                    this.nodeIdCounter = 1;
                    this.history = [];
                    this.historyIndex = -1;
                    this.saveState();
                    this.render();
                    this.centerView();
                }
            }
