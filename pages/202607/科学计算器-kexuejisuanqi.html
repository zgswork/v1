<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科学计算器</title>
    <style>
        :root {
            --primary-color: #4CAF50;
            --primary-hover: #45a049;
            --secondary-color: #333;
            --text-color: #fff;
            --display-bg: #f1f1f1;
            --display-text: #000;
            --number-color: #666;
            --function-color: #444;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
            padding: 20px;
        }
        
        .calculator-container {
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }
        
        .calculator {
            width: 100%;
            background-color: var(--secondary-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            margin-bottom: 10px;
        }
        
        .display {
            width: 100%;
            height: 70px;
            margin-bottom: 15px;
            padding: 15px;
            font-size: 28px;
            text-align: right;
            background-color: var(--display-bg);
            color: var(--display-text);
            border: none;
            border-radius: 8px;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .mode-toggle {
            display: flex;
            margin-bottom: 15px;
            gap: 10px;
        }
        
        .mode {
            flex: 1;
            height: 40px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            background-color: #555;
            color: var(--text-color);
            transition: all 0.2s;
        }
        
        .mode.active {
            background-color: var(--primary-color);
        }
        
        .buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }
        
        button {
            height: 60px;
            font-size: 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-color);
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button.number {
            background-color: var(--number-color);
        }
        
        button.number:hover {
            background-color: #777;
        }
        
        button.operator {
            background-color: var(--primary-color);
        }
        
        button.operator:hover {
            background-color: var(--primary-hover);
        }
        
        button.function {
            background-color: var(--function-color);
            font-size: 18px;
        }
        
        button.function:hover {
            background-color: #555;
        }
        
        button.clear {
            background-color: #a5a5a5;
            color: #000;
        }
        
        button.clear:hover {
            background-color: #bbbbbb;
        }
        
        button.equals {
            background-color: var(--primary-color);
            grid-column: span 1;
        }
        
        .footer {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-top: 20px;
            padding: 10px;
        }
        
        .footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: bold;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 480px) {
            .calculator {
                padding: 15px;
            }
            
            .display {
                height: 60px;
                font-size: 24px;
                padding: 10px;
            }
            
            button {
                height: 50px;
                font-size: 18px;
            }
            
            .mode {
                height: 35px;
                font-size: 14px;
            }
            
            .buttons {
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="calculator">
            <input type="text" class="display" id="display" readonly>
            <div class="mode-toggle">
                <button id="deg-mode" class="mode active" onclick="setMode('deg')">DEG</button>
                <button id="rad-mode" class="mode" onclick="setMode('rad')">RAD</button>
            </div>
            <div class="buttons">
                <!-- 第一行：清除和高级功能 -->
                <button onclick="clearDisplay()" class="clear">C</button>
                <button onclick="backspace()" class="clear">←</button>
                <button onclick="appendToDisplay('%')" class="function">%</button>
                <button onclick="appendToDisplay('Math.PI')" class="function">π</button>
                <button onclick="appendToDisplay('Math.E')" class="function">e</button>
                
                <!-- 第二行：三角函数 -->
                <button onclick="trigFunction('sin')" class="function">sin</button>
                <button onclick="trigFunction('cos')" class="function">cos</button>
                <button onclick="trigFunction('tan')" class="function">tan</button>
                <button onclick="appendToDisplay('(')" class="function">(</button>
                <button onclick="appendToDisplay(')')" class="function">)</button>
                
                <!-- 第三行：反三角函数和幂运算 -->
                <button onclick="inverseTrigFunction('asin')" class="function">sin⁻¹</button>
                <button onclick="inverseTrigFunction('acos')" class="function">cos⁻¹</button>
                <button onclick="inverseTrigFunction('atan')" class="function">tan⁻¹</button>
                <button onclick="appendToDisplay('^')" class="function">x^y</button>
                <button onclick="appendToDisplay('Math.sqrt(')" class="function">√</button>
                
                <!-- 第四行：数字7-9和除法 -->
                <button onclick="appendToDisplay('7')" class="number">7</button>
                <button onclick="appendToDisplay('8')" class="number">8</button>
                <button onclick="appendToDisplay('9')" class="number">9</button>
                <button onclick="appendToDisplay('/')" class="operator">÷</button>
                <button onclick="appendToDisplay('Math.log(')" class="function">ln</button>
                
                <!-- 第五行：数字4-6和乘法 -->
                <button onclick="appendToDisplay('4')" class="number">4</button>
                <button onclick="appendToDisplay('5')" class="number">5</button>
                <button onclick="appendToDisplay('6')" class="number">6</button>
                <button onclick="appendToDisplay('*')" class="operator">×</button>
                <button onclick="appendToDisplay('Math.log10(')" class="function">log</button>
                
                <!-- 第六行：数字1-3和减法 -->
                <button onclick="appendToDisplay('1')" class="number">1</button>
                <button onclick="appendToDisplay('2')" class="number">2</button>
                <button onclick="appendToDisplay('3')" class="number">3</button>
                <button onclick="appendToDisplay('-')" class="operator">-</button>
                <button onclick="appendToDisplay('Math.pow(10,')" class="function">10^x</button>
                
                <!-- 第七行：数字0、小数点和等于 -->
                <button onclick="appendToDisplay('0')" class="number" style="grid-column: span 2; aspect-ratio: unset;">0</button>
                <button onclick="appendToDisplay('.')" class="number">.</button>
                <button onclick="appendToDisplay('+')" class="operator">+</button>
                <button onclick="calculate()" class="equals">=</button>
            </div>
        </div>
    </div>

    <div class="footer">
        本工具由兔子先生用deepseek开发<br>
        技术支持：<a href="https://t.zsxq.com/y1934" target="_blank">https://t.zsxq.com/y1934</a>
    </div>

    <script>
        const display = document.getElementById('display');
        let angleMode = 'deg';
        let lastResult = null;
        
        function setMode(mode) {
            angleMode = mode;
            document.getElementById('deg-mode').classList.toggle('active', mode === 'deg');
            document.getElementById('rad-mode').classList.toggle('active', mode === 'rad');
        }
        
        function appendToDisplay(value) {
            if (lastResult !== null && /^[0-9(πe]/.test(value)) {
                display.value = '';
                lastResult = null;
            }
            display.value += value;
        }
        
        function clearDisplay() {
            display.value = '';
            lastResult = null;
        }
        
        function backspace() {
            display.value = display.value.slice(0, -1);
        }
        
        function trigFunction(func) {
            const input = prompt(`输入${func}的值 (${angleMode}):`);
            if (input === null || input.trim() === '') return;
            
            try {
                let angle = parseFloat(input);
                if (isNaN(angle)) {
                    alert("请输入有效数字");
                    return;
                }
                
                if (angleMode === 'deg') {
                    angle = angle * Math.PI / 180;
                }
                
                if (func === 'tan' && Math.abs(Math.cos(angle)) < 1e-10) {
                    display.value = angleMode === 'deg' ? "tan(90°)无定义" : "tan(π/2)无定义";
                    return;
                }
                
                let result;
                switch(func) {
                    case 'sin': result = Math.sin(angle); break;
                    case 'cos': result = Math.cos(angle); break;
                    case 'tan': result = Math.tan(angle); break;
                }
                
                if (Math.abs(result) < 1e-10) result = 0;
                display.value = parseFloat(result.toFixed(10));
                lastResult = display.value;
            } catch (error) {
                display.value = "错误";
            }
        }
        
        function inverseTrigFunction(func) {
            const input = prompt(`输入${func}的值${func !== 'atan' ? ' (-1到1)' : ''}:`);
            if (input === null || input.trim() === '') return;
            
            try {
                const value = parseFloat(input);
                if (isNaN(value)) {
                    alert("请输入有效数字");
                    return;
                }
                
                if ((func === 'asin' || func === 'acos') && (value < -1 || value > 1)) {
                    alert("输入值必须在-1到1之间");
                    return;
                }
                
                let result;
                switch(func) {
                    case 'asin': result = Math.asin(value); break;
                    case 'acos': result = Math.acos(value); break;
                    case 'atan': result = Math.atan(value); break;
                }
                
                if (angleMode === 'deg') {
                    result = result * 180 / Math.PI;
                }
                
                display.value = parseFloat(result.toFixed(10));
                lastResult = display.value;
            } catch (error) {
                display.value = "错误";
            }
        }
        
        function calculate() {
            try {
                if (display.value.trim() === '') return;
                
                let expression = display.value
                    .replace(/\^/g, '**')
                    .replace(/%/g, '/100')
                    .replace(/×/g, '*')
                    .replace(/÷/g, '/');
                
                const result = eval(expression);
                
                if (isNaN(result) || !isFinite(result)) {
                    display.value = '错误';
                } else {
                    display.value = parseFloat(result.toFixed(10)).toString();
                    lastResult = display.value;
                }
            } catch (error) {
                display.value = '错误';
            }
        }
    </script>
</body>
</html>
