<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>长度单位换算</title>
    <style>
        body {
            font-family: 'Comic Sans MS', '楷体', sans-serif;
            background-color: #f0f8ff;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #ff6b6b;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        .container {
            background-color: white;
            border-radius: 15px;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .converter {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .input-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        input {
            padding: 10px;
            border: 2px solid #a0d8ff;
            border-radius: 8px;
            font-size: 16px;
            width: 150px;
        }
        select {
            padding: 10px;
            border: 2px solid #a0d8ff;
            border-radius: 8px;
            font-size: 16px;
            background-color: white;
        }
        button {
            background-color: #4dabf7;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #339af0;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #e3f2fd;
            border-radius: 10px;
            font-size: 18px;
        }
        .examples {
            margin-top: 30px;
            text-align: left;
            background-color: #fff9db;
            padding: 15px;
            border-radius: 10px;
        }
        .examples h3 {
            color: #f76707;
            margin-top: 0;
        }
        .example-item {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>长度单位换算</h1>
        
        <div class="converter">
            <div class="input-group">
                <input type="number" id="inputValue" placeholder="输入数字" min="0" step="0.01">
                <select id="inputUnit">
                    <option value="mm">毫米 (mm)</option>
                    <option value="cm">厘米 (cm)</option>
                    <option value="m" selected>米 (m)</option>
                    <option value="km">千米 (km)</option>
                    <option value="in">英寸 (in)</option>
                    <option value="ft">英尺 (ft)</option>
                </select>
            </div>
            
            <div style="font-size: 24px;">↓</div>
            
            <div class="input-group">
                <input type="number" id="outputValue" placeholder="结果" readonly>
                <select id="outputUnit">
                    <option value="mm">毫米 (mm)</option>
                    <option value="cm" selected>厘米 (cm)</option>
                    <option value="m">米 (m)</option>
                    <option value="km">千米 (km)</option>
                    <option value="in">英寸 (in)</option>
                    <option value="ft">英尺 (ft)</option>
                </select>
            </div>
            
            <button onclick="convert()">换算</button>
            
            <div class="result" id="result">
                输入数字并选择单位，然后点击"换算"按钮
            </div>
        </div>
        
        <div class="examples">
            <h3>常见长度示例：</h3>
            <div class="example-item">铅笔长度：约 18 厘米</div>
            <div class="example-item">书本高度：约 25 厘米</div>
            <div class="example-item">门的高度：约 2 米</div>
            <div class="example-item">操场跑道：约 400 米</div>
            <div class="example-item">铅笔橡皮：约 1 厘米</div>
        </div>
    </div>

    <script>
        // 单位换算关系
        const unitConversions = {
            mm: 1,
            cm: 10,
            m: 1000,
            km: 1000000,
            in: 25.4,
            ft: 304.8
        };
        
        function convert() {
            const inputValue = parseFloat(document.getElementById('inputValue').value);
            const inputUnit = document.getElementById('inputUnit').value;
            const outputUnit = document.getElementById('outputUnit').value;
            
            if (isNaN(inputValue)) {
                document.getElementById('result').textContent = "请输入一个有效的数字！";
                return;
            }
            
            // 转换为毫米作为中间单位
            const valueInMm = inputValue * unitConversions[inputUnit];
            // 转换为目标单位
            const result = valueInMm / unitConversions[outputUnit];
            
            document.getElementById('outputValue').value = result.toFixed(4);
            
            // 显示友好的结果说明
            const unitNames = {
                mm: "毫米",
                cm: "厘米",
                m: "米",
                km: "千米",
                in: "英寸",
                ft: "英尺"
            };
            
            document.getElementById('result').innerHTML = `
                ${inputValue} ${unitNames[inputUnit]} = 
                <strong>${result.toFixed(4)} ${unitNames[outputUnit]}</strong>
            `;
        }
        
        // 添加键盘事件监听，按回车键也可以换算
        document.getElementById('inputValue').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                convert();
            }
        });
    </script>
</body>
</html>
