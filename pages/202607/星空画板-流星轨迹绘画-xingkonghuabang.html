<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>星空画板 - 流星轨迹绘画</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
        }

        body {
            background: linear-gradient(135deg, #0c0e2b, #1a1c3a, #0c0e2b);
            color: #e0e0ff;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            padding: 10px 20px;
            background: rgba(10, 12, 30, 0.7);
            border-bottom: 1px solid rgba(90, 120, 220, 0.3);
            z-index: 10;
            position: relative;
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #aaccff, #4d79ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(77, 121, 255, 0.5);
        }

        .subtitle {
            font-size: 0.9rem;
            opacity: 0.8;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.4;
        }

        .container {
            display: flex;
            flex: 1;
            flex-direction: column;
            padding: 0;
            width: 100%;
            height: calc(100vh - 70px);
        }

        .canvas-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #050718;
            height: 100%;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        #drawingCanvas {
            z-index: 2;
            cursor: crosshair;
        }

        #backgroundCanvas {
            z-index: 1;
        }

        .controls {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            padding: 10px 15px;
            background: rgba(20, 25, 60, 0.7);
            border-radius: 40px;
            backdrop-filter: blur(10px);
            z-index: 10;
            border: 1px solid rgba(100, 150, 255, 0.3);
            box-shadow: 0 5px 25px rgba(0, 10, 50, 0.5);
        }

        .btn {
            background: linear-gradient(135deg, #1e2a5e, #2a3a78);
            color: #d0e0ff;
            border: none;
            border-radius: 40px;
            padding: 10px 18px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(100, 150, 255, 0.3);
        }

        .btn:hover {
            background: linear-gradient(135deg, #2a3a78, #3a4a98);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(50, 100, 255, 0.4);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .sound-control {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(20, 25, 60, 0.7);
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 11;
            border: 1px solid rgba(100, 150, 255, 0.3);
            backdrop-filter: blur(5px);
            transition: all 0.3s;
        }

        .sound-control:hover {
            transform: scale(1.1);
            background: rgba(30, 40, 90, 0.8);
        }

        .sound-control i {
            font-size: 20px;
            color: #aaccff;
        }

        .fullscreen-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(20, 25, 60, 0.7);
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 11;
            border: 1px solid rgba(100, 150, 255, 0.3);
            backdrop-filter: blur(5px);
            transition: all 0.3s;
        }

        .fullscreen-btn:hover {
            transform: scale(1.1);
            background: rgba(30, 40, 90, 0.8);
        }

        .fullscreen-btn i {
            font-size: 20px;
            color: #aaccff;
        }

        .instructions {
            position: absolute;
            top: 70px;
            left: 15px;
            background: rgba(10, 15, 40, 0.7);
            border-radius: 12px;
            padding: 12px;
            max-width: 260px;
            font-size: 0.9rem;
            border: 1px solid rgba(90, 120, 220, 0.2);
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        .instructions p {
            margin: 6px 0;
            line-height: 1.5;
        }

        footer {
            text-align: center;
            padding: 8px;
            font-size: 0.8rem;
            opacity: 0.7;
            background: rgba(5, 7, 24, 0.7);
            height: 35px;
        }

        .hint {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 30, 70, 0.7);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            backdrop-filter: blur(5px);
            animation: pulse 2s infinite;
            z-index: 10;
        }

        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }

        @media (max-width: 768px) {
            header {
                padding: 8px 15px;
            }
            
            h1 {
                font-size: 1.4rem;
            }
            
            .subtitle {
                font-size: 0.8rem;
            }
            
            .container {
                height: calc(100vh - 65px);
            }
            
            .btn {
                padding: 8px 14px;
                font-size: 0.85rem;
            }
            
            .controls {
                gap: 8px;
                padding: 8px 12px;
                border-radius: 35px;
                bottom: 10px;
            }
            
            .instructions {
                top: 65px;
                left: 10px;
                padding: 10px;
                font-size: 0.8rem;
                max-width: 220px;
            }
            
            .sound-control, .fullscreen-btn {
                width: 40px;
                height: 40px;
                top: 10px;
            }
            
            .sound-control {
                right: 10px;
            }
            
            .fullscreen-btn {
                left: 10px;
            }
            
            .hint {
                font-size: 0.8rem;
                bottom: 70px;
            }
        }

        @media (max-width: 480px) {
            .controls {
                width: 95%;
                justify-content: space-around;
            }
            
            .btn span {
                display: none;
            }
            
            .btn {
                padding: 10px;
                width: 40px;
                height: 40px;
                justify-content: center;
            }
            
            .instructions {
                display: none;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>星空画板 - 流星轨迹绘画</h1>
        <p class="subtitle">在浩瀚星空中绘制属于你的流星轨迹，支持手机和电脑设备</p>
    </header>
    
    <div class="container">
        <div class="canvas-wrapper">
            <canvas id="backgroundCanvas"></canvas>
            <canvas id="drawingCanvas"></canvas>
            
            <div class="fullscreen-btn" id="fullscreenBtn">
                <i class="fas fa-expand"></i>
            </div>
            
            <div class="sound-control" id="soundControl">
                <i class="fas fa-volume-up"></i>
            </div>
            
            <div class="instructions">
                <p><i class="fas fa-paint-brush"></i> <strong>使用说明：</strong></p>
                <p>• 在画布上拖动鼠标/手指绘制流星轨迹</p>
                <p>• 流星颜色会自动变化</p>
                <p>• 绘制时会产生流星音效</p>
                <p>• 点击<i class="fas fa-trash-alt"></i>清空画布重新开始</p>
                <p>• 点击<i class="fas fa-save"></i>保存你的星空作品</p>
                <p>• 点击<i class="fas fa-expand"></i>进入全屏模式</p>
                <p>• 点击<i class="fas fa-volume-up"></i>开关音效</p>
            </div>
            
            <div class="hint" id="hint">
                <i class="fas fa-lightbulb"></i> 开始绘制流星轨迹...
            </div>
            
            <div class="controls">
                <button id="clearBtn" class="btn">
                    <i class="fas fa-trash-alt"></i>
                    <span>清空</span>
                </button>
                
                <button id="saveBtn" class="btn">
                    <i class="fas fa-save"></i>
                    <span>保存</span>
                </button>
            </div>
        </div>
    </div>
    
    <footer>
        <p>© 2023 星空画板 | 在星辰间绘制你的创意</p>
    </footer>

    <script>
        // 初始化变量
        const backgroundCanvas = document.getElementById('backgroundCanvas');
        const drawingCanvas = document.getElementById('drawingCanvas');
        const bgCtx = backgroundCanvas.getContext('2d');
        const ctx = drawingCanvas.getContext('2d');
        const clearBtn = document.getElementById('clearBtn');
        const saveBtn = document.getElementById('saveBtn');
        const soundControl = document.getElementById('soundControl');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const hint = document.getElementById('hint');
        
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let stars = [];
        let hue = 0;
        let isSoundEnabled = true;
        let audioContext;
        let oscillator;
        let lastSoundTime = 0;
        let soundInterval = 100; // 音效间隔时间(ms)
        
        // 流星音效
        function playStarSound() {
            if (!isSoundEnabled || Date.now() - lastSoundTime < soundInterval) return;
            
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                
                if (oscillator) {
                    oscillator.stop();
                }
                
                oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(150, audioContext.currentTime + 0.3);
                
                gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.start();
                oscillator.stop(audioContext.currentTime + 0.3);
                
                lastSoundTime = Date.now();
            } catch (e) {
                console.log("音频播放失败:", e);
                isSoundEnabled = false;
            }
        }
        
        // 设置画布尺寸
        function resizeCanvas() {
            backgroundCanvas.width = window.innerWidth;
            backgroundCanvas.height = window.innerHeight;
            drawingCanvas.width = window.innerWidth;
            drawingCanvas.height = window.innerHeight;
            
            createStars();
            drawBackground();
        }
        
        // 创建星星
        function createStars() {
            stars = [];
            const starCount = Math.floor((backgroundCanvas.width * backgroundCanvas.height) / 400);
            
            for (let i = 0; i < starCount; i++) {
                stars.push({
                    x: Math.random() * backgroundCanvas.width,
                    y: Math.random() * backgroundCanvas.height,
                    radius: Math.random() * 1.2,
                    opacity: Math.random(),
                    blink: Math.random() * 5,
                    speed: Math.random() * 0.03
                });
            }
        }
        
        // 绘制星空背景
        function drawBackground() {
            bgCtx.fillStyle = '#050718';
            bgCtx.fillRect(0, 0, backgroundCanvas.width, backgroundCanvas.height);
            
            // 绘制星星
            stars.forEach(star => {
                star.blink += star.speed;
                const opacity = Math.max(0.1, star.opacity + Math.sin(star.blink) * 0.5);
                
                bgCtx.beginPath();
                bgCtx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                bgCtx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                bgCtx.fill();
            });
            
            // 绘制银河
            const centerX = backgroundCanvas.width * 0.7;
            const centerY = backgroundCanvas.height * 0.3;
            const radiusX = backgroundCanvas.width * 0.4;
            const radiusY = backgroundCanvas.height * 0.12;
            
            const gradient = bgCtx.createRadialGradient(
                centerX, centerY, 0,
                centerX, centerY, radiusX
            );
            
            gradient.addColorStop(0, 'rgba(120, 140, 240, 0.4)');
            gradient.addColorStop(0.5, 'rgba(80, 100, 200, 0.2)');
            gradient.addColorStop(1, 'rgba(20, 30, 80, 0)');
            
            bgCtx.beginPath();
            bgCtx.ellipse(centerX, centerY, radiusX, radiusY, 0, 0, Math.PI * 2);
            bgCtx.fillStyle = gradient;
            bgCtx.fill();
        }
        
        // 绘制流星轨迹
        function draw(e) {
            if (!isDrawing) return;
            
            // 获取坐标（支持触摸设备）
            let x, y;
            if (e.type.includes('touch')) {
                x = e.touches[0].clientX;
                y = e.touches[0].clientY;
            } else {
                x = e.clientX;
                y = e.clientY;
            }
            
            // 自动变化颜色
            hue = (hue + 1) % 360;
            const color = `hsl(${hue}, 100%, 65%)`;
            
            // 设置流星拖尾效果
            ctx.globalCompositeOperation = 'lighter';
            ctx.strokeStyle = color;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.lineWidth = Math.random() * 3 + 2; // 更细的笔迹
            
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();
            
            // 添加流星头部光点
            ctx.beginPath();
            ctx.arc(x, y, ctx.lineWidth * 1.5, 0, Math.PI * 2);
            const gradient = ctx.createRadialGradient(x, y, 0, x, y, ctx.lineWidth * 1.5);
            gradient.addColorStop(0, '#ffffff');
            gradient.addColorStop(1, color);
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // 添加粒子效果
            for (let i = 0; i < 3; i++) {
                const size = Math.random() * 1.5 + 0.5;
                const angle = Math.atan2(y - lastY, x - lastX) + (Math.random() - 0.5) * Math.PI/3;
                const distance = Math.random() * 20;
                const alpha = Math.random() * 0.8 + 0.2;
                
                ctx.beginPath();
                ctx.arc(
                    x - Math.cos(angle) * distance,
                    y - Math.sin(angle) * distance,
                    size, 0, Math.PI * 2
                );
                ctx.fillStyle = color;
                ctx.fill();
            }
            
            // 播放音效
            playStarSound();
            
            // 更新位置
            [lastX, lastY] = [x, y];
            
            // 隐藏提示
            if (hint.style.display !== 'none') {
                hint.style.opacity = '0';
                setTimeout(() => {
                    hint.style.display = 'none';
                }, 500);
            }
        }
        
        // 事件监听器
        function setupEventListeners() {
            // 鼠标/触摸事件
            drawingCanvas.addEventListener('mousedown', (e) => {
                isDrawing = true;
                [lastX, lastY] = [e.clientX, e.clientY];
            });
            
            window.addEventListener('mousemove', draw);
            window.addEventListener('mouseup', () => isDrawing = false);
            
            // 触摸事件
            drawingCanvas.addEventListener('touchstart', (e) => {
                isDrawing = true;
                const touch = e.touches[0];
                [lastX, lastY] = [touch.clientX, touch.clientY];
                e.preventDefault();
            });
            
            window.addEventListener('touchmove', (e) => {
                if (isDrawing) draw(e);
                e.preventDefault();
            });
            
            window.addEventListener('touchend', () => isDrawing = false);
            
            // 按钮事件
            clearBtn.addEventListener('click', () => {
                ctx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
                hint.style.display = 'block';
                hint.style.opacity = '1';
            });
            
            saveBtn.addEventListener('click', () => {
                const link = document.createElement('a');
                link.download = '星空画板作品.png';
                link.href = drawingCanvas.toDataURL('image/png');
                link.click();
            });
            
            // 音效控制
            soundControl.addEventListener('click', () => {
                isSoundEnabled = !isSoundEnabled;
                soundControl.innerHTML = isSoundEnabled 
                    ? '<i class="fas fa-volume-up"></i>' 
                    : '<i class="fas fa-volume-mute"></i>';
            });
            
            // 全屏控制
            fullscreenBtn.addEventListener('click', toggleFullscreen);
        }
        
        // 全屏切换
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error(`全屏请求错误: ${err.message}`);
                });
                fullscreenBtn.innerHTML = '<i class="fas fa-compress"></i>';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i>';
                }
            }
        }
        
        // 动画循环
        function animate() {
            drawBackground();
            requestAnimationFrame(animate);
        }
        
        // 初始化
        window.addEventListener('load', () => {
            resizeCanvas();
            setupEventListeners();
            animate();
        });
        
        window.addEventListener('resize', resizeCanvas);
        
        // 防止触摸设备上的默认行为
        document.addEventListener('touchmove', function(e) {
            if (e.scale !== 1) { 
                e.preventDefault(); 
            }
        }, { passive: false });
    </script>
</body>
</html>
