<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码生成器</title>
    <style>
        :root {
            --bg-color: #f5f5f5;
            --text-color: #333;
            --container-bg: white;
            --button-bg: #4CAF50;
            --button-hover: #45a049;
            --password-bg: white;
            --password-border: #ddd;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 30px 20px;
            text-align: center;
            background-color: var(--bg-color);
            color: var(--text-color);
            -webkit-font-smoothing: antialiased;
        }
        .container {
            background-color: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h1 {
            color: #333;
        }
        .controls {
            margin: 20px 0;
        }
        label {
            display: block;
            margin: 10px 0;
        }
        input[type="range"] {
            width: 80%;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 10px 2px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #45a049;
        }
        #password {
            font-size: 24px;
            margin: 20px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: white;
            word-break: break-all;
        }
        .strength-meter {
            height: 10px;
            background-color: #ddd;
            border-radius: 5px;
            margin: 10px 0;
            overflow: hidden;
        }
        .strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>密码生成器</h1>
        
        <div class="controls">
            <label>
                密码长度: <span id="length-value">12</span>
                <input type="range" id="length" min="4" max="32" value="12">
            </label>
            
            <label>
                <input type="checkbox" id="uppercase" checked>
                包含大写字母 (A-Z)
            </label>
            
            <label>
                <input type="checkbox" id="lowercase" checked>
                包含小写字母 (a-z)
            </label>
            
            <label>
                <input type="checkbox" id="numbers" checked>
                包含数字 (0-9)
            </label>
            
            <label>
                <input type="checkbox" id="symbols" checked>
                包含特殊符号 (!@#$%^&*)
            </label>
        </div>
        
        <button id="generate">生成密码</button>
        <button id="copy">复制密码</button>

        
        <div id="password" class="password-display">点击"生成密码"按钮</div>
        
        <div class="security-tips">
            <h3>密码安全提示</h3>
            <ul>
                <li>不要重复使用相同的密码</li>
                <li>定期更换重要账户的密码</li>
                <li>避免使用个人信息作为密码</li>
                <li>不要在多个网站使用相同密码</li>
                <li>考虑使用密码管理器存储密码</li>
            </ul>
        </div>
        
        <style>
            .security-tips {
                margin-top: 20px;
                padding: 15px;
                background-color: var(--container-bg);
                border-radius: 5px;
                box-shadow: 0 0 5px rgba(0,0,0,0.1);
            }
            
            .security-tips h3 {
                margin-top: 0;
                color: var(--text-color);
            }
            
            .security-tips ul {
                list-style: none;
                padding: 0;
                margin: 0;
                text-align: left;
            }
            
            .security-tips li {
                padding: 8px 0;
                border-bottom: 1px solid var(--password-border);
                color: var(--text-color);
            }
            
            .security-tips li:last-child {
                border-bottom: none;
            }
        </style>
        
        <div class="presets">
            <h3>预设规则</h3>
            <button class="preset" data-length="8" data-upper="true" data-lower="true" data-num="true" data-sym="false">简单密码</button>
            <button class="preset" data-length="12" data-upper="true" data-lower="true" data-num="true" data-sym="true">中等密码</button>
            <button class="preset" data-length="16" data-upper="true" data-lower="true" data-num="true" data-sym="true">复杂密码</button>
        </div>
        
        <div class="strength-meter">
            <div class="strength-bar" id="strength-bar"></div>
        
        <div class="security-tips">
            <h3 style="margin-bottom: 15px; font-weight: 500;">密码安全提示</h3>
            <ul style="text-align: left; padding-left: 20px; margin: 0;">
                <li style="margin-bottom: 8px;">不要重复使用相同的密码</li>
                <li style="margin-bottom: 8px;">定期更换重要账户的密码</li>
                <li style="margin-bottom: 8px;">避免使用个人信息作为密码</li>
                <li style="margin-bottom: 8px;">不要在多个网站使用相同密码</li>
                <li>考虑使用密码管理器存储密码</li>
            </ul>
        </div>
    </div>
        <div id="strength-text">密码强度: 无</div>
    </div>

    <script>
        document.getElementById('length').addEventListener('input', function() {
            document.getElementById('length-value').textContent = this.value;
        });

        document.getElementById('generate').addEventListener('click', function() {
            const length = parseInt(document.getElementById('length').value);
            const uppercase = document.getElementById('uppercase').checked;
            const lowercase = document.getElementById('lowercase').checked;
            const numbers = document.getElementById('numbers').checked;
            const symbols = document.getElementById('symbols').checked;
            
            if (!uppercase && !lowercase && !numbers && !symbols) {
                alert('请至少选择一种字符类型！');
                return;
            }
            
            const password = generatePassword(length, uppercase, lowercase, numbers, symbols);
            const passwordElement = document.getElementById('password');
            
            // 密码生成动画
            passwordElement.textContent = '';
            passwordElement.style.opacity = '0';
            passwordElement.style.transform = 'translateY(-10px)';
            
            setTimeout(() => {
                passwordElement.textContent = password;
                passwordElement.style.opacity = '1';
                passwordElement.style.transform = 'translateY(0)';
            }, 300);
            updateStrengthMeter(password);
        });

        document.getElementById('copy').addEventListener('click', function() {
            const password = document.getElementById('password').textContent;
            if (password && password !== '点击"生成密码"按钮') {
                navigator.clipboard.writeText(password)
                    .then(() => alert('密码已复制到剪贴板！'))
                    .catch(err => alert('复制失败: ' + err));
            }
        });


        
        // 预设规则
        document.querySelectorAll('.preset').forEach(button => {
            button.addEventListener('click', function() {
                const length = this.dataset.length;
                const upper = this.dataset.upper === 'true';
                const lower = this.dataset.lower === 'true';
                const num = this.dataset.num === 'true';
                const sym = this.dataset.sym === 'true';
                
                document.getElementById('length').value = length;
                document.getElementById('length-value').textContent = length;
                document.getElementById('uppercase').checked = upper;
                document.getElementById('lowercase').checked = lower;
                document.getElementById('numbers').checked = num;
                document.getElementById('symbols').checked = sym;
            });
        });
        
        function updateHistoryList() {
             const list = document.getElementById('history-list');
             list.innerHTML = '';
             
             if (passwordHistory.length === 0) {
                 const emptyMsg = document.createElement('li');
                 emptyMsg.textContent = '暂无历史记录';
                 emptyMsg.style.color = '#999';
                 emptyMsg.style.fontStyle = 'italic';
                 list.appendChild(emptyMsg);
                 return;
             }
             
             passwordHistory.slice().reverse().forEach((pass, index) => {
                 if (index < 5) { // 只显示最近5条记录
                     const li = document.createElement('li');
                     li.textContent = pass;
                     
                     const copyBtn = document.createElement('button');
                     copyBtn.textContent = '复制';
                     copyBtn.style.marginLeft = '10px';
                     copyBtn.style.padding = '2px 8px';
                     copyBtn.style.fontSize = '12px';
                     copyBtn.addEventListener('click', () => {
                         navigator.clipboard.writeText(pass)
                             .then(() => alert('已复制到剪贴板'))
                             .catch(err => console.error('复制失败:', err));
                     });
                     
                     li.appendChild(copyBtn);
                     list.appendChild(li);
                 }
             });
         }
        
        function generatePassword(length, uppercase, lowercase, numbers, symbols) {
            let chars = '';
            const upperChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const lowerChars = 'abcdefghijklmnopqrstuvwxyz';
            const numberChars = '0123456789';
            const symbolChars = '!@#$%^&*';
            
            if (uppercase) chars += upperChars;
            if (lowercase) chars += lowerChars;
            if (numbers) chars += numberChars;
            if (symbols) chars += symbolChars;
            
            let password = '';
            for (let i = 0; i < length; i++) {
                const randomIndex = Math.floor(Math.random() * chars.length);
                password += chars[randomIndex];
            }
            
            return password;
        }

        function updateStrengthMeter(password) {
            const strengthBar = document.getElementById('strength-bar');
            const strengthText = document.getElementById('strength-text');
            
            // 简单的密码强度评估
            let strength = 0;
            const length = password.length;
            
            if (length >= 8) strength += 1;
            if (length >= 12) strength += 1;
            if (/[A-Z]/.test(password)) strength += 1;
            if (/[a-z]/.test(password)) strength += 1;
            if (/[0-9]/.test(password)) strength += 1;
            if (/[^A-Za-z0-9]/.test(password)) strength += 1;
            
            let strengthPercentage = 0;
            let strengthLabel = '';
            
            if (strength <= 2) {
                strengthPercentage = 25;
                strengthLabel = '弱';
                strengthBar.style.backgroundColor = '#ff5252';
            } else if (strength <= 4) {
                strengthPercentage = 50;
                strengthLabel = '中等';
                strengthBar.style.backgroundColor = '#ffc107';
            } else if (strength <= 6) {
                strengthPercentage = 75;
                strengthLabel = '强';
                strengthBar.style.backgroundColor = '#4caf50';
            } else {
                strengthPercentage = 100;
                strengthLabel = '非常强';
                strengthBar.style.backgroundColor = '#2e7d32';
            }
            
            strengthBar.style.width = strengthPercentage + '%';
            strengthText.textContent = '密码强度: ' + strengthLabel;
        }
    </script>
</body>
</html>
