<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>贪吃蛇</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: none;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            overflow: auto;
            padding: 5px;
        }
        h1 {
            color: #333;
            margin-bottom: 5px;
            font-size: 1.2rem;
        }
        #game-info {
            display: flex;
            justify-content: space-between;
            width: 95vw;
            max-width: 400px;
            margin-bottom: 5px;
            font-size: 0.8rem;
        }
        #score, #high-score {
            font-weight: bold;
        }
        #upload-container {
            margin-bottom: 8px;
            text-align: center;
            width: 95vw;
        }
        .upload-group {
            margin: 5px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .upload-label {
            margin-bottom: 3px;
            font-size: 0.7rem;
            color: #555;
        }
        #upload-head-btn, #upload-body-btn, #start-btn {
            padding: 5px 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.7rem;
            margin: 3px;
        }
        #start-btn {
            background-color: #2196F3;
        }
        #game-container {
            position: relative;
            width: 95vw;
            max-width: 400px;
            margin: 0 auto 5px;
        }
        #game-board {
            width: 100%;
            height: 75vh;
            max-height: 400px;
            border: 2px solid #333;
            background-color: #fff;
            display: block;
        }
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 1rem;
        }
        #restart-btn {
            margin-top: 10px;
            padding: 6px 12px;
            font-size: 0.8rem;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .instructions {
            margin-top: 5px;
            text-align: center;
            color: #555;
            font-size: 0.7rem;
            width: 95vw;
            max-width: 400px;
            padding: 0 5px;
        }
        .preview-container {
            width: 30px;
            height: 30px;
            margin: 5px auto;
            border: 1px solid #ddd;
            border-radius: 3px;
            overflow: hidden;
            display: none;
        }
        .preview-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <h1>贪吃蛇</h1>
    <div id="upload-container">
        <div class="upload-group">
            <div class="upload-label">上传贪吃蛇的头像图案</div>
            <input type="file" id="upload-head-btn" accept="image/*">
            <div id="head-preview-container" class="preview-container">
                <img id="head-preview-img" class="preview-img" src="" alt="头部预览">
            </div>
        </div>
        <div class="upload-group">
            <div class="upload-label">上传贪吃蛇的身体图案</div>
            <input type="file" id="upload-body-btn" accept="image/*">
            <div id="body-preview-container" class="preview-container">
                <img id="body-preview-img" class="preview-img" src="" alt="身体预览">
            </div>
        </div>
    </div>
    <div id="game-info">
        <div id="score">分数: 0</div>
        <div id="high-score">最高分: 0</div>
    </div>
    <div id="game-container">
        <canvas id="game-board"></canvas>
        <div id="start-screen">
            <div>贪吃蛇游戏</div>
            <button id="start-btn">开始游戏</button>
        </div>
        <div id="game-over">
            <div>游戏结束!</div>
            <div id="final-score">你的分数: 0</div>
            <button id="restart-btn">重新开始</button>
        </div>
    </div>
    <div class="instructions">
        <p>1. 上传图片作为小蛇头部和身体</p>
        <p>2. 点击"开始游戏"按钮开始</p>
        <p>3. 滑动屏幕控制小蛇方向</p>
        <p>4. 初始速度500毫秒，吃到10个食物后速度提升25%</p>
    </div>

    <script>
        // 游戏变量
        const canvas = document.getElementById('game-board');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('high-score');
        const gameOverElement = document.getElementById('game-over');
        const finalScoreElement = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        const uploadHeadBtn = document.getElementById('upload-head-btn');
        const uploadBodyBtn = document.getElementById('upload-body-btn');
        const headPreviewContainer = document.getElementById('head-preview-container');
        const headPreviewImg = document.getElementById('head-preview-img');
        const bodyPreviewContainer = document.getElementById('body-preview-container');
        const bodyPreviewImg = document.getElementById('body-preview-img');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        
        // 游戏状态
        let boxSize, rows, cols;
        let snake = [];
        let food = {};
        let direction = null;
        let nextDirection = null;
        let score = 0;
        let foodCount = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameInterval;
        let touchStartX = 0;
        let touchStartY = 0;
        let headImage = null;
        let bodyImage = null;
        const baseSpeed = 500;
        let currentSpeed = baseSpeed;
        
        // 初始化画布
        function initCanvas() {
            const maxSize = Math.min(window.innerWidth * 0.95, 400);
            const availableHeight = window.innerHeight * 0.75;
            
            canvas.width = maxSize;
            canvas.height = Math.min(maxSize, availableHeight);
            
            boxSize = Math.floor(canvas.width / 20);
            rows = Math.floor(canvas.height / boxSize);
            cols = Math.floor(canvas.width / boxSize);
            
            // 清除画布
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        
        // 窗口大小变化处理
        function handleResize() {
            clearTimeout(this.resizeTimer);
            this.resizeTimer = setTimeout(() => {
                initCanvas();
                if (gameInterval) {
                    drawGame();
                }
            }, 200);
        }
        
        // 初始化游戏
        function initGame() {
            initCanvas();
            
            snake = [
                {x: 10 * boxSize, y: 10 * boxSize},
                {x: 9 * boxSize, y: 10 * boxSize},
                {x: 8 * boxSize, y: 10 * boxSize}
            ];
            
            direction = 'RIGHT';
            nextDirection = 'RIGHT';
            
            score = 0;
            foodCount = 0;
            scoreElement.textContent = `分数: ${score}`;
            highScoreElement.textContent = `最高分: ${highScore}`;
            
            currentSpeed = baseSpeed;
            
            generateFood();
            
            gameOverElement.style.display = 'none';
            startScreen.style.display = 'none';
            
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, currentSpeed);
            
            // 初始绘制
            drawGame();
        }
        
        // 游戏主循环
        function gameLoop() {
            direction = nextDirection;
            moveSnake();
            
            if (checkCollision()) {
                gameOver();
                return;
            }
            
            if (snake[0].x === food.x && snake[0].y === food.y) {
                generateFood();
                score += 10;
                foodCount++;
                scoreElement.textContent = `分数: ${score}`;
                
                if (foodCount === 10) {
                    clearInterval(gameInterval);
                    currentSpeed = Math.floor(baseSpeed * 0.75);
                    gameInterval = setInterval(gameLoop, currentSpeed);
                }
            } else {
                snake.pop();
            }
            
            drawGame();
        }
        
        // 移动蛇
        function moveSnake() {
            const head = {x: snake[0].x, y: snake[0].y};
            
            switch (direction) {
                case 'UP':
                    head.y -= boxSize;
                    break;
                case 'DOWN':
                    head.y += boxSize;
                    break;
                case 'LEFT':
                    head.x -= boxSize;
                    break;
                case 'RIGHT':
                    head.x += boxSize;
                    break;
            }
            
            snake.unshift(head);
        }
        
        // 检查碰撞
        function checkCollision() {
            const head = snake[0];
            
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                return true;
            }
            
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }
            
            return false;
        }
        
        // 生成食物
        function generateFood() {
            let validPosition = false;
            while (!validPosition) {
                food = {
                    x: Math.floor(Math.random() * cols) * boxSize,
                    y: Math.floor(Math.random() * rows) * boxSize
                };
                
                validPosition = true;
                for (let segment of snake) {
                    if (segment.x === food.x && segment.y === food.y) {
                        validPosition = false;
                        break;
                    }
                }
            }
        }
        
        // 绘制蛇头
        function drawSnakeHead(x, y) {
            if (headImage) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(x + boxSize/2, y + boxSize/2, boxSize/2, 0, Math.PI * 2);
                ctx.closePath();
                ctx.clip();
                
                ctx.drawImage(headImage, x, y, boxSize, boxSize);
                ctx.restore();
            } else {
                ctx.save();
                
                ctx.fillStyle = '#4CAF50';
                ctx.beginPath();
                ctx.ellipse(x + boxSize/2, y + boxSize/2, boxSize/2, boxSize/3, 0, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = 'white';
                const eyeSize = boxSize / 4;
                const leftEyeX = x + boxSize/3;
                const rightEyeX = x + boxSize*2/3;
                const eyeY = y + boxSize/3;
                
                ctx.beginPath();
                ctx.arc(leftEyeX, eyeY, eyeSize, 0, Math.PI * 2);
                ctx.arc(rightEyeX, eyeY, eyeSize, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = 'black';
                const pupilSize = eyeSize / 2;
                ctx.beginPath();
                ctx.arc(leftEyeX, eyeY, pupilSize, 0, Math.PI * 2);
                ctx.arc(rightEyeX, eyeY, pupilSize, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(x + boxSize/2, y + boxSize*2/3, boxSize/4, 0, Math.PI);
                ctx.stroke();
                
                ctx.fillStyle = '#FF5722';
                ctx.beginPath();
                ctx.moveTo(x + boxSize/2, y + boxSize*2/3 + boxSize/8);
                ctx.lineTo(x + boxSize/2 - boxSize/8, y + boxSize*2/3 + boxSize/4);
                ctx.lineTo(x + boxSize/2 + boxSize/8, y + boxSize*2/3 + boxSize/4);
                ctx.closePath();
                ctx.fill();
                
                ctx.restore();
            }
        }
        
        // 绘制蛇身
        function drawSnakeBody(x, y, index) {
            if (bodyImage) {
                ctx.save();
                ctx.beginPath();
                ctx.roundRect(x, y, boxSize, boxSize, [boxSize/4]);
                ctx.closePath();
                ctx.clip();
                
                ctx.drawImage(bodyImage, x, y, boxSize, boxSize);
                ctx.restore();
            } else {
                ctx.save();
                
                const hue = 120;
                const saturation = 70;
                const lightness = 50 + (index % 2) * 5;
                
                ctx.fillStyle = `hsl(${hue}, ${saturation}%, ${lightness}%)`;
                
                const cornerRadius = boxSize / 4;
                ctx.beginPath();
                ctx.roundRect(x, y, boxSize, boxSize, [cornerRadius]);
                ctx.fill();
                
                ctx.strokeStyle = `hsl(${hue}, ${saturation}%, ${lightness-10}%)`;
                ctx.lineWidth = 1;
                
                ctx.beginPath();
                ctx.moveTo(x + boxSize/4, y + boxSize/3);
                ctx.bezierCurveTo(
                    x + boxSize/3, y + boxSize/3 + boxSize/10,
                    x + boxSize*2/3, y + boxSize/3 - boxSize/10,
                    x + boxSize*3/4, y + boxSize/3
                );
                ctx.moveTo(x + boxSize/4, y + boxSize*2/3);
                ctx.bezierCurveTo(
                    x + boxSize/3, y + boxSize*2/3 + boxSize/10,
                    x + boxSize*2/3, y + boxSize*2/3 - boxSize/10,
                    x + boxSize*3/4, y + boxSize*2/3
                );
                ctx.stroke();
                
                ctx.restore();
            }
        }
        
        // 绘制食物
        function drawFood() {
            const centerX = food.x + boxSize / 2;
            const centerY = food.y + boxSize / 2;
            const radius = boxSize / 2;
            
            ctx.fillStyle = '#FF5722';
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#4CAF50';
            ctx.beginPath();
            ctx.moveTo(centerX - radius/2, centerY - radius);
            ctx.lineTo(centerX, centerY - radius*1.5);
            ctx.lineTo(centerX + radius/2, centerY - radius);
            ctx.closePath();
            ctx.fill();
            
            ctx.fillStyle = '#795548';
            const seedCount = 8;
            for (let i = 0; i < seedCount; i++) {
                const angle = (i / seedCount) * Math.PI * 2;
                const seedX = centerX + Math.cos(angle) * radius * 0.7;
                const seedY = centerY + Math.sin(angle) * radius * 0.7;
                
                ctx.beginPath();
                ctx.arc(seedX, seedY, radius/8, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // 绘制游戏
        function drawGame() {
            // 清空画布
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制蛇
            for (let i = 0; i < snake.length; i++) {
                if (i === 0) {
                    drawSnakeHead(snake[i].x, snake[i].y);
                } else {
                    drawSnakeBody(snake[i].x, snake[i].y, i);
                }
            }
            
            // 绘制食物
            drawFood();
        }
        
        // 游戏结束
        function gameOver() {
            clearInterval(gameInterval);
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreElement.textContent = `最高分: ${highScore}`;
            }
            
            finalScoreElement.textContent = `你的分数: ${score}`;
            gameOverElement.style.display = 'flex';
        }
        
        // 图片上传处理 - 头部
        uploadHeadBtn.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    headPreviewImg.src = event.target.result;
                    headPreviewContainer.style.display = 'block';
                    
                    headImage = new Image();
                    headImage.src = event.target.result;
                    headImage.onload = function() {
                        if (gameInterval) {
                            drawGame();
                        }
                    };
                };
                reader.readAsDataURL(file);
            }
        });
        
        // 图片上传处理 - 身体
        uploadBodyBtn.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    bodyPreviewImg.src = event.target.result;
                    bodyPreviewContainer.style.display = 'block';
                    
                    bodyImage = new Image();
                    bodyImage.src = event.target.result;
                    bodyImage.onload = function() {
                        if (gameInterval) {
                            drawGame();
                        }
                    };
                };
                reader.readAsDataURL(file);
            }
        });
        
        // 开始游戏按钮
        startBtn.addEventListener('click', function() {
            initGame();
        });
        
        // 重新开始按钮
        restartBtn.addEventListener('click', function() {
            gameOverElement.style.display = 'none';
            initGame();
        });
        
        // 触摸控制
        canvas.addEventListener('touchstart', function(e) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            e.preventDefault();
        });
        
        canvas.addEventListener('touchmove', function(e) {
            const touchEndX = e.touches[0].clientX;
            const touchEndY = e.touches[0].clientY;
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;
            
            const threshold = 20;
            
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > threshold) {
                if (dx > 0 && direction !== 'LEFT') {
                    nextDirection = 'RIGHT';
                } else if (dx < 0 && direction !== 'RIGHT') {
                    nextDirection = 'LEFT';
                }
            } else if (Math.abs(dy) > threshold) {
                if (dy > 0 && direction !== 'UP') {
                    nextDirection = 'DOWN';
                } else if (dy < 0 && direction !== 'DOWN') {
                    nextDirection = 'UP';
                }
            }
            
            e.preventDefault();
        });
        
        // 窗口大小变化监听
        window.addEventListener('resize', handleResize);
        
        // 初始化画布
        initCanvas();
    </script>
</body>
</html>
