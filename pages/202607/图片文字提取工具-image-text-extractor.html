<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片文字提取工具</title>
    <!-- 引入Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 引入Tesseract.js用于OCR识别 -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.3/dist/tesseract.min.js"></script>
    
    <!-- 配置Tailwind自定义颜色和工具类 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#10b981',
                        neutral: '#f3f4f6',
                        dark: '#1e293b',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .transition-all-300 {
                transition: all 300ms ease;
            }
            .shadow-hover {
                transition: box-shadow 0.3s ease;
            }
            .shadow-hover:hover {
                box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.1), 0 8px 10px -6px rgba(59, 130, 246, 0.1);
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-dark">
    <!-- 主容器 -->
    <div class="container mx-auto px-4 py-8 max-w-5xl">
        <!-- 页面标题 -->
        <header class="text-center mb-10">
            <h1 class="text-[clamp(2rem,5vw,3rem)] font-bold text-dark mb-2">图片文字提取工具</h1>
            <p class="text-gray-600 text-[clamp(1rem,2vw,1.2rem)]">轻松从图片中提取文字内容</p>
        </header>
        
        <!-- 主内容区 -->
        <main class="bg-white rounded-xl shadow-lg p-6 md:p-8">
            <!-- 上传区域 -->
            <section class="mb-8">
                <div id="upload-area" class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center cursor-pointer transition-all-300 hover:border-primary hover:bg-blue-50">
                    <input type="file" id="file-input" accept="image/*" class="hidden" />
                    <div class="flex flex-col items-center">
                        <i class="fa fa-cloud-upload text-5xl text-gray-400 mb-4"></i>
                        <h3 class="text-lg font-medium mb-2">点击或拖拽图片到此处上传</h3>
                        <p class="text-gray-500 text-sm mb-4">支持 JPG、PNG、WEBP 等常见图片格式</p>
                        <button id="browse-btn" class="bg-primary hover:bg-primary/90 text-white px-6 py-2 rounded-lg transition-all-300 shadow-hover">
                            <i class="fa fa-file-image-o mr-2"></i>选择图片
                        </button>
                    </div>
                    <!-- 预览区域 (默认隐藏) -->
                    <div id="preview-container" class="mt-6 hidden">
                        <img id="image-preview" class="max-h-[200px] md:max-h-[300px] mx-auto rounded-lg object-contain shadow-md" src="" alt="预览图片" />
                        <button id="remove-image" class="mt-4 text-red-500 hover:text-red-700 transition-all-300">
                            <i class="fa fa-times-circle mr-1"></i>移除图片
                        </button>
                    </div>
                </div>
            </section>
            
            <!-- 操作按钮 -->
            <section class="flex justify-center mb-8">
                <button id="recognize-btn" class="bg-secondary hover:bg-secondary/90 text-white px-8 py-3 rounded-lg text-lg font-medium transition-all-300 shadow-hover disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    <i class="fa fa-magic mr-2"></i>开始识别
                </button>
            </section>
            
            <!-- 识别状态 (默认隐藏) -->
            <section id="status-container" class="mb-8 hidden">
                <div class="bg-neutral rounded-lg p-4">
                    <div class="flex items-center mb-2">
                        <i id="status-icon" class="fa fa-spinner fa-spin text-primary mr-2"></i>
                        <span id="status-text" class="text-gray-700">正在识别中，请稍候...</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div id="progress-bar" class="bg-primary h-2.5 rounded-full" style="width: 0%"></div>
                    </div>
                </div>
            </section>
            
            <!-- 结果显示区域 (默认隐藏) -->
            <section id="result-container" class="mb-6 hidden">
                <div class="border border-gray-200 rounded-lg">
                    <div class="flex justify-between items-center px-4 py-2 bg-gray-50 border-b border-gray-200 rounded-t-lg">
                        <h3 class="font-medium">识别结果</h3>
                        <button id="copy-btn" class="text-primary hover:text-primary/80 transition-all-300">
                            <i class="fa fa-copy mr-1"></i>复制文本
                        </button>
                    </div>
                    <div class="p-4">
                        <textarea id="result-text" class="w-full h-[200px] p-4 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary resize-none" readonly></textarea>
                    </div>
                </div>
                <!-- 复制成功提示 (默认隐藏) -->
                <div id="copy-success" class="hidden mt-2 text-center text-green-500">
                    <i class="fa fa-check-circle mr-1"></i>文本已复制到剪贴板
                </div>
            </section>
        </main>
        
        <!-- 页脚 -->
        <footer class="text-center mt-8 text-gray-600 text-sm">
            <p>© 2023 图片文字提取工具 - 快速、准确地提取图片中的文字</p>
        </footer>
    </div>
    
    <!-- 脚本 -->
    <script>
        // DOM 元素引用
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const browseBtn = document.getElementById('browse-btn');
        const previewContainer = document.getElementById('preview-container');
        const imagePreview = document.getElementById('image-preview');
        const removeImage = document.getElementById('remove-image');
        const recognizeBtn = document.getElementById('recognize-btn');
        const statusContainer = document.getElementById('status-container');
        const statusIcon = document.getElementById('status-icon');
        const statusText = document.getElementById('status-text');
        const progressBar = document.getElementById('progress-bar');
        const resultContainer = document.getElementById('result-container');
        const resultText = document.getElementById('result-text');
        const copyBtn = document.getElementById('copy-btn');
        const copySuccess = document.getElementById('copy-success');
        
        // 变量
        let selectedImage = null;
        let recognitionWorker = null;
        
        // 事件监听器
        browseBtn.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('click', (e) => {
            if (e.target === uploadArea || e.target === uploadArea.querySelector('i') || 
                e.target === uploadArea.querySelector('h3') || e.target === uploadArea.querySelector('p')) {
                fileInput.click();
            }
        });
        
        // 文件选择处理
        fileInput.addEventListener('change', handleFileSelect);
        
        // 拖拽功能
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('border-primary', 'bg-blue-50');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('border-primary', 'bg-blue-50');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('border-primary', 'bg-blue-50');
            
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                handleFile(e.dataTransfer.files[0]);
            }
        });
        
        // 移除图片
        removeImage.addEventListener('click', resetUploadArea);
        
        // 开始识别
        recognizeBtn.addEventListener('click', startRecognition);
        
        // 复制文本
        copyBtn.addEventListener('click', copyToClipboard);
        
        // 函数定义
        function handleFileSelect(e) {
            if (e.target.files && e.target.files[0]) {
                handleFile(e.target.files[0]);
            }
        }
        
        function handleFile(file) {
            if (!file.type.match('image.*')) {
                alert('请选择有效的图片文件');
                return;
            }
            
            selectedImage = file;
            
            // 显示预览
            const reader = new FileReader();
            reader.onload = (e) => {
                imagePreview.src = e.target.result;
                previewContainer.classList.remove('hidden');
                recognizeBtn.removeAttribute('disabled');
                uploadArea.classList.add('border-primary');
            };
            reader.readAsDataURL(file);
        }
        
        function resetUploadArea() {
            selectedImage = null;
            fileInput.value = '';
            previewContainer.classList.add('hidden');
            imagePreview.src = '';
            recognizeBtn.setAttribute('disabled', 'true');
            uploadArea.classList.remove('border-primary');
            resultContainer.classList.add('hidden');
            statusContainer.classList.add('hidden');
            
            // 终止正在进行的识别任务
            if (recognitionWorker) {
                recognitionWorker.terminate();
                recognitionWorker = null;
            }
        }
        
        // 图片预处理函数 - 调整图片大小以提高识别速度
        function preprocessImage(imageSrc) {
            return new Promise((resolve) => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const img = new Image();
                
                img.onload = function() {
                    // 调整图片大小，最大宽度和高度为1000像素
                    const MAX_DIMENSION = 1000;
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > height) {
                        if (width > MAX_DIMENSION) {
                            height *= MAX_DIMENSION / width;
                            width = MAX_DIMENSION;
                        }
                    } else {
                        if (height > MAX_DIMENSION) {
                            width *= MAX_DIMENSION / height;
                            height = MAX_DIMENSION;
                        }
                    }
                    
                    canvas.width = Math.floor(width);
                    canvas.height = Math.floor(height);
                    
                    // 在画布上绘制调整后的图片
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    // 转换为DataURL并返回
                    resolve(canvas.toDataURL('image/jpeg', 0.9));
                };
                
                img.src = imageSrc;
            });
        }
        
        async function startRecognition() {
            if (!selectedImage) return;
            
            // 重置状态
            resultContainer.classList.add('hidden');
            statusContainer.classList.remove('hidden');
            statusIcon.className = 'fa fa-spinner fa-spin text-primary mr-2';
            statusText.textContent = '正在准备识别...';
            progressBar.style.width = '0%';
            
            try {
                // 1. 首先进行图片预处理
                statusText.textContent = '正在预处理图片...';
                const reader = new FileReader();
                const imageDataUrl = await new Promise((resolve) => {
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(selectedImage);
                });
                
                // 预处理图片，减小尺寸以提高速度
                const processedImageUrl = await preprocessImage(imageDataUrl);
                
                // 2. 创建Tesseract worker
                statusText.textContent = '正在初始化识别引擎...';
                
                // 创建worker实例
                recognitionWorker = await Tesseract.createWorker('chi_sim+eng', 1, {
                    logger: (m) => {
                        // 更新进度条
                        if (m.progress) {
                            const progress = Math.round(m.progress * 100);
                            progressBar.style.width = `${progress}%`;
                        }
                        
                        // 更新状态信息
                        if (m.status) {
                            switch (m.status) {
                                case 'loading tesseract core':
                                    statusText.textContent = '正在加载OCR引擎...';
                                    break;
                                case 'loading language traineddata':
                                    statusText.textContent = '正在加载语言数据...';
                                    break;
                                case 'initializing api':
                                    statusText.textContent = '正在初始化识别API...';
                                    break;
                                case 'recognizing text':
                                    statusText.textContent = '正在识别文字...';
                                    break;
                                default:
                                    statusText.textContent = m.status;
                            }
                        }
                    },
                });
                
                // 配置识别参数
                await recognitionWorker.setParameters({
                    tessedit_do_invert: 0,
                    tessedit_pageseg_mode: 3,
                    tessedit_ocr_engine_mode: 1,
                });
                
                // 执行识别
                const result = await recognitionWorker.recognize(processedImageUrl);
                
                // 终止worker
                await recognitionWorker.terminate();
                recognitionWorker = null;
                
                // 显示结果
                statusIcon.className = 'fa fa-check text-green-500 mr-2';
                statusText.textContent = '识别完成';
                resultText.value = result.data.text;
                
                // 延迟显示结果区域，让用户看到完成状态
                setTimeout(() => {
                    statusContainer.classList.add('hidden');
                    resultContainer.classList.remove('hidden');
                }, 500);
                
            } catch (error) {
                console.error('识别错误:', error);
                
                // 终止worker
                if (recognitionWorker) {
                    await recognitionWorker.terminate().catch(() => {});
                    recognitionWorker = null;
                }
                
                // 更详细的错误提示
                statusIcon.className = 'fa fa-exclamation-triangle text-red-500 mr-2';
                
                // 根据错误类型提供更具体的提示
                let errorMessage = '识别失败，请重试';
                if (error.toString().includes('NetworkError')) {
                    errorMessage = '网络连接失败，请检查您的网络';
                } else if (error.toString().includes('timeout')) {
                    errorMessage = '识别超时，请尝试较小的图片';
                }
                
                statusText.textContent = errorMessage;
                alert(errorMessage + '\n\n详细错误: ' + error.message);
            }
        }
        
        function copyToClipboard() {
            resultText.select();
            document.execCommand('copy');
            
            // 显示复制成功提示
            copySuccess.classList.remove('hidden');
            setTimeout(() => {
                copySuccess.classList.add('hidden');
            }, 2000);
        }
    </script>
</body>
</html>
