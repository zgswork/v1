<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爱心动画</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        #container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }
        
        .heart {
            position: absolute;
            pointer-events: none;
            opacity: 0;
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        .love-text {
            color: white;
            font-size: 4rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            animation: pulse 2s infinite;
            z-index: 2;
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }
        
        #input-container {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }
        
        #text-input {
            padding: 10px 15px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            margin-bottom: 10px;
            width: 80%;
            max-width: 300px;
            text-align: center;
        }
        
        #submit-btn {
            padding: 10px 20px;
            background-color: #ff66b2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s;
        }
        
        #submit-btn:hover {
            background-color: #ff3385;
        }
        
        #custom-text {
            color: white;
            font-size: 4rem;
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            z-index: 2;
            animation: fadeIn 1s, pulse 2s infinite;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        
        @media (max-width: 768px) {
            .love-text, #custom-text {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="love-text">I LOVE U</div>
        <div id="custom-text"></div>
    </div>

    <div id="input-container">
        <input type="text" id="text-input" placeholder="输入你想说的话">
        <button id="submit-btn">显示文字</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 创建爱心
            function createHearts() {
                const container = document.getElementById('container');
                const heartCount = Math.floor(window.innerWidth / 10);
                
                for (let i = 0; i < heartCount; i++) {
                    const heart = document.createElement('div');
                    heart.classList.add('heart');
                    heart.innerHTML = '❤️';
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.top = Math.random() * 100 + 'vh';
                    heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
                    heart.style.animationDuration = (Math.random() * 4 + 3) + 's';
                    heart.style.animationDelay = Math.random() * 5 + 's';
                    container.appendChild(heart);
                }
            }
            
            // 处理用户输入
            document.getElementById('submit-btn').addEventListener('click', function() {
                const inputText = document.getElementById('text-input').value;
                if (inputText.trim() !== '') {
                    document.getElementById('custom-text').textContent = inputText;
                }
            });
            
            // 回车键提交
            document.getElementById('text-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    document.getElementById('submit-btn').click();
                }
            });
            
            // 初始化
            createHearts();
            
            // 窗口大小改变时重新创建爱心
            window.addEventListener('resize', function() {
                const hearts = document.querySelectorAll('.heart');
                hearts.forEach(heart => heart.remove());
                createHearts();
            });
        });
    </script>
</body>
</html>
