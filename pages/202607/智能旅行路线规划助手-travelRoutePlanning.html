<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能旅行路线规划助手</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --accent-color: #4cc9f0;
            --light-color: #f8f9fa;
            --dark-color: #212529;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
            min-height: 100vh;
            padding-bottom: 40px;
        }
        
        .header {
            background: linear-gradient(120deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 20px 0;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.8rem;
        }
        
        .logo i {
            color: var(--accent-color);
        }
        
        .container {
            max-width: 1300px;
            margin-top: 10px;
        }
        
        .card {
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            border: none;
            margin-bottom: 25px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .card-header {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 15px 20px;
            font-weight: 600;
            font-size: 1.1rem;
        }
        
        .btn-primary {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            border: none;
            padding: 10px 20px;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            background: linear-gradient(to right, var(--secondary-color), var(--primary-color));
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(67, 97, 238, 0.3);
        }
        
        #map {
            height: 400px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        
        .itinerary-item {
            border-left: 3px solid var(--primary-color);
            padding: 15px;
            margin-bottom: 15px;
            background-color: white;
            border-radius: 0 8px 8px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }
        
        .itinerary-item:hover {
            background-color: #f0f5ff;
            transform: translateX(5px);
        }
        
        .time-badge {
            background: linear-gradient(to right, #4cc9f0, #4895ef);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 500;
        }
        
        .poi-list-item {
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 8px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .poi-list-item:hover {
            background-color: #f0f5ff;
        }
        
        .selected-poi-item {
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
            background-color: #f0f5ff;
            border-left: 3px solid var(--primary-color);
        }
        
        .tab-content {
            padding: 20px;
            background-color: white;
            border-radius: 0 0 15px 15px;
        }
        
        .nav-tabs .nav-link {
            font-weight: 600;
            color: #6c757d;
            border: none;
            padding: 12px 20px;
            border-radius: 0;
        }
        
        .nav-tabs .nav-link.active {
            color: var(--primary-color);
            background: transparent;
            border-bottom: 3px solid var(--primary-color);
        }
        
        .poi-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(to right, var(--accent-color), var(--primary-color));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .stats-card {
            text-align: center;
            padding: 15px;
        }
        
        .stats-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        
        .stats-label {
            color: #6c757d;
            font-size: 0.9rem;
        }
        
        .transport-icon {
            font-size: 1.5rem;
            margin-right: 10px;
            color: var(--primary-color);
        }
        
        .action-btn {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .result-section {
            display: none;
        }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #6c757d;
            font-size: 0.9rem;
        }
        
        .progress-container {
            margin: 20px 0;
            background-color: #e9ecef;
            border-radius: 10px;
            height: 10px;
        }
        
        .progress-bar {
            background: linear-gradient(to right, var(--accent-color), var(--primary-color));
            border-radius: 10px;
        }
        
        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            color: var(--dark-color);
        }
        
        .section-title i {
            color: var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <div class="logo">
                    <i class="fas fa-route"></i>
                    <span>智能旅行规划助手</span>
                </div>
                <div>
                    <button class="btn btn-light"><i class="fas fa-user me-2"></i>登录</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="container">
        <div class="row">
            <!-- 左侧输入区域 -->
            <div class="col-lg-5">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-map-marker-alt me-2"></i>选择目的地和景点
                    </div>
                    <div class="card-body">
                        <div class="mb-4">
                            <div class="section-title">
                                <i class="fas fa-city"></i>
                                <h5 class="mb-0">目的地城市</h5>
                            </div>
                            <select class="form-select form-select-lg" id="destination">
                                <option value="beijing">北京</option>
                                <option value="shanghai">上海</option>
                                <option value="guangzhou">广州</option>
                                <option value="shenzhen">深圳</option>
                                <option value="chengdu">成都</option>
                            </select>
                        </div>
                        
                        <div class="mb-4">
                            <div class="section-title">
                                <i class="fas fa-search me-1"></i>
                                <h5 class="mb-0">添加景点</h5>
                            </div>
                            <div class="input-group mb-3">
                                <input type="text" class="form-control form-control-lg" id="poi-search" placeholder="搜索景点...">
                                <button class="btn btn-primary" type="button" id="search-btn">
                                    <i class="fas fa-search"></i>
                                </button>
                            </div>
                            
                            <div id="poi-list" class="list-group" style="max-height: 250px; overflow-y: auto;">
                                <!-- 景点列表将通过JavaScript动态生成 -->
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <div class="section-title">
                                    <i class="fas fa-map-pin"></i>
                                    <h5 class="mb-0">已选景点</h5>
                                </div>
                                <span id="selected-count" class="badge bg-primary">0</span>
                            </div>
                            <div id="selected-pois" class="list-group">
                                <div class="text-center text-muted py-4" id="no-poi-message">
                                    <i class="fas fa-landmark fa-2x mb-3"></i>
                                    <p>请从左侧添加景点</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-sliders-h me-2"></i>设置行程参数
                    </div>
                    <div class="card-body">
                        <div class="row mb-4">
                            <div class="col-md-6 mb-3 mb-md-0">
                                <label for="start-date" class="form-label fw-bold">开始日期</label>
                                <input type="date" class="form-control form-control-lg" id="start-date">
                            </div>
                            <div class="col-md-6">
                                <label for="days" class="form-label fw-bold">旅行天数</label>
                                <select class="form-select form-select-lg" id="days">
                                    <option value="1">1天</option>
                                    <option value="2">2天</option>
                                    <option value="3" selected>3天</option>
                                    <option value="4">4天</option>
                                    <option value="5">5天</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="row mb-4">
                            <div class="col-md-6 mb-3 mb-md-0">
                                <label for="start-time" class="form-label fw-bold">每日开始时间</label>
                                <input type="time" class="form-control form-control-lg" id="start-time" value="09:00">
                            </div>
                            <div class="col-md-6">
                                <label for="end-time" class="form-label fw-bold">每日结束时间</label>
                                <input type="time" class="form-control form-control-lg" id="end-time" value="18:00">
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label for="transport" class="form-label fw-bold">交通方式</label>
                            <div class="d-flex align-items-center">
                                <span class="transport-icon">
                                    <i class="fas fa-walking" id="walk-icon"></i>
                                </span>
                                <select class="form-select form-select-lg" id="transport">
                                    <option value="walking">步行</option>
                                    <option value="driving" selected>自驾/出租车</option>
                                    <option value="transit">公共交通</option>
                                </select>
                            </div>
                        </div>
                        
                        <button id="generate-btn" class="btn btn-primary btn-lg w-100 py-3">
                            <i class="fas fa-bolt me-2"></i>生成智能路线
                        </button>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-chart-line me-2"></i>行程概览
                    </div>
                    <div class="card-body">
                        <div class="row text-center">
                            <div class="col-md-4 mb-3">
                                <div class="stats-card">
                                    <div class="stats-number" id="total-pois">0</div>
                                    <div class="stats-label">景点数量</div>
                                </div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <div class="stats-card">
                                    <div class="stats-number" id="total-days">3</div>
                                    <div class="stats-label">旅行天数</div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="stats-card">
                                    <div class="stats-number" id="total-hours">0</div>
                                    <div class="stats-label">总游览时间</div>
                                </div>
                            </div>
                        </div>
                        <div class="mt-3">
                            <div class="d-flex justify-content-between mb-2">
                                <span>行程规划进度</span>
                                <span id="progress-percent">0%</span>
                            </div>
                            <div class="progress-container">
                                <div class="progress-bar" id="progress-bar" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 右侧结果展示区域 -->
            <div class="col-lg-7">
                <div class="card result-section" id="result-section">
                    <div class="card-header">
                        <i class="fas fa-map-marked-alt me-2"></i>您的智能旅行路线
                    </div>
                    <div class="card-body">
                        <div id="map"></div>
                        
                        <div class="mt-4">
                            <ul class="nav nav-tabs" id="day-tabs" role="tablist">
                                <!-- 天数标签将通过JavaScript动态生成 -->
                            </ul>
                            
                            <div class="tab-content" id="day-tabs-content">
                                <!-- 每日行程内容将通过JavaScript动态生成 -->
                            </div>
                        </div>
                        
                        <div class="action-btn">
                            <button id="export-btn" class="btn btn-outline-primary flex-grow-1">
                                <i class="fas fa-file-pdf me-2"></i>导出PDF
                            </button>
                            <button id="share-btn" class="btn btn-outline-secondary flex-grow-1">
                                <i class="fas fa-share-alt me-2"></i>分享行程
                            </button>
                            <button id="save-btn" class="btn btn-primary flex-grow-1">
                                <i class="fas fa-save me-2"></i>保存行程
                            </button>
                        </div>
                    </div>
                </div>
                
                <div class="text-center py-5" id="welcome-section">
                    <i class="fas fa-route fa-4x mb-4" style="color: #4361ee;"></i>
                    <h3 class="mb-3">创建您的完美旅行路线</h3>
                    <p class="text-muted mb-4">选择目的地、添加景点并设置参数，然后点击"生成智能路线"按钮</p>
                    <div class="d-flex justify-content-center">
                        <div class="card border-0 bg-transparent">
                            <div class="card-body">
                                <div class="d-flex justify-content-around">
                                    <div class="text-center px-4">
                                        <div class="mb-3">
                                            <i class="fas fa-map-marker-alt fa-2x" style="color: #4cc9f0;"></i>
                                        </div>
                                        <div>选择目的地</div>
                                    </div>
                                    <div class="text-center px-4">
                                        <div class="mb-3">
                                            <i class="fas fa-landmark fa-2x" style="color: #4895ef;"></i>
                                        </div>
                                        <div>添加景点</div>
                                    </div>
                                    <div class="text-center px-4">
                                        <div class="mb-3">
                                            <i class="fas fa-cogs fa-2x" style="color: #4361ee;"></i>
                                        </div>
                                        <div>设置参数</div>
                                    </div>
                                    <div class="text-center px-4">
                                        <div class="mb-3">
                                            <i class="fas fa-bolt fa-2x" style="color: #3f37c9;"></i>
                                        </div>
                                        <div>生成路线</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="footer">
        <div class="container">
            <p>© 2023 智能旅行规划助手 | 让您的旅行更轻松、更智能</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
    <script>
        // 修复问题：1. 搜索功能无效 2. 生成路线功能无效
        
        // 增强的景点数据
        const poiData = {
            beijing: [
                { id: 1, name: "故宫", duration: 180, lat: 39.916, lng: 116.397, type: "历史遗迹", desc: "中国明清两代的皇家宫殿" },
                { id: 2, name: "天安门广场", duration: 60, lat: 39.907, lng: 116.397, type: "广场", desc: "世界上最大的城市广场" },
                { id: 3, name: "颐和园", duration: 150, lat: 39.999, lng: 116.275, type: "公园", desc: "中国清朝时期皇家园林" },
                { id: 4, name: "长城(八达岭)", duration: 240, lat: 40.359, lng: 116.020, type: "历史遗迹", desc: "世界文化遗产，中国古代军事防御工程" },
                { id: 5, name: "天坛", duration: 90, lat: 39.883, lng: 116.412, type: "历史遗迹", desc: "明清两代帝王祭天之地" },
                { id: 6, name: "北海公园", duration: 90, lat: 39.925, lng: 116.387, type: "公园", desc: "中国现存最古老、最完整的皇家园林" },
                { id: 7, name: "南锣鼓巷", duration: 120, lat: 39.940, lng: 116.404, type: "文化街区", desc: "北京最古老的街区之一，充满胡同文化" },
                { id: 8, name: "鸟巢", duration: 90, lat: 39.993, lng: 116.396, type: "现代建筑", desc: "2008年北京奥运会主体育场" },
                { id: 9, name: "798艺术区", duration: 120, lat: 39.984, lng: 116.498, type: "艺术区", desc: "当代艺术展示和创作中心" }
            ],
            shanghai: [
                { id: 10, name: "外滩", duration: 90, lat: 31.241, lng: 121.490, type: "滨水区", desc: "上海著名的风景线，黄浦江畔" },
                { id: 11, name: "东方明珠", duration: 120, lat: 31.240, lng: 121.495, type: "塔", desc: "上海标志性建筑之一" },
                { id: 12, name: "南京路步行街", duration: 120, lat: 31.238, lng: 121.475, type: "购物区", desc: "上海最繁华的商业街" },
                { id: 13, name: "豫园", duration: 90, lat: 31.227, lng: 121.487, type: "园林", desc: "江南古典园林的代表" },
                { id: 14, name: "上海迪士尼乐园", duration: 480, lat: 31.144, lng: 121.658, type: "主题公园", desc: "中国大陆首座迪士尼主题乐园" },
                { id: 15, name: "田子坊", duration: 120, lat: 31.207, lng: 121.469, type: "文化街区", desc: "上海特色里弄创意产业聚集区" },
                { id: 16, name: "上海博物馆", duration: 150, lat: 31.230, lng: 121.475, type: "博物馆", desc: "中国古代艺术博物馆" }
            ],
            chengdu: [
                { id: 17, name: "大熊猫繁育研究基地", duration: 180, lat: 30.740, lng: 104.147, type: "自然保护区", desc: "观赏大熊猫的最佳地点" },
                { id: 18, name: "宽窄巷子", duration: 120, lat: 30.669, lng: 104.064, type: "文化街区", desc: "成都历史文化保护区" },
                { id: 19, name: "锦里", duration: 120, lat: 30.655, lng: 104.048, type: "古街", desc: "成都最古老的街道之一" },
                { id: 20, name: "都江堰", duration: 240, lat: 31.008, lng: 103.607, type: "水利工程", desc: "世界文化遗产，古代水利工程" }
            ]
        };

        // 初始化变量
        let map;
        let markers = [];
        let selectedPois = [];
        
        // 初始化地图
        function initMap() {
            map = L.map('map').setView([39.916, 116.397], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);
        }
        
        // 渲染景点列表
        function renderPoiList(city) {
            const poiList = document.getElementById('poi-list');
            poiList.innerHTML = '';
            
            if (!poiData[city]) return;
            
            poiData[city].forEach(poi => {
                const item = document.createElement('button');
                item.className = 'list-group-item list-group-item-action poi-list-item';
                item.innerHTML = `
                    <div class="poi-icon">
                        <i class="fas fa-landmark"></i>
                    </div>
                    <div>
                        <div class="fw-bold">${poi.name}</div>
                        <small class="text-muted">${poi.type} · ${Math.floor(poi.duration/60)}小时${poi.duration%60}分钟</small>
                    </div>
                `;
                item.dataset.id = poi.id;
                item.addEventListener('click', () => addSelectedPoi(poi));
                poiList.appendChild(item);
            });
        }
        
        // 添加已选景点
        function addSelectedPoi(poi) {
            if (selectedPois.some(p => p.id === poi.id)) return;
            
            selectedPois.push(poi);
            renderSelectedPois();
            updateStats();
            
            // 隐藏空状态消息
            document.getElementById('no-poi-message').style.display = 'none';
        }
        
        // 渲染已选景点
        function renderSelectedPois() {
            const container = document.getElementById('selected-pois');
            container.innerHTML = '';
            
            if (selectedPois.length === 0) {
                document.getElementById('no-poi-message').style.display = 'block';
                return;
            }
            
            selectedPois.forEach((poi, index) => {
                const item = document.createElement('div');
                item.className = 'selected-poi-item';
                
                const text = document.createElement('div');
                text.innerHTML = `
                    <div class="fw-bold">${index + 1}. ${poi.name}</div>
                    <small class="text-muted">${poi.type} · ${Math.floor(poi.duration/60)}小时${poi.duration%60}分钟</small>
                `;
                
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'btn btn-sm btn-outline-danger';
                deleteBtn.innerHTML = '<i class="fas fa-times"></i>';
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectedPois = selectedPois.filter(p => p.id !== poi.id);
                    renderSelectedPois();
                    updateStats();
                    
                    if (selectedPois.length === 0) {
                        document.getElementById('no-poi-message').style.display = 'block';
                    }
                });
                
                item.appendChild(text);
                item.appendChild(deleteBtn);
                container.appendChild(item);
            });
        }
        
        // 更新统计信息
        function updateStats() {
            document.getElementById('selected-count').textContent = selectedPois.length;
            document.getElementById('total-pois').textContent = selectedPois.length;
            
            // 计算总游览时间
            const totalMinutes = selectedPois.reduce((sum, poi) => sum + poi.duration, 0);
            const hours = Math.floor(totalMinutes / 60);
            document.getElementById('total-hours').textContent = hours;
            
            // 更新进度条
            const days = parseInt(document.getElementById('days').value);
            const progress = Math.min(100, Math.floor(selectedPois.length / (days * 4) * 100));
            document.getElementById('progress-bar').style.width = `${progress}%`;
            document.getElementById('progress-percent').textContent = `${progress}%`;
        }
        
        // 生成路线
        function generateItinerary() {
            if (selectedPois.length === 0) {
                alert('请至少选择一个景点');
                return;
            }
            
            const days = parseInt(document.getElementById('days').value);
            const startTime = document.getElementById('start-time').value;
            const endTime = document.getElementById('end-time').value;
            const transport = document.getElementById('transport').value;
            
            // 显示结果区域
            document.getElementById('result-section').style.display = 'block';
            document.getElementById('welcome-section').style.display = 'none';
            
            // 智能分组算法 - 按地理位置分组
            const groupedPois = groupPoisByLocation(selectedPois, days);
            
            renderItinerary(groupedPois, startTime, endTime);
            renderMapMarkers();
        }
        
        // 按地理位置分组算法
        function groupPoisByLocation(pois, days) {
            // 按经度排序
            pois.sort((a, b) => a.lng - b.lng);
            
            // 将景点分成若干组
            const poisPerDay = Math.ceil(pois.length / days);
            const groupedPois = [];
            
            for (let i = 0; i < days; i++) {
                groupedPois.push(pois.slice(i * poisPerDay, (i + 1) * poisPerDay));
            }
            
            return groupedPois;
        }
        
        // 渲染行程
        function renderItinerary(groupedPois, startTime, endTime) {
            const tabsContainer = document.getElementById('day-tabs');
            const contentContainer = document.getElementById('day-tabs-content');
            
            tabsContainer.innerHTML = '';
            contentContainer.innerHTML = '';
            
            groupedPois.forEach((pois, dayIndex) => {
                // 创建标签
                const tab = document.createElement('li');
                tab.className = 'nav-item';
                tab.innerHTML = `
                    <button class="nav-link ${dayIndex === 0 ? 'active' : ''}" id="day-${dayIndex + 1}-tab" data-bs-toggle="tab" 
                        data-bs-target="#day-${dayIndex + 1}" type="button" role="tab">
                        <i class="fas fa-calendar-day me-2"></i>第 ${dayIndex + 1} 天
                    </button>
                `;
                tabsContainer.appendChild(tab);
                
                // 创建内容
                const content = document.createElement('div');
                content.className = `tab-pane fade ${dayIndex === 0 ? 'show active' : ''}`;
                content.id = `day-${dayIndex + 1}`;
                content.setAttribute('role', 'tabpanel');
                
                if (pois.length === 0) {
                    content.innerHTML = '<div class="text-center py-5 text-muted"><i class="fas fa-umbrella-beach fa-3x mb-3"></i><p>这一天没有安排景点，享受自由时间吧！</p></div>';
                } else {
                    let currentTime = startTime;
                    
                    pois.forEach((poi, poiIndex) => {
                        const durationHours = Math.floor(poi.duration / 60);
                        const durationMinutes = poi.duration % 60;
                        
                        // 计算结束时间
                        const [hours, minutes] = currentTime.split(':').map(Number);
                        let endHours = hours + durationHours;
                        let endMinutes = minutes + durationMinutes;
                        
                        if (endMinutes >= 60) {
                            endHours += Math.floor(endMinutes / 60);
                            endMinutes = endMinutes % 60;
                        }
                        
                        const endTimeStr = `${String(endHours).padStart(2, '0')}:${String(endMinutes).padStart(2, '0')}`;
                        
                        const item = document.createElement('div');
                        item.className = 'itinerary-item';
                        item.innerHTML = `
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h5 class="mb-0"><i class="fas fa-map-marker-alt me-2" style="color: #4361ee;"></i>${poi.name}</h5>
                                <span class="time-badge">${currentTime} - ${endTimeStr}</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span><i class="fas fa-clock me-1"></i>游览时间: ${durationHours > 0 ? `${durationHours}小时` : ''}${durationMinutes > 0 ? `${durationMinutes}分钟` : ''}</span>
                                <span><i class="fas fa-tag me-1"></i>${poi.type}</span>
                            </div>
                            <p class="mb-0 text-muted">${poi.desc}</p>
                            ${poiIndex < pois.length - 1 ? `
                            <div class="mt-3 d-flex align-items-center text-primary">
                                <i class="fas fa-car me-2"></i>
                                <span>前往下一景点 (约${poiIndex % 2 === 0 ? 20 : 30}分钟交通时间)</span>
                            </div>
                            ` : ''}
                        `;
                        content.appendChild(item);
                        
                        // 更新时间（添加交通时间）
                        currentTime = endTimeStr;
                        const [newHours, newMinutes] = currentTime.split(':').map(Number);
                        let nextTimeHours = newHours;
                        let nextTimeMinutes = newMinutes + (poiIndex % 2 === 0 ? 20 : 30); // 交通时间
                        
                        if (nextTimeMinutes >= 60) {
                            nextTimeHours += Math.floor(nextTimeMinutes / 60);
                            nextTimeMinutes = nextTimeMinutes % 60;
                        }
                        
                        currentTime = `${String(nextTimeHours).padStart(2, '0')}:${String(nextTimeMinutes).padStart(2, '0')}`;
                    });
                }
                
                contentContainer.appendChild(content);
            });
            
            // 初始化标签
            if (groupedPois.length > 0) {
                new bootstrap.Tab(document.querySelector('#day-tabs .nav-link')).show();
            }
        }
        
        // 渲染地图标记
        function renderMapMarkers() {
            // 清除现有标记
            markers.forEach(marker => map.removeLayer(marker));
            markers = [];
            
            // 添加新标记
            selectedPois.forEach(poi => {
                const marker = L.marker([poi.lat, poi.lng])
                    .addTo(map)
                    .bindPopup(`<b>${poi.name}</b><br>${poi.type}`);
                markers.push(marker);
            });
            
            // 调整地图视图
            if (selectedPois.length > 0) {
                const group = new L.featureGroup(markers);
                map.fitBounds(group.getBounds().pad(0.2));
            }
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            renderPoiList('beijing');
            document.getElementById('total-days').textContent = document.getElementById('days').value;
            
            // 更新天数
            document.getElementById('days').addEventListener('change', function() {
                document.getElementById('total-days').textContent = this.value;
                updateStats();
            });
            
            // 修复搜索功能
            document.getElementById('search-btn').addEventListener('click', function() {
                const searchTerm = document.getElementById('poi-search').value.trim().toLowerCase();
                const city = document.getElementById('destination').value;
                
                if (!poiData[city]) return;
                
                const poiList = document.getElementById('poi-list');
                poiList.innerHTML = '';
                
                if (searchTerm === '') {
                    renderPoiList(city);
                    return;
                }
                
                const filteredPois = poiData[city].filter(poi => 
                    poi.name.toLowerCase().includes(searchTerm)
                );
                
                if (filteredPois.length === 0) {
                    poiList.innerHTML = '<div class="text-center py-4 text-muted"><i class="fas fa-search fa-2x mb-3"></i><p>没有找到匹配的景点</p></div>';
                    return;
                }
                
                filteredPois.forEach(poi => {
                    const item = document.createElement('button');
                    item.className = 'list-group-item list-group-item-action poi-list-item';
                    item.innerHTML = `
                        <div class="poi-icon">
                            <i class="fas fa-landmark"></i>
                        </div>
                        <div>
                            <div class="fw-bold">${poi.name}</div>
                            <small class="text-muted">${poi.type} · ${Math.floor(poi.duration/60)}小时${poi.duration%60}分钟</small>
                        </div>
                    `;
                    item.dataset.id = poi.id;
                    item.addEventListener('click', () => addSelectedPoi(poi));
                    poiList.appendChild(item);
                });
            });
            
            // 修复生成路线功能
            document.getElementById('generate-btn').addEventListener('click', generateItinerary);
            
            // 目的地变更时更新景点列表
            document.getElementById('destination').addEventListener('change', (e) => {
                renderPoiList(e.target.value);
                selectedPois = [];
                renderSelectedPois();
                updateStats();
                document.getElementById('no-poi-message').style.display = 'block';
            });
            
            // 设置默认日期为明天
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            document.getElementById('start-date').valueAsDate = tomorrow;
            
            // 导出功能
            document.getElementById('export-btn').addEventListener('click', () => {
                alert('行程已导出为PDF格式！');
            });
            
            // 分享功能
            document.getElementById('share-btn').addEventListener('click', () => {
                alert('行程分享链接已复制到剪贴板！');
            });
            
            // 保存功能
            document.getElementById('save-btn').addEventListener('click', () => {
                alert('行程已保存到您的账户！');
            });
        });
    </script>
</body>
</html>
