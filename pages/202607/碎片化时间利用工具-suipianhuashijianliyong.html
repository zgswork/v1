                    // 31-60分钟
                    {

                    {

                        duration: 60,

                    },
                    {
                        id: 't16',
                        name: '处理一个复杂任务',
                        duration: 50,
                        type: 'productivity',

                        description: '专注处理一个需要集中精力的复杂工作任务'
                    },
                    {

                        name: '准备健康餐食',
                        duration: 40,

                    }
                ];
                
                // 保存到本地存储
                localStorage.setItem('taskLibrary', JSON.stringify(this.taskLibrary));
            },
            
            // 加载用户数据
            loadUserData() {
                // 加载已完成的任务
                const completedTasks = localStorage.getItem('completedTasks');
                this.completedTasks = completedTasks ? JSON.parse(completedTasks) : [];
            },
            
            // 保存用户数据
            saveUserData() {
                localStorage.setItem('completedTasks', JSON.stringify(this.completedTasks));
            },
            
            // 初始化事件监听
            initEventListeners() {
                // 时长表单提交
                document.getElementById('timeForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.findTasks();
                });
                
                // 清除已完成任务
                document.getElementById('clearCompletedBtn').addEventListener('click', () => {
                    this.clearCompletedTasks();
                });
                
                // 打开添加任务模态框
                document.getElementById('addCustomTaskBtn').addEventListener('click', () => {
                    this.openModal();
                });
                
                // 关闭模态框
                document.getElementById('closeModalBtn').addEventListener('click', () => {
                    this.closeModal();
                });
                
                // 自定义任务表单提交
                document.getElementById('customTaskForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.addCustomTask();
                });
            },
            
            // 根据时长和类型查找合适的任务
            findTasks() {
                const minutes = parseInt(document.getElementById('minutes').value);
                const taskType = document.querySelector('input[name="taskType"]:checked').value;
                
                // 允许±30%的时长误差范围
                const minDuration = Math.max(1, Math.round(minutes * 0.7));
                const maxDuration = Math.round(minutes * 1.3);
                
                // 筛选符合条件的任务
                let matchingTasks = this.taskLibrary.filter(task => {
                    const durationMatch = task.duration >= minDuration && task.duration <= maxDuration;
                    const typeMatch = taskType === 'all' || task.type === taskType;
                    return durationMatch && typeMatch;
                });
                
                // 按时长接近程度排序
                matchingTasks.sort((a, b) => {
                    const diffA = Math.abs(a.duration - minutes);
                    const diffB = Math.abs(b.duration - minutes);
                    return diffA - diffB;
                });
                
                // 显示结果
                this.displayTasks(matchingTasks, minutes, taskType);
            },
            
            // 显示找到的任务
            displayTasks(tasks, minutes, taskType) {
                const container = document.getElementById('tasksContainer');
                const recommendationsSection = document.getElementById('recommendations');
                const noTasksMessage = document.getElementById('noTasksMessage');
                const resultCount = document.getElementById('resultCount');
                
                // 显示推荐区域
                recommendationsSection.classList.remove('hidden');
                
                // 更新结果数量
                resultCount.textContent = `${tasks.length} 个活动`;
                
                if (tasks.length === 0) {
                    // 没有找到匹配的任务
                    container.innerHTML = '';
                    noTasksMessage.classList.remove('hidden');
                    return;
                }
                
                // 隐藏无结果消息
                noTasksMessage.classList.add('hidden');
                
                // 清空容器
                container.innerHTML = '';
                
                // 添加"添加自定义活动"按钮
                const addTaskBtn = document.createElement('div');
                addTaskBtn.id = 'addCustomTaskBtn';
                addTaskBtn.className = 'task-card border-dashed border-gray-300 flex flex-col items-center justify-center p-6 text-gray-500 hover:text-primary hover:border-primary/50';
                addTaskBtn.innerHTML = `
                    <i class="fa fa-plus-circle text-3xl mb-2"></i>
                    <span>添加自定义活动</span>
                `;
                container.appendChild(addTaskBtn);
                
                // 为添加按钮添加事件
                addTaskBtn.addEventListener('click', () => {
                    this.openModal();
                });
                
                // 添加任务卡片
                tasks.forEach(task => {
                    // 检查任务是否已完成
                    const isCompleted = this.completedTasks.some(t => t.id === task.id && 
                        new Date(t.completedAt).toDateString() === new Date().toDateString());
                    
                    const taskCard = document.createElement('div');
                    taskCard.className = `task-card ${isCompleted ? 'completed' : ''}`;
                    taskCard.dataset.id = task.id;
                    
                    // 根据类型设置不同的标签颜色
                    let typeColorClass = '';
                    switch(task.type) {
                        case 'study':
                            typeColorClass = 'bg-purple-100 text-purple-800';
                            break;
                        case 'health':
                            typeColorClass = 'bg-green-100 text-green-800';
                            break;
                        case 'productivity':
                            typeColorClass = 'bg-blue-100 text-blue-800';
                            break;
                        case 'relaxation':
                            typeColorClass = 'bg-yellow-100 text-yellow-800';
                            break;
                    }
                    
                    taskCard.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-medium ${isCompleted ? 'line-through' : ''}">${task.name}</h3>
                            <div class="flex items-center">
                                <span class="text-xs px-2 py-0.5 rounded-full ${typeColorClass} mr-2">${task.typeText}</span>
                                <span class="text-sm text-gray-500">${task.duration}分钟</span>
                            </div>
                        </div>
                        
                        ${task.description ? `
                            <p class="text-sm text-gray-600 mb-3 line-clamp-2">${task.description}</p>
                        ` : ''}
                        
                        <div class="flex justify-end">
                            <button class="complete-task-btn btn-secondary text-sm flex items-center ${isCompleted ? 'opacity-50 cursor-not-allowed' : ''}">
                                <i class="fa ${isCompleted ? 'fa-check' : 'fa-check-circle-o'} mr-1"></i>
                                ${isCompleted ? '已完成' : '标记完成'}
                            </button>
                        </div>
                    `;
                    
                    container.appendChild(taskCard);
                    
                    // 添加完成任务事件
                    const completeBtn = taskCard.querySelector('.complete-task-btn');
                    if (!isCompleted) {
                        completeBtn.addEventListener('click', () => {
                            this.markTaskAsCompleted(task);
                            taskCard.classList.add('completed');
                            completeBtn.innerHTML = '<i class="fa fa-check mr-1"></i>已完成';
                            completeBtn.classList.add('opacity-50', 'cursor-not-allowed');
                            taskCard.querySelector('h3').classList.add('line-through');
                        });
                    }
                });
                
                // 滚动到结果区域
                recommendationsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            },
            
            // 标记任务为已完成
            markTaskAsCompleted(task) {
                // 添加到已完成任务列表
                this.completedTasks.push({
                    ...task,
                    completedAt: new Date().toISOString()
                });
                
                // 保存数据
                this.saveUserData();
                
                // 更新统计信息
                this.updateStatistics();
                
                // 重新渲染已完成任务
                this.renderCompletedTasks();
                
                // 显示提示
                this.showToast(`已完成：${task.name}`);
            },
            
            // 渲染已完成任务
            renderCompletedTasks() {
                const container = document.getElementById('completedTasksContainer');
                const section = document.getElementById('recentlyCompleted');
                const noMessage = document.getElementById('noCompletedTasksMessage');
                
                // 获取最近7天的已完成任务，按时间倒序排列
                const recentTasks = this.completedTasks
                    .filter(task => {
                        const taskDate = new Date(task.completedAt);
                        const sevenDaysAgo = new Date();
                        sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
                        return taskDate >= sevenDaysAgo;
                    })
                    .sort((a, b) => new Date(b.completedAt) - new Date(a.completedAt))
                    .slice(0, 6); // 最多显示6个
                
                if (recentTasks.length === 0) {
                    section.classList.add('hidden');
                    return;
                }
                
                // 显示最近完成区域
                section.classList.remove('hidden');
                noMessage.classList.add('hidden');
                container.innerHTML = '';
                
                // 添加已完成任务卡片
                recentTasks.forEach(task => {
                    // 格式化日期显示
                    const date = new Date(task.completedAt);
                    const isToday = date.toDateString() === new Date().toDateString();
                    const dateText = isToday 
                        ? `今天 ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`
                        : `${date.getMonth() + 1}月${date.getDate()}日`;
                    
                    const taskCard = document.createElement('div');
                    taskCard.className = 'task-card completed';
                    
                    taskCard.innerHTML = `
                        <div class="flex justify-between items-start mb-1">
                            <h3 class="font-medium line-through text-gray-600">${task.name}</h3>
                            <span class="text-xs text-gray-500">${dateText}</span>
                        </div>
                        <div class="text-sm text-gray-500">${task.duration}分钟 · ${task.typeText}</div>
                    `;
                    
                    container.appendChild(taskCard);
                });
            },
            
            // 清除已完成任务
            clearCompletedTasks() {
                if (this.completedTasks.length === 0) return;
                
                if (confirm('确定要清除所有已完成的活动记录吗？')) {
                    this.completedTasks = [];
                    this.saveUserData();
                    this.renderCompletedTasks();
                    this.updateStatistics();
                    this.showToast('已清除所有完成记录');
                }
            },
            
            // 添加自定义任务
            addCustomTask() {
                const name = document.getElementById('customTaskName').value.trim();
                const duration = parseInt(document.getElementById('customTaskDuration').value);
                const type = document.getElementById('customTaskType').value;
                const description = document.getElementById('customTaskDescription').value.trim();
                
                // 验证输入
                if (!name) {
                    this.showToast('请输入活动名称', 'error');
                    return;
                }
                
                if (!duration || duration < 1 || duration > 120) {
                    this.showToast('请输入有效的时长（1-120分钟）', 'error');
                    return;
                }
                
                // 获取类型文本
                const typeOptions = {
                    'study': '学习提升',
                    'health': '健康运动',
                    'productivity': '高效工作',
                    'relaxation': '放松休息'
                };
                const typeText = typeOptions[type];
                
                // 创建新任务
                const newTask = {
                    id: `custom-${Date.now()}`,
                    name,
                    duration,
                    type,
                    typeText,
                    description,
                    isCustom: true
                };
                
                // 添加到任务库
                this.taskLibrary.push(newTask);
                localStorage.setItem('taskLibrary', JSON.stringify(this.taskLibrary));
                
                // 关闭模态框并重置表单
                this.closeModal();
                document.getElementById('customTaskForm').reset();
                
                // 显示提示
                this.showToast('自定义活动已添加');
                
                // 自动搜索匹配新任务的时长
                document.getElementById('minutes').value = duration;
                this.findTasks();
            },
            
            // 打开模态框
            openModal() {
                document.getElementById('addTaskModal').classList.remove('hidden');
                document.getElementById('customTaskName').focus();
            },
            
            // 关闭模态框
            closeModal() {
                document.getElementById('addTaskModal').classList.add('hidden');
            },
            
            // 更新统计信息
            updateStatistics() {
                // 总完成活动数
                const totalCompleted = this.completedTasks.length;
                document.getElementById('totalCompleted').textContent = totalCompleted;
                
                // 累计利用时间
                const totalMinutes = this.completedTasks.reduce((sum, task) => sum + task.duration, 0);
                document.getElementById('totalMinutes').textContent = totalMinutes;
                
                // 今日完成数
                const today = new Date().toDateString();
                const todayCompleted = this.completedTasks.filter(task => 
                    new Date(task.completedAt).toDateString() === today
                ).length;
                document.getElementById('todayCompleted').textContent = todayCompleted;
                
                // 最常做的类型
                if (totalCompleted > 0) {
                    const typeCounts = {};
                    this.completedTasks.forEach(task => {
                        typeCounts[task.typeText] = (typeCounts[task.typeText] || 0) + 1;
                    });
                    
                    let mostFrequentType = '';
                    let maxCount = 0;
                    for (const type in typeCounts) {
                        if (typeCounts[type] > maxCount) {
                            maxCount = typeCounts[type];
                            mostFrequentType = type;
                        }
                    }
                    document.getElementById('mostFrequentType').textContent = mostFrequentType;
                } else {
                    document.getElementById('mostFrequentType').textContent = '暂无';
                }
                
                // 如果有完成的任务，显示最近完成区域
                if (totalCompleted > 0) {
                    this.renderCompletedTasks();
                }
            },
            
            // 显示提示消息
            showToast(message, type = 'success') {
                const toast = document.getElementById('toast');
                const toastMsg = document.getElementById('toastMessage');
                
                toastMsg.textContent = message;
                
                // 设置样式
                if (type === 'success') {
                    toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs bg-green-500 text-white';
                    toast.querySelector('i').className = 'fa fa-check-circle mr-2';
                } else if (type === 'error') {
                    toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs bg-red-500 text-white';
                    toast.querySelector('i').className = 'fa fa-exclamation-circle mr-2';
                } else if (type === 'info') {
                    toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs bg-blue-500 text-white';
                    toast.querySelector('i').className = 'fa fa-info-circle mr-2';
                }
                
                // 3秒后隐藏
                setTimeout(() => {
                    toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs';
                }, 3000);
            }
        };
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            TimeUtilizationTool.init();
        });
    </script>
</body>
</html>
