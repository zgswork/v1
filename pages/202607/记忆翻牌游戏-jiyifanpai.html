<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记忆翻牌游戏</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        h1 {
            color: #4a4a4a;
            margin: 20px 0;
            text-align: center;
            font-size: 2.5rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.8);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .info-label {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 5px;
        }
        
        .info-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
        }
        
        .game-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }
        
        .card {
            aspect-ratio: 1;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s;
            cursor: pointer;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .card-front {
            background: linear-gradient(45deg, #6a11cb 0%, #2575fc 100%);
            transform: rotateY(180deg);
            color: white;
            font-size: 2rem;
        }
        
        .card-back {
            background: white;
            border: 2px solid #ddd;
        }
        
        .card.flipped {
            transform: rotateY(180deg);
        }
        
        .card.matched {
            transform: rotateY(180deg);
            cursor: default;
        }
        
        .controls {
            margin-top: 30px;
            display: flex;
            gap: 15px;
        }
        
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(45deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        @media (max-width: 600px) {
            .game-container {
                gap: 10px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .card-front {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <h1>记忆翻牌游戏</h1>
    
    <div class="game-info">
        <div class="info-item">
            <span class="info-label">时间</span>
            <span class="info-value" id="time">0</span>
        </div>
        <div class="info-item">
            <span class="info-label">翻牌次数</span>
            <span class="info-value" id="flips">0</span>
        </div>
        <div class="info-item">
            <span class="info-label">配对</span>
            <span class="info-value" id="matches">0/8</span>
        </div>
    </div>
    
    <div class="game-container" id="game-container"></div>
    
    <div class="controls">
        <button id="restart-btn">重新开始</button>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameContainer = document.getElementById('game-container');
            const timeElement = document.getElementById('time');
            const flipsElement = document.getElementById('flips');
            const matchesElement = document.getElementById('matches');
            const restartBtn = document.getElementById('restart-btn');
            
            // 游戏状态
            let hasFlippedCard = false;
            let lockBoard = false;
            let firstCard, secondCard;
            let flips = 0;
            let matches = 0;
            let time = 0;
            let timer;
            
            // 卡片符号
            const emojis = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼'];
            
            // 初始化游戏
            function initGame() {
                // 重置游戏状态
                hasFlippedCard = false;
                lockBoard = false;
                firstCard = secondCard = null;
                flips = 0;
                matches = 0;
                time = 0;
                
                // 清除定时器
                clearInterval(timer);
                timer = setInterval(updateTime, 1000);
                
                // 更新UI
                updateStats();
                
                // 创建卡片
                createCards();
            }
            
            // 创建卡片
            function createCards() {
                gameContainer.innerHTML = '';
                
                // 创建卡片对
                const cards = [...emojis, ...emojis];
                
                // 洗牌
                shuffleArray(cards);
                
                // 创建卡片元素
                cards.forEach((emoji, index) => {
                    const card = document.createElement('div');
                    card.classList.add('card');
                    card.dataset.emoji = emoji;
                    
                    const cardFront = document.createElement('div');
                    cardFront.classList.add('card-face', 'card-front');
                    cardFront.textContent = emoji;
                    
                    const cardBack = document.createElement('div');
                    cardBack.classList.add('card-face', 'card-back');
                    
                    card.appendChild(cardFront);
                    card.appendChild(cardBack);
                    card.addEventListener('click', flipCard);
                    
                    gameContainer.appendChild(card);
                });
            }
            
            // 洗牌算法
            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }
            
            // 翻转卡片
            function flipCard() {
                if (lockBoard) return;
                if (this === firstCard) return;
                if (this.classList.contains('matched')) return;
                
                this.classList.add('flipped');
                
                if (!hasFlippedCard) {
                    // 第一次点击
                    hasFlippedCard = true;
                    firstCard = this;
                    return;
                }
                
                // 第二次点击
                secondCard = this;
                flips++;
                updateStats();
                checkForMatch();
            }
            
            // 检查是否匹配
            function checkForMatch() {
                const isMatch = firstCard.dataset.emoji === secondCard.dataset.emoji;
                
                if (isMatch) {
                    disableCards();
                    matches++;
                    updateStats();
                    
                    if (matches === emojis.length) {
                        clearInterval(timer);
                        setTimeout(() => {
                            alert(`恭喜你赢了！用时: ${time}秒，翻牌次数: ${flips}`);
                        }, 500);
                    }
                } else {
                    unflipCards();
                }
            }
            
            // 禁用已匹配的卡片
            function disableCards() {
                firstCard.classList.add('matched');
                secondCard.classList.add('matched');
                
                resetBoard();
            }
            
            // 翻转不匹配的卡片
            function unflipCards() {
                lockBoard = true;
                
                setTimeout(() => {
                    firstCard.classList.remove('flipped');
                    secondCard.classList.remove('flipped');
                    
                    resetBoard();
                }, 1000);
            }
            
            // 重置游戏板
            function resetBoard() {
                [hasFlippedCard, lockBoard] = [false, false];
                [firstCard, secondCard] = [null, null];
            }
            
            // 更新时间
            function updateTime() {
                time++;
                timeElement.textContent = time;
            }
            
            // 更新统计信息
            function updateStats() {
                flipsElement.textContent = flips;
                matchesElement.textContent = `${matches}/${emojis.length}`;
            }
            
            // 重新开始游戏
            restartBtn.addEventListener('click', initGame);
            
            // 初始化游戏
            initGame();
        });
    </script>
</body>
</html>
