<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>二十四节气历 - 丙午马年</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --ink-black: #2c2c2c;
            --paper-cream: #f5f0e8;
            --mountain-green: #5a7247;
            --cloud-white: #faf8f5;
            --gold-accent: #b8860b;
            --ink-light: #8b7355;
            --water-blue: #7a9eb1;
            --rust-red: #8b4513;
            --bamboo-yellow: #daa520;
        }

        body {
            font-family: "STKaiti", "KaiTi", "SimSun", "宋体", serif;
            background: var(--paper-cream);
            color: var(--ink-black);
            line-height: 1.8;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(90, 114, 71, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(122, 158, 177, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(184, 134, 11, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* 山水装饰边框 */
        .mountain-border {
            position: relative;
            padding: 30px;
            background: linear-gradient(135deg, rgba(245, 240, 232, 0.95), rgba(250, 248, 245, 0.98));
            border: 2px solid var(--ink-light);
            border-radius: 8px;
            box-shadow:
                0 4px 20px rgba(44, 44, 44, 0.08),
                inset 0 0 60px rgba(90, 114, 71, 0.03);
        }

        .mountain-border::before,
        .mountain-border::after {
            content: '';
            position: absolute;
            width: 60px;
            height: 60px;
            border: 2px solid var(--gold-accent);
            opacity: 0.4;
        }

        .mountain-border::before {
            top: -2px;
            left: -2px;
            border-right: none;
            border-bottom: none;
            border-radius: 8px 0 0 0;
        }

        .mountain-border::after {
            bottom: -2px;
            right: -2px;
            border-left: none;
            border-top: none;
            border-radius: 0 0 8px 0;
        }

        /* 标题区域 */
        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            padding: 40px 20px;
            background:
                radial-gradient(ellipse at center, rgba(90, 114, 71, 0.05) 0%, transparent 70%);
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-accent), transparent);
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--ink-light), transparent);
        }

        .main-title {
            font-size: 3em;
            color: var(--ink-black);
            margin-bottom: 15px;
            letter-spacing: 20px;
            font-weight: 300;
            text-shadow: 2px 2px 4px rgba(44, 44, 44, 0.1);
        }

        .sub-title {
            font-size: 1.2em;
            color: var(--ink-light);
            letter-spacing: 8px;
            font-weight: 300;
        }

        .lunar-year {
            font-size: 0.9em;
            color: var(--mountain-green);
            margin-top: 10px;
            letter-spacing: 5px;
        }

        /* 倒计时区域 */
        .countdown-section {
            background: linear-gradient(135deg, rgba(90, 114, 71, 0.08), rgba(122, 158, 177, 0.05));
            border: 1px solid rgba(90, 114, 71, 0.2);
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .countdown-section::before {
            content: '节';
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 120px;
            color: rgba(184, 134, 11, 0.06);
            font-weight: bold;
        }

        .current-term-row {
            margin-bottom: 20px;
        }

        .current-term-label {
            font-size: 1.1em;
            color: var(--ink-light);
            letter-spacing: 5px;
            margin-bottom: 8px;
        }

        .current-term-name {
            font-size: 2.8em;
            color: var(--rust-red);
            letter-spacing: 12px;
            font-weight: 400;
            margin-bottom: 8px;
        }

        .current-term-date {
            font-size: 0.95em;
            color: var(--ink-light);
            letter-spacing: 3px;
        }

        .countdown-divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-accent), transparent);
            margin: 25px auto;
        }

        .next-term-row {
            margin-top: 10px;
        }

        .countdown-label {
            font-size: 1.2em;
            color: var(--ink-light);
            margin-bottom: 12px;
            letter-spacing: 5px;
        }

        .next-term-name {
            font-size: 2em;
            color: var(--mountain-green);
            margin: 10px 0;
            letter-spacing: 8px;
            font-weight: 400;
        }

        .countdown-days {
            display: inline-flex;
            align-items: baseline;
            gap: 6px;
            margin: 15px 0;
        }

        .days-number {
            font-size: 3.5em;
            color: var(--rust-red);
            font-weight: 300;
            line-height: 1.1;
        }

        .days-unit {
            font-size: 1.3em;
            color: var(--ink-light);
            letter-spacing: 3px;
        }

        .next-term-date {
            font-size: 1em;
            color: var(--ink-black);
            margin-top: 15px;
            letter-spacing: 3px;
        }

        /* 搜索区域 */
        .search-section {
            margin-bottom: 40px;
            text-align: center;
        }

        .search-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            max-width: 650px;
            margin: 0 auto;
        }

        .search-box {
            flex: 1;
            padding: 15px 30px;
            font-size: 1.1em;
            font-family: "STKaiti", "KaiTi", serif;
            border: 2px solid var(--ink-light);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.9);
            color: var(--ink-black);
            outline: none;
            transition: all 0.3s ease;
            letter-spacing: 2px;
        }

        .search-btn {
            padding: 12px 28px;
            font-size: 1.1em;
            font-family: "STKaiti", "KaiTi", serif;
            background: linear-gradient(135deg, var(--mountain-green), #4a6138);
            color: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 5px;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .search-btn:hover {
            background: linear-gradient(135deg, #4a6138, #3a5228);
            box-shadow: 0 4px 15px rgba(90, 114, 71, 0.3);
        }

        .search-btn:active {
            transform: scale(0.97);
        }

        .search-box:focus {
            border-color: var(--mountain-green);
            box-shadow: 0 0 20px rgba(90, 114, 71, 0.15);
        }

        .search-box::placeholder {
            color: var(--ink-light);
            letter-spacing: 3px;
        }

        .search-hint {
            font-size: 0.9em;
            color: var(--ink-light);
            margin-top: 15px;
            letter-spacing: 2px;
        }

        /* 节气详情展示 */
        .term-detail {
            display: none;
            background: linear-gradient(135deg, rgba(245, 240, 232, 0.98), rgba(250, 248, 245, 0.98));
            border: 2px solid var(--gold-accent);
            border-radius: 8px;
            padding: 40px;
            margin-bottom: 40px;
            position: relative;
            box-shadow: 0 4px 20px rgba(44, 44, 44, 0.08);
        }

        .term-detail.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .detail-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(184, 134, 11, 0.3);
        }

        .detail-name {
            font-size: 2.5em;
            color: var(--mountain-green);
            letter-spacing: 15px;
            margin-bottom: 10px;
        }

        .detail-date {
            font-size: 1.1em;
            color: var(--ink-light);
            letter-spacing: 5px;
        }

        .detail-content {
            display: grid;
            gap: 25px;
        }

        .detail-section {
            background: rgba(255, 255, 255, 0.7);
            border-left: 3px solid var(--mountain-green);
            padding: 20px 25px;
            border-radius: 0 8px 8px 0;
            position: relative;
        }

        .detail-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100%;
            background: linear-gradient(135deg, rgba(90, 114, 71, 0.03), transparent);
            border-radius: 0 8px 8px 0;
            pointer-events: none;
        }

        .section-title {
            font-size: 1.3em;
            color: var(--rust-red);
            margin-bottom: 15px;
            letter-spacing: 5px;
            font-weight: 400;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 40px;
            height: 2px;
            background: var(--gold-accent);
            margin-top: 8px;
            opacity: 0.6;
        }

        .section-content {
            color: var(--ink-black);
            line-height: 2;
            position: relative;
        }

        .ancient-text {
            color: var(--ink-light);
            border-left: 2px solid var(--gold-accent);
            padding-left: 15px;
            margin: 10px 0;
            font-size: 1.05em;
        }

        .dos-donts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .dos-donts {
                grid-template-columns: 1fr;
            }
        }

        .dos, .donts {
            padding: 15px;
            border-radius: 8px;
        }

        .dos {
            background: rgba(90, 114, 71, 0.08);
            border: 1px solid rgba(90, 114, 71, 0.2);
        }

        .donts {
            background: rgba(139, 69, 19, 0.06);
            border: 1px solid rgba(139, 69, 19, 0.2);
        }

        .dos-title, .donts-title {
            font-size: 1.1em;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }

        .dos-title {
            color: var(--mountain-green);
        }

        .donts-title {
            color: var(--rust-red);
        }

        .recipe-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(245, 240, 232, 0.9));
            border: 1px solid rgba(184, 134, 11, 0.3);
            border-radius: 8px;
            padding: 20px;
            margin-top: 10px;
        }

        .recipe-name {
            font-size: 1.2em;
            color: var(--gold-accent);
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        .recipe-desc {
            color: var(--ink-black);
            line-height: 1.8;
        }

        /* 日历网格 */
        .calendar-section {
            margin-top: 40px;
        }

        .section-title-main {
            text-align: center;
            font-size: 2em;
            color: var(--ink-black);
            letter-spacing: 10px;
            margin-bottom: 30px;
            position: relative;
        }

        .section-title-main::after {
            content: '';
            display: block;
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-accent), transparent);
            margin: 15px auto 0;
        }

        .season-block {
            margin-bottom: 40px;
        }

        .season-title {
            font-size: 1.5em;
            color: var(--mountain-green);
            letter-spacing: 8px;
            margin-bottom: 20px;
            padding-left: 20px;
            border-left: 4px solid var(--gold-accent);
        }

        .terms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        @media (max-width: 768px) {
            .terms-grid {
                grid-template-columns: 1fr;
            }
        }

        .term-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(245, 240, 232, 0.9));
            border: 1px solid rgba(139, 115, 85, 0.3);
            border-radius: 8px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .term-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, var(--mountain-green), var(--gold-accent));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .term-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(44, 44, 44, 0.1);
            border-color: var(--mountain-green);
        }

        .term-card:hover::before {
            opacity: 1;
        }

        .term-card.active {
            border-color: var(--gold-accent);
            background: linear-gradient(135deg, rgba(245, 240, 232, 0.98), rgba(250, 248, 245, 0.98));
            box-shadow: 0 4px 20px rgba(184, 134, 11, 0.15);
        }

        .card-name {
            font-size: 1.8em;
            color: var(--ink-black);
            letter-spacing: 8px;
            margin-bottom: 10px;
        }

        .card-date {
            font-size: 0.95em;
            color: var(--ink-light);
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .card-brief {
            font-size: 0.9em;
            color: var(--ink-black);
            line-height: 1.6;
        }

        /* 页脚 */
        .footer {
            text-align: center;
            padding: 40px 20px;
            margin-top: 60px;
            border-top: 1px solid rgba(139, 115, 85, 0.2);
            color: var(--ink-light);
            letter-spacing: 3px;
            font-size: 0.9em;
        }

        .footer-brand {
            font-size: 1.2em;
            color: var(--mountain-green);
            letter-spacing: 5px;
            margin-bottom: 10px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .main-title {
                font-size: 2em;
                letter-spacing: 10px;
            }

            .sub-title {
                font-size: 1em;
                letter-spacing: 5px;
            }

            .current-term-name {
                font-size: 2em;
                letter-spacing: 8px;
            }

            .next-term-name {
                font-size: 1.5em;
                letter-spacing: 5px;
            }

            .days-number {
                font-size: 2.5em;
            }

            .search-row {
                flex-direction: column;
                align-items: center;
            }

            .search-btn {
                width: 120px;
            }

            .detail-name {
                font-size: 2em;
                letter-spacing: 10px;
            }

            .container {
                padding: 10px;
            }

            .mountain-border {
                padding: 15px;
            }
        }

        /* 无结果提示 */
        .no-result {
            text-align: center;
            padding: 60px 20px;
            color: var(--ink-light);
            letter-spacing: 5px;
            font-size: 1.2em;
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--paper-cream);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--ink-light);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--mountain-green);
        }
    </style>
</head>

                date: "2027-01-05",
                time: "22:10",
                lunar: "十一月廿八",
                ancient: "小寒者，冷气积久而为寒，小者，未至极也。雁北乡，鹊始巢，雉始雊。天寒地冻，尚逊大寒。",
                weather: "一年中最寒冷时节，北方天寒地冻，南方亦寒意逼人，冷空气频繁南下。",
                clothing: "宜着厚羽绒服、棉衣、毛衣、厚裤，注意全身保暖，外出必备围巾手套帽子。",
                suitable: ["御寒补虚", "早睡晚起", "食温补之品", "静养藏精"],
                avoid: ["赤臂露肤", "过食生冷", "过度劳累", "长时间户外"],
                recipe: {
                    name: "八宝粥",
                    desc: "糯米、红枣、莲子、花生、桂圆、百合、薏仁、绿豆，八味同煮为粥，最宜小寒温补养生、御寒藏精。"
                }
            },
            {
                name: "大寒",
                date: "2027-01-20",
                time: "15:30",
                lunar: "腊月十三",
                ancient: "大寒者，寒气之逆极，故谓之大寒。鸡乳，征鸟厉疾，水泽腹坚。天寒地冻，一岁之终。",
                weather: "一年中最寒冷时节之末，天寒地冻，冷空气强盛，然已近立春，阳气渐生。",
                clothing: "宜着厚羽绒服、棉衣、毛衣、厚裤，注意全身保暖，外出必备围巾手套帽子。",
                suitable: ["御寒补虚", "早睡晚起", "食温补之品", "静养藏精"],
                avoid: ["赤臂露肤", "过食生冷", "过度劳累", "长时间户外"],
                recipe: {
                    name: "年糕炖排骨",
                    desc: "年糕温补脾胃、益气强志，排骨补虚劳、益气血，合炖为菜，最宜大寒温补养生、备年迎春。"
                }
            }
        ];

        // 节气分类
        const seasons = {
            "春": ["立春", "雨水", "惊蛰", "春分", "清明", "谷雨"],
            "夏": ["立夏", "小满", "芒种", "夏至", "小暑", "大暑"],
            "秋": ["立秋", "处暑", "白露", "秋分", "寒露", "霜降"],
            "冬": ["立冬", "小雪", "大雪", "冬至", "小寒", "大寒"]
        };

        // 初始化
        function init() {
            updateCountdown();
            setInterval(updateCountdown, 60000); // 每分钟更新
            renderCalendar();
            
            // 搜索输入事件
            document.getElementById('searchInput').addEventListener('input', function(e) {
                const keyword = e.target.value.trim();
                if (keyword) {
                    searchTerm(keyword);
                } else {
                    document.getElementById('termDetail').className = 'term-detail';
                    document.getElementById('termDetail').innerHTML = '';
                }
            });

            // 回车搜索
            document.getElementById('searchInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    doSearch();
                }
            });
        }

        // 查询按钮
        function doSearch() {
            const keyword = document.getElementById('searchInput').value.trim();
            if (keyword) {
                searchTerm(keyword);
            }
        }

        // 更新倒计时
        function updateCountdown() {
            const now = new Date();
            let currentTerm = null;
            let nextTerm = null;
            
            // 找到当前节气和下一个节气
            for (let i = 0; i < solarTerms.length; i++) {
                const termDate = new Date(solarTerms[i].date + 'T' + solarTerms[i].time + ':00');
                if (termDate <= now) {
                    currentTerm = solarTerms[i];
                } else {
                    nextTerm = solarTerms[i];
                    break;
                }
            }
            
            // 显示当前节气
            if (currentTerm) {
                document.getElementById('currentTermName').textContent = currentTerm.name;
                document.getElementById('currentTermDate').textContent = currentTerm.date + ' ' + currentTerm.time + ' · 农历' + currentTerm.lunar;
            }

            // 显示下一节气倒计时
            if (nextTerm) {
                const nextDate = new Date(nextTerm.date + 'T' + nextTerm.time + ':00');
                const diff = nextDate - now;
                const daysLeft = Math.ceil(diff / (1000 * 60 * 60 * 24));
                
                document.getElementById('nextTermName').textContent = nextTerm.name;
                document.getElementById('daysNumber').textContent = daysLeft;
                document.getElementById('nextTermDate').textContent = nextTerm.date + ' ' + nextTerm.time + ' · 农历' + nextTerm.lunar;
            } else if (currentTerm) {
                // 所有节气已过完，取下一年第一个节气
                const firstTerm = solarTerms[0];
                const nextYearDate = new Date('2027-' + firstTerm.date.substring(5) + 'T' + firstTerm.time + ':00');
                const diff = nextYearDate - now;
                const daysLeft = Math.ceil(diff / (1000 * 60 * 60 * 24));
                
                document.getElementById('nextTermName').textContent = firstTerm.name;
                document.getElementById('daysNumber').textContent = daysLeft;
                document.getElementById('nextTermDate').textContent = '2027-' + firstTerm.date.substring(5) + ' ' + firstTerm.time + ' · 农历' + firstTerm.lunar;
            }
        }

        // 搜索节气
        function searchTerm(keyword) {
            const term = solarTerms.find(t => t.name.includes(keyword));
            const detailDiv = document.getElementById('termDetail');
            
            if (term) {
                showTermDetail(term);
            } else {
                detailDiv.className = 'term-detail active';
                detailDiv.innerHTML = '<div class="no-result">未找到「' + keyword + '」相关节气，请重新输入</div>';
            }
        }

        // 显示节气详情
        function showTermDetail(term) {
            const detailDiv = document.getElementById('termDetail');
            detailDiv.className = 'term-detail active';
            
            let suitableHtml = term.suitable.map(s => '<li>' + s + '</li>').join('');
            let avoidHtml = term.avoid.map(a => '<li>' + a + '</li>').join('');
            
            detailDiv.innerHTML = 
                '<div class="detail-header">' +
                    '<div class="detail-name">' + term.name + '</div>' +
                    '<div class="detail-date">' + term.date + ' ' + term.time + ' · 农历' + term.lunar + '</div>' +
                '</div>' +
                '<div class="detail-content">' +
                    '<div class="detail-section">' +
                        '<div class="section-title">节气释名</div>' +
                        '<div class="section-content">' +
                            '<div class="ancient-text">' + term.ancient + '</div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="detail-section">' +
                        '<div class="section-title">天时特征</div>' +
                        '<div class="section-content">' + term.weather + '</div>' +
                    '</div>' +
                    '<div class="detail-section">' +
                        '<div class="section-title">穿衣指数</div>' +
                        '<div class="section-content">' + term.clothing + '</div>' +
                    '</div>' +
                    '<div class="detail-section">' +
                        '<div class="section-title">养生宜忌</div>' +
                        '<div class="section-content">' +
                            '<div class="dos-donts">' +
                                '<div class="dos">' +
                                    '<div class="dos-title">宜</div>' +
                                    '<ul>' + suitableHtml + '</ul>' +
                                '</div>' +
                                '<div class="donts">' +
                                    '<div class="donts-title">忌</div>' +
                                    '<ul>' + avoidHtml + '</ul>' +
                                '</div>' +
                            '</div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="detail-section">' +
                        '<div class="section-title">养生膳方</div>' +
                        '<div class="section-content">' +
                            '<div class="recipe-card">' +
                                '<div class="recipe-name">' + term.recipe.name + '</div>' +
                                '<div class="recipe-desc">' + term.recipe.desc + '</div>' +
                            '</div>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            
            detailDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // 渲染日历
        function renderCalendar() {
            const calendarDiv = document.getElementById('calendarContent');
            let html = '';
            
            const seasonNames = {'春': '春三月', '夏': '夏三月', '秋': '秋三月', '冬': '冬三月'};
            
            for (let season in seasons) {
                html += '<div class="season-block">';
                html += '<h3 class="season-title">' + seasonNames[season] + '</h3>';
                html += '<div class="terms-grid">';
                
                for (let termName of seasons[season]) {
                    const term = solarTerms.find(t => t.name === termName);
                    if (term) {
                        html += '<div class="term-card" onclick="showTermDetail(solarTerms[' + solarTerms.indexOf(term) + '])">';
                        html += '<div class="card-name">' + term.name + '</div>';
                        html += '<div class="card-date">' + term.date + ' ' + term.time + '<br>农历' + term.lunar + '</div>';
                        html += '<div class="card-brief">' + term.ancient.substring(0, 40) + '...</div>';
                        html += '</div>';
                    }
                }
                
                html += '</div></div>';
            }
            
            calendarDiv.innerHTML = html;
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
