<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码生成器</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .title {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-label {
            display: block;
            color: #555;
            font-size: 14px;
            margin-bottom: 8px;
            text-align: left;
            font-weight: 500;
        }

        .url-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        .url-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .url-input::placeholder {
            color: #aaa;
        }

        .generate-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 25px;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .generate-btn:active {
            transform: translateY(0);
        }

        .generate-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .qr-container {
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            display: none;
        }

        .qr-container.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .qr-code {
            margin: 20px 0;
            display: flex;
            justify-content: center;
        }

        .qr-code table {
            border-collapse: collapse;
            border: 4px solid #fff;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .qr-code td {
            width: 8px;
            height: 8px;
            padding: 0;
            margin: 0;
        }

        .download-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .download-btn:hover {
            background: #218838;
            transform: translateY(-1px);
        }

        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 10px;
            padding: 10px;
            background: #f8d7da;
            border-radius: 5px;
            display: none;
        }

        .success-message {
            color: #155724;
            font-size: 14px;
            margin-top: 10px;
            padding: 10px;
            background: #d4edda;
            border-radius: 5px;
            display: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px;
                margin: 10px;
            }
            
            .title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">🔗 二维码生成器</h1>
        <p class="subtitle">输入网址链接，快速生成二维码</p>
        
        <div class="input-group">
            <label class="input-label" for="urlInput">网址链接</label>
            <input 
                type="url" 
                id="urlInput" 
                class="url-input" 
                placeholder="请输入完整的网址，例如：https://www.example.com"
                autocomplete="url"
            >
        </div>
        
        <button id="generateBtn" class="generate-btn">
            生成二维码
        </button>
        
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        
        <div id="qrContainer" class="qr-container">
            <h3 style="color: #333; margin-bottom: 15px;">生成的二维码</h3>
            <div id="qrCode" class="qr-code"></div>
            <button id="downloadBtn" class="download-btn">
                📥 下载二维码
            </button>
        </div>
    </div>

    <script>
        class QRGenerator {
            constructor() {
                this.urlInput = document.getElementById('urlInput');
                this.generateBtn = document.getElementById('generateBtn');
                this.qrContainer = document.getElementById('qrContainer');
                this.qrCode = document.getElementById('qrCode');
                this.downloadBtn = document.getElementById('downloadBtn');
                this.errorMessage = document.getElementById('errorMessage');
                this.successMessage = document.getElementById('successMessage');
                this.currentQRElement = null;
                
                this.init();
            }
            
            init() {
                this.generateBtn.addEventListener('click', () => this.generateQR());
                this.urlInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.generateQR();
                    }
                });
                this.downloadBtn.addEventListener('click', () => this.downloadQR());
                
                // 输入时清除错误信息
                this.urlInput.addEventListener('input', () => {
                    this.hideMessages();
                });
            }
            
            validateURL(url) {
                // 如果没有协议，自动添加 https://
                if (url && !url.match(/^https?:\/\//)) {
                    url = 'https://' + url;
                }
                
                try {
                    new URL(url);
                    return url;
                } catch {
                    return null;
                }
            }
            
            showError(message) {
                this.errorMessage.textContent = message;
                this.errorMessage.style.display = 'block';
                this.successMessage.style.display = 'none';
            }
            
            showSuccess(message) {
                this.successMessage.textContent = message;
                this.successMessage.style.display = 'block';
                this.errorMessage.style.display = 'none';
            }
            
            hideMessages() {
                this.errorMessage.style.display = 'none';
                this.successMessage.style.display = 'none';
            }
            
            generateQR() {
                const inputValue = this.urlInput.value.trim();
                
                if (!inputValue) {
                    this.showError('请输入网址链接');
                    this.urlInput.focus();
                    return;
                }
                
                const validURL = this.validateURL(inputValue);
                if (!validURL) {
                    this.showError('请输入有效的网址格式');
                    this.urlInput.focus();
                    return;
                }
                
                // 更新输入框为标准化的URL
                if (validURL !== inputValue) {
                    this.urlInput.value = validURL;
                }
                
                try {
                    this.generateBtn.disabled = true;
                    this.generateBtn.textContent = '生成中...';
                    this.hideMessages();
                    
                    // 清除之前的二维码
                    this.qrCode.innerHTML = '';
                    
                    // 使用标准的二维码生成库
                    const qr = qrcode(0, 'M'); // 错误纠正级别 M
                    qr.addData(validURL);
                    qr.make();
                    
                    // 创建二维码HTML表格
                    const qrHTML = qr.createTableTag(8, 4); // 模块大小8px，边距4px
                    this.qrCode.innerHTML = qrHTML;
                    this.currentQRElement = this.qrCode.querySelector('table');
                    
                    this.qrContainer.classList.add('show');
                    this.showSuccess('二维码生成成功！可以用微信扫描');
                    
                } catch (error) {
                    console.error('生成二维码时出错:', error);
                    this.showError('生成二维码失败，请重试');
                } finally {
                    this.generateBtn.disabled = false;
                    this.generateBtn.textContent = '生成二维码';
                }
            }
            
            downloadQR() {
                if (!this.currentQRElement) {
                    this.showError('没有可下载的二维码');
                    return;
                }
                
                try {
                    // 创建canvas来绘制二维码
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    const table = this.currentQRElement;
                    const rows = table.rows;
                    const size = rows.length;
                    const moduleSize = 8;
                    const margin = 32;
                    
                    canvas.width = size * moduleSize + margin * 2;
                    canvas.height = size * moduleSize + margin * 2;
                    
                    // 绘制白色背景
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    // 绘制二维码
                    ctx.fillStyle = '#000000';
                    for (let i = 0; i < size; i++) {
                        const row = rows[i];
                        for (let j = 0; j < row.cells.length; j++) {
                            const cell = row.cells[j];
                            if (cell.style.backgroundColor === 'rgb(0, 0, 0)' || 
                                cell.style.backgroundColor === '#000000' ||
                                cell.className.includes('black')) {
                                ctx.fillRect(
                                    margin + j * moduleSize,
                                    margin + i * moduleSize,
                                    moduleSize,
                                    moduleSize
                                );
                            }
                        }
                    }
                    
                    // 下载图片
                    const link = document.createElement('a');
                    link.download = `qrcode-${Date.now()}.png`;
                    link.href = canvas.toDataURL('image/png');
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    
                    this.showSuccess('二维码下载成功！');
                } catch (error) {
                    console.error('下载二维码时出错:', error);
                    this.showError('下载失败，请重试');
                }
            }
        }
        
        // 检查库是否加载成功
        function checkLibraryLoaded() {
            if (typeof qrcode === 'undefined') {
                document.getElementById('errorMessage').textContent = '二维码库加载失败，请检查网络连接';
                document.getElementById('errorMessage').style.display = 'block';
                return false;
            }
            return true;
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            if (checkLibraryLoaded()) {
                new QRGenerator();
            }
        });
    </script>
</body>
</html>
