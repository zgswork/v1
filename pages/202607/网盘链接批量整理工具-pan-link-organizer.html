    <script>
        // 计算两个字符串的相似度（基于Levenshtein距离）
        function similarity(a, b) {
            a = a.toLowerCase().trim();
            b = b.toLowerCase().trim();
            
            // 如果完全相同，相似度为100%
            if (a === b) return 1;
            
            // 如果一个是另一个的子串，相似度至少为50%
            if (a.includes(b) || b.includes(a)) return 0.5;
            
            // 计算Levenshtein距离
            const distance = levenshteinDistance(a, b);
            
            // 基于最大长度计算相似度
            const maxLength = Math.max(a.length, b.length);
            return 1 - (distance / maxLength);
        }
        
        // 计算Levenshtein距离
        function levenshteinDistance(a, b) {
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;
            
            const matrix = [];
            
            // 初始化矩阵第一行
            for (let i = 0; i <= b.length; i++) {
                matrix[i] = [i];
            }
            
            // 初始化矩阵第一列
            for (let j = 0; j <= a.length; j++) {
                matrix[0][j] = j;
            }
            
            // 填充矩阵
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i-1) === a.charAt(j-1)) {
                        matrix[i][j] = matrix[i-1][j-1];
                    } else {
                        matrix[i][j] = Math.min(
                            matrix[i-1][j-1] + 1, // 替换
                            Math.min(
                                matrix[i][j-1] + 1, // 插入
                                matrix[i-1][j] + 1 // 删除
                            )
                        );
                    }
                }
            }
            
            return matrix[b.length][a.length];
        }

        // 解析网盘文本（支持百度和夸克网盘）
        function parsePanText(text) {
            const results = [];
            
            // 百度网盘正则表达式 - 着重识别"通过网盘分享的文件："后的内容
            const baiduPattern = /(?:通过百度网盘分享的文件[:：]?\s*|文件[:：]?\s*)([^「\n]+?)(?:\s*「[^」]*」)?\s*(?:\r?\n|$)[\s\S]*?链接[:：]\s*(https:\/\/pan\.baidu\.com\/s\/[^\s]+)(?:\s*(?:提取码|密码)[:：]?\s*(\w+))?/gi;
            
            // 夸克网盘正则表达式 - 着重识别"我用夸克网盘给你分享了「"后的内容
            const quarkPattern = /我用夸克网盘给你分享了「([^」]+)」[\s\S]*?链接[:：]\s*(https:\/\/pan\.quark\.cn\/s\/[^\s;]+)(?:\s*(?:提取码|密码)[:：]?\s*(\w+))?/gi;
            
            // 先匹配百度网盘
            let match;
            while ((match = baiduPattern.exec(text)) !== null) {
                results.push({
                    fileName: match[1] ? match[1].trim() : "未命名文件",
                    panType: "百度网盘",
                    link: match[2].trim(),
                    code: match[3] ? match[3].trim() : "无",
                    icon: "fa-cloud"
                });
            }
            
            // 再匹配夸克网盘
            while ((match = quarkPattern.exec(text)) !== null) {
                results.push({
                    fileName: match[1] ? match[1].trim() : "未命名文件",
                    panType: "夸克网盘",
                    link: match[2].trim().replace(/[;；]$/, ''), // 移除可能的结尾分号
                    code: match[3] ? match[3].trim() : "无",
                    icon: "fa-quora"
                });
            }
            
            // 新增通用匹配模式，覆盖更多情况
            const generalBaiduPattern = /(?:百度网盘|网盘分享)[\s\S]*?[:：]\s*([^「\n]+?)(?:\s*「[^」]*」)?\s*(?:\r?\n|$)[\s\S]*?链接[:：]\s*(https:\/\/pan\.baidu\.com\/s\/[^\s]+)(?:\s*(?:提取码|密码)[:：]?\s*(\w+))?/gi;
            const generalQuarkPattern = /(?:夸克网盘|网盘分享)[\s\S]*?[:：]\s*([^「\n]+?)(?:\s*「[^」]*」)?\s*(?:\r?\n|$)[\s\S]*?链接[:：]\s*(https:\/\/pan\.quark\.cn\/s\/[^\s;]+)(?:\s*(?:提取码|密码)[:：]?\s*(\w+))?/gi;
            
            // 尝试通用匹配模式
            while ((match = generalBaiduPattern.exec(text)) !== null) {
                // 检查是否已存在相同链接的记录
                if (!results.some(item => item.link === match[2].trim())) {
                    results.push({
                        fileName: match[1] ? match[1].trim() : "未命名文件",
                        panType: "百度网盘",
                        link: match[2].trim(),
                        code: match[3] ? match[3].trim() : "无",
                        icon: "fa-cloud"
                    });
                }
            }
            
            while ((match = generalQuarkPattern.exec(text)) !== null) {
                // 检查是否已存在相同链接的记录
                if (!results.some(item => item.link === match[2].trim())) {
                    results.push({
                        fileName: match[1] ? match[1].trim() : "未命名文件",
                        panType: "夸克网盘",
                        link: match[2].trim().replace(/[;；]$/, ''),
                        code: match[3] ? match[3].trim() : "无",
                        icon: "fa-quora"
                    });
                }
            }
            
            return results;
        }

        // 解析并显示结果
        function parseAndShow() {
            const inputText = document.getElementById("inputText").value.trim();
            const tableBody = document.getElementById("tableBody");
            const resultSection = document.getElementById("resultSection");
            const emptyState = document.getElementById("emptyState");
            const resultCount = document.getElementById("resultCount");
            
            if (!inputText) {
                showNotification("请输入网盘分享内容", "error");
                return;
            }
            
            const parsedData = parsePanText(inputText);
            
            if (parsedData.length === 0) {
                showNotification("未能识别有效的网盘链接", "error");
                return;
            }
            
            // 限制最大链接数
            if (parsedData.length > 200) {
                showNotification(`检测到 ${parsedData.length} 个链接，最多支持处理200个`, "warning");
                parsedData.splice(200);
            }
            
            // 按文件名分组（相似度大于0.6视为相似）
            const groups = [];
            parsedData.forEach(item => {
                let added = false;
                for (let group of groups) {
                    // 检查是否与组内第一个元素相似
                    if (similarity(item.fileName, group[0].fileName) > 0.6) {
                        group.push(item);
                        added = true;
                        break;
                    }
                }
                if (!added) {
                    groups.push([item]);
                }
            });
            
            // 按组排序（按组内第一个元素的文件名排序）
            groups.sort((a, b) => {
                return a[0].fileName.localeCompare(b[0].fileName);
            });
            
            // 清空表格
            tableBody.innerHTML = "";
            
            // 填充表格，相同文件名的放在一起
            groups.forEach((group, groupIndex) => {
                group.forEach((item, itemIndex) => {
                    const row = document.createElement("tr");
                    
                    // 相同组的行使用相同的背景色，不同组之间交替
                    const bgClass = groupIndex % 2 === 0 ? 
                        (itemIndex % 2 === 0 ? "bg-white" : "bg-gray-50") : 
                        (itemIndex % 2 === 0 ? "bg-gray-50" : "bg-white");
                    
                    row.className = bgClass;
                    
                    // 根据网盘类型设置颜色
                    const panTypeColor = item.panType === "百度网盘" ? "text-primary" : "text-quark";
                    
                    // 只在每组的第一行显示文件名
                    const fileNameCell = `<td class="border border-gray-300 px-4 py-3">${item.fileName}</td>`;
                    
                    row.innerHTML = `
                        ${fileNameCell}
                        <td class="border border-gray-300 px-4 py-3">
                            <i class="fa ${item.icon} ${panTypeColor} mr-2"></i>${item.panType}
                        </td>
                        <td class="border border-gray-300 px-4 py-3">
                            <a href="${item.link}" target="_blank" class="text-primary hover:underline">${item.link}</a>
                        </td>
                        <td class="border border-gray-300 px-4 py-3">${item.code}</td>
                    `;
                    tableBody.appendChild(row);
                });
            });
            
            // 更新结果计数
            resultCount.textContent = `共 ${parsedData.length} 个链接，${groups.length} 个文件`;
            
            // 显示结果区域，隐藏空状态
            resultSection.classList.remove("hidden");
            emptyState.classList.add("hidden");
            
            // 滚动到结果区域
            resultSection.scrollIntoView({ behavior: "smooth", block: "start" });
            
            showNotification(`成功解析 ${parsedData.length} 个网盘链接`, "success");
        }

        // 复制表格内容到剪贴板（修复版）
        function copyTable() {
            const table = document.getElementById("resultTable");
            let text = "";
            
            // 创建临时文本区域用于复制
            const tempTextArea = document.createElement("textarea");
            tempTextArea.style.position = "fixed";
            tempTextArea.style.opacity = "0";
            document.body.appendChild(tempTextArea);
            
            // 添加表头
            text += "文件名\t网盘类型\t链接\t提取码\n";
            
            // 只处理tbody中的行（修复表头重复问题）
            const tbody = table.querySelector('tbody');
            if (tbody) {
                for (let i = 0; i < tbody.rows.length; i++) {
                    for (let j = 0; j < 4; j++) {
                        if (tbody.rows[i].cells[j]) {
                            // 获取单元格文本内容
                            let cellText = "";
                            
                            // 特殊处理链接单元格，确保获取完整URL
                            if (j === 2) {
                                const linkElement = tbody.rows[i].cells[j].querySelector('a');
                                cellText = linkElement ? linkElement.href : tbody.rows[i].cells[j].textContent.trim();
                            } else {
                                cellText = tbody.rows[i].cells[j].textContent.trim();
                            }
                            
                            // 添加到文本，使用制表符分隔
                            text += cellText + "\t";
                        } else {
                            // 如果单元格不存在，使用空字符串
                            text += "\t";
                        }
                    }
                    // 移除最后一个制表符并添加换行符
                    text = text.slice(0, -1) + "\n";
                }
            }
            
            // 设置临时文本区域内容并复制
            tempTextArea.value = text;
            tempTextArea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showNotification("表格已复制到剪贴板，可以直接粘贴到在线文档中", "success");
                } else {
                    throw new Error("复制命令失败");
                }
            } catch (err) {
                console.error('复制失败: ', err);
                // 备用方法：使用现代剪贴板API
                navigator.clipboard.writeText(text).then(() => {
                    showNotification("表格已复制到剪贴板，可以直接粘贴到在线文档中", "success");
                }).catch(err => {
                    console.error('现代剪贴板API也失败: ', err);
                    showNotification("复制失败，请手动复制", "error");
                });
            } finally {
                document.body.removeChild(tempTextArea);
            }
        }

        // 导出为CSV文件
        function exportCSV() {
            const table = document.getElementById("resultTable");
            let csv = "";
            
            // 添加表头
            csv += "文件名,网盘类型,链接,提取码\n";
            
            // 只处理tbody中的行（修复表头重复问题）
            const tbody = table.querySelector('tbody');
            if (tbody) {
                for (let i = 0; i < tbody.rows.length; i++) {
                    for (let j = 0; j < 4; j++) {
                        if (tbody.rows[i].cells[j]) {
                            // 获取单元格文本内容
                            let cellText = "";
                            
                            // 特殊处理链接单元格，确保获取完整URL
                            if (j === 2) {
                                const linkElement = tbody.rows[i].cells[j].querySelector('a');
                                cellText = linkElement ? linkElement.href : tbody.rows[i].cells[j].textContent.trim();
                            } else {
                                cellText = tbody.rows[i].cells[j].textContent.trim();
                            }
                            
                            // 处理单元格内容中的逗号和引号
                            cellText = cellText.replace(/"/g, '""');
                            if (cellText.includes(',') || cellText.includes('"') || cellText.includes('\n')) {
                                cellText = `"${cellText}"`;
                            }
                            csv += cellText + ",";
                        } else {
                            // 如果单元格不存在，使用空字符串
                            csv += ",";
                        }
                    }
                    // 移除最后一个逗号并添加换行符
                    csv = csv.slice(0, -1) + "\n";
                }
            }
            
            // 创建下载链接
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', `网盘链接_${new Date().toISOString().slice(0, 10)}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showNotification("CSV文件已导出", "success");
        }

        // 清空输入框
        function clearInput() {
            document.getElementById("inputText").value = "";
            showNotification("输入已清空", "info");
        }

        // 显示通知
        function showNotification(message, type = "success") {
            const notification = document.getElementById("notification");
            const notificationText = document.getElementById("notificationText");
            const notificationIcon = document.getElementById("notificationIcon");
            
            // 设置通知内容和图标
            notificationText.textContent = message;
            
            // 设置图标和背景颜色
            if (type === "success") {
                notification.classList.remove("bg-red-500", "bg-blue-500", "bg-yellow-500");
                notification.classList.add("bg-green-500");
                notificationIcon.className = "fa fa-check-circle mr-2";
            } else if (type === "error") {
                notification.classList.remove("bg-green-500", "bg-blue-500", "bg-yellow-500");
                notification.classList.add("bg-red-500");
                notificationIcon.className = "fa fa-exclamation-circle mr-2";
            } else if (type === "info") {
                notification.classList.remove("bg-green-500", "bg-red-500", "bg-yellow-500");
                notification.classList.add("bg-blue-500");
                notificationIcon.className = "fa fa-info-circle mr-2";
            } else if (type === "warning") {
                notification.classList.remove("bg-green-500", "bg-red-500", "bg-blue-500");
                notification.classList.add("bg-yellow-500");
                notificationIcon.className = "fa fa-exclamation-triangle mr-2";
            }
            
            // 显示通知
            notification.classList.remove("translate-y-20", "opacity-0");
            notification.classList.add("translate-y-0", "opacity-100");
            
            // 3秒后隐藏通知
            setTimeout(() => {
                notification.classList.remove("translate-y-0", "opacity-100");
                notification.classList.add("translate-y-20", "opacity-0");
            }, 3000);
        }

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 添加键盘快捷键支持
            document.getElementById('inputText').addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.key === 'Enter') {
                    e.preventDefault();
                    document.getElementById('parseBtn').click();
                }
            });
        });
    </script>
