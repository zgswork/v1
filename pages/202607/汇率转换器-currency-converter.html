<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汇率转换器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            max-width: 500px;
            width: 100%;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 1.1em;
        }

        input[type="number"], select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        input[type="number"]:focus, select:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .currency-row {
            display: flex;
            gap: 20px;
            align-items: end;
        }

        .currency-group {
            flex: 1;
        }

        .swap-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 5px;
        }

        .swap-btn:hover {
            background: #5a6fd8;
            transform: rotate(180deg);
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(45deg, #5a6fd8, #6a4190);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #666;
            border: 2px solid #e1e5e9;
        }

        .btn-secondary:hover {
            background: #e9ecef;
            border-color: #adb5bd;
        }

        .result {
            margin-top: 30px;
            padding: 25px;
            background: linear-gradient(45deg, #f8f9fa, #e9ecef);
            border-radius: 15px;
            text-align: center;
            border-left: 5px solid #667eea;
            display: none;
        }

        .result.show {
            display: block;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-amount {
            font-size: 2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .result-text {
            color: #666;
            font-size: 1.1em;
        }

        .error {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        .contact-info {
            margin-top: 30px;
            padding: 20px;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .contact-info p {
            margin: 0;
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }

        .wechat-id {
            color: #667eea;
            font-weight: 600;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
                margin: 10px;
            }

            h1 {
                font-size: 2em;
            }

            .currency-row {
                flex-direction: column;
                gap: 15px;
            }

            .swap-btn {
                align-self: center;
                transform: rotate(90deg);
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>汇率转换器</h1>
        
        <div class="form-group">
            <label for="amount">金额</label>
            <input type="number" id="amount" placeholder="请输入金额" step="0.01" min="0">
            <div class="error" id="amount-error">请输入有效的金额</div>
        </div>

        <div class="currency-row">
            <div class="currency-group">
                <label for="fromCurrency">原始货币</label>
                <select id="fromCurrency">
                    <option value="USD">USD - 美元</option>
                    <option value="EUR">EUR - 欧元</option>
                    <option value="CNY">CNY - 人民币</option>
                    <option value="JPY">JPY - 日元</option>
                    <option value="GBP">GBP - 英镑</option>
                    <option value="AUD">AUD - 澳元</option>
                    <option value="CAD">CAD - 加元</option>
                    <option value="CHF">CHF - 瑞士法郎</option>
                    <option value="HKD">HKD - 港币</option>
                    <option value="SGD">SGD - 新加坡元</option>
                    <option value="KRW">KRW - 韩元</option>
                    <option value="INR">INR - 印度卢比</option>
                    <option value="THB">THB - 泰铢</option>
                    <option value="MYR">MYR - 马来西亚林吉特</option>
                    <option value="RUB">RUB - 俄罗斯卢布</option>
                    <option value="BRL">BRL - 巴西雷亚尔</option>
                    <option value="MXN">MXN - 墨西哥比索</option>
                    <option value="ZAR">ZAR - 南非兰特</option>
                    <option value="TRY">TRY - 土耳其里拉</option>
                    <option value="SEK">SEK - 瑞典克朗</option>
                </select>
            </div>
            
            <button class="swap-btn" id="swapBtn" title="交换货币">⇄</button>
            
            <div class="currency-group">
                <label for="toCurrency">目标货币</label>
                <select id="toCurrency">
                    <option value="USD">USD - 美元</option>
                    <option value="EUR">EUR - 欧元</option>
                    <option value="CNY" selected>CNY - 人民币</option>
                    <option value="JPY">JPY - 日元</option>
                    <option value="GBP">GBP - 英镑</option>
                    <option value="AUD">AUD - 澳元</option>
                    <option value="CAD">CAD - 加元</option>
                    <option value="CHF">CHF - 瑞士法郎</option>
                    <option value="HKD">HKD - 港币</option>
                    <option value="SGD">SGD - 新加坡元</option>
                    <option value="KRW">KRW - 韩元</option>
                    <option value="INR">INR - 印度卢比</option>
                    <option value="THB">THB - 泰铢</option>
                    <option value="MYR">MYR - 马来西亚林吉特</option>
                    <option value="RUB">RUB - 俄罗斯卢布</option>
                    <option value="BRL">BRL - 巴西雷亚尔</option>
                    <option value="MXN">MXN - 墨西哥比索</option>
                    <option value="ZAR">ZAR - 南非兰特</option>
                    <option value="TRY">TRY - 土耳其里拉</option>
                    <option value="SEK">SEK - 瑞典克朗</option>
                </select>
            </div>
        </div>

        <div class="button-group">
            <button class="btn btn-primary" id="convertBtn">转换</button>
            <button class="btn btn-secondary" id="clearBtn">清除</button>
        </div>

        <div class="result" id="result">
            <div class="result-amount" id="resultAmount"></div>
            <div class="result-text" id="resultText"></div>
        </div>

        <div class="contact-info">
            <p>有问题联系作者微信：<span class="wechat-id">xd135341</span></p>
        </div>
    </div>

                THB: 1.17, MYR: 0.152, RUB: 3.03, BRL: 0.169, MXN: 0.565, ZAR: 0.614,
                SEK: 0.356, TRY: 1

        // 获取DOM元素
        const amountInput = document.getElementById('amount');
        const fromCurrencySelect = document.getElementById('fromCurrency');
        const toCurrencySelect = document.getElementById('toCurrency');
        const convertBtn = document.getElementById('convertBtn');
        const clearBtn = document.getElementById('clearBtn');
        const swapBtn = document.getElementById('swapBtn');
        const resultDiv = document.getElementById('result');
        const resultAmount = document.getElementById('resultAmount');
        const resultText = document.getElementById('resultText');
        const amountError = document.getElementById('amount-error');

        // 转换函数
        function convertCurrency() {
            const amount = parseFloat(amountInput.value);
            const fromCurrency = fromCurrencySelect.value;
            const toCurrency = toCurrencySelect.value;

            // 验证输入
            if (isNaN(amount) || amount <= 0) {
                showError('请输入有效的金额');
                return;
            }

            hideError();

            // 如果是相同货币，直接返回原金额
            if (fromCurrency === toCurrency) {
                displayResult(amount, fromCurrency, toCurrency, 1);
                return;
            }

            // 获取汇率并计算
            const rate = exchangeRates[fromCurrency][toCurrency];
            const convertedAmount = amount * rate;

            displayResult(convertedAmount, fromCurrency, toCurrency, rate);
        }

        // 显示结果
        function displayResult(convertedAmount, fromCurrency, toCurrency, rate) {
            const formattedAmount = convertedAmount.toFixed(2);
            const originalAmount = parseFloat(amountInput.value).toFixed(2);

            resultAmount.textContent = `${formattedAmount} ${toCurrency}`;
            resultText.textContent = `${originalAmount} ${fromCurrency} = ${formattedAmount} ${toCurrency}`;
            
            if (rate !== 1) {
                resultText.textContent += ` (汇率: 1 ${fromCurrency} = ${rate} ${toCurrency})`;
            }

            resultDiv.classList.add('show');
        }

        // 显示错误
        function showError(message) {
            amountError.textContent = message;
            amountError.style.display = 'block';
            resultDiv.classList.remove('show');
        }

        // 隐藏错误
        function hideError() {
            amountError.style.display = 'none';
        }

        // 清除所有输入和结果
        function clearAll() {
            amountInput.value = '';
            fromCurrencySelect.value = 'USD';
            toCurrencySelect.value = 'CNY';
            resultDiv.classList.remove('show');
            hideError();
            amountInput.focus();
        }

        // 交换货币
        function swapCurrencies() {
            const fromValue = fromCurrencySelect.value;
            const toValue = toCurrencySelect.value;
            
            fromCurrencySelect.value = toValue;
            toCurrencySelect.value = fromValue;

            // 如果有金额，自动重新转换
            if (amountInput.value && !isNaN(parseFloat(amountInput.value))) {
                convertCurrency();
            }
        }

        // 事件监听器
        convertBtn.addEventListener('click', convertCurrency);
        clearBtn.addEventListener('click', clearAll);
        swapBtn.addEventListener('click', swapCurrencies);

        // 回车键转换
        amountInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                convertCurrency();
            }
        });

        // 输入时隐藏错误信息
        amountInput.addEventListener('input', hideError);

        // 货币选择改变时，如果有金额则自动转换
        fromCurrencySelect.addEventListener('change', function() {
            if (amountInput.value && !isNaN(parseFloat(amountInput.value))) {
                convertCurrency();
            }
        });

        toCurrencySelect.addEventListener('change', function() {
            if (amountInput.value && !isNaN(parseFloat(amountInput.value))) {
                convertCurrency();
            }
        });

        // 页面加载完成后聚焦到金额输入框
        window.addEventListener('load', function() {
            amountInput.focus();
        });
    </script>
</body>
</html>
