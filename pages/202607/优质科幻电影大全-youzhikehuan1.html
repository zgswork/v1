        const placeholder = document.getElementById('placeholder');
        const movieInfo = document.getElementById('movie-info');
        const generateBtn = document.getElementById('generate-btn');
        const changeBtn = document.getElementById('change-btn');
        const downloadBtn = document.getElementById('download-btn');
        const modal = document.getElementById('download-modal');
        const closeBtn = document.querySelector('.close');
        
        let currentMovieIndex = -1;
        let previousIndices = [];
        
        function displayRandomMovie() {
            if (previousIndices.length === movies.length) {
                previousIndices = [];
            }
            
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * movies.length);
            } while (previousIndices.includes(randomIndex));
            
            previousIndices.push(randomIndex);
            currentMovieIndex = randomIndex;
            
            const movie = movies[randomIndex];
            
            document.getElementById('movie-title').textContent = movie.title;
            document.getElementById('movie-country').textContent = `国家: ${movie.country}`;
            document.getElementById('movie-cast').textContent = `主演: ${movie.cast}`;
            document.getElementById('movie-description').textContent = movie.description;
            document.getElementById('movie-rating').textContent = `${movie.rating}`;
            document.getElementById('movie-reason').textContent = movie.reason;
            
            const starsContainer = document.getElementById('movie-stars');
            starsContainer.innerHTML = '';
            
            const fullStars = Math.floor(movie.rating / 2);
            const hasHalfStar = movie.rating % 2 >= 1;
            
            for (let i = 0; i < 5; i++) {
                const star = document.createElement('span');
                star.className = 'star';
                
                if (i < fullStars) {
                    star.innerHTML = '★';
                } else if (i === fullStars && hasHalfStar) {
                    star.innerHTML = '★';
                    star.style.opacity = '0.6';
                } else {
                    star.innerHTML = '☆';
                }
                
                starsContainer.appendChild(star);
            }
            
            placeholder.style.display = 'none';
            movieInfo.classList.add('active');
            generateBtn.style.display = 'none';
            changeBtn.style.display = 'inline-block';
        }
        
        // 下载按钮点击事件
        downloadBtn.addEventListener('click', function() {
            modal.style.display = 'block';
        });
        
        // 关闭按钮点击事件
        closeBtn.addEventListener('click', function() {
            modal.style.display = 'none';
        });
        
        // 点击模态框外部关闭
        window.addEventListener('click', function(event) {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });
        
        generateBtn.addEventListener('click', displayRandomMovie);
        changeBtn.addEventListener('click', displayRandomMovie);
    </script>
