    <title>大象牙膏实验3D演示</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }
        #startButton {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #ff69b4;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        #startButton:hover {
            background-color: #ff1493;
            transform: scale(1.05);
        }
        #startButton:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
            transform: none;
        }
        #developer-info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.8);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            text-align: center;
            z-index: 10;
            font-size: 14px;
        }
        #developer-info img {
            width: 100px;
            height: 100px;
            display: block;
            margin: 0 auto 10px;
        }
        #developer-info p {
            margin: 5px 0;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>
    <script>
        // 主要变量
        let scene, camera, renderer, controls;
        let flask, liquid, foamParticles = [];
        let isExperimentRunning = false;
        let liquidLevel = 0.33; // 初始液面高度比例
        let foamEmissionRate = 0;
        let foamEmissionDecay = 0.005;
        let gravity = -0.01;
        let foamBaseVelocity = 0.3;
        
        // 初始化场景
        function init() {
            // 创建场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f8ff);
            
            // 创建摄像机
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(15, 15, 15);
            camera.lookAt(0, 0, 0);
            
            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('container').appendChild(renderer.domElement);
            
            // 添加光源
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 1024;
            directionalLight.shadow.mapSize.height = 1024;
            scene.add(directionalLight);
            
            // 创建平面
            const planeGeometry = new THREE.PlaneGeometry(1000, 1000);
            const planeMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x808080,
                roughness: 0.2,
                metalness: 0.1
            });
            const plane = new THREE.Mesh(planeGeometry, planeMaterial);
            plane.rotation.x = -Math.PI / 2;
            plane.receiveShadow = true;
            scene.add(plane);
            
            // 创建三角烧瓶
            createFlask();
            
            // 创建液体
            createLiquid();
            
            // 初始化控制器
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            
            // 绑定事件
            window.addEventListener('resize', onWindowResize, false);
            document.getElementById('startButton').addEventListener('click', startExperiment);
            
            // 开始渲染循环
            animate();
        }
        
        // 创建三角烧瓶
        function createFlask() {
            // 烧瓶由多个部分组成：颈部、瓶身、底部
            
            // 瓶身（圆锥形）
            const bodyGeometry = new THREE.ConeGeometry(3, 8, 32, 1, true);
            bodyGeometry.translate(0, -4, 0);
            
            // 颈部（圆柱形）
            const neckGeometry = new THREE.CylinderGeometry(0.8, 0.8, 4, 32);
            neckGeometry.translate(0, 2, 0);
            
            // 底部（扁平圆）
            const bottomGeometry = new THREE.CylinderGeometry(3, 3, 0.2, 32);
            bottomGeometry.translate(0, -8.1, 0);
            
            // 合并几何体
            const flaskGeometry = new THREE.BufferGeometry();
            const flaskMaterial = new THREE.MeshPhysicalMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.9,
                roughness: 0.05,
                metalness: 0.35,
                clearcoat: 1.0,
                clearcoatRoughness: 0.03,
                transmission: 0.95,
                ior: 1.5,
                side: THREE.DoubleSide,
                envMapIntensity: 1
            });
            
            // 将三个部分合并
            const mergedGeometry = new THREE.BufferGeometry();
            const materials = [];
            
            // 创建烧瓶网格
            flask = new THREE.Mesh(flaskGeometry, flaskMaterial);
            flask.castShadow = true;
            flask.receiveShadow = true;
            scene.add(flask);
            
            // 为简单起见，我们使用一个组合几何体来表示烧瓶
            const flaskGroup = new THREE.Group();
            
            // 瓶身
            const body = new THREE.Mesh(bodyGeometry, flaskMaterial);
            body.castShadow = true;
            body.receiveShadow = true;
            flaskGroup.add(body);
            
            // 颈部
            const neck = new THREE.Mesh(neckGeometry, flaskMaterial);
            neck.castShadow = true;
            neck.receiveShadow = true;
            flaskGroup.add(neck);
            
            // 底部
            const bottom = new THREE.Mesh(bottomGeometry, flaskMaterial);
            bottom.castShadow = true;
            bottom.receiveShadow = true;
            flaskGroup.add(bottom);
            
            scene.add(flaskGroup);
            flask = flaskGroup;
        }
        
        // 创建液体
        function createLiquid() {
            // 液体是瓶身的一部分，根据液面高度确定
            updateLiquid();
        }
        
        // 更新液体（根据液面高度）
        function updateLiquid() {
            if (liquid) {
                scene.remove(liquid);
            }
            
            // 计算液体高度（基于烧瓶的锥形）
            const liquidHeight = 8 * liquidLevel; // 瓶身总高度为8
            const liquidRadius = 3 * liquidLevel; // 半径按比例计算
            
            // 创建液体几何体
            const liquidGeometry = new THREE.ConeGeometry(liquidRadius, liquidHeight, 32, 1, true);
            liquidGeometry.translate(0, -4 - (8 - liquidHeight) / 2, 0);
            liquidGeometry.rotateX(Math.PI);
            
            // 液体材质（荧光粉色）
            const liquidMaterial = new THREE.MeshPhysicalMaterial({
                color: 0xff69b4,
                transparent: true,
                opacity: 0.7,
                roughness: 0.1,
                metalness: 0.2,
                clearcoat: 0.5,
                clearcoatRoughness: 0.1,
                transmission: 0.8,
                ior: 1.33
            });
            
            liquid = new THREE.Mesh(liquidGeometry, liquidMaterial);
            liquid.castShadow = true;
            liquid.receiveShadow = true;
            scene.add(liquid);
        }
        
        // 创建泡沫粒子
        function createFoamParticle() {
            // 泡沫粒子使用球形几何体
            const geometry = new THREE.SphereGeometry(Math.random() * 0.2 + 0.1, 8, 8);
            const material = new THREE.MeshPhysicalMaterial({
                color: new THREE.Color(
                    Math.random() * 0.2 + 0.9,
                    Math.random() * 0.2 + 0.2,
                    Math.random() * 0.2 + 0.6
                ),
                transparent: true,
                opacity: Math.random() * 0.3 + 0.4,
                roughness: 0.7,
                metalness: 0.1,
                clearcoat: 0.5,
                clearcoatRoughness: 0.3,
                transmission: 0.6,
                ior: 1.1
            });
            
            const particle = new THREE.Mesh(geometry, material);
            
            // 初始位置在烧瓶口
            particle.position.set(
                (Math.random() - 0.5) * 0.5,
                4,
                (Math.random() - 0.5) * 0.5
            );
            
            // 初始速度（向上喷射）
            particle.velocity = new THREE.Vector3(
                (Math.random() - 0.5) * 0.1,
                foamBaseVelocity * (0.8 + Math.random() * 0.4),
                (Math.random() - 0.5) * 0.1
            );
            
            // 粒子属性
            particle.life = 1.0;
            particle.originalScale = particle.scale.clone();
            particle.castShadow = true;
            
            scene.add(particle);
            foamParticles.push(particle);
            
            return particle;
        }
        
        // 开始实验
        function startExperiment() {
            if (isExperimentRunning) return;
            
            isExperimentRunning = true;
            document.getElementById('startButton').disabled = true;
            document.getElementById('startButton').textContent = '实验进行中...';
            
            // 开始喷发
            foamEmissionRate = 50; // 初始发射速率
        }
        
        // 更新泡沫粒子
        function updateFoamParticles() {
            // 生成新粒子
            if (isExperimentRunning && foamEmissionRate > 0) {
                const particlesToCreate = Math.floor(foamEmissionRate);
                for (let i = 0; i < particlesToCreate; i++) {
                    createFoamParticle();
                }
                
                // 逐渐减少发射速率
                foamEmissionRate -= foamEmissionDecay;
                if (foamEmissionRate <= 0) {
                    foamEmissionRate = 0;
                }
            }
            
            // 更新现有粒子
            for (let i = foamParticles.length - 1; i >= 0; i--) {
                const particle = foamParticles[i];
                
                // 应用重力
                particle.velocity.y += gravity;
                
                // 添加一些随机扰动
                particle.velocity.x += (Math.random() - 0.5) * 0.01;
                particle.velocity.z += (Math.random() - 0.5) * 0.01;
                
                // 更新位置
                particle.position.add(particle.velocity);
                
                // 检查与地面或烧瓶的碰撞
                checkCollisions(particle);
                
                // 减少生命周期
                particle.life -= 0.005;
                
                // 更新透明度
                particle.material.opacity = particle.life * 0.7;
                
                // 移除生命周期结束的粒子
                if (particle.life <= 0 || particle.position.y < -50) {
                    scene.remove(particle);
                    foamParticles.splice(i, 1);
                }
            }
            
            // 更新液面高度
            if (isExperimentRunning && liquidLevel > 0) {
                liquidLevel -= 0.0005;
                if (liquidLevel <= 0) {
                    liquidLevel = 0;
                }
                updateLiquid();
            }
        }
        
        // 检查碰撞
        function checkCollisions(particle) {
            // 与地面碰撞
            if (particle.position.y - particle.geometry.parameters.radius <= 0) {
                // 碰撞后压扁效果
                particle.scale.y = particle.originalScale.y * 0.3;
                particle.scale.x = particle.originalScale.x * 1.5;
                particle.scale.z = particle.originalScale.z * 1.5;
                
                // 减缓垂直速度并增加水平滑动
                particle.velocity.y = -particle.velocity.y * 0.2;
                particle.velocity.x *= 0.95;
                particle.velocity.z *= 0.95;
                
                // 当速度足够小时，停止移动
                if (Math.abs(particle.velocity.y) < 0.01) {
                    particle.velocity.y = 0;
                }
            }
            
            // 与烧瓶外壁碰撞（简化处理）
            const distanceToCenter = Math.sqrt(
                particle.position.x * particle.position.x + 
                particle.position.z * particle.position.z
            );
            
            if (distanceToCenter > 2.8 && particle.position.y < 4 && particle.position.y > -4) {
                // 简化处理：当粒子碰到烧瓶外壁时，减缓速度
                particle.velocity.x *= 0.9;
                particle.velocity.z *= 0.9;
            }
        }
        
        // 窗口大小调整
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            // 更新控制器
            controls.update();
            
            // 更新泡沫粒子
            updateFoamParticles();
            
            // 渲染场景
            renderer.render(scene, camera);
        }
        
        // 初始化应用
        init();
    </script>
</body>
</html>
