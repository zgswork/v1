<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF处理工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 40px 0;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 300;
            color: #1a1a1a;
            margin-bottom: 10px;
            letter-spacing: -0.02em;
        }

        .header p {
            font-size: 1.2rem;
            color: #666;
            font-weight: 300;
        }

        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .tab {
            padding: 12px 24px;
            border: none;
            background: transparent;
            color: #666;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .tab:hover {
            color: #007AFF;
            transform: translateY(-1px);
        }

        .tab.active {
            background: #007AFF;
            color: white;
            box-shadow: 0 4px 20px rgba(0, 122, 255, 0.3);
        }

        .tab-content {
            display: none;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: fadeIn 0.5s ease-out;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .upload-area {
            border: 2px dashed #ddd;
            border-radius: 16px;
            padding: 60px 20px;
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.5);
            position: relative;
            overflow: hidden;
        }

        .upload-area:hover {
            border-color: #007AFF;
            background: rgba(0, 122, 255, 0.05);
            transform: translateY(-2px);
        }

        .upload-area.dragover {
            border-color: #007AFF;
            background: rgba(0, 122, 255, 0.1);
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 48px;
            color: #ccc;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .upload-area:hover .upload-icon {
            color: #007AFF;
            transform: scale(1.1);
        }

        .upload-text {
            font-size: 18px;
            color: #666;
            margin-bottom: 10px;
        }

        .upload-hint {
            font-size: 14px;
            color: #999;
        }

        .file-input {
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, #007AFF, #0056CC);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0, 122, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 122, 255, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.8);
            color: #333;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #007AFF;
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
            background: rgba(255, 255, 255, 0.95);
        }

        .file-list {
            margin-top: 20px;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 12px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .file-item:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateX(4px);
        }

        .file-info {
            display: flex;
            align-items: center;
            flex: 1;
        }

        .file-icon {
            width: 40px;
            height: 40px;
            background: #FF3B30;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            margin-right: 12px;
        }

        .file-details {
            flex: 1;
        }

        .file-name {
            font-weight: 500;
            color: #333;
            margin-bottom: 4px;
        }

        .file-size {
            font-size: 14px;
            color: #666;
        }

        .file-actions {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 14px;
            border-radius: 8px;
        }

        .btn-danger {
            background: linear-gradient(135deg, #FF3B30, #D70015);
            box-shadow: 0 4px 20px rgba(255, 59, 48, 0.3);
        }

        .btn-danger:hover {
            box-shadow: 0 8px 30px rgba(255, 59, 48, 0.4);
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #007AFF, #00C7BE);
            border-radius: 3px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .page-selector {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 16px;
            margin: 20px 0;
        }

        .page-item {
            aspect-ratio: 3/4;
            border: 2px solid #ddd;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.8);
            position: relative;
            overflow: hidden;
        }

        .page-item:hover {
            border-color: #007AFF;
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .page-item.selected {
            border-color: #007AFF;
            background: rgba(0, 122, 255, 0.1);
        }

        .page-item::after {
            content: '✓';
            position: absolute;
            top: 8px;
            right: 8px;
            background: #007AFF;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            opacity: 0;
            transform: scale(0);
            transition: all 0.3s ease;
        }

        .page-item.selected::after {
            opacity: 1;
            transform: scale(1);
        }

        .merge-area {
            min-height: 200px;
            border: 2px dashed #ddd;
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
            background: rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
        }

        .merge-area.dragover {
            border-color: #007AFF;
            background: rgba(0, 122, 255, 0.1);
        }

        .merge-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: move;
            transition: all 0.3s ease;
        }

        .merge-item:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: translateX(4px);
        }

        .drag-handle {
            margin-right: 12px;
            color: #999;
            cursor: grab;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transform: translateX(400px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            border-left: 4px solid #34C759;
        }

        .notification.error {
            border-left: 4px solid #FF3B30;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 122, 255, 0.2);
            border-top: 4px solid #007AFF;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .tabs {
                flex-wrap: wrap;
                gap: 4px;
            }

            .tab {
                flex: 1;
                min-width: 80px;
                padding: 10px 16px;
                font-size: 14px;
            }

            .tab-content {
                padding: 20px;
            }

            .page-selector {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
                gap: 12px;
            }
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>PDF处理工具</h1>
            <p>专业的PDF分割、合并、删除和提取工具</p>
        </div>

        <div class="tabs">
            <button class="tab active" data-tab="split">分割PDF</button>
            <button class="tab" data-tab="merge">合并PDF</button>
            <button class="tab" data-tab="delete">删除页面</button>
            <button class="tab" data-tab="extract">提取页面</button>
        </div>

        <!-- 分割PDF -->
        <div class="tab-content active" id="split">
            <div class="upload-area" onclick="document.getElementById('splitFile').click()">
                <div class="upload-icon">📄</div>
                <div class="upload-text">点击或拖拽上传PDF文件</div>
                <div class="upload-hint">支持拖拽上传，文件大小限制100MB</div>
            </div>
            <input type="file" id="splitFile" class="file-input" accept=".pdf">
            
            <div class="input-group">
                <label for="pageRange">页码范围 (例如: 1-3,5,7-9)</label>
                <input type="text" id="pageRange" placeholder="请输入要分割的页码范围">
            </div>
            
            <button class="btn" onclick="splitPDF()">开始分割</button>
            
            <div class="loading" id="splitLoading">
                <div class="spinner"></div>
                <p>正在处理PDF文件...</p>
            </div>
        </div>

        <!-- 合并PDF -->
        <div class="tab-content" id="merge">
            <div class="upload-area" onclick="document.getElementById('mergeFiles').click()">
                <div class="upload-icon">📚</div>
                <div class="upload-text">选择多个PDF文件进行合并</div>
                <div class="upload-hint">可以选择多个文件，支持拖拽排序</div>
            </div>
            <input type="file" id="mergeFiles" class="file-input" accept=".pdf" multiple>
            
            <div class="merge-area" id="mergeArea">
                <p style="text-align: center; color: #999; margin: 60px 0;">拖拽文件到此处或点击上方按钮选择文件</p>
            </div>
            
            <button class="btn" onclick="mergePDFs()">开始合并</button>
            
            <div class="loading" id="mergeLoading">
                <div class="spinner"></div>
                <p>正在合并PDF文件...</p>
            </div>
        </div>

        <!-- 删除页面 -->
        <div class="tab-content" id="delete">
            <div class="upload-area" onclick="document.getElementById('deleteFile').click()">
                <div class="upload-icon">🗑️</div>
                <div class="upload-text">上传PDF文件以删除指定页面</div>
                <div class="upload-hint">选择要删除的页面后生成新的PDF</div>
            </div>
            <input type="file" id="deleteFile" class="file-input" accept=".pdf">
            
            <div class="page-selector" id="deletePageSelector"></div>
            
            <button class="btn" onclick="deletePages()">删除选中页面</button>
            
            <div class="loading" id="deleteLoading">
                <div class="spinner"></div>
                <p>正在处理PDF文件...</p>
            </div>
        </div>

        <!-- 提取页面 -->
        <div class="tab-content" id="extract">
            <div class="upload-area" onclick="document.getElementById('extractFile').click()">
                <div class="upload-icon">📋</div>
                <div class="upload-text">上传PDF文件以提取指定页面</div>
                <div class="upload-hint">选择要提取的页面组合</div>
            </div>
            <input type="file" id="extractFile" class="file-input" accept=".pdf">
            
            <div class="page-selector" id="extractPageSelector"></div>
            
            <button class="btn" onclick="extractPages()">提取选中页面</button>
            
            <div class="loading" id="extractLoading">
                <div class="spinner"></div>
                <p>正在处理PDF文件...</p>
            </div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

        <p style="
            color: #333;
            font-size: 18px;
            font-weight: 600;
            margin: 15px 0 8px 0;
        ">小曾AI纪</p>
        <p style="
            color: #666;
            font-size: 16px;
            margin-bottom: 10px;
        ">扫码关注获取更多实用工具</p>
        <p style="
            color: #999;
            font-size: 14px;
        ">分享技术干货 | 实用工具推荐</p>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script>
        // 全局变量
        let currentPDFs = {
            split: null,
            merge: [],
            delete: null,
            extract: null
        };

        let selectedPages = {
            delete: new Set(),
            extract: new Set()
        };

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initializeTabs();
            initializeDragAndDrop();
            initializeFileInputs();
        });

        // 标签页切换
        function initializeTabs() {
            const tabs = document.querySelectorAll('.tab');
            const contents = document.querySelectorAll('.tab-content');

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const targetTab = tab.dataset.tab;
                    
                    tabs.forEach(t => t.classList.remove('active'));
                    contents.forEach(c => c.classList.remove('active'));
                    
                    tab.classList.add('active');
                    document.getElementById(targetTab).classList.add('active');
                });
            });
        }

        // 拖拽上传
        function initializeDragAndDrop() {
            const uploadAreas = document.querySelectorAll('.upload-area');
            
            uploadAreas.forEach(area => {
                area.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    area.classList.add('dragover');
                });

                area.addEventListener('dragleave', () => {
                    area.classList.remove('dragover');
                });

                area.addEventListener('drop', (e) => {
                    e.preventDefault();
                    area.classList.remove('dragover');
                    
                    const files = Array.from(e.dataTransfer.files).filter(file => file.type === 'application/pdf');
                    if (files.length > 0) {
                        handleFileUpload(files, area);
                    }
                });
            });

            // 合并区域拖拽排序
            const mergeArea = document.getElementById('mergeArea');
            mergeArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                mergeArea.classList.add('dragover');
            });

            mergeArea.addEventListener('dragleave', () => {
                mergeArea.classList.remove('dragover');
            });

            mergeArea.addEventListener('drop', (e) => {
                e.preventDefault();
                mergeArea.classList.remove('dragover');
                
                const files = Array.from(e.dataTransfer.files).filter(file => file.type === 'application/pdf');
                if (files.length > 0) {
                    addFilesToMerge(files);
                }
            });
        }

        // 文件输入初始化
        function initializeFileInputs() {
            document.getElementById('splitFile').addEventListener('change', (e) => {
                if (e.target.files[0]) {
                    handleSingleFileUpload(e.target.files[0], 'split');
                }
            });

            document.getElementById('mergeFiles').addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    addFilesToMerge(Array.from(e.target.files));
                }
            });

            document.getElementById('deleteFile').addEventListener('change', (e) => {
                if (e.target.files[0]) {
                    handleSingleFileUpload(e.target.files[0], 'delete');
                }
            });

            document.getElementById('extractFile').addEventListener('change', (e) => {
                if (e.target.files[0]) {
                    handleSingleFileUpload(e.target.files[0], 'extract');
                }
            });
        }

        // 处理单文件上传
        async function handleSingleFileUpload(file, type) {
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
                
                currentPDFs[type] = {
                    file: file,
                    doc: pdfDoc,
                    pageCount: pdfDoc.getPageCount()
                };

                if (type === 'delete' || type === 'extract') {
                    renderPageSelector(type, pdfDoc.getPageCount());
                }

                showNotification(`${file.name} 上传成功！共 ${pdfDoc.getPageCount()} 页`, 'success');
            } catch (error) {
                showNotification('文件上传失败，请确保文件是有效的PDF格式', 'error');
                console.error('Error loading PDF:', error);
            }
        }

        // 添加文件到合并列表
        function addFilesToMerge(files) {
            files.forEach(file => {
                if (file.type === 'application/pdf') {
                    currentPDFs.merge.push({
                        file: file,
                        id: Date.now() + Math.random()
                    });
                }
            });
            renderMergeList();
        }

        // 渲染合并列表
        function renderMergeList() {
            const mergeArea = document.getElementById('mergeArea');
            
            if (currentPDFs.merge.length === 0) {
                mergeArea.innerHTML = '<p style="text-align: center; color: #999; margin: 60px 0;">拖拽文件到此处或点击上方按钮选择文件</p>';
                return;
            }

            mergeArea.innerHTML = currentPDFs.merge.map((item, index) => `
                <div class="merge-item" draggable="true" data-id="${item.id}">
                    <div class="drag-handle">⋮⋮</div>
                    <div class="file-icon">PDF</div>
                    <div class="file-details">
                        <div class="file-name">${item.file.name}</div>
                        <div class="file-size">${formatFileSize(item.file.size)}</div>
                    </div>
                    <button class="btn btn-danger btn-small" onclick="removeFromMerge('${item.id}')">移除</button>
                </div>
            `).join('');

            // 添加拖拽排序功能
            addDragSortingToMergeList();
        }

        // 添加拖拽排序
        function addDragSortingToMergeList() {
            const mergeItems = document.querySelectorAll('.merge-item');
            let draggedElement = null;

            mergeItems.forEach(item => {
                item.addEventListener('dragstart', (e) => {
                    draggedElement = item;
                    item.style.opacity = '0.5';
                });

                item.addEventListener('dragend', () => {
                    item.style.opacity = '1';
                    draggedElement = null;
                });

                item.addEventListener('dragover', (e) => {
                    e.preventDefault();
                });

                item.addEventListener('drop', (e) => {
                    e.preventDefault();
                    if (draggedElement && draggedElement !== item) {
                        const draggedId = draggedElement.dataset.id;
                        const targetId = item.dataset.id;
                        
                        const draggedIndex = currentPDFs.merge.findIndex(pdf => pdf.id == draggedId);
                        const targetIndex = currentPDFs.merge.findIndex(pdf => pdf.id == targetId);
                        
                        // 重新排序
                        const [draggedItem] = currentPDFs.merge.splice(draggedIndex, 1);
                        currentPDFs.merge.splice(targetIndex, 0, draggedItem);
                        
                        renderMergeList();
                    }
                });
            });
        }

        // 从合并列表移除文件
        function removeFromMerge(id) {
            currentPDFs.merge = currentPDFs.merge.filter(item => item.id != id);
            renderMergeList();
        }

        // 渲染页面选择器
        function renderPageSelector(type, pageCount) {
            const selector = document.getElementById(`${type}PageSelector`);
            selectedPages[type].clear();
            
            selector.innerHTML = Array.from({length: pageCount}, (_, i) => `
                <div class="page-item" data-page="${i + 1}" onclick="togglePageSelection('${type}', ${i + 1})">
                    <span>第 ${i + 1} 页</span>
                </div>
            `).join('');
        }

        // 切换页面选择
        function togglePageSelection(type, pageNum) {
            const pageItem = document.querySelector(`#${type}PageSelector .page-item[data-page="${pageNum}"]`);
            
            if (selectedPages[type].has(pageNum)) {
                selectedPages[type].delete(pageNum);
                pageItem.classList.remove('selected');
            } else {
                selectedPages[type].add(pageNum);
                pageItem.classList.add('selected');
            }
        }

        // 分割PDF
        async function splitPDF() {
            if (!currentPDFs.split) {
                showNotification('请先上传PDF文件', 'error');
                return;
            }

            const pageRange = document.getElementById('pageRange').value.trim();
            if (!pageRange) {
                showNotification('请输入页码范围', 'error');
                return;
            }

            const loading = document.getElementById('splitLoading');
            loading.classList.add('show');

            try {
                const ranges = parsePageRange(pageRange, currentPDFs.split.pageCount);
                const pdfDoc = await PDFLib.PDFDocument.load(await currentPDFs.split.file.arrayBuffer());
                const newPdfDoc = await PDFLib.PDFDocument.create();

                for (const pageIndex of ranges) {
                    const [copiedPage] = await newPdfDoc.copyPages(pdfDoc, [pageIndex - 1]);
                    newPdfDoc.addPage(copiedPage);
                }

                const pdfBytes = await newPdfDoc.save();
                downloadPDF(pdfBytes, `分割_${currentPDFs.split.file.name}`);
                
                showNotification('PDF分割完成！', 'success');
            } catch (error) {
                showNotification('分割失败：' + error.message, 'error');
                console.error('Split error:', error);
            } finally {
                loading.classList.remove('show');
            }
        }

        // 合并PDF
        async function mergePDFs() {
            if (currentPDFs.merge.length < 2) {
                showNotification('请至少选择两个PDF文件进行合并', 'error');
                return;
            }

            const loading = document.getElementById('mergeLoading');
            loading.classList.add('show');

            try {
                const mergedPdf = await PDFLib.PDFDocument.create();

                for (const pdfItem of currentPDFs.merge) {
                    const arrayBuffer = await pdfItem.file.arrayBuffer();
                    const pdf = await PDFLib.PDFDocument.load(arrayBuffer);
                    const pageIndices = Array.from({length: pdf.getPageCount()}, (_, i) => i);
                    const copiedPages = await mergedPdf.copyPages(pdf, pageIndices);
                    copiedPages.forEach(page => mergedPdf.addPage(page));
                }

                const pdfBytes = await mergedPdf.save();
                downloadPDF(pdfBytes, '合并文档.pdf');
                
                showNotification('PDF合并完成！', 'success');
            } catch (error) {
                showNotification('合并失败：' + error.message, 'error');
                console.error('Merge error:', error);
            } finally {
                loading.classList.remove('show');
            }
        }

        // 删除页面
        async function deletePages() {
            if (!currentPDFs.delete) {
                showNotification('请先上传PDF文件', 'error');
                return;
            }

            if (selectedPages.delete.size === 0) {
                showNotification('请选择要删除的页面', 'error');
                return;
            }

            const loading = document.getElementById('deleteLoading');
            loading.classList.add('show');

            try {
                const pdfDoc = await PDFLib.PDFDocument.load(await currentPDFs.delete.file.arrayBuffer());
                const newPdfDoc = await PDFLib.PDFDocument.create();
                
                const totalPages = pdfDoc.getPageCount();
                const pagesToKeep = [];
                
                for (let i = 1; i <= totalPages; i++) {
                    if (!selectedPages.delete.has(i)) {
                        pagesToKeep.push(i - 1);
                    }
                }

                if (pagesToKeep.length === 0) {
                    showNotification('不能删除所有页面', 'error');
                    return;
                }

                const copiedPages = await newPdfDoc.copyPages(pdfDoc, pagesToKeep);
                copiedPages.forEach(page => newPdfDoc.addPage(page));

                const pdfBytes = await newPdfDoc.save();
                downloadPDF(pdfBytes, `删除页面_${currentPDFs.delete.file.name}`);
                
                showNotification('页面删除完成！', 'success');
            } catch (error) {
                showNotification('删除失败：' + error.message, 'error');
                console.error('Delete error:', error);
            } finally {
                loading.classList.remove('show');
            }
        }

        // 提取页面
        async function extractPages() {
            if (!currentPDFs.extract) {
                showNotification('请先上传PDF文件', 'error');
                return;
            }

            if (selectedPages.extract.size === 0) {
                showNotification('请选择要提取的页面', 'error');
                return;
            }

            const loading = document.getElementById('extractLoading');
            loading.classList.add('show');

            try {
                const pdfDoc = await PDFLib.PDFDocument.load(await currentPDFs.extract.file.arrayBuffer());
                const newPdfDoc = await PDFLib.PDFDocument.create();
                
                const pagesToExtract = Array.from(selectedPages.extract).sort((a, b) => a - b);
                const pageIndices = pagesToExtract.map(page => page - 1);

                const copiedPages = await newPdfDoc.copyPages(pdfDoc, pageIndices);
                copiedPages.forEach(page => newPdfDoc.addPage(page));

                const pdfBytes = await newPdfDoc.save();
                downloadPDF(pdfBytes, `提取页面_${currentPDFs.extract.file.name}`);
                
                showNotification('页面提取完成！', 'success');
            } catch (error) {
                showNotification('提取失败：' + error.message, 'error');
                console.error('Extract error:', error);
            } finally {
                loading.classList.remove('show');
            }
        }

        // 解析页码范围
        function parsePageRange(rangeStr, maxPages) {
            const ranges = rangeStr.split(',').map(s => s.trim());
            const pages = new Set();

            for (const range of ranges) {
                if (range.includes('-')) {
                    const [start, end] = range.split('-').map(n => parseInt(n.trim()));
                    if (isNaN(start) || isNaN(end) || start < 1 || end > maxPages || start > end) {
                        throw new Error(`无效的页码范围: ${range}`);
                    }
                    for (let i = start; i <= end; i++) {
                        pages.add(i);
                    }
                } else {
                    const page = parseInt(range);
                    if (isNaN(page) || page < 1 || page > maxPages) {
                        throw new Error(`无效的页码: ${range}`);
                    }
                    pages.add(page);
                }
            }

            return Array.from(pages).sort((a, b) => a - b);
        }

        // 下载PDF
        function downloadPDF(pdfBytes, filename) {
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // 显示通知
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type}`;
            notification.classList.add('show');

            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // 处理文件上传（通用）
        function handleFileUpload(files, area) {
            const tabContent = area.closest('.tab-content');
            const tabId = tabContent.id;

            if (tabId === 'merge') {
                addFilesToMerge(files);
            } else {
                if (files[0]) {
                    handleSingleFileUpload(files[0], tabId);
                }
            }
        }
    </script>
