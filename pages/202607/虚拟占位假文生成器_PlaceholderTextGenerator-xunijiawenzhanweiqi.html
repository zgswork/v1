    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        document.addEventListener('DOMContentLoaded', function() {
            const generateBtn = document.getElementById('generate-btn');
            const copyBtn = document.getElementById('copy-btn');
            const output = document.getElementById('output');
            const zhBtn = document.getElementById('zh-btn');
            const enBtn = document.getElementById('en-btn');
            
            // 语言包
            const translations = {
                zh: {

                    typeLabel: "假文类型",
                    typeOptions: {
                        lorem: "Lorem Ipsum (拉丁文)",
                        chinese: "中文假文",

                        mixed: "中英混合"
                    },
                    lengthLabel: "生成长度",
                    lengthOptions: {
                        short: "短 (约50字)",
                        medium: "中 (约200字)",
                        long: "长 (约500字)",
                        paragraph: "段落 (5段)"
                    },
                    styleLabel: "文本风格",
                    styleOptions: {
                        normal: "普通文本",
                        literary: "文学风格",
                        technical: "技术文档",
                        business: "商业文案"
                    },
                    generateBtn: "生成假文",
                    copyBtn: "复制到剪贴板",
                    disclaimerTitle: "免责声明",
                    disclaimerContent: "本工具生成的文本仅为占位用途，不构成任何实际意义。使用者应对生成内容自行判断，作者不对文本的适用性或准确性作任何保证。使用本工具即表示您同意自行承担所有风险。",
                    authorInfo: "作者：文璧 | 联系邮箱："
                },
                en: {

                    },
                    lengthLabel: "Length",
                    lengthOptions: {

                    },
                    styleLabel: "Style",
                    styleOptions: {
                        normal: "Normal Text",
                        literary: "Literary Style",
                        technical: "Technical Document",
                        business: "Business Copy"
                    },
                    generateBtn: "Generate Text",
                    copyBtn: "Copy to Clipboard",
                    disclaimerTitle: "Disclaimer",
                    disclaimerContent: "The text generated by this tool is for placeholder purposes only and carries no actual meaning. Users should exercise their own judgment regarding the generated content. The author makes no warranties about the suitability or accuracy of the text. By using this tool, you agree to assume all risks.",
                    authorInfo: "Author: Wen Bi | Contact: "
                }
            };
            
            // 当前语言
            let currentLang = 'zh';
            
            // 切换语言函数
            function switchLanguage(lang) {
                currentLang = lang;
                const t = translations[lang];
                
                // 更新UI文本
                document.getElementById('title').textContent = t.title;
                document.getElementById('type-label').textContent = t.typeLabel;
                document.getElementById('length-label').textContent = t.lengthLabel;
                document.getElementById('style-label').textContent = t.styleLabel;
                document.getElementById('generate-btn').textContent = t.generateBtn;
                document.getElementById('copy-btn').textContent = t.copyBtn;
                document.getElementById('disclaimer-title').textContent = t.disclaimerTitle;
                document.getElementById('disclaimer-content').textContent = t.disclaimerContent;
                document.getElementById('author-info').innerHTML = t.authorInfo + 
                    '<a href="mailto:2675741975@qq.com">2675741975@qq.com</a>';
                
                // 更新下拉选项
                const typeSelect = document.getElementById('type');
                updateSelectOptions(typeSelect, t.typeOptions);
                
                const lengthSelect = document.getElementById('length');
                updateSelectOptions(lengthSelect, t.lengthOptions);
                
                const styleSelect = document.getElementById('style');
                updateSelectOptions(styleSelect, t.styleOptions);
                
                // 更新按钮状态
                zhBtn.classList.toggle('active', lang === 'zh');
                enBtn.classList.toggle('active', lang === 'en');
                
                // 重新生成文本
                generateText();
            }
            
            // 更新下拉选项
            function updateSelectOptions(selectElement, options) {
                const currentValue = selectElement.value;
                selectElement.innerHTML = '';
                
                for (const [value, text] of Object.entries(options)) {
                    const option = document.createElement('option');
                    option.value = value;
                    option.textContent = text;
                    selectElement.appendChild(option);
                }
                
                // 保持当前选中的值
                if (selectElement.querySelector(`option[value="${currentValue}"]`)) {
                    selectElement.value = currentValue;
                }
            }
            
            // 假文数据
            const loremIpsum = "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.";
            
            const chineseText = "天地玄黄宇宙洪荒日月盈昃辰宿列张寒来暑往秋收冬藏闰余成岁律吕调阳云腾致雨露结为霜金生丽水玉出昆冈剑号巨阙珠称夜光果珍李柰菜重芥姜海咸河淡鳞潜羽翔龙师火帝鸟官人皇始制文字乃服衣裳推位让国有虞陶唐吊民伐罪周发殷汤坐朝问道垂拱平章爱育黎首臣伏戎羌遐迩一体率宾归王鸣凤在竹白驹食场化被草木赖及万方盖此身发四大五常恭惟鞠养岂敢毁伤女慕贞洁男效才良知过必改得能莫忘罔谈彼短靡恃己长信使可覆器欲难量墨悲丝染诗赞羔羊景行维贤克念作圣德建名立形端表正空谷传声虚堂习听祸因恶积福缘善庆尺璧非宝寸阴是竞资父事君曰严与敬孝当竭力忠则尽命临深履薄夙兴温凊似兰斯馨如松之盛川流不息渊澄取映容止若思言辞安定笃初诚美慎终宜令荣业所基籍甚无竟学优登仕摄职从政存以甘棠去而益咏乐殊贵贱礼别尊卑上和下睦夫唱妇随外受傅训入奉母仪诸姑伯叔犹子比儿孔怀兄弟同气连枝交友投分切磨箴规仁慈隐恻造次弗离节义廉退颠沛匪亏性静情逸心动神疲守真志满逐物意移坚持雅操好爵自縻都邑华夏东西二京背邙面洛浮渭据泾宫殿盘郁楼观飞惊图写禽兽画彩仙灵丙舍傍启甲帐对楹肆筵设席鼓瑟吹笙升阶纳陛弁转疑星右通广内左达承明既集坟典亦聚群英杜稿钟隶漆书壁经府罗将相路侠槐卿户封八县家给千兵高冠陪辇驱毂振缨世禄侈富车驾肥轻策功茂实勒碑刻铭磻溪伊尹佐时阿衡奄宅曲阜微旦孰营桓公匡合济弱扶倾绮回汉惠说感武丁俊乂密勿多士寔宁晋楚更霸赵魏困横假途灭虢践土会盟何遵约法韩弊烦刑起翦颇牧用军最精宣威沙漠驰誉丹青九州禹迹百郡秦并岳宗泰岱禅主云亭雁门紫塞鸡田赤城昆池碣石钜野洞庭旷远绵邈岩岫杳冥治本于农务兹稼穑俶载南亩我艺黍稷税熟贡新劝赏黜陟孟轲敦素史鱼秉直庶几中庸劳谦谨敕聆音察理鉴貌辨色贻厥嘉猷勉其祗植省躬讥诫宠增抗极殆辱近耻林皋幸即两疏见机解组谁逼索居闲处沉默寂寥求古寻论散虑逍遥欣奏累遣戚谢欢招渠荷的历园莽抽条枇杷晚翠梧桐蚤凋陈根委翳落叶飘摇游鹍独运凌摩绛霄耽读玩市寓目囊箱易輶攸畏属耳垣墙具膳餐饭适口充肠饱饫烹宰饥厌糟糠亲戚故旧老少异粮妾御绩纺侍巾帷房纨扇圆絜银烛炜煌昼眠夕寐蓝笋象床弦歌酒宴接杯举觞矫手顿足悦豫且康嫡后嗣续祭祀烝尝稽颡再拜悚惧恐惶笺牒简要顾答审详骸垢想浴执热愿凉驴骡犊特骇跃超骧诛斩贼盗捕获叛亡布射僚丸嵇琴阮啸恬笔伦纸钧巧任钓释纷利俗竝皆佳妙毛施淑姿工颦妍笑年矢每催曦晖朗曜璇玑悬斡晦魄环照指薪修祜永绥吉劭矩步引领俯仰廊庙束带矜庄徘徊瞻眺孤陋寡闻愚蒙等诮谓语助者焉哉乎也";
            
            const englishText = "The quick brown fox jumps over the lazy dog. Pack my box with five dozen liquor jugs. How vexingly quick daft zebras jump! Bright vixens jump; dozy fowl quack. Sphinx of black quartz, judge my vow. Waltz, bad nymph, for quick jigs vex! Glib jocks quiz nymph to vex dwarf. Jackdaws love my big sphinx of quartz. The five boxing wizards jump quickly. How quickly daft jumping zebras vex.";
            
            // 生成假文函数
            function generateText() {
                const type = document.getElementById('type').value;
                const length = document.getElementById('length').value;
                const style = document.getElementById('style').value;
                
                let baseText = '';
                let result = '';
                
                // 根据类型选择基础文本
                switch(type) {
                    case 'lorem':
                        baseText = loremIpsum;
                        break;
                    case 'chinese':
                        baseText = chineseText;
                        break;
                    case 'english':
                        baseText = englishText;
                        break;
                    case 'mixed':
                        baseText = chineseText + " " + englishText;
                        break;
                }
                
                // 根据长度生成文本
                switch(length) {
                    case 'short':
                        result = baseText.repeat(1).substring(0, 50);
                        break;
                    case 'medium':
                        result = baseText.repeat(3).substring(0, 200);
                        break;
                    case 'long':
                        result = baseText.repeat(6).substring(0, 500);
                        break;
                    case 'paragraph':
                        for (let i = 0; i < 5; i++) {
                            let paragraph = baseText.repeat(1).substring(0, 100);
                            if (style === 'literary') {
                                paragraph = currentLang === 'zh' ? "「" + paragraph + "」" : '"' + paragraph + '"';
                            } else if (style === 'technical') {
                                paragraph = (currentLang === 'zh' ? "1. " : "1. ") + paragraph;
                            } else if (style === 'business') {
                                paragraph = (currentLang === 'zh' ? "★ " : "★ ") + paragraph;
                            }
                            result += paragraph + "\n\n";
                        }
                        break;
                }
                
                // 如果不是段落模式，添加风格修饰
                if (length !== 'paragraph') {
                    if (style === 'literary') {
                        result = currentLang === 'zh' ? "「" + result + "」" : '"' + result + '"';
                    } else if (style === 'technical') {
                        result = (currentLang === 'zh' ? "• " : "• ") + result;
                    } else if (style === 'business') {
                        result = (currentLang === 'zh' ? "☆ " : "☆ ") + result;
                    }
                }
                
                output.textContent = result;
            }
            
            // 复制功能
            function copyToClipboard() {
                const text = output.textContent;
                navigator.clipboard.writeText(text).then(() => {
                    alert(currentLang === 'zh' ? '已复制到剪贴板！' : 'Copied to clipboard!');
                }).catch(err => {
                    console.error('复制失败: ', err);
                });
            }
            
            // 事件监听
            generateBtn.addEventListener('click', generateText);
            copyBtn.addEventListener('click', copyToClipboard);
            zhBtn.addEventListener('click', () => switchLanguage('zh'));
            enBtn.addEventListener('click', () => switchLanguage('en'));
            
            // 初始生成一次
            switchLanguage('zh');
        });
    </script>
