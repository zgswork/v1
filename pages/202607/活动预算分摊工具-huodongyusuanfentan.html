<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>活动预算分摊工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981',
                        accent: '#F59E0B',
                        danger: '#EF4444',
                        dark: '#1E293B',
                        light: '#F8FAFC'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .card-shadow {
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            }
            .input-focus {
                @apply focus:ring-2 focus:ring-primary/50 focus:border-primary focus:outline-none;
            }
            .slide-in {
                animation: slideIn 0.3s ease-out forwards;
            }
            .fade-in {
                animation: fadeIn 0.5s ease-out forwards;
            }
            .pulse {
                animation: pulse 2s infinite;
            }
        }

        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans text-dark min-h-screen flex flex-col">
    <!-- 顶部导航 -->
    <header class="bg-white shadow-sm py-4">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <i class="fa fa-calculator text-primary text-2xl"></i>
                    <h1 class="text-xl font-bold">活动预算分摊工具</h1>
                </div>
                <div class="text-sm text-gray-500 flex items-center gap-1">
                    <i class="fa fa-lightbulb-o text-accent"></i>
                    <span>轻松算账，公平分摊</span>
                </div>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="flex-grow container mx-auto px-4 py-6">
        <!-- 介绍部分 -->
        <section class="mb-8 text-center max-w-2xl mx-auto">
            <p class="text-gray-600">
                无论是聚餐、旅行还是团队活动，轻松计算每个人需要支付的金额，支持AA制和按项目分摊两种方式，并可设置预算提醒。
            </p>
        </section>

        <!-- 输入区域 -->
        <section class="max-w-3xl mx-auto mb-8">
            <div class="bg-white rounded-xl shadow-md p-6 card-shadow">
                <h2 class="text-lg font-semibold mb-4 pb-2 border-b border-gray-100">基本信息</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div>
                        <label for="budget-limit" class="block text-sm font-medium text-gray-700 mb-1">预算上限 (元)</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                                <i class="fa fa-money"></i>
                            </span>
                            <input type="number" id="budget-limit" 
                                   class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg input-focus"
                                   placeholder="设置预算上限" min="0" step="0.01">
                        </div>
                    </div>
                    
                    <div>
                        <label for="total-amount" class="block text-sm font-medium text-gray-700 mb-1">实际总费用 (元)</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                                <i class="fa fa-rmb"></i>
                            </span>
                            <input type="number" id="total-amount" 
                                   class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg input-focus"
                                   placeholder="输入实际总金额" min="0" step="0.01">
                        </div>
                    </div>
                    
                    <div class="md:col-span-2">
                        <label for="participants" class="block text-sm font-medium text-gray-700 mb-1">参与人数</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                                <i class="fa fa-users"></i>
                            </span>
                            <input type="number" id="participants" 
                                   class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg input-focus"
                                   placeholder="输入人数" min="1" value="1">
                        </div>
                    </div>
                </div>
                
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">分摊方式</label>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div class="relative">
                            <input type="radio" id="split-aa" name="split-method" value="aa" 
                                   class="peer sr-only" checked>
                            <label for="split-aa" class="block w-full p-4 border-2 rounded-lg cursor-pointer 
                                  peer-checked:border-primary peer-checked:bg-primary/5 hover:bg-gray-50 transition-colors">
                                <div class="flex items-center gap-3">
                                    <div class="w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center text-primary">
                                        <i class="fa fa-balance-scale"></i>
                                    </div>
                                    <div>
                                        <h3 class="font-medium">AA制</h3>
                                        <p class="text-sm text-gray-500">所有人平均分摊</p>
                                    </div>
                                </div>
                            </label>
                        </div>
                        
                        <div class="relative">
                            <input type="radio" id="split-item" name="split-method" value="item" 
                                   class="peer sr-only">
                            <label for="split-item" class="block w-full p-4 border-2 rounded-lg cursor-pointer 
                                  peer-checked:border-primary peer-checked:bg-primary/5 hover:bg-gray-50 transition-colors">
                                <div class="flex items-center gap-3">
                                    <div class="w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center text-primary">
                                        <i class="fa fa-list-alt"></i>
                                    </div>
                                    <div>
                                        <h3 class="font-medium">按消费项目</h3>
                                        <p class="text-sm text-gray-500">按项目和参与人分摊</p>
                                    </div>
                                </div>
                            </label>
                        </div>
                    </div>
                </div>
                
                <!-- 按项目分摊设置 (默认隐藏) -->
                <div id="item-split-settings" class="hidden slide-in border-t border-gray-100 pt-4 mt-4">
                    <h3 class="text-md font-medium mb-3">消费项目设置</h3>
                    
                    <div id="items-container">
                        <div class="item-group bg-gray-50 p-4 rounded-lg mb-3">
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-2">
                                <div>
                                    <label class="block text-xs text-gray-500 mb-1">项目名称</label>
                                    <input type="text" class="item-name w-full px-3 py-2 border border-gray-300 rounded input-focus text-sm" 
                                           placeholder="如：晚餐、电影票">
                                </div>
                                <div>
                                    <label class="block text-xs text-gray-500 mb-1">项目金额 (元)</label>
                                    <input type="number" class="item-amount w-full px-3 py-2 border border-gray-300 rounded input-focus text-sm" 
                                           placeholder="0.00" min="0" step="0.01">
                                </div>
                                <div>
                                    <label class="block text-xs text-gray-500 mb-1">参与人数</label>
                                    <input type="number" class="item-participants w-full px-3 py-2 border border-gray-300 rounded input-focus text-sm" 
                                           placeholder="参与此项目的人数" min="1" value="1">
                                </div>
                            </div>
                            <button type="button" class="remove-item text-sm text-red-500 hover:text-red-700 flex items-center">
                                <i class="fa fa-trash-o mr-1"></i> 删除项目
                            </button>
                        </div>
                    </div>
                    
                    <button type="button" id="add-item" class="mt-2 text-sm text-primary hover:text-primary/80 flex items-center">
                        <i class="fa fa-plus-circle mr-1"></i> 添加项目
                    </button>
                </div>
                
                <button id="calculate" class="w-full bg-primary hover:bg-primary/90 text-white font-medium py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2">
                    <i class="fa fa-calculator"></i>
                    <span>计算分摊金额</span>
                </button>
            </div>
        </section>
        
        <!-- 预算状态提示 -->
        <div id="budget-status" class="max-w-3xl mx-auto mb-6 hidden fade-in"></div>
        
        <!-- 结果展示区域 -->
        <section id="result-section" class="max-w-4xl mx-auto hidden fade-in">
            <div class="bg-white rounded-xl shadow-md p-6 card-shadow">
                <h2 class="text-lg font-semibold mb-4 pb-2 border-b border-gray-100 flex items-center">
                    <i class="fa fa-bar-chart text-primary mr-2"></i>
                    分摊结果
                </h2>
                
                <div id="aa-result" class="mb-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                        <div class="bg-gray-50 p-4 rounded-lg">
                            <p class="text-sm text-gray-500">活动总费用</p>
                            <p id="result-total" class="text-xl font-bold text-dark">¥0.00</p>
                        </div>
                        <div class="bg-gray-50 p-4 rounded-lg">
                            <p class="text-sm text-gray-500">参与人数</p>
                            <p id="result-people" class="text-xl font-bold text-dark">0人</p>
                        </div>
                        <div class="bg-primary/5 p-4 rounded-lg border border-primary/20">
                            <p class="text-sm text-gray-500">每人应付</p>
                            <p id="result-per-person" class="text-xl font-bold text-primary">¥0.00</p>
                        </div>
                    </div>
                </div>
                
                <div id="item-result" class="hidden mb-6">
                    <h3 class="font-medium mb-3">项目明细</h3>
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200 text-sm">
                            <thead>
                                <tr>
                                    <th class="px-3 py-2 bg-gray-50 text-left font-medium text-gray-500 rounded-tl-lg">项目名称</th>
                                    <th class="px-3 py-2 bg-gray-50 text-right font-medium text-gray-500">项目金额</th>
                                    <th class="px-3 py-2 bg-gray-50 text-right font-medium text-gray-500">参与人数</th>
                                    <th class="px-3 py-2 bg-gray-50 text-right font-medium text-gray-500 rounded-tr-lg">人均金额</th>
                                </tr>
                            </thead>
                            <tbody id="items-result-table" class="divide-y divide-gray-100">
                                <!-- 项目结果将在这里动态生成 -->
                            </tbody>
                        </table>
                    </div>
                    
                    <div class="mt-4 pt-4 border-t border-gray-100">
                        <div class="flex justify-between items-center">
                            <span class="font-medium">总计</span>
                            <span id="items-total" class="font-bold text-lg">¥0.00</span>
                        </div>
                    </div>
                </div>
                
                <div class="mt-6 flex justify-center">
                    <button id="reset" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2 px-6 rounded-lg transition-colors flex items-center gap-1">
                        <i class="fa fa-refresh"></i>
                        <span>重新计算</span>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer class="bg-dark text-white/70 py-6 px-4 text-center text-sm mt-12">
        <p class="mb-2">本工具由 邓文涛(AI版) 制作</p>
        <p class="mb-2">微信：707547441</p>
        <p>QQ邮箱：<a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="fec9cec9cbcac9cacacfbe8f8fd09d9193">[email&#160;protected]</a></p>
    </footer>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const splitMethodInputs = document.querySelectorAll('input[name="split-method"]');
            const itemSplitSettings = document.getElementById('item-split-settings');
            const addItemBtn = document.getElementById('add-item');
            const itemsContainer = document.getElementById('items-container');
            const calculateBtn = document.getElementById('calculate');
            const resetBtn = document.getElementById('reset');
            const resultSection = document.getElementById('result-section');
            const aaResult = document.getElementById('aa-result');
            const itemResult = document.getElementById('item-result');
            const budgetStatus = document.getElementById('budget-status');
            const budgetLimitInput = document.getElementById('budget-limit');
            const totalAmountInput = document.getElementById('total-amount');
            
            // 分摊方式切换
            splitMethodInputs.forEach(input => {
                input.addEventListener('change', function() {
                    if (this.value === 'item') {
                        itemSplitSettings.classList.remove('hidden');
                    } else {
                        itemSplitSettings.classList.add('hidden');
                    }
                });
            });
            
            // 添加项目
            addItemBtn.addEventListener('click', function() {
                const newItem = document.createElement('div');
                newItem.className = 'item-group bg-gray-50 p-4 rounded-lg mb-3 slide-in';
                newItem.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-2">
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">项目名称</label>
                            <input type="text" class="item-name w-full px-3 py-2 border border-gray-300 rounded input-focus text-sm" 
                                   placeholder="如：晚餐、电影票">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">项目金额 (元)</label>
                            <input type="number" class="item-amount w-full px-3 py-2 border border-gray-300 rounded input-focus text-sm" 
                                   placeholder="0.00" min="0" step="0.01">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">参与人数</label>
                            <input type="number" class="item-participants w-full px-3 py-2 border border-gray-300 rounded input-focus text-sm" 
                                   placeholder="参与此项目的人数" min="1" value="1">
                        </div>
                    </div>
                    <button type="button" class="remove-item text-sm text-red-500 hover:text-red-700 flex items-center">
                        <i class="fa fa-trash-o mr-1"></i> 删除项目
                    </button>
                `;
                itemsContainer.appendChild(newItem);
                
                // 为新添加的删除按钮绑定事件
                newItem.querySelector('.remove-item').addEventListener('click', function() {
                    newItem.remove();
                });
                
                // 自动聚焦到新项目的名称输入框
                newItem.querySelector('.item-name').focus();
            });
            
            // 初始删除项目按钮事件绑定
            document.querySelectorAll('.remove-item').forEach(btn => {
                btn.addEventListener('click', function() {
                    this.closest('.item-group').remove();
                });
            });
            
            // 计算按钮点击事件
            calculateBtn.addEventListener('click', function() {
                const budgetLimit = parseFloat(budgetLimitInput.value) || 0;
                const totalAmount = parseFloat(totalAmountInput.value) || 0;
                const participants = parseInt(document.getElementById('participants').value) || 1;
                const splitMethod = document.querySelector('input[name="split-method"]:checked').value;
                
                // 验证输入
                if (totalAmount <= 0) {
                    alert('请输入有效的活动总费用');
                    totalAmountInput.focus();
                    return;
                }
                
                if (participants <= 0) {
                    alert('请输入有效的参与人数');
                    document.getElementById('participants').focus();
                    return;
                }
                
                // 显示预算状态
                showBudgetStatus(budgetLimit, totalAmount);
                
                // 如果是按项目分摊，验证项目信息
                if (splitMethod === 'item') {
                    const itemGroups = document.querySelectorAll('.item-group');
                    if (itemGroups.length === 0) {
                        alert('请至少添加一个消费项目');
                        return;
                    }
                    
                    let itemsTotal = 0;
                    let valid = true;
                    
                    itemGroups.forEach((group, index) => {
                        const name = group.querySelector('.item-name').value.trim();
                        const amount = parseFloat(group.querySelector('.item-amount').value) || 0;
                        const people = parseInt(group.querySelector('.item-participants').value) || 0;
                        
                        if (!name) {
                            alert(`请输入第 ${index + 1} 个项目的名称`);
                            group.querySelector('.item-name').focus();
                            valid = false;
                            return;
                        }
                        
                        if (amount <= 0) {
                            alert(`请输入第 ${index + 1} 个项目的有效金额`);
                            group.querySelector('.item-amount').focus();
                            valid = false;
                            return;
                        }
                        
                        if (people <= 0 || people > participants) {
                            alert(`第 ${index + 1} 个项目的参与人数无效（不能为0或超过总人数）`);
                            group.querySelector('.item-participants').focus();
                            valid = false;
                            return;
                        }
                        
                        itemsTotal += amount;
                    });
                    
                    if (!valid) return;
                    
                    // 检查项目总金额是否与活动总费用一致
                    if (Math.abs(itemsTotal - totalAmount) > 0.01) {
                        if (!confirm(`项目总金额（¥${itemsTotal.toFixed(2)}）与活动总费用（¥${totalAmount.toFixed(2)}）不一致，是否继续？`)) {
                            return;
                        }
                    }
                }
                
                // 显示结果区域
                resultSection.classList.remove('hidden');
                
                // 根据分摊方式计算并显示结果
                if (splitMethod === 'aa') {
                    aaResult.classList.remove('hidden');
                    itemResult.classList.add('hidden');
                    
                    const perPerson = totalAmount / participants;
                    
                    document.getElementById('result-total').textContent = `¥${totalAmount.toFixed(2)}`;
                    document.getElementById('result-people').textContent = `${participants}人`;
                    document.getElementById('result-per-person').textContent = `¥${perPerson.toFixed(2)}`;
                } else {
                    aaResult.classList.add('hidden');
                    itemResult.classList.remove('hidden');
                    
                    const itemsResultTable = document.getElementById('items-result-table');
                    itemsResultTable.innerHTML = '';
                    
                    let total = 0;
                    const itemGroups = document.querySelectorAll('.item-group');
                    
                    itemGroups.forEach(group => {
                        const name = group.querySelector('.item-name').value.trim();
                        const amount = parseFloat(group.querySelector('.item-amount').value) || 0;
                        const people = parseInt(group.querySelector('.item-participants').value) || 0;
                        const perPerson = amount / people;
                        
                        total += amount;
                        
                        const row = document.createElement('tr');
                        row.className = 'hover:bg-gray-50 transition-colors';
                        row.innerHTML = `
                            <td class="px-3 py-3 text-left">${name}</td>
                            <td class="px-3 py-3 text-right">¥${amount.toFixed(2)}</td>
                            <td class="px-3 py-3 text-right">${people}人</td>
                            <td class="px-3 py-3 text-right font-medium">¥${perPerson.toFixed(2)}</td>
                        `;
                        itemsResultTable.appendChild(row);
                    });
                    
                    document.getElementById('items-total').textContent = `¥${total.toFixed(2)}`;
                }
                
                // 滚动到结果区域
                resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
            
            // 显示预算状态
            function showBudgetStatus(budgetLimit, totalAmount) {
                budgetStatus.classList.remove('hidden');
                
                if (budgetLimit <= 0) {
                    // 未设置预算上限
                    budgetStatus.innerHTML = `
                        <div class="bg-gray-50 border border-gray-200 rounded-lg p-4 flex items-center gap-3">
                            <i class="fa fa-info-circle text-gray-500 text-xl"></i>
                            <p class="text-gray-600">未设置预算上限，无法提供预算状态提醒</p>
                        </div>
                    `;
                } else {
                    const difference = totalAmount - budgetLimit;
                    const percentage = ((totalAmount / budgetLimit) - 1) * 100;
                    
                    if (totalAmount <= budgetLimit * 0.9) {
                        // 预算充足（低于90%）
                        budgetStatus.innerHTML = `
                            <div class="bg-green-50 border border-green-200 rounded-lg p-4 flex items-center gap-3">
                                <i class="fa fa-check-circle text-green-500 text-xl"></i>
                                <div>
                                    <p class="font-medium text-green-700">预算充足</p>
                                    <p class="text-sm text-green-600">实际消费（¥${totalAmount.toFixed(2)}）低于预算上限（¥${budgetLimit.toFixed(2)}），剩余 ¥${(budgetLimit - totalAmount).toFixed(2)}</p>
                                </div>
                            </div>
                        `;
                    } else if (totalAmount <= budgetLimit) {
                        // 接近预算（90%-100%）
                        budgetStatus.innerHTML = `
                            <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4 flex items-center gap-3">
                                <i class="fa fa-exclamation-circle text-yellow-500 text-xl"></i>
                                <div>
                                    <p class="font-medium text-yellow-700">接近预算上限</p>
                                    <p class="text-sm text-yellow-600">实际消费（¥${totalAmount.toFixed(2)}）已达到预算上限（¥${budgetLimit.toFixed(2)}）的 ${percentage.toFixed(1)}%，请注意控制开支</p>
                                </div>
                            </div>
                        `;
                    } else {
                        // 超支（超过100%）
                        budgetStatus.innerHTML = `
                            <div class="bg-red-50 border border-red-200 rounded-lg p-4 flex items-center gap-3 pulse">
                                <i class="fa fa-warning text-red-500 text-xl"></i>
                                <div>
                                    <p class="font-medium text-red-700">预算超支警告</p>
                                    <p class="text-sm text-red-600">实际消费（¥${totalAmount.toFixed(2)}）已超出预算上限（¥${budgetLimit.toFixed(2)}），超支 ¥${difference.toFixed(2)}（${percentage.toFixed(1)}%）</p>
                                </div>
                            </div>
                        `;
                    }
                }
            }
            
            // 重置按钮点击事件
            resetBtn.addEventListener('click', function() {
                // 清空输入
                budgetLimitInput.value = '';
                totalAmountInput.value = '';
                document.getElementById('participants').value = '1';
                
                // 重置为AA制
                document.getElementById('split-aa').checked = true;
                itemSplitSettings.classList.add('hidden');
                
                // 保留一个项目组，清空其他
                const itemGroups = document.querySelectorAll('.item-group');
                if (itemGroups.length > 1) {
                    for (let i = 1; i < itemGroups.length; i++) {
                        itemGroups[i].remove();
                    }
                }
                
                // 清空第一个项目组
                const firstItem = itemGroups[0];
                firstItem.querySelector('.item-name').value = '';
                firstItem.querySelector('.item-amount').value = '';
                firstItem.querySelector('.item-participants').value = '1';
                
                // 隐藏结果区域和预算状态
                resultSection.classList.add('hidden');
                budgetStatus.classList.add('hidden');
                
                // 滚动到顶部
                window.scrollTo({ top: 0, behavior: 'smooth' });
                
                // 聚焦到预算上限输入框
                setTimeout(() => {
                    budgetLimitInput.focus();
                }, 500);
            });
            
            // 输入框格式化
            const amountInputs = document.querySelectorAll('input[type="number"]');
            amountInputs.forEach(input => {
                input.addEventListener('blur', function() {
                    if (this.value && !isNaN(this.value)) {
                        const value = parseFloat(this.value);
                        this.value = value.toFixed(2);
                    }
                });
            });
        });
    </script>
</body>
</html>
