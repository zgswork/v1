<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL编码/解码工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1e90ff 0%, #0066ff 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.1) 2px, transparent 2px),
                radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.08) 3px, transparent 3px),
                radial-gradient(circle at 40% 80%, rgba(255, 255, 255, 0.06) 1px, transparent 1px),
                radial-gradient(circle at 90% 20%, rgba(255, 255, 255, 0.1) 2px, transparent 2px),
                radial-gradient(circle at 10% 90%, rgba(255, 255, 255, 0.08) 2px, transparent 2px);
            background-size: 100px 100px, 150px 150px, 80px 80px, 120px 120px, 90px 90px;
            animation: float 20s ease-in-out infinite;
            pointer-events: none;
        }

        .header::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                linear-gradient(45deg, transparent 40%, rgba(255, 255, 255, 0.03) 50%, transparent 60%),
                linear-gradient(-45deg, transparent 40%, rgba(255, 255, 255, 0.03) 50%, transparent 60%);
            background-size: 60px 60px, 80px 80px;
            animation: wave 15s linear infinite;
            pointer-events: none;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px) rotate(0deg);
            }

            50% {
                transform: translateY(-10px) rotate(180deg);
            }
        }

        @keyframes wave {
            0% {
                background-position: 0 0, 0 0;
            }

            100% {
                background-position: 60px 60px, -80px 80px;
            }
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }

        .main-content {
            padding: 40px 30px;
        }

        .tool-section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(135deg, #1e90ff 0%, #0066ff 100%);
            border-radius: 2px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            font-weight: 500;
            color: #555;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .input-field {
            width: 100%;
            min-height: 120px;
            padding: 15px;
            border: 2px solid #e1e8ed;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Consolas', 'Monaco', monospace;
            resize: vertical;
            transition: all 0.3s ease;
            background: #fafbfc;
        }

        .input-field:focus {
            outline: none;
            border-color: #1e90ff;
            background: white;
            box-shadow: 0 0 0 3px rgba(30, 144, 255, 0.1);
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 120px;
            justify-content: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1e90ff 0%, #0066ff 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(30, 144, 255, 0.3);
        }

        .btn-secondary {
            background: #f7fafc;
            color: #4a5568;
            border: 2px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background: #edf2f7;
            border-color: #cbd5e0;
        }

        .examples {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
        }

        .examples h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .example-item {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #4facfe;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .example-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .example-label {
            font-weight: 500;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .example-text {
            font-family: 'Consolas', 'Monaco', monospace;
            color: #666;
            font-size: 0.9rem;
            word-break: break-all;
        }

        .result-info {
            background: #e8f5e8;
            border: 1px solid #c3e6c3;
            border-radius: 8px;
            padding: 10px 15px;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #2d5a2d;
        }

        .error-info {
            background: #ffeaea;
            border: 1px solid #ffcdd2;
            border-radius: 8px;
            padding: 10px 15px;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #c62828;
        }

        .footer {
            margin-top: 50px;
            padding: 20px 0;
            text-align: center;
            font-size: 14px;
            color: #333;
            /* 深灰接近黑色，更清晰 */
        }

        .footer a {
            color: #0066cc;
            /* 更深的蓝色，对比度更高 */
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* 深色背景自动适配 */
        @media (prefers-color-scheme: dark) {
            .footer {
                color: #f0f0f0;
                /* 接近白色，更清晰 */
            }

            .footer a {
                color: #4da6ff;
                /* 亮蓝色，在深色背景下更清晰 */
            }
        }

        /* 如果页面背景是深色，手动添加这个类 */
        .dark-theme .footer {
            color: #f0f0f0;
        }

        .dark-theme .footer a {
            color: #4da6ff;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 1.8rem;
            }

            .main-content {
                padding: 20px 15px;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .examples {
                padding: 15px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.5rem;
            }

            .section-title {
                font-size: 1.2rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🔗 URL编码/解码工具</h1>
            <p>快速、安全的URL编码解码处理工具</p>
        </div>

        <div class="main-content">
            <div class="tool-section">
                <h2 class="section-title">URL编码/解码</h2>

                <div class="input-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <label class="input-label" style="margin-bottom: 0;">输入文本</label>
                        <div style="display: flex; gap: 8px;">
                            <button onclick="useExample('https://www.example.com/search?q=你好世界&type=1')" 
                                    style="background: none; border: none; color: #1e90ff; font-size: 0.85rem; cursor: pointer; padding: 4px 8px; border-radius: 4px; transition: background 0.2s;"
                                    onmouseover="this.style.background='#f0f8ff'" 
                                    onmouseout="this.style.background='none'">
                                📝 编码示例
                            </button>
                            <button onclick="useExample('https%3A//www.example.com/search%3Fq%3D%E4%BD%A0%E5%A5%BD%E4%B8%96%E7%95%8C')" 
                                    style="background: none; border: none; color: #1e90ff; font-size: 0.85rem; cursor: pointer; padding: 4px 8px; border-radius: 4px; transition: background 0.2s;"
                                    onmouseover="this.style.background='#f0f8ff'" 
                                    onmouseout="this.style.background='none'">
                                📝 解码示例
                            </button>
                        </div>
                    </div>
                    <textarea id="inputText" class="input-field" placeholder="请输入需要编码或解码的URL文本...&#10;&#10;💡 点击右上角的示例按钮快速填入测试数据"></textarea>
                </div>

                <div class="button-group">
                    <button class="btn btn-primary" onclick="encodeURL()">
                        🔒 URL编码
                    </button>
                    <button class="btn btn-primary" onclick="decodeURL()">
                        🔓 URL解码
                    </button>
                    <button class="btn btn-secondary" onclick="clearAll()">
                        🗑️ 清空
                    </button>
                    <button class="btn btn-secondary" onclick="copyResult()">
                        📋 复制结果
                    </button>
                </div>

                <div class="input-group">
                    <label class="input-label">处理结果</label>
                    <textarea id="outputText" class="input-field" placeholder="处理结果将显示在这里..." readonly></textarea>
                </div>

                <div id="resultInfo"></div>
            </div>


        </div>
    </div>

    <script>
        function encodeURL() {
            const input = document.getElementById('inputText').value;
            const output = document.getElementById('outputText');
            const resultInfo = document.getElementById('resultInfo');

            if (!input.trim()) {
                showError('请输入需要编码的文本');
                return;
            }

            try {
                const encoded = encodeURIComponent(input);
                output.value = encoded;
                showSuccess(`编码完成，原长度: ${input.length}，编码后长度: ${encoded.length}`);
            } catch (error) {
                showError('编码失败: ' + error.message);
            }
        }

        function decodeURL() {
            const input = document.getElementById('inputText').value;
            const output = document.getElementById('outputText');
            const resultInfo = document.getElementById('resultInfo');

            if (!input.trim()) {
                showError('请输入需要解码的文本');
                return;
            }

            try {
                const decoded = decodeURIComponent(input);
                output.value = decoded;
                showSuccess(`解码完成，原长度: ${input.length}，解码后长度: ${decoded.length}`);
            } catch (error) {
                showError('解码失败，请检查输入格式是否正确');
            }
        }

        function clearAll() {
            document.getElementById('inputText').value = '';
            document.getElementById('outputText').value = '';
            document.getElementById('resultInfo').innerHTML = '';
        }

        function copyResult() {
            const output = document.getElementById('outputText');
            if (!output.value.trim()) {
                showError('没有可复制的结果');
                return;
            }

            output.select();
            document.execCommand('copy');
            showSuccess('结果已复制到剪贴板');
        }

        function useExample(text) {
            document.getElementById('inputText').value = text;
            document.getElementById('outputText').value = '';
            document.getElementById('resultInfo').innerHTML = '';
        }

        function showSuccess(message) {
            const resultInfo = document.getElementById('resultInfo');
            resultInfo.innerHTML = `<div class="result-info">✅ ${message}</div>`;
        }

        function showError(message) {
            const resultInfo = document.getElementById('resultInfo');
            resultInfo.innerHTML = `<div class="error-info">❌ ${message}</div>`;
        }

        // 键盘快捷键
        document.addEventListener('keydown', function (e) {
            if (e.ctrlKey || e.metaKey) {
                switch (e.key) {
                    case 'Enter':
                        e.preventDefault();
                        encodeURL();
                        break;
                    case 'Backspace':
                        if (e.shiftKey) {
                            e.preventDefault();
                            decodeURL();
                        }
                        break;
                }
            }
        });

        // 自动调整文本框高度
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.max(120, textarea.scrollHeight) + 'px';
        }

        document.getElementById('inputText').addEventListener('input', function () {
            autoResize(this);
        });

        document.getElementById('outputText').addEventListener('input', function () {
            autoResize(this);
        });
    </script>

    <footer class="footer">
        <p>© 2025 URL编码解码工具 | <a href="https://t.zsxq.com/MlnIL" target="_blank">联系作者</a></p>
    </footer>
</body>

</html>
