        // 初始化页面
        function init() {
            renderLipsticks();
            updatePagination();
        }

        // 渲染口红
        function renderLipsticks() {
            const container = document.getElementById('lipstickContainer');
            container.innerHTML = '';
            
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const currentItems = lipstickData.slice(startIndex, endIndex);
            
            currentItems.forEach(item => {
                const lipstickItem = document.createElement('div');
                lipstickItem.className = 'lipstick-item';
                
                lipstickItem.innerHTML = `
                    <div class="color-sample" style="background-color: ${item.color};"></div>
                    <div class="lipstick-name">${item.name}</div>
                    <div class="lipstick-brand">${item.brand}</div>
                    <div class="lipstick-skin">${item.skin}</div>
                `;
                
                container.appendChild(lipstickItem);
            });
        }

        // 更新分页按钮状态
        function updatePagination() {
            const buttons = document.querySelectorAll('.pagination button');
            buttons.forEach((button, index) => {
                if (index + 1 === currentPage) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        // 切换页面
        function changePage(page) {
            currentPage = page;
            renderLipsticks();
            updatePagination();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 打开弹窗
        function openModal() {
            document.getElementById('myModal').style.display = 'block';

            document.getElementById('myModal').style.display = 'none';

        function copyLink() {
            const link = document.getElementById('linkToCopy').textContent;
            const textarea = document.createElement('textarea');
            textarea.value = link;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    alert('链接已复制到剪贴板');
                } else {
                    alert('复制失败，请手动复制链接');
                }
            } catch (err) {
                alert('复制失败，请手动复制链接');
                console.error('复制失败:', err);
            }
            document.body.removeChild(textarea);
            closeModal();
        }
