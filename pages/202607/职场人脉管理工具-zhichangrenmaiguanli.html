<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>职场人脉管理工具</title>
    <!-- 引入外部资源 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    
    <!-- 配置Tailwind自定义颜色 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#10b981',
                        accent: '#8b5cf6',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                    },
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .card-shadow {
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            }
            .contact-card-hover {
                @apply transition-all duration-300 hover:shadow-lg hover:-translate-y-1;
            }
            .fade-in {
                animation: fadeIn 0.3s ease-in-out;
            }
            @keyframes fadeIn {
                from { opacity: 0; }
                to { opacity: 1; }
            }
            .slide-in {
                animation: slideIn 0.4s ease-out;
            }
            @keyframes slideIn {
                from { transform: translateY(20px); opacity: 0; }
                to { transform: translateY(0); opacity: 1; }
            }
        }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800 min-h-screen flex flex-col">
    <div class="max-w-6xl w-full mx-auto px-4 py-8 flex-grow">
        <!-- 头部标题 -->
        <header class="text-center mb-8">
            <h1 class="text-[clamp(1.8rem,5vw,2.5rem)] font-bold text-gray-800 mb-3 flex items-center justify-center">
                <i class="fa fa-users text-primary mr-3"></i>职场人脉管理工具
            </h1>
            <p class="text-gray-600 max-w-2xl mx-auto">
                集中管理你的职场联系人，设置跟进提醒，再也不会遗漏重要人脉维护
            </p>
        </header>

        <main class="space-y-8">
            <!-- 功能标签页 -->
            <div class="bg-white rounded-xl shadow-sm card-shadow overflow-hidden">
                <div class="flex flex-wrap border-b">
                    <button class="tab-btn active flex-1 md:flex-none md:w-1/3 py-4 px-6 text-center font-medium" data-tab="contacts">
                        <i class="fa fa-address-book mr-2"></i>联系人
                    </button>
                    <button class="tab-btn flex-1 md:flex-none md:w-1/3 py-4 px-6 text-center font-medium" data-tab="reminders">
                        <i class="fa fa-bell mr-2"></i>跟进提醒
                    </button>
                    <button class="tab-btn flex-1 md:flex-none md:w-1/3 py-4 px-6 text-center font-medium" data-tab="add-contact">
                        <i class="fa fa-plus-circle mr-2"></i>添加联系人
                    </button>
                </div>
                
                <!-- 联系人列表标签页 -->
                <div class="tab-content active p-6" id="contacts-tab">
                    <!-- 搜索和筛选 -->
                    <div class="flex flex-col md:flex-row gap-4 mb-6">
                        <div class="relative flex-grow">
                            <input type="text" id="searchContacts" placeholder="搜索联系人..." 
                                class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all outline-none">
                            <i class="fa fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        </div>
                        
                        <div class="flex flex-wrap gap-2">
                            <select id="filterIndustry" class="px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all outline-none">
                                <option value="">所有行业</option>
                                <option value="互联网">互联网</option>
                                <option value="金融">金融</option>
                                <option value="教育">教育</option>
                                <option value="医疗">医疗</option>
                                <option value="制造业">制造业</option>
                                <option value="零售">零售</option>
                                <option value="咨询">咨询</option>
                                <option value="其他">其他</option>
                            </select>
                            
                            <button id="viewToggle" class="px-4 py-3 border border-gray-300 rounded-lg bg-white hover:bg-gray-50 transition-colors">
                                <i class="fa fa-th-large mr-1"></i>
                                <span class="hidden sm:inline">视图</span>
                            </button>
                        </div>
                    </div>
                    
                    <!-- 联系人统计 -->
                    <div class="flex flex-wrap gap-4 mb-6">
                        <div class="bg-gray-50 p-3 rounded-lg flex items-center">
                            <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center mr-3">
                                <i class="fa fa-user text-primary"></i>
                            </div>
                            <div>
                                <p class="text-sm text-gray-500">总联系人</p>
                                <p class="font-bold" id="totalContacts">0</p>
                            </div>
                        </div>
                        
                        <div class="bg-gray-50 p-3 rounded-lg flex items-center">
                            <div class="w-10 h-10 rounded-full bg-warning/10 flex items-center justify-center mr-3">
                                <i class="fa fa-bell text-warning"></i>
                            </div>
                            <div>
                                <p class="text-sm text-gray-500">待跟进</p>
                                <p class="font-bold text-warning" id="pendingReminders">0</p>
                            </div>
                        </div>
                        
                        <div class="bg-gray-50 p-3 rounded-lg flex items-center">
                            <div class="w-10 h-10 rounded-full bg-secondary/10 flex items-center justify-center mr-3">
                                <i class="fa fa-building text-secondary"></i>
                            </div>
                            <div>
                                <p class="text-sm text-gray-500">覆盖行业</p>
                                <p class="font-bold" id="coveredIndustries">0</p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 联系人列表/网格 -->
                    <div id="contactsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        <!-- 联系人卡片将通过JS动态生成 -->
                        <div class="col-span-full text-center py-12 text-gray-500 slide-in">
                            <i class="fa fa-address-book-o text-5xl mb-4 opacity-30"></i>
                            <p>还没有添加联系人</p>
                            <button class="mt-4 text-primary hover:text-primary/80 tab-btn inline-flex items-center" data-tab="add-contact">
                                <i class="fa fa-plus-circle mr-1"></i> 添加第一个联系人
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- 跟进提醒标签页 -->
                <div class="tab-content p-6 hidden" id="reminders-tab">
                    <div class="mb-6">
                        <h3 class="text-lg font-bold mb-4">近期跟进提醒</h3>
                        
                        <div class="flex items-center justify-between mb-4">
                            <button id="todayReminders" class="reminder-filter-btn px-4 py-2 bg-primary text-white rounded-lg">今天</button>
                            <button id="weekReminders" class="reminder-filter-btn px-4 py-2 bg-gray-100 text-gray-700 rounded-lg">本周</button>
                            <button id="monthReminders" class="reminder-filter-btn px-4 py-2 bg-gray-100 text-gray-700 rounded-lg">本月</button>
                            <button id="allReminders" class="reminder-filter-btn px-4 py-2 bg-gray-100 text-gray-700 rounded-lg">全部</button>
                        </div>
                    </div>
                    
                    <div id="remindersContainer" class="space-y-4">
                        <!-- 提醒项目将通过JS动态生成 -->
                        <div class="text-center py-12 text-gray-500 slide-in">
                            <i class="fa fa-bell-o text-5xl mb-4 opacity-30"></i>
                            <p>暂无跟进提醒</p>
                            <p class="text-sm mt-2">为联系人设置跟进提醒，不错过任何重要沟通</p>
                        </div>
                    </div>
                </div>
                
                <!-- 添加联系人标签页 -->
                <div class="tab-content p-6 hidden" id="add-contact-tab">
                    <h3 class="text-lg font-bold mb-6">添加新联系人</h3>
                    
                    <form id="addContactForm" class="space-y-6">
                        <input type="hidden" id="contactId">
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label for="contactName" class="block text-gray-700 font-medium mb-2">姓名 <span class="text-danger">*</span></label>
                                <input type="text" id="contactName" required
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all outline-none">
                            </div>
                            
                            <div>
                                <label for="contactCompany" class="block text-gray-700 font-medium mb-2">公司 <span class="text-danger">*</span></label>
                                <input type="text" id="contactCompany" required
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all outline-none">
                            </div>
                            
                            <div>
                                <label for="contactPosition" class="block text-gray-700 font-medium mb-2">职位</label>
                                <input type="text" id="contactPosition"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all outline-none">
                            </div>
                            
                            <div>
                                <label for="contactIndustry" class="block text-gray-700 font-medium mb-2">行业 <span class="text-danger">*</span></label>
                                <select id="contactIndustry" required
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all outline-none">
                                    <option value="">请选择行业</option>
                                    <option value="互联网">互联网</option>
                                    <option value="金融">金融</option>
                                    <option value="教育">教育</option>
                                    <option value="医疗">医疗</option>
                                    <option value="制造业">制造业</option>
                                    <option value="零售">零售</option>
                                    <option value="咨询">咨询</option>
                                    <option value="其他">其他</option>
                                </select>
                            </div>
                            
                            <div>
                                <label for="contactPhone" class="block text-gray-700 font-medium mb-2">电话</label>
                                <input type="tel" id="contactPhone"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all outline-none">
                            </div>
                            
                            <div>
                                <label for="contactEmail" class="block text-gray-700 font-medium mb-2">邮箱</label>
                                <input type="email" id="contactEmail"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all outline-none">
                            </div>
                        </div>
                        
                        <div>
                            <label for="contactNotes" class="block text-gray-700 font-medium mb-2">备注/上次沟通内容</label>
                            <textarea id="contactNotes" rows="3"
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all outline-none"
                                placeholder="记录与该联系人的沟通内容、合作情况等..."></textarea>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label for="nextFollowUp" class="block text-gray-700 font-medium mb-2">下次跟进时间</label>
                                <input type="date" id="nextFollowUp"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all outline-none">
                            </div>
                            
                            <div>
                                <label for="followUpNotes" class="block text-gray-700 font-medium mb-2">跟进提醒内容</label>
                                <input type="text" id="followUpNotes"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all outline-none"
                                    placeholder="例如：约咖啡聊聊合作事宜">
                            </div>
                        </div>
                        
                        <div class="flex justify-end gap-4 pt-4 border-t">
                            <button type="button" id="cancelAddContact" class="px-6 py-3 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors">
                                取消
                            </button>
                            <button type="submit" class="px-6 py-3 bg-primary text-white rounded-lg shadow hover:bg-primary/90 transition-colors">
                                <i class="fa fa-save mr-2"></i>保存联系人
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    
    <!-- 联系人详情模态框 -->
    <div id="contactDetailModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto fade-in">
            <div class="p-6 border-b">
                <div class="flex justify-between items-center">
                    <h3 class="text-xl font-bold" id="modalTitle">联系人详情</h3>
                    <button id="closeModal" class="text-gray-500 hover:text-gray-700">
                        <i class="fa fa-times text-xl"></i>
                    </button>
                </div>
            </div>
            
            <div class="p-6" id="modalContent">
                <!-- 联系人详情将通过JS动态生成 -->
            </div>
            
            <div class="p-6 border-t flex justify-end gap-4">
                <button id="editContactBtn" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors">
                    <i class="fa fa-edit mr-1"></i> 编辑
                </button>
                <button id="deleteContactBtn" class="px-4 py-2 border border-red-200 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition-colors">
                    <i class="fa fa-trash mr-1"></i> 删除
                </button>
                <button id="setReminderBtn" class="px-4 py-2 bg-warning text-white rounded-lg hover:bg-warning/90 transition-colors">
                    <i class="fa fa-bell mr-1"></i> 设置跟进提醒
                </button>
            </div>
        </div>
    </div>
    
    <!-- 底部备注 -->
    <footer class="mt-10 py-4 border-t border-gray-200">
        <div class="max-w-6xl mx-auto px-4 text-center text-gray-600 text-sm">
            <p>
                邓文涛(AI版) | <a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="7a4d4a4d4f4e4d4e4e4b3a0b0b54191517">[email&#160;protected]</a> | VX：707547441 | 更多点击➡️
                <a href="https://dkfile.com/Dx25214" target="_blank" rel="noopener" class="text-primary hover:underline">🌌</a>
            </p>
        </div>
    </footer>
    
    <!-- 提示消息 -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs">
        <i id="toastIcon" class="fa fa-check-circle mr-2 text-green-500"></i>
        <span id="toastMessage"></span>
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        // DOM元素
        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabContents = document.querySelectorAll('.tab-content');
        const contactsContainer = document.getElementById('contactsContainer');
        const remindersContainer = document.getElementById('remindersContainer');
        const addContactForm = document.getElementById('addContactForm');
        const cancelAddContact = document.getElementById('cancelAddContact');
        const searchContacts = document.getElementById('searchContacts');
        const filterIndustry = document.getElementById('filterIndustry');
        const viewToggle = document.getElementById('viewToggle');
        
        const totalContactsEl = document.getElementById('totalContacts');
        const pendingRemindersEl = document.getElementById('pendingReminders');
        const coveredIndustriesEl = document.getElementById('coveredIndustries');
        
        const contactDetailModal = document.getElementById('contactDetailModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalContent = document.getElementById('modalContent');
        const closeModal = document.getElementById('closeModal');
        const editContactBtn = document.getElementById('editContactBtn');
        const deleteContactBtn = document.getElementById('deleteContactBtn');
        const setReminderBtn = document.getElementById('setReminderBtn');
        
        const todayRemindersBtn = document.getElementById('todayReminders');
        const weekRemindersBtn = document.getElementById('weekReminders');
        const monthRemindersBtn = document.getElementById('monthReminders');
        const allRemindersBtn = document.getElementById('allReminders');
        
        const toast = document.getElementById('toast');
        const toastIcon = document.getElementById('toastIcon');
        const toastMessage = document.getElementById('toastMessage');
        
        // 状态变量
        let contacts = [];
        let currentView = 'grid'; // grid 或 list
        let currentContactId = null;
        let reminderFilter = 'today';
        
        // 初始化
        function init() {
            // 加载联系人数据
            loadContacts();
            
            // 设置事件监听器
            setupEventListeners();
            
            // 初始化界面
            renderContacts();
            updateStats();
            renderReminders();
        }
        
        // 设置事件监听器
        function setupEventListeners() {
            // 标签页切换
            tabBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const tabId = this.dataset.tab;
                    
                    // 更新按钮状态
                    tabBtns.forEach(b => b.classList.remove('active', 'text-primary', 'border-primary', 'border-b-2'));
                    this.classList.add('active', 'text-primary', 'border-primary', 'border-b-2');
                    
                    // 更新内容显示
                    tabContents.forEach(content => content.classList.add('hidden', 'active'));
                    document.getElementById(`${tabId}-tab`).classList.remove('hidden');
                    document.getElementById(`${tabId}-tab`).classList.add('active');
                });
            });
            
            // 表单提交
            addContactForm.addEventListener('submit', function(e) {
                e.preventDefault();
                saveContact();
            });
            
            // 取消添加联系人
            cancelAddContact.addEventListener('click', function() {
                resetContactForm();
                switchTab('contacts');
            });
            
            // 搜索联系人
            searchContacts.addEventListener('input', renderContacts);
            
            // 筛选行业
            filterIndustry.addEventListener('change', renderContacts);
            
            // 切换视图
            viewToggle.addEventListener('click', function() {
                currentView = currentView === 'grid' ? 'list' : 'grid';
                this.innerHTML = currentView === 'grid' ? 
                    '<i class="fa fa-th-large mr-1"></i><span class="hidden sm:inline">视图</span>' : 
                    '<i class="fa fa-list mr-1"></i><span class="hidden sm:inline">视图</span>';
                renderContacts();
            });
            
            // 关闭模态框
            closeModal.addEventListener('click', closeContactModal);
            
            // 点击模态框外部关闭
            contactDetailModal.addEventListener('click', function(e) {
                if (e.target === this) {
                    closeContactModal();
                }
            });
            
            // 编辑联系人
            editContactBtn.addEventListener('click', function() {
                if (currentContactId) {
                    const contact = contacts.find(c => c.id === currentContactId);
                    if (contact) {
                        populateContactForm(contact);
                        closeContactModal();
                        switchTab('add-contact');
                    }
                }
            });
            
            // 删除联系人
            deleteContactBtn.addEventListener('click', function() {
                if (currentContactId && confirm('确定要删除这个联系人吗？')) {
                    deleteContact(currentContactId);
                    closeContactModal();
                }
            });
            
            // 设置跟进提醒
            setReminderBtn.addEventListener('click', function() {
                if (currentContactId) {
                    const contact = contacts.find(c => c.id === currentContactId);
                    if (contact) {
                        populateContactForm(contact);
                        // 聚焦到下次跟进时间
                        document.getElementById('nextFollowUp').focus();
                        closeContactModal();
                        switchTab('add-contact');
                    }
                }
            });
            
            // 提醒筛选
            todayRemindersBtn.addEventListener('click', function() {
                setReminderFilter('today');
            });
            
            weekRemindersBtn.addEventListener('click', function() {
                setReminderFilter('week');
            });
            
            monthRemindersBtn.addEventListener('click', function() {
                setReminderFilter('month');
            });
            
            allRemindersBtn.addEventListener('click', function() {
                setReminderFilter('all');
            });
        }
        
        // 切换标签页
        function switchTab(tabId) {
            const tabBtn = document.querySelector(`.tab-btn[data-tab="${tabId}"]`);
            if (tabBtn) {
                tabBtn.click();
            }
        }
        
        // 设置提醒筛选
        function setReminderFilter(filter) {
            reminderFilter = filter;
            
            // 更新按钮状态
            [todayRemindersBtn, weekRemindersBtn, monthRemindersBtn, allRemindersBtn].forEach(btn => {
                btn.classList.remove('bg-primary', 'text-white');
                btn.classList.add('bg-gray-100', 'text-gray-700');
            });
            
            if (filter === 'today') {
                todayRemindersBtn.classList.remove('bg-gray-100', 'text-gray-700');
                todayRemindersBtn.classList.add('bg-primary', 'text-white');
            } else if (filter === 'week') {
                weekRemindersBtn.classList.remove('bg-gray-100', 'text-gray-700');
                weekRemindersBtn.classList.add('bg-primary', 'text-white');
            } else if (filter === 'month') {
                monthRemindersBtn.classList.remove('bg-gray-100', 'text-gray-700');
                monthRemindersBtn.classList.add('bg-primary', 'text-white');
            } else if (filter === 'all') {
                allRemindersBtn.classList.remove('bg-gray-100', 'text-gray-700');
                allRemindersBtn.classList.add('bg-primary', 'text-white');
            }
            
            renderReminders();
        }
        
        // 加载联系人数据
        function loadContacts() {
            const savedContacts = localStorage.getItem('careerContacts');
            if (savedContacts) {
                contacts = JSON.parse(savedContacts);
            } else {
                contacts = [];
            }
        }
        
        // 保存联系人数据
        function saveContacts() {
            localStorage.setItem('careerContacts', JSON.stringify(contacts));
            updateStats();
        }
        
        // 渲染联系人列表
        function renderContacts() {
            const searchTerm = searchContacts.value.toLowerCase();
            const industryFilter = filterIndustry.value;
            
            // 筛选联系人
            let filteredContacts = contacts.filter(contact => {
                const matchesSearch = 
                    contact.name.toLowerCase().includes(searchTerm) ||
                    contact.company.toLowerCase().includes(searchTerm) ||
                    contact.position.toLowerCase().includes(searchTerm) ||
                    (contact.notes && contact.notes.toLowerCase().includes(searchTerm));
                
                const matchesIndustry = !industryFilter || contact.industry === industryFilter;
                
                return matchesSearch && matchesIndustry;
            });
            
            // 清空容器
            contactsContainer.innerHTML = '';
            
            if (filteredContacts.length === 0) {
                contactsContainer.innerHTML = `
                    <div class="col-span-full text-center py-12 text-gray-500 slide-in">
                        <i class="fa fa-search text-5xl mb-4 opacity-30"></i>
                        <p>没有找到匹配的联系人</p>
                        <button class="mt-4 text-primary hover:text-primary/80 tab-btn inline-flex items-center" data-tab="add-contact">
                            <i class="fa fa-plus-circle mr-1"></i> 添加联系人
                        </button>
                    </div>
                `;
                return;
            }
            
            // 根据当前视图渲染
            if (currentView === 'grid') {
                filteredContacts.forEach(contact => {
                    const contactCard = createContactGridCard(contact);
                    contactsContainer.appendChild(contactCard);
                });
            } else {
                // 列表视图
                const listContainer = document.createElement('div');
                listContainer.className = 'w-full';
                
                filteredContacts.forEach(contact => {
                    const contactRow = createContactListRow(contact);
                    listContainer.appendChild(contactRow);
                });
                
                contactsContainer.appendChild(listContainer);
            }
            
            // 添加动画效果
            setTimeout(() => {
                document.querySelectorAll('#contactsContainer > div').forEach(el => {
                    el.classList.add('slide-in');
                });
            }, 50);
        }
        
        // 创建联系人网格卡片
        function createContactGridCard(contact) {
            const card = document.createElement('div');
            card.className = 'bg-white rounded-xl p-5 border contact-card-hover cursor-pointer';
            card.dataset.id = contact.id;
            
            // 检查是否有即将到来的跟进提醒
            const hasUpcomingReminder = contact.nextFollowUp && new Date(contact.nextFollowUp) >= new Date() && 
                                      new Date(contact.nextFollowUp) <= new Date(Date.now() + 7 * 24 * 60 * 60 * 1000);
            
            card.innerHTML = `
                <div class="flex justify-between items-start mb-3">
                    <h3 class="font-bold text-lg">${contact.name}</h3>
                    ${hasUpcomingReminder ? 
                        '<span class="bg-warning/10 text-warning text-xs px-2 py-1 rounded-full">待跟进</span>' : ''}
                </div>
                <p class="text-gray-600 mb-1">${contact.company}</p>
                <p class="text-gray-500 text-sm mb-3">${contact.position || '未填写职位'}</p>
                <div class="flex flex-wrap gap-2 mb-3">
                    <span class="bg-gray-100 text-gray-600 text-xs px-2 py-1 rounded-full">${contact.industry}</span>
                    ${contact.nextFollowUp ? 
                        `<span class="bg-primary/10 text-primary text-xs px-2 py-1 rounded-full">
                            下次跟进: ${formatDate(contact.nextFollowUp)}
                        </span>` : ''}
                </div>
                ${contact.notes ? 
                    `<p class="text-gray-600 text-sm line-clamp-2 mb-3">${contact.notes}</p>` : ''}
                <div class="text-sm text-gray-400">
                    <span>添加于 ${formatDate(contact.createdAt)}</span>
                </div>
            `;
            
            // 点击查看详情
            card.addEventListener('click', () => {
                openContactDetail(contact.id);
            });
            
            return card;
        }
        
        // 创建联系人列表行
        function createContactListRow(contact) {
            const row = document.createElement('div');
            row.className = 'bg-white rounded-xl p-4 border contact-card-hover cursor-pointer flex flex-col md:flex-row md:items-center justify-between';
            row.dataset.id = contact.id;
            
            // 检查是否有即将到来的跟进提醒
            const hasUpcomingReminder = contact.nextFollowUp && new Date(contact.nextFollowUp) >= new Date() && 
                                      new Date(contact.nextFollowUp) <= new Date(Date.now() + 7 * 24 * 60 * 60 * 1000);
            
            row.innerHTML = `
                <div class="flex-1">
                    <div class="flex items-center mb-2">
                        <h3 class="font-bold mr-2">${contact.name}</h3>
                        ${hasUpcomingReminder ? 
                            '<span class="bg-warning/10 text-warning text-xs px-2 py-0.5 rounded-full">待跟进</span>' : ''}
                    </div>
                    <p class="text-gray-600 text-sm">${contact.company} · ${contact.position || '未填写职位'} · ${contact.industry}</p>
                </div>
                <div class="mt-3 md:mt-0 text-right">
                    ${contact.nextFollowUp ? 
                        `<p class="text-sm text-primary">下次跟进: ${formatDate(contact.nextFollowUp)}</p>` : 
                        '<p class="text-sm text-gray-400">暂无跟进计划</p>'}
                </div>
            `;
            
            // 点击查看详情
            row.addEventListener('click', () => {
                openContactDetail(contact.id);
            });
            
            return row;
        }
        
        // 渲染跟进提醒
        function renderReminders() {
            // 获取有跟进提醒的联系人
            let reminderContacts = contacts.filter(contact => 
                contact.nextFollowUp && contact.followUpNotes
            );
            
            // 根据筛选条件过滤
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            const endOfWeek = new Date();
            endOfWeek.setHours(23, 59, 59, 999);
            endOfWeek.setDate(today.getDate() + (7 - today.getDay()));
            
            const endOfMonth = new Date();
            endOfMonth.setHours(23, 59, 59, 999);
            endOfMonth.setDate(new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate());
            
            if (reminderFilter === 'today') {
                reminderContacts = reminderContacts.filter(contact => {
                    const followUpDate = new Date(contact.nextFollowUp);
                    followUpDate.setHours(0, 0, 0, 0);
                    return followUpDate.getTime() === today.getTime();
                });
            } else if (reminderFilter === 'week') {
                reminderContacts = reminderContacts.filter(contact => {
                    const followUpDate = new Date(contact.nextFollowUp);
                    return followUpDate >= today && followUpDate <= endOfWeek;
                });
            } else if (reminderFilter === 'month') {
                reminderContacts = reminderContacts.filter(contact => {
                    const followUpDate = new Date(contact.nextFollowUp);
                    return followUpDate >= today && followUpDate <= endOfMonth;
                });
            }
            
            // 按日期排序
            reminderContacts.sort((a, b) => {
                return new Date(a.nextFollowUp) - new Date(b.nextFollowUp);
            });
            
            // 清空容器
            remindersContainer.innerHTML = '';
            
            if (reminderContacts.length === 0) {
                remindersContainer.innerHTML = `
                    <div class="text-center py-12 text-gray-500 slide-in">
                        <i class="fa fa-bell-o text-5xl mb-4 opacity-30"></i>
                        <p>此时间段内暂无跟进提醒</p>
                        <p class="text-sm mt-2">为联系人设置跟进提醒，不错过任何重要沟通</p>
                    </div>
                `;
                return;
            }
            
            // 按日期分组显示
            const groupedByDate = {};
            reminderContacts.forEach(contact => {
                const dateStr = formatDate(contact.nextFollowUp);
                if (!groupedByDate[dateStr]) {
                    groupedByDate[dateStr] = [];
                }
                groupedByDate[dateStr].push(contact);
            });
            
            // 生成提醒列表
            Object.keys(groupedByDate).forEach(dateStr => {
                const dateGroup = document.createElement('div');
                dateGroup.className = 'mb-6';
                
                // 判断是否是今天
                const isToday = formatDate(new Date()) === dateStr;
                
                dateGroup.innerHTML = `
                    <h4 class="font-bold text-gray-700 mb-3 ${isToday ? 'text-warning' : ''}">
                        ${isToday ? '今天' : dateStr}
                    </h4>
                    <div class="space-y-3">
                        ${groupedByDate[dateStr].map(contact => `
                            <div class="bg-white p-4 rounded-lg border contact-card-hover cursor-pointer" data-id="${contact.id}">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <h5 class="font-medium">${contact.name}</h5>
                                        <p class="text-sm text-gray-600">${contact.company} · ${contact.position || '未填写职位'}</p>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-sm font-medium text-primary">${contact.followUpNotes}</p>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                
                remindersContainer.appendChild(dateGroup);
                
                // 添加点击事件
                groupedByDate[dateStr].forEach(contact => {
                    const contactEl = dateGroup.querySelector(`[data-id="${contact.id}"]`);
                    contactEl.addEventListener('click', () => {
                        openContactDetail(contact.id);
                    });
                });
            });
            
            // 添加动画效果
            setTimeout(() => {
                document.querySelectorAll('#remindersContainer > div').forEach((el, index) => {
                    el.classList.add('slide-in');
                    el.style.animationDelay = `${index * 100}ms`;
                });
            }, 50);
        }
        
        // 打开联系人详情
        function openContactDetail(id) {
            const contact = contacts.find(c => c.id === id);
            if (!contact) return;
            
            currentContactId = id;
            
            // 更新模态框内容
            modalTitle.textContent = `${contact.name} 的详情`;
            
            modalContent.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <h4 class="text-sm text-gray-500 mb-1">姓名</h4>
                        <p class="font-medium">${contact.name}</p>
                    </div>
                    
                    <div>
                        <h4 class="text-sm text-gray-500 mb-1">公司</h4>
                        <p class="font-medium">${contact.company}</p>
                    </div>
                    
                    <div>
                        <h4 class="text-sm text-gray-500 mb-1">职位</h4>
                        <p>${contact.position || '未填写'}</p>
                    </div>
                    
                    <div>
                        <h4 class="text-sm text-gray-500 mb-1">行业</h4>
                        <p>${contact.industry}</p>
                    </div>
                    
                    <div>
                        <h4 class="text-sm text-gray-500 mb-1">电话</h4>
                        <p>${contact.phone || '未填写'}</p>
                    </div>
                    
                    <div>
                        <h4 class="text-sm text-gray-500 mb-1">邮箱</h4>
                        <p>${contact.email || '未填写'}</p>
                    </div>
                </div>
                
                ${contact.notes ? `
                    <div class="mt-6">
                        <h4 class="text-sm text-gray-500 mb-2">备注/上次沟通内容</h4>
                        <div class="bg-gray-50 p-4 rounded-lg">
                            <p>${contact.notes}</p>
                        </div>
                    </div>
                ` : ''}
                
                ${contact.nextFollowUp ? `
                    <div class="mt-6">
                        <h4 class="text-sm text-gray-500 mb-2">下次跟进计划</h4>
                        <div class="bg-primary/5 p-4 rounded-lg border border-primary/10">
                            <p class="font-medium mb-1">${formatDate(contact.nextFollowUp)}</p>
                            <p>${contact.followUpNotes || '无具体内容'}</p>
                        </div>
                    </div>
                ` : ''}
                
                <div class="mt-6 text-sm text-gray-500">
                    <p>添加于 ${formatDate(contact.createdAt)}</p>
                    ${contact.updatedAt && contact.updatedAt !== contact.createdAt ? 
                        `<p>最后更新于 ${formatDate(contact.updatedAt)}</p>` : ''}
                </div>
            `;
            
            // 显示模态框
            contactDetailModal.classList.remove('hidden');
            contactDetailModal.classList.add('flex');
            
            // 阻止页面滚动
            document.body.style.overflow = 'hidden';
        }
        
        // 关闭联系人详情模态框
        function closeContactModal() {
            contactDetailModal.classList.add('hidden');
            contactDetailModal.classList.remove('flex');
            currentContactId = null;
            
            // 恢复页面滚动
            document.body.style.overflow = '';
        }
        
        // 填充联系人表单
        function populateContactForm(contact) {
            document.getElementById('contactId').value = contact.id;
            document.getElementById('contactName').value = contact.name || '';
            document.getElementById('contactCompany').value = contact.company || '';
            document.getElementById('contactPosition').value = contact.position || '';
            document.getElementById('contactIndustry').value = contact.industry || '';
            document.getElementById('contactPhone').value = contact.phone || '';
            document.getElementById('contactEmail').value = contact.email || '';
            document.getElementById('contactNotes').value = contact.notes || '';
            document.getElementById('nextFollowUp').value = contact.nextFollowUp || '';
            document.getElementById('followUpNotes').value = contact.followUpNotes || '';
        }
        
        // 重置联系人表单
        function resetContactForm() {
            addContactForm.reset();
            document.getElementById('contactId').value = '';
        }
        
        // 保存联系人
        function saveContact() {
            const id = document.getElementById('contactId').value || generateId();
            const name = document.getElementById('contactName').value.trim();
            const company = document.getElementById('contactCompany').value.trim();
            const position = document.getElementById('contactPosition').value.trim();
            const industry = document.getElementById('contactIndustry').value;
            const phone = document.getElementById('contactPhone').value.trim();
            const email = document.getElementById('contactEmail').value.trim();
            const notes = document.getElementById('contactNotes').value.trim();
            const nextFollowUp = document.getElementById('nextFollowUp').value;
            const followUpNotes = document.getElementById('followUpNotes').value.trim();
            
            // 基本验证
            if (!name || !company || !industry) {
                showToast('请填写必填字段（姓名、公司、行业）', 'error');
                return;
            }
            
            const now = new Date().toISOString();
            
            // 检查是否是更新现有联系人
            const existingIndex = contacts.findIndex(c => c.id === id);
            
            if (existingIndex >= 0) {
                // 更新现有联系人
                contacts[existingIndex] = {
                    ...contacts[existingIndex],
                    name,
                    company,
                    position,
                    industry,
                    phone,
                    email,
                    notes,
                    nextFollowUp: nextFollowUp || contacts[existingIndex].nextFollowUp,
                    followUpNotes: followUpNotes || contacts[existingIndex].followUpNotes,
                    updatedAt: now
                };
                showToast('联系人已更新');
            } else {
                // 添加新联系人
                contacts.push({
                    id,
                    name,
                    company,
                    position,
                    industry,
                    phone,
                    email,
                    notes,
                    nextFollowUp,
                    followUpNotes,
                    createdAt: now,
                    updatedAt: now
                });
                showToast('联系人已添加');
            }
            
            // 保存数据
            saveContacts();
            
            // 更新界面
            renderContacts();
            renderReminders();
            
            // 重置表单并返回联系人列表
            resetContactForm();
            switchTab('contacts');
        }
        
        // 删除联系人
        function deleteContact(id) {
            contacts = contacts.filter(contact => contact.id !== id);
            saveContacts();
            renderContacts();
            renderReminders();
            showToast('联系人已删除');
        }
        
        // 更新统计数据
        function updateStats() {
            // 总联系人数量
            totalContactsEl.textContent = contacts.length;
            
            // 待跟进数量
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            const pendingCount = contacts.filter(contact => 
                contact.nextFollowUp && new Date(contact.nextFollowUp) >= today
            ).length;
            
            pendingRemindersEl.textContent = pendingCount;
            
            // 覆盖行业数量
            const industries = new Set();
            contacts.forEach(contact => {
                if (contact.industry) {
                    industries.add(contact.industry);
                }
            });
            coveredIndustriesEl.textContent = industries.size;
        }
        
        // 生成唯一ID
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
        }
        
        // 格式化日期
        function formatDate(dateString) {
            if (!dateString) return '';
            
            const date = new Date(dateString);
            return `${date.getFullYear()}-${(date.getMonth() + 1).toString().padStart(2, '0')}-${date.getDate().toString().padStart(2, '0')}`;
        }
        
        // 显示提示消息
        function showToast(message, type = 'success') {
            toastMessage.textContent = message;
            
            if (type === 'success') {
                toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs bg-green-50 text-green-800';
                toastIcon.className = 'fa fa-check-circle mr-2 text-green-500';
            } else if (type === 'error') {
                toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs bg-red-50 text-red-800';
                toastIcon.className = 'fa fa-exclamation-circle mr-2 text-red-500';
            } else if (type === 'info') {
                toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs bg-blue-50 text-blue-800';
                toastIcon.className = 'fa fa-info-circle mr-2 text-blue-500';
            }
            
            // 3秒后隐藏
            setTimeout(() => {
                toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-300 flex items-center px-4 py-2.5 rounded-lg shadow-lg z-50 max-w-xs';
            }, 3000);
        }
        
        // 初始化应用
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
