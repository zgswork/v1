<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>九宫格图片编辑器</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 15px;
            margin: 30px 0;
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
        }
        
        .grid-container:hover {
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
        }
        .grid-item {
            position: relative;
            width: 100%;
            height: 0;
            padding-bottom: 100%;
            background-color: #f0f0f0;
            overflow: hidden;
            border: 2px dashed #ccc;
            transition: all 0.3s ease;
            border-radius: 6px;
        }
        
        .grid-item:hover {
            border-color: #4CAF50;
            background-color: #e8f5e9;
        }
        
        .grid-item.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-size: 14px;
            background-image: repeating-linear-gradient(-45deg, 
                transparent, 
                transparent 10px,
                rgba(255,255,255,0.3) 10px,
                rgba(255,255,255,0.3) 20px);
        }
        .grid-item img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
            margin: 8px 0;
            letter-spacing: 0.5px;
        }
        button:hover {
            background-color: #3d8b40;
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .position-controls {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            align-items: center;
        }
        
        .instructions {
            background-color: white;
            padding: 25px 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            border-left: 4px solid #4CAF50;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            position: relative;
            overflow: hidden;
        }
        
        .instructions::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, #4CAF50, #45a049);
        }
        
        .instructions h3 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 18px;
        }
        
        .instructions ol {
            padding-left: 20px;
        }
        
        .instructions li {
            margin-bottom: 8px;
        }
        select {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <h1>九宫格图片编辑器</h1>
        <div class="instructions">
            <h3>使用说明：</h3>
            <ol>
                <li>点击"上传全部图片"可一次性上传最多9张图片</li>
                <li>选择位置后点击"上传/替换图片"可单独修改某个位置的图片</li>
                <li>选择位置后点击"删除图片"可移除该位置的图片</li>
                <li>完成编辑后点击"下载九宫格图片"保存最终效果</li>
                <li>支持JPG、PNG、GIF、WEBP等多种图片格式</li>
            </ol>
        </div>
    
    <div class="controls">
        <button id="uploadAll">上传全部图片</button>
        <div class="position-controls">
            <select id="positionSelect">
                <option value="1">位置1</option>
                <option value="2">位置2</option>
                <option value="3">位置3</option>
                <option value="4">位置4</option>
                <option value="5">位置5</option>
                <option value="6">位置6</option>
                <option value="7">位置7</option>
                <option value="8">位置8</option>
                <option value="9">位置9</option>
            </select>
            <button id="uploadSingle">上传/替换图片</button>
            <button id="removeImage">删除图片</button>
        </div>
    </div>
    
    <div class="grid-container" id="gridContainer">
        <div class="grid-item" data-position="1"></div>
        <div class="grid-item" data-position="2"></div>
        <div class="grid-item" data-position="3"></div>
        <div class="grid-item" data-position="4"></div>
        <div class="grid-item" data-position="5"></div>
        <div class="grid-item" data-position="6"></div>
        <div class="grid-item" data-position="7"></div>
        <div class="grid-item" data-position="8"></div>
        <div class="grid-item" data-position="9"></div>
    </div>
    
    <button id="downloadBtn">下载九宫格图片</button>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const gridContainer = document.getElementById('gridContainer');
            const uploadAllBtn = document.getElementById('uploadAll');
            const uploadSingleBtn = document.getElementById('uploadSingle');
            const removeImageBtn = document.getElementById('removeImage');
            const positionSelect = document.getElementById('positionSelect');
            const downloadBtn = document.getElementById('downloadBtn');
            
            // 上传全部图片
            uploadAllBtn.addEventListener('click', function() {
                const input = document.createElement('input');
                input.type = 'file';
                input.multiple = true;
                input.accept = 'image/jpeg,image/png,image/gif,image/webp';
                input.onchange = function(e) {
                    const files = e.target.files;
                    if (files.length > 9) {
                        alert('最多只能上传9张图片');
                        return;
                    }
                    
                    Array.from(gridContainer.children).forEach((item, index) => {
                        if (index < files.length) {
                            const img = document.createElement('img');
                            img.src = URL.createObjectURL(files[index]);
                            item.innerHTML = '';
                            item.appendChild(img);
                        }
                    });
                };
                input.click();
            });
            
            // 上传/替换单张图片
            uploadSingleBtn.addEventListener('click', function() {
                const position = positionSelect.value;
                const gridItem = document.querySelector(`.grid-item[data-position="${position}"]`);
                
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.onchange = function(e) {
                    const file = e.target.files[0];
                    if (file) {
                        const img = document.createElement('img');
                        img.src = URL.createObjectURL(file);
                        gridItem.innerHTML = '';
                        gridItem.appendChild(img);
                    }
                };
                input.click();
            });
            
            // 删除图片
            removeImageBtn.addEventListener('click', function() {
                const position = positionSelect.value;
                const gridItem = document.querySelector(`.grid-item[data-position="${position}"]`);
                gridItem.innerHTML = '';
            });
            
            // 下载九宫格图片
            downloadBtn.addEventListener('click', function() {
                // 创建Canvas
                const canvas = document.createElement('canvas');
                const size = 900; // 最终图片尺寸
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                
                // 绘制背景
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, size, size);
                
                // 绘制九宫格图片
                const gridItems = document.querySelectorAll('.grid-item');
                const cellSize = size / 3;
                
                gridItems.forEach((item, index) => {
                    const img = item.querySelector('img');
                    if (img) {
                        const row = Math.floor(index / 3);
                        const col = index % 3;
                        ctx.drawImage(img, col * cellSize, row * cellSize, cellSize, cellSize);
                    }
                });
                
                // 生成下载链接
                const link = document.createElement('a');
                link.download = '九宫格图片.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        });
    </script>
</body>
</html>
