<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会议纪要自动排版工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- Handlebars模板引擎 -->
    <script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.7/dist/handlebars.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5', // 主色调：深紫色，代表专业和信任
                        secondary: '#10b981', // 辅助色：绿色，用于强调和按钮
                        neutral: '#f8fafc',
                    },
                    fontFamily: {
                        inter: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    boxShadow: {
                        'card': '0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.03)',
                        'hover': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)',
                    }
                },
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .section-divider {
                @apply border-t border-gray-200 my-6 pt-6;
            }
            .input-focus {
                @apply focus:ring-2 focus:ring-primary/50 focus:border-primary focus:outline-none;
            }
            .card-transition {
                @apply transition-all duration-300 ease-in-out;
            }
        }
    </style>
</head>
<body class="font-inter bg-gradient-to-br from-neutral to-indigo-50 min-h-screen text-gray-800">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- 页面头部 -->
        <header class="text-center mb-10">
            <div class="inline-block p-4 bg-primary/10 rounded-full mb-6">
                <i class="fa fa-file-text-o text-3xl text-primary"></i>
            </div>
            <h1 class="text-[clamp(1.8rem,5vw,2.5rem)] font-bold text-gray-800 mb-3">会议纪要自动排版工具</h1>
            <p class="text-gray-600 max-w-2xl mx-auto">
                快速整理会议内容，自动按规范结构排版，一键导出专业会议纪要
            </p>
        </header>
        
        <!-- 主内容区 -->
        <main class="space-y-8">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <!-- 输入区域 -->
                <section class="lg:col-span-7 space-y-8">
                    <!-- 会议基本信息 -->
                    <div class="bg-white rounded-2xl shadow-card p-6 md:p-8 card-transition hover:shadow-hover">
                        <h2 class="text-xl font-semibold mb-6 flex items-center">
                            <i class="fa fa-info-circle text-primary mr-2"></i> 会议基本信息
                        </h2>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div>
                                <label for="meetingTitle" class="block text-sm font-medium text-gray-700 mb-1">会议标题 <span class="text-red-500">*</span></label>
                                <input type="text" id="meetingTitle" placeholder="例如：产品迭代规划会议" required
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus card-transition">
                            </div>
                            
                            <div>
                                <label for="meetingDate" class="block text-sm font-medium text-gray-700 mb-1">会议日期 <span class="text-red-500">*</span></label>
                                <input type="date" id="meetingDate" required
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus card-transition">
                            </div>
                            
                            <div>
                                <label for="meetingTime" class="block text-sm font-medium text-gray-700 mb-1">会议时间</label>
                                <input type="time" id="meetingTime"
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus card-transition">
                            </div>
                            
                            <div>
                                <label for="meetingLocation" class="block text-sm font-medium text-gray-700 mb-1">会议地点</label>
                                <input type="text" id="meetingLocation" placeholder="例如：线上Zoom会议 / 301会议室"
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus card-transition">
                            </div>
                            
                            <div class="md:col-span-2">
                                <label for="meetingAttendees" class="block text-sm font-medium text-gray-700 mb-1">参会人员 <span class="text-red-500">*</span></label>
                                <input type="text" id="meetingAttendees" placeholder="请用逗号分隔，例如：张三，李四，王五" required
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus card-transition">
                            </div>
                            
                            <div class="md:col-span-2">
                                <label for="meetingRecorder" class="block text-sm font-medium text-gray-700 mb-1">记录人</label>
                                <input type="text" id="meetingRecorder" placeholder="记录人姓名"
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus card-transition">
                            </div>
                        </div>
                    </div>
                    
                    <!-- 议题内容 -->
                    <div class="bg-white rounded-2xl shadow-card p-6 md:p-8 card-transition hover:shadow-hover">
                        <div class="flex flex-col md:flex-row md:items-center justify-between mb-6">
                            <h2 class="text-xl font-semibold flex items-center">
                                <i class="fa fa-list-alt text-primary mr-2"></i> 会议议题内容
                            </h2>
                            
                            <button id="addTopicBtn" 
                                class="mt-3 md:mt-0 px-4 py-2 bg-secondary hover:bg-secondary/90 text-white rounded-lg card-transition flex items-center">
                                <i class="fa fa-plus mr-2"></i> 添加议题
                            </button>
                        </div>
                        
                        <div id="topicsContainer" class="space-y-8">
                            <!-- 议题模板 -->
                            <div class="topic-item bg-gray-50 p-5 rounded-xl border border-gray-100">
                                <div class="flex justify-between items-start mb-4">
                                    <label class="block text-sm font-medium text-gray-700">议题 <span class="text-red-500">*</span></label>
                                    <button type="button" class="delete-topic text-gray-400 hover:text-red-500 card-transition">
                                        <i class="fa fa-trash-o"></i>
                                    </button>
                                </div>
                                
                                <div class="space-y-5">
                                    <div>
                                        <input type="text" placeholder="请输入议题名称" required
                                            class="topic-title w-full px-4 py-2 border border-gray-300 rounded-lg input-focus card-transition">
                                    </div>
                                    
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">发言人及观点</label>
                                        <textarea placeholder="记录发言人及相关观点..." rows="3"
                                            class="topic-speaker w-full px-4 py-2 border border-gray-300 rounded-lg input-focus card-transition"></textarea>
                                    </div>
                                    
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">讨论结论</label>
                                        <textarea placeholder="记录该议题的讨论结论..." rows="2"
                                            class="topic-conclusion w-full px-4 py-2 border border-gray-300 rounded-lg input-focus card-transition"></textarea>
                                    </div>
                                    
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">待办事项</label>
                                        <textarea placeholder="记录需要跟进的事项，建议格式：[负责人] 任务内容 (截止时间)..." rows="2"
                                            class="topic-action w-full px-4 py-2 border border-gray-300 rounded-lg input-focus card-transition"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mt-6 pt-6 border-t border-gray-100">
                            <button id="generateBtn" 
                                class="w-full md:w-auto px-6 py-3 bg-primary hover:bg-primary/90 text-white font-medium rounded-lg card-transition flex items-center">
                                <i class="fa fa-magic mr-2"></i> 生成会议纪要
                            </button>
                        </div>
                    </div>
                </section>
                
                <!-- 预览和导出区域 -->
                <section class="lg:col-span-5">
                    <div class="bg-white rounded-2xl shadow-card p-6 md:p-8 card-transition sticky top-4">
                        <div class="flex flex-col md:flex-row md:items-center justify-between mb-6">
                            <h2 class="text-xl font-semibold flex items-center">
                                <i class="fa fa-eye text-primary mr-2"></i> 预览与导出
                            </h2>
                            
                            <div class="flex gap-3 mt-3 md:mt-0">
                                <button id="exportHtmlBtn" disabled 
                                    class="px-3 py-2 bg-gray-100 text-gray-600 rounded-lg card-transition flex items-center">
                                    <i class="fa fa-html5 mr-1"></i> HTML
                                </button>
                                <button id="exportMdBtn" disabled 
                                    class="px-3 py-2 bg-gray-100 text-gray-600 rounded-lg card-transition flex items-center">
                                    <i class="fa fa-markdown mr-1"></i> Markdown
                                </button>
                            </div>
                        </div>
                        
                        <div id="previewContainer" class="border border-gray-200 rounded-lg overflow-hidden">
                            <div id="emptyPreview" class="py-16 text-center">
                                <div class="inline-block p-4 bg-gray-100 rounded-full mb-4">
                                    <i class="fa fa-file-text-o text-2xl text-gray-400"></i>
                                </div>
                                <h3 class="text-lg font-medium text-gray-500 mb-2">未生成会议纪要</h3>
                                <p class="text-gray-400 text-sm max-w-xs mx-auto">
                                    填写会议信息并添加议题后，点击"生成会议纪要"按钮
                                </p>
                            </div>
                            
                            <div id="previewContent" class="hidden p-4 max-h-[600px] overflow-y-auto prose max-w-none">
                                <!-- 预览内容将动态生成 -->
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
        
        <!-- 页脚信息 -->
        <footer class="mt-16 pt-8 border-t border-gray-200 text-center text-gray-600">
            <p class="mb-3">本工具由 邓文涛(AI版) 制作</p>
            <p class="mb-3">微信：707547441</p>
            <p class="mb-6">QQ邮箱：<a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="043334333130333030354475752a676b69">[email&#160;protected]</a></p>
        </footer>
    </div>
    
    <!-- 模板定义 -->
    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script id="minutesTemplate" type="text/x-handlebars-template">
        <div class="mb-8">
            <h1 class="text-2xl font-bold mb-4">{{meetingTitle}}</h1>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-sm text-gray-600">
                {{#if meetingDate}}
                <div><span class="font-medium">日期：</span>{{formatDate meetingDate}}</div>
                {{/if}}
                {{#if meetingTime}}
                <div><span class="font-medium">时间：</span>{{meetingTime}}</div>
                {{/if}}
                {{#if meetingLocation}}
                <div><span class="font-medium">地点：</span>{{meetingLocation}}</div>
                {{/if}}
                {{#if meetingRecorder}}
                <div><span class="font-medium">记录人：</span>{{meetingRecorder}}</div>
                {{/if}}
                {{#if meetingAttendees}}
                <div class="md:col-span-2"><span class="font-medium">参会人员：</span>{{meetingAttendees}}</div>
                {{/if}}
            </div>
        </div>
        
        <div class="mb-6">
            <h2 class="text-xl font-bold mb-4 border-b pb-2">会议议题及内容</h2>
            
            {{#each topics}}
            <div class="mb-6">
                <h3 class="text-lg font-semibold mb-3 text-primary">{{@index ../topics}}. {{title}}</h3>
                
                {{#if speaker}}
                <div class="mb-4">
                    <h4 class="font-medium text-gray-700 mb-2">发言人及观点：</h4>
                    <div class="pl-4 text-gray-800 whitespace-pre-line">{{speaker}}</div>
                </div>
                {{/if}}
                
                {{#if conclusion}}
                <div class="mb-4">
                    <h4 class="font-medium text-gray-700 mb-2">讨论结论：</h4>
                    <div class="pl-4 text-gray-800 whitespace-pre-line">{{conclusion}}</div>
                </div>
                {{/if}}
                
                {{#if action}}
                <div>
                    <h4 class="font-medium text-gray-700 mb-2">待办事项：</h4>
                    <div class="pl-4 text-gray-800 whitespace-pre-line">{{action}}</div>
                </div>
                {{/if}}
            </div>
            {{/each}}
        </div>
        
        <div class="text-right text-sm text-gray-500 mt-8">
            <p>生成时间：{{currentDateTime}}</p>
        </div>
    </script>
    
    <!-- 提示弹窗 -->
    <div id="toast" class="fixed bottom-6 right-6 transform translate-y-20 opacity-0 transition-all duration-300 flex items-center px-4 py-3 rounded-lg shadow-lg z-50 max-w-xs">
        <i class="fa fa-check-circle mr-2"></i>
        <span id="toastMessage"></span>
    </div>

    <script>
        // 初始化Handlebars helper
        Handlebars.registerHelper('formatDate', function(dateString) {
            const date = new Date(dateString);
            return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
        });
        
        Handlebars.registerHelper('currentDateTime', function() {
            const now = new Date();
            return `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
        });
        
        // 索引从1开始
        Handlebars.registerHelper('index', function(array) {
            return array.indexOf(this) + 1;
        });
        
        // DOM元素
        const meetingTitle = document.getElementById('meetingTitle');
        const meetingDate = document.getElementById('meetingDate');
        const meetingTime = document.getElementById('meetingTime');
        const meetingLocation = document.getElementById('meetingLocation');
        const meetingAttendees = document.getElementById('meetingAttendees');
        const meetingRecorder = document.getElementById('meetingRecorder');
        const topicsContainer = document.getElementById('topicsContainer');
        const addTopicBtn = document.getElementById('addTopicBtn');
        const generateBtn = document.getElementById('generateBtn');
        const previewContainer = document.getElementById('previewContainer');
        const emptyPreview = document.getElementById('emptyPreview');
        const previewContent = document.getElementById('previewContent');
        const exportHtmlBtn = document.getElementById('exportHtmlBtn');
        const exportMdBtn = document.getElementById('exportMdBtn');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        
        // 初始化页面
        function init() {
            // 设置默认日期为今天
            const today = new Date().toISOString().split('T')[0];
            meetingDate.value = today;
            
            // 绑定添加议题按钮事件
            addTopicBtn.addEventListener('click', addNewTopic);
            
            // 绑定删除议题事件（事件委托）
            topicsContainer.addEventListener('click', function(e) {
                if (e.target.closest('.delete-topic')) {
                    const topicItem = e.target.closest('.topic-item');
                    // 确保至少保留一个议题
                    if (topicsContainer.querySelectorAll('.topic-item').length > 1) {
                        topicItem.classList.add('opacity-0');
                        setTimeout(() => {
                            topicItem.remove();
                        }, 300);
                    } else {
                        showToast('至少保留一个议题', 'error');
                    }
                }
            });
            
            // 绑定生成按钮事件
            generateBtn.addEventListener('click', generateMinutes);
            
            // 绑定导出按钮事件
            exportHtmlBtn.addEventListener('click', () => exportMinutes('html'));
            exportMdBtn.addEventListener('click', () => exportMinutes('markdown'));
        }
        
        // 添加新议题
        function addNewTopic() {
            // 创建新议题元素
            const newTopic = document.createElement('div');
            newTopic.className = 'topic-item bg-gray-50 p-5 rounded-xl border border-gray-100 opacity-0 transform translate-y-4';
            newTopic.innerHTML = `
                <div class="flex justify-between items-start mb-4">
                    <label class="block text-sm font-medium text-gray-700">议题 <span class="text-red-500">*</span></label>
                    <button type="button" class="delete-topic text-gray-400 hover:text-red-500 card-transition">
                        <i class="fa fa-trash-o"></i>
                    </button>
                </div>
                
                <div class="space-y-5">
                    <div>
                        <input type="text" placeholder="请输入议题名称" required
                            class="topic-title w-full px-4 py-2 border border-gray-300 rounded-lg input-focus card-transition">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">发言人及观点</label>
                        <textarea placeholder="记录发言人及相关观点..." rows="3"
                            class="topic-speaker w-full px-4 py-2 border border-gray-300 rounded-lg input-focus card-transition"></textarea>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">讨论结论</label>
                        <textarea placeholder="记录该议题的讨论结论..." rows="2"
                            class="topic-conclusion w-full px-4 py-2 border border-gray-300 rounded-lg input-focus card-transition"></textarea>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">待办事项</label>
                        <textarea placeholder="记录需要跟进的事项，建议格式：[负责人] 任务内容 (截止时间)..." rows="2"
                            class="topic-action w-full px-4 py-2 border border-gray-300 rounded-lg input-focus card-transition"></textarea>
                    </div>
                </div>
            `;
            
            // 添加到容器
            topicsContainer.appendChild(newTopic);
            
            // 添加入场动画
            setTimeout(() => {
                newTopic.classList.remove('opacity-0', 'translate-y-4');
                newTopic.classList.add('card-transition');
            }, 50);
            
            // 滚动到新添加的议题
            newTopic.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }
        
        // 收集表单数据
        function collectFormData() {
            // 验证必填字段
            if (!meetingTitle.value.trim()) {
                showToast('请填写会议标题', 'error');
                meetingTitle.focus();
                return null;
            }
            
            if (!meetingDate.value) {
                showToast('请选择会议日期', 'error');
                meetingDate.focus();
                return null;
            }
            
            if (!meetingAttendees.value.trim()) {
                showToast('请填写参会人员', 'error');
                meetingAttendees.focus();
                return null;
            }
            
            // 收集议题数据
            const topics = [];
            const topicItems = topicsContainer.querySelectorAll('.topic-item');
            
            for (let i = 0; i < topicItems.length; i++) {
                const title = topicItems[i].querySelector('.topic-title').value.trim();
                
                // 验证议题标题
                if (!title) {
                    showToast(`第${i + 1}个议题标题不能为空`, 'error');
                    topicItems[i].querySelector('.topic-title').focus();
                    return null;
                }
                
                topics.push({
                    title,
                    speaker: topicItems[i].querySelector('.topic-speaker').value.trim(),
                    conclusion: topicItems[i].querySelector('.topic-conclusion').value.trim(),
                    action: topicItems[i].querySelector('.topic-action').value.trim()
                });
            }
            
            // 返回完整数据
            return {
                meetingTitle: meetingTitle.value.trim(),
                meetingDate: meetingDate.value,
                meetingTime: meetingTime.value || '',
                meetingLocation: meetingLocation.value.trim() || '',
                meetingAttendees: meetingAttendees.value.trim(),
                meetingRecorder: meetingRecorder.value.trim() || '',
                topics: topics
            };
        }
        
        // 生成会议纪要
        function generateMinutes() {
            // 收集表单数据
            const formData = collectFormData();
            if (!formData) return;
            
            // 获取模板并编译
            const templateSource = document.getElementById('minutesTemplate').innerHTML;
            const template = Handlebars.compile(templateSource);
            
            // 渲染模板
            const html = template(formData);
            
            // 显示预览
            emptyPreview.classList.add('hidden');
            previewContent.classList.remove('hidden');
            previewContent.innerHTML = html;
            
            // 启用导出按钮
            exportHtmlBtn.disabled = false;
            exportMdBtn.disabled = false;
            exportHtmlBtn.className = 'px-3 py-2 bg-orange-500 hover:bg-orange-600 text-white rounded-lg card-transition flex items-center';
            exportMdBtn.className = 'px-3 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg card-transition flex items-center';
            
            // 滚动到预览区域（在移动设备上）
            if (window.innerWidth < 1024) {
                previewContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
            
            showToast('会议纪要生成成功');
        }
        
        // 导出会议纪要
        function exportMinutes(format) {
            // 收集表单数据
            const formData = collectFormData();
            if (!formData) return;
            
            let content, mimeType, extension;
            
            if (format === 'html') {
                // 生成完整的HTML
                content = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>${formData.meetingTitle}</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 0 auto; padding: 2rem; line-height: 1.6; }
        .prose h1 { margin-bottom: 1rem; color: #333; }
        .prose h2 { border-bottom: 1px solid #eaeaea; padding-bottom: 0.5rem; margin-top: 2rem; }
        .prose h3 { color: #4f46e5; margin-top: 1.5rem; }
        .meta-info { color: #666; margin-bottom: 2rem; }
        .meta-row { margin-bottom: 0.5rem; }
        .footer { margin-top: 3rem; color: #999; font-size: 0.9rem; text-align: right; }
    </style>
</head>
<body class="prose">
    ${previewContent.innerHTML}
</body>
</html>`;
                mimeType = 'text/html';
                extension = 'html';
            } else {
                // 生成Markdown
                let md = `# ${formData.meetingTitle}\n\n`;
                
                // 添加元信息
                md += `## 会议信息\n`;
                md += `- 日期：${new Date(formData.meetingDate).toLocaleDateString()}\n`;
                if (formData.meetingTime) md += `- 时间：${formData.meetingTime}\n`;
                if (formData.meetingLocation) md += `- 地点：${formData.meetingLocation}\n`;
                if (formData.meetingRecorder) md += `- 记录人：${formData.meetingRecorder}\n`;
                md += `- 参会人员：${formData.meetingAttendees}\n\n`;
                
                // 添加议题内容
                md += `## 会议议题及内容\n`;
                formData.topics.forEach((topic, index) => {
                    md += `### ${index + 1}. ${topic.title}\n`;
                    
                    if (topic.speaker) {
                        md += `#### 发言人及观点：\n${topic.speaker.replace(/\n/g, '\n> ')}\n\n`;
                    }
                    
                    if (topic.conclusion) {
                        md += `#### 讨论结论：\n${topic.conclusion}\n\n`;
                    }
                    
                    if (topic.action) {
                        md += `#### 待办事项：\n${topic.action.replace(/\n/g, '\n- ')}\n\n`;
                    }
                });
                
                // 添加生成时间
                const now = new Date();
                md += `\n---\n生成时间：${now.toLocaleString()}`;
                
                content = md;
                mimeType = 'text/markdown';
                extension = 'md';
            }
            
            // 创建下载链接
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${formData.meetingTitle.replace(/\s+/g, '_')}_会议纪要.${extension}`;
            document.body.appendChild(a);
            a.click();
            
            // 清理
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 0);
            
            showToast(`会议纪要已导出为${extension.toUpperCase()}格式`);
        }
        
        // 显示提示信息
        function showToast(message, type = 'success') {
            toastMessage.textContent = message;
            
            // 设置提示样式
            if (type === 'success') {
                toast.className = 'fixed bottom-6 right-6 transform translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-3 rounded-lg shadow-lg z-50 max-w-xs bg-green-500 text-white';
                toast.querySelector('i').className = 'fa fa-check-circle mr-2';
            } else {
                toast.className = 'fixed bottom-6 right-6 transform translate-y-0 opacity-100 transition-all duration-300 flex items-center px-4 py-3 rounded-lg shadow-lg z-50 max-w-xs bg-red-500 text-white';
                toast.querySelector('i').className = 'fa fa-exclamation-circle mr-2';
            }
            
            // 3秒后隐藏提示
            setTimeout(() => {
                toast.className = 'fixed bottom-6 right-6 transform translate-y-20 opacity-0 transition-all duration-300 flex items-center px-4 py-3 rounded-lg shadow-lg z-50 max-w-xs';
            }, 3000);
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
