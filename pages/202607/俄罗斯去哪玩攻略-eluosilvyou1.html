        // 获取DOM元素
        const generateBtn = document.getElementById('generateBtn');
        const changeBtn = document.getElementById('changeBtn');
        const resultContainer = document.getElementById('resultContainer');
        const resultTitle = document.getElementById('resultTitle');
        const resultDescription = document.getElementById('resultDescription');
        const resultAddress = document.getElementById('resultAddress');
        const resultTransport = document.getElementById('resultTransport');
        const resultTicket = document.getElementById('resultTicket');
        const resultTime = document.getElementById('resultTime');
        
        // 下载相关元素
        const downloadBtn = document.getElementById('downloadBtn');
        const modal = document.getElementById('downloadModal');
        const closeBtn = document.querySelector('.close');

        // 生成随机景点
        function generateRandomAttraction() {
            const randomIndex = Math.floor(Math.random() * attractions.length);
            return attractions[randomIndex];
        }

        // 显示景点信息
        function displayAttraction(attraction) {
            resultTitle.textContent = attraction.name;
            resultDescription.textContent = attraction.description;
            resultAddress.textContent = attraction.address;
            resultTransport.textContent = attraction.transport;
            resultTicket.textContent = attraction.ticket;
            resultTime.textContent = attraction.time;
            
            resultContainer.style.display = 'block';
            changeBtn.style.display = 'inline-block';
        }

        // 事件监听
        generateBtn.addEventListener('click', function() {
            const randomAttraction = generateRandomAttraction();
            displayAttraction(randomAttraction);
        });

        changeBtn.addEventListener('click', function() {
            const randomAttraction = generateRandomAttraction();
            displayAttraction(randomAttraction);
        });
        
        // 下载按钮事件
        downloadBtn.addEventListener('click', function() {
            modal.style.display = 'block';
        });
        
        // 关闭弹窗事件
        closeBtn.addEventListener('click', function() {
            modal.style.display = 'none';
        });
        
        // 点击弹窗外区域关闭
        window.addEventListener('click', function(event) {
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
