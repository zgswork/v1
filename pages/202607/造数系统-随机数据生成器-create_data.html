<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>造数系统 - 随机数据生成器</title>
    <!-- 使用CDN方式加载CryptoJS库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eaeaea;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .description {
            color: #7f8c8d;
            font-size: 1.1em;
        }
        
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
        }
        
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        label {
            font-weight: 600;
            color: #2c3e50;
        }
        
        input, select, button {
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }
        
        input[type="number"] {
            width: 80px;
        }
        
        button {
            background: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: 600;
        }
        
        button:hover {
            background: #2980b9;
        }
        
        .btn-download {
            background: #27ae60;
        }
        
        .btn-download:hover {
            background: #219653;
        }
        
        .table-container {
            overflow-x: auto;
            margin-top: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }
        
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eaeaea;
        }
        
        th {
            background: #34495e;
            color: white;
            font-weight: 600;
            position: sticky;
            top: 0;
        }
        
        tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        
        tr:hover {
            background-color: #ecf0f1;
        }
        
        .encrypted {
            font-family: monospace;
            font-size: 14px;
            color: #7f8c8d;
        }
        
        footer {
            text-align: center;
            margin-top: 30px;
            color: #7f8c8d;
            font-size: 0.9em;
        }
        
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .control-group {
                flex-direction: column;
                align-items: stretch;
            }
        }
        
        .status-message {
            text-align: center;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-weight: 500;
        }
        
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
        
        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .btn-loading {
            pointer-events: none;
            opacity: 0.7;
        }
        
        /* 分页样式 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            gap: 10px;
        }
        
        .pagination button {
            padding: 8px 12px;
            background: #f8f9fa;
            color: #333;
            border: 1px solid #ddd;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .pagination button:hover:not(:disabled) {
            background: #3498db;
            color: white;
            border-color: #3498db;
        }
        
        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .pagination .current-page {
            background: #3498db;
            color: white;
            border-color: #3498db;
        }
        
        .pagination-info {
            margin-top: 10px;
            text-align: center;
            color: #7f8c8d;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>造数系统 - 随机数据生成器</h1>
            <p class="description">随机生成姓名、身份证、手机号，支持MD5和SHA256加密，并可导出CSV文件</p>
        </header>
        
        <div id="status-area"></div>
        
        <div class="controls">
            <div class="control-group">
                <label for="count">生成数据条数:</label>
                <input type="number" id="count" min="1" max="1000" value="10">
            </div>
            
            <div class="control-group">
                <button id="generate-btn">生成数据</button>
                <button id="download-btn" class="btn-download">下载CSV</button>
            </div>
        </div>
        
        <div class="table-container">
            <table id="data-table">
                <thead>
                    <tr>
                        <th>序号</th>
                        <th>姓名</th>
                        <th>姓名(MD5)</th>
                        <th>姓名(SHA256)</th>
                        <th>身份证号</th>
                        <th>身份证(MD5)</th>
                        <th>身份证(SHA256)</th>
                        <th>MD5(身份证(MD5)+姓名(MD5))</th>
                        <th>手机号</th>
                        <th>手机号(MD5)</th>
                        <th>手机号(SHA256)</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- 数据将在这里动态生成 -->
                    <tr>
                        <td colspan="11" style="text-align: center; padding: 20px;">
                            点击"生成数据"按钮开始生成数据
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div id="pagination" class="pagination">
            <!-- 分页控件将在这里动态生成 -->
        </div>
        
        <div id="pagination-info" class="pagination-info">
            <!-- 分页信息将在这里动态生成 -->
        </div>
        
        <footer>
        </footer>
    </div>

    <script>
        // 显示状态消息
        function showStatus(message, type) {
            const statusArea = document.getElementById('status-area');
            statusArea.innerHTML = `<div class="status-message ${type}">${message}</div>`;
            
            // 5秒后清除消息
            setTimeout(() => {
                statusArea.innerHTML = '';
            }, 5000);
        }
        
        // 姓氏和名字数据
        const familyNames = ['王', '李', '张', '刘', '陈', '杨', '赵', '黄', '周', '吴', '徐', '孙', '胡', '朱', '高', '林', '何', '郭', '马', '罗'];
        const givenNames = ['伟', '芳', '娜', '秀英', '敏', '静', '磊', '洋', '艳', '勇', '军', '杰', '娟', '强', '霞', '鹏', '宇', '超', '婷', '明', '平', '雪', '鑫', '亮', '建', '波', '健', '帅', '伟', '兰'];
        
        // 地区码（身份证前6位）
        const areaCodes = [
            '110101', '110105', '110108', // 北京
            '310101', '310104', '310105', // 上海
            '440103', '440104', '440106', // 广州
            '440301', '440303', '440304', // 深圳
            '500101', '500102', '500103'  // 重庆
        ];
        
        // 生成随机姓名
        function generateName() {
            const familyName = familyNames[Math.floor(Math.random() * familyNames.length)];
            const givenName = givenNames[Math.floor(Math.random() * givenNames.length)];
            // 有时使用双名
            if (Math.random() > 0.5) {
                const secondGivenName = givenNames[Math.floor(Math.random() * givenNames.length)];
                return familyName + givenName + secondGivenName;
            }
            return familyName + givenName;
        }
        
        // 生成随机身份证号
        function generateID() {
            const areaCode = areaCodes[Math.floor(Math.random() * areaCodes.length)];
            const birthYear = 1950 + Math.floor(Math.random() * 50);
            const birthMonth = 1 + Math.floor(Math.random() * 12);
            const birthDay = 1 + Math.floor(Math.random() * 28);
            
            const yyyy = birthYear.toString();
            const mm = birthMonth.toString().padStart(2, '0');
            const dd = birthDay.toString().padStart(2, '0');
            
            const sequence = Math.floor(Math.random() * 1000).toString().padStart(3, '0');
            
            // 前17位
            const first17 = areaCode + yyyy + mm + dd + sequence;
            
            // 计算校验码（第18位）
            const weights = [7, 9, 10, 5, 8, 4, 2, 1, 6, 3, 7, 9, 10, 5, 8, 4, 2];
            const checkCodes = ['1', '0', 'X', '9', '8', '7', '6', '5', '4', '3', '2'];
            
            let sum = 0;
            for (let i = 0; i < 17; i++) {
                sum += parseInt(first17.charAt(i)) * weights[i];
            }
            
            const checkCode = checkCodes[sum % 11];
            
            return first17 + checkCode;
        }
        
        // 生成随机手机号
        function generatePhone() {
            const prefixes = ['130', '131', '132', '133', '134', '135', '136', '137', '138', '139',
                             '150', '151', '152', '153', '155', '156', '157', '158', '159',
                             '180', '181', '182', '183', '184', '185', '186', '187', '188', '189'];
            
            const prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
            let suffix = '';
            for (let i = 0; i < 8; i++) {
                suffix += Math.floor(Math.random() * 10);
            }
            
            return prefix + suffix;
        }
        
        // 生成数据
        function generateData(count) {
            const data = [];
            for (let i = 0; i < count; i++) {
                const name = generateName();
                const id = generateID();
                const phone = generatePhone();
                
                // 如果CryptoJS不可用，则不进行加密
                let nameMD5 = '', idMD5 = '', phoneMD5 = '';
                let nameSHA256 = '', idSHA256 = '', phoneSHA256 = '';
                let idNameMD5 = ''; // 新增字段
                
                if (typeof CryptoJS !== 'undefined') {
                    try {
                        nameMD5 = CryptoJS.MD5(name).toString();
                        idMD5 = CryptoJS.MD5(id).toString();
                        phoneMD5 = CryptoJS.MD5(phone).toString();
                        nameSHA256 = CryptoJS.SHA256(name).toString();
                        idSHA256 = CryptoJS.SHA256(id).toString();
                        phoneSHA256 = CryptoJS.SHA256(phone).toString();
                        
                        // 新增字段：身份证MD5+姓名MD5后再MD5
                        idNameMD5 = CryptoJS.MD5(idMD5 + nameMD5).toString();
                    } catch (e) {
                        console.error('加密过程中出现错误:', e);
                        nameMD5 = '加密失败';
                        idMD5 = '加密失败';
                        phoneMD5 = '加密失败';
                        nameSHA256 = '加密失败';
                        idSHA256 = '加密失败';
                        phoneSHA256 = '加密失败';
                        idNameMD5 = '加密失败'; // 新增字段
                    }
                } else {
                    nameMD5 = '库未加载';
                    idMD5 = '库未加载';
                    phoneMD5 = '库未加载';
                    nameSHA256 = '库未加载';
                    idSHA256 = '库未加载';
                    phoneSHA256 = '库未加载';
                    idNameMD5 = '库未加载'; // 新增字段
                }
                
                data.push({
                    name,
                    id,
                    phone,
                    nameMD5,
                    idMD5,
                    phoneMD5,
                    nameSHA256,
                    idSHA256,
                    phoneSHA256,
                    idNameMD5 // 新增字段
                });
            }
            return data;
        }
        
        // 分页相关变量
        let currentPage = 1;
        const itemsPerPage = 10; // 默认每页显示10条数据
        let currentData = [];
        
        // 渲染表格（带分页）
        function renderTable(data) {
            currentData = data;
            const totalPages = Math.ceil(data.length / itemsPerPage);
            
            // 如果当前页超出总页数，调整到最后一页面
            if (currentPage > totalPages && totalPages > 0) {
                currentPage = totalPages;
            }
            
            // 如果没有数据，显示提示信息
            if (data.length === 0) {
                const tableBody = document.getElementById('table-body');
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="10" style="text-align: center; padding: 20px;">
                            没有数据可显示，请生成数据
                        </td>
                    </tr>
                `;
                document.getElementById('pagination').innerHTML = '';
                document.getElementById('pagination-info').innerHTML = '';
                return;
            }
            
            // 计算当前页的数据范围
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = Math.min(startIndex + itemsPerPage, data.length);
            const pageData = data.slice(startIndex, endIndex);
            
            // 渲染表格数据
            const tableBody = document.getElementById('table-body');
            tableBody.innerHTML = '';
            
            pageData.forEach((item, index) => {
                const globalIndex = startIndex + index + 1;
                const row = document.createElement('tr');
                
                row.innerHTML = `
                    <td>${globalIndex}</td>
                    <td>${item.name}</td>
                    <td class="encrypted">${item.nameMD5}</td>
                    <td class="encrypted">${item.nameSHA256}</td>
                    <td>${item.id}</td>
                    <td class="encrypted">${item.idMD5}</td>
                    <td class="encrypted">${item.idSHA256}</td>
                    <td class="encrypted">${item.idNameMD5}</td>
                    <td>${item.phone}</td>
                    <td class="encrypted">${item.phoneMD5}</td>
                    <td class="encrypted">${item.phoneSHA256}</td>
                `;
                
                tableBody.appendChild(row);
            });
            
            // 渲染分页控件
            renderPagination(totalPages);
            
            // 渲染分页信息
            document.getElementById('pagination-info').innerHTML = 
                `显示第 ${startIndex + 1} - ${endIndex} 条，共 ${data.length} 条数据`;
        }
        
        // 渲染分页控件
        function renderPagination(totalPages) {
            const paginationContainer = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                paginationContainer.innerHTML = '';
                return;
            }
            
            let paginationHTML = '';
            
            // 上一页按钮
            paginationHTML += `
                <button id="prev-page" ${currentPage === 1 ? 'disabled' : ''}>
                    上一页
                </button>
            `;
            
            // 页码按钮（最多显示7个页码）
            let startPage = Math.max(1, currentPage - 3);
            let endPage = Math.min(totalPages, currentPage + 3);
            
            // 调整范围确保显示7个页码
            if (endPage - startPage < 6) {
                if (startPage === 1) {
                    endPage = Math.min(totalPages, startPage + 6);
                } else {
                    startPage = Math.max(1, endPage - 6);
                }
            }
            
            // 第一页
            if (startPage > 1) {
                paginationHTML += `
                    <button data-page="1" class="${1 === currentPage ? 'current-page' : ''}">
                        1
                    </button>
                `;
                if (startPage > 2) {
                    paginationHTML += `<span>...</span>`;
                }
            }
            
            // 中间页码
            for (let i = startPage; i <= endPage; i++) {
                if (i === 1 || i === totalPages) continue; // 跳过第一页和最后一页，因为已经处理过了
                
                paginationHTML += `
                    <button data-page="${i}" class="${i === currentPage ? 'current-page' : ''}">
                        ${i}
                    </button>
                `;
            }
            
            // 最后一页
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    paginationHTML += `<span>...</span>`;
                }
                paginationHTML += `
                    <button data-page="${totalPages}" class="${totalPages === currentPage ? 'current-page' : ''}">
                        ${totalPages}
                    </button>
                `;
            }
            
            // 下一页按钮
            paginationHTML += `
                <button id="next-page" ${currentPage === totalPages ? 'disabled' : ''}>
                    下一页
                </button>
            `;
            
            paginationContainer.innerHTML = paginationHTML;
            
            // 绑定分页事件
            bindPaginationEvents();
        }
        
        // 绑定分页事件
        function bindPaginationEvents() {
            // 上一页
            const prevButton = document.getElementById('prev-page');
            if (prevButton) {
                prevButton.addEventListener('click', () => {
                    if (currentPage > 1) {
                        currentPage--;
                        renderTable(currentData);
                    }
                });
            }
            
            // 下一页
            const nextButton = document.getElementById('next-page');
            if (nextButton) {
                nextButton.addEventListener('click', () => {
                    const totalPages = Math.ceil(currentData.length / itemsPerPage);
                    if (currentPage < totalPages) {
                        currentPage++;
                        renderTable(currentData);
                    }
                });
            }
            
            // 页码按钮
            const pageButtons = document.querySelectorAll('[data-page]');
            pageButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const page = parseInt(button.getAttribute('data-page'));
                    if (page !== currentPage) {
                        currentPage = page;
                        renderTable(currentData);
                    }
                });
            });
        }
        
        // 下载CSV文件
        function downloadCSV(data) {
            if (!data || data.length === 0) {
                showStatus('请先生成数据再下载', 'error');
                return;
            }
            
            try {
                let csvContent = "序号,姓名,姓名(MD5),姓名(SHA256),身份证号,身份证(MD5),身份证(SHA256),MD5(身份证(MD5)+姓名(MD5)),手机号,手机号(MD5),手机号(SHA256)\n";
                
                data.forEach((item, index) => {
                    const row = [
                        index + 1,
                        item.name,
                        item.nameMD5,
                        item.nameSHA256,
                        item.id,
                        item.idMD5,
                        item.idSHA256,
                        item.idNameMD5,
                        item.phone,
                        item.phoneMD5,
                        item.phoneSHA256
                    ].map(field => `"${field}"`).join(',');
                    
                    csvContent += row + '\n';
                });
                
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', 'generated_data.csv');
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                showStatus('CSV文件下载成功！', 'success');
            } catch (error) {
                showStatus('下载失败：' + error.message, 'error');
            }
        }
        
        // 设置按钮加载状态
        function setButtonLoading(button, loading) {
            if (loading) {
                button.classList.add('btn-loading');
                button.innerHTML = '<span class="loading"></span>' + button.innerHTML;
            } else {
                button.classList.remove('btn-loading');
                // 移除加载动画
                if (button.querySelector('.loading')) {
                    button.innerHTML = button.innerHTML.replace(/<span class="loading"><\/span>/, '');
                }
            }
        }
        
        // 初始化函数
        function initApp() {
            // 检查CryptoJS是否加载
            if (typeof CryptoJS === 'undefined') {
                showStatus('警告：加密库未加载，将不进行数据加密处理', 'error');
            } else {
                showStatus('系统已就绪，可以生成数据了', 'success');
            }
            
            // 生成初始数据
            try {
                const initialData = generateData(5);
                renderTable(initialData);
                window.generatedData = initialData;
            } catch (error) {
                showStatus('初始化失败：' + error.message, 'error');
            }
            
            // 事件监听
            document.getElementById('generate-btn').addEventListener('click', function() {
                const generateBtn = this;
                setButtonLoading(generateBtn, true);
                
                // 使用setTimeout确保UI更新
                setTimeout(() => {
                    const countInput = document.getElementById('count');
                    const count = parseInt(countInput.value) || 10;
                    
                    if (count < 1 || count > 1000) {
                        showStatus('请输入1到1000之间的数字', 'error');
                        countInput.value = 10;
                        setButtonLoading(generateBtn, false);
                        return;
                    }
                    
                    try {
                        const data = generateData(count);
                        // 重置到第一页
                        currentPage = 1;
                        renderTable(data);
                        window.generatedData = data;
                        showStatus(`成功生成 ${count} 条数据`, 'success');
                    } catch (error) {
                        showStatus('生成数据失败：' + error.message, 'error');
                    } finally {
                        setButtonLoading(generateBtn, false);
                    }
                }, 10);
            });
            
            document.getElementById('download-btn').addEventListener('click', function() {
                const downloadBtn = this;
                setButtonLoading(downloadBtn, true);
                
                // 使用setTimeout确保UI更新
                setTimeout(() => {
                    downloadCSV(window.generatedData);
                    setButtonLoading(downloadBtn, false);
                }, 10);
            });
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
