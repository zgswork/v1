        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background: linear-gradient(135deg, #a8c0ff, #3f2b96);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        
        .container {
            width: 100%;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            padding: 25px;
            margin-top: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            background: linear-gradient(90deg, #FF5252, #FF4081, #E040FB, #7C4DFF, #536DFE, #448AFF, #40C4FF, #18FFFF, #64FFDA, #69F0AE, #B2FF59, #EEFF41, #FFFF00, #FFD740, #FFAB40, #FF6E40);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow 8s linear infinite;
        }
        
        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
        
        .description {
            color: #3f2b96;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        
        .settings {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .time-setting {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #e6eeff;
            padding: 10px 20px;
            border-radius: 50px;
        }
        
        .time-setting input {
            width: 60px;
            padding: 8px;
            border: 2px solid #3f2b96;
            border-radius: 10px;
            text-align: center;
            font-size: 1.1rem;
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            background: #e6eeff;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            font-weight: bold;
            flex-wrap: wrap;
        }
        
        .stats div {
            text-align: center;
            padding: 5px 10px;
        }
        
        .stats span {
            color: #3f2b96;
            font-size: 1.3rem;
        }
        
        .timer-container {
            text-align: center;
            margin-bottom: 20px;
        }
        
        #timer {
            font-size: 3rem;
            font-weight: bold;
            color: #ff5722;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .game-board {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .word-item {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            min-height: 80px;
            text-align: center;
            /* 确保文字在任何背景下都清晰可见 */
            color: #000 !important;
            text-shadow: 0 0 2px white, 0 0 2px white, 0 0 2px white;
            -webkit-text-stroke: 0.3px white;
        }
        
        .english {
            border: 3px solid #fff;
        }
        
        .chinese {
            border: 3px solid #fff;
            color: #000 !important;
        }
        
        .word-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        
        .word-item.selected {
            box-shadow: 0 0 15px 5px rgba(255, 255, 255, 0.8);
            transform: scale(1.05);
        }
        
        @keyframes disappear {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }
        
        .word-item.matched {
            animation: disappear 0.5s forwards;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            background: #3f2b96;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        button:hover {
            background: #5a43b3;
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.25);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .completed {
            text-align: center;
            margin-top: 30px;
            display: none;
            background: #e8f5e9;
            padding: 25px;
            border-radius: 15px;
            border: 3px solid #4caf50;
        }
        
        .completed h2 {
            color: #3f2b96;
            margin-bottom: 20px;
        }
        
        .completed-stats {
            font-size: 1.3rem;
            margin-bottom: 20px;
        }
        
        .celebrate {
            font-size: 3rem;
            margin-bottom: 15px;
            animation: pulse 1s infinite;
        }
        
        .game-paused {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            display: none;
        }
        
        .pause-message {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        }
        
        .pause-message h2 {
            color: #3f2b96;
            margin-bottom: 20px;
            font-size: 2rem;
        }
        
        .continue-btn {
            margin-top: 20px;
            padding: 12px 25px;
        }
        
        .credits {
            text-align: center;
            margin-top: 20px;
            color: white;
            font-size: 1rem;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
        
        .credits a {
            color: #ffeb3b;
            text-decoration: none;
        }
        
        .credits a:hover {
            text-decoration: underline;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .game-board {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .stats {
                flex-direction: column;
                gap: 10px;
            }
            
            button {
                padding: 12px 25px;
                font-size: 1.1rem;
            }
            
            #timer {
                font-size: 2.5rem;
            }
        }
        
        @media (max-width: 480px) {
            .game-board {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            }
            
            .word-item {
                padding: 12px;
                font-size: 1.1rem;
                min-height: 70px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            button {
                padding: 10px 20px;
                font-size: 1rem;
            }
            
            #timer {
                font-size: 2rem;
            }
            
            .settings {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>

            <button id="reset-btn"><i class="fas fa-redo"></i> 重新开始</button>

                matchedElement.textContent = '0';
                accuracyElement.textContent = '0%';
                scoreElement.textContent = '0';
                timerElement.textContent = timeLeft;
                timerElement.style.color = '#ff5722';
                completedElement.style.display = 'none';
                gamePausedElement.style.display = 'none';
                
                // 随机选择10组单词
                currentWordSet = getRandomWordPairs(10);
                
                // 创建单词元素
                const allWords = [];
                
                currentWordSet.forEach(pair => {
                    allWords.push({
                        type: 'english',
                        content: pair.english,
                        pair: pair.chinese
                    });
                    
                    allWords.push({
                        type: 'chinese',
                        content: pair.chinese,
                        pair: pair.english
                    });
                });
                
                // 洗牌算法
                for (let i = allWords.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [allWords[i], allWords[j]] = [allWords[j], allWords[i]];
                }
                
                // 创建单词元素
                allWords.forEach((word, index) => {
                    const wordElement = document.createElement('div');
                    wordElement.className = `word-item ${word.type}`;
                    wordElement.textContent = word.content;
                    
                    // 为每个卡片分配不同的颜色
                    const colorIndex = index % cardColors.length;
                    wordElement.style.backgroundColor = cardColors[colorIndex];
                    
                    wordElement.addEventListener('click', () => selectWord(wordElement, word));
                    gameBoard.appendChild(wordElement);
                    
                    words.push({
                        element: wordElement,
                        content: word.content,
                        type: word.type,
                        pair: word.pair,
                        selected: false,
                        matched: false
                    });
                });
                
                gameActive = false;
                gamePaused = false;
                startButton.disabled = false;
                pauseButton.disabled = true;
                pauseButton.innerHTML = '<i class="fas fa-pause"></i> 暂停游戏';
            }
            
            // 从200个单词中随机选择指定数量的单词对
            function getRandomWordPairs(count) {
                const shuffled = [...wordPairs].sort(() => 0.5 - Math.random());
                return shuffled.slice(0, count);
            }
            
            // 开始游戏
            function startGame() {
                if (gameActive) return;
                
                gameActive = true;
                gamePaused = false;
                startButton.disabled = true;
                pauseButton.disabled = false;
                timeLeft = parseInt(gameTimeInput.value) || 30;
                timerElement.textContent = timeLeft;
                
                timerInterval = setInterval(() => {
                    if (!gamePaused) {
                        timeLeft--;
                        timerElement.textContent = timeLeft;
                        
                        // 颜色变化提示
                        if (timeLeft <= 10) {
                            timerElement.style.color = '#f44336';
                        } else if (timeLeft <= 20) {
                            timerElement.style.color = '#ff9800';
                        }
                        
                        if (timeLeft <= 0) {
                            clearInterval(timerInterval);
                            gameActive = false;
                            alert('时间到！游戏结束');
                        }
                    }
                }, 1000);
            }
            
            // 暂停/继续游戏
            function togglePause() {
                if (!gameActive) return;
                
                gamePaused = !gamePaused;
                
                if (gamePaused) {
                    gamePausedElement.style.display = 'flex';
                    pauseButton.innerHTML = '<i class="fas fa-play"></i> 继续游戏';
                } else {
                    gamePausedElement.style.display = 'none';
                    pauseButton.innerHTML = '<i class="fas fa-pause"></i> 暂停游戏';
                }
            }
            
            // 选择单词
            function selectWord(wordElement, word) {
                if (!gameActive || gamePaused) {
                    if (!gameActive) {
                        alert('请先点击"开始游戏"按钮！');
                    }
                    return;
                }
                
                const wordData = words.find(w => w.element === wordElement);
                
                if (wordData.selected || wordData.matched || selectedWords.length >= 2) {
                    return;
                }
                
                wordData.selected = true;
                wordElement.classList.add('selected');
                selectedWords.push(wordData);
                
                if (selectedWords.length === 2) {
                    totalAttempts++;
                    checkForMatch();
                }
            }
            
            // 检查匹配
            function checkForMatch() {
                const [word1, word2] = selectedWords;
                
                if ((word1.type === 'english' && word2.type === 'chinese' && word1.pair === word2.content) ||
                    (word1.type === 'chinese' && word2.type === 'english' && word1.pair === word2.content)) {
                    // 匹配成功
                    word1.matched = true;
                    word2.matched = true;
                    
                    word1.element.classList.add('matched');
                    word2.element.classList.add('matched');
                    
                    matchedPairs++;
                    correctAttempts++;
                    
                    // 每次匹配成功得10分
                    score += 10;
                    scoreElement.textContent = score;
                    
                    matchSound.play();
                    
                    matchedElement.textContent = matchedPairs;
                    updateAccuracy();
                    
                    selectedWords = [];
                    
                    if (matchedPairs === currentWordSet.length) {
                        setTimeout(gameComplete, 500);
                    }
                } else {
                    // 匹配失败
                    setTimeout(() => {
                        word1.selected = false;
                        word2.selected = false;
                        
                        word1.element.classList.remove('selected');
                        word2.element.classList.remove('selected');
                        
                        selectedWords = [];
                    }, 800);
                    
                    updateAccuracy();
                }
            }
            
            // 更新正确率
            function updateAccuracy() {
                const accuracy = totalAttempts > 0 ? Math.round((correctAttempts / totalAttempts) * 100) : 0;
                accuracyElement.textContent = `${accuracy}%`;
            }
            
            // 游戏完成
            function gameComplete() {
                clearInterval(timerInterval);
                gameActive = false;
                completeSound.play();
                
                const accuracy = totalAttempts > 0 ? Math.round((correctAttempts / totalAttempts) * 100) : 0;
                
                finalScoreElement.textContent = score;
                finalAccuracyElement.textContent = `${accuracy}%`;
                
                completedElement.style.display = 'block';
            }
            
            // 事件监听
            startButton.addEventListener('click', startGame);
            pauseButton.addEventListener('click', togglePause);
            continueButton.addEventListener('click', togglePause);
            resetButton.addEventListener('click', initGame);
            playAgainButton.addEventListener('click', initGame);
            
            // 初始化游戏
            initGame();
        });
    </script>
</body>
</html>
