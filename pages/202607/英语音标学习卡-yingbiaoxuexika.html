<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英语音标学习卡</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .card-container {
            width: 100%;
            max-width: 600px;
            perspective: 1000px;
        }
        .card {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            padding: 30px;
            text-align: center;
            transform-style: preserve-3d;
            transition: transform 0.5s;
            margin-bottom: 20px;
        }
        .phonetic {
            font-size: 80px;
            margin: 20px 0;
            color: #2c3e50;
        }
        .pronunciation {
            font-size: 24px;
            color: #7f8c8d;
            margin-bottom: 20px;
        }
        .word {
            font-size: 36px;
            font-weight: bold;
            color: #3498db;
            margin: 10px 0;
        }
        .translation {
            font-size: 20px;
            color: #2c3e50;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
            margin-top: 20px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        .progress {
            margin-top: 20px;
            font-size: 16px;
            color: #7f8c8d;
        }
        .audio-icon {
            font-size: 24px;
            cursor: pointer;
            margin-left: 10px;
            color: #3498db;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>英语音标学习卡</h1>
    </div>
    
    <div class="card-container">
        <div class="card">
            <div class="phonetic" id="phonetic">/iː/</div>
            <div class="pronunciation">发音类似汉字"衣"的延长音</div>
            <div class="word">sheep <span class="audio-icon" onclick="playAudio('sheep')">🔊</span></div>
            <div class="translation">绵羊</div>
        </div>
    </div>
    
    <div class="controls">
        <button id="prevBtn" disabled>上一张</button>
        <button id="nextBtn">下一张</button>
    </div>
    
    <div class="progress" id="progress">1 / 48</div>

    <script>
        // 音标卡片数据
        const cards = [
            { phonetic: "/iː/", pronunciation: "发音类似汉字'衣'的延长音", word: "sheep", translation: "绵羊" },
            { phonetic: "/ɪ/", pronunciation: "发音类似汉字'衣'的短音", word: "sit", translation: "坐" },
            { phonetic: "/e/", pronunciation: "发音类似汉字'诶'", word: "bed", translation: "床" },
            { phonetic: "/æ/", pronunciation: "发音类似汉字'啊'和'诶'之间", word: "cat", translation: "猫" },
            { phonetic: "/ɑː/", pronunciation: "发音类似汉字'啊'的延长音", word: "car", translation: "汽车" },
            { phonetic: "/ɒ/", pronunciation: "发音类似汉字'哦'的短音", word: "hot", translation: "热的" },
            { phonetic: "/ɔː/", pronunciation: "发音类似汉字'哦'的延长音", word: "door", translation: "门" },
            { phonetic: "/ʊ/", pronunciation: "发音类似汉字'乌'的短音", word: "book", translation: "书" },
            { phonetic: "/uː/", pronunciation: "发音类似汉字'乌'的延长音", word: "moon", translation: "月亮" },
            { phonetic: "/ʌ/", pronunciation: "发音类似汉字'啊'的短音", word: "cup", translation: "杯子" },
            { phonetic: "/ɜː/", pronunciation: "发音类似汉字'额'的延长音", word: "bird", translation: "鸟" },
            { phonetic: "/ə/", pronunciation: "发音类似汉字'呃'的轻音", word: "about", translation: "关于" },
            { phonetic: "/eɪ/", pronunciation: "从/e/滑向/ɪ/", word: "day", translation: "天" },
            { phonetic: "/aɪ/", pronunciation: "从/a/滑向/ɪ/", word: "time", translation: "时间" },
            { phonetic: "/ɔɪ/", pronunciation: "从/ɔ/滑向/ɪ/", word: "boy", translation: "男孩" },
            { phonetic: "/əʊ/", pronunciation: "从/ə/滑向/ʊ/", word: "go", translation: "去" },
            { phonetic: "/aʊ/", pronunciation: "从/a/滑向/ʊ/", word: "now", translation: "现在" },
            { phonetic: "/ɪə/", pronunciation: "从/ɪ/滑向/ə/", word: "ear", translation: "耳朵" },
            { phonetic: "/eə/", pronunciation: "从/e/滑向/ə/", word: "air", translation: "空气" },
            { phonetic: "/ʊə/", pronunciation: "从/ʊ/滑向/ə/", word: "tour", translation: "旅行" },
            { phonetic: "/p/", pronunciation: "清辅音，类似汉字'泼'的声母", word: "pen", translation: "钢笔" },
            { phonetic: "/b/", pronunciation: "浊辅音，类似汉字'波'的声母", word: "bag", translation: "包" },
            { phonetic: "/t/", pronunciation: "清辅音，类似汉字'特'的声母", word: "tea", translation: "茶" },
            { phonetic: "/d/", pronunciation: "浊辅音，类似汉字'的'的声母", word: "dog", translation: "狗" },
            { phonetic: "/k/", pronunciation: "清辅音，类似汉字'科'的声母", word: "cat", translation: "猫" },
            { phonetic: "/g/", pronunciation: "浊辅音，类似汉字'哥'的声母", word: "go", translation: "去" },
            { phonetic: "/f/", pronunciation: "清辅音，类似汉字'佛'的声母", word: "fish", translation: "鱼" },
            { phonetic: "/v/", pronunciation: "浊辅音，类似'v'的发音", word: "voice", translation: "声音" },
            { phonetic: "/θ/", pronunciation: "清辅音，咬舌音", word: "think", translation: "思考" },
            { phonetic: "/ð/", pronunciation: "浊辅音，咬舌音", word: "this", translation: "这个" },
            { phonetic: "/s/", pronunciation: "清辅音，类似汉字'思'的声母", word: "sun", translation: "太阳" },
            { phonetic: "/z/", pronunciation: "浊辅音，类似汉字'资'的声母", word: "zoo", translation: "动物园" },
            { phonetic: "/ʃ/", pronunciation: "清辅音，类似汉字'诗'的声母", word: "she", translation: "她" },
            { phonetic: "/ʒ/", pronunciation: "浊辅音，类似'日'的声母", word: "pleasure", translation: "愉快" },
            { phonetic: "/h/", pronunciation: "清辅音，类似汉字'喝'的声母", word: "hat", translation: "帽子" },
            { phonetic: "/tʃ/", pronunciation: "清辅音，类似汉字'吃'的声母", word: "chair", translation: "椅子" },
            { phonetic: "/dʒ/", pronunciation: "浊辅音，类似汉字'之'的声母", word: "jump", translation: "跳" },
            { phonetic: "/m/", pronunciation: "鼻音，类似汉字'摸'的声母", word: "man", translation: "男人" },
            { phonetic: "/n/", pronunciation: "鼻音，类似汉字'呢'的声母", word: "no", translation: "不" },
            { phonetic: "/ŋ/", pronunciation: "鼻音，类似汉字'嗯'的后鼻音", word: "sing", translation: "唱歌" },
            { phonetic: "/l/", pronunciation: "边音，类似汉字'了'的声母", word: "leg", translation: "腿" },
            { phonetic: "/r/", pronunciation: "卷舌音，类似汉字'日'的声母", word: "red", translation: "红色" },
            { phonetic: "/j/", pronunciation: "类似汉字'衣'的声母", word: "yes", translation: "是的" },
            { phonetic: "/w/", pronunciation: "类似汉字'乌'的声母", word: "we", translation: "我们" },
            { phonetic: "/tr/", pronunciation: "类似'戳'的发音", word: "tree", translation: "树" },
            { phonetic: "/dr/", pronunciation: "类似'捉'的发音", word: "dream", translation: "梦想" },
            { phonetic: "/ts/", pronunciation: "类似汉字'次'的声母", word: "cats", translation: "猫(复数)" },
            { phonetic: "/dz/", pronunciation: "类似汉字'资'的浊音", word: "beds", translation: "床(复数)" }
        ];

        // 音频数据 (实际使用时需要替换为真实音频URL)
        const audioUrls = {
            'sheep': 'https://example.com/audio/sheep.mp3',
            'sit': 'https://example.com/audio/sit.mp3',
            // 其他单词的音频URL...
        };

        let currentCardIndex = 0;

        // 更新卡片内容
        function updateCard() {
            const card = cards[currentCardIndex];
            document.getElementById('phonetic').textContent = card.phonetic;
            document.querySelector('.pronunciation').textContent = card.pronunciation;
            document.querySelector('.word').innerHTML = `${card.word} <span class="audio-icon" onclick="playAudio('${card.word}')">🔊</span>`;
            document.querySelector('.translation').textContent = card.translation;
            document.getElementById('progress').textContent = `${currentCardIndex + 1} / ${cards.length}`;
            
            // 更新按钮状态
            document.getElementById('prevBtn').disabled = currentCardIndex === 0;
            document.getElementById('nextBtn').disabled = currentCardIndex === cards.length - 1;
        }

        // 播放音频
        function playAudio(word) {
            // 实际应用中这里应该播放对应单词的音频
            console.log(`播放 ${word} 的发音`);
            // const audio = new Audio(audioUrls[word]);
            // audio.play();
            alert(`播放 ${word} 的发音 (实际应用中这里会播放真实音频)`);
        }

        // 上一张卡片
        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentCardIndex > 0) {
                currentCardIndex--;
                updateCard();
            }
        });

        // 下一张卡片
        document.getElementById('nextBtn').addEventListener('click', () => {
            if (currentCardIndex < cards.length - 1) {
                currentCardIndex++;
                updateCard();
            }
        });

        // 初始化
        updateCard();
    </script>
</body>
</html>
