<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康提醒工具 - 保护眼睛·久坐提醒</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #e8f5e8;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 
                20px 20px 60px #bebebe,
                -20px -20px 60px #ffffff;
            max-width: 500px;
            width: 100%;
        }

        .title {
            text-align: center;
            color: #2d5a2d;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .timer-section {
            margin-bottom: 30px;
        }

        .timer-title {
            color: #2d5a2d;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .timer-title::before {
            content: '🌿';
            margin-right: 10px;
            font-size: 20px;
        }

        .timer-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .time-input {
            width: 60px;
            padding: 10px;
            border: none;
            border-radius: 15px;
            background: #e8f5e8;
            box-shadow: 
                inset 8px 8px 16px #c7e2c7,
                inset -8px -8px 16px #ffffff;
            text-align: center;
            font-size: 16px;
            color: #2d5a2d;
            font-weight: bold;
        }

        .time-input:focus {
            outline: none;
            box-shadow: 
                inset 8px 8px 16px #c7e2c7,
                inset -8px -8px 16px #ffffff,
                0 0 0 3px rgba(45, 90, 45, 0.2);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #2d5a2d;
            background: #e8f5e8;
            box-shadow: 
                8px 8px 16px #c7e2c7,
                -8px -8px 16px #ffffff;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 
                10px 10px 20px #c7e2c7,
                -10px -10px 20px #ffffff;
        }

        .btn:active {
            transform: translateY(0);
            box-shadow: 
                inset 8px 8px 16px #c7e2c7,
                inset -8px -8px 16px #ffffff;
        }

        .btn.active {
            background: #4CAF50;
            color: white;
            box-shadow: 
                inset 8px 8px 16px #45a049,
                inset -8px -8px 16px #5cbf60;
        }

        .status {
            text-align: center;
            margin-top: 15px;
            padding: 15px;
            border-radius: 15px;
            background: #e8f5e8;
            box-shadow: 
                inset 8px 8px 16px #c7e2c7,
                inset -8px -8px 16px #ffffff;
        }

        .status-text {
            color: #2d5a2d;
            font-size: 16px;
            font-weight: bold;
        }

        .countdown {
            color: #4CAF50;
            font-size: 24px;
            font-weight: bold;
            margin-top: 10px;
        }

        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #e8f5e8;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 
                20px 20px 60px #bebebe,
                -20px -20px 60px #ffffff;
            max-width: 400px;
            width: 90%;
            animation: slideIn 0.3s ease;
        }

        .modal-title {
            color: #2d5a2d;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .modal-message {
            color: #2d5a2d;
            font-size: 18px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .modal-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from { 
                opacity: 0;
                transform: translate(-50%, -60%);
            }
            to { 
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .pulse {
            animation: pulse 1s infinite;
        }

        .settings {
            margin-top: 30px;
            padding: 20px;
            border-radius: 20px;
            background: #e8f5e8;
            box-shadow: 
                inset 8px 8px 16px #c7e2c7,
                inset -8px -8px 16px #ffffff;
        }

        .settings-title {
            color: #2d5a2d;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            cursor: pointer;
        }

        .label {
            color: #2d5a2d;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">🌿 健康提醒工具</h1>
        
        <!-- 护眼提醒 -->
        <div class="timer-section">
            <div class="timer-title">护眼提醒</div>
            <div class="timer-controls">
                <div class="input-group">
                    <span style="color: #2d5a2d;">每</span>
                    <input type="number" class="time-input" id="eyeMinutes" value="20" min="1" max="120">
                    <span style="color: #2d5a2d;">分钟提醒一次</span>
                </div>
                <button class="btn" id="eyeBtn" onclick="toggleEyeTimer()">开始</button>
            </div>
            <div class="status">
                <div class="status-text" id="eyeStatus">护眼提醒已关闭</div>
                <div class="countdown" id="eyeCountdown"></div>
            </div>
        </div>

        <!-- 久坐提醒 -->
        <div class="timer-section">
            <div class="timer-title">久坐提醒</div>
            <div class="timer-controls">
                <div class="input-group">
                    <span style="color: #2d5a2d;">每</span>
                    <input type="number" class="time-input" id="sitMinutes" value="30" min="1" max="180">
                    <span style="color: #2d5a2d;">分钟提醒一次</span>
                </div>
                <button class="btn" id="sitBtn" onclick="toggleSitTimer()">开始</button>
            </div>
            <div class="status">
                <div class="status-text" id="sitStatus">久坐提醒已关闭</div>
                <div class="countdown" id="sitCountdown"></div>
            </div>
        </div>

        <!-- 设置 -->
        <div class="settings">
            <div class="settings-title">⚙️ 提醒设置</div>
            <div class="checkbox-group">
                <input type="checkbox" class="checkbox" id="soundEnabled" checked>
                <label class="label" for="soundEnabled">启用提醒音效</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" class="checkbox" id="autoClose" checked>
                <label class="label" for="autoClose">10秒后自动关闭提醒</label>
            </div>
        </div>
    </div>

    <!-- 弹窗模态框 -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-icon" id="modalIcon">👁️</div>
            <div class="modal-title" id="modalTitle">护眼时间到了！</div>
            <div class="modal-message" id="modalMessage">
                已经工作20分钟了，让眼睛休息一下吧！<br>
                建议：看看远处，眨眨眼睛，做做眼保健操
            </div>
            <button class="btn pulse" onclick="closeModal()">我知道了</button>
        </div>
    </div>

    <script>
        let eyeTimer = null;
        let sitTimer = null;
        let eyeCountdownTimer = null;
        let sitCountdownTimer = null;
        let eyeTimeLeft = 0;
        let sitTimeLeft = 0;
        let autoCloseTimer = null;

        // 护眼提醒功能
        function toggleEyeTimer() {
            const btn = document.getElementById('eyeBtn');
            const status = document.getElementById('eyeStatus');
            const minutes = parseInt(document.getElementById('eyeMinutes').value);

            if (eyeTimer) {
                // 停止定时器
                clearInterval(eyeTimer);
                clearInterval(eyeCountdownTimer);
                eyeTimer = null;
                eyeCountdownTimer = null;
                btn.textContent = '开始';
                btn.classList.remove('active');
                status.textContent = '护眼提醒已关闭';
                document.getElementById('eyeCountdown').textContent = '';
            } else {
                // 开始定时器
                eyeTimeLeft = minutes * 60;
                eyeTimer = setInterval(() => {
                    showReminder('eye');
                    eyeTimeLeft = minutes * 60; // 重置倒计时
                }, minutes * 60 * 1000);
                
                // 开始倒计时显示
                eyeCountdownTimer = setInterval(updateEyeCountdown, 1000);
                
                btn.textContent = '停止';
                btn.classList.add('active');
                status.textContent = `护眼提醒已开启 (每${minutes}分钟)`;
                updateEyeCountdown();
            }
        }

        // 久坐提醒功能
        function toggleSitTimer() {
            const btn = document.getElementById('sitBtn');
            const status = document.getElementById('sitStatus');
            const minutes = parseInt(document.getElementById('sitMinutes').value);

            if (sitTimer) {
                // 停止定时器
                clearInterval(sitTimer);
                clearInterval(sitCountdownTimer);
                sitTimer = null;
                sitCountdownTimer = null;
                btn.textContent = '开始';
                btn.classList.remove('active');
                status.textContent = '久坐提醒已关闭';
                document.getElementById('sitCountdown').textContent = '';
            } else {
                // 开始定时器
                sitTimeLeft = minutes * 60;
                sitTimer = setInterval(() => {
                    showReminder('sit');
                    sitTimeLeft = minutes * 60; // 重置倒计时
                }, minutes * 60 * 1000);
                
                // 开始倒计时显示
                sitCountdownTimer = setInterval(updateSitCountdown, 1000);
                
                btn.textContent = '停止';
                btn.classList.add('active');
                status.textContent = `久坐提醒已开启 (每${minutes}分钟)`;
                updateSitCountdown();
            }
        }

        // 更新护眼倒计时显示
        function updateEyeCountdown() {
            if (eyeTimeLeft > 0) {
                const minutes = Math.floor(eyeTimeLeft / 60);
                const seconds = eyeTimeLeft % 60;
                document.getElementById('eyeCountdown').textContent = 
                    `下次提醒: ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                eyeTimeLeft--;
            }
        }

        // 更新久坐倒计时显示
        function updateSitCountdown() {
            if (sitTimeLeft > 0) {
                const minutes = Math.floor(sitTimeLeft / 60);
                const seconds = sitTimeLeft % 60;
                document.getElementById('sitCountdown').textContent = 
                    `下次提醒: ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                sitTimeLeft--;
            }
        }

        // 显示提醒弹窗
        function showReminder(type) {
            const modal = document.getElementById('modal');
            const icon = document.getElementById('modalIcon');
            const title = document.getElementById('modalTitle');
            const message = document.getElementById('modalMessage');

            if (type === 'eye') {
                icon.textContent = '👁️';
                title.textContent = '护眼时间到了！';
                message.innerHTML = `已经工作${document.getElementById('eyeMinutes').value}分钟了，让眼睛休息一下吧！<br>
                    <strong>建议：</strong>看看远处，眨眨眼睛，做做眼保健操`;
            } else {
                icon.textContent = '🚶‍♂️';
                title.textContent = '该起来活动了！';
                message.innerHTML = `已经坐了${document.getElementById('sitMinutes').value}分钟了，起来走走吧！<br>
                    <strong>建议：</strong>站起来走动，做做拉伸运动，喝杯水`;
            }

            modal.style.display = 'block';
            
            // 播放提醒音效
            if (document.getElementById('soundEnabled').checked) {
                playNotificationSound();
            }

            // 自动关闭设置
            if (document.getElementById('autoClose').checked) {
                autoCloseTimer = setTimeout(() => {
                    closeModal();
                }, 10000);
            }
        }

        // 关闭弹窗
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            if (autoCloseTimer) {
                clearTimeout(autoCloseTimer);
                autoCloseTimer = null;
            }
        }

        // 播放提醒音效
        function playNotificationSound() {
            // 创建音频上下文来播放提醒音
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
            oscillator.frequency.setValueAtTime(600, audioContext.currentTime + 0.1);
            oscillator.frequency.setValueAtTime(800, audioContext.currentTime + 0.2);
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.3);
        }

        // 点击模态框外部关闭
        window.onclick = function(event) {
            const modal = document.getElementById('modal');
            if (event.target === modal) {
                closeModal();
            }
        }

        // 键盘快捷键
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeModal();
            }
        });

        // 页面加载完成后的初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('健康提醒工具已加载完成！');
        });
    </script>
</body>
</html>
