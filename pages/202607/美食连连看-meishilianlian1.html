<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>美食连连看</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5e8c9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            touch-action: manipulation;
        }
        
        h1 {
            margin-bottom: 20px;
            color: #ff7733;
            font-size: 2.5rem;
            text-align: center;
        }
        
        .game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff9e6;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #ff9966;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
        }
        
        .game-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 3px;
            padding: 10px;
            background-color: #ffcc99;
        }
        
        .tile {
            aspect-ratio: 1/1;
            background-color: #fff9e6;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        
        .tile span {
            font-size: 2rem;
        }
        
        .tile.selected {
            transform: scale(0.95);
            box-shadow: 0 0 15px #ff9966;
            background-color: #ff9966;
        }
        
        .tile.matched {
            visibility: hidden;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            width: 100%;
            max-width: 800px;
            flex-wrap: nowrap;
        }
        
        .btn {
            padding: 12px 25px;
            background-color: #ff9966;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.1rem;
            min-width: 120px;
            text-align: center;
            white-space: nowrap;
        }
        
        .btn:hover {
            background-color: #ff7733;
            transform: scale(1.05);
        }
        
        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
        }
        
        .game-over-content {
            background-color: #ff9966;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 80%;
        }
        
        .game-over h2 {
            margin-bottom: 20px;
            font-size: 2rem;
        }
        
        .game-over p {
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        
        .download-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        
        .download-content {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 90%;
            width: 500px;
            text-align: center;
        }
        
        .download-content h3 {
            margin-bottom: 20px;
            color: #ff7733;
        }
        
        .download-link {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            margin: 20px 0;
            word-break: break-all;
            font-size: 1rem;
        }
        
        .copy-btn {
            padding: 10px 20px;
            background-color: #ff9966;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
        }
        
        .copy-btn:hover {
            background-color: #ff7733;
        }
        
        .close-modal {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #666;
        }
        
        @media (max-width: 900px) {
            .game-board {
                grid-template-columns: repeat(6, 1fr);
            }
            
            .tile span {
                font-size: 1.8rem;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .game-header {
                font-size: 1rem;
            }
        }
        
        @media (max-width: 600px) {
            .game-board {
                grid-template-columns: repeat(4, 1fr);
            }
            
            .tile span {
                font-size: 1.5rem;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .btn {
                padding: 10px 20px;
                font-size: 1rem;
                min-width: 100px;
            }
        }
        
        @media (max-width: 400px) {
            .game-board {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .tile span {
                font-size: 1.3rem;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            .game-over-content {
                padding: 20px;
            }
            
            .game-over h2 {
                font-size: 1.5rem;
            }
            
            .game-over p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <h1>美食连连看</h1>
    
    <div class="game-container">
        <div class="game-header">
            <div class="timer">时间: <span id="time">00:00</span></div>
            <div class="score">分数: <span id="score">0</span></div>
        </div>
        
        <div class="game-board" id="gameBoard"></div>
        
        <div class="game-over" id="gameOver">
            <div class="game-over-content">
                <h2>游戏结束!</h2>
                <p>你的分数: <span id="finalScore">0</span></p>
                <p>用时: <span id="finalTime">00:00</span></p>
                <button class="btn" id="playAgain">再玩一次</button>
            </div>
        </div>
    </div>
    
    <div class="controls">
        <button class="btn" id="reset">重排</button>
        <button class="btn" id="replay">重玩</button>
        <button class="btn" id="downloadBtn">下载游戏</button>
    </div>
    
    <div class="download-modal" id="downloadModal">
        <div class="download-content">
            <button class="close-modal" id="closeModal">&times;</button>
            <h3>下载游戏</h3>
            <p>复制以下夸克网盘链接在浏览器打开</p>
            <div class="download-link" id="downloadLink">
                https://pan.quark.cn/s/38fec05f31f6
            </div>
            <button class="copy-btn" id="copyBtn">复制链接</button>
        </div>
    </div>
    
    <script>
        // 游戏数据
        const foodItems = [
            '🍔', '🍕', '🌭', '🍟', '🍣', '🍩', '🍦', '🍎',
            '🍉', '🍇', '🍓', '🍒', '🍑', '🍍', '🥝', '🥥',
            '🍊', '🍋', '🍌', '🍈', '🍏', '🍐', '🍅', '🥑',
            '🥦', '🥕', '🌽', '🥐', '🍞', '🥨', '🧀', '🍗'
        ];
        
        // 游戏状态
        let gameState = {
            board: [],
            selectedTile: null,
            matchedPairs: 0,
            score: 0,
            time: 0,
            timer: null,
            isPlaying: false,
            rows: 8,
            cols: 8
        };
        
        // DOM 元素
        const gameBoard = document.getElementById('gameBoard');
        const timeDisplay = document.getElementById('time');
        const scoreDisplay = document.getElementById('score');
        const finalScore = document.getElementById('finalScore');
        const finalTime = document.getElementById('finalTime');
        const gameOver = document.getElementById('gameOver');
        const resetBtn = document.getElementById('reset');
        const replayBtn = document.getElementById('replay');
        const playAgainBtn = document.getElementById('playAgain');
        const downloadBtn = document.getElementById('downloadBtn');
        const downloadModal = document.getElementById('downloadModal');
        const closeModal = document.getElementById('closeModal');
        const copyBtn = document.getElementById('copyBtn');
        const downloadLink = document.getElementById('downloadLink');
        
        // 初始化游戏
        function initGame() {
            clearInterval(gameState.timer);
            gameState = {
                board: [],
                selectedTile: null,
                matchedPairs: 0,
                score: 0,
                time: 0,
                timer: null,
                isPlaying: true,
                rows: 8,
                cols: 8
            };
            
            // 创建游戏板
            createBoard();
            
            // 更新显示
            updateDisplay();
            
            // 开始计时
            gameState.timer = setInterval(() => {
                gameState.time++;
                updateDisplay();
            }, 1000);
            
            // 隐藏游戏结束界面
            gameOver.style.display = 'none';
        }
        
        // 创建游戏板
        function createBoard() {
            gameBoard.innerHTML = '';
            gameBoard.style.gridTemplateColumns = `repeat(${gameState.cols}, 1fr)`;
            
            // 创建配对的食物数组
            const pairs = [];
            const totalPairs = (gameState.rows * gameState.cols) / 2;
            
            // 确保食物种类足够
            const availableFoods = [...foodItems];
            while (availableFoods.length < totalPairs) {
                availableFoods.push(...foodItems);
            }
            
            // 随机选择食物
            const selectedFoods = [];
            for (let i = 0; i < totalPairs; i++) {
                const randomIndex = Math.floor(Math.random() * availableFoods.length);
                selectedFoods.push(availableFoods[randomIndex]);
                availableFoods.splice(randomIndex, 1);
            }
            
            // 创建配对
            for (let i = 0; i < totalPairs; i++) {
                pairs.push(selectedFoods[i]);
                pairs.push(selectedFoods[i]);
            }
            
            // 打乱顺序
            shuffleArray(pairs);
            
            // 创建游戏板
            gameState.board = [];
            for (let i = 0; i < gameState.rows; i++) {
                const row = [];
                for (let j = 0; j < gameState.cols; j++) {
                    const index = i * gameState.cols + j;
                    const tile = {
                        id: index,
                        value: pairs[index],
                        row: i,
                        col: j,
                        matched: false,
                        element: null
                    };
                    
                    row.push(tile);
                    
                    // 创建DOM元素
                    const tileElement = document.createElement('div');
                    tileElement.className = 'tile';
                    tileElement.dataset.id = index;
                    tileElement.innerHTML = `<span>${tile.value}</span>`;
                    
                    // 添加事件监听器
                    tileElement.addEventListener('click', () => handleTileClick(tile));
                    tileElement.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        handleTileClick(tile);
                    }, { passive: false });
                    
                    gameBoard.appendChild(tileElement);
                    tile.element = tileElement;
                }
                gameState.board.push(row);
            }
        }
        
        // 处理方块点击
        function handleTileClick(tile) {
            if (!gameState.isPlaying || tile.matched || tile === gameState.selectedTile) return;
            
            // 如果已经有一个选中的方块
            if (gameState.selectedTile) {
                // 检查是否匹配
                if (gameState.selectedTile.value === tile.value) {
                    // 匹配成功
                    matchTiles(gameState.selectedTile, tile);
                } else {
                    // 匹配失败
                    const prevSelected = gameState.selectedTile;
                    tile.element.classList.add('selected');
                    
                    // 短暂显示后隐藏
                    setTimeout(() => {
                        prevSelected.element.classList.remove('selected');
                        tile.element.classList.remove('selected');
                    }, 500);
                }
                
                gameState.selectedTile = null;
            } else {
                // 选中第一个方块
                gameState.selectedTile = tile;
                tile.element.classList.add('selected');
            }
        }
        
        // 匹配成功的处理
        function matchTiles(tile1, tile2) {
            tile1.matched = true;
            tile2.matched = true;
            
            tile1.element.classList.add('matched');
            tile2.element.classList.add('matched');
            
            // 增加分数
            gameState.score += 10;
            gameState.matchedPairs++;
            
            // 检查游戏是否结束
            checkGameEnd();
            
            updateDisplay();
        }
        
        // 检查游戏是否结束
        function checkGameEnd() {
            const totalPairs = (gameState.rows * gameState.cols) / 2;
            if (gameState.matchedPairs === totalPairs) {
                endGame();
            }
        }
        
        // 结束游戏
        function endGame() {
            clearInterval(gameState.timer);
            gameState.isPlaying = false;
            
            finalScore.textContent = gameState.score;
            finalTime.textContent = formatTime(gameState.time);
            gameOver.style.display = 'flex';
        }
        
        // 更新显示
        function updateDisplay() {
            scoreDisplay.textContent = gameState.score;
            timeDisplay.textContent = formatTime(gameState.time);
        }
        
        // 格式化时间
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }
        
        // 打乱数组
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }
        
        // 重置游戏板（重排）
        function resetBoard() {
            if (!gameState.isPlaying) return;
            
            // 收集所有未匹配的方块
            const unmatchedTiles = [];
            for (let i = 0; i < gameState.rows; i++) {
                for (let j = 0; j < gameState.cols; j++) {
                    const tile = gameState.board[i][j];
                    if (!tile.matched) {
                        unmatchedTiles.push(tile);
                    }
                }
            }
            
            // 收集所有未匹配的值
            const values = unmatchedTiles.map(tile => tile.value);
            
            // 打乱顺序
            shuffleArray(values);
            
            // 重新分配值
            for (let i = 0; i < unmatchedTiles.length; i++) {
                const tile = unmatchedTiles[i];
                tile.value = values[i];
                tile.element.innerHTML = `<span>${tile.value}</span>`;
                
                // 取消选中状态
                tile.element.classList.remove('selected');
            }
            
            // 取消当前选中的方块
            if (gameState.selectedTile) {
                gameState.selectedTile.element.classList.remove('selected');
                gameState.selectedTile = null;
            }
            
            // 扣分
            gameState.score = Math.max(0, gameState.score - 5);
            updateDisplay();
        }
        
        // 复制链接功能
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('链接已复制到剪贴板！');
            }).catch(err => {
                console.error('复制失败:', err);
                // 备用复制方法
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('链接已复制到剪贴板！');
            });
        }
        
        // 事件监听器
        resetBtn.addEventListener('click', resetBoard);
        replayBtn.addEventListener('click', initGame);
        playAgainBtn.addEventListener('click', initGame);
        
        // 下载按钮事件
        downloadBtn.addEventListener('click', () => {
            downloadModal.style.display = 'flex';
        });
        
        // 关闭弹窗事件
        closeModal.addEventListener('click', () => {
            downloadModal.style.display = 'none';
        });
        
        // 复制链接事件
        copyBtn.addEventListener('click', () => {
            const link = downloadLink.textContent;
            copyToClipboard(link);
        });
        
        // 点击弹窗外部关闭
        downloadModal.addEventListener('click', (e) => {
            if (e.target === downloadModal) {
                downloadModal.style.display = 'none';
            }
        });
        
        // 初始化游戏
        initGame();
    </script>
</body>
</html>
