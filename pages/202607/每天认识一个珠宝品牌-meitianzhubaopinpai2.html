        // 获取DOM元素
        const brandBtn = document.getElementById('brandBtn');
        const brandContainer = document.getElementById('brandContainer');
        const brandLogo = document.getElementById('brandLogo');
        const brandName = document.getElementById('brandName');
        const brandCountry = document.getElementById('brandCountry');
        const brandStory = document.getElementById('brandStory');
        const brandPositioning = document.getElementById('brandPositioning');
        const brandFeatures = document.getElementById('brandFeatures');
        const productSeries = document.getElementById('productSeries');

        // 当前显示的品牌索引
        let currentBrandIndex = -1;

        // 随机选择一个品牌（确保不重复）
        function getRandomBrand() {
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * brands.length);
            } while (newIndex === currentBrandIndex && brands.length > 1);
            
            currentBrandIndex = newIndex;
            return brands[currentBrandIndex];
        }

        // 显示品牌信息
        function displayBrand() {
            const brand = getRandomBrand();
            
            brandLogo.src = brand.logo;
            brandLogo.alt = `${brand.name} LOGO`;
            brandName.textContent = brand.name;
            brandCountry.textContent = brand.country;
            brandStory.textContent = brand.story;
            brandPositioning.textContent = brand.positioning;
            brandFeatures.textContent = brand.features;
            productSeries.textContent = brand.series;
            
            brandContainer.style.display = 'block';
            brandBtn.textContent = '换一个珠宝品牌';
        }

        // 按钮点击事件
        brandBtn.addEventListener('click', displayBrand);
