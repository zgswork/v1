<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码管理工具</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        
        body {
            background-color: #e8f5e9;
            color: #2e7d32;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #1b5e20;
        }
        
        .security-notice {
            background-color: #fff3e0;
            border-left: 5px solid #ffa000;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 0 5px 5px 0;
            color: #e65100;
            font-size: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .security-notice h3 {
            margin-bottom: 10px;
            color: #e65100;
            display: flex;
            align-items: center;
        }
        
        .security-notice h3::before {
            content: "⚠️";
            margin-right: 8px;
        }
        
        .security-notice ul {
            padding-left: 20px;
        }
        
        .security-notice li {
            margin-bottom: 5px;
        }
        
        .password-form {
            background-color: #c8e6c9;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #a5d6a7;
            border-radius: 5px;
            background-color: #f1f8e9;
        }
        
        button {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #388e3c;
        }
        
        .password-list {
            background-color: #c8e6c9;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .password-item {
            background-color: #f1f8e9;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            border-left: 5px solid #4caf50;
        }
        
        .password-item h3 {
            margin-bottom: 5px;
            color: #1b5e20;
        }
        
        .password-item p {
            margin-bottom: 5px;
            word-break: break-all;
        }
        
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .actions button {
            flex: 1;
        }
        
        .copy-btn {
            background-color: #2196f3;
        }
        
        .copy-btn:hover {
            background-color: #1976d2;
        }
        
        .delete-btn {
            background-color: #f44336;
        }
        
        .delete-btn:hover {
            background-color: #d32f2f;
        }
        
        .footer {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #a5d6a7;
        }
        
        .footer-btn {
            background-color: #81c784;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        
        @media (max-width: 600px) {
            .footer {
                flex-direction: column;
                gap: 10px;
            }
            
            .footer-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>密码管理工具</h1>
        
        <div class="security-notice">
            <h3>安全提示</h3>
            <ul>
                <li>使用浏览器的localStorage保存密码数据</li>
                <li>数据仅在本地浏览器中存储，不会上传到服务器</li>
            </ul>
        </div>
        
        <div class="password-form">
            <h2>添加新密码</h2>
            <div class="form-group">
                <label for="website">网站/应用名称</label>
                <input type="text" id="website" placeholder="例如：谷歌邮箱">
            </div>
            <div class="form-group">
                <label for="username">用户名/邮箱</label>
                <input type="text" id="username" placeholder="输入用户名或邮箱">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="text" id="password" placeholder="输入密码">
            </div>
            <div class="form-group">
                <label for="category">分类</label>
                <select id="category">
                    <option value="社交">社交</option>
                    <option value="工作">工作</option>
                    <option value="个人">个人</option>
                    <option value="金融">金融</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <button id="add-btn">保存密码</button>
        </div>
        
        <div class="password-list">
            <h2>已保存的密码</h2>
            <div id="password-container">
                <!-- 密码项将在这里动态添加 -->
                <p style="text-align: center; color: #666;">暂无保存的密码</p>
            </div>
        </div>
        
        <div class="footer">
            <button class="footer-btn" id="developer-btn">开发者：兔子先生</button>
            <button class="footer-btn" id="support-btn">技术支持：AI编程星球</button>
        </div>
    </div>

    <script>
        // 密码存储
        let passwords = JSON.parse(localStorage.getItem('passwords')) || [];
        
        // DOM元素
        const websiteInput = document.getElementById('website');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const categorySelect = document.getElementById('category');
        const addBtn = document.getElementById('add-btn');
        const passwordContainer = document.getElementById('password-container');
        const developerBtn = document.getElementById('developer-btn');
        const supportBtn = document.getElementById('support-btn');
        
        // 添加密码
        addBtn.addEventListener('click', () => {
            const website = websiteInput.value.trim();
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            const category = categorySelect.value;
            
            if (website && username && password) {
                const newPassword = {
                    id: Date.now(),
                    website,
                    username,
                    password,
                    category,
                    createdAt: new Date().toLocaleString()
                };
                
                passwords.push(newPassword);
                savePasswords();
                renderPasswords();
                
                // 清空输入
                websiteInput.value = '';
                usernameInput.value = '';
                passwordInput.value = '';
            } else {
                alert('请填写所有字段！');
            }
        });
        
        // 保存密码到本地存储
        function savePasswords() {
            localStorage.setItem('passwords', JSON.stringify(passwords));
        }
        
        // 渲染密码列表
        function renderPasswords() {
            if (passwords.length === 0) {
                passwordContainer.innerHTML = '<p style="text-align: center; color: #666;">暂无保存的密码</p>';
                return;
            }
            
            passwordContainer.innerHTML = '';
            
            passwords.forEach(password => {
                const passwordEl = document.createElement('div');
                passwordEl.className = 'password-item';
                passwordEl.innerHTML = `
                    <h3>${password.website} <span style="font-size: 12px; color: #666;">(${password.category})</span></h3>
                    <p><strong>用户名:</strong> ${password.username}</p>
                    <p><strong>密码:</strong> <span class="password-text">${password.password}</span></p>
                    <p><small>创建于: ${password.createdAt}</small></p>
                    <div class="actions">
                        <button class="copy-btn" data-id="${password.id}">复制密码</button>
                        <button class="delete-btn" data-id="${password.id}">删除</button>
                    </div>
                `;
                
                passwordContainer.appendChild(passwordEl);
            });
            
            // 添加复制和删除事件
            document.querySelectorAll('.copy-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(e.target.getAttribute('data-id'));
                    const password = passwords.find(p => p.id === id);
                    if (password) {
                        navigator.clipboard.writeText(password.password)
                            .then(() => {
                                e.target.textContent = '已复制!';
                                setTimeout(() => {
                                    e.target.textContent = '复制密码';
                                }, 2000);
                            });
                    }
                });
            });
            
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(e.target.getAttribute('data-id'));
                    if (confirm('确定要删除这个密码吗？')) {
                        passwords = passwords.filter(p => p.id !== id);
                        savePasswords();
                        renderPasswords();
                    }
                });
            });
        }
        
        // 底部按钮交互
        developerBtn.addEventListener('click', () => {
            alert('合作联系vx：l932371716');
        });
        
        supportBtn.addEventListener('click', () => {
            window.open('https://t.zsxq.com/y1934', '_blank');
        });
        
        // 初始渲染
        renderPasswords();
    </script>
</body>
</html>
