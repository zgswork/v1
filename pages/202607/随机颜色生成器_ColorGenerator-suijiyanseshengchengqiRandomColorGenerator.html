<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机颜色生成器 | Color Generator</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            transition: background-color 0.5s ease;
        }
        
        .container {
            text-align: center;
            padding: 30px;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        
        .color-display {
            width: 200px;
            height: 200px;
            margin: 0 auto 20px;
            border-radius: 10px;
            border: 3px solid #333;
            transition: background-color 0.5s ease;
        }
        
        .color-info {
            margin-bottom: 20px;
            font-size: 18px;
        }
        
        .btn {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin: 5px;
        }
        
        .btn:hover {
            background-color: #45a049;
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .language-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 5px 10px;
            background-color: #2196F3;
        }
        
        .language-btn:hover {
            background-color: #0b7dda;
        }
        
        .author-info {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        
        .author-info a {
            color: #2196F3;
            text-decoration: none;
        }
        
        .author-info a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="btn language-btn" id="languageBtn">English</button>
        <h1 id="title">随机颜色生成器</h1>
        <div class="color-display" id="colorDisplay"></div>
        <div class="color-info">
            <p id="hexLabel">HEX: <span id="hexValue">#FFFFFF</span></p>
            <p id="rgbLabel">RGB: <span id="rgbValue">rgb(255, 255, 255)</span></p>
        </div>
        <button class="btn" id="generateBtn">生成随机颜色</button>
        <div class="author-info">
            <span id="authorText">作者: 文璧 | 联系邮箱: </span>
            <a href="/cdn-cgi/l/email-protection#05373332303231343c32304574742b666a68"><span class="__cf_email__" data-cfemail="2c1e1a1b191b181d151b196c5d5d024f4341">[email&#160;protected]</span></a>
        </div>
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        document.addEventListener('DOMContentLoaded', function() {
            const colorDisplay = document.getElementById('colorDisplay');
            const hexValue = document.getElementById('hexValue');
            const rgbValue = document.getElementById('rgbValue');
            const generateBtn = document.getElementById('generateBtn');
            const languageBtn = document.getElementById('languageBtn');
            const title = document.getElementById('title');
            const hexLabel = document.getElementById('hexLabel');
            const rgbLabel = document.getElementById('rgbLabel');
            const authorText = document.getElementById('authorText');
            
            // 语言设置
            let currentLang = 'zh';
            
            const translations = {
                'zh': {
                    title: '随机颜色生成器',
                    generateBtn: '生成随机颜色',
                    hexLabel: 'HEX:',
                    rgbLabel: 'RGB:',
                    author: '作者: 文璧 | 联系邮箱: ',
                    languageBtn: 'English'
                },
                'en': {
                    title: 'Color Generator',
                    generateBtn: 'Generate Random Color',
                    hexLabel: 'HEX:',
                    rgbLabel: 'RGB:',
                    author: 'Author: Wen Bi | Contact: ',
                    languageBtn: '中文'
                }
            };
            
            // 切换语言
            function toggleLanguage() {
                currentLang = currentLang === 'zh' ? 'en' : 'zh';
                updateLanguage();
            }
            
            // 更新语言显示
            function updateLanguage() {
                const lang = translations[currentLang];
                title.textContent = lang.title;
                generateBtn.textContent = lang.generateBtn;
                hexLabel.textContent = lang.hexLabel + ' ' + hexValue.textContent;
                rgbLabel.textContent = lang.rgbLabel + ' ' + rgbValue.textContent;
                authorText.textContent = lang.author;
                languageBtn.textContent = lang.languageBtn;
            }
            
            // 生成随机颜色
            function generateRandomColor() {
                // 生成RGB值
                const r = Math.floor(Math.random() * 256);
                const g = Math.floor(Math.random() * 256);
                const b = Math.floor(Math.random() * 256);
                
                // 转换为HEX
                const hex = '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
                
                return {
                    rgb: `rgb(${r}, ${g}, ${b})`,
                    hex: hex
                };
            }
            
            // 更新显示
            function updateColorDisplay() {
                const color = generateRandomColor();
                colorDisplay.style.backgroundColor = color.rgb;
                hexValue.textContent = color.hex;
                rgbValue.textContent = color.rgb;
                
                // 根据亮度调整文字颜色
                const brightness = (parseInt(color.hex.substr(1, 2), 16) * 299 +
                                    parseInt(color.hex.substr(3, 2), 16) * 587 +
                                    parseInt(color.hex.substr(5, 2), 16) * 114) / 1000;
                
                document.body.style.backgroundColor = brightness > 128 ? '#f0f0f0' : '#333';
                
                // 更新语言显示中的颜色值
                updateLanguage();
            }
            
            // 初始加载
            updateColorDisplay();
            
            // 按钮点击事件
            generateBtn.addEventListener('click', updateColorDisplay);
            languageBtn.addEventListener('click', toggleLanguage);
        });
    </script>
</body>
</html>
